sanskrit_devanagari: '(293) yesañ ca susamāraddhā niccaṃ kāyagatā sati akiccan te na sevanti kicce sātaccakārino,
  satānaṃ sampajānānaṃ atthaṃ gacchanti āsavā.

  (294) mātaraṃ pitaraṃ hantvā rājāno dve ca khattiye raṭṭhaṃ sānucaraṃ hantvā anīgho yāti brāhmaṇo.

  (295) mātaraṃ pitaraṃ hantvā rājāno dve ca sotthiye veyyagghapañcamaṃ hantvā anīgho yāti brāhmaṇo.

  (296) suppabuddhaṃ pabujjhanti sadā Gotamasāvakā yesaṃ divā ca ratto ca niccaṃ Buddha-gatā sati.'
translation_literal: '293. In those whose mindfulness directed to the body is well undertaken and constant,
  who do not pursue what should not be done, who persevere in what should be done—for the mindful and
  clearly comprehending ones, the taints come to an end.


  294. Having slain mother and father, two kshatriya kings, and a kingdom with its treasurer, the brahmin
  goes untroubled.


  295. Having slain mother and father, two brahmin kings, and the perilous path as the fifth, the brahmin
  goes untroubled.


  296. Well-awakened do they awaken, the disciples of Gotama, for whom mindfulness directed to the Buddha
  is constant, day and night.'
commentary: 'Verse 293 begins with a discipline that is both plain and demanding: “kāyagatā sati,” mindfulness
  gone into or established in the body. This is not mere awareness of bodily sensation; it is sustained
  recollection that makes discernment possible. Those who are “satānaṃ sampajānānaṃ,” mindful and fully
  comprehending, cease to feed what is “akicca,” what ought not be done, and steadily enact what is “kicca,”
  what needs doing. The result is the wearing away of the “āsavā,” the deep currents of intoxication,
  compulsive attachment, and ignorance.


  Verses 294–295 deliberately use appalling imagery. Their “slaying” cannot coherently be an instruction
  in literal violence: the liberated “brāhmaṇo” is “anīgho,” free from affliction and distress. The ancient
  interpretive tradition reads the royal household, realm, and tiger as figures for inner tyrannies—craving,
  conceit, destructive views, sense-entanglement, and obstructing mental forces. The verses make a severe
  point: freedom may require a decisive ending of even the most intimate habits of identification. Verse
  296 turns from conquest to its positive center. Gotama’s disciples are “suppabuddhaṃ,” thoroughly awake,
  because “Buddha-gatā sati,” their mindfulness repeatedly returns to the Buddha: to awakening as exemplar,
  possibility, and present direction.


  Key Terms


  **kāyagatā sati** — Mindfulness established in, or directed toward, the body.

  **āsavā** — Deep intoxicating outflows or underlying corruptions that sustain bondage.

  **anīgho** — Free from agitation, affliction, or inner distress.

  **Buddha-gatā sati** — Mindfulness directed toward the Buddha, recollecting awakening.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** The Gītā urges one to raise oneself rather than let oneself fall, paralleling
  the Dhammapada’s insistence that liberation requires sustained inward work. Divergence: The Gītā frames
  this work within its teaching on the enduring self and devotion to Krishna, while these verses emphasize
  mindfulness and the ending of the āsavā.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within one’s power from what is not, much
  as bodily mindfulness redirects attention from compulsive outward pursuit to disciplined response. Divergence:
  Stoic training centers on rational judgment and living according to nature, whereas this passage aims
  at release from the specifically Buddhist streams of defilement.

  **Gospel of Matthew 10:37–39:** Jesus’ startling demand that disciples place commitment above family
  attachments resembles the shocking familial language of verses 294–295. Divergence: Matthew’s saying
  concerns allegiance to Christ and the cost of discipleship; the Dhammapada’s violent family imagery
  is traditionally read as an allegory of inner defilements, not as a social command.'
practice: 'For ten minutes, sit or walk with attention anchored in the body: feel posture, breath, contact,
  and movement. Each time the mind reaches for an unhelpful pursuit, silently name it “not to be done,”
  return to bodily awareness, and choose one small beneficial action before the day ends. Close by recalling
  one quality of the Buddha—awake, clear, compassionate—and let that quality guide the next breath.'
