sanskrit_devanagari: '(284) yāvaṃ [hi] vanatho na chijjati anumatto pi narassa nārisu paṭibaddhamano va
  tāva so vaccho khīrapako va mātari.

  (285) ucchinda sineham attano kumudaṃ sāradikaṃ va pāṇinā, santimaggam eva brūhaya nibbānaṃ Sugatena
  desitaṃ.

  (286) idha vassaṃ vasissāmi idha hemantagimhisu iti bālo vicinteti antarāyaṃ na bujjhati.

  (287) taṃ puttapasusammattaṃ byāsattamanasaṃ naraṃ suttaṃ gāmaṃ mahogho va Maccu ādāya gacchati.'
translation_literal: '(284) So long as even the slightest thicket of craving is not cut away in a person’s
  attachment to women, his mind remains fastened there, like a milk-drinking calf to its mother.


  (285) Cut off your own affection, as one plucks an autumn lotus with the hand. Foster only the path
  of peace, the nibbāna taught by the Well-Gone One.


  (286) “Here I shall stay through the rains; here through winter and summer”: thus the fool makes plans,
  not understanding the interruption that may come.


  (287) Death carries off the person intoxicated with children and cattle, whose mind is clinging—just
  as a great flood sweeps away a sleeping village.'
commentary: 'The image of vanatho, a “thicket” or tangled growth, makes attachment more than a single
  desire: it is a habitat in which the mind gets caught. Verse 284 uses the calf still dependent on milk
  to show a mind paṭibaddhamano, bound fast by its object. The point is not a condemnation of persons
  as such, but a diagnosis of possessive fixation: wherever the heart insists on leaning for its life,
  it becomes unfree.


  Verse 285 answers this bondage with ucchinda, “cut off,” a deliberately strong verb. Yet what is to
  be cultivated is santimagga, the path of peace, rather than blank negation. The following verses expose
  why this work cannot indefinitely be postponed. The bāla imagines seasonal arrangements and lasting
  possession, while Maccu, Death, arrives like floodwater. The passage asks for urgency without panic:
  release clinging now, and nourish the way that does not depend upon what can be swept away.


  Key Terms


  **vanatho** — A thicket or tangle; figuratively, the dense growth of craving and attachment.

  **sinehaṃ** — Affection, attachment, or sticky emotional clinging.

  **santimaggaṃ** — The path of peace, directed toward nibbāna.

  **Maccu** — Death, personified as the force that takes beings away.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** The Gītā likewise traces suffering through attachment: dwelling on objects
  gives rise to clinging and its destructive consequences. Divergence: The Gītā frames liberation within
  disciplined action and devotion to Krishna, whereas these verses emphasize cutting craving and cultivating
  nibbāna.

  **Luke 12:16–21, Parable of the Rich Fool:** Jesus’ rich man stores goods for future years, only to
  be confronted by death that very night; both texts challenge complacent plans for security. Divergence:
  Luke’s parable directs hearers toward being rich toward God, while the Dhammapada directs attention
  to non-attachment and the path of peace.

  **Marcus Aurelius, Meditations 4.48:** Marcus urges remembrance of mortality and the instability of
  all possessions, echoing the warning against postponing inner work. Divergence: Stoic practice seeks
  virtuous accord with reason and nature, while the Dhammapada passage points toward nibbāna through the
  ending of clinging.'
practice: 'Choose one possession, relationship-role, or future plan that you habitually treat as guaranteed.
  Sit quietly for five minutes, feel where the body tightens around the thought “this must remain mine,”
  and on each exhale softly name it: “not secured.” Then identify one small act today that cultivates
  peace rather than possession—giving something away, expressing gratitude without demand, or completing
  a needed reconciliation.'
