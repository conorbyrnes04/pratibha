sanskrit_devanagari: '(349) vitakkapamathitassa jantuno tibbarāgassa subhānupassino bhiyyo taṇhā pavaḍḍhati,
  esa kho daḷhaṃ karoti bandhanaṃ.

  (350) vitakkūpasame ca yo rato asubhaṃ bhāvayatī sadāsato esa kho vyantikāhitī esa-cchecchati Mārabandhanaṃ.

  (351) niṭṭhaṅgato asantāsī vītataṇho anaṅgaṇo acchidda bhavasallāni antimo ''yaṃ samussayo.

  (352) vītataṇho anādāno niruttipadakovido akkharānaṃ sannipātaṃ jaññā pubbāparāni ca sa ve antimasārīro
  mahāpañño [mahāpuriso] ti vuccati.'
translation_literal: '349. In one harried by thoughts, fiercely passionate, and intent on what seems beautiful,
  craving grows ever more. Such a person makes the bondage firm.


  350. But one who delights in quieting thoughts, who cultivates the unattractive, ever mindful—such a
  one will bring craving to an end; such a one will cut Māra’s bond.


  351. One who has reached the goal, is unafraid, free of craving and without stain, has cut the arrows
  of becoming: this is the final bodily heap.


  352. Free of craving and without appropriation, skilled in expressions and their wording, one who knows
  the arrangement of letters, what comes before and what follows—this one, in a final body, is called
  greatly discerning, a great person.'
commentary: 'The passage begins with a psychology of reinforcement. The person is *vitakkapamathita*,
  “worn down” or churned by proliferating thoughts, and is *subhānupassī*, repeatedly attending to the
  attractive aspect of things. This is not a condemnation of beauty itself; it identifies selective attention
  as the condition under which *taṇhā*, craving, keeps expanding. What the mind repeatedly embellishes,
  it binds itself to. Thus the bond is not merely encountered from outside: “this one makes the bondage
  firm.”


  Verse 350 offers a counter-discipline: *vitakkūpasama*, the settling of thought, joined to *asubha*
  cultivation, attending to the unglamorous, impermanent, and bodily dimensions that desire edits out.
  The aim is not disgust but sobriety, supported by continuous mindfulness (*sadāsato*). The last two
  verses portray the released person as *vītataṇho* and *anādāno*: without thirst and without taking hold.
  Even linguistic skill in verse 352 is not presented as mere cleverness; knowing words, sequences, and
  formulations belongs to a wisdom no longer captured by them.


  Key Terms


  **taṇhā** — Craving or thirst: the grasping desire that repeatedly generates bondage.

  **vitakka** — Thought, reflection, or mental proliferation; here it is something to be calmed.

  **asubha** — The unattractive or unbeautified aspect of experience, cultivated to counter fixation on
  allure.

  **anādāno** — Not taking up or appropriating; free from possessive grasping.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** The Gītā likewise traces a causal sequence in which dwelling on sense-objects
  gives rise to attachment and desire, then to further disturbance. Divergence: The Gītā frames the remedy
  within disciplined action and devotion to Krishna, whereas these verses emphasize mindfulness, contemplation,
  and the ending of craving itself.

  **Epictetus, Enchiridion 5:** Epictetus locates distress not simply in external things but in the judgments
  and interpretations made about them, paralleling the role of thought and selective perception here.
  Divergence: Stoicism seeks freedom through correct judgment about what is in one’s control; the Dhammapada
  diagnoses craving and the round of becoming in distinctly Buddhist terms.

  **Gospel of Matthew 5:29:** Jesus’ severe image of removing what occasions destructive desire resembles
  the uncompromising effort to cut the bond that enslaves the mind. Divergence: Matthew’s saying is situated
  within obedience to God and the kingdom of heaven, while the Dhammapada describes liberation through
  the cessation of grasping and Māra’s fetter.'
practice: 'For ten minutes, sit with one recurring object of desire. Notice the mind’s *subha* story—its
  polishing, promises, and imagined completion. Then gently name three neglected facts: its changeability,
  its limits, and the bodily sensations of wanting. Return to the breath whenever thought begins to elaborate.
  End by relaxing the hands and saying silently: “No need to take hold.”'
