sanskrit_devanagari: '(390) na brāhmaṇass'' etad akiñci seyyo yadā nisedho manaso piyehi, yato yato hiṃsamano
  nivattati tato tato sammati-m-eva dukkhaṃ.

  (391) yassa kāyena vācāya manasā n'' atthi dukkataṃ saṃvutaṃ tīhi ṭhānehi tam ahaṃ brūmi brāhmaṇaṃ.

  (392) yamhā dhammaṃ vijāneyya sammāsambuddhadesitaṃ sakkaccaṃ taṃ namasseyya aggihuttaṃ va brāhmaṇo.

  (393) na jaṭāhi na gottena na jaccā hoti brāhmaṇo, yamhi saccañ ca dhammo ca so sukhī so ca brāhmaṇo.'
translation_literal: '390. Nothing is better for a brahmin than restraining the mind from what it holds
  dear. Wherever the intention to harm turns back, suffering is quieted there.


  391. One in whom no wrongdoing is found through body, speech, or mind, guarded at these three points—him
  I call a brahmin.


  392. From whomever one learns the Dhamma taught by the Fully Awakened One, one should honor that person
  attentively, as a brahmin honors the sacrificial fire.


  393. Not by matted hair, lineage, or birth does one become a brahmin. Whoever possesses truth and Dhamma:
  that person is blessed; that person is a brahmin.'
commentary: 'These verses turn the prestigious social name brāhmaṇa into an ethical and contemplative
  achievement. Verse 390 begins not with outward conduct but with nisedho manaso piyehi, the checking
  or restraint of the mind in relation to what it loves. Attachment to what is "dear" can readily become
  possessiveness, resentment, and the hiṃsamano, the mind inclined toward injury. Each time that impulse
  is relinquished, dukkha does not merely lessen in theory: it becomes calm right there.


  Verse 391 gives a threefold measure of integrity—body, speech, and mind—and calls such a person saṃvutaṃ,
  guarded or restrained. Yet the passage does not make restraint into private self-improvement. One should
  honor the teacher from whom the Buddha''s Dhamma is truly learned, while verse 393 decisively rejects
  jaṭā, gotta, and jāti—ascetic appearance, clan, and birth—as grounds of spiritual worth. Sacca and dhamma,
  truthfulness and lived rightness, are the actual marks of the noble person.


  Key Terms


  **nisedho** — restraint, checking, or holding back; here, the mind''s restraint from cherished objects.

  **hiṃsamano** — a mind bent toward harming or injuring others.

  **saṃvutaṃ** — guarded, restrained, or well-contained.

  **saccaṃ** — truth; a defining quality of the genuine brahmin in verse 393.


  Cross-Tradition Resonances


  **Bhagavad Gītā 17.14–16:** The Gītā likewise describes discipline of body, speech, and mind as an integrated
  spiritual practice. Divergence: Its teaching is framed within devotion and sacrifice, whereas these
  verses make non-harming, truth, and Dhamma the direct criteria of brahminhood.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in governing one''s own judgments rather than
  clinging to what lies outside one''s control. Divergence: Stoic discipline aims chiefly at freedom from
  disturbed judgment, while this passage explicitly traces the turning away from harmful intention to
  the calming of dukkha.

  **Qur''an 49:13:** This verse denies that tribe and ancestry are final measures of human honor, locating
  true nobility in piety. Divergence: The Qur''an grounds worth in consciousness of God, while Dhammapada
  393 names truth and Dhamma without appealing to a creator or divine judgment.'
practice: 'For one day, use the three gates before every consequential response: pause for one full breath
  and ask, “Will this harm through body, speech, or mind?” If the answer is yes—or uncertain—do not act
  yet. Relax the jaw, unclench the hands, feel both feet on the ground, and choose either a truthful gentle
  response or deliberate silence.'
