sanskrit_devanagari: '(263) yassa c'' etaṃ samucchinnaṃ mūlaghaccaṃ samūhataṃ sa vantadoso medhāvī sādhurūpo
  ti vuccati.

  (264) na muṇḍakena samaṇo abbato alikaṃ bhaṇaṃ icchālobhasamāpanno samaṇo kiṃ bhavissati,

  (265) yo ca sameti pāpāni aṇuṃthūlāni sabbaso samitattā hi pāpānaṃ samaṇo ti pavuccati.

  (266) na tena bhikkhu bhavati yāvatā bhikkhate pare, vissaṃ dhammaṃ samādāya bhikkhu hoti na tāvatā,'
translation_literal: '263. One in whom this has been cut away, destroyed at the root and cleared out—one
  who has cast off corruption and is discerning—is called a person of truly good form.


  264. Not by a shaven head is one an ascetic, if unrestrained, speaking falsely, and possessed by desire
  and greed. How could such a one be an ascetic?


  265. But one who wholly quiets evil deeds, whether minute or great, is called an ascetic, because evil
  has been brought to peace.


  266. One does not become a mendicant merely by begging from others. Having undertaken a harmful teaching
  or way of life, one is not thereby a mendicant.'
commentary: 'These verses dismantle religious identity as a matter of display. A shaved head (muṇḍakena),
  eloquent speech, or the act of receiving alms cannot establish the reality of a spiritual life. Verse
  263 reaches beneath appearance to what has been “destroyed at the root” (mūlaghaccaṃ samūhataṃ). The
  true sādhurūpa, a person of good or noble form, is not someone who looks holy but someone from whom
  the underlying corruptions have been excavated.


  The wordplay around samaṇo is especially sharp. A samaṇa is one who has made evil quiet, or peaceful:
  yo ca sameti pāpāni. This is comprehensive work, extending to faults “small and large” (aṇuṃthūlāni).
  Verse 266 then guards against another self-deception: even the outward livelihood of a bhikkhu, begging
  from others, does not suffice. The passage asks whether one’s conduct, commitments, and relation to
  greed actually embody the renunciant path.


  Key Terms


  **mūlaghaccaṃ** — destruction at the root; the removal of a defilement at its source rather than its
  visible expression.

  **vantadoso** — one who has cast out corruption or fault; literally, one who has vomited up defilement.

  **sameti** — calms, pacifies, brings to rest; the action from which samaṇa is explained here.

  **bhikkhu** — a mendicant or monastic; in this passage, a status requiring more than the practice of
  begging.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.6:** The Gītā likewise criticizes the person who outwardly restrains the senses while
  inwardly dwelling on their objects, making inner disposition decisive. Divergence: The Gītā frames the
  issue through disciplined action and devotion, whereas these verses define the renunciant through the
  pacification and uprooting of evil.

  **Matthew 23:27–28:** Jesus’ image of outwardly polished tombs that conceal impurity closely parallels
  the critique of holiness based on visible religious form. Divergence: Matthew’s rebuke is directed especially
  at hypocrisy and justice before God, while the Dhammapada focuses on greed, falsehood, and the cultivation
  of inner peace.

  **Analects 12.1:** Confucius teaches that ritual observance must be grounded in overcoming the self
  and returning to what is right, rather than being mere ceremony. Divergence: The Analects emphasizes
  humane social conduct and proper ritual relations; the Dhammapada’s horizon is renunciant discipline
  and liberation from defilement.'
practice: For one day, choose a single outward marker of being “good” that you rely on—polite speech,
  spiritual vocabulary, a role, a habit of service—and quietly set aside the need to be seen through it.
  Three times during the day, pause and name the present movement of desire, irritation, or self-deception.
  Do not condemn it; soften the body, breathe out slowly, and take one small action that does not feed
  it.
