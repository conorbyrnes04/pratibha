unit_label: Life Is Easy for the Shameless
title: Life Is Easy for the Shameless
unit_type: sutra
sanskrit_devanagari: '(235) Paṇḍupalāsova dānisi, Yamapurisāpi ca te upaṭṭhitā; Uyyogamukhe ca tiṭṭhasi, Pātheyyampi ca te
  na vijjati.


  (236) So karohi dīpamattano, Khippaṁ vāyama paṇḍito bhava; Niddhantamalo anaṅgaṇo, Dibbaṁ ariyabhūmiṁ upehisi.


  (237) Upanītavayo ca dānisi, Sampayātosi yamassa santikaṁ; Vāso te natthi antarā, Pātheyyampi ca te na vijjati.'
sanskrit_iast: '(235) Paṇḍupalāsova dānisi, Yamapurisāpi ca te upaṭṭhitā; Uyyogamukhe ca tiṭṭhasi, Pātheyyampi ca te na vijjati.


  (236) So karohi dīpamattano, Khippaṁ vāyama paṇḍito bhava; Niddhantamalo anaṅgaṇo, Dibbaṁ ariyabhūmiṁ upehisi.


  (237) Upanītavayo ca dānisi, Sampayātosi yamassa santikaṁ; Vāso te natthi antarā, Pātheyyampi ca te na vijjati.'
translation_literal: '(235) Thou art now like a sear leaf, the messengers of death (Yama) have come near to thee; thou standest
  at the door of thy departure, and thou hast no provision for thy journey.


  (236) Make thyself an island, work hard, be wise! When thy impurities are blown away, and thou art free from guilt, thou
  wilt enter into the heavenly world of the elect (Ariya).


  (237) Thy life has come to an end, thou art come near to death (Yama), there is no resting-place for thee on the road, and
  thou hast no provision for thy journey.'
commentary: 'These verses arrest the reader at the threshold of death—not as metaphor but as the governing condition of practice.
  The sear leaf, the messengers already present, the door of departure: each image compresses urgency into a single, inescapable
  fact. The passage does not console or promise; it strips away the luxury of postponement. What makes this teaching sharp
  is its refusal of abstraction. You are not meditating on mortality in general; you are *this body*, *now*, without provisions,
  without a resting-place. The old commentary''s language of ''intention'' and ''training of attention'' misses the bite.
  This is not gentle introspection. Verse 236 pivots on a single command: *karohi dīpamattano*—make yourself an island. Not
  a refuge, not a shelter, but an island: something that stands alone, surrounded by the flood, self-sufficient because there
  is nowhere else to go. The work (*vāyama*) is not accumulation but subtraction: the blowing away of impurities (*niddhantamalo*),
  the removal of guilt (*anaṅgaṇo*). Only then does entry into the ''heavenly world of the elect'' (*dibbaṁ ariyabhūmiṁ*)
  become possible—not as reward but as the natural consequence of having nothing left to cling to. The repetition in verse
  237 is deliberate: no resting-place, no provisions. Death does not negotiate. The teaching''s force lies in this: shame
  and the illusion of time are the only obstacles. Strip them away, and what remains is clarity without comfort.


  Key Terms


  **karohi dīpamattano** — make yourself an island; establish radical self-sufficiency through isolation from external support,
  the central imperative of verse 236

  **niddhantamalo** — impurities blown away; the subtraction of defilements through disciplined practice, prerequisite for
  entry into the ariya realm

  **dibbaṁ ariyabhūmiṁ** — the heavenly world of the elect; the celestial sphere accessible only to those who have purified
  themselves of clinging and guilt

  **Yama** — the messengers of death; the personified force of mortality that brooks no delay or negotiation, rendering all
  postponement illusory


  Cross-Tradition Resonances


  **Epicurus, Letter to Menoeceus (Diogenes Laërtius X.125):** Both texts use the imminence of death to strip away false desires
  and redirect attention to what is truly necessary; both reject abstract philosophy in favor of urgent, embodied practice
  Divergence: Epicurus counsels modest pleasure and friendship as the provision for the journey; the Dhammapada demands the
  abandonment of all clinging, making the island one of emptiness rather than modest satisfaction

  **Bhagavad Gītā 2.27 (on the inevitability of death):** Both texts use mortality as the opening premise for ethical transformation;
  both refuse consolation and demand immediate action in light of death''s certainty Divergence: The Gītā frames duty (dharma)
  and action (karma yoga) as the proper response; the Dhammapada frames subtraction and the dissolution of guilt as the sole
  path, with no role for prescribed social duty

  **Montaigne, ''To Philosophize is to Learn How to Die'' (Essais I.20):** Both texts insist that philosophy begins not with
  abstract reasoning but with the visceral acknowledgment of one''s own death; both reject the luxury of postponement Divergence:
  Montaigne seeks familiarity with death through contemplation to achieve equanimity; the Dhammapada uses death''s imminence
  to catalyze the active work of purification and the abandonment of all refuge'
insight: These verses arrest the reader at the threshold of death—not as metaphor but as the governing condition of practice.
practice: When you catch yourself deferring a difficult conversation, a necessary change, or an honest reckoning—stop mid-thought
  and physically turn to face a wall or window. Stand there for three breaths without moving or planning what to say. Let
  the absence of escape become tactile. Then turn back and act.
