sanskrit_devanagari: '(103) yo sahassaṃ sahassena saṅgāme mānuse jine ekañ ca jeyya-m-attānaṃ sa ve saṅgāmajuttamo.

  (104) attā have jitaṃ seyyo yā c'' āyaṃ itarā pajā, attadantassa posassa niccaṃ saññatacārino.

  (105) n'' eva devo na gandhabbo na Māro saha Brahmunā jitaṃ apajitaṃ kayrā tathārūpassa jantuno.

  (106) māse māse sahassena yo yajetha sataṃsamaṃ ekañ ca bhāvitattānaṃ muhuttam api pūjaye - sā yeva
  pūjanā seyyo yañ ce vassasataṃ hutaṃ.'
translation_literal: '103. Though one might defeat a thousand men in battle, a thousand times over, whoever
  conquers a single person—oneself—is the foremost victor in battle.


  104. Better indeed than conquering all these other people is the conquering of oneself: of a person
  whose self is tamed, whose conduct is continually restrained.


  105. Neither a god, nor a gandhabba, nor Māra together with Brahmā, can turn into defeat the victory
  won by such a being.


  106. Even if, month after month for a hundred years, someone offered a thousand in sacrifice, honoring
  for even a moment one whose self has been cultivated is the better offering. That honor surpasses a
  sacrifice maintained for a hundred years.'
commentary: 'The verses deliberately retain the language of the battlefield—"saṅgāma," battle—but redirect
  it. The highest conqueror is not the one who defeats multitudes; it is the one who "jeyya-m-attānaṃ,"
  conquers oneself. This is not a call to self-hatred or suppression. The following verse clarifies the
  quality of this victory: the person is "attadanta," self-tamed, and "saññatacārin," one who lives with
  steady restraint. Victory means that reactive impulses no longer command one’s speech and action.


  Verse 105 gives this inner achievement an almost cosmic security. Devas, gandhabbas, Māra, and Brahmā
  cannot reverse it: no external power can make a genuinely won moral freedom into a loss. The final verse
  contrasts costly, repeated "yajetha"—sacrificial offering—with reverence for a "bhāvitattānaṃ," one
  whose self has been developed or cultivated. The point is not merely to replace ritual with admiration
  for saints; it is to locate true worth in the patient formation of the heart.


  Key Terms


  **saṅgāma** — Battle or conflict; the poem turns martial victory into an image for inward struggle.

  **attadanta** — Self-tamed; disciplined through training rather than ruled by impulse.

  **saññatacārin** — One who lives in restraint, carefully governing conduct.

  **bhāvitattānaṃ** — One whose self has been cultivated or developed through practice.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5–6:** The Gītā says that the self can be one’s friend or enemy, and that the mastered
  self is a friend to oneself. Divergence: The Gītā frames this discipline within its teaching on yoga
  and the enduring ātman, whereas these verses emphasize ethical cultivation without making that metaphysical
  claim.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in what lies within one’s control—judgment,
  intention, and response—rather than in external success. Divergence: Stoicism grounds this in rational
  assent and living according to nature; the Dhammapada’s idiom centers on taming and cultivating the
  person amid craving and moral action.

  **New Testament, Proverbs 16:32:** “One who rules his spirit” is said to be better than one who captures
  a city, closely echoing the reversal of military prestige found here. Divergence: Proverbs presents
  self-rule within a theistic wisdom tradition, while the Dhammapada says even divine beings cannot undo
  the victory of disciplined self-mastery.'
practice: Before one ordinary action today—replying to a message, eating, speaking in a meeting, or entering
  a room—pause for three full breaths. Feel both feet on the ground, name the strongest impulse present
  (“defend,” “rush,” “please,” or “withdraw”), and choose one restrained, non-harming response. At day’s
  end, note one moment when you were led by impulse and one when you were attadanta, self-tamed.
