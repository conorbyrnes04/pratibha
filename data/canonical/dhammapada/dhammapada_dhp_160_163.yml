sanskrit_devanagari: '(160) attā hi attano nātho, ko hi nātho paro siyā, attanā hi sudantena nāthaṃ labhati
  dullabhaṃ.

  (161) attanā va kataṃ pāpaṃ attajaṃ attasambhavaṃ abhimatthati dummedhaṃ vajraṃ v'' amhamayaṃ maṇiṃ.

  (162) yassa accantadussīlyaṃ mālvā sālam iv'' otataṃ karoti so tath'' attānaṃ yathā naṃ icchatī diso.

  (163) sukarāni asādhūni attano ahitāni ca, yaṃ ve hitañ ca sādhuñ ca taṃ ve paramadukkaraṃ.'
translation_literal: '160. For one is truly one’s own protector; what other protector could there be?
  By oneself, when thoroughly trained, one gains a refuge that is hard to find.


  161. The wrong one has done oneself—born from oneself, arising in oneself—grinds down the foolish person,
  as a diamond crushes a jewel of stone.


  162. When a person’s utterly corrupt conduct coils around them like the mālvā creeper around a sāla
  tree, they do to themselves precisely what an enemy would wish for them.


  163. Deeds that are unworthy and harmful to oneself are easy to do. But what is wholesome and good—that
  is exceedingly difficult to do.'
commentary: 'These verses begin with a demanding claim: “attā hi attano nātho,” one is one’s own nātha,
  one’s own protector, support, or refuge. This is not an invitation to isolated self-sufficiency. Its
  condition is “attanā hi sudantena”: by oneself well tamed. The image is ethical and practical: freedom
  from danger is not handed over by another person, but is cultivated through a disciplined mind, speech,
  and body.


  The passage then turns inward the usual picture of an enemy. Harmful action is “attajaṃ attasambhavaṃ,”
  self-born and arising from oneself; it does not merely bring misfortune from outside but works upon
  the “dummedha,” the person of impaired discernment. Verse 162 makes this intimate damage visible in
  the image of a creeper smothering a sāla tree: deep “dussīlya,” corrupt conduct, gradually enwraps the
  one who sustains it. The final verse refuses sentimentality. Destructive acts are “sukarāni,” easy;
  what is both hita, beneficial, and sādhu, good, is “paramadukkaraṃ,” supremely difficult. The path is
  possible, but it asks for repeated, embodied effort.


  Key Terms


  **attā** — self; here, the person who must become their own basis of protection and training.

  **nātho** — protector, support, refuge, or guardian.

  **sudantena** — well tamed or thoroughly disciplined, especially in one’s conduct and mind.

  **dussīlyaṃ** — corrupt or unprincipled conduct; a breakdown of ethical character.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** The Gītā likewise says that one should raise oneself by oneself and not let oneself
  fall, making the self both ally and adversary. Divergence: The Gītā frames this discipline within its
  teaching on ātman and devotion to the divine, whereas this passage stresses moral training and karmic
  consequence without invoking a permanent self.

  **Epictetus, Enchiridion 1:** Epictetus begins by distinguishing what lies within our control from what
  does not, directing ethical attention toward one’s own judgments and choices. Divergence: Stoic practice
  emphasizes rational assent and acceptance of providence; these verses emphasize unwholesome action,
  self-made harm, and the training that uproots it.

  **James 1:14–15:** The Epistle of James describes a person as drawn away by their own desire, which
  grows into sin and then death—an inwardly generated moral danger. Divergence: James places this sequence
  within a theistic account of sin, temptation, and salvation, while the Dhammapada presents an impersonal
  pattern of action and result.'
practice: 'Before one ordinary choice today—replying to a message, eating, spending, or speaking—pause
  with both feet on the ground and take three slow breaths. Ask: “Is this hita, beneficial? Is this sādhu,
  good?” If the answer is unclear, wait ten more breaths before acting. In the evening, note one easy
  harmful impulse you interrupted and one difficult good action you attempted.'
