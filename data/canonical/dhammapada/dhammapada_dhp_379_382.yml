sanskrit_devanagari: '(379) attanā coday'' attānaṃ paṭimāse attam attanā, so attagutto satimā sukhaṃ bhikkhu
  vihāhisi.

  (380) attā hi attano nātho attā hi attano gati, tasmā saññāmay'' attānaṃ assaṃ bhadraṃ va vāṇijo.

  (381) pāmojjabahulo bhikkhu pasanno Buddhasāsane adhigacche padaṃ santaṃ saṃkhārūpasamaṃ sukhaṃ.

  (382) yo have daharo bhikkhu yuñjate Buddhasāsane so ''maṃ lokaṃ pabhāseti abbhā mutto va candimā. Bhikkhuvaggo
  pañcavīsatimo'
translation_literal: '(379) Stir yourself onward by yourself; inspect yourself by yourself. Guarded by
  yourself and mindful, bhikkhu, you will live in happiness.


  (380) For oneself is one''s own protector; oneself is one''s own way onward. Therefore train yourself
  as a merchant trains a fine horse.


  (381) The bhikkhu rich in gladness, confident in the Buddha''s teaching, reaches the peaceful state:
  the happy stilling of conditioned formations.


  (382) Even a young bhikkhu who earnestly applies himself in the Buddha''s teaching lights up this world
  like the moon released from a cloud.'
commentary: 'These verses place the work of liberation in an intimate, demanding relation to oneself.
  The repeated attā, “self,” does not celebrate an isolated ego; it makes responsibility immediate. One
  must coday'' attānaṃ, urge oneself on, and paṭimāse, look oneself over or examine oneself. The bhikkhu
  is not asked merely to possess good intentions, but to become attagutto satimā: self-guarded and mindful.
  The image of a merchant training a noble horse suggests patient skill rather than brutality. A valuable
  horse is guided toward steadiness; so too one''s volatile habits, moods, and impulses must be educated.


  Yet this discipline is not grim. The practitioner is pāmojjabahulo, abundant in gladness, and pasanno,
  clear and trusting, in the Buddha''s teaching. Its fruition is saṃkhārūpasamaṃ, the settling of constructed
  and conditioned processes—the cessation of their restless pressure. The final image turns private training
  outward: a young monk who practices wholeheartedly pabhāseti, sheds light upon, the world. Like the
  moon emerging from cloud, awakening does not manufacture a new light so much as uncover what obscuration
  had concealed.


  Key Terms


  **attā** — self; here the immediate field of personal responsibility, training, and protection.

  **satimā** — mindful, possessed of recollective awareness.

  **saṃkhārūpasamaṃ** — the calming or subsiding of conditioned formations and fabrications.

  **pabhāseti** — illuminates, makes radiant, sheds light upon.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** The Gītā likewise says that one should raise oneself by oneself and not let oneself
  fall, presenting the self as both a potential ally and adversary. Divergence: The Gītā frames this discipline
  within its teaching on the enduring ātman, whereas these verses work within a Buddhist path that does
  not establish such an eternal self.

  **Epictetus, Enchiridion 1:** Epictetus directs attention to what lies within one''s own power, especially
  one''s judgments and responses, much as these verses call for inward training and vigilance. Divergence:
  Stoic practice aims at rational freedom in accord with nature, while the Dhammapada directs discipline
  toward the cessation of conditioned suffering and liberation.

  **Gospel of Matthew 5:14–16:** The image of the practitioner lighting the world recalls the Gospel''s
  call for a lamp-like life whose light is visible to others. Divergence: Matthew presents shining as
  witness to and glorification of God, while the Dhammapada''s moon image follows the removal of obscuring
  defilements through practice.'
practice: 'For ten minutes, sit or walk quietly. First name one habit that clouds the mind—resentment,
  distraction, self-criticism, or craving. Then ask: “What would it mean to train this gently, as one
  trains a fine horse?” Keep attention on breathing and posture; each time the habit appears, recognize
  it without hostility and return. End by recalling one source of pāmojja, wholesome gladness, and carry
  that brightness into one ordinary interaction.'
