sanskrit_devanagari: '(136) atha pāpāni kammāni karaṃ bālo na bujjhati, sehi kammehi dummedho aggidaḍḍho
  va tappati.

  (137) yo daṇḍena adaṇḍesu appaduṭṭhesu dussati dasann'' aññataraṃ ṭhānaṃ khippam eva nigacchati:

  (138) vedanaṃ pharusaṃ jāniṃ sarīrassa ca bhedanaṃ garukaṃ vâpi ābādhaṃ cittakkhepaṃ va pāpuṇe.

  (139) rājato vā upassaggaṃ abbhakkhānaṃ va dāruṇaṃ parikkhayaṃ va ñātīnaṃ bhogānaṃ va pabhaṅguṇaṃ.'
translation_literal: '136. When a fool performs harmful deeds, he does not recognize them; the dull-minded
  person is tormented by those very deeds, as though scorched by fire.


  137. Whoever uses force against those without force, against those who are innocent, quickly comes to
  one among ten conditions:


  138. piercing pain, loss, bodily injury, serious illness, or disturbance of mind;


  139. trouble from rulers, a cruel accusation, the destruction of relatives, or the breaking apart of
  possessions.'
commentary: 'The passage begins not with an external judge but with blindness: the bālo, the fool, “does
  not understand” while making pāpāni kammāni, harmful actions. Yet the deed is not left behind once it
  is done. It becomes the very fire by which its maker is “scorched” (aggidaḍḍho va tappati). The image
  is intimate: wrongdoing is not merely a stain on one’s record but a heat that enters experience itself.


  Verses 137–139 turn particularly toward violence against the defenseless. Daṇḍena, “with a rod” or instrument
  of coercion, marks the abuse of power; the victims are adaṇḍesu, unable or not needing to wield force,
  and appaduṭṭhesu, not hostile or corrupt. The consequences named are concrete rather than abstract—pain,
  bodily collapse, mental disarray, political danger, accusation, and the loss of human and material supports.
  The list remains open here, emphasizing how violence unsettles the whole field of a life.


  Key Terms


  **pāpāni kammāni** — harmful deeds; actions carrying morally painful consequences.

  **bālo** — a fool, one whose failure is fundamentally a failure to see and understand.

  **daṇḍena** — with a rod, punishment, or coercive force.

  **appaduṭṭhesu** — among those who are not malicious or hostile; the innocent.


  Cross-Tradition Resonances


  **Galatians 6:7:** “Whatever one sows, that will one also reap” similarly portrays conduct as bearing
  consequences appropriate to itself. Divergence: Galatians frames this principle within a theistic and
  salvific horizon, while these verses present karmic consequence without appeal to a creator or final
  divine judgment.

  **Marcus Aurelius, Meditations 9.4:** Marcus observes that the wrongdoer harms himself, paralleling
  the image of a person burned by his own harmful action. Divergence: The Stoic emphasis is on preserving
  one’s rational and social nature, whereas the Dhammapada speaks in the idiom of kamma and its ripening
  results.

  **Proverbs 17:13:** The proverb warns that one who returns evil for good will not escape evil, echoing
  the warning against attacking the harmless. Divergence: Proverbs commonly assumes a moral order governed
  by the Lord, while the Pali passage focuses on the impersonal efficacy of deeds.'
practice: 'For one day, before speaking sharply, tightening your body, or acting from irritation, pause
  with both feet on the ground and take three slow breaths. Ask: “Is this person adaṇḍa—without power
  before me? Are they appaduṭṭha—without ill will?” If so, soften your voice or step back for one full
  minute before responding.'
