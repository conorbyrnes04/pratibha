sanskrit_devanagari: '(238) so karohi dīpam attano khippaṃ vāyama paṇḍito bhava, niddhantamalo anaṅgaṇo
  na punaṃ jātijaraṃ upehisi.

  (239) anupubbena medhāvī thokathokaṃ khaṇe khaṇe kammāro rajatassêva niddhame malam attano.

  (240) ayasā va malaṃ samuṭṭhitaṃ taduṭṭhāya tam eva khādati evaṃ atidhonacārinaṃ sakakammāni nayanti
  duggatiṃ.

  (241) asajjhāyamalā mantā, anuṭṭhānamalā gharā, malaṃ vaṇṇassa kosajjaṃ, pamādo rakkhato malaṃ.'
translation_literal: '(238) Make yourself an island; quickly exert yourself and become discerning. With
  the stain blown away, without blemish, you will not again come under birth and aging.


  (239) Little by little, moment by moment, the wise person removes his own impurity, as a smith removes
  the dross from silver.


  (240) Just as rust arisen from iron grows from it and then eats that very iron, so one’s own deeds lead
  the person of reckless conduct to a bad destination.


  (241) Not reciting is the stain of sacred texts; neglect is the stain of households. Laziness is the
  stain of beauty; heedlessness is the stain of a guard.'
commentary: 'The passage begins with an imperative of startling intimacy: “karohi dīpam attano”—make an
  island for yourself. A dīpa is a place of refuge amid surrounding waters; the verse does not advise
  isolation, but the construction of a stable ground through effort. That work is urgent—“khippaṃ vāyama”—yet
  verse 239 immediately qualifies urgency with patience: “anupubbena,” gradually, “thokathokaṃ,” little
  by little. Purification is not imagined as a single dramatic cleansing but as repeated, attentive removal
  of mala, stain or dross.


  The image of the smith makes moral cultivation concrete: silver is refined through sustained heating
  and removal, while iron’s rust arises from within and consumes its own source. In verse 240, actions
  (sakakammāni) are not merely external infractions; they become conditions that carry their maker toward
  duggati, a painful destination. The final verse broadens mala beyond obvious wrongdoing. Neglect, laziness,
  and pamāda—heedless inattention—corrode practices, homes, beauty, and vigilance alike. The antidote
  is therefore humble continuity: return to the task, notice the dross, remove a little.


  Key Terms


  **dīpam** — An island or secure refuge; here, a stable ground one must make for oneself.

  **anupubbena** — Gradually, in sequence; cultivation proceeds step by step.

  **malaṃ** — Stain, impurity, or dross—the recurring image for what obscures and corrodes.

  **pamādo** — Heedlessness or negligent inattention, named as a fundamental blemish.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** The Gītā likewise calls on a person to raise oneself by oneself, paralleling
  the Dhammapada’s summons to personal effort and inner steadiness. Divergence: The Gītā frames this work
  within its teaching on ātman and devotion to Krishna, whereas these verses emphasize karma, heedfulness,
  and release from renewed birth and aging without that theological frame.

  **Epictetus, Enchiridion 1:** Epictetus’ distinction between what is up to us and what is not supports
  the passage’s insistence that one’s own conduct and attention require deliberate care. Divergence: Stoic
  freedom is primarily freedom of judgment amid fate, while the Dhammapada’s imagery of purification is
  tied to karmic consequence and rebirth.

  **Confucius, Analects 1.4:** Zengzi’s daily self-examination resembles the repeated, small-scale scrutiny
  suggested by “moment by moment” and “little by little.” Divergence: The Analects chiefly directs examination
  toward reliability, friendship, and transmission within social life; this passage directs it toward
  cleansing defilement and escaping dukkha’s round of becoming.'
practice: For seven minutes, sit with a small metal object, coin, or spoon in your hand. Notice one “stain”
  currently fed by inattention—an avoided message, a careless habit, a neglected responsibility. Name
  one action that takes less than ten minutes and do it immediately afterward. Repeat this daily for a
  week, treating each small completion as the smith’s removal of one particle of dross.
