sanskrit_devanagari: '(164) yo sāsanaṃ arahataṃ aryānaṃ dhammajīvinaṃ paṭikkosati dummedho diṭṭhiṃ nissāya
  pāpikaṃ phalāni kaṭṭhakassêva attaghaññāya phallati.

  (165) attanā va kataṃ pāpaṃ attanā saṃkilissati, attanā akataṃ pāpaṃ attanā va visujjhati, suddhī asuddhī
  paccattaṃ nāñño aññaṃ visodhaye.

  (166) attadatthaṃ paratthena bahunāpi na hāpaye, attadattham abhiññāya sadatthapasuto siyā. Attavaggo
  dvādasamo'
translation_literal: '164. The fool who, relying on an evil view, rejects the teaching of the awakened
  ones—the noble people who live by the Dhamma—brings forth fruit for his own ruin, as a reed bears fruit
  that destroys itself.


  165. Evil is done by oneself; by oneself one becomes defiled. Evil is left undone by oneself; by oneself
  one is purified. Purity and impurity are each one’s own affair: no one can cleanse another.


  166. One should not give up one’s own true good for another’s good, even though that other good may
  be great. Having understood one’s own good, one should apply oneself steadily to it.'
commentary: 'Verse 164 warns not merely against disagreement, but against the mental posture of paṭikkosati,
  rejecting or denouncing sound instruction while leaning on a pāpikā diṭṭhi, a harmful view. Such a view
  is self-confirming and self-wounding: its fruit is compared to the fruiting of a plant that brings about
  its own destruction. The image makes consequence organic rather than externally imposed; the ruin grows
  from the very orientation one cultivates.


  Verses 165–166 turn inward with emphatic repetition of attanā, “by oneself.” One’s actions stain or
  clarify one’s life, and suddhī asuddhī paccattaṃ—purity and impurity are personal, particular matters.
  This is not an argument for indifference to others. Rather, it rejects the fantasy that another person
  can perform one’s ethical and contemplative work. Attadattha, one’s own genuine welfare, means the deep
  good of liberation and integrity; recognizing it, one becomes sadatthapasuto, earnestly devoted to that
  good.


  Key Terms


  **diṭṭhi** — A view or settled outlook; here, a harmful view that distorts discernment.

  **attanā** — By oneself; the repeated term stresses personal agency in action and purification.

  **visujjhati** — Is purified or becomes clear; purification is presented as a lived moral process.

  **attadatthaṃ** — One’s own true welfare or highest good, not mere self-advantage.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** The Gītā urges a person to raise oneself by oneself, making the self central
  to one’s own uplift or decline. Divergence: The Gītā frames this within its account of self, discipline,
  and devotion, whereas this passage focuses on karmic responsibility and purification.

  **Galatians 6:5:** “Each will have to bear his own load” parallels the insistence that moral work cannot
  finally be carried out by someone else. Divergence: Paul’s letter places this responsibility within
  a community shaped by grace and mutual burden-bearing; the Dhammapada states the principle without that
  theological framework.

  **Epictetus, Enchiridion 1:** Epictetus directs attention toward what lies within one’s control, especially
  one’s judgments and responses. Divergence: Stoicism grounds this discipline in rational alignment with
  nature, while the Dhammapada connects one’s conduct with defilement, purification, and liberation.'
practice: 'Sit or stand upright for three minutes. On each exhale, recall one matter you have been asking
  someone else—circumstances, approval, a teacher, or a loved one—to resolve for you. Feel your feet and
  name one small action wholly yours: an apology, a restraint, a period of practice, or an honest conversation.
  Do that action today.'
