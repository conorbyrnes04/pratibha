sanskrit_devanagari: '(36) sududdasaṃ sunipuṇaṃ yatthakāmanipātinaṃ cittaṃ rakkhetha medhāvī, cittaṃ guttaṃ
  sukhāvahaṃ.

  (37) dūraṅgamaṃ ekacaraṃ asarīraṃ guhāsayaṃ ye cittaṃ saññamessanti mokkhanti Mārabhandhanā.

  (38) anavaṭṭhitacittassa saddhammaṃ avijānato pariplavapasādassa paññā na paripūrati.

  (39) anavassutacittassa ananvāhatacetaso puññapāpapahīnassa n'' atthi jāgarato bhayaṃ.'
translation_literal: '(36) Let the wise person guard the mind: hard to perceive, exceedingly subtle, falling
  wherever it wishes. A well-guarded mind brings happiness.


  (37) Those who discipline the mind—far-roaming, solitary, bodiless, dwelling in a cave—will be freed
  from Māra’s bondage.


  (38) For one whose mind is unsteady, who does not understand the true teaching, whose confidence is
  adrift, wisdom does not come to fullness.


  (39) For one whose mind is not drenched [by craving], whose heart is not struck [by agitation], who
  has left behind both merit and demerit, there is no fear while awake.'
commentary: 'The mind, citta, is presented as elusive rather than solid: “hard to see” (sududdasaṃ), finely
  subtle (sunipuṇaṃ), and liable to fall wherever desire directs it (yatthakāmanipātinaṃ). Its freedom
  of movement is not yet liberation; it can be a restless wandering. Thus guarding the mind is not repression
  but intelligent care. In verse 37 it is called “far-roaming,” “solitary,” “bodiless,” and “dwelling
  in a cave” (guhāsayaṃ): it moves beyond visible locations while also hiding in the inward recesses of
  experience. To restrain such a mind is to slip Māra’s bonds—the binding forces of temptation, mortality,
  and delusion.


  Verses 38–39 contrast instability with awakened clarity. A “floating” or unreliable confidence, pariplavapasāda,
  cannot support mature wisdom; trust must become tested understanding of saddhamma, the true Dhamma.
  The final verse describes a mind not “drenched” (anavassuta), that is, not saturated by lust or clinging,
  and a heart not assailed by mental disturbance. “Having abandoned merit and demerit” does not dismiss
  ethical action; it points beyond attachment even to one’s goodness and its rewards. The jāgarata, the
  one awake, no longer lives under the threat of fear because the conditions that make fear take hold
  have been relinquished.


  Key Terms


  **cittaṃ** — mind or heart-mind; the shifting field of thought, feeling, and intention.

  **Mārabhandhanā** — Māra’s bonds; the fetters of delusion, temptation, and death-bound existence.

  **saddhammaṃ** — the true Dhamma; the genuine teaching and reality it discloses.

  **pariplavapasādassa** — of one whose confidence is drifting or unstable.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.26:** The Gītā likewise instructs that whenever the unsteady mind wanders, it should
  be brought back under the guidance of the self. Divergence: The Gītā frames this return within the enduring
  self (ātman), whereas these verses analyze mind without affirming such a permanent inner essence.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in attending to what lies within one’s own power,
  especially one’s judgments and responses. Divergence: Stoic discipline emphasizes rational assent and
  moral agency, while the Dhammapada directs attention toward release from craving, Māra, and karmic bondage.

  **Gospel of Mark 13:37:** Jesus’ closing injunction, “Keep awake,” parallels the Dhammapada’s image
  of the jāgarata, the wakeful person who is not overcome by fear. Divergence: Mark’s watchfulness is
  oriented toward readiness for the Lord’s coming, while Buddhist wakefulness concerns direct freedom
  from the mind’s defilements.'
practice: 'For ten minutes, sit upright and attend to the breath at the nostrils. Each time the mind moves
  toward planning, memory, worry, or desire, silently note “wandering,” relax the jaw and hands, and return
  to one complete in-breath and out-breath. At the end, ask: “What was the mind reaching for?” Do not
  judge the answer; simply recognize the movement and release it.'
