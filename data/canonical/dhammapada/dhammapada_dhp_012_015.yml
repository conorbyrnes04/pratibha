title: The Well-Roofed Mind
unit_type: verse
sanskrit_devanagari: '(12) sārañ ca sārato ñatvā asārañ ca asārato te sāraṃ adhigacchanti sammāsaṃkappagocarā.

  (13) yathā agāraṃ ducchannaṃ vuṭṭhi samativijjhati evaṃ abhāvitaṃ cittaṃ rāgo samativijjhati.

  (14) yathā agāraṃ succhannaṃ vuṭṭhi na samativijjhati evaṃ subhāvitaṃ cittaṃ rāgo na samativijjhati.

  (15) idha socati pecca socati pāpakārī ubhayattha socati, so socati so vihaññati disvā kammakiliṭṭham
  attano.'
translation_literal: '(12) Knowing what is substantial as substantial, and what is insubstantial as insubstantial,
  those whose field is right intention arrive at what is substantial.


  (13) Just as rain breaks through a badly thatched house, so passion breaks through an uncultivated mind.


  (14) Just as rain does not break through a well-thatched house, so passion does not break through a
  mind well cultivated.


  (15) Here one grieves; after death one grieves: the wrongdoer grieves in both places. Seeing the defilement
  of one’s own action, one grieves and is distressed.'
commentary: 'The passage begins with discernment: sāra, the solid or meaningful core, must be recognized
  as sāra, while asāra must not be mistaken for it. This is not merely an intellectual distinction. Those
  who move within the range of sammāsaṃkappa, “right intention” or rightly directed thought, actually
  attain the essential. The mind’s orientation determines what it takes to be worth pursuing.


  The paired images of the house make this inward work vivid. An abhāvitaṃ cittaṃ, a mind left uncultivated,
  has gaps through which rāgo, passion or compulsive desire, can enter like driving rain. A subhāvitaṃ
  cittaṃ, thoroughly developed, is not sealed off from life; rather, it has been made sound. The final
  verse shows why this matters: harmful action leaves kammakiliṭṭham, a stain or defilement in one’s own
  deed, which becomes a source of grief both now and hereafter.


  Key Terms


  **sāraṃ** — the essential, substantial, or genuinely worthwhile thing

  **sammāsaṃkappa** — right intention; a mind directed toward what is wholesome and true

  **abhāvitaṃ cittaṃ** — an undeveloped or uncultivated mind

  **rāgo** — passion, attachment, or desire that takes hold of the mind


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.63:** The Gītā traces a chain in which attachment gives rise to desire and destructive
  confusion, paralleling the Dhammapada’s image of rāgo entering an unguarded mind. Divergence: The Gītā
  frames the remedy within disciplined action and devotion to Krishna, while these verses emphasize cultivation
  of mind and discernment of the essential.

  **Matthew 7:24–27:** Jesus’ contrast between houses founded on rock and sand likewise uses a house tested
  by severe weather to portray the consequences of inward preparedness. Divergence: Matthew centers hearing
  and doing Jesus’ words, whereas the Dhammapada identifies mental cultivation as the protective structure.

  **Epictetus, Enchiridion 1:** Epictetus urges attention to what lies within one’s control, a practical
  parallel to the need to train the citta rather than be carried away by external impressions and desires.
  Divergence: Stoic teaching grounds freedom in rational judgment and acceptance of fate, while the Dhammapada
  links unwholesome action to karmic defilement and future grief.'
practice: 'Before sleep, sit quietly for five minutes and review one desire that shaped your day. Ask:
  “Was this sāra or asāra?” Feel where it appeared in the body, then take three slow breaths while forming
  one specific wholesome intention for tomorrow.'
