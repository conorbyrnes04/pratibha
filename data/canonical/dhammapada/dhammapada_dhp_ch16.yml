title: From What Is Dear Arises Sorrow
unit_type: sutra
sanskrit_devanagari: '(209) Ayoge yuñjamattānaṁ, yogasmiñca ayojayaṁ; Atthaṁ hitvā piyaggāhī, pihetattānuyoginaṁ.


  (210) Mā piyehi samāgañchi, appiyehi kudācanaṁ; Piyānaṁ adassanaṁ dukkhaṁ, appiyānañca dassanaṁ.


  (211) Tasmā piyaṁ na kayirātha, piyāpāyo hi pāpako; Ganthā tesaṁ na vijjanti, yesaṁ natthi piyāppiyaṁ.'
sanskrit_iast: '(209) Ayoge yuñjamattānaṁ, yogasmiñca ayojayaṁ; Atthaṁ hitvā piyaggāhī, pihetattānuyoginaṁ.


  (210) Mā piyehi samāgañchi, appiyehi kudācanaṁ; Piyānaṁ adassanaṁ dukkhaṁ, appiyānañca dassanaṁ.


  (211) Tasmā piyaṁ na kayirātha, piyāpāyo hi pāpako; Ganthā tesaṁ na vijjanti, yesaṁ natthi piyāppiyaṁ.'
translation_literal: '(209) One who applies himself to what should not be pursued, and does not apply
  himself to what should be pursued, abandoning the goal and grasping at what is dear, may well envy one
  devoted to the proper task.


  (210) Do not associate with the dear, nor ever with the not-dear. Not seeing the dear is suffering,
  and seeing the not-dear is also suffering.


  (211) Therefore, do not make anything dear; separation from the dear is bad. Bonds do not exist for
  those for whom there is neither dear nor not-dear.'
commentary: 'These verses dismantle the common strategy of pursuing pleasure and avoiding pain—what appears
  to be life''s natural compass but functions as its primary trap. The passage''s central move is radical:
  stop trying to engineer encounters with the pleasant and escapes from the unpleasant. This is not asceticism
  but a precise diagnosis of how attachment (piyā) and aversion (appiyā) create the very suffering they
  claim to solve. Verse 210''s paradox cuts deepest—*not seeing* what is dear becomes dukkha (pain, unsatisfactoriness),
  yet *seeing* what is unwanted also becomes dukkha. The trap has no exit through preference. What liberates
  is not suppression but the cessation of the binary itself: those without piyāppiyaṁ (the dear-and-not-dear
  distinction) have no ganthā (knots, fetters). The discipline here is one of *non-construction*—refusing
  to build the scaffolding of craving and aversion that makes the mind into a perpetual instrument of
  its own bondage. Verse 209 names the cost: the person who abandons yoga (disciplined attention) for
  piyaggāhī (grasping at pleasure) will eventually suffer the specific pain of envy—watching another''s
  freedom while remaining bound. The teaching is not that pleasure is evil, but that the *project* of
  securing pleasure while fleeing pain is the architecture of suffering itself.


  Key Terms


  **yoga** — disciplined meditative attention; the sustained mental cultivation that counteracts distraction
  and craving

  **piyāppiyaṁ** — the binary distinction between the dear (piyā) and the not-dear (appiyā); the fundamental
  duality that generates attachment and aversion

  **ganthā** — knots or fetters; the psychological bonds created by clinging to preference and aversion

  **dukkha** — pain, unsatisfactoriness, or suffering—arising equally from absence of the pleasant and
  presence of the unpleasant


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** Both texts warn that dwelling on sense-objects generates attachment; attachment
  breeds desire; desire unfulfilled becomes anger and delusion. The Gītā''s teaching on sense-withdrawal
  parallels the Dhammapada''s refusal to engineer encounters with pleasant or unpleasant. Divergence:
  The Gītā frames this within duty (dharma) and devotion to Kṛṣṇa, whereas the Dhammapada offers no theistic
  framework—liberation comes through cessation of the binary itself, not through surrender to a divine
  will.

  **Zhuangzi, ''Wandering Freely'' (逍遙遊):** Both reject the exhausting project of pursuing preference:
  the Zhuangzi''s sage ''has no use'' for things and ''does nothing yet nothing remains undone,'' echoing
  the Dhammapada''s non-construction of craving and aversion as the path to freedom. Divergence: The Zhuangzi
  emphasizes spontaneous action (wu-wei) and cosmic harmony, while the Dhammapada locates freedom in the
  deliberate discipline of non-attachment and the cessation of mental construction.

  **Epictetus, *Discourses* 1.1–2:** Epictetus teaches that suffering arises not from external events
  but from our judgments about them; freedom comes from withdrawing assent (prohairesis) from what is
  ''not up to us,'' paralleling the Dhammapada''s insight that the trap is in the *project* of preference,
  not in things themselves. Divergence: Epictetus locates agency in rational assent and the will, grounding
  freedom in a stoic metaphysics; the Dhammapada locates it in the cessation of the discriminating mind
  itself, without appeal to rational control.'
insight: These verses dismantle the common strategy of pursuing pleasure and avoiding pain—what appears
  to be life's natural compass but functions as its primary trap.
practice: When you reach for something or turn away from something, pause and notice the precise moment
  the reach or turning begins—before the hand moves, before the body shifts. Stay there in that threshold
  without completing the gesture. What happens to the wanting or the aversion when you neither feed it
  with pursuit nor starve it with denial, but simply let it be present and incomplete?
