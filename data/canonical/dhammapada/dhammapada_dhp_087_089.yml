sanskrit_devanagari: '(87) kaṇhaṃ dhammaṃ vippahāya sukkaṃ bhāvetha paṇḍito, okā anokaṃ āgamma viveke
  yattha dūramaṃ.

  (88) tatrâbhiratim iccheyya, hitvā kāme akiñcano pariyodapeyya attānaṃ cittaklesehi paṇḍito.

  (89) yesaṃ sambodhiaṅgesu sammā cittaṃ subhāvitaṃ ādānapaṭinissagge anupādāya ye ratā khīṇāsavā jutīmanto
  te loke parinibbutā. Paṇḍitavaggo chaṭṭho'
translation_literal: '87. Leaving behind the dark course, the wise person should cultivate the bright.
  Departing from home into homelessness, let them seek the seclusion in which delight is difficult to
  find.


  88. There let them desire joy; having abandoned sensual pleasures and become one with nothing possessed,
  the wise person should cleanse themselves of the mind’s defilements.


  89. Those whose minds are rightly cultivated in the factors of awakening, who delight in relinquishing
  every grasping, and who do not cling—radiant, with the outflows exhausted—they are fully quenched in
  this very world.'
commentary: 'The movement of these verses is deliberate: first relinquishment, then cultivation. The wise
  person, paṇḍito, does not merely turn away from kaṇhaṃ dhammaṃ, the “dark” or unwholesome way; they
  actively develop sukkaṃ, the bright and wholesome. This is not a flight into emptiness, but a reorientation
  of the whole life. The phrase okā anokaṃ āgamma evokes leaving the security and entanglements of the
  household for “homelessness”: outwardly this may mean renunciation, but inwardly it names release from
  the habit of making any condition into a permanent shelter for the self.


  Viveka, seclusion, is described as a place “where delight is hard to find.” Solitude initially exposes
  the mind’s restlessness and appetite; yet the practitioner is asked to seek a deeper abhirati, a joy
  not dependent on kāme, sensual objects. The final verse portrays the completion of this work: a mind
  subhāvitaṃ, well cultivated in the awakening factors, delights in ādānapaṭinissagga, relinquishing acquisition
  and grasping. With no upādāna, clinging, the khīṇāsavā—those whose draining currents of corruption are
  exhausted—are said to be parinibbutā, fully quenched, here in the world.


  Key Terms


  **viveka** — Seclusion or discernment: the freeing space in which habitual attachments can be seen.

  **kāme** — Sensual pleasures or desires, relinquished here as a basis for a freer joy.

  **ādānapaṭinissagga** — Letting go of taking up, acquiring, or grasping.

  **anupādāya** — Without clinging; not fastening the mind onto an object, identity, or experience.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā likewise praises one who moves without craving, possessiveness, or
  the sense of “mine,” and finds peace. Divergence: The Gītā frames this peace within its teaching on
  the enduring self and Brahman, whereas these verses stress non-clinging without affirming such a self.

  **Gospel of Matthew 6:19–21:** Jesus’ counsel not to store up earthly treasure parallels the movement
  from possession toward a less vulnerable form of wealth. Divergence: Matthew directs the heart toward
  treasure in heaven and relationship with God; the Dhammapada directs practice toward the cessation of
  clinging itself.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s power from what does not,
  encouraging freedom from attachment to external conditions. Divergence: Stoic freedom rests on rational
  assent and acceptance of providential order, while this passage centers on awakening, purification,
  and the ending of the āsavas.'
practice: Set aside fifteen minutes to sit without music, reading, or devices. Notice each impulse to
  reach for comfort, stimulation, or a reassuring self-story; silently name it “grasping,” then let the
  breath continue without obeying it. At the end, choose one small possession, pleasure, or expectation
  to release for the day, not as deprivation but as an experiment in akiñcana—having nothing to defend.
