  qa_issues: The translation of 'viveke yattha dūramaṃ' as 'the seclusion in which delight is difficult
    to find' is an inversion of the intended meaning. 'Dūramaṃ' here means 'hard to delight in' or 'difficult
    to enjoy', referring to the nature of seclusion itself, not that delight is hard to find within it.
