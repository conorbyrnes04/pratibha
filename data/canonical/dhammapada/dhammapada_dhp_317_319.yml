sanskrit_devanagari: '(317) abhaye bhayadassino bhaye câbhayadassino micchādiṭṭhisamādānā sattā gacchanti
  duggatiṃ.

  (318) avajje vajjamatino vajje câvajjadassino micchādiṭṭhisamādānā sattā gacchanti duggatiṃ.

  (319) vajjañ ca vajjato ñatvā avajjañ ca avajjato sammādiṭṭhisamādānā sattā gacchanti suggatiṃ. Nirayavaggo
  dvavīsatimo'
translation_literal: '317. Seeing danger where there is none, and seeing safety where there is danger,
  beings who embrace distorted view go to an unhappy destination.


  318. Taking fault for what is faultless, and seeing no fault in what is blameworthy, beings who embrace
  distorted view go to an unhappy destination.


  319. Knowing what is blameworthy as blameworthy, and what is faultless as faultless, beings who embrace
  right view go to a fortunate destination.'
commentary: 'These verses turn on a basic but searching question: can we see things as they are? The error
  is not merely committing a wrong act; it is the prior confusion that calls the harmful harmless and
  the harmless threatening. To regard the "abhaya" (the safe, the fear-free) as "bhaya" (danger), or danger
  as safety, is to let perception itself be governed by distortion.


  The same reversal appears in "vajja" and "avajja": what is blameworthy and what is not blameworthy.
  "Micchādiṭṭhi," distorted view, is an adopted orientation, a way of taking up the world that carries
  beings toward "duggati," a bad destination. But the final verse is deliberately plain: "sammādiṭṭhi,"
  right view, begins in accurate recognition. Liberation is not founded on inventing new moral labels,
  but on knowing harmfulness as harmfulness and blamelessness as blamelessness.


  Key Terms


  **bhaya** — fear, danger, or peril.

  **abhaya** — freedom from fear; safety or harmlessness.

  **vajja** — fault, blameworthiness, or what should be avoided.

  **sammādiṭṭhi** — right view: clear and sound discernment.


  Cross-Tradition Resonances


  **Isaiah 5:20:** Isaiah condemns those who call evil good and good evil, closely paralleling the passage''s
  warning about reversed moral perception. Divergence: Isaiah frames this reversal primarily as a prophetic
  indictment before God, while the Dhammapada emphasizes view, action, and their karmic direction.

  **Bhagavad Gītā 18.30:** The Gītā praises understanding that distinguishes what should and should not
  be done, as well as fear and fearlessness. Divergence: The Gītā places this discernment within its teaching
  on guṇas and duty, whereas these verses focus on right view and the destinations conditioned by it.

  **Plato, Republic IV, 430b–d:** Plato describes courage as preserving a correct judgment about what
  is truly fearful, rather than being misled by pleasure or pain. Divergence: Plato''s account concerns
  the ordered soul and civic virtue; the Dhammapada makes moral misseeing a karmically consequential form
  of wrong view.'
practice: 'Before one consequential choice today, pause for three breaths and write two columns: “What
  is the actual harm here?” and “What is merely discomfort or fear?” Then name one action that is genuinely
  blameless and take that action deliberately.'
