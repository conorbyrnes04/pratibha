sanskrit_devanagari: '(140) athavâssa agārāni aggī ḍahati pāvako, kāyassa bhedā duppañño nirayaṃ sȏpapajjati.

  (141) na naggacaryā na jaṭā na paṃkā nânāsakā thaṇḍilasāyikā vā rajovajall'' ukkuṭikappadhānaṃ sodhenti
  maccaṃ avitiṇṇakaṃkhaṃ.

  (142) alaṃkato ce pi samaṃ careyya santo danto niyato brahmacārī sabbesu bhūtesu nidhāya daṇḍaṃ so brāhmaṇo
  so samaṇo sa bhikkhu. 143a hirīnisedho puriso koci lokasmi vijjati yo nindaṃ appabodhati asso bhadro
  kasām iva. 143b asso yathā bhadro kasāniviṭṭho ātāpino saṃvegino bhavātha.'
translation_literal: '(140) Or a blazing fire may burn one’s houses; when the body breaks apart, the foolish
  person goes on to hell.


  (141) Neither going naked, nor matted hair, nor mud, nor fasting, nor lying on the bare ground, nor
  dust and grime, nor crouching in strenuous practice can cleanse a mortal who has not crossed beyond
  doubt.


  (142) But if, though adorned, one lives evenly—peaceful, disciplined, restrained, living the holy life,
  and having laid aside violence toward every living being—that person is a brahmin, that person an ascetic,
  that person a mendicant.


  (143a) Is there in this world any person restrained by conscience, who recognizes blame as a fine horse
  recognizes the whip?


  (143b) Like a fine horse touched by the whip, become ardent and stirred to urgency.'
commentary: 'Verse 140 sets a stark horizon: external loss, even the burning of one’s home, is not the
  final disaster. The deeper peril belongs to the duppañña, the person of poor discernment, whose conduct
  bears consequences beyond the body’s breakup. The following verse turns directly against the assumption
  that visible hardship is itself purifying. The catalogue of austerities—naggacaryā, “naked practice,”
  jaṭā, matted hair, fasting, dirt, and harsh postures—does not condemn simplicity as such; it denies
  that self-mortification can resolve the fundamental unclarity of avitiṇṇakaṅkha, one who has not passed
  beyond doubt.


  Verse 142 offers the counter-image. One may be alaṃkato, even ornamented or well dressed, and still
  genuinely live as a renunciant if one moves samaṃ, with evenness, and is santo, danto, and niyato: peaceful,
  tamed, and governed. The decisive criterion is nidhāya daṇḍaṃ sabbesu bhūtesu, laying down the rod toward
  all beings. The added horse image makes moral sensitivity active rather than passive: hirī, conscientious
  shame, enables a person to awaken quickly to fault, while ātāpa and saṃvega name the heat and urgency
  needed for transformation.


  Key Terms


  **duppañño** — A person of deficient wisdom or discernment.

  **avitiṇṇakaṅkhaṃ** — Not having crossed over doubt; still inwardly unsettled and uncertain.

  **nidhāya daṇḍaṃ** — Having put down the rod: relinquishing violence, punishment, and coercive harm.

  **saṃvegino** — Possessed of spiritual urgency, a deeply stirred recognition that practice cannot be
  postponed.


  Cross-Tradition Resonances


  **Isaiah 1:11–17:** The prophet rejects abundant ritual when it is detached from justice, much as these
  verses reject severe ascetic display without inward purification and harmlessness. Divergence: Isaiah
  frames the critique as the demand of Israel’s personal God and emphasizes social justice; the Dhammapada
  frames it through discipline, karma, and release from delusion.

  **Bhagavad Gītā 17.5–6:** The Gītā criticizes harsh austerities performed through pride or craving,
  recognizing that bodily severity need not be spiritually wholesome. Divergence: The Gītā evaluates austerity
  partly through devotion and its effects on the divine dwelling in the body, whereas this passage makes
  non-harming and inner restraint its central test.

  **Epictetus, Enchiridion 46:** Epictetus cautions philosophers not to advertise their principles through
  outward behavior but to show them in how they live, paralleling the critique of ascetic signs. Divergence:
  Stoic discipline seeks rational freedom and integrity within one’s role, while the Dhammapada joins
  restraint to nonviolence toward all beings and to liberation from rebirth’s suffering.'
practice: 'For one day, choose a single ordinary sign of comfort or status—clothing, food, a device, or
  a role—and neither display it nor reject it theatrically. Before speaking or acting toward any person
  or animal, pause for one full breath and silently ask: “Am I taking up the rod, or laying it down?”
  If corrected or irritated, feel the body’s reaction, soften the jaw and hands, and make one prompt,
  non-defensive repair.'
