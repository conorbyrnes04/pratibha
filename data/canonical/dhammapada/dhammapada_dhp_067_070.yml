title: When the Deed Ripens
unit_type: verse
sanskrit_devanagari: '(67) na taṃ kammaṃ kataṃ sādhu yaṃ katvā anutappati yassa assumukho rodaṃ vipākaṃ
  paṭisevati.

  (68) tañ ca kammaṃ kataṃ sādhu yaṃ katvā nânutappati yassa patīto sumano vipākaṃ paṭisevati.

  (69) mādhuvā maññatī bālo yāva pāpaṃ na paccati yadā ca paccatī pāpaṃ atha [bālo] dukkhaṃ nigacchati.

  (70) māse māse kusaggena bālo bhuñjetha bhojanaṃ na so saṃkhatadhammānaṃ kalaṃ nâgghati soḷasiṃ.'
translation_literal: '(67) An action is not well done when, having done it, one later burns with regret,
  receiving its result with tears upon one’s face.


  (68) But an action is well done when, having done it, one does not regret it, receiving its result glad
  and bright in mind.


  (69) So long as an evil deed has not ripened, the fool takes it for honey; but when that evil ripens,
  then the fool comes to suffering.


  (70) Even if, month after month, a fool were to eat only as much food as could rest on the tip of a
  blade of kusa grass, he would not equal one sixteenth of those who have discerned conditioned things.'
commentary: 'The first pair of verses measures action not by its appearance but by its aftermath. A deed
  called sādhu, “good” or “well made,” is one that does not leave the agent in anutappati, the inward
  heat of remorse. Its vipāka, its ripening result, can be met with a settled and joyful mind. This is
  not merely a promise of future reward: regret and ease are already present ways in which a deed bears
  fruit in the heart.


  Verse 69 names the fool’s mistake: pāpa, harmful action, can seem like madhu, honey, while its consequences
  remain unripe. The sweetness is immediate; the dukkha arrives later. Verse 70 then overturns confidence
  in conspicuous austerity. Extreme restraint in eating does not by itself approach the worth of insight
  into saṃkhatadhammānaṃ, the conditioned and constructed character of things. Ethical clarity and liberating
  understanding matter more than self-punishment.


  Key Terms


  **anutappati** — feels remorse; is inwardly scorched by regret.

  **vipākaṃ** — the ripened result or fruition of an action.

  **paccati** — ripens or comes to maturation, especially in reference to karma.

  **saṃkhatadhammānaṃ** — of conditioned phenomena; things formed through causes and conditions.


  Cross-Tradition Resonances


  **Galatians 6:7 — “whatever one sows, that will he also reap.”:** Both passages portray conduct as bearing
  consequences that eventually return to the doer. Divergence: Galatians frames this principle within
  relationship to God and salvation, while these verses stress impersonal karmic ripening and the mind’s
  direct experience of remorse or gladness.

  **Bhagavad Gītā 4.33:** The Gītā likewise places insight or knowledge above merely external sacrificial
  performance. Divergence: The Gītā situates knowledge within devotion, duty, and realization of the supreme
  divine reality; this passage emphasizes discernment of conditioned phenomena without that theistic frame.

  **Epictetus, Discourses 1.4:** Epictetus warns that a philosophical life is not secured by outward marks
  but by transformed judgment and practice. Divergence: Stoic discipline seeks rational freedom in accordance
  with nature, whereas the Dhammapada passage joins ethical consequence to karma and insight into conditioned
  dhammas.'
practice: Before sleep, review one action from the day. Notice whether its memory brings contraction and
  regret or a clear, glad mind. If regret is present, name the harm plainly, make one concrete repair
  if possible, and choose one small alternative action for tomorrow; then sit for five breaths, observing
  how every feeling of sweetness, discomfort, and intention arises and changes.
