unit_label: The Jasmine Lets Go
title: The Jasmine Lets Go
unit_type: verse
sanskrit_devanagari: '(375) tatrâyam ādi bhavati idha paññassa bhikkhuno: indriyaguttī santuṭṭhī pātimokkhe
  ca saṃvaro, mitte bhajassu kalyāṇe suddhājīve atandite.

  (376) paṭisanthāravutt'' assa ācārakusalo siyā, tato pāmojjabahulo dukkhass'' antaṃ karissati.

  (377) vassikā viya pupphāni maddavāni pamuñcati evaṃ rāgañ ca dosañ ca vippamuñcetha bhikkhavo.

  (378) santakāyo santavāco santavā susamāhito vantalokāmiso bhikkhu upasanto ti vuccati.'
translation_literal: '375. This is the beginning for a discerning bhikkhu here: protection of the faculties,
  contentment, and restraint according to the Pātimokkha. Keep company with good friends, whose livelihood
  is pure and who are not slack.


  376. Let one be practiced in welcome and skilled in conduct. Then, rich in gladness, one will bring
  suffering to its end.


  377. As the jasmine plant releases its faded flowers, so too, bhikkhus, release passion and hatred completely.


  378. The bhikkhu whose body is peaceful, whose speech is peaceful, who is peaceful and thoroughly collected,
  who has cast off worldly bait—this one is called "at peace."'
commentary: 'The passage begins not with an abstract doctrine but with a training-ground: indriyaguttī,
  the guarding of the sense faculties. This is joined to santuṭṭhī, contentment, and pātimokkhe saṃvaro,
  restraint shaped by the monastic code. The sequence is practical: guard the doors of experience, be
  sufficient with what is given, live within a discipline, and seek kalyāṇa friends rather than merely
  congenial company. Ethical life is also relational; paṭisanthāravutti, a disposition of welcome and
  considerate reception, belongs to the path toward pāmojja, deep gladness.


  The image of the jasmine makes release organic rather than violent. It does not need to tear away its
  old blossoms; it lets them fall when their season has passed. So rāga, possessive attraction, and dosa,
  aversion or hostility, are to be relinquished. The closing verse gathers this freedom into the whole
  person: calm body, calm speech, and a settled mind. Having abandoned lokāmisa, the worldly lure that
  feeds grasping, the bhikkhu is not merely quiet in manner but rightly named upasanta: one who has become
  peaceful.


  Key Terms


  **indriyaguttī** — Guarding the sense faculties; careful protection of the channels through which craving
  and distraction arise.

  **santuṭṭhī** — Contentment; sufficiency with what one has received or possesses.

  **paṭisanthāravutti** — A disposition toward welcome, courtesy, and generous human interchange.

  **upasanto** — At peace; stilled through the relinquishment of worldly entanglement.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.58:** Like a tortoise drawing in its limbs, the Gītā commends withdrawing the senses
  from their objects, paralleling indriyaguttī. Divergence: The Gītā frames sense-restraint within devotion
  and realization of the enduring Self, whereas this passage situates it in Buddhist discipline and the
  ending of suffering without affirming such a self.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s control from what does
  not, a discipline that supports the contentment of santuṭṭhī. Divergence: Stoic practice emphasizes
  rational assent and living according to nature, while the Dhammapada passage specifically targets craving,
  hatred, and release from worldly bait.

  **Rule of St. Benedict 4.72:** Benedict’s instruction to seek the good of others and bear one another’s
  weaknesses resonates with kalyāṇa friendship and paṭisanthāravutti. Divergence: Benedictine mutual care
  is ordered toward communal obedience and the love of Christ, while these verses present good association
  as support for liberation from dukkha.'
practice: For one day, pause at each strong sensory pull—an alert, a taste, an attractive image, an irritation—and
  take three slow breaths before responding. Name quietly, “wanting” or “resisting”; relax the jaw, shoulders,
  and hands; then choose one action of contentment or welcome, such as putting the device down, accepting
  what is already present, or offering undivided attention to someone nearby.
