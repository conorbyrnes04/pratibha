sanskrit_devanagari: '(33) Phandanaṁ capalaṁ cittaṁ, dūrakkhaṁ dunnivārayaṁ; Ujuṁ karoti medhāvī, usukārova tejanaṁ.


  (34) Vārijova thale khitto, okamokataubbhato; Pariphandatidaṁ cittaṁ, māradheyyaṁ pahātave.


  (35) Dunniggahassa lahuno, yatthakāmanipātino; Cittassa damatho sādhu, cittaṁ dantaṁ sukhāvahaṁ.'
sanskrit_iast: '(33) Phandanaṁ capalaṁ cittaṁ, dūrakkhaṁ dunnivārayaṁ; Ujuṁ karoti medhāvī, usukārova tejanaṁ.


  (34) Vārijova thale khitto, okamokataubbhato; Pariphandatidaṁ cittaṁ, māradheyyaṁ pahātave.


  (35) Dunniggahassa lahuno, yatthakāmanipātino; Cittassa damatho sādhu, cittaṁ dantaṁ sukhāvahaṁ.'
translation_literal: '(33) As a fletcher makes straight his arrow, a wise man makes straight his trembling and unsteady thought,
  which is difficult to guard, difficult to hold back.


  (34) As a fish taken from his watery home and thrown on dry ground, our thought trembles all over in order to escape the
  dominion of Mara (the tempter).


  (35) It is good to tame the mind, which is difficult to hold in and flighty, rushing wherever it listeth; a tamed mind brings
  happiness.'
commentary: 'The mind''s nature is *phandana* — trembling, flickering, scattering — not a defect to overcome through force
  but a condition to be recognized and worked with as deliberately as a fletcher straightens an arrow. The passage does not
  counsel suppression; it names the difficulty plainly (dūrakkhaṁ, dunnivārayaṁ — hard to guard, hard to hold back) and then
  offers a precise image of skill: the wise one (medhāvī) does not wrestle the mind into stillness but applies steady, measured
  attention the way an arrow-maker applies tension and correction. The fish gasping on dry ground is not a metaphor for failure
  but for the mind''s own nature under Māra''s dominion — it thrashes because it has been removed from its element, thrown
  into a condition of grasping. Taming (dama) is therefore not conquest but a return to fitness: a trained mind (cittaṁ dantaṁ)
  does not become rigid or blank; it becomes *sukhāvaha* — bearing ease, carrying well-being. The discipline here is one of
  patient, repetitive straightening, like the fletcher''s craft, where each correction is small, unglamorous, and cumulative.
  The work is not to stop the trembling but to direct it.


  Key Terms


  **phandana** — trembling, flickering, scattering—the mind''s inherent restless nature, not a defect but a condition to be
  recognized and worked with

  **dama** — taming or training; a return to fitness and proper function rather than forceful suppression or conquest

  **cittaṁ dantaṁ** — a trained mind; one that is disciplined through patient, cumulative correction and bears ease (sukhāvaha)
  rather than rigidity

  **Māra** — the tempter; the force of grasping and delusion that removes the mind from its proper element, causing it to
  thrash in dominion


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.26 (yoga-sutra parallels on citta-vṛtti-nirodhana):** Both traditions recognize the mind''s natural tendency
  toward scattering (vṛtti / phandana) and prescribe disciplined, repeated practice (abhyāsa) to steady it without annihilating
  its nature Divergence: The Gītā emphasizes return to the Self (ātman) as the ground of stillness, whereas the Dhammapada
  locates training in the mind''s own fitness and the cessation of grasping, without reference to a permanent self

  **Plato, *Phaedrus* 246–254 (the charioteer and horses):** Both use the image of skilled guidance—charioteer or fletcher—to
  describe the disciplining of a naturally unruly force; both reject brute force in favor of patient, artful direction Divergence:
  Plato''s charioteer aims to elevate the soul toward the Forms and divine realm, whereas the Dhammapada''s fletcher aims
  at the mind''s return to its own element and the bearing of ease in the present condition

  **Stoic *Enchiridion* (Epictetus) on prohairesis and the discipline of assent:** Both traditions teach that the mind''s
  trembling or impressions (phantasiai) are not to be suppressed but recognized and redirected through steady practice; both
  locate freedom in disciplined attention rather than in the absence of disturbance Divergence: Stoicism grounds discipline
  in rational assent to universal logos and duty, whereas the Dhammapada grounds it in the recognition of Māra''s dominion
  and the mind''s natural fitness when freed from grasping'
insight: The mind's nature is *phandana* — trembling, flickering, scattering — not a defect to overcome through force but
  a condition to be recognized and worked with as deliberately as a fletcher straightens an arrow.
practice: 'When sitting, let your eyes rest on a fixed point—a wall, a candle flame, the space between your hands—and notice
  how attention itself trembles: it drifts, snags, returns, drifts again. Do not fight this. Instead, each time you notice
  the drift, make one small internal gesture of return, as if you were straightening a single fiber. Repeat this for ten minutes
  without expectation of stillness, only of the repeated, unglamorous act of correction itself.'
