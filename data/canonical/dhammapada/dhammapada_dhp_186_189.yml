sanskrit_devanagari: '(186) na kahāpaṇavassena titti kāmesu vijjati, "appassādā dukhā kāmā" iti viññāya
  paṇḍito

  (187) Api dibbesu kāmesu ratiṃ so nâdhigacchati, taṇhakkhayarato hoti sammāsambuddhasāvako.

  (188) bahuṃ ve saraṇaṃ yanti pabbatāni vanāni ca ārāmarukkhacetyāni manussā bhayatajjitā,

  (189) n'' etaṃ kho saraṇaṃ khemaṃ n'' etaṃ saraṇam uttamaṃ n'' etaṃ saraṇaṃ āgamma sabbadukkhā pamuccati.'
translation_literal: '(186) Not even a rain of coins can bring contentment in sensual pleasures. Knowing,
  “Sensual pleasures offer little sweetness and much suffering,” the wise person understands.


  (187) Such a disciple of the Fully Awakened One finds no delight even in heavenly pleasures; delighting
  in the ending of craving, he lives.


  (188) Driven by fear, people go for refuge to many places: mountains and forests, pleasure-groves, trees,
  and shrines.


  (189) But this is not a secure refuge; this is not the highest refuge. By going to such a refuge, one
  is not released from every suffering.'
commentary: 'The passage begins with a deliberately extravagant image: even a “rain of coins” (kahāpaṇavassena)
  cannot produce titti, true satisfaction, in kāma, sensual enjoyments. The problem is not merely that
  possessions are scarce or that pleasures are forbidden. Rather, pleasures are appassādā—having only
  a slight taste of sweetness—while their vulnerability, loss, dependence, and repetition make them dukhā,
  bound up with distress. The wise person sees this proportion clearly.


  Verse 187 presses the point beyond ordinary wealth: even divine pleasures do not satisfy the Buddha’s
  genuine disciple. The alternative is not grim deprivation but rati, delight, directed toward taṇhakkhaya,
  the fading and ending of craving. The final verses turn to saraṇa, refuge. Mountains, forests, sacred
  trees, and shrines may offer comfort to those bhayatajjitā, struck by fear, but they cannot be khema,
  utterly secure. The verses distinguish a temporary place of reassurance from a refuge capable of ending
  suffering at its root.


  Key Terms


  **titti** — Satisfaction or contentment; the fullness that sensual acquisition cannot provide.

  **kāmā** — Sensual pleasures and objects of desire, described here as slight in sweetness and bound
  up with suffering.

  **taṇhakkhaya** — The ending of craving; the condition in which the cycle of grasping is brought to
  cessation.

  **saraṇa** — Refuge or shelter; here contrasted with the truly secure and highest refuge.


  Cross-Tradition Resonances


  **Ecclesiastes 5:10:** “Whoever loves money never has enough”: like verse 186, this recognizes that
  accumulation does not settle desire. Divergence: Ecclesiastes reflects on the futility of wealth, whereas
  the Dhammapada extends the diagnosis to sensual pleasure itself and directs liberation toward craving’s
  extinction.

  **Bhagavad Gītā 2.71:** The Gītā praises the person who moves without craving and without the sense
  of “mine,” paralleling the Dhammapada’s esteem for freedom from taṇhā. Divergence: The Gītā frames this
  freedom within devotion and the realization of the Self, while this passage presents release in terms
  of the cessation of craving and suffering.

  **Qur’an 13:28:** The verse says that hearts find rest through remembrance of God, echoing the search
  for a refuge deeper than outward places or possessions. Divergence: The Qur’anic passage locates ultimate
  rest in remembering and trusting God; the Dhammapada passage emphasizes insight into desire and a refuge
  that ends suffering.'
practice: 'For ten minutes, sit or walk without reaching for a device, food, music, or conversation. Each
  time wanting appears, silently note: “little sweetness, much burden.” Feel the bodily texture of the
  urge—tightness, leaning, restlessness—without obeying it. End by asking: “What am I treating as a refuge
  today, and can it truly keep me safe?”'
