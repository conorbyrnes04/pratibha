    have only imagined one generic hole, and whether some lives you know already belong to a different
    house.'
- kind: key_terms
  label: Key Terms
  items:
  - term: griot
    definition: the praise-speaker caste, kept apart in life and given the baobab in death -> not a "minstrel"
      and not trash -> speech-people of a tree-residence
  - term: baobab creux
    definition: hollow baobab -> already a mammam-dwelling in unit 3 -> the griot's grave is a spirit-house,
      not a refuse pit
  - term: même cérémonial
    definition: the same ceremonial -> equality of rite with difference of place -> "thrown away" as a
      translation of jeter would erase this clause
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hindu difference of funeral for sannyāsin (often without ordinary cremation-house rites)
    resonance: Both can honor a person with a full rite that is not the standard earth or fire of the
      householder.
    divergence: The sannyāsin's difference is renunciation of the world; the griot's is caste-office returned
      to the spirit-tree.
  - citation: Celtic and northern tree-burial motifs (structural, late)
    resonance: Both imagine some dead as belonging to a tree rather than to a flat grave.
    divergence: Romantic tree-burial is often literary; Lasnet records a specific hollow baobab with the
      same wrapping as earth-burial.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand at one actual tree. Without imitating a funeral, admit that a body could be housed in more
    than earth. Then do one act of equal care toward someone your world ranks apart — a thanks, a share
    of food, a listening — without demanding they occupy your house.
