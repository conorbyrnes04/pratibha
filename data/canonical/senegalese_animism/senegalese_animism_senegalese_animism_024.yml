  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: Les griots ne sont pas enterrés, on les jette dans un baobab creux, enveloppés de pagnes, et avec
    le même cérémonial que pour les autres Sérères.
- kind: iast
  label: Romanization
  body: French ethnographic report of Serer oral teaching. Griots are not earth-buried; they are placed
    in a hollow baobab, wrapped in cloths, with the same ceremonial as other Serer. The baobab is already
    a spirit-dwelling (unit 3).
- kind: translation
  label: Pratibha Translation
  body: Griots are not buried. They are placed in a hollow baobab, wrapped in cloths, and with the same
    ceremonial as for the other Serer.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that some souls have a different residence, not a lesser rite. Lasnet''s verb jette
    can sound like contempt. The next clause blocks that reading: the same ceremonial as the others. Wrapping
    in pagnes is the same honor. What changes is the house. Ordinary Serer go into an east-facing tumulus
    outside the village. Griots go into the tree that already houses mammam. The baobab of unit 3 is not
    a dump. It is a preferred dwelling of spirits. To return a griot there is to assign a caste of speech
    to the tree-house rather than to the earth-mound. Colonial caste-sneer is refused. The griot remains
    apart in life (unit 22); in death that apartness is topological. Song and praise-speech belong to
    a different hollow than farming bodies. Existentially, the teaching is that equality of ceremonial
    care does not require identical placement. A society can honor two residences without pretending everyone
