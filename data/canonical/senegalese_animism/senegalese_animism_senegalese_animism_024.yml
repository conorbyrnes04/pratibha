unit_label: The Griot Is Returned to the Hollow Baobab
title: The Griot Is Returned to the Hollow Baobab
unit_type: teaching_passage
commentary: 'The claim is that some souls have a different residence, not a lesser rite. Lasnet''s verb
  jette can sound like contempt. The next clause blocks that reading: the same ceremonial as the others.
  Wrapping in pagnes is the same honor. What changes is the house. Ordinary Serer go into an east-facing
  tumulus outside the village. Griots go into the tree that already houses mammam. The baobab of unit
  3 is not a dump. It is a preferred dwelling of spirits. To return a griot there is to assign a caste
  of speech to the tree-house rather than to the earth-mound. Colonial caste-sneer is refused. The griot
  remains apart in life (unit 22); in death that apartness is topological. Song and praise-speech belong
  to a different hollow than farming bodies. Existentially, the teaching is that equality of ceremonial
  care does not require identical placement. A society can honor two residences without pretending everyone
  is the same kind of dead. You cannot found a griot-tree. You can ask, of your own end, whether you have
  only imagined one generic hole, and whether some lives you know already belong to a different house.'
