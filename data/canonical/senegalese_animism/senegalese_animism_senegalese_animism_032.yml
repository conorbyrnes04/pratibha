unit_label: They Live Where They Were Born
title: They Live Where They Were Born
unit_type: teaching_passage
commentary: 'The claim is that the good life is staying. Bérenger, who wanted roads and quiet producers
  for French commerce, almost blesses this temperament. His use of it is not the teaching. The teaching
  is the ethic inside the cult. A people who name God as sky, address mammam of field and house, pour
  first-fruits, bury facing east, and refuse voluntary exile will also describe the happy life as remaining
  in the fold of earth that already knows their dead. Grouped by families is not a demographic note. It
  is unit 9 in a landscape sentence: the cult-cell is visible from a hill. Comparison with the Soninke
  (Sarakole) love of migration makes the point by contrast. Senegambia contains both ethics. Serer cosaan
  is the staying one. Yield (belles récoltes) is not capitalism; it is Tiurakh answered by people who
  did not wander off the bond. Existentially, this unit will accuse most of its readers. The answer is
  not to fake a peasant life. It is to stop calling motion the only adult virtue, and to practice one
  form of staying — a field, a street, a dead, a tree — as if the fold of land could still report a harvest.'
