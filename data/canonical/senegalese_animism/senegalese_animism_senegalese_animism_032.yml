pratibha_layers:
- kind: original
  label: Original
  body: Les Sérères sont doux, vivent sur leur sol auquel ils sont extrêmement attachés et ont aussi peu
    l'amour de la migration que les Sarakolais l'ont beaucoup. Ils passent volontiers leur vie là où ils
    sont nés, groupés par familles dans un pli de terrain qu'ils ont mis en culture et auquel ils font
    rapporter de belles récoltes.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Ethical temperament of cosaan: live where
    you were born, grouped by families in a fold of cultivated land. Little love of migration.'
- kind: translation
  label: Pratibha Translation
  body: The Serer are gentle, live on their soil to which they are extremely attached, and have as little
    love of migration as the Soninke have much. They willingly pass their lives where they were born,
    grouped by families in a fold of land they have put under cultivation and made to yield fine harvests.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the good life is staying. Bérenger, who wanted roads and quiet producers for
    French commerce, almost blesses this temperament. His use of it is not the teaching. The teaching
    is the ethic inside the cult. A people who name God as sky, address mammam of field and house, pour
    first-fruits, bury facing east, and refuse voluntary exile will also describe the happy life as remaining
    in the fold of earth that already knows their dead. Grouped by families is not a demographic note.
    It is unit 9 in a landscape sentence: the cult-cell is visible from a hill. Comparison with the Soninke
    (Sarakole) love of migration makes the point by contrast. Senegambia contains both ethics. Serer cosaan
    is the staying one. Yield (belles récoltes) is not capitalism; it is Tiurakh answered by people who
    did not wander off the bond. Existentially, this unit will accuse most of its readers. The answer
    is not to fake a peasant life. It is to stop calling motion the only adult virtue, and to practice
    one form of staying — a field, a street, a dead, a tree — as if the fold of land could still report
    a harvest.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sol
    definition: the soil they live on and are extremely attached to -> the partner of the family dead
      -> "countryside" as tourism misses the vow
  - term: pli de terrain
    definition: a fold of land grouped by families and put under cultivation -> the visible cell of ancestor-land
      cult -> not a nation-state and not a farm brand
  - term: amour de la migration
    definition: love of migration, which the Serer have little of -> the contrasting ethic (Soninke) proves
      this is a choice of cosmos, not a lack of roads
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Micah 4:4 (each under his vine and fig tree)
    resonance: Both imagine the good life as staying on a particular cultivated ground rather than as
      conquest or flight.
    divergence: Micah's peace is eschatological under YHWH; Bérenger's Serer staying is present-tense
      cosaan on a family fold, with Roog unaddressed.
  - citation: Lasnet's jamais volontairement (this collection, unit 17)
    resonance: Both make non-departure the Serer religious temperament, not a tourist trait.
    divergence: Lasnet stresses the sanction (refused burial); Bérenger stresses the willing life where
      one was born and the harvest that follows.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Stay in one actual fold today: one room, one block, one field-edge. Do one cultivating act there
    (clean, water, mend, cook) as if yield still mattered to the dead of that place. Do not plan a departure
    while you do it.'
