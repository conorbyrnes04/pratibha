pratibha_layers:
- kind: original
  label: Original
  body: 'À chaque mort un voyant, gisanekal, recherche le mangeur d''âme, le plus souvent il a recours
    au poison comme les Balantes ou les Diolas, quelquefois à l''épreuve du feu : un fer rouge est posé
    sur la langue de l''accusé, s''il fait une brûlure profonde, l''accusé est coupable.'
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key Serer term: gisanekal — the seer who searches
    the soul-eater at each death. Poison and fire are recorded methods, not a practice to copy.'
- kind: translation
  label: Pratibha Translation
  body: 'At each death a seer, gisanekal, searches for the eater of the soul. Most often the search uses
    the poison ordeal known also among the Balanta and the Jola; sometimes the test of fire: a red iron
    is set on the tongue of the accused, and a deep burn marks guilt.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a death which may be soul-theft is not left as private grief. The community
    appoints a seer. Gisanekal is Lasnet''s recording of that office: a watcher whose job is to find the
    eater. The contested move is to take the office seriously without adopting the ordeal as teaching.
    Poison and red iron are how a 1900 observer saw truth extracted from a hidden crime. They are not
    the philosophy. The philosophy is that soul-theft is a public question, and that someone in the village
