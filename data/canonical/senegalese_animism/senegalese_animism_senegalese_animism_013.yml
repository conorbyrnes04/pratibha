unit_label: Gisanekal Searches the Soul-Eater
title: Gisanekal Searches the Soul-Eater
unit_type: teaching_passage
commentary: 'The claim is that a death which may be soul-theft is not left as private grief. The community
  appoints a seer. Gisanekal is Lasnet''s recording of that office: a watcher whose job is to find the
  eater. The contested move is to take the office seriously without adopting the ordeal as teaching. Poison
  and red iron are how a 1900 observer saw truth extracted from a hidden crime. They are not the philosophy.
  The philosophy is that soul-theft is a public question, and that someone in the village is authorized
  to look. Without that office, unit 12 collapses into panic or gossip. With it, the fear of eaten souls
  has a face and a procedure. Bérenger will show Takhar''s priests judging sorcery by a drink; Lasnet
  names the seer at every death. Read together, Serer justice is not only about stolen objects. It is
  about stolen life. Colonial suppression of the punishments is recorded on the same page: the Serer then
  say sorcerers multiply because they are sure of impunity, and they accuse missionaries of favoring the
  eaters by making people renounce gris-gris. That complaint is not adopted here as a call to restore
  ordeal. It is evidence that protective objects and the seer''s search were one system. Existentially,
  the teaching asks whether your world has anyone who is allowed to look when a life is being eaten, or
  whether you only have opinions and news. The practice is to authorize attention, not to heat iron.'
