- kind: key_terms
  label: Key Terms
  items:
  - term: gisanekal
    definition: Lasnet's Serer word for the seer who searches the soul-eater at each death -> an office,
      not a hobby of omens -> "witch-doctor" is the colonial sneer; this is authorized looking
  - term: mangeur d'âme
    definition: eater of the soul -> the agent of the theft in unit 12 -> not a metaphor for cancer; in
      the reported belief a someone has consumed a someone
  - term: épreuve
    definition: ordeal (poison, fire) -> recorded method of the search -> not the teaching to practice;
      the teaching is that hidden soul-crime is not left to rumor
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 1 Samuel 28 (Saul seeks a seer when ordinary means fail)
    resonance: Both appoint a specialist of the unseen when a public crisis exceeds ordinary looking.
    divergence: Saul's seer calls up a dead prophet against a ban; gisanekal searches the living eater
      of a newly dead soul.
  - citation: Bérenger 1879, priests of Takhar and the ordeal drink (this collection)
    resonance: Both make sorcery a judged question, not a private suspicion.
    divergence: Bérenger's drink is a priestly test of the accused; Lasnet's gisanekal is a seer who starts
      from the death itself.
- kind: practice
  label: Practice (Abhyasa)
  body: 'If you know a life that is being diminished — including your own — do not ordeal anyone. Appoint
    yourself seer for one hour: look, name the eater without spectacle (a habit, a silence, a person),
    and take one protective step. Do not announce guilt you cannot know.'
