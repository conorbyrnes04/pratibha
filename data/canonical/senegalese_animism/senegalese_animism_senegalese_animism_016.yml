pratibha_layers:
- kind: original
  label: Original
  body: Les circoncis sont ensuite séquestrés sous un abri en dehors du village, ils ne peuvent sortir,
    le premier venu qui les rencontrerait aurait le droit de les rouer de coups; les parents doivent pourvoir
    à leurs besoins, on les nourrit bien et abondamment. Quand la guérison est complète, on commence la
    fête, les circoncis quittent leur abri, le brûlent et vont dans les villages danser.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Threshold teaching: seclusion under a shelter
    outside the village; then the shelter is burned and the initiates re-enter dancing. Anatomy is not
    the unit.'
- kind: translation
  label: Pratibha Translation
  body: 'The initiates are then secluded under a shelter outside the village. They may not go out; anyone
    who met them would have the right to beat them. The parents must provide for their needs; they are
    fed well and abundantly. When healing is complete, the feast begins: the initiates leave their shelter,
    burn it, and go into the villages to dance.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that becoming adult is a change of residence before it is a change of status. Lasnet''s
    medical catalog is refused here. What is kept is the topology. The boys leave the village. They live
    under a shelter that is not a house. They may not wander. Meeting them in that in-between is already
    a violation. Parents feed them from the village they cannot yet re-enter. Then the shelter is burned.
    Return is not a quiet walk home. It is fire plus dance. The contested move is to read this as threshold
