unit_label: Initiation Seclusion Outside the Village
title: Initiation Seclusion Outside the Village
unit_type: teaching_passage
commentary: 'The claim is that becoming adult is a change of residence before it is a change of status.
  Lasnet''s medical catalog is refused here. What is kept is the topology. The boys leave the village.
  They live under a shelter that is not a house. They may not wander. Meeting them in that in-between
  is already a violation. Parents feed them from the village they cannot yet re-enter. Then the shelter
  is burned. Return is not a quiet walk home. It is fire plus dance. The contested move is to read this
  as threshold philosophy rather than as ethnography of a body-cut. A person who will later refuse to
  leave ancestral land must first learn what it is to be outside it, fed by it, and forbidden to stroll.
  The burning of the abri says: the liminal camp is not a second village you keep. You do not colonize
  the threshold. You destroy the hut that made you not-yet. Existentially, most modern initiations are
  either medical events or branding exercises that never leave the house. This teaching asks for an actual
  outside, an actual dependence, and an actual burning of the temporary self. You cannot found a Serer
  camp. You can leave one comfort, let yourself be fed by others without controlling the menu, and destroy
  the prop when you come back.'
