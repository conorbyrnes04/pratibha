    the prop when you come back.'
- kind: key_terms
  label: Key Terms
  items:
  - term: en dehors du village
    definition: outside the village -> the spatial definition of the threshold -> "retreat" as a spa weekend
      misses that the village is forbidden
  - term: abri
    definition: shelter, not a house -> the liminal dwelling that must later be burned -> keeping the
      camp would make seclusion a second residence
  - term: le brûlent
    definition: they burn it -> the threshold is destroyed, not archived -> modern "integration" often
      keeps every hut; this rite refuses that
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: van Gennep's tripartite rite (separation, margin, aggregation) as later theory of this shape
    resonance: Both describe leaving, living in a marked outside, and returning changed.
    divergence: van Gennep generalizes; Lasnet records a Serer burning of the shelter and a dance back
      into the villages.
  - citation: Benedictine novitiate outside full profession
    resonance: Both feed a person who is not yet a full member from the house that still withholds belonging.
    divergence: The monastery keeps the novitiate building; the Serer initiates burn the abri so the in-between
      cannot be inhabited again.
- kind: practice
  label: Practice (Abhyasa)
  body: Leave your usual room for one hour. Sit somewhere that is not yours — a stair, a park edge, a
    doorway. Eat something given or already prepared, not something you cook as host. When you return,
    throw away or recycle one object that was propping an old version of you. Do not announce an initiation.
