sanskrit_devanagari: Ils ont deux Dieux; d'une part Takhar qui préside à la justice, d'autre part Théourakh qui dispose de
  tous les biens. Ces deux dieux habitent dans les plus grands arbres des forêts, de sorte que les bois sont pour les Sérères
  des lieux sacrés, et les arbres séculaires des sanctuaires vénérés. Le Théourackh est le Dieu qui donne d'abondantes récoltes,
  fait prospérer les familles, les individus et les troupeaux. On le rend favorable à sa maison en déposant auprès de certains
  arbres désignés, des cadeaux.
sanskrit_iast: 'Not applicable. Key Serer theonyms as recorded in 1879 French: *Takhar* (justice); *Théourakh* / *Théourackh*
  (later spelling *Tiurakh* / *Tulrakh*, wealth and increase).'
translation_literal: 'They have two Gods: on one side Takhar, who presides over justice; on the other Tiurakh, who disposes
  of all goods. These two gods inhabit the greatest trees of the forests, so that the woods are sacred places for the Serer,
  and the age-old trees venerated sanctuaries. Tiurakh is the God who gives abundant harvests and makes families, persons,
  and herds prosper. One renders him favorable to one''s house by depositing gifts beside certain designated trees.'
commentary: 'The claim is that the inhabited middle of Serer religion is not a chaos of "fetishes" but a moral-economic pair.
  Takhar is justice. Tiurakh is increase. Bérenger-Féraud, for all his colonial disdain in the surrounding paragraphs, records
  a theology with a clear axis: rightness and prosperity are distinct powers, both tree-dwelling, both approached in the forest.
  This complements Lasnet rather than canceling him. Lasnet recorded the unaddressed sky-God (*Rog* / *Koch*) and the many
  *mammam*. Bérenger recorded two named powers inside that many. Read together, the PD dossier gives a three-tier map: Roog
  as invisible master; Takhar and Tiurakh as named departmental sovereignties of justice and goods; countless local spirits
  of spring, field, and house.


  The forest as sanctuary follows from dwelling. If justice and increase inhabit the greatest trees, then to enter the woods
  is already to enter a court and a granary. "Sacred grove" is not romantic scenery. It is institutional space without masonry.
  The age of the tree matters: *arbres séculaires* — beings that have already outlasted human lawsuits and harvests. Justice
  that lives in a centuries-old tree is not the justice of the latest strong man. Increase that lives there is not identical
  with this year''s profit.


  Existentially, the pairing is a check on spiritual greed. A religion of only Tiurakh would be a prosperity cult. A religion
  of only Takhar would be ordeal and fear. Senegalese animism, in this source, holds both: you may ask for the herd to multiply,
  and you still live under a justice that is not yours to administer as appetite. Gifts at the designated tree are how a house
  stays in relation to increase without pretending to own the source.


  Key Terms:


  **Takhar** - Serer power who presides over justice (Bérenger 1879) -> later sources also call Takhar the god of vengeance
  or just retribution -> "judge-god" in a Greco-Roman sense over-personalizes; Takhar is justice as a living forest presence.


  **Théourakh / Tiurakh** - the god who disposes of all goods, abundant harvests, family and herd prosperity -> not a devil
  of materialism; increase as a sacred power -> "wealth god" in a modern market sense misses that the gift is deposited at
  a tree for the house, not accumulated as capital.


  **sanctuaires vénérés** - venerated sanctuaries -> the sanctuary *is* the age-old tree -> "temple" imports walls the PD
  sources say the Serer do not build for Roog.


  **bois / forêts** - woods as sacred places because the two gods inhabit the greatest trees -> sacred geography, not scenery
  -> "nature spirituality" is too generic; these are particular groves.


  Cross-Tradition Resonances:


  **Plato, *Republic* I–II (justice vs. advantage):** Both refuse to collapse justice into whatever produces goods.

  *Divergence:* Plato argues dialectically in a city; Serer teaching locates the distinction in two tree-dwelling powers.


  **Bhagavad Gītā 3.10–3.13 (sacrifice and the cycle of increase):** Both bind prosperity to offering rather than to seizure.

  *Divergence:* The Gītā''s rite is Vedic-devotional toward a cosmic *yajña*; Tiurakh is approached at designated trees for
  the house.


  **West African Vodun (not PD here, structural only):** Both departmentalize justice and plenty among named powers under
  a high God who is not the daily addressee.

  *Divergence:* Vodun has a different pantheon and initiatory corpus; the Serer pair in this source is specifically Takhar/Tiurakh
  in the Senegambian forest.'
insight: The claim is that the inhabited middle of Serer religion is not a chaos of "fetishes" but a moral-economic pair.
practice: 'At day''s end, sort one event into Takhar or Tiurakh: was this about rightness, or about increase? Do not let the
  desire for goods write the verdict of justice. If you ask for increase, name a corresponding rightness you will keep.'
