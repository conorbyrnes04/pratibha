- kind: key_terms
  label: Key Terms
  items:
  - term: âme
    definition: soul as what can be eaten -> the personal life, not the corpse -> "life-force" is too
      impersonal; this is a someone who can be consumed
  - term: enveloppe
    definition: the intact bodily envelope that saves appearances -> visible wholeness as insufficient
      evidence -> "body" as the whole person is the error this word blocks
  - term: mauvais sort
    definition: a bad working, a harmful sending -> Lasnet's gloss for the cause of most deaths -> "curse"
      in a fairy-tale sense is too light; this is soul-theft
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 10:28 (fear not those who kill the body but cannot kill the soul)
    resonance: Both refuse to treat the killing or stopping of the body as the last account of the person.
    divergence: Matthew splits body and soul to rank fear toward God; the Serer report fears a soul that
      can be eaten while the body still looks intact.
  - citation: Phaedo 64c–67a (the body as a garment or prison of the soul)
    resonance: Both treat the visible body as not identical with the person.
    divergence: Plato wants the soul freed from the body; Lasnet's Serer fear a soul taken from a body
      that has not yet been allowed to finish its office.
- kind: practice
  label: Practice (Abhyasa)
  body: Look at your own body as an envelope that can look well while something is being taken. Name one
    vitality you have been letting a habit or a relation eat. Take it back today by one protective act
    — a meal, sleep, a boundary — not a charm.
