pratibha_layers:
- kind: original
  label: Original
  body: 'Très superstitieux, les Sérères ont une grande peur des sorciers, ils admettent peu la mort naturelle
    et la rapportent le plus souvent à un mauvais sort : l''âme a été mangée, son enveloppe restant intacte
    pour sauver les apparences.'
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key teaching: the soul (âme) can be eaten
    while the envelope (enveloppe) remains intact. Lasnet''s "superstitious" is observer contempt, not
    the doctrine.'
- kind: translation
  label: Pratibha Translation
  body: 'The Serer admit natural death only rarely and most often refer a death to a bad working: the
    soul has been eaten, its envelope remaining intact to save appearances.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a person is not identical with the visible envelope. A body can look whole
