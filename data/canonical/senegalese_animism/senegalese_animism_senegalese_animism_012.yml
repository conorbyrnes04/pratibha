unit_label: The Soul Can Be Eaten While the Envelope Stays Intact
title: The Soul Can Be Eaten While the Envelope Stays Intact
unit_type: teaching_passage
commentary: 'The claim is that a person is not identical with the visible envelope. A body can look whole
  — washed, oiled, still warm — while the life that made it a someone has already been taken. Lasnet hears
  this as superstition and fear of sorcerers. The recoverable philosophy is stricter. Death is not first
  a medical event. Death is first a question about the soul: was it released into a bird, or was it eaten?
  The envelope that "saves appearances" is a warning against naive empiricism. What you can see is not
  a sufficient account of what has happened. This is the dark twin of unit 5. There, joy at a bird means
  the soul found another vehicle. Here, an intact corpse can mean the opposite: the vehicle is still parked
  and the driver has been consumed. Colonial pages will rush to poison and fire as the "real" story. Those
  methods are recorded; they are not this unit''s teaching. The teaching is the distinction between envelope
  and soul, and the refusal to call every stopping of breath natural. Existentially, the passage trains
  a vigilance that modern wellness language cannot host. You can look successful, fed, photogenic, and
  still be having your life eaten — by a relation, a habit, a workplace, a grief you will not name. The
  Serer report is not an invitation to hunt witches. It is a metaphysics in which the visible body is
  not the last word on whether a life is still there.'
