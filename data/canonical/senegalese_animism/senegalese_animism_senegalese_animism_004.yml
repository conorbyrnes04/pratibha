    you still live under a justice that is not yours to administer as appetite. Gifts at the designated
    tree are how a house stays in relation to increase without pretending to own the source.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Takhar
    definition: Serer power who presides over justice (Bérenger 1879) -> later sources also call Takhar
      the god of vengeance or just retribution -> "judge-god" in a Greco-Roman sense over-personalizes;
      Takhar is justice as a living forest presence
  - term: Théourakh / Tiurakh
    definition: the god who disposes of all goods, abundant harvests, family and herd prosperity -> not
      a devil of materialism; increase as a sacred power -> "wealth god" in a modern market sense misses
      that the gift is deposited at a tree for the house, not accumulated as capital
  - term: sanctuaires vénérés
    definition: venerated sanctuaries -> the sanctuary is the age-old tree -> "temple" imports walls the
      PD sources say the Serer do not build for Roog
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Republic I–II (justice vs. advantage)
    resonance: Both refuse to collapse justice into whatever produces goods.
    divergence: Plato argues dialectically in a city; Serer teaching locates the distinction in two tree-dwelling
      powers.
  - citation: Bhagavad Gītā 3.10–3.13 (sacrifice and the cycle of increase)
    resonance: Both bind prosperity to offering rather than to seizure.
    divergence: The Gītā's rite is Vedic-devotional toward a cosmic yajña; Tiurakh is approached at designated
      trees for the house.
- kind: practice
  label: Practice (Abhyasa)
  body: 'At day''s end, sort one event into Takhar or Tiurakh: was this about rightness, or about increase?
    Do not let the desire for goods write the verdict of justice. If you ask for increase, name a corresponding
    rightness you will keep.'
