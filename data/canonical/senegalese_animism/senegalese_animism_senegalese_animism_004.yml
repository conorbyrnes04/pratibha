pratibha_layers:
- kind: original
  label: Original
  body: Ils ont deux Dieux; d'une part Takhar qui préside à la justice, d'autre part Théourakh qui dispose
    de tous les biens. Ces deux dieux habitent dans les plus grands arbres des forêts, de sorte que les
    bois sont pour les Sérères des lieux sacrés, et les arbres séculaires des sanctuaires vénérés. Le
    Théourackh est le Dieu qui donne d'abondantes récoltes, fait prospérer les familles, les individus
    et les troupeaux. On le rend favorable à sa maison en déposant auprès de certains arbres désignés,
    des cadeaux.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key Serer theonyms as recorded in 1879 French:
    Takhar (justice); Théourakh / Théourackh (later spelling Tiurakh / Tulrakh, wealth and increase).'
- kind: translation
  label: Pratibha Translation
  body: 'They have two Gods: on one side Takhar, who presides over justice; on the other Tiurakh, who
    disposes of all goods. These two gods inhabit the greatest trees of the forests, so that the woods
    are sacred places for the Serer, and the age-old trees venerated sanctuaries. Tiurakh is the God who
    gives abundant harvests and makes families, persons, and herds prosper. One renders him favorable
    to one''s house by depositing gifts beside certain designated trees.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the inhabited middle of Serer religion is not a chaos of "fetishes" but a moral-economic
    pair. Takhar is justice. Tiurakh is increase. Bérenger-Féraud, for all his colonial disdain in the
    surrounding paragraphs, records a theology with a clear axis: rightness and prosperity are distinct
    powers, both tree-dwelling, both approached in the forest. This complements Lasnet rather than canceling
    him. Lasnet recorded the unaddressed sky-God (Rog / Koch) and the many mammam. Bérenger recorded two
    named powers inside that many. Read together, the PD dossier gives a three-tier map: Roog as invisible
    master; Takhar and Tiurakh as named departmental sovereignties of justice and goods; countless local
    spirits of spring, field, and house. The forest as sanctuary follows from dwelling. If justice and
    increase inhabit the greatest trees, then to enter the woods is already to enter a court and a granary.
    "Sacred grove" is not romantic scenery. It is institutional space without masonry. The age of the
    tree matters: arbres séculaires — beings that have already outlasted human lawsuits and harvests.
    Justice that lives in a centuries-old tree is not the justice of the latest strong man. Increase that
    lives there is not identical with this year''s profit. Existentially, the pairing is a check on spiritual
    greed. A religion of only Tiurakh would be a prosperity cult. A religion of only Takhar would be ordeal
