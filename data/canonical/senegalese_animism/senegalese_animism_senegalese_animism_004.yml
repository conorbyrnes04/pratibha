unit_label: Takhar of Justice, Tiurakh of Increase
title: Takhar of Justice, Tiurakh of Increase
unit_type: teaching_passage
commentary: 'The claim is that the inhabited middle of Serer religion is not a chaos of "fetishes" but
  a moral-economic pair. Takhar is justice. Tiurakh is increase. Bérenger-Féraud, for all his colonial
  disdain in the surrounding paragraphs, records a theology with a clear axis: rightness and prosperity
  are distinct powers, both tree-dwelling, both approached in the forest. This complements Lasnet rather
  than canceling him. Lasnet recorded the unaddressed sky-God (Rog / Koch) and the many mammam. Bérenger
  recorded two named powers inside that many. Read together, the PD dossier gives a three-tier map: Roog
  as invisible master; Takhar and Tiurakh as named departmental sovereignties of justice and goods; countless
  local spirits of spring, field, and house. The forest as sanctuary follows from dwelling. If justice
  and increase inhabit the greatest trees, then to enter the woods is already to enter a court and a granary.
  "Sacred grove" is not romantic scenery. It is institutional space without masonry. The age of the tree
  matters: arbres séculaires — beings that have already outlasted human lawsuits and harvests. Justice
  that lives in a centuries-old tree is not the justice of the latest strong man. Increase that lives
  there is not identical with this year''s profit. Existentially, the pairing is a check on spiritual
  greed. A religion of only Tiurakh would be a prosperity cult. A religion of only Takhar would be ordeal
  and fear. Senegalese animism, in this source, holds both: you may ask for the herd to multiply, and
  you still live under a justice that is not yours to administer as appetite. Gifts at the designated
  tree are how a house stays in relation to increase without pretending to own the source.'
