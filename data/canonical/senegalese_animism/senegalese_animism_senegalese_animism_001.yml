- kind: key_terms
  label: Key Terms
  items:
  - term: Rog / Roog
    definition: Serer word for sky and for the supreme being -> God is not a being in the sky so much
      as the sky-name of the invisible master -> translating only as "God" loses the refusal of images;
      translating only as "sky" loses moral sovereignty
  - term: Koch / Koox
    definition: 'Noon / Cangin name of the same supreme being (Lasnet: koch none) -> the Noon are among
      the Serer groups most resistant to conversion in the PD sources -> default "local deity" misses
      that this is the same philosophical absolute under another language'
  - term: être invisible
    definition: 'invisible being -> Lasnet''s phrase already blocks idol-theory: the master is not the
      tree, the stone, or the gris-gris -> reducing the religion to "fetishism" contradicts the opening
      sentence of the very source that was supposed to prove it'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśāvāsya Upaniṣad 1
    resonance: Both begin from a totality that already envelops the world, so that the sacred is not added
      to objects but recognized as their covering.
    divergence: The Upaniṣad names that covering as the Lord (īśā) in a Vedic-renunciatory key; Serer
      teaching names it as the sky and then, in practice, withholds direct cult from it.
  - citation: Dào Dé Jīng 1 and 25
    resonance: Both refuse a graspable name for the highest and use a cosmic analog (way, sky) rather
      than a statue.
    divergence: Daoist emptiness is non-theistic; Serer Rog remains a master who regards the good.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand where you can see open sky. For three minutes do not pray to it and do not photograph it.
    Let the sky be the analog of what you cannot make into an object. Then name one ordinary good you
    will practice today as if it were already seen.
