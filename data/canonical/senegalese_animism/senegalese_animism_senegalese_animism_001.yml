pratibha_layers:
- kind: original
  label: Original
  body: Les Sérères croient à l'existence d'un être invisible, maître de toutes choses, qui habite le
    ciel au-dessus des nuages et qui voit avec satisfaction les hommes pratiquer le bien; ils le désignent
    du même nom que le ciel, rog sérère, koch none.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key Serer terms: Rog / Roog (Serer-Sine: sky,
    God); Koch / Koox (Serer-Noon / Cangin: the same supreme being).'
- kind: translation
  label: Pratibha Translation
  body: 'There is an invisible master of all things. That master inhabits the sky above the clouds, sees
    human conduct, and takes satisfaction in those who practice the good. The Serer name this master with
    the same word they use for the sky itself: Rog among the Sine, Koch among the Noon.'
