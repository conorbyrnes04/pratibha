pratibha_layers:
- kind: original
  label: Original
  body: Ils résident volontiers dans certains arbres comme le baobab; pour se les rendre favorables on
    fait au pied des arbres ou sur des pierres consacrées des libations de lait ou d'eau coupée de farine
    de mil et parfois des sacrifices d'animaux, les prémices de la récolte leur sont toujours offertes.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Practice terms: baobab as spirit-dwelling;
    libation of milk or millet-water; consecrated stones (pierres consacrées); first-fruits (prémices).'
- kind: translation
  label: Pratibha Translation
  body: The spirits willingly reside in certain trees, such as the baobab. To render them favorable, one
    makes, at the foot of the trees or upon consecrated stones, libations of milk or of water mixed with
    millet flour, and sometimes animal offerings. The first-fruits of the harvest are always offered to
    them.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that favor is not purchased from a sky-god but cultivated where a spirit already
