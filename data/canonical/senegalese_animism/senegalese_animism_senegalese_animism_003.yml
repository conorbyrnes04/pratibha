- kind: key_terms
  label: Key Terms
  items:
  - term: baobab
    definition: the great tree of the Senegambian landscape, a preferred dwelling of spirits in Lasnet
      -> not a metaphor for strength; a house of the mammam -> "sacred tree" in tourist English misses
      that residence, not decoration, is the point
  - term: pierres consacrées
    definition: consecrated stones -> a stone can be set apart as an addressable surface -> not every
      stone is sacred; consecration localizes the infinite middle of unit 2
  - term: prémices
    definition: 'first-fruits of the harvest, always offered -> the economic theology of animism: increase
      is answered before it is stored -> "tithe" is too fiscal; this is the first taste returned to the
      dwellers of the land'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hebrew Bible, first-fruits and standing stones (Exodus 23:19; Genesis 28:18)
    resonance: Both mark land-relation by offering the first of the yield and by setting a stone as a
      witness.
    divergence: Biblical first-fruits go to YHWH through priesthood; Serer first-fruits go to the local
      spirits who actually inhabit the field and tree.
  - citation: Shinto offerings at a shinboku (marked tree)
    resonance: Both treat a marked tree as a dwelling and pour or present ordinary life-stuff there.
    divergence: Shinto shrine protocol is highly formalized; Lasnet's Serer rite is household-agricultural
      and described without a temple staff.
- kind: practice
  label: Practice (Abhyasa)
  body: Take water (or milk if you have it). Choose one actual tree or one stone you will return to, not
    "nature." Pour a little at its foot. Say, inwardly, that the first of what sustains you is not yours
    to keep. Do not perform this as a spell for gain. Perform it as the admission that the place is already
    inhabited.
