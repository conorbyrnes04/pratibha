unit_label: Libation at the Baobab and the Consecrated Stone
title: Libation at the Baobab and the Consecrated Stone
unit_type: teaching_passage
commentary: 'The claim is that favor is not purchased from a sky-god but cultivated where a spirit already
  dwells. The baobab is not a symbol of the spirit; it is a residence. Lasnet''s verb is résident: they
  live there. Practice therefore has a topology. You do not close your eyes and send a wish upward. You
  go to the foot of the tree or to a stone that has been set apart (pierres consacrées) and you pour.
  The materials are ordinary and exact: milk, or water cut with millet flour. This is not spectacle. It
  is the household''s own food-world returned at the root of the tree that outlives households. Millet
  is the staple; water is life; milk is increase. To pour them is to admit that the harvest and the herd
  were never only yours. The "always" of first-fruits — leur sont toujours offertes — makes the rite structural
  rather than occasional. Before the human eats as owner, the spirits eat as hosts. Bérenger-Féraud''s
  1879 chapter confirms the same tree-sanctuary from another observer: the great trees of the forest are
  the Serer''s venerated sanctuaries because Takhar and Tiurakh inhabit them. The two PD sources agree
  on the practice even when they disagree on pantheon names. That agreement is what makes the rite usable:
  libation at tree and stone is the public form of Senegalese animist relation. Existentially, the teaching
  is anti-abstraction. Gratitude that never leaves the head is not this religion. The body has to carry
  milk to a root. The stone has to be one stone, not "nature in general." Animism here is not a mood about
  Gaia; it is a repeated pouring at a particular foot of a particular tree.'
