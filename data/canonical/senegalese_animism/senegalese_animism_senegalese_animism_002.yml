unit_label: One Does Not Address God; One Addresses the Spirits
title: One Does Not Address God; One Addresses the Spirits
unit_type: teaching_passage
commentary: 'The claim is hierarchical and liturgical at once: the absolute is known, and the absolute
  is not the addressee of ordinary prayer. Lasnet''s sentence is the hinge of Senegalese animist philosophy
  as the PD sources can state it. Belief "especially" (surtout) in the spirits does not cancel the previous
  unit''s invisible master; it locates where relationship happens. You do not shout at the sky. You speak
  where life is locally thick — forest, field, fountain, village, house. This is the opposite of atheism
  and the opposite of idolatry. It is mediation. Later Serer language names the mediators pangool: sanctified
  ancestors and other-than-human powers who stand between the living and Roog. Lasnet''s mammam is the
  1900 ethnographic word for that populated middle. Each place has a genius because each place is a life,
  not a dead backdrop. The house is not spiritually empty until you import a god into it. The house already
  has a spirit because dwelling is already a relation. Delafosse''s pan-African analysis fits the Serer
  report with unusual exactness: the creator is a cosmogonic idea; cult belongs to souls that are free
  to act in the near world — the dead, and the localized souls of land and water. The "never" of ne s''adressent
  jamais à Dieu is therefore not neglect. It is reverence. Direct address would treat Roog as a department,
  a patron you can corner. The spirits are how a world that is alive can be spoken to without reducing
  the sky to a customer. Existentially, the teaching cuts two modern errors. One is that God must be constantly
  accosted or religion has failed. The other is that matter is mute. Senegalese animism, in this source,
  says: keep the highest high, and keep the near world addressable. Practice happens in the middle.'
