pratibha_layers:
- kind: original
  label: Original
  body: Ils croient surtout aux esprits, mammam, et ne s'adressent jamais à Dieu; ces esprits sont très
    nombreux, il y a le génie de la forêt, des champs, de la fontaine, du village, de la case, etc.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key Serer terms: mammam (spirits actually
    addressed); pangool (later Serer name for ancestral and other-than-human intercessors).'
- kind: translation
  label: Pratibha Translation
  body: 'They believe above all in the spirits, mammam, and they never address themselves to God. These
    spirits are very numerous: there is the genius of the forest, of the fields, of the spring, of the
    village, of the house, and so on.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is hierarchical and liturgical at once: the absolute is known, and the absolute is
    not the addressee of ordinary prayer. Lasnet''s sentence is the hinge of Senegalese animist philosophy
    as the PD sources can state it. Belief "especially" (surtout) in the spirits does not cancel the previous
    unit''s invisible master; it locates where relationship happens. You do not shout at the sky. You
    speak where life is locally thick — forest, field, fountain, village, house. This is the opposite
    of atheism and the opposite of idolatry. It is mediation. Later Serer language names the mediators
    pangool: sanctified ancestors and other-than-human powers who stand between the living and Roog. Lasnet''s
    mammam is the 1900 ethnographic word for that populated middle. Each place has a genius because each
    place is a life, not a dead backdrop. The house is not spiritually empty until you import a god into
