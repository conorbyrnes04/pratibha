- kind: key_terms
  label: Key Terms
  items:
  - term: mammam
    definition: Lasnet's term for the spirits the Serer actually address -> the operational divine, not
      the philosophical absolute -> "ghosts" is too thin; "gods" is too Olympian; they are local personal
      powers of places and dwellings
  - term: pangool
    definition: Serer ancestral and saintly spirits (not named in Lasnet; the structure is already here)
      -> later sources make explicit that one reaches Roog through the pangool -> using only "ancestors"
      misses that some pangool are other-than-human and tied to land
  - term: ne s'adressent jamais à Dieu
    definition: they never address themselves to God -> liturgical withholding, not unbelief -> English
      "they don't pray" is false; they pray, but not to Roog as if Roog were a nearby specialist
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijñāhṛdayam 1–2
    resonance: Both distinguish a sovereign ground from the forms in which that ground becomes approachable.
    divergence: Kashmir Śaiva teaching identifies the ground with consciousness itself; Serer teaching
      keeps Roog unaddressed and routes practice through local spirits.
  - citation: Shinto kami of spring, grove, and house
    resonance: Both populate springs, groves, and dwellings with addressable presence rather than emptying
      the world for a distant God.
    divergence: Shinto has shrine architecture and a written mythic corpus; Serer address in this source
      is tree, stone, and household, without a temple of Roog.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, do not address a remote absolute. Address what is actually near: the room, the water you
    drink, the ground you cross. Silently acknowledge each as already inhabited. Ask nothing of God-as-sky.
    Keep the highest high by speaking to the middle.'
