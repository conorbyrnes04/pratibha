- kind: key_terms
  label: Key Terms
  items:
  - term: village d'origine de sa mère
    definition: the mother's village of origin -> the required ground of first birth -> "hometown" is
      too sentimental; this is a religious address of the new soul
  - term: premier enfant
    definition: the first child -> the first fruit of the marriage, claimed by the mother's land -> later
      children may arrive elsewhere; the first is oriented
  - term: pangool
    definition: the ancestral and land powers of the mother's village who receive that first arrival ->
      not named by Lasnet here, but the structure of units 2 and 9 requires them
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ruth 1:16–17 and the question of whose people and whose God
    resonance: Both treat a woman's ground and a woman's people as the frame in which a next generation
      is possible.
    divergence: Ruth attaches herself to Naomi's people and God; Serer first birth returns the child to
      the mother's village without converting the high God into the addressee.
  - citation: Roman custom of the child raised to the father (tollere liberos)
    resonance: Both make first recognition of a child a public cosmological act, not a private feeling.
    divergence: The Roman father lifts the child into the paternal line; Serer rule gives the first birth
      to the mother's ground.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the actual place of your own first days — town, house, or the nearest truth you have. Speak
    one sentence of thanks toward that ground. If you can reach water, pour a little for it. Do not invent
    a myth of self-birth.
