pratibha_layers:
- kind: original
  label: Original
  body: Le premier enfant doit naître dans le village d'origine de sa mère, celle-ci d'ailleurs habite
    presque toujours chez ses parents dans la première année de mariage. Cette naissance est l'occasion
    de réjouissances, on boit et on tue une chèvre ou un mouton; on fête de la même façon la naissance
    de jumeaux.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Cosmology of first birth: the child must be
    born in the mother''s village of origin; the mother lives with her parents in the first year of marriage.'
- kind: translation
  label: Pratibha Translation
  body: 'The first child must be born in the village of origin of the mother. She, for that matter, almost
    always lives with her parents in the first year of marriage. That birth is an occasion of rejoicing:
    one drinks and kills a goat or a sheep. Twin birth is celebrated in the same way.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a person begins on the mother''s ground. First birth is not a private medical
    event in the husband''s house. It is a return. The new life must arrive where the mother''s own life
    first arrived. Lasnet records the rule as obligation (doit naître) and the social fact that explains
    it: the bride spends the first year among her parents. The husband''s village does not yet own the
