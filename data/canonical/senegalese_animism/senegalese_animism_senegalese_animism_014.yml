unit_label: The First Child Is Born in the Mother's Village
title: The First Child Is Born in the Mother's Village
unit_type: teaching_passage
commentary: 'The claim is that a person begins on the mother''s ground. First birth is not a private medical
  event in the husband''s house. It is a return. The new life must arrive where the mother''s own life
  first arrived. Lasnet records the rule as obligation (doit naître) and the social fact that explains
  it: the bride spends the first year among her parents. The husband''s village does not yet own the first
  fruit of the marriage. The mother''s village-soul does. This is kinship cosmology, not obstetrics. In
  a religion where ancestor and land are one cult, the first child''s first air belongs to a particular
  fold of earth and a particular set of dead. To be born elsewhere would start the person already slightly
  unhoused. The feast — goat or sheep, drink, the same honors for twins — marks the arrival as increase
  (Tiurakh''s department) that must be answered in public. Colonial pages nearby wander into midwifery
  and marabout charms. Those are not this unit. The teaching is topological: the first body of a new line
  is oriented, as the grave will later be oriented east. Existentially, the passage asks where your own
  life actually started, and whether you have treated that ground as optional scenery. You cannot perform
  a Serer first birth. You can refuse to treat origin as a zip code you have outgrown.'
