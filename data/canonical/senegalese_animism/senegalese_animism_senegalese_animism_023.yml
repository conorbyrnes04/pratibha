pratibha_layers:
- kind: original
  label: Original
  body: La famille est assez mal organisée, le père a une autorité très relative, la mère n'est jamais
    consultée; le rôle de la femme est d'ailleurs des plus effacé. L'oncle maternel a plus d'autorité
    sur les enfants que le père. Souvent les enfants sont confiés à un proche qui est chargé de leur éducation
    jusqu'à douze ou treize ans pour les filles, quatorze ou quinze pour les garçons.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Kinship cosmology: the maternal uncle has
    more authority over the children than the father. Lasnet''s contempt for the family as "badly organized"
    and the woman as a beast of burden is observer poison, not teaching. Awa (unit 20) already names female
    household office.'
- kind: translation
  label: Pratibha Translation
  body: The father's authority is only relative. The maternal uncle has more authority over the children
    than the father. Children are often entrusted to a relative charged with their education until twelve
    or thirteen for girls, fourteen or fifteen for boys.
- kind: commentary
  label: Pratibha Commentary
