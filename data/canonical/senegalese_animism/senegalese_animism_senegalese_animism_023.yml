unit_label: The Maternal Uncle Outranks the Father
title: The Maternal Uncle Outranks the Father
unit_type: teaching_passage
commentary: 'The claim is that blood-authority does not follow the European father-house by default. The
  mother''s brother is the stronger pole. Lasnet calls the family badly organized because he is looking
  for a paterfamilias and finds a maternal uncle. That is his failure of theory, not theirs. In a world
  where the first child must be born in the mother''s village, it is coherent that the mother''s brother
  — the male of that village-line — speaks for the child more than the genitor who married in. The contested
  move is to take this as cosmology, not as an insult to fathers. Authority here is about which dead and
  which soil may claim the young. Entrusting children to a relative for education is the same grammar
  as initiation seclusion: the person is formed by more than the conjugal pair. Colonial sentences on
  the same page that degrade women as beasts of burden are refused. Unit 20 already recorded awa as named
  household authority; this unit records a named male office on the mother''s side. Existentially, many
  houses still run on an unofficial uncle, aunt, or elder who actually holds the child while a legal father
  is elsewhere. The teaching is to honor the real pole without pretending the nuclear pair was the cosmos.'
