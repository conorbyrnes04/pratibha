- kind: key_terms
  label: Key Terms
  items:
  - term: oncle maternel
    definition: the mother's brother -> stronger authority over children than the father -> "uncle" as
      a casual relative misses the office of the mother's ground
  - term: autorité très relative
    definition: the father's merely relative authority -> Lasnet's complaint is the evidence of a different
      cosmos -> not a failed patriarchy; a maternal pole
  - term: village d'origine de sa mère
    definition: the mother's village of unit 14 -> the ground this uncle represents -> without that unit,
      uncle-right looks like a quirk
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: West African avunculate as a regional structure (compare Mande and Wolof reports in the
      same PD century)
    resonance: Both lodge a child's heavier bond on the mother's brother rather than on the conjugal father
      alone.
    divergence: Regional comparison can flatten; Lasnet's Serer instance is tied to first birth in the
      mother's village and refusal of foreign burial.
  - citation: Gospel household sayings that relativize the father-house (Luke 8:19–21)
    resonance: Both refuse to treat the legal father-house as the only real kinship.
    divergence: Luke relocates family into doing the word of God; Serer uncle-right relocates it into
      the mother's soil-line without addressing Roog.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the person, other than a legal parent, who actually helped form you — an uncle, aunt, teacher,
    elder. Send one concrete thanks today. If you hold that office for a younger person, do one act of
    authority that is care, not control.
