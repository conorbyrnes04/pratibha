  cultural_context: 'Serer *cosaan* (tradition) is oral. There is no indigenous written scripture analogous
    to a sūtra. French observer sentences stand as Original where no Serer speech survives in the PD sources.
    The layers restore the philosophical claim without adopting colonial contempt, racial ranking, or
    ''fetish'' as teaching. Key Serer terms kept in the Key Terms layer: Roog, Koch, Takhar, Tiurakh,
    mammam, pangool, gisanekal, Fitaure, Bante.'
