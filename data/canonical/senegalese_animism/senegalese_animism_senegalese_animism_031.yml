    still answers to a ground, not to a brand.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Fitaure
    definition: religious minister and civic head of an agglomeration -> unseparated office -> "chief"
      in an administrative file misses the cult; "priest" misses the village
  - term: médiateur naturel
    definition: natural mediator of the Bante-conflict -> the same person who can bind can unbind -> Bérenger
      hears profit; the structure is that only the binder can release
  - term: agglomération
    definition: the settlement as such -> Fitaure's scale is the clustered families on a fold of land,
      not a nation -> Roog still has no mayor
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Melchizedek, king of Salem and priest of God Most High (Genesis 14:18)
    resonance: Both lodge civic headship and cult-office in one figure.
    divergence: Melchizedek blesses Abraham in the name of a high God; Fitaure administers tree-sanctuary
      binding and does not address Roog.
  - citation: Lasnet's lamane as village-head pool (this collection, unit 22)
    resonance: Both grow public office out of a religious relation to land and people.
    divergence: Lamane is land-master transmitting soil; Fitaure is the named religious-civic head who
      can perform Bante.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the person who actually holds both practical authority and a rite of your place (a landlord
    who blesses, an elder who also chairs, a parent who both feeds and prays). Take one small conflict
    to them as mediator, not as judge-shopping. If you hold both roles, mediate once today without adding
    fear.
