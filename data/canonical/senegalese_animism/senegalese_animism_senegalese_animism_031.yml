translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (Paris: Challamel, 1900) and L.-J.-B. Bérenger-Féraud, *Les peuplades de la Sénégambie*
  (Paris: Leroux, 1879), both public domain. Gravrand is not used (not PD). Boilat 1853 is named as preferred
  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: Celui qui veut se venger d'un ennemi, vient trouver le Fitaure qui est le ministre religieux en
    même temps que le chef d'une agglomération. La famille qui sait qu'on a fait un Bante contre elle...
    chacun se hâte de faire des concessions pour être délivré du danger qui le menace, ce qui rapporte
    encore plus d'un profit au Fitaure médiateur naturel du conflit.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key term: Fitaure — religious minister and
    head of a settlement at once; natural mediator of Bante-conflict. Revenue-sneer is Bérenger''s, not
    the definition of the office.'
- kind: translation
  label: Pratibha Translation
  body: The one who wants vengeance comes to the Fitaure, who is the religious minister and at the same
    time the head of a settlement. A family that knows a Bante has been made against it hurries to make
    concessions to be delivered from the danger. The Fitaure is the natural mediator of the conflict.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that at village scale there is no split between mayor and priest. The one who can
    enclose a soul in a canari is also the civic head. Fitaure is the word Bérenger records for that joint.
    Lasnet''s lamane holds the soil and supplies village chiefs; Fitaure names the religious face of the
    agglomeration. Read together, Serer public life is land-office plus cult-office, sometimes in one
    person. Bérenger sees only a racket: gifts to start the Bante, gifts to mediate it. That is how a
    colonial official sees any unseparated power. The recoverable teaching is older. If ancestor and land
