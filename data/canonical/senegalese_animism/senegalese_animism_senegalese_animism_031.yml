work_title: Senegalese Animism
unit_id: senegalese_animism.senegalese_animism_031
unit_label: Fitaure Is Religious and Civic Head
title: Fitaure Is Religious and Civic Head
unit_type: teaching_passage
commentary: 'The claim is that at village scale there is no split between mayor and priest. The one who
  can enclose a soul in a canari is also the civic head. Fitaure is the word Bérenger records for that
  joint. Lasnet''s lamane holds the soil and supplies village chiefs; Fitaure names the religious face
  of the agglomeration. Read together, Serer public life is land-office plus cult-office, sometimes in
  one person. Bérenger sees only a racket: gifts to start the Bante, gifts to mediate it. That is how
  a colonial official sees any unseparated power. The recoverable teaching is older. If ancestor and land
  are one cult, the head of a settlement is already standing on a god. Separating "politics" from "religion"
  would be the foreign theory. Mediation is the humane side of the same office that can terrify. The Fitaure
  who can bind can also unbind. That is why the threatened family runs to him. Existentially, moderns
  keep inventing "spiritual" leaders with no civic skin and civic leaders with no cult of the ground.
  This office refuses the split. You cannot become a Fitaure by mood. You can notice who in your actual
  place holds both the keys and the rites, and you can take one conflict to a mediator who still answers
  to a ground, not to a brand.'
