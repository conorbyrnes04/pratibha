pratibha_layers:
- kind: original
  label: Original
  body: Les Sérères sont de mœurs douces, très attachés à leur sol, ne songeant point à faire la guerre
    et ne s'occupant que de leurs troupeaux et de leurs cultures. Ils se déplacent difficilement... ceux
    qui s'éloignent sont mal considérés, on les accuse d'avoir contracté union avec des étrangères, parfois
    on leur refuse la sépulture. Jamais des Sérères ne se déplaceraient volontairement pour aller vivre
    en pays étranger.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Teaching: never leave ancestral land voluntarily.
    Those who go far are ill-regarded and may be refused burial.'
- kind: translation
  label: Pratibha Translation
  body: The Serer are deeply attached to their soil. They move with difficulty. Those who go far are ill-regarded;
    they are accused of having contracted union with foreign women, and sometimes burial is refused them.
    Never would Serer people displace themselves voluntarily to go live in a foreign land.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the land is not a location you can swap. Voluntary exile is a religious fault,
    not a career move. Lasnet''s jamais is as strong as the always of first-fruits. The people who appear
    in Wolof country under Serer names are, in his report, captives taken young — not emigrants. Bérenger
    finds the same temperament: they pass their lives where they were born, grouped by families in a fold
    of cultivated ground, as little in love with migration as the Soninke are much in love with it. The
    sanction reveals the metaphysics. To leave is to be suspected of having given the line to a foreign
    bed. To be refused burial is to be refused the last conversation with the soil-soul. If ancestor and
    land are one cult, a voluntary departure is already a small death that the grave may decline to complete.
    Colonial administrators wanted workers and roads; they praised this attachment as convenient. That
