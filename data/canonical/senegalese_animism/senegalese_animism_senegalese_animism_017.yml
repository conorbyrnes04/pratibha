unit_label: One Does Not Leave Ancestral Land Voluntarily
title: One Does Not Leave Ancestral Land Voluntarily
unit_type: teaching_passage
commentary: 'The claim is that the land is not a location you can swap. Voluntary exile is a religious
  fault, not a career move. Lasnet''s jamais is as strong as the always of first-fruits. The people who
  appear in Wolof country under Serer names are, in his report, captives taken young — not emigrants.
  Bérenger finds the same temperament: they pass their lives where they were born, grouped by families
  in a fold of cultivated ground, as little in love with migration as the Soninke are much in love with
  it. The sanction reveals the metaphysics. To leave is to be suspected of having given the line to a
  foreign bed. To be refused burial is to be refused the last conversation with the soil-soul. If ancestor
  and land are one cult, a voluntary departure is already a small death that the grave may decline to
  complete. Colonial administrators wanted workers and roads; they praised this attachment as convenient.
  That praise is not the teaching. The teaching is that a world of Roog, mammam, and pangool is local
  or it is rhetoric. Existentially, most readers of this unit have already left a ground. The point is
  not to shame travel. It is to stop calling rootlessness freedom as if the dead and the field had no
  claim. If you have left, the practice is to know that you have left, and to bind what can still be bound.'
