    it is rhetoric. Existentially, most readers of this unit have already left a ground. The point is
    not to shame travel. It is to stop calling rootlessness freedom as if the dead and the field had no
    claim. If you have left, the practice is to know that you have left, and to bind what can still be
    bound.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sol
    definition: the ancestral soil -> not scenery, the cult-partner of the dead -> "homeland" as patriotism
      is too national; this is a parcel and a people
  - term: volontairement
    definition: voluntarily -> the fault is chosen departure, not captivity -> Lasnet's Nones in Wolof
      country are explained as raided children, not emigrants
  - term: sépulture
    definition: burial as a right of those who stayed -> refusal of the grave is refusal of the last land-bond
      -> "funeral" as a service you purchase anywhere misses the territorial metaphysics
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 137 (how shall we sing on foreign soil)
    resonance: Both make exile a religious wound, not a change of address.
    divergence: The psalm sings toward Zion under a high God; Serer refusal of voluntary leaving is attachment
      to a family parcel whose high God is not addressed.
  - citation: Antigone's claim that the dead must have their ground
    resonance: Both treat burial-right as the last proof of belonging.
    divergence: Antigone defies a king for a brother's grave; Serer custom may refuse the grave to the
      one who left the soil by choice.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Name the ground you have actually left — a town, a house, a family field. Do not call the leaving
    nothing. Send one concrete act of remaining toward it today: a call to a living elder, water poured
    where you now stand in its name, or a refusal to sell one inherited thing.'
