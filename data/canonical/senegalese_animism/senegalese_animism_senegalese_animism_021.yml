pratibha_layers:
- kind: original
  label: Original
  body: Ils se déplacent difficilement et ne dépassent guère les escales où ils vont vendre leurs arachides;
    ceux qui s'éloignent sont mal considérés, on les accuse d'avoir contracté union avec des étrangères,
    parfois on leur refuse la sépulture. Très réservés quand ils reçoivent des étrangers même des Sérères
    d'une autre tribu, ils ne les laissent pas pénétrer dans leurs cases et les installent sur la place
    publique; après leur départ ils brisent les ustensiles qui ont renfermé leurs aliments.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Sanction of departure: ill-regard, accusation
    of foreign union, sometimes refusal of burial. Even a Serer of another tribe is kept on the public
    square; utensils that fed him are broken.'
- kind: translation
  label: Pratibha Translation
  body: 'They move with difficulty and scarcely go beyond the trading posts where they sell their groundnuts.
    Those who go far are ill-regarded; they are accused of having contracted union with foreign women;
    sometimes burial is refused them. They are very reserved even toward Serer of another tribe: they
    do not let them enter their houses, they lodge them on the public square, and after the departure
    they break the utensils that held their food.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that burial is a right of those who stayed, and that even a guest leaves a stain
    the house must break. Unit 17 stated the vow: no voluntary exile. This unit states the liturgy of
    the boundary. A foreign union is not only romance out of group; it is a suspected gift of the line
    to another soil-soul. Refusal of sépulture is the last form of that judgment: the ground will not
    always complete the conversation of unit 6. The broken utensils are the everyday form. Food that has
    passed through an outsider''s mouth cannot stay in the house''s vessels. This looks like xenophobia
    to a colonial traveler who wanted hospitality on European terms. The recoverable teaching is purity
    of the house-genius. If the case has a mammam, then what enters it is not neutral. Public square is
    the proper place for the not-yet-kin. Breaking the bowl is not hatred of persons; it is resetting
    the vessel. Existentially, modern houses pretend to be frictionless hotels and then are shocked by
    the cost. You need not break crockery. You can know that your table is a cult-site, decide what may
    enter it, and perform one honest reset after a crossing that was not kin.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sépulture
    definition: burial refused to some who left -> the grave as a right of the staying -> "cemetery access"
      as a civic service misses the land-soul's veto
  - term: place publique
    definition: the public square where even other-tribe Serer are lodged -> inside the case is not a
      hotel -> hospitality has a topology
  - term: brisent les ustensiles
    definition: they break the utensils that held the guest's food -> the house-genius is reset by destroying
      the vessel -> "rudeness" is the traveler's word for a rite
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Numbers 19 (vessels and impurity after contact with death or the outside)
    resonance: Both treat certain contacts as leaving a residue that vessels cannot simply be washed of
      in the ordinary way.
    divergence: Priestly law is written and addressed to YHWH's camp; Serer breaking of bowls is household-animist
      and leaves Roog unaddressed.
  - citation: Japanese satoyama / village boundary rites (structural)
    resonance: Both keep a difference between the inside of the dwelling and the place where strangers
      may stand.
    divergence: Japanese forms are shrine-and-kami coded; Lasnet's Serer form is the broken bowl and the
      refused grave.
- kind: practice
  label: Practice (Abhyasa)
  body: 'After one encounter that was not of your house (a meeting, a guest, a feed of news), wash one
    actual vessel — a cup, a plate, your hands — as a reset, not as germ theater. Say: the house has a
    boundary. Do not perform contempt for a person.'
