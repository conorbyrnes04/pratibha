unit_label: Those Who Leave May Be Refused Burial
title: Those Who Leave May Be Refused Burial
unit_type: teaching_passage
commentary: 'The claim is that burial is a right of those who stayed, and that even a guest leaves a stain
  the house must break. Unit 17 stated the vow: no voluntary exile. This unit states the liturgy of the
  boundary. A foreign union is not only romance out of group; it is a suspected gift of the line to another
  soil-soul. Refusal of sépulture is the last form of that judgment: the ground will not always complete
  the conversation of unit 6. The broken utensils are the everyday form. Food that has passed through
  an outsider''s mouth cannot stay in the house''s vessels. This looks like xenophobia to a colonial traveler
  who wanted hospitality on European terms. The recoverable teaching is purity of the house-genius. If
  the case has a mammam, then what enters it is not neutral. Public square is the proper place for the
  not-yet-kin. Breaking the bowl is not hatred of persons; it is resetting the vessel. Existentially,
  modern houses pretend to be frictionless hotels and then are shocked by the cost. You need not break
  crockery. You can know that your table is a cult-site, decide what may enter it, and perform one honest
  reset after a crossing that was not kin.'
