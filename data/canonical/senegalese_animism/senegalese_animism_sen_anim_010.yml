sanskrit_devanagari: Afin de mieux faire comprendre en quoi consiste ce culte... j'emprunte... à la langue mandingue. Dans
  cet idiome, on désigne par le mot lâ-siri (ou dâ-siri et lâ-siti selon les dialectes) ce que nous exprimons par l'un des
  mots « culte » ou « religion ». Ce terme signifie « dispositions prises (lâ) en vue de lier (siri) ». Il appert de là que,
  pour les Noirs comme pour nous, la religion consiste à « lier » la divinité, à contraindre celle-ci, par des rites appropriés,
  à accorder ce qu'on attend d'elle ou à écarter ce que l'on redoute, et que le culte est l'ensemble des dispositions prises
  en vue de lier ainsi la divinité, c'est-à-dire l'ensemble des rites (invocations, sacrifices, offrandes, prières).
sanskrit_iast: 'Not applicable. Key Mande term: *lâ-siri* — dispositions taken in order to bind. Serer libation, first-fruits,
  tree-gifts, and funeral feeding are the Senegalese rites that enact this definition.'
translation_literal: 'In Manding, what we call "cult" or "religion" is *lâ-siri*: dispositions taken (*lâ*) in order to bind
  (*siri*). Religion consists in binding the divinity — constraining it, by appropriate rites, to grant what is expected or
  to turn aside what is feared. Cult is the set of those dispositions: invocations, offerings, prayers.'
commentary: 'The claim is that religion is a technology of relation, not a cloud of beliefs. Delafosse''s etymology is the
  most compact philosophy of practice in the PD dossier. You do not "have a spirituality." You take dispositions that bind.
  Bind does not here mean enslave a god like a demon in a grimoire. It means the same thing *re-ligio* is often said to mean:
  tie back. Milk at the baobab binds house to tree-soul. First-fruits bind harvest to the field''s *nia*. Speech in the ear
  binds the living to the newly dead. Gifts at Tiurakh''s tree bind increase to the household without pretending the household
  generated increase from nothing.


  Why bind at all, if souls are personal and free? Precisely because they are personal and free. A free land-soul or ancestor-soul
  has temperament, rancor, taste, and power. Relation that is only inward feeling does not meet a personal other. Rite is
  how two personal lives, of one essence but different office, stay in working order. The Serer "always" of first-fruits is
  a standing bond, not a mood.


  Existentially, this definition judges contemporary practice. If nothing in your life binds you to a particular dead, a particular
  ground, a particular tree or stone, you do not have this religion even if you admire it. Animism is not an opinion that
  things are alive. It is the set of dispositions by which you stay tied to those lives. The sky remains unbound — Roog is
  not tied. The middle is what you bind, and by binding it, you live.


  Key Terms:


  **lâ-siri** - Manding: dispositions taken in order to bind -> Delafosse''s indigenous word for cult/religion -> English
  "worship" sounds like praise-feeling; this is binding-action.


  **lier** - to bind, tie, constrain by rite -> the verb of practice -> "manipulate" is too cynical; "devote" is too one-way;
  binding is mutual working-order between personal souls.


  **dispositions** - the preparatory and repeated arrangements (what is poured, where, by whom) -> religion as set-up, not
  as peak experience -> "intention" alone is not a disposition in this sense.


  **écarter ce que l''on redoute** - to turn aside what is feared -> cult includes aversion as well as petition -> a purely
  "love and light" reading of animism erases Takhar and the dangerous freedom of unbound souls.


  Cross-Tradition Resonances:


  **Latin *religio* as binding/obligation:** Both etymologies make religion a tie, not a sentiment.

  *Divergence:* Roman *religio* becomes civic-legal; *lâ-siri* in this account remains familial-land rite.


  **Vedic *yajña* as maintaining the bond of gods and humans:** Both treat offering as what keeps worlds in relation.

  *Divergence:* Vedic rite is priestly-Sanskrit and addressed to named *devas* including high gods; West African *lâ-siri*
  in Delafosse binds near souls and leaves the sky-God without cult.


  **Śiva Sūtra II.2 (*prayatnaḥ sādhakaḥ*, effort is the practitioner):** Both make the repeated doing itself the path, not
  a preliminary to belief.

  *Divergence:* The sūtra''s effort turns the mind toward recognition of Self; *lâ-siri* turns offerings toward particular
  other souls.'
insight: The claim is that religion is a technology of relation, not a cloud of beliefs.
practice: 'Choose one bond you have been treating as a feeling (gratitude to a place, to a dead person, to a household). Give
  it a disposition: a time, a small offering, a repeated act. Do it once today. That act, not the opinion, is the religion.'
