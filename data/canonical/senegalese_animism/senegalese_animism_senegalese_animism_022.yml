unit_label: The Lamane Holds the Soil
title: The Lamane Holds the Soil
unit_type: teaching_passage
commentary: 'The claim is that land is not a free market and not a royal whim. It sits with named masters
  who transmit it in the male line and lend it. Lamane is the living face of unit 9''s ancestor-land fusion.
  To hold the soil is already a religious-political office: the parcel has a someone who may speak for
  it, rent it, and be chosen as village head because the soil already chose that house. Lasnet''s surrounding
  colonial satisfaction — French residents, suppressed exactions — is not the teaching. The teaching is
  that ownership here is kinship with a field. Absence of a wide caste ladder (except griots) makes the
  lamane stand out more, not less. There is no separate priest-caste of Roog. The land-master is as close
  as this source comes to a standing clergy of the ground. Existentially, modern readers either idolize
  private property or pretend land is only theft. This office is neither. It is a hereditary trusteeship
  that can be lent. You probably are not a lamane. You can still ask who actually holds the ground you
  sleep on, and whether your relation to it is rent, gift, amnesia, or a vow.'
