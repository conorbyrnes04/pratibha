- kind: key_terms
  label: Key Terms
  items:
  - term: se les rendre favorables
    definition: to render the spirits favorable -> Lasnet's verb of cult -> English "worship" sounds like
      praise-feeling; this is binding-action
  - term: prémices
    definition: first-fruits always offered -> the standing bond, not a mood of thanks -> without the
      always, gratitude stays private and the field is treated as owned
  - term: Bante
    definition: 'later in Bérenger: enclosing a soul in a canari under a consecrated tree -> the same
      binding grammar turned to fear -> "magic" as a dump-word misses that this is cult used as constraint'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Latin religio as binding / obligation
    resonance: Both etymologies make religion a tie, not a sentiment.
    divergence: Roman religio becomes civic-legal; Serer binding in these sources remains familial-land
      rite and leaves the sky-God unbound.
  - citation: Vedic yajña as maintaining the bond of gods and humans
    resonance: Both treat offering as what keeps worlds in relation.
    divergence: Vedic rite is priestly-Sanskrit and addressed to named devas including high gods; Serer
      binding in Lasnet ties near souls and leaves Roog without cult.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Choose one bond you have been treating as a feeling (gratitude to a place, to a dead person,
    to a household). Give it a disposition: a time, a small offering, a repeated act. Do it once today.
    That act, not the opinion, is the religion.'
