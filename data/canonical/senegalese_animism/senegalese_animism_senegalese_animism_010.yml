translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (Paris: Challamel, 1900) and L.-J.-B. Bérenger-Féraud, *Les peuplades de la Sénégambie*
  (Paris: Leroux, 1879), both public domain. Gravrand is not used (not PD). Boilat 1853 is named as preferred
  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: Pour se les rendre favorables on fait au pied des arbres ou sur des pierres consacrées des libations
    de lait ou d'eau coupée de farine de mil... les prémices de la récolte leur sont toujours offertes.
    On le rend favorable à sa maison en déposant auprès de certains arbres désignés, des cadeaux.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Binding-acts in the PD Serer record: libation,
    first-fruits, tree-gifts. Later Mande lâ-siri ("dispositions taken in order to bind") names the same
    grammar; it is not the Serer word.'
- kind: translation
  label: Pratibha Translation
  body: To render the spirits favorable, one pours milk or millet-water at the foot of the trees or upon
    consecrated stones. The first-fruits of the harvest are always offered to them. One renders Tiurakh
    favorable to one's house by depositing gifts beside certain designated trees. Worship here is a set
    of dispositions that bind.
- kind: commentary
