unit_label: To Worship Is to Bind
title: To Worship Is to Bind
unit_type: teaching_passage
commentary: 'The claim is that religion is a technology of relation, not a cloud of beliefs. Lasnet''s
  verbs are already the philosophy: se les rendre favorables, toujours offertes, déposant des cadeaux.
  You do not "have a spirituality." You take dispositions that bind. Bind does not here mean enslave a
  god like a demon in a grimoire. It means the same thing re-ligio is often said to mean: tie back. Milk
  at the baobab binds house to tree-soul. First-fruits bind harvest to the field''s life. Speech in the
  ear binds the living to the newly dead. Gifts at Tiurakh''s tree bind increase to the household without
  pretending the household generated increase from nothing. Why bind at all, if souls are personal and
  free? Precisely because they are personal and free. A free land-soul or ancestor-soul has temperament,
  rancor, taste, and power. Relation that is only inward feeling does not meet a personal other. Rite
  is how two personal lives, of one essence but different office, stay in working order. The Serer "always"
  of first-fruits is a standing bond, not a mood. Bérenger''s Bante will show the same grammar turned
  to fear: a soul enclosed in a canari. Binding can bless a house or terrify an enemy. The definition
  still holds. Existentially, this judges contemporary practice. If nothing in your life binds you to
  a particular dead, a particular ground, a particular tree or stone, you do not have this religion even
  if you admire it. Animism is not an opinion that things are alive. It is the set of dispositions by
  which you stay tied to those lives. The sky remains unbound — Roog is not tied. The middle is what you
  bind, and by binding it, you live.'
