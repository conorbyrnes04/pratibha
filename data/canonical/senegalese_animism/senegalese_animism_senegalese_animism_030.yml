pratibha_layers:
- kind: original
  label: Original
  body: On le rend favorable à sa maison en déposant au pied de certains arbres désignés, des cadeaux
    de plus ou moins grand prix et, chose bizarre, quel que soit le volume de l'objet, la grosseur de
    la bête offerte au Dieu, l'offrande disparaissait jadis dans la nuit suivante. Mais hélas! les Dieux
    s'en vont, peut-on dire, au cap Vert comme ailleurs; aussi, peu à peu les Sérères sont moins fervents
    et bien plus, dans nombre d'endroits, ils sont arrivés à ne plus déposer au pied de l'arbre sacré
    que les cornes, les pieds, les entrailles de la bête immolée en l'honneur du Dieu et mangée par la
    famille du dévot. Depuis ce temps, ces bas morceaux ne disparaissent plus et s'amoncellent de plus
    en plus autour de l'arbre séculaire.
- kind: iast
  label: Romanization
  body: French ethnographic report of Serer oral teaching. Tiurakh's gifts once vanished overnight; now
    only horns, feet, and entrails are left, and they pile up. "The gods are leaving" is a theological
    diagnosis. Priest-theft is Bérenger's sneer, named as divergence.
- kind: translation
  label: Pratibha Translation
  body: One renders Tiurakh favorable to one's house by depositing gifts of greater or lesser price at
    the foot of certain designated trees. Once, whatever the size of the object or the beast, the offering
    would vanish in the following night. But the gods are leaving, at Cap-Vert as elsewhere. The Serer
    grow less fervent, and in many places they now deposit at the foot of the sacred tree only the horns,
    the feet, the entrails of the beast offered to the god and eaten by the devotee's family. Since then
    those low pieces no longer disappear; they pile up around the age-old tree.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that when the gift is reduced to leftovers, the gods withdraw. Bérenger cannot resist
    the priest-theft theory: of course the offerings used to vanish, the clergy ate them. That suspicion
    is named as colonial divergence. It may even be partly worldly fact. It is not the teaching. The teaching
    is the sequence he records despite himself. Full gifts vanished overnight — the forest-sanctuary received
    them. Then fervor thinned. Then the house kept the meat and left the gods the waste. Then the waste
    stayed and piled. "Les Dieux s''en vont" is a theological diagnosis wearing a French sigh. A religion
    of increase dies when the house eats as owner and pays the tree in horns. That is unit 11 inverted.
    First-fruits always offered becomes last bits never taken. The age-old tree of unit 25 is still there;
    the relation has become a dump. Existentially, this is how most inherited cults end in a life: not
    by argument, by leftover. You still perform a gesture. You keep the feast. The sanctuary receives
    garbage. The practice is to notice one offering you have already reduced to horns, and to restore
    a first portion or to stop pretending.'
- kind: key_terms
  label: Key Terms
  items:
  - term: les Dieux s'en vont
    definition: the gods are leaving -> Bérenger's sigh, recoverable as diagnosis -> not only secularization-as-progress;
      a relation starved of first-gifts
  - term: cornes / entrailles
    definition: horns, feet, entrails left at the tree while the family eats the beast -> leftover cult
      -> the opposite of prémices toujours offertes
  - term: Tiurakh
    definition: the power of increase who was to receive the whole gift -> when paid in waste, increase
      has already been privatized -> prosperity without offering is the pile around the tree
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Malachi 1:7–8 (polluted offerings, leftover animals)
    resonance: Both diagnose a cult that still brings something to the holy place while keeping the better
      portion.
    divergence: Malachi speaks for YHWH's altar and table; Bérenger records Tiurakh's tree paid in entrails
      as the gods depart Cap-Vert.
  - citation: Bhagavad Gītā 3.13 again, now in the negative
    resonance: Both treat eating the offering-share as breaking the cycle of increase.
    divergence: The Gītā threatens leftover-eaters as thieves; the Serer record shows the pile of uneaten
      waste as the visual of gods leaving.
- kind: practice
  label: Practice (Abhyasa)
  body: Find one devotion you have reduced to leftovers (thanks after the treat, a relation you only text,
    a place you visit as a dump). Either restore a first portion today or stop the gesture. Do not leave
    horns and call it faith.
