unit_label: The Offerings No Longer Vanish Overnight
title: The Offerings No Longer Vanish Overnight
unit_type: teaching_passage
commentary: 'The claim is that when the gift is reduced to leftovers, the gods withdraw. Bérenger cannot
  resist the priest-theft theory: of course the offerings used to vanish, the clergy ate them. That suspicion
  is named as colonial divergence. It may even be partly worldly fact. It is not the teaching. The teaching
  is the sequence he records despite himself. Full gifts vanished overnight — the forest-sanctuary received
  them. Then fervor thinned. Then the house kept the meat and left the gods the waste. Then the waste
  stayed and piled. "Les Dieux s''en vont" is a theological diagnosis wearing a French sigh. A religion
  of increase dies when the house eats as owner and pays the tree in horns. That is unit 11 inverted.
  First-fruits always offered becomes last bits never taken. The age-old tree of unit 25 is still there;
  the relation has become a dump. Existentially, this is how most inherited cults end in a life: not by
  argument, by leftover. You still perform a gesture. You keep the feast. The sanctuary receives garbage.
  The practice is to notice one offering you have already reduced to horns, and to restore a first portion
  or to stop pretending.'
