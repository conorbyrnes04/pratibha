- kind: key_terms
  label: Key Terms
  items:
  - term: lamane
    definition: 'Serer land-master (Lasnet: notables who own and lend soil) -> the socio-political face
      of the ancestor-land fusion -> "chief" in a colonial administrative sense misses the religious joint
      with the soil-soul'
  - term: sol
    definition: 'the particular soil, not Earth as a globe-goddess -> Bérenger: a fold of terrain put
      under cultivation -> "Mother Earth" rhetoric is too large and too impersonal'
  - term: pangool
    definition: the free ancestral and land powers fed by that joint cult -> what the lamane and the family
      elders stand before -> not a museum of "ancestors" separate from the field
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chinese ancestral cult and she / earth altars
    resonance: Both fuse lineage dead with a particular earth, and both locate priesthood in the family
      rather than in a church of the high God.
    divergence: Chinese practice has a long written ritual code; this PD Serer account is oral-familial
      and land-parcel specific.
  - citation: Hebrew land-promise and ancestral tomb
    resonance: Both bind a people to a ground through the dead.
    divergence: Biblical religion addresses the high God as the giver of land; Serer animism in these
      sources addresses the land-ancestor fusion and leaves Roog unaddressed.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the actual ground you slept on last night and one dead person whose life made yours possible.
    Hold them as one relation, not two topics. Offer a sip of water to the ground, and a sentence of thanks
    to that dead person, as a single act.
