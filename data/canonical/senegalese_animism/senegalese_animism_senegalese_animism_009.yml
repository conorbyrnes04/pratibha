pratibha_layers:
- kind: original
  label: Original
  body: Les Sérères sont de mœurs douces, très attachés à leur sol, ne songeant point à faire la guerre
    et ne s'occupant que de leurs troupeaux et de leurs cultures. Les notables s'appellent lamanes; ils
    constituent la classe aisée et sont seuls propriétaires du sol qu'ils se transmettent de père en fils
    et prêtent ou louent aux autres indigènes. Les Sérères sont doux, vivent sur leur sol auquel ils sont
    extrêmement attachés... Ils passent volontiers leur vie là où ils sont nés, groupés par familles dans
    un pli de terrain qu'ils ont mis en culture.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key structure: attachment to a particular
    soil; lamane as land-master transmitting the parcel; family grouped on the fold of land. Ancestor
    and land are one cult because the founding dead and the soil are not two religions.'
- kind: translation
  label: Pratibha Translation
  body: 'The Serer are deeply attached to their soil. They live where they were born, grouped by families
    in a fold of land they have put under cultivation. The notables are called lamanes: they alone own
    the soil, transmit it from father to son, and lend or rent it to others. The land-master and the family
    dead are not two cults.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that ancestor and land are not two religions glued together. They are one relation
    seen from two sides. Lasnet''s Serer will not leave their soil voluntarily; those who wander are accused
    of foreign marriage and may be refused burial. Bérenger finds the same people grouped by families
    in a fold of earth they have made to yield. The lamane is the socio-political face of that fusion:
