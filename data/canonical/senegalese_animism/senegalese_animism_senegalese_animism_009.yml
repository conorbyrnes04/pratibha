unit_label: The Ancestor and the Land Are One Cult
title: The Ancestor and the Land Are One Cult
unit_type: teaching_passage
commentary: 'The claim is that ancestor and land are not two religions glued together. They are one relation
  seen from two sides. Lasnet''s Serer will not leave their soil voluntarily; those who wander are accused
  of foreign marriage and may be refused burial. Bérenger finds the same people grouped by families in
  a fold of earth they have made to yield. The lamane is the socio-political face of that fusion: a living
  notable who holds the parcel because the parcel is already a family god. To pour at a baobab on family
  ground is therefore not "nature worship" plus "ancestor worship." It is one act: you feed the dwelling-soul
  of the people who belong to this soil and of the soil that belongs to those people. Later Delafosse
  will name the structure explicitly: the nia of the most distant ancestor merges with the soul of the
  ground that ancestor acquired; the priest is the oldest living descendant. The Senegalese PD dossier
  already shows the joint without the Mande etymology. The Fitaure of Bérenger (village religious chief)
  and the family anciens of Lasnet''s funerals are local forms of that priesthood by seniority. Existentially,
  the teaching relocates spirituality from the consumer''s choice of "a path" to the question: whose dead,
  which ground, which living elder still knows the formulas of this parcel? Even a modern reader far from
  a Serer village can take the philosophical point. You do not have a private sky-God hobby and a separate
  real-estate life. The soil you live on and the people you come from are already a cult, whether you
  have admitted it or not. Animism makes that admission explicit.'
