    on family ground is therefore not "nature worship" plus "ancestor worship." It is one act: you feed
    the dwelling-soul of the people who belong to this soil and of the soil that belongs to those people.
    Later Delafosse will name the structure explicitly: the nia of the most distant ancestor merges with
