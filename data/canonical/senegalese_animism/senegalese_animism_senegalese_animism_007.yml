unit_label: Animism Is Not Fetishism
title: Animism Is Not Fetishism
unit_type: teaching_passage
commentary: 'The claim is diagnostic: "fetishism" is a colonial insult pretending to be a taxonomy. Lasnet''s
  own opening sentence is already the refutation. The master is invisible. The master is the sky-name.
  The master is not addressed. None of that is a carved object, a charm, or a "gross" religion of hardware.
  Bérenger, nine years earlier, still opened the same people with "idolâtrie" and "fétichisme" and "childish
  intelligences." That vocabulary is the observer''s poison, not the doctrine. What the doctrine is, Lasnet
  states without meaning to theorize: one unseen totality, a populated middle of place-spirits, and a
  liturgical withholding from the highest. Later Delafosse (1925, PD, used here only as a named conceptual
  key, not as a base text) will call this animism and refuse fetishism as the name of any religion. The
  Serer instance does not need his essay to stand. If the observer only sees horns, sachets, and trees,
  the observer has missed the philosophy the same page records. Existentially, the passage trains intellectual
  justice. If you can only see someone else''s religion as hardware — beads, trees, gris-gris — you are
  looking at Catholicism and seeing only candles. The practice of study here is to ask, of any rite: what
  soul is being addressed, and what highest is being left unaddressed on purpose? Animism in this collection
  names that structure: personal souls, a high God who is thought rather than fed, and a cult that belongs
  to the free souls of the dead and of places. Takhar and Tiurakh sit inside that doctrine as named near-powers,
  not as a refutation of Roog.'
