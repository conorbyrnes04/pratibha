translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (Paris: Challamel, 1900) and L.-J.-B. Bérenger-Féraud, *Les peuplades de la Sénégambie*
  (Paris: Leroux, 1879), both public domain. Gravrand is not used (not PD). Boilat 1853 is named as preferred
  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: Les Sérères croient à l'existence d'un être invisible, maître de toutes choses, qui habite le
    ciel au-dessus des nuages et qui voit avec satisfaction les hommes pratiquer le bien; ils le désignent
    du même nom que le ciel, rog sérère, koch none. Ils croient surtout aux esprits, mammam, et ne s'adressent
    jamais à Dieu.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Lasnet''s opening already blocks idol-theory:
    an invisible sky-named master, plus spirits one actually addresses. Bérenger''s word "idolâtrie" in
    the 1879 chapter is colonial taxonomy, not the teaching.'
- kind: translation
  label: Pratibha Translation
  body: 'The Serer believe in an invisible being, master of all things, who inhabits the sky above the
    clouds and takes satisfaction in those who practice the good; they name him with the same word as
    the sky: Rog, Koch. They believe above all in the spirits, mammam, and they never address themselves
    to God.'
