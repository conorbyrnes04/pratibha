- kind: key_terms
  label: Key Terms
  items:
  - term: fétichisme
    definition: colonial name for African religion as object-virtue -> Bérenger uses it as taxonomy; Lasnet's
      opening sentence already contradicts it -> using "fetish" as the name of Serer tradition repeats
      the disdain the philosophy refuses
  - term: Rog / Roog
    definition: sky-name of the invisible master -> the PD proof that the absolute is not a statue ->
      "they worship idols" cannot survive this naming
  - term: mammam
    definition: the addressed middle -> what colonial "fetish" collapses into hardware -> spirits of forest,
      field, spring, village, house are personal lives, not consecrated junk
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dionysius the Areopagite, Mystical Theology ch. 1
    resonance: Both protect the highest from being treated as an object of ordinary handling.
    divergence: Christian negative theology still liturgically addresses God; Lasnet's Serer pattern withholds
      cult from the creator.
  - citation: Islamic tawḥīd versus maraboutic amulets (as a structural pair)
    resonance: Both can coexist with object-virtue without being identical with it.
    divergence: Islam names the one God as the addressee of ṣalāt; Serer Rog is known and not the addressee
      of daily cult.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Pick one object you treat as "spiritual" (a necklace, an image, a stone). Ask: is this the religion,
    or a tool beside the religion? Then name, without addressing it, the highest you will not turn into
    an object today.'
