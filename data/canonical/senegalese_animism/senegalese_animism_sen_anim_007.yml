sanskrit_devanagari: On a tôt fait de dire, non sans quelque dédain, que la religion des nègres est le « fétichisme », en
  ajoutant généralement à ce terme le qualificatif de grossier. En fait, le fétichisme se rencontre dans toutes les religions...
  mais il n'a jamais constitué et il ne saurait constituer une religion... Assurément, la plupart des Noirs africains croient
  à l'existence d'un Dieu créateur, mais c'est de leur part une conception d'ordre philosophique ou cosmogonique bien plutôt
  qu'un concept d'ordre religieux. En tout cas, ce Dieu créateur ne joue pas, à leurs yeux, le rôle de Providence et... on
  ne lui rend nulle part aucun culte... partout où règne cette coutume, le nom donné à Dieu est celui du Ciel ou de la Pluie.
sanskrit_iast: 'Not applicable (French philosophical ethnology of West African religion, including the Senegal-Niger world).
  Key analytic terms: *fétichisme* (rejected as the name of the religion); *animisme*; *Dieu créateur* as philosophical, not
  cultic.'
translation_literal: It is quickly said, not without disdain, that the religion of African peoples is "fetishism." In fact
  fetishism occurs in all religions and has never constituted a religion. Most African peoples believe in a creator God, but
  this is a philosophical or cosmogonic conception rather than a cultic one. That creator is not treated as Providence, and
  nowhere is cult rendered to him. Where his name is invoked, the name given to God is that of the Sky or of the Rain.
commentary: 'The claim is diagnostic: "fetishism" is a colonial insult pretending to be a taxonomy. Delafosse, writing in
  1925 from a lifetime on the Senegal-Niger, performs the conceptual cleanup the Serer sources need. An amulet is not a religion,
  any more than a blessed medal is Christianity or a marabout''s charm is Islam. If the observer only sees objects, the observer
  has missed the philosophy.


  What the philosophy is, he then states with a precision that maps onto Lasnet almost sentence by sentence. There is a creator.
  That creator is a cosmogonic idea. Cult is not paid to him. His name, when used, is Sky or Rain. Lasnet''s Serer *Rog* /
  *Koch* is exactly that: the sky-name of an invisible master to whom one does not address oneself. Delafosse supplies the
  regional reason: the creator is not Providence in the Christian sense, not a daily manager of petitions. The near world
  is managed by souls that can be bound in relation — ancestors, land, water, trees.


  This unit is the warrant for using the word *animism* in this collection at all. Without it, "Senegalese animism" would
  inherit the sneer built into nineteenth-century "fetish." With it, animism names a coherent doctrine: personal souls of
  one essence, a high God who is thought rather than fed, and a cult that belongs to the free souls of the dead and of places.
  Bérenger''s Takhar and Tiurakh sit inside that doctrine as named near-powers, not as a refutation of Roog.


  Existentially, the passage trains intellectual justice. If you can only see someone else''s religion as hardware — beads,
  trees, gris-gris — you are looking at Catholicism and seeing only candles. The practice of study here is to ask, of any
  rite: what soul is being addressed, and what highest is being left unaddressed on purpose?


  Key Terms:


  **fétichisme** - belief in the virtue of human-made objects consecrated by rite -> Delafosse: real, widespread, and *not
  a religion* -> using "fetish" as the name of Serer or Diola tradition repeats the disdain he is dismantling.


  **animisme** - belief in personal souls of the same essence in all beings, including the apparently inanimate, plus cult
  of those souls that are free (the dead, the land, the waters) -> the correct PD name for the system -> New Age "animism"
  as vague nature-love is thinner than this definition.


  **Dieu créateur** - creator God as philosophical/cosmogonic concept, not cult recipient -> matches Serer Roog/Koch -> "they
  have no God" is false; "they pray to God as Christians do" is also false.


  **Ciel / Pluie** - Sky or Rain as the name given to God -> linguistic proof that the absolute is not a statue -> Lasnet''s
  *rog* = sky is the Senegalese instance.


  Cross-Tradition Resonances:


  **Negative theology (Dionysius, *Mystical Theology*):** Both protect the highest from being treated as an object of ordinary
  handling.

  *Divergence:* Christian negative theology still liturgically addresses God; Delafosse''s West African pattern (and Lasnet''s
  Serer) withholds cult from the creator.


  **Sāṃkhya / early Vedānta distinction of *puruṣa* from ritual *devatā*:** Both can separate a philosophical absolute from
  the gods one actually rites.

  *Divergence:* Indian systems have written sūtras; this corpus recovers the distinction from ethnography of an oral culture.


  **Islamic *tawḥīd* vs. maraboutic amulets (Delafosse''s own comparison):** Both can coexist with object-virtue without being
  identical with it.

  *Divergence:* Islam names the one God as the addressee of *ṣalāt*; Serer *Rog* is known and not the addressee of daily cult.'
insight: 'The claim is diagnostic: "fetishism" is a colonial insult pretending to be a taxonomy.'
practice: 'Pick one object you treat as "spiritual" (a necklace, an image, a stone). Ask: is this the religion, or a tool
  beside the religion? Then name, without addressing it, the highest you will not turn into an object today.'
