pratibha_layers:
- kind: original
  label: Original
  body: Celui qui a été la victime d'un rapt, fait annoncer par eux au son du tam-tam qu'il a pris un
    lézard et qu'il va le porter chez le forgeron. Il est bien rare que le lendemain matin l'objet volé
    ne soit pas remis en place car chaque Sérère est persuadé que les coups donnés par le forgeron au
    lézard retentiraient au centuple sur le voleur et entraîneraient bientôt sa mort.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Public analogical justice: a lizard is announced,
    taken to the smith; blows on the lizard would multiply on the thief. Practice for the reader is publicity
    of loss, not harm to an animal.'
- kind: translation
  label: Pratibha Translation
  body: The victim of a theft has it announced by the priests to the sound of the drum that he has taken
    a lizard and is going to carry it to the smith. It is rare that the next morning the stolen object
    is not put back in place, for each Serer person is persuaded that the blows the smith would give the
    lizard would resound a hundredfold on the thief and would soon bring his death.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that public analogical binding can return a stolen object without a prison. The
    drum makes the loss civic. The lizard is a stand-in body. The smith is the transformer of metal, already
    a threshold person in West African cosmologies, here the one whose blows would multiply. The thief,
    hearing the announcement, prefers to restore the thing rather than host those blows. Bérenger records
    this as a curiosity of priests'' revenue. The recoverable philosophy is sharper. Justice here works
    by publicity plus homology: a small body stands for a hidden agent, and the village is told. That
    is Takhar''s department in a concrete rite. This collection will not teach striking an animal. The
    usable core is the opposite of private revenge: you announce, you analogize, you wait overnight. Restoration
