    thief who still lives in the same moral weather. You can copy only the announcement and the overnight
    wait.'
- kind: key_terms
  label: Key Terms
  items:
  - term: lézard
    definition: the lizard as analogical body of the thief -> homology, not zoology -> a mascot reading
      misses that blows are believed to transfer
  - term: forgeron
    definition: the smith as the one whose strikes would multiply -> a transformer of hidden into visible
      force -> "blacksmith" as mere trade misses the office in this rite
  - term: tam-tam
    definition: the drum that makes the theft public -> justice begins as announcement -> a silent suspicion
      would not return the object
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: West African oaths at the smith's forge (regional structure)
    resonance: Both treat the smith as a dangerous transformer before whom hidden wrongs become costly.
    divergence: Forge-oaths vary by people; Bérenger's Serer instance is specifically the announced lizard
      carried toward the hammer.
  - citation: 2 Samuel 12 (Nathan's analogical ewe-lamb that indicts the thief)
    resonance: Both use a stand-in creature to make a hidden taking public and unbearable to the taker.
    divergence: Nathan speaks a parable to a king under YHWH; the Serer lizard is drummed toward a smith
      under Takhar.
- kind: practice
  label: Practice (Abhyasa)
  body: If something of yours is missing, name the loss out loud to one other person today. Do not plot
    a private revenge and do not harm a creature. Let the naming be the first justice, then wait one night
    before you act.
