unit_label: The Lizard Taken to the Smith
title: The Lizard Taken to the Smith
unit_type: teaching_passage
commentary: 'The claim is that public analogical binding can return a stolen object without a prison.
  The drum makes the loss civic. The lizard is a stand-in body. The smith is the transformer of metal,
  already a threshold person in West African cosmologies, here the one whose blows would multiply. The
  thief, hearing the announcement, prefers to restore the thing rather than host those blows. Bérenger
  records this as a curiosity of priests'' revenue. The recoverable philosophy is sharper. Justice here
  works by publicity plus homology: a small body stands for a hidden agent, and the village is told. That
  is Takhar''s department in a concrete rite. This collection will not teach striking an animal. The usable
  core is the opposite of private revenge: you announce, you analogize, you wait overnight. Restoration
  is the success, not the death. Existentially, online life is full of lizards struck in public for sport.
  This rite is narrower. It aims at the return of a particular object by frightening a particular thief
  who still lives in the same moral weather. You can copy only the announcement and the overnight wait.'
