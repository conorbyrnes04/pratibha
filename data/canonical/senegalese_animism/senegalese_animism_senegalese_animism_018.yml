- kind: key_terms
  label: Key Terms
  items:
  - term: gris-gris
    definition: protective charms (horns, sachets, hair, seed) -> few and coarse in Lasnet's Serer record
      -> "fetish" is the colonial dump; these are portable binds against soul-theft
  - term: bijoux de famille
    definition: family jewels, coral, transmitted by inheritance -> alienated only as famine-pledge ->
      the same anti-commodity grammar as the gris-gris, spoken of wealth that is also lineage
  - term: héritage
    definition: inheritance -> the proper movement of protective things -> sale is the wrong verb; even
      famine uses gage (pledge), not gift
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Numbers 36 (ancestral inheritance not to pass away from the tribe)
    resonance: Both refuse to let lineage-stuff drift into foreign hands as if it were ordinary goods.
    divergence: Numbers legislates land-and-name inside Israel; Lasnet records coral and gris-gris as
      the portable Serer instance of the same refusal.
  - citation: Catholic relics and medals kept in a family
    resonance: Both can look like "objects" to an outsider and still be non-vendible protection inside
      a cult.
    divergence: A relic is authorized by a church of the high God; Serer gris-gris bind the middle and
      leave Roog unaddressed.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Choose one inherited or protective object (a letter, a ring, a stone, a photograph). Do not sell
    it, gift it away, or post it today. Hold it and say: this is not merchandise. If you have none, write
    one sentence you will not alienate, and keep the paper.'
