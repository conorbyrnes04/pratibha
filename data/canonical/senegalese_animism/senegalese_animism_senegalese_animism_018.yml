unit_label: Gris-gris Inherited, Not Given Away
title: Gris-gris Inherited, Not Given Away
unit_type: teaching_passage
commentary: 'The claim is that what protects the line is not a commodity. Lasnet''s explicit inheritance
  sentence is about coral family jewels: transmitted, not sold, pledged only in famine. The gris-gris
  sit on the next lines as few, coarse, and non-negotiable in another way: missionaries want them renounced,
  and the Serer hear that demand as leaving them open to soul-eaters. Honest reading keeps the two objects
  distinct and the grammar one. Horn, hair, seed, coral: none of this is jewelry in a shop sense. It is
  lineage-stuff. To give it away lightly is to treat protection as a fashion. Colonial taste calls the
  horns vile and the coral a price. The teaching recovered is anti-alienation. A famine-pledge still intends
  return. A mission-renunciation intends disappearance. The Serer complaint against the missionaries is
  therefore theological, not stubbornness about charms. If souls can be eaten, you do not hand over the
  few objects that bind the middle. This is unit 10''s binding applied to portable things. Existentially,
  the passage asks what you have treated as sellable that was actually inherited protection — a practice,
  a photograph, a promise, a piece of family craft. You do not need a ram''s horn. You need one thing
  you will not list for sale.'
