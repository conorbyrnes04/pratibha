translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (Paris: Challamel, 1900) and L.-J.-B. Bérenger-Féraud, *Les peuplades de la Sénégambie*
  (Paris: Leroux, 1879), both public domain. Gravrand is not used (not PD). Boilat 1853 is named as preferred
  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Les colliers de coraux... constituent les bijoux de famille et se transmettent par héritage;
    un Sérère ne s''en dessaisit qu''à la dernière extrémité, par exemple en cas de famine, et encore
    il ne fait que les mettre en gage. Les gris-gris sont peu nombreux et des plus grossiers : cornes
    de bœuf, de biche, de bélier qui contiennent des graines de cotonnier, des cheveux et des matières
    plus viles encore. Les Sérères prétendent que les sorciers... multiplient leurs méfaits... ils accusent
    les missionnaires de les favoriser parce qu''ils essaient de les faire renoncer à leurs gris-gris.'
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Family jewels (coral) are inherited and only
    pledged in famine. Gris-gris are few, coarse, and refused to missionaries. The shared teaching: protective
    things of the line are not alienated.'
- kind: translation
  label: Pratibha Translation
  body: 'Coral necklaces are family jewels and are transmitted by inheritance. A Serer person parts with
    them only at the last extremity, for example in famine, and even then only puts them in pledge. Gris-gris
    are few and of the coarsest kind: horns of ox, hind, ram, holding cotton seeds, hair, and still viler
    matter. The Serer accuse missionaries of favoring sorcerers because they try to make people renounce
    their gris-gris.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that what protects the line is not a commodity. Lasnet''s explicit inheritance sentence
    is about coral family jewels: transmitted, not sold, pledged only in famine. The gris-gris sit on
    the next lines as few, coarse, and non-negotiable in another way: missionaries want them renounced,
