- kind: key_terms
  label: Key Terms
  items:
  - term: baptême
    definition: Lasnet's French for the seventh-day naming -> not Christian sacrament; the giving of a
      name after a week of life -> "christening" imports a church the source does not have
  - term: septième jour
    definition: the seventh day -> the delay before the person is spoken as a named someone -> birth is
      arrival; naming is admission into speech
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 1:59–63 (John named on the eighth day)
    resonance: Both delay the public name past the day of birth and treat naming as a speech-act that
      settles who the child is.
    divergence: Luke's naming is eighth-day, covenantal, and contested in the family; Lasnet's Serer seventh
      day has no particular ceremony.
  - citation: Yoruba naming (orúkọ) on a fixed early day (Samuel Johnson, structural)
    resonance: Both treat the early-day name as cosmology, not stationery.
    divergence: Johnson records a richer spoken liturgy of names; Lasnet records the delay and the refusal
      of spectacle.
- kind: practice
  label: Practice (Abhyasa)
  body: Do not announce a new identity, plan, or verdict today. Let it last until evening. At day's end,
    if it is still true, speak one quiet name for it to one person, or to the ground. No performance.
