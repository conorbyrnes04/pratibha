unit_label: Naming on the Seventh Day
title: Naming on the Seventh Day
unit_type: teaching_passage
commentary: 'The claim is that a person is not complete at birth. Seven days later a name is given, and
  Lasnet''s surprise is the teaching: there is no particular ceremony. Identity arrives as a quiet seventh-day
  act, not as a festival. The first-birth feast of the previous unit honors arrival on the mother''s ground.
  Naming is a different office. It waits. The child has been a living envelope for a week before the community
  commits a word to that life. Comparison with Muslim practice is the observer''s; the Serer structure
  stands without it. In a cosmology where souls can be eaten, enter birds, and be spoken to at the ear,
  a name is not a label stuck on a product. It is a binding of a someone into the speech of the living.
  The absence of spectacle is reverence, not poverty of rite. First-fruits get an always; the name gets
  a seventh day and no drum. Existentially, the teaching cuts the modern rush to brand a life before it
  has lasted. You do not need to copy a naming liturgy. You can let a new fact about someone — including
  yourself — remain unnamed until it has survived a week of ordinary days, and then give it a true word
  without a show.'
