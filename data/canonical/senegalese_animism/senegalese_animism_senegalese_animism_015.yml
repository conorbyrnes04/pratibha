pratibha_layers:
- kind: original
  label: Original
  body: Le baptême se fait le septième jour, comme chez les musulmans, il ne donne lieu à aucune cérémonie
    particulière.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Seventh-day naming (Lasnet: baptême), without
    a particular ceremony — identity arrives quietly after a week of life.'
- kind: translation
  label: Pratibha Translation
  body: The naming is done on the seventh day, as among the Muslims. It gives rise to no particular ceremony.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a person is not complete at birth. Seven days later a name is given, and Lasnet''s
    surprise is the teaching: there is no particular ceremony. Identity arrives as a quiet seventh-day
    act, not as a festival. The first-birth feast of the previous unit honors arrival on the mother''s
