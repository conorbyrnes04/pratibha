unit_label: The Soul Continues; Watch the Sky at Death
title: The Soul Continues; Watch the Sky at Death
unit_type: teaching_passage
commentary: 'The claim is that death is not annihilation and not only a departure "up" to Roog. The soul
  continues, and it may continue as a bird. Lasnet''s word métempsycose is the French philosophical term
  for transmigration. What matters is the practice that follows from it: at the moment of death, attention
  goes to the sky. The same sky that names Roog is now scanned for a living sign that the person has taken
  another body of motion. Joy at the bird is theologically precise. If the soul can enter a bird, the
  dead are not trapped in the corpse and not erased. The corpse can be washed, oiled, spoken to (next
  unit); the soul may already be in flight. Watching the sky is therefore not omen-hunting in a vague
  sense. It is a metaphysics of continuity performed with the eyes. The bird is not a symbol of the soul
  in the way a poet uses a symbol. In the reported belief, the soul has entered the bird''s body. This
  also closes a circle with unit 1. The sky is the master''s name and the soul''s exit-path. Animism here
  is not "everything is alive" as a slogan. It is a specific permeability: human soul, bird-body, sky-field.
  Delafosse''s nia — personal life-soul surviving the corpse, of the same essence as other beings'' souls
  — is the regional theory of this Serer joy. Existentially, the rite trains a non-panic attention at
  the threshold. The instruction is not "do not grieve." Lasnet''s funeral section is full of cries. The
  instruction is: look up. See whether life has already taken another vehicle. Continuity is not an argument
  you win in a seminar. It is a bird you might miss if you only stare at the corpse.'
