pratibha_layers:
- kind: original
  label: Original
  body: Les Sérères croient à une vie future et à la métempsycose, aussi quand l'un d'eux vient de mourir,
    ils examinent aussitôt le ciel et, s'ils voient voler un oiseau, ils sont pleins de joie, car ils
    pensent que l'âme du défunt est entrée dans son corps.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Practice: immediately after a death, look
    at the sky; a bird in flight is read as the soul''s passage (métempsycose).'
- kind: translation
  label: Pratibha Translation
  body: The Serer believe in a future life and in metempsychosis. So when one of them has just died, they
    at once examine the sky, and if they see a bird flying, they are full of joy, because they think the
    soul of the deceased has entered its body.
- kind: commentary
  label: Pratibha Commentary
