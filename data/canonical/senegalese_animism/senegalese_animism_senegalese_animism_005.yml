- kind: key_terms
  label: Key Terms
  items:
  - term: métempsycose
    definition: metempsychosis, transmigration of the soul -> Lasnet's philosophical label for Serer afterlife
      belief -> "reincarnation" as a later human birth is narrower than the reported bird-entry
  - term: âme du défunt
    definition: soul of the deceased -> a principle that can leave the washed body and enter a bird ->
      not the social memory of the person, and not a ghost stuck in the house by default
  - term: oiseau
    definition: bird in flight as possible body of the departed soul -> joy, not fear, is the correct
      affect if the bird appears -> a "bad omen" reading inverts the source
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 2.22
    resonance: Both image the soul as changing garments or vehicles.
    divergence: The Gītā's garment is typically another human or cosmic birth in karmic sequence; Lasnet's
      Serer image is an immediate bird in this sky.
  - citation: Phaedo 80c–84b
    resonance: Both treat death as a separation in which the soul's next state depends on its nature,
      and both refuse to equate the person with the corpse.
    divergence: Plato's soul seeks the intelligible; the Serer report allows the soul a bird-body in the
      same sky that names God.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you next see a bird cross open sky, pause. Without forcing a belief, let the thought stand:
    a life-soul can move. Then look back at your own body and notice it as a current vehicle, not as the
    whole of what you are.'
