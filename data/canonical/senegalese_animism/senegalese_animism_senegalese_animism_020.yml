unit_label: Awa Holds the First Seat of the House
title: Awa Holds the First Seat of the House
unit_type: teaching_passage
commentary: 'The claim is that a house is a cosmos with a first seat. Lasnet''s sentence is short and
  it is enough. Authority in the square is named: awa. The women are not a heap. Each has a distinct case
  and her children. The husband is not the center of a single room; he lodges apart. Comparison with Muslim
  custom is the observer''s crib. The Serer structure is spatial and hierarchical at once: one carré,
  several dwellings, one first-seat. This is not a romance of polygamy and not a license for the surrounding
  pages'' ethnography of capture and incest, which this collection refuses as teaching. What is kept is
  the philosophy of the household as ordered multiplicity. In a religion of local mammam — genius of the
  house among them — the square is already a small village of spirits. Someone must hold the first relation
  to that genius. Awa is that office. Existentially, most modern households still have an unnamed first-seat
  and unnamed separate rooms of power, and they pretend otherwise until a fight. The teaching is to name
  the order without pretending the house is a single self. You do not appoint an awa. You can admit who
  actually holds first care in your square, give that person one concrete honor today, and keep distinct
  rooms from collapsing into a blur.'
