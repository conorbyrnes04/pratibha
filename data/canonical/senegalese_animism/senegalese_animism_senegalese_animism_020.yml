- kind: key_terms
  label: Key Terms
  items:
  - term: awa
    definition: first wife; holder of authority over the other wives in the square -> household cosmology,
      not a romance title -> "senior wife" in a soap-opera sense misses the office
  - term: carré
    definition: the square of houses -> one compound, several dwellings -> the village in miniature, already
      a map of mammam
  - term: cases distinctes
    definition: distinct houses with their children -> multiplicity inside the bond -> a single shared
      bedroom as the image of family would erase this cosmos
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Proverbs 31 and the named competent woman of the house
    resonance: Both treat household authority as an office with a public name, not as private charm.
    divergence: Proverbs praises a wife inside a patriarchal Israelite house of one God; awa is first-seat
      in a plural square whose house-spirit is addressed, not Roog.
  - citation: Roman paterfamilias versus the mater of the domus
    resonance: Both know that a domestic world has a ranked speaker, not a cloud of equals pretending
      to have no order.
    divergence: Roman law centers the father; Lasnet's Serer square names the first wife as the authority
      among the women and lodges the husband apart.
- kind: practice
  label: Practice (Abhyasa)
  body: Name who actually holds first care in your household or shared place — including if it is you.
    Do one act of honor toward that office today (thanks, a task taken off them, a door left closed).
    Do not invent a rank you do not live.
