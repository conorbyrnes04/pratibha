pratibha_layers:
- kind: original
  label: Original
  body: Comme chez les musulmans, la première femme a autorité sur les autres et s'appelle awa; elles
    habitent toutes le même carré, mais occupent des cases distinctes avec leurs enfants, le mari a également
    son logement à part.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key term: awa — first wife as household authority.
    Distinct houses in one square; the husband also lodges apart. Household cosmology, not a catalog of
    marriage violence.'
- kind: translation
  label: Pratibha Translation
  body: As among the Muslims, the first wife has authority over the others and is called awa. They all
    live in the same square, but occupy distinct houses with their children; the husband likewise has
    his lodging apart.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a house is a cosmos with a first seat. Lasnet''s sentence is short and it is
    enough. Authority in the square is named: awa. The women are not a heap. Each has a distinct case
