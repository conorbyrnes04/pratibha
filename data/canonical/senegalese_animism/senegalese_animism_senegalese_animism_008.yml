unit_label: Souls of One Essence in Every Being
title: Souls of One Essence in Every Being
unit_type: teaching_passage
commentary: 'The claim is ontological equality of essence across kinds, plus difference of office. Lasnet
  does not write the word essence. He writes a world in which a forest, a field, a spring, a village,
  a house, a baobab, a bird, and a newly dead human are all sites of personal life. That list is already
  the doctrine. A person''s soul, a baobab''s mammam, a spring''s génie are the same sort of thing: addressable
  life. They are not the same job. While a living human soul is busy governing its own body, it is not
  a god. After death, freed from that inner administration, the same life may take a bird or become a
  power the living must reckon with. A field, having no wandering animal body to run, already has that
  outward independence — which is why land-soul and ancestor-soul can fuse, and why the Serer pour at
  the baobab rather than at an empty symbol. Later Delafosse will name this nia: personal life of one
  essence in the apparently inanimate as well as the animate. The Senegalese instance does not wait for
  the Mande word. Libation makes sense only if the tree has a life. Speaking into the ear makes sense
  only if the dead still have a life. Not addressing Roog makes sense if Roog is sky-scale soul, not a
  nearby specialist. Existentially, the teaching forbids two reductions. You may not treat a place as
  dead stuff. You may not treat a person as only a body. And you may not treat all souls as interchangeable
  helpers. Personality means this tree, this spring, this ancestor — not "energy." The contemplative implication
  is severe: relation is always particular. Animism is the opposite of a blur.'
