- kind: key_terms
  label: Key Terms
  items:
  - term: mammam
    definition: spirits of forest, field, spring, village, house -> personal lives of places, not a generic
      life-force -> "energy" erases personality; "god" overstates department
  - term: âme
    definition: soul able to leave a washed body and enter a bird -> the human instance of the same personal
      life the baobab already has -> English "soul" can sound Christian-immortal in a different key; here
      it is movable life
  - term: pangool
    definition: later Serer name for the free ancestral and land powers in this middle -> what the living
      bind by rite -> not every mammam is an ancestor; some are other-than-human from the start
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Śiva Sūtra I.1 (caitanyam ātmā)
    resonance: Both refuse to treat awareness or life-principle as a byproduct of matter.
    divergence: The sūtra identifies consciousness as the Self of all; Lasnet describes many personal
      lives of places and birds, not one Self.
  - citation: Zhuangzi, butterfly dream / Free and Easy Wandering
    resonance: Both make the species-boundary permeable to spirit.
    divergence: Zhuangzi's register is transformation and epistemic play; Serer watching and pouring are
      funeral and agricultural epistemology, not play.
- kind: practice
  label: Practice (Abhyasa)
  body: Walk through one ordinary setting (kitchen, street, field). Name three distinct beings — a tool
    or stone, a plant, a person. For each, silently say "personal life, not mine." Feel the difference
    between that recognition and a vague glow of "everything is one."
provenance:
