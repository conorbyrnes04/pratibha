translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (Paris: Challamel, 1900) and L.-J.-B. Bérenger-Féraud, *Les peuplades de la Sénégambie*
  (Paris: Leroux, 1879), both public domain. Gravrand is not used (not PD). Boilat 1853 is named as preferred
  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: Ils croient surtout aux esprits, mammam, et ne s'adressent jamais à Dieu; ces esprits sont très
    nombreux, il y a le génie de la forêt, des champs, de la fontaine, du village, de la case, etc. Ils
    résident volontiers dans certains arbres comme le baobab. Les Sérères croient à une vie future et
    à la métempsycose... ils pensent que l'âme du défunt est entrée dans son corps.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Ontology recovered from Lasnet: mammam of
    forest, field, spring, village, house; human soul able to enter a bird. Same-essence language is the
    philosophical reading of that populated world.'
- kind: translation
  label: Pratibha Translation
  body: 'They believe above all in the spirits, mammam — genius of the forest, the fields, the spring,
    the village, the house — and those spirits willingly reside in certain trees such as the baobab. They
    believe in a future life and in metempsychosis: the soul of the dead may enter the body of a bird.
    Personal life is not confined to the human envelope.'
