unit_label: The Woods Are Sanctuaries
title: The Woods Are Sanctuaries
unit_type: teaching_passage
commentary: 'The claim is that sanctuary is not masonry. If justice and increase live in the greatest
  trees, then to enter the woods is already to enter a court and a granary. Bérenger''s de sorte que is
  logical, not scenic. Sacredness follows from dwelling. The tree is not a symbol of Takhar. Takhar inhabits
  it. Age matters: arbres séculaires have already outlasted lawsuits and harvests. A justice that lives
  in a centuries-old tree is not the justice of the latest strong man. An increase that lives there is
  not this year''s profit. Lasnet''s baobab-libation is the household form of the same fact; Bérenger
  names the forest as institutional space without walls. Colonial "poetry of childish forest mysticism"
  on the surrounding page is refused. The recoverable teaching is architectural: the Serer did not fail
  to build temples. They located temples where the gods already lived. Existentially, a walk in "nature"
  that treats trees as carbon and shade has already desecrated this sanctuary without cutting a trunk.
  The practice is to enter one stand of old trees as if you had taken off your shoes in a court, and to
  keep Takhar and Tiurakh from collapsing into a mood.'
