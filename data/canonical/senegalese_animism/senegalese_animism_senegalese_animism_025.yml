pratibha_layers:
- kind: original
  label: Original
  body: Ces deux dieux habitent dans les plus grands arbres des forêts, de sorte que les bois sont pour
    les Sérères des lieux sacrés, et les arbres séculaires des sanctuaires vénérés.
- kind: iast
  label: Romanization
  body: French ethnographic report of Serer oral teaching. Takhar and Tiurakh inhabit the greatest trees;
    therefore the woods are sacred places and age-old trees are venerated sanctuaries.
- kind: translation
  label: Pratibha Translation
  body: These two gods inhabit the greatest trees of the forests, so that the woods are sacred places
    for the Serer, and the age-old trees venerated sanctuaries.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that sanctuary is not masonry. If justice and increase live in the greatest trees,
    then to enter the woods is already to enter a court and a granary. Bérenger''s de sorte que is logical,
    not scenic. Sacredness follows from dwelling. The tree is not a symbol of Takhar. Takhar inhabits
    it. Age matters: arbres séculaires have already outlasted lawsuits and harvests. A justice that lives
    in a centuries-old tree is not the justice of the latest strong man. An increase that lives there
    is not this year''s profit. Lasnet''s baobab-libation is the household form of the same fact; Bérenger
    names the forest as institutional space without walls. Colonial "poetry of childish forest mysticism"
    on the surrounding page is refused. The recoverable teaching is architectural: the Serer did not fail
    to build temples. They located temples where the gods already lived. Existentially, a walk in "nature"
    that treats trees as carbon and shade has already desecrated this sanctuary without cutting a trunk.
    The practice is to enter one stand of old trees as if you had taken off your shoes in a court, and
    to keep Takhar and Tiurakh from collapsing into a mood.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bois
    definition: the woods as sacred places because the two gods inhabit the greatest trees -> sacred geography,
      not scenery -> "nature spirituality" is too generic; these are particular groves
  - term: arbres séculaires
    definition: age-old trees as venerated sanctuaries -> duration is part of the office -> a sapling
      planted as a symbol would not yet be this
  - term: Takhar / Tiurakh
    definition: justice and increase as tree-dwelling powers -> the reason the woods are sanctuaries ->
      without the pair, "sacred grove" is only atmosphere
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Greek alsos / sacred grove of a named god
    resonance: Both make the grove a precinct because a power inhabits the trees, not because forest is
      pretty.
    divergence: Greek groves are often walled and priest-staffed for Olympian names; Serer woods in this
      source are the sanctuary itself, without a temple of Roog.
  - citation: Shinto chinju no mori (shrine forest)
    resonance: Both keep old trees as the house of presence rather than as lumber.
    divergence: Shinto forest is attached to shrine buildings and kami-names in writing; Bérenger's Serer
      forest is the building.
- kind: practice
  label: Practice (Abhyasa)
  body: Enter one actual grove, park of old trees, or single elder tree. Do not photograph first. Stand
    as in a sanctuary for three minutes. Sort one concern into justice or increase, then leave without
    taking a souvenir.
