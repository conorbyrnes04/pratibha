unit_label: 'Bante: The Soul Enclosed in a Canari'
title: 'Bante: The Soul Enclosed in a Canari'
unit_type: teaching_passage
commentary: 'The claim is that a soul can be bound in a vessel and parked under a consecrated tree — and
  that this possibility is already a politics of fear. Bante is unit 10''s grammar turned to harm. Milk
  at the baobab binds a house to a spirit; the canari under the same kind of tree binds a someone against
  their will. The empty red jar is not a symbol. In the reported rite it is a prison of personal life.
  The tree is the sanctuary of units 3 and 25. Enclosure plus sanctuary is what makes the brave afraid.
  Bérenger then adds his colonial poison-suspicion: perhaps the Fitaure poisons the family to keep the
  superstition useful. That sentence is named here as divergence, not as doctrine. It tells you how the
  observer needed the rite to be a fraud. The teaching recoverable without that sneer is already severe.
  Binding is morally two-faced. The same cosmology that feeds the dead and the field can enclose an enemy''s
  soul because souls are personal, local, and movable. This collection does not teach Bante as a thing
  to do. It teaches the terror as evidence of the metaphysics: if souls could not be housed, a jar under
  a baobab would be pottery. Existentially, most harm you will meet is already a small Bante — rumor,
  exclusion, a file, a silent campaign — an attempt to put a life in a vessel and set it where it cannot
  breathe. The practice is to refuse that office, not to acquire it.'
