    an enemy''s soul because souls are personal, local, and movable. This collection does not teach Bante
    as a thing to do. It teaches the terror as evidence of the metaphysics: if souls could not be housed,
    a jar under a baobab would be pottery. Existentially, most harm you will meet is already a small Bante
    — rumor, exclusion, a file, a silent campaign — an attempt to put a life in a vessel and set it where
    it cannot breathe. The practice is to refuse that office, not to acquire it.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Bante
    definition: the operation of enclosing a soul in a canari under a consecrated tree -> binding used
      as fear -> "hex" is too folkloric; this is cult-grammar turned against a someone
  - term: canari
    definition: large red earthen jar -> the empty vessel as prison of personal life -> pottery as hardware
      ("fetish") misses that the jar is a house
  - term: Fitaure
    definition: religious minister and civic head of a settlement -> the one who can accept the gifts
      and perform the enclosure -> not a mere mayor and not a mere sorcerer
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aeschylus, binding spells and jar-like constraint of a hated name (katadesmos, structural)
    resonance: Both imagine a person constrained by placing a life into a vessel or formula parked in
      a sacred place.
    divergence: Greek katadesmos is often underworld-written; Bante is tree-sanctuary animism administered
      by a civic-religious head.
  - citation: Mark 5:1–13 (a legion of spirits sent into a herd — souls movable between vessels)
    resonance: Both treat personal life as transferable between bodies and containers.
    divergence: The Gospel scene is exorcism under Jesus' authority; Bante is enclosure for vengeance,
      which this collection refuses as practice.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Notice one way you have tried to enclose another person''s life (a rumor, a silent punishment,
    a withheld word). Release one enclosure today: speak a fair sentence, drop a campaign, or return a
    freedom. Do not practice binding a soul.'
