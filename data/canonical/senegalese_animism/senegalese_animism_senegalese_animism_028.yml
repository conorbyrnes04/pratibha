pratibha_layers:
- kind: original
  label: Original
  body: 'Celui qui veut se venger d''un ennemi, vient trouver le Fitaure qui est le ministre religieux
    en même temps que le chef d''une agglomération et il tâche de le décider, à force de cadeaux, à faire
    le Bante : terrible opération qui frappe de terreur les plus braves du pays. Au milieu de maints présents,
    il a mis un canari (gros vase en terre rouge) vide, si le Fitaure agrée ce qui lui est offert, il
    fait diverses cérémonies qui ont pour but d''enfermer l''âme de l''ennemi dans le canari, et ce vase
    est déposé sous un baobab ou un fromager consacré. Celui dont l''âme est ainsi enfermée dans un canari,
    meurt peu de temps après.'
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key terms: Bante — enclosing a soul in a canari;
    Fitaure — religious-and-civic head. Bérenger''s poison-suspicion is colonial divergence, not Serer
    doctrine.'
- kind: translation
  label: Pratibha Translation
  body: One who wants vengeance on an enemy comes to the Fitaure — religious minister and head of a settlement
    at once — and tries, by gifts, to have him perform the Bante, a terrible operation that strikes terror
    even in the bravest of the land. Among the presents is an empty canari, a large red earthen jar. If
    the Fitaure accepts, he performs ceremonies whose aim is to enclose the enemy's soul in the canari,
    and the jar is placed under a consecrated baobab or fromager. The one whose soul is thus enclosed
    dies not long after.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a soul can be bound in a vessel and parked under a consecrated tree — and that
    this possibility is already a politics of fear. Bante is unit 10''s grammar turned to harm. Milk at
    the baobab binds a house to a spirit; the canari under the same kind of tree binds a someone against
    their will. The empty red jar is not a symbol. In the reported rite it is a prison of personal life.
    The tree is the sanctuary of units 3 and 25. Enclosure plus sanctuary is what makes the brave afraid.
    Bérenger then adds his colonial poison-suspicion: perhaps the Fitaure poisons the family to keep the
    superstition useful. That sentence is named here as divergence, not as doctrine. It tells you how
    the observer needed the rite to be a fraud. The teaching recoverable without that sneer is already
