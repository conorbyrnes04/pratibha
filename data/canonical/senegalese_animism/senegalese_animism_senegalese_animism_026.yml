- kind: key_terms
  label: Key Terms
  items:
  - term: Takhar
    definition: justice as a living forest presence whose priests are family-elders -> not a sky-God court
      -> Roog remains unaddressed while theft is spoken to Takhar
  - term: prêtres
    definition: old men of certain families who judge theft and sorcery -> kinship clergy of justice ->
      "witch-finder" is the colonial collapse of the office
  - term: vol / sorcellerie
    definition: theft and sorcery as the two judged questions -> stealing goods and stealing soul as one
      department -> modern law splits them; this cult does not
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Exodus 18 (elders judging ordinary cases under a higher law)
    resonance: Both lodge day-to-day judgment in elders who still stand under a larger justice they do
      not invent.
    divergence: Mosaic elders sit under YHWH's Torah; Takhar's priests pray a tree-dwelling justice and
      do not address Roog.
  - citation: Lasnet's gisanekal (this collection, unit 13)
    resonance: Both authorize a specialist of hidden harm rather than leaving soul-crime or theft to private
      force.
    divergence: Gisanekal starts from a death; Takhar's priest starts from a complaint of stolen goods
      or sorcery.
- kind: practice
  label: Practice (Abhyasa)
  body: If something was taken from you (an object, credit, a story), do not post it. Tell the facts once
    to one fair person older than the quarrel. Ask for rightness, not for a show. If nothing was taken,
    practice the same restraint on a rumor you were about to complete.
