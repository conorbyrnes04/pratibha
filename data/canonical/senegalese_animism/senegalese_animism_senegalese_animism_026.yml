pratibha_layers:
- kind: original
  label: Original
  body: Le dieu Takhar a pour ministres ou prêtres des vieillards recrutés dans certaines familles, ce
    sont eux qui jugent les questions de vol et de sorcellerie. Quand un individu a été volé, il va porter
    sa plainte au prêtre du Dieu Takhar auquel il donne tous les renseignements qu'il peut fournir, indiquant
    les soupçons qu'il a contre tel ou tel voisin; le prêtre en instruit le Dieu à l'aide de prières appropriées.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Priests of Takhar: elders recruited from certain
    families; they judge theft and sorcery. The priest instructs the god by prayer. Bérenger''s "savage"
    is observer contempt, not the office.'
- kind: translation
  label: Pratibha Translation
  body: The god Takhar has for ministers or priests old men recruited from certain families. They are
    the ones who judge questions of theft and of sorcery. When someone has been robbed, he takes his complaint
    to the priest of the god Takhar, gives all the information he can, and names the neighbors he suspects.
    The priest instructs the god by means of prayers fitted to the case.
