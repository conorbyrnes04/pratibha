unit_label: Takhar's Priests Judge Theft and Sorcery
title: Takhar's Priests Judge Theft and Sorcery
unit_type: teaching_passage
commentary: 'The claim is that justice is a priesthood before it is a police. Theft and sorcery are the
  two crimes that matter because both steal what a person is or has. Takhar''s elders are recruited from
  certain families: office is kinship, as the lamane is kinship with soil. The procedure is speech. The
  wronged person brings information and suspicion. The priest does not first invent a dungeon. He instructs
  the god by prayer. Bérenger''s sneer that the prayer matches the gift rather than the object is colonial
  suspicion, named as divergence, not as doctrine. The teaching is that a stolen thing is a matter for
  the forest-justice, and that the god must be told. Guilt may then fall as illness; that consequence
  is recorded as belief, not as a recipe. Unit 13''s gisanekal searches from a death; this unit''s priest
  searches from a complaint. Together they say: hidden harm is not left to the strong. Existentially,
  modern life either litigates everything or gossips everything. This office is a third: a named elder
  who can speak the theft to a justice that is not the complainant''s appetite. You cannot appoint yourself
  priest of Takhar. You can take one real loss to a fair elder rather than to a crowd, and you can pray
  the facts without adding vengeance as if it were information.'
