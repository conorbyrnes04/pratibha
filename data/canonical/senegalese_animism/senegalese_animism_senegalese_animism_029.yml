unit_label: The Ordeal Drink Is Milder Here
title: The Ordeal Drink Is Milder Here
unit_type: teaching_passage
commentary: The claim is that hidden soul-crime is put to a bodily test, and that Serer practice in this
  source is already a milder form of a wider Senegambian ordeal. Bérenger cannot help sneering at "salutary
  fear" and "the lower people." That contempt is not the teaching. The teaching is comparative and philosophical
  at once. Toward the open Cap-Vert the forest thickens less, accusations weigh less, and the drink is
  less often death. Toward Casamance the same structure is harsher. Geography of sanctuary (unit 25) and
  geography of ordeal travel together. Truth about sorcery is not a rumor the village votes on. It is
  a sip the body accepts or rejects. This collection will not teach anyone to drink a deciding poison.
  Lasnet already recorded poison and fire beside gisanekal. The usable core is the refusal of mere talk.
  An accusation of soul-theft demands a procedure, and the Serer procedure is recorded as less lethal
  than their southern neighbors'. Existentially, online accusation is an ordeal with no priest and no
  milder form. The practice is to refuse the sip you want someone else to take, and to sit with not-knowing
  rather than demand a body as proof.
