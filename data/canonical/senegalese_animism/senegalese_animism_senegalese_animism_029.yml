pratibha_layers:
- kind: original
  label: Original
  body: Les prêtres du dieu Takhar sont aussi chargés de juger les accusations de sorcellerie; ils examinent
    les individus incriminés, leur préparent un breuvage qui a la propriété de les faire mourir si réellement
    ils sont sorciers, et qui est simplement rejeté s'ils n'entretiennent aucune relation avec les esprits
    infernaux. Seulement, comme à mesure que les Sérères ont gagné les environs du cap Vert... l'épreuve
    que ces prêtres font subir aux accusés a été moins terrible. La mort ne s'en suit que tout juste assez
    pour entretenir le bas peuple dans une salutaire crainte de la divinité.
- kind: iast
  label: Romanization
  body: French ethnographic report of Serer oral teaching. Takhar's priests judge sorcery by a drink that
    kills the guilty and is rejected by the innocent. Bérenger records the Serer ordeal as milder than
    Casamance. The drink is not a practice to copy.
- kind: translation
  label: Pratibha Translation
  body: The priests of the god Takhar are also charged with judging accusations of sorcery. They examine
    the accused and prepare a drink that will kill them if they are truly sorcerers, and that is simply
    rejected if they keep no relation with infernal spirits. As the Serer have come toward Cap-Vert, into
    opener country, the ordeal has been less terrible than among the peoples of Casamance. Death follows
    only just enough to keep a salutary fear of the divinity.
- kind: commentary
  label: Pratibha Commentary
  body: The claim is that hidden soul-crime is put to a bodily test, and that Serer practice in this source
    is already a milder form of a wider Senegambian ordeal. Bérenger cannot help sneering at "salutary
    fear" and "the lower people." That contempt is not the teaching. The teaching is comparative and philosophical
    at once. Toward the open Cap-Vert the forest thickens less, accusations weigh less, and the drink
    is less often death. Toward Casamance the same structure is harsher. Geography of sanctuary (unit
    25) and geography of ordeal travel together. Truth about sorcery is not a rumor the village votes
    on. It is a sip the body accepts or rejects. This collection will not teach anyone to drink a deciding
    poison. Lasnet already recorded poison and fire beside gisanekal. The usable core is the refusal of
    mere talk. An accusation of soul-theft demands a procedure, and the Serer procedure is recorded as
    less lethal than their southern neighbors'. Existentially, online accusation is an ordeal with no
    priest and no milder form. The practice is to refuse the sip you want someone else to take, and to
    sit with not-knowing rather than demand a body as proof.
- kind: key_terms
  label: Key Terms
  items:
  - term: breuvage
    definition: the ordeal drink prepared by Takhar's priests -> accepted death if guilty, rejection if
      innocent -> not a toast and not a recipe
  - term: Cap-Vert / Casamance
    definition: opener country versus forest south -> Bérenger's map of why Serer ordeal is milder ->
      geography of trees and geography of fear are one dossier
  - term: esprits infernaux
    definition: Bérenger's gloss for the powers a sorcerer would keep -> colonial "infernal" imports a
      Christian hell -> the Serer middle is mammam and pangool, which can harm without being Satan
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Numbers 5 (the ordeal drink of bitter water)
    resonance: Both put a hidden sexual or cultic accusation to a drink whose effect on the body is taken
      as the god's verdict.
    divergence: Numbers is priestly law under YHWH for suspected adultery; Takhar's drink is sorcery-judgment
      in a tree-religion that does not address Roog.
  - citation: Lasnet's fire-ordeal on the tongue (this collection, unit 13)
    resonance: Both record a bodily test of the accused in the same people.
    divergence: Lasnet's iron is gisanekal's search after a death; Bérenger's drink is Takhar's priests
      judging a sorcery charge, and he insists it is milder than Casamance.
- kind: practice
  label: Practice (Abhyasa)
  body: When you next want a test that would settle someone's guilt in a gulp, refuse that sip. Sit with
    not-knowing for one hour. Then do one fair act that does not require a verdict. Do not play with drink,
    fire, or public ordeal.
