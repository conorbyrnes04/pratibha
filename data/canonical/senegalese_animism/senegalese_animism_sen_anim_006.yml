unit_label: Speak to the Dead at the Ear
title: Speak to the Dead at the Ear
unit_type: sutra
sanskrit_devanagari: Aussitôt après la mort le corps est soigneusement lavé, couvert d'huile ou de beurre et enveloppé de
  pagnes, les femmes poussent des cris et des gémissements... deux ou trois anciens de la famille prononcent des discours,
  puis tous vont successivement faire leurs adieux au décédé et lui parler à l'oreille. L'enterrement a lieu le jour même
  du décès, la fosse est creusée en dehors du village et orientée vers l'est... Aux pieds du mort on place quelquefois sa
  pipe, son tabac, de l'eau et un peu de couscous.
sanskrit_iast: 'Not applicable. Practice sequence: wash and oil the body; farewell speeches; speak into the ear of the dead;
  same-day burial facing east; place water and couscous at the feet.'
translation_literal: Immediately after death the body is carefully washed, covered with oil or butter, and wrapped in cloths.
  Two or three elders of the family deliver speeches, then all go in turn to bid farewell to the deceased and to speak into
  his ear. Burial is the same day, the grave dug outside the village and oriented toward the east. At the feet of the dead
  one sometimes places a pipe, tobacco, water, and a little couscous.
commentary: 'The claim is that the newly dead still hear. Funeral practice is not disposal. It is the last conversation in
  the old vehicle, while unit 5 watches for the soul in the sky. Lasnet''s detail — *lui parler à l''oreille* — is the most
  intimate practice in the PD dossier. You do not announce grief only to the living. You put your mouth to the ear of the
  washed body and speak as to someone who is still a someone.


  Washing, oiling, wrapping are not hygiene theater. They are honor paid to a body that has hosted a *nia* (in Delafosse''s
  Manding term) and may still be listening at the threshold. Eastward orientation of the grave aligns the body with rising
  light, the same sky-axis as Roog. Water and couscous at the feet continue the food-logic of libation: the dead still belong
  to the economy of thirst and grain. The village boundary (*en dehors du village*) marks a change of residence, not an expulsion
  from relation.


  This unit is how Senegalese animism handles the hardest philosophical test: is the other still there when the breath has
  stopped? The practice answers yes, long enough to speak, and then yes in another mode (bird, ancestor, pangool). Colonial
  observers linger on alcohol and gunshots in the surrounding paragraphs. The usable core is quieter: wash, oil, speak into
  the ear, face the body east, leave water.


  Existentially, the teaching is against the modern habit of treating the corpse as a problem for logistics. If you will one
  day be spoken to in the ear, you are not only a medical event. And if you will one day have to speak into an ear, the work
  of love is verbal presence at a threshold you cannot control.


  Key Terms:


  **parler à l''oreille** - to speak into the ear of the deceased -> the dead as still addressable in the washed body -> "saying
  goodbye" in a purely sentimental sense misses the metaphysics: they hear.


  **orientée vers l''est** - grave oriented toward the east -> alignment with rising sky-light, the Rog-axis -> "facing east"
  as mere custom without the sky-God of unit 1 is incomplete.


  **couscous / eau** - grain-food and water placed at the feet -> the dead remain in the millet-and-water economy of libation
  -> "grave goods" as archaeology misses that this is continued feeding.


  **anciens de la famille** - family elders who speak first -> speech at death is ordered, not only raw lament -> priesthood
  here is kinship seniority, matching Delafosse''s familial animism.


  Cross-Tradition Resonances:


  **Tibetan *powa* / ear-whispered death instructions (structural, not a PD source-text here):** Both speak to the dying/dead
  as still capable of taking instruction or farewell.

  *Divergence:* Tibetan practice guides the consciousness through bardos; Serer practice in Lasnet is farewell and feeding,
  not a mapped intermediate-state manual.


  **Egyptian Opening of the Mouth (structural):** Both treat the dead body as a site where speech and sensory function must
  be honored.

  *Divergence:* Egyptian rite is temple-priestly and afterlife-book based; Serer rite is family-elders at the house and grave
  the same day.


  **Jewish sitting shiva / washing the dead (*taharah*):** Both refuse to treat the body as trash, and both organize speech
  and care around the dead.

  *Divergence:* Jewish practice is monotheistic without local tree-spirits; Serer care sits inside an animist world where
  the soul may already be a bird.'
insight: The claim is that the newly dead still hear.
practice: You do not need a death today to train this. Sit with someone living. For one minute, speak as if the ear is holy
  — slow, particular, nothing performative. Then, alone, say one sentence you would want spoken into your ear at the threshold.
  Keep it true.
