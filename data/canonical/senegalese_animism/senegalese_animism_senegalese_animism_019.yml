pratibha_layers:
- kind: original
  label: Original
  body: L'enterrement a lieu le jour même du décès, la fosse est creusée en dehors du village et orientée
    vers l'est, le lit du défunt est déposé dans le fond et le corps couché par-dessus; elle est couverte
    avec des branchages et des nattes, au-dessus on place la toiture de la case que l'on recouvre ensuite
    de terre ou de coquillages, la transformant en véritable tumulus. Aux pieds du mort on place quelquefois
    sa pipe, son tabac, de l'eau et un peu de couscous; auprès de la tombe on plante un piquet auquel
    sont suspendus son arc et ses flèches.
- kind: iast
  label: Romanization
  body: French ethnographic report of Serer oral teaching. East-facing grave outside the village; pipe,
    tobacco, water, and couscous at the feet; roof of the house made into a tumulus. Speech at the ear
    is unit 6; this unit is orientation and continued feeding.
- kind: translation
  label: Pratibha Translation
  body: Burial is the same day. The grave is dug outside the village and oriented toward the east. The
    dead person's bed is laid in the bottom and the body laid upon it. Branches and mats cover it; the
    roof of the house is placed above and covered with earth or shells, becoming a true tumulus. At the
    feet one sometimes places the pipe, tobacco, water, and a little couscous. Beside the tomb a stake
    is planted, and from it hang the bow and arrows.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the dead still thirst and still face the rising sky. Unit 6 kept the ear. This
    unit keeps the axis and the meal. East is not decoration. It is the Rog-axis of unit 1: the same sky
    that names the invisible master is the direction the body is aimed. Water and couscous at the feet
    continue the millet-and-water economy of libation. The dead have changed residence (outside the village)
    without leaving the household''s food-world. The roof of the case becoming a tumulus is the house
    itself given to the new dwelling. A person is not extracted from architecture and dropped in a hole.
    The house-roof goes with them, then earth or shells make a mound. Bow and arrows at the stake say
    the dead still have a day outside the grave-goods museum: tools of a life are parked beside, not thrown
    away as trash. Colonial observers linger on drink after the burial. The usable core is drier: face
    east, leave water, give the roof. Existentially, the teaching is against the sealed, directionless,
    unfed modern grave as the image of what a person was. You may not control a cemetery. You can orient
    one act of care toward rising light and leave one ordinary need (water, a word, a tool) with someone
    who cannot fetch it.'
- kind: key_terms
  label: Key Terms
  items:
  - term: orientée vers l'est
    definition: oriented toward the east -> alignment with rising sky-light, the Rog-axis -> compass custom
      without unit 1 is incomplete
  - term: eau / couscous
    definition: water and grain at the feet -> the dead remain in the libation economy -> "grave goods"
      as archaeology misses continued feeding
  - term: tumulus
    definition: the house-roof covered with earth or shells -> the dwelling follows the dead -> a flat
      anonymous grave would deny the change of residence
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jewish burial facing a holy direction and leaving the dead with care, not display
    resonance: Both refuse a directionless dumping of the body and keep the dead inside a people's map
      of the world.
    divergence: Jewish orientation is toward the Temple / east in many diasporas under one God; Serer
      east is the sky-name of Roog plus water at the feet for a still-thirsty someone.
  - citation: Egyptian burial with food and tools for a continuing person
    resonance: Both treat the dead as still needing the economy of the living.
    divergence: Egyptian provision is temple-booked for a long afterlife; Serer provision is same-day,
      household, and paired with possible bird-metempsychosis.
- kind: practice
  label: Practice (Abhyasa)
  body: At sunrise or the nearest morning you have, face east for one minute. Then set a cup of water
    on the ground at your feet as if for someone who still thirsts. Pour it out when you leave. Do not
    make a shrine. Keep the orientation and the gift.
