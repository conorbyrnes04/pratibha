unit_label: The Grave Faces East; Water at the Feet
title: The Grave Faces East; Water at the Feet
unit_type: teaching_passage
commentary: 'The claim is that the dead still thirst and still face the rising sky. Unit 6 kept the ear.
  This unit keeps the axis and the meal. East is not decoration. It is the Rog-axis of unit 1: the same
  sky that names the invisible master is the direction the body is aimed. Water and couscous at the feet
  continue the millet-and-water economy of libation. The dead have changed residence (outside the village)
  without leaving the household''s food-world. The roof of the case becoming a tumulus is the house itself
  given to the new dwelling. A person is not extracted from architecture and dropped in a hole. The house-roof
  goes with them, then earth or shells make a mound. Bow and arrows at the stake say the dead still have
  a day outside the grave-goods museum: tools of a life are parked beside, not thrown away as trash. Colonial
  observers linger on drink after the burial. The usable core is drier: face east, leave water, give the
  roof. Existentially, the teaching is against the sealed, directionless, unfed modern grave as the image
  of what a person was. You may not control a cemetery. You can orient one act of care toward rising light
  and leave one ordinary need (water, a word, a tool) with someone who cannot fetch it.'
