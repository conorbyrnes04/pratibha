unit_label: Speak to the Dead at the Ear
title: Speak to the Dead at the Ear
unit_type: teaching_passage
commentary: 'The claim is that the newly dead still hear. Funeral practice is not disposal. It is the
  last conversation in the old vehicle, while unit 5 watches for the soul in the sky. Lasnet''s detail
  — lui parler à l''oreille — is the most intimate practice in the PD dossier. You do not announce grief
  only to the living. You put your mouth to the ear of the washed body and speak as to someone who is
  still a someone. Washing, oiling, wrapping are not hygiene theater. They are honor paid to a body that
  has hosted a nia (in Delafosse''s Manding term) and may still be listening at the threshold. Eastward
  orientation of the grave aligns the body with rising light, the same sky-axis as Roog. Water and couscous
  at the feet continue the food-logic of libation: the dead still belong to the economy of thirst and
  grain. The village boundary (en dehors du village) marks a change of residence, not an expulsion from
  relation. This unit is how Senegalese animism handles the hardest philosophical test: is the other still
  there when the breath has stopped? The practice answers yes, long enough to speak, and then yes in another
  mode (bird, ancestor, pangool). Colonial observers linger on alcohol and gunshots in the surrounding
  paragraphs. The usable core is quieter: wash, oil, speak into the ear, face the body east, leave water.
  Existentially, the teaching is against the modern habit of treating the corpse as a problem for logistics.
  If you will one day be spoken to in the ear, you are not only a medical event. And if you will one day
  have to speak into an ear, the work of love is verbal presence at a threshold you cannot control.'
