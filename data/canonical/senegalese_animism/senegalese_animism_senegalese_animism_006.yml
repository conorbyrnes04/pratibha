translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (Paris: Challamel, 1900) and L.-J.-B. Bérenger-Féraud, *Les peuplades de la Sénégambie*
  (Paris: Leroux, 1879), both public domain. Gravrand is not used (not PD). Boilat 1853 is named as preferred
  local-author witness but the available Google scan was unusable in this pass.'
pratibha_layers:
- kind: original
  label: Original
  body: Aussitôt après la mort le corps est soigneusement lavé, couvert d'huile ou de beurre et enveloppé
    de pagnes, les femmes poussent des cris et des gémissements; deux ou trois anciens de la famille prononcent
    des discours, puis tous vont successivement faire leurs adieux au décédé et lui parler à l'oreille.
    L'enterrement a lieu le jour même du décès, la fosse est creusée en dehors du village et orientée
    vers l'est. Aux pieds du mort on place quelquefois sa pipe, son tabac, de l'eau et un peu de couscous.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Practice sequence: wash and oil the body;
    farewell speeches; speak into the ear of the dead; same-day burial facing east; water and couscous
    at the feet.'
- kind: translation
  label: Pratibha Translation
  body: Immediately after death the body is carefully washed, covered with oil or butter, and wrapped
    in cloths. Two or three elders of the family deliver speeches, then all go in turn to bid farewell
    to the deceased and to speak into his ear. Burial is the same day, the grave dug outside the village
    and oriented toward the east. At the feet of the dead one sometimes places a pipe, tobacco, water,
    and a little couscous.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the newly dead still hear. Funeral practice is not disposal. It is the last
    conversation in the old vehicle, while unit 5 watches for the soul in the sky. Lasnet''s detail —
    lui parler à l''oreille — is the most intimate practice in the PD dossier. You do not announce grief
    only to the living. You put your mouth to the ear of the washed body and speak as to someone who is
    still a someone. Washing, oiling, wrapping are not hygiene theater. They are honor paid to a body
    that has hosted a nia (in Delafosse''s Manding term) and may still be listening at the threshold.
    Eastward orientation of the grave aligns the body with rising light, the same sky-axis as Roog. Water
    and couscous at the feet continue the food-logic of libation: the dead still belong to the economy
    of thirst and grain. The village boundary (en dehors du village) marks a change of residence, not
    an expulsion from relation. This unit is how Senegalese animism handles the hardest philosophical
