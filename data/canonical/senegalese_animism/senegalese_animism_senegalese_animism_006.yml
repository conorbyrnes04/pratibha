    at a threshold you cannot control.'
- kind: key_terms
  label: Key Terms
  items:
  - term: parler à l'oreille
    definition: 'to speak into the ear of the deceased -> the dead as still addressable in the washed
      body -> "saying goodbye" in a purely sentimental sense misses the metaphysics: they hear'
  - term: orientée vers l'est
    definition: grave oriented toward the east -> alignment with rising sky-light, the Rog-axis -> "facing
      east" as mere custom without the sky-God of unit 1 is incomplete
  - term: anciens de la famille
    definition: family elders who speak first -> speech at death is ordered, not only raw lament -> priesthood
      here is kinship seniority
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jewish washing of the dead (taharah) and the refusal to leave a body unattended
    resonance: Both refuse to treat the body as trash, and both organize speech and care around the dead
      as still a someone.
    divergence: Jewish practice is monotheistic without local tree-spirits; Serer care sits inside an
      animist world where the soul may already be a bird.
  - citation: Egyptian Opening of the Mouth (structural)
    resonance: Both treat the dead body as a site where speech and sensory function must be honored.
    divergence: Egyptian rite is temple-priestly and afterlife-book based; Serer rite is family-elders
      at the house and grave the same day.
- kind: practice
  label: Practice (Abhyasa)
  body: You do not need a death today to train this. Sit with someone living. For one minute, speak as
    if the ear is holy — slow, particular, nothing performative. Then, alone, say one sentence you would
    want spoken into your ear at the threshold. Keep it true.
