unit_label: First-Fruits Are Always Offered
title: First-Fruits Are Always Offered
unit_type: teaching_passage
commentary: 'The claim is that increase is answered before it is stored. Lasnet''s adverb is the teaching:
  toujours. First-fruits are not a festival you throw when the year was kind. They are a law of relation.
  Before the house eats as owner, the dwellers of tree and stone eat as hosts. The contested move is to
  refuse the modern sequence — harvest, store, feel grateful, maybe donate. Here the first taste is already
  spoken for. Millet-water and milk at the root are the daily grammar; first-fruits are that grammar applied
  to the year''s yield. Tiurakh, in Bérenger, is the named power of abundant harvests and herds; this
  sentence is how a house stays in his debt without pretending the field was empty of persons. Colonial
  pages nearby will talk of superstition and wasted grain. The philosophy is the opposite of waste. It
  is the admission that yield has a source that is not the hoe. Existentially, the teaching judges any
  life that treats surplus as proof of private merit. If the first of what arrived is not returned to
  the place that grew it, the house has already begun to live as if the land were dead stuff. You do not
  need a millet harvest to take the claim. Whatever increased around you this season — money, food, time,
  a child''s health — has a first taste that is not yours to keep as evidence that you are the source.'
