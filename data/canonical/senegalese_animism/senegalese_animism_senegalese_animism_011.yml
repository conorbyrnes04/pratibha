- kind: key_terms
  label: Key Terms
  items:
  - term: prémices
    definition: 'first-fruits, always offered -> economic theology: the first taste belongs to the dwellers
      of the land -> "tithe" is too fiscal and too addressed to a high God; this goes to the mammam of
      tree and stone'
  - term: toujours
    definition: always -> the rite is structural, not occasional -> a harvest festival you skip in a thin
      year would already have broken the bond
  - term: Tiurakh
    definition: the named power of increase in Bérenger -> what first-fruits keep favorable to the house
      -> not a market god of accumulation
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Deuteronomy 26:1–11 (basket of first-fruits)
    resonance: Both require the first of the soil's yield to be carried and declared before the eater
      stores it as property.
    divergence: Israel's basket is spoken to YHWH with a land-history; Serer first-fruits are poured or
      left for the local spirits and leave Roog unaddressed.
  - citation: Bhagavad Gītā 3.13 (they eat leftover after the offering)
    resonance: Both treat eating before offering as a kind of theft.
    divergence: The Gītā's leftover is from a cosmic yajña; Lasnet's always is household-agricultural
      at a particular tree.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you eat today's first real meal, set aside a small first portion — a bite of bread, a sip
    of water. Take it outside to one actual tree, stone, or patch of ground you did not make. Leave it.
    Then eat. Do not bargain.
