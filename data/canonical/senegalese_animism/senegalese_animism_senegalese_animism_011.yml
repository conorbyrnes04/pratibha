pratibha_layers:
- kind: original
  label: Original
  body: Pour se les rendre favorables on fait au pied des arbres ou sur des pierres consacrées des libations
    de lait ou d'eau coupée de farine de mil et parfois des sacrifices d'animaux, les prémices de la récolte
    leur sont toujours offertes.
- kind: iast
  label: Romanization
  body: 'French ethnographic report of Serer oral teaching. Key term: prémices — first-fruits of the harvest,
    always offered to the mammam who dwell in tree and stone.'
- kind: translation
  label: Pratibha Translation
  body: To render the spirits favorable, one pours libations of milk or millet-water at the foot of the
    trees or upon consecrated stones. Sometimes one also offers animals. The first-fruits of the harvest
    are always offered to them.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that increase is answered before it is stored. Lasnet''s adverb is the teaching:
