  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Enchiridion 1–2
    resonance: fear tracks what we treat as ours to gain or lose; freedom comes by relocating concern
      away from externals. The Heart Sūtra radicalizes this by voiding the internal goal too.
    divergence: Epictetus keeps a firm agent (the *prohairesis*) that chooses rightly; the sūtra dissolves
      the very agent whose choices Stoicism fortifies.
    passage_id: ''
  - citation: Meister Eckhart, on *Abgeschiedenheit* (detachment)
    resonance: the soul empty of "this and that," even empty of a wanted God, becomes fearless and free—structurally
      the *acittāvaraṇa* move of an uncovered mind.
    divergence: Eckhart's emptied ground opens onto God's birth within; the sūtra's uncovering opens onto
      no ground at all, nirvāṇa as cessation of grasping rather than union.
    passage_id: ''
  - citation: Tao Te Ching 48 ("do less and less until nothing is done")
    resonance: attainment by subtraction, freedom through the loss of grasping aims.
    divergence: the Daoist telos is spontaneous accord with the Way (*ziran*); the sūtra's telos is the
      extinction of the distortions that project any "way" to arrive along.
    passage_id: tao_te_ching.ttc_md_048
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit and name, once, the thing you are quietly trying to attain in your practice—calm, insight,
    a state, an identity as "one who practices." Then set it down with the sentence: "there is nothing
    to attain." Notice whether a small fear or restlessness appears when the goal is removed; let it be
    there, uncovered, and keep sitting without reinstalling the goal.'
