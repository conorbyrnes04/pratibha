  layer_provenance: transliterated_from_iast
- kind: iast
  label: IAST
  body: na jñānaṃ na prāptir nāprāptiḥ. tasmāc chāriputra aprāptitvād bodhisattvasya prajñāpāramitām āśritya
    viharaty acittāvaraṇaḥ. cittāvaraṇa-nāstitvād atrasto viparyāsātikrānto niṣṭhā-nirvāṇaḥ.
- kind: translation
  label: Pratibha Translation
  body: There is no knowing, no attaining, and no failing-to-attain. Precisely because there is nothing
    to be attained [aprāptitva], the bodhisattva leans on the perfection of wisdom and lives with a mind
    that has no covering over it [acittāvaraṇa]. Because there is no covering, there is nothing to be
    afraid of; having stepped clear of every inversion of seeing [viparyāsa], he comes to nirvāṇa complete.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra derives fearlessness from a subtraction. Ordinary spiritual striving runs on a gap—between
    where I am and the attainment I lack—and that gap is exactly what fear guards. Here Avalokiteśvara
    removes the goal-object itself: "no attainment, and no non-attainment," so the ledger of spiritual
    gain and loss is voided rather than balanced. The pivotal term is *āvaraṇa*, a covering or veil laid
    over the mind; fear is presented not as an emotion to be conquered but as a symptom of that veil,
    which is woven from the belief in something to get and someone to get it. When the belief in attainment
    drops, the covering has nothing to hang on, and *atrasta*—untrembling—is the natural residue, not
    a heroic achievement. This is why the passage matters for retreat: the deepest obstacle late in practice
    is often the subtle ambition to "get somewhere," which quietly reinstalls the anxious self it was
    meant to dissolve. Nirvāṇa here is *niṣṭhā*, "consummate," not a place entered but the exhaustion
    of the very grasping that made distance seem real. The bodhisattva''s calm is thus structural: no
    goal, no gap, no guardian fear.


    Key Terms:


    **prāpti / aprāpti (प्राप्ति / अप्राप्ति)** — Etymology: from *pra-√āp*, "to reach, obtain." The sūtra
    negates both attainment and its negation to forestall a clever mind that would make "non-attainment"
    the new prize. Standard "attainment" hides how the goal-structure itself sustains bondage.

    **āvaraṇa (आवरण)** — Etymology: from *ā-√vṛ*, "to cover, enclose." The mind''s covering is the film
    of grasping and distortion; wisdom does not add insight so much as remove the veil. "Obstruction"
    undertranslates the image of something draped over awareness.

    **viparyāsa (विपर्यास)** — Etymology: "turning-about, inversion." The four classic inversions take
    the impermanent as permanent, the painful as pleasant, the impure as pure, the selfless as self. Transcending
    *viparyāsa* is seeing rightly, not seeing something new.

    **atrasta (अत्रस्त)** — Etymology: *a-* (not) + *trasta* (trembling, from *√tras*, to tremble). Fearlessness
    as the absence of trembling once the grasped self is unfound—a negative, bodily word, not a triumphant
    one.'
