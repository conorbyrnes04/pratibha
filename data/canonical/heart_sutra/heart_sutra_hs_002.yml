sanskrit_devanagari: न ज्ञानं न प्राप्तिर् नाप्राप्तिः. तस्माच् छारिपुत्र अप्राप्तित्वाद् बोधिसत्त्वस्य
  प्रज्ञापारमिताम् आश्रित्य विहरत्य् अचित्तावरणः. चित्तावरण-नास्तित्वाद् अत्रस्तो विपर्यासातिक्रान्तो
  निष्ठा-निर्वाणः.
sanskrit_iast: na jñānaṃ na prāptir nāprāptiḥ. tasmāc chāriputra aprāptitvād bodhisattvasya prajñāpāramitām
  āśritya viharaty acittāvaraṇaḥ. cittāvaraṇa-nāstitvād atrasto viparyāsātikrānto niṣṭhā-nirvāṇaḥ.
translation_literal: There is no knowledge, no attainment, no non-attainment. Therefore, Śāriputra, the
  bodhisattva, dwelling in the perfection of wisdom and resting upon non-attainment, abides without obstruction
  of mind. Because there is no obstruction of mind, there is no fear. Having transcended all inversion
  and distortion, he reaches the final peace of nirvana.
commentary: 'This passage stands at the heart of the Heart Sūtra''s logic: emptiness dissolves the very
  ground of fear. The negation ''na jñānaṃ na prāptir'' (no knowledge, no attainment) does not deny that
  wisdom functions or that liberation occurs—it denies the reified, grasped-at object that the ego-mind
  constructs around them. A bodhisattva who rests on *aprāptitvād* (non-attainment) does not cling to
  enlightenment as a possession to be won or a state to be secured. This non-clinging is itself the perfection
  of wisdom (prajñāpāramitā). The phrase *acittāvaraṇaḥ* (without obstruction of mind) is key: when no
  mental construct obscures reality—when there is no ''me'' defending against loss, no ''enlightenment''
  to protect—fear cannot arise. Fear lives in the gap between what we have and what we might lose, between
  who we think we are and who we fear becoming. When that gap collapses into emptiness, *atrasto* (without
  fear) becomes not an achievement but a simple fact. The *viparyāsātikrānto* (transcendence of inversion)
  refers to the four fundamental inversions of perception—seeing the impermanent as permanent, suffering
  as pleasure, the non-self as self, the impure as pure. Wisdom sees through these reversals not by effort
  but by ceasing to construct them. The final *niṣṭhā-nirvāṇaḥ* (ultimate peace, final extinguishing)
  is not a distant goal but the natural rest that remains when all grasping ceases.


  Key Terms


  **aprāptitvād** — non-attainment; the principle of not grasping at or reifying any goal, state, or possession,
  even enlightenment itself

  **acittāvaraṇaḥ** — without obstruction of mind; free from mental constructs, veils, or the ego''s defensive
  barriers

  **viparyāsa** — inversion or distortion; the four fundamental perceptual inversions (seeing impermanence
  as permanent, suffering as pleasure, non-self as self, impurity as purity)'
insight: The sūtra derives fearlessness from a subtraction.
practice: 'The next time you notice yourself bracing against loss—tightening around a possession, a relationship,
  a belief about who you are—pause and whisper aloud: ''no attainment, no obstruction.'' Let your shoulders
  drop on the word ''obstruction,'' and feel the space that opens when you stop defending the gap between
  what you have and what you fear losing.'
