sanskrit_devanagari: रूपं शून्यता शून्यतैव रूपं, रूपान् न पृथक् शून्यता शून्यताया न पृथग् रूपं, यद् रूपं
  सा शून्यता या शून्यता तद् रूपं; एवम् एव वेदना-संज्ञा-संस्कार-विज्ञानम्.
sanskrit_iast: rūpaṃ śūnyatā śūnyataiva rūpaṃ, rūpān na pṛthak śūnyatā śūnyatāyā na pṛthag rūpaṃ, yad
  rūpaṃ sā śūnyatā yā śūnyatā tad rūpaṃ; evam eva vedanā-saṃjñā-saṃskāra-vijñānam.
translation_literal: 'Form is emptiness; emptiness itself is form. Emptiness is not separate from form;
  form is not separate from emptiness. Whatever is form, that is emptiness; whatever is emptiness, that
  is form. In exactly this way: sensation, perception, mental formations, and consciousness.'
commentary: 'This passage stands at the heart of the Prajñāpāramitā teaching because it dissolves the
  most fundamental dualism—between appearance and absence, between what seems solid and what is ultimately
  void. The Sanskrit construction rūpaṃ śūnyatā śūnyataiva rūpaṃ is not poetic metaphor; it is a logical
  collapse. Form (rūpaṃ)—the visible, tangible, apparently substantial—is not *other than* emptiness (śūnyatā).
  They are not two things in relationship; the negation na pṛthak (not separate) cuts both directions.
  This is not saying form disappears into nothing, nor that emptiness is a hidden essence behind form.
  Rather, the very nature of form—when examined without conceptual overlay—reveals itself as empty of
  independent, intrinsic existence (svabhāva-śūnyatā). The passage then extends this recognition to all
  five skandhas (the aggregates that constitute experience): sensation, perception, mental formations,
  and consciousness. Each one, when investigated directly, shows the same structure—apparent solidity
  that dissolves under scrutiny into interdependence, impermanence, and absence of a permanent self. The
  repetition (rūpān na pṛthak śūnyatā / śūnyatāyā na pṛthag rūpaṃ) is not redundancy; it is the teaching
  working both directions simultaneously, preventing the mind from settling into either eternalism (form
  is real) or nihilism (emptiness is real). The gate gate mantra that follows this passage in the full
  sūtra (gate gate pāragate pārasaṃgate bodhi svāhā) is the practical response: go, go beyond, go completely
  beyond—this non-dual seeing is the crossing.


  Key Terms


  **śūnyatā** — Emptiness; the absence of intrinsic, independent, unchanging nature (svabhāva) in all
  phenomena; not nothingness but the interdependent, relational nature of all things.

  **rūpaṃ** — Form; the visible, material aspect of experience; the first of the five skandhas (aggregates);
  here used to represent all apparent, tangible phenomena.

  **skandha** — Aggregate or heap; the five constituents of conditioned existence—form, sensation, perception,
  mental formations, and consciousness—through which all experience is constructed.'
insight: 'The claim is an identity, not a ranking: emptiness is not a truer thing hidden behind the false
  screen of form, and form is not a consolation prize beneath a higher void.'
practice: 'Pick up or touch something ordinary right now—a cup, your phone, fabric. Hold it while breathing
  normally, and with each exhale, mentally note one way it depends on something else (the tree, the factory,
  your hand, the light). Continue until you cannot isolate what is "just this object" from what is not—then
  notice: the object hasn''t changed, only your sense of its separateness has dissolved.'
