- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nāgārjuna, MMK 24.18 (dependent arising = emptiness)
    resonance: Both texts identify emptiness with the very things that appear rather than with a realm behind them; Nāgārjuna
      supplies the argument (dependent arising) for which the sūtra gives the meditative slogan.
    divergence: the sūtra is liturgical and performative (spoken to Śāriputra as instruction), whereas Nāgārjuna is dialectical,
      dismantling essence through explicit reductio.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_18
  - citation: Heraclitus, DK B12 (river)
    resonance: the river is real and steppable yet has no fixed substance to step into twice—an early Western intuition that
      identity is process, resonant with form-as-emptiness.
    divergence: Heraclitus keeps a governing Logos ordering flux; the Heart Sūtra removes any such underlying ordering principle
      as itself empty.
    passage_id: ''
  - citation: Chāndogya Upaniṣad 6.8 (tat tvam asi)
    resonance: both climax in a terse identity-formula meant to collapse the seeker's distance from reality.
    divergence: the Upaniṣad affirms a fullest Self (ātman/Brahman) as what you are; the sūtra denies exactly such a self-substance,
      making the two formulas mirror-opposite in metaphysics though twinned in function.
    passage_id: ''
