sanskrit_devanagari: 'prajñāpāramitā mahā-mantraḥ ... sarva-duḥkha-praśamanaḥ satyam amithyatvāt. tadyathā:
  **gate gate pāragate pārasaṃgate bodhi svāhā.**


  Devanagari (mantra, source-verified): गते गते पारगते पारसंगते बोधि स्वाहा


  *(Sanskrit, IAST, source-verified from GRETIL; mantra Devanagari cross-checked.)*'
sanskrit_iast: 'gate (gone) gate (gone) pāragate (gone beyond) pārasaṃgate (gone wholly beyond) bodhi
  (awakening) svāhā (so be it / hail). Frame: *mahā-mantraḥ* (great mantra), *sarva-duḥkha-praśamanaḥ*
  (stiller of all suffering), *satyam amithyatvāt* (true because not false).'
translation_literal: 'Gone. Gone. Gone beyond. Gone wholly beyond. Awakening! So be it.


  This is the great mantra, the stiller of all suffering, true because it is not false.'
commentary: 'This closing mantra of the Heart Sūtra is not decoration but the distilled engine of the
  teaching. Each repetition of ''gate'' (gone) marks a threshold crossed: the first ''gone'' is the abandonment
  of clinging to form; the second, the release of the subtle sense that a self observes that release.
  ''Gone beyond'' (pāragate) names the crossing of the shore—the far bank where subject and object, knower
  and known, no longer divide experience. ''Gone wholly beyond'' (pārasaṃgate) completes the negation:
  there is no residue, no final standpoint from which one might say ''I have arrived.'' Bodhi—awakening—is
  not a destination reached but the nature of the going itself, the movement that leaves no trace.


  The frame ''great mantra'' signals that this is not mere words but a transmission of power (śakti).
  It ''stills all suffering'' not by suppressing pain but by dissolving the structure that makes suffering
  stick: the belief in a separate self that can be harmed. The final phrase—''true because not false''—is
  crucial. This mantra does not assert a new doctrine or replace one belief with another. It is true precisely
  because it negates the false premise underlying all dukkha: the assumption of inherent, independent
  existence. Emptiness (śūnyatā) is not a void or nihilism; it is the absence of the false boundary that
  creates the illusion of a solid, separate ''I'' facing a solid, separate world. When that boundary dissolves
  in the going-beyond, suffering has no ground to stand on.


  Key Terms


  **śūnyatā** — Emptiness; the absence of inherent, independent, unchanging essence in all phenomena—the
  ground of liberation.

  **pāragate** — Gone beyond; crossed over to the far shore; transcended the dualistic divide between
  subject and object.

  **bodhi** — Awakening; the direct realization of emptiness and the cessation of ignorance; not a state
  achieved but the nature of mind when delusion falls away.'
insight: After pages of relentless negation—no form, no attainment, no path—the sūtra ends not in silence
  but in a chant, and the shift is the teaching.
practice: 'Walk forward without destination—each step a ''gate,'' each threshold crossed dissolving the
  one who crossed it. Let your feet speak the mantra''s rhythm: *gone* (left foot), *gone* (right foot),
  *gone beyond* (left), *gone wholly beyond* (right), until the walker and the walking are indistinguishable,
  and only the awakening of movement remains.'
