- kind: iast
  label: IAST
  body: 'gate (gone) gate (gone) pāragate (gone beyond) pārasaṃgate (gone wholly beyond) bodhi (awakening)
    svāhā (so be it / hail). Frame: *mahā-mantraḥ* (great mantra), *sarva-duḥkha-praśamanaḥ* (stiller
