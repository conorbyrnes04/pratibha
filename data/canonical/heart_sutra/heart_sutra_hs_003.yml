- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Enneads VI.9 (the flight of the alone to the Alone)
    resonance: both end philosophy in a movement of ascent/crossing that exceeds discursive reason and
      must finally be undergone, not argued.
    divergence: Plotinus arrives at the plenitude of the One; the sūtra arrives at emptiness and awakening
      with no One to arrive at—crossing into no-thing rather than into fullness.
    passage_id: ''
  - citation: Tao Te Ching 1 ("the way that can be spoken is not the constant Way")
    resonance: language is honored yet marked as a threshold to be passed; the mantra is speech that dismantles
      reliance on speech.
    divergence: the Daoist gesture rests in wordless naturalness; the Buddhist mantra remains a spoken
      ritual act performed within a path of awakening.
    passage_id: tao_te_ching.ttc_md_001
  - citation: Rūmī, Mathnawī (the reed torn from the reed-bed, longing for return)
    resonance: wisdom voiced as chant/song that carries the practitioner across a separation words alone
      cannot bridge.
    divergence: Rūmī's crossing is reunion of lover and Beloved; the sūtra's crossing dissolves the lover-Beloved
      duality itself as empty.
    passage_id: ''
