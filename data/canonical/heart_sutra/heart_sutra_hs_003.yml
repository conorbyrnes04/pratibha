- kind: practice
  label: Practice (Abhyasa)
  body: Recite *gate gate pāragate pārasaṃgate bodhi svāhā* slowly nine times, letting the breath, not
    the meaning, carry it. On each "gate," release one thing you are holding—a plan, a grievance, a self-image—so
    the chant becomes an actual letting-go rather than a description of one. End on *svāhā* and sit for
    one silent minute without reaching for anything, including the mantra.
