- kind: translation
  label: Pratibha Translation
  body: 'So the perfection of wisdom [prajñāpāramitā] is to be known as the great mantra—the utterance
    that quiets all suffering, and is true for the plain reason that it does not lie. This is the mantra
    it speaks: *gate gate pāragate pārasaṃgate bodhi svāhā*—gone, gone, gone over, gone entirely over
    to the far shore; awakening; so be it.'
- kind: commentary
  label: Pratibha Commentary
  body: 'After pages of relentless negation—no form, no attainment, no path—the sūtra ends not in silence
    but in a chant, and the shift is the teaching. Wisdom that has emptied every object now condenses
    into a verb of motion repeated to exhaustion: *gate, gate*—gone, gone. The counterintuitive claim
    embedded in *satyam amithyatvāt* ("true because not false") is that this mantra''s truth is not correspondence
    to a fact but the performance of release; it works the way a threshold works, by being crossed. The
    grammar matters: *gate* is feminine vocative/locative, addressed to wisdom herself or spoken from
    the far shore looking back, so the line enacts the crossing it names rather than describing it from
    safety. *Pārasaṃgata*—"gone completely beyond"—closes the door on any residue of a beyond still held
    as a place, and then *bodhi* lands: awakening is not a further destination but the recognition that
    the going and the gone were never two. For a retreatant the pastoral point is decisive: analysis has
    a floor, and past it wisdom becomes something you say with the body and breath, a rhythm that carries
    what argument cannot. *Svāhā* seals it—the ritual "amen" that hands the whole movement over and stops
    the mind from re-grasping even the mantra.


    Key Terms:


    **mantra (मन्त्र)** — Etymology: often glossed *man* (mind, from *√man*, to think) + *-tra* (instrument):
    "that which protects/carries the mind." Here the whole perfection of wisdom is compressed into a *mahā-mantra*,
    marking the passage from discursive insight to performative utterance.

    **pāra / pāragata (पार / पारगत)** — Etymology: *pāra*, "the far bank, the further shore"; *pāra-gata*,
    "gone to the far shore." The classic image of liberation as crossing a river; *pārasaṃgata* intensifies
    it to "gone wholly across," refusing any half-measure or lingering.

    **bodhi (बोधि)** — Etymology: from *√budh*, "to wake, to know." Not a doctrine but an awakening; placed
    after all the "gone"s, it reveals that the crossing was awakening all along, not its prerequisite.

    **svāhā (स्वाहा)** — Etymology: ancient Vedic ritual exclamation of offering into fire, "hail! / so
    be it!" It consecrates and releases the mantra, ending grasping even at wisdom by giving the utterance
    away.'
