unit_label: The Bridge to the Deathless
title: The Bridge to the Deathless
unit_type: verse
sanskrit_devanagari: 'यस्मिन् द्यौः पृथिवी चान्तरिक्षम् ओतं मनः सह प्राणैश् च सर्वैः ।

  तम् एवैकं जानथ आत्मानम् अन्या वाचो विमुञ्चथ अमृतस्यैष सेतुः ॥ २.२.५ ॥'
sanskrit_iast: 'yasmin dyauḥ pṛthivī cāntarikṣam otaṃ manaḥ saha prāṇaiś ca sarvaiḥ |

  tam evaikaṃ jānatha ātmānam anyā vāco vimuñcatha amṛtasyaiṣa setuḥ || 2.2.5 ||'
translation_literal: 'Know that one Self alone in whom heaven, earth, and the mid-region are woven, together
  with mind and all the vital breaths. Release all other speech: this is the bridge to the deathless (amṛta).'
commentary: 'The verse gathers the whole experienced cosmos—heaven, earth, atmosphere, mind, and the prāṇas,
  the life-forces—into a single image of being “woven” (otam) in the Self. Brahman is not one object within
  the universe, nor merely an inward psychological core; it is the sustaining reality in which both world
  and knower appear. “Know that one Self alone” does not demand denial of phenomena, but a shift from
  taking the many as independently ultimate to recognizing their ground. “Release all other speech” points
  to the limit of conceptual and ritual description. Speech can indicate Brahman, but cannot contain it
  as an object. The “bridge” (setu) is this discriminating recognition: it carries one across mortality,
  understood as bondage to the perishable and divided. The preceding bow-and-arrow teaching gives the
  discipline of concentration; this verse states its realization—everything is held in the one Self.


  Key Terms


  **otam** — woven, interlaced; pervaded and sustained

  **ātman** — the Self; the ultimate ground of experience

  **prāṇa** — vital breath or life-force

  **amṛta** — the deathless, immortality


  Cross-Tradition Resonances


  **Plotinus presents all things as dependent upon the One, which exceeds the multiplicity of beings and
  discursive thought.:**  Divergence: The Upaniṣad identifies the ultimate with the knowable Self (ātman),
  whereas Plotinus maintains a more sharply articulated procession from the One through Intellect and
  Soul.

  **Writers such as Pseudo-Dionysius emphasize that God surpasses every name and concept, resembling the
  injunction to release “other speech.”:**  Divergence: Apophatic Christianity generally preserves a creator–creature
  distinction, while this verse directs realization of the one Self in which cosmos and life are woven.

  **The Dao De Jing speaks of the Dao as the hidden source from which the many things arise and to which
  names do not finally reach.:**  Divergence: Daoist language typically avoids identifying the Dao as
  an enduring Self; the Upaniṣad explicitly commands knowledge of ātman.'
practice: 'Sit quietly and attend first to breath, bodily sensation, thought, and the surrounding space.
  For each, note inwardly: “known within the Self.” Then rest for several minutes without adding descriptions,
  releasing the impulse to name what is present.'
