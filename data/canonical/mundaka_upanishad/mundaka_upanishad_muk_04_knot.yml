unit_label: The Knot of the Heart Is Cut
title: The Knot of the Heart Is Cut
unit_type: sutra
sanskrit_devanagari: भिद्यते हृदयग्रन्थिश् छिद्यन्ते सर्वसंशयाः / क्षीयन्ते चास्य कर्माणि तस्मिन् दृष्टे
  परावरे
sanskrit_iast: bhidyate hṛdayagranthiś chidyante sarvasaṃśayāḥ / kṣīyante cāsya karmāṇi tasmin dṛṣṭe parāvare
translation_literal: The knot of the heart is cut asunder, all doubts are severed, and one's karmas are
  exhausted when That is seen which is both the Supreme and the immediate.
commentary: 'The passage stages liberation as a triple severance: the heart''s knot (hṛdaya-granthi) splits
  open, doubts dissolve, and karmic momentum exhausts itself. But the structure is crucial—these three
  are not separate achievements stacked sequentially. They are one event seen from three angles, all contingent
  on a single vision: dṛṣṭe, ''when beheld.'' What is beheld? Paraavare—the high and low simultaneously,
  the transcendent and immanent as a single non-dual fact. The knot itself is the confusion that treats
  these as separate, that binds consciousness to the fiction of a divided cosmos and a divided self within
  it. When that confusion is directly seen through—not intellectually resolved but perceptually undone—the
  knot cannot hold. Doubt, which lives in the space between alternatives, finds no ground. And karma,
  which requires a separate doer harvesting separate fruits across time, loses its coherence. The passage
  does not promise peace or bliss as reward; it describes the automatic collapse of the machinery that
  produced bondage. The image of the knot is anatomical and intimate: it sits in the heart, not in some
  remote metaphysical realm. Its cutting is not gradual refinement but rupture.


  Key Terms


  **hṛdaya-granthi** — The knot of the heart; the fundamental confusion binding consciousness to the illusion
  of duality and separation

  **paraavare** — The high and low simultaneously; the transcendent and immanent unified as non-dual reality

  **dṛṣṭe** — When beheld or directly perceived; the singular act of vision that collapses all three modes
  of bondage at once


  Cross-Tradition Resonances


  **Brahma Sutras 1.1.4 (Tat tvam asi doctrine):** Both teach that direct realization of non-dual identity
  dissolves the knot of ignorance and ends the cycle of karma Divergence: The Brahma Sutras emphasize
  the identity of Ātman and Brahman as the content of realization, while Mundaka stresses the simultaneity
  of high-and-low as the perceptual rupture itself

  **Katha Upanishad 2.3.1 (the razor''s edge metaphor):** Both depict liberation as a sharp, sudden severance
  rather than gradual accumulation of merit or knowledge Divergence: Katha frames the difficulty of the
  path itself (hard to traverse), while Mundaka emphasizes the automatic collapse once the vision occurs

  **Bhagavad Gita 4.37 (jñāna-agni and karma-burning):** Both describe karma as consumed or exhausted
  through direct knowledge, not through action or ascetic practice Divergence: The Gita locates the burning
  in the fire of knowledge acquired through discipline, while Mundaka locates it in the perceptual undoing
  of the doer-subject itself'
insight: 'The passage stages liberation as a triple severance: the heart''s knot (hṛdaya-granthi) splits
  open, doubts dissolve, and karmic momentum exhausts itself.'
practice: 'When you notice yourself caught between two positions—uncertain which choice is right, which
  interpretation true, which person to trust—pause and instead of deliberating, ask: where is the knot?
  Locate the exact sensation of the bind, the tightness in chest or throat or mind. Do not try to untie
  it. Breathe directly into that place as if the breath itself could see both sides of the conflict at
  once, could hold high and low, self and other, without choosing. Let the knot be seen, not solved.'
