title: 'The Two Birds: Knowledge and Ignorance Entwined'
unit_type: verse
sanskrit_devanagari: 'द्व सुपर्णा सयुजा सखाया समानम् वृक्षम् परिषस्वजाते ।

  तयोर् अन्यः पिप्पलम् स्वादु अत्ति अनाश्नन्न् अन्यो अभिचाकशीति ॥ ३.१.१ ॥'
sanskrit_iast: 'dva suparṇā sayujā sakhāyā samānam vṛkṣam pariṣasvajāte |

  tayor anyaḥ pippalam svādu atti anāśnann anyo abhicākaśīti || 3.1.1 ||'
translation_literal: Two birds, companions joined together, embrace the same tree. Of these, one eats
  the sweet fruit; the other, not eating, looks on.
commentary: 'This verse presents the foundational metaphor of Advaita Vedānta: the individual self (jīvātman)
  and the universal Self (Brahman) as two birds on the tree of saṃsāra. The eating bird represents the
  embodied soul bound by karma and desire, tasting the fruits of action. The non-eating bird symbolizes
  the witness-consciousness (sākṣī), untouched by experience yet omnipresent. The ''same tree'' is the
  body-mind complex or the cosmos itself. The verse encodes the paradox of non-duality: apparent duality
  within ultimate unity. Śaṅkara interprets this as the mutual presence of Brahman and jīva, yet their
  radical difference in status—one eternally free, one apparently bound. The image dissolves the boundary
  between subject and object, observer and observed, preparing the student for the recognition that the
  eating bird''s bondage is illusory, born of ignorance (avidyā). The verse is not metaphorical decoration
  but a precise teaching device: it makes visible the structure of consciousness itself.


  Key Terms


  **suparṇā** — birds (lit. ''beautiful-winged''); the two aspects of consciousness

  **vṛkṣam** — tree; the field of manifestation, body, or cosmos

  **pippalam** — fruit (of the fig tree); the results of action and experience

  **sākṣī** — witness; the non-eating bird, pure consciousness


  Cross-Tradition Resonances


  **Puruṣa (witness-consciousness) and Prakṛti (nature/matter) as eternally distinct yet appearing to
  interact; the Yoga Sūtra''s metaphor of the crystal reflecting objects without being affected.:**  Divergence:
  Sāṃkhya maintains absolute dualism; Advaita collapses the distinction into non-dual Brahman, making
  the second bird''s apparent separation a function of ignorance alone.

  **Meister Eckhart''s distinction between the Godhead (the non-acting divine ground) and God (the creative
  principle); the soul''s simultaneous union with and distinction from the divine.:**  Divergence: Christian
  theology preserves creator-creature distinction; Advaita denies even this final duality, teaching identity
  of essence.

  **Śiva as transcendent witness and Śakti as dynamic manifestation; the play (līlā) of consciousness
  appearing as subject-object duality.:**  Divergence: Śaivism celebrates the creative play as real and
  eternal; Advaita treats manifestation as apparent, grounded in māyā.'
practice: 'Sit in meditation. Observe the mind''s movements—thoughts, sensations, emotions—as if watching
  a bird eat fruit from a tree. Do not identify with the eating bird (the mind''s activity). Gradually
  recognize the unchanging awareness that witnesses all change. Rest as that witness for five to ten minutes
  daily. Over weeks, the conviction grows: ''I am not the doer; I am the eternal looker-on.'' This is
  the direct realization the verse points toward.'
