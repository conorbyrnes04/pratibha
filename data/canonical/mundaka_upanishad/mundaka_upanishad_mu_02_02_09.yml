sanskrit_devanagari: 'हिरण्मये परे कोशे विरजं ब्रह्म निष्कलम् ।

  तच् छुभ्रं ज्योतिषां ज्योतिस् तद् यद् आत्मविदो विदुः ॥ २.२.९ ॥'
sanskrit_iast: 'hiraṇmaye pare kośe virajaṃ brahma niṣkalam |

  tac chubhraṃ jyotiṣāṃ jyotis tad yad ātmavido viduḥ || 2.2.9 ||'
translation_literal: 'In the supreme golden sheath is Brahman: stainless (virajam), partless (niṣkalam). It is the pure radiance,
  the light of lights—That which knowers of the Self (ātmavid) know.'
commentary: 'The “golden sheath” need not denote a material enclosure; it names the most luminous and refined limit of manifest
  experience, often associated with the shining intellect or causal ground. Even there, Brahman is not an object contained
  within a covering. It is virajam, untouched by the coloring, attachment, and impurity that belong to changing experience;
  and niṣkalam, without parts, division, or internal composition. Hence it cannot be assembled, altered, or grasped as one
  thing among others. “Light of lights” does not primarily mean a brighter physical luminosity. It indicates that by which
  sun, mind, perception, and every act of knowing are themselves disclosed. The ātmavid does not merely acquire information
  about this reality; through discernment, the knower recognizes the witnessing ground as non-objectifiable and self-revealing.


  Key Terms


  **virajam** — stainless; free of passion, coloring, and impurity

  **niṣkalam** — partless; without divisions or constituent elements

  **jyotiṣāṃ jyotiḥ** — the light of lights; that which makes all illumination and knowing possible

  **ātmavid** — knower of the Self


  Cross-Tradition Resonances


  **It calls the Self “the light of lights” (jyotiṣām api taj jyotis), beyond darkness and the basis of knowledge.:**  Divergence:
  The Gītā frames this light within its teaching on kṣetra and kṣetrajña, whereas this Upaniṣadic verse emphasizes Brahman’s
  partlessness and purity.

  **Plotinus describes the One as the source from which intellect and all intelligibility derive, rather than as an object
  illuminated by something else.:**  Divergence: Plotinus’s metaphysical procession is not identical with the Upaniṣadic identification
  of Self-knowing and Brahman-realization.

  **The “true light” is said to enlighten every person, echoing the thought of a light underlying ordinary illumination.:**  Divergence:
  John’s light is expressed through a personal and incarnational Logos theology, unlike the impersonal, partless Brahman of
  this verse.'
practice: 'Sit quietly and notice an object, a sound, and a thought. For each, ask: “What knows this appearance?” Do not seek
  another image or sensation as an answer; rest for several breaths in the bare fact of knowing, prior to whatever is known.'
