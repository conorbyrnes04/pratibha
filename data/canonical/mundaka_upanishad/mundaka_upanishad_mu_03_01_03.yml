title: Seeing the Golden Person
unit_type: verse
sanskrit_devanagari: 'यदा पश्यः पश्यते रुक्मवर्णं ।

  कर्तारम् ईशं पुरुषं ब्रह्मयोनिम् ।

  तदा विद्वान् पुण्यपापे विधूय ।

  निरञ्जनः परमं साम्यम् उपैति ॥ ३.१.३ ॥'
sanskrit_iast: 'yadā paśyaḥ paśyate rukmavarṇaṃ |

  kartāram īśaṃ puruṣaṃ brahmayonim |

  tadā vidvān puṇyapāpe vidhūya |

  nirañjanaḥ paramaṃ sāmyam upaiti || 3.1.3 ||'
translation_literal: When the seer beholds the golden-hued one—the maker, the Lord, the Person, the source
  of Brahmā—then, the knower having shaken off merit and demerit, stainless, attains supreme sameness.
commentary: 'The verse completes the image of the two birds. The grieving eater of fruits becomes paśyaḥ,
  “the seer,” when vision turns from the changing results of action to the luminous ground of both experience
  and agency. Rukmavarṇa, “golden-hued,” is not simply a physical color: it evokes self-luminous intelligibility.
  The reality seen is named in several registers—kartṛ, maker; īśa, lord; puruṣa, indwelling or all-pervading
  person; brahmayoni, the source even of the cosmic creator. Such seeing is transformative rather than
  merely conceptual. Puṇya and pāpa, merit and demerit, are both karma: even pleasant results belong to
  the field of conditioned becoming. To “shake them off” is not moral indifference but release from identification
  with the karmic claimant. Nirañjana, unstained, marks freedom from limiting adjuncts. Paramaṃ sāmyam,
  supreme sameness, is not social or numerical equality with God; it is nondual likeness—freedom from
  the perceived division between knower and the ultimate.


  Key Terms


  **paśyaḥ** — the seer; one capable of direct vision

  **rukmavarṇam** — golden-hued, radiant like gold

  **puṇyapāpe** — merit and demerit; the two moral fruits of karma

  **paramaṃ sāmyam** — supreme sameness or likeness; nondual realization


  Cross-Tradition Resonances


  **The Gītā describes one who sees the same Self in all beings and becomes free from the binding opposites
  of action.:**  Divergence: The Gītā more explicitly integrates this vision with disciplined action and
  devotion, whereas this verse concentrates on liberating realization.

  **The Pauline phrase of being transformed into the divine image, and later accounts of contemplative
  union, parallel the movement from impurity to a God-centered likeness.:**  Divergence: Christian accounts
  generally preserve a creator-creature distinction; the Upaniṣadic “supreme sameness” presses toward
  nondual identity.

  **Buddhist liberation likewise entails release from karmically conditioned results and from the defilements
  that stain awareness.:**  Divergence: Buddhism does not affirm an eternal Lord or puruṣa as the object
  of liberating vision, and analyzes liberation without a permanent self.'
practice: 'Sit quietly for ten minutes. Notice each thought of pride, guilt, hope, or fear as a “fruit”
  of action. Without suppressing it, ask: “What is aware of this result?” Rest attention in that bare
  awareness, neither claiming merit nor resisting blame.'
