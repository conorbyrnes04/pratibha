unit_label: The Self Reveals Itself
title: The Self Reveals Itself
unit_type: verse
sanskrit_devanagari: 'नायम् आत्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन ।

  यम् एवैष वृणुते तेन लभ्यस् तस्यैष आत्मा विवृणुते तनूं स्वाम् ॥ ३.२.३ ॥'
sanskrit_iast: 'nāyam ātmā pravacanena labhyo na medhayā na bahunā śrutena |

  yam evaiṣa vṛṇute tena labhyas tasyaiṣa ātmā vivṛṇute tanūṃ svām || 3.2.3 ||'
translation_literal: This Self (ātman) is not attained by eloquent discourse, nor by intellect, nor by much hearing. It is
  attained by the one whom It chooses; to that one this Self reveals Its own form.
commentary: 'The verse overturns the assumption that spiritual reality is a possession acquired through verbal mastery, native
  cleverness, or accumulated study. Pravacana, medhā, and bahuśruta—teaching, intelligence, and extensive learning—have their
  proper place, but none can compel realization. Ātman is not an object standing apart from a knower, available to intellectual
  capture. Its “choosing” should not be reduced to arbitrary favor: it names the event in which the seeker’s self-assertive
  grasping falls away and the Self becomes self-evident. The apparent paradox is deliberate: one must hear, discern, and practice,
  yet liberation is not manufactured by these means. When the demand to own Brahman ceases, the ever-present ground of awareness
  “reveals its own body,” its intrinsic reality. Knowledge here is recognition, not acquisition.


  Key Terms


  **ātman** — the Self: the innermost reality, not an object of ordinary knowledge

  **pravacana** — discoursing, exposition, or learned teaching

  **medhā** — intellect, acuity, or mental power

  **vivṛṇute** — reveals, unveils, or makes manifest


  Cross-Tradition Resonances


  **John 6:44 says that no one can come unless drawn by the Father, expressing the primacy of grace over self-achievement.:**  Divergence:
  The Upaniṣad speaks of the Self revealing itself, whereas Christian traditions generally preserve a distinction between
  Creator and creature.

  **Zen repeatedly warns that scriptural learning and conceptual explanation do not themselves yield awakening; direct realization
  is required.:**  Divergence: Zen commonly refuses an eternal Self doctrine, while this verse speaks explicitly of ātman
  as ultimate reality.

  **Sufi accounts of jadhb, divine attraction, and dhawq, tasted knowledge, similarly deny that formal learning alone produces
  realization of God.:**  Divergence: Sufi language typically retains the relation of lover and divine Beloved, rather than
  identifying the deepest self with ultimate reality.'
practice: After reading or studying, sit silently for ten minutes. Notice every impulse to define, attain, or possess realization;
  on each exhale release that impulse, and rest as the simple awareness in which it appears.
