  body: 'From the base or root of the palate, the sushumna extendsdownwards, till it reaches the Muladhar
    and the perineum: all vessels surround it, or are supported by it. These nadis are the seeds of mystery,
    or the sources of all principles which constitute a man, and show the road to Brahma {i.e. give salvation).'
