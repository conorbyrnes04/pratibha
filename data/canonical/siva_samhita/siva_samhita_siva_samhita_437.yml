translation: 'From the base or root of the palate, the sushumna extendsdownwards, till it reaches the
  Muladhar and the perineum: all vessels surround it, or are supported by it. These nadis are the seeds
  of mystery, or the sources of all principles which constitute a man, and show the road to Brahma {i.e.
  give salvation).'
abhyasa: Sit quietly and bring gentle awareness to the midline of your body—from the crown of your head
  down through the center of your torso to the base of your spine. Without forcing or visualizing, simply
  notice the sense of a vertical axis within you. Breathe naturally and rest attention there for 5–10
  minutes. This is not activation but familiarization—meeting the sushumna as it already is.
