  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: 'The five remaining vayus, etc., perform the following functions in the body: - Eructation, opening the eyes,
  hunger and thirst, gaping or yawning, and lastly hiccup.'
abhyasa: 'Today, notice one of these five actions—a yawn, hunger, or hiccup—as it arises. Pause and observe it without judgment.
  Rather than dismissing it as mechanical, ask: what subtle movement of energy is this? This simple attention begins to dissolve
  the false boundary between ''gross'' and ''subtle'' body.'
