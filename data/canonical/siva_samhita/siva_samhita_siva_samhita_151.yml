commentary: 'This passage catalogs the subtle functions of the five secondary vital winds (vayus) beyond the primary prāṇa,
  mapping them to ordinary bodily reflexes—eructation, eye-opening, hunger, yawning, hiccup. The teaching grounds yoga''s
  metaphysical anatomy in lived experience: even involuntary, seemingly trivial actions are expressions of prāṇic intelligence.
  This democratizes the subtle body, suggesting that mastery of breath and energy is not separate from but continuous with
  the body''s own wisdom.



  Key Terms



  **vayu** — Vital wind or breath-force; in yoga anatomy, five primary and five secondary vayus govern different physiological
  and energetic functions throughout the body.



  Cross-Tradition Resonances



  **Upaniṣads (Praśna Upaniṣad 3.3–4):** Both texts describe prāṇa and its subdivisions as the animating principle behind
  bodily functions, linking breath to all life processes. Divergence: The Upaniṣads emphasize prāṇa as cosmic principle; the
  Śiva Saṃhitā focuses on its practical mapping in the body for yogic cultivation.


  **Aristotle, *De Anima* II.2:** Both traditions refuse a sharp divide between soul/spirit and body, seeing vital function
  as the intersection of both. Divergence: Aristotle grounds animation in form and matter; the Śiva Saṃhitā locates it in
  subtle energy channels and winds accessible through practice.'
