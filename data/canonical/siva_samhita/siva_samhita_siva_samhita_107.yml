translation: All these principal nadis (vessels) have their mouths downwards, and are like thin threads
  of lotus. They are all supported by the vertebral column, and represent the sun, moon and fire.
abhyasa: Sit quietly and bring awareness to your spine as the central axis of your body. Without forcing
  breath or visualization, simply notice the quality of stillness and support it provides. Reflect on
  how this vertical line might be the 'support' the passage names—a felt anchor for subtler currents you
  may or may not perceive.
