  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Were he to kill his teacher or drink wine or commit theft, or violate the bed of his preceptor,
  he is not stained by these sins also, by virtue of this mudra.
abhyasa: 'Sit quietly and contemplate the difference between *doing* an action and *being* the doer. Notice
  how guilt and shame require a sense of separate agency. Without judgment, observe: what remains when
  the sense of ''I am the actor'' temporarily loosens? This is not permission to harm, but an inquiry
  into the nature of accountability itself.'
