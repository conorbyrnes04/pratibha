  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The third chakra, called Manipur, is situated near the navel; it is of golden colour, having
  ten petals designated by the letters d, dh, n, t, th, d, dh, n, p, ph.
abhyasa: Sit quietly and bring gentle awareness to the region of your navel. Without forcing, notice any
  warmth, light, or sensation there. Silently sound or mentally hear the syllable 'ram' (the seed mantra
  traditionally associated with Manipūra in many yoga lineages) a few times, observing any shift in sensation
  or presence. Rest attention there for a few breaths, then release.
