  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Now I will tell you, how easily to attain success in Yoga, by knowing which the Yogis never
  fail in the practice of Yoga.
abhyasa: 'Before reading further in this text, sit quietly and ask yourself: What do I believe must happen
  for me to succeed in my spiritual practice? Notice whether you assume effort, grace, knowledge, or something
  else. Hold that assumption lightly as you continue, and return to this question after studying the treatise''s
  core teachings.'
