translation: In this way, the wise Yogi should practice the regulation of the air. No disease can attack
  his body, and he obtains vayu-siddhi.
abhyasa: 'Sit quietly for five minutes today. Notice your breath without changing it. Observe: Does the
  breath move evenly through both nostrils? Does it shift with mood or posture? This simple witnessing—the
  beginning of vāyu-regulation—invites you into the tradition''s premise that breath is both ordinary
  and a gateway to subtle mastery.'
