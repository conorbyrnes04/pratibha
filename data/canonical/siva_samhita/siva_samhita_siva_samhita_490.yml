  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: He is the Yogi, he is the true devotee, he is worshipped in all worlds, who contemplates the Jivatma and the
  Paramatma as related to each other as "I" and "Am", who renounces "I" and "Thou" and contemplates the indivisible; the Yogi
  free from all attachment takes shelter of that contemplation in which, through the knowledge of super-imposition and negation,
  all is dissolved.
abhyasa: Sit quietly and notice the distinction between the 'I' that observes (the witness) and the 'Am' that simply is (existence
  itself). For a few minutes, let these two aspects of awareness rest as one, without trying to merge them—simply recognize
  they have never been separate. When the mind pulls you into subject-object duality, gently return to this recognition.
