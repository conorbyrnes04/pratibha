  body: He is the Yogi, he is the true devotee, he is worshipped in all worlds, who contemplates the Jivatma and the Paramatma
    as related to each other as "I" and "Am", who renounces "I" and "Thou" and contemplates the indivisible; the Yogi free
    from all attachment takes shelter of that contemplation in which, through the knowledge of super-imposition and negation,
    all is dissolved.
