  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: On his tongue always dances the goddess of learning, he obtains mantra- siddhi (success in
  mantras), through constant repetition only.
abhyasa: Choose a single mantra or sacred syllable (e.g. 'om'). Repeat it aloud for 5–10 minutes today,
  attending to the physical sensation of sound moving through your tongue and throat. Notice whether repetition
  itself—rather than analysis—opens a quality of presence or subtlety.
