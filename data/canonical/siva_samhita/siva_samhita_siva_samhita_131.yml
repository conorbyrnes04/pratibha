title: In proportion to the force of his karma, man…
unit_type: verse
commentary: 'This passage presents karma not as external punishment but as an inseparable condition of
  embodied existence: the jīva (individual soul) *is* its accumulated actions, and suffering or pleasure
  arise proportionally from that weight. The teaching dissolves the question ''why do I suffer?'' into
  ''what have I done?''—and crucially, it grounds this in māyā, the veiling power that makes the infinite
  Intelligence appear as a world of separate causes and effects. Liberation, by implication, lies not
  in escaping karma but in seeing through the illusion that binds action to a separate self.



  Key Terms



  **jīva** — The individual soul or embodied consciousness, understood here as inseparable from its accumulated
  karmas; not fundamentally separate from the universal Intelligence.

  **māyā** — The veiling or illusory power through which the infinite Intelligence appears as a world
  of multiplicity, causation, and separate objects.

  **karma** — Action and its accumulated consequences; the binding force that ties the jīva to cycles
  of pleasure and suffering until wisdom dissolves the sense of separate doership.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (Arjuna''s duty without attachment to fruit):** Both texts affirm that action is
  inescapable and that one''s station determines one''s dharma; karma is the law binding all embodied
  beings. Divergence: The Gītā emphasizes right action and surrender of results; the Śiva Saṃhitā here
  stresses that karma is the jīva''s very substance—liberation requires seeing through the illusion of
  separate agency itself, not merely acting rightly.


  **Dhammapada 1 (mind is the forerunner of all things):** Both traditions root suffering in the individual''s
  own past volition and mental habit; there is no external savior. Divergence: The Dhammapada emphasizes
  ethical cultivation and mindfulness as the path; the Śiva Saṃhitā introduces māyā—the cosmic veiling—suggesting
  that even right action does not fully liberate until the illusion of separation itself is seen through.


  **Ecclesiastes 9:11 (time and chance happen to all):** Both acknowledge that fortune and misfortune
  are not random; they follow a law (karma or divine order). Divergence: Ecclesiastes suggests an inscrutability
  and vanity to the order; the Śiva Saṃhitā asserts a precise, transparent law—karma is knowable and traceable
  to one''s own actions, and wisdom can dissolve it entirely.'
