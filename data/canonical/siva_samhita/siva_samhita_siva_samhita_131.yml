translation: In proportion to the force of his karma, man suffers misery or enjoys pleasure. The Jiva
  that has accumulated an excess of evil never stays in peace - it is not separate from its karmas; except
  karma, there is nothing in this world. From the Intelligence veiled by maya, all things have been evolved.
abhyasa: 'Today, notice one moment of discomfort or ease—a frustration, a small joy. Rather than blaming
  circumstance or another person, pause and ask: *What action or pattern of mine is this reflecting?*
  Not to induce guilt, but to observe directly how your own momentum shapes what meets you. This is the
  beginning of taking karma seriously as your own responsibility.'
