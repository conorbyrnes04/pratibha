  body: In proportion to the force of his karma, man suffers misery or enjoys pleasure. The Jiva that
    has accumulated an excess of evil never stays in peace - it is not separate from its karmas; except
    karma, there is nothing in this world. From the Intelligence veiled by maya, all things have been
    evolved.
