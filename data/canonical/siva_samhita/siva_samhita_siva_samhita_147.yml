  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Prana, apana, samana, udana, vyana, naga, kurma, Krikara, devadatta, and dhananjaya.
abhyasa: 'Sit quietly and notice your breath. As you inhale and exhale, ask: Where do I feel movement in my body right now?
  Chest, belly, throat, limbs? Without forcing anything, simply observe how the breath animates different regions. This gentle
  noticing begins to awaken sensitivity to the subtle winds the text names—a first step toward the refined perception yoga
  cultivates.'
