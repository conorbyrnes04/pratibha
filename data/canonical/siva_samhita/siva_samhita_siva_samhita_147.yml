title: Prana, apana, samana, udana, vyana, naga, kurma…
unit_type: verse
commentary: 'This passage lists the ten vital winds (vāyus) that animate the body and mind in Tantric physiology. Rather than
  treating the body as inert matter, the Śiva Saṃhitā recognizes it as a dynamic field of subtle energies, each with distinct
  functions—from digestion and elimination to speech and sensory perception. Naming them is the first step toward recognizing
  and eventually mastering these forces; the practitioner learns that what feels like a unified ''self'' is actually an orchestration
  of distinct currents that can be observed, refined, and integrated.



  Key Terms



  **Prāṇa (and the ten vāyus)** — The vital life-force winds that move through the subtle body; each governs specific physiological
  and psychological functions. Prāṇa itself is the primary upward-moving wind; the others (apāna, samāna, etc.) govern elimination,
  digestion, speech, circulation, and other processes.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts recognize that the sage perceives subtle, invisible forces (ch''i / prāṇa) flowing
  through the world and body, and that mastery begins with patient observation rather than force. Divergence: The Tao Te Ching
  emphasizes non-action and spontaneity; the Śiva Saṃhitā prescribes specific practices (prāṇāyāma, mudrā) to deliberately
  refine these winds.


  **Hippocrates, On Breaths:** Both Greek and Sanskrit medical philosophy recognize breath as a fundamental principle animating
  the body, distinct from blood or solid matter. Divergence: Hippocratic pneuma is largely a physical-physiological concept;
  the Śiva Saṃhitā''s vāyus are subtle, non-material energies accessible only through refined perception and practice.


  **Ecclesiastes 12:7 (''the spirit returns to God''):** Both traditions recognize that life is animated by a force that moves
  through the body and may be understood as returning to its source. Divergence: Ecclesiastes frames this as a one-way departure
  at death; the Śiva Saṃhitā treats the winds as forces to be consciously worked with during life for liberation.'
