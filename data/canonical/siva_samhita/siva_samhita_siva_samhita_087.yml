translation: From the self-combination of the Spirit which is Siva and the Matter which is Sakti, and,
  through their inherent interaction on each other, all creatures are born.
abhyasa: 'Sit quietly and observe a single breath. Notice how the inhale and exhale are not separate forces
  but a single rhythm—neither one ''causes'' the other, yet neither exists alone. Let this mirror the
  passage''s teaching: Śiva and Śakti, consciousness and energy, are not two things meeting, but one dynamic
  seen from two perspectives. Rest in that non-separation for a few minutes.'
