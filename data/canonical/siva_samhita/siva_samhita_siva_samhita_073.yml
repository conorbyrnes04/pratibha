  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The earth becomes subtle and is dissolved in water; water is resolved into fire; fire similarly
  merges in air; air gets absorption in ether, and ether is resolved in avidya (Ignorance), which merges
  into the Great Brahma.
abhyasa: 'Today, as you sit quietly, mentally trace the reverse journey: notice the solidity of your body
  (earth), its fluidity and moisture (water), its warmth and radiance (fire), its breath and movement
  (air), and the space in which all sensation arises (ether). Rest briefly in each, without forcing, as
  a contemplation of how your own form participates in this subtle hierarchy.'
