title: The earth becomes subtle and is dissolved in water;
unit_type: verse
commentary: 'This passage describes a progressive dissolution of the five elements (pañcamahābhūta) back
  toward their source, culminating in the unmanifest ground of being. Each grosser element is reabsorbed
  into the subtler one that precedes it, reversing the usual order of manifestation. The teaching suggests
  that what appears solid and separate is actually a temporary crystallization of increasingly subtle
  principles, and that liberation involves recognizing this hierarchy of dissolution—a key non-dual insight:
  the apparent world is not abandoned but understood as a continuous unfolding from and return to undifferentiated
  consciousness.



  Key Terms



  **avidya** — Ignorance or nescience; in this context, the unmanifest potentiality from which the elements
  emerge and into which they dissolve, preceding the ultimate ground (Brahma).

  **pañcamahābhūta** — The five great elements (earth, water, fire, air, ether) that constitute gross
  and subtle manifestation in Hindu metaphysics.



  Cross-Tradition Resonances



  **Taittirīya Upaniṣad (II.1):** Both describe the emergence of elements from a subtle source and their
  hierarchical relationship; both use elemental dissolution as a teaching on the nature of reality. Divergence:
  The Upaniṣad emphasizes Brahman as the source and asks ''from what are all beings born?''; the Śiva
  Saṃhitā frames dissolution as a yogic practice of retracing manifestation.


  **Tao Te Ching (15):** Both suggest that the manifest world arises from and returns to an ungraspable,
  subtle source; both honor the paradox of form emerging from formlessness. Divergence: The Tao Te Ching
  emphasizes the Tao as nameless and beyond description; the Śiva Saṃhitā provides a systematic map of
  intermediate principles (elements, avidya) for contemplative retracing.


  **Samkhya Kārikā (3-4):** Both texts present a layered metaphysics in which gross manifestation unfolds
  from subtler principles; both use this hierarchy to explain bondage and liberation. Divergence: Samkhya
  emphasizes the dualism of Puruṣa and Prakṛti; the Śiva Saṃhitā, as non-dual teaching, ultimately resolves
  all principles into a single consciousness.'
