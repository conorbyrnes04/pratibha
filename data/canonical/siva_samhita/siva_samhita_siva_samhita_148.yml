  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: These are the ten principal names, described by me in this Shastra; they perform all functions,
  incited thereto by their own actions.
abhyasa: 'Today, sit quietly and notice the ten primary movements of your own being: breath in and out,
  the pulse of attention, the flow of sensation through limbs, the rhythm of thought and stillness. Rather
  than trying to control them, simply observe how each performs its function naturally. This prepares
  the ground for deeper work with the subtle body.'
