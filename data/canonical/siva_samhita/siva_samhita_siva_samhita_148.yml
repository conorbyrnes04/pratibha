title: These are the ten principal names, described by me…
unit_type: verse
commentary: 'Śiva here establishes that ten principal entities (likely the ten vital channels or forces
  in the subtle body) operate autonomously according to their own inherent nature and function. This reflects
  the non-dual teaching that reality is not externally controlled but self-organizing through the intrinsic
  activity (karma) of its constituents. The passage suggests that understanding these ten principles is
  foundational to yoga practice—not as objects to be manipulated, but as forces to be recognized and harmonized.



  Key Terms



  **Śastra** — A systematic treatise or authoritative teaching text; here, the Śiva Saṃhitā itself, presented
  as Śiva''s direct instruction.

  **karma (own actions)** — In this context, the intrinsic nature or momentum of each principle; the self-propelling
  quality by which each force naturally performs its function.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 48:** Both texts describe a natural, self-operating order: ''In the pursuit of learning,
  every day something is acquired. In the pursuit of the Way, every day something is dropped.'' The ten
  principles act without external compulsion, like the Tao''s effortless action (wu wei). Divergence:
  The Tao Te Ching emphasizes emptiness and non-action; the Śiva Saṃhitā names and systematizes specific
  forces, grounding practice in precise anatomy of consciousness.


  **Aristotle, Physics II.1-2:** Both recognize that things possess an intrinsic nature (physis / svabhāva)
  by which they naturally perform their function—a principle of self-organization. Divergence: Aristotle''s
  framework is metaphysical and external; the Śiva Saṃhitā''s ten principles are interior, subtle, and
  accessible through yogic perception.


  **Bhagavad Gītā III.33:** Both affirm that all beings follow their own nature (svabhāva): ''Even a wise
  person acts according to their own nature.'' The ten principles similarly enact their own dharma. Divergence:
  The Gītā emphasizes duty and social role; the Śiva Saṃhitā focuses on the impersonal, energetic substrate
  underlying all manifestation.'
