  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: 'The Yoga is of four kinds: First mantrayoga, second hathayoga, third layayoga, fourth rajayoga,
  which discards duality. Sadhaks (Aspirants).'
abhyasa: Consider which of the four yogas calls to you most naturally today—whether through sound (mantra),
  breath and body (hatha), meditative absorption (laya), or direct inquiry into mind (raja). Rather than
  forcing yourself into an unfamiliar mode, honor your present capacity and spend 10–15 minutes with that
  approach, noticing how it might gradually open toward the others.
