abhyasa: 'Today, after a few minutes of steady breath awareness, notice where you feel constriction or openness in your torso
  and head. Without forcing, simply observe: where does the breath seem to pool, and where does it flow freely? This simple
  noticing honors the passage''s teaching that attention to the movement and containment of vital energy is itself a form
  of practice.'
