  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Yogi who practices this with perseverance is worshipped even by the gods; he receives
  the psychic powers of anima, laghima, etc., and can go everywhere, throughout the three worlds, at pleasure.
abhyasa: 'Today, reflect on one practice you do with consistency—breath work, meditation, or asana. Notice
  how regularity itself, independent of dramatic results, begins to shift your sense of capacity and ease.
  Sit with the question: what small freedom am I cultivating through this repetition?'
