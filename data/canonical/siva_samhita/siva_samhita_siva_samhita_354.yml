title: The Yogi who practices this with perseverance is…
unit_type: verse
commentary: 'This verse affirms that consistent yogic practice yields both divine recognition and concrete
  siddhis (psychic powers)—the ability to become infinitesimally small (anima) or weightless (laghima),
  and ultimately to move freely across all realms of existence. The passage suggests that yoga is not
  merely contemplative withdrawal but an active transformation that grants the practitioner agency and
  honor even among celestial beings, grounding the promise of liberation in tangible, verifiable capacities.



  Key Terms



  **siddhis** — Psychic or supernatural powers that arise as fruits of yogic practice; in this passage
  exemplified by anima (minuteness) and laghima (lightness)

  **anima and laghima** — Two of the classical eight siddhis: the power to become infinitesimally small
  and the power to become weightless or levitate, respectively



  Cross-Tradition Resonances



  **Yoga Sutras 3.45 (Patañjali):** Both texts connect consistent practice (abhyāsa) to the emergence
  of supernatural capacities and freedom of movement across states of being. Divergence: The Yoga Sutras
  frame siddhis as potential distractions from liberation; the Śiva Saṃhitā presents them here as natural
  fruits and signs of the yogi''s honored status.


  **Bhagavad Gita 2.40 (Krishna to Arjuna):** Both emphasize that even a small, consistent effort in practice
  yields protection and progress that transcends ordinary human limitation. Divergence: The Gita stresses
  freedom from desire and action; the Śiva Saṃhitā explicitly celebrates the yogi''s acquisition of powers
  and mobility.'
