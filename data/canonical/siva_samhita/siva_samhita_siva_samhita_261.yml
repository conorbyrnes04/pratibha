  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: O goddess of the three worlds! when the Yogi, while performing the Mahabandha, causes the union of the prana
  and apana vayus and filling in the viscera with air drives it slowly towards the nates, it is called Mahavedha.
abhyasa: Sit quietly and observe the natural rhythm of your breath—the inhalation and exhalation as two complementary movements.
  Without forcing, notice where you sense expansion (upper chest, head) and where you sense settling (lower belly, base).
  Simply witnessing this polarity in your own breath, without technique, can deepen sensitivity to the body's energetic patterns
  that classical yoga texts describe.
