title: By repeating this twelve lacs of times, the lords…
unit_type: verse
commentary: 'This passage describes a concrete, quantified result of sustained mantra repetition: the accumulation of 1.2
  million recitations is said to grant mastery over non-human beings (yakṣas, rakṣasas, nāgas)—celestial, demonic, and serpentine
  entities in Hindu cosmology. The teaching reflects a core Śiva Saṃhitā principle: that disciplined practice yields measurable
  transformation, not merely internal realization. The ''control'' here suggests not domination but alignment of these forces
  with the practitioner''s will, implying that liberation involves harmonizing all planes of existence, not transcending them.



  Key Terms



  **yakṣas, rakṣasas, nāgas** — Classes of non-human beings in Hindu cosmology—yakṣas are celestial guardians of wealth; rakṣasas
  are powerful, often destructive entities; nāgas are serpent-deities. Their ''control'' suggests mastery over subtle forces
  and realms.

  **mantra repetition (japa)** — The practice of reciting a sacred sound or phrase a prescribed number of times; here, a method
  of accumulating spiritual power and transformation.



  Cross-Tradition Resonances



  **Dhammapada, verse 183: ''The path to the Deathless is mindfulness; heedlessness is the path to death.'':** Both texts
  emphasize disciplined, sustained practice as the engine of transformation; repetition and attention are the means. Divergence:
  The Dhammapada frames practice as ethical and psychological; the Śiva Saṃhitā locates power in mantra and the subtle body,
  and envisions mastery over non-human realms.


  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their knowledge
  is unfathomable.'':** Both suggest that deep practice yields a kind of power or mastery that operates silently and comprehensively.
  Divergence: The Tao Te Ching emphasizes wu-wei (non-action) and paradox; the Śiva Saṃhitā prescribes precise, quantified
  effort and names specific supernatural results.


  **Meister Eckhart: ''When the soul is empty of all things, it is transformed into God.'':** Both traditions suggest that
  systematic inner work leads to a state in which the practitioner''s will aligns with a larger order or power. Divergence:
  Eckhart emphasizes emptiness and union with the divine; the Śiva Saṃhitā describes the activation and mastery of subtle
  forces and entities within a non-dual cosmos.'
