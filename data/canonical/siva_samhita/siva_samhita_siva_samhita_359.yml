translation: When the Yogi constantly thinks that he has got a third eye - the eye of Shiva - in the middle
  of his forehead, he then perceives a fire brilliant like lightening. By contemplating on this light,
  all sins are destroyed, and even the most wicked person obtains the highest end. 23
abhyasa: Sit quietly and bring your attention to the space between your eyebrows, at the center of your
  forehead. Without strain, visualize or sense a luminous point or flame there—steady and bright. Rest
  your awareness on this light for 5–10 minutes, allowing any sense of inner radiance to emerge naturally.
  Notice what arises without judgment.
