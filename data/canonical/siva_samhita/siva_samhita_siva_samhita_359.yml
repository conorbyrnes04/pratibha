  body: When the Yogi constantly thinks that he has got a third eye - the eye of Shiva - in the middle
    of his forehead, he then perceives a fire brilliant like lightening. By contemplating on this light,
    all sins are destroyed, and even the most wicked person obtains the highest end. 23
