  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In that is the root of the sushumna, together with its hole; this is called the Brahmarandhra
  (the hole of Brahma), extending up to the Muladhar padma.
abhyasa: Sit quietly and, without forcing breath or visualization, simply notice the space along the midline
  of your body from the crown of your head to the base of your spine. Sense this as an open pathway rather
  than a solid structure. Rest awareness there for a few minutes, observing any subtle sensations or shifts
  in attention.
