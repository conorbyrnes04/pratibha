  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In the pericarp of the adhara lotus there is the triangular, beautiful yoni, hidden and kept
  secret in all the Tantras.
abhyasa: Sit quietly and bring gentle awareness to the base of your spine. Without forcing visualization,
  simply notice the space there—its quality, texture, aliveness. Rest attention there for a few minutes,
  neither grasping nor dismissing what arises. This is a beginning orientation to the adhara, the foundation.
