  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the modifications of the thinking principle are suspended, then one certainly becomes
  a Yogi; then is known the Indivisible, holy, pure Gnosis.
abhyasa: 'Sit quietly for ten minutes. Notice the stream of thoughts, emotions, and sensations without
  judgment. Rather than trying to stop them, simply observe the gaps between thoughts—those brief moments
  of stillness. Rest attention there. This simple noticing, without effort to ''achieve'' anything, mirrors
  the passage''s teaching: realization emerges when the mind''s constant modification is allowed to settle.'
