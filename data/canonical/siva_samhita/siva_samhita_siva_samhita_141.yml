  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Persons attached to sensual objects and desirous of sensual pleasures, descend from the road
  of nirvana, through the delusion of much talk, and fall into sinful deeds.
abhyasa: 'Today, notice one moment of sensory craving (taste, comfort, distraction) and the mental chatter
  that follows it. Rather than judge, simply observe: Does the talking-about-it deepen the attachment?
  Can you rest in the sensation itself without the narrative? This simple noticing is the beginning of
  the return.'
