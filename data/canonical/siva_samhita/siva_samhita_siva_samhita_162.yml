title: Having received instructions in Yoga, and obtained…
unit_type: verse
commentary: 'This passage establishes the foundational conditions for yoga practice: a qualified teacher
  (guru), sincere effort (earnestness), trust in the teaching (faith), and fidelity to the transmitted
  method. The text does not promise results from mere intellectual understanding or solitary experimentation,
  but from embodied practice undertaken within a lineage. By naming these prerequisites upfront, the Śiva
  Saṃhitā acknowledges that yoga is not a self-invented path but a disciplined relationship between student
  and guide.



  Key Terms



  **Guru** — A qualified teacher of yoga; in this context, one who possesses direct knowledge of yoga
  practice and its fruits, and can transmit it authentically to a student.

  **Yoga** — As used here, the disciplined practice and philosophy aimed at liberation (mokṣa); the text
  treats it as a coherent system with methods, stages, and a realized goal.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.34:** Both texts insist that true knowledge comes through service to a teacher: ''Know
  that by prostration, by question, and by service, the wise who have seen the truth will instruct thee
  in wisdom.'' The Śiva Saṃhitā echoes this guru-centered epistemology. Divergence: The Gītā emphasizes
  surrender and questioning as attitudes; the Śiva Saṃhitā stresses the *method* taught by the guru as
  the binding constraint—less about devotion, more about technical fidelity.


  **Confucian Analects (e.g., 7.8):** Both traditions value earnest practice under a master''s guidance:
  ''I am not one who was born with knowledge; I love the past and am diligent in seeking it.'' Effort
  and lineage transmission are central. Divergence: Confucius emphasizes moral cultivation and social
  order; the Śiva Saṃhitā aims at non-dual liberation and subtle-body transformation—a different telos
  entirely.


  **Meister Eckhart, ''Counsels on Discernment'':** Eckhart warns against self-willed spiritual seeking
  and urges trust in a guide: ''Let a man guard against his own will and follow the will of his teacher.''
  Both texts reject ego-driven practice. Divergence: Eckhart''s framework is Christian mysticism centered
  on union with God; the Śiva Saṃhitā operates within a non-dual metaphysics where the self and Śiva are
  not separate to begin with.'
