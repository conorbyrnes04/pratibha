translation: Having received instructions in Yoga, and obtained a Guru who knows Yoga, let him practice
  with earnestness and faith, according to the method taught by the teacher. (4) The Place, etc.
abhyasa: Reflect today on what 'earnestness' means for you in one practice you undertake—whether formal
  meditation, movement, or study. Notice the difference between going through motions and bringing genuine
  commitment. If you have a teacher or guide (formal or informal), recall one instruction they have given
  and practice it with renewed attention to their specific method, rather than your own interpretation.
