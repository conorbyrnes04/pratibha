  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He, to whom this world is but the pleasure-ground of maya, therefore, contemptible and worthless,
  cannot find any happiness in riches, body, etc., nor in pleasures.
abhyasa: 'Today, notice one moment of craving—for comfort, status, or sensation. Pause and ask: what am
  I assuming is real or permanent about this desire? What would shift if I saw it as part of a passing
  play rather than as my true need? No need to reject it; simply observe the difference between grasping
  and seeing.'
