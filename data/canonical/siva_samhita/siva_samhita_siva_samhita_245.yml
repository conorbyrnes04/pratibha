sanskrit_devanagari: छिन्नरूपास्तु ये मन्त्राः कीलिताः स्तैभिताश्च ये दाधामन्त्राः शिरवाहीना मलिनास्तु
  तिरस्कृताः मन्दा बालास्तथा वृद्धाः प्रौढा यौवनगर्विताः अरिपक्षे स्थिता ये च निर्वीर्याः सत्त्ववर्जिताः
  तथा सत्त्वेन हीनाश्च खण्डिताः शतधाकृताः विधानेन च संयुक्ताः प्रभवन्त्यचिरेण तु सिद्धिमोक्षप्रदाः सर्वे
  गुरुणा विनियोजिताः दीक्षयित्वा विधानेन अभिषिच्य सहस्रधा ततो मंत्राधिकारार्थमेषा मुद्रा प्रकीर्तिता ६
