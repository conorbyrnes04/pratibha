  body: Even those mantras which are deformed {chhinna) or paralyzed {Kilita), scorched {stambhita) by
    fire, or whose flame has become attenuated, or are dark, and ought to be abandoned, or which are evil,
    or too old, or which are proud of their budding youth, or have gone over to the side of the enemy,
    or weak and essenceless without vitality; or which have been divided into hundreds of parts, even
    they become fertile through time and method. All these can give powers and emancipation when properly
    given to the disciple by the Guru, after having initiated him according to proper rites, and bathed
    him a thousand times. This Yoni-mudra has been described, in order that the student may deserve (to
    be initiated into the mysteries of) and receive the mantras.
