  body: Then, let the Yogi destroy the multitude of karmas by the pranava (OM); let him accomplish kayavyhua
    (a mystical process of arranging the various skandas of the body), in order to enjoy or suffer the
    consequences of all his actions in one life, without the necessity of re-birth.
