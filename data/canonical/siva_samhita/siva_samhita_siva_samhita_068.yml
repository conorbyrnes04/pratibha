title: From ether, air;
unit_type: verse
commentary: 'This passage presents a classical enumeration of the five elements (pañcamahābhūta) in their order of manifestation,
  each arising from and containing the previous ones. The teaching is not merely cosmological but metaphysically significant:
  it shows how the subtle (ether/ākāśa) progressively densifies into the gross (earth), a movement that mirrors both cosmic
  creation and the embodied human condition. Understanding this hierarchy is foundational to yoga practice, since the subtle
  body and its energies (prāṇa, kuṇḍalinī) operate through these same elemental principles.



  Key Terms



  **pañcamahābhūta (five great elements)** — ether (ākāśa), air (vāyu), fire (agni), water (ap), and earth (pṛthivī) — the
  fundamental principles of manifestation in Hindu metaphysics, each arising from and interpenetrating the others

  **ether (ākāśa)** — the subtlest element, the principle of space and potentiality from which all other elements emerge



  Cross-Tradition Resonances



  **Taittirīya Upaniṣad (II.1):** Both texts teach that the elements arise sequentially from a subtle source, with each denser
  element emerging from the previous one, and that understanding this hierarchy reveals the nature of reality. Divergence:
  The Upaniṣad emphasizes that all elements arise from Brahman (ultimate reality) and return to it; the Śiva Saṃhitā passage
  focuses on the mechanical sequence of manifestation without explicit reference to the non-dual ground.


  **Aristotle''s Physics (Book IV):** Both traditions recognize ether/space as a fundamental principle underlying material
  reality, and both see a hierarchical ordering of elements. Divergence: Aristotle treats the elements as static categories;
  the Śiva Saṃhitā presents them as a dynamic, interpenetrating process of manifestation relevant to embodied spiritual practice.


  **Samkhya Kārikā (verse 24-25):** Both texts describe the progressive manifestation of gross matter from subtle principles,
  and both use this cosmology to explain the structure of embodied existence. Divergence: Samkhya emphasizes the dualism of
  Puruṣa and Prakṛti; the Śiva Saṃhitā, as a non-dual teaching, implies that consciousness pervades and transcends this elemental
  progression.'
