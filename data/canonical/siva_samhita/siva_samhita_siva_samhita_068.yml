  body: From ether, air; from the air and ether combined came fire; from the triple compound of ether, air and fire came water;
    from the combination of ether, air, fire and water was produced the (gross) earth.
provenance:
  collection: Śiva Saṃhitā
  category: yoga
  chapter: On the One Reality (Jñāna)
  verse: '1.72'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: From ether, air; from the air and ether combined came fire; from the triple compound of ether, air and fire came
  water; from the combination of ether, air, fire and water was produced the (gross) earth.
abhyasa: 'Sit quietly and mentally trace the five elements in reverse order: feel the solidity of earth in your body, then
  sense the fluidity of water, the warmth of fire, the movement of air, and finally rest in the spaciousness of ether. Notice
  how each is contained in the next, and how your awareness itself seems to pervade all five. Return to this sequence once
  daily.'
