translation: At the bottom of the Meru there is the sun having twelve Kalas. In the right side path (Pingala)
  the lord of creatures carries (the fluid) through its rays upwards.
abhyasa: Sit quietly and bring awareness to the base of your spine. Without forcing breath or visualization,
  simply notice the quality of warmth or subtle energy there. Then, as you inhale slowly through the right
  nostril (Piṅgalā), imagine or sense that warmth beginning to rise gently upward along the right side
  of your body. Repeat for 3–5 breaths, then rest. This is a preliminary sensing, not a full practice—offered
  to make the passage's geography tangible to contemplation.
