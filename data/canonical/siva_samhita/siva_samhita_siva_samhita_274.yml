title: O, ye adored of gods!
unit_type: verse
commentary: 'This brief injunction establishes a principle of discretion fundamental to tantric practice:
  certain techniques are not universal teachings but require careful stewardship. The phrase ''dear as
  life'' suggests the mudrā''s potency—its power to transform the practitioner—which demands both respect
  and protection from misuse or premature exposure. The teaching implies that transmission itself is an
  act of discernment, not mere dissemination.



  Key Terms



  **mudrā** — A gesture or energetic seal (here, Jalandhara, the throat lock) that channels prāṇa and
  consciousness; treated as a potent transmission requiring qualified reception

  **Jalandhara** — The throat lock mudrā mentioned here; one of the foundational seals in prāṇāyāma practice



  Cross-Tradition Resonances



  **Dhammapada, verse 79 (''Do not give what is holy to dogs''):** Both texts warn against indiscriminate
  sharing of sacred knowledge; both assume that receptivity and readiness matter. Divergence: The Dhammapada
  speaks of moral unworthiness; the Śiva Saṃhitā implies technical danger—the mudrā''s power itself requires
  a prepared vessel.


  **Plato, Phaedrus (on the danger of writing without a teacher):** Both traditions privilege direct transmission
  and caution against decontextualized technique. Divergence: Plato fears writing''s passivity; the Śiva
  Saṃhitā fears the mudrā''s potency in unprepared hands—an energetic, not epistemological, concern.'
