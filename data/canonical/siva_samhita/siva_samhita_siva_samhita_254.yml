abhyasa: 'Today, sit quietly and reflect on what ''seal'' or ''gesture'' might mean in your own practice.
  Consider: What gesture or posture in your body feels most honest, most aligned with your deepest intention?
  Return to it briefly, without forcing, and notice what arises when you hold it with full attention.'
