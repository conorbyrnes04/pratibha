  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Then let the practitioner, sitting in a retired place and restraining his senses, utter by inaudible repetition,
  the long pranava OM, in order to destroy all obstacles.
abhyasa: Find a quiet space today. Sit upright for even five minutes. Close your eyes gently and mentally repeat OM slowly,
  feeling the sound as vibration rather than hearing it. Notice what 'obstacles' (restlessness, doubt, distraction) arise,
  and simply continue. This is the beginning.
