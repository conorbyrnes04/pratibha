translation: This is the great light held secret in all the Tantras; by contemplating on this, one obtains
  the highest success, there is no doubt of it.
abhyasa: 'Today, sit quietly and ask: What is the light I am already aware of—not metaphorically, but
  as the luminosity of consciousness itself, the fact that experience is lit from within? Rest attention
  there for five to ten minutes without grasping. Notice if this simple turning inward shifts your sense
  of what is ''highest'' or most real.'
