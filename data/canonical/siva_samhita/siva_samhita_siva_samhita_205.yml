  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: 'At that time let the great Yogi practice the five-fold dharana forms of concentration on Vishnu, by which command
  over the five elements is obtained, and fear of injuries from any one of them is removed. (Earth, water, fire, air, akas
  cannot harm him.) Note: He should perform 5 kumbhakas at each centre or chakra.'
abhyasa: 'Today, sit quietly and bring your awareness to one of the five elements—perhaps earth, feeling your weight and solidity.
  Breathe naturally while holding the image or sensation of that element, and silently acknowledge Vishnu (or the divine principle
  of sustenance and order) as the intelligence pervading it. Notice: does your fear or resistance to that element shift when
  you recognize it as sacred rather than threatening? This is a first taste of what the text calls ''removal of fear.'''
