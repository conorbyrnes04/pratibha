translation: Its name is verily the Kailas mount, where dwells the great Lord (Shiva), who is called Nakula
  and is without destruction, and without increase or decrease.
abhyasa: Sit quietly and bring awareness to the crown of the head or the space above it. Without straining,
  hold the sense that this innermost place is already inhabited by what is eternal and whole—needing nothing,
  lacking nothing. Rest there for a few breaths, simply acknowledging rather than achieving.
