  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The truth-perceiving Yogi becomes free from disease, and sorrow or affliction; he never gets
  (putrid) perspiration, saliva and intestinal worms.
abhyasa: 'Sit quietly today and notice one small bodily discomfort or unease—tension, fatigue, mild pain.
  Rather than dismissing it, observe it with the curiosity of a truth-perceiver: What does this sensation
  reveal about my habitual patterns? Does awareness itself change the sensation? This simple inquiry honors
  the passage''s claim that yoga transforms the body through deepened perception, not denial.'
