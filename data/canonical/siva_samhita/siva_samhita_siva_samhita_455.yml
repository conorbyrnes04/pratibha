title: At the time of death let him bathe himself in the…
unit_type: verse
commentary: 'This passage teaches that at the moment of death, contemplative focus on the Triveni—understood
  here as an inner sacred confluence rather than merely the external pilgrimage site—becomes a direct
  gateway to liberation. The Śiva Saṃhitā suggests that the final thought at death is not incidental but
  determinative: a mind anchored in this sacred inner reality at the threshold between worlds dissolves
  into salvation immediately. This democratizes liberation from the monastery to the deathbed, affirming
  that even in the last instant, sincere remembrance suffices.



  Key Terms



  **Triveni** — Literally ''three braids'' or ''triple confluence''; in this context, the inner meeting
  of sacred channels (nāḍīs) within the subtle body, not only the external riverbank pilgrimage site.

  **Salvation (mokṣa/mukti)** — Liberation from the cycle of rebirth; here, attainable in the moment of
  death through the grace of focused remembrance.



  Cross-Tradition Resonances



  **Bhagavad Gītā 8.5–6 (Kṛṣṇa to Arjuna):** Both texts affirm that the thought held at death determines
  one''s destination: ''Whoever at the end of life abandons the body thinking of Me alone enters My being.''
  The Śiva Saṃhitā echoes this principle of final remembrance as salvific. Divergence: The Gītā emphasizes
  devotion to Kṛṣṇa as the object of that final thought, whereas the Śiva Saṃhitā locates salvation in
  remembrance of an inner sacred geography (the Triveni), a non-dual metaphysical reality.


  **Katha Upaniṣad 1.2.15 (''The wise man''s final hour''):** Both traditions recognize the deathbed moment
  as spiritually decisive and teach that wisdom or remembrance at that threshold determines liberation.
  Divergence: The Upaniṣad emphasizes the Self (Ātman) as the ultimate object of realization; the Śiva
  Saṃhitā offers a concrete yogic visualization (the Triveni) as the means, bridging philosophy and embodied
  practice.


  **Tibetan Book of the Dead (Bardo Thodol), on the ''clear light'' at death:** Both texts treat the moment
  of death as a unique opportunity for liberation through focused awareness and inner vision, not as an
  ending but as a threshold of transformation. Divergence: The Bardo Thodol guides consciousness through
  post-mortem states; the Śiva Saṃhitā suggests that recognition of the inner sacred reality *at* death
  itself is sufficient for immediate salvation, without intermediate stages.'
