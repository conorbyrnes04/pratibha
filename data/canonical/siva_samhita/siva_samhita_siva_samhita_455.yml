translation: 'At the time of death let him bathe himself in the water of this Triveni (the Trinity of
  rivers): he who dies thinking on this, reaches salvation then and there.'
abhyasa: Today, spend a few minutes in quiet reflection imagining the Triveni—the meeting of three sacred
  currents—within your own subtle body. Notice where you sense this convergence (traditionally at the
  navel center or the space between the eyebrows). Return to this image gently whenever death comes to
  mind, not morbidly, but as a reminder that spiritual focus is available to you now, and will remain
  available then.
