abhyasa: Today, observe one renunciation from the list—perhaps refraining from much talking, or choosing
  one pungent/stimulating food to avoid—not as deprivation, but as a small experiment in noticing what
  arises when you remove that stimulus. What becomes visible in the space it leaves?
