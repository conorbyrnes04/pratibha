  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: 'The Yogi should renounce the following; 1: Acids, 2: astringents, 3: pungent substances,
  4: salt, 5: mustard, and 6: bitter things; 7: much walking, 8: early bathing (before sun-rise) and 9:
  things roasted in oil; 10 theft, 11: killing (of animals) 12: enmity towards any person, 13: pride,
  14: duplicity, and 15: crookedness 16: fasting, 17: untruth, 18: thoughts other than those of moksha,
  19: cruelty towards animals; 20 companionship of women, 21: worship of (or handling or sitting near)
  fire, and 22: much talking, without regard to pleasantness or unpleasantness of speech, and lastly,
  23: much eating. (7) The means.'
