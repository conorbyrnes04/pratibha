translation: Among these three, sushumna alone is the highest and beloved of the Yogis. Other vessels
  are subordinate to it in the body.
abhyasa: 'Today, in a quiet moment, sit upright and simply notice the space along your spine—not to force
  anything, but to develop gentle awareness of the central axis of your body. Breathe naturally and observe:
  does attention naturally settle there, or does it scatter to the periphery? This simple noticing begins
  to familiarize you with the suṣumnā''s location and presence.'
