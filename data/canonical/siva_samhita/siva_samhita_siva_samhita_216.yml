title: When he drinks the air through the crow-bill, both…
unit_type: verse
commentary: 'This verse describes a specific prāṇāyāma technique (the ''crow-bill'' or kāka-mudrā, a pursed-lip
  inhalation) paired with visualized intention—directing breath toward the kuṇḍalinī—and claims a therapeutic
  fruit: the cure of pulmonary disease. The passage exemplifies the Śiva Saṃhitā''s central claim that
  precise breath work, combined with subtle anatomical awareness and regular practice, produces both spiritual
  and somatic transformation. It grounds liberation-practice in the lived body and its ailments, suggesting
  that healing and awakening are not separate pursuits.



  Key Terms



  **kuṇḍalinī** — In yoga philosophy, the dormant spiritual energy coiled at the base of the spine; awakened
  and directed upward through practice to bring liberation and transformation.

  **prāṇāyāma** — Regulation and direction of breath (prāṇa, vital life-force) through specific techniques;
  foundational to yoga practice and subtle-body work.

  **mudrā** — A symbolic gesture or seal of the body (here, the pursed-lip position); used to direct energy
  and deepen meditative states.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra, II.49–50 (prāṇāyāma as gateway to pratyāhāra):** Both texts treat breath-work
  as a precise technology that stills the mind and opens subtle perception; breath is the bridge between
  body and consciousness. Divergence: Patañjali emphasizes prāṇāyāma''s role in sense-withdrawal and mental
  steadiness; the Śiva Saṃhitā here foregrounds the anatomical pathway (kuṇḍalinī, nāḍīs) and a concrete
  healing outcome.


  **Hippocratic corpus (breath and pneuma in ancient medicine):** Both traditions recognize that controlled
  breathing affects the body''s vital functions and can restore health; breath is understood as a fundamental
  force. Divergence: The Hippocratic view treats pneuma mechanically and humorally; the Śiva Saṃhitā situates
  breath within a metaphysical map of subtle channels and spiritual energy.


  **Heraclitus, Fragment 12 (pneuma, flux, and the hidden harmony):** Both suggest that invisible currents
  (breath, energy) animate visible form and that attunement to these currents reveals deeper order. Divergence:
  Heraclitus speaks of cosmic flux and paradox; the Śiva Saṃhitā offers a systematic, reproducible method
  to harness and direct that flow toward liberation.'
