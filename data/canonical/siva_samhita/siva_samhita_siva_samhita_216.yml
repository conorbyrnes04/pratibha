  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When he drinks the air through the crow-bill, both in the morning and in the evening twilight,
  contemplating that it goes to the mouth of the kundalini, consumption of the lungs (phthisis) is cured.
abhyasa: At dawn or dusk, sit upright. Purse your lips as if drinking through a straw, and inhale slowly
  through this narrow opening. As you draw the breath in, visualize it descending along the central channel
  (suṣumnā-nāḍī) toward the base of the spine where kuṇḍalinī rests. Hold briefly, then exhale through
  the nose. Repeat 5–10 times, attending to any shift in sensation or stillness. This is offered as contemplative
  exploration, not medical treatment.
