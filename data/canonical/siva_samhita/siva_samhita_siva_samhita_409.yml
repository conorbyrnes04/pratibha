translation: His body never grows weak, and he retains his full strength for a thousand years, it becomes
  harder than adamant.
abhyasa: 'Sit quietly and observe your breath for five minutes. Notice where you feel strength or weakness
  in your body—not as judgment, but as simple awareness. Then reflect: what would it mean for your vital
  energy (prāṇa) to become steady and undiminished, rather than scattered or depleted? Return to the breath
  as the vehicle of that steadiness.'
