  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When the sleeping goddess Kundalini is awakened, through the grace of Guru, when all the lotuses and the bonds
  are readily pierced through and through.
abhyasa: 'Sit quietly and bring attention to the base of your spine. Without forcing, simply notice the quality of your breath
  and any subtle sensations. Reflect: What obstructions—mental, emotional, habitual—do I sense? Rather than trying to ''awaken''
  anything, practice receptivity: acknowledge both your sincere effort and your dependence on grace beyond your will. Return
  to breath.'
