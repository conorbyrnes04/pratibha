  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In this lotus is a flame called vanlinga; by contemplating on this, one gets objects of the seen and the unseen
  universe.
abhyasa: Sit quietly and bring attention to the center of the chest. Without forcing visualization, simply notice the space
  there—its warmth, its subtle luminosity if any appears. Rest your awareness there for five minutes, not grasping at visions,
  but allowing the heart-space to reveal itself. This is a gentle entry into the tradition's contemplative method.
