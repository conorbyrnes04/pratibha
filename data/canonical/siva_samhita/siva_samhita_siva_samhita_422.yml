translation: The lotus which is situated in the Muladhar has four petals. In the space between them, dwells
  the sun.
abhyasa: Sit quietly and bring gentle awareness to the base of your spine. Without forcing visualization,
  simply notice the space there—neither grasping for an image nor dismissing it. Rest attention on the
  quality of stillness or warmth you may sense, as an invitation to recognize the ground of your own being.
