translation: Some praise mantrayoga, others the frequenting of places of pilgrimage. Thus are the ways
  which people declare emancipation.
abhyasa: 'Today, notice one spiritual practice or discipline you encounter—whether your own or another''s.
  Rather than judging its efficacy or orthodoxy, pause and ask: what sincere longing does this practice
  serve? This cultivates the humility the passage models: recognizing that the human heart seeks liberation
  through many doors.'
