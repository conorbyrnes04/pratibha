  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Various are their names, and innumerable are the places in this human body; all of them cannot be enumerated
  here. (6) The Jivatma.
abhyasa: 'Today, sit quietly and notice the aliveness in your body—breath, heartbeat, subtle sensations. Rather than trying
  to map or name these currents, simply acknowledge: ''There is far more happening in me than I can name or fully know.''
  Rest in that recognition without grasping.'
