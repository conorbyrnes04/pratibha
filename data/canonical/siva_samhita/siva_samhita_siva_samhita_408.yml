translation: Even, if by chance, the mind of the Yogi is absorbed in this place, then he becomes unconscious
  of the external world, and enjoys certainly the inner world.
abhyasa: Today, sit quietly and notice a moment when you become absorbed in a single object—a breath,
  a sound, a visual point. Without striving, observe what happens to your awareness of the room around
  you. Does the external world fade slightly? Does something interior become more vivid? Rest there briefly,
  without judgment, and note the quality of that inner presence.
