title: The holy Yogi whose mind is absorbed in this, is…
unit_type: verse
commentary: 'This passage presents a paradox central to non-dual yoga: the attainment of extraordinary powers (siddhis) is
  not the goal, but rather a threshold the sincere practitioner passes through on the way to absorption in Śiva itself. The
  ''holy Yogi'' does not cling to these powers—anima (minuteness), laghima (lightness), and others—but recognizes them as
  signs of ripening, then releases them. The phrase ''after having enjoyed'' suggests these powers are real fruits of practice,
  yet their enjoyment is temporary; what endures is the merger of the individual mind with the divine consciousness (Śiva).
  This teaching guards against spiritual materialism while honoring the genuine transformation that yoga produces.



  Key Terms



  **anima, laghima, etc.** — The eight classical siddhis (supernatural powers or perfections): anima (minuteness), laghima
  (lightness), mahima (magnification), garima (heaviness), prāpti (access), prākāmya (irresistible will), vaśitva (dominion),
  and īśitva (lordship). In yoga philosophy, they arise naturally from advanced practice but are not its ultimate fruit.

  **Yogi** — A practitioner of yoga; here, one whose mind (citta) is steadied and unified through discipline, capable of direct
  absorption in the divine.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''yoga is skill in action''):** Both texts emphasize that the fruits of practice—whether powers or
  right action—are not to be grasped or desired as ends in themselves; they arise naturally when the mind is rightly oriented.
  Divergence: The Gītā frames non-attachment in terms of duty and dharma within the world; the Śiva Saṃhitā points toward
  transcendent absorption (samādhi) beyond worldly engagement.


  **Patañjali''s Yoga Sūtra 3.37 (siddhis as obstacles to samādhi):** Both classical yoga texts acknowledge that powers emerge
  in practice yet warn against treating them as the goal; they can become distractions. Divergence: Patañjali emphasizes siddhis
  as potential hindrances; the Śiva Saṃhitā frames them as natural enjoyments to be passed through, suggesting a gentler,
  less cautionary tone.


  **Meister Eckhart: ''God is not being or goodness... Goodness cleaves to being'':** Both suggest that even the highest attainments
  or attributes (powers, goodness) are secondary to a more radical absorption or union beyond all qualities. Divergence: Eckhart''s
  language is apophatic and Christian; the Śiva Saṃhitā remains within a Hindu metaphysical frame where Śiva is both transcendent
  and the ground of all powers.'
