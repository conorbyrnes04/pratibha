  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The holy Yogi whose mind is absorbed in this, is absorbed in me after having enjoyed the powers called anima,
  laghima, etc.
abhyasa: 'Today, notice one small capacity or comfort you possess—physical, mental, or circumstantial. Acknowledge it with
  gratitude, then ask: ''Is this what I truly seek, or a sign of something deeper?'' Let the question rest without answering.
  This mirrors the Yogi''s discernment between the powers that arise and the absorption they point toward.'
