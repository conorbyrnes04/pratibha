unit_label: Chapter 5 — 86
title: He gets immeasurable knowledge, knows the past…
unit_type: verse
commentary: 'This passage describes the siddhis (extraordinary capacities) that arise as fruits of sustained
  yoga practice—not as goals in themselves, but as natural byproducts of refined perception and mastery
  of prāṇa. The enumeration (knowledge of all time, clairaudience, clairvoyance, levitation) suggests
  that the practitioner''s ordinary sensory and temporal constraints dissolve as the subtle body is purified
  and awakened. The phrase ''whenever he likes'' emphasizes that these powers become accessible and controllable,
  not compulsive or fragmentary—a sign of genuine realization rather than mere psychic phenomena.



  Key Terms



  **siddhis** — Extraordinary capacities or powers (clairvoyance, clairaudience, knowledge of past/future,
  etc.) that arise as natural fruits of yoga practice and purification of the subtle body.

  **prāṇa** — Life-force or vital energy that flows through the subtle channels (nāḍīs) of the body; mastery
  of prāṇa through breath and meditation is central to yoga.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sutras, III.16–III.50 (on siddhis):** Both texts affirm that extraordinary perceptions
  and powers emerge naturally from deep meditation and subtle-body refinement, and both warn implicitly
  against attachment to them as ends. Divergence: The Yoga Sutras treat siddhis more cautiously as potential
  distractions from liberation; the Śiva Saṃhitā presents them more straightforwardly as fruits of the
  householder''s path.


  **Upaniṣads (e.g., Kaṭha Upaniṣad I.2.12: ''The wise who knows the Self as bodiless, unchanging, infinite…''):**
  Both suggest that yoga practice dissolves ordinary temporal and spatial limits, revealing a consciousness
  not bound by the senses. Divergence: The Upaniṣads emphasize non-dual realization itself; the Śiva Saṃhitā
  explicitly validates the intermediate siddhis as real and accessible to householders.


  **Heraclitus, Fragment 101 (''The hidden harmony is better than the obvious''):** Both point to a refined
  perception that grasps what ordinary awareness misses—past, future, and subtle dimensions. Divergence:
  Heraclitus speaks of philosophical insight into logos; the Śiva Saṃhitā describes concrete yogic capacities
  developed through embodied practice.'
