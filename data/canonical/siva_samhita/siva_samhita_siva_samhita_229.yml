  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Through his posture the Yogi, leaving the world, attains the highest end and throughout the
  world there is no posture more secret than this. By assuming and contemplating in this posture, the
  Yogi is freed from sin.
abhyasa: Today, assume a comfortable seated posture with spine upright. Rather than moving, simply rest
  in it for 5–10 minutes. Notice the weight of your body, the quality of your breath, the subtle shifts
  in awareness. Do not strain; let the posture itself become a mirror. What does it feel like to be held
  by gravity and structure at once?
