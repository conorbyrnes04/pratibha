  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In this body, which is called Brahmanda (microcosm, literally the mundane egg), there is
  the nectar-rayed moon, in its proper place, on the top of the spinal cord, with eight Kalas (in the
  shape of a semi-circle).
abhyasa: Sit quietly and bring awareness to the crown of your head. Without forcing, simply notice the
  space there—cool, spacious, perhaps luminous in imagination. Breathe gently and allow the image of a
  moon (full or crescent) to rest in that place for a few minutes. This is not visualization technique,
  but a way of turning attention inward to recognize the body as sacred territory.
