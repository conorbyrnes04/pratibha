translation: From the different modifications of the Prana, it receives various names; all of them cannot
  be stated here.
abhyasa: 'Today, notice the different qualities of your own breath and energy: the coolness of an exhale,
  the warmth of retention, the subtle shifts in alertness or calm. Rather than naming them, simply observe
  how a single vital force takes on different ''flavors'' depending on your state, posture, and attention.
  This direct sensing is the beginning of prāṇa-awareness.'
