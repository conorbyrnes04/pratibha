abhyasa: Choose one simple practice from your current routine (breath awareness, a mudrā, or a posture
  you know). Commit to performing it deliberately four times today, noting the quality of attention each
  time. Observe whether consistency itself—the act of returning again and again—shifts your relationship
  to time, effort, or presence.
