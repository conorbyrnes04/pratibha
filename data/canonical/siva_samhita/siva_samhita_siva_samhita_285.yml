title: When the intestines above and below the navel are…
unit_type: verse
commentary: 'This passage describes Uddiyāna Bandha, a foundational lock (bandha) in yoga practice, as
  a physical and energetic contraction that draws the abdominal organs upward and leftward. The text claims
  a dual efficacy: both a somatic effect (repositioning of viscera) and a soteriological one (destruction
  of sins and sorrows, mastery over death itself). The vivid metaphor—''the lion of the elephant of death''—suggests
  that this seemingly simple anatomical action possesses transformative power, positioning the practitioner
  as victor over mortality''s weight.



  Key Terms



  **Uddiyāna Bandha** — A yogic lock (bandha) involving the contraction and upward drawing of the abdominal
  organs, particularly practiced during breath retention; traditionally understood to redirect prāṇa (vital
  energy) upward along the central channel.

  **bandha** — A lock or seal in yoga practice; a muscular contraction or energetic closure used to contain
  and direct prāṇa (life force) within the subtle body.



  Cross-Tradition Resonances



  **Haṭha Yoga Pradīpikā (3.55–58):** Both texts describe Uddiyāna Bandha as a powerful practice that
  elevates prāṇa and brings liberation closer; both emphasize its role in mastering the life force. Divergence:
  The Haṭha Yoga Pradīpikā situates Uddiyāna within a systematic progression of bandhas and their specific
  anatomical and energetic effects, whereas this passage emphasizes its moral and soteriological fruit
  (destruction of sins) more directly.


  **Patañjali''s Yoga Sūtra (2.46) — ''sthira sukham āsanam'':** Both traditions affirm that physical
  posture and lock work toward a state of stability and ease that supports inner transformation and liberation.
  Divergence: Patañjali''s sūtra is aphoristic and non-anatomical, focusing on the quality of presence;
  the Śiva Saṃhitā grounds transformation in precise bodily technique.


  **Taoist internal alchemy (neigong) texts on ''gathering the qi'':** Both East Asian and Hindu tantric
  traditions employ upward-drawing practices to concentrate vital energy and transcend ordinary mortality.
  Divergence: Taoist texts typically emphasize circulation through meridians and the lower dantian; the
  Śiva Saṃhitā frames the practice within non-dual Śaiva metaphysics and the kuṇḍalinī system.'
