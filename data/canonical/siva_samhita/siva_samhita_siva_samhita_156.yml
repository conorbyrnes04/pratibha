  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: There is not the least doubt that Guru is father. Guru is mother, and Guru is God even; and
  as such, he should be served by all with their thought, word and deed.
abhyasa: Today, reflect on one person or influence that has genuinely guided you toward clarity or wholeness.
  Without sentimentalizing, notice what qualities of father, mother, or transcendent wisdom they embodied.
  Sit with gratitude for that guidance, and consider how you might honor it through your own actions.
