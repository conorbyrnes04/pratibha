title: In conformity with the effects of the past karma of…
unit_type: verse
commentary: 'Śiva here articulates a non-dual vision in which the divine (Śiva himself) orchestrates the
  apparent multiplicity of individual destinies according to each being''s accumulated karma. The paradox
  is central: jīva (the individual soul or consciousness) is declared immaterial and omnipresent, yet
  it ''enters'' material form to experience the consequences of past action. This reconciles divine sovereignty
  with individual responsibility—not as contradiction, but as two aspects of a single metaphysical order
  where consciousness is both transcendent and intimately bound to the cycle of action and result.



  Key Terms



  **jīva** — The individual soul or conscious principle; here described as immaterial yet entering material
  form to experience the fruits of karma.

  **karma** — Action and its accumulated consequences; the principle by which past deeds determine present
  circumstances and destinies.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.22–23 (on the ātman and rebirth):** Both texts affirm that the self is eternal and
  immaterial, entering successive bodies according to past action. Divergence: The Gītā emphasizes the
  ātman''s indestructibility more directly; the Śiva Saṃhitā here stresses the divine regulation of destiny
  alongside jīva''s immateriality.


  **Upaniṣads (e.g., Kaṭha 1.3.3, on ātman as witness):** The immaterial, omnipresent nature of consciousness
  and its apparent bondage to embodied experience. Divergence: The Upaniṣads often emphasize liberation
  through knowledge of identity; this passage foregrounds karma and divine governance as the mechanism
  of embodiment.


  **Heraclitus, Fragment 67 (on character and destiny):** The idea that one''s nature or past determines
  one''s fate or station. Divergence: Heraclitus speaks of character as destiny impersonally; the Śiva
  Saṃhitā posits an active divine intelligence regulating outcomes.'
