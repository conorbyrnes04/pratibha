translation: In conformity with the effects of the past karma of the jivas, I regulate all destinies.
  Jiva is immaterial, and is in all things; but it enters the material body to enjoy the fruits of karma.
abhyasa: 'Sit quietly and contemplate: Where do you experience yourself as both free (immaterial, witnessing)
  and bound (inhabiting this particular body, facing specific consequences)? Notice without resolving
  the tension. This simple inquiry can open awareness to the passage''s non-dual claim.'
