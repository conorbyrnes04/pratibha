title: In the second stage, there takes place the…
unit_type: verse
commentary: 'This passage describes progressive physical phenomena arising from sustained prāṇāyāma and mudrā practice, culminating
  in vāyu-siddhi (''mastery of the vital air''). The text treats these not as supernatural claims but as natural consequences
  of redirecting and refining the body''s energetic currents; the progression from trembling to levitation suggests a continuum
  of increasing subtlety and control. The mention of ''when the practice becomes greater'' emphasizes that such states emerge
  only through disciplined, sustained effort—not sudden or magical, but the fruit of methodical work.



  Key Terms



  **vāyu-siddhi** — Mastery or perfection (siddhi) of vāyu, the vital air or life-force; the culmination of prāṇic control
  in which the body becomes light and responsive to the refined breath.

  **prāṇāyāma** — Regulation and extension of the breath and vital energy through controlled breathing practices; foundational
  to the yoga described in the Śiva Saṃhitā.



  Cross-Tradition Resonances



  **Yoga Sūtras of Patañjali, III.42–43 (siddhis):** Both texts affirm that sustained yogic practice yields extraordinary
  capacities (siddhis), including mastery over the elements and the body''s weight and movement. Divergence: Patañjali treats
  siddhis as potential distractions from liberation; the Śiva Saṃhitā presents them more neutrally as natural stages, without
  explicit warning against attachment.


  **Hathayoga-Pradīpikā, II.70–72 (on mudrā and lightness):** Both texts describe physical lightness and aerial movement as
  fruits of mudrā and prāṇic mastery, suggesting a shared classical yoga lineage. Divergence: The Hathayoga-Pradīpikā emphasizes
  the role of specific mudrās (e.g., Mahāmudrā); this passage focuses on the generic progression of stages without naming
  techniques.


  **Upaniṣads, Kaivalya Upaniṣad (on the subtle body and liberation):** Both affirm that mastery of the subtle body''s energies
  (nāḍīs, vāyu) is inseparable from spiritual realization and freedom. Divergence: The Upaniṣads tend toward abstract metaphysics;
  the Śiva Saṃhitā grounds realization in concrete, observable bodily stages.'
