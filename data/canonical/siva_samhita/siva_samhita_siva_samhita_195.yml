  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Then gradually he should make himself able to practice for three gharis (one hour and a half
  at a time, he should be able to restrain breath for that period). Through this, the Yogi undoubtedly
  obtains all the longed- for powers. Siddhis or Perfections.
abhyasa: Today, notice one moment where you hold your breath naturally (before speaking, during focus,
  or in surprise). Rather than forcing, simply observe how long it sustains without strain. This seeds
  awareness of your prāṇa's current capacity—the honest ground from which gradual practice begins.
