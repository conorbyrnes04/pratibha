unit_label: Chapter 3 — 53
title: Then gradually he should make himself able to…
unit_type: verse
commentary: 'This passage emphasizes gradual, sustained prāṇāyāma practice as the direct path to siddhis—the
  extraordinary capacities that arise naturally from mastery of breath and vital force. The specificity
  of ''three gharis'' (90 minutes) signals that liberation and power are not instantaneous but require
  disciplined, incremental training of the body''s energetic capacity. The text''s confidence—''undoubtedly
  obtains''—reflects a non-dual view: when the practitioner''s individual effort aligns with the subtle
  body''s inherent potential, transformation becomes inevitable, not miraculous.



  Key Terms



  **ghari** — A traditional unit of time in Sanskrit texts, here equivalent to approximately 24 minutes;
  three gharis = roughly 72–90 minutes

  **siddhis** — Perfections or extraordinary capacities (clairvoyance, strength, etc.) that arise as natural
  fruits of sustained yogic practice, not as goals in themselves

  **Yogi** — One who practices yoga; in this context, a practitioner of breath control and subtle-body
  work toward liberation



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.14:** Both texts ground transformation in consistent, long-term practice
  (''sa tu dīrghakāla…''—practice becomes firm through long, uninterrupted effort). The Śiva Saṃhitā''s
  specificity of duration echoes Patañjali''s emphasis on sustained commitment. Divergence: Patañjali
  frames practice as a means to stabilize the mind; the Śiva Saṃhitā foregrounds breath mastery and siddhis
  as its fruit, reflecting a more explicitly tantric metaphysics of subtle-body transformation.


  **Tao Te Ching, ch. 15:** Both traditions prize gradual, patient cultivation over force: ''The ancient
  masters were profound and subtle''—they moved slowly, deliberately. The Śiva Saṃhitā''s ''gradually''
  mirrors this non-aggressive unfolding. Divergence: The Taoist text emphasizes wu-wei (non-action) and
  mystery; the Śiva Saṃhitā is explicit about technique and measurable capacity, reflecting yoga''s systematic
  mapping of the subtle body.


  **Bhagavad Gītā, VI.45:** Both affirm that disciplined practice (''abhyāsa'') leads to the highest attainment.
  The Gītā''s ''yogī jāyate'' (the yogi is born through practice) parallels the Śiva Saṃhitā''s confidence
  that sustained effort yields undeniable fruit. Divergence: The Gītā emphasizes devotion and duty alongside
  practice; the Śiva Saṃhitā isolates prāṇāyāma and breath-body mastery as the primary engine of transformation.'
