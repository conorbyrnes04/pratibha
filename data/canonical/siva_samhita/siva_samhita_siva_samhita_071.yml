title: Form is perceived through he eyes, smell through…
unit_type: verse
commentary: 'This passage grounds perception in the body''s sensory apparatus, establishing a foundational
  principle: knowledge of the world arrives through five distinct channels, each organ specialized for
  its object. In the Śiva Saṃhitā''s non-dual framework, this enumeration is not mere physiology but a
  map of how consciousness encounters manifestation—a necessary step before the text moves toward transcending
  or integrating these perceptions through yoga practice. By naming the organs clearly, the teaching acknowledges
  the embodied reality practitioners must work with, not deny.



  Key Terms



  **indriya (organ of perception)** — In Sanskrit philosophical anatomy, the sensory faculties through
  which consciousness engages the external world; the five are sight, smell, taste, touch, and hearing.



  Cross-Tradition Resonances



  **Upaniṣads (Kena Upaniṣad 1.1):** Both texts begin inquiry by naming the senses as the gateway to knowledge—''By
  whom is the mind sent forth?''—establishing the senses as the first subject of contemplation. Divergence:
  The Kena Upaniṣad immediately questions the senses'' authority and points beyond them; the Śiva Saṃhitā
  passage simply establishes them as real instruments, deferring the transcendence to later practice.


  **Aristotle, *De Anima* II.6–7:** Both traditions systematically map the five senses to their proper
  objects and organs, treating sensory anatomy as foundational to understanding consciousness. Divergence:
  Aristotle''s framework is epistemological and biological; the Śiva Saṃhitā''s is soteriological—these
  organs are named because yoga will eventually redirect their energy toward liberation.'
