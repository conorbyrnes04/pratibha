abhyasa: Sit quietly today and notice one area where you feel 'unfortunate' or blocked—in body, energy,
  or circumstance. Rather than analyzing it, simply acknowledge it as the starting point (not the barrier)
  for practice. Observe what shifts when you hold that condition without judgment, as the passage suggests
  the Yogi does through steady practice.
