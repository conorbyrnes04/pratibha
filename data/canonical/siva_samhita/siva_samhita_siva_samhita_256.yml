  body: In this way, even the most unfortunate Yogi might obtain success. By this means all the vessels
    of the body are roused and stirred into activity; the life is increased and its decay is checked,
    and all sins are destroyed. All diseases are healed, and the gastric fire is increased. It gives faultless
    beauty to the body, and destroys decay and death. All fruits of desire and pleasure are obtained,
    and the senses are conquered. The Yogi fixed in meditation acquires all the above-mentioned things,
    through practice. There should be no hesitation in doing so.
