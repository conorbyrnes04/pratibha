translation: 'This has its face downwards, and rains nectar day and night. The ambrosia further sub-divides
  itself into two subtle parts:'
abhyasa: 'Sit quietly and bring awareness to the crown of your head. Without forcing or visualizing, simply
  notice: what sensations, temperatures, or qualities of attention arise there? Rest there for a few minutes,
  receiving rather than grasping. This grounds the passage''s teaching that nourishment is already present
  and flowing.'
