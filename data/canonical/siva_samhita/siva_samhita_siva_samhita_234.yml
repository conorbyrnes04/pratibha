  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Stretch out both the legs and keep them apart; firmly take hold of the head by the hands,
  and place them on the knees. This is called ugrasana (the stern-posture), it excites the motion of the
  air, destroys the dullness and uneasiness of the body, and is also called paschima-uttana (the posterior
  crossed posture.) That wise man who daily practices this noble posture can certainly induce the flow
  of the air up through the anus.
