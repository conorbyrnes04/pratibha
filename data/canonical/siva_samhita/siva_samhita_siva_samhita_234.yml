title: Stretch out both the legs and keep them apart;
unit_type: verse
commentary: 'This passage presents a specific physical posture as a means to direct prāṇa (vital air)
  upward through the body—a foundational aim in yogic practice. The text emphasizes that the posture works
  through mechanical and energetic means: it stimulates circulation, clears mental dullness, and prepares
  the subtle channels for prāṇa to move in a controlled direction. The promise is concrete and repeatable:
  regular practice by ''that wise man'' produces a tangible result, suggesting that liberation is not
  abstract but embodied, accessible through disciplined attention to the body''s capacities.



  Key Terms



  **prāṇa (air/vital force)** — The animating energy or breath-force that moves through the body; in this
  passage, the object of yogic direction and control.

  **āsana (posture)** — A physical position held in yoga practice, here used as a vehicle for energetic
  transformation rather than mere flexibility.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra, II.46: ''sthira-sukham āsanam'' (posture should be steady and comfortable):**
  Both texts treat āsana as a deliberate practice with energetic purpose, not mere stretching. Divergence:
  Patañjali emphasizes balance and ease; the Śiva Saṃhitā passage stresses vigor and the deliberate excitation
  of prāṇa flow.


  **Hatha Yoga Pradīpikā, I.34: postures are praised for awakening kuṇḍalinī and purifying the nāḍīs:**
  Both texts link physical practice to subtle-body transformation and liberation. Divergence: The Hatha
  Yoga Pradīpikā names kuṇḍalinī explicitly; this passage speaks only of ''air'' moving upward, remaining
  more phenomenological.'
