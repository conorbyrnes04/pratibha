  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: All the beings that exist in the three worlds are also to be found in the body; surrounding
  the Meru they are engaged in their respective functions.
abhyasa: 'Sit quietly and bring attention to the spine as a central channel. Without forcing breath or
  visualization, simply notice: What sensations, energies, or presences seem to move or rest along this
  axis? Spend 10 minutes observing without judgment, allowing the spine to be felt as a living center
  rather than mere anatomy.'
