  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Since the Spirit in its nature is not limited by time, or space, it is therefore infinite,
  all-pervading and entirety itself.
abhyasa: Sit quietly and notice how your ordinary awareness moves through time (memory, anticipation)
  and space (here, there, inside, outside). Then, without forcing, observe a single breath or sensation
  without dividing it into past, present, or future, and without locating it as 'mine' versus 'other.'
  Rest there briefly. This is a small taste of the non-dual awareness the passage describes.
