  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The illusion of the manifested (objective world) is destroyed when the Maker of the Manifest becomes manifest.
  This illusion does not cease so long as one thinks, "Brahma is not."
abhyasa: 'Today, notice one moment when you perceive something external—a sound, a thought, a sensation. Pause and ask: ''What
  is aware of this?'' Rather than analyzing, rest attention on the aware-ness itself, prior to the division into ''I'' and
  ''object.'' Return to this simple inquiry whenever you remember.'
