translation: The wise have thus explained the creation of the world - tattwas (elements) and non-tattwas
  (non-elements) are thus produced - not otherwise.
abhyasa: 'Today, observe one moment of creation—a thought arising, a sensation, a sound entering awareness.
  Ask: Is this a *tattwa* (something manifest, elemental) or a *non-tattwa* (the space, silence, or principle
  from which it emerges)? Notice how both seem necessary. Rest in that recognition without needing to
  resolve it.'
