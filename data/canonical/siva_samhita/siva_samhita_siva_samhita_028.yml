  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The wise Yogi, having realized the truth of karmakanda (works), should renounce them; and having left both virtue
  and vice, he must engage in jnanakanda (knowledge).
abhyasa: 'Reflect today on one habitual action you perform as ''good'' or ''right''—a practice, discipline, or virtue. Without
  abandoning it, notice: Am I doing this for its own fruit, or have I glimpsed that no action alone can touch what I truly
  seek? Sit with that gap, without rushing to answer.'
