translation: The Yogi, who having controlled his senses, repeats this mantra one hundred thousand times,
  gains the power of attracting others.
abhyasa: 'Choose a short mantra (e.g. ''Om'' or a traditional one given by a teacher). Sit quietly for
  5–10 minutes today. Before beginning, notice one sense you habitually indulge (sound, taste, thought-wandering).
  During repetition, gently return attention to the mantra each time that sense pulls you away. Observe:
  does restraint sharpen focus? Does focus create a felt quality of presence?'
