translation: 'Out of the many mudras, the following ten are the best: (1) Mahamudra, (2) Mahabandha, (3)
  Mahavedha, (4) Khechari, (5) Jalandhar, (6) Mulabandha, (7) Viparitkarana, (8) Uddana, (9) Vajrondi,
  and (10) Shaktichalana.'
abhyasa: Choose one of the ten mudrās named here (or learn it from a qualified teacher). Before practice,
  sit quietly and recall that this single technique, refined over centuries, is considered among the best.
  Rather than seeking novelty, practice it with full attention for several sessions, noticing how depth
  of repetition differs from breadth of exploration.
