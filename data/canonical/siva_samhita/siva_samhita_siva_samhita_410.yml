translation: When the Yogi leaves off this contemplation, then to him in this world, thousands of years,
  appear as so many moments.
abhyasa: 'Today, sit quietly for even five minutes without checking time or counting breaths. Notice how
  your sense of duration shifts when attention is not fragmented by clock-consciousness. Afterward, reflect:
  what felt like five minutes? How does that compare to five minutes spent anxiously watching time pass?'
