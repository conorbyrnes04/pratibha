translation: Since the Spirit is unlike this world, which is composed of five states of matter, that are
  false and subject to destruction, therefore, it is eternal. It is never destroyed.
abhyasa: 'Today, notice one thing that changes—a sensation fading, a thought dissolving, your breath shifting.
  Pause and ask: what in me is aware of this change? Can that awareness itself be destroyed? Sit with
  the question without forcing an answer.'
