translation: There are in it seers and sages; all the stars and planets as well. There are sacred pilgrimages,
  shrines; and presiding deities of the shrines.
abhyasa: 'Sit quietly and bring attention to the center of your chest or the space between the eyebrows.
  Without straining, consider: what sacred or wise presences already live within me? What pilgrimage am
  I already on, simply by inhabiting this body? Rest in that recognition for a few minutes.'
