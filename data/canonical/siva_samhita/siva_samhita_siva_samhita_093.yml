title: There are in it seers and sages;
unit_type: verse
commentary: 'This passage asserts that the human body is a microcosm—containing within itself the celestial
  order, the spiritual exemplars (seers and sages), and the sacred geography of pilgrimage and worship.
  Rather than seeking liberation through external ritual or distant shrines, the practitioner discovers
  that all necessary elements of spiritual life already dwell within the subtle body. This radical internalization
  of the sacred is central to non-dual yoga: the cosmos and its divine powers are not separate from the
  self but intrinsic to it.



  Key Terms



  **microcosm (implied)** — The teaching that the individual body-mind mirrors and contains the entire
  cosmos, including celestial bodies, spiritual beings, and sacred sites—a non-dual principle central
  to tantric yoga.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kaṭha Upaniṣad 2.2.12): ''In the city of Brahman is a small shrine in the form of
  a lotus'':** Both texts locate the divine and the infinite within the body as a sacred dwelling place,
  accessible through inward attention. Divergence: The Upaniṣads emphasize the Ātman (Self) as the ultimate
  reality within; the Śiva Saṃhitā foregrounds the subtle anatomy (nāḍīs, cakras) as the vessel through
  which that realization unfolds via prāṇāyāma and mudrā.


  **Hermes Trismegistus, Emerald Tablet: ''As above, so below'':** Both traditions teach correspondence
  between macrocosm and microcosm, suggesting that understanding one''s inner nature reveals universal
  law. Divergence: The Emerald Tablet frames this as a principle of sympathetic magic and alchemy; the
  Śiva Saṃhitā grounds it in lived yogic practice and the liberation of consciousness.'
