  body: In accordance with the instructions of the Guru, press gently the perineum with the heel of the
    left foot. Stretching the right foot out, hold it fast by the two hands. Having closed the nine gates
    (of the body), place the chin on the chest. Then concentrate the vibrations of the mind and inspire
    air and retain it by kumbhaka (so long as one can comfortably keep it). This is the Mahamudra, held
    secret in all the Tantras. The steady-minded Yogi, having practiced it on the left side should then
    practice it on the right side; and in all cases must be firm in pranayama - the regulation of his
    breath.
