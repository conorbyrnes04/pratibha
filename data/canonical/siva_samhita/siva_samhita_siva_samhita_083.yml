  body: When through the knowledge that all is illusory perception (aropa) and by intellectual refutation (apavada) of other
    doctrines, this universe is resolved into the one, then, there exists that One and nothing else; then this is clearly
    perceived by the mind. Karma clothes the Jiva with body.
