  label: Translation
  body: By repeating this 28 lacs of times, he becomes the lord of the Viddyadharas, the wise Yogi becomes
    kama- rupi {i.e., can assume what-ever form he desires). By repeating these thirty lacs of times he
    becomes equal to Brahma and Vishnu. He becomes a Rudra, by sixty lac repetitions, by eighty lac repetitions
    he becomes all-enjoyer, by repeating one tens of millions of times, the great Yogi is absorbed in
    the Pram Brahman. Such a practitioner is hardly to be found throughout the three worlds.
