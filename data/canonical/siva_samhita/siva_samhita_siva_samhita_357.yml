translation: Let the Yogi seat himself in the padmasana, and fix his attention on the cavity of the throat,
  let him place his tongue at the base of the palate; by this he will extinguish hunger and thirst.
abhyasa: Sit comfortably with your spine upright. Gently place the tip of your tongue against the soft
  palate (the roof of your mouth just behind the hard palate). Rest your attention in the hollow of your
  throat for 5–10 minutes, breathing naturally. Notice without judgment whether your sense of hunger or
  thirst shifts. This is an observation, not a test.
