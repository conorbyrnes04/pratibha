  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the avidya has an excess of rajas, it manifests itself as the wise Saraswati; the intelligence
  which presides over her is known as Brahma.
abhyasa: 'Sit quietly and observe a moment when you feel confident in your knowledge or understanding.
  Rather than accepting that certainty as final truth, gently ask: *What am I not seeing? What ignorance
  might be shaping even this clarity?* Notice whether this inquiry opens spaciousness rather than collapsing
  into doubt. This mirrors the text''s invitation to see through the apparent solidity of knowledge.'
