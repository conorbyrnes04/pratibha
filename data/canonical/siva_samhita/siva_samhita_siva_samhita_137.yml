  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: As long as knowledge does not arise about the stainless Manifestor of the universe, so long
  all things appear separate and many.
abhyasa: 'Today, pause once and notice a moment of multiplicity—many thoughts, many sensations, many objects.
  Then, without effort, ask: what is the single awareness in which all of this appears? Rest there briefly,
  not as belief but as direct inquiry. Return to your day.'
