abhyasa: Today, sit quietly and gently direct your awareness to the space between the eyebrows or the
  crown of the head. Without forcing, simply notice any subtle sensation, light, or coolness there. Rest
  your attention there for a few minutes, letting the breath settle naturally. This is not visualization
  but gentle recognition of an inner presence already present.
