title: All the heavenly bodies (planets, etc.,) become…
unit_type: verse
commentary: 'This passage describes the fruits of contemplating the inner moon (a subtle center in the
  head), claiming that such practice brings both worldly protection and ultimate liberation—culminating
  in the radical assertion that the practitioner becomes equal to Śiva himself. The text emphasizes that
  yoga is not merely a path of renunciation but one accessible to householders seeking both security and
  transcendence. The triple affirmation (''verily, verily, again most verily'') signals the passage''s
  climactic claim: that disciplined inner work dissolves the distance between self and the divine.



  Key Terms



  **Khechari** — A siddhi or supernatural power traditionally associated with movement through space or
  inner realms, acquired through advanced yoga practice

  **Bhuchari** — A siddhi or power traditionally associated with movement or mastery over the earth element,
  gained through yoga

  **Ajhapura Chakra** — The subtle energy center in the head (literally ''the chakra that is not uttered''),
  associated with the inner moon and advanced stages of practice



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.48 (''yoga is skill in action''):** Both texts affirm that yoga is a disciplined science
  yielding concrete fruits—protection, success, and ultimately liberation—not mere philosophy Divergence:
  The Gītā emphasizes equanimity in action and duty; the Śiva Saṃhitā locates the fruit in subtle inner
  contemplation and the acquisition of powers


  **Patañjali''s Yoga Sūtra 1.2 (yoga as cessation of mental fluctuations):** Both root yoga in a transformative
  inner science that leads to a state beyond ordinary consciousness Divergence: Patañjali emphasizes the
  stilling of the mind; the Śiva Saṃhitā emphasizes visualization and contemplation of specific subtle
  centers and their powers


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both suggest
  that advanced practice dissolves the subject-object duality, making the practitioner equal to or one
  with the divine Divergence: Eckhart speaks of mystical union through detachment; the Śiva Saṃhitā describes
  it as the fruit of systematic yoga practice on the subtle body'
