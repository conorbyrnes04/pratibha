  body: All the heavenly bodies (planets, etc.,) become auspicious, all dangers are destroyed, all accidents
    are warded off, success is obtained in war; the Khechari and the Bhuchari powers are acquired by the
    seeing of the moon which is in the head. By mere contemplation on it all these results ensue, there
    is no doubt of it. By constant practice of Yoga one verily becomes an adept. Verily, verily, again
    most verily, he becomes certainly my equal. The continual study of the science of Yoga, gives success
    to the Yogis. Here ends the description of the Ajhapura Chakra. The Mystic Mount Kailas.
