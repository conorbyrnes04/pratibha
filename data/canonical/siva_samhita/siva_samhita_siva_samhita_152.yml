  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who in this way knows the microcosm of the body, being absolved from all sins, reaches
  the highest state. (2) The Guru.
abhyasa: 'Today, sit quietly and place your attention on the central channel of your body—the pathway
  from the base of the spine to the crown of the head. Without forcing breath or visualization, simply
  notice: What is the quality of space or energy there? What arises when you regard your own body not
  as an object to be fixed, but as a cosmos to be known? Return to this noticing for five minutes, as
  an act of reverence toward the teaching that you yourself are the microcosm.'
