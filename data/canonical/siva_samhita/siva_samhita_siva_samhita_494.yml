translation: The wise one, by restraining all his senses from their objects, and being free from all company,
  remains in the midst of these objects, as if in deep sleep, i.e., does not perceive them.
abhyasa: 'Today, choose one routine activity (eating, walking, listening to speech). Perform it fully,
  but notice: can you engage the action while maintaining an inner witness—aware but not identified with
  sensation? Observe without judgment how attention can be both present and free.'
