  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: From the time he begins till the time he gains perfect mastery, let the Yogi eat moderately and abstemiously,
  otherwise, however clever, he cannot gain success.
abhyasa: 'Today, notice one meal or eating moment without judgment. Eat slowly enough to taste what you consume. Afterward,
  reflect: Did you eat until satisfied, or until full? What would ''moderate and abstemious'' mean for your body right now,
  without harshness?'
