abhyasa: 'Today, in a quiet moment, sit upright and bring attention to the central axis of your body—from the base of the
  spine to the crown of the head. Without forcing or visualizing, simply notice: is there a sense of a subtle channel or pathway
  there? What qualities or sensations (if any) arise? This is a gentle, non-effortful acquaintance with the concept of Sushumna.'
