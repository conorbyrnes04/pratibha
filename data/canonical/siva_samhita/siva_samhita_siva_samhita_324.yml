abhyasa: 'Today, notice one metaphysical or spiritual idea you find comforting or true. Sit with it briefly,
  then gently ask: ''Am I clinging to this idea, or resting in what it points to?'' Without rejecting
  the idea, observe the difference between holding a concept and the open awareness that holds all concepts.'
