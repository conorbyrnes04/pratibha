translation: In it is the supreme goddess Kundalini of the form of electricity, in a coil. It has three
  coils and a half (like a serpent), and is in the mouth of sushumna.
abhyasa: 'Sit quietly and bring awareness to the base of your spine. Without forcing or visualizing, simply
  notice the space there—any sensation of warmth, tingling, or subtle movement. Breathe gently and rest
  your attention there for 5–10 minutes. This is not activation but recognition: becoming familiar with
  the seat of your own energy.'
