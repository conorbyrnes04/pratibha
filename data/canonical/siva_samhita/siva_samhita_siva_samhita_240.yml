abhyasa: 'Sit in a comfortable cross-legged position today. Before moving into any practice, pause and notice: What does it
  feel like to ground yourself through the spine and pelvis? Attend to the quality of ease or effort, without forcing. This
  simple witnessing honors the teaching that posture is not mere mechanics but a gateway to presence.'
