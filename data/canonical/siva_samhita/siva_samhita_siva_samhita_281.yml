abhyasa: 'Today, reflect on one area of your life where you feel caught or overwhelmed—a relationship, work, or internal pattern.
  Sit quietly and ask: What would it mean to ''invert'' my usual response here? Not to act rashly, but to notice what happens
  when you mentally reverse your habitual stance. Write one sentence about what shifts.'
