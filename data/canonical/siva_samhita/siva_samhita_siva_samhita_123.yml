translation: The wise Yogi, having kindled this Viswanaric fire according to proper rites, should sacrifice
  food into it every day, in conformity with the teachings of his spiritual teacher.
abhyasa: At your next meal, pause before eating. Acknowledge the fire of digestion within you as sacred.
  Offer the food consciously—mentally dedicating it to your practice, your teacher's lineage, or the dissolution
  of ego. Eat with full attention, as if feeding a flame that sustains both body and spirit.
