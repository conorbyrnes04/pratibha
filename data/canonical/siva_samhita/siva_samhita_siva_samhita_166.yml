translation: Again, let him draw breath through the right nostril, and stop breathing as long as his strength
  permits; then let him expel the air through the left nostril, not forcibly, but slowly and gently.
abhyasa: 'Today, sit quietly and practice this technique for 3–5 minutes: inhale through the right nostril
  (left closed), retain the breath as comfortably as you can, then exhale slowly through the left nostril.
  Notice any shifts in mental clarity or calm. This is not a substitute for proper instruction, but an
  invitation to feel how breath and awareness are linked.'
