  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The Yogi becomes free from the chain by his own exertion. The importance of the contemplation of the two-petalled
  lotus cannot be fully described. Even the gods like Brahma, etc., have learnt only a portion of its grandeur from me.
abhyasa: Today, sit quietly and bring gentle attention to the space between your eyebrows. Without forcing or visualizing,
  simply rest awareness there for 5–10 minutes, noticing any subtle sensations, light, or spaciousness. This is not technique
  but familiarization—a first step in recognizing the seat the text honors.
