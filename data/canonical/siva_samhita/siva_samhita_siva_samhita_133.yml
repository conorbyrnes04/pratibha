translation: From desire all these delusions arise; they can be eradicated with great difficulty; when
  the salvation-giving knowledge of the unreality of the world arises, then are desires destroyed.
abhyasa: 'Sit quietly and observe a desire arising in your mind—perhaps for comfort, approval, or distraction.
  Rather than fighting it, ask: What am I assuming is real about the object I want? Notice how the desire
  depends on a belief that this thing, once obtained, will be solid and lasting. Rest in that noticing
  without judgment. This is a seed of the ''salvation-giving knowledge'' the text names.'
