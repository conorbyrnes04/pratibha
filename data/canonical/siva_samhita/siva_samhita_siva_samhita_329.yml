  body: Those who have the largest amount of energy, are enterprising, engaging, heroic, who know the Shastras, and are persevering,
    free from the effects of blind emotions, and, not easily confused, who are in the prime of their youth, moderate in their
    diet, rulers of their senses, fearless, clean, skillful, charitable, a help to all; competent, firm, talented, contented,
    forgiving, good-natured, religious, who keep their endeavors secret, of sweet speech, peaceful, who have faith in scriptures
    and are worshippers of God and Guru, who are averse to fritter away their time in society, and are free from any grievous
    malady, who are acquainted with the duties of the adhimatra, and are the practitioners of every kind of Yoga —undoubtedly,
    they obtain success in three years; they are entitled to be initiated in all kinds of Yoga, without any hesitation. Invocation
    of the shadow (pratikopasana).
