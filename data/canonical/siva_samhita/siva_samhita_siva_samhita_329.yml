  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Those who have the largest amount of energy, are enterprising, engaging, heroic, who know the Shastras, and are
  persevering, free from the effects of blind emotions, and, not easily confused, who are in the prime of their youth, moderate
  in their diet, rulers of their senses, fearless, clean, skillful, charitable, a help to all; competent, firm, talented,
  contented, forgiving, good-natured, religious, who keep their endeavors secret, of sweet speech, peaceful, who have faith
  in scriptures and are worshippers of God and Guru, who are averse to fritter away their time in society, and are free from
  any grievous malady, who are acquainted with the duties of the adhimatra, and are the practitioners of every kind of Yoga
  —undoubtedly, they obtain success in three years; they are entitled to be initiated in all kinds of Yoga, without any hesitation.
  Invocation of the shadow (pratikopasana).
abhyasa: 'Today, reflect honestly on one quality from this list that you already embody (e.g., perseverance, charity, moderation)
  and one that calls to you as underdeveloped. Rather than self-judgment, notice: what small, concrete action could deepen
  that quality this week? The text suggests that yoga is not separate from how we live.'
