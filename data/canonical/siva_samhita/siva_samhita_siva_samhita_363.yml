  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Having conquered all elements, and being void of all hopes and worldly connections, when
  the Yogi sitting in the padmasana, fixes his gaze on the tip of the nose, his mind becomes dead and
  he obtains the spiritual power called Khechari.
abhyasa: Sit comfortably today and, without strain, gently direct your gaze toward the tip of your nose
  for 2–3 minutes. Notice what happens to the quality of your thinking—does the mind become quieter, more
  unified? Do not force; simply observe how attention itself, when collected, alters your inner state.
  This is a preliminary taste of the focus the passage describes.
