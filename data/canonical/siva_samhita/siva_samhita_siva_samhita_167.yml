  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: According to the above method of Yoga, let him practice twenty kumbhakas (stopping of the breath). He should
  practice this daily without neglect or idleness, and free from all duels (of love and hatred, and doubt and contention),
  etc.
abhyasa: 'Today, after a few minutes of calm breathing, practice one or two rounds of gentle breath retention (kumbhaka) at
  a comfortable depth, holding only as long as feels natural. Notice the quality of mind that arises: are you present, or
  caught in preference and aversion? Return to this small act tomorrow.'
