  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When a person does not see anything else here, having seen the Self by the self; then there
  is no sin (for him if he) renounces all ritual works. This is my opinion.
abhyasa: 'Sit quietly today and notice: what is aware of your thoughts, sensations, and surroundings right
  now? Rather than analyzing, rest attention on the awareness itself—the ''seeing'' rather than what is
  seen. Return to this simple noticing whenever you remember it.'
practice: 'Sit quietly today and notice: what is aware of your thoughts, sensations, and surroundings
  right now? Rather than analyzing, rest attention on the awareness itself—the ''seeing'' rather than
  what is seen. Return to this simple noticing whenever you remember it.'
