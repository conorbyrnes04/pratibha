unit_label: Chapter 2 — 53
title: When a person does not see anything else here…
unit_type: verse
commentary: 'This passage articulates a non-dual realization in which the distinction between observer
  and observed collapses—the Self sees itself directly, not as an object but as the ground of all seeing.
  Once this vision is stable, the passage suggests, ritual observance becomes unnecessary, not from negligence
  but from having transcended the dualistic framework that gives ritual its meaning. The radical claim
  is that liberation (mokṣa) and freedom from karmic consequence flow from this direct knowledge, not
  from external compliance.



  Key Terms



  **Self (Ātman)** — In this context, the non-dual consciousness that is both the witness and the substance
  of all experience; seeing it ''by the self'' means direct, non-mediated realization, not intellectual
  knowledge.

  **sin (pāpa)** — Karmic consequence or bondage; the passage suggests it dissolves when action flows
  from non-dual realization rather than ego-driven intention.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Aitareya 1.1: ''Consciousness is Brahman''):** Both affirm that direct realization
  of the non-dual Self is the ultimate knowledge and liberates from bondage. Divergence: The Śiva Saṃhitā
  explicitly situates this realization within a yoga practice framework (prāṇāyāma, mudrā), whereas the
  Upaniṣads emphasize inquiry and meditation without specifying somatic techniques.


  **Bhagavad Gītā 2.50 (''yoga is skill in action''):** Both suggest that enlightened action transcends
  ritual formalism and arises from a different order of consciousness. Divergence: The Gītā frames this
  as performing duty without attachment; the Śiva Saṃhitā suggests ritual itself becomes irrelevant once
  non-dual sight is established.


  **Meister Eckhart (''the eye with which I see God is the eye with which God sees me''):** Both point
  to a collapse of subject-object duality in which the seer and seen are recognized as one. Divergence:
  Eckhart''s language is theistic (God); the Śiva Saṃhitā remains within a non-theistic metaphysics of
  pure consciousness.'
