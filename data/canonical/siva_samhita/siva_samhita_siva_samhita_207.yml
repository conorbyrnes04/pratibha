abhyasa: Today, sit quietly for 10–15 minutes and practice fixing your attention on a single object—the
  breath, a mantra, or a visual point. When the mind wanders, gently return it without judgment. Notice
  what it feels like to sustain focus even briefly, and reflect on how continuity of attention might reshape
  your sense of time and impermanence.
