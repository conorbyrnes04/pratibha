  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: From all these (fourteen) nadis, there arise gradually other branches and sub-branches, so
  that at last they become three hundred thousand and a half in number, and supply their respective places.
  3 1. These nadis are spread through the body cross-wise and length-wise; they are vehicles of sensation
  and keep watch over the movements of the air i.e., they regulate the motor functions also. (5) The Abdominal
  Region.
abhyasa: Sit quietly and, without forcing breath, notice the sensations moving through your torso—warmth,
  tingling, heaviness, lightness. Do not name or judge them. Simply observe how sensation itself seems
  to move and distribute itself through your body, as if traveling along invisible pathways. Rest in this
  noticing for 5–10 minutes.
