  body: From all these (fourteen) nadis, there arise gradually other branches and sub-branches, so that
    at last they become three hundred thousand and a half in number, and supply their respective places.
    3 1. These nadis are spread through the body cross-wise and length-wise; they are vehicles of sensation
    and keep watch over the movements of the air i.e., they regulate the motor functions also. (5) The
    Abdominal Region.
