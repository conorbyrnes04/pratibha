translation: This body, the abode of Brahma, and composed of five elements and known as Brahmanda (the
  egg of Brahma or microcosm) has been made for the enjoyment of pleasure or suffering of pain.
abhyasa: Sit quietly and place your awareness in your heart center. Without judgment, notice one sensation
  of ease and one of discomfort present in your body right now. Recognize both as expressions of the body's
  nature—neither to be clung to nor rejected—and observe how awareness itself remains untouched by either.
  Return to natural breathing.
