title: By constant meditation one forgets the world, then…
unit_type: verse
commentary: 'This verse distills a central claim of the Śiva Saṃhitā: that sustained meditative practice
  leads to a forgetting of worldly attachment, which is not loss but liberation—the ground from which
  genuine power (siddhi) emerges. The passage suggests that power does not come from grasping or controlling
  the world, but from releasing identification with it. ''Wonderful power'' here likely means both spiritual
  attainment and the natural capacities that unfold when the mind is no longer fragmented by desire and
  aversion.



  Key Terms



  **Yogi** — A practitioner of yoga; in this context, one who pursues union with the non-dual Self through
  disciplined meditation and practice.

  **siddhi** — Wonderful power, attainment, or perfection; in classical yoga, both supernatural capacities
  and the fruit of liberation itself.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.55–56 (on the sage of steady wisdom):** Both texts link the stilling of worldly desires
  to the emergence of unshakeable peace and clarity. The Gītā''s ''prasanna'' (serene) mind parallels
  the Śiva Saṃhitā''s forgetting as a gateway to power. Divergence: The Gītā emphasizes duty (dharma)
  and action in the world; the Śiva Saṃhitā here stresses withdrawal from worldly concern as the condition
  for power.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa and vairāgya, practice and dispassion):** Both texts recognize
  that constant practice (abhyāsa) and release from attachment are complementary paths to yogic attainment
  and inner stability. Divergence: Patañjali frames this as a methodological pair; the Śiva Saṃhitā presents
  forgetting as the *result* of meditation, not a parallel discipline.


  **Meister Eckhart, ''Blessed are the poor in spirit'':** Both traditions teach that emptying oneself
  of worldly preoccupation opens a channel for transcendent power or grace to flow. Divergence: Eckhart
  grounds this in Christian surrender to God''s will; the Śiva Saṃhitā locates power in the Yogi''s own
  non-dual nature, revealed through forgetting.'
