translation: By constant meditation one forgets the world, then in sooth the Yogi obtains wonderful power.
abhyasa: Today, sit quietly for even five minutes and notice what you are *not* thinking about—the world
  you have, for that moment, forgotten. Rather than forcing the mind blank, simply allow attention to
  settle inward, and observe what shifts when you release the need to manage or judge what arises. This
  is a small taste of the forgetting the text describes.
