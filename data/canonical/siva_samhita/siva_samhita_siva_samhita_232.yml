  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By performing and practicing this posture, undoubtedly the vital airs of the practitioner
  at once become completely equable, and flow harmoniously through the body.
abhyasa: 'Sit in a comfortable, stable seated posture (sukhasana or padmasana if accessible). For five
  minutes, simply notice the quality of your breath and any sense of flow or blockage in your body. Do
  not force or manipulate; observe. Then reflect: does the steadiness of my posture seem to influence
  the steadiness of my breath? What does ''equable'' feel like?'
