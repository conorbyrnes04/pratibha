  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In the abdomen there burns the fire - digester of food - situated in the middle of the sphere of the sun having
  twelve Kalas. Know this as the fire of Vaiswanara; it is born from a portion of my own energy, and digests the various foods
  of creatures, being inside their bodies.
abhyasa: 'Sit quietly after eating. Notice the warmth and gentle activity in your belly as digestion begins. Rather than dismissing
  this as ''merely physical,'' pause and contemplate: what intelligence is at work here, breaking down food into life? Spend
  2–3 minutes with this simple observation, allowing the boundary between ''my body'' and ''divine energy'' to soften.'
