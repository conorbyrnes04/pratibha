title: In the abdomen there burns the fire - digester of…
unit_type: verse
commentary: 'This passage locates divine energy within the ordinary biological process of digestion, identifying the metabolic
  fire (Vaiśvānara agni) as a direct manifestation of Śiva''s own śakti. Rather than treating the body as separate from the
  sacred, the text grounds non-dual realization in the lived fact of sustenance—suggesting that liberation is not achieved
  by transcending embodied life, but by recognizing the divine already present within it. The specific detail of ''twelve
  Kalas'' (rays or digits) and the ''sphere of the sun'' points to a subtle anatomy where gross physiology and cosmic principle
  interpenetrate.



  Key Terms



  **Vaiśvānara** — The universal fire of digestion; here understood as a localized expression of cosmic divine energy, dwelling
  in each creature''s belly.

  **Kalas** — Rays, digits, or portions of light; here describing the structure or radiance of the solar sphere within which
  digestive fire dwells.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Taittirīya Upaniṣad): ''From food are born all creatures; by food they live; into food they return.'':**
  Both texts honor food and digestion as sacred processes, not obstacles to spirituality. Divergence: The Upaniṣads emphasize
  food as the gateway to understanding Brahman through cosmic hierarchy; the Śiva Saṃhitā locates Śiva''s energy directly
  *within* the digestive act itself, collapsing the distance between gross and subtle.


  **Heraclitus: ''This world... was ever, is now, and ever shall be: ever-living fire.'':** Both recognize an eternal, self-sustaining
  fire as the principle animating the cosmos and the body. Divergence: Heraclitus speaks of fire as impersonal logos; the
  Śiva Saṃhitā identifies it as the energy (śakti) of a personal divine principle (Śiva).


  **Bhagavad Gītā 15.14: ''I am the fire of digestion in the bodies of all living beings.'':** Both texts attribute digestive
  fire directly to the divine, affirming embodied life as a site of divine presence. Divergence: The Gītā frames this within
  Kṛṣṇa''s declaration of omnipresence; the Śiva Saṃhitā emphasizes the subtle-body anatomy and the possibility of householder
  liberation through yoga practice.'
