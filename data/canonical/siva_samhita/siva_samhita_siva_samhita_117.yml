  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The nadi which is between Ida and Pingala is certainly Sushumna. It has six stages, six forces,1 six lotuses,
  known to the Yogis.
abhyasa: 'Sit quietly and bring awareness to the space between your left and right sides of the body. Without forcing breath
  or visualization, simply notice: is there a sense of a middle channel, a neutral axis? Spend five minutes observing whether
  attention itself can find a ''middle path'' between the dualities you normally perceive (effort and ease, left and right,
  inner and outer). Note what arises.'
