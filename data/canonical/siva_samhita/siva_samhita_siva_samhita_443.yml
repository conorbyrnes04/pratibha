  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Owing to this (vayu) man wanders in the circle of the universe; the Yogis, therefore, do not desire to keep up
  this circulation; all the nadis are bound by eight knots; only this Kundalini can pierce these knots and pass out of the
  Brahmarandhra, and show the way to salvation.
abhyasa: 'Sit quietly and observe your natural breath for a few minutes without changing it. Notice how the breath moves,
  where it seems to circulate, and how it connects to your sense of being ''in motion'' through time and thought. Then ask:
  What would it mean to move *beyond* this circulation rather than merely refining it? Hold this question gently, without
  seeking an answer.'
