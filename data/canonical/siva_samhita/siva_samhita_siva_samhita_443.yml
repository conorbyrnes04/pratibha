  body: Owing to this (vayu) man wanders in the circle of the universe; the Yogis, therefore, do not desire to keep up this
    circulation; all the nadis are bound by eight knots; only this Kundalini can pierce these knots and pass out of the Brahmarandhra,
    and show the way to salvation.
