abhyasa: 'Sit quietly and visualize three luminous rivers flowing within your spine: the Ganges (cool,
  silver-white) on your left, the Jamuna (warm, golden) on your right, and between them the Saraswati
  (radiant, translucent) ascending from your base to the crown. Breathe gently and sense these channels
  as unified at your heart center. Rest there for a few minutes without effort.'
