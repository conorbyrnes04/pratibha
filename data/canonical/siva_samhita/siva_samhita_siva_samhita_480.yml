translation: All his stores of sins are at once verily destroyed.
abhyasa: 'Sit quietly and notice a habitual guilt or regret you carry. Rather than trying to resolve or
  forgive it mentally, observe it as a *thing* separate from your awareness—a stored impression. Breathe
  into that space between witness and impression. Ask: what if this were not *me*, but a pattern I observe?
  Hold that distinction for five minutes without trying to change anything.'
