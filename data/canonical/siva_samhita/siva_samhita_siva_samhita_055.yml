  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Since in time this manifold universe takes its origin, therefore, there is One who is verily
  the Self, unchanging through all times. Who is one, and unthinkable.
abhyasa: Sit quietly and observe one changing phenomenon (breath, sensation, thought). Notice how you
  are aware of it changing. Rest attention on the awareness itself—the unchanging witness of change. Do
  not strain to define or grasp it; simply notice its presence as the background of all experience.
