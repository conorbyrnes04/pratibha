translation: Whatever object the Yogi perceives, let him consider it to be the spirit. When the modes
  of action of various senses are known, then they can be conquered.
abhyasa: 'Today, choose one ordinary object you encounter—a cup, a stone, a person''s face. Pause and
  ask: what perceives this? What remains aware before the senses report their data? Rest in that question
  without forcing an answer. Notice how the quality of perception shifts when you inquire into the perceiver
  rather than grasping at the perceived.'
