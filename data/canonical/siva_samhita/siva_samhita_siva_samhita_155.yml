  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who devoted to any knowledge, while pleasing his Guru with every attention, readily obtains
  the fruit of that knowledge.
abhyasa: Today, identify one person from whom you are learning (formally or informally). Bring conscious
  attention to one interaction with them—listen without planning your response, notice what you might
  offer them rather than what you might extract. Observe what shifts in your understanding when devotion
  replaces transaction.
