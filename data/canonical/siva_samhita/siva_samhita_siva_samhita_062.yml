translation: This world appears in three different aspects to men - either friendly, inimical, or indifferent;
  such is always found in worldly dealing; there is distinction also in substances, as they are good,
  bad or indifferent.
abhyasa: 'Today, notice one interaction or object that you habitually label as friendly, hostile, or neutral.
  Pause and ask: What remains if I release that judgment? This is not about becoming indifferent, but
  observing how the mind constructs these categories—a first step toward the non-dual perspective the
  text points toward.'
