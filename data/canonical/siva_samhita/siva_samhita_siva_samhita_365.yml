  collection: Śiva Saṃhitā
  category: yoga
  chapter: On the Fruits of Yoga
  verse: '5.51'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Stretching himself on the ground, let him contemplate on this light; by so doing all his
  weariness and fatigue are destroyed. By contemplating on the back part of his head, he becomes the conqueror
  of death. (We have described before the effect of fixing one's attention on the space between the two
  eyebrows, so it need not be enumerated here).
abhyasa: Today, after settling in a comfortable seated position, spend 3–5 minutes with gentle attention
  on the space between your eyebrows (the ājñā cakra region). Notice any subtle sensations—warmth, light,
  pressure, or spaciousness—without forcing. Simply return attention there when the mind wanders. Observe
  how this simple act affects your sense of ease or fatigue.
