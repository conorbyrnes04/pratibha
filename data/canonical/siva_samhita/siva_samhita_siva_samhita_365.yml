  body: Stretching himself on the ground, let him contemplate on this light; by so doing all his weariness
    and fatigue are destroyed. By contemplating on the back part of his head, he becomes the conqueror
    of death. (We have described before the effect of fixing one's attention on the space between the
    two eyebrows, so it need not be enumerated here).
