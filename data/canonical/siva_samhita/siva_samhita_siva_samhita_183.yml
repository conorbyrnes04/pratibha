  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In the first stage of pranayama, the body of the Yogi begins to perspire. When it perspires,
  he should rub it well, otherwise the body of the Yogi loses its dhatu (humours). The second and third
  stages.
abhyasa: After any breathing practice today, notice where warmth or moisture arises on your skin. Rather
  than immediately wiping it away, pause and gently massage it back into the body with awareness—a small
  gesture of honoring the body's own intelligence and effort in the work of practice.
