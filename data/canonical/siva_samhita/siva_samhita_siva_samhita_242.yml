  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: (Then imagine that) - There go up through the sushumna vessel, three bodies in their due
  order (i.e., the etheric, the astral and the mental bodies). There is emitted in every chakra the nectar,
  the characteristic of which is great bliss. Its colour is whitish rosey (pink), full of splendor, showering
  down in jets the immortal fluid. Let him drink this wine of immortality which is divine, and then again
  enter the Kula {i.e., perineal space.) Note. While these subtle bodies go up, they drink at every stage
  this nectar, called Kulamrita.
abhyasa: Sit quietly and visualize a luminous channel running from the base of your spine to the crown.
  As you inhale, imagine three subtle forms (etheric, astral, mental) rising upward through this channel.
  At each pause, sense a rosy-white nectar appearing—cool, sweet, blissful—and imagine drinking it. Then
  exhale and return to stillness at the base. Repeat 3–5 times, attending to any sensation of calm or
  inner sweetness.
