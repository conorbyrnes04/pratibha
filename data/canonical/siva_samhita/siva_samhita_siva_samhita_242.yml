  body: (Then imagine that) - There go up through the sushumna vessel, three bodies in their due order
    (i.e., the etheric, the astral and the mental bodies). There is emitted in every chakra the nectar,
    the characteristic of which is great bliss. Its colour is whitish rosey (pink), full of splendor,
    showering down in jets the immortal fluid. Let him drink this wine of immortality which is divine,
    and then again enter the Kula {i.e., perineal space.) Note. While these subtle bodies go up, they
    drink at every stage this nectar, called Kulamrita.
