abhyasa: Sit quietly and bring awareness to the base of your spine. Silently intone or visualize the syllable
  'aim' there, noticing any subtle vibration, warmth, or quality of presence. Observe how sound, even
  internal sound, connects you to your physical foundation. Return to this for a few minutes without forcing.
