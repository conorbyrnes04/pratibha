translation: From the akasa emanated the air; from the air came the fire; from fire - water; and from
  water came the earth. This is the order of subtle emanation.
abhyasa: 'Sit quietly and trace this sequence in reverse: feel your weight (earth), sense moisture or
  flow in the body (water), notice warmth or energy (fire), observe the movement of breath (air), and
  rest in the spaciousness in which all sensation occurs (ākāśa). This simple contemplation connects your
  embodied experience to the cosmological order.'
