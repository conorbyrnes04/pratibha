title: From the akasa emanated the air;
unit_type: verse
commentary: 'The passage presents a classical Hindu cosmological sequence of elemental emergence, moving
  from the most subtle (ākāśa, space/ether) to the most gross (earth). This order reflects the Śiva Saṃhitā''s
  non-dual metaphysics: creation unfolds not as external manufacture but as progressive densification
  of a single principle. Understanding this sequence grounds the yogi''s practice, since the subtle body
  and prāṇa work within these same elements—mastering them inwardly mirrors the structure of manifestation
  itself.



  Key Terms



  **ākāśa** — Space or ether; the subtlest element from which all others emanate, associated with sound
  and the void of possibility.

  **subtle emanation (sūkṣma-sṛṣṭi)** — The ordered unfolding of elements from finer to grosser states,
  foundational to understanding both cosmos and the subtle body in yoga.



  Cross-Tradition Resonances



  **Taittirīya Upaniṣad (II.1):** Both texts describe elemental emergence in hierarchical order, grounding
  metaphysics in a knowable sequence from subtle to gross. Divergence: The Upaniṣad emphasizes brahman
  as the source and ground; the Śiva Saṃhitā focuses on the practical implication for the yogi''s inner
  work.


  **Empedocles (Greek, 5th c. BCE):** Both propose that reality is composed of primary elements in ordered
  relationship, not as arbitrary but as intelligible structure. Divergence: Empedocles treats elements
  as eternal and equal; the Śiva Saṃhitā presents a hierarchy of subtlety and causal dependence.


  **Samkhya Kārikā (verse 22-23):** Both traditions map the evolution of gross from subtle principles,
  supporting a non-dualist metaphysics of manifestation. Divergence: Samkhya emphasizes prakṛti''s mechanical
  unfoldment; the Śiva Saṃhitā integrates this into a path of direct realization through embodied practice.'
