translation: Only the siddha knows the importance of these three and no one else; knowing these, the practitioner
  obtains all success.
abhyasa: 'Today, notice one moment where you sense the difference between knowing something *about* your
  breath or body versus directly experiencing it. Sit quietly for five minutes and observe your breath
  without trying to change it—not as concept, but as lived sensation. This small distinction mirrors the
  passage''s point: the siddha''s knowledge is participatory, not distant.'
