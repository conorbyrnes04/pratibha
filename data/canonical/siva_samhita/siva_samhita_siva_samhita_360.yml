translation: If the experienced Yogi thinks of this light day and night, he sees the Siddhas (adepts1),
  and can certainly converse with them.
abhyasa: Today, after a period of steady breath awareness or meditation, notice any subtle luminosity
  in your inner field—whether as light behind the eyes, in the heart region, or as a quality of awareness
  itself. Rather than grasping for visions, simply rest attention there for a few minutes each morning
  and evening. Observe without expectation what shifts in your sense of presence.
