title: He who performs the funeral rites of his ancestors…
unit_type: verse
commentary: 'This passage teaches that ritual action at a sacred place (the confluence of three rivers,
  traditionally the Ganges, Yamuna, and the hidden Sarasvatī) generates liberation both for the living
  performer and for deceased ancestors. The Śiva Saṃhitā, despite its emphasis on internal yoga practice
  and non-dual realization, here affirms the efficacy of external ritual—suggesting that householder duties
  and devotional acts are not obstacles to the highest end, but genuine means. The ''junction'' itself
  carries symbolic weight: a place where waters merge mirrors the non-dual realization the text elsewhere
  teaches.



  Key Terms



  **Triveni** — The confluence of three sacred rivers; in this passage, a place where ritual action bears
  fruit for both the living and the ancestors.

  **highest end** — Liberation or mokṣa; the ultimate spiritual goal affirmed in the Śiva Saṃhitā as attainable
  through practice and right action.



  Cross-Tradition Resonances



  **Bhagavad Gītā 3.11 (duty and the divine):** Both passages affirm that ritual and duty (here, honoring
  ancestors) are valid paths aligned with cosmic order and liberation, not mere worldly entanglement.
  Divergence: The Gītā emphasizes duty performed without attachment to results; this passage suggests
  the ritual itself directly procures salvation, implying a more direct causal link.


  **Confucian filial piety (Analects):** Both traditions teach that honoring and performing rites for
  ancestors is foundational to spiritual and moral life, benefiting both the living and the dead. Divergence:
  Confucianism grounds ancestor veneration in social harmony and virtue; the Śiva Saṃhitā locates it within
  a non-dual metaphysical framework where liberation is the ultimate fruit.


  **Ecclesiastes 12:7 (return and continuity):** Both acknowledge that the living and dead remain bound
  in a shared spiritual economy; actions in one realm affect the other. Divergence: Ecclesiastes emphasizes
  the mystery and unknowability of the afterlife; this passage offers a clear mechanism—ritual at a sacred
  place—by which the living can aid the dead.'
