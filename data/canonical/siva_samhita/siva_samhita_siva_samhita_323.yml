  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: '"Keep the company of the virtuous, and avoid that of the vicious" (is a mistaken notion). Measuring the heaviness
  and lightness of the inspired expired air (is an erroneous idea).'
abhyasa: Today, notice one moment when you automatically judge someone as 'virtuous' or 'vicious,' and pause. Then, in a brief
  sitting, observe your breath without counting or measuring it—simply feel the quality of the prāṇa moving through you. What
  shifts when you release the need to categorize and quantify?
