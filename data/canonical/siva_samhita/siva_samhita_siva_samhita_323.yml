title: Keep the company of the virtuous, and avoid that of…
unit_type: verse
commentary: 'This passage challenges two common misconceptions about the yogic path: first, that moral company alone determines
  spiritual progress, and second, that mechanical breath-counting constitutes genuine prāṇāyāma. The text suggests that liberation
  transcends social virtue and technical measurement—pointing toward a non-dual understanding where the practitioner''s direct
  realization of prāṇa (life-force) matters more than external conduct or quantified breath. This reflects the Śiva Saṃhitā''s
  radical affirmation that even householders, embedded in ordinary life, may awaken.



  Key Terms



  **prāṇa** — Life-force or vital energy; in yoga, the animating breath and subtle power that moves through the body and cosmos

  **prāṇāyāma** — Regulation or expansion of prāṇa through breath practices; here, distinguished from mere mechanical breath-counting



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''yoga is skill in action''):** Both texts suggest that outer conduct and technique are not the essence
  of spiritual work; what matters is inner realization and equanimity. Divergence: The Gītā emphasizes duty (dharma) and right
  action; the Śiva Saṃhitā dismisses even virtue-seeking as a potential obstacle to non-dual insight.


  **Meister Eckhart (''God is not found in the soul by adding anything but by a process of subtraction''):** Both reject accumulation—whether
  of moral credit or technical achievement—as the path to liberation. Divergence: Eckhart speaks of Christian union with God;
  the Śiva Saṃhitā frames it as recognition of non-dual Śiva-consciousness already present.


  **Zhuangzi, ''Useless Tree'' chapter (purposelessness as freedom):** Both suggest that letting go of utility and measurement
  opens a truer way. Divergence: The Zhuangzi emphasizes wu-wei (non-action); the Śiva Saṃhitā prescribes specific prāṇāyāma
  and mudrā practices, just not reduced to counting.'
