  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: 'Let him contemplate on his own reflection in the sky as beyond the Cosmic Egg: in the manner previously described.
  Through that let him think on the Great Void unceasingly.'
abhyasa: Sit quietly and imagine your reflection appearing in the clear sky above you. Rather than holding it as a solid image,
  allow it to become increasingly transparent and luminous, as if it exists in space itself. Then gently release the image
  entirely and rest attention in the open, boundless sky—the Great Void—for several minutes. Notice what remains when the
  reflection dissolves.
