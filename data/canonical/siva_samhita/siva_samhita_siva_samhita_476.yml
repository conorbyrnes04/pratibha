title: Let him contemplate on his own reflection in the…
unit_type: verse
commentary: 'This passage instructs the practitioner to use visualization of one''s own reflection in the sky—positioned beyond
  the cosmic order itself (the Cosmic Egg)—as a gateway to contemplating the Great Void, the undifferentiated ground of manifestation.
  The method is paradoxical: the individual self-image becomes a threshold for dissolving into what transcends all form. This
  reflects the non-dual teaching that liberation lies not in rejecting the self, but in recognizing it as inseparable from
  the infinite emptiness that precedes and pervades all existence.



  Key Terms



  **Cosmic Egg** — In Hindu cosmology, the primordial sphere containing the manifest universe; here, the boundary of all conditioned
  existence that the practitioner is invited to transcend.

  **Great Void** — The undifferentiated, infinite emptiness or ground-consciousness that underlies and pervades all manifestation;
  the ultimate reality toward which contemplation is directed.



  Cross-Tradition Resonances



  **Tao Te Ching 1: ''The Tao that can be named is not the eternal Tao. The nameless is the beginning of heaven and earth.'':**
  Both texts point to an ultimate reality beyond conceptual grasp, accessed through contemplative surrender rather than intellectual
  knowing. Divergence: The Tao Te Ching emphasizes the paradox of naming; the Śiva Saṃhitā uses the self-image as a positive
  stepping-stone, whereas Taoist teaching often counsels non-action and non-grasping from the outset.


  **Upaniṣads (e.g., Māṇḍūkya): ''Ātman is Brahman''—the individual self is identical with the infinite ground.:** Both affirm
  non-dual identity; the Śiva Saṃhitā''s use of personal reflection to access the Void echoes the Upaniṣadic collapse of subject-object
  duality. Divergence: The Upaniṣads often teach through negation (''neti neti''—not this, not this); this passage uses positive
  visualization as a method, suggesting the body and imagination are valid yogic tools.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both suggest that the perceiver
  and the perceived ultimate reality are not separate; contemplation reveals their identity. Divergence: Eckhart emphasizes
  divine personhood and grace; the Śiva Saṃhitā speaks of an impersonal Void and systematic yogic technique.'
