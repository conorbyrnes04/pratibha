abhyasa: Today, reflect on one quality from the list—steadiness, truthfulness, courage, or sympathy—and
  notice where you embody it and where you fall short. Without judgment, simply observe how that quality
  (or its absence) shapes your attention and your relationships. This is a preparation for any deeper
  practice.
