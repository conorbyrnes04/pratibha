  body: Steady minded, knowing the Laya-Yoga, independent, full of energy, magnanimous, full of sympathy,
    forgiving, truthful, courageous, full of faith, worshippers of the lotus-feet of their Gurus, engaged
    always in the practice of Yoga - know such men to be adhimatra. They obtain success in the practice
    of Yoga within six years, and ought to be initiated in hathayoga and its branches. (The most ardent)
    entitled to all Yogas.
