unit_label: Chapter 3 — 7
title: The seat of the Prana is the heart;
unit_type: verse
commentary: 'This passage maps the five primary vital winds (vāyus) to specific bodily locations, establishing
  a foundational anatomy for understanding how prāṇa—the life force—circulates and functions within the
  subtle body. Rather than treating the body as inert matter, the Śiva Saṃhitā presents it as an intelligent
  field of energetic currents, each with distinct functions and seats. This localization is not merely
  anatomical but soteriological: knowing where these forces dwell is the first step toward directing them
  consciously toward liberation.



  Key Terms



  **Prāṇa (and the five vāyus)** — The vital life force; here differentiated into five primary winds (prāṇa,
  apāna, samāna, udāna, vyāna), each governing specific physiological and energetic functions and residing
  in particular regions of the body.

  **Nāḍīs** — Subtle energy channels through which prāṇa flows; the passage does not name them explicitly
  but presumes their existence as the pathways for these five winds.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Praśna Upaniṣad 3.5–7):** Both texts locate prāṇa in the heart and describe the five
  vāyus as governing different bodily functions and regions, establishing a shared classical framework
  for understanding vital energy. Divergence: The Upaniṣads emphasize prāṇa''s connection to consciousness
  and the Self more explicitly; the Śiva Saṃhitā is more systematically technical about localization and
  yogic manipulation of these forces.


  **Taoist internal alchemy (e.g., Secret of the Golden Flower):** Both traditions map subtle energies
  to specific body centers and teach that conscious circulation of these forces leads to transformation
  and liberation. Divergence: The Taoist system emphasizes the lower dantian and microcosmic orbit; the
  Śiva Saṃhitā''s five-wind model is distinct, and its non-dual metaphysical frame differs from Taoist
  cosmology.


  **Aristotle, De Anima (on pneuma):** Both posit a vital principle (pneuma/prāṇa) distributed throughout
  the body as the animating force, rejecting pure materialism. Divergence: Aristotle''s pneuma is a single
  unified principle; the Śiva Saṃhitā differentiates five distinct winds with separate seats and functions,
  reflecting a more nuanced energetic anatomy.'
