translation: The seat of the Prana is the heart; of the apana, the anus; of the samana, the region above
  the navel; of the udana, the throat; while the vyana moves all over the body.
abhyasa: 'Sit quietly and bring gentle awareness to each location in turn: the heart (seat of prāṇa),
  the lower abdomen and pelvic floor (apāna), the navel region (samāna), the throat (udāna), and finally
  sense the vyāna as a subtle current flowing through your whole body. Do not force; simply notice. This
  simple mapping can deepen your felt sense of the body as a living system of movement and intelligence.'
practice: 'Sit quietly and bring gentle awareness to each location in turn: the heart (seat of prāṇa),
