commentary: 'The Śiva Saṃhitā opens by claiming its own teaching as a sacred transmission—not a public
  doctrine, but one reserved for the spiritually mature and devoted. This framing establishes yoga not
  as technique available to all, but as esoteric knowledge guarded by lineage and worthiness. The invocation
  of ''three worlds'' (the classical cosmological span) suggests the teaching''s universal relevance,
  yet its secrecy paradoxically marks it as precious precisely because it demands preparation and grace
  to receive.



  Key Terms



  **Yoga Shastra** — A systematic treatise or authoritative teaching on yoga; here, the Śiva Saṃhitā itself,
  presented as sacred doctrine.

  **three worlds** — In classical Hindu cosmology, the realms of heaven, earth, and the underworld; used
  here to indicate the universal scope of the teaching.



  Cross-Tradition Resonances



  **Kena Upaniṣad, opening:** Both texts begin by asserting that their teaching is not ordinary knowledge
  but requires spiritual readiness and a qualified teacher. Divergence: The Kena Upaniṣad poses a question
  (''By whom impelled?''), inviting inquiry; the Śiva Saṃhitā declares itself as secret doctrine, emphasizing
  guardianship over mystery.


  **Bhagavad Gītā 4.3 (Krishna to Arjuna):** Krishna similarly frames his teaching as ''secret knowledge''
  (guhyam) revealed only to a devoted disciple, establishing the guru-śiṣya bond. Divergence: The Gītā
  reveals its secret to Arjuna in a moment of crisis and doubt; the Śiva Saṃhitā presents secrecy as an
  intrinsic feature of the doctrine itself, not circumstantial.'
