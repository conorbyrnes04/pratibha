translation: Therefore, in order that the goddess, who is asleep in the mouth of the Brahmarandhra (the
  innermost hollow of sushumna) be awakened, the mudras should be practiced with the greatest care.
abhyasa: 'Today, sit quietly and place your attention at the crown of your head. Without forcing or visualizing,
  simply notice the quality of awareness there—open, hollow, receptive. Breathe gently and ask: What is
  already awake in me? Return to this inquiry for five minutes, not seeking an answer but deepening the
  question.'
