  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Through love for my devotees, I have revealed this Yoga; it should be kept secret with the
  greatest care, and not be given to everybody.
abhyasa: 'Reflect today on a teaching or skill you have received. Consider: Who gave it to you, and why?
  What made you ready to receive it? How do you now decide with whom to share it? Notice whether generosity
  and discernment can coexist in your own transmission of what you know.'
