title: Its presiding adept is Pinaki, and the Kakini is…
unit_type: verse
commentary: 'This verse describes the heart-lotus (anāhata-cakra) through its presiding deities—Pinaki
  (Śiva in his form as the wielder of the bow) and Kakini (the goddess of this center)—and promises that
  sustained contemplation on this interior lotus attracts celestial favor. The passage suggests that the
  heart-center is not merely a physiological or energetic locus, but a sacred threshold where the meditator''s
  consciousness aligns with divine presence; the ''celestial maidens'' likely represent the ripening of
  grace or the flowering of inner capacities that naturally follow such alignment.



  Key Terms



  **anāhata-cakra (heart-lotus)** — The fourth energy center in the subtle body, located at the heart;
  traditionally associated with love, compassion, and the bridge between lower and higher consciousness.

  **Pinaki** — An epithet of Śiva as the bearer of the bow (pināka); here the presiding masculine principle
  or deity of the heart-center.

  **Kakini** — The presiding goddess (śakti) of the anāhata-cakra; represents the feminine creative power
  governing this center.



  Cross-Tradition Resonances



  **Bhagavad Gītā 12.8–12 (devotion to the formless Brahman):** Both texts affirm that contemplation on
  the divine—whether formless or embodied in a sacred center—draws grace and celestial favor toward the
  practitioner. Divergence: The Gītā emphasizes surrender to a personal deity or the formless absolute;
  the Śiva Saṃhitā localizes this contemplation within the subtle anatomy of the body itself.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both suggest
  an interior threshold where human consciousness and divine presence meet and recognize each other, transforming
  the contemplator. Divergence: Eckhart speaks of the eye of the soul in purely metaphysical terms; the
  Śiva Saṃhitā maps this meeting onto a specific energetic center within embodied practice.


  **Sufi poetry (Hafiz, Rumi): the heart as the seat of divine knowledge and love:** All three traditions
  locate spiritual realization and divine encounter in the heart-center as the seat of direct knowing.
  Divergence: The Śiva Saṃhitā grounds this in a precise subtle-body anatomy and prāṇic circulation; Sufi
  poetry tends toward lyrical, non-anatomical metaphor.'
