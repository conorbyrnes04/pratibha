abhyasa: 'Reflect today on what you most value—time, skill, security, comfort—and consider: what would
  it mean to offer that with full sincerity to a teacher or guide you trust? Not necessarily to give it
  away, but to examine whether you hold it loosely enough that you could, if wisdom required it. Notice
  what resistance arises.'
