  label: Translation
  body: The first condition of success is the firm belief that it (vidya) must succeed and be fruitful;
    the second condition is having faith in it; the third is respect towards the Guru; the fourth is the
    spirit of universal equality; the fifth is the restraint of the organs of sense; the sixth is moderate
    eating, these are all. There is no seventh condition.
