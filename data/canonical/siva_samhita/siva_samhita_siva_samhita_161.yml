  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The first condition of success is the firm belief that it (vidya) must succeed and be fruitful;
  the second condition is having faith in it; the third is respect towards the Guru; the fourth is the
  spirit of universal equality; the fifth is the restraint of the organs of sense; the sixth is moderate
  eating, these are all. There is no seventh condition.
abhyasa: 'Today, examine one of these six conditions in your own life: Do you genuinely believe your practice
  can bear fruit? Where does your faith waver? Notice without judgment. If faith is present, turn toward
  your teacher or guide (literal or internalized) with a moment of sincere respect. This prepares the
  ground.'
