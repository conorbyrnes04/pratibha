title: When the avidya has an excess of tamas, then it…
unit_type: verse
commentary: 'This passage maps the manifest divine forms (Durgā and Lakṣmī) to qualities of avidyā—fundamental
  ignorance—rather than treating them as separate cosmic powers. By grounding both goddesses in avidyā''s
  modulations through the guṇas (tamas and sattva), the text suggests that even revered deities emerge
  from the play of ignorance and its qualities, and that the presiding intelligence (Īśvara) differs according
  to which guṇa dominates. This non-dual teaching dissolves a hierarchy of worship into a unified metaphysical
  account: all forms arise from one root, colored by the predominant quality of prakṛti.



  Key Terms



  **avidyā** — Fundamental ignorance or nescience; the root condition from which all limited forms and
  experiences arise in non-dual Śaiva metaphysics.

  **guṇas (tamas, sattva)** — The three qualities or modes of prakṛti (nature): tamas is inertia, darkness,
  contraction; sattva is luminosity, harmony, and clarity.

  **Īśvara** — The presiding intelligence or consciousness associated with a particular manifestation;
  here, the aware principle that governs each divine form.



  Cross-Tradition Resonances



  **Advaita Vedānta (Śaṅkara): Brahman as the sole reality; māyā as the veiling power:** Both traditions
  locate multiplicity (gods, forms, worlds) within a single non-dual ground and attribute apparent division
  to ignorance or illusion. Divergence: The Śiva Saṃhitā emphasizes the guṇas and subtle body as the mechanism
  of manifestation, whereas Advaita focuses more on the logical contradiction between appearance and reality.


  **Sāṃkhya: prakṛti''s three guṇas as the basis of all manifestation:** Both texts use the guṇa framework
  to explain how one root (prakṛti or avidyā) generates diverse forms through the dominance of different
  qualities. Divergence: Sāṃkhya treats prakṛti and puruṣa as eternally distinct principles; the Śiva
  Saṃhitā, as a non-dual text, ultimately dissolves this duality into Śiva''s consciousness.


  **Bhagavad Gītā 10.8: ''I am the source of all spiritual and material worlds'':** Both passages locate
  all manifest forms—including deities—as expressions of a single supreme principle. Divergence: The Gītā
  emphasizes Kṛṣṇa''s personal transcendence and lordship; the Śiva Saṃhitā emphasizes the impersonal
  mechanism (guṇas and avidyā) through which forms arise.'
