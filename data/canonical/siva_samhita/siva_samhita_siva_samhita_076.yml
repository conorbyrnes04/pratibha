  body: 'When the avidya has an excess of tamas, then it manifests itself as Durga: the intelligence which
    presides over her is called Isvara. When the avidya has an excess of sattva, it manifests itself as
    the beautiful Lakshimi; the Intelligence which presides over her is called Vishnu.'
