  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: 'When the avidya has an excess of tamas, then it manifests itself as Durga: the intelligence
  which presides over her is called Isvara. When the avidya has an excess of sattva, it manifests itself
  as the beautiful Lakshimi; the Intelligence which presides over her is called Vishnu.'
abhyasa: 'Observe today one moment of fear or contraction (tamas-tinged) and one moment of beauty or harmony
  (sattva-tinged). Rather than judging them as good or bad, notice how both arise within your own awareness.
  Ask: what intelligence witnesses both? This simple inquiry mirrors the passage''s invitation to see
  the presiding consciousness behind all qualities.'
