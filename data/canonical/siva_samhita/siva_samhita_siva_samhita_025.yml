  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Even in heaven there is experiencing of pain by seeing the higher enjoyment of others; verily, there is no doubt
  of it that this whole universe is full of sorrow.
abhyasa: 'Today, notice one moment when you experience lack or dissatisfaction by comparing your state to someone else''s
  (real or imagined). Pause and observe: does the comparison itself create the suffering, or only the circumstance? Sit with
  this distinction without trying to fix it.'
