  body: The other nadis, rising from <Muladhar>, go to the various parts of the body, e.g. the tongue,
    penis, eyes, feet, toes, ears, the abdomen, the armpit, fingers of the hands, the scrotum and the
    anus. Having risen from their proper place, they stop at their respective destinations, as above described.
