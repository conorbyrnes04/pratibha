title: Bound in the chain of matter by their karma, the…
unit_type: verse
commentary: 'This passage articulates the classical yoga metaphysics of karma and rebirth: individual souls (jivas) are bound
  by the consequences of their own actions, cycling through existence until liberation is realized. The language of ''chain''
  and ''matter'' suggests that karmic bondage is not punishment imposed from outside, but rather the natural structure of
  embodied existence—a teaching that grounds the Śiva Saṃhitā''s later affirmation that even householders can awaken to freedom.
  The passage establishes why practice matters: without understanding and transcending this cycle, the jiva remains trapped
  in repetition.



  Key Terms



  **jiva** — The individual soul or conscious being, bound by karma and matter, distinct from but ultimately inseparable from
  Śiva (in non-dual view).

  **karma** — Action and its natural consequences; the law by which deeds shape future experience and rebirth.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47:** Both texts teach that action and its fruit are inseparable; karma binds the unaware actor to the
  cycle of return. Divergence: The Gītā emphasizes right action and duty (dharma) as the path within the world; the Śiva Saṃhitā
  emphasizes yoga and transcendence of action itself.


  **Dhammapada, verse 1:** Both traditions teach that mind and intention shape one''s experience; repeated patterns of thought
  and deed create bondage. Divergence: The Dhammapada frames this in terms of mental conditioning and suffering; the Śiva
  Saṃhitā situates it within a metaphysics of subtle bodies and kundalinī awakening.'
