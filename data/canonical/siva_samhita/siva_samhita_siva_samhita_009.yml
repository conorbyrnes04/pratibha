  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Others, wiser among many, and eagerly devoted to the investigation of the occult, declare that the souls are
  many and eternal, and omnipresent. I I. Others say, "Only those things can be said to exist which are perceived by the senses
  and nothing besides them; where is heaven or hell?" Such is their firm belief.
abhyasa: 'Sit quietly and notice: what do you assume must exist to be ''real''? Observe whether you trust only what your senses
  report, or whether you sense something in yourself (awareness, continuity, presence) that persists beyond sensory objects.
  Do not conclude; simply notice the texture of your own conviction.'
