  label: Translation
  body: Others, wiser among many, and eagerly devoted to the investigation of the occult, declare that
    the souls are many and eternal, and omnipresent. I I. Others say, "Only those things can be said to
    exist which are perceived by the senses and nothing besides them; where is heaven or hell?" Such is
    their firm belief.
