title: Since it is not illuminated by another, therefore…
unit_type: verse
commentary: 'This passage articulates a foundational non-dual insight: the Self (Ātman/Brahman, here called ''Spirit'') requires
  no external source of illumination because it is intrinsically luminous—self-aware and self-revealing. The logic is elegant:
  what would illuminate the Self must itself be known, creating infinite regress; therefore, consciousness itself must be
  self-evident. This grounds the entire yogic path in the recognition that liberation is not acquisition but the unveiling
  of what already is.



  Key Terms



  **self-luminous (svayaṃ-prakāśa)** — The quality of consciousness that is self-revealing and self-aware, requiring no external
  source of knowledge or illumination.

  **Spirit (Brahman/Ātman)** — The ultimate, non-dual reality; the innermost Self whose nature is pure consciousness and light.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kena Upaniṣad 1.6):** Both affirm that Brahman is self-knowing and cannot be objectified; it is the eternal
  subject, never object. Divergence: The Upaniṣads often use negation (''neti neti''—not this, not this) to approach the Self,
  while this passage uses positive assertion of luminosity.


  **Meister Eckhart, ''God is a pure nothingness'':** Both reject the need for external mediation; the divine/ultimate is
  immediately present as the ground of knowing itself. Divergence: Eckhart emphasizes divine transcendence and emptiness,
  while the Śiva Saṃhitā emphasizes the fullness and light of consciousness.


  **Heraclitus, Fragment 30 (on the cosmic fire/logos):** Both posit an eternal, self-sustaining principle of illumination
  and order that does not depend on external cause. Divergence: Heraclitus speaks of cosmic flux and becoming; the Śiva Saṃhitā
  points to unchanging, self-luminous consciousness.'
