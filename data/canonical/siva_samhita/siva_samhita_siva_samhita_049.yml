  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Since it is not illuminated by another, therefore it is self-luminous; and for that self-luminosity, the very
  nature of Spirit is Light.
abhyasa: 'Sit quietly for five minutes. Notice the awareness that observes your breath, sensations, and thoughts—the ''witness''
  that requires no external light to know itself. Rest attention there, without trying to change or perfect it. This simple
  noticing embodies the passage''s claim: awareness illuminates itself.'
