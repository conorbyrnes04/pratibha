  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the mind is steadily fixed at this place, which is the residence of the Great Swan and
  is called Kailas, then that Yogi, devoid of disease and subduing all accidents, lives for a great age,
  free from death.
abhyasa: 'Sit quietly and bring your awareness to the crown of the head or the space just above it. Without
  forcing, gently rest your attention there for a few minutes, imagining it as a luminous, still place—a
  refuge within your own being. Notice what arises: steadiness, spaciousness, or simply the quality of
  turning inward. Return to this place whenever the day''s turbulence pulls you outward.'
