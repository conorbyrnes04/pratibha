translation: Siva. Hear, O Goddess! I shall tell thee, all the obstacles that stand in the path of Yoga.
  For the attainment of emancipation, enjoyments (bhoga) are the greatest of all impediments. Bhoga (enjoyment).
abhyasa: 'Today, notice one moment of sensory pleasure (taste, comfort, beauty, approval). Rather than
  rejecting it, pause and observe: What draws my attention *outward* in this moment? What would it feel
  like to experience the same sensation without grasping for it to continue? This is not renunciation,
  but recognition.'
