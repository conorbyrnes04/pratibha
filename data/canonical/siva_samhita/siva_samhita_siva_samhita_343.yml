translation: When the mind of the Yogi is exceedingly engaged in this sound, he forgets all external things,
  ad is absorbed in this sound.
abhyasa: Today, sit quietly for 5–10 minutes and listen inwardly to the ambient sound around you—not analyzing
  it, but resting your attention on it as a unified field. Notice how, as your mind settles into listening
  rather than thinking, external concerns naturally recede. This is a gentle entry into the principle
  the passage names.
