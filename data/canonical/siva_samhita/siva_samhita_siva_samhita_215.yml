  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When having firmly closed the glottis by the proper yogic method, and contemplating on the goddess Kundalini,
  he drinks (the moon fluid of immortality), he becomes a sage or poet within six months.
abhyasa: 'Today, sit quietly and place gentle awareness at the base of your spine. Without forcing breath, notice the natural
  rhythm of inhalation and exhalation for 5–10 minutes. Simply acknowledge: there is energy here, dormant or flowing. This
  is not technique, but an invitation to recognize what the text calls Kuṇḍalinī—not as exotic, but as your own vital presence.
  Return to this recognition whenever you remember.'
