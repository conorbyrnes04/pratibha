translation: We have already described the beginning of Arambha-avestha of pranayama; the rest will be
  described hereafter. They destroy all sin and sorrow.
abhyasa: Today, notice one moment of deliberate, conscious breathing—whether a few counted breaths or
  a natural pause. Without forcing, observe whether that moment of attention to breath creates any small
  shift in your inner state. This simple noticing honors the passage's claim that breath practice touches
  something real in us.
