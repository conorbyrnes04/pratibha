title: When, by the practice of pranayama, the Yogi…
unit_type: verse
commentary: 'The passage uses the metaphor of the water-jar (ghata) to describe a threshold state achieved
  through breath-control practice—a point where the practitioner''s individual will aligns with universal
  possibility. The claim is radical: at this stage, nothing remains impossible. This suggests that pranayama
  is not merely a physical technique but a means of dissolving the boundary between the limited self and
  the boundless field of potential, making the yogi an instrument of universal power rather than a separate
  agent struggling against circumstance.



  Key Terms



  **ghata** — Literally ''water-jar'' or ''pot''; in this context, a stage of yogic attainment where the
  individual consciousness becomes a transparent vessel, no longer obstructing the flow of universal energy
  or will.

  **pranayama** — Regulation and extension of vital breath (prana) through controlled breathing practices;
  presented here as the direct means to reach the ghata state.



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both texts point to a paradox: mastery arrives through yielding
  rather than grasping, and the practitioner becomes an empty vessel through which universal principle
  flows. Divergence: The Tao Te Ching emphasizes non-action (wu wei) and withdrawal from the world; the
  Śiva Saṃhitā affirms the householder''s path and the yogi''s capacity to accomplish within the world.


  **Bhagavad Gita 2.47: ''You have a right to perform your prescribed duty, but you are not entitled to
  the fruits of action.'':** Both teach that liberation comes through right practice without attachment
  to outcome, and that the practitioner''s personal will must surrender to a larger order. Divergence:
  The Gita frames this through duty (dharma) and devotion; the Śiva Saṃhitā locates it in the subtle physiology
  and the direct mastery of breath-energy.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  suggest a non-dual recognition where subject and object, practitioner and universal power, collapse
  into a single seeing—the ghata as the transparent point of that unity. Divergence: Eckhart emphasizes
  mystical union through love and detachment from images; the Śiva Saṃhitā grounds realization in the
  energetic body and systematic practice.'
