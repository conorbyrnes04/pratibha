  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When, by the practice of pranayama, the Yogi reaches the state of ghata (water-jar), then
  for him there is nothing in this circle of universe which he cannot accomplish.
abhyasa: 'Today, during a few minutes of conscious breathing, notice the moment when your breath becomes
  steady and your sense of separation from your surroundings softens. Rather than forcing the breath,
  allow it to find its own rhythm. Sit with the question: What shifts in what feels possible when I stop
  resisting and simply observe?'
