translation: Gods like Siva, Brahma, Vishnu, etc., are all seen in the great Spirit; bodies and all material
  objects are the various products of avidya.
abhyasa: 'Today, when you perceive something distinct—a person, an object, a thought—pause and ask: what
  consciousness is aware of this appearance? Rest attention there, without trying to change anything,
  for one or two minutes. Notice whether the sense of separation softens.'
