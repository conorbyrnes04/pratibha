title: The Yakshas, Rakshashas, Gandharvas, Apsaras, and…
unit_type: verse
commentary: 'This verse describes the fruits of yogic mastery: the practitioner who has perfected the
  practices gains command over subtle beings—celestial and semi-divine entities that populate the cosmos
  in Hindu cosmology. The passage suggests that liberation is not merely inner peace but a transformation
  of one''s relationship to all levels of existence; even beings of power become obedient. This affirms
  the non-dual teaching: the realized self recognizes its true nature as the ground of all beings, and
  they respond accordingly.



  Key Terms



  **Yakshas, Rakshasas, Gandharvas, Apsaras, Kinnaras** — Classes of celestial and semi-divine beings
  in Hindu cosmology; their obedience to the yogin symbolizes mastery over all planes of existence, subtle
  and gross.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.29:** Both texts affirm that the yogi perceives all beings as the Self and is established
  in equanimity; the Gītā emphasizes equal vision, while the Śiva Saṃhitā emphasizes command. Divergence:
  The Gītā stresses non-attachment and impartiality; this verse suggests active mastery and obedience
  from other beings.


  **Patañjali''s Yoga Sūtra 3.47–48 (siddhis):** Both texts acknowledge that advanced practice yields
  supernatural powers and dominion; the Śiva Saṃhitā here alludes to such fruits. Divergence: Patañjali
  warns that attachment to siddhis becomes an obstacle; this passage celebrates them as signs of realization
  without explicit caution.'
