translation: As, when the knowledge of the mother-of-pearl is obtained, the erroneous notion of its being
  silver does not remain; so, through the knowledge of spirit, the world always appears a delusion.
abhyasa: 'Today, notice one moment when you mistake appearance for reality—a shadow for a threat, a thought
  for a fact, a mood for your identity. Pause and ask: what would shift if I saw this clearly, as it actually
  is? Let the mother-of-pearl teaching remind you that recognition itself is the medicine.'
