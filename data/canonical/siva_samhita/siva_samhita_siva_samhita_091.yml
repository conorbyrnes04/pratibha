  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When the fruits of karma have been enjoyed, the jiva is absorbed in the Parambrahma.
abhyasa: 'Sit quietly and contemplate: What karmic patterns in your life feel nearly spent—habits, relationships, or obligations
  nearing their natural conclusion? Rather than resist or cling, notice them as movements that will eventually settle. Rest
  awareness in the stillness beneath the motion, as a simple experiment in recognizing what persists when particular fruits
  fall away.'
