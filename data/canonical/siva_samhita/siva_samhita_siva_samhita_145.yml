title: The Prana lives there, adorned with various…
unit_type: verse
commentary: 'This passage locates the vital force (prāṇa) within the heart center, describing it as clothed
  in desire, bound by karmic impressions without temporal origin, and identified with the sense of individual
  selfhood (ahaṅkāra). The mention of the seed syllable ''yam'' grounds this metaphysically—the heart
  is not merely a physical organ but a cosmically significant locus where the individual life-force encounters
  its own conditioning. The passage suggests that liberation requires understanding this entanglement:
  prāṇa is not inherently bound, but appears so through desire, karma, and ego-identification.



  Key Terms



  **prāṇa** — The vital life-force or breath-energy that animates the body and mind; in this passage,
  the conscious principle that dwells in the heart, conditioned by desire and karma.

  **ahaṅkāra** — Egoism or the sense of individual ''I''; the identification with a separate self that
  binds prāṇa to cycles of desire and action.

  **yam** — The seed syllable (bīja mantra) associated with the heart center (anāhata cakra) in yogic
  cosmology; represents the element air and the principle of connection.



  Cross-Tradition Resonances



  **Upaniṣads (Kaṭha Upaniṣad 2.3.17):** Both texts locate the self (ātman) in the heart and describe
  it as the source of all vital processes; both treat the heart as the meeting point of individual and
  universal consciousness. Divergence: The Upaniṣads emphasize the heart as the seat of pure consciousness
  beyond conditioning, whereas this passage emphasizes how prāṇa becomes obscured by desire, karma, and
  ego—a more psychological framing of bondage.


  **Bhagavad Gītā 3.27 (prakṛti guṇas binding the ātman):** Both texts describe how the individual self
  becomes entangled in conditioning forces (here, desire and karma; in the Gītā, the three guṇas); both
  imply that liberation requires seeing through this identification. Divergence: The Gītā emphasizes action
  and duty as the path through conditioning, while this passage suggests that understanding the heart''s
  true nature—and the prāṇa''s entanglement—is itself the key.


  **Yoga Sūtra 1.2 (yogaś citta-vṛtti-nirodhah):** Both texts treat yoga as a practice of clarifying consciousness
  by observing how the mind (and vital force) become bound by habitual patterns; both suggest that bondage
  is not essential but conditioned. Divergence: Patañjali''s sūtra emphasizes the cessation of mental
  fluctuations, while this passage emphasizes the heart as a specific energetic and metaphysical center
  where that clarification must occur.'
