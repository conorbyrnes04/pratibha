translation: 'The Prana lives there, adorned with various desires, accompanied by its past works, that
  have no beginning, and joined with egoism (ahankara.) Note: The heart is in the center where there is
  the seed yam.'
abhyasa: 'Sit quietly and place attention at the heart center (center of the chest). Without forcing,
  notice the quality of your breathing there. Observe: what desires, memories, or sense of ''I'' arise?
  Do not judge or change them—simply witness how prāṇa seems to move through layers of conditioning. Return
  gently to the breath whenever attention wanders.'
