translation: Like a bubble in the sea rising through the agitation of the wind, this transitory world
  arises from the Spirit.
abhyasa: 'Sit quietly and observe your breath or a natural process (wind, water, light). Notice how each
  moment arises, persists briefly, and dissolves—like the bubble. Without forcing belief, simply ask:
  *From what does this moment arise? What remains when it passes?* Rest in that question for a few minutes,
  not seeking an answer but cultivating direct attention to the arising and dissolving of experience.'
