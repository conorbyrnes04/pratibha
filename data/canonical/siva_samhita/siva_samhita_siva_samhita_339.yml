  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Yogi, free from sin, and practicing this continually, forgets his physical, subtle and
  causal bodies, and becomes one with that soul.
abhyasa: 'Today, in a quiet moment, notice the three layers of your own being: the physical body you sense,
  the subtle body of breath and emotion you feel, and the causal body of deep sleep or formlessness you
  touch in meditation. Without rejecting any, ask: ''Which of these am I, truly?'' Rest in the awareness
  that observes all three.'
