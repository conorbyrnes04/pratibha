  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Acting upon these methods the great Yogi becomes in the world perfectly independent; and
  freed from all obstacles, he can go everywhere.
abhyasa: 'Reflect today on one habitual obstacle—a fear, a compulsion, a social constraint—that limits
  where you go or what you attempt. Sit quietly and ask: What would change if this obstacle dissolved?
  Not to act recklessly, but to notice how much of your movement through the world is already chosen by
  habit rather than by your own will.'
