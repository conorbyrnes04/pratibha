translation: 'This is the dictum of the Guru: "It destroys old age, death, and troubles innumerable."
  The practitioner of pranayama ought always to meditate upon it; by its very contemplation, the great
  yogi is freed from all sins.'
abhyasa: 'Today, before or during a prāṇāyāma session, pause and ask: What am I actually meditating upon?
  Not just the mechanics of breath, but the principle the Guru names—that this practice touches what is
  deathless in me. Hold that contemplation lightly for one full cycle of breath, noticing what shifts.'
