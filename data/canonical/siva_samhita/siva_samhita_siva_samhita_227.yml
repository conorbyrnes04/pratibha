  body: 'The Siddhasana that gives success to the practitioner is as follows: Pressing with care by the
    heel the yoni, the other heel the Yogi should place on the lingam; he should fix his gaze upwards
    on the space between the two eyebrows, should be steady, and restrain his senses. His body particularly
    must be straight and without any bend. The place should be a retired one, without any noise.'
