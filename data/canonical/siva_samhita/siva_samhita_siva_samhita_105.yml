title: Sushumna, Ida, Pingala, Gandhari, Hastijihvika…
unit_type: verse
commentary: 'The passage enumerates the fourteen principal energy channels (nāḍīs) of the subtle body, then identifies three
  as supreme: Idā, Piṅgalā, and Suṣumnā. This hierarchical ordering reflects a core teaching of the Śiva Saṃhitā: that while
  the subtle anatomy is intricate and multivalent, spiritual practice concentrates on balancing and awakening the central
  channel (Suṣumnā), through which kuṇḍalinī ascends toward liberation. The naming itself—precise, enumerated, unadorned—suggests
  that this is not metaphor but a map of actual energetic anatomy accessible to the practitioner.



  Key Terms



  **nāḍī** — An energy channel in the subtle body through which prāṇa (life force) flows; the Śiva Saṃhitā teaches that there
  are fourteen principal nāḍīs, of which three are primary.

  **Suṣumnā** — The central energy channel running along the spine; considered the most direct pathway for kuṇḍalinī awakening
  and the attainment of liberation.

  **Idā and Piṅgalā** — The left and right energy channels respectively, associated with lunar (cooling, receptive) and solar
  (heating, active) qualities; their balance is prerequisite to opening Suṣumnā.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15 (on the sage perceiving subtle distinctions):** Both texts honor a refined perception of invisible
  forces (ch''i / prāṇa) that structure reality and require disciplined attention to discern. Divergence: The Tao Te Ching
  emphasizes paradox and the limits of naming; the Śiva Saṃhitā provides precise anatomical nomenclature, suggesting the subtle
  body can be mapped and mastered.


  **Upaniṣads (e.g., Katha Upaniṣad, on the path of the wise):** Both affirm that liberation requires knowledge of subtle
  channels and the ascent of consciousness beyond ordinary perception. Divergence: The Upaniṣads speak of nāḍīs more obliquely
  and philosophically; the Śiva Saṃhitā catalogs them systematically as a technical manual for practice.


  **Heraclitus, Fragment 45 (on the hidden harmony):** Both suggest that true order lies beneath surface appearance—the invisible
  channels are more real than the gross body. Divergence: Heraclitus points to paradox and flux; the Śiva Saṃhitā offers a
  stable, mappable system of channels through which transformation occurs.'
