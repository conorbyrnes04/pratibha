abhyasa: 'Sit quietly and bring awareness to the midline of your body, from the base of the spine to the crown of the head.
  Without forcing breath or visualization, simply notice: is your attention drawn more to the left side of your body, the
  right side, or the center? This simple noticing begins to cultivate sensitivity to the channels named in the text.'
