translation: Living in the house amidst wife and children, but being free from attachments to them, practicing
  Yoga in secrecy, a householder even finds marks of success (slowly crowning his efforts), and thus following
  this teaching of mine, he ever lives in blissful happiness.
abhyasa: 'Today, notice one moment of genuine presence with a family member or close companion—a conversation,
  a meal, a task—while observing your own mind: are you truly *there*, or are you grasping, resisting,
  or lost in fantasy about the interaction? Practice being fully attentive without clinging to the outcome
  or person. This is the householder''s yoga.'
