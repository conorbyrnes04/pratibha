  body: Perfect consciousness is gained through practice. Yoga is attained through practice; success in
    Mudra comes by practice; through practice is gained success in pranayama. Death can be cheated of
    its prey through practice, and man becomes the conqueror of death by practice. 1 1. Through practice
    one gets the power of vach (prophecy), and the power of going everywhere, through mere exertion of
    will. This Yoni-mudra should be kept in great secrecy, and not be given to everybody. Even when threatened
    with death, it should not be revealed or given to others. The Awakening of Kundalini.
