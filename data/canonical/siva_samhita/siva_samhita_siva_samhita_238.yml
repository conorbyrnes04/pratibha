  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Place the soles of the feet completely under the thighs, keep the body straight, and sit
  at ease. This is called the Svastikasana.
abhyasa: Sit in this posture for a few minutes today. Notice how the contact of your feet with your thighs
  anchors your attention downward, while the straight spine allows your awareness to rise. Observe whether
  'ease' emerges naturally as stability deepens, without forcing relaxation.
