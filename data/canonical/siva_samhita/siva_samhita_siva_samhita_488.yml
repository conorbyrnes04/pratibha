translation: He who practices this always, is the real passionless Yogi, he never uses the word "I", but
  always finds himself full of atman.
abhyasa: 'Today, notice moments when you instinctively say or think ''I''—''I did this,'' ''I want that,''
  ''I am angry.'' Without judgment, pause and ask: who is observing this ''I''? What remains when that
  claim is released? Rest briefly in that witnessing awareness.'
