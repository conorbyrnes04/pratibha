translation: Of whatever nature is the original desire (vasana), that clings to and accompanies the Jiva
  (through various incarnations); similar is the delusion which it suffers, according to its deeds and
  misdeeds.
abhyasa: 'Sit quietly and notice one recurring desire, fear, or preference that feels ''yours''—something
  you return to across different situations. Rather than judging it, ask: Where did this come from? What
  does it make me believe about myself and the world? Observe it as a guest in consciousness, not as your
  identity. This simple noticing begins to loosen vasana''s grip.'
