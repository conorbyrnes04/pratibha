title: Of whatever nature is the original desire (vasana)…
unit_type: verse
commentary: 'This passage articulates a non-dual teaching on karma and continuity: the individual soul
  (Jiva) is not a blank slate but carries forward its deepest habitual tendencies (vasana) across lives,
  and these tendencies shape both the delusions it experiences and the circumstances it encounters. The
  teaching is neither fatalistic nor random—it is lawful and proportional (''according to its deeds and
  misdeeds'')—yet it also suggests that liberation is possible because vasana, though persistent, is not
  the Jiva''s true nature, only what ''clings to'' it. This grounds the Śiva Saṃhitā''s promise that even
  a householder can awaken: one need not escape the world, but rather see through the vasanas that bind.



  Key Terms



  **vasana** — Original desire; a deep habitual tendency or latent impression that persists through incarnations
  and shapes one''s experience and delusions.

  **Jiva** — The individual soul or embodied self; the conscious being that transmigrates and is subject
  to karma and vasana.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.62–63 (on desire leading to delusion):** Both texts teach that habitual desire (kāma)
  generates delusion and binds the self; both see this as a lawful process, not arbitrary. Divergence:
  The Gītā emphasizes the moment of choice and the power of discrimination in the present; the Śiva Saṃhitā
  stresses the deep continuity of vasana across lifetimes.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa and vairāgya; practice and non-attachment):** Both recognize
  that habitual patterns (saṃskāra/vasana) must be actively countered through sustained practice; both
  imply that the self is not identical to its conditioning. Divergence: Patañjali prescribes a dual path
  of effort and detachment; the Śiva Saṃhitā here simply names the mechanism, leaving the remedy implicit
  in the broader teaching of non-duality.


  **Heraclitus, Fragment 119 (character is destiny):** Both suggest that what we are—our nature or tendency—shapes
  what we encounter and suffer; both imply a lawful, not random, unfolding. Divergence: Heraclitus speaks
  of ethos (character) as immediate and present; the Śiva Saṃhitā locates vasana in a trans-incarnational
  continuum, offering the possibility of transformation across lives.'
