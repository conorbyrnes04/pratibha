title: The brilliancy of the body is increased, the…
unit_type: verse
commentary: 'This passage describes the cascade of benefits that arise from yogic practice—beginning with
  the tangible (bodily radiance, digestive strength, health) and culminating in the transcendent (omniscience).
  The progression suggests that yoga is not merely ascetic negation but a positive transformation of the
  whole person, body and mind unified. The text''s inclusion of ''cleverness'' alongside omniscience hints
  that practical intelligence and ultimate knowledge are not opposed but continuous.



  Key Terms



  **gastric fire (jāṭharāgni)** — In yoga and Āyurvedic thought, the digestive power that metabolizes
  food and, metaphorically, transforms experience into wisdom; its strength is a sign of vital health.

  **omniscience (sarvajñatva)** — Direct, non-dual knowledge of all things; the fruit of yoga practice
  in which the distinction between knower and known dissolves.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sutras, II.28 (yogāṅgānuṣṭhānāt aśuddhi-kṣaye jñāna-dīptir ā viveka-khyāteḥ):**
  Both texts affirm that practice purifies obstacles and brings forth luminous knowledge; the body''s
  transformation is inseparable from liberation. Divergence: Patañjali emphasizes the removal of impurity;
  the Śiva Saṃhitā emphasizes the increase of brilliancy—a positive flowering rather than mere negation.


  **Bhagavad Gītā, II.50 (yoga-yuktaḥ...sukham aśnute):** Both traditions link yoga practice to freedom
  from disease and a state of well-being that transcends ordinary pleasure. Divergence: The Gītā frames
  yoga as equanimity amid action; the Śiva Saṃhitā traces a direct physiological and metaphysical ascent.


  **Upaniṣads (e.g., Taittirīya, on the sheaths of being):** Both recognize that the body is not an obstacle
  to knowledge but a vehicle through which consciousness manifests and is realized. Divergence: The Upaniṣads
  emphasize discrimination between body and ātman; the Śiva Saṃhitā suggests their integration and mutual
  illumination.'
