translation: The brilliancy of the body is increased, the gastric fire becomes powerful, and freedom from
  disease, cleverness, and omniscience ensue.
abhyasa: Today, notice one moment of physical vitality—a clear breath, steady digestion, or ease in movement.
  Rather than taking it for granted, pause and recognize it as a sign of the body's inherent luminosity.
  Let this small observation soften your sense of the body as merely material or separate from consciousness.
