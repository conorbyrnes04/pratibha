translation: Some wise men, well-versed in Scriptures, receiving the knowledge of spirit, have declared
  that even Devas like Indra, etc., are non-eternal, subject to birth and death, and liable to destruction.
abhyasa: 'Today, notice one thing you regard as permanent, powerful, or ''above'' ordinary change (a person,
  institution, achievement, or state of mind). Quietly contemplate: what evidence of impermanence, decay,
  or vulnerability touches even this? Not as pessimism, but as clear seeing. Let this soften any grasping
  toward it.'
