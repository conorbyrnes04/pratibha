  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: As in their proper season, various creatures are born to enjoy the consequences of their
  karma; as through mistake a pearl-shell is taken for silver, so through the taint of one's own karmas,
  a man mistakes Brahman for the material universe.
abhyasa: 'Today, notice one moment when you mistook appearance for reality—a harsh tone for cruelty, a
  setback for failure, a thought for truth. Pause and ask: what conditioning (your own past choices, habits,
  assumptions) shaped that misreading? Not to blame yourself, but to glimpse how karma operates as lens,
  not law.'
