title: As in their proper season, various creatures are…
unit_type: verse
commentary: 'This passage presents karma not as punishment but as the natural fruition of past action—a
  law as regular as seasonal birth. The second image is crucial: just as a pearl-shell''s luster can deceive
  the eye into seeing silver, so too does karmic conditioning veil the perceiver''s true nature (Brahman,
  non-dual reality) beneath apparent multiplicity and materiality. The ''taint'' is not moral stain but
  ignorance born of one''s own actions, which obscures rather than corrupts the Self. Liberation, by this
  logic, requires not redemption but clear seeing.



  Key Terms



  **karma** — action and its natural consequences; here, the conditioning that shapes perception and obscures
  one''s true nature

  **Brahman** — non-dual reality, the ultimate Self; in this passage, what is mistaken for the material
  universe due to karmic veiling

  **taint** — the obscuring effect of one''s own past actions; not moral corruption but ignorance that
  clouds perception



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (karma-yoga teaching):** Both affirm karma as impersonal law of consequence, not
  divine punishment; action naturally yields fruit. Divergence: The Gītā emphasizes right action and duty;
  the Śiva Saṃhitā here stresses how karma veils the Self, making liberation a matter of perception rather
  than ethical conduct.


  **Advaita Vedānta (Śaṅkara): māyā as illusion:** Both use the pearl-shell/silver analogy to show how
  appearance deceives; both locate the error in the perceiver''s conditioning, not in reality itself.
  Divergence: Advaita attributes illusion to māyā (cosmic power); the Śiva Saṃhitā attributes it to one''s
  own karma, making it more intimately personal.


  **Dhammapada 1 (mind precedes phenomena):** Both suggest that what we perceive as ''world'' is shaped
  by inner condition—karma in Buddhism, karma in Tantra. Divergence: The Dhammapada emphasizes ethical
  consequence; the Śiva Saṃhitā emphasizes metaphysical veiling and the non-dual ground beneath all appearance.'
