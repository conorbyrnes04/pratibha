  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The ghata is said to be that state in which the prana and the apana vayus, the nada and the
  vindu, the jivatma (the Human Spirit) and the Paramatma (the Universal Spirit) combine and co-operate.
abhyasa: 'Today, in a quiet moment, notice the natural rhythm of your breath entering and leaving. Without
  forcing, observe how inhalation and exhalation are not opposites but partners in a single flow. Rest
  attention there—not analyzing, but sensing the cooperation between what comes in and what goes out.
  This simple noticing mirrors the ghata''s principle: unity emerges when opposing forces work together.'
