title: The wise beginner should keep his body firm and…
unit_type: verse
commentary: 'This passage opens the practical teaching by establishing a ritual frame of respect and protection before undertaking
  breath work. The student is instructed to orient the body and mind through directional salutations—to teachers (left), to
  Ganesha the remover of obstacles (right), and to cosmic guardians and the divine feminine (left again). This is not mere
  formality; it signals that yoga practice is embedded in a relational cosmos where one does not proceed alone, and that humility
  and proper alignment precede technique.



  Key Terms



  **Pranayama** — Regulation or extension of prāṇa (vital life-force) through controlled breathing; the foundational practice
  introduced after proper invocation and alignment.

  **Gurus** — Spiritual teachers or guides to whom respect and gratitude are offered as a prerequisite to receiving transmission.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.41 (yoga is the path of steadiness and focus):** Both texts emphasize that yoga begins with firm posture
  and mental clarity, not mere technique. Divergence: The Gītā frames steadiness as inner resolve amid action; the Śiva Saṃhitā
  grounds it in ritual invocation and the subtle body.


  **Confucian ritual propriety (lǐ 禮):** Both traditions hold that proper external form and directional respect prepare the
  inner work and align one with larger orders. Divergence: Confucianism emphasizes social and familial hierarchy; the Śiva
  Saṃhitā invokes cosmic and divine presences beyond the human social realm.


  **Meister Eckhart''s counsel to ''empty yourself'' before receiving grace:** Both suggest that humility and acknowledgment
  of what is greater than oneself precede real transformation. Divergence: Eckhart emphasizes negation and surrender to God;
  the Śiva Saṃhitā honors specific deities and teachers as active presences guiding the path.'
