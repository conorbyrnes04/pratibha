  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The wise beginner should keep his body firm and inflexible, his hands joined as if in supplication, and salute
  the Gurus on the left side. He should also pay salutations to Ganesha on the right side, and again to the guardians of the
  worlds and goddess Ambika who are on the left side. (5) The Pranayama.
abhyasa: Before any breathing exercise today, pause and sit upright. Acknowledge silently or aloud one teacher or guide whose
  wisdom has served you, one force or presence that removes your obstacles, and one larger order (natural, cosmic, or divine)
  that holds your practice. Notice how this simple reorientation shifts your inner posture from isolated effort to participation.
