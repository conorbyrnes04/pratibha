  body: The wise beginner should keep his body firm and inflexible, his hands joined as if in supplication, and salute the
    Gurus on the left side. He should also pay salutations to Ganesha on the right side, and again to the guardians of the
    worlds and goddess Ambika who are on the left side. (5) The Pranayama.
