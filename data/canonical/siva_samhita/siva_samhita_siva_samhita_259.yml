  body: Then (after Mahamudra), having extended the (right) foot, place it on the (left) thigh; contract
    the perineum, and draw the apana vayu upwards and join it with the samana vayu; bend the prana vayu
    down- wards, and then let the wise Yogi bind them in trinity in the navel (i.e. the prana and the
    apana should be joined with the Samana in the navel. I have told you how the Mahabandha, which shows
    the way to emancipation. By this, all the fluids in the vessels of the body of the Yogi are propelled
    towards the head. This should be practiced with great care, alternately with both feet.
