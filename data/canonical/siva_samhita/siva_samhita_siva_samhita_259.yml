title: Then (after Mahamudra), having extended the (right)…
unit_type: verse
commentary: 'This passage describes Mahābandha, a lock (bandha) that redirects the body''s vital energies
  (vāyu) toward the head and ultimately toward liberation. The teaching assumes a subtle anatomy in which
  three currents of prāṇa—apāna (downward), samāna (equalizing), and prāṇa proper (upward)—can be consciously
  unified at the navel center through postural and muscular engagement. The passage emphasizes that this
  is not mere physical exercise but a deliberate reversal of the body''s ordinary energy flow, presented
  as ''the way to emancipation'' itself.



  Key Terms



  **Mahābandha** — The ''great lock''—a practice that binds and redirects the three main currents of vital
  energy (prāṇa, apāna, samāna) toward the navel and head, said to lead toward liberation.

  **vāyu** — Vital wind or energy; in this passage, the five currents of prāṇa that govern different functions
  in the subtle body (here: prāṇa, apāna, samāna).

  **nāḍī** — Subtle channels or vessels through which vital energy flows in the body; the passage refers
  to ''vessels of the body'' through which fluids are propelled.



  Cross-Tradition Resonances



  **Haṭha Yoga Pradīpikā III.19–25 (bandhas and their effects):** Both texts present locks as techniques
  that gather and redirect internal energy toward spiritual awakening, treating the body as a conscious
  instrument of transformation. Divergence: The Haṭha Yoga Pradīpikā situates bandhas within a more elaborate
  system of eight limbs and multiple energy channels; this passage focuses narrowly on the unification
  of three currents.


  **Upaniṣads (e.g., Kaṭha Upaniṣad II.3.16: the reversal of the senses):** Both teach that liberation
  involves a reversal or redirection of the ordinary outward flow of consciousness and energy toward an
  inward, unified center. Divergence: The Upaniṣads speak of this reversal primarily through metaphor
  and philosophical inquiry; the Śiva Saṃhitā offers a concrete somatic method.


  **Tantric traditions (e.g., Kālī Tantra): raising kuṇḍalinī:** Both assume that dormant power in the
  lower body can be awakened and drawn upward through the spine toward liberation or union with the divine.
  Divergence: This passage does not explicitly invoke kuṇḍalinī or the full cakra system; it focuses on
  the three vāyus unified at the navel as the operative principle.'
