translation: The two vessels called the ida and the pingala are the real Varana and Asi. The space between
  them is called Varanasi (Benares, the holy city of Siva). There it is said that the Vishwanatha (the
  Lord of the universe) dwells.
abhyasa: Sit quietly and bring awareness to the space between your left and right sides of the body—the
  midline from the base of the spine to the crown. Without forcing breath or visualization, simply notice
  this interior space as a place of presence. Rest there for a few minutes, allowing the distinction between
  'inner' and 'outer' pilgrimage to soften.
