translation: By looking closely and deeply into the matter, this false knowledge vanishes. It cannot be
  removed otherwise; the delusion of silver remains.
abhyasa: 'Today, choose one fixed belief about yourself or reality that you hold as certain. Sit quietly
  and ask: *What am I actually observing, versus what am I assuming?* Look closely—not to demolish the
  belief, but to see whether direct experience supports it or whether habit and inference do. Notice what
  shifts when you stop defending it and simply look.'
