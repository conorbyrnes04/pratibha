translation: The quality of ether is sound; of air motion and touch. Form is the quality of fire, and
  taste of water. And smell is the quality of earth. There is no gainsaying this.
abhyasa: 'Today, pause before one meal or drink. Notice: the smell of earth in the food, the taste of
  water in the liquid, the warmth (fire''s quality) in the temperature, the texture (air''s touch) on
  your tongue, the resonance (ether''s sound) of the experience in your awareness. This simple attention
  honors the five elements as living presences, not abstractions.'
