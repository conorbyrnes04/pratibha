  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Sitting in the Padmasana posture, and knowing the action of the prana and apana, when the Yogi performs the regulation
  of the breath, he is emancipated. I tell you the truth. Verily, I tell you the truth.
abhyasa: 'Sit in a comfortable cross-legged posture today. Before any formal practice, simply observe: Where do you feel your
  breath entering and leaving? Can you sense any difference between the quality of the inhale and exhale? Spend five minutes
  with this gentle noticing—not controlling, just knowing. This is the beginning of the Yogi''s knowledge spoken of here.'
