  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Therefore, the things do exist; the great and glorious One that manifests them, alone exists;
  though things are false and unreal, yet, as the reflection of the real, they, for the time being, appear
  real.
abhyasa: 'Today, observe one ordinary object (a cup, a leaf, your hand). Notice its apparent solidity
  and reality. Then pause and ask: what is the unchanging awareness in which this object appears? Can
  you rest as that awareness, letting the object remain vivid yet recognized as a reflection within consciousness?'
