  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Know semen to be moon-like, and the germ-cells the emblem of sun; let the Yogi make their
  union in his own body with great care.
abhyasa: Sit quietly and visualize the cool, receptive lunar quality in the lower body and the warm, radiant
  solar quality in the upper body. Without forcing or straining, simply hold awareness of both simultaneously
  for a few minutes, allowing the sense of their complementary nature to settle. This is contemplative
  preparation, not a technique—notice what 'union' means as a state of balanced presence.
