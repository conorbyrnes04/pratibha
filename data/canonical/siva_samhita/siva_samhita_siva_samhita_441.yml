  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By simply remembering this, one obtains the knowledge of Brahman, all sins are destroyed,
  and one is never born again as man.
abhyasa: 'Today, pause once and recall: what is the unchanging awareness that witnesses all my thoughts,
  sensations, and circumstances? Rest there, without effort, for three breaths. This is an invitation
  to the remembrance the verse names—not as belief, but as direct noticing.'
