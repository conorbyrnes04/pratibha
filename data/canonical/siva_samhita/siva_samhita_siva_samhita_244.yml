  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Again let him be absorbed in that Yoni, where dwells the fire of death - the nature of Shiva,
  &c. Thus has been described by me the method of practicing the great Yoni-mudra. From success in its
  practice, there is nothing which cannot be accomplished.
abhyasa: 'Sit quietly and, without forcing, contemplate what ''absorption'' might mean: not escape from
  the body, but a settling of attention into its deepest ground. Notice where you habitually hold tension
  or resistance. Breathe gently and ask: what would it mean to meet that place not as an obstacle, but
  as a doorway to what Śiva already is?'
