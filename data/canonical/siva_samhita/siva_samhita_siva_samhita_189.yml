  body: No injurious results then would follow, were the Yogi to take a large quantity of food, or very
    little, or no food at all. hrough the strength of constant practice, the Yogi obtains bhucharisiddhi,
    he moves as the frog jumps over the ground, when frightened away by the clapping of hands.
