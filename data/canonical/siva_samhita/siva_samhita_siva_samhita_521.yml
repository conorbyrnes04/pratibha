  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: O Goddess! Shiva, the destroyer of Tripura, is the One first and highest cause. The wise
  attains Him, who is unchanging, undecaying, all peace, immeasurable and free from all ills - the Highest
  Goal.
abhyasa: 'Sit quietly and contemplate one quality named here: ''unchanging'' or ''all peace'' or ''free
  from ills.'' Do not visualize or imagine. Simply hold the word and notice what in your own awareness
  does not change, even as thoughts and sensations arise and pass. Rest there for five minutes.'
