  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: It sleeps there like a serpent, and it is luminous by its own light. Like a serpent it lives
  between the joints; it is the goddess of speech, and is called the seed (vija).
abhyasa: 'Sit quietly and place attention at the base of your spine. Without forcing or visualizing, simply
  notice the space there—its aliveness, its potential. Breathe gently and listen inwardly for any subtle
  sensation or vibration. This is not activation but recognition: acknowledging the presence already there.'
