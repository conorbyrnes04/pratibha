  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who performs mental bathing at the junction of the White (ida) and the Black (pingala)
  becomes free from all sins, and reaches the eternal Brahma.
abhyasa: Sit quietly and visualize the meeting point of ida (cool, lunar, right-nostril energy) and pingala
  (warm, solar, left-nostril energy) at the central axis of your body. Without forcing breath or technique,
  simply hold awareness there—as if bathing your mind in that junction—for 5–10 minutes. Notice any shift
  in the sense of inner unity or calm.
