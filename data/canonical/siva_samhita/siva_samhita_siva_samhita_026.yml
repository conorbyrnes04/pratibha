  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The classifiers of karma have divided it into two parts; good and bad actions; they are the
  veritable bondage of embodied souls each in its turn.
abhyasa: Today, notice one action you consider 'good' and one you consider 'bad.' Without judgment, observe
  how each creates a subtle sense of doer-ship, identity, or expectation within you. What would it feel
  like to act without claiming either virtue or fault?
