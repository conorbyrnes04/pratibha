title: The classifiers of karma have divided it into two…
unit_type: verse
commentary: 'This passage presents karma not as cosmic reward-and-punishment, but as a fundamental mechanism
  of bondage itself. Both ''good'' and ''bad'' actions bind the embodied soul—a radical claim that virtue
  alone does not liberate. The Śiva Saṃhitā here suggests that liberation requires transcendence of the
  entire karmic framework, not merely ethical refinement. This sets the stage for why yoga practice, rather
  than moral action alone, becomes the path to freedom.



  Key Terms



  **karma** — Action and its binding consequences; here understood as a dual mechanism (good and bad)
  that perpetuates embodied existence rather than liberating from it.

  **embodied souls** — Individual consciousnesses identified with and limited by the physical body and
  its karmic history.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47–48 (yoga as freedom from action''s fruit):** Both texts teach that detachment from
  karmic results, not mere ethical action, is the gateway to liberation. Divergence: The Gītā emphasizes
  performing duty without attachment; the Śiva Saṃhitā here suggests even the binary of good/bad is itself
  the trap.


  **Heraclitus, Fragment 51 (conflict as underlying reality):** Both recognize a fundamental duality (good/bad,
  tension/harmony) as constitutive of the manifest world. Divergence: Heraclitus celebrates strife as
  creative; the Śiva Saṃhitā names it bondage and seeks transcendence beyond it.'
