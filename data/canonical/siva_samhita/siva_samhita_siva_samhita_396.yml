abhyasa: 'Today, notice one small capacity you possess that you take for granted—the ability to calm your
  mind, to sense another''s mood, to solve a problem, to heal a small hurt. Reflect: what practice or
  discipline developed it? This grounds the passage''s claim that yoga refines human potential, without
  requiring belief in the miraculous.'
