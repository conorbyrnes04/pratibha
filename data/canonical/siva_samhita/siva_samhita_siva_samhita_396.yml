title: He can make gold, etc., see the adepts…
unit_type: verse
commentary: 'This passage lists the siddhis (extraordinary capacities) that arise as fruits of yoga practice—transmutation
  of matter, clairvoyance, healing knowledge, and perception of the hidden. The enumeration suggests that
  such powers are real consequences of sustained practice, yet their mention in a single breath—without
  elaboration or emphasis—implies they are secondary to the ultimate goal of liberation. The passage affirms
  the yogin''s expanded agency in the world while keeping these capacities in perspective within a larger
  metaphysical framework.



  Key Terms



  **siddhis** — Extraordinary powers or capacities that arise as natural fruits of yoga practice; in this
  passage: transmutation, clairvoyance, healing, and perception of hidden things.

  **adepts** — Accomplished yogins or practitioners; the passage suggests the accomplished yogin can perceive
  them clairvoyantly.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, III.37–III.50 (on siddhis):** Both texts affirm that supernatural capacities
  naturally emerge from meditative absorption and mastery of subtle forces; both warn (implicitly or explicitly)
  against attachment to them. Divergence: The Yoga Sutras treat siddhis more systematically and cautiously,
  explicitly cautioning that they are obstacles to final liberation; the Śiva Saṃhitā passage presents
  them more matter-of-factly, as natural fruits.


  **Plotinus, Enneads IV.4.30–32 (on powers of the soul):** Both suggest that refined consciousness naturally
  acquires capacities—healing, perception, subtle knowledge—that appear miraculous to ordinary awareness.
  Divergence: Plotinus grounds these in the soul''s ascent to the intelligible realm; the Śiva Saṃhitā
  grounds them in prāṇa and kuṇḍalinī, the subtle energetic body.


  **Daodejing, ch. 15 (on the sage''s mysterious capacities):** Both traditions suggest that mastery of
  inner practice yields perceptual and practical powers that seem paradoxical to the unrefined mind. Divergence:
  The Daodejing emphasizes wu-wei (non-action) and obscurity; the Śiva Saṃhitā passage lists concrete,
  visible capacities, suggesting a more direct relationship between practice and power.'
