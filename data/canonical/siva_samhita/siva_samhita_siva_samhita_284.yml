  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who drinks nectar becomes equal to Siddhas; he who practices this bandha becomes an adept
  among creatures. (8) Uddana-bandha.
abhyasa: 'Today, sit quietly and bring gentle awareness to the space between your navel and heart. Without
  forcing, notice the natural upward current of your breath and energy. Simply observe where vitality
  naturally rises in your body. This attentiveness—without strain—begins to align you with the principle
  the text names: the upward flow that the bandha cultivates.'
