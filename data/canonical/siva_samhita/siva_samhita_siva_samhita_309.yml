  body: When at the time of voiding urine the Yogi draws it up forcibly through the Apana- Vayu, and keeping
    it up, discharges it slowly and slowly; and practices this daily according to the instructions of
    his Guru, he obtains the vindu-siddhi (power over semen) that gives great powers.
