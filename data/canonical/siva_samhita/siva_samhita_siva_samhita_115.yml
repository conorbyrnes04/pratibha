translation: The nadi called ida is on the left side coiling round the sushumna, it goes to the right
  nostril.
abhyasa: Today, sit quietly and observe your natural breathing without forcing it. Notice which nostril
  feels more open or active. Simply witness this without judgment, holding in mind that according to this
  teaching, each nostril corresponds to a distinct energetic channel. This simple observation can deepen
  your felt sense of the body as a living network of subtle currents.
