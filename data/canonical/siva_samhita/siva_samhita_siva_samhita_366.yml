  body: Of the four kinds of food (i.e., that which is chewed, that which is sucked, that which is licked
    and that which is drunk), which a man takes, the chyle fluid is converted into three parts. The best
    part (or the finest extract of food) goes to nourish the linga sharira or subtle body (the seat of
    force). The second or middle part goes to nourish this gross body composed of seven dhatus (humours).
