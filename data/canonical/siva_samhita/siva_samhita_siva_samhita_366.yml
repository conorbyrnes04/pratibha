  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Of the four kinds of food (i.e., that which is chewed, that which is sucked, that which is
  licked and that which is drunk), which a man takes, the chyle fluid is converted into three parts. The
  best part (or the finest extract of food) goes to nourish the linga sharira or subtle body (the seat
  of force). The second or middle part goes to nourish this gross body composed of seven dhatus (humours).
abhyasa: 'At your next meal, pause before eating and notice: this food will be transformed. Mentally acknowledge
  the finest part of what you consume as nourishment for your subtle body and the energy channels within
  it, not only for your physical form. This simple recognition—without changing what you eat—can deepen
  awareness that practice and ordinary life are not divided.'
