title: If the practiser of Yoga wishes to cross the ocean…
unit_type: verse
commentary: 'This passage reconciles renunciation with engagement: the yogi need not flee worldly life
  to attain liberation, but rather perform all duties incumbent on their station (householder, student,
  renunciate, elder) while inwardly releasing attachment to outcomes. This teaching affirms that non-dual
  realization is compatible with social responsibility and ordinary life—a radical democratization of
  liberation that does not require monastic withdrawal.



  Key Terms



  **āśrama** — One of the four traditional life-stages (student, householder, forest-dweller, renunciate),
  each with its own prescribed duties; here, the condition or station into which one is born or enters.

  **phala-tyāga** — Renunciation of fruits (results, rewards); performing action without clinging to its
  outcome—a cornerstone of non-dual yoga ethics.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47–48 (yoga as skill in action, performing duty without attachment to fruit):** Both
  texts teach that yoga is compatible with duty and that liberation comes through action performed without
  desire for reward. Divergence: The Gītā frames this within dharma (cosmic law) and devotion to Kṛṣṇa;
  the Śiva Saṃhitā grounds it in non-dual metaphysics and the subtle body''s transformation.


  **Meister Eckhart, ''Detachment'' (performing works while releasing the self''s investment in them):**
  Both teach that true renunciation is internal—a letting-go of ego-clinging—not external withdrawal from
  life. Divergence: Eckhart emphasizes union with God through negation of will; the Śiva Saṃhitā emphasizes
  the yogi''s own subtle body and prāṇa as the vehicle of realization.


  **Tao Te Ching 48 (the sage acts without action, accomplishes without striving):** Both suggest that
  true efficacy arises when the doer releases personal will and allows action to flow naturally. Divergence:
  The Taoist text points to wu-wei (non-action) as the way; the Śiva Saṃhitā insists on *full performance*
  of duty, with inner detachment as the key.'
