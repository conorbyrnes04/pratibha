  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: If the practiser of Yoga wishes to cross the ocean of the world, he should perform all the
  duties of his ashrama, (the condition of life), renouncing all the fruits of his works.
abhyasa: Today, identify one duty or task you typically perform while mentally grasping for a particular
  result. Perform it fully and carefully, but at its completion, consciously release the fruit—the praise,
  the gain, the validation—as though it belongs to something larger than yourself. Notice what shifts
  in your attention or ease.
