  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Rising from the left-side of the Ajha lotus and going to the right nostril, this northward flowing pingala has
  been called of old the Asi.
abhyasa: Sit quietly and bring awareness to your right nostril. Without forcing breath, simply notice the natural quality
  of air moving there—its temperature, texture, rhythm. Observe for 2–3 minutes. This simple noticing begins to awaken sensitivity
  to the channel described, preparing the ground for formal prāṇāyāma work under a teacher's guidance.
