translation: All these external substances will perish in the course of time; (but) that Spirit which
  is indestructable by word (will exist) without a second.
abhyasa: 'Sit quietly and observe one object before you—a plant, stone, or cup. Notice its impermanence:
  the dust settling on it, the slow decay, its dependence on conditions. Then pause and ask: what in me
  witnesses this change without itself changing? Rest attention there, without naming it, for a few minutes.'
