  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In this body, the mount Meru - i.e., the vertebral column - is surrounded by seven islands;
  there are rivers, seas, mountains, fields; and lords of the fields too.
abhyasa: 'Sit quietly and bring attention to the base of your spine. Imagine a luminous mountain rising
  through the center of your body from root to crown. Without forcing visualization, simply notice: what
  qualities, sensations, or presences seem to inhabit different regions along this axis? This is not belief
  but gentle inquiry into your own lived embodiment.'
