  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who practices this Mahavedha with great secrecy, obtains vayu-siddhi (success over the
  wind). It destroys decay and death.
abhyasa: 'Today, sit quietly and observe your breath without forcing it. Notice where you hold tension
  or withhold breath—in the chest, belly, or throat. Rather than practicing any specific technique, simply
  witness how your vāyu (life-force) moves and stalls. This attentiveness itself is a beginning: recognizing
  that breath is not merely mechanical but the vehicle of presence.'
