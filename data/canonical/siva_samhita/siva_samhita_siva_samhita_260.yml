  body: Through this practice, the wind enters the middle channel of Sushumna, the body is invigorated by it, the bones are
    firmly knitted, the heart of the Yogi becomes full (of cheerfulness). By this Bandha, the great Yogi accomplishes all
    his desires. (3) Maha-Vedha.
