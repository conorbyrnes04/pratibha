  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Through this practice, the wind enters the middle channel of Sushumna, the body is invigorated by it, the bones
  are firmly knitted, the heart of the Yogi becomes full (of cheerfulness). By this Bandha, the great Yogi accomplishes all
  his desires. (3) Maha-Vedha.
abhyasa: Sit quietly and notice your breath moving through both nostrils. Without forcing, gently observe where your attention
  naturally rests—left side, right side, or center. For a few minutes, simply intend (without strain) to sense or imagine
  the breath flowing through a central channel running from the base of your spine to the crown. Notice any shift in your
  sense of calm or centeredness. This is contemplative preparation, not the full practice.
