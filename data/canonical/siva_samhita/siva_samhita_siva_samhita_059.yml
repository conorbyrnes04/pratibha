unit_label: Chapter 1 — 63
title: Having seen the Spirit, that brings forth…
unit_type: verse
commentary: 'This passage describes the culmination of yoga practice: direct perception of the Spirit
  (Ātman/Brahman) within one''s own consciousness, achieved through disciplined self-inquiry. The ''forgetting''
  of the universe is not annihilation but a radical reorientation—the practitioner''s attention withdraws
  from external multiplicity and rests in non-dual awareness, where the distinction between observer and
  observed dissolves. The ''ineffable bliss of Samadhi'' is presented not as escapism but as the natural
  fruit of recognizing one''s true nature, available even to householders engaged in ordinary life.



  Key Terms



  **Ātman (Spirit)** — In Advaita Vedānta and yoga philosophy, the innermost self or consciousness, understood
  as non-dual and identical with ultimate reality (Brahman).

  **Samādhi** — A state of profound meditative absorption in which the distinction between subject and
  object dissolves; the goal of yoga practice, described here as ''ineffable bliss.''



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.2.12): ''When all desires that dwell in the heart are cast away,
  then the mortal becomes immortal, and attains Brahman here.'':** Both passages describe liberation as
  the transcendence of desire and identification with the eternal Self, accessible within this life. Divergence:
  The Upaniṣads emphasize renunciation of desire as prerequisite; the Śiva Saṃhitā (in its broader context)
  affirms that householders with family duties may also attain this state.


  **Bhagavad Gītā 6.20–23: ''When the mind becomes still, fixed in meditation on the Self alone, one attains
  supreme peace.'':** Both texts locate liberation in the stilling of mind and recognition of the Self
  as the source of lasting peace. Divergence: The Gītā emphasizes yoga as a path compatible with action
  and duty; the Śiva Saṃhitā focuses more explicitly on the subtle physiology (kuṇḍalinī, nāḍīs) as the
  mechanism of awakening.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  express non-dual vision: the dissolution of subject-object duality in direct knowing of the ultimate.
  Divergence: Eckhart''s formulation is theistic (God as personal); the Śiva Saṃhitā''s ''Spirit'' is
  understood as impersonal consciousness, though Śiva as the ultimate principle is also revered.'
