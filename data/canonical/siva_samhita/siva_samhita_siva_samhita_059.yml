translation: Having seen the Spirit, that brings forth happiness, in his own spirit by the help of the
  self, he forgets this universe, and enjoys the ineffable bliss of Samadhi (profound meditation.)
abhyasa: Today, in a quiet moment, sit and notice the awareness that witnesses your thoughts, sensations,
  and surroundings—the 'self' observing the self. Rather than pursuing any experience, simply rest attention
  there, in that witnessing presence itself, for even a few breaths. Observe what shifts when you stop
  seeking happiness in objects and turn inward to the source of awareness.
