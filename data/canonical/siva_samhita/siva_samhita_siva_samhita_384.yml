title: Whatever the mind desires, he gets;
unit_type: verse
commentary: 'This passage teaches that sustained mental discipline and desire—directed toward the divine—culminates in direct
  vision of the liberating principle (Śiva). The claim ''whatever the mind desires, he gets'' is not license for worldly craving,
  but rather a promise that sincere, habitual practice (abhyāsa) aligns the practitioner''s inner nature with the supreme
  reality. The phrase ''best both in and out'' suggests a non-dual recognition: the divine is both transcendent and immanent,
  beyond and within. The passage affirms that this vision is the highest fruit and sole worthy object of devotion.



  Key Terms



  **abhyāsa (habitual exercise)** — Disciplined, repeated practice; the cultivation of mental and spiritual habit that transforms
  perception and being.

  **mokṣa (salvation)** — Liberation; release from the cycle of birth and death; direct realization of one''s true nature
  as non-separate from the divine.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.35 (Arjuna Uvāca):** Both texts affirm that the mind, trained through discipline, attains the highest
  reality; desire itself becomes the vehicle of liberation when rightly directed. Divergence: The Gītā emphasizes duty (dharma)
  and surrender to divine will as the context for practice; the Śiva Saṃhitā here stresses the power of habitual mental exercise
  and direct vision.


  **Meister Eckhart, ''God is not being, but beyond being'':** Both suggest the divine transcends ordinary categories (''best
  both in and out''); both point to a non-dual realization beyond subject-object duality. Divergence: Eckhart''s via negativa
  emphasizes unknowing and detachment; the Śiva Saṃhitā here emphasizes active vision (darśana) through disciplined desire
  and practice.


  **Dhammapada 25: ''By oneself, indeed, is evil done; by oneself is one defiled. By oneself is evil left undone; by oneself,
  indeed, is one purified.'':** Both texts place responsibility for transformation on the practitioner''s own sustained effort
  and mental discipline, not external grace alone. Divergence: The Dhammapada frames this in terms of ethical action and defilement;
  the Śiva Saṃhitā frames it as the power of desire and vision directed toward the divine principle.'
