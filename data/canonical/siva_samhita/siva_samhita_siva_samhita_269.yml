  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: O, my beloved! know this to be the source of all success, always practicing it let him drink the ambrosia daily.
  By this he obtains vigraha-siddhi (power over the microcosm), even as a lion over the elephant of death.
abhyasa: 'Choose one moment today—upon waking, or before sleep—and sit quietly for five breaths with the intention of ''drinking
  the ambrosia'': inhale slowly, hold the breath gently, and exhale with awareness that you are sustaining yourself through
  your own vital energy. Notice any shift in presence or calm. Return to this threshold moment tomorrow.'
