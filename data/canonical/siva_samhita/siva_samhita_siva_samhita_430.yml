translation: By reversing the tongue and placing it in the long hollow of the palate, let the Yogi enter
  into contemplation, that destroys all fears. All his sins, whose mind remains steady here even for a
  second, are at once destroyed.
abhyasa: Today, sit quietly for a few minutes. Gently reverse your tongue so its tip touches the soft
  palate (the roof of your mouth behind the hard palate). Breathe naturally and allow your attention to
  settle there without strain. Notice what arises—sensation, stillness, or restlessness—without judgment.
  This is not achievement but acquaintance with the practice.
practice: Today, sit quietly for a few minutes. Gently reverse your tongue so its tip touches the soft
