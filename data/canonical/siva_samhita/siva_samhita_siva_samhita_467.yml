  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Above this {i.e., the lunar sphere) is the brilliant thousand-petalled lotus. It is outside
  this microcosm of the body, it is the giver of salvation.
abhyasa: Today, after a few minutes of steady breathing, bring your awareness to the crown of your head.
  Rather than trying to visualize or 'reach' anything, simply rest attention there with the understanding
  that this point is a threshold—a place where the bounded body-mind opens toward what is boundless. Notice
  what arises without grasping.
