  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: There is no posture like that of Siddhasana, no power like that of kumbha, no mudra like
  the Khechari, and no absorption like that of nada (the mystic sound). 3 1. Now I shall describe to thee,
  O dear, the foretaste of salvation, knowing which even the sinful aspirant may obtain salvation.
abhyasa: 'Sit quietly today and notice one of these four: your natural seated posture, a single breath
  held gently, the position of your hands, or any subtle sound (internal or external) you can attend to.
  Rather than ''perfecting'' it, simply observe which one draws your attention most easily. This noticing
  itself is the beginning of the path the text describes.'
