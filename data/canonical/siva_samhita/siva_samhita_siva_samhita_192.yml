  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The wise practitioner surely destroys al his karma, whether acquired in its life or in the
  past, through the regulation of breath.
abhyasa: 'Sit quietly for five minutes. Observe your natural breath without changing it. Notice where
  tension, hurry, or holding appears in the breath. Then, on one exhale, consciously lengthen it slightly
  and release any tightness you sense. Repeat for a few cycles. Reflect: what shifts when the breath becomes
  conscious and spacious?'
