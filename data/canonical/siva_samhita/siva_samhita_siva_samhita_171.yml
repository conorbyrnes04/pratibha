  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Certain signs are perceived in the body of the Yogi whose nadas have been purified. I shall
  describe, in brief, all these various signs.
abhyasa: 'Today, sit quietly for a few minutes and notice one small, ordinary sensation in your body—warmth,
  coolness, tingling, ease, or resistance. Rather than judging it, simply observe it as a ''sign'' that
  something is alive and present in you right now. This mirrors the Yogi''s attentiveness: the body speaks
  if we learn to listen.'
