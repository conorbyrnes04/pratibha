translation: In the sinus of the forehead let him contemplate on the ocean of milk; from that place let
  him meditate on the moon, which is in the Sahasrara.
abhyasa: Sit quietly. Gently direct awareness to the space between and slightly above your eyebrows. Imagine
  there a vast, still ocean of white light or milk. Rest there for several breaths. Then, without strain,
  allow your attention to rise to the crown of the head, and sense there a cool, luminous moon. Spend
  a few minutes simply witnessing this inner landscape without forcing or visualizing rigidly.
