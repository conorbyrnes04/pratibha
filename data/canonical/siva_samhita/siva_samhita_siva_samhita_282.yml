title: Putting the head on the ground, let him stretch out…
unit_type: verse
commentary: 'This passage describes Viparit-karana (the inverted pose), presented as a foundational practice
  whose power lies in its reversal of ordinary bodily orientation. The teaching emphasizes secrecy—not
  as mystification, but as the mark of transmitted knowledge: practices of real potency were guarded within
  lineages and revealed only to committed students. The simplicity of the instruction masks a deeper claim:
  that inverting the body''s relationship to gravity and direction is itself a gateway to non-ordinary
  states and insight.



  Key Terms



  **Viparit-karana** — Literally ''reversed action'' or ''inverted pose''; an asana in which the head
  is lowered and legs raised, used in yoga practice to redirect prāṇa (vital energy) and consciousness.

  **Tantra** — In this context, esoteric teachings and practices transmitted orally within lineages, concerned
  with the subtle body and direct realization rather than ritual alone.



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were profound and subtle... who can wait quietly while the
  mud settles?'':** Both texts prize practices that work through reversal or inversion of ordinary perception—the
  Taoist sage empties and stills; the yoga practitioner inverts and redirects energy. Divergence: The
  Tao Te Ching emphasizes non-action and receptivity; Viparit-karana is an active, deliberate bodily intervention.


  **Patañjali''s Yoga Sutras 2.46: ''Sthira sukham asanam'' (the posture should be steady and comfortable).:**
  Both texts treat āsana (posture) as a vehicle for deeper states; both assume practice must be learned
  and refined. Divergence: Patañjali emphasizes ease and stability; the Śiva Saṃhitā passage stresses
  active movement and inversion as transformative.


  **Meister Eckhart: ''A person should be so poor that he is not and has not a place where God can work.'':**
  Both suggest that reversal—emptying, inverting, undoing ordinary orientation—creates space for transcendent
  realization. Divergence: Eckhart''s reversal is psychological and metaphysical; Viparit-karana works
  through the body''s literal reorientation.'
