  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Putting the head on the ground, let him stretch out his legs upwards, moving them round and
  round. This is Viparit-karana, kept secret in all the Tantras.
abhyasa: 'Sit quietly and notice your habitual sense of ''up'' and ''down'' in your body and mind. Without
  performing an inversion (which requires proper guidance), simply contemplate: What if the direction
  of energy, attention, or understanding were reversed from what you assume? Sit with that reversal as
  a thought-experiment for a few minutes.'
