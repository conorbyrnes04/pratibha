  body: Let the wise Yogi practice dharana thus:— five ghatis (2 1/2 hours) in the adhara lotus (muladhara);
    five ghatis in the seat of the linga (svadhisthana), five ghatis in the region above it, (in the navel,
    manipur), and the same in the heart (anahata); five ghatis in the throat (visuddha) and, lastly let
    him hold dharana for five ghatis in the space between the two eye-brows (anjapur). By this practice
    the elements cease to cause any harm to the great Yogi.
