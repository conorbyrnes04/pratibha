unit_label: Chapter 3 — 64
title: Let the wise Yogi practice dharana thus:— five…
unit_type: verse
commentary: 'This passage prescribes a systematic meditation (dharana) that moves attention sequentially
  through the six major energy centers (cakras) of the subtle body, spending equal time (five ghatis,
  approximately 2.5 hours each) at each locus. The teaching suggests that sustained contemplative focus
  on these centers progressively neutralizes the reactive force of the elements (earth, water, fire, air,
  space)—understood not as external substances but as patterns of sensation, emotion, and mental habit
  that ordinarily bind consciousness. The promise is not supernatural power but freedom: the yogi ceases
  to be harmed by what ordinarily causes suffering.



  Key Terms



  **dharana** — Concentrated focus or meditative absorption; the fixing of attention on a single point
  or center without wavering.

  **cakra (or chakra)** — Energy center or nexus in the subtle body; the passage names six: muladhara
  (base), svadhisthana (sacral), manipura (navel), anahata (heart), visuddha (throat), and ajna (between
  eyebrows).

  **elements (bhūta)** — In this context, the five subtle elements (earth, water, fire, air, space) that
  constitute both the gross world and the inner nature; their ''harm'' refers to the conditioning and
  reactivity they generate.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra 3.1–3.8 (on dhāraṇā, dhyāna, samādhi):** Both texts treat dharana as a foundational
  practice of sustained attention that leads to liberation; both see it as a disciplined, progressive
  path. Divergence: Patañjali emphasizes dharana on any chosen object; the Śiva Saṃhitā specifies the
  cakras as the locus, grounding practice in the subtle body''s anatomy.


  **Katha Upaniṣad 2.3.1 (''the wise one, controlling the senses…''):** Both affirm that mastery over
  the senses and elements comes through inner discipline and contemplative knowledge, not external renunciation.
  Divergence: The Upaniṣad emphasizes discrimination (viveka) and the Self; the Śiva Saṃhitā emphasizes
  systematic, embodied practice on the cakras.


  **Hathayoga Pradīpikā 4.1–4.12 (on kuṇḍalinī and the cakras):** Both texts map the subtle body and teach
  that awakening the energy centers leads to freedom from elemental conditioning and suffering. Divergence:
  The Hathayoga Pradīpikā emphasizes kuṇḍalinī awakening and its dangers; the Śiva Saṃhitā presents a
  measured, sequential dharana practice accessible to householders.'
