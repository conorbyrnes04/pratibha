  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Let the wise Yogi practice dharana thus:— five ghatis (2 1/2 hours) in the adhara lotus (muladhara);
  five ghatis in the seat of the linga (svadhisthana), five ghatis in the region above it, (in the navel,
  manipur), and the same in the heart (anahata); five ghatis in the throat (visuddha) and, lastly let
  him hold dharana for five ghatis in the space between the two eye-brows (anjapur). By this practice
  the elements cease to cause any harm to the great Yogi.
