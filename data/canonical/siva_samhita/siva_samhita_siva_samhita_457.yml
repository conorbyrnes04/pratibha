translation: If the mind becomes steadily fixed even for half a second at the Brahmarandhra, one becomes
  free from sins and reaches the highest end.
abhyasa: Sit quietly and bring awareness to the crown of the head. Without forcing or visualizing, simply
  rest attention there for a few breaths, noticing any quality of openness or spaciousness. Return gently
  whenever the mind wanders. This is not 'achieving' the state described, but familiarizing yourself with
  the direction the teaching points.
