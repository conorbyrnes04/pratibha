title: From the fivefold combination of all subtle…
unit_type: verse
commentary: 'This passage establishes the foundational metaphysical framework of the Śiva Saṃhitā: the
  visible world arises from five subtle elements, and within that world, individual consciousness (jīva)
  emerges as the experiencer bound by karma. The teaching is neither purely materialist nor purely idealist—it
  posits that gross manifestation flows from subtle principles, while the jīva''s apparent separation
  and suffering arise through karmic conditioning. This sets the stage for why yoga practice is necessary:
  to recognize the jīva''s true nature beyond its role as ''enjoyer of fruits.''



  Key Terms



  **jīva** — The individual soul or embodied consciousness; here understood as intelligence confined within
  the gross world through karma, experiencing the fruits of action.

  **karma** — Action and its binding consequence; the mechanism by which the jīva remains conditioned
  and identified with the fruits of its deeds.

  **pañcabhūta (five elements)** — The subtle elemental principles from which all gross, perceivable objects
  in the universe are produced.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''karmaṇy evādhikāras te...''):** Both texts affirm that action and its fruits
  are bound together, and that the jīva is entangled in this cycle through identification. Divergence:
  The Gītā emphasizes duty and non-attachment to fruits as the path; the Śiva Saṃhitā emphasizes yoga
  practice and subtle-body transformation as the means to transcend the cycle.


  **Sāṃkhya Kārikā (Īśvarakṛṣṇa), on prakṛti and puruṣa:** Both traditions posit that the manifest world
  arises from subtle principles, and that individual consciousness (puruṣa/jīva) becomes bound through
  identification with manifestation. Divergence: The Śiva Saṃhitā is non-dual (Śaiva Advaita), ultimately
  denying the ultimate duality of puruṣa and prakṛti; Sāṃkhya maintains their eternal distinction.


  **Upaniṣads (e.g., Taittirīya), on ātman and the five sheaths:** Both teach that the individual self
  is layered or conditioned—here by the five elements and karma; there by five sheaths (kośas)—and that
  liberation involves seeing through these coverings. Divergence: The Upaniṣads emphasize knowledge (jñāna)
  of ātman as Brahman; the Śiva Saṃhitā emphasizes prāṇāyāma, mudrā, and kuṇḍalinī awakening as the practical
  means.'
