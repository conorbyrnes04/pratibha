translation: From the fivefold combination of all subtle elements, in this universe, gross innumerable
  objects are produced. The intelligence that is confined in them, through karma, is called the jiva.
  All this world is derived from the five elements. The jiva is the enjoyer of the fruits of action.
abhyasa: 'Today, observe one action you take and one consequence you experience. Notice without judgment:
  Am I the doer, the enjoyer of the result, or the awareness witnessing both? Sit with the question rather
  than answering it.'
