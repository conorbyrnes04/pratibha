abhyasa: 'Today, notice one possession, pleasure, or social role that commands your attention or loyalty.
  Observe without judgment how it shapes your choices and thoughts. Ask yourself: does this serve my deepest
  aim, or does it obscure it? This is not renunciation, but honest seeing.'
