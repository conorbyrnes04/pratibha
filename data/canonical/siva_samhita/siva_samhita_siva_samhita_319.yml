  body: Women, beds, seats, dresses, and riches are obstacles to Yoga. Betels, dainty dishes, carriages,
    kingdoms, lordliness and powers; gold, silver, as well as copper, gems, aloe wood, and kine; learning
    the Vedas and Shastras; dancing, singing and ornaments; harp, flute and drum; riding on elephants
    and horses; wives and children, worldly enjoyments; all these are so many impediments. These are the
    obstacles which arise from bhoga (enjoyment). Hear now the impediments which arise from ritualistic
    religion. Dharma (ritualism of Religion).
