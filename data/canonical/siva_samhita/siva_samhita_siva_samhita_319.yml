title: Women, beds, seats, dresses, and riches are…
unit_type: verse
commentary: 'The passage enumerates two categories of obstacles to yoga: those arising from bhoga (sensory
  enjoyment and worldly attachment) and those from ritualistic dharma (religious formalism). The text
  does not condemn these things as inherently evil, but identifies them as distractions from the singular
  focus required for yoga—the realization of non-dual consciousness. By naming them explicitly, the teaching
  invites practitioners to recognize where their attention and energy are habitually bound, a prerequisite
  for redirecting them toward liberation.



  Key Terms



  **bhoga** — Enjoyment, sensory pleasure, and the worldly attachments that arise from seeking gratification
  through objects, relationships, and status.

  **Yoga** — In this context, the disciplined practice and realization of non-dual consciousness; the
  union of individual awareness with ultimate reality.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.62–63 (on desire and attachment):** Both texts teach that sensory engagement and attachment
  to objects bind consciousness and obstruct spiritual realization. Divergence: The Gītā emphasizes performing
  duty (dharma) without attachment; the Śiva Saṃhitā lists ritualistic dharma itself as an obstacle, suggesting
  a more radical non-dualism.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa and vairāgya):** Both recognize that yoga requires both sustained
  practice and dispassion toward worldly objects and outcomes. Divergence: Patañjali frames this as a
  psychological discipline; the Śiva Saṃhitā presents it within an explicit metaphysics of non-duality
  and suggests liberation is available even to householders.


  **Meister Eckhart, ''Detachment'' sermons:** Both teach that attachment to external things—wealth, status,
  even religious forms—obscures the direct realization of ultimate reality. Divergence: Eckhart emphasizes
  detachment as a Christian virtue of the soul; the Śiva Saṃhitā frames it as a practical prerequisite
  for awakening kuṇḍalinī and realizing Śiva-consciousness.'
