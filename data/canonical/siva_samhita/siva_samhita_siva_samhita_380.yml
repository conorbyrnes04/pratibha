translation: He knows what has been, what is happening, and what is to be, together with their causes;
  he masters the unheard of sciences together with their mysteries.
abhyasa: 'Today, observe one moment of your own experience—a conversation, a thought, a sensation—and
  gently ask: What caused this? What is it becoming? What am I not seeing? Do not strain for answers;
  simply hold the question as you would hold water in cupped hands, noticing how awareness itself shifts
  when you refuse to treat the present as isolated.'
