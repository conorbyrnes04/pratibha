  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The wise Yogi, who daily drinks the ambrosial air, according to proper rules, destroys fatigue,
  burning (fever), decay and old age, and injuries.
abhyasa: 'Today, practice one round of conscious breath awareness: sit quietly for 5–10 minutes and observe
  the natural rhythm of your inhale and exhale without forcing. Notice where you feel fatigue, tension,
  or heaviness in the body. As you breathe, imagine each exhale releasing what is worn or stale, each
  inhale bringing freshness. This is not a technique but an invitation to feel how breath already moves
  through you as a renewing force.'
