  body: Its presiding adept is called Rudra - the giver of all auspicious things, and the presiding goddess of this place
    is called the most sacred Lakini. 25 8 1. When the Yogi contemplates on the Manipur lotus, he gets the power called the
    patal-siddhi - the giver of constant happiness, He becomes lord of desires, destroys sorrows and diseases, cheats death,
    and can enter the body of another.
