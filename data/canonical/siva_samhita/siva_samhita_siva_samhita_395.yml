title: Its presiding adept is called Rudra - the giver of…
unit_type: verse
commentary: 'This passage locates spiritual power within the manipūra cakra (the navel center), presenting it as a seat of
  transformative capacity when contemplated by the yogi. The fruit of such practice is not escape from the world but mastery
  within it—freedom from desire''s tyranny, healing, and even extraordinary abilities. The naming of Rudra (a fierce, auspicious
  form of Śiva) and Lakini as presiding deities grounds the practice in a non-dual cosmos where every center of the subtle
  body is inhabited by divine presence, making inner work simultaneously cosmological.



  Key Terms



  **Manipūra** — The ''jeweled city'' cakra located at the navel center; traditionally associated with will, transformation,
  and the element fire.

  **Patal-siddhi** — A specific supernatural attainment or power granted through contemplation on the manipūra lotus; here,
  the capacity for constant happiness and mastery over circumstance.

  **Yogi** — One who practices yoga; here, one engaged in contemplative union with the divine through systematic inner work.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (on action without attachment):** Both texts affirm that the practitioner need not renounce the world;
  mastery comes through right relationship to desire and action, not flight from them. Divergence: The Gītā emphasizes duty
  and dharma as the path; the Śiva Saṃhitā locates transformation in subtle-body contemplation and cakra work specifically.


  **Patañjali''s Yoga Sūtra 3.45 (on siddhis as byproducts):** Both acknowledge that extraordinary powers arise naturally
  from advanced practice, yet warn implicitly against attachment to them. Divergence: The Śiva Saṃhitā here presents the siddhi
  as a direct fruit of contemplation on a specific center; Patañjali treats siddhis more as distractions from kaivalya (liberation).


  **Upaniṣads (e.g., Katha 2.3.2, on the Self as lord of desires):** Both traditions teach that true freedom is lordship over
  desire through knowledge of one''s deeper nature, not through moral prohibition. Divergence: The Upaniṣads approach this
  through direct inquiry into ātman; the Śiva Saṃhitā offers a mapped, embodied path through the cakra system.'
