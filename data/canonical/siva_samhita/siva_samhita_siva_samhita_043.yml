title: Whatever was, is or will be, either formed or…
unit_type: verse
commentary: 'This opening statement establishes the non-dual metaphysical ground of the Śiva Saṃhitā:
  all phenomena—past, present, future, manifest and unmanifest—rest upon a single transcendent reality
  (the Supreme Spirit). The word ''superimposed'' (adhyāsa in Advaita terminology) suggests that the multiplicity
  we perceive is not separate from or opposed to the absolute, but rather appears *upon* it like waves
  on water. This frames the entire yoga path as a recognition of what already is, rather than a becoming
  something new.



  Key Terms



  **Supreme Spirit** — The transcendent, non-dual reality (Brahman) upon which all existence is said to
  rest; the ultimate ground of being in Advaita Vedānta metaphysics.

  **superimposed** — The appearance of multiplicity and change upon an unchanging substratum; the relationship
  between the world of form and the formless absolute.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Taittirīya Upaniṣad II.1):** Both affirm that all beings and worlds emerge from,
  rest in, and return to a single non-dual reality (Brahman); the universe is *not* separate from the
  source. Divergence: The Upaniṣads often use more poetic and aphoristic language (''from which all beings
  are born''); the Śiva Saṃhitā grounds this in a systematic yoga practice leading to direct realization.


  **Advaita Vedānta (Śaṅkara):** Both use the concept of adhyāsa (superimposition) to explain how the
  world appears real yet is ultimately non-separate from Brahman; both deny dualism. Divergence: Advaita
  emphasizes jñāna (knowledge) and renunciation; the Śiva Saṃhitā integrates this metaphysics with householder
  life and prāṇāyāma, offering a path within the world.


  **Tao Te Ching (ch. 1, 14):** Both point to an unnameable, formless ground from which the ten thousand
  things arise; both suggest the visible world rests upon the invisible. Divergence: The Tao Te Ching
  emphasizes wu-wei (non-action) and naturalness; the Śiva Saṃhitā prescribes specific yogic disciplines
  and techniques to realize this truth.'
