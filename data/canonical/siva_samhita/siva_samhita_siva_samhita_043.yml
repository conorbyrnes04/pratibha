  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Whatever was, is or will be, either formed or formless, in short, all this universe is superimposed
  on the Supreme Spirit.
abhyasa: 'Sit quietly for a few minutes. Notice one object before you—a wall, a plant, your hand. Rather
  than analyzing it, hold the thought: ''This too rests upon something unchanging.'' Do not strain to
  experience this; simply let the question settle. Return to ordinary awareness. This is a seed for contemplation,
  not a technique to ''achieve.'''
