  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: There takes place the conjunction between the Pure Brahma and avidya, from which arises Brahma,
  from which comes out the akasa.
abhyasa: 'Sit quietly and observe the space around you and within you. Notice how emptiness (akasa) seems
  to contain all possibility. Then gently ask: what veils my direct perception of the pure consciousness
  that witnesses even this space? Rest in that inquiry without forcing an answer.'
