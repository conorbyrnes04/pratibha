abhyasa: Today, notice one moment of genuine ease or delight in your ordinary activity—eating, moving,
  speaking—and pause to recognize it as compatible with, not opposed to, your deeper practice or intention.
  Let this small observation soften any internal division between 'spiritual' and 'lived' experience.
