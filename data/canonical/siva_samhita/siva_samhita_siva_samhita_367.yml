  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The third or the most inferior part goes out of the body in the shape of excrement and urine.
  The first two essences of food are found in the nadis, and being carried by them, they nourish the body
  from head to foot.
abhyasa: 'Today, eat one meal with deliberate attention to the three-fold nature of food: notice what
  nourishes (the subtle essences), what the body uses, and what it releases. This simple observation can
  deepen respect for the body as a living system of energy circulation rather than mere matter.'
