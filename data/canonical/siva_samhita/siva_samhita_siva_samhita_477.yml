  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Great Void, whose beginning is void, whose middle is void, whose end is void, has the
  brilliancy of tens of millions of suns, and the coolness of tens of millions of moons. By contemplating
  continually on this, one obtains success.
abhyasa: Today, sit quietly and hold the image of infinite void—not as darkness or absence, but as pregnant
  emptiness containing all light and all coolness simultaneously. Do not strain to 'achieve' anything;
  simply return your attention gently to this paradox whenever the mind wanders. Notice what arises when
  you stop trying to grasp it.
