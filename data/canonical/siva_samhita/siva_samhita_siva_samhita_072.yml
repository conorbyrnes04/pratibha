translation: From Intelligence has come out all this universe, movable and immovable; whether or not its
  existence can be inferred, the 'All Intelligence" One does exist. Absorption or Involution.
abhyasa: 'Sit quietly and observe one thing in your immediate environment—a plant, a sound, your breath.
  Rather than analyzing it, ask: from what Intelligence does this arise? Hold the question without forcing
  an answer. Notice what shifts in your attention when you regard the ordinary as an expression of singular
  Consciousness.'
