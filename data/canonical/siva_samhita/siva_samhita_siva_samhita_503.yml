  body: Remaining in the midst of the family, always doing the duties of the house-holder, he who is free from merits and
    demerits, and has restrained his senses, attain s salvation. The householder practicing Yoga is not touched by sins, if
    to protect mankind he does any sin, he is not polluted by it. The Mantra (Om, Aim, Klim, Strim).
