  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Remaining in the midst of the family, always doing the duties of the house-holder, he who is free from merits
  and demerits, and has restrained his senses, attain s salvation. The householder practicing Yoga is not touched by sins,
  if to protect mankind he does any sin, he is not polluted by it. The Mantra (Om, Aim, Klim, Strim).
abhyasa: 'Today, identify one household duty or family obligation. Before or while performing it, pause and notice: Am I attached
  to being seen as ''good'' for doing this? Can I do this act with full presence but without grasping its result? Return to
  that spacious awareness whenever you catch yourself seeking credit or fearing blame.'
