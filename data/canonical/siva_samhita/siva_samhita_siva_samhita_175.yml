title: Now I tell you the great obstacles to Yoga which…
unit_type: verse
commentary: 'The Śiva Saṃhitā opens its teaching on obstacles by framing them not as external enemies
  but as things to be deliberately renounced—a positive act of discernment rather than mere avoidance.
  The metaphor of ''crossing the sea of worldly sorrow'' suggests that liberation is not escape from the
  world but a crossing through it, made possible only when obstacles are consciously released. This passage
  establishes the ethical and psychological foundation of yoga: the practitioner must first understand
  what binds, then choose to let it go.



  Key Terms



  **Yoga** — In this context, the disciplined path of practice leading to liberation (mokṣa) and union
  with the non-dual Self; not merely physical postures but a comprehensive system of renunciation and
  inner transformation.

  **worldly sorrow (saṃsāra)** — The cycle of conditioned existence characterized by suffering; the ''sea''
  that the yogi must cross through conscious practice and renunciation.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.45 (on renunciation and action):** Both texts teach that renunciation is not passivity
  but active discernment—the Gītā speaks of ''transcending the three guṇas,'' while the Śiva Saṃhitā frames
  obstacles as things to be deliberately removed. Divergence: The Gītā emphasizes duty (dharma) performed
  without attachment, whereas the Śiva Saṃhitā focuses specifically on the internal obstacles to yoga
  practice itself.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa and vairāgya):** Both texts recognize that yoga requires two
  complementary movements: sustained practice (abhyāsa) and non-attachment (vairāgya); the Śiva Saṃhitā''s
  emphasis on renouncing obstacles parallels this principle. Divergence: Patañjali presents obstacles
  (antarāyas) as nine distractions of mind, while the Śiva Saṃhitā frames them as things actively to be
  renounced, suggesting a more volitional ethical stance.


  **Ecclesiastes 3:1–8 (a time for every purpose):** Both passages suggest that wisdom involves discerning
  what belongs and what does not; a season of letting go precedes crossing into new understanding. Divergence:
  Ecclesiastes emphasizes cyclical time and acceptance of what is given, while the Śiva Saṃhitā calls
  for active renunciation as the means to transcend the cycle altogether.'
