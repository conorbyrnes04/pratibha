  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The Yogi, who practices it four times a day, purifies thereby his navel, through which the winds are purified.
abhyasa: Today, bring awareness to your navel center (manipūra cakra) during one conscious breathing session. Notice the quality
  of breath and sensation there without forcing. Simply observe whether the region feels open, constricted, warm, or still.
  Return to this spot gently four times throughout the day, even for one breath each time, as a small gesture of continuity.
