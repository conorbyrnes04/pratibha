title: The Yogi, who practices it four times a day…
unit_type: verse
commentary: 'This brief teaching links disciplined repetition (four daily sessions) to a specific physiological and energetic
  purification centered at the navel center. The passage suggests that systematic practice creates a cascade of refinement:
  the navel itself becomes purified, which then purifies the winds (prāṇa) that move through it. This reflects the Śiva Saṃhitā''s
  non-dual vision—that liberation is not separate from the body''s subtle channels, but flows through their clarification.



  Key Terms



  **Yogi** — One who practices yoga; here, one engaged in systematic spiritual discipline.

  **winds (prāṇa)** — The vital life-force or breath-energy that moves through the subtle body''s channels; its quality and
  flow are central to liberation.

  **navel (nābhi)** — The energetic center at the abdomen, a seat of power and transformation in subtle anatomy.



  Cross-Tradition Resonances



  **Haṭha Yoga Pradīpikā, I.13:** Both texts teach that purification of the subtle body (nāḍīs and cakras) is prerequisite
  to higher states; repetition and discipline are the means. Divergence: The Haṭha Yoga Pradīpikā emphasizes the role of the
  guru more explicitly; this passage assumes the practice is already known and focuses on frequency and result.


  **Tao Te Ching, 15:** Both traditions hold that subtle mastery of inner currents (winds/dào) leads to profound transformation;
  the body is not separate from the path. Divergence: The Tao Te Ching speaks of effortless action (wú wéi); the Śiva Saṃhitā
  here emphasizes disciplined repetition as the engine of change.


  **Dhammapada, 183:** Both affirm that steady, repeated practice (discipline) is the path to liberation; the body and breath
  are instruments of awakening. Divergence: The Dhammapada frames discipline in ethical and mental terms; the Śiva Saṃhitā
  grounds it in subtle physiology and energetic anatomy.'
