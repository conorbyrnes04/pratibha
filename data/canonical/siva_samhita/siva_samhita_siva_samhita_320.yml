  body: 'The following are the obstacles which dharma interposes: ablutions, worship of deities, observing
    the sacred days of the moon, fire sacrifice, hankering after moksha, vows and penances, fasts, religious
    observances, silence, the ascetic practices, contemplation and the object of contemplation, mantras,
    and alms-giving, world-wide fame, excavating and endowing of tanks, wells, ponds, convents and groves:
    sacrifices, vows of starvation, Chandrayana, and pilgrimages. Jnana (Knowledge-obstacles).'
