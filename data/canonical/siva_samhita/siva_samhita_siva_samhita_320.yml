title: The following are the obstacles which dharma…
unit_type: verse
commentary: 'This passage presents a striking inversion: the text lists practices traditionally considered
  spiritually meritorious—worship, fasting, pilgrimage, mantras, even the pursuit of liberation itself—as
  *obstacles* to true realization. The passage suggests that attachment to the *form* of practice, the
  *doing* of dharma, can obscure direct knowledge (jñāna). This reflects a non-dual teaching: the goal
  is not accumulation of merit or completion of rituals, but a shift in consciousness that transcends
  the doer-doing-deed framework entirely.



  Key Terms



  **jñāna** — Direct, non-dual knowledge or gnosis; in this context, the realization that transcends all
  practices and their fruits.

  **dharma** — Duty, righteousness, or the cosmic order; here, the conventional religious and ethical
  framework that can become an obstacle if clung to.



  Cross-Tradition Resonances



  **Tao Te Ching 48: ''In pursuit of learning, every day something is acquired. In pursuit of Tao, every
  day something is dropped.'':** Both texts suggest that accumulation—of practices, knowledge, merit—can
  obscure the ultimate realization. The path requires *un-doing* rather than doing. Divergence: The Tao
  Te Ching emphasizes natural simplicity and non-action (wu wei); the Śiva Saṃhitā, while critiquing attachment
  to practice, still affirms that yoga practice itself (when freed from ego-attachment) leads to liberation.


  **Meister Eckhart: ''A person should be so poor that he is not and has not a place where God can work.'':**
  Both point to the need to empty oneself of spiritual ambition and the sense of ''doer'' so that realization
  can occur unobstructed. Divergence: Eckhart frames this as poverty before God; the Śiva Saṃhitā frames
  it as the dissolution of the subject-object duality through non-dual knowledge.


  **Dhammapada 21: ''Heedfulness is the path to the Deathless; heedlessness is the path to death.'':**
  Both traditions warn against mechanical or unconscious practice; true practice requires discernment
  and presence. Divergence: The Dhammapada emphasizes vigilant ethical mindfulness as the path; the Śiva
  Saṃhitā suggests that even vigilant practice can become an ego-trap unless it leads to the dissolution
  of the practitioner.'
