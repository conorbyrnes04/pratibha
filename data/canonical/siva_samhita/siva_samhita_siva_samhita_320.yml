  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: 'The following are the obstacles which dharma interposes: ablutions, worship of deities,
  observing the sacred days of the moon, fire sacrifice, hankering after moksha, vows and penances, fasts,
  religious observances, silence, the ascetic practices, contemplation and the object of contemplation,
  mantras, and alms-giving, world-wide fame, excavating and endowing of tanks, wells, ponds, convents
  and groves: sacrifices, vows of starvation, Chandrayana, and pilgrimages. Jnana (Knowledge-obstacles).'
abhyasa: 'Today, notice one spiritual or ethical practice you undertake. Rather than performing it for
  its fruit (merit, purification, progress), pause and ask: *Am I doing this, or is it happening through
  me?* This simple inquiry can loosen the knot of the practitioner''s ego that the text warns against.'
