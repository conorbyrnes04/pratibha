  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Sitting in the padmasana posture, renouncing the society of men, let the Yogi press the two vijnana nadis (vessels
  of consciousness, perhaps coronal arteries) with his two fingers.
abhyasa: 'Today, sit upright in a comfortable cross-legged position. Without forcing or straining, bring awareness to the
  subtle channels on either side of your spine or crown. Place your index and middle fingers gently at the temples or sides
  of the head. Breathe slowly and notice: does attention itself shift when you hold this gesture? What is the difference between
  physical pressure and conscious attention? Sit for 3–5 minutes, observing without judgment.'
