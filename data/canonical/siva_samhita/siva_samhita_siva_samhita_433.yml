  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When at the time of death, the Yogi contemplates on this lotus, leaving this life, that holy
  one is absorbed in the Paramatma.
abhyasa: Today, sit quietly and bring attention to the crown of your head. Without forcing or visualizing
  elaborately, simply rest awareness there for a few minutes, as if listening from that point. Notice
  what shifts in your sense of self when attention rests at the highest point of the body rather than
  the head or heart. This is a gentle, non-technical way to familiarize yourself with the direction the
  passage points toward.
