  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This Jalandhara-bandha is the giver of success to the practitioner; the Yogi desirous of
  success should practice it daily. (6) Mula-bandha.
abhyasa: 'Today, sit quietly and bring gentle attention to the throat region. Without forcing, notice
  the natural softness there. Then, in a single breath cycle, lightly draw the chin toward the chest (or
  simply draw the throat inward) while observing what shifts in your awareness or breath quality. Release
  gently. Repeat 3–5 times. Notice: does the quality of your attention change? This is an invitation to
  feel, not to perform.'
