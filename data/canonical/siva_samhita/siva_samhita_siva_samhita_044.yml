translation: Suggested by the Lords of suggestion comes out avidya. It is born of untruth, and its very
  essence is unreal. How can this world with such antecedents (foundations) be true? The Spirit.
abhyasa: 'Sit quietly and notice one fixed belief about yourself or the world you habitually treat as
  solid truth. Gently ask: ''Is this my direct experience, or a suggestion I have accepted?'' Observe
  without judgment whether that belief loosens or reveals its constructed nature. Rest briefly in the
  space of not-knowing.'
