  body: 'The wise Yogi in an assembly should utter words of highest good, but should not talk much: he eats a little to keep
    up his physical frame; let him renounce the company of men, let him renounce the company of men, verily, let him renounce
    all company: otherwise he cannot attain mukti (salvation); verily, I tell you the truth.'
