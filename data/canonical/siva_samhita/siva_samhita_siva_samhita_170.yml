abhyasa: Today, sit quietly and bring awareness to your breath as it moves through your body. Without
  forcing, notice where the breath flows freely and where it seems restricted or shallow. This simple
  observation honors the teaching that channels must be clear; it requires no technique, only honest attention
  to what is already present.
