translation: The Yogi, worshipper of the lotus-feet of his Guru, should in order to obtain quick success
  in Yoga drink milk or nectar in this way.
abhyasa: Today, reflect on a teaching or guide you genuinely respect. Bring to mind one specific instruction
  or insight they have offered. Rather than merely thinking about it, sit quietly and allow that teaching
  to settle into your body and breath—as if you were receiving it fresh. Notice what shifts when you approach
  learning with reverence rather than skepticism.
