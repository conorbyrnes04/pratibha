  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Pointing the tongue upwards, when the yogi can drink the nectar flowing from the moon (situated
  between the two eye-brows), within a month he certainly would conquer death.
abhyasa: Sit quietly and gently press the tip of your tongue toward the soft palate at the roof of your
  mouth. Breathe slowly and notice any sensation of coolness or flow in the center of your forehead or
  between the eyebrows. Do not strain. Simply observe for 5–10 minutes whether awareness naturally gathers
  there. This is a threshold practice—not the full technique, but an invitation to feel where the passage
  points.
