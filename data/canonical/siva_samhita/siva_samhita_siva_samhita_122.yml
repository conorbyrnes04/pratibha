translation: This fire increases life, and gives strength and nourishment, makes the body full of energy,
  destroys all diseases, and gives health.
abhyasa: 'Sit quietly and bring attention to the natural warmth in your belly and heart. Without forcing,
  notice any sense of aliveness or subtle heat. Breathe gently and ask: where do I feel most vital today?
  Rest there for a few minutes, not to generate fire artificially, but to recognize the life-force already
  present.'
