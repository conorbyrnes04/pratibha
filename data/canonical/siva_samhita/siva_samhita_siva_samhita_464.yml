title: In the sinus of the forehead there is the…
unit_type: verse
commentary: 'This passage locates a subtle lunar principle in the space between the eyebrows—a site of
  concentrated awareness in yogic practice. The ''sixteen digits'' reference the moon''s fullness and
  completeness; the ''nectar'' suggests regenerative or liberating energy accessible through sustained
  inner vision. The claim that mere sight of this inner moon burns karmic obscuration reflects the text''s
  non-dual teaching: direct perception of subtle reality, not intellectual effort, is the agent of transformation.



  Key Terms



  **kalas** — Digits or phases; here, the sixteen phases of the full moon, symbolizing completeness and
  fullness of subtle lunar energy.

  **nectar (amṛta)** — In yogic anatomy, the subtle essence or immortal fluid associated with the moon
  center; liberation or regenerative energy.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Katha Upaniṣad 1.1.1):** Both teach that direct inner vision—not mere intellectual
  knowledge—liberates. The Upaniṣads speak of ātman (self) realized through meditation; the Śiva Saṃhitā
  locates that realization in the subtle moon. Divergence: The Upaniṣads emphasize the formless, attributeless
  Self; this passage anchors practice in a specific, luminous form within the body.


  **Taoist inner alchemy (Neigong texts):** Both traditions locate subtle energy centers in the body and
  teach that refined perception of these centers leads to spiritual transformation and ''immortality''
  (or liberation). Divergence: Taoist practice often emphasizes circulation of energy through channels;
  the Śiva Saṃhitā here stresses stationary contemplation and the burning away of karma through sight
  alone.


  **Meister Eckhart, ''God is in the innermost ground'':** Both suggest that the divine or liberating
  principle is accessed not through external seeking but through turning awareness inward to a hidden,
  luminous center. Divergence: Eckhart''s ''ground'' is formless and transcendent; the Śiva Saṃhitā''s
  moon is a subtle form within embodied consciousness, part of a mapped yogic anatomy.'
