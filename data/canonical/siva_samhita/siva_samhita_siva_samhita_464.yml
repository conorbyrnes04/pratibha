  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In the sinus of the forehead there is the nectar-containing moon, having sixteen digits (kalas,
  i.e, full). Let him contemplate on this stainless one. By constant practice, he sees it in three days.
  By merely seeing it, the practitioner burns all his sins.
abhyasa: Sit quietly and bring your attention to the space between and slightly above the eyebrows (the
  'sinus of the forehead'). Without strain, hold awareness there for 5–10 minutes, as if gazing inward
  at a luminous point. Notice any subtle sensations, light, or coolness. Return gently each time attention
  wanders. This is not visualization—you are resting attention in the place the passage names.
