  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Even the lordly house-holders obtain success by japa, if they perform the duties of Yoga
  properly. Let, therefore, a householder also exert in Yoga (his wealth and condition of life are no
  obstacles in this).
abhyasa: 'Today, choose a single mantra or sacred phrase (or simply the breath-sound ''so hum''). Repeat
  it quietly for 10 minutes, either during a daily task (walking, washing) or in formal sitting. Notice:
  does the repetition create a subtle shift in attention or presence? The point is not perfection but
  consistency—the householder''s yoga begins with small, honest effort.'
