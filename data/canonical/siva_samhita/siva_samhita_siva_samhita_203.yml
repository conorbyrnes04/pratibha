abhyasa: Sit quietly today and observe one habitual action—a gesture, word, or thought pattern. Without
  judgment, notice its origin (what prompted it), its unfolding (how it moves through you), and its effect
  (what follows). This simple witnessing mirrors the yogi's gradual awakening to karma's texture.
