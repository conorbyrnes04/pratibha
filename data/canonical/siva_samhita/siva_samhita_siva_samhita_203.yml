title: When he, by the practice of Yoga, acquires power of…
unit_type: verse
commentary: 'This passage describes a progressive attainment in yoga practice: through disciplined work,
  the practitioner develops kriya shakti (the power to act with precision and effect), pierces the subtle
  energy centers (chakras), and arrives at parichaya—a stable, intimate knowing of one''s true nature.
  At this threshold, the yogi gains direct perception of karma''s threefold operation (past, present,
  future consequences of action), moving from intellectual understanding to lived vision. The passage
  suggests that liberation is not merely theoretical but experiential, earned through systematic practice
  and ripening into clarity.



  Key Terms



  **kriya shakti** — The power of action; the capacity to act with conscious precision and transformative
  force, developed through yoga practice.

  **parichaya** — Intimate, stable knowing or familiarity; a condition of direct, unshakable recognition
  of one''s true nature.

  **chakras** — Energy centers within the subtle body through which prāṇa (life force) moves; their piercing
  or awakening is a marker of yogic advancement.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.17 (on karma yoga and action):** Both texts affirm that right action, performed with
  awareness and discipline, leads to liberation and direct seeing of reality''s nature. Divergence: The
  Gītā emphasizes duty and surrender to the divine will; the Śiva Saṃhitā emphasizes the yogi''s own systematic
  piercing of subtle anatomy.


  **Patañjali''s Yoga Sutras 3.16 (on siddhis and transformation):** Both describe yoga as a progressive
  unveiling of powers and perceptions—the yogi moves from effort to direct knowledge. Divergence: Patañjali
  warns against attachment to siddhis (powers) as obstacles; the Śiva Saṃhitā presents the vision of karma
  as a natural fruit of maturation, not a distraction.


  **Upaniṣads (e.g., Katha 2.3.9, on the atman):** Both point to a knowing that transcends ordinary perception—a
  direct seeing of reality''s workings that comes through practice and grace. Divergence: The Upaniṣads
  often emphasize sudden recognition or grace; the Śiva Saṃhitā stresses methodical, embodied practice
  through chakra work and prāṇāyāma.'
