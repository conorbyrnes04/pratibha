abhyasa: Sit quietly. Gently press your right thumb into your mouth (between teeth and inner cheek), keeping
  the gesture soft and natural. Breathe normally through the nose. Notice what shifts in your awareness—does
  the gesture create a subtle pause or inward turn? Spend 2–3 minutes observing without forcing. This
  is not mastery but acquaintance with how a small physical anchor can alter the quality of presence.
