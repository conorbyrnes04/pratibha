  body: Thus believing in widely different doctrines, with faces turned away from the supreme goal, they
    think, according to their understanding and education, that this universe is without God; others believe
    there is a God, basing their assertions on various irrefutable arguments, founded on texts declaring
    difference between soul and God, and anxious to establish the existence of God.
