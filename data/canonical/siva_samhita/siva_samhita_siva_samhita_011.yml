  collection: Śiva Saṃhitā
  category: yoga
  chapter: On the One Reality (Jñāna)
  verse: 1.13-14
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Thus believing in widely different doctrines, with faces turned away from the supreme goal,
  they think, according to their understanding and education, that this universe is without God; others
  believe there is a God, basing their assertions on various irrefutable arguments, founded on texts declaring
  difference between soul and God, and anxious to establish the existence of God.
