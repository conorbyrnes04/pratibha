translation: Thus believing in widely different doctrines, with faces turned away from the supreme goal,
  they think, according to their understanding and education, that this universe is without God; others
  believe there is a God, basing their assertions on various irrefutable arguments, founded on texts declaring
  difference between soul and God, and anxious to establish the existence of God.
abhyasa: 'Notice today one belief you hold as certain—about the nature of reality, God, or the self. Observe:
  did you arrive at it through direct experience, or through education, argument, and inherited conviction?
  Without judgment, sit with the gap between what you believe and what you have actually verified in your
  own awareness.'
practice: 'Notice today one belief you hold as certain—about the nature of reality, God, or the self.
