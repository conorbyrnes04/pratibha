abhyasa: 'Today, before any formal practice, pause and ask: Am I approaching this teaching with genuine seeking, or with a
  divided mind? Notice where your attention actually rests—on outcomes, on comparison with others, on doubt. Return it once
  to simple intention: ''I am here to understand what is true.'' Let that orientation settle for a few breaths.'
