  body: I, Ishvara, the lover of my devotees, and Giver of spiritual emancipation to all creatures, thus declare the science
    of yoganasasana (the exposition of Yoga). In it are discarded all those doctrines of disputants, which lead to false knowledge.
    It is for the spiritual disenthralment of persons whose minds are undistracted and fully turned towards Me. Differences
    of opinion.
