translation: The Four-faced and gods can hardly obtain this knowledge, it is the most invaluable treasure
  of the Yogis; this mystery of the Brahmarandhra should be kept a great secret. The Moon of Mystery.
abhyasa: 'Today, sit quietly and simply notice the crown of your head—not as anatomy, but as a threshold
  of awareness. Without forcing or visualizing, ask: What is the highest point of my own consciousness?
  Sit with that question for five minutes, observing what arises, without grasping for experience.'
