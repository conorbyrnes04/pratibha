unit_label: Chapter 5 — 73
title: By habitual exercise, he gets success in six months;
unit_type: verse
commentary: 'This passage presents a direct causality: sustained practice (abhyāsa) produces measurable
  transformation within a defined timeframe, culminating in the movement of vital force (vāyu) into the
  central channel (suṣumnā). The text then links this physiological shift to psychological mastery—control
  of mind, breath, and generative force—and claims this integration yields liberation (success in both
  worlds). The passage is notably practical and non-mystical: it promises concrete results to the sincere
  practitioner, grounding spiritual attainment in disciplined habit rather than grace or exceptional talent.



  Key Terms



  **suṣumnā** — The central energy channel in the subtle body, through which awakened vital force (kuṇḍalinī)
  is said to rise; the passage identifies entry into this channel as a fruit of sustained practice.

  **vāyu** — Vital breath or life-force; in this context, the subtle energetic current that, through practice,
  is directed into the central channel rather than dispersed through peripheral channels.

  **abhyāsa** — Habitual, disciplined practice or exercise; the passage emphasizes this as the engine
  of spiritual progress, implying that consistency matters more than intensity or innate ability.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.14 (Patañjali): ''sa tu dīrgha-kāla-nairantarya-satkāra-āsevito dṛḍha-bhūmiḥ'' (practice
  becomes firmly grounded when attended to for a long time, without interruption, and with sincere devotion):**
  Both texts ground spiritual attainment in sustained, habitual effort rather than sudden grace; both
  emphasize consistency over intensity. Divergence: The Yoga Sūtra frames practice as a general principle
  of stabilization; the Śiva Saṃhitā specifies a concrete timeline (six months) and a physiological marker
  (suṣumnā entry), suggesting a more embodied, measurable path.


  **Bhagavad Gītā 6.35 (Kṛṣṇa to Arjuna): ''abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate'' (by practice
  and dispassion, the mind is seized):** Both texts affirm that disciplined practice (abhyāsa) is the
  primary means of mental transformation and spiritual attainment. Divergence: The Gītā pairs practice
  with dispassion (vairāgya) as equally necessary; the Śiva Saṃhitā emphasizes practice alone and promises
  tangible physiological and worldly fruits, suggesting a more immanent, less renunciatory path.


  **Heraclitus, Fragment 41: ''all things flow, but the character of a man is his fate'' (or: ''ethos
  is destiny''):** Both suggest that repeated action and habit shape one''s inner nature and ultimate
  condition; practice is not external imposition but the cultivation of one''s true nature. Divergence:
  Heraclitus speaks of character and fate in ethical and existential terms; the Śiva Saṃhitā locates transformation
  in the subtle body and promises liberation, a metaphysical outcome foreign to pre-Socratic philosophy.'
