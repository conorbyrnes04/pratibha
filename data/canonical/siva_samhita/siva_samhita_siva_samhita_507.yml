  body: In the heart is the bija of love, beautiful as the bandhuk flower {klim). In the space between
    the two eye- brows {i.e., in the Ajna lotus), is the bija of Sakti {strim), brilliant as tens of millions
    of moons. These three seeds should be kept secret - they give enjoyment and emancipation. Let the
    Yogi repeat these three mantras {i.e., Om, aim, klim, and strim) and try to attain success.
