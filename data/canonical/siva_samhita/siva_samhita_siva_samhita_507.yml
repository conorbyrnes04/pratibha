  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In the heart is the bija of love, beautiful as the bandhuk flower {klim). In the space between the two eye- brows
  {i.e., in the Ajna lotus), is the bija of Sakti {strim), brilliant as tens of millions of moons. These three seeds should
  be kept secret - they give enjoyment and emancipation. Let the Yogi repeat these three mantras {i.e., Om, aim, klim, and
  strim) and try to attain success.
abhyasa: Sit quietly and bring attention to the space between your eyebrows. Without strain, silently repeat the syllable
  'strim' for a few breaths, simply noticing any quality of presence or subtlety that arises. Then shift attention to the
  heart center and repeat 'klim' with the same gentle awareness. This is not a substitute for formal practice with a teacher,
  but a way to sense how the tradition locates sacred sound within the body itself.
