  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The most important of these nadis are fourteen, distributed in different parts of the body
  and performing various functions. They are either weak or strong, and the prana flows through them.
  The six Chakras. 1. Muladhar chakra.
abhyasa: 'Today, sit quietly and bring awareness to the base of your spine (the location of muladhara).
  Without forcing, simply notice: What sensations, temperature, or quality of presence do you detect there?
  Return to this place three times during the day as a gentle inquiry into your own subtle anatomy.'
