  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: First let the talented practitioner introduce into his own body, according to the proper
  methods, the germ- cells from the female organ of generation, by suction up through the tube of the
  urethra; restraining his own semen, let him practice copulation. If by chance the semen begins to move,
  let him stop its emission by the practice of the Yoni-mudra. Let him place the semen on the left hand
  duct, and stop further intercourse. After a while, let him continue it again. In accordance with the
  instruction of his preceptors and by uttering the sound hum, let him forcibly draw up through the contraction
  of the Apana Vayu the germ-cells from the uterus.
