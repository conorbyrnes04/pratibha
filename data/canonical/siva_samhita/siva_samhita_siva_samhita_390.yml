  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Its stalk is called Swadhisthan, the colour of the lotus is blood-red, its presiding adept
  is called Bala, and its goddess, Rakini.
abhyasa: Sit quietly and bring your awareness to the sacral region (just below the navel). Visualize a
  blood-red lotus at that location. Without forcing or straining, simply hold the image gently in mind
  for a few breaths, noticing any sensations or qualities that arise. This is a beginning; do not attempt
  prāṇāyāma or mudrā without qualified guidance.
