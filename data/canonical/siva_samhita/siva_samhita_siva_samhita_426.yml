  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The two-petalled Ajha lotus has been thus described where dwells the God Maheshwara. The
  Yogis described three more sacred stages above this. They are called vindu, nada and sakti, and are
  situated in the lotus of the forehead.
abhyasa: Sit quietly and bring your awareness to the space between your eyebrows. Without forcing or visualizing,
  simply notice any subtle sensation, pressure, or quality of attention there. Rest there for a few breaths,
  then gently expand your awareness upward along the midline of the head. This is not technique but familiarization—a
  way to begin recognizing the terrain the passage describes.
