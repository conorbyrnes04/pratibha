title: The two-petalled Ajha lotus has been thus described…
unit_type: verse
commentary: 'This passage maps a subtle anatomy of ascent, locating the divine principle (Maheshwara,
  Śiva himself) in the Ājñā cakra—the two-petalled lotus between the eyebrows—and then gestures toward
  three further refinements (bindu, nāda, śakti) that transcend even that seat. The teaching suggests
  that liberation is not a single attainment but a progressive unveiling of subtler layers of consciousness
  and energy, each with its own divine character. By naming these stages, the text invites the practitioner
  to recognize that the journey inward is also a journey upward through increasingly refined states of
  being.



  Key Terms



  **Ājñā** — The command center; the two-petalled lotus cakra located between the eyebrows, traditionally
  associated with intuition, inner sight, and the seat of Śiva in subtle anatomy.

  **bindu, nāda, śakti** — Three progressively subtle principles beyond the Ājñā: bindu (the point or
  drop, the seed of manifestation), nāda (the primordial sound or vibration), and śakti (the dynamic power
  or creative force).



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Katha Upaniṣad 1.3.12): ''The Self is smaller than the small, greater than the great.'':**
  Both texts affirm a hierarchy of subtlety—the divine is encountered in progressively refined, inward
  dimensions rather than in gross externality. Divergence: The Upaniṣads emphasize the Self as transcendent
  and unchanging; the Śiva Saṃhitā locates Śiva within a dynamic, energetic anatomy that can be traversed
  through practice.


  **Dante, *Paradiso* (ascent through celestial spheres): progressive refinement of vision and union as
  one rises.:** Both map a vertical journey through nested levels of reality, each revealing a deeper
  truth or presence. Divergence: Dante''s ascent is narrative and eschatological; the Śiva Saṃhitā''s
  is anatomical and immediate, accessible through prāṇāyāma and meditation in this life.


  **Plotinus, *Enneads* (the One beyond being, emanation through hypostases): reality unfolds from the
  most subtle to the gross.:** Both traditions recognize a cascade from undifferentiated unity (bindu,
  the One) through intermediate principles (nāda, hypostases) to manifestation. Divergence: Plotinus describes
  emanation as a metaphysical necessity; the Śiva Saṃhitā presents it as a path the individual yogi can
  consciously retrace inward.'
