  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the shadow is seen fully reflected in the field of the sky, then he obtains victory;
  and conquering the vayu, he goeseverywhere. How to invoke. 18b. At the time of the rising sun, or by
  moon, let him steadily fix his gaze on the neck of the shadow he throws; then, after sometime, let him
  look into the sky; if he sees a full grey shadow in the sky, it is auspicious.
abhyasa: At sunrise or moonrise, sit upright and gaze steadily at the shadow of your neck or head cast
  before you on the ground or wall. After several minutes of steady attention, gently shift your gaze
  upward to the open sky. Notice any subtle shifts in perception, luminosity, or form that arise. Do not
  strain; the practice is one of patient, receptive seeing. Return to this for a few minutes daily.
