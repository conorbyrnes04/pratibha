  body: When the shadow is seen fully reflected in the field of the sky, then he obtains victory; and
    conquering the vayu, he goeseverywhere. How to invoke. 18b. At the time of the rising sun, or by moon,
    let him steadily fix his gaze on the neck of the shadow he throws; then, after sometime, let him look
    into the sky; if he sees a full grey shadow in the sky, it is auspicious.
