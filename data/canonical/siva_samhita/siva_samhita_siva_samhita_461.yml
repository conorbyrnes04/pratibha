  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: I have said before that there is a force-centre (yoni) in the middle of the Sahasrara; below that is the moon;
  let the wise contemplate this.
abhyasa: 'Sit quietly and, without strain, bring awareness to the crown of the head. Rather than forcing an image, simply
  hold the intention: *There is a center here; within it, a source; below, luminosity.* Rest in that open attention for 5–10
  minutes. Notice what arises—sensation, light, stillness—without grasping.'
