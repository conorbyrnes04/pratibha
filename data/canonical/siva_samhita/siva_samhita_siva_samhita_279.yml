translation: If, in the course of the practice of this mudra, the Yogi can unite the apana with the prana
  vayu, then it becomes of course the Yoni-mudra.
abhyasa: Sit quietly and observe the natural rhythm of your breath. Without forcing, notice where you
  sense expansion (prāṇa moving upward) and where you sense settling or grounding (apāna moving downward).
  Rather than manipulating, simply witness these two currents with curiosity. This contemplation prepares
  the ground for understanding why a teacher might guide you toward their eventual meeting.
