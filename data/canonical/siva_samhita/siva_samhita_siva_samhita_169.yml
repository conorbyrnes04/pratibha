  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When this has been practiced daily, for three months, with regularity, the nadas (the vessels)
  of the body will readily and surely be purified.
abhyasa: 'Choose one simple prāṇāyāma or mudrā practice you can do daily for the next three months without
  fail—even five minutes. Mark each day completed. Notice not dramatic experiences, but subtle shifts:
  steadier breath, clearer mind, lighter body. Trust the process of regularity itself.'
