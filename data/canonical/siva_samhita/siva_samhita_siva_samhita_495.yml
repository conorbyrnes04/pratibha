abhyasa: Today, identify one teaching or instruction you have received (from a teacher, text, or tradition)
  that you have intellectually understood but not yet embodied. Rather than seeking more information about
  it, commit to one concrete practice—however small—that enacts that teaching. Notice the difference between
  knowing and doing.
