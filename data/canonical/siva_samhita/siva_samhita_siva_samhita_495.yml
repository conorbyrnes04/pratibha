  body: 'Thus constantly practicing the Self-luminous becomes manifest: here end all the teachings of
    the Guru, (they can help the student no further). Henceforth he must help himself, they can no more
    increase his reason or power, henceforth by the mere force of his own practice he must gain the Gnosis.
    1'
