title: As the space pervading the five false states of…
unit_type: verse
commentary: 'This passage uses a spatial metaphor to clarify non-dual metaphysics: just as ākāśa (space/ether)
  permeates the five material elements yet remains untouched by their transformations, so too the Spirit
  (Ātman or Brahman) pervades the manifest universe without being implicated in its flux. The teaching
  dissolves a common confusion—that consciousness is somehow tainted or bound by the world it witnesses.
  The ''five false states'' likely refers to the five gross elements (earth, water, fire, air, ether)
  or their subtle counterparts, which the text calls ''false'' not because they don''t exist, but because
  they are mutable and therefore not the ultimate reality. This establishes the metaphysical ground for
  yoga practice: liberation is the recognition of this already-present non-mixing, not an achievement.



  Key Terms



  **Spirit (Ātman)** — In this context, the unchanging consciousness that witnesses the universe but remains
  unmixed with it; the ultimate self.

  **Five false states of matter** — The five elements or their subtle forms, called ''false'' because
  they are mutable and impermanent, not because they are illusory in an absolute sense.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kena Upaniṣad, Īśa Upaniṣad):** Both teach that Brahman (ultimate reality) pervades
  all yet remains untouched; the metaphor of space and elements is classical Vedantic pedagogy. Divergence:
  The Upaniṣads emphasize this truth as the fruit of direct realization; the Śiva Saṃhitā frames it as
  the metaphysical foundation for systematic yoga practice toward that realization.


  **Bhagavad Gītā 2.24–25 (on the unchanging Ātman):** Kṛṣṇa similarly describes the Spirit as immutable
  while the body and senses undergo constant change. Divergence: The Gītā emphasizes duty and action in
  the world; the Śiva Saṃhitā uses the same non-dual principle to validate inner yogic practice and withdrawal.


  **Heraclitus (Fragment 12: ''All things flow''):** Both traditions recognize the universe as fundamentally
  mutable; both posit something stable beneath or within the flux. Divergence: Heraclitus locates stability
  in the Logos (rational principle of change itself); the Śiva Saṃhitā locates it in Spirit wholly transcendent
  to change.'
