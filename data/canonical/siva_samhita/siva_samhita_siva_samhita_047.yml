translation: As the space pervading the five false states of matter does not mix with them, so the Spirit
  does not mix with this ever-changing universe.
abhyasa: 'Today, notice one moment of change—a thought arising and passing, a sensation shifting, an emotion
  transforming. Pause and ask: what in me is aware of this change but does not itself change? Do not strain
  for an answer; simply rest in the question, allowing the metaphor of space and elements to work quietly
  in your awareness.'
