title: From sinful acts pain, from good acts happiness…
unit_type: verse
commentary: 'This passage presents a direct causal law: action (karma) produces inevitable fruit—pain from transgression,
  happiness from virtue. The Śiva Saṃhitā grounds its ethical vision not in commandment but in natural consequence, suggesting
  that beings pursue good acts instrumentally, seeking happiness as the natural result. Yet this opening statement also invites
  a deeper question central to non-dual yoga: if liberation is the ultimate aim, is happiness through good action itself a
  subtle bondage—another cycle of desire and result?



  Key Terms



  **karma (karman)** — action and its inherent consequences; here, the law that sinful acts produce pain and virtuous acts
  produce happiness



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga as skill in action):** Both texts affirm that action and its fruits are inseparable; the Gītā
  similarly teaches that one cannot escape consequence through inaction. Divergence: The Gītā emphasizes performing duty without
  attachment to fruit; the Śiva Saṃhitā passage here states the fruit plainly, without yet introducing the teaching of non-attachment.


  **Dhammapada 1 (mind precedes all things):** Both traditions root happiness and suffering in the moral quality of one''s
  deeds, not external circumstance. Divergence: The Dhammapada emphasizes mind as the originator; the Śiva Saṃhitā speaks
  of action itself as the direct cause.'
