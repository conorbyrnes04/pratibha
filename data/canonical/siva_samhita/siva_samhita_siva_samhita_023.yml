  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: From sinful acts pain, from good acts happiness, results. For the sake of happiness, men constantly perform good
  actions.
abhyasa: Today, notice one action you perform and pause to observe your *intention* behind it. Are you acting for happiness,
  for duty, for freedom, or from some mixture? Simply witness without judgment. This mirrors the Śiva Saṃhitā's invitation
  to see the link between deed and consequence clearly.
