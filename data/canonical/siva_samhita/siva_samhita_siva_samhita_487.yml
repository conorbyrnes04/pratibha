translation: Undoubtedly, by this contemplation the highest success (maha-siddhi) is obtained, by making
  the mind functionless; he himself becomes perfectly Full.
abhyasa: Today, notice one moment when your mind quiets naturally—perhaps in nature, or mid-breath. Rather
  than filling that silence, rest in it for a few breaths. Observe what remains present when thinking
  pauses. This is not achievement but recognition.
