  body: It (yija) is endowed with powers of action (motion) and sensation, and circulates throughout the
    body. It is subtle, and has a flame of fire; sometimes it rises up, and at other times it falls down
    into the water. This is the great energy which rests in the perinaem, and is called the swayambhu-linga
    (the self-born).
provenance:
  collection: Śiva Saṃhitā
  category: yoga
  chapter: On the Fruits of Yoga
  verse: '5.62'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: It (yija) is endowed with powers of action (motion) and sensation, and circulates throughout
  the body. It is subtle, and has a flame of fire; sometimes it rises up, and at other times it falls
  down into the water. This is the great energy which rests in the perinaem, and is called the swayambhu-linga
  (the self-born).
abhyasa: Sit quietly and place gentle awareness at the base of the spine (the perinaeum). Without forcing,
  simply notice the subtle sensations there—warmth, tingling, or stillness. Observe how your breath naturally
  rises and falls. Do this for 5–10 minutes as an act of recognition rather than activation, honoring
  the presence of this 'self-born' energy already at work in you.
