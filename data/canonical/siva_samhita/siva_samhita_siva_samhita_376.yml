unit_label: Chapter 5 — 62
title: It (yija) is endowed with powers of action (motion)…
unit_type: verse
commentary: 'This passage describes kuṇḍalinī (here called yija, ''that which is born'') as the fundamental
  vital force animating the body—simultaneously active and sensory, subtle yet energetically potent. The
  image of fire rising and falling into water captures the dynamic, oscillating nature of prāṇa (life-force)
  before it is awakened and directed through practice. The term ''swayambhu-linga'' (self-born, self-existent)
  suggests that this energy is not imposed from outside but is the intrinsic creative principle already
  present in the body, awaiting recognition and cultivation.



  Key Terms



  **kuṇḍalinī (yija)** — The coiled, dormant vital force residing at the base of the spine; the fundamental
  energy of consciousness and sensation in the body.

  **swayambhu-linga** — The ''self-born'' or self-existent principle; here, the intrinsic, uncreated energy-form
  at the root of the subtle body.

  **prāṇa** — Life-force or vital breath; the animating power of action and sensation that moves throughout
  the body.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15 (Lao Tzu):** Both texts describe a subtle, primordial force—the Tao—that moves
  and animates all things, rising and falling in natural cycles, and is known only through direct perception
  rather than conceptual knowledge. Divergence: The Tao Te Ching emphasizes non-action (wu-wei) and the
  formless; the Śiva Saṃhitā locates a specific, embodied energy (kuṇḍalinī) that can be awakened and
  directed through deliberate practice.


  **Heraclitus, Fragment 30 (on fire as the underlying principle):** Both invoke fire as the dynamic,
  ever-moving principle underlying reality and the cosmos; both suggest constant flux and transformation.
  Divergence: Heraclitus speaks of cosmic fire as universal law; the Śiva Saṃhitā locates a personal,
  embodied flame within the individual body that mirrors the cosmic principle.


  **Meister Eckhart, on the ''ground of the soul'':** Both describe an intrinsic, self-existent divine
  or energetic principle already present within the human being, prior to any external intervention. Divergence:
  Eckhart emphasizes stillness and emptiness as the ground; the Śiva Saṃhitā emphasizes dynamic motion
  and sensation as the nature of this ground.'
