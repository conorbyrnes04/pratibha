  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: All this universe, moveable or unmovable, has come out of Intelligence. Renouncing everything else, take shelter
  in it (Intelligence).
abhyasa: 'Today, pause three times and observe one moving thing (a person, animal, water) and one still thing (a stone, tree,
  wall). In each case, silently ask: *What awareness is aware of this?* Notice whether that awareness itself moves or remains
  unchanged. Rest briefly in that unchanging witness.'
