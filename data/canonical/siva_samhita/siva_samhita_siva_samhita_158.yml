title: Let him salute his Guru after walking three times…
unit_type: verse
commentary: 'This verse establishes the foundational relationship between student and teacher in the yoga
  tradition: reverence is expressed through ritual gesture (circumambulation, touching the feet) rather
  than mere intellectual assent. The threefold circumambulation and the specific use of the right hand
  suggest that approach to the guru is embodied and directional—not casual or abstract. This opening emphasis
  on salutation signals that the entire transmission of yoga knowledge depends on a proper relational
  ground, not on the student''s prior attainment.



  Key Terms



  **Guru** — The qualified spiritual teacher; in this context, the one who transmits yoga knowledge and
  practice. Literally ''remover of darkness.''

  **Adhikari** — The qualified student or practitioner; one who has the capacity and right relationship
  to receive teaching.



  Cross-Tradition Resonances



  **Katha Upaniṣad (1.2.7): ''This Self cannot be obtained by study, nor by intellect, nor by much hearing
  of scriptures. It is obtained by him alone whom It chooses. To such a one that Self reveals Its own
  form.'':** Both texts affirm that knowledge of the highest truth requires grace and a receptive relationship,
  not intellectual effort alone. Divergence: The Katha Upaniṣad emphasizes the Self''s choosing; the Śiva
  Saṃhitā passage emphasizes the student''s active gesture of respect and approach.


  **Bhagavad Gītā (4.34): ''Know that by long prostration, by question, and by service, the wise who have
  seen the truth will teach you knowledge.'':** Both texts locate the transmission of liberatory knowledge
  within a relationship marked by devotion, inquiry, and service to the guru. Divergence: The Gītā emphasizes
  the student''s questions and service; the Śiva Saṃhitā passage foregrounds the formal, embodied salutation
  as the entry point.'
