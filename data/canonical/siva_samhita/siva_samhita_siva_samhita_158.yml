abhyasa: Today, reflect on a teacher, mentor, or source of genuine guidance in your own life (formal or
  informal). Bring to mind the specific moment or gesture of respect you offered them, or imagine doing
  so with full attention. Notice what shifts in your posture, breath, or inner state when you genuinely
  honor a source of wisdom.
