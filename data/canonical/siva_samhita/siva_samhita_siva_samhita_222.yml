  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Verily, verily, I tell you the truth that the person never dies who contemplates by pressing
  the tongue, combined with the vital fluid of Prana.
abhyasa: Today, sit quietly and gently press the tip of your tongue against the soft palate. Without straining,
  notice the natural rhythm of your breath. For a few minutes, simply observe how breath moves through
  your body as a continuous, living presence—not 'your' breath, but the breath itself. Rest in that awareness.
  This is an entry point to the practice the verse describes.
