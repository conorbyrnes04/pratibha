  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Two fingers above the rectum and two fingers below the linga, four fingers in width, is a
  space like a bulbous root.
abhyasa: 'Sit comfortably and bring gentle awareness to the space described—between the rectum and the
  base of the spine. Without forcing or visualizing, simply notice any subtle sensation, warmth, or aliveness
  there. Breathe naturally for 2–3 minutes, letting attention rest lightly on this region. This is not
  activation but familiarization: learning to sense the body''s interior landscape as the text maps it.'
