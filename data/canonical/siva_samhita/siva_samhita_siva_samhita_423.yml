translation: From that sphere of the sun, poison exudes continuously. That excessively heating venom flows
  through the pingala.
abhyasa: 'Today, observe your own experience of heat and dryness in the body and mind. Notice which times
  of day or activities intensify these qualities. Then, in a quiet moment, practice nāḍī śodhana (alternate
  nostril breathing): begin with the left nostril (iḍā, the moon), allowing its cooler, calming quality
  to balance any excess heat. Do this without strain, simply noticing the subtle shift in your inner state.'
