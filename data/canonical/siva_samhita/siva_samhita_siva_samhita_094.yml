  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The sun and moon, agents of creation and destruction, also move in it. Ether, air, water and earth are also there.
  (2) The Nerve Centers.
abhyasa: Sit quietly and notice your own warmth (sun) and coolness (moon) in your body—perhaps warmth in the chest or belly,
  coolness in the breath or limbs. Without forcing, simply observe how these opposing qualities coexist and move. This simple
  noticing honors the passage's claim that cosmic forces are already present and active within you.
