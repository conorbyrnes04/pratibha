  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By practice of Yoga he conquers all the three qualities (i.e., good, bad and indifferent);
  and being free from all states, he is absorbed in chidakas (the ether of intelligence). A Secret.
abhyasa: Today, notice one moment when you are caught in judging experience as 'good,' 'bad,' or 'neutral.'
  Pause. Without trying to change the judgment, observe the awareness *in which* the judgment arises—the
  simple knowing itself, prior to the label. Rest there briefly. This is a small taste of the intelligence
  beyond the three qualities.
