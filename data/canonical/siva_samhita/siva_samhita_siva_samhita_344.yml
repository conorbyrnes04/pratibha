title: By practice of Yoga he conquers all the three…
unit_type: verse
commentary: 'This passage teaches that yoga practice transcends the ordinary categories by which we habitually
  organize experience—the three guṇas (sattva, rajas, tamas: purity, activity, inertia). By moving beyond
  these qualities, the practitioner dissolves into *chidakas*, a state of pure conscious awareness itself,
  described as an ''ether'' or subtle medium of intelligence. The phrase ''A Secret'' marks this as esoteric
  knowledge: not merely intellectual understanding, but a direct realization available through disciplined
  practice.



  Key Terms



  **guṇas (three qualities)** — The three fundamental modes of nature (sattva—purity/harmony, rajas—activity/passion,
  tamas—inertia/darkness) that condition all ordinary experience; yoga aims to transcend their dominion.

  **chidakas** — The ether or subtle medium of pure consciousness (cit); the non-dual ground of intelligence
  into which the practitioner is absorbed when freed from the guṇas.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.45 (''nistraiguṇyo bhava''):** Both texts call the yogi to transcend the three guṇas
  as the fruit of disciplined practice and knowledge. Divergence: The Gītā emphasizes action (karma yoga)
  and devotion as paths; the Śiva Saṃhitā centers yoga practice and the subtle body as the means.


  **Advaita Vedānta (e.g., Upaniṣads): ''Tat tvam asi'' (Thou art That):** Both point to absorption into
  non-dual consciousness as the ultimate realization, beyond subject-object duality. Divergence: Advaita
  emphasizes direct knowledge (jñāna) and negation of the world; the Śiva Saṃhitā affirms the subtle body
  and prāṇa as real vehicles for transformation.


  **Heraclitus: ''All things flow; nothing remains'' (panta rhei):** Both suggest that ordinary perception
  (bound by categories and flux) obscures a deeper, unchanging intelligence. Divergence: Heraclitus locates
  wisdom in the Logos governing flux itself; the Śiva Saṃhitā locates it in consciousness beyond all qualities
  and change.'
