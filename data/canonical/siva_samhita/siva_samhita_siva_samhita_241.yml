  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: There let him contemplate that the God of love resides in that Brahma Yoni and that he is
  beautiful like Bandhuk flower (Pentapetes pheanicia)— brilliant as tens of millions of suns, and cool
  as tens of millions of moons. Above this {Yoni) is a small and subtle flame, whose form is intelligence.
  Then let him imagine that a union takes place there between himself and that flame (the Siva and Sakti).
