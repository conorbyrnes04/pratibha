translation: By seeing it one never returns to the path of this mortal universe; let the Yogi, therefore,
  practice this with great care by the path of the Swadhisthan.
abhyasa: Sit quietly and bring gentle awareness to the region of the lower abdomen (two finger-widths
  below the navel), the seat of Svādhiṣṭhāna. Without forcing, notice what arises—sensation, warmth, fluidity,
  or simply space. Rest there for 5–10 minutes, not seeking experience but cultivating intimate familiarity
  with this center as a gateway to deeper seeing.
