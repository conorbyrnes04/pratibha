  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When this body, obtained through karma, is made the means of obtaining nirvana (divine beatitude);
  then only the carrying of the burden becomes fruitful - not otherwise.
abhyasa: 'Today, pause once and notice the weight of your body—its breath, its sitting or standing. Rather
  than dismissing it as mere flesh or burden, ask: how might this particular body, with its sensations
  and limitations, be a doorway to freedom? Hold that question without forcing an answer.'
