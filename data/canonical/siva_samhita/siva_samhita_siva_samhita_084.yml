  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: From the Annamiya Kosa (the physical vehicle) of the father, and in accordance with its past
  karma, the human soul is re-incarnated; therefore, the wise consider this beautiful body as a punishment,
  for the suffering of the effects of the past karma.
abhyasa: 'Today, notice one moment of physical discomfort or limitation—a stiff joint, fatigue, hunger.
  Rather than resisting it, pause and ask: *What is this teaching me? What pattern or debt might this
  be showing me?* Not to indulge guilt, but to observe how the body speaks the language of consequence
  and invitation.'
