translation: He who practices Yoni-Mudra is not polluted by sin, were he to murder a thousand Brahmanas
  or kill all the inhabitants of the three worlds —
abhyasa: 'Sit quietly and reflect: What actions do I perform from ego-identification, and what actions
  might arise if I felt no separate ''doer''? Without attempting the mudrā itself (which requires qualified
  guidance), contemplate the difference between acting from the sense of individual agency versus acting
  as an instrument of a larger consciousness. Notice where this distinction shifts your sense of responsibility.'
