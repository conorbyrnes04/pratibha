  body: 'He who practices the Shakti-chalan properly for two seconds, and with care, is very near to success. This mudra should
    be practiced by the Yogi in the proper posture. 8 1. These are the ten mudras whose equal there never was nor ever shall
    be: through the practice of any one of them, a person becomes a siddha and obtains success. 20'
