translation: Let the Yogi contemplate on the space between the two {ida and pingala) as Varanasi (Benares).
  The pingala also comes in the same way from the left side portion of the Ajha lotus, and goes to the
  right nostril, and has been called by us the Asi.
abhyasa: Today, in a quiet moment, sit upright and bring awareness to the space between your two nostrils.
  Without forcing the breath, simply notice the subtle channel running vertically through the center of
  your body. Mentally offer this space the reverence you might feel visiting a sacred place. Rest there
  for a few minutes, letting the visualization settle naturally.
