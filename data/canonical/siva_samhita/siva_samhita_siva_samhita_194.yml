title: The mighty Yogi having attained, through pranayama…
unit_type: verse
commentary: 'This passage presents yoga practice as a progressive unveiling of capacities that transcend
  ordinary moral and cosmic boundaries. The ''eight sorts of psychic powers'' (siddhis) and the crossing
  of ''virtue and vice'' suggest that the advanced practitioner moves beyond dualistic ethical frameworks
  into a state of freedom that encompasses all worlds. The phrase ''moves about freely'' indicates not
  escape from the world, but liberated action within it — a key teaching of non-dual yoga that realization
  is compatible with embodied life.



  Key Terms



  **siddhis (psychic powers)** — Extraordinary capacities (often listed as eight: anima, mahima, laghima,
  etc.) that arise naturally from advanced prāṇāyāma and meditation; treated in this text as signs of
  progress, not goals in themselves.

  **prāṇāyāma** — Breath regulation and vital-force control; the primary means by which the yogi attains
  the powers and transcendence described in this passage.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.45 (sattva-guṇa transcendence):** Both texts describe a state beyond dualistic moral
  categories (guṇas, virtue/vice) as the fruit of disciplined practice. Divergence: The Gītā emphasizes
  duty (dharma) even in transcendence; the Śiva Saṃhitā here stresses freedom of movement and psychic
  powers as the marker.


  **Patañjali''s Yoga Sūtra 3.37 (siddhis as obstacles):** Both texts acknowledge the eight siddhis as
  real fruits of yoga practice. Divergence: Patañjali warns that attachment to siddhis obstructs liberation;
  the Śiva Saṃhitā presents them here as signs of the yogi''s attainment without explicit caution.


  **Advaita Vedānta (Ātman-Brahman non-duality):** The crossing of virtue and vice points to the non-dual
  realization that transcends subject-object and moral duality. Divergence: The Śiva Saṃhitā grounds this
  realization in embodied prāṇāyāma and the subtle body; Advaita emphasizes jñāna (knowledge) as primary.'
