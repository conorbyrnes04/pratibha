translation: The nadi called pingala is on the right side; coiling round the central vessel, it enters
  the left nostril.
abhyasa: Today, notice the natural flow of breath through each nostril. Without forcing, observe which
  nostril feels more open or dominant. This simple awareness begins to attune you to the subtle asymmetries
  the text describes—a first step toward recognizing the body as a field of energy rather than mere matter.
