  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Now we have described the management of the air in order to remove the troubles (which await
  the Yogi); through this knowledge of vayu-sadhana vanish all sufferings and enjoyments in the circle
  of this universe.
abhyasa: 'Today, observe one complete breath cycle (inhale, hold, exhale) with full attention. Notice
  without judgment: Does the breath carry tension, ease, or neutrality? Rather than ''fixing'' it, simply
  witness how the quality of your breath mirrors your inner state. This simple noticing is the beginning
  of vāyu-sādhana—recognizing the breath as a bridge between body, mind, and the stillness beneath both.'
