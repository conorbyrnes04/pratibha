  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The lotus which is situated in the Brahmarandhra is called Sahasrara (the thousand-petalled).
  In the space in its centre, dwells the moon. From the triangular place, elixir is continually exuding.
  This moon-fluid of immortality unceasingly flows through the ida. The elixir flows in a stream - a continuous
  stream. Going to the left nostril, it receives from the Yogis the name of the "Ganges."
abhyasa: 'Sit quietly and bring attention to the space between the eyebrows and upward to the crown. Without
  forcing breath or imagination, simply notice: is there any subtle sensation of coolness, flow, or presence
  in the upper head? If so, gently follow it downward along the left side of the spine with your inner
  attention. This is not visualization but receptive noticing—a way to begin sensing the passage''s claim
  that nourishing flow already moves through you.'
