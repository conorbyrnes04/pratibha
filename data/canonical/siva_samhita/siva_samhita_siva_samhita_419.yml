  body: The lotus which is situated in the Brahmarandhra is called Sahasrara (the thousand-petalled).
    In the space in its centre, dwells the moon. From the triangular place, elixir is continually exuding.
    This moon-fluid of immortality unceasingly flows through the ida. The elixir flows in a stream - a
    continuous stream. Going to the left nostril, it receives from the Yogis the name of the "Ganges."
