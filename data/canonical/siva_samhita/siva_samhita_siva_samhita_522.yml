  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: O Great Goddess! this science of Shiva is a great science (mahavidya), it had always been
  kept secret. Therefore, this science revealed by me, the wise should keep secret.
abhyasa: 'Today, reflect on one teaching or practice you have received that has genuinely changed you.
  Consider: what made you ready to receive it? Who entrusted it to you? How do you honor that trust by
  practicing it sincerely and sharing it only with those who genuinely seek?'
