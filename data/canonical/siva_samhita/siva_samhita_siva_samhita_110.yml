abhyasa: Sit quietly for five minutes with gentle awareness resting in the pelvic region—not straining,
  but noticing warmth, sensation, or simply the space itself. Notice any shift in your sense of groundedness
  or ease. This is not technique but tender attention, offered as a beginning.
