  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: He who always contemplates on the hidden Ajha lotus, atonce destroys all the karmas of his past life, without
  any opposition.
abhyasa: 'Today, in a quiet moment, bring your inner attention to the space between your eyebrows—not straining, but gently
  settling awareness there. Hold it for a few breaths without expectation. Notice what arises: stillness, light, texture,
  or simply the quality of attention itself. This is not achievement, but familiarization with the seat the text names.'
