translation: By Guru's favour everything good relating to one's self is obtained. So the Guru ought to
  be daily served; else there can be nothing auspicious.
abhyasa: Today, reflect on a teacher, elder, or guide who has offered you genuine insight. Bring their
  presence to mind without sentimentality—notice what quality or teaching they embody. Sit with gratitude
  for that transmission, and consider one way you might honor or serve that relationship today, however
  simply.
