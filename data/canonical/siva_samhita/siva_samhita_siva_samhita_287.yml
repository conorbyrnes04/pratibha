abhyasa: Today, notice one moment of digestive ease or warmth in your belly—after eating, or during a
  breath practice. Rather than dismissing it as ordinary, pause and observe it as a sign of the body's
  own intelligence and capacity for transformation. This grounds the passage's claim in present sensation.
