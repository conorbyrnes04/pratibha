  body: By practicing it for six months, the Yogi certainly conquers death; the gastric fire is kindled,
    and there takes place an increase of the fluids of the body. 5 1. Through this, consequently, the
    vigrahasiddhi is also obtained. All the diseases of the Yogi are certainly destroyed by it.
