translation: When the skilful Yogi, by placing the tongue at the root of the palate, can drink the prana
  vayu, then there occurs complete dissolution of all Yogas (i.e., he is no longer in need of Yoga).1
abhyasa: Today, bring awareness to the roof of your mouth and the subtle sensations there. Without forcing
  or adopting any advanced technique, simply notice the natural meeting of breath and palate during a
  few minutes of quiet sitting. This grounds you in the passage's reference point—not as practice, but
  as a place of ordinary attention where the boundary between inner and outer breath begins to blur.
