  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Prohibited acts when done, will certainly bring forth sin; from performance of enjoined acts there certainly
  results merit.
abhyasa: 'Today, before a significant action, pause and ask: Is this act aligned with what I know to be right, or does it
  violate a principle I hold? Notice the quality of intention and consequence without harsh judgment—simply observe how the
  teaching lives in your own discernment.'
