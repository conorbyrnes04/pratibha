title: Prohibited acts when done, will certainly bring…
unit_type: verse
commentary: 'This verse establishes a foundational ethical framework: actions carry intrinsic moral weight—prohibition and
  injunction are not arbitrary but generative of consequence. The passage assumes a cosmos in which deed and result are woven
  together, not by external judgment but by the nature of action itself. For a yoga practitioner, this grounds practice not
  in escape from the world but in alignment with dharma (right order), making ethical conduct inseparable from the path toward
  liberation.



  Key Terms



  **dharma** — Right action, duty, or cosmic order; here implied in the distinction between prohibited and enjoined acts

  **karma** — The principle that actions (prohibited or enjoined) generate consequences (sin or merit) through their own nature



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts root spiritual practice in right action rather than renunciation
  of the world; the Gītā''s ''yoga'' and the Saṃhitā''s ethical foundation share the view that liberation is compatible with
  engaged life. Divergence: The Gītā emphasizes non-attachment to results; this passage emphasizes the inevitable fruition
  of acts themselves.


  **Heraclitus, Fragment 112 (character is destiny):** Both suggest that action and consequence are not separate—what you
  do shapes what you become, implying a moral order woven into existence. Divergence: Heraclitus speaks of character as fate;
  the Saṃhitā speaks of specific acts generating merit or sin, a more transactional view.


  **Dhammapada 1 (mind precedes all things):** Both traditions hold that ethical conduct is foundational to spiritual progress
  and that intention matters in the generation of consequence. Divergence: The Dhammapada emphasizes mind as the root; the
  Saṃhitā emphasizes the act itself and its inherent fruit.'
