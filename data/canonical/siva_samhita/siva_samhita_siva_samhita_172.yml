  body: 'The body of the person practicing the regulation of breath becomes harmoniously developed, emits
    sweet scent, and looks beautiful and lovely. In all kinds of Yoga, there are four stages of pranayama
    - 1: Arambha-avastha (the state of beginning); 2: Ghata-avastha (the state of co-operation of Self
    and Higher Self); 3: Parichaya-avastha (knowledge); 4: Nishpattiavastha (the final consummation).'
