  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The innermost of these three is chitra; it is my beloved. In that there is the subtlest of
  all hollows called Brahmarandhra.
abhyasa: Sit quietly and bring awareness to the center of your spine, from the base upward to the crown.
  Without forcing breath or visualization, simply notice the quality of stillness or presence at your
  core—the innermost channel. Rest there for five minutes, observing what arises without judgment. This
  gentle centering honors the passage's teaching that the deepest work happens in the most subtle space.
