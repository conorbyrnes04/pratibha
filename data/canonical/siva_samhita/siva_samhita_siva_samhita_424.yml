  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The venom (sun-fluid of mortality) which flows there continuously in a stream goes to the
  right nostril, as the moon-fluid of immortality goes to the left.
abhyasa: Today, sit quietly and observe your natural breath without forcing it. Notice which nostril feels
  more open or active. Simply witness this asymmetry for 5–10 minutes. This is not a technique but an
  invitation to perceive what the text describes as already flowing within you.
