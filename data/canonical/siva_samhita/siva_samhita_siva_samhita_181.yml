unit_label: Chapter 3 — 38
title: When one is well established in his practice, then…
unit_type: verse
commentary: 'This passage suggests a paradox central to yoga practice: mastery eventually transcends the
  very disciplines that created it. The text acknowledges that rigorous observance of restrictions (dietary,
  temporal, postural) is necessary for the beginner, but as stability deepens, the practitioner''s own
  refined nature becomes the guide. The emphasis on frequent, moderate eating and consistent breath retention
  (kumbhaka) indicates that liberation is not achieved through harsh asceticism but through intelligent,
  sustainable practice—a teaching that democratizes yoga by making it accessible to householders rather
  than renunciates alone.



  Key Terms



  **kumbhaka** — Retention of breath; a foundational prāṇāyāma technique in which the breath is held after
  inhalation or exhalation to deepen prāṇic control and subtle-body work.

  **practice (sādhana)** — Disciplined, sustained effort toward realization; the text implies that consistency
  and gradual establishment matter more than intensity or austerity.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16 — ''Yoga is not for him who eats too much, nor for him who eats too little… but
  for him who is moderate in eating and recreation.'':** Both texts prize moderation and balance over
  extremes; both see practice as a middle path. Divergence: The Gītā emphasizes balance as the permanent
  rule, while the Śiva Saṃhitā suggests that rules themselves eventually dissolve in mastery.


  **Patañjali''s Yoga Sūtra 1.14 — ''Practice becomes firmly grounded when attended to for a long time,
  without interruption, and with sincere devotion.'':** Both texts stress consistency and duration as
  the foundation of stable realization. Divergence: Patañjali does not explicitly address the transcendence
  of rules; the Śiva Saṃhitā introduces the idea that establishment itself liberates one from external
  constraint.


  **Meister Eckhart — ''When the soul has thrown off all that is foreign to it, then it is unified and
  at rest; then it needs no more works.'':** Both suggest that mature practice culminates in a state where
  external discipline becomes unnecessary because the practitioner''s nature is already aligned. Divergence:
  Eckhart speaks of the soul''s union with God; the Śiva Saṃhitā frames it as the stabilization of prāṇa
  and subtle-body awareness within a non-dual metaphysics.'
