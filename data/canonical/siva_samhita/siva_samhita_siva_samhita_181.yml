translation: When one is well established in his practice, then he need not observe these restrictions.
  The practitioner should eat in small quantities at a time, though frequently; and should practice kumbhaka
  daily at the stated times.
abhyasa: 'Today, notice one restriction or rule you follow in your practice (whether dietary, temporal,
  or postural). Rather than blindly obeying it, pause and ask: Does this serve my present condition, or
  am I clinging to it from habit? If it serves, practice it with full awareness. If it no longer does,
  consider what genuine stability might ask of you instead.'
