title: He who contemplates on this, standing or walking…
unit_type: verse
commentary: 'This verse asserts that contemplative awareness—maintained across all states and postures
  of ordinary life—creates a kind of spiritual immunity to karmic entanglement. The passage does not claim
  the practitioner becomes incapable of harmful action, but rather that such action, if it occurs, does
  not ''touch'' or bind the one whose mind remains established in contemplation. This reflects the non-dual
  teaching that liberation is not escape from the world, but a shift in the locus of identity: the witness-consciousness
  remains untouched by what the body-mind may do.



  Key Terms



  **contemplates (dhyāna)** — sustained meditative awareness or reflection; here, a continuous inward
  attention maintained even during ordinary activity

  **sins (pāpa)** — actions that bind the self through karma; here, understood as unable to bind one whose
  consciousness remains rooted in contemplation



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts teach that right action flows from inner
  steadiness; the fruit of yoga is freedom from binding attachment to outcomes. Divergence: The Gītā emphasizes
  duty and right action itself; the Śiva Saṃhitā here stresses that contemplative awareness itself—independent
  of action—confers protection.


  **Meister Eckhart (detachment as the highest virtue):** Both suggest that a certain non-attachment or
  inner distance from the flux of doing liberates the soul from moral entanglement. Divergence: Eckhart
  frames this through Christian negation and divine union; the Śiva Saṃhitā grounds it in the metaphysics
  of witness-consciousness and subtle-body practice.


  **Heraclitus (the observer and the flux):** Both imply a consciousness that remains stable while the
  world of becoming flows around it. Divergence: Heraclitus emphasizes the logos in flux itself; the Śiva
  Saṃhitā posits a transcendent witness-self beyond flux.'
