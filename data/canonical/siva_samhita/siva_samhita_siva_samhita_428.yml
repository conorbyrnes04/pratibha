abhyasa: 'Today, during or after your meditation, notice without judgment any impulse to ''do more''—add
  a mantra, adopt a posture, recite a prayer. Simply observe: has the quality of your stillness already
  answered what you sought through that form? Rest there, if only for a breath.'
