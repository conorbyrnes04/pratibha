  body: The great Yogi destroys by sixteen pranayamas the various virtues and vices accumulated in his
    past life. 5 1. This pranayama destroys sin, as fire burns away a heap of cotton; it makes the Yogi
    free from sin; next it destroys the bonds of all his good actions. 12
