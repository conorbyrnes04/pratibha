translation: The great Yogi destroys by sixteen pranayamas the various virtues and vices accumulated in
  his past life. 5 1. This pranayama destroys sin, as fire burns away a heap of cotton; it makes the Yogi
  free from sin; next it destroys the bonds of all his good actions. 12
abhyasa: 'Today, observe one conscious breath cycle (inhale, hold, exhale) with the intention of witnessing—without
  judgment—both a past action you regret and one you are proud of. Notice how both arise in memory with
  equal weight. This mirrors the teaching: both bind. Return to the breath as the constant witness beyond
  both.'
