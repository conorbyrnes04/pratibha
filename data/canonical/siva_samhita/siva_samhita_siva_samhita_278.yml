  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Pressing well the anus with the heel, forcibly draw upwards the apana vayu slowly by practice.
  This is described as the Mula-bandha - the destroyer of decay and death.
abhyasa: Sit quietly for a few breaths. On an exhale, gently engage the pelvic floor (as if pausing urination
  midstream), hold briefly, and notice any subtle shift in your sense of energy or stability. Release
  on the inhale. Repeat 3–5 times. This is not the full practice—only a respectful acknowledgment of the
  passage's anatomical reference. Formal practice requires qualified guidance.
