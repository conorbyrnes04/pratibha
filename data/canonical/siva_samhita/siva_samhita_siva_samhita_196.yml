  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: 'The Yogi acquires the following powers: vakya siddhi (prophecy), transporting himself everywhere
  at will (kamachari), clairvoyance (duradristhi), clairaudience (durashruti), subtle-sight (shushma-drishti),
  and the power of entering another''s body (parakaypravesana), turning base metals to gold by rubbing
  them with his excrements and urine, and the power of becoming invisible, and lastly, moving in the air.
  II. The Ghata Avasta.'
