  body: 'The Yogi acquires the following powers: vakya siddhi (prophecy), transporting himself everywhere
    at will (kamachari), clairvoyance (duradristhi), clairaudience (durashruti), subtle-sight (shushma-drishti),
    and the power of entering another''s body (parakaypravesana), turning base metals to gold by rubbing
    them with his excrements and urine, and the power of becoming invisible, and lastly, moving in the
    air. II. The Ghata Avasta.'
