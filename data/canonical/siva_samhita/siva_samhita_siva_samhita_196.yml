title: 'The Yogi acquires the following powers:'
unit_type: verse
commentary: 'This passage catalogs the siddhis (powers) that arise as byproducts of yogic practice, presented
  matter-of-factly within a graduated framework of attainment (here, the Ghata Avasta or ''pot stage'').
  The list moves from subtle perceptual refinements (prophecy, clairvoyance, clairaudience) through increasingly
  extraordinary capacities (entering another''s body, transmuting matter, invisibility, levitation), suggesting
  a continuum rather than a hierarchy of value. The Śiva Saṃhitā''s inclusion of such powers—without dwelling
  on them as the goal—reflects a non-dual teaching that treats even miraculous abilities as natural consequences
  of aligning individual consciousness with universal principles, not as ends in themselves.



  Key Terms



  **siddhis** — Powers or perfections that naturally arise as fruits of yogic practice; here enumerated
  as vakya siddhi, kamachari, duradristhi, durashruti, shushma-drishti, parakaypravesana, and others.

  **Ghata Avasta** — The ''pot stage'' or vessel stage; one of the graduated stages of yogic attainment
  in which the subtle body is refined and powers begin to manifest.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, III.16–53 (on vibhutis/powers):** Both texts systematically enumerate siddhis
  as natural outcomes of samadhi and refined perception, treating them as verifiable phenomena rather
  than myths. Divergence: Patañjali warns explicitly against attachment to powers as obstacles to kaivalya
  (liberation); the Śiva Saṃhitā passage presents them more neutrally, within a householder''s path, without
  the cautionary frame.


  **Meister Eckhart, on the soul''s union with God producing ''works without willing'':** Both suggest
  that extraordinary capacities emerge naturally from deep alignment with reality, not through willful
  striving or ego-driven desire. Divergence: Eckhart frames this within Christian mystical theology and
  divine grace; the Śiva Saṃhitā grounds it in prāṇa, subtle anatomy, and non-dual metaphysics.


  **Daodejing, ch. 15 (on the sage''s subtle mastery appearing effortless):** Both traditions suggest
  that true power operates through refinement and alignment rather than force, and manifests in ways that
  seem paradoxical to ordinary perception. Divergence: The Daodejing emphasizes wu-wei (non-action) and
  concealment; the Śiva Saṃhitā explicitly names and catalogs powers, suggesting they are real and knowable,
  not merely ineffable.'
