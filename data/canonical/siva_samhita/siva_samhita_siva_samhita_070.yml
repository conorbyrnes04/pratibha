title: Akasa has one quality;
unit_type: verse
commentary: 'This passage presents a classical enumeration of the five elements (mahābhūtas) and their sensory qualities (tannmātras),
  foundational to Tantric and yogic metaphysics. Each element is understood not as mere matter but as a graduated manifestation
  of subtle to gross reality, each carrying an increasing density of sensory properties. The teaching grounds the yogi''s
  understanding of the body and cosmos in a coherent hierarchy: from ākāśa (space/ether), which carries only sound, through
  air, fire, and water, to earth, which embodies all five qualities. This framework is essential for understanding how prāṇa
  (vital breath) moves through the subtle body and how the senses themselves are expressions of elemental principles.



  Key Terms



  **ākāśa** — Space or ether; the subtlest element, associated with sound as its sole quality.

  **mahābhūtas** — The five great elements (space, air, fire, water, earth) that compose all manifest reality in Tantric philosophy.

  **guṇas (qualities)** — Sensory properties or attributes: sound, touch, taste, form, and smell, progressively denser as
  elements become grosser.



  Cross-Tradition Resonances



  **Taittirīya Upaniṣad (II.1):** Both texts teach that reality unfolds from a subtle, unified source (Brahman/ākāśa) into
  increasingly differentiated elemental forms, each with its own properties. Divergence: The Upaniṣad emphasizes the non-dual
  ground from which elements emerge; the Śiva Saṃhitā presents the enumeration as a practical map for yogic understanding
  of the subtle body.


  **Empedocles (ancient Greek philosophy):** Both traditions recognize four or five fundamental elements as the building blocks
  of reality, each with distinct qualities. Divergence: Empedocles treats elements as eternal and irreducible; the Śiva Saṃhitā
  understands them as manifestations of prāṇa and consciousness, capable of being transcended through yoga.


  **Dhammapada (Pali Buddhist canon):** Both traditions teach that understanding the nature of material reality—its constituents
  and qualities—is a step toward liberation. Divergence: The Dhammapada emphasizes the impermanence and suffering inherent
  in elemental existence; the Śiva Saṃhitā uses elemental knowledge as a gateway to recognizing the non-dual consciousness
  underlying all forms.'
