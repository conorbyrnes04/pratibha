  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Akasa has one quality; air two, fire three, water four, and earth five qualities, viz, sound, touch, taste, form
  and smell. This has been declared by the wise.
abhyasa: 'Sit quietly and bring awareness to each element in turn: notice the space around and within your body (ākāśa), the
  movement of your breath (air), the warmth of your metabolism (fire), the fluidity of your blood and tissues (water), and
  the solidity of your bones and flesh (earth). As you rest on each, notice which sensory quality it carries—sound in space,
  touch in air, etc. This simple contemplation roots abstract teaching in direct embodied experience.'
