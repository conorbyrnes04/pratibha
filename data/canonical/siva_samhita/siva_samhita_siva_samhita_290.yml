  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Even while following all his desires, and without conforming to the regulations of Yoga,
  a householder can become emancipated, if he practices the Vajrondi-mudra.
abhyasa: 'Reflect today on one desire you are currently following or one regulation you are not observing.
  Rather than judging yourself, ask: what would it mean for this very condition—this householder''s life
  as it actually is—to become a doorway to freedom? Hold the question without answering it.'
