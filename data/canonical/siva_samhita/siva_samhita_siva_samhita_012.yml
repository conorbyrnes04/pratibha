  body: These and many other sages with various different denominations, have been declared in the Shastras as leaders of
    the human mind into delusion. It is not possible to describe fully the doctrines of these persons so fond of quarrel and
    contention; people thus wander in this universe, being driven away from the path of emancipation. Yoga the only true method
