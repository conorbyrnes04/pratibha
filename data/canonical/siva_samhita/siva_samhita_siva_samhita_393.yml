  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Death is eaten by him, he is eaten by none; he obtains the highest psychic powers like anima,
  laghima, etc. The vayu moves equably throughout his body; the humours of his body are also increased;
  the ambrosia exuding from the ethereal lotus also increases in him.
abhyasa: Sit quietly and observe the natural flow of breath through your body for five minutes. Notice
  where the breath moves freely and where it seems blocked or uneven. Without forcing, simply witness
  this movement as the vāyu (vital air) moving through you. This simple observation begins to align awareness
  with the subtle energies the text describes.
