unit_label: Chapter 5 — 78
title: Death is eaten by him, he is eaten by none;
unit_type: verse
commentary: 'This passage describes the culmination of successful yogic practice: the practitioner transcends
  mortality itself, gaining mastery over the subtle forces (vāyu) and the body''s vital essences. The
  reference to ''psychic powers'' (siddhis) like anima and laghima—the ability to become infinitesimal
  or weightless—signals that liberation is not merely philosophical but embodied and experiential. The
  ''ambrosia exuding from the ethereal lotus'' suggests that the refined energy circulating through the
  subtle body becomes a source of vitality and immortality, transforming the ordinary human frame into
  an instrument of transcendence.



  Key Terms



  **vāyu** — The vital air or life-force that moves through the subtle body; one of the five primary prāṇas
  governing bodily and mental functions.

  **siddhis** — Extraordinary powers or perfections that arise as fruits of yogic practice; anima (minuteness)
  and laghima (lightness) are two of the classical eight.

  **ambrosia (amṛta)** — The nectar of immortality; in yogic physiology, the refined essence that flows
  from the subtle energy centers, particularly associated with transcendence of death.



  Cross-Tradition Resonances



  **Katha Upaniṣad (2.3.1):** Both texts affirm that through knowledge and practice, the self transcends
  death: ''The wise one, knowing the Self as deathless, does not grieve.'' The Śiva Saṃhitā grounds this
  realization in embodied yogic work rather than knowledge alone. Divergence: The Upaniṣad emphasizes
  jñāna (knowledge) as the primary means; the Śiva Saṃhitā insists on prāṇāyāma, mudrā, and the activation
  of subtle channels as the practical path.


  **Bhagavad Gītā (2.23):** Both texts declare the ātman (self) to be ''eternal, immutable, and beyond
  destruction.'' The Śiva Saṃhitā extends this to the lived body, suggesting that yogic practice makes
  this truth tangible through vitality and freedom from decay. Divergence: The Gītā speaks of the self''s
  unchanging nature as metaphysical truth; the Śiva Saṃhitā describes specific physiological transformations—equable
  breath, increased humours, ambrosia—as signs of realization.


  **Patañjali''s Yoga Sūtra (3.45):** Both texts acknowledge siddhis as natural fruits of yoga practice.
  The Śiva Saṃhitā lists anima and laghima among these powers, consistent with Patañjali''s enumeration.
  Divergence: Patañjali warns that attachment to siddhis is an obstacle to liberation; the Śiva Saṃhitā
  presents them here as evidence of the practitioner''s transformation and mastery, without cautioning
  against them.'
