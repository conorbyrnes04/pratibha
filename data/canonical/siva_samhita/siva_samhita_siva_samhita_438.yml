translation: The lotus which is at the root of the palate is called the Sahasrar (the thousand-petalled);
  in its centre, there is a yoni (seat or force-centre) which has its face downwards.
abhyasa: Sit quietly and bring gentle awareness to the crown of your head and the soft palate at the roof
  of your mouth. Without forcing breath or visualization, simply notice the space there—as a place of
  subtle receptivity. Rest attention there for a few minutes, observing what arises without grasping.
