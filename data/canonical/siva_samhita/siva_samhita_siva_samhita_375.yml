  body: The sushumna also embraces it, and the beautiful seed is there; there it rests shining brilliantly
    like the autumnal moon, with the luminosity of millions of suns, and the coolness of millions of moons.
    The goddess Tripura Bhairavi has these three (fire, sun, and moon) taken together, and collectively
    she is called the vija. It is also called the great energy. This unfortunate term is influenced by
    Theosophy, a more correct translation would be "those who have attained success" MPM. 24
