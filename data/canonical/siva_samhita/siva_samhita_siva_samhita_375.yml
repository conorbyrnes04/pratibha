  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The sushumna also embraces it, and the beautiful seed is there; there it rests shining brilliantly
  like the autumnal moon, with the luminosity of millions of suns, and the coolness of millions of moons.
  The goddess Tripura Bhairavi has these three (fire, sun, and moon) taken together, and collectively
  she is called the vija. It is also called the great energy. This unfortunate term is influenced by Theosophy,
