abhyasa: Sit quietly and bring attention to the base of your spine. Without forcing or visualizing, simply
  notice the quality of presence there—any warmth, coolness, density, or stillness. Rest there for a few
  minutes, allowing the natural breath to move. This is not activation, but familiarization with the seat
  where, according to this teaching, the transformative power already dwells.
