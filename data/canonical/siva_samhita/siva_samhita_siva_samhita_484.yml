title: Thus have I described the Raja Yoga, it is kept…
unit_type: verse
commentary: 'Śiva announces a transition from Raja Yoga (the royal path of meditation and mental discipline)
  to Rajadhiraj Yoga (the king of all yogas), positioning the latter as a more refined or comprehensive
  teaching. The passage emphasizes secrecy and gradation—what was hidden in the Tantras is now being revealed
  in stages, suggesting that esoteric knowledge unfolds progressively to the sincere student. This movement
  from one yoga to another reflects the non-dual metaphysics underlying the text: practices are scaffolding
  toward direct realization, each layer more direct than the last.



  Key Terms



  **Raja Yoga** — The royal yoga; in this context, the path of mental discipline and meditation, here
  described as a foundational teaching kept secret in the Tantras.

  **Rajadhiraj Yoga** — The king of all yogas; presented as a more supreme or comprehensive teaching that
  Śiva is about to reveal, implying direct or non-dual realization.



  Cross-Tradition Resonances



  **Bhagavad Gītā 10.8 (Kṛṣṇa on knowledge):** Both texts use hierarchical language—''supreme'' or ''king
  of''—to signal that certain teachings are more direct or powerful than others. Divergence: The Gītā
  emphasizes Kṛṣṇa''s own supremacy; the Śiva Saṃhitā emphasizes the supremacy of a *yoga* (a method),
  not a person.


  **Plotinus, Enneads V.8 (on the ascent of the soul):** Both describe a progression through stages of
  knowledge or practice, each more refined than the last, toward union or realization. Divergence: Plotinus
  frames ascent as intellectual contemplation; the Śiva Saṃhitā grounds it in embodied practice (prāṇāyāma,
  mudrā, subtle anatomy).'
