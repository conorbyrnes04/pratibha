translation: Thus have I described the Raja Yoga, it is kept secret in all the Tantras; now I shall describe
  to you briefly the Rajadhiraj Yoga. The Rajadhiraj Yoga.
abhyasa: 'Sit quietly today and notice: what practices or understandings have you outgrown or moved beyond?
  Rather than clinging to them, acknowledge them as necessary steps. Then ask: what am I ready to learn
  next? This mirrors the text''s own gesture—honoring what came before while opening to what lies ahead.'
