  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: All this is called the adhar-padma (the support lotus), and the four petals of it are designated
  by the letters (V), (d), (s,), (s).
abhyasa: Sit quietly and bring awareness to the base of your spine. Without forcing or visualizing, simply
  notice the quality of stability or groundedness there. Silently repeat or listen to the Sanskrit letters
  given (V, d, ṣ, ṣ) as a gentle anchor, allowing each sound to settle like a root into the earth beneath
  you. Return to this for 3–5 minutes whenever you feel scattered.
