title: Know that aspirants are of four orders - mild…
unit_type: verse
commentary: 'The passage establishes a foundational taxonomy of spiritual practitioners based on their
  inherent capacities and obstacles, not their social station. Rather than dismissing the ''mild'' aspirant
  as hopeless, it offers them a realistic path (mantrayoga) suited to their nature, while implying that
  even the weakest may succeed—though requiring proportional effort and time. This democratizes liberation:
  the tradition refuses to reserve the goal for the elite, instead calibrating method to temperament.



  Key Terms



  **sadhak** — An aspirant or practitioner on a spiritual path; one engaged in sādhana (disciplined practice
  toward liberation).

  **mantrayoga** — The yoga of mantra—repetition and invocation of sacred sound—presented here as the
  appropriate path for practitioners of mild capacity.

  **layayoga** — The yoga of dissolution or absorption; implied here as the path for moderate practitioners
  (detailed in the continuation of the passage).



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.11 (''As men approach me, so I receive them''):** Both texts affirm that the divine/path
  meets the seeker at their actual level of capacity, not an idealized one. Divergence: The Gītā emphasizes
  surrender and grace; the Śiva Saṃhitā emphasizes effort scaled to temperament and realistic timelines.


  **Aristotle, Nicomachean Ethics (virtue as habit suited to one''s nature):** Both reject a one-size-fits-all
  moral or spiritual prescription; both ground practice in honest self-assessment. Divergence: Aristotle
  aims at eudaimonia within the human community; the Śiva Saṃhitā aims at liberation from the cycle of
  rebirth itself.


  **Dōgen, Shōbōgenzō (''all beings possess Buddha-nature''):** Both affirm that even the most obstructed
  practitioner is not excluded from the ultimate goal. Divergence: Dōgen teaches that practice and realization
  are one; the Śiva Saṃhitā quantifies effort (''twelve years'') and differentiates paths by capacity.'
