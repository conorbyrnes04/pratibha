abhyasa: 'Reflect honestly today on which category resonates with your current condition—not as judgment,
  but as recognition. What obstacles the passage names (fear, attachment, self-doubt, poor health) do
  you recognize in yourself? Rather than shame, use this clarity to ask: what practice might match where
  I actually am, not where I wish to be?'
