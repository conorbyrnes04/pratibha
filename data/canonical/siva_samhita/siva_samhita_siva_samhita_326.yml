  label: Translation
  body: Know that aspirants are of four orders - mild, moderate, ardent and the most ardent - the best
    who can cross the ocean of the world. (Mild) entitled to Mantrayoga. 1 1. Men of small enterprise,
    oblivious, sickly and finding faults with the teachers; avaricious, sinful gourmands, and attached
    helplessly to their wives; fickle, timid, diseased, not independent, and cruel; those whose characters
    are bad and who are weak - know all the above to be mild sadhaks. With great efforts such men succeed
    in twelve years; them the teachers should know fit for mantrayoga. (Moderate) entitled to Layayoga.
