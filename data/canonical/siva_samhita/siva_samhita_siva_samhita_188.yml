  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When in the body of the practitioner, there is neither any ncrease of phlegm, wind, nor bile;
  then he may with impunity be rregular in his diet and the rest.
abhyasa: 'Today, notice one moment when your body feels genuinely at ease—neither sluggish, scattered,
  nor overheated. Rest in that sensation for a few breaths. Ask: what conditions (food, rest, breath,
  movement) brought this balance? This is not license to abandon care, but an invitation to recognize
  what true balance feels like in your own flesh.'
