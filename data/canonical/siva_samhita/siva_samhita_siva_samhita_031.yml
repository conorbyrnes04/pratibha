translation: As in innumerable cups full of water, many reflections of the sun are seen, but the substance
  is the same; similarly individuals, like cups are innumerable, but the vivifying spirit, like the sun,
  is one.
abhyasa: 'Today, observe a moment of reflected light—sunlight in a window, a puddle, a mirror. Notice
  how the light appears many yet remains one. Let this simple seeing become a reminder: the awareness
  observing this reflection now is the same awareness in all beings you encounter. Rest briefly in that
  recognition.'
