abhyasa: Choose one short passage from a wisdom text you trust. Read it aloud slowly each morning for one week, pausing after
  each sentence to notice what shifts in your breath, posture, or inner attention. Observe whether the act of daily return
  itself—independent of 'understanding'—changes your relationship to the words.
