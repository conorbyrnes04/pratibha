abhyasa: 'Today, pause three times and ask: What am I perceiving as separate right now—a problem, a desire,
  a fear? Then, without forcing, notice the awareness in which that perception appears. Rest briefly in
  that awareness itself, which does not divide into bondage and freedom. Return to your day. This is not
  analysis but a gentle return to the unity the passage names.'
