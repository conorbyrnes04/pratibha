translation: He who practices always this best Shakti-chalan according to the instructions of his Guru,
  obtains the vigraha-siddhi, which gives the powers of anima, etc., and has no fear of death.
abhyasa: 'Reflect today on one area of your life where you practice consistently under guidance (a teacher,
  mentor, or trusted tradition). Notice how regularity and instruction have shaped your capacity. Then
  consider: what would it mean to bring that same commitment to understanding your own subtle nature or
  inner life?'
