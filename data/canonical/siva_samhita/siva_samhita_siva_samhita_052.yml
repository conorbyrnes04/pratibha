translation: Save and beyond it, there is no other substance, therefore, it is one; without it everything
  else is false; therefore, it is True Existence.
abhyasa: 'Sit quietly and observe one object before you—a candle flame, a leaf, your own hand. Rather
  than analyzing it, ask silently: *What is the substance that allows this to appear?* Not its name or
  form, but the sheer presence that makes it knowable. Rest attention there, noticing how that presence
  seems prior to and independent of the object''s changing qualities.'
