translation: The good actions are verily heaven, and sinful deeds are verily hell; the creation is the
  natural outcome of karma and nothing else.
abhyasa: 'Today, observe one action you take (physical, verbal, or mental) and sit quietly for a few minutes
  afterward. Notice: what quality or ''flavor'' does this action leave in your awareness? Does it feel
  generative or depleting, clarifying or clouding? Do not judge; simply witness how action and inner state
  are inseparable. This is karma as immediate, not distant.'
