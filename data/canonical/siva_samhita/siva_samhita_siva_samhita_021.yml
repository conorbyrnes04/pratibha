title: The good actions are verily heaven, and sinful…
unit_type: verse
commentary: 'This verse presents a non-dualistic understanding of karma in which heaven and hell are not
  external realms but the direct manifestation of one''s own actions. The passage asserts that creation
  itself—the entire phenomenal world—emerges necessarily from karmic law, with no separate judge or cosmic
  administrator. This grounds liberation not in divine grace or external salvation, but in the direct
  causal relationship between deed and consequence, making the practitioner responsible for their own
  bondage and freedom.



  Key Terms



  **karma** — Action and its natural, inevitable consequences; the principle by which creation unfolds
  and by which one''s own deeds shape one''s experience.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''karmaṇy eva adhikāras te''):** Both texts emphasize action as the fundamental
  law governing existence and liberation; both place responsibility on the actor. Divergence: The Gītā
  qualifies this by urging detachment from the fruits of action, whereas this passage presents karma as
  the direct, unmediated outcome of deed.


  **Heraclitus, Fragment 51 (ethos as destiny):** Both suggest that character and consequence are woven
  together; one''s nature produces one''s world. Divergence: Heraclitus speaks of ethos poetically; the
  Śiva Saṃhitā presents karma as a metaphysical law governing all creation.


  **Dhammapada 1.1–2 (mind as creator of experience):** Both traditions teach that mental and moral action
  generate the world one inhabits; there is no external judge. Divergence: The Dhammapada emphasizes mind
  as the root; the Śiva Saṃhitā speaks of karma as the principle of creation itself, more cosmological
  in scope.'
