translation: Having renounced by the above methods all his previous bodies (the results of his past karma),
  and being in his spiritual (or luminous) body, let the Yogi receive this highest Yoga.
abhyasa: 'Today, sit quietly and notice one habitual pattern—a reaction, thought, or sensation you carry.
  Without judgment, ask: ''Is this truly me, or a residue I inherited from yesterday?'' Breathe gently
  and sense whether, beneath that pattern, there is a witnessing awareness that is not bound by it. Rest
  there, even briefly.'
