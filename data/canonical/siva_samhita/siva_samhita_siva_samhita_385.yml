  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who leaving the Siva who is inside, worships that which is outside (viz., worships external
  forms), is like one who throws away the sweetmeat in his hand, and wanders away in search of food.
abhyasa: 'Today, pause once during prayer, ritual, or spiritual study and ask: Am I seeking something
  outside myself, or am I recognizing what is already here? Rest attention inward for a few breaths, noticing
  awareness itself—not as an object, but as the witnessing presence. Return to your practice with this
  remembrance.'
