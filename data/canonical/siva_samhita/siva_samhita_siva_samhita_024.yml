translation: When the sufferings for evil actions are gone through, then there take place re-births certainly;
  when the fruits of good actions have been exhausted, then also, verily, the result is the same.
abhyasa: 'Sit quietly today and observe one action you perform—whether ''good'' or ''bad'' by convention.
  Notice how you expect or fear its result. Without judgment, simply witness: does the anticipation itself
  bind you? This mirrors the text''s insight that *exhaustion* of fruits, not their accumulation, moves
  the seeker forward.'
