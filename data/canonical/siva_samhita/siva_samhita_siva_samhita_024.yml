unit_label: Chapter 1 — 28
title: When the sufferings for evil actions are gone…
unit_type: verse
commentary: 'This passage articulates a core non-dual teaching: both merit and demerit exhaust themselves
  through their fruits, and exhaustion of either leads to rebirth. The point is not moral judgment but
  the mechanics of karma—even virtuous action, if performed with attachment to its results, binds the
  soul to the cycle. Liberation lies not in accumulating good karma, but in transcending the karmic mechanism
  itself through yoga practice and realization of one''s true nature beyond action.



  Key Terms



  **karma (implied: phala, ''fruits'')** — The law of action and consequence; here, the exhaustion of
  karmic fruits through experience, whether from vice or virtue, as a necessary passage in the cycle of
  rebirth.

  **re-birth (punar-janma)** — Return to embodied existence; in this teaching, the inevitable result when
  karmic fruits remain to be experienced, regardless of their moral valence.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga as action without attachment):** Both texts teach that action itself is not
  the problem; attachment to results is. The Gītā urges yoga (equanimity in action); the Śiva Saṃhitā
  shows the consequence of not achieving it—rebirth. Divergence: The Gītā emphasizes performing duty without
  desire; the Śiva Saṃhitā emphasizes the *exhaustion* of karmic fruits as a natural process, less prescriptive
  about duty itself.


  **Ecclesiastes 2:11 (vanity of works and their fruits):** Both texts suggest that the fruits of action—whether
  good or ill—ultimately yield emptiness or cyclical return, not lasting satisfaction or liberation. Divergence:
  Ecclesiastes concludes with acceptance and fear of God; the Śiva Saṃhitā points toward yoga practice
  and transcendence of the karmic cycle as the way forward.


  **Dhammapada 1-2 (mind precedes all; karma as natural law):** Both traditions treat karma as impersonal
  law: action naturally produces consequence. Neither requires a judge; the mechanism is intrinsic. Divergence:
  The Dhammapada emphasizes mindfulness and ethical conduct as the path; the Śiva Saṃhitā, while not dismissing
  ethics, points beyond karma entirely through non-dual realization.'
