translation: This body called the Brahmanda (microcosm) has many parts, but I have enumerated the most
  important of them in this book. (Surely) they ought to be known.
abhyasa: 'Today, sit quietly and sense your body as a whole system rather than separate parts. Without
  forcing anything, notice: where do you feel aliveness, weight, breath, or subtle sensation? Simply acknowledge
  that this lived body contains worlds. Return to this sense whenever you remember.'
