  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The karmakanda is twofold - consisting of injunctions and prohibitions.
abhyasa: Observe one action today—eating, speaking, or moving—and notice how it contains both an injunction (what draws you
  forward) and a prohibition (what you naturally refrain from). Rather than judging, simply witness how your behavior already
  navigates this twofold structure. This quiet noticing prepares the ground for understanding how practice eventually moves
  beyond such constraints.
