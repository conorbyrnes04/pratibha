title: The karmakanda is twofold - consisting of…
unit_type: verse
commentary: 'This opening statement establishes that ritualistic action (karmakanda) operates within a binary structure of
  command and restraint—what one *must* do and what one *must not* do. In the context of the Śiva Saṃhitā''s broader non-dual
  teaching, this distinction frames the conventional moral and ritual order as a necessary scaffolding, even as the text will
  later point toward liberation beyond such dualities. The passage suggests that understanding action''s dual nature is foundational
  to transcending it.



  Key Terms



  **karmakanda** — The ritual or action-based dimension of Vedic practice; here understood as the domain of prescriptive and
  proscriptive rules governing conduct.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (on duty without attachment):** Both texts acknowledge the reality and necessity of prescribed action
  (dharma) as a framework for human life. Divergence: The Gītā emphasizes performing one''s duty without attachment to results;
  the Śiva Saṃhitā here simply maps the structure of action itself, deferring the question of inner freedom.


  **Tao Te Ching 48 (on the sage''s non-action):** Both traditions recognize that conventional morality operates through opposites
  (do/don''t), implying a level beyond such duality. Divergence: The Tao Te Ching dissolves the binary into wu wei (effortless
  action); the Śiva Saṃhitā preserves the twofold structure as a real domain before transcendence.'
