  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: As a rope can never become a snake, in the past, present or future; so the spirit which is
  beyond all gunas and which is pure, never becomes the universe.
abhyasa: 'Today, when you perceive something troubling or alluring in the world around you, pause and
  silently ask: ''Like the rope beneath the snake, what unchanging awareness is aware of this appearance
  right now?'' Rest attention there, not analyzing, simply noticing the stable witness behind all change.'
