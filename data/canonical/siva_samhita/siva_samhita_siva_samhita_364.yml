  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The great Yogi beholds light, pure as holy mountain (Kailas), and through the force of his
  exercise in it, he becomes the lord and guardian of the light.
abhyasa: Sit quietly and bring attention to the space between your eyebrows or the center of the chest.
  Without forcing, notice any subtle luminosity, warmth, or radiance already present in awareness. Rather
  than grasping at it, simply witness it with steady, gentle attention for a few minutes. Return to this
  practice daily, observing how your relationship to this inner light shifts from passive witness to active,
  conscious presence.
