abhyasa: 'Reflect today on one physical practice you know (a posture, breath, or movement) and one mental
  quality you cultivate (concentration, equanimity, or witness-awareness). Notice how they actually support
  each other: does the body practice quiet the mind, and does mental steadiness deepen the body''s awareness?
  Sit with the question: where do they meet?'
