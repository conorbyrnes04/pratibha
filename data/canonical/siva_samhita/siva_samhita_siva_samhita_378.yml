translation: Near this Swayambhu-linga is a golden region called kula (family); its presiding adept is
  called Dviranda, and its presiding goddess called Dakini. In the centre of that lotus is the Yoni where
  resides the Kundalini; the circulating bright energy above that, is called kama-vija (the seed of love).
  The wise man who always contemplates on this Muladhar obtains Darduri-siddhi (the frog-jumping power);
  and by degrees he can altogether leave the ground {i.e., rise in the air).
abhyasa: Sit quietly and bring your attention to the base of your spine (the Muladhara center). Without
  forcing breath or visualization, simply rest awareness there for 5–10 minutes, noticing any sensation,
  warmth, or subtle movement. Return gently whenever the mind wanders. This is contemplation of the seat
  itself—the beginning of the practice described.
practice: Sit quietly and bring your attention to the base of your spine (the Muladhara center). Without
  forcing breath or visualization, simply rest awareness there for 5–10 minutes, noticing any sensation,
  warmth, or subtle movement. Return gently whenever the mind wanders. This is contemplation of the seat
  itself—the beginning of the practice described.
