  योनिस्तत्र कुडूणलिनी स्थिता तस्या ऊर्ध्वे स्फुरत्तेजः कामबीजं भ्रमन्मतम् यः करोति सदा ध्यानं मूलाधारे
  विचक्षणाः तस्य ख्याद्दार्दुरी सिद्धिर्भूमित्यागक्रमेण वै
