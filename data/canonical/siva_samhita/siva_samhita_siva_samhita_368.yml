  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When the vayu moves through all the nadis, then, owing to this vayu, the fluids of the body get extraordinary
  force and energy.
abhyasa: 'Sit quietly and observe your natural breath for a few minutes without controlling it. Notice where you feel energy
  or aliveness in your body—perhaps warmth, tingling, or subtle movement. Reflect: how does the simple fact of breathing seem
  to animate or enliven what you feel? This simple noticing honors the passage''s claim that vāyu (breath-energy) is already
  at work.'
