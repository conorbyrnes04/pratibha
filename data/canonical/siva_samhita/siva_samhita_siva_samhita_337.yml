title: Let him close the ears with his thumbs, the eyes…
unit_type: verse
commentary: 'This passage describes a specific sealing practice (likely a form of śāmbhavī or similar
  mudrā) in which the practitioner systematically closes all sensory openings to turn attention inward.
  By confining the vital breath (prāṇa) through this physical gesture, the text suggests that the ordinary
  outward flow of perception reverses, and the practitioner directly perceives the ātman—the innermost
  self—as luminous presence. The claim is not metaphorical: the practice is offered as a direct means
  of self-recognition.



  Key Terms



  **Yogi** — A practitioner of yoga; one who engages in disciplined spiritual practice, here specifically
  through breath-control and sensory restraint.

  **ātman (soul)** — The innermost self or essential consciousness; in non-dual contexts, identical with
  Brahman, the ultimate reality.

  **prāṇa (air)** — Vital life-force or breath; the energetic substratum of embodied existence, subject
  to control through yogic practice.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kena Upaniṣad): ''Not that which the eye sees, but that by which the eye sees…'':**
  Both texts point to a reversal of ordinary perception: the self is not an object to be grasped externally
  but the witnessing ground of all perception. Sealing the senses redirects attention toward this non-objective
  awareness. Divergence: The Upaniṣads emphasize intellectual discrimination and negation (''neti neti'');
  the Śiva Saṃhitā offers a somatic, prāṇic method as the direct gateway.


  **Patañjali''s Yoga Sūtra (1.2): ''Yoga is the cessation of the fluctuations of the mind.'':** Both
  texts locate liberation in the stilling of mental and sensory activity. The sealed-senses practice is
  a concrete technique for achieving this quieting. Divergence: Patañjali emphasizes mental discipline
  and discriminative awareness; the Śiva Saṃhitā privileges direct perception of the self as light through
  prāṇic confinement.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  suggest a non-dual collapse of subject and object: the light the Yogi sees is not separate from the
  seer. Perception and being coincide. Divergence: Eckhart frames this through apophatic theology and
  grace; the Śiva Saṃhitā presents it as a reproducible result of disciplined prāṇic technique.'
