  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Let him close the ears with his thumbs, the eyes with index fingers, the nostrils with the
  middle fingers, and with the reaming four fingers let him press together the upper and lower lips. The
  Yogi, by having thus firmly confined the air, sees his soul in the shape of light.
abhyasa: Sit comfortably and, without strain, gently close your ears with your thumbs, eyes with index
  fingers, nostrils with middle fingers, and press your lips together with the remaining fingers. Breathe
  naturally through any small gaps. Remain still for 1–2 minutes, noticing what arises in the darkness
  and silence—not seeking visions, but observing the quality of awareness itself when external stimuli
  fade.
