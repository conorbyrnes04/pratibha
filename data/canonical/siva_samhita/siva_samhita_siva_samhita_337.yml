  label: Translation
  body: Let him close the ears with his thumbs, the eyes with index fingers, the nostrils with the middle
    fingers, and with the reaming four fingers let him press together the upper and lower lips. The Yogi,
    by having thus firmly confined the air, sees his soul in the shape of light.
