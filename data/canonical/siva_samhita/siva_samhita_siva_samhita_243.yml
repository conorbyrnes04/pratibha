translation: Then let him go again to the Kula through the practice of mantrayoga {i.e., pranayama). This
  Yoni has been called by me in the Tantras as equal to life.
abhyasa: Today, observe one conscious breath cycle with awareness of its source—the subtle energy at the
  base of the spine (the Yoni). As you inhale, sense the upward movement; as you exhale, return. Repeat
  this simple observation 5–10 times without forcing, noting any shift in your sense of aliveness or presence.
