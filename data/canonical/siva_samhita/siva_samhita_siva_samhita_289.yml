  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Actuated by mercy for my devotees, I shall now explain the Vajrondi-mudra, the destroyer
  of the darkness of the world, the most secret among all secrets.
abhyasa: 'Today, sit quietly and reflect on one area of your life where you feel caught in habitual darkness
  or confusion. Rather than trying to fix it, simply notice: what would it mean to ''return'' to clarity
  here, as if a veil were lifted rather than a problem solved? Hold this inquiry without forcing an answer.'
