  body: Now I shall describe, O Parvati, the obstacles which arise from knowledge. Sitting in the gomukh
    posture and practicing dhauti (washing the intestines by hathayoga). Knowledge of the distribution
    of the nadis (the vessels of the human body), learning of pratyahara (subjugation of the senses),
    trying to awaken the kundalini force, by moving quickly the belly (a process of hathayoga), entering
    into the path of the indriyas, and knowledge of the action of the nadis; these are the obstacles.
    Now listen to the mistaken notions of diet, O Parvati.
