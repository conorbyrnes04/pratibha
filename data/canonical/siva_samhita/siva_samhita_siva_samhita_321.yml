title: Now I shall describe, O Parvati, the obstacles…
unit_type: verse
commentary: 'Śiva here names a paradox: the very practices and knowledge meant to support liberation—postures,
  cleansing, understanding the subtle body''s channels, sense-withdrawal, and kundalinī awakening—can
  themselves become obstacles if pursued with attachment or misunderstanding. The passage suggests that
  technical mastery and intellectual knowledge of yoga''s anatomy are not the goal itself, but can seduce
  the practitioner into mistaking the map for the territory. This teaching honors the necessity of practice
  while warning against reifying it.



  Key Terms



  **nāḍī** — The subtle channels or vessels through which prāṇa (vital energy) flows in the body; their
  mapping is knowledge, but knowledge alone is an obstacle.

  **kuṇḍalinī** — The coiled spiritual force dormant at the base of the spine; its awakening is sought,
  yet seeking itself can become an obstacle.

  **pratyāhāra** — The withdrawal or subjugation of the senses; a recognized yogic practice that can paradoxically
  obstruct if grasped as achievement.



  Cross-Tradition Resonances



  **Tao Te Ching 48: ''In pursuit of learning, every day something is acquired. In pursuit of Tao, every
  day something is dropped.'':** Both texts warn that accumulation—of knowledge, technique, attainment—can
  obstruct the deeper aim. Knowledge of the nāḍīs parallels ''learning''; both must be released. Divergence:
  The Tao Te Ching frames the obstacle as inherent to the *method* of learning itself; Śiva Saṃhitā names
  specific practices and knowledge-forms, suggesting the obstacle lies in *attachment* to them, not in
  learning per se.


  **Meister Eckhart: ''A person should be so poor that he is not and has not a place where God can work.'':**
  Both point to the necessity of emptiness or non-grasping; Eckhart''s ''poverty'' mirrors the warning
  against clinging to yogic knowledge and achievement. Divergence: Eckhart emphasizes ontological emptiness
  before God; Śiva Saṃhitā addresses the specific trap of yogic technique and subtle-body knowledge, which
  are real and necessary but must not be mistaken for the goal.


  **Dhammapada 165: ''The path is difficult, the world is dark; hard to traverse, hard to understand.'':**
  Both acknowledge that the spiritual path involves real practices and knowledge, yet both warn of subtle
  pitfalls—the Dhammapada through the difficulty of understanding itself, Śiva Saṃhitā through the seduction
  of technique. Divergence: The Dhammapada emphasizes the *difficulty* of the path; Śiva Saṃhitā emphasizes
  the *deception* of mastery, suggesting the obstacle is not hardship but false confidence.'
