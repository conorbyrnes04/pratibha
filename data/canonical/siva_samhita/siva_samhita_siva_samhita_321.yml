  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Now I shall describe, O Parvati, the obstacles which arise from knowledge. Sitting in the
  gomukh posture and practicing dhauti (washing the intestines by hathayoga). Knowledge of the distribution
  of the nadis (the vessels of the human body), learning of pratyahara (subjugation of the senses), trying
  to awaken the kundalini force, by moving quickly the belly (a process of hathayoga), entering into the
  path of the indriyas, and knowledge of the action of the nadis; these are the obstacles. Now listen
  to the mistaken notions of diet, O Parvati.
abhyasa: 'Today, notice one yoga practice or spiritual knowledge you rely on. Pause and ask: Am I doing
  this *toward* liberation, or have I made it an end in itself? What would it mean to release my grip
  on this technique, even while practicing it?'
