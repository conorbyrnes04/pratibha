  body: Whatever is seen among men (whether pleasure or pain) is born of karma. All creatures enjoy or
    suffer, according to the results of their actions. That is, the functions of the Cord, vfe.Reflection,
    co-ordination, etc. The parts of which the Spinal Cord is composed are the Tantrik stages vfe.:-Cervical,
    Dorsal, Lumbar, Sacral and Coccygeal.
