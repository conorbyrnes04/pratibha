  body: That one Spirit, through differentiation, verily becomes a son, a father, etc. The Sacred Scriptures
    have demonstrated the universe to be the freak of maya (illusion). The Yogi destroys this phenomenal
    universe by realizing that it is but the result of adhyaropa (superimposition) and by means of aparada
    (refutation of a wrong belief). Definition of a Paramahamsa.
