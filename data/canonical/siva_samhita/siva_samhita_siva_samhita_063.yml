  verse: '1.67'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: That one Spirit, through differentiation, verily becomes a son, a father, etc. The Sacred
  Scriptures have demonstrated the universe to be the freak of maya (illusion). The Yogi destroys this
  phenomenal universe by realizing that it is but the result of adhyaropa (superimposition) and by means
  of aparada (refutation of a wrong belief). Definition of a Paramahamsa.
abhyasa: 'Today, when you encounter a relationship or role that defines you (parent, child, professional,
  etc.), pause and ask: ''Who observes this role? Am I only this, or is this a temporary appearance in
  something unchanging?'' Notice whether the answer shifts your sense of identity, even briefly.'
