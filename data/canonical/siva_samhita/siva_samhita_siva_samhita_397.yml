translation: In the heart, is the fourth chakra, the Anahat. It has twelve petals designated by the letters
  k, kh, g, gh, n, ch, chh, j, jh, n, t, th. Its colour is deep blood-red; it has the seed of vayu, yam,
  and is a very pleasant spot.
abhyasa: Sit quietly and bring attention to the center of the chest. Without forcing, notice the natural
  rhythm of breath there. Silently sound or mentally trace one of the twelve consonants (k, kh, g, gh,
  n, ch, chh, j, jh, n, t, th) with each exhale, allowing the vibration to settle in the heart region.
  Rest there for several minutes, observing what arises—sensation, emotion, stillness.
