title: According to the strength of one's practice in…
unit_type: verse
commentary: 'This passage teaches that mastery of prāṇa (life-force, here called vayu) through disciplined
  practice yields two fruits: first, sovereignty over the physical body itself, and second, a paradoxical
  freedom—the practitioner remains rooted in spirit (ātman) while fully inhabiting and enjoying embodied
  life. The teaching rejects both ascetic denial and worldly entanglement; the ''wise'' person is one
  who has integrated practice into a lived embodiment, neither fleeing the world nor enslaved by it.



  Key Terms



  **vayu** — The vital air or life-force (prāṇa); in yoga physiology, the subtle energies that animate
  and sustain the body and mind.

  **spirit** — Here, ātman—the unchanging witness-consciousness that remains distinct from body and mind,
  even while inhabiting them.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts affirm that spiritual mastery enables full,
  non-attached engagement with the world rather than withdrawal from it. Divergence: The Gītā emphasizes
  duty and action; the Śiva Saṃhitā emphasizes subtle-body mastery and prāṇic control as the means to
  that freedom.


  **Meister Eckhart (detachment amid activity):** Both teach that the realized person remains ''in the
  spirit'' while fully present to sensory and worldly life—a paradox of simultaneous transcendence and
  immanence. Divergence: Eckhart''s path is primarily contemplative and devotional; the Śiva Saṃhitā prescribes
  systematic prāṇāyāma and mudrā as the technical means.


  **Tao Te Ching 15 (the sage moves through the world unimpeded):** Both suggest that true mastery is
  invisible—the wise person enjoys the world naturally, without force or resistance, through alignment
  with subtle principles. Divergence: The Tao Te Ching speaks of wu-wei (non-action); the Śiva Saṃhitā
  explicitly requires disciplined practice and ''strength'' of effort.'
