  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: According to the strength of one's practice in commanding the vayu, he gets command over
  his body; the wise, remaining in the spirit, enjoys the world in the present body.
abhyasa: 'Today, notice one moment of ordinary embodied sensation—breath, touch, taste—and pause. Ask:
  am I present as awareness inhabiting this body, or am I identified only with the sensation itself? Return
  to that distinction once more before the day ends.'
