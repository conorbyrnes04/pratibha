translation: Below the cavity of the throat, there is a beautiful nadi (vessel) called kurma; when the
  Yogi fixes his attention on it, he acquires great concentration of the thinking principle (chitta).
abhyasa: 'Sit quietly and bring gentle awareness to the space below your throat—the upper chest and heart
  region. Without forcing breath or visualization, simply notice what arises there: sensation, warmth,
  texture, or stillness. Rest attention there for 5–10 minutes. Observe whether the mind naturally becomes
  more settled.'
