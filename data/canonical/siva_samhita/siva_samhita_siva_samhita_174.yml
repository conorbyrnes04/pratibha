translation: The following qualities are surely always found in the bodies of every Yogi - Strong appetite,
  good digestion, cheerfulness, handsome figure, great courage, mighty enthusiasm and full strength.
abhyasa: 'Today, notice one of these qualities in yourself or someone engaged in sustained practice: appetite,
  digestion, cheerfulness, courage, or strength. Rather than judging it as ''spiritual'' or ''unspiritual,''
  simply observe it as a natural sign of vitality. This trains the eye to recognize yoga''s fruits in
  ordinary life.'
