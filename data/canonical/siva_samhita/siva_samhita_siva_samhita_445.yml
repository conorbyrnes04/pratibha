  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Then the vital air continually flows in the sushumna. On the right and the left side of the Muladhar, are situated
  the ida and the pingala. The Sushumna passes through the middle of it. 1
abhyasa: Sit quietly and bring awareness to the base of your spine (muladhara). Without forcing, notice the natural flow of
  breath and energy. Imagine a luminous central channel rising from this root through the crown of your head. Return to this
  image for 5–10 minutes whenever you need to reconnect with your center.
