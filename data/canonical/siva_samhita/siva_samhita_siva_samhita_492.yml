unit_label: Chapter 5 — 176
title: He who meditates on this movable and immovable…
unit_type: verse
commentary: 'This passage presents a paradox central to non-dual inquiry: the meditator who fixes attention
  on the visible, changing world—treating it as the ultimate reality—while neglecting direct recognition
  of Brahma (the supreme, unchanging consciousness) becomes trapped in that very manifestation. The teaching
  inverts common practice: meditation on the cosmos, if it obscures the transcendent ground, becomes a
  form of bondage rather than liberation. The passage suggests that true meditation must recognize what
  is ''really unmanifest''—the substratum of appearance itself—rather than remaining absorbed in its movements.



  Key Terms



  **Brahma** — In this context, the supreme, unmanifest consciousness or ultimate reality—distinct from
  Brahmā the creator deity. The transcendent ground beyond all manifestation.

  **unmanifest** — That which is not subject to change or appearance; the transcendent substratum underlying
  the manifest universe.



  Cross-Tradition Resonances



  **Tao Te Ching 1: ''The Tao that can be named is not the eternal Tao'':** Both warn against mistaking
  the named, visible, changing realm for ultimate reality; both point to an unnameable ground. Divergence:
  The Tao Te Ching emphasizes the way''s subtle action in the world; the Śiva Saṃhitā passage stresses
  the danger of absorption in manifestation itself.


  **Upaniṣad teaching (e.g., Māṇḍūkya): Brahman is ''neti neti'' (not this, not this):** Both use negation
  to point toward what transcends conceptual knowledge and sensory appearance. Divergence: The Upaniṣads
  employ systematic negation as method; this passage warns against a specific pitfall—mistaking meditation
  on form for realization.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both suggest
  a reversal of ordinary subject-object awareness; both point to direct recognition rather than meditative
  absorption in objects. Divergence: Eckhart emphasizes reciprocal seeing and union; the Śiva Saṃhitā
  passage emphasizes the trap of mistaking the seen for the seer.'
