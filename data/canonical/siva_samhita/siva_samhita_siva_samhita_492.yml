  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He who meditates on this movable and immovable universe, that is really unmanifest, but abandons
  the supreme Brahma - directly manifest - is verily absorbed in this universe.
abhyasa: 'Today, pause during an ordinary moment and ask: What remains aware of this changing scene—my
  breath, my thoughts, the world around me? Do not answer intellectually. Notice the unchanging presence
  in which all movement occurs. Return to this noticing several times, without grasping.'
