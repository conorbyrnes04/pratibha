translation: After this, through exercise, the Yogi reaches the Parichaya-avastha. When the air leaving
  the sun and moon (the right and the left nostrils), remains unmoved and steady in the ether of the tube
  sushumna, then it is in the parichaya state.
abhyasa: Today, sit quietly and observe the natural flow of your breath through each nostril. Without
  forcing, simply notice which nostril feels more active. Over time, this simple awareness can deepen
  your sensitivity to the subtle body described in the text—no special technique required, only patient
  attention.
