  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: As in a dream the one soul creates many objects by mere willing; but on awaking everything vanishes but the one
  soul; so is this universe.
abhyasa: 'Sit quietly and recall a vivid dream you have had. Notice how real it felt while dreaming, and how completely it
  vanished upon waking. Then observe your waking experience—the people, objects, sensations around you—with the same gentle
  inquiry: what remains constant and aware through all these changing appearances? Rest in that noticing for a few minutes.'
