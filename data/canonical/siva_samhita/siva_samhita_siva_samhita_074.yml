translation: There are two forces - viksepa, (the out-going energy) and avarana (the transforming energy)
  which are of great potentiality and power, and whose form is happiness. The great maya, when non-intelligent
  and material, has three attributes sattva (rhythm) rajas (energy) and tamas (inertia).
abhyasa: 'Sit quietly and notice the two movements in your own experience today: the outward pull of attention
  and desire (vikṣepa), and the inward contraction or forgetting (āvaraṇa). Rather than resisting either,
  pause and ask: what quality of aliveness or contentment is present *within* each movement? This brief
  inquiry honors the passage''s claim that both forces carry an inherent fullness.'
