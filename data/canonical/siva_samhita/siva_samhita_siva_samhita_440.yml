  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In that hole of the sushumna there dwells as its inner force the Kundalini. In the sushumna there is also a constant
  current of force called chitra, its actions or modifications should be called, in my opinion as Brahmarandhra, etc.
abhyasa: Sit quietly and bring awareness to the center of your spine, from the base upward to the crown. Without forcing breath
  or visualization, simply notice the quality of stillness and subtle aliveness present there. Rest your attention there for
  5–10 minutes, observing without grasping. This is a preliminary attunement to the passage's geography.
