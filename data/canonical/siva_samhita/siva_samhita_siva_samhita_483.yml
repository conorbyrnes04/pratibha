  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By meditation one at once knows the wonderful effects of this Yoga {i.e., of the contemplation
  of the void); undoubtedly he attains the psychic powers, called anima and laghima, etc.
abhyasa: 'Today, sit quietly for 10–15 minutes and rest attention on the space between thoughts—the ''void''
  or emptiness that is always present. Notice what arises without grasping: clarity, stillness, or subtle
  shifts in perception. Do not chase visions or powers; simply observe what the mind knows when it is
  not busy. This is the beginning of the meditation the passage describes.'
