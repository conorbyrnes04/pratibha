title: By meditation one at once knows the wonderful…
unit_type: verse
commentary: 'This passage asserts that meditation on emptiness (the void) yields immediate, verifiable
  results: both direct knowing and the arising of siddhis—supernatural capacities like anima (the power
  to become infinitesimally small) and laghima (weightlessness). The claim is striking: not distant promise,
  but ''at once'' and ''undoubtedly.'' This grounds the yoga path in tangible transformation rather than
  mere faith, while suggesting that psychic powers are natural fruits of the practice, not its goal.



  Key Terms



  **anima** — A siddhi (psychic power) by which one becomes infinitesimally small; the capacity to contract
  or diminish one''s presence or form.

  **laghima** — A siddhi by which one becomes weightless or light; the capacity to transcend gravitational
  or material heaviness.

  **siddhis** — Supernatural or paranormal powers that arise as natural fruits of yogic practice; not
  to be pursued as ends in themselves.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, III.45–46 (on siddhis):** Both texts affirm that psychic powers emerge spontaneously
  from deep meditation and are signs of genuine progress. Divergence: Patañjali warns explicitly against
  attachment to siddhis as obstacles to liberation; the Śiva Saṃhitā passage presents them more neutrally
  as ''wonderful effects,'' without the cautionary frame.


  **Upaniṣads (e.g., Kena Upaniṣad): ''That which is not thought by the mind, but by which the mind is
  thought'':** Both point to a knowing that transcends ordinary mental cognition—a direct apprehension
  beyond conceptual thought. Divergence: The Upaniṣads emphasize the transcendent subject; the Śiva Saṃhitā
  emphasizes the fruits and powers that manifest in the practitioner''s embodied life.


  **Daoism (Zhuangzi): ''Sit and forget'' (zuowang)—emptying the mind of deliberation:** Both traditions
  prize meditation on emptiness or the void as the gateway to transformation and subtle capacities. Divergence:
  Daoism tends toward wu-wei (non-action) and harmony with the Dao; the Śiva Saṃhitā explicitly cultivates
  and names powers as fruits of yoga.'
