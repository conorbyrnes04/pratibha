  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The jnana (Gnosis) alone is eternal; it is without beginning or end; there exists no other
  real substance. Diversities which we see in the world are results of sense-conditions; when the latter
  cease, then this Jnana alone, and nothing else, remains.
abhyasa: 'Today, pause once and notice: what remains aware of the sensations, thoughts, and perceptions
  arising? Can you rest attention there—not on the content of experience, but on the knowing itself—for
  even a few breaths? This is a gentle inquiry into the witness that persists whether the world appears
  or dissolves.'
