  chapter: On the Fruits of Yoga
  verse: '5.27'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The first sound is like the hum of the honey-intoxicated bee, next that of a flute, then
  a harp; after this, by gradual practice of Yoga, the destroyer of the darkness of the world, he hears
  the sounds of ringing bells; then sounds like roar of thunder. When one fixes his full attention on
  this sound, being free from fear, he gets absorption, O my beloved!
