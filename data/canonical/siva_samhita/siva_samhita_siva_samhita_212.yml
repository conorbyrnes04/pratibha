  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the skilful Yogi, knowing the laws of action of prana and apana, can drink the cold
  air through the concentration of the mouth, in the form of a crow-bill, then he becomes entitled to
  liberation.
abhyasa: Sit quietly and observe the natural flow of your breath for a few minutes. Then, without forcing,
  gently purse your lips as if drawing air through a narrow opening (the 'crow-bill' shape), and inhale
  slowly and smoothly. Do this for 3–5 breaths only, noticing any shift in mental clarity or calm. This
  is not mastery but an invitation to feel how breath shape and awareness interact.
