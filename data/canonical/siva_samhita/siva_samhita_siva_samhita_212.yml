unit_label: Chapter 3 — 70
title: When the skilful Yogi, knowing the laws of action…
unit_type: verse
commentary: 'This passage describes a specific prāṇāyāma technique—drawing breath through a contracted
  mouth (crow-bill shape)—as a gateway to liberation. The passage suggests that mastery of the vital currents
  (prāṇa and apāna) through precise bodily knowledge and controlled breath work is not merely a physical
  accomplishment but a direct means to mokṣa. The phrase ''becomes entitled to liberation'' indicates
  that such practice establishes a claim or readiness for freedom, implying that the body''s subtle mechanics
  and consciousness are inseparable in the yogic path.



  Key Terms



  **prāṇa and apāna** — In yogic physiology, the two primary vital currents or life-forces: prāṇa governs
  inhalation and upward movement; apāna governs exhalation and downward movement. Their regulation is
  central to yoga practice.

  **Yogi** — A practitioner of yoga; one who cultivates union of individual consciousness with the ultimate
  through disciplined practice and knowledge.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15 (Laozi):** Both texts locate profound transformation in subtle mastery of breath
  and natural forces—''the ancient masters were profound and knowing'' through attunement to the Tao''s
  flow, as the Yogi attunes to prāṇa. Divergence: The Tao Te Ching emphasizes non-action and paradox;
  the Śiva Saṃhitā prescribes precise, intentional technique and bodily knowledge as the path.


  **Patañjali''s Yoga Sutras, II.49 (prāṇāyāma as limb of yoga):** Both texts affirm breath control as
  a legitimate and powerful yogic practice leading toward liberation or kaivalya. Divergence: The Yoga
  Sutras present prāṇāyāma as one of eight limbs in a systematic hierarchy; the Śiva Saṃhitā emphasizes
  it as a direct, almost sufficient means in itself.


  **Heraclitus, Fragment 12 (on breath and soul):** Both traditions recognize breath as intimately linked
  to the animating principle or consciousness itself—not merely air but a vehicle of subtle knowledge.
  Divergence: Heraclitus speaks poetically of the universal flux; the Śiva Saṃhitā offers a mapped, reproducible
  technique for harnessing breath''s power.'
