  label: Translation
  body: 'By repeating this eighteen lacs of times, he, in his body, can rise from the ground: he attains
    verily the luminous body; he goes all over the universe, wherever he likes; he sees the pores of the
    earth, i.e., he sees the interspaces and the molecules of this solid earth.'
