sanskrit_devanagari: 'घृतं क्षीरं च मिष्टान्नं ताम्बूलं चूर्णवर्जितम्

  कर्पूरं निष्तुष मिष्टं सुमउ सूक्ष्मरन्धकम्

  सिद्धान्तश्रवणं नित्यं वैरावयजाहसेवनम्

  नामसङ्कीर्तनं विष्णोः सुनादश्रवणं परम्

  धृतिः क्षमा तप. शौचं ह्रीर्मतिर्गुरुसेवनम्

  सदैतानि परं योगी नियमानि समाचरेत्'
sanskrit_iast: 'ghṛtaṃ kṣīraṃ ca miṣṭānnaṃ tāmbūlaṃ cūrṇavarjitam

  karpūraṃ niṣtuṣa miṣṭaṃ sumau sūkṣmarandhakam

  siddhāntaśravaṇaṃ nityaṃ vairāvayajāhasevanam

  nāmasaṅkīrtanaṃ viṣṇoḥ sunādaśravaṇaṃ param

  dhṛtiḥ kṣamā tapa. śaucaṃ hrīrmatirgurusevanam

  sadaitāni paraṃ yogī niyamāni samācaret'
