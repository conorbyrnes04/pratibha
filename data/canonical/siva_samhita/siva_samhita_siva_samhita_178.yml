unit_label: Chapter 3 — 35
title: The great Yogi should observe always the following…
unit_type: verse
commentary: 'This passage presents yoga not as world-renunciation but as a balanced integration of sensory
  refinement, ethical conduct, and devotional practice within ordinary life. The list moves from the material
  (clarified butter, milk) through the relational (kind words, household duties) to the inner qualities
  (patience, forgiveness, devotion), suggesting that liberation arises not from denial but from conscious,
  non-attached engagement with all domains of living. The repeated emphasis on *vairagya*—performing duties
  without clinging—indicates the core teaching: the householder''s path is valid precisely because detachment
  is cultivated inwardly, not through external renunciation.



  Key Terms



  **vairagya** — Non-attachment; the quality of performing action and engaging with life without clinging
  to outcomes or identifying with results.

  **Guru** — The qualified spiritual teacher; in this context, the guide whose service and instruction
  are essential to the path.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts teach that yoga is not escape from duty
  but transformation of how duty is performed—through non-attachment and devotion rather than through
  renunciation of the world. Divergence: The Gītā emphasizes duty (*dharma*) as divinely ordained role;
  the Śiva Saṃhitā stresses the householder''s *capacity* for liberation, a more explicit affirmation
  of the lay path.


  **Meister Eckhart: ''a person should be so poor that he is not and has not a place where God can work'':**
  Both teach an inward poverty or non-clinging (*vairagya* / detachment) compatible with outer engagement
  and sensory life, not requiring physical withdrawal. Divergence: Eckhart frames this in Christian apophatic
  terms (negation of self); the Śiva Saṃhitā situates it within a non-dual metaphysics and the subtle
  body, with Viṣṇu-devotion as the devotional anchor.


  **Confucian *li* (propriety, ritual): fulfilling social roles with sincerity:** Both traditions see
  the performance of household and social duties as spiritually significant when done with the right inner
  quality—not mere compliance but conscious participation. Divergence: The Confucian path aims at social
  harmony and virtue; the Śiva Saṃhitā aims at *mokṣa* (liberation), using duty as a vehicle for that
  transcendent goal.'
