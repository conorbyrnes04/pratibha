abhyasa: Today, choose one ordinary duty or meal. Perform it with full attention and care, but notice
  any impulse to grasp, worry, or claim its fruits as 'mine.' Return to that noticing whenever attachment
  arises. This is *vairagya* in miniature—the seed of the teaching.
