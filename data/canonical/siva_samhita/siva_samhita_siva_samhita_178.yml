  label: Translation
  body: 'The great Yogi should observe always the following observances - He should use 1: clarified butter,
    2: milk, 3: sweet food, and 4: betel without lime, 5: camphor; 6: kind words, 7: pleasant monastery
    or retired cell, having a small door; 8: hear discourses on truth, and 9: always discharge his household
    duties with vairagya (without attachment), 10: sing the name of Vishnu; 11: and hear sweet music,
    12: have patience, 13: constancy, 14: forgiveness, 15: austerities, 16: purifications, 17: modesty,
    18: devotion, and 19: service of the Guru.'
