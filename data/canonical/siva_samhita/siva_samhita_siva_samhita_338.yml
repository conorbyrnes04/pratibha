  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī)
    on non-dual metaphysics, the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits
    of practice — notably affirming that even a householder may attain liberation. The practices are traditionally
    learned from a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When one sees, without obstruction, this light for even a moment, becoming free from sin,
  he reaches the highest end.
abhyasa: Sit quietly today and notice moments when your ordinary mental chatter stills—perhaps while watching
  light, in deep listening, or after a breath. Rather than grasping, simply rest in that brief clarity
  without naming it. This is a gentle preparation for understanding what 'seeing without obstruction'
  might mean.
