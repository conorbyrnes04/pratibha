sanskrit_devanagari: Νυκτιφαὲς περὶ γαῖαν ἀλώμενον ἀλλότριον φῶς
translation_literal: Night-bright, wandering around the earth, a light not its own.
commentary: 'The line presents a luminous body without naming it. Its first compound, νυκτιφαές, makes
  it a brightness proper to night; yet the final phrase, ἀλλότριον φῶς, abruptly qualifies that brightness
  as foreign or borrowed. What shines is not therefore the origin of what it shows.


  The participle ἀλώμενον, “wandering,” sets this borrowed radiance in motion around γαῖα, the earth.
  The verse joins visible splendor to dependence: a travelling light circles the world, but its brilliance
  belongs elsewhere. Parmenides’ compressed phrasing lets the nocturnal appearance remain vivid while
  opening a distinction between seeming source and actual source.


  Key Terms


  **νυκτιφαές** — night-shining; radiant in the night

  **ἀλώμενον** — wandering, roaming

  **ἀλλότριον** — belonging to another; alien, borrowed

  **φῶς** — light


  Cross-Tradition Resonances


  **Plato, Timaeus 39b:** Plato calls the moon an instrument for marking months and describes it as receiving
  light from the sun, a cosmological counterpart to Parmenides’ “light not its own.” Divergence: Plato
  embeds this in a crafted cosmic order with explicit astronomical functions; Parmenides’ line merely
  gives the phenomenon in compressed poetic form.

  **Plotinus, Enneads V.1.7:** Plotinus uses the image of light received from a higher source to describe
  derivative reality, echoing the contrast between radiance and an “other” source. Divergence: Plotinus
  turns dependence into a metaphysical hierarchy of Intellect and Soul, whereas this fragment speaks only
  of a moving nocturnal light.

  **Dionysius the Areopagite, The Divine Names IV.4:** Dionysius describes all things as participating
  in and receiving the Good’s illuminating gift; derivative brightness can thus suggest received rather
  than self-originating light. Divergence: Dionysius gives the image a theological meaning centered on
  the transcendent Good, absent from Parmenides’ surviving verse.'
practice: At night, observe the moon for five minutes. Silently note its brightness, its movement, and
  the fact that its light is received; then write one sentence distinguishing what appears self-sustaining
  from what depends on another source.
