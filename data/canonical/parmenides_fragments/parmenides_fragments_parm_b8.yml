sanskrit_devanagari: Μόνος δ' ἔτι μῦθος ὁδοῖο λείπεται ὡς ἔστιν · ταύτῃ δ' ἐπὶ σήματ' ἔασι πολλὰ μάλ'
  ὡς ἀγένητον ἐὸν καὶ ἀνώλεθρόν ἐστιν ἐστι γὰρ οὐλομελές τε καὶ ἀτρεμὲς ἠδ' ἀτέλεστον · οὐδέ ποτ' ἦν οὐδ'
  ἔσται ἐπεὶ νῦν ἔστιν ὁμοῦ πᾶν ἕν συνεχές · τίνα γὰρ γένναν διζήσεαι αὐτοῦ ; πῇ πόθεν αὐξηθέν ; οὔτ΄
  ἐκ μὴ ἐόντος ἐάσσω φάσθαι σ' οὐδὲ νοεῖν · οὐ γὰρ φατὸν οὐδὲ νοητόν ἔστιν ὅπως οὐκ ἔστι. Τί δ' ἄν μιν
  καὶ χρέος ὦρσεν ὕστερον ἢ πρόσθεν τοῦ μηδενὸς ἀρξάμενον φῦν ; οὕτως ἢ πάμπαν πελέναι χρεών ἐστιν ἢ οὐχί.
  Οὐδὲ ποτ' ἐκ μὴ ἐόντος ἐφήσει πίστιος ἰσχύς γίγνεσθαί τι παρ' αὐτό · τοῦ εἵνεκεν οὔτε γενέσθαι οὔτ'
  ὄλλυσθαι ἀνῆκε Δίκη χαλάσασα πέδῃσιν ἀλλ' ἔχει · ἡ δὲ κρίσις περὶ τούτων ἐν τῷδ΄ ἔστιν · ἔστιν ἢ οὐκ
  ἔστιν · κέκριται δ' οὖν ὥσπερ ἀνάγκη τὴν μὲν ἐᾶν ἀνόητον ἀνώνυμον οὐ γὰρ ἀληθής ἔστιν ὁδός) τὴν δ' ὥστε
  πέλειν καὶ ἐτήτυμον εἶναι. Πῶς δ' ἂν ἔπειτα πέλοιτὸ ἐόν ; πῶς δ' ἄν κε γένοιτο ; εἰ γὰρ ἔγεντ' οὐκ ἔστι
  οὐδ' εἴ ποτε μέλλει ἔσεσθαι. Τὼς γένεσις μὲν ἀπέσϐεσται καὶ ἄπυστος ὄλεθρος Οὐδὲ διαιρετόν ἐστιν ἐπεὶ
  πᾶν ἐστιν ὁμοῖον · οὐδέ τι τῇ μᾶλλον τό κεν εἴργοι μιν συνέχεσθαι οὐδέ τι χειρότερον πᾶν δ' ἔμπλεόν
  ἐστιν ἐόντος. Τῷ ξυνεχὲς πᾶν ἐστιν · ἐὸν γὰρ ἐόντι πελάζει. Αὐτὰρ ἀκίνητον μεγάλων ἐν πείρασι δεσμῶν
  ἔστιν ἄναρχον ἄπαυστον ἐπεὶ γένεσις καὶ ὄλεθρος τῆλε μάλ' ἐπλάχθησαν ἀπῶσε δὲ πίστις ἀληθής. Ταὐτόν
  τ' ἐν ταὐτῷ τε μένον καθ' ἑαυτό τε κεῖται χοὔτως ἔμπεδον αὖθι μένει · κρατερὴ γὰρ Ἀνάγκη πείρατος ἐν
  δεσμοῖσιν ἔχει τό μιν ἀμφὶς ἐέργει οὕνεκεν οὐκ ἀτελεύτητον τὸ ἐὸν θέμις εἶναι · ἔστι γὰρ οὐκ ἐπιδεές
  · μὴ ἐὸν δ' ἂν παντὸς ἐδεῖτο. Ταὐτὸν δ' ἐστὶ νοεῖν τε καὶ οὕνεκεν ἔστι νόημα. Οὐ γὰρ ἄνευ τοῦ ἐόντος
  ἐν ᾧ πεφατισμένον ἐστιν εὑρήσεις τὸ νοεῖν · οὐδὲν γὰρ ἢ> ἔστιν ἢ ἔσται ἄλλο πάρεξ τοῦ ἐόντος ἐπεὶ τό
  γε Μοῖρ' ἐπέδησεν οὖλον ἀκίνητόν τ' ἔμεναι · τῷ πάντ' ὄνομ' ἔσται ὅσσα βροτοὶ κατέθεντο πεποιθότες εἶναι
  ἀληθῆ γίγνεσθαί τε καὶ ὄλλυσθαι εἶναί τε καὶ οὐχί καὶ τόπον ἀλλάσσειν διά τε χρόα φανὸν ἀμείϐειν Αὐτὰρ
  ἐπεὶ πεῖρας πύματον τετελεσμένον ἐστί πάντοθεν εὐκύκλου σφαίρης ἐναλίγκιον ὄγκῳ μεσσόθεν ἰσοπαλὲς πάντῃ
  · τὸ γὰρ οὔτε τι μεῖζον οὔτε τι βαιότερον πελέναι χρεόν ἐστι τῇ ἢ τῇ Οὔτε γὰρ οὐκ ἐὸν ἔστι τό κεν παύοι
  μιν ἱκνεῖσθαι εἰς ὁμόν οὔτ' ἐὸν ἔστιν ὅπως εἴη κεν ἐόντος τῇ μᾶλλον τῇ δ' ἧσσον ἐπεὶ πᾶν ἐστιν ἄσυλον
  · οἷ γὰρ πάντοθεν ἶσον ὁμῶς ἐν πείρασι κύρει. Ἐν τῷ σοι παύω πιστὸν λόγον ἠδὲ νόημα ἀμφὶς ἀληθείης ·
  δόξας δ' ἀπὸ τοῦδε βροτείας μάνθανε κόσμον ἐμῶν ἐπέων ἀπατηλὸν ἀκούων. Μορφὰς γὰρ κατέθεντο δύο γνώμας
  ὀνομάζειν · τῶν μίαν οὐ χρεών ἐστιν ἐν ᾧ πεπλανημένοι εἰσίν τἀντία δ' ἐκρίναντο δέμας καὶ σήματ' ἔθεντο
  χωρὶς ἀπ' ἀλλήλων τῇ μὲν φλογὸς αἰθέριον πῦρ ἤπιον ὄν μέγ' ἐλαφρόν ἑωυτῷ πάντοσε τωὐτόν τῷ δ' ἑτέρῳ
  μὴ τωὐτόν · ἀτὰρ κἀκεῖνο κατ' αὐτό τἀντία νύκτ' ἀδαῆ πυκινὸν δέμας ἐμϐριθές τε. Τόν σοι ἐγὼ διάκοσμον
  ἐοικότα πάντα φατίζω ὡς οὐ μή ποτέ τίς σε βροτῶν γνώμη παρελάσσῃ
translation_literal: 'One account alone of the way still remains: that it is. Upon this way are very many
  signs: that, being unborn, it is also imperishable; whole in every member, unmoved, and complete. Nor
  was it ever, nor will it be, since it is now, all together, one, continuous. For what birth of it would
  you seek? How, from where, could it have grown? I shall not allow you to say or think, ‘from what-is-not’;
  for it cannot be spoken or thought how it is not. And what necessity could have stirred it, beginning
  from nothing, to grow later rather than sooner? Thus it must either be altogether or not at all. Nor
  will the force of conviction ever permit anything besides it to come to be from what-is-not. Therefore
  Justice has not released it, loosening her shackles, either to come to be or to perish, but holds it
  fast. The judgment in these matters lies here: it is or it is not. And it has been decided, as necessity
  requires, to leave the one way unthought and nameless—for it is not a true way—and to affirm the other,
  that it is and is genuine. How then could what-is be hereafter? How could it come to be? For if it came
  to be, it is not; nor is it, if it is ever going to be. Thus coming-to-be is extinguished, and destruction
  unheard of.


  Nor is it divisible, since it is all alike; nor is there anything more here to prevent its holding together,
  nor anything less: all is full of what-is. Therefore all is continuous; for what-is draws near to what-is.
  Yet it is motionless within the bounds of mighty bonds, without beginning and without ceasing, since
  birth and destruction have been driven far away: true conviction thrust them off. Remaining the same
  in the same place, it lies by itself, and thus stays steadfast where it is. For strong Necessity holds
  it in the bonds of a boundary which encloses it round about. Therefore it is not right for what-is to
  be without completion: for it lacks nothing; but what-is-not would lack everything.


  Thinking and that for the sake of which there is thought are the same. For without what-is, in which
  it has been uttered, you will not find thinking. For nothing is or shall be other than what-is, since
  Fate has bound it to be whole and motionless. Therefore all those things will be only names which mortals
  have laid down, persuaded that they are true: coming-to-be and perishing, being and not-being, changing
  place and altering bright color.


  But since it has an ultimate boundary, it is complete on every side, like the bulk of a well-rounded
  sphere, equally balanced from the middle in every direction. For it cannot be greater here or smaller
  there. For there is no what-is-not that could stop it from reaching sameness, nor is it possible that
  what-is should be more here and less there, since it is wholly inviolate. Equal to itself from every
  side, it meets uniformly with its bounds.


  Here I cease for you the trustworthy account and thought concerning truth. From this point, learn mortal
  opinions, listening to the deceitful ordering of my words. For they have established two forms to be
  named in judgment; one of them they ought not to have made—therein they have gone astray. They distinguished
  opposite bodies and set their signs apart from one another: on the one hand, the ethereal flame of fire,
  gentle, exceedingly light, the same as itself in every direction, but not the same as the other; and
  that other, by itself, contrary: unknowing night, dense in body and heavy. This arrangement, seeming
  likely in all its parts, I declare to you, so that no mortal judgment may ever surpass you.'
commentary: 'Parmenides makes the δρόμος of inquiry radically narrow: only “it is” (ἔστιν) can be followed.
  The denial of generation is not offered as an observation about physical processes but as the consequence
  of refusing any intelligible passage from μὴ ἐόν, “what-is-not,” to being. What-is cannot have arisen,
  cannot perish, and cannot admit gaps or degrees, because every such claim would invoke absence, lack,
  or a prior non-being. Δίκη, Justice, and Ἀνάγκη, Necessity, give this argument an almost juridical and
  binding force: being is held within its limit, not allowed to escape into birth or destruction.


  The image of the “well-rounded sphere” does not merely picture a physical object; it gathers the predicates
  of completeness, equality, and self-identity. The startling claim that “thinking and that for the sake
  of which there is thought are the same” joins νοεῖν to ἐόν: thought finds no object apart from what-is.
  The final turn to mortal δόξαι, opinions, is therefore deliberate. The cosmology of fire and night is
  articulated rather than simply ignored, but it belongs to a discourse structured by oppositions, names,
  and appearances—precisely the realm that the way of truth has surpassed.


  Key Terms


  **ἐόν / ἔστιν** — what-is; being; the assertion that it is

  **μὴ ἐόν** — what-is-not; non-being, excluded from speech and thought

  **Ἀνάγκη** — Necessity, the constraining power that holds being within its boundary

  **νοεῖν** — to think or apprehend; inseparable here from what-is


  Cross-Tradition Resonances


  **Plato, Sophist 237a–239c:** Plato likewise confronts the difficulty of speaking or thinking “what
  is not,” taking Parmenides’ prohibition as a decisive philosophical challenge. Divergence: Plato seeks
  a qualified account of non-being as otherness, whereas Parmenides’ argument here leaves no such articulated
  role for non-being.

  **Madhyamaka, Nāgārjuna, Mūlamadhyamakakārikā 15.8–11:** Nāgārjuna also rejects simple origination from
  being, non-being, both, or neither, exposing the incoherence of reified arising. Divergence: Parmenides
  affirms a single, stable what-is; Nāgārjuna denies that any phenomenon possesses fixed intrinsic nature.

  **Spinoza, Ethics I, propositions 11, 14, and 15:** Spinoza’s one necessary substance, conceived as
  self-sufficient and not dependent on anything external, recalls Parmenides’ language of wholeness and
  necessity. Divergence: Spinoza’s substance expresses itself through infinitely many attributes and modal
  modifications; Parmenides’ what-is is presented as changeless and without internal differentiation.'
practice: 'For ten minutes, notice each mental movement that divides experience into “has come,” “will
  be,” “more,” “less,” or “missing.” Do not suppress it; silently label it “name.” Then rest with one
  plain question: what, in this very moment, is undeniably present before every story of becoming?'
