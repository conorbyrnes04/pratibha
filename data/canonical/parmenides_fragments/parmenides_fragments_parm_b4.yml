title: The Nearness of What Is
unit_type: passage
sanskrit_devanagari: Λεῦσσε δ' ὅμως ἀπεόντα νόῳ παρεόντα βεϐαίως · οὐ γὰρ ἀποτμήξει τὸ ἐὸν τοῦ ἐόντος
  ἔχεσθαι οὔτε σκιδνάμενον πάντῃ πάντως κατὰ κόσμον οὔτε συνιστάμενον.
translation_literal: See, with the mind, absent things nonetheless steadily present; for you will not
  cut off what-is from clinging to what-is—neither as scattered everywhere, altogether according to order,
  nor as gathered together.
commentary: 'The command begins with Λεῦσσε, “see”: this is not ordinary sight but an act of νοῦς, intellect.
  Things ἀπεόντα, absent, can be held as παρεόντα, present—not through fantasy, but βεβαίως, with firmness
  and certainty. The verse trains thought not to let spatial or perceptual distance decide what is real.


  Its ground is the inseparability of τὸ ἐόν, “what-is,” from τοῦ ἐόντος, “what is.” Being cannot be detached
  from being. Parmenides then denies that this unity is compromised either by σκιδνάμενον, a scattering
  in every direction, or by συνιστάμενον, a coming-together. Neither dispersion nor aggregation supplies
  the fundamental truth of what-is; thought must hold fast to its unbroken continuity.


  Key Terms


  **νοῦς** — intellect; the faculty by which what is absent is grasped as present

  **ἀπεόντα** — things absent, away, or not immediately before one

  **παρεόντα** — things present or at hand

  **τὸ ἐόν** — what-is; being


  Cross-Tradition Resonances


  **Plato, Republic 509d–511e:** Plato likewise contrasts sensory visibility with the intellect’s grasp
  of intelligible reality; νοῦς reaches what is not simply given to the eyes. Divergence: Plato develops
  a plurality of Forms and places the Good beyond being, whereas this fragment insists on the undivided
  adherence of what-is to what-is.

  **Spinoza, Ethics I, proposition 15:** Spinoza’s claim that “whatever is, is in God” offers a later
  vision in which nothing stands outside the one all-inclusive reality. Divergence: Spinoza explains unity
  through God or Substance and its modes; Parmenides here offers no such causal or theological framework.

  **Nāgārjuna, Mūlamadhyamakakārikā 7.17:** Nāgārjuna also resists treating arising and perishing as ultimately
  self-standing features of reality, challenging ordinary assumptions of things coming apart or coming
  to be. Divergence: Madhyamaka denies intrinsic nature (svabhāva), while Parmenides’ δρόμος of inquiry
  affirms the necessity and stability of what-is.'
practice: 'Choose something presently absent—a person, place, or object. Hold it quietly in mind for three
  minutes, then ask: what in this experience depends on distance, change, or arrangement, and what does
  thought still grasp as simply present? Write one sentence without describing it as “coming” or “going.”'
