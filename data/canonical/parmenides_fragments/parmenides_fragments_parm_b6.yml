sanskrit_devanagari: Χρὴ τὸ λέγειν τε νοεῖν τ' ἐὸν ἔμμεναι · ἔστι γὰρ εἶναι μηδὲν δ' οὐκ ἔστιν · τά σ'
  ἐγὼ φράζεσθαι ἄνωγα. Πρώτης γάρ σ' ἀφ' ὁδοῦ ταύτης διζήσιος εἴργω> αὐτὰρ ἔπειτ' ἀπὸ τῆς ἣν δὴ βροτοὶ
  εἰδότες οὐδὲν πλάττονται δίκρανοι · ἀμηχανίη γὰρ ἐν αὐτῶν στήθεσιν ἰθύνει πλακτὸν νόον · οἱ δὲ φοροῦνται
  κωφοὶ ὁμῶς τυφλοί τε τεθηπότες ἄκριτα φῦλα οἷς τὸ πέλειν τε καὶ οὐκ εἶναι ταὐτὸν νενόμισται κοὐ ταὐτόν
  πάντων δὲ παλίντροπός ἐστι κέλευθος.
translation_literal: It is necessary to speak and to think that what-is is; for being is, while nothing
  is not. This is what I urge you to heed. For first I hold you back from this road of inquiry; and then
  from that upon which mortals, knowing nothing, are fashioned two-headed. For helplessness guides the
  wandering mind within their breasts; and they are borne along, deaf and blind alike, astonished, undiscerning
  tribes, for whom being and not-being have been judged both the same and not the same. For their path,
  in all things, turns back upon itself.
commentary: 'The opening joins speech and thought: τὸ λέγειν τε νοεῖν cannot properly take its bearings
  from what is not. The point is not merely that false statements are unfortunate; it is that inquiry
  itself requires what-is as its ground. “Being is” (ἔστι γὰρ εἶναι) gives thought something on which
  to stand, whereas “nothing” cannot become an object of stable saying or knowing.


  The warning then becomes a portrait of ordinary confusion. The mortals are δίκρανοι, “two-headed”: they
  attempt to hold being and not-being as both identical and non-identical. Their νοῦς is πλακτός, wandering
  or driven astray, under the rule of ἀμηχανίη, incapacity or lack of a way through. Thus their κέλευθος
  is παλίντροπος, a road that reverses itself: every advance is undone by the contrary assertion that
  sends thought back where it began.


  Key Terms


  **ἐόν / εἶναι** — what-is; to be, being

  **μηδέν** — nothing; not anything

  **ἀμηχανίη** — bewilderment, helpless lack of passage or resource

  **παλίντροπος** — turning back, reversing upon itself


  Cross-Tradition Resonances


  **Plato, Sophist 237a–239c:** Plato likewise treats speech about “what is not” as a decisive philosophical
  problem, taking up the Eleatic pressure on false statement and non-being. Divergence: In the Sophist,
  Plato revises the prohibition by identifying non-being with difference or otherness, whereas Parmenides
  here bars the road outright.

  **Aristotle, Metaphysics Γ.3–4, 1005b19–1006a11:** Aristotle’s defense of the principle of non-contradiction
  echoes the refusal to treat being and not-being as simply the same. Divergence: Aristotle formulates
  a logical principle concerning predicates and subjects; Parmenides presents an existential and epistemic
  path of inquiry.

  **Daodejing 40:** The Daodejing’s claim that “the beings of the world are born from being; being is
  born from non-being” places being and non-being in a foundational relation. Divergence: Its generative
  paradox sharply contrasts with Parmenides’ insistence that nothing cannot serve as a way for thought
  or account.'
practice: For five minutes, take one claim you are making about yourself or a situation. Write what you
  positively know is so; then mark every phrase that depends on an undefined absence, contradiction, or
  assumption. Rewrite the claim using only what can be clearly said and thought.
