sanskrit_devanagari: Οὕτω τοι κατὰ δόξαν ἔφυ τάδε καί νυν ἔασι καὶ μετέπειτ' ἀπὸ τοῦδε τελευτήσουσι τραφέντα
  · τοῖς δ' ὄνομ' ἄνθρωποι κατέθεντ' ἐπίσημον ἑκάστῳ
translation_literal: So, according to seeming, these things came to be, are now, and thereafter, once
  grown, will come to their end; and for each of them human beings have set down a distinctive name.
commentary: 'The verse gathers the whole visible career of things into a single sequence: coming-to-be,
  present being, growth, and ending. Yet this sequence is explicitly framed as κατὰ δόξαν, “according
  to seeming” or “opinion.” Parmenides does not here deny that mortals encounter a world articulated by
  change; he marks its status. Such a world belongs to the account that appears persuasive to human perception
  and custom, rather than to the ungenerated, imperishable being disclosed by the way of truth.


  Naming seals this mortal ordering. Humans have “set down” an ὄνομα ἐπίσημον, a marked or distinguishing
  name, for each thing. Names make the shifting world legible by dividing it into identifiable beings,
  but they also belong to the same domain as δόξα: they register distinctions among things whose birth,
  maturation, and cessation are themselves only the pattern of appearance. The line is therefore neither
  contemptuous of language nor naïve about it; names are necessary signs within the human world, but they
  do not finally measure what is.


  Key Terms


  **δόξα** — seeming, opinion, the mortal mode of understanding

  **ἔφυ** — came to be, grew into being

  **τελευτήσουσι** — they will reach their end, perish

  **ὄνομα ἐπίσημον** — a distinctive or marked name


  Cross-Tradition Resonances


  **Heraclitus, fr. B12 (DK 22B12):** Heraclitus likewise presents the experienced world through ongoing
  movement: different waters continually flow upon those entering rivers. Divergence: Heraclitus treats
  flux as an expression of a logos-governed order, whereas Parmenides places generation and perishing
  under the rubric of δόξα.

  **Plato, Cratylus 385b–c:** Plato examines whether names correctly disclose the things named, echoing
  Parmenides’ attention to the human imposition of names. Divergence: The Cratylus asks how names may
  be right or wrong; B19 more radically situates naming itself within the mortal account of changing things.

  **Saṃyutta Nikāya 22.95, Pheṇapiṇḍūpama Sutta:** The discourse portrays the aggregates as unstable and
  insubstantial, inviting detachment from what arises and passes away. Divergence: Its diagnosis is directed
  toward the cessation of suffering and does not posit Parmenides’ single, ungenerated Being as the truth
  beyond appearing things.'
practice: 'Choose one ordinary object. Notice the name you give it, then silently trace its apparent history:
  its making, present condition, alteration, and eventual disappearance. Ask: what does the name clarify,
  and what does it conceal about the thing’s changing appearance?'
