sanskrit_devanagari: Ὡς γὰρ ἕκαστος ἔχει κρᾶσιν μελέων πολυπλάγκτων τὼς νόος ἀνθρώποισι παρίσταται · τὸ
  γὰρ αὐτό ἔστιν ὅπερ φρονέει μελέων φύσις ἀνθρώποισιν καὶ πᾶσιν καὶ παντί · τὸ γὰρ πλέον ἐστὶ νόημα.
translation_literal: For as each one has the mixture of much-wandering limbs, so mind stands present to
  human beings; for it is the same thing that the nature of the limbs thinks in human beings—in all alike
  and in each one. For what is in greater measure is thought.
commentary: 'Parmenides ties mortal νόος, “mind” or “awareness,” to the κρᾶσις, the bodily mixture or
  blending, of the “much-wandering limbs.” Thought is not presented here as an aloof faculty surveying
  the body from elsewhere: it “stands present” in accordance with one’s present constitution. The phrase
  evokes unstable, mobile mortal life, whose limbs and elements are subject to changing combinations.


  The closing claim, τὸ γὰρ πλέον ἐστὶ νόημα, makes predominance decisive: what is present in the greater
  portion becomes one’s thinking. This does not simply reduce mind to flesh; rather, it describes the
  mortal mode in which cognition follows the prevailing mixture. The repeated scope—“human beings,” “all,”
  and “each”—gives the claim both universality and radical particularity: every person thinks through
  a shared condition, yet from the particular balance that presently governs them.


  Key Terms


  **κρᾶσις** — mixture, blending, or temperament

  **μελέων** — of limbs; bodily members

  **νόος** — mind, awareness, or understanding

  **πλέον** — the greater part; what predominates


  Cross-Tradition Resonances


  **Empedocles, fr. B108 DK:** Empedocles likewise says that understanding grows in relation to what is
  present, linking cognition to bodily and elemental conditions. Divergence: Empedocles develops a more
  explicit physiology of blood, elemental mixture, and cosmic forces; this fragment states the principle
  more starkly, without that explanatory apparatus.

  **Chāndogya Upaniṣad 6.5.4:** The Upaniṣad connects the finest portion of food with mind, offering another
  account in which cognition is conditioned by embodied nourishment and transformation. Divergence: Its
  aim is to trace body and mind back to sat, being, and ultimately to the identity of self and reality;
  Parmenides here describes mortal thought rather than teaching such an identity.

  **Aristotle, De Anima 1.2, 403a3–10:** Aristotle treats affections of soul, including thinking, as bound
  up with the body and its conditions, continuing the Greek inquiry into embodied psychic life. Divergence:
  Aristotle distinguishes and analyzes faculties with greater precision, and entertains special problems
  concerning intellect; Parmenides’ lines give no faculty psychology, only the dependence of thought on
  predominating mixture.'
practice: 'At three moments today—on waking, after eating, and when tired—pause for one minute and note
  the body’s prevailing condition: tense or loose, heavy or light, agitated or settled. Then write one
  sentence beginning, “What predominates in me now is …,” followed by, “Therefore my thought appears as
  ….”'
