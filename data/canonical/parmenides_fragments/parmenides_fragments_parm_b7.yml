sanskrit_devanagari: Οὐ γὰρ μήποτε τοῦτο δαμῇ εἶναι μὴ ἐόντα · ἀλλὰ σὺ τῆσδ' ἀφ' ὁδοῦ διζήσιος εἶργε νόημα
  · μηδέ σ' ἔθος πολύπειρον ὁδὸν κατὰ τήνδε βιάσθω νωμᾶν ἄσκοπον ὄμμα καὶ ἠχήεσσαν ἀκουήν καὶ γλῶσσαν
  κρῖναι δὲ λόγῳ πολύδηριν ἔλεγχον ἐξ ἐμέθεν ῥηθέντα. Μόνος δ' ἔτι μῦθος ὁδοῖο λείπεται ὡς ἔστιν · ταύτῃ
  δ' ἐπὶ σήματ' ἔασι πολλὰ μάλ' ὡς ἀγένητον ἐὸν καὶ ἀνώλεθρόν ἐστιν ἐστι γὰρ οὐλομελές τε καὶ ἀτρεμὲς
  ἠδ' ἀτέλεστον · οὐδέ ποτ' ἦν οὐδ' ἔσται ἐπεὶ νῦν ἔστιν ὁμοῦ πᾶν ἕν συνεχές · τίνα γὰρ γένναν διζήσεαι
  αὐτοῦ ; πῇ πόθεν αὐξηθέν ; οὔτ΄ ἐκ μὴ ἐόντος ἐάσσω φάσθαι σ' οὐδὲ νοεῖν · οὐ γὰρ φατὸν οὐδὲ νοητόν ἔστιν
  ὅπως οὐκ ἔστι. Τί δ' ἄν μιν καὶ χρέος ὦρσεν ὕστερον ἢ πρόσθεν τοῦ μηδενὸς ἀρξάμενον φῦν ; οὕτως ἢ πάμπαν
  πελέναι χρεών ἐστιν ἢ οὐχί. Οὐδὲ ποτ' ἐκ μὴ ἐόντος ἐφήσει πίστιος ἰσχύς γίγνεσθαί τι παρ' αὐτό · τοῦ
  εἵνεκεν οὔτε γενέσθαι οὔτ' ὄλλυσθαι ἀνῆκε Δίκη χαλάσασα πέδῃσιν ἀλλ' ἔχει · ἡ δὲ κρίσις περὶ τούτων
  ἐν τῷδ΄ ἔστιν · ἔστιν ἢ οὐκ ἔστιν · κέκριται δ' οὖν ὥσπερ ἀνάγκη τὴν μὲν ἐᾶν ἀνόητον ἀνώνυμον οὐ γὰρ
  ἀληθής ἔστιν ὁδός) τὴν δ' ὥστε πέλειν καὶ ἐτήτυμον εἶναι. Πῶς δ' ἂν ἔπειτα πέλοιτὸ ἐόν ; πῶς δ' ἄν κε
  γένοιτο ; εἰ γὰρ ἔγεντ' οὐκ ἔστι οὐδ' εἴ ποτε μέλλει ἔσεσθαι. Τ
translation_literal: 'For never shall this prevail: that things which are not are. But hold your thought
  back from this path of inquiry, and do not let long-tested habit force you along this road, directing
  an aimless eye, a ringing ear, and tongue. Instead, judge by reasoning the much-contested proof spoken
  by me. One account alone of the way still remains: that it is. Upon this way are signs in abundance:
  that what-is is unborn and imperishable; whole in every part, unmoving, and without completion. Nor
  was it ever, nor will it be, since now it is, all together, one, continuous. For what birth would you
  seek for it? How, and from where, did it grow? I shall not allow you either to say or to think, “from
  what-is-not”; for it cannot be spoken or thought that it is not. And what necessity could have stirred
  it, beginning from nothing, to arise later rather than earlier? Thus it is necessary either wholly to
  be or not to be at all. Nor will the force of conviction ever permit anything besides itself to come
  to be from what-is-not. Therefore Justice, not loosening her bonds, has allowed it neither to come into
  being nor to perish, but holds it fast. The decision concerning these matters lies in this: it is, or
  it is not. And it has been decided, as necessity requires, to leave the one way unthought and unnamed—for
  it is not a true way—and to take the other as being and genuine. How, then, could what-is thereafter
  be? How could it come to be? For if it came to be, it is not; nor is it, if it is ever going to be.'
commentary: 'Parmenides begins with an uncompromising prohibition: one must not grant that “what-is-not”
  can be. The issue is not merely whether some particular thing is absent, but whether non-being can be
  made an object of coherent thought or speech. Hence the imperative to restrain νόημα, “thought” or
  “understanding,” from that path. Custom (ἔθος), fortified by repeated experience, draws us toward the
  testimony of eye, ear, and tongue; yet these faculties, when left unexamined, lead along a δρόμος of
  confusion rather than truth.


  The remaining way is marked by the simple assertion ὡς ἔστιν, “that it is.” Its consequences are radical.
  What-is cannot have arisen, for arising would require a transition from what-is-not; nor can it perish,
  for perishing would entail such a transition in reverse. It is therefore ἀγένητον and ἀνώλεθρον, unborn
  and deathless, as well as οὐλομελές, whole-limbed or complete in itself, ἀτρεμές, unshaken, and continuous.
  The poem’s insistence that it is “now, all together, one, continuous” refuses to distribute being across
  a past no longer present or a future not yet present.


  Justice, Δίκη, appears not as a moral judge but as the binding order that prevents being from slipping
  into generation or destruction. The κρίσις, the decisive judgment, is stark: “it is or it is not.” One
  alternative must be abandoned as ἀνόητον and ἀνώνυμον—unthinkable and without a name—while the other
  is affirmed as ἐτήτυμον, genuine or true. The argumentative pressure of the passage lies in this demand
  that thought accept only what can stand without contradiction.


  Key Terms


  **ἐόν / ἐόντα** — what-is; being, or things insofar as they are

  **μὴ ἐόν** — what-is-not; non-being

  **λόγος** — reasoned account, rational discrimination

  **Δίκη** — Justice; the binding order that holds being fast


  Cross-Tradition Resonances


  **Plato, Sophist 237a-239c:** Plato revisits the Eleatic difficulty: if non-being is not, how can it
  be spoken or thought? The dialogue treats Parmenides’ prohibition as a central philosophical obstacle.
  Divergence: Plato ultimately reinterprets non-being as difference or otherness, allowing meaningful
  negation and false statement; Parmenides here gives no such qualification.

  **Melissus, DK 30 B1-B2:** Melissus extends the Eleatic argument that what is cannot have come to be
  from nothing and cannot perish into nothing. Divergence: Melissus argues that what-is is unlimited in
  extent, whereas Parmenides in this passage chiefly stresses its unity, continuity, and freedom from
  generation and destruction.

  **Nāgārjuna, Mūlamadhyamakakārikā 15.8-11:** Nāgārjuna also scrutinizes the opposition of being and
  non-being and challenges accounts that make things arise from either existent or nonexistent conditions.
  Divergence: Nāgārjuna does not establish an eternally self-identical Being; his analysis undermines
  inherent nature in all positions, including fixed being.'
practice: 'For five minutes, notice an object or experience and silently distinguish what is directly
  present from stories of its beginning, disappearance, or imagined future. Then ask: what exactly is
  being asserted when I say that it “is” or “is not”? Record only claims that can be stated without relying
  on vague negation or habit.'
