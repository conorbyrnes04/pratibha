unit_label: Fullness of Light and Night
title: Fullness of Light and Night
unit_type: passage
sanskrit_devanagari: Αὐτὰρ ἐπειδὴ πάντα φάος καὶ νὺξ ὀνόμασται καὶ τὰ κατὰ σφετέρας δυνάμεις ἐπὶ τοῖσί
  τε καὶ τοῖς πᾶν πλέον ἐστὶν ὁμοῦ φάεος καὶ νυκτὸς ἀφάντου ἴσων ἀμφοτέρων ἐπεὶ οὐδετέρῳ μέτα μηδέν.
translation_literal: But since all things have been named Light and Night, and things have been assigned,
  according to their own powers, to the one and to the other, everything alike is full of Light and of
  unseen Night—of both equally—since there is nothing belonging to neither.
commentary: 'This verse turns from the way of unshaken being to the mortal ordering of the visible world.
  Its basic terms are not isolated substances but names: φάος and νύξ. Whatever appears is apportioned
  according to the powers proper to each, so that the world mortals inhabit is intelligible through the
  interplay of light and night.


  Yet the interplay is not a division into two separate regions. «πᾶν πλέων ἐστὶν ὁμοῦ»—everything is
  full together—of both light and ἀφάντου νυκτός, night that is unseen or hidden. The final claim, «οὐδετέρῳ
  μέτα μηδέν», denies an empty remainder outside the pair: neither principle has “nothing” mixed with
  it. Even this cosmology of seeming therefore imagines a world everywhere full, not punctured by nonbeing.


  Key Terms


  **φάος** — light; the luminous principle

  **νύξ ἀφανής** — unseen, hidden night

  **δυνάμεις** — powers or capacities proper to each principle

  **πλέων** — full, filled through and through


  Cross-Tradition Resonances


  **Empedocles, fr. B17 DK:** Empedocles likewise describes the cosmos through mingled basic powers, where
  what appears comes from combination rather than sheer emptiness. Divergence: Empedocles multiplies the
  roots and adds Love and Strife as cosmic agents; Parmenides here frames the mortal order through the
  paired names Light and Night.

  **Heraclitus, fr. B67 DK:** Heraclitus joins opposites such as day and night within a single divine
  or cosmic unity, echoing Parmenides’ refusal to treat the pair as simply disconnected. Divergence: Heraclitus
  emphasizes transformation and the coincidence of opposites; Parmenides stresses the fullness and equal
  presence of two named powers.

  **Plato, Timaeus 31b–32c:** Plato’s crafted cosmos is a complete body composed so that no portion is
  left outside it, recalling the language of a world that is wholly full. Divergence: Plato explains cosmic
  completeness through a demiurgic mathematical construction, whereas Parmenides offers no creator and
  speaks in the vocabulary of Light and Night.'
practice: At dusk, spend five minutes attending to a single place as light fades. Name what becomes visible
  through brightness and what appears only through shadow. Then note, without trying to resolve it, how
  both are present in the same scene and how no part of the scene is simply empty.
