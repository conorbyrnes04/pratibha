- kind: key_terms
  label: Key Terms
  items:
  - term: hodos (ὁδός)
    definition: '‘road, way’ → ways of inquiry: the path of is vs the path of is-not Here: Only one story
      of the way still remains: that it is. Trap: lifestyle path metaphor'
  - term: noein (νοεῖν)
    definition: '‘to think / to know’ → thinking and being co-disclosed—what can be thought is what is
      Here: He has already severed the path of not-being as unthinkable and unspeakable; now he announces
      what survives that cut: ὡς ἔστιν, that it is. Trap: private mental events'
    lemma_id: nous
  - term: to eon / Being (τὸ ἐόν)
    definition: 'neuter participle of εἰμί ‘what is’ → what-is as ungenerated, whole, immovable—object
      of genuine thought Here: On this way there are very many signs: that being is ungenerated and imperishable,
      whole, unique, unmoved, and complete. Trap: a big entity among entities; modern ‘existence’ predicate'
  - term: genesis / perishing
    definition: 'coming-to-be and passing-away → what the goddess bans from genuine Being Here: On this
      way there are very many signs: that being is ungenerated and imperishable, whole, unique, unmoved,
      and complete. Trap: biology of birth/death only'
  layer_provenance: editorial-enriched
