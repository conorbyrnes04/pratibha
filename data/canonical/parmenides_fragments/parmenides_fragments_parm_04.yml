sanskrit_devanagari: μόνος δ' ἔτι μῦθος ὁδοῖο λείπεται ὡς ἔστιν· ταύτῃ δ' ἐπὶ σήματ' ἔασι πολλὰ μάλ',
  ὡς ἀγένητον ἐὸν καὶ ἀνώλεθρόν ἐστιν.
sanskrit_iast: Ancient Greek (Diels-Kranz tradition).
translation_literal: 'Only one story of the way still remains: that it is. On this way there are very
  many signs: that being is ungenerated and imperishable, whole, unique, unmoved, and complete.'
commentary: 'Parmenides executes a logical guillotine here. The phrase μόνος δ'' ἔτι μῦθος ὁδοῖο λείπεται—only
  one account of the way remains—is not rhetorical flourish but the result of eliminating all competitors.
  He has already severed the path of not-being as unthinkable and unspeakable; now he announces what survives
  that cut: ὡς ἔστιν, that it is. This is not a claim about the world''s furniture but about the structure
  of intelligibility itself. What can be thought must be; what cannot be thought (not-being, generation
  from nothing, perishing into nothing) is not a path but a void. The σήματα—signs or markers—that follow
  (ἀγένητον, ἀνώλεθρόν, ὅλον, μοῦνον, ἀκίνητον, τέλειον) are not properties added to being like adjectives
  to a noun. They are what remains when you strip away every form of negation, every temporal rupture,
  every multiplicity that requires one thing to be and another not to be. Being cannot have come to be
  (that would require not-being to precede it); cannot perish (that would require not-being to follow);
  cannot move (motion requires empty space, which is not-being); cannot be multiple (multiplicity requires
  boundaries, which are negations). The passage forces a stark choice: either thought and speech track
  what is—in which case this account holds—or they do not, in which case inquiry itself collapses into
  silence. Parmenides is not describing a hidden realm. He is showing that the very act of thinking commits
  you to this path or to none at all.


  Key Terms


  **μόνος δ'' ἔτι μῦθος ὁδοῖο λείπεται** — Only one account of the way remains; the singular path that
  survives logical elimination of all alternatives (generation, perishing, multiplicity, motion)

  **ὡς ἔστιν** — That it is; the irreducible claim about being''s necessity, not a description of particular
  entities but the structure of intelligibility itself

  **σήματα** — Signs or markers (ἀγένητον, ἀνώλεθρόν, ὅλον, μοῦνον, ἀκίνητον, τέλειον); not properties
  but what remains when negation is stripped away

  **τὸ μὴ ὄν** — Not-being; the unthinkable and unspeakable void that Parmenides severs from the path
  of inquiry, making it no path at all


  Cross-Tradition Resonances


  **Plato, *Sophist* 237a–241e:** Plato inherits Parmenides'' problem: how to speak of not-being without
  contradiction, and how multiplicity and change are possible if being is one and unchanging Divergence:
  Plato introduces the Forms and a distinction between being and becoming to preserve both unity and plurality;
  Parmenides refuses this escape, holding that only one path remains

  **Aristotle, *Metaphysics* I.5, on the Eleatics:** Aristotle recognizes that Parmenides'' argument turns
  on the principle that what is thought must be; he shares the commitment that intelligibility requires
  being Divergence: Aristotle rejects the inference that being must be motionless and one, arguing instead
  that substance (οὐσία) can be multiple and that change is real, not a logical impossibility

  **Hegel, *Science of Logic*, Introduction and Book I:** Hegel''s pure Being (das reine Sein) echoes
  Parmenides'' ὡς ἔστιν as the starting point of thought: an indeterminate immediacy that is also nothing
  until mediated by negation Divergence: Hegel makes negation and difference constitutive of being itself
  through dialectical development; Parmenides treats negation as the void that thought must exclude to
  remain on the path'
insight: Parmenides executes a logical guillotine here.
practice: 'Stop mid-sentence when you catch yourself saying or thinking ''it will no longer be'' or ''it
  was not always'' about something present—a person, a capacity, a state—and reverse the negation: hold
  the present form as continuous, unbroken, without internal rupture, and notice whether the mind resists
  or settles. Repeat this reversal three times on the same object before releasing it.'
