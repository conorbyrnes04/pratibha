unit_type: sutra
sanskrit_devanagari: εἰ δ' ἄγ' ἐγὼν ἐρέω, κόμισαι δὲ σὺ μῦθον ἀκούσας, αἵπερ ὁδοὶ μοῦναι διζήσιός εἰσι
  νοῆσαι.
sanskrit_iast: Ancient Greek (Diels-Kranz tradition).
translation_literal: 'Come, I shall tell you—and convey the story—which roads of inquiry alone there are
  for thinking: the one, that it is and that it is not possible for it not to be, is the path of Persuasion;
  the other, that it is not and that it is necessary that it not be, that I point out to you as a path
  wholly unlearnable.'
commentary: 'Parmenides plants a fork that admits no third prong. The two *hodoi* (roads) are not options
  equally available to thought—they are the exhaustive partition of what inquiry can do. The first road
  says: *to eon* (what-is) *is*, and it is impossible (*ou dunaton*) for it not to be. This is the path
  of *Peitho* (Persuasion), the only one that yields *noesis* (intelligibility). The second road—that
  what-is is not, and must not be—Parmenides does not refute; he declares it *apanta anoeta* (wholly unlearnable).
  This is not rhetorical dismissal but epistemic closure: the second road produces no *logos*, no articulable
  content. The force lies in the asymmetry. To think is already to have chosen: thought grasps only what
  persists in being. Negation of being is not a false claim but a *non-claim*—it cannot be held in mind
  without immediate collapse. The passage does not argue that non-being is impossible in some metaphysical
  sense; it shows that the *attempt to think* non-being dissolves the very capacity to think. This is
  why Parmenides can address the reader as *su* (you)—the fork is not external doctrine but a constraint
  intrinsic to the act of inquiry itself. To inquire is to have already walked the first road.


  Key Terms


  **hodoi** — Roads or paths of inquiry; the two exhaustive routes available to thought, admitting no
  third alternative.

  **to eon** — What-is or being itself; the object that alone can be grasped by thought and persists necessarily
  in intelligibility.

  **Peitho** — Persuasion; the divine force or companion that guides the first road, the only path yielding
  noesis (intelligible thought).

  **apanta anoeta** — Wholly unlearnable; the epistemic status of the second road, which produces no logos
  and cannot be held in mind without collapse.


  Cross-Tradition Resonances


  **Plato, Republic VI.509d–511e (the Divided Line):** Both texts partition reality and cognition into
  hierarchical levels: Parmenides'' two roads map onto Plato''s distinction between noesis (intelligible
  being) and doxa (opinion touching non-being). Each privileges a single mode of true knowing. Divergence:
  Plato allows a middle realm of becoming and mathematical objects; Parmenides admits no third prong—the
  second road is not a lower rung but epistemic void.

  **Aristotle, Metaphysics III.3–4 (the law of non-contradiction):** Both establish that thought cannot
  simultaneously affirm and deny the same predicate of a thing; being and non-being are mutually exclusive
  poles that structure intelligibility itself. Divergence: Aristotle grounds this in the principle of
  non-contradiction as a law of reality; Parmenides shows it as a constraint intrinsic to the *act of
  thinking*, not derived from external metaphysics.

  **Nagarjuna, Mulamadhyamakakarika I.1 (tetralemma rejection):** Both texts confront the limits of affirmation
  and negation: Nagarjuna rejects all four logical positions (is, is not, both, neither); Parmenides rejects
  the second road as unthinkable. Divergence: Nagarjuna''s rejection aims at emptiness and the transcendence
  of conceptual elaboration; Parmenides'' rejection enforces the necessity of being and the univocity
  of what can be thought.'
insight: Parmenides plants a fork that admits no third prong.
practice: 'When a thought arises that something you depend on might cease or fail, do not suppress it—instead,
  hold the negation steady: ''this will not be.'' Notice whether you can maintain that negation as a coherent
  object of attention, or whether the mind immediately reverts to images of what *is* (the thing, the
  person, the condition in its presence). Repeat this three times with the same negation, attending to
  whether intelligibility increases or whether the negation remains a kind of cognitive static.'
