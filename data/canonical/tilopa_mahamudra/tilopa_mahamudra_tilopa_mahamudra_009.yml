pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དེ་ལྟར་སེམས་ཀྱི་རང་བཞིན་གདོད་ནས་ནམ་མཁའ་འདྲ། །

    ཆོས་རྣམས་ཐམས་ཅད་དེ་རུ་མ་འདུས་མེད། །

    ལུས་ཀྱི་བྱ་བ་ཡོངས་ཐོངས་རྣལ་འབྱོར་དལ་བར་སྡོད། །

    ངག་གི་སྨྲ་བརྗོད་མེད་དེ་གྲགས་སྟོང་བྲག་ཆ་འདྲ། །

    ཡིད་ལ་ཅི་ཡང་མི་བསམ་ལ་བཟླའི་ཆོས་ལ་ལྟོས། །'
- kind: translation
  label: Translation
  body: 'Thus the mind’s own nature is primordially like space. All phenomena are without exception gathered
    within it. Release every activity of the body; remain at ease as a yogin. Let speech be without utterance:
    sound and emptiness are like an echo. Think nothing at all in the mind; look to the Dharma beyond
    thought (bsam las ’das pa).'
- kind: commentary
  label: Commentary
  body: 'The verse gives a threefold instruction in body, speech, and mind, grounded in the prior recognition
    that mind’s nature is like space. “All phenomena” are not said to become a single substance; rather,
    appearances, sounds, and thoughts arise without leaving the open field of awareness. Bodily release
    is not mere inactivity but abandonment of compulsive doing. Silence reveals speech as “sound-empty”:
    audible and vivid, yet ungraspable, like an echo lacking an independent source or core. “Think nothing”
    does not demand blankness or suppression. It redirects attention from elaborating thoughts to the
    Dharma beyond conceptual construction—the knowing in which thoughts appear and dissolve. The yogin’s
    ease is therefore non-fabrication, not dull withdrawal.'
- kind: key_terms
  label: Key Terms
  body: '**སེམས་ཀྱི་རང་བཞིན་ (sems kyi rang bzhin)** — The intrinsic nature of mind: the open, ungraspable
    basis in which mental events arise.


    **ནམ་མཁའ་ (nam mkha’)** — Space; a metaphor for mind’s unobstructed, non-material, and non-localizable
    nature.


    **གྲགས་སྟོང་ (grags stong)** — Sound-empty: sound appears clearly while lacking inherent, self-established
    reality.'
- kind: resonances
  label: Resonances
  body: '**Mahāmudrā teachings of Saraha:** Saraha likewise directs the practitioner away from contrivance
    and toward the naturally present, unmade nature of mind. Divergence: This verse explicitly structures
    the instruction through body, speech, and mind, with the echo as its central image for speech.


    **Prajñāpāramitā literature:** Its teaching that phenomena lack inherent nature parallels the verse’s
    presentation of appearances as included within space-like mind. Divergence: Prajñāpāramitā often argues
    analytically through emptiness; Tilopa gives an immediate yogic instruction in release and looking.'
- kind: practice
  label: Practice
  body: Sit with the body unforced, letting unnecessary adjustments and projects fall away. Attend to
    sounds without naming or following them; notice their echo-like arising and vanishing. When thoughts
    appear, do not continue them or try to expel them; turn gently toward the open knowing in which they
    occur.
