title: Skylike Mind, Uncontrived Ease
unit_type: verse
commentary: 'The verse gives a threefold instruction in body, speech, and mind, grounded in the prior
  recognition that mind’s nature is like space. “All phenomena” are not said to become a single substance;
  rather, appearances, sounds, and thoughts arise without leaving the open field of awareness. Bodily
  release is not mere inactivity but abandonment of compulsive doing. Silence reveals speech as “sound-empty”:
  audible and vivid, yet ungraspable, like an echo lacking an independent source or core. “Think nothing”
  does not demand blankness or suppression. It redirects attention from elaborating thoughts to the Dharma
  beyond conceptual construction—the knowing in which thoughts appear and dissolve. The yogin’s ease is
  therefore non-fabrication, not dull withdrawal.'
