pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ཕྱག་རྒྱ་ཆེན་པོ་བསྟན་དུ་མེད་ཀྱིས་ཀྱང་། །

    དཔེར་ན་ནམ་མཁའ་གང་གིས་གང་ལ་བརྟེན། །

    རང་སེམས་ཕྱག་རྒྱ་ཆེ་ལ་བརྟེན་ཡུལ་མེད། །

    མ་བཅོས་གཉུག་མའི་ངང་དུ་གློད་ལ་ཞོག །

    བཅིངས་པ་ཀློད་ན་གྲོལ་བར་ཐེ་ཚོམ་མེད། །'
- kind: translation
  label: Translation
  body: 'Mahāmudrā (the Great Seal) cannot be pointed out. Like the sky, on what could it depend? One’s
    own mind is Mahāmudrā: it has no object of reliance. Relax and leave it in the uncontrived (ma bcos),
    innate (gnyug ma) state. When bondage is released, there is no doubt of liberation.'
- kind: commentary
  label: Commentary
  body: 'The verse denies that Mahāmudrā is an object that can be demonstrated, grasped, or established
    on some supporting basis. The image of space is precise: sky is open presence, yet cannot be located
    as resting on another thing. Likewise, mind’s nature is not to be sought outside experience or fixed
    through a reference point. “Leave it” does not mean blankness, passivity, or suppressing thought;
    it means releasing the effort that alters, solidifies, or appropriates what appears. Bondage is chiefly
    this constricting act of fixation—making mind into a subject, appearances into objects, and awareness
    into something to manage. Liberation is not newly produced: when the binding is loosened, the already
    ungrounded and uncontrived nature is evident.'
- kind: key_terms
  label: Key Terms
  body: '**phyag rgya chen po (Mahāmudrā)** — “Great Seal”: the all-pervasive, nondual nature of mind
    and appearances.


    **ma bcos** — Uncontrived; not modified by deliberate fabrication, correction, or meditative manipulation.


    **gnyug ma** — Innate or natural: the primordial, ordinary condition before conceptual elaboration.'
- kind: resonances
  label: Resonances
  body: '**Dzogchen teachings on rigpa:** Both counsel resting without alteration in an already present,
    self-existing knowing rather than constructing a result. Divergence: Dzogchen often foregrounds the
    direct recognition of rigpa, whereas this verse frames the point through Mahāmudrā and the release
    of reliance and bondage.


    **Nāgārjuna’s Mūlamadhyamakakārikā:** Both undermine any independently established support or ground
    on which phenomena could finally rest. Divergence: Nāgārjuna proceeds through analytical reasoning
    about emptiness; Tilopa gives direct contemplative instruction for relaxing fixation.'
- kind: practice
  label: Practice
  body: Sit comfortably and let perceptions, thoughts, and sensations arise without choosing a support
    or trying to improve them. Notice each impulse to hold, reject, explain, or stabilize experience;
    gently release that impulse and remain in the uncontrived openness that is left. Do not make openness
    into an object.
