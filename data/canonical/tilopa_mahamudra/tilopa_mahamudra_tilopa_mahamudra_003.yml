unit_label: Sky Without Support
title: Sky Without Support
unit_type: verse
commentary: 'The verse denies that Mahāmudrā is an object that can be demonstrated, grasped, or established
  on some supporting basis. The image of space is precise: sky is open presence, yet cannot be located
  as resting on another thing. Likewise, mind’s nature is not to be sought outside experience or fixed
  through a reference point. “Leave it” does not mean blankness, passivity, or suppressing thought; it
  means releasing the effort that alters, solidifies, or appropriates what appears. Bondage is chiefly
  this constricting act of fixation—making mind into a subject, appearances into objects, and awareness
  into something to manage. Liberation is not newly produced: when the binding is loosened, the already
  ungrounded and uncontrived nature is evident.'
