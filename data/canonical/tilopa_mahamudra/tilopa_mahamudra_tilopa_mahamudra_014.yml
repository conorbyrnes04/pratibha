unit_label: Lamp Beyond Extremes
title: Lamp Beyond Extremes
unit_type: verse
commentary: 'The verse joins ethical release, view, and meditation in a single movement. Freedom from
  desire is not mere suppression: it is the absence of clinging that would make mind settle upon an extreme—existence
  or nonexistence, permanence or annihilation, purity or defilement. From such non-abiding, the scriptural
  Dharma is “seen” as a coherent indication rather than held as competing doctrines. “Applying oneself”
  to this meaning frees one from saṃsāra because bondage is sustained by grasping at what experience is
  taken to be. “Resting evenly” does not mean blankness; it is stable, nondual presence in that insight.
  The claim that obscurations are burned stresses the transformative force of realization, while “lamp”
  presents this as illumination: it makes the path intelligible without becoming another object to cling
  to.'
