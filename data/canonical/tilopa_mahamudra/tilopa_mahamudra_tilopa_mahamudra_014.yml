pratibha_layers:
- kind: original
  label: Tibetan
  body: "ཞེ་འདོད་ཀུན་བྲལ་མཐའ་ལ་མི་གནས་ན། །\nསྡེ་སྣོད་ཆོས་རྣམས་མ་ལུས་མཐོང་བར་འགྱུར། \nདོན་འདིར་གཞོལ་ན་འཁོར་བའི་བཙོན་ལས་ཐར།\
    \ །\nདོན་འདིར་མཉམ་བཞག་སྡིག་སྒྲིབ་ཐམས་ཅད་སྲེག །\nབསྟན་པའི་སྒྲོན་མེ་ཞེས་སུ་བཤད་པ་ཡིན། །"
- kind: translation
  label: Translation
  body: Free of every grasping desire, not abiding in extremes (anta), one comes to see without remainder
    all the Dharma teachings of the collections. Applying oneself to this meaning, one is freed from the
    prison of saṃsāra. Resting evenly in this meaning (samāhita), all sins and obscurations are burned
    away. This is called the lamp of the teaching.
- kind: commentary
  label: Commentary
  body: 'The verse joins ethical release, view, and meditation in a single movement. Freedom from desire
    is not mere suppression: it is the absence of clinging that would make mind settle upon an extreme—existence
    or nonexistence, permanence or annihilation, purity or defilement. From such non-abiding, the scriptural
    Dharma is “seen” as a coherent indication rather than held as competing doctrines. “Applying oneself”
    to this meaning frees one from saṃsāra because bondage is sustained by grasping at what experience
    is taken to be. “Resting evenly” does not mean blankness; it is stable, nondual presence in that insight.
    The claim that obscurations are burned stresses the transformative force of realization, while “lamp”
    presents this as illumination: it makes the path intelligible without becoming another object to cling
    to.'
- kind: key_terms
  label: Key Terms
  body: '**མཐའ་ (mtha'', anta)** — An extreme or limiting position, especially reifying existence or denying
    it altogether.


    **འཁོར་བ་ (’khor ba, saṃsāra)** — Cyclic conditioned existence, experienced here as a prison sustained
    by grasping.


    **མཉམ་བཞག་ (mnyam bzhag, samāhita)** — Evenly settled contemplative absorption or equipoise in the
    indicated meaning.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna’s Mūlamadhyamakakārikā:** Nāgārjuna repeatedly rejects fixation on the extremes of
    existence and nonexistence, making non-grasping the condition for seeing dependent arising rightly.
    Divergence: This verse gives a direct contemplative and purificatory promise, whereas Nāgārjuna’s
    work is principally dialectical analysis.


    **The Heart Sūtra:** Its teaching that all dharmas are empty undermines grasping and allows freedom
    from obstructive conceptual positions. Divergence: The Heart Sūtra foregrounds emptiness and the bodhisattva
    path; this verse foregrounds equipoise and calls it a lamp of the teaching.'
- kind: practice
  label: Practice
  body: 'Notice a desire or aversion as it arises, and gently ask what extreme it invites: solid possession,
    total rejection, certainty, or negation. Without following or suppressing it, rest evenly with the
    knowing itself for several breaths. Let the teaching be a lamp for seeing the movement of grasping,
    not another conclusion to hold.'
