pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཔེར་ན་ས་རླངས་སྤྲིན་ནི་ནམ་མཁའི་དབྱིངས་སུ་དེངས། །

    གར་ཡང་སོང་བ་མེད་ཅིང་གར་ཡང་གནས་པ་མེད། །

    དེ་བཞིན་སེམས་ལས་བྱུང་བའི་རྟོག་ཚོགས་ཀྱང་། །

    རང་སེམས་མཐོང་བས་རྟོག་པའི་རྦ་རླབས་དྭངས། །'
- kind: translation
  label: Translation
  body: 'Like mist and clouds that dissolve into the expanse of sky—

    they go nowhere and abide nowhere—

    so too the collections of thoughts arising from mind:

    when one sees one’s own mind, the waves of thought grow clear.'
- kind: commentary
  label: Commentary
  body: 'The image is precise: clouds seem to form, move, and vanish, yet the sky is neither altered nor
    divided by them. Tilopa applies this not to deny the appearance of thoughts, but to direct attention
    to their basis. Thoughts arise from mind and, when examined in the recognition of mind itself, lack
    a fixed place of origin, duration, or destination. “Seeing one’s own mind” does not mean constructing
    an idea about mind; it means directly noticing the knowing presence in which thoughts occur. In that
    recognition, conceptual proliferation is not forcibly suppressed. Its wave-like agitation clears because
    it is no longer taken as solid, binding, or other than the open field in which it appears. The verse
    therefore joins non-meditation with lucid self-knowing: leave appearances ungrasped, while recognizing
    their empty, mind-born character.'
- kind: key_terms
  label: Key Terms
  body: '**ནམ་མཁའ་ (nam mkha'')** — Sky or space; an image for unobstructed, unconfined awareness.


    **སེམས་ (sems)** — Mind; here both the source of thoughts and that which must be directly recognized.


    **རྟོག་པ་ (rtog pa)** — Discursive thought or conceptual proliferation, compared to waves that become
    clear.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna, Mūlamadhyamakakārikā:** Nāgārjuna analyzes phenomena as lacking fixed arising, abiding,
    and ceasing; this verse similarly denies thoughts a settled trajectory or location. Divergence: Tilopa
    gives an experiential instruction centered on recognizing mind, whereas Nāgārjuna primarily employs
    dialectical analysis of emptiness.


    **Dzogchen teachings on thoughts as waves in water:** Both portray thoughts as self-liberating appearances
    when their ground or knowing nature is recognized rather than followed. Divergence: This verse belongs
    to Mahāmudrā and frames the point through seeing one’s own mind, not through Dzogchen’s distinct language
    of rigpa and primordial purity.'
- kind: practice
  label: Practice
  body: 'Sit quietly and let thoughts arise without trying to stop or improve them. For each thought,
    look gently: where does it come from, where does it remain, and where does it go? Then rest in the
    open knowing that notices the thought, as sky is untouched by a passing cloud.'
