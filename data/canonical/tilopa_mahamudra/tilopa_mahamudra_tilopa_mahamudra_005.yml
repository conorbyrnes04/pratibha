unit_label: Clouds Clear in Mind-Space
title: Clouds Clear in Mind-Space
unit_type: verse
commentary: 'The image is precise: clouds seem to form, move, and vanish, yet the sky is neither altered
  nor divided by them. Tilopa applies this not to deny the appearance of thoughts, but to direct attention
  to their basis. Thoughts arise from mind and, when examined in the recognition of mind itself, lack
  a fixed place of origin, duration, or destination. “Seeing one’s own mind” does not mean constructing
  an idea about mind; it means directly noticing the knowing presence in which thoughts occur. In that
  recognition, conceptual proliferation is not forcibly suppressed. Its wave-like agitation clears because
  it is no longer taken as solid, binding, or other than the open field in which it appears. The verse
  therefore joins non-meditation with lucid self-knowing: leave appearances ungrasped, while recognizing
  their empty, mind-born character.'
