title: Cutting the Root
unit_type: verse
commentary: 'The verse first prescribes outer seclusion: not hostility toward beings, but release from
  the compulsive relational field of attraction, aversion, and object-fixation. Solitude supports seeing
  the mind directly. Yet its decisive instruction is not to fabricate a special meditative state. To “abide
  in what cannot be meditated” means to cease manipulating awareness into subject, object, and technique;
  lucid knowing is left uncontrived. “Attaining the unattainable” rejects Mahāmudrā as a possession acquired
  by an ego. The tree image identifies mind’s root not with bare awareness itself, but with grasping at
  mind and appearances as truly established. Once that root is severed through direct recognition, the
  proliferating branches of saṃsāric reactivity lose their nourishment and naturally fade.'
