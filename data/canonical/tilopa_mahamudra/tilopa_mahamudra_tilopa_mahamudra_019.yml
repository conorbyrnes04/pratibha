pratibha_layers:
- kind: original
  label: Tibetan
  body: 'འཁོར་ཡུལ་ཆགས་སྡང་འབྲེལ་པ་ཀུན་གཅོད་ནས། །

    གཅིག་པུར་ནགས་འདབས་རི་ཁྲོད་གནས་པར་བསྒོམ། །

    བསྒོམ་དུ་མེད་པའི་ངང་ལ་གནས་པར་གྱིས། །

    ཐོབ་མེད་ཐོབ་ན་ཕྱག་རྒྱ་ཆེན་པོ་འཐོབ། །

    དཔེར་ན་ལྗོན་ཤིང་སྡོང་པོ་ཡལ་ག་ལོ་འདབ་རྒྱས། །

    རྩ་བ་གཅིག་བཅད་ཡལ་ག་ཁྲི་འབུམ་སྐམ། །

    དེ་བཞིན་སེམས་ཀྱི་རྩ་བ་བཅད་ན་འཁོར་བའི་ལོ་འདབ་སྐམ། །'
- kind: translation
  label: Translation
  body: 'Having cut every tie of attachment and aversion to saṃsāric objects,

    meditate alone at the edge of a forest, in a mountain retreat.

    Abide in the state in which there is nothing to meditate.

    If you attain the unattainable, you attain Mahāmudrā (Great Seal).

    For example, though a tree’s trunk, branches, and leaves spread luxuriantly,

    when its single root is cut, its hundreds of thousands of branches wither.

    Likewise, when the root of mind is cut, the leaves of saṃsāra wither.'
- kind: commentary
  label: Commentary
  body: 'The verse first prescribes outer seclusion: not hostility toward beings, but release from the
    compulsive relational field of attraction, aversion, and object-fixation. Solitude supports seeing
    the mind directly. Yet its decisive instruction is not to fabricate a special meditative state. To
    “abide in what cannot be meditated” means to cease manipulating awareness into subject, object, and
    technique; lucid knowing is left uncontrived. “Attaining the unattainable” rejects Mahāmudrā as a
    possession acquired by an ego. The tree image identifies mind’s root not with bare awareness itself,
    but with grasping at mind and appearances as truly established. Once that root is severed through
    direct recognition, the proliferating branches of saṃsāric reactivity lose their nourishment and naturally
    fade.'
- kind: key_terms
  label: Key Terms
  body: '**phyag rgya chen po (Mahāmudrā)** — “Great Seal”: the all-pervading reality of mind and phenomena,
    directly recognized rather than produced.


    **bsgom du med pa** — “Nothing to meditate”: uncontrived abiding beyond a meditator, object, or fabricated
    state.


    **sems kyi rtsa ba** — “The root of mind”: the fundamental grasping that sustains dualistic saṃsāric
    proliferation.'
- kind: resonances
  label: Resonances
  body: '**Saraha’s Dohā songs:** Saraha repeatedly directs the practitioner beyond contrived meditation
    to the innate, unfabricated nature of mind. Divergence: Tilopa here joins that non-meditation instruction
    to a stark rhetoric of solitude and to the specific image of cutting mind’s root.


    **Bhagavad Gītā 15:** The Gītā also uses a tree whose binding structure must be cut at its root to
    reach freedom beyond saṃsāra. Divergence: The Gītā’s tree is cut through detachment and pursuit of
    the supreme abode, whereas Tilopa points specifically to nondual recognition of mind.'
- kind: practice
  label: Practice
  body: 'For a brief period, simplify sensory and social input without treating people as enemies. Sit
    quietly and notice each pull of liking, disliking, or mental elaboration; instead of following or
    suppressing it, rest in the knowing in which it appears. Ask gently: what grasping gives this branch
    its root? Then leave the question open, without manufacturing an answer.'
