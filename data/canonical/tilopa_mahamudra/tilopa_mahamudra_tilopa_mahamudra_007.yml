pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཔེར་ན་གསལ་དྭང་ཉི་མའི་སྙིང་པོ་དེ། །

    བསྐལ་པ་སྟོང་གི་མུན་པས་སྒྲིབ་མི་འགྱུར། །

    དེ་བཞིན་རང་སེམས་སྙིང་པོ་འོད་གསལ་དེ། །

    བསྐལ་པའི་འཁོར་བས་སྒྲིབ་པར་མི་ནུས་སོ། །'
- kind: translation
  label: Translation
  body: Just as the clear, pure essence of the sun cannot be veiled by the darkness of a thousand aeons,
    so the luminous clarity (prabhāsvara) that is the essence of one’s own mind cannot be obscured by
    saṃsāra through the ages.
- kind: commentary
  label: Commentary
  body: 'The analogy is exacting: darkness does not stain, diminish, or enter the sun; it only prevents
    a particular observer from seeing it. Likewise, cyclic existence may condition experience with confusion,
    affliction, and habitual grasping, but it cannot alter mind’s luminous essence. This is not a claim
    that ordinary thoughts are inherently wise, nor a reason to deny suffering or ethical causality. Rather,
    it distinguishes passing obscurations from the basic capacity for knowing itself. “One’s own mind”
    directs attention away from a remote metaphysical object: the relevant ground is immediate awareness.
    In Mahāmudrā, recognition of this luminosity is not produced by effort; practice removes the habit
    of taking obscuring appearances to be the mind’s final nature.'
- kind: key_terms
  label: Key Terms
  body: '**འོད་གསལ་ (’od gsal; prabhāsvara)** — Luminous clarity: the cognizant, unstained character of
    mind.


    **རང་སེམས་སྙིང་པོ་ (rang sems snying po)** — The essence or heart of one’s own mind.


    **འཁོར་བ་ (’khor ba; saṃsāra)** — The cyclic round of conditioned existence, marked by confusion and
    recurring suffering.'
- kind: resonances
  label: Resonances
  body: '**Ratnagotravibhāga (Uttaratantra):** It compares the luminous buddha-nature to something intrinsically
    pure yet covered by adventitious defilements, which do not alter its nature. Divergence: This verse
    speaks directly of one’s own mind and uses the sun and darkness image rather than systematically expounding
    tathāgatagarbha.


    **Dzogchen teachings on ka dag and ’od gsal:** Dzogchen likewise presents awareness as primordially
    pure and luminous, not corrupted by temporary mental movements. Divergence: Tilopa’s Mahāmudrā presentation
    here does not employ the distinctive Dzogchen framework of rigpa, spontaneous presence, or direct
    introduction.'
- kind: practice
  label: Practice
  body: Sit quietly and let sensations, thoughts, and moods arise without trying to improve or suppress
    them. Ask whether any passing state actually stains the bare fact that it is known; rest briefly in
    that open knowing. Do not turn luminosity into an imagined light—recognize it as the ungraspable clarity
    present before and during each appearance.
