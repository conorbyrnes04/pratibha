unit_label: Light Beyond the Ages
title: Light Beyond the Ages
unit_type: verse
commentary: 'The analogy is exacting: darkness does not stain, diminish, or enter the sun; it only prevents
  a particular observer from seeing it. Likewise, cyclic existence may condition experience with confusion,
  affliction, and habitual grasping, but it cannot alter mind’s luminous essence. This is not a claim
  that ordinary thoughts are inherently wise, nor a reason to deny suffering or ethical causality. Rather,
  it distinguishes passing obscurations from the basic capacity for knowing itself. “One’s own mind” directs
  attention away from a remote metaphysical object: the relevant ground is immediate awareness. In Mahāmudrā,
  recognition of this luminosity is not produced by effort; practice removes the habit of taking obscuring
  appearances to be the mind’s final nature.'
