pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ལུས་ལ་སྙིང་པོ་མེད་པ་སྨྱུགས་མའི་སྡོང་པོ་འདྲ། །

    སེམས་ནི་ནམ་མཁའི་དཀྱིལ་ལྟར་བསམ་པའི་ཡུལ་ལས་འདས། །

    དེ་ཡི་ངང་ལ་བཏང་བཞག་མེད་པར་གློད་ལ་ཞོག །'
- kind: translation
  label: Translation
  body: The body, without essence, is like a hollow bamboo stalk. The mind is like the center of space
    (nam mkha’), beyond the range of thought. In that very condition, relax and rest—without casting off
    or setting down anything.
- kind: commentary
  label: Commentary
  body: 'The verse first undermines bodily fixation: the body is not denied conventionally, but is compared
    to bamboo—structured and usable, yet hollow of any solid core. It then directs attention to mind,
    whose nature is likened not merely to sky but to its unobstructed middle: it cannot be captured as
    an object by conceptual thought. The instruction is therefore not to manufacture a blank state, suppress
    thoughts, or establish a special meditation. “Without casting off or setting down” rejects both abandoning
    appearances and deliberately placing awareness upon a chosen support. One relaxes within the already
    open condition of mind, allowing thought, sensation, and perception to arise without reifying a body,
    mind, or meditator.'
- kind: key_terms
  label: Key Terms
  body: '**sems (སེམས)** — Mind; here, its basic nature is said to exceed conceptual objectification.


    **nam mkha’ (ནམ་མཁའ)** — Space or sky, an image for unobstructed, ungraspable awareness.


    **glod (གློད)** — To loosen or relax; release effort rather than construct a meditative state.'
- kind: resonances
  label: Resonances
  body: '**Saraha’s Dohākośagīti:** Saraha repeatedly compares awakened awareness to open space and counsels
    freedom from contrivance. Divergence: Saraha often frames this freedom through tantric yogic imagery,
    while this verse gives a bare and direct instruction in resting.


    **The Heart Sūtra:** Its teaching that phenomena lack inherent essence resonates with the body’s comparison
    to hollow bamboo. Divergence: The Heart Sūtra presents a broad prajñāpāramitā analysis of all dharmas;
    this verse turns immediately to experiential release in mind’s open nature.'
- kind: practice
  label: Practice
  body: 'Sit comfortably and notice the body as a changing, hollow arrangement of sensations rather than
    a fixed core. Then let attention open like the middle of the sky: do not chase thoughts away or pin
    awareness to an object. Each time effort tightens, gently loosen and rest without adding or removing
    anything.'
