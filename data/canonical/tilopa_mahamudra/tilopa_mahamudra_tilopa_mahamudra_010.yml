unit_label: Resting Like Open Sky
title: Resting Like Open Sky
unit_type: verse
commentary: 'The verse first undermines bodily fixation: the body is not denied conventionally, but is
  compared to bamboo—structured and usable, yet hollow of any solid core. It then directs attention to
  mind, whose nature is likened not merely to sky but to its unobstructed middle: it cannot be captured
  as an object by conceptual thought. The instruction is therefore not to manufacture a blank state, suppress
  thoughts, or establish a special meditation. “Without casting off or setting down” rejects both abandoning
  appearances and deliberately placing awareness upon a chosen support. One relaxes within the already
  open condition of mind, allowing thought, sensation, and perception to arise without reifying a body,
  mind, or meditator.'
