unit_label: A Lamp Beyond Guarding
title: A Lamp Beyond Guarding
unit_type: verse
commentary: 'The verse overturns an externalized understanding of commitment. Samaya is not secured by
  the anxious mental policing of conduct or experience; such conceptual guarding already misses its living
  meaning. Nor is non-thought a project of forcing stillness: even the desire to become calm is another
  movement of appropriation. Thoughts and appearances are instead self-arisen and self-settling, evanescent
  as forms on water. “Not abiding” rejects fixing awareness in an object, state, or identity; “not apprehending”
  rejects making even emptiness into something possessed. Yet this is not indifference or a departure
  from discipline. To remain inseparable from this non-grasping meaning is itself the unbroken commitment,
  illuminating confusion from within rather than suppressing it.'
