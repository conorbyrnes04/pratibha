pratibha_layers:
- kind: original
  label: Tibetan
  body: 'རྟོག་པའི་སྲུང་སྡོམ་དམ་ཚིག་དོན་ལས་ཉམས། །

    ཡིད་ལ་མི་བྱེད་ཞི་འདོད་ཀུན་དང་བྲལ། །

    རང་བྱུང་རང་ཞི་ཆུ་ཡི་པ་ཏྲ་འདྲ། །

    མི་གནས་མི་དམིགས་དོན་ལས་མི་འདའ་ན། །

    དམ་ཚིག་མི་འདའ་མུན་པའི་སྒྲོན་མེ་ཡིན། །'
- kind: translation
  label: Translation
  body: 'Conceptual guarding and restraint miss the meaning of samaya (sacred commitment). Do not make
    anything in the mind; be free even of the wish for calm. Self-arisen, self-settled, like a pattern
    upon water: if, without abiding or apprehending, you do not stray from the meaning, you do not violate
    samaya—this is a lamp in darkness.'
- kind: commentary
  label: Commentary
  body: 'The verse overturns an externalized understanding of commitment. Samaya is not secured by the
    anxious mental policing of conduct or experience; such conceptual guarding already misses its living
    meaning. Nor is non-thought a project of forcing stillness: even the desire to become calm is another
    movement of appropriation. Thoughts and appearances are instead self-arisen and self-settling, evanescent
    as forms on water. “Not abiding” rejects fixing awareness in an object, state, or identity; “not apprehending”
    rejects making even emptiness into something possessed. Yet this is not indifference or a departure
    from discipline. To remain inseparable from this non-grasping meaning is itself the unbroken commitment,
    illuminating confusion from within rather than suppressing it.'
- kind: key_terms
  label: Key Terms
  body: '**dam tshig** — Samaya: sacred commitment; here its essence is non-grasping fidelity to reality,
    not mere rule-keeping.


    **yid la mi byed** — Non-mentation: not mentally fabricating, manipulating, or taking up an object.


    **rang byung rang zhi** — Self-arisen and self-settled: phenomena arise and release themselves without
    contrived intervention.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna’s Madhyamakakārikā:** Nāgārjuna rejects grasping at existence and nonexistence; Tilopa
    likewise joins non-abiding and non-apprehension. Divergence: Nāgārjuna argues dialectically about
    emptiness, while this verse gives direct yogic instruction on samaya and mind.


    **Dzogchen teachings on self-liberation:** Both speak of thoughts arising and releasing by themselves
    when they are not grasped. Divergence: Tilopa frames this in Mahāmudrā terms and explicitly makes
    it the meaning of tantric commitment.'
- kind: practice
  label: Practice
  body: 'For a short period, let thoughts, sensations, and the wish to become peaceful arise without correcting
    or following them. Notice each event as a transient pattern on water: neither hold it in place nor
    push it away. End by asking whether non-grasping itself can be recognized as fidelity rather than
    neglect.'
