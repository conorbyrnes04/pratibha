pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དོན་འདིར་མི་མོས་སྐྱེ་བོ་བླུན་པོ་རྣམས། །

    འཁོར་བའི་ཆུ་བོས་རྟག་ཏུ་ཁྱེར་བར་ཟད། །

    ངན་སོང་སྡུག་བསྔལ་མི་བཟད་བླུན་པོ་སྙིང་རེ་རྗེ། །

    མི་བཟད་ཐར་འདོད་བླ་མ་མཁས་ལ་བསྟེན། །

    བྱིན་རླབས་སྙིང་ལ་ཞུགས་ན་རང་སེམས་གྲོལ་བར་འགྱུར། །'
- kind: translation
  label: Translation
  body: 'Those foolish people who have no faith in this meaning (don) are forever swept along by the river
    of saṃsāra. Pitiful fools: unbearable suffering in the lower realms awaits them. If you seek release
    from what is unbearable, rely on a learned guru (bla ma). When blessing (byin rlabs) enters the heart,
    your own mind is liberated.'
- kind: commentary
  label: Commentary
  body: 'The verse joins warning, compassion, and a precise path instruction. “This meaning” is not merely
    a doctrine to assent to, but the liberating import of mahāmudrā: mind’s nature must be recognized
    rather than ignored. Lack of confidence leaves beings passively borne by habitual karma, imaged as
    a river with no stable footing. The reference to lower realms is meant neither as contempt nor abstraction;
    Tilopa’s response is pity for beings trapped in painful consequences. The remedy is not independent
    strain but reliance on a learned guru, one able to communicate realization. Yet liberation is explicitly
    of “one’s own mind”: blessing does not install an alien state. It ripens receptivity so that the mind’s
    already-present freedom can be directly known.'
- kind: key_terms
  label: Key Terms
  body: '**don (དོན་)** — Meaning, import, or ultimate point; here, the liberating significance of the
    teaching.


    **bla ma (བླ་མ་)** — Guru or spiritual teacher, specifically one learned and capable of guiding realization.


    **byin rlabs (བྱིན་རླབས་)** — Blessing or transformative spiritual influence, received through devotion
    and instruction.'
- kind: resonances
  label: Resonances
  body: '**Saraha’s Dohā songs:** Saraha likewise presents realization as dependent on receiving the guru’s
    pith instruction and turning directly toward mind’s nature. Divergence: Saraha often attacks ritual
    and conceptual elaboration more sharply, whereas this verse foregrounds karmic peril and compassionate
    exhortation.


    **The Dhammapada:** Its images of beings carried by craving and wandering in saṃsāra parallel Tilopa’s
    river of cyclic existence and his urgency about suffering. Divergence: The Dhammapada generally emphasizes
    personal discipline and insight, while Tilopa here makes the guru’s blessing a decisive condition.'
- kind: practice
  label: Practice
  body: Bring to mind one recurring habit that makes you feel carried rather than free. Without condemning
    yourself, let compassion arise for all beings moved by such currents; then recollect a trustworthy
    teacher or lineage and rest quietly, asking that the mind recognize its own uncontrived clarity.
