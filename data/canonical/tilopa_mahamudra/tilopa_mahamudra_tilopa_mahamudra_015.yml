unit_label: The River and the Heart
title: The River and the Heart
unit_type: verse
commentary: 'The verse joins warning, compassion, and a precise path instruction. “This meaning” is not
  merely a doctrine to assent to, but the liberating import of mahāmudrā: mind’s nature must be recognized
  rather than ignored. Lack of confidence leaves beings passively borne by habitual karma, imaged as a
  river with no stable footing. The reference to lower realms is meant neither as contempt nor abstraction;
  Tilopa’s response is pity for beings trapped in painful consequences. The remedy is not independent
  strain but reliance on a learned guru, one able to communicate realization. Yet liberation is explicitly
  of “one’s own mind”: blessing does not install an alien state. It ripens receptivity so that the mind’s
  already-present freedom can be directly known.'
