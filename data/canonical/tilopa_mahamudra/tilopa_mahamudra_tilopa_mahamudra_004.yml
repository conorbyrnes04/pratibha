pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཔེར་ན་ནམ་མཁའི་དཀྱིལ་བལྟས་མཐོང་བ་འགག་པར་འགྱུར། །

    དེ་བཞིན་སེམས་ཀྱིས་སེམས་ལ་བལྟས་བྱས་ན། །

    རྣམ་རྟོག་ཚོགས་འགག་བླ་མེད་བྱང་ཆུབ་འཐོབ། །'
- kind: translation
  label: Translation
  body: Just as, gazing into the midst of the sky, visual seeing comes to rest, so, when mind looks at
    mind, the mass of discursive thoughts (rnam rtog) ceases, and unsurpassable awakening (bla med byang
    chub) is attained.
- kind: commentary
  label: Commentary
  body: 'The image is not an instruction to stare blankly at an external void. Looking into open sky offers
    an analogy for releasing the mind’s ordinary habit of fastening onto objects. When awareness turns
    toward the mind itself, it does not find a solid observer or an observed thing; conceptual proliferations
    lose the support of grasping and subside. “Cessation” here need not mean suppressing thoughts by force.
    It indicates their self-release when their empty, ungraspable basis is directly recognized. The verse
    therefore joins method and result: reflexive knowing cuts through the stream of elaboration, revealing
    awakening as the nondual nature already obscured by conceptual fixation.'
- kind: key_terms
  label: Key Terms
  body: '**སེམས་ (sems)** — Mind; here both the knowing awareness and the mind examined by that awareness.


    **རྣམ་རྟོག་ (rnam rtog)** — Discursive or proliferating conceptual thought that divides experience
    into subject and object.


    **བླ་མེད་བྱང་ཆུབ་ (bla med byang chub)** — Unsurpassable awakening, the complete realization of Buddhahood.'
- kind: resonances
  label: Resonances
  body: '**Saraha’s Dohākośagīti:** Saraha repeatedly directs attention to the mind’s own nature and treats
    freedom as release from conceptual construction. Divergence: Saraha’s songs often use more explicitly
    tantric and antinomian imagery, while this verse gives a concentrated sky-and-mind analogy.


    **Dzogchen teachings on self-knowing awareness:** Dzogchen likewise employs sky imagery and instructs
    practitioners to recognize thoughts as self-liberating within open awareness. Divergence: This verse
    belongs to a Mahāmudrā presentation and frames the instruction specifically as mind looking at mind,
    rather than through Dzogchen’s distinctive language of rigpa.'
- kind: practice
  label: Practice
  body: 'Sit at ease and let attention rest in open space, without following what appears there. Then
    turn gently toward the knowing mind itself: ask neither for an object nor an answer, but notice whether
    a thinker can be found. When thoughts arise, do not block them; recognize their appearance and allow
    them to dissolve without pursuit.'
