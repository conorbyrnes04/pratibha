unit_label: Mind Looking into Mind
title: Mind Looking into Mind
unit_type: verse
commentary: 'The image is not an instruction to stare blankly at an external void. Looking into open sky
  offers an analogy for releasing the mind’s ordinary habit of fastening onto objects. When awareness
  turns toward the mind itself, it does not find a solid observer or an observed thing; conceptual proliferations
  lose the support of grasping and subside. “Cessation” here need not mean suppressing thoughts by force.
  It indicates their self-release when their empty, ungraspable basis is directly recognized. The verse
  therefore joins method and result: reflexive knowing cuts through the stream of elaboration, revealing
  awakening as the nondual nature already obscured by conceptual fixation.'
