pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ལས་རྒྱ་བསྟེན་ན་བདེ་སྟོང་ཡེ་ཤེས་འཆར། །

    ཐབས་དང་ཤེས་རབ་བྱིན་རླབས་སྙོམས་པར་འཇུག །

    དལ་བར་དབབ་ཅིང་བསྐྱིལ་བཟློག་དྲངས་པ་དང་། །

    གནས་སུ་བསྐྱལ་དང་ལུས་ལ་ཁྱབ་པར་བྱ། །

    དེ་ལ་ཆགས་ཞེན་མེད་ན་བདེ་སྟོང་ཡེ་ཤེས་འཆར། །'
- kind: translation
  label: Translation
  body: Relying on the action seal (karma-mudrā), bliss-emptiness gnosis (sukha-śūnyatā-jñāna) arises.
    The blessing of means and wisdom enters in union. Let it descend gently; retain, reverse, and draw
    it upward; send it to its places and pervade the body. If there is no attachment or fixation upon
    this, bliss-emptiness gnosis arises.
- kind: commentary
  label: Commentary
  body: 'This verse presents a tantric yogic method in which embodied bliss is not an end in itself but
    a support for realizing emptiness. “Action seal” commonly indicates practice with a consort, while
    “means and wisdom” evokes their inseparability: compassionate skillful means and insight into emptiness.
    The instructions to descend, retain, reverse, draw, distribute, and pervade refer to regulating subtle
    vital energies and the experiential force of bliss. Yet Tilopa makes non-attachment decisive. Even
    refined bliss becomes bondage if appropriated as pleasure, attainment, or a self’s experience. When
    bliss is ungrasped, it is disclosed as empty in nature, and its empty luminosity is called gnosis.
    The verse therefore neither rejects the body nor sacralizes sensation; it directs experience beyond
    clinging.'
- kind: key_terms
  label: Key Terms
  body: '**las rgya (karma-mudrā)** — The “action seal”: a tantric consort and/or embodied yogic means
    for generating bliss.


    **bde stong ye shes (sukha-śūnyatā-jñāna)** — Gnosis of inseparable bliss and emptiness, not merely
    pleasant sensation.


    **thabs dang shes rab** — Means and wisdom: compassionate tantric method united with insight into
    emptiness.'
- kind: resonances
  label: Resonances
  body: '**Hevajra Tantra:** Like the Hevajra tradition, this verse treats great bliss as a vehicle for
    realizing emptiness and warns against ordinary attachment. Divergence: Tilopa here gives condensed
    practical directions for directing the experience through the body, rather than a full tantric ritual
    or doctrinal exposition.


    **Nāropa’s Six Dharmas:** The language of drawing upward, retaining, and pervading the body resonates
    with completion-stage subtle-body and inner-heat yogas transmitted in the Tilopa-Nāropa lineage. Divergence:
    This verse specifically frames the method through karma-mudrā, whereas later presentations of the
    Six Dharmas often systematize several practices separately.'
- kind: practice
  label: Practice
  body: Sit quietly and notice any pleasant, painful, or neutral bodily feeling without trying to intensify,
    suppress, or possess it. Let attention include the feeling and the open awareness in which it appears;
    ask whether the experience has any fixed owner or solid essence. If bliss or calm arises, regard it
    as empty, changing appearance rather than an achievement.
