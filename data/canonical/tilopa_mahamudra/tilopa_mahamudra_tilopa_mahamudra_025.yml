title: Bliss Without Grasping
unit_type: verse
commentary: 'This verse presents a tantric yogic method in which embodied bliss is not an end in itself
  but a support for realizing emptiness. “Action seal” commonly indicates practice with a consort, while
  “means and wisdom” evokes their inseparability: compassionate skillful means and insight into emptiness.
  The instructions to descend, retain, reverse, draw, distribute, and pervade refer to regulating subtle
  vital energies and the experiential force of bliss. Yet Tilopa makes non-attachment decisive. Even refined
  bliss becomes bondage if appropriated as pleasure, attainment, or a self’s experience. When bliss is
  ungrasped, it is disclosed as empty in nature, and its empty luminosity is called gnosis. The verse
  therefore neither rejects the body nor sacralizes sensation; it directs experience beyond clinging.'
