- kind: translation
  label: Translation
  body: I bow to the glorious Coemergent (sahaja; lhan cig skyes pa).
- kind: commentary
  label: Commentary
  body: 'This single line is an invocation rather than a discursive instruction. “Coemergent” translates
    lhan cig skyes pa, the naturally simultaneous arising of awareness and appearances, or of bliss and
    emptiness in tantric Mahāmudrā idiom. It does not point to a fabricated meditative state produced
    by effort; it names what is already present with every experience. “Glorious” honors this as the supreme
    source of realization, while the bow expresses the humility required to recognize it: one does not
    possess or manufacture the nature of mind. The verse therefore places devotion and direct recognition
    together. Its object of reverence is not merely an external deity, but the primordial, uncontrived
    reality disclosed through guru instruction.'
- kind: key_terms
  label: Key Terms
  body: '**lhan cig skyes pa (sahaja)** — “Coemergent” or “innate”: the naturally present, simultaneous
    arising of awakening and experience.


    **dpal (śrī)** — Glory, splendor, or auspicious excellence; an honorific for the supreme reality invoked.


    **phyag ''tshal lo** — “I bow”: reverential surrender, joining devotion to the path of direct recognition.'
- kind: resonances
  label: Resonances
  body: '**Saraha’s Dohākośa:** Saraha repeatedly praises sahaja as the innate reality not attained through
    contrivance or conceptual elaboration. Divergence: Saraha often develops this theme through paradoxical
    songs and criticism of religious practices; this verse is solely a concise homage.


    **Dzogchen teachings on rigpa:** Both identify awakening with a primordially present knowing rather
    than a state newly made by meditation. Divergence: Mahāmudrā’s sahaja language here carries a distinct
    tantric vocabulary of coemergence and devotional salutation.'
- kind: practice
  label: Practice
  body: Begin by quietly bowing, physically or inwardly, to the possibility that aware presence is already
    here. Let sounds, sensations, and thoughts arise together with the knowing of them; do not improve
    them or follow them. Notice whether this unmade knowing can be recognized without separating it from
    experience.
