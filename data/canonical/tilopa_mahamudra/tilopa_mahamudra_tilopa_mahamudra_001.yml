unit_label: Homage to the Coemergent
title: Homage to the Coemergent
unit_type: verse
commentary: 'This single line is an invocation rather than a discursive instruction. “Coemergent” translates
  lhan cig skyes pa, the naturally simultaneous arising of awareness and appearances, or of bliss and
  emptiness in tantric Mahāmudrā idiom. It does not point to a fabricated meditative state produced by
  effort; it names what is already present with every experience. “Glorious” honors this as the supreme
  source of realization, while the bow expresses the humility required to recognize it: one does not possess
  or manufacture the nature of mind. The verse therefore places devotion and direct recognition together.
  Its object of reverence is not merely an external deity, but the primordial, uncontrived reality disclosed
  through guru instruction.'
