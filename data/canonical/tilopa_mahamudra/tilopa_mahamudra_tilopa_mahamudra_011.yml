pratibha_layers:
- kind: original
  label: Tibetan
  body: 'སེམས་པ་གཏད་སོ་མེད་ན་ཕྱག་རྒྱ་ཆེན་པོ་ཡིན། །

    དེ་ལ་གོམས་ཤིང་འདྲིས་ན་བླ་མེད་བྱང་ཆུབ་འཐོབ། །'
- kind: translation
  label: Translation
  body: When mind has no point on which to fix itself, that is Mahāmudrā (the Great Seal). By growing
    accustomed and intimate with that, one attains unsurpassed awakening (anuttara-bodhi).
- kind: commentary
  label: Commentary
  body: 'The verse defines Mahāmudrā not as a special object of contemplation, but as the absence of any
    foothold for mental fixation. “No point” does not mean blankness, stupor, or forcibly suppressing
    thought. It means that whatever appears—thought, sensation, emotion, or awareness itself—is not seized
    as a stable support, identity, or thing to maintain. The second line makes this recognition practical:
    liberation comes through repeated familiarization, not through a single dramatic insight. To become
    “intimate” with non-fixation is to let experience arise and vanish without reconstructing a meditator
    who stands apart from it. “Unsurpassed awakening” is thus presented as the maturation of this uncontrived
    knowing, rather than as something produced by conceptual effort.'
- kind: key_terms
  label: Key Terms
  body: '**ཕྱག་རྒྱ་ཆེན་པོ་ (phyag rgya chen po; Mahāmudrā)** — “Great Seal”: the all-pervading reality
    of experience when grasping and fixation are released.


    **གཏད་ས་ (gtad sa)** — A point of support, object, or foothold upon which the mind settles or fixes
    itself.


    **བླ་མེད་བྱང་ཆུབ་ (bla med byang chub; anuttara-bodhi)** — Unsurpassed awakening, complete Buddhahood
    beyond any higher realization.'
- kind: resonances
  label: Resonances
  body: '**Saraha’s Dohākośa:** Saraha repeatedly directs the yogin not to bind mind to an object or fabricate
    meditation, but to recognize its uncontrived nature. Divergence: Saraha often speaks in ecstatic songs
    and sharp critiques of ritualism, while this verse gives a compact instruction centered on familiarization.


    **Prajñāpāramitā literature:** The perfection-of-wisdom teachings deny any graspable basis in mind,
    phenomena, or awakening itself. Divergence: Prajñāpāramitā typically develops emptiness through analytical
    formulations, whereas this verse immediately frames non-grasping as meditative acquaintance.'
- kind: practice
  label: Practice
  body: 'Sit quietly and notice the impulse to give attention a resting place: a thought, breath, feeling,
    or sense of “me” observing. Do not reject these appearances; simply do not make any of them a fixed
    support. Repeatedly relax into this unsupported clarity, gently becoming familiar with it rather than
    trying to manufacture a result.'
