unit_label: No Place for Mind to Rest
title: No Place for Mind to Rest
unit_type: verse
commentary: 'The verse defines Mahāmudrā not as a special object of contemplation, but as the absence
  of any foothold for mental fixation. “No point” does not mean blankness, stupor, or forcibly suppressing
  thought. It means that whatever appears—thought, sensation, emotion, or awareness itself—is not seized
  as a stable support, identity, or thing to maintain. The second line makes this recognition practical:
  liberation comes through repeated familiarization, not through a single dramatic insight. To become
  “intimate” with non-fixation is to let experience arise and vanish without reconstructing a meditator
  who stands apart from it. “Unsurpassed awakening” is thus presented as the maturation of this uncontrived
  knowing, rather than as something produced by conceptual effort.'
