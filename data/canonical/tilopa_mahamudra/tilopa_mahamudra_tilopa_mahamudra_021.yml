unit_label: Naked Knowing Beyond Making
title: Naked Knowing Beyond Making
unit_type: verse
commentary: 'The verse does not reject intelligence or practice as such; it denies that conceptual instruments
  can grasp what exceeds their scope. “Dharmas of intellect” are the mind’s classifications, explanations,
  and objects of thought. “Fabricated dharmas” are deliberate constructions—whether worldly acts or spiritual
  techniques—set up to obtain a result. The sought meaning is beyond mind and action because it is not
  a thing produced, represented, or acquired. Tilopa therefore turns the instruction inward: “cut to the
  root” means investigate the very mind that seeks, judges, and strives. When its source cannot be fixed
  as an entity, awareness need not be manipulated. To leave rigpa “naked” is to let lucid knowing remain
  unadorned by analysis, suppression, contrivance, or a meditator’s effort to improve it.'
