pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ཀྱེ་ཧོ། །བློ་ཡི་ཆོས་ཀྱིས་བློ་འདས་དོན་མི་མཐོང་། །

    བྱས་པའི་ཆོས་ཀྱིས་བྱར་མེད་དོན་མི་རྟོགས། །

    བློ་འདས་བྱར་མེད་དོན་དེ་ཐོབ་འདོད་ན། །

    རང་སེམས་རྩད་ཆོད་རིག་པ་གཅེར་བུར་ཞོག །'
- kind: translation
  label: Translation
  body: Emaho! By dharmas of intellect, the meaning beyond intellect is not seen. By fabricated dharmas,
    the unmade meaning is not realized. If you wish to attain that meaning beyond intellect and beyond
    doing, cut to the root of your own mind; leave awareness (rigpa) naked.
- kind: commentary
  label: Commentary
  body: 'The verse does not reject intelligence or practice as such; it denies that conceptual instruments
    can grasp what exceeds their scope. “Dharmas of intellect” are the mind’s classifications, explanations,
    and objects of thought. “Fabricated dharmas” are deliberate constructions—whether worldly acts or
    spiritual techniques—set up to obtain a result. The sought meaning is beyond mind and action because
    it is not a thing produced, represented, or acquired. Tilopa therefore turns the instruction inward:
    “cut to the root” means investigate the very mind that seeks, judges, and strives. When its source
    cannot be fixed as an entity, awareness need not be manipulated. To leave rigpa “naked” is to let
    lucid knowing remain unadorned by analysis, suppression, contrivance, or a meditator’s effort to improve
    it.'
- kind: key_terms
  label: Key Terms
  body: '**བློ་འདས་ (blo ’das)** — Beyond conceptual mind; not an object available to discursive thought.


    **བྱར་མེད་ (byar med)** — Unmade or beyond doing; not produced through intentional fabrication.


    **རིག་པ་ (rig pa)** — Immediate lucid knowing or awareness, here left bare of conceptual overlay.'
- kind: resonances
  label: Resonances
  body: '**Diamond Sūtra:** Its claim that truth cannot be grasped through marks or reified dharmas parallels
    Tilopa’s refusal of conceptual and fabricated access to the ultimate. Divergence: The Diamond Sūtra
    frames this chiefly through emptiness and non-abiding generosity, while this verse gives a direct
    contemplative instruction to expose naked awareness.


    **Saraha:** Saraha’s songs repeatedly counsel abandoning contrived practice and recognizing the innate,
    unconstructed nature of mind. Divergence: Saraha often employs tantric imagery and critique of ritual
    specialists; this verse is more compressed and centers the investigation of one’s own mind.'
- kind: practice
  label: Practice
  body: For a few minutes, let thoughts, plans, and spiritual evaluations arise without following or rejecting
    them. Ask quietly, “What is the source of this knowing mind?” Do not answer conceptually; rest in
    the clear presence that remains when no thought is made into a task.
