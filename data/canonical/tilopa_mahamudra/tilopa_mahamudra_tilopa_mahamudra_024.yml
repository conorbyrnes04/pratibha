pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ལས་ནི་དང་པོ་གཅོང་རོང་ཆུ་དང་འདྲ། །

    བར་དུ་ཆུ་བོ་གངྒཱ་དལ་ཞིང་གཡོ། །

    ཐ་མ་ཆུ་རྣམས་མ་བུ་འཕྲད་པ་འདྲ། །

    བློ་དམན་སྐྱེས་བུའི་ངང་ལ་མི་གནས་ན། །

    རླུང་གི་གནད་བཟུང་རིག་པ་བཅུད་ལ་བོར། །

    ལྟ་སྟངས་སེམས་འཛིན་ཡན་ལག་དུ་མ་ཡིས། །

    རིག་པ་དང་ལ་མི་གནས་བར་དུ་གཅུན། །'
- kind: translation
  label: Translation
  body: Action at first is like a stagnant pool. In the middle, mind (sems) flows like the Ganges, gentle
    and moving. At the end, the waters (of dualism) meet the ocean like tributaries merging. If one of
    lesser intellect does not abide in the sphere of an authentic being, seizing the vital point of wind-energy
    (rlung), cast away conceptual knowledge (rigpa) into the essence. Through viewing (lta-stangs), mind-holding
    (sems-'dzin), and many limbs, keep awareness (rigpa) from settling—sustain it in the between (bar-du).
- kind: commentary
  label: Commentary
  body: 'Tilopa presents action''s transformation through three phases of water-metaphor, mapping the
    path from gross habitual patterns to subtle non-dual flow. The ''stagnant pool'' of initial action
    reflects karmic inertia; the Ganges represents the middle phase where mind moves with natural grace
    rather than forced control. The ocean-merger signals dissolution of subject-object duality. The verse
    then pivots sharply: intellectual understanding alone fails. Instead, one must work with wind-energy
    (the subtle vehicle of mind) and redirect rigpa—often mistranslated as ''awareness'' but here meaning
    conceptual knowing—away from fixation. The final instruction to ''sustain rigpa in the between'' is
    mahāmudrā''s core: not grasping, not spacing out, but holding the non-dual gap itself as the practice.
    This inverts conventional meditation: the between-state becomes the object, not a problem to transcend.'
- kind: key_terms
  label: Key Terms
  body: '**rlung (wind-energy)** — Subtle life-force vehicle of consciousness; working with wind-energy
    is prerequisite for non-dual realization in Tantric Buddhism


    **rigpa (conceptual knowing / awareness)** — Here denotes conceptual overlay that must be ''cast away''
    into essence; distinct from pristine awareness (ye-shes)


    **bar-du (the between)** — The non-dual gap between subject and object, thought and non-thought; the
    actual locus of mahāmudrā practice'
- kind: resonances
  label: Resonances
  body: '**Dzogchen''s ''rigpa'' teaching (Longchenpa, Nyingma tradition):** Both traditions emphasize
    pristine awareness as non-conceptual and self-luminous; both reject intellectual substitutes for direct
    realization Divergence: Dzogchen stresses rigpa''s intrinsic purity from the start; Tilopa here uses
    rigpa negatively (conceptual knowing to be discarded), suggesting a pedagogical emphasis on negation
    before affirmation


    **Nāgārjuna''s Mūlamadhyamakakārikā on emptiness and the middle way:** Both reject extremes (eternalism/nihilism,
    grasping/spacing); both locate truth in the ''between'' free from conceptual elaboration Divergence:
    Nāgārjuna works through logical analysis; Tilopa prescribes direct wind-energy practice, collapsing
    intellectual deconstruction into somatic realization'
- kind: practice
  label: Practice
  body: Observe your own action-patterns for one day as 'stagnant pool'—habitual, mechanical. Then, in
    meditation, allow mind to flow like a river without forcing or suppressing. Finally, rest awareness
    in the gap between exhalation and inhalation, between thought and the next thought. Do not name it,
    do not solidify it, do not let it dissolve into blankness. Sustain that 'between' as the actual practice,
    returning to it whenever you drift into concept or vacancy.
