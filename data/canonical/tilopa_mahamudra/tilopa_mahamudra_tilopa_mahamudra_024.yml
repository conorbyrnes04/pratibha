unit_label: 'The Three Waters: Action, Mind, and Liberation'
title: 'The Three Waters: Action, Mind, and Liberation'
unit_type: verse
commentary: 'Tilopa presents action''s transformation through three phases of water-metaphor, mapping
  the path from gross habitual patterns to subtle non-dual flow. The ''stagnant pool'' of initial action
  reflects karmic inertia; the Ganges represents the middle phase where mind moves with natural grace
  rather than forced control. The ocean-merger signals dissolution of subject-object duality. The verse
  then pivots sharply: intellectual understanding alone fails. Instead, one must work with wind-energy
  (the subtle vehicle of mind) and redirect rigpa—often mistranslated as ''awareness'' but here meaning
  conceptual knowing—away from fixation. The final instruction to ''sustain rigpa in the between'' is
  mahāmudrā''s core: not grasping, not spacing out, but holding the non-dual gap itself as the practice.
  This inverts conventional meditation: the between-state becomes the object, not a problem to transcend.'
