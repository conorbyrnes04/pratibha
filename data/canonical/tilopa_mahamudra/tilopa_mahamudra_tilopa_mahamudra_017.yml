pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དམིགས་པའི་ཡུལ་འདས་སེམས་ཀྱི་རང་བཞིན་གསལ། །

    བགྲོད་པའི་ལམ་མེད་སངས་རྒྱས་ལམ་སྣ་ཟིན། །

    བསྒོམ་པའི་ཡུལ་མེད་གོམས་ན་བླ་མེད་བྱང་ཆུབ་འཐོབ། །'
- kind: translation
  label: Translation
  body: Beyond the field of apprehended objects, mind’s own nature is lucid (rang bzhin). With no path
    to be traversed, one has found the entry to the Buddha’s path. Becoming familiar with no object of
    meditation (bsgom pa’i yul med), one attains unsurpassed awakening (bla med byang chub).
- kind: commentary
  label: Commentary
  body: 'The verse moves through three refusals: an object to fix upon, a route to progress along, and
    a meditative target to cultivate. These do not advocate dullness or passivity. When grasping at an
    observed thing—outer or inner, including a state called “mind”—relaxes, mind’s nature is said to be
    self-lucid. “No path” means that awakening is not produced by moving from one intrinsically real point
    to another; nevertheless, recognizing this is itself the opening of the Buddha-path. Likewise, meditation
    without an object is not vacant distraction but repeated familiarization with awareness free of subject-object
    fixation. The final attainment is therefore not a new fabricated experience, but the unobscured recognition
    of what grasping had concealed.'
- kind: key_terms
  label: Key Terms
  body: '**དམིགས་པ་ (dmigs pa)** — Apprehension or fixation on an object; the dualistic act of taking
    something as a meditational or cognitive target.


    **སེམས་ཀྱི་རང་བཞིན་ (sems kyi rang bzhin)** — Mind’s own nature: its lucid, ungraspable character
    when conceptual fixation has released.


    **བླ་མེད་བྱང་ཆུབ་ (bla med byang chub)** — Unsurpassed awakening, the complete Buddhahood that is
    not surpassed by any further realization.'
- kind: resonances
  label: Resonances
  body: '**Heart Sūtra:** Its declaration that there is “no attainment” parallels the release of path,
    object, and meditator as ultimately graspable realities. Divergence: The Heart Sūtra foregrounds emptiness
    through analytic negation, while this verse gives direct meditative instructions in the idiom of Mahāmudrā.


    **Dzogchen, especially the language of self-arising awareness:** Both traditions speak of a naturally
    lucid awareness recognized when fixation and deliberate fabrication subside. Divergence: This verse
    frames the recognition through Mahāmudrā’s language of familiarization and the Buddha-path, rather
    than Dzogchen’s distinctive terminology of rigpa and primordial purity.'
- kind: practice
  label: Practice
  body: 'Sit quietly and notice any object you are trying to hold: breath, thought, clarity, or a hoped-for
    state. Without suppressing what appears, release the act of making it an object and rest in the knowing
    that remains. Repeatedly return to this non-objective openness, without measuring progress along a
    path.'
