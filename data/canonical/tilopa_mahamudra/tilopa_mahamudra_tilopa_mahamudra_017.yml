unit_label: Clear Beyond Fixation
title: Clear Beyond Fixation
unit_type: verse
commentary: 'The verse moves through three refusals: an object to fix upon, a route to progress along,
  and a meditative target to cultivate. These do not advocate dullness or passivity. When grasping at
  an observed thing—outer or inner, including a state called “mind”—relaxes, mind’s nature is said to
  be self-lucid. “No path” means that awakening is not produced by moving from one intrinsically real
  point to another; nevertheless, recognizing this is itself the opening of the Buddha-path. Likewise,
  meditation without an object is not vacant distraction but repeated familiarization with awareness free
  of subject-object fixation. The final attainment is therefore not a new fabricated experience, but the
  unobscured recognition of what grasping had concealed.'
