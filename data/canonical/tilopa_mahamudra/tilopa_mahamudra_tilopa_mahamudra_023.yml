pratibha_layers:
- kind: original
  label: Tibetan
  body: 'མུ་མཐའ་ཡོངས་གྲོལ་ལྟ་བའི་རྒྱལ་པོ་མཆོག །

    མུ་མེད་གཏིང་ཡངས་སྒོམ་པའི་རྒྱལ་པོ་མཆོག །

    མཐའ་ཆོད་ཕྱོགས་བྲལ་སྤྱོད་པའི་རྒྱལ་པོ་མཆོག །

    རེ་མེད་རང་གྲོལ་འབྲས་བུའི་མཆོག་ཡིན་ནོ། །'
- kind: translation
  label: Translation
  body: 'The supreme king of view is wholly free of boundaries (mtha'').

    The supreme king of meditation is boundless, deep, and vast.

    The supreme king of conduct cuts through limits and is free of sides (phyogs).

    The supreme fruition is self-liberated (rang grol), without expectation (re med).'
- kind: commentary
  label: Commentary
  body: 'The verse presents view, meditation, conduct, and fruition not as separate accomplishments but
    as one freedom from delimiting fixation. View is released from conceptual borders: it does not settle
    reality into an extreme, a defined object, or a final position. Meditation is not manufactured concentration;
    its depth and breadth are “without boundary,” like space unobstructed by what appears within it. Conduct
    is free of “sides”: it does not proceed from partiality, attachment, or opposition, yet it decisively
    cuts through limiting habits. Fruition is not a hoped-for future attainment. When hope for a result
    is absent, experience is self-liberated—appearances and thoughts release in their own occurring rather
    than being suppressed or converted into something else. This is not passivity: “cutting through” indicates
    lucid non-grasping, not indifference.'
- kind: key_terms
  label: Key Terms
  body: '**mtha''** — Boundary, limit, or extreme; here, the conceptual edges by which mind confines reality.


    **phyogs bral** — Free of sides or partial positions: not aligned with grasping and aversion, affirmation
    and denial.


    **rang grol** — Self-liberation: phenomena release themselves when not appropriated or fixed by grasping.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna''s Madhyamaka:** Both reject fixation on conceptual extremes and present freedom
    from limiting views as central to liberation. Divergence: Madhyamaka commonly develops this through
    analytic reasoning about emptiness, while this verse frames it as the lived unity of view, meditation,
    conduct, and fruition.


    **Dzogchen teachings on self-liberation:** The phrase rang grol closely parallels the Dzogchen claim
    that thoughts and appearances liberate themselves when their nature is recognized. Divergence: This
    verse belongs to Mahāmudrā''s fourfold presentation and does not explicitly articulate Dzogchen''s
    distinctive language of primordial purity and spontaneous presence.'
- kind: practice
  label: Practice
  body: Sit without trying to establish a correct inner position. Notice each thought, sensation, or impulse
    as it arises; neither follow it nor force it away, and observe whether it releases when not given
    a boundary, side, or hoped-for outcome. Carry this same non-partial clarity into one ordinary action
    today.
