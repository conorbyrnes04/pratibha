title: Beyond Doctrinal Limits
unit_type: verse
commentary: 'Tilopa does not dismiss Buddhist disciplines or scriptures as false; he identifies a specific
  obstruction: taking any system’s formulations, conclusions, and sectarian boundaries as final. Mantra,
  pāramitā, Vinaya, sūtra, and Abhidharma-like collections can guide conduct and understanding, but the
  uncontrived luminosity of Mahāmudrā is not an object produced or captured by them. The final line diagnoses
  the affective mechanism of the failure: zhe ’dod, possessive wanting or insistent preference. One wants
  an experience, a view, a confirmation, or a spiritual achievement; that very reaching overlays what
  is already lucid. “Not seeing” does not mean luminosity is absent. It means that fixation, including
  fixation on authoritative teachings, functions as a veil. The verse thus directs the practitioner from
  conceptual possession toward direct, non-grasping recognition.'
