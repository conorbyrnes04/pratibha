pratibha_layers:
- kind: original
  label: Tibetan
  body: 'སྔགས་སུ་སྨྲ་དང་ཕ་རོལ་ཕྱིན་པ་དང་། །

    འདུལ་བ་མདོ་སྡེ་སྡེ་སྣོད་ལ་སོགས་པ། །

    རང་རང་གཞུང་དང་གྲུབ་པའི་མཐའ་ཡིས་ན། །

    འོད་གསལ་ཕྱག་རྒྱ་ཆེན་པོ་མཐོང་མི་འགྱུར། །

    ཞེ་འདོད་བྱུང་བས་འོད་གསལ་མ་མཐོང་བསྒྲིབས། །'
- kind: translation
  label: Translation
  body: 'Mantra recitation, the perfections (pāramitā),

    Vinaya, sūtras, the collections of teachings, and the rest—

    Through the limits of their own texts and established positions,

    one will not see luminous (’od gsal) Mahāmudrā.

    When grasping desire arises, it veils the unseen luminosity.'
- kind: commentary
  label: Commentary
  body: 'Tilopa does not dismiss Buddhist disciplines or scriptures as false; he identifies a specific
    obstruction: taking any system’s formulations, conclusions, and sectarian boundaries as final. Mantra,
    pāramitā, Vinaya, sūtra, and Abhidharma-like collections can guide conduct and understanding, but
    the uncontrived luminosity of Mahāmudrā is not an object produced or captured by them. The final line
    diagnoses the affective mechanism of the failure: zhe ’dod, possessive wanting or insistent preference.
    One wants an experience, a view, a confirmation, or a spiritual achievement; that very reaching overlays
    what is already lucid. “Not seeing” does not mean luminosity is absent. It means that fixation, including
    fixation on authoritative teachings, functions as a veil. The verse thus directs the practitioner
    from conceptual possession toward direct, non-grasping recognition.'
- kind: key_terms
  label: Key Terms
  body: '**ཕ་རོལ་ཕྱིན་པ་ (pāramitā)** — The “perfections” or transcendent virtues, here named among valid
    but limited doctrinal paths.


    **འོད་གསལ་ (’od gsal; prabhāsvara)** — Luminosity or clear light: the intrinsically lucid, unobscured
    character of mind.


    **ཕྱག་རྒྱ་ཆེན་པོ་ (phyag rgya chen po; Mahāmudrā)** — The Great Seal: direct recognition of mind’s
    empty, luminous, non-graspable nature.'
- kind: resonances
  label: Resonances
  body: '**The Aṣṭasāhasrikā Prajñāpāramitā:** Its teaching that even Dharma must not be grasped parallels
    Tilopa’s warning that reliance on doctrinal positions cannot disclose the ultimate. Divergence: The
    Prajñāpāramitā literature primarily frames this through emptiness and non-apprehension, while this
    verse explicitly names Mahāmudrā’s luminosity and desire as the veil.


    **Nāgārjuna’s Mūlamadhyamakakārikā:** Nāgārjuna warns that fixation on views is spiritually damaging,
    echoing Tilopa’s critique of established tenets and conceptual limits. Divergence: Nāgārjuna’s argument
    is chiefly dialectical, dismantling reified positions; Tilopa gives an experiential instruction centered
    on recognizing luminous mind beyond grasping.'
- kind: practice
  label: Practice
  body: For a few minutes, let a familiar Buddhist idea, aspiration, or hoped-for meditation result arise
    in the mind. Notice the subtle wish to secure, improve, or possess it, and relax that reaching without
    suppressing the thought. Rest with the knowing that remains when no conclusion is being defended or
    acquired.
