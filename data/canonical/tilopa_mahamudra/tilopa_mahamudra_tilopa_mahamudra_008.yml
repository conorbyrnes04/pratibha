unit_label: Space Beyond Naming
title: Space Beyond Naming
unit_type: verse
commentary: 'The verse uses space not as a metaphysical substance but as an illustration of freedom from
  conceptual attribution. We may speak of “sky,” directions, boundaries, purity, or emptiness, yet none
  of these verbal constructions is found in space itself. Mind’s luminosity is the same: “clear light”
  is a guiding designation, not an entity, property, or conclusion secured by language. Tilopa does not
  deny that such words can point; he denies that their referent can be captured as an object established
  by the words. Mahāmudrā therefore does not ask one to replace ordinary concepts with a refined doctrine
  of luminous mind. It asks one to recognize directly the mind that is open, cognizant, and ungraspable
  before it is made into “this” or “that.”'
