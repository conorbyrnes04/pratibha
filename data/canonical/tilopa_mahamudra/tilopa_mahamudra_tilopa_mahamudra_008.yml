pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཔེར་ན་ནམ་མཁའ་སྟོང་པར་ཐ་སྙད་རབ་བརྟགས་ཀྱང་། །

    ནམ་མཁའ་ལ་ནི་འདི་འདྲར་བརྗོད་དུ་མེད། །

    དེ་བཞིན་རང་སེམས་འོད་གསལ་བརྗོད་གྱུར་ཀྱང་། །

    བརྗོད་པས་འདིར་འདྲར་གྲུབ་ཅེས་ཐ་སྙད་གདགས་གཞི་མེད། །'
- kind: translation
  label: Translation
  body: Though conventions (tha snyad) are elaborately projected upon empty space, nothing of that sort
    can be said to belong to space itself. Likewise, though one calls one’s own mind luminous clarity
    (’od gsal), there is no basis on which to impute that it is established in such a way by words.
- kind: commentary
  label: Commentary
  body: 'The verse uses space not as a metaphysical substance but as an illustration of freedom from conceptual
    attribution. We may speak of “sky,” directions, boundaries, purity, or emptiness, yet none of these
    verbal constructions is found in space itself. Mind’s luminosity is the same: “clear light” is a guiding
    designation, not an entity, property, or conclusion secured by language. Tilopa does not deny that
    such words can point; he denies that their referent can be captured as an object established by the
    words. Mahāmudrā therefore does not ask one to replace ordinary concepts with a refined doctrine of
    luminous mind. It asks one to recognize directly the mind that is open, cognizant, and ungraspable
    before it is made into “this” or “that.”'
- kind: key_terms
  label: Key Terms
  body: '**ནམ་མཁའ་ (nam mkha’; ākāśa)** — Space: the analogy for what cannot be bounded or endowed with
    verbally imposed features.


    **རང་སེམས་ (rang sems)** — One’s own mind, to be recognized directly rather than defined conceptually.


    **འོད་གསལ་ (’od gsal; prabhāsvara)** — Luminous clarity: mind’s cognizant openness, not a describable
    inner object.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna, Mūlamadhyamakakārikā:** Nāgārjuna likewise treats conventional designation as dependent
    imputation, without locating an intrinsically established referent behind the name. Divergence: This
    verse focuses on direct recognition of luminous mind, whereas Nāgārjuna’s analysis is primarily a
    dialectical examination of all phenomena.


    **Dzogchen teachings on the ineffability of rigpa:** Both present awareness as lucid and empty, beyond
    being adequately captured by conceptual labels. Divergence: Tilopa frames the point within Mahāmudrā’s
    language of one’s own mind and does not here employ Dzogchen’s distinctive vocabulary of primordial
    knowing or spontaneous presence.'
- kind: practice
  label: Practice
  body: Sit quietly and let a thought, sensation, or mood arise. Notice the labels placed upon it, then
    look for the thing supposedly fixed by those labels; rest briefly in the open cognizance that remains
    when no conclusion is imposed.
