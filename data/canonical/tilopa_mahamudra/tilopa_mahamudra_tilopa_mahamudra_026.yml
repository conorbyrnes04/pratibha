pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ཚེ་རིང་སྐྲ་དཀར་མེད་ཅིང་ཟླ་ལྟར་རྒྱས་པར་འགྱུར། །

    བཀྲག་མདངས་གསལ་ལ་སྟོབས་ཀྱང་སེང་གེ་འདྲ། །

    ཐུན་མོང་དངོས་གྲུབ་མྱུར་ཐོང་མཆོག་ལ་གཞོལ་བར་འགྱུར། །'
- kind: translation
  label: Translation
  body: One becomes long-lived, without white hair, and waxing like the moon. Radiant in splendor, one’s
    strength is like a lion’s. Swiftly obtaining the common siddhis (accomplishments), one turns toward
    the supreme [accomplishment].
- kind: commentary
  label: Commentary
  body: 'This verse presents worldly signs of yogic fruition—longevity, enduring youth, radiance, strength,
    and swift attainment of ordinary siddhis—not as the final purpose, but as supports or by-products
    of practice. Its decisive movement lies in the last phrase: having obtained “common” accomplishments,
    the practitioner inclines toward the supreme. The contrast guards against mistaking vitality, charisma,
    or unusual capacities for liberation. “Waxing like the moon” suggests increase and fullness, while
    lion-like strength evokes fearless stability. Yet these images culminate not in self-exaltation but
    in orientation toward the unsurpassable siddhi: awakening, inseparable from realization rather than
    display.'
- kind: key_terms
  label: Key Terms
  body: '**dngos grub** — Siddhi or accomplishment: a realized capacity, ranging from ordinary powers
    to supreme awakening.


    **thun mong** — Common or ordinary; here, limited attainments shared with lower yogic aims.


    **mchog** — Supreme, highest; the unsurpassable accomplishment beyond mundane siddhis.'
- kind: resonances
  label: Resonances
  body: '**Patañjali’s Yoga Sūtra, Vibhūti-pāda:** Patañjali also describes extraordinary capacities arising
    through contemplative discipline and warns that they can obstruct the highest realization. Divergence:
    This verse frames such attainments within Vajrayāna siddhi language and explicitly directs the practitioner
    toward a supreme accomplishment, rather than Patañjali’s kaivalya.


    **Saraha’s Dohākoṣa:** Saraha repeatedly distinguishes ultimate realization from lesser religious
    or yogic attainments and privileges the highest direct realization. Divergence: Saraha’s songs are
    often sharply critical of striving for powers, whereas this verse acknowledges ordinary siddhis as
    possible preliminary fruits before turning beyond them.'
- kind: practice
  label: Practice
  body: 'Reflect on any capacities you seek—health, influence, vitality, calm, or recognition—and name
    them inwardly as “common accomplishments.” Then rest with the question: what is the supreme aim for
    which these capacities would be worth having? Let the body be upright and fearless like a lion, while
    releasing attachment to signs of progress.'
