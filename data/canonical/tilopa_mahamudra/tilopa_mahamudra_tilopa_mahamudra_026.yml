title: Lion Strength and the Supreme Aim
unit_type: verse
commentary: 'This verse presents worldly signs of yogic fruition—longevity, enduring youth, radiance,
  strength, and swift attainment of ordinary siddhis—not as the final purpose, but as supports or by-products
  of practice. Its decisive movement lies in the last phrase: having obtained “common” accomplishments,
  the practitioner inclines toward the supreme. The contrast guards against mistaking vitality, charisma,
  or unusual capacities for liberation. “Waxing like the moon” suggests increase and fullness, while lion-like
  strength evokes fearless stability. Yet these images culminate not in self-exaltation but in orientation
  toward the unsurpassable siddhi: awakening, inseparable from realization rather than display.'
