title: Do Not Contrive, and Wisdom Dawns
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Tibetan (*phyag chen gang GA ma*, Tilopa''s Ganges Mahāmudrā), transmitted
  from a Sanskrit original. Verified per-line Tibetan/Sanskrit script not sourced for this pilot; rendering is editorial.
  **Flagged for scholarly verification.**'
sanskrit_iast: 'Key terms (Sanskrit basis, IAST): *mahāmudrā* (the "great seal"), *anabhisaṃskāra* (non-fabrication), *sahaja*
  (the innate, co-emergent), *jñāna* (wisdom), *nirvikalpa* (non-conceptual). Tibetan: *phyag rgya chen po* (mahāmudrā), *ma
  bcos pa* (uncontrived), *lhan cig skyes pa* (co-emergent/innate).'
translation_literal: 'Mahāmudrā cannot be pointed to by any symbol, and the ordinary mind cannot grasp it as an object of
  thought. So do not manufacture anything, do not try to fix or improve anything, and do not even "meditate" as if on some
  thing: simply let mind settle, unaltered, in its own natural state [sahaja]. When nothing is contrived, the innate wisdom
  [jñāna] rises by itself.'
commentary: 'The instruction makes a claim that overturns the whole logic of effortful practice: the goal is undermined by
  the very act of trying to reach it. Mahāmudrā, the "great seal" of reality''s nature, is not an object that a subject can
  approach, aim at, or produce—so the ordinary tools of the path (constructing states, correcting errors, meditating "on"
  something) all reinstall the subject–object split that mahāmudrā is meant to dissolve. Tilopa''s triple negation—do not
  fabricate, do not correct, do not meditate—is therefore not laziness but precision: each of the three is a form of *bcos
  pa*, contrivance, and contrivance is exactly the obstacle. The counterintuitive move is that recognition is a matter of
  *ceasing* to interfere rather than *doing* more; the innate wisdom (*sahaja-jñāna*) is already present and only obscured
  by the meditator''s busy hands. This is the razor''s edge of the Kagyü approach and its great danger: "non-meditation" can
  collapse into dull distraction if there is no stability first, which is why the tradition places it after long training
  and under a guru''s eye. For a retreatant late in the day, though, it is liberating medicine against spiritual over-effort—the
  exhausting sense that awakening is one more technique away. Sometimes the deepest practice is to stop managing the mind
  and let it be as it already is.


  Key Terms:


  **mahāmudrā (महामुद्रा) / phyag rgya chen po** — Etymology: *mahā* (great) + *mudrā* (seal, gesture, stamp); Tibetan *phyag
  rgya chen po*. The "great seal" that stamps all experience with the single nature of empty awareness; both the ultimate
  view and the meditation on it.

  **ma bcos pa (uncontrived)** — Tibetan *bcos pa* = to fabricate, alter, fix; *ma bcos pa* = unaltered, natural. The pith
  term: resting the mind without the three contrivances of making, correcting, and meditating.

  **sahaja (सहज) / lhan cig skyes pa** — Etymology: *saha* (together) + *ja* (born): "co-emergent, innate." Wisdom that is
  not produced but is born together with mind itself, already present beneath obscuration.

  **nirvikalpa (निर्विकल्प)** — Etymology: *nir-* (without) + *vikalpa* (conceptual construction): "non-conceptual." The mode
  in which innate wisdom dawns—free of the discriminating thought that fabricates objects.


  Cross-Tradition Resonances:


  **Nāgārjuna, MMK 18.5 & 25.24 (proliferation stilled in emptiness; the peace of un-grasping):** mahāmudrā''s "do not fabricate"
  is the meditative face of Madhyamaka''s *prapañca-upaśama*—liberation as cessation of contriving, not addition of content.

  *Divergence:* Nāgārjuna dismantles fabrication by dialectical analysis; Tilopa dissolves it by direct resting, bypassing
  argument.

  **Dōgen, Fukanzazengi ("do not think of good or bad; this is the art of non-thinking"):** zazen as non-contrived sitting
  in which awakening is not manufactured but disclosed.

  *Divergence:* Dōgen''s shikantaza affirms practice-realization as one act; Tilopa emphasizes an innate wisdom "dawning of
  itself" once contrivance stops.

  **Tao Te Ching 48 & wu wei (do less until nothing is forced, yet nothing is left undone):** attainment by non-action, the
  natural condition disclosed when interference ceases.

  *Divergence:* Daoist *ziran* accords with the Way as a cosmic source; mahāmudrā rests in empty awareness with no source
  affirmed.'
insight: 'The instruction makes a claim that overturns the whole logic of effortful practice: the goal is undermined by the
  very act of trying to reach it.'
practice: For the last few minutes of a sitting, drop every technique. Do not follow the breath, do not label thoughts, do
  not try to be calm or clear. Whatever the mind is doing, let it do that, and simply do not interfere—not even to stop interfering.
  Rest in the uncontrived condition and notice what remains when you stop managing it.
