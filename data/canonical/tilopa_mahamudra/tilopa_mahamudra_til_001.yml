- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nāgārjuna, MMK 18.5 & 25.24 (proliferation stilled in emptiness; the peace of un-grasping)
    resonance: mahāmudrā's "do not fabricate" is the meditative face of Madhyamaka's *prapañca-upaśama*—liberation
      as cessation of contriving, not addition of content.
    divergence: Nāgārjuna dismantles fabrication by dialectical analysis; Tilopa dissolves it by direct
      resting, bypassing argument.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_18_05
  - citation: Dōgen, Fukanzazengi ("do not think of good or bad; this is the art of non-thinking")
    resonance: zazen as non-contrived sitting in which awakening is not manufactured but disclosed.
    divergence: Dōgen's shikantaza affirms practice-realization as one act; Tilopa emphasizes an innate
      wisdom "dawning of itself" once contrivance stops.
    passage_id: ''
  - citation: Tao Te Ching 48 & wu wei (do less until nothing is forced, yet nothing is left undone)
    resonance: attainment by non-action, the natural condition disclosed when interference ceases.
    divergence: Daoist *ziran* accords with the Way as a cosmic source; mahāmudrā rests in empty awareness
      with no source affirmed.
    passage_id: tao_te_ching.ttc_md_048
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: For the last few minutes of a sitting, drop every technique. Do not follow the breath, do not
    label thoughts, do not try to be calm or clear. Whatever the mind is doing, let it do that, and simply
    do not interfere—not even to stop interfering. Rest in the uncontrived condition and notice what remains
    when you stop managing it.
