sanskrit_devanagari: 'དཔལ་ལྷན་ཅིག་སྐྱེས་པ་ལ་ཕྱག་འཚལ་ལོ། །

  དཀའ་བ་སྤྱད་ཅིང་བླ་མ་ལ་གུས་པ། །

  སྡུག་བསྔལ་བཟོད་ལྡན་བློ་ལྡན་ནཱ་རོ་པ། །

  སྐལ་ལྡན་ཁྱོད་ཀྱིས་བློ་ལ་འདི་ལྟར་བྱོས། །

  ཕྱག་རྒྱ་ཆེན་པོ་བསྟན་དུ་མེད་ཀྱིས་ཀྱང་། །

  དཔེར་ན་ནམ་མཁའ་གང་གིས་གང་ལ་བརྟེན། །

  རང་སེམས་ཕྱག་རྒྱ་ཆེ་ལ་བརྟེན་ཡུལ་མེད། །

  མ་བཅོས་གཉུག་མའི་ངང་དུ་གློད་ལ་ཞོག །

  བཅིངས་པ་ཀློད་ན་གྲོལ་བར་ཐེ་ཚོམ་མེད། །'
sanskrit_iast: 'dpal lhan cig skyes pa la phyag ''tshal lo/_/

  dka'' ba spyad cing bla ma la gus pa/_/

  sdug bsngal bzod ldan blo ldan nA ro pa/_/

  skal ldan khyod kyis blo la ''di ltar byos/_/

  phyag rgya chen po bstan du med kyis kyang /_/

  dper na nam mkha'' gang gis gang la brten/_/

  rang sems phyag rgya che la brten yul med/_/

  ma bcos gnyug ma''i ngang du glod la zhog_/

  bcings pa klod na grol bar the tshom med/_/'
translation_literal: 'Homage to Glorious Tilopa, born together with all that is.


  Having practiced hardship and held devotion to the guru,

  Nāropa, wise and patient in suffering, fortunate one—

  Work with your mind in this way:


  Mahāmudrā (the great seal) has no doctrine to teach.

  Just as space depends on nothing and rests on nothing,

  Your own mind, the great seal, has no object to depend on.

  Let it go in its own unaltered nature and remain.

  When the bound are freed, there is no doubt of liberation.'
commentary: 'This passage stands at the heart of Tilopa''s instruction to Nāropa: the teaching of mahāmudrā
  is not a teaching at all, but a pointing to what is already the case. The opening homage establishes
  the lineage—Tilopa, the mahāsiddha who embodies the non-dual realization that transcends all conceptual
  elaboration.


  The verse begins by honoring Nāropa''s preparation: hardship endured, devotion to the guru maintained,
  wisdom cultivated through suffering. These are not prerequisites that earn a reward, but the ground
  on which the mind becomes capable of recognizing its own nature. The instruction then pivots: ''Work
  with your mind in this way.''


  The core teaching uses the metaphor of space (nam mkha). Space does not rest on anything, does not depend
  on anything, yet it pervades and contains all phenomena. Similarly, mind-nature (sems nyid) is not a
  thing that can be grasped, not an object to be found. It is already free, already complete. The instruction
  ''ma bcos'' (unaltered, uncontrivèd, not fabricated) is the crucial pivot: do not try to improve it,
  do not add anything, do not remove anything. Simply release it into its own condition.


  The final line—''when the bound are freed, there is no doubt of liberation''—does not speak of future
  attainment. It speaks of the immediate recognition that what appears bound is already free. The moment
  the mind stops trying to become something other than what it is, bondage dissolves. This is not gradual;
  it is the recognition of what has always been true.


  The genius of this instruction lies in its negation of all method: there is no doctrine, no object,
  no practice to perform. Yet this very negation is the practice. The student must unlearn the habit of
  seeking, grasping, and improving—and in that unlearning, rest in what is.


  Key Terms


  **phyag rgya chen po (mahāmudrā)** — The great seal; the non-dual nature of mind and reality, beyond
  all conceptual elaboration

  **ma bcos (uncontrivèd)** — Not fabricated, not altered, not improved; the natural, unconstructed state

  **gnyug ma (innate)** — The original, intrinsic nature; what is already present before any modification'
insight: 'The instruction makes a claim that overturns the whole logic of effortful practice: the goal
  is undermined by the very act of trying to reach it.'
practice: 'The next time you reach for something—a cup, a doorknob, your phone—pause and let your hand
  hover. Notice: what is it that knows you are reaching? Do not answer with words. Let that knowing remain
  untouched, like space around your fingers, and complete the reach from there.'
