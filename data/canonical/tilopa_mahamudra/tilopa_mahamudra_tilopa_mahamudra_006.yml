pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཔེར་ན་ནམ་མཁའི་རང་བཞིན་ཁ་དོག་དབྱིབས་ལས་འདས། །

    དཀར་ནག་དག་གིས་གོས་ཤིང་འགྱུར་བ་མེད། །

    དེ་བཞིན་རང་སེམས་སྙིང་པོ་ཁ་དོག་དབྱིབས་ལས་འདས། །

    དགེ་སྡིག་དཀར་ནག་ཆོས་ཀྱིས་གོས་མི་འགྱུར། །'
- kind: translation
  label: Translation
  body: 'Just as the nature of space transcends color and shape,

    it is not dyed or altered by white or black.

    So too, the essence of one’s own mind transcends color and shape;

    it is not dyed or changed by dharmas (phenomena) of virtue and evil, white and black.'
- kind: commentary
  label: Commentary
  body: 'The verse uses space not as a thing to be imagined, but as an analogy for mind’s essence: it
    has no visible contour, color, or material location. “White and black” conventionally signify wholesome
    and unwholesome action. Tilopa does not deny their karmic force at the level of conduct and experience;
    rather, he distinguishes that conditioned level from the mind’s empty essence. Thoughts, emotions,
    merit, and wrongdoing arise as appearances, yet none can physically adhere to or modify awareness
    itself. This is not a warrant for moral indifference: confusing empty essence with karmic causality
    is precisely another conceptual mistake. The point is to recognize, amid every experience, the unstained
    knowing in which it appears, without trying to purify that knowing as though it were an object marked
    by events.'
- kind: key_terms
  label: Key Terms
  body: '**ནམ་མཁའ་** — Space (nam mkha’): the image for unbounded, ungraspable openness.


    **རང་སེམས་སྙིང་པོ་** — The essence of one’s own mind: mind’s innermost, unconditioned nature.


    **དགེ་སྡིག་** — Virtue and evil: wholesome and unwholesome karmic qualities.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna’s Mūlamadhyamakakārikā:** Nāgārjuna likewise denies that phenomena possess a fixed
    intrinsic nature, loosening the hold of reified purity and impurity. Divergence: This verse speaks
    directly of mind’s essence through the experiential image of space, whereas Nāgārjuna’s analysis more
    systematically deconstructs all views, including views of an essence.


    **The Heart Sūtra:** Its claim that forms are empty resonates with the verse’s insistence that apparent
    qualities do not define ultimate reality. Divergence: The Heart Sūtra applies emptiness broadly to
    the aggregates; Tilopa here gives an intimate meditation instruction centered on the nature of one’s
    own mind.'
- kind: practice
  label: Practice
  body: Sit quietly and let a thought, feeling, or self-judgment arise without correcting it. Ask whether
    it can actually color, damage, or reshape the bare knowing that knows it; rest briefly in that ungraspable
    openness. Then return to ordinary ethical care, allowing the recognition of unstained awareness to
    coexist with responsibility for actions and their effects.
