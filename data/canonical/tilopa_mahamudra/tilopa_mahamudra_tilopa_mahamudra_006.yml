unit_label: Sky Beyond Stain
title: Sky Beyond Stain
unit_type: verse
commentary: 'The verse uses space not as a thing to be imagined, but as an analogy for mind’s essence:
  it has no visible contour, color, or material location. “White and black” conventionally signify wholesome
  and unwholesome action. Tilopa does not deny their karmic force at the level of conduct and experience;
  rather, he distinguishes that conditioned level from the mind’s empty essence. Thoughts, emotions, merit,
  and wrongdoing arise as appearances, yet none can physically adhere to or modify awareness itself. This
  is not a warrant for moral indifference: confusing empty essence with karmic causality is precisely
  another conceptual mistake. The point is to recognize, amid every experience, the unstained knowing
  in which it appears, without trying to purify that knowing as though it were an object marked by events.'
