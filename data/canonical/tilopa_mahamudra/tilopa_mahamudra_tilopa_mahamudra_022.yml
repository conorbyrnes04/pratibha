unit_label: Let the Water Clear
title: Let the Water Clear
unit_type: verse
commentary: 'The verse does not prescribe suppressing thought or destroying appearance. Thoughts are compared
  to muddy water: clarity comes when their disturbance is allowed to settle, not when one stirs them through
  argument, fixation, or resistance. “Do not deny or establish” cuts both realist grasping at appearances
  and nihilist dismissal of them. When neither acceptance nor rejection is added, saṃsāric appearance
  is disclosed as mahāmudrā—not transformed into some other object, but known in its ungraspable mode.
  The reference to the unborn ālaya directs attention beneath karmically patterned reactions: habits and
  obscurations are relinquished by not renewing their basis. Even spiritual self-assessment and pride
  are further agitation. The final “exhaustion” of mental phenomena means the wearing out of their coercive
  claim through resting in unborn reality, not blanking out experience.'
