pratibha_layers:
- kind: original
  label: Tibetan
  body: 'རྟོག་པ་དྲི་མའི་ཆུ་དེ་དྭངས་སུ་ཆུག །

    སྣང་བ་དགག་སྒྲུབ་མི་བྱ་རང་སར་ཞོག །

    སྤང་ལེན་མེད་པར་སྣང་སྲིད་ཕྱག་རྒྱར་གྲོལ། །

    ཀུན་གཞི་སྐྱེ་བ་མེད་པར་བག་ཆགས་སྡིག་སྒྲིབ་སྤོང་། །

    སྙེམ་བྱེད་རྩིས་གདབ་མི་བྱ་སྐྱེ་མེད་སྙིང་པོར་ཞོག །

    སྣང་བ་རབ་སྣང་བློ་ཡི་ཆོས་རྣམས་ཟད་དུ་ཆུག །'
- kind: translation
  label: Translation
  body: Let the water muddied by thoughts’ defilement become clear. Do not deny or establish appearances;
    leave them in their own place. Without rejection or acceptance, phenomenal existence is liberated
    as mahāmudrā (the great seal). In the unborn ālaya (ground-consciousness), abandon habitual traces
    and karmic obscurations. Do not make self-asserting calculations; rest in the essence that is unborn.
    Let the mind’s phenomena—the vividly appearing appearances—be exhausted.
- kind: commentary
  label: Commentary
  body: 'The verse does not prescribe suppressing thought or destroying appearance. Thoughts are compared
    to muddy water: clarity comes when their disturbance is allowed to settle, not when one stirs them
    through argument, fixation, or resistance. “Do not deny or establish” cuts both realist grasping at
    appearances and nihilist dismissal of them. When neither acceptance nor rejection is added, saṃsāric
    appearance is disclosed as mahāmudrā—not transformed into some other object, but known in its ungraspable
    mode. The reference to the unborn ālaya directs attention beneath karmically patterned reactions:
    habits and obscurations are relinquished by not renewing their basis. Even spiritual self-assessment
    and pride are further agitation. The final “exhaustion” of mental phenomena means the wearing out
    of their coercive claim through resting in unborn reality, not blanking out experience.'
- kind: key_terms
  label: Key Terms
  body: '**phyag rgya chen po (mahāmudrā)** — “Great seal”: the nondual character in which all appearances
    are inseparable from emptiness.


    **kun gzhi (ālaya)** — The foundational ground or store-consciousness associated with karmic habits
    and latent traces.


    **bag chags (vāsanā)** — Habitual imprints or tendencies that condition perception, reaction, and
    rebirth.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna, Mūlamadhyamakakārikā:** Nāgārjuna rejects the extremes of asserting intrinsic existence
    and denying conventional appearance; this verse likewise says not to deny or establish appearances.
    Divergence: Tilopa frames this insight as immediate contemplative release into mahāmudrā rather than
    primarily as dialectical analysis of emptiness.


    **Zen, Huineng’s Platform Sūtra:** Huineng repeatedly points to non-abiding mind: do not cling to
    arising thoughts, while the mind’s original clarity is not stained by them. Divergence: This verse
    uses tantric-Yogācāra vocabulary such as ālaya, karmic obscurations, and mahāmudrā, absent from Huineng’s
    central formulation.'
- kind: practice
  label: Practice
  body: Sit quietly and let thoughts and sensory appearances arise without either confirming them as solid
    or trying to dismiss them. Notice the impulse to evaluate progress, claim an experience, or correct
    the mind; release that impulse and rest without taking or rejecting. Let clarity emerge as the settling
    of grasping, not as the production of a special state.
