pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ཀྱེ་ཧོ་འཁོར་བའི་ཆོས་འདི་དོན་མེད་སྡུག་བསྔལ་རྒྱུ། །

    བྱས་པའི་ཆོས་ལ་སྙིང་པོ་མེད་པས་དོན་ལྡན་སྙིང་པོ་ལྟོས། །

    གཟུང་འཛིན་ཀུན་ལས་ ༣༥འདས་ན་ལྟ་བའི་རྒྱལ་པོ་ཡིན། །

    ཡེངས་པ་མེད་ན་བསྒོམ་པའི་རྒྱལ་པོ་ཡིན། །

    བྱ་བཙལ་མེད་ན་སྤྱོད་པའི་རྒྱལ་པོ་ཡིན། །

    རེ་དོགས་མེད་ན་འབྲས་བུ་མངོན་དུ་འགྱུར། །'
- kind: translation
  label: Translation
  body: Emaho! These things of saṃsāra are meaningless, causes of suffering. Since fabricated phenomena
    have no essence, look to the meaningful essential. If you transcend all grasping and fixation, you
    are the king of view. If there is no distraction, you are the king of meditation. If there is no contrived
    seeking or doing, you are the king of conduct. If there is no hope or fear, the fruition becomes manifest.
- kind: commentary
  label: Commentary
  body: 'The verse moves from diagnosis to direct instruction. Saṃsāric pursuits are called meaningless
    not because experience is denied, but because whatever is fabricated and pursued as lasting lacks
    a self-sufficient essence and repeatedly conditions suffering. The “meaningful essential” is not another
    object to acquire: it is recognized through release from grasping at subject and object. View is sovereign
    when it exceeds every position of apprehension and fixation; meditation is sovereign when awareness
    is undistracted, rather than mechanically produced; conduct is sovereign when action is free of anxious
    self-improvement and goal-seeking. Finally, fruition is not a future reward. When hope for attainment
    and fear of failure cease, the already-present nature is evident. The repeated royal imagery marks
    freedom from dependence on conceptual strategies.'
- kind: key_terms
  label: Key Terms
  body: '**གཟུང་འཛིན་ (gzung ’dzin)** — Grasping and fixation: the dualistic holding of objects and a
    subject who holds them.


    **ཡེངས་པ་ (yengs pa)** — Distraction or scattering away from uncontrived present awareness.


    **རེ་དོགས་ (re dogs)** — Hope and fear, the paired expectations that project attainment and loss.'
- kind: resonances
  label: Resonances
  body: '**Nāgārjuna, Mūlamadhyamakakārikā:** Nāgārjuna likewise dismantles reified views and denies intrinsic
    essence in conditioned phenomena. Divergence: This verse gives a Mahāmudrā-style practical sequence
    of view, meditation, conduct, and fruition rather than Madhyamaka’s analytic dialectic.


    **The Diamond Sūtra:** Its instruction to arouse mind without abiding resembles freedom here from
    grasping, fixation, and hoped-for result. Divergence: The sūtra frames non-abiding chiefly through
    bodhisattva generosity and emptiness, whereas this verse emphasizes immediate meditative non-distraction.'
- kind: practice
  label: Practice
  body: Notice one present hope and one present fear without trying to resolve either. Then rest briefly
    in the knowing that neither grasps after an object nor manufactures a special state; when attention
    wanders, return without pursuing or rejecting anything.
