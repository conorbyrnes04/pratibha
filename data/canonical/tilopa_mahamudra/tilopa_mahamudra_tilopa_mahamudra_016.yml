title: Beyond Hope and Fear
unit_type: verse
commentary: 'The verse moves from diagnosis to direct instruction. Saṃsāric pursuits are called meaningless
  not because experience is denied, but because whatever is fabricated and pursued as lasting lacks a
  self-sufficient essence and repeatedly conditions suffering. The “meaningful essential” is not another
  object to acquire: it is recognized through release from grasping at subject and object. View is sovereign
  when it exceeds every position of apprehension and fixation; meditation is sovereign when awareness
  is undistracted, rather than mechanically produced; conduct is sovereign when action is free of anxious
  self-improvement and goal-seeking. Finally, fruition is not a future reward. When hope for attainment
  and fear of failure cease, the already-present nature is evident. The repeated royal imagery marks freedom
  from dependence on conceptual strategies.'
