pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཔེར་ན་སྐལ་སྟོང་བསགས་པའི་མུན་པ་ཡང་། །

    སྒྲོན་མེ་གཅིག་གིས་མུན་པའི་ཚོགས་རྣམས་སེལ། །

    དེ་བཞིན་རང་སེམས་འོད་གསལ་སྐད་ཅིག་གིས། །

    བསྐལ་པར་བསགས་པའི་མ་རིག་སྡིག་སྒྲིབ་སེལ། །'
- kind: translation
  label: Translation
  body: Just as darkness amassed through a thousand eons is cleared by one lamp, so too the luminosity
    (’od gsal) of one instant of one’s own mind clears ignorance (ma rig pa) and the obscuring stains
    of wrongdoing gathered through eons.
- kind: commentary
  label: Commentary
  body: 'The verse uses a deliberate asymmetry: darkness may be ancient and immense, yet it has no power
    to resist even a single lamp. Likewise, ignorance and karmic obscurations are not presented as substantial
    deposits that must be laboriously removed one by one. Their basis is the failure to recognize mind’s
    already luminous nature. “One instant” does not mean a fleeting conceptual thought or a merely uplifting
    experience; it indicates direct recognition of self-knowing clarity before fixation divides experience
    into knower and known. Such recognition does not erase conventional consequences or excuse harmful
    action. Rather, it cuts the root condition—misapprehension—from which afflicted action and obscuration
    proliferate. The force of the image is therefore not moral shortcut but ontological point: obscurations
    are adventitious, while luminosity is present from the outset.'
- kind: key_terms
  label: Key Terms
  body: '**’od gsal** — Luminosity or clear light: mind’s innate lucid, cognizant nature.


    **ma rig pa** — Ignorance: nonrecognition of the nature of mind, the root of samsaric confusion.


    **sdig sgrib** — Karmic and ethical obscurations, the veiling effects of harmful action.'
- kind: resonances
  label: Resonances
  body: '**Vimalakīrti-nirdeśa:** Its image of a lamp dispelling darkness similarly presents awakening
    as immediately illuminating ignorance. Divergence: The sūtra frames this chiefly through nondual wisdom
    and liberation, whereas this verse explicitly identifies the illuminating lamp with one’s own luminous
    mind.


    **Dzogchen teachings of Garab Dorje:** Both stress that direct recognition of primordial knowing cuts
    through accumulated confusion at its root. Divergence: Dzogchen often articulates this as rigpa’s
    primordial purity, while Tilopa’s verse occurs within Mahāmudrā’s instruction on recognizing mind’s
    luminosity.'
- kind: practice
  label: Practice
  body: 'Sit quietly and let thoughts, memories, and self-judgments appear without trying to calculate
    their age or weight. Turn attention toward the immediate knowing in which they appear: is that knowing
    itself darkened by the thought? Rest briefly in that clear presence, then renew ethical care without
    turning past action into a fixed identity.'
