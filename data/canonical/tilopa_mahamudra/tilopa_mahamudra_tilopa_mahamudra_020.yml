unit_label: A Single Lamp of Mind
title: A Single Lamp of Mind
unit_type: verse
commentary: 'The verse uses a deliberate asymmetry: darkness may be ancient and immense, yet it has no
  power to resist even a single lamp. Likewise, ignorance and karmic obscurations are not presented as
  substantial deposits that must be laboriously removed one by one. Their basis is the failure to recognize
  mind’s already luminous nature. “One instant” does not mean a fleeting conceptual thought or a merely
  uplifting experience; it indicates direct recognition of self-knowing clarity before fixation divides
  experience into knower and known. Such recognition does not erase conventional consequences or excuse
  harmful action. Rather, it cuts the root condition—misapprehension—from which afflicted action and obscuration
  proliferate. The force of the image is therefore not moral shortcut but ontological point: obscurations
  are adventitious, while luminosity is present from the outset.'
