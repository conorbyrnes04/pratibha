unit_label: Dreamlike Worldly Affairs
title: Dreamlike Worldly Affairs
unit_type: verse
commentary: 'The verse begins not by denying ordinary appearance but by asking for a clear appraisal of
  it. Worldly “dharmas”—possessions, reputation, plans, pleasures, and losses—arise vividly, yet cannot
  endure. Their likeness to dream and illusion means that they lack stable, self-sustaining substance,
  not that experience is simply nonexistent or morally irrelevant. Tilopa draws a practical consequence:
  skyoba, a sobering disenchantment. This is not depressive withdrawal or contempt for beings, but freedom
  from investing transient circumstances with ultimate weight. “Let go of worldly activities” targets
  compulsive preoccupation: the endless labor of securing what changes and defending an imagined solidity.
  Such release makes room for the Mahāmudrā orientation in which mind is not bound by passing appearances.'
