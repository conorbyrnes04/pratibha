pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ཀྱེ་མ་འཇིག་རྟེན་ཆོས་ལ་ལེགས་རྟོགས་དང་། །

    རྟག་མི་ཐུབ་སྟེ་རྨི་ལམ་སྒྱུ་མ་འདྲ། །

    རྨི་ལམ་སྒྱུ་མ་དོན་ལ་ཡོད་མ་ཡིན། །

    དེས་ན་སྐྱོ་བ་སྐྱེད་ལ་འཇིག་རྟེན་བྱ་བ་ཐོངས། །'
- kind: translation
  label: Translation
  body: 'Alas, understand well the affairs of the world: they cannot last, like a dream or an illusion.
    Dreams and illusions have no true substance. Therefore arouse disenchantment, and let go of worldly
    busyness.'
- kind: commentary
  label: Commentary
  body: 'The verse begins not by denying ordinary appearance but by asking for a clear appraisal of it.
    Worldly “dharmas”—possessions, reputation, plans, pleasures, and losses—arise vividly, yet cannot
    endure. Their likeness to dream and illusion means that they lack stable, self-sustaining substance,
    not that experience is simply nonexistent or morally irrelevant. Tilopa draws a practical consequence:
    skyoba, a sobering disenchantment. This is not depressive withdrawal or contempt for beings, but freedom
    from investing transient circumstances with ultimate weight. “Let go of worldly activities” targets
    compulsive preoccupation: the endless labor of securing what changes and defending an imagined solidity.
    Such release makes room for the Mahāmudrā orientation in which mind is not bound by passing appearances.'
- kind: key_terms
  label: Key Terms
  body: '**འཇིག་རྟེན་ཆོས་ (jig rten chos)** — Worldly affairs or conditioned concerns: the changing field
    of ordinary gain, loss, and activity.


    **རྨི་ལམ་སྒྱུ་མ་ (rmi lam sgyu ma)** — Dream and illusion, images for appearances that are vivid but
    without enduring essence.


    **སྐྱོ་བ་ (skyo ba)** — Disenchantment or renunciant weariness born from seeing impermanence clearly.'
- kind: resonances
  label: Resonances
  body: '**The Diamond Sūtra:** Its famous comparison of conditioned things to a dream, illusion, bubble,
    and shadow similarly loosens reification of appearances. Divergence: The sūtra frames the image within
    bodhisattva practice and emptiness; this verse presses directly toward relinquishing worldly preoccupation.


    **Milarepa:** Milarepa repeatedly treats fame, wealth, and ordinary life as dreamlike and urges renunciation
    grounded in impermanence. Divergence: Milarepa often speaks in autobiographical songs of solitary
    hardship, whereas Tilopa here gives a compact contemplative instruction without a narrative setting.'
- kind: practice
  label: Practice
  body: 'Bring to mind one current concern involving gain, status, possession, or fear of loss. Notice
    its vivid pull, then ask quietly: “Can this remain?” Without denying its practical consequences, rest
    for a few breaths in the recognition that it is changing and unsubstantial; release one unnecessary
    act of compulsive busyness today.'
