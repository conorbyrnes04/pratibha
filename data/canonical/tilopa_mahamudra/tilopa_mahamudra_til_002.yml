- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heart Sūtra (form is emptiness; thoughts as empty appearances)
    resonance: clouds/thoughts arise yet are empty of own-being, so they neither bind nor need destroying—the sky is their
      emptiness.
    divergence: the sūtra states the emptiness of the aggregates as doctrine; Tilopa gives an experiential vantage (sky vs.
      cloud) for resting in it.
    passage_id: ''
  - citation: Marcus Aurelius / Stoic "inner citadel" (the mind unshaken by the impressions passing through it)
    resonance: the ruling faculty as a space undisturbed by the events crossing it.
    divergence: the Stoic citadel is a fortified rational self that judges impressions; Tilopa's sky is empty awareness with
      no self to fortify.
    passage_id: ''
  - citation: Vijñāna Bhairava (dhāraṇās on space/void as gateways to Bhairava-consciousness)
    resonance: meditation on spaciousness as the door to unbounded awareness.
    divergence: the Śaiva practice rests in the fullness of Śiva-consciousness; Mahāmudrā rests in empty, self-liberating
      awareness without a divine substrate affirmed.
