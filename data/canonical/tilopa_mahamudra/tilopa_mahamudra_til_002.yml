- kind: practice
  label: Practice (Abhyasa)
  body: Sit and, for a few minutes, deliberately let thoughts come without following or fighting them. Each time you notice
    you have been swept into a "cloud," do not scold yourself—simply recognize the open awareness in which the thought is
    appearing, as if stepping back from cloud to sky. Rest as the sky; let the clouds move.
