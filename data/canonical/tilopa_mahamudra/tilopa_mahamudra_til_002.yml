translation_literal: 'Just as gazing at the sky''s expanse causes the sight to dissolve, so too when mind
  looks upon mind itself, conceptual formations cease and unsurpassed enlightenment is attained.


  Just as earth tremors and clouds move through the sky''s dimension without going anywhere or remaining
  anywhere, likewise the conceptual formations arising from mind become transparent when mind-nature is
  seen, and the wave-motion of thought dissolves.


  Just as the sky''s nature transcends color and form, unaltered by white and black, so too the essence
  of mind-nature transcends color and form, unstained by virtue and vice, by white and black dharmas.


  Just as the sun''s luminous essence cannot be obscured by a thousand eons of darkness, likewise the
  essence of mind-nature—luminous and clear—cannot be obscured by samsara''s cycles of time.


  Just as the sky is conceptually labeled "empty" through analysis, yet the sky itself has no such designation,
  so too mind-nature, though spoken of as luminous and clear, has no foundation for the designation that
  it is established as such through speech.


  Thus mind''s nature is primordially like the sky. All phenomena remain unassembled there. Release the
  body''s activities into relaxation and rest in yoga''s ease. Speech: let discourse cease—it is like
  an empty echo in a canyon. Mind: think nothing, but attend to the dharma of non-fabrication. The body
  has no essence—it is like a hollow reed. Mind transcends the object of conceptual thought, like the
  sky''s center. Within that condition, release without contrivance and let go. When intention is not
  grasped, this is mahāmudrā (the great seal). Familiarize yourself with this, and unsurpassed enlightenment
  is attained.'
commentary: 'This passage from Tilopa''s instruction to Nāropa presents mahāmudrā (phyag rgya chen po)—the
  great seal—through a cascade of sky-analogies that dismantle our habitual way of relating to mind and
  reality. The teaching moves through five essential recognitions, each deepening the same insight: mind''s
  true nature is not a thing to be grasped, but an open, luminous, unobstructed dimension that cannot
  be stained, obscured, or captured in words.


  The opening verses establish the core practice: when mind looks directly at mind (sems kyis sems la
  bltas)—not at an object, but at the looker itself—conceptual proliferation (rnam rtog) ceases. This
  is not suppression or blankness; it is the natural dissolution that occurs when the subject-object duality
  collapses. The looker cannot find itself as an object, and in that failure lies freedom.


  The earth-tremor and cloud analogy introduces a crucial subtlety: phenomena move through mind-nature
  without leaving a trace or settling anywhere. Thoughts and emotions are not problems to be eliminated;
  they are events in awareness that leave no residue. The problem is not that they arise, but that we
  mistake them for solid, lasting entities and cling to them. When mind-nature is seen, the "wave-motion
  of thought" (rtog pa''i rba rlab) becomes transparent—still visible, but no longer opaque or binding.


  The color-and-form analogies (sky unaffected by white and black; sun unobscured by darkness; mind unstained
  by virtue and vice) establish that mind-nature is not a blank or neutral state that can be improved
  or degraded. It is already complete, already free. Virtue and vice, meditation and distraction, clarity
  and confusion—these are all movements within an unchanging dimension. This is why Tilopa says to "think
  nothing, but attend to the dharma of non-fabrication" (yin la bzla''i chos la ltos). Non-fabrication
  (gnyug ma) is not an achievement; it is the recognition that mind has never been fabricated, never been
  other than it is.


  The final verses give the practical instruction: release the body into ease, let speech fall silent,
  and place the mind in its own condition without grasping. This is not a technique applied from outside;
  it is the simple recognition of what is already present. "When intention is not grasped, this is mahāmudrā."
  The moment you stop trying to hold or fix mind in any particular state, you are already resting in the
  seal—the non-dual union of emptiness and luminosity that is mind''s true face.


  The teaching culminates in a paradox: mind transcends the object of thought (bsam pa''i yul las ''das),
  yet it is not blank or absent. It is luminous (od gsal), clear, and responsive. The practice is to become
  familiar with this condition through direct recognition, not through conceptual understanding. Familiarity
  (goms) with mind''s sky-like nature is the path to unsurpassed enlightenment (bla med byang chub), because
  there is nowhere else to go and nothing else to become.


  Key Terms


  **phyag rgya chen po (mahāmudrā)** — The great seal; the non-dual recognition of mind''s luminous, empty
  nature, free from conceptual elaboration and subject-object duality.

  **sems nyid (mind-nature)** — The fundamental, unchanging nature of mind itself—luminous, aware, and
  untouched by the contents of experience.

  **gnyug ma (the innate, non-fabricated)** — That which is naturally present from the beginning, prior
  to any conceptual or intentional overlay; the uncontrived condition of mind.'
insight: The sky simile is the most famous image in the Mahāmudrā and Dzogchen traditions, and its precision
  repays attention.
practice: Hold your gaze on a distant point in the sky until the boundary between your seeing and the
  space dissolves—when sight can no longer find where it ends and sky begins, turn that same gaze inward
  to the one who sees, and let it search for the looker as an object. In the failure to find it, rest.
