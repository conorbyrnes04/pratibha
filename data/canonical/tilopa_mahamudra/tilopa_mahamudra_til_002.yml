- kind: translation
  label: Pratibha Translation
  body: Just as space cannot be indicated with a finger or fenced in by a border, the nature of mind [sems nyid] has no center
    and no circumference. Thoughts [rnam rtog] appear and vanish like clouds across a clear sky. Do not run after them and
    do not shove them away—recognize the changeless sky itself, and let awareness rest as that.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sky simile is the most famous image in the Mahāmudrā and Dzogchen traditions, and its precision repays attention.
    Space (*ākāśa*) has three features the instruction exploits: it cannot be located ("pointed to"), it cannot be bounded
    ("no center, no edge"), and it is unaffected by whatever moves through it. Mapping this onto mind makes a strong, counterintuitive
    claim: the practitioner''s real identity is not the stream of thoughts—the "clouds"—but the open, unlocatable awareness
    in which they appear and dissolve. Most meditators unconsciously identify with the clouds, and so their practice becomes
    an anxious weather-management: chasing pleasant thoughts, battling unpleasant ones. Tilopa forbids both maneuvers with
    a single symmetrical instruction—"do not chase, do not push away"—because both equally confirm the mistaken identification
    with content. The liberating recognition is a shift of standpoint from cloud to sky: thoughts are no longer problems to
    be solved but weather that comes and goes in an unharmed spaciousness. Crucially, the sky "does not change"—it is not
    made turbulent by storms nor improved by clear weather—so awareness needs no defending. For a retreatant plagued by "too
    many thoughts," this reframes the whole difficulty: the goal was never a thoughtless mind (an empty sky), but the un-anxious
    recognition of the sky-like awareness that was never disturbed by thought in the first place.


    Key Terms:


    **ākāśa (आकाश)** — Etymology: from *ā-√kāś*, "to shine, be visible/open": "space, sky, ether." The classic simile for
    mind''s nature—open, unlocatable, unbounded, unaffected by contents.

    **sems nyid (the nature of mind)** — Tibetan: *sems* (mind) + *nyid* (-ness, itself): mind''s own nature as distinct from
    its passing contents; the "sky" rather than the "clouds."

    **rnam rtog (discursive thought)** — Tibetan: conceptual, discursive thinking; the "clouds" that arise and dissolve. Not
    an enemy to be eliminated but weather to be neither chased nor repelled.

    **rang grol (self-liberation)** — Tibetan: *rang* (self) + *grol* (freed): thoughts liberate themselves the moment they
    are recognized, like clouds dissolving—no separate act of removal needed.'
