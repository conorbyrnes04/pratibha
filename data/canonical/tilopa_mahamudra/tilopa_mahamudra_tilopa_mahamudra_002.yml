title: The Fortunate Disciple
unit_type: verse
commentary: 'Tilopa addresses Nāropa not as a beginner but as one already tempered by difficulty, devotion,
  intelligence, and patience. These qualities are not presented as achievements in themselves: they establish
  receptivity for the instruction about to follow. “Reverence for the guru” here means a willingness to
  receive and test direct instruction rather than merely defend one’s habitual conceptual position. Endurance
  of suffering is likewise not praise of pain for its own sake, but the capacity not to abandon the path
  when practice unsettles attachment, certainty, or self-image. The final imperative, “thus train your
  mind,” is deliberately forward-pointing: this verse is a threshold. It names the disciple’s preparedness
  and asks for an active inward reorientation, rather than passive admiration of Mahāmudrā.'
