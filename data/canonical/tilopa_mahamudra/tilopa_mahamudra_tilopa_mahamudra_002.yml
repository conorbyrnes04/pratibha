pratibha_layers:
- kind: original
  label: Tibetan
  body: 'དཀའ་བ་སྤྱད་ཅིང་བླ་མ་ལ་གུས་པ། །

    སྡུག་བསྔལ་བཟོད་ལྡན་བློ་ལྡན་ནཱ་རོ་པ། །

    སྐལ་ལྡན་ཁྱོད་ཀྱིས་བློ་ལ་འདི་ལྟར་བྱོས། །'
- kind: translation
  label: Translation
  body: Having undergone hardships and held reverence for the guru (bla ma), Nāropa—wise and able to endure
    suffering—fortunate one, thus train your mind (blo).
- kind: commentary
  label: Commentary
  body: 'Tilopa addresses Nāropa not as a beginner but as one already tempered by difficulty, devotion,
    intelligence, and patience. These qualities are not presented as achievements in themselves: they
    establish receptivity for the instruction about to follow. “Reverence for the guru” here means a willingness
    to receive and test direct instruction rather than merely defend one’s habitual conceptual position.
    Endurance of suffering is likewise not praise of pain for its own sake, but the capacity not to abandon
    the path when practice unsettles attachment, certainty, or self-image. The final imperative, “thus
    train your mind,” is deliberately forward-pointing: this verse is a threshold. It names the disciple’s
    preparedness and asks for an active inward reorientation, rather than passive admiration of Mahāmudrā.'
- kind: key_terms
  label: Key Terms
  body: '**bla ma** — Guru or spiritual teacher; the source of direct instruction and an object of reverent
    trust.


    **blo** — Mind, intellect, or inner disposition; here what is to be trained and turned toward instruction.


    **skal ldan** — Fortunate or karmically endowed; one possessing the conditions to receive the teaching.'
- kind: resonances
  label: Resonances
  body: '**Nāropa’s Twelve Trials:** The traditional Nāropa biographies likewise portray hardship and
    obedience to Tilopa as conditions of maturation for realization. Divergence: The verse itself does
    not narrate particular trials or make extraordinary ordeal a universal prescription.


    **The Fifty Verses on the Guru:** Both stress reverence toward a qualified guru as crucial within
    tantric Buddhist training. Divergence: This verse emphasizes Nāropa’s endurance and imminent mind-training,
    rather than laying out a code of disciple conduct.'
- kind: practice
  label: Practice
  body: Recall a difficulty in practice or life without making it into an identity or proof of spiritual
    worth. Sit quietly and notice how the mind resists discomfort; then gently orient attention toward
    receptivity, humility, and the willingness to be taught. Let “train the mind” mean releasing one fixed
    assumption for the duration of the sitting.
