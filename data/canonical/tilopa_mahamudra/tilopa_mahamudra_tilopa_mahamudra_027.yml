pratibha_layers:
- kind: original
  label: Tibetan
  body: 'ཕྱག་རྒྱ་ཆེན་པོ་གནད་ཀྱི་མན་ངག་འདི། །

    འགྲོ་བ་སྐལ་ལྡན་སྙིང་ལ་གནས་པར་ཤོག །'
- kind: translation
  label: Translation
  body: May this essential pith instruction (man ngag) of Great Seal (Mahāmudrā) abide in the hearts of
    fortunate beings (skal ldan).
- kind: commentary
  label: Commentary
  body: 'The verse does not add another doctrinal claim about Mahāmudrā; it seals the instruction as a
    wish-prayer. “Pith instruction” indicates a concise, experiential teaching whose force depends on
    direct recognition rather than on conceptual accumulation. Mahāmudrā is called “Great Seal” because
    all experience is to be recognized as inseparable from the mind’s ungraspable nature; the seal is
    not imposed on phenomena but discovered as their mode of appearing. The aspiration that it “abide
    in the heart” points beyond merely hearing or memorizing: the instruction must become stable, intimate,
    and lived. “Fortunate” does not simply mean socially blessed; it evokes the karmic and relational
    conditions—especially receptivity, practice, and connection with authentic guidance—by which such
    a teaching can be received.'
- kind: key_terms
  label: Key Terms
  body: '**phyag rgya chen po (Mahāmudrā)** — “Great Seal”: the realization that all appearances and mind
    share an empty, luminous, ungraspable nature.


    **man ngag** — Pith instruction: a condensed oral teaching aimed at direct experiential realization.


    **skal ldan** — Fortunate or well-endowed: one possessing the conditions and receptivity to encounter
    and embody the Dharma.'
- kind: resonances
  label: Resonances
  body: '**Gampopa’s The Jewel Ornament of Liberation:** Gampopa likewise presents realization as dependent
    on favorable conditions, devotion, and receiving the Dharma in a form that transforms the mind. Divergence:
    Gampopa offers a broad graduated path, whereas this verse compresses its concern into a direct aspiration
    for Mahāmudrā’s pith to take root.


    **Śāntideva’s Bodhicaryāvatāra dedication prayers:** Both close teaching in an altruistic register,
    directing its benefit beyond the speaker toward sentient beings. Divergence: Śāntideva chiefly dedicates
    merit for liberation and bodhisattva activity; Tilopa specifically prays for the inward reception
    of a nondual contemplative instruction.'
- kind: practice
  label: Practice
  body: Read the verse slowly, then rest for a few minutes without trying to manufacture a special state.
    Notice whatever appears in body and mind, and gently ask whether the instruction is being held as
    an idea or allowed to settle wordlessly in the heart. End by wishing that this capacity for direct
    recognition mature in all receptive beings.
