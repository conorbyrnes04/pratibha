unit_label: Pith Instruction for Fortunate Hearts
title: Pith Instruction for Fortunate Hearts
unit_type: verse
commentary: 'The verse does not add another doctrinal claim about Mahāmudrā; it seals the instruction
  as a wish-prayer. “Pith instruction” indicates a concise, experiential teaching whose force depends
  on direct recognition rather than on conceptual accumulation. Mahāmudrā is called “Great Seal” because
  all experience is to be recognized as inseparable from the mind’s ungraspable nature; the seal is not
  imposed on phenomena but discovered as their mode of appearing. The aspiration that it “abide in the
  heart” points beyond merely hearing or memorizing: the instruction must become stable, intimate, and
  lived. “Fortunate” does not simply mean socially blessed; it evokes the karmic and relational conditions—especially
  receptivity, practice, and connection with authentic guidance—by which such a teaching can be received.'
