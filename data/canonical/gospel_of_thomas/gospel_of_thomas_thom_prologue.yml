sanskrit_devanagari: ⲛⲁⲉⲓ ⲛⲉ ⲛ̄ϣⲁϫⲉ ⲉⲑⲏⲡ⳿ ⲉⲛⲧⲁⲓ︤ⲥ︥ ⲉⲧⲟⲛϩ ϫⲟⲟⲩ ⲁⲩⲱ ⲁϥⲥϩⲁⲓ̈ⲥⲟⲩ ⲛ̄ϭⲓⲇⲓⲇⲩⲙⲟⲥ ⲓ̈ⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
translation_literal: These are the hidden words that the living Jesus spoke, and Didymus Judas Thomas
  wrote them down.
commentary: 'The prologue presents the collection not as a narrated life of Jesus but as a body of ⲛ̄ϣⲁϫⲉ,
  “words” or “sayings.” Their designation as ⲉⲑⲏⲡ, “hidden,” need not mean merely withheld from public
  view. It suggests speech whose sense is not exhausted at first hearing: words requiring attention, interpretation,
  and discovery.


  Jesus is identified as “the living” (ⲉⲧⲟⲛϩ), a title that gives the speaker present force rather than
  locating him only in the past. The named writer bears the doubled name Didymus Judas Thomas; Didymus
  is Greek for “twin,” while Thomas likewise carries the sense “twin” in Aramaic/Syriac usage. The prologue
  thus joins hidden words to a doubled witness: one who records speech that readers must themselves receive
  and uncover.


  Key Terms


  **ⲛ̄ϣⲁϫⲉ** — “words” or “sayings,” the collected utterances that follow.

  **ⲉⲑⲏⲡ** — “hidden” or “secret,” indicating words whose meaning calls for discovery.

  **ⲉⲧⲟⲛϩ** — “the living,” a designation of Jesus as living and present.

  **ⲇⲓⲇⲩⲙⲟⲥ** — Greek “twin,” paired with the name Thomas, which also evokes twinning.


  Cross-Tradition Resonances


  **Mark 4:11:** Jesus speaks of “the mystery of the kingdom of God” as something given, while others
  receive teaching in parables; both texts connect Jesus'' speech with disclosure that is not automatic.
  Divergence: Mark embeds hiddenness within a narrative of parables and insider-outsider hearing, whereas
  Thomas opens with a written collection explicitly called hidden words.

  **Daniel 12:4:** Daniel is told to keep words concealed and seal a book until an appointed time, resembling
  Thomas''s concern with speech that is guarded or not immediately plain. Divergence: Daniel''s sealed
  words belong to an apocalyptic timetable, while Thomas offers its sayings for present reading rather
  than postponing their opening to a final era.

  **Gospel of John 20:24-29:** John identifies Thomas as “called Didymus” and portrays him as a distinctive
  witness to the risen Jesus, consonant with Thomas''s association here with “the living Jesus.” Divergence:
  John''s Thomas is drawn into a resurrection scene centered on seeing and believing; this prologue gives
  him the role of scribe for sayings, without recounting a resurrection appearance.'
practice: Read the translation aloud once, then sit silently for three minutes with the phrase “the living
  Jesus.” Write one word or image that remains hidden to you, and do not force an interpretation; return
  to it later in the day.
