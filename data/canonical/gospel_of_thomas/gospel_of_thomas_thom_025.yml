translation_literal: Jesus said, “Love your brother as your own soul; watch over him as you would the
  pupil of your eye.”
commentary: 'The saying joins two images of intimate value. One is the ⲯⲩⲭⲏ (psychē), the Greek loanword
  for “soul” or living self: the brother is to be loved with the regard one naturally bears toward one’s
  own life. The other image sharpens this into protection: the eye’s pupil is small, exposed, and instinctively
  guarded.


  Love here is not merely inward affection. The verb ⲙⲉⲣⲉ calls for active cherishing, while the final
  comparison evokes alert custodianship. The brother’s vulnerability becomes one’s own concern; to harm
  or neglect him is like endangering one’s own capacity to see.


  Key Terms


  **ⲙⲉⲣⲉ** — to love, cherish, or hold dear.

  **ⲥⲟⲛ** — brother; a fellow member of the community.

  **ⲯⲩⲭⲏ** — Greek psychē: soul, life, or the vital self.

  **ⲃⲁⲗ** — eye; here specifically its precious pupil.


  Cross-Tradition Resonances


  **Leviticus 19:18:** The command to love one’s neighbor as oneself supplies a close ethical parallel:
  another’s good is measured by the care one gives oneself. Divergence: Leviticus speaks of the neighbor,
  whereas Thomas addresses the “brother” and adds the vivid image of guarding the eye.

  **Matthew 7:12:** The Golden Rule similarly makes one’s own desires and treatment the measure for dealings
  with others. Divergence: Matthew frames the principle as reciprocal action toward all people; this saying
  stresses loving protection of a brother.

  **Dhammapada 129–130:** These verses ask one to recognize that all fear pain and death, then to refrain
  from harming others by analogy with oneself. Divergence: The Buddhist formulation centers on non-harm
  through shared vulnerability, while Thomas positively commands love and watchful care.'
practice: Choose one person in your immediate circle who may be exposed or overlooked. Today make one
  specific protective act for them—listen without interruption, check on a need, defend their absence,
  or quietly remove a burden—and do it with the same promptness with which you would shield your own eye.
