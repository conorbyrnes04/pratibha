translation_literal: Jesus said, “Blessed are the solitary and the chosen, for you will find it. For you
  are from within it, and you will go again to it.”
commentary: 'The saying blesses not social isolation for its own sake, but a gathered, undivided condition.
  The Coptic ⲙⲟⲛⲁⲭⲟⲥ, borrowed from Greek monachos, means a solitary or single person; it should not be
  read too quickly as the later institutional “monk.” Joined with ⲉⲧⲥⲟⲧⲡ, “the chosen,” it describes persons
  made single and set apart.


  Notably, the object of “you will find it” is only a pronoun in this wording. The saying leaves its referent
  unspoken, then identifies the seekers as already “from within it.” Finding is therefore not acquisition
  of a foreign possession, but recognition of one’s source. The final movement—going again to it—makes
  return, rather than escape, the governing image.


  Key Terms


  **ⲙⲁⲕⲁⲣⲓⲟⲥ** — “Blessed,” a Greek-derived word of fortunate or deeply favored condition.

  **ⲙⲟⲛⲁⲭⲟⲥ** — “Solitary” or “single one”; a Greek loanword, not necessarily a later monastic title.

  **ⲥⲟⲧⲡ** — “Chosen” or “selected,” indicating being set apart.

  **ϩⲛ̄ⲉⲃⲟⲗ** — “From within” or “out of the interior of,” marking origin in what is sought.


  Cross-Tradition Resonances


  **Matthew 5:3:** Like the Beatitudes, this saying begins by declaring a distinctive human condition
  blessed and links that blessing with ultimate fulfillment. Divergence: Matthew explicitly names the
  kingdom of heaven and commends the poor in spirit, while this saying names solitary and chosen persons
  and leaves the object unstated.

  **Plotinus, Enneads VI.9.11:** Plotinus’s phrase “the flight of the alone to the Alone” parallels the
  logion’s language of solitude and return to one’s source. Divergence: Plotinus frames the movement as
  philosophical ascent of soul toward the One; Thomas speaks in a beatitude addressed to chosen persons.

  **Bhagavad Gita 6.10:** The Gita commends the yogin who practices alone in a secluded place, echoing
  the value of inwardly gathered solitude. Divergence: The Gita emphasizes disciplined meditative practice,
  whereas this saying grounds return in already being from within the unnamed reality.'
practice: 'Spend ten minutes alone without reading, speaking, or devices. Sit upright, breathe slowly,
  and ask on each exhale: “What in me is scattered?” On each inhale: “What is already from within?” End
  by taking one small action that restores undivided attention.'
