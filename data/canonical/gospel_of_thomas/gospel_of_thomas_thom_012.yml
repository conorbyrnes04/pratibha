translation_literal: The disciples said to Jesus, “We know that you will leave us. Who, then, is to be
  over us?” Jesus said to them, “Wherever you have come from, you are to go to James the Just—for heaven
  and earth came to be because of him.”
commentary: 'The disciples ask not merely who will replace Jesus, but who will stand “over” them: the
  question is about order, guidance, and authority after departure. Jesus does not describe a procedure
  of appointment. He directs them to Iakōbos, James, giving him the Greek honorific ⲡⲇⲓⲕⲁⲓⲟⲥ (dikaios),
  “the Just” or “the Righteous.” Authority here is grounded in the quality of a person rather than in
  office alone.


  The final claim is deliberately immense: heaven and earth “came to be because of him.” It makes James
  more than a practical successor; he is presented as a figure whose righteousness belongs to the world’s
  deep intention. The saying does not explain this cosmic language. Its force lies in the contrast between
  the disciples’ anxious search for control and Jesus’ answer: return to the one whose justice discloses
  why the created order exists at all.


  Key Terms


  **ⲓ̈ⲁⲕⲱⲃⲟⲥ** — James; the Coptic form of the Greek name Iakōbos.

  **ⲡⲇⲓⲕⲁⲓⲟⲥ** — “the Just/Righteous,” from Greek dikaios; a title marking rectitude and covenantal faithfulness.

  **ⲉϩⲣⲁⲓ̈ ⲉϫⲱⲛ** — “over us,” expressing the disciples’ concern for leadership or precedence.

  **ⲧⲡⲉ ⲙⲛ̄ ⲡⲕⲁϩ** — “heaven and earth,” a totalizing phrase for the created order.


  Cross-Tradition Resonances


  **Galatians 2:9:** Paul names James, Cephas, and John as “pillars,” similarly portraying James as a
  stabilizing figure within the early community. Divergence: Galatians shares authority among three leaders
  and does not attribute the existence of heaven and earth to James.

  **Acts 15:13–21:** James gives the decisive concluding judgment at the Jerusalem gathering, showing
  his recognized role in guiding a divided movement. Divergence: Acts depicts deliberation, scriptural
  argument, and communal decision; Thomas gives an uncompromising, cosmic rationale for turning to James.

  **Pirkei Avot 1:2:** The Mishnah teaches that the world stands upon Torah, worship, and deeds of lovingkindness,
  linking the world’s endurance with righteous practice. Divergence: Pirkei Avot locates the world’s stability
  in three enduring practices, whereas this saying concentrates that significance in one righteous person.'
practice: 'Place an empty chair at the center of a group or room. Sit quietly for five minutes and ask:
  “Whose steady justice—not whose status—could guide us?” Write one concrete act by which you can support
  that person’s faithful service this week.'
