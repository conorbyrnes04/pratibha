sanskrit_devanagari: ⲓ︤ⲥ︥ ϫⲉⲡⲉⲧⲁϩⲥⲟⲩⲱⲛⲡⲕⲟⲥⲙⲟⲥ ⲁϥ⳿ϩⲉ ⲉⲩⲡⲧⲱⲙⲁ ⲁⲩⲱ ⲡⲉⲛⲧⲁϩ ⲁ ⲡⲕⲟⲥⲙⲟⲥ ⲙ̄ⲡϣⲁ ⲙ̄ⲙⲟϥ ⲁⲛ
translation_literal: Jesus said, “Whoever has come to know the world has found a corpse; and whoever has
  found a corpse—the world is not worthy of that one.”
commentary: 'The saying does not merely call the world imperfect. To know it truly is to encounter it
  as a ⲡⲧⲱⲙⲁ (Greek πτῶμα): a corpse, a fallen and lifeless body. Its force lies in the reversal of ordinary
  desire. What appears solid, desirable, and alive is disclosed as mortal matter, unable to give the life
  it promises.


  The second clause shifts from perception to relation. Once one has seen the world in this way, the ⲕⲟⲥⲙⲟⲥ
  (Greek κόσμος, “world,” “ordered realm”) is no longer worthy of that person. This is not necessarily
  contempt for created things; it is a refusal to grant passing forms ultimate value. The saying calls
  for a freedom born from seeing transience without illusion.


  Key Terms


  **ⲕⲟⲥⲙⲟⲥ (kosmos)** — The world or ordered visible realm; a Greek loanword carrying the sense of the
  worldly order.

  **ⲡⲧⲱⲙⲁ (ptōma)** — A corpse; literally something fallen, emphasizing death and collapse.

  **ⲥⲟⲩⲱⲛ (sooun)** — To know or recognize, here suggesting penetrating discernment rather than mere information.

  **ⲙ̄ⲡϣⲁ** — Worthy, fitting, or deserving; the world is judged inadequate to the knower.


  Cross-Tradition Resonances


  **1 John 2:15–17:** This passage contrasts love of the world with doing God’s will, since “the world
  is passing away.” Divergence: Thomas uses the stark image of a corpse and does not frame the saying
  as a command to love God over against worldly desire.

  **Ecclesiastes 1:2; 2:11:** Ecclesiastes finds worldly striving vaporous and unable to yield lasting
  gain. Divergence: Ecclesiastes reflects on futility within life under the sun, while Thomas presents
  a more abrupt revelatory judgment upon the world itself.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** The charnel-ground contemplations use a corpse to awaken
  insight into bodily impermanence and release attachment. Divergence: The Buddhist practice focuses especially
  on one’s own body and impermanence, whereas this saying makes the corpse an image for the cosmos.'
practice: 'For ten minutes, hold or sit beside one ordinary object you value or use daily. Notice its
  materials, wear, eventual breaking, and disappearance. Then ask quietly: “What in me seeks life from
  what cannot last?” End by naming one relationship or act of generosity that you will treat as more worthy
  than acquisition today.'
