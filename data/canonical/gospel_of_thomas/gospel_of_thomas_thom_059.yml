translation_literal: Jesus said, “Look for the Living One while you are alive, so that you do not die
  and then seek to see him, yet are unable to see.”
commentary: 'The saying presses its hearers into the present tense: seek and see while life remains available.
  “The Living One” is not presented as an object of abstract belief, but as one who must be encountered.
  The danger is postponement—imagining that recognition can be deferred until a later, safer, or more
  final moment.


  The Coptic ⲡⲟⲛϩ, “the living one,” can carry more force than a mere contrast with the dead: it names
  the one characterized by life. The final verb, ⲛⲁⲩ, “to see,” frames the saying. To see the Living One
  is a capacity requiring a living responsiveness; death here marks not only bodily ending, but the irreversible
  failure of attention.


  Key Terms


  **ⲡⲟⲛϩ** — “the Living One,” the one defined by life; possibly a title for Jesus or the divine reality
  he discloses.

  **ϭⲱϣⲧ** — “look” or “watch for,” an intent, sustained act of attention.

  **ϣⲓⲛⲉ** — “seek,” implying an active search rather than passive expectation.

  **ⲛⲁⲩ** — “see,” here suggesting recognition as well as physical sight.


  Cross-Tradition Resonances


  **John 12:35:** Jesus urges his hearers to walk while they have the light, before darkness overtakes
  them; both sayings make present opportunity spiritually decisive. Divergence: John identifies the decisive
  gift specifically as light and faith in the Light, whereas Thomas speaks of seeking and seeing the Living
  One.

  **Ecclesiastes 9:10:** Qoheleth commands action “in the grave, where you are going,” emphasizing that
  death ends the sphere of human doing. Divergence: Ecclesiastes directs energy toward one’s work, while
  this saying directs attention toward an encounter with the Living One.

  **Dhammapada 21:** “Heedfulness is the path to the deathless”; both texts portray wakeful attention
  as the proper response to mortality. Divergence: The Dhammapada frames the goal as the deathless attained
  through heedfulness, while Thomas frames it as seeing a personal or personified Living One.'
practice: 'For ten minutes today, sit without devices and attend to your breathing, bodily sensations,
  and immediate surroundings. Then ask aloud: “What am I postponing the need to see?” Name one person,
  truth, grief, or act of reconciliation, and take one concrete step toward it before the day ends.'
