sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϭⲱϣⲧ ⲛ̄ⲥⲁⲡⲟⲛϩ ϩⲱⲥ ⲉⲧⲉⲧⲛ̄ⲟⲛϩ ϩⲓⲛⲁ ϫⲉⲛⲉⲧⲙ̄ⲙⲟⲩ ⲁⲩⲱ ⲛ̄ⲧⲉⲧⲛ̄ϣⲓⲛⲉ ⲉⲛⲁⲩ ⲉⲣⲟϥ
