translation_literal: Jesus said, “If those who guide you say to you, ‘Look, the kingdom is in heaven,’
  then the birds of heaven will get there before you. If they say to you, ‘It is in the sea,’ then the
  fish will get there before you. Rather, the kingdom is within you, and it is outside you. When you come
  to know yourselves, then you will be known, and you will understand that you are children of the living
  Father. But if you do not know yourselves, you dwell in poverty, and you are the …”
commentary: 'The saying refuses a kingdom made remote by religious direction: not a destination above
  the birds or beneath the fish. The contrast is sharp and almost playful. If the kingdom were merely
  a location in sky or sea, creatures already native to those realms would surpass human seekers. Instead,
  it is said to be both “within” and “outside,” dismantling the divide between inward awakening and the
  world encountered around one.


  Self-knowledge is not private self-preoccupation here. To know oneself is to be known and to recognize
  one’s origin as a child of the “living Father.” The reciprocal wording makes recognition relational:
  awakening discloses belonging. The final sentence is cut off in the supplied Coptic after “and you are
  the …”; its unfinished state should remain unfinished. Yet “poverty” already names the condition of
  failing to perceive one’s true source and dwelling-place. The loanword ⲑⲁⲗⲁⲥⲥⲁ (thalassa, “sea”) heightens
  the saying’s deliberately impossible geography.


  Key Terms


  **ⲥⲟⲩⲱⲛ** — “Know”; a recognition that brings understanding and relation, not bare information.

  **ϩⲟⲩⲛ** — “Within”; the interior sphere where the kingdom is said to be present.

  **ⲃⲁⲗ** — “Outside”; paired with “within,” resisting an exclusively inward reading.

  **ⲑⲁⲗⲁⲥⲥⲁ** — “Sea,” a Greek loanword used in the saying’s image of misplaced spiritual searching.


  Cross-Tradition Resonances


  **Deuteronomy 30:11–14:** The command is not located in heaven or beyond the sea, but is near—in mouth
  and heart. Divergence: Deuteronomy concerns covenantal command and obedience, whereas Thomas joins nearness
  to self-knowledge and filial identity.

  **Luke 17:20–21:** Jesus denies that God’s kingdom arrives as an observable spectacle and declares it
  to be already among or within those addressed. Divergence: Luke’s phrase is grammatically open to “among
  you,” while Thomas explicitly joins what is within to what is outside.

  **Plato, Alcibiades 1, 129a–130c:** Socrates argues that care of oneself requires knowing oneself, especially
  the soul’s true reality. Divergence: Plato’s inquiry is philosophical and concerned with the soul’s
  governance; Thomas roots self-knowledge in being known as children of the living Father.'
practice: 'For ten minutes, sit without seeking a distant answer. Notice one breath, one bodily sensation,
  one sound beyond you, and one person or creature before you. After each, silently say: “Within and outside.”
  End by naming one way you can act today from belonging rather than lack.'
