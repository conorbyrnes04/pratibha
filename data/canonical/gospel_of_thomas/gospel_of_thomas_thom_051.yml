translation_literal: His disciples said to him, "When will the repose of the dead occur? And when will
  the new world come?" He said to them, "That which you await has already come, but you do not recognize
  it."
commentary: 'The disciples frame their question in future terms: when will the dead enter rest, and when
  will a renewed cosmos come? Jesus does not supply a date. Instead, he overturns the posture of waiting.
  The reality they seek is not merely pending; it has already arrived, though it remains unrecognized.


  The word ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (Greek anapausis) means “rest,” relief, or repose, and can carry the weight of final
  rest after death. Yet the reply shifts attention from a future event to present perception. Likewise
  ⲕⲟⲥⲙⲟⲥ, “world,” is qualified as new, but its newness is hidden in plain sight. The obstacle is not
  delay but lack of knowing: ⲧⲉⲧⲛ̄ⲥⲟⲟⲩⲛ ⲁⲛ, “you do not know it.”


  Key Terms


  **ⲁⲛⲁⲡⲁⲩⲥⲓⲥ** — Greek loanword meaning rest, repose, or release from weariness.

  **ⲕⲟⲥⲙⲟⲥ** — The ordered world; here, the world anticipated as new.

  **ⲥⲟⲟⲩⲛ** — To know or recognize; the saying turns on a failure of perception.

  **ⲃⲃⲣⲣⲉ** — New, fresh, renewed.


  Cross-Tradition Resonances


  **Mark 1:15:** Jesus announces that the decisive time is fulfilled and God’s reign has drawn near, echoing
  Thomas’s claim that what is awaited has already come. Divergence: Mark calls for repentance and trust
  in the gospel, whereas Thomas emphasizes recognition of a reality already present.

  **Luke 17:20–21:** Jesus says that God’s kingdom does not come through observable signs and is already
  among or within those addressed. Divergence: Luke speaks explicitly of God’s kingdom, while Thomas speaks
  of the rest of the dead and the new world.

  **Isaiah 65:17:** Isaiah envisions new heavens and a new earth, providing a recognizable scriptural
  horizon for the disciples’ expectation of a renewed world. Divergence: Isaiah projects a transformative
  future act of God; Thomas declares the awaited renewal already present but unnoticed.'
practice: 'For ten minutes, sit without trying to attain a future spiritual state. Notice three ordinary
  realities—a sound, a bodily sensation, and a person or object before you—and ask quietly: “What has
  already arrived that I have not recognized?”'
