sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϯⲛⲁϯ ⲛⲏⲧⲛ̄ ⲙ̄ⲡⲉⲧⲉⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ ⲉⲣⲟϥ⳿ ⲁⲩⲱ ⲡⲉⲧⲉⲙ̄ⲡⲉ ⲥⲟⲧⲙⲉϥ⳿ ⲁⲩⲱ ⲡⲉⲧⲉⲙⲡⲉϭⲓϫ⳿
  ϭⲙ̄ϭⲱⲙϥ̅ ⲁⲩⲱ ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈ ϩⲓⲫⲏⲧ⳿ ⲣ̄ⲣⲱⲙⲉ
translation_literal: Jesus said, “I will give you what no eye has seen, what no ear has heard, what no
  hand has touched, and what has never risen within a human heart.”
commentary: 'The saying gathers sight, hearing, touch, and inward thought, then declares each inadequate
  to what Jesus gives. The gift is not merely a secret object waiting to be detected by sharper senses.
  It lies beyond ordinary perception and beyond the heart’s capacity to generate, picture, or anticipate
  it.


  The repeated Coptic construction ⲙ̄ⲡⲉ- (“has not/not yet”) marks a complete absence: no eye has seen
  it, no ear has heard it, no hand has encountered it. The final phrase, ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈ ϩⲓⲫⲏⲧ ⲣ̄ⲣⲱⲙⲉ,
  literally evokes something not having “come up” upon a human heart. What is promised exceeds both sensory
  evidence and the inner storehouse of human expectation.


  Key Terms


  **ⲃⲁⲗ** — “Eye”; the first boundary of ordinary human knowing.

  **ⲥⲟⲧⲙ** — “Hear”; hearing here represents received report or teaching.

  **ϭⲓϫ** — “Hand”; a sign of tactile contact, grasping, and possession.

  **ϩⲏⲧ** — “Heart”; the inward center of thought, desire, and intention.


  Cross-Tradition Resonances


  **1 Corinthians 2:9:** Paul likewise speaks of what eye has not seen and ear has not heard, prepared
  by God beyond human expectation. Divergence: Paul frames the saying around what God has prepared for
  those who love him and revealed through the Spirit; Thomas simply promises that Jesus will give the
  unperceived reality.

  **Isaiah 64:4:** Isaiah describes a God whose action for those who wait cannot be heard or seen by human
  senses. Divergence: Isaiah emphasizes God’s incomparable deeds in history, whereas Thomas concentrates
  on a gift that surpasses even inward conception.

  **Kena Upanishad 1.3–4:** The Upanishad points toward that which cannot be reached by speech, mind,
  sight, or hearing, yet makes these faculties possible. Divergence: The Upanishad develops a metaphysical
  account of ultimate reality; this saying presents a personal promise spoken by Jesus.'
practice: 'Sit quietly for five minutes with open hands. Notice one thing seen, heard, and felt; then
  release the need to name or grasp it, ending with the simple prayer: “Give me what I cannot manufacture.”'
