translation_literal: Jesus said, “The splinter in your brother’s eye—you see it; but the beam in your
  own eye—you do not see it. When you cast the beam out of your eye, then you will see clearly enough
  to cast the splinter out of your brother’s eye.”
commentary: 'The saying turns on a stark disproportion: ⲡϫⲏ, the small chip or splinter, is readily noticed
  in another, while ⲡⲥⲟⲓ, the large beam, remains unseen in oneself. The problem is not that care for
  a brother is forbidden. Rather, unexamined vision makes such care presumptuous and potentially harmful.


  The final movement matters: the speaker does not simply command silence about another’s wound. First
  remove what blocks your own sight; then you will be able to see ⲉⲃⲟⲗ—openly, clearly, effectively—in
  order to help. Correction becomes credible only when it grows from practiced self-knowledge rather than
  from superiority.


  Key Terms


  **ⲡϫⲏ** — A small splinter, chip, or mote lodged in the eye.

  **ⲡⲥⲟⲓ** — A beam or large piece of timber; an image of a grave personal obstruction.

  **ⲃⲁⲗ** — Eye; here, both physical sight and the capacity for moral perception.

  **ⲛⲟⲩϫⲉ** — To cast out or remove, indicating active prior self-correction.


  Cross-Tradition Resonances


  **Matthew 7:3–5:** Matthew similarly contrasts the speck in a brother’s eye with the log in one’s own
  and calls for removing one’s own obstruction first. Divergence: Thomas presents the saying without Matthew’s
  surrounding warnings about judging, prayer, and holy things.

  **Luke 6:41–42:** Luke likewise connects the eye-image with hypocrisy and says that clear sight follows
  self-correction. Divergence: Luke frames the saying within a wider discourse on mercy, enemies, and
  the blind leading the blind; Thomas gives the image by itself.

  **Mishnah Nega''im 2:5:** The rabbinic maxim that a person may inspect all blemishes except his own
  expresses the same irony: self-interest clouds self-diagnosis. Divergence: The Mishnah concerns the
  legal inspection of skin afflictions, whereas this saying addresses interpersonal moral perception.'
practice: Before offering criticism today, pause with both feet on the ground and name one concrete fault,
  fear, or defensiveness active in yourself. Take one small step to address it; only then speak to the
  other person, asking first what help they actually want.
