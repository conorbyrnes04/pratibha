translation_literal: Jesus said, “An old person will not hesitate to ask a little child, seven days old,
  about the place of life—and that person will live. For many who are first will be last, and they will
  become one and the same.”
commentary: 'The saying overturns the ordinary direction of wisdom. The aged person, marked by days and
  experience, must ask one only seven days into life. The infant is not presented as verbally learned;
  its very nearness to beginning makes it a sign of “the place of life.” To live, the elder must relinquish
  the shame of not knowing and become a questioner.


  The Coptic ⲡⲧⲟⲡⲟⲥ, from Greek τόπος, means “place,” but it can suggest a proper location or standing:
  where life truly has its ground. The final reversal—first becoming last—does not end merely in a new
  hierarchy. It moves toward ⲟⲩⲁ ⲟⲩⲱⲧ, “one, single,” where the distinctions that rank old over young,
  first over last, are gathered into unity.


  Key Terms


  **ⲡⲧⲟⲡⲟⲥ (topos)** — “Place,” a Greek loanword; here, the true ground or location of life.

  **ⲡⲱⲛϩ** — “Life,” not simply survival but the life the seeker desires to receive.

  **ⲛ̄ϩⲗⲗⲟ** — “Old person” or elder, the figure who must become willing to ask.

  **ⲟⲩⲁ ⲟⲩⲱⲧ** — “One, single”; an idiom of undivided unity.


  Cross-Tradition Resonances


  **Matthew 18:3:** Jesus tells his disciples that they must turn and become like children in order to
  enter the kingdom of heaven. Divergence: Matthew calls disciples to childlike conversion, while Thomas
  makes a seven-day-old infant a bearer of knowledge about life’s place.

  **Mark 10:31:** “Many who are first will be last, and the last first” closely echoes Thomas’s reversal
  of social or spiritual precedence. Divergence: Mark frames the reversal within kingdom recompense, whereas
  Thomas carries it onward into becoming one.

  **Laozi, Daodejing 28:** The text commends a return to an uncarved, childlike beginning rather than
  self-assertive mastery. Divergence: The Daodejing describes alignment with the Dao, while Thomas focuses
  on asking about the place of life and on unity after reversal.'
practice: 'For seven minutes, sit on the floor rather than in a chair. Hold a small ordinary object in
  your open palm, and ask aloud once: “Where is life now?” Do not answer verbally; attend to breath, weight,
  touch, and the impulse to make yourself the expert.'
