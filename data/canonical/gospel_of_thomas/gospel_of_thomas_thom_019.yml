translation_literal: Jesus said, 'Blessed is the one who existed before he came into being. If you become
  my disciples and hear my words, these stones will minister to you. For there are five trees for you
  in Paradise which do not move in summer or in winter, and their leaves do not fall. Whoever knows them
  will not taste death.'
commentary: 'The opening blessing reaches behind ordinary beginning: blessed is the one who “came to be
  before coming to be.” The saying does not explain this paradox. Instead, it places discipleship—becoming
  Jesus’ followers and hearing his words—within a reality prior to the changing world. Even stones, the
  image suggests, may become provision for those who receive this teaching.


  The five trees in ⲡⲁⲣⲁⲇⲓⲥⲟⲥ (paradise, a Greek loanword) stand outside the rhythms of heat, cold, and
  decay. Their unmoving branches and unfailing leaves evoke a life untouched by seasonal loss. Yet immortality
  is not attached merely to possessing the trees: it belongs to knowing them. In this saying, knowledge
  is intimate recognition of an abiding divine reality, a knowing that releases one from death’s taste.


  Key Terms


  **ⲙⲁⲕⲁⲣⲓⲟⲥ** — “Blessed”; a Greek-derived term for one graced with deep, enviable well-being.

  **ⲡⲁⲣⲁⲇⲓⲥⲟⲥ** — “Paradise”; the garden-like realm of divine life and permanence.

  **ⲥⲱⲧⲙ̄** — “Hear” or “listen”; receptive hearing that marks genuine discipleship.

  **ⲥⲟⲩⲱⲛ** — “Know”; not bare information, but recognition with transformative force.


  Cross-Tradition Resonances


  **John 8:58:** Jesus’ declaration, “Before Abraham came to be, I am,” likewise presses beyond ordinary
  temporal origin. Divergence: John explicitly identifies Jesus with this pre-temporal claim, while Thomas
  blesses the person who participates in a prior mode of being.

  **Genesis 2:9:** Genesis locates life-giving trees in a primordial garden, linking paradise and life
  beyond ordinary human possession. Divergence: Genesis names the tree of life and the tree of knowledge;
  this saying presents five imperishable trees whose knowledge defeats death.

  **Psalm 1:3:** The righteous person is compared to a tree whose leaf does not wither, an image of enduring
  vitality. Divergence: Psalm 1 concerns a single fruitful person rooted in Torah, whereas Thomas speaks
  of five hidden paradisal trees known by the disciple.'
practice: Stand outdoors beside a tree or plant for five quiet minutes. Notice what changes—wind, temperature,
  fallen leaves—and what remains. Then speak aloud one sentence of Jesus’ teaching you are trying to hear,
  and sit in silence long enough to receive it rather than analyze it.
