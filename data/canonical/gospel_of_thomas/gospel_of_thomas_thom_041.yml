sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲡⲉⲧⲉⲩⲛⲧⲁϥ · ϩⲛ̄ⲧⲉϥ⳿ϭⲓϫ ⲥⲉⲛⲁϯ ⲛⲁϥ⳿ ⲁⲩⲱ ⲡⲉⲧⲉⲙⲛ̄ⲧⲁϥ ⲡⲕⲉϣⲏⲙ ⲉⲧⲟⲩⲛ̄ⲧⲁϥ⳿ ⲥⲉⲛⲁϥⲓⲧϥ̄
  ⲛ̄ⲧⲟⲟⲧϥ̄
translation_literal: Jesus said, “To the one who has something in his hand, more will be given. But from
  the one who has nothing, even the little he has will be taken from him.”
commentary: 'The saying turns on the concrete image of the hand: what is held can receive more; what is
  absent is exposed even to further loss. Its stark future verbs—“will be given” and “will be taken”—describe
  a pattern rather than explain its agent. The unnamed “they” leaves the saying unsettling: this is not
  a neat assurance about deserved prosperity, but an observation about how fullness and deprivation can
  compound.


  The Coptic possession-form ⲉⲩⲛⲧⲁϥ, “he has,” is intensified by ⲙ̄ⲧⲉϥϭⲓϫ, “in his hand.” Having is not
  merely ownership; it is something presently held, available, perhaps usable. The phrase ⲡⲕⲉϣⲏⲙ, “the
  little,” makes the second clause especially severe. Read spiritually, the saying may concern attention,
  trust, or practiced understanding: capacities exercised become capacious, while neglected ones can dwindle.
  Yet its material edge should remain audible, since human systems also make scarcity deepen.


  Key Terms


  **ϭⲓϫ** — “Hand”; the bodily image through which possession is made immediate and concrete.

  **ⲉⲩⲛⲧⲁϥ** — “He has”; a Coptic possessive construction, here marking what one presently possesses.

  **ⲕⲉϣⲏⲙ** — “Little thing” or “small amount”; what remains vulnerable to being removed.

  **ⲛⲁϥⲓⲧϥ̄** — “They will take it”; an impersonal plural that leaves the taker unspecified.


  Cross-Tradition Resonances


  **Matthew 13:12:** Matthew preserves the same paradox of increase for the one who has and loss for the
  one who lacks. Divergence: Matthew explicitly connects it with receiving the mysteries of the kingdom,
  whereas Thomas gives only the concentrated image of the hand.

  **Luke 8:18:** Luke likewise warns that even apparent possession may be taken away, linking the saying
  to attentive reception. Divergence: Luke frames the maxim with an exhortation about how one hears; Thomas
  offers no such interpretive guide.

  **Matthew 25:29:** In the parable of the talents, resources actively used lead to greater entrusted
  resources, while unused capacity is removed. Divergence: Matthew embeds the principle in a narrative
  of servants, investment, and judgment; Thomas leaves it as an unadorned aphorism.'
practice: Place one small object in your open palm. Name one capacity you actually have today—attention,
  patience, skill, time—and use it in one concrete act of generosity or disciplined practice. Then open
  your hand and sit for one minute, noticing both gratitude for what is present and concern for those
  whose “little” is being taken.
