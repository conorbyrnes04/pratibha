translation_literal: His disciples said to him, "Teach us about the place where you are, for it is necessary
  for us to seek it." He said to them, "Whoever has ears to hear, let him hear. There is light within
  a person of light, and he illuminates the entire world. When he does not shine, he is darkness."
commentary: 'The disciples ask for a location: the place where Jesus is, a destination they can pursue.
  His reply does not supply a map. Instead, it begins with hearing—the receptive capacity required to
  grasp a saying whose “place” is not simply geographical. What they seek is disclosed as light already
  present within the luminous human being.


  The saying holds together inwardness and universality. The inner light is not private consolation: it
  illuminates “the whole cosmos” (ⲕⲟⲥⲙⲟⲥ, from Greek kosmos), the ordered world. Yet light that does not
  shine ceases, in effect, to be light; it is darkness. The contrast presses the hearer toward embodiment:
  illumination is known by its radiance, by what it makes visible beyond the self.


  Key Terms


  **ⲙⲁ (ma)** — Place, location, or dwelling; the disciples seek a “where” that the reply reframes.

  **ⲟⲩⲟⲉⲓⲛ (ouoein)** — Light; an inward brightness whose nature is to illumine.

  **ⲣⲱⲙⲉ (rōme)** — Person or human being; here, the bearer of light.

  **ⲕⲟⲥⲙⲟⲥ (kosmos)** — Greek loanword meaning the world or ordered universe.


  Cross-Tradition Resonances


  **Matthew 5:14–16:** Jesus calls his followers the world’s light and urges that their visible goodness
  shine before others. Divergence: Matthew explicitly identifies the light with public deeds that glorify
  the Father, while Thomas locates light within the luminous person and speaks more paradoxically.

  **Qur’an 24:35:** The Light Verse portrays divine light as radiant, self-disclosing, and diffusively
  illuminating. Divergence: The Qur’anic verse centers God as “the Light of the heavens and the earth”;
  this saying speaks of light within a human being.

  **Chāndogya Upaniṣad 8.3.4:** The Upaniṣad describes a light within the person, associated with the
  deepest self and freedom from bodily limitation. Divergence: Its teaching is framed through the identity
  of self and ultimate reality, whereas Thomas makes the decisive issue whether inner light actually illumines
  the cosmos.'
practice: 'At dawn or beside a single candle, sit quietly for five minutes. Breathe slowly and ask, “What
  in me is receiving light, and what can I make more visible for another today?” Then perform one concrete
  clarifying act: tell the truth kindly, offer needed help, or give full attention to someone often overlooked.'
