translation_literal: Jesus said, 'This heaven will pass away, and the one above it will pass away. The
  dead do not live, and the living will not die. On the days when you were eating the dead, you were making
  it alive. When you come to dwell in the light, what will you do? On the day when you were one, you made
  the two. But when you have become two, what will you do?'
commentary: 'The saying begins by stripping even the heavens of permanence. The paired claims that the
  dead do not live and the living will not die are not simply observations about ordinary biological life;
  they overturn the categories by which death and life are usually judged. The middle image makes this
  reversal concrete: what was dead becomes living when it is taken in and transformed. The saying asks
  its hearers to discern a life not secured by the changing cosmos.


  The Coptic ⲟⲩⲁ, “one,” and ⲥⲛⲁⲩ, “two,” frame the final riddle. Light is not merely a future destination
  but the testing place of action: “what will you do?” Division has already occurred within the one, and
  the question presses further rather than supplying a doctrine. The hearer must reckon with doubled existence—self
  and other, inner and outer, life and death—and discover whether unity can be lived without denying difference.


  Key Terms


  **ⲧⲡⲉ** — “heaven”; the cosmic realm, here explicitly subject to passing away.

  **ⲙⲟⲟⲩⲧ** — “dead”; what is lifeless, yet capable of being made living.

  **ⲟⲛϩ** — “live, be alive”; the saying contrasts ordinary mortality with a deeper life.

  **ⲟⲩⲁ / ⲥⲛⲁⲩ** — “one / two”; the numerical terms carrying the final paradox of unity and division.


  Cross-Tradition Resonances


  **Mark 13:31:** Jesus says that heaven and earth will pass away while his words will not pass away,
  paralleling Thomas’s relativizing of the heavens. Divergence: Mark sets enduring words against the cosmos;
  Thomas moves immediately into paradoxes of life, light, and divided unity.

  **1 Corinthians 15:36–37:** Paul uses the image of a seed that dies and then bears life, akin to the
  transformation of “what was dead” into life. Divergence: Paul develops a resurrection argument centered
  on bodily transformation, whereas Thomas gives a compressed saying addressed to present perception and
  action.

  **Chāndogya Upaniṣad 6.8.7:** The formula “That you are” draws the seeker toward an underlying unity,
  resonating with the riddle of being one and becoming two. Divergence: The Upaniṣad identifies the self
  with ultimate being; Thomas leaves the one-and-two relation unresolved and ethically interrogative.'
practice: 'At a meal, pause before the first bite. Notice that what was once living is becoming your life;
  then sit for three quiet minutes, naming one division you carry within yourself and asking, without
  forcing an answer: “In the light, what will I do?”'
