translation_literal: Jesus said, “Often you have longed to hear these words that I am speaking to you,
  and you have no one else from whom to hear them. Days are coming when you will look for me and will
  not find me.”
commentary: 'The saying turns from present access to coming absence. The hearers desire the words now
  being given, yet their desire is shadowed by a warning: this encounter cannot be presumed upon. The
  words are not presented as detachable information; they are speech spoken by this speaker, at this moment,
  to these hearers.


  The verb ⲉⲡⲓⲑⲩⲙⲉⲓ, from Greek epithymein, means to desire or intensely long for. That longing is both
  honored and exposed: they want the teaching, but the future will test whether they truly received it.
  “You will seek me” echoes their earlier desire to hear, while “you will not find me” gives the saying
  its sharp edge. Absence becomes an invitation to attend before the living word is no longer available
  in the same form.


  Key Terms


  **ⲉⲡⲓⲑⲩⲙⲉⲓ** — “to desire, long for”; a Greek-derived verb marking intense yearning.

  **ϣⲁϫⲉ** — “word” or “saying”; here, the spoken teaching given directly to the hearers.

  **ⲕⲉⲟⲩⲁ** — “another person”; the saying stresses that no alternate speaker can supply these words.

  **ϩⲟⲟⲩ** — “days”; the coming days introduce a future reversal from presence to absence.


  Cross-Tradition Resonances


  **John 7:34:** Jesus says, “You will seek me and you will not find me,” making absence a consequence
  of a moment of encounter not rightly received. Divergence: John frames the saying through Jesus’ return
  to the one who sent him, whereas Thomas 38 concentrates on the irreplaceability of the teacher’s present
  speech.

  **Song of Songs 3:1–2:** The lover seeks the beloved by night and does not immediately find him, portraying
  desire as intensified by absence. Divergence: The Song is erotic poetry about beloved and lover, while
  Thomas makes the search a warning concerning hearing and instruction.

  **Dhammapada 276:** The verse urges practitioners to make their own effort, since awakened ones indicate
  the path but do not walk it for others. Divergence: The Dhammapada emphasizes disciplined personal practice
  after guidance, while Thomas 38 emphasizes the unique, unreplaceable voice of the speaker.'
practice: Set aside ten minutes to read one short saying aloud once, then sit without rereading it. Notice
  the impulse to obtain more words; instead, attend to the single phrase that remains and carry it silently
  through one ordinary task.
