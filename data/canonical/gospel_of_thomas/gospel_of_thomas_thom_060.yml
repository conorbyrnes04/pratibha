translation_literal: 'They saw a Samaritan carrying a lamb, going into Judea. He said to his disciples,
  “What is that man doing with the lamb?” They said to him, “He is going to kill it and eat it.” He said
  to them, “While it is alive, he will not eat it; only after he has killed it and it has become a corpse.”
  They said, “Otherwise he cannot do it.” He said to them, “You too: seek a place of rest for yourselves,
  lest you become a corpse and be eaten.”'
commentary: 'The brief roadside scene turns on an unanswerable fact: the lamb cannot be eaten while living.
  It must first be killed, made into a ⲡⲧⲱⲙⲁ (ptōma), a corpse. The disciples register this as ordinary
  necessity; Jesus presses the image inward. Human beings, too, can become available for consumption—reduced
  to lifelessness, exposed to powers that feed on what has fallen.


  His counsel is not simply to flee death but to seek “a place” in ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (anapausis), repose or rest.
  This rest is not passive collapse. It is a place in which one remains alive rather than becoming a ptōma:
  inwardly gathered, unconsumed, and not made into food for the world’s hungers. The saying leaves its
  threat starkly unsoftened, but its imperative is equally plain: find the living rest that keeps you
  from being devoured.


  Key Terms


  **ⲡⲧⲱⲙⲁ (ptōma)** — A Greek loanword meaning a fallen body or corpse, emphasizing death and exposure.

  **ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (anapausis)** — Rest, repose, or relief; here, a place of living refuge.

  **ⲟⲩⲟⲙ** — To eat or consume, the repeated action that frames the saying’s warning.

  **ϣⲓⲛⲉ** — To seek; the disciples are commanded actively to look for their place of rest.


  Cross-Tradition Resonances


  **Matthew 8:20:** Jesus’ saying that the Son of Man has nowhere to lay his head likewise makes “place”
  and rest matters of spiritual urgency rather than comfort. Divergence: Matthew stresses the cost of
  following Jesus, whereas Thomas warns that failure to find living repose leaves one vulnerable to becoming
  a corpse.

  **Hebrews 4:9–11:** Hebrews speaks of a remaining divine rest and urges hearers to enter it with diligence.
  Divergence: Hebrews frames rest through God’s Sabbath promise and faithfulness, while this saying frames
  it through the vivid danger of death and consumption.

  **Dhammapada 270:** The verse teaches that nobility is not attained by harming living beings, echoing
  the unsettling presence of the lamb whose death makes eating possible. Divergence: The Dhammapada gives
  an ethical teaching against harming beings; Thomas uses the slain lamb chiefly as an image for the hearers’
  own condition.'
practice: 'Before one meal this week, pause with both feet on the floor. Breathe slowly for one minute,
  notice the living sources of your food and your own bodily aliveness, then eat without screens or haste.
  End by naming one “place of rest” you will protect that day: silence, sleep, prayer, a boundary, or
  an unhurried walk.'
