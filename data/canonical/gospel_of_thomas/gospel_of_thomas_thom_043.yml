translation_literal: 'His disciples said to him, "Who are you that you say these things to us?" He said
  to them, "From what I say to you, you do not understand who I am. But you have become like the Jews:
  they love the tree, they do not love its fruit; and they love the fruit, they do not love the tree."'
commentary: 'The disciples ask for an identity, but Jesus answers by turning their question back upon
  their hearing. What he says should disclose who he is; their failure is not a lack of information but
  a failure to recognize the relation between the speaker and his speech. To separate the words from the
  one who utters them is like separating fruit from the tree that bears it.


  The image exposes divided judgment: loving the visible result while rejecting its source, or admiring
  the source while refusing what it produces. The term ⲛⲓⲓⲟⲩⲇⲁⲓⲟⲥ, from Greek Ioudaioi, is used here in
  a sharp intra-religious polemic. It should not be turned into a claim about Jewish people generally;
  the saying uses a broad label rhetorically to name a contradiction the disciples themselves are said
  to share.


  Key Terms


  **ⲉⲓⲙⲉ** — to know or recognize; here, knowing Jesus through the meaning of his words.

  **ⲙⲁⲑⲏⲧⲏⲥ** — disciple, from Greek mathētēs; a learner whose hearing is being tested.

  **ⲡϣⲏⲛ** — the tree, the living source from which fruit comes.

  **ⲡⲕⲁⲣⲡⲟⲥ** — the fruit, from Greek karpos; the outcome or manifestation of a source.


  Cross-Tradition Resonances


  **Sirach 27:6:** “The fruit discloses how a tree has been cultivated”; both sayings use fruit to reveal
  what lies behind it. Divergence: Sirach concerns a person’s speech as evidence of character, while Thomas
  stresses the incoherence of accepting one side of the tree-fruit relation while rejecting the other.

  **Matthew 7:17–20:** Jesus teaches that a sound tree bears good fruit and that a tree is known by its
  fruit. Divergence: Matthew offers a criterion for judging prophets and conduct; Thomas uses the image
  to confront the disciples’ failure to recognize the speaker.

  **Qur’an 14:24–26:** The good word is likened to a good tree, firmly rooted and continually bearing
  fruit. Divergence: The Qur’anic image contrasts stable good with uprooted evil, whereas this saying
  focuses on the hearer’s divided attachment to root and result.'
practice: 'Hold a piece of fruit in one hand and touch a tree, plant, or wooden surface with the other.
  For three minutes, ask: “What source do I praise while refusing its consequence? What result do I want
  without receiving its root?” End by naming one concrete act that reconnects the two.'
