sanskrit_devanagari: 'ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲧⲁⲭⲁ ⲉⲩⲙⲉⲉⲩⲉ ⲛ̄ϭⲓⲣ̄ⲣⲱⲙⲉ ϫⲉⲛ̄ⲧⲁⲉⲓⲉⲓ ⲉⲛⲟⲩϫⲉ ⲛ̄ⲟⲩⲉⲓⲣⲏⲛⲏ ⲉϫⲙ̄ⲡⲕⲟⲥⲙⲟⲥ ⲁⲩⲱ
  ⲥⲉⲥⲟⲟⲩⲛ ⲁⲛ ϫⲉⲛ̄ⲧⲁⲉⲓⲉⲓ ⲁⲛⲟⲩϫⲉ ⲛ̄ϩⲛ̄ⲡⲱⲣϫ⳿ ⲉϫⲛ̄ⲡⲕⲁϩ ⲟⲩⲕⲱϩⲧ ⲟⲩⲥⲏϥⲉ⳿ ⲟⲩⲡⲟⲗⲉⲙⲟⲥ ⲟⲩⲛ̄ϯⲟⲩ ⲅⲁⲣ ⲛⲁϣⲱ

  [ⲡⲉ] ϩⲛ̄ⲟⲩⲏⲉⲓ ⲟⲩⲛ̄ϣⲟⲙⲧ ⲛⲁϣⲱⲡⲉ ⲉϫⲛ̄ⲥⲛⲁⲩ ⲁⲩⲱ ⲥⲛⲁⲩ ⲉϫⲛ̄ϣⲟⲙⲧ⳿ ⲡⲉⲓⲱⲧ⳿ ⲉϫⲙ̄ⲡϣⲏⲣⲉ ⲁⲩⲱ ⲡϣⲏⲣⲉ ⲉϫⲙ̄ⲡⲉⲓⲱⲧ⳿ ⲁⲩⲱ
  · ⲥⲉⲛⲁⲱϩⲉ ⲉⲣⲁⲧⲟⲩ ⲉⲩⲟ ⲙ̄'
translation_literal: 'Jesus said, “Perhaps people think that I have come to cast peace upon the world,
  and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there
  will be five in a house: three will be against two, and two against three; father against son, and son
  against father. And they will stand, being …”'
commentary: 'The saying overturns the expectation that Jesus’ arrival simply settles the world into peace.
  The repeated verb “cast” gives the announcement force: what is thrown upon the earth is not social ease
  but ⲡⲱⲣϫ, “division” or “separation.” Fire, sword, and war name the sharp consequences of disclosure;
  they need not commend violence so much as describe the upheaval caused when loyalties are exposed and
  rearranged.


  The household, ordinarily a place of protection and inherited allegiance, becomes the immediate site
  of rupture. The uneven number—five, divided three against two and two against three—suggests no clean
  division between righteous and unrighteous camps. The final phrase breaks off after “being …” (ⲉⲩⲟ ⲙ̄),
  leaving the readers before an unfinished identity. The fragment itself makes the saying stark: those
  caught in this division must stand without the security of settled family consensus.


  Key Terms


  **ⲡⲱⲣϫ** — Division, separation, or splitting apart; the central disruptive action of the saying.

  **ⲉⲓⲣⲏⲛⲏ** — Peace, a Greek-derived term (εἰρήνη) here set against the expectation of easy harmony.

  **ⲕⲱϩⲧ** — Fire; an image of testing, destruction, or fierce transformation.

  **ⲥⲏϥⲉ** — Sword; a figure for severance and conflict.


  Cross-Tradition Resonances


  **Matthew 10:34–36:** Matthew likewise has Jesus deny that he has come to bring peace and depicts familial
  opposition arising around him. Divergence: Matthew explicitly says “sword” and quotes household hostility
  in a fuller prophetic frame, whereas Thomas stresses the five-person division and ends in a lacuna.

  **Luke 12:51–53:** Luke presents Jesus as bringing division and gives the same pattern of five people
  in one household divided three against two. Divergence: Luke frames the division through explicit family
  pairings and eschatological warning; Thomas compresses the scene into a more aphoristic, unfinished
  saying.

  **Micah 7:6:** Micah portrays a time of social collapse in which kin turn against kin and a person’s
  enemies are members of the household. Divergence: Micah laments communal corruption and calls for trust
  in God, while Thomas attributes household division to the disruptive arrival of Jesus’ message.'
practice: Name one loyalty that keeps you from speaking or living truthfully. Sit silently for five minutes,
  feel where that loyalty is held in the body, and write one nonviolent, concrete act of honest speech
  or boundary-setting you can undertake this week.
