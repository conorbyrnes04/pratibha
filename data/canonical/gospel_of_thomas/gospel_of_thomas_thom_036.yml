sanskrit_devanagari: 'ⲡⲉϫⲉⲓ︤ⲥ︥ ⲙⲛ̄ ϫⲓ

  (ⲛ)ϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ ⲁⲩⲱ ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ ϫⲉⲟⲩ ⲡⲉ⟨ⲧ⟩ⲉⲧⲛⲁⲧⲁⲁϥ ϩⲓⲱⲧ⳿ⲧⲏⲩⲧⲛ̄'
translation_literal: Jesus said, 'Do not worry from morning to evening and from evening to morning about
  what you will wear.'
commentary: 'The saying encloses the whole turning of a day: morning to evening, then evening back to
  morning. Anxiety is not merely a passing thought here; it is a habit that can occupy every interval
  of life. Jesus’ imperative interrupts that cycle, directing attention away from the next covering to
  be acquired or secured.


  The final phrase concerns what one will “put on” oneself, making clothing more than a practical necessity.
  Garments can signify status, protection, and the self one presents to others. The saying does not deny
  bodily need; it refuses to let anticipated need rule the heart. Its spare wording leaves the hearer
  in the present moment, uncovered before God and unburdened by tomorrow’s imagined demands.


  Key Terms


  **ⲙⲛ̄** — A negating imperative: “do not,” introducing Jesus’ prohibition.

  **ϩⲧⲟⲟⲩⲉ** — “Morning,” the first boundary in the saying’s full daily cycle.

  **ⲣⲟⲩϩⲉ** — “Evening,” paired with morning to express continual time.

  **ⲧⲁⲁϥ ϩⲓⲱⲧⲏⲩⲧⲛ̄** — “Put on yourselves,” referring concretely to clothing and suggestively to self-presentation.


  Cross-Tradition Resonances


  **Matthew 6:25–34:** Jesus likewise forbids anxious concern over food and clothing and directs attention
  to God’s care for creatures and fields. Divergence: Matthew expands the saying with examples, an argument
  from creation, and the command to seek God’s kingdom; Thomas gives only the concentrated prohibition.

  **Bhagavad Gita 2.47:** The Gita counsels action without anxious attachment to its results, loosening
  the grip of future-oriented concern. Divergence: The Gita addresses attachment to the fruits of one’s
  work, whereas this saying specifically names anxiety over bodily covering.

  **Qur’an 65:2–3:** The passage joins trust in God with the assurance that God provides from unexpected
  places. Divergence: The Qur’anic verses frame trust amid obedience, divorce regulations, and provision,
  while Thomas offers an unelaborated saying about daily worry.'
practice: At morning and evening, hold one garment in your hands, breathe slowly three times, and name
  one practical need for the next day. Then say, “This need is real; it need not rule me,” and take one
  simple necessary step without rehearsing every possible outcome.
