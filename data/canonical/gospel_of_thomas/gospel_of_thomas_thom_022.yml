translation_literal: Jesus saw some little children being nursed. He said to his disciples, “Will these
  little children who are nursing enter the kingdom?” They said to him, “Then shall we enter as little
  children?” Jesus said to them, “When you make the two one, and make the inner like the outer and the
  outer like the inner, and the upper like the lower; when you make male and female into a single one,
  so that the male is not male and the female not female; when you make eyes in the place of an eye, and
  a hand in the place of a hand, and a foot in the place of a foot, and an image in the place of an image—then
  you will enter [the kingdom].”
commentary: 'The nursing children provoke a question about entry into the kingdom, but Jesus does not
  simply commend innocence or infancy. His reply describes a radical unifying work: inner and outer, above
  and below, male and female are no longer held as oppositions that fragment the person. To become “one”
  is not to erase bodily realities but to cease living from dividedness, false display, and rivalry between
  poles.


  The final sequence is deliberately strange: eye for eye, hand for hand, foot for foot, and “image” for
  image. The last word, ⲉⲓⲕⲱⲛ (Greek εἰκών), means an image, likeness, or representation. In this setting
  it suggests restored correspondence: perception, action, movement, and one’s visible form are brought
  into truthful alignment. Entry is thus portrayed not as escape from the world, but as becoming undivided—an
  integrated likeness in which what is within and what is enacted no longer contradict one another.


  Key Terms


  **ⲕⲟⲩⲉⲓ** — little children; the nursing infants who prompt the disciples’ question.

  **ⲟⲩⲁ ⲟⲩⲱⲧ** — one single unity; a phrase of gathered, undivided existence.

  **ϩⲟⲩⲛ / ⲃⲟⲗ** — within / without; the paired terms for inward and outward reality.

  **ⲉⲓⲕⲱⲛ** — image, likeness, or representation; a Greek loanword (εἰκών).


  Cross-Tradition Resonances


  **Galatians 3:28:** Paul declares that in Christ there is “no male and female,” similarly locating a
  new communal identity beyond status-defining divisions. Divergence: Galatians frames this unity through
  baptismal belonging in Christ, whereas Thomas presents it as a paradoxical transformation required for
  entry into the kingdom.

  **Genesis 1:27:** Humanity is made in God’s image as male and female, making Thomas’s language of male,
  female, and image especially resonant with creation-language. Divergence: Genesis affirms the paired
  differentiation of humanity, while this saying presses toward a unity in which gendered opposition no
  longer governs the self.

  **Mark 10:14–15:** Jesus receives children and says that the kingdom must be received as a child receives
  it. Divergence: Mark emphasizes receptive dependence, while Thomas uses nursing children as the occasion
  for a teaching about the reconciliation of contraries.'
practice: Stand quietly for five minutes. With one hand resting on your chest and the other open before
  you, breathe slowly and name inwardly one gap between what you feel and what you show. Then choose one
  small outward act today—an honest word, a repaired obligation, or an unperformed kindness—that brings
  the inner and outer closer together.
