  ⲛ̄ϣⲗ︦ⲧⲁⲙ ⟨ⲥ⟩ⲥⲟⲃ︤ⲕ︥ ⲡⲁⲣⲁⲛ̄ϭⲣⲟϭ ⲧⲏⲣⲟⲩ ϩⲟⲧⲁⲛ ⲇⲉ ⲉⲥϣⲁ

  (ⲛ)ϩⲉ ⲉϫⲙ̄ⲡⲕⲁϩ ⲉⲧⲟⲩ ⲉⲣⲟϥ ϣⲁϥⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛ̄ⲛⲟⲩⲛⲟϭ ⲛ̄ⲧⲁⲣ ⲛ̄ϥ ⲛ̄ⲥⲕⲉⲡⲏ ⲛ̄ϩⲁⲗⲁⲧⲉ ⲛ̄ⲧⲡⲉ'
translation_literal: 'The disciples said to Jesus, “Tell us: to whom is the kingdom of heaven comparable?”
  He said to them, “It is like a mustard seed, smaller than all seeds. But when it falls on worked soil,
  it puts forth a great branch and becomes a shelter for the birds of heaven.”'
commentary: 'The image begins with disproportion: the mustard seed is minute, yet its end is not merely
  survival or increase. In receptive, cultivated earth it sends out a “great branch” and becomes shelter.
  The kingdom is thus portrayed less as a spectacle descending from above than as a living power whose
  largeness emerges from an almost dismissible beginning.


  The phrase “worked soil” matters. Growth is given, but the ground is not inert; it has been prepared.
  The final image also shifts the focus from the plant itself to those who find refuge in it: the birds
  of heaven. The kingdom’s maturity is recognizable in its capacity to make room. The Greek loanword ⲙⲁⲑⲏⲧⲏⲥ,
  “disciple,” frames the question: learners are invited to perceive greatness not in display, but in patient
  growth that becomes protection for others.


  Key Terms


  **ⲃⲗⲃⲓⲗⲉ** — mustard seed; an image of radical smallness and latent vitality.

  **ⲙⲁⲑⲏⲧⲏⲥ** — disciple, a Greek loanword (μαθητής) meaning learner or student.

  **ⲕⲁϩ** — earth or ground; here, soil prepared for receiving the seed.

  **ⲥⲕⲉⲡⲏ** — shelter, cover, or protection; the mature plant becomes refuge.


  Cross-Tradition Resonances


  **Mark 4:30–32:** Jesus compares God’s kingdom to a mustard seed that grows from smallness into a plant
  spacious enough for birds to nest in its shade. Divergence: Mark emphasizes the seed’s growth among
  garden plants, while Thomas specifically highlights its falling on worked soil and becoming shelter.

  **Matthew 13:31–32:** Matthew likewise presents the mustard seed as tiny at sowing yet grown into a
  tree-like refuge for birds. Divergence: Matthew calls it the smallest of seeds and the greatest of plants;
  Thomas’s wording centers more sharply on cultivation and the emergence of a great branch.

  **Ezekiel 17:22–24:** Ezekiel’s planted cedar grows high, and every kind of bird dwells in the shade
  of its branches, making sheltering vegetation a sign of divine restoration. Divergence: Ezekiel’s image
  concerns Israel’s royal renewal through a lofty cedar, whereas Thomas begins with an ordinary mustard
  seed and depicts growth from hidden minuteness.'
practice: 'Plant a small seed in soil, preparing the earth with your hands. Each day for a week, water
  it and ask: “Where can my small, steady act become shelter for someone else?” Then perform one quiet
  act of practical welcome.'
