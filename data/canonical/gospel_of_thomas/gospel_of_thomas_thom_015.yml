translation_literal: Jesus said, “When you see the one not born from a woman, throw yourselves facedown
  and worship him. He is your Father.”
commentary: 'The saying turns on a startling recognition: the true Father is identified as the one who
  has no human maternal origin. The phrase ⲡⲉⲧⲉⲙⲡⲟⲩϫⲡⲟϥ ⲉⲃⲟⲗ ϩⲛ̄ⲧⲥϩⲓⲙⲉ, “the one not born from a woman,”
  does not explain who this figure is. Its force is negative and apophatic: the Father cannot be located
  within ordinary human generation.


  The response is bodily and unguarded. ⲡⲉϩⲧ⳿ⲧⲏⲩⲧⲛ̄ calls the hearers to cast themselves upon their faces,
  while ⲟⲩⲱϣⲧ means to bow in worship. Recognition here is not mere insight but a reorientation of the
  whole person. The one beyond birth is not an abstract principle; he is named “your Father,” intimate
  in relation while exceeding every familiar source of life.


  Key Terms


  **ⲙ̄ⲡⲟⲩϫⲡⲟϥ** — “not born”: a denial of ordinary human begetting or birth.

  **ⲡⲉϩⲧ⳿ⲧⲏⲩⲧⲛ̄** — “throw yourselves down”: an imperative of full, face-down prostration.

  **ⲟⲩⲱϣⲧ** — “worship”: reverent bodily homage offered to the divine.

  **ⲉⲓⲱⲧ** — “father”: the source and intimate origin of the hearers.


  Cross-Tradition Resonances


  **Exodus 3:1–6:** Moses encounters the holy presence, hides his face, and responds with fear before
  the God who cannot be domesticated. Divergence: Exodus narrates a named encounter with Israel’s God
  in the burning bush; Thomas gives no scene or name, only the criterion of being beyond woman-born origin.

  **John 8:58:** Jesus’ “Before Abraham came to be, I am” likewise points beyond ordinary temporal and
  genealogical identity. Divergence: John places the claim on Jesus’ lips about himself, whereas this
  saying directs worship toward the one called “your Father.”

  **Bhagavad Gita 2.20:** The Gita describes the deepest self as unborn and undying, not exhausted by
  bodily birth and death. Divergence: The Gita speaks chiefly of the enduring atman, while Thomas speaks
  of a transcendent Father who is to be worshiped.'
practice: Stand quietly for one minute, then kneel or lie face-down if physically able. Breathe slowly
  and name the sources that have formed you—family, memory, body, culture—then rest in silence before
  the Source you cannot possess or picture.
