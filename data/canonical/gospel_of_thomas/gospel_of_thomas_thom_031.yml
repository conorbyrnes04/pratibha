sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ⲙⲛ̄ ϣⲏⲡ · ϩⲙ̄ⲡⲉϥϯⲙⲉ ⲙⲁⲣⲉⲥⲟⲉⲓⲛ ⲛ̄ⲛⲉⲧ⳿ⲥⲟⲟⲩⲛ ⲙ̄ⲙⲟϥ⳿
translation_literal: Jesus said, 'No prophet is accepted in his own village; no physician heals those
  who know him.'
commentary: 'The saying places prophet and physician beside one another: each bears something needed,
  yet each stands within the difficult field of recognition. The prophet’s village has no prophet—not
  necessarily because prophecy is absent, but because habitual nearness makes the prophetic person unreadable.
  What is too familiar may cease to be seen.


  The second sentence is phrased with ⲙⲁⲣⲉ, an exhortative form: “let [a] physician heal.” It turns the
  image from rejection toward a test of healing among those who know the healer. Knowledge can be an obstacle,
  but it is also the very place where healing must be attempted: amid history, assumptions, and intimacy.


  Key Terms


  **ϣⲏⲡ** — prophet; one who speaks or appears with a message beyond ordinary expectation.

  **ϯⲙⲉ** — village or town; the close local world of belonging and familiarity.

  **ⲙⲁⲣⲉ** — “let ...”; an exhortative form that gives the second sentence its imperative force.

  **ⲥⲟⲉⲓⲛ** — physician; a healer whose work is directed toward those before him.


  Cross-Tradition Resonances


  **Mark 6:4:** Jesus says that a prophet is without honor in his hometown, among relatives, and in his
  own house. Divergence: Mark explicitly names dishonor and familial rejection, whereas this saying tersely
  states the prophet’s absence from the village.

  **Luke 4:23–24:** Jesus joins the proverb about a physician healing himself to the claim that no prophet
  is welcomed in his native place. Divergence: Luke uses the physician image as a challenge directed at
  Jesus; this saying addresses the physician’s healing of those who know him.

  **Sirach 38:1:** Sirach urges hearers to honor the physician because healing is needed and comes through
  God’s provision. Divergence: Sirach commends the healer’s social dignity, while this saying probes the
  strain placed on healing by personal familiarity.'
practice: Choose one person you think you already understand. In a ten-minute conversation, ask one sincere
  question, do not interpret or correct their answer, and afterward name one thing you had failed to notice.
