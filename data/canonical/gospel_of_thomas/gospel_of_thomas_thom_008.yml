translation_literal: 'And he said: “A person is like a wise fisherman who cast his net into the sea. He
  drew it up from the sea, filled with small fish. Among them he found one large, fine fish. The fisherman
  threw all the small fish back into the sea and chose the large fish without trouble. Whoever has ears
  to hear should hear.”'
commentary: 'The image turns on patient discernment rather than abundance. The net comes up full, yet
  the fisher does not cling to a crowded catch. He recognizes the one fish that matters and releases the
  rest. The saying does not explain what the great fish signifies; it trains the hearer to notice the
  difference between mere quantity and what is truly worth choosing.


  The sea, ⲑⲁⲗⲁⲥⲥⲁ, is a Greek loanword (thalassa), an open and teeming expanse from which mixed things
  are drawn. The fisher’s decisive act is ⲥⲱⲧⲡ, “to choose.” He chooses “without trouble” (ⲭⲱⲣⲓⲥ ϩⲓⲥⲉ):
  freedom comes not only in finding what is good, but in releasing lesser claims without resentment. The
  closing call to hear makes this a demand for practiced perception, not simply a fishing lesson.


  Key Terms


  **ⲣⲙⲛϩⲏⲧ** — wise or discerning person; one who acts with understanding.

  **ⲑⲁⲗⲁⲥⲥⲁ** — sea, from Greek thalassa; the vast place of mixed and abundant possibilities.

  **ⲥⲱⲧⲡ** — to choose or select; the fisher’s central act of discernment.

  **ⲭⲱⲣⲓⲥ ϩⲓⲥⲉ** — without trouble or distress; letting go without inward agitation.


  Cross-Tradition Resonances


  **Matthew 13:45–46:** The merchant recognizes one pearl of surpassing value and gives himself wholly
  to obtaining it, like the fisher’s preference for the one fine fish. Divergence: Matthew’s merchant
  sells everything to acquire the pearl, while Thomas’s fisher simply returns the lesser fish to the sea.

  **Matthew 13:47–48:** Both sayings use a net drawn from the sea and distinguish what is valuable from
  a mixed catch. Divergence: Matthew frames the sorting as an eschatological separation by angels, whereas
  this saying portrays a wise individual’s present act of discernment.

  **Dhammapada 348:** “Let go of the past, let go of the future, let go of the present”: both texts commend
  a release that is not ruled by grasping. Divergence: The Dhammapada directs release toward liberation
  from all attachment, while Thomas’s fisher releases many things in order to retain one excellent thing.'
practice: Place several small objects on a table and choose one that represents what most deserves your
  attention today. Hold it for one full minute in silence; then deliberately put the others away, naming
  aloud what you are releasing for this day.
