unit_type: logion
sanskrit_devanagari: 'ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϣⲱⲡⲉ ⲉⲧⲉⲧⲛⲣ̄

  ⲡⲁⲣⲁⲅⲉ'
translation_literal: Jesus said, “Be those who pass through.”
commentary: 'The saying is almost bare enough to be missed. Jesus does not command flight from the world,
  nor does he name a destination. He calls his hearers to a manner of being: to move through what they
  encounter without fastening the self to it as permanent possession or final home.


  The final word, ⲡⲁⲣⲁⲅⲉ, is a Greek-derived term connected with passing by or going along. Its brevity
  gives the saying its force: disciples are not defined by what they accumulate, defend, or settle into,
  but by a freedom to continue onward. The logion can therefore sound both unsettling and liberating:
  cherish what is given, yet do not mistake any passing thing for the whole.


  Key Terms


  **ϣⲱⲡⲉ** — “Become” or “be”: an imperative of becoming, not merely a description.

  **ⲉⲧⲉⲧⲛ** — “You” plural: the summons addresses a gathered community as well as individuals.

  **ⲡⲁⲣⲁⲅⲉ** — A Greek-derived word for passing along or passing by; one who is not fixed in place.


  Cross-Tradition Resonances


  **Hebrews 13:14:** “Here we have no lasting city” similarly portrays the faithful as oriented beyond
  settled earthly security. Divergence: Hebrews explicitly contrasts the present city with a city to come,
  while Thomas 42 gives no named future destination.

  **1 Peter 2:11:** The letter addresses believers as “sojourners and exiles,” urging a life not wholly
  conformed to surrounding desires. Divergence: 1 Peter frames this transience within ethical struggle
  and communal witness; Thomas gives only the compressed imperative to pass through.

  **Bhagavad Gita 2.71:** The Gita praises one who moves without possessiveness, relinquishing the claims
  of “mine” and “I.” Divergence: The Gita places detachment within disciplined action and devotion, whereas
  this logion offers no account of action, deity, or cosmic duty.'
practice: Take a slow ten-minute walk without purchasing, photographing, or checking a device. Notice
  three things you would normally claim, judge, or retain; with each breath, silently say, “I pass through.”
