translation_literal: Jesus said to them, “If you fast, you will bring sin upon yourselves; and if you
  pray, they will condemn you; and if you give alms, you will do harm to your spirits. When you enter
  any land and travel through the regions, if they receive you, eat whatever they set before you. Heal
  the sick among them. For what goes into your mouth will not defile you; rather, what comes out of your
  mouth—that is what will defile you.”
commentary: 'The saying begins with a striking reversal of familiar acts of devotion. Fasting, prayer,
  and almsgiving are not condemned as such so much as stripped of any automatic claim to righteousness.
  Performed as public religious capital, they can generate sin, judgment, and injury to the spirit. The
  sharpness forces attention away from visible piety toward the quality and consequence of one’s life.


  The instruction for traveling disciples is correspondingly practical: accept welcome, eat what is offered,
  and heal. The Greek loanword ⲭⲱⲣⲁ, “region” or “district,” gives the mission an ordinary geographic
  concreteness. Hospitality is not to be tested by dietary anxiety. The final contrast relocates defilement
  from food entering the mouth to what issues from it: speech exposes and enacts the condition of the
  person. The healer’s open table and the disciplined mouth belong together.


  Key Terms


  **ⲛⲟⲩⲛⲟⲃⲉ** — sin; here, something fasting can perversely produce rather than remove.

  **ⲙⲡⲛⲁ** — spirit; the inward life that can be harmed by misdirected almsgiving.

  **ⲭⲱⲣⲁ** — region, district, or countryside; a Greek loanword for the places through which disciples
  travel.

  **ⲧⲁⲡⲣⲟ** — mouth; the site of both receiving food and releasing defiling speech.


  Cross-Tradition Resonances


  **Mark 7:15:** Jesus likewise says that what enters from outside cannot defile a person, while what
  comes out does. Divergence: Mark develops the saying through a dispute about purity traditions; Thomas
  joins it to itinerant hospitality and healing.

  **Isaiah 58:6-7:** Isaiah rejects empty fasting and directs devotion toward liberation, feeding, and
  sheltering others. Divergence: Isaiah renews the practice of fasting through justice, whereas this saying
  speaks more radically of fasting itself as capable of producing sin.

  **Didache 1.3-5:** The Didache ties generosity and moral instruction to concrete treatment of others,
  rather than to religious display alone. Divergence: The Didache gives detailed communal rules for almsgiving,
  while Thomas warns that almsgiving may damage the spirit.'
practice: 'At one shared meal this week, receive what is offered without complaint or superiority. Before
  speaking, pause once and ask: “Will what leaves my mouth heal, burden, or diminish someone?” Choose
  one sentence that is truthful and restorative.'
