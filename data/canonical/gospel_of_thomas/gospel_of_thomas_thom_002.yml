translation_literal: Jesus said, “Let the one who seeks not stop seeking until he finds. When he finds,
  he will be shaken; and when he is shaken, he will …, and he will … over the …”
commentary: 'The saying makes seeking a discipline of endurance: the seeker is not to grow slack (ⲗⲟ)
  before finding. Yet finding is not depicted as immediate comfort. It first brings ⲥⲧⲟⲣⲧⲣ, disturbance
  or inward shaking. What is found overturns the seeker’s settled measures.


  The supplied Coptic breaks off after the future phrases ⲫⲛⲁ, “he will,” and again after ⲉϫⲙ̄ⲡ, “over
  the ….” Rather than supplying a familiar completion, this translation leaves the ending open. On the
  surviving wording, discovery leads through destabilization toward an unnamed further condition and an
  unnamed scope of mastery; the sentence itself leaves the reader in the work of seeking.


  Key Terms


  **ⲗⲟ** — to cease, become slack, or desist; the seeker must not abandon the search.

  **ϣⲓⲛⲉ** — to seek or search for, implying sustained, active inquiry.

  **ϭⲓⲛⲉ** — to find or discover; the sought reality is encountered rather than merely inferred.

  **ϣⲧⲟⲣⲧⲣ** — to be disturbed, troubled, or shaken; discovery unsettles before it yields its further
  fruit.


  Cross-Tradition Resonances


  **Matthew 7:7:** “Seek, and you will find” similarly joins active searching with the promise of discovery.
  Divergence: Matthew frames seeking alongside asking and knocking before a responsive heavenly giver;
  this saying concentrates on the seeker’s inner upheaval after finding.

  **Jeremiah 29:13:** The prophetic promise that those who seek with the whole heart will find God parallels
  the saying’s confidence in persevering search. Divergence: Jeremiah names the object of search as the
  Lord and situates it within covenantal restoration; Thomas leaves the object unnamed.

  **Plato, Republic 515c–516a:** The prisoner’s ascent from the cave is painful and disorienting, much
  like the disturbance that follows discovery here. Divergence: Plato presents a philosophical ascent
  toward the Good through education; this saying gives no cosmology or pedagogical program, only a compressed
  sequence of seeking and shock.'
practice: Set aside ten quiet minutes. Hold one sincere question without trying to solve it; when discomfort,
  impatience, or certainty arises, name it silently as “shaking,” return to the question, and end without
  forcing a conclusion.
