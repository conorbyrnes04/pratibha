sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ ⲡⲉ ⲡⲣⲱⲙⲉ ⲛ̄ⲧⲁϩϩⲓⲥⲉ ⲁϥϩⲉ ⲁⲡⲱⲛϩ
translation_literal: Jesus said, “Blessed is the person who has toiled and has found life.”
commentary: 'The saying gives no account of what the person has labored at, nor does it describe the life
  found. Its force lies in the movement from exertion to discovery: toil is not itself the blessing; the
  blessing belongs to the one whose labor arrives at life. The compact phrasing makes life appear not
  as a wage mechanically earned, but as a reality encountered after sustained seeking.


  The opening word, ⲙⲁⲕⲁⲣⲓⲟⲥ (Greek makarios), names one who is deeply fortunate, graced, or truly flourishing.
  The verb ⲛ̄ⲧⲁϩϩⲓⲥⲉ, “who has toiled,” suggests wearisome effort rather than a passing inconvenience.
  Yet the final word, ⲡⲱⲛϩ, “life,” outweighs the strain: the saying directs attention beyond ease toward
  the life that is found through persevering search.


  Key Terms


  **ⲙⲁⲕⲁⲣⲓⲟⲥ** — “Blessed” or “fortunate,” a Greek loanword for profound flourishing.

  **ⲣⲱⲙⲉ** — “Person” or “human being.”

  **ϩⲓⲥⲉ** — To labor, struggle, or undergo exhausting effort.

  **ⲡⲱⲛϩ** — “Life,” the reality discovered at the saying’s end.


  Cross-Tradition Resonances


  **Matthew 11:28:** Jesus invites those who labor and are burdened to come to him for rest, pairing human
  weariness with a gift beyond it. Divergence: Matthew stresses rest received from Jesus, whereas Thomas
  58 blesses the one who has toiled and found life.

  **James 1:12:** James calls blessed the person who endures testing and receives the crown of life. Divergence:
  James explicitly frames endurance as fidelity under trial and promises a future crown; Thomas leaves
  both the labor and the finding unspecified.

  **Dhammapada 276:** The verse urges persistent striving, since the awakened ones show the way but each
  person must undertake the effort. Divergence: The Dhammapada directs effort toward release from Māra
  and suffering, while Thomas names the goal simply as life.'
practice: Choose one necessary but resisted task today. Work at it for twenty undistracted minutes, noticing
  fatigue without dramatizing it; afterward sit quietly for two minutes and ask, “What kind of life am
  I seeking in this effort?”
