translation_literal: His disciples said, “On what day will you reveal yourself to us, and on what day
  shall we see you?” Jesus said, “When you strip yourselves without shame, take your garments, lay them
  beneath your feet like small children, and tread on them—then you will see the Son of the Living One,
  and you will not be afraid.”
commentary: 'The disciples ask for a date of disclosure, but Jesus answers with no calendar. Revelation
  is not deferred to a future moment; it is bound to a stripping-away. Shame, garments, and fear form
  a single cluster: the self that must be covered and socially presented cannot yet see clearly.


  The verb ⲧⲟⲡϫⲡ, “trample,” makes the image sharper than mere renunciation. The garments are not simply
  removed but placed underfoot, as though inherited identities, status-markers, and protections must lose
  their authority. Yet the model is “small children,” not heroic ascetics. Their uncalculated lack of
  shame evokes an undivided presence. The “Son of the Living One” becomes visible where fear no longer
  governs perception.


  Key Terms


  **ⲛ̄ϣⲓⲡⲉ** — “without shame”; freedom from the self-consciousness that conceals and fears judgment.

  **ⲛⲉⲧⲛ̄ϣⲧⲏⲛ** — “your garments”; coverings that can suggest social identity, protection, or constructed
  persona.

  **ⲧⲟⲡϫⲡ** — “to trample”; an active placing-underfoot rather than a merely inward detachment.

  **ⲡϣⲏⲣⲉ ⲙ̄ⲡⲉⲧⲟⲛϩ** — “the Son of the Living One”; a title locating Jesus in relation to the living God.


  Cross-Tradition Resonances


  **Genesis 2:25:** The first humans are naked and unashamed, a condition Thomas recalls as an image of
  unfractured existence. Divergence: Genesis presents this as primordial innocence, while Thomas makes
  it a deliberate act of liberation and recognition.

  **Mark 10:14–15:** Jesus receives children as exemplary participants in God’s reign, paralleling Thomas’s
  appeal to little children. Divergence: Mark stresses receptive entry into the kingdom; Thomas joins
  childlikeness to stripping, trampling garments, and seeing Jesus.

  **Galatians 3:27:** Paul also uses clothing as a spiritual image: believers are “clothed” with Christ.
  Divergence: Paul’s metaphor gives a new garment, whereas Thomas imagines laying old garments beneath
  one’s feet.'
practice: Set aside ten minutes to remove one ordinary outer layer—a coat, shoes, or scarf—in private
  silence. Place it on the floor, stand beside it, and name one role or fear it represents. Step over
  it once, then sit quietly and breathe without trying to improve or defend yourself.
