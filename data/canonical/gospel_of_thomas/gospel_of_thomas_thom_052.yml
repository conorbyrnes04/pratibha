translation_literal: His disciples said to him, “Twenty-four prophets spoke in Israel, and every one of
  them spoke about you.” He said to them, “You have set aside the one who is alive before you, and you
  speak about the dead.”
commentary: 'The disciples frame Jesus through inherited authority: the twenty-four prophets of Israel
  have, in their view, already testified to him. Their claim is not rejected as false so much as exposed
  as insufficient. It can become a way of directing attention away from the person standing before them.
  Prophetic memory is valuable, but it cannot substitute for encounter.


  Jesus contrasts “the living one” (ⲡⲉⲧⲟⲛϩ) with “the dead” (ⲛⲉⲧⲙⲟⲟⲩⲧ). The sharpness lies in the disciples’
  failure to recognize life as present: they leave aside, or neglect, the living reality “before” them
  (ⲙⲙⲁⲩ ⲉⲃⲟⲗ), while their speech remains occupied with those who have died. The saying does not necessarily
  dismiss the prophets; it warns that even sacred interpretation can evade the demand of a living presence.


  Key Terms


  **ⲡⲉⲧⲟⲛϩ** — “the living one,” the present figure whom the disciples fail to attend to.

  **ⲙⲁⲑⲏⲧⲏⲥ** — “disciple,” a Greek loanword (μαθητής) meaning learner or pupil.

  **ⲡⲣⲟⲫⲏⲧⲏⲥ** — “prophet,” a Greek loanword (προφήτης), here referring to Israel’s prophetic inheritance.

  **ⲛⲉⲧⲙⲟⲟⲩⲧ** — “the dead ones,” those discussed as past rather than encountered as living.


  Cross-Tradition Resonances


  **Mark 7:8:** Jesus warns that holding tightly to inherited human tradition can mean releasing God’s
  immediate command. Divergence: Mark’s concern is contested religious practice, whereas Thomas 52 contrasts
  speech about ancestral prophets with recognition of the living one present.

  **Jeremiah 7:4:** Jeremiah challenges reliance on a sacred formula and calls hearers to face the actual
  moral claim of God in their midst. Divergence: Jeremiah addresses false security in the temple; this
  saying focuses on the disciples’ displaced attention from Jesus to prophetic memory.

  **Zen saying, attributed to Linji: “If you meet the Buddha, kill the Buddha.”:** The provocation warns
  against clinging to a conceptual or inherited Buddha instead of awakening directly. Divergence: Linji
  attacks attachment even to religious images, while Thomas preserves a decisive focus on the living one
  standing before the disciples.'
practice: For ten minutes, sit without reading or quoting any spiritual source. Notice one living reality
  directly before you—a person, breath, sound, or ordinary task—and name silently the ways memory or interpretation
  distracts you from attending to it.
