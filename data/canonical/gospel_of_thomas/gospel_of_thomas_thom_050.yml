  [ⲉ ⲉⲣⲁⲧϥ] ⲁⲩⲱ ⲁϥⲟⲩⲱⲛϩ ⲉ

  [ⲃ]

  ⲟⲗ ϩⲛ̄ⲧⲟⲩϩⲓⲕⲱⲛ ϫⲟⲟⲥ ⲛⲏⲧⲛ̄ ϫⲉⲛ̄ⲧⲱⲧⲛ̄ ⲡⲉ ϫⲟⲟⲥ ϫⲉⲁⲛⲟⲛ ⲛⲉϥϣⲏⲣⲉ ⲁⲩⲱ ⲁⲛⲟⲛ ⲛ̄ⲥⲱⲧⲡ⳿ ⲙ̄ⲡⲉⲓⲱⲧ ⲉⲧⲟⲛϩ ⲉⲩϣⲁⲛϫⲛⲉⲧⲏⲩⲧⲛ̄
  ϫⲉⲟⲩ ⲡⲉ ⲡⲙⲁⲉⲓⲛ ⲙ̄ⲡⲉⲧⲛ̄ⲉⲓⲱⲧ ⲉⲧϩⲛ̄ⲧⲏⲩⲧⲛ̄ ϫⲟⲟⲥ ⲉⲣⲟⲟⲩ ϫⲉⲟⲩⲕⲓⲙ ⲡⲉ ⲙⲛ̄ⲟⲩⲁⲛⲁⲡⲁⲩⲥⲓⲥ'
translation_literal: Jesus said, 'If they say to you, "Where did you come from?" say to them, "We came
  from the Light, the place where the Light came into being on its own accord. It stood and manifested
  itself in its image." If they say to you, "Is it you?" say, "We are its sons, and we are the elect of
  the living Father." If they ask you, "What is the sign of your Father in you?" say to them, "It is movement
  and rest."'
commentary: 'The saying gives its hearers words for a searching question: where do you come from, and
  who are you? Their origin is not framed as a social pedigree or earthly homeland, but as the Light.
  This Light “came to be through itself,” then stood and became manifest. The language presents a source
  that is self-grounded rather than derived, yet able to appear in an image. The plural possessive in
  ⲧⲟⲩϩⲓⲕⲱⲛ (“their image”) remains suggestive: manifestation is not merely private illumination but appears
  in a shared, recognizable form.


  The final answer turns from origin to evidence. The sign of the Father is not a slogan but the conjunction
  of ⲟⲩⲕⲓⲙ, “movement,” and Greek-derived ⲁⲛⲁⲡⲁⲩⲥⲓⲥ, “rest” or “repose.” The living Father is marked within
  persons by a paradox: vital motion without restless scattering, and stillness without inertia. The saying
  thus resists both flight from the world and mere agitation within it.


  Key Terms


  **ⲟⲩⲟⲉⲓⲛ** — “Light”; the primordial source from which the speakers say they have come.

  **ⲉⲓⲕⲱⲛ** — “Image,” a Greek loanword; the mode in which the Light becomes manifest.

  **ⲕⲓⲙ** — “Movement”; active, living motion named as part of the inner sign.

  **ⲁⲛⲁⲡⲁⲩⲥⲓⲥ** — “Rest” or “repose,” a Greek loanword paired with movement rather than opposed to it.


  Cross-Tradition Resonances


  **Genesis 1:3–4:** Creation begins with God’s command that light appear, making light a primal marker
  of divine ordering and life. Divergence: Genesis depicts light as created by God’s word, while Thomas
  50 speaks of the Light as coming to be “through itself.”

  **John 8:12:** Jesus’ declaration, “I am the light of the world,” likewise makes light the source of
  life and guidance for those who follow. Divergence: John centers the light explicitly in Jesus’ person,
  whereas this saying equips the hearers to confess their own origin from the Light.

  **Matthew 11:28–29:** Jesus promises rest to those who come to him, connecting divine relationship with
  inward repose. Divergence: Matthew emphasizes rest as relief from burdens; Thomas 50 joins repose inseparably
  to movement as a sign already within.'
practice: Stand still for one minute, noticing your breath and the pressure of your feet on the ground.
  Then walk slowly for five minutes without a device, keeping one part of attention on the body at rest
  within motion. End by naming one action today that can be energetic without becoming hurried.
