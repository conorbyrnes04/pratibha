sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ⲟⲩⲃⲉⲛⲉⲗⲟⲟⲗⲉ ⲁⲩⲧⲟϭⲥ ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ ⲙ̄ⲡⲉⲓⲱⲧ⳿ ⲁⲩⲱ ⲉⲥ ⲁⲛ ⲥⲉⲛⲁⲡⲟⲣⲕⲥ︦ ϩⲁⲧⲉⲥⲛⲟⲩⲛⲉ ⲛ̄ⲥⲧⲁⲕⲟ
translation_literal: Jesus said, 'A grapevine was planted outside the Father, and since it is not established,
  it will be pulled up by its roots and will perish.'
commentary: 'The image is brief and severe: a vine may be planted, may even appear alive, yet its location
  determines its fate. To stand “apart from the Father” is not merely to occupy a different place; it
  names a life-source cut off from the ground that can sustain it. Its weakness is consequently exposed
  when uprooting comes.


  The Coptic ⲃⲉⲛⲉⲗⲟⲟⲗⲉ means “vine” or “grapevine,” an image of cultivated fertility rather than wild
  vegetation. The saying does not describe bad fruit or moral failure. Its attention falls earlier, at
  the root: what is planted outside the Father lacks the strength to endure and finally comes to destruction.


  Key Terms


  **ⲃⲉⲛⲉⲗⲟⲟⲗⲉ** — Vine or grapevine; a cultivated plant whose life depends on sound rooting.

  **ⲉⲓⲱⲧ** — Father; the divine source from which enduring life proceeds.

  **ⲧⲟϭⲥ** — To plant or set in place; the saying begins with a vine deliberately established.

  **ⲥⲛⲟⲩⲛⲉ** — Root; the hidden point of attachment that is exposed in uprooting.


  Cross-Tradition Resonances


  **Matthew 15:13:** Jesus says that every plant not planted by his heavenly Father will be uprooted,
  closely echoing Thomas’s image of divine planting and removal. Divergence: Matthew applies the image
  within a dispute about religious teaching, while Thomas gives no specific opponent or controversy.

  **John 15:1–6:** John’s vine discourse likewise makes abiding in the divine source the condition for
  life and fruitfulness. Divergence: John explicitly names Jesus as the true vine and speaks of branches
  abiding in him; Thomas speaks only of a vine planted outside the Father.

  **Psalm 1:3–4:** The psalm contrasts a well-watered, fruitful tree with chaff that cannot stand, linking
  endurance to a life-giving orientation. Divergence: Psalm 1 grounds stability in meditation on Torah,
  whereas Thomas frames the issue as being planted in or outside the Father.'
practice: Visit a growing plant today. Touch the soil around its base, notice where its roots disappear
  from sight, and name one habit or attachment that genuinely roots your life in what gives it strength;
  take one physical step to tend it.
