translation_literal: Jesus said, “If a blind person leads another blind person, both of them will fall
  into a pit.”
commentary: 'The saying is built from a stark doubling: one blind person, another blind person, and finally
  the two together. The danger is not merely individual limitation but unexamined dependence: one who
  cannot see sets the course for another who cannot see. The result is communal and bodily—both fall.


  The verb ⲥⲱⲕ carries the sense of going ahead or leading, while ⲉⲓⲉⲓⲧ names the pit into which their
  path ends. The saying does not mock blindness as such; its force concerns guidance without sight, authority
  without discernment. It presses the hearer to ask not only whom they follow, but whether their own vision
  has been awakened.


  Key Terms


  **ⲟⲩⲃⲗⲗⲉ** — a blind person; one unable to see the way.

  **ⲥⲱⲕ** — to go before, lead, or direct another’s course.

  **ⲡⲉⲥⲛⲁⲩ** — the two, both of them; emphasizing their shared fate.

  **ⲉⲓⲉⲓⲧ** — a pit or ditch, the concrete end of a misdirected path.


  Cross-Tradition Resonances


  **Matthew 15:14:** Jesus says of the Pharisees, “If a blind person guides a blind person, both will
  fall into a pit.” Divergence: Matthew explicitly identifies the blind guides with religious opponents,
  whereas Thomas gives no named target and leaves the warning broadly searching.

  **Luke 6:39:** Jesus asks whether a blind person can guide a blind person, concluding that both will
  fall into a pit. Divergence: Luke places the image amid teaching on disciples and teachers; Thomas presents
  it as an independent, compressed pronouncement.

  **Katha Upanishad 1.2.5:** The text describes people dwelling in ignorance as “the blind led by the
  blind,” moving about in confusion. Divergence: The Upanishad frames blindness within ignorance of the
  eternal Self, while Thomas concentrates on the immediate peril of following a sightless leader.'
practice: 'Before accepting advice today, pause for one full breath and ask: “What does this guide actually
  see?” Then name one area in which you need to seek counsel from someone with tested clarity rather than
  mere confidence.'
