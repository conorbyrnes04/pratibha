translation_literal: 'Jesus said, “From Adam to John the Baptizer, among those born of women, no one rises
  above John so greatly that his eyes need not be broken. But I tell you: whoever becomes little will
  know, and will rise above John.”'
commentary: 'John marks the summit of those “born of women”: the greatest figure within the inherited
  human order. Yet the saying gives even this greatness a severe limit through the image of eyes being
  “broken.” Sight, perhaps the confidence of ordinary human perception, remains vulnerable even at its
  highest point. John’s stature is honored, not dismissed, but it is not the final measure.


  The reversal comes through becoming “little” (ⲕⲟⲩⲉⲓ). This is not merely low social rank or childishness;
  it names a deliberate relinquishment of self-importance. Such littleness brings knowing (ⲥⲟⲩⲱⲛ), an
  experiential recognition, and paradoxically leads to being raised higher (ⲫⲁϫⲓⲥⲉ) than John. The Greek-derived
  title ⲃⲁⲡⲧⲓⲥⲧⲏⲥ, “Baptizer,” keeps John’s public greatness in view, while the saying directs attention
  toward an inward transformation beyond public rank.


  Key Terms


  **ⲃⲁⲡⲧⲓⲥⲧⲏⲥ** — “Baptizer,” a Greek loanword identifying John by his ritual vocation.

  **ⲕⲟⲩⲉⲓ** — Small, little, or lowly; the condition the hearer is called to become.

  **ⲥⲟⲩⲱⲛ** — To know or recognize, suggesting lived insight rather than bare information.

  **ϫⲓⲥⲉ** — To rise or be exalted; the surprising outcome of becoming little.


  Cross-Tradition Resonances


  **Matthew 11:11:** Jesus likewise calls John unsurpassed among those born of women and then contrasts
  him with a greater “least” one. Divergence: Matthew explicitly locates that greater status in the kingdom
  of heaven; this Thomas saying, as supplied, speaks instead of becoming little, knowing, and rising.

  **Mark 10:15:** Jesus makes a childlike mode of receiving central to participation in God’s reign, paralleling
  the value placed here on becoming little. Divergence: Mark emphasizes receiving the kingdom, whereas
  this saying emphasizes knowledge and surpassing John.

  **Philippians 2:5–11:** The hymn traces a paradoxical pattern in which self-emptying humility is followed
  by exaltation. Divergence: Philippians applies this pattern uniquely to Christ’s incarnation and lordship;
  Thomas addresses the hearer’s own becoming little.'
practice: 'For one day, choose one unnoticed act of service without explaining it, seeking credit, or
  correcting anyone’s impression of you. At day’s end, sit quietly for five minutes and ask: What did
  I need to become smaller than in order to see more clearly?'
