translation_literal: Jesus said, “The Father’s kingdom is like a man who had good seed. His enemy came
  by night and sowed weeds among the good seed. The man did not permit them to pull up the weeds. He said
  to them, ‘Perhaps, in going to pull up the weeds, you would uproot the wheat with them.’ For at the
  harvest the weeds will become visible; they will be pulled up and burned.”
commentary: 'The kingdom is not pictured as a field already cleared of every threat. Good seed and destructive
  growth stand interwoven, and the enemy’s work happens “by night”: harm may enter quietly, unnoticed,
  and only gradually disclose itself. Yet the householder refuses a cleansing that would ruin the crop
  it means to protect. The saying counsels discernment joined to restraint.


  The word ⲍⲓⲍⲁⲛⲓⲟⲛ (Greek ζιζάνιον) denotes a weed, often understood as darnel, a plant that can resemble
  wheat while growing. Its ambiguity sharpens the warning: premature certainty can injure what is truly
  good. The eventual harvest does not deny judgment; it places judgment at the proper time, when what
  has been entangled becomes plain.


  Key Terms


  **ⲙⲛ̄ⲧⲉⲣⲟ** — kingdom or reign; here, the Father’s active domain rather than merely a future place.

  **ⲍⲓⲍⲁⲛⲓⲟⲛ** — a Greek loanword for weeds, traditionally associated with darnel growing among wheat.

  **ⲥⲟⲩⲟ** — wheat or grain, the good crop endangered by indiscriminate uprooting.

  **ⲱϩⲥ** — harvest, the season when the hidden difference between plants is disclosed.


  Cross-Tradition Resonances


  **Matthew 13:24–30:** Matthew’s parable of wheat and weeds likewise forbids servants from uprooting
  weeds lest they damage the wheat, reserving separation for harvest. Divergence: Matthew supplies an
  extended allegorical interpretation involving angels and the end of the age; this Thomas saying leaves
  the image largely uninterpreted.

  **Pirkei Avot 2:4:** “Do not judge your fellow until you have reached his place” similarly restrains
  quick moral verdicts when another’s reality is not fully known. Divergence: Avot addresses interpersonal
  judgment, whereas this saying uses an agricultural image of communal mixture and a final harvest.

  **Dhammapada 252:** The Dhammapada warns that people readily notice others’ faults while concealing
  their own, a caution against eager fault-finding. Divergence: The Buddhist verse turns attention toward
  one’s own moral blindness; the Thomas saying focuses on the danger that purging others may destroy genuine
  good.'
practice: 'For one week, when you notice a person, group, or habit you want immediately to label and remove,
  pause for three breaths and ask: “What good might be damaged by my haste?” Take one careful, non-destructive
  next step instead.'
