sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲉⲣϣⲁⲥⲛⲁⲩ ⲙⲛ̄ⲛⲟⲩⲉⲣⲏⲩ ϩⲙ̄ⲡⲉⲓⲏⲉⲓ ⲟⲩⲱⲧ⳿ ⲥⲉⲛⲁϫⲟⲟⲥ ⲙ̄ⲡⲧⲁⲩ ϫⲉⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ ⲁⲩⲱ ϥⲛⲁ
translation_literal: Jesus said, “If two make peace with one another in this one house, they will say
  to the mountain, ‘Move away,’ and it will …”
commentary: 'The saying begins not with solitary mastery but with two people becoming reconciled within
  “this one house.” The house may be an actual shared dwelling, yet it also evokes a common human space:
  a community, a body, or the world inhabited together. The force of the saying arises from restored relation;
  speech gains efficacy when division is no longer being rehearsed.


  The Coptic breaks off after ⲁⲩⲱ ϥⲛⲁ, “and it will …,” leaving the mountain’s response unfinished in
  the supplied text. That interruption gives the image an open force. ⲟⲩⲉⲣⲏⲩ, “one another,” makes reconciliation
  reciprocal, not merely one person’s private concession. The mountain is the dense, apparently immovable
  obstacle that shared peace can address.


  Key Terms


  **ⲉⲣϣⲁⲛ** — if/when; a conditional opening that makes the saying invitational rather than automatic.

  **ⲥⲛⲁⲩ** — two; the minimum number required for mutuality and reconciliation.

  **ⲟⲩⲉⲣⲏⲩ** — one another; reciprocal relation, not one-sided accommodation.

  **ⲏⲉⲓ** — house; a dwelling, and potentially the shared sphere of communal life.


  Cross-Tradition Resonances


  **Matthew 18:19–20:** Matthew joins agreement in prayer with the gathered presence of Jesus, similarly
  locating spiritual potency in a reconciled plurality. Divergence: Matthew explicitly concerns asking
  the Father and gathering in Jesus’ name; Thomas speaks instead of two making peace in one house.

  **Mark 11:23:** Mark likewise imagines a mountain commanded to move, making the mountain a figure for
  what seems immovable. Divergence: Mark emphasizes unwavering faith in the speaker, whereas this saying
  foregrounds peace between two people.

  **Dhammapada 5:** “Hatreds are never settled by hatred” parallels the claim that a transformed relation,
  rather than conflict, opens a new possibility. Divergence: The Dhammapada teaches the cessation of enmity
  as an ethical principle, without Thomas’s image of united speech moving a mountain.'
practice: 'Choose one strained relationship. Stand or sit facing the person, if possible; otherwise place
  an empty chair before you. Take three slow breaths, name one concrete harm or distance without accusation,
  then speak one sentence of genuine repair: “I want peace between us.” End by naming one small next action
  you can both carry out.'
