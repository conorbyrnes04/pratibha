translation_literal: Jesus said, “A city built upon a high mountain and firmly established cannot fall,
  nor can it be hidden.”
commentary: 'The saying holds together two consequences of elevation: the city is secure and exposed.
  Its high situation makes it difficult to overthrow, yet that same prominence prevents concealment. What
  is truly established does not withdraw into invisibility.


  The word ⲡⲟⲗⲓⲥ (polis, “city”) is a Greek loanword, suggesting not a private spiritual state but a gathered,
  ordered human reality. ⲥⲧⲁϫⲣⲏⲩ means “made firm” or “secured”: endurance is not mere height or prestige,
  but a settled foundation. The saying offers no instruction to seek notice; rather, stability itself
  becomes visible.


  Key Terms


  **ⲡⲟⲗⲓⲥ** — “City,” a Greek loanword (polis), denoting a communal and public reality.

  **ϫⲟⲥⲉ** — “High” or “lofty,” marking the city’s elevated position.

  **ⲥⲧⲁϫⲣⲏⲩ** — “Firmly established” or “made secure,” indicating settled strength.

  **ϣϩⲱⲡ** — “To hide” or “be concealed”; the city’s position makes concealment impossible.


  Cross-Tradition Resonances


  **Matthew 5:14:** Jesus likewise says that a city set on a mountain cannot be hidden, linking elevated
  visibility with the life of those who bear light. Divergence: Matthew explicitly frames the image as
  the public witness of disciples, while Thomas stresses the city’s security as well as its visibility.

  **Isaiah 2:2–3:** Isaiah envisions the mountain of the Lord’s house raised above other heights, drawing
  peoples toward instruction and peace. Divergence: Isaiah’s mountain is a destination for the nations,
  whereas this saying speaks of a city that simply cannot collapse or remain unseen.

  **Dhammapada 81:** The Dhammapada compares the wise person to a solid rock unshaken by the wind, echoing
  the image of unassailable firmness. Divergence: The Buddhist verse concerns the inner equanimity of
  an individual, while Thomas presents a visible and communal city.'
practice: 'Choose one shared place in your life—a home, workplace, or community—and make one stabilizing
  act there today: repair something neglected, state a truthful commitment aloud, or establish a small
  practice of mutual care. Then notice whether genuine steadiness makes itself visible without display.'
