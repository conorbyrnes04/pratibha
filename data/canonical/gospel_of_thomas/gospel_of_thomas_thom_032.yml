sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲟⲩⲡⲟⲗⲓⲥ ⲉⲩⲕⲱⲧ ⲙ̄ⲙⲟⲥ ϩⲓϫⲛ̄ⲟⲩ ⲉϥϫⲟⲥⲉ ⲉⲥⲧⲁϫⲣⲏⲩ ⲙⲛ̄ϭⲟⲙ ⲛ̄ⲥϩⲉ ⲟⲩⲇⲉ ⲥⲛⲁϣϩⲱⲡ⳿
