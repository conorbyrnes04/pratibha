translation_literal: Jesus said, “The Pharisees and the scribes have taken the keys of knowledge and hidden
  them. They did not enter, and they did not allow those who wished to enter. But you, become prudent
  like serpents and pure like doves.”
commentary: 'The saying attacks not learning itself but the withholding of it. The authorities possess
  the “keys” of ⲅⲛⲱⲥⲓⲥ (gnōsis, knowledge): what should open a way becomes something concealed. Their
  failure is doubled: they do not go in themselves, and they obstruct those who desire to enter. Knowledge
  here is not mere information; it is a threshold into lived understanding.


  The closing instruction gives the disciple a difficult balance. ⲫⲣⲟⲛⲓⲙⲟⲥ means sensible, discerning,
  or strategically wise; ⲁⲕⲉⲣⲁⲓⲟⲥ means unmixed, uncorrupted, innocent. Serpentine alertness without dove-like
  purity becomes manipulation; purity without discernment becomes vulnerable naivety. The saying calls
  for clear-eyed integrity that neither hoards the way nor is easily trapped by those who do.


  Key Terms


  **ⲅⲛⲱⲥⲓⲥ** — Knowledge; here, insight that opens access rather than a body of guarded information.

  **ⲥⲁϣⲧ** — Keys; symbols of authority to open, admit, or exclude.

  **ⲫⲣⲟⲛⲓⲙⲟⲥ** — Prudent, discerning, practically intelligent.

  **ⲁⲕⲉⲣⲁⲓⲟⲥ** — Pure, unmixed, guileless, morally uncorrupted.


  Cross-Tradition Resonances


  **Luke 11:52:** Jesus rebukes legal experts for taking away the key of knowledge: they neither enter
  nor permit others to enter. Divergence: Luke frames the charge within a sequence of woes against lawyers,
  while Thomas moves immediately to the disciple’s needed wisdom and purity.

  **Matthew 10:16:** The disciples are sent out to be discerning as serpents and innocent as doves. Divergence:
  Matthew places the image in a mission discourse about persecution; Thomas joins it to the problem of
  hidden knowledge and blocked entry.

  **Mishnah Avot 1:1:** The rabbis are charged to make a protective “fence around the Torah,” treating
  teaching as a sacred trust requiring careful stewardship. Divergence: Avot presents safeguards as preserving
  access to Torah, whereas this saying condemns religious authority when its custody becomes exclusion.'
practice: 'Before speaking in a group, pause for one breath and ask: “Am I opening a door or guarding
  one?” Offer one clear, honest contribution; then make room for someone quieter to enter the conversation.'
