translation_literal: Jesus said, “Whoever does not hate father and mother cannot be my disciple. And whoever
  does not hate brothers and sisters, and does not carry the cross in my way, cannot become worthy of
  me.”
commentary: 'The saying speaks in deliberately severe terms. The Coptic ⲙⲉⲥⲧⲉ means “hate,” not merely
  a mild preference, yet its force here is to break the unquestioned claim of household loyalty. Father,
  mother, brothers, and sisters name the primary social world from which identity, protection, and obligation
  come. Discipleship demands a loyalty that cannot simply be absorbed into those claims.


  The second movement makes the cost bodily: one must carry “his cross” (ⲥⲧⲁⲩⲣⲟⲥ, a Greek loanword) “in
  my way.” This is not a call to despise relatives or seek suffering for its own sake; it is a summons
  to accept the public risk and loss entailed in Jesus’ path. To be ⲁⲝⲓⲟⲥ, “worthy,” is to be fittingly
  matched to that path, with no family bond allowed to overrule it.


  Key Terms


  **ⲙⲉⲥⲧⲉ** — “hate”; stark language for a rupture in ordinary allegiance.

  **ⲙⲁⲑⲏⲧⲏⲥ** — “disciple,” a learner defined by attachment to a teacher’s way.

  **ⲥⲧⲁⲩⲣⲟⲥ** — “cross,” a Greek loanword denoting an instrument of execution and public shame.

  **ⲁⲝⲓⲟⲥ** — “worthy”; fit, corresponding rightly to the one followed.


  Cross-Tradition Resonances


  **Luke 14:26–27:** Luke likewise joins “hating” one’s household to carrying the cross as conditions
  for being Jesus’ disciple. Divergence: Luke expands the list to include one’s own life and frames the
  demand explicitly as inability to be a disciple.

  **Qur’an 9:24:** The Qur’an warns against treating fathers, sons, brothers, spouses, kin, wealth, and
  homes as more beloved than God and God’s messenger. Divergence: Its warning is cast within communal
  fidelity and divine judgment rather than in the Thomas saying’s image of bearing the cross.

  **Bhagavad Gita 18:66:** Krishna calls Arjuna to relinquish all competing dharmas and take refuge in
  him alone, placing ultimate devotion above other obligations. Divergence: The Gita’s setting is Arjuna’s
  crisis over warrior-duty, whereas Thomas directly names the disciple’s familial attachments and cross-bearing.'
practice: Stand quietly with both feet planted. Name inwardly three loyalties that shape your choices—family
  expectation, reputation, security—and ask which one prevents a truthful act of compassion today. Take
  one small, non-hostile step toward that truth, without cutting off or shaming anyone.
