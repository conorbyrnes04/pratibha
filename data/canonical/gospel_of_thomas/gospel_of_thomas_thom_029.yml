sanskrit_devanagari: 'ⲡⲉϫⲉⲓ︤ⲥ︥ ⲉϣϫⲉⲛ̄ⲧⲁⲧⲥⲁⲣⲝ⳿ ϣⲱⲡⲉ ⲉⲧⲃⲉⲡⲛ︤ⲁ︥ ⲟⲩϣⲡⲏⲣⲉ ⲧⲉ ⲡⲛ︤ⲁ︥ ⲇⲉ ⲉⲧⲃⲉⲡⲥⲱⲙⲁ ⲟⲩϣⲡⲏⲣⲉ ⲛ̄ϣⲡⲏⲣⲉ
  ⲡⲉ ⲁⲗⲗⲁ ⲁⲛⲟⲕ⳿ ϯ ⲙ̄ⲡⲁⲉⲓ ϫⲉⲡⲱ

  [ⲥ] ⲁⲧⲉⲉⲓⲛⲟϭ ⲙ̄ ⲁⲥⲟⲩⲱϩ ϩⲛ̄ⲧⲉⲉⲓ'
translation_literal: Jesus said, 'If the flesh came into being because of the spirit, it is a marvel.
  But if the spirit came into being because of the body, it is a marvel of marvels. Yet I am amazed at
  how this great wealth has taken up residence in this poverty.'
commentary: 'The saying turns two possible accounts of embodied life into occasions for astonishment.
  If flesh follows from spirit, the result is wondrous; if spirit follows from body, the wonder becomes
  intensified. Rather than settling a theory of origins, the saying presses the hearer into amazement
  before the conjunction of material and immaterial life.


  The surviving Coptic breaks off after ⲧⲉⲉⲓ, “this,” so the final object is not fully present in the
  supplied text. The phrase before it speaks of “this great [wealth]” dwelling somewhere, an image that
  makes bodily existence seem at once slight and capacious. The Greek loanwords ⲥⲁⲣⲝ (sarx, “flesh”),
  ⲡⲛⲁ (pneuma, “spirit”), and ⲥⲱⲙⲁ (sōma, “body”) are held together without allowing either side to cancel
  the other.


  Key Terms


  **ⲥⲁⲣⲝ (sarx)** — “Flesh,” the living material aspect of human existence.

  **ⲡⲛⲁ (pneuma)** — “Spirit” or breath; a Greek loanword for enlivening, non-material reality.

  **ⲥⲱⲙⲁ (sōma)** — “Body,” the concrete embodied form.

  **ϣⲡⲏⲣⲉ** — “Wonder” or marvel; the saying repeatedly makes astonishment its proper response.


  Cross-Tradition Resonances


  **Genesis 2:7:** The human is formed from earth and enlivened by divine breath, joining materiality
  and life in one creature. Divergence: Genesis narrates a divine act of formation, whereas Thomas frames
  the body-spirit relation as an unresolved paradox.

  **2 Corinthians 4:7:** Paul’s “treasure in clay jars” similarly imagines an immense value held within
  fragile material conditions. Divergence: Paul identifies the treasure with apostolic and divine power;
  this saying leaves the indwelling greatness unnamed.

  **Bhagavad Gita 2.22:** The Gita distinguishes the enduring self from changing bodily garments, encouraging
  a perspective beyond bodily transience. Divergence: The Gita offers a more defined teaching about the
  self’s persistence, while Thomas lingers in wonder at spirit and body together.'
practice: Sit quietly for five minutes with one hand on your chest and one on your abdomen. Attend to
  breath, warmth, pulse, and weight; after each breath, inwardly say, “wonder,” without trying to resolve
  what body and spirit are.
