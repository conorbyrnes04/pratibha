sanskrit_devanagari: 'ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲡⲉⲧⲁ ⲁⲡⲉⲓⲱⲧ⳿ ⲥⲉⲛⲁⲕⲱ ⲉⲃⲟⲗ ⲛⲁϥ⳿ ⲁⲩⲱ ⲡⲉⲧⲁϫⲉ

  ⲟⲩⲁ ⲉⲡϣⲏⲣⲉ ⲥⲉⲛⲁⲕⲱ ⲉⲃⲟⲗ ⲛⲁϥ⳿ ⲡⲉⲧⲁϫⲉ

  ⲟⲩⲁ ⲇⲉ ⲁⲡⲡⲛ︤ⲁ︥ ⲉⲧⲟⲩⲁⲁⲃ ⲥⲉⲛⲁⲕⲱ ⲁⲛ ⲉⲃⲟⲗ ⲛⲁϥ⳿ ⲟⲩⲧⲉ ϩⲙ̄ⲡⲕⲁϩ ⲟⲩⲧⲉ ϩⲛ̄ⲧⲡⲉ'
translation_literal: Jesus said, “Whoever speaks against the Father will be forgiven. Whoever speaks against
  the Son will be forgiven. But whoever speaks against the Holy Spirit will not be forgiven, neither on
  earth nor in heaven.”
commentary: 'The saying moves through a stark threefold pattern: Father, Son, Holy Spirit; forgiveness,
  forgiveness, then no forgiveness. Its force lies less in defining a list of prohibited words than in
  marking a limit. Human speech can resist, misunderstand, and even attack what it encounters in the Father
  and the Son; release remains possible. Yet speech against the Holy Spirit names a refusal at the level
  of the life-giving holy presence itself.


  The Coptic ⲡⲛⲁ (from Greek pneuma, “spirit/breath”) is joined to ⲉⲧⲟⲩⲁⲁⲃ, “the holy.” The phrase may
  therefore evoke not merely an abstract doctrinal person but the holy breath or active presence through
  which recognition becomes possible. The closing “neither on earth nor in heaven” makes the consequence
  comprehensive: a settled rejection of the source of healing cannot itself receive healing while it remains
  refusal.


  Key Terms


  **ⲕⲱ ⲉⲃⲟⲗ** — “Release, let go”; the Coptic idiom used here for forgiving.

  **ⲡⲉⲓⲱⲧ** — “The Father,” the first member of the saying’s threefold sequence.

  **ⲡϣⲏⲣⲉ** — “The Son,” set between Father and Holy Spirit.

  **ⲡⲛⲁ ⲉⲧⲟⲩⲁⲁⲃ** — “The Holy Spirit”; ⲡⲛⲁ derives from Greek pneuma, spirit or breath.


  Cross-Tradition Resonances


  **Matthew 12:31–32:** Matthew likewise contrasts forgivable speech against the Son with speech against
  the Holy Spirit, extending the consequence beyond the present age. Divergence: Matthew speaks of the
  “Son of Man” and “this age or the age to come,” whereas Thomas says simply “the Son” and “earth” and
  “heaven.”

  **Mark 3:28–29:** Mark similarly places an enduringly unforgivable offense in relation to the Holy Spirit.
  Divergence: Mark frames the warning within an accusation that Jesus acts by an unclean spirit; this
  Thomas saying supplies no narrative occasion.

  **Qur''an 4:48:** The Qur''an distinguishes divine forgiveness broadly from a radical refusal of God
  through association (shirk), presenting a limit with existential seriousness. Divergence: The Qur''anic
  passage does not employ the Father-Son-Spirit pattern and addresses associating partners with God rather
  than speech against the Holy Spirit.'
practice: Stand or sit with both feet planted. Take three slow breaths; before each exhale, name silently
  one harmful sentence you have spoken or withheld. Then choose one repair you can make today—an apology,
  a clarification, or a deliberate silence—and carry it out before nightfall.
