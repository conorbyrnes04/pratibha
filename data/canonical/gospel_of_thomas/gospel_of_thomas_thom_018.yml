translation_literal: 'The disciples said to Jesus, “Tell us: what sort of thing will our end be?” Jesus
  said, “Have you then uncovered the beginning, that you are looking for the end? For where the beginning
  is, there the end will be. Blessed is the one who stands at the beginning: that one will know the end
  and will not taste death.”'
commentary: 'The disciples want an account of the final outcome, but Jesus turns their attention behind
  them—or more deeply, beneath them—to the beginning. The question is not dismissed; it is redirected.
  One cannot rightly seek the end while the beginning remains undiscovered. The saying joins beginning
  and end as realities found in the same “place,” rather than as merely distant points on a line of time.


  The Greek loanword ⲧⲁⲣⲭⲏ (archē, “beginning,” “origin,” “first principle”) carries more weight than
  a simple chronological starting point. To stand in the archē is to become grounded in the source. The
  one who does so is ⲙⲁⲕⲁⲣⲓⲟⲥ, blessed or deeply fortunate: such a person knows the end already and does
  not “taste” death. Death here is not necessarily denied as bodily event; the saying speaks of a knowledge
  and rootedness that death cannot finally consume.


  Key Terms


  **ⲧⲁⲣⲭⲏ (archē)** — Beginning, origin, or governing first principle; more than a point in past time.

  **ⲑⲁϩⲏ** — End, completion, or final outcome.

  **ⲙⲁⲕⲁⲣⲓⲟⲥ** — Blessed, fortunate, flourishing; a Greek-derived beatitude term.

  **ϩⲱϩⲉ ⲉⲣⲁⲧϥ̅** — To stand or remain firm in one’s place.


  Cross-Tradition Resonances


  **Genesis 1:1:** Genesis begins with God’s creative beginning, inviting reflection on origin as the
  ground of all that follows. Divergence: Thomas does not narrate creation; it calls the seeker to discover
  and stand in the beginning.

  **John 8:51:** Jesus promises that one who keeps his word will never see death, paralleling Thomas’s
  promise of not tasting death. Divergence: John grounds the promise in keeping Jesus’ word, while Thomas
  grounds it in standing at the beginning and knowing the end.

  **Dao De Jing 16:** The Dao De Jing commends returning to the root and calls this return enduring life.
  Divergence: The Daoist text speaks of return to the Dao’s root, whereas Thomas frames origin and end
  through a saying of Jesus and the blessed knower.'
practice: 'Stand quietly for five minutes at the start of the day. Feel both feet on the ground, breathe
  slowly, and ask: “What is most original in me before fear about outcomes?” End by naming one action
  that comes from that ground rather than from anxiety about the end.'
