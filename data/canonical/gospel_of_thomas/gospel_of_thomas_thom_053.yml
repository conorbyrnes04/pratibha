translation_literal: His disciples said to him, “Is circumcision beneficial, or not?” He said to them,
  “If it were beneficial, their father would bring them forth from their mother already circumcised. Rather,
  the true circumcision in the Spirit has proved wholly beneficial.”
commentary: 'The disciples ask whether circumcision, a bodily covenantal mark, has value. Jesus answers
  with a deliberately stark appeal to birth: if the physical act were itself the decisive good, children
  would emerge bearing it. The saying does not merely dismiss the body; it exposes the difference between
  an inherited exterior sign and a transformation that cannot be supplied by custom or parentage.


  The central phrase is ⲡⲥⲃⲃⲉ ⲙⲙⲉ, “the true circumcision,” qualified by ϩⲙ ⲡⲛⲁ, “in the Spirit.” ⲡⲛⲁ
  is the Coptic form of Greek pneuma, which can mean spirit, breath, or animating power. The final claim
  speaks in the language of benefit: what truly profits is not the cutting of flesh but the Spirit’s inward
  work.


  Key Terms


  **ⲥⲃⲃⲉ** — Circumcision; the physical rite placed under question.

  **ⲙⲙⲉ** — True, genuine; marks the inward circumcision as the real one.

  **ⲡⲛⲁ** — Spirit, from Greek pneuma; the sphere or power of authentic transformation.

  **ⲧⲏⲣϥ** — Wholly, completely; intensifies the saying’s claim about true benefit.


  Cross-Tradition Resonances


  **Deuteronomy 10:16:** “Circumcise the foreskin of your heart” similarly redirects covenantal language
  toward an inward disposition. Divergence: Deuteronomy retains the command within Israel’s covenantal
  obedience, whereas Thomas frames the issue as a contrast between physical birth and spiritual efficacy.

  **Romans 2:28–29:** Paul likewise identifies true circumcision with an inward work “of the heart, in
  the Spirit.” Divergence: Paul argues this point amid a sustained discussion of Jewish and Gentile standing
  before God; Thomas offers a compact aphorism without that argumentative setting.

  **Galatians 5:6:** Paul declares that neither circumcision nor uncircumcision counts decisively, but
  a transformed life expressed through faith and love does. Divergence: Galatians names faith working
  through love, while Thomas speaks instead of the Spirit’s true circumcision and its complete profit.'
practice: 'Sit quietly for five minutes with one inherited religious, cultural, or personal marker you
  rely on. Ask: “What inward change would make this sign truthful?” Then choose one small bodily action
  today—an apology, generosity, restraint, or act of attention—that enacts that change.'
