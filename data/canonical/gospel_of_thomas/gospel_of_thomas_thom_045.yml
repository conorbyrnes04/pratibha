translation_literal: Jesus said, “Grapes are not gathered from thorns, nor are figs picked from thistles;
  they do not yield fruit. For a good person brings good out of his good store, while an evil person brings
  evil things out of the evil store within his heart; and he speaks evil things. For from the heart’s
  abundance he brings forth …”
commentary: 'The saying begins with an agricultural image of fitting yield: thornbushes and thistles cannot
  be made into sources of grapes or figs. The point is not merely that actions reveal character, but that
  fruit belongs to a living source. What comes forth repeatedly—especially speech—makes visible the condition
  from which it grows.


  The Coptic uses Greek loanwords such as ⲁⲅⲁⲑⲟⲥ (“good”) and ⲕⲁⲕⲟⲥ / ⲡⲟⲛⲏⲣⲟⲛ (“bad,” “evil”). The inner
  ⲉϩⲟ, a store or reserve, is located in the ⲕⲏⲧ, the heart. Speech is therefore not treated as accidental
  overflow: harmful words arise from an inward surplus. The surviving Coptic ends mid-thought after “he
  brings forth,” leaving the final object unstated in this witness.


  Key Terms


  **ⲗⲉⲉⲗⲟⲟⲗ** — grapes; the fitting fruit sought from a vine.

  **ⲕⲁⲣⲡⲟⲥ** — fruit; visible yield, literally and morally.

  **ⲉϩⲟ** — store, treasury, or inner reserve from which one brings things out.

  **ϩⲏⲧ** — heart; the inward center of desire, thought, and speech.


  Cross-Tradition Resonances


  **Matthew 7:16–18:** Jesus likewise asks whether grapes are gathered from thorns or figs from thistles
  and speaks of trees known by their fruit. Divergence: Matthew develops the image toward discerning false
  prophets, whereas this saying turns especially to the heart’s store and evil speech.

  **Luke 6:43–45:** Luke closely parallels the claim that a person brings good or evil from the heart’s
  treasury and that the mouth speaks from its abundance. Divergence: Luke’s form reaches a complete concluding
  statement, while the extant Coptic here breaks off after “he brings forth.”

  **Qur’an 14:24–26:** The Qur’an compares a wholesome word to a good tree with firm roots and abundant
  fruit, and a corrupt word to an uprooted bad tree. Divergence: The Qur’anic image emphasizes divine
  establishment and the stability of true speech, while Thomas concentrates on the speaker’s inward moral
  reserve.'
practice: 'Before speaking in one difficult conversation today, pause for three breaths and ask: “What
  reserve in me is about to bear fruit?” Choose one sentence that is truthful without being harmful.'
