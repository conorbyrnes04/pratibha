translation_literal: 'Jesus said, “I will choose you: one from a thousand and two from ten thousand; and
  they will stand as a single one.”'
commentary: 'The saying begins with startlingly narrow numbers. Its force is not simply that few are chosen,
  but that selection draws persons out of the anonymous mass: one from a thousand, then two from ten thousand.
  The shift from one to two prevents the chosen state from being mere isolation.


  Its final image is bodily and resolute: they “will stand.” The pair do not merely agree or resemble
  one another; they stand as ⲟⲩⲁ ⲟⲩⲱⲧ, “one single one.” ⲟⲩⲱⲧ can carry the sense of singular or alone,
  yet here it names a unity achieved without erasing the plurality of those who stand. The saying imagines
  a rare integrity: persons gathered into one undivided stance.


  Key Terms


  **ⲥⲉⲧⲡ** — to choose or select; the verb frames the saying as a deliberate drawing-out.

  **ϣⲟ** — thousand; the first measure of the crowd from which one is taken.

  **ⲧⲃⲁ** — ten thousand; an intensified multitude, heightening the saying’s sense of rarity.

  **ⲟⲩⲁ ⲟⲩⲱⲧ** — a single one; an emphatic expression of unified singularity.


  Cross-Tradition Resonances


  **Matthew 22:14:** “Many are called, but few are chosen” similarly contrasts a large multitude with
  a small number of chosen persons. Divergence: Matthew’s saying closes a parable of invitation and judgment,
  whereas Thomas 23 culminates in the chosen becoming one.

  **Bhagavad Gita 7.3:** Krishna says that among thousands a rare person strives for perfection, and rarer
  still is one who truly knows him. Divergence: The Gita stresses exceptional knowledge of Krishna; Thomas
  stresses the shared, unified standing of those selected.

  **Ecclesiastes 7:28:** Qoheleth speaks of finding one person among a thousand, using numerical rarity
  to mark an elusive discovery. Divergence: Ecclesiastes voices skeptical searching and does not turn
  rarity into a vision of communal oneness.'
practice: With one other person, stand side by side for three minutes in silence, feet grounded and shoulders
  relaxed. Do not speak or coordinate beyond breathing steadily; afterward, each name one divided loyalty
  they want to bring into a more single stance.
