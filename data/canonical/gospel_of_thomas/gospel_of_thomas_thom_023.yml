sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϯⲛⲁⲥⲉⲧⲡⲧⲏⲛⲉ ⲟⲩⲁ ⲉⲃⲟⲗ ϩⲛ̄ϣⲟ ⲁⲩⲱ ⲥⲛⲁⲩ ⲉⲃⲟⲗ ϩⲛ̄ⲧⲃⲁ ⲁⲩⲱ ⲥⲉⲛⲁⲱϩⲉ ⲉⲣⲁⲧⲟⲩ ⲉⲩⲟ
