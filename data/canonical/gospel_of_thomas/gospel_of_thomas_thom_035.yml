translation_literal: Jesus said, "No one is able to enter the house of the strong man and take it unless
  he first binds his hands; then he will plunder his house."
commentary: 'The saying is built on a stark sequence: entering, binding, then plundering. It does not
  commend reckless confrontation. What appears secure—the strong man’s house—cannot simply be taken by
  an impulsive assault. The condition is first to disable the hands by which strength acts and holds.


  The Coptic ⲙⲛ̄ϭⲟⲙ means “there is no power/ability”: entry is impossible until the decisive restraint
  occurs. The image can be read inwardly as well as socially. A dominating pattern, fear, appetite, or
  false security has a “house” and active “hands”; liberation begins by recognizing and interrupting the
  concrete means through which it maintains its hold.


  Key Terms


  **ⲙⲛ̄ϭⲟⲙ** — “There is no power/ability”; an assertion of what cannot be done without the prior condition.

  **ⲡⲏⲉⲓ** — “House,” the protected domain or dwelling of the strong man.

  **ϭⲓϫ** — “Hand”; here the instrument of grasping, acting, and exercising strength.

  **ⲡⲱⲱⲛⲉ** — “Plunder” or “strip”; to carry away what had been held within the house.


  Cross-Tradition Resonances


  **Mark 3:27:** Jesus uses the image of binding a strong man before carrying off what is in his house.
  Divergence: Mark explicitly frames the image within Jesus’ response to accusations about exorcism, while
  Thomas leaves its application open.

  **Isaiah 49:24–25:** Isaiah asks whether captives can be taken from the mighty and answers that the
  mighty will lose what they hold. Divergence: Isaiah attributes deliverance directly to the LORD’s legal
  struggle, whereas this saying stresses the prior act of binding.

  **Luke 11:21–22:** Luke contrasts a well-armed strong man guarding his dwelling with a stronger attacker
  who overcomes him and divides the spoil. Divergence: Luke adds armor, weapons, and a stronger opponent;
  Thomas concentrates only on the tactical necessity of binding the hands.'
practice: 'Stand with both fists gently clenched and name one habit that keeps its hold through a specific
  action—scrolling, avoiding, buying, boasting, or numbing. Slowly open your hands, then remove one enabling
  condition for that habit today: put the device away, cancel the purchase, take the walk, or speak the
  needed truth.'
