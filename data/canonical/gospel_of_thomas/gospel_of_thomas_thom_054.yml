sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϩⲛ̄ⲙⲁⲕⲁⲣⲓⲟⲥ ⲛⲉ ⲛ ϫⲉⲧⲱⲧⲛ̄ ⲧⲉ ⲧ ⲛⲙ̄ⲡⲏⲩⲉ
translation_literal: Jesus said, “Blessed are you, for yours is that of heaven.”
commentary: 'The saying opens with blessing rather than instruction. ⲙⲁⲕⲁⲣⲓⲟⲥ, from Greek makarios, names
  a condition of deep favor or flourishing; it does not merely congratulate the hearer. The direct plural
  “you” makes the blessing communal: it addresses a gathered body, not an isolated spiritual achiever.


  The surviving wording is notably compressed. It gives “yours” and “of heaven,” yet does not explicitly
  state the thing possessed. That ellipsis leaves the hearer before an open horizon: the blessing is grounded
  not in visible security, but in a belonging defined by heaven. The saying does not explain who is blessed
  or supply a program for attaining blessing; it simply declares a gift of heavenly belonging.


  Key Terms


  **ⲙⲁⲕⲁⲣⲓⲟⲥ** — “Blessed,” a Greek loanword denoting favored or deeply flourishing.

  **ⲧⲱⲧⲛ̄** — “Yours,” plural: the promise is addressed to a community.

  **ⲡⲏⲩⲉ** — “Heaven,” the divine sphere or horizon of ultimate belonging.


  Cross-Tradition Resonances


  **Matthew 5:3:** Matthew begins the Beatitudes by declaring blessedness and connecting it with the kingdom
  of heaven. Divergence: Matthew specifies “the poor in spirit” and explicitly names the kingdom, whereas
  this Coptic wording leaves both the recipients and the possessed reality unstated.

  **Luke 6:20:** Luke’s blessing addresses disciples directly—“yours is the kingdom of God”—with the same
  communal second-person force. Divergence: Luke identifies the blessed as poor and names God’s kingdom;
  the present saying is more elliptical and speaks of heaven.

  **Isaiah 57:15:** Isaiah joins divine exaltation with nearness, portraying the high and holy One as
  dwelling with the lowly in spirit. Divergence: Isaiah explains divine dwelling and names the contrite,
  while this saying offers a bare declaration of blessed belonging.'
practice: Sit quietly for five minutes with open hands. On each exhale, say inwardly, “Yours is heaven”;
  then name one possession, status, or fear you do not need to clutch today, and make one small act of
  generosity without display.
