  ⲅⲁⲣ ⲉϥϩⲏⲡ⳿ ⲉϥⲛⲁⲟⲩⲱⲛϩ ⲉⲃⲟⲗ ⲁⲛ
translation_literal: Jesus said, “Know what is before your face, and what is concealed from you will be
  uncovered for you. For there is nothing hidden that will not come to light.”
commentary: 'The saying begins not with a hunt for distant secrets but with what stands “before your face.”
  The imperative ⲥⲟⲩⲱⲛ, “know,” asks for a practiced recognition: to see what is immediately given without
  evasion, habit, or distraction. The near and ordinary become the threshold of understanding.


  What is ⲑⲏⲡ, “hidden,” is not necessarily withheld forever. It will be ⲭⲱⲗⲡ, uncovered or disclosed.
  The final clause presses this promise into a broad principle: concealment has no final permanence. Yet
  the saying does not map out secret information; it joins revelation to attentive seeing. What comes
  to light may be precisely the depth already present in the visible.


  Key Terms


  **ⲥⲟⲩⲱⲛ** — “Know”: an imperative calling for direct, discerning recognition.

  **ⲙ̄ⲡⲙ̄ⲧⲟ ⲙ̄ⲡⲉⲕϩⲟ** — “Before your face”: what is immediately present and openly encountered.

  **ⲑⲏⲡ** — “Hidden, concealed”: that which is presently veiled from perception.

  **ⲭⲱⲗⲡ** — “Uncover, reveal”: to remove a covering so that something becomes evident.


  Cross-Tradition Resonances


  **Matthew 10:26:** “Nothing is covered up that will not be uncovered” closely echoes Thomas’s confidence
  that what is hidden will become visible. Divergence: Matthew frames disclosure within public confession
  and eschatological judgment, while Thomas foregrounds knowing what is immediately before one’s face.

  **Mark 4:22:** Mark likewise declares that hidden things are meant to be brought into manifestation.
  Divergence: In Mark the saying interprets Jesus’ parabolic teaching; Thomas gives it as a compact summons
  to perception without that narrative setting.

  **Heraclitus, Fragment B54 (DK):** Heraclitus says that an unapparent harmony is stronger than an apparent
  one, suggesting depth within what seems visible. Divergence: Heraclitus speaks of the concealed order
  of reality, whereas Thomas promises that concealment itself will be uncovered through knowing.'
practice: 'For ten minutes, sit before one ordinary object—a cup, leaf, or your own hands. Do not interpret
  it or seek a message. Name silently five details you had not first noticed, then ask: “What has been
  before my face that I have not known?”'
