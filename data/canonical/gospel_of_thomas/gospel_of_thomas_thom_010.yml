sanskrit_devanagari: ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉⲁⲉⲓⲛⲟⲩϫⲉ ⲛ̄ⲟⲩⲕⲱϩⲧ⳿ ⲉϫⲛ̄ⲡⲕⲟⲥⲙⲟⲥ ⲁⲩⲱ ⲉⲓⲥϩⲏⲏⲧⲉ ϯϩⲁⲣⲉϩ ⲉⲣⲟϥ⳿ ϣⲁⲛⲧⲉϥϫⲉⲣⲟ
translation_literal: 'Jesus said, “I have cast fire upon the world, and see: I am keeping watch over it
  until it blazes.”'
commentary: 'The saying opens with a decisive act: Jesus has thrown ⲟⲩⲕⲱϩⲧ ("a fire") onto ⲡⲕⲟⲥⲙⲟⲥ, the
  κόσμος, the ordered human world. This is not a private inward warmth. It arrives in the world as a disruptive
  and living force, capable of illumination, testing, destruction, and change.


  Yet the image is not simply catastrophic. Jesus says he is ⲧⲏⲣⲉϩ, “keeping” or “guarding” it, until
  it ⲧⲉϥϫⲉⲣⲟ, until it catches fully and burns. The fire is watched over rather than abandoned: its unfolding
  has patience and purpose. The hearer is left before a searching question—what in the world, and what
  in oneself, is dry enough to ignite?


  Key Terms


  **ⲕⲱϩⲧ (fire)** — A force of illumination and consuming transformation.

  **ⲕⲟⲥⲙⲟⲥ (κόσμος)** — The world: the human order into which the fire is cast.

  **ϩⲁⲣⲉϩ** — To keep, preserve, or watch over attentively.

  **ϫⲉⲣⲟ** — To burn or flare up; to become fully kindled.


  Cross-Tradition Resonances


  **Luke 12:49:** Jesus declares that he came to cast fire upon the earth and longs for its kindling,
  closely echoing Thomas’s image. Divergence: Luke immediately joins the fire to Jesus’s impending baptism
  and the divisions his mission brings; Thomas leaves the image stark and unelaborated.

  **Jeremiah 20:9:** Jeremiah describes the divine word as a burning fire enclosed in his bones, an energy
  that cannot remain contained. Divergence: Jeremiah’s fire is the prophet’s inward burden to speak, whereas
  Thomas depicts fire cast upon the whole world.

  **Heraclitus, fragment B30 (DK):** Heraclitus names the cosmos an ever-living fire, kindling and going
  out according to measure. Divergence: Heraclitus offers a cosmological account of reality, while Thomas
  presents fire as an intentional act of Jesus.'
practice: 'Light a small candle and sit with it for five minutes. Ask quietly: “What false security needs
  to be burned away, and what living truth needs careful tending?” Write one concrete act for the next
  day that gives that truth room to take hold.'
