sanskrit_devanagari: ⲁⲩⲱ ⲡⲉϫⲁϥ ϫⲉⲡⲁϩⲉ ⲉⲑⲉⲣⲙⲏⲛⲉⲓⲁ ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ ϥⲛⲁ ⲁⲛ ⲙ̄ⲡⲙⲟⲩ ·
translation_literal: And he said, “Whoever finds the interpretation of these sayings will not taste death.”
commentary: 'The saying begins not with possession of the words but with finding their ⲉⲣⲙⲏⲛⲉⲓⲁ (hermēneia),
  “interpretation” or “unfolding meaning.” The sayings are presented as surfaces that require discovery:
  their life-giving force appears when the hearer enters and understands them.


  “To taste death” makes death an experience one might undergo, not merely an event to be defined. The
  promise need not deny bodily mortality; within the saying’s wisdom-shaped horizon, the one who reaches
  the sayings’ true sense participates already in a life over which death has no final mastery. Interpretation
  is therefore existential: it is a finding that changes the finder.


  Key Terms


  **ⲉⲣⲙⲏⲛⲉⲓⲁ** — “Interpretation,” a Greek loanword (hermēneia) for the meaning disclosed within the sayings.

  **ϣⲁϫⲉ** — “Sayings” or “words”; concise utterances requiring attentive reception.

  **ⲧⲁϩⲉ** — “Find”; not passive acquisition but successful discovery after seeking.

  **ⲙⲟⲩ** — “Death,” here portrayed as something that may be “tasted.”


  Cross-Tradition Resonances


  **John 8:51:** Jesus says that one who keeps his word will never see death, joining faithful reception
  of his speech with deliverance from death. Divergence: John frames the promise as keeping Jesus’ word,
  whereas Thomas emphasizes discovering the interpretation of the sayings.

  **Wisdom of Solomon 2:23–24:** Human beings are made for imperishability, while death is associated
  with estrangement from divine life. Divergence: Wisdom of Solomon offers a broad theological account
  of death’s entrance; this logion gives a concentrated promise attached to interpretive discovery.

  **Dhammapada 21:** “Heedfulness is the path to the deathless,” linking awakened attention with the deathless
  condition. Divergence: The Dhammapada grounds the deathless in vigilant discipline, while Thomas locates
  the decisive discovery in the interpretation of Jesus’ sayings.'
practice: 'Read the saying aloud three times, pausing after “finds.” Then sit quietly for five minutes
  with the question: “What meaning am I being asked to discover rather than merely repeat?” Write one
  concrete way that insight can be lived today.'
