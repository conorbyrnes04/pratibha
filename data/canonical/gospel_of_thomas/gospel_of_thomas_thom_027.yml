sanskrit_devanagari: ⲉⲧⲉ⟨ⲧⲛ̄⟩ⲧⲙ̄ ⲉⲡⲕⲟⲥⲙⲟⲥ ⲧⲉⲧⲛⲁϩⲉ ⲁⲛ⳿ ⲉⲧ ⲉⲧⲉⲧⲛ̄ⲧⲙ̄ⲉⲓⲣⲉ ⲙ̄ⲡⲥⲁⲙⲃⲁⲧⲟⲛ ⲛ̄ ⲛ̄ⲧⲉⲧⲛⲁⲛⲁⲩ ⲁⲛ ⲉⲡⲉⲓⲱⲧ⳿
translation_literal: If you do not fast from the world, you will not find. If you do not make the Sabbath
  a Sabbath, you will not see the Father.
commentary: 'The saying joins two disciplines: fasting from the ⲕⲟⲥⲙⲟⲥ (kosmos, “world”) and making Sabbath
  truly Sabbath. The first is not merely dietary abstinence. It names a loosening of the world’s grip—its
  appetites, measures of worth, and incessant demands. The terse clause, “you will not find,” leaves the
  object unstated in the supplied Coptic, making the failure itself emphatic: without such release, genuine
  discovery does not occur.


  The second image turns Sabbath from a calendar designation into an enacted reality: one must “make the
  Sabbath a Sabbath.” Rest becomes a deliberate practice of consecrated time, a refusal to let ordinary
  acquisition and agitation occupy everything. To “see the Father” is thus linked not to information or
  display, but to a life cleared of possession and hurried labor.


  Key Terms


  **ⲕⲟⲥⲙⲟⲥ (kosmos)** — “World”: the ordered human sphere that can become an object of attachment.

  **ⲛⲏⲥⲧⲉⲩⲉ (nēsteue)** — To fast; here, abstinence directed away from the world.

  **ⲥⲁⲙⲃⲁⲧⲟⲛ (sambaton)** — Sabbath, a Greek loanword for sacred rest.

  **ⲉⲓⲱⲧ (eiōt)** — Father; the divine reality to be seen.


  Cross-Tradition Resonances


  **Isaiah 58:6:** Isaiah identifies the fast God desires with release from oppressive bonds rather than
  mere deprivation. Divergence: Isaiah’s emphasis is explicitly social and ethical, while Thomas directs
  the fast toward freedom from “the world.”

  **Mark 2:27:** Jesus declares that the Sabbath was made for human beings, presenting it as a gift rather
  than a burden. Divergence: Mark addresses a dispute over Sabbath observance; this saying makes Sabbath-keeping
  a condition for seeing the Father.

  **Bhagavad Gita 2.71:** The Gita praises the person who abandons grasping and moves without possessiveness,
  finding peace. Divergence: The Gita frames this as liberation through renunciation of desire, whereas
  Thomas binds detachment to Sabbath and vision of the Father.'
practice: For one Sabbath-length period each week, set aside commerce, social media, and unnecessary acquisition.
  Eat simply, take an unhurried walk, and sit silently for ten minutes, noticing each impulse to possess,
  achieve, or distract yourself; release it without argument.
