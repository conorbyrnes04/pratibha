translation_literal: 'Jesus said, “I stood in the midst of the world, and I showed myself to them in flesh.
  I found them all drunk; I found none among them thirsty. My soul ached for the children of humankind,
  because they are blind in their hearts and do not see: they came into the world empty, and they also
  seek to leave the world empty. Yet now they are drunk. When they have shaken off their wine, then they
  will repent.”'
commentary: 'The saying begins with presence: Jesus “stood” (ⲁⲉⲓⲱϩⲉ ⲉⲣⲁⲧ) in the world’s midst and made
  himself known “in flesh” (ϩⲛ̄ⲥⲁⲣⲝ, from Greek sarx). Revelation is therefore not imagined as a distant
  heavenly message. It enters the human scene bodily, only to find a people too intoxicated to recognize
  either their lack or the one standing before them. The striking contrast is between being drunk and
  being thirsty: their fullness is a false fullness, numbing the very desire that could lead them toward
  life.


  Their blindness lies “in their heart,” the inward center of perception and intention. They arrive in
  the ⲕⲟⲥⲙⲟⲥ, the world-order, “empty” and intend to depart it equally empty—not because material life
  itself is condemned, but because they remain unawakened within it. The wine signifies an ensnaring condition
  of mind and appetite. Repentance comes only when its spell is cast off: not mere regret, but a recovered
  sobriety that can finally see and thirst.


  Key Terms


  **ⲥⲁⲣⲝ (sarx)** — “Flesh”; a Greek loanword stressing Jesus’ visible, embodied manifestation.

  **ⲕⲟⲥⲙⲟⲥ (kosmos)** — “World”; the ordered human realm in which people are lost, intoxicated, and summoned
  to wakefulness.

  **ⲙⲁⲩ ⲛ̄ϩⲏⲧ** — “Blind in their heart”; inward incapacity to perceive rather than simple lack of information.

  **ⲙⲉⲧⲁⲛⲟⲉⲓ** — “Repent”; a turning or change of mind made possible by sobriety.


  Cross-Tradition Resonances


  **Isaiah 29:9-10:** Isaiah depicts people as drunk, though not from wine, because their eyes and discernment
  have been closed. Divergence: Isaiah attributes the stupor within a prophetic judgment setting, while
  Thomas focuses on Jesus’ grief and the hearers’ eventual awakening.

  **Luke 21:34:** Jesus warns that hearts may be weighed down by drunkenness and worldly anxieties, leaving
  people unready to perceive the decisive moment. Divergence: Luke emphasizes vigilance for an approaching
  day, whereas this saying emphasizes the emptiness and blindness already present within the world.

  **Dhammapada 146-147:** The Buddhist verses ask why people remain heedless amid a burning world and
  urge recognition of bodily frailty and mortality. Divergence: The Dhammapada frames awakening without
  an incarnate revealer, while Thomas presents Jesus bodily standing among those who cannot yet see.'
practice: Before eating or drinking today, pause for one full minute in silence. Notice what you are using
  to dull hunger, grief, fear, or desire; then name one deeper thirst aloud and take one small, concrete
  action toward it.
