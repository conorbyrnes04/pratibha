translation_literal: 'Jesus said, “Blessed is the lion that a human being consumes: the lion will become
  human. But cursed is the human being whom a lion consumes: the lion will become human.”'
commentary: 'The saying turns on the same startling outcome in both clauses: the lion becomes human. What
  differs is the direction of eating. When the human consumes the lion, the beast is taken into human
  life and becomes human; when the lion consumes the human, the person is overcome, yet the lion again
  becomes human. Blessing and curse name not two different transformations but two opposed ways of arriving
  at one.


  ⲙⲟⲩⲉⲓ, “lion,” can suggest untamed appetite, violence, or the powerful animal element. The saying does
  not simply praise human mastery over beasts. Its compressed logic asks whether one can receive and transform
  what is fierce within oneself, rather than be swallowed by it. To consume the lion is to give instinct
  a human form; to be consumed by it is to let instinct take over one’s humanity.


  Key Terms


  **ⲙⲁⲕⲁⲣⲓⲟⲥ** — “Blessed,” a Greek loanword (makarios) denoting a fortunate or flourishing condition.

  **ⲙⲟⲩⲉⲓ** — “Lion,” the recurring figure whose relation to the human determines blessing or curse.

  **ⲣⲱⲙⲉ** — “Human being/person,” the form into which the lion is said to become.

  **ⲟⲩⲱⲙ** — “Eat, consume”; the bodily action that conveys a deeper transformation.


  Cross-Tradition Resonances


  **Mark 7:15:** Jesus says that nothing entering a person from outside can defile them; this saying likewise
  treats ingestion as spiritually significant rather than merely physical. Divergence: Mark denies that
  food itself corrupts, whereas Thomas makes eating a paradoxical image of transformation.

  **1 Peter 5:8:** The adversary is compared to a roaring lion seeking someone to devour, making the lion
  an image of destructive force. Divergence: Thomas does not identify the lion with a demon or external
  enemy; its concern is the transformation of lion and human alike.

  **Isaiah 11:6–9:** Isaiah imagines a reconciled creation in which dangerous animals no longer harm,
  including the lion’s altered relation to other creatures. Divergence: Isaiah pictures peace among distinct
  creatures, while Thomas speaks in the more unsettling language of one creature becoming human through
  eating.'
practice: At one meal today, pause before the first bite and name one fierce impulse—anger, craving, fear,
  ambition. Eat slowly, asking how that energy might be given a humane form through one deliberate act
  of care.
