translation_literal: Jesus said, “What you hear in one ear, proclaim from the other upon your rooftops.
  For no one lights a lamp and puts it under a basket, nor does one set it in a concealed place. Instead,
  one puts it on a lampstand, so that everyone entering and everyone going out may see its light.”
commentary: 'The saying begins with a movement from intimate reception to open utterance: what is heard
  “in one ear” is to pass through the hearer and be voiced “from the other.” The image does not commend
  noise for its own sake. What has truly been heard is not to be stopped up, privatized, or retained as
  secret possession; it is to become audible from the rooftops.


  The lamp image sharpens this claim. ⲏⲃⲥ, “lamp,” is made to give light, and concealment contradicts
  its purpose. The final horizon is notably wide: not merely a gathered circle, but all who are “entering”
  and “going out.” Light serves people in transit. The saying therefore imagines insight as something
  entrusted to a person not for hoarding, but for making the shared human passage more visible.


  Key Terms


  **ⲙⲁⲁϫⲉ** — ear; the intimate place of receiving what is heard.

  **ⲏⲃⲥ** — lamp; a small light whose proper work is illumination.

  **ϩⲏⲡ** — hidden, concealed; what is kept out of sight.

  **ⲧⲉⲩⲉ** — lampstand; the raised placement from which a lamp can serve all.


  Cross-Tradition Resonances


  **Matthew 5:15–16:** Jesus likewise says that a lamp belongs on a stand, where it gives light to everyone
  in the house. Divergence: Matthew explicitly directs the image toward visible good works and glorifying
  the Father, while Thomas stresses the open transmission of what has been heard.

  **Mark 4:21–22:** Mark asks whether a lamp is brought in to be put under a basket rather than on a stand,
  joining light with disclosure. Divergence: Mark immediately frames hidden things as destined to be revealed;
  this saying centers more concretely on proclamation and the usefulness of light.

  **Qur’an 24:35:** The Light Verse portrays divine light through the vivid image of a lamp shining from
  its niche. Divergence: The Qur’anic verse is a dense theological meditation on God as the light of the
  heavens and earth, whereas Thomas offers an imperative about the non-concealment of received insight.'
practice: At dusk, light a small lamp or candle and place it where it genuinely helps someone move through
  a room. Sit beside it for three minutes, then name one truth you have received but kept private; share
  it today with one person in a clear, non-coercive sentence.
