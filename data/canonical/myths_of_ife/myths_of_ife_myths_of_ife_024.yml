pratibha_layers:
- kind: original
  label: Original
  body: 'Then Odudúwa

    Transformed to stone and sank beneath the soil,

    Bearing away the fateful bag.

    And thus,

    Beneath, through all the ages of the World

    A voiceless lore and arts which found no teacher

    Have lain in bondage.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Odudúwa becomes stone and sinks with
    the bag. Ógun is left a diminished crown.'
