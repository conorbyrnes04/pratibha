- kind: key_terms
  label: Key Terms
  items:
  - term: transformed to stone
    definition: Odúwa's last act -> exit that sequesters the bag -> apotheosis-as-rock is not honour here;
      it is refusal
  - term: voiceless lore
    definition: arts under the soil with no teacher -> knowledge as something that can be gagged -> "lost
      wisdom" sounds romantic; bondage is the recitation's word
  - term: fateful bag
    definition: the gift that undid a world by being held wrong -> fate as the long consequence of a roadside
      stealth -> not a destiny assigned by Him-Who-Speaks-Not in the opening gift, but a fate Odúwa chose
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heart Sutra, "Form Is Emptiness, Emptiness Is Form"
    resonance: Both confront a treasure that cannot be handled as a solid possession without losing what
      it was.
    divergence: The sūtra frees by seeing form and emptiness as inseparable; Odúwa solidifies himself
      and the bag into stone, which is the wrong metaphysics of a lore that needed a mouth.
  - citation: Conference of the Birds, "The Parrot's Beautiful Captivity"
    resonance: Both show a precious thing locked away until it cannot do its work in the world.
    divergence: The parrot still speaks inside the cage; the bag in bondage does not speak at all, and
      the jailer has become the jail.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one skill, document, or introduction you have buried so that it would not make another person
    shine. Write the first page of it, or speak the introduction, today. Do not take it to stone with
    you.
