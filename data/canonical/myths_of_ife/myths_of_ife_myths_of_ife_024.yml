unit_id: myths_of_ife.myths_of_ife_024
unit_label: The Bag Sinks Voiceless
title: The Bag Sinks Voiceless
unit_type: teaching_passage
commentary: 'The claim is that some knowledge can be imprisoned in the earth by a will that would rather
  bury it than restore it. Odúwa, offered a way back to the father''s hills and a diminished chieftaincy
  for Ógun, chooses neither teaching nor reign. He becomes stone. The bag goes with him. Voiceless lore
  is the exact remainder: the arts exist, they have no mouth, they have no teacher, they are in bondage.
  This is the opposite of the Òrní''s opening boast. Truth has a home at shrines — and a portion of truth
  has been made homeless under the soil by the first king. The contested move is to refuse a happy recovery.
  Many myths would have Orísha open the bag at last. Ìfẹ̀ says the bag is still below. Whatever men later
  learn, they learn without that full clue. The theft''s last success is silence, not use. Existentially,
  the teaching is about the spite that would fossilize a gift. If I cannot be the one who spells strange
  benefits, no one will. Stone is that sentence given a body. Check the places in your work where you
  have sunk a skill so that a rival cannot teach it. Digging it up would be repentance. Leaving it voiceless
  is how ages of the world stay poorer than they needed to be.'
