- kind: key_terms
  label: Key Terms
  items:
  - term: by stealth
    definition: Odúwa's method on the road -> kingship uses night and sleep, not argument, once farewell
      has closed the case -> "trickster" imports Éshu; Éshu is not in this theft
  - term: will of God undone
    definition: Arámfè's split reversed by the theft -> the world can be made against the maker's assignment
      -> not atheism; the will is real and violated
  - term: World of envy and of war
    definition: what the stolen founding actually produces -> climate of the new earth, not an episode
      -> "fallen world" is too Edenic; this world is called forth already envious
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: A.B. Ellis, Yoruba òwe, "A jealous woman has no flesh upon her breast"
    resonance: Both treat envy as a wasting climate that hollows the one who holds it, not as a passing
      mood.
    divergence: Ellis's proverb moralizes a household vice; the Ìfẹ̀ recitation makes envy the founding
      weather of the world Odúwa calls from the sea.
  - citation: Conference of the Birds, "The Parrot's Beautiful Captivity"
    resonance: Both show a treasure or beauty held in the wrong way, so that possession becomes a cage.
    divergence: The parrot's cage is fear of losing beauty; Odúwa's theft is ambition to own the arts,
      and the cage will be a bag that will not speak.
- kind: practice
  label: Practice (Abhyasa)
  body: Identify one advantage you hold that was taken while someone abler in that craft was not watching.
    Do not confess in public theater. Return the usable part, or else stop calling the advantage a gift.
