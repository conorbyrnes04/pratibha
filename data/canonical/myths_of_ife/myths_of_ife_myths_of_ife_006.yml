work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_006
unit_label: The Bag Stolen on the Road
title: The Bag Stolen on the Road
unit_type: teaching_passage
commentary: 'The claim is that the world we inhabit is founded on a theft, and that the theft is not a
  side-plot but the means of creation. Odúwa does not steal after the land exists. He steals on the road,
  then uses the sand — his rightful tool — to call land from sea, and the bag comes with him into that
  land. The will of God undone is Arámfè''s distribution, not the project of a world as such. The sons
  still make a world. They make it wrong-handed: envy and war are not later moral failures imported into
  an innocent earth; they are the signature of how earth was called. Sleep is part of the metaphysics.
  Orísha, wisest, can be robbed because wisdom sleeps on a roadside like any traveler. Kingship stays
  awake enough to take what it was refused. The recitation will spend the middle books showing that the
  bag without its clue cannot be opened — theft gets the object and misses the art. That later irony does
  not soften this sentence. A world can be geographically successful and theologically stolen. Existentially,
  the teaching is uncomfortable for anyone who thinks their household, company, or nation was raised from
  chaos by clean tools. Ask what was taken while a wiser office slept. The sand may be yours. The bag
  may not. If both are in your hand, envy is already the climate, even when the new shore looks like triumph.'
