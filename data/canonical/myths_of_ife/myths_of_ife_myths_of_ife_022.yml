- kind: key_terms
  label: Key Terms
  items:
  - term: Osányi
    definition: priest and maker of charms for mortal soldiers -> what the tradition actually kept from
      the long war -> "magician" is colonial; he is the named technician of survival
  - term: two hundred years
    definition: the said duration of divine anger -> time without a story -> chronology without legend
      is the point
  - term: no voice called through
    definition: the priests' admission of blankness -> living speech can refuse to carry a war -> "lost
      history" implies an accident; this sounds like a held silence
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lalla Vakyani, "The Mantra of Silence"
    resonance: Both treat a withheld word as a spiritual fact, not as a failure of memory alone.
    divergence: Lalla's silence is a mantra toward Śiva; Ìfẹ̀'s silence is the blank where war-legend
      would have been, and the kept words are a priest's amulets.
  - citation: Tao Te Ching 2 and 56
    resonance: Both suspect that the loud career of doing and winning is not what the wise transmit.
    divergence: The Daoist sage practices non-display; the Ìfẹ̀ priests display the blank itself, as if
      the war earned no song.
- kind: practice
  label: Practice (Abhyasa)
  body: Take one old conflict you still narrate as an epic. Write three sentences about the unglamorous
    things that kept people intact, and leave the "great deeds" unwritten today. Let a blank be a judgment.
