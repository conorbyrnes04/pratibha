category: root_text
work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_022
unit_label: Two Hundred Years without a Legend
title: Two Hundred Years without a Legend
unit_type: teaching_passage
commentary: 'The claim is that a war can last centuries and still fail to become knowledge, while the
  technician of survival is remembered. Two hundred years is "''tis said." What "we know" is Osányi and
  the amulets. The priests of Ìfẹ̀, whose opening boast was that truth lives in their mouths, here admit
  a blank. Heroic narrative did not survive. Technique did. That inversion is the philosophy. Living speech
  is not obliged to glorify the fall. It can keep the names of those who tried to keep soldiers alive
  and drop the saga of who almost won. The contested move is to treat the absence of legend as a kind
  of judgment. Dimness is not a research gap for the colonial notebook to fill. It is what the tradition
  chose, or what the war deserved. Great deeds that are not handed down cannot instruct. Charms that are
  handed down still do not justify the anger. Existentially, the teaching asks what you keep from your
  own long conflicts. If you remember only your epic and forget the dull devices that kept people from
  dying, you have inverted Ìfẹ̀''s archive. If you remember only devices and never name the anger that
  made them necessary, you have the other half. The baffling years are a warning: some victories are not
  worth a voice.'
