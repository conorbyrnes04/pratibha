pratibha_layers:
- kind: original
  label: Original
  body: '''Tis said the anger of the Gods endured two hundred years:

    we know the priest Osányi made strange amulets

    for all the mortal soldiers of the Gods. . .

    but not one word of the great deeds, of hopes and fears,

    of imminent defeat or victory snatched away

    is handed down: no legend has defied, no voice

    called through the dimness and the baffling years.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Osányi (priest, maker of charms).
    The blank is the teaching: charms remembered, deeds not.'
- kind: translation
  label: Pratibha Translation
  body: It is said the anger of the gods endured two hundred years. We know Osányi made strange amulets
    for the mortal soldiers — charms to turn a spear, rob a sword of sting, make one terrible. Not one
    word of the great deeds, hopes, fears, near defeat, or snatched victory is handed down. No legend
    has defied the dimness. No voice has called through the baffling years.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that a war can last centuries and still fail to become knowledge, while the technician
