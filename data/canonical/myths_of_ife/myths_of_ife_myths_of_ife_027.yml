pratibha_layers:
- kind: original
  label: Original
  body: 'But to these colonists the Gods, their Fathers,

    Gave no good gifts: ''midst battles with the Wild the town grew.

    And the longed-for voice came to Olúbo:

    "See with the rain I come each year upon your fields:

    Your work of yester-year is all undone

    By my swift desolation. Be this your symbol:

    Go thus against the Scornful Ones arrayed as I."'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Úbo (first daughter-town of Ìfẹ̀);
    Olúbo; the Forest-God. Festival license and sacrifice notes excluded.'
- kind: translation
  label: Pratibha Translation
  body: 'To the colonists of Úbo the gods, their fathers, give no good gifts. The town grows through battles
    with the wild. The Forest-God speaks: each year I come with rain, trees, rank grass; I undo last year''s
    work. Let that be your symbol. Go against the Scornful Ones arrayed as I. Later, fire — the fire the
    vulture brought — undoes grass.'
