unit_id: myths_of_ife.myths_of_ife_027
unit_label: Arrayed as the Forest
title: Arrayed as the Forest
unit_type: teaching_passage
commentary: 'The claim is that a people given no gifts will learn a god by the way that god undoes them,
  and that mimicry of undoing is a dangerous politics. Úbo is Ìfẹ̀''s first daughter and is sent out empty-handed.
  Dull remembrance of unnatural wrongs — the long war, the sunk bag — breeds the first rebel thought against
  the gods. The Forest-God does not console. He offers his own annual desolation as a symbol: come as
  I come, arrayed as rank growth, and take the scornful city that laughed (who lights a lamp between the
  leopard''s paws?). Grass-clad men scale walls in a festival hour. Fire answers grass. The philosophical
  core is not the later festival''s license; it is the logic of array. To be arrayed as the forest is
  to become the force that erases human year-work. Ìfẹ̀ had appointed Olókun to curb the sea; it did not
  appoint a curb for its own scorn. A daughter-town without gifts becomes wilderness on purpose. Existentially,
  the teaching is about neglected colonies of your own life — projects, people, rooms you sent out with
  no arts. If they return arrayed as what undoes you, the forest is not mysterious. You taught them scarcity,
  and a god of scarcity gave them a symbol. Fire will "win" and still not have been a gift. The deeper
  repair would have been to send arts the first time.'
