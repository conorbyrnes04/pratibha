- kind: key_terms
  label: Key Terms
  items:
  - term: Úbo
    definition: first daughter of Odúwa's city, given no good gifts -> colony as the birth of rebel thought
      -> not a footnote town; she is what Ìfẹ̀ becomes when it scorns its own young
  - term: arrayed as I
    definition: 'the Forest-God''s symbol: come as annual desolation -> mimicry of the wild as strategy
      -> do not turn this into costume-instruction; the thought is political ecology'
  - term: Scornful Ones
    definition: Ìfẹ̀ as seen from Úbo -> laughers who light a lamp between leopard's paws -> scorn is
      the gift they did give
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 76
    resonance: Both know that the rigid and scornful break, and that what is living is grass-like, rank,
      returning.
    divergence: The Dao prefers the soft for life; here grass-array is also an army, and fire — a sent
      heavenly gift — undoes it. Softness is not automatically innocent.
  - citation: Senegalese Animism, "The Woods Are Sanctuaries"
    resonance: Both treat forest as an agent that can enter human politics, not as scenery.
    divergence: Serer woods shelter presence and cult; this Forest-God lends his desolation as a rebel
      symbol against a scornful mother-city.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one "colony" you sent out with no good gifts — a person, team, or habit you expected to fend
    in the wild. Send one real art today (a tool, a teaching, a share). Do not wait to fight them when
    they come back as grass.
