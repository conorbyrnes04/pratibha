- kind: key_terms
  label: Key Terms
  items:
  - term: Odúm’la
    definition: first Òrní, left on earth when the Great Gods passed -> father of a mourning people and
      continuing mouth of the invisible -> "first king" misses the inspired utterance
  - term: soul abode
    definition: Ífa finds the son in whom Odúm’la's soul remains -> succession by indwelling, not by vote
      -> transmigration here is of an office-soul, not of every person
  - term: these lips pronounce
    definition: 'the present Òrní''s claim -> Odudúwa and Orísha still have a human mouth on sacred days
      -> "recitation" as performance understates the ontology: the Being is about, within'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Father Has Come Again"
    resonance: Both teach that a departed presence returns in a living body and is recognized by name
      and role.
    divergence: Johnson describes ordinary parents reborn as Babatunde and Yetunde; here a single office-soul
      of Odúm’la abides in the Òrní so that two vanished gods can still speak.
  - citation: Bhagavad Gita 4.4–6, "Births Many, Memory One"
    resonance: Both hold that one continuing awareness can occupy a series of bodies without becoming
      a new person each time.
    divergence: Krishna remembers all births while Arjuna does not; the Òrní's continuity is discerned
      by Ífa and enacted as liturgical speech, not as a god's private memory of aeons.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Choose one office you actually hold — parent, teacher, chair, elder sibling. Speak one sentence
    today that is not yours: a sentence the work itself requires. Do not sign it with your personality.
    Let the office use the lips.'
