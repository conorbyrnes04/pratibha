pratibha_layers:
- kind: original
  label: Original
  body: 'They left on Earth Órní Odúm’la charged

    To tend the shrines and utter solemn words

    Inspired by Those invisible. And when

    Odúm’la''s time had come to yield the crown,

    Ífa proclaimed that son with whom Odúm’la''s soul abode.

    And now with me that Being is—about, within—

    And on our sacred days these lips pronounce

    The words of Odudúwa and Orísha.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Odúm’la (first Òrní); Òrní; Ífa (messenger,
    who names the son in whom the soul abides).'
- kind: translation
  label: Pratibha Translation
  body: When the Great Gods pass from sight, they leave Òrní Odúm’la to father a mourning people, tend
