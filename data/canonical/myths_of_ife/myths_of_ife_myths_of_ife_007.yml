unit_id: myths_of_ife.myths_of_ife_007
unit_label: Odúm’la Speaks in the Òrní
title: Odúm’la Speaks in the Òrní
unit_type: teaching_passage
commentary: 'The claim is that divine speech did not end when the gods vanished; it changed bodies. Odúm’la
  is not a memorial official. He is charged to utter solemn words inspired by Those invisible, and his
  soul abides in a son Ífa can recognize. The present Òrní does not say he remembers the gods. He says
  that Being is about and within him, and that his lips, on sacred days, pronounce Odudúwa and Orísha.
  This is succession as incarnation of office, not as legal inheritance alone. The people are mourning
  because the Great Ones have gone to Arámfè''s hills; the cure for mourning is not nostalgia but a mouth
  that still hosts them. Ífa''s role matters. The messenger who will elsewhere carry requests to the father
  here discerns where a soul has lodged. Wisdom in Ìfẹ̀ is often this: finding the correct body for a
  continuing presence. The unit must not be turned into a general West African reincarnation essay, and
  it must not be Christianized into a single incarnation. The recitation''s precision is local and serial:
  from Odúm’la to son to this Òrní, one Being, many bodies, two gods still speaking. Existentially, the
  teaching asks whether any office you hold is only your career. Some work is a soul that abides — a charge
  to father the mourning and keep speaking words you did not invent. If you cannot say "with me that Being
  is," you may be holding a title without the mouth.'
