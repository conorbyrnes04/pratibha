work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_023
unit_label: Who Has No House Will Buy No Broom
title: Who Has No House Will Buy No Broom
unit_type: teaching_passage
commentary: 'The claim is that possession without competence is empty, and that a maker does not ruin
  his own house for sport. Ógun, warrior-son, is tired. He uses a proverb the way Ìfẹ̀ thinks: a broom
  is for a house. No one buys the tool if they have nowhere to sweep. Orísha made men in love; he has
  no motive to unhouse them. Therefore the war''s cause cannot be Orísha''s taste for plague. It is the
  bag held without its clue. The clue is not in the cloth. It is Orísha''s skill — the only waking agent
  of the sleeping lore. Odúwa has the object and not the art. Empire of nations is already his; it does
  not console him, because envy wanted the inner treasure, not the map. The contested move is a son''s
  disloyalty in the name of peace. Ógun joins "enemies" by telling the truth of the theft to the thief.
  Soft voices of the night have already asked for sleep; now iron asks for return. Existentially, the
  teaching is about tools you keep as trophies. If you cannot wake what you hold, you do not hold it.
  You hold a bag-shaped grievance. Buy no broom until you have a house — and if you stole a house-lore,
  give it back to the sweeper.'
