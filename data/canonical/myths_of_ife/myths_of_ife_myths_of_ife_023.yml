pratibha_layers:
- kind: original
  label: Original
  body: 'What means this empty war between one mother''s sons?

    ''Twas said of old ''Who has no house will buy no broom.''

    Why then did Great Orísha bring plagues

    on those he made in love? . . . The bag you seized;

    but not its clue—the skill, the wisdom

    Of Great Orísha which alone could wake

    The sleeping lore.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Ógun speaking; Odúwa; Orísha. The
    broom saying is a Yoruba òwe in Wyndham''s English.'
- kind: translation
  label: Pratibha Translation
  body: 'Ógun stands before the king at dawn: what means this empty war between one mother''s sons? You
    say Orísha willed it. Of old it is said, who has no house will buy no broom. Why then would Orísha
    bring plagues on those he made in love? You seized the bag, but not its clue — the skill and wisdom
    that alone can wake the sleeping lore. Give the nations; give back the bag.'
