- kind: key_terms
  label: Key Terms
  items:
  - term: Who has no house will buy no broom
    definition: 'Yoruba saying in Wyndham''s English -> you do not acquire a tool against your own interest
      -> Ógun applies it: Orísha will not plague the people he made'
  - term: clue
    definition: Orísha's skill and wisdom, not in the seized bag -> the waking agent of lore -> "key"
      is close; clue also means the thread you must follow, which Odúwa never had
  - term: sleeping lore
    definition: arts that cannot teach themselves -> knowledge as something that must be woken by the
      right mind -> a stolen book, in this metaphysics, stays asleep
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: A.B. Ellis, Yoruba òwe, "He who owns the inner square of the house is…"
    resonance: Both use house-speech to decide who actually holds an interior competence.
    divergence: Ellis's proverb ranks the inner-square owner; Ógun says the inner lore has an owner who
      is not the king holding the bag.
  - citation: Lalla Vakyani, "I Found Him in My Own House"
    resonance: Both place the needed thing in a house — but one finds, the other cannot wake what he seized.
    divergence: Lalla's house yields Śiva to the one who looks inward; Odúwa's seized bag yields nothing,
      because the house of lore is Orísha's skill.
- kind: practice
  label: Practice (Abhyasa)
  body: Find one object, title, or login you keep that you cannot actually use well. Return it, or sit
    with the person who has the clue and let them wake it. Do not call unread ownership "leadership."
