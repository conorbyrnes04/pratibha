- kind: key_terms
  label: Key Terms
  items:
  - term: Olókun
    definition: 'goddess of the sea, set to curb hungry waves -> dominion inside the destructive element,
      not its erasure -> reducing her to "wealth" or to later cult-notes misses this first task: hold
      the coast'
  - term: Olóssa
    definition: goddess of the lagoons -> the near water that laps fruitful banks and receives thanks
      -> not a lesser Olókun; a different office at the edge of fields
  - term: curb
    definition: Odúwa's verb for what rule does to waves -> limit as care for the new-rising world ->
      "conquer" is the wrong verb; the sea remains
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalms (Tehillim), Psalm 104
    resonance: Both imagine the sea as a hungry power that must be bounded so that land and human work
      can stand.
    divergence: The psalm's boundary is YHWH's decree; here Odúwa appoints a goddess to live in the sea
      as its queen, and thanks will go to her, not only to the high father.
  - citation: Senegalese Animism, "One Does Not Address God; One Addresses the Spirits"
    resonance: Both put the working relationship at a local power of water rather than at the silent or
      sky-high absolute.
    divergence: Serer practice never addresses Roog; Ìfẹ̀ men will bring gifts to Olókun and Olóssa while
      Him-Who-Speaks-Not remains unspoken.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one recurring force you have been trying to dry up. Name it, give it a precinct (when and
    where it may move), and curb it there for a day. Do not pretend it will vanish.
