unit_label: Olókun Set to Curb the Sea
title: Olókun Set to Curb the Sea
unit_type: teaching_passage
commentary: 'The claim is that a world cannot be held by sand alone; the destructive element must be given
  a queen, not merely opposed. Waves suck the crumbling shore; lagoons climb into reedy swamp. Odúwa''s
  answer is office. Olókun is not asked to dry the ocean. She is told to rule it — curb, not cancel. Olóssa
  receives the near waters, the fruitful bank, the human thanks that will come later. Restraint is a dominion,
  not a negation. This is political ecology before there are cities: hunger of waves is acknowledged as
  permanent ("for ever"), and therefore it needs a ruler who lives inside that hunger. Men will bring
  gifts because a curbed sea is already a benefaction. The unit must not become a manual of offerings.
  The philosophical gift is the appointment. Chaos becomes addressable when it has a name and a job. Until
  Olókun, water is ungoverned roar. After her, the same water is a kingdom that can be asked to remember
  the coastlands. Existentially, the teaching is about forces you keep trying to abolish. Anger, appetite,
  flood-work, grief: some of these will not die. They can be given a curb and a precinct. A queen of the
  sea is not a fantasy of control. She is the refusal to leave hunger untitled, because untitled hunger
  eats the world.'
