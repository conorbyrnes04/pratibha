pratibha_layers:
- kind: original
  label: Original
  body: 'So Odudúwa called Olókun and Olóssa to the cliff:

    "Beneath, the waters wrestle with the new-rising World,

    and would destroy our kingdom and undo Arámfè''s will.

    Olókun! to the sea! For there your rule shall be:

    To curb the hungry waves upon the coastlands for ever.

    And you, Olóssa, where your ripple laps the fruitful bank,

    shall see continually the offerings of thankful men."'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Olókun (sea); Olóssa (lagoons); Odudúwa
    appointing their offices from the cliff.'
- kind: translation
  label: Pratibha Translation
  body: Odudúwa calls Olókun and Olóssa to the cliff. Beneath, the waters wrestle the new-rising world
    and would undo Arámfè's will. Olókun is sent to the sea, to curb hungry waves on the coastlands forever.
    Olóssa is sent to the lagoons, where her ripple laps the fruitful bank and thankful men will bring
    offerings.
