- kind: key_terms
  label: Key Terms
  items:
  - term: Ojúmu
    definition: the wise priest sent down the chain -> pourer of sand, already necessary before humankind
      -> "assistant" misses that earth begins as a priestly act
  - term: five-clawed Bird
    definition: Arámfè's creature, loosed to scatter land -> land as what a bird can scratch from poured
      sand -> not an emblem to decode from later bestiaries; the recitation gives the function, not a
      Yoruba species-name beyond Bird
  - term: magic sand
    definition: the sand of power Arámfè gave Odúwa -> almost nothing, enough to call shore from flood
      -> "magic" is Wyndham's English; the force is assigned power, not stage trick
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalms (Tehillim), Psalm 104
    resonance: Both imagine dry land as a victory over waters that would cover everything if unbounded.
    divergence: The psalm's founder speaks and sets a boundary; here a priest pours and a bird scatters,
      and the next lines will show the sea still sucking the shore away.
  - citation: Tao Te Ching 78
    resonance: Both trust what is small, grainy, or yielding against what looks like unmastered flood.
    divergence: Daoist water overcomes by softness; this sand overcomes water only as it is poured under
      command, and the marsh will keep pressing.
- kind: practice
  label: Practice (Abhyasa)
  body: Take the smallest real tool you have for a task you have been calling oceanic. Use it for fifteen
    minutes — pour, scratch, scatter. Do not wait for a better instrument.
