pratibha_layers:
- kind: original
  label: Original
  body: 'So spoke

    Orísha; and Odúwa hung a chain

    Over the cliff to the dark water''s face,

    And sent Ojúmu, the wise priest, to pour

    The magic sand upon the sea and loose

    The five-clawed Bird to scatter far and wide

    Triumphant land.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Odúwa; Ojúmu (the wise priest who
    pours); the five-clawed Bird; the sand of power.'
- kind: translation
  label: Pratibha Translation
  body: Odúwa hangs a chain from the cliff to the dark water. He sends Ojúmu, the wise priest, to pour
    the magic sand upon the sea and loose the five-clawed Bird. The bird scatters triumphant land far
    and wide.
