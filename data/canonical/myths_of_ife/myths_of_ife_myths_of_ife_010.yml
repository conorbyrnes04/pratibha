unit_id: myths_of_ife.myths_of_ife_010
unit_label: Sand and the Five-Clawed Bird
title: Sand and the Five-Clawed Bird
unit_type: teaching_passage
commentary: 'The claim is that earth is not spoken into being by a king alone; it is poured and scratched
  into being by a priest and a bird. Odúwa hangs the chain — he still has the nerve to connect Heaven''s
  brink to the water''s face — but the actual making is delegated. Ojúmu pours. The five-clawed Bird scatters.
  Land is triumphant, yet it will immediately begin to crumble under waves. The philosophy is in the instruments.
  Sand of power is almost nothing: grain against flood. A bird with five claws is almost comic against
  an unmastered sea. Ìfẹ̀ cosmogony trusts the small tool that has been given, not a second sun. The priest''s
  presence at the first act also matters. Before there are men, there is already a wise pourer. Cult does
  not arrive after nature as decoration; a priest is part of how nature is possible. This must not be
  inflated with later Ifá manuals or with Fabunmi''s city lore. The recitation gives a chain, sand, bird,
  priest, and a land that wins only as it is scattered. Existentially, the teaching is against waiting
  for a complete method. If you have sand and a bird, you pour. Triumphant land is a scatter, not a finished
  map. The waves will have their chapter. Your job at the brink is to let the small charmed thing do the
  work your fear called impossible.'
