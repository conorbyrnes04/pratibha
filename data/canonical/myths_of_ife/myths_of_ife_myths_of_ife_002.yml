pratibha_layers:
- kind: original
  label: Original
  body: 'You have not even heard

    Of the grey hour when my young eyes first opened

    To gaze upon a herbless Mass, unshaped

    And unadorned. I laboured and the grim years passed:

    The unshapely I had formed to beauty,

    And as the ages came I loved to make

    The beautiful more fair. . . All went not well.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Arámfè (father of the gods, thunder;
    spoken of as God). Him-Who-Speaks-Not is Wyndham''s English for the higher distant Being some priests
    mention.'
- kind: translation
  label: Pratibha Translation
  body: You have not even heard of the grey hour when my young eyes first opened on a herbless Mass, unshaped
    and unadorned. I knew the heart of Him-Who-Speaks-Not, the far-felt Purpose that gave me birth. I
    laboured. Streams, stars, hills, and birdsong came. I formed the unshapely to beauty, and then loved
    to make the beautiful more fair. All did not go well.
- kind: commentary
  label: Pratibha Commentary
