- kind: key_terms
  label: Key Terms
  items:
  - term: Arámfè
    definition: father of the gods, thunder, often spoken of as God in this recitation -> maker who remembers
      Mass and tottering, not an idle sky-king -> collapsing him into Olorun from later handbooks imports
      a name Wyndham's priests do not use here
  - term: Mass
    definition: herbless, unshaped, unadorned stuff before Heaven -> the given that must be led, not the
      enemy of godhead -> "chaos" is too Greek; Mass is nerveless and cold, awaiting labour
  - term: All went not well
    definition: Arámfè's verdict on his own making -> failure belongs inside divine work, not after it
      as a human accident -> omnipotence-as-ease is the default this line refuses
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalms (Tehillim), Psalm 104
    resonance: Both remember creation as the setting of bounds, waters, hills, and living things rather
      than as a finished ornament dropped from nowhere.
    divergence: The psalm praises YHWH whose word and wisdom hold the order; Arámfè narrates grim years,
      tottering, and a Mass that did not all go well.
  - citation: Tao Te Ching 25
    resonance: Both set a prior, almost unshapely something before the named heavens and the work of ordering.
    divergence: The Dao is nameless and does not labour as a father-god; Arámfè is a worker who knows
      a still higher Purpose and admits that parts of the work preyed on other parts.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one thing you made that later tore its banks or came out loathsome. Do not scrap the whole.
    Spend twenty minutes repairing one edge of it, as Arámfè kept the scarred hills inside Heaven.
