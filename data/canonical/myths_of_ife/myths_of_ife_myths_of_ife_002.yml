unit_id: myths_of_ife.myths_of_ife_002
unit_label: Arámfè Made Heaven from Mass
title: Arámfè Made Heaven from Mass
unit_type: teaching_passage
commentary: 'The claim is that heaven is achieved work, not a given palace, and that achievement does
  not cancel failure. Arámfè''s sons know only wine, chorus, and sunrise. He remembers Mass: herbless,
  unshaped, unadorned. Creation here is not a word that instantly completes a world. It is grim years,
  hazardous leading of unshapely stuff along a cliff''s-edge way toward Paradise. The counterintuitive
  move is the last clause. All went not well. A noble animal emerges loathsome; a river tears its banks;
  cataract and precipice remain as scars of days when Heaven tottered. The father of the gods does not
  hide the wreckage inside a doctrine of omnipotent ease. He makes it the content of godhead: if the accomplished
  whole is Heaven, the anxious years are a destiny for gods. This is not Wyndham''s Golden Bough guesswork
  and not a colonial fable of primitive cosmology. It is an Ìfẹ̀ argument about what it means to be a
  maker. Beauty is not the opposite of labour. Beauty is labour that has learned to love increment — and
  still admits predation, flood, and rift. Existentially, the teaching cuts the wish that a good order,
  once founded, should stay effortless. If even Heaven remembers tottering, your own making is not disqualified
  by the parts that went badly. The work is to keep forming, and to say the failure without surrendering
  the Purpose that gave the work birth.'
