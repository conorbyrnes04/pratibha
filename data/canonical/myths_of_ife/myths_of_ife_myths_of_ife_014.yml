work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_014
unit_label: Images Thrown into Wombs
title: Images Thrown into Wombs
unit_type: teaching_passage
commentary: 'The claim is that humankind begins as yearning answered in the dark, not as a finished creature
  placed in a garden. Orísha still does not have the opened bag; he has the office of making. He yearns.
  He calls shades who already long. He throws images — forms, not yet sunlit persons — into wombs that
  belong to Night and to the water-queens. Birth is therefore a collaboration of the maker with goddesses
  of darkness and sea. The children arrive able to feel wind and unable to know light. Blindness here
  is not punishment. It is the climate of a sunless age: you cannot miss a sun you have never had. The
  contested move is to create anyway. A cautious god would wait for Day. Orísha will not leave the hungering
  mute until the weather improves. Later he will complain to Odúwa that their day is endless night — the
  maker becomes the advocate of his unfinished people. Johnson will say Orisala shapes a lump; this recitation
  says images are thrown into wombs in gloom. Keep the versions distinct. The Ìfẹ̀ sentence is wetter
  and more maternal, and it refuses to make first people spectators of a completed world. They are the
  world trying to have eyes. Existentially, the teaching blesses work done before the lighting is good.
  If you only make when you can guarantee recognition, you will make no one. Throw the image. Let the
  child feel wind. Light can be asked for later; life cannot be postponed to the day it will understand
  itself.'
