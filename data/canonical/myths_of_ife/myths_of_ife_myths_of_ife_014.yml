pratibha_layers:
- kind: original
  label: Original
  body: 'Yet for live men

    Orísha, the Creator, yearned, and called

    To him the longing shades from other glooms;

    He threw their images into the wombs

    Of Night, Olókun and Olóssa, and all

    The wives of the great Gods bore babes with eyes

    Of those born blind—unknowing of their want—

    And limbs to feel the heartless wind.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Orísha the Creator; Olókun; Olóssa;
    Night as a goddess who also bears.'
- kind: translation
  label: Pratibha Translation
  body: Orísha the Creator yearns for live men. He calls longing shades from other glooms and throws their
    images into the wombs of Night, Olókun, Olóssa, and the wives of the great gods. The babes are born
    with the eyes of the blind — they do not know what they lack — and with limbs that feel the heartless
    wind.
