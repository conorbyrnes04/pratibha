- kind: key_terms
  label: Key Terms
  items:
  - term: images
    definition: what Orísha throws into wombs -> forms of longing shades, not yet daylit persons -> "souls"
      finishes them too soon; they are images in the dark
  - term: wombs of Night, Olókun and Olóssa
    definition: the first mothers of humankind in this recitation -> darkness and water as natal, not
      only chaotic -> a male-only creation story cannot survive this line
  - term: eyes of those born blind
    definition: the first human condition -> want unknown because light has not yet been given -> "ignorance"
      moralizes what is climatic
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Shaped by the Hand of Orisala"
    resonance: Both give a shaping òrìṣà the work of making human form beside a higher god.
    divergence: Johnson's Orisala shapes a lump already made by Olorun; Orísha throws images into the
      wombs of Night and the water-queens, and the children are born before there is sun.
  - citation: Plotinus, Enneads V.1.6
    resonance: Both describe lower lives as images proceeding from a higher looking-toward.
    divergence: Plotinus's images degrade as they recede from the One; Orísha's images are a mercy to
      hungering shades, and the lack they suffer is missing Day, not metaphysical distance alone.
- kind: practice
  label: Practice (Abhyasa)
  body: Begin one making you have delayed until conditions were bright enough. Do it in the actual gloom
    of today. Do not explain the missing sun to the work. Let it have limbs first.
