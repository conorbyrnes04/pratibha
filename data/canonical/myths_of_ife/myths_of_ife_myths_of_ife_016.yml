pratibha_layers:
- kind: original
  label: Original
  body: 'Sparks flew from Ládi''s anvil, while Ógun taught

    The use of iron, and wise Obálufon

    Made brazen vessels and showed how wine streams out

    From the slim palms. And in the night the Gods

    Set torches in their thronging courts to light

    The dance, and Heaven''s music touched the drum

    Once more as in its ancient home. And mirth

    With Odudúwa reigned.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Ógun (iron); Ládi (Ógun''s smith);
    Obálufon (brass and palm-wine); Odudúwa as king of the mirthful age.'
- kind: translation
  label: Pratibha Translation
  body: When bright Day lifts the unused eyes of men, sparks fly from Ládi's anvil. Ógun teaches iron.
    Obálufon makes brass vessels and shows how wine streams from slim palms. At night the gods set torches
    for the dance; Heaven's music touches the drum again. Mirth reigns with Odudúwa.
