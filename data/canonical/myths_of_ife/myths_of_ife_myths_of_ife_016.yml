work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_016
unit_label: The Age of Mirth
title: The Age of Mirth
unit_type: teaching_passage
commentary: 'The claim is that the arts of Heaven survive descent only as taught crafts and as night-mirth,
  and that this is a real reign, not a prelude too slight to count. Eyes that have never seen light are
  terrified by Day — the recitation is exact: terror of bright Day lifts from unused eyes — and immediately
  there is work. Iron. Brass. Palm-wine. Drum. The younger sons'' portion (chorus, dance, crafts, joys
  of labour) finally has a climate in which it can be given. Odúwa still holds the stolen bag, unopened
  in its depths, and yet mirth can reign with him. The contested move is to let a tainted kingship host
  a true age of joy. Moralism wants the thief''s city to be only a war-camp. Ìfẹ̀ remembers anvil, wine,
  and torchlit courts first. Culture is not the opposite of a stolen founding; it is what gods still know
  how to teach when sun has come. The bag''s later silence will matter more because this age shows what
  shared arts look like when they are actually taught. Existentially, the teaching allows happiness that
  is not yet justice. You may be living in a house whose title is compromised and whose nights are still
  worth the drum. Do not use that as permission to keep the bag. Use it as evidence that craft and mirth
  are how a people becomes able to see what else is missing.'
