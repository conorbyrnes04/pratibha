  cultural_context: Outsider English verse of insider recitation. Recited by Ìfẹ̀ high priests (Òrní and
    Babaláwo Arába) to a colonial ADO; English blank verse is Wyndham's. Restore the philosophical claim
    without adopting colonial framing, "fetish," or Wyndham's Golden Bough guesses as doctrine. Ceremonial
    how-to (sacrifice recipes, circumcision, festival license instructions) is excluded; the mythic argument
    is kept.
