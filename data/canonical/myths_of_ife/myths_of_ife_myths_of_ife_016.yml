- kind: key_terms
  label: Key Terms
  items:
  - term: Ógun
    definition: god of iron, teacher of its use, son of Odúwa -> craft and later war share one metal ->
      "god of war" alone erases the anvil that first means harvest-tools and making
  - term: Obálufon
    definition: worker in brass who also shows palm-wine -> vessel and drink as one wisdom -> not a footnote
      craftsman; he is how Heaven's wine finds an earthly stream
  - term: mirth
    definition: what reigns with Odudúwa after Day comes -> chorus, torch, drum, the analogue of Heaven
      -> frivolity is the wrong gloss; mirth is the climate the younger gods were sent to teach
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Ogun, God of Iron"
    resonance: Both bind Ógun to iron as a consecrated craft, not only to battlefield fury.
    divergence: Johnson stresses war and smiths' consecration; this recitation first shows Ógun teaching
      use of iron in an age of mirth before any human war has begun.
  - citation: Kashf al-Maḥjūb, "The Patched Frock and the Sweetness of Faith"
    resonance: Both treat a humble material culture — frock, brass, drum — as a real climate of the sacred,
      not a wait for pure doctrine.
    divergence: Hujwīrī's sweetness is interior faith worn as patched cloth; Ìfẹ̀'s mirth is public, metallic,
      and still hosted by a king who holds a stolen bag.
- kind: practice
  label: Practice (Abhyasa)
  body: Tonight, make one useful thing (even a repaired handle or a shared drink) and then keep one hour
    of music or unhurried talk. Let labour and mirth share the same reign. Do not use the hour to litigate
    the house's old thefts.
