- kind: key_terms
  label: Key Terms
  items:
  - term: He-Who-Speaks-Not
    definition: the all-knowing Purpose beyond the sun Arámfè set -> even the father must refer a question
      he cannot close -> do not supply a Yoruba name the recitation withholds
  - term: weaned
    definition: the world taken off a gentler food amidst brother-strife -> founding as a bitter education
      -> "created" is too clean; weaning implies a prior milk (Heaven's mirth)
  - term: by strife must it endure
    definition: the unconfirmed law Arámfè fears -> endurance as possible ontology of war -> the question
      mark is part of the term; without it the line becomes propaganda
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 3.20–22, "Janaka's Proof and the Holding of Worlds"
    resonance: Both ask whether a world is held in being by a kind of conflictual or strenuous action
      rather than by rest.
    divergence: Krishna affirms action as what holds worlds and offers himself as the pattern; Arámfè
      only questions, and the strife he sees is unnatural brother-war, not offered duty.
  - citation: Tao Te Ching 40
    resonance: Both suspect that reversal, return, or a hard opposite is how things come to be and stay.
    divergence: The Dao's reversal is the movement of the Way, quiet and yielding; Arámfè's suspected
      law is bloody, and he hopes it is not true.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Write the question without answering it: what in your world was weaned on strife, and what only
    pretends that it must stay there? Sit with the question for ten minutes. Do not baptize your next
    harshness as cosmic law.'
