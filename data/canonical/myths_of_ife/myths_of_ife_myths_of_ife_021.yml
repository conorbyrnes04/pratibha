pratibha_layers:
- kind: original
  label: Original
  body: 'In the Unknown,

    Beyond the sky where I have set the Sun,

    Is He-Who-Speaks-Not: He knows all. Can this

    Be Truth: Amidst the unnatural strife of brothers

    The World was weaned: by strife must it endure—?'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: none new. Him-Who-Speaks-Not returns
    as the all-knowing Purpose beyond Arámfè''s sun.'
