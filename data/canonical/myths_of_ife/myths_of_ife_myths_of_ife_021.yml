category: root_text
work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_021
unit_label: By Strife Must It Endure
title: By Strife Must It Endure
unit_type: teaching_passage
commentary: 'The claim is the hardest in the book: the world may have been weaned on brother-strife, and
  strife may be the milk it still requires — and even the thunder-father does not know if that sentence
  is true. He has tried deluge. He reasons with himself in the clouds. Omnipotent in Heaven, puzzled here,
  he refers the question upward to the silent Purpose. Unnatural is his word for the fight; weaned is
  the metaphor that will not let the fight be only a mistake. A weaned world has been taken off a gentler
  food. If strife is what finished the weaning, then peace-as-return to Heaven''s wine may be nostalgia,
  not destiny. The dash and the question mark are doctrine. This is not a war gospel. It is a metaphysical
  shudder. Him-Who-Speaks-Not knows; Arámfè does not. The recitation lets the highest speaking god end
  in interrogation. Wyndham''s Golden Bough guesses must not be imported to close the question. The priests
  leave it open, which is more severe than a slogan about necessary violence. Existentially, the line
  forbids two comforts. One: if we repent hard enough, the world can be rewound to mirth without remainder.
  Two: because strife weaned the world, my next cruelty is ordained. The only honest stance the father
  models is to ask, in the Unknown''s direction, whether endurance and unnatural strife are truly the
  same law — and to hate the war while asking.'
