pratibha_layers:
- kind: original
  label: Original
  body: 'Yet, Lord Arámfè,

    I am your first-born: wherefore do you give

    The arts and wisdom to Orísha? I,

    The King, will be obeyed; the hearts of men

    Will turn in wonder to the God who spells

    Strange benefits. But Arámfè said "Enough;

    To each is fitting task is given. Farewell."'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Odúwa (first-born, already speaking
    as King); Orísha (the one given arts).'
- kind: translation
  label: Pratibha Translation
  body: 'Odúwa answers: I am first-born; why give arts and wisdom to Orísha? I, the king, will be obeyed,
    and the hearts of men will turn in wonder to the god who spells strange benefits. Arámfè says only:
    Enough. To each a fitting task is given. Farewell.'
