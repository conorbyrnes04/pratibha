- kind: key_terms
  label: Key Terms
  items:
  - term: first-born
    definition: Odúwa's ground of protest -> seniority as a claim on arts as well as crown -> the recitation
      will not let birth-order rewrite Arámfè's split
  - term: strange benefits
    definition: what Odúwa fears will steal hearts toward Orísha -> wonder as political threat, not mere
      gratitude -> "blessings" is too pious; these benefits unseat love of the king
  - term: fitting task
    definition: Arámfè's last word before exile -> office as what fits, not what flatters -> "duty" is
      thinner; fit includes limit
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 3.35, "Better One's Own Imperfect Dharma"
    resonance: Both prefer the assigned work, even when another office looks more wonderful, to the seizure
      of a neighbor's portion.
    divergence: Krishna argues the point at length for Arjuna; Arámfè ends the hearing in two lines and
      sends the sons out.
  - citation: Conference of the Birds, "Ask for the King Alone"
    resonance: Both treat a wrong object of wanting — benefits, or a lesser station — as the thing that
      keeps a company from its real work.
    divergence: ʿAṭṭār's birds must want the King; Odúwa already has kingship and still wants the bag.
      The error is surplus, not lack of a throne.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch one sentence today that begins "But I am the one who should also..." Stop it. Finish the
    assigned task without annexing the wonder that belongs to another office. Say farewell to the extra
    portion.
