category: root_text
work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_005
unit_label: Odúwa Protests the Gift
title: Odúwa Protests the Gift
unit_type: teaching_passage
commentary: 'The claim is that primogeniture does not entitle a king to every wonder, and that the father
  will not argue the point. Odúwa has already accepted exile and homesteads. What he cannot accept is
  a rival magnet. He predicts, correctly, that men will love the god of benefits more than the god of
  obedience. The protest is political psychology, not mere spite: a crown that cannot spell strange goods
  will be obeyed in form and deserted in love. Arámfè''s answer is almost rude. Enough. Fitting task.
  Farewell. There is no theodicy of the split, no promise that hearts will come around, no extra portion
  to soothe the first-born. The contested move is the refusal to optimize the gift for the king''s self-image.
  Heaven does not redesign offices so that the ruler also owns pedagogy. This is the last calm sentence
  before the road. After farewell, the only way Odúwa can correct the distribution is theft. The recitation
  lets us hear that the war is already reasoned before it is committed. Existentially, the teaching is
  about the moment you negotiate a role you were actually given. The wish to be both obeyed and wondered-at
  is ordinary. Arámfè treats it as a conversation that has ended. A fitting task includes the benefits
  you will not personally dispense. Farewell is the doctrine: stop petitioning the assignment.'
