- kind: key_terms
  label: Key Terms
  items:
  - term: sad kingdom
    definition: Odúwa's name for the world below -> Ìfẹ̀ as accepted sorrow, not failed Heaven -> "earth"
      is too neutral; sadness is in the founding speech
  - term: wine of Heaven
    definition: mirth and sunrise of Arámfè's vales -> the climate they cannot export -> later palm-wine
      is analogue, not identity
  - term: So came the Gods to Ífè
    definition: the descent's punchline -> arrival is aftermath of farewell -> origin-story as tourism
      ("they chose a capital") misses the grief
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Conference of the Birds, the leaving of the valleys
    resonance: Both make a company leave a loved climate for a harder kingdom that is the only way the
      work continues.
    divergence: ʿAṭṭār's birds travel toward the King; these gods travel away from their father's hills
      toward a city they must build in darkness.
  - citation: Bhagavad Gita 2.1–3, "Stand Up — This Fainting Is Unworthy of You"
    resonance: Both face a warrior or king who would rather keep a familiar order than enter the field
      that has already been assigned.
    divergence: Krishna rebukes Arjuna into battle; Odúwa's farewell is already obedience mixed with grief,
      and no charioteer need prod him over the last inch.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the "wine of Heaven" you are still trying to drink in a life that has already changed climate
    — a pace, a audience, a light. Say farewell to it once, aloud. Do the day's work in the sadder kingdom
    without that vintage.
