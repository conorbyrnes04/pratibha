pratibha_layers:
- kind: original
  label: Original
  body: '"We go to our sad kingdom. Such is the will

    Of Old Arámfè: so let it be. But ere

    The hour the wilderness which gapes for us

    Engulf us utterly. . .

    Good-bye, ye plains we roamed.

    Good-bye to sunlight and the shifting shadows

    Cast on the crags of Heaven''s blue hills. Ah! wine

    Of Heaven, farewell" . . . So came the Gods to Ífè.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Ìfẹ̀ (Ífè in Wyndham), the first
    stronghold they will found beneath the cliff.'
- kind: translation
  label: Pratibha Translation
  body: We go to our sad kingdom. Such is Arámfè's will; so let it be. Before the wilderness engulfs us,
    goodbye to the plains, to sunlight and shifting shadows on Heaven's blue hills. Wine of Heaven, farewell.
    So the gods come to Ìfẹ̀.
- kind: commentary
  label: Pratibha Commentary
