work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_012
unit_label: Farewell to the Wine of Heaven
title: Farewell to the Wine of Heaven
unit_type: teaching_passage
commentary: 'The claim is that Ìfẹ̀ begins as a goodbye, not as a conquest fanfare. Land is now steadfast
  enough to receive them. Odúwa calls the gods to the cliff and speaks sorrow. The will is accepted ("so
  let it be") and the body still grieves sunlight. Wine of Heaven, earlier named as an age of mirth and
  sunrise, is what they lose: not abstract bliss, but the specific climate of Arámfè''s vales — misty
  hollows, silvering moon, wind on grasslands. Descent is therefore a change of drink. They will later
  teach palm-wine and drum, which are earthly analogues, not the same vintage. The contested move is to
  let the king who stole the bag also be the one who loves Heaven enough to say farewell properly. Theft
  did not make him a nihilist. It made him a founder who already knows the kingdom is sad. Sacred city,
  in this telling, is the place you arrive after you have admitted the loss of the climate that trained
  you. Existentially, the line is for anyone who enters a necessary life and tries to smuggle the old
  wine in the same cup. Say goodbye to the exact light you will not have. Then go. Ìfẹ̀ is not a consolation
  prize. It is the work that remains when the hills have been looked at for the last lingering time.'
