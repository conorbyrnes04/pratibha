- kind: key_terms
  label: Key Terms
  items:
  - term: Him-Who-Speaks-Not
    definition: Wyndham's English for the higher distant Being some Ìfẹ̀ priests mention -> Purpose that
      births Arámfè, not a cult addressee -> inventing a Yoruba proper name for this figure exceeds the
      source
  - term: far-felt Purpose
    definition: how Arámfè knows that silent source -> knowledge as pressure and orientation, not conversation
      -> "will of God" is too speech-like; this Purpose does not speak
  - term: gave Me birth
    definition: 'Arámfè is derived, not self-originating -> godhead in this myth is middle: maker of Heaven,
      child of Silence -> "first cause" language erases the birth'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Enneads VI.9.6, "The Unity Beyond Human Conception"
    resonance: Both place a last source beyond the speaking, shaping gods and beyond what can be handled
      as an object of address.
    divergence: Plotinus's One is approached by the soul's interior ascent; Him-Who-Speaks-Not is named
      by a working thunder-father who then turns back to streams, stars, and hills.
  - citation: Senegalese Animism, "The Invisible Master Is Named as the Sky"
    resonance: Both keep a supreme that is known and yet not turned into the ordinary addressee of cult.
    divergence: Serer Rog shares a name with the sky and takes satisfaction in the good; Him-Who-Speaks-Not
      is more remote still, a Purpose behind Arámfè, without even a sky-name in this recitation.
- kind: practice
  label: Practice (Abhyasa)
  body: Sit ten minutes without asking the highest for a word. Let purpose be far-felt, not answered.
    Then do one piece of shaping work as if labour were the only speech you are owed.
