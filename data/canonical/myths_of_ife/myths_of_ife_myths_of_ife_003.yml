pratibha_layers:
- kind: original
  label: Original
  body: 'But I knew well the heart

    Of Him-Who-Speaks-Not, the far-felt Purpose that gave

    Me birth; I laboured and the grim years passed:

    Streams flowed along their sunny beds; I set

    The stars above me, and the hills about.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: none beyond Arámfè. Him-Who-Speaks-Not
    is Wyndham''s English for the higher distant Being some priests mention; it is not a recovered Yoruba
    name.'
- kind: translation
  label: Pratibha Translation
  body: I knew well the heart of Him-Who-Speaks-Not, the far-felt Purpose that gave me birth. I laboured,
    and the grim years passed. Streams found sunny beds. I set the stars above me and the hills about
    me.
