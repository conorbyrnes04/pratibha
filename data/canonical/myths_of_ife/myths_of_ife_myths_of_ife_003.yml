unit_label: Him-Who-Speaks-Not
title: Him-Who-Speaks-Not
unit_type: teaching_passage
commentary: 'The claim is that even the father of the gods is not the last word. Arámfè makes Heaven,
  later sends sons, later hurls thunderbolts, and still names a higher: Him-Who-Speaks-Not, a far-felt
  Purpose that gave him birth. The priests, in Wyndham''s Persons list, mention a higher and very distant
  Being; they do not give that Being a bargain-name. Silence is the doctrine. The contested move is hierarchical
  without being a ladder you climb. Arámfè is not a demigod waiting to be promoted. He is God for the
  recitation — thunder, father, maker — and he knows he is derived. Purpose precedes speaker. The one
  who does not speak is not mute from weakness; speech is what the middle gods do when they found worlds
  and argue. The highest is felt, not addressed. This must not be filled with later ethnography or with
  Olorun imported from Johnson as if the names were already the same sentence. What the Ìfẹ̀ recitation
  actually gives is the structure: a working god who can fail and thunder, and behind him a Purpose that
  does not enter the market of prayer. Existentially, the line trains a check on spiritual chatter. If
  the maker of Heaven labours from a Purpose that will not talk, your own urgency to get a voice from
  the absolute may be a confusion of ranks. Do the work the Purpose implies. Do not demand that the last
  source explain itself in your ear.'
