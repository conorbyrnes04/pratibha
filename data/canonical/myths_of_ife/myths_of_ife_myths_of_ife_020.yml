  Ife ethnography.'
pratibha_layers:
- kind: original
  label: Original
  body: '"For now my thunderbolts I hurl, with deluges

    upon the land—to stay for aye your impious war."

    Dawn came; the storm was gone, and Old Arámfè

    in his grief departed on black clouds. But still

    the wrath, the anger of his sons endured,

    And in the dripping forests and the marshes

    The rebel Gods fought on.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Arámfè as thunder-father. The deluge
    refills marshes Ojúmu had dried.'
- kind: translation
  label: Pratibha Translation
  body: Arámfè hurls thunderbolts and deluges to fill marsh and lagoon and stay the impious war forever.
    Dawn comes. The storm is gone. The father departs on black clouds in grief. Still the wrath of his
    sons endures. In dripping forest and marsh the rebel gods fight on.
