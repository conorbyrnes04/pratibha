category: root_text
work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_020
unit_label: Thunder Cannot Stop Brothers
title: Thunder Cannot Stop Brothers
unit_type: teaching_passage
commentary: 'The claim is that even the father of the gods cannot command peace once brothers have tasted
  the fall. Arámfè has speech, thunder, flood. He names the war impious. He tries to make the ground itself
  unfightable by returning the wet that Ojúmu dried — a terrible irony: the first creative labour is reversed
  as punishment. Dawn proves the limit. Storm passes. Grief takes the father away on clouds. Wrath stays.
  Rebel is now the right word for sons who were sent to make a world of mirth. The contested move is the
  admission, already forming in Arámfè, that here he is not omnipotent. In Heaven, yes. Here — he cannot
  tell. Thunder is not the last metaphysics; it is a failed policy. This must not be read as Wyndham''s
  joke about a tribal sky-god. It is an Ìfẹ̀ thought about rank: a maker can send, split gifts, pity,
  light a sun, and still be unable to unmake a choice his sons prefer to his voice. Existentially, the
  teaching is for anyone who thinks a loud enough verdict will end a family war. You can flood the field.
  At dawn they will fight in the drip. Grief is more honest than another bolt. The work, if there is work
  left, will have to be a change of heart, not a change of weather.'
