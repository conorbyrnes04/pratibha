- kind: key_terms
  label: Key Terms
  items:
  - term: thunderbolts
    definition: Arámfè's instrument, now used as police -> power that cannot reach wrath -> "sky-god weapon"
      is museum talk; here thunder is a father's failed last resort
  - term: impious war
    definition: his name for the brothers' fight -> a war against the paths they were given -> not impious
      because a colonial church says so; impious because they were sent to make mirth
  - term: rebel Gods
    definition: what the sons are after they fight on -> rebellion defined by persistence after the father's
      storm -> "heroes" would flatter; the recitation does not
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalms (Tehillim), Psalm 29 (the voice of the LORD on the waters)
    resonance: Both imagine thunder as a father's or lord's voice meant to order a violent field.
    divergence: The psalm's voice accomplishes glory and sitting as king; Arámfè's thunder fails, and
      he leaves in grief while the sons fight on.
  - citation: Senegalese Animism, "The Invisible Master Is Named as the Sky"
    resonance: Both know a high one associated with sky who regards conduct.
    divergence: Serer Rog takes satisfaction in the good and is not the cult addressee; Arámfè intervenes
      with flood and learns the limit of intervention in the world below.
- kind: practice
  label: Practice (Abhyasa)
  body: Do not add one more thunder — email, verdict, slam — to a quarrel that has already heard your
    power. Sit with the grief that you cannot stay it. Ask what a change of heart, not a change of weather,
    would look like for you alone.
