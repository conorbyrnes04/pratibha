unit_label: Give Back the Bag
title: Give Back the Bag
unit_type: teaching_passage
commentary: 'The claim is that a stolen pedagogy has a due date, and that the due date is the readiness
  of men, not the convenience of the king. Orísha has waited through the age of mirth. Iron and brass
  and wine are already in the world; the deeper arts in the bag are not. He does not ask for the crown.
  He asks for the tool of his own office, in the palace where the Òrní will later reign, with a craftsman
  beside him. The proverb is the argument''s edge. Silence is not safety. A proud leopard can be lured
  by a hush and crushed. Odúwa''s quiet possession of the bag is that hush. The footnote Wyndham preserves
  — the elephant has power to crush the leopard, though he be silent — keeps the saying inside Yoruba
  speech without turning the unit into a drum-manual. The contested move is to threaten a king with a
  forest image in the name of a father''s bidding. Arts are not a favor Odúwa may keep as regalia. They
  are a debt to men. Odúwa will answer as kings answer: Am I not king? Who speaks unseemly has packed
  his load. The war starts from that collision of two true sentences: the bag is Orísha''s, and Odúwa
  is king. Existentially, the teaching is about the day you must ask for your own work back. Politeness
  that never names the theft becomes the silence that lures you under the foot. Ask clearly. Bring a witness
  who makes. Do not ask for the throne you were not given.'
