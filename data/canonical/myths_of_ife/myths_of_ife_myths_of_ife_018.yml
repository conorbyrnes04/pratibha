pratibha_layers:
- kind: original
  label: Original
  body: 'The sound of drums was heard and Great Orísha

    Approached with skilled Obálufon, and said:

    "The time has come to teach Arámfè''s arts

    To men. Give back the bag (for it is mine!)

    That I may do our Father''s bidding. Else,

    Have a care, is it not told how caution slept

    In the still woods when the proud leopard fell,

    Lured on by silence, ''neath the monster''s foot?"'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Orísha; Obálufon; Odúwa. The leopard
    saying is Wyndham''s English of a Yoruba threat he footnotes (elephant and leopard).'
- kind: translation
  label: Pratibha Translation
  body: 'Drums sound. Great Orísha comes with Obálufon before Odúwa and Ógun: the time has come to teach
    Arámfè''s arts to men. Give back the bag — it is mine — that I may do our father''s bidding. Else
    remember how caution slept in still woods when the proud leopard fell, lured by silence, under the
    monster''s foot.'
