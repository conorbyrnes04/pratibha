- kind: key_terms
  label: Key Terms
  items:
  - term: Give back the bag
    definition: Orísha's demand before the king -> restoration of a teaching office, not a coup -> "treasure"
      misses that the bag is for men, by the father's bidding
  - term: proud leopard
    definition: the proverb's warning image -> silence can be a lure, caution can sleep -> Odúwa is the
      hush; Orísha names the foot that can fall
  - term: packed his load
    definition: 'Odúwa''s answering saying (Wyndham: the speaker is ready to travel) -> dissent treated
      as exile -> two Yoruba sayings collide, and war is the residue'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: A.B. Ellis, Yoruba òwe, "One lock does not know the wards of another"
    resonance: Both use compact speech to say that one office cannot operate the inner work of another.
    divergence: Ellis's lock is mutual ignorance of crafts; here the king holds the lock and refuses the
      only hand that knows the wards.
  - citation: Bhagavad Gita 3.19, "Unattached, Do the Work That Must Be Done"
    resonance: Both treat a delayed work — arts for men, the battle that holds worlds — as something that
      comes due and must be done.
    divergence: Krishna urges action without fruit-clinging; Orísha clings rightly to the bag because
      the bag is the work, not a fruit of prestige.
- kind: practice
  label: Practice (Abhyasa)
  body: Ask one person, without ornament, for a tool or credit that is actually yours to use for others.
    Do not ask for their rank. If they refuse by invoking rank alone, do not start a war today — write
    the sentence of the refusal so you cannot re-soften it.
