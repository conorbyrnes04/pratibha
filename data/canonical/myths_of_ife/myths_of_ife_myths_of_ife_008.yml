unit_id: myths_of_ife.myths_of_ife_008
unit_label: The Cliff over Chaos
title: The Cliff over Chaos
unit_type: teaching_passage
commentary: 'The claim is that the first political temptation of the gods is nostalgia disguised as prudence.
  They have already stolen and already marched. At the cliff they see the assignment: untamed water, no
  sun below, a city to be founded for unborn men in what feels like a dungeon. Odúwa, who wanted kingship,
  now wants a lost valley. The desert behind them is harsh, but it still has the sun of Heaven. Chaos
  beneath has none. The counterintuitive move is that flight would not restore innocence. They are already
  outcasts by the father''s sending and by the roadside theft. A hidden valley would be desertion of the
  dumb spirits who wait for life, and it would assume that Arámfè has no bodes. Cowardice here is metaphysical:
  the refusal to let godhead be used on the ungoverned. Many creation stories enjoy the view from the
  brink. This one lets the future king flinch. Kingship that seized the bag still quails at the roar.
  The recitation is honest about the body. Gods peer tremblingly. Courage is not their native climate;
  it will have to be argued by Orísha in the next breath. Existentially, the cliff is any threshold where
  the work finally looks like chaos and the road behind still smells like home. The teaching does not
  say the roar is imaginary. It says a lost valley is not a philosophy. It is a wish to remain a tourist
  of Heaven after you have already been sent.'
