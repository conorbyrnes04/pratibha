- kind: key_terms
  label: Key Terms
  items:
  - term: sheer precipice
    definition: the bar Arámfè set between smiling vales and the waste -> creation begins as a drop, not
      a door -> "fall" in the Edenic sense is wrong; they are sent, and they peer
  - term: untamed waters
    definition: chaos beneath Heaven's cliff -> not yet Olókun's curbed sea; water without office -> "ocean"
      already implies a queen they have not yet appointed
  - term: lost valley
    definition: Odúwa's wish to flee -> nostalgia for a pocket of Heaven after exile has begun -> prudence
      is the mask; desertion is the act
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalms (Tehillim), Psalm 24, "Lift Up Your Heads, O Gates"
    resonance: Both set a founding against the fact of waters and a threshold that must be crossed before
      a king can enter.
    divergence: The psalm's earth is already founded on the seas by YHWH; here the gods have not yet poured
      sand, and the king wants to flee the threshold.
  - citation: Heart Sutra, "No Attainment, and So No Fear"
    resonance: Both face an abyss that looks like the end of safety.
    divergence: The sūtra dissolves fear by dissolving attainment; Odúwa fears a very real unmade water,
      and the cure in the next unit is not emptiness but the hunger of spirits for life.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand at one brink you have been delaying — a conversation, a page, a repair. Name the lost valley
    you keep offering yourself. Take one step toward the roar, not back toward the soft breeze.
