pratibha_layers:
- kind: original
  label: Original
  body: 'From the sandy brink they peered down the sheer precipice.

    Behind them lay the parched, forbidding leagues; but yet

    the Sun was there, and breezes soft. . . Beneath

    Hung chaos—dank blackness and the threatening roar

    Of untamed waters. Then Odudúwa spoke:

    "Better a homeless life in desert places:

    dare we turn and flee to some lost valley of the hills?"'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Odudúwa; Orísha. The cliff is the
    stern bar Arámfè set between Heaven''s vales and the unmade waste.'
- kind: translation
  label: Pratibha Translation
  body: 'From the sandy brink they peer down the sheer precipice. Behind them: parched leagues, yet still
    sun and soft breeze and the memory of mountains. Beneath: chaos, dank blackness, the roar of untamed
    waters. Odudúwa asks whether they dare turn and flee to some lost valley — better a homeless life
    in desert places than a city founded under that yawn.'
