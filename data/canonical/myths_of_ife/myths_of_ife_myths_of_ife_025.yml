pratibha_layers:
- kind: original
  label: Original
  body: 'She saw the clustered tree-tops breaking into leaf

    Copper and red and every green, and she

    Remembered how beneath the new year''s buds

    It was ordained by Peregún ’Gbo, lord

    Of uninhabitable woods that Life

    Should spring from Forest, and Life from Life,—till all

    The Woods were gladdened with the voice of beasts

    And birds.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Peregún ’Gbo (forest god); Mórimi.
    Cult recipe excluded.'
- kind: translation
  label: Pratibha Translation
  body: 'Mórimi sees the new year''s leaves — copper, red, every green — and remembers the ordinance of
    Peregún ’Gbo, lord of uninhabitable woods: life should spring from forest, and life from life, until
    the woods are glad with beasts and birds. From the forest''s womb leaped the sloth that laughs by
    night; amid the boughs the sloth brought forth the ape that bore the leopard.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that life is not inserted into the woods from a workshop of the sky; it is ordained
    to spring from forest, and then from life, in a glad genealogy. Peregún ’Gbo is lord of woods that
    were uninhabitable — the same wild that pressed and hid and fought. His ordinance is biological and
    philosophical at once: the forest is natal. Sloth, ape, leopard are not a modern taxonomy and not
