work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_025
unit_label: Life Should Spring from Forest
title: Life Should Spring from Forest
unit_type: teaching_passage
commentary: 'The claim is that life is not inserted into the woods from a workshop of the sky; it is ordained
  to spring from forest, and then from life, in a glad genealogy. Peregún ’Gbo is lord of woods that were
  uninhabitable — the same wild that pressed and hid and fought. His ordinance is biological and philosophical
  at once: the forest is natal. Sloth, ape, leopard are not a modern taxonomy and not a cult diagram.
  They are the recitation''s way of saying that forms come from prior forms, voice from voice, until uninhabitable
  space becomes a chorus. Mórimi will go on, in the full chapter, toward a bargained child; that how-to
  is excluded here. What is kept is the premise she starts from, which is already enough to judge the
  later temptation. If life springs from life, the forest is not a warehouse of parts for ritual engineering.
  It is a womb that already knows how to be glad. The contested move is to let a childless queen''s eyes,
  seeing spring, remember an ecology instead of a transaction. Existentially, the teaching asks where
  you think new life comes from in your own woods — work, household, street. If you believe it must be
  purchased from a grim counter, you have already left Peregún ’Gbo. If you believe life from life, you
  look for the living thing that can bear the next living thing, and you let the woods be glad before
  you are.'
