- kind: key_terms
  label: Key Terms
  items:
  - term: Peregún ’Gbo
    definition: forest god, lord of uninhabitable woods, who ordains life from forest -> natal wild, not
      a store of ritual ingredients -> do not enlarge him with cult recipes this ingest excludes
  - term: Life from Life
    definition: the ordinance under the new year's buds -> genealogy as the forest's law -> "creation
      from nothing" is the opposite metaphysics
  - term: uninhabitable woods
    definition: what the forest was before the glad voices -> the wild as prior emptiness of beasts, not
      as evil -> habitation arrives as voice, sloth to leopard
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 42
    resonance: Both describe a sequence in which the one generates the next, and living multiplicity arrives
      by descent from life rather than by imported parts.
    divergence: The Dao's sequence is abstract (one, two, three, ten thousand); Peregún ’Gbo's is fleshed
      — sloth, ape, leopard — and gladness is the test.
  - citation: Senegalese Animism, "The Woods Are Sanctuaries"
    resonance: Both refuse to treat forest as dead timber or as a neutral backdrop to human will.
    divergence: Serer woods are sanctuaries of named presence; Ìfẹ̀'s woods are a womb with a lord who
      wants them full of voice.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Walk among actual trees or, if you cannot, among the oldest living things you can reach. Do not
    ask them for a child, a job, or a sign. Watch one form that has come from another form. Say: life
    from life. Leave.'
