pratibha_layers:
- kind: original
  label: Original
  body: 'Then doubt seized Mórimi but still she answered:

    "Will Gods not give? Is the grim World a morning market

    Where they drive bargains with the folk they made?

    Are babes as bangles which Obálufon fashions to barter?"

    But Édi answered her: "But once Arámfè spoke

    to Odudúwa, and with what heavy hearts the Gods

    went forth from Heaven''s valleys to the blackness!"'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Mórimi; Édi the Perverter; Obálufon;
    Arámfè. Sacrifice instructions excluded.'
- kind: translation
  label: Pratibha Translation
  body: 'Doubt seizes Mórimi, and she still answers: will gods not give? Is the grim world a morning market
    where they drive bargains with the folk they made? Are babes as bangles Obálufon fashions to barter?
    Édi, the Perverter, smooth of tongue, answers with the heavy hearts of the gods'' descent — as if
    a hard sending justified a hard trade.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is Mórimi''s question, and it stands even though the chapter will show her worn down:
    gods who made folk do not get to run a morning market with those folk. A child is not a brass bangle.
