work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_026
unit_label: Will Gods Drive Bargains
title: Will Gods Drive Bargains
unit_type: teaching_passage
commentary: 'The claim is Mórimi''s question, and it stands even though the chapter will show her worn
  down: gods who made folk do not get to run a morning market with those folk. A child is not a brass
  bangle. The grim world may be grim; grimness is not a license for barter theology. Édi is named the
  Perverter, the one whose guile compels to conscious sin. His rhetoric is important. He does not deny
  the gods. He uses true plot — Arámfè spoke once, the gods went out with heavy hearts — to argue that
  a costly command must be obeyed when it comes thrice. Truth plus pressure is his method. The ingest
  stops before the altar. The philosophical fight is already complete: gift versus bargain, child versus
  bangle, maker versus merchant. Johnson''s Olorun is too exalted to handle affairs; Mórimi demands something
  adjacent and hotter — that the gods give, not haggle. Whether the grim world answers her as she hopes
  is another story. The recitation is honest enough to let Édi win the night and still let her question
  judge him. Existentially, keep the question in any system that wants your dearest thing as payment for
  a promised good. If the world is a morning market, the makers have already fallen a second time, past
  war, into trade. Refuse that metaphysics even when a smooth voice has all the plot-points.'
