- kind: key_terms
  label: Key Terms
  items:
  - term: morning market
    definition: Mórimi's image for a world of divine haggling -> theology as trade -> the grimness of
      the world is not accepted as proof that the image is true
  - term: Édi
    definition: the Perverter, smooth of tongue, who compels to conscious sin -> not a cartoon devil;
      he reasons from real myth toward a bargained act -> do not collapse him into Éshu; the recitation
      names both, and Édi is the perverter here
  - term: babes as bangles
    definition: Obálufon's brass used as the measure of a child -> the exact category mistake -> a made
      ornament can be bartered; a person the gods made cannot
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Olorun, the Lord of Heaven"
    resonance: Both resist a highest that would sit at a counter and handle human affairs as business.
    divergence: 'Johnson''s Olorun is simply too exalted to deal; Mórimi''s protest is ethical: even in
      a grim world the makers must not haggle children.'
  - citation: Kashf al-Maḥjūb, on bargaining away the sweet for the show of religion
    resonance: Both unmask a transaction that dresses itself as obedience or piety.
    divergence: Hujwīrī's target is spiritual display; Mórimi's target is a cosmos imagined as a market,
      and Édi is the salesman.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Catch one place today where you are treating a person or a living good as a bangle — something
    to trade for a promised upgrade. Stop the trade. Ask Mórimi''s question: will the source not give?
    Do not follow a smooth voice that uses true stories to close the sale.'
