unit_id: myths_of_ife.myths_of_ife_028
unit_label: Ógun Goes to His Trees
title: Ógun Goes to His Trees
unit_type: teaching_passage
commentary: 'The claim is that a city can become unable to see the god who made her livable, and that
  the god''s last metaphysics is kindness of trees. Ógun has argued for peace, asked to finish Arámfè''s
  bidding, refused the romance of endless war that Orányan names as the world''s true destiny. Ìfẹ̀''s
  young men want rumours, red war, the living lustre of a name. The old chiefs want the roof and the evening
  fire. The cry that chooses Orányan is, for Ógun, the parrot-egg sentence: the walls will not hold a
  rule of iron against treachery inside. He does not turn to stone (Osányi''s charms are forgotten). He
  does not become a river as Óshun did. He goes to the trees he planted — the robe of queenly Ìfẹ̀ — expecting
  more kindness from what he grew than from the mouths he saved. Dawn''s mist is the last image: unremembering
  Ìfẹ̀ is blotted. The god cannot even complete farewell. Memory fails at the scale of weather. The contested
  move is to let the iron god prefer forest kindness to civic fame without calling that preference weakness.
  He is not fleeing a fight he invented; he is leaving a people who have chosen the fight as their wine.
  Existentially, the teaching is about the day a work no longer knows you. Do not curse it into stone.
  Do not fake a river-exit. Go to the living things you actually planted. If mist blots the city, that
  is already the city''s memory of you. Kindness may still be in the trees.'
