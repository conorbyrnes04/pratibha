pratibha_layers:
- kind: original
  label: Original
  body: 'Yet she rejects me. Ah! my trees

    Would be more kind, and to my trees I go."

    Dawn came; and Ógun stood upon a hill

    To Westward, and turned to take a last farewell

    Of his old queen of cities—but white and dense,

    O''er harbouring woods and unremembering Ífè

    A mist was laid and blotted all.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Ógun; Orányan; Ìfẹ̀. The city chooses
    the warrior son; the iron god goes to the forest he planted.'
- kind: translation
  label: Pratibha Translation
  body: 'Ìfẹ̀ chooses Orányan. Ógun, who grew old with the city and planted her forests as a robe, says:
    she rejects me. My trees would be more kind; to my trees I go. At dawn he stands on a westward hill
    to take farewell of his queen of cities. A white dense mist lies over harbouring woods and unremembering
    Ìfẹ̀ and blots all.'
