- kind: key_terms
  label: Key Terms
  items:
  - term: Orányan
    definition: Ógun's warrior son, chosen by Ìfẹ̀'s young men -> wide renown against obscurity -> not
      a villain; he is the destiny the city prefers to peace
  - term: my trees would be more kind
    definition: Ógun's last metaphysics -> planted forest as the robe and the remaining friend -> "nature-lover"
      is too soft; these are trees he set for a queen who forgot
  - term: unremembering Ífè
    definition: the city under mist, unable to complete even a farewell -> memory as weather that can
      blot a god -> the opening unit's sure home of truth can also forget
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Iron and the Sacred Tree"
    resonance: Both bind Ógun's metal to living wood, so that iron religion is not only forge and war.
    divergence: Johnson keeps iron and tree as paired sacred facts; this ending makes the trees kinder
      than the city, and Ógun leaves the forge-throne for the forest he planted.
  - citation: Conference of the Birds, the departure from the seventh valley toward the King
    resonance: Both end a long company-story with a leaving in which the familiar city or flock can no
      longer be the home of the seeker.
    divergence: ʿAṭṭār's birds find they were the King; Ógun finds the city has chosen another king, and
      his last likeness is mist over trees, not a revealed identity.
- kind: practice
  label: Practice (Abhyasa)
  body: If a room you built has chosen a louder occupant, do not stage a last speech it cannot hear. Go
    to one living thing you planted — a tree, a practice, a person you grew — and keep company there for
    an hour. Let mist have the city.
