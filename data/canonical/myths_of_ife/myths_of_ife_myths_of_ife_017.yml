- kind: key_terms
  label: Key Terms
  items:
  - term: Earth, Water and the Forest
    definition: three sons sent with the gifts -> the world as siblings who can steal from one another
      -> not elements in a Greek table; they are persons of a tale
  - term: Good Humour
    definition: the last unstolen gift, by which the twenty return -> patience that can seek thatch, food,
      and wine -> "cheerfulness" is too thin; it is the virtue that keeps seeking from turning into war
  - term: patiently
    definition: how men actually prevail in forest and river -> the lived form of Good Humour -> haste
      is the hidden theft of the last gift
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 8
    resonance: Both trust a yielding, unforced approach to the places that hold the goods of life.
    divergence: Daoist water takes the low place as the Way; here Water is also a thief of gifts, and
      humour — not water — is the human instrument of recovery.
  - citation: A.B. Ellis, Yoruba òwe, "If you are not able to build a house at once"
    resonance: Both counsel a paced winning-back of what cannot be seized in one proud gesture.
    divergence: Ellis's proverb is household patience; this tale scales patience to the whole relation
      of Earth with Forest and River.
- kind: practice
  label: Practice (Abhyasa)
  body: Go today to one place that holds a good you want — kitchen, office, woods, river of errands —
    and ask for it with patience instead of grievance. Win back one small store by good humour. Do not
    take it as a raid.
