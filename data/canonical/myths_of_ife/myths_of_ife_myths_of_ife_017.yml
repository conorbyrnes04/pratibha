work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_017
unit_label: Good Humour Is the Last Gift
title: Good Humour Is the Last Gift
unit_type: teaching_passage
commentary: 'The claim is that what the world withholds is recovered not by force against forest and river
  but by a temperament: good humour, the one gift that could not be stolen. Earth is first-born and still
  the loser of twenty portions. Water and Forest are not evil; they are the places where thatch, food,
  and wine actually live, and they keep those goods until men approach without the sourness of owners
  who have been robbed. Patience is the practical form of the last gift. The recitation insists the tale
  is true because it matches the age of crafts: Ógun and the gods make arts known, and men learn to seek
  rather than to raid. The contested move is to place humour — not sacrifice, not a second bag, not thunder
  — at the hinge of ecology. A people that cannot joke with the fact that forest and river hold the stores
  will stay hungry in the name of dignity. This is not comic relief before the war chapter. It is the
  alternative physics of getting things back. Existentially, the teaching diagnoses a modern reflex: when
  a commons seems stolen, escalate. Ìfẹ̀ says: keep the one gift that makes seeking possible. Good humour
  is not cheerfulness as denial. It is the refusal to let theft have your last instrument. With that instrument
  you can still go to the trees and the water as a learner.'
