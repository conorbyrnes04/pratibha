pratibha_layers:
- kind: original
  label: Original
  body: 'A tale is told how God in the Beginning sent

    three sons into the World—Earth, Water and the Forest—

    With one and twenty gifts for Earth and men;

    and all save one the Forest and the Rivers stole;

    and how God promised Earth that men should win

    the twenty gifts again by virtue

    Of that last one, Good Humour.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. A tale inside the recitation: Earth, Water, Forest,
    and twenty-one gifts. No further Yoruba names.'
- kind: translation
  label: Pratibha Translation
  body: 'A tale is told: God sends three sons — Earth, Water, and the Forest — with twenty-one gifts for
    Earth and for men, the sons of Earth. Forest and Rivers steal all but one. God promises Earth that
    men will win the twenty back by the last gift, Good Humour. The tale is true: when the gods teach
    their crafts, men learn to seek thatch, food, and wine in forest and river patiently. So man prevails.'
- kind: commentary
  label: Pratibha Commentary
