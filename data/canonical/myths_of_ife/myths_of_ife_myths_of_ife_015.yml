unit_label: Fire on the Vulture's Head
title: Fire on the Vulture's Head
unit_type: teaching_passage
commentary: 'The claim is that light arrives as compassion answering a messenger, and that the carrier
  is honoured in the scar. Orísha has named the lack: endless night, wan woods, unused eyes. Odúwa sends
  Ífa. Arámfè, who could have said the sons stole and must sit in the dark they chose, is moved. Fire
  comes down on a vulture''s head. The baldness is not a curse story smuggled in from another folklore.
  The recitation calls it honour for remembrance: the body of the bird keeps the fact that men have fire
  because someone burned. Moon and Day follow as further speech of the father — Night is no longer a lone
  watcher; Evening becomes a goddess who calls toilers home. The world gets a clock. The contested move
  is to treat illumination as care rather than as the restoration of a right. They asked. He pitied. The
  sun is not a stolen bag. It is a sent bird. Existentially, the teaching separates two kinds of goods.
  Some things you hold because you took them on the road. Some things arrive because a father still has
  compassion after the theft. Do not confuse them. And if you carry fire for others, do not hide the burned
  place. The bald patch is how a people remembers that light had a cost the carrier paid.'
