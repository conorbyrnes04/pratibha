- kind: key_terms
  label: Key Terms
  items:
  - term: vulture
    definition: the bird that brings red fire on its head -> carrier honoured by the burned place -> not
      an omen-animal to load with later folklore; here it is a servant of compassion
  - term: mark of honour for remembrance
    definition: the unfeathered patch -> memory worn on a body, not written -> "disfigurement" is the
      colonial eye; the gods command it as honour
  - term: Day took wings
    definition: Day as a flying goddess from Dawn's mists to Eve -> time as persons who roam and call
      -> clock-time misses that evening is someone who calls toilers home
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalms (Tehillim), Psalm 148, "Praise from Heaven and Earth"
    resonance: Both populate sun, moon, and night as ordered companions in a living cosmos rather than
      as dead lamps.
    divergence: The psalm's lights praise YHWH; here the lights are sent in pity because unused human
      eyes have been waiting in a sunless town.
  - citation: Lalla Vakyani, "The Sun Does Not Glow for the Good Land Only"
    resonance: Both refuse a light that would belong only to the already fortunate.
    divergence: Lalla's sun is impartial radiance; Arámfè's fire is a specific answer to Ìfẹ̀'s petition,
      carried on a burned head.
- kind: practice
  label: Practice (Abhyasa)
  body: Do one act of carrying light for someone who cannot yet see what they lack — an explanation, a
    lamp, a walk home. Do not demand thanks. Notice what it costs you, and do not hide the cost as if
    scar were shame.
