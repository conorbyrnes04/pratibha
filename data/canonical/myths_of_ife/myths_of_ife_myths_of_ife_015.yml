pratibha_layers:
- kind: original
  label: Original
  body: 'A deep compassion moved thundrous Arámfè,

    The Father of the Gods, and he sent down

    The vulture with red fire upon his head for men;

    and, by the Gods'' command, the bird still wears

    no plumage where those embers burned him—

    A mark of honour for remembrance. Again

    the pale Moon sought Night''s retreat; and Day took wings.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Arámfè; Ífa has gone as messenger
    to ask for sun and flame. The vulture is not given another Yoruba name here.'
- kind: translation
  label: Pratibha Translation
  body: 'Compassion moves thunderous Arámfè. He sends the vulture with red fire on its head for men. By
    command the bird still wears no plumage where the embers burned it — a mark of honour for remembrance.
    He speaks again: the pale Moon joins Night''s watch; Day takes wings, roaming from the mists of Dawn
    to Eve who calls the toilers home.'
