pratibha_layers:
- kind: original
  label: Original
  body: 'Always the marsh

    Pressed eagerly on Ífè; but ever the Bird

    Returned with the unconquerable sand

    Ojúmu poured from his enchanted shell,

    And the marsh yielded.'
