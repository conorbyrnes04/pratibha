- kind: key_terms
  label: Key Terms
  items:
  - term: marsh
    definition: eager wet that presses on Ìfẹ̀ -> the unmade as appetite at the town's edge -> "chaos"
      is too grand; marsh is local and persistent
  - term: unconquerable sand
    definition: what the Bird brings back from Ojúmu's shell -> tiny matter that does not lose -> the
      city is conquerable; the practice of pouring is not
  - term: enchanted shell
    definition: Ojúmu's vessel -> a held portion, enough for this return -> not a cornucopia; the bird
      must come again
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 8 and 78
    resonance: Both set a yielding or granular force against a heavier encroachment and trust repetition
      more than a single conquest.
    divergence: Daoist water takes the low place as virtue; here water is the problem and sand is the
      returning answer.
  - citation: Senegalese Animism, "The Woods Are Sanctuaries"
    resonance: Both treat a living edge of land — woods, marsh — as an agent that must be dealt with,
      not as scenery.
    divergence: Serer woods are sanctuaries of presence; Ìfẹ̀'s marsh is an eager undoer, and the sanctuary
      will have to be scratched out again by sand.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Identify the marsh that presses on one room of your life — the mess that returns eagerly. Pour
    one shell of sand today: a small, repeated act that has already worked before. Do not redesign the
    city.'
