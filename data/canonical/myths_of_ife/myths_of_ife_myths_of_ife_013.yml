unit_id: myths_of_ife.myths_of_ife_013
unit_label: The Marsh and the Unconquerable Sand
title: The Marsh and the Unconquerable Sand
unit_type: teaching_passage
commentary: 'The claim is that a founded city is not a finished victory over wet chaos; it is a rhythm
  of pressure and return. The gods have arrived. The world is still sunless. Marsh presses eagerly — the
  adverb matters. The unmade is not a defeated enemy sulking offshore; it is keen to take the town back.
  What holds Ìfẹ̀ is not a wall of theology but a bird that keeps coming back with sand from a priest''s
  shell. Unconquerable is said of the sand, not of the city. The city can be sodden, the people can lament;
  the grain still wins a little ground each time it is poured. This is maintenance as cosmogony. Creation
  did not end at the first scatter. It continues as repetition against eagerness. Ógun will soon bid the
  forest grow, and the forest will bud the pallid shoots of hopeless night — even growth can be wrong
  in the dark. Sand, at least, is honest: it does not pretend to be a garden yet. Existentially, the teaching
  is for work that must be redone because the marsh is part of the site, not a surprise. If you need the
  problem to stay solved, you will hate Ìfẹ̀. If you can become the one who returns with sand, you are
  already in the priest''s office. Yielding is what marshes do when someone does not get bored of pouring.'
