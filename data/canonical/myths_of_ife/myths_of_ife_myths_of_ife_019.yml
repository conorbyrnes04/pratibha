unit_id: myths_of_ife.myths_of_ife_019
unit_label: The First of Wars
title: The First of Wars
unit_type: teaching_passage
commentary: 'The claim is that war is not a human invention that later corrupts religion; it is a fall
  of gods, prepared by a theft, into which men are already drafted. Followings of gods and men: the first
  army is mixed. Ìfẹ̀ and the Forest are the first battlefield — city and wild together, the same pair
  that held thatch and wine a tale ago. The recitation names the event with liturgical exactness: the
  first of wars. There is a before, the age of mirth, when metal meant anvil. After this day, metal will
  remember this use. Fall from paths divine is not a Christian original sin pasted on. It is the priests''
  own verdict: godhead had a path, and the brothers left it. Woe for men is prepared, not accidental.
  The bag stolen on the road already contained this weather; the palace refusal only opens it. The contested
  move is to make the gods guilty in the hearing of a colonial officer without adopting his contempt.
  They are not "fetish figures who fight." They are makers who knew better and called arms anyway. Existentially,
  the teaching locates the first war in a family argument about who owns the teaching of the world. Most
  public violence still has that shape: a stolen competence, a rank that will not return it, followings
  happy to be armed. If you want fewer wars, return bags before drums sound in the palace.'
