- kind: key_terms
  label: Key Terms
  items:
  - term: first of wars
    definition: the day gods and men take arms in Ìfẹ̀ and the Forest -> war has a beginning in this telling,
      and it is divine before it is human -> "always war" is the cynicism the line refuses
  - term: paths divine
    definition: the way the gods have left -> mirth, teaching, the father's split of offices -> not a
      vague holiness; a road they were walking
  - term: woe that Odudúwa's theft prepared
    definition: human suffering as sequel of the roadside bag -> etiology of war -> blaming "human nature"
      alone absolves the founding theft
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 2.4–6, "How Can I Strike Those Worthy of Worship"
    resonance: Both set the horror of war inside a kinship of the sacred — brothers, elders, teachers
      — rather than as a fight with strangers.
    divergence: Arjuna recoils and is taught to stand; the Ìfẹ̀ gods do not recoil in time, and the recitation
      calls their standing-to-arms a fall.
  - citation: Samuel Johnson, The Yoruba Faith, "An Account at the Portals of Heaven"
    resonance: 'Both keep a moral afterlife of deeds: what is done on earth is not sealed as merely local.'
    divergence: Johnson's adage points to a future account; this unit already names woe in history as
      the prepared fruit of a theft among gods.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you enlist anyone — even as gossip — in a quarrel about who owns a skill, try one more
    direct return of the bag. If you still call allies, admit that you are leaving a path you knew.
