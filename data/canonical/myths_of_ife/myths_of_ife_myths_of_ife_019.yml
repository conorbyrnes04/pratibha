pratibha_layers:
- kind: original
  label: Original
  body: 'Orísha and Odúwa called

    To arms their followings of Gods and men,

    And on that day the first of wars began

    In Ífè and the Forest. Such was the fall

    Of the Gods from paths divine, and such for men

    The woe that Odudúwa''s theft prepared.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Orísha; Odúwa / Odudúwa; Ìfẹ̀.'
- kind: translation
  label: Pratibha Translation
  body: Orísha and Odúwa call to arms their followings of gods and men. On that day the first of wars
    begins in Ìfẹ̀ and the Forest. Such is the fall of the gods from paths divine, and such, for men,
    the woe Odudúwa's theft prepared.
