work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_001
unit_label: Where Truth Has Its Home
title: Where Truth Has Its Home
unit_type: teaching_passage
commentary: 'The claim is that truth is not a book and not a private vision but a place plus a mouth:
  shrine precincts of the makers, and priests who inherit speech. The Òrní opens the recitation by locating
  epistemology before cosmology. He does not first prove that the gods exist. He answers the colonial
  question — tell us your lore — by refusing the implied geography of knowledge. Truth does not travel
  better in a district officer''s notebook than it lives at the shrines. Greater surety belongs to the
  precincts and the line of mouths. This is living speech as a philosophical method. The world was made
  by Those who still have altars; the making is not a closed past event but a presence that can be pronounced.
  Handed down from sire to son is not a footnote about orality. It is the claim that reliability is genealogical:
  a priest is a correct vessel because the words have already been tested by a line of speakers, not because
  a text has been frozen. Wyndham''s blank verse is already a second remove — English of Yoruba that was
  not written down — and the unit must not pretend otherwise. The philosophical remainder is still sharp.
  Modern cultures locate truth in publication, laboratory, or confession. Ìfẹ̀ locates it where the makers
  are tended and where a mouth is authorized to speak them. Existentially, the teaching asks where you
  actually go when you want something true: a feed, a private feeling, or a place and a lineage that can
  correct you.'
