- kind: key_terms
  label: Key Terms
  items:
  - term: lore
    definition: Wyndham's English for the Òrní's recited knowledge -> not folklore-as-entertainment but
      the world's young hours kept at shrines -> "myth" in the dismissive sense misses that the speaker
      claims greater surety, not lesser
  - term: Òrní
    definition: 'religious head of Ìfẹ̀ in this recitation (Wyndham: Órní) -> the living mouth through
      which Odudúwa and Orísha still speak -> "king" or "chief" flattens the claim that a body can host
      the makers'
  - term: shrines of Those Who made the World
    definition: 'precincts of the makers as the home of truth -> knowledge has a topology: you go where
      the makers are tended -> "temple" is too building-like; the surety is precinct plus priestly mouth'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Olorun, the Lord of Heaven"
    resonance: Both place Yoruba knowledge of the highest in a structured relation — Johnson by naming
      Olorun as too exalted for direct business, the Òrní by seating truth at the makers' shrines and
      in priestly mouths.
    divergence: Johnson writes as a Yoruba clergyman in prose theology; this unit is an Ìfẹ̀ priest answering
      a colonial hearer, and it locates surety in shrine and lineage rather than in a reserved name for
      God alone.
  - citation: Lalla Vakyani, "I Found Him in My Own House"
    resonance: Both refuse a distant archive of truth and insist that what matters is found where a life
      already stands — house for Lalla, shrine-mouth for the Òrní.
    divergence: Lalla's house is the inward finding of Śiva; the Òrní's home of truth is public precinct
      and inherited speech, not a solitary recognition.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, do not look up a teaching first. Go to one actual place where a practice is kept — a shrine,
    a table, a room that has held the same words longer than you have — and listen for one sentence that
    is handed, not invented. Write that sentence down as received, not improved.
provenance:
  collection: Myths of Ìfẹ̀
  category: yoruba-ife
  verse: '1'
  section: Wyndham 1921, I. The Beginning
  cultural_context: Outsider English verse of insider recitation. Recited by Ìfẹ̀ high priests (Òrní and
    Babaláwo Arába) to a colonial ADO; English blank verse is Wyndham's. Restore the philosophical claim
    without adopting colonial framing, "fetish," or Wyndham's Golden Bough guesses as doctrine. Ceremonial
    how-to (sacrifice recipes, circumcision, festival license instructions) is excluded; the mythic argument
    is kept.
  original_source: Wyndham 1921, I. The Beginning
  original_reliability: SOURCED — Wyndham 1921 verse of Ìfẹ̀ priest recitation; Yoruba not preserved
