pratibha_layers:
- kind: original
  label: Original
  body: 'Oíbo, you have asked to hear our lore,

    The legends of the World''s young hours—and where

    Could truth in greater surety have its home

    Than in the precincts of the shrines of Those

    Who made the World, and in the mouths of priests

    To whom their doings have been handed down

    From sire to son?'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Òrní (religious head of Ìfẹ̀); Oíbo
    (white man, the colonial addressee).'
- kind: translation
  label: Pratibha Translation
  body: You have asked to hear our lore, the legends of the world's young hours. Where could truth have
    a surer home than at the shrines of Those who made the World, and in the mouths of priests to whom
    their doings have been handed down from sire to son?
