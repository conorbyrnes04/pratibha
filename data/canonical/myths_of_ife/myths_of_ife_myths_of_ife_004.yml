- kind: key_terms
  label: Key Terms
  items:
  - term: Odúwa / Odudúwa
    definition: first-born son of Arámfè, given bird, sand, and kingship -> judge of a mortal race, not
      owner of all gifts -> later ethnographic Oduduwa-as-sole-founder collapses the split this recitation
      insists on
  - term: Orísha
    definition: wisest son, looser of vague spirits, keeper of the bag -> maker of humankind and of arts,
      not the crown -> English "orisha" as any deity is wider; here Orísha is a person in the story, the
      Great
  - term: bag of Wisdom's guarded lore and arts
    definition: Arámfè's gift to Orísha for man's well-being -> portable competence, not a throne -> "magic
      sack" misses that the bag is pedagogy waiting for the right teacher
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 18.43–45, "Own Work as the Path to Success"
    resonance: Both assign different offices rather than one total competence, and treat the fitting task
      as the way a world holds.
    divergence: The Gita grounds the split in guṇa and svadharma toward Krishna; Arámfè splits kingship
      from lore inside a single divine family, and the plot will turn on the refusal of that split.
  - citation: Samuel Johnson, The Yoruba Faith, "Shaped by the Hand of Orisala"
    resonance: Both give a shaping god a share in making humankind beside a higher maker — Johnson's Orisala
      beside Olorun, this recitation's Orísha beside Arámfè.
    divergence: Johnson's Orisala shapes a lump God has already made; Orísha here receives a bag of arts
      and the work of loosing spirits, while land and kingship go to Odúwa.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Write two lists: what you actually hold (your bird and sand) and what you keep trying to seize
    from a sibling office (someone else''s bag). Return one seized item — a credit, a decision, a craft
    — to the person whose task it is.'
