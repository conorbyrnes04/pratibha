source_id: IFE_004
category: root_text
work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_004
unit_label: Kingship and the Bag
title: Kingship and the Bag
unit_type: teaching_passage
commentary: 'The claim is that founding a world requires a split the first-born will hate: rule is not
  the same gift as lore. Arámfè does not hand one son the whole of Heaven''s competence. Odúwa gets bird,
  sand, kingship, judgment — the power to make land and to be obeyed. Orísha gets the bag and the work
  of making people from spirits that are still only waiting. The younger sons get chorus, dance, worship,
  crafts: mirth and labour. A mortal race is explicitly not destined for the eternal life of gods. The
  counterintuitive move is to call Orísha''s task grateful. Wisdom looks like the better portion because
  hearts will turn to the god who spells strange benefits. Arámfè has already decided that kingship without
  arts is one office, and arts without the crown another. Ìfẹ̀ political theology starts here, before
  the theft. Empire can raise land from water and still lack the clue that wakes lore. Craft can shape
  a people and still owe judgment to a brother. Later war is not a foreign accident; it is this division
  refused. Existentially, the teaching asks which bag you keep grabbing. Many lives treat every gift as
  incomplete until it includes the other office — status plus technique, voice plus veto. Arámfè''s sentence
  is colder and kinder: a fitting task is already a world. The disaster begins when the king decides that
  kingship is cheated unless it also owns the arts.'
