pratibha_layers:
- kind: original
  label: Original
  body: 'Odúwa, first-born of my sons, to you I give

    The five-clawed Bird, the sand of power. . .

    You are their judge; Yours is the kingship. . .

    Wisest of my sons, Orísha, yours is the grateful

    task to loose Vague spirits waiting for the Dawn

    —to make the race that shall be; and to you I give

    This bag of Wisdom''s guarded lore and arts

    For Man''s well-being and advancement.'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Odúwa / Odudúwa (first-born, king
    of men); Orísha (wisest son, maker of the race); the five-clawed Bird and the bag of lore.'
- kind: translation
  label: Pratibha Translation
  body: 'Odúwa, first-born, receives the five-clawed Bird and the sand of power: call a despairing land
    to life above the jealous sea, found homesteads, judge a race that will not live as gods. Kingship
    is his. Orísha, wisest, receives the task of loosing vague spirits who wait for dawn — and the bag
    of Wisdom''s guarded lore and arts for the well-being of that race.'
- kind: commentary
  label: Pratibha Commentary
