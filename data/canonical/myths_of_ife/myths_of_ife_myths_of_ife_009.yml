pratibha_layers:
- kind: original
  label: Original
  body: 'Then spoke Orísha whom men call The Great:

    "Forbidding is our task, you say—but think

    how boundless is the fate you flinch from!

    Besides, is Godhead blind? You think Arámfè

    would not know? Has Might no bodes with eyes and ears?

    Dumb spirits hungering for life await us: let us go."'
- kind: iast
  label: Romanization
  body: 'Wyndham 1921 English of Ìfẹ̀ priest recitation. Key Yoruba: Orísha the Great; Odúwa; Arámfè.'
- kind: translation
  label: Pratibha Translation
  body: 'Orísha, whom men call the Great, answers: is this Odúwa, my mother''s son who stole the gift?
    The task is forbidding — but think how boundless is the fate you flinch from. Is godhead blind? Would
    Arámfè not know? Has Might no watchers? Dumb spirits hungering for life await us. Let us go.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that godhead is not a privilege of calm but an obligation to the unborn, under a
