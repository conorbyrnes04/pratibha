work_id: myths_of_ife
work_title: Myths of Ìfẹ̀
unit_id: myths_of_ife.myths_of_ife_009
unit_label: Is Godhead Blind
title: Is Godhead Blind
unit_type: teaching_passage
commentary: 'The claim is that godhead is not a privilege of calm but an obligation to the unborn, under
  a gaze that cannot be dodged. Orísha names the theft and still argues for descent. He does not forgive
  the bag; he refuses the extra sin of flight. Three reasons, stacked: the fate below is boundless (the
  work is worth the dark); Arámfè is not blind (flight is already seen); dumb spirits hunger for life
  (someone is waiting who cannot yet speak). The last is the philosophical center. Creation is owed to
  hungering shades, not to the gods'' career. They are not exploring. They are late for an appointment
  with those who have no mouths yet. "Is Godhead blind" is sarcasm with a metaphysics: if you are a god,
  you do not get the human alibi of a private getaway. Might has bodes. The father who laboured from a
  silent Purpose still sees. The recitation thus binds omniscience to ethics without making Arámfè a bargainer.
  He does not need to be asked. He would know. Existentially, Orísha''s questions cut two escapes. One
  is aesthetic despair: the task looks ugly, so it cannot be ours. The other is spiritual privacy: if
  we go back to the hills quietly, no one will notice. The spirits notice by hungering. The father notices
  by having bodes. Let us go is not bravado. It is the only sentence left that matches the office of a
  maker.'
