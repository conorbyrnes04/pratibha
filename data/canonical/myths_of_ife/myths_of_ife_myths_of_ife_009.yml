- kind: key_terms
  label: Key Terms
  items:
  - term: Godhead
    definition: 'Orísha''s word for what cannot pretend not to see -> office with witnesses, not a mood
      of power -> "divinity" as status misses the sarcasm: are we really going to act blind?'
  - term: bodes
    definition: Wyndham's watchers of Might -> Arámfè's eyes and ears in the waste -> not a police doctrine;
      the point is that flight is already public to the father
  - term: Dumb spirits hungering for life
    definition: those Orísha was charged to loose -> the unmade as appetite, not as clay -> "souls" is
      too finished; they are still mute and waiting for Dawn
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith, "Olorun, the Lord of Heaven"
    resonance: Both keep a high seeing that does not have to be fetched by ordinary petition — Johnson's
      Olorun too exalted to handle affairs, Orísha's Arámfè who would know if they fled.
    divergence: Johnson routes practice through òrìṣà intermediaries; here Orísha uses the father's gaze
      to force a brother over the cliff toward the hungering spirits.
  - citation: Plotinus, Enneads V.1.6, "The Emanation of the Intellectual-Principle from The One"
    resonance: Both refuse the idea that the higher is unaware of what proceeds from it.
    divergence: Plotinus describes necessary overflow from the One; Orísha speaks in accusation and hunger,
      and the next act is a chain hung down a cliff, not an emanation without drama.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Name one task you are calling "forbidding" because it would end a calm you have already outlived.
    Ask Orísha''s question aloud: who is hungering for life because you delay? Then go do the first unpretty
    action they need.'
