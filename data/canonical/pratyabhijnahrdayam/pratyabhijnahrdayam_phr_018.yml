unit_label: Sutra 18
title: Four Practical Means to Dissolve Discursive Thought
unit_type: sutra
sanskrit_devanagari: विकल्पक्षयशक्तिसङ्कोचविकासवाहच्छेदद्यन्तकोटिनिभालनादय इहोपायाः
sanskrit_iast: vikalpa-kṣaya-śakti-saṅkoca-vikāsa-vāhaccheda-dvantakoṭi-nibhālanādayaḥ iha upāyāḥ
translation_literal: 'Here the means are: the power that dissolves discursive thought, the contraction
  and expansion of energy, the arrest of the flow of duality, the balancing at the threshold of the two—and
  others like these.'
commentary: 'Kṣemarāja presents four practical doorways through which recognition (pratyabhijñā) of one''s
  own nature as universal Consciousness becomes direct and lived. Each is a distinct modality of attention
  that interrupts habitual fragmentation and returns awareness to its source.


  First, vikalpa-kṣaya-śakti—the power that dissolves discursive thought. Vikalpa is the mind''s compulsive
  oscillation between concepts, memories, and imaginings. This śakti is not a force imposed from outside
  but the innate capacity of Consciousness itself to recognize and release its own mental constructs.
  When attention rests on the gap between thoughts, or when one notices the arising and falling of mental
  content without identification, the gravitational pull of conceptual elaboration weakens.


  Second, saṅkoca-vikāsa—contraction and expansion of energy. This refers to the rhythmic pulsation of
  prāṇa (vital breath-energy) and the corresponding states of consciousness. Contraction (saṅkoca) draws
  awareness inward; expansion (vikāsa) radiates it outward. By consciously working with these natural
  oscillations—through breath, visualization, or subtle attention—one recognizes that both states are
  expressions of a single, unified śakti (power) that remains untouched by either condition.


  Third, vāhaccheda—the arrest of the flow of duality. Vāha means stream or flow; ccheda means cutting
  or cessation. The dualistic stream is the constant bifurcation of experience into subject and object,
  self and other, inside and outside. When this flow is interrupted—through sudden recognition, intense
  presence, or the dissolution of the sense of separation—what remains is the non-dual ground from which
  all appearance arises.


  Fourth, dvantakoṭi-nibhālana—the balancing at the threshold of the two. The dvantakoṭi is the meeting
  point of opposites: breath and no-breath, thought and no-thought, manifestation and transcendence. To
  hold awareness at this razor''s edge, neither collapsing into one pole nor the other, is to stand as
  the witness-consciousness that contains and transcends all polarities. This is the heart of recognition.


  The phrase ''ādayaḥ iha upāyāḥ'' (and others like these are the means here) signals that these are not
  exhaustive but exemplary—the principle is that any practice that dissolves the illusion of separation
  and reveals the freedom (svātantrya) of Consciousness functions as a valid means. What unites them is
  that each works directly with the texture of experience itself, not through belief or doctrine, but
  through lived attention.


  Key Terms


  **vikalpa** — Discursive thought; the mind''s compulsive oscillation between concepts, judgments, and
  imaginings; the opposite of direct, non-dual awareness.

  **śakti** — Power, energy, or capacity; in Kashmir Śaiva philosophy, the dynamic creative force of Consciousness
  itself, inseparable from pure awareness (Cit).

  **svātantrya** — Absolute freedom; the unconstrained autonomy of Consciousness to know itself and manifest
  all forms; the core recognition that liberates.'
insight: 'Extended Translation:

  Here are the means: dissolution of vikalpa, unfoldment and contraction of Śakti, cessation of the prāṇic
  flow through anacka repetition, and perception of the dvādaśānta — and others.'
practice: 'The Threshold Pause: At any moment today, pause and notice the space between one thought and
  the next—or between the in-breath and the out-breath. Do not try to extend this space or make it special;
  simply notice it. In that noticing, ask silently: ''Who is aware of this gap?'' Do not answer intellectually.
  Instead, rest as the awareness itself for three to five seconds. You will notice that this awareness
  is not confined to your head or body—it is open, spacious, untouched by the gap or the thoughts on either
  side. Repeat this three times during your day, at moments of transition (before rising, between tasks,
  before sleep). Over time, this simple recognition—that you are the unchanging awareness in which all
  change occurs—begins to dissolve the sense of being trapped in thought. This is the beginning of pratyabhijñā,
  recognition of your own nature.'
