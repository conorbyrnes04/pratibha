sanskrit_devanagari: विकल्पक्षयशक्तिसङ्कोचविकासवाहच्छेदद्यन्तकोटिनिभालनादय इहोपायाः
sanskrit_iast: vikalpa-kṣaya-śakti-saṅkoca-vikāsa-vāhaccheda-dvantakoṭi-nibhālanādayaḥ iha upāyāḥ
translation_literal: 'Here are the means: dissolution of vikalpa, unfoldment and contraction of Śakti, cessation of the prāṇic
  flow through anacka repetition, and perception of the dvādaśān...'
commentary: 'Extended Translation:

  Here are the means: dissolution of vikalpa, unfoldment and contraction of Śakti, cessation of the prāṇic flow through anacka
  repetition, and perception of the dvādaśānta — and others.


  The text''s most practical sūtra: a compressed list of *upāyas* (means, methods) for achieving the unfoldment of the *madhya*
  (Sūtra 17). *Vikalpa-kṣaya* — dissolution of discursive thought — is the first and most fundamental: as the mental habit
  of dividing, naming, and differentiating relaxes, the unifying ground becomes visible. *Śakti-saṅkoca-vikāsa* — simultaneous
  contraction and unfoldment of vital energy — refers to the withdrawal of prāṇaśakti from the sense-organs (contraction)
  while the senses continue operating (unfoldment): sensory engagement without sensory identification. *Vāhaccheda* — cessation
  of the prāṇic flow through the repetition of anacka (consonant-only, vowel-less) sounds — is a specific breathwork-as-mantra
  practice. *Dvādaśānta-nibhālana* — perception of the twelve-finger points — refers to attending to the natural endpoints
  of the breath cycle. All of these are entry points into *madhya*.


  Cross-Tradition Resonance:

  - Vijñāna Bhairava Tantra dhāraṇā 1: the *dvādaśānta* practice as the opening of the entire VBT text — the same method named
  here.

  - Yoga Sūtras I.34: *pracchardana-vidhāraṇa* — the practice of exhalation and retention as a path to *citta-prasādanam*
  (clarification of mind). The parallel is structural.

  - Hesychast breathwork: coordinating the Jesus Prayer with the breath cycle — a Christian contemplative parallel to *vāhaccheda*.'
insight: 'Extended Translation:

  Here are the means: dissolution of vikalpa, unfoldment and contraction of Śakti, cessation of the prāṇic flow through anacka
  repetition, and perception of the dvādaśānta — and others.'
practice: 'Choose one: Either (1) for five minutes, every time a thought arises, simply notice it as *vikalpa* — a dividing
  movement — without following it. Let it dissolve. (2) Or, breathe naturally and place full attention on the two natural
  pauses — at the top of the inhalation and the bottom of the exhalation. These are the *dvādaśānta* points. Rest in each
  one for as long as it naturally lasts. Do not extend it. Notice what is there.'
