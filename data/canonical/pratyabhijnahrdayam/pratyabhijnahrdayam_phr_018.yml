- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    Here are the means: dissolution of vikalpa, unfoldment and contraction of Śakti, cessation of the prāṇic flow through
    anacka repetition, and perception of the dvādaśānta — and others.


    The text''s most practical sūtra: a compressed list of *upāyas* (means, methods) for achieving the unfoldment of the *madhya*
    (Sūtra 17). *Vikalpa-kṣaya* — dissolution of discursive thought — is the first and most fundamental: as the mental habit
    of dividing, naming, and differentiating relaxes, the unifying ground becomes visible. *Śakti-saṅkoca-vikāsa* — simultaneous
    contraction and unfoldment of vital energy — refers to the withdrawal of prāṇaśakti from the sense-organs (contraction)
    while the senses continue operating (unfoldment): sensory engagement without sensory identification. *Vāhaccheda* — cessation
    of the prāṇic flow through the repetition of anacka (consonant-only, vowel-less) sounds — is a specific breathwork-as-mantra
    practice. *Dvādaśānta-nibhālana* — perception of the twelve-finger points — refers to attending to the natural endpoints
    of the breath cycle. All of these are entry points into *madhya*.'
- kind: key_terms
  label: Key Terms
  items:
  - term: vikalpa
    definition: discursive thought, conceptual division, the mental habit of differentiating; the primary obstacle to recognition
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: kṣaya
    definition: dissolution, wearing away; not violent suppression but natural fading
  - term: vāhaccheda
    definition: cessation of the prāṇic flow; *vāha* (vital current) + *cheda* (cessation)
  - term: anacka
    definition: consonants without vowels; sounds that arrest the breath cycle
  - term: dvādaśānta
    definition: the twelve-finger points; the natural endpoints of exhalation and inhalation where *madhya* is most accessible
  - term: upāya
    definition: means, method, pathway; the technical term for spiritual practice in this tradition
