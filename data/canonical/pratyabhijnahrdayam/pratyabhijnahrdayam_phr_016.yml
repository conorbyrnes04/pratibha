title: Stable Recognition Liberates While Living
unit_type: sutra
sanskrit_devanagari: चिदानन्दलाभे देहादिषु चेत्यमानेष्वपि चिदैकात्म्यप्रतिपत्तिदार्ढ्यं जीवन्मुक्तिः
sanskrit_iast: cit-ānanda-lābhe deha-ādiṣu cetyamāneṣu api cit-aikātmya-pratipatti-dārḍhyam jīvanmuktiḥ
translation_literal: When Consciousness-and-bliss is obtained, even while the body and other objects continue to be perceived,
  the firm establishment of recognition that all these are one with Consciousness itself—this is liberation while living.
commentary: 'This sūtra distills the heart of jīvanmukti, the liberation accessible within an embodied life. Kṣemarāja clarifies
  that freedom is not postponed to death or dependent on the cessation of perception. Rather, it unfolds through a specific
  shift in recognition (pratyabhijñā).


  The passage moves through three interlocking recognitions:


  1. **Cit-ānanda-lābhe** (''obtaining Consciousness-and-bliss''): This is not mystical acquisition but the recovery of what
  is already one''s nature. The dual term cit-ānanda points to the inseparable unity of pure Consciousness (cit) and its intrinsic
  delight (ānanda). This is not happiness dependent on objects, but the luminous joy native to awareness itself.


  2. **Deha-ādiṣu cetyamāneṣu api** (''even while body and others continue to be perceived''): The critical word is *api*
  (''even''). The body persists, sensations arise, thoughts flow, the world appears. The liberated one does not escape the
  body or deny perception. This is the revolutionary claim: freedom is compatible with—indeed, perfected within—continued
  embodiment and perception.


  3. **Cit-aikātmya-pratipatti-dārḍhyam** (''firm establishment of recognition as one-Self with Consciousness''): The core
  move is *aikātmya*—non-duality, the recognition that body, mind, objects, and the perceiving subject are all expressions
  of a single, undivided Consciousness. This recognition must be *dārḍhya* (firm, unshakeable, stable)—not a fleeting insight
  but a lived certainty that persists through all states and circumstances.


  The sūtra teaches that jīvanmukti is not a state of trance or dissociation. It is the unbroken clarity that whatever appears—sensation,
  thought, world—is the play of one''s own Consciousness. The body-mind apparatus continues its function; the world unfolds
  as before. But the one who knows has shifted from the illusion of being a separate subject observing external objects to
  the recognition of being the non-dual Consciousness in which all appearance arises. This recognition, when stable, is itself
  liberation.


  This teaching directly opposes the view that enlightenment requires withdrawal from embodied life or that perception itself
  is bondage. Instead, it invites the recognition that bondage lies only in the forgetting of one''s true nature—and freedom
  lies in remembering it while fully alive.


  Key Terms


  **cit-ānanda** — Consciousness-and-bliss; the inseparable unity of pure awareness and its intrinsic delight, the nature
  of the Self.

  **aikātmya** — Non-duality, the recognition that all apparent multiplicity is one Self; the core of pratyabhijñā.

  **jīvanmukti** — Liberation while living; freedom realized in an embodied life through the stable recognition of one''s
  nature as universal Consciousness.'
insight: 'Extended Translation:

  When one obtains the Bliss of Absolute Consciousness, and this recognition of identity with Consciousness is stable — even
  as body and all else continues to be experienced — that is Liberation while living.'
practice: '**Recognition Through Ordinary Perception (Cit-Aikātmya Sādhana)**


  Choose one ordinary activity today—eating, walking, listening to a conversation, or washing your hands.


  1. **Begin with sensation**: As you engage in the activity, notice the sensations—texture, temperature, movement, sound.
  Do not analyze; simply be present to what is perceived.


  2. **Notice the perceiver**: Now, without losing the sensations, notice that there is an awareness in which these sensations
  appear. This awareness is not *in* the body; the body-sensations are in it. Rest as this aware presence for a few breaths.


  3. **Recognize continuity**: Observe that this same awareness that perceives sensation also perceives thought, emotion,
  and the sense of ''I.'' It is the common ground of all experience.


  4. **Establish the recognition**: Gently affirm: "All of this—sensation, perception, the sense of self—is the play of one
  Consciousness. I am not separate from what I perceive; I am the Consciousness in which it all appears."


  5. **Return and repeat**: Complete the activity. Throughout the day, return to this recognition in brief moments—while waiting,
  between tasks, before sleep. Each time, let the recognition settle a little deeper.


  The goal is not to achieve a special state but to stabilize the recognition that Consciousness and its manifestation are
  not two. Over time, this recognition becomes the stable ground of your living—jīvanmukti.'
