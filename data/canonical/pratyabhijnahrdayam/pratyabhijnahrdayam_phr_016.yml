- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    When one obtains the Bliss of Absolute Consciousness, and this recognition of identity with Consciousness is stable —
    even as body and all else continues to be experienced — that is Liberation while living.


    *Jīvanmukti* — liberation while still embodied, while the body-mind continues its functioning, while the world continues
    appearing. The critical word is *dārḍhyam* — stability, firmness, consolidation. The glimpse of recognition (*pratyabhijñā*)
    can be brief, easily eclipsed by old contractions. Liberation, in the Pratyabhijñā framework, is not the achievement of
    a permanent altered state but the *stabilization* of recognition such that it is not disturbed by the arising and passing
    of experience — including body, emotion, thought. The *deha-ādi* (body and other objects) continue; *cetyamāneṣu* — being
    experienced — they remain fully present. What has changed is not the appearances but the ground in which they are recognized.
    This is liberation not from the world but *as* the world''s ground.'
