sanskrit_devanagari: चिदानन्दलाभे देहादिषु चेत्यमानेष्वपि चिदैकात्म्यप्रतिपत्तिदार्ढ्यं जीवन्मुक्तिः
sanskrit_iast: cit-ānanda-lābhe deha-ādiṣu cetyamāneṣu api cit-aikātmya-pratipatti-dārḍhyam jīvanmuktiḥ
translation_literal: When one obtains the Bliss of Absolute Consciousness, and this recognition of identity with Consciousness
  is stable — even as body and all else continues to be experie...
commentary: 'Extended Translation:

  When one obtains the Bliss of Absolute Consciousness, and this recognition of identity with Consciousness is stable — even
  as body and all else continues to be experienced — that is Liberation while living.


  *Jīvanmukti* — liberation while still embodied, while the body-mind continues its functioning, while the world continues
  appearing. The critical word is *dārḍhyam* — stability, firmness, consolidation. The glimpse of recognition (*pratyabhijñā*)
  can be brief, easily eclipsed by old contractions. Liberation, in the Pratyabhijñā framework, is not the achievement of
  a permanent altered state but the *stabilization* of recognition such that it is not disturbed by the arising and passing
  of experience — including body, emotion, thought. The *deha-ādi* (body and other objects) continue; *cetyamāneṣu* — being
  experienced — they remain fully present. What has changed is not the appearances but the ground in which they are recognized.
  This is liberation not from the world but *as* the world''s ground.


  Cross-Tradition Resonance:

  - Yoga Sūtras IV.29–34: *dharma-megha samādhi* and *kaivalya* — the final stabilization in Patañjali''s system; the parallel
  in a dualist framework.

  - Ramana Maharshi: the *jīvanmukta* who moves through the world with full recognition, unaffected by its content while fully
  engaged with it.

  - Boethius on *felicitas vera* (true happiness): not dependent on external conditions — a partial Western parallel, though
  not non-dual.'
insight: 'Extended Translation:

  When one obtains the Bliss of Absolute Consciousness, and this recognition of identity with Consciousness is stable — even
  as body and all else continues to be experienced — that is Liberation while living.'
practice: Notice a moment of genuine ease — even a small one. In that ease, is there a sense of fullness that is not *because*
  of any particular thing? That self-existing fullness is a taste of *cidānanda*. The practice of *jīvanmukti* is essentially
  the repeated recognition and stabilization of this fullness, until it becomes the background in which all experience moves.
  You are not chasing it. You are learning to stop moving away from it.
