  - term: aikātmya
    definition: identity, oneness of self; the non-separateness of self and Consciousness
  - term: pratipatti
    definition: recognition, awareness, understanding; the cognitive dimension of liberation
  - term: dārḍhyam
    definition: stability, firmness, consolidation; the mark of genuine rather than fleeting liberation
  - term: jīvanmukti
    definition: liberation while living; *jīvan* (living, alive) + *mukti* (liberation, release)
