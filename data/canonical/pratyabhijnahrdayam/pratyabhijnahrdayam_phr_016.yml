- kind: practice
  label: Practice (Abhyasa)
  body: Notice a moment of genuine ease — even a small one. In that ease, is there a sense of fullness that is not *because*
    of any particular thing? That self-existing fullness is a taste of *cidānanda*. The practice of *jīvanmukti* is essentially
    the repeated recognition and stabilization of this fullness, until it becomes the background in which all experience moves.
    You are not chasing it. You are learning to stop moving away from it.
