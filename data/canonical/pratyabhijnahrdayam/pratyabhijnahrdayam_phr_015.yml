title: Recognizing Consciousness Assimilates the Universe
unit_type: sutra
sanskrit_devanagari: बललाभे विश्वमात्मसात्करोति
sanskrit_iast: bala-lābhe viśvam ātmasāt karoti
translation_literal: When power is obtained, the universe becomes one's own self.
commentary: 'This sūtra distills the heart of Pratyabhijñā recognition: the attainment of śakti—the dynamic, conscious power
  that is one''s true nature—immediately transforms one''s relationship to the entire cosmos. The universe does not change;
  rather, the recognition of one''s identity with universal Consciousness (Cit) reveals that what appeared external and separate
  is, in fact, one''s own manifestation.


  The word bala (power, strength, capacity) here refers not to muscular or political force, but to the śakti of Consciousness
  itself—the inherent freedom (svātantrya) and creative potency that Kṣemarāja identifies as the very essence of the Self.
  When this power is ''obtained'' (lābhe), it means when it is recognized and owned as one''s own nature, not acquired from
  outside.


  Ātmasāt karoti—''assimilates as one''s own self''—is the crucial verb. The universe does not dissolve or become unreal;
  rather, it is recognized as the spontaneous play (līlā) of one''s own Consciousness. The subject-object duality collapses
  not through negation but through the direct realization that the apparent multiplicity is the self-expression of a single,
  unified awareness.


  This is the non-dualistic recognition (pratyabhijñā) that liberates: not through rejection of the world, but through the
  immediate knowing that ''I am the source and substance of all that appears.'' The power referred to is thus the power of
  recognition itself—the capacity to see through the veil of apparent separation and reclaim the universe as one''s own body,
  one''s own play, one''s own infinite presence.


  Key Terms


  **bala** — Power, capacity, strength—here the inherent śakti (conscious potency) of the Self, not external force

  **ātmasāt karoti** — Assimilates as one''s own self; recognizes as non-different from one''s own nature

  **śakti** — Dynamic conscious power; the creative freedom and manifestation-potential of universal Consciousness'
insight: '*Bala* — the Power or Strength — here refers to the power of Citi fully recognized, the strength of the uncontracted
  awareness that is no longer bewildered by its own productions.'
practice: Look at any object before you—a wall, a tree, a person's face—and hold your gaze there while silently repeating
  'this is my own manifestation' until the boundary between seer and seen begins to soften; when it does, let your gaze relax
  and notice what remains.
