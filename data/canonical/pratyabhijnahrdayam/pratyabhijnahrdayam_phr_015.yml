pratibha_layers:
- kind: original
  label: Original
  body: बललाभे विश्वमात्मसात्करोति
- kind: iast
  label: IAST
  body: bala-lābhe viśvam ātmasāt karoti
- kind: translation
  label: Pratibha Translation
  body: When one obtains the Power of Consciousness, one assimilates the universe to oneself — experiences unity with it.
- kind: commentary
  label: Pratibha Commentary
  body: '*Bala* — the Power or Strength — here refers to the power of Citi fully recognized, the strength of the uncontracted
    awareness that is no longer bewildered by its own productions. *Ātmasāt karoti* is a technical compound meaning "to make
    similar to oneself, to assimilate, to experience as non-other." When the fire of Consciousness has sufficient strength
    — when *pratyabhijñā* deepens from glimpse to ground — the universe is no longer experienced as other. This is not absorption
    or dissolution of the world. The appearances remain. What changes is the ontological relationship: from *subject encountering
    objects* to *Consciousness recognizing itself as the universe*. The Dào that can be named (Sūtra 3''s multiplicity) is
    recognized as the unnamed Dào (Sūtra 1''s unity) without either being cancelled.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bala
    definition: strength, power; here the full power of recognized Consciousness
  - term: lābha
    definition: obtaining, gaining, finding; the moment of genuine possession/realization
  - term: ātmasāt
    definition: making similar to oneself, assimilating; experiencing as non-other; from *ātma* + *sāt* (a suffix of assimilation)
  - term: viśvam
    definition: the universe, the totality of appearance
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ashtavakra Gītā II.1
    resonance: '"I am the infinite ocean; the world arises in me like waves." The same assimilation described in declarative
      terms.'
    divergence: ''
    passage_id: ''
  - citation: Spanda Kārikā I.1
    resonance: the one who rests in Spanda holds the universe as his body.
    divergence: ''
    passage_id: ''
  - citation: Eckhart
    resonance: the *Mensch* who has reached the *Grunde* — the man who has found the ground — carries the world within rather
      than encountering it without.
    divergence: ''
    passage_id: ''
