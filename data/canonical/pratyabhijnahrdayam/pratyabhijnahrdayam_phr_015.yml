- kind: practice
  label: Practice (Abhyasa)
  body: Look at your hand. Notice the seeing — the awareness in which the hand appears. Now expand that awareness to include
    the room, without moving the attention. Then the sounds beyond the room. Notice that awareness does not strain at its
    edges — it simply *is* everywhere it is. The universe is not being added to you. You are recognizing that it was never
    outside.
