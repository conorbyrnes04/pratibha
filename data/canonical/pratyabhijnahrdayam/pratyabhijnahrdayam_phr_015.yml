sanskrit_devanagari: बललाभे विश्वमात्मसात्करोति
sanskrit_iast: bala-lābhe viśvam ātmasāt karoti
translation_literal: When one obtains the Power of Consciousness, one assimilates the universe to oneself
  — experiences unity with it.
commentary: '*Bala* — the Power or Strength — here refers to the power of Citi fully recognized, the strength
  of the uncontracted awareness that is no longer bewildered by its own productions. *Ātmasāt karoti*
  is a technical compound meaning "to make similar to oneself, to assimilate, to experience as non-other."
  When the fire of Consciousness has sufficient strength — when *pratyabhijñā* deepens from glimpse to
  ground — the universe is no longer experienced as other. This is not absorption or dissolution of the
  world. The appearances remain. What changes is the ontological relationship: from *subject encountering
  objects* to *Consciousness recognizing itself as the universe*. The Dào that can be named (Sūtra 3''s
  multiplicity) is recognized as the unnamed Dào (Sūtra 1''s unity) without either being cancelled.


  Cross-Tradition Resonance:

  - Ashtavakra Gītā II.1: "I am the infinite ocean; the world arises in me like waves." The same assimilation
  described in declarative terms.

  - Spanda Kārikā I.1: the one who rests in Spanda holds the universe as his body.

  - Eckhart: the *Mensch* who has reached the *Grunde* — the man who has found the ground — carries the
  world within rather than encountering it without.'
insight: '*Bala* — the Power or Strength — here refers to the power of Citi fully recognized, the strength
  of the uncontracted awareness that is no longer bewildered by its own productions.'
practice: Look at your hand. Notice the seeing — the awareness in which the hand appears. Now expand that
  awareness to include the room, without moving the attention. Then the sounds beyond the room. Notice
  that awareness does not strain at its edges — it simply *is* everywhere it is. The universe is not being
  added to you. You are recognizing that it was never outside.
