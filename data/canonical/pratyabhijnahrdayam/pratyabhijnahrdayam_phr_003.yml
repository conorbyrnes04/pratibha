  - term: nānā
    definition: many, multiple, diverse
  - term: anurūpa
    definition: mutually adapted, corresponding, fitted to each other
  - term: grāhya
    definition: the knowable, the object of experience
  - term: grāhaka
    definition: the knower, the subject of experience
  - term: bheda
    definition: differentiation, division, distinction
