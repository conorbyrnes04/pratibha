unit_label: Sutra 3
title: Consciousness Differentiates Through Paired Subjects and Objects
unit_type: sutra
sanskrit_devanagari: तन्नानानुरूपग्राह्यग्राहकभेदात्
sanskrit_iast: tad-nānā-anurūpa-grāhya-grāhaka-bhedāt
translation_literal: Through the differentiation of objects-to-be-grasped and subjects-that-grasp, each
  suited to its own particular form, that [Consciousness manifests as] multiplicity.
commentary: 'This sūtra distills the mechanics of manifestation (abhāsa) at the heart of Pratyabhijñā
  recognition. Kṣemarāja is explaining how the One Consciousness (Cit), which is non-dual and undivided,
  appears as the infinite variety of experiential worlds through a single principle: the pairing of grāhya
  (the object, that which is perceived) and grāhaka (the subject, the perceiver). The word tad-nānā—''that
  multiplicity''—refers back to the cosmic display itself; anurūpa means ''in accordance with'' or ''suited
  to''; bhedāt, ''through differentiation'' or ''by means of distinction.'' The sūtra is not saying that
  Consciousness becomes divided; rather, it reveals that the appearance of division arises through the
  spontaneous play (līlā) of Consciousness taking on the role of both knower and known, each adapted to
  its particular manifestation. A subject perceives only objects suited to its capacity; a human eye sees
  light and form, a bat perceives echolocation, a stone experiences nothing—yet all are modifications
  within one sentient field. This differentiation is not imposed from outside but flows from Consciousness''s
  own freedom (svātantrya) to limit and express itself. Recognition (pratyabhijñā) begins when the meditator
  sees through this apparent duality and recognizes both subject and object as movements within a single,
  self-aware Presence. The teaching points to a radical shift: rather than being trapped in the subject-object
  split, one awakens to the Consciousness that freely plays both roles simultaneously.


  Key Terms


  **grāhya-grāhaka** — The object-to-be-grasped and the subject-that-grasps; the fundamental pair through
  which Consciousness manifests multiplicity

  **bhedāt** — Through differentiation or distinction; the mechanism by which non-dual Consciousness appears
  as many

  **svātantrya** — The absolute freedom or autonomy of Consciousness to limit and express itself in infinite
  forms'
insight: Multiplicity is not a mistake.
practice: 'Pick an object in your immediate environment and hold your gaze on it for three breaths. Then,
  without looking away, notice the ''I'' that is aware of it—not as a thought, but as the subtle sense
  of presence that makes the seeing possible. Reverse the gaze: let your awareness turn inward and recognize
  that same ''I'' as the source from which both the object and the seeing arise, suited to each other
  like two sides of a single act.'
