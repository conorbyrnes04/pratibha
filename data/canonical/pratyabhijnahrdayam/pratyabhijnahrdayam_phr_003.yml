- kind: practice
  label: Practice (Abhyasa)
  body: In conversation today, notice the moment of contact between your knowing and another's being. What is the quality
    of that gap — perceiver and perceived? Can you sense both poles as arising within the same field of awareness, rather
    than as two separate substances meeting?
