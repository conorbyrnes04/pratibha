- kind: translation
  label: Pratibha Translation
  body: The universe is multiple because of the differentiation of reciprocally adapted objects and subjects.
- kind: commentary
  label: Pratibha Commentary
  body: 'Multiplicity is not a mistake. The one Consciousness does not fragment — it differentiates. *Grāhya* (the knowable)
    and *grāhaka* (the knower) arise together, paired, co-constitutive. There is no object without a subject oriented toward
    it; no subject without an object it takes up. This pairing — *anurūpa*, "mutually adapted" — is what generates the texture
    of experience. The whole phenomenal world is a vast ecology of perceiving and perceived, each form of awareness calling
    forth its corresponding objects. Kṣemarāja insists this diversity does not contradict non-duality: the one canvas supports
    infinite paintings without itself being divided.'
- kind: key_terms
  label: Key Terms
