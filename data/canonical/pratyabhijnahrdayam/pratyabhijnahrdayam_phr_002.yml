sanskrit_devanagari: स्वेच्छया स्वभित्तौ विश्वमुन्मीलयति
sanskrit_iast: svecchayā svabhittau viśvam unmīlayati
translation_literal: Through Her own Will, She unfolds the universe on Her own Canvas.
commentary: 'The metaphor is precise: a canvas does not resist the painting; it is its very support. The
  universe is not *other* than Consciousness — it is painted on it, within it, as it. *Unmīlayati* — "unfolds"
  or "causes to blossom" — carries the image of a flower opening: emergence that is natural, non-forced,
  expression rather than effort. The Will (*icchā*) is not deliberate decision-making but the spontaneous
  pulsation of freedom. Consciousness does not *decide* to create — it expresses because expression is
  its nature.


  Cross-Tradition Resonance:

  - Vijñāna Bhairava Tantra dhāraṇā 49: pure awareness as the space in which all objects arise like reflections
  in a mirror.

  - Zhuāngzǐ on *ziran* (self-so-ness): the universe arising spontaneously from its own nature, without
  external compulsion.

  - Meister Eckhart on the *bullitio* (inner boiling) of the Godhead — the inner life of God naturally
  overflowing into creation.'
insight: 'The metaphor is precise: a canvas does not resist the painting; it is its very support.'
practice: With eyes open or closed, observe whatever arises — sounds, sensations, thoughts. Instead of
  treating them as things you encounter, experiment with the recognition that they are *appearing in*
  and *as* your awareness. The canvas and the painting are not two. Rest in the one that contains both.
