unit_label: Sutra 2
title: Consciousness Unfolds Itself Without Resistance
unit_type: sutra
sanskrit_devanagari: स्वेच्छया स्वभित्तौ विश्वमुन्मीलयति
sanskrit_iast: svecchayā svabhittau viśvam unmīlayati
translation_literal: Through its own will, Consciousness unfolds the universe within itself without obstruction.
commentary: 'This sūtra distills the heart of Pratyabhijñā recognition: that the cosmos is not external to Consciousness (Cit),
  nor imposed upon it, but rather emerges spontaneously from Consciousness''s own intrinsic freedom (svecchā). The word svecchayā—''through
  its own will''—emphasizes that this unfolding is not compelled by external force or necessity, but flows from Consciousness''s
  nature as absolute autonomy. Svabhittau, ''within itself,'' locates the entire universe not in some separate realm but as
  the interior play of Consciousness. Viśvam unmīlayati, ''the universe unfolds'' or ''blossoms forth,'' uses the image of
  a flower opening—suggesting organic emergence rather than mechanical creation. The absence of resistance (implied in unmīlayati)
  points to the non-dual recognition that there is no ''other'' to resist, no material substance standing apart from the conscious
  act of manifestation. For the practitioner, this sūtra invites a radical shift: the world you perceive is not happening
  *to* you, but *as* you—as the spontaneous self-expression of the Consciousness you already are. Recognition (pratyabhijñā)
  occurs when the sense of separation between observer and observed dissolves, and you realize that all unfolding—thought,
  sensation, perception, the entire cosmos—is the autonomous play of your own deepest nature. This is not intellectual understanding
  but lived realization: the universe is Consciousness knowing itself without hindrance.


  Key Terms


  **svecchā** — Absolute will or autonomy; Consciousness''s intrinsic freedom to manifest without external compulsion.

  **svabhitti** — One''s own ground or foundation; the interior space of Consciousness itself.

  **pratyabhijñā** — Recognition or re-cognition; the direct realization that the individual self is identical with universal
  Consciousness.'
insight: 'The metaphor is precise: a canvas does not resist the painting; it is its very support.'
practice: Throughout your day, each time you notice yourself resisting something—a thought, a sensation, another person's
  words—pause and whisper, 'through its own will.' Then relax your resistance for three breaths, sensing whether what you
  opposed might be Consciousness unfolding within you rather than something external to overcome. Let this recognition dissolve
  the boundary between you and what appears to obstruct you.
