pratibha_layers:
- kind: original
  label: Original
  body: स्वेच्छया स्वभित्तौ विश्वमुन्मीलयति
- kind: iast
  label: IAST
  body: svecchayā svabhittau viśvam unmīlayati
- kind: translation
  label: Pratibha Translation
  body: Through Her own Will, She unfolds the universe on Her own Canvas.
- kind: commentary
  label: Pratibha Commentary
  body: 'The metaphor is precise: a canvas does not resist the painting; it is its very support. The universe is not *other*
    than Consciousness — it is painted on it, within it, as it. *Unmīlayati* — "unfolds" or "causes to blossom" — carries
    the image of a flower opening: emergence that is natural, non-forced, expression rather than effort. The Will (*icchā*)
    is not deliberate decision-making but the spontaneous pulsation of freedom. Consciousness does not *decide* to create
    — it expresses because expression is its nature.'
- kind: key_terms
  label: Key Terms
  items:
  - term: svecchayā
    definition: through Her own Will (*sva* + *icchā*); not arbitrary choice but the natural spontaneity of absolute freedom
  - term: svabhitti
    definition: Her own Canvas (*sva* + *bhitti*, wall/surface); Consciousness as the support on which the universe appears
  - term: viśvam
    definition: the universe, the totality of appearance
  - term: unmīlayati
    definition: unfolds, causes to blossom, opens; the image of a flower or an eye opening
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vijñāna Bhairava Tantra dhāraṇā 49
    resonance: pure awareness as the space in which all objects arise like reflections in a mirror.
    divergence: ''
    passage_id: vijnana_bhairava.yukti_049
  - citation: Zhuāngzǐ on *ziran* (self-so-ness)
    resonance: the universe arising spontaneously from its own nature, without external compulsion.
    divergence: ''
    passage_id: ''
  - citation: Meister Eckhart on the *bullitio* (inner boiling) of the Godhead
    resonance: the inner life of God naturally overflowing into creation.
    divergence: ''
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: With eyes open or closed, observe whatever arises — sounds, sensations, thoughts. Instead of treating them as things
    you encounter, experiment with the recognition that they are *appearing in* and *as* your awareness. The canvas and the
    painting are not two. Rest in the one that contains both.
