title: Recognition Sustained Through Repeated Self-Reflection
unit_type: sutra
sanskrit_devanagari: समाधिसंस्कारवति व्युत्थाने भूयो भूयश्चिदैक्यामर्शान्नित्योदितसमाधिलाभः
sanskrit_iast: samādhi-saṁskāravati vyutthāne bhūyas bhūyaḥ cit-aikya-āmarśāt nitya-udita-samādhi-lābhaḥ
translation_literal: When one emerges from absorption (samādhi) bearing its imprint, through repeated
  and renewed touching of the unity of Consciousness (cit-aikya), there arises the perpetual arising of
  samādhi—a stability that never sets.
commentary: 'This sūtra addresses the crucial threshold between formal meditation and lived recognition.
  Kṣemarāja describes what happens when a practitioner returns from samādhi—that state of unified absorption
  where subject-object duality dissolves—yet carries its trace (saṁskāra) into waking life.


  The phrase ''vyutthāne bhūyas bhūyaḥ'' (''in emergence, again and again'') signals the core practice:
  each time consciousness surfaces from absorption, rather than losing the recognition, one deliberately
  re-touches (āmarśa) the non-dual nature of awareness itself. This is not a return to fragmentation but
  a conscious renewal of the same unity.


  ''Cit-aikya-āmarśa'' is the key move—a deliberate, intimate contact with the fact that Consciousness
  (cit) remains singular and undivided whether in samādhi or in the midst of activity. The ''āmarśa''
  is not intellectual but a felt re-cognition, a touching-again of what was already present.


  The result is ''nitya-udita-samādhi-lābhaḥ''—not a samādhi that comes and goes, but one that perpetually
  arises because the practitioner no longer treats emergence as a fall from grace. Instead, each moment
  of return becomes an occasion to recognize that the same unified Consciousness persists. Samādhi becomes
  not a state to chase but a continuous recognition woven through all states.


  This teaching dissolves the false binary between ''in meditation'' and ''out of meditation.'' It points
  to the freedom (svātantrya) of Consciousness to know itself equally in absorption and in activity, provided
  the practitioner sustains the deliberate re-touching of that unity.


  Key Terms


  **samādhi-saṁskāra** — The imprint or trace left by absorption; the residual capacity to recognize unity
  even after formal meditation ends

  **cit-aikya-āmarśa** — The deliberate, intimate touching or re-cognition of the singular, non-dual nature
  of Consciousness

  **nitya-udita-samādhi** — Samādhi that perpetually arises; a stability of recognition that does not
  depend on formal practice but persists through all states'
insight: 'Extended Translation:

  In the state following Samādhi, which is full of its impressions, through repeated reflection on one''s
  identity with Consciousness, there is acquisition of the ever-risen Samādhi.'
practice: The moment you notice yourself re-entering thought or activity after any pause—whether from
  formal meditation or a simple breath—pause and whisper 'cit-aikya' (the unity of Consciousness), then
  feel backward into the awareness that was just present, as if touching the same undivided light that
  held you in stillness. Let this touching happen in the body, not the mind, and return to what you were
  doing without breaking the thread.
