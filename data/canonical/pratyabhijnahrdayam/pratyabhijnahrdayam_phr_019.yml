- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    In the state following Samādhi, which is full of its impressions, through repeated reflection on one''s identity with
    Consciousness, there is acquisition of the ever-risen Samādhi.


    This sūtra addresses the practitioner''s most common struggle: the loss of recognition after a genuine glimpse. *Vyutthāna*
    — the post-samādhi state — is ordinary waking consciousness that carries the impressions (*saṁskāra*) of the deep recognition.
    In this in-between condition, the practitioner is neither fully in the contracted ordinary state nor fully established
    in recognition. The prescription is not to force a return to samādhi but to repeatedly (*bhūyaḥ bhūyaḥ*) reflect on identity
    with Consciousness — *āmarśa*, the act of touching or brushing against the recognition, again and again. The goal is *nityodita*
    — the ever-risen, permanently dawned Samādhi. Not a continuous trance state but a continuous *background recognition*
    that persists through ordinary activity. This is the *jīvanmukti* of Sūtra 16 described from the practitioner''s path.'
