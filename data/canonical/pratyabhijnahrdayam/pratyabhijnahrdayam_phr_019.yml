- kind: key_terms
  label: Key Terms
  items:
  - term: samādhi
    definition: meditative absorption, the state of full recognition; here not just concentration but the recognition of Sūtra
      13
  - term: saṁskāra
    definition: impressions, traces, residual effects; the marks left by samādhi in the post-absorption state
  - term: vyutthāna
    definition: the rising or coming-up state; post-samādhi ordinary consciousness, the between state
  - term: āmarśa
    definition: touching, brushing, gentle reflection; not forceful concentration but repeated gentle recognition
  - term: nityodita
    definition: ever-risen, permanently dawned; the sun that has fully risen and does not set again
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Spanda Kārikā III.13
    resonance: the practitioner who repeatedly recognizes the Spanda eventually establishes in it permanently.
    divergence: ''
    passage_id: ''
  - citation: Zen's *kenshō* and subsequent practice
    resonance: the initial recognition (*kenshō*) is not the end; the *samādhi-saṁskāra* work of Sūtra 19 is exactly what
      the Zen tradition calls "polishing the mirror" after the first seeing.
    divergence: ''
    passage_id: ''
  - citation: St. John of the Cross on *recollection* (recogimiento)
    resonance: the repeated gentle turning of awareness toward God between full contemplative states — a Christian parallel.
    divergence: ''
    passage_id: ''
