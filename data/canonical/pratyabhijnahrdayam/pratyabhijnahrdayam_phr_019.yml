- kind: practice
  label: Practice (Abhyasa)
  body: After any meditation — or any moment of genuine clarity, however brief — do not immediately re-engage with tasks.
    Sit for two to five minutes and let the recognition *settle*. Then, during the day, when you notice you have drifted,
    simply touch the recognition again — once, briefly, without drama. *Bhūyaḥ bhūyaḥ* — again and again. This is the actual
    practice of *nityodita-samādhi*.
