unit_id: pratyabhijnahrdayam.phr_019
unit_label: Sutra 19
title: Recognition Sustained Through Repeated Self-Reflection
unit_type: sutra
sanskrit_devanagari: समाधिसंस्कारवति व्युत्थाने भूयो भूयश्चिदैक्यामर्शान्नित्योदितसमाधिलाभः
sanskrit_iast: samādhi-saṁskāravati vyutthāne bhūyas bhūyaḥ cit-aikya-āmarśāt nitya-udita-samādhi-lābhaḥ
translation_literal: In the state following Samādhi, which is full of its impressions, through repeated reflection on one's
  identity with Consciousness, there is acquisition of the ever-ri...
commentary: 'Extended Translation:

  In the state following Samādhi, which is full of its impressions, through repeated reflection on one''s identity with Consciousness,
  there is acquisition of the ever-risen Samādhi.


  This sūtra addresses the practitioner''s most common struggle: the loss of recognition after a genuine glimpse. *Vyutthāna*
  — the post-samādhi state — is ordinary waking consciousness that carries the impressions (*saṁskāra*) of the deep recognition.
  In this in-between condition, the practitioner is neither fully in the contracted ordinary state nor fully established in
  recognition. The prescription is not to force a return to samādhi but to repeatedly (*bhūyaḥ bhūyaḥ*) reflect on identity
  with Consciousness — *āmarśa*, the act of touching or brushing against the recognition, again and again. The goal is *nityodita*
  — the ever-risen, permanently dawned Samādhi. Not a continuous trance state but a continuous *background recognition* that
  persists through ordinary activity. This is the *jīvanmukti* of Sūtra 16 described from the practitioner''s path.'
insight: 'Extended Translation:

  In the state following Samādhi, which is full of its impressions, through repeated reflection on one''s identity with Consciousness,
  there is acquisition of the ever-risen Samādhi.'
practice: After any meditation — or any moment of genuine clarity, however brief — do not immediately re-engage with tasks.
  Sit for two to five minutes and let the recognition *settle*. Then, during the day, when you notice you have drifted, simply
  touch the recognition again — once, briefly, without drama. *Bhūyaḥ bhūyaḥ* — again and again. This is the actual practice
  of *nityodita-samādhi*.
