unit_label: Sutra 10
title: The Bound Soul Enacts Śiva's Five Functions
unit_type: sutra
sanskrit_devanagari: तथापि तद्वत्पञ्चकृत्यानि करोति
sanskrit_iast: tathāpi tadvat pañca-kṛtyāni karoti
translation_literal: Yet even so, the bound soul performs the five functions just as that [Śiva does].
commentary: 'This sūtra presents a pivotal recognition: the jīva (individual soul), though apparently limited by contraction
  (āṇava-mala) and ignorance, is not fundamentally separate from Śiva''s cosmic activity. The phrase ''tathāpi'' (yet even
  so, nevertheless) signals a paradox at the heart of Pratyabhijñā teaching—despite the appearance of bondage, the bound soul
  continuously enacts the same five cosmic functions (pañca-kṛtya) that constitute Śiva''s eternal play: creation (sṛṣṭi),
  maintenance (sthiti), dissolution (saṃhāra), veiling (tirobhāva), and grace (anugraha).


  Kṣemarāja is pointing to a non-dual truth: there is no actual rupture between the divine and the individual. The bound soul''s
  very limitation—its contraction into a finite perspective, its forgetting of its nature—is itself a manifestation of Śiva''s
  śakti (power). The five functions are not performed *by* a separate agent; they are the structure of consciousness itself
  operating at every level. When the individual breathes (prāṇa and apāna), digests, moves, thinks, and experiences emotion,
  these are micro-expressions of the cosmic functions. Creation happens in each moment of perception; dissolution occurs in
  each gap between thoughts; grace operates whenever recognition dawns.


  The sūtra''s force lies in its reversal of the usual hierarchy: it does not say ''Śiva performs the five functions, and
  the bound soul imitates them.'' Rather, it establishes that the bound soul''s activity *is* the same activity, viewed from
  within contraction. This recognition (pratyabhijñā) is the gateway to liberation—not through effort to become divine, but
  through the direct seeing that one''s own functioning is already divine functioning, merely forgotten.


  Key Terms


  **pañca-kṛtya** — The five cosmic functions: creation (sṛṣṭi), maintenance (sthiti), dissolution (saṃhāra), veiling (tirobhāva),
  and grace (anugraha)—the complete cycle of manifestation and recognition.

  **jīva** — The individual soul or bound consciousness, apparently limited by contraction and forgetfulness, yet in essence
  non-different from Śiva.

  **pratyabhijñā** — Recognition or recollection of one''s true nature as universal Consciousness; the sudden, direct knowing
  that ''I am That.'''
insight: The bound soul is not simply a diminished nothing.
practice: Whisper 'tathāpi' (yet even so) each time you notice yourself feeling trapped, limited, or separate—in that whisper,
  let the word dissolve the boundary between the one who feels bound and the cosmic function already moving through that very
  sensation. The contraction itself is Śiva's play; speak the word until you taste it.
