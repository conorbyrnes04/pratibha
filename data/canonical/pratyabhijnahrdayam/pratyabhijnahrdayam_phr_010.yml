- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, observe your own five acts: What are you *manifesting* (projecting into being through attention and thought)?
    What are you *maintaining* (holding steady through habit and will)? What are you *dissolving* (releasing, ending, letting
    go)? What are you *concealing* from yourself? And where is *grace* — the unexpected opening, the moment of clarity that
    arrived without effort?'
