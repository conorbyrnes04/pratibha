sanskrit_devanagari: तथापि तद्वत्पञ्चकृत्यानि करोति
sanskrit_iast: tathāpi tadvat pañca-kṛtyāni karoti
translation_literal: Even in that limited condition, the individual soul performs the five functions — as that Supreme Self
  does.
commentary: 'The bound soul is not simply a diminished nothing. Even in its contraction, it performs — at a smaller scale,
  often without recognition — the same five functions that Śiva performs cosmically: *sṛṣṭi* (manifesting, projecting its
  world), *sthiti* (maintaining its sense of reality), *saṁhāra* (withdrawing, sleeping, ending), *vilaya* (concealing its
  own nature from itself), and *anugraha* (grace, the occasional opening when recognition breaks through). Every person is,
  unknowingly, doing exactly what God does. The difference is not ontological — it is one of scale and awareness. This sūtra
  is the hinge of the text''s soteriology: you are already doing it. You just do not know that you are.


  Cross-Tradition Resonance:

  - Śiva Sūtra III.9: *nartaka ātmā* — the Self as dancer; the individual as performer of the same cosmic dance at a personal
  scale.

  - Dào Dé Jīng ch. 25: the great orders (Tao, heaven, earth, humanity) mirror each other; the human participates in the same
  pattern as the whole.

  - Hermetic principle of correspondence: "As above, so below" — not as occult formula but as ontological claim about the
  fractal nature of the real.'
insight: The bound soul is not simply a diminished nothing.
practice: 'Today, observe your own five acts: What are you *manifesting* (projecting into being through attention and thought)?
  What are you *maintaining* (holding steady through habit and will)? What are you *dissolving* (releasing, ending, letting
  go)? What are you *concealing* from yourself? And where is *grace* — the unexpected opening, the moment of clarity that
  arrived without effort?'
