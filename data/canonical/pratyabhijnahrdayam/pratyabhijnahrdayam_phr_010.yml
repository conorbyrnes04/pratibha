- kind: translation
  label: Pratibha Translation
  body: Even in that limited condition, the individual soul performs the five functions — as that Supreme Self does.
- kind: commentary
  label: Pratibha Commentary
  body: 'The bound soul is not simply a diminished nothing. Even in its contraction, it performs — at a smaller scale, often
    without recognition — the same five functions that Śiva performs cosmically: *sṛṣṭi* (manifesting, projecting its world),
    *sthiti* (maintaining its sense of reality), *saṁhāra* (withdrawing, sleeping, ending), *vilaya* (concealing its own nature
    from itself), and *anugraha* (grace, the occasional opening when recognition breaks through). Every person is, unknowingly,
    doing exactly what God does. The difference is not ontological — it is one of scale and awareness. This sūtra is the hinge
    of the text''s soteriology: you are already doing it. You just do not know that you are.'
- kind: key_terms
  label: Key Terms
  items:
  - term: pañcakṛtya
    definition: the fivefold act; the five cosmic functions performed at both universal and individual scales
  - term: sṛṣṭi
    definition: manifestation, projection, creation
  - term: sthiti
    definition: maintenance, sustaining
  - term: saṁhāra
    definition: dissolution, reabsorption
  - term: vilaya
    definition: concealment, obscuration of one's own nature
  - term: anugraha
    definition: grace, the bestowal of recognition
