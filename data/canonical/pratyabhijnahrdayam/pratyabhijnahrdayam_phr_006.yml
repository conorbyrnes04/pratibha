unit_id: pratyabhijnahrdayam.phr_006
unit_label: Sutra 6
title: The Self Contracted Into Mental Content
unit_type: sutra
sanskrit_devanagari: तन्मयो मायाप्रमाता
sanskrit_iast: tanmayaḥ māyā-pramātā
translation_literal: The subject bound by māyā becomes absorbed into that—contracted into the form of mental content.
commentary: 'This sūtra identifies the mechanism of contraction (saṅkoca) that defines ordinary consciousness. The pramātā—the
  knowing subject—ordinarily experiences itself as a limited perceiver because it has become *tanmaya*, absorbed into and
  identified with the objects of māyā (the force of differentiation and limitation). Rather than resting in its own nature
  as universal Consciousness (Cit), the subject takes on the shape and texture of whatever mental content arises: thoughts,
  sensations, emotions, narratives of self. This is not a metaphorical absorption but a real narrowing of awareness, a forgetting
  of one''s own freedom (svātantrya). The subject becomes *like* its contents—contracted, bounded, particular. Kṣemarāja is
  diagnosing the root of bondage: not that mental content exists (it always does), but that awareness has forgotten itself
  and now identifies exclusively with the limited form of each passing state. Recognition (pratyabhijñā) begins precisely
  here—by noticing this contraction and remembering that the aware subject is not the content it observes, but the infinite
  consciousness in which all content appears. The sūtra thus names both the problem (māyā-contraction) and points toward its
  resolution (the subject''s inherent freedom to dis-identify).


  Key Terms


  **tanmaya** — absorbed into, merged with, taking on the form of; here, the subject''s loss of itself in identification with
  limited mental content

  **māyā** — the cosmic force of differentiation and limitation that creates the appearance of multiplicity and bondage; not
  illusion but the power that contracts infinite consciousness into finite forms

  **pramātā** — the subject, the knower; ordinarily experienced as a limited individual consciousness, but ultimately recognized
  as universal Consciousness itself'
insight: '*Māyāpramātā* — the experient at the level of Māyā — is the ordinary human self: not evil, not fallen in any moral
  sense, but structurally contracted, structurally identified with mental content.'
practice: 'For fifteen minutes, sit quietly and observe your thoughts without judgment. As each thought, feeling, or image
  arises, notice the impulse to become *it*—to absorb into its narrative, its emotional tone, its sense of reality. Pause.
  Ask: *Who is aware of this thought?* That aware presence is not the thought itself. It does not contract; it remains open.
  Gently return to this open awareness, the space in which all mental content appears but which is never *of* any single content.
  Do this each time you notice you have drifted into identification with a mental state. Over weeks, this simple discrimination
  weakens the automatic contraction and begins to restore your recognition of consciousness as the free, unchanging witness
  of all that arises.'
