pratibha_layers:
- kind: original
  label: Original
  body: तन्मयो मायाप्रमाता
- kind: iast
  label: IAST
  body: tanmayaḥ māyā-pramātā
- kind: translation
  label: Pratibha Translation
  body: The limited experient ruled by Māyā consists of that — of contracted mind.
- kind: commentary
  label: Pratibha Commentary
  body: '*Māyāpramātā* — the experient at the level of Māyā — is the ordinary human self: not evil, not fallen in any moral
    sense, but structurally contracted, structurally identified with mental content. *Tanmayaḥ* — "consisting of that" — names
    the identification precisely: the ordinary self is not merely *in* the mind, it *is* the mind, in the sense of being wholly
    absorbed in its contractions. Kṣemarāja notes that this experient rests at the level of Māyā, which he calls "the profound
    void of ignorance" — not a void in the Buddhist sense but the void of not recognizing one''s own nature. This is *avidyā*
    not as intellectual error but as structural forgetting.'
- kind: key_terms
  label: Key Terms
  items:
  - term: māyā
    definition: the power of differentiation and concealment; here not illusion in a dismissive sense but the structural principle
      of limitation
    lemma_id: maya
  - term: pramātā
    definition: the experient, the one who knows; the subject of experience
  - term: māyāpramātā
    definition: the limited individual experient, the ordinary self conditioned by Māyā
  - term: tanmaya
    definition: consisting of that, made of that; wholly absorbed in or identified with
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Spanda Kārikā I.2
    resonance: the *pramātā* who does not recognize the Spanda principle, the throb of Consciousness beneath all activity.
    divergence: ''
    passage_id: ''
  - citation: Epictetus
    resonance: the one who mistakes externals (*ta ektos*) for what is "up to us" — structural misidentification, not moral
      failure.
    divergence: ''
    passage_id: ''
  - citation: Dào Dé Jīng ch. 16
    resonance: '"Returning to the root is called stillness. Not knowing this constancy is the source of confusion."'
    divergence: ''
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, notice the moment of identification — when "I" becomes wholly absorbed in a thought, an emotion, a role. Not
    to reject it, but to note: *something is noticing this identification*. That noticing is not itself identified. Rest there
    briefly, then continue.'
