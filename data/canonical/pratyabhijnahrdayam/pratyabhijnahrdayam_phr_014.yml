unit_id: pratyabhijnahrdayam.phr_014
unit_label: Sutra 14
title: Consciousness Burns Even When Concealed
unit_type: sutra
sanskrit_devanagari: चितिवह्निरवरोहपदे छन्नोऽपि मात्रया मेयेन्धनं प्लुष्यति
sanskrit_iast: citi-vahniḥ avaroha-pade channaḥ api mātrayā meya-indhanam pluṣyati
translation_literal: The Fire of Consciousness, though covered in the inferior stage, partially consumes the fuel of the knowables.
commentary: 'Even in its most contracted, most concealed state — even in the depths of *māyāpramātā* bewilderment — Consciousness
  never fully stops burning. *Citivahni* — the Fire of Consciousness — is always and already consuming the objects of experience,
  illuminating them, making them knowable. The word *mātrayā* — "partially" — names the honest condition of the ordinary person:
  not fully awake, not fully extinguished. The fire smolders beneath the ash. Every act of knowing, even the most contracted,
  is Citi at work. This is why practice works: you are not building a fire from scratch. You are uncovering and feeding one
  that never went out.'
insight: Even in its most contracted, most concealed state — even in the depths of *māyāpramātā* bewilderment — Consciousness
  never fully stops burning.
practice: In your next conversation, notice the simple fact that you *understand* what is being said. Not the content — the
  bare fact of comprehension arising. That arising is *citivahni* at work. The fire is already burning. Can you feel the warmth
  of knowing itself, prior to what is known?
