title: Consciousness Burns Even When Concealed
unit_type: sutra
sanskrit_devanagari: चितिवह्निरवरोहपदे छन्नोऽपि मात्रया मेयेन्धनं प्लुष्यति
sanskrit_iast: citi-vahniḥ avaroha-pade channaḥ api mātrayā meya-indhanam pluṣyati
translation_literal: The fire of Consciousness, even when concealed at the level of descent into manifestation, still consumes
  the fuel of objectivity—however subtly.
commentary: 'This sūtra presents a cardinal principle of Pratyabhijñā recognition: Consciousness (citi) never truly ceases
  to be active, even when it appears hidden or diminished. The image of fire burning beneath ash is precise. Avaroha-pade—''at
  the level of descent''—refers to the progressive contraction of universal Consciousness into individual, limited forms.
  This descent is real as a play of manifestation (līlā), yet the underlying luminosity of Cit persists.


  The phrase ''channaḥ api'' (concealed even so) is crucial. Concealment here is not annihilation but veiling—prakāśa (light)
  covered by layers of māyā''s contraction. The fire still burns; it still ''consumes'' (pluṣyati) meya-indhanam, the fuel
  of objectivity—all that appears as object, limitation, or otherness. This consumption is not destruction but recognition:
  every object, every apparent boundary, is fuel for the fire of Consciousness to recognize itself as the sole subject.


  Mātrayā (however subtly, by measure) signals that even in the deepest contraction—in the human individual, in sleep, in
  apparent forgetfulness—the burning continues. Recognition (pratyabhijñā) is thus not about igniting a dead fire but about
  noticing that the fire has never gone out. The practice is to recognize this perpetual burning within one''s own awareness,
  even now.


  Key Terms


  **citi-vahni** — The fire of Consciousness; the luminous, self-aware principle that illuminates and consumes all objectivity

  **avaroha** — Descent; the apparent contraction of universal Consciousness into individual, limited forms through the play
  of māyā

  **meya** — The knowable, the objective; that which appears as other than the subject of awareness'
insight: Even in its most contracted, most concealed state — even in the depths of *māyāpramātā* bewilderment — Consciousness
  never fully stops burning.
practice: Throughout your day, whenever you encounter a limitation—a closed door, a person's refusal, your own fatigue, a
  rule that confines you—pause and feel into it as fuel rather than obstacle. Let the resistance itself become the material
  that Consciousness burns through; don't resist the resistance, but recognize in that very friction the fire consuming what
  appears separate from you.
