pratibha_layers:
- kind: original
  label: Original
  body: चितिवह्निरवरोहपदे छन्नोऽपि मात्रया मेयेन्धनं प्लुष्यति
- kind: iast
  label: IAST
  body: citi-vahniḥ avaroha-pade channaḥ api mātrayā meya-indhanam pluṣyati
- kind: translation
  label: Pratibha Translation
  body: The Fire of Consciousness, though covered in the inferior stage, partially consumes the fuel of the knowables.
- kind: commentary
  label: Pratibha Commentary
  body: 'Even in its most contracted, most concealed state — even in the depths of *māyāpramātā* bewilderment — Consciousness
    never fully stops burning. *Citivahni* — the Fire of Consciousness — is always and already consuming the objects of experience,
    illuminating them, making them knowable. The word *mātrayā* — "partially" — names the honest condition of the ordinary
    person: not fully awake, not fully extinguished. The fire smolders beneath the ash. Every act of knowing, even the most
    contracted, is Citi at work. This is why practice works: you are not building a fire from scratch. You are uncovering
    and feeding one that never went out.'
- kind: key_terms
  label: Key Terms
  items:
  - term: citivahni
    definition: the Fire of Consciousness; *vahni* means fire; the image of awareness as a consuming, illuminating flame
  - term: avaroha
    definition: descent, the inferior stage; the contracted condition
  - term: channa
    definition: covered, concealed, obscured; the fire beneath ash
  - term: meya-indhana
    definition: the fuel of the knowables; objects of experience as what the fire of consciousness consumes/illuminates
  - term: pluṣyati
    definition: burns, consumes partially; the partial illumination of the contracted state
- kind: resonances
