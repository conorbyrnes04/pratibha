sanskrit_devanagari: तदा प्रकाशानन्दसारमहामन्त्रवीर्यात्मकपूर्णाहन्तावेशात्सदा सर्वसर्गसंहारकारिनिजसंविद्देवताचक्रेश्वरताप्राप्तिर्भवतीति
  शिवम्
sanskrit_iast: tadā prakāśa-ānanda-sāra-mahāmantra-vīrya-ātmaka-pūrṇāhantā-āveśāt sadā sarva-sarga-saṁhāra-kāri-nija-saṁvid-devatā-cakra-īśvaratā-prāptiḥ
