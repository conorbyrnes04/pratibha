title: Perfect I-Consciousness Grants Sovereignty Over All Manifestation
unit_type: sutra
sanskrit_devanagari: तदा प्रकाशानन्दसारमहामन्त्रवीर्यात्मकपूर्णाहन्तावेशात्सदा सर्वसर्गसंहारकारिनिजसंविद्देवताचक्रेश्वरताप्राप्तिर्भवतीति
  शिवम्
sanskrit_iast: tadā prakāśa-ānanda-sāra-mahāmantra-vīrya-ātmaka-pūrṇāhantā-āveśāt sadā sarva-sarga-saṁhāra-kāri-nija-saṁvid-devatā-cakra-īśvaratā-prāptiḥ
  bhavati iti śivam
translation_literal: Then, through the infusion of perfect I-consciousness—whose nature is the supreme mantra embodying the
  power of luminosity and bliss—there arises the constant sovereignty over the entire cycle of manifestation and dissolution,
  achieved through dominion over one's own circle of conscious powers (saṁvid-devatā-cakra). This is the auspicious truth.
commentary: 'This sūtra describes the culmination of recognition (pratyabhijñā): the realization that one''s own I-consciousness
  is not a limited ego but the universal power that governs all creation and dissolution. The phrase ''perfect I-consciousness''
  (pūrṇāhantā) points to the undivided, infinite sense of ''I'' that Abhinavagupta identifies with Śiva''s absolute freedom
  (svātantrya). This is not mere intellectual understanding but an actual infusion or possession (āveśa) of the self by this
  recognition.


  The ''supreme mantra'' (mahāmantra) here refers to the essential vibration or spanda of consciousness itself—the primordial
  hum that underlies all manifestation. Its ''power'' (vīrya) combines luminosity (prakāśa, the capacity to know) and bliss
  (ānanda, the inherent satisfaction of being). These are not separate qualities but the inseparable nature of Consciousness
  recognizing itself.


  Crucially, this sovereignty is not imposed from outside but emerges through ''dominion over one''s own circle of conscious
  powers'' (nija-saṁvid-devatā-cakra-īśvaratā). The ''circle of deities'' (devatā-cakra) represents the full spectrum of one''s
  own conscious capacities—perception, cognition, will, and action—unified as expressions of a single awareness. When these
  are recognized as one''s own manifestation rather than as external forces, absolute freedom becomes actual.


  The phrase ''sadā sarva-sarga-saṁhāra-kāri'' (constant over the entire cycle of manifestation and dissolution) indicates
  that this sovereignty is not momentary but continuous, and it extends over the totality of experience—not just the external
  world but the very processes of creation and destruction happening within consciousness itself. The yogi recognizes that
  what appears as the world''s becoming and unbecoming is the play of their own infinite nature.


  The closing ''iti śivam'' (this is the auspicious truth) affirms that this recognition is not a distant goal but the very
  nature of Śiva—the ultimate reality—which is always already present and fundamentally benevolent.


  Key Terms


  **pūrṇāhantā** — Perfect or complete I-consciousness; the undivided sense of ''I'' as infinite awareness, not the limited
  ego-sense

  **svātantrya** — Absolute freedom or autonomy; the unconditioned power of Consciousness to manifest itself in infinite ways

  **saṁvid-devatā-cakra** — The circle of conscious powers or deities; the totality of one''s own cognitive and creative capacities
  unified as expressions of a single awareness'
insight: 'Extended Translation:

  Then, as a result of entering into the Perfect I-consciousness — which is essentially Light and Bliss, whose nature is the
  great power of Mantra — there is always the acquisition of sovereignty over the circle of the deities of one''s own Consciousness,
  which brings about all manifestations and dissolutions.'
practice: Hum the syllable 'aum' on your next exhale, letting it resonate through your chest and belly until the sound naturally
  fades—then notice the silence that remains, and recognize in that silence the 'I' that both produced and witnesses the sound.
  Repeat this three times, each cycle tightening your sense of the consciousness that governs both vibration and stillness.
