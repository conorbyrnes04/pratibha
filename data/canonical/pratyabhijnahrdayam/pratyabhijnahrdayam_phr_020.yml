- kind: key_terms
  label: Key Terms
  items:
  - term: pūrṇāhantā
    definition: Perfect I-consciousness; *pūrṇa* (full, complete) + *ahantā* (I-ness); the universal self-recognition of Consciousness,
      not the ego's self-assertion
  - term: āveśa
    definition: entering into, immersion, possession; the quality of full absorption in recognition
  - term: mahāmantra
    definition: the great Mantra; here *aham* (I) as the supreme mantra, the sound of Consciousness recognizing itself
  - term: devatācakra
    definition: the circle of deities; the *śaktis* or cognitive-creative powers of one's own Consciousness
  - term: īśvaratā
    definition: sovereignty, lordship; mastery over the powers of one's own Consciousness through recognition
  - term: iti śivam
    definition: '"thus, Śiva"; the seal of the text: all is of the nature of Śiva; the final recognition'
