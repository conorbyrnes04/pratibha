- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    Then, as a result of entering into the Perfect I-consciousness — which is essentially Light and Bliss, whose nature is
    the great power of Mantra — there is always the acquisition of sovereignty over the circle of the deities of one''s own
    Consciousness, which brings about all manifestations and dissolutions. Thus, all is of the nature of Śiva.


    The final sūtra gathers everything into a culminating vision. *Pūrṇāhantā* — the Perfect I-consciousness — is the supreme
    *vimarśa*: the full self-recognition of Consciousness that says "I am" not as an individual ego-claim but as the universe''s
    self-declaration. *Āveśa* — entering into, possession, immersion — names the quality of the liberated condition: not detachment
    from but full immersion in the recognition of what one always was. *Devatācakra* — the circle of deities of one''s own
    Consciousness — refers to the entire field of cognitive and creative powers (*śaktis*) that constitute experience. The
    liberated one does not lord over these powers from outside — they *are* recognized as the movement of one''s own Consciousness.
    The text ends with the two words that seal all of Kashmir Śaivism: *iti śivam* — thus, all is Śiva. Not a theological
    assertion about a deity but a recognition: the entire field of experience, from its ground to its most contracted appearance,
    is the self-expression of one Consciousness.'
- kind: key_terms
  label: Key Terms
  items:
  - term: pūrṇāhantā
    definition: Perfect I-consciousness; *pūrṇa* (full, complete) + *ahantā* (I-ness); the universal self-recognition of Consciousness,
      not the ego's self-assertion
  - term: āveśa
    definition: entering into, immersion, possession; the quality of full absorption in recognition
  - term: mahāmantra
    definition: the great Mantra; here *aham* (I) as the supreme mantra, the sound of Consciousness recognizing itself
  - term: devatācakra
    definition: the circle of deities; the *śaktis* or cognitive-creative powers of one's own Consciousness
  - term: īśvaratā
    definition: sovereignty, lordship; mastery over the powers of one's own Consciousness through recognition
  - term: iti śivam
    definition: '"thus, Śiva"; the seal of the text: all is of the nature of Śiva; the final recognition'
