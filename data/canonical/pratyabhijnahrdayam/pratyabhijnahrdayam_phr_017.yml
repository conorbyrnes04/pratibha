- kind: practice
  label: Practice (Abhyasa)
  body: 'At the end of the exhalation — before the inhalation begins — there is a natural pause. Rest in that pause without
    forcing it to extend. Notice: in that moment between breaths, there is awareness. Not awareness *of* anything in particular
    — just the bare fact of awareness. This is *madhya*. Sūtra 17''s promise is that this gap, when attended to, opens into
    *cidānanda*.'
