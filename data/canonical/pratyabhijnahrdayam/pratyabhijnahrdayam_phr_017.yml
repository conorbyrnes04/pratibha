- kind: translation
  label: Pratibha Translation
  body: Through the unfoldment of the middle, there is acquisition of the Bliss of Consciousness.
- kind: commentary
  label: Pratibha Commentary
  body: '*Madhya* — the middle — is one of the most generative terms in the entire Kashmir Śaiva tradition. It refers simultaneously
    to: the middle breath (the *madhyamā prāṇa*, the subtle energy between exhalation and inhalation); the central channel
    (*suṣumnā*); the middle between two thoughts; the *vimarśa* (self-recognition) at the heart of every moment of awareness.
    *Vikāsa* — unfoldment, blossoming — is its own image: not forced opening but the natural expansion of what was already
    there. The acquisition of *cidānanda* (Sūtra 16) occurs through this unfoldment, which Sūtra 18 will elaborate with specific
    practices. The *madhya* is always accessible because it is not located at a particular place or time — it is the gap,
    the opening, the interval that is present in every moment.'
- kind: key_terms
  label: Key Terms
  items:
  - term: madhya
    definition: 'the middle; simultaneously: the central channel, the middle breath, the gap between thoughts, the *vimarśa*
      within experience'
  - term: vikāsa
    definition: unfoldment, development, blossoming; natural expansion rather than forced achievement
  - term: cidānanda
    definition: the Bliss of Consciousness (see Sūtra 16)
    lemma_id: cidananda
    sense_id: cidananda.shaiva
  - term: lābha
    definition: obtaining, acquisition; genuine attainment
