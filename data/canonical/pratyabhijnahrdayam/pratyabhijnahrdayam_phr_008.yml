pratibha_layers:
- kind: original
  label: Original
  body: तद्भूमिकाः सर्वदर्शनस्थितयः
- kind: iast
  label: IAST
  body: tad-bhūmikāḥ sarva-darśana-sthitayaḥ
- kind: translation
  label: Pratibha Translation
  body: The positions of all philosophical systems are only roles played by that — by Consciousness.
- kind: commentary
  label: Pratibha Commentary
  body: A stunning ecumenical move. Every philosophical system — materialism, dualism, qualified non-dualism, strict non-dualism,
    theism, atheism — is understood not as a competing claim about ultimate reality but as a *bhūmikā*, a stage or role, within
    the self-expression of Consciousness. The Sāṁkhya, the Nyāya, the Buddhist, the Vedāntin — each has grasped a genuine
    aspect of reality at a particular level of contraction. None is simply wrong; each is right from within its aperture.
    This is not relativism — the text is clear that recognition (*pratyabhijñā*) of the full ground is the highest understanding.
    But the fullness includes rather than rejects all partial views.
- kind: key_terms
  label: Key Terms
  items:
  - term: bhūmikā
    definition: role, stage, level; the ground or floor on which something stands; also a theatrical role
  - term: darśana
    definition: philosophical system, worldview; literally "seeing" or "vision"
  - term: sthiti
    definition: position, final conclusion; what a system ultimately asserts
  - term: tad
    definition: that; here referring to the Supreme Consciousness of Sūtra 1
