  items:
  - term: citi
    definition: universal Consciousness, the absolute power of awareness; distinguished from *cetanā*
      (individual knowing)
    lemma_id: cit
  - term: svatantrā
    definition: absolutely free, self-determining, sovereign; from *sva* (own) + *tantra* (loom, system)
      — that which operates entirely on its own terms
  - term: viśva
    definition: the universe, all that appears
  - term: siddhi
    definition: 'here: the triple process of manifestation (*sṛṣṭi*), maintenance (*sthiti*), and dissolution
      (*saṁhāra*); not "supernormal power"'
    lemma_id: siddhi
    sense_id: siddhi.shaiva
  - term: hetu
    definition: cause, ground, reason
