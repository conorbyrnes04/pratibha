- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit. Notice that you are aware. Now ask: what is aware of that awareness? Follow the thread back past sensation,
    past thought, past the sense of being a particular person — to the simple fact of knowing itself. This is *citi* pointing
    at itself through you.'
