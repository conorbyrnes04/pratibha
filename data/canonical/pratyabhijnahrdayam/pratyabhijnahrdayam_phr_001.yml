pratibha_layers:
- kind: original
  label: Original
  body: चितिः स्वतन्त्रा विश्वसिद्धिहेतुः
- kind: iast
  label: IAST
  body: citiḥ svatantrā viśva-siddhi-hetuḥ
- kind: translation
  label: Pratibha Translation
  body: The sovereign Śakti — absolute Consciousness — is the cause of the manifestation, maintenance, and dissolution of
    the universe.
- kind: commentary
  label: Pratibha Commentary
  body: 'The text opens not with an argument but with a declaration: Consciousness is the ground. Not one thing among others,
    not a property of matter, not an emergent phenomenon — but the very substrate in which a universe arises, persists, and
    dissolves. *Citi* is distinguished from *cetanā* (individual awareness) — this is not your consciousness or mine. It is
    the field within which both you and I appear. *Svatantrā* — absolute freedom, sovereign independence — names its essential
    nature: it is not conditioned by anything outside itself, because there is nothing outside itself.'
- kind: key_terms
  label: Key Terms
  items:
  - term: citi
    definition: universal Consciousness, the absolute power of awareness; distinguished from *cetanā* (individual knowing)
  - term: svatantrā
    definition: absolutely free, self-determining, sovereign; from *sva* (own) + *tantra* (loom, system) — that which operates
      entirely on its own terms
  - term: viśva
    definition: the universe, all that appears
  - term: siddhi
    definition: 'here: the triple process of manifestation (*sṛṣṭi*), maintenance (*sthiti*), and dissolution (*saṁhāra*);
      not "supernormal power"'
  - term: hetu
    definition: cause, ground, reason
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Śiva Sūtra I.1
    resonance: '*caitanyam ātmā* — Consciousness is the Self. The two texts open in unison.'
    divergence: ''
    passage_id: ''
  - citation: Dào Dé Jīng ch. 1
    resonance: the Tao that can be named is not the eternal Tao — both resist reduction to a named object while insisting
      on primacy.
    divergence: ''
    passage_id: ''
  - citation: Plotinus, *Enneads* V.1
    resonance: the One as the self-sufficient source from which Intellect and Soul emanate. The structure differs; the intuition
      of a self-originating ground is the same.
    divergence: ''
