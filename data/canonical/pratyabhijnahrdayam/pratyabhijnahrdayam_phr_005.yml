unit_label: Sutra 5
title: Consciousness Contracts Into Objectifying Mind
unit_type: sutra
sanskrit_devanagari: चितिरेव चेतनपदावरूढा चेत्यसङ्कोचिनी चित्तम्
sanskrit_iast: citiḥ eva cetana-padāt avarūḍhā cetya-saṅkocinī cittam
translation_literal: Consciousness itself, descending from the state of pure awareness, becomes the objectifying mind—contracted
  into the form of that which grasps objects.
commentary: 'This sūtra articulates the central paradox of Kashmir Śaiva recognition: how the infinite, self-luminous Consciousness
  (cit) appears to become finite, object-bound mind (citta). The word avarūḍhā (''descends'') is crucial—it signals not a
  metaphysical fall or corruption, but a voluntary contraction, a self-imposed limitation that remains entirely within Consciousness''s
  own freedom (svātantrya). Kṣemarāja is not describing two substances or a dualism; rather, he shows how the singular, undivided
  Cit assumes the character of a knower bound to objects through its own creative power (śakti). The term cetya-saṅkocinī
  (''contracted into objectivity'') reveals the mechanism: Consciousness narrows itself, focusing its infinite potential into
  the finite lens of the individual mind. Yet this contraction is never absolute—it is a play, a self-imposed game within
  the infinite. The recognition (pratyabhijñā) that follows depends on seeing through this apparent descent: the objectifying
  mind is not separate from Consciousness, but Consciousness itself wearing the mask of limitation. This passage lays the
  ground for understanding why liberation is not escape from the mind, but the mind''s sudden recognition of its own true
  nature as the infinite Cit that never actually left itself.


  Key Terms


  **cit (Consciousness)** — The infinite, self-luminous, non-dual awareness that is the ground of all experience; in Pratyabhijñā,
  the ultimate reality recognizing itself

  **citta (objectifying mind)** — The individual mind contracted into the form of a subject grasping objects; a limited modulation
  of Consciousness itself

  **svātantrya (freedom)** — The absolute autonomy and creative power of Consciousness to manifest as both infinite potential
  and finite appearance without losing its essential unity'
insight: Mind is not something other than Consciousness — it is Consciousness at its most contracted, most object-oriented,
  most turned-outward.
practice: The next time you reach for your phone, a cup, or another person's attention, pause at the moment your hand moves
  and feel the contraction happening—the infinite possibility of this moment narrowing into one specific aim. Breathe into
  that sensation of tightening without releasing it, recognizing it as Consciousness itself choosing to become the grasper,
  and then complete the reach as an act of that same freedom, not compulsion.
