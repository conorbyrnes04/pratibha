sanskrit_devanagari: चितिरेव चेतनपदावरूढा चेत्यसङ्कोचिनी चित्तम्
sanskrit_iast: citiḥ eva cetana-padāt avarūḍhā cetya-saṅkocinī cittam
translation_literal: It is Consciousness alone that, descending from the stage of pure Consciousness, contracts itself as
  the object, and becomes the mind.
commentary: 'Mind is not something other than Consciousness — it is Consciousness at its most contracted, most object-oriented,
  most turned-outward. *Avarūḍhā* — descending — names the movement of Citi away from its own nature toward objectification.
  *Cetya-saṅkocinī* — "contracting as the object" — means the mind is not merely *aware* of objects; it *becomes* them in
  a sense, taking their form. This is why the mind is so dense, so sticky, so identified with its contents: it is Consciousness
  wearing the costume of objects so thoroughly it has forgotten it is the costume-wearer. Sūtra 13 will reverse this: when
  the mind turns inward (*antarmukhī*), it becomes Citi again.


  Cross-Tradition Resonance:

  - Vijñāna Bhairava Tantra: the practice of reversing the outward flow (*bahirmukha*) to *antarmukha* (inward-facing) — the
  exact reversal of the movement described here.

  - Yoga Sūtras I.2: *yogaḥ citta-vṛtti-nirodhaḥ* — yoga as the cessation of the modifications of mind. Different framework,
  same terrain.

  - Eckhart: the soul''s *Abkehr* (turning away) from creatures back toward the ground; the same inward reversal.'
insight: Mind is not something other than Consciousness — it is Consciousness at its most contracted, most object-oriented,
  most turned-outward.
practice: Notice the pull of the next thought. Before it fully forms, is there a brief open space? That space is Citi before
  it descends into content. You cannot catch it by pursuing it — only by relaxing the contraction slightly, repeatedly, until
  the open ground becomes more familiar than the objects arising in it.
