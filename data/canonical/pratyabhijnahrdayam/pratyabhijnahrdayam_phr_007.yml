pratibha_layers:
- kind: original
  label: Original
  body: स चैको द्विरूपस्त्रिमयश्चतुरात्मा सप्तपञ्चकस्वभावः
- kind: iast
  label: IAST
  body: saḥ ca ekaḥ dvirūpaḥ trimayaḥ catur-ātmā sapta-pañcaka-svabhāvaḥ
- kind: translation
  label: Pratibha Translation
  body: And though He — the Supreme Self — is One, He becomes double, triple, fourfold, and of the nature of seven groups
    of five.
- kind: commentary
  label: Pratibha Commentary
  body: 'This sūtra is a condensed cosmological map. The One does not remain undifferentiated — it expresses itself in structures:
    dual (*Śiva-Śakti*), triple (*icchā-jñāna-kriyā*, the three powers of will, knowledge, and action), fourfold (the four
    *pramātā* levels of experiencer), and then the vast 35-tattva structure of the Kashmir Śaiva cosmos (seven groups of five:
    five voids, five Śaktis, five elements, etc.). This is not a claim that these structures are ultimately real — they are
    the clothing of the One. But neither are they dismissed. The tradition honors the full texture of manifestation as genuine
    expression of the sovereign freedom explored in Sūtra 1. The map is here for those who need it; it is not the territory.'
- kind: key_terms
  label: Key Terms
  items:
  - term: dvirūpa
    definition: having two forms; *Śiva* and *Śakti* as the primal polarity
  - term: trimaya
    definition: 'triple; the three Śaktis: *icchā* (will), *jñāna* (knowledge), *kriyā* (action)'
  - term: caturātmā
    definition: 'fourfold; the four levels of experiencer: *śāmbhava*, *śākta*, *āṇava*, *māyīya*'
  - term: saptapañcaka
    definition: seven groups of five; the 35 tattvas of the Kashmir Śaiva cosmological schema
- kind: resonances
  label: Cross-Tradition Resonances
  items:
