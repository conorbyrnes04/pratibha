- kind: practice
  label: Practice (Abhyasa)
  body: 'Take any experience right now and trace it through three registers: the *wanting* of it (*icchā*), the *knowing*
    of it (*jñāna*), and the *doing* around it (*kriyā*). Notice these are not three separate events but three faces of one
    moment. Then notice what contains all three. That is the *ekaḥ* — the One behind the triad.'
