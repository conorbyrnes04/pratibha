unit_label: Sutra 7
title: The One Expresses Itself Through Infinite Structure
unit_type: sutra
sanskrit_devanagari: स चैको द्विरूपस्त्रिमयश्चतुरात्मा सप्तपञ्चकस्वभावः
sanskrit_iast: saḥ ca ekaḥ dvirūpaḥ trimayaḥ catur-ātmā sapta-pañcaka-svabhāvaḥ
translation_literal: That One expresses itself in two forms, threefold in nature, fourfold in essence,
  and possesses the character of seven and five.
commentary: 'This sūtra encodes the fundamental architecture through which non-dual Consciousness (Cit)
  manifests as the entire cosmos while remaining singular and undivided. Kṣemarāja is describing how the
  absolute Subject—''that One'' (saḥ)—does not remain locked in transcendent remoteness but unfolds itself
  through precise structural patterns that are simultaneously one and infinite.


  The ''two forms'' (dvirūpaḥ) refer to the dual aspect of reality: prakāśa (luminosity, the knowing principle)
  and vimarśa (reflective awareness, the power of knowing). These are not separate but complementary faces
  of a single consciousness. The ''threefold nature'' (trimayaḥ) points to the three guṇas or fundamental
  qualities—sattva, rajas, tamas—through which manifestation takes shape. The ''fourfold essence'' (catur-ātmā)
  indicates the four states of consciousness: waking, dream, deep sleep, and turīya (the transcendent
  fourth). The ''seven and five'' (sapta-pañcaka-svabhāvaḥ) reference the seven chakras and five elements,
  or alternatively the five acts of Śiva (creation, maintenance, dissolution, concealment, grace) multiplied
  through seven levels of manifestation.


  The passage teaches that recognition (pratyabhijñā) is not intellectual but structural: you recognize
  yourself as this One precisely by understanding how infinite diversity flows from singular freedom (svātantrya).
  The One does not create *outside* itself; it becomes the very architecture of experience. This is why
  the Pratyabhijñā school insists that liberation is not escape from the world but recognition that the
  world-process itself is the Self''s own self-expression.


  For the practitioner, this means that every level of experience—from the densest physical element to
  the subtlest state of consciousness—is the One recognizing itself. There is nowhere to go, nothing to
  reject, only a shift in perspective from imagining yourself as a limited fragment to knowing yourself
  as the infinite architect of all forms.


  Key Terms


  **svātantrya** — Absolute freedom; the unconstrained power of Consciousness to manifest as infinite
  forms while remaining unified.

  **prakāśa** — Luminosity; the aspect of Consciousness as pure knowing, the light of awareness itself.

  **vimarśa** — Reflective awareness; the power of Consciousness to know itself, the ''I-sense'' or reflexive
  capacity.'
insight: This sūtra is a condensed cosmological map.
practice: When you next perceive something luminous—light on water, a face, a thought arising—pause and
  feel how you are simultaneously the brightness itself and the awareness knowing it. Let neither collapse
  into the other for three full breaths. This is the two forms breathing as one.
