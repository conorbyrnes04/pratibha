sanskrit_devanagari: तदपरिज्ञाने स्वशक्तिभिर्व्यामोहितता संसारित्वम्
sanskrit_iast: tad-aparijñāne sva-śaktibhiḥ vyāmohitatā saṁsāritvam
translation_literal: To be a transmigratory soul means to be bewildered by one's own powers, through complete ignorance of
  one's authorship of the fivefold act.
commentary: 'This is one of the most precise definitions of the human condition in any philosophical literature. *Vyāmohitatā*
  — bewilderment, infatuation — and specifically bewilderment *by one''s own powers*. The very capacities Śiva uses to create
  and sustain a universe (will, knowledge, action, self-concealment, grace) are the same capacities that, when unrecognized
  as one''s own, trap the individual in the sense of being a limited, conditioned being. You are bewildered by your own magic
  show. The ignorance here (*aparijñāna*) is not lack of information — it is the failure to *recognize* what is already fully
  present. This is why the text is called *Pratyabhijñā*: recognition, not acquisition.


  Cross-Tradition Resonance:

  - Śiva Sūtra III.7: *mohajit* — one who has conquered bewilderment, the yogin who recognizes the source of the show.

  - Plato''s Allegory of the Cave (*Republic* VII): the prisoners bewildered by shadows they themselves cast, without knowing
  it.

  - Zhuāngzǐ: the dream of the butterfly — who is dreaming whom? The bewilderment of the dreamer who does not know they are
  the dreamer.'
insight: This is one of the most precise definitions of the human condition in any philosophical literature.
practice: 'Notice one thing that feels like it is happening *to* you — an emotion, a difficulty, a compulsion. Sit with the
  question: what if this is *svaśakti* — your own power, unrecognized? Not as a way of blaming yourself, but as a genuine
  inquiry. Is there a sense in which *you* are the source, not the victim, of this experience? Bewilderment begins to dissolve
  when it is seen as bewilderment.'
