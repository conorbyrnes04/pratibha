unit_id: pratyabhijnahrdayam.phr_012
unit_label: Sutra 12
title: Forgetting Your Own Creative Powers
unit_type: sutra
sanskrit_devanagari: तदपरिज्ञाने स्वशक्तिभिर्व्यामोहितता संसारित्वम्
sanskrit_iast: tad-aparijñāne sva-śaktibhiḥ vyāmohitatā saṁsāritvam
translation_literal: Through failure to recognize that, one becomes bewildered by one's own powers and falls into the condition
  of transmigration.
commentary: 'This sūtra cuts to the heart of bondage in Kṣemarāja''s vision. The ''that'' (tad) refers to the preceding recognition
  that Consciousness (Cit) is the sole reality and that one''s own creative capacity (śakti) is none other than the freedom
  (svātantrya) of the absolute Self. When this recognition fails to take hold—when aparijñāne, non-recognition or forgetting
  occurs—the individual becomes vyāmohita, bewildered or deluded, precisely by the very powers (śakti) that are one''s own
  nature. This is the paradox of bondage: not that one lacks power, but that one mistakes one''s own creative energies for
  something alien, objective, or imposed from outside. The result is saṁsāritvam—the condition of saṁsāra, the cycle of repeated
  birth, death, and suffering. The sūtra teaches that bondage is not a punishment inflicted by an external force but a self-imposed
  forgetting. One becomes trapped not by losing one''s powers but by losing recognition of them as one''s own. This non-recognition
  is the sole cause of the entire apparatus of limited individuality, karmic entanglement, and the sense of being a small,
  separate agent in a world that acts upon one. The implication is radical: liberation is simply the return of recognition
  (pratyabhijñā) to what one always already is.


  Key Terms


  **aparijñāne** — non-recognition, failure to know; the forgetting of one''s true nature

  **śakti** — power, creative capacity; in Pratyabhijñā, the dynamic aspect of Consciousness that manifests all experience

  **saṁsāritvam** — the condition of saṁsāra; bondage, the cycle of transmigration rooted in ignorance of one''s nature'
insight: This is one of the most precise definitions of the human condition in any philosophical literature.
practice: 'Each time you notice yourself reacting with frustration to a situation—blaming circumstance, another person, or
  bad luck—stop and whisper aloud: ''This is my own śakti, forgotten.'' Then name one specific creative choice you are making
  in that moment (even if it feels involuntary: tensing, withdrawing, speaking sharply). Continue the day watching for the
  moment when you recognize you *authored* what you thought was happening *to* you.'
