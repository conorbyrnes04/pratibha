sanskrit_devanagari: चितिसङ्कोचात्मा चेतनोऽपि सङ्कुचितविश्वमयः
sanskrit_iast: citi-saṅkoca-ātmā cetanaḥ api saṅkucita-viśva-mayaḥ
translation_literal: The individual experient, in whom Consciousness has contracted, also contains the universe — but in a
  contracted form.
commentary: 'The individual self is not a different *kind* of thing from universal Consciousness — it is Consciousness *at
  a particular aperture*. *Saṅkoca* — contraction — is the central concept. Like light through a narrow lens, Citi contracted
  becomes the individual *cetana*, the personal experiencer. And yet even in its contracted state it is *viśvamaya* — universe-pervaded,
  universe-containing. The human being is not a piece of the cosmos; it is the whole cosmos at a particular scale of expression.
  This is not metaphor — it is the Pratyabhijñā claim about the actual structure of experience.


  Cross-Tradition Resonance:

  - Śiva Sūtra III.1: the individual self (*āṇu*) as Śiva contracted. The same doctrine stated from the Śaiva side.

  - Leibniz again: each monad as a "concentrated" or "confused" perception of the entire universe.

  - William Blake: "To see a world in a grain of sand / And a heaven in a wild flower" — the infinite in the finite, not as
  symbol but as actual structure.'
insight: The individual self is not a different *kind* of thing from universal Consciousness — it is Consciousness *at a particular
  aperture*.
practice: 'Close your eyes. Notice the size of your awareness right now. Notice how it seems bounded — here inside, there
  outside. Now gently ask: what *is* the boundary made of? Is the line between inside and outside actually solid? Allow the
  aperture to relax without forcing it. *Saṅkoca* can soften on its own when it is noticed.'
