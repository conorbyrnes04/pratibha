pratibha_layers:
- kind: original
  label: Original
  body: चितिसङ्कोचात्मा चेतनोऽपि सङ्कुचितविश्वमयः
- kind: iast
  label: IAST
  body: citi-saṅkoca-ātmā cetanaḥ api saṅkucita-viśva-mayaḥ
- kind: translation
  label: Pratibha Translation
  body: The individual experient, in whom Consciousness has contracted, also contains the universe — but in a contracted form.
- kind: commentary
  label: Pratibha Commentary
  body: The individual self is not a different *kind* of thing from universal Consciousness — it is Consciousness *at a particular
    aperture*. *Saṅkoca* — contraction — is the central concept. Like light through a narrow lens, Citi contracted becomes
    the individual *cetana*, the personal experiencer. And yet even in its contracted state it is *viśvamaya* — universe-pervaded,
    universe-containing. The human being is not a piece of the cosmos; it is the whole cosmos at a particular scale of expression.
    This is not metaphor — it is the Pratyabhijñā claim about the actual structure of experience.
- kind: key_terms
  label: Key Terms
  items:
  - term: saṅkoca
    definition: contraction, limitation; the process by which universal Consciousness becomes individual awareness
  - term: cetana
    definition: the individual experiencer, personal consciousness; distinguished from *citi* (universal)
    lemma_id: caitanya
    sense_id: caitanya.shaiva
  - term: viśvamaya
    definition: pervaded by or consisting of the universe; universe-containing
  - term: saṅkucita
    definition: contracted, limited, reduced in scope
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Śiva Sūtra III.1
    resonance: the individual self (*āṇu*) as Śiva contracted. The same doctrine stated from the Śaiva side.
    divergence: ''
    passage_id: ''
  - citation: Leibniz again
    resonance: each monad as a "concentrated" or "confused" perception of the entire universe.
    divergence: ''
    passage_id: ''
  - citation: William Blake
    resonance: '"To see a world in a grain of sand / And a heaven in a wild flower" — the infinite in the finite, not as symbol
      but as actual structure.'
    divergence: ''
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Close your eyes. Notice the size of your awareness right now. Notice how it seems bounded — here inside, there outside.
    Now gently ask: what *is* the boundary made of? Is the line between inside and outside actually solid? Allow the aperture
    to relax without forcing it. *Saṅkoca* can soften on its own when it is noticed.'
