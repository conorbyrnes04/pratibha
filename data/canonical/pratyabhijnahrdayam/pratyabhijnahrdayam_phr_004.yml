title: Contracted Consciousness Still Contains the Universe
unit_type: sutra
sanskrit_devanagari: चितिसङ्कोचात्मा चेतनोऽपि सङ्कुचितविश्वमयः
sanskrit_iast: citi-saṅkoca-ātmā cetanaḥ api saṅkucita-viśva-mayaḥ
translation_literal: Consciousness, even when contracted into the form of an individual being, still contains
  the universe within itself.
commentary: 'This sūtra cuts to the heart of Pratyabhijñā recognition: the apparent contraction of universal
  Consciousness (Cit) into individual awareness does not diminish or fragment it. The universe remains
  fully present within the contracted form.


  Kṣemarāja is addressing a fundamental objection to non-dual recognition. If I am truly one with all
  Consciousness, why do I experience myself as limited, bound, separate? The answer lies in understanding
  contraction (saṅkoca) not as loss but as a modulation of the same infinite power.


  The term citi-saṅkoca—''the contraction of Consciousness''—refers to the apparent localization of universal
  awareness into individual perspective. Yet this contraction is not real fragmentation. The universe
  (viśva-maya) remains contained within the contracted form (saṅkucita). Just as the entire ocean is present
  in a wave, though the wave appears limited, so the individual consciousness (cetanaḥ) retains the totality
  even in apparent individuation.


  This recognition dissolves the false boundary between self and world. The contraction is real as lived
  experience, but it does not actually separate you from the whole. You are not a piece of Consciousness;
  you are Consciousness in a particular modulation. The universe you perceive ''outside'' is the same
  universe contained ''within'' your contracted form—there is no actual division.


  This teaching prepares the ground for direct recognition (pratyabhijñā): when you realize that your
  contracted individual awareness still encompasses all, the illusion of separation collapses. Freedom
  (svātantrya) is then recognized as your inherent nature, not something to be achieved.


  Key Terms


  **citi-saṅkoca** — The contraction or apparent localization of universal Consciousness into individual,
  limited awareness

  **viśva-maya** — The universe; the totality of manifestation; literally ''composed of the universe''

  **pratyabhijñā** — Recognition; the direct realization that one''s individual consciousness is identical
  with universal Consciousness'
insight: The individual self is not a different *kind* of thing from universal Consciousness — it is Consciousness
  *at a particular aperture*.
practice: Hold your gaze on any single object before you—a cup, a leaf, a wall—and notice how it appears
  to contain depth, space, and detail within its bounded form. Whisper inwardly, "The whole universe is
  here," and let your awareness soften so that the object's apparent separateness begins to dissolve into
  the vastness it holds. Return to this gaze whenever you encounter something small or seemingly insignificant
  today.
