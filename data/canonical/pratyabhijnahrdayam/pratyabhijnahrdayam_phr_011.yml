unit_label: Sutra 11
title: Five Functions of Conscious Manifestation
unit_type: sutra
sanskrit_devanagari: आभासनरक्तिविमर्शनबीजावस्थापनविलापनतस्तानि
sanskrit_iast: ābhāsana-rakti-vimarśana-bīja-avasthāpana-vilāpanataḥ tāni
translation_literal: From manifestation, contraction, discernment, seeding, and dissolution—these are
  the five functions.
commentary: 'This sūtra presents the five operations through which universal Consciousness (Cit) continuously
  creates, sustains, and reabsorbs the cosmos. Each function describes a distinct phase of manifestation:


  **Ābhāsana** (manifestation): The initial radiance or appearance of forms. Consciousness projects itself
  outward as the visible world. This is not creation ex nihilo but the luminous display of what already
  exists within infinite potential.


  **Rakti** (contraction/attachment): The densification or binding force. After appearing, manifestation
  requires a principle of cohesion—what holds forms together and gives them apparent solidity and particularity.
  This is Śakti in her contracting aspect.


  **Vimarśana** (discernment/reflection): The capacity to know and distinguish. Without this reflective
  awareness, manifestation would be inert. Vimarśana is the self-aware quality of Consciousness recognizing
  its own display—the "I-am-ness" that illuminates all experience.


  **Bīja** (seeding/potential): The causal matrix or seed-state. Before manifestation cycles anew, all
  forms rest in their subtle, unmanifest condition—the womb of becoming. This function preserves the blueprint
  for future unfoldment.


  **Vilāpana** (dissolution/withdrawal): The resorption of forms back into the infinite. Nothing manifested
  remains static; all returns to the undifferentiated source, only to emerge again. This is not annihilation
  but rhythmic pulsation (spanda).


  These five are not separate from Consciousness itself but its intrinsic powers (śakti). They operate
  simultaneously and eternally. The recognition (pratyabhijñā) here is that you, as aware presence, are
  not a passive witness to these functions but their very ground and animator. The world''s five-fold
  rhythm is your own rhythm. To see this directly is liberation.


  Key Terms


  **ābhāsana** — manifestation or appearance; the radiant display of forms by Consciousness

  **rakti** — contraction or binding; the densifying power that gives particularity and cohesion to manifestation

  **vimarśana** — discernment or reflective awareness; the self-knowing quality of Consciousness illuminating
  its own display'
insight: A second set of names for the pañcakṛtya, each with a subtler phenomenological flavor.
practice: '**The Five-Breath Recognition Practice**


  Sit quietly. For five complete breath cycles, attune to each function as it moves through your own being:


  1. **Ābhāsana (Manifestation)**: On the inhale, sense how awareness illuminates whatever appears—your
  body, the room, sounds, thoughts. Notice: nothing exists for you until it appears in consciousness.
  Recognize this appearance as your own radiance.


  2. **Rakti (Contraction)**: On the natural pause after the inhale, feel how attention "grips" or focuses
  on one thing—a sensation, an image, a worry. This binding is not a flaw; it is how the infinite becomes
  particular. You are doing this.


  3. **Vimarśana (Discernment)**: On the exhale, notice the knowing quality of your awareness—how you
  can distinguish this breath from that thought, this body from that world. This reflective capacity is
  Consciousness recognizing itself.


  4. **Bīja (Seeding)**: On the pause after the exhale, rest in the pregnant emptiness before the next
  breath. All potential dwells here, unmanifest. You are the seed-bearer.


  5. **Vilāpana (Dissolution)**: As the next inhale begins, sense the subtle dissolution of the previous
  cycle—nothing clings, all flows back into the source, only to emerge fresh.


  Repeat this five-fold cycle 3–5 times. Notice: these five are not happening *to* you; they are *what
  you are doing* as Consciousness itself. This recognition is the practice.'
