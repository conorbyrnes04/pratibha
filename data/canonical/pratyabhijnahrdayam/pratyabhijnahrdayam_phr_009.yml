sanskrit_devanagari: चिद्वत्तच्छक्तिसङ्कोचान्मलावृतः संसारी
sanskrit_iast: cit-vat taccha-śakti-saṅkocāt mala-āvṛtaḥ saṁsārī
translation_literal: That — the Self full of Consciousness — becomes the transmigratory soul, covered by Mala, through contraction
  of its Śakti.
commentary: '*Saṁsārī* — the one who wanders through conditioned existence — is not a different being from Śiva. It is Śiva
  with His Śakti contracted, His power turned inward to the point of forgetting its own nature, then covered by *mala* (the
  three structural "impurities": the sense of incompleteness, the sense of difference, and the sense of being a limited doer).
  These are not moral failings — they are structural consequences of contraction. *Āṇavamala* tells Consciousness it is insufficient;
  *māyīyamala* tells it the world is genuinely other; *kārmamala* tells it that it acts under limitation. Together they generate
  the human condition. The recognition this text aims at is the reversal of all three — not by moral effort but by seeing
  through the contraction itself.


  Cross-Tradition Resonance:

  - Spanda Kārikā I.9: the *pramātā* who is contracted, seeking but not recognizing the Spanda throb.

  - Buddhist *kleśas* (afflictions): structural distortions of awareness rather than moral sins; liberation as seeing through
  structure, not moral improvement.

  - Epictetus: the man who mistakes what is not "up to him" for what is — a structural error with structural consequences,
  not a moral one.'
insight: '*Saṁsārī* — the one who wanders through conditioned existence — is not a different being from Śiva.'
practice: 'Sit with the felt sense of incompleteness — the background hum that something is missing. Don''t try to fix it.
  Recognize: the one who feels incomplete is *cit-vat*, full of Consciousness, playing the role of incompleteness. Let the
  recognition be gentle. Even the feeling of limitation is Śiva at play. This is not bypassing — it is the beginning of *pratyabhijñā*.'
