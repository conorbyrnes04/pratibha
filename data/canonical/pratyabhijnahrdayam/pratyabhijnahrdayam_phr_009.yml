unit_id: pratyabhijnahrdayam.phr_009
unit_label: Sutra 9
title: Consciousness Contracts Into Forgetfulness
unit_type: sutra
sanskrit_devanagari: चिद्वत्तच्छक्तिसङ्कोचान्मलावृतः संसारी
sanskrit_iast: cit-vat taccha-śakti-saṅkocāt mala-āvṛtaḥ saṁsārī
translation_literal: Through the contraction of that very power—the power of consciousness itself—veiled by impurity, the
  individual wanderer comes to be.
commentary: 'This sūtra articulates the central paradox of Kashmir Śaiva philosophy: how the infinite, self-luminous Consciousness
  (Cit) becomes the bound individual (saṁsārī) without losing its essential nature. The word *cit-vat* (''consciousness-like''
  or ''as consciousness'') establishes that what contracts is not Consciousness itself, but its own *śakti*—its creative,
  expressive power. This is crucial: Consciousness does not diminish or fragment. Rather, its power of manifestation undergoes
  *saṅkoca*, a voluntary contraction or self-limiting, like light passing through a narrow aperture. The term *mala* (impurity,
  limitation, or obscuration) does not refer to something foreign introduced into Consciousness, but to a self-imposed veil—a
  forgetting of one''s own infinite nature. The bound individual (*saṁsārī*) is therefore not a separate being, but Consciousness
  itself in a state of self-imposed amnesia, having contracted its power of recognition (*pratyabhijñā*). This contraction
  is not punishment or accident; it is the very mechanism by which the infinite becomes capable of experiencing finitude,
  multiplicity, and the drama of seeking and finding itself. The path of recognition begins precisely here: in understanding
  that the very contraction that binds you is made of your own conscious power, and therefore can be reversed through remembrance.


  Key Terms


  **śakti** — Power, creative potency, or expressive capacity—here, the dynamic aspect of Consciousness that manifests as
  the universe and individual experience

  **saṅkoca** — Contraction, self-limiting, or voluntary narrowing—the mechanism by which infinite Consciousness appears as
  finite individual consciousness

  **mala** — Impurity, obscuration, or veiling limitation—not an external stain but a self-imposed forgetting of one''s true
  nature'
insight: '*Saṁsārī* — the one who wanders through conditioned existence — is not a different being from Śiva.'
practice: 'Contract your exhale to half its normal length, holding the breath out for a count of four, then release into a
  full inhale—repeat this rhythm for five cycles. As you do, whisper on each exhale the word *saṁsārī* (the bound wanderer),
  feeling how the deliberate narrowing of your breath mirrors Consciousness voluntarily limiting its own radiance. Notice:
  the breath-power itself never diminishes, only its expression does.'
