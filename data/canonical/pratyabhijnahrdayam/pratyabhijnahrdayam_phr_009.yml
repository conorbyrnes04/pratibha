pratibha_layers:
- kind: original
  label: Original
  body: चिद्वत्तच्छक्तिसङ्कोचान्मलावृतः संसारी
- kind: iast
  label: IAST
  body: cit-vat taccha-śakti-saṅkocāt mala-āvṛtaḥ saṁsārī
- kind: translation
  label: Pratibha Translation
  body: That — the Self full of Consciousness — becomes the transmigratory soul, covered by Mala, through contraction of its
    Śakti.
- kind: commentary
  label: Pratibha Commentary
  body: '*Saṁsārī* — the one who wanders through conditioned existence — is not a different being from Śiva. It is Śiva with
    His Śakti contracted, His power turned inward to the point of forgetting its own nature, then covered by *mala* (the three
    structural "impurities": the sense of incompleteness, the sense of difference, and the sense of being a limited doer).
    These are not moral failings — they are structural consequences of contraction. *Āṇavamala* tells Consciousness it is
    insufficient; *māyīyamala* tells it the world is genuinely other; *kārmamala* tells it that it acts under limitation.
    Together they generate the human condition. The recognition this text aims at is the reversal of all three — not by moral
    effort but by seeing through the contraction itself.'
- kind: key_terms
  label: Key Terms
  items:
  - term: mala
    definition: 'impurity; the three structural *malas*: *āṇava* (sense of imperfection/insufficiency), *māyīya* (sense of
      genuine otherness/difference), *kārma* (sense of being a limited agent)'
  - term: āvṛta
    definition: covered, veiled, obscured
  - term: saṁsārī
    definition: the transmigratory soul; the one caught in conditioned cycling
  - term: saṅkoca
    definition: contraction; here the root cause of the bound condition
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Spanda Kārikā I.9
    resonance: the *pramātā* who is contracted, seeking but not recognizing the Spanda throb.
    divergence: ''
    passage_id: ''
  - citation: Buddhist *kleśas* (afflictions)
    resonance: structural distortions of awareness rather than moral sins; liberation as seeing through structure, not moral
      improvement.
    divergence: ''
    passage_id: ''
  - citation: Epictetus
    resonance: the man who mistakes what is not "up to him" for what is — a structural error with structural consequences,
      not a moral one.
    divergence: ''
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit with the felt sense of incompleteness — the background hum that something is missing. Don''t try to fix it. Recognize:
    the one who feels incomplete is *cit-vat*, full of Consciousness, playing the role of incompleteness. Let the recognition
    be gentle. Even the feeling of limitation is Śiva at play. This is not bypassing — it is the beginning of *pratyabhijñā*.'
