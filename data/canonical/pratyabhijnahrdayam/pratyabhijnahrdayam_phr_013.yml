unit_label: Sutra 13
title: Recognition Turns Mind Toward Supreme Consciousness
unit_type: sutra
sanskrit_devanagari: तत्परिज्ञाने चित्तमेवान्तर्मुखीभावेन चेतनापदाध्यारोहाच्चितिः
sanskrit_iast: tat-parijñāne cittam eva antarmukhī-bhāvena cetanā-pada-adhyārohāt citiḥ
translation_literal: Through recognition of that, the mind itself becomes inward-turned, and by ascending to the status of
  consciousness (cetanā-pada), it enters into Cit—supreme Consciousness.
commentary: 'This sūtra describes the mechanics of pratyabhijñā—recognition—as a reversal of consciousness itself. The Sanskrit
  phrase tat-parijñāne (''through recognition of that'') refers to recognizing one''s own nature as the universal, self-luminous
  Consciousness (Cit) that underlies all experience. The key term antarmukhī-bhāvena (''inward-turned condition'') signals
  a decisive shift: ordinarily, the mind (citta) projects outward toward objects, creating the illusion of separation. But
  when recognition dawns, this same mind reorients toward its own source.


  The phrase cetanā-pada-adhyārohāt (''by ascending to the status of consciousness'') is crucial. It does not mean the mind
  becomes something other than itself; rather, it recognizes its true standing. Cetanā-pada—the ''position'' or ''status''
  of consciousness—is not a distant goal but the mind''s own intrinsic nature. The word adhyāroha (''ascend,'' ''mount'')
  suggests a shift in identification: the individual mind-function ceases to claim independent agency and recognizes itself
  as a movement within universal Consciousness.


  The final phrase citiḥ (''into Cit'') completes the recognition: the mind does not merge into something foreign, but awakens
  to what it always was. This is not annihilation but clarification—the dissolution of the false boundary between knower and
  known, subject and object. Kṣemarāja teaches that this recognition is not gradual attainment but immediate disclosure of
  what is already the case. The mind''s inward turn is the very recognition that Consciousness alone is, and has always been,
  the sole reality.


  Key Terms


  **pratyabhijñā** — Recognition; the immediate, direct realization that one''s own nature is universal Consciousness (Cit),
  not separate from it.

  **antarmukhī-bhāva** — Inward-turned condition; the reorientation of consciousness from outward projection toward objects
  to inward recognition of its own source.

  **Cit** — Supreme Consciousness; the self-luminous, non-dual awareness that is the sole reality and the true nature of the
  individual self (ātman).'
insight: 'Extended Translation:

  When there is complete recognition of that — of one''s own authorship — the mind itself, through introversion, becomes the
  Supreme Consciousness by ascending to the state of pure Consciousness.'
practice: 'Reverse your gaze mid-thought: the instant you notice your mind reaching outward toward a concern, memory, or object,
  arrest that movement and ask ''who is aware of this reaching?'' Let your attention collapse backward into the awareness
  itself—not as idea but as the felt presence that knows. Repeat this reversal whenever the outward pull reasserts, training
  the mind to recognize it is already the source it seeks.'
