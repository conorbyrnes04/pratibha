commentary: 'Extended Translation:

  When there is complete recognition of that — of one''s own authorship — the mind itself, through introversion, becomes the
  Supreme Consciousness by ascending to the state of pure Consciousness.


  The pivot of the entire text. Sūtra 5 described the descent of Citi into citta (mind); this sūtra describes the ascent.
  And the mechanism is *antarmukhī-bhāva* — the inward-facing movement, the reversal of the outward orientation that generates
  bewilderment. Crucially, it is *citta eva* — the mind *itself* that becomes Citi. Nothing is abandoned. The mind does not
  dissolve into nothing — it is recognized as what it always was: contracted Consciousness ascending back to its own nature.
  *Parijñāna* — complete recognition — is not an experience that happens to the mind from outside. It is the mind''s own act
  of self-recognition. This is why the path is not about achieving something new but about recognizing what has always been
  the case.


  Cross-Tradition Resonance:

  - Vijñāna Bhairava Tantra dhāraṇā 1: *dvādaśānta* contemplation as the practice of this inward turn.

  - Yoga Sūtras I.3: *tadā draṣṭuḥ svarūpe avasthānam* — then the seer abides in its own nature; the same recognition described
  in different framework.

  - Meister Eckhart, Sermon 52: the soul''s *Abkehr* (turning away) from multiplicity back to the ground — *Grunde* — where
  it is identical with the divine ground.'
insight: 'Extended Translation:

  When there is complete recognition of that — of one''s own authorship — the mind itself, through introversion, becomes the
  Supreme Consciousness by ascending to the state of pure Consciousness.'
practice: For five minutes, let awareness turn toward itself. Not thinking about awareness — *being* awareness aware of itself.
  This is *antarmukhī-bhāva*. You cannot force it. But you can relax the outward-rushing orientation. The mind that turns
  inward does not find emptiness; it finds what it has always been. The practice is simply willingness to look in the direction
  of the looker.
