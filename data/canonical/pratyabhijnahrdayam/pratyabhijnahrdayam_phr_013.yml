- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    When there is complete recognition of that — of one''s own authorship — the mind itself, through introversion, becomes
    the Supreme Consciousness by ascending to the state of pure Consciousness.


    The pivot of the entire text. Sūtra 5 described the descent of Citi into citta (mind); this sūtra describes the ascent.
    And the mechanism is *antarmukhī-bhāva* — the inward-facing movement, the reversal of the outward orientation that generates
    bewilderment. Crucially, it is *citta eva* — the mind *itself* that becomes Citi. Nothing is abandoned. The mind does
    not dissolve into nothing — it is recognized as what it always was: contracted Consciousness ascending back to its own
    nature. *Parijñāna* — complete recognition — is not an experience that happens to the mind from outside. It is the mind''s
    own act of self-recognition. This is why the path is not about achieving something new but about recognizing what has
    always been the case.'
- kind: key_terms
  label: Key Terms
  items:
  - term: parijñāna
    definition: 'complete recognition, full knowing; the *pari* prefix intensifies: all-around, thorough, complete'
  - term: antarmukhī
    definition: inward-facing; the reversal of the outward (*bahirmukha*) orientation of ordinary experience
  - term: adhyārohā
    definition: ascending, climbing up; the movement from contracted to expanded recognition
  - term: cetanāpada
    definition: the state or level of pure Consciousness; the highest *bhūmikā*
