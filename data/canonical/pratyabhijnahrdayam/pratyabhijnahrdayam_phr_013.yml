sanskrit_devanagari: तत्परिज्ञाने चित्तमेवान्तर्मुखीभावेन चेतनापदाध्यारोहाच्चितिः
sanskrit_iast: tat-parijñāne cittam eva antarmukhī-bhāvena cetanā-pada-adhyārohāt citiḥ
translation_literal: When there is complete recognition of that, the mind itself, through turning inward,
  is recognized as Consciousness by ascending to the state of pure awareness.
commentary: 'Extended Translation:

  When there is complete recognition of that — of one''s own authorship — the mind itself, through introversion,
  becomes the Supreme Consciousness by ascending to the state of pure Consciousness.


  The pivot of the entire text. Sūtra 5 described the descent of Citi into citta (mind); this sūtra describes
  the ascent. And the mechanism is *antarmukhī-bhāva* — the inward-facing movement, the reversal of the
  outward orientation that generates bewilderment. Crucially, it is *citta eva* — the mind *itself* that
  becomes Citi. Nothing is abandoned. The mind does not dissolve into nothing — it is recognized as what
  it always was: contracted Consciousness ascending back to its own nature. *Parijñāna* — complete recognition
  — is not an experience that happens to the mind from outside. It is the mind''s own act of self-recognition.
  This is why the path is not about achieving something new but about recognizing what has always been
  the case.


  Cross-Tradition Resonance:

  - Vijñāna Bhairava Tantra dhāraṇā 1: *dvādaśānta* contemplation as the practice of this inward turn.

  - Yoga Sūtras I.3: *tadā draṣṭuḥ svarūpe avasthānam* — then the seer abides in its own nature; the same
  recognition described in different framework.

  - Meister Eckhart, Sermon 52: the soul''s *Abkehr* (turning away) from multiplicity back to the ground
  — *Grunde* — where it is identical with the divine ground.'
insight: 'Extended Translation:

  When there is complete recognition of that — of one''s own authorship — the mind itself, through introversion,
  becomes the Supreme Consciousness by ascending to the state of pure Consciousness.'
practice: |
  The mind is already rushing the door — the next message, the next face, the next proof. For five minutes, do not chase it and do not stuff it back in. Soften the outward lean. Let looking turn toward the looker the way an exhale turns toward home. You cannot force recognition. You can stop fleeing the one who is looking. What meets you there is not an empty room. It is the mind discovering it was never other than the light it sought.
