- kind: practice
  label: Practice (Abhyasa)
  body: For five minutes, let awareness turn toward itself. Not thinking about awareness — *being* awareness aware of itself.
    This is *antarmukhī-bhāva*. You cannot force it. But you can relax the outward-rushing orientation. The mind that turns
    inward does not find emptiness; it finds what it has always been. The practice is simply willingness to look in the direction
    of the looker.
