- kind: commentary
  label: Pratibha Commentary
  body: This passage opens a teaching-story about arrival, recognition, and the power of purpose. The
    avenger comes silently, bearing a 'magic arrow,' and is received with ceremonial honor—lifted on a
    buffalo robe, seated in the place of respect. The narrative shows how a person's reputation and intended
    deed precede them, shaping how they are treated, even before their task is known. The passage invites
    reflection on how we recognize and welcome those who carry responsibility, and how silence and dignity
    can speak louder than words.
- kind: key_terms
  label: Key Terms
  body: '**the avenger** — A figure called to a sacred task (to shoot the red eagle); represents purposefulness
    and the weight of duty that precedes a person''s arrival

    **magic arrow** — The tool of the avenger''s task; symbolizes both power and the specific gift or
    responsibility one carries into a community'
  items:
  - term: the avenger
    definition: A figure called to a sacred task (to shoot the red eagle); represents purposefulness and
      the weight of duty that precedes a person's arrival
  - term: magic arrow
    definition: The tool of the avenger's task; symbolizes both power and the specific gift or responsibility
      one carries into a community
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both texts honor the master as one who moves in silence and dignity,
    whose presence is recognized without fanfare. The avenger''s wordless bearing mirrors the sage who
    ''does nothing, yet nothing remains undone.'' Divergence: The Tao Te Ching emphasizes non-action and
    non-striving; the avenger is bound by a specific, urgent task—he acts with purpose, not emptiness.


    **Homer''s Odyssey (Telemachus receiving Athena):** Both passages show a stranger of hidden power
    arriving at a chief''s dwelling and being received with ceremonial honor before their true nature
    is fully revealed. Divergence: The Greek text emphasizes the stranger''s divine disguise and test
    of hospitality; the Dakota passage centers on the community''s recognition of the avenger''s purpose
    and their collective preparation for his deed.


    **Heraclitus, Fragment 108: ''Character is destiny'':** The passage suggests that the avenger''s silent
    dignity and purposefulness shape how he is treated—his character (his bearing, his task) determines
    his reception. Divergence: Heraclitus speaks of an impersonal cosmic order; this story shows character
    enacted within a living community bound by kinship and mutual recognition.'
