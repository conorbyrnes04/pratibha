  cultural_context: Zitkála-Šá, a Yankton Dakota writer, transcribed these Sioux oral legends she was
    told as a child, to keep them for the next generation. Trickster tales (Iktomi) and teaching-stories
    — a living oral tradition, offered as a study reading with respect to Dakota descendants.
