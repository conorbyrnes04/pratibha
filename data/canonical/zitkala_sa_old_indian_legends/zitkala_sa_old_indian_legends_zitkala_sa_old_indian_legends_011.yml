- kind: practice
  label: Practice (Abhyasa)
  body: Sit quietly and recall a moment when you felt held by community—when others showed up without
    being asked. Notice what small, ordinary competencies made that care possible (someone's skill, someone's
    presence, someone's willingness to search). Offer gratitude for one person whose quiet strength you
    often take for granted.
provenance:
  collection: Old Indian Legends
  cultural_context: Zitkála-Šá, a Yankton Dakota writer, transcribed these Sioux oral legends she was
    told as a child, to keep them for the next generation. Trickster tales (Iktomi) and teaching-stories
    — a living oral tradition, offered as a study reading with respect to Dakota descendants.
