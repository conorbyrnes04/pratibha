- kind: commentary
  label: Pratibha Commentary
  body: 'This teaching-story uses comic deflation to reveal a paradox about ambition and power: seven
    warriors set out to conquer, but each falls away through their own nature—wind scatters ash, water
    quenches fire, thorns pierce pride, grief unmakes the dragonfly. By the time Fish and Turtle arrive,
    their very smallness and inability to be understood become their strength, requiring Iktomi''s trickster
    wisdom to translate their intent. The story suggests that war-making born of ego and boasting is self-defeating,
    while those who persist without pretense—even if barely heard—may accomplish what the mighty cannot.'
- kind: key_terms
  label: Key Terms
  body: '**Iktomi** — The trickster figure in Sioux tradition, present in trouble and confusion, who speaks
    truth through mischief and wordplay rather than authority.

    **Zuya unhipi** — Sioux words meaning ''We come to make war''—the warriors'' declaration, which only
    Iktomi can properly interpret from the Fish''s unclear speech.'
  items:
  - term: Iktomi
    definition: The trickster figure in Sioux tradition, present in trouble and confusion, who speaks
      truth through mischief and wordplay rather than authority.
  - term: Zuya unhipi
    definition: Sioux words meaning 'We come to make war'—the warriors' declaration, which only Iktomi
      can properly interpret from the Fish's unclear speech.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15: ''The ancient masters were profound and subtle... because they were
    subtle, they must be described with difficulty.'':** Both texts prize obscurity and indirectness as
    marks of true power; the Fish''s mumbled speech and the Taoist sage''s inscrutability both point to
    a wisdom beyond loud assertion. Divergence: The Tao Te Ching celebrates withdrawal and non-action
    as the path; this story shows that action persists, but only the humble survive it.


    **Ecclesiastes 9:11: ''The race is not to the swift, nor the battle to the strong... but time and
    chance happen to them all.'':** Both texts undermine the assumption that strength and speed guarantee
    victory; circumstance and nature undo the proud warrior. Divergence: Ecclesiastes attributes this
    to chance and divine inscrutability; the Sioux story shows each warrior undone by their own nature—a
    teaching about self-knowledge rather than fate.


    **Heraclitus, Fragment 53: ''War is the father of all things.'':** Both texts place war at the center
    of a teaching about reality and change. Divergence: Heraclitus valorizes conflict as generative; this
    story shows war-making as futile when driven by ego, and suggests that true change comes through acceptance
    of limitation.'
