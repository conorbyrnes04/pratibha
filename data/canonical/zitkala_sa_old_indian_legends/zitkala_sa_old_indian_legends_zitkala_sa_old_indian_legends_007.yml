- kind: key_terms
  label: Key Terms
  body: '**Koda Ni Dakota** — A Dakota phrase meaning ''Friend, you''re a Dakota!''—a call to kinship
    and identity that reminds the listener of their belonging to a people and their responsibilities within
    that kinship.'
  items:
  - term: Koda Ni Dakota
    definition: A Dakota phrase meaning 'Friend, you're a Dakota!'—a call to kinship and identity that
      reminds the listener of their belonging to a people and their responsibilities within that kinship.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**The Odyssey (Homer):** Both feature a hero called to action by a higher power (here, the bird''s
    voice; there, the gods) to protect a community from a threatening force, with a reward offered to
    motivate the people. Divergence: Homer''s hero seeks individual glory and homecoming; this Dakota
    story emphasizes the archer''s identity as already bound to his people—he is called to *remember*
    who he is, not to prove himself.


    **Bhagavad Gita (Krishna''s call to Arjuna):** Both present a moment where a figure is reminded of
    duty and identity at a threshold moment, with a community''s fate hanging in balance. Divergence:
    The Gita emphasizes dharma as cosmic law; this passage grounds duty in the immediate, sensory world—the
    bird''s voice, the eagle''s shadow, the people''s trembling—suggesting wisdom emerges from attention
    to what is present.'
  items:
  - citation: The Odyssey (Homer)
    resonance: Both feature a hero called to action by a higher power (here, the bird's voice; there,
      the gods) to protect a community from a threatening force, with a reward offered to motivate the
      people.
    divergence: Homer's hero seeks individual glory and homecoming; this Dakota story emphasizes the archer's
      identity as already bound to his people—he is called to *remember* who he is, not to prove himself.
  - citation: Bhagavad Gita (Krishna's call to Arjuna)
    resonance: Both present a moment where a figure is reminded of duty and identity at a threshold moment,
      with a community's fate hanging in balance.
    divergence: The Gita emphasizes dharma as cosmic law; this passage grounds duty in the immediate,
      sensory world—the bird's voice, the eagle's shadow, the people's trembling—suggesting wisdom emerges
      from attention to what is present.
