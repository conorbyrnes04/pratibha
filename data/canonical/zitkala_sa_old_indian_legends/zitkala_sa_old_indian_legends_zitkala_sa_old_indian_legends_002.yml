- kind: key_terms
  label: Key Terms
  body: '**Inyan** — The great stone grandfather; an ancient, enduring presence that listens to prayers
    and represents the oldest witness to the land and its seasons.

    **Great Spirit** — The all-powerful creative force that makes trees and grass; hears prayers in many
    forms and communicates through natural signs like the sunset.'
  items:
  - term: Inyan
    definition: The great stone grandfather; an ancient, enduring presence that listens to prayers and
      represents the oldest witness to the land and its seasons.
  - term: Great Spirit
    definition: The all-powerful creative force that makes trees and grass; hears prayers in many forms
      and communicates through natural signs like the sunset.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both texts present the wise as humble, receptive, and aligned with
    an ancient, enduring principle (Tao / Inyan) that operates beyond human will. Both suggest that asking
    rightly requires stillness and respect. Divergence: The Tao Te Ching emphasizes non-action and emptiness;
    this passage shows Iktomi must act—make an offering, travel, prepare—to receive.


    **Psalm 23 (''The Lord is my shepherd''):** Both passages depict a figure in need approaching a greater
    power with trust, receiving provision, and experiencing comfort. Both use natural imagery (green pastures
    / the prairie''s green robe) as signs of care. Divergence: The Psalm promises safety from evil; Iktomi''s
    story ends ambiguously—he is fed but shivering, suggesting provision does not erase hardship.


    **Heraclitus, Fragment 12 (''All things flow''):** Inyan''s constancy amid endless change—seasons
    turning ''more than a thousand times''—echoes the tension between flux and the eternal that Heraclitus
    explores. Divergence: Heraclitus emphasizes the dynamic unity of opposites; this passage stresses
    Inyan''s stillness and witness as the stable ground from which change is perceived.'
  items:
  - citation: Tao Te Ching, Chapter 15
    resonance: Both texts present the wise as humble, receptive, and aligned with an ancient, enduring
      principle (Tao / Inyan) that operates beyond human will. Both suggest that asking rightly requires
      stillness and respect.
    divergence: The Tao Te Ching emphasizes non-action and emptiness; this passage shows Iktomi must act—make
      an offering, travel, prepare—to receive.
  - citation: Psalm 23 ('The Lord is my shepherd')
    resonance: Both passages depict a figure in need approaching a greater power with trust, receiving
      provision, and experiencing comfort. Both use natural imagery (green pastures / the prairie's green
      robe) as signs of care.
    divergence: The Psalm promises safety from evil; Iktomi's story ends ambiguously—he is fed but shivering,
      suggesting provision does not erase hardship.
  - citation: Heraclitus, Fragment 12 ('All things flow')
    resonance: Inyan's constancy amid endless change—seasons turning 'more than a thousand times'—echoes
