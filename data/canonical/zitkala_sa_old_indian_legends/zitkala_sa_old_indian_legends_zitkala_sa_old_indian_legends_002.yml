- kind: commentary
  label: Pratibha Commentary
  body: 'This passage shows Iktomi—a figure of appetite, complaint, and cunning—moving from self-pity
    to ritual prayer, and receiving what he asks for. The story teaches through consequence: Iktomi''s
    hunger is real, but his path to food runs through humility before Inyan, the ancient stone grandfather
    who has witnessed countless seasons. The gift arrives not as magic, but as natural provision met by
