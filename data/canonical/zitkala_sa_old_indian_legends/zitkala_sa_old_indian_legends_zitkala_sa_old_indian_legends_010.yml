- kind: key_terms
  label: Key Terms
  body: '**night people** — creatures of the prairie who move and gather in darkness; in this story, the
    mice and other beings who belong to the nocturnal world and its rhythms

    **the level land** — the open prairie itself, presented as a living space with its own inhabitants,
    dangers, and patterns of movement'
  items:
  - term: night people
    definition: creatures of the prairie who move and gather in darkness; in this story, the mice and
      other beings who belong to the nocturnal world and its rhythms
  - term: the level land
    definition: the open prairie itself, presented as a living space with its own inhabitants, dangers,
      and patterns of movement
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Aesop''s Fables, ''The Ant and the Grasshopper'':** Both warn against pleasure and inattention
    to approaching danger; both use small creatures and vivid scenes to teach about consequence. Divergence:
    Aesop''s tale judges the grasshopper''s frivolity as moral failure; Zitkála-Šá''s passage presents
    the mice''s joy as genuine and natural, with danger as simply part of the prairie''s reality—not punishment
    for wrongdoing.


    **Heraclitus, Fragment 53: ''War is the father of all things'':** Both suggest that tension, predation,
    and opposing forces are woven into existence itself; the prairie is not a safe place but a dynamic
    field of encounter. Divergence: Heraclitus speaks of cosmic strife as generative; this passage emphasizes
    the particular vulnerability of the small and joyful within that strife.


    **Dhammapada, verse 21: ''Heedfulness is the path to the Deathless'':** Both teachings point to awareness
    and attention as essential to navigating existence; both suggest that inattention carries real cost.
    Divergence: The Dhammapada frames heedfulness as a spiritual discipline; the passage presents it as
    a natural survival skill embedded in the prairie itself, not a moral choice.'
