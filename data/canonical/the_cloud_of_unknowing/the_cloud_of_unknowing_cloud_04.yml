unit_label: Beat Upon That Thick Cloud of Unknowing
title: Beat Upon That Thick Cloud of Unknowing
unit_type: sutra
sanskrit_devanagari: And therfore smite apon that thicke cloude of unknowyng with a scharp darte of longing love, and go not
  thens for thing that befalleth.
sanskrit_iast: Middle English (original language of the work).
translation_literal: And therefore strike upon that thick cloud of unknowing with a sharp dart of longing love, and do not
  go thence for anything that befalls.
commentary: 'The chapter''s central move is violent and sustained: *smite* (strike repeatedly, not once) upon the cloud with
  a *sharp dart*—longing love itself becomes the weapon, not intellection or image-work. The apophatic discipline here names
  a paradox: the only tool that pierces unknowing is desire itself, which is not knowledge but its opposite, a piercing *through*
  opacity rather than around it. The dart must be ''sharp''—not diffuse sentiment but a concentrated, pointed intention—and
  ''longing'' (a reaching that acknowledges distance, not possession). Crucially, the instruction *go not thens for thing
  that befalleth*: do not abandon the cloud-striking when distraction comes, when the body aches, when the mind rebels with
  images and memories. The cloud thickens precisely when we persist; thickness is not failure but the proper texture of unknowing
  love. The discipline is not to clarify or penetrate intellectually, but to keep the dart moving—to maintain naked intent
  as a continuous act of will against the gravitational pull of creature-thoughts and the mind''s hunger for form. This is
  apophatic not because it denies God''s reality but because it refuses all mediation except the raw fact of longing itself.


  Key Terms


  **cloud of unknowing** — The opacity of God''s transcendence that cannot be penetrated by intellect or image, only by naked
  longing love; the proper medium of apophatic encounter

  **sharp dart of longing love** — Concentrated, pointed desire (not diffuse sentiment) that pierces unknowing through sustained
  will; longing as the only weapon that works against opacity

  **naked intent** — Bare, unmediated act of will directed toward God without image, concept, or intellectual form; the continuous
  maintenance of longing despite distraction


  Cross-Tradition Resonances


  **Pseudo-Dionysius, *Mystical Theology* I.1:** Both texts refuse conceptual mediation and intellectual ascent as the path
  to divine union; both posit unknowing as the proper mode of encounter with transcendence Divergence: Pseudo-Dionysius emphasizes
  *negation* of all names and attributes through hierarchical ascent; *Cloud* grounds the apophatic act in *longing love as
  continuous will*, not in systematic negation of predicates

  **Meister Eckhart, *German Sermons* on *Gelassenheit* (releasement):** Both insist on abandoning image-work and creature-thoughts;
  both locate divine encounter in a naked, unmediated state of the soul Divergence: Eckhart emphasizes *releasement* and *emptying*
  as passive receptivity; *Cloud* emphasizes *active, sustained striking*—the dart must keep moving, not rest in emptiness

  **Bhagavad Gītā 12.2 (on devotion without form):** Both privilege devotional intensity (*bhakti* / longing love) over knowledge
  (*jñāna*) as the superior path; both acknowledge the difficulty of formless devotion Divergence: *Cloud* frames the formless
  path as *apophatic necessity* (unknowing is the only way); Gītā presents it as one valid path among others, suited to certain
  temperaments'
insight: 'The chapter''s central move is violent and sustained: *smite* (strike repeatedly, not once) upon the cloud with
  a *sharp dart*—longing love itself becomes the weapon, not intellection or image-work.'
practice: When restlessness arrives during prayer—the itch to shift, the urge to think of someone, the sudden memory—drive
  the longing *harder* into the thickness, as if the distraction itself is the cloud's resistance asking to be struck again,
  not avoided. Let the sharpness of your reaching intensify at the moment you most want to quit.
