  items:
  - term: cloud of forgetting
    definition: 'paired discipline with unknowing → active putting-below of creatures and even God’s works so attention can
      pierce upward Here: What makes this apophatic is the refusal to engage the thought''s content or origin; the meditator
      does not analyze why the thought arose (''these''—the senses, i… Trap: ordinary forgetfulness or repression'
  - term: cloud of unknowing
    definition: 'Middle English contemplative idiom → the dark between you and God where conceptual knowing of God fails and
      love pierces Here: Yet each return, each small act of putting-down, deepens the soul''s capacity to dwell in unknowing.
      Trap: vague foggy mysticism without the disciplined ‘work’ of piercing love'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: nakid entent (naked intent)
    definition: 'ME ‘bare / naked intention’ → stripped willing toward God alone, without images or discursive props Here:
      The ''naked intent'' toward God (the unseen, unnamed reality) can only persist when the mind stops furnishing itself
      with images, concepts, and the small narrati… Trap: willpower striving; misses the bareness of intention'
  - term: apophasis
    definition: 'ἀπόφασις ‘unsaying’ → approach to God by denying inadequate knowing—here practiced as cloud-work Here: Yet
      each return, each small act of putting-down, deepens the soul''s capacity to dwell in unknowing. Trap: atheism or anti-intellectual
      pose'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: werk (work of contemplation)
    definition: 'ME werk → the specific contemplative labor of holding naked intent in the cloud Here: Middle English (original
