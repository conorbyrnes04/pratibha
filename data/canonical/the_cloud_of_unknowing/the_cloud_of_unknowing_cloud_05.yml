unit_id: the_cloud_of_unknowing.cloud_05
unit_label: Travail Earnestly Against Sundry Thoughts
title: Travail Earnestly Against Sundry Thoughts
unit_type: sutra
sanskrit_devanagari: And therfore travaile fast against alle sodeyn thoughtes that come of thees, and put hem down as oft
  as thou mai.
sanskrit_iast: Middle English (original language of the work).
translation_literal: And therefore travail hard against all sudden thoughts that come from these, and put them down as often
  as you may.
commentary: 'This chapter names the core labor of the contemplative path: not passive waiting, but active *travail* against
  the sudden uprising of thought itself. The Cloud-author does not counsel suppression or violent rejection; rather, the repeated
  action—''as oft as thou mai''—establishes a rhythm of noticing and *putting down*, a discipline of return that becomes the
  practice itself. What makes this apophatic is the refusal to engage the thought''s content or origin; the meditator does
  not analyze why the thought arose (''these''—the senses, imagination, reason) but simply recognizes its arrival and releases
  it downward into the cloud of forgetting. This is not thought-control but thought-indifference. The ''naked intent'' toward
  God (the unseen, unnamed reality) can only persist when the mind stops furnishing itself with images, concepts, and the
  small narratives that thoughts carry. The travail is earnest precisely because thoughts arise *suddenly*—unbidden, constant,
  seductive in their apparent significance. Yet each return, each small act of putting-down, deepens the soul''s capacity
  to dwell in unknowing. The frequency (''as oft as thou mai'') suggests not perfection but fidelity; the practice is measured
  not by stillness achieved but by willingness renewed.'
insight: 'This chapter names the core labor of the contemplative path: not passive waiting, but active *travail* against the
  sudden uprising of thought itself.'
practice: When a thought arrives fully formed—a memory, a worry, a phrase, a face—name it once in a whisper or inner word
  (grief, hunger, him, shame), then drop your attention downward as if releasing a stone into dark water, and return your
  naked longing to the formless presence you cannot think.
