unit_type: reflection
commentary: 'This editorial gloss sharply distinguishes the passage’s technical use of “meditation” from
  later assumptions about discursive prayer. Meditation is first “consideration”: moral reflection on
  inward and outward conduct, especially its freedom from sin. Yet it also includes “immediate acts,”
  suggesting brief, direct movements of the soul rather than extended reasoning. The gloss preserves a
  hierarchy: thinking is real and useful, but it is instrumental. Such acts and prayers, whether vocal
  or mental, dispose the soul for the “exercise of love,” named through aspirations and elevations. The
  passage therefore does not reject thought or ordinary prayer; it assigns them a preparatory role. Its
  decisive concern is the transition from moral and reflective self-attention to loving intention toward
  God. The phrase “in time” also matters: this movement is cultivated, not mechanically produced, and
  the practices are means rather than the contemplative end itself.'
