- kind: key_terms
  label: Key Terms
  body: '**meditation** — Here defined as consideration or thinking, including reflection on conduct and
    immediate spiritual acts.


    **immediate acts** — Direct interior movements that contain some thought but lead beyond sustained
    discursive reflection.


    **prayer** — A broad term embracing vocal and mental prayer as preparatory means.


    **exercise of love** — The contemplated goal: aspirations and elevations of the soul toward God.'
- kind: resonances
  label: Resonances
  body: '**The Ladder of Divine Ascent, John Climacus:** Climacus treats ascetical vigilance and prayer
    as a progressive schooling of desire rather than as ends in themselves. Divergence: His ladder is
    more explicitly ordered through numbered virtues and monastic renunciations than this compact account
    of meditation.


    **The Interior Castle, Teresa of Avila:** Teresa distinguishes forms of mental prayer and describes
    them as disposing the person for a more God-given loving attention. Divergence: Her account gives
    greater emphasis to successive interior dwelling places and infused prayer.


    **The Sayings of the Desert Fathers:** The brief, repeated prayerful movement implied by “immediate
    acts” resembles the Fathers’ preference for concise, watchful prayer. Divergence: The passage offers
    a conceptual definition of meditation that the sayings usually convey through anecdote and instruction.'
- kind: practice
  label: Practice
  body: Begin with a short consideration of one inward and one outward way you seek to live without sin.
    Then set analysis aside and make several simple acts of desire toward God, using few words; let vocal
    or mental prayer serve that loving turning rather than become an object of self-measurement.
