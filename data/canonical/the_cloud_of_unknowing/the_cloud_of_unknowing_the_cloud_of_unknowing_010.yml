pratibha_layers:
- kind: translation
  label: Translation
  body: By meditation here is not meant discursive prayer, which is the common meaning of the word now,
    but consideration, whereby a man 381 COMMENTARY [Cloud thinks how he ought to behave interiorly and
    exteriorly without sin. Or else it means the exercise of immediate acts. For such exer- cise of acts
    hath some meditation in it, and meditation in its proper signification is but a thinking. And such
    exercise of acts is a means to bring one in time to the exercise of love treated of by our author.
    By prayer our author means as well vocal prayer as mental prayer (meditation or acts), by which a
    soul is brought to the exercise of love (aspirations and elevations).
