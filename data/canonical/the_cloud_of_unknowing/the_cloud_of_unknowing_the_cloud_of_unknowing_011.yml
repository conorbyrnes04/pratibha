- kind: key_terms
  label: Key Terms
  body: '**aspirations** — Brief upward impulses of desire or prayer arising within the contemplative.


    **premeditation** — Prior mental planning, explicitly denied as the source of these movements.


    **interior motion** — An inward stirring that moves the will toward God.


    **will** — The faculty of loving intention, here moved and informed by God.'
- kind: resonances
  label: Resonances
  body: '**Augustine, Confessions:** Augustine repeatedly portrays conversion and prayer as enabled by
    God’s prevenient inward action on the heart and will. Divergence: Augustine often narrates this action
    through memory, confession, and doctrinal reflection, whereas this passage stresses suddenness before
    such elaboration.


    **Theologia Germanica:** Both works locate true spiritual life in surrender of self-will to God’s
    working within the person. Divergence: Theologia Germanica develops a more sustained account of selfhood,
    sin, and detachment; this passage narrowly identifies the arising of aspiration.


    **John Cassian, Conferences:** Cassian treats brief, repeated prayer as a concentrated means of turning
    the mind and heart toward God. Divergence: Cassian gives a formulated prayer for continual use, while
    this passage emphasizes unpremeditated inward impulses.'
- kind: practice
  label: Practice
  body: Sit quietly and do not prepare a speech for God. Notice any simple, unplanned movement of longing,
    consent, or turning within; receive it without analyzing its cause. If no such aspiration appears,
    remain available rather than forcing one.
