pratibha_layers:
- kind: translation
  label: Translation
  body: THIS and some of the next ensuing chapters deal with the exercise of aspirations, the which do
    proceed suddenly and without any premeditation or cause, but only from interior motion and information
    from God who moves the will.
- kind: commentary
  label: Commentary
  body: 'The passage introduces “aspirations” not as sentiments manufactured by reflection but as abrupt
    movements of desire toward God. Their lack of “premeditation or cause” marks them as distinct from
    planned devotional speech, analytical thought, or a self-generated emotional state. Yet the author
    does not describe the will as inert: aspiration occurs in the will, while its initiating “motion and
    information” are attributed to God. This phrasing preserves the treatise’s apophatic discipline. God
    is not grasped as an object of prior knowledge; rather, divine action is discerned in a direct interior
    turning or impulse. The chapter heading also matters: these impulses require “exercise.” Though they
    cannot be produced on command, the contemplative learns to receive, recognize, and consent to them
