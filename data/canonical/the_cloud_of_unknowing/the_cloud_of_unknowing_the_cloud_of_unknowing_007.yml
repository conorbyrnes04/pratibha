unit_label: Nothing of No Worth
title: Nothing of No Worth
unit_type: reflection
commentary: 'The sentence turns on a necessary distinction in the word “nought.” Active critics judge
  contemplative work as “nought” because it appears unproductive: it yields no visible deed, social utility,
  or measurable profit. The author refuses to let that judgment become a moral accusation. Here “nought”
  means not wickedness but apparent insignificance—“a thing of no worth or profit.” This careful clarification
  protects contemplation from a common misunderstanding within a religious culture that valued active
  service. The passage does not denigrate action; rather, it identifies the active person’s objection
  as an assessment based on external usefulness. Contemplative prayer may look empty from that standpoint,
  but its seeming lack of profit is not evidence of evil. The distinction also prepares the reader for
  the treatise’s larger positive use of “nothing”: language of emptiness can name a mode of relation to
  God beyond ordinary practical calculation.'
