- kind: key_terms
  label: Key Terms
  body: '**actives** — Those oriented toward outward works, who question the value of contemplation.


    **contemplatives** — Those devoted to inward prayer rather than visibly useful activity.


    **nought** — Here explicitly means something judged worthless or unprofitable, not something evil.


    **profit** — The visible usefulness by which critics assess contemplative practice.'
- kind: resonances
  label: Resonances
  body: '**Mary and Martha in Luke 10:38–42:** Mary’s apparently inactive listening is defended against
    a demand for practical service, much as contemplation is defended against active criticism. Divergence:
    Luke presents a narrative contrast and Jesus’ judgment; this passage chiefly defines a disputed term.


    **Meister Eckhart:** Eckhart repeatedly challenges the assumption that spiritual worth is measured
    by outward works and usefulness. Divergence: Eckhart’s sermons often make stronger metaphysical claims
    about detachment than this narrow lexical clarification does.'
- kind: practice
  label: Practice
  body: Notice any demand that prayer or silence must immediately prove its usefulness. Sit quietly for
    a few minutes with a simple intention toward God, without trying to produce an experience or result.
    When self-accusation calls the time “nought,” distinguish gently between apparent unprofitability
    and evil.
