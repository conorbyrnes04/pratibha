  items:
  - term: cloud of unknowing
    definition: 'Middle English contemplative idiom → the dark between you and God where conceptual knowing
      of God fails and love pierces Here: A Cloud of Unknowing Between You and God A Cloud of Unknowing
      Between You and God For of alle other creatures and theire werkes—ye, and of the werkes of God se…
      Trap: vague foggy mysticism without the disciplined ‘work’ of piercing love'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: apophasis
    definition: 'ἀπόφασις ‘unsaying’ → approach to God by denying inadequate knowing—here practiced as
      cloud-work Here: A Cloud of Unknowing Between You and God A Cloud of Unknowing Between You and God
      For of alle other creatures and theire werkes—ye, and of the werkes of God se… Trap: atheism or
      anti-intellectual pose'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: nakid entent (naked intent)
    definition: 'ME ‘bare / naked intention’ → stripped willing toward God alone, without images or discursive
      props Here: What replaces thinking is "naked intent" (intent stripped of image, concept, mediation),
      directed toward what cannot be thought. Trap: willpower striving; misses the bareness of intention'
  - term: love / charite
    definition: 'ME contemplative love → the dart that alone can pierce the cloud where knowledge cannot
      Here: And therfore I wolde leve al that thing that I can think, and chese to my love that thing
      that I cannot think. Trap: sentimental affection replacing contemplative work'
  - term: werk (work of contemplation)
    definition: 'ME werk → the specific contemplative labor of holding naked intent in the cloud Here:
      Middle English (original language of the work). Trap: generic spiritual busywork'
