unit_label: A Cloud of Unknowing Between You and God
title: A Cloud of Unknowing Between You and God
unit_type: sutra
sanskrit_devanagari: For of alle other creatures and theire werkes—ye, and of the werkes of God self—may
  a man thorou grace have fulheed of knowing, and wel to kon thinke on hem; bot of God him-self can no
  man thinke. And therfore I wolde leve al that thing that I can think, and chese to my love that thing
  that I cannot think.
sanskrit_iast: Middle English (original language of the work).
translation_literal: Of all other creatures and their works—yes, and of the works of God himself—a person
  may through grace have fullness of knowing, and think well on them; but of God himself no one can think.
  And therefore I would leave all that I can think, and choose for my love that which I cannot think.
commentary: 'The passage performs a deliberate inversion of the intellect''s natural hierarchy. Where
  reason typically ascends from creatures to Creator—moving from known particulars toward the divine source—this
  chapter arrests that motion at its threshold. The author grants the mind full permission to exhaust
  itself on creation: God''s works, creatures, their operations—all *knowable*, all *thinkable*, all legitimate
  objects of grace-assisted cognition. This is not a rejection of knowledge but a strategic saturation
  of it. Only when the thinking mind has claimed its rightful domain does the author make his cut: God
  *himself* withdraws from thought. Not from experience, not from love, but from the representational
  machinery of the intellect. The phrase "I wolde leve al that thing that I can think" is not renunciation
  born of failure; it is a *choice*—an active abandonment of the very tool that has served everywhere
  else. What replaces thinking is "naked intent" (intent stripped of image, concept, mediation), directed
  toward what cannot be thought. This is the apophatic wager: that love pierces where cognition cannot
  follow, that the will''s bare directedness toward the unthinkable God is not confusion but the truest
  fidelity. The cloud of unknowing is not imposed; it is chosen, preferred, *loved*.'
insight: The passage performs a deliberate inversion of the intellect's natural hierarchy.
practice: When a thought of God arises—any image, name, attribute, or theological claim—do not suppress
  it but consciously set it aside as you would place a tool on a shelf, acknowledging its usefulness elsewhere.
  Then direct the naked thrust of your intention (wordless, imageless, stripped) toward the darkness where
  that thought cannot follow, sustaining the strain of reaching toward what your mind refuses to render.
