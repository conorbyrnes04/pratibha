pratibha_layers:
- kind: translation
  label: Translation
  body: 'HERE he continueth to speak of the happiness and security that those enjoy who hold still to
    the exercise of the will: as is done in acts, aspirations, and elevations. Therefore he saith: Stick
    fast to this meek stirring (or motion) of love, and follow the guidance of the same ; for tt will
    be thy guide in this life and bring thee to bliss tn the life to come. Mark how he saith that the
    will (that is, the exercise of it) will be his guide, and bring him through all difficulties, and
    free him from all errors and perils of temptation. For, when the will adhereth immediately to God,
    nothing can come between them, and so nothing will be able to hurt such a man.'
- kind: commentary
  label: Commentary
  body: 'The passage locates contemplative security not in intellectual certainty, moral self-analysis,
    or freedom from outward difficulty, but in the sustained direction of the will toward God. Its repeated
    stress on “exercise” prevents the will from being treated as a bare faculty: it is enacted in “acts,
    aspirations, and elevations,” concrete renewals of loving intention. “Meek” qualifies this motion
    decisively. The will does not seize God by force or achievement; it consents, follows, and adheres.
    The claim that nothing can come between the will and God is therefore not a promise that temptations
    disappear, nor that the contemplative becomes incapable of error. Rather, temptation loses its decisive
    power where the deepest intention remains immediately turned toward God. The passage joins present
    guidance and future “bliss”: the same habitual orientation that steadies a person amid difficulty
    is already the path by which contemplative desire is fulfilled.'
- kind: key_terms
  label: Key Terms
  body: '**meek stirring** — A humble, gentle movement of love that directs contemplation without self-assertion.


    **exercise of the will** — The repeatedly enacted turning of desire toward God, rather than a merely
    theoretical intention.


    **aspirations** — Brief inward risings of desire toward God within contemplative practice.


    **immediately to God** — A direct adherence of the will to God, without allowing competing attachments
    to govern it.'
- kind: resonances
  label: Resonances
  body: '**The Gospel of Matthew:** Its call to purity or singleness of heart resembles the passage’s
    undivided adherence of the will to God. Divergence: Matthew frames this within discipleship, righteousness,
    and the kingdom, while this passage concentrates on interior contemplative intention.


    **Augustine, Confessions:** Augustine’s account of the restless heart finds repose when ordered toward
    God parallels the passage’s confidence in rightly directed will. Divergence: Augustine often narrates
    divided desire and grace through autobiographical memory; this passage offers practical guidance for
    maintaining loving attention.


    **The Bhagavad Gita:** Its discipline of directing action and devotion toward the divine resembles
    the emphasis on a stable, Godward intention amid difficulty. Divergence: The Gita develops this through
    duty and action in the world, whereas this passage foregrounds apophatic contemplative adhesion.'
- kind: practice
  label: Practice
  body: Sit quietly and notice the competing concerns that seek to occupy the will. Without arguing with
    them, make a small, meek inward aspiration of love toward God, then return to it whenever distraction
    or anxiety arises. Let the aim be not a special feeling, but simple adherence.
