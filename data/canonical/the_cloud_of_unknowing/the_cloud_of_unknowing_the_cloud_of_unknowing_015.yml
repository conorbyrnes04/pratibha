title: Guidance of Meek Love
unit_type: reflection
commentary: 'The passage locates contemplative security not in intellectual certainty, moral self-analysis,
  or freedom from outward difficulty, but in the sustained direction of the will toward God. Its repeated
  stress on “exercise” prevents the will from being treated as a bare faculty: it is enacted in “acts,
  aspirations, and elevations,” concrete renewals of loving intention. “Meek” qualifies this motion decisively.
  The will does not seize God by force or achievement; it consents, follows, and adheres. The claim that
  nothing can come between the will and God is therefore not a promise that temptations disappear, nor
  that the contemplative becomes incapable of error. Rather, temptation loses its decisive power where
  the deepest intention remains immediately turned toward God. The passage joins present guidance and
  future “bliss”: the same habitual orientation that steadies a person amid difficulty is already the
  path by which contemplative desire is fulfilled.'
