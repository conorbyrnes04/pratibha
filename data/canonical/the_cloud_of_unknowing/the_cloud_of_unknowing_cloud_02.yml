unit_label: Look That Nothing Live in Thy Working Mind
title: Look That Nothing Live in Thy Working Mind
unit_type: sutra
sanskrit_devanagari: And yif ever thou schalt come to this cloude and dwelle and wirche therin as I bid
  thee, thee behoveth, as this cloude of unknowyng is aboven thee, bitwix thee and thi God, right so put
  a cloude of forgetyng bineth thee, bitwix thee and alle the cretures that ever ben maad.
sanskrit_iast: Middle English (original language of the work).
translation_literal: If ever you shall come to this cloud and dwell and work therein as I bid you, you
  must—as this cloud of unknowing is above you, between you and your God—likewise put a cloud of forgetting
  beneath you, between you and all the creatures that ever were made.
commentary: 'The passage establishes apophatic discipline through radical spatial inversion: the cloud
  of unknowing above (between self and God) demands a correlate below (between self and creation). This
  is not mere symmetry but structural necessity. The unknowing cloud works by negation upward—stripping
  away all images, concepts, names of God. But unknowing alone risks a dangerous suspension: the mind
  still clings to creatures, to memory, to the felt world. The cloud of forgetting operates downward as
  active forgetting, not passive ignorance. It is forgetting as *work* (wirche)—a deliberate pressing-down
  of all created things, all sensory and emotional attachments, all the furniture of the known world.
  The author does not say these creatures are evil or illusory; they are simply *beneath* the work. By
  positioning them below, the practitioner creates a psychological and spiritual floor: nothing living—no
  image, no feeling, no memory of beloved persons or beautiful things—must rise into the working mind
  where naked intent toward God operates. The two clouds form a sealed chamber. This is not dissociation
  but disciplined attention: the cloud of forgetting is the price of the cloud of unknowing. One cannot
  pierce the veil above while trailing the weight of creation below.


  Key Terms


  **cloud of unknowing** — The apophatic veil between self and God, achieved through negation of all concepts,
  images, and names; the upper boundary of the sealed chamber of contemplation.

  **cloud of forgetting** — Active, deliberate pressing-down of all creatures, memories, and sensory attachments;
  the lower boundary that prevents created things from rising into the naked intent toward God.

  **wirche (work)** — Deliberate, sustained effort of forgetting and unknowing; not passive but an active
  discipline of attention and will.


  Cross-Tradition Resonances


  **Pseudo-Dionysius, *Mystical Theology*, ch. 1:** Both texts employ apophatic negation as the path to
  union with the divine beyond all names and concepts; unknowing as a positive ascent through negation.
  Divergence: Pseudo-Dionysius emphasizes hierarchical ascent through the celestial orders; *The Cloud*
  introduces the correlate downward movement (forgetting of creatures) as structurally necessary, not
  merely preparatory.

  **Meister Eckhart, *Sermon 52* (''Beati pauperes spiritu''):** Both stress radical emptying—Eckhart''s
  ''poverty of spirit'' as detachment from all creatures and self-will; the Cloud''s forgetting as clearing
  the ground for God''s work. Divergence: Eckhart frames emptying as metaphysical identity with God''s
  generative nothingness; the Cloud author maintains spatial and psychological separation—two clouds,
  a sealed chamber—preserving the practitioner''s distinct labor.

  **The *Bhagavad Gita*, 2.58–59 (withdrawal of the senses):** Both describe disciplined withdrawal of
  sensory and emotional attachment to the created world as prerequisite for higher consciousness; the
  senses must be ''turned inward.'' Divergence: The *Gita* frames withdrawal as natural consequence of
  wisdom (*jñāna*); the Cloud author emphasizes it as *willed work*, a deliberate pressing-down that must
  be sustained against the mind''s gravitational pull toward creatures.'
insight: 'The passage establishes apophatic discipline through radical spatial inversion: the cloud of
  unknowing above (between self and God) demands a correlate below (between self and creation).'
practice: When sitting in silence, notice what creature-thought or memory surfaces (a face, a worry, a
  pleasure), and rather than pushing it away, consciously lower it—imagine it sinking as if weighted,
  moving down and away from the crown of your head toward your feet and into the earth. Do this without
  judgment or strain; the lowering itself is the work, a gentle but deliberate descent that clears the
  space above.
