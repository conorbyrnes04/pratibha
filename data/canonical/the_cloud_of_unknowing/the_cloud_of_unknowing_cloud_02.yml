  items:
  - term: cloud of unknowing
    definition: 'Middle English contemplative idiom → the dark between you and God where conceptual knowing of God fails and
      love pierces Here: If ever you shall come to this cloud and dwell and work therein as I bid you, you must—as this cloud
      of unknowing is above you, between you and your God—likewi… Trap: vague foggy mysticism without the disciplined ‘work’
      of piercing love'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: cloud of forgetting
    definition: 'paired discipline with unknowing → active putting-below of creatures and even God’s works so attention can
      pierce upward Here: If ever you shall come to this cloud and dwell and work therein as I bid you, you must—as this cloud
      of unknowing is above you, between you and your God—likewi… Trap: ordinary forgetfulness or repression'
  - term: nakid entent (naked intent)
    definition: 'ME ‘bare / naked intention’ → stripped willing toward God alone, without images or discursive props Here:
      By positioning them below, the practitioner creates a psychological and spiritual floor: nothing living—no image, no
      feeling, no memory of beloved persons or b… Trap: willpower striving; misses the bareness of intention'
  - term: werk (work of contemplation)
    definition: 'ME werk → the specific contemplative labor of holding naked intent in the cloud Here: Look That Nothing Live
      in Thy Working Mind Look That Nothing Live in Thy Working Mind And yif ever thou schalt come to this cloude and dwelle
      and wirche therin… Trap: generic spiritual busywork'
  - term: apophasis
    definition: 'ἀπόφασις ‘unsaying’ → approach to God by denying inadequate knowing—here practiced as cloud-work Here: Look
      That Nothing Live in Thy Working Mind Look That Nothing Live in Thy Working Mind And yif ever thou schalt come to this
      cloude and dwelle and wirche therin… Trap: atheism or anti-intellectual pose'
    lemma_id: apophasis
