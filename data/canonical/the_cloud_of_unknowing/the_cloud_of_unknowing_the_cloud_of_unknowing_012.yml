- kind: key_terms
  label: Key Terms
  body: '**aspirations** — Brief upward movements of desire or prayer directed toward God.


    **nature** — What a person possesses as intrinsic to created human being.


    **gift** — What is received rather than possessed inherently.


    **grace** — Divine favor and aid, distinguished here from native endowment.'
- kind: resonances
  label: Resonances
  body: '**Augustine, Confessions:** Augustine treats God as more inward than the self and sees human
    desire as ordered toward God. Divergence: This passage makes a careful comparison between nature and
    grace rather than narrating restless desire and conversion.


    **Thomas Aquinas, Summa Theologiae:** Aquinas distinguishes natural human capacities from grace while
    holding that grace perfects rather than destroys nature. Divergence: The passage offers a contemplative
    observation, not Aquinas’s systematic account of nature’s end and grace’s necessity.'
- kind: practice
  label: Practice
  body: Sit quietly and notice the difference between striving to produce devotion and the simple capacity
    already present to turn toward God. Offer one short aspiration without elaborating it, then rest in
    the recognition that grace may work through, rather than bypass, your most inward created nature.
