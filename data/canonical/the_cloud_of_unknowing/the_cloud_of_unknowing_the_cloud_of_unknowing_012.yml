unit_label: Nearer Than Grace
title: Nearer Than Grace
unit_type: reflection
commentary: 'This brief heading sharpens a distinction central to the treatise’s anthropology: acquired
  or bestowed spiritual capacities are not simply identical with what a person is by nature. “Gift, grace,
  or exercise” names three modes by which one may receive, cultivate, or enact relation to God; yet the
  author insists that natural endowment is “nearer” to the person. In context, this nearness helps explain
  the efficacy of aspirations: they are not merely external techniques added to the self, but movements
  engaging an intimate native capacity. The claim does not reduce grace to nature or make grace unnecessary.
  Rather, it establishes an order of immediacy: grace and practice work in and through a creature whose
  natural powers and desires are already inseparable from that creature’s being. The editorial “Note”
  directs attention to this precise comparative claim, not to a general praise of self-reliance.'
