title: Called to the Gracious Work
unit_type: reflection
commentary: 'The passage opens by defining the proper subject of the book’s “work” before describing its
  method. Its criterion is not moral spotless­ness, learning, clerical rank, or a particular former life:
  those who have been “customary sinners” stand alongside those who have not. What is required is a “true
  will” of forsaking the world and a vocation directed away from “active life” toward “contemplative life.”
  “World” here chiefly names an orientation of attachment and dispersal, not necessarily a physical place;
  the emphasis falls on the will’s decisive turning. Yet the text is also deliberately restrictive: this
  work is addressed to those given to contemplation, rather than indiscriminately prescribing the practice
  to every Christian. Calling it both “grace” and “work” holds divine gift and human undertaking together.
  The promised concern for “discretion” signals that contemplative desire needs discernment, not merely
  intensity.'
