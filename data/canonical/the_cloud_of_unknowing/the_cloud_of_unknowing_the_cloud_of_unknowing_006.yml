pratibha_layers:
- kind: translation
  label: Translation
  body: 'WHO SHOULD WORK IN THE GRACIOUS WORK OF THIS BOOK First and foremost, I will tell thee who should
    work in this work, and when, and by what means: and what discretion thou shalt have in it. If thou
    ask me who shall work thus, I answer thee: all that have for- saken the world in a true will, and
    also that give themselves not to active life, but to that life that is called contemplative life.
    All those should work in this grace and in this work, whatsoever they be, whether they have been customary
    sinners or none.'
- kind: commentary
  label: Commentary
  body: 'The passage opens by defining the proper subject of the book’s “work” before describing its method.
    Its criterion is not moral spotless­ness, learning, clerical rank, or a particular former life: those
    who have been “customary sinners” stand alongside those who have not. What is required is a “true
    will” of forsaking the world and a vocation directed away from “active life” toward “contemplative
    life.” “World” here chiefly names an orientation of attachment and dispersal, not necessarily a physical
    place; the emphasis falls on the will’s decisive turning. Yet the text is also deliberately restrictive:
    this work is addressed to those given to contemplation, rather than indiscriminately prescribing the
    practice to every Christian. Calling it both “grace” and “work” holds divine gift and human undertaking
    together. The promised concern for “discretion” signals that contemplative desire needs discernment,
    not merely intensity.'
- kind: key_terms
  label: Key Terms
  body: '**true will** — The sincere, settled intention by which one turns from worldly attachment toward
    God.


    **active life** — The life of outward duties and works, distinguished here from the contemplative
    vocation.


    **contemplative life** — A life ordered toward interior attention to God rather than chiefly outward
    activity.


    **customary sinners** — Those habitually marked by sin, whom the passage explicitly does not exclude.'
- kind: resonances
  label: Resonances
  body: '**Mary and Martha, Luke 10:38–42:** The distinction between active and contemplative life recalls
    Martha’s service and Mary’s attentive presence at the Lord’s feet. Divergence: Luke does not formulate
    a technical eligibility rule for a specialized contemplative work.


    **Gregory the Great, Homilies on Ezekiel:** Gregory influentially distinguishes active and contemplative
    lives while treating contemplation as a higher orientation of repose in God. Divergence: Gregory more
    often presents the two lives as mutually related stages than this passage’s focused address suggests.


    **The Rule of St Benedict:** Benedictine spirituality joins renunciation, conversion of life, and
    grace rather than making past sin a final disqualification. Divergence: The Rule structures communal
    obedience and labor, whereas this passage brackets active life to identify contemplative practitioners.'
- kind: practice
  label: Practice
  body: Ask quietly whether your desire for God is a “true will,” without measuring yourself by your moral
    history or spiritual résumé. Name one attachment that scatters your heart, release it briefly into
    God’s care, and rest in a simple intention to seek God; then discern whether this practice is fittingly
    integrated with your actual duties rather than used to evade them.
