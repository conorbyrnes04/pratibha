unit_label: Softly and Sweetly
title: Softly and Sweetly
unit_type: reflection
commentary: 'This passage qualifies contemplative earnestness by refusing both bodily strain and emotional
  manufacture. Its repeated contrasts—“softly and quietly” against “impetuousness, violence, force, or
  boisterousness”—locate the danger not in desire for God itself but in the manner of pursuing it. The
  gloss on “Just” shifts attention to the will: the relevant work is an inward exercise, yet even the
  “superior will” must not be driven “overmuch.” “Rudely” names a forcible, sense-bound approach, especially
  the attempt to generate visible or felt devotion through the body. The instruction to love “softly and
  sweetly” therefore joins bodily composure to spiritual disposition; the “demure and amiable countenance”
  is neither mere etiquette nor a technique for obtaining consolation. It embodies a non-coercive love
  that does not confuse intensity, sensation, or physical exertion with contemplative truth.'
