- kind: key_terms
  label: Key Terms
  body: '**will** — The inward faculty whose directed exercise is central, but which must not be overstrained.


    **rudely** — Forcibly or through sense: a coarse, effortful manner of seeking God.


    **softly and sweetly** — The recommended quality of loving attention: gentle, unforced, and quiet.


    **devotion** — Affective or bodily fervor that should not be artificially raised by force.'
- kind: resonances
  label: Resonances
  body: '**The Rule of St Benedict:** Benedict commends prayer marked by humility and reverence rather
    than many words or display; both texts distrust strenuous self-assertion in devotion. Divergence:
    Benedict chiefly regulates communal monastic prayer, while this passage analyzes the inward and bodily
    manner of contemplative willing.


    **Julian of Norwich:** Julian repeatedly associates God’s work with courtesy, gentleness, and peace,
    resonating with this passage’s “softly and sweetly.” Divergence: Julian’s writings foreground visionary
    revelation and theological reassurance more explicitly than this practical warning against forcing
    devotion.


    **The Bhagavad Gita:** Its disciplined yoga avoids excess in bodily practice and treats steadiness
    as necessary for recollection. Divergence: The Gita frames discipline within a broader account of
    action, duty, and liberation, rather than this text’s specifically Christian loving will toward God.'
- kind: practice
  label: Practice
  body: Sit with an upright but unstrained body, noticing any effort to produce a devotional feeling.
    Let the intention to love God be simple and quiet; when the body tightens or the mind demands intensity,
    relax that force without abandoning the intention. End by allowing your face, breath, and posture
    to become “demure and amiable,” without treating this as a performance.
