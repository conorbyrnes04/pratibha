pratibha_layers:
- kind: translation
  label: Translation
  body: HE prosecuteth the matter of the preceding chapter, bidding one to proceed softly and quietly,
    avoiding impetuousness, violence, force, or boisterousness, especially in the body or sensuality.
    By Just he means the will, and by Justily he means an exercise of the will. By rudely he means forcibly
    or in sense. But learn, saith he, to love softly and sweetly, with a demure and amiable coun- tenance,
    as well in body as in soul. For a man must not use overmuch force in the exercise of his superior
    will, much less in seeking to raise devotion in the body.
- kind: commentary
