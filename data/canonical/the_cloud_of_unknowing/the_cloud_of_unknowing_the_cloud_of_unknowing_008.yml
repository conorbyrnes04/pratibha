- kind: key_terms
  label: Key Terms
  body: '**aspire towards God** — The deliberate inward turning that redirects attention from distracting
    thoughts toward God.


    **vehement and languishing desire** — An intense longing defined here as steadfast willing rather
    than emotional agitation.


    **superior will** — The higher, governing capacity that can choose God despite changing feelings and
    thoughts.


    **distractive thoughts** — Importune mental disturbances to be neglected rather than fought or followed.'
- kind: resonances
  label: Resonances
  body: '**The Cloud of Unknowing, the “cloud of forgetting”:** Both teach that creatures and thoughts
    are set aside so that the soul may be directed simply toward God. Divergence: This passage emphasizes
    perseverance of the will more than the specific imagery of casting things beneath a cloud of forgetting.


    **Evagrius Ponticus on logismoi:** Evagrius likewise treats intrusive thoughts as occasions for spiritual
    vigilance rather than as commands requiring consent. Divergence: Evagrius often classifies and analyzes
    particular thoughts, whereas this passage chiefly counsels neglect and aspiration.


    **John of the Cross, Dark Night:** John also detaches union with God from consoling feelings and urges
    fidelity through aridity and disturbance. Divergence: John frames the deprivation more explicitly
    as a purifying work of God; this passage foregrounds the will’s quiet determination.'
- kind: practice
  label: Practice
  body: Sit for a few minutes with a simple intention toward God, without trying to produce warmth, images,
    or special feeling. When a distracting thought insists on notice, do not debate it; quietly let it
    remain unfollowed and renew the inward determination to seek God. Measure the practice by return and
    steadiness, not by emotional calm.
