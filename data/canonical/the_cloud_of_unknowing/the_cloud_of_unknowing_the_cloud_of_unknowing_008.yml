unit_label: Quiet Resolve Beyond Distraction
title: Quiet Resolve Beyond Distraction
unit_type: reflection
commentary: 'The passage sharply distinguishes contemplative desire from emotional intensity. Its “vehement
  and languishing desire” is immediately protected from misunderstanding: it is not bodily feeling, sentimental
  warmth, sensual appetite, or an agitated love that produces inner turmoil. The author locates the decisive
  movement in the “superior will,” a faculty able to remain settled while thoughts press urgently for
  attention. The remedy is therefore neither argument with distractions nor anxiety about their presence,
  but neglect of them and renewed aspiration toward God. “Resolute” does not mean strained self-assertion;
  it means a stable refusal to abandon the search when difficulty arises. The climactic phrase, “for any
  difficulty whatsoever,” makes persistence the test of this desire. Distractive thoughts are named not
  as moral failure but as importunate interruptions whose force is answered by quiet, repeated orientation
  of the will.'
