pratibha_layers:
- kind: translation
  label: Translation
  body: HERE he prosecuteth the same subject and showeth that the remedy against these thoughts is to
    neglect them and aspire towards God. This aspiring he terms a very vehe- ment and languishing desire
    towards God. But you must not think that he means love of the heart or sensuality, or sensual desire,
    or any troublesome, unquiet love. He means a resolute and quiet determination of the superior will
    that will not give over seeking God for any difficulty whatsoever, and especially for any troublesome
    impor- tunity of distractive thoughts.
- kind: commentary
