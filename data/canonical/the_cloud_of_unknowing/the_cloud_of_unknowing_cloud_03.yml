unit_label: Nothing but a Naked Intent Stretching unto God
title: Nothing but a Naked Intent Stretching unto God
unit_type: sutra
sanskrit_devanagari: 'Bot now thou askest me and seiest: ''How schal I think on himself, and what is hee?''
  And to this I cannot answere thee bot thus: ''I wote never.'' For thou hast brought me with thi question
  into that same derknes, and into that same cloude of unknowyng that I wolde thou were in thiself.'
sanskrit_iast: Middle English (original language of the work).
translation_literal: 'But now you ask me and say, ''How shall I think on him, and what is he?'' And to
  this I can only answer thus: ''I do not know.'' For you have brought me with your question into that
  same darkness, and into that same cloud of unknowing, that I wish you were in.'
commentary: 'The author performs here what he refuses to explain: he enacts unknowing rather than describing
  it. When pressed to define the method of thinking on God—the ''how'' and the ''what''—he does not retreat
  into apology or defer to theology. Instead, he admits ''I wote never'' and, crucially, implicates the
  questioner in the same darkness. This is not evasion but contagion. The question itself becomes the
  vehicle; by asking, the reader has already entered the cloud. The discipline named in this chapter is
  not a technique to master but a mutual sinking into opacity that dissolves the distance between teacher
  and seeker, between knowing subject and unknowable object. The ''naked intent'' (naked of image, concept,
  sensory dress) can only be pointed toward by refusing all pointing—by saying ''I know not'' with such
  directness that the reader feels the ground of rational certainty give way. The cloud of unknowing is
  not a veil to penetrate but the very medium in which authentic longing moves. To think on God is to
  abandon the thought of thinking and to let the question itself become the prayer.


  Key Terms


  **cloud of unknowing** — The darkness of non-conceptual encounter with God, where rational knowledge
  is suspended and direct longing replaces discursive thought

  **naked intent** — The bare directedness of the will toward God, stripped of image, concept, and sensory
  mediation

  **I wote never** — The author''s refusal of knowledge-claims, enacted as contagious admission that draws
  the questioner into unknowing rather than explaining it


  Cross-Tradition Resonances


  **Pseudo-Dionysius, *Mystical Theology* I.1:** Both texts locate authentic encounter with the divine
  in darkness (*gnophos*) beyond conceptual knowledge, where negation becomes the path to union Divergence:
  Pseudo-Dionysius frames unknowing as apophatic theology—a systematic negation of all predicates; *Cloud*
  author enacts unknowing performatively, implicating the reader in contagion rather than instructing
  via negation

  **Meister Eckhart, *Sermon 52* (''Beati pauperes spiritu''):** Both emphasize radical poverty of spirit
  and abandonment of conceptual knowledge as prerequisite for divine encounter; both refuse to explain
  the method discursively Divergence: Eckhart grounds unknowing in the soul''s essential emptiness and
  detachment (*Gelassenheit*); *Cloud* author treats unknowing as relational—a mutual sinking that dissolves
  distance between seeker and sought

  **Dogen, *Shobogenzo* ''Genjokoan'':** Both reject the subject-object duality in spiritual practice;
  both suggest that the question or practice itself *is* the realization, not a means to it Divergence:
  Dogen articulates this through the non-duality of practice and enlightenment (*shugyo即satori*); *Cloud*
  author locates it in the affective nakedness of intent toward an other (God), preserving asymmetry'
insight: 'The author performs here what he refuses to explain: he enacts unknowing rather than describing
  it.'
practice: When someone asks you a question about ultimate things—God, meaning, the nature of consciousness—answer
  first with silence, then with 'I do not know,' and notice what shifts in your chest, your breath, your
  certainty. Repeat this refusal three times in a single conversation, each time without apology, and
  observe whether the not-knowing begins to feel less like failure and more like a threshold.
