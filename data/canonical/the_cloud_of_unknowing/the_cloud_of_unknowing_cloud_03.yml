work_title: The Cloud of Unknowing
unit_id: the_cloud_of_unknowing.cloud_03
unit_label: Nothing but a Naked Intent Stretching unto God
title: Nothing but a Naked Intent Stretching unto God
unit_type: sutra
sanskrit_devanagari: 'Bot now thou askest me and seiest: ''How schal I think on himself, and what is hee?'' And to this I
  cannot answere thee bot thus: ''I wote never.'' For thou hast brought me with thi question into that same derknes, and into
  that same cloude of unknowyng that I wolde thou were in thiself.'
sanskrit_iast: Middle English (original language of the work).
translation_literal: 'But now you ask me and say, ''How shall I think on himself, and what is he?'' And to this I can answer
  only thus: ''I know not.'' For you have brought me with your question into that same darkness, and into that same cloud
  of unknowing, that I would you were in yourself.'
commentary: 'The author performs here what he refuses to explain: he enacts unknowing rather than describing it. When pressed
  to define the method of thinking on God—the ''how'' and the ''what''—he does not retreat into apology or defer to theology.
  Instead, he admits ''I wote never'' and, crucially, implicates the questioner in the same darkness. This is not evasion
  but contagion. The question itself becomes the vehicle; by asking, the reader has already entered the cloud. The discipline
  named in this chapter is not a technique to master but a mutual sinking into opacity that dissolves the distance between
  teacher and seeker, between knowing subject and unknowable object. The ''naked intent'' (naked of image, concept, sensory
  dress) can only be pointed toward by refusing all pointing—by saying ''I know not'' with such directness that the reader
  feels the ground of rational certainty give way. The cloud of unknowing is not a veil to penetrate but the very medium in
  which authentic longing moves. To think on God is to abandon the thought of thinking and to let the question itself become
  the prayer.'
insight: 'The author performs here what he refuses to explain: he enacts unknowing rather than describing it.'
practice: When someone asks you a question about ultimate things—God, meaning, the nature of consciousness—answer first with
  silence, then with 'I do not know,' and notice what shifts in your chest, your breath, your certainty. Repeat this refusal
  three times in a single conversation, each time without apology, and observe whether the not-knowing begins to feel less
  like failure and more like a threshold.
