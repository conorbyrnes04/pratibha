  items:
  - term: cloud of unknowing
    definition: 'Middle English contemplative idiom → the dark between you and God where conceptual knowing of God fails and
      love pierces Here: '' For you have brought me with your question into that same darkness, and into that same cloud of
      unknowing, that I would you were in yourself. Trap: vague foggy mysticism without the disciplined ‘work’ of piercing
      love'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: nakid entent (naked intent)
    definition: 'ME ‘bare / naked intention’ → stripped willing toward God alone, without images or discursive props Here:
      Nothing but a Naked Intent Stretching unto God Nothing but a Naked Intent Stretching unto God Bot now thou askest me
      and seiest: ''How schal I think on himself,… Trap: willpower striving; misses the bareness of intention'
  - term: apophasis
    definition: 'ἀπόφασις ‘unsaying’ → approach to God by denying inadequate knowing—here practiced as cloud-work Here: ''
      For thou hast brought me with thi question into that same derknes, and into that same cloude of unknowyng that I wolde
      thou were in thiself. Trap: atheism or anti-intellectual pose'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: werk (work of contemplation)
    definition: 'ME werk → the specific contemplative labor of holding naked intent in the cloud Here: Middle English (original
