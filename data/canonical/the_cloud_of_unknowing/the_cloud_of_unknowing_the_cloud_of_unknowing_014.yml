pratibha_layers:
- kind: translation
  label: Translation
  body: 'THIS chapter containeth a still, quiet, and resigned manner of prayer in spirit. The matter can
    hardly be expressed better than the author himself hath here expressed it, although it seem somewhat
    obscure. He that should go about to expound it would prove obscurer. So fareth it about these Spiritual
    matters: if the text cannot be understood, then no more will the com- mentary be understood. Experience
    and nothing else will enable one to understand these and all other mystic writings.'
