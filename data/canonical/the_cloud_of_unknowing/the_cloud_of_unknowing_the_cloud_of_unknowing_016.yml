- kind: key_terms
  label: Key Terms
  body: '**extra- ordinary favours** — Exceptional spiritual consolations or graces, treated as gifts
    rather than the ultimate goal.


    **recklessness** — A freedom from possessive concern for spiritual experiences, not carelessness about
    God.


    **affection** — The will’s loving attachment, which should remain fixed on God himself.


    **graces and favours** — Received benefits that may aid devotion but must not replace the giver in
    the heart.'
- kind: resonances
  label: Resonances
  body: '**John of the Cross, The Dark Night:** John likewise warns against attachment to sensible consolations
    and urges desire for God beyond spiritual sweetness. Divergence: John develops a more extended account
    of purgation and divine deprivation than this brief counsel provides.


    **Meister Eckhart:** Eckhart’s language of detachment similarly seeks a heart free from clinging to
    created or experienced goods. Divergence: Eckhart often frames detachment through metaphysical and
    sermonic paradoxes, while this passage speaks directly of devotional favours.


    **Bhagavad Gita:** Its teaching of non-attachment to the fruits of action resembles refusing to make
    received benefits the object of desire. Divergence: The Gita chiefly addresses action and duty, whereas
    this passage concerns contemplative graces and love of God.'
- kind: practice
  label: Practice
  body: Before prayer, name one spiritual result you secretly hope to obtain—peace, warmth, clarity, reassurance—and
    release your claim to it. Rest the will in a simple intention toward God alone; if consolation comes,
    receive it without grasping, and if it does not, keep the same loving direction.
