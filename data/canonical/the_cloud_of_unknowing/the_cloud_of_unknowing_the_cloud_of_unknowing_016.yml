unit_label: Beyond Favours
title: Beyond Favours
unit_type: reflection
commentary: 'The passage distinguishes God from the consolations, illuminations, or exceptional graces
  associated with devotion. Its counsel is not contempt for such favours, nor denial that they may be
  gifts; rather, it targets the will’s tendency to fasten upon what is received instead of upon the giver.
  “Recklessness” names a deliberate spiritual non-possessiveness: one does not cultivate emotional dependence
  on sweetness, visions, or inward assurance. Affection is to remain “continually” directed toward God
  himself, whether favours are present or absent. This is a stringent test of intention. If desire rises
  or falls chiefly with extraordinary experience, the experience has become an object of attachment. The
  passage therefore protects apophatic prayer from becoming a search for religious sensation and directs
  the contemplative toward God, who exceeds every particular grace felt or imagined.'
