pratibha_layers:
- kind: translation
  label: Translation
  body: Ou, how clearly doth our author here deliver the true doctrine about the use of extra- ordinary
    favours! He adviseth that we. have a recklessness about those graces and favours. By this he means
    that we should have no affection towards them, but hold our affection continually only to God himself.
- kind: commentary
  label: Commentary
  body: 'The passage distinguishes God from the consolations, illuminations, or exceptional graces associated
    with devotion. Its counsel is not contempt for such favours, nor denial that they may be gifts; rather,
    it targets the will’s tendency to fasten upon what is received instead of upon the giver. “Recklessness”
    names a deliberate spiritual non-possessiveness: one does not cultivate emotional dependence on sweetness,
    visions, or inward assurance. Affection is to remain “continually” directed toward God himself, whether
    favours are present or absent. This is a stringent test of intention. If desire rises or falls chiefly
