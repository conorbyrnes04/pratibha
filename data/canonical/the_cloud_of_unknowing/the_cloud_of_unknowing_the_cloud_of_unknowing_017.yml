- kind: key_terms
  label: Key Terms
  body: '**abstraction** — A contemplative withdrawal of attention from creatures and concepts.


    **nowhere** — The soul’s nonspatial apprehension of its own being in abstraction.


    **nothing** — God’s incomparability with everything imagination or understanding can grasp.


    **all in all** — An affirmative naming of God as the cause and sustaining source of all things.'
- kind: resonances
  label: Resonances
  body: '**Pseudo-Dionysius, Mystical Theology:** Both speak of God through negation, beyond ordinary
    knowing and names. Divergence: Dionysius frames this chiefly as ascent beyond divine names, while
    this passage stresses the soul’s abstracted sight.


    **Meister Eckhart:** Eckhart also uses the language of nothingness to indicate God’s transcendence
    beyond creatures. Divergence: Eckhart’s speculative account of ground and being is more philosophically
    expansive than this practical contemplative explanation.


    **The Book of Exodus:** The divine name “I AM” resonates with the passage’s insistence that God is
    the cause of all other things. Divergence: Exodus gives a positive revelatory name, whereas this passage
    emphasizes God’s unlikeness to anything understood.'
- kind: practice
  label: Practice
  body: Sit quietly and notice the images, explanations, and objects that occupy attention. Without trying
    to destroy them, let them recede from the center, and turn the will toward God beyond every image;
    when “nothing” feels empty, remember that the passage means not absence but the One unlike all that
    can be imagined.
