pratibha_layers:
- kind: translation
  label: Translation
  body: THE nowhere and nought mentioned in this and the next chapter are but the state of. abstraction.
    For in this state of abstraction the soul seeth her own being nowhere and seeth the nothing of all
    other things. And this is the sight of God, so far as it may be had in this life. For all other things
    being removed out of the sight of the soul, nought remaineth in her sight but God, who is the foresaid
    nothing. God may be called nothing because he is none of all the things that we can imagine or understand;
    but in himself he is indeed as it were all in all, as being the cause of all other things.
- kind: commentary
  label: Commentary
  body: 'This passage defines “nowhere” and “nought” not as metaphysical nonexistence but as the contemplative
