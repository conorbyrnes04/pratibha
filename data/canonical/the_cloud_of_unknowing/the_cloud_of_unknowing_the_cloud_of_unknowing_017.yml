unit_label: The Holy Nowhere
title: The Holy Nowhere
unit_type: reflection
commentary: 'This passage defines “nowhere” and “nought” not as metaphysical nonexistence but as the contemplative
  condition of abstraction: the soul no longer locates its own being among ordinary objects or concepts,
  and it sees created things as “nothing” in comparison with God. The claim is carefully qualified by
  “so far as it may be had in this life”; this is not full possession or comprehension of God, but a present
  mode of sight achieved through removal. God is called “nothing” only apophatically—because no imaginable
  or intelligible thing can contain him. Yet the final clause prevents nihilism: God is “all in all” as
  the cause of everything else. The passage thus holds negation and affirmation together: creatures vanish
  from the soul’s focal field, while God exceeds every mental image without ceasing to be the source of
  being.'
