- kind: key_terms
  label: Key Terms
  body: '**distractive thoughts** — Mental disturbances treated here as connected to both inherited frailty
    and cultivated sinful habit.


    **original sin** — The inborn condition that supplies ongoing matter for temptation during life.


    **custom of sinning** — Repeated actual sin that strengthens later difficulty and peril.


    **ill habits** — Morally damaging dispositions accumulated through repeated sinful action.'
- kind: resonances
  label: Resonances
  body: '**Augustine, Confessions:** Augustine repeatedly portrays sin as becoming a habit that binds
    the will and makes freedom difficult. Divergence: Augustine gives an extended autobiographical and
    grace-centered account, while this passage offers a compressed distinction between sources of temptation.


    **Evagrius Ponticus, Praktikos:** Evagrius links recurring thoughts and temptations with entrenched
    passions requiring vigilant discernment. Divergence: Evagrius classifies tempting thoughts in a more
    systematic ascetical scheme than this passage does.'
- kind: practice
  label: Practice
  body: When a distracting or tempting thought arises, do not immediately identify it with your deepest
    will. Quietly ask whether it reflects ordinary human frailty or a pattern strengthened by repeated
    consent, then offer a simple intention toward God without arguing with the thought. At day’s end,
    notice one recurring habit and choose one small concrete act that weakens its hold.
