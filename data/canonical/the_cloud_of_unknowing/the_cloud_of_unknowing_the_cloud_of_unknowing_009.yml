unit_label: Habit and the Deeper Wound
title: Habit and the Deeper Wound
unit_type: reflection
commentary: 'This brief doctrinal diagnosis distinguishes inherited vulnerability from acquired bondage.
  “Original sin” remains a continuing condition of temptation throughout embodied life, yet the passage
  refuses to treat all inner disturbance as equally forceful. The more acute danger is the history a person
  has actively made: repeated consent to sin becomes “custom” and then an “ill habit,” giving particular
  motions and distractive thoughts a reinforced path in the soul. The point is neither fatalism nor mere
  moral bookkeeping. It directs attention to the practical weight of repetition: what is often chosen
  becomes more readily imagined, desired, and enacted. In the contemplative setting of the treatise, distraction
  is thus not simply an intellectual problem; it can bear the residue of formed desire. Still, the distinction
  leaves room for sobriety and compassion: temptation may persist without being identical to one’s deliberate
  acts, while repentance must address the habits that make certain temptations especially perilous.'
