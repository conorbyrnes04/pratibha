- kind: translation
  label: Pratibha Translation
  body: 'I also praise detachment above all mercifulness, for mercifulness is nothing other than a person
    going out of oneself toward a neighbor''s shortcomings, and through this the heart becomes troubled.
    Detachment stands free of this, remains in itself, and lets nothing trouble it — for as long as anything
    can trouble a person, things are not right with them. In short: when I regard all virtues, I find
    none so without defect and so joining us to God as detachment.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Mercy''s going-out is ethically precious and still, for Eckhart, a motion that can trouble the
    heart. The contested ranking does not abolish compassion; it refuses to let troubledness define the
    highest union. Detachment remains the unblemished joining-to-God because it does not exit into the
    neighbor''s wound as its occupying content. Existentially: help without letting the helping become
    the hinge''s swing.


    Key Terms


    **barmherzicheit (MHG)** — "mercy/compassion." Defined here as going-out that troubles the heart.


    **betrüeben (MHG)** — "to trouble/sadden." Diagnostic: if anything can still trouble you, detachment
    is incomplete.


    Cross-Tradition Resonances


    **Bodhicaryāvatāra (compassion without self-clinging):** Both want care without self-occupation.

    *Divergence:* Śāntideva intensifies compassion as the path; Eckhart subordinates troubled mercy to
    immovable detachment.


    **Aṣṭāvakra (equanimity amid the world''s play):** Both refuse being undone by circumstance.

    *Divergence:* Aṣṭāvakra''s equanimity is Self-recognition; Eckhart''s is readiness for God.'
