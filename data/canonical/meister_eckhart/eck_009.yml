source_reference: Meister Eckhart, *Von Abegescheidenheit* (§5 — above mercy)
sanskrit_devanagari: 'Ich lobe ouch abegescheidenheit vür alle barmherzicheit, wan barmherzicheit enist
  niht anders, wan daz der mensche ûz im selber gât ûf sînes ebenmenschen gebresten und dâ von sîn herze
  betrüebet wirt. Des stât abegescheidenheit ledic und blîbet in ir selber und lât sich kein dinc betrüeben;
  wan alle die wîle dehein dinc den menschen mac betrüeben, sô enist dem menschen niht reht. Kürzlîchen
  geredet: wenne ich alle tugende anesihe, sô envinde ich keine sô gar âne gebresten und ze gote zuovüegic,
  als abegescheidenheit ist.'
sanskrit_iast: See Original.
translation_literal: 'I also praise detachment above all mercifulness, for mercifulness is nothing other
  than a person going out of oneself toward a neighbor''s shortcomings, and through this the heart becomes
  troubled. Detachment stands free of this, remains in itself, and lets nothing trouble it — for as long
  as anything can trouble a person, things are not right with them. In short: when I regard all virtues,
  I find none so without defect and so joining us to God as detachment.'
commentary: 'Mercy''s going-out is ethically precious and still, for Eckhart, a motion that can trouble
  the heart. The contested ranking does not abolish compassion; it refuses to let troubledness define
  the highest union. Detachment remains the unblemished joining-to-God because it does not exit into the
  neighbor''s wound as its occupying content. Existentially: help without letting the helping become the
  hinge''s swing.


  Key Terms


  **barmherzicheit (MHG)** — "mercy/compassion." Defined here as going-out that troubles the heart.


  **betrüeben (MHG)** — "to trouble/sadden." Diagnostic: if anything can still trouble you, detachment
  is incomplete.


  Cross-Tradition Resonances


  **Bodhicaryāvatāra (compassion without self-clinging):** Both want care without self-occupation.

  *Divergence:* Śāntideva intensifies compassion as the path; Eckhart subordinates troubled mercy to immovable
  detachment.


  **Aṣṭāvakra (equanimity amid the world''s play):** Both refuse being undone by circumstance.

  *Divergence:* Aṣṭāvakra''s equanimity is Self-recognition; Eckhart''s is readiness for God.'
insight: Mercy's going-out is ethically precious and still, for Eckhart, a motion that can trouble the
  heart.
practice: 'Do one act of concrete help today. Afterward, sit one minute: did helping swing the hinge into
  troubledness? Return to remaining-within without withdrawing care.'
