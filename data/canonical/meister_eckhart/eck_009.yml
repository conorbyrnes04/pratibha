pratibha_translation: 'I also praise detachment above all mercifulness, for mercifulness is nothing other
  than a person going out of oneself toward a neighbor''s shortcomings, and through this the heart becomes
  troubled. Detachment stands free of this, remains in itself, and lets nothing trouble it — for as long
  as anything can trouble a person, things are not right with them. In short: when I regard all virtues,
  I find none so without defect and so joining us to God as detachment.'
abhyasa: 'When you feel your chest tighten or your thoughts scatter because of another person''s trouble,
  pause and notice: where has your center gone? Then, without withdrawing your care, find the still point
  within yourself that remains untouched—the ground beneath the trembling—and speak or act from there
  instead of from the disturbance.'
