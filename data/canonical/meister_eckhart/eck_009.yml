sanskrit_devanagari: 'Ich lobe ouch abegescheidenheit vür alle barmherzicheit, wan barmherzicheit enist
  niht anders, wan daz der mensche ûz im selber gât ûf sînes ebenmenschen gebresten und dâ von sîn herze
  betrüebet wirt. Des stât abegescheidenheit ledic und blîbet in ir selber und lât sich kein dinc betrüeben;
  wan alle die wîle dehein dinc den menschen mac betrüeben, sô enist dem menschen niht reht. Kürzlîchen
  geredet: wenne ich alle tugende anesihe, sô envinde ich keine sô gar âne gebresten und ze gote zuovüegic,
  als abegescheidenheit ist.'
sanskrit_iast: See Original.
translation_literal: 'I also praise detachment (abegescheidenheit) above all mercy, for mercy is nothing
  other than a person''s going out of himself toward the failings of his neighbor, and his heart being
  troubled by them. Detachment stays free of this: it remains within itself and lets nothing trouble it.
  For as long as anything can trouble a person, that person is not rightly ordered. Put briefly: when
  I survey all the virtues, I find none so utterly without flaw and so joining a person to God as detachment.'
commentary: 'This passage makes one of Eckhart''s most startling ranking-moves: he sets abegescheidenheit
  (detachment) above even mercy, the crown of the active virtues. His argument is precise and structural,
  not sentimental. Mercy, he says, is a movement of going-out (ûz im selber gât) — the self travels toward
  the neighbor''s need and is ''troubled'' (betrüebet) by it. That outward motion, however good, ties
  the soul''s inner state to something external and changeable. Detachment, by contrast, ''remains within
  itself'' (blîbet in ir selber). It is not the refusal to help but the refusal to be moved off its ground
  by what it helps. Eckhart''s criterion is telling: ''as long as anything can trouble a person, that
  person is not rightly ordered.'' The rightly ordered soul rests so wholly in the grunt (ground) where
  God dwells that no created thing has the leverage to disturb it. Notice he does not condemn mercy —
  he praises it. But mercy is derivative: it is what the detached soul does, whereas detachment is what
  the soul is. This connects to Eckhart''s larger teaching on the birth of the Word: an unstill soul,
  agitated by every neighbor''s wound, is not empty enough for God to be born in it. Detachment is the
  still, receptive interior that makes real, undisturbed love possible. Paradoxically, the most detached
  person may serve the neighbor better than the anxious helper, because their action flows from an unshakable
  center rather than from their own emotional turbulence. The ''flawlessness'' Eckhart attributes to detachment
  (âne gebresten) and its power of ''joining to God'' (ze gote zuovüegic) mark it as the virtue that requires
  nothing outside itself to complete it.


  Key Terms


  **abegescheidenheit** — detachment; the soul''s inner freedom that remains unmoved by created things
  and rests in its own ground.

  **barmherzicheit** — mercy; the outward movement toward a neighbor''s need, praised but ranked below
  detachment because it makes the soul dependent on the external.

  **betrüeben** — to trouble or disturb; Eckhart''s test of imperfection — anything that can disturb the
  soul shows it is not yet rightly ordered.'
insight: Mercy's going-out is ethically precious and still, for Eckhart, a motion that can trouble the
  heart.
practice: 'When you feel your chest tighten or your thoughts scatter because of another person''s trouble,
  pause and notice: where has your center gone? Then, without withdrawing your care, find the still point
  within yourself that remains untouched—the ground beneath the trembling—and speak or act from there
  instead of from the disturbance.'
