unit_label: Detachment Touches Nothingness
title: Detachment Touches Nothingness
unit_type: teaching_passage
thesis: >
  Detachment is nearer to nothingness than any other condition, and therefore
  only God — who is so simple and subtle that He alone can be contained in the
  detached heart — can enter it. Perfect detachment wills neither this nor that
  but simply to be — and even that willing falls away into a willingness to be
  nothing at all.
