pratibha_layers:
  - kind: original
    label: Original (Middle High German)
    body: >
      Nû ist abegescheidenheit dem nihte alsô nahen, daz kein dinc sô
      kleinfüege ist, daz ez sich enthalten müge in abegescheidenheit, denne
      alleine got. Der ist alsô einvaltic unde kleinfüege, daz er sich in dem
      abegescheidenen herzen wol enthalten mac. Dâ von ist abegescheidenheit
      nihtes enpfenclich denne gotes.

      Vollekomeniu abegescheidenheit enhât kein ûfsehen noch keine neigunge
      under keine crêatûre noch über keine crêatûre: si enwil noch unden noch
      obe sîn, si wil alsô stân vor ir selber, niemanne ze liebe noch ze
      leide, unde wil weder glîcheit noch unglîcheit noch diz noch daz mit
      keiner crêatûre haben, si enwil niht anders wan eine sîn. Daz si aber
      diz oder daz welle sîn, des enwil si niht. Wan wer wil diz oder daz
      sîn, der wil etwaz sîn; sô wil abegescheidenheit nihtes niht sîn. Dâ
      von stênt alliu dinc von ir unbeswæret.
  - kind: translation
    label: Pratibhā Translation
    body: >
      Now detachment is so near to nothingness that no thing is so subtle that
      it could be contained in detachment — except God alone. He is so simple
      and so subtle that He can well be contained in the detached heart.
      Therefore detachment is receptive to nothing except God.

      Perfect detachment has no looking-up and no inclination beneath any
      creature nor above any creature: it wills to be neither below nor above;
      it wills to stand thus before itself, for no one's pleasure nor for
      anyone's pain, and wills to have neither likeness nor unlikeness nor this
      nor that with any creature. It wills nothing other than to be one. But
      that it should will to be this or that — that it does not will. For
      whoever wills to be this or that wills to be something; but detachment
      wills to be nothing at all [nihtes niht]. Therefore all things stand
      unburdened by it.

      ⚠ UNCERTAINTY: "kleinfüege" — more tactile than "subtle," closer to
      "fine-grained" or "delicately fitted." "Einvaltic" = scholastic
      "simple" (non-composite). "Nihtes niht" = double negative intensifier,
      literally "nothing's nothing."
  - kind: commentary
    label: Pratibhā Commentary
    body: >
      Detachment touches nothingness so intimately that nothing can enter it
      except God, who alone is simple enough to fit. The logic is precise:
      detachment empties the heart of all creaturely content; but emptiness is
      not mere vacancy — it is a positive condition so fine-grained that only
      what is absolutely non-composite can pass through the aperture that
      detachment opens. God's simplicity is not a theological attribute but a
      structural requirement. The second move is more startling: perfect
      detachment wills only "eine sîn" — to be one. But even this willing is
      immediately corrected: whoever wills to be something wills to be
      something. Detachment wills "nihtes niht" — nothing at all. The double
      negative in MHG is ontological, not emphatic. Detachment is not the
      absence of content; it is the positive presence of an emptiness with no
      residual preference, not even the preference to be empty. All things
      stand "unbeswæret" — unburdened — because detachment exerts no force on
      anything, including itself.

      Here the Rhineland mystic meets the Spanda tradition at its most
      intimate register. Kṣemarāja's commentary on Spanda-kārikā 1.1
      describes the foundational throb (spanda) as neither activity nor
      inertivity but the pulsation between them — a dynamism so subtle it
      precedes preference. Eckhart's "nihtes niht" occupies the same
      structural position: it is not stillness opposing movement, nor
      emptiness opposing fullness, but the condition prior to that
      distinction. The soul that wills "nihtes niht" has not chosen emptiness
      over fullness — it has dropped below the threshold where choosing
      operates. This is why all things stand "unbeswæret" by it: detachment
      exerts no gravitational pull because there is no mass left to generate
      gravity. The instruction is not "empty yourself" (still an act of will,
      still "etwaz sîn") but rather: notice the point where willing itself
      becomes so fine it has no content. The will that wills nothing has not
      exerted itself; it has discovered its own transparency.
  - kind: key_terms
    label: Key Terms
    items:
      - term: nihte / nihtes niht (MHG)
        definition: >
          Nothingness / nothing at all. The double form "nihtes niht" is a
          genitive intensifier: "nothing of nothing," an emphatic absolute
          negation. In Eckhart's usage this is not privative (mere absence)
          but apophatic — a nothingness so complete it becomes a positive
          ontological condition, the only space fine enough to receive God's
          simplicity. Connects to the Latin nihil in Eckhart's own Latin
          works and to the Neoplatonic tradition of the One beyond being.
      - term: kleinfüege (MHG)
        definition: >
          Literally "fine-joined" or "small-fitted." Applied to God, it
          describes a simplicity so complete that it can pass through the
          finest aperture. The word carries a craftsman's connotation —
          something fitted with extreme precision — that the English
          "subtle" loses. In Eckhart's argument, God's kleinfüege is what
          allows Him alone to enter the detached heart: He passes where
          nothing else is fine enough to fit.
      - term: unbeswæret (MHG)
        definition: >
          Un-burdened, un-weighted, un-oppressed. From be-swæren (to weigh
          down, burden). Applied to "all things" in relation to detachment:
          creatures are not oppressed by the detached soul because it exerts
          no gravitational pull on them. This is the ethical corollary of
          metaphysical emptiness — the detached person burdens nothing, not
          because of moral restraint but because there is no remaining
          preference to generate pressure.
  - kind: resonances
    label: Cross-Tradition Resonances
    items:
      - citation: "Nāgārjuna, Mūlamadhyamakakārikā XXIV.18"
        resonance: >
          Nāgārjuna's equation of śūnyatā (emptiness) with pratītyasamutpāda
          (dependent origination) maps structurally onto Eckhart's argument
          that detachment's nothingness is not vacancy but a positive
          condition. Both thinkers insist that the most complete emptying is
          simultaneously the fullest reality — not "nothing is there" but
          "nothingness is the condition for anything to be there."
        divergence: >
          Nāgārjuna's emptiness is a feature of all phenomena universally;
          Eckhart's nothingness is a specifically achieved condition of the
          soul. For Nāgārjuna, you cannot not be empty; for Eckhart,
          detachment is a rare attainment. The structural insight is shared
          but the soteriological framing differs radically.
      - citation: "Vijñāna Bhairava Tantra, dhāraṇā 62 (VBT)"
        resonance: >
          VBT §62 instructs the practitioner to contemplate the void (śūnya)
          in all directions, until the mind itself becomes void. Eckhart's
          "nihtes niht" — the soul willing to be nothing at all — is a
          parallel practice instruction disguised as metaphysics. Both
          prescribe a progressive emptying that culminates in the emptiness
          of the emptier.
        divergence: >
          The VBT dhāraṇā is a meditative technique with explicit
          instructions; Eckhart's passage is a discursive argument that
          functions as implicit practice. The VBT assumes a practitioner
          who performs the contemplation; Eckhart describes a condition
          that, once achieved, has no practitioner left.
  - kind: practice
    label: Practice (Abhyāsa)
    body: >
      Notice any preference operating in you right now — not a dramatic desire
      but a subtle leaning: toward comfort over discomfort, toward knowing over
      not-knowing, toward being a certain kind of person. Do not try to
      dissolve the preference. Instead, find the point where the preference
      becomes so fine it has no content — where wanting to be this rather than
      that thins to the vanishing point. Rest there, in the place that has no
      preference even for its own emptiness.
