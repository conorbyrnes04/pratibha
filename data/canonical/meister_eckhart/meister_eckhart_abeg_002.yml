source_excerpt: >
  Nû ist abegescheidenheit dem nihte alsô nahen, daz kein dinc sô kleinfüege
  ist, daz ez sich enthalten müge in abegescheidenheit, denne alleine got. Der
  ist alsô einvaltic unde kleinfüege, daz er sich in dem abegescheidenen herzen
  wol enthalten mac. [...] Vollekomeniu abegescheidenheit enhât kein ûfsehen
  noch keine neigunge under keine crêatûre noch über keine crêatûre: si enwil
  noch unden noch obe sîn, si wil alsô stân vor ir selber, niemanne ze liebe
  noch ze leide, unde wil weder glîcheit noch unglîcheit noch diz noch daz mit
  keiner crêatûre haben, si enwil niht anders wan eine sîn. Daz si aber diz
  oder daz welle sîn, des enwil si niht. Wan wer wil diz oder daz sîn, der wil
  etwaz sîn; sô wil abegescheidenheit nihtes niht sîn. Dâ von stênt alliu dinc
  von ir unbeswæret.
translation_literal: >
  Now detachment is so near to nothingness [dem nihte] that no thing is so
  subtle [kleinfüege] that it could be contained in detachment — except God
  alone. He is so simple [einvaltic] and so subtle that He can well be
  contained in the detached heart. [...] Perfect detachment has no looking-up
  [ûfsehen] and no inclination [neigunge] beneath any creature nor above any
  creature: it wills to be neither below nor above; it wills to stand thus
  before itself, for no one's pleasure [ze liebe] nor for anyone's pain
  [ze leide], and wills to have neither likeness [glîcheit] nor unlikeness nor
  this nor that with any creature. It wills nothing other than to be one [eine
  sîn]. But that it should will to be this or that — that it does not will. For
  whoever wills to be this or that wills to be something [etwaz]; but
  detachment wills to be nothing at all [nihtes niht]. Therefore all things
  stand unburdened [unbeswæret] by it.

  ⚠ UNCERTAINTY: "kleinfüege" — literally "fine-jointed" or "subtly fitted";
  rendered "subtle" but the MHG carries a more tactile connotation of
  delicacy/fineness than English "subtle." "Einvaltic" — "simple" in the
  scholastic sense of non-composite, not "simple" as easy or unsophisticated.
  "Nihtes niht" — a double negative intensifier: literally "nothing's nothing"
  or "nothing at all of nothing." "Unbeswæret" — unburdened, unoppressed,
  unweighted; all things remain free of detachment's pressure because
  detachment exerts no gravitational pull on anything.
commentary: >
  This passage develops the most radical implication of the opening argument.
  Having established that detachment surpasses love, Eckhart now shows why:
  detachment touches nothingness (dem nihte) so intimately that nothing can
  enter it except God, who alone is simple enough to fit. The logic is precise:
  detachment empties the heart of all creaturely content; but emptiness is not
  mere vacancy — it is a positive condition so fine-grained that only what is
  absolutely non-composite can occupy it. God's simplicity (einvaltic) is thus
  not a theological attribute but a structural requirement: only the
  non-composite can pass through the aperture that detachment opens. The second
  move is even more startling. Perfect detachment wills neither to be above nor
  below any creature, neither like nor unlike, neither this nor that. It wills
  only "eine sîn" — to be one. But even this willing is immediately corrected:
  detachment does not will to be this or that, because whoever wills to be
  something wills to be something. Detachment wills "nihtes niht" — nothing at
  all. The double negative in MHG is not merely emphatic; it is ontological.
  Detachment is not the absence of content; it is the positive presence of an
  emptiness that has no residual preference, not even the preference to be
  empty. This is why "all things stand unburdened by it" — detachment exerts
  no force on anything, including itself.
insight: ''
practice: >
  Notice any preference operating in you right now — not a dramatic desire but
  a subtle leaning: toward comfort over discomfort, toward knowing over
  not-knowing, toward being a certain kind of person. Do not try to dissolve
  the preference. Instead, find the point where the preference becomes so
  fine it has no content — where wanting to be this rather than that thins
  to the vanishing point. Rest there, in the place that has no preference
  even for its own emptiness.
