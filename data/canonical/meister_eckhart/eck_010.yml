- kind: translation
  label: Pratibha Translation
  body: 'A master named Avicenna says: the nobility of a spirit that stands detached is so great that whatever it contemplates
    is true, whatever it desires is granted, and whatever it commands must be obeyed. Know this truly: when the free spirit
    stands in right detachment, it compels God to its being; and if it could stand formlessly and without all accidents, it
    would take on God''s property. But God can give that to no one but himself; therefore God can do no more for the detached
    spirit than give himself to it. And the person who stands in complete detachment is so carried into eternity that no transient
