reference: §6
source_reference: Meister Eckhart, *Von Abegescheidenheit* (§6 — Avicenna)
sanskrit_devanagari: 'Ein meister heizet Avicenna, der sprichet: des geistes, der abegescheiden stât,
  des adel ist alsô grôz, swaz er schouwet, daz ist wâr, und swes er begert, des ist er gewert, und swaz
  er gebiutet, des muoz man im gehôrsam sîn. Und solt daz wizzen vür wâr: swenne der vrîe geist stât in
  rehter abegescheidenheit, sô twinget er got ze sînem wesene; und möhte er gestân formelôsiclich und
  âne alle zuovelle, sô næme er gotes eigenschaft an sich. Daz enmac aber got niemanne geben dan im selber;
  dâ von enmac got niht mêr getuon dem abegescheidenen geiste, wan daz er sich selben im gibet. Und der
  mensche, der alsô stât in ganzer abegescheidenheit, der wirt alsô gezücket in die êwicheit, daz in kein
  zergenclich dinc bewegen enmac, daz er nihtes niht enpfindet, daz lîplich ist, und heizet der werlte
  tôt, wan im smacket niht, daz irdisch ist. Daz meinet sant Paulus, dô er sprach: ''ich lebe und lebe
  doch niht; Kristus lebet in mir''.'
sanskrit_iast: See Original.
translation_literal: 'A master named Avicenna says: the nobility of a spirit that stands detached is so
  great that whatever it contemplates is true, whatever it desires is granted, and whatever it commands
  must be obeyed. Know this truly: when the free spirit stands in right detachment, it compels God to
  its being; and if it could stand formlessly and without all accidents, it would take on God''s property.
  But God can give that to no one but himself; therefore God can do no more for the detached spirit than
  give himself to it. And the person who stands in complete detachment is so carried into eternity that
  no transient thing can move them, so that they feel nothing bodily, and are called dead to the world,
  for nothing earthly has savor. This is what Saint Paul meant: I live, and yet I do not; Christ lives
  in me.'
commentary: 'Detachment''s apex is not magical power but the limit of gift: God has nothing higher to
  give than God. Formlessness without accidents would be deity; grace gives the nearest possible — God''s
  self to the emptied spirit. "Dead to the world" is not misanthropy but loss of earthly savor as occupying
  lure. Existentially: stop asking God for secondary gifts as if they were the highest; ask whether you
  are empty enough to receive the Giver.


  Key Terms


  **vrîe geist (MHG)** — "free spirit." Not license; spirit freed of creaturely occupancy.


  **formelôsiclich (MHG)** — "formlessly." The asymptotic ideal; only God gives himself.


  **zergenclich (MHG)** — "transient." What can no longer move the detached.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Citi giving herself as the world):** Both climax in the Absolute''s self-gift.

  *Divergence:* Recognition reclaims authorship of appearance; Eckhart stresses gift to an emptied creature.


  **Plotinus VI.9 (union beyond form):** Both approach formlessness.

  *Divergence:* Plotinus''s One is beyond personal gift-language; Eckhart keeps Paul''s "Christ lives
  in me."'
insight: 'Detachment''s apex is not magical power but the limit of gift: God has nothing higher to give
  than God.'
practice: 'Name three secondary things you petition for (outcomes, consolations). For each, rewrite the
  petition as: "Give Yourself." Sit two minutes with that as the only request.'
