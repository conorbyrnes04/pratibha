pratibha_translation: 'A master named Avicenna says: the nobility of a spirit that stands detached is so great that whatever
  it contemplates is true, whatever it desires is granted, and whatever it commands must be obeyed. Know this truly: when
  the free spirit stands in right detachment, it compels God to its being; and if it could stand formlessly and without all
  accidents, it would take on God''s property. But God can give that to no one but himself; therefore God can do no more for
  the detached spirit than give himself to it. And the person who stands in complete detachment is so carried into eternity
  that no transient thing can move them, so that they feel nothing bodily, and are called dead to the world, for nothing earthly
  has savor. This is what Saint Paul meant: I live, and yet I do not; Christ lives in me.'
abhyasa: 'Take ten minutes and try one exercise in ''subtracting accidents.'' Sit quietly and notice the specific things you
  are asking of this moment — comfort, distraction, reassurance, a solution to some problem, even a spiritual experience.
