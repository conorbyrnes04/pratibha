source_reference: Meister Eckhart, *Von Abegescheidenheit* (§6 — Avicenna)
sanskrit_devanagari: 'Ein meister heizet Avicenna, der sprichet: des geistes, der abegescheiden stât, des adel ist alsô grôz,
  swaz er schouwet, daz ist wâr, und swes er begert, des ist er gewert, und swaz er gebiutet, des muoz man im gehôrsam sîn.
  Und solt daz wizzen vür wâr: swenne der vrîe geist stât in rehter abegescheidenheit, sô twinget er got ze sînem wesene;
  und möhte er gestân formelôsiclich und âne alle zuovelle, sô næme er gotes eigenschaft an sich. Daz enmac aber got niemanne
  geben dan im selber; dâ von enmac got niht mêr getuon dem abegescheidenen geiste, wan daz er sich selben im gibet. Und der
  mensche, der alsô stât in ganzer abegescheidenheit, der wirt alsô gezücket in die êwicheit, daz in kein zergenclich dinc
  bewegen enmac, daz er nihtes niht enpfindet, daz lîplich ist, und heizet der werlte tôt, wan im smacket niht, daz irdisch
  ist. Daz meinet sant Paulus, dô er sprach: ''ich lebe und lebe doch niht; Kristus lebet in mir''.'
sanskrit_iast: See Original.
translation_literal: 'There is a master named Avicenna who says: the nobility of the spirit that stands detached is so great
  that whatever it beholds is true, whatever it desires is granted, and whatever it commands must be obeyed. And you should
  know this for certain: when the free spirit stands in true abegescheidenheit (detachment), it compels God into its own being;
  and if it could stand formless and free of all accidents, it would take on God''s very own property. But this God can give
  to no one except himself; therefore God can do nothing more for the detached spirit than to give it his very self. And the
  person who stands like this in complete detachment is so caught up into eternity that no perishable thing can move him,
  so that he feels nothing that is bodily, and he is called dead to the world, for nothing earthly has any taste for him.
  This is what Saint Paul meant when he said: ''I live and yet I do not live; Christ lives in me.'''
commentary: 'This passage compresses the whole logic of Eckhart''s spirituality of detachment into a single startling claim:
  detachment does not earn God as a reward but leaves God nothing to give except himself. Eckhart borrows a line from Avicenna
  about the noble powers of the purified spirit, but he pushes it toward a specifically theological limit. The key move is
  the idea of the spirit standing ''formelôsiclich und âne alle zuovelle'' — formless and without accidents. In scholastic
  language, ''accidents'' are the incidental qualities that attach to a substance; a soul cluttered with creaturely attachments,
  images, and desires is a soul full of accidents. Strip these away and what remains is bare capacity, pure receptivity. And
  a bare capacity can only receive what matches it: God''s own naked being. This is why Eckhart says God ''can do nothing
  more'' for the detached spirit than give himself. It is not that God is stingy elsewhere and generous here; rather, the
  detached soul has emptied itself of everything smaller than God, so gifts short of God simply have no place to land. The
  provocative verb ''twinget'' (compels) is deliberate: Eckhart is not claiming the soul overpowers God, but that the ground
  of the soul, once truly emptied, so exactly corresponds to the ground of God that the divine self-gift becomes, as it were,
  necessary — God cannot withhold himself from a nothing that is perfectly conformed to receive him. The final turn to Paul''s
  ''I live and yet I do not live; Christ lives in me'' names the fruit: the human self that once organized experience around
  bodily and earthly goods has gone silent (''dead to the world''), and in that silence the birth of the Word (gebürt) takes
  over the living. Detachment is thus not an ascetic achievement displayed for its own sake but the clearing of a space in
  which the only thing that can happen is God happening.


  Key Terms


  **abegescheidenheit** — detachment — the state of a spirit released from creaturely attachments, images, and desires.

  **zuovelle** — accidents — the incidental, non-essential qualities clinging to the soul, which detachment strips away.

  **gebürt** — birth — the birth of the Word/Son in the emptied ground of the soul.'
insight: 'Detachment''s apex is not magical power but the limit of gift: God has nothing higher to give than God.'
practice: 'Take ten minutes and try one exercise in ''subtracting accidents.'' Sit quietly and notice the specific things
  you are asking of this moment — comfort, distraction, reassurance, a solution to some problem, even a spiritual experience.
  One by one, silently set each request down: not by fighting it, but by saying inwardly, ''I don''t need this to be given
  to me right now.'' Keep going until you notice the quiet fear that if you want nothing, you will get nothing. Stay with
  that emptiness a little longer than is comfortable. Eckhart''s point is that this apparent nothing is precisely the shape
  into which God gives himself. You are not trying to produce a feeling; you are practicing being a capacity that has stopped
  grasping at anything smaller than God.'
