source_excerpt: 'I ask here: what is the object of pure detachment? I answer: neither this nor that is
  the object of pure detachment. It stands upon a bare nothing [*blôzez niht*], and I will tell you why.
  Pure detachment stands upon the highest. Now that one stands upon the highest in whom God can work according
  to his whole will. And though God is almighty, he can work only as he finds readiness or makes it. I
  say ''or makes it'' because of Saint Paul: there God found no readiness, yet prepared him by pouring
  in grace. So God works according to the readiness he finds. His working differs in a human being and
  in a stone. Likeness from nature: heat a baking oven and put in doughs of oats, barley, rye, and whea'
translation_literal: 'So here I raise a question: what is the object of pure abegescheidenheit (detachment)?
  To this I answer and say that neither this nor that is the object of pure detachment. It rests on a
  bare nothing, and I will tell you why: pure detachment rests on what is highest. Now the one who stands
  on what is highest is the one in whom God can work according to his whole will. But God cannot work
  in every heart according to his whole will, for although God is almighty, he can still only work where
  he finds readiness, or makes it. And I say ''or makes it'' on account of Saint Paul, for in him God
  found no readiness, but he prepared Paul by pouring in his grace. So I say: God works according to the
  readiness he finds. His working is different in a human being than in a stone. We find an analogy for
  this in nature: when someone heats a baking oven and puts into it a dough of oats and one of barley
  and one of rye and one of wheat, there is only one heat in the oven, yet it does not work the same in
  all the doughs — one becomes fine bread, the second coarser, the third coarser still. And that is not
  the fault of the heat, it is the fault of the material, which is unequal. In the same way, God does
  not work the same in all hearts; he works according to the readiness and receptivity he finds. Now in
  whatever heart there is this or that, in that ''this or that'' there can be something on which God cannot
  work in the highest way. Therefore, if the heart is to have readiness for the very highest, it must
  rest on a bare nothing, and in this also lies the greatest possibility there can be. For since the detached
  heart stands on what is highest, it must stand on the nothing, because there the greatest receptivity
  is found. Take an analogy for this in nature. If I want to write on a wax tablet, then no matter how
  noble a thing may already be written on the tablet, it hinders me so that I cannot write there; and
  if I want to write well, I must erase and wipe out everything written on the tablet, and the tablet
  never serves me so well for writing as when nothing at all is written on it. In the same way: if God
  is to write in my heart in the very highest way, then everything that can be called this and that must
  come out of the heart, and thus stands the detached heart. Therefore God can work there in the very
  highest way and according to his supreme will. And so the object of the detached heart is neither this
  nor that.'
commentary: 'This passage stages detachment as a question about objects: what does pure abegescheidenheit
  look at, cling to, or aim at? Eckhart''s answer refuses every determinate content — ''neither this nor
  that'' — and locates detachment instead on ''a bare nothing'' (ein blôz niht). The move is precise and
  counterintuitive: the nothing is not deprivation but maximal capacity. Because detachment stands on
  ''the highest,'' and because ''this or that'' always introduces something particular that would limit
  God''s action, only an emptied heart offers unrestricted room for God to work ''according to his whole
  will.''


  The two analogies do complementary work. The oven shows that God''s uniform action (one heat) yields
  different results because of unequal material — the difference is not in God but in the receptivity
  of the recipient. This preserves both divine sovereignty and the reality of human preparation. Yet Eckhart
  immediately complicates simple self-help by invoking Paul: where readiness was absent, God ''made''
  it by pouring in grace. So preparation is real, but not purely our own achievement. The wax tablet then
  sharpens the point past mere improvement to erasure: even a ''noble'' thing already written obstructs
  the new writing. Any content, however good, is competition for the space God needs. The heart must be
  scraped clean.


  This is where Eckhart''s characteristic linking of the ground of God and the ground of the soul comes
  into view without being named. The ''highest'' place where God works his whole will is the point where
  the soul, stripped of its own particular contents, becomes pure receptivity — and pure receptivity mirrors
  the pure act of God. The nothing is not a void of despair but the site of the gebürt, the birth of the
  Word: God can ''write'' only on the blank tablet. Emptiness and fullness collapse into one another,
  which is the paradox at the heart of Eckhart''s mysticism: the greatest possibility (grœste mügelicheit)
  lies precisely in having no possessions of one''s own to defend.


  Key Terms


  **abegescheidenheit** — detachment; the soul''s release from all particular attachments so nothing is
  grasped or defended.

  **blôz niht** — bare nothing; not emptiness as lack but as the unrestricted openness in which God can
  act fully.

  **enpfenclicheit** — receptivity; the soul''s capacity to receive God''s work, maximized when it holds
  no content of its own.'
insight: ''
practice: 'Take a real wax-tablet exercise for the mind. Sit for ten minutes and notice each thought as
  it appears, then instead of following it or arguing with it, mentally ''wipe the tablet'' — let it be
  neither pursued nor pushed away, simply erased. Do this especially with your good thoughts: a satisfying
  plan, a clever insight, a virtuous intention. Eckhart''s point is that even noble writing must be cleared.
  Each time you catch the mind gripping ''this or that,'' return to the bare, contentless attention underneath.
  You are not trying to achieve a special experience; you are practicing being an unwritten surface, available.'
sanskrit_devanagari: 'Nû vrâge ich hie, waz der lûtern abegescheidenheit gegenwurf sî? Dar zuo antwürte
  ich alsô und spriche, daz weder diz noch daz ist der lûtern abegescheidenheit gegenwurf. Si stât ûf
  einem blôzen nihte, und sage dir, war umbe daz ist: diu lûteriu abegescheidenheit stât ûf dem hœhsten.
  Nû stât der ûf dem hœhsten, in dem got nâch allem sînem willen gewürken mac. Nû enmac got niht in allen
  herzen gewürken nâch allem sînem willen, wan swie daz sî, daz got almehtic ist, sô enmac er doch niht
  gewürken, wan als er bereitschaft vindet oder machet. Und spriche ich dar umbe ''oder machet'' von sant
  Paulus wegen, wan dâ envant er niht bereitschaft, aber er bereite in mit dem îngiezenne der gnâden.
  Dâ von spriche ich: got würket dar nâch, als er bereitschaft vindet. Sîn würken ist anders in dem menschen
  dan in dem steine. Des vinden wir ein glîchnisse in der natûre: sô man einen bakoven heizet und dar
  în leget einen teic von habern und einen von gersten und einen von roggen und einen von weizen, nû enist
  niht dan úin hitze in dem ovene und enwürket doch niht glîch in den teigen, wan der ein wirt schœne
  brôt, der ander wirt rûcher, der dritte noch rûcher. Und daz enist niht der hitze schult, ez ist der
  materien schult, diu dâ unglîch ist. Ze glîcher wîse sô enwürket got niht glîch in allen herzen; er
  würket dar nâch, als er bereitschaft und enpfenclicheit vindet. in welhem herzen ist nû diz oder daz,
  in dem ''diz oder daz'' mac etwaz sîn, daz got ûf daz hœhste niht gewürken enmac. Dâ von, sol daz herze
  bereitschaft haben ûf daz aller hœhste, sô muoz ez stân ûf einem blôzen nihte, und dar inne ist ouch
  diu grœste mügelicheit, diu gesîn mac. Wan nû daz abegescheiden herze stât ûf dem hœhsten, daz muoz
  sîn ûf dem nihte, wan dâ ist diu grœste enpfenclicheit inne. Des nim ein glîchnisse in der natûre. Wil
  ich schrîben an eine wehsîn taveln, sô enmac kein dinc sô edel gesîn, daz an der taveln geschriben stât,
  ez enirre mich, daz ich niht dar ane geschrîben enmac; und wil ich wol schrîben, sô muoz ich allez daz
  tilgen und tœten, daz an der taveln stât, und vüeget mir diu tavel niemer als wol ze schrîbenne, als
  sô nihtes niht an der tavel stât. Ze glîcher wîse: sol got in mîn herze schrîben ûf daz aller hœhste,
  sô muoz ûz dem herzen komen allez, daz diz und daz geheizen mac, und alsô stât daz abegescheiden herze.
  Dâ von sô mac got dâ gewürken ûf daz aller hœhste und nâch sînem obersten willen. Dâ von ist des abegescheidenen
  herzen gegenwurf weder diz noch daz.'
