section: DW I, Sermon 5b
sanskrit_devanagari: Got ist mir næher dan ich mir selber bin. Mîn wesen hât dâran, daz mir got næhe und gegenwertic ist.
sanskrit_iast: ''
translation_literal: God is nearer to me than I am to myself. My very being depends on God’s being near and present to me.
commentary: 'Eckhart’s claim is not chiefly about a feeling of divine intimacy. It is ontological: God is nearer than the
  self’s own self-possession because the creature does not stand in being independently and then acquire God as an additional
  object. Its being is continually received. “Near” therefore does not mean spatial proximity, nor merely inward psychological
  experience, but the sustaining presence without which the soul would not be. The saying prepares Eckhart’s teaching of the
  soul’s ground, where ordinary self-awareness, images, and possessions must be released. Yet it does not license self-deification:
  the creature remains creature, dependent at every moment upon the divine presence that gives it being.


  Key Terms


  **næher** — “Nearer,” denoting ontological intimacy rather than spatial location.

  **wesen** — “Being” or essence, indicating the creature’s dependent actuality.

  **gegenwertic** — “Present,” signifying God’s immediate sustaining presence.

  **Got** — “God,” the source in whose nearness creaturely being subsists.


  Cross-Tradition Resonances


  **Augustine, Confessions III.6.11:** Augustine calls God “more inward than my innermost self,” similarly locating divine
  presence beneath ordinary self-awareness. Divergence: Augustine frames this chiefly within the soul’s restless return to
  its Creator, while Eckhart stresses the ontological dependence of creaturely being itself.

  **Thomas Aquinas, Summa theologiae I, q. 8, a. 1:** Aquinas teaches that God is in all things by essence, presence, and
  power because all things require God’s continual causal presence to exist. Divergence: Aquinas presents this in the idiom
  of efficient causality and participation, whereas Eckhart’s formulation is more radically inward and existential.

  **Bhagavad Gītā 10.20:** Krishna declares, “I am the Self seated in the hearts of all beings,” offering a parallel image
  of ultimacy as more intimate than external objecthood. Divergence: The Gītā’s statement belongs to a discourse of divine
  self-manifestation and can support nondual readings, while Eckhart retains the creature’s received being from God.'
practice: 'Sit quietly for ten minutes. With each exhalation, release one self-description—role, success, failure, memory,
  fear. Do not seek an image of God. Gently return to the question: “What remains when I do not hold myself up?” Rest in receptive
  attention rather than trying to produce an answer.'
