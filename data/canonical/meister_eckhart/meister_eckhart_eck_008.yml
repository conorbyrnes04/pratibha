section: DW I, Sermon 5b
sanskrit_devanagari: Got ist mir næher dan ich mir selber bin. Mîn wesen hât dâran, daz mir got næhe und gegenwertic ist.
sanskrit_iast: ''
translation_literal: God is nearer to me than I am to myself. My very being depends on God’s being near and present to me.
commentary: 'Eckhart’s claim is not chiefly about a feeling of divine intimacy. It is ontological: God is nearer than the
  self’s own self-possession because the creature does not stand in being independently and then acquire God as an additional
  object. Its being is continually received. “Near” therefore does not mean spatial proximity, nor merely inward psychological
  experience, but the sustaining presence without which the soul would not be. The saying prepares Eckhart’s teaching of the
  soul’s ground, where ordinary self-awareness, images, and possessions must be released. Yet it does not license self-deification:
  the creature remains creature, dependent at every moment upon the divine presence that gives it being.


  Key Terms


  **næher** — “Nearer,” a comparative denying that God is merely one being alongside the self.

  **wesen** — “Being” or “essence,” here the creature’s dependent actuality.

  **næhe** — “Nearness,” signifying non-spatial divine immediacy.

  **gegenwertic** — “Present,” indicating God’s sustaining presence rather than a passing experience.


  Cross-Tradition Resonances


  **Augustine, Confessions III.6.11:** Augustine names God as “more inward than my inmost self,” closely anticipating Eckhart’s
  claim that divine presence exceeds self-possession in intimacy.

  **Augustine, Confessions III.6.11:**  Divergence: Augustine frames this chiefly through the soul’s discovery of its Creator,
  whereas Eckhart’s formulation sharply foregrounds the creature’s being as continuously dependent on divine presence.

  **Qur’an 50:16:** The Qur’an declares that God is nearer to the human than the jugular vein, offering a powerful image of
  divine proximity beyond ordinary spatial distance.'
practice: 'Sit quietly for ten minutes. With each exhalation, release one self-description—role, success, failure, memory,
  fear. Do not seek an image of God. Gently return to the question: “What remains when I do not hold myself up?” Rest in receptive
  attention rather than trying to produce an answer.'
