source_excerpt: 'I ask here: what is the object of pure detachment? I answer: neither this nor that is the object of pure
  detachment. It stands upon a bare nothing [*blôzez niht*], and I will tell you why. Pure detachment stands upon the highest.
  Now that one stands upon the highest in whom God can work according to his whole will. And though God is almighty, he can
  work only as he finds readiness or makes it. I say ''or makes it'' because of Saint Paul: there God found no readiness,
  yet prepared him by pouring in grace. So God works according to the readiness he finds. His working differs in a human being
  and in a stone. Likeness from nature: heat a baking oven and put in doughs of oats, barley, rye, and whea'
translation_literal: 'I ask here: what is the object of pure detachment? I answer: neither this nor that is the object of
  pure detachment. It stands upon a bare nothing [*blôzez niht*], and I will tell you why. Pure detachment stands upon the
  highest. Now that one stands upon the highest in whom God can work according to his whole will. And though God is almighty,
  he can work only as he finds readiness or makes it. I say ''or makes it'' because of Saint Paul: there God found no readiness,
  yet prepared him by pouring in grace. So God works according to the readiness he finds. His working differs in a human being
  and in a stone. Likeness from nature: heat a baking oven and put in doughs of oats, barley, rye, and wheat — one heat, yet
  unequal loaves, and the fault is not the heat''s but the matter''s. Likewise God does not work equally in all hearts; he
  works as he finds readiness and receptivity. Wherever a heart holds this or that, something in that this-or-that can keep
  God from working at the highest. Therefore if the heart is to be ready for the highest, it must stand upon a bare nothing
  — and therein lies the greatest possibility there can be. Will I write on a wax tablet, nothing already written there —
  however noble — fails to hinder me; if I would write well, I must erase everything, and the tablet never suits writing so
  well as when nothing at all stands on it. Just so: if God is to write in my heart at the highest, everything that can be
  called this and that must leave the heart. So stands the detached heart. Therefore God can work there at the highest and
  according to his uppermost will. Therefore the object of the detached heart is neither this nor that.'
commentary: 'The treatise culminates in a metaphysics of readiness. Omnipotence does not cancel the need for a fitting receptacle;
  God works as readiness allows — or as grace creates readiness (Paul). The oven and wax tablet images make the same point:
  unequal results are often the matter''s density, not the heat''s failure. *Blôzez niht* is not despairing void but maximal
  capacity — the greatest *mügelicheit* (possibility). The contested spiritual consumerism of filling the heart with holy
  this-and-that (images, techniques, identities) is inverted: the highest object is no object. Existentially: erase one noble
  inscription you keep polishing — a spiritual self-image, a preferred consolation — and leave the tablet blank for an hour.


  Key Terms


  **blôzez niht (MHG)** — "bare / naked nothing." The objectless ground of detachment; not absence as lack but absence as
  capacity.


  **bereitschaft / enpfenclicheit (MHG)** — "readiness / receptivity." Conditions of divine working in the heart.


  **diz noch daz (MHG)** — "neither this nor that." Refusal of every determinate content as the heart''s occupying object.


  Cross-Tradition Resonances


  **Māṇḍūkya Upaniṣad / Gauḍapāda (turīya beyond waking-dream-sleep contents):** Both point beyond all determinate states
  to a ground that is not another content.

  *Divergence:* Turīya is articulated within an Indic fourfold; Eckhart''s bare nothing is the Christian heart cleared for
  God''s writing.


  **Pratyabhijñāhṛdayam (Citi resting as herself):** Both end in a state where the Absolute is not an object among objects.

  *Divergence:* Recognition reclaims authorship of appearance; Eckhart''s blank tablet awaits God''s inscription by grace.'
insight: ''
practice: Choose one cherished mental inscription (a plan, grievance, spiritual identity). For fifteen minutes, each time
  it appears, mentally wipe the tablet clean. Do not replace it with a better inscription. End by sitting one minute with
  nothing written.
sanskrit_devanagari: 'Nû vrâge ich hie, waz der lûtern abegescheidenheit gegenwurf sî? Dar zuo antwürte ich alsô und spriche,
  daz weder diz noch daz ist der lûtern abegescheidenheit gegenwurf. Si stât ûf einem blôzen nihte, und sage dir, war umbe
  daz ist: diu lûteriu abegescheidenheit stât ûf dem hœhsten. Nû stât der ûf dem hœhsten, in dem got nâch allem sînem willen
  gewürken mac. Nû enmac got niht in allen herzen gewürken nâch allem sînem willen, wan swie daz sî, daz got almehtic ist,
  sô enmac er doch niht gewürken, wan als er bereitschaft vindet oder machet. Und spriche ich dar umbe ''oder machet'' von
  sant Paulus wegen, wan dâ envant er niht bereitschaft, aber er bereite in mit dem îngiezenne der gnâden. Dâ von spriche
  ich: got würket dar nâch, als er bereitschaft vindet. Sîn würken ist anders in dem menschen dan in dem steine. Des vinden
  wir ein glîchnisse in der natûre: sô man einen bakoven heizet und dar în leget einen teic von habern und einen von gersten
  und einen von roggen und einen von weizen, nû enist niht dan úin hitze in dem ovene und enwürket doch niht glîch in den
  teigen, wan der ein wirt schœne brôt, der ander wirt rûcher, der dritte noch rûcher. Und daz enist niht der hitze schult,
  ez ist der materien schult, diu dâ unglîch ist. Ze glîcher wîse sô enwürket got niht glîch in allen herzen; er würket dar
  nâch, als er bereitschaft und enpfenclicheit vindet. in welhem herzen ist nû diz oder daz, in dem ''diz oder daz'' mac etwaz
  sîn, daz got ûf daz hœhste niht gewürken enmac. Dâ von, sol daz herze bereitschaft haben ûf daz aller hœhste, sô muoz ez
  stân ûf einem blôzen nihte, und dar inne ist ouch diu grœste mügelicheit, diu gesîn mac. Wan nû daz abegescheiden herze
  stât ûf dem hœhsten, daz muoz sîn ûf dem nihte, wan dâ ist diu grœste enpfenclicheit inne. Des nim ein glîchnisse in der
  natûre. Wil ich schrîben an eine wehsîn taveln, sô enmac kein dinc sô edel gesîn, daz an der taveln geschriben stât, ez
  enirre mich, daz ich niht dar ane geschrîben enmac; und wil ich wol schrîben, sô muoz ich allez daz tilgen und tœten, daz
  an der taveln stât, und vüeget mir diu tavel niemer als wol ze schrîbenne, als sô nihtes niht an der tavel stât. Ze glîcher
  wîse: sol got in mîn herze schrîben ûf daz aller hœhste, sô muoz ûz dem herzen komen allez, daz diz und daz geheizen mac,
  und alsô stât daz abegescheiden herze. Dâ von sô mac got dâ gewürken ûf daz aller hœhste und nâch sînem obersten willen.
  Dâ von ist des abegescheidenen herzen gegenwurf weder diz noch daz.'
