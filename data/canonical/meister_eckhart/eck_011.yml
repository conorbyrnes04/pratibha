sanskrit_devanagari: 'Nû vrâge ich aber: waz ist des abegescheidenen herzen gebet? Des antwürte ich alsô
  und spriche, daz abegescheideniu lûterkeit enkan niht beten, wan swer betet, der begert etwaz von gote,
  daz im werde, oder begert aber, daz im got etwaz abeneme. Nû enbegert daz abegescheiden herze nihtes
  niht, ez enhât ouch nihtes niht, des ez gerne ledic wære. Dar umbe sô stât ez ledic alles gebetes und
  enist sîn gebet niht anders dan einförmic sîn mit gote. Dar ûf stât allez sîn gebet. Von disem sinne
  mügen wir nemen daz wort, daz sant Dionysius sprichet über daz wort sant Pauls, dâ er sprichet: ''ir
  sint vil, die alle loufent nâch der krône und enwirt doch niht dan einem'' - alle krefte der sêle loufent
  nâch der krône und enwirt doch aleine dem wesene - hie sprichet Dionysius: der louf enist niht anders
  dan ein abekêren von allen crêatûren und sich vereinigen in die ungeschaffenheit. Und sô diu sêle dâ
  zuo kumet, sô verliuset si irn namen und ziuhet sie got in sich, daz si an ir selber ze nihte wirt,
  als diu sunne daz morgenrôt an sich ziuhet, daz ez ze nihte wirt. Dâ zuo enbringet den menschen kein
  dinc dan lûteriu abegescheidenheit. Dâ zuo mügen wir ouch nemen daz wort, daz Augustînus sprichet: diu
  sêle hât einen heimlîchen înganc in götlîche natûre, dâ ir alliu dinc ze nihte werdent. Dirre înganc
  enist ûf ertrîche niht anders dan lûteriu abegescheidenheit. Und sô diu abegescheidenheit kumet ûf daz
  hœhste, sô wirt si von bekennenne kennelôs und von minne minnelôs und von liehte vinster. Dâ von mügen
  wir ouch nemen, daz ein meister sprichet: die armen des geistes sint die, die gote alliu dinc gelâzen
  hânt, als er sie hâte, dô wir niht enwâren. Diz enmac nieman getuon wan ein lûter abegescheiden herze.
  Daz got in einem abegescheidenen herzen lieber sî dan in allen herzen, daz merken wir dar ane, wan vrâgest
  dû mich: waz suochet got in allen dingen?, sô antwürte ich dir ûz dem buoche der wîsheit; dâ sprichet
  er: ''in allen dingen suoche ich ruowe!'' Sô enist niendert ganziu ruowe dan aleine in dem abegescheidenen
  herzen. Dâ von ist got lieber dâ dan in andern tugenden oder in deheinen dingen. Ouch solt dû wizzen:
  ie mê sich der mensche dar ûf setzet, daz er enpfenclich sî des götlî'
sanskrit_iast: See Original.
translation_literal: 'I ask again: what is the prayer of the detached heart? Detached purity cannot pray
  in the ordinary sense, for whoever prays desires something from God to be given, or desires God to take
  something away. The detached heart desires nothing, and has nothing it would gladly be rid of. Therefore
  it stands free of all prayer, and its prayer is nothing other than being one-formed [*einförmic*] with
  God — that is its whole prayer. Dionysius on Paul''s race for the crown: the run is nothing but turning
  from all creatures and uniting into the Uncreated. When the soul comes there, it loses its name and
  God draws it into himself so that it becomes nothing in itself, as the sun draws dawn into itself so
  that dawn becomes nothing. Nothing brings a person there but pure detachment. Augustine: the soul has
  a secret entrance into divine nature where all things become nothing to it — and on earth that entrance
  is pure detachment. When detachment reaches the highest, it becomes knowingless from knowing, loveless
  from love, and dark from light. The poor in spirit are those who have left all things to God as he had
  them when we were not. Only a pure detached heart can do this.'
commentary: 'Ordinary prayer is desire-shaped (give me / take from me). Detachment''s prayer is identity-shaped:
  one-form with God. The Dionysian and Augustinian citations map the same vanishing of the soul''s separate
  name. The paradox of knowingless knowing and loveless love marks the summit where faculties empty into
  their ground. Existentially: notice when prayer is still bargaining; practice a minute of prayer that
  asks for nothing and releases nothing — only one-form.


  Key Terms


  **einförmic (MHG)** — "one-formed / uniform with." Not imitation of virtues but formal unity.


  **ungeschaffenheit (MHG)** — "uncreatedness." Destination of the soul''s turning-away from creatures.


  **armuot des geistes (MHG)** — "poverty of spirit." Leaving things to God as before we were.


  Cross-Tradition Resonances


  **Tao Te Ching (wu-wei / desirelessness):** Both empty striving.

  *Divergence:* Daoist emptiness is cosmic ease; Eckhart''s empties into personal divine unity.


  **Heart Sūtra (form is emptiness):** Both dissolve graspable contents.

  *Divergence:* The Heart Sūtra''s emptiness is dependent-marklessness; Eckhart''s is readiness for God''s
  drawing-in.'
insight: Ordinary prayer is desire-shaped (give me / take from me).
practice: Sit five minutes. Do not ask for anything. Do not ask for relief from anything. Rest as one-formed
  availability. If bargaining language arises, drop it without replacing it.
