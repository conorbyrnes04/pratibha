- kind: commentary
  label: Pratibha Commentary
  body: 'Ordinary prayer is desire-shaped (give me / take from me). Detachment''s prayer is identity-shaped: one-form with
    God. The Dionysian and Augustinian citations map the same vanishing of the soul''s separate name. The paradox of knowingless
    knowing and loveless love marks the summit where faculties empty into their ground. Existentially: notice when prayer
    is still bargaining; practice a minute of prayer that asks for nothing and releases nothing — only one-form.


    Key Terms


    **einförmic (MHG)** — "one-formed / uniform with." Not imitation of virtues but formal unity.


    **ungeschaffenheit (MHG)** — "uncreatedness." Destination of the soul''s turning-away from creatures.


    **armuot des geistes (MHG)** — "poverty of spirit." Leaving things to God as before we were.


    Cross-Tradition Resonances


    **Tao Te Ching (wu-wei / desirelessness):** Both empty striving.

    *Divergence:* Daoist emptiness is cosmic ease; Eckhart''s empties into personal divine unity.


    **Heart Sūtra (form is emptiness):** Both dissolve graspable contents.

    *Divergence:* The Heart Sūtra''s emptiness is dependent-marklessness; Eckhart''s is readiness for God''s drawing-in.'
- kind: key_terms
  label: Key Terms
  items:
  - term: abegescheidenheit (MHG)
    definition: 'abe (‘off’) + scheiden (‘separate’) + abstract noun → standing free of creatures so nothing created occupies
      the receptive place Here: The Detached Heart''s Prayer Is to Be One-Formed with God The Detached Heart''s Prayer Is
      to Be One-Formed with God Nû vrâge ich aber: waz ist des abegescheidene… Trap: Stoic coolness or emotional numbness;
      underplays nearness to niht (nothingness)'
    lemma_id: gelassenheit
    sense_id: gelassenheit.eckhart
  - term: niht / nothing (MHG)
    definition: '‘nothing’ → creaturely emptiness that is the condition for divine in-birth Here: The detached heart desires
      nothing, and has nothing it would gladly be rid of. Trap: nihilism; missing that nothingness is receptive, not annihilative
      only'
  - term: lûter (pure)
    definition: '‘pure, clear, unmixed’ → undiluted detachment that smuggles no creaturely looking-to Here: Nothing brings
      a person there but pure detachment. Trap: moral purity culture'
  - term: Gelassenheit
    definition: 'from lassen ‘to let / leave’ → releasement of possessiveness so God can be born in the soul Here: Existentially:
      notice when prayer is still bargaining; practice a minute of prayer that asks for nothing and releases nothing — only
      one-form. Trap: apathy, grit rebranded, quietism without love'
    lemma_id: gelassenheit
    sense_id: gelassenheit.eckhart
  - term: grunt (ground)
    definition: 'MHG grunt ‘ground, bottom’ → the soul’s ground identical in operation with God’s ground—birthplace of the
      Word Here: The paradox of knowingless knowing and loveless love marks the summit where faculties empty into their ground.
      Trap: psychological ‘core self’ without Eckhart’s birth-of-God claim'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice
  body: Sit five minutes. Do not ask for anything. Do not ask for relief from anything. Rest as one-formed availability. If
    bargaining language arises, drop it without replacing it.
