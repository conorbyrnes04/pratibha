pratibha_translation: 'I ask again: what is the prayer of the detached heart? Detached purity cannot pray in the ordinary
  sense, for whoever prays desires something from God to be given, or desires God to take something away. The detached heart
  desires nothing, and has nothing it would gladly be rid of. Therefore it stands free of all prayer, and its prayer is nothing
  other than being one-formed [*einförmic*] with God — that is its whole prayer. Dionysius on Paul''s race for the crown:
  the run is nothing but turning from all creatures and uniting into the Uncreated. When the soul comes there, it loses its
  name and God draws it into himself so that it becomes nothing in itself, as the sun draws dawn into itself so that dawn
  becomes nothing. Nothing brings a person there but pure detachment. Augustine: the soul has a secret entrance into divine
  nature where all things become nothing to it — and on earth that entrance is pure detachment. When detachment reaches the
  highest, it becomes knowingless from knowing, loveless from love, and dark from light. The poor in spirit are those who
  have left all things to God as he had them when we were not. Only a pure detached heart can do this.'
