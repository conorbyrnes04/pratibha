  label: Pratibha Translation
  body: 'I ask again: what is the prayer of the detached heart? Detached purity cannot pray in the ordinary sense, for whoever
    prays desires something from God to be given, or desires God to take something away. The detached heart desires nothing,
    and has nothing it would gladly be rid of. Therefore it stands free of all prayer, and its prayer is nothing other than
    being one-formed [*einförmic*] with God — that is its whole prayer. Dionysius on Paul''s race for the crown: the run is
