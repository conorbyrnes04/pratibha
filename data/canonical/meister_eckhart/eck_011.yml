sanskrit_devanagari: 'Nû vrâge ich aber: waz ist des abegescheidenen herzen gebet? Des antwürte ich alsô und spriche, daz
  abegescheideniu lûterkeit enkan niht beten, wan swer betet, der begert etwaz von gote, daz im werde, oder begert aber, daz
  im got etwaz abeneme. Nû enbegert daz abegescheiden herze nihtes niht, ez enhât ouch nihtes niht, des ez gerne ledic wære.
  Dar umbe sô stât ez ledic alles gebetes und enist sîn gebet niht anders dan einförmic sîn mit gote. Dar ûf stât allez sîn
  gebet. Von disem sinne mügen wir nemen daz wort, daz sant Dionysius sprichet über daz wort sant Pauls, dâ er sprichet: ''ir
  sint vil, die alle loufent nâch der krône und enwirt doch niht dan einem'' - alle krefte der sêle loufent nâch der krône
  und enwirt doch aleine dem wesene - hie sprichet Dionysius: der louf enist niht anders dan ein abekêren von allen crêatûren
  und sich vereinigen in die ungeschaffenheit. Und sô diu sêle dâ zuo kumet, sô verliuset si irn namen und ziuhet sie got
  in sich, daz si an ir selber ze nihte wirt, als diu sunne daz morgenrôt an sich ziuhet, daz ez ze nihte wirt. Dâ zuo enbringet
  den menschen kein dinc dan lûteriu abegescheidenheit. Dâ zuo mügen wir ouch nemen daz wort, daz Augustînus sprichet: diu
  sêle hât einen heimlîchen înganc in götlîche natûre, dâ ir alliu dinc ze nihte werdent. Dirre înganc enist ûf ertrîche niht
  anders dan lûteriu abegescheidenheit. Und sô diu abegescheidenheit kumet ûf daz hœhste, sô wirt si von bekennenne kennelôs
  und von minne minnelôs und von liehte vinster. Dâ von mügen wir ouch nemen, daz ein meister sprichet: die armen des geistes
  sint die, die gote alliu dinc gelâzen hânt, als er sie hâte, dô wir niht enwâren. Diz enmac nieman getuon wan ein lûter
  abegescheiden herze. Daz got in einem abegescheidenen herzen lieber sî dan in allen herzen, daz merken wir dar ane, wan
  vrâgest dû mich: waz suochet got in allen dingen?, sô antwürte ich dir ûz dem buoche der wîsheit; dâ sprichet er: ''in allen
  dingen suoche ich ruowe!'' Sô enist niendert ganziu ruowe dan aleine in dem abegescheidenen herzen. Dâ von ist got lieber
  dâ dan in andern tugenden oder in deheinen dingen. Ouch solt dû wizzen: ie mê sich der mensche dar ûf setzet, daz er enpfenclich
  sî des götlî'
sanskrit_iast: See Original.
translation_literal: 'Now I ask again: what is the prayer of the detached heart? To this I answer and say that detached purity
  cannot pray, for whoever prays wants something from God to be given to him, or else wants God to take something away from
  him. But the detached heart wants nothing at all, and it has nothing at all that it would gladly be rid of. Therefore it
  stands free of all prayer, and its prayer is nothing other than to be one-formed with God. On this its whole prayer rests.
  From this understanding we may take the saying that Saint Dionysius speaks concerning the word of Saint Paul, where he says:
  ''There are many who all run after the crown, yet it is given to only one'' — all the powers of the soul run after the crown,
  yet it is given to the being (wesen) alone. Here Dionysius says: this running is nothing other than a turning away from
  all creatures and uniting oneself into the uncreatedness. And when the soul reaches that point, it loses its name, and God
  draws it into himself, so that in itself it becomes nothing — as the sun draws the dawn''s red into itself so that it becomes
  nothing. Nothing brings a person to this except pure detachment (abegescheidenheit). To this we may also apply the word
  Augustine speaks: the soul has a hidden entrance into the divine nature, where all things become nothing to it. On earth
  this entrance is nothing other than pure detachment. And when detachment rises to its highest, it becomes, through knowing,
  without knowledge, and through love, loveless, and through light, dark. From this we may also take what a master says: the
  poor in spirit are those who have left all things to God, as he had them when we were not yet. This no one can do except
  a pure, detached heart. That God is dearer in a detached heart than in all hearts, we may recognize from this: if you ask
  me, what does God seek in all things?, then I answer you out of the book of Wisdom, where he says: ''In all things I seek
  rest!'' And nowhere is there whole rest except in the detached heart alone. Therefore God is dearer there than in any other
  virtues or in any things. You should also know: the more a person sets himself to be receptive to the divine...'
commentary: 'This passage advances one of Eckhart''s boldest claims: that the highest ''prayer'' is no longer prayer at all.
  His logic is precise. Petitionary prayer always involves a gap — a wanting to receive or to be relieved of something. But
  the truly detached heart wants nothing and clings to nothing it would be rid of. Since it has no lack to fill and no burden
  to shed, the mechanism of asking has nothing to work on. What remains is einförmic sîn mit gote — being ''one-formed'' with
  God, conformed to the divine so completely that intention and object collapse into a single shape. Eckhart marshals a chain
  of authorities (Paul, Dionysius, Augustine) to trace the ascent: the soul''s many powers all ''run,'' but only the naked
  wesen (being/essence) can receive the prize, because the running is really a stripping-away, a turning from creatures into
  ''uncreatedness.'' The startling images do the heavy lifting: the soul loses its very name and, drawn into God, becomes
  nothing to itself — like the dawn''s red swallowed by the risen sun. This is not annihilation as loss but as fulfillment;
  the small self dissolves precisely because the greater light has arrived. The famous apophatic crescendo follows: at its
  peak, detachment becomes ''knowing without knowledge, loving without love, dark through light.'' Every faculty is pressed
  past its own operation. Eckhart then reinterprets the Beatitude — the poor in spirit are those who have handed all things
  back to God as he held them ''when we were not yet,'' i.e., in eternity before creation, before the self existed to possess
  anything. The theological pivot is the quotation from Wisdom: God seeks rest in all things, but whole rest exists only in
  the detached heart. So detachment is not the soul''s flight from God but the one place spacious enough for God to come to
  stillness. The soul empties itself and thereby becomes God''s own sabbath.


  Key Terms


  **abegescheidenheit** — detachment — the pure release from all wanting, having, and clinging that makes the soul receptive
  to God.

  **einförmic sîn mit gote** — being ''one-formed'' with God — conformed so fully to the divine that petition dissolves into
  pure conformity.

  **wesen** — being/essence — the naked ground of the soul that alone receives union, as opposed to the soul''s scattered
  powers.'
insight: Ordinary prayer is desire-shaped (give me / take from me).
practice: 'Try a ''prayer of no-asking'' for ten minutes. Sit still and begin as you normally might — but each time a request
  forms (for help, relief, an outcome, even for God''s presence), notice it, and instead of pursuing it, gently set it down
  and return to a single quiet intention: ''I want to be as you would have me, and nothing else.'' Do not ask for anything
  and do not try to shed anything; simply keep releasing every want that arises back into God''s keeping. When the mind protests
  that nothing is ''happening,'' let that emptiness itself be the point — you are practicing being the rest that Wisdom says
  God seeks. The aim is not a feeling but a shape: a heart with no agenda but conformity, becoming a still space where God
  can settle.'
