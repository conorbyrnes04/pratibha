  body: 'The masters also praise humility above many other virtues. But I praise detachment above all
    humility — because humility can stand without detachment, while perfect detachment cannot stand without
    perfect humility, since perfect humility aims at an annihilation of oneself. Now detachment touches
    so near to nothingness that nothing can stand between perfect detachment and nothingness. Therefore
    perfect detachment cannot be without humility. And two virtues are always better than one. The second
    reason I praise detachment above humility: perfect humility bows itself under all creatures, and in
    that bowing a person goes out of oneself toward creatures; but detachment remains within itself. Now
    no going-out can ever become so noble that remaining-within is not far nobler in itself. So the prophet
    David said: all the glory of the king''s daughter is from within. Perfect detachment has no looking
    up or down under or over any creature; it will be neither under nor over; it will stand from itself,
    for no one''s joy or sorrow, and will have neither equality nor inequality with any creature, neither
    this nor that: it wills nothing other than to be. That it should be this or that — that it does not
    will. Whoever wills to be this or that wills to be something; but detachment wills to be nothing at
    all. Therefore all things stand unburdened by it.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Humility''s classical Christian form still *moves toward creatures* — bowing under them. Eckhart
    grants humility''s necessity (detachment cannot be perfect without the self-annihilation humility
    names) yet insists the nobler act is *inneblîben*: remaining within. The contested metaphysics is
    here: spiritual excellence is not relational positioning (higher/lower than others) but a refusal
    of all such coordinates. Detachment wills neither this nor that; it wills only *to be* — which, paradoxically,
    means willing to be nothing (*nihtes niht*). To want a named spiritual identity ("the humble one,"
    "the detached one") already exits the state. Existentially: watch how quickly "being spiritual" becomes
    a this-or-that you are performing for yourself or others; return to the unburdened standing that claims
    no rank.


    Key Terms


    **dêmüeticheit (MHG)** — "humility, meekness." Valued, yet structurally a going-out; incomplete without
    the remaining-within of detachment.


    **inneblîben / ûzganc (MHG)** — "remaining-within" / "going-out." The treatise''s central geometry:
    every virtue that exits toward creatures is less than the posture that stays.


    **nihtes niht (MHG)** — "nothing at all." Detachment''s will is not nihilism as despair but the refusal
    to be a something among somethings.


    Cross-Tradition Resonances


    **Zhuangzi, free-and-easy wandering (useless tree / no ranking):** Both prize a stance that does not
    compete for place among things.

    *Divergence:* Zhuangzi''s ease often dissolves into natural spontaneity; Eckhart''s remaining-within
    is ordered to God''s occupancy of the emptied heart.


    **Aṣṭāvakra Gītā 18 (the one who has nothing to do / no status):** Both describe liberation as freedom
    from being somebody.

    *Divergence:* Aṣṭāvakra''s somebody is the doer-enjoyer in awareness; Eckhart''s somebody is the creaturely
    self that still claims rank before God and world.'
