source_excerpt: 'The masters also praise humility above many other virtues. But I praise detachment above
  all humility — because humility can stand without detachment, while perfect detachment cannot stand
  without perfect humility, since perfect humility aims at an annihilation of oneself. Now detachment
  touches so near to nothingness that nothing can stand between perfect detachment and nothingness. Therefore
  perfect detachment cannot be without humility. And two virtues are always better than one. The second
  reason I praise detachment above humility: perfect humility bows itself under all creatures, and in
  that bowing a person goes out of oneself toward creatures; but detachment remains within itself. Now'
translation_literal: 'The masters praise humility above many other virtues. But I praise abegescheidenheit
  (detachment) above all humility, and here is the reason: humility can exist without detachment, but
  perfect detachment cannot exist without perfect humility, since perfect humility aims at the annihilation
  of the self. Now detachment stands so close to nothingness that between perfect detachment and nothingness
  no thing can come between. That is why perfect detachment cannot exist without humility. And two virtues
  are always better than one. The second reason why I praise detachment above humility is this: perfect
  humility bends itself down beneath every creature, and in this bending a person goes out of himself
  toward creatures — whereas detachment remains within itself. Now no going-out can ever be so noble that
  remaining-within is not far nobler in itself. That is why the prophet David said: ''omnis gloria eius
  filiae regis ab intus,'' which means: ''the king''s daughter has all her glory from what is within her.''
  Perfect detachment has no regard for any bending down beneath any creature nor above any creature; it
  wants to be neither below nor above; it wants to stand by itself, out of love for no one and out of
  pain for no one, and it wants to have neither likeness nor unlikeness with any creature, neither this
  nor that: it wants nothing other than to be. That it should want to be this or that — that it does not
  want. For whoever wants to be this or that wants to be something, but detachment wants to be nothing
  at all. Therefore all things stand untroubled by it.'
commentary: 'This passage stages a striking reversal of the traditional hierarchy of virtues. The ''masters''
  — the scholastic and monastic authorities — rank humility at the summit, but Eckhart elevates abegescheidenheit
  (detachment) even higher. His argument is subtle and turns on the metaphysics of direction. Humility,
  however perfect, is a movement: it ''bends down'' (neigunge), lowering itself beneath all creatures.
  But every bending is still a relation to creatures, and every relation is a going-out (ûzganc) of the
  self toward something. Detachment, by contrast, neither bends down nor rises up; it stays within itself
  (inneblîben). Eckhart''s principle — ''no going-out can ever be so noble that remaining-within is not
  far nobler'' — is the hinge of the whole piece, and it echoes his lifelong conviction that the soul''s
  true nobility lies in its innermost ground (grunt) rather than in any outward act, however pious.


  The move toward nothingness is the boldest stroke. Eckhart argues that detachment stands so near to
  nihte (nothingness) that nothing can slip between them. This is not nihilism but a via negativa applied
  to the will: to be ''this or that'' is to be ''something,'' and to be something is to be determinate,
  defined, hemmed in by relations. Detachment refuses all such determination — ''it wants nothing other
  than to be.'' It seeks bare being, not qualified being. This is why detachment must include humility
  (perfect humility already ''annihilates the self'') yet surpasses it: humility empties the self downward
  toward creatures, while detachment empties it of all directional relation whatsoever, resting in pure
  interiority.


  The biblical citation, Psalm 44:14 in the Vulgate numbering, seals the point: the king''s daughter —
  the soul — draws all her glory from within, ab intus. And the closing line is quietly astonishing: ''all
  things stand untroubled by it.'' Because detachment wants nothing from creatures, makes no claim on
  them, neither loves nor grieves over them, it leaves them entirely free. Perfect detachment is not withdrawal
  into coldness but a way of being so free of grasping that the world is released from the distortions
  our wanting imposes on it. The empty, undetermined ground of the soul turns out to be the place where
  both God''s being and the freedom of all things can appear undisturbed.


  Key Terms


  **abegescheidenheit** — detachment; the soul''s release from all determinate wanting and relation, standing
  free within itself.

  **inneblîben / ûzganc** — remaining-within versus going-out; Eckhart''s contrast between resting in
  the inner ground and moving outward toward creatures.

  **nihte** — nothingness; the undetermined ''nothing at all'' that detachment approaches by refusing
  to be any particular ''something.'''
insight: ''
practice: Try a fifteen-minute 'want-nothing' sitting today. Sit quietly and let your attention rest not
  on any object but on the bare sense of being present. Each time a preference arises — 'I want this to
  be quieter,' 'I wish I felt calmer,' 'I want this over with' — notice that you are trying to be 'this
  or that,' to be some particular something. Gently set the preference down without arguing with it, and
  return to the plain fact that you simply are, prior to being anything in particular. Notice, as Eckhart
  promises, that when you stop making claims on your experience, the noise, the restlessness, the discomfort
  all 'stand untroubled' — you are no longer bending toward them or away from them. This is a small, concrete
  taste of remaining-within rather than going-out.
sanskrit_devanagari: 'Die meister lobent ouch dêmüeticheit vür vil ander tugende. Aber ich lobe abegescheidenheit
  vür alle dêmüeticheit, und ist daz dar umbe, wan dêmüeticheit mac gestân âne abegescheidenheit, sô enmac
  volkomeniu abegescheidenheit niht gestân âne volkomene dêmüeticheit, wan volkomeniu dêmüeticheit gât
  ûf ein vernihten sîn selbes. Nû rüeret abegescheidenheit alsô nâhe dem nihte, daz zwischen volkomener
  abegescheidenheit und dem nihte kein dinc gesîn enmac. Dâ von enmac volkomeniu abegescheidenheit niht
  gesîn âne dêmüeticheit. Nû ist alle zît zwô tugende bezzer dan einiu. Diu ander sache ist, war umbe
  ich lobe abegescheidenheit vür dêmüeticheit, wan volkomeniu dêmüeticheit ist sich selber neigende under
  alle crêatûre, und in dúr neigunge sô gât der mensche ûz im selber ûf die crêatûre, sô blîbet abegescheidenheit
  in ir selber. Nû enmac kein ûzganc niemer sô edel werden, daz inneblîben ensî vil edeler in im selber.
  Dâ von sprach der wîssage Dâvît: ''omnis gloria eius filiae regis ab intus'', daz ist gesprochen: ''des
  küniges tohter hât alle ir êre von ir inwendicheit''. Volkomeniu abegescheidenheit enhât kein ûfsehen
  ûf keine neigunge under keine crêatûre noch über keine crêatûre; si enwil weder under noch obe sîn,
  si wil alsô stân von ir selber, niemanne ze liebe noch ze leide, und enwil weder glîcheit noch unglîcheit
  mit keiner crêatûre haben noch diz noch daz: si enwil niht anders wan sîn. Daz si aber welle diz oder
  daz sîn, des enwil si niht. Wan swer wil diz oder daz sîn, der wil etwaz sîn, sô enwil abegescheidenheit
  nihtes niht sîn. Dâ von stânt alliu dinc von ir unbeswæret.'
