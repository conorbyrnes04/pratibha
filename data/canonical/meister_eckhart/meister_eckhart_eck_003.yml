- virtue
source_excerpt: 'The masters also praise humility above many other virtues. But I praise detachment above all humility — because
  humility can stand without detachment, while perfect detachment cannot stand without perfect humility, since perfect humility
  aims at an annihilation of oneself. Now detachment touches so near to nothingness that nothing can stand between perfect
  detachment and nothingness. Therefore perfect detachment cannot be without humility. And two virtues are always better than
  one. The second reason I praise detachment above humility: perfect humility bows itself under all creatures, and in that
  bowing a person goes out of oneself toward creatures; but detachment remains within itself. Now'
translation_literal: 'The masters also praise humility above many other virtues. But I praise detachment above all humility
  — because humility can stand without detachment, while perfect detachment cannot stand without perfect humility, since perfect
  humility aims at an annihilation of oneself. Now detachment touches so near to nothingness that nothing can stand between
  perfect detachment and nothingness. Therefore perfect detachment cannot be without humility. And two virtues are always
  better than one. The second reason I praise detachment above humility: perfect humility bows itself under all creatures,
  and in that bowing a person goes out of oneself toward creatures; but detachment remains within itself. Now no going-out
  can ever become so noble that remaining-within is not far nobler in itself. So the prophet David said: all the glory of
  the king''s daughter is from within. Perfect detachment has no looking up or down under or over any creature; it will be
  neither under nor over; it will stand from itself, for no one''s joy or sorrow, and will have neither equality nor inequality
  with any creature, neither this nor that: it wills nothing other than to be. That it should be this or that — that it does
  not will. Whoever wills to be this or that wills to be something; but detachment wills to be nothing at all. Therefore all
  things stand unburdened by it.'
commentary: 'Humility''s classical Christian form still *moves toward creatures* — bowing under them. Eckhart grants humility''s
  necessity (detachment cannot be perfect without the self-annihilation humility names) yet insists the nobler act is *inneblîben*:
  remaining within. The contested metaphysics is here: spiritual excellence is not relational positioning (higher/lower than
  others) but a refusal of all such coordinates. Detachment wills neither this nor that; it wills only *to be* — which, paradoxically,
  means willing to be nothing (*nihtes niht*). To want a named spiritual identity ("the humble one," "the detached one") already
  exits the state. Existentially: watch how quickly "being spiritual" becomes a this-or-that you are performing for yourself
  or others; return to the unburdened standing that claims no rank.


  Key Terms


  **dêmüeticheit (MHG)** — "humility, meekness." Valued, yet structurally a going-out; incomplete without the remaining-within
  of detachment.


  **inneblîben / ûzganc (MHG)** — "remaining-within" / "going-out." The treatise''s central geometry: every virtue that exits
  toward creatures is less than the posture that stays.


  **nihtes niht (MHG)** — "nothing at all." Detachment''s will is not nihilism as despair but the refusal to be a something
  among somethings.


  Cross-Tradition Resonances


  **Zhuangzi, free-and-easy wandering (useless tree / no ranking):** Both prize a stance that does not compete for place among
  things.

  *Divergence:* Zhuangzi''s ease often dissolves into natural spontaneity; Eckhart''s remaining-within is ordered to God''s
  occupancy of the emptied heart.


  **Aṣṭāvakra Gītā 18 (the one who has nothing to do / no status):** Both describe liberation as freedom from being somebody.

  *Divergence:* Aṣṭāvakra''s somebody is the doer-enjoyer in awareness; Eckhart''s somebody is the creaturely self that still
  claims rank before God and world.'
insight: ''
practice: Once today, catch yourself arranging an identity — humble, wise, wounded, advanced. Silently drop the label. Stand
  for one minute without being this or that. Notice whether the world feels less heavy when you claim no rank in it.
sanskrit_devanagari: 'Die meister lobent ouch dêmüeticheit vür vil ander tugende. Aber ich lobe abegescheidenheit vür alle
  dêmüeticheit, und ist daz dar umbe, wan dêmüeticheit mac gestân âne abegescheidenheit, sô enmac volkomeniu abegescheidenheit
  niht gestân âne volkomene dêmüeticheit, wan volkomeniu dêmüeticheit gât ûf ein vernihten sîn selbes. Nû rüeret abegescheidenheit
  alsô nâhe dem nihte, daz zwischen volkomener abegescheidenheit und dem nihte kein dinc gesîn enmac. Dâ von enmac volkomeniu
  abegescheidenheit niht gesîn âne dêmüeticheit. Nû ist alle zît zwô tugende bezzer dan einiu. Diu ander sache ist, war umbe
  ich lobe abegescheidenheit vür dêmüeticheit, wan volkomeniu dêmüeticheit ist sich selber neigende under alle crêatûre, und
  in dúr neigunge sô gât der mensche ûz im selber ûf die crêatûre, sô blîbet abegescheidenheit in ir selber. Nû enmac kein
  ûzganc niemer sô edel werden, daz inneblîben ensî vil edeler in im selber. Dâ von sprach der wîssage Dâvît: ''omnis gloria
  eius filiae regis ab intus'', daz ist gesprochen: ''des küniges tohter hât alle ir êre von ir inwendicheit''. Volkomeniu
  abegescheidenheit enhât kein ûfsehen ûf keine neigunge under keine crêatûre noch über keine crêatûre; si enwil weder under
  noch obe sîn, si wil alsô stân von ir selber, niemanne ze liebe noch ze leide, und enwil weder glîcheit noch unglîcheit
  mit keiner crêatûre haben noch diz noch daz: si enwil niht anders wan sîn. Daz si aber welle diz oder daz sîn, des enwil
  si niht. Wan swer wil diz oder daz sîn, der wil etwaz sîn, sô enwil abegescheidenheit nihtes niht sîn. Dâ von stânt alliu
  dinc von ir unbeswæret.'
