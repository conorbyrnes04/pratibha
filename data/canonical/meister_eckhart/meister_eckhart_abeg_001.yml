unit_label: Detachment Surpasses Love
title: Detachment Surpasses Love
unit_type: teaching_passage
thesis: >
  Eckhart's radical claim is that Abgeschiedenheit (detachment) surpasses even
  love (minne) as the highest virtue, because love compels me toward God, but
  detachment compels God toward me — since God's own natural place is unity and
  purity, which arise only in the detached heart.
themes:
  - detachment
  - consciousness
  - non-dual
source_excerpt: >
  Ich habe der geschrift vil gelesen, beide von heidenischen meistern unde von
  wîssagen, unde von der alten ê unde von der niuwen ê, unde hâbe mit erneste
  unde mit ganzem vlîze gesuochet, welhiu diu beste unde diu hoehste tugent sî,
  dâ mite der mensche sich aller nâhest zuo gefüegen müge unde mit der der
  mensche aller gelîchest werde dem bilde, als er in gote was, in deme zwischen
  im unde gote kein underscheit was, ê daz got die crêatûre beschuof. Unt sô
  ich alle geschrift durchgründe alse verre mîn vernunft erlangen unde bekennen
  mac, sô vinde ich niht anders wan lûterin abegescheidenheit ledig aller
  crêatûren. [...] Sô lobe ich abegescheidenheit für alle minne. Zem êrsten dar
  umbe, wan daz beste an der minne ist, daz si mich twinget, daz ich got minne.
  Nû ist vil adelîcher, daz ich got twinge zuo mir, dan daz ich mich twinge zuo
  gote. Und ist daz dâ von, wan mîn êwigiu sælikeit lît dar an, daz ich unde
  got vereinet werden; wan got kan sich einfüeglîcher füegen zuo mir unde baz
  vereinen mit mir, dan ich mich künde vereinen mit gote. Daz abegescheidenheit
  twinge got zuo mir, daz bewære ich dâ mite: wan ein ieglich dinc ist gerne an
  sîner nâtûrlîchen eigen stat. Nû ist gotes nâtûrlîchiu eigeniu stat einekeit
  unde lûterkeit; die koment von abegescheidenheit. Dar umbe muoz got von nôt
  sich selber geben einem abegescheidenen herzen.
translation_literal: >
  I have read much of Scripture, both from pagan masters and from prophets, and
  from the Old Law and from the New, and have sought with earnestness and with
  full diligence which is the best and highest virtue by which a person may most
  closely join himself [to God] and through which a person may most fully become
  [again] the image [bilde] as he was in God, in which between him and God no
  distinction existed, before God created any creature. And insofar as I search
  through all Scripture to the extent that my reason [vernunft] can reach and
  grasp, I find nothing other than pure detachment [abegescheidenheit], free
  of all creatures. [...] Thus I praise detachment above all love. First,
  because the best thing about love is that it compels me to love God. Now it is
  far nobler that I compel God toward me than that I compel myself toward God.
  And the reason is this: my eternal blessedness [êwigiu sælikeit] rests upon
  this — that I and God become united; for God can join himself to me more
  fittingly and unite with me better than I could unite myself with God. That
  detachment compels God toward me I demonstrate thus: for every thing is gladly
  [gerne] in its own natural proper place [nâtûrlîche eigen stat]. Now God's
  natural proper place is unity [einekeit] and purity [lûterkeit]; these come
  from detachment. Therefore God must of necessity [von nôt] give himself to a
  detached heart.
  ⚠ UNCERTAINTY: "vernunft" in MHG covers a wider semantic range than modern
  "reason" — closer to "intellective faculty" or "discernment." "Bilde" is
  rendered "image" but carries the resonance of exemplar/form in scholastic
  usage. "Gerne" (gladly) is difficult — it implies natural tendency, not
  affective preference; "naturally inclines to" would be more precise but
  heavier.
commentary: >
  The opening move of Von Abegescheidenheit makes a claim that would have been
  audacious even in scholastic context: detachment (Abgeschiedenheit) surpasses
  love (minne) as the supreme virtue. Eckhart does not deny the primacy of love
  as Paul articulated it in 1 Corinthians 13; he reframes the asymmetry. Love,
  he argues, compels the lover toward the beloved — it is directional,
  effortful, oriented outward. Detachment does something ontologically more
  radical: it empties the soul so completely that God, whose own nature is unity
  and purity, is compelled toward the detached heart by a kind of metaphysical
  gravity. The inversion is precise: rather than the soul ascending to God, the
  soul becomes the place where God must already be, because God's own nature
  demands it. This is not quietism — the claim is that the emptied soul becomes
  a site of divine necessity, not that the soul does nothing. The pivot term is
  "nâtûrlîche eigen stat" — God's own natural proper place. Eckhart treats this
  almost as a physical law: unity and purity are where God belongs, and these
  are precisely what detachment produces. The soul that achieves complete
  detachment is not striving toward God; it has become the condition that God
  cannot not inhabit. This inverts the entire architecture of mystical effort.
insight: ''
practice: >
  Sit with a single desire you hold right now — something you want God, life,
  or another person to give you. Instead of releasing the desire (that is still
  effortful), notice the space around the desire: the awareness in which the
  wanting appears. Let the wanting remain, but shift attention to the container
  rather than the contained. If the container empties even slightly, notice what
  moves toward that space uninvited.
