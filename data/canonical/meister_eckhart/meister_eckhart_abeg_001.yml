    body: >
      I have read much of Scripture, both from pagan masters and from prophets,
      and from the Old Law and from the New, and have sought with earnestness
      and with full diligence which is the best and highest virtue by which a
      person may most closely join himself [to God] and through which a person
      may most fully become [again] the image [bilde] as he was in God, in
      which between him and God no distinction existed, before God created any
      creature. And insofar as I search through all Scripture to the extent that
      my reason [vernunft] can reach and grasp, I find nothing other than pure
      detachment [abegescheidenheit], free of all creatures.

      Thus I praise detachment above all love. First, because the best thing
      about love is that it compels me to love God. Now it is far nobler that I
      compel God toward me than that I compel myself toward God. And the reason
      is this: my eternal blessedness [êwigiu sælikeit] rests upon this — that
      I and God become united; for God can join himself to me more fittingly and
      unite with me better than I could unite myself with God. That detachment
      compels God toward me I demonstrate thus: for every thing is gladly
      [gerne] in its own natural proper place [nâtûrlîche eigen stat]. Now
      God's natural proper place is unity [einekeit] and purity [lûterkeit];
      these come from detachment. Therefore God must of necessity [von nôt] give
      himself to a detached heart.

      ⚠ UNCERTAINTY: "vernunft" covers a wider semantic range than modern
      "reason" — closer to "intellective faculty." "Bilde" carries the
      scholastic resonance of exemplar/form. "Gerne" implies natural tendency,
      not affective preference.
  - kind: commentary
    label: Pratibhā Commentary
    body: >
      The opening move of Von Abegescheidenheit makes a claim that would have
      been audacious even in scholastic context: detachment surpasses love as
      the supreme virtue. Eckhart does not deny the primacy of love as Paul
      articulated it; he reframes the asymmetry. Love compels the lover toward
      the beloved — it is directional, effortful, oriented outward. Detachment
      does something ontologically more radical: it empties the soul so
      completely that God, whose own nature is unity and purity, is compelled
      toward the detached heart by a kind of metaphysical gravity. Rather than
      the soul ascending to God, the soul becomes the place where God must
      already be, because God's own nature demands it. This is not quietism —
      the claim is that the emptied soul becomes a site of divine necessity.
      The pivot term is "nâtûrlîche eigen stat" — God's own natural proper
      place. Eckhart treats this almost as a physical law: unity and purity are
      where God belongs, and these are precisely what detachment produces. The
      soul that achieves complete detachment has become the condition God cannot
      not inhabit, inverting the entire architecture of mystical effort.

      What Eckhart describes from within the Christian frame, the Trika
      recognizes as the structure of awareness recognizing its own
      spaciousness. The "compulsion" he attributes to God is, in Trika terms,
      the inherent tendency of cit to fill any aperture that does not resist
      it. Svātantrya — the absolute freedom of Consciousness — is not
      constrained by the soul's activity but by its resistance. Remove the
      resistance and the divine enters not as grace descending but as
      recognition of what was never absent. Eckhart's "nâtûrlîche eigen stat"
      is structurally the svabhāva-sthiti of Consciousness returning to its
      own locus. The practitioner discovers: I was not pulling God toward me;
      I was ceasing to hold God away.
  - kind: key_terms
    label: Key Terms
    items:
      - term: Abegescheidenheit (MHG)
        definition: >
          From abe- (away, off) + gescheiden (separated, parted). Literally
          "having-been-separated-off." Eckhart's signature concept: not merely
          renunciation of things (which still refers back to the things
          renounced), but a radical emptying that touches nothingness itself.
          Distinct from ascetic detachment in that it is ontological, not
          volitional — the soul does not detach from things, it becomes the
          condition of pure receptivity. Modern German Abgeschiedenheit
          (seclusion, solitude) has lost the metaphysical force.
      - term: minne (MHG)
        definition: >
          The MHG word for love, carrying courtly and theological resonances
          simultaneously. Not identical with Latin caritas or Greek agapē;
          minne retains the connotation of desire and directed longing from
          Minnesang (courtly love poetry). Eckhart's argument that
          Abegescheidenheit surpasses minne gains its force precisely because
          minne implies directionality — the lover strains toward the beloved.
      - term: vernunft (MHG)
        definition: >
          Often translated "reason," but in Eckhart's usage closer to the
          Latin intellectus than ratio. The faculty by which the soul grasps
          truth directly, not merely through discursive reasoning. Eckhart
          elsewhere distinguishes vernunft from the lower faculty of
          discursive thought (reden). Here it designates the highest cognitive
          capacity, which has searched all Scripture and found only one
          answer.
      - term: einekeit (MHG)
        definition: >
          Unity, oneness. From ein (one) + -keit (abstract suffix). God's
          "natural proper place" is einekeit — not a theological assertion
          but a quasi-physical claim about where God's nature tends. Related
          to but distinct from the later German Einheit; einekeit in Eckhart
          carries the resonance of undifferentiated simplicity, not mere
          numerical oneness.
  - kind: resonances
    label: Cross-Tradition Resonances
    items:
      - citation: "Pratyabhijñāhṛdayam, Sūtra 15 (Kṣemarāja)"
        resonance: >
          Both Eckhart and Kṣemarāja argue that the highest realization is not
          the soul's effortful ascent but rather a structural recognition: the
          soul discovers it already is what it seeks. Kṣemarāja's sūtra on
          citi-śakti contracting to become the individual, then re-recognizing
          its own fullness, mirrors Eckhart's claim that detachment restores
          the pre-creational unity between soul and God — the "image" that
          existed before any creature was made.
        divergence: >
          Eckhart retains a creator/creature distinction even while dissolving
          it experientially; Pratyabhijñā is non-dual from the start. For
          Eckhart, the soul returns to an image (bilde) in God; for Kṣemarāja,
          there is no "return" because consciousness never actually left its
          own nature.
      - citation: "Dào Dé Jīng §16 (Lǎozǐ)"
        resonance: >
          DDJ §16 prescribes "attaining the utmost emptiness, holding to
          stillness" (zhì xū jí, shǒu jìng dǔ) as the way to observe all
          things returning to their root. Eckhart's Abegescheidenheit
          similarly posits emptiness as the condition that lets what is real
          arrive: God enters the emptied heart by necessity, just as the
          ten-thousand things return to their root in stillness.
        divergence: >
          Lǎozǐ's emptiness is cosmological and impersonal — the Tao returns
          through natural process. Eckhart's detachment is personal and
          theological: God "must" give himself, creating a divine obligation
          that has no parallel in Daoist thought.
