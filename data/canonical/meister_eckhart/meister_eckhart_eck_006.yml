practice: 'Stop mid-prayer or mid-wish today — at the moment you feel yourself repeating a request or
  anxiously reinforcing it — and whisper: ''Already heard.'' Then notice: does the urgency shift? Does
  something in your body relax, as if the eternal glance has already taken you in? Repeat this only when
  you catch yourself in the loop of reminding.'
sanskrit_devanagari: 'Nû solt dû wizzen, daz got in dirre unbewegelîchen abegescheidenheit ist êwelten
  gestanden und noch stât, und solt wizzen: dô got himelrîche und ertrîche beschuof und alle crêatûre,
  daz gienc sîne unbewegelîche abegescheidenheit als wênic ane, als ob nie crêatûre geschaffen wære. Ich
  spriche ouch mêr: allez daz gebet und guotiu werk, diu der mensche in der zît mac gewürken, daz gotes
  abegescheidenheit alsô wênic dâ von beweget wirt, als ob niendert gebet noch guotez werk in der zît
  beschæhe, und enwirt got niemer deste milter noch deste geneigeter gegen dem menschen, dan ob er daz
  gebet oder diu guoten werk niemer gewürhte. Ich spriche ouch mêr: dô der sun in der gotheit mensche
  werden wolte und wart und die marter leit, daz gienc die unbewegelîche abegescheidenheit gotes alsô
  wênic ane, als ob er nie mensche worden wære. Nû möhtest dû sprechen: sô hœre ich wol, allez gebet und
  alliu guotiu werk sint verlorn, wan sich got ir niht anenimet, daz in ieman dâ mite bewegen müge, und
  sprichet man doch: got wil umbe alliu dinc gebeten werden. Hie solt dû mich wol merken und rehte verstân,
  ob dû maht, daz got in sînem êrsten êwigen anblicke - ob wir einen êrsten anblik dâ nemen solten -,
  alliu dinc anesach, als sie beschehen solten, und sach in dem selben anblicke, wanne und wie er die
  crêatûre schepfen wolte und wanne der sun mensche werden wolte und lîden solte; er sach ouch daz minste
  gebet und guote werk, daz ieman solte tuon, und sach ane, welhez gebet und andâht er erhœren wolte oder
  solte; er sach, daz dû in morgen wilt mit ernste aneruofen und biten, und daz aneruofen und gebet enwil
  got niht morgen erhœren, wan er hât ez erhœret in sîner êwicheit, ê dû ie mensche würde. Enist aber
  dîn gebet niht endelich und âne ernst, sô enwil dir got niht nû versagen, wan er hât dir in sîner êwicheit
  versaget. Und alsô hât got in sînem êrsten êwigen anblicke alliu dinc anegesehen, und got würket nihtes
  niht von niuwem, wan ez ist allez ein vorgewürket dinc [1]. Und alsô stât got alle zît in sîner unbewegelîchen
  abegescheidenheit, und enist doch dar umbe der liute gebet und guotiu werk niht verlorn; wan der wol
  tuot, dem wirt ouch wol gelônet, der übel tuot, dem wirt ouch dar nâch gelônet. Disen sin redet sant
  Augustînus in dem fünften buoche von der drîvalticheit in dem jüngesten capitel und sprichet alsô: »Deus
  autem« etc., daz ist als vil gesprochen: »nû enwelle got, daz ieman spreche, daz got ieman zîtlîche
  minne, wan bî im enist nihtes niht verloufen und ouch nihtes niht künftic und hât alle heiligen geminnet,
  ê diu werlt ie wart geschaffen, als er sie versehen hât. Und swenne ez kumet in die zît, daz er öuget
  in der zît, daz er in der êwicheit hât anegesehen, sô wænent die liute, got habe eine niuwe minne an
  sie geleget; und alsô, sô er zürnet oder etwaz guotes tuot, sô werden wir gewandelt und blîbet er unwandelbære,
  als der sunnen schîn tuot den siechen ougen wê und den gesunden wol, und blîbet doch der sunnen schîn
  unwandelbære an im selber.'
