source_excerpt: 'Know that God has stood in this immovable detachment from everlasting and still stands.
  When God created heaven and earth and all creatures, that affected his immovable detachment as little
  as if no creature had ever been made. Further: all the prayer and good works a person can perform in
  time move God''s detachment as little as if no prayer or good work ever happened in time — and God is
  never the gentler or more inclined toward someone than if that prayer or work had never been done. Further
  still: when the Son in the Godhead wished to become human and became human and suffered, that affected
  God''s immovable detachment as little as if he had never become human. You might say: then all pray'
translation_literal: 'Now you should know that God has stood eternally, and still stands, in this unmoving
  abegescheidenheit (detachment); and you should know that when God created heaven and earth and all creatures,
  this touched his unmoving detachment as little as if no creature had ever been made. I say still more:
  all the prayers and good works that a person can perform in time move God''s detachment as little as
  if no prayer or good work were ever done in time; and God never becomes more generous or more inclined
  toward a person because of them than if that person had never done the prayers or the good works. I
  say still more: when the Son in the Godhead willed to become man, and did become man, and suffered the
  Passion, this touched God''s unmoving detachment as little as if he had never become man. Now you might
  say: then I hear well enough that all prayer and all good works are wasted, since God does not take
  them up in a way that lets anyone move him by them — and yet people say that God wills to be asked in
  all things. Here you should mark me well and understand rightly, if you can, that God in his first eternal
  glance — if we may speak of a first glance there — beheld all things as they were to happen, and saw
  in that same glance when and how he would create the creatures, and when the Son would become man and
  would suffer. He also saw the least prayer and good work anyone would do, and saw which prayer and devotion
  he would or should answer. He saw that you will call upon him and pray to him in earnest tomorrow, and
  this calling and prayer God will not answer tomorrow, for he has already answered it in his eternity,
  before you ever became a human being. But if your prayer is not sincere and lacks earnestness, then
  God will not deny you now, for he has already denied you in his eternity. And so God in his first eternal
  glance has beheld all things, and God works nothing anew, for it is all one already-accomplished thing.
  And so God stands at all times in his unmoving detachment, and yet people''s prayers and good works
  are not for that reason wasted; for whoever does well is also rewarded well, and whoever does ill is
  likewise repaid accordingly. Saint Augustine speaks to this sense in the fifth book of On the Trinity,
  in the last chapter, and says: "Deus autem," etc., which means: God forbid that anyone should say that
  God loves anyone in a temporal way, for with him nothing has passed away and nothing is yet to come;
  and he has loved all the saints before the world was ever created, just as he foresaw them. And when
  the time comes in which he shows in time what he beheld in eternity, then people suppose that God has
  laid a new love upon them; and thus, when he is angry or does something good, it is we who are changed
  while he remains unchangeable — just as sunlight pains sick eyes and pleases healthy ones, while the
  sunlight itself remains unchanged in itself.'
commentary: 'The passage pushes abegescheidenheit (detachment) further than most readers expect. Eckhart
  is not describing a human virtue here but a divine attribute: God''s own detachment, which is his changeless
  eternity. The rhetorical escalation — creation, then all human prayer, then even the Incarnation and
  Passion — hammers a single point: nothing in time reaches into God to alter him. Even the Son becoming
  man ''touched his unmoving detachment as little as if he had never become man.'' This is startling and
  deliberately provocative, forcing the reader out of a transactional picture of religion.


  The theological hinge is the ''first eternal glance'' (êrster êwiger anblick). Because God''s knowing
  is not temporal, there is no before-and-after in him; every prayer is already heard, every response
  already given, in a single eternal act. God ''works nothing anew'' — everything is one already-accomplished
  thing. This is Eckhart''s version of the classic doctrine of divine immutability, but he draws from
  it a spiritual consequence rather than a mere metaphysical one: your sincere prayer tomorrow was answered
  before you existed. The relationship is real, but the change happens entirely on your side.


  The Augustine citation makes the practical payoff explicit through the image of sunlight. The sun does
  not change when it pains sick eyes and gladdens healthy ones — the difference lies in the eyes. So too,
  God''s supposed anger or favor is really our own changing condition meeting an unchanging love. This
  reorients the whole devotional life: prayer is not about moving God but about being moved oneself, about
  clearing the eye. Here the connection to Eckhart''s larger theme of the grunt (ground) emerges — the
  point is to become detached enough to receive what is eternally already given, rather than to negotiate
  with a God imagined as reactive in time.


  Key Terms


  **abegescheidenheit** — detachment; here applied to God himself as his unmoving, changeless eternity,
  untouched by anything in time.

  **êwiger anblick** — eternal glance/gaze — God''s single timeless act of seeing in which all things
  are already beheld and answered.

  **unbewegelich** — unmoving, immovable; the quality of God''s detachment that no creature, prayer, or
  even the Incarnation can alter.'
