- kind: translation
  label: Pratibha Translation
  body: 'Know that God has stood in this immovable detachment from everlasting and still stands. When
    God created heaven and earth and all creatures, that affected his immovable detachment as little as
    if no creature had ever been made. Further: all the prayer and good works a person can perform in
    time move God''s detachment as little as if no prayer or good work ever happened in time — and God
    is never the gentler or more inclined toward someone than if that prayer or work had never been done.
    Further still: when the Son in the Godhead wished to become human and became human and suffered, that
    affected God''s immovable detachment as little as if he had never become human. You might say: then
    all prayer and good works are wasted, since God is not moved by them — and yet people say God wants
    to be asked for everything. Understand, if you can: in his first eternal glance God saw all things
    as they would happen — when and how he would create, when the Son would become human and suffer, the
    least prayer and work anyone would do, and which devotion he would hear. He saw that tomorrow you
    will call on him earnestly; he will not hear that prayer *tomorrow*, for he has heard it in his eternity
    before you ever became human. If your prayer lacks earnestness, he does not refuse you *now*; he has
    refused you in his eternity. So God works nothing newly; everything is already wrought beforehand.
    Thus God always stands in immovable detachment — and yet prayer and good works are not lost: whoever
    does well is well rewarded, whoever does ill is rewarded accordingly. As Augustine says: God forbid
    anyone should say God loves someone in time, for with him nothing is past or future; he loved all
    the saints before the world was made. When in time he shows what he has regarded in eternity, people
    think God has turned a new love toward them; yet when he seems angry or gracious, *we* are changed
    and *he* remains unchangeable — as sunlight hurts sick eyes and helps healthy ones, while the sunlight
    itself remains unchangeable.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Eckhart protects God''s immutability without voiding prayer. The contested synthesis: temporally,
    nothing you do *begins* a new divine attitude; eternally, your earnest prayer is already included
    in the first glance that sees all. Prayer is not lever-pulling on a changeable God; it is alignment
    with what eternity has already regarded. The Augustine sun image relocates all drama of divine mood
    into the creature''s changing receptivity. Existentially: pray earnestly without the superstition
    that you are updating God; let the practice change *you* into the one who can bear the light.


    Key Terms


    **êwiger anblik (MHG)** — "eternal glance." God''s single regard in which all temporal events are
    seen at once.


    **unwandelbære (MHG)** — "unchangeable." Applied to God; change is predicated of us.


    **vorgewürket (MHG)** — "already wrought beforehand." Denies novelty in God without denying the moral
    seriousness of acts.


    Cross-Tradition Resonances


    **Bhagavad Gītā 9–11 (the cosmic form / acts within an already-complete divine field):** Both place
    human action inside a totality that is not surprised by time.

    *Divergence:* The Gītā keeps a personal Lord who reciprocates devotion within līlā; Eckhart stresses
    that reciprocity never implies temporal change in God.


    **Know Yourself / Balyānī (no before or after with the One):** Both refuse temporal predicates of
    the Absolute.

    *Divergence:* The Sufi treatise often dissolves the creature more absolutely; Eckhart keeps prayer,
    works, and reward language while relocating their efficacy.'
