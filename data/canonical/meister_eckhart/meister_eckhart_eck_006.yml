section: Sermon 12 (DW I.12, Pfeiffer 12)
sanskrit_devanagari: Es ist ein Kraft in der Seele, die ist so edel und so rein, daß sie ganz unberührt ist von Zeit und Fleisch.
  Diese Kraft heißet ein Fünklein der Seele.
sanskrit_iast: ''
translation_literal: There is a power in the soul so noble and so pure that it remains wholly untouched by time and flesh.
  This power is called a spark (Fünklein) of the soul. This spark is so averse to all that is creaturely that it desires nothing
  but God alone, naked as He is in His bare essence. It knows nothing of past or future; it lives only in the present now.
commentary: 'The Funklein represents the apex of the soul''s ascent—a faculty beyond intellect and will, dwelling in immediate
  contact with the Godhead''s naked essence (blossem Wesen). Eckhart locates it not in the rational soul but in an uncreated
  ground where the soul''s deepest nature coincides with divine simplicity. Crucially, the spark is not a possession to be
  cultivated but a recognition of what already is: the soul''s eternal, timeless core. This doctrine scandalized scholastic
  theology by suggesting an uncreated element within the creature; it echoes Neoplatonic henosis yet claims Christian mystical
  authority. The spark''s immunity to temporality and creatureliness signals its participation in God''s eternal now—the breakthrough
  (Durchbruch) where all distinction collapses.'
practice: In silence, withdraw attention from all sensory impressions and mental images. Descend past the rational mind (Vernunft)
  into the will's ground. There, cease all willing—even the will to know God. Rest in the naked, imageless point where you
  are not, where the spark alone is. Do not seek feeling or vision. Abide in this 'desert of the Godhead' for as long as you
  can sustain it. Return to ordinary consciousness only when the body's need compels you. Repeat daily, especially in early
  morning when the mind is least cluttered.
