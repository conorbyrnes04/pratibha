sanskrit_devanagari: 'Wer nû volkomener abegescheidenheit adel und nutz merken welle, der neme Kristî
  wort war, diu er von sîner menscheit sprach, dô er sprach ze sînen jüngern: ''ez ist iu nütze, daz ich
  von iu var, und gân ich niht von iu, sô enmac iu der heilige geist niht werden''. Rehte als ob er spræche:
  ir hât ze vil lustes ûf mîn gegenwürtigez bilde geleget, dâ von enmac iu der volkomene lust des heiligen
  geistes niht werden. Dâ von scheidet abe diu bilde und einiget iuch mit formelôsem wesene, wan gotes
  geistlîcher trôst ist zart; dar umbe wil er sich niemanne erbieten dan dem, der lîplîchen trôst versmæhet.
  Nû merket, alle vernünftigen liute! Ez enist nieman baz gemeit dan der dâ stât in der grœsten abegescheidenheit.
  Ez enmac kein vleischlîcher und lîplîcher trôst niemer gesîn âne geistlîchen schaden, ''wan daz vleisch
  begert wider den geist und der geist wider daz vleisch''. Dar umbe, swer in dem vleische sæjet ungeordente
  minne, der snîdet abe den êwigen tôt; und swer in dem geiste sæjet ordenlîche minne, der snîdet von
  dem geiste daz êwige leben. Dâ von, ie belder der mensche vliuhet von der geschepfede, ie belder im
  zuoloufet der schepfer. Hie merket, alle vernünftigen menschen! Sît der lust, den wir gehaben möhten
  an dem lîplîchen bilde Kristî, uns sûmet an der enpfenclicheit des heiligen geistes, wie vil mê sûmet
  denne gegen gote der ungeordente lust, den wir hân ûf zergenclîchen trôst! Dâ von ist abegescheidenheit
  daz aller beste, wan si reiniget die sêle und liutert die gewizzene und enzündet daz herze und wecket
  den geist und machet snel die begirde und tuot got erkennen und scheidet abe die crêatûre und vereiniget
  sich mit gote. Nû merket, alle vernünftigen menschen! Daz snelleste tier, daz iuch treget ze dirre volkomenheit,
  daz ist lîden, wan ez niuzet nieman mê êwiger süezicheit, dan die mit Kristô stânt in der grœsten bitterkeit.
  Ez enist niht gelligers dan lîden und enist niht honicsamers dan geliten-hân; ez entstellet den lîp
  nihtes mêr vor den liuten dan lîden und enzieret aber die sêle vor gote nihtes mêr dan geliten-hân.
  Daz vesteste fundament, dar ûf disiu volkomenheit gestân mac, daz ist dêmüeticheit, wan swelhes natûre
  hie kriuchet in der tiefsten niderkeit, des geist vliuget ûf in daz hœhste der gotheit, wan liebe bringet
  leit, und leit bringet liebe. Und dâ von, swer begert ze komenne ze volkomener abegescheidenheit, der
  stelle nâch volkomener dêmüeticheit, sô kumet er in die næhede der gotheit. Daz uns daz allen widervar,
  des helfe uns diu oberste abegescheidenheit, daz ist got selber. Âmen.'
