pratibha_translation: 'Whoever would mark the nobility of perfect detachment, take Christ''s word: it
  is useful that I go from you; if I do not go, the Holy Spirit cannot come. As if to say: you have set
  too much delight on my present image; therefore the Spirit''s perfect delight cannot come. So detach
  from images and unite with formless being — God''s spiritual comfort is delicate and offers itself only
  to those who scorn bodily comfort. No one is better glad than one who stands in greatest detachment.
  No fleshly comfort is without spiritual harm, for flesh desires against spirit. The faster one flees
  the creature, the faster the Creator runs toward them. Detachment is best: it purifies the soul, clarifies
  conscience, kindles the heart, wakes the spirit, speeds desire, lets God be known, separates from creatures,
  and unites with God. The fastest animal that carries you to this perfection is suffering — for none
  enjoys more eternal sweetness than those who stand with Christ in greatest bitterness. Nothing is more
  gall-bitter than suffering, nothing more honey-sweet than having-suffered. The firmest foundation is
  humility: whose nature crawls in deepest lowliness, that spirit flies into the Godhead''s height — for
  love brings pain and pain brings love. Whoever desires perfect detachment, strive for perfect humility;
  so one comes near the Godhead. May the highest detachment — God himself — help us to this. Amen.'
