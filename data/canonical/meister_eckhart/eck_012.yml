translation_literal: 'Whoever wants to grasp the nobility and usefulness of perfect abegescheidenheit
  (detachment), let him pay attention to the words Christ spoke out of his humanity, when he said to his
  disciples: ''It is useful for you that I go away from you, for if I do not leave you, the Holy Spirit
  cannot come to you.'' It is as though he said: You have placed too much delight upon my present, visible
  image, and because of this the complete delight of the Holy Spirit cannot come to you. So strip away
  the image and unite yourselves with formless being, for God''s spiritual consolation is delicate; therefore
  he will offer himself to no one except the one who despises bodily consolation. Now mark this, all you
  who have understanding! No one is more joyful than the one who stands in the greatest detachment. No
  fleshly and bodily consolation can ever exist without spiritual harm, ''for the flesh desires against
  the spirit and the spirit against the flesh.'' Therefore, whoever sows disordered love in the flesh
  reaps eternal death; and whoever sows ordered love in the spirit reaps from the spirit eternal life.
  Thus, the more quickly a person flees from created things, the more quickly the Creator runs toward
  him. Mark this, all understanding people! Since the delight we might take in the bodily image of Christ
  hinders us in our receptivity to the Holy Spirit, how much more, then, does the disordered delight we
  take in perishable consolation hinder us toward God! Therefore detachment is the very best of all, for
  it purifies the soul and clears the conscience and kindles the heart and awakens the spirit and quickens
  desire and makes God known and separates us from the creature and unites us with God. Now mark this,
  all understanding people! The fastest animal that carries you to this perfection is suffering, for no
  one tastes more of eternal sweetness than those who stand with Christ in the greatest bitterness. There
  is nothing more bitter than suffering, and nothing more like honey than having-suffered; nothing disfigures
  the body more before people than suffering, and yet nothing adorns the soul more before God than having-suffered.
  The firmest foundation on which this perfection can stand is humility, for whoever''s nature here crawls
  in the deepest lowliness, that person''s spirit flies up into the highest of the gotheit (Godhead),
  for love brings suffering, and suffering brings love. And therefore, whoever longs to come to perfect
  detachment, let him strive for perfect humility, and so he will come into the nearness of the Godhead.
  That this may happen to us all, may the highest detachment help us, which is God himself. Amen.'
commentary: 'This passage stages a striking reading of the Ascension: Christ''s ''it is useful that I
  go away'' becomes a lesson in abegescheidenheit (detachment). Eckhart reads the withdrawal of the bodily
  Christ not as loss but as necessary release from attachment even to the holiest image. The disciples
  clung with too much lust (delight, pleasure) to Christ''s visible presence, and so long as they did,
  the ''formless being'' of the Spirit could not fully arrive. This is Eckhart''s characteristically radical
  move: even the most legitimate spiritual consolation, if we rest in it as a possession, becomes an obstacle.
  God''s consolation is ''delicate'' (zart) and will not compete with grosser satisfactions; it comes
  only to the one who has let the coarser consolations go. The argument then runs a fortiori: if delight
  in Christ''s own image can hinder us, how much more does disordered delight in passing, perishable things.
  The heart of the passage is the paradox of suffering as the ''fastest animal'' — the swiftest mount
  to perfection. Eckhart pairs opposites that pass into each other: bitterness yields eternal sweetness,
  having-suffered (geliten-hân, the completed state) is honey where the suffering itself is gall. Note
  the tense he insists on: it is not raw pain that adorns the soul but suffering-that-has-been-borne,
  suffering taken up and worked through. Beneath all this lies the deepest foundation, dêmüeticheit (humility):
  the nature that crawls lowest sends the spirit highest into the gotheit. The circular formula ''love
  brings suffering, and suffering brings love'' closes the logic — detachment, suffering, and humility
  are not separate disciplines but one movement of the soul emptying itself so the Godhead can draw near.
  The final line performs its own claim: the ''highest detachment'' turns out to be God himself, so that
  the practice of letting go is ultimately a participation in God''s own detached being.'
insight: The treatise closes by yoking image-detachment, joy in emptiness, and the paradox of suffering
  as vehicle.
practice: 'When you next find yourself drawn into comfort—a familiar thought, a cherished memory, a spiritual
  experience you want to hold—pause and whisper Eckhart''s words: ''Strip away the image.'' Notice what
  dissolves when you release it, and what finer presence emerges in the emptiness.'
