source_excerpt: >
  Beati pauperes spiritu etc. Wir suln êweclîche alsô arm sîn, als wir wâren,
  dô wir êweclîch niht enwâren. An unserm wesen werden wir blîbende in ime
  daz wir sîn. Wir suln alliu dinc zuo uns nemen, sunder in des schepfers
  gegenwürtikeit. Wir suln got bekennen âne allerhaude gelîchnüsse unde minnen
  âne materie unde gebrûchen âne eigenschaft. Wir suln alliu dinc enpfâhen in
  der edelkeit, als sie diu êwige wîsheit in ir selber gezeiget unde geordent
  hât. Die armen des geistes die gânt ûz in selber und ûz allen creatûren: sie
  sint niht, sie hânt niht, sie würkent niht unt dise armen die sint niht wan
  daz sie sint von gnâden got mit gote: des selben enwizzent sie niht.
translation_literal: >
  "Blessed are the poor in spirit," etc. We ought to be eternally as poor as
  we were when we eternally were not [dô wir êweclîch niht enwâren]. In our
  being [wesen] we remain enduringly in Him, that [which] we are. We ought to
  receive all things, yet in the creator's presence [des schepfers
  gegenwürtikeit]. We ought to know [bekennen] God without any likeness
  [gelîchnüsse] and love without matter [materie] and enjoy [gebrûchen] without
  property [eigenschaft]. We ought to receive all things in that nobility
  [edelkeit] in which eternal wisdom [êwige wîsheit] has displayed and ordered
  them in itself. The poor in spirit go out from themselves and from all
  creatures: they are nothing [sint niht], they have nothing [hânt niht], they
  work nothing [würkent niht] — and these poor ones are nothing except that
  they are, by grace, God with God [von gnâden got mit gote]; and of this very
  thing they do not know [enwizzent sie niht].

  ⚠ UNCERTAINTY: "dô wir êweclîch niht enwâren" — "when we eternally were
  not" is the literal rendering, but the meaning is contested: does Eckhart
  mean a temporal "before creation" or an eternal non-being that persists even
  now alongside our created existence? The passage reads both ways and both
  readings are defensible. "Eigenschaft" — rendered "property" but carries
  the connotation of "appropriation" or "making one's own," not mere
  possession. "Von gnâden got mit gote" — "by grace, God with God" or
  possibly "by God's grace, with God" — the syntax is genuinely ambiguous.
  "Bekennen" — to know/recognize, not merely intellectual cognition; closer
  to pratyabhijñā than to jñāna.
commentary: >
  The opening of Von Armûot des Geistes makes the most compressed statement
  of Eckhart's entire program. To be poor in spirit is to be "eternally as
  poor as we were when we eternally were not." This is not a call to
  renunciation in time but an invitation to recover a condition that precedes
  time itself. The soul's pre-creational state — existing in God's idea but
  not yet as a separate creature — is the template for spiritual poverty. The
  three negations that follow (sint niht, hânt niht, würkent niht — are
  nothing, have nothing, work nothing) are not stages of progressive stripping
  but simultaneous descriptions of the same condition. The poor in spirit are
  not people who have given up their possessions; they are those in whom the
  very structure of having, doing, and being-something has dissolved. The final
  clause delivers the paradox: these poor ones "are, by grace, God with God —
  and of this very thing they do not know." The not-knowing is not ignorance
  but the structural consequence of there being no separate knower left to
  register the fact. If the poor one knew he was God with God, that knowledge
  would constitute a possession, and poverty would be broken. Eckhart's
  poverty is therefore self-erasing: it cannot be achieved, held, or even
  recognized without ceasing to be what it is.
insight: ''
practice: >
  For one breath, relinquish not a thing you have, but the sense of being
  someone who has things. Not the objects of experience, but the experiencer's
  claim to be experiencing. If something remains — some awareness that is
  not a someone — let even the recognition of that awareness fall away. What
  is left, if anything, is what Eckhart calls poverty.
