unit_label: Poverty of Spirit as Eternal Non-Having
title: Poverty of Spirit as Eternal Non-Having
unit_type: teaching_passage
thesis: >
  Spiritual poverty is not renunciation of possessions but the recovery of the
  condition before creation, where the soul existed eternally in God's
  co-presence without having, willing, or even being anything separate. The poor
  in spirit are those who are nothing except what they are by grace, with God,
  in God — and do not even know this.
