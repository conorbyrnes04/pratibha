  - kind: original
    label: Original (Middle High German)
    body: >
      Beati pauperes spiritu etc. Wir suln êweclîche alsô arm sîn, als wir
      wâren, dô wir êweclîch niht enwâren. An unserm wesen werden wir
      blîbende in ime daz wir sîn. Wir suln alliu dinc zuo uns nemen, sunder
      in des schepfers gegenwürtikeit. Wir suln got bekennen âne allerhaude
      gelîchnüsse unde minnen âne materie unde gebrûchen âne eigenschaft.
      Wir suln alliu dinc enpfâhen in der edelkeit, als sie diu êwige wîsheit
      in ir selber gezeiget unde geordent hât.

      Die armen des geistes die gânt ûz in selber und ûz allen creatûren:
      sie sint niht, sie hânt niht, sie würkent niht unt dise armen die sint
      niht wan daz sie sint von gnâden got mit gote: des selben enwizzent
      sie niht.
  - kind: translation
    label: Pratibhā Translation
    body: >
      "Blessed are the poor in spirit," etc. We ought to be eternally as poor
      as we were when we eternally were not. In our being we remain enduringly
      in Him, that which we are. We ought to receive all things, yet in the
      creator's presence. We ought to know God without any likeness and love
      without matter and enjoy without property [eigenschaft]. We ought to
      receive all things in that nobility in which eternal wisdom has displayed
      and ordered them in itself.

      The poor in spirit go out from themselves and from all creatures: they are
      nothing, they have nothing, they work nothing — and these poor ones are
      nothing except that they are, by grace, God with God; and of this very
      thing they do not know.

      ⚠ UNCERTAINTY: "dô wir êweclîch niht enwâren" — does Eckhart mean
      temporal pre-existence or an eternal non-being that persists alongside
      created existence? Both readings are defensible. "Eigenschaft" — more
      "appropriation" than mere "property." "Von gnâden got mit gote" — syntax
      genuinely ambiguous: "by grace, God with God" or "by God's grace, with
      God."
  - kind: commentary
    label: Pratibhā Commentary
    body: >
      To be poor in spirit is to be "eternally as poor as we were when we
      eternally were not" — not a call to renunciation in time but an
      invitation to recover a condition preceding time itself. The three
      negations (sint niht, hânt niht, würkent niht) are not stages of
      progressive stripping but simultaneous descriptions of one condition. The
      poor in spirit are not people who have given up possessions; they are
      those in whom the very structure of having, doing, and being-something
      has dissolved. The final clause is the paradox: these poor ones "are, by
      grace, God with God — and of this very thing they do not know." The
      not-knowing is structural: if the poor one knew he was God with God, that
      knowledge would constitute a possession, and poverty would be broken.
      Eckhart's poverty is self-erasing: it cannot be achieved, held, or
      recognized without ceasing to be what it is.

      The Pratyabhijñā tradition names this structure precisely:
      pratyabhijñā itself — recognition — is the act of seeing that what one
      seeks was always already the case. But Eckhart's poverty goes one step
      further than even Utpaladeva's formulation, because in the
      Pratyabhijñāhṛdayam the recognition is itself a liberating event —
      the soul recognizes and is freed. In Eckhart, even recognition would
      constitute a possession. The poor in spirit do not know they are God
      with God. The not-knowing is not ignorance to be remedied but the very
      structure of poverty fulfilled. This is the razor's edge: cit-śakti
      operating so transparently that it does not even register its own
      operation. Consciousness recognizing itself without producing a knower
      who could claim the recognition. The practitioner sits at this edge
      each time awareness is present without a commentary running about the
      fact of awareness. Eckhart calls it poverty. The Trika calls it
      sahaja — the natural state so natural it leaves no footprint.
  - kind: key_terms
    label: Key Terms
    items:
      - term: armûot des geistes (MHG)
        definition: >
          Poverty of spirit. From arm (poor) + muot (mind, disposition, spirit).
          Eckhart transforms the Beatitude from a moral injunction about
          material poverty into an ontological description: the soul that
          has returned to the condition before creation, where it was
          "eternally not." This is not deprivation but a positive condition
          of non-having that is structurally identical to divine simplicity.
      - term: eigenschaft (MHG)
        definition: >
          Property, but more precisely: appropriation, making-one's-own,
          self-possession. From eigen (own) + -schaft (condition). Eckhart
          uses it to name the fundamental error: not possessing things but
          the act of appropriation itself — the soul's claim to own its
          experiences, virtues, or even its relationship with God.
          "Gebrûchen âne eigenschaft" — to enjoy without appropriation — is
          the formula for poverty as Eckhart understands it.
      - term: bekennen (MHG)
        definition: >
          To know, to recognize, to cognize. Not purely intellectual — carries
          the connotation of direct acquaintance, closer to Latin cognitio
          than scientia. "Got bekennen âne gelîchnüsse" — to know God without
          any likeness — is apophatic cognition: a knowing that operates
          without images, concepts, or intermediary representations. Closely
          parallel to pratyabhijñā (recognition) in the Kashmiri tradition.
  - kind: resonances
    label: Cross-Tradition Resonances
    items:
      - citation: "Māṇḍūkya Upaniṣad, verse 7 (turīya)"
        resonance: >
          The Māṇḍūkya describes turīya as "not inward-turned cognition, not
          outward-turned, not both, not a mass of cognition, not cognitive, not
          non-cognitive" — a chain of negations structurally identical to
          Eckhart's "sint niht, hânt niht, würkent niht." Both texts use
          serial negation not as apophatic rhetoric but as an attempt to
          describe a positive condition that evades every predicate.
        divergence: >
          Turīya is the fourth state, always already present as the substrate
          of waking, dreaming, and deep sleep. Eckhart's poverty is framed
          as an achievement — something the soul must become — even though his
          own logic implies it is the soul's original condition. The
          Māṇḍūkya is more consistent in treating the realized state as
          discovered, not produced.
      - citation: "Rūmī, Mathnawī I (Story XI): 'Who is at the door? — It is Thou'"
        resonance: >
          Rūmī's lover who first says "'Tis I" and is refused, then returns
          saying "'Tis Thou" and is admitted, enacts the same logic as
          Eckhart's poverty: the self that claims to be something (even a
          lover) must be dissolved before union is possible. Both texts treat
          self-assertion as the structural barrier to the divine encounter.
        divergence: >
          Rūmī's frame is relational and affective — the lover burned by
          separation. Eckhart's is ontological and apathetic — the soul
          returns to a condition prior to any relationship. The Sufi path
          passes through love to annihilation; Eckhart's passes through
          nothingness to a poverty that was never absent.
  - kind: practice
    label: Practice (Abhyāsa)
    body: >
      For one breath, relinquish not a thing you have, but the sense of being
      someone who has things. Not the objects of experience, but the
      experiencer's claim to be experiencing. If something remains — some
      awareness that is not a someone — let even the recognition of that
      awareness fall away. What is left, if anything, is what Eckhart calls
      poverty.
