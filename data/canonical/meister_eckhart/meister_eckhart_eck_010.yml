section: Sermon 52 (DW II, 489)
sanskrit_devanagari: Der ist ein armer mensche, der niht enwil und niht enweiz und niht enhât.
sanskrit_iast: ''
translation_literal: That person is poor who wills nothing, knows nothing, and has nothing.
commentary: 'Eckhart’s “poverty” is not chiefly material deprivation but radical dispossession at the ground of the soul.
  To will nothing is to relinquish even spiritual self-assertion: one does not make God into an object of one’s projects.
  To know nothing is not anti-intellectualism; it means release from possessive, image-bound knowing, including the thought
  “I have God.” To have nothing is to stand without a private spiritual capital—virtue, experience, status, or consolation—to
  defend. Such emptiness is the condition of divine fullness: when creatures are no longer clung to as possessions of the
  self, God may act in the soul without obstruction. Eckhart’s point is sharper than ordinary renunciation. Even the desire
  to fulfill God’s will can remain subtly self-willed if it is held as something “mine.” The poor spirit is free enough to
  let God will and work in it.


  Key Terms


  **armer mensche** — “Poor person,” denoting spiritual dispossession rather than merely economic lack.

  **niht enwil** — “Wills nothing,” the relinquishment of self-directed desire, even in relation to God.

  **niht enweiz** — “Knows nothing,” freedom from possessive or image-bound knowing.

  **niht enhât** — “Has nothing,” utter non-possession at the soul’s ground.


  Cross-Tradition Resonances


  **Pseudo-Dionysius, Mystical Theology 1:** Dionysius approaches God through the stripping away of every affirmation and
  concept, paralleling Eckhart’s “knows nothing.” Divergence: Dionysius frames this ascent within a hierarchical Christian
  apophatic theology, whereas Eckhart’s formulation concentrates more radically on the poverty of the person’s own ground.

  **Bhagavad Gita 2.47:** The Gita’s counsel to act without claim upon the fruits of action parallels Eckhart’s refusal of
  self-willing and spiritual possession. Divergence: The Gita preserves disciplined action according to dharma, while Eckhart’s
  saying presses toward a more total emptiness of willing, knowing, and having.

  **Heart Sutra, “no attainment and no non-attainment”:** The Heart Sutra’s denial of attainment resonates with Eckhart’s
  release from the thought that one possesses God, knowledge, or spiritual achievement. Divergence: Buddhist emptiness denies
  inherent self-nature in all dharmas, whereas Eckhart’s dispossession remains oriented toward the birth or presence of God
  in the soul.'
practice: 'Sit quietly for ten minutes. On each exhale, name one thing you are inwardly claiming—an achievement, opinion,
  wound, role, or spiritual experience—and say silently: “Not mine to possess.” Do not try to produce emptiness; simply notice
  what loosens when you stop defending it.'
