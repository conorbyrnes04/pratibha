section: Von Abgeschiedenheit, opening
sanskrit_devanagari: 'Ich lobe die abegescheidenheit über alle tugende. Daz ist dar umbe: êrstlich, daz alle tugende stânt
  in der abegescheidenheit; und daz ist doch niht, wan daz abegescheidenheit stât sô nâhe bî dem nihte, daz niht sô nâhe bî
  got enist als abegescheidenheit.'
sanskrit_iast: ''
translation_literal: I praise detachment [Abgeschiedenheit] above every virtue. This is because, first, all virtues stand
  within detachment; yet this is as nothing, for detachment stands so near to nothingness that nothing is so near to God as
  detachment.
commentary: 'Eckhart’s claim is not that moral virtues are dispensable, but that they become fully free only when the self
  ceases to appropriate them. Detachment is not emotional numbness, withdrawal from creatures, or indifference to suffering.
  It is release from possessiveness: from needing one’s works, feelings, knowledge, holiness, or even image of God to confirm
  a self. Thus every virtue “stands within” detachment, because charity, humility, and justice are distorted when performed
  for spiritual gain or self-display. The startling proximity of detachment to “nothingness” names an emptied capacity rather
  than annihilation. Where the soul no longer clings to finite determinations, it is no longer occupied by its own will and
  can receive God without condition. The passage states Eckhart’s apophatic logic: God is not one object among objects; hence
  the soul approaches God not by acquiring a religious possession, but by becoming unpossessive.


  Key Terms


  **abegescheidenheit / Abgeschiedenheit** — Detachment or releasement: freedom from possessive attachment to self, things,
  and spiritual states.

  **tugende** — Virtues; good dispositions whose purity depends upon freedom from self-interest.

  **niht** — Nothingness: not mere nonbeing, but the ungraspable openness beyond finite objects and images.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47 and 3.19:**  Divergence: The Gita frames this freedom within dharma, devotion, and disciplined action;
  Eckhart frames it through the soul’s receptivity to the transcendent God.

  **The Cloud of Unknowing:**  Divergence: The Cloud emphasizes affective love directed toward God, whereas Eckhart gives
  a more radical account of detachment from even one’s own spiritual operations.

  **Zhuangzi, the ''fasting of the mind'':**  Divergence: Zhuangzi’s emptiness serves spontaneous accord with the Dao; Eckhart’s
  detachment is explicitly ordered to God’s birth and activity in the soul.'
practice: For ten minutes, sit quietly and notice each desire to secure an identity—competent, good, injured, spiritual, certain.
  On each exhale say inwardly, “Let it be,” without suppressing the thought. Then rest for a few breaths without seeking an
  experience, offering the unoccupied attention to God.
