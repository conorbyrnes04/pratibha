sanskrit_devanagari: 'Die lêrære lobent die minne grœzlîche, als sant Paulus tuot, der sprichet: ''in
  waz üebunge ich mac gestân, enhân ich niht minne, sô enbin ich nihtes niht''. Sô lobe ich abegescheidenheit
  vür alle minne. Von êrste dar umbe, wan daz beste, daz an der minne ist, daz ist, daz si mich twinget,
  daz ich got minne, sô twinget abegescheidenheit got, daz er mich minne. Nû ist vil edellîcher daz ich
  twinge got ze mir, dan daz ich mich twinge ze gote. Und ist daz dâ von, wan got kan sich învüeclîcher
  vüegen ze mir und baz vereinigen mit mir, dan ich mich künde vereinigen mit got. Daz abegescheidenheit
  twinge got ze mir, daz bewære ich dâ mite: wan ein ieglich dinc ist gerne an sîner natiurlîchen eigen
  stat. Nû ist gotes natiurlîchiu eigen stat einicheit und lûterkeit, daz kumet von abegescheidenheit.
  Dâ von muoz got von nôt sich selber geben einem abegescheidenen herzen. Ze dem andern mâle lobe ich
  abegescheidenheit vür minne, wan minne twinget mich dar zuo, daz ich alliu dinc lîde durch got, sô bringet
  mich abgescheidenheit dar zuo, daz ich nihtes enpfenclich bin wan gotes. Nû ist vil edeler nihtes niht
  enpfenclich sîn wan gotes, dan alliu dinc lîden durch got, wan in dem lîdenne hât der mensche etwaz
  ûfsehennes ûf die crêatûre, von der der mensche daz lîden hât, sô stât abegescheidenheit genzlîche ledic
  aller crêatûre.'
sanskrit_iast: Middle High German — see Original.
translation_literal: 'The teachers praise love very highly, as Saint Paul does, who says: ''Whatever practices
  I may undertake, if I have no love, then I am nothing at all.'' But I praise detachment (abegescheidenheit)
  above all love. First for this reason: the best thing about love is that it compels me to love God;
  but detachment compels God to love me. Now it is far nobler that I compel God toward myself than that
  I compel myself toward God. And this is because God can join himself to me more intimately and unite
  himself with me better than I could unite myself with God. That detachment compels God toward me I prove
  in this way: every thing gladly stays in its own natural place. Now God''s own natural place is oneness
  and purity, and this comes from detachment. Therefore God must of necessity give himself to a detached
  heart. In the second place I praise detachment above love because love compels me to suffer all things
  for God''s sake, whereas detachment brings me to the point where I am receptive to nothing but God.
  Now to be receptive to nothing but God is far nobler than to suffer all things for God''s sake, because
  in suffering a person still keeps some regard toward the creature from which he receives the suffering,
  whereas detachment stands completely free of all creatures.'
commentary: 'This passage stages a deliberate provocation: Eckhart quotes Paul''s famous elevation of
  love (1 Corinthians 13) only to rank something above it. The rhetorical daring is the point. Where devotional
  tradition makes love the highest virtue because it moves the soul toward God, Eckhart reverses the direction
  of movement. Love is my activity, my straining toward God; detachment (abegescheidenheit) is a kind
  of emptied stillness that draws God to me. The word ''compels'' (twingen) is startling applied to God,
  but Eckhart is not claiming to coerce the divine. His logic is metaphysical, not manipulative: everything
  rests naturally in its own proper place, and God''s proper place is oneness and purity (einicheit und
  lûterkeit). A heart that has become empty and detached has, in effect, become that pure and unified
  place—so God enters not by being forced but by the necessity of his own nature, the way water finds
  its level. The detached soul does not seize God; it becomes the space God cannot help but fill. The
  second argument sharpens the difference between love and detachment through the theme of suffering.
  Love still keeps one eye on creatures—the one who suffers ''for God'' remains in relationship to the
  thing causing the suffering. Detachment has no such backward glance; it is ''completely free of all
  creatures.'' Here we see Eckhart''s characteristic move: purity is measured by the absence of any created
  intermediary. The soul is most receptive not when it is doing the most, even the most heroic suffering,
  but when it is emptiest, receptive to God alone. This is the quiet ground from which, elsewhere in Eckhart,
  the birth of the Word can take place—an empty womb, not a busy hand.


  Key Terms


  **abegescheidenheit** — detachment; the soul''s release from all created things and self-will, becoming
  empty and receptive.

  **twingen** — to compel or constrain—used paradoxically here: detachment ''compels'' God not by force
  but by becoming the pure place God''s nature must fill.

  **einicheit und lûterkeit** — oneness and purity—named as God''s own natural ''place,'' which the detached
  heart comes to resemble.'
insight: Eckhart reverses the usual hierarchy of charity.
practice: 'Set aside ten minutes and try a practice of ''subtraction'' rather than ''addition.'' Most
  spiritual effort is additive—more prayer, more feeling, more striving toward God. Instead, sit still
  and notice each thing your attention is reaching toward: a worry, a plan, a grievance, even a pious
  wish. For each one, don''t fight it or analyze it—simply let it fall, releasing your grip and returning
  to bare, empty attention. You are not trying to feel God''s presence or generate love; you are only
  clearing the room. The point is to practice being ''receptive to nothing but God'' by ceasing, for these
  minutes, to be receptive to everything else. Notice how much of your inner life keeps ''one eye on the
  creature.'' Let even that noticing go quiet, and rest in the emptied space.'
