- kind: practice
  label: Practice (Abhyasa)
  body: 'For ten minutes, drop every effort to ''love God better.'' Instead, become available: sit as
    an empty place. Each time a looking-toward arises (outcome, image, self-story), release it and return
    to receptivity alone.'
