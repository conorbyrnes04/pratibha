- kind: translation
  label: Pratibha Translation
  body: 'The teachers praise love greatly, as Saint Paul does when he says that whatever practice I undertake,
    if I have no love, I am nothing. Yet I praise detachment above all love. First, because the best thing
    in love is that it compels me to love God, while detachment compels God to love me. Now it is far
    nobler that I compel God to me than that I compel myself to God — for God can join himself to me more
    inwardly and unite with me better than I can unite myself with God. That detachment compels God to
    me I prove thus: every thing gladly rests in its own natural place. God''s natural place is unity
    and purity, and these come from detachment. Therefore God must of necessity give himself to a detached
    heart. Second, I praise detachment above love because love compels me to suffer all things for God,
    while detachment brings me to be receptive of nothing except God. Now it is nobler to be receptive
    of nothing but God than to suffer all things for God — for in suffering a person still looks toward
    the creature from which the suffering comes, while detachment stands wholly free of creatures.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Eckhart reverses the usual hierarchy of charity. Love''s excellence is that it moves *me* toward
    God; detachment''s excellence is that it moves *God* toward me — because God''s "natural place" is
    unity and purity, and a detached heart is that place. The contested claim is almost scandalous in
    a tradition of striving: the highest act is not heroic loving effort but becoming the site where God
    must give himself. The second argument cuts deeper: even redemptive suffering still keeps a looking-toward
    (*ûfsehen*) at the creature that wounds. Detachment receives only God because it has drawn so near
    to nothingness that nothing subtle enough to lodge there remains — except God, who alone is simple
    enough to abide in such emptiness. Existentially: stop measuring spiritual progress by how hard you
    love or how much you endure; ask whether the heart still has a looking-toward that blocks receptivity.


    Key Terms


    **minne (MHG)** — "love," including caritas. Eckhart does not deny Paul''s ranking; he ranks a different
    excellence *above* love''s best feature.


    **enpfenclich (MHG)** — "receptive, capable of receiving." Detachment''s perfection is receptivity
    narrowed to God alone — not numbness, but selective openness.


    **natiurlîchiu eigen stat (MHG)** — "natural proper place." Cosmological image: as fire rises and
    stone falls, God rests in unity/purity; detachment *is* that place in the heart.


    Cross-Tradition Resonances


    **Plotinus, Enneads V.1 / VI.9 (the One as source that the soul returns to by stripping):** Both treat
    approach to the Absolute as a clearing rather than an addition.

    *Divergence:* Plotinus''s stripping is intellectual ascent toward the One; Eckhart''s is a heart-posture
    that *compels* God''s self-gift by ontological fit.


    **Vijñāna Bhairava (yuktis of emptying / resting as the gap):** Both prize a state free of object-grip
    so the Absolute can disclose itself.

    *Divergence:* VBT''s techniques are often momentary doorways in perception; Eckhart''s detachment
    is a standing virtue meant to become the soul''s abiding form.'
