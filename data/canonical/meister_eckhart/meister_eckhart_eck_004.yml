- kind: practice
  label: Practice (Abhyasa)
  body: For the rest of today, do not speak or write about your spiritual state — no progress report, no humility performance,
    no 'I'm working on detachment.' When the urge to narrate arises, be silent for three breaths and listen inward as if God
    might speak there.
