  while detachment stood immovable in itself when he became human — as it stood when he created heaven and earth. And because
  our Lord, wishing to become human, stood immovable in his detachment, Our Lady knew well that he desire'
translation_literal: 'Someone might say: all virtues were perfect in Our Lady, so perfect detachment must have been in her.
  If detachment is higher than humility, why did she praise her humility and not her detachment when she said, ''He has regarded
  the humility of his handmaid''? Why not: he has regarded the detachment of his handmaid? I answer: detachment and humility
  are in God, so far as we may speak of virtues in God. Know this: loving humility brought God to incline into human nature,
  while detachment stood immovable in itself when he became human — as it stood when he created heaven and earth. And because
  our Lord, wishing to become human, stood immovable in his detachment, Our Lady knew well that he desired the same of her,
  and that in this matter he regarded her humility, not her detachment. So she stood immovable in her detachment and praised
  her humility, not her detachment. Had she so much as thought with one word of her detachment — ''he regarded my detachment''
  — that detachment would have been troubled and would no longer have been whole and perfect, for a going-out would have occurred.
  No going-out can be so small that detachment remains unblemished in it. So you have the reason she praised humility and
  not detachment. Therefore the prophet said: I will be silent and hear what my God and Lord may speak *in* me — as if to
  say: if God would speak to me, let him come in here; I will not go out.'
commentary: 'The Marian puzzle teaches a discipline of silence about the highest state. Humility can be *named* because naming
  it is congruent with its outward bow; detachment cannot be named without performing the very going-out that ruins it. Mary''s
  wisdom is double: she keeps detachment immovable while offering humility as the speakable surface God regards for the Incarnation''s
  work. The prophet''s line seals the practice: do not go out to fetch God; be silent so God can speak *in*. The contested
  pastoral implication is sharp: talking about one''s detachment, advertising one''s emptiness, or making a spiritual brand
  of non-attachment is already the fall. Existentially: the deepest work may be the one you refuse to narrate.


  Key Terms


  **unbewegelich (MHG)** — "immovable." God''s and Mary''s detachment share this quality; motion toward creatures (even verbal)
  is the threat.


  **ûzganc (MHG)** — "going-out." Even a word of self-reference about detachment counts as exit.


  **in mich / hin ûz (MHG)** — "into me" / "outward." The spatial grammar of contemplation: God enters; the soul does not
  exit to seek.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47–2.48 (act without clinging to fruits / even to the act''s spiritual credit):** Both warn that claiming
  the fruit — including the fruit of being detached — rebinds.

  *Divergence:* The Gītā keeps the field of action (karma); Eckhart''s silence is about not exiting the ground even by holy
  speech.


  **Laozi / Tao Te Ching (the Way that can be named is not the constant Way):** Both treat naming the highest as a betrayal
  of it.

  *Divergence:* Daoist namelessness is cosmic; Eckhart''s unnameable detachment is a heart-state ordered to personal divine
  presence.'
insight: ''
practice: For the rest of today, do not speak or write about your spiritual state — no progress report, no humility performance,
  no 'I'm working on detachment.' When the urge to narrate arises, be silent for three breaths and listen inward as if God
  might speak there.
sanskrit_devanagari: 'Nû möhte ein mensche sprechen: nû wâren doch alle tugende volkomenlîche in unser vrouwen, und alsô muoste
  ouch volkomeniu abegescheidenheit in ir sîn. Ist nû abegescheidenheit hœher dan dêmüeticheit, war umbe ruomte sich danne
  unser vrouwe ir dêmüeticheit und niht ir abegescheidenheit, dô si sprach: ''quia respexit dominus humilitatem ancillae suae'',
  daz ist: ''er sach ane die dêmüeticheit sîner diernen'', - war umbe ensprach si niht: er sach ane die abegescheidenheit
  sîner diernen? Des antwürte ich alsô und spriche, daz in gote ist abegescheidenheit und dêmüeticheit, als verre wir tugende
  von gote gesprechen mügen. Nû solt dû wizzen, daz diu minnebære dêmüeticheit got dâ zuo brâhte, daz er sich neigete in menschlîche
  natûre, und stuont abegescheidenheit unbewegelich in ir selber, dô er mensche wart, als si tete, dô er himelrîche und ertrîche
  beschuof, als ich dir her nâch sagen wil. Und wan unser herre, dô er mensche werden wolte, unbewegelich stuont an sîner
  abegescheidenheit, dô weste unser vrouwe wol, daz er des selben ouch von ir begerte und daz er in der sache anesach ir dêmüeticheit
  und niht ir abegescheidenheit. Dâ von stuont si unbewegelich in ir abegescheidenheit und ruomte sich ir dêmüeticheit und
  niht ir abegescheidenheit. Und hæte si niuwan gedâht mit einem worte ir abegescheidenheit, daz si gesprochen hæte: er sach
  ane mîne abegescheidenheit, dâ mite wære diu abegescheidenheit betrüebet worden und wære niht ganz noch volkomen gewesen,
  wan dâ wære ein ûzganc geschehen. Sô enmac kein ûzganc sô kleine gesîn, in dem diu abegescheidenheit müge âne mâsen blîben.
  Und alsô hâst dû die sache, war umbe sich unser vrouwe ruomte ir dêmüeticheit und niht ir abegescheidenheit. Dâ von sprach
  der wîssage: ''audiam, quid loquatur in me dominus deus'', daz ist gesprochen: ''ich wil'' swîgen und wil ''hœren, waz mîn
  got und mîn herre in mich rede'', als ob er spræche: wil got ze mir reden, sô kome her in mich, ich enwil niht hin ûz.'
