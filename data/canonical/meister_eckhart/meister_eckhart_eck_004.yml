sanskrit_devanagari: 'Nû möhte ein mensche sprechen: nû wâren doch alle tugende volkomenlîche in unser vrouwen, und alsô muoste
  ouch volkomeniu abegescheidenheit in ir sîn. Ist nû abegescheidenheit hœher dan dêmüeticheit, war umbe ruomte sich danne
  unser vrouwe ir dêmüeticheit und niht ir abegescheidenheit, dô si sprach: ''quia respexit dominus humilitatem ancillae suae'',
  daz ist: ''er sach ane die dêmüeticheit sîner diernen'', - war umbe ensprach si niht: er sach ane die abegescheidenheit
  sîner diernen? Des antwürte ich alsô und spriche, daz in gote ist abegescheidenheit und dêmüeticheit, als verre wir tugende
  von gote gesprechen mügen. Nû solt dû wizzen, daz diu minnebære dêmüeticheit got dâ zuo brâhte, daz er sich neigete in menschlîche
  natûre, und stuont abegescheidenheit unbewegelich in ir selber, dô er mensche wart, als si tete, dô er himelrîche und ertrîche
  beschuof, als ich dir her nâch sagen wil. Und wan unser herre, dô er mensche werden wolte, unbewegelich stuont an sîner
  abegescheidenheit, dô weste unser vrouwe wol, daz er des selben ouch von ir begerte und daz er in der sache anesach ir dêmüeticheit
  und niht ir abegescheidenheit. Dâ von stuont si unbewegelich in ir abegescheidenheit und ruomte sich ir dêmüeticheit und
  niht ir abegescheidenheit. Und hæte si niuwan gedâht mit einem worte ir abegescheidenheit, daz si gesprochen hæte: er sach
  ane mîne abegescheidenheit, dâ mite wære diu abegescheidenheit betrüebet worden und wære niht ganz noch volkomen gewesen,
  wan dâ wære ein ûzganc geschehen. Sô enmac kein ûzganc sô kleine gesîn, in dem diu abegescheidenheit müge âne mâsen blîben.
  Und alsô hâst dû die sache, war umbe sich unser vrouwe ruomte ir dêmüeticheit und niht ir abegescheidenheit. Dâ von sprach
  der wîssage: ''audiam, quid loquatur in me dominus deus'', daz ist gesprochen: ''ich wil'' swîgen und wil ''hœren, waz mîn
  got und mîn herre in mich rede'', als ob er spræche: wil got ze mir reden, sô kome her in mich, ich enwil niht hin ûz.'
