section: German Sermon 13
sanskrit_devanagari: Daz ouge, dâ ich got mit sihe, daz ist daz selbe ouge, dâ got mich mit sihet. Mîn ouge und gotes ouge,
  daz ist ein ouge und ein sehen und ein bekennen und ein minnen.
sanskrit_iast: ''
translation_literal: The eye with which I see God is the same eye with which God sees me. My eye and God’s eye are one eye,
  one seeing, one knowing, and one loving.
commentary: 'Eckhart’s daring sentence does not simply identify the empirical human subject with God. Its setting is the soul’s
  breakthrough beyond images, possessive selfhood, and creaturely “this” and “that,” into the ground where God is known not
  as an external object but in the divine act of knowing itself. The “eye” names a unified spiritual capacity: seeing, knowing,
  and loving are finally inseparable. Yet the claim is not a license for egoic self-deification. The ordinary self does not
  become the divine essence by ownership; rather, in detachment (Abgeschiedenheit), it relinquishes its claim to stand apart
  and to make God into an object. God’s vision of the soul and the soul’s vision of God meet in the birth of the Word within
  the soul’s ground. The language is deliberately paradoxical, pressing thought beyond a relation between two independently
  graspable things.


  Key Terms


  **ouge** — “Eye”: the soul’s spiritual capacity for direct knowing, not merely bodily sight.

  **sehen** — “Seeing”: contemplative apprehension in which knowing and loving converge.

  **bekennen** — “Knowing” or recognizing: participatory knowledge rather than detached observation.

  **minnen** — “Loving”: the soul’s union with God is inseparable from love.


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9:** Plotinus says that in the highest vision seer and seen are no longer divided; the intellect
  becomes what it contemplates.

  **The Bhagavad Gita 6.29:** The yogin sees the Self in all beings and all beings in the Self, overcoming ordinary separateness
  in contemplative vision.

  **The Gospel of John 17:21–23:** Jesus prays that his followers may be one “as” Father and Son are one, grounding communion
  in divine indwelling.'
practice: 'Sit quietly for ten minutes. On each in-breath, release the effort to picture or grasp God; on each out-breath,
  ask inwardly: “What if I am already seen?” When thoughts arise, do not argue with them. Return to simple, receptive awareness,
  ending with a concrete act of unselfish attention toward another person.'
