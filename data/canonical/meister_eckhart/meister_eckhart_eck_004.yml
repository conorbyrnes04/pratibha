translation_literal: 'Now someone might say: surely all the virtues were present in perfect fullness in Our Lady, and so perfect
  abegescheidenheit (detachment) must also have been in her. If detachment is higher than humility, then why did Our Lady
  boast of her humility and not of her detachment when she said, ''quia respexit dominus humilitatem ancillae suae,'' that
  is, ''he looked upon the humility of his handmaid''? Why did she not say, he looked upon the detachment of his handmaid?
  To this I answer and say that in God there is both detachment and humility, insofar as we can speak of virtues in God at
  all. Now you must understand that it was lovable humility that brought God to bend down into human nature, while detachment
  stood unmoved in itself when he became man, just as it did when he created heaven and earth, as I will explain to you afterward.
  And because Our Lord, when he willed to become man, stood unmoved in his detachment, Our Lady knew well that he desired
  the same of her too, and that in this matter he looked upon her humility and not upon her detachment. For this reason she
  stood unmoved in her detachment and boasted of her humility and not of her detachment. And had she thought of her detachment
  with even a single word, saying, ''he looked upon my detachment,'' then the detachment would have been disturbed and would
  not have remained whole and perfect, for then a going-out would have occurred. And no going-out can ever be so small that
  detachment could remain in it without a blemish. And so now you have the reason why Our Lady boasted of her humility and
  not of her detachment. Therefore the prophet said, ''audiam, quid loquatur in me dominus deus,'' which means, ''I will be
  silent and I will hear what my God and my Lord speaks within me'' — as if he said: if God wants to speak to me, let him
  come into me, for I will not go out.'
commentary: 'This passage turns on a subtle distinction between two virtues that Eckhart elsewhere ranks: humility and abegescheidenheit
  (detachment). The imagined objector presses a sharp question — if Mary was perfect in all virtues, and if detachment is
  the higher virtue, why does the Magnificat name humility rather than detachment? Eckhart''s answer is not that detachment
  was absent, but that detachment, by its very nature, cannot be named without ceasing to be itself. The moment Mary would
  have said ''he looked upon my detachment,'' a movement outward (ûzganc) would already have taken place — a turning of attention
  toward the self and its own achievement. Humility can be spoken because humility is precisely the posture of stooping, of
  receptivity; God''s own descent into human nature is described here as an act of ''lovable humility.'' But detachment ''stood
  unmoved in itself,'' immobile as at creation, precisely because it does not go out toward anything, not even toward the
  act of praising it. The deep point is that the highest state is the one that does not reflect on itself. Any self-observation,
  however slight, is a ''going-out'' that stains (âne mâsen — ''without blemish'' is what detachment must remain). Eckhart
  insists that no exit can be small enough to be harmless. This is why the treatise''s title urges: do not name the detachment.
  The prophet''s word seals the teaching — ''I will be silent and hear what God speaks within me.'' The stillness is not passive
  laziness but the refusal to move outward: ''let him come into me, for I will not go out.'' Here Eckhart''s characteristic
  theme surfaces — the birth of the Word in the ground of the soul happens only where the soul stays interior, unmoving, unspeaking,
  so that God speaks and the soul merely receives. To announce one''s own detachment would already be to speak instead of
  to hear.


  Key Terms


  **abegescheidenheit** — Detachment or releasement; the soul''s unmoved interior standing that goes out toward nothing, not
  even toward praising itself.

  **ûzganc** — A ''going-out''; any movement of attention outward from the still center, which for Eckhart blemishes detachment.

  **dêmüeticheit** — Humility; the receptive stooping posture, which unlike detachment can be spoken and which drew God down
  into human nature.'
