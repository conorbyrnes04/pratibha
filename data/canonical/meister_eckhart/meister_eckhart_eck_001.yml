sanskrit_devanagari: 'Ich hân der geschrift vil gelesen, beidiu von den heidenischen meistern und von
  den wîssagen und von der alten und niuwen ê, und hân mit ernste und mit ganzem vlîze gesuochet, welhiu
  diu hœhste und diu beste tugent sî, dâ mite der mensche sich ze got allermeist und aller næhest gevüegen
  müge und mit der der mensche von gnâden werden müge, daz got ist von natûre, und dâ mite der mensche
  aller glîchest stande dem bilde, als er in gote was, in dem zwischen im und gote kein underscheit was,
  ê daz got die crêatûre geschuof. Und sô ich alle die geschrift durchgründe, als verre mîn vernunft erziugen
  und bekennen mac, sô envinde ich niht anders, wan daz lûteriu abegescheidenheit ob allen dingen sî,
  wan alle tugende hânt etwaz ûfsehennes ûf die crêatûre, sô stât abegescheidenheit ledic aller crêatûren.
  Dar umbe sprach unser herre ze Marthâ: ''unum est necessarium'', daz ist als vil gesprochen: Marthâ,
  wer unbetrüebet und lûter welle sîn, der muoz haben einez, daz ist abegescheidenheit.'
sanskrit_iast: Middle High German — see Original.
translation_literal: 'I have read a great deal of what has been written, both by the pagan masters and
  by the prophets and in the Old and New Law, and I have searched in earnest and with all diligence to
  find which is the highest and best virtue — the one by which a person might join himself most fully
  and most closely to God, and by which a person might become through grace what God is by nature, and
  by which a person might stand most like the image he was in God, in which there was no distinction between
  him and God before God created creatures. And when I search all these writings through to the ground,
  as far as my reason can reach and know, I find nothing else but that pure abegescheidenheit (detachment)
  stands above all things; for all other virtues have some regard toward creatures, whereas detachment
  stands free of all creatures. This is why our Lord said to Martha: ''unum est necessarium'' — which
  means: Martha, whoever would be untroubled and pure must have one thing, and that is detachment.'
commentary: 'Eckhart opens by staging himself as a seeker who has combed the entire tradition — Greek
  philosophy, the prophets, both Testaments — looking for a single organizing virtue. This is more than
  a rhetorical flourish. It sets up his radical claim: the crown of the spiritual life is not love, humility,
  or obedience, but abegescheidenheit (detachment). His argument is precise. Every other virtue, however
  excellent, still has ''some regard toward creatures'' — love reaches toward a beloved, humility positions
  the self relative to others, mercy bends toward the needy. Each remains tethered to something outside
  God. Detachment alone stands ''free of all creatures''; it has no object but the empty, receptive space
  in which God can act. The passage also carries Eckhart''s characteristic backward reach toward the pre-creaturely
  image. He describes a state in which ''there was no distinction between him and God before God created
  creatures.'' The soul''s true image is not something to be built but something to be recovered — the
  person as she was in God, before differentiation, before the whole apparatus of self and world. Detachment
  is the practice that dissolves the accretions of creatureliness and returns the soul to that undifferentiated
  ground. Notice his exegetical daring: he reads ''unum est necessarium'' — the one thing necessary from
  the Martha and Mary story — not as contemplation over action, but as detachment itself. To be ''untroubled
  and pure'' is to hold to the one thing, and that one thing is the emptiness that makes union possible.
  The becoming-what-God-is-by-nature-through-grace is the deification at the heart of Eckhart''s mysticism,
  and its precondition is not a full heart but an empty one.


  Key Terms


  **abegescheidenheit** — Detachment; the state of standing free and cut off from all created things,
  which Eckhart ranks as the highest virtue.

  **von gnâden werden, daz got ist von natûre** — To become through grace what God is by nature — Eckhart''s
  formula for deification/union.

  **bilde** — The image the soul was in God before creation, in which there was no distinction between
  soul and God.'
insight: Detachment is not one virtue among others but the condition that empties the field so that God
  alone can fill it.
practice: 'Choose one hour today and try a single experiment in detachment. As feelings, preferences,
  and reactions arise — irritation at a delay, craving for a snack, the pull to check your phone, satisfaction
  at praise — simply notice each one and mentally set it down without acting to satisfy or suppress it.
  Do not fight the feeling; just decline to attach yourself to it. Say inwardly, ''this too has some regard
  toward creatures,'' and let it pass through without gripping. The goal is not coldness but freedom:
  to discover the still, unclaimed space underneath your reactions, the space Eckhart calls detached and
  free of all creatures. At the end of the hour, note whether you felt more ''untroubled and pure'' —
  not because you got what you wanted, but because you needed less.'
