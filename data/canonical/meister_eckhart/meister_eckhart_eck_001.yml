- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, notice three moments when attention leans toward a creature — a person, outcome, or status
    — as if that lean were necessary. For each, pause one breath and ask: what remains if I do not look
    toward it? Rest there without forcing an answer.'
