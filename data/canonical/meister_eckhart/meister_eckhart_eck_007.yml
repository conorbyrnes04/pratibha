translation_literal: 'Someone might ask: did Christ also have immovable detachment when he said, ''My soul is sorrowful unto
  death,'' and Mary, standing under the cross — of whom so much lament is told? How can this stand with immovable detachment?
  Know that the masters say there are two persons in every human being: the outer person, which is sensibility, served by
  the five senses, yet working by the soul''s power; and the inner person, which is one''s inwardness. A spiritual person
  who loves God uses the soul''s powers in the outer person no further than the five senses necessarily require; and inwardness
  turns to the senses only as their guide and guardian, lest they use their objects bestially. Whatever powers the soul has
  beyond what it gives the five senses, it gives entirely to the inner person. Now know: the outer person may be in activity
  while the inner person stands wholly free and immovable. Christ also had an outer and an inner person, and so did Our Lady;
  whatever they said of outer matters, they said according to the outer person, while the inner stood in immovable detachment.
  So Christ spoke when he said his soul was sorrowful unto death; and whatever Our Lady lamented, her inwardness still stood
  in immovable detachment. Take a likeness: a door opens and closes on a hinge. I liken the outer board of the door to the
  outer person, and the hinge to the inner person. When the door opens and closes, the outer board moves back and forth, yet
  the hinge remains in one place, immovable, and is never altered. Just so is it here, if you can take it rightly.'
commentary: 'Eckhart refuses the false choice between feeling and detachment. Christ''s agony and Mary''s lament are real
  in the outer person; they do not require the inner hinge to swing. The contested pastoral error is equating holiness with
  numbness, or equating emotion with spiritual failure. The door-hinge image is precise engineering: motion at the periphery
  is compatible with stillness at the axis. Existentially: let the outer life feel, speak, work, and even weep — while asking
  whether the inner axis is still trying to become a swinging board.


  Key Terms


  **ûzer mensche / inner mensche (MHG)** — "outer person / inner person." Anthropological dual register, not two selves to
  war against each other but two functions.


  **angel (MHG)** — "hinge." The still pivot; detachment''s seat.


  **sinnelicheit (MHG)** — "sensibility." Legitimate within need; dangerous when it commandeers all soul-power.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2 (the wise one acts while established in the Self):** Both allow full outer engagement without inner displacement.

  *Divergence:* The Gītā''s steadfastness is often framed as buddhi-yoga in action; Eckhart''s hinge is explicitly the seat
  of *abegescheidenheit* amid pathos.


  **Spandakārikā (vibration without loss of the still ground):** Both hold movement and ground together.

  *Divergence:* Spanda names the Absolute *as* vibratory; Eckhart keeps a sharper outer/inner split for pastoral clarity.'
