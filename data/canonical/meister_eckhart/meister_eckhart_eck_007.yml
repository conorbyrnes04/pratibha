- kind: practice
  label: Practice (Abhyasa)
  body: 'In the next strong emotion (joy, anger, grief), do not suppress the outer movement. Place attention for thirty seconds
    on the ''hinge'': the awareness that is not identical with the swinging feeling. Whisper: the door moves; the hinge need
    not.'
