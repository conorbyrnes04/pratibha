translation_literal: 'Now someone might ask: did Christ also possess this unmoved detachment (abegescheidenheit), when he
  said, ''My soul is sorrowful unto death,'' and Mary, when she stood beneath the cross, of whose lament so much is told —
  how can all this stand together with unmoved detachment? Here you should know that the masters say that in every human being
  there are two kinds of person. The one is called the outer person; that is the sense-life, served by the five senses, though
  the outer person acts by the power of the soul. The other is called the inner person; that is the inwardness of the human
  being. Now you should know that a spiritual person, who loves God, uses the soul''s powers in the outer person no further
  than the five senses strictly require; and the inwardness does not turn toward the five senses except insofar as it is a
  guide and leader of the five senses and watches over them, so that they do not use their objects in an animal way, as some
  people do who live according to their bodily pleasure, like beasts that lack reason — and such people are more properly
  called beasts than people. Whatever powers the soul has beyond what it gives to the five senses, the soul gives all of these
  to the inner person; and when the inner person has some high, noble object, then it draws to itself all the powers it had
  lent to the five senses, and then the person is called senseless and rapt, for his object is an image grasped by the intellect,
  or something intelligible without image. Yet know that God requires of every spiritual person that he love him with all
  the powers of the soul. That is why he said: ''Love your God with your whole heart.'' Now there are some people who spend
  the soul''s powers entirely in the outer person. These are the people who turn all their senses and reason toward perishable
  goods; they know nothing at all of the inner person. Now you should know that the outer person can be engaged in activity
  while the inner person stands wholly free of it and unmoved. Now in Christ too there was an outer person and an inner person,
  and likewise in Our Lady; and whatever Christ and Our Lady ever said about outward matters, they said according to the outer
  person, while the inner person stood in an unmoved detachment. And so Christ spoke when he said, ''My soul is sorrowful
  unto death,'' and whatever Our Lady lamented, and other words she spoke — yet all the while her inwardness stood in an unmoved
  detachment. Take an image of this: a door swings open and shut on a hinge. Now I compare the outer board of the door to
  the outer person, and I compare the hinge to the inner person. When the door goes open and shut, the outer board moves back
  and forth, and yet the hinge stays in one place, unmoved, and is never changed by it. It is the same way here, if you know
  how to do it rightly.'
commentary: 'This passage answers a pointed objection to Eckhart''s whole teaching on abegescheidenheit (detachment): if detachment
  means being unmoved, how could Christ grieve unto death, or Mary weep beneath the cross? Eckhart refuses to solve this by
  softening detachment or by denying that Christ genuinely suffered. Instead he locates suffering and stillness in two different
  strata of the person. The ''outer person'' (ûzer mensche) is the sensory, active self that meets the world through the five
  senses; the ''inner person'' (inner mensche) is the soul''s inwardness, its innerkeit. Crucially, Eckhart is not describing
  two separate beings but one soul functioning at two depths: the outer person ''acts by the power of the soul,'' and the
  same soul that lends powers to the senses can withdraw them into itself. The key claim is that the inner person can remain
  ''unmoved'' (unbewegelich) precisely while the outer person is fully engaged — even in agony. Detachment, then, is not numbness
  or absence of feeling. Christ really felt sorrow unto death; Mary really lamented. But that turbulence belonged to the outer
  person, while the ground of the soul stood untouched. This is why the hinge-and-door image is so precise: the visible board
  swings through its whole arc of motion, yet the hinge on which it turns does not itself move. What moves and what holds
  still are not two doors but one door rightly understood. Eckhart also guards against a misreading: detachment is not withdrawal
  from love or activity. He insists God ''requires of every spiritual person that he love him with all the powers of the soul''
  — the whole point of pulling the powers inward is not to shut down feeling but to redirect the soul toward its highest object,
  an intelligible reality beyond images. He contrasts this with two failures: living merely for bodily pleasure (living as
  beasts) and spending all the soul''s powers on ''perishable goods'' so that one never discovers the inner person at all.
  The unmoved ground is not a retreat from engagement; it is the still center that makes true engagement possible. To act
  from the hinge rather than the swinging board is to remain free even while doing hard, painful, fully human work.


  Key Terms


  **abegescheidenheit** — detachment; the soul''s inner freedom and unmovedness, compatible with genuine feeling and activity
  in the outer person

  **ûzer mensche / inner mensche** — the outer person (sensory, active self) and the inner person (the soul''s inwardness),
  two depths of one soul

  **unbewegelich** — unmoved; the still, unchanging condition of the inner ground, imaged as the door''s hinge'
insight: ''
practice: 'The next time your body reacts sharply—tears, trembling, a cry—place your hand on your chest and notice the stillness
  beneath the storm, the depth of soul that watches the five senses move without being moved by them. Let the outer person
  grieve or rage while you whisper inwardly: the inner remains untouched.'
sanskrit_devanagari: 'Nû möhte ein mensche sprechen: hâte Kristus ouch unbewegelîche abegescheidenheit, dô er sprach: ''mîn
  sêle ist betrüebet biz in den tôt'' und Marîâ, dô si stuont under dem kriuze, und saget man doch vil von ir klage, - wie
  mac diz allez bestân mit unbewegelîcher abegescheidenheit? Hie solt dû wizzen, daz die meister sprechent, daz an einem ieglîchen
  menschen zweierhande menschen sint: der eine heizet der ûzer mensche, daz ist diu sinnelicheit; dúm menschen dienent die
  fünf sinne und würket doch der ûzer mensche von kraft der sêle. Der ander mensche heizet der inner mensche, daz ist des
  menschen innerkeit. Nû solt dû wizzen, daz ein geistlîcher mensche, der got minnet, gebrûchet der sêle krefte in dem ûzern
  menschen niht vürbaz, wan als die fünf sinne ze nôt bedürfen; und diu inwendicheit enkêret sich niht ze den fünf sinnen,
  wan als verre als si ein wîser und ein leiter ist der fünf sinne und ir hüetet, daz sie niht gebrûchent irs gegenwurfes
  nâch vihelicheit, als etlîche liute tuont, die lebent nâch ir lîplîcher wollust, als diu vihe tuont, diu âne vernunft sint;
  und solhe liute heizent eigenlîcher vihe dan liute. Und swaz diu sêle krefte hât über daz si den fünf sinnen gibet, die
  krefte gibet diu sêle alle dem innern menschen, und sô dúr mensche etwaz hôhes edeles gegenwurfes hât, sô ziuhet si an sich
  alle die krefte, die si den fünf sinnen gelihen hât, und heizet der mensche sinnelôs und verzücket, wan sîn gegenwurf ist
  ein vernünftic bilde oder etwaz vernünftiges âne bilde. Doch wizze, daz got von einem ieclîchen geistlîchen menschen muotet,
  daz er in minne mit allen kreften der sêle. Dâ von sprach er: ''minne dînen got von ganzem herzen''. Nû sint etlîche liute,
  die verzernt der sêle krefte alzemâle in dem ûzern menschen. Daz sint die liute, die alle ir sinne und vernunft kêrent ûf
  zergenclich guot, die enwizzen nihtes niht von dem innern menschen. Nû solt dû wizzen, daz der ûzer mensche mac in üebunge
  sîn, daz doch der inner mensche des genzlîche ledic stât und unbewegelich. Nû was in Kristô ouch ein ûzwendiger mensche
  und ein inwendiger mensche, und ouch in unser vrouwen; und swaz Kristus und unser vrouwe ie geredeten von ûzern sachen,
  daz tâten sie nâch dem ûzern menschen, und stuont der inner mensche in einer unbewegelîchen abegescheidenheit. Und alsô
  redete Kristus, dô er sprach: ''mîn sêle ist betrüebet biz in den tôt'', und swaz unser vrouwe klagete, und ander rede,
  die si tete, sô stuont doch alzît ir inwendicheit in einer unbewegelîchen abegescheidenheit. Und nim des ein ebenbilde:
  ein tür gât in einem angel ûf und zuo. Nû glîche ich daz ûzer bret an der tür dem ûzern menschen, sô glîche ich den angel
  dem innern menschen. Sô nû diu tür ûf und zuo gât:, sô wandelt sich daz ûzer bret hin und her, und blîbet doch der angel
  an einer stat unbewegelich und enwirt dar umbe niemer verwandelt. Ze glîcher wîse ist ez ouch hie, ob dû im kanst rehte
  tuon.'
