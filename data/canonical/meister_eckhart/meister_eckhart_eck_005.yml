section: Sermon 5b (DW I.87–95)
sanskrit_devanagari: Lass Gott Gott in dir sin. (Let God be God in you.)
sanskrit_iast: ''
translation_literal: 'Let God be God in you. So long as you hold yourself back—so long as you cling to your own will, your
  own understanding, your own desire—God cannot work purely in you. The soul must become empty, a bare desert, that God may
  work there without hindrance. When you cease from all your own working, all your own striving, all your own willing, then
  God works. But mark: this is not idleness. Rather, it is the highest activity—the soul''s perfect receptivity to the divine
  action. In this nakedness, in this letting-go, God pours Himself into you without measure. You become a pure vessel. You
  become, in truth, nothing—and in that nothingness, everything.'
commentary: 'This passage crystallizes Eckhart''s radical theology of Gelassenheit (releasement). The imperative ''lass Gott
  Gott sin'' is not passive resignation but active surrender—a paradoxical ''doing by undoing.'' Eckhart distinguishes sharply
  between human willing and divine willing: the soul''s cessation of self-assertion is the precise condition for God''s unobstructed
  operation. The ''bare desert'' (öde Wüste) echoes apophatic mysticism and anticipates later Rhineland spirituality. Crucially,
  Eckhart rejects quietism: this emptiness is supremely active because it aligns the soul with God''s eternal generativity.
  The final paradox—''nothing'' becoming ''everything''—points to the soul''s coincidence with the Godhead beyond personhood,
  a doctrine that troubled ecclesiastical authorities but remains central to his vision of mystical union.


  Key Terms


  **lass** — Let, allow, or release; the imperative of relinquishment rather than self-assertion.

  **Gott** — God, invoked both as the agent and as the divine reality to be allowed to act.

  **sin** — Middle High German “be,” expressing the injunction that God be God within the soul.


  Cross-Tradition Resonances


  **Bhagavad Gita 3.30:** Krishna instructs Arjuna to surrender all actions to the divine, relinquishing possessiveness and
  egoic claim over action. Divergence: The Gita retains a summons to perform one’s prescribed duty, whereas Eckhart’s formulation
  stresses inward cessation and divine operation without emphasizing social duty.

  **Tao Te Ching 48:** The Daoist saying that one “does less and less” until non-forcing leaves nothing undone parallels Eckhart’s
  undoing of self-will so a deeper agency may act. Divergence: The Dao is not a personal God who works within the soul, and
  Daoist wuwei does not entail Eckhart’s theological distinction between creature and Creator.

  **John 15:5:** Jesus’ declaration that apart from him disciples can do nothing parallels Eckhart’s claim that fruitful action
  depends upon divine indwelling rather than autonomous human effort. Divergence: John frames the relation through abiding
  in Christ and bearing fruit, while Eckhart’s language more radically emphasizes emptying the soul of its own willing and
  knowing.'
practice: 'Sit in silence. Bring to mind a habitual self-assertion—a cherished opinion, a fear, a desire for recognition.
  Name it clearly. Then, without suppressing it, consciously release it: ''I let this go. I let God be God here.'' Do not
  replace it with another thought. Rest in the bare awareness beneath the thought. Return to this release whenever self-assertion
  arises. Over weeks, notice how this ''doing nothing'' paradoxically opens a clarity and responsiveness that your striving
  never achieved.'
