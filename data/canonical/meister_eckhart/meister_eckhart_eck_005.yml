sanskrit_devanagari: 'Nû maht dû vrâgen, waz abegescheidenheit sî, wan si als gar edel an ir selber ist? Hie solt dû wizzen,
  daz rehtiu abegescheidenheit niht anders enist, wan daz der geist alsô unbewegelich stande gegen allen zuovellen liebes
  und leides, êren, schanden und lasters als ein blîgîn berc unbewegelich ist gegen einem kleinen winde. Disiu unbewegelîchiu
  abegescheidenheit bringet den menschen in die grœste glîcheit mit gote. Wan daz got ist got, daz hât er von sîner unbewegelîchen
  abegescheidenheit, und von der abegescheidenheit hât er sîne lûterkeit und sîne einvalticheit und sîne unwandelbærkeit.
  Und dâ von, sol der mensche gote glîch werden, als verre als ein crêatûre glîcheit mit gote gehaben mac, daz muoz geschehen
  mit abegescheidenheit. Diu ziuhet danne den menschen in lûterkeit und von der lûterkeit in einvalticheit und von der einvalticheit
  in unwandelbærkeit, und diu dinc bringent eine glîcheit zwischen gote und dem menschen; und diu glîcheit muoz beschehen
  in gnâden, wan diu gnâde ziuhet den menschen von allen zîtlîchen dingen und liutert in von allen zergenclîchen dingen. Und
  dû solt wizzen: lære sîn aller crêatûre ist gotes vol sîn, und vol sîn aller crêatûre ist gotes lære sîn.'
sanskrit_iast: Middle High German — see Original.
translation_literal: 'Now you might ask: what is abegescheidenheit (detachment), since it is so utterly noble in itself? Here
  you should understand that true detachment is nothing other than this: that the spirit stands as unmoved toward all the
  accidents of joy and sorrow, honor, disgrace, and shame as a mountain of lead stands unmoved before a slight breeze. This
  unmoved detachment brings a person into the greatest likeness to God. For the fact that God is God, he has from his unmoved
  detachment, and from that detachment he has his purity, his simplicity, and his unchangeableness. Therefore, if a person
  is to become like God—as far as any creature can have likeness with God—this must happen through detachment. That then draws
  a person into purity, and from purity into simplicity, and from simplicity into unchangeableness, and these things produce
  a likeness between God and the person; and this likeness must come about in grace, for grace draws a person away from all
  temporal things and purifies him from all perishable things. And you should know: to be empty of all creatures is to be
  full of God, and to be full of all creatures is to be empty of God.'
commentary: 'This passage defines abegescheidenheit not as coldness or apathy but as a kind of immovability—the spirit rooted
  so deeply that the passing weather of experience (joy, sorrow, praise, insult) cannot shift it. Eckhart''s image is deliberately
  extreme: a mountain of lead against a light breeze. The point is not that the detached person feels nothing, but that the
  accidents of feeling no longer determine the ground. Notice the move Eckhart makes: he grounds detachment in God''s own
  being. God is God precisely because he is unmoved, and from that unmovedness flow his purity (lûterkeit), simplicity (einvalticheit),
  and unchangeableness (unwandelbærkeit). Detachment is therefore not merely a virtue we cultivate but the very shape of divine
  life; to practice it is to be conformed to the way God exists. The chain is precise—detachment draws the soul into purity,
  purity into simplicity, simplicity into unchangeableness—and these together forge a likeness (glîcheit) between soul and
  God. Crucially, Eckhart insists this likeness happens ''in grace,'' guarding against any suggestion that we manufacture
  divinity by willpower; grace is what actually detaches us from the temporal and perishable. The final line delivers the
  passage''s compressed logic: emptiness of creatures is fullness of God, and fullness of creatures is emptiness of God. This
  is not world-denial but a claim about capacity. A vessel already full cannot receive; the soul crowded with created attachments
  has no room for the uncreated. Detachment, then, is the clearing of space—not a subtraction that leaves us with nothing,
  but a subtraction that leaves us with everything, because it leaves us with God.


  Key Terms


  **abegescheidenheit** — Detachment; the spirit''s immovability toward all passing experience, likened to God''s own unmoved
  being.

  **glîcheit** — Likeness or conformity to God, achieved through detachment and only ''in grace.''

  **unwandelbærkeit** — Unchangeableness; the divine stability into which purity and simplicity finally draw the soul.'
insight: Here Eckhart defines the virtue by a physics of immovability.
practice: 'Stand with your feet planted and your spine tall for one full minute. As you stand, let each thought, feeling,
  or impulse to move arise and pass through you like wind—name it silently (joy, shame, restlessness, pride) but do not shift
  your weight or straighten further. Notice: the mountain does not argue with the breeze; it simply remains. Repeat this tomorrow,
  and the day after.'
