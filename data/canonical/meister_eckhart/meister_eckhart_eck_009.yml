section: Sermon 5b (DW I, c. 90)
sanskrit_devanagari: Diu minne enweiz kein warumbe.
sanskrit_iast: ''
translation_literal: Love knows no why.
commentary: 'This compact saying names a decisive feature of Eckhart’s detachment: the deepest love is not a transaction.
  It does not love God for reward, security, spiritual sweetness, heaven, or even personal fulfillment. Nor does it require
  an explanatory ground outside itself. “Why” here means the calculating purpose that makes an act serve the self. Such purposiveness
  binds the soul to what it seeks and therefore leaves it divided. Love without a why is not irrational impulse or moral indifference;
  it is an act issuing from the soul’s ground, where willing has been released from possession and advantage. In this sense
  it resembles Eckhart’s teaching that the just person does justice not in order to gain something, but because justice lives
  and works in him. The saying is therefore both ascetical and metaphysical: relinquish the claim to outcomes, and let the
  good be done from its own inward truth.


  Key Terms


  **minne** — Middle High German for love, especially the self-giving love that does not seek possession or reward.

  **enweiz** — “knows not,” indicating a mode of love beyond calculating awareness of reasons or ends.

  **warumbe** — “why” or “for what purpose,” the external motive that would make love instrumental.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** Krishna instructs Arjuna to act without attachment to the fruits of action, paralleling Eckhart’s
  refusal of self-serving spiritual motives. Divergence: The Gita retains a disciplined obligation to dharma and devotion
  to Krishna, whereas Eckhart’s saying concentrates on love’s intrinsic groundlessness.

  **1 Corinthians 13:5:** Paul says that love “does not seek its own,” closely matching Eckhart’s account of love as free
  from self-interested calculation. Divergence: Paul situates such love within the communal and Christological life of faith,
  while Eckhart’s aphorism states a more metaphysical and paradoxical detachment.

  **Angelus Silesius, The Cherubinic Wanderer I.289:** Silesius’s line “The rose is without why; it blooms because it blooms”
  echoes Eckhart’s image of a reality whose being and giving require no ulterior reason. Divergence: Silesius speaks primarily
  of the rose’s natural, contemplative immediacy, while Eckhart explicitly identifies this purposelessness with the highest
  love.'
practice: 'Before one ordinary act today—answering a message, doing work, offering help—pause for three breaths and silently
  ask: “What reward am I seeking?” Release the answer, then do the act simply and without rehearsing its result.'
