section: Sermon 5b (DW I, c. 90)
sanskrit_devanagari: Diu minne enweiz kein warumbe.
sanskrit_iast: ''
translation_literal: Love knows no why.
commentary: 'This compact saying names a decisive feature of Eckhart’s detachment: the deepest love is not a transaction.
  It does not love God for reward, security, spiritual sweetness, heaven, or even personal fulfillment. Nor does it require
  an explanatory ground outside itself. “Why” here means the calculating purpose that makes an act serve the self. Such purposiveness
  binds the soul to what it seeks and therefore leaves it divided. Love without a why is not irrational impulse or moral indifference;
  it is an act issuing from the soul’s ground, where willing has been released from possession and advantage. In this sense
  it resembles Eckhart’s teaching that the just person does justice not in order to gain something, but because justice lives
  and works in him. The saying is therefore both ascetical and metaphysical: relinquish the claim to outcomes, and let the
  good be done from its own inward truth.


  Key Terms


  **minne** — Love, especially a spiritually transformative love rather than possessive desire.

  **enweiz** — Knows not; negates reflective calculation or self-interested knowledge.

  **warumbe** — Why or purposive reason, the motive sought outside love itself.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** Krishna instructs Arjuna to act without attachment to the fruits of action, paralleling love freed
  from reward-seeking calculation.

  **Diamond Sutra, chapter 4:** The bodhisattva gives without abiding in any sign or expectation, resembling Eckhart’s refusal
  of spiritually self-serving motives.

  **Dao De Jing 38:** The text says the highest virtue does not consciously perform virtue, suggesting an unforced goodness
  prior to moral self-calculation.'
practice: 'Before one ordinary act today—answering a message, doing work, offering help—pause for three breaths and silently
  ask: “What reward am I seeking?” Release the answer, then do the act simply and without rehearsing its result.'
