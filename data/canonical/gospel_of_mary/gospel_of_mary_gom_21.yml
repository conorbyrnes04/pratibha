unit_label: BG 8502, p. 17
title: These teachings seem like different ideas
unit_type: teaching_passage
commentary: 'The powers now wear a face in the circle. Andrew''s objection is doctrinal: different ideas
  — alien, other-minded, not our school. He grants the others permission to like it and withholds belief.
  This is a cleaner trap than Peter''s, because it sounds like discernment. The ascent, the garment, the
  silence: he files them as another theology. The misconception: that ''this does not sound like us''
  is the same as ''this is not from the Savior.'' Sometimes the Savior said the part you were not in the
  room for.'
