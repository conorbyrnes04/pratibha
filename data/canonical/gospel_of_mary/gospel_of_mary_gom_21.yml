- kind: translation
  label: Pratibha Translation
  body: Andrew said, Say what you will about what she has said; I myself do not believe the Savior said
    these things, because these teachings seem like different ideas.
- kind: commentary
  label: Pratibha Commentary
  body: 'The powers now wear a face in the circle. Andrew''s objection is doctrinal: different ideas —
    alien, other-minded, not our school. He grants the others permission to like it and withholds belief.
    This is a cleaner trap than Peter''s, because it sounds like discernment. The ascent, the garment,
    the silence: he files them as another theology. The misconception: that ''this does not sound like
    us'' is the same as ''this is not from the Savior.'' Sometimes the Savior said the part you were not
    in the room for.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲕⲉⲙⲉⲉⲩⲉ
    definition: different ideas / other thoughts — Andrew's charge that the teaching is alien
  - term: ⲡⲓⲥⲧⲉⲩⲉ
    definition: believe — Andrew withholds it as if belief were a vote on style
  - term: ⲥⲃⲟⲟⲩⲉ
    definition: teachings — what he will not credit to the Savior
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 24:11
    resonance: The women's resurrection report seemed to the apostles an idle tale.
    divergence: Luke's men disbelieve the empty tomb as nonsense; Andrew disbelieves the inner ascent
      as a different school.
  - citation: Gospel of Thomas 13
    resonance: The disciples compare Jesus to an angel or a wise philosopher; Thomas will not compare.
    divergence: Thomas's others reduce him to a type; Andrew reduces Mary to a rival type.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When a teaching feels like ''different ideas,'' pause before you file it as not-ours. Ask only:
    does it restore natures to their root, or add a law? Answer from that, not from the school-sound.'
provenance:
  collection: Gospel of Mary
  section: BG 8502, p. 17
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
  original_reliability: SOURCED — working transcription of BG 8502 wording; lacunae marked; not Till 1955
    apparatus
