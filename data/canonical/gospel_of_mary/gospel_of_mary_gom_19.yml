unit_label: BG 8502, pp. 16–17
title: What binds me has been killed — rest in silence
unit_type: teaching_passage
commentary: 'The passport is past tense: binders killed, desire gone, ignorance dead, the chain of forgetfulness
  only for a time. Rest (anapausis) is received in silence — the same rest Matthew''s yoke promised. Released
  from a world in a world: not extraction to another planet, a release inside the field. Type from a type
  above: the pattern-level is also left. The misconception: that arrival is more speech, more map, more
  proving you have passed. The soul''s last act in the ascent is to take the rest of the age without talking.'
