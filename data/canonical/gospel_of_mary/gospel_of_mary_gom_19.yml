- kind: translation
  label: Pratibha Translation
  body: The soul said, What binds me has been killed, what surrounds me has been overcome, my desire is
    gone, and ignorance has died. In a world I was released from a world, and in a type from a type which
    is above, and from the chain of forgetfulness which exists only for a time. From now on I will receive
    the rest of the time of the age in silence.
- kind: commentary
  label: Pratibha Commentary
  body: 'The passport is past tense: binders killed, desire gone, ignorance dead, the chain of forgetfulness
    only for a time. Rest (anapausis) is received in silence — the same rest Matthew''s yoke promised.
    Released from a world in a world: not extraction to another planet, a release inside the field. Type
    from a type above: the pattern-level is also left. The misconception: that arrival is more speech,
    more map, more proving you have passed. The soul''s last act in the ascent is to take the rest of
    the age without talking.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲃϣⲉ
    definition: forgetfulness — a chain that exists only for a time
  - term: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
    definition: rest — received, from now on, in silence
  - term: ⲕⲁⲣⲱϥ
    definition: silence — the rest of the age; the soul's remaining practice
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 11:28–30
    resonance: Come to me, all who labor; you will find rest for your souls.
    divergence: Matthew's rest is under a kind yoke; Mary's is after the powers, in silence.
  - citation: Pseudo-Dionysius, Mystical Theology I
    resonance: The mysteries are veiled in a silence that teaches secrets.
    divergence: Dionysius's silence is super-luminous darkness; Mary's is the soul's rest after Wrath.
- kind: practice
  label: Practice (Abhyasa)
  body: After one true sentence today, stop. Do not add the clever flesh-wisdom or the angry wisdom. Receive
    the rest of the hour in silence.
provenance:
  collection: Gospel of Mary
  section: BG 8502, pp. 16–17
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
  original_reliability: SOURCED — working transcription of BG 8502 wording; lacunae marked; not Till 1955
    apparatus
