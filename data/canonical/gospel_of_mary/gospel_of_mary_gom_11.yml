unit_id: gospel_of_mary.gom_11
unit_label: BG 8502, p. 10
title: Tell us what we have not heard
unit_type: teaching_passage
commentary: 'Peter admits a privilege and immediately contains it: more than the rest of the women. The
  request is real; the frame is a cage. Mary does not debate the containment. She offers what is hidden.
  Later he will resent that she had anything to offer. This unit is the hinge: he asks her to speak as
  a specialist of the women''s column, and she answers as a witness of the hidden. The misconception:
  that love-more-than-the-women is the same as being heard. It is the setup for not being heard.'
