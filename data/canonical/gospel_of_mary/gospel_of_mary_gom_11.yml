    of the exhibited manuscript wording, with lacunae marked. Does not follow King, MacRae, Meyer, or
    any copyrighted NHL English.
translation: Peter said to Mary, Sister, we know the Savior loved you more than the rest of the women.
  Tell us the words of the Savior that you remember, that you know and we do not, which we have not heard.
  Mary said, What is hidden from you I will proclaim to you.
abhyasa: Notice one time you ask someone to speak and already have a smaller box for what they are allowed
  to know. Drop the box. Hear the hidden as hidden, not as a gendered specialty.
practice: Notice one time you ask someone to speak and already have a smaller box for what they are allowed
