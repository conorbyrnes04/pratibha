- kind: translation
  label: Pratibha Translation
  body: Peter said to Mary, Sister, we know the Savior loved you more than the rest of the women. Tell
    us the words of the Savior that you remember, that you know and we do not, which we have not heard.
    Mary said, What is hidden from you I will proclaim to you.
- kind: commentary
  label: Pratibha Commentary
  body: 'Peter admits a privilege and immediately contains it: more than the rest of the women. The request
    is real; the frame is a cage. Mary does not debate the containment. She offers what is hidden. Later
    he will resent that she had anything to offer. This unit is the hinge: he asks her to speak as a specialist
    of the women''s column, and she answers as a witness of the hidden. The misconception: that love-more-than-the-women
    is the same as being heard. It is the setup for not being heard.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲥⲱⲛⲉ
    definition: sister — Peter's address; kinship that still ranks her among the women
  - term: ⲡⲉⲑⲏⲡ
    definition: what is hidden — Mary's offering; not a secret club, a withheld teaching
  - term: ⲛⲉϩⲓⲟⲙⲉ
    definition: the women — the column Peter uses to contain the privilege he admits
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 10:39–42
    resonance: Mary sits at the Lord's feet; Martha's complaint is about a woman's place.
    divergence: Luke defends Mary's listening; this Peter invites Mary's speaking, then will punish it.
  - citation: Gospel of Thomas 114
    resonance: Simon Peter said, Let Mary leave us, for women are not worthy of life.
    divergence: Thomas's Peter wants her out before she speaks; this Peter invites her, then turns.
- kind: practice
  label: Practice (Abhyasa)
  body: Notice one time you ask someone to speak and already have a smaller box for what they are allowed
    to know. Drop the box. Hear the hidden as hidden, not as a gendered specialty.
provenance:
  collection: Gospel of Mary
  section: BG 8502, p. 10
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
