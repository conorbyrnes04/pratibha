unit_id: gospel_of_mary.gom_03
unit_label: BG 8502, p. 7
title: The Good came to restore each nature
unit_type: teaching_passage
commentary: 'If sin is not a substance, the Good is not a prosecutor. It comes among you — into the mixed
  field — as far as every nature, to restore each thing to its root. Restoration, not replacement. The
  first teaching (matter returns to its nature) is now the work of the Good. The misconception: that salvation
  extracts you from natures into a second, cleaner world. Here the Good goes all the way into the natures
  and seats them back where they belong. You do not have to destroy matter to be saved. You have to stop
  mixing it.'
