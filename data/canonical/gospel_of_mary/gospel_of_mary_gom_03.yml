- kind: key_terms
  label: Key Terms
  items:
  - term: ⲡⲁⲅⲁⲑⲟⲛ
    definition: the Good — comes among you to restore, not to decorate a guilty world
  - term: ⲧⲁϩⲟ ⲉⲣⲁⲧⲥ
    definition: restore / set on its feet — each nature seated in its root
  - term: ⲛⲟⲩⲛⲉ
    definition: root — same word as matter's homecoming; now the Good's destination
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 70
    resonance: If you bring forth what is within you, it will save you; if you do not, it will destroy
      you.
    divergence: Thomas locates the crisis inside; Mary locates the Good as restorer of each nature's root.
  - citation: Plotinus, Ennead I.6
    resonance: The soul is restored by becoming like the Good it sees.
    divergence: Plotinus restores by likeness and stripping; Mary restores each nature in place.
- kind: practice
  label: Practice (Abhyasa)
  body: Pick one thing you have been trying to save by destroying (a habit, a person, a mood). Ask what
    restoring it to its root would look like. Do that smaller act instead.
