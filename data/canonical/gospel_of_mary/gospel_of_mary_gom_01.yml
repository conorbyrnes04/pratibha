unit_label: BG 8502, p. 7
title: Matter dissolves into its own root
unit_type: teaching_passage
commentary: The gospel opens, after six lost pages, on a cosmological claim rather than a miracle. The
  question wants destruction. The answer is unbinding. Things exist interpenetrating — then they return
  into their own root. Matter does not need to be hated; it has a nature that goes home. The contested
  move is to refuse both world-rejection and world-solidity. Dissolution is not a catastrophe. It is what
  matter does when it is no longer being forced to play at permanence. 'Ears to hear' is not a password
  for the clever. It is a demand that you stop treating the visible as a last word.
