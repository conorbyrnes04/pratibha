- kind: translation
  label: Pratibha Translation
  body: Then will matter be destroyed, or not? The Savior said, Every nature, every form, every creature
    exists in and with each other, but they will dissolve again into their own roots, because the nature
    of matter dissolves into its nature alone. Whoever has ears to hear should hear.
- kind: commentary
  label: Pratibha Commentary
  body: The gospel opens, after six lost pages, on a cosmological claim rather than a miracle. The question
    wants destruction. The answer is unbinding. Things exist interpenetrating — then they return into
    their own root. Matter does not need to be hated; it has a nature that goes home. The contested move
    is to refuse both world-rejection and world-solidity. Dissolution is not a catastrophe. It is what
    matter does when it is no longer being forced to play at permanence. 'Ears to hear' is not a password
    for the clever. It is a demand that you stop treating the visible as a last word.
- kind: key_terms
  label: Key Terms
  items:
  - term: ϩⲩⲗⲏ
    definition: matter / hylē — not evil stuff, a nature that dissolves into itself
  - term: ⲛⲟⲩⲛⲉ
    definition: root — the return-point of each nature, not a better world behind this one
  - term: ⲫⲩⲥⲓⲥ
    definition: nature — the way a thing actually behaves when not propped up by fear
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 11
    resonance: The dead are not alive and the living will not die; this world is a crossing, not a fortress.
    divergence: Thomas speaks in riddle; Mary gives a physics of unbinding.
  - citation: Tao Te Ching 16
    resonance: Return to the root is called stillness.
    divergence: Laozi's root is the nameless; Mary's root is each nature going home, including matter.
- kind: practice
  label: Practice (Abhyasa)
  body: Take one object you treat as permanent. Name its root (use, hunger, fear, habit). Let the object
    stay. Let the permanence-story go.
