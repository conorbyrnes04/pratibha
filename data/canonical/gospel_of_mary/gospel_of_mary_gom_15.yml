- kind: translation
  label: Pratibha Translation
  body: 'It came to the third power, which is called Ignorance. It interrogated the soul: Where are you
    going? In wickedness you are bound. Since you are bound, do not judge.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Ignorance moralizes. It calls the soul wicked and bound, then forbids judgment — a trap that
    uses spiritual language to keep the climber in place. ''Do not judge'' from a jailer is not the Savior''s
    teaching. It is a power borrowing a holy sentence. The next unit is the soul''s answer. This one is
    the trap, isolated so you can hear the voice. The misconception: that every interior ''you are bound,
    be humble'' is wisdom. Hear who is speaking.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
    definition: Ignorance — a power that binds by moral interrogation
  - term: ⲙⲏⲣ
    definition: bound — the charge; also the condition Ignorance needs you to accept
  - term: ϩⲁⲡ
    definition: judgment — here forbidden by the jailer, not by the Savior
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 7:1
    resonance: Do not judge, lest you be judged.
    divergence: Jesus forbids judging; Ignorance weaponizes the same sentence to halt ascent. Hear who
      is speaking.
  - citation: Gospel of Thomas 39
    resonance: The Pharisees took the keys of knowledge and hid them; they did not enter, and did not
      let those who wanted to enter.
    divergence: Thomas's hiders block the door; Mary's Ignorance blocks with a pious command.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When an inner voice calls you bound and then says do not judge, name it Ignorance before you
    obey. Ask: is this a jailer or a teacher? Do not answer the jailer yet.'
provenance:
  collection: Gospel of Mary
  section: BG 8502, p. 15
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
