- kind: key_terms
  label: Key Terms
  items:
  - term: ⲛⲟⲩϭⲥ
    definition: to be angry — Levi's 'always'; Wrath as a character-trait in the group
  - term: ϯⲧⲱⲛ
    definition: to debate / contend — the form anger takes against 'this woman'
  - term: ⲁⲛⲧⲓⲕⲉⲓⲙⲉⲛⲟⲥ
    definition: adversaries / opposing powers — the soul's enemies; now a way of talking in the room
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Mary, BG 8502 p. 16
    resonance: The seventh form of Wrath is the Wisdom of Anger.
    divergence: The ascent's last face of Wrath sits down in Peter. Levi is the one who sees it.
  - citation: Matthew 16:22–23
    resonance: Peter rebukes Jesus; Get behind me, Satan — you are not thinking the things of God.
    divergence: Matthew's Peter is adversary for a moment of the passion; Mary's Peter is adversary toward
      the witness of the ascent.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Where you are always angry in one relationship, say Levi''s sentence to yourself: I am debating
    like the adversaries. Stop the debate for one hour. Do not settle the theology in that hour.'
