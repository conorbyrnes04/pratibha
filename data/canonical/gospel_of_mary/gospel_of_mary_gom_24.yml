- kind: translation
  label: Pratibha Translation
  body: Levi said to Peter, Peter, you have always been angry. Now I see you debating with this woman
    like the adversaries.
- kind: commentary
  label: Pratibha Commentary
  body: 'Levi names the seventh form of Wrath in a man: always angry, now debating the woman like the
    adversaries — the antimimenoi, the opposing powers the soul just climbed. Peter has become the checkpoint.
    The debate is not a search for truth. It is Wrath''s wisdom wearing a brother''s face. Levi does not
    yet argue worth. He diagnoses. The misconception: that a long-standing temper is just ''how Peter
    is,'' and therefore not a spiritual event. The book says the adversaries have found a seat in the
