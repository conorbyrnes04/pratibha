  body: 'The powers call the soul a murderer because it has killed the binders. Conqueror of space is
    not a compliment. It is an accusation: you have left our territory. Origin and destination questions
    are how Wrath stalls a climber who has already passed Desire and Ignorance. The soul will answer in
