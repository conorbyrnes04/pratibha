- kind: key_terms
  label: Key Terms
  items:
  - term: ⲣⲉϥϩⲱⲧⲃ
    definition: murderer — Wrath's name for the soul that killed its binders
  - term: ⲣⲣⲟ ⲛⲧⲟⲡⲟⲥ
    definition: conqueror of space / place — accused of leaving the powers' territory
  - term: ⲧⲱⲛ
    definition: where — origin and destination as stalling questions
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 8:14
    resonance: I know where I came from and where I am going; you do not know.
    divergence: 'Jesus answers the where; Mary''s powers ask it to halt. Next unit: the soul answers anyway.'
  - citation: Gospel of Thomas 50
    resonance: 'If they ask you, Where did you come from?, say: we came from the light.'
    divergence: Thomas scripts the passport; Mary lets Wrath insult, then answers with past-tense freedom.
- kind: practice
  label: Practice (Abhyasa)
  body: When you are called too much — too hard, too gone, too 'murderous' toward an old loyalty — ask
    who is naming you. If it is a binder you already left, do not take the name. Keep walking.
