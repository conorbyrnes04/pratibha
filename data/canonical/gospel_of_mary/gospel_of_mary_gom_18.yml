unit_id: gospel_of_mary.gom_18
unit_label: BG 8502, p. 16
title: Where do you come from, murderer?
unit_type: teaching_passage
commentary: 'The powers call the soul a murderer because it has killed the binders. Conqueror of space
  is not a compliment. It is an accusation: you have left our territory. Origin and destination questions
  are how Wrath stalls a climber who has already passed Desire and Ignorance. The soul will answer in
  the next unit with past tenses. This unit is the charge. The misconception: that if you are named violent
  by a power you have outgrown, you must be violent. Sometimes the killing is of what bound you, and the
  name is the power''s last tool.'
