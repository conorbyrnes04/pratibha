unit_id: gospel_of_mary.gom_04
unit_label: BG 8502, pp. 7–8
title: You die because you love what tricks you
unit_type: teaching_passage
commentary: 'Death here is not a punishment laid on flesh. It is what follows from loving a trick. The
  object of love is not named as a demon. It is named as deceit — what has no stable face, what you keep
  marrying anyway. Sickness is the body''s report of that marriage. The next unit will name the trick
  as imageless passion. This unit only places the cause: not matter, not the Savior''s absence, but a
  love that prefers the cheat. The misconception: that you die because the world is evil. You die because
  you love what is lying to you.'
