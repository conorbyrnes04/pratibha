- kind: original
  label: Original
  body: ⲉⲧⲃⲉ ⲡⲁⲓ ⲧⲉⲧⲛϣⲱⲛⲉ ⲁⲩⲱ ⲧⲉⲧⲛⲙⲟⲩ ϫⲉ [ⲧⲉⲧⲛⲙⲉ ⲙⲡⲉⲧⲣ ϩⲁⲗ ⲙⲙⲱⲧⲛ] ⲡⲉⲧⲉ ⲟⲩⲛϭⲟⲙ ⲙⲙⲟϥ ⲉⲛⲟⲓ ⲙⲁⲣⲉϥⲛⲟⲓ
- kind: translation
  label: Pratibha Translation
  body: 'That is why you get sick and die: because you love what tricks you. Anyone who can understand
    should understand.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Death here is not a punishment laid on flesh. It is what follows from loving a trick. The object
    of love is not named as a demon. It is named as deceit — what has no stable face, what you keep marrying
    anyway. Sickness is the body''s report of that marriage. The next unit will name the trick as imageless
    passion. This unit only places the cause: not matter, not the Savior''s absence, but a love that prefers
    the cheat. The misconception: that you die because the world is evil. You die because you love what
    is lying to you.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ϩⲁⲗ
    definition: trick / deceit — what is loved; the cause of sickness here
  - term: ϣⲱⲛⲉ
    definition: to be sick — the body's weather when love has no true object
  - term: ⲙⲟⲩ
    definition: to die — consequence of that love, not a sentence from outside
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 56
    resonance: Whoever has known the world has found a corpse.
    divergence: Thomas finds the world already dead; Mary finds death in a kind of loving.
  - citation: Heraclitus B85
    resonance: It is hard to fight desire; whatever it wants, it buys with soul.
    divergence: Heraclitus prices desire in psyche; Mary prices the trick in sickness and death.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one thing you love that you already know is a trick (a refresh, a status, a story). Love
    it one degree less today. Do not replace it yet.
