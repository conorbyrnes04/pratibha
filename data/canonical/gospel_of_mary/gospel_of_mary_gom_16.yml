- kind: translation
  label: Pratibha Translation
  body: The soul said, Why do you judge me, since I have not judged? I was bound, though I have not bound.
    They did not recognize me, but I have recognized that everything will dissolve — both the things of
    earth and the things of heaven.
- kind: commentary
  label: Pratibha Commentary
  body: 'The soul does not accept the charge. I have not judged; I have not bound; you did not know me.
    What it does know is the first teaching of the book, now used as a passport: everything will dissolve.
    Heaven is not exempt. If even heaven dissolves, Ignorance''s courtroom is temporary. Recognition here
    is one-way again, as with Desire: they did not know me; I have known the physics. The misconception:
    that to pass a moralizing power you must accept its verdict and then be humble. The soul refuses the
    verdict and remembers dissolution.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ϩⲁⲡ
    definition: judgment — the soul refuses the charge of having judged
  - term: ⲃⲱⲗ ⲉⲃⲟⲗ
    definition: dissolve — earth and heaven; Ignorance's court included
  - term: ⲥⲟⲩⲱⲛ
    definition: recognize — they failed; the soul succeeded, and what it knows is unbinding
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Mary, BG 8502 p. 7
    resonance: Matter dissolves into its own root.
    divergence: The opening physics becomes, at this gate, a weapon against a power.
  - citation: Nāgārjuna, MMK 24.18
    resonance: Empty things can dissolve because they have no essence.
    divergence: Nāgārjuna argues emptiness; Mary's soul uses dissolution as a passport past a power.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Restate the first teaching against one inner court today: this too will dissolve, earth and heaven.
    Take the next honest step without accepting the charge.'
