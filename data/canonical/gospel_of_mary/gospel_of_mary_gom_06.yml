    of the exhibited manuscript wording, with lacunae marked. Does not follow King, MacRae, Meyer, or
    any copyrighted NHL English.
translation: Peace be with you. Acquire my peace. Be careful not to let anyone mislead you by saying,
  Look over here, or Look over there. The Son of Humanity exists within you. Follow him. Those who seek
  him will find him.
abhyasa: Catch one spiritual 'look over there' today — a teacher, a sign, a mood. Return to the Human
  One as within. Stay ten breaths. Do not add a proof.
