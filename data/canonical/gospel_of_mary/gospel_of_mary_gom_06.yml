title: The Son of Humanity exists within you
unit_type: teaching_passage
commentary: 'The farewell is a map. Peace is to be acquired, not waited for as a mood. The Human One is
  not a figure on the horizon. He exists within. Follow is not travel; it is refusing the pointing-away.
  Luke 17 left entos open (within / among). Mary closes the pointing and keeps the within. The next unit
  will forbid the extra law. This one only relocates the one you follow. The misconception: that the living
  teaching is always over there — a teacher, a sign, a later age.'
