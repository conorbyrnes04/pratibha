- kind: translation
  label: Pratibha Translation
  body: Peace be with you. Acquire my peace. Be careful not to let anyone mislead you by saying, Look
    over here, or Look over there. The Son of Humanity exists within you. Follow him. Those who seek him
    will find him.
- kind: commentary
  label: Pratibha Commentary
  body: 'The farewell is a map. Peace is to be acquired, not waited for as a mood. The Human One is not
    a figure on the horizon. He exists within. Follow is not travel; it is refusing the pointing-away.
    Luke 17 left entos open (within / among). Mary closes the pointing and keeps the within. The next
    unit will forbid the extra law. This one only relocates the one you follow. The misconception: that
    the living teaching is always over there — a teacher, a sign, a later age.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲡϣⲏⲣⲉ ⲙⲡⲣⲱⲙⲉ
    definition: Son of Humanity / the Human One — not a remote title; said to exist within
  - term: ⲉⲓⲣⲏⲛⲏ
    definition: peace — to be acquired, not waited for as a feeling
  - term: ⲡⲗⲁⲛⲁ
    definition: to mislead — the pointing-away that relocates what is already within
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 17:20–21
    resonance: The kingdom does not come with observation; it is within / among you.
    divergence: Luke's Greek is open (entos); Mary makes the Human One interior.
  - citation: Gospel of Thomas 3
    resonance: The kingdom is inside you and outside you; leaders who point to sky or sea mislead.
    divergence: Thomas keeps inside-and-outside; Mary stresses within, then (next) the political danger
      of rule-making.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch one spiritual 'look over there' today — a teacher, a sign, a mood. Return to the Human One
    as within. Stay ten breaths. Do not add a proof.
provenance:
  collection: Gospel of Mary
  section: BG 8502, pp. 8–9
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
  original_reliability: SOURCED — working transcription of BG 8502 wording; lacunae marked; not Till 1955
