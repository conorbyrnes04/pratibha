unit_label: BG 8502, p. 9
title: She turned their hearts toward the Good
unit_type: teaching_passage
commentary: 'The turning is the miracle of this page. Not a new vision. Not a vote. Hearts that were split
  now face the Good, and talk can begin. The Good is the same one that came to restore natures. Mary does
  not become the Good. She turns them toward it. Peter will ask her, next, for hidden words — because
  the turning worked, and he will need to contain it. The misconception: that leadership is having more
  content. Here it is an orientation of the heart that lets the already-given words be discussed.'
