- kind: key_terms
  label: Key Terms
  items:
  - term: ⲕⲧⲉ ϩⲏⲧ
    definition: to turn the heart — Mary's act; not persuasion as winning
  - term: ⲡⲁⲅⲁⲑⲟⲛ
    definition: the Good — the direction of the turn, already named as restorer
  - term: ϣⲁϫⲉ
    definition: words / discussion — what becomes possible after the turn
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 24:32
    resonance: Were not our hearts burning when he opened the word to us?
    divergence: Luke's burning is on the road with unrecognized Jesus; Mary's turning is in the room,
      by a disciple.
  - citation: Śiva Sūtra I.2
    resonance: Knowledge is bondage — group knowledge without a turned heart is still collapse.
    divergence: The sūtra diagnoses; Mary performs the turning.
- kind: practice
  label: Practice (Abhyasa)
  body: After you speak one true thing in a stuck conversation, stop. See whether hearts can turn. If
    they do, let the group discuss. Do not collect the turning as your proof.
