unit_label: BG 8502, p. 7
title: Sin does not exist — you make it
unit_type: teaching_passage
commentary: 'Peter wants a substance called Sin sitting in the world. The Savior will not give him one.
  Sin is not a thing in the cosmos; it is a way of acting — named here as adultery, not first as sex but
  as splitting, mixing against nature, taking what is not yours to take. You make it. The misconception
  this gate blocks: that spirituality begins by locating a stain in matter, or in women, or in the world
  as such. The next sentence will say what the Good actually does. This one only demolishes the object
  Peter asked for.'
