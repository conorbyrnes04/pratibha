- kind: translation
  label: Pratibha Translation
  body: Peter said to him, Since you have explained everything to us, tell us one more thing. What is
    the sin of the world? The Savior said, Sin does not exist, but you are the ones who make sin when
    you act according to the nature of adultery, which is called sin.
- kind: commentary
  label: Pratibha Commentary
  body: 'Peter wants a substance called Sin sitting in the world. The Savior will not give him one. Sin
    is not a thing in the cosmos; it is a way of acting — named here as adultery, not first as sex but
    as splitting, mixing against nature, taking what is not yours to take. You make it. The misconception
    this gate blocks: that spirituality begins by locating a stain in matter, or in women, or in the world
    as such. The next sentence will say what the Good actually does. This one only demolishes the object
    Peter asked for.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲛⲟⲃⲉ
    definition: sin — here refused as a cosmic object; produced by a kind of acting
  - term: ⲛⲟⲉⲓⲕ
    definition: adultery — mixing against nature; taking what does not belong to that root
  - term: ⲡⲕⲟⲥⲙⲟⲥ
    definition: the world — Peter locates sin here; the Savior will not
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: A Course in Miracles, principle 1
    resonance: Nothing real can be threatened; nothing unreal exists.
    divergence: Both refuse sin as substance. The Course makes the world error; Mary lets matter have
      a nature that honestly dissolves.
  - citation: Gospel of Thomas 14
    resonance: If you fast you will beget sin for yourselves — ritual can manufacture the stain it claims
      to remove.
    divergence: Thomas attacks pious production of guilt; Mary locates production in adulterous mixing.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before you name something a sin today, ask: am I pointing at a substance in the world, or at
    a mixing I am doing? Name the mixing. Stop it once.'
