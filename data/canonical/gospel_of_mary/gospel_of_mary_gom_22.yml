- kind: translation
  label: Pratibha Translation
  body: 'Peter spoke with the same concerns. He asked them concerning the Savior: He did not speak with
    a woman without our knowledge and not publicly with us, did he? Will we turn around and all listen
    to her? Did he prefer her to us?'
- kind: commentary
  label: Pratibha Commentary
  body: 'Peter''s objection is gendered and institutional: a woman, in secret, preferred. He had asked
    her to speak. He now resents the speaking. The hidden teaching he requested is now evidence against
    her. Preference is the wound — more than us, not more than the rest of the women, the frame he used
    when he invited her. The extra law of who may hear is being drafted in real time. The misconception:
    that asking someone to testify means you will accept the testimony. Here the invitation was a test
    she was not allowed to pass.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲥϩⲓⲙⲉ
    definition: woman — Peter's containment; the issue he makes of the vessel
  - term: ⲛϫⲓⲟⲩⲉ
    definition: in secret / without our knowledge — the charge against a vision he asked to hear
  - term: ⲥⲉⲧⲡ
    definition: to prefer / choose — the wound; love restated as a slight to the men
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 24:10–11
    resonance: The women's report seemed an idle tale.
    divergence: Luke's disbelief is of the tomb; Peter's is of a woman preferred with hidden words.
  - citation: Gospel of Thomas 114
    resonance: Simon Peter wants Mary excluded because women are not worthy of life.
    divergence: Thomas's Peter is exclusion first; this Peter is invitation, then exclusion. Same wound,
      later in the scene.
- kind: practice
  label: Practice (Abhyasa)
  body: Notice one place you asked someone to speak and then resented the authority of what they said.
    Name the resentment without defending it. Listen once more, as if you had not invited them only to
    rank them.
