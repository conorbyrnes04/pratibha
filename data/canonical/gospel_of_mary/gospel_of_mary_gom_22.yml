unit_id: gospel_of_mary.gom_22
unit_label: BG 8502, pp. 17–18
title: Did he speak with a woman without our knowledge?
unit_type: teaching_passage
commentary: 'Peter''s objection is gendered and institutional: a woman, in secret, preferred. He had asked
  her to speak. He now resents the speaking. The hidden teaching he requested is now evidence against
  her. Preference is the wound — more than us, not more than the rest of the women, the frame he used
  when he invited her. The extra law of who may hear is being drafted in real time. The misconception:
  that asking someone to testify means you will accept the testimony. Here the invitation was a test she
  was not allowed to pass.'
