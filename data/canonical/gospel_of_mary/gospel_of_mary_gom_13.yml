unit_label: BG 8502, p. 10 (then lacuna pp. 11–14)
title: Neither soul nor spirit sees — the mind between
unit_type: teaching_passage
commentary: 'Mary asks the technical question every visionary tradition has to answer: which faculty sees?
  Soul and spirit are refused as the organ. Nous stands between them. The lacuna that follows is the gospel''s
  honest wound: the ascent teaching is torn out, and we re-enter mid-climb. Do not fill the gap with a
  system. The surviving claim is already sharp. Vision is not a soul-mood and not a spirit-possession.
  It is mind, between. If you skip this, the later powers look like a cartoon afterlife. They are what
  a mind meets when it is actually seeing.'
