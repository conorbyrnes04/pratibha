- kind: translation
  label: Pratibha Translation
  body: I said to him, Lord, does the one who sees the vision see it in the soul or in the spirit? The
    Savior said, They do not see in the soul or in the spirit, but the mind which exists between the two
    is what sees the vision. [pages 11–14 missing]
- kind: commentary
  label: Pratibha Commentary
  body: 'Mary asks the technical question every visionary tradition has to answer: which faculty sees?
    Soul and spirit are refused as the organ. Nous stands between them. The lacuna that follows is the
    gospel''s honest wound: the ascent teaching is torn out, and we re-enter mid-climb. Do not fill the
    gap with a system. The surviving claim is already sharp. Vision is not a soul-mood and not a spirit-possession.
    It is mind, between. If you skip this, the later powers look like a cartoon afterlife. They are what
    a mind meets when it is actually seeing.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲯⲩⲭⲏ
    definition: soul — refused as the seer of the vision
  - term: ⲡⲛⲉⲩⲙⲁ
    definition: spirit — also refused; vision is not possession
  - term: ⲟⲩⲧⲉ ⲡⲥⲛⲁⲩ
    definition: between the two — nous as the interval, not a third substance to collect
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Ennead V.1
    resonance: The soul sees the Intellectual-Principle by becoming like it, not by a lower faculty.
    divergence: Plotinus ranks hypostases; Mary names a between that is the organ of vision.
  - citation: Pseudo-Dionysius, Mystical Theology I
    resonance: Leave sense and intellect for the ray of divine darkness.
    divergence: 'Dionysius strips nous at the summit; Mary needs nous as the seer of the vision. Divergence:
      different rungs.'
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit five minutes. When a seeing arises, ask: is this mood (soul) or inflation (spirit)? Rest
    as the between. When you cannot tell, that is the gate.'
