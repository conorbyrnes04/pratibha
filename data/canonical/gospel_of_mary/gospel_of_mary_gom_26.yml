title: Clothe yourselves with perfect Humanity
unit_type: teaching_passage
commentary: 'Levi returns the farewell. Shame is for the anger, not for Mary. Then the clothing: perfect
  Humanity — the stature Mary already named when she stood. Preach, and do not add a rule. The book ends
  not with a vision but with a group that can walk out because someone defended the witness. Acquire it:
  Humanity is not a feeling that arrived in the argument. It is put on, as he said. The last practice
  of the gospel is Levi''s: be ashamed of the anger, put on the Human, go.'
