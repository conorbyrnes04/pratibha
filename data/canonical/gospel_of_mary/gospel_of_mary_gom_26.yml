- kind: translation
  label: Pratibha Translation
  body: Rather we should be ashamed, clothe ourselves with perfect Humanity, acquire it as he instructed
    us, and preach the gospel, not laying down any other rule or other law beyond what the Savior said.
    When Levi said these things, they started to go out to teach and to preach.
- kind: commentary
  label: Pratibha Commentary
  body: 'Levi returns the farewell. Shame is for the anger, not for Mary. Then the clothing: perfect Humanity
    — the stature Mary already named when she stood. Preach, and do not add a rule. The book ends not
    with a vision but with a group that can walk out because someone defended the witness. Acquire it:
    Humanity is not a feeling that arrived in the argument. It is put on, as he said. The last practice
    of the gospel is Levi''s: be ashamed of the anger, put on the Human, go.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲧⲉⲗⲓⲟⲥ ⲛⲣⲱⲙⲉ
    definition: perfect Humanity — the clothing Levi commands; Mary's earlier 'he made us Human'
  - term: ϣⲓⲡⲉ
    definition: shame — directed at the anger, not at the witness
  - term: ϩⲟⲣⲟⲥ
    definition: rule / limit — the extra statute the farewell already forbade, now forbidden again as
      they go
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Mary, BG 8502 p. 9
    resonance: Do not lay down any rule beyond what I have given you.
    divergence: The farewell is restated as the condition of going out. Levi is the one who remembers
      it.
  - citation: Colossians 3:9–10
    resonance: Strip the old human, put on the new, who is being renewed after the image.
    divergence: Paul's clothing is the new human in an image; Mary's is perfect Humanity as the Savior's
      instruction, without an extra law.
- kind: practice
  label: Practice (Abhyasa)
  body: Clothe yourself as Human — one ordinary act of going out (a message, a repair, a walk) without
    the extra rule about who is allowed. Do not wait to feel worthy. Put it on.
