unit_id: gospel_of_mary.gom_08
unit_label: BG 8502, p. 9
title: If they did not spare him, why would they spare us?
unit_type: teaching_passage
commentary: 'The men have the map and still collapse. The objection is not doctrinal. It is fear dressed
  as logistics: the Gentiles, the killing, the math of survival. They have just been told the Human One
  is within, and they locate danger only outside. Mary will stand in the next unit. This unit is the failure
  the farewell predicted — hearts divided, already, before a single Gentile is met. The misconception:
  that the obstacle to preaching is the world''s violence. Here the obstacle is the weeping that cannot
  use the peace they were told to acquire.'
