- kind: translation
  label: Pratibha Translation
  body: But they grieved and wept bitterly. They said, How can we go to the Gentiles to preach the gospel
    of the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?
- kind: commentary
  label: Pratibha Commentary
  body: 'The men have the map and still collapse. The objection is not doctrinal. It is fear dressed as
    logistics: the Gentiles, the killing, the math of survival. They have just been told the Human One
    is within, and they locate danger only outside. Mary will stand in the next unit. This unit is the
    failure the farewell predicted — hearts divided, already, before a single Gentile is met. The misconception:
    that the obstacle to preaching is the world''s violence. Here the obstacle is the weeping that cannot
    use the peace they were told to acquire.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ϩⲉⲑⲛⲟⲥ
    definition: Gentiles / nations — the imagined outside that justifies not going
  - term: ⲗⲩⲡⲉⲓ
    definition: to grieve — the group's first act after the farewell
  - term: ϯ ⲥⲟ
    definition: to spare — they measure mission by whether violence will pause
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 24:17–21
    resonance: 'The downcast walkers: we had hoped he was the one; they crucified him.'
    divergence: Luke's grief is on the road to Emmaus; Mary's is in the room, before any road.
  - citation: John 20:19
    resonance: The doors were locked for fear of the Judeans.
    divergence: John locks the room; Mary will have a woman open it by turning hearts.
- kind: practice
  label: Practice (Abhyasa)
  body: When a true task appears and you answer with 'they will not spare us,' name the fear without solving
    it. Acquire peace once (ten breaths). Then see whether the task is still impossible.
provenance:
  collection: Gospel of Mary
  section: BG 8502, p. 9
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
