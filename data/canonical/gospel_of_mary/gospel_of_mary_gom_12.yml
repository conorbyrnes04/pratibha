unit_label: BG 8502, p. 10
title: Where the mind is, there is the treasure
unit_type: teaching_passage
commentary: 'The blessing is not seeing. It is not wavering at the seeing. Then the sentence that relocates
  the whole gospel: where the nous is, there is the treasure. Not where the relic is. Not where the male
  college is. Mind, here, is the seeing-place between soul and spirit (the next question). Treasure follows
  attention. If the mind wavers, the Lord is a spectacle; if it holds, the vision is a location of wealth.
  Matthew tied treasure to heart. Mary ties it to unwavering mind.'
