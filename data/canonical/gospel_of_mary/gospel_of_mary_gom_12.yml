- kind: translation
  label: Pratibha Translation
  body: I saw the Lord in a vision and said, Lord, I saw you today in a vision. He said, You are blessed
    because you did not waver at the sight of me. For where the mind is, there is the treasure.
- kind: commentary
  label: Pratibha Commentary
  body: 'The blessing is not seeing. It is not wavering at the seeing. Then the sentence that relocates
    the whole gospel: where the nous is, there is the treasure. Not where the relic is. Not where the
    male college is. Mind, here, is the seeing-place between soul and spirit (the next question). Treasure
    follows attention. If the mind wavers, the Lord is a spectacle; if it holds, the vision is a location
    of wealth. Matthew tied treasure to heart. Mary ties it to unwavering mind.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲛⲟⲩⲥ
    definition: mind / nous — the seeing-place; where it is, the treasure is
  - term: ϩⲟ
    definition: treasure — not stored elsewhere than attention
  - term: ⲥⲧⲱⲧ
    definition: to waver / shake — the failure; blessedness is unwavering, not the having of sights
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 6:21
    resonance: Where your treasure is, there your heart will be.
    divergence: Matthew ties treasure to heart; Mary ties it to nous, and to not wavering in vision.
  - citation: Gospel of Thomas 2
    resonance: The seeker is troubled, astonished, then rules — finding is a shock, not a possession.
    divergence: Thomas sequences seeking; Mary locates the treasure in unwavering mind.
- kind: practice
  label: Practice (Abhyasa)
  body: When a true thing appears today (a person, a sentence, a silence), notice the waver. Hold the
    mind there for ten breaths. Do not collect the experience as status.
provenance:
  collection: Gospel of Mary
  section: BG 8502, p. 10
  cultural_context: A second-century Greek gospel surviving mainly in a fifth-century Sahidic codex (Berlin
    BG 8502). Pages 1–6 and 11–14 are lost. Mary Magdalene receives a hidden teaching after the resurrection;
    the soul ascends past the powers; Peter and Andrew refuse her, and Levi defends her.
  original_source: Sahidic Coptic, Papyrus Berolinensis 8502,1 (5th c.)
