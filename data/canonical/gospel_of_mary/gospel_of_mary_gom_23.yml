- kind: translation
  label: Pratibha Translation
  body: Then Mary wept and said to Peter, My brother Peter, what are you thinking? Do you really think
    that I thought this up by myself in my heart, or that I am lying about the Savior?
- kind: commentary
  label: Pratibha Commentary
  body: 'Mary''s tears are not collapse. They are the soul''s question to Wrath in human form: did I invent
    this, or am I lying? Brother is still her word for him. The gospel will not let you keep the ascent
    as private mysticism. It lands as a fight about who is allowed to have heard. If you skip this gate,
    Mary is a mascot. Here she is a witness under cross-examination, asking the examiner to name his thought.
    The misconception: that tears mean she has lost the unwavering mind. Unwavering was at the sight of
    the Lord. This is grief at being recoded as a liar.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ϫⲓϭⲟⲗ
    definition: 'to lie — Mary''s question: invention or testimony?'
  - term: ϩⲏⲧ
    definition: heart — accused of being the sole source; she had said the Savior spoke
  - term: ⲥⲟⲛ
    definition: brother — she keeps the kinship Peter is in the act of breaking
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 20:11–18
    resonance: 'Mary weeps at the tomb, then is sent to the brothers: I have seen the Lord.'
    divergence: John's tears open the recognition; these tears answer a recognition already given and
      now refused.
  - citation: Gospel of Mary, BG 8502 p. 10
    resonance: Blessed because you did not waver at the sight of me.
    divergence: Unwavering at the vision; weeping at the brothers. Two fidelities, not a contradiction.
- kind: practice
  label: Practice (Abhyasa)
  body: 'If you are recoded as inventor or liar for a true thing you reported, ask the recoder Peter''s
    question back: what are you thinking? Do not add more content. Wait for the thought to be named.'
