unit_id: gospel_of_mary.gom_23
unit_label: BG 8502, p. 18
title: Did I think this up in my heart?
unit_type: teaching_passage
commentary: 'Mary''s tears are not collapse. They are the soul''s question to Wrath in human form: did
  I invent this, or am I lying? Brother is still her word for him. The gospel will not let you keep the
  ascent as private mysticism. It lands as a fight about who is allowed to have heard. If you skip this
  gate, Mary is a mascot. Here she is a witness under cross-examination, asking the examiner to name his
  thought. The misconception: that tears mean she has lost the unwavering mind. Unwavering was at the
  sight of the Lord. This is grief at being recoded as a liar.'
