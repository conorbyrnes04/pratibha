unit_id: gospel_of_mary.gom_25
unit_label: BG 8502, p. 18
title: If the Savior made her worthy, who are you to reject her?
unit_type: teaching_passage
commentary: 'Worth is the Savior''s to confer, not Peter''s to revoke. Love-more-than-us is restated without
  Peter''s ''than the rest of the women.'' The ranking Peter used as a cage becomes, in Levi''s mouth,
  a fact about knowledge: he knows her accurately, therefore he loved her more. Who are you is the question
  the powers asked the soul, now asked of the gatekeeper. The misconception: that the circle confers and
  withdraws worthiness to hear. The book locates worth in the one who made her worthy.'
