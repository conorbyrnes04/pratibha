- kind: key_terms
  label: Key Terms
  items:
  - term: ⲁⲝⲓⲟⲥ
    definition: worthy — conferred by the Savior, not by the circle
  - term: ⲛⲟϫ ⲉⲃⲟⲗ
    definition: to reject / cast out — Peter's move; Levi forbids it
  - term: ⲥⲟⲟⲩⲛ ⲛⲁⲧⲁⲕⲣⲓⲃⲉⲥ
    definition: knows her accurately — the ground of the love, not a slight to the men
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 114
    resonance: Peter wants Mary out; Jesus answers by changing her.
    divergence: Thomas keeps Jesus as the solver; Mary lets a disciple rebuke Peter.
  - citation: Luke 7:47
    resonance: The one who is forgiven more loves more.
    divergence: Luke ties love to forgiveness; Levi ties love to accurate knowing by the Savior.
