- kind: translation
  label: Pratibha Translation
  body: Desire said, I did not see you going down, but now I see you going up. Why are you lying, since
    you belong to me? The soul said, I saw you, but you did not see me or know me. I was to you just a
    garment, and you did not recognize me. When it said this, it left, rejoicing greatly.
- kind: commentary
  label: Pratibha Commentary
  body: 'We re-enter mid-ascent. Desire''s claim is ownership: you came up through me, so you are mine.
    The soul''s answer is the whole anthropology of the book. Desire never saw the soul — only the garment.
    Belonging was a costume-error. The soul saw Desire; Desire did not know the wearer. Recognition is
    one-way, and that is enough to leave rejoicing. This is not prudery about wanting. It is the end of
    being identified with the heat that mistook a dress for a person.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲉⲡⲓⲑⲩⲙⲓⲁ
    definition: Desire — a power that claims the soul because it saw the ascent
  - term: ϩⲟⲓⲧⲉ
    definition: garment — what Desire knew; not the soul
  - term: ⲥⲟⲩⲱⲛ
    definition: recognize / know — Desire's failure; the soul's success
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 37
    resonance: When you take off your clothes without shame and put them underfoot — the garment is not
      you.
    divergence: Thomas makes stripping a condition of seeing; Mary makes Desire the one who never saw
      past the cloth.
  - citation: Lalla, 'I found him in my own house'
    resonance: The search abroad mistakes a costume for a missing person.
    divergence: Lalla finds the guru as Self; Mary finds that Desire never knew her.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Name one desire that talks as if you belong to it. Answer, silently: you saw a garment. Walk
    to the next task without arguing with it.'
