unit_label: BG 8502, p. 15
title: I was a garment, and you did not know me
unit_type: teaching_passage
commentary: 'We re-enter mid-ascent. Desire''s claim is ownership: you came up through me, so you are
  mine. The soul''s answer is the whole anthropology of the book. Desire never saw the soul — only the
  garment. Belonging was a costume-error. The soul saw Desire; Desire did not know the wearer. Recognition
  is one-way, and that is enough to leave rejoicing. This is not prudery about wanting. It is the end
  of being identified with the heat that mistook a dress for a person.'
