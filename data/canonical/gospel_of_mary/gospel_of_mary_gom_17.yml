title: The seven forms of Wrath
unit_type: teaching_passage
commentary: 'Wrath is not one feeling. It is a seven-form checkpoint: dark, want, not-knowing, death-zeal,
  flesh-kingdom, clever flesh, angry wisdom. Desire and Ignorance, already passed as separate powers,
  return as forms of Wrath — the climb is not a list you finish. The last two are the most religious:
  a stupid wisdom of flesh, and a wisdom that is just anger with a doctrine. The misconception: that wrath
  is only heat. Here it includes the cleverness that defends the flesh and the ideology that burns. Name
  the form, or you will think you have passed Wrath while sitting in its seventh face.'
