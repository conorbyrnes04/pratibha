- kind: translation
  label: Pratibha Translation
  body: 'When the soul had overcome the third power, it went up and saw the fourth power, which took seven
    forms: Darkness; Desire; Ignorance; Zeal for Death; the Kingdom of the Flesh; the Foolish Wisdom of
    Flesh; the Wisdom of Anger. These are the seven powers of Wrath.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Wrath is not one feeling. It is a seven-form checkpoint: dark, want, not-knowing, death-zeal,
    flesh-kingdom, clever flesh, angry wisdom. Desire and Ignorance, already passed as separate powers,
    return as forms of Wrath — the climb is not a list you finish. The last two are the most religious:
    a stupid wisdom of flesh, and a wisdom that is just anger with a doctrine. The misconception: that
    wrath is only heat. Here it includes the cleverness that defends the flesh and the ideology that burns.
    Name the form, or you will think you have passed Wrath while sitting in its seventh face.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲟⲣⲅⲏ
    definition: Wrath — a seven-formed power, not a passing temper
  - term: ⲙⲟⲣⲫⲏ
    definition: form — Wrath's disguises; Desire and Ignorance among them
  - term: ⲥⲟⲫⲓⲁ ⲛⲧⲥⲁⲣⲝ
    definition: wisdom of flesh — cleverness in the service of the body-kingdom
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Evagrius, Praktikos 6–14
    resonance: The eight logismoi, including anger and vainglory, as a sequence of thoughts.
    divergence: Evagrius maps thoughts to starve; Mary maps Wrath as a power with seven faces on an ascent.
  - citation: John 8:44
    resonance: The devil is a liar and the father of it — a single adversary.
    divergence: John gives one father of lies; Mary gives Wrath a seven-form anatomy, including religious
      wisdom.
- kind: practice
  label: Practice (Abhyasa)
  body: When anger appears today, do not only call it anger. Ask which form it is wearing (dark, want,
    not-knowing, death-zeal, flesh-kingdom, cleverness, angry wisdom). Name the form once. Do not argue
    with it yet.
