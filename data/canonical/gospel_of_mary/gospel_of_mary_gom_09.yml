unit_label: BG 8502, p. 9
title: He has prepared us and made us Human
unit_type: teaching_passage
commentary: 'Mary does not add information first. She stops the split heart, names grace as already with
  them, and recalls what they have been made: Human — the same word as the Human One within. Leadership
  here is not rank. It is the one who can stand when the group is weeping about Gentiles and death. The
  later quarrel with Peter is already seeded: she has done the thing the farewell asked. The misconception:
  that after the teacher leaves, the remaining work is strategy. The remaining work is stature.'
