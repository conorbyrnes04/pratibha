- kind: translation
  label: Pratibha Translation
  body: Then Mary arose, greeted them all, and said to her brothers and sisters, Do not weep and do not
    grieve, and do not let your hearts be divided, for his grace will be with you all and will protect
    you. Rather we should praise his greatness, because he has prepared us and made us Human.
- kind: commentary
  label: Pratibha Commentary
  body: 'Mary does not add information first. She stops the split heart, names grace as already with them,
    and recalls what they have been made: Human — the same word as the Human One within. Leadership here
    is not rank. It is the one who can stand when the group is weeping about Gentiles and death. The later
    quarrel with Peter is already seeded: she has done the thing the farewell asked. The misconception:
    that after the teacher leaves, the remaining work is strategy. The remaining work is stature.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ϩⲏⲧ ⲥⲛⲁⲩ
    definition: a divided / double heart — the first thing Mary forbids
  - term: ⲣⲱⲙⲉ
    definition: Human — what the Savior has made them; not a gender, a stature
  - term: ⲭⲁⲣⲓⲥ
    definition: grace — with you, not waiting at the Gentile border
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 1:12–13
    resonance: Authority to become children of God, born not of bloods.
    divergence: John's childship is given by receiving the light; Mary's Human is a stature already prepared.
  - citation: Gospel of Thomas 3
    resonance: When you know yourselves you will know you are children of the living Father.
    divergence: Thomas ties stature to self-knowledge; Mary announces it to a weeping room.
- kind: practice
  label: Practice (Abhyasa)
  body: In one anxious group (a thread, a table, a family), do not add a plan. Stop the split. Name one
    grace already with you. Speak as Human, not as the frightened remainder.
