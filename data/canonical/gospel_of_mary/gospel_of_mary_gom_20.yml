- kind: translation
  label: Pratibha Translation
  body: When Mary said these things, she fell silent, because the Savior had spoken with her up to this
    point.
- kind: commentary
  label: Pratibha Commentary
  body: 'The form of the gospel becomes the practice. Mary does not add a conclusion, a moral, or a claim
    to have seen the rest of the lost pages. She stops because he stopped. The lacuna of pp. 11–14 is
    not filled by invention. Silence here is fidelity to the measure of the speech, not a failure of nerve.
    Andrew and Peter will rush into that silence with objections. The misconception: that a teacher who
    falls silent has not finished, and that the group must complete her. The book says she finished when
