work_title: Gospel of Mary
unit_id: gospel_of_mary.gom_20
unit_label: BG 8502, p. 17
title: Mary fell silent
unit_type: teaching_passage
commentary: 'The form of the gospel becomes the practice. Mary does not add a conclusion, a moral, or
  a claim to have seen the rest of the lost pages. She stops because he stopped. The lacuna of pp. 11–14
  is not filled by invention. Silence here is fidelity to the measure of the speech, not a failure of
  nerve. Andrew and Peter will rush into that silence with objections. The misconception: that a teacher
  who falls silent has not finished, and that the group must complete her. The book says she finished
  when he did.'
