- kind: key_terms
  label: Key Terms
  items:
  - term: ⲕⲁⲣⲱⲥ
    definition: she fell silent — the narrator's act matching the soul's rest
  - term: ϣⲁ ⲡⲉⲓⲙⲁ
    definition: up to this point — the measure of the Savior's speech; Mary will not exceed it
  - term: ⲡⲥⲱⲧⲏⲣ
    definition: the Savior — still the source; Mary is witness, not author of extra ending
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: The Cloud of Unknowing, 'I do not know'
    resonance: The teacher falls into the cloud with the student.
    divergence: The Cloud's silence is chosen unknowing; Mary's is the end of a reported ascent.
  - citation: Gospel of Thomas 13
    resonance: Jesus took Thomas aside; when Thomas returns he will not say what Jesus said.
    divergence: Thomas withholds; Mary has spoken and then matches his stopping-point.
- kind: practice
  label: Practice (Abhyasa)
  body: When you have said all that was actually given, stop. Do not complete the silence with a theory.
    Let someone else speak first, or let no one.
