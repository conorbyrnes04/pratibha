unit_label: BG 8502, p. 8
title: Passion has no image — be content at heart
unit_type: teaching_passage
commentary: 'The trick now has a physiology. Passion without an image — a heat that has no form because
  it is against nature. The body becomes a weather of confusion. The medicine is not contempt for images.
  It is contentment of heart, and if the heart is already split, to take contentment in the images of
  nature rather than in the imageless passion. The Savior does not say: flee the visible. He says: stop
  marrying the thing that has no face. Images of nature are allowed. The faceless urgency is not.'
