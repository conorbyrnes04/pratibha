- kind: translation
  label: Pratibha Translation
  body: Matter gave birth to a passion that has no image, because it comes from what is contrary to nature.
    Then confusion arises in the whole body. That is why I told you to be content at heart. If you are
    discontented, find contentment in the presence of the various images of nature. Whoever has ears to
    hear should hear.
- kind: commentary
  label: Pratibha Commentary
  body: 'The trick now has a physiology. Passion without an image — a heat that has no form because it
    is against nature. The body becomes a weather of confusion. The medicine is not contempt for images.
    It is contentment of heart, and if the heart is already split, to take contentment in the images of
    nature rather than in the imageless passion. The Savior does not say: flee the visible. He says: stop
    marrying the thing that has no face. Images of nature are allowed. The faceless urgency is not.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ⲡⲁⲑⲟⲥ
    definition: passion — here imageless, born against nature, not every feeling
  - term: ⲡⲁⲣⲁⲫⲩⲥⲓⲥ
    definition: what is contrary to nature — the source of the faceless heat
  - term: ϩⲧⲏ
    definition: heart — contentment here is a placement of the heart, not a mood
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Meister Eckhart, on detachment
    resonance: Imagelessness can be poverty that makes room, or a passion that has no face.
    divergence: Eckhart empties for God; Mary warns against an emptiness that is just hunger without an
      object.
  - citation: Patañjali, Yoga Sūtra 1.2–3
    resonance: Stilling the turnings lets the seer rest in its nature.
    divergence: Patañjali stills citta; Mary traces confusion to loving a trick, then seats the heart
      among nature's images.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one desire that has no image — a vague more, a faceless urgency. Set it down. Rest the heart
    on one actual thing of nature (light, weight, breath) for one minute.
