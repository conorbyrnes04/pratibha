unit_label: BG 8502, p. 9
title: Do not lay down another law
unit_type: teaching_passage
commentary: 'Preach, then the second blow: do not become a second Moses. Extra rules bind the ones who
  make them. A gospel that starts as inner finding can harden, in a week, into a new law. Mary will later
  be accused of inventing teaching. This saying is why the accusation is false, and why Peter''s later
  statute (who may hear) is already forbidden. He leaves. The group is now unsupervised. The misconception:
  that loyalty means adding fences around the gift.'
