- kind: translation
  label: Pratibha Translation
  body: Go then and preach the gospel of the kingdom. Do not lay down any rules beyond what I have given
    you, nor make a law like the lawgiver, lest you be bound by it. When he said these things, he left.
- kind: commentary
  label: Pratibha Commentary
  body: 'Preach, then the second blow: do not become a second Moses. Extra rules bind the ones who make
    them. A gospel that starts as inner finding can harden, in a week, into a new law. Mary will later
    be accused of inventing teaching. This saying is why the accusation is false, and why Peter''s later
    statute (who may hear) is already forbidden. He leaves. The group is now unsupervised. The misconception:
    that loyalty means adding fences around the gift.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ϩⲟⲣⲟⲥ
    definition: rule / limit — the extra statute that rebinds the free
  - term: ⲛⲟⲙⲟⲑⲉⲧⲏⲥ
    definition: lawgiver — the role they are forbidden to copy
  - term: ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
    definition: gospel — to be preached, not fenced
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 23:4
    resonance: They tie heavy burdens and will not lift them.
    divergence: Matthew attacks the scribes' extra loads; Mary forbids the disciples from becoming that
      lawgiver.
  - citation: Gospel of Thomas 14
    resonance: If you fast, you will beget sin for yourselves.
    divergence: Thomas warns that piety manufactures stain; Mary warns that extra law manufactures bondage.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one extra spiritual rule you have added this month (a private law of who is in, what counts,
    when you are allowed). Drop it for today. Preach, if at all, without it.
