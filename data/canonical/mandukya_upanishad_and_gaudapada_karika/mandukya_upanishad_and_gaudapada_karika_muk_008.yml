sanskrit_devanagari: एष सर्वेश्वरः एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम् ॥ ६ ॥
sanskrit_iast: eṣa sarveśvaraḥ eṣa sarvajñaḥ eṣo 'ntaryāmy eṣa yoniḥ sarvasya prabhavāpyayau hi bhūtānām || 6 ||
translation_literal: This one is the lord of all. This one knows all things. This one is the inner ruler. This one is the
  womb of all. From him indeed come forth and into him return all beings.
commentary: 'Verse 6 of the Māṇḍūkya Upaniṣad identifies Prājña—the consciousness of deep sleep (suṣupti)—with cosmic ground
  and creative source. The fourfold predication (sarveśvara, sarvajña, antaryāmin, yoni) establishes Prājña not as individual
  sleeper but as the transcendent substratum underlying all manifestation.


  The term sarveśvara (lord of all) and sarvajña (knower of all) might seem to attribute agency or omniscience to what appears
  to be an unconscious state. The resolution lies in understanding that Prājña''s apparent unconsciousness from the waking
  perspective is actually a mode of undifferentiated knowing—a unified field prior to subject-object division. Antaryāmin
  (inner ruler, inner witness) emphasizes that this consciousness pervades and governs all states and all beings without being
  localized or limited.


  The yoni (womb, source, matrix) designation is crucial: Prājña is not merely a state of individual consciousness but the
  cosmic matrix from which all differentiated existence emerges (prabhava) and into which it dissolves (apyaya). This is the
  ground of Gauḍapāda''s ajātivāda (non-origination doctrine): if all beings arise from and return to Prājña, and if Prājña
  is non-dual consciousness, then the apparent creation and dissolution are modifications within consciousness itself—not
  true origination or destruction.


  This verse prepares the ground for the fourth state (turīya) by establishing that the three states (waking, dream, deep
  sleep) all occur within and depend upon a single, unchanging conscious principle. Prājña represents the deepest accessible
  stratum of individual consciousness; turīya transcends even this, as the witness of all states including Prājña itself.


  Key Terms


  **Prājña** — The consciousness of deep sleep (suṣupti); undifferentiated, unified awareness prior to subject-object distinction;
  cosmic ground of all manifestation

  **antaryāmin** — Inner ruler, inner witness; the transcendent consciousness that pervades and governs all states and beings
  from within

  **yoni** — Womb, source, matrix; the generative ground from which all beings emerge and into which they return'
insight: 'The verse makes a cosmic claim: the same Prājña that is the deep-sleep state of the individual is also the ground
  of universal manifestation.'
practice: 'Upon waking from sleep, before rising or opening your eyes fully, pause for one minute. Notice the quality of consciousness
  that is just now returning—the transition from the unified darkness of sleep into the fragmented world of thought and sensation.
  Do not try to ''hold'' sleep or ''achieve'' anything. Simply observe: What is aware of this transition? What remains constant
  whether you were asleep or are now waking? This gap between states is where Prājña—the ground consciousness—becomes accessible
  to direct recognition. Practice this observation for seven days, noting any shifts in your sense of continuity across the
  sleep-wake boundary. The point is not mystical experience but the direct noticing that awareness itself does not sleep;
  only its content does.'
