unit_label: Verse 6 · Prājña as Cosmic Ground
title: Verse 6 · Prājña as Cosmic Ground
unit_type: sutra
sanskrit_devanagari: एष सर्वेश्वरः एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम् ॥ ६ ॥
sanskrit_iast: eṣa sarveśvaraḥ eṣa sarvajñaḥ eṣo 'ntaryāmy eṣa yoniḥ sarvasya prabhavāpyayau hi bhūtānām || 6 ||
translation_literal: This is the Lord of all; this is the knower of all; this is the inner controller; this is the source
  of all — for this is the origin and dissolution of all beings.
commentary: 'The verse makes a cosmic claim: the same Prājña that is the deep-sleep state of the individual is also the ground
  of universal manifestation. *Sarveśvara* — Lord of all — not as theistic ruler but as the substratum on which all sovereignty
  rests. *Sarvajña* — knower of all — not omniscience as a faculty but as the consciousness that is the field in which all
  knowing occurs. *Antaryāmin* — the inner controller — the principle that governs all functions from within while remaining
  unaffected by them: Bṛhadāraṇyaka Upaniṣad''s great image of the one who dwells in earth, in water, in fire, in mind, controlling
  each from within, yet unknown to each.


  *Yoni* — source, womb, creative matrix — names the generative function. Prājña is not just where things end up (dissolution)
  but where they come from (origin). *Prabhavāpyayau hi bhūtānām* — origin and dissolution of all beings — establishes the
  eternal rhythm: multiplicity emerges from the causal ground and returns to it, in cosmic cycles and in the daily rhythm
  of waking-sleeping-waking.


  What is extraordinary is that this verse makes the individual''s nightly experience of deep sleep into a microcosmic participation
  in cosmic reality. You return to the ground of being every night. The question the Upaniṣad is building toward is: what
  if you could recognize this ground while awake?


  Key Terms:


  - **sarveśvara** — Lord of all; *sarva* (all) + *īśvara* (lord, controller); not theistic kingship but ontological priority

  - **sarvajña** — omniscient; knowing all things by being the medium in which all knowing occurs

  - **antaryāmin** — inner controller; from *antar* (within) + *yam* (to control, restrain); the governing principle within
  all things

  - **yoni** — source, womb, creative matrix; the generative ground of existence

  - **prabhavāpyaya** — origin and dissolution; *prabhava* (arising, emergence) + *apyaya* (merging back, dissolution)


  Cross-Tradition Resonances:


  - Pratyabhijñāhṛdayam 1: *citiḥ svatantrā viśvasiddhihetuḥ* — Citi as the cause of the universe''s triple process; the same
  *prabhavāpyaya* described through Kashmir Śaiva terminology

  - Dào Dé Jīng ch. 25: "There is something undifferentiated and complete, born before heaven and earth... It is the mother
  of the ten thousand things." The Tao as Yoni — the Daoist parallel to Prājña as cosmic matrix

  - Gospel of John 1.1: "In the beginning was the Word... All things were made through him." The Logos as creative ground
  parallel to Prājña-as-Yoni — though the Māṇḍūkya locates this ground in consciousness rather than a separate divine agent'
insight: 'The verse makes a cosmic claim: the same Prājña that is the deep-sleep state of the individual is also the ground
  of universal manifestation.'
practice: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
