sanskrit_devanagari: स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः
  ॥ ४ ॥
sanskrit_iast: svapnasthāno 'ntaḥprajñaḥ saptāṅga ekonaviṃśatimukhaḥ praviviktabhuk taijaso dvitīyaḥ pādaḥ
  || 4 ||
translation_literal: The one who knows in the dream state is the inner-knowing consciousness, possessing
  seven limbs and nineteen mouths, experiencing subtle objects. This is the second quarter, called the
  luminous self.
commentary: 'Verse 4 of the Māṇḍūkya Upaniṣad describes the second of the four states of consciousness—the
  dream state (svapna). Here, the text introduces a crucial shift from the waking subject (Vaiśvānara)
  to the dream subject (Taijasa, ''the luminous one'').


  The term ''antaḥprajñaḥ'' (inner-knowing) signals that dream consciousness is introspective and self-contained,
  operating without external sense contact. Unlike waking perception, which depends on external objects
  and sense organs, the dream state generates its entire world from internal impressions (vāsanā) and
  mental modifications (vṛtti).


  The ''seven limbs'' (saptāṅga) traditionally refer to the subtle body''s constituents—typically: prāṇa
  (vital breath), manas (mind), buddhi (intellect), ahaṃkāra (ego-sense), and three subtle elements. The
  ''nineteen mouths'' (ekonaviṃśatimukhaḥ) enumerate the channels through which experience flows: five
  sense organs of perception, five organs of action, five vital breaths (prāṇa, apāna, vyāna, udāna, samāna),
  mind, intellect, and ego—nineteen gateways of the subtle body''s functioning.


  ''Praviviktabhuk'' means ''experiencing what is separate'' or ''experiencing distinct objects''—the
  dream world appears as a coherent, apparently external reality, yet it is entirely woven from the dreamer''s
  own mental substance. This is philosophically crucial: the dream state demonstrates that consciousness
  can generate a complete world without external objects, suggesting that waking reality too may be a
  projection of consciousness.


  Taijasa (''the luminous'') refers to the predominance of the subtle elements (tanmātra) and the quality
  of light-like awareness that characterizes this state. The dream body is composed of subtle matter,
  not gross physical matter.


  In Gauḍapāda''s non-origination (ajātivāda) framework, the dream state becomes a key pedagogical tool:
  if the waker can recognize that the dream world—though vivid and apparently real—never truly originated
  (the dream objects have no independent reality), then by analogy, the waking world too may be understood
  as never having truly originated independent of consciousness. Both states are modifications of the
  same underlying awareness, neither fundamentally real in an absolute sense.


  Key Terms


  **antaḥprajñaḥ** — inner-knowing consciousness; awareness that knows from within, without dependence
  on external sense contact

  **taijasa** — the luminous self; the subtle-bodied subject of the dream state, characterized by predominance
  of subtle elements and inner radiance

  **praviviktabhuk** — experiencing what is separate or distinct; the capacity to perceive a differentiated
  world of subtle objects within the dream state'
insight: '*Taijasa* — "the luminous one," from *tejas* (light, radiance) — names the dream-state consciousness
  by its most salient characteristic: it is self-illuminating.'
practice: Close your eyes and trace the sensation of your breath moving through your nostrils, throat,
  and chest—noticing how each inhalation and exhalation creates a subtle inner landscape without needing
  any external object. When a thought, memory, or image arises, let it be like a dream-object appearing
  in that inner space, then watch it dissolve as the breath continues. Do this for five minutes, recognizing
  that the consciousness observing both breath and thought is the same luminous inner-knower that creates
  entire worlds in sleep.
