    resonance: '*ātmājñānāj jagad bhāti ātmajñānān na bhāsate | rajjvajñānād ahir bhāti tajjñānād bhāsate na hi* — the world
      appears through ignorance of the Self; with Self-knowledge it ceases to appear — just as the snake appears through ignorance
      of the rope. The *rajju-sarpa* logic is identical to the Vaitathya analysis: both states are superimpositions on a ground
      that remains unchanged.'
    divergence: ''
    passage_id: astavakra_gita.asg_2_7
  - citation: Zhuāngzǐ, the Butterfly Dream
    resonance: '"Now I do not know whether I was then a man dreaming I was a butterfly, or whether I am now a butterfly dreaming
      I am a man." The epistemological problem Gauḍapāda addresses philosophically, Zhuāngzǐ poses poetically — and both arrive
      at the same unfixable gap between state and state.'
    divergence: ''
