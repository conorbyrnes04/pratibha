- kind: iast
  label: IAST
  body: svapnasthāno 'ntaḥprajñaḥ saptāṅga ekonaviṃśatimukhaḥ praviviktabhuk taijaso dvitīyaḥ pādaḥ || 4 ||
- kind: translation
  label: Pratibha Translation
  body: The second quarter is Taijasa — whose sphere is the dream state, who is conscious of the internal, who has seven limbs
    and nineteen mouths, and who experiences subtle objects.
- kind: commentary
  label: Pratibha Commentary
  body: '*Taijasa* — "the luminous one," from *tejas* (light, radiance) — names the dream-state consciousness by its most
    salient characteristic: it is self-illuminating. In dream, consciousness needs no external light source. It creates its
    worlds from its own radiance, using the impressions (*vāsanā*) left by waking experience as its raw material.


    The identical structure — seven limbs, nineteen mouths — operating now at the *sūkṣma* (subtle) level makes the philosophical
    point precisely. Dream is not a deficient form of waking; it is the same consciousness operating at a different register.
    This is the setup for the *Vaitathya Prakaraṇa*''s central argument: if dream objects can appear completely real during
    the dream, and are retrospectively recognized as unreal only from the waking state, then what guarantees that waking objects
    are not similarly real-appearing-and-ultimately-unreal when viewed from a higher epistemic standpoint?


    *Antaḥprajña* — "inwardly conscious" — names the reversal: what was oriented outward in waking turns inward. The source
    of objects shifts from the shared material world to individual impressional content. Śaṅkara: "like a piece of canvas
    with pictures painted on it" — the dream mind holds the impressional material of waking experience and projects it as
    experience.


    Key Terms:


    - **taijasa** — the luminous one; from *tejas* (fire, radiance); consciousness as self-illuminating creator of its dream-world

    - **svapnasthāna** — whose sphere is dream; *svapna* (dream, from *svap*, to sleep) + *sthāna* (sphere, place)

    - **antaḥprajña** — inwardly conscious; the reversal of the outward orientation of waking

    - **praviviktabhuk** — experiencer of the refined/subtle/discriminated; *pravivikta* (well-distinguished, subtle) + *bhuj*'
