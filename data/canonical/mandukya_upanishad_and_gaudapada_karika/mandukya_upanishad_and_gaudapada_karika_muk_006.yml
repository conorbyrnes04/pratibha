- kind: practice
  label: Practice (Abhyasa)
  body: 'Tonight, before sleep: notice the moment of transition. As the waking state dissolves and dream begins to form, what
    is it that witnesses both? The transition is brief, but something is present through it. This witness — which is not itself
    waking or dreaming — is the thread the Māṇḍūkya is pulling. In the morning, notice the reverse transition: something was
    aware of deep sleep as well, since you remember having slept.'
