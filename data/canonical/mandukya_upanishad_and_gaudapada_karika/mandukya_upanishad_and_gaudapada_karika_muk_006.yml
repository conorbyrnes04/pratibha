title: Verse 4 · Svapna — The Dream State
unit_type: sutra
sanskrit_devanagari: स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः
  ॥ ४ ॥
sanskrit_iast: svapnasthāno 'ntaḥprajñaḥ saptāṅga ekonaviṃśatimukhaḥ praviviktabhuk taijaso dvitīyaḥ pādaḥ
  || 4 ||
translation_literal: The second quarter is Taijasa — whose sphere is the dream state, who is conscious
  of the internal, who has seven limbs and nineteen mouths, and who experiences subtle objects.
commentary: '*Taijasa* — "the luminous one," from *tejas* (light, radiance) — names the dream-state consciousness
  by its most salient characteristic: it is self-illuminating. In dream, consciousness needs no external
  light source. It creates its worlds from its own radiance, using the impressions (*vāsanā*) left by
  waking experience as its raw material.


  The identical structure — seven limbs, nineteen mouths — operating now at the *sūkṣma* (subtle) level
  makes the philosophical point precisely. Dream is not a deficient form of waking; it is the same consciousness
  operating at a different register. This is the setup for the *Vaitathya Prakaraṇa*''s central argument:
  if dream objects can appear completely real during the dream, and are retrospectively recognized as
  unreal only from the waking state, then what guarantees that waking objects are not similarly real-appearing-and-ultimately-unreal
  when viewed from a higher epistemic standpoint?


  *Antaḥprajña* — "inwardly conscious" — names the reversal: what was oriented outward in waking turns
  inward. The source of objects shifts from the shared material world to individual impressional content.
  Śaṅkara: "like a piece of canvas with pictures painted on it" — the dream mind holds the impressional
  material of waking experience and projects it as experience.


  Key Terms:


  - **taijasa** — the luminous one; from *tejas* (fire, radiance); consciousness as self-illuminating
  creator of its dream-world

  - **svapnasthāna** — whose sphere is dream; *svapna* (dream, from *svap*, to sleep) + *sthāna* (sphere,
  place)

  - **antaḥprajña** — inwardly conscious; the reversal of the outward orientation of waking

  - **praviviktabhuk** — experiencer of the refined/subtle/discriminated; *pravivikta* (well-distinguished,
  subtle) + *bhuj*


  Cross-Tradition Resonances:


  - Aṣṭāvakra Gītā 2.7: *ātmājñānāj jagad bhāti ātmajñānān na bhāsate | rajjvajñānād ahir bhāti tajjñānād
  bhāsate na hi* — the world appears through ignorance of the Self; with Self-knowledge it ceases to appear
  — just as the snake appears through ignorance of the rope. The *rajju-sarpa* logic is identical to the
  Vaitathya analysis: both states are superimpositions on a ground that remains unchanged.

  - Zhuāngzǐ, the Butterfly Dream: "Now I do not know whether I was then a man dreaming I was a butterfly,
  or whether I am now a butterfly dreaming I am a man." The epistemological problem Gauḍapāda addresses
  philosophically, Zhuāngzǐ poses poetically — and both arrive at the same unfixable gap between state
  and state.

  - Descartes'' *First Meditation*: the dream argument as the lever of radical doubt. Gauḍapāda uses the
  same lever but arrives at recognition rather than doubt, and at consciousness rather than the cogito.'
insight: '*Taijasa* — "the luminous one," from *tejas* (light, radiance) — names the dream-state consciousness
  by its most salient characteristic: it is self-illuminating.'
practice: 'Tonight, before sleep: notice the moment of transition. As the waking state dissolves and dream
  begins to form, what is it that witnesses both? The transition is brief, but something is present through
  it. This witness — which is not itself waking or dreaming — is the thread the Māṇḍūkya is pulling. In
  the morning, notice the reverse transition: something was aware of deep sleep as well, since you remember
  having slept.'
