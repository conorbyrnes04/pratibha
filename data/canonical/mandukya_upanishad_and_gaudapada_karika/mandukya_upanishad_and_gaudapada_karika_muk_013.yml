sanskrit_devanagari: स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षादुभयत्वाद्वोत्कर्षति ह वै ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले
  भवति य एवं वेद ॥ १० ॥
sanskrit_iast: svapnasthānas taijasa ukāro dvitīyā mātrā utkarṣād ubhayatvād vā utkarṣati ha vai jñānasantatiṃ samānaś ca
  bhavati nāsyābrahmavit kule bhavati ya evaṃ veda || 10 ||
translation_literal: The dream state belongs to Taijasa, the shining one. The letter U is the second measure. By elevation—or
  by both elevation and equality—U elevates the flow of knowing. One becomes equal to both. There is no one born in the family
  of one who knows this who would not be a knower of Brahman. Whoever understands in this way.
commentary: 'This verse assigns the dream state (svapna) to Taijasa, the subtle luminous consciousness that inhabits the subtle
  body during sleep. The syllable U (उ) represents this state as the second of OM''s three primary measures (mātrā). The verse
  employs two interpretive paths for understanding U''s function: ''elevation'' (utkarṣa) suggests that dream-consciousness
  elevates or refines the continuous flow of knowing (jñānasantati) beyond mere waking perception; ''both elevation and equality''
  (ubhayatva) suggests U mediates between the gross waking state (A) and the transcendent fourth state, making the dreamer
  equal to both dimensions of experience. This equality is crucial: in dream, the mind creates entire worlds without external
  objects, revealing consciousness as the fundamental creative power. The verse then makes a striking claim about lineage
  and knowledge: whoever truly understands this teaching—that the dream state is Taijasa, that U represents this elevation
  of knowing—ensures that no one born in their family will lack Brahman-knowledge. This is not mere intellectual understanding
  but realization that transforms the entire lineage. The statement points to ajātivāda (non-origination): if one truly knows
  the dream state as Taijasa, one recognizes that consciousness never actually becomes bound or limited; it only appears to
  do so. The family that understands this cannot produce ignorant offspring because the teaching itself is self-liberating—it
  reveals what was never actually born into bondage. The verse thus links personal realization to a kind of spiritual transmission
  that operates beyond ordinary causality.


  Key Terms


  **Taijasa** — The subtle, luminous consciousness that inhabits the subtle body during dream; literally ''the shining one,''
  characterized by inner radiance and subtle perception.

  **mātrā** — Measure or unit; the three primary measures of OM correspond to waking (A), dream (U), and deep sleep (M), with
  a fourth beyond measure (the silence after OM).

  **jñānasantati** — The continuous flow or stream of knowing; the unbroken continuity of consciousness that persists across
  all states of experience.'
insight: U is the middle vowel — between the open A and the closed M — and this medial position is its defining characteristic.
practice: During your next conversation with someone, notice the moment when you stop listening to their words and begin creating
  a private mental world in response—a dream-like commentary, judgment, or story running parallel to theirs. Pause there,
  and recognize that you are Taijasa in waking life, the shining one who creates worlds from consciousness alone. Hold yourself
  equal to both their speech and your inner creation, neither dismissing one nor losing the other.
