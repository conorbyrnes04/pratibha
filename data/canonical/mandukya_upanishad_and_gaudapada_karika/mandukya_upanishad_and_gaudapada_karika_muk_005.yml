sanskrit_devanagari: जागरितस्थानो बहिष्प्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः ॥ ३ ॥
sanskrit_iast: jāgaritasthāno bahiṣprajñaḥ saptāṅga ekonaviṃśatimukhaḥ sthūlabhug vaiśvānaraḥ prathamaḥ pādaḥ || 3 ||
translation_literal: The waking state is where the individual self, knowing only what lies outside, stands forth. Seven are
  its limbs, nineteen its gates. It feeds on the gross; this is Vaiśvānara, the first quarter.
commentary: 'Gauḍapāda''s opening characterization of waking consciousness establishes the framework for the entire Upaniṣad''s
  investigation of OM and the four states of consciousness. Here, the waking state (jāgarita) is defined not by its phenomenological
  richness but by a specific epistemic limitation: bahiṣprajña—knowing only externals, turned outward. This is not a judgment
  but a precise description of the scope of waking awareness.


  The ''seven limbs'' (saptāṅga) refer to the seven elements of embodied existence: head, trunk, two arms, two legs, and the
  generative center. The ''nineteen gates'' (ekonaviṃśatimukha) enumerate the openings through which the waking self engages
  the external world: two eyes, two ears, two nostrils, one mouth, one anus, one urinary opening, and nine openings in the
  head (the two eyes, two ears, two nostrils, and the mouth are counted again in some systems, or the nine represent the sense-apertures
  plus the mind''s gateway). These are not arbitrary numbers but a systematic mapping of how embodied consciousness interfaces
  with gross materiality.


  Vaiśvānara—''the universal fire'' or ''the one who eats all''—names this state as the consuming principle. The waking self
  is fundamentally a consumer: it takes in, processes, and metabolizes the external world through sense and action. Sthūlabhug,
  ''feeder on the gross,'' confirms this: waking consciousness is structured around engagement with solid, tangible, divisible
  matter.


  Critically, this verse does not say the waking state is *false* or *illusory*. Rather, it is *limited*—bounded by exteriority,
  by the gross, by the sensory apparatus. The Māṇḍūkya''s non-origination doctrine (ajātivāda) will later suggest that all
  four states are equally real appearances within the infinite consciousness OM; none originates or ceases. But here, Gauḍapāda
  establishes the baseline: waking is the state in which the self knows only what is outside itself, through a finite bodily
  apparatus, feeding on finite objects. This sets up the contrast with dream (where the subject generates its own world),
  deep sleep (where even that dissolves), and turīya (where the knower and known are one).


  Key Terms


  **bahiṣprajña** — knowing only externals; consciousness turned outward toward the objective world

  **Vaiśvānara** — the universal fire; the principle of consumption; the presiding deity of the waking state

  **sthūlabhug** — feeder on the gross; the waking self as consumer of solid, tangible matter'
insight: '*Vaiśvānara* — "belonging to all people" or "universal" — names waking consciousness in its cosmic dimension.'
practice: Throughout this day, each time you notice yourself reaching outward—grasping at something seen, heard, or desired—pause
  and whisper 'bahiṣprajña' (knowing only externals), then turn your attention inward for three breaths to the space behind
  that gate. Let this become your reminder that the waking self knows only what lies outside, and that turning inward is always
  possible.
