pratibha_layers:
- kind: original
  label: Original
  body: जागरितस्थानो बहिष्प्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः ॥ ३ ॥
- kind: iast
  label: IAST
  body: jāgaritasthāno bahiṣprajñaḥ saptāṅga ekonaviṃśatimukhaḥ sthūlabhug vaiśvānaraḥ prathamaḥ pādaḥ || 3 ||
- kind: translation
  label: Pratibha Translation
  body: The first quarter is Vaiśvānara — whose sphere is the waking state, who is conscious of the external, who has seven
    limbs and nineteen mouths, and who experiences gross objects.
- kind: commentary
  label: Pratibha Commentary
  body: '*Vaiśvānara* — "belonging to all people" or "universal" — names waking consciousness in its cosmic dimension. Even
    ordinary waking experience participates in something that exceeds the individual. The seven limbs (*saptāṅga*) are the
    cosmic body of which the individual body is a localization: heaven as head, sun as eye, air as breath, space as trunk,
    water as lower region, earth as feet, fire as mouth. The nineteen mouths (*ekonaviṃśatimukha*) are the complete apparatus
    through which consciousness experiences the waking world: five organs of perception, five organs of action, five vital
    airs, mind, intellect, ego-sense, and memory.


    The philosophical implication is significant: individual waking consciousness is *cosmic consciousness functioning at
    a particular aperture*. The sense of being a separate individual in a world of objects is the result of identifying consciousness
    with this nineteen-mouthed apparatus rather than recognizing it as the field in which all apparatuses appear.


    *Sthūlabhuk* — "experiencer of the gross" — names the mode: consciousness engaged with dense, relatively stable objects.
    The word *sthūla* (gross/dense) already signals that this is a relative description; the dream state''s objects are *sūkṣma*
    (subtle/refined), but equally real from within their own register.


    Key Terms:


    - **vaiśvānara** — universal, all-pervasive; the cosmic name for waking consciousness; from *viśva* (all) + *nara* (human/being)

    - **bahiṣprajña** — outwardly conscious; *bahis* (outside) + *prajña* (consciousness); awareness oriented toward external
    objects

    - **saptāṅga** — seven-limbed; the cosmic body enumerated in the Chāndogya Upaniṣad 5.18.2

    - **ekonaviṃśatimukha** — nineteen-mouthed; the complete experiential apparatus

    - **sthūlabhuk** — enjoyer of the gross; *sthūla* (gross, dense, material) + *bhuj* (to enjoy, to experience)'
