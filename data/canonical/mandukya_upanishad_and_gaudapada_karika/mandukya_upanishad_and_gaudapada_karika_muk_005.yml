- kind: practice
  label: Practice (Abhyasa)
  body: 'Right now, in this waking moment: notice the nineteen mouths at work — some senses receiving, some organs ready for
    action, breath moving, mind interpreting, intellect judging, memory cross-referencing. All of this is happening. Now notice:
    all of this is appearing *in* awareness. The apparatus is within consciousness, not the other way around. This recognition
    — brief, light, repeated — is the beginning of *jāgrat* being seen through rather than merely lived in.'
