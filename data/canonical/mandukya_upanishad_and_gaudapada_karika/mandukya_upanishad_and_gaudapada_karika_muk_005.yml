sanskrit_devanagari: जागरितस्थानो बहिष्प्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः ॥ ३ ॥
sanskrit_iast: jāgaritasthāno bahiṣprajñaḥ saptāṅga ekonaviṃśatimukhaḥ sthūlabhug vaiśvānaraḥ prathamaḥ pādaḥ || 3 ||
translation_literal: The first quarter is Vaiśvānara — whose sphere is the waking state, who is conscious of the external,
  who has seven limbs and nineteen mouths, and who experiences gross objects.
commentary: '*Vaiśvānara* — "belonging to all people" or "universal" — names waking consciousness in its cosmic dimension.
  Even ordinary waking experience participates in something that exceeds the individual. The seven limbs (*saptāṅga*) are
  the cosmic body of which the individual body is a localization: heaven as head, sun as eye, air as breath, space as trunk,
  water as lower region, earth as feet, fire as mouth. The nineteen mouths (*ekonaviṃśatimukha*) are the complete apparatus
  through which consciousness experiences the waking world: five organs of perception, five organs of action, five vital airs,
  mind, intellect, ego-sense, and memory.


  The philosophical implication is significant: individual waking consciousness is *cosmic consciousness functioning at a
  particular aperture*. The sense of being a separate individual in a world of objects is the result of identifying consciousness
  with this nineteen-mouthed apparatus rather than recognizing it as the field in which all apparatuses appear.


  *Sthūlabhuk* — "experiencer of the gross" — names the mode: consciousness engaged with dense, relatively stable objects.
  The word *sthūla* (gross/dense) already signals that this is a relative description; the dream state''s objects are *sūkṣma*
  (subtle/refined), but equally real from within their own register.


  Key Terms:


  - **vaiśvānara** — universal, all-pervasive; the cosmic name for waking consciousness; from *viśva* (all) + *nara* (human/being)

  - **bahiṣprajña** — outwardly conscious; *bahis* (outside) + *prajña* (consciousness); awareness oriented toward external
  objects

  - **saptāṅga** — seven-limbed; the cosmic body enumerated in the Chāndogya Upaniṣad 5.18.2

  - **ekonaviṃśatimukha** — nineteen-mouthed; the complete experiential apparatus

  - **sthūlabhuk** — enjoyer of the gross; *sthūla* (gross, dense, material) + *bhuj* (to enjoy, to experience)


  Cross-Tradition Resonances:


  - Pratyabhijñāhṛdayam 3: *tannānānurūpagrāhyagrāhakabhedāt* — the universe is multiple because of the differentiation of
  reciprocally adapted objects and subjects. Both texts map the same grāhya-grāhaka (object-subject) polarity; the PHH frames
  it as how multiplicity arises from unity; the Māṇḍūkya maps it through the nineteen-mouthed apparatus.

  - Husserl''s phenomenology: the intentional structure of consciousness — always *consciousness-of* something — corresponds
  to the *bahiṣprajña* analysis. Husserl arrives at intentionality as a structural feature; the Māṇḍūkya asks what is prior
  to intentionality.

  - Epictetus on the *hegemonikon* (ruling faculty): the governing intelligence within the human being that can be rightly
  used — a functional parallel to the Māṇḍūkya''s nineteen-mouthed instrument, with the question of what grounds and uses
  it remaining open.'
insight: '*Vaiśvānara* — "belonging to all people" or "universal" — names waking consciousness in its cosmic dimension.'
practice: 'Right now, in this waking moment: notice the nineteen mouths at work — some senses receiving, some organs ready
  for action, breath moving, mind interpreting, intellect judging, memory cross-referencing. All of this is happening. Now
  notice: all of this is appearing *in* awareness. The apparatus is within consciousness, not the other way around. This recognition
  — brief, light, repeated — is the beginning of *jāgrat* being seen through rather than merely lived in.'
