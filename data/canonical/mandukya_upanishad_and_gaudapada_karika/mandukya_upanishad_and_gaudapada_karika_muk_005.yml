- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijñāhṛdayam 3
    resonance: '*tannānānurūpagrāhyagrāhakabhedāt* — the universe is multiple because of the differentiation of reciprocally
      adapted objects and subjects. Both texts map the same grāhya-grāhaka (object-subject) polarity; the PHH frames it as
      how multiplicity arises from unity; the Māṇḍūkya maps it through the nineteen-mouthed apparatus.'
    divergence: ''
    passage_id: pratyabhijnahrdayam.phr_003
  - citation: Husserl's phenomenology
    resonance: the intentional structure of consciousness — always *consciousness-of* something — corresponds to the *bahiṣprajña*
      analysis. Husserl arrives at intentionality as a structural feature; the Māṇḍūkya asks what is prior to intentionality.
    divergence: ''
    passage_id: ''
  - citation: Epictetus on the *hegemonikon* (ruling faculty)
    resonance: the governing intelligence within the human being that can be rightly used — a functional parallel to the Māṇḍūkya's
      nineteen-mouthed instrument, with the question of what grounds and uses it remaining open.
    divergence: ''
