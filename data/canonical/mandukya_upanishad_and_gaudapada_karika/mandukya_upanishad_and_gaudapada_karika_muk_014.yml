- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Yoga Spandakarika — First Flow
    resonance: 'Both texts identify a unified ground beneath the multiplicity of states: the Mandukya
      locates prājña as the measuring principle that dissolves distinctions in deep sleep, while the Spandakarika
      describes how ''relative notions tied to the ego rediscover their peaceful source deeply buried
      under all the different states.'' Each posits a substrate of consciousness that subsumes the flux
      of waking, dream, and sleep.'
    divergence: The Mandukya emphasizes prājña as a discrete state-consciousness (one of three), whereas
      Spandakarika treats the source as a continuous vibration (spanda) underlying and interpenetrating
      all states rather than replacing them.
    passage_id: yoga_spandakarika.sp_04
  - citation: Plotinus Enneads — Ennead I, Tractate 6, Section 2
    resonance: 'Both passages structure recognition as a return to what is already known: the Mandukya''s
      M ''measures'' or completes the Om by closing what was opened, implying a cyclical recognition of
      the whole; Plotinus describes the soul''s perception of beauty as ''an ancient recognition,'' a
      resonance with what it already is. Each makes recognition a structural act of closure or homecoming.'
    divergence: The Mandukya grounds recognition in the dissolution of all content (deep sleep), while
      Plotinus grounds it in the soul's encounter with transcendent beauty—a positive attraction rather
      than a negation of multiplicity.
    passage_id: plotinus_enneads.enn_i_6_02
