title: Verse 11 · M — Deep Sleep Consciousness
unit_type: sutra
sanskrit_devanagari: सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च
  भवति य एवं वेद ॥ ११ ॥
sanskrit_iast: suṣuptasthānaḥ prājño makāras tṛtīyā mātrā miter apīter vā minoti ha vā idaṃ sarvam apītiś
  ca bhavati ya evaṃ veda || 11 ||
translation_literal: The deep-sleep state is the wise one (prājña). The letter *m* is its measure. Through
  *m*, one measures or moves through all this, and becomes the measurer. One who knows this becomes the
  measurer.
commentary: 'Verse 11 completes the three-fold analysis of waking, dream, and deep sleep by assigning
  to deep sleep the syllable *m* (makāra) and the principle of *prājña*—the knowing subject in sleep.
  The verb *minoti* (to measure, to move, to traverse) carries a double sense: *m* both measures the state
  and allows consciousness to traverse it. The deep-sleep state is not mere blankness but a condition
  of unified knowing, prior to subject-object division. By recognizing oneself as the measurer—the unchanging
  witness of all three states—the knower transcends the illusion that consciousness is bound to any single
  state. This verse prepares the ground for Gauḍapāda''s non-origination teaching: if the self remains
  the constant measurer across waking, dream, and sleep, it cannot truly originate or be destroyed by
  any state. The deep-sleep state, often dismissed as mere absence, is revealed here as a direct encounter
  with undifferentiated consciousness—the gateway to understanding turīya, the fourth state that pervades
  all three.


  Key Terms


  **prājña** — The knowing subject in deep sleep; consciousness in its unified, undifferentiated form,
  prior to the subject-object split

  **makāra** — The letter *m*, the third measure of OM; represents the principle of measure, movement,
  and the deep-sleep state

  **minoti** — To measure, traverse, or move through; the root action by which consciousness measures
  and inhabits each state'
insight: M closes the lips and ends the sounding of Om.
practice: 'In the moment you notice yourself growing drowsy tonight, hold your awareness on the transition
  itself—the instant before thought dissolves—and silently ask: who witnesses this falling away? Let the
  *m* sound arise naturally from that question, not as something you produce but as the measure of the
  threshold you are crossing. Do not follow sleep; remain as the measurer observing the measurer dissolve.'
