sanskrit_devanagari: सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च
  भवति य एवं वेद ॥ ११ ॥
sanskrit_iast: suṣuptasthānaḥ prājño makāras tṛtīyā mātrā miter apīter vā minoti ha vā idaṃ sarvam apītiś
  ca bhavati ya evaṃ veda || 11 ||
translation_literal: Prājña, whose sphere is deep sleep, is M — the third element — on account of its
  measuring or its dissolution. One who knows this measures all this and becomes that in which all dissolves.
commentary: 'M closes the lips and ends the sounding of Om. It is the consonant of closure, gathering,
  return. *Miti* (measuring): M provides the container, the measure, the limit within which the other
  sounds are defined. *Apīti* (dissolution, becoming-one-in): all the preceding sounds merge into M as
  their concluding resolution.


  Prājña as the causal state is similarly the measure of the other two — it is the matrix from which they
  emerge and into which they return. Each day''s waking and dreaming life is measured out from the deep-sleep
  causal ground and returns to it each night. The practitioner who truly knows this — not intellectually
  but through recognition — becomes *apīti* itself: the one in whom all dissolves, which is to say: the
  one who is recognized as the ground rather than as one of the states that arise in it.


  Key Terms


  **Prājña** — The knower in deep sleep (suṣupti); the causal state of consciousness in which individual
  distinctions dissolve into undifferentiated awareness.

  **miti** — Measuring, delimiting, containing; the function by which M (and Prājña) establishes the measure
  and boundary within which other states are defined.

  **apīti** — Dissolution, becoming-one-in, return; the process by which all preceding sounds (and waking/dreaming
  states) merge back into their source.


  Cross-Tradition Resonances


  **Upaniṣad Brahma Sūtra 1.1.1 (Tat tvam asi):** Both passages teach non-dual recognition of the ground
  of all states; the knower becomes what is recognized as the fundamental measure. Divergence: The Brahma
  Sūtra emphasizes the identity of individual self (tvam) with absolute Brahman through direct statement,
  whereas Mandukya-Gaudapada uses the phonetic architecture of Om to map the structure of consciousness
  itself.

  **Advaita Vedānta (Śaṅkara): the three states as apparent modifications of Brahman:** Both traditions
  treat waking, dreaming, and deep sleep as successive dissolutions into a causal ground that remains
  unchanged; knowledge consists in recognizing oneself as that ground. Divergence: Śaṅkara emphasizes
  māyā (illusory appearance) as the mechanism of state-differentiation, while Gaudapada''s Karika stresses
  the self-luminous, non-dual nature of consciousness that never actually undergoes modification.'
insight: M closes the lips and ends the sounding of Om.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how
  to apply it today.
