sanskrit_devanagari: सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं वेद
  ॥ ११ ॥
sanskrit_iast: suṣuptasthānaḥ prājño makāras tṛtīyā mātrā miter apīter vā minoti ha vā idaṃ sarvam apītiś ca bhavati ya evaṃ
  veda || 11 ||
translation_literal: Prājña, whose sphere is deep sleep, is M — the third element — on account of its measuring or its dissolution.
  One who knows this measures all this and becomes that in which all dissolves.
commentary: 'M closes the lips and ends the sounding of Om. It is the consonant of closure, gathering, return. *Miti* (measuring):
  M provides the container, the measure, the limit within which the other sounds are defined. *Apīti* (dissolution, becoming-one-in):
  all the preceding sounds merge into M as their concluding resolution.


  Prājña as the causal state is similarly the measure of the other two — it is the matrix from which they emerge and into
  which they return. Each day''s waking and dreaming life is measured out from the deep-sleep causal ground and returns to
  it each night. The practitioner who truly knows this — not intellectually but through recognition — becomes *apīti* itself:
  the one in whom all dissolves, which is to say: the one who is recognized as the ground rather than as one of the states
  that arise in it.'
insight: M closes the lips and ends the sounding of Om.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
