title: Om as the Whole of Time and Beyond
unit_type: verse
sanskrit_devanagari: 'ओं इत्य् एतद् अक्षरम् इदं सर्वं तस्योपव्याख्यानं भूतं भवद् भविष्यद् इति सर्वम् ओंकार एव ।

  यच् चान्यत् त्रिकालातीतं तद् अप्य् ओंकार एव ॥ १ ॥'
sanskrit_iast: 'oṃ ity etad akṣaram idaṃ sarvaṃ tasyopavyākhyānaṃ bhūtaṃ bhavad bhaviṣyad iti sarvam oṃkāra eva |

  yac cānyat trikālātītaṃ tad apy oṃkāra eva || 1 ||'
translation_literal: 'Om: this imperishable syllable is all this. Its further exposition is: what has been, what is, and what
  will be—all is indeed Om. And whatever else is beyond the three times, that too is indeed Om.'
commentary: "The opening declaration gives Om (oṃ) a total scope. It gathers the entire temporal field—past, present, and\
  \ future—yet is not restricted to the succession of time. “All this” does not merely mean every audible sound or object;\
  \ it means the whole experienced cosmos, including knower, known, and knowing, insofar as these appear. Om is called akṣara,\
  \ “imperishable” and also “syllable”: a voiced sign that points beyond itself to the unchanging ground of appearances. The\
  \ Upaniṣad will unfold this claim through the sound’s quarters and through the four modes of consciousness. Crucially, the\
  \ verse adds what exceeds trikāla, the three times. Thus Om is not simply a symbol for cosmic totality; it indicates the\
  \ reality in which temporal distinctions arise and subside. Gauḍapāda’s later non-origination teaching radicalizes this:\
  \ the timeless is not a remote fourth thing, but the ever-present truth of the changing display.\n\nKey Terms\n\n**oṃ /\
  \ oṃkāra** — Om, the sacred syllable and comprehensive contemplative symbol\n**akṣara** — imperishable; also, a syllable\
  \ or letter\n**trikālātīta** — that which transcends the three divisions of time\n\nCross-Tradition Resonances\n\n**Christian\
  \ Logos:** \n**Daoist Dao:** \n**Mahāyāna emptiness:** "
practice: 'Sit quietly and sound Om once, slowly. Then notice: memories, present sensations, and anticipations all arise in
  awareness. Ask, without seeking a verbal answer: “What is present before and after these time-bound appearances?” Rest for
  several breaths in that noticing.'
