source_excerpt: 'Overview

  The second movement of the Upaniṣad maps the four-quarter analysis of the Self onto the phonetic analysis of Om, establishing
  a correspondence that transforms sound-meditation into a complete method of Self-inquiry.'
translation_literal: 'Overview

  The second movement of the Upaniṣad maps the four-quarter analysis of the Self onto the phonetic analysis of Om, establishing
  a correspondence that transforms sound-meditation into a complete method of Self-inquiry.'
commentary: 'Verses 8–12 execute the Māṇḍūkya''s signature move: the systematic correlation of Ātman''s four states (waking,
  dream, deep sleep, and turīya—the fourth, transcendent state) with the four phonetic components of Om (A, U, M, and the
  silent bindu). This correspondence is not merely symbolic; it functions as a precise map for inward inquiry. Each phonetic
  element becomes a gateway to recognizing the consciousness that witnesses each state. The waking state (vaiśvānara) corresponds
  to A, the gross-bodied consciousness enjoying gross objects; dream (taijasa) corresponds to U, the subtle-bodied consciousness
  in the subtle realm; deep sleep (prājña) corresponds to M, consciousness in undifferentiated causal repose; turīya—the fourth—corresponds
  to the bindu, the unmanifest resonance beyond phonetic articulation, the non-dual Self untouched by state-transitions. By
  meditating on Om''s structure, the practitioner does not merely contemplate sound; they internalize a phenomenological map
  that reveals consciousness itself as the invariant witness across all modifications. Gauḍapāda''s Kārikā will later deepen
  this by insisting that these states, like the phonetic components, are not ultimately real originations but apparent modifications
  of non-dual Brahman—a move already implicit here. The correspondence transforms abstract metaphysics into lived practice:
  attending to Om''s subtle structure becomes a method for recognizing the turīya, the untouched ground of all experience,
  thereby dissolving the illusion of becoming into the recognition of non-origination (ajātivāda).


  Key Terms


  **turīya** — The fourth state, transcendent consciousness beyond waking, dream, and deep sleep; the non-dual Self untouched
  by state-transitions.

  **vaiśvānara** — The waking state consciousness identified with the gross body, enjoying gross objects; corresponds to the
  phoneme A.

  **taijasa** — The dream state consciousness identified with the subtle body, experiencing subtle objects; corresponds to
  the phoneme U.'
insight: ''
practice: Whisper 'Om' three times, letting each syllable map onto a layer of your awareness—first sound, then the silence
  between sounds, then the listener who hears both—until you recognize that the one who knows the sound is the same one who
  knows your thoughts, your breath, your sense of 'I'.
sanskrit_devanagari: 'सोऽयमात्माध्यक्षरमोङ्कारोऽधिमात्रं पादा मात्रा मात्राश्च पादा अकार उकारो मकार इति ॥ ८ ॥


  जागरितस्थानो वैश्वानरोऽकारः प्रथमा मात्राऽऽप्तेरादिमत्त्वाद्वाऽऽप्नोति ह वै सर्वान्कामानादिश्च भवति य एवं वेद ॥ ९ ॥


  स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षादुभयत्वाद्वोत्कर्षति ह वै ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले भवति
  य एवं वेद ॥ १० ॥


  सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं वेद ॥ ११ ॥


  अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत एवमोङ्कार आत्मैव संविशत्यात्मनाऽऽत्मानं य एवं वेद ॥ १२ ॥

  '
sanskrit_iast: 'so ''yam ātmādhyakṣaram oṅkāro ''dhimātraṃ pādā mātrā mātrāś ca pādā akāra ukāro makāra iti || 8 ||


  jāgaritasthāno vaiśvānaro ''kāraḥ prathamā mātrā āpter ādimattvād vā āpnoti ha vai sarvān kāmān ādiś ca bhavati ya evaṃ
  veda || 9 ||


  svapnasthānas taijasa ukāro dvitīyā mātrā utkarṣād ubhayatvād vā utkarṣati ha vai jñānasantatiṃ samānaś ca bhavati nāsyābrahmavit
  kule bhavati ya evaṃ veda || 10 ||


  suṣuptasthānaḥ prājño makāras tṛtīyā mātrā miter apīter vā minoti ha vā idaṃ sarvam apītiś ca bhavati ya evaṃ veda || 11
  ||


  amātras caturtho ''vyavahāryaḥ prapañcopaśamaḥ śivo ''dvaita evam oṅkāra ātmaiva saṃviśaty ātmanātmānaṃ ya evaṃ veda ||
  12 ||

  '
