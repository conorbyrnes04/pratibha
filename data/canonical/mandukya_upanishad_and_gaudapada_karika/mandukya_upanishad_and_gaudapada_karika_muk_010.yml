- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.45
    resonance: 'Both texts establish a progressive dissolution of subject-object duality through meditative focus: the Mandukya
      maps the knower''s attention inward through Om''s quarters until the distinction between observer and observed collapses;
      Patañjali describes concentration on subtle objects culminating in merger where ''the object ceases to be a distinct
      entity and merges with the observer.'''
    divergence: The Mandukya uses phonetic-structural correspondence (Om's sound-form as gateway to Self), while Patañjali
      employs graduated object-focus as the mechanism; the Upanishad emphasizes the knower's return to itself, whereas Yoga
      Sutras emphasizes the object's refinement into subtlety.
    passage_id: patañjali_yoga_sūtras.ys_1_45
  - citation: Svetasvatara Upanishad — Fire by Friction, Self by Om
    resonance: 'Both employ a latency-and-manifestation structure: the Mandukya''s Om analysis reveals the Self already present
      but unrecognized through inattention; Svetasvatara''s fire-in-wood metaphor describes the hidden Self requiring ''the
      right means'' to be brought forth—both posit that clarity comes through proper method applied to what is already there.'
    divergence: The Mandukya's method is strictly meditative-phonetic (the four quarters of Om), while Svetasvatara remains
      more general about 'right means'; the Upanishad emphasizes structural correspondence between sound and Self, whereas
      Svetasvatara uses natural analogy (fire/wood) without claiming isomorphic mapping.
    passage_id: svetasvatara_upanishad.svu_008
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 8
    resonance: 'Both describe a turning of attention toward an interior center as the condition for Self-recognition: the
      Mandukya''s inward movement through Om''s quarters culminates in the knower recognizing itself; Plotinus describes the
      soul''s ''natural movement'' revolving around ''its own centre, which is the source of its being''—both make centeredness
      the locus of self-knowledge.'
    divergence: The Mandukya uses a concrete phonetic scaffold (Om's structure) to guide this inward turn, while Plotinus
      appeals to the soul's inherent circular motion as self-evident; the Upanishad treats the center as discoverable through
      method, whereas Plotinus treats it as the soul's natural trajectory.
    passage_id: plotinus_enneads.enn_vi_9_08
