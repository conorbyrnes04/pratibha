commentary: 'The first prakaraṇa closely follows the Upaniṣad''s analysis. Its distinctive contributions are:


  The causality diagnosis (I.11–12): establishing that the first three quarters are conditioned (by cause and effect, or cause
  alone) while Turīya alone is uncaused — not one term in the causal chain but the ground in which causality appears.'
insight: ''
practice: 'Trace backward through your next decision or action: name the cause that prompted it, then the cause before that,
  then the one before—until you reach a moment where you cannot name what moved you to begin. Rest there, in that unnamed
  ground, for three breaths, and notice what arises without causality.'
sanskrit_devanagari: 'कार्यकारणबद्धौ ताव् इष्येते विश्वतैजसौ ।

  प्राज्ञः कारणबद्धस् तु द्वौ तौ तुर्ये न सिध्यतः ॥ ११ ॥


  नात्मानं न परांश् चैव न सत्यं नापि चानृतम् ।

  प्राज्ञः किंचन संवेत्ति तुर्यं तत् सर्वदृक् सदा ॥ १२ ॥

  '
sanskrit_iast: 'kāryakāraṇabaddhau tāv iṣyete viśvataijasau |

  prājñaḥ kāraṇabaddhas tu dvau tau turye na sidhyataḥ || 11 ||


  nātmānaṃ na parāṃś caiva na satyaṃ nāpi cānṛtam |

  prājñaḥ kiṃcana saṃvetti turyaṃ tat sarvadṛk sadā || 12 ||

  '
