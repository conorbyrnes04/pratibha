sanskrit_devanagari: 'Āगमप्रकरण


  INVOCATION


  प्रज्ञानांशुप्रतानैः स्थिरचरनिकरव्यापिभिर् व्याप्य लोकान् भुक्त्वा भोगान्स्थविष्ठान्पुनरपि धिषणोद्भासितान्कामजन्यान्
  ।

  पीत्वा सर्वान् विशेषान् स्वपिति मधुरभुङ् मायया भोजयन्नो मायासंख्यातुरीयं परममृतमजं ब्रह्म यत्तन्नतो
  ऽस्मि यो विश्वात्मा विधिजविषयान् प्राश्य भोगान् स्थविष्ठान् पश्चाच् चान्यान् स्वमतिविभवाञ् ज्योतिषा
  स्वेन सूक्ष्मान् ।

  सर्वान् एतान् पुनर् अपि शनैः स्वात्मनि स्थापयित्वा हित्वा सर्वान्विशेषान्विगतगुणगणः पात्वसौ नस्तुरीयः'
sanskrit_iast: 'Āgamaprakaraṇa


  INVOCATION


  prajñānāṃśupratānaiḥ sthiracaranikaravyāpibhir vyāpya lokān bhuktvā bhogānsthaviṣṭhānpunarapi dhiṣaṇodbhāsitānkāmajanyān
  /

  pītvā sarvān viśeṣān svapiti madhurabhuṅ māyayā bhojayanno māyāsaṃkhyāturīyaṃ paramamṛtamajaṃ brahma
  yattannato ''smi yo viśvātmā vidhijaviṣayān prāśya bhogān sthaviṣṭhān paścāc cānyān svamativibhavāñ
  jyotiṣā svena sūkṣmān /

  sarvān etān punar api śanaiḥ svātmani sthāpayitvā hitvā sarvānviśeṣānvigataguṇagaṇaḥ pātvasau nasturīyaḥ'
