- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Knowledge and Ignorance in the Imperishable
    resonance: Both texts posit a fundamental duality—knowledge and ignorance—as co-present within the ultimate ground (Brahman/imperishable).
      Gaudapada's analysis of consciousness requires examining how ignorance and knowledge structure awareness itself, mirroring
      the Svetasvatara's claim that both are 'hidden' in the imperishable.
    divergence: Svetasvatara treats knowledge and ignorance as metaphysical principles hidden within Brahman; Gaudapada emphasizes
      their role in the phenomenology of consciousness and the path to freedom through discriminative awareness.
    passage_id: svetasvatara_upanishad.svu_013
  - citation: Patañjali Yoga Sūtras 4.31
    resonance: Both texts describe a progressive removal or dissolution of obscuring layers—Patañjali's 'coverings of knowledge'
      and Gaudapada's analysis of how ignorance veils the Self—culminating in a knowledge that is paradoxically 'almost nothing'
      or non-dual emptiness.
    divergence: Patañjali frames this within the Yoga framework of mental transformation and samadhi; Gaudapada grounds it
      in Advaita Vedanta's non-dual recognition that the Self is eternally free and unbound.
    passage_id: patañjali_yoga_sūtras.ys_4_31
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts invert the conventional value of knowledge, declaring that conceptual or dualistic knowledge itself
      becomes a form of bondage—a radical critique of the knower's assumption that accumulating knowledge liberates.
    divergence: The Siva Sutra states this as a paradoxical aphorism within Kashmir Shaivism's recognition of consciousness;
      Gaudapada develops this through the Mandukya's analysis of the four states of consciousness to show how ignorance of
      non-duality perpetuates bondage.
    passage_id: siva_sutra.ss_i_2
