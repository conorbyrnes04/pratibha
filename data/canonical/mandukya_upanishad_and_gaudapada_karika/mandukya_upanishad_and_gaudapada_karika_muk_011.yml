sanskrit_devanagari: सोऽयमात्माध्यक्षरमोङ्कारोऽधिमात्रं पादा मात्रा मात्राश्च पादा अकार उकारो मकार इति
  ॥ ८ ॥
sanskrit_iast: so 'yam ātmādhyakṣaram oṅkāro 'dhimātraṃ pādā mātrā mātrāś ca pādā akāra ukāro makāra iti
  || 8 ||
translation_literal: This very self is the syllable OM, presiding over it. The quarters are the measures,
  and the measures are the quarters. The quarters are A, U, and M.
commentary: 'Verse 8 establishes the fundamental correspondence between the individual self (ātman) and
  the sacred sound OM (oṅkāra). Gauḍapāda uses the term ''adhyakṣara''—presiding over or governing the
  syllable—to indicate that consciousness itself is not separate from this primordial sound, but rather
  its organizing principle.


  The passage then maps the three phonetic components of OM (A, U, M) onto the three quarters or states
  already introduced: waking, dream, and deep sleep. Each measure (mātrā) corresponds to a quarter (pāda),
  and vice versa. This is not metaphorical decoration but a precise structural teaching: the sound itself
  encodes the architecture of consciousness.


  Crucially, this verse prepares the ground for what follows—the fourth quarter (turīya), which lies beyond
  the three measures. By establishing that waking, dream, and sleep are literally the A, U, and M of OM,
  Gauḍapāda creates the logical necessity for a fourth element: the silence or space in which the syllable
  arises and dissolves.


  This mapping also supports the doctrine of ajātivāda (non-origination): if the self and OM are identical,
  and if OM is eternal and self-luminous, then the self cannot have originated. The correspondence is
  not a creation but a recognition of what already is. The sound does not make consciousness; rather,
  consciousness manifests as sound, as the three states, as the entire cosmos—yet remains untouched by
  any of it.


  Key Terms


  **ātman** — The innermost self or consciousness; in Advaita Vedānta, identical with Brahman (ultimate
  reality).

  **oṅkāra** — The sacred syllable OM; the primordial sound from which all manifestation arises.

  **mātrā** — Measure, unit, or quarter; here, the phonetic components (A, U, M) and the states of consciousness
  they represent.'
insight: 'A pivotal structural verse: the fourfold Self (*catuṣpāt*) and the fourfold Om (A, U, M + silence)
  are identified as the same reality approached through two different analyses.'
practice: 'Sound each syllable of OM—A, U, M—while simultaneously naming aloud the three states you''re
  moving through right now: waking (A), the dreams you carry in memory (U), the deep stillness beneath
  both (M). Let the sound and the naming happen together, as if the syllables are not describing consciousness
  but *are* consciousness organizing itself through your voice.'
