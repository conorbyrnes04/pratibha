- kind: translation
  label: Pratibha Translation
  body: Hari Om. Om — this syllable is all this. What follows is an exposition of it. Whatever is past, present, and future
    — all of that is Om alone. And whatever lies beyond the three divisions of time — that too is Om alone.
- kind: commentary
  label: Pratibha Commentary
  body: 'The text opens not with an argument but with a declaration so total it can barely be contained in grammar. *Idam
    sarvam* — all this — is the universe of phenomenal experience in its entirety. The claim is not that Om *represents* everything,
    or *symbolizes* reality, but that it *is* everything. The distinction is not metaphor but identity. Śaṅkara notes that
    since all diversified objects are not different from their names, and since all names are not different from Om, therefore
    all this is verily Om.


    The temporal sweep is meticulous: past (*bhūtam*), present (*bhavat*), future (*bhaviṣyat*) — the entire field of conditioned
    time. Then the text adds: *yac ca anyat trikālātītam* — and whatever else lies beyond the threefold time. This points
    to the unconditioned, the *avyākṛta* (the unmanifested), the ground that is not itself temporal. That too is Om. The syllable
    thus contains both the temporal and the atemporal, both the conditioned and its ground.


    *Akṣara* carries a deliberate double meaning: "syllable" and "imperishable." The imperishable is being revealed through
    the syllable — not as its symbol but as its very nature.


    Key Terms:


    - **oṃkāra** — the syllable Om as both sonic form and ontological ground; not a name *for* Brahman but Brahman as sound-form

    - **akṣara** — syllable, and: imperishable, indestructible; the sonic and the eternal in one word

    - **trikālātīta** — beyond the three times; the unconditioned ground that is not itself past, present, or future

    - **upavyākhyāna** — exposition, detailed explanation; what follows is an unpacking of what the first sentence declares'
