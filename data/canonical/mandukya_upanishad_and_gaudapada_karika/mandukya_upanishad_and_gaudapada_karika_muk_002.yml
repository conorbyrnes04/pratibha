- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit in silence. Internally sound the syllable Om without vocal effort — just the internal resonance. Notice the three
    components: the opening of A (arising, manifestation), the middle of U (sustaining, the dream-like interior), and the
    closing of M (dissolution, gathering back). Then notice the silence that follows, into which the sound dissolves. That
    silence is not the absence of Om but its fullness. The text is inviting you to recognize that you already live in that
    silence.'
