sanskrit_devanagari: हरिः ॐ । ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं भूतं भवद्भविष्यदिति सर्वमोङ्कार
  एव । यच्चान्यत्त्रिकालातीतं तदप्योङ्कार एव ॥ १ ॥
sanskrit_iast: hariḥ oṃ | om ity etad akṣaram idaṃ sarvaṃ tasyopavyākhyānaṃ bhūtaṃ bhavad bhaviṣyad iti
  sarvam oṅkāra eva | yac cānyat trikālātītaṃ tad apy oṅkāra eva || 1 ||
translation_literal: Hari Om. Om — this syllable is all this. What follows is an exposition of it. Whatever
  is past, present, and future — all of that is Om alone. And whatever lies beyond the three divisions
  of time — that too is Om alone.
commentary: 'The text opens not with an argument but with a declaration so total it can barely be contained
  in grammar. *Idam sarvam* — all this — is the universe of phenomenal experience in its entirety. The
  claim is not that Om *represents* everything, or *symbolizes* reality, but that it *is* everything.
  The distinction is not metaphor but identity. Śaṅkara notes that since all diversified objects are not
  different from their names, and since all names are not different from Om, therefore all this is verily
  Om.


  The temporal sweep is meticulous: past (*bhūtam*), present (*bhavat*), future (*bhaviṣyat*) — the entire
  field of conditioned time. Then the text adds: *yac ca anyat trikālātītam* — and whatever else lies
  beyond the threefold time. This points to the unconditioned, the *avyākṛta* (the unmanifested), the
  ground that is not itself temporal. That too is Om. The syllable thus contains both the temporal and
  the atemporal, both the conditioned and its ground.


  *Akṣara* carries a deliberate double meaning: "syllable" and "imperishable." The imperishable is being
  revealed through the syllable — not as its symbol but as its very nature.


  Key Terms:


  - **oṃkāra** — the syllable Om as both sonic form and ontological ground; not a name *for* Brahman but
  Brahman as sound-form

  - **akṣara** — syllable, and: imperishable, indestructible; the sonic and the eternal in one word

  - **trikālātīta** — beyond the three times; the unconditioned ground that is not itself past, present,
  or future

  - **upavyākhyāna** — exposition, detailed explanation; what follows is an unpacking of what the first
  sentence declares


  Cross-Tradition Resonances:


  - Pratyabhijñāhṛdayam 1: *citiḥ svatantrā viśvasiddhihetuḥ* — the sovereign Śakti is the cause of the
  universe''s manifestation. Both texts open by locating the entire universe in consciousness; the Māṇḍūkya
  does it through Om as ground, the PHH through Citi as cause.

  - Dào Dé Jīng ch. 1: "The Tao that can be named is not the eternal Tao." The Māṇḍūkya takes the opposite
  risk: naming everything. But "Om" as the name that contains all names approaches the same paradox from
  the other side.

  - Heraclitus Fragment 50: "Listening not to me but to the Logos, it is wise to agree that all things
  are one." The Logos as the structural equivalent of Om — the unifying ground beneath apparent multiplicity.'
insight: The text opens not with an argument but with a declaration so total it can barely be contained
  in grammar.
practice: 'Sit in silence. Internally sound the syllable Om without vocal effort — just the internal resonance.
  Notice the three components: the opening of A (arising, manifestation), the middle of U (sustaining,
  the dream-like interior), and the closing of M (dissolution, gathering back). Then notice the silence
  that follows, into which the sound dissolves. That silence is not the absence of Om but its fullness.
  The text is inviting you to recognize that you already live in that silence.'
