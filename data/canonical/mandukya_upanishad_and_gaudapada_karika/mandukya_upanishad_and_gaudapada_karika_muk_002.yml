title: All Existence Contained in One Syllable
unit_type: sutra
sanskrit_devanagari: हरिः ॐ । ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं भूतं भवद्भविष्यदिति सर्वमोङ्कार एव । यच्चान्यत्त्रिकालातीतं
  तदप्योङ्कार एव ॥ १ ॥
sanskrit_iast: hariḥ oṃ | om ity etad akṣaram idaṃ sarvaṃ tasyopavyākhyānaṃ bhūtaṃ bhavad bhaviṣyad iti sarvam oṅkāra eva
  | yac cānyat trikālātītaṃ tad apy oṅkāra eva || 1 ||
translation_literal: 'OM — this syllable is all that exists. Its exposition: whatever has been, whatever is, whatever will
  be — all of this is OM alone. And that which lies beyond the three times is also OM alone.'
commentary: 'This opening verse of the Māṇḍūkya Upaniṣad establishes the foundational claim: OM (oṅkāra) is not merely a sound
  or symbol, but the very substance of existence itself. The passage moves through three registers of reality: temporal (bhūta,
  bhavat, bhaviṣyat—past, present, future) and trans-temporal (trikālātīta—beyond time). By asserting that all three temporal
  modes *and* what transcends time are ''OM alone,'' the text collapses the distinction between the manifest universe and
  the unmanifest absolute into a single acoustic-ontological principle.


  This verse introduces the non-origination (ajātivāda) doctrine that Gauḍapāda will develop systematically. If all existence—past,
  present, future, and the timeless—is already OM, then nothing is truly ''becoming'' or ''originating.'' The universe is
  not created; it is the eternal self-expression of OM. What appears as change, growth, and decay is the play of appearance
  within an unchanging reality.


  The word ''upavyākhyāna'' (exposition or unfolding) is crucial: the Upaniṣad will now unfold what OM contains. The subsequent
  verses will show that OM encompasses the four states of consciousness (waking, dream, deep sleep, and turīya—the fourth,
  transcendent state), revealing that the same OM is experienced in different modes depending on the state of the experiencer,
  not because OM itself changes.


  For a modern reader, this verse challenges the assumption that existence requires explanation or justification. It proposes
  instead that reality is self-luminous and self-identical—a single syllable containing all time and timelessness. The philosophical
  implication is radical: if all that was, is, and will be is already complete in OM, then the search for meaning, progress,
  or transformation is not about acquiring something new, but recognizing what already is.


  Key Terms


  **oṅkāra (OM)** — The sacred syllable representing the totality of existence, sound, and consciousness; the primordial vibration
  from which all manifestation emerges and into which it dissolves.

  **akṣaram** — Syllable or imperishable; that which does not decay or perish; the eternal, unchanging principle underlying
  change.

  **trikālātīta** — Beyond the three times (past, present, future); the transcendent, timeless dimension of reality that is
  not subject to temporal succession.'
insight: The text opens not with an argument but with a declaration so total it can barely be contained in grammar.
practice: 'On your next out-breath, whisper ''OM'' so quietly only you can hear it, then pause and listen to the silence that
  follows—noticing whether the sound has truly ended or continues vibrating in the space around you. Repeat this three times
  throughout your day (morning, midday, evening), each time asking: what persists when the sound stops?'
