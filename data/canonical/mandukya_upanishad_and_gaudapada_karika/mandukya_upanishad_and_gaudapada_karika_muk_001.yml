practice: Read this passage slowly three times. Pause for one minute and write one sentence about how
  to apply it today.
sanskrit_devanagari: "ओं भद्रं कर्णेभिः शृणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः ।\nस्थिरैरङ्गैस्तुष्टुवा\
  \ सस्तनूभिर्व्यशेम देवहितं यदायुः ।\nओं शान्तिः !! शान्तिः !! शान्तिः !!! \n\nस्वस्ति न इन्द्रो वृद्धश्रवाः\
  \ स्वस्ति नः पूषा विश्ववेदाः ।\nस्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ।\nओं शान्तिः\
  \ !! शान्तिः !! शान्तिः!!!"
sanskrit_iast: "oṃ bhadraṃ karṇebhiḥ śṛṇuyāma devā bhadraṃ paśyemākṣabhiryajatrāḥ /\n\nsthirairaṅgaistuṣṭuvā\
  \ sastanūbhirvyaśema devahitaṃ yadāyuḥ //\n\noṃ śāntiḥ !! śāntiḥ !! śāntiḥ !!! \n\nsvasti na indro vṛddhaśravāḥ\
  \ svasti naḥ pūṣā viśvavedāḥ /\n\nsvasti nastārkṣyo ariṣṭanemiḥ svasti no bṛhaspatirdadhātu //\n\noṃ\
  \ śāntiḥ !! śāntiḥ !! śāntiḥ!!!"
