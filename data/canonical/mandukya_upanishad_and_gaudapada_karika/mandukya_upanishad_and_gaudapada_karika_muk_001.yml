insight: ''
practice: Beginning with the first line, listen to each phrase aloud—whether whispered or voiced—attending to how the sounds
  themselves shape your ears and awareness, then move through each subsequent line letting your body remain steady and your
  limbs at ease, until you reach the triple śāntiḥ and allow that repetition to dissolve any remaining fragmentation between
  what you hear, see, and embody.
