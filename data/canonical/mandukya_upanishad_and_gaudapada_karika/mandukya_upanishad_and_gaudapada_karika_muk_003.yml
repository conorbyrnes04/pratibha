- kind: practice
  label: Practice (Abhyasa)
  body: Before any experience arises — before thought, before sensation — there is the simple fact of being aware. This bare
    awareness, which you cannot step outside of and examine as an object, is *ātmā*. The text says this is *brahma* — the
    ground of all existence. Not similar to it. Not a part of it. Identical. Sit with "this is that" for five minutes. Not
    as a belief to maintain but as a recognition to allow.
