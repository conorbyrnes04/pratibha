- kind: original
  label: Original
  body: सर्वं ह्येतद् ब्रह्म अयमात्मा ब्रह्म सोऽयमात्मा चतुष्पात् ॥ २ ॥
- kind: iast
  label: IAST
  body: sarvaṃ hy etad brahma ayam ātmā brahma so 'yam ātmā catuṣpāt || 2 ||
- kind: translation
  label: Pratibha Translation
  body: All this is indeed Brahman. This Ātman is Brahman. This Ātman has four quarters.
- kind: commentary
  label: Pratibha Commentary
  body: 'Three sentences that could each be the sole content of a philosophical tradition. *Sarvaṃ hy etad brahma* — all this
    is indeed Brahman — is a declaration of non-separation: the apparent multiplicity of the world is not other than the one
    undivided ground. *Ayam ātmā brahma* — this Ātman is Brahman — is the great identity statement, the *mahāvākya* that grounds
    Advaita: the individual principle of self-awareness and the universal ground of being are identical. Not similar. Not
    derivative. Identical.


    Then: *so ''yam ātmā catuṣpāt* — this Ātman has four quarters. The apparent tension between the absolute declaration of
    unity and the analytical division into four is deliberate. The four-quarter analysis is not a description of how the Self
    actually is — it is a pedagogical instrument. Like a coin divided into four quarters: the coin is one, but the quarters
    serve to make it exchangeable, usable, comprehensible. Śaṅkara is explicit: the four quarters are *imagined* in Ātman
    to facilitate understanding. The point of the entire analysis that follows is to dissolve itself — to show that when the
    first three quarters are fully seen through, the fourth (Turīya) reveals itself as what was always the case.


    Key Terms:


    - **brahma** — the absolute ground of being; from *bṛh* (to expand, to be great); that which is greatest and expands infinitely

    - **ātmā** — the Self; reflexive principle of self-awareness; here equated with Brahman, dissolving the distinction between
    individual and universal

    - **catuṣpāt** — four-footed, four-quartered; *catuṣ* (four) + *pāt* (foot/quarter); the fourfold analytical schema'
