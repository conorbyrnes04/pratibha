- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aṣṭāvakra Gītā 2.1
    resonance: '*aho nirañjanaḥ śānto bodho''haṃ prakṛteḥ paraḥ* — Janaka''s recognition "I am the stainless, peaceful knowing
      beyond nature" is the lived form of *ayam ātmā brahma*. The Māṇḍūkya states it; the Aṣṭāvakra shows it being recognized.'
    divergence: ''
    passage_id: astavakra_gita.asg_2_1
  - citation: Pratyabhijñāhṛdayam 13
    resonance: '*tatparijñāne cittam evāntarmukhī-bhāvena cetanāpadādhyārohāc citiḥ* — the mind itself, through introversion,
      becomes Citi. The Pratyabhijñā frames this as ascent; the Māṇḍūkya as recognition of what was always the case.'
    divergence: ''
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Meister Eckhart, Sermon 52
    resonance: '"The ground of God and the ground of the soul are one ground." The closest Western parallel to *ayam ātmā
      brahma* — individual ground and absolute ground as not two.'
    divergence: ''
