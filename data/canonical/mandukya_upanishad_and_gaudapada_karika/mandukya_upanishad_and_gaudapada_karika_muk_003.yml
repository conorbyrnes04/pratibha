title: The Self Recognizes Its Undivided Ground
unit_type: sutra
sanskrit_devanagari: सर्वं ह्येतद् ब्रह्म अयमात्मा ब्रह्म सोऽयमात्मा चतुष्पात् ॥ २ ॥
sanskrit_iast: sarvaṃ hy etad brahma ayam ātmā brahma so 'yam ātmā catuṣpāt || 2 ||
translation_literal: All of this is indeed Brahman. This self is Brahman. This self is fourfold.
commentary: 'This verse (Māṇḍūkya Upaniṣad 2) establishes the foundational non-dual claim: there is no separation between
  the totality of existence (sarvaṃ), the ultimate reality (Brahman), and the individual self (ātmā). The statement ''all
  of this is Brahman'' dissolves the apparent multiplicity of the world into a single, undivided ground. The phrase ''this
  self is Brahman'' then identifies that ground with one''s own immediate being—not as an achievement or realization to come,
  but as the present fact of consciousness itself.


  The final phrase introduces the fourfold structure (catuṣpāt) that the next verses will elaborate: the four states of consciousness
  (waking, dream, deep sleep, and turīya—the transcendent fourth). This is crucial to Gauḍapāda''s non-origination teaching
  (ajātivāda). The four states are not successive creations or transformations; rather, they are simultaneous expressions
  or apparent modifications of a single, unchanging consciousness. By mapping all experience—gross, subtle, and causal—onto
  these four states, the text demonstrates that nothing truly originates, transforms, or dissolves. What appears to change
  is only the apparent limitation or contraction of consciousness within different conditions.


  Gauḍapāda uses this framework to argue that if Brahman is non-dual and complete, it cannot genuinely produce or enter into
  the world. The world and its states are not real modifications of Brahman; they are appearances within consciousness, like
  waves in the ocean or images in a mirror. The self''s recognition of its fourfold nature is thus the recognition that all
  apparent change occurs within an unchanging, non-originating ground.


  Key Terms


  **Brahman** — The ultimate, non-dual reality; the undivided ground of all existence.

  **ātmā** — The self; individual consciousness recognized as identical with Brahman.

  **catuṣpāt** — Fourfold; the four states of consciousness (waking, dream, deep sleep, and turīya).'
insight: Three sentences that could each be the sole content of a philosophical tradition.
practice: 'Throughout today, each time you transition between activities—from work to a meal, from conversation to solitude,
  from movement to stillness—pause and whisper: ''All of this is Brahman. This self is Brahman.'' Let the words dissolve the
  boundary you feel between the shift itself and the awareness witnessing it, recognizing that the waking state you''re leaving
  and entering are both equally expressions of one undivided self.'
