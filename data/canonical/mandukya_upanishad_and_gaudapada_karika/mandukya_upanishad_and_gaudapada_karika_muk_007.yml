title: Verse 5 · Suṣupti — Deep Sleep
unit_type: sutra
sanskrit_devanagari: यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्सुषुप्तम् । सुषुप्तस्थान
  एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक् चेतोमुखः प्राज्ञस्तृतीयः पादः ॥ ५ ॥
sanskrit_iast: yatra supto na kañcana kāmaṃ kāmayate na kañcana svapnaṃ paśyati tat suṣuptam | suṣuptasthāna
  ekībhūtaḥ prajñānaghana evānandamayo hy ānandabhuk cetomukhaḥ prājñas tṛtīyaḥ pādaḥ || 5 ||
translation_literal: That is deep sleep wherein the sleeper desires no desire and sees no dream. The third
  quarter is Prājña — whose sphere is deep sleep, who has become unified, who is a mass of cognition,
  who is indeed made of bliss, who is the enjoyer of bliss, whose face is consciousness.
commentary: 'The verse begins by defining deep sleep negatively — through absence of desire and dream
  — then immediately pivots to positive characterization. This is methodologically important: the text
  refuses to let deep sleep be merely an absence. The four positive descriptions are carefully chosen:


  *Ekībhūtaḥ* — "become one" — names the unification of experience. The multiplicity of waking and dreaming
  collapses into undifferentiated unity. This is not the unity of recognition but the unity of non-differentiation
  — which is why it is not liberation.


  *Prajñānaghana* — "mass of consciousness" — *ghana* means dense, massive, consolidated. Consciousness
  in deep sleep is not dispersed across objects but concentrated in undivided mass. The image is of space
  that becomes apparent *density* when no objects divide it — the space itself hasn''t changed but the
  differentiation has ceased.


  *Ānandamaya* — "full of bliss" — not the bliss of pleasant experience (which requires subject-object
  duality) but the inherent ease of consciousness not fragmented by desire and object. This is why sleep
  is restorative: in returning to the causal state, something of one''s original nature is recovered.


  *Cetomukha* — "having consciousness as its mouth/door" — Prājña is the gateway through which the other
  two states emerge and into which they return. The causal state contains the other states in seed form
  (*bīja*). This is also why Prājña is the doorway to understanding: by examining what is present in deep
  sleep (consciousness without objects) and absent (desire, duality), one can begin to sense what Turīya
  is.


  Key Terms:


  - **suṣupti** — deep sleep; from *su* (well) + *supti* (sleeping); fully, properly asleep

  - **prājña** — the knowing one; the third-quarter experiencer; from *prajñā* (comprehensive knowing);
  paradoxically named "the knower" in the state where ordinary knowing is absent

  - **ekībhūta** — become one, unified; the collapse of multiplicity into undifferentiated unity

  - **prajñānaghana** — mass of consciousness; the density metaphor for unified, objectless awareness

  - **ānandamaya** — made of bliss, full of bliss; the inherent ease of undivided consciousness

  - **cetomukha** — having consciousness as its door; Prājña as the causal gateway


  Cross-Tradition Resonances:


  - Pratyabhijñāhṛdayam 6: *tanmayo māyāpramātā* — the ordinary self consists entirely of contracted mind;
  Prājña is exactly this: the causal body that is Māyā at its most latent, just before the full contraction
  into individual experiencer

  - Plotinus, *Enneads* V.1.12: the One as self-sufficient, needing nothing, containing all potentialities
  in undifferentiated unity — a Western structural parallel to *prajñānaghana*

  - Buddhist *samāpatti* states, particularly *nirodha-samāpatti* (cessation of perception and feeling):
  a contemplatively induced analog to deep sleep that Gauḍapāda likely has in mind when distinguishing
  Prājña from Turīya'
insight: The verse begins by defining deep sleep negatively — through absence of desire and dream — then
  immediately pivots to positive characterization.
practice: In the moment of waking from deep sleep, before the waking mind has fully consolidated, there
  is a brief window where something is present that belongs to neither sleep nor waking — a bare, contentless
  awareness. This is the closest most people come to sensing Turīya experientially. Cultivate the habit
  of pausing in this threshold moment. Not to grasp it — that immediately collapses it into the waking
  state — but to allow a recognition that was not absent during sleep.
