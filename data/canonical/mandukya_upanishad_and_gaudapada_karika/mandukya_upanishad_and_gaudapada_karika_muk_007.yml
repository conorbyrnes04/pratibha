sanskrit_devanagari: यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्सुषुप्तम् । सुषुप्तस्थान
  एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक् चेतोमुखः प्राज्ञस्तृतीयः पादः ॥ ५ ॥
sanskrit_iast: yatra supto na kañcana kāmaṃ kāmayate na kañcana svapnaṃ paśyati tat suṣuptam | suṣuptasthāna
  ekībhūtaḥ prajñānaghana evānandamayo hy ānandabhuk cetomukhaḥ prājñas tṛtīyaḥ pādaḥ || 5 ||
translation_literal: When one sleeps, desiring no desire and seeing no dream—that is deep sleep. In the
  state of deep sleep, unified and become dense with knowing, filled with bliss, tasting bliss, with consciousness
  as its face—this is the third quarter, called the knower of the field.
commentary: 'This verse describes suṣupti, the third of the four states of consciousness, establishing
  it as a distinct mode of being rather than mere absence. The passage moves beyond simple negation (no
  desires, no dreams) to positive characterization: the sleeper becomes ''ekībhūtaḥ''—unified, integrated—and
  ''prajñānaghana''—dense with knowing. This knowing is not the fragmentary awareness of waking or dream,
  but a unified field of consciousness.


  The term ''ānandamaya'' (filled with bliss) and ''ānandabhuk'' (tasting bliss) are crucial. Bliss here
  is not emotion but the natural state when the mind ceases its divisive operations. The sleeper experiences
  this directly, yet cannot ordinarily recall it upon waking—a paradox central to Advaita Vedānta''s analysis
  of consciousness.


  The phrase ''cetomukhaḥ prājñas'' (consciousness as its face, the knower of the field) identifies this
  state with Prājña, the cosmic consciousness in its deep-sleep aspect. This is not personal sleep but
  the universal principle of knowing that persists through sleep. Gauḍapāda''s framework treats all three
  states—waking, dream, deep sleep—as modifications within a single, unchanging OM. None truly originates;
  none truly ends. The sleeper''s unity and the waker''s multiplicity are both appearances within the
  same non-dual reality.


  The Māṇḍūkya''s genius lies in showing that deep sleep is not void but saturated with knowing. The forgetting
  of individual identity is simultaneously a return to undifferentiated consciousness. This prepares the
  ground for the fourth state (turīya), which witnesses all three without entering them.


  Key Terms


  **suṣupti** — Deep sleep; the third state of consciousness, characterized by unified knowing (prajñāna)
  without object or dream content.

  **prajñānaghana** — Dense with knowing; unified consciousness undifferentiated into subject-object duality;
  the ground of all experience.

  **prājña** — The knower of the field; cosmic consciousness in its deep-sleep aspect; the individual
  self identified with the causal body (kāraṇa-śarīra).'
insight: The verse begins by defining deep sleep negatively — through absence of desire and dream — then
  immediately pivots to positive characterization.
practice: 'Upon waking tomorrow, before moving or speaking, lie still and ask: What remains of the bliss
  I just tasted in sleep, before thought returns to divide it? Hold that wordless residue for three breaths,
  letting it dissolve naturally rather than grasping to remember it—this forgetting itself is the teaching.'
