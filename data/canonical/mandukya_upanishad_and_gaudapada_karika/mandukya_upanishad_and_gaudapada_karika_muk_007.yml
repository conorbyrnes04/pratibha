- kind: translation
  label: Pratibha Translation
  body: That is deep sleep wherein the sleeper desires no desire and sees no dream. The third quarter is Prājña — whose sphere
    is deep sleep, in whom all experience is unified, who is verily a mass of consciousness, full of bliss, who experiences
    bliss, and who is the door to the knowing of the other two states.
- kind: commentary
  label: Pratibha Commentary
  body: 'The verse begins by defining deep sleep negatively — through absence of desire and dream — then immediately pivots
    to positive characterization. This is methodologically important: the text refuses to let deep sleep be merely an absence.
    The four positive descriptions are carefully chosen:


    *Ekībhūtaḥ* — "become one" — names the unification of experience. The multiplicity of waking and dreaming collapses into
    undifferentiated unity. This is not the unity of recognition but the unity of non-differentiation — which is why it is
    not liberation.


    *Prajñānaghana* — "mass of consciousness" — *ghana* means dense, massive, consolidated. Consciousness in deep sleep is
    not dispersed across objects but concentrated in undivided mass. The image is of space that becomes apparent *density*
    when no objects divide it — the space itself hasn''t changed but the differentiation has ceased.


    *Ānandamaya* — "full of bliss" — not the bliss of pleasant experience (which requires subject-object duality) but the
    inherent ease of consciousness not fragmented by desire and object. This is why sleep is restorative: in returning to
    the causal state, something of one''s original nature is recovered.


    *Cetomukha* — "having consciousness as its mouth/door" — Prājña is the gateway through which the other two states emerge
    and into which they return. The causal state contains the other states in seed form (*bīja*). This is also why Prājña
    is the doorway to understanding: by examining what is present in deep sleep (consciousness without objects) and absent
    (desire, duality), one can begin to sense what Turīya is.


    Key Terms:


    - **suṣupti** — deep sleep; from *su* (well) + *supti* (sleeping); fully, properly asleep

    - **prājña** — the knowing one; the third-quarter experiencer; from *prajñā* (comprehensive knowing); paradoxically named
    "the knower" in the state where ordinary knowing is absent

    - **ekībhūta** — become one, unified; the collapse of multiplicity into undifferentiated unity

    - **prajñānaghana** — mass of consciousness; the density metaphor for unified, objectless awareness

    - **ānandamaya** — made of bliss, full of bliss; the inherent ease of undivided consciousness

    - **cetomukha** — having consciousness as its door; Prājña as the causal gateway'
