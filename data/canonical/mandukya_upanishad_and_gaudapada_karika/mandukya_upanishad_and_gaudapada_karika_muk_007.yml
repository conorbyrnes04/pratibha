- kind: practice
  label: Practice (Abhyasa)
  body: In the moment of waking from deep sleep, before the waking mind has fully consolidated, there is a brief window where
    something is present that belongs to neither sleep nor waking — a bare, contentless awareness. This is the closest most
    people come to sensing Turīya experientially. Cultivate the habit of pausing in this threshold moment. Not to grasp it
    — that immediately collapses it into the waking state — but to allow a recognition that was not absent during sleep.
