sanskrit_devanagari: जागरितस्थानो वैश्वानरोऽकारः प्रथमा मात्राऽऽप्तेरादिमत्त्वाद्वाऽऽप्नोति ह वै सर्वान्कामानादिश्च
  भवति य एवं वेद ॥ ९ ॥
sanskrit_iast: jāgaritasthāno vaiśvānaro 'kāraḥ prathamā mātrā āpter ādimattvād vā āpnoti ha vai sarvān
  kāmān ādiś ca bhavati ya evaṃ veda || 9 ||
translation_literal: The waking state is Vaiśvānara. The letter A is its measure, the first. Through obtaining—or
  through being first—one obtains all desires and becomes the beginning. So it is for one who knows this.
commentary: 'This opening verse of Gauḍapāda''s exposition establishes the waking state (jāgaritasthāna)
  as Vaiśvānara, the ''all-pervading fire'' or universal consciousness in its gross, outward-turned form.
  The identification with the first letter of OM (A, or ''a-kāra'') is not arbitrary: it marks the beginning
  of manifestation, the threshold where undifferentiated consciousness first takes the shape of individual
  experience.


  The phrase ''through obtaining'' (āpter) or ''through being first'' (ādimattvād) suggests two complementary
  readings. One may obtain all desires by recognizing oneself as the waking consciousness—the subject
  of all experience, the ground from which all objects arise. Alternatively, by understanding the primacy
  of this state (its ''firstness'' in the sequence of OM''s four measures), one grasps the principle of
  origination itself. The promise that one ''becomes the beginning'' (ādiś ca bhavati) points to a non-dual
  recognition: the knower realizes they are not trapped within waking experience but are its very source.


  Crucially, this verse does not claim that waking consciousness creates reality, nor does it trap the
  self in the waking state. Rather, it invites the meditator to recognize waking as one measure of a larger
  whole. The subsequent verses will reveal dream and deep sleep as equally valid measures, and finally
  turīya—the fourth, transcendent state—as the ground of all three. Gauḍapāda''s non-origination teaching
  (ajātivāda) emerges here in seed form: the self does not originate in waking; it merely appears to take
  that form. By knowing this, one is freed from the illusion of limitation.


  Key Terms


  **Vaiśvānara** — The universal fire or all-pervading consciousness in its gross, waking form; the self
  identified with the waking state and the physical world

  **jāgaritasthāna** — The waking state, the first of the four states of consciousness in which the individual
  experiences the gross world through the senses

  **mātrā** — A measure or unit; here, one of the four syllabic measures of OM, each corresponding to
  a state of consciousness'
insight: The A vowel opens the mouth and generates the fundamental space from which all speech emerges.
practice: 'Upon waking tomorrow morning, before rising, pause in bed for two minutes. Notice the quality
  of the waking state: the solidity of the body, the clarity of thought, the sense of ''I am awake.''
  Do not analyze or judge. Simply observe that this state has a texture, a flavor—it is one mode among
  others you have known. Then silently sound the letter A (as in ''father''), feeling it as the first
  opening, the beginning of all utterance. Recognize that you are the witness of this waking state, not
  confined by it. Carry this recognition—''I am the seer of waking, not only its content''—into your day.
  This simple shift from identification to witnessing is the practical seed of the verse.'
