sanskrit_devanagari: जागरितस्थानो वैश्वानरोऽकारः प्रथमा मात्राऽऽप्तेरादिमत्त्वाद्वाऽऽप्नोति ह वै सर्वान्कामानादिश्च
  भवति य एवं वेद ॥ ९ ॥
sanskrit_iast: jāgaritasthāno vaiśvānaro 'kāraḥ prathamā mātrā āpter ādimattvād vā āpnoti ha vai sarvān
  kāmān ādiś ca bhavati ya evaṃ veda || 9 ||
translation_literal: Vaiśvānara, whose state is the waking state, is A, the first element, either because
  of obtaining or because of being first. One who knows this indeed obtains all desires and becomes first.
commentary: 'The A vowel opens the mouth and generates the fundamental space from which all speech emerges.
  As the first vowel, it is prior to all differentiation — no other sound precedes it. This structural
  primacy mirrors Vaiśvānara''s role: waking consciousness is the most immediately available state, the
  one from which the others are known and described. It is also the most *āpta* (pervading) — the A sound
  pervades all other sounds as their substrate, just as waking consciousness pervades and contains our
  ordinary understanding of the other states.


  The "fruits" described (*āpnoti sarvān kāmān* — attains all desires) are traditional pedagogical incentives
  but have an inner meaning: to know the waking state as the first expression of the one Self is to recognize
  oneself as the source from which all desires arise. One does not attain desires as objects; one recognizes
  oneself as the creative ground of desire''s arising.


  Key Terms


  **Vaiśvānara** — The waking-state consciousness, the first and most pervasive of the three states; identified
  with the vowel A as the foundational expression of the Self.

  **āpta** — Pervading or all-encompassing; the quality by which A (and waking consciousness) contains
  and subtends all other sounds and states.

  **sarvān kāmān** — All desires; traditionally the fruits of knowledge, but esoterically the recognition
  of oneself as the creative ground from which desire arises.


  Cross-Tradition Resonances


  **Taittirīya Upanishad II.1 (ānanda-mayo ''bhyāsāt):** Both texts use the hierarchy of states (waking,
  dream, deep sleep) as a pedagogical ladder toward recognizing the Self as their common ground; both
  identify the first or most accessible state as a gateway to non-dual knowledge. Divergence: Taittirīya
  emphasizes bliss (ānanda) as the innermost sheath, whereas Mandukya-Gaudapada privileges structural
  primacy and pervasiveness, making A/Vaiśvānara the logical entry point rather than the ultimate resting
  place.

  **Gaudapada Karika I.15 (jāgrat-svapna-suṣupti-bheda-rahitaḥ):** Gaudapada''s own doctrine that the
  Self transcends all three states mirrors the commentary''s insight that knowing Vaiśvānara as ''first''
  is not mere state-identification but recognition of the witness-ground that generates all states. Divergence:
  The Karika emphasizes the illusory nature of all three states (advaita-vāda), whereas this passage uses
  Vaiśvānara''s pervasiveness pedagogically, risking the appearance of privileging waking consciousness
  as more real.

  **Ṛg Veda X.125.1 (Vāc Sukta: aham rudrebhir vasubhiḥ):** Both texts identify a primordial sound or
  speech-power (Vāc/A) as the generative matrix from which all differentiation and desire emerge; both
  treat this power as simultaneously the first expression and the ground of all becoming. Divergence:
  The Vāc Sukta celebrates the goddess''s cosmic sovereignty and multiplicity, whereas Mandukya-Gaudapada
  uses the same insight to point toward non-dual Self-recognition and the dissolution of desire into its
  source.'
insight: The A vowel opens the mouth and generates the fundamental space from which all speech emerges.
practice: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears
  it.
