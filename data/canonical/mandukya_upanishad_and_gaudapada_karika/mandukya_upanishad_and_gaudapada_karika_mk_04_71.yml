sanskrit_devanagari: 'न कश्चिज् जायते जीवः संभवो ऽस्य न विद्यते ।

  एतत् तद् उत्तमं सत्यं यत्र किञ्चिन् न जायते ॥ ४.७१ ॥'
sanskrit_iast: 'na kaścij jāyate jīvaḥ saṃbhavo ''sya na vidyate |

  etat tad uttamaṃ satyaṃ yatra kiñcin na jāyate || 4.71 ||'
translation_literal: No jīva (individual soul) whatsoever is born; its origination does not exist. This
  is that supreme truth—where nothing whatsoever is born.
commentary: 'Gauḍapāda''s Kārikā IV.71 culminates the doctrine of turīya—the fourth state of consciousness
  that transcends waking (vaiśvānara), dream (taijasa), and deep sleep (prājña). Unlike those three, turīya
  is not a state but the unchanging witness-ground. It is not an experiencer (bhoktr̥) but pure knowing
  (vijñāna). The triple characterization—satya (truth/reality), jñāna (knowledge/consciousness), ānanda
  (bliss)—echoes the Upaniṣadic definition of brahman itself. Gauḍapāda emphasizes that turīya is not
  a fourth state alongside the three but their transcendent substratum. This verse resolves the apparent
  paradox: turīya is both utterly beyond all mental states and intimately present as the light by which
  all experience occurs. The identification with brahman is direct and non-inferential.


  Key Terms


  **turīyam** — “The fourth,” the non-state reality distinct from waking, dream, and deep sleep.

  **vijñānam** — Knowing or consciousness, here that by which the entire field of experience is known.

  **satya-jñāna-ānanda-mayam** — Characterized by reality, consciousness, and bliss.

  **brahma** — Brahman, the ultimate reality identified here with turīya.


  Cross-Tradition Resonances


  **Plotinus, Enneads V.3.13:** Plotinus describes the soul’s ascent toward an intelligible source upon
  which ordinary knowing depends, paralleling turīya as the ground of experiential awareness. Divergence:
  Plotinus generally places the One beyond Intellect, whereas this verse positively characterizes Brahman
  as knowledge-consciousness.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  redirects attention away from fixed phenomenal identities, paralleling the transcendence of the three
  conditioned states. Divergence: Madhyamaka rejects any ultimately existing witnessing self or consciousness,
  while the verse affirms Brahman as an unchanging knowing reality.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius speaks of a divine reality exceeding ordinary
  affirmation, negation, and conceptual knowledge, paralleling turīya’s transcendence of familiar modes
  of experience. Divergence: Dionysius maintains a creator–creature distinction and emphasizes divine
  incomprehensibility, whereas the nondual reading of turīya identifies the ground of knowing with Brahman.'
practice: 'Sit in meditation and observe the three states: waking (notice the sense of agency and external
  objects), dream (notice the mind''s autonomous creation), deep sleep (notice the absence of both). Then,
  without entering sleep, recognize the unchanging awareness that witnesses all three—present now, untouched
  by any state. Rest as that turīya, the fourth, which is neither subject nor object but the luminous
  ground of all knowing. Return to this recognition repeatedly throughout the day.'
