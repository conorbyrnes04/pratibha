title: Verse 12 · The Silence — Turīya as Amātrā
unit_type: sutra
sanskrit_devanagari: अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत एवमोङ्कार आत्मैव संविशत्यात्मनाऽऽत्मानं य एवं वेद
  ॥ १२ ॥
sanskrit_iast: amātras caturtho 'vyavahāryaḥ prapañcopaśamaḥ śivo 'dvaita evam oṅkāra ātmaiva saṃviśaty ātmanātmānaṃ ya evaṃ
  veda || 12 ||
translation_literal: The fourth is without measure (*amātrā*), beyond practical dealings, the cessation of phenomena, auspicious,
  without a second. Thus Om is the very Ātman. One who knows this merges the Self into the Self by the Self.
commentary: '*Amātra* — without element, without measure, without syllabic weight. The silence following the sounding of A-U-M
  is not an element of Om the way A, U, M are elements. It is the ground from which they arise and into which they return.
  This asymmetry is crucial: the three sounds are *within* the silence; the silence is not within or alongside them. Similarly,
  Turīya is not a fourth state *alongside* waking, dreaming, and deep sleep but the unconditioned ground in which all three
  appear.


  *Saṃviśaty ātmanātmānaṃ* — "merges the Self into the Self by the Self" — the final phrase is the most remarkable in the
  Upaniṣad. Three uses of *ātman* in one sentence, each playing a different grammatical role: the individual Self merges (*saṃviśati*)
  into the universal Self (*ātmānam*, accusative — the destination) by means of the Self (*ātmanā*, instrumental — the means).
  Subject, object, and instrument are all the same — the Self. This is not absorption of the individual into an other; it
  is the recognition that the individual and the universal were never two things requiring a merger.


  The Upaniṣad concludes not with liberation as a future event but with the structure of recognition described in the present
  tense: *ya evaṃ veda* — "one who knows this thus" — it is present, immediate, now.


  Key Terms:


  - **amātrā** — without element/measure; the silence following AUM; the unconditioned ground not among the three elements
  but their source

  - **saṃviśati** — enters, merges; but the merger is recognition of prior identity, not the achieving of a new unity

  - **ātmanātmānam** — Self into Self; the double Ātman is grammatically and philosophically precise: no external destination'
insight: '*Amātra* — without element, without measure, without syllabic weight.'
practice: 'Sound Om fully — A arising from the open throat, U rolling forward, M closing and humming through the skull — and
  then hold the silence afterward. Not making silence; it is already there. Notice that the silence is not empty: it is full
  with the same awareness that heard the sound. The sound dissolved into silence; the awareness in which the sound appeared
  did not dissolve. *Amātrā* — the measureless — is not an experience to be had but the ground of all experience to be recognized.
  Every sounding of Om, understood this way, is a complete recapitulation of the Upaniṣad.'
