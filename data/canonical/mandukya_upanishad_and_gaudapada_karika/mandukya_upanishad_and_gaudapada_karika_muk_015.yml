sanskrit_devanagari: अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत एवमोङ्कार आत्मैव संविशत्यात्मनाऽऽत्मानं
  य एवं वेद ॥ १२ ॥
sanskrit_iast: amātras caturtho 'vyavahāryaḥ prapañcopaśamaḥ śivo 'dvaita evam oṅkāra ātmaiva saṃviśaty
  ātmanātmānaṃ ya evaṃ veda || 12 ||
translation_literal: The fourth, without measure, beyond all transaction, the stilling of manifestation,
  the auspicious, non-dual — thus OM is the Self itself. The Self enters into the Self. Whoever knows
  thus knows the Self through the Self.
commentary: 'This verse completes the four-fold analysis of OM and consciousness that structures the Māṇḍūkya
  Upaniṣad. The term amātra (literally ''without measure'' or ''without parts'') describes turīya, the
  fourth state, which stands apart from the three measurable states of waking, dream, and deep sleep.
  Each of those states can be mapped to a syllable of OM (A, U, M), but turīya corresponds to the silence
  that holds and transcends all sound—the unspoken ground.


  Gauḍapāda''s Kārikā emphasizes here the non-origination doctrine (ajātivāda) implicit in this verse.
  If turīya is truly non-dual (advaita) and beyond all transaction (avyavahārya), then the apparent creation
  and dissolution of the three states—the prapañca—are not ultimately real events but appearances within
  consciousness. The ''stilling of manifestation'' (prapañcopaśama) is not a process that happens but
  the recognition that the world-appearance has no independent reality separate from the Self.


  The final phrase—''the Self enters into the Self''—is not a movement but an identity statement. There
  is no entering, no journey, no becoming. What appears as the individual self (ātman) recognizing itself
  is the Self knowing itself without division. The knower, the knowing, and the known collapse into a
  single non-dual fact. ''Whoever knows thus'' does not mean a person acquiring knowledge; it means the
  Self recognizing its own nature as that which was never bound, never became, never will become anything
  other than itself.


  This verse anchors the entire teaching: OM is not a symbol pointing elsewhere but the very structure
  of consciousness recognizing itself. The silence at the heart of the mantra is not emptiness but fullness—the
  pregnant void from which all sound and form arise and into which they dissolve, yet which itself remains
  untouched by any arising or dissolution.


  Key Terms


  **amātra** — Without measure, without parts; the indivisible ground beyond the three measurable states

  **turīya** — The fourth state of consciousness; the witnessing awareness that transcends waking, dream,
  and deep sleep

  **advaita** — Non-duality; the absence of any real separation between subject and object, knower and
  known'
insight: '*Amātra* — without element, without measure, without syllabic weight.'
practice: 'Between your next inhalation and exhalation, rest in the gap—that unmeasured silence where
  no sound yet lives. Let this pause grow familiar throughout the day: before speaking, after listening,
  in the space between thoughts. Each time you find it, recognize it as the Self knowing itself, needing
  nothing, transacting with nothing.'
