- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mūlamadhyamakakārikā (Nāgārjuna) 25.19–20
    resonance: the convergence point. Nāgārjuna's *śūnyavāda* (doctrine of emptiness) and Gauḍapāda's *ajātivāda* arrive at
      structurally similar positions — all phenomena lack independent origination
    divergence: but from opposite directions. Nāgārjuna deconstructs from the phenomenal side; Gauḍapāda proceeds from the
      standpoint of consciousness as ground. This is the most productive dialogue in the Pratibhā corpus.
    passage_id: ''
  - citation: Pseudo-Dionysius, *Mystical Theology
    resonance: '"The simple absolute and immutable mysteries of divine knowledge... are hidden in the transcendent darkness
      of hidden silence." Six apophatic negations followed by silence — the same method as Māṇḍūkya 7, arriving at the same
      impossibility of predication.'
    divergence: ''
    passage_id: ''
  - citation: Wittgenstein, *Tractatus* 7
    resonance: '"What we cannot speak about we must pass over in silence." The limit of language as the door to what lies
      beyond — Wittgenstein as negative theologian arriving at the same boundary the Upaniṣad names *avyapadeśya*.'
    divergence: ''
    passage_id: ''
  - citation: Aṣṭāvakra Gītā 18.96
    resonance: '*na sukhī na ca vā duḥkhī na virakto na saṅgavān | na mumukṣur na vā muktā na kiñcin na ca kiñcana ||* — the
      liberated one refuses every binary predication. Aṣṭāvakra is describing the lived phenomenology of what Māṇḍūkya 7 describes
      ontologically.'
    divergence: ''
