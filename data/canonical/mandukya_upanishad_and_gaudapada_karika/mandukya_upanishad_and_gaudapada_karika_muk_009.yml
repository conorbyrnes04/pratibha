sanskrit_devanagari: नान्तःप्रज्ञं न बहिःप्रज्ञं नोभयतःप्रज्ञं न प्रज्ञानघनं न प्रज्ञं नाप्रज्ञम् । अदृष्टमव्यवहार्यमग्राह्यमलक्षणमचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसारं
  प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः ॥ ७ ॥
sanskrit_iast: nāntaḥprajñaṃ na bahiṣprajñaṃ nobhayataḥprajñaṃ na prajñānaghanaṃ na prajñaṃ nāprajñam | adṛṣṭam avyavahāryam
  agrāhyam alakṣaṇam acintyam avyapadeśyam ekātmapratyayasāraṃ prapañcopaśamaṃ śāntaṃ śivam advaitaṃ caturthaṃ manyante sa
  ātmā sa vijñeyaḥ || 7 ||
translation_literal: Not inward-knowing, not outward-knowing, not knowing both together; not a mass of knowing; not knowing,
  not unknowing. Unseen, beyond transaction, beyond grasping, without mark or sign, unthinkable, beyond naming—its essence
  is the intuition of singularity, the quieting of manifestation, peaceful, auspicious, non-dual. This fourth they understand
  to be the Self. This is what is to be known.
commentary: 'This verse presents turīya—the fourth state—as the ground that transcends yet encompasses the three ordinary
  states (waking, dreaming, deep sleep). The repeated negations (neti, neti structure) are not mere emptiness but precision:
  turīya is not *any* form of knowing because it is not an object of knowledge, not a state among states. It is the unchanging
  witness to all states.


  The phrase ekātmapratyayasāra—''whose essence is the intuition of singularity''—is crucial. This is not intellectual knowledge
  but direct recognition (pratyaya) of non-duality. The Self knows itself not as subject knowing object, but as the seamless
  continuity in which all knowing occurs.


  Gauḍapāda''s framework here supports ajātivāda (non-origination): if turīya is the ever-present fourth, then the three states
  never truly originate or dissolve—they are appearances within an unchanging consciousness. The world''s manifestation (prapañca)
  is not negated but understood as a quieting (upaśama) within the Self''s own nature.


  The epithets śāntaṃ śivam advaitaṃ (peaceful, auspicious, non-dual) are not poetic ornament but phenomenological markers.
  When the mind settles into turīya, the agitation of subject-object division ceases. This is both the deepest peace and the
  highest good (śiva).


  Key Terms


  **turīya** — The fourth state; the unchanging ground of consciousness that transcends and underlies waking, dreaming, and
  deep sleep.

  **ekātmapratyayasāra** — Whose essence is the intuition of singularity; direct recognition of non-dual consciousness, not
  conceptual knowledge.

  **ajātivāda** — The doctrine of non-origination; the view that consciousness and reality never truly arise or cease, only
  appear to transform.'
insight: 'This is the most important verse in the Upaniṣad — arguably one of the most important single passages in the entire
  history of philosophy — and its method is pure *apophasis*: systematic negation of every possible characterization.'
practice: 'When you next catch yourself saying or thinking ''I know'' about anything—a thought, a feeling, a fact—pause and
  whisper the line from the text: ''not inward-knowing, not outward-knowing.'' Then notice the knowing itself, the simple
  awareness that persists whether you name what you know or not. Let that unnamed awareness be what you recognize as the Self,
  the fourth that needs no object.'
