sanskrit_devanagari: नान्तःप्रज्ञं न बहिःप्रज्ञं नोभयतःप्रज्ञं न प्रज्ञानघनं न प्रज्ञं नाप्रज्ञम् । अदृष्टमव्यवहार्यमग्राह्यमलक्षणमचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसारं
  प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः ॥ ७ ॥
sanskrit_iast: nāntaḥprajñaṃ na bahiṣprajñaṃ nobhayataḥprajñaṃ na prajñānaghanaṃ na prajñaṃ nāprajñam | adṛṣṭam avyavahāryam
  agrāhyam alakṣaṇam acintyam avyapadeśyam ekātmapratyayasāraṃ prapañcopaśamaṃ śāntaṃ śivam advaitaṃ caturthaṃ manyante sa
  ātmā sa vijñeyaḥ || 7 ||
translation_literal: It is not that which is inwardly conscious, not that which is outwardly conscious, not that which is
  conscious in both directions, not a mass of consciousness, not consciousness, not non-consciousness. It is unseen, beyond
  practical dealings, beyond grasp, without characteristics, unthinkable, indescribable — the essence of the recognition of
  the single Self, the cessation of phenomena, peaceful, auspicious, without a second. This is what is known as the Fourth.
  This is the Ātman. This is to be known.
commentary: 'This is the most important verse in the Upaniṣad — arguably one of the most important single passages in the
  entire history of philosophy — and its method is pure *apophasis*: systematic negation of every possible characterization.


  **The six negations** strip away each of the three states and every possible modifier:

  - *na antaḥprajñam* — not inwardly conscious (eliminates Taijasa/dream)

  - *na bahiṣprajñam* — not outwardly conscious (eliminates Vaiśvānara/waking)

  - *na ubhayataḥprajñam* — not conscious in both directions (eliminates any combination)

  - *na prajñānaghanaṃ* — not a mass of consciousness (eliminates Prājña/deep sleep)

  - *na prajñam* — not consciousness (eliminates any remaining cognitive function)

  - *na aprajñam* — not non-consciousness (eliminates inertness or unconsciousness)


  Six negations that exhaust every logical possibility. After these, nothing can be said. What remains?


  **The positive characterizations** then follow — not as descriptions of *what* Turīya is but as pointers to *how it functions*
  in relation to experience:


  *Ekātmapratyayasāra* — "the essence of the recognition of the single Self" — the one constant that runs through all three
  states as the witnessing principle. Not a new thing to be discovered but the very substance of what has been present throughout.


  *Prapañcopaśama* — "the cessation of phenomena" — not the destruction of appearances but their *upaśama*: settling down,
  coming to rest, recognizing their nature as appearances in consciousness. The world doesn''t disappear; its independent-reality
  status does.


  *Śāntam* — peaceful; *śivam* — auspicious; *advaitam* — without a second. These three together name the quality of Turīya:
  the peace that is not the opposite of disturbance but prior to the distinction, the auspiciousness that is not a quality
  but the intrinsic character of what-is, the non-duality that is not a relationship ("these two are actually one") but a
  recognition ("there was never a second").


  The verse ends: *sa ātmā sa vijñeyaḥ* — that is the Ātman, that is to be known. The paradox of saying "this beyond-description
  is to be known" is deliberate: *vijñeya* here doesn''t mean propositional knowledge-about but the direct recognition that
  Śaṅkara calls *aparokṣajñāna* — non-mediated knowing.


  Key Terms:


  - **turīya** — the fourth; *tur* (to cross over) + nominal suffix; that which crosses beyond the three; also written *turya*

  - **apophatic negations** — *adṛṣṭa* (unseen), *avyavahārya* (beyond practical dealings), *agrāhya* (beyond grasp), *alakṣaṇa*
  (without characteristics), *acintya* (unthinkable), *avyapadeśya* (indescribable)

  - **ekātmapratyayasāra** — the essence of the recognition of the single Self; *eka* (one) + *ātman* (Self) + *pratyaya*
  (recognition, conviction) + *sāra* (essence, core)

  - **prapañcopaśama** — the cessation/settling of phenomena; *prapañca* (the phenomenal world, expansion) + *upaśama* (cessation,
  settling, coming to rest)

  - **advaita** — without a second, non-dual; not a doctrine but a recognition: *a* (without) + *dvaita* (two-ness)

  - **vijñeya** — to be known; not propositionally but through direct recognition


  Cross-Tradition Resonances:


  - Mūlamadhyamakakārikā (Nāgārjuna) 25.19–20: the convergence point. Nāgārjuna''s *śūnyavāda* (doctrine of emptiness) and
  Gauḍapāda''s *ajātivāda* arrive at structurally similar positions — all phenomena lack independent origination — but from
  opposite directions. Nāgārjuna deconstructs from the phenomenal side; Gauḍapāda proceeds from the standpoint of consciousness
  as ground. This is the most productive dialogue in the Pratibhā corpus.

  - Pseudo-Dionysius, *Mystical Theology*: "The simple absolute and immutable mysteries of divine knowledge... are hidden
  in the transcendent darkness of hidden silence." Six apophatic negations followed by silence — the same method as Māṇḍūkya
  7, arriving at the same impossibility of predication.

  - Wittgenstein, *Tractatus* 7: "What we cannot speak about we must pass over in silence." The limit of language as the door
  to what lies beyond — Wittgenstein as negative theologian arriving at the same boundary the Upaniṣad names *avyapadeśya*.

  - Aṣṭāvakra Gītā 18.96: *na sukhī na ca vā duḥkhī na virakto na saṅgavān | na mumukṣur na vā muktā na kiñcin na ca kiñcana
  ||* — the liberated one refuses every binary predication. Aṣṭāvakra is describing the lived phenomenology of what Māṇḍūkya
  7 describes ontologically.'
insight: 'This is the most important verse in the Upaniṣad — arguably one of the most important single passages in the entire
  history of philosophy — and its method is pure *apophasis*: systematic negation of every possible characterization.'
practice: 'The six negations of Verse 7 can be used as a meditation. In sitting practice: *nāntaḥprajñam* — I am not this
  inward dream. *Na bahiṣprajñam* — I am not this outward waking. *Na prajñānaghanaṃ* — I am not even the unified blankness
  of deep sleep. *Na prajñam* — I am not any form of consciousness-as-faculty. *Na aprajñam* — I am not unconsciousness. Then
  sit in what remains after each negation. Not emptiness — *prapañcopaśama*: the settling. Not absence — *śāntam*: the peace.
  This is the practice the verse encodes.'
