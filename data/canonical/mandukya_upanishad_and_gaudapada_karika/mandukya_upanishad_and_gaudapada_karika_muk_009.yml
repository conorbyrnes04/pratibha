- kind: practice
  label: Practice (Abhyasa)
  body: 'The six negations of Verse 7 can be used as a meditation. In sitting practice: *nāntaḥprajñam* — I am not this inward
    dream. *Na bahiṣprajñam* — I am not this outward waking. *Na prajñānaghanaṃ* — I am not even the unified blankness of
    deep sleep. *Na prajñam* — I am not any form of consciousness-as-faculty. *Na aprajñam* — I am not unconsciousness. Then
    sit in what remains after each negation. Not emptiness — *prapañcopaśama*: the settling. Not absence — *śāntam*: the peace.
    This is the practice the verse encodes.'
