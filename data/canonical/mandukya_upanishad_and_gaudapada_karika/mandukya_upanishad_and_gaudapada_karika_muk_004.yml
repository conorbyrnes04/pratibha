source_excerpt: 'Overview

  These four verses constitute the analytical heart of the Upaniṣad — the systematic examination of the
  three ordinary states of consciousness. The analysis is not psychological or neuroscientific; it is
  ontological. The question is not "what happens in these states?" but "what does each state reveal about
  the nature of consciousness itself?"'
translation_literal: 'Overview

  These four verses constitute the analytical heart of the Upaniṣad — the systematic examination of the
  three ordinary states of consciousness. The analysis is not psychological or neuroscientific; it is
  ontological. The question is not "what happens in these states?" but "what does each state reveal about
  the nature of consciousness itself?"'
commentary: 'Verses 3–6 perform a radical inversion of ordinary inquiry. Rather than cataloguing the contents
  of waking, dream, and deep sleep—the phenomenological furniture of each state—the Upaniṣad asks what
  each state discloses about consciousness (ātman) itself. This is the ontological move that distinguishes
  Advaita''s method from psychology. Each state is a lens, not a subject of study.


  The waking state reveals consciousness as the witness of gross objects and the sense organs that perceive
  them. Dream reveals consciousness as the creator and witness of subtle objects—the entire dream world
  arises from and is known by the same ātman, now without external sensory apparatus. Deep sleep (suṣupti)
  is the crucial third term: here all objects, gross and subtle, dissolve. Yet consciousness persists
  as the knower of that very dissolution, the experiencer of the bliss-tinged void. The sleeper awakens
  and says ''I slept well; I knew nothing''—and this knowing of non-knowing is itself a state of consciousness.


  Gauḍapāda''s Kārikā deepens this by anchoring the analysis in ajātivāda (non-origination). If consciousness
  were truly modified or limited by each state, it would originate anew in each. Instead, the three states
  reveal that ātman is eternally unborn, unchanging—the constant witness-ground that appears to contract
  or expand only from the perspective of avidyā (ignorance). The OM (Praṇava) that the Upaniṣad identifies
  with ātman is thus not produced by or dependent on any state; it encompasses all three while remaining
  untouched by their apparent succession.


  The analytical precision here serves a liberatory function: by showing that consciousness is neither
  the waking ego nor the dream-self nor the void of sleep, but the immutable substratum of all three,
  the text prepares the ground for recognizing turīya (the fourth state)—not as another state to be experienced,
  but as the non-dual ground that was never in bondage to states at all.


  Key Terms


  **ajātivāda** — The doctrine of non-origination; the teaching that Brahman/ātman is eternally unborn
  and never undergoes transformation, despite appearances of change in the three states

  **suṣupti** — Deep sleep; the state in which gross and subtle objects dissolve, yet consciousness persists
  as the knower of that dissolution

  **Praṇava (OM)** — The sacred syllable OM, identified as the sound-symbol of ātman/Brahman, encompassing
  all states and their transcendence'
insight: ''
practice: 'As you move through waking, dreaming, and deep sleep tonight, pause at each transition and
  ask: "What remains aware of this change?" — not analyzing the states themselves, but turning attention
  toward the unchanging consciousness that witnesses all three.'
