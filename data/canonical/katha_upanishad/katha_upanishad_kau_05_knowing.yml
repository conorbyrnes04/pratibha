unit_label: The Knowing Self Is Not Born
title: The Knowing Self Is Not Born
unit_type: sutra
sanskrit_devanagari: "न जायते म्रियते वा विपश्चिन् नायं कुतश्चिन् न बभूव कश्चित् ।  अजो नित्यः शाश्वतो\
  \ ऽयं पुराणो न हन्यते हन्यमाने शरीरे । \nहन्ता चेन् मन्यते हन्तुं हतश् चेन् मन्यते हतम् ।  उभौ तौ न\
  \ विजानीतो नायं हन्ति न हन्यते । \nअणोर् अणीयान् महतो महीयान् आत्मास्य जन्तोर् निहितो गुहायाम् ।  तम्\
  \ अक्रतुः पश्यति वीतशोको धातुप्रसादान् महिमानम् आत्मनः । \nआसीनो दूरं व्रजति शयानो याति सर्वतः ।  कस्\
  \ तं मदामदं देवं मद् अन्यो ज्ञातुम् अर्हति । \nअशरीरं शरीरेषु अनवस्थेष्व् अवस्थितम् ।  महान्तं विभुम्\
  \ आत्मानं मत्वा धीरो न शोचति । \nनायम् आत्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन ।  यम् एवैष वृणुते\
  \ तेन लभ्यस् तस्यैष आत्मा विवृणुते तनूं स्वाम् । \nनाविरतो दुश्चरितान् नाशान्तो नासमाहितः ।  नाशान्तमानसो\
  \ वापि प्रज्ञानेनैनम् आप्नुयात् । \nयस्य ब्रह्म च क्षत्रं च उभे भवत ओदनः ।  मृत्युर् यस्योपसेचनं क इत्था\
  \ वेद यत्र सः । ।"
sanskrit_iast: 'na jāyate mriyate vā vipaścin nāyaṃ kutaścin na babhūva kaścit / ajo nityaḥ śāśvato ''yaṃ
  purāṇo na hanyate hanyamāne śarīre |

  hantā cen manyate hantuṃ hataś cen manyate hatam / ubhau tau na vijānīto nāyaṃ hanti na hanyate |

  aṇor aṇīyān mahato mahīyān ātmāsya jantor nihito guhāyām / tam akratuḥ paśyati vītaśoko dhātuprasādān
  mahimānam ātmanaḥ |

  āsīno dūraṃ vrajati śayāno yāti sarvataḥ / kas taṃ madāmadaṃ devaṃ mad anyo jñātum arhati |

  aśarīraṃ śarīreṣu anavastheṣv avasthitam / mahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati |

  nāyam ātmā pravacanena labhyo na medhayā na bahunā śrutena / yam evaiṣa vṛṇute tena labhyas tasyaiṣa
  ātmā vivṛṇute tanūṃ svām |

  nāvirato duścaritān nāśānto nāsamāhitaḥ / nāśāntamānaso vāpi prajñānenainam āpnuyāt |

  yasya brahma ca kṣatraṃ ca ubhe bhavata odanaḥ / mṛtyur yasyopasecanaṃ ka itthā veda yatra saḥ ||'
translation_literal: 'The wise Self is neither born nor dies; it did not come from anywhere, nor did it
  become anything. Unborn, eternal, everlasting, primeval, it is not slain when the body is slain. If
  the slayer thinks he slays, if the slain thinks he is slain, both of them do not understand: this Self
  neither slays nor is slain. Smaller than the atom, greater than the great, the Self is hidden in the
  cave of the heart of this living being. One without active will sees it and becomes free from sorrow
  through the grace of the Creator, the greatness of the Self. Sitting, it travels far; lying down, it
  goes everywhere. Who else besides myself can know this God who is both joyful and beyond joy? Knowing
  the Self as bodiless among bodies, stable among the unstable, great and all-pervading, the wise one
  does not grieve. This Self cannot be attained by instruction, nor by intellect, nor by much learning.
  It is attained by him alone whom it chooses; to him this Self reveals its own form. Not one who has
  not ceased from wrong conduct, nor one who is not tranquil, nor one who is not concentrated, nor one
  whose mind is not at peace, can attain this Self through wisdom. He for whom both the Brahmin and the
  Kshatriya are but food, and death itself is the sauce—who can know where He abides in such a state?'
commentary: 'The passage executes a radical reversal of the death-question itself. Naciketas arrives seeking
  boons—extensions, pleasures, continuations. Yama responds not with consolation but with a teaching that
  collapses the very ground of the question. The Self (ātman) that Yama names is *ajah*, unborn, *nityah*,
  eternal, *śāśvatah*, primordial. It does not become; it does not perish. More unsettling: it cannot
  kill, cannot be killed. The one who thinks "I kill" and the one who thinks "I am killed" both miss the
  mark entirely—*ubhau tau na vijānītah*. Neither understands. This is not metaphysical comfort; it is
  epistemic rupture. The Self is smaller than the smallest (*anoḥ aṇīyān*) yet vaster than the vast (*mahato
  mahīyān*), lodged in the secret cave of the heart (*guhaāyām*), accessible only to one who has shed
  the fever of becoming (*vīta-śokah*). The passage does not console Naciketas by promising he will not
  die. It teaches that what he fundamentally is has never been born and cannot die—a claim that unmakes
  the entire premise of his seeking. The knowing one (*dhīrah*) grasps this and ceases to grieve. Yama
  is not offering immortality as extension; he is offering recognition of what was never subject to time.


  Key Terms


  **śreyas** — the good; that which conduces to ultimate welfare and liberation, distinguished from immediate
  gratification

  **preyas** — the pleasant; that which attracts through sensory appeal and desire, binding the seeker
  to cyclical becoming

  **ātman** — the Self; the unborn, eternal witness-consciousness that transcends birth, death, and the
  doer-sufferer duality

  **dhīrah** — the wise one; the discerner who recognizes the unchanging Self and thereby transcends grief
  and the illusion of agency


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.37–38 (Arjuna''s dilemma between duty and desire):** Both passages pit an immediate,
  emotionally compelling choice (Arjuna''s refusal to fight; Naciketas'' pursuit of pleasure-boons) against
  a higher discernment that reveals the illusory ground of the conflict itself. The wise choose *śreyas*
  over *preyas*. Divergence: The Gītā resolves the tension through *dharma* and righteous action (*yoga*),
  whereas the Katha resolves it through recognition of the actionless ātman—duty versus non-doership.

  **Plato, *Phaedo* 64b–67b (Socrates on the philosopher''s preparation for death):** Both texts reframe
  death-anxiety by inverting the seeker''s premise: Socrates argues the philosopher practices dying throughout
  life by withdrawing from bodily appetite; Yama teaches that the ātman was never born. Both dissolve
  the fear through epistemic shift rather than consolation. Divergence: Socrates locates liberation in
  the soul''s ascent to eternal Forms through rational purification; Yama locates it in recognition of
  the Self''s timeless presence *now*, in the cave of the heart—transcendence through direct knowing,
  not philosophical ascent.

  **Buddhist Dhammapada v. 21 (the wise choose the difficult path of the good over the easy path of pleasure):**
  Both traditions sharply distinguish the fool''s attraction to *preyas* (sensory pleasure) from the wise
  person''s commitment to *śreyas* (the good), framing this as the fundamental divide between bondage
  and freedom. Divergence: The Dhammapada grounds this choice in ethical conduct and the gradual elimination
  of craving; the Katha grounds it in the non-dual recognition of ātman, which renders the doer-sufferer
  framework itself obsolete.'
insight: The passage executes a radical reversal of the death-question itself.
practice: 'When you next feel the pull of a desire that promises safety or continuity—a possession, a
  relationship, a status you fear losing—trace it backward to its root claim: that *you* could be diminished,
  that something essential could be taken. Hold that claim in awareness without immediately accepting
  or rejecting it, and ask: what in me believes it can be harmed? What persists in that asking itself,
  untouched by the answer?'
