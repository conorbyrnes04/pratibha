sanskrit_devanagari: 'इन्द्रियेभ्यः परा ह्य् अर्था अर्थेभ्यश् च परं मनः ।

  मनसस् तु परा बुद्धिर् बुद्धेर् आत्मा महान् परः ॥ १.३.१० ॥'
sanskrit_iast: 'indriyebhyaḥ parā hy arthā arthebhyaś ca paraṁ manaḥ |

  manasas tu parā buddhir buddher ātmā mahān paraḥ || 1.3.10 ||'
translation_literal: Beyond the senses indeed are their objects; beyond the objects is mind (manas). Beyond
  mind is intellect (buddhi); beyond intellect is the great Self (mahān ātmā).
commentary: 'Yama continues the chariot teaching by tracing awareness inward through a graded order. Sense
  faculties are not ultimate: they operate in relation to artha, their objects or fields of apprehension.
  Mind coordinates and selects sensory presentations; buddhi is the discerning, determining power that
  can judge rather than merely react. Yet even buddhi is not final. The “great Self” exceeds the intellect’s
  functions and is not another object available to thought. The sequence is therefore both cosmological
  and contemplative: one withdraws attention from outward stimuli, notices the mind’s movements, recognizes
  the faculty of discrimination, and then ceases to identify even with that faculty. The verse does not
  disparage senses or reason; it assigns each a proper scope while directing inquiry toward the ground
  that is not confined by them.


  Key Terms


  **indriya** — sense faculty or organ of perception

  **artha** — object, aim, or field apprehended by the senses

  **manas** — mind as coordinator of sensory impressions

  **buddhi** — intellect; discerning and determining awareness


  Cross-Tradition Resonances


  **Plato likewise distinguishes bodily appetite and perception from the rational power that should govern
  the soul.:**  Divergence: Plato’s account is framed as the moral ordering of a composite soul, whereas
  this verse presses beyond intellect toward the great Self.

  **Plotinus describes an ascent from the sensible realm through soul and Intellect toward a principle
  beyond ordinary discursive thought.:**  Divergence: The Upaniṣadic mahān ātmā belongs to a distinctive
  Vedic hierarchy and should not simply be equated with Plotinus’s One.

  **Buddhist practice also examines sense contact, mental processing, and discriminative consciousness
  rather than taking immediate experience as ultimate.:**  Divergence: Most Buddhist traditions reject
  an enduring Self behind these processes; the Kaṭha Upaniṣad’s ascent explicitly culminates in ātman.'
practice: 'For ten minutes, sit quietly and label experience in this order: “sense object,” “mind noticing,”
  “discernment judging.” After each label, ask silently: “What is aware even of this?” Rest without seeking
  an answer as an object.'
