sanskrit_devanagari: 'अशब्दम् अस्पर्शम् अरूपम् अव्ययं तथारसं नित्यम् अगन्धवच् च यत् ।

  अनाद्य् अनन्तं महतः परं ध्रुवं निचाय्य तन् मृत्युमुखात् प्रमुच्यते ॥ १५ ॥

  नाचिकेतम् उपाख्यानं मृत्युप्रोक्तं सनातनम् ।

  उक्त्वा श्रुत्वा च मेधावी ब्रह्मलोके महीयते ॥ १६ ॥

  य इमं परमं गुह्यं श्रावयेद् ब्रह्मसंसदि ।

  प्रयतः श्राद्धकाले वा तद् आनन्त्याय कल्पते ।

  तद् आनन्त्याय कल्पत इति ॥ १७ ॥'
sanskrit_iast: 'aśabdam asparśam arūpam avyayaṃ tathārasaṃ nityam agandhavac ca yat / anādy anantaṃ mahataḥ
  paraṃ dhruvaṃ nicāyya tan mṛtyumukhāt pramucyate || 15 ||

  nāciketam upākhyānaṃ mṛtyuproktaṃ sanātanam / uktvā śrutvā ca medhāvī brahmaloke mahīyate || 16 ||

  ya imaṃ paramaṃ guhyaṃ śrāvayed brahmasaṃsadi / prayataḥ śrāddhakāle vā tad ānantyāya kalpate / tad
  ānantyāya kalpata iti || 17 ||'
translation_literal: '15. Soundless, untouchable, formless, undecaying; likewise tasteless, eternal, and
  without scent—that which is beginningless, endless, beyond the great, and steadfast: having directly
  discerned That, one is released from the jaws of death.


  16. Having spoken and heard this ancient tale of Naciketas, taught by Death, the discerning person is
  honored in the world of Brahmā.


  17. Whoever, purified, recites this highest secret in an assembly devoted to Brahman, or at a śrāddha
  rite, becomes fit for boundlessness—fit for boundlessness indeed.'
commentary: 'Verse 15 gathers a deliberate series of negations: aśabdam, asparśam, arūpam—without sound,
  touch, or form—followed by freedom from taste and smell. The reality sought cannot be seized as an object
  by any sense. Yet it is not presented as a mere blank: it is nityam, “eternal,” anādi, “without beginning,”
  anantam, “without end,” dhruvam, “steady,” and mahataḥ param, beyond the “great” principle. The decisive
  verb is nicāyya, “having discerned” or “having recognized”: liberation from mṛtyumukha, Death’s mouth,
  follows from this insight.


  The final verses turn from metaphysical instruction to the life of transmission. The account is sanātanam,
  enduring, and mṛtyuprokta, spoken by Death himself. To speak and hear it intelligently is itself honorable.
  Verse 17 further places the teaching in communal and ritual settings—brahmasaṃsad, an assembly concerned
  with Brahman, and śrāddha, a rite for the departed. The repeated conclusion, tad ānantyāya kalpate,
  gives the recitation an expansive end: it prepares one for the limitless.


  Key Terms


  **aśabdam** — “Soundless”: not available as an object of auditory perception.

  **nicāyya** — “Having discerned”: a settled, direct recognition rather than mere information.

  **mṛtyumukhāt** — “From the mouth of death”: from death’s devouring power and mortal bondage.

  **ānantyāya** — “For boundlessness”: toward the limitless or inexhaustible.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 3.8.8 (Yājñavalkya on the imperishable):** Yājñavalkya likewise describes the
  imperishable through negations, saying it is not grasped, not destroyed, and not attached. Divergence:
  The Bṛhadāraṇyaka passage frames this teaching within Yājñavalkya’s dialogue with Gārgī, whereas Kaṭha
  joins sensory negation specifically to escape from Death.

  **Plato, Phaedo 65b–66a:** Socrates argues that the soul’s pursuit of truth requires loosening dependence
  on the senses, which can distract from what is stable and real. Divergence: Plato’s argument centers
  on the soul’s philosophical separation from the body, while this verse identifies an unconditioned reality
  beyond all sensory predicates.

  **Tao Te Ching, ch. 14:** The Dao is described as invisible, inaudible, and intangible, resisting capture
  by sight, hearing, and touch. Divergence: The Dao De Jing emphasizes the nameless source and its way
  of natural efficacy, while Kaṭha explicitly links discernment of the transcendent to freedom from death.'
practice: Sit upright for seven quiet minutes. Let sounds, bodily contacts, images behind the eyelids,
  tastes, and scents arise without pursuing any of them; after each, silently note, “known, but not the
  knower.” End by resting for three breaths with the phrase “steady, beginningless, endless,” then dedicate
  the attention to someone who has died.
