sanskrit_devanagari: 'इन्द्रियेभ्यः परा ह्य् अर्था अर्थेभ्यश् च परं मनः ।

  मनसस् तु परा बुद्धिर् बुद्धेर् आत्मा महान् परः ॥ १० ॥

  महतः परम् अव्यक्तम् अव्यक्तात् पुरुषः परः ।

  पुरुशान् न परं किंचित् सा काष्ठा सा परा गतिः ॥ ११ ॥

  एष सर्वेषु भूतेषु गूढो ऽत्मा न प्रकाशते ।

  दृष्यते त्व् अग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः ॥ १२ ॥

  यच्छेद् वाङ्मनसी प्राज्ञस् तद् यच्छेज् ज्ञान आत्मनि ।

  ज्ञानम् आत्मनि महति नियच्छेत् तद् यच्छेच् छान्त आत्मनि ॥ १३ ॥

  उत्तिष्ठत जाग्रत प्राप्य वरान् निबोधत ।

  क्षुरस्य धारा निशिता दुरत्यया दुर्गं पथस् तत् कवयो वदन्ति ॥ १४ ॥'
sanskrit_iast: 'indriyebhyaḥ parā hy arthā arthebhyaś ca paraṃ manaḥ / manasas tu parā buddhir buddher
  ātmā mahān paraḥ || 10 ||

  mahataḥ param avyaktam avyaktāt puruṣaḥ paraḥ / puruśān na paraṃ kiṃcit sā kāṣṭhā sā parā gatiḥ || 11
  ||

  eṣa sarveṣu bhūteṣu gūḍho ''tmā na prakāśate / dṛṣyate tv agryayā buddhyā sūkṣmayā sūkṣmadarśibhiḥ ||
  12 ||

  yacched vāṅmanasī prājñas tad yacchej jñāna ātmani / jñānam ātmani mahati niyacchet tad yacchec chānta
  ātmani || 13 ||

  uttiṣṭhata jāgrata prāpya varān nibodhata / kṣurasya dhārā niśitā duratyayā durgaṃ pathas tat kavayo
  vadanti || 14 ||'
translation_literal: "Beyond the senses are their objects; beyond the objects is the mind. Beyond the\
  \ mind is discernment; beyond discernment is the great Self. \n\nBeyond the great is the Unmanifest;\
  \ beyond the Unmanifest is the Person. Beyond the Person there is nothing at all: that is the limit,\
  \ that is the highest destination. \n\nThis Self, hidden within all beings, does not shine forth openly.\
  \ Yet it is seen by those of subtle sight, through a keen and subtle discernment. \n\nLet the wise one\
  \ restrain speech within the mind; let that be restrained within the knowing Self. Let the knowing Self\
  \ be gathered into the great Self; let that be gathered into the peaceful Self. \n\nRise up. Wake up.\
  \ Having approached the excellent guides, understand. The path, the seers say, is hard to cross and\
  \ difficult to traverse, sharp as the edge of a razor."
commentary: 'The passage first maps an ascent through layers of experience: sense faculties (indriya),
  their objects (artha), mind (manas), discernment (buddhi), the great Self (mahān ātmā), the Unmanifest
  (avyakta), and Puruṣa. This is not merely a list of cosmic levels; it redirects attention from what
  is outwardly encountered toward the principle by which encountering itself becomes possible. The declaration
  that nothing lies beyond Puruṣa gives the movement its decisive end: this is kāṣṭhā, the furthest point,
  and parā gatiḥ, the supreme going or destination.


  Yet the Self is not an object displayed before the eyes. It is gūḍha, concealed in all beings, and is
  apprehended only by an agryā and sūkṣmā buddhi, a sharpened, subtle intelligence. The following instructions
  enact that refinement as a progressive gathering-in: speech into mind, mind into knowing awareness,
  that awareness into the great Self, and finally into the peaceful Self. The final imperative breaks
  the meditative sequence open into a summons: awaken, seek worthy teachers, and learn. The razor image
  preserves both urgency and sobriety; this path requires care, not spiritual bravado.


  Key Terms


  **buddhi** — Discerning intelligence: the subtle faculty capable of clear, inward seeing.

  **avyakta** — The Unmanifest: that which has not emerged into determinate appearance.

  **puruṣa** — The supreme Person or inner principle, beyond which the text posits nothing further.

  **śānta ātmā** — The peaceful Self: the still terminus into which the gathered faculties are settled.


  Cross-Tradition Resonances


  **Plato, Republic VII, Allegory of the Cave:** Plato likewise portrays education as a difficult turning
  away from appearances toward a higher reality that requires disciplined vision. Divergence: Plato''s
  ascent culminates in knowledge of the Good, whereas the Kaṭha passage describes an inward realization
  of the hidden Self and Puruṣa.

  **Bhagavad Gītā 3.42:** This verse closely parallels the sequence from senses and objects through mind
  and buddhi toward a higher principle. Divergence: The Gītā places the hierarchy in an exhortation to
  master desire and act rightly, while Kaṭha develops it as a contemplative movement toward the highest
  destination.

  **Gospel of Mark 13:37, “Watch!”:** The command to wakefulness echoes the Upaniṣad''s urgent uttiṣṭhata
  jāgrata, summoning hearers from spiritual sleep into alertness. Divergence: Mark''s vigilance is oriented
  toward faithful readiness before God and the coming fulfillment, while Kaṭha''s waking is directed toward
  realization through subtle discernment and instruction.'
practice: Sit upright for ten minutes. For the first two minutes, notice sounds without speaking; then
  let attention move from sensory impressions to the mind that names them, and from naming to the quiet
  awareness that knows them. With each exhale silently repeat, “Awake.” When thoughts pull you outward,
  do not fight them; gently gather attention back into stillness, as the verse gathers speech into mind
  and mind into the peaceful Self.
