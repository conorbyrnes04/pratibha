sanskrit_devanagari: "अग्निर् यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।  एकस् तथा सर्वभूतान्तरात्मा\
  \ रूपं रूपं प्रतिरूपो बहिश् च । \nवायुर् यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।  एकस् तथा\
  \ सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो बहिश् च । \nसूर्यो यथा सर्वलोकस्य चक्षुर् न लिप्यते चाक्षुषैर्\
  \ बाह्यदोषैः ।  एकस् तथा सर्वभूतान्तरात्मा न लिप्यते लोकदुःखेन बाह्यः । \nएको वशी सर्वभूतान्तरात्मा\
  \ एकं रूपं बहुधा यः करोति ।  तम् आत्मस्थं ये ऽनुपश्यन्ति धीरास् तेषां सुखं शाश्वतं नेतरेषाम् । \nनित्यो\
  \ ऽनित्यानां चेतनश् चेतनानाम् एको बहूनां यो विदधाति कामान् ।  तम् आत्मस्थं ये ऽनुपश्यन्ति धीरास् तेषं\
  \ शान्तिः शाश्वती नेतरेषाम् । \nतद् एतद् इति मन्यन्ते ऽनिर्देश्यं परमं सुखम् ।  कथं नु तद् विजानीयां\
  \ किम् उ भाति विभाति वा । \nन तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतो ऽयम् अग्निः ।\
  \  तम् एव भान्तम् अनु भाति सर्वं तस्य भासा सर्वम् इदं विभाति । ।"
sanskrit_iast: 'agnir yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva / ekas tathā sarvabhūtāntarātmā
  rūpaṃ rūpaṃ pratirūpo bahiś ca |

  vāyur yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva / ekas tathā sarvabhūtāntarātmā rūpaṃ
  rūpaṃ pratirūpo bahiś ca |

  sūryo yathā sarvalokasya cakṣur na lipyate cākṣuṣair bāhyadoṣaiḥ / ekas tathā sarvabhūtāntarātmā na
  lipyate lokaduḥkhena bāhyaḥ |

  eko vaśī sarvabhūtāntarātmā ekaṃ rūpaṃ bahudhā yaḥ karoti / tam ātmasthaṃ ye ''nupaśyanti dhīrās teṣāṃ
  sukhaṃ śāśvataṃ netareṣām |

  nityo ''nityānāṃ cetanaś cetanānām eko bahūnāṃ yo vidadhāti kāmān / tam ātmasthaṃ ye ''nupaśyanti dhīrās
  teṣaṃ śāntiḥ śāśvatī netareṣām |

  tad etad iti manyante ''nirdeśyaṃ paramaṃ sukham / kathaṃ nu tad vijānīyāṃ kim u bhāti vibhāti vā |

  na tatra sūryo bhāti na candratārakaṃ nemā vidyuto bhānti kuto ''yam agniḥ / tam eva bhāntam anu bhāti
  sarvaṃ tasya bhāsā sarvam idaṃ vibhāti ||'
translation_literal: Just as fire, though one, entering the world, takes a form corresponding to every
  form, so too the one Self within all beings takes a form corresponding to every form, and is also outside.
  Just as wind, though one, entering the world, takes a form corresponding to every form, so too the one
  Self within all beings takes a form corresponding to every form, and is also outside. Just as the sun,
  the eye of the whole world, is not tainted by the external defects of the eyes, so too the one Self
  within all beings, being external, is not tainted by the suffering of the world. There is one controller,
  the Self within all beings, who makes his one form manifold. The wise who perceive him as abiding in
  the Self—to them belongs eternal happiness, not to others. The eternal among the non-eternal, the conscious
  among the conscious, the one among the many, who grants their desires—the wise who perceive him as abiding
  in the Self, to them belongs eternal peace, not to others. They think 'That is this'—the indescribable
  supreme happiness. How may I know that? Does it shine or does it shine forth? There the sun does not
  shine, nor the moon and stars; these lightnings do not shine, much less this fire. Everything shines
  only after that which shines; by its light all this shines.
commentary: 'The passage deploys a cascade of natural analogies—fire, wind, sun—each penetrating all space
  while remaining singular and untouched. Agni enters every realm yet stays one; vāyu does the same; sūrya
  illuminates all worlds yet contracts no stain from the defects it reveals. The move is not metaphorical
  decoration but ontological precision: these images establish that unity and multiplicity are not opposites
  requiring reconciliation, but simultaneous facts of a single principle. The ātman (Self) operates identically—*eko
  vaśī sarvabhūtāntarātmā*, one ruler dwelling within all beings, *ekam rūpam bahudhā* making the singular
  form manifold. The passage then sharpens its cut: those *dhīrās* (the discerning, the steady ones) who
  perceive this ruler *ātmasthām* (stationed within their own self) inherit *śāśvatam sukham* (eternal
  happiness). Not the many, not the distracted. The Upaniṣad refuses to soften the teaching with promises
  of universal salvation or gradual ascent. Perception of the one ruler within requires a specific quality
  of attention—a discrimination that sees through the apparent multiplicity to the single agency that
  does not contract the world''s suffering even as it sustains it. This is the pedagogy of *śreyas* (the
  higher good) against *preyas* (the pleasant): the wise choose the harder seeing.


  Key Terms


  **eko vaśī sarvabhūtāntarātmā** — one ruler, the Self dwelling within all beings; the singular principle
  that sustains multiplicity without division

  **dhīrās** — the discerning, steady ones; those possessed of the discriminative intelligence to perceive
  the one within the many

  **śāśvatam sukham** — eternal happiness; the fruit of direct perception of the ātman, accessible only
  to those who see through multiplicity

  **ekam rūpam bahudhā** — one form made manifold; the paradox that unity generates apparent multiplicity
  without losing its singularity


  Cross-Tradition Resonances


  **Brahma Sutras 1.1.1 (Tat tvam asi principle):** Both assert a non-dual reality (Brahman/ātman) as
  the ground of all apparent multiplicity, accessible through direct realization rather than discursive
  knowledge Divergence: The Brahma Sutras systematize this insight into a philosophical framework with
  logical proofs, whereas the Katha Upaniṣad deploys natural analogies (fire, wind, sun) to evoke intuitive
  recognition rather than rational demonstration

  **Plotinus, Enneads V.1.1 (The One and the Many):** Both posit a transcendent singular principle that
  radiates or manifests multiplicity without itself being divided or diminished, and both restrict full
  knowledge to those of refined perception Divergence: Plotinus emphasizes emanation as a necessary overflow
  of the One''s abundance, while the Katha Upaniṣad stresses the ātman''s untouched sovereignty—it sustains
  desire and multiplicity without being implicated in them

  **Advaita Vedānta (Śaṅkara), distinction between śreyas and preyas:** Both texts establish that the
  path to eternal happiness requires discrimination between the higher good (śreyas) and the merely pleasant
  (preyas), rejecting universal or easy salvation Divergence: Śaṅkara develops this into a full epistemology
  of māyā and the three guṇas, while the Katha Upaniṣad leaves the metaphysics of multiplicity more open,
  focusing on the phenomenology of perception itself'
insight: The passage deploys a cascade of natural analogies—fire, wind, sun—each penetrating all space
  while remaining singular and untouched.
practice: 'When you notice yourself drawn to multiple simultaneous desires—to comfort and to growth, to
  belonging and to solitude, to what soothes and what clarifies—pause at that very moment of competing
  pulls and ask: which of these wants is *mine*, and which is the one that persists unchanged beneath
  the wanting? Then act from the one that does not shift.'
