sanskrit_devanagari: "अग्निर् यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।  एकस् तथा सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो\
  \ बहिश् च । \nवायुर् यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।  एकस् तथा सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो बहिश्\
  \ च । \nसूर्यो यथा सर्वलोकस्य चक्षुर् न लिप्यते चाक्षुषैर् बाह्यदोषैः ।  एकस् तथा सर्वभूतान्तरात्मा न लिप्यते लोकदुःखेन\
  \ बाह्यः । \nएको वशी सर्वभूतान्तरात्मा एकं रूपं बहुधा यः करोति ।  तम् आत्मस्थं ये ऽनुपश्यन्ति धीरास् तेषां सुखं शाश्वतं\
  \ नेतरेषाम् । \nनित्यो ऽनित्यानां चेतनश् चेतनानाम् एको बहूनां यो विदधाति कामान् ।  तम् आत्मस्थं ये ऽनुपश्यन्ति धीरास् तेषं\
  \ शान्तिः शाश्वती नेतरेषाम् । \nतद् एतद् इति मन्यन्ते ऽनिर्देश्यं परमं सुखम् ।  कथं नु तद् विजानीयां किम् उ भाति विभाति\
  \ वा । \nन तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतो ऽयम् अग्निः ।  तम् एव भान्तम् अनु भाति सर्वं तस्य भासा\
  \ सर्वम् इदं विभाति । ।"
