sanskrit_devanagari: 'श्रवणायापि बहुभिर् यो न लभ्यः शृण्वन्तो ऽपि बहवो यं न विद्युः ।

  आश्चर्यो वक्ता कुशलो ऽस्य लब्धा आश्चर्यो ज्ञाता कुशलानुशिष्टः ॥ ७ ॥

  न नरेणावरेण प्रोक्त एष सुविज्ञेयो बहुधा चिन्त्यमानः ।

  अनन्यप्रोक्ते गतिर् अत्र नास्त्य् अणीयान् ह्य् अतर्क्यम् अणुप्रमाणात् ॥ ८ ॥

  नैषा तर्केण मतिर् आपनेया प्रोक्तान्येनैव सुज्ञानाय प्रेष्ठ ।

  यां त्वम् आपः सत्यधृतिर् बतासि त्वादृङ् नो भूयान् नचिकेतः प्रेष्टा ॥ ९ ॥

  जानाम्य् अहं शेवधिर् इत्य् अनित्यं न ह्य् अध्रुवैः प्राप्यते हि ध्रुवं तत् ।

  ततो मया नाचिकेतश् चितो ऽग्निर् अनित्यैर् द्रव्यैः प्राप्तवान् अस्मि नित्यम् ॥ १० ॥

  कामस्य आप्तिं जगतः प्रतिष्ठां क्रतोर् अनन्त्यम् अभयस्य पारम् ।

  स्तोममहद् उरुगायं प्रतिष्ठां दृष्ट्वा धृत्या धीरो नचिकेतो ऽत्यस्राक्षीः ॥ ११ ॥'
sanskrit_iast: 'śravaṇāyāpi bahubhir yo na labhyaḥ śṛṇvanto ''pi bahavo yaṃ na vidyuḥ / āścaryo vaktā
  kuśalo ''sya labdhā āścaryo jñātā kuśalānuśiṣṭaḥ || 7 ||

  na nareṇāvareṇa prokta eṣa suvijñeyo bahudhā cintyamānaḥ / ananyaprokte gatir atra nāsty aṇīyān hy atarkyam
  aṇupramāṇāt || 8 ||

  naiṣā tarkeṇa matir āpaneyā proktānyenaiva sujñānāya preṣṭha / yāṃ tvam āpaḥ satyadhṛtir batāsi tvādṛṅ
  no bhūyān naciketaḥ preṣṭā || 9 ||

  jānāmy ahaṃ śevadhir ity anityaṃ na hy adhruvaiḥ prāpyate hi dhruvaṃ tat / tato mayā nāciketaś cito
  ''gnir anityair dravyaiḥ prāptavān asmi nityam || 10 ||

  kāmasya āptiṃ jagataḥ pratiṣṭhāṃ krator anantyam abhayasya pāram / stomamahad urugāyaṃ pratiṣṭhāṃ dṛṣṭvā
  dhṛtyā dhīro naciketo ''tyasrākṣīḥ || 11 ||'
translation_literal: 'Even to hear of this, many do not obtain the chance; and though many hear, they
  do not understand it. Wonderful is the one who can speak of it; rare is the one who obtains it. Wonderful
  is the knower when instructed by one who is truly skilled.


  When this is taught by an inferior person, it is not easily known, for it is conceived in many different
  ways. When taught by another, there is no access to it here, for it is subtler than the subtle, beyond
  the reach of reasoning.


  This understanding is not to be attained through reasoning, dear one. It is easily known only when taught
  by another [who has realized it]. You have attained it; truly you are steadfast in truth. May we have
  another questioner like you, dear Naciketas.


  I know that treasure is impermanent; truly the eternal is not attained through the non-eternal. Therefore
  I kindled the Naciketas fire with impermanent things, and have attained the eternal.


  Having seen the fulfillment of desire, the foundation of the world, the endlessness of ritual action,
  the far shore of fearlessness, the greatness of praise, the wide-extending foundation, you, wise and
  steadfast Naciketas, have renounced them.'
commentary: 'These verses make knowledge of the Self an event of rare receptivity rather than mere exposure
  to religious speech. The repeated āścarya, “wonder,” marks both the authentic teacher and the genuine
  knower as extraordinary. Hearing (śravaṇa) alone is insufficient: many hear and still do not know. The
  text also resists reducing the teaching to debate. The Self is aṇīyān, subtler than the atom or smallest
  measure, and atarkya, not available to tarka, discursive inference.


  Yet the Upaniṣad does not dismiss thought in favor of credulity. It specifies the kind of transmission
  needed: ananyaprokte, teaching spoken by one “not other” than That—one whose instruction is grounded
  in realization rather than abstraction. Yama recognizes in Naciketas satyadhṛti, a firmness rooted in
  truth. The final verses contrast the dhruva, the abiding, with impermanent possessions, rituals, status,
  acclaim, and even celestial security. Naciketas sees their grandeur clearly, but does not mistake them
  for the ultimate; with dhṛti, steady resolve, he releases them.


  Key Terms


  **āścaryaḥ** — “Wondrous” or extraordinary; the word frames authentic teaching and realization as rare
  marvels.

  **atarkyam** — “Beyond reasoning”; not irrational, but not an object exhausted by inferential thought.

  **satyadhṛtiḥ** — “Steadfast in truth”; Naciketas’ moral and existential firmness.

  **dhruvam** — “The abiding” or stable reality, contrasted with anitya, the impermanent.


  Cross-Tradition Resonances


  **Plato, Meno 80d–e:** Socrates’ paradox of inquiry shows that genuine learning cannot be treated as
  simple acquisition of information, paralleling the Upaniṣad’s distinction between hearing and truly
  knowing. Divergence: Plato develops the issue through recollection and dialectical questioning, whereas
  the Kaṭha emphasizes realized instruction and the Self beyond tarka.

  **Gospel of Matthew 13:9–16:** The saying that many hear without understanding closely echoes the Upaniṣad’s
  claim that hearing may occur without knowledge. Divergence: Matthew frames hearing in relation to receptivity
  to the kingdom and prophetic parable, while the Kaṭha concerns realization of the innermost Self.

  **Dao De Jing 56:** The line “Those who know do not speak; those who speak do not know” resonates with
  the difficulty and paradox surrounding speech about ultimate reality. Divergence: The Kaṭha still honors
  the āścarya-vaktā, the wondrous teacher able to speak effectively, rather than treating speech chiefly
  as a sign of ignorance.'
practice: 'Sit quietly for ten minutes with the question, “What in my life do I treat as lasting though
  it is impermanent?” On each exhalation, name one such object inwardly—status, possession, praise, security—and
  feel the body release its grip. End by placing a hand on the chest and silently repeating: “May I be
  steadfast in truth.”'
