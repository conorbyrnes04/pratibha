unit_label: The Openings Turn Outward
title: The Openings Turn Outward
unit_type: sutra
sanskrit_devanagari: "पराञ्चि खानि व्यतृणत् स्वयंभूस् तस्मात् पराङ् पश्यति नान्तरात्मन् ।  कश्चिद् धीरः\
  \ प्रत्यग् आत्मानम् ऐक्षद् आवृत्तचक्षुर् अमृतत्वम् इच्छन् । \nपराचः कामान् अनुयन्ति बालास् ते मृत्योर्\
  \ यन्ति विततस्य पाशम् ।  अथ धीरा अमृतत्वं विदित्वा ध्रुवम् अध्रुवेष्व् इह न प्रार्थयन्ते । \nएतद् वै\
  \ तत् । \nस्वप्नान्तं जागरितान्तं चोभौ येनानुपश्यति ।  महान्तं विभुम् आत्मानं मत्वा धीरो न शोचति । ।"
sanskrit_iast: 'parāñci khāni vyatṛṇat svayaṃbhūs tasmāt parāṅ paśyati nāntarātman / kaścid dhīraḥ pratyag
  ātmānam aikṣad āvṛttacakṣur amṛtatvam icchan |

  parācaḥ kāmān anuyanti bālās te mṛtyor yanti vitatasya pāśam / atha dhīrā amṛtatvaṃ viditvā dhruvam
  adhruveṣv iha na prārthayante |

  etad vai tat |

  svapnāntaṃ jāgaritāntaṃ cobhau yenānupaśyati / mahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati ||'
translation_literal: The Self-existent pierced the openings outward; therefore one sees outward, not the
  inner Self. Some wise person, desiring immortality, saw the Self directly, with vision turned inward.
  Fools pursue outward desires; they go into the widespread snare of death. But the wise, having known
  immortality, do not seek the permanent among impermanent things here. This verily is that. By which
  one perceives both the end of dream and the end of waking—knowing that Self as great and all-pervading,
  the wise person does not grieve.
commentary: 'The passage stages a cosmological reversal that is also a perceptual one. The Self-existent
  (svayambhū) deliberately configured the sense-openings to face outward—a design, not a flaw. This outward-turning
  is not incidental; it is the *structure* of ordinary embodied life. The consequence follows with logical
  force: one sees only the external world. But then the passage names a rare counter-movement. The dhīra—the
  steady one, the one with discrimination—does not accept this outward architecture as final. Instead,
  he reverses the vectors of perception itself (pratyag ātmānam aikṣad, turned the gaze inward). This
  is not meditation advice; it is an act of deliberate perceptual rebellion. The passage then offers a
  diagnostic: children (bālās) pursue external desires and walk into death''s noose; the wise (dhīrā),
  having *known* immortality (amṛtatvam), no longer petition for permanence among impermanent things.
  The final verse consolidates the teaching: the one who sees through both dream and waking states—who
  recognizes the continuity of consciousness across these seeming ruptures—and who grasps the Self as
  vast (mahant) and pervading (vibhu), such a one does not grieve. The move is not from outer to inner
  as mere geography, but from mistaking the *structure of perception* for reality itself to recognizing
  what persists through all perceptual states.


  Key Terms


  **svayambhū** — The Self-existent; the uncaused source that deliberately structured the outward-turning
  of the senses as the condition of ordinary embodied life.

  **pratyag ātmānam** — The inward-turned gaze; the reversal of perceptual vectors toward the Self within,
  an act of deliberate counter-movement against the designed outward architecture.

  **dhīra** — The steady one; the discriminating knower who recognizes the constructed nature of outward
  perception and performs the perceptual reversal toward immortality.

  **amṛtatvam** — Immortality or deathlessness; not mere longevity but the recognition of what persists
  unchanged through all perceptual and temporal states.


  Cross-Tradition Resonances


  **Plato, Republic 7.514–520 (Allegory of the Cave):** Both passages stage a perceptual reversal as liberation:
  prisoners must turn from shadows cast on a wall toward the light itself; the wise turn from outward
  sense-objects toward an inward or transcendent reality. Both treat ordinary perception as structurally
  misdirected rather than merely ignorant. Divergence: Plato''s reversal is gradual and painful, requiring
  ascent through multiple stages of reality; the Upaniṣadic reversal is sudden and available to the dhīra
  who simply *turns* the gaze inward, with no intermediate stages named.

  **Daoism, Zhuangzi ''Inner Chapters'' (especially the reversal of hearing and seeing):** Both traditions
  describe a reversal of sensory direction as access to deeper reality: the Daoist sage ''hears without
  ears'' and ''sees without eyes,'' turning perception inward to align with the Way; similarly, the Upaniṣadic
  wise one turns the sense-openings inward to perceive the Self. Divergence: The Daoist reversal emphasizes
  spontaneous non-action (wu wei) and the dissolution of the subject-object distinction; the Upaniṣadic
  account preserves a clear subject (the dhīra) who *deliberately* performs the reversal and thereby *knows*
  the Self as distinct from the body.

  **Augustine, Confessions 10.8 (''I went inward''):** Augustine describes turning inward (intrare in
  me ipsum) as the path to encounter God; like the Upaniṣadic sage, he rejects the outward-turned life
  of sensory pursuit as the default human condition and names inward turning as the rare counter-movement.
  Divergence: Augustine''s inward turn leads to encounter with an Other (God) who transcends the self;
  the Upaniṣadic reversal reveals the Self (ātman) as already within, not as an external presence to be
  met, and identifies it with the imperishable witness of all states.'
insight: The passage stages a cosmological reversal that is also a perceptual one.
practice: 'At the moment you notice yourself absorbed in an external pursuit—scrolling, planning, listening
  to another''s story—reverse only your attention: without closing your eyes or changing posture, let
  the sense-doors remain open but turn the knowing itself backward, asking what is aware of this very
  absorption happening. Hold this reversal for three breaths, then return outward. Repeat this inversion
  three times during the day, each time without announcement or special posture.'
