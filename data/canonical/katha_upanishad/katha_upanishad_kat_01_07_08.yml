title: The Unfed Guest Is Fire
unit_type: verse
sanskrit_devanagari: 'वैश्वानरः प्रविशति अतिथिर् ब्राह्मणो गृहान् ।

  तस्यैतां शान्तिं कुर्वन्ति हर वैवस्वतोदकम् ॥ ७ ॥

  आशाप्रतीक्षे संगतं सूनृतां च इष्टापूर्ते पुत्रपशूंश् च सर्वान् ।

  एतद् वृङ्क्ते पुरुषस्याल्पमेधसो यस्यानश्नन् वसति ब्राह्मणो गृहे ॥ ८ ॥'
sanskrit_iast: 'vaiśvānaraḥ praviśati atithir brāhmaṇo gṛhān / tasyaitāṃ śāntiṃ kurvanti hara vaivasvatodakam
  || 7 ||

  āśāpratīkṣe saṃgataṃ sūnṛtāṃ ca iṣṭāpūrte putrapaśūṃś ca sarvān / etad vṛṅkte puruṣasyālpamedhaso yasyānaśnan
  vasati brāhmaṇo gṛhe || 8 ||'
translation_literal: 'Vaiśvānara, the universal Fire, enters homes as a Brahmin guest. For his sake they
  perform this act of appeasement: “Bring water, O Vaivasvata!”


  Hope and expectation, fellowship and kindly speech, sacrifices and works of public giving, sons and
  every kind of livestock—he takes all these from the small-minded man in whose house a Brahmin remains
  unfed.'
commentary: 'The verse does not merely compare the guest to fire: it says that Vaiśvānara himself “enters”
  (praviśati) the house as an atithi, an unannounced guest, in the person of a brāhmaṇa. The response
  is śānti, a pacifying or settling rite, concretely beginning with udakam, water. Yama, addressed as
  Vaivasvata, is told to bring it; despite being lord of death, he is here placed under the urgent discipline
  of hospitality.


  Verse 8 unfolds the cost of failure in a cumulative list. Āśā and pratīkṣā—hope and expectation—are
  joined to saṃgata, social connection, and sūnṛtā, kindly or truthful speech. Then come iṣṭa and pūrta,
  sacrificial offerings and meritorious public works, followed by the basic continuities of household
  life, putra and paśu, children and cattle. The unfed guest “takes away” (vṛṅkte) these goods from the
  alpa-medhas, the person of diminished understanding: neglect of the vulnerable stranger corrodes not
  only wealth but relation, speech, aspiration, and sacred merit.


  Key Terms


  **Vaiśvānaraḥ** — The all-human or universal Fire, here present in the arriving guest.

  **atithiḥ** — A guest, literally one who arrives without a fixed date or appointed time.

  **śāntiṃ** — Appeasement, pacification, or a rite that restores a disturbed moral order.

  **alpa-medhasaḥ** — “Of little intelligence”: one lacking the discernment to recognize the guest’s sacred
  claim.


  Cross-Tradition Resonances


  **Genesis 18:1–8:** Abraham hastens to offer water, rest, and food to unexpected visitors, treating
  hospitality as a response to a concealed sacred presence. Divergence: Genesis makes the visitors bearers
  of divine revelation, whereas this passage identifies the guest himself with Vaiśvānara Fire.

  **Homer, Odyssey 14.56–58:** The Odyssey grounds care for strangers and beggars in Zeus’s protection
  of them, making hospitality a matter of reverence rather than convenience. Divergence: Homer emphasizes
  the guest-host order under Zeus, while the Kaṭha passage frames neglect as a fire-like depletion of
  the householder’s own goods.

  **Matthew 25:35–40:** Jesus makes the care of the hungry stranger an encounter with a hidden holy presence:
  what is done or withheld is done or withheld toward him. Divergence: Matthew centers final judgment
  and service to “the least,” while the Upaniṣadic verse stresses the immediate ritual and social consequences
  of leaving a Brahmin guest unfed.'
practice: 'Before eating one meal this week, pause with a cup of water. Ask: “Who might be hungry, unseen,
  or waiting at the edge of my attention?” Then make one material act of welcome that day—offer food,
  contribute to a meal program, or invite someone who is isolated to share a table.'
