sanskrit_devanagari: 'मृत्युप्रोक्तां नचिकेतो ऽथ लब्ध्वा विद्याम् एतां योगविधिं च कृत्स्नम् ।

  ब्रह्मप्राप्तो विरजो ऽभूद् विमृत्युर् अन्यो ऽप्य् एवं यो विद् अध्यात्मम् एव ॥ १८ ॥'
sanskrit_iast: mṛtyuproktāṃ naciketo 'tha labdhvā vidyām etāṃ yogavidhiṃ ca kṛtsnam / brahmaprāpto virajo
  'bhūd vimṛtyur anyo 'py evaṃ yo vid adhyātmam eva || 18 ||
translation_literal: Then Naciketas, having received this knowledge taught by Death, together with the
  whole discipline of yoga, attained Brahman. He became free of passion and free of death. So too does
  anyone else who, in this way, truly knows the Self within.
commentary: 'The verse gathers the outcome of Naciketas’ encounter with Mṛtyu, Death. What he receives
  is not merely vidyā, “knowledge,” but also kṛtsnam yogavidhim, “the entire method or discipline of yoga.”
  The teaching is therefore both insight and enactment: a truth to be understood and a way to be practiced.


  Its verbs and adjectives are decisive. Naciketas becomes brahmaprāpta, one who has attained Brahman;
  he is virajaḥ, without rajas—free from the coloring, agitation, and passion that bind consciousness;
  and vimṛtyuḥ, beyond death. The closing line deliberately opens his attainment beyond the story’s hero:
  any other person who knows adhyātmam, the Self inwardly, in this same manner may share it.


  Key Terms


  **vidyām** — Knowledge: the liberating insight received by Naciketas.

  **yogavidhim** — The method or discipline of yoga, here said to be complete (kṛtsnam).

  **virajaḥ** — Free from rajas: unstained by restless passion and mental coloring.

  **adhyātmam** — The Self in its inward dimension; knowledge directed toward one’s deepest self.


  Cross-Tradition Resonances


  **Plato, Phaedo 64a–67b:** Socrates portrays philosophy as a training that loosens the soul from bodily
  compulsions and prepares it for what death cannot take away. Divergence: Plato’s argument centers on
  the soul’s separability from the body, whereas this verse joins Brahman-attainment to knowledge of the
  inward Self and yoga’s discipline.

  **Dhammapada 21:** The Dhammapada calls heedfulness “the path to the deathless,” paralleling the Upaniṣadic
  movement from disciplined awakening to freedom from death. Divergence: Buddhist teaching generally denies
  an enduring self, while this verse explicitly makes knowledge of the adhyātman central.

  **Gospel of John 11:25–26:** Jesus’ promise that those who live in faith will not finally die echoes
  the verse’s contrast between ordinary mortality and a life that transcends death. Divergence: John frames
  deathless life through relationship with Christ and resurrection, while the Kaṭha verse frames it through
  received knowledge and yogic realization.'
practice: 'Sit upright for ten minutes with the breath natural. On each exhalation, notice one restless
  pull—hurry, irritation, craving, self-display—and silently name it “rajas.” Then return attention to
  the simple felt fact of awareness itself, asking gently: “What in me notices this movement?” End by
  carrying one less reactive response into the next ordinary conversation.'
