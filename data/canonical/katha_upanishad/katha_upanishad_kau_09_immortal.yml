sanskrit_devanagari: "यदा पञ्चावतिष्ठन्ते ज्ञानानि मनसा सह ।  बुद्धिश् च न विचेष्टति ताम् आहुः परमां गतिम् । \nतां योगम् इति\
  \ मन्यन्ते स्थिराम् इन्द्रियधारणाम् ।  अप्रमत्तस् तदा भवति योगो हि प्रभवाप्ययौ । \nनैव वाचा न मनसा प्राप्तुं शक्यो न चक्षुषा\
  \ ।  अस्तीति ब्रुवतो ऽन्यत्र कथं तद् उपलभ्यते । \nअस्तीत्य् एवोपलब्धव्यस् तत्त्वभावेन चोभयोः ।  अस्तीत्य् एवोपलब्धस्य तत्त्वभावः\
  \ प्रसीदति । \nयदा सर्वे प्रमुच्यन्ते कामा ये ऽस्य हृदि श्रिताः ।  अथ मर्त्यो ऽमृतो भवत्य् अत्र ब्रह्म समश्नुते । \nयदा\
  \ सर्वे प्रभिद्यन्ते हृदयस्येह ग्रन्थयः ।  अथ मर्त्यो ऽमृतो भवत्य् एतावद् ध्य् अनुशासनम् । \nशतं चैका च हृदयस्य नाड्यस्\
  \ तासां मूर्धानम् अभिनिःसृतैका ।  तयोर्ध्वम् आयन्न् अमृतत्वम् एति विष्वङ्ङ् अन्या उत्क्रमणे भवति । \nअङ्गुष्ठमात्रः पुरुषो\
  \ ऽन्तरात्मा सदा जनानां हृदये संनिविष्टः ।  तं स्वाच् छरीरात् प्रवृहेन् मुञ्जाद् इवेषीकां धैर्येण ।  तं विद्याच् छुक्रम्\
  \ अमृतं तं विद्याच् छुक्रम् अमृतम् इति । ।"
sanskrit_iast: 'yadā pañcāvatiṣṭhante jñānāni manasā saha / buddhiś ca na viceṣṭati tām āhuḥ paramāṃ gatim |

  tāṃ yogam iti manyante sthirām indriyadhāraṇām / apramattas tadā bhavati yogo hi prabhavāpyayau |

  naiva vācā na manasā prāptuṃ śakyo na cakṣuṣā / astīti bruvato ''nyatra kathaṃ tad upalabhyate |

  astīty evopalabdhavyas tattvabhāvena cobhayoḥ / astīty evopalabdhasya tattvabhāvaḥ prasīdati |

  yadā sarve pramucyante kāmā ye ''sya hṛdi śritāḥ / atha martyo ''mṛto bhavaty atra brahma samaśnute |

  yadā sarve prabhidyante hṛdayasyeha granthayaḥ / atha martyo ''mṛto bhavaty etāvad dhy anuśāsanam |

  śataṃ caikā ca hṛdayasya nāḍyas tāsāṃ mūrdhānam abhiniḥsṛtaikā / tayordhvam āyann amṛtatvam eti viṣvaṅṅ anyā utkramaṇe bhavati
  |

  aṅguṣṭhamātraḥ puruṣo ''ntarātmā sadā janānāṃ hṛdaye saṃniviṣṭaḥ / taṃ svāc charīrāt pravṛhen muñjād iveṣīkāṃ dhairyeṇa
  / taṃ vidyāc chukram amṛtaṃ taṃ vidyāc chukram amṛtam iti ||'
translation_literal: When all desires that dwell in the heart cease, then the mortal becomes immortal, and obtains Brahman.
  When all the ties of the heart are severed here on earth, then the mortal becomes immortal— this much alone is the teaching.
commentary: 'The passage enacts a precise inversion: it does not promise a reward for renunciation but rather identifies the
  cessation of desire as the *condition* under which a different order of being becomes visible. Yama moves through three
  nested claims. First, when the five sense-knowledges (pañcāvatiṣṭhante) stand still together with mind, and intellect (buddhi)
  ceases to move—this stillness is yoga, not as achievement but as the natural arrest of the sensory apparatus. Second, this
  state cannot be reached by speech, mind, or eye; it can only be known by the declaration "it is" (asti), a paradoxical utterance
  that grasps the Real by affirming its existence while negating all conceptual approach. The knower who holds "it is" in
  this way finds the truth-nature (tattva-bhāva) of both knowledge and ignorance resolving into one. Third, and most radically:
  when *all* desires (kāmā) that shelter in the heart are released—not suppressed, but genuinely freed—the mortal becomes
  immortal and "touches" (samashṇute) Brahman. The passage refuses to make desire-cessation a heroic achievement or a future
  prize. Instead it identifies the heart-knots (hṛdaya-granthī) as the actual architecture of bondage; their severance is
  not a moral victory but a recognition that what bound the self was never real. The teaching does not console; it discriminates.
  It asks: do you cling to the knots, or do you see them as already dissolved?


  Key Terms


  **hṛdaya-granthī** — heart-knots; the structural bonds of desire and ignorance that constitute the architecture of bondage,
  whose severance reveals their illusory nature rather than achieving a moral victory

  **kāmā** — desires; not merely to be suppressed but genuinely freed or released (visṛjyante), the cessation of which is
  the condition—not reward—for the shift from mortal to immortal being

  **tattva-bhāva** — truth-nature; the non-dual resolution in which knowledge (vidyā) and ignorance (avidyā) collapse into
  a single ground, accessible only through the paradoxical utterance ''it is'' (asti)

  **yoga** — not achievement or practice but the natural arrest (sthiti) of the sensory apparatus and intellect when all five
  sense-knowledges stand still together with mind


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.55–56 (sthita-prajña):** Both passages identify a state of non-reactivity to desire (kāma) and sense-objects
  as the mark of liberation; the Gītā''s ''steady-minded'' (sthita-prajña) person withdraws desire as the tortoise withdraws
  its limbs, paralleling the Katha''s cessation of heart-knots Divergence: The Gītā frames this as an ethical achievement
  within action (karma-yoga), whereas Katha refuses the language of achievement and presents desire-cessation as recognition
  of what was never real

  **Advaita Vedānta (Śaṅkara on Brahma Sūtra 1.1.1): tat tvam asi:** Both traditions use a paradoxical utterance (''it is''
  / ''thou art'') to grasp the Real by affirming identity while negating conceptual mediation; both dissolve knowledge and
  ignorance into non-duality Divergence: Śaṅkara systematizes this as the fruit of discriminative knowledge (viveka) through
  textual study, while Katha presents it as a spontaneous recognition arising when the heart-knots are seen through, requiring
  no prior learning

  **Samyutta Nikāya 22.26 (Pāli Buddhism, anattā doctrine):** Both refuse to make liberation a future state or moral prize;
  both identify bondage as structural (skandhas / hṛdaya-granthī) and liberation as the recognition that the binding was illusory
  Divergence: Buddhism denies a permanent ātman altogether, whereas Katha posits Brahman as the immortal Self revealed when
  the knots dissolve; the Upanishad asks ''do you see the knots as dissolved?'' while Buddhism asks ''do you see the self
  as never having existed?'''
insight: 'The passage enacts a precise inversion: it does not promise a reward for renunciation but rather identifies the
  cessation of desire as the *condition* under which a different order of being becomes visible.'
practice: 'In the moment a desire arises—for comfort, approval, completion—trace it backward into the chest and name the specific
  knot it tightens: Is this the knot of safety, belonging, significance, or control? Do not fight it or renounce it; simply
  hold the question "What would it be like if this were already untied?" and notice what shifts in the body''s holding when
  you ask.'
