sanskrit_devanagari: 'ऊर्ध्वमूलो अवाक्शाख एषो ऽश्वत्थः सनातनः ।

  तद् एव शुक्रं तद् ब्रह्म तद् एवामृतम् उच्यते ।

  तस्मिंल् लोकाः श्रिताः सर्वे तद् उ नात्येति कश्चन ॥ १ ॥

  यद् इदं किंच जगत् सर्वं प्राण एजति निःसृतम् ।

  महद् भयं वज्रम् उद्यतं य एतद् विदुर् अमृतास् ते भवन्ति ॥ २ ॥

  भयाद् अस्याग्निस् तपति भयात् तपति सूर्यः ।

  भयाद् इन्द्रश् च वायुश् च मृत्युर् धावति पञ्चमः ॥ ३ ॥

  इह चेद् अशकद् बोद्धुं प्राक्शरीरस्य विस्रसः ।

  ततः सर्गेषु लोकेषु शरीरत्वाय कल्पते ॥ ४ ॥

  यथादर्शे तथात्मनि यथा स्वप्ने तथा पितृलोके ।

  यथाप्सु परीव ददृशे तथा गन्धर्वलोके छायातपयोर् इव ब्रह्मलोके ॥ ५ ॥'
sanskrit_iast: 'ūrdhvamūlo avākśākha eṣo ''śvatthaḥ sanātanaḥ / tad eva śukraṃ tad brahma tad evāmṛtam
  ucyate / tasmiṃl lokāḥ śritāḥ sarve tad u nātyeti kaścana || 1 ||

  yad idaṃ kiṃca jagat sarvaṃ prāṇa ejati niḥsṛtam / mahad bhayaṃ vajram udyataṃ ya etad vidur amṛtās
  te bhavanti || 2 ||

  bhayād asyāgnis tapati bhayāt tapati sūryaḥ / bhayād indraś ca vāyuś ca mṛtyur dhāvati pañcamaḥ || 3
  ||

  iha ced aśakad boddhuṃ prākśarīrasya visrasaḥ / tataḥ sargeṣu lokeṣu śarīratvāya kalpate || 4 ||

  yathādarśe tathātmani yathā svapne tathā pitṛloke / yathāpsu parīva dadṛśe tathā gandharvaloke chāyātapayor
  iva brahmaloke || 5 ||'
translation_literal: '1. This everlasting aśvattha tree has its root above and its branches below. That
  indeed is the radiant; that is brahman; that alone is called the deathless. Upon it all the worlds depend;
  none whatsoever passes beyond it.


  2. Whatever whole universe is here moves forth, having issued from prāṇa. It is a great terror, like
  an uplifted thunderbolt. Those who know this become deathless.


  3. From fear of it, fire burns; from fear, the sun gives heat. From fear of it, Indra and Vāyu act;
  Death runs as the fifth.


  4. If one has been able to know it here, before the breaking apart of the body, then one is fit for
  embodiment in the worlds of creation.


  5. As in a mirror, so in oneself; as in a dream, so in the world of the ancestors; as something seen
  waveringly in water, so in the world of the gandharvas; as the distinction of shadow and light, so in
  the world of Brahmā.'
commentary: 'The passage opens with the startling image of an aśvattha, a sacred fig tree, whose mūla,
  “root,” is ūrdhva, “above,” while its śākhās, “branches,” reach downward. The image reverses ordinary
  orientation: the visible, manifold world is dependent growth, while its unseen source is higher and
  prior. The text identifies that source through a sequence of emphatic declarations: tad eva śukram,
  “that alone is radiant”; tad brahma, “that is brahman”; tad evāmṛtam, “that alone is called deathless.”
  All worlds are śritāḥ, resting upon or sheltered in it, and nothing goes beyond it.


  The next verses give this source a formidable aspect. The world moves as niḥsṛtam, having flowed forth
  from prāṇa, vital breath or living power; yet this power is also mahad bhayam, a “great awe” or dread,
  compared to a vajra raised to strike. Fire, sun, Indra, wind, and even Death are not independent agents:
  each performs its proper work “from fear” of this reality. The word bhaya does not merely depict panic;
  it names the reverent constraint by which a cosmos retains order.


  The teaching then becomes urgent and epistemic. One must boddhuṃ, know or awaken to this, iha, “here,”
  before bodily dissolution. The final verse offers a graded series of perceptions: the Self is most directly
  known in oneself, like an image in a mirror; other modes of awareness are dreamlike, wavering like a
  reflection in water, or sharply differentiated as light from shadow. The comparisons do not dismiss
  other worlds so much as measure varying clarity of realization.


  Key Terms


  **aśvatthaḥ** — The sacred fig tree, here portrayed as the dependent, branching structure of manifested
  existence.

  **brahma** — The supreme reality named as radiant, foundational, and deathless.

  **prāṇa** — Breath, life-force, or animating power from which the moving world issues.

  **bhayāt** — “From fear” or awe; the refrain expressing the cosmic discipline governing gods and Death.


  Cross-Tradition Resonances


  **Bhagavad Gītā 15.1–3:** The Gītā likewise depicts an aśvattha with roots above and branches below,
  using the tree to portray conditioned worldly existence rooted in a higher source. Divergence: The Gītā
  develops the image toward detachment and cutting down attachment, whereas this passage chiefly identifies
  the tree’s transcendent root with brahman and the deathless.

  **Plato, Timaeus 47a–47e:** Plato presents the ordered motions of heaven as intelligible patterns that
  can re-order human understanding, much as the Upaniṣad presents sun, fire, wind, and Death as operating
  under a supreme order. Divergence: Plato’s account is framed through cosmic reason and the craftsman-like
  Demiurge, while the Upaniṣad speaks of brahman as the all-surpassing reality before which the gods stand
  in awe.

  **Qur’an 24:35, the “Light Verse”:** The Qur’anic image of divine light evokes a reality by which illumination
  itself becomes intelligible, comparable to the Upaniṣad’s naming of brahman as śukra, radiant or shining.
  Divergence: The Qur’an preserves a decisive Creator-creature distinction, whereas this Upaniṣadic passage
  presses toward realization of the ultimate within oneself.'
practice: 'Stand barefoot or seated upright beneath a tree, or simply visualize one. With each inhalation,
  sense the body as a branch receiving life from an unseen root above; with each exhalation, relax the
  need to control. Then sit quietly for five minutes and ask: “What remains present before every changing
  thought, sensation, and fear?”'
