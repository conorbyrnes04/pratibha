sanskrit_devanagari: 'य इमं मध्वदं वेद आत्मानं जीवम् अन्तिकात् ।

  ईशानं भूतभव्यस्य न ततो विजुगुप्सते ॥ ५ ॥

  यः पूर्वं तपसो जातम् अद्भ्यः पूर्वम् अजायत ।

  गुहां प्रविश्य तिष्ठन्तं यो भूतेभिर् व्यपश्यत ॥ ६ ॥

  या प्राणेन संभवति अदितिर् देवतामयी ।

  गुहां प्रविश्य तिष्ठन्तीं या भूतेभिर् व्यजायत ॥ ७ ॥

  अरण्योर् निहितो जातवेदा गर्भ इव सुभृतो गर्भिणीभिः ।

  दिवेदिव ईड्यो जागृवद्भिर् हविष्मद्भिर् मनुष्येभिर् अग्निः ॥ ८ ॥

  यतश् चोदेति सूर्यो अस्तं यत्र च गच्छति ।

  तं देवाः सर्वे अर्पितास् तद् उ नात्येति कश्चन ॥ ९ ॥'
sanskrit_iast: 'ya imaṃ madhvadaṃ veda ātmānaṃ jīvam antikāt / īśānaṃ bhūtabhavyasya na tato vijugupsate
  || 5 ||

  yaḥ pūrvaṃ tapaso jātam adbhyaḥ pūrvam ajāyata / guhāṃ praviśya tiṣṭhantaṃ yo bhūtebhir vyapaśyata ||
  6 ||

  yā prāṇena saṃbhavati aditir devatāmayī / guhāṃ praviśya tiṣṭhantīṃ yā bhūtebhir vyajāyata || 7 ||

  araṇyor nihito jātavedā garbha iva subhṛto garbhiṇībhiḥ / divediva īḍyo jāgṛvadbhir haviṣmadbhir manuṣyebhir
  agniḥ || 8 ||

  yataś codeti sūryo astaṃ yatra ca gacchati / taṃ devāḥ sarve arpitās tad u nātyeti kaścana || 9 ||'
translation_literal: '5. Whoever knows this living Self, the eater of sweetness, close at hand, the lord
  of what has been and what will be—such a one recoils from nothing.


  6. Whoever beholds the One born first from fervor, brought forth before the waters, entering the hidden
  cave and abiding there, perceived among beings—


  7. She who arises with the breath, Aditi, filled with divinity, who has entered the cave and remains
  there, who was born together with the beings—


  8. Agni, Jātavedas, is lodged within the two fire-sticks, as an embryo is carefully held by pregnant
  women. Day after day he is worthy of praise by wakeful human beings who bear the offering.


  9. From whom the sun rises, and into whom it sets: upon that One all the gods are fastened. No one ever
  passes beyond That.'
commentary: 'The passage gathers several images around an inwardly present reality. Verse 5 calls the
  ātman both jīva, “living,” and madhvadam, “eater of sweetness”; it is not a remote abstraction but the
  one who tastes the fruits of lived existence. Yet it is also īśāna, ruler of past and future. To know
  this Self “from nearby” (antikāt) is to lose the impulse of vijugupsā, recoil, aversion, or self-disgust:
  reality is no longer encountered as something alien to be rejected.


  The following verses unfold this presence through cosmological and ritual language. What is primordial
  enters the guhā, the hidden cavity or heart-cave, and abides among beings. Aditi appears as devatāmayī,
  “made of divinity” or “pervaded by deities,” arising with prāṇa, breath. Agni then gives the teaching
  a tactile ritual form: latent in the araṇis, the two fire-sticks, he is like an embryo protected in
  a womb. The final verse widens the vision: even the sun’s rising and setting occur in dependence upon
  the One in whom all gods are arpitāḥ, set down or grounded.


  Key Terms


  **ātman** — The Self: the intimate reality known as living, near, and sovereign.

  **guhā** — The hidden “cave,” conventionally the inward chamber of the heart.

  **Aditi** — The boundless motherly divine power, here arising with breath and dwelling within.

  **Jātavedā** — “Knower of births,” an epithet of Agni as the fire aware of all generated beings.


  Cross-Tradition Resonances


  **Heraclitus, Fragment B30:** Heraclitus describes an ever-living fire kindling and being quenched in
  measure, akin to the Upaniṣad’s Agni as a concealed but continually honored power. Divergence: Heraclitus
  frames fire as the cosmic order itself, whereas this passage places Agni within a larger inward and
  transcendent ground.

  **Plato, Republic VI, 508b–509c:** Plato’s Good stands behind the sun’s power to make things visible,
  as the One here is that from which the sun rises and into which it sets. Divergence: Plato develops
  an epistemic and metaphysical analogy, while the Kaṭha verse speaks in devotional-cosmological terms
  of divine dependence.

  **Acts 17:28:** Paul’s declaration, “In him we live and move and have our being,” parallels the sense
  that beings and even gods rest upon a sustaining ultimate reality. Divergence: Acts identifies this
  ground with the personal creator God, while the Upaniṣadic language moves through Self, breath, Aditi,
  and fire without fixing one exclusive personal formulation.'
practice: 'At dawn or sunset, sit upright for seven minutes. Feel the breath in the chest as prāṇa; with
  each inhale silently say “near,” and with each exhale “abiding.” Then notice one warmth in the body
  and imagine it as Agni sheltered in the araṇis. End by looking at the light outside and recalling: its
  appearing and vanishing, too, rest in a deeper ground.'
