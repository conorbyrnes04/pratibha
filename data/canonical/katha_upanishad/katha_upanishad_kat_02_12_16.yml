sanskrit_devanagari: 'तं दुर्दर्शं गूढम् अनुप्रविष्टं गुहाहितं गह्वरेष्ठं पुराणम् ।

  अध्यात्मयोगाधिगमेन देवं मत्वा धीरो हर्षशोकौ जहाति ॥ १२ ॥

  एतच् छ्रुत्वा संपरिगृह्य मर्त्यः प्रवृह्य धर्म्यम् अणुम् एतम् आप्य ।

  स मोदते मोदनीयं हि लब्ध्वा विवृतं सद्म नचिकेतसं मन्ये ॥ १३ ॥

  अन्यत्र धर्माद् अन्यत्राधर्माद् अन्यत्रास्मात् कृताकृतात् ।

  अन्यत्र भूताच् च भव्याच् च यत् तत् पश्यसि तद् वद ॥ १४ ॥

  सर्वे वेदा यत् पदम् आमनन्ति तपांसि सर्वाणि च यद् वदन्ति ।

  यद् इच्छन्तो ब्रह्मचर्यं चरन्ति तत् ते पदं संग्रहेण ब्रवीमि ॥ १५ ॥

  एतद् ध्य् एवाक्षरं ब्रह्म एतद् ध्य् एवाक्षरं परम् ।

  एतद् ध्य् एवाक्षरं ज्ञात्वा यो यद् इच्छति तस्य तत् ॥ १६ ॥'
sanskrit_iast: 'taṃ durdarśaṃ gūḍham anupraviṣṭaṃ guhāhitaṃ gahvareṣṭhaṃ purāṇam / adhyātmayogādhigamena
  devaṃ matvā dhīro harṣaśokau jahāti || 12 ||

  etac chrutvā saṃparigṛhya martyaḥ pravṛhya dharmyam aṇum etam āpya / sa modate modanīyaṃ hi labdhvā
  vivṛtaṃ sadma naciketasaṃ manye || 13 ||

  anyatra dharmād anyatrādharmād anyatrāsmāt kṛtākṛtāt / anyatra bhūtāc ca bhavyāc ca yat tat paśyasi
  tad vada || 14 ||

  sarve vedā yat padam āmananti tapāṃsi sarvāṇi ca yad vadanti / yad icchanto brahmacaryaṃ caranti tat
  te padaṃ saṃgraheṇa bravīmi || 15 ||

  etad dhy evākṣaraṃ brahma etad dhy evākṣaraṃ param / etad dhy evākṣaraṃ jñātvā yo yad icchati tasya
  tat || 16 ||'
translation_literal: '12. The steadfast one, knowing as divine that which is hard to behold—hidden, entered
  within, lodged in the secret place, abiding in the depth, ancient—through realization by the yoga of
  the self, abandons both elation and grief.


  13. Hearing this, taking it fully to heart, and drawing forth this subtle, dharmic reality, the mortal
  attains it. Having gained what truly gives joy, he rejoices. I consider Naciketas’ dwelling-place to
  be opened wide.


  14. “Tell me of that which you see as other than dharma and other than adharma, other than what has
  been done and not done, other than what has been and what will be.”


  15. “I shall tell you briefly of the goal that all the Vedas proclaim, that all austerities declare,
  and for whose sake people undertake brahmacarya.


  16. This very imperishable is Brahman; this very imperishable is the Supreme. Knowing this very imperishable,
  whatever one desires—one attains that.”'
commentary: 'Verse 12 gathers a sequence of paradoxical descriptions around the object of knowledge: it
  is durdarśa, “hard to see,” yet anupraviṣṭa, “entered within”; it is gūḍha, hidden, yet guhāhita, placed
  in the guhā, the inward cave or secret chamber. The verse does not recommend escape from embodiment
  so much as a penetrative inward recognition, adhyātmayogādhigama, attainment through the yoga directed
  toward the self. The dhīra, the steady and discerning person, sees this presence as deva, the radiant
  or divine reality, and thereby relinquishes the paired disturbances of harṣa and śoka, exhilaration
  and sorrow.


  In verse 13 Yama recognizes Naciketas as one capable of receiving this teaching: the “mortal” who hears,
  embraces, and draws forth the subtle dharmic reality reaches a joy worthy of rejoicing in. The opened
  sadman, “dwelling” or “abode,” suggests that Naciketas has become inwardly ready for the teaching. His
  next question refuses every ordinary classificatory frame: dharma/adharma, deed/non-deed, past/future.
  Yama answers by naming the sought reality akṣara, the imperishable: the goal voiced by Vedas, austerities,
  and brahmacarya. Its final promise is not merely that it grants passing objects of desire, but that
  knowing the ultimate itself brings fulfillment to desire at its root.


  Key Terms


  **guhāhita** — “Placed in the cave”: situated in the inward, hidden center.

  **adhyātmayoga** — Yoga directed toward the self; the inward discipline by which realization is gained.

  **dhīra** — The steady, lucid person who can discern and endure.

  **akṣara** — The imperishable, literally that which does not decay or pass away.


  Cross-Tradition Resonances


  **Plato, Republic VII, Allegory of the Cave:** Both texts portray ordinary seeing as inadequate and
  require a difficult turn toward a more fundamental reality. Divergence: Plato’s ascent moves from a
  physical cave toward intelligible forms, while the Kaṭha locates the hidden reality within the inward
  “cave.”

  **Gospel of Luke 17:21:** The saying that God’s kingdom is “among you” or “within you” resonates with
  the Upaniṣadic insistence on a hidden, inwardly accessible divine reality. Divergence: Luke speaks within
  an eschatological and communal proclamation of God’s reign, whereas the Kaṭha frames realization through
  knowledge of the imperishable Self.

  **Dhammapada 277–279:** The Buddhist verses direct insight toward what lies beyond conditioned phenomena,
  including the recognition of impermanence and non-self. Divergence: The Kaṭha identifies akṣara as an
  imperishable Brahman, while the Dhammapada’s analysis denies any permanent self in conditioned experience.'
practice: Sit quietly for ten minutes with the spine upright. Let each in-breath silently ask, “What is
  here before past and future?” and each out-breath release one named pleasure or sorrow without suppressing
  it. At the end, write one sentence distinguishing the changing feeling from the awareness in which it
  appeared.
