sanskrit_devanagari: 'यथोदकं शुद्धे शुद्धम् आसिक्तं तादृग् एव भवति ।

  एवं मुनेर् विजानत आत्मा भवति गौतम ॥ १५ ॥'
sanskrit_iast: yathodakaṃ śuddhe śuddham āsiktaṃ tādṛg eva bhavati / evaṃ muner vijānata ātmā bhavati
  gautama || 15 ||
translation_literal: Just as pure water, poured into pure water, becomes exactly like it, so does the
  Self become for the sage who truly knows, O Gautama.
commentary: 'The verse offers no abstract definition of liberation; it gives an image. Water (udakam)
  that is śuddham, “pure,” is poured (āsiktam) into water that is likewise śuddhe, “pure.” Nothing alien
  remains by which the poured water could be distinguished. It becomes tādṛg eva—precisely of that same
  kind.


  The comparison is then applied to the muni, the inwardly reflective sage, who is vijānataḥ, one who
  knows discerningly. The phrase ātmā bhavati can sound startling: the Self “becomes.” The image does
  not necessarily suggest that an individual self is manufactured anew, but that, in knowing, its apparent
  separateness and impurity cease to define it. Addressing Naciketas as Gautama, Yama lets the homely
  action of mingling water disclose a condition without division.


  Key Terms


  **udakam** — water; the concrete substance through which the verse imagines undivided likeness.

  **śuddham** — pure, cleansed; repeated to stress that no contaminating difference is introduced.

  **āsiktam** — poured into or sprinkled; the participle depicting water entering water.

  **vijānataḥ** — of one who knows distinctly or fully; the sage’s knowledge is discerning realization,
  not mere information.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.10.1–3, the rivers entering the ocean:** That passage likewise uses waters losing
  their separate names and forms to evoke a deeper unity of being. Divergence: The Chāndogya image concerns
  rivers and the ocean across a larger cosmological frame, whereas this verse concentrates on the immediate
  equivalence of pure water with pure water.

  **Plotinus, Enneads VI.9.10–11:** Plotinus describes union with the One as a state in which the knower
  no longer stands apart from what is known. Divergence: Plotinus frames this in terms of ascent to the
  transcendent One, while the Kaṭha verse speaks tersely of ātman through the image of purity and mixture.

  **Meister Eckhart, Sermon 2 (on the “spark” of the soul):** Eckhart’s preaching can portray the deepest
  ground of the soul as free of creaturely distinction in its relation to God. Divergence: Eckhart’s account
  remains shaped by Christian language of God, creation, and grace; the Kaṭha verse does not invoke a
  creator or a grace-bestowing deity here.'
practice: Place two clear bowls of water side by side. Slowly pour one into the other, watching the boundary
  vanish; then sit for five minutes and notice each time the mind says “me” and “not me,” returning attention
  to the simple, undivided sensation of breathing.
