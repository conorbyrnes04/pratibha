sanskrit_devanagari: 'इन्द्रियाणां पृथग्भावम् उदयास्तमयौ च यत् ।

  पृथग् उत्पद्यमानानां मत्वा धीरो न शोचति ॥ ६ ॥

  इन्द्रियेभ्यः परं मनो मनसः सत्त्वम् उत्तमम् ।

  सत्त्वाद् अधि महानात्मा महतो ऽव्यक्तम् उत्तमम् ॥ ७ ॥

  अव्यक्तात् तु परः पुरुषो व्यापको ऽलिङ्ग एव च ।

  यं ज्ञात्वा मुच्यते जन्तुर् अमृतत्वं च गच्छति ॥ ८ ॥

  न संदृशे तिष्ठति रूपम् अस्य न चक्षुषा पश्यति कश्चनैनम् ।

  हृदा मनीषा मनसाभिकॢप्तो य एतद् विदुर् अमृतास् ते भवन्ति ॥ ९ ॥'
sanskrit_iast: 'indriyāṇāṃ pṛthagbhāvam udayāstamayau ca yat / pṛthag utpadyamānānāṃ matvā dhīro na śocati
  || 6 ||

  indriyebhyaḥ paraṃ mano manasaḥ sattvam uttamam / sattvād adhi mahānātmā mahato ''vyaktam uttamam ||
  7 ||

  avyaktāt tu paraḥ puruṣo vyāpako ''liṅga eva ca / yaṃ jñātvā mucyate jantur amṛtatvaṃ ca gacchati ||
  8 ||

  na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaścanainam / hṛdā manīṣā manasābhikḷpto ya etad vidur
  amṛtās te bhavanti || 9 ||'
translation_literal: 'When the steadfast one has understood the senses as separate—their arising and their
  setting, each coming to be distinctly—he does not grieve.


  Beyond the senses is mind; beyond mind is sattva, the lucid faculty. Beyond sattva is the great Self;
  beyond the great is the Unmanifest.


  But beyond the Unmanifest is the Person: all-pervading and without distinguishing mark. Knowing him,
  the living being is freed and comes to deathlessness.


  His form does not stand before the gaze; no one sees him with the eye. Apprehended through the heart,
  through discerning insight, through the mind: those who know this become deathless.'
commentary: 'The first verse begins with differentiation: the senses have pṛthagbhāva, a separate or distinct
  condition. They arise and set, and their particular manifestations come into being independently. The
  dhīra, the steady and discerning person, sees this flux without mistaking it for the whole of the self;
  therefore such a person does not grieve. Grief is not denied, but its root in identification with perishing
  powers is loosened.


  The following verses trace an ascent through layers of experience and principle: senses, mind, sattva,
  the great Self, and the avyakta, the Unmanifest. Yet even this unmanifest source is not ultimate: beyond
  it stands puruṣa, pervasive and aliṅga, bearing no visible sign or defining feature. The final verse
  insists that this reality is not an object for the eyes. It is to be apprehended inwardly—hṛdā, manīṣā,
  manasā—through heart, penetrating intelligence, and mind brought to clarity. This knowing is not mere
  information; it is the knowledge by which the embodied being is released.


  Key Terms


  **dhīra** — The steadfast, discerning person who can see change without being overwhelmed by it.

  **sattvam** — Here, the lucid inner faculty of understanding, finer than the ordinary mind.

  **avyaktam** — The Unmanifest: that which is not outwardly differentiated or perceptible.

  **puruṣaḥ** — The all-pervading Person or indwelling reality, beyond every visible mark.


  Cross-Tradition Resonances


  **Plato, Republic 509d–511e:** Plato’s ascent from visible things toward intelligible reality parallels
  this passage’s movement beyond sensory experience toward a higher principle of knowing. Divergence:
  Plato’s summit is the Good as the source of intelligibility, whereas this passage speaks of an all-pervading
  puruṣa whose knowledge brings liberation and deathlessness.

  **Plotinus, Enneads VI.9.11:** Plotinus describes a turning away from sensory multiplicity toward a
  reality that exceeds ordinary vision, much like the Upaniṣad’s insistence that the ultimate is not seen
  by the eye. Divergence: Plotinus frames the ascent through the soul’s union with the One, while the
  Kaṭha’s sequence culminates in puruṣa beyond the Unmanifest.

  **Gospel of John 1:18:** John’s declaration that no one has seen God recalls the claim that no one sees
  this reality with the eyes. Divergence: John grounds unseen divinity in the revelation of God through
  the Son, while the Upaniṣad emphasizes inward apprehension through heart, insight, and mind.'
practice: Sit quietly for ten minutes. Notice sounds, bodily sensations, images, and thoughts as separate
  events that arise and fade. After each one, silently say, “This appears; this passes.” Then rest attention
  in the felt space of the heart, not trying to picture the ultimate, but releasing the demand to see
  it as an object.
