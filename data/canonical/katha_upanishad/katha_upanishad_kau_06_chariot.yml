sanskrit_devanagari: "ऋतं पिबन्तौ सुकृतस्य लोके गुहां प्रविष्टौ परमे परार्धे ।  छायातपौ ब्रह्मविदो वदन्ति पञ्चाग्नयो ये च\
  \ त्रिणाचिकेताः । \nयः सेतुर् ईजानानाम् अक्षरं ब्रह्म यत् परम् ।  अभयं तितीर्षतां पारं नाचिकेतं शकेमहि । \nआत्मानं रथिनं\
  \ विद्धि शरीरं रथम् एव तु ।  बुद्धिं तु सारथिं विद्धि मनः प्रग्रहम् एव च । \nइन्द्रियाणि हयान् आहुर् विषयांस् तेषु गोचरान्\
  \ ।  आत्मेन्द्रियमनोयुक्तं भोक्तेत्य् आहुर् मनीषिणः । \nयस् त्व् अविज्ञानवान् भवत्य् अयुक्तेन मनसा सदा ।  तस्येन्द्रियाण्य्\
  \ अवश्यानि दुष्टाश्वा इव सारथेः । \nयस् तु विज्ञानवान् भवति युक्तेन मनसा सदा ।  तस्येन्द्रियाणि वश्यानि सदश्वा इव सारथेः\
  \ । \nयस् त्व् अविज्ञानवान् भवत्य् अमनस्कः सदाशुचिः ।  न स तत् पदम् आप्नोति संसारं चाधिगच्छति । \nयस् तु विज्ञानवान् भवति\
  \ समनस्कः सदा शुचिः ।  स तु तत् पदम् आप्नोति यस्माद् भूयो न जायते । \nविज्ञानसारथिर् यस् तु मनः प्रग्रहवान् नरः ।  सो ऽध्वनः\
  \ पारम् आप्नोति तद् विष्णोः परमं पदम् । ।"
sanskrit_iast: 'ṛtaṃ pibantau sukṛtasya loke guhāṃ praviṣṭau parame parārdhe / chāyātapau brahmavido vadanti pañcāgnayo ye
  ca triṇāciketāḥ |

  yaḥ setur ījānānām akṣaraṃ brahma yat param / abhayaṃ titīrṣatāṃ pāraṃ nāciketaṃ śakemahi |

  ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu / buddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca |

  indriyāṇi hayān āhur viṣayāṃs teṣu gocarān / ātmendriyamanoyuktaṃ bhoktety āhur manīṣiṇaḥ |

  yas tv avijñānavān bhavaty ayuktena manasā sadā / tasyendriyāṇy avaśyāni duṣṭāśvā iva sāratheḥ |

  yas tu vijñānavān bhavati yuktena manasā sadā / tasyendriyāṇi vaśyāni sadaśvā iva sāratheḥ |

  yas tv avijñānavān bhavaty amanaskaḥ sadāśuciḥ / na sa tat padam āpnoti saṃsāraṃ cādhigacchati |

  yas tu vijñānavān bhavati samanaskaḥ sadā śuciḥ / sa tu tat padam āpnoti yasmād bhūyo na jāyate |

  vijñānasārathir yas tu manaḥ pragrahavān naraḥ / so ''dhvanaḥ pāram āpnoti tad viṣṇoḥ paramaṃ padam ||'
translation_literal: Know the Self as the lord of the chariot, the body as the chariot itself, the intellect as the charioteer,
  and the mind as the reins. The senses they call the horses, the objects of the senses their roads. When the Self is joined
  with body, senses, and mind, then wise people call him the enjoyer.
commentary: 'The chariot image does not console—it anatomizes. Yama refuses Naciketas the escape of metaphor-as-ornament and
  instead deploys it as a precision tool for discrimination. The Self (ātman) is not the chariot, not the body, not even the
  mind that seems to command; it is the *lord* of the chariot, the immobile witness whose very nature is to remain untouched
  by the vehicle''s motion. The intellect (buddhi) serves as charioteer—the faculty that can see the whole apparatus and direct
  it—while the mind (manas) functions as reins, the instrument of control. The senses are horses: powerful, prone to bolt
  toward their objects, requiring governance. This is not metaphor for comfort but for clarity: the teaching insists that
  what *experiences* pleasure and pain, what seems to be the subject of life, is actually an instrument. The one who mistakes
  the chariot for the lord, the body for the Self, the mind''s chatter for consciousness itself, becomes the enslaved passenger—the
  senses run wild like untamed horses and he is dragged toward death without recourse. The one who knows the distinction (the
  *vijñānavān*, the discriminating one) holds the reins firm. Yama''s move here is ruthless: he offers Naciketas not comfort
  but the only freedom that survives death—the recognition that what you truly are has never been born and cannot be harmed.
  The passage turns the fear of death into an urgent invitation to stop mistaking the vehicle for the rider.


  Key Terms


  **ātman** — The Self as lord of the chariot; the immobile, witnessing principle that remains untouched by the body-mind
  apparatus and its movements.

  **buddhi** — The intellect functioning as charioteer; the discriminating faculty capable of perceiving the whole apparatus
  and directing the senses toward their proper objects.

  **vijñānavān** — The discriminating one who knows the distinction between the Self and the chariot (body-mind-senses); the
  knower who holds firm control over the reins.

  **manas** — The mind as reins; the instrument of control that mediates between the charioteer (intellect) and the horses
  (senses).


  Cross-Tradition Resonances


  **Plato, Phaedrus 246a–254e (chariot of the soul):** Both deploy the chariot image to map the tripartite soul: in Plato,
  the charioteer (reason) drives two horses (spirited and appetitive parts); in Katha, the charioteer (buddhi) controls horses
  (senses) via reins (mind). Both treat the image as a tool for understanding hierarchy and control rather than mere ornament.
  Divergence: Plato''s horses are internal psychic forces that struggle against each other; Katha''s horses are the senses
  themselves, which are morally neutral instruments prone to bolt toward external objects. Plato seeks harmony among the soul''s
  parts; Katha seeks recognition that the true Self stands apart from the entire apparatus.

  **Bhagavad Gītā 3.42 (indriyāṇi parāṇy āhur indriyebhyaḥ paraṃ manaḥ):** Both texts establish a hierarchy of faculties:
  senses, mind, intellect, and Self. Both treat the senses as powerful and prone to distraction, requiring governance by higher
  faculties. Both locate freedom in discriminative knowledge of this structure. Divergence: The Gītā emphasizes the discipline
  of action (karma yoga) and devotion as means to stabilize the mind; Katha emphasizes the metaphysical recognition that the
  Self is the untouched witness, with less emphasis on ethical practice as the primary path.

  **Sāṃkhya Kārikā 2 (puruṣa as witness; prakṛti as instrument):** Both traditions sharply distinguish the conscious principle
  (puruṣa/ātman) from the instrumental apparatus (prakṛti/chariot). Both teach that the true Self is immobile and witnessing,
  while the body-mind complex is the vehicle of experience. Divergence: Sāṃkhya treats puruṣa and prakṛti as eternally separate
  substances; Katha''s Upaniṣadic framework suggests the Self''s non-dual nature and emphasizes recognition (jñāna) of this
  truth as liberation, rather than Sāṃkhya''s emphasis on their metaphysical distinction.'
insight: The chariot image does not console—it anatomizes.
practice: 'When next you feel pulled by desire toward an object or experience, pause and trace the pull backward: name the
  sense that is activated (eye, ear, tongue, touch, smell), name the object calling it, notice the mind reaching for it like
  reins snapping taut. Then ask without answering: who is aware that this reaching is happening? Do not move toward or away
  from the desire; simply let that question sit in the space between the pull and your response.'
