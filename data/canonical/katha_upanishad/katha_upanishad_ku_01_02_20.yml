unit_label: Smaller Than the Small, Greater Than the Great
title: Smaller Than the Small, Greater Than the Great
unit_type: verse
sanskrit_devanagari: 'अणोर् अणीयान् महतो महीयान् आत्मास्य जन्तोर् निहितो गुहायाम् ।

  तम् अक्रतुः पश्यति वीतशोको धातुप्रसादान् महिमानम् आत्मनः ॥ १.२.२० ॥'
sanskrit_iast: 'aṇor aṇīyān mahato mahīyān ātmāsya jantor nihito guhāyām |

  tam akratuḥ paśyati vītaśoko dhātuprasādān mahimānam ātmanaḥ || 1.2.20 ||'
translation_literal: The Self (ātman), smaller than the small and greater than the great, is hidden in the heart-cave (guhā)
  of this living being. One free from restless intention (akratu), freed from sorrow (vītaśoka), sees It through the serenity
  of the faculties (dhātu-prasāda)—the majesty of the Self.
commentary: 'The verse refuses to place the Self among measurable things. “Smaller” and “greater” do not describe physical
  dimensions: the ātman is subtler than every object of attention, yet exceeds every cosmic magnitude and category. It is
  “hidden” not because it is absent, but because ordinary awareness seeks outward objects and identifies with changing body,
  sensation, and thought. The heart-cave, guhā, names the inward depth of experience rather than a merely anatomical site.
  Akṛtuḥ is not a person without all purpose, but one no longer driven by compulsive projects, desire, and mental construction.
  Dhātu-prasāda suggests a clarified condition of the constituents or faculties: senses and mind become transparent rather
  than turbulent. In that lucidity, sorrow falls away because the knower recognizes a reality not exhausted by perishing forms.
  The Self’s “majesty” is thus seen, not produced; discipline disposes one to recognition.


  Key Terms


  **ātman** — the Self; the deepest reality of the person

  **guhā** — the cave or hidden inward depth, often the heart-cave

  **akratuḥ** — free from compulsive willing, craving, and mental contrivance

  **dhātu-prasāda** — the purification or serene clarity of the faculties/constituents


  Cross-Tradition Resonances


  **Luke 17:21 locates God’s kingdom “among” or “within” those addressed, while contemplative Christian traditions emphasize
  inward recollection.:**  Divergence: The Upaniṣadic ātman is presented as the innermost Self; Christian accounts ordinarily
  preserve a creator–creature distinction even in intimate divine indwelling.

  **Meditative traditions describe liberation as requiring the calming and clarifying of mental formations, so that grief
  and delusion cease.:**  Divergence: Classical Buddhism generally denies an eternal, independent ātman; this verse affirms
  the Self as the reality to be directly known.

  **Stoic practice seeks freedom from distress through disciplined judgment and an inwardly ordered ruling faculty.:**  Divergence:
  Stoicism grounds serenity in rational assent and life according to nature, rather than in realization of a hidden Self beyond
  all magnitude.'
practice: 'Sit quietly for ten minutes. Let attention rest in the felt interior of the chest without trying to visualize anything.
  When plans, memories, or self-descriptions arise, silently note “constructed,” and return to simple aware presence. End
  by asking: “What remains when I do not measure myself by any thought?”'
