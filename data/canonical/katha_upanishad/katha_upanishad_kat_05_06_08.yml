title: The Waking One Within Sleep
unit_type: verse
sanskrit_devanagari: 'हन्त त इदं प्रवक्ष्यामि गुह्यं ब्रह्म सनातनम् ।

  यथा च मरणं प्राप्य आत्मा भवति गौतम ॥ ६ ॥

  योनिम् अन्ये प्रपद्यन्ते शरीरत्वाय देहिनः ।

  स्थाणुम् अन्ये ऽनुसंयन्ति यथाकर्म यथाश्रुतम् ॥ ७ ॥

  य एष सुप्तेषु जागर्ति कामं कामं पुरुषो निर्मिमाणः ।

  तद् एव शुक्रं तद् ब्रह्म तद् एवामृतम् उच्यते ।

  तस्मिंल् लोकाः श्रिताः सर्वे तद् उ नात्येति कश्चन ॥ ८ ॥'
sanskrit_iast: 'hanta ta idaṃ pravakṣyāmi guhyaṃ brahma sanātanam / yathā ca maraṇaṃ prāpya ātmā bhavati
  gautama || 6 ||

  yonim anye prapadyante śarīratvāya dehinaḥ / sthāṇum anye ''nusaṃyanti yathākarma yathāśrutam || 7 ||

  ya eṣa supteṣu jāgarti kāmaṃ kāmaṃ puruṣo nirmimāṇaḥ / tad eva śukraṃ tad brahma tad evāmṛtam ucyate
  / tasmiṃl lokāḥ śritāḥ sarve tad u nātyeti kaścana || 8 ||'
translation_literal: 'Now, Gautama, I shall declare to you this hidden, eternal Brahman, and how the self
  comes to be after it has met death.


  Some embodied beings enter a womb in order to take on a body; others move into the unmoving, according
  to their action and according to their understanding.


  That Person who remains awake among those who sleep, shaping desire after desire—that indeed is the
  radiant pure; that is Brahman; that alone is called the deathless. Upon it all worlds depend, and no
  one whatsoever passes beyond it.'
commentary: 'The speaker begins with a promise of disclosure: this is guhyaṃ brahma sanātanam, Brahman
  that is both “hidden” and without beginning. The teaching concerns not merely survival after death but
  the mode of becoming (bhavati) of the ātman after death. The following verse refuses a single, uniform
  destiny: dehinaḥ, embodied beings, may enter yonim, a womb, for another embodiment, while others go
  toward sthāṇum, the stationary or unmoving. The measure given is yathākarma yathāśrutam—according to
  deed, and according to what has been heard or learned.


  Verse 8 shifts from postmortem destinies to the ever-present basis of experience. The puruṣa is jāgarti,
  awake, even “among sleepers,” and nirmimāṇaḥ, fashioning or projecting each desired object. Yet this
  creative activity is immediately identified with the ultimate: tad eva śukram, the luminous and undefiled;
  tad brahma; tad amṛtam, the deathless. The final claim is deliberately absolute: every world rests upon
  that reality, and nothing at all goes beyond it.


  Key Terms


  **guhyam** — Hidden, secret, or inwardly concealed; what requires initiation or insight to know.

  **yathākarma** — “According to action”; the moral and causal force of one’s deeds.

  **yathāśrutam** — “According to what has been heard”; possibly one’s received understanding, learning,
  or sacred knowledge.

  **jāgarti** — “Keeps awake”; the verb that marks the puruṣa as unbroken awareness amid sleep.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.22:** The Gītā likewise depicts the embodied self as taking up new bodies, comparing
  the process to changing worn-out garments. Divergence: The Gītā emphasizes the self’s unchanging continuity,
  whereas this passage also distinguishes divergent destinations, including movement toward the unmoving.

  **Plato, Phaedo 107c–115a (the Myth of Er):** Plato presents postmortem destinies as conditioned by
  the quality of a life and by moral choice. Divergence: Plato frames the process through judgment of
  individual souls, while the Upaniṣad compresses its account into karma, learning, and the all-encompassing
  Brahman.

  **Gospel of Mark 13:36:** Jesus’ warning, “lest he come suddenly and find you asleep,” makes wakefulness
  a spiritual image of readiness and alertness. Divergence: Mark’s wakefulness is an ethical vigilance
  before a coming lord, whereas the Upaniṣad speaks of a Person already wakeful at the root of sleeping
  experience itself.'
practice: Before sleep, sit quietly for five minutes and notice sensations, thoughts, and wishes arise
  and fade. Ask softly, “What is aware of these?” Do not seek an answer in words; rest attention in the
  simple fact of knowing, then carry that recollection into sleep.
