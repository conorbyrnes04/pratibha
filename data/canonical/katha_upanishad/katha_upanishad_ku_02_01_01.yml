sanskrit_devanagari: 'पराञ्चि खानि व्यतृणत् स्वयम्भूस् ।

  तस्मात् पराङ् पश्यति नान्तरात्मन् ।

  कश्चिद् धीरः प्रत्यगात्मानम् ऐक्षद् ।

  आवृत्तचक्षुर् अमृतत्वम् इच्छन् ॥ २.१.१ ॥'
sanskrit_iast: 'parāñci khāni vyatṛṇat svayambhūs |

  tasmāt parāṅ paśyati nāntarātman |

  kaścid dhīraḥ pratyagātmānam aikṣad |

  āvṛttacakṣur amṛtatvam icchan || 2.1.1 ||'
translation_literal: The Self-existent made the senses open outward; therefore one looks outward, not toward the inner Self.
  But some steadfast one, desiring immortality, turned the gaze back and beheld the inward Self.
commentary: 'The verse diagnoses ordinary consciousness without condemning the world. The khāni, the sense-openings, are constituted
  as outward-facing: sight, hearing, and the rest deliver objects, change, and multiplicity. Thus the ātman is not normally
  absent but overlooked; attention is continually carried toward what is other. The exceptional dhīra, a person of steadiness
  and discernment, performs āvṛtti, a reversal of the gaze. This is not physical withdrawal alone, nor a search for a private
  psychological object. It is a turning from dependence on external appearances toward the witnessing ground by which appearances
  are known. The desire for amṛtatva, “deathlessness,” gives the turn its seriousness: what is sought is not prolonged worldly
  experience but recognition of that which is not exhausted by changing experience. The verse establishes inward discernment
  as the necessary counter-movement to sensory dispersion.


  Key Terms


  **khāni** — the sense-openings or channels

  **dhīraḥ** — the steady, discerning person

  **pratyagātman** — the inward Self

  **amṛtatva** — deathlessness, immortality


  Cross-Tradition Resonances


  **Both portray ordinary perception as directed toward an external field and require a difficult reorientation toward truth.:**  Divergence:
  Plato’s ascent is principally toward intelligible forms and the Good; the Upaniṣadic turn is toward the inward Self.

  **Mindfulness withdraws compulsive attention from sensory pursuit and examines experience directly rather than chasing its
  objects.:**  Divergence: Classical Buddhism generally denies an eternal self, whereas this verse directs attention to the
  pratyagātman.

  **Writers such as Augustine and later contemplatives urge an inward recollection rather than restless seeking in external
  things.:**  Divergence: Christian inwardness remains relational to the creator God, not ordinarily framed as realization
  of an identical inner Self.'
practice: 'For ten minutes, sit quietly with eyes soft or closed. Each time attention follows a sound, sensation, image, or
  thought, silently note “outward,” then ask: “What is aware of this?” Rest briefly as that knowing presence without trying
  to make it an object.'
