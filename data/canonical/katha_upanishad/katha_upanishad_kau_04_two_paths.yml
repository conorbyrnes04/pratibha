unit_label: The Good and the Pleasant
title: The Good and the Pleasant
unit_type: sutra
sanskrit_devanagari: "अन्यच् छ्रेयो ऽन्यद् उतैव प्रेयस् ते उभे नानार्थे पुरुषं सिनीतः ।  तयोः श्रेय आददानस्य साधु भवति हीयते\
  \ ऽर्थाद् य उ प्रेयो वृणीते । \nश्रेयश् च प्रेयश् च मनुष्यम् एतस् तौ संपरीत्य विविनक्ति धीरः ।  श्रेयो हि धीरो ऽभि प्रेयसो\
  \ वृणीते प्रेयो मन्दो योगक्षेमाद् वृणीते । \nस त्वं प्रियान् प्रियरूपांश् च कामान् अभिध्यायन् नचिकेतो ऽत्यस्राक्षीः ।  नैतां\
  \ सृङ्कां वित्तमयीम् अवाप्तो यस्यां मज्जन्ति बहवो मनुष्याः । \nदूरम् एते विपरीते विषूची अविद्या या च विद्येति ज्ञाता । \
  \ विद्याभीप्सिनं नचिकेतसं मन्ये न त्वा कामा बहवो ऽलोलुपन्त । \nअविद्यायाम् अन्तरे वर्तमानाः स्वयं धीराः पण्डितं मन्यमानाः\
  \ ।  दन्द्रम्यमाणाः परियन्ति मूढा अन्धेनैव नीयमाना यथान्धाः । \nन साम्परायः प्रतिभाति बालं प्रमाद्यन्तं वित्तमोहेन मूढम्\
  \ ।  अयं लोको नास्ति पर इति मानी पुनः पुनर् वशम् आपद्यते मे । ।"
sanskrit_iast: 'anyac chreyo ''nyad utaiva preyas te ubhe nānārthe puruṣaṃ sinītaḥ / tayoḥ śreya ādadānasya sādhu bhavati
  hīyate ''rthād ya u preyo vṛṇīte |

  śreyaś ca preyaś ca manuṣyam etas tau saṃparītya vivinakti dhīraḥ / śreyo hi dhīro ''bhi preyaso vṛṇīte preyo mando yogakṣemād
  vṛṇīte |

  sa tvaṃ priyān priyarūpāṃś ca kāmān abhidhyāyan naciketo ''tyasrākṣīḥ / naitāṃ sṛṅkāṃ vittamayīm avāpto yasyāṃ majjanti
  bahavo manuṣyāḥ |

  dūram ete viparīte viṣūcī avidyā yā ca vidyeti jñātā / vidyābhīpsinaṃ naciketasaṃ manye na tvā kāmā bahavo ''lolupanta |

  avidyāyām antare vartamānāḥ svayaṃ dhīrāḥ paṇḍitaṃ manyamānāḥ / dandramyamāṇāḥ pariyanti mūḍhā andhenaiva nīyamānā yathāndhāḥ
  |

  na sāmparāyaḥ pratibhāti bālaṃ pramādyantaṃ vittamohena mūḍham / ayaṃ loko nāsti para iti mānī punaḥ punar vaśam āpadyate
  me ||'
translation_literal: The good is one thing, the pleasant another; these two, having different ends, bind a man. It is well
  with him who chooses the good; he who chooses the pleasant falls from his aim. The wise prefer the good to the pleasant;
  the fool chooses the pleasant through greed and avarice.
commentary: 'Yama''s opening move establishes a razor between śreya (the good, the conducive, what genuinely furthers) and
  preya (the pleasant, the agreeable, what flatters immediate desire). The passage does not condemn pleasure but anatomizes
  its cost: preya binds through multiplication—each satisfaction spawns the next want, each gratification deepens the chain
  (sṛṅkā) of possession-anxiety (yogakṣema) that drowns ordinary humans. Naciketas has already refused this trap by abandoning
  his inherited wealth and the pleasures attached to it (priyān priyarūpāṁś ca kāmān). Yama''s teaching pivots on a single
  verb: vṛṇīte—to choose. The fool (manda) and the wise (dhīra) face identical options; what differs is discrimination (viveka).
  The passage does not promise that śreya feels better or arrives faster. It promises only that the good does not hollow you
  out. Yama then names the architecture of this choice: two paths (dūram ete viparīte viṣūchī), one toward avidyā (ignorance,
  the self-perpetuating fog of object-hunger) and one toward vidyā (direct knowing, the recognition of what does not die).
  The teaching is not moral exhortation but diagnosis—a map of how attention itself becomes the battleground.'
insight: Yama's opening move establishes a razor between śreya (the good, the conducive, what genuinely furthers) and preya
  (the pleasant, the agreeable, what flatters immediate desire).
practice: 'When you reach for something you know will dissolve or leave you hungrier than before—a scroll, a purchase, a story
  you rehearse—stop your hand mid-motion and feel the pull without moving. Name it silently as preya. Then ask your body:
  what would the good look like here? Not the opposite pleasure, but the thing that does not require you to want it again
  tomorrow. Move toward that, even if it is only the next breath, or the honest word you were avoiding, or the empty room.'
