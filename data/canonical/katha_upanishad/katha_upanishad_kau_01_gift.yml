  items:
  - term: naciketas (नचिकेतस्)
    definition: 'na + cit? folk etymology ‘one who does not know’ / proper name → the boy whose faith exposes sacrificial
      hypocrisy → trap: mere narrative hero'
  - term: śraddhā (श्रद्धा)
    definition: 'śrat + √dhā ‘place the heart’ → faith entering as cattle are given → trap: blind belief; here moral clarity'
  - term: mṛtyu (मृत्यु)
    definition: 'Death as teacher to whom the son is offered → trap: personified grim reaper without pedagogical role'
