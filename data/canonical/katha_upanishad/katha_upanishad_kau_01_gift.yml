sanskrit_devanagari: "उशन् ह वै वाजश्रवसः सर्ववेदसं ददौ ।  तस्य ह नचिकेता नाम पुत्र आस । \nतं ह कुमारं\
  \ सन्तं दक्षिणासु नीयमानासु श्रद्धाविवेश ।  सो ऽमन्यत । \nपीतोदका जग्धतृणा दुग्धदोहा निरिन्द्रियाः ।\
  \  अनन्दा नाम ते लोकास् तान् स गच्छति ता ददत् । \nस होवाच पितरं तत कस्मै मां दास्यसीति ।  द्वितीयं तृतीयम्\
  \ ।  तं होवाच मृत्यवे त्वा ददामीति । \nबहूनाम् एमि प्रथमो बहूनाम् एमि मध्यमः ।  किं स्विद् यमस्य कर्तव्यं\
  \ यन् मयाद्य करिष्यति । \nअनुपश्य यथा पूर्वे प्रतिपश्य तथापरे ।  सस्यम् इव मर्त्यः पच्यते सस्यम् इवाजायते\
  \ पुनः । ।"
sanskrit_iast: 'uśan ha vai vājaśravasaḥ sarvavedasaṃ dadau / tasya ha naciketā nāma putra āsa |

  taṃ ha kumāraṃ santaṃ dakṣiṇāsu nīyamānāsu śraddhāviveśa / so ''manyata |

  pītodakā jagdhatṛṇā dugdhadohā nirindriyāḥ / anandā nāma te lokās tān sa gacchati tā dadat |

  sa hovāca pitaraṃ tata kasmai māṃ dāsyasīti / dvitīyaṃ tṛtīyam / taṃ hovāca mṛtyave tvā dadāmīti |

  bahūnām emi prathamo bahūnām emi madhyamaḥ / kiṃ svid yamasya kartavyaṃ yan mayādya kariṣyati |

  anupaśya yathā pūrve pratipaśya tathāpare / sasyam iva martyaḥ pacyate sasyam ivājāyate punaḥ ||'
translation_literal: 'Vājaśravasa, desiring rewards, gave away all his possessions. He had a son named
  Naciketas. As the gifts were being led forth, faith entered that boy, still young. He reflected: ''These
  cows have drunk their water, eaten their grass, been milked of their milk, and are spent of their powers.
  Joyless indeed are those worlds called, to which he goes who gives such gifts.'' He said to his father:
  ''Father, to whom will you give me?'' A second time, a third time he asked. Then the father said to
  him: ''To Death I give you.'' Naciketas reflected: ''I go as the first of many, I go as the middle one
  of many. What work of Yama is there to be done, which he will do with me today? Look back at how it
  was with those who came before; look forward at how it will be with those who come after. Like grain
  a mortal ripens and falls; like grain he is born again.'''
commentary: 'The passage establishes its pedagogical violence through a father''s curse that becomes initiation.
  Vājaśravasa performs sacrifice for heavenly reward (svarga)—the standard transactional piety of Vedic
  religion—yet his son Naciketas, watching the gifts move toward the priests, perceives the father''s
  own anxiety: *to whom will you give me?* The repetition (twice, thrice) is not childish pestering but
  a piercing recognition that the father has already given everything away, including his heir. The father''s
  fury—*mṛtyave tvā dadāmi*, I give you to Death—is curse-speech that the text immediately validates.
  Naciketas then speaks the passage''s hinge: he catalogs the worlds of the satisfied dead (pīta-udaka,
  dugdha-doha, ananda) as *ananda-nāma*, named-by-bliss-but-empty. The formula *sasyam iva martyaḥ pacyate*
  (mortals ripen like grain) contains no metaphor of growth; ripening here means cooking, dissolution.
  What the passage refuses is the consolation that death leads to another pleasant realm. Instead, it
  severs the link between ritual gift and posthumous reward, forcing the question: what persists when
  all transactional goods—heaven, progeny, cattle, pleasure—are stripped away? Naciketas''s gift to Death
  is not punishment but the only honest offering: a son who has already seen through the father''s economy
  of exchange. The teaching moves by negation: not these worlds, not these satisfactions, not this logic
  of giving and receiving.


  Key Terms


  **mṛtyave tvā dadāmi** — I give you to Death—the father''s curse-speech that becomes the initiatory
  threshold; a transactional utterance that paradoxically breaks the logic of transaction

  **ananda-nāma** — named-by-bliss-but-empty; worlds that bear the name of joy yet lack substantive reality,
  exposing the hollowness of posthumous reward

  **sasyam iva martyaḥ pacyate** — mortals ripen like grain—a formula of dissolution rather than growth,
  cooking-down into undifferentiated matter rather than ascent


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** Both passages strip away the consolation of posthumous worlds: Kṛṣṇa tells Arjuna
  that all beings are born and die, and attachment to heavenly reward (svarga) is a distraction from dharma.
  Naciketas similarly refuses the father''s transactional piety. Divergence: The Gītā offers an alternative
  path (yoga, dharma); Katha Upanishad offers only negation—*neti neti*—without prescriptive replacement
  until the final teaching on ātman

  **Plato, Apology 40c–41a:** Socrates faces death with equanimity by refusing to fear the unknown afterlife;
  like Naciketas, he rejects comforting myths about pleasant posthumous realms and accepts the dissolution
  of the known self. Divergence: Socrates grounds his refusal in rational ignorance (we cannot know what
  death is); Naciketas grounds it in direct perception of the father''s economy of exchange and its bankruptcy

  **Dīgha Nikāya 16 (Mahāparinirvāna Sutta):** Both texts use the image of ripening/decay (pacyate / pakati)
  to describe the body''s inevitable dissolution; both refuse consolatory afterlife narratives as obstacles
  to genuine understanding. Divergence: The Buddhist text emphasizes impermanence (anicca) as universal
  law; Katha Upanishad uses impermanence to pose the question of what *does* persist—pointing toward ātman
  rather than anattā'
insight: The passage establishes its pedagogical violence through a father's curse that becomes initiation.
practice: 'When you next receive praise or comfort that feels unearned or hollow, do not deflect it politely
  or absorb it gratefully—instead, speak aloud what the praise cannot touch: name one thing about yourself
  or your situation that no amount of pleasant words will change or remove. Repeat this naming three times,
  each time slower, until the gap between the words offered and the reality they cannot reach becomes
  palpable.'
