sanskrit_devanagari: 'पुरम् एकादशद्वारम् अजस्यावक्रचेतसः ।

  अनुष्ठाय न शोचति विमुक्तश् च विमुच्यते ॥ १ ॥

  हंसः शुचिषद् वसुर् अन्तरिक्षसद् धोता वेदिषद् अतिथिर् दुरोणसत् ।

  नृषद् वरसद् ऋतसद् व्योमसद् अब्जा गोजा ऋतजा अद्रिजा ऋतं बृहत् ॥ २ ॥

  ऊर्ध्वं प्राणम् उन्नयति अपानं प्रत्यग् अस्यति ।

  मध्ये वामनम् आसीनं विश्वे देवा उपासते ॥ ३ ॥

  अस्य विस्रंसमानस्य शरीरस्थस्य देहिनः ।

  देहाद् विमुच्यमानस्य किम् अत्र परिशिष्यते ॥ ४ ॥

  न प्राणेन नापानेन मर्त्यो जीवति कश्चन ।

  इतरेण तु जीवन्ति यस्मिन्न् एताव् उपाश्रितौ ॥ ५ ॥'
sanskrit_iast: 'puram ekādaśadvāram ajasyāvakracetasaḥ / anuṣṭhāya na śocati vimuktaś ca vimucyate ||
  1 ||

  haṃsaḥ śuciṣad vasur antarikṣasad dhotā vediṣad atithir duroṇasat / nṛṣad varasad ṛtasad vyomasad abjā
  gojā ṛtajā adrijā ṛtaṃ bṛhat || 2 ||

  ūrdhvaṃ prāṇam unnayati apānaṃ pratyag asyati / madhye vāmanam āsīnaṃ viśve devā upāsate || 3 ||

  asya visraṃsamānasya śarīrasthasya dehinaḥ / dehād vimucyamānasya kim atra pariśiṣyate || 4 ||

  na prāṇena nāpānena martyo jīvati kaścana / itareṇa tu jīvanti yasminn etāv upāśritau || 5 ||'
translation_literal: 'In the city with eleven gates dwells the Unborn, whose awareness does not turn aside.
  Having steadfastly realized him, one does not grieve; liberated, one is wholly released.


  The Swan dwelling in purity, the Vasu dwelling in midspace, the hotṛ dwelling at the altar, the guest
  dwelling in the home; dwelling among people, dwelling among the gods, dwelling in truth, dwelling in
  the sky; born of water, born of earth, born of truth, born from the mountain—he is the great Reality.


  He raises the upward breath and casts the downward breath back. Seated in the middle is the Vāmana;
  all the gods worship him.


  When this embodied one, abiding in the body, is falling apart—when he is being released from the body—what,
  then, remains here?


  No mortal lives by the upward breath or by the downward breath. They live by something other, upon which
  these two depend.'
commentary: 'The opening image calls the body a pura, a fortified city, yet gives it ekādaśa-dvāra, “eleven
  gates.” Within it is the aja, the Unborn, marked by avakra-cetas: awareness that is not bent, twisted,
  or diverted. The verse does not merely promise a later liberation; it says that one who has anuṣṭhāya—steadfastly
  attended to or realized—this inner reality is already without grief, and, being free, comes fully free.


  Verse 2 expands this presence through a cascade of compounds: it is in the pure place, the atmosphere,
  ritual fire, household, human world, divine gift, truth, sky, waters, earth, and mountain. Rather than
  restricting the Self to an inward point, the verse lets it appear in every stratum of cosmos and ritual,
  culminating in ṛtaṃ bṛhat, “the great Real/Order.” Yet verse 3 returns to the body: the Vāmana, the
  small or wondrous one, sits “in the middle,” attended by all the gods. The final questions cut beneath
  prāṇa and apāna. Breath is indispensable to embodied life, but it is not life’s ultimate ground; both
  breaths rest upon “the other,” the reality the passage presses the listener to seek.


  Key Terms


  **ekādaśadvāram** — “having eleven gates,” the body figured as a many-opened city.

  **aja** — “the unborn,” that which is not produced and so is not subject to bodily decay.

  **avakracetasaḥ** — “of unbent awareness,” consciousness not crookedly turned away from truth.

  **prāṇa** — the upward or vital breath, here explicitly dependent on a deeper principle.


  Cross-Tradition Resonances


  **Bhagavad Gītā 5.13:** The Gītā likewise speaks of the embodied being dwelling in a “city of nine gates,”
  while remaining inwardly unattached to bodily action. Divergence: Kaṭha’s eleven-gated image is paired
  more directly with the Unborn Self and with the question of what survives bodily dissolution.

  **Plato, Phaedo 64c–67b:** Socrates treats philosophy as a turning away from exclusive identification
  with bodily conditions toward care for the soul’s reality. Divergence: The Phaedo argues through the
  soul’s distinction from the body, whereas this passage identifies a pervasive, unborn ground upon which
  even vital breaths rely.

  **Dhammapada 160:** The verse “The self is the protector of the self” parallels the Upaniṣadic demand
  to discover a source of steadiness not supplied by external things. Divergence: The Dhammapada’s anattā
  framework does not affirm an eternal unborn Self in the Upaniṣadic sense.'
practice: 'Sit upright for five minutes and notice the breath rising and falling without trying to control
  it. Then ask silently, after each exhale: “What is aware of both movements?” Do not answer conceptually;
  rest attention in the quiet interval in which prāṇa and apāna are simply known.'
