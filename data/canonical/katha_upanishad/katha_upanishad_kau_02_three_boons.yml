sanskrit_devanagari: "तिस्रो रात्रीर् यद् अवत्सीर् गृहे मे अनश्नन् ब्रह्मन्न् अतिथिर् नमस्यः ।  नमस् ते ऽस्तु ब्रह्मन् स्वस्ति\
  \ मे ऽस्तु तस्मात् प्रति त्रीन् वरान् वृणीष्व । \nशान्तसङ्कल्पः सुमना यथा स्याद् वीतमन्युर् गौतमो माभि मृत्यो ।  त्वत्प्रसृष्टं\
  \ माभिवदेत् प्रतीत एतत् त्रयाणां प्रथमं वरं वृणे । \nयथा पुरस्ताद् भविता प्रतीत औद्दालकिर् आरुणिर् मत्प्रसृष्टः ।  सुखं\
  \ रात्रीः शयिता वीतमन्युस् त्वां ददृशिवान् मृत्युमुखात् प्रमुक्तम् । \nस्वर्गे लोके न भयं किंचनास्ति न तत्र त्वं न जरया\
  \ बिभेति ।  उभे तीर्त्वा अशनायापिपासे शोकातिगो मोदते स्वर्गलोके । \nस त्वम् अग्निं स्वर्ग्यम् अध्येषि मृत्यो प्रब्रूहि तं\
  \ श्रद्दधानाय मह्यम् ।  स्वर्गलोका अमृतत्वं भजन्त एतद् द्वितीयेन वृणे वरेण । \nप्र ते ब्रवीमि तद् उ मे निबोध स्वर्ग्यम्\
  \ अग्निं नचिकेतः प्रजानन् ।  अनन्तलोकाप्तिम् अथो प्रतिष्ठां विद्धि त्वम् एतं निहितं गुहायाम् । \nलोकादिम् अग्निं तम् उवाच\
  \ तस्मै या इष्टका यावतीर् वा यथा वा ।  स चापि तत् प्रत्यवदद् यथोक्तम् अथास्य मृत्युः पुनर् आह तुष्टः । \nतम् अब्रवीत् प्रीयमाणो\
  \ महात्मा वरं तवेहाद्य ददामि भूयः ।  तवैव नाम्ना भवितायम् अग्निः सृङ्कां चेमाम् अनेकरूपां गृहाण । \nत्रिणाचिकेतस् त्रिभिर्\
  \ एत्य सन्धिं त्रिकर्मकृत् तरति जन्ममृत्यू ।  ब्रह्मजज्ञं देवम् ईड्यं विदित्वा निचाय्येमां शान्तिम् अत्यन्तम् एति । \nत्रिणाचिकेतस्\
  \ त्रयम् एतद् विदित्वा य एवं विद्वांश् चिनुते नाचिकेतम् ।  स मृत्युपाशान् पुरतः प्रणोद्य शोकातिगो मोदते स्वर्गलोके । \n\
  एष ते ऽग्निर् नचिकेतः स्वर्ग्यो यम् अवृणीथा द्वितीयेन वरेण ।  एतम् अग्निं तवैव प्रवक्ष्यन्ति जनासस् तृतीयं वरं नचिकेतो वृणीष्व\
  \ । ।"
sanskrit_iast: 'tisro rātrīr yad avatsīr gṛhe me anaśnan brahmann atithir namasyaḥ / namas te ''stu brahman svasti me ''stu
  tasmāt prati trīn varān vṛṇīṣva |

  śāntasaṅkalpaḥ sumanā yathā syād vītamanyur gautamo mābhi mṛtyo / tvatprasṛṣṭaṃ mābhivadet pratīta etat trayāṇāṃ prathamaṃ
  varaṃ vṛṇe |

  yathā purastād bhavitā pratīta auddālakir āruṇir matprasṛṣṭaḥ / sukhaṃ rātrīḥ śayitā vītamanyus tvāṃ dadṛśivān mṛtyumukhāt
  pramuktam |

  svarge loke na bhayaṃ kiṃcanāsti na tatra tvaṃ na jarayā bibheti / ubhe tīrtvā aśanāyāpipāse śokātigo modate svargaloke
  |

  sa tvam agniṃ svargyam adhyeṣi mṛtyo prabrūhi taṃ śraddadhānāya mahyam / svargalokā amṛtatvaṃ bhajanta etad dvitīyena vṛṇe
  vareṇa |

  pra te bravīmi tad u me nibodha svargyam agniṃ naciketaḥ prajānan / anantalokāptim atho pratiṣṭhāṃ viddhi tvam etaṃ nihitaṃ
  guhāyām |

  lokādim agniṃ tam uvāca tasmai yā iṣṭakā yāvatīr vā yathā vā / sa cāpi tat pratyavadad yathoktam athāsya mṛtyuḥ punar āha
  tuṣṭaḥ |

  tam abravīt prīyamāṇo mahātmā varaṃ tavehādya dadāmi bhūyaḥ / tavaiva nāmnā bhavitāyam agniḥ sṛṅkāṃ cemām anekarūpāṃ gṛhāṇa
  |

  triṇāciketas tribhir etya sandhiṃ trikarmakṛt tarati janmamṛtyū / brahmajajñaṃ devam īḍyaṃ viditvā nicāyyemāṃ śāntim atyantam
  eti |

  triṇāciketas trayam etad viditvā ya evaṃ vidvāṃś cinute nāciketam / sa mṛtyupāśān purataḥ praṇodya śokātigo modate svargaloke
  |

  eṣa te ''gnir naciketaḥ svargyo yam avṛṇīthā dvitīyena vareṇa / etam agniṃ tavaiva pravakṣyanti janāsas tṛtīyaṃ varaṃ naciketo
  vṛṇīṣva ||'
translation_literal: 'Vājaśravasa, desirous of heavenly rewards, surrendered all that he possessed. He had a son named Naciketas.
  Faith entered the boy as the sacrificial gifts were led away, and he asked his father to whom he would give him. The father,
  angered, said: I give thee unto Death.'
commentary: 'Yama''s offer of three boons stages a precise pedagogical trap. The king of death presents the conventional goods
  first—Gautama''s pacification, Upalavada''s restoration to wealth and long life, the pleasures of heaven itself—each one
  a plausible answer to the question *what does a human being want?* Naciketas refuses them all. The refusal is not ascetic
  rejection but discriminative clarity: these are *bhoga*, enjoyments that depend on time, bodies, and the continuity of the
  world-process. They do not touch the fundamental problem Naciketas has intuited by entering death''s realm—the fact of mortality
  itself, the fact that even heaven ends. The third boon, withheld until the boy presses, concerns *ātman*, the Self no larger
  than a thumb, dwelling in the heart. This is the move: Yama does not offer an *alternative* good but exposes the category
  mistake in all three previous requests. The boy has been asking for *more time, more pleasure, more security*—asking death
  for what death cannot give and what, if given, would only postpone the real question. Only when Naciketas names what he
  actually seeks—the teaching on what does not die—does Yama recognize him as worthy. The boons are a curriculum in negation:
  each refusal clarifies what the seeker is *not* looking for, until the space opens for what remains when all temporal goods
  are stripped away.'
insight: Yama's offer of three boons stages a precise pedagogical trap.
practice: 'When you receive an offer—a promotion, a distraction, a comfort, a guarantee—state aloud or write in a single sentence
  what it promises to solve. Then ask without answering: *Does this address what in me is actually mortal?* Return to the
  offer later only if the answer is no.'
