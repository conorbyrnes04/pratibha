sanskrit_devanagari: 'यद् एवेह तद् अमुत्र यद् अमुत्र तद् अन्व् इह ।

  मृत्योः स मृत्युम् आप्नोति य इह नानेव पश्यति ॥ १० ॥

  मनसैवेदम् आप्तव्यं नेह नानास्ति किंचन ।

  मृत्योः स मृत्युं गच्छति य इह नानेव पश्यति ॥ ११ ॥

  अङ्गुष्ठमात्रः पुरुषो मध्य आत्मनि तिष्ठति ।

  ईशानो भूतभव्यस्य न ततो विजुगुप्सते ॥ १२ ॥

  अङ्गुष्ठमात्रः पुरुषो ज्योतिर् इव अधूमकः ।

  ईशानो भूतभव्यस्य स एवाद्य स उ श्वः ॥ १३ ॥

  यथोदकं दुर्गे वृष्टं पर्वतेषु विधावति ।

  एवं धर्मान् पृथक् पश्यंस् तान् एवानु विधावति ॥ १४ ॥'
sanskrit_iast: 'yad eveha tad amutra yad amutra tad anv iha / mṛtyoḥ sa mṛtyum āpnoti ya iha nāneva paśyati
  || 10 ||

  manasaivedam āptavyaṃ neha nānāsti kiṃcana / mṛtyoḥ sa mṛtyuṃ gacchati ya iha nāneva paśyati || 11 ||

  aṅguṣṭhamātraḥ puruṣo madhya ātmani tiṣṭhati / īśāno bhūtabhavyasya na tato vijugupsate || 12 ||

  aṅguṣṭhamātraḥ puruṣo jyotir iva adhūmakaḥ / īśāno bhūtabhavyasya sa evādya sa u śvaḥ || 13 ||

  yathodakaṃ durge vṛṣṭaṃ parvateṣu vidhāvati / evaṃ dharmān pṛthak paśyaṃs tān evānu vidhāvati || 14
  ||'
translation_literal: '10. What is here is also there; what is there is also here. Whoever sees multiplicity
  here, as though it were real, goes from death to death.


  11. This must be grasped by the mind: here there is no diversity whatsoever. Whoever sees multiplicity
  here, as though it were real, goes from death to death.


  12. The Person, no larger than a thumb, stands within the self. Lord of what has been and what is yet
  to be, he therefore does not turn away in revulsion.


  13. The Person, no larger than a thumb, is like a smokeless flame. Lord of what has been and what is
  yet to be—he alone is today; he indeed is tomorrow.


  14. As rain, fallen upon a rugged mountain, runs streaming down among the slopes, so one who sees the
  dharmas as separate runs after those very things.'
commentary: 'The passage begins with a tightly balanced pair of locatives: iha, “here,” and amutra, “there.”
  Whatever reality is present in one domain is present in the other; the Upaniṣad refuses to let liberation
  be imagined as an elsewhere opposed to this world. Its repeated warning concerns the person who sees
  nānā, “manifoldness,” iva—“as if” it were ultimate. The small particle iva is decisive: the text does
  not deny the experienced variety of things, but denies that plurality has independent, final reality.
  To take it as final is to move “from death to death.”


  Verses 12–13 turn from this claim to an intimate image: the aṅguṣṭhamātra puruṣa, the Person “of thumb-measure,”
  abiding in the midst of the self. The image gives the inward Self a contemplative accessibility without
  making it merely a physical object. It is īśāna, sovereign over bhūta and bhavya, past and future, and
  is compared to a flame without smoke: self-luminous, unclouded, and enduring through “today” and “tomorrow.”
  The final simile supplies the ethical-psychological consequence. Water dispersed across mountain gullies
  follows many channels; likewise, one who regards dharmas as separate is drawn along after the many objects,
  qualities, and conditions that claim attention.


  Key Terms


  **nānā** — Multiplicity or manifoldness; here, plurality mistakenly treated as ultimate reality.

  **puruṣa** — The inward Person or conscious Self, described as dwelling within the self.

  **aṅguṣṭhamātraḥ** — “Thumb-sized,” an imagistic measure that makes the inward reality available to
  contemplation.

  **dharmān** — The many phenomena, qualities, or conditioned things that the divided perceiver pursues.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7, “tat tvam asi”:** Like the teaching “you are that,” this passage locates
  the deepest reality not in a remote beyond but in the very one who seeks it. Divergence: The Chāndogya
  frames unity through identity with Being, while this Kaṭha passage emphasizes the mortal consequence
  of perceiving plurality as final.

  **Plato, Republic VII, Allegory of the Cave:** Plato likewise portrays ordinary perception as attachment
  to a plurality of passing appearances rather than to what is truly real. Divergence: Plato’s ascent
  moves toward intelligible Forms beyond the sensory cave, whereas the Kaṭha discovers the decisive reality
  as the inward puruṣa.

  **Gospel of Thomas, Saying 3:** The saying that the kingdom is “inside of you and outside of you” parallels
  Kaṭha’s refusal to divide “here” from “there.” Divergence: The Gospel’s language concerns the kingdom
  and self-knowledge in a Christian-apocryphal setting, while Kaṭha speaks of the eternal puruṣa and release
  from recurrent death.'
practice: Sit upright for five minutes and attend to the quiet felt center of the chest or heart-region.
  On each inhalation, silently note “here”; on each exhalation, “there.” When sounds, sensations, or thoughts
  arise, name them gently as “many,” then return to the single field in which they appear. End by noticing
  one desire you are about to “run after,” and pause for three full breaths before acting.
