pratibha_layers:
- kind: original
  label: Original
  body: 'bulbul bāzgasht; ū ʿāshiq-i gul ast va dar ʿishq-i gul ghazal mī-khvānad. mī-gūyad: dar daryā-yi
    ʿishq-i gul gharq-am; barā-yi man ʿishq-i gul bas ast. hudhud javāb mī-dihad: tu dar ẓāhir māndah-ī;
    gul fānī ast, va sīmurgh maṭlūb-i rāh.'
- kind: translation
  label: Pratibha Translation
  body: 'The first to turn back was the Nightingale, known for his passionate love of the Rose and for
    the rapturous songs in which he sings of that love.


    “I am so completely drowned in the ocean of love for my Rose,” he said, “that I practically have no
    life of my own. How can a tiny creature like me have the strength to endure the splendor of the Simurgh?
    For me, the love of the Rose is enough.”


    “Oh,” cried the Hoopoe, “you who stop at mere appearances, enamored only of outward beauty, speak
    no more of Love. Your love for the Rose has only strewn thorns in your path. Such passion for passing
    things brings nothing but grief. Give up your fancy for the Rose. It mocks you every spring and does
    not blossom for your sake.”'
