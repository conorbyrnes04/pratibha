- kind: key_terms
  label: Key Terms
  items:
  - term: بلبل (bulbul)
    definition: Persian bulbul, “nightingale” -> the bird absorbed in the Rose -> not simply a romantic
      singer, but a seeker whose refined sensibility has become a reason to remain still.
  - term: گل (gul)
    definition: 'Persian gul, “rose, flower” -> the Nightingale’s beloved -> more than a botanical emblem:
      it is transient outward beauty claimed as a private possession.'
  - term: عشق (ʿishq)
    definition: Arabic ʿishq, passionate love; its traditional association with clinging ivy is etymologically
      debated -> the love the Nightingale invokes -> the default gloss “love” misses the contrast between
      possessive fixation and love that remakes the self.
  - term: سیمرغ (sīmurgh)
    definition: Persian sīmurgh, the mythic sovereign bird -> the overwhelming goal of the birds’ quest
      -> not merely a fabulous bird or distant king, but the horizon before which the separate self’s
      adequacy fails.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Symposium, 210a–212a
    resonance: Diotima’s ascent begins from beautiful bodies and moves beyond any one beautiful object
      toward Beauty itself; the Hoopoe likewise challenges devotion that halts at a single lovely form.
    divergence: Plato’s ladder grants sensible beauty an explicitly educative place, whereas the Hoopoe
      speaks as though the Rose chiefly entangles. The difference matters because ʿAṭṭār foregrounds the
      practical danger of lingering.
  - citation: Rūmī, Mathnawī, Book I, the reed-flute opening
    resonance: 'Both works make longing audible: song testifies to separation, yet cannot by itself complete
      the return to the source.'
    divergence: Rūmī’s reed laments exile from its origin; the Nightingale’s song is bound to a recurring
      object of desire. One voice points through grief, while the other is accused of being stopped by
      it.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when one attractive thing—a person, image, purchase, achievement, or memory—takes over
    your attention, write two sentences: “What I want from this is …” and “What it cannot actually give
    me is ….” Then take one concrete step toward the deeper need named in the second sentence.'
