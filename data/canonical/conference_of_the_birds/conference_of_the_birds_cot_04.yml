pratibha_layers:
- kind: original
  label: Original
  body: Ṭūṭī pīsh āmad va az nātavānī-yi safar ʿudhr khwāst; dar qafas maḥbūs būd, qafasī kih jazā-yi
    jamāl-i ū shuda būd.
- kind: translation
  label: Pratibha Translation
  body: The parrot came forward and pleaded that he could not undertake the journey, for he had been imprisoned
    in a cage—a penalty he had to pay for his beauty.
