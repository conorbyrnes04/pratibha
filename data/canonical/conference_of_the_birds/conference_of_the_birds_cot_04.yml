unit_id: conference_of_the_birds.cot_04
unit_label: The Parrot's excuse
title: The Parrot’s Beautiful Captivity
unit_type: teaching_passage
commentary: 'Beauty can become an alibi for refusing transformation. The contested move is the parrot’s
  conversion of a condition imposed upon him—captivity—into a reason not to begin the journey at all.
  His cage is genuinely punitive: it is the price exacted for his beauty. Yet the hoopoe’s larger summons
  in the Manṭiq al-ṭayr does not allow suffering, privilege, or a formed identity to settle the question
  of whether one seeks the Simurgh. In Sufi terms, the parrot risks treating an accidental attribute,
  jamāl, as a self: he is beautiful, therefore guarded; guarded, therefore unable; unable, therefore excused.
  The logic is subtle because it does not deny injury. It reveals how injury can harden into a spiritual
  position. ʿAṭṭār’s birds regularly mistake their defining feature for their destiny, and the parrot’s
  ornament becomes a prison both materially and inwardly. The Seven Valleys require movement beyond such
  fixed claims, not by calling the cage unreal, but by refusing to let it provide the final account of
  the soul’s capacity for quest.'
