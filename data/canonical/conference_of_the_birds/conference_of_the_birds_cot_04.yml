- kind: key_terms
  label: Key Terms
  items:
  - term: طوطی (ṭūṭī)
    definition: Persian for “parrot,” likely mediated through Indic language -> the bird who claims inability
      to travel -> the usual exotic-pet gloss misses its role as a speaker whose valued appearance has
      made it possessable.
  - term: قفس (qafas)
    definition: Arabic qafaṣ, “cage” -> the parrot’s literal confinement -> it also marks a condition
      that can be made into an identity and an excuse.
  - term: جمال (jamāl)
    definition: Arabic, “beauty, loveliness” -> the quality for which the parrot pays a penalty -> the
      default aesthetic gloss misses beauty’s danger when it invites possession or becomes the ground
      of self-definition.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Phaedo, 82e–83b
    resonance: Both figures imagine the soul constrained by bodily or worldly attachment, using imprisonment
      as a structure for thinking about liberation.
    divergence: Plato’s prison is broadly the body and sensory attachment; ʿAṭṭār gives the confinement
      a particular biography of beauty, injury, and self-excusing speech.
  - citation: Jalāl al-Dīn Rūmī, Masnavī, Book I, opening reed-song
    resonance: 'Both Sufi poems begin spiritual motion from separation and constraint: a creature’s pain
      indicates distance from its true home.'
    divergence: Rūmī’s reed turns separation into lament and desire; the parrot initially turns captivity
      into a reason to remain still, making the ethical question one of response to suffering.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one real constraint you have used today as a total explanation for not taking a needed step.
    Write one action that fits inside the constraint rather than waiting for it to disappear, then do
    that action before the day ends.
