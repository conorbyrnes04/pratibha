pratibha_layers:
- kind: original
  label: Original
  body: Bāz az tark-i jāygāh-i ʿizzat bar dast-i pādshāhān ibrāz-i nā-khushnūdī mī-kunad; murg̲h̲ābī bih
    murdāb-hā, būm bih vīrānah-hā, va mūla bih nā-tavānī-yi tan ʿudhr mī-āvarand. Murghān namāyandah-yi
    ādamiyānand va ʿudhr-hāyishān bandagī-yi dunyā rā āshkār mī-kunad.
- kind: translation
  label: Pratibha Translation
  body: 'The Falcon could not bear the thought of giving up his place of honor on the hands of kings.
    The Heron wanted to remain among the lagoons, and the Owl in the ruins where he ruled undisturbed.
    Last came the Wagtail, pleading weakness and physical disabilities that, he said, made the journey
    impossible.


    These birds represent people at different stations in life. Each bird’s particular excuse typifies
    the excuses by which different kinds of people continue to pursue worldly pleasures and comforts.'
