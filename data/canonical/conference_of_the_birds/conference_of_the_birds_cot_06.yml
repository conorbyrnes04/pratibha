- kind: key_terms
  label: Key Terms
  items:
  - term: باز (bāz)
    definition: Persian for “falcon” -> the bird attached to honor at kings’ hands -> the usual gloss
      “falcon” misses its courtly prestige and its temptation to confuse borrowed status with true nearness.
  - term: بوم (būm)
    definition: 'Persian for “owl” -> the undisturbed ruler of ruins -> the default animal gloss misses
      the irony of sovereignty: dominion over desolation can still feel like a kingdom.'
  - term: مولا (mūlā)
    definition: 'A bird-name given in the crib’s Persian note, associated here with the Wagtail -> the
      speaker who cites weakness and bodily incapacity -> the name matters less than the dramatic function:
      limitation can be real while also becoming an excuse against transformation.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Republic, 519c–521b
    resonance: The prisoners’ resistance to leaving the cave structurally resembles the birds’ preference
      for familiar rank and habitat over an arduous ascent toward a truer vision.
    divergence: Plato’s ascent is chiefly epistemic and political, whereas ʿAṭṭār’s journey is Sufi self-emptying
      before the Simurgh; the obstacle is attachment of the self, not merely ignorance.
  - citation: Augustine, Confessions, VIII.5–12
    resonance: Augustine’s divided will repeatedly postpones conversion, much as each bird gives a reason
      not to begin the journey.
    divergence: Augustine dramatizes grace, sin, and a single autobiographical will; the bird assembly
      maps several social and psychological attachments without reducing them to one doctrine of original
      sin.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, write down one reason you have given for postponing a necessary change. Beside it, mark
    what it protects—status, comfort, familiar territory, control, or fear of weakness—then take one ten-minute
    step toward the change that does not deny any real limitation.
