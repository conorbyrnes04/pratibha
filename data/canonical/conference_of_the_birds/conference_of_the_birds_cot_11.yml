unit_id: conference_of_the_birds.cot_11
unit_label: A glance from Solomon
title: The Glance That Exalts
unit_type: teaching_passage
commentary: 'Spiritual achievement, in this Sufi logic, is not a possession earned by the self but an
  event bestowed upon it. The contested move is the displacement of merit: devotion, service, and almsgiving
  are not denied, yet none can mechanically purchase the decisive “glance.” They prepare receptivity,
  while grace remains radically unowned. Solomon, Qurʾanic prophet-king and master of birds, carries more
  than royal authority in the Manṭiq al-ṭayr’s symbolic world: he figures divinely delegated knowledge
  and the sovereign source from which recognition comes. The claim can sound politically dangerous, since
  it makes elevation depend on favor rather than demonstrable labor; it can excuse hierarchy or passivity.
  But ʿAṭṭār counters that danger by requiring a lifetime of service and waiting. Grace is not a substitute
  for practice, but practice stripped of its claim to entitlement. The abrupt turn to Mahmud and the hungry
  orphan sharpens the ethical pressure. A ruler’s wandering gaze encounters deprivation; the lofty doctrine
  of the favorable glance is tested by whether power sees the vulnerable. The passage thus joins mystical
  poverty to literal poverty: the seeker waits for a glance, while the sovereign is answerable for the
  glance he gives.'
