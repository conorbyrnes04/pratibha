- kind: key_terms
  label: Key Terms
  items:
  - term: نظر
    definition: naẓar, “look, gaze” -> the favorable glance that confers spiritual rank -> not a casual
      visual act but efficacious recognition or grace.
  - term: لطف
    definition: 'luṭf, “gentleness, kindness, favor” -> Solomon’s freely granted grace -> more than mere
      kindness: an unpurchasable divine-style bestowal.'
  - term: عبادت
    definition: ʿibādat, from ʿ-b-d, “to serve, worship” -> sustained devotion and service -> default
      “worship” misses the discipline of becoming a servant without claiming wages.
  - term: سلیمان
    definition: Sulaymān, Solomon -> prophetic king and symbolic bestower of favor -> not simply the biblical
      monarch, but a Qurʾanic figure of divinely granted sovereignty and knowledge.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan, 27:15–19
    resonance: Solomon’s exceptional kingdom includes knowledge, command over creatures, and attentiveness
      to a small vulnerable being, the ant; authority is measured by receptive hearing as well as command.
    divergence: The Qurʾanic Solomon gives thanks directly to God, whereas ʿAṭṭār’s framing turns Solomon
      into a symbolic mediator of a transforming glance.
  - citation: Qurʾan, 93:9–10
    resonance: The command not to oppress the orphan or repel the petitioner gives ethical force to the
      later image of Mahmud encountering an impoverished child.
    divergence: The Qurʾanic injunction is direct and universal; the anecdotal court setting concentrates
      the issue in the gaze and responsibility of a ruler.
  - citation: Rūmī, Masnavī, Book I, discourse on grace and effort
    resonance: 'Both Sufi poems hold effort and divine favor together: striving matters, but it cannot
      compel the result it seeks.'
    divergence: Rūmī often dramatizes the paradox through extended argument and parable; ʿAṭṭār condenses
      it into the severe image of a rank conferred by one glance.
- kind: practice
  label: Practice (Abhyasa)
  body: Before spending money or offering advice today, seek out one person whose need you might usually
    pass without noticing. Ask one concrete question about what would help, then provide one practical
    form of help without treating it as a purchase of moral credit.
