pratibha_layers:
- kind: original
  label: Original
  body: 'Sulaymān; naẓar; luṭf; ʿināyat; Sulṭān Maḥmūd. Gist: A rank is said to arise not from ʿibādat
    (devotion), khidmat (service), or wealth, but from Sulaymān’s favorable naẓar, a bestowing glance;
    devotion remains the waiting posture for that grace.'
- kind: translation
  label: Pratibha Translation
  body: '“I received, for a moment, a glance from Solomon,” she said. “This rank was not attained by devotion
    and service alone, nor by spending silver and gold. All this good fortune came from a favorable glance.
    You too should spend your life in devotion and wait for Solomon’s grace. When that grace is granted
    to you, you will rise beyond any station I can describe.”


    One day Sultan Mahmud strayed from his retinue and saw a boy sitting on a riverbank with a fishing
    rod. The boy looked pale and worn. “Why are you so pale and sad, little one?” Mahmud asked. “Sir,”
    said the boy, “there are seven of us children. Our father is dead, and our mother is sick and confined
    to bed. She has not a penny to buy us food.”'
