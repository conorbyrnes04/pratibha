pratibha_layers:
- kind: original
  label: Original
  body: 'یک شبی پروانگان جمع آمدند

    در طلب آن شمع را می‌جستند'
- kind: translation
  label: Pratibha Translation
  body: 'A fly was searching for food. She saw a beehive in a corner. Drunk with desire for honey, she
    cried, “Is there a generous person who will take from me a grain of barley and place me in the midst
    of the hive? When the tree of union bears such fruit, what can be sweeter than honey?”


    A passerby pitied her and set her amid the honey without taking payment. But when the fly found herself
    in the middle of the hive, her feet stuck fast in the honey. The more she fretted and struggled to
    free herself, the tighter her bonds became. In distress she cried, “Alas, violence has killed me!
    This honey has proved more bitter to me than poison. I offered one grain of barley to obtain it.”'
- kind: commentary
  label: Pratibha Commentary
  body: 'Philosophically, desire becomes bondage when it mistakes contact with the desired thing for the
    capacity to receive it. The contested move is the fly’s assumption that “union” is simply entry into
    sweetness: she treats the beehive as a purchasable object, offering a grain of barley for access,
    rather than asking what such proximity will require of her. Her wish is granted without payment, yet
    the gift exposes the poverty of her desire. Honey is not changed in itself; its effect changes because
    the fly cannot move within it. In the Sufi world of Manṭiq al-ṭayr, this is a sharp caution against
    identifying spiritual fulfillment with pleasurable experience, spiritual status, or immediate possession
    of the Beloved. The language of union is deliberately dangerous here. What sounds like completion
    may still be egoic appetite—wanting sweetness for oneself—and that appetite tightens precisely through
