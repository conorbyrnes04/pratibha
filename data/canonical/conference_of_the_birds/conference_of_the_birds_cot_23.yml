sanskrit_iast: 'The supplied Persian marginal lines do not correspond to the fly-and-honey crib: Yak shabī
  parwānagān jamʿ āmadand / dar ṭalab-i ān shamʿ rā mī-jūstand: “One night the moths gathered; seeking
  that candle, they searched for it.” Source-language core inferred from the English includes waṣl (“union”)
  and ʿasal/angabīn (“honey”): the fly desires honey as the fruit of union, is placed within it, and discovers
  that its sweetness fastens her feet.'
