pratibha_layers:
- kind: original
  label: Original
  body: 'بعد از آن بنمایدت پیش نظر

    معرفت را وادیی بی پا و سر'
- kind: translation
  label: Pratibha Translation
  body: 'Another steep valley now appears: the Valley of Mystic Knowledge, which has neither beginning
    nor end. To cross it, you must undergo a very long and tedious journey. There is no road like this
    road.


    Yet the temporal traveler is one thing and the spiritual traveler another. Soul and body are continually
    advancing or declining according to their strength or weakness. The spiritual path is therefore disclosed
    differently to different people, in keeping with their capacities.'
