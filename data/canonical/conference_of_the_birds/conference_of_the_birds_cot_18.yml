original: 'بعد از آن بنمایدت پیش نظر

  معرفت را وادیی بی پا و سر'
sanskrit_devanagari: 'بعد از آن بنمایدت پیش نظر

  معرفت را وادیی بی پا و سر'
sanskrit_iast: Baʿd az ān binumāyadat pīsh-i naẓar / maʿrifat-rā vādī-yi bī pā u sar. “After that there
  appears before your sight the Valley of Maʿrifat, without foot or head”—that is, without a discernible
  beginning or end. The journey through this valley differs according to the traveler’s spiritual faculty.
