- kind: key_terms
  label: Key Terms
  items:
  - term: معرفت (maʿrifat)
    definition: Arabic root ʿ-r-f, “to know, recognize” -> the valley of mystic or inward knowledge ->
      the default gloss “gnosis” can miss its sense of recognition shaped by the seeker’s actual capacity,
      not secret information acquired at will.
  - term: وادی (vādī)
    definition: Arabic wādin, “valley, riverbed” -> the arduous terrain of a stage in the path -> “stage”
      can sound orderly and bounded, whereas this valley is explicitly without a visible beginning or
      end.
  - term: نظر (naẓar)
    definition: Arabic root n-ẓ-r, “looking, seeing, consideration” -> what appears before the seeker’s
      sight -> “vision” alone misses the active, discerning attention implied by the term.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 39:9
    resonance: The question whether those who know are equal to those who do not know likewise makes knowledge
      a distinction in human standing, not a neutral store of facts.
    divergence: The Qur’anic formulation is aphoristic and polemical; ʿAṭṭār dramatizes knowing as an
      extended, exhausting terrain whose disclosure varies with capacity.
  - citation: Abū Ḥāmid al-Ghazālī, al-Munqidh min al-Ḍalāl (Deliverance from Error)
    resonance: Al-Ghazālī similarly distinguishes inherited or merely formal learning from a certainty
      requiring inward transformation and disciplined seeking.
    divergence: Al-Ghazālī frames the issue through an autobiographical crisis and evaluation of schools;
      ʿAṭṭār turns it into a collective allegorical geography, where no final conceptual map is available.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one task you have been postponing because you want to feel fully ready. Spend twenty uninterrupted
    minutes on its smallest concrete beginning, then write one sentence naming the present strength or
    weakness that shaped your effort without treating it as your identity.
