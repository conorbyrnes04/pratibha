- kind: key_terms
  label: Key Terms
  items:
  - term: سیمرغ (sīmurgh)
    definition: Persian name of a great mythical bird -> the radiant source of which the birds are sparks
      -> “phoenix” misses its role as both sovereign object of longing and the ground of the seekers’
      being.
  - term: حجاب (ḥijāb)
    definition: Arabic root ḥ-j-b, “to screen, partition” -> the veil removed from the divine face ->
      “veil” can sound merely visual; here it names the condition that makes manifested multiplicity seem
      separate from its source.
  - term: پرتو (partav)
    definition: 'Persian, “ray, gleam, radiance” -> the rays that become birds by grace -> “ray” misses
      the emanative force: the birds are not merely illuminated by the Simurgh but proceed as its luminous
      disclosure.'
  - term: سایه (sāyah)
    definition: Persian, “shadow” -> the birds’ dependent likeness or reflection -> “shadow” need not
      mean unreality; it emphasizes derivative existence, shaped by but not self-subsisting apart from
      its source.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Ghazālī, Mishkāt al-anwār (The Niche of Lights)
    resonance: Both works use light and graded manifestation to describe how finite perception depends
      upon a supreme source of illumination.
    divergence: Al-Ghazālī chiefly analyzes the hierarchy of lights and perception; ʿAṭṭār dramatizes
      the issue as birds who must be moved from confusion into a perilous collective quest.
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, the Adam chapter
    resonance: The reflection-and-shadow language parallels the claim that creatures disclose divine names
      while possessing no independent self-sufficiency.
    divergence: Ibn ʿArabī gives a technical metaphysical account of manifestation; the Hoopoe makes a
      guarded, pedagogical assertion whose danger lies precisely in what untrained hearers may infer from
      it.
  - citation: Plotinus, Enneads V.1
    resonance: The procession of many realities from a single inexhaustible source resembles the birds’
      emergence as rays from one radiant presence.
    divergence: Plotinian emanation is philosophical and impersonal in form; ʿAṭṭār’s Simurgh is bound
      to longing, concealment, grace, and the ethical ordeal of the seeker.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you catch yourself treating another person as merely separate, pause for one full
    breath and silently name one quality in them that you also carry; do not announce the insight or use
    it to excuse either of you.
