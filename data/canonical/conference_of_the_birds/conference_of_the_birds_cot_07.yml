pratibha_layers:
- kind: original
  label: Original
  body: 'Source-language core (not a reconstructed full line): sīmurgh; ḥijāb; partav; sāyah; murghān.
    Gist: az rūy ḥijāb bardāsht; partavhā murghān shudand; mā az partav-i Sīmurghīm; zindagī va marg yakī
    ast.'
- kind: translation
  label: Pratibha Translation
  body: 'He removed the veil from His face, and it shone resplendent like the sun, casting millions of
    rays around. By His grace, these rays were turned into birds. We are therefore the sparks of the Simurgh.
    When you realize this mystery, your relationship with the Simurgh will be as clear as daylight. But
    beware, my friends: do not reveal this secret to others. It is not a matter to be disclosed to everyone.


    Now that you have learned whose reflection or shadow you are, you will understand that for you, living
    and dying are one and the same. This metaphysical subtlety was too difficult for the bewildered birds
    to understand. The Hoopoe therefore gave an illustration. There was a king, more handsome than all
    other men; his subjects greatly desired to behold his face.'
