work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_07
unit_label: You are the Simurgh's shadow
title: Sparks of the Simurgh
unit_type: teaching_passage
commentary: 'Reality, in this Sufi cosmology, is not made of isolated beings but of manifestations whose
  apparent independence is a veil. The contested move is the leap from resemblance to identity: because
  the birds arise as rays from the Simurgh’s unveiled radiance, the Hoopoe calls them its sparks, reflection,
  or shadow. That claim can sound like a denial of creaturely difference, and it immediately grounds the
  further paradox that life and death are alike. Yet ʿAṭṭār does not present this as ordinary doctrine
  to be broadcast. The injunction to secrecy marks it as a truth requiring transformation, not merely
  information; heard by an unprepared ego, unity may become spiritual self-inflation or fatalism. Within
  Manṭiq al-ṭayr’s Sufi pedagogy, the birds’ bewilderment is crucial: intellectual assent cannot yet carry
  the metaphysical weight of the claim. The Hoopoe therefore turns to an image—a beautiful king withheld
  from his subjects—because desire, absence, and reflected splendor can educate perception where abstraction
  fails. The Simurgh is both transcendent source and the mystery toward which the birds must travel, not
  a possession available at the beginning.'
