work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_01
unit_label: Hoopoe summons the birds
title: The Distant King Behind Qaf
unit_type: teaching_passage
commentary: 'The divine is not absent; it is rendered inaccessible by the kind of self that wants to possess
  it. The contested move is the hoopoe’s conversion of a monarchic quest into a discipline of dispossession:
  she promises neither safety nor private illumination, but demands courage, fearlessness, and “self-effacement”
  as the price of approach. This is characteristic of ʿAṭṭār’s Sufi imagination, where distance from God
  is not chiefly geographical—even Mount Qaf marks a spiritual horizon—but produced by veils of light
  as well as darkness. Darkness names obvious ignorance and attachment; light is more dangerous, since
  spiritual pleasure, knowledge, and visions can also halt the seeker before the Real. The king’s nearness
  therefore intensifies, rather than cancels, the birds’ estrangement. Simurgh is necessary to every soul,
  yet cannot be reached by ordinary acquisition. The communal invitation matters: the path begins with
  a guide gathering scattered desires into a shared resolve, while its end requires fanāʾ, the relinquishment
  of the separate claimant who says “I” could own the vision.'
