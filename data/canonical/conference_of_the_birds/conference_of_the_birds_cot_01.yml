- kind: key_terms
  label: Key Terms
  items:
  - term: سیمرغ (Sīmurgh)
    definition: Middle Persian sēn murw, a fabulous royal bird -> the hidden king sought by all the birds
      -> not merely the later pun “thirty birds,” but the sovereign object of longing whose nearness exposes
      their distance.
  - term: کوه قاف (Kūh-i Qāf)
    definition: Qāf, the Arabic letter qāf and the name of a cosmological encircling mountain -> the far
      boundary behind which Simurgh dwells -> not a mappable mountain, but an image of the limit of ordinary
      access.
  - term: حجاب (ḥijāb)
    definition: Arabic ḥ-j-b, “to screen, seclude” -> the veils of light and darkness before the throne
      -> a veil need not be evil; luminous spiritual attainments may conceal as effectively as ignorance.
  - term: فناء (fanāʾ)
    definition: Arabic f-n-y, “to perish, pass away” -> the self-effacement required for the quest ->
      not simple self-hatred or annihilation of personhood, but the undoing of possessive egohood before
      the Real.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Qushayrī, al-Risāla al-Qushayriyya, Bāb al-fanāʾ wa-l-baqāʾ
    resonance: Both make the loss of self-assertion a condition for abiding in relation to God; attainment
      reverses the seeker’s usual project of self-improvement.
    divergence: The manual defines technical stations and states, whereas the hoopoe turns the teaching
      into a dangerous collective summons under the image of a concealed king.
  - citation: Qurʾān 50:16
    resonance: The Qurʾānic claim that God is nearer than the jugular vein shares the paradox of an intimate
      reality experienced as remote.
    divergence: The verse states divine nearness directly; ʿAṭṭār dramatizes the experiential machinery
      of distance through roads, veils, courage, and the failure of ordinary seeking.
  - citation: Plato, Symposium 210a–212a
    resonance: Diotima’s ascent culminates in a vision that requires leaving lesser objects of desire
      behind, much like the birds’ passage beyond obstructing attachments.
    divergence: Plato’s ascent is ordered toward intelligible Beauty through erotic education; ʿAṭṭār’s
      path centers on divine sovereignty and fanāʾ, where even the seeker’s claim to vision must be surrendered.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, identify one “veil of light”: a praise, achievement, spiritual feeling, or certainty you
    are tempted to treat as final. Name it aloud, then perform one quiet helpful act without mentioning
    it to anyone.'
