pratibha_layers:
- kind: original
  label: Original
  body: Mā-rā pādishāhī ast, yārān; az dargāh-i ū nishānī yāftah-am, ammā ba-tanhāyī dar ṭalab-i ū raftan
    az tawān-i man bīrūn ast. Agar hamrāh-i man shawīd, shāyad ba-āstān-i shāh rasīm. Pādishāh-i mā Sīmurgh
    ast; maqāmash pas-i Kūh-i Qāf ast. Rāh-i taḵht-i ū pur az ḥijāb-hā-yi nūr va ẓulmat ast; bi-fanā rasīdan
    dushvār ast.
- kind: translation
  label: Pratibha Translation
  body: '“We have a king, my friends,” she said. “I have received a sign of his court, but to go alone
    in search of him is beyond my power. If you accompany me, I think we may hope to reach the threshold
    of his Majesty.


    “Yes, my friends, we have a king named Simurgh, whose dwelling is beyond Mount Qaf. He is near, yet
    we are far from him. The road to his throne is strewn with obstacles; more than a hundred thousand
    veils of light and darkness screen the throne. Hundreds of thousands of souls burn with passion to
    see him, but none can find the way. Yet no one can do without him. Supreme courage, utter fearlessness,
    and complete self-effacement are needed to overcome these obstacles. If we gain one glimpse of his
    face, it will indeed be an achievement.”'
- kind: commentary
  label: Pratibha Commentary
