pratibha_layers:
- kind: original
  label: Original
  body: 'بعد ازین وادی فقرست و فنا

    کی بود اینجا سخن گفتن روا

    عین وادی فراموشی بود

    لنگی و کری و بیهوشی بود

    صد هزاران سایهٔ جاوید تو

    گم شده بینی ز یک خورشید تو

    گم شدن اول قدم، زین پس چه بود

    لاجرم دیگر قدم را کس نبود'
- kind: translation
  label: Pratibha Translation
  body: Last comes the Valley of Poverty and Annihilation. How can one describe this steepest of steep
    valleys? The essential features of this valley are forgetfulness, dumbness, deafness, and distraction.
    Here, under a single ray of the spiritual sun, you see countless shadows that surrounded you vanish.
    When the ocean of immensity begins to ruffle its waves, how can the shapes traced upon its surface
    endure? Both worlds are no more than the forms you see on the surface of the ocean. Whoever disputes
    this statement labors under a hallucination. He whose heart is lost in this ocean is lost forever,
    and reposes there in peace. In these quiet waters he finds nothing but oblivion. If it be ever permitted
    to him to return from this oblivion, he will understand what creation is, and many a secret will then
    be divulged to him.
- kind: commentary
  label: Pratibha Commentary
  body: 'Annihilation (fanāʾ) is not death but the obliteration of the self''s illusion of separation
    from the Real. ʿAṭṭār stages this as the seventh and final valley—the contested move is that *return*
    from oblivion is possible and necessary. Against quietist dissolution, the Sufi must emerge from faqr
    (poverty, emptiness) with gnosis intact. The ocean metaphor collapses subject-object duality: waves
    and shadows are the same phenomenon viewed from ignorance or unveiling. Masani''s crib captures the
    paradox—loss as the only true finding—but softens ʿAṭṭār''s more radical claim that the pilgrim who
    enters here may never leave, or leaves transformed beyond recognition. The ''hallucination'' of those
    who deny this is the belief in persistent selfhood.'
- kind: key_terms
  label: Key Terms
  items:
  - term: فنا (fanāʾ)
    definition: Lit. 'annihilation, passing away.' In Sufism, the extinction of the ego-self and its attributes
      before the divine reality; not negation but the unveiling that the separate self never truly existed.
      Here it is the destination, not the path.
  - term: فقر (faqr)
    definition: Lit. 'poverty, need.' Spiritual destitution—the state of owning nothing, not even the
      illusion of ownership. Paired with fanāʾ, it denotes the valley where all claims to knowledge, will,
      and existence are surrendered.
  - term: سایه (sāyah)
    definition: Shadow, phantom. In ʿAṭṭār's cosmology, the phenomenal world and the ego-self are shadows
      cast by the one light; their vanishing reveals the source, not emptiness.
  - term: خورشید (khurshīd)
    definition: Sun, here the 'spiritual sun'—the divine light or unveiling (tajallī) under which all
      shadows of multiplicity dissolve into unity.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, 'The Seal of the Prophets'
    resonance: Both texts posit annihilation as the threshold of true knowledge (maʿrifah). The self must
      be unmade so that divine attributes alone remain. The 'ocean of immensity' parallels Ibn ʿArabī's
      concept of the undifferentiated divine reality (al-ḥaqq) from which all forms emerge and into which
      they return.
    divergence: Ibn ʿArabī emphasizes the eternal return of forms within the divine knowledge; ʿAṭṭār
      stresses the irreversibility of the crossing—'if it be ever permitted to return'—making fanāʾ less
      a cyclical emanation and more an apocalyptic threshold.
  - citation: Rūmī, Masnavī, Book I, 'The Reed Flute'
    resonance: Both use the metaphor of the reed severed from the reed-bed and the lover separated from
      the Beloved to evoke the pain and necessity of annihilation. The 'forgetfulness' and 'dumbness'
      here echo Rūmī's silencing of the rational mind.
    divergence: Rūmī's reed laments and sings; ʿAṭṭār's valley is mute and oblivious. Rūmī preserves the
      emotional intensity of longing; ʿAṭṭār dissolves even longing into the 'quiet waters' of non-being.
  - citation: Plotinus, Enneads, VI.9, 'On the Good or the One'
    resonance: 'The via negativa: the One is beyond all predication, all form, all multiplicity. Union
      requires the stripping away of the individual intellect. The ''hallucination'' of those who deny
      the ocean''s reality parallels Plotinus''s critique of those who mistake the sensible for the intelligible.'
    divergence: Plotinus's ascent is intellectual and contemplative; ʿAṭṭār's is experiential and annihilating.
      The Neoplatonic return to the One preserves the soul's essence; the Sufi fanāʾ erases the distinction
      between returner and return.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, sit for ten minutes in a place where you cannot speak or be heard—a closet, a parked car,
    a silent room. Do not meditate on anything. Instead, notice what you habitually reach for to confirm
    you exist: a thought, a sensation, a memory, a plan. Each time, let it dissolve like a shadow under
    sunlight. Do not try to make yourself disappear. Simply observe the disappearing. When the ten minutes
    end, do not rush to speak or move. Sit another minute in the quiet that remains.'
