unit_label: Valley of Poverty and Annihilation
title: The Valley of Annihilation
unit_type: teaching_passage
commentary: 'Annihilation (fanāʾ) is not death but the obliteration of the self''s illusion of separation
  from the Real. ʿAṭṭār stages this as the seventh and final valley—the contested move is that *return*
  from oblivion is possible and necessary. Against quietist dissolution, the Sufi must emerge from faqr
  (poverty, emptiness) with gnosis intact. The ocean metaphor collapses subject-object duality: waves
  and shadows are the same phenomenon viewed from ignorance or unveiling. Masani''s crib captures the
  paradox—loss as the only true finding—but softens ʿAṭṭār''s more radical claim that the pilgrim who
  enters here may never leave, or leaves transformed beyond recognition. The ''hallucination'' of those
  who deny this is the belief in persistent selfhood.'
