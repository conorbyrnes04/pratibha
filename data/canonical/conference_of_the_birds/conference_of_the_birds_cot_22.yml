sanskrit_iast: Baʿd az īn vādī-yi faqr ast va fanāʾ. Kī buvad īnjā sukhan guftan ravāʾ. ʿAyn-i vādī farāmūshī
  buvad, langī va kārī va bīhūshī buvad. Ṣad hazāran sāyah-yi jāvīd-i tu gum shudah bīnī az yak khurshīd-i
  tu.
