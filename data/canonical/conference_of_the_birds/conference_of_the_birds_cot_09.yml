- kind: key_terms
  label: Key Terms
  items:
  - term: شیخ
    definition: Arabic shaykh, “elder” or “master” -> the revered spiritual teacher San'an -> not merely
      an old man or cleric, but the public bearer of a disciplic lineage and communal trust.
  - term: مکه
    definition: 'Arabic Makkah -> the saint’s home and seat of authority -> more than a geographical city:
      it signifies sacred centrality, lawful devotion, and recognized religious standing.'
  - term: روم
    definition: Persian/Arabic Rūm, from “Rome,” conventionally Byzantium -> the destination demanded
      by the dream -> not just a foreign land, but a symbolic outside where inherited religious security
      is exposed.
  - term: سجده
    definition: Arabic sajdah, from the root s-j-d, “to bow/prostrate” -> the act seen in the dream before
      an idol -> the default gloss “prostration” misses its charged reversal of worship, submission, and
      identity.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: The Qur'an, Joseph 12:4–6
    resonance: Joseph’s dream initiates a future crisis whose meaning exceeds the dreamer’s present understanding;
      interpretation requires endurance through events rather than immediate certainty.
    divergence: Joseph’s dream confirms an eventual election, whereas San'an’s dream threatens established
      sanctity with disgrace. The difference makes Attar’s test an assault on spiritual self-possession.
  - citation: Abū Ḥāmid al-Ghazālī, al-Munqidh min al-Ḍalāl (Deliverance from Error), opening account
      of doubt
    resonance: Both figures leave a position of celebrated religious authority when inner certainty is
      disturbed, treating public rank as inadequate protection against spiritual error.
    divergence: Ghazali narrates an intellectual and ethical withdrawal from teaching; San'an’s trial
      is dream-driven, bodily symbolic, and directed toward the religiously foreign space of Rūm.
  - citation: Dante Alighieri, Inferno I.1–30
    resonance: A respected traveler is displaced from a known path and compelled to begin a journey because
      ordinary orientation has failed.
    divergence: Dante’s dark wood signals evident lostness, while San'an begins at the summit of visible
      holiness. Attar therefore makes the crisis arise within, not before, religious accomplishment.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one recurring fear, dream, or inward resistance that you have dismissed because it
    conflicts with your public image. Tell one trusted person exactly what it is, then take one modest,
    lawful step toward examining it rather than protecting your reputation from it.
