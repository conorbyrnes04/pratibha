work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_09
unit_label: Shaykh Sanʿān
title: The Saint’s Dream of Byzantium
unit_type: teaching_passage
commentary: 'Spiritual authority becomes credible not by avoiding humiliation but by undergoing the limits
  of its own self-knowledge. Shaykh San''an possesses nearly every public sign of sanctity: long discipline,
  learning, disciples, healing breath, and leadership in Mecca. Yet a repeated dream places him in Rūm,
  outside the sacred center, performing sajdah before a but, an idol. The contested move is his decision
  to leave Mecca and submit his established authority to the danger disclosed by a dream rather than dismissing
  it as unworthy of a saint. In the Sufi imagination of Manṭiq al-ṭayr, this is not a simple endorsement
  of dreams as private revelation. It is a dismantling of confidence in acquired rank and visible piety.
  Makkah marks the center of law, communal recognition, and devotion; Rūm conventionally marks estrangement,
  religious difference, and trial. The dream’s scandal is therefore deliberate: outward purity does not
  guarantee that the self has ceased to seek security in its own purity. His four hundred disciples intensify
  the risk, since a master’s inward crisis also tests the community that has made him its guide.'
