pratibha_layers:
- kind: original
  label: Original
  body: 'Core terms: Shaykh-i Ṣanʿān; Makkah; Rūm; sajdah; but. Gist: Shaykh-i Ṣanʿān, pīr-i Makkah va
    rāhbar-i murīdān, dar khwāb dīd kih az Makkah bih Rūm raftah ast va pīsh-i but sajdah mīkunad. Az
    īn khwāb fitnah-yi buzurg rā bīm dāsht va bā chahārṣad murīd bih Rūm raft.'
- kind: translation
  label: Pratibha Translation
  body: 'Shaykh San''an was a saint renowned in Mecca for devotion, austerity, and an unequalled knowledge
    of Sufism. For fifty years he had been the acknowledged leader of Mecca’s learned men and the distinguished
    teacher of hundreds of disciples. His purity was such, and his natural gift for miracles so great,
    that a single breath could cure the worst illnesses.


    For several nights in succession, the saint dreamed that he had gone from Mecca to Byzantium and was
    prostrating himself before an idol. He told his disciples that he feared a grave calamity awaited
    him; rather than remain in suspense, he would go to Byzantium to seek the dream’s meaning. All four
    hundred of his followers went with him.'
- kind: commentary
  label: Pratibha Commentary
