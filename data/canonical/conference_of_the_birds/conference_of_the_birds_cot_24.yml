- kind: key_terms
  label: Key Terms
  items:
  - term: سیمرغ (Sīmurgh)
    definition: 'Possibly from Iranian mythic bird traditions -> the supreme object whom the birds seek
      -> more than a fabulous bird or a reward-giving deity: the sought reality itself.'
  - term: طلب (ṭalab)
    definition: Arabic root ṭ-l-b, “to seek, demand” -> asking for the Simurgh alone -> not ordinary petition;
      it marks desire purified of subsidiary aims.
  - term: فراق (firāq)
    definition: Arabic root f-r-q, “division, parting” -> Ayaz’s pain at being drawn away from the king
      -> more than physical absence; it is divided attention and estrangement from the beloved.
  - term: عشق (ʿishq)
    definition: Arabic term for consuming love -> the love Ayaz models for Mahmud and the seeker directs
      toward the Lord -> not mere emotional intensity, but a preference that demotes every competing good.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Rābiʿa al-ʿAdawiyya, prayer on love
    resonance: 'Rābiʿa’s refusal to worship for paradise or from fear of hell shares the Hoopoe’s rejection
      of transactional devotion: God is sought for God’s sake.'
    divergence: Rābiʿa frames the issue through reward and punishment, while Ayaz’s crown makes distraction
      and delegated power the central danger.
  - citation: Jalāl al-Dīn Rūmī, Masnavī, Book I, “The King and the Handmaiden”
    resonance: Both poems use a kingly figure to stage a desire whose truth is disclosed by what worldly
      goods cannot satisfy.
    divergence: Rūmī’s tale unfolds through illness, healing, and hidden attachment; ʿAṭṭār’s compressed
      exemplum makes exclusive longing itself the lesson.
  - citation: The Gospel of Matthew, 6:33
    resonance: The command to seek the kingdom first similarly reorders lesser needs beneath a primary
      pursuit.
    divergence: 'Matthew promises that other things will be added, whereas the Hoopoe presses further:
      even asking for additions risks missing the beloved himself.'
- kind: practice
  label: Practice (Abhyasa)
  body: Today, before making one request—for help, recognition, comfort, or success—pause and name the
    deeper presence or relationship you actually seek; then make your request without treating the result
    as a substitute for that deeper aim.
