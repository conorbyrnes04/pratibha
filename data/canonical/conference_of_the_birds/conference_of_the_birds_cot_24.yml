work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_24
unit_label: Ask nothing of the Simurgh
title: Ask for the King Alone
unit_type: teaching_passage
commentary: 'Devotion becomes free only when it refuses to turn the beloved into an instrument of reward.
  The contested move is the Hoopoe’s rebuke of a seemingly reasonable religious question: what benefit
  may one request from the Simurgh? His answer rejects not merely greed but the devotional logic of exchange.
  To ask for rank, safety, knowledge, or even a spiritual “result” still places something beside the sought
  one. Ayaz’s tears make the claim concrete. The crown is not evil; it is a distraction because rule would
  bind him to affairs that divide his attention from Mahmud. Within the Sufi grammar of Manṭiq al-ṭayr,
  the king is a figure for the Real, and Ayaz exemplifies love that seeks presence rather than possession.
  Yet the anecdote is deliberately uncomfortable: it treats political responsibility as an interruption,
  not an accomplishment. Its point is not that worldly duties have no worth, but that they cannot be the
  final object of desire. The default gloss of “adoration” can sound like praise or ritual observance;
  here it means single-hearted orientation, in which even a crown counts as separation if it becomes an
  end in itself.'
