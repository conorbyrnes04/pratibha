pratibha_layers:
- kind: original
  label: Original
  body: 'Sīmurg rā chūn biyābīm, az ū chih khwāhīm? Hūd-hūd guft: az ū chīzī makhwāhīd; khūd-i ū rā bikhwāhīd.
    Maḥmūd sulṭān tāj-i khwīsh rā bi-Ayāz dād, ammā Ayāz girist: man جز pādishāh hīch namīkhwāham. Sīmurg;
    Hūd-hūd; sulṭān Maḥmūd; Ayāz; pādishāh; firāq.'
- kind: translation
  label: Pratibha Translation
  body: '“What shall we ask of the Simurgh when we meet Him?” another bird asked. This foolish question
    roused the Hoopoe’s indignation. “O ignorant one, why ask anything of Him? Ask for Him, and Him alone.
    Listen to this story.


    One day Sultan Mahmud offered his crown to his favorite slave, Ayaz. All the courtiers burned with
    jealousy. But Ayaz began to weep. Asked why he grieved amid such good fortune, he said: “I have nothing
    to do with anything but the King. I want him alone. By giving me the crown, he wishes to occupy me
    with the affairs of state and withdraw himself from me. My heart bleeds at the thought of separation.”


    “If you wish to know how to adore the Lord,” said the Hoopoe, “learn it from Ayaz.”'
