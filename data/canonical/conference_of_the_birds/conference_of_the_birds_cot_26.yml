work_id: conference_of_the_birds
work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_26
unit_label: Millions set out
title: The Cost of Seeking the Simurgh
unit_type: teaching_passage
commentary: 'Spiritual truth is not measured by the grandeur of one’s intention but by what remains when
  intention has been stripped of comfort, spectacle, and self-protection. The contested move is the poem’s
  severe economy of loss: it treats death, exhaustion, bewilderment, and distraction not merely as unfortunate
  interruptions but as disclosures of the seeker’s attachment. This is not a simple praise of suffering.
  The birds fail in distinct ways: bodily limitation arrests some, terror or hunger undoes others, marvels
  paralyze others, and beauty seduces still others into mistaking pleasure along the road for the end
  of the road. Within the Sufi architecture of the Manṭiq al-ṭayr, the road toward the Sīmurgh is therefore
  also a diagnosis of the nafs, the self that continually makes an object of rest, safety, wonder, or
  enjoyment. The supplied Persian closure intensifies the paradox: an innumerable host sets out, while
  only thirty arrive, broken and depleted. “Thirty birds” also presses toward the poem’s famous wordplay,
  sī murgh/Sīmurgh, but the point is not a triumphant elite. Arrival appears only after the imagined spiritual
  hero has become weak, wounded, and unable to claim the journey as personal achievement.'
themes:
- quest
- love
- annihilation
- simurgh
