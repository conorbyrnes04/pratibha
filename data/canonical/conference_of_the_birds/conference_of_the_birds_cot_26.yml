pratibha_layers:
- kind: original
  label: Original
  body: 'زین سخن مرغان وادی سر به سر

    سرنگون گشتند در خون جگر

    عالمی پر مرغ می‌بردند راه

    بیش نرسیدند سی آن جایگاه

    سی تن بی‌بال و پر، رنجور و سست

    دل شکسته، جان شده، تن نادرست'
- kind: translation
  label: Pratibha Translation
  body: 'The burden of their mission was too heavy for their tiny shoulders, mere handfuls of bones that
    they were. Their souls grew restless, and many gave up their lives at the very first stage. The rest
    went on with patience and courage, continuing their march for years.


    Several died on the road; others drowned in the sea; others gave their lives on mountain summits.
    Some were roasted by the sun’s heat; some fell prey to jackals and tigers in the wilderness. Many
    died of thirst in the forest; others went mad with hunger and killed themselves. Some lagged behind,
    disabled by fatigue or wounds; others could go no farther, bewildered by the wonders and mysteries
    of the road. Some were enchanted by lovely scenery and began enjoying themselves, forgetting that
    they had set out in search of the Simurgh.


    At these words all the birds of the valley fell headlong into heart’s blood. A world full of birds
    took the road, but no more than thirty reached that place: thirty, wingless and featherless, sick
    and weak, with broken hearts, spent souls, and ruined bodies.'
