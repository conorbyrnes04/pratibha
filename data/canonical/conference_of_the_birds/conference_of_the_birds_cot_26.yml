- kind: key_terms
  label: Key Terms
  items:
  - term: سیمرغ (Sīmurgh)
    definition: Middle Persian sēnmurw, the name of a mythic beneficent bird -> the sought sovereign of
      the birds -> the usual gloss “fabulous bird” misses its Sufi function as the goal in which the seekers’
      separate identities are radically questioned, as well as the poem’s sī murgh (“thirty birds”) wordplay.
  - term: وادی (vādī)
    definition: Arabic wādī, “valley, riverbed” -> the terrain through which the birds travel -> “valley”
      can sound merely geographical; in the Sufi sequence it names a condition of consciousness with its
      own trials and attachments.
  - term: صبر (ṣabr)
    definition: Arabic root ṣ-b-r, “to restrain, endure” -> the patience with which some birds continue
      -> “patience” can suggest passive waiting, whereas ṣabr is active steadfastness under pressure and
      against the impulse to turn back.
  - term: جگر (jigar)
    definition: Persian “liver,” conventionally the seat of deep feeling and courage -> “heart’s blood”
      in the image of the birds falling into blood -> the default anatomical gloss misses an idiom of
      inward anguish, grief, and visceral resolve.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dante Alighieri, Inferno, Canto I
    resonance: Both journeys begin with disorientation and make the road a test of whether the traveler
      can move beyond fear and diversion toward a reality not available from ordinary life.
    divergence: Dante receives an authoritative guide and follows a providential itinerary; ʿAṭṭār’s birds
      are a collective of seekers whose losses expose attachment rather than a fixed moral taxonomy.
  - citation: Bhagavad Gītā, 2.47–2.48
    resonance: 'Both works oppose fixation on pleasant outcomes: the seeker must act steadily without
      allowing gain, loss, or immediate experience to dictate the path.'
    divergence: The Gītā grounds disciplined action in dharma and devotion to Kṛṣṇa; the birds’ ordeal
      foregrounds annihilation of self-regard and the deceptive attractions encountered within mystical
      travel.
  - citation: John Bunyan, The Pilgrim’s Progress, Part I, “Vanity Fair”
    resonance: A journey toward ultimate salvation is endangered when attractive social and sensory goods
      become ends in themselves rather than passing occasions.
    divergence: Bunyan’s fair is an identifiable worldly institution opposed to pilgrimage; here even
      natural beauty and spiritual marvel can distract, making the danger inwardly subtler.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before making one optional pleasure purchase or opening one habitual distraction today, pause
    for sixty seconds and write one sentence: “What am I seeking through this?” Then either proceed deliberately
    or decline it; do not let the attraction decide without being named.'
