sanskrit_iast: 'Gist (not a line-for-line reconstruction): bār-i risālat bar shānah-hā-yi khurd sangīn
  būd; murghān dar āghāz-i rāh jān dādand, va andakī bā ṣabr va jurʾat pīsh raftand. Zīn sukhan murghān-i
  vādī sar-ba-sar sarnigūn gashtand dar khūn-i jigar; ʿālamī pur murgh mīburdand rāh, bīsh narasīdand
  sī ān jāygāh. Terms: sīmurgh; vādī; ṣabr; jigar; rāh.'
