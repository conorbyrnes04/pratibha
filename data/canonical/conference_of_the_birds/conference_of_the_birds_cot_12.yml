pratibha_layers:
- kind: original
  label: Original
  body: ʿIzrāʾīl, firishtah-yi marg, rāh-i khwud rā khwāhad yāft. Agar tawānī ān rā pur kunī, bāshad;
    wa illā az kākh o tāj o takht chih sūd? Chūn ʿIzrāʾīl bar dar bikūbad, ān khānah chūzakh-sān shawad.
- kind: translation
  label: Pratibha Translation
  body: Azrael, the Angel of Death, will find his way. If you can manage to fill it up, do so. If not,
    what use are your palace, your crown, and your throne? The mansion may now seem as beautiful and lovely
    as paradise itself; but when the Angel of Death knocks at its door, it will be as dreadful and loathsome
    as hell.
- kind: commentary
  label: Pratibha Commentary
  body: 'Mortality overturns the value assigned to possession: what seems secure becomes useless when
    its owner can no longer inhabit it. The contested move is not merely a conventional memento mori,
    but the claim that royal sovereignty, architectural beauty, and even paradise-like domestic pleasure
    are exposed as radically insufficient by death. The speaker does not deny that the mansion is lovely;
    rather, death changes its meaning. Its splendor is contingent upon the living person who mistakes
    residence for permanence. In the Sufi moral horizon of ʿAṭṭār’s Manṭiq al-ṭayr, this is an attack
    on attachment to mulk, worldly dominion, and on the nafs that imagines status can provide refuge.
