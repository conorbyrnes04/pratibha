- kind: key_terms
  label: Key Terms
  items:
  - term: عزرائیل (ʿIzrāʾīl)
    definition: 'A name formed in the Semitic theophoric pattern, conventionally rendered Azrael -> the
      Angel of Death who inevitably reaches the householder -> the default gloss “angel of death” can
      miss his revelatory role: he discloses the limits of rank, ownership, and delay.'
  - term: ملك (mulk)
    definition: From the Arabic root m-l-k, rule, possession, kingship -> the crown, throne, and palace
      implied by the address -> “kingdom” is too political; it includes the possessive fantasy that what
      one controls can secure the self.
  - term: نفس (nafs)
    definition: Arabic for self, soul, or animating person -> the attached self that delights in a paradise-like
      mansion -> “ego” is too narrow, since the term also names the self requiring discipline and transformation.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, 3:185
    resonance: Both make death the unavoidable event before which worldly enjoyment is measured rather
      than treated as final.
    divergence: The Qur’anic verse moves toward recompense and salvation, while the present image dwells
      on the sudden ugliness of the abandoned dwelling and the collapse of worldly shelter.
  - citation: Abū Ḥāmid al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book 40, “The Remembrance of Death and the Afterlife”
    resonance: Both use recollection of death to unmask long projects of acquisition, prestige, and habitation
      as spiritually unstable.
    divergence: Ghazālī develops disciplines of remembrance and repentance; the compressed bird-poem voice
      strikes through a single dramatic knock at the door.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand for two minutes at the entrance of the place you most identify as yours, name one possession
    or status it represents, and write one concrete use of it today that serves someone beyond your own
    security.
