unit_label: Treasure already in the seat
title: The Peril of Saying I
unit_type: teaching_passage
commentary: 'Ego is most dangerous when it mistakes its own self-image for moral or spiritual achievement.
  The contested move is making Iblis the teacher of Moses: the adversary speaks true counsel, yet remains
  the exemplary victim of the very error he names. In the Qurʾanic account, Iblis’s refusal to bow before
  Adam is bound to a self-asserting claim of superiority; ʿAṭṭār turns that cosmic rebellion into a compact
  lesson on the pronoun “I.” The warning is not against ordinary grammatical speech or responsible personhood.
  It targets khvudparastī, self-worship: the mind’s attachment to its supposed virtues, attainments, and
  special standing. Within the Sufi horizon of Manṭiq al-ṭayr, truth is not reached by accumulating flattering
  descriptions of oneself, but by seeing through the claimant who possesses them. Moses’s visit intensifies
  the paradox: even prophetic dignity must receive correction where the ego can appropriate dignity as
  possession. Iblis’s advice is thus not a redemption of Satan. It is an irony: one who knows the anatomy
  of pride from within can state its remedy, while being unable—or unwilling—to undergo it.'
