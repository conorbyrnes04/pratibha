pratibha_layers:
- kind: original
  label: Original
  body: 'Khvudparastī; Iblīs; ḥaqīqat; Mūsā. Gist: Dar khvudparastī gharq shudī; dīv ba sar-at rāh yāft.
    Kamāl u hunar-i tu pindār ast; tā dar andīsha-hā-yi shayṭānī bāshī, az ḥaqīqat dūr mīmānī.'
- kind: translation
  label: Pratibha Translation
  body: 'You have drowned completely in egotism. The Devil has entered your head. All your perfections
    and virtues are mere figments of your imagination. As long as such devilish thoughts haunt you, you
    will remain far from the truth. Listen to this story.


    One day God Almighty commanded Moses to learn a secret from Iblis, Satan. Moses went to Iblis and
    asked him to teach him a secret. Iblis said, “Remember this one lesson: never say ‘I’; otherwise you
    will find yourself in the same condition as I am.”'
- kind: commentary
  label: Pratibha Commentary
  body: 'Ego is most dangerous when it mistakes its own self-image for moral or spiritual achievement.
    The contested move is making Iblis the teacher of Moses: the adversary speaks true counsel, yet remains
    the exemplary victim of the very error he names. In the Qurʾanic account, Iblis’s refusal to bow before
    Adam is bound to a self-asserting claim of superiority; ʿAṭṭār turns that cosmic rebellion into a
