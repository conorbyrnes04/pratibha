    unwilling—to undergo it.'
- kind: key_terms
  label: Key Terms
  items:
  - term: خودپرستی (khvudparastī)
    definition: khvud, “self,” + parastī, “worship/service” -> egotism or self-worship -> more than healthy
      self-concern; it is treating one’s imagined excellence as an object of devotion.
  - term: ابلیس (Iblīs)
    definition: Arabic Iblīs, the Qurʾanic adversary -> Satan, who counsels Moses against saying “I” ->
      not merely a stock villain, but the ironic authority on pride’s ruin.
  - term: حقیقت (ḥaqīqat)
    definition: Arabic ḥaqīqah, “reality, what is true” -> the truth from which egotistic thoughts keep
      one distant -> not just correct information, but reality as spiritually disclosed beyond self-display.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan, al-Aʿrāf 7:11–18
    resonance: Both works make Iblis’s fall hinge on self-assertion and a claim of superiority before
      a divine command.
    divergence: The Qurʾanic scene presents refusal and judgment; ʿAṭṭār recasts its moral logic as a
      teaching encounter with Moses, making Satan’s self-knowledge pedagogically useful without softening
      his revolt.
  - citation: Luke, Gospel of Luke 18:9–14
    resonance: The Pharisee’s self-congratulatory prayer and the tax collector’s abasement similarly contrast
      moral self-possession with a posture emptied of self-justification.
    divergence: Luke frames the issue through justification before God and social-religious status; ʿAṭṭār
      presses toward the Sufi undoing of the ego’s claim to possess virtue at all.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, catch one moment when you silently rehearse a virtue, achievement, or superiority. Do not
    deny the fact; write one sentence naming the hidden “I” that wants credit, then spend five minutes
    doing one helpful task anonymously.
