work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_08
unit_label: Love above faith and heresy
title: Love Beyond Faith and Unbelief
unit_type: teaching_passage
commentary: 'Love is presented as an authority that unmakes every authority by which the self protects
  itself. The contested move is not merely the preference of mystical feeling over formal religion; it
  is the claim that ʿishq can carry a seeker beyond the opposed verdicts of īmān and kufr. In the Sufi
  logic of the Manṭiq al-ṭayr, these terms name real and weighty boundaries, yet they can become possessions
  of the ego: identities one guards, displays, and uses to remain secure. “Soul” here means both life
  and the self that clings to life. Its sacrifice is therefore the surrender of self-preservation, reputation,
  and spiritual ownership.


  The Hoopoe speaks as guide to birds still crowded with excuses, and the announcement introduces Shaykh
  Sanʿān’s scandalous ordeal. The point is deliberately dangerous: if “beyond faith” were taken as permission
  to despise ethical or religious form, it would simply replace one ego-identity with another. ʿAṭṭār
  instead presses toward a love in which neither piety nor accusation can be used as a final measure of
  the lover. The paradox tests whether faith is a defended badge or an exposure to the Beloved that strips
  away the one who claims it.'
