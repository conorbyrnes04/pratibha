pratibha_layers:
- kind: original
  label: Original
  body: 'Gist, not a line-for-line transcription: ʿĀshiq az jān nayandīshad; jān dar rāh-i tū māniʿ ast,
    īthārash kun. Gar īmān rā ham bā jān bāyad dād, bidih. ʿIshq az īmān u kufr bartar ast; kasī kih dar
    maqām-i ʿishq ustuwār shavad, az har du miguzarad.'
- kind: translation
  label: Pratibha Translation
  body: 'Whoever has become a lover should never think of his own life. Your soul is an obstacle in your
    path: sacrifice it. If you are required to sacrifice your faith along with your soul, do so without
    hesitation.


    If anyone calls you an unbeliever, tell him that love holds a station higher than religion and has
    nothing to do with faith or heresy. Whoever plants his feet firmly in love’s abiding-place passes
    beyond both unbelief and faith. To illustrate this astonishing claim, the Hoopoe told the birds the
    story of Shaykh San''an.'
