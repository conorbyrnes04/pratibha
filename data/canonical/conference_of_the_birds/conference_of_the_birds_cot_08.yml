- kind: key_terms
  label: Key Terms
  items:
  - term: عشق (ʿishq)
    definition: Arabic root ʿ-sh-q, associated with passionate, clinging love -> the consuming force that
      demands the lover’s self-surrender -> “romance” misses its ascetic and metaphysical force.
  - term: جان (jān)
    definition: Persian for life, soul, or vital self -> the life the lover is told to relinquish because
      it obstructs the path -> “soul” can miss its sense of survival, self-interest, and personal possession.
  - term: ایمان (īmān)
    definition: Arabic root ʾ-m-n, security and trusting belief -> faith treated as something that may
      itself be surrendered in love’s extremity -> “belief” misses its communal, salvific, and identity-forming
      weight.
  - term: کفر (kufr)
    definition: Arabic root k-f-r, to cover or conceal -> unbelief, and the public charge of being an
      infidel -> “heresy” misses both the theological accusation and its power to police belonging.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān, 2:165
    resonance: The verse makes the believers “stronger in love for God,” joining devotion and love as
      the highest intensity of religious life.
    divergence: The Qurʾānic formulation intensifies faith, whereas ʿAṭṭār’s Hoopoe risks saying that
      love outruns the very opposition between faith and unbelief; that excess creates the passage’s scandal.
  - citation: Rābiʿa al-ʿAdawiyya, prayer transmitted in Farīd al-Dīn ʿAṭṭār, Tadhkirat al-Awliyāʾ, Rābiʿa
      entry
    resonance: Rābiʿa rejects worship motivated by fear of Hell or desire for Paradise, so love displaces
      spiritual calculation and self-interest.
    divergence: Her prayer purifies the motive of worship while retaining its devotional frame; the Hoopoe’s
      formulation more sharply exposes faith itself to the risk of becoming an ego-possession.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, write down one religious, moral, or intellectual label you feel compelled to defend. Beneath
    it, name one concrete fear—loss of respect, safety, belonging, or certainty—that makes you defend
    it. Spend ten minutes doing one uncredited act of care for someone, without mentioning the label or
    seeking recognition for it.
