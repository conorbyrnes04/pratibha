- kind: key_terms
  label: Key Terms
  items:
  - term: لیلی (Laylī)
    definition: From Arabic layl, “night,” and the name of Majnun’s beloved -> the sought-for beloved
      -> a mere romantic name misses its Sufi function as an image for the Real and for consuming desire.
  - term: مجنون (Majnūn)
    definition: Arabic majnūn, “mad, possessed,” from j-n-n, to conceal or cover -> Layla’s seemingly
      irrational lover -> “madman” misses the possibility that social unreason can register fidelity beyond
      respectable calculation.
  - term: فقر (faqr)
    definition: Arabic faqr, “poverty, need” -> the poor dust-sifter’s material lack -> the default gloss
      misses the contrast between outward deprivation and inward neediness or greed.
  - term: طلب (ṭalab)
    definition: Arabic ṭalab, “seeking, quest” -> Majnun’s search in every place -> “search” misses its
      technical Sufi force as the initiating posture of the traveler toward God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jalāl al-Dīn Rūmī, Mathnawī, Book III, “Moses and the Shepherd”
    resonance: Both narratives unsettle a pious observer who judges devotion by proper language or proper
      location, while an apparently improper lover displays a more radical attachment.
    divergence: Rūmī defends the shepherd’s direct speech to God; Majnun’s tale concerns the geography
      of seeking. The difference matters because ʿAṭṭār tests not ritual speech but the seeker’s prior
      map of where the Beloved may appear.
  - citation: Gospel of Matthew 13:45–46, “The Pearl of Great Price”
    resonance: 'A pearl condenses incomparable value: ordinary calculations of worth are overturned by
      a single ultimate object of desire.'
    divergence: Matthew’s merchant recognizes and purchases the pearl decisively, whereas Majnun searches
      through dust without possession. ʿAṭṭār stresses quest and vulnerability to encounter rather than
      a completed transaction.
  - citation: Abū Ḥāmid al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of Poverty and Abstinence
    resonance: Both distinguish material lack from the inward relation to possessions, making poverty
      ethically and spiritually ambiguous.
    divergence: Ghazālī analyzes dispositions systematically; the Mahmud anecdote dramatizes the distinction
      through a rebuke. Its sharpness prevents Majnun’s total search from being confused with mere desire
      for more.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, choose one ordinary place you usually dismiss—a queue, a sidewalk, a sink full of dishes—and
    spend five minutes there seeking one concrete sign of what you most value, without buying, collecting,
    or scrolling for anything.
