  body: 'Rūzī Majnūn dar miyān-i rāh khāk mībīkht. Mard-i zāhidī guft: “Ey Majnūn, īnjā chih mījūyī?”
    Guft: “Laylī mījūyam.” Guft: “Laylī rā dar īn khāk chigūnah yābī?” Majnūn guft: “Har jā mījūyam tā
    rūzī yak jā biyābam.” Maḥmūd sultān mard-i faqīrī rā dīd kih dar gard-o-khāk dar jستujū-yi khurda-chīz-hā
    būd.'
- kind: translation
  label: Pratibha Translation
  body: 'One day Majnun was sifting earth in the middle of a road. A pious man said to him, “Majnun, what
    are you seeking here?” “I seek Layla,” Majnun replied. “How can you find Layla here?” said the other.
    “Could a pearl so pure be found in such rubbish?” “Still,” said Majnun, “I seek her everywhere, so
    that one day I may find her somewhere.”


    One evening Sultan Mahmud saw a poor man sifting dust for small valuables. Mahmud threw his diamond
    wristlet into the heap of dust the man had gathered. The next evening he returned and found the man
    at the same work. “What you found yesterday,” said the king, astonished at the man’s greed, “would
    have maintained you for ten lives; yet today you are still grovelling in the dust.”'
