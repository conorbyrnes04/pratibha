unit_id: conference_of_the_birds.cot_16
unit_label: Majnūn sifts the dust
title: Seeking Layla Everywhere
unit_type: teaching_passage
commentary: 'Love refuses the pious demand that the beloved be sought only in fitting places. The contested
  move is Majnun’s universalization of seeking: rather than infer from Layla’s purity that she cannot
  be encountered amid dust, he turns every place into a site of search. In ʿAṭṭār’s Sufi world, Layla
  is not merely a woman in a romance but a conventional figure through whom human longing can disclose
  the soul’s desire for the Real. The point is not that dirt becomes holy by itself, nor that every object
  contains the Beloved in an uncomplicated way. It is that the seeker cannot appoint, in advance, the
  place where disclosure must occur.


  Mahmud’s rag-picker supplies the necessary counterpressure. Searching everywhere can be the discipline
  of love; endlessly scratching in dust can also be appetite, unable to recognize sufficiency even after
  receiving a jewel. The two scenes distinguish restless attention from acquisitive repetition. Majnun’s
  poverty is single-mindedness: he seeks one name through all places. The poor man’s apparent poverty
  becomes cupidity because the diamond has not altered his orientation. ʿAṭṭār therefore makes discernment
  part of devotion: openness to the unexpected must not become an excuse for compulsive accumulation.'
