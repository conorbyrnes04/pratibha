- kind: key_terms
  label: Key Terms
  items:
  - term: هدهد
    definition: Arabic hudhud, “hoopoe,” probably echoing the bird’s call -> the bird judged most worthy
      and crowned as guide -> the default zoological gloss misses its Qur’anic and Sufi force as a messenger
      able to discern what others do not.
  - term: بيعت
    definition: Arabic bayʿah, originally a transaction or pledge sealed by hand -> the birds’ oath of
      allegiance to the Hoopoe -> “allegiance” can sound merely political, while the term carries the
      binding, initiatory texture of commitment to a guide.
  - term: شیخ
    definition: Arabic shaykh, literally an old man or elder -> the figure whose story demands inward
      hearing -> “elder” misses the Sufi sense of a formative guide whose words require transformation,
      not just information.
  - term: شهر خدا
    definition: Persian shahr-i Khudā, “City of God” -> the announced goal beyond the waste -> the default
      image of a literal city misses a spiritual orientation in which arrival entails remaking the one
      who travels.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, al-Naml 27:20–28
    resonance: The hoopoe serves as a privileged messenger, bringing knowledge unavailable to the ruler
      and directing attention beyond the familiar realm.
    divergence: The Qur’anic bird reports to Solomon about Sheba; Attar’s Hoopoe gathers fellow birds
      for a collective inward quest. Prophetic report becomes Sufi guidance.
  - citation: Plato, Republic VII, 514a–521b
    resonance: Both works oppose ordinary perception to a more demanding mode of seeing and make departure
      from a settled world a condition of fuller knowledge.
    divergence: Plato’s ascent culminates in intelligible vision secured by philosophical education; Attar’s
      summons requires the heart and soul, placing love, surrender, and spiritual wayfaring where Plato
      privileges dialectic.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, before accepting advice from the most impressive person in a group, pause for two minutes
    and write one sentence naming the quality that actually makes them worthy to guide this matter; then
    act only on advice that you can hear with both attention and conscience, not merely deference.
