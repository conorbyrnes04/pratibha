translation_provenance: English is a Pratibha adaptation (2026) of R. P. Masani, *The Conference of the
  Birds* (Oxford / Humphrey Milford, 1924 — public domain abridgment of ʿAṭṭār's Manṭiq al-ṭayr). Persian
  mūla from Ganjoor where cited. Does not follow Davis & Darbandi, Nott, or Avery.
pratibha_layers:
- kind: original
  label: Original
  body: 'Hudhud; shaykh; bā gūsh-i dil va jān; fahm-i ẓāhir; shahr-i Khudā. Core gist: the hudhud, deemed
    afḍal (most worthy), receives the birds’ bayʿat, or pledge of allegiance. The tale requires the gūsh-i
    dil, the ear of the heart and soul, rather than merely bodily hearing or outward understanding; the
    summons is toward shahr-i Khudā, the City of God.'
- kind: translation
  label: Pratibha Translation
  body: 'The honor fell to the worthiest of them all: the Hoopoe. They all swore allegiance to her and
    placed a crown upon her head.


    The poet says that this story of the Shaykh must be heard not with the ordinary ears of flesh and
    bone, but with the ear of heart and soul. To understand it, you need the soul’s power of penetration,
    not the usual faculty of comprehension. “On—to the edge of the waste; on—to the City of God!”'
