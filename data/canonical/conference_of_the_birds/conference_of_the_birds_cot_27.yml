sanskrit_iast: 'Zīn sukhan murghān-i vādī sar-ba-sar sarnigūn gashtand dar khūn-i jigar: “At these words
  all the birds of the valley fell headlong into heart’s blood.” ʿĀlamī pur murgh mī-burdand rāh; bīsh
  narasīdand sī ān jāygāh: “A world full of birds set out on the road; no more than thirty reached that
  station.” Sī tan bī-bāl u par, ranjūr u sust, dil-shikastah, jān-shudah, tan nādurust: “Thirty, wingless
  and featherless, weary and weak, broken-hearted, their souls spent and bodies undone.”'
