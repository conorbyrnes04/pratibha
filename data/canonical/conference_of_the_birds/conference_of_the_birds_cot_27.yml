pratibha_layers:
- kind: original
  label: Original
  body: 'زین سخن مرغان وادی سر به سر

    سرنگون گشتند در خون جگر

    عالمی پر مرغ می‌بردند راه

    بیش نرسیدند سی آن جایگاه

    سی تن بی‌بال و پر، رنجور و سست

    دل شکسته، جان شده، تن نادرست'
- kind: translation
  label: Pratibha Translation
  body: 'Thirty birds—only thirty out of millions—survive and approach the capital of the Simurgh. After
    all this travail, what a cold welcome these storm-tossed souls receive at the sacred threshold! “Back,
    back!” orders the usher of the Royal Court.


    Their grief at such a reception is so heartrending that, at last, divine favor removes the curtain
    and admits the sore-stricken pilgrims to the presence of the King. Yet their troubles do not end there.
    Though their conduct was saintly, their abstinence marvelous, and their endurance heroic, a long register
    is produced in the Divine Court, listing every sin of omission and commission.


    The poor benighted creatures sink into confusion and are utterly annihilated. Yet this bewilderment
    and annihilation cleanse them of every earthly element, and they receive new life from the divine
    effulgence.'
- kind: commentary
  label: Pratibha Commentary
