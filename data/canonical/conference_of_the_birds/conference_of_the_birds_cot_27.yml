- kind: key_terms
  label: Key Terms
  items:
  - term: وادی (vādī)
    definition: Arabic wādin, “valley” or watercourse -> the domain traversed by the birds -> not scenic
      geography but a spiritual condition that reshapes the traveler.
  - term: سی مرغ (sī murgh)
    definition: Persian sī, “thirty,” plus murgh, “bird” -> the thirty exhausted survivors -> the default
      gloss misses its audible pressure toward Sīmurgh, without reducing God to a mere collective.
  - term: سیمرغ (Sīmurgh)
    definition: 'Persian name of the royal/mythic bird -> the King whose capital the birds approach ->
      more than an exotic phoenix: in the poem it bears the theological problem of seeking the Real beyond
      the seeker’s separate self.'
  - term: فنا (fanāʾ)
    definition: Arabic fanāʾ, “passing away” or “perishing” -> the pilgrims’ annihilation amid shame and
      bewilderment -> not nihilism, but the undoing of possessive ego before renewed life.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Enneads VI.9.11
    resonance: Union requires the soul to relinquish its bounded selfhood rather than acquire one more
      object of knowledge; both works make arrival a transformation of the knower.
    divergence: Plotinus frames ascent chiefly as return to the One through contemplative simplification,
      whereas ʿAṭṭār stages a royal court, accusation, grace, and a communal company of pilgrims.
  - citation: Pseudo-Dionysius, Mystical Theology 1
    resonance: 'Both place unknowing beyond ordinary religious or intellectual attainment: bewilderment
      becomes a condition for receiving what exceeds concepts.'
    divergence: Dionysius emphasizes apophatic darkness and theological negation; ʿAṭṭār gives that negation
      dramatic moral force through the ledger of omissions and commissions.
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, “The Wisdom of Divinity in the Adamic Word”
    resonance: 'Both explore disclosure through the human locus: divine manifestation is encountered where
      independent self-claim has been unsettled.'
    divergence: Ibn ʿArabī offers a metaphysical account of names and manifestation; ʿAṭṭār makes the
      issue experiential, precarious, and narratively collective.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, write down one spiritual, moral, or professional achievement you privately use as evidence
    that you deserve recognition. Beneath it, name one omission that achievement cannot cancel. Then perform
    one small helpful act anonymously, without recording, explaining, or claiming it.
