pratibha_layers:
- kind: original
  label: Original
  body: 'بعد ازین وادی حیرت آیدت

    کار دایم درد و حسرت آیدت

    هر نفس اینجا چو تیغی باشدت

    هر دمی اینجا دریغی باشدت

    مرد حیران چون رسد این جایگاه

    در تحیر مانده و گم کرده راه

    عاشقم اما ندانم بر کیم

    نه مسلمانم نه کافر، پس چیم'
- kind: translation
  label: Pratibha Translation
  body: 'Next comes the Valley of Stupefaction. Here one is prey to perpetual sadness. Every sigh is like
    a sword, and every breath a piteous lament. Here, alas, blood seems to drip from the end of every
    hair, though no hair has been cut. There are lamentation, sorrow, and consuming desire.


    It is day and night at once, yet neither day nor night. There is fire in this place, and one is overcome,
    burned, and consumed by it. How can anyone, in this bewilderment, set foot upon this path? He is as
    if dead from astonishment and loses the road. But one who bears the imprint of unity in the heart
    forgets everything, and forgets the self.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Bewilderment is not merely the absence of knowledge; it can be the undoing of the self that claims
    to know. The contested move is to treat anguish, disorientation, and even the loss of the road not
    as spiritual defeat but as a threshold to unity. In the Sufi itinerary of Manṭiq al-ṭayr, ḥayrat follows
    stages of seeking, love, knowledge, detachment, and tawḥīd: the traveler has been trained to abandon
    possessions and concepts, yet now discovers that no stable observer remains to possess the truth.
    The images of blood, sword-like breath, simultaneous day and night, and consuming fire make this an
    ordeal of perception rather than a calm intellectual puzzle. Ordinary oppositions fail: day is not
    day, night is not night, and the traveler cannot say where to stand. The final forgetting is therefore
