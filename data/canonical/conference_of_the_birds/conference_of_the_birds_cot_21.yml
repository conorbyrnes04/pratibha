sanskrit_iast: 'Baʿd az īn vādī-yi ḥayrat āyadat: kār-i dāʾim dard u ḥasrat āyadat. Har nafas īnjā chu
  tīghī bāshadat, har damī īnjā darīghī bāshadat. The core sense is that the Valley of ḥayrat brings enduring
  pain and regret; each breath wounds and becomes a cry of loss.'
