- kind: key_terms
  label: Key Terms
  items:
  - term: حیرت (ḥayrat)
    definition: Arabic ḥ-y-r, to wander about or be perplexed -> the valley’s stunned, path-losing condition
      -> “bewilderment” can sound merely mental, but here it is an existential and affective unmaking.
  - term: حسرت (ḥasrat)
    definition: Arabic ḥ-s-r, loss, regret, or painful longing -> the enduring sorrow that accompanies
      this valley -> “regret” misses its sense of a desire that consumes the one who cannot attain its
      object.
  - term: وحدت (waḥdat)
    definition: Arabic w-ḥ-d, being one -> the imprint of unity held in the heart -> “unity” does not
      mean a pleasant harmony; it entails the forgetting of the possessive, separate self.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pseudo-Dionysius, Mystical Theology, 1
    resonance: Both works make the approach to the ultimate exceed ordinary knowing and imagery, so that
      darkness or bewilderment becomes more fitting than conceptual mastery.
    divergence: Dionysius stresses apophatic ascent into divine darkness; ʿAṭṭār dramatizes an affective
      ordeal of grief, fire, and self-forgetting within a staged Sufi journey.
  - citation: Rūmī, Mathnawī, Book I, opening reed-flute lament
    resonance: Both use lament and separation as evidence that longing can disclose a reality deeper than
      ordinary identity.
    divergence: The reed’s complaint retains a voice that tells its story, whereas the Valley of Bewilderment
      presses toward the loss of the one who speaks and knows.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, choose one unresolved loss or question that you usually rush to explain. Set a timer for
    ten minutes; write only its concrete effects on your body, speech, and attention, without proposing
    a solution. End by crossing out every sentence beginning with “I know,” then leave the question unanswered
    for the rest of the day.
