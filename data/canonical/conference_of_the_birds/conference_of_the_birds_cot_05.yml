translation_provenance: English is a Pratibha adaptation (2026) of R. P. Masani, *The Conference of the
  Birds* (Oxford / Humphrey Milford, 1924 — public domain abridgment of ʿAṭṭār's Manṭiq al-ṭayr). Persian
  mūla from Ganjoor where cited. Does not follow Davis & Darbandi, Nott, or Avery.
pratibha_layers:
- kind: original
  label: Original
  body: 'Tāvūs gufta: man nāsazā-yi hazrat-i Simurgh hastam, zīrā dar tabīd-i Ādam az behesht naqsh dāshtam.
    Ordak bī-āb natavānist. Kabk bī-kūh natavānist. Humā gufta: man qudrat-i saltanat-bakhsh dāram bar
    ānān ki bar sar-i īshān parvāz konam. Chun īn sharaf rā tark konam?'
- kind: translation
  label: Pratibha Translation
  body: The Peacock urged that he was quite unworthy of the Royal Presence because of the part he had
    played in the expulsion of Adam from Paradise. The Duck could not do without water, nor the Partridge
    without mountains. The Huma said he was gifted with the power to confer sovereignty on those over
    whose head he flew. Why should he give up such a lofty privilege?
- kind: commentary
  label: Pratibha Commentary
  body: 'The Sufi path demands the annihilation of self-justification, yet each creature rehearses a plausible
    reason for remaining earthbound. The Peacock''s shame, the Duck''s necessity, the Partridge''s habitat-dependence,
    the Huma''s cosmic function—all are *legitimate excuses*, which is precisely what makes them lethal
    to the journey. Attar stages the contest between rational self-preservation and the unreasonable demand
    of the Hoopoe (reason itself) that the birds abandon their particular natures. The Huma''s excuse
    is the most seductive: it claims not weakness but privilege, a divine gift that would be *impious*
    to relinquish. This move—the spiritualization of attachment—is the most dangerous because it masquerades
    as piety. The passage exposes how the ego colonizes even the language of unworthiness and duty to
    defend its throne.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ʿudhur (عذر)
    definition: 'Lit. ''excuse, pretext''; from root meaning ''to be difficult, impossible.'' In Quranic
      usage, a legitimate reason for non-compliance. Here: the rationalization by which the self delays
      surrender; the ego''s final fortress, dressed in the language of necessity and honor.'
  - term: Simurgh (سیمرغ)
    definition: Mythic bird-king, the goal of the journey; lit. 'thirty birds' (sī-murgh) in Persian,
      hinting that the destination is the collective self. The Royal Presence toward which the creatures
      are called but from which they flee.
  - term: Humā (هما)
    definition: Fabulous bird whose shadow confers kingship; emblem of the soul's imagined sovereignty.
      The excuse here is not weakness but the fear of losing a false crown—the ego's most cunning defense.
  - term: tabīd (تبعید)
    definition: Expulsion, banishment; Attar invokes Adam's fall to show how the Peacock carries historical
      guilt as a shield against transformation. The past becomes a prison.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Quran 2:34 (Iblis and the Angels)
    resonance: Both passages stage a refusal to obey a divine command on grounds of superior knowledge
      or status. Iblis refuses to bow to Adam because he is 'better' (ahsan khalqan); the Huma refuses
      the journey because it possesses a cosmic function. Pride wears the mask of principle.
    divergence: Attar's creatures are not yet damned; their excuses are still *heard*, still *debatable*.
      The Hoopoe must answer them. This opens a space for repentance that the Quranic narrative forecloses—Attar's
      theodicy is more merciful, or more tragic.
  - citation: Rumi, Masnavi I.1-18 (The Reed's Lament)
    resonance: 'Both poets begin by staging the creature''s attachment to its element or role: the reed
      to the reed-bed, the duck to water. Both use this as the opening gambit of spiritual pedagogy—the
      acknowledgment of bondage as the first step to freedom.'
    divergence: Rumi's reed *laments* its separation and *desires* the flute-maker's hand. Attar's creatures
      defend their attachments as virtues. Rumi's pedagogy is erotic; Attar's is forensic. The duck does
      not mourn the water; it claims it cannot live without it—a claim the Hoopoe must refute.
  - citation: Ibn Arabi, Fusus al-hikam (The Peacock's Wisdom)
    resonance: Ibn Arabi assigns each prophet a divine name; Attar assigns each creature a spiritual pathology.
      Both use taxonomy as theology. The Peacock's shame, the Huma's sovereignty—these are not flaws but
      *stations* (maqamat) that must be transcended.
    divergence: Ibn Arabi's system is hierarchical and cumulative; each wisdom builds on the last. Attar's
      is agonal; each excuse must be *overcome*, not integrated. The journey is not a ladder but a breaking.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, name one reason you cannot begin the work you know you must do—one that sounds like necessity,
    duty, or unworthiness. Write it down. Then ask: Is this a fact about the world, or a story I tell
    myself to stay safe? Sit with the discomfort of not knowing the answer. Do not yet act. The Hoopoe
    does not demand that the birds fly today; only that they stop lying about why they cannot.'
