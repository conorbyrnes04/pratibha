category: root_text
work_id: conference_of_the_birds
work_title: Conference of the Birds
unit_id: conference_of_the_birds.cot_05
unit_label: The Peacock and the Duck
title: The Excuses of the Unworthy
unit_type: teaching_passage
commentary: 'The Sufi path demands the annihilation of self-justification, yet each creature rehearses
  a plausible reason for remaining earthbound. The Peacock''s shame, the Duck''s necessity, the Partridge''s
  habitat-dependence, the Huma''s cosmic function—all are *legitimate excuses*, which is precisely what
  makes them lethal to the journey. Attar stages the contest between rational self-preservation and the
  unreasonable demand of the Hoopoe (reason itself) that the birds abandon their particular natures. The
  Huma''s excuse is the most seductive: it claims not weakness but privilege, a divine gift that would
  be *impious* to relinquish. This move—the spiritualization of attachment—is the most dangerous because
  it masquerades as piety. The passage exposes how the ego colonizes even the language of unworthiness
  and duty to defend its throne.'
