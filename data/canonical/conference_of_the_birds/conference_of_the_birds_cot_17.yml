unit_id: conference_of_the_birds.cot_17
unit_label: Valley of Love
title: The Valley Where Love Burns Beyond Good and Evil
unit_type: teaching_passage
commentary: 'Love is presented not as an emotion that improves the self, but as a fire that abolishes
  the self’s ordinary calculations. The contested move is the apparent suspension of moral distinction:
  ʿAṭṭār says that good and evil are “one” on Love’s road, and that Love is neither “this” nor “that.”
  Read flatly, this can sound like antinomian license. Within the Sufi architecture of the Valleys, however,
  it names a condition in which the seeker’s egoic bargaining—piety for reward, prudence for safety, belief
  as possession—has been burned away. It does not authorize harm; it attacks the self that uses moral
  labels to preserve its own standing. The lover is “sincere” (ṣādiq): sincerity makes the burning different
  from mere passion or recklessness. Fire is therefore both the lover’s substance and Love’s ordeal. To
  be “garm-rū, sūzanda, sarkash” is to become radiant, consuming, and ungovernable by worldly consequence.
  The hyperbole of throwing “a hundred worlds” into fire measures detachment from every finite object,
  including religious certainty when it becomes an idol. The Beloved is not acquired by moderation; the
  seeker’s head itself is the stake.'
