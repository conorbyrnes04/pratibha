- kind: key_terms
  label: Key Terms
  items:
  - term: عشق
    definition: Arabic ʿishq, passionate or consuming love -> the force governing the second valley ->
      not romantic feeling, but a fire that strips away self-protection and possession.
  - term: وادی
    definition: 'Arabic wādī, valley or riverbed -> a station-like terrain on the seeker’s road -> more
      than a location: it is an existential ordeal through which the traveler is altered.'
  - term: آتش
    definition: Persian ātash, fire -> the element into which the lover enters and must become -> not
      merely pain or punishment, but the consuming energy of transformation.
  - term: سرکش
    definition: Persian sarkash, head-raising, refractory, untamed -> the lover’s flame-like intensity
      -> not simple rebellion, but refusal to be ruled by cautious self-interest.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jalāl al-Dīn Rūmī, Mathnawī, Book I, opening reed song
    resonance: 'Both poets make separation and burning the condition of speech and spiritual movement:
      desire discloses that the self is not at home in its ordinary attachments.'
    divergence: Rūmī’s reed laments separation and seeks return, while ʿAṭṭār maps Love as a severe valley
      whose immediate work is to burn away calculation.
  - citation: Abū Ḥāmid al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of Intention, Sincerity, and Truthfulness
    resonance: 'Both make sincerity central: an act’s spiritual truth depends on release from self-serving
      motives rather than on outward display alone.'
    divergence: Al-Ghazālī chiefly disciplines intention within ethical and devotional practice; ʿAṭṭār
      intensifies that discipline into the paradoxical language of fire beyond ordinary oppositions.
  - citation: Plotinus, Enneads VI.9, “On the Good or the One”
    resonance: Both imagine ultimate orientation as requiring departure from lesser multiplicities and
      from the self’s attachment to determinate things.
    divergence: Plotinus describes contemplative ascent toward the One; ʿAṭṭār’s Persian Sufi idiom makes
      the passage affective, dangerous, and reciprocal through the figure of the Beloved.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one small action you have delayed because you are rehearsing its consequences—an honest
    apology, a needed refusal, or a generous act—and do it today without seeking credit; before acting,
    name the self-protective reward you are relinquishing.
