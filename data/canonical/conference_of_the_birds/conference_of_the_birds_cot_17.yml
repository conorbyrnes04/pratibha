pratibha_layers:
- kind: original
  label: Original
  body: 'بعد ازین وادی عشق آید پدید

    غرق آتش شد کسی کانجا رسید

    کس درین وادی به جز آتش مباد

    وانک آتش نیست عیشش خوش مباد

    عاشق آن باشد که چون آتش بود

    گرم رو سوزنده و سرکش بود

    عاقبت اندیش نبود یک زمان

    در کشد خوش خوش بر آتش صد جهان

    نیک و بد در راه او یکسان بود

    خود چو عشق آمد نه این نه آن بود'
- kind: translation
  label: Pratibha Translation
  body: 'After the first valley comes the Valley of Love. Whoever sets foot there is plunged into fire.
    Rather, one must oneself be made of fire, or one cannot live there. The true and sincere lover must
    glow like fire: radiant in face, ardent, consuming, and untamed as flame.


    For a moment the lover must not calculate consequences, but be ready to cast a hundred worlds into
    the fire, knowing neither faith nor unbelief, doubt nor belief. On this road good and evil are no
    longer distinct; when Love arrives, there is neither this nor that. One whose heart holds sincerity
    wagers all he possesses—even his head—to join hands with the Beloved.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Love is presented not as an emotion that improves the self, but as a fire that abolishes the
    self’s ordinary calculations. The contested move is the apparent suspension of moral distinction:
