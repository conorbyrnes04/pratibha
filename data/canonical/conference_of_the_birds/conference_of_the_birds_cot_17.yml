    Read flatly, this can sound like antinomian license. Within the Sufi architecture of the Valleys,
    however, it names a condition in which the seeker’s egoic bargaining—piety for reward, prudence for
    safety, belief as possession—has been burned away. It does not authorize harm; it attacks the self
