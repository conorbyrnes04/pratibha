pratibha_layers:
- kind: original
  label: Original
  body: 'بعد ازین وادی استغنا بود

    نه درو دعوی و نه معنی بود

    می‌جهد از بی‌نیازی صرصری

    می‌زند بر هم به یک دم کشوری

    هفت دریا یک شمر اینجا بود

    هفت اخگر یک شرر اینجا بود'
- kind: translation
  label: Pratibha Translation
  body: 'Next comes the valley where there is neither ambition to possess anything nor the spiritual desire
    to fathom divine mysteries. Complete detachment from the world, which here is not worth a straw, is
    the essence of this stage of the journey.


    In this state of the soul’s capacity, a cold wind rises, so violent and fierce that it devastates
    a continent in a moment. The seven oceans are reduced to a mere pool; the seven planets seem only
    a spark; the seven heavens, a corpse; and the seven hills, frozen snow. Then comes a wonder reason
    cannot comprehend: an ant gains the strength of a hundred elephants, while a hundred caravans perish
    in the twinkling of an eye. So that Adam might receive the celestial light, millions of angels clothed
    in green were consumed with sorrow.'
