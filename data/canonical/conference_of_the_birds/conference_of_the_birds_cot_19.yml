- kind: key_terms
  label: Key Terms
  items:
  - term: استغنا
    definition: Arabic istiġnāʾ, “seeking to be free of need” -> the valley of utter non-need for worldly
      possession or spiritual acquisition -> default “wealth” or “self-sufficiency” misses its anti-possessive,
      God-oriented discipline.
  - term: بی‌نیازی
    definition: Persian bī-niyāzī, “without need” -> the condition from which the destroying wind leaps
      -> default “independence” misses the collapse of the ego’s demand to secure itself through things,
      knowledge, or rank.
  - term: صرصر
    definition: Arabic ṣarṣar, a bitterly cold, violent wind -> the force that ruins a whole country in
      a breath -> default “wind” misses its Qurʾanic overtones of devastating judgment and radical reversal.
  - term: دعوی
    definition: Arabic daʿwā, “claim, pretension, assertion” -> the self’s claim to possession, status,
      or spiritual comprehension -> default “claim” misses the polemic against declaring oneself an accomplished
      knower or seeker.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jalāl al-Dīn Rūmī, Mathnawī, Book I, the reed-flute prologue
    resonance: Both works portray desire as exile from an originating reality and make lack, rather than
      possession, the condition for a truer hearing or receiving.
    divergence: Rūmī’s reed speaks through longing and complaint; ʿAṭṭār’s valley presses beyond even
      spiritual wanting, staging detachment as a destructive wind rather than a voiced yearning.
  - citation: Bhagavad Gītā, 2.47–2.71
    resonance: The Gītā similarly detaches action from possessive attachment to results and describes
      steadiness as freedom from craving and “mine-making.”
    divergence: The Gītā preserves disciplined action within dharma; ʿAṭṭār intensifies the image into
      cosmic diminishment, where even the desire for mystical meaning is stripped away.
  - citation: Plotinus, Enneads I.6.7–9
    resonance: 'Plotinus treats ascent as a removal of accretions: the self is clarified by shedding what
      it has taken to be its own.'
    divergence: Plotinus emphasizes contemplative return through beauty and intellectual purification,
      while ʿAṭṭār’s Sufi scene foregrounds annihilating needlessness, divine light, and images of judgment.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice yourself reaching for one thing to prove that you are secure, capable,
    or spiritually serious, do not acquire it for ten minutes. Name the claim silently—“I need this to
    be enough”—then do one necessary task without seeking credit, explanation, or reassurance.
