sanskrit_iast: Baʿd az īn vādī-yi istighnā buvad; na dar ū daʿvī va na maʿnā buvad. Mī-jahad az bī-niyāzī
  ṣarṣarī; mī-zanad bar ham ba-yak dam kishvarī. Haft daryā yak shumar īnjā buvad; haft akhtar yak sharar
