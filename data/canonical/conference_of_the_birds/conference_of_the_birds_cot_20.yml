- kind: key_terms
  label: Key Terms
  items:
  - term: توحید (tawḥīd)
    definition: Arabic waḥḥada, “to make or affirm one” -> realization of divine oneness beyond countable
      unity -> the usual gloss “monotheism” misses its experiential and apophatic dismantling of one/many
      itself.
  - term: استغنا (istighnā)
    definition: Arabic from gh-n-y, freedom from need or sufficiency -> the preceding valley of release
      from dependence and possessiveness -> “wealth” or “self-sufficiency” misses the stripping away of
      every claim to spiritual ownership.
  - term: حق (al-Ḥaqq)
    definition: Arabic, “the Real,” “the True,” or “the Due” -> the Being beyond unity and reckoning ->
      “God” alone can miss the term’s claim that reality itself, not merely an entity, is at issue.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Enneads VI.9.11
    resonance: 'Both accounts place the highest principle beyond numerical unity: the One is not one item
      among other items, and ordinary distinctions dissolve before it.'
    divergence: Plotinus articulates a metaphysical ascent of intellect toward the One; ʿAṭṭār frames
      the undoing as a Sufi valley requiring renunciation, divine relation, and restraint in speech.
  - citation: Ibn ʿArabī, Fuṣūṣ al-Ḥikam, “The Wisdom of Divinity in the Word of Adam”
    resonance: Both make multiplicity dependent upon a single Real and treat created forms as disclosures
      rather than self-subsisting realities.
    divergence: Ibn ʿArabī gives a technical account of divine names and loci of manifestation, whereas
      ʿAṭṭār’s image of the shared collar presses the reader toward existential disidentification rather
      than systematic doctrine.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you catch yourself ranking people, tasks, or outcomes as “more” and “less,” pause
    for one full breath and name the shared condition beneath the comparison: “This too depends on what
    I did not make.” Then complete the next necessary task without announcing its rank or using it to
    measure your worth.'
