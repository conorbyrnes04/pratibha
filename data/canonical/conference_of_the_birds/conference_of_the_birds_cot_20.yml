pratibha_layers:
- kind: original
  label: Original
  body: 'Vādī-yi Istighnā rā Vādī-yi Tawḥīd dar pay ast: dar ān hama chīz tark shavad va hama yakī gardad;
    dar ān na shumār ast va na kayfiyyat. Har kih sar barārad, az yak girībān sar barārad. Agar bisyār
    bīnī yā اندak, hama yak-and; ān kih yak mī-namāyad, az ān kih bisyār mī-namāyad jūdā nīst. Ḥaqq az
    tawḥīd va shumār birūn ast.'
- kind: translation
  label: Pratibha Translation
  body: 'After the Valley of Detachment comes the Valley of Unity: the land where everything is renounced
    and everything made one, where neither number nor quality creates distinction. All who raise their
    heads in this wilderness draw them from the same collar. Whether you see many people there or only
    a few, they are truly one; this whole multitude makes a single whole, complete in its oneness.


    What appears as one is not different from what appears as many. Since the Being of whom I speak lies
    beyond unity and counting, turn your eyes away from death and eternity. There is no place here for
    death, nor for eternity. Once these two extremes have vanished, do not speak of them.'
- kind: commentary
  label: Pratibha Commentary
