pratibha_layers:
- kind: original
  label: Original
  body: 'Rāh-i ḥaqq rā zād juz tark u fanā nīst; har chih dārī, dar ātesh-andāz. Pīrī dar Turkistān asb-i
    tazrāv u pisar-i khwīsh rā dūsht; guft: īn du but-and dar rāh-i man. Core terms: rāh-i ḥaqq (Path
    of Truth), tark (renunciation), fanāʾ (self-annihilation), but (idol).'
- kind: translation
  label: Pratibha Translation
  body: 'The only provisions for the journey on the Path of Truth are total renunciation and self-annihilation.
    Burn to ashes everything you possess.


    An old man in Turkestan had two most beloved possessions: his swift-footed horse and his son. “I hold
    nothing dearer than these two,” he said. “Yet if someone told me that my son was dead, I would give
    that person my favorite horse in thanks for the good news—for I see that these two are like idols
    standing in my path.”


    Several versions of this tale occur in Persian literature. The best known concerns the saintly king
    Ibrāhīm ibn Adham, who left his throne and family while his only son was still a child. When the prince
    grew up, he longed to meet his father.'
