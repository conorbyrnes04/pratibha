- kind: key_terms
  label: Key Terms
  items:
  - term: رَاهِ حَقّ (rāh-i ḥaqq)
    definition: Arabic ḥaqq, “true, real, rightful,” joined to Persian rāh, “road” -> the spiritual way
      toward God -> “Path of Truth” can sound merely ethical or doctrinal; here it is a journey requiring
      existential dispossession.
  - term: تَرْك (tark)
    definition: Arabic root t-r-k, “to leave, abandon” -> total renunciation of what encumbers the seeker
      -> not simple poverty or dislike of things, but refusal to ground the self in them.
  - term: فَنَاء (fanāʾ)
    definition: 'Arabic f-n-y, “to pass away, perish” -> self-annihilation before God -> “destruction”
      misses its Sufi sense: the ego’s independent claim fades, rather than the person being physically
      erased.'
  - term: بُت (but)
    definition: Persian for “idol,” ultimately associated with an image or cult object -> the horse and
      son become idols insofar as they block the way -> the term targets absolutized attachment, not the
      intrinsic worth of family or animals.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ibrāhīm ibn Adham, early Sufi hagiographical traditions
    resonance: The former king’s abandonment of throne, wealth, and household gives narrative form to
      the same movement from sovereign possession to radical poverty before God.
    divergence: Ibrāhīm’s legends usually frame departure as a divine summons and subsequent ascetic vocation;
      the old man’s paradoxical speech focuses more narrowly on inward attachment and the rhetoric of
      idolatry.
  - citation: Jalāl al-Dīn Rūmī, Masnavī, Book III, “The Merchant and the Parrot”
    resonance: 'Both narratives use apparent loss or death to disclose liberation from a constricting
      condition: what looks like catastrophe becomes the opening of freedom.'
    divergence: Rūmī’s parrot stages a clever enacted lesson in dying before death, whereas this anecdote
      tests the seeker through attachment to beloved human and material goods; its moral pressure is harsher
      and less playful.
  - citation: Gospel of Matthew 10:37
    resonance: The saying that one must not love father, mother, son, or daughter more than the ultimate
      divine claim shares the structure of subordinating kinship to transcendent allegiance.
    divergence: The Gospel frames the issue through worthiness for Christ and discipleship; ʿAṭṭār’s Sufi
      framing names the psychic mechanism as idolatry and seeks fanāʾ of possessive selfhood.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Choose one possession, role, or relationship you silently treat as proof that life is secure.
    Write one sentence naming the fear beneath losing it, then perform one small act that loosens possession
    without abandoning responsibility: give away an unused valued item, let someone else make a decision
    you usually control, or spend ten minutes with the loved one without seeking reassurance from them.'
