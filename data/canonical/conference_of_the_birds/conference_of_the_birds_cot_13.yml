unit_label: Consume whatsoever thou hast
title: The Two Idols on the Road
unit_type: teaching_passage
commentary: 'Freedom begins not when love is erased, but when no loved thing is allowed to become the
  condition of one’s truth. The contested move is the old man’s shocking welcome of his son’s imagined
  death: he treats the loss not as cruelty or indifference, but as release from an attachment that has
  become an idol. Within ʿAṭṭār’s Sufi world, this is the hard discipline of tark and fanāʾ: relinquishing
  possessions, status, and even the self’s claim to its dearest relations so that the seeker may travel
  the rāh-i ḥaqq without rivals to God. The horse and son are not condemned as inherently evil. Their
  danger lies in the man’s declaration that nothing is dearer. Desire becomes but-parastī, idolatry, when
  finite goods occupy the place of ultimacy. Yet the anecdote’s extremity must remain visible. It risks
  converting spiritual nonattachment into emotional numbness or licensing neglect of actual obligations.
  Sufi renunciation at its strongest is not a command to manufacture bereavement; it is a diagnosis of
  possessiveness. The Ibrāhīm ibn Adham reference intensifies the point: kingship, lineage, and domestic
  continuity are all structures through which the ego imagines permanence. The path asks whether one can
  love without making what one loves into a god.'
