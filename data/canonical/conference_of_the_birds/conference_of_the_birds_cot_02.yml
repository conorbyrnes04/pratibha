pratibha_layers:
- kind: original
  label: Original
  body: Parī az bāl-i Sīmurgh bar zamīn-i Chīn uftād. Dar jahān āshūb uftād. Har kas naqsh-i ān par dīd,
    bī-khwad shud. Sīmurgh, par, naqsh, Chīn.
- kind: translation
  label: Pratibha Translation
  body: 'A feather from His wing fell on Chinese soil. At once great tumult arose throughout the world.
    Everyone longed to make an image of that feather, and whoever saw the image lost their senses.


    That feather still hangs in China’s picture-gallery. “Seek knowledge, even in China” points to this.'
