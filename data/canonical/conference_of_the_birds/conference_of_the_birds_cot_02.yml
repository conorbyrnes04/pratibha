unit_label: The feather in China
title: The Feather in China
unit_type: teaching_passage
commentary: 'A likeness can awaken longing for what no likeness can contain. The contested move is the
  claim that an image of the feather—already only a trace of the Simurgh—can drive its beholders beyond
  ordinary consciousness. Rather than dismissing representation as mere illusion, the poem makes it a
  dangerous threshold: the painted sign produces bewilderment because it directs desire toward an absent,
  inexhaustible reality.


  In ʿAṭṭār’s Sufi cosmos, the Sīmurgh is the supreme unity whose manifestations appear as multiplicity.
  The feather is not the divine essence; it is a distal sign, a par, available to the senses and therefore
  liable to be copied, collected, and mistaken for its source. Yet this very inadequacy has force. The
  viewer’s loss of self-possession resembles the beginning of ecstatic unmaking: ordinary selfhood cannot
  securely possess what it desires. China functions both as the legendary farthest reach of learned travel
  and as the site of image-making. The crib’s note calls “Seek knowledge, even in China” Qurʾanic, but
  the saying is traditionally circulated as a ḥadīth, not a Qurʾanic verse; its authority and transmission
  have been disputed. That uncertainty sharpens the poem’s question: does one seek information, or undergo
  a desire that overturns the seeker?'
