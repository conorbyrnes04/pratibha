- kind: key_terms
  label: Key Terms
  items:
  - term: سیمرغ (Sīmurgh)
    definition: Middle Persian sēn murw, conventionally “thirty birds” in later Persian wordplay -> the
      transcendent bird whose wing sheds the feather -> “phoenix” misses its specifically Persian Sufi
      role as unity appearing through the many.
  - term: پر (par)
    definition: Persian “feather, wing” -> the fallen fragment or trace of the Sīmurgh -> “feather” can
      sound decorative, while here it is an overwhelming sign of an inaccessible source.
  - term: نقش (naqsh)
    definition: Arabic root n-q-sh, marking or engraving -> the made image of the feather -> “picture”
      misses the tension between a visible form, an imprint, and the reality it cannot capture.
  - term: چین (Chīn)
    definition: Persian name for China -> the distant place where the feather falls and images are made
      -> “China” also carries the medieval Persian association of exquisite craft, painting, and remoteness.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Republic, 514a–517a
    resonance: 'Both scenes make images decisive for the soul: what is seen can reorganize desire and
      compel a turn toward a reality not immediately present.'
    divergence: Plato’s images are chiefly deficient shadows to be escaped; ʿAṭṭār’s copied feather is
      deficient too, but its insufficiency can itself ignite ecstatic seeking.
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, chapter on Joseph
    resonance: Both treat formed images as sites where an unseen reality may become apprehensible without
      becoming exhausted by its form.
    divergence: Ibn ʿArabī develops a metaphysics of imaginal manifestation; ʿAṭṭār stages the affective
      shock of a single trace and leaves the viewer in bewilderment rather than doctrinal resolution.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one image you repeatedly use to stand for what you most want—success, love, God, freedom.
    Write beneath it one sentence beginning, “This is only a feather, not the bird,” then spend ten minutes
    taking one concrete step toward the reality rather than polishing, posting, or consuming its image.
