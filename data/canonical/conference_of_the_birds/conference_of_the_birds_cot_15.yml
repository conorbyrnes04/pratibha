pratibha_layers:
- kind: original
  label: Original
  body: 'چون فرو آیی به وادی طلب

    پیشت آید هر زمانی صدتعب

    صد بلا در هر نفس اینجا بود

    طوطی گردون، مگس اینجا بود

    جد و جهد اینجات باید سال‌ها

    زآن که اینجا قلب گردد حال‌ها

    ملک اینجا بایدت انداختن

    ملک اینجا بایدت در باختن

    چون نماند هیچ معلومت به دست

    دل بباید پاک کرد از هرچه هست'
- kind: translation
  label: Pratibha Translation
  body: 'As soon as you set foot in the first valley, the Valley of Seeking, thousands of difficulties
    will assail you without cease at every stage. At every moment you must undergo a hundred trials. The
    parrot of the sky is only a fly there.


    You must remain for years in this valley, advancing with great patience and perseverance. You must
    perform arduous tasks to purify your nature. You must cast away your riches and renounce all you possess.
    When you are certain that nothing remains in your hand, you must still cleanse your heart of everything
    that exists. Then, rescued from perdition, you will behold the serene light of His Divine Majesty;
    when it dawns upon your spirit, your spiritual desire will increase a thousandfold.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Seeking begins not with acquisition but with the collapse of the seeker’s imagined capacity to
