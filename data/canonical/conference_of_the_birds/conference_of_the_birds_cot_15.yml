- kind: key_terms
  label: Key Terms
  items:
  - term: طلب
    definition: Arabic ṭ-l-b, “to seek, demand, pursue” -> the first valley’s sustained search for the
      Real -> “quest” can suggest a chosen adventure, while ṭalab also carries need, insistence, and a
      desire that exposes the seeker’s lack.
  - term: جِدّ و جَهد
    definition: Arabic jidd, “seriousness, earnest effort,” plus jahd, “exertion, strain” -> years of
      patient spiritual labor -> “perseverance” can sound calm and self-managed; the paired phrase includes
      costly effort and pressure.
  - term: مُلک
    definition: 'Arabic mulk, “possession, dominion, property, rule” -> the wealth and claim of ownership
      that must be cast away -> “riches” misses the wider issue: not merely money, but the posture of
      mastery over what one calls mine.'
  - term: دل
    definition: Persian dil, cognate in usage with Arabic qalb, “heart” -> the inward faculty that must
      be cleansed of every attachment -> “heart” in modern English often means feeling alone; here it
      is also the center of perception, intention, and spiritual receptivity.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Abū Ḥāmid al-Ghazālī, al-Munqidh min al-Ḍalāl (Deliverance from Error)
    resonance: Both works make spiritual progress require a break with status, inherited certainties,
      and attachments that masquerade as knowledge or security.
    divergence: Al-Ghazālī narrates an intellectual and vocational crisis leading toward Sufi practice;
      ʿAṭṭār stages dispossession as a universal, imagistic threshold for the birds’ collective journey.
  - citation: John of the Cross, Ascent of Mount Carmel, Book I
    resonance: The demand to detach from possessions and created satisfactions parallels John’s insistence
      that attachment obstructs union with God.
    divergence: John’s apophatic framework is shaped by Christian doctrines of grace and the soul’s ascent;
      ʿAṭṭār’s ṭalab foregrounds desire’s multiplication and the Persian Sufi journey through successive
      valleys.
  - citation: Bhagavad Gītā 2.47–2.48
    resonance: 'Both train action without possessiveness: one labors intensely while refusing to make
      outcomes into personal property.'
    divergence: The Gītā directs disciplined action within dharma and social duty, whereas this valley
      presses toward renunciation of ownership itself and purification of the heart’s attachments.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, choose one useful possession you have not used in a year, give it away or place it in a
    donation box, and then write one sentence naming the identity or security you expected that object
    to provide.
