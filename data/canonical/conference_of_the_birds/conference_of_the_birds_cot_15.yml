sanskrit_iast: Chūn farū āyī bih vādī-yi ṭalab, pīshat āyad har zamānī ṣad taʿab. Ṣad balā dar har nafas
  īnjā buvad; ṭūṭī-yi gardūn, magas īnjā buvad. Jidd u jahd īnjāt bāyad sāl-hā; mulk īnjā bāyadat andākhtan.
  Chūn namānad hīch maʿlūmat bih dast, dil bibāyad pāk kard az har-chih hast.
