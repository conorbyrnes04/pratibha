pratibha_layers:
- kind: original
  label: Original
  body: 'Haft vādī ast: avval vādī-yi ṭalab ast; dovvom ʿishq; sevvom maʿrifat; chahārom istighnā va tajrīd;
    panjom tawḥīd; sheshom ḥayrat; haftom faqr va fanā.'
- kind: translation
  label: Pratibha Translation
  body: 'These are the seven valleys: the first is the Valley of Quest; the second, of Love; the third,
    of Knowledge; the fourth, of Independence and Detachment; the fifth, of Unity; the sixth, of Bewilderment
    and Stupefaction; the seventh, of Poverty and Annihilation.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Spiritual transformation is not the accumulation of religious achievements but the gradual loss
    of the self that wants to possess them. The contested move is the passage from Knowledge to Independence
    and Detachment: knowledge might seem to be the summit, yet the itinerary makes it only a threshold.
    What is known can still be owned by a knower; istighnā and tajrīd loosen that possessive relation,
