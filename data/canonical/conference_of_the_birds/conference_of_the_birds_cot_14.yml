unit_label: The seven valleys named
title: The Seven Valleys of the Way
unit_type: teaching_passage
commentary: 'Spiritual transformation is not the accumulation of religious achievements but the gradual
  loss of the self that wants to possess them. The contested move is the passage from Knowledge to Independence
  and Detachment: knowledge might seem to be the summit, yet the itinerary makes it only a threshold.
  What is known can still be owned by a knower; istighnā and tajrīd loosen that possessive relation, preparing
  the way for tawḥīd, where multiplicity is no longer granted final authority. In the Sufi architecture
  of Manṭiq al-ṭayr, the hoopoe gives the birds not a geography but an ordeal of orientation. Each valley
  names both a capacity and its danger: Quest can become mere seeking, Love can remain appetite, Knowledge
  can harden into mastery, and Unity can become an idea rather than a dissolution of self-claim. Ḥayrat
  is therefore not intellectual failure but the undoing of the mind’s demand to stand outside what it
  knows. The final pair, faqr and fanā, refuses to make deprivation a virtue in itself. Poverty means
  having no independent spiritual property; annihilation means the fading of the separate “I” that claims
  progress, insight, or proximity to God.'
