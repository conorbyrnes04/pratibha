    that claims progress, insight, or proximity to God.'
- kind: key_terms
  label: Key Terms
  items:
  - term: طلب (ṭalab)
    definition: Arabic root ṭ-l-b, “to seek” or “to demand” -> the opening movement of the path -> the
      usual gloss “quest” can sound like curiosity, but it is an existential demand that unsettles the
      seeker.
  - term: عشق (ʿishq)
    definition: Arabic/Persian term for consuming, passionate love -> the second valley -> “love” can
      sound gentle or reciprocal; ʿishq names a force that overwhelms calculation and self-protection.
  - term: توحید (tawḥīd)
    definition: Arabic, from waḥid, “one” -> realization of divine oneness -> “unity” can suggest harmony
      among many things, while tawḥīd challenges the independent reality claimed by the many.
  - term: فقر و فنا (faqr va fanā)
    definition: Arabic faqr, “neediness,” and fanā, “passing away” -> utter dependence and the disappearance
      of egoic self-claim -> “poverty and annihilation” can sound merely negative, but they indicate freedom
      from possessing a separate spiritual identity.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Ghazālī, al-Munqidh min al-Ḍalāl (Deliverance from Error)
    resonance: Both works make discursive learning insufficient and redirect the seeker toward a transformed
      mode of knowing.
    divergence: Al-Ghazālī narrates a personal crisis and recovery; ʿAṭṭār gives a symbolic, collective
      itinerary whose stages culminate more explicitly in bewilderment and annihilation.
  - citation: Ibn ʿArabī, Fuṣūṣ al-Ḥikam, opening discussions of divine unity
    resonance: Both place tawḥīd beyond the merely conceptual affirmation that God is one, treating it
      as a reconfiguration of how reality is perceived.
    divergence: Ibn ʿArabī develops metaphysical distinctions; the seven valleys are practical-poetic
      names for what those distinctions cost a traveler.
  - citation: Dante Alighieri, Purgatorio, cantos I–XXXIII
    resonance: Each journey is ordered through successive transformations in which attachment must be
      relinquished before a fuller vision becomes possible.
    divergence: Dante’s ascent purges sins within a Christian moral cosmos, whereas ʿAṭṭār’s sequence
      presses beyond moral repair toward fanā, the loss of autonomous selfhood.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, choose one achievement, opinion, or spiritual identity you are quietly using as proof of
    your worth; write it down, then spend ten minutes doing one necessary kindness without mentioning
    that identity, achievement, or motive to anyone.
