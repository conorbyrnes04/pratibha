pratibha_layers:
- kind: original
  label: Original
  body: 'چون نگه کردند آن سی مرغ زود

    بی‌شک این سی مرغ آن سیمرغ بود

    بود خود سیمرغ سی مرغ مدام

    سیمرغ در آینه پیدا شد تمام'
- kind: translation
  label: Pratibha Translation
  body: 'The Sun of My Majesty is a mirror. Whoever beholds himself in this mirror sees there his soul
    and body—sees himself entire. Soul and body behold soul and body. Since you thirty birds have come
    here, you find thirty birds in the mirror. Had you been forty or fifty, you would have seen forty
    or fifty.


    Though your journey has completely transformed you, you see yourselves here as you were before. At
    the beginning you were many, but only thirty of you can see Me; and what you see is your own selves.
    How can any frail human being approach My presence? How can an ant’s eye be raised to the Pleiades?
    Has anyone seen an insect lift an anvil, or a gnat seize an elephant with its teeth? All that you
    have known and seen is neither what you have known nor what you have seen.'
