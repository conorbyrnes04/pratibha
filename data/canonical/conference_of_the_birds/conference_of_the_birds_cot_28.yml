- kind: key_terms
  label: Key Terms
  items:
  - term: سیمرغ
    definition: Probably from Middle Persian sēn murw, the great mythic bird -> the sovereign sought by
      the birds and revealed through their mirrored gathering -> the usual gloss “phoenix” misses both
      its Persian mythic specificity and its punning convergence with sī murgh.
  - term: سی مرغ
    definition: sī, “thirty,” plus murgh, “bird” -> the surviving company whose reflection appears before
      them -> the default numerical gloss misses that its sound nearly coincides with Sīmurgh and makes
      collective self-recognition linguistically unavoidable.
  - term: آینه
    definition: āyīnah, “mirror,” likely from a term for a reflecting surface -> the medium in which the
      birds encounter their own total image -> the default gloss “mirror” misses its Sufi function as
      a discipline of mediated vision rather than a claim of simple identity.
  - term: فنا
    definition: fanāʾ, Arabic “passing away” or “annihilation” -> the relinquishing of possessive selfhood
      implied by the failed attempt to approach the sovereign directly -> the default gloss “annihilation”
      misses that what ends is self-claim, not necessarily existence itself.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, “The Ringstone of the Wisdom of Divinity in the Word of Adam”
    resonance: Both works make the human being a site in which divine names or realities become manifest,
      and both make knowledge of the self inseparable from knowledge directed toward God.
    divergence: Ibn ʿArabī develops a metaphysical doctrine of manifestation; the birds’ mirror preserves
      a dramatic refusal of direct possession, staging the danger of taking manifestation for equivalence.
  - citation: Plotinus, Enneads I.6, “On Beauty”
    resonance: Both describe a conversion in which the seeker’s perception must be transformed before
      a higher reality can be recognized; the obstacle is the perceiver’s unprepared condition.
    divergence: Plotinus directs the soul toward an intelligible source through inward ascent, whereas
      the Sufi bird-quest culminates in a communal pun and a sovereign whose transcendence remains rhetorically
      guarded.
  - citation: The Avataṃsaka Sūtra, “Indra’s Net” imagery
    resonance: The mirrored image suggests a relation in which each apparent unit is intelligible only
      through a larger, mutually implicating whole.
    divergence: Indra’s net commonly emphasizes endless reciprocal interreflection; the Simurgh episode
      concentrates the relation in a single sovereign mirror and frames it through devotion, ordeal, and
      the limit of creaturely access.
- kind: practice
  label: Practice (Abhyasa)
  body: Before a mirror today, write the names of three roles by which you usually define yourself—such
    as worker, parent, student, or friend. Look at your reflection for one minute without adding praise
    or blame, then cross out one role and do one small action that is not performed to defend it.
