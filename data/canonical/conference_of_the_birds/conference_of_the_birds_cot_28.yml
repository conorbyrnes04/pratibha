sanskrit_iast: Chūn nigāh kardand ān sī murgh zūd, bī-shakk īn sī murgh ān Sīmurgh būd. Būd khwud Sīmurgh
  sī murgh mudām; Sīmurgh dar āyīnah paydā shud tamām. “Thirty birds” (sī murgh) are disclosed in the
  mirror as Sīmurgh, while the sovereign remains beyond creaturely approach.
