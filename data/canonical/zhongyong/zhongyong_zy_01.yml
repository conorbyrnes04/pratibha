title: What Heaven Confers Is Called Nature
unit_type: sutra
sanskrit_devanagari: 天命之謂性，率性之謂道，修道之謂教。
sanskrit_iast: Classical Chinese.
translation_literal: What Heaven (tiān 天) confers is what we call our nature (xìng 性). To follow that
  nature is what we call the Way (dào 道). To cultivate the Way is what we call teaching.
commentary: 'This opening line sets out the whole framework of the Zhōngyōng in three compact steps that
  move from source, to path, to practice. First, xìng 性 (nature) is not something we invent or achieve;
  it is ''conferred'' (mìng 命) by tiān 天 (Heaven). The character mìng carries the sense of a mandate or
  allotment—what is handed to you as your given constitution. So human nature is presented as a gift with
  a source outside the individual, which grounds moral life in something larger than personal preference.
  Second, the dào 道 (Way) is defined not as a set of external rules imposed on us but as the act of following
  (shuài 率, to lead along or accord with) the nature we already have. This is the passage''s quiet radical
  claim: the right path is continuous with our deepest constitution, not opposed to it. Living well means
  aligning with what we truly are rather than fighting it. Third, ''teaching'' (jiào 教) is the cultivation
  (xiū 修, to repair, tend, refine) of that Way. Here the text acknowledges that following our nature does
  not happen automatically; it requires shaping, attention, and instruction. Note the movement: Heaven
  grounds nature, nature grounds the Way, and the Way grounds teaching. Each term is defined by the one
  before it, so that culture and education are not arbitrary conventions but the deliberate tending of
  a path that is itself rooted in the cosmic order. Although chéng 誠 (sincerity, integral genuineness)
  and zhōng 中 (centrality, equilibrium) are not named here, this line is their foundation: to be sincere
  will later mean to be true to this Heaven-given nature without distortion, and centrality will mean
  staying aligned with it before feelings pull us off course.


  Key Terms


  **性 (xìng)** — One''s inborn nature, here described as conferred by Heaven.

  **道 (dào)** — The Way; here defined as acting in accord with one''s Heaven-given nature.

  **命 (mìng)** — Mandate or allotment; what Heaven hands down or decrees.'
insight: '«What Heaven Confers Is Called Nature» locates the Mean not as mediocrity but as the living
  balance of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'Today, notice one moment when you feel pulled between what you ''should'' do and what feels
  genuinely right at your core. Pause and ask a single question: which choice is more in accord with who
  I actually am at my best—my given nature—rather than my fear, image, or habit? Then take the small action
  that follows from that. This is a practical rehearsal of shuài xìng, ''following one''s nature,'' letting
  conduct flow from your genuine constitution instead of external pressure or reactive impulse.'
