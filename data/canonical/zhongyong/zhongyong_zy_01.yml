unit_label: What Heaven Confers Is Called Nature
title: What Heaven Confers Is Called Nature
unit_type: sutra
sanskrit_devanagari: 天命之謂性，率性之謂道，修道之謂教。
sanskrit_iast: Classical Chinese.
translation_literal: What Heaven has conferred is called THE NATURE; an accordance with this nature is
  called THE PATH of duty; the regulation of this path is called INSTRUCTION.
commentary: '«What Heaven Confers Is Called Nature» locates the Mean not as mediocrity but as the living
  balance of nature and cultivation: what cannot be left even for a moment is tested most in solitude.
  The passage asks a living reader to test the claim in experience rather than treat it as museum doctrine.
  Hold the argument until its force lands in attention, then let practice carry one concrete shift into
  the next hour of ordinary life. This is the demand of a living tradition: insight without application
  remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **天命 (tiānmìng)** — Heaven''s mandate or conferment; the cosmic order as it becomes nature in each being,
  not external decree but intrinsic endowment

  **性 (xìng)** — Nature; the actualized potential given by Heaven, dynamic and requiring cultivation rather
  than static essence

  **道 (dào)** — Path or Way; the lived alignment with one''s nature, inseparable from practice and moment-to-moment
  choice

  **教 (jiào)** — Instruction or teaching; the regulation and refinement of the path through disciplined
  attention and repetition


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2 (on hexis and virtue as habit):** Both traditions locate moral
  excellence not in abstract principle but in the formation of character through repeated practice; virtue
  becomes second nature through habituation Divergence: Aristotle emphasizes rational deliberation and
  the mean between extremes as a mathematical proportion, while Zhongyong grounds the mean in Heaven''s
  conferment and tests it in solitude as immediate presence

  **Mencius 2A6 (on the sprouts of goodness and their cultivation):** Both affirm that human nature contains
  intrinsic moral potential (conferred, not constructed) that must be actively nourished and extended
  through practice Divergence: Mencius stresses the danger of losing or failing to cultivate the sprouts
  through neglect, while Zhongyong emphasizes the constant testing and regulation of the path in ordinary
  moments'
insight: '«What Heaven Confers Is Called Nature» locates the Mean not as mediocrity but as the living
  balance of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what
  changes.
