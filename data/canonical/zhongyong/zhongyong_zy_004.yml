section: I.1
sanskrit_devanagari: 喜怒哀樂之未發，謂之中；發而皆中節，謂之和。中也者，天下之大本也；和也者，天下之達道也。致中和，天地位焉，萬物育焉。
sanskrit_iast: ''
translation_literal: Before joy, anger, sorrow, and pleasure have arisen, this is called centrality (zhong). When they arise
  and each attains due measure, this is called harmony (he). Centrality is the great root of all under Heaven; harmony is
  the way that reaches through all under Heaven. When centrality and harmony are fully realized, Heaven and Earth take their
  proper places, and the ten thousand things are nourished.
commentary: 'The passage does not commend emotional blankness. Zhong, “centrality,” names the uncommitted and unperturbed
  ground before a particular feeling has seized the mind; it is a condition of inner balance, not mere neutrality. He, “harmony,”
  concerns the subsequent expression of feeling: joy or anger may rightly arise, but must do so at the fitting time, toward
  the fitting object, and in fitting degree. Thus ethical cultivation is neither repression nor indulgence. The individual’s
  affective order is presented cosmologically: the centered person participates in the proper ordering of Heaven, Earth, and
  the “ten thousand things.” This should not be read as a causal claim that private calm mechanically controls nature. Rather,
  the text treats human self-cultivation, social ritual propriety, and cosmic generativity as mutually corresponding forms
  of order. To “bring centrality and harmony to completion” is to make one’s responsiveness reliably apt.


  Key Terms


  **中 (zhong)** — Centrality or equilibrium: the balanced moral ground before emotions are activated.

  **和 (he)** — Harmony: emotions expressed in due proportion and accordance with the situation.

  **中節 (zhongjie)** — Hitting the proper measure: responding neither too much nor too little.

  **致中和 (zhi zhong he)** — Bringing centrality and harmony to full realization through cultivation.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics:** Aristotle’s virtuous mean also concerns feeling and action in the right measure, relative
  to circumstance. Divergence: Aristotle frames the mean primarily as practical virtue formed by habituation, whereas the
  Zhongyong links measured affect explicitly to cosmic order.

  **Buddhist mindfulness of feelings:** Buddhist practice notices pleasant, unpleasant, and neutral feeling before reactive
  craving or aversion takes hold. Divergence: Many Buddhist accounts aim at non-attachment and liberation from craving; this
  passage emphasizes fitting emotional expression within ethical and relational life.

  **Stoic ethics, especially Epictetus:** Stoicism likewise seeks freedom from impulsive, disproportionate reactions through
  disciplined judgment. Divergence: Stoic ideal can be read as minimizing passions, while the Zhongyong expressly allows joy,
  anger, sorrow, and pleasure when they are well-timed and proportionate.'
practice: 'Three times today, when a strong feeling first appears, pause for three slow breaths. Name it silently—“anger,”
  “joy,” or “sorrow”—then ask: “What expression would fit this person, this time, and this degree?” Act only after choosing
  one proportionate sentence or gesture.'
