section: XXII
sanskrit_devanagari: 唯天下至誠，為能盡其性。能盡其性，則能盡人之性。能盡人之性，則能盡物之性。能盡物之性，則可以贊天地之化育；可以贊天地之化育，則可以與天地參矣。
sanskrit_iast: ''
translation_literal: Only one possessed of utmost sincerity (zhicheng) under Heaven can fully realize his own nature. Able
  fully to realize his own nature, he can fully realize the nature of other persons. Able fully to realize the nature of other
  persons, he can fully realize the nature of things. Able fully to realize the nature of things, he can assist (zan) the
  transforming and nourishing work of Heaven and Earth. Able to assist the transforming and nourishing work of Heaven and
  Earth, he can stand with Heaven and Earth as a third.
commentary: 'Cheng, “sincerity,” is not mere candor or subjective authenticity. It is an undivided actuality in which one’s
  dispositions, understanding, conduct, and Heaven-endowed nature are made fully true. The passage traces an expanding efficacy:
  self-cultivation is not private moral refinement, because a person whose own nature is realized can discern and foster the
  proper development of persons and things. “Assist” does not mean that the sage replaces Heaven and Earth as creator. Rather,
  human moral responsiveness becomes a fitting participant in their ceaseless huayu, the transformation and nourishment by
  which life comes to fruition. To “stand as a third” (can) names a correlative cosmic role, not a theological Trinity: Heaven,
  Earth, and the sincere human form a triad of generative agencies. The claim is therefore demanding and ecological as well
  as ethical. Genuine sincerity bears fruit in institutions, relationships, and material practices that allow each being’s
  nature to be completed rather than exploited.


  Key Terms


  **至誠** — Utmost sincerity: a fully integrated actuality in which one’s Heaven-endowed nature is wholly realized.

  **盡其性** — To exhaust or fulfill one’s nature, bringing inherent moral capacities to their complete expression.

  **贊天地之化育** — To assist Heaven and Earth’s transforming and nourishing processes through responsive human action.

  **與天地參** — To stand as a co-participant with Heaven and Earth in the cosmic work of generation and cultivation.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics I.7 and X.7–8:** Aristotle likewise presents human flourishing as the full enactment of
  a distinctively human capacity, achieved through sustained virtuous activity rather than private feeling.

  **Aristotle, Nicomachean Ethics I.7 and X.7–8:**  Divergence: Aristotle grounds fulfillment chiefly in rational activity
  according to virtue, whereas the Zhongyong extends realized nature into participation in Heaven and Earth’s generative transformation.

  **Stoic tradition, Marcus Aurelius, Meditations 4.23 and 6.44:** Marcus Aurelius depicts the virtuous person as living in
  accord with universal nature and acting for the benefit of the whole cosmopolis.'
practice: 'For one day, before acting in a significant relationship or using a material resource, pause and ask: “What would
  help this person or thing fulfill its proper nature?” Choose one specific action—listening without manipulation, repairing
  rather than replacing, or arranging conditions for another’s growth—and carry it out without seeking credit.'
