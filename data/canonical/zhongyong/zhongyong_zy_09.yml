- kind: original
  label: Original
  body: 君子素其位而行，不願乎其外。素富貴，行乎富貴；素貧賤，行乎貧賤；素夷狄，行乎夷狄；素患難，行乎患難。君子無入而不自得焉。
  layer_provenance: sourced
- kind: iast
  label: IAST
  body: Classical Chinese.
- kind: translation
  label: Pratibha Translation
  body: The superior man does what is proper to the station in which he is; he does not desire to go beyond this. In a position
    of wealth and honour, he does what is proper to a position of wealth and honour. In a poor and low position, he does what
    is proper to a poor and low position. Situated among barbarous tribes, he does what is proper to a situation among barbarous
    tribes. In a position of sorrow and difficulty, he does what is proper to a position of sorrow and difficulty. The superior
    man can find himself in no situation in which he is not himself.
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«The Superior Man Does What Is Proper to His Station» locates the Mean not as mediocrity but as the living balance
    of nature and cultivation: what cannot be left even for a moment is tested most in solitude. The passage asks a living
    reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands
    in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a
    living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
    to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sù wèi (素位)
    definition: 'one’s present station → do what is proper to it → trap: caste quietism'
  - term: jūnzǐ (君子)
    definition: 'does not wish beyond his station → content as rectitude → trap: ambition-shaming'
  - term: wú yuàn (無怨)
    definition: 'without resentment upward or downward → trap: enforced cheer'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
