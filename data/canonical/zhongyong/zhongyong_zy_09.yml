unit_label: The Superior Man Does What Is Proper to His Station
title: The Superior Man Does What Is Proper to His Station
unit_type: sutra
sanskrit_devanagari: 君子素其位而行，不願乎其外。素富貴，行乎富貴；素貧賤，行乎貧賤；素夷狄，行乎夷狄；素患難，行乎患難。君子無入而不自得焉。
sanskrit_iast: Classical Chinese.
translation_literal: The exemplary person (jūnzǐ) acts from within the situation they are actually in, and does not crave
  what lies beyond it. Placed in wealth and honor, they act as befits wealth and honor. Placed in poverty and low standing,
  they act as befits poverty and low standing. Placed among foreign or uncivilized peoples, they act as befits that setting.
  Placed in trouble and hardship, they act as befits trouble and hardship. There is no circumstance the exemplary person enters
  into where they do not find themselves composed and at ease.
commentary: 'This passage locates the Way (dào 道) not in some ideal elsewhere but in the concrete position one currently occupies.
  The key word is sù 素—rendered here as ''placed in'' or ''from within''—which carries the sense of the plain, given ground
  of one''s present condition. The jūnzǐ does not treat circumstance as an obstacle to virtue; circumstance is precisely the
  material through which virtue is enacted. Note the deliberate range of the four situations: wealth and poverty (opposites
  of fortune), foreign lands and hardship (conditions of dislocation and danger). By spanning both extremes and both kinds
  of displacement, the text insists that no situation is exempt from the demand—and the possibility—of right action. This
  connects directly to the Zhōngyōng''s core teaching of zhōng 中, centeredness: the person who is truly centered is not thrown
  off balance by what befalls them, because their orientation comes from within rather than from external conditions. It also
  anticipates chéng 誠, sincerity or integrity, in a quiet way: to act genuinely from where you are, without pretending to
  be elsewhere or wishing your circumstances away, is a form of being true to the reality one has been given. The closing
  line, wú rù ér bù zì dé 無入而不自得, is the payoff—''there is nowhere they enter without being self-possessed.'' This is not
  passive resignation but active equanimity: the person meets each situation on its own terms and remains whole. Following
  one''s Heaven-conferred nature (xìng 性) here means responding appropriately to what Heaven has actually apportioned, rather
  than resenting it.


  Key Terms


  **素 (sù)** — The plain, given ground of one''s present situation; to act ''from within'' or ''on the basis of'' one''s actual
  condition.

  **自得 (zì dé)** — Self-possession, composure, being at ease within oneself regardless of external circumstance.

  **君子 (jūnzǐ)** — The exemplary or noble person; one who cultivates virtue and embodies the Way in conduct.'
insight: '«The Superior Man Does What Is Proper to His Station» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'When you next encounter a condition you did not choose—a cramped space, an unwelcome task, a person who unsettles
  you, a shortage—pause and perform one small action that honors that exact situation rather than escapes it: speak directly
  to the person, give full attention to the work at hand, notice one true detail of the place you are in. Let this action
  be your answer to the circumstance itself.'
