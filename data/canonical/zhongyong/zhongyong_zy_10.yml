title: Government Depends on Men
unit_type: sutra
sanskrit_devanagari: 哀公問政。子曰：「文武之政，布在方策。其人存，則其政舉；其人亡，則其政息。人道敏政，地道敏樹。夫政也者，蒲盧也。故為政在人，取人以身，修身以道，修道以仁。」
sanskrit_iast: Classical Chinese.
translation_literal: 'Duke Ai asked about government. Confucius said: "The governance of Kings Wen and Wu is set out on the
  tablets and records. Where such men exist, that governance flourishes; where such men are gone, that governance ceases.
  The way of humankind (rén dào) hastens toward good government, just as the way of the earth hastens toward growing things.
  Governance, indeed, is like the fast-growing reed. And so the practice of government rests on the right men: you draw such
  men to you by your own person, you cultivate your person by following the dào, and you cultivate the dào by rén (humaneness)."'
commentary: 'This passage turns the abstract cosmology of the Zhōngyōng toward the practical question of rule, yet it keeps
  the same root logic: everything traces back through the dào to the person who embodies it. Confucius answers Duke Ai''s
  question about government not with policy but with people. The records of the sage-kings Wen and Wu still exist — the institutions
  are written down and available — but institutions are inert. What animates them is human beings of the right character.
  ''Where such men exist, that governance flourishes; where such men are gone, that governance ceases'' makes the point starkly:
  no system runs itself. The natural analogies drive this home. Just as earth naturally hastens plants into growth, human
  nature (implicitly the Heaven-conferred xìng of the opening chapter) naturally hastens toward good ordering when the conditions
  are right. The image of the púlú, the fast-growing marsh reed, suggests that where a genuine person governs, good order
  springs up quickly and vigorously — the response is almost organic. The passage then lays out a chain of dependence that
  runs inward, not outward: government depends on men → attracting the right men depends on the ruler''s own person (shēn)
  → cultivating that person depends on walking the dào → walking the dào depends on rén, humaneness. Notice the direction.
  Reform does not begin with laws or with subordinates; it begins with the ruler''s self-cultivation and ultimately with the
  quality of the heart, rén. This is the Confucian conviction that public order is the outward flowering of inward character,
  which connects directly to the book''s larger theme that chéng (genuine wholeness) at the center of a person radiates outward
  into the world. Government here is not a technique to be mastered but a moral condition to be embodied. The ruler who wants
  results must become the kind of person around whom capable, upright people gather — and that becoming is the real work.


  Key Terms


  **rén 仁** — Humaneness or benevolence; the inner quality of a good heart from which right conduct and, here, right government
  flow.

  **shēn 身** — One''s own person or self; the site of cultivation that must be set right before one can govern others.

  **dào 道** — The Way; the proper path one walks, cultivated through rén and expressed in ordered life and rule.'
insight: '«Government Depends on Men» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: 'Whisper to yourself each morning before entering any space where you lead: ''I cultivate the dào by rén.'' Then
  notice throughout that day—in meetings, decisions, corrections—whether you are reaching for a rule or a procedure first,
  or reaching for the person first. Each time you catch yourself about to enforce a system rather than strengthen a human
  being, pause and ask: what character am I calling forth here?'
