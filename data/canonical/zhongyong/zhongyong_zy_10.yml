unit_label: Government Depends on Men
title: Government Depends on Men
unit_type: sutra
sanskrit_devanagari: 哀公問政。子曰：「文武之政，布在方策。其人存，則其政舉；其人亡，則其政息。人道敏政，地道敏樹。夫政也者，蒲盧也。故為政在人，取人以身，修身以道，修道以仁。」
sanskrit_iast: Classical Chinese.
translation_literal: Duke Ai asked about government. The Master said, 'The government of Wen and Wu is displayed in the records—
  the tablets of wood and bamboo. Let there be the men and the government will flourish; but without the men, their government
  decays and ceases. With the right men the growth of government is rapid, just as vegetation is rapid in the earth; and moreover,
  the government is like an easily-growing rush. Therefore the administration of government lies in getting proper men. Such
  men are to be got by means of the ruler's own character. That character is to be cultivated by his treading in the ways
  of duty. And the treading those ways of duty is to be cultivated by the cherishing of benevolence.'
commentary: '«Government Depends on Men» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
  experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **zheng (政)** — Government as the concrete ordering of human affairs through proper administration and the ruler''s exemplary
  character

  **ren (人)** — The right men—capable individuals whose presence or absence determines whether government flourishes or decays

  **xiu shen (修身)** — Cultivation of the ruler''s own character as the root from which proper government grows, like vegetation
  from earth

  **li (禮)** — The ways of duty or ritual propriety that must be cherished to cultivate the treading of proper conduct


  Cross-Tradition Resonances


  **Analects 12.19 (Confucius to Jisun): ''If you set an example by being correct, who would dare to remain incorrect?'':**
  Both passages ground government in the ruler''s personal virtue as the magnetic center that attracts capable men and orders
  the state Divergence: The Zhongyong passage emphasizes the *selection* and *obtaining* of men as a deliberate process, while
  the Analects stresses the *automatic* moral contagion of the ruler''s rectitude

  **Mencius 2A.2: ''When you have exhausted your heart, you will know your nature; knowing your nature, you will know Heaven'':**
  Both texts locate self-cultivation (xiu shen) as the necessary ground for understanding and enacting larger cosmic and political
  orders Divergence: Mencius emphasizes the metaphysical ascent from heart to Heaven, while Zhongyong stresses the practical
  descent from the ruler''s character into the concrete mechanics of attracting and retaining capable administrators'
insight: '«Government Depends on Men» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
