- kind: translation
  label: Pratibha Translation
  body: Duke Ai asked about government. The Master said, 'The government of Wen and Wu is displayed in the records— the tablets
    of wood and bamboo. Let there be the men and the government will flourish; but without the men, their government decays
    and ceases. With the right men the growth of government is rapid, just as vegetation is rapid in the earth; and moreover,
    the government is like an easily-growing rush. Therefore the administration of government lies in getting proper men.
    Such men are to be got by means of the ruler's own character. That character is to be cultivated by his treading in the
    ways of duty. And the treading those ways of duty is to be cultivated by the cherishing of benevolence.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«Government Depends on Men» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
    what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
    experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
    carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
    application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
    to the original wording when the mind wants to smooth the edge.'
