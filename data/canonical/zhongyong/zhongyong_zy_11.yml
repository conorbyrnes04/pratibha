unit_label: Sincerity Is the Way of Heaven
title: Sincerity Is the Way of Heaven
unit_type: sutra
sanskrit_devanagari: 自誠明，謂之性；自明誠，謂之教。誠則明矣，明則誠矣。
sanskrit_iast: Classical Chinese.
translation_literal: When we have intelligence resulting from sincerity, this condition is to be ascribed to nature; when
  we have sincerity resulting from intelligence, this condition is to be ascribed to instruction. But given the sincerity,
  and there shall be the intelligence; given the intelligence, and there shall be the sincerity.
commentary: '«Sincerity Is the Way of Heaven» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
  experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **誠 (chéng)** — Sincerity or authenticity; the alignment of inner reality with outer expression, foundational to both natural
  endowment and moral cultivation

  **智 (zhì)** — Intelligence or wisdom; discernment that arises either from innate nature or through learning and instruction

  **性 (xìng)** — Nature or inherent disposition; what is given at birth, distinct from what must be cultivated through effort


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2 (on hexis and arete):** Both texts present virtue as requiring a reciprocal relation
  between natural capacity and habituation: excellence cannot arise from nature alone nor from practice alone, but demands
  their integration Divergence: Aristotle emphasizes habituation as the primary path to virtue through repeated action, whereas
  the Zhongyong grants sincerity a primordial metaphysical status rooted in Heaven''s Way

  **Mencius 6A.6 (on the sprouts of goodness):** Both texts posit an innate moral nature in humans that must be nurtured and
  extended; sincerity and the sprouts are latent capacities awaiting cultivation Divergence: Mencius emphasizes the danger
  of losing or failing to extend what is naturally present, while the Zhongyong stresses the mutual generation of sincerity
  and intelligence as a continuous dynamic process'
insight: '«Sincerity Is the Way of Heaven» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
