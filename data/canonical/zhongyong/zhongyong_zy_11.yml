sanskrit_devanagari: 自誠明，謂之性；自明誠，謂之教。誠則明矣，明則誠矣。
sanskrit_iast: Classical Chinese.
translation_literal: When clear understanding grows out of sincerity (chéng 誠), we call this our nature
  (xìng 性); when sincerity grows out of clear understanding, we call this teaching. Where there is sincerity,
  there will be clarity; where there is clarity, there will be sincerity.
commentary: 'This compact passage sets two paths side by side and then collapses the difference between
  them. The first movement is 自誠明: starting from chéng 誠—an integrity so complete it needs no effort—clear
  insight simply follows. This is described as xìng 性, the nature conferred by tiān 天, the effortless
  functioning of the sage in whom truthfulness and knowing are already one. The second movement is 自明誠:
  starting from understanding, one works toward sincerity. This is called 教, teaching or cultivation—the
  ordinary human road, where we first learn what is true and then labor to make our whole being conform
  to it. The passage refuses to rank these as higher and lower in outcome. Its closing lines, 誠則明矣，明則誠矣,
  assert a reciprocity: authenticity yields clear vision, and clear vision matures into authenticity.
  The two are not separate goods but two entrances into a single circle. This matters for the wider argument
  of the Zhōngyōng, where chéng is the axis on which both self and cosmos turn. Whether one arrives by
  inborn wholeness or by disciplined study, the destination is the same integrated state—being genuinely
  what one is, seeing genuinely what is. The gift of this teaching to a non-sage is precisely that second
  door: you need not be born clear to become clear, because effortful cultivation reaches the very place
  that natural endowment enjoys. The Way (dào 道) is thus open at both ends.


  Key Terms


  **誠 chéng** — Sincerity or integral truthfulness; being wholly and reliably what one is, the pivot of
  the Zhōngyōng.

  **明 míng** — Clarity, illumination, understanding; the lucid knowing that both flows from and produces
  sincerity.

  **性 xìng** — One''s nature as conferred by Heaven (tiān 天); here, the effortless union of sincerity
  and clarity in the sage.'
insight: '«Sincerity Is the Way of Heaven» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'The next time you find yourself uncertain how to act, pause and notice: is there a truth you
  already know but have not yet made real in your body? Whisper that truth aloud, then move—let the speaking
  reshape you into alignment with what you said.'
