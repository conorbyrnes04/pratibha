section: XX.18
sanskrit_devanagari: 誠者，天之道也；誠之者，人之道也。誠者不勉而中，不思而得，從容中道，聖人也。誠之者，擇善而固執之者也。
sanskrit_iast: ''
translation_literal: 'Sincerity (cheng) is the Way of Heaven; to become sincere is the Way of the human being. One who is
  sincere hits the mark without strain, attains it without calculation, and calmly abides in the Mean: such is the sage. To
  become sincere is to choose what is good and hold fast to it.'
commentary: 'Cheng is not merely truthfulness in speech or inward emotional authenticity. It names an unforced wholeness:
  what one is, knows, intends, says, and does are undivided and fitting to reality. As “the Way of Heaven,” sincerity describes
  the dependable generativity and order of Heaven, which does not deliberate itself into being. Human beings, however, ordinarily
  require cultivation. Hence the crucial verbal distinction: cheng, sincerity itself, and cheng zhi, the active work of making
  oneself sincere. The sage’s effortless “hitting the mark” is not casual spontaneity or moral exemption; it is the fruit
  of a fully formed disposition, harmonized with the Mean. For learners, the path is concrete and demanding: discern the good,
  then “hold fast” to it. The passage joins moral inquiry to perseverance, refusing both empty intuition and rigid rule-following.
  Human sincerity is participation in Heaven’s Way through practiced alignment.


  Key Terms


  **誠 (chéng)** — Sincerity, genuineness, or integral reality: a condition in which inner disposition and enacted moral form
  are unbroken.

  **天之道 (tiān zhī dào)** — The Way of Heaven: Heaven’s normative, generative, and unfailing order.

  **中道 (zhōngdào)** — The Way of the Mean: fitting equilibrium and appropriate attunement, not bland compromise.

  **擇善固執 (zé shàn gù zhí)** — Choosing the good and firmly holding to it: discernment joined to sustained practice.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics:** Aristotle likewise presents virtue as a settled disposition in which right action can
  become reliable and even pleasurable rather than merely forced. Divergence: Aristotle’s telos is human flourishing through
  practical reason; the Zhongyong frames mature moral ease as participation in Heaven’s Way.

  **The Gospel of Matthew 5:48:** The call to be “perfect” as the heavenly Father is perfect similarly links human moral completion
  to a heavenly norm. Divergence: Matthew’s formulation is explicitly theistic and often read through divine fatherhood and
  grace, whereas cheng is an immanent Confucian account of cultivated cosmic-moral alignment.

  **Bhagavad Gita, especially karma-yoga:** The Gita commends disciplined action whose agent is no longer inwardly divided
  by grasping for results, resembling the Zhongyong’s unstrained moral action. Divergence: The Gita’s discipline is ordered
  toward detachment, devotion, and liberation; the Zhongyong emphasizes sincerity within ethical relation, learning, and the
  Mean.'
practice: At the end of the day, identify one situation in which your judgment, speech, and action did not align. Name the
  good you now discern, then choose one specific action tomorrow by which to “hold fast” to it—especially in a relationship
  where integrity is costly.
