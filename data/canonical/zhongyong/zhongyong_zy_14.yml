sanskrit_devanagari: 《詩》曰：「衣錦尚絅」，惡其文之著也。故君子之道，闇然而日章；小人之道，的然而日亡。君子之道，淡而不厭，簡而文，溫而理，知遠之近，知風之自，知微之顯，可與入德矣。
sanskrit_iast: Classical Chinese.
translation_literal: 'The Book of Songs says: "Over her brocade she wears a plain outer robe" — this is
  because she dislikes making the pattern too showy. So the way (dào 道) of the noble person is dim at
  first yet grows brighter day by day; the way of the small-minded person is dazzling at first yet fades
  away day by day. The way of the noble person is bland yet never wearisome, plain yet refined, gentle
  yet ordered. He understands that the far begins in the near, that the visible wind arises from a source,
  that what is subtle becomes manifest. Such a person can be brought into virtue (dé 德).'
commentary: 'This closing hymn gathers the whole book''s argument into a single ethical image: genuine
  goodness is worn quietly, like a fine brocade covered by a plain outer garment. The pattern is real,
  but it is not paraded. This directly extends the text''s teaching on chéng 誠 (sincerity or integral
  wholeness): true inner substance does not need external display, because it works from within outward
  and grows over time — ''dim at first yet brighter day by day.'' The contrast with the small-minded person
  is precisely a contrast in temporal direction: showiness peaks immediately and then hollows out, while
  inner authenticity accumulates. The three paired qualities — bland yet unwearying, plain yet refined,
  gentle yet ordered — describe the outward texture of a life lived from one''s Heaven-conferred nature
  (xìng 性). None of the pairs is flashy; each holds a hidden richness. This is zhōng 中 (centrality/equilibrium)
  made visible as character: a settled, unforced balance that does not need to announce itself. The three
  ''knowings'' at the end trace the logic of interiority the book has built throughout: the far grows
  from the near (great effects have humble beginnings), the wind has a source (what appears outwardly
  issues from an inner cause), and the subtle becomes manifest (the smallest hidden movement of the heart
  eventually shows). To grasp these is to understand that self-cultivation happens at the root, in the
  unseen, before anything reaches the surface — which is why such a person ''can be brought into virtue.''


  Key Terms


  **dào 道** — the Way; here, a person''s characteristic mode of living and its long-term trajectory.

  **chéng 誠** — sincerity/integral wholeness — the inner authenticity that naturally becomes manifest
  over time.

  **zhōng 中** — centrality/equilibrium — the settled inner balance expressed as unforced, unshowy character.'
insight: '«The Closing Hymn of the Mean» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'Choose one good thing you did recently that you were tempted to mention or post about — and
  deliberately keep it unspoken for a full day. Notice the pull to display it, and let that pull go. This
  trains the ''plain robe over brocade'': it shifts your attention from how the good looks to whether
  it is real, and it lets your sense of worth rest on the inner substance rather than on being seen.'
