- kind: translation
  label: Pratibha Translation
  body: It is said in the Book of Poetry, 'Over her embroidered robe she puts a plain single garment,' intimating a dislike
    to the display of the elegance of the former. Just so, it is the way of the superior man to prefer the concealment of
    his virtue, while it daily becomes more illustrious; and it is the way of the mean man to seek notoriety, while he daily
    goes more and more to ruin. It is characteristic of the superior man, appearing insipid, yet never to produce satiety;
    while showing a simple negligence, yet to have his accomplishments recognized; while seemingly plain, yet to be discriminating.
    He knows how what is distant lies in what is near. He knows where the wind proceeds from. He knows how what is minute
    becomes manifested. Such an one, we may be sure, will enter into virtue.
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«The Closing Hymn of the Mean» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
    what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
    experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
    carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
    application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
    to the original wording when the mind wants to smooth the edge.'
