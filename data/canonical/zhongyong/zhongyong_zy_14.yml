title: The Closing Hymn of the Mean
unit_type: sutra
sanskrit_devanagari: 《詩》曰：「衣錦尚絅」，惡其文之著也。故君子之道，闇然而日章；小人之道，的然而日亡。君子之道，淡而不厭，簡而文，溫而理，知遠之近，知風之自，知微之顯，可與入德矣。
sanskrit_iast: Classical Chinese.
translation_literal: It is said in the Book of Poetry, 'Over her embroidered robe she puts a plain single garment,' intimating
  a dislike to the display of the elegance of the former. Just so, it is the way of the superior man to prefer the concealment
  of his virtue, while it daily becomes more illustrious; and it is the way of the mean man to seek notoriety, while he daily
  goes more and more to ruin. It is characteristic of the superior man, appearing insipid, yet never to produce satiety; while
  showing a simple negligence, yet to have his accomplishments recognized; while seemingly plain, yet to be discriminating.
  He knows how what is distant lies in what is near. He knows where the wind proceeds from. He knows how what is minute becomes
  manifested. Such an one, we may be sure, will enter into virtue.
commentary: '«The Closing Hymn of the Mean» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
  experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **君子 (jūnzǐ)** — The superior man or exemplary person; one whose virtue operates through concealment and natural influence
  rather than display

  **德 (dé)** — Virtue or potency; the intrinsic power that becomes more illustrious precisely through non-display and humble
  conduct

  **中庸 (zhōngyōng)** — The Mean or equilibrium; the living balance between cultivation and nature that cannot be abandoned
  even momentarily


  Cross-Tradition Resonances


  **Daodejing, Chapter 15:** Both texts prize the sage whose excellence operates invisibly: ''The ancient masters were profound
  and subtle... because they were subtle, they can only be described with difficulty.'' Virtue manifests through non-action
  and concealment. Divergence: The Zhongyong grounds this concealment in ritual propriety and social exemplarity (the superior
  man), while the Daodejing emphasizes withdrawal from society and alignment with natural process (wuwei)

  **Analects 15.1 (Confucius on the superior man):** Both passages contrast the superior man''s quiet self-cultivation with
  the mean man''s pursuit of reputation: ''The superior man thinks always of virtue, the common man thinks of comfort.'' Divergence:
  The Analects frames this as a choice of habitual thought, whereas Zhongyong presents it as a paradox—that concealment itself
  produces greater luminosity, a more dynamic claim about the mechanics of influence

  **Bhagavad Gita 3.25–26 (on action without attachment):** Both traditions teach that the exemplary person acts without seeking
  the fruit of action; virtue operates most powerfully when not pursued for recognition. Divergence: The Gita locates this
  in renunciation of desire and duty to one''s station; Zhongyong locates it in the paradox that genuine virtue *becomes more
  illustrious* through concealment, implying an organic rather than renunciative mechanism'
insight: '«The Closing Hymn of the Mean» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
