title: Sincerity Is Self-Completion
unit_type: sutra
sanskrit_devanagari: 誠者，自成也；而道，自道也。誠者，物之終始；不誠無物。是故君子誠之為貴。
sanskrit_iast: Classical Chinese.
translation_literal: Sincerity is that whereby self-completion is effected, and its way is that by which
  man must direct himself. Sincerity is the end and beginning of things; without sincerity there would
  be nothing. On this account, the superior man regards the attainment of sincerity as the most excellent
  thing.
commentary: '«Sincerity Is Self-Completion» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **誠 (chéng)** — Sincerity or authenticity; the unforced alignment of inner reality with outer expression,
  foundational to self-completion and cosmic order.

  **自成 (zì chéng)** — Self-completion or self-realization; the actualization of one''s nature through
  sincerity rather than external imposition.

  **道 (dào)** — The Way or path; the method by which sincerity operates as both principle and lived practice
  in human conduct.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6 on habituation (hexis):** Both traditions locate virtue''s realization
  in repeated practice that becomes second nature; sincerity and habituation each require embodied repetition
  rather than intellectual assent alone. Divergence: Aristotle emphasizes the mean between extremes as
  the locus of virtue, while Zhongyong locates the mean as the dynamic balance of nature and cultivation
  without presuming a calculable midpoint.

  **Bhagavad Gita III.19 on action without attachment (nishkāma karma):** Both passages ground authentic
  action in an inner alignment (sincerity / non-attachment) that precedes and sustains right conduct without
  external coercion. Divergence: The Gita emphasizes renunciation of fruits and ego-desire, while Zhongyong
  emphasizes the completion of one''s nature through sincerity as intrinsically generative rather than
  negatively defined.'
insight: '«Sincerity Is Self-Completion» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what
  changes.
