sanskrit_devanagari: 誠者，自成也；而道，自道也。誠者，物之終始；不誠無物。是故君子誠之為貴。
sanskrit_iast: Classical Chinese.
translation_literal: Chéng 誠 (sincerity, integrity, being genuinely real) is what completes itself; and the dào 道 (the Way)
  is what guides itself. Chéng is the beginning and end of all things; without chéng, there are no things at all. This is
  why the noble person treasures the making-real of chéng above all else.
commentary: 'This passage makes a striking metaphysical claim: chéng 誠 is not merely a moral quality a person adds to themselves
  but the very principle by which anything becomes fully what it is. The phrase ''completes itself'' (自成) means that sincerity
  is self-generating and self-fulfilling — it is not imposed from outside but is the inner momentum by which a thing realizes
  its own nature (xìng 性). Parallel to this, the dào 道 ''guides itself'' (自道): the Way is not a set of external rules but
  the self-directing course each being follows when it is true to what it is. The text then radicalizes the point: chéng is
  ''the beginning and end of all things,'' and ''without chéng there are no things.'' Here sincerity is treated cosmologically
  — the genuineness or integrity of a thing is what gives it reality; a thing that is false to its own nature has, in a sense,
  no real existence. This connects back to the Zhōngyōng''s foundational idea that the Way is simply following one''s Heaven-conferred
  nature: to be chéng is to be undividedly what tiān 天 made one to be. The final line draws the ethical conclusion. Because
  chéng is the ground of all reality, the noble person (jūnzǐ) does not treat sincerity as one virtue among many but ''treasures
  the making-real of it'' (誠之為貴) as the single most valuable pursuit. Notice the grammar: 誠之 turns chéng into a verb — actively
  realizing, actualizing, making genuine. Sincerity is not a static possession but a continual work of bringing oneself into
  full, truthful being.


  Key Terms


  **誠 chéng** — Sincerity as genuine, undivided realness — the integrity by which a thing becomes fully itself; here treated
  as the ground of all reality.

  **自成 zì chéng** — Self-completion; the idea that sincerity is self-generating rather than externally imposed.

  **道 dào** — The Way — here described as ''self-guiding,'' the self-directing course a being follows when true to its own
  nature.'
insight: '«Sincerity Is Self-Completion» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: 'Stop mid-action in any routine task—washing dishes, walking to a meeting, replying to an email—and ask: Is this
  thing I''m doing becoming what it actually is, or am I performing it? Hold still until you feel the difference between going-through-the-motions
  and the action completing itself through genuine presence, then continue from that realness.'
