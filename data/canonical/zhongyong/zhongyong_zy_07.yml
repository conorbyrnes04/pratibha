unit_label: Asking About Strength
title: Asking About Strength
unit_type: sutra
sanskrit_devanagari: 子路問強。子曰：「南方之強與？北方之強與？抑而強與？寬柔以教，不報無道，南方之強也，君子居之。衽金革，死而不厭，北方之強也，而強者居之。故君子和而不流，強哉矯！中立而不倚，強哉矯！國有道，不變塞焉，強哉矯！國無道，至死不變，強哉矯！」
sanskrit_iast: Classical Chinese.
translation_literal: Zilu asked about strength. The Master said, 'Do you mean the strength of the South, the strength of the
  North, or the strength which you should cultivate yourself? To show forbearance and gentleness in teaching others, and not
  to revenge unreasonable conduct:—this is the strength of Southern regions, and the good man makes it his study. To lie under
  arms; and meet death without regret:—this is the strength of Northern regions, and the forceful make it their study. Therefore,
  the superior man cultivates a friendly harmony, without being weak.—How firm is he in his energy! He stands erect in the
  middle, without inclining to either side.—How firm is he in his energy! When good principles prevail in the government of
  his country, he does not change from what he was in retirement. When bad principles prevail, he maintains his course to
  death without changing.—How firm is he in his energy!'
commentary: '«Asking About Strength» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
  experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.'
insight: '«Asking About Strength» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
