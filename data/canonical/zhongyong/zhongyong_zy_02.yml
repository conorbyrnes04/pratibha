sanskrit_devanagari: 道也者，不可須臾離也，可離非道也。是故君子戒慎乎其所不睹，恐懼乎其所不聞。
sanskrit_iast: Classical Chinese.
translation_literal: The dào 道 is something that cannot be departed from for even a moment; if it could
  be departed from, it would not be the dào. For this reason, the noble person is watchful and careful
  about what is not yet seen, and apprehensive and cautious about what is not yet heard.
commentary: 'This passage follows directly from the opening claim that the Way consists in acting according
  to the nature (xìng 性) conferred by Heaven (tiān 天). If that nature is truly the ground of who we are,
  then living by it is not an occasional activity we can pick up and set down — it is inseparable from
  existence itself. The logic is tight: anything you can step away from and still remain yourself is,
  by definition, not the dào, because the genuine Way is precisely what constitutes us at every instant.
  From this the text draws a practical consequence about attention. The noble person (jūnzǐ) does not
  reserve moral vigilance for public, observable moments. The phrases ''what is not yet seen'' and ''what
  is not yet heard'' point to the hidden interior — the stirrings of thought and inclination before they
  become visible acts or audible words. This is where the later chapters'' emphasis on chéng 誠 (sincerity,
  integral wholeness) takes root: because the Way is present even in unseen depths, self-cultivation must
  reach into those depths too. Note that ''watchful'' and ''apprehensive'' are not anxious fear but sustained,
  reverent attentiveness — a refusal to let the private self drift out of alignment with the centered
  nature. The passage thus links three ideas that structure the whole text: the dào as continuous with
  our being, the interior as the true site of cultivation, and the vigilance that keeps the emergent self
  in equilibrium (zhōng 中) before feelings even arise.


  Key Terms


  **dào 道** — the Way; here, the continuous path of living according to one''s Heaven-given nature, inseparable
  from existence itself.

  **xìng 性** — the nature conferred by Heaven, whose expression is the Way.

  **jūnzǐ 君子** — the noble or exemplary person who cultivates vigilance even in the unseen interior.'
insight: '«The Path May Not Be Left for an Instant» locates the Mean not as mediocrity but as the living
  balance of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'Once today, catch a feeling or impulse at its very first stirring — the flicker of irritation,
  craving, or judgment before it turns into a word or action. Don''t suppress it or act on it; simply
  notice it clearly and ask, ''Does following this align with who I actually want to be?'' This is ''being
  careful about what is not yet seen'': tending the interior at the moment of emergence, when small course-corrections
  are still easy.'
