unit_label: The Path May Not Be Left for an Instant
title: The Path May Not Be Left for an Instant
unit_type: sutra
sanskrit_devanagari: 道也者，不可須臾離也，可離非道也。是故君子戒慎乎其所不睹，恐懼乎其所不聞。
sanskrit_iast: Classical Chinese.
translation_literal: The path may not be left for an instant. If it could be left, it would not be the path. On this account,
  the superior man does not wait till he sees things, to be cautious, nor till he hears things, to be apprehensive.
commentary: '«The Path May Not Be Left for an Instant» locates the Mean not as mediocrity but as the living balance of nature
  and cultivation: what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test
  the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **道 (dào)** — The Way or Path—not an abstract principle but a continuous lived practice that cannot be suspended even momentarily
  without ceasing to be itself.

  **中庸 (zhōngyōng)** — The Mean or Equilibrium—the dynamic balance between nature and cultivation, tested most acutely in
  solitude and ordinary moments.

  **慎 (shèn) / 恐 (kǒng)** — Caution and apprehension—not reactive emotions but preemptive attentiveness that precedes sensory
  encounter, rooted in constant vigilance of the Way.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2 (virtue as hexis, habitual state):** Both traditions ground virtue in continuous
  practice that becomes second nature; the superior man''s preemptive caution mirrors Aristotle''s claim that virtue is a
  stable disposition requiring constant exercise. Divergence: Aristotle emphasizes rational deliberation and the mean between
  extremes as calculable; Zhongyong locates the Mean as irreducible lived continuity that cannot be left even an instant,
  making it less a rational mean than an ontological necessity.

  **Confucian Analects 4.1 (Confucius on dwelling in humaneness):** Both passages insist on the impossibility of intermittent
  virtue—one cannot leave the Way or humaneness and return to it; both demand constant embodied presence. Divergence: The
  Analects emphasizes social relationships and ritual propriety as the arena of virtue; Zhongyong extends the demand into
  solitude and the pre-sensory moment, making the test internal and anticipatory rather than relational.'
insight: '«The Path May Not Be Left for an Instant» locates the Mean not as mediocrity but as the living balance of nature
  and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
