unit_type: verse
section: XXVI.1-3
sanskrit_devanagari: '天地之道，可一言而尽也。其為物不貳，則其生物不測。天地之道：博也，厚也，高也，明也，悠也，久也。(Tiāndi zhī dào, kě yī yán ér jìn yě. Qī wéi wù bù èr,
  zé qī shēng wù bù cè. Tiāndi zhī dào: báo yě, hòu yě, gāo yě, míng yě, yōu yě, jiǔ yě.)'
sanskrit_iast: ''
translation_literal: 'The Way of Heaven and Earth can be summed up in a single phrase: their operation is without duality
  (bù èr), therefore their generation of things is unfathomable. The Way of Heaven and Earth is: vast, thick, lofty, luminous,
  enduring, and perpetual.'
commentary: 'This passage articulates the metaphysical foundation of the Zhongyong''s ethics. The phrase ''without duality''
  (bù èr) denotes the seamless, non-contradictory nature of cosmic operation—Heaven and Earth do not hesitate or bifurcate
  in their generative function. Their constancy produces an inexhaustible fecundity (''生物不測''—shēng wù bù cè, the generation
  of beings exceeds measurement). The six predicates that follow—vastness, thickness, height, luminosity, endurance, perpetuity—form
  a phenomenological description of how the Way manifests. This cosmological vision grounds human virtue: just as Heaven-Earth
  operate without internal conflict through centrality and equilibrium (zhongyong itself), the sage cultivates sincerity (cheng)
  by aligning with this ceaseless, non-dualistic generative power. The passage rejects both mechanical determinism and arbitrary
  spontaneity, positing instead a teleological yet non-coercive unfolding.


  Key Terms


  **不貳** — “Not two”: an undivided, non-conflicted mode of cosmic operation.

  **生物不測** — The production of living things is beyond calculation or exhaustive measurement.

  **博厚** — Vastness and depth, especially the earth’s capacious sustaining power.

  **悠久** — Far-reaching endurance and lasting continuity through time.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.2.1, “one only, without a second” (ekam evādvitīyam):** Both texts connect an undivided principle
  with the emergence and coherence of the manifold world. Divergence: The Upaniṣad identifies ultimate reality as a singular
  being, whereas the Zhongyong describes the unified operation of Heaven and Earth.

  **Genesis 1:1–31:** Genesis likewise portrays heaven and earth as the setting for an abundant, ordered production of living
  beings. Divergence: Genesis grounds generation in the deliberate commands of a personal creator, while the Zhongyong emphasizes
  an impersonal and seamless cosmic constancy.

  **Spinoza, Ethics I, Proposition 16:** Spinoza holds that infinitely many things follow from the necessity of divine nature,
  paralleling the passage’s inexhaustible generation of beings. Divergence: Spinoza presents this as a deductive account of
  one infinite substance, while the Zhongyong joins cosmic fecundity to the ethical ideal of sustained human sincerity.'
practice: Each dawn, sit in stillness for twelve breaths. With each exhalation, contemplate one of the six attributes of Heaven-Earth's
  Way (vastness, thickness, height, luminosity, endurance, perpetuity). Do not force understanding; instead, sense how your
  own breath—constant, undivided, generative—mirrors the ceaseless working. Then rise and perform one deliberate act of ritual
  propriety (li) with full sincerity (cheng), recognizing it as participation in Heaven's non-dualistic operation.
