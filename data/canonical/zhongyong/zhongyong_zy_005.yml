section: I.1
sanskrit_devanagari: 天命之謂性，率性之謂道，修道之謂教。道也者，不可須臾離也；可離，非道也。是故君子戒慎乎其所不睹，恐懼乎其所不聞。莫見乎隱，莫顯乎微。故君子慎其獨也。
sanskrit_iast: ''
translation_literal: What Heaven commands is called nature. To follow one’s nature is called the Way (dao).
  To cultivate the Way is called teaching. The Way is that from which one cannot depart even for a single
  instant; what may be departed from is not the Way. Therefore the exemplary person is watchful and cautious
  where nothing is seen, and reverently apprehensive where nothing is heard. Nothing is more manifest
  than what is hidden; nothing is more evident than what is subtle. Therefore the exemplary person is
  careful in solitude.
commentary: 'The opening of the Zhongyong grounds moral cultivation neither in arbitrary convention nor
  in withdrawal from ordinary life. Xing, human nature, is “commanded” by Heaven: it bears a normative
  orientation that is fulfilled by following it rather than by escaping it. Dao is consequently not a
  path reserved for rituals, crises, or public display. If a supposed way can be put aside whenever no
  one is looking, it is not the Way in this strong sense. The final lines turn this metaphysical claim
  into a discipline of attention. Hidden motives and minute beginnings are precisely where conduct becomes
  visible in its deepest character. “Careful in solitude” (shen du) does not prescribe anxious self-surveillance;
  it names integrity when reputation, reward, and coercion are absent. Education cultivates this unbroken
  responsiveness, bringing outer ritual and inward sincerity into accord.


  Key Terms


  **道 (dao)** — The Way: the normative course of human life, inseparable from genuine moral action.

  **性 (xing)** — Nature: the Heaven-endowed moral disposition that one is to follow and realize.

  **天命 (tianming)** — Heaven’s command: the transcendent source or endowment of human nature.

  **慎其獨 (shen qi du)** — Being careful in one’s solitude: integrity in unseen intention and private conduct.


  Cross-Tradition Resonances


  **Deuteronomy 30:11–14:** The Torah is described as not remote but “very near” in mouth and heart, like
  the Zhongyong’s Way as inseparable from life.

  **Marcus Aurelius, Meditations:** Stoic practice calls one to live continuously in accordance with nature,
  including in the privacy of one’s own ruling faculty.

  **The Bhagavad Gita, especially 3.19:** The Gita commends action performed without dependence on public
  reward, paralleling care for the moral quality of action beyond appearances.'
practice: 'Before sleeping, recall one moment from the day when no one could have observed you. Ask: “What
  intention was present?” Without self-condemnation, name one small adjustment that would make your private
  conduct and public conduct accord tomorrow.'
