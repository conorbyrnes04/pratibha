sanskrit_devanagari: 喜怒哀樂之未發，謂之中；發而皆中節，謂之和。中也者，天下之大本也；和也者，天下之達道也。致中和，天地位焉，萬物育焉。
sanskrit_iast: Classical Chinese.
translation_literal: When joy, anger, grief, and delight have not yet stirred, this is called zhōng 中
  — the state of centered equilibrium. When they arise and each one hits its proper measure, this is called
  hé 和 — harmony. This zhōng is the great root of everything under heaven; this hé is the Way that reaches
  everywhere. Bring zhōng and hé to their fullest, and heaven and earth take their rightful places, and
  the ten thousand things are nourished into growth.
commentary: 'This passage locates the ground of moral life in a state prior to emotion. Before joy, anger,
  grief, or delight has moved, the mind rests in zhōng 中 — not a suppression of feeling but an unstirred
  equilibrium, a poised readiness that has not yet tilted in any direction. This is why the text calls
  zhōng the ''great root'' (dà běn 大本): it is the still center out of which all right response grows,
  and it aligns directly with the opening premise of the Zhōngyōng that our nature (xìng 性) is conferred
  by tiān 天. To dwell in zhōng is to be at rest in that Heaven-given nature before it is drawn outward.
  Hé 和, harmony, is what happens when the emotions do arise: the key phrase is zhòng jié 中節, to ''hit
  the measure'' — each feeling appearing in due proportion, neither excessive nor deficient, exactly fitted
  to its occasion. Note the wordplay the Chinese trades on: the zhōng of equilibrium (centered) and the
  zhòng of ''hitting the mark'' are written with the same graph 中. Centeredness at rest and accuracy in
  action are two faces of one thing. Hé is called the ''Way that reaches everywhere'' (dá dào 達道) because
  harmonious, well-measured response is what makes the dào workable across all situations and relationships.
  The closing lines make a startling claim: fully realizing zhōng and hé is not merely a private psychological
  achievement but a cosmological one. When the human center is properly established, heaven and earth
  settle into their places and the ten thousand things flourish. The Confucian intuition here is that
  the inner order of a cultivated person is continuous with the order of the cosmos — sincerity and balance
  in the human heart participate in the same pattern that governs the natural world. This is where zhōng
  silently prepares the ground for chéng 誠, the sincerity that later chapters develop: an integrity so
  complete that inner state and outer response are one.


  Key Terms


  **中 (zhōng)** — Centered equilibrium; the unstirred, balanced state before emotion arises — the ''great
  root'' of all right response.

  **和 (hé)** — Harmony; the state in which aroused emotions each hit their proper measure, neither excessive
  nor deficient.

  **中節 (zhòng jié)** — To ''hit the measure'' — feelings expressed in exact, fitting proportion to their
  occasion.'
insight: '«Before Pleasure and Anger Arise» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'Before you react today, find the pause. The next time a strong feeling rises — irritation at
  an email, a surge of frustration in traffic, sudden delight — stop for one slow breath before you respond.
  In that breath, notice the state just underneath the emotion: the quiet ground the feeling arose from.
  Then ask a single question: ''What is the right measure here?'' Let the feeling be real, but let it
  come out fitted to the situation — not bigger, not smaller. Doing this even three times a day trains
  the movement from zhōng (the unstirred center) to hé (response in proper proportion), which is the whole
  practice of this passage in miniature.'
