unit_type: sutra
sanskrit_devanagari: 喜怒哀樂之未發，謂之中；發而皆中節，謂之和。中也者，天下之大本也；和也者，天下之達道也。致中和，天地位焉，萬物育焉。
sanskrit_iast: Classical Chinese.
translation_literal: While there are no stirrings of pleasure, anger, sorrow, or joy, the mind may be
  said to be in the state of EQUILIBRIUM. When those feelings have been stirred, and they act in their
  due degree, there ensues what may be called the state of HARMONY. This EQUILIBRIUM is the great root
  from which grow all the human actings in the world, and this HARMONY is the universal path which they
  all should pursue. Let the states of equilibrium and harmony exist in perfection, and a happy order
  will prevail throughout heaven and earth, and all things will be nourished and flourish.
commentary: '«Before Pleasure and Anger Arise» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **中 (zhōng)** — Center or equilibrium; the state before emotional stirring, where the mind rests in
  its original nature prior to differentiation

  **和 (hé)** — Harmony or concord; the proper expression of emotions after they have been aroused, each
  in its fitting measure and time

  **未發 (wèi fā)** — Not yet stirred or manifest; the primordial condition before pleasure, anger, sorrow,
  and joy emerge into consciousness


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6–9 (doctrine of the mean):** Both locate virtue in a measured middle
  state between extremes—anger neither suppressed nor excessive, pleasure neither denied nor indulged
  Divergence: Aristotle grounds the mean in rational deliberation and habit; Zhongyong grounds it in a
  pre-rational, natural equilibrium that precedes the need for deliberative choice

  **Daodejing 15 (the sage''s stillness and response):** Both prize a state of inner quiescence from which
  appropriate action flows spontaneously, without forcing or artifice Divergence: Daodejing emphasizes
  withdrawal from social convention; Zhongyong insists equilibrium and harmony are the root of all human
  conduct and social order, not an escape from it'
insight: '«Before Pleasure and Anger Arise» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what
  changes.
