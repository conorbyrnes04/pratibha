title: The Way Is Not Far from Man
unit_type: sutra
sanskrit_devanagari: 子曰：「道不遠人。人之為道而遠人，不可以為道。」
sanskrit_iast: Classical Chinese.
translation_literal: 'The Master said: "The dào 道 is not remote from human beings. If someone practices a dào that distances
  them from other people, it cannot be regarded as the true dào."'
commentary: 'This brief saying makes a decisive claim about where the Way is located: not in some rarefied height above ordinary
  life, but within the fabric of human relationships and daily conduct. The word 遠 (yuǎn, "far") appears twice and carries
  the whole argument. First it denies distance—the dào is not far from man—and then it exposes a false path: any practice
  that pushes a person away from others has already lost the Way, whatever it claims for itself. The passage thus draws a
  boundary against a certain kind of spiritual ambition. To pursue an esoteric, isolating discipline that separates the seeker
  from the human community is, by that very separation, to fail. Within the logic of the Zhōngyōng, this coheres with the
  opening premise that the dào follows from xìng 性, the nature conferred by tiān 天—a nature we share as human beings. Because
  the Way is grounded in our common nature, it must be lived out through our common life. The measure of an authentic Way
  is therefore relational and near at hand: does this practice bring me into right contact with the people around me, or does
  it wall me off? The teaching also anticipates the text''s later emphasis on chéng 誠 (sincerity, integral wholeness), for
  genuineness is proven in how one treats others, not in withdrawn purity. Zhōng 中—centrality, the balanced mean—is not a
  private equilibrium but one that holds steady precisely amid human dealings. The saying quietly rebukes both the escapist
  and the perfectionist: the Way you can walk is the one that keeps you among people.


  Key Terms


  **道 (dào)** — The Way—here the proper path of human conduct, lived out among people rather than apart from them.

  **遠 (yuǎn)** — Far, distant; the passage''s pivot-word, used to reject any Way that separates a person from others.

  **性 (xìng)** — The nature conferred by tiān 天; because it is shared and human, the Way rooted in it must be near and relational.'
insight: '«The Way Is Not Far from Man» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Before you begin any spiritual, creative, or self-improvement practice today—sitting, reading, exercising, meditating—pause
  and name one person whose presence or need might pull against that practice, then proceed only if you can hold both that
  person and the practice together in your intention.
