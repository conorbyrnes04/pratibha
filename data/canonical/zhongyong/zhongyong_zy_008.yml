section: I.4
sanskrit_devanagari: 喜怒哀樂之未發，謂之中；發而皆中節，謂之和。中也者，天下之大本也；和也者，天下之達道也。致中和，天地位焉，萬物育焉。
sanskrit_iast: ''
translation_literal: Before joy, anger, sorrow, and pleasure have arisen, this is called equilibrium (zhong). When they arise
  and all hit their proper measure, this is called harmony (he). Equilibrium is the great root of all under Heaven; harmony
  is the Way that reaches everywhere under Heaven. Extend equilibrium and harmony to their utmost, and Heaven and Earth take
  their proper places, and the myriad things are nurtured.
commentary: 'The passage distinguishes an original centeredness from the ethical achievement of fitting response. Zhong does
  not mean the suppression or absence of feeling: it names the undivided, not-yet-activated center from which feeling can
  emerge without distortion. He is not mere peace or social agreeableness; it is the condition in which each emotion, once
  aroused, is proportionate to its occasion, neither excessive nor deficient. The final claim joins personal cultivation to
  cosmic order. “Heaven and Earth take their places” need not be read as a crude promise that private composure controls nature.
  Rather, the text presents moral attunement as participation in the normative pattern of a living cosmos: when human responsiveness
  is rightly ordered, relations can become fertile rather than destructive. To “extend to the utmost” is therefore a sustained
  practice of discernment in concrete situations, not a retreat into emotional blankness.


  Key Terms


  **中 (zhong)** — Equilibrium or centrality: the unskewed inner center prior to reactive emotional expression.

  **和 (he)** — Harmony: emotions and actions attaining the measure appropriate to time, role, and circumstance.

  **中節 (zhongjie)** — Hitting the proper measure: fittingness rather than emotional moderation by a fixed numerical mean.

  **致 (zhi)** — To bring to full realization or extend to the utmost through cultivation.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics:** Aristotle likewise treats virtue as feeling and acting at the right time, toward the
  right objects, and in the right degree. Divergence: His mean is principally an account of acquired moral virtue and practical
  reason, whereas the Zhongyong roots fitting response in a cosmological centrality.

  **Buddhist teaching on the Middle Way:** Both reject extremes and direct attention toward a disciplined, non-distorted mode
  of life. Divergence: The Buddhist Middle Way centrally concerns liberation from craving and suffering; the Zhongyong emphasizes
  the proper expression of emotions within ethical and relational order.

  **Stoicism, especially Epictetus:** Stoic practice seeks freedom from disordered affect and a response aligned with the
  order of nature. Divergence: Stoicism tends toward transforming passions through judgment, while this passage permits joy,
  anger, sorrow, and pleasure when each is appropriately expressed.'
practice: 'At the first rise of a strong emotion, pause for three breaths. Name the emotion, identify the situation that calls
  it forth, and ask: “What expression of this feeling would fit this person, this time, and this consequence?” Then choose
  one measured sentence or action rather than either venting or repressing it.'
