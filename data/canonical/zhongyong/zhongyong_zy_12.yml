unit_label: Only the Most Complete Sincerity
title: Only the Most Complete Sincerity
unit_type: sutra
sanskrit_devanagari: 唯天下至誠，為能盡其性；能盡其性，則能盡人之性；能盡人之性，則能盡物之性；能盡物之性，則可以贊天地之化育；可以贊天地之化育，則可以與天地參矣。
sanskrit_iast: Classical Chinese.
translation_literal: It is only he who is possessed of the most complete sincerity that can exist under heaven, who can give
  its full development to his nature. Able to give its full development to his own nature, he can do the same to the nature
  of other men. Able to give its full development to the nature of other men, he can give their full development to the natures
  of animals and things. Able to give their full development to the natures of creatures and things, he can assist the transforming
  and nourishing powers of Heaven and Earth. Able to assist the transforming and nourishing powers of Heaven and Earth, he
  may with Heaven and Earth form a ternion.
commentary: '«Only the Most Complete Sincerity» locates the Mean not as mediocrity but as the living balance of nature and
  cultivation: what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test
  the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.'
insight: '«Only the Most Complete Sincerity» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
