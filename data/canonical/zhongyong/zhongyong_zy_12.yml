title: Only the Most Complete Sincerity
unit_type: sutra
sanskrit_devanagari: 唯天下至誠，為能盡其性；能盡其性，則能盡人之性；能盡人之性，則能盡物之性；能盡物之性，則可以贊天地之化育；可以贊天地之化育，則可以與天地參矣。
sanskrit_iast: Classical Chinese.
translation_literal: Only the most complete sincerity (chéng 誠) in all the world is able to fully realize
  its own nature (xìng 性). Being able to fully realize its own nature, it can then fully realize the nature
  of other people. Being able to fully realize the nature of other people, it can then fully realize the
  nature of things. Being able to fully realize the nature of things, it can then assist the transforming
  and nourishing work of Heaven and Earth (tiān 天). Being able to assist the transforming and nourishing
  work of Heaven and Earth, it can then form a triad standing alongside Heaven and Earth.
commentary: 'This passage builds a single ascending chain, each link resting on the one before it, moving
  outward from the innermost self to the widest cosmic scale. The engine that drives the whole sequence
  is chéng 誠 — sincerity, integrity, wholeness — here raised to its highest degree (zhì chéng 至誠), ''the
  most complete sincerity.'' In the Zhōngyōng, chéng is not merely honesty in speech; it is a state of
  being undivided, without pretense or internal gap between what one is and how one acts. The claim is
  that only such total genuineness can ''fully realize'' or exhaust (jìn 盡) one''s own nature — that is,
  actualize the whole of what one was given to be. The word xìng 性 recalls the opening of the text, where
  nature is what Heaven confers; to fully realize one''s nature is therefore to complete the Heaven-given
  endowment rather than to invent something new. The striking move is the outward extension: realizing
  one''s own nature enables realizing the nature of others, then of all things, because on this view human
  nature and the nature of everything share a common root in Heaven. Genuineness at the center radiates
  competence and care outward — self-completion is not private but relational and finally cosmic. The
  climax, ''to form a triad with Heaven and Earth,'' places the fully sincere person as a third partner
  in the ongoing creative work of the universe, not a spectator but a participant who helps the world''s
  transformation and nourishment along. Notice how zhōng 中 (centrality) operates implicitly here: the
  sincere self stands at the balanced center from which it can act rightly in every widening circle. The
  passage thus fuses inner authenticity with outward efficacy — the more truly one becomes oneself, the
  more one can serve everything else.


  Key Terms


  **誠 chéng** — Sincerity, integrity, wholeness; being undivided, with no gap between one''s true nature
  and one''s actions.

  **性 xìng** — Nature; the endowment conferred by Heaven that each being is meant to fully actualize.

  **盡 jìn** — To exhaust or fully realize; to bring a nature to its complete actualization.'
insight: '«Only the Most Complete Sincerity» locates the Mean not as mediocrity but as the living balance
  of nature and cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'Trace backward through one decision or action you made today: name the smallest gap between
  what you truly felt and what you showed, then sit with that gap without closing it for three breaths,
  letting sincerity mean acknowledging the split rather than pretending it isn''t there—this is the first
  link in the chain outward.'
