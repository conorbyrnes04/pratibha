unit_label: The Way Is Not Practised
title: The Way Is Not Practised
unit_type: sutra
sanskrit_devanagari: 子曰：「道之不行也，我知之矣：知者過之，愚者不及也。道之不明也，我知之矣：賢者過之，不肖者不及也。」
sanskrit_iast: Classical Chinese.
translation_literal: The Master said, 'I know how it is that the path of the Mean is not walked in:—The knowing go beyond
  it, and the stupid do not come up to it. I know how it is that the path of the Mean is not understood:—The men of talents
  and virtue go beyond it, and the worthless do not come up to it.'
commentary: '«The Way Is Not Practised» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test the claim in
  experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **zhongyong (中庸)** — The Way of the Mean; the dynamic equilibrium between excess and deficiency that constitutes authentic
  human conduct and cosmic order

  **zhi (知)** — Knowing or understanding; here distinguished from mere intellectual comprehension to mean lived recognition
  tested in solitude and practice

  **xing (行)** — Walking, practicing, or embodying; the actualization of understanding through concrete conduct that cannot
  be deferred


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6–9:** Both locate virtue as a mean between extremes (excess and deficiency), requiring
  practical wisdom (phronesis/zhongyong) developed through habituation rather than theory alone Divergence: Aristotle emphasizes
  rational deliberation and habituation through repeated action, while Zhongyong stresses the immediate, non-deliberative
  quality of the Mean as what ''cannot be left even for a moment''

  **Confucian Analects VI.29 (Confucius on the superior person''s ease):** Both traditions locate authentic practice in effortless
  alignment rather than strained effort; the Mean is not achieved through force but through returning to original nature Divergence:
  The Analects emphasizes gradual self-cultivation through ritual and study, whereas Zhongyong''s commentary insists on immediate
  testing in solitude and the incompleteness of insight without application'
insight: '«The Way Is Not Practised» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
