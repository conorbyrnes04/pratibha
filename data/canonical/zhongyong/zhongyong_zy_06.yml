unit_label: The Way Is Not Practised
title: The Way Is Not Practised
unit_type: sutra
sanskrit_devanagari: 子曰：「道之不行也，我知之矣：知者過之，愚者不及也。道之不明也，我知之矣：賢者過之，不肖者不及也。」
sanskrit_iast: Classical Chinese.
translation_literal: 'The Master said: I understand why the dào is not practised: the clever go past it, and the foolish fall
  short of it. I understand why the dào is not made clear: the worthy go past it, and the unworthy fall short of it.'
commentary: 'This passage diagnoses the failure of the Way through a single structural principle: both excess and deficiency
  miss the mark. This is the practical face of zhōng 中—centrality is not a bland midpoint but the precise place where a thing
  is done rightly, neither overshooting nor undershooting. Confucius pairs two verbs deliberately. The Way is not *practised*
  (行) because of a defect in conduct: the clever overreach it (they think they are beyond it, or complicate it with cleverness),
  while the foolish never reach it at all. The Way is not *understood* or *made clear* (明) because of a defect in insight:
  the worthy demand too much and press past what the Way actually asks, while the unworthy do not grasp enough to see it.
  The chiastic symmetry—clever/foolish, worthy/unworthy—shows that being gifted is no guarantee. Talent tends to overshoot;
  incapacity falls short; both leave the center empty. This connects to the text''s larger claim that the Way follows from
  xìng 性, our Heaven-conferred nature: the Way is near, ordinary, woven into daily conduct, and so it is missed precisely
  by those who look too high or too low rather than at what is in front of them. The subtlety the passage rewards is that
  overshooting is as much a failure as falling short—an unusual and humbling idea for anyone who assumes more effort or more
  brilliance always helps.


  Key Terms


  **zhōng 中** — Centrality or equilibrium; the precise, fitting response that neither exceeds nor falls short of what a situation
  requires.

  **dào 道** — The Way; here the right course of human conduct, understood as ordinary and near rather than remote or elevated.

  **xìng 性** — One''s Heaven-conferred nature, from which the Way follows; the ground for why the Way is close at hand and
  missed only through excess or deficiency.'
insight: '«The Way Is Not Practised» locates the Mean not as mediocrity but as the living balance of nature and cultivation:
  what cannot be left even for a moment is tested most in solitude.'
practice: 'Throughout your day, each time you feel the impulse to act or speak, notice whether you are reaching *past* the
  moment (adding, explaining, controlling) or falling *short* of it (withdrawing, staying silent, leaving things unfinished)—then
  do the smaller thing: speak less, wait longer, ask once instead of twice, or step forward when you habitually hold back.'
