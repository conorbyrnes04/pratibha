unit_label: The Superior Man Embodies the Mean
title: The Superior Man Embodies the Mean
unit_type: sutra
sanskrit_devanagari: 仲尼曰：「君子中庸，小人反中庸。君子之中庸也，君子而時中；小人之中庸也，小人而無忌憚也。」
sanskrit_iast: Classical Chinese.
translation_literal: 'Zhòngní said: "The noble person embodies the zhōngyōng (centered constancy); the small-minded person
  goes against it. The noble person''s zhōngyōng lies in being a noble person who holds to the center according to the moment.
  The small-minded person''s version of zhōngyōng is that, being small-minded, he acts without caution or restraint."'
commentary: 'This short saying, attributed to Confucius (Zhòngní being his courtesy name), sets up the central contrast of
  the whole text: the noble person (junzi) and the small-minded person (xiaoren) as two orientations toward zhōng 中, the center.
  The zhōng in zhōngyōng is not a fixed midpoint you locate once and settle into; the phrase shí zhōng 時中—''centering according
  to the moment''—makes this explicit. The center shifts with circumstance, and holding to it requires continuous, responsive
  judgment rather than a rigid rule. This is why the noble person''s practice is described as active: he ''holds to the center
  according to the moment,'' recalibrating as situations change. The small-minded person''s failure is diagnosed precisely:
  wú jìdàn 無忌憚, acting ''without caution or restraint.'' The problem is not that he consciously rejects the center but that
  he has no reverent wariness, no sense of a standard beyond his own impulse—so whatever he does, he passes off as reasonable.
  The passage thus locates virtue not in a doctrine but in a quality of attention: the willingness to be constrained by what
  the moment truly requires. Yōng 庸, the constancy or ordinariness paired with zhōng, suggests that this centered responsiveness
  is meant to be sustained in daily life, not reserved for grand occasions. Although chéng 誠 (sincerity) and xìng 性 (nature)
  are not named here, this opening establishes the disposition on which they depend: only someone attentive enough to sense
  the true center of each situation can follow the dào 道 that flows from one''s Heaven-conferred nature.


  Key Terms


  **中庸 zhōngyōng** — Centered constancy; holding to the balanced center as a sustained, everyday practice.

  **時中 shí zhōng** — Centering according to the moment—finding the right balance responsively as circumstances change, not
  by fixed rule.

  **忌憚 jìdàn** — Cautious wariness or reverent restraint; the small-minded person is faulted for lacking it.'
insight: '«The Superior Man Embodies the Mean» locates the Mean not as mediocrity but as the living balance of nature and
  cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: 'Once today, before responding to something that irritates or provokes you—an email, a comment, a small conflict—pause
  and ask: ''What does this specific moment actually call for?'' Notice the pull toward your habitual reaction (defending,
  escalating, dismissing) and treat that pull as the ''small-minded'' impulse to act without restraint. Then choose the response
  that fits the real circumstance rather than your reflex. Doing this even once trains shí zhōng, the habit of finding the
  center as the moment requires it.'
