unit_label: The Superior Man Embodies the Mean
title: The Superior Man Embodies the Mean
unit_type: sutra
sanskrit_devanagari: 仲尼曰：「君子中庸，小人反中庸。君子之中庸也，君子而時中；小人之中庸也，小人而無忌憚也。」
sanskrit_iast: Classical Chinese.
translation_literal: Zhongni said, 'The superior man embodies the course of the Mean; the mean man acts contrary to the course
  of the Mean. The superior man's embodying the course of the Mean is because he is a superior man, and so always maintains
  the Mean. The mean man's acting contrary to the course of the Mean is because he is a mean man, and has no caution.'
commentary: '«The Superior Man Embodies the Mean» locates the Mean not as mediocrity but as the living balance of nature and
  cultivation: what cannot be left even for a moment is tested most in solitude. The passage asks a living reader to test
  the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **zhongyong (中庸)** — The course or way of the Mean; the dynamic equilibrium between extremes that constitutes both cosmic
  order and human virtue

  **junzi (君子)** — The superior man; one who embodies moral cultivation and maintains the Mean through constant self-correction

  **xiaoren (小人)** — The mean or small man; one who lacks vigilance and deviates from the Mean through negligence and absence
  of caution


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6-9:** Both traditions locate virtue in a mean between extremes (mesotes/中), achieved
  through habituation and requiring constant practical wisdom to discern the appropriate response in each circumstance Divergence:
  Aristotle grounds the mean in rational calculation and deliberation about particulars, while the Zhongyong emphasizes an
  intuitive embodiment (ti 體) that precedes and transcends conscious deliberation

  **Mencius 2A.2 on the sprout of compassion:** Both texts posit that virtue inheres naturally in human nature but requires
  cultivation and vigilance (jing 敬) to prevent its corruption or loss through negligence Divergence: Mencius locates the
  source of the Mean in innate moral sprouts that need nurturing, while the Zhongyong presents the Mean as a cosmic principle
  that the superior man embodies through constant attentiveness rather than develops from latent potential'
insight: '«The Superior Man Embodies the Mean» locates the Mean not as mediocrity but as the living balance of nature and
  cultivation: what cannot be left even for a moment is tested most in solitude.'
practice: Practice watchfulness in one private interval today—when no one is measuring you—and note what changes.
