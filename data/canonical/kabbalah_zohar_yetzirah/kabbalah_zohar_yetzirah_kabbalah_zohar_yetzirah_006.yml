translation: These ten Sephiroth which are ineffable, whose appearance is like scintillating flames, have no end but are infinite.
abhyasa: Sit quietly and hold in mind the image of ten flames—each distinct, each flickering and alive, yet all arising from
  a single source you cannot fully see. Notice how the flames seem to end (their visible tips) yet also seem to extend beyond
  sight. Spend a few minutes with this tension, without resolving it.
