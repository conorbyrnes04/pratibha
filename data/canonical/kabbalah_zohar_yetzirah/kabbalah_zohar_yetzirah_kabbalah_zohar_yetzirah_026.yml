translation: White are His garments, and His appearance is the likeness of a Face vast and terrible.
abhyasa: Sit quietly and hold in mind the phrase 'white garments' and 'terrible face' together without resolving them. Notice
  what arises when you refuse to soften one quality with the other. This is not visualization but a contemplative holding
  of paradox—a small training in encountering what cannot be domesticated by the mind.
