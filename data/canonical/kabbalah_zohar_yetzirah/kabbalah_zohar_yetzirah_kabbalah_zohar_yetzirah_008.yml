abhyasa: Today, when you encounter a teaching or mystery that draws your mind but leaves you uncertain, practice the discipline
  of stopping. Notice the impulse to grasp or explain. Instead, simply return to your ordinary awareness—your breath, your
  surroundings, your grounded self. This is not failure; it is fidelity to the covenant of honest practice.
