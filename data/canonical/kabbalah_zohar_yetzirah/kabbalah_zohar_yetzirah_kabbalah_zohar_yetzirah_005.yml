  label: Translation
  body: These Ten Numbers, beyond the Infinite one, have the boundless realms, boundless origin and end,
    an abyss of good and one of evil, boundless height and depth, East and West, North and South, and
    the one only God and king, faithful forever seated on his throne, shall rule over all, forever and
    ever.
