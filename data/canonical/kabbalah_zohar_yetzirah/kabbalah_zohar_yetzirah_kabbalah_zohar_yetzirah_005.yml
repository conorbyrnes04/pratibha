  cultural_context: Kabbalah is the esoteric stream of Jewish mysticism; some hold it as study-restricted
    (traditionally approached with maturity and grounding). Offered here with humility as a study reading,
    from public-domain translations — Westcott's Sefer Yetzirah and Mathers' Zohar.
translation: These Ten Numbers, beyond the Infinite one, have the boundless realms, boundless origin and
  end, an abyss of good and one of evil, boundless height and depth, East and West, North and South, and
  the one only God and king, faithful forever seated on his throne, shall rule over all, forever and ever.
