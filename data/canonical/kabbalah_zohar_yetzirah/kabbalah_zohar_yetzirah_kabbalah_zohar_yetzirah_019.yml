abhyasa: 'Sit quietly and contemplate one element—fire, water, or air—as it appears in your immediate experience (breath,
  warmth, moisture). Notice how it seems both singular and dual (hot and cold, flowing and still, moving and still). Rest
  in the question: what unity might contain these opposites?'
