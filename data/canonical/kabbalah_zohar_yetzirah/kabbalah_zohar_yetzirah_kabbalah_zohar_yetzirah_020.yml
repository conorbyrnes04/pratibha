abhyasa: 'Sit quietly and contemplate the three elements as they manifest in your immediate environment: the warmth or light
  around you (Fire/Heaven), the moisture or weight you feel (Water/Earth), and the breath or space between them (Air/Spirit).
  Notice how none exists in isolation. Whisper or silently vocalize the three mother letters—Aleph, Mem, Shin—and observe
  which element each seems to evoke in your body and awareness.'
