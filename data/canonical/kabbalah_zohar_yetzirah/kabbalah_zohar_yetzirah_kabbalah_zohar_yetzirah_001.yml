abhyasa: 'Sit quietly and slowly recite or contemplate the divine attributes listed: merciful, gracious, sublime. After each,
  pause and notice: where do you encounter that quality in your own experience today? Not as belief, but as observation. This
  grounds abstract theology in lived perception.'
