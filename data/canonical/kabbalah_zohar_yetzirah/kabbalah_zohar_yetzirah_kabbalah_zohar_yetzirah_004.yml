translation: Ten are the numbers of the ineffable Sephiroth, ten and not nine, ten and not eleven.
abhyasa: 'Sit quietly and contemplate the number ten: ten fingers, ten toes, the ten words of creation in Genesis. Notice
  how ten feels complete—neither sparse nor overwhelming. Without needing to know the Sephiroth by name, ask yourself: what
  in my own experience feels whole and balanced? What breaks when something is missing or added?'
