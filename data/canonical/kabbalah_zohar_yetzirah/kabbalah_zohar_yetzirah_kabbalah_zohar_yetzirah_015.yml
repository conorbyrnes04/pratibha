abhyasa: 'Slowly speak or whisper each of the five Hebrew letter-groups (gutturals: א ח ע ה; palatals: ג כ ק; linguals: ד
  ט ל נ ת; dentals: ז ס ש; labials: ב מ פ), attending to where in your throat, mouth, and lips each sound originates. Notice
  how the body itself becomes a map of differentiation and order. Sit with one group for a few breaths, feeling the vibration
  and location.'
