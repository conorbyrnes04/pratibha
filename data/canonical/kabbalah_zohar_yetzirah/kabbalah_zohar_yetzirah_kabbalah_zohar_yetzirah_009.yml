translation: These are the ten emanations of number. One is the Spirit of the Living God, blessed and more than blessed be
  the name of the Living God of Ages.
abhyasa: 'Sit quietly and consider: what is the difference between the Spirit that blesses and the act of blessing itself?
  Can you feel, for even a moment, the aliveness in your own breath or awareness before you name it? This is an invitation
  to sense the ''Living God'' not as doctrine but as the animating presence prior to thought.'
