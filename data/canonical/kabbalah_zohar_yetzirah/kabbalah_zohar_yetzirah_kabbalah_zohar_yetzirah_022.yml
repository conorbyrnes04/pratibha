title: These three mothers did he create, form, and…
unit_type: verse
commentary: 'This passage from Sefer Yetzirah presents a foundational principle: that three primordial letters (the ''mothers'')
  operate as generative forces across three domains—cosmic (world), temporal (year), and human (male and female). The passage
  suggests a correspondence or mirroring: the same creative principle that structures the universe also structures time and
  the human body. This is not metaphor alone but a claim about the architecture of reality itself—that creation unfolds through
  repeated patterns across scales.



  Key Terms



  **three mothers** — In Sefer Yetzirah, the three primordial letters (Aleph, Mem, Shin) understood as generative principles
  or archetypal forces that structure creation across all domains.

  **correspondence** — The principle that patterns and laws operating in one realm (e.g., the cosmos) are reflected or repeated
  in other realms (e.g., the human body or the calendar year).



  Cross-Tradition Resonances



  **Hermes Trismegistus, Emerald Tablet: ''As above, so below'':** Both assert a mirroring of principles across scales—cosmic
  and human orders reflect one another. Divergence: The Emerald Tablet speaks of a single universal law; Sefer Yetzirah specifies
  three particular generative forces and their combinations.


  **Tao Te Ching 42: ''The Tao gave birth to One... One gave birth to Two... Two gave birth to Three... Three gave birth to
  the ten thousand things'':** Both describe creation as unfolding through primary principles (one/three) that generate multiplicity
  across all existence. Divergence: The Tao Te Ching emphasizes sequential emanation from unity; Sefer Yetzirah emphasizes
  simultaneous correspondence across fixed domains (world, year, human).


  **Plato, Timaeus: the Demiurge creates the world according to eternal forms that also structure the human soul:** Both propose
  that a single archetypal design governs both macrocosm and microcosm. Divergence: Plato grounds this in eternal, unchanging
  Forms; Sefer Yetzirah grounds it in dynamic, combinatorial letters and their permutations.'
