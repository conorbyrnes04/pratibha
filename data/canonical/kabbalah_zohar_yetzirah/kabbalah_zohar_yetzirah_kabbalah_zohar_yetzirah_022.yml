abhyasa: Observe one cycle today—sunrise to sunset, or one hour to the next—and notice how the same pattern of beginning,
  middle, and ending appears in your breath, a conversation, a task. What 'three mothers' or primary forces do you sense moving
  through that small cycle? Sit with the question without forcing an answer.
