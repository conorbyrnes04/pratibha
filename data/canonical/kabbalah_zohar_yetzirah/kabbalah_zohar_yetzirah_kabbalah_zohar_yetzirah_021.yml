translation: In the Year or as regards Time, these three mothers represent Heat, Cold, and a Temperate climate, the heat from
  the fire, the cold from the water, and the temperate state from the spiritual air which again is an equalizer between them.
abhyasa: 'Sit quietly and notice your own body''s temperature regulation—the warmth of your core, the coolness of your skin,
  the breath moving between them. Let this become a meditation on balance: where in your life do opposing forces need an ''equalizer''?
  What role might you play as that temperate middle ground?'
