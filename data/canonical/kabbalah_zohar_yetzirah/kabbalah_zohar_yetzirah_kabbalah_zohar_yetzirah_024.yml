translation: The Ancient One is hidden and concealed; the Microprosopus is manifested, and is not manifested.
abhyasa: 'Sit quietly and hold the phrase ''hidden and manifested'' in mind. Notice one thing in your immediate surroundings—a
  sound, a sensation, a thought—and ask: What in this is revealed to me? What remains concealed? Do not resolve the tension;
  let it rest as a living question for ten minutes.'
