translation: These are the ten ineffable existences, the spirit of the living God, Air, Water, Fire, Height and Depth, East
  and West, North and South.
abhyasa: Today, pause at four moments and notice one direction (north, south, east, west, up, or down) and one element present
  in that moment—a shadow to the north, warmth to the east, the ground beneath you, the air you breathe. Let each observation
  be a small recognition that the divine structure is not abstract but present in the sensible world.
