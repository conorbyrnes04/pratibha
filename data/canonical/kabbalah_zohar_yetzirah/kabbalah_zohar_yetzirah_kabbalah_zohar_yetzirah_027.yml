translation: Two apples are beheld, to illuminate the lights.
abhyasa: 'Sit quietly and hold in mind two contrasting states you experience: light and shadow, silence and sound, stillness
  and motion, self and other. Rather than choosing one, observe how each illuminates the other—how you cannot truly know one
  without the presence of its counterpart. Notice what understanding arises from holding both.'
