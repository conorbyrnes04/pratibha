unit_label: Bahia Was Sudanese
title: Bahia Was Sudanese
unit_type: teaching_passage
commentary: 'The historical claim is a map, not a compliment: Bahia’s African majority was Sudanese in
  the old ethnographic sense — Yoruba/Nagô, Jeje/Ewe, Hausa, Tapa, and their neighbors — not exclusively
  Bantu. Brazilian science had already decided the country was Bantu-colonized, and the exclusivism flattened
  the city that would hold Gêge-Nagô terreiros and Malê houses. Rodrigues, racial theorist, writes the
  correction inside a poisoned verb. Colonizaram o Brasil treats captive nations as colonists and keeps
  the scientist’s right to sort stocks. Do not take Sudanese versus Bantu as a ranking of intelligence
  or religion. Cap. VIII’s ladder is out of the classroom. The ethnographic remainder is regional: what
  took root in Bahia is not what took root everywhere in Brazil. Nagô speech, Jeje titles, and Malê Arabic
  are Sudanese facts of this city. Bantu life is not therefore empty or "monotheist by default" — a later
  unit will refuse that smear. Johnson’s Yoruba faith is one Sudanese stream written from the inside;
  Ellis’s òwe keep Yoruba as a speaking people, not a Bantu footnote. Existentially, you correct the inherited
  map before you speak of African Brazil as one block. If your picture of the country has only one African
  family, you are still in the exclusivism the sentence names.'
