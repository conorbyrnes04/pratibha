pratibha_layers:
- kind: original
  label: Original
  body: A crença que domina os cientistas pátrios é que foram Bantus os povos negros que colonizaram o
    Brasil. No erro deste exclusivismo incidem etnólogos, historiadores e literatos. Os primeiros [sudaneses]
    predominaram na Bahia.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: sudaneses
    (West African / Sudanic nations in the old sense); Bantus; Bahia.'
- kind: translation
  label: Pratibha Translation
  body: The belief that dominates the country’s scientists is that the Black peoples who settled Brazil
    were Bantu. Ethnologists, historians, and men of letters fall into the error of that exclusivism.
    The first group — the Sudanese — predominated in Bahia.
- kind: commentary
  label: Pratibha Commentary
