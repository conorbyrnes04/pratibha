- kind: key_terms
  label: Key Terms
  items:
  - term: sudaneses
    definition: nineteenth-century label for West African / Sudanic nations (Nagô, Jeje, Hausa, Tapa)
      -> Bahia’s predominant African presence -> not a racial grade above Bantu, and not a synonym for
      all of Brazil
  - term: Bantus
    definition: Central and Southern African nations present in Brazil -> the exclusivist default of Brazilian
      science in Rodrigues’s day -> denying their monopoly in Bahia is not a denial of Bantu religion
      elsewhere
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Only One God in the Universe
    resonance: Both locate Bahia’s public African religion in a Yoruba/Nagô-weighted field rather than
      a generic Black Brazil.
    divergence: Animismo reports the terreiro’s court; this unit reports the demographic error that hid
      that court from scientists.
  - citation: Ellis, Yoruba òwe — Another's eye is not like one's own
    resonance: 'Both refuse a single vantage: what one observer sees as the whole people is another people’s
      blind spot.'
    divergence: The òwe is a proverb about persons; this sentence is a correction of a national scientific
      myth.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name the African nation you silently assume when someone says Bahia or Brazil. Write a
    second nation that the assumption erased. If you cannot, the exclusivism is still yours.
