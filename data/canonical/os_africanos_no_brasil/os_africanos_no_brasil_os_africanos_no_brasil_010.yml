unit_label: Herbs Belong to the Orisa
title: Herbs Belong to the Orisa
unit_type: teaching_passage
commentary: 'The liturgical claim is botanical and possessive: a leaf that is not used is not thereby
  free, and all herbs belong to the orisa. Nagô speech in Bahia keeps a proverb that will not let the
  forest be raw material. Medicine, food, and rite share a owner. Rodrigues files the line under folklore
  and origins, the physician’s habit of hearing a charm where a theology of use is speaking. Poison: herbs
  become evidence of primitive mentality, a step on the ladder toward "real" pharmacy. Do not complete
  a leaf-list from this page. Do not turn the òwe into a recipe. The ethnographic remainder is the proverb’s
  two clauses. Unused is still claimed. Used is already someone’s. Animismo’s Osun lives in the fountain
  and the iroko can be the god himself; the forest is populated before you pick. Ellis keeps Yoruba proverb
  as public wisdom; this òwe is that wisdom about leaves. Johnson’s middle population between Maker and
  world includes powers who own things you thought were vacant. Existentially, before you pick a plant
  as just a plant, you ask whose it is. If everything unused is yours, you have already stolen the orisa’s
  forest.'
