- kind: key_terms
  label: Key Terms
  items:
  - term: ewé
    definition: Yoruba leaf / herb -> liturgical plant, not wild inventory -> "herb" as folk medicine
      misses that unused leaves are still the orisa’s
  - term: orisa
    definition: the owner in the proverb -> all herbs are t’òrìṣà -> a nature-spirit gloss hides the possessive
      theology
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ellis, Yoruba òwe — If an orisha would kill a man for cooking an…
    resonance: Both treat the orisa as having jurisdiction over ordinary use of what looks like food or
      plant.
    divergence: Ellis’s òwe warns by sanction; this òwe claims the whole herb field before the cooking
      starts.
  - citation: Nina Rodrigues, O Animismo Fetichista — The Iroko Is the God Himself
    resonance: 'Both refuse a vacant forest: a tree or a leaf can already be a power’s body or property.'
    divergence: The iroko unit is one tree as the god; this proverb generalizes possession to all herbs.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, before you pick, buy, or brew one plant as "just a plant," stop and ask whose it would
    be if a people you do not belong to already claimed it. Do not use it as a rite. Write the question.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '10'
  section: Rodrigues, Os Africanos, cap. V
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. V
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
