unit_label: Jeje Has Its Own Name
title: Jeje Has Its Own Name
unit_type: teaching_passage
commentary: 'The claim is a name with a phonetics and a language: Jeje is not a mispronunciation of Nagô.
  They know themselves as Ewe. The nation was strong enough in Bahia to leave a liturgical tongue, not
  only a footnote in someone else’s myth. Later units will say the public cult fused as Gêge-Nagô; fusion
  is not erasure of the Jeje name at the start. Rodrigues writes os negros pronunciam and keeps the mass-noun
  even while recording a nation’s own word. Poison: the physician can hear gêge and still see Negroes.
  Do not complete his sentence by treating Jeje as a lesser Yoruba, a slave-trade leftover, or a vodu
  scare-label. The ethnographic remainder is Ewe as a generic term the Jeje themselves know, and a Bahia
  in which that speech was strong. Johnson writes one Yoruba faith from inside; Ellis’s òwe are Yoruba
  speech. Jeje is the neighbor nation those pages do not get to annex. Lasnet’s Serer life is another
  West African house with its own names for the highest and the dead. Existentially, you refuse the one
  gloss that collapses Jeje into Nagô. If you can only say Yoruba Candomblé, you have already performed
  the exclusivism cap. I warned against.'
