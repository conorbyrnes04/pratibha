- kind: key_terms
  label: Key Terms
  items:
  - term: Gêge / Jeje
    definition: Bahian name for Ewe-speaking people and their cult -> a nation with its own liturgical
      language -> a dialect of Nagô or a synonym for vodu is the gloss this unit breaks
  - term: Ewe
    definition: the generic term the Jeje know for themselves -> the African name behind the Bahian one
      -> leaving it unsaid lets Gêge float as a local curiosity
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Only One God in the Universe
    resonance: Both refuse a single African religion in Bahia, but this unit names the Jeje/Ewe house
      Animismo often hears only as a presence beside Nagô.
    divergence: Animismo’s opening weight is Yoruba; here Jeje is a nation with its own name and tongue.
  - citation: Lasnet, Senegalese Animism — Animism Is Not Fetishism
    resonance: Both refuse a metropolitan label that would turn a people into a type.
    divergence: Lasnet denies fetish as the Serer religion; this unit denies Nagô as the only Bahian African
      nation.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, refuse one gloss that collapses Jeje, Ewe, or "Jeje nation" into Yoruba or Nagô. Say the
    second name out loud. If you have never said it, that is the act.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '8'
  section: Rodrigues, Os Africanos, cap. IV
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. IV
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
