unit_label: Caboclo Candomblé Is Still African
title: Caboclo Candomblé Is Still African
unit_type: teaching_passage
commentary: 'The historical claim is about altars, not blood-quantum: houses called Caboclo or Indigenous
  are, in fact, African candomblés, and Tupi-Guarani fragments can adhere to that dominant practice. Mboi-tatá
  in the Recôncavo is taken for African and is not. A name can migrate onto the wrong shore. Rodrigues
  writes feitiçaria africana dominante — dominant African witchcraft — the poison that makes the whole
  field a spell-house and the Indigenous remainder a residue. Do not teach Caboclo as fake Indian play.
  Do not teach it as proof that Candomblé "became" Indigenous. Do not invent a later ethnographer to settle
  the houses. The ethnographic remainder is the double caution. The altar may be African under a Caboclo
  poster. A snake-fire of the Recôncavo may be Tupi under an African rumor. Animismo’s figures are neither
  fetish nor idol; a Caboclo name is neither a passport nor a fraud until you ask which peji is lit. Lasnet
  binds ancestor and land as one cult; a transplanted African cult can carry a local ghost without changing
  its jurisdiction. Existentially, before you call a rite Indigenous or African, you ask which altar it
  actually serves. The poster is not the offering.'
