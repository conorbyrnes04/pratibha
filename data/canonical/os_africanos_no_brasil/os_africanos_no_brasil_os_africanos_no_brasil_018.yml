pratibha_layers:
- kind: original
  label: Original
  body: Se os nossos supostos candomblés de Caboclos ou Indígenas são, de fato, candomblés africanos,
    em todo o caso ainda hoje aderem à feitiçaria africana dominante na Bahia esparsos fragmentos das
    crenças tupi-guaranis. Encontrei no Recôncavo a crença no Mboi-tatá que a população supõe africana.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: candomblé
    de Caboclos; Tupi-Guarani; Mboi-tatá; Recôncavo.'
- kind: translation
  label: Pratibha Translation
  body: If our supposed Caboclo or Indigenous candomblés are in fact African candomblés, in any case there
    still adhere today to the African practice dominant in Bahia scattered fragments of Tupi-Guarani beliefs.
    I found in the Recôncavo the belief in Mboi-tatá that the population supposes to be African.
- kind: commentary
  label: Pratibha Commentary
  body: 'The historical claim is about altars, not blood-quantum: houses called Caboclo or Indigenous
    are, in fact, African candomblés, and Tupi-Guarani fragments can adhere to that dominant practice.
    Mboi-tatá in the Recôncavo is taken for African and is not. A name can migrate onto the wrong shore.
    Rodrigues writes feitiçaria africana dominante — dominant African witchcraft — the poison that makes
    the whole field a spell-house and the Indigenous remainder a residue. Do not teach Caboclo as fake
    Indian play. Do not teach it as proof that Candomblé "became" Indigenous. Do not invent a later ethnographer
    to settle the houses. The ethnographic remainder is the double caution. The altar may be African under
    a Caboclo poster. A snake-fire of the Recôncavo may be Tupi under an African rumor. Animismo’s figures
    are neither fetish nor idol; a Caboclo name is neither a passport nor a fraud until you ask which
    peji is lit. Lasnet binds ancestor and land as one cult; a transplanted African cult can carry a local
    ghost without changing its jurisdiction. Existentially, before you call a rite Indigenous or African,
    you ask which altar it actually serves. The poster is not the offering.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Caboclo
    definition: house or power named as Indigenous / mixed-forest in Bahian speech -> often an African
      candomblé under another poster -> taking the poster as the origin, or as a fraud, skips the altar
  - term: Mboi-tatá
    definition: Tupi-Guarani fire-serpent of the Recôncavo -> supposed African by the population -> a
      fragment that adhered, not a proof that the candomblé is Indigenous
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — The Figures Are Neither Fetish nor Idol
    resonance: Both refuse a surface name — fetish, Caboclo, idol — as the essence of what the house is
      doing.
    divergence: Animismo defends orisha figures; this unit defends an African jurisdiction under an Indigenous
      poster, and a Tupi name under an African rumor.
  - citation: Lasnet, Senegalese Animism — The Ancestor and the Land Are One Cult
    resonance: Both know that land-spirits and incoming cults can share a landscape without becoming one
      origin.
    divergence: Serer ancestor and land are one cult in place; Bahia’s African house can carry a Tupi
      fragment without changing its peji.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, before you label one rite Indigenous, African, or mixed, ask which altar is actually being
    served. Write the altar if you know it. If you do not, refuse the label for the day.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '18'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
