- kind: key_terms
  label: Key Terms
  items:
  - term: Kosi obá kan afi Olorun
    definition: There is not one king except God / there is only one king, who is God -> Nagô public theology
      -> a Muslim-looking line that Animismo already said a terreiro person can write
  - term: pêgi
    definition: peji, the orisha’s shrine-house -> temple, not a fetish cabinet -> Rodrigues’s fetichistas
      is the poison glued to a real word
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — There Is No King Like God
    resonance: Both read the same Bahian Nagô inscription as theology on the street, not as a hidden Muslim
      verse.
    divergence: Animismo gives the butcher-shop scene in French; this Portuguese line stresses shops and
      pejis together.
  - citation: Samuel Johnson, The Yoruba Faith — Olorun, the Lord of Heaven
    resonance: Both name Olorun as the one who outranks every earthly oba.
    divergence: Johnson writes from inside Yoruba faith; this unit is the sentence painted in a Catholic-majority
      city.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, write one sentence that names a king — office, brand, party, or self — you will not put
    above the highest you actually name. Put the sentence where you work, not where you pray.
