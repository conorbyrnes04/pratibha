pratibha_layers:
- kind: original
  label: Original
  body: 'Tem havido nesta cidade inscrições em língua nagô em casas de comércio de negros, como em templos
    ou pêgis fetichistas. Nela se lê corretamente a sentença: Kosi obá kan afi Olorun, isto é: Só há um
    rei que é Deus, ou literalmente: Não há rei um senão Deus.'
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Kosi
    obá kan afi Olorun; obá (king); Olorun; pêgi (peji / shrine).'
- kind: translation
  label: Pratibha Translation
  body: 'There have been, in this city, inscriptions in the Nagô language on Black commercial houses as
    on temples or pejis. On one is correctly read the sentence: Kosi obá kan afi Olorun — that is: There
    is only one king, who is God, or literally: There is not one king except God.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The theological claim is public and grammatical: there is no king except God. Nagô writes it
    on shops and on pejis. The street can read a metaphysics above a counter. Kosi obá kan afi Olorun
    is not a proverb hidden in a book; it is a lintel. Rodrigues cannot report the sentence without pêgis
    fetichistas — fetish shrines — the poison word that turns a temple into a specimen. Do not take fetish
    as the doctrine of the inscription. The ethnographic remainder is the same theology Animismo already
