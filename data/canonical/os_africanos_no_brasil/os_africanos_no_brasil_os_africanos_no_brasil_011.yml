unit_label: There Is No King Except God
title: There Is No King Except God
unit_type: teaching_passage
commentary: 'The theological claim is public and grammatical: there is no king except God. Nagô writes
  it on shops and on pejis. The street can read a metaphysics above a counter. Kosi obá kan afi Olorun
  is not a proverb hidden in a book; it is a lintel. Rodrigues cannot report the sentence without pêgis
  fetichistas — fetish shrines — the poison word that turns a temple into a specimen. Do not take fetish
  as the doctrine of the inscription. The ethnographic remainder is the same theology Animismo already
  painted on Baixa dos Sapateiros: one king, Olorun, and a city that lets that sentence stand in Yoruba
  on a commercial house. Johnson reserves the name and states the Lord of Heaven; Bahia paints the political
  consequence. Ellis’s òwe keep wisdom in speech; this wisdom is speech nailed up. Existentially, you
  write one sentence that names a king you will not put above God — office, party, market, or self — and
  you notice whether you would dare hang it where customers walk. A theology that cannot leave the study
  is still private.'
