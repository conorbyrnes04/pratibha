unit_label: The Seventh-Day Mass Calls the Dead
title: The Seventh-Day Mass Calls the Dead
unit_type: teaching_passage
commentary: 'The liturgical claim is a sequence, not a muddle: seventh- or thirtieth-day Mass for a daughter
  of the saint, then the funeral candomblé that calls the dead to hear their last decisions. Catholic
  time-keeping, then the house’s own hearing of the dead. Two rooms, one death. Rodrigues writes misto
  as contamination — incomplete conversion, a leftover Africa stuck to a Mass. Poison. A mix is not a
  failure to choose. The ethnographic remainder is the order. Mass first. Then the dead are invoked. Last
  deliberations: the person is still a speaker in the house, not only a soul the priest has commended.
  Animismo’s children of the saints are a living population; this unit is what the house does when one
  of them dies. Lasnet’s dead are spoken to at the ear; Bahia speaks after a Mass the city will recognize.
  Johnson’s portals of Heaven keep an account; this funeral wants the dead’s own last word before the
  account closes. Existentially, you notice one funeral that uses two houses and refuse to call the second
  a leftover. If you only attend the Mass, you have heard the city’s rite and missed the house’s hearing.'
