pratibha_layers:
- kind: original
  label: Original
  body: A missa do sétimo ou do trigésimo dia do falecimento de uma filha de santo constitui um misto
    de práticas africanas e católicas. À missa católica segue-se o candomblé funerário em que se invoca
    o morto para conhecer as suas deliberações últimas.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: missa
    do sétimo / trigésimo dia; filha de santo; candomblé funerário; deliberações últimas.'
- kind: translation
  label: Pratibha Translation
  body: The Mass of the seventh or the thirtieth day after the death of a filha de santo constitutes a
    mix of African and Catholic practices. The Catholic Mass is followed by the funeral candomblé in which
    the dead person is invoked in order to know their last deliberations.
- kind: commentary
  label: Pratibha Commentary
  body: 'The liturgical claim is a sequence, not a muddle: seventh- or thirtieth-day Mass for a daughter
    of the saint, then the funeral candomblé that calls the dead to hear their last decisions. Catholic
    time-keeping, then the house’s own hearing of the dead. Two rooms, one death. Rodrigues writes misto
    as contamination — incomplete conversion, a leftover Africa stuck to a Mass. Poison. A mix is not
    a failure to choose. The ethnographic remainder is the order. Mass first. Then the dead are invoked.
    Last deliberations: the person is still a speaker in the house, not only a soul the priest has commended.
    Animismo’s children of the saints are a living population; this unit is what the house does when one
    of them dies. Lasnet’s dead are spoken to at the ear; Bahia speaks after a Mass the city will recognize.
    Johnson’s portals of Heaven keep an account; this funeral wants the dead’s own last word before the
    account closes. Existentially, you notice one funeral that uses two houses and refuse to call the
