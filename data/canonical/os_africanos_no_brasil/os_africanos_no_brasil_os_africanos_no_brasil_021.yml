- kind: key_terms
  label: Key Terms
  items:
  - term: candomblé funerário
    definition: funeral candomblé after the Mass -> the dead are invoked for last deliberations -> "pagan
      residue after church" misses a second complete rite
  - term: deliberações últimas
    definition: last deliberations of the dead -> the person still decides -> a soul that only rests has
      already been silenced by the Mass alone
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Children of the Saints
    resonance: Both treat the filha de santo as a member of a house whose kinship outlasts a private death.
    divergence: Animismo describes the living population; this unit is the house calling that member after
      the seventh-day Mass.
  - citation: Lasnet, Senegalese Animism — Speak to the Dead at the Ear
    resonance: Both keep the newly dead as addressees, not only as bodies to be buried.
    divergence: Serer speech is at the ear of the corpse; Bahia’s hearing follows a Catholic Mass the
      street will accept.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, notice one funeral, memorial, or anniversary that uses two houses — church and something
    else. Write the sequence. Do not call the second rite a leftover or a confusion.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '21'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
