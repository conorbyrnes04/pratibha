pratibha_layers:
- kind: original
  label: Original
  body: Como culto organizado, ele persistirá ainda por largo prazo, mesmo após a extinção dos velhos
    africanos sobreviventes à escravidão. Grande número de terreiros na capital como principalmente no
    interior do Estado já são dirigidos atualmente por negros crioulos e mestiços, instruídos nessas práticas
    litúrgicas.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: culto
    organizado; crioulos; terreiros; práticas litúrgicas.'
- kind: translation
  label: Pratibha Translation
  body: As an organized cult it will persist for a long time yet, even after the extinction of the old
    Africans who survived slavery. A great number of terreiros in the capital, and especially in the interior
    of the state, are already directed today by Creole Black Brazilians and mixed-race people, instructed
    in these liturgical practices.
- kind: commentary
  label: Pratibha Commentary
  body: 'The historical claim is succession, not dying: the organized cult will persist after the first-generation
    Africans are gone, because Creole hands already hold the terreiros, in the capital and in the interior,
    instructed in the liturgy. A tradition that can be taught is a tradition that can outlive the ship.
    Rodrigues writes extinção and mestiços as a racial clock — the old Africans die, mixture dilutes,
    the cult should fade and somehow does not. Poison. Creole direction is not a dilution of a pure African
    essence. It is the house working. Instruction is the mechanism. Animismo already saw Creoles adhere
    to Yoruba religion in Bahia; this unit names them as directors. Johnson’s many towns keep a faith
    without needing every priest to have been born in the first city. Ìfẹ̀’s truth lives in mouths handed
    down from sire to son; Bahia’s truth lives in liturgical instruction across a generation the plantation
    named crioulo. Existentially, you stop treating a tradition as dead because the first-generation speakers
    are gone. If you can be taught the practice, the house is not a museum of survivors. It is a school.'
- kind: key_terms
  label: Key Terms
  items:
  - term: crioulos
    definition: Creole Black Brazilians, Brazilian-born -> already directing terreiros -> "less authentic
      than African-born" is the racial clock this unit breaks
  - term: extinção
    definition: extinction of the old Africans -> Rodrigues’s demographic threat -> the remainder is liturgical
      instruction, not a dying race
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Only One God in the Universe
    resonance: Both already know Creole and mixed-race Bahians adhere to the Nagô house; this unit adds
      that they direct it.
    divergence: Animismo reports adhesion; this sentence reports succession after the African-born generation.
  - citation: Myths of Ìfẹ̀ — Where Truth Has Its Home
    resonance: Both locate the cult’s future in instruction — mouths handed down — not in a first body’s
      survival.
    divergence: Ìfẹ̀’s handing-down is priestly lineage at the shrine; Bahia’s is liturgical teaching
      of Brazilian-born directors.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one practice you keep that was taught by someone not born in the practice’s first
    country or first generation. Write the teacher’s instruction, not their blood. Do not call the line
    diluted.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '23'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
