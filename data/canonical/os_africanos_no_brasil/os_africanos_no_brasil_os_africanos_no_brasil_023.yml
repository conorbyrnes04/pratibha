unit_label: Crioulo Hands Already Hold the Terreiros
title: Crioulo Hands Already Hold the Terreiros
unit_type: teaching_passage
commentary: 'The historical claim is succession, not dying: the organized cult will persist after the
  first-generation Africans are gone, because Creole hands already hold the terreiros, in the capital
  and in the interior, instructed in the liturgy. A tradition that can be taught is a tradition that can
  outlive the ship. Rodrigues writes extinção and mestiços as a racial clock — the old Africans die, mixture
  dilutes, the cult should fade and somehow does not. Poison. Creole direction is not a dilution of a
  pure African essence. It is the house working. Instruction is the mechanism. Animismo already saw Creoles
  adhere to Yoruba religion in Bahia; this unit names them as directors. Johnson’s many towns keep a faith
  without needing every priest to have been born in the first city. Ìfẹ̀’s truth lives in mouths handed
  down from sire to son; Bahia’s truth lives in liturgical instruction across a generation the plantation
  named crioulo. Existentially, you stop treating a tradition as dead because the first-generation speakers
  are gone. If you can be taught the practice, the house is not a museum of survivors. It is a school.'
