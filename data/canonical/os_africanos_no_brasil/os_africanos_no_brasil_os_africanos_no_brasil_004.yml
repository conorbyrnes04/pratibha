- kind: key_terms
  label: Key Terms
  items:
  - term: Malê
    definition: Bahian name for African Muslims (often Nagô, Hausa, Tapa) -> Islam with Arabic literacy
      in captivity -> default "slave revolt" or "sect" hides the school and the imported Qur’an
  - term: Alcorão
    definition: the Qur’an, imported and taught in Arabic -> the book of the house, not a fetish paper
      -> police files that call prayers "papers" adopt the raid as the description
  - term: seita
    definition: Rodrigues’s "sect" for organized Islam -> racial-theory and police vocabulary -> the remainder
      is a community with teachers, conversion, and a book
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — The Name Reserved for God Alone
    resonance: 'Both protect a highest address that is not handled as a local figurine: reserved name
      there, imported Book here.'
    divergence: Johnson legislates Yoruba naming; Malê Bahia organizes Arabic reading under captivity.
  - citation: Lasnet, Senegalese Animism — The Invisible Master Is Named as the Sky
    resonance: Both keep the highest from being reduced to an object you can seize in a raid.
    divergence: Serer Rog shares the sky’s name without a mosque; Malê Bahia imports a Qur’an and teaches
      its letters.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one book you assumed could not have been taught under captivity or poverty. Write
    who would have had to carry it, and who would have had to teach the letters. Do not call that house
    a sect.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '4'
  section: Rodrigues, Os Africanos, cap. II
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. II
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
  english_source: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *Os Africanos
