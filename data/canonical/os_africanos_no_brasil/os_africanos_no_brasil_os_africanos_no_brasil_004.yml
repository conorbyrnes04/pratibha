unit_label: Islam Organized in Captivity
title: Islam Organized in Captivity
unit_type: teaching_passage
commentary: 'The claim is institutional, not folkloric: Islam organized in captivity. Teachers preached
  conversion, taught Arabic literacy, and imported Qur’ans from Africa. Malê life in Bahia is a school
  and a mosque, not a rumor of "Mohammedan Negroes." Rodrigues writes seita poderosa — a powerful sect
  — the physician’s word for a religion he will later feed into police panic and, in chapters we refuse
  as doctrine, into criminal anthropology. That is the poison. A sect is what you call a church you intend
  to rank. Do not teach 1835 as proof that Islam in Bahia was only revolt. Do not treat Arabic books as
  contraband metaphysics. The ethnographic remainder is the import and the lesson: the book came from
  there; the reading was taught here; the conversion was preached among people the city had classified
  as cargo. Johnson’s reserved name for God is Yoruba theology; Malê Bahia’s reserved book is Arabic.
  Both are organized address to a highest that is not a terreiro orisa. Lasnet’s Serer highest is named
  as the sky and not bargained with as an object; the Qur’an is a different discipline of the same refusal
  to make God a figurine. Existentially, you stop treating a captive religion as leftover magic. If a
  people can import a book and teach its letters under slavery, the religion is not a fragment. It is
  a house.'
