unit_label: The Cult That Resisted the Whip
title: The Cult That Resisted the Whip
unit_type: teaching_passage
commentary: 'The historical claim is a resistance with a list of enemies: whip, slaveholder, white Catholicism,
  clergy, press, police. The Gêge-Nagô cult was not absorbed. The clergy stopped trying. The house is
  destined to outlast the next two violences as well. This is not a compliment Rodrigues enjoys. He writes
  infiéis and a destiny of resistance as a problem for the nation — a cult that will not die on schedule.
  Poison. Do not take his forecast as a wish for police victory, and do not take it as a romance of invincibility.
  The ethnographic remainder is the sequence of failed erasures. Conversion at the whip failed. Absorption
  into white Catholicism failed. Clergy capitulated. Press and police are named as the current instruments.
  Animismo’s terreiro is a jurisdiction; this unit is why that jurisdiction still has a door. Lasnet’s
  people do not leave ancestral land voluntarily; these people were taken and still did not become the
  master’s church. Existentially, you name one pressure that tried to absorb a practice you keep — office,
  family, feed, force — and you keep the practice today. Resistance here is not a mood. It is a cult that
  remained unabsorbed.'
