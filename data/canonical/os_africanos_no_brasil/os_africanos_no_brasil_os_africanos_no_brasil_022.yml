unit_label: Gesso Sirens at Gantois
title: Gesso Sirens at Gantois
unit_type: teaching_passage
commentary: 'The liturgical claim is that the orisha can sit in a cheap vessel: at Gantois in 1899, Yemanjá
  and Ochun were plaster sirens from Rio, silvered and gilded. The power is not the plaster. The house
  can fix a water orisha in a shop-window mermaid and still be Gantois. Rodrigues writes ídolos and gesso
  barato as proof of degeneration — fetish, poverty, a religion sliding into carnival kitsch. Poison.
  Animismo already said the figures are neither fetish nor idol, and that the saint can be fixed in any
  object. A Rio siren is that doctrine in a crate. Unit 15 said Yemanjá mingles with the mermaid; here
  the mermaid is on the altar, color-coded. Johnson’s mortal shrine is destroyed at death; this shrine
  can be replaced by the next shipment without the orisha dying. Existentially, you refuse to mock the
  cheap vessel as if the power were the plaster. If your respect requires expensive material, you have
  joined the physician’s aesthetic ladder. The silver and the gold are signs. The gesso is not the goddess.'
