pratibha_layers:
- kind: original
  label: Original
  body: No candomblé dos Gantois dos fins do ano de 1899, tive ocasião de ver como ídolos de Yemanjá e
    Ochun duas sereias de gesso barato, mandadas vir do Rio de Janeiro, uma prateada, Yemanjá, a outra
    dourada, Ochun.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Gantois
    (1899); sereias de gesso; Yemanjá (prateada); Ochun (dourada).'
- kind: translation
  label: Pratibha Translation
  body: At the Gantois candomblé at the end of 1899, I had occasion to see, as images of Yemanjá and Ochun,
    two cheap plaster sirens ordered from Rio de Janeiro, one silvered, Yemanjá, the other gilded, Ochun.
- kind: commentary
  label: Pratibha Commentary
  body: 'The liturgical claim is that the orisha can sit in a cheap vessel: at Gantois in 1899, Yemanjá
    and Ochun were plaster sirens from Rio, silvered and gilded. The power is not the plaster. The house
    can fix a water orisha in a shop-window mermaid and still be Gantois. Rodrigues writes ídolos and
    gesso barato as proof of degeneration — fetish, poverty, a religion sliding into carnival kitsch.
    Poison. Animismo already said the figures are neither fetish nor idol, and that the saint can be fixed
    in any object. A Rio siren is that doctrine in a crate. Unit 15 said Yemanjá mingles with the mermaid;
    here the mermaid is on the altar, color-coded. Johnson’s mortal shrine is destroyed at death; this
    shrine can be replaced by the next shipment without the orisha dying. Existentially, you refuse to
    mock the cheap vessel as if the power were the plaster. If your respect requires expensive material,
    you have joined the physician’s aesthetic ladder. The silver and the gold are signs. The gesso is
    not the goddess.'
- kind: key_terms
  label: Key Terms
  items:
  - term: gesso barato
    definition: cheap plaster -> the vessel, not the orisha -> Rodrigues’s sneer treats poverty of material
      as poverty of cult
  - term: sereias
    definition: sirens from Rio as Yemanjá and Ochun -> a fixed form the saint can occupy -> "idol" or
      "kitsch" misses Animismo’s rule that the saint may sit in any object
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — The Saint Can Be Fixed in Any Object
    resonance: Both allow the orisha to occupy a vessel that was not carved as an "African idol."
    divergence: Animismo states the rule; Gantois 1899 is the rule in two plaster sirens from Rio.
  - citation: Nina Rodrigues, O Animismo Fetichista — The Figures Are Neither Fetish nor Idol
    resonance: Both refuse fetish/idol as the name of what stands in the peji.
    divergence: Animismo argues the philosophy; this unit shows the physician still saying ídolos when
      he sees plaster.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, notice one cheap object that stands in for a power, a person, or a vow you actually keep.
    Do not upgrade it. Write whether your respect has been waiting for a costlier vessel.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '22'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
