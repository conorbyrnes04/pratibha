pratibha_layers:
- kind: original
  label: Original
  body: Como é que a polícia, estando todos os dias a suprimir templos, destruir ídolos e altares, a prender
    os diretores de candomblé, não chegou até hoje a promover a punição legal de um só desses crimes?
    Concedamos que haja devassidões nos candomblés. Esses atos nem constituem todo o culto, nem mesmo
    a essência do culto gêge-nagô.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: polícia;
    suprimir templos; diretores de candomblé; essência do culto gêge-nagô.'
- kind: translation
  label: Pratibha Translation
  body: How is it that the police, being every day engaged in suppressing temples, destroying images and
    altars, arresting the directors of candomblé, have not to this day managed to bring legal punishment
    for a single one of these "crimes"? Let us grant that there are disorders in the candomblés. Those
    acts constitute neither the whole cult nor even the essence of the Gêge-Nagô cult.
- kind: commentary
  label: Pratibha Commentary
  body: 'The civic claim is a contradiction the police live in: they destroy temples and altars, arrest
    directors, and never secure a legal punishment for the "crimes" they invent. And even if disorders
    happen, those acts are not the cult and not its essence. The house is not the raid. Rodrigues, physician
    and criminal anthropologist, can see the empty docket and still say crimes and devassidões — debaucheries
    — sexual and racial panic sitting on the sentence. Poison. We do not teach Cap. IX. We do not teach
    "crime" as a face of the cult. Keep his question and refuse his dump. The ethnographic remainder is
    the essence-clause. Gêge-Nagô cult has an essence that is not the police inventory and not the scandal
    the newspaper wants. Animismo’s peji is the house of the orisa; a destroyed altar is a destroyed house,
    not a cleaned crime scene. Lasnet’s woods are sanctuaries; Bahia’s sanctuaries are raided without
    a charge. Existentially, when you hear raid, you ask what altar was broken and what charge was filed.
    If the charge is missing, the violence was the event. Do not complete the missing charge with your
    own suspicion.'
- kind: key_terms
  label: Key Terms
  items:
  - term: essência do culto
    definition: essence of the Gêge-Nagô cult -> not the disorders, not the police file -> "candomblé
      means crime" is the smear this sentence already refuses
  - term: devassidões
    definition: disorders / debaucheries Rodrigues will "grant" -> sexual-racial panic -> even he says
      they are not the cult; do not make them the lesson
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — The Peji Is the House of the Orisa
    resonance: Both treat the altar-house as the cult’s location; destroying it is an attack on a house,
      not a cleanup.
    divergence: Animismo describes the peji standing; this unit describes the peji being destroyed without
      a legal crime.
  - citation: Lasnet, Senegalese Animism — The Woods Are Sanctuaries
    resonance: Both know a sacred place the surrounding power does not get to redefine as vacant land.
    divergence: Serer woods remain sanctuaries in place; Bahian temples are suppressed daily and still
      are not convicted.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you hear raid, raid, or "they finally shut that place down," ask what altar or room
    was broken and what charge was filed. If you cannot name the charge, do not supply a crime.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '25'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
