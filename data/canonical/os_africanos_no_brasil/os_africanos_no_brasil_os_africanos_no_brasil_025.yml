unit_label: Police Destroy Altars Without Charge
title: Police Destroy Altars Without Charge
unit_type: teaching_passage
commentary: 'The civic claim is a contradiction the police live in: they destroy temples and altars, arrest
  directors, and never secure a legal punishment for the "crimes" they invent. And even if disorders happen,
  those acts are not the cult and not its essence. The house is not the raid. Rodrigues, physician and
  criminal anthropologist, can see the empty docket and still say crimes and devassidões — debaucheries
  — sexual and racial panic sitting on the sentence. Poison. We do not teach Cap. IX. We do not teach
  "crime" as a face of the cult. Keep his question and refuse his dump. The ethnographic remainder is
  the essence-clause. Gêge-Nagô cult has an essence that is not the police inventory and not the scandal
  the newspaper wants. Animismo’s peji is the house of the orisa; a destroyed altar is a destroyed house,
  not a cleaned crime scene. Lasnet’s woods are sanctuaries; Bahia’s sanctuaries are raided without a
  charge. Existentially, when you hear raid, you ask what altar was broken and what charge was filed.
  If the charge is missing, the violence was the event. Do not complete the missing charge with your own
  suspicion.'
