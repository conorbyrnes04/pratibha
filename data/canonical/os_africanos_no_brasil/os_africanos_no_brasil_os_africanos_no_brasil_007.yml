unit_label: The Limamo Reads the Qur’an
title: The Limamo Reads the Qur’an
unit_type: teaching_passage
commentary: 'The claim is a bilingual household of Islam: the imam is Nagô Luis; the mosque is his house
  on Rua Alegria; the Arabic Qur’an is his; the Portuguese version is his wife’s. Two literacies, one
  book, one address. This is not a deficit. It is how a religion lives when the city’s language is not
  the liturgical language. Rodrigues scores the gap as incapacity — he cannot write Portuguese; she does
  not know Arabic — the racial theorist’s habit of reading a divided competence as a lower type. Poison.
  Illiteracy in the master’s tongue is not ignorance of God. The ethnographic remainder is the pair of
  books on the table and the house that is the igreja. Johnson’s Yoruba faith keeps a reserved name; this
  house keeps a reserved script. Animismo’s terreiro is a jurisdiction with a peji; this mosque is a residence
  with a number. Existentially, you notice two languages in one house serving one book, and you stop treating
  the language you cannot read as the empty one. The highest thing in the room may be the page you are
  not trained to open.'
