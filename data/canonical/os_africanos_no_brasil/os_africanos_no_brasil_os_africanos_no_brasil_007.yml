pratibha_layers:
- kind: original
  label: Original
  body: O atual Limamo é o nagô Luis, e a sede da igreja maometana, a sua residência no Barris, à rua
    Alegria n.º 3. Como ela não conhece o árabe e o Limamo não sabe ler nem escrever o português, existem
    na casa um Alcorão em árabe para o Limamo e uma versão portuguesa para sua mulher.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Limamo
    (imam); Barris / rua Alegria n.º 3; Alcorão em árabe; versão portuguesa.'
- kind: translation
  label: Pratibha Translation
  body: The present Limamo is the Nagô Luis, and the seat of the Muslim church is his residence in the
    Barris, at Rua Alegria no. 3. Because she does not know Arabic and the Limamo cannot read or write
    Portuguese, the house holds a Qur’an in Arabic for the Limamo and a Portuguese version for his wife.
