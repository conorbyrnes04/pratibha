- kind: key_terms
  label: Key Terms
  items:
  - term: Limamo
    definition: imam, here the Nagô Luis -> liturgical head of a house-mosque -> "sect chief" is the inquiry’s
      word
  - term: versão portuguesa
    definition: Portuguese Qur’an for the wife -> a second literacy inside the same Islam -> treating
      only Arabic as "real" or only Portuguese as "civilized" repeats Rodrigues’s scoring
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Terreiro Means Place and Jurisdiction
    resonance: Both locate a religion in a house with an address, not in an abstract Africa.
    divergence: The terreiro’s jurisdiction is orisha; Rua Alegria 3 is a mosque whose liturgy is Arabic.
  - citation: Samuel Johnson, The Yoruba Faith — The Name Reserved for God Alone
    resonance: Both keep a highest speech that is not the street’s ordinary tongue.
    divergence: Johnson reserves a spoken name; the Limamo reserves a script his wife approaches in Portuguese.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, sit with one book or prayer whose script you cannot read. Do not fetch a translation first.
    Write whose literacy the house is built around, and whose literacy it also made room for.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '7'
  section: Rodrigues, Os Africanos, cap. II
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. II
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
