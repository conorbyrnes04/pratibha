pratibha_layers:
- kind: original
  label: Original
  body: Coisa bem diversa é o que afirmo quando me refiro à persistência do fetichismo negro. Para confundir
    coisas tão distintas era necessário tomar, pela situação fetichista do momento, uma ou algumas das
    formas cultuais em que se concretiza essa atitude mental. Os negros Bantus que, na África, não praticam
    nem conhecem essa religião, devem ser tidos naturalmente por monoteístas? Desprezando este modo superficialíssimo
    de ver as coisas...
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: fetichismo
    negro (period term, refused as doctrine); formas cultuais; Bantus; atitude mental.'
- kind: translation
  label: Pratibha Translation
  body: What I affirm when I refer to the persistence of Black "fetishism" is a quite different thing.
    To confuse things so distinct one would have to take, for the fetishist situation of the moment, one
    or another of the cult-forms in which that mental attitude is concretized. The Bantu Africans who,
    in Africa, neither practice nor know this religion — are they to be taken naturally as monotheists?
    Discarding this most superficial way of seeing things...
- kind: commentary
  label: Pratibha Commentary
  body: 'The philosophical claim, cleaned, is a refusal of one-form thinking: a Gêge-Nagô terreiro is
    not the whole of African religion, and Bantu life is not monotheism by default because it is not this
    terreiro. One cult-form is not a mental attitude of a Race. Rodrigues is trying to save his word fetichismo
    by making it a deep attitude and the terreiro only one surface. Keep the distinction of forms; refuse
    the mental attitude and the ranking. Poison: fetishism as a stage, monotheism as the higher grade,
    Bantu scored against Nagô, Cap. VIII waiting in the next room. We do not teach the ladder. The ethnographic
    remainder is plural African religion. Nagô and Jeje organized a public cult in Bahia. Bantu nations
    have their own houses and are not empty theists waiting for a grade. Malê Islam is another organization.
    Lasnet already said animism is not fetishism. Animismo already said the figures are neither fetish
    nor idol. Existentially, you refuse the ladder that makes one African religion the measure of another.
    If you only respect the house that looks like a terreiro, you have taken one cult-form for the whole
    sky.'
- kind: key_terms
  label: Key Terms
  items:
  - term: fetichismo
    definition: Rodrigues’s period word for a supposed mental attitude -> poison when taught as doctrine
      -> keep only the warning not to take one cult-form for a people’s whole religion
  - term: Bantus
    definition: nations who, he says, do not practice this Gêge-Nagô religion in Africa -> not therefore
      monotheists by default -> ranking them against Nagô is the ladder we refuse
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — Animism Is Not Fetishism
    resonance: Both refuse fetish as the name of a people’s religion, and refuse one metropolitan word
      as the whole field.
    divergence: Lasnet’s denial is cosmological (souls, not fetishes); this unit denies that one Bahian
      cult-form is all African religion, or that Bantu life is leftover monotheism.
  - citation: Nina Rodrigues, O Animismo Fetichista — The Figures Are Neither Fetish nor Idol
    resonance: Both pry the word fetish off a real liturgical object or house.
    divergence: Animismo defends the figure in the peji; this unit defends the plurality of African religions
      against one peji used as a racial type.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, catch fetish, primitive, or "they don’t really have religion" in your mouth about a people
    whose house is not the one you know. Write the house you do not know instead of the grade.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '27'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
