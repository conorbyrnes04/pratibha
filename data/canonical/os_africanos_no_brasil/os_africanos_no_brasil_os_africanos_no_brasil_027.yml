unit_label: Fetish Is Not the Terreiro
title: Fetish Is Not the Terreiro
unit_type: teaching_passage
commentary: 'The philosophical claim, cleaned, is a refusal of one-form thinking: a Gêge-Nagô terreiro
  is not the whole of African religion, and Bantu life is not monotheism by default because it is not
  this terreiro. One cult-form is not a mental attitude of a Race. Rodrigues is trying to save his word
  fetichismo by making it a deep attitude and the terreiro only one surface. Keep the distinction of forms;
  refuse the mental attitude and the ranking. Poison: fetishism as a stage, monotheism as the higher grade,
  Bantu scored against Nagô, Cap. VIII waiting in the next room. We do not teach the ladder. The ethnographic
  remainder is plural African religion. Nagô and Jeje organized a public cult in Bahia. Bantu nations
  have their own houses and are not empty theists waiting for a grade. Malê Islam is another organization.
  Lasnet already said animism is not fetishism. Animismo already said the figures are neither fetish nor
  idol. Existentially, you refuse the ladder that makes one African religion the measure of another. If
  you only respect the house that looks like a terreiro, you have taken one cult-form for the whole sky.'
