pratibha_layers:
- kind: original
  label: Original
  body: Nos Nagôs, não só as funções do raio e do trovão cabem a um orichá poderoso e antropomorfo, Changô,
    como outras funções de Olorun estão sendo distribuídas por divindades múltiplas, reservando-se apenas
    para ele a ideia vaga de uma entidade superior e quase inacessível.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Changô
    / Ṣàngó; orichá; raio e trovão; Olorun.'
- kind: translation
  label: Pratibha Translation
  body: Among the Nagô, not only do the functions of lightning and thunder belong to a powerful and anthropomorphic
    orisha, Changô, but other functions of Olorun are being distributed among multiple divinities, reserving
    for him only the vague idea of a superior and almost inaccessible entity.
- kind: commentary
  label: Pratibha Commentary
  body: 'The liturgical claim is a division of labor: thunder and lightning belong to Changô, a powerful
    orisha with a face, and Olorun keeps the almost inaccessible height. The sky is not empty because
    the storm has a name. Rodrigues writes antropomorfo and funções distribuídas as if a high god were
    being looted by lesser figures — Tylor’s ladder, degeneration, the Race losing its aptitude to generalize.
    Poison. Do not teach Changô as a piece broken off a failing monotheism. Animismo already said Sango
    is the thunder-stone itself and that no terreiro stands without him. Johnson’s middle population is
    the point of a God who is not the storm. Ìfẹ̀ knows thunder cannot stop brothers: the sky’s violence
    is not the last word. The ethnographic remainder is the pair. Olorun remains. Changô takes the bolt.
