- kind: key_terms
  label: Key Terms
  items:
  - term: Changô
    definition: Ṣàngó, orisha of thunder and lightning -> the face the storm has in Nagô Bahia -> "anthropomorphic
      sky-god" as an evolutionary stage is Rodrigues’s ranking
  - term: inacessível
    definition: almost inaccessible -> what is reserved to Olorun when functions are distributed -> a
      deficit only if you think the highest must be the most used
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Sango Is the Thunder-Stone Itself
    resonance: Both give thunder a Nagô name and a body in the terreiro, not a vague sky-mood.
    divergence: Animismo identifies Sango with the stone; this unit states the transfer of function from
      Olorun’s height.
  - citation: Myths of Ìfẹ̀ — Thunder Cannot Stop Brothers
    resonance: Both keep thunder as a real power that does not get the last word over the human bond.
    divergence: Ìfẹ̀’s thunder fails to end kinship; Bahia’s Changô receives the bolt that Olorun will
      not wield as a cult.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you hear thunder or name a storm, say which power you actually address — if any —
    and which highest you do not. Do not invent a rite. Write the two names, or write that you have been
    collapsing them.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '13'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
