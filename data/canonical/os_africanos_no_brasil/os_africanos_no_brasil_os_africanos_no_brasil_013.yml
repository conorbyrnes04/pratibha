unit_label: Changô Takes Thunder from the Sky
title: Changô Takes Thunder from the Sky
unit_type: teaching_passage
commentary: 'The liturgical claim is a division of labor: thunder and lightning belong to Changô, a powerful
  orisha with a face, and Olorun keeps the almost inaccessible height. The sky is not empty because the
  storm has a name. Rodrigues writes antropomorfo and funções distribuídas as if a high god were being
  looted by lesser figures — Tylor’s ladder, degeneration, the Race losing its aptitude to generalize.
  Poison. Do not teach Changô as a piece broken off a failing monotheism. Animismo already said Sango
  is the thunder-stone itself and that no terreiro stands without him. Johnson’s middle population is
  the point of a God who is not the storm. Ìfẹ̀ knows thunder cannot stop brothers: the sky’s violence
  is not the last word. The ethnographic remainder is the pair. Olorun remains. Changô takes the bolt.
  You approach the bolt; you do not barge in on the height. Existentially, you name the power you actually
  cry to when it thunders, and you stop calling the highest empty because it does not throw the spear.
  A God who keeps only inaccessibility is not a vacancy. A saint of thunder is not a theft.'
