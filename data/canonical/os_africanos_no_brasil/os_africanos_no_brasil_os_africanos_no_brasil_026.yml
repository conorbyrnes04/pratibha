pratibha_layers:
- kind: original
  label: Original
  body: Não posso voltar aqui à minuciosa demonstração que dei, no Animisme fetichiste, do modo por que
    na Bahia os Negros fetichistas se convertem ao Catolicismo. As notícias sobre candomblés fornecem
    novas demonstrações do modo por que, no culto africano, os santos católicos se associam aos fetiches
    negros.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Animisme
    fetichiste (cross-reference); santos católicos; culto africano; associação.'
- kind: translation
  label: Pratibha Translation
  body: I cannot return here to the detailed demonstration I gave, in the Animisme fetichiste, of the
    way in which in Bahia African devotees convert to Catholicism. The reports on candomblés supply new
    demonstrations of the way in which, in the African cult, Catholic saints associate with African powers.
- kind: commentary
  label: Pratibha Commentary
  body: 'The historical claim is association, not replacement: in the African cult, Catholic saints sit
    with African powers. Conversion, as Rodrigues described it in the 1900 French book, does not empty
    the peji. New candomblé reports show the same sitting-together. The saint is not the orisha’s death.
    Rodrigues cannot say this without Negros fetichistas and fetiches negros — the poison vocabulary that
    makes association a contamination of true Church by fetish. Refuse fetish as doctrine. Keep the sitting-together.
    Animismo already said orisa is translated as saint, and that Creoles identify an orisa with Christ.
    This later book points back and adds: the news from the houses keeps proving the association. Johnson’s
    one God in many towns does not need Rome; Bahia’s houses use Rome’s names without surrendering the
    court. Existentially, you catch just a saint in your mouth when the house also names an orisha. If
    you only hear the Catholic name, you have attended the overlay and missed the association. Two names
    on one altar are not one name winning.'
- kind: key_terms
  label: Key Terms
  items:
  - term: associam
    definition: saints associate with African powers -> sitting-together in the African cult -> "conversion"
      as replacement, or "syncretism" as confusion, both miss the verb
  - term: fetiches negros
    definition: Rodrigues’s poison for the African powers -> refuse as doctrine -> the remainder is named
      orishas and Jeje powers the saint sits beside
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Orisa Is Translated as Saint
    resonance: Both describe the Catholic name as a translation sitting on an orisha, not as the orisha’s
      deletion.
    divergence: Animismo gives the translation rule; this unit says later candomblé news keeps demonstrating
      the association.
  - citation: Nina Rodrigues, O Animismo Fetichista — Creoles Identify an Orisa with Christ
    resonance: Both refuse to treat a Christian name as proof that the court has been dismissed.
    divergence: Animismo names Christ and Allah as overlay names; this sentence generalizes saints sitting
      with African powers.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, catch just a saint or just folklore in your mouth when a house also keeps another name.
    Write both names if you know them. If you know only one, write that the other is being hidden from
    you — including by you.
provenance:
