unit_label: Catholic Saints Sit with African Powers
title: Catholic Saints Sit with African Powers
unit_type: teaching_passage
commentary: 'The historical claim is association, not replacement: in the African cult, Catholic saints
  sit with African powers. Conversion, as Rodrigues described it in the 1900 French book, does not empty
  the peji. New candomblé reports show the same sitting-together. The saint is not the orisha’s death.
  Rodrigues cannot say this without Negros fetichistas and fetiches negros — the poison vocabulary that
  makes association a contamination of true Church by fetish. Refuse fetish as doctrine. Keep the sitting-together.
  Animismo already said orisa is translated as saint, and that Creoles identify an orisa with Christ.
  This later book points back and adds: the news from the houses keeps proving the association. Johnson’s
  one God in many towns does not need Rome; Bahia’s houses use Rome’s names without surrendering the court.
  Existentially, you catch just a saint in your mouth when the house also names an orisha. If you only
  hear the Catholic name, you have attended the overlay and missed the association. Two names on one altar
  are not one name winning.'
