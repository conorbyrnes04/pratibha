- kind: key_terms
  label: Key Terms
  items:
  - term: Obatalá
    definition: king of the orishas, heaven-God of immediate action -> the deputy of Olorun in the world
      -> collapsing him into Olorun, or into a mere saint, hides the court
  - term: Odudua
    definition: Odùduwà, co-sharer of reproduction and world-direction -> partner, not a later rival footnote
      -> Ìfẹ̀’s Odúwa is the same name under another observer
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Shaped by the Hand of Orisala
    resonance: 'Both keep a shaper-god under the Maker: the world is worked, not only willed.'
    divergence: Johnson’s Orisala shapes the lump Olorun made; Bahia’s Obatalá shares reproduction with
      Odudua.
  - citation: Myths of Ìfẹ̀ — Odúwa Protests the Gift
    resonance: Both give Odùduwà agency in the world’s founding, not a silent female or male extra.
    divergence: Ìfẹ̀’s Odúwa protests a gift on the road; this unit states the share in reproduction as
      a Bahian liturgical fact.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one task you keep assigning to a highest principle, then name the two people or offices
    that actually share that work. Thank the pair. Do not promote them into the highest name.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '14'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
