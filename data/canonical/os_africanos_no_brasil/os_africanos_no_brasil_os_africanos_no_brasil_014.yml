unit_label: Obatalá Shares the World with Odudua
title: Obatalá Shares the World with Odudua
unit_type: teaching_passage
commentary: 'The cosmological claim is a court at work: Obatalá is king of the orishas, the heaven-God
  who still touches human action, and he shares the world’s making with Odudua. Olorun remains high; the
  world is run by a pair. Rodrigues writes inação e repouso as if the highest had retired like a tired
  monarch, a deus otiosus on a racial clock. Poison. Withdrawal is not senility of the Race. It is the
  same exaltation Animismo and Johnson already taught: the Maker does not do the weekly work. Johnson’s
  Orisala shapes the lump; Ìfẹ̀’s Odúwa protests a gift and still founds a world. Bahia keeps both names
  in one sentence. The ethnographic remainder is the share. Reproduction is not a private Obatalá file
  and not a Catholic "creation" pasted onto a fetish. Two powers, one mission, under a God who is not
  on the rota. Existentially, you notice who actually does the work you attribute to the highest name
  — the deputy, the partner, the pair — and you stop calling the deputies a decline. A world that needs
  two hands is not a failed monotheism.'
