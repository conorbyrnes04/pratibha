pratibha_layers:
- kind: original
  label: Original
  body: Obatalá é por excelência o rei dos orichás. É ainda o Céu-Deus, mas o céu-Deus a que estão confiadas
    as interferências imediatas nas ações humanas. Olorun, recolhendo-se à inação e ao repouso, confiava
    a Obatalá a missão de dirigir o mundo. Obatalá veio partilhar com Odudua a função da reprodução.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Obatalá;
    Odudua / Odùduwà; orichás; Olorun.'
- kind: translation
  label: Pratibha Translation
  body: Obatalá is by excellence the king of the orishas. He is still the Heaven-God, but the heaven-God
    to whom immediate interferences in human actions are entrusted. Olorun, withdrawing into inaction
    and rest, entrusted to Obatalá the mission of directing the world. Obatalá came to share with Odudua
    the function of reproduction.
- kind: commentary
  label: Pratibha Commentary
  body: 'The cosmological claim is a court at work: Obatalá is king of the orishas, the heaven-God who
    still touches human action, and he shares the world’s making with Odudua. Olorun remains high; the
    world is run by a pair. Rodrigues writes inação e repouso as if the highest had retired like a tired
