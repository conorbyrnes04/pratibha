pratibha_layers:
- kind: original
  label: Original
  body: Tão íntima é a fusão em que se encontra na Bahia a mitologia ewe com a iorubana que se tornou
    hoje impossível distingui-las. E como depois da iorubana é a mitologia gêge a mais complexa, antes
    se deve dizer que uma mitologia gêge-nagô do que puramente nagô prevalece no Brasil.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: mitologia
    ewe / gêge; mitologia iorubana / nagô; gêge-nagô.'
- kind: translation
  label: Pratibha Translation
  body: So intimate is the fusion in which Ewe mythology stands with Yoruba mythology in Bahia that it
    has become impossible today to distinguish them. And because after the Yoruba it is Jeje mythology
    that is the most complex, one should say that a Gêge-Nagô mythology, rather than a purely Nagô one,
    prevails in Brazil.
- kind: commentary
  label: Pratibha Commentary
  body: 'The historical claim is a hyphen: what prevails in Brazil is Gêge-Nagô, not a pure Nagô export.
    Ewe and Yoruba myth have fused in Bahia past the point of clean sorting. Jeje is not a spice. It is
    the other half of the public cult. Rodrigues cannot praise the fusion without a complexity ranking
    — Jeje second after Yoruba, the ladder still humming. Poison. Complexity is not a racial score. We
    keep the hyphen and refuse the podium. Cap. VIII’s ranking of peoples is not doctrine. The ethnographic
    remainder is the impossibility. If you cannot distinguish the mythologies in the house, stop advertising
    a purely Yoruba Candomblé as the Brazilian fact. Unit 8 gave Jeje its own name and tongue; this unit
    gives the fused cult its honest title. Animismo hears Jeje beside Nagô and still opens on Olorun’s
    court; this book, later, admits the court is already hyphenated. Johnson writes one Yoruba faith;
    he does not get to annex Ewe. Existentially, you refuse Yoruba Candomblé as the only name for a house
    that also speaks Jeje. If your label has no hyphen and the house does, the exclusivism is yours.'
- kind: key_terms
  label: Key Terms
  items:
  - term: gêge-nagô
    definition: hyphenated public mythology of Bahia / Brazil -> fusion past sorting -> "Yoruba Candomblé"
      as a pure brand erases Jeje
  - term: fusão
    definition: intimate fusion of Ewe and Yoruba myth -> a historical fact of the city -> "syncretism"
      as confusion or "complexity" as a racial grade both miss the hyphen
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Only One God in the Universe
    resonance: Both describe Bahia’s public African religion as Yoruba-weighted — and this unit corrects
      the weight with a Jeje hyphen.
    divergence: Animismo’s opening is Nagô court; this sentence says the prevailing mythology is already
      Gêge-Nagô.
  - citation: Samuel Johnson, The Yoruba Faith — One God, Many Towns
    resonance: Both refuse a single tidy people under one cult-name.
    divergence: Johnson’s many towns stay Yoruba; Bahia’s prevailing cult is two nations fused past distinction.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, take one tradition you habitually name with a single people. Add the second name the house
    actually uses, or write that you have never asked. Do not tidy the hyphen away.
