unit_label: Gêge-Nagô Mythology Prevails
title: Gêge-Nagô Mythology Prevails
unit_type: teaching_passage
commentary: 'The historical claim is a hyphen: what prevails in Brazil is Gêge-Nagô, not a pure Nagô export.
  Ewe and Yoruba myth have fused in Bahia past the point of clean sorting. Jeje is not a spice. It is
  the other half of the public cult. Rodrigues cannot praise the fusion without a complexity ranking —
  Jeje second after Yoruba, the ladder still humming. Poison. Complexity is not a racial score. We keep
  the hyphen and refuse the podium. Cap. VIII’s ranking of peoples is not doctrine. The ethnographic remainder
  is the impossibility. If you cannot distinguish the mythologies in the house, stop advertising a purely
  Yoruba Candomblé as the Brazilian fact. Unit 8 gave Jeje its own name and tongue; this unit gives the
  fused cult its honest title. Animismo hears Jeje beside Nagô and still opens on Olorun’s court; this
  book, later, admits the court is already hyphenated. Johnson writes one Yoruba faith; he does not get
  to annex Ewe. Existentially, you refuse Yoruba Candomblé as the only name for a house that also speaks
  Jeje. If your label has no hyphen and the house does, the exclusivism is yours.'
