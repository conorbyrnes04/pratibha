unit_label: Ifá Learns Divination from Elegbá
title: Ifá Learns Divination from Elegbá
unit_type: teaching_passage
commentary: 'The mythic claim is a pedagogy: Ifá does not invent divination from the sky. He fails at
  fishing, asks Elegbá, receives dendê nuts, and pays first-fruits. Then he teaches Orungan, the first
  babalawo. Reading is learned, transmitted, and taxed at the opening. Rodrigues writes feiticeiro for
  the teacher — sorcerer — criminal anthropology leaning on a myth. Poison. Do not complete a figure-list
  or a sacrifice from this page. Do not treat Elegbá’s first-fruits as a recipe. The ethnographic remainder
  is the order. Counsel before nuts. Nuts before reading. First-fruits before the rest of the offerings.
  A first priest. Animismo’s Ifá is the god of divinations by the fall; this unit is how that god himself
  had to be taught. Lasnet’s first-fruits are always offered; Elegbá stipulated the same law. Ìfẹ̀ locates
  truth in priests’ mouths; the babalawo is one such mouth with a palm-nut instrument. Existentially,
  you notice who taught the skill you credit to the official name, and what opening portion that teacher
  still claims. If you skip the opener, you have already stolen the first-fruits.'
