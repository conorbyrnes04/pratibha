pratibha_layers:
- kind: original
  label: Original
  body: Ifá tentou a pesca, mas nada apanhou e descoroçoado foi pedir conselho a Elegbá. Propôs-lhe este
    que trouxesse nozes de dendezeiro com que o feiticeiro lhe ensinaria a adivinhar. Estipulou que lhe
    caberiam as primícias de todas as ofertas. Ifá ensinou a arte de adivinhar a Orungan, que foi assim
    o primeiro babalawo ou sacerdote de Ifá.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Ifá;
    Elegbá / Elegbara; nozes de dendezeiro; babalawo; Orungan; primícias.'
- kind: translation
  label: Pratibha Translation
  body: Ifá tried fishing, caught nothing, and disheartened went to ask Elegbá’s counsel. Elegbá proposed
    he bring dendê-palm nuts with which the teacher would teach him to divine. He stipulated that the
    first-fruits of all offerings would be his. Ifá taught the art of divining to Orungan, who was thus
    the first babalawo, or priest of Ifá.
- kind: commentary
  label: Pratibha Commentary
  body: 'The mythic claim is a pedagogy: Ifá does not invent divination from the sky. He fails at fishing,
    asks Elegbá, receives dendê nuts, and pays first-fruits. Then he teaches Orungan, the first babalawo.
    Reading is learned, transmitted, and taxed at the opening. Rodrigues writes feiticeiro for the teacher
    — sorcerer — criminal anthropology leaning on a myth. Poison. Do not complete a figure-list or a sacrifice
    from this page. Do not treat Elegbá’s first-fruits as a recipe. The ethnographic remainder is the
    order. Counsel before nuts. Nuts before reading. First-fruits before the rest of the offerings. A
    first priest. Animismo’s Ifá is the god of divinations by the fall; this unit is how that god himself
    had to be taught. Lasnet’s first-fruits are always offered; Elegbá stipulated the same law. Ìfẹ̀ locates
    truth in priests’ mouths; the babalawo is one such mouth with a palm-nut instrument. Existentially,
    you notice who taught the skill you credit to the official name, and what opening portion that teacher
    still claims. If you skip the opener, you have already stolen the first-fruits.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Elegbá
    definition: Elegbara / Eṣu as the counsel who teaches Ifá to read -> opener who takes first-fruits
      -> "devil" or "trickster only" hides the pedagogue of the nuts
  - term: babalawo
    definition: priest of Ifá, here first embodied in Orungan -> a trained reader, not a sorcerer -> feiticeiro
      is Rodrigues’s poison for the same office
  - term: primícias
    definition: first-fruits of all offerings -> Elegbá’s stipulated share -> skipping the opener is not
      a minor etiquette lapse; it is the myth’s theft
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Ifa Is the God of Divinations
    resonance: Both keep Ifá as a god of reading whose instrument is the dendê nut.
    divergence: Animismo states the fall as philosophy; this unit states the teaching-story and the first
      babalawo.
  - citation: Lasnet, Senegalese Animism — First-Fruits Are Always Offered
    resonance: Both put an opening portion before the rest of the relationship can proceed.
    divergence: Serer first-fruits bind land and harvest; Elegbá’s first-fruits bind every later offering
      of Ifá.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, before you use one skill you are known for, name the person who taught you the opening
    move and pay that debt in a small first portion — thanks, money, or credit said aloud. Do not invent
    a divination.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '16'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
