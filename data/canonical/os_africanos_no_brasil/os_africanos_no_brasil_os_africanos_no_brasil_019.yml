unit_label: Only Gêge and Nagô Survive
title: Only Gêge and Nagô Survive
unit_type: teaching_passage
commentary: 'The historical claim is narrow if you keep it honest: as organized public cult in Brazil,
  Nagô and Jeje are the survivors Rodrigues can still walk into. Strictly, he says, the only ones. That
  is a statement about visible terreiros, not a death certificate for every African religion in the country.
  Rodrigues means survival as racial fitness — the complex mythologies endured, the others faded — and
  the ladder is already under the sentence. Poison. We do not teach "only Gêge-Nagô" as the worth of African
  life. Malê Islam organized in houses. Bantu languages and fragments remain. Caboclo posters adhere.
  Popular remainder will be a later channel. Extinction-talk is how a physician prepares Cap. VIII. The
  ethnographic remainder is the organized house. A public cult with priesthood, peji, and festival is
  not the same as a proverb, a herb, or a prayer-paper. Johnson’s Yoruba faith is organized in towns;
  Bahia’s Gêge-Nagô is organized in terreiros. Lasnet’s Serer cult is organized on land. None of those
  facts bury the neighbor they cannot see. Existentially, you distinguish the public house you can enter
  from the rest of a people’s life you cannot see. If you call the unseen dead, you have joined the exclusivism.'
