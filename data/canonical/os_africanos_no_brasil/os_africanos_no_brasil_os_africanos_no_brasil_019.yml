- kind: key_terms
  label: Key Terms
  items:
  - term: sobreviventes
    definition: survivors — here, Nagô and Jeje as organized cult -> a fact about public terreiros ->
      "survival of the fittest religion" is Rodrigues’s racial clock
  - term: em rigor
    definition: strictly / in rigor -> the narrowing that makes organized cult the only thing that counts
      -> useful as a scope, fatal as a ranking of peoples
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Terreiro Means Place and Jurisdiction
    resonance: Both treat the standing house — terreiro, peji, priesthood — as what can still be observed
      as a cult.
    divergence: Animismo describes the house; this unit claims, too strictly, that only Gêge-Nagô houses
      still stand.
  - citation: Lasnet, Senegalese Animism — They Live Where They Were Born
    resonance: Both know a cult that remains visible because a people kept a place.
    divergence: Serer remaining is on ancestral land; Gêge-Nagô remaining is a terreiro in a city that
      tried to suppress it.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one tradition you can actually walk into as a public house, and one you only know
    as a rumor or a word. Do not declare the second extinct. Write the limit of what you have seen.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '19'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
