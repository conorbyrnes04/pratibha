unit_label: Ochun Becomes the Naiad of Springs
title: Ochun Becomes the Naiad of Springs
unit_type: teaching_passage
commentary: 'The historical claim is relocation, not loss: without the river Ọ̀ṣun, Ochun becomes the
  divinity of the springs that are here; Yemanjá is goddess of the Dique in this city; her story mingles
  with mãe-d’água and the mermaid. An orisha can move water. Rodrigues writes naiade as a classical downgrade
  and Negros e Mestiços as racial types who confuse myths. Poison. Mixture is not muddle, and a plaster
  later unit will show is not proof of a cheapened goddess. Animismo already said Osun lives in the fountain
  and Yemanja is the divinized sea. Ìfẹ̀ sets Olókun to curb the sea: water has a keeper. The ethnographic
  remainder is the Dique and the missing Nigerian river. Bahia did not forget Ochun; it found her in the
  water it had. Yemanjá meeting the mermaid is Brazilian water theology, a second name for a power already
  at the weir. Existentially, you name the water nearest you and refuse to call it empty. If your river
  is gone, the question is which spring you will not treat as decoration.'
