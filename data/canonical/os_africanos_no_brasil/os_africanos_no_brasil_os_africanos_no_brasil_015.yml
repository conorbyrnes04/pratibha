pratibha_layers:
- kind: original
  label: Original
  body: Na falta do rio Ochun, a orichá Ochun se converte numa espécie de naiade, a divindade das fontes
    e regatos. Yemanjá é nesta cidade a deusa do Dique. Para os Negros e Mestiços brasileiros, o mito
    de Yemanjá se confunde com o da mãe-d’água e o da sereia.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Ochun
    / Ọ̀ṣun; Yemanjá / Yemọja; Dique; mãe-d’água.'
- kind: translation
  label: Pratibha Translation
  body: Lacking the river Ochun, the orisha Ochun becomes a kind of naiad, the divinity of springs and
    streams. Yemanjá is, in this city, the goddess of the Dique. For Black Brazilians and mixed-race Brazilians
    the myth of Yemanjá mingles with that of the mãe-d’água and that of the mermaid.
- kind: commentary
  label: Pratibha Commentary
  body: 'The historical claim is relocation, not loss: without the river Ọ̀ṣun, Ochun becomes the divinity
    of the springs that are here; Yemanjá is goddess of the Dique in this city; her story mingles with
    mãe-d’água and the mermaid. An orisha can move water. Rodrigues writes naiade as a classical downgrade
    and Negros e Mestiços as racial types who confuse myths. Poison. Mixture is not muddle, and a plaster
    later unit will show is not proof of a cheapened goddess. Animismo already said Osun lives in the
    fountain and Yemanja is the divinized sea. Ìfẹ̀ sets Olókun to curb the sea: water has a keeper. The
    ethnographic remainder is the Dique and the missing Nigerian river. Bahia did not forget Ochun; it
    found her in the water it had. Yemanjá meeting the mermaid is Brazilian water theology, a second name
    for a power already at the weir. Existentially, you name the water nearest you and refuse to call
    it empty. If your river is gone, the question is which spring you will not treat as decoration.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Ochun
    definition: Ọ̀ṣun, orisha of a river -> in Bahia, springs and streams when that river is absent ->
      "naiad" as a pretty classical demotion hides a relocated cult
  - term: Yemanjá
    definition: Yemọja, here goddess of the Dique -> mingles with mãe-d’água and the mermaid -> "confusion"
      as racial deficit is Rodrigues’s smear of a living syncretism
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Osun Lives in the Fountain
    resonance: Both relocate Ọ̀ṣun from a West African river to Bahian water that can actually be approached.
    divergence: Animismo stays with the fountain; this unit adds Yemanjá at the Dique and the mermaid
      meeting.
  - citation: Myths of Ìfẹ̀ — Olókun Set to Curb the Sea
    resonance: Both give a named keeper to a body of water that would otherwise be treated as raw nature.
    divergence: Ìfẹ̀’s Olókun curbs the sea at the world’s founding; Bahia’s Yemanjá keeps a weir in a
      colonial city.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name the nearest spring, fountain, weir, or sea wall. Write whether you treat it as empty
    civic water. Do not invent an offering. Notice the vacancy you have been calling normal.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '15'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
