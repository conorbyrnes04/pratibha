unit_label: Mãe de Santo Is Vodu-no
title: Mãe de Santo Is Vodu-no
unit_type: teaching_passage
commentary: 'The linguistic claim is Jeje in the most common Bahian title: mãe de santo is Vodu-no, mother
  of the saint, from the cult of Dãnh-gbi. Father or mother of saint or terreiro is taken from Gêge speech.
  And the house does not call the priestess wife of the saint; it calls her daughter. Kinship is filiation,
  not marriage to the power. Rodrigues cannot write Vodu without the metropolitan scare-label humming
  — vodu as sensation, fetish, African contagion. Poison. Keep the etymology; refuse the carnival. Dãnh-gbi
  is a named Jeje cult, not a headline. Animismo’s father and mother are pontiff together, and children
  of the saints are the house’s population. This unit gives those Portuguese titles their Jeje mouth.
  Johnson’s sacred difference has forms; Bahia’s form is daughter, not wife. Existentially, you say the
  title in the language it came from once today. If you can only say priestess or mama, you have already
  translated the Jeje away. A daughter is not a spouse. A mother of saint is not a generic wise woman.
  The hyphen in Gêge-Nagô lives in the office’s name.'
