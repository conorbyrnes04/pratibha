pratibha_layers:
- kind: original
  label: Original
  body: A denominação, geralmente adotada na Bahia, de “pai ou mãe de santo ou de terreiro”, é tomada
    à língua gêge. “Mãe de santo” é a tradução literal de Vodu-no, nome dado às sacerdotisas gêges do
    culto de Dãnh-gbi (Vodu, orichá ou santo e no, mãe). Entre nós as sacerdotisas não são chamadas mulheres
    ou esposas de santo, mas sim, filhas de santo.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: mãe
    de santo; Vodu-no (vodu + no, mother); Dãnh-gbi; filha de santo; pai de santo / de terreiro.'
- kind: translation
  label: Pratibha Translation
  body: The designation generally adopted in Bahia, "father or mother of saint or of terreiro," is taken
    from the Jeje language. "Mãe de santo" is the literal translation of Vodu-no, the name given to Jeje
    priestesses of the cult of Dãnh-gbi (Vodu, orisha or saint, and no, mother). Among us the priestesses
    are not called women or wives of the saint, but daughters of the saint.
- kind: commentary
  label: Pratibha Commentary
  body: 'The linguistic claim is Jeje in the most common Bahian title: mãe de santo is Vodu-no, mother
    of the saint, from the cult of Dãnh-gbi. Father or mother of saint or terreiro is taken from Gêge
    speech. And the house does not call the priestess wife of the saint; it calls her daughter. Kinship
    is filiation, not marriage to the power. Rodrigues cannot write Vodu without the metropolitan scare-label
    humming — vodu as sensation, fetish, African contagion. Poison. Keep the etymology; refuse the carnival.
    Dãnh-gbi is a named Jeje cult, not a headline. Animismo’s father and mother are pontiff together,
    and children of the saints are the house’s population. This unit gives those Portuguese titles their
    Jeje mouth. Johnson’s sacred difference has forms; Bahia’s form is daughter, not wife. Existentially,
    you say the title in the language it came from once today. If you can only say priestess or mama,
    you have already translated the Jeje away. A daughter is not a spouse. A mother of saint is not a
    generic wise woman. The hyphen in Gêge-Nagô lives in the office’s name.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Vodu-no
    definition: 'Jeje: vodu (orisha / saint) + no (mother) -> mãe de santo as a literal calque -> "voodoo
      priestess" is the scare-label glued to a title'
  - term: filha de santo
    definition: daughter of the saint -> the priestess’s kinship in Bahia, not wife or woman of the saint
      -> marriage-to-the-god as the default misses the house’s own word
  - term: Dãnh-gbi
    definition: Jeje cult whose priestesses are Vodu-no -> a named power, not a synonym for all Candomblé
      -> folding it into Nagô orisha lists repeats the one-gloss error
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Father and Mother Are Pontiff Together
    resonance: Both treat pai and mãe de santo as a paired jurisdiction of the terreiro, not a European
      priesthood borrowed late.
    divergence: Animismo states the pontificate; this unit gives the Jeje etymology and the daughter,
      not wife, correction.
  - citation: Nina Rodrigues, O Animismo Fetichista — Children of the Saints
    resonance: 'Both make filiation the house’s basic kinship: one is a child of the saint, not a freelance
      devotee.'
    divergence: Animismo describes the population; this unit names the mother-title as a Jeje translation.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, say mãe de santo or Vodu-no out loud once, and write the kinship it actually names — mother,
    daughter — not wife, not generic priestess. Do not invent an initiation.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '20'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
