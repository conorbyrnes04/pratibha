unit_label: They Rebuilt Belief in Hidden Speech
title: They Rebuilt Belief in Hidden Speech
unit_type: teaching_passage
commentary: 'The religious-historical claim is reconstruction under captivity: people torn from home retied
  their bonds and rebuilt practice, custom, and belief in a language the masters did not know. The Atlantic
  did not only take. Trade with the Costa d’África kept instructing the city in wars and rites still happening
  on the other shore. Candomblé and Malê Islam are not folk leftovers invented from scraps; they are rebuilt
  houses with a live supply line. Rodrigues, physician of a slave society, reports the fact while leaving
  white brutality as scenery and the rebuilders as ethnographic stock. That is the poison: he can see
  the reconstruction and still rank the reconstructors. Do not romanticize the trade as free cultural
  exchange. Do not treat the rebuilt rite as a degeneration of an African original the scientist owns.
  The ethnographic remainder is the method: language the owner cannot police, ships that still talk, practices
  rebuilt as they could — not as a museum would prefer. Ìfẹ̀ locates truth in priests’ mouths at the shrine;
  Bahia locates survival in mouths the plantation could not translate. Existentially, you notice a language
  you do not speak carrying a rite, and you stop calling that silence emptiness. What you cannot overhear
  is not therefore dead.'
