- kind: key_terms
  label: Key Terms
  items:
  - term: cativeiro
    definition: captivity / the slave regime -> the condition under which practices were rebuilt, not
      the origin of the practices -> "slavery invented Candomblé" misses the homeland already being reconstructed
  - term: Costa d’África
    definition: the African coast as a live trading and news shore -> instruction continued after capture
      -> treating Brazil as cut off from Africa adopts the master’s ignorance as history
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Myths of Ìfẹ̀ — Where Truth Has Its Home
    resonance: 'Both place surety in a kept speech the outsider does not own: shrine mouths there, rebuilt
      homeland speech here.'
    divergence: Ìfẹ̀’s recitation is priestly and seated; Bahia’s reconstruction happens under the whip
      and by coastal trade.
  - citation: Lasnet, Senegalese Animism — One Does Not Leave Ancestral Land Voluntarily
    resonance: Both treat departure from homeland as a wound that does not cancel the cult of origin.
    divergence: Serer refusal is not to leave; this unit is what people did after they were taken.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, notice one language you do not speak that is carrying a rite, a song, or a prayer near
    you. Do not translate it. Write only that it is being kept without you.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '3'
  section: Rodrigues, Os Africanos, cap. II
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. II
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
