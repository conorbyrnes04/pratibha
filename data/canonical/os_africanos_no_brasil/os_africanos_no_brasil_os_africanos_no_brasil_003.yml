pratibha_layers:
- kind: original
  label: Original
  body: Por sob a ignorância e brutalidades dos senhores brancos reataram-se os laços dos imigrados, sob
    o duro regime do cativeiro reconstruíram, como puderam, as práticas, os usos e as crenças da pátria
    longínqua. O comércio continuado com a Costa d’África ia-os instruindo dos sucessos guerreiros e religiosos
    que por lá se desenrolavam.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: cativeiro
    (captivity / slavery); Costa d’África; práticas, usos, crenças.'
- kind: translation
  label: Pratibha Translation
  body: Under the ignorance and brutalities of the white masters the bonds of the immigrants were retied;
    under the hard regime of captivity they rebuilt, as they could, the practices, the customs, and the
    beliefs of the distant homeland. Continued trade with the African coast kept instructing them in the
    warrior and religious events unfolding over there.
