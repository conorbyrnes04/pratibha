- kind: key_terms
  label: Key Terms
  items:
  - term: procedências
    definition: origins / provenances -> for Rodrigues a racial sorter; for the remainder, the nation
      a language and a cult still name -> "African origin" as one box misses the order língua then religião
  - term: folk-lore
    definition: Rodrigues’s last item in the list -> a scientist’s bin for what he will not call theology
      -> festivals and traditions here are evidence of nations, not charming leftovers
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ellis, Yoruba òwe — The young cannot teach the elders traditions
    resonance: 'Both treat language as the first archive of a people: speech carries what a later science
      would call folklore.'
    divergence: The òwe is the teaching; Rodrigues wants a criterion for sorting origins and will misuse
      it.
  - citation: Samuel Johnson, The Yoruba Faith — One God, Many Towns
    resonance: Both let local speech and local cult mark difference inside a wider name.
    divergence: Johnson stays inside Yoruba towns; this unit is the rule for hearing many African nations
      in one Brazilian city.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, before you name a rite, ask which language it is in. Write the language if you know it.
    If you do not, write "unknown" and do not supply a people from the sound of the drums alone.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '9'
  section: Rodrigues, Os Africanos, cap. V
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. V
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
