unit_label: After Language, Religions
title: After Language, Religions
unit_type: teaching_passage
commentary: 'The methodological claim is an order of knowing: language first, then religions. Festivals,
  traditions, and folklore follow. You do not sort a people by pigment and then assign them a cult. You
  listen to what they speak and how they pray. Rodrigues, racial theorist, means this as a criterion of
  procedências — origins as stock — and will use religion to classify bodies he has already ranked. That
  is the poison. A sure criterion of origins in his mouth is a racial tool. We keep the order and refuse
  the sorting. The ethnographic remainder is still sharp: Nagô speech and Nagô cult travel together; Jeje
  speech leaves Jeje titles; Malê Arabic marks Islam; a Bantu language is not a failed Gêge-Nagô. Johnson’s
  Yoruba faith is a religion that comes after a language; Ellis’s òwe are that language teaching. Lasnet’s
  Serer names bind worship to a tongue and a land. Existentially, you ask which language a rite is in
  before you name the rite. If you cannot hear the language, you do not yet know the origin, and you do
  not get to fill the silence with African as a type.'
