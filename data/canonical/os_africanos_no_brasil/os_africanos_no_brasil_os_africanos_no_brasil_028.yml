pratibha_layers:
- kind: original
  label: Original
  body: 'Três são as vertentes de atividades psíquica que se oferecem, no Brasil, à satisfação do sentimento
    religioso: 1º, a atividade religiosa na adaptação fetichista do culto católico; 2º, a sobrevivência
    religiosa africana, nas superstições e magias populares; 3º, a atividade curativa e criminal dos feitiços.'
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: adaptação
    do culto católico; sobrevivência religiosa africana; feitiços (refused as the third face of the cult).'
- kind: translation
  label: Pratibha Translation
  body: 'Three are the channels of psychic activity that offer themselves, in Brazil, to the satisfaction
    of religious feeling: first, religious activity in the "fetishist" adaptation of Catholic cult; second,
    African religious survival in popular superstitions and magics; third, the curative and criminal activity
    of spells.'
