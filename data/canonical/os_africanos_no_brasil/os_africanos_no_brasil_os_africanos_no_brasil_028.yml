- kind: key_terms
  label: Key Terms
  items:
  - term: adaptação
    definition: adaptation of Catholic cult -> channel 1, saints with African powers -> not a failed conversion
      and not the whole story
  - term: sobrevivência
    definition: African religious survival in popular remainder -> channel 2 -> "superstition" is Rodrigues’s
      bin for unorganized life we still have to hear as remainder, not as trash
  - term: atividade criminal
    definition: channel 3 in Rodrigues’s triad -> criminal-anthropology dump -> do not teach crime as
      the third face of the cult
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — The Cowries Name the Saint
    resonance: Both keep a standing liturgical instrument in an organized house — the channel this triad
      does not get to replace with crime.
    divergence: Animismo ends on a named reading in the terreiro; this unit maps what leaks beside that
      house and refuses the police third.
  - citation: Lasnet, Senegalese Animism — Animism Is Not Fetishism
    resonance: Both refuse a metropolitan dump-category — fetish, crime — as the essence of a people’s
      religion.
    divergence: Lasnet denies fetish as Serer religion; this unit denies criminal spells as the third
      face of Afro-Brazilian cult.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name two channels of a tradition you actually meet — a public house and a popular remainder.
    If a third is offered as crime, devil, or "the real dark stuff," refuse that door. Write the refusal
    in one sentence.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '28'
  section: Rodrigues, Os Africanos, cap. VII
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
