unit_label: Three Channels After the Organized Cult
title: Three Channels After the Organized Cult
unit_type: teaching_passage
commentary: 'The historical claim, cleaned, is two real channels and a dump. First: African religious
  life adapted inside Catholic cult — saints sitting with powers, Mass then the dead, the overlay that
  does not empty the peji. Second: African survival in popular remainder — herbs, proverbs, Mboi-tatá
  rumors, the unorganized afterlife of nations. Those two are historical. Third — curative and criminal
  activity of spells — is Rodrigues’s criminal-anthropology chute. Refuse it as the third face of the
  cult. Do not teach crime as liturgy. Cap. IX is out of the classroom. He writes atividades psíquica
  and fetichista and feitiços because the physician needs a pathology to complete a triad. Poison. Keep
  the two doors you can actually walk: the Catholic adaptation and the popular remainder beside the organized
  Gêge-Nagô house this chapter has been describing. Animismo’s cowries name the saint in a standing terreiro;
  channel two is what leaks into the street when the terreiro is not the only mouth. Lasnet refuses fetish
  as the religion; we refuse crime as its third outlet. Existentially, you keep the two houses you can
  actually enter — the church that adapted, the popular remainder that still speaks — and you do not accept
  crime as the third door. If someone offers you a third face called sorcery-as-essence, you are being
  handed the police file bound as a theology.'
