    Olorun needs nothing, therefore he is not kept as a client. Existentially, you stop treating the unaddressed
    highest as a failure of the people who named it. What has no worshippers may be the one name you must
    not turn into a following you can count.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Olorun
    definition: Heaven-God, Lord of Heaven -> known, unaddressed, without organized cult -> "unknown god"
      or "deus otiosus" as racial deficit is Rodrigues’s poison
  - term: minoria inteligente
    definition: intelligent minority -> racial-theory smear for who can think a high god -> refuse as
      doctrine; keep the liturgical fact that Olorun has no cult
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Olorun Has No Image and No Cult
    resonance: 'Both state the same Bahian fact: Olorun is known and not kept as a liturgical client.'
    divergence: Animismo stresses no image; this unit adds no priesthood and no worshippers — and must
      refuse the racial gloss glued to the fact.
  - citation: Samuel Johnson, The Yoruba Faith — Between Maker and World
    resonance: 'Both pair a comprehensive Maker with distance: exaltation explains why the middle population
      does the work.'
    divergence: Johnson does not need a racial minority to explain the distance; Rodrigues does, and that
      need is poison.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one highest principle you claim and notice that you have no weekly rite for it. Do
    not invent one. Write whether the absence is reverence or neglect — and do not score anyone else’s
    empty plinth as stupidity.
