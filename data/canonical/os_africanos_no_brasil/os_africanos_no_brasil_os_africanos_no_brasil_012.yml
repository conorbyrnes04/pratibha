unit_label: Olorun Has No Cult and No Worshippers
title: Olorun Has No Cult and No Worshippers
unit_type: teaching_passage
commentary: 'The liturgical fact is negative and exact: Olorun has no organized cult, no priesthood, and
  no worshippers. The highest is not the most available. Absence of a feast is not a hole in the religion;
  it is the religion’s height. Rodrigues cannot state that fact without racial-theory poison. He calls
  Olorun the Race’s highest aptitude for generalizing, a conception of the intelligent minority that failed
  to penetrate the mass. Refuse that sentence as doctrine. There is no racial IQ of monotheism. There
  is no Nagô elite that invented a sky-god the people were too dull to keep. Animismo already said the
  same liturgical emptiness in French: no image, no special cult. Johnson’s Olorun is too exalted to handle
  human affairs directly. Lasnet’s invisible master is named as the sky and not addressed as an object.
  The ethnographic remainder is the empty plinth. Orishas receive because they receive. Olorun needs nothing,
  therefore he is not kept as a client. Existentially, you stop treating the unaddressed highest as a
  failure of the people who named it. What has no worshippers may be the one name you must not turn into
  a following you can count.'
