pratibha_layers:
- kind: original
  label: Original
  body: Olorun, o Céu-Deus, satisfazendo dificilmente a condição de objeto concreto de culto, é apenas
    a representação da mais alta aptidão da Raça para generalizar. Concepção da minoria inteligente, a
    divindade não penetrou a massa popular, e Olorun representa assim uma divindade singular que não tem
    culto organizado, que não possui sacerdócio, que não tem adoradores.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Olorun
    (Céu-Deus); sem culto organizado; sem sacerdócio; sem adoradores.'
- kind: translation
  label: Pratibha Translation
  body: Olorun, the Heaven-God, hardly satisfying the condition of a concrete object of cult, is only
    the representation of the Race’s highest aptitude for generalizing. A conception of the intelligent
    minority, the divinity did not penetrate the popular mass, and Olorun thus represents a singular divinity
    who has no organized cult, who possesses no priesthood, who has no worshippers.
- kind: commentary
  label: Pratibha Commentary
  body: 'The liturgical fact is negative and exact: Olorun has no organized cult, no priesthood, and no
    worshippers. The highest is not the most available. Absence of a feast is not a hole in the religion;
