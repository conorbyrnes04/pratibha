  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. VII
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
