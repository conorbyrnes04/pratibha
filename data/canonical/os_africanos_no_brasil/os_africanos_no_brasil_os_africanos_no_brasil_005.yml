- kind: key_terms
  label: Key Terms
  items:
  - term: alufá
    definition: Muslim teacher / imam in Bahian Malê speech (also marabu) -> the master who preaches and
      teaches letters -> "witch doctor" or "sect leader" is the police gloss
  - term: Licutan
    definition: Pacífico’s name among his own -> the name the nation uses when Portuguese is the master’s
      tongue -> keeping only Pacífico adopts the baptismal record as the person
  - term: Tapa
    definition: nation of Sanim (Nupe) -> Islam in Bahia is not only Nagô -> collapsing every alufá into
      Yoruba repeats the one-gloss error of cap. I
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — One God, Many Towns
    resonance: Both keep a single highest address housed under local names and rooms.
    divergence: Johnson’s towns are Yoruba polities; these houses are freedmen’s rooms and a master’s
      shop.
  - citation: Nina Rodrigues, O Animismo Fetichista — Terreiro Means Place and Jurisdiction
    resonance: Both insist that a sacred house is a location with authority, not a vacant lot with rumors.
    divergence: The terreiro’s jurisdiction is orisha; these rooms’ jurisdiction is Arabic teaching and
      Malê prayer.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, name one ordinary room — a shop, a kitchen, a rented house — that has served as a school
    or a place of prayer. Write the two names it has: the street name and the name used inside.'
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '5'
  section: Rodrigues, Os Africanos, cap. II — 1835
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. II — 1835
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
