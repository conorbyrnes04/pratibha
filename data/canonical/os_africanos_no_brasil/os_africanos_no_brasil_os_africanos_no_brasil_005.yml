unit_label: The Houses Were Schools and Mosques
title: The Houses Were Schools and Mosques
unit_type: teaching_passage
commentary: 'The claim is an address book of Islam in Bahia: named houses, named freedmen, named teachers,
  named nations. Rua da Oração held a school where an alufá preached. Sanim is Tapa. Licutan is Pacífico
  among his own, teaching in the shops of a master’s house. These are mosques that look like rooms. Rodrigues
  lifts the list from the 1835 inquiry and keeps the police file’s appetite: houses as cells of a sect,
  names as a roster of danger. That is the poison. We do not teach the Malê revolt as the essence of the
  religion, and we do not turn this paragraph into a crime scene. The ethnographic remainder is the double
  name and the double use. A man is Pacífico in Portuguese and Licutan among his own. A shop is a shop
  and a mosque. A freed Nagô house is a school. Johnson’s many towns keep one God under different local
  names; these houses keep one Book under Nagô and Tapa mouths. Lasnet’s ancestral land is a cult you
  do not leave; these rooms are a cult rebuilt in someone else’s street grid. Existentially, you learn
  one house that taught a language the street did not, and you stop needing a minaret before you will
  admit a mosque. If the only church you can see is the one with a façade, you are still reading with
  the master’s eyes.'
