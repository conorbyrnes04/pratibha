pratibha_layers:
- kind: original
  label: Original
  body: 'Eram outras tantas escolas e igrejas maometanas: a casa dos nagôs libertos Belchior e Gaspar
    da Silva Cunha, na rua da Oração, onde pregava de mestre o alufá ou marabu Luis, Sanim na sua nação
    Tapa; a casa dos nagôs libertos Manuel Calafate e Aprígio; a casa do nagô Pacífico, Licutan entre
    os seus, nas lojas da casa de seu senhor, no Cruzeiro de São Francisco.'
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: alufá
    / marabu; Sanim (Tapa nation); Licutan (Pacífico among his own); rua da Oração; Cruzeiro de São Francisco.'
- kind: translation
  label: Pratibha Translation
  body: 'They were so many schools and Muslim churches: the house of the freed Nagô men Belchior and Gaspar
