work_title: Os Africanos no Brasil
unit_id: os_africanos_no_brasil.os_africanos_no_brasil_001
unit_label: Nations Are Not One Gloss
title: Nations Are Not One Gloss
unit_type: teaching_passage
commentary: 'The claim the street still lives is that Nagô, Mina, Angola, and Mozambique are not one people
  painted black. Popular speech and learned speech both collapse those names into Negro da Costa or African,
  as if the coast were a single nation and pigment a single origin. That collapse is the first violence
  the book records, and it is still the first violence a reader can repeat. Rodrigues, a Bahian physician
  and racial theorist, writes the correction while keeping the poison: he denies ethnic uniformity and
  then points at a negro verniz pigmentário, a Black pigmentary varnish, as if the body were a coating
  over a type. The book is carregada de preconceito. Do not launder the ladder that will later rank nations,
  score intelligence, and dump Cap. VIII and IX into criminal anthropology. We do not teach those chapters
  as doctrine. The ethnographic remainder is the nation names themselves. Nagô is not Mina. Angola is
  not Mozambique. Bahia will show Sudanese weight, Jeje speech, Malê prayer, and Gêge-Nagô cult — not
  a continent-sized fetish. Johnson writes Yoruba faith from inside one nation; Lasnet writes Serer life
  from another. Neither will sit still under African as a gloss. Existentially, you refuse the one word
  that lets you stop learning the second.'
