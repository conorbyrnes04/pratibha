  Homero Pires’s preface or later editors.'
pratibha_layers:
- kind: original
  label: Original
  body: As designações populares de Nagô, Mina, Angola, Moçambique, etc., conservam, para o vulgo como
    para o letrado, o rigoroso valor sinonímico de Negro da Costa, ou Africano. Ora, antes de tudo, bem
    longe está da realidade a uniformidade étnica aparente que dá ao homem africano o seu negro verniz
    pigmentário.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: Nagô;
    Mina; Angola; Moçambique; Negro da Costa (period gloss, not a nation).'
- kind: translation
  label: Pratibha Translation
  body: The popular designations Nagô, Mina, Angola, Mozambique, and the rest keep, for the crowd as for
    the lettered, the strict synonym-value of Negro da Costa, or African. Yet first of all, the apparent
    ethnic uniformity that the African person’s black pigmentary varnish is supposed to give is far from
    the reality.
