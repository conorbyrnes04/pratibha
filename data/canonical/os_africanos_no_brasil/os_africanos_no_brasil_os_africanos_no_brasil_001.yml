- kind: key_terms
  label: Key Terms
  items:
  - term: Nagô
    definition: Bahian name for the Yoruba nation -> a people with language and orisha cult, not a skin-tone
      synonym -> folding Nagô into Negro da Costa erases the first nation this book can still teach
  - term: Negro da Costa
    definition: period Brazilian gloss for a person from the African coast -> a market and police category,
      not an ethnicity -> keeping it as doctrine adopts the vulgar synonym Rodrigues himself says is false
  - term: verniz pigmentário
    definition: pigmentary varnish -> Rodrigues’s racial image for Black skin as a coating that fakes
      unity -> the poison to name and refuse, even when the sentence correctly denies one African ethnicity
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — Only One God in the Universe
    resonance: Both open by refusing a single African religion in Bahia and naming Nagô as a specific
      house.
    divergence: Animismo starts from Olorun’s court; this book starts from nation names the street has
      already flattened.
  - citation: Samuel Johnson, The Yoruba Faith — One God, Many Towns
    resonance: 'Both keep Yoruba life from collapsing into one tribal label: towns and nations differ
      inside a shared highest name.'
    divergence: Johnson writes from inside Yoruba towns; Rodrigues writes as a Bahian physician listing
      captive nations under a racial varnish he will not drop.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, catch one sentence in which you used African, Black, or the coast as if it named a single
    people. Replace it with the nation, language, or house you actually mean. If you do not know the second
    word, write that ignorance down instead of the gloss.
