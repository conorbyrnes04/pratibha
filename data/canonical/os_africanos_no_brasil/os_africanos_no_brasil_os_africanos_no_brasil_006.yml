unit_label: They Will Not Adore Wood
title: They Will Not Adore Wood
unit_type: teaching_passage
commentary: 'The theological claim is aniconic and exact: the papers are prayers, the teachers write them,
  and the images on a Catholic altar are wood, not saints. Malê Bahia refuses to adore pau. This is Islam’s
  old argument against the figurine, spoken in a slave inquiry. Rodrigues files Marcelina’s deposition
  as evidence and keeps the poison of the courtroom: an enslaved woman’s speech extracted, "papers found,"
  a religion made to testify against itself. Do not teach the raid as the meaning of the prayer. Do not
  treat her sentence as folklore about fanatics who hate Mass. The ethnographic remainder is the doctrine
  inside the deposition. Reza is writing. Mestres walk and teach. Images are not saints. Animismo will
  later show Catholic saints sitting with orishas in the terreiro; this house refuses the wood altogether.
  Both facts can be true in one city. Johnson reserves a name that must not be multiplied; Malê prayer
  reserves a God who must not be carved. Existentially, you catch idol or fetish in your mouth when you
  mean someone else’s prayer, and you ask whether you are defending a theology or defending a police inventory.
  The papers were prayers before they were exhibits.'
