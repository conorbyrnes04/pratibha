pratibha_layers:
- kind: original
  label: Original
  body: Depõe a escrava Marcelina que os papéis achados são de reza dos malês, escritos e feitos pelos
    mestres que andam ensinando. Eles aborreciam, dizendo que ela ia à missa adorar pau, que está no altar,
    porque as imagens não são santos.
- kind: iast
  label: Romanization
  body: 'Rodrigues Portuguese of Afro-Brazilian observation (written c. 1905, pub. 1932). Key terms: reza
    dos malês; mestres; pau (wood on the altar); imagens / santos.'
- kind: translation
  label: Pratibha Translation
  body: The enslaved woman Marcelina deposes that the papers found are Malê prayers, written and made
    by the teachers who go about teaching. They abhorred it, saying she went to Mass to adore wood that
    stands on the altar, because the images are not saints.
- kind: commentary
  label: Pratibha Commentary
  body: 'The theological claim is aniconic and exact: the papers are prayers, the teachers write them,
    and the images on a Catholic altar are wood, not saints. Malê Bahia refuses to adore pau. This is
    Islam’s old argument against the figurine, spoken in a slave inquiry. Rodrigues files Marcelina’s
    deposition as evidence and keeps the poison of the courtroom: an enslaved woman’s speech extracted,
    "papers found," a religion made to testify against itself. Do not teach the raid as the meaning of
    the prayer. Do not treat her sentence as folklore about fanatics who hate Mass. The ethnographic remainder
    is the doctrine inside the deposition. Reza is writing. Mestres walk and teach. Images are not saints.
    Animismo will later show Catholic saints sitting with orishas in the terreiro; this house refuses
    the wood altogether. Both facts can be true in one city. Johnson reserves a name that must not be
    multiplied; Malê prayer reserves a God who must not be carved. Existentially, you catch idol or fetish
    in your mouth when you mean someone else’s prayer, and you ask whether you are defending a theology
    or defending a police inventory. The papers were prayers before they were exhibits.'
- kind: key_terms
  label: Key Terms
  items:
  - term: reza dos malês
    definition: Malê prayer, written by teaching masters -> Arabic (or Arabic-script) devotion, not a
      spell-paper -> "papers found" is the raid’s name for a liturgy
  - term: pau
    definition: wood on the altar -> Malê refusal of the image as God -> hearing only hatred of Catholicism
      misses aniconic theology
  - term: Marcelina
    definition: enslaved deponent in the inquiry -> a voice the archive extracted -> do not make her the
      mascot of either the police or a later romance of resistance
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nina Rodrigues, O Animismo Fetichista — The Figures Are Neither Fetish nor Idol
    resonance: 'Both refuse a cheap word for what stands on an altar: figures are not automatically idols;
      wood is not automatically a saint.'
    divergence: Animismo defends orisha figures from the word fetish; Malê speech refuses the Catholic
      image as God.
  - citation: Samuel Johnson, The Yoruba Faith — The Name Reserved for God Alone
    resonance: Both protect the highest from a multiplication that would let any object stand in.
    divergence: Johnson legislates a name; Marcelina reports a people who will not kneel to carved wood.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, catch idol, fetish, or wood in your mouth when you describe someone else’s altar. Replace
    the sneer with the name they use for what stands there. If you do not know the name, stop at that.
provenance:
  collection: Os Africanos no Brasil
  category: candomble-bahia
  verse: '6'
  section: Rodrigues, Os Africanos, cap. II — Marcelina
  cultural_context: Historical conditions through which Nagô, Jeje, Bantu, and Malê (Islam) practices
    took root in Brazil. Sibling to *O Animismo Fetichista* (liturgy). Rodrigues was a physician and racial
    theorist; the book is carregada de preconceito. Restore nations, language, Malê prayer, Gêge-Nagô
    cult, and police survival — not his hierarchy, not "fetish" as doctrine, not criminal anthropology.
    Study reading pending review by Candomblé and Malê tradition-bearers.
  original_source: Rodrigues, Os Africanos, cap. II — Marcelina
  original_reliability: SOURCED — Rodrigues Portuguese (posthumous 1932); Edelstein 2010 diplomatic of
    that text. Not Homero Pires preface. Not Cap. VIII/IX as doctrine.
