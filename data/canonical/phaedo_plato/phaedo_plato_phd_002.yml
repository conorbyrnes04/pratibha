sanskrit_devanagari: ἡ ψυχὴ ἀθάνατος καὶ ἀνώλεθρος, καὶ αἱ ἡμέτεραι ψυχαὶ ὄντως ἐν Ἅιδου ἐσόμεναι. (hē psychē athanatos kai
  anōlethros, kai hai hēmetarai psychai ontōs en Haidou esomenai.)
sanskrit_iast: ''
translation_literal: 'The soul is immortal and imperishable, and our souls will truly exist in Hades. Consider: the soul is
  akin to (syngenēs) the divine, the immortal, the intelligible, the uniform, the indissoluble, and that which always remains
  the same; whereas the body is akin to the human, the mortal, the sensible, the multiform, the dissoluble, and that which
  never remains the same. Does not the soul, being of this nature, depart to a place that is like itself—noble, pure, invisible—to
  the good and wise god, where, if god wills, my soul too must soon go?'
commentary: 'This passage crystallizes Plato''s doctrine of kin-affinity (syngeneia) between soul and Forms. The soul''s immortality
  is grounded not in mere assertion but in ontological resemblance: the soul participates in the eternal, unchanging, intelligible
  realm precisely because it shares the Forms'' nature. The body, by contrast, is mutable, composite, and perishable. Socrates''
  calm acceptance of death flows from this metaphysical confidence—the soul returns to its natural home. The passage unites
  epistemology (the soul knows the Forms) with eschatology (the soul''s post-mortem destiny). Critics note the argument assumes
  rather than proves the soul''s immateriality, yet the doctrine proved enormously influential in Neoplatonism and Christian
  theology. The rhetorical force lies in the comfort offered: philosophy is not alienation from one''s true nature but homecoming.


  Key Terms


  **ψυχή** — soul, the principle of life and intellect.

  **ἀθάνατος** — immortal, not subject to death.

  **ἀνώλεθρος** — imperishable, incapable of destruction.

  **Ἅιδου** — of Hades, the underworld or abode of the dead.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.20:** The Gītā likewise declares that the self is unborn, eternal, and not destroyed when the body is
  destroyed. Divergence: Its ātman belongs within a karmic cycle of rebirth and liberation rather than Plato’s specifically
  intelligible affinity between soul and Forms.

  **Katha Upaniṣad 2.18:** The Upaniṣad describes the self as unborn, eternal, and not slain when the body is slain, closely
  paralleling Plato’s contrast between enduring soul and mortal body. Divergence: The Upaniṣadic self is ultimately articulated
  in relation to Brahman, whereas Plato’s soul remains an individual rational soul whose postmortem destiny is discussed in
  Hades.

  **Wisdom of Solomon 3:1–4:** Wisdom portrays the souls of the righteous as being in God’s hand and as possessing an immortality
  that apparent death cannot negate. Divergence: Its assurance depends on divine justice and the moral fate of the righteous,
  rather than on an ontological argument from the soul’s likeness to immutable realities.'
practice: 'Upon waking, sit quietly and recall a moment of intellectual clarity—when a mathematical truth, ethical principle,
  or beauty struck you as timelessly true, not dependent on your mood or circumstance. Dwell on the quality of that knowing:
  was it not a touching of something unchanging? Now, gently extend this recognition: your capacity to know such things suggests
  kinship with them. Spend ten minutes in this contemplation, allowing the distinction between your mutable body (hunger,
  fatigue, desire) and your stable, knowing soul to become vivid. Let this affinity console and orient you toward philosophical
  study as homecoming.'
