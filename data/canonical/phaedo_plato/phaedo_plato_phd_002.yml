sanskrit_devanagari: ὅταν δέ γε αὐτὴ καθ’ αὑτὴν σκοπῇ, ἐκεῖσε οἴχεται εἰς τὸ καθαρόν τε καὶ ἀεὶ ὂν καὶ
  ἀθάνατον καὶ ὡσαύτως ἔχον, καὶ ὡς συγγενὴς οὖσα αὐτοῦ ἀεὶ μετ’ ἐκείνου τε γίγνεται, ὅτανπερ αὐτὴ καθ᾽
  αὑτὴν γένηται καὶ ἐξῇ αὐτῇ, καὶ πέπαυταί τε τοῦ πλάνου καὶ περὶ ἐκεῖνα ἀεὶ κατὰ ταὐτὰ ὡσαύτως ἔχει,
  ἅτε τοιούτων ἐφαπτομένη· καὶ τοῦτο αὐτῆς τὸ πάθημα φρόνησις κέκληται; παντάπασιν, ἔφη, καλῶς καὶ ἀληθῆ
  λέγεις, ὦ Σώκρατες. ποτέρῳ οὖν αὖ σοι δοκεῖ τῷ εἴδει καὶ ἐκ τῶν πρόσθεν καὶ ἐκ τῶν νῦν λεγομένων ψυχὴ
  ὁμοιότερον εἶναι καὶ συγγενέστερον; πᾶς ἄν μοι δοκεῖ, ἦ δ’ ὅς, συγχωρῆσαι, ὦ Σώκρατες, ἐκ ταύτης τῆς
  μεθόδου, καὶ ὁ δυσμαθέστατος, ὅτι ὅλῳ καὶ παντὶ ὁμοιότερόν ἐστι ψυχὴ τῷ ἀεὶ ὡσαύτως ἔχοντι μᾶλλον ἢ
  τῷ μή. τί δὲ τὸ σῶμα; τῷ ἑτέρῳ. ΦΑΙΔ. ὅρα δὴ καὶ τῇδε ὅτι ἐπειδὰν ἐν τῷ αὐτῷ ὦσι ψυχὴ καὶ σῶμα, τῷ μὲν
  δουλεύειν καὶ ἄρχεσθαι ἡ φύσις προστάττει, τῇ δὲ ἄρχειν καὶ δεσπόζειν· καὶ κατὰ ταῦτα αὖ πότερόν σοι
  δοκεῖ ὅμοιον τῷ θείῳ εἶναι καὶ πότερον τῷ θνητῷ; ἢ οὐ δοκεῖ σοι τὸ μὲν θεῖον οἷον ἄρχειν τε καὶ ἡγεμονεύειν
  πεφυκέναι, τὸ δὲ θνητὸν ἄρχεσθαί τε καὶ δουλεύειν; ἔμοιγε. ποτέρῳ οὖν ἡ ψυχὴ ἔοικεν; δῆλα δή, ὦ Σώ
