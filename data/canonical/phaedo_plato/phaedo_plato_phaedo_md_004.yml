- kind: translation
  label: Pratibha Translation
  body: 'Simmias proposes that the soul is like harmony: subtle, invisible, but dependent on bodily structure as harmony depends
    on strings. Socrates rejects this by showing that soul often governs and resists bodily impulses. What can command a system
    cannot be reduced to a byproduct of that same system.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is methodological: explanatory elegance is insufficient if it cannot account for lived agency. The harmony
    analogy is attractive because it preserves subtlety while remaining naturalistic. Socrates'' counterintuitive rebuttal
    is phenomenological rather than purely metaphysical: observe experience. We witness an ordering principle that can contradict
    appetitive momentum. If soul were only resultant balance, it could not issue commands against the conditions that generate
    it.


    This argument matters because it marks one of philosophy''s earliest high-level confrontations with reductionism. Socrates
    is not anti-body; he is anti-collapse. He refuses a model that explains away normativity, self-critique, and rational
    resistance. "I ought not" and "I refrain" become evidentiary data, not illusions to be discarded.


    Existentially, the passage offers a practical diagnostic: wherever there is genuine capacity to interrupt impulse and
    reorient action by reason, there is evidence of depth beyond mechanical sequence. Modern language might call this executive
    agency or reflective freedom; Plato calls it soul''s rulership. The point is the same: inner governance is real enough
    to ground responsibility. Without it, ethics becomes ornamental.


    Key Terms:


    **harmonia (ἁρμονία)** - fitting, concord, attunement -> Simmias uses it to explain soul as emergent order from bodily
    composition -> translating as only "harmony" can hide the ontological claim of dependence.


    **enantion (ἐναντίον)** - opposite, contrary -> central in Socrates'' refutation: soul can oppose bodily drives -> missing
    this logical role blunts the argument.


    **epithymia (ἐπιθυμία)** - appetite/desire -> the domain often resisted by rational soul in Plato''s account -> "desire"
    without structural place in psychic economy is too vague.


    **arche (ἀρχή)** - ruling principle/origin -> soul functions as governing arche, not merely derivative state -> reducing
    arche to temporal "beginning" misses normative force.'
