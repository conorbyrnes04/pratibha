- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 3.42-3.43
    resonance: Both depict layered psychology in which higher discernment can govern lower impulsive drives.
    divergence: Gita's hierarchy culminates in Atman-devotion and disciplined action; *Phaedo* uses the same governance intuition
      to refute a metaphysical model.
    passage_id: ''
  - citation: Aristotle, De Anima II.1 and III.9-10
    resonance: Both resist simplistic material reduction and preserve explanatory roles for psyche in action.
    divergence: Aristotle formalizes hylomorphic unity more strongly than Plato's affinity-based dual emphasis.
    passage_id: ''
  - citation: Vijnana Bhairava Tantra 24 and 39 (attentional interruption methods)
    resonance: Both treat interruption of automatic mental movement as gateway to deeper recognition.
    divergence: VBT is practice-manual and non-dual Shaiva; *Phaedo* is argumentative and post-mortem focused.
    passage_id: ''
