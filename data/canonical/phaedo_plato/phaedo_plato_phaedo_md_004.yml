sanskrit_devanagari: καὶ ὁ Σωκράτης, ἴσως γάρ, ἔφη, ὦ ἑταῖρε, ἀληθῆ σοι φαίνεται· ἀλλὰ λέγε ὅπῃ δὴ οὐχ ἱκανῶς. ΦΑΙΔ. ταύτῃ
  ἔμοιγε, ἦ δ’ ὅς, ᾗ δὴ καὶ περὶ ἁρμονίας ἄν τις καὶ λύρας τε καὶ χορδῶν τὸν αὐτὸν τοῦτον λόγον εἴποι, ὡς ἡ μὲν ἁρμονία ἀόρατον
  καὶ ἀσώματον καὶ πάγκαλόν τι καὶ θεῖόν ἐστιν ἐν τῇ ἡρμοσμένῃ λύρᾳ, αὐτὴ δ’ ἡ λύρα καὶ αἱ χορδαὶ σώματά τε καὶ σωματοειδῆ
  καὶ σύνθετα καὶ γεώδη ἐστὶ καὶ τοῦ θνητοῦ συγγενῆ. ἐπειδὰν οὖν ἢ κατάξῃ τις τὴν λύραν ἢ διατέμῃ καὶ διαρρήξῃ τὰς χορδάς,
  εἴ τις διισχυρίζοιτο τῷ αὐτῷ λόγῳ ὥσπερ σύ, ὡς ἀνάγκη ἔτι εἶναι τὴν ἁρμονίαν ἐκείνην καὶ μὴ ἀπολωλέναι — οὐδεμία γὰρ μηχανὴ
  ἂν εἴη τὴν μὲν λύραν ἔτι εἶναι διερρωγυιῶν τῶν χορδῶν καὶ τὰς χορδὰς θνητοειδεῖς οὔσας, τὴν δὲ ἁρμονίαν ἀπολωλέναι τὴν τοῦ
  θείου τε καὶ ἀθανάτου ὁμοφυῆ τε καὶ συγγενῆ, προτέραν τοῦ θνητοῦ ἀπολομένην — ἀλλὰ φαίη ἀνάγκη ἔτι που εἶναι αὐτὴν τὴν ἁρμονίαν,
  καὶ πρότερον τὰ ξύλα καὶ τὰς χορδὰς κατασαπήσεσθαι πρίν τι ἐκείνην παθεῖν — καὶ γὰρ οὖν, ὦ Σώκρατες, οἶμαι ἔγωγε καὶ αὐτόν
  σε τοῦτο ἐντεθυμῆσθαι, ὅτι τοιοῦτόν τι μάλιστα ὑπολαμβάνομεν τὴν ψυχὴν εἶναι, ὥσπερ ἐντεταμένου τοῦ σώματος ἡμῶν καὶ συνεχομένου
  ὑπὸ θερμοῦ καὶ ψυχροῦ καὶ ξηροῦ καὶ ὑγροῦ καὶ τοιούτων τινῶν, κρᾶσιν εἶναι καὶ ἁρμονίαν αὐτῶν τούτων τὴν ψυχὴν ἡμῶν, ἐπειδὰν
  ταῦτα καλῶς καὶ μετρίως κραθῇ πρὸς ἄλληλα — εἰ οὖν τυγχάνει ἡ ψυχὴ οὖσα ἁρμονία τις, δῆλον ὅτι, ὅταν χαλασθῇ τὸ σῶμα ἡμῶν
  ἀμέτρως ἢ ἐπιταθῇ ὑπὸ νόσων καὶ ἄλλων κακῶν, τὴν μὲν ψυχὴν ἀνάγκη εὐθὺς ὑπάρχει ἀπολωλέναι, καίπερ οὖσαν θειοτάτην, ὥσπερ
  καὶ αἱ ἄλλαι ἁρμονίαι αἵ τ’ ἐν τοῖς φθόγγοις καὶ ἐν τοῖς τῶν δημιουργῶν ἔργοις πᾶσι, τὰ δὲ λείψανα τοῦ σώματος ἑκάστου πολὺν
  χρόνον παραμένειν, ἕως ἂν ἢ κατακαυθῇ ἢ κατασαπῇ — ὅρα οὖν πρὸς τοῦτον τὸν λόγον τί φήσομεν, ἐάν τις ἀξιοῖ κρᾶσιν οὖσαν
  τὴν ψυχὴν τῶν ἐν τῷ σώματι ἐν τῷ καλουμένῳ θανάτῳ πρώτην ἀπόλλυσθαι. διαβλέψας οὖν ὁ Σωκράτης, ὥσπερ τὰ πολλὰ εἰώθει, καὶ
  μειδιάσας, δίκαια μέντοι, ἔφη, λέγει ὁ Σιμμίας. εἰ οὖν τις ὑμῶν εὐπορώτερος ἐμοῦ, τί οὐκ ἀπεκρίνατο; καὶ γὰρ οὐ φαύλως ἔοικεν
  ἁπτομένῳ τοῦ λόγου. δοκεῖ μέντοι μοι χρῆναι πρὸ τῆς ἀποκρίσεως ἔτι πρότερον κέβητος ἀκοῦσαι … ἂν ταῦτα ὁ λόγος εἰ ὀρθὴ ἡ
  ὑπόθεσις ἦν, τὸ ψυχὴν ἁρμονίαν εἶναι; οὐδ’ ὁπωστιοῦν, ἔφη. τί δέ; ἦ δ’ ὅς· τῶν ἐν ἀνθρώπῳ πάντων ἔσθ’ ὅτι ἄλλο λέγεις ἄρχειν
  ἢ ψυχὴν ἄλλως τε καὶ φρόνιμον; οὐκ ἔγωγε. πότερον συγχωροῦσαν τοῖς κατὰ τὸ σῶμα πάθεσιν ἢ καὶ ἐναντιουμένην; λέγω δὲ τὸ
  τοιόνδε, οἷον καύματος ἐνόντος καὶ δίψους ἐπὶ τοὐναντίον ἕλκειν, τὸ μὴ πίνειν, καὶ πείνης ἐνούσης ἐπὶ τὸ μὴ ἐσθίειν, καὶ
  ἄλλα μυρία που ὁρῶμεν ἐναντιουμένην τὴν ψυχὴν τοῖς κατὰ τὸ σῶμα· ἢ οὔ; πάνυ μὲν οὖν. οὐκοῦν αὖ ὡμολογήσαμεν ἐν τοῖς πρόσθεν
  μήποτ’ ἂν αὐτήν, ἁρμονίαν γε οὖσαν, ἐναντία ᾄδειν οἷς ἐπιτείνοιτο καὶ χαλῷτο καὶ ψάλλοιτο καὶ ἄλλο ὁτιοῦν πάθος πάσχοι ἐκεῖνα
  ἐξ ὧν τυγχάνοι οὖσα, ἀλλ’ ἕπεσθαι ἐκείνοις καὶ οὔποτ’ ἂν ἡγεμονεύειν; ὡμολογήσαμεν, ἔφη· πῶς γὰρ οὔ; τί οὖν; νῦν οὐ πᾶν
  τοὐναντίον ἡμῖν φαίνεται ἐργαζομένη, ἡγεμονεύουσά τε ἐκείνων πάντων ἐξ ὧν φησί τις αὐτὴν εἶναι, καὶ ἐναντιουμένη ὀλίγου
  πάντα διὰ παντὸς τοῦ βίου καὶ δεσπόζουσα πάντας τρόπους, τὰ μὲν χαλεπώτερον κολάζουσα καὶ μετ’ ἀλγηδόνων, τά τε κατὰ τὴν
  γυμναστικὴν καὶ τὴν ἰατρικήν, τὰ δὲ πρᾳότερον, καὶ τὰ μὲν ἀπειλοῦσα, τὰ δὲ νουθετοῦσα, ταῖς ἐπιθυμίαις καὶ ὀργαῖς καὶ φόβοις
  ὡς ἄλλη οὖσα ἄλλῳ πράγματι διαλεγομένη; οἷόν που καὶ Ὅμηρος ἐν Ὀδυσσείᾳ πεποίηκεν, οὗ λέγει τὸν Ὀδυσσέα· στῆθος δὲ πλήξας
  κραδίην ἠνίπαπε μύθῳ· τέτλαθι δή, κραδίη· καὶ κύντερον ἄλλο ποτ᾽ ἔτλης. ἆρ’ οἴει αὐτὸν ταῦτα ποιῆσαι διανοούμενον ὡς ἁρμονίας
  αὐτῆς οὔσης καὶ οἵας ἄγεσθαι ὑπὸ τῶν τοῦ σώματος παθημάτων, ἀλλ’ οὐχ οἵας ἄγειν τε ταῦτα καὶ δεσπόζειν, καὶ οὔσης αὐτῆς
  πολὺ θειοτέρου τινὸς πράγματος ἢ καθ’ ἁρμονίαν; νὴ Δία, ὦ Σώκρατες, ἔμοιγε δοκεῖ. ΦΑΙΔ. οὐκ ἄρα, ὦ ἄριστε, ἡμῖν οὐδαμῇ καλῶς
  ἔχει ψυχὴν
sanskrit_iast: kai ho Sōkratēs, isōs gar, ephē, ō hetaire, alēthē soi phainetai; alla lege hopē dē oych hikanōs. PhAID. taytē
  emoige, ē d’ hos, hē dē kai peri harmonias an tis kai lyras te kai chordōn ton ayton toyton logon eipoi, hōs hē men harmonia
  aoraton kai asōmaton kai pankalon ti kai theion estin en tē hērmosmenē lyra, aytē d’ hē lyra kai ai chordai sōmata te kai
  sōmatoeidē kai syntheta kai geōdē esti kai toy thnētoy syngenē. epeidan oyn ē kataxē tis tēn lyran ē diatemē kai diarrēxē
  tas chordas, ei tis diischyrizoito tō aytō logō hōsper sy, hōs anankē eti einai tēn harmonian ekeinēn kai mē apolōlenai
  — oydemia gar mēchanē an eiē tēn men lyran eti einai dierrōgyiōn tōn chordōn kai tas chordas thnētoeideis oysas, tēn de
  harmonian apolōlenai tēn toy theioy te kai athanatoy homophyē te kai syngenē, proteran toy thnētoy apolomenēn — alla phaiē
  anankē eti poy einai aytēn tēn harmonian, kai proteron ta xyla kai tas chordas katasapēsesthai prin ti ekeinēn pathein —
  kai gar oyn, ō Sōkrates, oimai egōge kai ayton se toyto entethymēsthai, hoti toioyton ti malista hypolambanomen tēn psychēn
  einai, hōsper entetamenoy toy sōmatos hēmōn kai synechomenoy hypo thermoy kai psychroy kai xēroy kai hygroy kai toioytōn
  tinōn, krasin einai kai harmonian aytōn toytōn tēn psychēn hēmōn, epeidan tayta kalōs kai metriōs krathē pros allēla — ei
  oyn tynchanei hē psychē oysa harmonia tis, dēlon hoti, hotan chalasthē to sōma hēmōn ametrōs ē epitathē hypo nosōn kai allōn
  kakōn, tēn men psychēn anankē eythys hyparchei apolōlenai, kaiper oysan theiotatēn, hōsper kai ai allai harmoniai ai t’
  en tois phthongois kai en tois tōn dēmioyrgōn ergois pasi, ta de leipsana toy sōmatos hekastoy polyn chronon paramenein,
  heōs an ē katakaythē ē katasapē — hora oyn pros toyton ton logon ti phēsomen, ean tis axioi krasin oysan tēn psychēn tōn
  en tō sōmati en tō kaloymenō thanatō prōtēn apollysthai. diablepsas oyn ho Sōkratēs, hōsper ta polla eiōthei, kai meidiasas,
  dikaia mentoi, ephē, legei ho Simmias. ei oyn tis hymōn eyporōteros emoy, ti oyk apekrinato; kai gar oy phaylōs eoiken haptomenō
  toy logoy. dokei mentoi moi chrēnai pro tēs apokriseōs eti proteron kebētos akoysai … an tayta ho logos ei orthē hē hypothesis
  ēn, to psychēn harmonian einai; oyd’ hopōstioyn, ephē. ti de; ē d’ hos; tōn en anthrōpō pantōn esth’ hoti allo legeis archein
  ē psychēn allōs te kai phronimon; oyk egōge. poteron synchōroysan tois kata to sōma pathesin ē kai enantioymenēn; legō de
  to toionde, oion kaymatos enontos kai dipsoys epi toynantion helkein, to mē pinein, kai peinēs enoysēs epi to mē esthiein,
  kai alla myria poy horōmen enantioymenēn tēn psychēn tois kata to sōma; ē oy; pany men oyn. oykoyn ay hōmologēsamen en tois
  prosthen mēpot’ an aytēn, harmonian ge oysan, enantia adein ois epiteinoito kai chalōto kai psalloito kai allo hotioyn pathos
  paschoi ekeina ex hōn tynchanoi oysa, all’ hepesthai ekeinois kai oypot’ an hēgemoneyein; hōmologēsamen, ephē; pōs gar oy;
  ti oyn; nyn oy pan toynantion hēmin phainetai ergazomenē, hēgemoneyoysa te ekeinōn pantōn ex hōn phēsi tis aytēn einai,
  kai enantioymenē oligoy panta dia pantos toy bioy kai despozoysa pantas tropoys, ta men chalepōteron kolazoysa kai met’
  algēdonōn, ta te kata tēn gymnastikēn kai tēn iatrikēn, ta de praoteron, kai ta men apeiloysa, ta de noythetoysa, tais epithymiais
  kai orgais kai phobois hōs allē oysa allō pragmati dialegomenē; oion poy kai Homēros en Odysseia pepoiēken, oy legei ton
  Odyssea; stēthos de plēxas kradiēn ēnipape mythō; tetlathi dē, kradiē; kai kynteron allo pot etlēs. ar’ oiei ayton tayta
  poiēsai dianooymenon hōs harmonias aytēs oysēs kai oias agesthai hypo tōn toy sōmatos pathēmatōn, all’ oych oias agein te
  tayta kai despozein, kai oysēs aytēs poly theioteroy tinos pragmatos ē kath’ harmonian; nē Dia, ō Sōkrates, emoige dokei.
  PhAID. oyk ara, ō ariste, hēmin oydamē kalōs echei psychēn
translation_literal: 'Simmias proposes that the soul is like harmony: subtle, invisible, but dependent on bodily structure
  as harmony depends on strings. Socrates rejects this by showing that soul often governs and resists bodily impulses. What
  can command a system cannot be reduced to a byproduct of that same system.'
commentary: 'The claim is methodological: explanatory elegance is insufficient if it cannot account for lived agency. The
  harmony analogy is attractive because it preserves subtlety while remaining naturalistic. Socrates'' counterintuitive rebuttal
  is phenomenological rather than purely metaphysical: observe experience. We witness an ordering principle that can contradict
  appetitive momentum. If soul were only resultant balance, it could not issue commands against the conditions that generate
  it.


  This argument matters because it marks one of philosophy''s earliest high-level confrontations with reductionism. Socrates
  is not anti-body; he is anti-collapse. He refuses a model that explains away normativity, self-critique, and rational resistance.
  "I ought not" and "I refrain" become evidentiary data, not illusions to be discarded.


  Existentially, the passage offers a practical diagnostic: wherever there is genuine capacity to interrupt impulse and reorient
  action by reason, there is evidence of depth beyond mechanical sequence. Modern language might call this executive agency
  or reflective freedom; Plato calls it soul''s rulership. The point is the same: inner governance is real enough to ground
  responsibility. Without it, ethics becomes ornamental.


  Key Terms:


  **harmonia (ἁρμονία)** - fitting, concord, attunement -> Simmias uses it to explain soul as emergent order from bodily composition
  -> translating as only "harmony" can hide the ontological claim of dependence.


  **enantion (ἐναντίον)** - opposite, contrary -> central in Socrates'' refutation: soul can oppose bodily drives -> missing
  this logical role blunts the argument.


  **epithymia (ἐπιθυμία)** - appetite/desire -> the domain often resisted by rational soul in Plato''s account -> "desire"
  without structural place in psychic economy is too vague.


  **arche (ἀρχή)** - ruling principle/origin -> soul functions as governing arche, not merely derivative state -> reducing
  arche to temporal "beginning" misses normative force.'
insight: 'The claim is methodological: explanatory elegance is insufficient if it cannot account for lived agency.'
practice: When a strong impulse appears today, wait one full breath before acting and state aloud one reason for acting or
  not acting; then choose deliberately.
