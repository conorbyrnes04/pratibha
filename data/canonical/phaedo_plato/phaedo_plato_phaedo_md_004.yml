- kind: iast
  label: IAST
  body: kai ho Sōkratēs, isōs gar, ephē, ō hetaire, alēthē soi phainetai; alla lege hopē dē oych hikanōs. PhAID. taytē emoige,
    ē d’ hos, hē dē kai peri harmonias an tis kai lyras te kai chordōn ton ayton toyton logon eipoi, hōs hē men harmonia aoraton
    kai asōmaton kai pankalon ti kai theion estin en tē hērmosmenē lyra, aytē d’ hē lyra kai ai chordai sōmata te kai sōmatoeidē
    kai syntheta kai geōdē esti kai toy thnētoy syngenē. epeidan oyn ē kataxē tis tēn lyran ē diatemē kai diarrēxē tas chordas,
    ei tis diischyrizoito tō aytō logō hōsper sy, hōs anankē eti einai tēn harmonian ekeinēn kai mē apolōlenai — oydemia gar
    mēchanē an eiē tēn men lyran eti einai dierrōgyiōn tōn chordōn kai tas chordas thnētoeideis oysas, tēn de harmonian apolōlenai
    tēn toy theioy te kai athanatoy homophyē te kai syngenē, proteran toy thnētoy apolomenēn — alla phaiē anankē eti poy einai
    aytēn tēn harmonian, kai proteron ta xyla kai tas chordas katasapēsesthai prin ti ekeinēn pathein — kai gar oyn, ō Sōkrates,
    oimai egōge kai ayton se toyto entethymēsthai, hoti toioyton ti malista hypolambanomen tēn psychēn einai, hōsper entetamenoy
    toy sōmatos hēmōn kai synechomenoy hypo thermoy kai psychroy kai xēroy kai hygroy kai toioytōn tinōn, krasin einai kai
    harmonian aytōn toytōn tēn psychēn hēmōn, epeidan tayta kalōs kai metriōs krathē pros allēla — ei oyn tynchanei hē psychē
    oysa harmonia tis, dēlon hoti, hotan chalasthē to sōma hēmōn ametrōs ē epitathē hypo nosōn kai allōn kakōn, tēn men psychēn
    anankē eythys hyparchei apolōlenai, kaiper oysan theiotatēn, hōsper kai ai allai harmoniai ai t’ en tois phthongois kai
    en tois tōn dēmioyrgōn ergois pasi, ta de leipsana toy sōmatos hekastoy polyn chronon paramenein, heōs an ē katakaythē
    ē katasapē — hora oyn pros toyton ton logon ti phēsomen, ean tis axioi krasin oysan tēn psychēn tōn en tō sōmati en tō
    kaloymenō thanatō prōtēn apollysthai. diablepsas oyn ho Sōkratēs, hōsper ta polla eiōthei, kai meidiasas, dikaia mentoi,
    ephē, legei ho Simmias. ei oyn tis hymōn eyporōteros emoy, ti oyk apekrinato; kai gar oy phaylōs eoiken haptomenō toy
    logoy. dokei mentoi moi chrēnai pro tēs apokriseōs eti proteron kebētos akoysai … an tayta ho logos ei orthē hē hypothesis
    ēn, to psychēn harmonian einai; oyd’ hopōstioyn, ephē. ti de; ē d’ hos; tōn en anthrōpō pantōn esth’ hoti allo legeis
    archein ē psychēn allōs te kai phronimon; oyk egōge. poteron synchōroysan tois kata to sōma pathesin ē kai enantioymenēn;
    legō de to toionde, oion kaymatos enontos kai dipsoys epi toynantion helkein, to mē pinein, kai peinēs enoysēs epi to
    mē esthiein, kai alla myria poy horōmen enantioymenēn tēn psychēn tois kata to sōma; ē oy; pany men oyn. oykoyn ay hōmologēsamen
    en tois prosthen mēpot’ an aytēn, harmonian ge oysan, enantia adein ois epiteinoito kai chalōto kai psalloito kai allo
    hotioyn pathos paschoi ekeina ex hōn tynchanoi oysa, all’ hepesthai ekeinois kai oypot’ an hēgemoneyein; hōmologēsamen,
    ephē; pōs gar oy; ti oyn; nyn oy pan toynantion hēmin phainetai ergazomenē, hēgemoneyoysa te ekeinōn pantōn ex hōn phēsi
    tis aytēn einai, kai enantioymenē oligoy panta dia pantos toy bioy kai despozoysa pantas tropoys, ta men chalepōteron
    kolazoysa kai met’ algēdonōn, ta te kata tēn gymnastikēn kai tēn iatrikēn, ta de praoteron, kai ta men apeiloysa, ta de
    noythetoysa, tais epithymiais kai orgais kai phobois hōs allē oysa allō pragmati dialegomenē; oion poy kai Homēros en
    Odysseia pepoiēken, oy legei ton Odyssea; stēthos de plēxas kradiēn ēnipape mythō; tetlathi dē, kradiē; kai kynteron allo
    pot etlēs. ar’ oiei ayton tayta poiēsai dianooymenon hōs harmonias aytēs oysēs kai oias agesthai hypo tōn toy sōmatos
    pathēmatōn, all’ oych oias agein te tayta kai despozein, kai oysēs aytēs poly theioteroy tinos pragmatos ē kath’ harmonian;
    nē Dia, ō Sōkrates, emoige dokei. PhAID. oyk ara, ō ariste, hēmin oydamē kalōs echei psychēn
