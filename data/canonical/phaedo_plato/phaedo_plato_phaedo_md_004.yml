    καὶ δεσπόζειν, καὶ οὔσης αὐτῆς πολὺ θειοτέρου τινὸς πράγματος ἢ καθ’ ἁρμονίαν; νὴ Δία, ὦ Σώκρατες, ἔμοιγε δοκεῖ. ΦΑΙΔ.
    οὐκ ἄρα, ὦ ἄριστε, ἡμῖν οὐδαμῇ καλῶς ἔχει ψυχὴν
