- kind: translation
  label: Pratibha Translation
  body: 'Socrates grants the puzzle: if death can be better, why may one not take it for oneself? He answers with a whispered
    doctrine — we are prisoners who may not open the door — and with a clearer claim: the gods are our guardians and we are
    their possession. As one would be angry if livestock destroyed itself unbidden, so a person should wait for the divine
    summons. Cebes presses the reverse: if gods are good masters, why should the wise be willing to leave? The tension launches
    the dialogue''s defense of philosophical cheerfulness toward death.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that life is not private property. Suicide is refused not by sentimental vitalism but by an ontology
    of belonging: we are a possession (ktēma) of the gods who guard us. The counterintuitive edge is that philosophical willingness
    to die must still wait for summons — freedom is not license to force the exit. Cebes'' objection then opens the dialogue''s
    deeper work: if gods are good masters, why cheer at leaving? Socrates must later show that departure is to better company,
    not desertion. Existentially the passage cuts modern autonomy rhetoric: ask who you treat yourself as owned by — appetite,
    brand, panic — and whether your endings are summons or escapes. Waiting is not passivity; it is refusal to steal a departure
    the larger order has not yet authorized. The passage asks for recognition before consolation. The passage asks for recognition
    before consolation. The passage asks for recognition before consolation.


    Key Terms


    **ktēma / possession** — life as belonging, not self-disposal.


    **phrouroi / guardians** — gods as keepers; duty until release.


    **summons (keleuein)** — death as called departure, not self-authored escape.


    Cross-Tradition Resonances


    **Epictetus, *Discourses* 1.9 / *Enchiridion* 7:** Both treat exit as not merely personal preference.

    *Divergence:* Stoics emphasize cosmic citizenship and door-is-open; Socrates emphasizes waiting for God.


    **Bhagavad Gītā 2.27 / 18.59–60:** Both bind action to a larger order than whim.

    *Divergence:* Kṛṣṇa commands dharma-battle; Socrates refuses self-killing under divine guardianship.'
