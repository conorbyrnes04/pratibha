    ho nyndē elegomen eylogōs echei, to theon te einai ton epimeloymenon hēmōn kai hēmas ekeinoy ktēmata einai. to gar mē
    aganaktein toys phronimōtatoys ek taytēs tēs therapeias apiontas, en hē epistatoysin aytōn oiper aristoi eisin tōn ontōn
    epistatai, theoi, oyk echei logon; oy gar poy aytos ge aytoy oietai ameinon epimelēsesthai eleytheros genomenos. all’
    anoētos men anthrōpos tach’ an oiētheiē tayta, pheykteon einai apo toy despotoy, kai oyk an logizoito hoti oy dei apo
