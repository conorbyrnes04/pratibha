  Eyēnō. polla gar ēdē entetychēka tō andri; schedon oyn ex hōn egō ēsthēmai oyd’ hopōstioyn soi hekōn einai peisetai. ti
  de; ē d’ hos, oy philosophos Eyēnos; emoige dokei, ephē ho Simmias. ethelēsei toinyn kai Eyēnos kai pas hotō axiōs toytoy
  toy pragmatos metestin. oy mentoi isōs biasetai ayton; oy gar phasi themiton einai. kai hama legōn tayta kathēke ta skelē
  epi tēn gēn, kai kathezomenos oytōs ēdē ta loipa dielegeto. ēreto oyn ayton ho Kebēs; pōs toyto legeis, ō Sōkrates, to mē
  themiton einai heayton biazesthai, ethelein d’ an tō apothnēskonti ton philosophon hepesthai; ti de, ō Kebēs; oyk akēkoate
  sy te kai Simmias peri tōn toioytōn Philolaō syngegonotes; oyden ge saphes, ō Sōkrates. alla mēn kai egō ex akoēs peri aytōn
  legō; ha men oyn tynchanō akēkoōs phthonos oydeis legein. kai gar isōs kai malista prepei mellonta ekeise apodēmein diaskopein
  te kai mythologein peri tēs apodēmias tēs ekei, poian tina aytēn oiometha einai; ti gar an tis kai poioi allo en tō mechri
  hēlioy dysmōn chronō; kata ti dē oyn pote oy phasi themiton einai ayton heayton apokteinynai, ō Sōkrates; ēdē gar egōge,
  hoper nyndē sy ēroy, kai Philolaoy ēkoysa, hote par’ hēmin diētato, ēdē de kai allōn tinōn, hōs oy deoi toyto poiein; saphes
  de peri aytōn oydenos pōpote oyden akēkoa. PhAID. alla prothymeisthai chrē, ephē; tacha gar an kai akoysais. isōs mentoi
  thaymaston soi phaneitai ei toyto monon tōn allōn hapantōn haployn estin, kai oydepote tynchanei tō anthrōpō, hōsper kai
  talla, estin hote kai ois beltion on tethnanai ē zēn, ois de beltion tethnanai, thaymaston isōs soi phainetai ei toytois
  tois anthrōpois mē hosion aytoys heaytoys ey poiein, alla allon dei perimenein eyergetēn. kai ho Kebēs ērema epigelasas,
  Ittō Zeys, ephē, tē aytoy phōnē eipōn. kai gar an doxeien, ephē ho Sōkratēs, oytō g’ einai alogon; oy mentoi all’ isōs g’
  echei tina logon. ho men oyn en aporrētois legomenos peri aytōn logos, hōs en tini phroyra esmen oi anthrōpoi kai oy dei
  dē heayton ek taytēs lyein oyd’ apodidraskein, megas te tis moi phainetai kai oy rhadios diidein; oy mentoi alla tode ge
  moi dokei, ō Kebēs, ey legesthai, to theoys einai hēmōn toys epimeloymenoys kai hēmas toys anthrōpoys hen tōn ktēmatōn tois
  theois einai. ē soi oy dokei oytōs; emoige, phēsin ho Kebēs. oykoyn, ē d’ hos, kai sy an tōn saytoy ktēmatōn ei ti ayto
  heayto apokteinyoi, mē sēmēnantos soy hoti boylei ayto tethnanai, chalepainois an aytō kai, ei tina echois timōrian, timōroio
  an; pany g, ephē. isōs toinyn taytē oyk alogon mē proteron ayton apokteinynai dein, prin anankēn tina theos epipempsē, hōsper
  kai tēn nyn hēmin paroysan. all’ eikos, ephē ho Kebēs, toyto ge phainetai. ho mentoi nyndē eleges, to toys philosophoys
  rhadiōs an ethelein apothnēskein, eoiken toyto, ō Sōkrates, atopō, eiper ho nyndē elegomen eylogōs echei, to theon te einai
  ton epimeloymenon hēmōn kai hēmas ekeinoy ktēmata einai. to gar mē aganaktein toys phronimōtatoys ek taytēs tēs therapeias
  apiontas, en hē epistatoysin aytōn oiper aristoi eisin tōn ontōn epistatai, theoi, oyk echei logon; oy gar poy aytos ge
  aytoy oietai ameinon epimelēsesthai eleytheros genomenos. all’ anoētos men anthrōpos tach’ an oiētheiē tayta, pheykteon
  einai apo toy despotoy, kai oyk an logizoito hoti oy dei apo ge toy agathoy pheygein all’ hoti malista paramenein, dio alogistōs
  an pheygoi; ho de noyn echōn epithymoi poy an aei einai para tō aytoy beltioni. kaitoi oytōs, ō Sōkrates, toynantion einai
  eikos ē ho nyndē elegeto; toys men gar phronimoys aganaktein apothnēskontas prepei, toys de aphronas chairein. PhAID. akoysas
  oyn ho Sōkratēs hēsthēnai te moi edoxe tē toy
translation_literal: 'Socrates grants the puzzle: if death can be better, why may one not take it for oneself? He answers
  with a whispered doctrine — we are prisoners who may not open the door — and with a clearer claim: the gods are our guardians
  and we are their possession. As one would be angry if livestock destroyed itself unbidden, so a person should wait for the
  divine summons. Cebes presses the reverse: if gods are good masters, why should the wise be willing to leave? The tension
  launches the dialogue''s defense of philosophical cheerfulness toward death.'
commentary: 'The claim is that life is not private property. Suicide is refused not by sentimental vitalism but by an ontology
  of belonging: we are a possession (ktēma) of the gods who guard us. The counterintuitive edge is that philosophical willingness
  to die must still wait for summons — freedom is not license to force the exit. Cebes'' objection then opens the dialogue''s
  deeper work: if gods are good masters, why cheer at leaving? Socrates must later show that departure is to better company,
  not desertion. Existentially the passage cuts modern autonomy rhetoric: ask who you treat yourself as owned by — appetite,
  brand, panic — and whether your endings are summons or escapes. Waiting is not passivity; it is refusal to steal a departure
  the larger order has not yet authorized. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation.


  Key Terms


  **ktēma / possession** — life as belonging, not self-disposal.


  **phrouroi / guardians** — gods as keepers; duty until release.


  **summons (keleuein)** — death as called departure, not self-authored escape.


  Cross-Tradition Resonances


  **Epictetus, *Discourses* 1.9 / *Enchiridion* 7:** Both treat exit as not merely personal preference.

  *Divergence:* Stoics emphasize cosmic citizenship and door-is-open; Socrates emphasizes waiting for God.


  **Bhagavad Gītā 2.27 / 18.59–60:** Both bind action to a larger order than whim.

  *Divergence:* Kṛṣṇa commands dharma-battle; Socrates refuses self-killing under divine guardianship.'
insight: The claim is that life is not private property.
practice: 'When you next want to force an ending (conversation, job, relationship), pause and ask: summons or escape? Act
  only if it is summons.'
