    tō anthrōpō, hōsper kai talla, estin hote kai ois beltion on tethnanai ē zēn, ois de beltion tethnanai, thaymaston isōs
    soi phainetai ei toytois tois anthrōpois mē hosion aytoys heaytoys ey poiein, alla allon dei perimenein eyergetēn. kai
    ho Kebēs ērema epigelasas, Ittō Zeys, ephē, tē aytoy phōnē eipōn. kai gar an doxeien, ephē ho Sōkratēs, oytō g’ einai
    alogon; oy mentoi all’ isōs g’ echei tina logon. ho men oyn en aporrētois legomenos peri aytōn logos, hōs en tini phroyra
    esmen oi anthrōpoi kai oy dei dē heayton ek taytēs lyein oyd’ apodidraskein, megas te tis moi phainetai kai oy rhadios
    diidein; oy mentoi alla tode ge moi dokei, ō Kebēs, ey legesthai, to theoys einai hēmōn toys epimeloymenoys kai hēmas
    toys anthrōpoys hen tōn ktēmatōn tois theois einai. ē soi oy dokei oytōs; emoige, phēsin ho Kebēs. oykoyn, ē d’ hos, kai
    sy an tōn saytoy ktēmatōn ei ti ayto heayto apokteinyoi, mē sēmēnantos soy hoti boylei ayto tethnanai, chalepainois an
    aytō kai, ei tina echois timōrian, timōroio an; pany g, ephē. isōs toinyn taytē oyk alogon mē proteron ayton apokteinynai
    dein, prin anankēn tina theos epipempsē, hōsper kai tēn nyn hēmin paroysan. all’ eikos, ephē ho Kebēs, toyto ge phainetai.
