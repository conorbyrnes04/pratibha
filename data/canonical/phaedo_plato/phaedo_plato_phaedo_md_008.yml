sanskrit_devanagari: ἄπειμι δέ, ὡς ἔοικε, τήμερον· κελεύουσι γὰρ Ἀθηναῖοι. καὶ ὁ Σιμμίας, οἷον παρακελεύῃ, ἔφη, τοῦτο, ὦ Σώκρατες,
  Εὐήνῳ. πολλὰ γὰρ ἤδη ἐντετύχηκα τῷ ἀνδρί· σχεδὸν οὖν ἐξ ὧν ἐγὼ ᾔσθημαι οὐδ’ ὁπωστιοῦν σοι ἑκὼν εἶναι πείσεται. τί δέ; ἦ
  δ’ ὅς, οὐ φιλόσοφος Εὔηνος; ἔμοιγε δοκεῖ, ἔφη ὁ Σιμμίας. ἐθελήσει τοίνυν καὶ Εὔηνος καὶ πᾶς ὅτῳ ἀξίως τούτου τοῦ πράγματος
  μέτεστιν. οὐ μέντοι ἴσως βιάσεται αὑτόν· οὐ γάρ φασι θεμιτὸν εἶναι. καὶ ἅμα λέγων ταῦτα καθῆκε τὰ σκέλη ἐπὶ τὴν γῆν, καὶ
  καθεζόμενος οὕτως ἤδη τὰ λοιπὰ διελέγετο. ἤρετο οὖν αὐτὸν ὁ Κέβης· πῶς τοῦτο λέγεις, ὦ Σώκρατες, τὸ μὴ θεμιτὸν εἶναι ἑαυτὸν
  βιάζεσθαι, ἐθέλειν δ’ ἂν τῷ ἀποθνῄσκοντι τὸν φιλόσοφον ἕπεσθαι; τί δέ, ὦ Κέβης; οὐκ ἀκηκόατε σύ τε καὶ Σιμμίας περὶ τῶν
  τοιούτων Φιλολάῳ συγγεγονότες; οὐδέν γε σαφές, ὦ Σώκρατες. ἀλλὰ μὴν καὶ ἐγὼ ἐξ ἀκοῆς περὶ αὐτῶν λέγω· ἃ μὲν οὖν τυγχάνω
  ἀκηκοὼς φθόνος οὐδεὶς λέγειν. καὶ γὰρ ἴσως καὶ μάλιστα πρέπει μέλλοντα ἐκεῖσε ἀποδημεῖν διασκοπεῖν τε καὶ μυθολογεῖν περὶ
  τῆς ἀποδημίας τῆς ἐκεῖ, ποίαν τινὰ αὐτὴν οἰόμεθα εἶναι· τί γὰρ ἄν τις καὶ ποιοῖ ἄλλο ἐν τῷ μέχρι ἡλίου δυσμῶν χρόνῳ; κατὰ
  τί δὴ οὖν ποτε οὔ φασι θεμιτὸν εἶναι αὐτὸν ἑαυτὸν ἀποκτεινύναι, ὦ Σώκρατες; ἤδη γὰρ ἔγωγε, ὅπερ νυνδὴ σὺ ἤρου, καὶ Φιλολάου
  ἤκουσα, ὅτε παρ’ ἡμῖν διῃτᾶτο, ἤδη δὲ καὶ ἄλλων τινῶν, ὡς οὐ δέοι τοῦτο ποιεῖν· σαφὲς δὲ περὶ αὐτῶν οὐδενὸς πώποτε οὐδὲν
  ἀκήκοα. ΦΑΙΔ. ἀλλὰ προθυμεῖσθαι χρή, ἔφη· τάχα γὰρ ἂν καὶ ἀκούσαις. ἴσως μέντοι θαυμαστόν σοι φανεῖται εἰ τοῦτο μόνον τῶν
  ἄλλων ἁπάντων ἁπλοῦν ἐστιν, καὶ οὐδέποτε τυγχάνει τῷ ἀνθρώπῳ, ὥσπερ καὶ τἆλλα, ἔστιν ὅτε καὶ οἷς βέλτιον ὂν τεθνάναι ἢ ζῆν,
  οἷς δὲ βέλτιον τεθνάναι, θαυμαστὸν ἴσως σοι φαίνεται εἰ τούτοις τοῖς ἀνθρώποις μὴ ὅσιον αὐτοὺς ἑαυτοὺς εὖ ποιεῖν, ἀλλὰ ἄλλον
  δεῖ περιμένειν εὐεργέτην. καὶ ὁ Κέβης ἠρέμα ἐπιγελάσας, Ἴττω Ζεύς, ἔφη, τῇ αὑτοῦ φωνῇ εἰπών. καὶ γὰρ ἂν δόξειεν, ἔφη ὁ Σωκράτης,
  οὕτω γ’ εἶναι ἄλογον· οὐ μέντοι ἀλλ’ ἴσως γ’ ἔχει τινὰ λόγον. ὁ μὲν οὖν ἐν ἀπορρήτοις λεγόμενος περὶ αὐτῶν λόγος, ὡς ἔν
  τινι φρουρᾷ ἐσμεν οἱ ἄνθρωποι καὶ οὐ δεῖ δὴ ἑαυτὸν ἐκ ταύτης λύειν οὐδ’ ἀποδιδράσκειν, μέγας τέ τίς μοι φαίνεται καὶ οὐ
  ῥᾴδιος διιδεῖν· οὐ μέντοι ἀλλὰ τόδε γέ μοι δοκεῖ, ὦ Κέβης, εὖ λέγεσθαι, τὸ θεοὺς εἶναι ἡμῶν τοὺς ἐπιμελουμένους καὶ ἡμᾶς
  τοὺς ἀνθρώπους ἓν τῶν κτημάτων τοῖς θεοῖς εἶναι. ἢ σοὶ οὐ δοκεῖ οὕτως; ἔμοιγε, φησὶν ὁ Κέβης. οὐκοῦν, ἦ δ’ ὅς, καὶ σὺ ἂν
  τῶν σαυτοῦ κτημάτων εἴ τι αὐτὸ ἑαυτὸ ἀποκτεινύοι, μὴ σημήναντός σου ὅτι βούλει αὐτὸ τεθνάναι, χαλεπαίνοις ἂν αὐτῷ καί, εἴ
  τινα ἔχοις τιμωρίαν, τιμωροῖο ἄν; πάνυ γ᾽, ἔφη. ἴσως τοίνυν ταύτῃ οὐκ ἄλογον μὴ πρότερον αὑτὸν ἀποκτεινύναι δεῖν, πρὶν ἀνάγκην
  τινὰ θεὸς ἐπιπέμψῃ, ὥσπερ καὶ τὴν νῦν ἡμῖν παροῦσαν. ἀλλ’ εἰκός, ἔφη ὁ Κέβης, τοῦτό γε φαίνεται. ὃ μέντοι νυνδὴ ἔλεγες,
  τὸ τοὺς φιλοσόφους ῥᾳδίως ἂν ἐθέλειν ἀποθνῄσκειν, ἔοικεν τοῦτο, ὦ Σώκρατες, ἀτόπῳ, εἴπερ ὃ νυνδὴ ἐλέγομεν εὐλόγως ἔχει,
  τὸ θεόν τε εἶναι τὸν ἐπιμελούμενον ἡμῶν καὶ ἡμᾶς ἐκείνου κτήματα εἶναι. τὸ γὰρ μὴ ἀγανακτεῖν τοὺς φρονιμωτάτους ἐκ ταύτης
  τῆς θεραπείας ἀπιόντας, ἐν ᾗ ἐπιστατοῦσιν αὐτῶν οἵπερ ἄριστοί εἰσιν τῶν ὄντων ἐπιστάται, θεοί, οὐκ ἔχει λόγον· οὐ γάρ που
  αὐτός γε αὑτοῦ οἴεται ἄμεινον ἐπιμελήσεσθαι ἐλεύθερος γενόμενος. ἀλλ’ ἀνόητος μὲν ἄνθρωπος τάχ’ ἂν οἰηθείη ταῦτα, φευκτέον
  εἶναι ἀπὸ τοῦ δεσπότου, καὶ οὐκ ἂν λογίζοιτο ὅτι οὐ δεῖ ἀπό γε τοῦ ἀγαθοῦ φεύγειν ἀλλ’ ὅτι μάλιστα παραμένειν, διὸ ἀλογίστως
  ἂν φεύγοι· ὁ δὲ νοῦν ἔχων ἐπιθυμοῖ που ἂν ἀεὶ εἶναι παρὰ τῷ αὑτοῦ βελτίονι. καίτοι οὕτως, ὦ Σώκρατες, τοὐναντίον εἶναι εἰκὸς
  ἢ ὃ νυνδὴ ἐλέγετο· τοὺς μὲν γὰρ φρονίμους ἀγανακτεῖν ἀποθνῄσκοντας πρέπει, τοὺς δὲ ἄφρονας χαίρειν. ΦΑΙΔ. ἀκούσας οὖν ὁ
  Σωκράτης ἡσθῆναί τέ μοι ἔδοξε τῇ τοῦ
