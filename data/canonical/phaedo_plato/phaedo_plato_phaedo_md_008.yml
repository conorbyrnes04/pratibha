unit_label: A Possession of the Gods
title: A Possession of the Gods
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Greek not line-aligned in this pass; body follows Jowett.'
sanskrit_iast: Not applicable (Greek). Key terms in commentary.
translation_literal: 'Socrates grants the puzzle: if death can be better, why may one not take it for oneself? He answers
  with a whispered doctrine — we are prisoners who may not open the door — and with a clearer claim: the gods are our guardians
  and we are their possession. As one would be angry if livestock destroyed itself unbidden, so a person should wait for the
  divine summons. Cebes presses the reverse: if gods are good masters, why should the wise be willing to leave? The tension
  launches the dialogue''s defense of philosophical cheerfulness toward death.'
commentary: 'The claim is that life is not private property. Suicide is refused not by sentimental vitalism but by an ontology
  of belonging: we are a possession (ktēma) of the gods who guard us. The counterintuitive edge is that philosophical willingness
  to die must still wait for summons — freedom is not license to force the exit. Cebes'' objection then opens the dialogue''s
  deeper work: if gods are good masters, why cheer at leaving? Socrates must later show that departure is to better company,
  not desertion. Existentially the passage cuts modern autonomy rhetoric: ask who you treat yourself as owned by — appetite,
  brand, panic — and whether your endings are summons or escapes. Waiting is not passivity; it is refusal to steal a departure
  the larger order has not yet authorized. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation.


  Key Terms


  **φρουρά** — A guard-post or confinement, evoking human life as a divinely supervised custody.

  **κτῆμα** — A possession or piece of property, grounding the claim that humans belong to the gods.

  **θεοί** — The gods as guardians and owners whose authority limits self-chosen death.


  Cross-Tradition Resonances


  **Cicero, Somnium Scipionis 3.7:** Scipio is told that humans must not depart earthly life without the command of the god
  who assigned them their station, closely paralleling Socrates'' ban on self-dismissal.

  **Cicero, Somnium Scipionis 3.7:**  Divergence: Cicero frames this chiefly as service to the civic and cosmic order rather
  than as imprisonment and divine possession.

  **1 Corinthians 6:19–20:** Paul says believers are not their own because they have been bought at a price, echoing the Platonic
  thought that a human life is not private property.'
insight: The claim is that life is not private property.
practice: 'When you next want to force an ending (conversation, job, relationship), pause and ask: summons or escape? Act
  only if it is summons.'
