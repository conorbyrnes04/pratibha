  body: kai kat’ ekeinon ge ton logon, ō Sōkrates, ei alēthēs estin, hon sy eiōthas thama legein, hoti hēmin hē mathēsis oyk
    allo ti ē anamnēsis tynchanei oysa, kai kata toyton anankē poy hēmas en proterō tini chronō memathēkenai ha nyn anamimnēskometha.
    PhAID. toyto de adynaton, ei mē ēn poy hēmin hē psychē prin en tōde tō anthrōpinō eidei genesthai; hōste kai taytē athanaton
    hē psychē ti eoiken einai. alla, ō Kebēs, ephē ho Simmias hypolabōn, poiai toytōn ai apodeixeis; hypomnēson me; oy gar
    sphodra en tō paronti memnēmai. heni men logō, ephē ho Kebēs, kallistō, hoti erōtōmenoi oi anthrōpoi, ean tis kalōs erōta,
    aytoi legoysin panta hē echei — kaitoi ei mē etynchanen aytois epistēmē enoysa kai orthos logos, oyk an oioi t’ ēsan toyto
    poiēsai — epeita ean tis epi ta diagrammata agē ē allo ti tōn toioytōn, entaytha saphestata katēgorei hoti toyto oytōs
    echei. ei de mē taytē ge, ephē, peithē, ō Simmia, ho Sōkratēs, skepsai an tēde pē soi skopoymenō syndoxē. apisteis gar
    dē pōs hē kaloymenē mathēsis anamnēsis estin; apistō men soi egōge, ē d’ hos ho Simmias, oy, ayto de toyto, ephē, deomai
    pathein peri oy ho logos, anamnēsthēnai. kai schedon ge ex hōn Kebēs epecheirēse legein ēdē memnēmai kai peithomai; oyden
    mentan hētton akoyoimi nyn pē sy epecheirēsas legein. tēd’ egōge, ē d’ hos. homologoymen gar dēpoy, ei tis ti anamnēsthēsetai,
    dein ayton toyto proteron pote epistasthai. pany g, ephē. ar’ oyn kai tode homologoymen, hotan epistēmē paragignētai tropō
    toioytō, anamnēsin einai; legō de tina tropon; tonde. ean tis ti heteron ē idōn ē akoysas ē tina allēn aisthēsin labōn
    mē monon ekeino gnō, alla kai heteron ennoēsē oy mē hē aytē epistēmē all’ allē, ara oychi toyto dikaiōs legomen hoti anemnēsthē,
    oy tēn ennoian elaben; pōs legeis; oion ta toiade; allē poy epistēmē anthrōpoy kai lyras. pōs gar oy; oykoyn oistha hoti
    oi erastai, hotan idōsin lyran ē himation ē allo ti ois ta paidika aytōn eiōthe chrēsthai, paschoysi toyto; egnōsan te
    tēn lyran kai en tē dianoia elabon to eidos toy paidos oy ēn hē lyra; toyto de estin anamnēsis; hōsper ge kai Simmian
    tis idōn pollakis kebētos anemnēsthē, kai alla poy myria toiayt’ an eiē. myria mentoi nē Dia, ephē ho Simmias. oykoyn,
    ē d’ hos, to toioyton anamnēsis tis esti; malista mentoi hotan tis toyto pathē peri ekeina ha hypo chronoy kai toy mē
    episkopein ēdē epelelēsto; pany men oyn, ephē. ti de; ē d’ hos; estin hippon gegrammenon idonta kai lyran gegrammenēn
    anthrōpoy anamnēsthēnai, kai Simmian idonta gegrammenon kebētos anamnēsthēnai; pany ge. PhAID. oykoyn kai Simmian idonta
    gegrammenon aytoy Simmioy anamnēsthēnai; esti mentoi, ephē. ar’ oyn oy kata panta tayta symbainei tēn anamnēsin einai
    men aph’ homoiōn, einai de kai apo anomoiōn; symbainei. all’ hotan ge apo tōn homoiōn anamimnēskētai tis ti, ar’ oyk anankaion
    tode prospaschein, ennoein eite ti elleipei toyto kata tēn homoiotēta eite mē ekeinoy oy anemnēsthē; anankē, ephē. skopei
    dē, ē d’ hos, ei tayta oytōs echei. phamen poy ti einai ison, oy xylon legō xylō oyde lithon lithō oyd allo tōn toioytōn
    oyden, alla para tayta panta heteron ti, ayto to ison; phōmen ti einai ē mēden; phōmen mentoi nē Di, ephē ho Simmias,
    thaymastōs ge. ē kai epistametha ayto ho estin; pany ge, ē d’ hos. pothen labontes aytoy tēn epistēmēn; ar’ oyk ex hōn
    nyndē elegomen, ē xyla ē lithoys ē alla atta idontes isa, ek toytōn ekeino enenoēsamen, heteron on toytōn; ē oych heteron
    soi phainetai; skopei de kai tēde. ar’ oy lithoi men isoi kai xyla eniote tayta onta tō men isa phainetai, tō d’ oy; pany
    men oyn. ti de; ayta ta isa estin hote anisa soi ephanē, ē hē isotēs anisotēs; oydepōpote ge, ō Sōkrates. oy tayton ara
    estin, ē d’ hos, tayta te ta isa kai ayto to ison. oydamōs moi phainetai, ō Sōkrates. alla mēn ek toytōn g, ephē, tōn
    isōn, heterōn ontōn ekeinoy toy isoy, homōs aytoy tēn epistēmēn ennenoēkas te kai eilēphas; alēthestata, ephē, legeis.
    oykoyn ē homoioy ontos toytois ē anomoioy; pany ge. diapherei de ge, ē d’ hos, oyden; heōs an allo idōn apo taytēs tēs
    opseōs allo ennoēsēs, eite homoion eite anomoion, anankaion, ephē, ayto anamnēsin gegonenai. pany men oyn. ti de; ē d’
    hos; ē paschomen ti toioyton peri ta en tois xylois te kai ois nyndē elegomen tois isois; ara phainetai hēmin oytōs isa
    einai hōsper ayto to ho estin, ē endei ti ekeinoy tō toioyton einai oion to ison, ē oyden; kai poly ge, ephē, endei. oykoyn
    homologoymen, hotan tis ti idōn ennoēsē hoti boyletai men toyto ho nyn egō horō einai oion allo ti tōn ontōn, endei de
    kai oy dynatai toioyton einai ison oion ekeino, all’ estin phayloteron, anankaion poy ton toyto ennooynta tychein proeidota
    ekeino hō phēsin ayto proseoikenai men, endeesterōs de echein; anankē. ti oyn; to toioyton peponthamen kai hēmeis ē oy
    peri te ta isa kai ayto to ison; pantapasi ge. PhAID. anankaion ara hēmas proeidenai to ison pro ekeinoy toy chronoy hote
    to prōton idontes ta isa enenoēsamen hoti oregetai men panta tayta einai oion to ison, echei de endeesterōs. esti tayta.
    alla mēn kai tode homologoymen, mē allothen ayto ennenoēkenai mēde dynaton einai ennoēsai all’ ē ek toy idein ē hapsasthai
    ē ek tinos allēs tōn aisthēseōn; tayton de panta tayta legō. tayton gar estin, ō Sōkrates, pros ge ho boyletai dēlōsai
    ho logos. alla men dē ek ge tōn aisthēseōn dei ennoēsai hoti panta ta en tais aisthēsesin ekeinoy te oregetai toy ho estin
    ison, kai aytoy endeestera estin; ē pōs legomen; oytōs. pro toy ara arxasthai hēmas horan kai akoyein kai talla aisthanesthai
    tychein edei poy eilēphotas epistēmēn aytoy toy isoy hoti estin, ei emellomen ta ek tōn aisthēseōn isa ekeise anoisein,
    hoti prothymeitai men panta toiayt’ einai oion ekeino, estin de aytoy phaylotera. anankē ek tōn proeirēmenōn, ō Sōkrates.
    oykoyn genomenoi eythys heōrōmen te kai ēkoyomen kai tas allas aisthēseis eichomen; pany ge. edei de ge, phamen, pro toytōn
    tēn toy isoy epistēmēn eilēphenai; nai. prin genesthai ara, hōs eoiken, anankē hēmin aytēn eilēphenai. eoiken. oykoyn
    ei men labontes aytēn pro toy genesthai echontes egenometha, ēpistametha kai prin genesthai kai eythys genomenoi oy monon
    to ison kai to meizon kai to elatton alla kai sympanta ta toiayta; oy gar peri toy isoy nyn ho logos hēmin mallon ti ē
    kai peri aytoy toy kaloy kai aytoy toy agathoy kai dikaioy kai hosioy kai, hoper legō, peri hapantōn ois episphragizometha
    to ayto ho esti kai en tais erōtēsesin erōtōntes kai en tais apokrisesin apokrinomenoi. hōste anankaion hēmin toytōn pantōn
    tas epistēmas pro toy genesthai eilēphenai. esti tayta. kai ei men ge labontes hekastote mē epilelēsmetha, eidotas aei
    gignesthai kai aei dia bioy eidenai; to gar eidenai toyt’ estin, labonta toy epistēmēn echein kai mē apolōlekenai; ē oy
    toyto lēthēn legomen, ō Simmia, epistēmēs apobolēn; pantōs dēpoy, ephē, ō Sōkrates. ei de ge oimai labontes prin genesthai
    gignomenoi apōlesamen, hysteron de tais aisthēsesi chrōmenoi peri ayta ekeinas analambanomen tas epistēmas has pote kai
    prin eichomen, ar’ oych ho kaloymen manthanein oikeian an epistēmēn analambanein eiē; toyto de poy anamimnēskesthai legontes
    orthōs an legoimen; pany ge. PhAID.
