- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Meno 81c-86c
    resonance: 'Structural continuity: questioning draws out latent intelligibility rather than depositing content from outside.'
    divergence: '*Meno* demonstrates by geometrical elicitation; *Phaedo* connects the same structure to immortality and the
      Forms.'
    passage_id: ''
  - citation: Augustine, De Magistro 11-12
    resonance: Both suggest that true teaching awakens an inner recognition rather than transferring substance mechanically.
    divergence: Augustine grounds the "inner teacher" in Christic illumination; Plato grounds recollection in pre-existent
      soul and Forms.
    passage_id: ''
  - citation: Yoga Sutra 1.48-1.49
    resonance: Both distinguish direct, higher-order knowing from inferential accumulation.
    divergence: Patanjali's frame is yogic-cognitive purification; Plato's is dialectical-metaphysical argument.
