      the biologist’s sense'
    lemma_id: nous
  - term: meletē thanatou
    definition: '‘practice/rehearsal of death’ → philosophy as training to loosen identity with the perishable Here: The practical
      test is not novelty but coherence: does a claim illuminate what experience was already straining to say? In that sense,
      recollection remains a li… Trap: morbid death-obsession'
  - term: phronēsis (φρόνησις)
    definition: '‘practical/intellectual wisdom’ → wisdom that sees Forms and orders life toward them Here: If all knowing
      were assembled only from sensory fragments, there would be no vantage point from which to call any fragment "insufficient.
      Trap: mere cleverness'
    lemma_id: nous
  - term: psychē (ψυχή)
    definition: '‘soul, life-principle’ → immortal knowing principle separable in practice from body Here: Metaphysically,
      it supports soul-precedence. Trap: Cartesian ghost; modern psychology'
    lemma_id: psyche
    sense_id: 1.5
