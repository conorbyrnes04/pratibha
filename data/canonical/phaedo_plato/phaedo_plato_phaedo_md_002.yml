  body: καὶ κατ’ ἐκεῖνόν γε τὸν λόγον, ὦ Σώκρατες, εἰ ἀληθής ἐστιν, ὃν σὺ εἴωθας θαμὰ λέγειν, ὅτι ἡμῖν ἡ μάθησις οὐκ ἄλλο
    τι ἢ ἀνάμνησις τυγχάνει οὖσα, καὶ κατὰ τοῦτον ἀνάγκη που ἡμᾶς ἐν προτέρῳ τινὶ χρόνῳ μεμαθηκέναι ἃ νῦν ἀναμιμνῃσκόμεθα.
    ΦΑΙΔ. τοῦτο δὲ ἀδύνατον, εἰ μὴ ἦν που ἡμῖν ἡ ψυχὴ πρὶν ἐν τῷδε τῷ ἀνθρωπίνῳ εἴδει γενέσθαι· ὥστε καὶ ταύτῃ ἀθάνατον ἡ
    ψυχή τι ἔοικεν εἶναι. ἀλλά, ὦ Κέβης, ἔφη ὁ Σιμμίας ὑπολαβών, ποῖαι τούτων αἱ ἀποδείξεις; ὑπόμνησόν με· οὐ γὰρ σφόδρα ἐν
    τῷ παρόντι μέμνημαι. ἑνὶ μὲν λόγῳ, ἔφη ὁ Κέβης, καλλίστῳ, ὅτι ἐρωτώμενοι οἱ ἄνθρωποι, ἐάν τις καλῶς ἐρωτᾷ, αὐτοὶ λέγουσιν
    πάντα ᾗ ἔχει — καίτοι εἰ μὴ ἐτύγχανεν αὐτοῖς ἐπιστήμη ἐνοῦσα καὶ ὀρθὸς λόγος, οὐκ ἂν οἷοί τ’ ἦσαν τοῦτο ποιῆσαι — ἔπειτα
    ἐάν τις ἐπὶ τὰ διαγράμματα ἄγῃ ἢ ἄλλο τι τῶν τοιούτων, ἐνταῦθα σαφέστατα κατηγορεῖ ὅτι τοῦτο οὕτως ἔχει. εἰ δὲ μὴ ταύτῃ
    γε, ἔφη, πείθῃ, ὦ Σιμμία, ὁ Σωκράτης, σκέψαι ἂν τῇδέ πῄ σοι σκοπουμένῳ συνδόξῃ. ἀπιστεῖς γὰρ δὴ πῶς ἡ καλουμένη μάθησις
    ἀνάμνησίς ἐστιν; ἀπιστῶ μέν σοι ἔγωγε, ἦ δ’ ὃς ὁ Σιμμίας, οὔ, αὐτὸ δὲ τοῦτο, ἔφη, δέομαι παθεῖν περὶ οὗ ὁ λόγος, ἀναμνησθῆναι.
    καὶ σχεδόν γε ἐξ ὧν Κέβης ἐπεχείρησε λέγειν ἤδη μέμνημαι καὶ πείθομαι· οὐδὲν μεντἂν ἧττον ἀκούοιμι νῦν πῇ σὺ ἐπεχείρησας
    λέγειν. τῇδ’ ἔγωγε, ἦ δ’ ὅς. ὁμολογοῦμεν γὰρ δήπου, εἴ τίς τι ἀναμνησθήσεται, δεῖν αὐτὸν τοῦτο πρότερόν ποτε ἐπίστασθαι.
    πάνυ γ᾽, ἔφη. ἆρ’ οὖν καὶ τόδε ὁμολογοῦμεν, ὅταν ἐπιστήμη παραγίγνηται τρόπῳ τοιούτῳ, ἀνάμνησιν εἶναι; λέγω δὲ τίνα τρόπον;
    τόνδε. ἐάν τίς τι ἕτερον ἢ ἰδὼν ἢ ἀκούσας ἤ τινα ἄλλην αἴσθησιν λαβὼν μὴ μόνον ἐκεῖνο γνῷ, ἀλλὰ καὶ ἕτερον ἐννοήσῃ οὗ
    μὴ ἡ αὐτὴ ἐπιστήμη ἀλλ’ ἄλλη, ἆρα οὐχὶ τοῦτο δικαίως λέγομεν ὅτι ἀνεμνήσθη, οὗ τὴν ἔννοιαν ἔλαβεν; πῶς λέγεις; οἷον τὰ
    τοιάδε· ἄλλη που ἐπιστήμη ἀνθρώπου καὶ λύρας. πῶς γὰρ οὔ; οὐκοῦν οἶσθα ὅτι οἱ ἐρασταί, ὅταν ἴδωσιν λύραν ἢ ἱμάτιον ἢ ἄλλο
    τι οἷς τὰ παιδικὰ αὐτῶν εἴωθε χρῆσθαι, πάσχουσι τοῦτο· ἔγνωσάν τε τὴν λύραν καὶ ἐν τῇ διανοίᾳ ἔλαβον τὸ εἶδος τοῦ παιδὸς
    οὗ ἦν ἡ λύρα; τοῦτο δέ ἐστιν ἀνάμνησις· ὥσπερ γε καὶ Σιμμίαν τις ἰδὼν πολλάκις κέβητος ἀνεμνήσθη, καὶ ἄλλα που μυρία τοιαῦτ’
    ἂν εἴη. μυρία μέντοι νὴ Δία, ἔφη ὁ Σιμμίας. οὐκοῦν, ἦ δ’ ὅς, τὸ τοιοῦτον ἀνάμνησίς τίς ἐστι; μάλιστα μέντοι ὅταν τις τοῦτο
    πάθῃ περὶ ἐκεῖνα ἃ ὑπὸ χρόνου καὶ τοῦ μὴ ἐπισκοπεῖν ἤδη ἐπελέληστο; πάνυ μὲν οὖν, ἔφη. τί δέ; ἦ δ’ ὅς· ἔστιν ἵππον γεγραμμένον
    ἰδόντα καὶ λύραν γεγραμμένην ἀνθρώπου ἀναμνησθῆναι, καὶ Σιμμίαν ἰδόντα γεγραμμένον κέβητος ἀναμνησθῆναι; πάνυ γε. ΦΑΙΔ.
    οὐκοῦν καὶ Σιμμίαν ἰδόντα γεγραμμένον αὐτοῦ Σιμμίου ἀναμνησθῆναι; ἔστι μέντοι, ἔφη. ἆρ’ οὖν οὐ κατὰ πάντα ταῦτα συμβαίνει
    τὴν ἀνάμνησιν εἶναι μὲν ἀφ’ ὁμοίων, εἶναι δὲ καὶ ἀπὸ ἀνομοίων; συμβαίνει. ἀλλ’ ὅταν γε ἀπὸ τῶν ὁμοίων ἀναμιμνῄσκηταί τίς
    τι, ἆρ’ οὐκ ἀναγκαῖον τόδε προσπάσχειν, ἐννοεῖν εἴτε τι ἐλλείπει τοῦτο κατὰ τὴν ὁμοιότητα εἴτε μὴ ἐκείνου οὗ ἀνεμνήσθη;
    ἀνάγκη, ἔφη. σκόπει δή, ἦ δ’ ὅς, εἰ ταῦτα οὕτως ἔχει. φαμέν πού τι εἶναι ἴσον, οὐ ξύλον λέγω ξύλῳ οὐδὲ λίθον λίθῳ οὐδ᾽
    ἄλλο τῶν τοιούτων οὐδέν, ἀλλὰ παρὰ ταῦτα πάντα ἕτερόν τι, αὐτὸ τὸ ἴσον· φῶμέν τι εἶναι ἢ μηδέν; φῶμεν μέντοι νὴ Δί᾽, ἔφη
    ὁ Σιμμίας, θαυμαστῶς γε. ἦ καὶ ἐπιστάμεθα αὐτὸ ὃ ἔστιν; πάνυ γε, ἦ δ’ ὅς. πόθεν λαβόντες αὐτοῦ τὴν ἐπιστήμην; ἆρ’ οὐκ
    ἐξ ὧν νυνδὴ ἐλέγομεν, ἢ ξύλα ἢ λίθους ἢ ἄλλα ἄττα ἰδόντες ἴσα, ἐκ τούτων ἐκεῖνο ἐνενοήσαμεν, ἕτερον ὂν τούτων; ἢ οὐχ ἕτερόν
    σοι φαίνεται; σκόπει δὲ καὶ τῇδε. ἆρ’ οὐ λίθοι μὲν ἴσοι καὶ ξύλα ἐνίοτε ταὐτὰ ὄντα τῷ μὲν ἴσα φαίνεται, τῷ δ’ οὔ; πάνυ
    μὲν οὖν. τί δέ; αὐτὰ τὰ ἴσα ἔστιν ὅτε ἄνισά σοι ἐφάνη, ἢ ἡ ἰσότης ἀνισότης; οὐδεπώποτέ γε, ὦ Σώκρατες. οὐ ταὐτὸν ἄρα ἐστίν,
    ἦ δ’ ὅς, ταῦτά τε τὰ ἴσα καὶ αὐτὸ τὸ ἴσον. οὐδαμῶς μοι φαίνεται, ὦ Σώκρατες. ἀλλὰ μὴν ἐκ τούτων γ᾽, ἔφη, τῶν ἴσων, ἑτέρων
    ὄντων ἐκείνου τοῦ ἴσου, ὅμως αὐτοῦ τὴν ἐπιστήμην ἐννενόηκάς τε καὶ εἴληφας; ἀληθέστατα, ἔφη, λέγεις. οὐκοῦν ἢ ὁμοίου ὄντος
    τούτοις ἢ ἀνομοίου; πάνυ γε. διαφέρει δέ γε, ἦ δ’ ὅς, οὐδέν· ἕως ἂν ἄλλο ἰδὼν ἀπὸ ταύτης τῆς ὄψεως ἄλλο ἐννοήσῃς, εἴτε
    ὅμοιον εἴτε ἀνόμοιον, ἀναγκαῖον, ἔφη, αὐτὸ ἀνάμνησιν γεγονέναι. πάνυ μὲν οὖν. τί δέ; ἦ δ’ ὅς· ἦ πάσχομέν τι τοιοῦτον περὶ
    τὰ ἐν τοῖς ξύλοις τε καὶ οἷς νυνδὴ ἐλέγομεν τοῖς ἴσοις; ἆρα φαίνεται ἡμῖν οὕτως ἴσα εἶναι ὥσπερ αὐτὸ τὸ ὃ ἔστιν, ἢ ἐνδεῖ
    τι ἐκείνου τῷ τοιοῦτον εἶναι οἷον τὸ ἴσον, ἢ οὐδέν; καὶ πολύ γε, ἔφη, ἐνδεῖ. οὐκοῦν ὁμολογοῦμεν, ὅταν τίς τι ἰδὼν ἐννοήσῃ
    ὅτι βούλεται μὲν τοῦτο ὃ νῦν ἐγὼ ὁρῶ εἶναι οἷον ἄλλο τι τῶν ὄντων, ἐνδεῖ δὲ καὶ οὐ δύναται τοιοῦτον εἶναι ἴσον οἷον ἐκεῖνο,
    ἀλλ’ ἔστιν φαυλότερον, ἀναγκαῖόν που τὸν τοῦτο ἐννοοῦντα τυχεῖν προειδότα ἐκεῖνο ᾧ φησιν αὐτὸ προσεοικέναι μέν, ἐνδεεστέρως
    δὲ ἔχειν; ἀνάγκη. τί οὖν; τὸ τοιοῦτον πεπόνθαμεν καὶ ἡμεῖς ἢ οὒ περί τε τὰ ἴσα καὶ αὐτὸ τὸ ἴσον; παντάπασί γε. ΦΑΙΔ. ἀναγκαῖον
    ἄρα ἡμᾶς προειδέναι τὸ ἴσον πρὸ ἐκείνου τοῦ χρόνου ὅτε τὸ πρῶτον ἰδόντες τὰ ἴσα ἐνενοήσαμεν ὅτι ὀρέγεται μὲν πάντα ταῦτα
    εἶναι οἷον τὸ ἴσον, ἔχει δὲ ἐνδεεστέρως. ἔστι ταῦτα. ἀλλὰ μὴν καὶ τόδε ὁμολογοῦμεν, μὴ ἄλλοθεν αὐτὸ ἐννενοηκέναι μηδὲ
    δυνατὸν εἶναι ἐννοῆσαι ἀλλ’ ἢ ἐκ τοῦ ἰδεῖν ἢ ἅψασθαι ἢ ἔκ τινος ἄλλης τῶν αἰσθήσεων· ταὐτὸν δὲ πάντα ταῦτα λέγω. ταὐτὸν
    γὰρ ἔστιν, ὦ Σώκρατες, πρός γε ὃ βούλεται δηλῶσαι ὁ λόγος. ἀλλὰ μὲν δὴ ἔκ γε τῶν αἰσθήσεων δεῖ ἐννοῆσαι ὅτι πάντα τὰ ἐν
    ταῖς αἰσθήσεσιν ἐκείνου τε ὀρέγεται τοῦ ὃ ἔστιν ἴσον, καὶ αὐτοῦ ἐνδεέστερά ἐστιν· ἢ πῶς λέγομεν; οὕτως. πρὸ τοῦ ἄρα ἄρξασθαι
    ἡμᾶς ὁρᾶν καὶ ἀκούειν καὶ τἆλλα αἰσθάνεσθαι τυχεῖν ἔδει που εἰληφότας ἐπιστήμην αὐτοῦ τοῦ ἴσου ὅτι ἔστιν, εἰ ἐμέλλομεν
    τὰ ἐκ τῶν αἰσθήσεων ἴσα ἐκεῖσε ἀνοίσειν, ὅτι προθυμεῖται μὲν πάντα τοιαῦτ’ εἶναι οἷον ἐκεῖνο, ἔστιν δὲ αὐτοῦ φαυλότερα.
    ἀνάγκη ἐκ τῶν προειρημένων, ὦ Σώκρατες. οὐκοῦν γενόμενοι εὐθὺς ἑωρῶμέν τε καὶ ἠκούομεν καὶ τὰς ἄλλας αἰσθήσεις εἴχομεν;
    πάνυ γε. ἔδει δέ γε, φαμέν, πρὸ τούτων τὴν τοῦ ἴσου ἐπιστήμην εἰληφέναι; ναί. πρὶν γενέσθαι ἄρα, ὡς ἔοικεν, ἀνάγκη ἡμῖν
    αὐτὴν εἰληφέναι. ἔοικεν. οὐκοῦν εἰ μὲν λαβόντες αὐτὴν πρὸ τοῦ γενέσθαι ἔχοντες ἐγενόμεθα, ἠπιστάμεθα καὶ πρὶν γενέσθαι
    καὶ εὐθὺς γενόμενοι οὐ μόνον τὸ ἴσον καὶ τὸ μεῖζον καὶ τὸ ἔλαττον ἀλλὰ καὶ σύμπαντα τὰ τοιαῦτα; οὐ γὰρ περὶ τοῦ ἴσου νῦν
    ὁ λόγος ἡμῖν μᾶλλόν τι ἢ καὶ περὶ αὐτοῦ τοῦ καλοῦ καὶ αὐτοῦ τοῦ ἀγαθοῦ καὶ δικαίου καὶ ὁσίου καί, ὅπερ λέγω, περὶ ἁπάντων
    οἷς ἐπισφραγιζόμεθα τὸ αὐτὸ ὃ ἔστι καὶ ἐν ταῖς ἐρωτήσεσιν ἐρωτῶντες καὶ ἐν ταῖς ἀποκρίσεσιν ἀποκρινόμενοι. ὥστε ἀναγκαῖον
    ἡμῖν τούτων πάντων τὰς ἐπιστήμας πρὸ τοῦ γενέσθαι εἰληφέναι. ἔστι ταῦτα. καὶ εἰ μέν γε λαβόντες ἑκάστοτε μὴ ἐπιλελήσμεθα,
    εἰδότας ἀεὶ γίγνεσθαι καὶ ἀεὶ διὰ βίου εἰδέναι· τὸ γὰρ εἰδέναι τοῦτ’ ἔστιν, λαβόντα του ἐπιστήμην ἔχειν καὶ μὴ ἀπολωλεκέναι·
    ἢ οὐ τοῦτο λήθην λέγομεν, ὦ Σιμμία, ἐπιστήμης ἀποβολήν; πάντως δήπου, ἔφη, ὦ Σώκρατες. εἰ δέ γε οἶμαι λαβόντες πρὶν γενέσθαι
    γιγνόμενοι ἀπωλέσαμεν, ὕστερον δὲ ταῖς αἰσθήσεσι χρώμενοι περὶ αὐτὰ ἐκείνας ἀναλαμβάνομεν τὰς ἐπιστήμας ἅς ποτε καὶ πρὶν
    εἴχομεν, ἆρ’ οὐχ ὃ καλοῦμεν μανθάνειν οἰκείαν ἂν ἐπιστήμην ἀναλαμβάνειν εἴη; τοῦτο δέ που ἀναμιμνῄσκεσθαι λέγοντες ὀρθῶς
    ἂν λέγοιμεν; πάνυ γε. ΦΑΙΔ.
