sanskrit_devanagari: οὐκοῦν ὁμολογοῦμεν, ὅταν τίς τι ἰδὼν ἐννοήσῃ ὅτι βούλεται μὲν τοῦτο ὃ νῦν ἐγὼ ὁρῶ εἶναι οἷον ἄλλο τι
  τῶν ὄντων, ἐνδεῖ δὲ καὶ οὐ δύναται τοιοῦτον εἶναι ἴσον οἷον ἐκεῖνο, ἀλλ’ ἔστιν φαυλότερον, ἀναγκαῖόν που τὸν τοῦτο ἐννοοῦντα
  τυχεῖν προειδότα ἐκεῖνο ᾧ φησιν αὐτὸ προσεοικέναι μέν, ἐνδεεστέρως δὲ ἔχειν; ἀνάγκη. τί οὖν; τὸ τοιοῦτον πεπόνθαμεν καὶ
  ἡμεῖς ἢ οὒ περί τε τὰ ἴσα καὶ αὐτὸ τὸ ἴσον; παντάπασί γε. ΦΑΙΔ. ἀναγκαῖον ἄρα ἡμᾶς προειδέναι τὸ ἴσον πρὸ ἐκείνου τοῦ χρόνου
  ὅτε τὸ πρῶτον ἰδόντες τὰ ἴσα ἐνενοήσαμεν ὅτι ὀρέγεται μὲν πάντα ταῦτα εἶναι οἷον τὸ ἴσον, ἔχει δὲ ἐνδεεστέρως. ἔστι ταῦτα.
  ἀλλὰ μὴν καὶ τόδε ὁμολογοῦμεν, μὴ ἄλλοθεν αὐτὸ ἐννενοηκέναι μηδὲ δυνατὸν εἶναι ἐννοῆσαι ἀλλ’ ἢ ἐκ τοῦ ἰδεῖν ἢ ἅψασθαι ἢ
  ἔκ τινος ἄλλης τῶν αἰσθήσεων· ταὐτὸν δὲ πάντα ταῦτα λέγω. ταὐτὸν γὰρ ἔστιν, ὦ Σώκρατες, πρός γε ὃ βούλεται δηλῶσαι ὁ λόγος.
  ἀλλὰ μὲν δὴ ἔκ γε τῶν αἰσθήσεων δεῖ ἐννοῆσαι ὅτι πάντα τὰ ἐν ταῖς αἰσθήσεσιν ἐκείνου τε ὀρέγεται τοῦ ὃ ἔστιν ἴσον, καὶ αὐτοῦ
  ἐνδεέστερά ἐστιν· ἢ πῶς λέγομεν; οὕτως. πρὸ τοῦ ἄρα ἄρξασθαι ἡμᾶς ὁρᾶν καὶ ἀκούειν καὶ τἆλλα αἰσθάνεσθαι τυχεῖν ἔδει που
  εἰληφότας ἐπιστήμην αὐτοῦ τοῦ ἴσου ὅτι ἔστιν, εἰ ἐμέλλομεν τὰ ἐκ τῶν αἰσθήσεων ἴσα ἐκεῖσε ἀνοίσειν, ὅτι προθυμεῖται μὲν
  πάντα τοιαῦτ’ εἶναι οἷον ἐκεῖνο, ἔστιν δὲ αὐτοῦ φαυλότερα. ἀνάγκη ἐκ τῶν προειρημένων, ὦ Σώκρατες. οὐκοῦν γενόμενοι εὐθὺς
  ἑωρῶμέν τε καὶ ἠκούομεν καὶ τὰς ἄλλας αἰσθήσεις εἴχομεν; πάνυ γε. ἔδει δέ γε, φαμέν, πρὸ τούτων τὴν τοῦ ἴσου ἐπιστήμην εἰληφέναι;
  ναί. πρὶν γενέσθαι ἄρα, ὡς ἔοικεν, ἀνάγκη ἡμῖν αὐτὴν εἰληφέναι. ἔοικεν. οὐκοῦν εἰ μὲν λαβόντες αὐτὴν πρὸ τοῦ γενέσθαι ἔχοντες
  ἐγενόμεθα, ἠπιστάμεθα καὶ πρὶν γενέσθαι καὶ εὐθὺς γενόμενοι οὐ μόνον τὸ ἴσον καὶ τὸ μεῖζον καὶ τὸ ἔλαττον ἀλλὰ καὶ σύμπαντα
  τὰ τοιαῦτα; οὐ γὰρ περὶ τοῦ ἴσου νῦν ὁ λόγος ἡμῖν μᾶλλόν τι ἢ καὶ περὶ αὐτοῦ τοῦ καλοῦ καὶ αὐτοῦ τοῦ ἀγαθοῦ καὶ δικαίου
  καὶ ὁσίου καί, ὅπερ λέγω, περὶ ἁπάντων οἷς ἐπισφραγιζόμεθα τὸ αὐτὸ ὃ ἔστι καὶ ἐν ταῖς ἐρωτήσεσιν ἐρωτῶντες καὶ ἐν ταῖς ἀποκρίσεσιν
  ἀποκρινόμενοι. ὥστε ἀναγκαῖον ἡμῖν τούτων πάντων τὰς ἐπιστήμας πρὸ τοῦ γενέσθαι εἰληφέναι. ἔστι ταῦτα. καὶ εἰ μέν γε λαβόντες
  ἑκάστοτε μὴ ἐπιλελήσμεθα, εἰδότας ἀεὶ γίγνεσθαι καὶ ἀεὶ διὰ βίου εἰδέναι· τὸ γὰρ εἰδέναι τοῦτ’ ἔστιν, λαβόντα του ἐπιστήμην
  ἔχειν καὶ μὴ ἀπολωλεκέναι· ἢ οὐ τοῦτο λήθην λέγομεν, ὦ Σιμμία, ἐπιστήμης ἀποβολήν; πάντως δήπου, ἔφη, ὦ Σώκρατες. εἰ δέ
  γε οἶμαι λαβόντες πρὶν γενέσθαι γιγνόμενοι ἀπωλέσαμεν, ὕστερον δὲ ταῖς αἰσθήσεσι χρώμενοι περὶ αὐτὰ ἐκείνας ἀναλαμβάνομεν
  τὰς ἐπιστήμας ἅς ποτε καὶ πρὶν εἴχομεν, ἆρ’ οὐχ ὃ καλοῦμεν μανθάνειν οἰκείαν ἂν ἐπιστήμην ἀναλαμβάνειν εἴη; τοῦτο δέ που
  ἀναμιμνῄσκεσθαι λέγοντες ὀρθῶς ἂν λέγοιμεν; πάνυ γε. ΦΑΙΔ.
sanskrit_iast: oykoyn homologoymen, hotan tis ti idōn ennoēsē hoti boyletai men toyto ho nyn egō horō einai oion allo ti tōn
  ontōn, endei de kai oy dynatai toioyton einai ison oion ekeino, all’ estin phayloteron, anankaion poy ton toyto ennooynta
  tychein proeidota ekeino hō phēsin ayto proseoikenai men, endeesterōs de echein; anankē. ti oyn; to toioyton peponthamen
  kai hēmeis ē oy peri te ta isa kai ayto to ison; pantapasi ge. PhAID. anankaion ara hēmas proeidenai to ison pro ekeinoy
  toy chronoy hote to prōton idontes ta isa enenoēsamen hoti oregetai men panta tayta einai oion to ison, echei de endeesterōs.
  esti tayta. alla mēn kai tode homologoymen, mē allothen ayto ennenoēkenai mēde dynaton einai ennoēsai all’ ē ek toy idein
  ē hapsasthai ē ek tinos allēs tōn aisthēseōn; tayton de panta tayta legō. tayton gar estin, ō Sōkrates, pros ge ho boyletai
  dēlōsai ho logos. alla men dē ek ge tōn aisthēseōn dei ennoēsai hoti panta ta en tais aisthēsesin ekeinoy te oregetai toy
  ho estin ison, kai aytoy endeestera estin; ē pōs legomen; oytōs. pro toy ara arxasthai hēmas horan kai akoyein kai talla
  aisthanesthai tychein edei poy eilēphotas epistēmēn aytoy toy isoy hoti estin, ei emellomen ta ek tōn aisthēseōn isa ekeise
  anoisein, hoti prothymeitai men panta toiayt’ einai oion ekeino, estin de aytoy phaylotera. anankē ek tōn proeirēmenōn,
  ō Sōkrates. oykoyn genomenoi eythys heōrōmen te kai ēkoyomen kai tas allas aisthēseis eichomen; pany ge. edei de ge, phamen,
  pro toytōn tēn toy isoy epistēmēn eilēphenai; nai. prin genesthai ara, hōs eoiken, anankē hēmin aytēn eilēphenai. eoiken.
  oykoyn ei men labontes aytēn pro toy genesthai echontes egenometha, ēpistametha kai prin genesthai kai eythys genomenoi
  oy monon to ison kai to meizon kai to elatton alla kai sympanta ta toiayta; oy gar peri toy isoy nyn ho logos hēmin mallon
  ti ē kai peri aytoy toy kaloy kai aytoy toy agathoy kai dikaioy kai hosioy kai, hoper legō, peri hapantōn ois episphragizometha
  to ayto ho esti kai en tais erōtēsesin erōtōntes kai en tais apokrisesin apokrinomenoi. hōste anankaion hēmin toytōn pantōn
  tas epistēmas pro toy genesthai eilēphenai. esti tayta. kai ei men ge labontes hekastote mē epilelēsmetha, eidotas aei gignesthai
  kai aei dia bioy eidenai; to gar eidenai toyt’ estin, labonta toy epistēmēn echein kai mē apolōlekenai; ē oy toyto lēthēn
  legomen, ō Simmia, epistēmēs apobolēn; pantōs dēpoy, ephē, ō Sōkrates. ei de ge oimai labontes prin genesthai gignomenoi
  apōlesamen, hysteron de tais aisthēsesi chrōmenoi peri ayta ekeinas analambanomen tas epistēmas has pote kai prin eichomen,
  ar’ oych ho kaloymen manthanein oikeian an epistēmēn analambanein eiē; toyto de poy anamimnēskesthai legontes orthōs an
  legoimen; pany ge. PhAID.
translation_literal: 'Learning is presented as recollection: the mind does not manufacture first principles from scratch but
  re-recognizes standards it already measures by. When we compare imperfect equal things to Equality itself, we reveal a prior
  acquaintance with a norm no sensory object exhausts. The argument aims to show that intelligibility precedes mere sensation.'
commentary: 'The claim is that cognition contains a transcendence relation: empirical instances are judged by standards they
  do not produce. Socrates'' counterintuitive move is to treat this as evidence of pre-existence. Whether one accepts literal
  pre-birth memory, the structural insight is powerful: perception alone cannot account for normativity. If all knowing were
  assembled only from sensory fragments, there would be no vantage point from which to call any fragment "insufficient."


  Plato is not naively denying perception; he is analyzing its dependence. Senses present comparables. Intellect discloses
  measure. The doctrine of recollection is thus both metaphysical and methodological. Metaphysically, it supports soul-precedence.
  Methodologically, it trains the reader to distinguish data from criterion, appearance from intelligible form.


  Existentially, this matters because contemporary culture often mistakes information-density for understanding. Recollection
  language reminds us that insight is frequently recognition, not accumulation. We "learn" deeply when something newly heard
  resonates with an already-intuited order. The practical test is not novelty but coherence: does a claim illuminate what
  experience was already straining to say? In that sense, recollection remains a living contemplative epistemology.


  Key Terms:


  **anamnesis (ἀνάμνησις)** - "recollection, calling to mind again" (*ana-* back + *mnesis* memory) -> here it marks the recovery
  of intelligible standards, not episodic memory replay -> translating it as ordinary "remembering" misses its philosophical
  depth.


  **ison (ἴσον)** - equal -> in this argument, sensible equals point beyond themselves to Equality-as-such -> "equal" as mere
  arithmetic relation misses the ontological use in Platonic dialectic.


  **eidos (εἶδος)** - form, intelligible pattern -> functions as the stable criterion by which particulars are judged -> rendering
  as "idea" can sound subjective, while Plato treats it as objective intelligibility.


  **episteme (ἐπιστήμη)** - stable knowledge -> contrasted implicitly with shifting doxa -> "knowledge" without this stability
  contrast flattens the argument.'
insight: 'The claim is that cognition contains a transcendence relation: empirical instances are judged by standards they
  do not produce.'
practice: Choose one ethical word ("justice," "truth," or "care"), write one concrete example from today, then ask what unstated
  standard made that example intelligible as that word.
