section: 64a
sanskrit_devanagari: κινδυνεύουσι γὰρ ὅσοι τυγχάνουσιν ὀρθῶς ἁπτόμενοι φιλοσοφίας λεληθέναι τοὺς ἄλλους ὅτι οὐδὲν ἄλλο αὐτοὶ
  ἐπιτηδεύουσιν ἢ ἀποθνῄσκειν τε καὶ τεθνάναι.
sanskrit_iast: ''
translation_literal: 'For it is likely that those who rightly take hold of philosophy escape the notice of others: they are
  pursuing nothing other than practising dying and being dead.'
commentary: 'Socrates does not recommend suicide or a contemptuous flight from embodied life. Rather, he names philosophy
  as a discipline of loosening the soul’s confused dependence on bodily pleasures, pains, status, and sensory appearances.
  To “practise dying” (ἀποθνῄσκειν μελετῶσιν) is to rehearse the separation of judgment from appetite: to ask what is true
  rather than what is gratifying, and to become less ruled by fear of loss. “Being dead” points to the completed condition
  in which the soul is no longer entangled in bodily distraction; the argument of the dialogue will connect this aspiration
  with the soul’s affinity for the intelligible Forms. The phrase is deliberately paradoxical. Outsiders see philosophy as
  useless withdrawal, whereas Socrates presents it as training for the decisive test of a life: whether one can meet death
  without panic because one has already learned to detach oneself from what death takes away.'
practice: 'For five minutes, sit quietly and name three things whose loss you fear—comfort, reputation, a possession, a relationship,
  or life itself. For each, ask: “What capacity for truth, justice, or love remains mine even if this is taken?” Do not suppress
  grief; distinguish it from the panic of possessing.'
