- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upanishad 2.18-2.20
    resonance: Both distinguish the enduring principle from bodily perishability and use death as a pedagogical threshold.
    divergence: The Upanishadic register is explicitly Atman-centered and revelatory; Plato frames the issue through dialectical
      argument and conceptual purification.
    passage_id: ''
  - citation: Bhagavad Gita 2.16-2.25
    resonance: Both insist that what truly is cannot be destroyed, and that fear decreases when identity shifts from the perishable.
    divergence: The Gita embeds this recognition in dharma-action and devotion; *Phaedo* embeds it in philosophical inquiry
      and soul-body analysis.
    passage_id: ''
  - citation: Epictetus, Enchiridion 1
    resonance: Both train freedom by separating what is "ours" from what is not fully under our command.
    divergence: Stoicism remains this-worldly and ethical-rational; Plato ties the distinction to a metaphysics of soul and
      post-mortem destiny.
    passage_id: ''
