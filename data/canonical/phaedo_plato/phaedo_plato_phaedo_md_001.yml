sanskrit_devanagari: κινδυνεύουσι γὰρ ὅσοι τυγχάνουσιν ὀρθῶς ἁπτόμενοι φιλοσοφίας λεληθέναι τοὺς ἄλλους ὅτι οὐδὲν ἄλλο αὐτοὶ
  ἐπιτηδεύουσιν ἢ ἀποθνῄσκειν τε καὶ τεθνάναι. εἰ οὖν τοῦτο ἀληθές, ἄτοπον δήπου ἂν εἴη προθυμεῖσθαι μὲν ἐν παντὶ τῷ βίῳ μηδὲν
  ἄλλο ἢ τοῦτο, ἥκοντος δὲ δὴ αὐτοῦ ἀγανακτεῖν ὃ πάλαι προυθυμοῦντό τε καὶ ἐπετήδευον. καὶ ὁ Σιμμίας γελάσας, νὴ τὸν Δία,
  ἔφη, ὦ Σώκρατες, οὐ πάνυ γέ με νυνδὴ γελασείοντα ἐποίησας γελάσαι. οἶμαι γὰρ ἂν τοὺς πολλοὺς αὐτὸ τοῦτο ἀκούσαντας δοκεῖν
  εὖ πάνυ εἰρῆσθαι εἰς τοὺς φιλοσοφοῦντας — καὶ συμφάναι ἂν τοὺς μὲν παρ’ ἡμῖν ἀνθρώπους καὶ πάνυ — ὅτι τῷ ὄντι οἱ φιλοσοφοῦντες
  θανατῶσι, καὶ σφᾶς γε οὐ λελήθασιν ὅτι ἄξιοί εἰσιν τοῦτο πάσχειν. καὶ ἀληθῆ γ’ ἂν λέγοιεν, ὦ Σιμμία, πλήν γε τοῦ σφᾶς μὴ
  λεληθέναι. λέληθεν γὰρ αὐτοὺς ᾗ τε θανατῶσι καὶ ᾗ ἄξιοί εἰσιν θανάτου καὶ οἵου θανάτου οἱ ὡς ἀληθῶς φιλόσοφοι. εἴπωμεν γάρ,
  ἔφη, πρὸς ἡμᾶς αὐτούς, χαίρειν εἰπόντες ἐκείνοις· ἡγούμεθά τι τὸν θάνατον εἶναι; πάνυ γε, ἔφη ὑπολαβὼν ὁ Σιμμίας. ἆρα μὴ
  ἄλλο τι ἢ τὴν τῆς ψυχῆς ἀπὸ τοῦ σώματος ἀπαλλαγήν; καὶ εἶναι τοῦτο τὸ τεθνάναι, χωρὶς μὲν ἀπὸ τῆς ψυχῆς ἀπαλλαγὲν αὐτὸ καθ’
  αὑτὸ τὸ σῶμα γεγονέναι, χωρὶς δὲ τὴν ψυχὴν ἀπὸ τοῦ σώματος ἀπαλλαγεῖσαν αὐτὴν καθ’ αὑτὴν εἶναι; ἆρα μὴ ἄλλο τι ᾖ ὁ θάνατος
  ἢ τοῦτο; οὔκ, ἀλλὰ τοῦτο, ἔφη. σκέψαι δή, ὠγαθέ, ἐὰν ἄρα καὶ σοὶ συνδοκῇ ἅπερ ἐμοί· ἐκ γὰρ τούτων μᾶλλον οἶμαι ἡμᾶς εἴσεσθαι
  περὶ ὧν σκοποῦμεν. φαίνεταί σοι φιλοσόφου ἀνδρὸς εἶναι ἐσπουδακέναι περὶ τὰς ἡδονὰς καλουμένας τὰς τοιάσδε, οἷον σιτίων
  τε καὶ ποτῶν; ἥκιστα, ὦ Σώκρατες, ἔφη ὁ Σιμμίας. τί δὲ τὰς τῶν ἀφροδισίων; οὐδαμῶς. τί δὲ τὰς ἄλλας τὰς περὶ τὸ σῶμα θεραπείας;
  δοκεῖ σοι ἐντίμους ἡγεῖσθαι ὁ τοιοῦτος; οἷον ἱματίων διαφερόντων κτήσεις καὶ ὑποδημάτων καὶ τοὺς ἄλλους καλλωπισμοὺς τοὺς
  περὶ τὸ σῶμα πότερον τιμᾶν δοκεῖ σοι ἢ ἀτιμάζειν, καθ’ ὅσον μὴ πολλὴ ἀνάγκη μετέχειν αὐτῶν; ἀτιμάζειν ἔμοιγε δοκεῖ, ἔφη,
  ὅ γε ὡς ἀληθῶς φιλόσοφος. οὐκοῦν ὅλως δοκεῖ σοι, ἔφη, ἡ τοῦ τοιούτου πραγματεία οὐ περὶ τὸ σῶμα εἶναι, ἀλλὰ καθ’ ὅσον δύναται
  ἀφεστάναι αὐτοῦ, πρὸς δὲ τὴν ψυχὴν τετράφθαι; ἔμοιγε. ΦΑΙΔ. ἆρ᾽ οὖν πρῶτον μὲν ἐν τοῖς τοιούτοις δῆλός ἐστιν ὁ φιλόσοφος
  ἀπολύων ὅτι μάλιστα τὴν ψυχὴν ἀπὸ τῆς τοῦ σώματος κοινωνίας διαφερόντως τῶν ἄλλων ἀνθρώπων; φαίνεται. καὶ δοκεῖ γέ που,
  ὦ Σιμμία, τοῖς πολλοῖς ἀνθρώποις ᾧ μηδὲν ἡδὺ τῶν τοιούτων μηδὲ μετέχει αὐτῶν οὐκ ἄξιον εἶναι ζῆν, ἀλλ’ ἐγγύς τι τείνειν
  τοῦ τεθνάναι ὁ μηδὲν φροντίζων τῶν ἡδονῶν αἳ διὰ τοῦ σώματός εἰσιν. πάνυ μὲν οὖν ἀληθῆ λέγεις. τί δὲ δὴ περὶ αὐτὴν τὴν τῆς
  φρονήσεως κτῆσιν; πότερον ἐμπόδιον τὸ σῶμα ἢ οὔ, ἐάν τις αὐτὸ ἐν τῇ ζητήσει κοινωνὸν συμπαραλαμβάνῃ; οἷον τὸ τοιόνδε λέγω·
  ἆρα ἔχει ἀλήθειάν τινα ὄψις τε καὶ ἀκοὴ τοῖς ἀνθρώποις, ἢ τά γε τοιαῦτα καὶ οἱ ποιηταὶ ἡμῖν ἀεὶ θρυλοῦσιν, ὅτι οὔτ’ ἀκούομεν
  ἀκριβὲς οὐδὲν οὔτε ὁρῶμεν; καίτοι εἰ αὗται τῶν περὶ τὸ σῶμα αἰσθήσεων μὴ ἀκριβεῖς εἰσιν μηδὲ σαφεῖς, σχολῇ αἵ γε ἄλλαι·
  πᾶσαι γάρ που τούτων φαυλότεραί εἰσιν. ἢ σοὶ οὐ δοκοῦσιν; πάνυ μὲν οὖν, ἔφη. πότε οὖν, ἦ δ’ ὅς, ἡ ψυχὴ τῆς ἀληθείας ἅπτεται;
  ὅταν μὲν γὰρ μετὰ τοῦ σώματος ἐπιχειρῇ τι σκοπεῖν, δῆλον ὅτι τότε ἐξαπατᾶται ὑπ’ αὐτοῦ. ἀληθῆ λέγεις. ἆρ’ οὖν οὐκ ἐν τῷ
  λογίζεσθαι εἴπερ που ἄλλοθι κατάδηλον αὐτῇ γίγνεταί τι τῶν ὄντων; ναί. λογίζεται δέ γέ που τότε κάλλιστα, ὅταν αὐτὴν τούτων
  μηδὲν παραλυπῇ, μήτε ἀκοὴ μήτε ὄψις μήτε ἀλγηδὼν μηδέ τις ἡδονή, ἀλλ’ ὅτι μάλιστα αὐτὴ καθ’ αὑτὴν γίγνηται ἐῶσα χαίρειν
  τὸ σῶμα, καὶ καθ’ ὅσον δύναται μὴ κοινωνοῦσα αὐτῷ μηδ᾽ ἁπτομένη ὀρέγηται τοῦ ὄντος. ἔστι ταῦτα. οὐκοῦν καὶ ἐνταῦθα ἡ τοῦ
  φιλοσόφου ψυχὴ μάλιστα ἀτιμάζει τὸ σῶμα καὶ φεύγει ἀπ’ αὐτοῦ, ζητεῖ δὲ αὐτὴ καθ’ αὑτὴν γίγνεσθαι; φαίνεται. τί δὲ δὴ τὰ
  τοιάδε, ὦ Σιμμία; φαμέν τι εἶναι δίκαιον αὐτὸ ἢ οὐδέν; φαμὲν μέντοι νὴ Δία. καὶ αὖ καλόν γέ τι καὶ ἀγαθόν; πῶς δ’ οὔ; ἤδη
  οὖν πώποτέ τι τῶν τοιούτων τοῖς ὀφθαλμοῖς εἶδες; οὐδαμῶς, ἦ δ’ ὅς. ἀλλ’ ἄλλῃ τινὶ αἰσθήσει τῶν διὰ τοῦ σώματος ἐφήψω αὐτῶν;
  λέγω δὲ περὶ πάντων, οἷον μεγέθους πέρι, ὑγιείας, ἰσχύος, καὶ τῶν ἄλλων ἑνὶ λόγῳ ἁπάντων τῆς οὐσίας ὃ … ἔπειτα μόνην καθ’
  αὑτήν, ἐκλυομένην ὥσπερ ἐκ δεσμῶν ἐκ τοῦ σώματος; πάνυ μὲν οὖν, ἔφη. οὐκοῦν τοῦτό γε θάνατος ὀνομάζεται, λύσις καὶ χωρισμὸς
  ψυχῆς ἀπὸ σώματος; παντάπασί γε, ἦ δ’ ὅς. λύειν δέ γε αὐτήν, ὥς φαμεν, προθυμοῦνται ἀεὶ μάλιστα καὶ μόνοι οἱ φιλοσοφοῦντες
  ὀρθῶς, καὶ τὸ μελέτημα αὐτὸ τοῦτό ἐστιν τῶν φιλοσόφων, λύσις καὶ χωρισμὸς ψυχῆς ἀπὸ σώματος· ἢ οὔ; φαίνεται. οὐκοῦν, ὅπερ
  ἐν ἀρχῇ ἔλεγον, γελοῖον ἂν εἴη ἄνδρα παρασκευάζονθ’ ἑαυτὸν ἐν τῷ βίῳ ὅτι ἐγγυτάτω ὄντα τοῦ τεθνάναι οὕτω ζῆν, κἄπειθ’ ἥκοντος
  αὐτῷ τούτου ἀγανακτεῖν; γελοῖον· πῶς δ’ οὔ; τῷ ὄντι ἄρα, ἔφη, ὦ Σιμμία, οἱ ὀρθῶς φιλοσοφοῦντες ἀποθνῄσκειν μελετῶσι, καὶ
  τὸ τεθνάναι ἥκιστα αὐτοῖς ἀνθρώπων φοβερόν. ἐκ τῶνδε δὲ σκόπει. ΦΑΙΔ. εἰ γὰρ διαβέβληνται μὲν πανταχῇ τῷ σώματι, αὐτὴν δὲ
  καθ’ αὑτὴν ἐπιθυμοῦσι τὴν ψυχὴν ἔχειν, τούτου δὲ γιγνομένου εἰ φοβοῖντο καὶ ἀγανακτοῖεν, οὐ πολλὴ ἂν ἀλογία εἴη, εἰ μὴ
