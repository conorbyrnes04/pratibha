    aei oy mē pote dexētai, hōs ek tōn prosthen hōmologētai; kai mala sphodra, ephē ho Kebēs. ti oyn; to mē dechomenon tēn
    toy artioy idean ti nyndē ōnomazomen; anartion, ephē. to de dikaion mē dechomenon kai ho an moysikon mē dechētai; amoyson,
    ephē, to de adikon. eien; ho d’ an thanaton mē dechētai ti kaloymen; athanaton, ephē. oykoyn psychē oy dechetai thanaton;
    oy. athanaton ara psychē. athanaton. eien, ephē; toyto men dē apodedeichthai phōmen; ē pōs dokei; kai mala ge hikanōs,
    ō Sōkrates. PhAID. ti oyn, ē d’ hos, ō Kebēs; ei tō anartiō anankaion ēn anōlethrō einai, allo ti ta tria ē anōlethra
    an ēn; pōs gar oy; oykoyn ei kai to athermon anankaion ēn anōlethron einai, hopote tis epi chiona thermon epagoi, hypexēei
    an hē chiōn oysa sōs kai atēktos; oy gar an apōleto ge, oyd’ ay hypomenoysa edexato an tēn thermotēta. alēthē, ephē, legeis.
    hōs d’ aytōs oimai kan ei to apsykton anōlethron ēn, hopote epi to pyr psychron ti epēei, oypot’ an apesbennyto oyd’ apōllyto,
    alla sōn an apelthon ōcheto. anankē, ephē. oykoyn kai hōde, ephē, anankē peri toy athanatoy eipein; ei men to athanaton
    kai anōlethron estin, adynaton psychē, hotan thanatos ep’ aytēn iē, apollysthai; thanaton men gar dē ek tōn proeirēmenōn
    oy dexetai oyd’ estai tethnēkyia, hōsper ta tria oyk estai, ephamen, artion, oyde g’ ay to peritton, oyde dē pyr psychron,
    oyde ge hē en tō pyri thermotēs. alla ti kōlyei, phaiē an tis, artion men to peritton mē gignesthai epiontos toy artioy,
    hōsper hōmologētai, apolomenoy de aytoy ant’ ekeinoy artion gegonenai; tō tayta legonti oyk an echoimen diamachesasthai
    hoti oyk apollytai; to gar anartion oyk anōlethron estin; epei ei toyto hōmologēto hēmin, rhadiōs an diemachometha hoti
    epelthontos toy artioy to peritton kai ta tria oichetai apionta; kai peri pyros kai thermoy kai tōn allōn oytōs an diemachometha.
    ē oy; pany men oyn. oykoyn kai nyn peri toy athanatoy, ei men hēmin homologeitai kai anōlethron einai, psychē an eiē pros
    tō athanatos einai kai anōlethros; ei de mē, alloy an deoi logoy. all’ oyden dei, ephē, toytoy ge heneka; scholē gar an
    ti allo phthoran mē dechoito, ei to ge athanaton aidion on phthoran dexetai. ho de ge theos oimai, ephē ho Sōkratēs, kai
    ayto to tēs zōēs eidos kai ei ti allo athanaton estin, para pantōn an homologētheiē mēdepote apollysthai. para pantōn
    mentoi nē Di, ephē, anthrōpōn te ge kai eti mallon, hōs egōmai, para theōn. hopote dē to athanaton kai adiaphthoron estin,
    allo ti psychē ē, ei athanatos tynchanei oysa, kai anōlethros an eiē; pollē anankē. epiontos ara thanatoy epi ton anthrōpon
    to men thnēton, hōs eoiken, aytoy apothnēskei, to d’ athanaton sōn kai adiaphthoron oichetai apion, hypekchōrēsan tō thanatō.
    phainetai. PhAID. pantos mallon ara, ephē, ō Kebēs, psychē athanaton kai
