- kind: key_terms
  label: Key Terms
  items:
  - term: katharsis (κάθαρσις)
    definition: '‘purification’ → soul’s cleansing from bodily distraction toward truth Here: This is
      why purification in *Phaedo* is epistemic before it is moral: false knowing is already a kind of
      bondage. Trap: ritual hygiene only'
  - term: meletē thanatou
    definition: '‘practice/rehearsal of death’ → philosophy as training to loosen identity with the perishable
      Here: The claim is that ontology and practice cannot be separated: what the soul becomes like determines
      where and how it abides. Trap: morbid death-obsession'
  - term: anamnēsis (ἀνάμνησις)
    definition: '‘recollection’ → learning as re-recognizing standards the soul already measures by Here:
      The soul, when identified with sensory flux, is confused; when recollected into itself, it participates
      in the order of the stable and the true. Trap: ordinary memory tricks'
  - term: phronēsis (φρόνησις)
    definition: '‘practical/intellectual wisdom’ → wisdom that sees Forms and orders life toward them
      Here: "Affinity" means that modes of knowing shape modes of being. Trap: mere cleverness'
    lemma_id: nous
  - term: psychē (ψυχή)
    definition: '‘soul, life-principle’ → immortal knowing principle separable in practice from body Here:
      The Soul''s Affinity With the Unseen The Soul''s Affinity With the Unseen *Source-language basis:*
      Greek source text not yet line-aligned in this manuscript pass… Trap: Cartesian ghost; modern psychology'
    lemma_id: psyche
    sense_id: 1.5
