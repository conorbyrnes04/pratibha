- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Republic VI-VII (Sun/Line/Cave)
    resonance: Both distinguish changing appearances from intelligible grounds and tie education to turning
      the soul.
    divergence: '*Republic* frames this politically and pedagogically; *Phaedo* frames it as preparation
      for death and post-mortem destiny.'
    passage_id: ''
  - citation: Mundaka Upanishad 1.1.4-1.1.5
    resonance: Both differentiate lower knowledge of changing objects from higher knowledge of the imperishable.
    divergence: Mundaka's pathway is Vedic-renunciatory revelation; Plato's is dialogical argument and
      conceptual refinement.
    passage_id: ''
  - citation: Plotinus, Enneads I.6 and IV.8
    resonance: Both insist the soul can recollect from dispersion into unity.
    divergence: Plotinus develops emanationist metaphysics beyond Plato's dramatic-dialectical frame.
    passage_id: plotinus_enneads.enn_i_6_08
  layer_provenance: migrated_from_commentary
