- kind: translation
  label: Pratibha Translation
  body: 'Socrates argues by affinity: what is composite and visible tends toward dissolution; what is simple and intelligible
    tends toward endurance. The soul, when identified with sensory flux, is confused; when recollected into itself, it participates
    in the order of the stable and the true. Its destiny follows its likeness.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that ontology and practice cannot be separated: what the soul becomes like determines where and how
    it abides. The counterintuitive move is to treat attention itself as destiny-bearing. Inattention is not merely distraction;
    it is metaphysical drift toward fragmentation. Recollection is not merely calmness; it is likeness to intelligibility.


    Plato''s argument here is not a crude ghost-vs-body dualism. It is an analysis of participation. Bodies manifest change
    and composition; souls can either mirror that turbulence or orient toward what does not vary with circumstance. "Affinity"
    means that modes of knowing shape modes of being. This is why purification in *Phaedo* is epistemic before it is moral:
    false knowing is already a kind of bondage.


    Existentially, this passage diagnoses modern overstimulation with startling accuracy. A mind constantly outsourced to
    sensory and social volatility becomes internally centrifugal. The remedy is not hatred of embodiment but disciplined recollection:
    return attention to the witnessing center until reaction is no longer sovereign. The criterion of progress is simple:
    decreased compulsive reactivity and increased availability to truth even under emotional weather.


    Key Terms:


    **aoraton (ἀόρατον)** - invisible/unseen -> names the intelligible register not available to eyes yet available to reason
    -> "invisible" as merely hidden physical object misses the epistemic meaning.


    **horaton (ὁρατόν)** - visible/seen -> not dismissed as unreal, but marked as unstable when treated as final criterion
    -> modern empiricist readings over-ascribe final authority to this register.


    **katharsis (κάθαρσις)** - purification -> here purification is the disentangling of soul from compulsive sensory identification
    -> reducing to ritual cleansing misses the cognitive-existential operation.


    **logos (λόγος)** - reasoned account -> the medium by which soul can align with what is stable -> translating as only
    "word" obscures its structural role in truth-seeking.'
- kind: key_terms
  label: Key Terms
  items:
  - term: katharsis (κάθαρσις)
    definition: '‘purification’ → soul’s cleansing from bodily distraction toward truth Here: This is why purification in
      *Phaedo* is epistemic before it is moral: false knowing is already a kind of bondage. Trap: ritual hygiene only'
  - term: meletē thanatou
    definition: '‘practice/rehearsal of death’ → philosophy as training to loosen identity with the perishable Here: The claim
      is that ontology and practice cannot be separated: what the soul becomes like determines where and how it abides. Trap:
      morbid death-obsession'
  - term: anamnēsis (ἀνάμνησις)
    definition: '‘recollection’ → learning as re-recognizing standards the soul already measures by Here: The soul, when identified
      with sensory flux, is confused; when recollected into itself, it participates in the order of the stable and the true.
      Trap: ordinary memory tricks'
  - term: phronēsis (φρόνησις)
    definition: '‘practical/intellectual wisdom’ → wisdom that sees Forms and orders life toward them Here: "Affinity" means
      that modes of knowing shape modes of being. Trap: mere cleverness'
    lemma_id: nous
  - term: psychē (ψυχή)
    definition: '‘soul, life-principle’ → immortal knowing principle separable in practice from body Here: The Soul''s Affinity
      With the Unseen The Soul''s Affinity With the Unseen *Source-language basis:* Greek source text not yet line-aligned
      in this manuscript pass… Trap: Cartesian ghost; modern psychology'
    lemma_id: psyche
    sense_id: 1.5
