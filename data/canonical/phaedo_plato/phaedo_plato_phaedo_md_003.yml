  alēthē legeis. thōmen oyn boylei, ephē, dyo eidē tōn ontōn, to men horaton, to de aides; thōmen, ephē. kai to men aides
  aei kata tayta echon, to de horaton mēdepote kata tayta; kai toyto, ephē, thōmen. phere dē, ē d’ hos, allo ti hēmōn aytōn
  to men sōma esti, to de psychē; oyden allo, ephē. poterō oyn homoioteron tō eidei phamen an einai kai syngenesteron to sōma;
  panti, ephē, toyto ge dēlon, hoti tō horatō. ti de hē psychē; horaton ē aides; oych hyp’ anthrōpōn ge, ō Sōkrates, ephē.
  alla mēn hēmeis ge ta horata kai ta mē tē tōn anthrōpōn physei elegomen; ē allē tini oiei; tē tōn anthrōpōn. ti oyn peri
  psychēs legomen; horaton ē aoraton einai; oych horaton. aides ara; nai. homoioteron ara psychē sōmatos estin tō aidei, to
  de tō horatō. pasa anankē, ō Sōkrates. oykoyn kai tode palai elegomen, hoti hē psychē, hotan men tō sōmati proschrētai eis
  to skopein ti ē dia toy horan ē dia toy akoyein ē di’ allēs tinos aisthēseōs — toyto gar estin to dia toy sōmatos, to di’
  aisthēseōs skopein ti — tote men helketai hypo toy sōmatos eis ta oydepote kata tayta echonta, kai aytē planatai kai tarattetai
  kai eilingia hōsper methyoysa, hate toioytōn ephaptomenē; pany ge. hotan de ge aytē kath’ aytēn skopē, ekeise oichetai eis
  to katharon te kai aei on kai athanaton kai hōsaytōs echon, kai hōs syngenēs oysa aytoy aei met’ ekeinoy te gignetai, hotanper
  aytē kath aytēn genētai kai exē aytē, kai pepaytai te toy planoy kai peri ekeina aei kata tayta hōsaytōs echei, hate toioytōn
  ephaptomenē; kai toyto aytēs to pathēma phronēsis keklētai; pantapasin, ephē, kalōs kai alēthē legeis, ō Sōkrates. poterō
  oyn ay soi dokei tō eidei kai ek tōn prosthen kai ek tōn nyn legomenōn psychē homoioteron einai kai syngenesteron; pas an
  moi dokei, ē d’ hos, synchōrēsai, ō Sōkrates, ek taytēs tēs methodoy, kai ho dysmathestatos, hoti holō kai panti homoioteron
  esti psychē tō aei hōsaytōs echonti mallon ē tō mē. ti de to sōma; tō heterō. PhAID. hora dē kai tēde hoti epeidan en tō
  aytō ōsi psychē kai sōma, tō men doyleyein kai archesthai hē physis prostattei, tē de archein kai despozein; kai kata tayta
  ay poteron soi dokei homoion tō theiō einai kai poteron tō thnētō; ē oy dokei soi to men theion oion archein te kai hēgemoneyein
  pephykenai, to de thnēton archesthai te kai doyleyein; emoige. poterō oyn hē psychē eoiken; dēla dē, ō Sōkrates, hoti hē
  men psychē tō theiō, to de sōma tō thnētō. skopei dē, ephē, ō Kebēs, ei ek pantōn tōn eirēmenōn tade hēmin symbainei, tō
  men theiō kai athanatō kai noētō kai monoeidei kai adialytō kai aei hōsaytōs kata tayta echonti heaytō homoiotaton einai
  psychē, tō de anthrōpinō kai thnētō kai polyeidei kai anoētō kai dialytō kai mēdepote kata tayta echonti heaytō homoiotaton
  ay einai sōma. echomen ti para tayta allo legein, ō phile Kebēs, hē oych oytōs echei; oyk echomen. ti oyn; toytōn oytōs
  echontōn ar’ oychi sōmati men tachy dialyesthai prosēkei, psychē de ay to parapan adialytō einai ē engys ti toytoy;
translation_literal: 'Socrates argues by affinity: what is composite and visible tends toward dissolution; what is simple
  and intelligible tends toward endurance. The soul, when identified with sensory flux, is confused; when recollected into
  itself, it participates in the order of the stable and the true. Its destiny follows its likeness.'
commentary: 'The claim is that ontology and practice cannot be separated: what the soul becomes like determines where and
  how it abides. The counterintuitive move is to treat attention itself as destiny-bearing. Inattention is not merely distraction;
  it is metaphysical drift toward fragmentation. Recollection is not merely calmness; it is likeness to intelligibility.


  Plato''s argument here is not a crude ghost-vs-body dualism. It is an analysis of participation. Bodies manifest change
  and composition; souls can either mirror that turbulence or orient toward what does not vary with circumstance. "Affinity"
  means that modes of knowing shape modes of being. This is why purification in *Phaedo* is epistemic before it is moral:
  false knowing is already a kind of bondage.


  Existentially, this passage diagnoses modern overstimulation with startling accuracy. A mind constantly outsourced to sensory
  and social volatility becomes internally centrifugal. The remedy is not hatred of embodiment but disciplined recollection:
  return attention to the witnessing center until reaction is no longer sovereign. The criterion of progress is simple: decreased
  compulsive reactivity and increased availability to truth even under emotional weather.


  Key Terms:


  **aoraton (ἀόρατον)** - invisible/unseen -> names the intelligible register not available to eyes yet available to reason
  -> "invisible" as merely hidden physical object misses the epistemic meaning.


  **horaton (ὁρατόν)** - visible/seen -> not dismissed as unreal, but marked as unstable when treated as final criterion ->
  modern empiricist readings over-ascribe final authority to this register.


  **katharsis (κάθαρσις)** - purification -> here purification is the disentangling of soul from compulsive sensory identification
  -> reducing to ritual cleansing misses the cognitive-existential operation.


  **logos (λόγος)** - reasoned account -> the medium by which soul can align with what is stable -> translating as only "word"
  obscures its structural role in truth-seeking.'
insight: 'The claim is that ontology and practice cannot be separated: what the soul becomes like determines where and how
  it abides.'
practice: 'At three points today, pause for one breath and label experience in two columns: "changing content" and "that which
  knows the change"; rest for ten seconds in the second column.'
