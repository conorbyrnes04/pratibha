sanskrit_devanagari: οὐκοῦν τούτων μὲν κἂν ἅψαιο κἂν ἴδοις κἂν ταῖς ἄλλαις αἰσθήσεσιν αἴσθοιο, τῶν δὲ κατὰ ταὐτὰ ἐχόντων οὐκ
  ἔστιν ὅτῳ ποτ’ ἂν ἄλλῳ ἐπιλάβοιο ἢ τῷ τῆς διανοίας λογισμῷ, ἀλλ’ ἔστιν ἀιδῆ τὰ τοιαῦτα καὶ οὐχ ὁρατά; παντάπασιν, ἔφη, ἀληθῆ
  λέγεις. θῶμεν οὖν βούλει, ἔφη, δύο εἴδη τῶν ὄντων, τὸ μὲν ὁρατόν, τὸ δὲ ἀιδές; θῶμεν, ἔφη. καὶ τὸ μὲν ἀιδὲς ἀεὶ κατὰ ταὐτὰ
  ἔχον, τὸ δὲ ὁρατὸν μηδέποτε κατὰ ταὐτά; καὶ τοῦτο, ἔφη, θῶμεν. φέρε δή, ἦ δ’ ὅς, ἄλλο τι ἡμῶν αὐτῶν τὸ μὲν σῶμά ἐστι, τὸ
  δὲ ψυχή; οὐδὲν ἄλλο, ἔφη. ποτέρῳ οὖν ὁμοιότερον τῷ εἴδει φαμὲν ἂν εἶναι καὶ συγγενέστερον τὸ σῶμα; παντί, ἔφη, τοῦτό γε
  δῆλον, ὅτι τῷ ὁρατῷ. τί δὲ ἡ ψυχή; ὁρατὸν ἢ ἀιδές; οὐχ ὑπ’ ἀνθρώπων γε, ὦ Σώκρατες, ἔφη. ἀλλὰ μὴν ἡμεῖς γε τὰ ὁρατὰ καὶ
  τὰ μὴ τῇ τῶν ἀνθρώπων φύσει ἐλέγομεν· ἢ ἄλλῃ τινὶ οἴει; τῇ τῶν ἀνθρώπων. τί οὖν περὶ ψυχῆς λέγομεν; ὁρατὸν ἢ ἀόρατον εἶναι;
  οὐχ ὁρατόν. ἀιδὲς ἄρα; ναί. ὁμοιότερον ἄρα ψυχὴ σώματός ἐστιν τῷ ἀιδεῖ, τὸ δὲ τῷ ὁρατῷ. πᾶσα ἀνάγκη, ὦ Σώκρατες. οὐκοῦν
  καὶ τόδε πάλαι ἐλέγομεν, ὅτι ἡ ψυχή, ὅταν μὲν τῷ σώματι προσχρῆται εἰς τὸ σκοπεῖν τι ἢ διὰ τοῦ ὁρᾶν ἢ διὰ τοῦ ἀκούειν ἢ
  δι’ ἄλλης τινὸς αἰσθήσεως — τοῦτο γάρ ἐστιν τὸ διὰ τοῦ σώματος, τὸ δι’ αἰσθήσεως σκοπεῖν τι — τότε μὲν ἕλκεται ὑπὸ τοῦ σώματος
  εἰς τὰ οὐδέποτε κατὰ ταὐτὰ ἔχοντα, καὶ αὐτὴ πλανᾶται καὶ ταράττεται καὶ εἰλιγγιᾷ ὥσπερ μεθύουσα, ἅτε τοιούτων ἐφαπτομένη;
  πάνυ γε. ὅταν δέ γε αὐτὴ καθ’ αὑτὴν σκοπῇ, ἐκεῖσε οἴχεται εἰς τὸ καθαρόν τε καὶ ἀεὶ ὂν καὶ ἀθάνατον καὶ ὡσαύτως ἔχον, καὶ
  ὡς συγγενὴς οὖσα αὐτοῦ ἀεὶ μετ’ ἐκείνου τε γίγνεται, ὅτανπερ αὐτὴ καθ᾽ αὑτὴν γένηται καὶ ἐξῇ αὐτῇ, καὶ πέπαυταί τε τοῦ πλάνου
  καὶ περὶ ἐκεῖνα ἀεὶ κατὰ ταὐτὰ ὡσαύτως ἔχει, ἅτε τοιούτων ἐφαπτομένη· καὶ τοῦτο αὐτῆς τὸ πάθημα φρόνησις κέκληται; παντάπασιν,
  ἔφη, καλῶς καὶ ἀληθῆ λέγεις, ὦ Σώκρατες. ποτέρῳ οὖν αὖ σοι δοκεῖ τῷ εἴδει καὶ ἐκ τῶν πρόσθεν καὶ ἐκ τῶν νῦν λεγομένων ψυχὴ
  ὁμοιότερον εἶναι καὶ συγγενέστερον; πᾶς ἄν μοι δοκεῖ, ἦ δ’ ὅς, συγχωρῆσαι, ὦ Σώκρατες, ἐκ ταύτης τῆς μεθόδου, καὶ ὁ δυσμαθέστατος,
  ὅτι ὅλῳ καὶ παντὶ ὁμοιότερόν ἐστι ψυχὴ τῷ ἀεὶ ὡσαύτως ἔχοντι μᾶλλον ἢ τῷ μή. τί δὲ τὸ σῶμα; τῷ ἑτέρῳ. ΦΑΙΔ. ὅρα δὴ καὶ τῇδε
  ὅτι ἐπειδὰν ἐν τῷ αὐτῷ ὦσι ψυχὴ καὶ σῶμα, τῷ μὲν δουλεύειν καὶ ἄρχεσθαι ἡ φύσις προστάττει, τῇ δὲ ἄρχειν καὶ δεσπόζειν·
  καὶ κατὰ ταῦτα αὖ πότερόν σοι δοκεῖ ὅμοιον τῷ θείῳ εἶναι καὶ πότερον τῷ θνητῷ; ἢ οὐ δοκεῖ σοι τὸ μὲν θεῖον οἷον ἄρχειν τε
  καὶ ἡγεμονεύειν πεφυκέναι, τὸ δὲ θνητὸν ἄρχεσθαί τε καὶ δουλεύειν; ἔμοιγε. ποτέρῳ οὖν ἡ ψυχὴ ἔοικεν; δῆλα δή, ὦ Σώκρατες,
  ὅτι ἡ μὲν ψυχὴ τῷ θείῳ, τὸ δὲ σῶμα τῷ θνητῷ. σκόπει δή, ἔφη, ὦ Κέβης, εἰ ἐκ πάντων τῶν εἰρημένων τάδε ἡμῖν συμβαίνει, τῷ
  μὲν θείῳ καὶ ἀθανάτῳ καὶ νοητῷ καὶ μονοειδεῖ καὶ ἀδιαλύτῳ καὶ ἀεὶ ὡσαύτως κατὰ ταὐτὰ ἔχοντι ἑαυτῷ ὁμοιότατον εἶναι ψυχή,
  τῷ δὲ ἀνθρωπίνῳ καὶ θνητῷ καὶ πολυειδεῖ καὶ ἀνοήτῳ καὶ διαλυτῷ καὶ μηδέποτε κατὰ ταὐτὰ ἔχοντι ἑαυτῷ ὁμοιότατον αὖ εἶναι
  σῶμα. ἔχομέν τι παρὰ ταῦτα ἄλλο λέγειν, ὦ φίλε Κέβης, ᾗ οὐχ οὕτως ἔχει; οὐκ ἔχομεν. τί οὖν; τούτων οὕτως ἐχόντων ἆρ’ οὐχὶ
  σώματι μὲν ταχὺ διαλύεσθαι προσήκει, ψυχῇ δὲ αὖ τὸ παράπαν ἀδιαλύτῳ εἶναι ἢ ἐγγύς τι τούτου;
