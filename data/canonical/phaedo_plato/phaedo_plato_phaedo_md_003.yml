    hoti holō kai panti homoioteron esti psychē tō aei hōsaytōs echonti mallon ē tō mē. ti de to sōma; tō heterō. PhAID. hora
    dē kai tēde hoti epeidan en tō aytō ōsi psychē kai sōma, tō men doyleyein kai archesthai hē physis prostattei, tē de archein
    kai despozein; kai kata tayta ay poteron soi dokei homoion tō theiō einai kai poteron tō thnētō; ē oy dokei soi to men
    theion oion archein te kai hēgemoneyein pephykenai, to de thnēton archesthai te kai doyleyein; emoige. poterō oyn hē psychē
    eoiken; dēla dē, ō Sōkrates, hoti hē men psychē tō theiō, to de sōma tō thnētō. skopei dē, ephē, ō Kebēs, ei ek pantōn
    tōn eirēmenōn tade hēmin symbainei, tō men theiō kai athanatō kai noētō kai monoeidei kai adialytō kai aei hōsaytōs kata
    tayta echonti heaytō homoiotaton einai psychē, tō de anthrōpinō kai thnētō kai polyeidei kai anoētō kai dialytō kai mēdepote
    kata tayta echonti heaytō homoiotaton ay einai sōma. echomen ti para tayta allo legein, ō phile Kebēs, hē oych oytōs echei;
    oyk echomen. ti oyn; toytōn oytōs echontōn ar’ oychi sōmati men tachy dialyesthai prosēkei, psychē de ay to parapan adialytō
    einai ē engys ti toytoy;
