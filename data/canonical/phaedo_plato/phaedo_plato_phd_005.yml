section: Phaedo 89b–90c
sanskrit_devanagari: ''
sanskrit_iast: ''
translation_literal: 'Socrates warns Simmias and Cebes: ''There is a danger, my friends, that we may come
  to hate argument itself (misologian), just as some come to hate mankind. For misology arises in the
  soul in the same way as misanthropy. A man first trusts an argument without skill in refuting it, then
  believes it true, then later finds it false. This happens again and again—until at last he thinks no
  argument sound. But the fault lies not in argument itself but in the man who uses it without art. The
  same applies to arguments about being and becoming, about the Forms. If a man, through inexperience,
  has been deceived by arguments, he may come to despise them. But the wise man will not blame argument;
  he will blame himself and his own lack of skill. He will love argument still, and seek truth through
  it.'' (Paraphrase of 89b–90c)'
commentary: 'This passage diagnoses a spiritual pathology central to Platonic pedagogy. Misologia—hatred
  of argument—represents not mere intellectual frustration but a corruption of the soul''s capacity for
  rational ascent. Socrates locates the disease in repeated disillusionment: the untrained reasoner encounters
  sophistical arguments or poorly-constructed proofs, mistakes them for genuine dialectic, and when they
  collapse, concludes that *all* argument is worthless. The parallel to misanthropy is crucial: just as
  the misanthrope generalizes from particular betrayals to condemn humanity itself, the misologist generalizes
  from particular argumentative failures to condemn reason. Yet Socrates insists the fault lies not in
  logos but in the user''s lack of technē (skill, art). This distinction preserves the Platonic conviction
  that argument, properly wielded through dialectic, remains the soul''s only reliable path to Being and
  the Forms. The passage thus functions as both warning and exhortation: the philosopher must cultivate
  not blind faith in arguments but disciplined love of argument itself, understanding that apparent refutation
  often signals not truth''s absence but one''s own immaturity.


  Key Terms


  **μισολογία** — hatred or distrust of argument, born from repeated disappointment in reasoning.

  **μισανθρωπία** — hatred of human beings, the analogous psychic condition produced by betrayed trust.

  **λόγοι** — arguments or accounts whose apparent truth and later collapse can deform the soul''s confidence
  in reason.


  Cross-Tradition Resonances


  **Buddha, Kālāma Sutta, Aṅguttara Nikāya 3.65:** The Buddha warns hearers not to accept claims merely
  from tradition, reports, or persuasive reasoning, but to test them through discerning inquiry and their
  consequences. Divergence: The sutta directs inquiry toward ethical liberation and experiential verification
  rather than Plato''s dialectical ascent toward stable intelligible truth.

  **Confucius, Analects 2.15:** Confucius teaches that learning without reflection is futile and reflection
  without learning is dangerous, joining disciplined study to critical thought. Divergence: Confucian
  reflection is chiefly ordered toward cultivated judgment and ethical-social formation rather than Socratic
  refutation of arguments about metaphysical realities.

  **Augustine, Contra Academicos 3.20.43:** Augustine resists the Academic skeptic''s despair of attaining
  truth, arguing that the mind must not abandon its rational search because deceptive appearances occur.
  Divergence: Augustine ultimately grounds secure truth in divine illumination and Christian revelation,
  whereas Socrates here treats dialectical discipline itself as the remedy for misology.'
practice: 'When you encounter an argument that seems to refute a truth you hold dear, pause before rejecting
  reasoning itself. Instead, ask: ''Where did *I* fail to follow the argument carefully? What assumption
  did I smuggle in unexamined? What skill in dialectic do I lack?'' Write down the argument''s structure
  step-by-step. Identify the precise point of breakdown. Treat the failure as a lesson in your own incompetence,
  not as evidence that reason is hollow. Return to the question with renewed humility and precision. Over
  time, this practice transforms misology into what Plato calls *philologia*—love of argument—and trains
  the soul to ascend from opinion toward truth.'
