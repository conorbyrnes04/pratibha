sanskrit_devanagari: μὴ γενώμεθα, ἦ δ’ ὅς, μισόλογοι, ὥσπερ οἱ μισάνθρωποι γιγνόμενοι· ὡς οὐκ ἔστιν, ἔφη, ὅτι ἄν τις μεῖζον
  τούτου κακὸν πάθοι ἢ λόγους μισήσας. γίγνεται δὲ ἐκ τοῦ αὐτοῦ τρόπου μισολογία τε καὶ μισανθρωπία. ἥ τε γὰρ μισανθρωπία
  ἐνδύεται ἐκ τοῦ σφόδρα τινὶ πιστεῦσαι ἄνευ τέχνης, καὶ ἡγήσασθαι παντάπασί γε ἀληθῆ εἶναι καὶ ὑγιῆ καὶ πιστὸν τὸν ἄνθρωπον,
  ἔπειτα ὀλίγον ὕστερον εὑρεῖν τοῦτον πονηρόν τε καὶ ἄπιστον, καὶ αὖθις ἕτερον· καὶ ὅταν τοῦτο πολλάκις πάθῃ τις καὶ ὑπὸ τούτων
  μάλιστα οὓς ἂν ἡγήσαιτο οἰκειοτάτους τε καὶ ἑταιροτάτους, τελευτῶν δὴ θαμὰ προσκρούων μισεῖ τε πάντας καὶ ἡγεῖται οὐδενὸς
  οὐδὲν ὑγιὲς εἶναι τὸ παράπαν. ἢ οὐκ ᾔσθησαι σύ πω τοῦτο γιγνόμενον; πάνυ γε, ἦν δ᾽ ἐγώ. οὐκοῦν, ἦ δ’ ὅς, αἰσχρόν, καὶ δῆλον
  ὅτι ἄνευ τέχνης τῆς περὶ τἀνθρώπεια ὁ τοιοῦτος χρῆσθαι ἐπεχείρει τοῖς ἀνθρώποις; ΦΑΙΔ. εἰ γάρ που μετὰ τέχνης ἐχρῆτο, ὥσπερ
  ἔχει οὕτως ἂν ἡγήσατο, τοὺς μὲν χρηστοὺς καὶ πονηροὺς σφόδρα ὀλίγους εἶναι ἑκατέρους, τοὺς δὲ μεταξὺ πλείστους. πῶς λέγεις;
  ἔφην ἐγώ. ὥσπερ, ἦ δ’ ὅς, περὶ τῶν σφόδρα σμικρῶν καὶ μεγάλων· οἴει τι σπανιώτερον εἶναι ἢ σφόδρα μέγαν ἢ σφόδρα σμικρὸν
  ἐξευρεῖν ἄνθρωπον ἢ κύνα ἢ ἄλλο ὁτιοῦν; ἢ αὖ ταχὺν ἢ βραδὺν ἢ αἰσχρὸν ἢ καλὸν ἢ λευκὸν ἢ μέλανα; ἢ οὐχὶ ᾔσθησαι ὅτι πάντων
  τῶν τοιούτων τὰ μὲν ἄκρα τῶν ἐσχάτων σπάνια καὶ ὀλίγα, τὰ δὲ μεταξὺ ἄφθονα καὶ πολλά; πάνυ γε, ἦν δ’ ἐγώ. οὐκοῦν οἴει, ἔφη,
  εἰ πονηρίας ἀγὼν προτεθείη, πάνυ ἂν ὀλίγους καὶ ἐνταῦθα τοὺς πρώτους φανῆναι; εἰκός γε, ἦν δ’ ἐγώ. εἰκὸς γάρ, ἔφη. ἀλλὰ
  ταύτῃ μὲν οὐχ ὅμοιοι οἱ λόγοι τοῖς ἀνθρώποις, ἀλλὰ σοῦ νυνδὴ προάγοντος ἐγὼ ἐφεσπόμην, ἀλλ’ ἐκείνῃ, ᾗ, ἐπειδάν τις πιστεύσῃ
  λόγῳ τινὶ ἀληθεῖ εἶναι ἄνευ τῆς περὶ τοὺς λόγους τέχνης, κἄπειτα ὀλίγον ὕστερον αὐτῷ δόξῃ ψευδὴς εἶναι, ἐνίοτε μὲν ὤν, ἐνίοτε
  δ’ οὐκ ὤν, καὶ αὖθις ἕτερος καὶ ἕτερος· — καὶ μάλιστα δὴ οἱ περὶ τοὺς ἀντιλογικοὺς λόγους διατρίψαντες οἶσθ’ ὅτι τελευτῶντες
  οἴονται σοφώτατοι γεγονέναι καὶ κατανενοηκέναι μόνοι ὅτι οὔτε τῶν πραγμάτων οὐδενὸς οὐδὲν ὑγιὲς οὐδὲ βέβαιον οὔτε τῶν λόγων,
  ἀλλὰ πάντα τὰ ὄντα ἀτεχνῶς ὥσπερ ἐν Εὐρίπῳ ἄνω κάτω στρέφεται καὶ χρόνον οὐδένα ἐν οὐδενὶ μένει. πάνυ μὲν οὖν, ἔφην ἐγώ,
  ἀληθῆ λέγεις. οὐκοῦν, ὦ Φαίδων, ἔφη, οἰκτρὸν ἂν εἴη τὸ πάθος, εἰ ὄντος δή τινος ἀληθοῦς καὶ βεβαίου λόγου καὶ δυνατοῦ κατανοῆσαι,
  ἔπειτα διὰ τὸ παραγίγνεσθαι τοιούτοις τισὶ λόγοις, τοῖς αὐτοῖς τοτὲ μὲν δοκοῦσιν ἀληθέσιν εἶναι, τοτὲ δὲ μή, μὴ ἑαυτόν τις
  αἰτιῷτο μηδὲ τὴν ἑαυτοῦ ἀτεχνίαν, ἀλλὰ τελευτῶν διὰ τὸ ἀλγεῖν ἅσμενος ἐπὶ τοὺς λόγους ἀφ’ ἑαυτοῦ τὴν αἰτίαν ἀπώσαιτο καὶ
  ἤδη τὸν λοιπὸν βίον μισῶν τε καὶ λοιδορῶν τοὺς λόγους διατελοῖ, τῶν δὲ ὄντων τῆς ἀληθείας τε καὶ ἐπιστήμης στερηθείη. νὴ
  τὸν Δία, ἦν δ’ ἐγώ, οἰκτρὸν δῆτα. πρῶτον μὲν τοίνυν, ἔφη, τοῦτο εὐλαβηθῶμεν, καὶ μὴ
sanskrit_iast: mē genōmetha, ē d’ hos, misologoi, hōsper oi misanthrōpoi gignomenoi; hōs oyk estin, ephē, hoti an tis meizon
  toytoy kakon pathoi ē logoys misēsas. gignetai de ek toy aytoy tropoy misologia te kai misanthrōpia. hē te gar misanthrōpia
  endyetai ek toy sphodra tini pisteysai aney technēs, kai hēgēsasthai pantapasi ge alēthē einai kai hygiē kai piston ton
  anthrōpon, epeita oligon hysteron eyrein toyton ponēron te kai apiston, kai aythis heteron; kai hotan toyto pollakis pathē
  tis kai hypo toytōn malista oys an hēgēsaito oikeiotatoys te kai hetairotatoys, teleytōn dē thama proskroyōn misei te pantas
  kai hēgeitai oydenos oyden hygies einai to parapan. ē oyk ēsthēsai sy pō toyto gignomenon; pany ge, ēn d egō. oykoyn, ē
  d’ hos, aischron, kai dēlon hoti aney technēs tēs peri tanthrōpeia ho toioytos chrēsthai epecheirei tois anthrōpois; PhAID.
  ei gar poy meta technēs echrēto, hōsper echei oytōs an hēgēsato, toys men chrēstoys kai ponēroys sphodra oligoys einai hekateroys,
  toys de metaxy pleistoys. pōs legeis; ephēn egō. hōsper, ē d’ hos, peri tōn sphodra smikrōn kai megalōn; oiei ti spaniōteron
  einai ē sphodra megan ē sphodra smikron exeyrein anthrōpon ē kyna ē allo hotioyn; ē ay tachyn ē bradyn ē aischron ē kalon
  ē leykon ē melana; ē oychi ēsthēsai hoti pantōn tōn toioytōn ta men akra tōn eschatōn spania kai oliga, ta de metaxy aphthona
  kai polla; pany ge, ēn d’ egō. oykoyn oiei, ephē, ei ponērias agōn protetheiē, pany an oligoys kai entaytha toys prōtoys
  phanēnai; eikos ge, ēn d’ egō. eikos gar, ephē. alla taytē men oych homoioi oi logoi tois anthrōpois, alla soy nyndē proagontos
  egō ephespomēn, all’ ekeinē, hē, epeidan tis pisteysē logō tini alēthei einai aney tēs peri toys logoys technēs, kapeita
  oligon hysteron aytō doxē pseydēs einai, eniote men ōn, eniote d’ oyk ōn, kai aythis heteros kai heteros; — kai malista
  dē oi peri toys antilogikoys logoys diatripsantes oisth’ hoti teleytōntes oiontai sophōtatoi gegonenai kai katanenoēkenai
  monoi hoti oyte tōn pragmatōn oydenos oyden hygies oyde bebaion oyte tōn logōn, alla panta ta onta atechnōs hōsper en Eyripō
  anō katō strephetai kai chronon oydena en oydeni menei. pany men oyn, ephēn egō, alēthē legeis. oykoyn, ō Phaidōn, ephē,
  oiktron an eiē to pathos, ei ontos dē tinos alēthoys kai bebaioy logoy kai dynatoy katanoēsai, epeita dia to paragignesthai
  toioytois tisi logois, tois aytois tote men dokoysin alēthesin einai, tote de mē, mē heayton tis aitiōto mēde tēn heaytoy
  atechnian, alla teleytōn dia to algein hasmenos epi toys logoys aph’ heaytoy tēn aitian apōsaito kai ēdē ton loipon bion
  misōn te kai loidorōn toys logoys diateloi, tōn de ontōn tēs alētheias te kai epistēmēs sterētheiē. nē ton Dia, ēn d’ egō,
  oiktron dēta. prōton men toinyn, ephē, toyto eylabēthōmen, kai mē
translation_literal: 'Socrates warns against misology — hatred of arguments — as among the worst fates. Like misanthropy born
  of naive trust then repeated betrayal, misology arises when a person believes argument after argument and then finds them
  false, finally declaring all logos unstable as the Euripus tides. The cure is not cynicism but experience: few are wholly
  sound or wholly false; most are in between — and skill in dialectic is required.'
commentary: 'The danger after a failed proof is not only being wrong — it is swearing off inquiry. Socrates pairs misology
  with misanthropy: both are traumas of over-trust followed by totalized despair. Arguments, like persons, are mostly middling;
  experience grades them instead of burning the library. The contested claim is that intellectual despair is ethically discreditable,
  a failure of dialectical character. Existentially: after disillusionment with a teacher, book, or method, do you refine
  criteria or declare all logos Euripus-tides? The dialogue protects philosophy from its own burnout just before harder proofs
  begin. The passage asks for recognition before consolation. The passage asks for recognition before consolation. The passage
  asks for recognition before consolation. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation. The passage asks for recognition before consolation.


  Key Terms


  **misologia** — hatred of argument/logos.


  **misanthrōpia** — structural twin: hatred of persons after betrayal.


  **empeiria** — experience that grades rather than totalizes.


  Cross-Tradition Resonances


  **Nāgārjuna (caution against nihilist reading of emptiness):** Both warn that critique can tip into sterility.

  *Divergence:* Madhyamaka targets ontological grasping; Socrates targets dialectic burnout.


  **Francis Bacon (idols) / modern conspiracy fatigue:** Both diagnose overgeneralized distrust.

  *Divergence:* Bacon seeks method reform; Socrates seeks character reform in the interlocutor.'
insight: The danger after a failed proof is not only being wrong — it is swearing off inquiry.
practice: Recall one argument you now dismiss wholesale. Write one steelman sentence for it before keeping your critique.
