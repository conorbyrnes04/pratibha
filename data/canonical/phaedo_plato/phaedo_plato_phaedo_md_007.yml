  items:
  - term: meletē thanatou
    definition: '‘practice/rehearsal of death’ → philosophy as training to loosen identity with the perishable Here: Socrates''
      final request about the cock to Asclepius seals the teaching: death is not theatrical despair but lucid completion,
      gratitude, and unbroken ethical a… Trap: morbid death-obsession'
  - term: eidos / Form (εἶδος)
    definition: '‘form, look, kind’ → intelligible standard (Equal itself, etc.) that sensibles approximate Here: But Socrates
      refuses to let fear govern form. Trap: shape or species in the biologist’s sense'
    lemma_id: nous
  - term: psychē (ψυχή)
    definition: '‘soul, life-principle’ → immortal knowing principle separable in practice from body Here: The dialogue closes
      by shifting from argument to embodiment: what one believes about soul must be lived as care, composure, and duty. Trap:
      Cartesian ghost; modern psychology'
    lemma_id: psyche
