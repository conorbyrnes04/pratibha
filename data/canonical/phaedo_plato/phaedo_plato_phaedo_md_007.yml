sanskrit_devanagari: μανθάνω, ἦ δ’ ὅς· ἀλλ’ εὔχεσθαί γέ που τοῖς θεοῖς ἔξεστί τε καὶ χρή, τὴν μετοίκησιν τὴν ἐνθένδε ἐκεῖσε
  εὐτυχῆ γενέσθαι· ἃ δὴ καὶ ἐγὼ εὔχομαί τε καὶ γένοιτο ταύτῃ. καὶ ἅμ’ εἰπὼν ταῦτα ἐπισχόμενος καὶ μάλα εὐχερῶς καὶ εὐκόλως
  ἐξέπιεν. καὶ ἡμῶν οἱ πολλοὶ τέως μὲν ἐπιεικῶς οἷοί τε ἦσαν κατέχειν τὸ μὴ δακρύειν, ὡς δὲ εἴδομεν πίνοντά τε καὶ πεπωκότα,
  οὐκέτι, ἀλλ’ ἐμοῦ γε βίᾳ καὶ αὐτοῦ ἀστακτὶ ἐχώρει τὰ δάκρυα, ὥστε ἐγκαλυψάμενος ἀπέκλαον ἐμαυτόν — οὐ γὰρ δὴ ἐκεῖνόν γε,
  ἀλλὰ τὴν ἐμαυτοῦ τύχην, οἵου ἀνδρὸς ἑταίρου ἐστερημένος εἴην. ὁ δὲ Κρίτων ἔτι πρότερος ἐμοῦ, ἐπειδὴ οὐχ οἷός τ’ ἦν κατέχειν
  τὰ δάκρυα, ἐξανέστη. Ἀπολλόδωρος δὲ καὶ ἐν τῷ ἔμπροσθεν χρόνῳ οὐδὲν ἐπαύετο δακρύων, καὶ δὴ καὶ τότε ἀναβρυχησάμενος κλάων
  καὶ ἀγανακτῶν οὐδένα ὅντινα οὐ κατέκλασε τῶν παρόντων πλήν γε αὐτοῦ Σωκράτους. ἐκεῖνος δέ, οἷα, ἔφη, ποιεῖτε, ὦ θαυμάσιοι.
  ἐγὼ μέντοι οὐχ ἥκιστα τούτου ἕνεκα τὰς γυναῖκας ἀπέπεμψα, ἵνα μὴ τοιαῦτα πλημμελοῖεν· καὶ γὰρ ἀκήκοα ὅτι ἐν εὐφημίᾳ χρὴ
  τελευτᾶν. ἀλλ’ ἡσυχίαν τε ἄγετε καὶ καρτερεῖτε. καὶ ἡμεῖς ἀκούσαντες ᾐσχύνθημέν τε καὶ ἐπέσχομεν τοῦ δακρύειν. ὁ δὲ περιελθών,
  ἐπειδή οἱ βαρύνεσθαι ἔφη τὰ σκέλη, κατεκλίνη ὕπτιος — οὕτω γὰρ ἐκέλευεν ὁ ἄνθρωπος — καὶ ἅμα ἐφαπτόμενος αὐτοῦ οὗτος ὁ δοὺς
  τὸ φάρμακον, διαλιπὼν χρόνον ἐπεσκόπει τοὺς πόδας καὶ τὰ σκέλη, κἄπειτα σφόδρα πιέσας αὐτοῦ τὸν πόδα ἤρετο εἰ αἰσθάνοιτο,
  ὁ δ’ οὐκ ἔφη. ΦΑΙΔ. καὶ μετὰ τοῦτο αὖθις τὰς κνήμας· καὶ ἐπανιὼν οὕτως ἡμῖν ἐπεδείκνυτο ὅτι ψύχοιτό τε καὶ πήγνυτο. καὶ
  αὐτὸς ἥπτετο καὶ εἶπεν ὅτι, ἐπειδὰν πρὸς τῇ καρδίᾳ γένηται αὐτῷ, τότε οἰχήσεται. ἤδη οὖν σχεδόν τι αὐτοῦ ἦν τὰ περὶ τὸ ἦτρον
  ψυχόμενα, καὶ ἐκκαλυψάμενος — ἐνεκεκάλυπτο γάρ — εἶπεν — ὃ δὴ τελευταῖον ἐφθέγξατο — ὦ Κρίτων, ἔφη, τῷ Ἀσκληπιῷ ὀφείλομεν
  ἀλεκτρυόνα· ἀλλὰ ἀπόδοτε καὶ μὴ ἀμελήσητε. ἀλλὰ ταῦτα, ἔφη, ἔσται, ὁ Κρίτων· ἀλλ᾽ ὅρα εἴ τι ἄλλο λέγεις. ταῦτα ἐρομένου
  αὐτοῦ οὐδὲν ἔτι ἀπεκρίνατο, ἀλλ’ ὀλίγον χρόνον διαλιπὼν ἐκινήθη τε καὶ ὁ ἄνθρωπος ἐξεκάλυψεν αὐτόν, καὶ ὃς τὰ ὄμματα ἔστησεν·
  ἰδὼν δὲ ὁ Κρίτων συνέλαβε τὸ στόμα καὶ τοὺς ὀφθαλμούς. ἥδε ἡ τελευτή, ὦ Ἐχέκρατες, τοῦ ἑταίρου ἡμῖν ἐγένετο, ἀνδρός, ὡς
  ἡμεῖς φαῖμεν ἄν, τῶν τότε ὧν ἐπειράθημεν ἀρίστου καὶ ἄλλως φρονιμωτάτου καὶ δικαιοτάτου.
sanskrit_iast: manthanō, ē d’ hos; all’ eychesthai ge poy tois theois exesti te kai chrē, tēn metoikēsin tēn enthende ekeise
  eytychē genesthai; ha dē kai egō eychomai te kai genoito taytē. kai ham’ eipōn tayta epischomenos kai mala eycherōs kai
  eykolōs exepien. kai hēmōn oi polloi teōs men epieikōs oioi te ēsan katechein to mē dakryein, hōs de eidomen pinonta te
  kai pepōkota, oyketi, all’ emoy ge bia kai aytoy astakti echōrei ta dakrya, hōste enkalypsamenos apeklaon emayton — oy gar
  dē ekeinon ge, alla tēn emaytoy tychēn, oioy andros hetairoy esterēmenos eiēn. ho de Kritōn eti proteros emoy, epeidē oych
  oios t’ ēn katechein ta dakrya, exanestē. Apollodōros de kai en tō emprosthen chronō oyden epayeto dakryōn, kai dē kai tote
  anabrychēsamenos klaōn kai aganaktōn oydena hontina oy kateklase tōn parontōn plēn ge aytoy Sōkratoys. ekeinos de, oia,
  ephē, poieite, ō thaymasioi. egō mentoi oych hēkista toytoy heneka tas gynaikas apepempsa, hina mē toiayta plēmmeloien;
  kai gar akēkoa hoti en eyphēmia chrē teleytan. all’ hēsychian te agete kai kartereite. kai hēmeis akoysantes ēschynthēmen
  te kai epeschomen toy dakryein. ho de perielthōn, epeidē oi barynesthai ephē ta skelē, kateklinē hyptios — oytō gar ekeleyen
  ho anthrōpos — kai hama ephaptomenos aytoy oytos ho doys to pharmakon, dialipōn chronon epeskopei toys podas kai ta skelē,
  kapeita sphodra piesas aytoy ton poda ēreto ei aisthanoito, ho d’ oyk ephē. PhAID. kai meta toyto aythis tas knēmas; kai
  epaniōn oytōs hēmin epedeiknyto hoti psychoito te kai pēgnyto. kai aytos hēpteto kai eipen hoti, epeidan pros tē kardia
  genētai aytō, tote oichēsetai. ēdē oyn schedon ti aytoy ēn ta peri to ētron psychomena, kai ekkalypsamenos — enekekalypto
  gar — eipen — ho dē teleytaion ephthenxato — ō Kritōn, ephē, tō Asklēpiō opheilomen alektryona; alla apodote kai mē amelēsēte.
  alla tayta, ephē, estai, ho Kritōn; all hora ei ti allo legeis. tayta eromenoy aytoy oyden eti apekrinato, all’ oligon chronon
  dialipōn ekinēthē te kai ho anthrōpos exekalypsen ayton, kai hos ta ommata estēsen; idōn de ho Kritōn synelabe to stoma
  kai toys ophthalmoys. hēde hē teleytē, ō Echekrates, toy hetairoy hēmin egeneto, andros, hōs hēmeis phaimen an, tōn tote
  hōn epeirathēmen aristoy kai allōs phronimōtatoy kai dikaiotatoy.
translation_literal: 'The dialogue closes by shifting from argument to embodiment: what one believes about soul must be lived
  as care, composure, and duty. Socrates'' final request about the cock to Asclepius seals the teaching: death is not theatrical
  despair but lucid completion, gratitude, and unbroken ethical attention to the last moment.'
commentary: 'The claim is that philosophical truth is verified in comportment under extremity. Socrates'' counterintuitive
  move is to make his death scene anti-dramatic: no metaphysical exhibitionism, only steadiness, conversation, concern for
  others, and exactness about obligations. This is not emotional suppression; grief is present in the companions. But Socrates
  refuses to let fear govern form.


  The Asclepius offering has generated centuries of interpretation because it compresses the whole dialogue into a symbol:
  whether read as cure from bodily life, cure from ignorance, or completion of piety, the point is continuity between doctrine
  and action. The man who argued about soul does not abandon practical debts.


  Existentially, this ending reframes spiritual seriousness. Grand views about immortality are easy in abstraction and difficult
  in the hospital room, courtroom, or family crisis. *Phaedo* ends by binding metaphysics to micro-ethics: speak truthfully,
  calm others, honor commitments, and meet necessity without theatrical ego. For modern practitioners, this may be Socrates''
  most demanding lesson: the final test of thought is style of presence when control is gone.


  Key Terms:


  **euthymia (εὐθυμία)** - good-spirited composure -> not denial of pain, but ordered interiority under pressure -> "calm"
  alone misses ethical-ontological depth.


  **pharmakon (φάρμακον)** - drug/remedy/poison -> the hemlock is materially poison yet philosophically framed as transition-marker
  -> binary readings ("only poison" or "only cure") miss the ambiguity Plato preserves.


  **opheilema (ὀφείλημα)** - debt/obligation -> Socrates'' final concern with owed duty grounds philosophy in accountability
  -> "debt" as merely financial misses moral resonance.


  **asklepios (Ἀσκληπιός)** - god of healing -> invocation at death suggests healing is interpreted beyond bodily prolongation
  -> this symbolic register is central to the dialogue''s closure.'
insight: The claim is that philosophical truth is verified in comportment under extremity.
practice: Before sleep, write one unresolved obligation ("cock to Asclepius") and complete it within 24 hours, treating follow-through
  as contemplative integrity rather than productivity.
