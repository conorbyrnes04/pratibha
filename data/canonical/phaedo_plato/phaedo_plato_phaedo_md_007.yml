sanskrit_devanagari: ὦ Κρίτων, ἔφη, τῷ Ἀσκληπιῷ ὀφείλομεν ἀλεκτρυόνα· ἀλλὰ ἀπόδοτε καὶ μὴ ἀμελήσητε.
sanskrit_iast: Not applicable (Greek text). Key Greek terms are given in script and transliteration in
  Key Terms.
translation_literal: 'The dialogue closes by moving from argument to lived practice: what one believes
  about the soul must be enacted through proper conduct and composure. Socrates'' final words about owing
  a cock to Asclepius demonstrate that even at death''s threshold, one must fulfill religious obligations
  and maintain clarity rather than succumb to theatrical despair—death is approached with calm attention
  to duty.'
commentary: 'The claim is that philosophical truth is verified in comportment under extremity. Socrates''
  counterintuitive move is to make his death scene anti-dramatic: no metaphysical exhibitionism, only
  steadiness, conversation, concern for others, and exactness about obligations. This is not emotional
  suppression; grief is present in the companions. But Socrates refuses to let fear govern form.


  The Asclepius offering has generated centuries of interpretation because it compresses the whole dialogue
  into a symbol: whether read as cure from bodily life, cure from ignorance, or completion of piety, the
  point is continuity between doctrine and action. The man who argued about soul does not abandon practical
  debts.


  Existentially, this ending reframes spiritual seriousness. Grand views about immortality are easy in
  abstraction and difficult in the hospital room, courtroom, or family crisis. *Phaedo* ends by binding
  metaphysics to micro-ethics: speak truthfully, calm others, honor commitments, and meet necessity without
  theatrical ego. For modern practitioners, this may be Socrates'' most demanding lesson: the final test
  of thought is style of presence when control is gone.


  Key Terms:


  **euthymia (εὐθυμία)** - good-spirited composure -> not denial of pain, but ordered interiority under
  pressure -> "calm" alone misses ethical-ontological depth.


  **pharmakon (φάρμακον)** - drug/remedy/poison -> the hemlock is materially poison yet philosophically
  framed as transition-marker -> binary readings ("only poison" or "only cure") miss the ambiguity Plato
  preserves.


  **opheilema (ὀφείλημα)** - debt/obligation -> Socrates'' final concern with owed duty grounds philosophy
  in accountability -> "debt" as merely financial misses moral resonance.


  **asklepios (Ἀσκληπιός)** - god of healing -> invocation at death suggests healing is interpreted beyond
  bodily prolongation -> this symbolic register is central to the dialogue''s closure.


  Cross-Tradition Resonances:


  **Bhagavad Gita 2.55-2.72 (sthitaprajna profile):** Both portray steady consciousness under loss and
  mortality.

  *Divergence:* Gita''s frame is warrior-duty and devotion; *Phaedo* stages civic execution and dialectical
  legacy.


  **Marcus Aurelius, Meditations 2.17 and 3.3:** Both insist death should be met without panic and with
  attention to present duty.

  *Divergence:* Stoic cosmology is immanent-rational rather than Form-and-soul immortality centered.


  **Zen death poems (jisei) tradition:** Both honor lucidity and concise final expression at death.

  *Divergence:* Zen style often strips metaphysical argument; *Phaedo* culminates after prolonged dialectical
  justification.


  Key Terms


  **ὀφείλομεν** — we owe; an obligation that remains binding at the moment of death.

  **ἀλεκτρυόνα** — a cock, the customary sacrificial offering owed to Asclepius.

  **ἀπόδοτε** — pay it back; Socrates makes fulfillment of a concrete duty his final concern.

  **μὴ ἀμελήσητε** — do not neglect it; ethical attentiveness must not lapse even after his death.


  Cross-Tradition Resonances


  **Dīgha Nikāya 16, Mahāparinibbāna Sutta:** The Buddha’s final injunction to strive with diligence parallels
  Socrates’ last insistence that companions faithfully complete an obligation rather than yield to grief
  or disorder. Divergence: The Buddhist text denies any permanent soul, whereas the Phaedo frames composure
  before death through arguments for the soul’s survival.

  **Bhagavad Gītā 2.27 and 2.47:** The Gītā joins acceptance of inevitable death with unwavering performance
  of one’s assigned duty, much as Socrates’ final words make ethical exactness inseparable from mortality.
  Divergence: Krishna grounds duty in dharma and devotion to God, while Socrates’ request concerns a particular
  civic-religious debt and philosophical confidence in the soul.

  **John 19:30:** Jesus’ final declaration that his work is completed resembles Socrates’ anti-theatrical
  closure, in which death is met as the lucid finishing of an obligation rather than as defeat. Divergence:
  John presents Jesus’ death as a redemptive event for others, whereas Socrates’ death remains a philosophical
  and personal enactment of disciplined care.'
insight: The claim is that philosophical truth is verified in comportment under extremity.
practice: Before sleep, write one unresolved obligation ("cock to Asclepius") and complete it within 24
  hours, treating follow-through as contemplative integrity rather than productivity.
