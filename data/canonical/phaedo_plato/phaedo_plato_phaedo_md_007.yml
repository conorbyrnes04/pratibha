- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 2.55-2.72 (sthitaprajna profile)
    resonance: Both portray steady consciousness under loss and mortality.
    divergence: Gita's frame is warrior-duty and devotion; *Phaedo* stages civic execution and dialectical legacy.
    passage_id: ''
  - citation: Marcus Aurelius, Meditations 2.17 and 3.3
    resonance: Both insist death should be met without panic and with attention to present duty.
    divergence: Stoic cosmology is immanent-rational rather than Form-and-soul immortality centered.
    passage_id: ''
  - citation: Zen death poems (jisei) tradition
    resonance: Both honor lucidity and concise final expression at death.
    divergence: Zen style often strips metaphysical argument; *Phaedo* culminates after prolonged dialectical justification.
    passage_id: ''
