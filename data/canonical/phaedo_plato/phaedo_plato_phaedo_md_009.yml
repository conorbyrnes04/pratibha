title: The Living Come from the Dead
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Greek not line-aligned in this pass; body follows Jowett.'
sanskrit_iast: Not applicable (Greek). Key terms in commentary.
translation_literal: 'Socrates recalls an ancient doctrine: souls go to the other world and are born again from the dead.
  If the living come from the dead, souls must already exist elsewhere — otherwise rebirth is impossible. The cyclical argument
  treats generation as reciprocal: each opposite arises from its opposite, so life and death trade places rather than terminating
  in blank annihilation.'
commentary: 'The claim is cosmological before it is consoling: becoming is reciprocal, not linear extinction. If waking comes
  from sleeping, and living from the dead, then death is a station in a circuit rather than a trash-heap of persons. Socrates
  uses the ancient rebirth doctrine as a hinge, then tightens it with the generation of opposites so that soul-persistence
  is argued, not merely wished. The contested move is to treat cyclical generation as evidence rather than folklore. Existentially:
  when something ends, ask what opposite it may be generating — without forcing optimism or denying grief. The discipline
  is to keep endings inside a world of transformation instead of blank annihilation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before consolation. The
  passage asks for recognition before consolation. The passage asks for recognition before consolation. The passage asks for
  recognition before consolation.


  Key Terms


  **παλαιὸς λόγος** — “ancient account/doctrine,” the inherited teaching that souls return from the dead.

  **ἀναβιώσκονται** — “come to life again,” expressing rebirth rather than a merely postmortem survival.

  **τὰ ἐναντία** — “the opposites,” whose reciprocal generation supplies the argument’s cosmological structure.

  **ἐκ τῶν τεθνεώτων** — “from the dead,” the crucial premise that the living arise from those who have died.


  Cross-Tradition Resonances


  **Heraclitus, fragment B88 (Diels-Kranz):** Heraclitus joins living and dead, waking and sleeping, in a reciprocal transformation
  of opposites, closely anticipating Socrates’ appeal to cyclical becoming. Divergence: Heraclitus describes an ever-changing
  unity of opposites rather than arguing for the continued existence of individual souls.

  **Bhagavad Gītā 2.22:** The Gītā depicts the embodied self as taking new bodies after discarding old ones, paralleling the
  Phaedo’s use of rebirth against extinction. Divergence: The Gītā grounds transmigration in an eternal and unchanging ātman,
  whereas Socrates here infers soul-survival from the reciprocal generation of living and dead.

  **Saṃyutta Nikāya 12.1, Nidānasaṃyutta:** Early Buddhist dependent origination makes birth and death recurrently conditioned
  processes, sharing the Phaedo’s rejection of a simple linear passage from life into nothingness. Divergence: Buddhism denies
  a permanent soul that travels through the cycle, while Socrates’ argument specifically requires persisting souls in Hades.'
insight: 'The claim is cosmological before it is consoling: becoming is reciprocal, not linear extinction.'
practice: Name one ending from this week. Write one sentence on what it may be generating, then leave the sentence unclosed.
