  label: Key Terms
  items:
  - term: psychē (ψυχή)
    definition: '‘soul, life-principle’ → immortal knowing principle separable in practice from body Here: Socrates recalls
      an ancient doctrine: souls go to the other world and are born again from the dead. Trap: Cartesian ghost; modern psychology'
    lemma_id: psyche
    sense_id: 1.5
  - term: meletē thanatou
    definition: '‘practice/rehearsal of death’ → philosophy as training to loosen identity with the perishable Here: The cyclical
      argument treats generation as reciprocal: each opposite arises from its opposite, so life and death trade places rather
      than terminating in blank… Trap: morbid death-obsession'
