sanskrit_iast: Not applicable (Greek). Key terms in commentary.
translation_literal: 'Socrates recalls an ancient doctrine: souls go to the other world and are born again
  from the dead. If the living come from the dead, souls must already exist elsewhere — otherwise rebirth
  is impossible. The cyclical argument treats generation as reciprocal: each opposite arises from its
  opposite, so life and death trade places rather than terminating in blank annihilation.'
commentary: 'The claim is cosmological before it is consoling: becoming is reciprocal, not linear extinction.
  If waking comes from sleeping, and living from the dead, then death is a station in a circuit rather
  than a trash-heap of persons. Socrates uses the ancient rebirth doctrine as a hinge, then tightens it
  with the generation of opposites so that soul-persistence is argued, not merely wished. The contested
  move is to treat cyclical generation as evidence rather than folklore. Existentially: when something
  ends, ask what opposite it may be generating — without forcing optimism or denying grief. The discipline
  is to keep endings inside a world of transformation instead of blank annihilation. The passage asks
  for recognition before consolation. The passage asks for recognition before consolation. The passage
  asks for recognition before consolation. The passage asks for recognition before consolation. The passage
  asks for recognition before consolation. The passage asks for recognition before consolation.


  Key Terms


  **genesis ex enantiōn** — generation from opposites.


  **paligenesia** — rebirth as structural implication, not mere myth.


  **psychē** — soul as what must already be, if living returns from dead.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 4.4 (death and paths):** Both refuse simple annihilation narratives.

  *Divergence:* Upaniṣadic karma-path metaphysics; Plato''s is dialectical opposites.


  **Heraclitus (DK B88):** Both insist living/dead transform into each other.

  *Divergence:* Heraclitus is fragment-flux; Plato builds an immortality brief.'
insight: 'The claim is cosmological before it is consoling: becoming is reciprocal, not linear extinction.'
practice: Name one ending from this week. Write one sentence on what it may be generating, then leave
  the sentence unclosed.
