sanskrit_devanagari: σκεψώμεθα δὲ αὐτὸ τῇδέ πῃ, εἴτ’ ἄρα ἐν Ἅιδου εἰσὶν αἱ ψυχαὶ τελευτησάντων τῶν ἀνθρώπων εἴτε καὶ οὔ. παλαιὸς
  μὲν οὖν ἔστι τις λόγος οὗ μεμνήμεθα, ὡς εἰσὶν ἐνθένδε ἀφικόμεναι ἐκεῖ, καὶ πάλιν γε δεῦρο ἀφικνοῦνται καὶ γίγνονται ἐκ τῶν
  τεθνεώτων· καὶ εἰ τοῦθ’ οὕτως ἔχει, πάλιν γίγνεσθαι ἐκ τῶν ἀποθανόντων τοὺς ζῶντας, ἄλλο τι ἢ εἶεν ἂν αἱ ψυχαὶ ἡμῶν ἐκεῖ;
  οὐ γὰρ ἄν που πάλιν ἐγίγνοντο μὴ οὖσαι, καὶ τοῦτο ἱκανὸν τεκμήριον τοῦ ταῦτ’ εἶναι, εἰ τῷ ὄντι φανερὸν γίγνοιτο ὅτι οὐδαμόθεν
  ἄλλοθεν γίγνονται οἱ ζῶντες ἢ ἐκ τῶν τεθνεώτων· εἰ δὲ μὴ ἔστι τοῦτο, ἄλλου ἄν του δέοι λόγου. πάνυ μὲν οὖν, ἔφη ὁ Κέβης.
  μὴ τοίνυν κατ᾽ ἀνθρώπων, ἦ δ’ ὅς, σκόπει μόνον τοῦτο, εἰ βούλει ῥᾷον μαθεῖν, ἀλλὰ καὶ κατὰ ζῴων πάντων καὶ φυτῶν, καὶ συλλήβδην
  ὅσαπερ ἔχει γένεσιν περὶ πάντων ἴδωμεν ἆρ’ οὑτωσὶ γίγνεται πάντα, οὐκ ἄλλοθεν ἢ ἐκ τῶν ἐναντίων τὰ ἐναντία, ὅσοις τυγχάνει
  ὂν τοιοῦτόν τι, οἷον τὸ καλὸν τῷ αἰσχρῷ ἐναντίον που καὶ δίκαιον ἀδίκῳ, καὶ ἄλλα δὴ μυρία οὕτως ἔχει. τοῦτο οὖν σκεψώμεθα,
  ἆρα ἀναγκαῖον ὅσοις ἔστι τι ἐναντίον, μηδαμόθεν ἄλλοθεν αὐτὸ γίγνεσθαι ἢ ἐκ τοῦ αὐτῷ ἐναντίου. οἷον ὅταν μεῖζόν τι γίγνηται,
  ἀνάγκη που ἐξ ἐλάττονος ὄντος πρότερον ἔπειτα μεῖζον γίγνεσθαι; ναί. ΦΑΙΔ. οὐκοῦν κἂν ἔλαττον γίγνηται, ἐκ μείζονος ὄντος
  πρότερον ὕστερον ἔλαττον γενήσεται; ἔστιν οὕτω, ἔφη. καὶ μὴν ἐξ ἰσχυροτέρου γε τὸ ἀσθενέστερον καὶ ἐκ βραδυτέρου τὸ θᾶττον;
  πάνυ γε. τί δέ; ἄν τι χεῖρον γίγνηται, οὐκ ἐξ ἀμείνονος, καὶ ἂν δικαιότερον, ἐξ ἀδικωτέρου; πῶς γὰρ οὔ; ἱκανῶς οὖν, ἔφη,
  ἔχομεν τοῦτο, ὅτι πάντα οὕτω γίγνεται, ἐξ ἐναντίων τὰ ἐναντία πράγματα; πάνυ γε. τί δ’ αὖ; ἔστι τι καὶ τοιόνδε ἐν αὐτοῖς,
  οἷον μεταξὺ ἀμφοτέρων πάντων τῶν ἐναντίων δυοῖν ὄντοιν δύο γενέσεις, ἀπὸ μὲν τοῦ ἑτέρου ἐπὶ τὸ ἕτερον, ἀπὸ δ’ αὖ τοῦ ἑτέρου
  πάλιν ἐπὶ τὸ ἕτερον· μείζονος μὲν πράγματος καὶ ἐλάττονος μεταξὺ αὔξησις καὶ φθίσις, καὶ καλοῦμεν οὕτω τὸ μὲν αὐξάνεσθαι,
  τὸ δὲ φθίνειν; ναί, ἔφη. οὐκοῦν καὶ διακρίνεσθαι καὶ συγκρίνεσθαι, καὶ ψύχεσθαι καὶ θερμαίνεσθαι, καὶ πάντα οὕτω, κἂν εἰ
  μὴ χρώμεθα τοῖς ὀνόμασιν ἐνιαχοῦ, ἀλλ’ ἔργῳ γοῦν πανταχοῦ οὕτως ἔχειν ἀναγκαῖον, γίγνεσθαί τε αὐτὰ ἐξ ἀλλήλων γένεσίν τε
  εἶναι ἑκατέρου εἰς ἄλληλα; πάνυ μὲν οὖν, ἦ δ᾽ ὅς. τί οὖν; ἔφη, τῷ ζῆν ἐστί τι ἐναντίον, ὥσπερ τῷ ἐγρηγορέναι τὸ καθεύδειν;
  πάνυ μὲν οὖν, ἔφη. τί; τὸ τεθνάναι, ἔφη. οὐκοῦν ἐξ ἀλλήλων τε γίγνεται ταῦτα, εἴπερ ἐναντία ἐστιν, καὶ αἱ γενέσεις εἰσὶν
  αὐτοῖν μεταξὺ δύο δυοῖν ὄντοιν; πῶς γὰρ οὔ; τὴν μὲν τοίνυν ἑτέραν συζυγίαν ὧν νυνδὴ ἔλεγον ἐγώ σοι, ἔφη, ἐρῶ, ὁ Σωκράτης,
  καὶ αὐτὴν καὶ τὰς γενέσεις· σὺ δέ μοι τὴν ἑτέραν. λέγω δὲ τὸ μὲν καθεύδειν, τὸ δὲ ἐγρηγορέναι, καὶ ἐκ τοῦ καθεύδειν τὸ ἐγρηγορέναι
  γίγνεσθαι καὶ ἐκ τοῦ ἐγρηγορέναι τὸ καθεύδειν, καὶ τὰς γενέσεις αὐτοῖν τὴν μὲν καταδαρθάνειν εἶναι, τὴν δ’ ἀνεγείρεσθαι.
  ἱκανῶς σοι, ἔφη, ἢ οὔ; πάνυ μὲν οὖν. λέγε δή μοι καὶ σύ, ἔφη, οὕτω περὶ ζωῆς καὶ θανάτου. οὐκ ἐναντίον μὲν φῂς τῷ ζῆν τὸ
  τεθνάναι εἶναι; ἔγωγε. γίγνεσθαι δὲ ἐξ ἀλλήλων; ναί. ἐξ οὖν τοῦ ζῶντος τί τὸ γιγνόμενον; τὸ τεθνηκός, ἔφη. τί δέ, ἦ δ’ ὅς,
  ἐκ τοῦ τεθνεῶτος; ἀναγκαῖον, ἔφη, ὁμολογεῖν ὅτι τὸ ζῶν. ἐκ τῶν τεθνεώτων ἄρα, ὦ Κέβης, τὰ ζῶντά τε καὶ οἱ ζῶντες γίγνονται;
  φαίνεται, ἔφη. εἰσὶν ἄρα, ἔφη, αἱ ψυχαὶ ἡμῶν ἐν Ἅιδου. ἔοικεν. οὐκοῦν καὶ τοῖν γενεσέοιν τοῖν περὶ ταῦτα ἥ γ’ ἑτέρα σαφὴς
  οὖσα τυγχάνει; τὸ γὰρ ἀποθνῄσκειν σαφὲς δήπου, ἢ οὔ; πάνυ μὲν οὖν, ἔφη. πῶς οὖν, ἦ δ’ ὅς, ποιήσομεν; οὐκ ἀνταποδώσομεν τὴν
  ἐναντίαν γένεσιν, ἀλλὰ ταύτῃ χωλὴ ἔσται ἡ φύσις; ἢ ἀνάγκη ἀποδοῦναι τῷ ἀποθνῄσκειν ἐναντίαν τινὰ γένεσιν; πάντως που, ἔφη.
  τίνα ταύτην; τὸ ἀναβιώσκεσθαι. ΦΑΙΔ. οὐκοῦν, ἦ δ’ ὅς, εἴπερ ἔστι τὸ ἀναβιώσκεσθαι, ἐκ τῶν τεθνεώτων ἂν εἴη γένεσις εἰς τοὺς
  ζῶντας αὕτη, τὸ ἀναβιώσκεσθαι; πάνυ γε. ὁμολογεῖται ἄρα ἡμῖν καὶ ταύτῃ τοὺς ζῶντας ἐκ τῶν τεθνεώτων γεγονέναι οὐδὲν ἧττον
  ἢ τοὺς τεθνεῶτας ἐκ τῶν ζώντων, τούτου δὲ ὄντος ἱκανόν που ἐδόκει τεκμήριον εἶναι ὅτι ἀναγκαῖον τὰς τῶν τεθνεώτων ψυχὰς
  εἶναί που, ὅθεν δὴ πάλιν γίγνεσθαι. δοκεῖ μοι, ἔφη, ὦ Σώκρατες, ἐκ τῶν ὡμολογημένων ἀναγκαῖον οὕτως ἔχειν. ἰδὲ τοίνυν οὕτως,
  ἔφη, ὦ Κέβης, ὅτι οὐδ’ ἀδίκως ὡμολογήκαμεν, ὡς ἐμοὶ δοκεῖ. εἰ γὰρ μὴ ἀεὶ ἀνταποδιδοίη τὰ
