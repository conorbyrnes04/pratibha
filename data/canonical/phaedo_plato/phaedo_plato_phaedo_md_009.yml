    τὰ ζῶντά τε καὶ οἱ ζῶντες γίγνονται; φαίνεται, ἔφη. εἰσὶν ἄρα, ἔφη, αἱ ψυχαὶ ἡμῶν ἐν Ἅιδου. ἔοικεν. οὐκοῦν καὶ τοῖν γενεσέοιν
    τοῖν περὶ ταῦτα ἥ γ’ ἑτέρα σαφὴς οὖσα τυγχάνει; τὸ γὰρ ἀποθνῄσκειν σαφὲς δήπου, ἢ οὔ; πάνυ μὲν οὖν, ἔφη. πῶς οὖν, ἦ δ’
    ὅς, ποιήσομεν; οὐκ ἀνταποδώσομεν τὴν ἐναντίαν γένεσιν, ἀλλὰ ταύτῃ χωλὴ ἔσται ἡ φύσις; ἢ ἀνάγκη ἀποδοῦναι τῷ ἀποθνῄσκειν
    ἐναντίαν τινὰ γένεσιν; πάντως που, ἔφη. τίνα ταύτην; τὸ ἀναβιώσκεσθαι. ΦΑΙΔ. οὐκοῦν, ἦ δ’ ὅς, εἴπερ ἔστι τὸ ἀναβιώσκεσθαι,
    ἐκ τῶν τεθνεώτων ἂν εἴη γένεσις εἰς τοὺς ζῶντας αὕτη, τὸ ἀναβιώσκεσθαι; πάνυ γε. ὁμολογεῖται ἄρα ἡμῖν καὶ ταύτῃ τοὺς ζῶντας
    ἐκ τῶν τεθνεώτων γεγονέναι οὐδὲν ἧττον ἢ τοὺς τεθνεῶτας ἐκ τῶν ζώντων, τούτου δὲ ὄντος ἱκανόν που ἐδόκει τεκμήριον εἶναι
    ὅτι ἀναγκαῖον τὰς τῶν τεθνεώτων ψυχὰς εἶναί που, ὅθεν δὴ πάλιν γίγνεσθαι. δοκεῖ μοι, ἔφη, ὦ Σώκρατες, ἐκ τῶν ὡμολογημένων
    ἀναγκαῖον οὕτως ἔχειν. ἰδὲ τοίνυν οὕτως, ἔφη, ὦ Κέβης, ὅτι οὐδ’ ἀδίκως ὡμολογήκαμεν, ὡς ἐμοὶ δοκεῖ. εἰ γὰρ μὴ ἀεὶ ἀνταποδιδοίη
    τὰ
