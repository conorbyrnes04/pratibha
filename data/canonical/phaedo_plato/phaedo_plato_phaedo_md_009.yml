    Key Terms


    **genesis ex enantiōn** — generation from opposites.


    **paligenesia** — rebirth as structural implication, not mere myth.


    **psychē** — soul as what must already be, if living returns from dead.


    Cross-Tradition Resonances


    **Bṛhadāraṇyaka Upaniṣad 4.4 (death and paths):** Both refuse simple annihilation narratives.

    *Divergence:* Upaniṣadic karma-path metaphysics; Plato''s is dialectical opposites.


    **Heraclitus (DK B88):** Both insist living/dead transform into each other.

    *Divergence:* Heraclitus is fragment-flux; Plato builds an immortality brief.'
