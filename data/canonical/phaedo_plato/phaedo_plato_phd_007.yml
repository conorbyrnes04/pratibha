sanskrit_devanagari: ἆρ' οὖν καθαρῶς τι λαμβάνομεν ὅταν τὸ σῶμα μετ' ἡμῶν μετίῃ ἐπὶ τὴν ζήτησιν; ... ἀλλ' ἐκεῖνο δῆλον, ὅτι
  εἰ μέλλομεν καθαρῶς τι γνώσεσθαι, ἀπαλλακτέον αὐτοῦ δεῖ καὶ αὐτῇ τῇ ψυχῇ θεατέον τὰ πράγματα.
