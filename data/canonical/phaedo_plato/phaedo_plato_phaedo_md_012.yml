sanskrit_devanagari: '*Source-language basis:* Greek not line-aligned in this pass; body follows Jowett.'
sanskrit_iast: Not applicable (Greek). Key terms in commentary.
translation_literal: 'Socrates pictures our inhabited zone — from Phasis to the Pillars of Heracles —
  as a small hollow by the sea, like ants or frogs about a marsh, while other hollows elsewhere collect
  mist and lower air. The true earth is pure, set in the pure heaven with the stars; what we call earth
  is a sedimented pocket. The myth re-scales perception: our ''world'' is a local depression, not the
  whole.'
commentary: 'Cosmology here is spiritual pedagogy. The ant-or-frog image humiliates provincial certainty:
  we mistake our marsh for the earth. Hollows collect mist and lower air; the true earth is pure, set
  in pure heaven. The contested move is to treat geography as allegory of epistemic altitude — purer seeing
  is higher earth. This prepares the mythic afterlife landscape without yet asking for blind belief; it
  first loosens the grip of local absolute. Existentially: name one “whole world” claim you make from
  a pocket — a subculture, feed, city, or school — and soften one absolute that depends on mistaking the
  marsh for the map. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation.


  Key Terms


  **alēthinē gē** — true earth; purified habitation.


  **koilos** — hollow/depression; our local world.


  **katharos** — pure; the atmosphere of the higher earth.


  Cross-Tradition Resonances


  **Zhuangzi, ''frog in the well'':** Both puncture local absolutism with scale.

  *Divergence:* Zhuangzi plays perspectival comedy; Plato builds an eschatological landscape.


  **Upaniṣadic sky/earth correspondences:** Both use cosmos as map of insight.

  *Divergence:* Upaniṣads identify ātman-brahman; Plato keeps mythic ascent toward Forms/gods.'
insight: Cosmology here is spiritual pedagogy.
practice: 'For one dispute today, ask: am I arguing from the marsh as if it were the whole earth? Soften
  one absolute.'
