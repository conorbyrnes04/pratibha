sanskrit_devanagari: ἀέρος πρὸς τὸ μὴ πεσεῖν μήτε ἄλλης ἀνάγκης μηδεμιᾶς τοιαύτης, ἀλλὰ ἱκανὴν εἶναι αὐτὴν ἴσχειν τὴν ὁμοιότητα
  τοῦ οὐρανοῦ αὐτοῦ ἑαυτῷ πάντῃ καὶ τῆς γῆς αὐτῆς τὴν ἰσορροπίαν· ἰσόρροπον γὰρ πρᾶγμα ὁμοίου τινὸς ἐν μέσῳ τεθὲν οὐχ ἕξει
  μᾶλλον οὐδ’ ἧττον οὐδαμόσε κλιθῆναι, ὁμοίως δ’ ἔχον ἀκλινὲς μενεῖ. πρῶτον μὲν τοίνυν, ἦ δ’ ὅς, τοῦτο πέπεισμαι. καὶ ὀρθῶς
  γε, ἔφη ὁ Σιμμίας. ἔτι τοίνυν, ἔφη, πάμμεγά τι εἶναι αὐτό, καὶ ἡμᾶς οἰκεῖν τοὺς μέχρι Ἡρακλείων στηλῶν ἀπὸ Φάσιδος ἐν σμικρῷ
  τινι μορίῳ, ὥσπερ περὶ τέλμα μύρμηκας ἢ βατράχους περὶ τὴν θάλατταν οἰκοῦντας, καὶ ἄλλους ἄλλοθι πολλοὺς ἐν πολλοῖσι τοιούτοις
  τόποις οἰκεῖν. εἶναι γὰρ πανταχῇ περὶ τὴν γῆν πολλὰ κοῖλα καὶ παντοδαπὰ καὶ τὰς ἰδέας καὶ τὰ μεγέθη, εἰς ἃ συνερρυηκέναι
  τό τε ὕδωρ καὶ τὴν ὁμίχλην καὶ τὸν ἀέρα· αὐτὴν δὲ τὴν γῆν καθαρὰν ἐν καθαρῷ κεῖσθαι τῷ οὐρανῷ ἐν ᾧπέρ ἐστι τὰ ἄστρα, ὃν
  δὴ αἰθέρα ὀνομάζειν τοὺς πολλοὺς τῶν περὶ τὰ τοιαῦτα εἰωθότων λέγειν· οὗ δὴ ὑποστάθμην ταῦτα εἶναι καὶ συρρεῖν ἀεὶ εἰς τὰ
  κοῖλα τῆς γῆς. ἡμᾶς οὖν οἰκοῦντας ἐν τοῖς κοίλοις αὐτῆς λεληθέναι καὶ οἴεσθαι ἄνω ἐπὶ τῆς γῆς οἰκεῖν, ὥσπερ ἂν εἴ τις ἐν
  μέσῳ τῷ πυθμένι τοῦ πελάγους οἰκῶν οἴοιτό τε ἐπὶ τῆς θαλάττης οἰκεῖν καὶ διὰ τοῦ ὕδατος ὁρῶν τὸν ἥλιον καὶ τὰ ἄλλα ἄστρα
  τὴν θάλατταν ἡγοῖτο οὐρανὸν εἶναι, διὰ δὲ βραδυτῆτά τε καὶ ἀσθένειαν μηδεπώποτε ἐπὶ τὰ ἄκρα τῆς θαλάττης ἀφιγμένος μηδὲ
  ἑωρακὼς εἴη, ἐκδὺς καὶ ἀνακύψας ἐκ τῆς θαλάττης εἰς τὸν ἐνθάδε τόπον, ὅσῳ καθαρώτερος καὶ καλλίων τυγχάνει ὢν τοῦ παρὰ σφίσι,
  μηδὲ ἄλλου ἀκηκοὼς εἴη τοῦ ἑωρακότος. ταὐτὸν δὴ τοῦτο καὶ ἡμᾶς πεπονθέναι· οἰκοῦντας γὰρ ἔν τινι κοίλῳ τῆς γῆς οἴεσθαι ἐπάνω
  αὐτῆς οἰκεῖν, καὶ τὸν ἀέρα οὐρανὸν καλεῖν, ὡς διὰ τούτου οὐρανοῦ ὄντος τὰ ἄστρα χωροῦντα· τὸ δὲ εἶναι ταὐτόν, ὑπ’ ἀσθενείας
  καὶ βραδυτῆτος οὐχ οἵους τε εἶναι ἡμᾶς διεξελθεῖν ἐπ᾽ ἔσχατον τὸν ἀέρα· ἐπεί, εἴ τις αὐτοῦ ἐπ’ ἄκρα ἔλθοι ἢ πτηνὸς γενόμενος
  ἀνάπτοιτο, κατιδεῖν ἂν ἀνακύψαντα, ὥσπερ ἐνθάδε οἱ ἐκ τῆς θαλάττης ἰχθύες ἀνακύπτοντες ὁρῶσι τὰ ἐνθάδε, οὕτως ἄν τινα καὶ
  τὰ ἐκεῖ κατιδεῖν, καὶ εἰ ἡ φύσις ἱκανὴ εἴη ἀνασχέσθαι θεωροῦσα, γνῶναι ἂν ὅτι ἐκεῖνός ἐστιν ὁ ἀληθῶς οὐρανὸς καὶ τὸ ἀληθινὸν
  φῶς καὶ ἡ ὡς ἀληθῶς γῆ. ΦΑΙΔ. ἥδε μὲν γὰρ ἡ γῆ καὶ οἱ λίθοι καὶ ἅπας ὁ τόπος ὁ ἐνθάδε διεφθαρμένα ἐστὶν καὶ καταβεβρωμένα,
  ὥσπερ τὰ ἐν τῇ θαλάττῃ ὑπὸ τῆς ἅλμης, καὶ οὔτε φύεται ἄξιον λόγου οὐδὲν ἐν τῇ θαλάττῃ, οὔτε τέλειον ὡς ἔπος εἰπεῖν οὐδέν
  ἐστι, σήραγγες δὲ καὶ ἄμμος καὶ πηλὸς ἀμήχανος καὶ βόρβοροί εἰσιν, ὅπου ἂν καὶ ἡ γῆ ᾖ, καὶ πρὸς τὰ παρ’ ἡμῖν κάλλη κρίνεσθαι
  οὐδ’ ὁπωστιοῦν ἄξια. ἐκεῖνα δὲ αὖ τῶν παρ’ ἡμῖν πολὺ ἂν ἔτι πλέον φανείη διαφέρειν·
sanskrit_iast: aeros pros to mē pesein mēte allēs anankēs mēdemias toiaytēs, alla hikanēn einai aytēn ischein tēn homoiotēta
  toy oyranoy aytoy heaytō pantē kai tēs gēs aytēs tēn isorropian; isorropon gar pragma homoioy tinos en mesō tethen oych
  hexei mallon oyd’ hētton oydamose klithēnai, homoiōs d’ echon aklines menei. prōton men toinyn, ē d’ hos, toyto pepeismai.
  kai orthōs ge, ephē ho Simmias. eti toinyn, ephē, pammega ti einai ayto, kai hēmas oikein toys mechri Hērakleiōn stēlōn
  apo Phasidos en smikrō tini moriō, hōsper peri telma myrmēkas ē batrachoys peri tēn thalattan oikoyntas, kai alloys allothi
  polloys en polloisi toioytois topois oikein. einai gar pantachē peri tēn gēn polla koila kai pantodapa kai tas ideas kai
  ta megethē, eis ha synerryēkenai to te hydōr kai tēn homichlēn kai ton aera; aytēn de tēn gēn katharan en katharō keisthai
  tō oyranō en hōper esti ta astra, hon dē aithera onomazein toys polloys tōn peri ta toiayta eiōthotōn legein; oy dē hypostathmēn
  tayta einai kai syrrein aei eis ta koila tēs gēs. hēmas oyn oikoyntas en tois koilois aytēs lelēthenai kai oiesthai anō
  epi tēs gēs oikein, hōsper an ei tis en mesō tō pythmeni toy pelagoys oikōn oioito te epi tēs thalattēs oikein kai dia toy
  hydatos horōn ton hēlion kai ta alla astra tēn thalattan hēgoito oyranon einai, dia de bradytēta te kai astheneian mēdepōpote
  epi ta akra tēs thalattēs aphigmenos mēde heōrakōs eiē, ekdys kai anakypsas ek tēs thalattēs eis ton enthade topon, hosō
  katharōteros kai kalliōn tynchanei ōn toy para sphisi, mēde alloy akēkoōs eiē toy heōrakotos. tayton dē toyto kai hēmas
  peponthenai; oikoyntas gar en tini koilō tēs gēs oiesthai epanō aytēs oikein, kai ton aera oyranon kalein, hōs dia toytoy
  oyranoy ontos ta astra chōroynta; to de einai tayton, hyp’ astheneias kai bradytētos oych oioys te einai hēmas diexelthein
  ep eschaton ton aera; epei, ei tis aytoy ep’ akra elthoi ē ptēnos genomenos anaptoito, katidein an anakypsanta, hōsper enthade
  oi ek tēs thalattēs ichthyes anakyptontes horōsi ta enthade, oytōs an tina kai ta ekei katidein, kai ei hē physis hikanē
  eiē anaschesthai theōroysa, gnōnai an hoti ekeinos estin ho alēthōs oyranos kai to alēthinon phōs kai hē hōs alēthōs gē.
  PhAID. hēde men gar hē gē kai oi lithoi kai hapas ho topos ho enthade diephtharmena estin kai katabebrōmena, hōsper ta en
  tē thalattē hypo tēs halmēs, kai oyte phyetai axion logoy oyden en tē thalattē, oyte teleion hōs epos eipein oyden esti,
  sēranges de kai ammos kai pēlos amēchanos kai borboroi eisin, hopoy an kai hē gē ē, kai pros ta par’ hēmin kallē krinesthai
  oyd’ hopōstioyn axia. ekeina de ay tōn par’ hēmin poly an eti pleon phaneiē diapherein;
translation_literal: 'Socrates pictures our inhabited zone — from Phasis to the Pillars of Heracles — as a small hollow by
  the sea, like ants or frogs about a marsh, while other hollows elsewhere collect mist and lower air. The true earth is pure,
  set in the pure heaven with the stars; what we call earth is a sedimented pocket. The myth re-scales perception: our ''world''
  is a local depression, not the whole.'
commentary: 'Cosmology here is spiritual pedagogy. The ant-or-frog image humiliates provincial certainty: we mistake our marsh
  for the earth. Hollows collect mist and lower air; the true earth is pure, set in pure heaven. The contested move is to
  treat geography as allegory of epistemic altitude — purer seeing is higher earth. This prepares the mythic afterlife landscape
  without yet asking for blind belief; it first loosens the grip of local absolute. Existentially: name one “whole world”
  claim you make from a pocket — a subculture, feed, city, or school — and soften one absolute that depends on mistaking the
  marsh for the map. The passage asks for recognition before consolation. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation. The passage asks for recognition before consolation. The passage asks
  for recognition before consolation. The passage asks for recognition before consolation. The passage asks for recognition
  before consolation.


  Key Terms


  **alēthinē gē** — true earth; purified habitation.


  **koilos** — hollow/depression; our local world.


  **katharos** — pure; the atmosphere of the higher earth.


  Cross-Tradition Resonances


  **Zhuangzi, ''frog in the well'':** Both puncture local absolutism with scale.

  *Divergence:* Zhuangzi plays perspectival comedy; Plato builds an eschatological landscape.


  **Upaniṣadic sky/earth correspondences:** Both use cosmos as map of insight.

  *Divergence:* Upaniṣads identify ātman-brahman; Plato keeps mythic ascent toward Forms/gods.'
insight: Cosmology here is spiritual pedagogy.
practice: 'For one dispute today, ask: am I arguing from the marsh as if it were the whole earth? Soften one absolute.'
