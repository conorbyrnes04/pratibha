sanskrit_devanagari: τὸ ὑπὸ τῶν ἡδονῶν ἄρχεσθαι, ἀλλ’ ὅμως συμβαίνει αὐτοῖς κρατουμένοις ὑφ᾽ ἡδονῶν κρατεῖν ἄλλων ἡδονῶν.
  τοῦτο δ’ ὅμοιόν ἐστιν ᾧ νυνδὴ ἐλέγετο, τῷ τρόπον τινὰ δι’ ἀκολασίαν αὐτοὺς σεσωφρονίσθαι. ἔοικε γάρ. ὦ μακάριε Σιμμία, μὴ
  γὰρ οὐχ αὕτη ᾖ ἡ ὀρθὴ πρὸς ἀρετὴν ἀλλαγή, ἡδονὰς πρὸς ἡδονὰς καὶ λύπας πρὸς λύπας καὶ φόβον πρὸς φόβον καταλλάττεσθαι, καὶ
  μείζω πρὸς ἐλάττω ὥσπερ νομίσματα, ἀλλ’ ᾖ ἐκεῖνο μόνον τὸ νόμισμα ὀρθόν, ἀντὶ οὗ δεῖ πάντα ταῦτα καταλλάττεσθαι, φρόνησις,
  καὶ τούτου μὲν πάντα καὶ μετὰ τούτου ὠνούμενά τε καὶ πιπρασκόμενα τῷ ὄντι ᾖ καὶ ἀνδρεία καὶ σωφροσύνη καὶ δικαιοσύνη καὶ
  συλλήβδην ἀληθὴς ἀρετή, μετὰ φρονήσεως, καὶ προσγιγνομένων καὶ ἀπογιγνομένων καὶ ἡδονῶν καὶ φόβων καὶ τῶν ἄλλων πάντων τῶν
  τοιούτων· χωριζόμενα δὲ φρονήσεως καὶ ἀλλαττόμενα ἀντὶ ἀλλήλων μὴ σκιαγραφία τις ᾖ ἡ τοιαύτη ἀρετὴ καὶ τῷ ὄντι ἀνδραποδώδης
  τε καὶ οὐδὲν ὑγιὲς οὐδ’ ἀληθὲς ἔχῃ, τὸ δ’ ἀληθὲς τῷ ὄντι ᾖ κάθαρσίς τις τῶν τοιούτων πάντων καὶ ἡ σωφροσύνη καὶ ἡ δικαιοσύνη
  καὶ ἀνδρεία, καὶ αὐτὴ ἡ φρόνησις μὴ καθαρμός τις ᾖ. καὶ κινδυνεύουσι καὶ οἱ τὰς τελετὰς ἡμῖν οὗτοι καταστήσαντες οὐ φαῦλοί
  τινες εἶναι, ἀλλὰ τῷ ὄντι πάλαι αἰνίττεσθαι ὅτι ὃς ἂν ἀμύητος καὶ ἀτέλεστος εἰς Ἅιδου ἀφίκηται ἐν βορβόρῳ κείσεται, ὁ δὲ
  κεκαθαρμένος τε καὶ τετελεσμένος ἐκεῖσε ἀφικόμενος μετὰ θεῶν οἰκήσει. εἰσὶν γὰρ δή, ὥς φασιν οἱ περὶ τὰς τελετάς, ναρθηκοφόροι
  μὲν πολλοί, βάκχοι δέ τε παῦροι· οὗτοι δ’ εἰσὶν κατὰ τὴν ἐμὴν δόξαν οὐκ ἄλλοι ἢ οἱ πεφιλοσοφηκότες ὀρθῶς. ὧν δὴ καὶ ἐγὼ
  κατά γε τὸ δυνατὸν οὐδὲν ἀπέλιπον ἐν τῷ βίῳ ἀλλὰ παντὶ τρόπῳ προυθυμήθην γενέσθαι· εἰ δ’ ὀρθῶς προυθυμήθην καί τι ἠνύσαμεν,
  ἐκεῖσε ἐλθόντες τὸ σαφὲς εἰσόμεθα, ἂν θεὸς ἐθέλῃ, ὀλίγον ὕστερον, ὡς ἐμοὶ δοκεῖ. ταῦτ’ οὖν ἐγώ, ἔφη, ὦ Σιμμία τε καὶ Κέβης,
  ἀπολογοῦμαι, ὡς εἰκότως ὑμᾶς τε ἀπολείπων καὶ τοὺς ἐνθάδε δεσπότας οὐ
sanskrit_iast: to hypo tōn hēdonōn archesthai, all’ homōs symbainei aytois kratoymenois hyph hēdonōn kratein allōn hēdonōn.
  toyto d’ homoion estin hō nyndē elegeto, tō tropon tina di’ akolasian aytoys sesōphronisthai. eoike gar. ō makarie Simmia,
  mē gar oych aytē ē hē orthē pros aretēn allagē, hēdonas pros hēdonas kai lypas pros lypas kai phobon pros phobon katallattesthai,
  kai meizō pros elattō hōsper nomismata, all’ ē ekeino monon to nomisma orthon, anti oy dei panta tayta katallattesthai,
  phronēsis, kai toytoy men panta kai meta toytoy ōnoymena te kai pipraskomena tō onti ē kai andreia kai sōphrosynē kai dikaiosynē
  kai syllēbdēn alēthēs aretē, meta phronēseōs, kai prosgignomenōn kai apogignomenōn kai hēdonōn kai phobōn kai tōn allōn
  pantōn tōn toioytōn; chōrizomena de phronēseōs kai allattomena anti allēlōn mē skiagraphia tis ē hē toiaytē aretē kai tō
  onti andrapodōdēs te kai oyden hygies oyd’ alēthes echē, to d’ alēthes tō onti ē katharsis tis tōn toioytōn pantōn kai hē
  sōphrosynē kai hē dikaiosynē kai andreia, kai aytē hē phronēsis mē katharmos tis ē. kai kindyneyoysi kai oi tas teletas
  hēmin oytoi katastēsantes oy phayloi tines einai, alla tō onti palai ainittesthai hoti hos an amyētos kai atelestos eis
  Haidoy aphikētai en borborō keisetai, ho de kekatharmenos te kai tetelesmenos ekeise aphikomenos meta theōn oikēsei. eisin
  gar dē, hōs phasin oi peri tas teletas, narthēkophoroi men polloi, bakchoi de te payroi; oytoi d’ eisin kata tēn emēn doxan
  oyk alloi ē oi pephilosophēkotes orthōs. hōn dē kai egō kata ge to dynaton oyden apelipon en tō biō alla panti tropō proythymēthēn
  genesthai; ei d’ orthōs proythymēthēn kai ti ēnysamen, ekeise elthontes to saphes eisometha, an theos ethelē, oligon hysteron,
  hōs emoi dokei. tayt’ oyn egō, ephē, ō Simmia te kai Kebēs, apologoymai, hōs eikotōs hymas te apoleipōn kai toys enthade
  despotas oy
translation_literal: 'True virtue keeps company with wisdom; virtues traded as pleasures against fears, without wisdom, are
  only a shadow of virtue — without freedom, health, or truth. The true exchange is a purgation in which temperance, justice,
  courage, and wisdom cleanse lesser goods. The mysteries said it in figure: many are thyrsus-bearers, few are mystics — that
  is, few are true philosophers.'
commentary: 'Moral accounting without wisdom is still commerce. Socrates'' scandal is to call popular virtue a shadow-painting
  when pleasures and pains are merely swapped for a respectable surplus. True exchange is katharsis: temperance, justice,
  courage, and wisdom as purgation of lesser goods, not their clever rearrangement. The mysteries'' figure — many thyrsus-bearers,
  few mystics — reframes philosophy as initiation rather than résumé ethics. Existentially: inventory your goodness and mark
  where it is still bargaining. The few/many tension is not elitism for its own sake; it is a warning that costume religiosity
  can fill a room while purification remains rare. The passage asks for recognition before consolation. The passage asks for
  recognition before consolation. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before consolation. The
  passage asks for recognition before consolation. The passage asks for recognition before consolation.


  Key Terms


  **skiagraphia** — shadow-painting; apparent virtue.


  **katharsis** — purgation as true exchange.


  **bacchoi / mystai** — thyrsus-bearers vs true initiates; crowd vs philosophers.


  Cross-Tradition Resonances


  **Buddha, *Dhammapada* 19 (many wear the robe):** Both separate costume from realization.

  *Divergence:* Buddhist frame is ethical-karmic; Plato''s is dialectical-purificatory.


  **Gospel of Matthew 22:14:** Both keep the few/many tension.

  *Divergence:* Matthew is election/banquet; Plato is philosophical initiation.'
insight: Moral accounting without wisdom is still commerce.
practice: Identify one virtue you perform mainly to avoid pain or gain pleasure. Practice it once today for clarity alone.
