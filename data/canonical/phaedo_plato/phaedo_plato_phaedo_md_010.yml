sanskrit_devanagari: ὦ μακάριε Σιμμία, μὴ γὰρ οὐχ αὕτη ᾖ ἡ ὀρθὴ πρὸς ἀρετὴν ἀλλαγή, ἡδονὰς πρὸς ἡδονὰς
  καὶ λύπας πρὸς λύπας καὶ φόβον πρὸς φόβον καταλλάττεσθαι, καὶ μείζω πρὸς ἐλάττω ὥσπερ νομίσματα, ἀλλ'
  ᾖ ἐκεῖνο μόνον τὸ νόμισμα ὀρθόν, ἀντὶ οὗ δεῖ πάντα ταῦτα καταλλάττεσθαι, φρόνησις, καὶ τούτου μὲν πάντα
  καὶ μετὰ τούτου ὠνούμενά τε καὶ πιπρασκόμενα τῷ ὄντι ᾖ καὶ ἀνδρεία καὶ σωφροσύνη καὶ δικαιοσύνη καὶ
  συλλήβδην ἀληθὴς ἀρετή, μετὰ φρονήσεως, καὶ προσγιγνομένων καὶ ἀπογιγνομένων καὶ ἡδονῶν καὶ φόβων καὶ
  τῶν ἄλλων πάντων τῶν τοιούτων· χωριζόμενα δὲ φρονήσεως καὶ ἀλλαττόμενα ἀντὶ ἀλλήλων μὴ σκιαγραφία τις
  ᾖ ἡ τοιαύτη ἀρετὴ καὶ τῷ ὄντι ἀνδραποδώδης τε καὶ οὐδὲν ὑγιὲς οὐδ' ἀληθὲς ἔχῃ, τὸ δ' ἀληθὲς τῷ ὄντι
  ᾖ κάθαρσίς τις τῶν τοιούτων πάντων καὶ ἡ σωφροσύνη καὶ ἡ δικαιοσύνη καὶ ἀνδρεία, καὶ αὐτὴ ἡ φρόνησις
  μὴ καθαρμός τις ᾖ. καὶ κινδυνεύουσι καὶ οἱ τὰς τελετὰς ἡμῖν οὗτοι καταστήσαντες οὐ φαῦλοί τινες εἶναι,
  ἀλλὰ τῷ ὄντι πάλαι αἰνίττεσθαι ὅτι ὃς ἂν ἀμύητος καὶ ἀτέλεστος εἰς Ἅιδου ἀφίκηται ἐν βορβόρῳ κείσεται,
  ὁ δὲ κεκαθαρμένος τε καὶ τετελεσμένος ἐκεῖσε ἀφικόμενος μετὰ θεῶν οἰκήσει. εἰσὶν γὰρ δή, ὥς φασιν οἱ
  περὶ τὰς τελετάς, ναρθηκοφόροι μὲν πολλοί, βάκχοι δέ τε παῦροι· οὗτοι δ' εἰσὶν κατὰ τὴν ἐμὴν δόξαν οὐκ
  ἄλλοι ἢ οἱ πεφιλοσοφηκότες ὀρθῶς.
sanskrit_iast: Not applicable (Greek). Key terms in commentary.
translation_literal: 'True virtue keeps company with wisdom; virtues traded as pleasures against fears,
  without wisdom, are only a shadow of virtue — without freedom, health, or truth. The true exchange is
  a purgation in which temperance, justice, courage, and wisdom cleanse lesser goods. The mysteries said
  it in figure: many are thyrsus-bearers, few are mystics — that is, few are true philosophers.'
commentary: 'Moral accounting without wisdom is still commerce. Socrates'' scandal is to call popular
  virtue a shadow-painting when pleasures and pains are merely swapped for a respectable surplus. True
  exchange is katharsis: temperance, justice, courage, and wisdom as purgation of lesser goods, not their
  clever rearrangement. The mysteries'' figure — many thyrsus-bearers, few mystics — reframes philosophy
  as initiation rather than résumé ethics. Existentially: inventory your goodness and mark where it is
  still bargaining. The few/many tension is not elitism for its own sake; it is a warning that costume
  religiosity can fill a room while purification remains rare. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation.


  Key Terms


  **φρόνησις** — Wisdom or intelligent understanding, the only medium in which virtue becomes genuine
  rather than transactional.

  **κάθαρσις** — Purification, the cleansing exchange by which the soul relinquishes lesser goods for
  wisdom.

  **ναρθηκοφόροι** — Thyrsus-bearers, the many outward participants in mystery rites who carry ritual
  signs without necessarily attaining insight.

  **βάκχοι** — True initiates or Bacchants, here Plato’s figure for the rare philosophers genuinely transformed
  by purification.


  Cross-Tradition Resonances


  **Katha Upanishad 1.2.1–2:** The Upanishad contrasts the pleasant (preyas) with the truly good (sreyas),
  paralleling Socrates’ rejection of pleasure-based moral calculation in favor of a higher good. Divergence:
  The Upanishad frames the choice through knowledge of Atman and Brahman, whereas Plato frames it as philosophical
  purification through wisdom and virtue.

  **Dhammapada 290:** The verse commends surrendering a lesser happiness when a greater happiness is seen,
  echoing Plato’s claim that genuine moral exchange abandons inferior goods. Divergence: Buddhist teaching
  directs this renunciation toward liberation from craving and the cessation of suffering, not toward
  Plato’s purified rational soul and its eternal intelligible objects.

  **1 Corinthians 13:1–3:** Paul denies value to impressive religious speech, knowledge, sacrifice, and
  generosity without love, much as Socrates denies genuine virtue to externally admirable conduct lacking
  wisdom. Divergence: Paul makes agape, received and enacted in relation to God and neighbor, the indispensable
  principle, while Plato gives this governing role to phronesis and philosophical purification.'
insight: Moral accounting without wisdom is still commerce.
practice: Identify one virtue you perform mainly to avoid pain or gain pleasure. Practice it once today
  for clarity alone.
