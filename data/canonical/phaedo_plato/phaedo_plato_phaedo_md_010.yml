    Key Terms


    **skiagraphia** — shadow-painting; apparent virtue.


    **katharsis** — purgation as true exchange.


    **bacchoi / mystai** — thyrsus-bearers vs true initiates; crowd vs philosophers.


    Cross-Tradition Resonances


    **Buddha, *Dhammapada* 19 (many wear the robe):** Both separate costume from realization.

    *Divergence:* Buddhist frame is ethical-karmic; Plato''s is dialectical-purificatory.


    **Gospel of Matthew 22:14:** Both keep the few/many tension.

    *Divergence:* Matthew is election/banquet; Plato is philosophical initiation.'
