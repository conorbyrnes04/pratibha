  items:
  - term: katharsis (κάθαρσις)
    definition: '‘purification’ → soul’s cleansing from bodily distraction toward truth Here: The few/many tension is not
      elitism for its own sake; it is a warning that costume religiosity can fill a room while purification remains rare.
      Trap: ritual hygiene only'
  - term: meletē thanatou
    definition: '‘practice/rehearsal of death’ → philosophy as training to loosen identity with the perishable Here: Practice
      it once today for clarity alone. Trap: morbid death-obsession'
  - term: phronēsis (φρόνησις)
    definition: '‘practical/intellectual wisdom’ → wisdom that sees Forms and orders life toward them Here: True virtue keeps
      company with wisdom; virtues traded as pleasures against fears, without wisdom, are only a shadow of virtue — without
      freedom, health, or tru… Trap: mere cleverness'
