- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna, MMK 24.18 (dependent designation and emptiness)
    resonance: Both interrogate naive causal accounts and require conceptual precision about explanatory levels.
    divergence: Nagarjuna deconstructs intrinsic essences; Plato secures intelligibility through Forms.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_18
  - citation: Kant, Critique of Pure Reason (regulative use of reason)
    resonance: Both distinguish empirical sequence from conditions of intelligibility in judgment.
    divergence: Kant limits metaphysical knowledge claims; Plato treats intelligible realities as ontologically robust.
    passage_id: ''
  - citation: Pratyabhijnahrdayam 1-3
    resonance: Both insist that surface phenomena require reference to deeper principles of manifestation/intelligibility.
    divergence: Pratyabhijna roots manifestation in free consciousness (citi); *Phaedo* frames via Form-participation and
      dialectic.
    passage_id: ''
