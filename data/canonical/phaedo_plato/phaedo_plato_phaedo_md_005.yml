sanskrit_devanagari: τὸν δεύτερον πλοῦν ἐπὶ τὴν τῆς αἰτίας ζήτησιν ᾗ πεπραγμάτευμαι βούλει σοι, ἔφη, ἐπίδειξιν ποιήσωμαι,
  ὦ Κέβης; ὑπερφυῶς μὲν οὖν, ἔφη, ὡς βούλομαι. ἔδοξε τοίνυν μοι, ἦ δ’ ὅς, μετὰ ταῦτα, ἐπειδὴ ἀπειρήκη τὰ ὄντα σκοπῶν, δεῖν
  εὐλαβηθῆναι μὴ πάθοιμι ὅπερ οἱ τὸν ἥλιον ἐκλείποντα θεωροῦντες καὶ σκοπούμενοι πάσχουσιν· διαφθείρονται γάρ που ἔνιοι τὰ
  ὄμματα, ἐὰν μὴ ἐν ὕδατι ἤ τινι τοιούτῳ σκοπῶνται τὴν εἰκόνα αὐτοῦ. τοιοῦτόν τι καὶ ἐγὼ διενοήθην, καὶ ἔδεισα μὴ παντάπασι
  τὴν ψυχὴν τυφλωθείην βλέπων πρὸς τὰ πράγματα τοῖς ὄμμασι καὶ ἑκάστῃ τῶν αἰσθήσεων ἐπιχειρῶν ἅπτεσθαι αὐτῶν. ἔδοξε δή μοι
  χρῆναι εἰς τοὺς λόγους καταφυγόντα ἐν ἐκείνοις σκοπεῖν τῶν ὄντων τὴν ἀλήθειαν. ΦΑΙΔ. ἴσως μὲν οὖν ᾧ εἰκάζω τρόπον τινὰ οὐκ
  ἔοικεν· οὐ γὰρ πάνυ συγχωρῶ τὸν ἐν τοῖς λόγοις σκοπούμενον τὰ ὄντα ἐν εἰκόσι μᾶλλον σκοπεῖν ἢ τὸν ἐν τοῖς ἔργοις. ἀλλ’ οὖν
  δὴ ταύτῃ γε ὥρμησα, καὶ ὑποθέμενος ἑκάστοτε λόγον ὃν ἂν κρίνω ἐρρωμενέστατον εἶναι, ἃ μὲν ἄν μοι δοκῇ τούτῳ συμφωνεῖν τίθημι
  ὡς ἀληθῆ ὄντα, καὶ περὶ αἰτίας καὶ περὶ τῶν ἄλλων ἁπάντων ὄντων, ἃ δ’ ἂν μή, ὡς οὐκ ἀληθῆ. βούλομαι δέ σοι σαφέστερον εἰπεῖν
  ἃ λέγω· οἶμαι γάρ σε νῦν οὐ μανθάνειν. οὐ μὰ τὸν Δία, ἔφη ὁ Κέβης, οὐ σφόδρα. ἀλλ᾽, ἦ δ’ ὅς, ὧδε λέγω, οὐδὲν καινόν, ἀλλ’
  ἅπερ ἀεί τε ἄλλοτε καὶ ἐν τῷ παρεληλυθότι λόγῳ οὐδὲν πέπαυμαι λέγων. ἔρχομαι γὰρ δὴ ἐπιχειρῶν σοι ἐπιδείξασθαι τῆς αἰτίας
  τὸ εἶδος ὃ πεπραγμάτευμαι, καὶ εἶμι πάλιν ἐπ᾽ ἐκεῖνα τὰ πολυθρύλητα καὶ ἄρχομαι ἀπ’ ἐκείνων, ὑποθέμενος εἶναί τι καλὸν αὐτὸ
  καθ’ αὑτὸ καὶ ἀγαθὸν καὶ μέγα καὶ τἆλλα πάντα· ἃ εἴ μοι δίδως τε καὶ συγχωρεῖς εἶναι ταῦτα, ἐλπίζω σοι ἐκ τούτων τὴν αἰτίαν
  ἐπιδείξειν καὶ ἀνευρήσειν ὡς ἀθάνατον ἡ ψυχή. ἀλλὰ μήν, ἔφη ὁ Κέβης, ὡς διδόντος σοι οὐκ ἂν φθάνοις περαίνων. σκόπει δή,
  ἔφη, τὰ ἑξῆς ἐκείνοις ἐάν σοι συνδοκῇ ὥσπερ ἐμοί. φαίνεται γάρ μοι, εἴ τί ἐστιν ἄλλο καλὸν πλὴν αὐτὸ τὸ καλόν, οὐδὲ δι’
  ἓν ἄλλο καλὸν εἶναι ἢ διότι μετέχει ἐκείνου τοῦ καλοῦ· καὶ πάντα δὴ οὕτως λέγω. τῇ τοιᾷδε αἰτίᾳ συγχωρεῖς; συγχωρῶ, ἔφη.
  οὐ τοίνυν, ἦ δ’ ὅς, ἔτι μανθάνω οὐδὲ δύναμαι τὰς ἄλλας αἰτίας τὰς σοφὰς ταύτας γιγνώσκειν· ἀλλ’ ἐάν τίς μοι λέγῃ
sanskrit_iast: ton deyteron ployn epi tēn tēs aitias zētēsin hē pepragmateymai boylei soi, ephē, epideixin poiēsōmai, ō Kebēs;
  hyperphyōs men oyn, ephē, hōs boylomai. edoxe toinyn moi, ē d’ hos, meta tayta, epeidē apeirēkē ta onta skopōn, dein eylabēthēnai
  mē pathoimi hoper oi ton hēlion ekleiponta theōroyntes kai skopoymenoi paschoysin; diaphtheirontai gar poy enioi ta ommata,
  ean mē en hydati ē tini toioytō skopōntai tēn eikona aytoy. toioyton ti kai egō dienoēthēn, kai edeisa mē pantapasi tēn
  psychēn typhlōtheiēn blepōn pros ta pragmata tois ommasi kai hekastē tōn aisthēseōn epicheirōn haptesthai aytōn. edoxe dē
  moi chrēnai eis toys logoys kataphygonta en ekeinois skopein tōn ontōn tēn alētheian. PhAID. isōs men oyn hō eikazō tropon
  tina oyk eoiken; oy gar pany synchōrō ton en tois logois skopoymenon ta onta en eikosi mallon skopein ē ton en tois ergois.
  all’ oyn dē taytē ge hōrmēsa, kai hypothemenos hekastote logon hon an krinō errōmenestaton einai, ha men an moi dokē toytō
  symphōnein tithēmi hōs alēthē onta, kai peri aitias kai peri tōn allōn hapantōn ontōn, ha d’ an mē, hōs oyk alēthē. boylomai
  de soi saphesteron eipein ha legō; oimai gar se nyn oy manthanein. oy ma ton Dia, ephē ho Kebēs, oy sphodra. all, ē d’ hos,
  hōde legō, oyden kainon, all’ haper aei te allote kai en tō parelēlythoti logō oyden pepaymai legōn. erchomai gar dē epicheirōn
  soi epideixasthai tēs aitias to eidos ho pepragmateymai, kai eimi palin ep ekeina ta polythrylēta kai archomai ap’ ekeinōn,
  hypothemenos einai ti kalon ayto kath’ ayto kai agathon kai mega kai talla panta; ha ei moi didōs te kai synchōreis einai
  tayta, elpizō soi ek toytōn tēn aitian epideixein kai aneyrēsein hōs athanaton hē psychē. alla mēn, ephē ho Kebēs, hōs didontos
  soi oyk an phthanois perainōn. skopei dē, ephē, ta hexēs ekeinois ean soi syndokē hōsper emoi. phainetai gar moi, ei ti
  estin allo kalon plēn ayto to kalon, oyde di’ hen allo kalon einai ē dioti metechei ekeinoy toy kaloy; kai panta dē oytōs
  legō. tē toiade aitia synchōreis; synchōrō, ephē. oy toinyn, ē d’ hos, eti manthanō oyde dynamai tas allas aitias tas sophas
  taytas gignōskein; all’ ean tis moi legē
translation_literal: 'After disappointment with physical speculation, Socrates undertakes a "second sailing": from sensory
  causes to intelligible explanation. He treats Forms not as decorative abstractions but as causal principles of intelligibility.
  Things are beautiful by participation in Beauty, just by participation in Justice, knowable by relation to stable structures.'
commentary: 'The claim is that explanation requires levels, and material conditions are not identical with rational cause.
  Socrates'' counterintuitive move is to reject apparently concrete explanations ("bones and muscles") as insufficient for
  action-meaning. Conditions enable; they do not decide teleological significance. The distinction between cause and condition
  here is philosophically generative and still contemporary.


  The "second sailing" is often caricatured as escaping science. In context, it is a methodological correction against category
  error. Socrates is not denying physiology; he is refusing its totalization. To explain why he sits in prison, one must invoke
  judgment, norm, and chosen good, not merely biomechanics. Thus Forms function as anchors for non-reductive reason.


  Existentially, this passage rescues agency from explanatory overreach. In modern life we often narrate ourselves as products
  of systems, histories, and drives. Socrates grants all that as condition yet insists on another dimension: accountable orientation
  toward what one takes as good. Without that dimension, responsibility dissolves. With it, even constrained life regains
  interior freedom and intelligible direction.


  Key Terms:


  **deuteros plous (δεύτερος πλοῦς)** - "second sailing" -> metaphor for a more demanding, conceptually guided method when
  first-order explanations fail -> treating it as mere retreat misreads its methodological precision.


  **aitia (αἰτία)** - cause/explanatory because -> in this passage distinguished from enabling conditions -> modern translation
  as generic "cause" can collapse the key distinction.


  **methexis (μέθεξις)** - participation -> explains how particulars relate to Forms without identity -> if flattened into
  "copy," the dynamic explanatory function is lost.


  **to kalon (τὸ καλόν)** - the Beautiful-as-such -> not taste-preference but ontological/intelligible criterion -> "beauty"
  in aesthetic-modern sense is too narrow.'
insight: The claim is that explanation requires levels, and material conditions are not identical with rational cause.
practice: 'Pick one difficult life decision and write two columns: "conditions affecting this" and "the good I judge here";
  act from the second while acknowledging the first.'
