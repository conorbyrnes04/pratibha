sanskrit_devanagari: 'आत्मा वा अरे द्रष्टव्यः श्रोतव्यो मन्तव्यो निदिध्यासितव्यो मैत्रेयि ।

  आत्मनो वा अरे दर्शनेन श्रवणेन मत्या विज्ञानेनेदं सर्वं विदितम् ॥ २.४.५ ॥'
sanskrit_iast: 'ātmā vā are draṣṭavyaḥ śrotavyo mantavyo nididhyāsitavyo maitreyi |

  ātmano vā are darśanena śravaṇena matyā vijñānenedaṃ sarvaṃ viditam || 2.4.5 ||'
translation_literal: The Self, verily, O Maitreyī, is to be seen, to be heard, to be reflected upon, and
  to be profoundly meditated upon. Through the seeing of the Self, through hearing, through reflection,
  and through knowledge, all this is known.
commentary: 'This verse crystallizes the Upaniṣadic epistemology: the Self is not merely an object of
  intellectual knowledge but demands a fourfold engagement—visual realization, auditory reception, rational
  reflection (mananam), and sustained contemplation (nididhyāsana). The progression marks the classical
  Vedantic path from śravaṇa to mananam to nididhyāsana. Yājñavalkya addresses Maitreyī directly, establishing
  that knowledge of Brahman is not abstract philosophy but lived recognition that collapses subject-object
  duality. The phrase ''sarvam idam vijñātam bhavati'' (all this becomes known) expresses the non-dual
  insight: once the Self is recognized as the ground of all appearance, multiplicity is revealed as the
  Self''s own manifestation. This is not pantheism but the recognition that consciousness itself is the
  sole reality through which all phenomena are cognized.


  Key Terms


  **ātmā** — the Self, the foundational reality whose realization makes all else intelligible.

  **śrotavyaḥ** — to be heard or received through authoritative teaching.

  **mantavyaḥ** — to be reflected upon through disciplined reasoning.

  **nididhyāsitavyaḥ** — to be deeply contemplated until realization becomes steady.


  Cross-Tradition Resonances


  **Plato, Alcibiades I 129a–130c:** Socrates likewise makes self-knowledge the decisive condition for
  rightly knowing and governing everything else. Divergence: Plato identifies the self primarily with
  the rational soul, not with a nondual reality in which all things are known through the Self.

  **Augustine, Confessions X.27:** Augustine’s inward turn seeks the truth found more intimately within
  than external objects, paralleling the movement from outward multiplicity toward interior realization.
  Divergence: Augustine preserves a creator–creature distinction, whereas the Upaniṣadic claim presents
  knowledge of ātmā as knowledge of the ground of all.

  **Saṃyutta Nikāya 22.59, Anattalakkhaṇa Sutta:** The Buddha also directs sustained examination of experience
  so that liberating insight arises through seeing rather than mere conceptual assent. Divergence: The
  Anattalakkhaṇa Sutta rejects identifying any aggregate or experience as an enduring self, directly differing
  from the Upaniṣadic affirmation of ātmā.'
practice: 'Sit in stillness. Recall a moment when you directly perceived something without naming it—a
  color, a sound, a presence. Notice that in that moment, the perceiver and perceived were not separate.
  Now apply this to your own awareness itself: can you observe the observer? Rather than seeking an answer,
  hold the question gently in meditation for 15 minutes daily. This is nididhyāsana—not thinking about
  the Self, but resting as the Self that is already aware.'
