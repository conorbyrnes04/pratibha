unit_label: The Imperishable Is Not Coarse or Fine
title: The Imperishable Is Not Coarse or Fine
unit_type: sutra
sanskrit_devanagari: एतद् वै तद् अक्षरं गार्गि ब्राह्मणा अभिवदन्ति अस्थूलम् अनण्व् अह्रस्वम्
sanskrit_iast: etad vai tad akṣaraṃ gārgi brāhmaṇā abhivadanti asthūlam anaṇv ahrasvam
translation_literal: That Imperishable, O Gārgī, is the unseen seer, the unheard hearer, the unthought thinker, the unknown
  knower.
commentary: 'Yājñavalkya''s move here is surgical: he strips away every sensory and cognitive handle by which the mind grasps
  an object. The Imperishable (akṣara) is not coarse (sthūla) or fine (aṇu)—not available to the gross senses or to subtle
  perception. More radically, it is unseen seer, unheard hearer, unthought thinker, unknown knower. Each phrase performs the
  same inversion: the Absolute is not *what is known* but the very capacity to know, yet even that capacity cannot be objectified
  or made into a ''thing.'' The teaching does not describe the akṣara; it dismantles the subject-object split that prevents
  recognition. When Gārgī asks what the worlds are woven on and in, Yājñavalkya does not offer a cosmic blueprint. He offers
  negation of every possible object, every possible distance between knower and known. The brahmin (and the listener) must
  abandon the hunt for a subtle object and recognize that the search itself—the seeking consciousness—*is* what cannot be
  grasped because it is the ground of all grasping. This is the Vedāntic cut: not mysticism, but the collapse of the observer''s
  refuge in objecthood.


  Key Terms


  **akṣaram** — the Imperishable, literally what does not decay or perish.

  **asthūlam** — not gross or corporeally extended.

  **anaṇu** — not minute or atomically subtle.

  **ahrāsvaṃ** — not short or limited by measurable dimension.


  Cross-Tradition Resonances


  **Dao De Jing 14:** The Dao is said to be looked at without being seen and listened to without being heard, resisting sensory
  apprehension much like Yājñavalkya’s Imperishable. Divergence: The Dao is typically presented as the nameless source and
  course of things, whereas the Upaniṣadic akṣara is also the irreducible knower behind knowing.

  **Plotinus, Enneads VI.9.3:** Plotinus describes the One as beyond determinate attributes and beyond the grasp of intellect,
  paralleling the via negativa applied to akṣara. Divergence: Plotinus sharply distinguishes the One from Intellect, while
  the Upaniṣadic formulation identifies ultimate reality with the ground of seeing, hearing, and knowing.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius approaches God through negations, denying every sensory and
  conceptual predicate in order to indicate divine transcendence. Divergence: Dionysian negation remains framed by a creator–creation
  distinction and Christian theology, whereas the Upaniṣadic passage points toward the self-ground of cognition itself.'
insight: 'Yājñavalkya''s move here is surgical: he strips away every sensory and cognitive handle by which the mind grasps
  an object.'
practice: 'In conversation or while listening to someone speak, pause mid-thought and notice: am I tracking their words as
  objects moving toward me, or am I the space in which their meaning appears? Return to that space—not as an idea but as the
  actual openness you are—three times during the day, without naming it.'
