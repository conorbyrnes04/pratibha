unit_label: The Whole That Remains Whole
title: The Whole That Remains Whole
unit_type: verse
sanskrit_devanagari: 'पूर्णम् अदः पूर्णम् इदं ।

  पूर्णात् पूर्णम् उदच्यते ।

  पूर्णस्य पूर्णम् आदाय ।

  पूर्णम् एवावशिष्यते ॥ ५.१.१ ॥'
sanskrit_iast: 'pūrṇam adaḥ pūrṇam idaṃ |

  pūrṇāt pūrṇam udacyate |

  pūrṇasya pūrṇam ādāya |

  pūrṇam evāvaśiṣyate || 5.1.1 ||'
translation_literal: That is fullness; this is fullness. From fullness, fullness arises. Taking fullness from fullness, fullness
  alone remains.
commentary: 'Pūrṇa means “full,” “complete,” or “whole”: not a large aggregate of things, but the unbounded reality in which
  all distinctions appear. “That” commonly gestures toward the transcendent or unmanifest; “this” toward the present, manifest
  world. The verse refuses to let these stand as rival domains: what appears is not outside fullness, and its emergence does
  not diminish the source. Its arithmetic is deliberately non-empirical. Finite objects can be divided and depleted; Brahman,
  the plenitude of being-consciousness, is not an object among objects and cannot be reduced by manifestation. The final claim
  also corrects a spiritual temptation: one need not reject the world in order to find the whole. Rather, discern the whole
  as the reality of both what is sought beyond and what is immediately given. The verse is a contemplative formula, not a
  cosmological calculation.


  Key Terms


  **pūrṇam** — fullness, completeness, undivided wholeness

  **adaḥ** — that; the seemingly remote or transcendent reality

  **idam** — this; the immediate, manifest reality

  **avaśiṣyate** — remains; is left over without diminution


  Cross-Tradition Resonances


  **Plotinus describes the One as inexhaustible: all things proceed from it without dividing or exhausting it.:**  Divergence:
  Plotinian procession is often more strongly hierarchical, whereas this verse identifies both “that” and “this” as fullness.

  **The Heart Sutra’s claim that form is not other than emptiness similarly denies that appearances stand apart from ultimate
  reality.:**  Divergence: Śūnyatā means emptiness of independent essence, not an Upaniṣadic Self or metaphysical fullness.

  **Classical doctrines of divine plenitude and creation hold that God’s giving of being does not lessen divine fullness.:**  Divergence:
  Christian thought generally maintains a creator–creature distinction that Advaitic readings of this verse can press beyond.'
practice: 'Sit quietly and notice one sensation, thought, or sound. Instead of treating it as an interruption to wholeness,
  ask: “Does this appearance occur outside awareness?” Rest for several breaths in the undivided field in which it arises
  and passes.'
