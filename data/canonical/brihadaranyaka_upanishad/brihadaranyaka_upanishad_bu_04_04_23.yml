sanskrit_devanagari: 'स एष आत्मा ब्रह्म ।

  विज्ञानमयो मनो-मयो प्राण-मयो चक्षुर्-मयो श्रोत्र-मयो ।

  आकाश-मयो आपस्-मयो अग्नेर्-मयो पृथिवी-मयो ।

  सर्वेन्द्र-मयो सर्व-लोक-मयो सर्व-भूत-मयो ।

  सर्वेन्द्र-मयो इत्य् आचक्षते ।

  सर्वेन्द्र-मयो ह्य् एष ।

  तस्यैतस्यात्मनो नाम सत्यम् ।

  सत्यस्य सत्यम् इति ।

  प्राणा वै सत्यम् ।

  तेषां एष सत्यम् ॥ ४.४.२३ ॥'
sanskrit_iast: 'sa eṣa ātmā brahma |

  vijñānamayo mano-mayo prāṇa-mayo cakṣur-mayo śrotra-mayo |

  ākāśa-mayo āpas-mayo agner-mayo pṛthivī-mayo |

  sarvendra-mayo sarva-loka-mayo sarva-bhūta-mayo |

  sarvendra-mayo ity ācakṣate |

  sarvendra-mayo hy eṣa |

  tasyaitasyātmano nāma satyam |

  satyasya satyam iti |

  prāṇā vai satyam |

  teṣāṁ eṣa satyam || 4.4.23 ||'
translation_literal: 'This Self is Brahman—composed of knowledge (vijñāna), mind (manas), breath (prāṇa), sight (cakṣus),
  hearing (śrotra), space (ākāśa), water (ap), fire (agni), earth (pṛthivī)—the Lord of all (sarva-indra), the world of all
  (sarva-loka), the being of all (sarva-bhūta). They call it ''Lord of all'' because it is the Lord of all. Its name is ''Truth
  of Truth'' (satyasya satyam): the vital breaths (prāṇa) are truth; this Self is their truth.'
commentary: 'This verse crowns the Yājñavalkya teaching by identifying the Self (ātman) with Brahman through a systematic
  enumeration of all manifest principles—from the subtlest (vijñāna, knowledge) through the faculties (manas, prāṇa, sense
  organs) to the gross elements (space, water, fire, earth). The phrase ''sarva-indra'' (Lord of all) signals sovereignty
  over all domains. The final formulation ''satyasya satyam''—truth of truth—establishes a hierarchy: the vital breaths are
  the proximate truth of embodied existence, yet the Self transcends and grounds them as their ultimate reality. This is not
  dualism but a recognition of levels of manifestation within non-dual being. The verse synthesizes cosmology and metaphysics
  into a single recognition: the Self pervades and transcends all orders of existence.


  Key Terms


  **ātman** — The inner Self, here identified with Brahman as the ground of all experience and manifestation.

  **vijñānamaya** — Made of discernment or knowing, indicating the Self''s presence through intelligence.

  **prāṇamaya** — Made of vital breath, expressing the Self as animating life-force.

  **sarvendra** — Lord of all, denoting comprehensive sovereignty over faculties, beings, and worlds.


  Cross-Tradition Resonances


  **Stoic Logos, especially Cleanthes, Hymn to Zeus 1–4:** The Stoic Logos pervades and orders the cosmos, paralleling the
  Upaniṣadic Self as present through every level of reality. Divergence: Stoicism generally presents Logos as rational cosmic
  providence, whereas this passage identifies ultimate reality with the inward ātman.

  **Tao Te Ching 25:** The Dao is described as vast, prior to heaven and earth, and moving through the whole cosmos, comparable
  to Brahman as the all-containing ground. Divergence: The Dao is characteristically unnamed and non-personal without an explicit
  doctrine that it is identical with an individual self.

  **Spinoza, Ethics I, proposition 15:** Spinoza''s claim that whatever exists is in God recalls the verse''s depiction of
  ultimate reality as expressed through mind, life, elements, and all beings. Divergence: Spinoza rejects a distinct inner
  Self identical with God and formulates immanence through substance and modes rather than ātman and Brahman.'
practice: 'Sit in stillness. Recite internally: ''I am the knower of all knowing, the hearer of all hearing, the breath of
  all breathing.'' Pause after each phrase. Then reverse: ''All knowing knows through me; all hearing hears through me; all
  breathing breathes through me.'' Notice the shift from subject-object duality to transparent presence. Rest as that presence,
  neither claiming nor denying the world''s appearance.'
