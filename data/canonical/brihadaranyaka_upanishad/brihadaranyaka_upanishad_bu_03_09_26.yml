title: 'The Self as Witness: Beyond All Duality'
unit_type: verse
sanskrit_devanagari: 'न तत्र चक्षुर् गच्छति, न वाग् गच्छति, नो मनो ।

  न विद्मो, न विजानीमो, यथैतद् अनुशिश्यते ।

  तद् अन्यत्, तद् अविद्यमानात्, तद् विज्ञेयम् ॥ ३.९.२६ ॥'
sanskrit_iast: 'na tatra cakṣur gacchati, na vāg gacchati, no mano |

  na vidmo, na vijānīmo, yathaitad anuśiśyate |

  tad anyat, tad avidyamānāt, tad vijñeyam || 3.9.26 ||'
translation_literal: The eye does not go there, nor speech, nor mind. We do not know it, nor do we understand how one would
  teach it. For it is other than the known, and it is beyond the unknown. Thus have we heard from the ancients who taught
  us this.
commentary: 'This passage from the Yājñavalkya-Maitreyī dialogue articulates the apophatic core of Advaita epistemology. The
  Self (ātman) transcends all sensory, linguistic, and mental apparatus—the very instruments through which knowledge ordinarily
  operates. The formula ''neti neti'' (not this, not this) finds its logical ground here: negation of objecthood is not mere
  ignorance but the precise method for approaching what cannot be objectified. The phrase ''tad avidyamānāt'' (beyond the
  unknown) is crucial—it distinguishes the Self from mere absence or void. The Self is not unknowable through deficiency but
  through transcendence of the subject-object duality that knowledge presupposes. Yājñavalkya''s appeal to śruti-paramparā
  (the lineage of hearing) grounds this teaching not in rational proof but in transmitted realization.


  Key Terms


  **cakṣus** — The eye, standing for sensory perception, which cannot reach Brahman as an object.

  **vāc** — Speech or language, inadequate to circumscribe what exceeds predication.

  **manas** — Mind, the faculty of conceptualization, which cannot grasp the Self as a determinate content.

  **vijñeyam** — That which is to be known, here paradoxically distinguished from both the known and the unknown.


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** The closely parallel formulation says that eye, speech, and mind do not reach Brahman, which is
  other than the known and beyond the unknown. Divergence: The supplied wording is substantially Kena Upaniṣad language, whereas
  Bṛhadāraṇyaka Upaniṣad develops its apophatic method most explicitly through the formula neti neti at 2.3.6 and 4.2.4.

  **Tao Te Ching 1:** Laozi opens by saying that the Dao that can be spoken is not the constant Dao, paralleling the Upaniṣadic
  refusal to identify ultimate reality with linguistic formulation. Divergence: The Dao is presented as the ineffable way
  or origin of the ten thousand things, while the Upaniṣadic context concerns Brahman or Ātman as the non-objectifiable ground
  of knowing.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius urges ascent beyond perception, speech, intellect, and every
  affirmation or negation toward the divine darkness beyond knowledge. Divergence: Dionysian apophasis remains framed by a
  transcendent Creator distinct from creatures, while Advaita readings identify the ultimate reality with the innermost Self
  rather than retaining that creator-creature distinction.'
practice: 'Sit in stillness. Notice the eye, speech, and mind as instruments. Ask: ''Who observes these instruments? Who hears
  the question?'' Do not answer with thought. Rest as the silent witness to all arising—the one to whom no experience is foreign,
  yet who is never touched by any experience. Return to this recognition whenever the mind seeks to grasp or define the Self.'
