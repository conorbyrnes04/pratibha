sanskrit_devanagari: 'तम् एव धीरो विज्ञाय ।

  प्रज्ञां कुर्वीत ब्राह्मणः ।

  नानुध्यायाद् बहूञ् छब्दान् ।

  वाचो विग्लापनं हि तत् ॥ ४.४.१९ ॥'
sanskrit_iast: 'tam eva dhīro vijñāya |

  prajñāṃ kurvīta brāhmaṇaḥ |

  nānudhyāyād bahūñ chabdān |

  vāco viglāpanaṃ hi tat || 4.4.19 ||'
translation_literal: Knowing that alone, the steadfast one, the knower of Brahman, should cultivate discerning insight (prajñā).
  Let one not brood over many words; for that is the wearying-away of speech.
commentary: 'The verse does not dismiss language, study, or teaching as such. The Upaniṣad itself has employed abundant speech
  to direct attention toward the Self (ātman). Its warning concerns the point at which verbal multiplicity becomes a substitute
  for realization. Having discerned “that alone” (tam eva)—the imperishable Self that is not an object among objects—the serious
  seeker is to make prajñā, lucid discriminative knowing, primary. “Many words” are not necessarily false; they become obstructive
  when thought merely circles among formulations, opinions, and sacred utterances without inward assimilation. Vāco viglāpanam
  suggests speech depleted, strained, or dissipated: discourse multiplying after it has ceased to disclose. The instruction
  is therefore methodological, not anti-intellectual. Use concepts to distinguish the Self from the transient; then do not
  mistake the conceptual instrument for what it indicates. Insight is to become steady, direct, and existential.


  Key Terms


  **tam eva** — that alone: the one reality already indicated in the surrounding teaching

  **prajñā** — discerning, lucid wisdom; insight rather than mere information

  **brāhmaṇaḥ** — one oriented toward Brahman; here a seeker/knower, not simply a social label

  **vāco viglāpanam** — the exhaustion, dissipation, or wearying of speech


  Cross-Tradition Resonances


  **“Those who know do not speak; those who speak do not know” similarly cautions against mistaking verbal display for realization.:**  Divergence:
  The Upaniṣad does not impose silence absolutely; it retains disciplined teaching as a valid pointer to Self-knowledge.

  **The Dharma is a means for crossing, not something to be clung to; teachings can become obstacles when possessed merely
  as doctrine.:**  Divergence: The Buddhist framing rejects an enduring Self, whereas this verse directs inquiry toward knowledge
  of the ātman.

  **Paul’s saying that “knowledge puffs up, but love builds up” warns that accumulated knowledge can fail to transform the
  person.:**  Divergence: Paul’s corrective is love within a relation to God and neighbor; this Upaniṣadic passage emphasizes
  contemplative discernment of the Self.'
practice: After reading or studying, stop for five minutes. Set aside every formulation—“I understand,” “I do not understand,”
  and even “Self”—and attend silently to the bare fact of awareness in which those thoughts arise. When a new explanatory
  thought appears, label it gently “word,” and return to awareness.
