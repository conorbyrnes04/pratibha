unit_id: brihadaranyaka_upanishad.bau_light
unit_label: What Light Does a Person Have
title: What Light Does a Person Have
unit_type: sutra
sanskrit_devanagari: किम्ज्योतिर् वायं पुरुष इति / आदित्यज्योतिः
sanskrit_iast: kimjyotir vāyaṃ puruṣa iti / ādityajyotiḥ
translation_literal: When the sun has set, and the moon has set, and the fire is gone out, what light does a person have?
  — The light of the Self, for by the light of the Self he sits, goes out, works, and returns.
commentary: 'Yājñavalkya''s question cuts at the root of perceptual dependence: *kim jyotir vayam purusha iti*—what light
  does a person have when all external luminaries vanish? The move is not metaphorical comfort but ontological precision.
  The answer—*atma-jyotis*—does not offer the Self as a replacement lamp among lamps, but as the irreducible condition of
  any knowing whatsoever. When sun, moon, fire extinguish, the body does not cease its sitting, going, working, returning.
  This continuity reveals that the light by which these acts occur is not borrowed from the sky or hearth but intrinsic to
  the person itself. The passage performs a specific Vedāntic cut: it strips away the assumption that consciousness is *lit
  up* by objects, and exposes instead that objects appear *within* a light that is already present, already the Self. This
  is not neti-neti negation of the Self, but negation of the false dependency—the phantom second that seems to illuminate
  us from outside. The person who grasps this does not become luminous; he recognizes he never was dark. Darkness is only
  the *appearance* of lacking an external source; the Self-light requires no source because it is the source-condition itself.'
insight: 'Yājñavalkya''s question cuts at the root of perceptual dependence: *kim jyotir vayam purusha iti*—what light does
  a person have when all external luminaries vanish?'
practice: 'At dusk, as natural light fades, do not switch on a lamp immediately. Sit where you are and notice: your hands,
  the room''s contours, your breath—all perceptible without electric light. Observe that perception itself has not dimmed,
  only the external source. Ask directly: what is aware of this dimness? That awareness—unchanged by the sun''s absence—is
  the light the passage names.'
