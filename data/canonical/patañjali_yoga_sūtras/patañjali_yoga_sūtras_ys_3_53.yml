sanskrit_devanagari: जाटिलाक्षणादेशैः अन्यतांवच्छेदात् तुल्यायः ततः प्रतिपत्तिḥ
sanskrit_iast: jātilakṣaṇadeśair anyatānavacchedāt tulyayos tataḥ pratipattiḥ
translation_literal: When genus, distinguishing mark, and location are cut away—when the otherness between
  them is severed—then from that equality comes direct perception.
commentary: "This sūtra addresses a subtle but crucial problem in perception and discrimination: how does\
  \ the mind distinguish between two seemingly identical objects or states? Patañjali points to three\
  \ conventional categories by which we normally separate things: jāti (class or genus—'this is a pot,\
  \ that is a cloth'), lakṣaṇa (distinguishing mark or quality—'this is red, that is smooth'), and deśa\
  \ (location or position—'this is here, that is there'). \n\nIn the path of yoga, however, there comes\
  \ a stage where the practitioner's perception becomes so refined that these conceptual scaffoldings\
  \ dissolve. The 'otherness' (anyatā) between objects—the mental habit of perpetually dividing and labeling—is\
  \ 'cut away' (avacchedāt). When that dualistic veil lifts, what remains is direct perception (pratipattiḥ)\
  \ of an underlying equality or sameness (tulyayos). This is not indifference or confusion; rather, it\
  \ is a non-dual recognition that transcends the subject-object split that normally governs cognition.\n\
  \nThis verse appears in the context of Patañjali's teaching on the transformation of the mind (citta-vṛtti-nirodha).\
  \ It suggests that as mental modifications settle, perception itself becomes unmediated—no longer filtered\
  \ through the categories of class, quality, and position. The yogi perceives directly, without the intermediate\
  \ step of conceptual labeling. This is a marker of advanced samādhi, where the boundary between knower\
  \ and known grows transparent.\n\nKey Terms\n\n**jāti** — genus, class, or category—the conceptual box\
  \ into which we sort things\n**lakṣaṇa** — distinguishing mark, quality, or characteristic that sets\
  \ one thing apart from another\n**deśa** — location, position, or spatial placement—the 'where' that\
  \ separates objects"
insight: The sūtra asserts that by treating every moment as a unique, indivisible entity, one can achieve
  a unified perception of reality.
practice: 'Sit quietly and choose a simple object—a stone, a leaf, or a cup of water. Normally you perceive
  it through labels: ''This is a stone. It is gray. It is on the table.'' For 10 minutes, deliberately
  suspend these three categories. Do not name its class (stone, mineral, object). Do not isolate its marks
  (color, texture, weight). Do not fix its location (here, not there). Instead, allow your awareness to
  rest on the bare presence of the thing itself, without division or naming. You may notice a subtle shift:
  the object begins to feel less ''other,'' less separate from your perceiving. This is a taste of the
  equality Patañjali describes. Return to normal perception afterward. Practice this weekly to train the
  mind''s capacity to perceive beyond conceptual scaffolding.'
