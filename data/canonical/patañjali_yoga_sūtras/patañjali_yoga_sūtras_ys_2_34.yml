sanskrit_devanagari: वितर्क हिंसादायः कृतकृतिनुमोदितालभकृतमोहापूर्वकाः मृदुमध्यमाधिमात्रादुहखाज्ञानान्तफलाः
  इति प्रतिपक्षाभावना
sanskrit_iast: vitarkā hiṃsādayaḥ kṛtakāritānumoditā lobhakrodhamohapūrvakā mṛdumadhyādhimātrā duḥkhājñānānantaphalā
  iti pratipakṣabhāvanam
translation_literal: Harmful thoughts—violence and the rest—whether enacted, caused to be done, or merely
  approved, arise from greed, anger, and delusion. They exist in mild, medium, or intense degrees and
  yield suffering and ignorance without end. This is the counter-contemplation.
commentary: 'This sūtra (II.34) describes pratipakṣabhāvanā, the yogic method of neutralizing destructive
  mental patterns through deliberate counter-contemplation. Patañjali identifies a specific class of vitarka
  (thought-impulses) rooted in hiṃsā (harm) and its derivatives. The key insight is that such thoughts
  operate on three levels of agency: direct action (kṛta), instrumental action (kārita), and tacit approval
  (anumodita). This taxonomy recognizes that complicity and mental assent carry the same karmic weight
  as overt deed.


  Crucially, Patañjali traces all harmful impulses to three afflictions (kleśa): lobha (greed), krodha
  (anger), and moha (delusion). These are not separate from the thought itself but its generative root.
  The sūtra then specifies that such thoughts manifest across a spectrum—mṛdu (mild), madhya (medium),
  adhimātra (intense)—acknowledging that harm exists on a continuum, not as an absolute category.


  The phrase duḥkhājñānānantaphalā (bearing fruit in suffering and ignorance without end) does not mean
  infinite literal consequences but rather that the chain of reaction remains unbroken: harmful thought
  produces suffering, which perpetuates ignorance, which generates more harmful thought. This is the saṃsāric
  loop.


  Pratipakṣabhāvanā—counter-contemplation—is not suppression or denial. It is the deliberate cultivation
  of the opposite quality or the contemplation of the actual consequences of the harmful impulse. By holding
  awareness of how greed, anger, and delusion generate suffering (in oneself and others), the yogi weakens
  the vasana (latent impression) that would otherwise ripen into action.


  Key Terms


  **vitarka** — thought-impulse or deliberative thought; here, specifically destructive mental patterns

  **pratipakṣabhāvanā** — counter-contemplation; the yogic method of neutralizing destructive patterns
  by cultivating awareness of their opposite or their actual consequences

  **kleśa** — affliction or obstacle to liberation; the five are avidyā (ignorance), asmitā (ego), rāga
  (attachment), dveṣa (aversion), and abhiniveśa (fear of death)'
insight: The passage asserts that all forms of violence, whether performed, permitted, or merely condoned,
  are fundamentally *ignorant* and inevitably produce suffering.
practice: 'For one week, choose one mild harmful impulse you notice in yourself—a moment of impatience,
  a small unkind thought, a flash of wanting something that isn''t yours. When you catch it, pause and
  ask: What kleśa is driving this? Is it greed, anger, or delusion? Then, deliberately contemplate the
  actual consequence: If I acted on this, what suffering would follow—for me, for others, for the situation?
  Hold that consequence in awareness for three full breaths without judgment. Do not fight the impulse;
  simply let the weight of its actual fruit become real to you. Over time, this rewires the mind''s automatic
  response. You are not being virtuous; you are becoming intelligent about cause and effect.'
