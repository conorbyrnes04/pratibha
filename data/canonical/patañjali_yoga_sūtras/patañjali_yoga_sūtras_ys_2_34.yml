title: Violence, Greed, and Ignorance
unit_type: sutra
sanskrit_devanagari: वितर्क हिंसादायः कृतकृतिनुमोदितालभकृतमोहापूर्वकाः मृदुमध्यमाधिमात्रादुहखाज्ञानान्तफलाः इति प्रतिपक्षाभावना
sanskrit_iast: vitarkā hiṃsādayaḥ kṛtakāritānumoditā lobhakrodhamohapūrvakā mṛdumadhyādhimātrā duḥkhājñānānantaphalā iti pratipakṣabhāvanam
translation_literal: When one acts with violence, or allows it, or even approves it—whether driven by greed, anger, or infatuation—whether
  the act is mild, moderate, or extreme—such conduct is rooted in ignorance and yields inevitable pain. Reflecting upon this
  is the practice of *pratipakṣabhāvanā*.
commentary: 'The passage asserts that all forms of violence, whether performed, permitted, or merely condoned, are fundamentally
  *ignorant* and inevitably produce suffering. It challenges the common intuition that passive approval is harmless, insisting
  instead that the mental assent itself seeds ignorance. In the Yoga–Sāṃkhya tradition, *pratipakṣabhāvanā* is a preparatory
  practice that cultivates *vipākāra*—the internal opposition to the very root of suffering. By confronting the *māyā* of
  violence, one sharpens the mind’s discernment (*viveka*), thereby weakening the *citta*’s entanglement in *vṛtti*. The Satchidananda
  commentary emphasizes that even indirect approval suffices to generate *duḥkha*; this underscores the Yoga sutra’s insistence
  that the mind’s subtle inclinations are as potent as overt actions. Practically, the sutra invites the practitioner to observe
  moments of approval or indifference toward harm and to consciously reverse that stance, thereby eroding the *māyā* that
  fuels ignorance. Such a disciplined mental posture aligns with the ultimate goal of *samādhi*—the stillness achieved when
  the *citta* is no longer hijacked by *vṛtti*.


  The sutra’s claim that *pratipakṣabhāvanā* is effective even when the harmful act is not directly performed highlights the
  Yoga school’s understanding of *pratipakṣa* as a mental counteraction that operates at the level of *citta* rather than
  *prakṛti*. This distinction is crucial for practitioners seeking to master *vipākāra* without engaging in external interventions.


  Key Terms


  **vitarka (वितर्क)** — ‘analysis’ → ‘critical examination’ → Yoga’s use: to interrogate thoughts that lead to ignorance


  **pratipakṣabhāvanā (प्रतिपक्षाभावना)** — ‘opposing attitude’ → ‘mental opposition to harm’ → Yoga’s practice of countering
  vṛtti


  **māyā (माया)** — ‘illusion’ → ‘delusive appearance of duality’ → Yoga’s concept of ignorance that fuels suffering


  **vipākāra (विपाकारा)** — ‘mental opposition’ → ‘active counterforce against vṛtti’ → Yoga’s preparatory practice for samādhi


  Cross-Tradition Resonances


  **Yoga Sūtra 2.34:** Structural homology: the sutra lists conditions (violence, approval, intensity) that lead to ignorance,
  mirroring the pattern in 2.33 where causes of suffering are enumerated

  *Divergence:* Unlike 2.33, 2.34 emphasizes the *mental* dimension of approval, not just external action


  **Sāṃkhya Tattva Śāstra 1.5:** Both texts link ignorance (*avidyā*) with *duḥkha* and stress the role of *citta* in perpetuating
  suffering

  *Divergence:* Sāṃkhya attributes suffering to *prakṛti*’s misidentification, whereas Yoga focuses on *citta*’s misdirected
  attention


  **Bhaṭṭārāyaṇa, Vṛtti‑buddhi‑śāstra:** Both treat *vipākāra* as a preparatory practice to counter *vṛtti*

  *Divergence:* Bhaṭṭārāyaṇa expands *vipākāra* to include ethical conduct, while Yoga limits it to mental opposition


  **Satchidananda, Commentary on 2.34:** Both affirm that indirect approval of harm suffices to generate ignorance

  *Divergence:* Satchidananda explicitly cites *moha* as the catalyst, whereas the sutra remains neutral about the specific
  emotion'
insight: The passage asserts that all forms of violence, whether performed, permitted, or merely condoned, are fundamentally
  *ignorant* and inevitably produce suffering.
practice: Observe each moment when you approve or tolerate violence, even mildly, and consciously shift your mind to oppose
  it, thereby practicing *pratipakṣabhāvanā*.
