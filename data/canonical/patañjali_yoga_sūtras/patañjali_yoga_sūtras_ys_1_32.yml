  items:
  - term: abhyāsa (अभ्यास)
    definition: 'abhi-√ās ‘sit toward’ → sustained practice -> in “Steadying the Mind”: the cultivation of a mental habit
      through consistent return -> not sporadic effort; long, uninterrupted, earnest cultivation of stability'
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Steadying the Mind”: denotes the manifold,
      fluctuating consciousness, not the pure subject -> not ‘brain software’ or an enemy to smash; the reflecting medium
      whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Steadying the Mind”: the mental modifications that obscure
      puruṣa -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Steadying the Mind”: the observer, distinct from
      prakṛti -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Steadying the Mind”: samādhi: a state of absorption that is
      also a continuous practice of single‑pointed attention -> not trance-entertainment or unconsciousness; graded absorption
      where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
