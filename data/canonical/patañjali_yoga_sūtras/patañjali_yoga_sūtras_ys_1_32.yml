- kind: translation
  label: Pratibha Translation
  body: The mind must be steadied; to that end, a single‑pointed, conscious meditation is practiced continuously, preventing
    the mind from scattering.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that the mind’s steadying is the very purpose of samādhi. It is not a passive state but an active,
    continuous application of attention to one object. This claim foregrounds the Sāṃkhya notion that the mind (citta) is
    a fluctuating process (vṛtti) that must be held in a single focus to reveal the self (puruṣa). The sutra’s wording—‘prevent
    these’—implies that the mind is prone to dispersion; the remedy is an ongoing, conscious practice. The Dvivedi commentary’s
    emphasis on ‘intense application to any one thing’ mirrors the classic idea of ‘ekatattva’ (unity of attention) and anticipates
    the later elaboration of ‘sampamjñata‑samādhi’ (conscious meditation). The philosophical claim here is that samādhi is
    not merely a state but a dynamic process that continuously re‑anchors the mind. This has existential import: by maintaining
    a single focus, the practitioner cultivates a stable awareness that can discern the subtle difference between prakṛti
    and puruṣa, thereby progressing toward liberation. The sutra’s brevity belies its depth; it encapsulates the core of the
    Yoga path: continuous, intentional concentration as the means to still the mind’s restless fluctuations.


    Key Terms


    **citta (चित्त)** — citta: ‘mind’ in Sāṃkhya; denotes the manifold, fluctuating consciousness, not the pure subject


    **vṛtti (वृत्ति)** — vṛtti: ‘process’ or ‘fluctuation’; the mental modifications that obscure puruṣa


    **puruṣa (पुरुष)** — puruṣa: the pure, unchanging self; the observer, distinct from prakṛti


    **samādhi (समाधि)** — samādhi: a state of absorption that is also a continuous practice of single‑pointed attention


    Cross-Tradition Resonances


    **Yoga Sūtra 1.32:** The sutra’s imperative ‘prevent these’ parallels the later injunction in 1.38 that the mind must
    be kept steady; both emphasize continuous practice.

    *Divergence:* While 1.32 focuses on the method (single‑pointed attention), 1.38 shifts to the result (steady mind), illustrating
    a move from technique to outcome


    **Bhasya on 1.32:** Dvivedi’s reference to ‘intense application to any one thing’ echoes the Śaṅkara commentary’s notion
    of ‘ekatattva’—unity of attention.

    *Divergence:* Dvivedi expands the idea to a practical instruction, whereas Śaṅkara remains more abstract, highlighting
    a pedagogical divergence


    **Yoga Sūtra 1.33:** Both sutras discuss the mind’s fluctuations; 1.33 names the specific vṛtti (pratibha) that must be
    subdued.

    *Divergence:* 1.32 prescribes the method, while 1.33 identifies the obstacle, showing a complementary structure


    **Bhasya on 1.32:** The commentary’s emphasis on ‘intense application’ aligns with the Sāṃkhya principle of ‘pratyakṣa’
    (direct perception) as the means to discern puruṣa.

    *Divergence:* Dvivedi’s text frames the practice in terms of bodily anchoring, whereas the original sutra remains purely
    mental, indicating a shift from abstract to embodied interpretation'
