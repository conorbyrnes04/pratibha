title: Steadying the Mind
unit_type: sutra
sanskrit_devanagari: ततप्रतिषेधार्थम् एकतत्त्वाभ्यासः
sanskrit_iast: tatpratiṣedhārtham ekatattvābhyāsaḥ
translation_literal: To counter that, practice focusing on a single principle.
commentary: 'This sūtra (II.32) addresses the obstacle of mental distraction and restlessness (viṣaya-vikalpa)
  that arises during meditation. Patañjali prescribes ekatattvābhyāsa—the sustained cultivation of attention
  on one tattva, or fundamental principle. This is not mere concentration on an object, but deliberate
  engagement with a single truth or reality-principle to the exclusion of competing mental movements.


  The word tat refers back to the preceding obstacles (kāma, krodha, moha—desire, aversion, delusion).
  Pratiṣedha means to obstruct or neutralize. The remedy is abhyāsa, disciplined practice, directed toward
  ekatattvam—one principle, one reality.


  Within the Yoga–Sāṃkhya framework, this principle is typically understood as the unchanging witness-consciousness
  (puruṣa) or the nature of the self as distinct from mental fluctuation. By anchoring awareness repeatedly
  to this single, non-dual reality, the yogi starves the competing mental patterns that feed distraction.
  The practice is not suppression but replacement: one stable focus displaces the scattered many.


  This sūtra assumes that the mind, by its nature, seeks unity. When given a true, singular object of
  contemplation—one that does not shift or deceive—the mind naturally settles. The key is consistency:
  ekatattvābhyāsa is not occasional glimpsing but systematic, patient return to the same principle.


  Key Terms


  **ekatattvam** — a single principle or fundamental reality; the unified object of meditative focus

  **abhyāsa** — disciplined, repeated practice; the cultivation of a mental habit through consistent return

  **pratiṣedha** — obstruction, neutralization, or counteraction of an obstacle or unwanted mental state'
insight: The sutra asserts that the mind’s steadying is the very purpose of samādhi.
practice: When distraction pulls your attention in multiple directions, whisper aloud the single word
  'tat'—that unchanging witness—and let your awareness contract to the space behind all thought, returning
  there each time the mind splinters until the day ends.
