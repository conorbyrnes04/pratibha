sanskrit_devanagari: 'कण्ठकूपे क्षुतपिपासानिवृत्तिḥ ॥ ३.३० ॥


  कुर्मणाड्यम् स्थैर्यम् ॥ ३.३१ ॥


  मूर्धज्योतिṣि सिद्धदर्शनम् ॥ ३.३२ ॥


  प्रातिभाद् वा सर्वम् ॥ ३.३३ ॥


  हृदये चित्तसंवित ॥ ३.३४ ॥


  सत्त्वपुरुषायोर अत्यान्तासंकीर्णयोः प्रत्ययाविशेषो भोगः परार्थात् स्वार्थसंयमात् पुरुषज्ञानम् ॥ ३.३५
  ॥


  ततः प्रतिभाश्रावणवेदनादेशा स्वादवार्ता जायतें ॥ ३.३६ ॥


  ते समाधाव उपसर्गा वयुत्थाने सिद्धयाḥ ॥ ३.३७ ॥'
sanskrit_iast: 'kaṇṭhakūpe kṣutpipāsānivṛttiḥ || 3.30 ||


  kūrmanāḍyāṃ sthairyam || 3.31 ||


  mūrdhajyotiṣi siddhadarśanam || 3.32 ||


  prātibhād vā sarvam || 3.33 ||


  hṛdaye cittasaṃvit || 3.34 ||


  sattvapuruṣayor atyantāsaṃkīrṇayoḥ pratyayāviśeṣo bhogaḥ parārthāt svārthasaṃyamāt puruṣajñānam || 3.35
  ||


  tataḥ prātibhaśrāvaṇavedanādarśāsvādavārtā jāyante || 3.36 ||


  te samādhāv upasargā vyutthāne siddhayaḥ || 3.37 ||'
translation_literal: '**3.30** By saṃyama on the hollow of the throat: cessation of hunger and thirst.

  **3.31** By saṃyama on the tortoise channel: steadiness.

  **3.32** By saṃyama on the light at the crown of the head: vision of the perfected beings.

  **3.33** Or from intuitive flash, all knowledge.

  **3.34** By saṃyama on the heart: awareness of consciousness.

  **3.35** Experience arises from the indistinct cognition of sattva and puruṣa, which are utterly unmixed.
  Since experience exists for the sake of another, by saṃyama on what exists for one''s own sake arises
  knowledge of puruṣa.

  **3.36** From that arise intuitive hearing, touching, seeing, tasting, and smelling.

  **3.37** These are obstacles to samādhi; in the emergent state, they are powers.'
commentary: 'Sūtras 3.30–3.37 trace a single arc: the practitioner''s progressive inward refinement of
  attention through bodily loci, culminating in the recognition that puruṣa (the Self) is utterly distinct
  from all objects of experience, including the intellect itself. The sequence is not arbitrary. Beginning
  with the navel plexus (3.30), the practitioner gains knowledge of the body''s constitution—prakṛti in
  its most immediate, tangible form. The focus then ascends to the throat (3.31), where the mind itself
  becomes steady, marking a shift from body-knowledge to mind-mastery. At the mind''s eye (3.32), vision
  perfects; in the heart (3.34), the mind unites with its own essence. Each locus represents a subtler
  layer of prakṛti, each saṃyama a deeper penetration. But 3.35 introduces the pivot: the experience of
  sattva-puruṣa—the luminous presence of consciousness itself—is not enjoyment (bhoga) for the Self, but
  rather self-control (vairāgya) and puruṣa-knowledge. This is the critical reversal. What appears as
  an object of experience (pratyaya) to the intellect is recognized by the Self as its own freedom from
  all experience. Sūtra 3.36 then makes explicit what the practice has been demonstrating: the intellect
  (buddhi) and the Self are entirely distinct. The intellect exists for the sake of the Self; the Self
  exists for its own sake. This is not metaphysical abstraction but the lived realization emerging from
  saṃyama. The intellect—even in its most refined, sattvic state—remains prakṛti, an instrument. The Self
  transcends all instruments. Finally, 3.37 shows that from this samādhi of non-dual recognition, spontaneous
  supernormal perceptions arise—not as powers to be grasped, but as natural overflow of the Self''s freedom
  from identification with any particular sense or object. The cluster thus enacts kaivalya (aloneness)
  in real time: through disciplined attention to prakṛti''s layers, the practitioner exhausts prakṛti''s
  claim to be the Self, and stands as puruṣa—untouched, self-luminous, and utterly free.


  Key Terms


  **saṃyama** — The unified practice of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi)
  on a single object or locus, yielding direct knowledge.

  **puruṣa** — The transcendent Self or consciousness, eternally distinct from prakṛti; the witness of
  all experience, untouched by change.

  **prakṛti** — Nature or materiality in its subtle and gross forms; the entire field of objects, including
  body, mind, and intellect, that exist for the sake of puruṣa''s liberation.

  **kaivalya** — Aloneness or isolation; the final liberation in which puruṣa recognizes itself as eternally
  free from all entanglement with prakṛti.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.29:** Both texts teach that the yogi perceives the Self (ātman) in all beings and
  all beings in the Self through disciplined practice; the distinction between observer and observed dissolves
  in stable wisdom. Divergence: The Gītā emphasizes this recognition as devotional surrender to Kṛṣṇa
  and duty (dharma), whereas Patañjali''s Yoga is non-theistic and focuses on the mechanics of prakṛti-puruṣa
  discrimination independent of ethical action.

  **Plotinus, Enneads 6.9.11:** Both describe a hierarchical ascent of consciousness through increasingly
  subtle levels of reality, culminating in the recognition that the highest principle (the One/puruṣa)
  is utterly transcendent and beyond all objects of knowledge. Divergence: Plotinus''s One remains ineffable
  and beyond even intellection, whereas Patañjali''s puruṣa is pure consciousness (cit) that can be directly
  realized through systematic practice, not mystical union.

  **Dhammapada 354–355:** Both teach that liberation arises from the direct insight that what appears
  as a unified self is actually a constantly changing process; freedom comes through seeing through this
  illusion. Divergence: The Dhammapada denies any permanent Self (anātman), whereas Yoga affirms puruṣa
  as eternally real and unchanged; the divergence reflects the Buddhist rejection of ātman-doctrine versus
  the Sāṃkhya-Yoga affirmation of it.'
