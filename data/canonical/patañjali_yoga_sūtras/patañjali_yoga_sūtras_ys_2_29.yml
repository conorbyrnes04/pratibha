  - term: yoga (योग)
    definition: '√yuj ‘yoke, harness, join’ -> You practice the eight accessories of yoga: restraint,
      posture, breath regulation, abstention, meditation, abstractio… -> not a posture class or romantic
      ‘union’ fantasy — technical stilling/harnessing of mind'
    lemma_id: yoga
    sense_id: yoga.classical
  - term: pratyāhāra (प्रत्याहार)
    definition: 'prati-ā-√hṛ ‘draw back toward’ → sense-withdrawal -> withdrawal of senses; stakes the
      argument of: You practice the eight accessories of yoga: restraint, posture, breath regulation,
      abstention, meditation, abstractio… -> not sensory deprivation; senses following citta’s inward
      turn as bees follow the queen'
  - term: prāṇāyāma (प्राणायाम)
    definition: 'prāṇa + āyāma ‘extension/regulation of breath-life’ -> You practice the eight accessories
      of yoga: restraint, posture, breath regulation, abstention, meditation, abstractio… -> not breath
      tricks for calm apps; interruption of inhalation/exhalation that thins the covering of light'
  - term: dhāraṇā (धारणा)
    definition: '√dhṛ ‘hold’ → binding mind to a place -> You practice the eight accessories of yoga:
      restraint, posture, breath regulation, abstention, meditation, abstractio… -> not casual focus;
      deliberate localization of citta that begins saṃyama'
  - term: aṅga (अङ्ग)
    definition: '‘limb/accessory’ of the eightfold path -> in “Eight Accessories of Yoga”: a component
      part of the eight-fold yoga system -> not body-part list for its own sake; interdependent accessories
      culminating in samādhi'
