sanskrit_devanagari: यमानी्यमासनप्राणायामप्रतियाहारधारणाध्यानसमाधयोऽष्टावङ्गानि
sanskrit_iast: yamaniyamāsanaprāṇāyāmapratyāhāradhāraṇādhyānasamādhayo 'ṣṭāv aṅgāni
translation_literal: Ethical restraint, observance, posture, breath-regulation, sense-withdrawal, concentration,
  meditation, and absorption—these eight are the limbs of yoga.
commentary: 'This sūtra (II.29) presents the foundational architecture of classical yoga as an eight-fold
  path. Patañjali names the eight aṅga (limbs or accessories) that constitute the complete yogic system
  within the Yoga–Sāṃkhya framework.


  Each limb builds upon the previous one in a logical sequence, though not necessarily a rigid temporal
  order. Yama and niyama (ethical restraint and observance) establish the moral ground—they are prerequisites
  because an unstable, reactive mind cannot progress in inner work. Āsana (posture) stabilizes the body
  so it does not distract during practice. Prāṇāyāma (breath-regulation) harnesses vital energy and calms
  mental fluctuation. Pratyāhāra (sense-withdrawal) turns attention inward, away from external objects.
  Dhāraṇā (concentration) focuses the mind on a single point. Dhyāna (meditation) sustains that focus
  without strain or interruption. Samādhi (absorption) is the state in which the meditator, meditation,
  and object of meditation merge into undifferentiated awareness.


  Crucially, Patañjali does not present these as separate disciplines but as interconnected stages of
  a single unfolding. The system is holistic: ethical maturity enables physical stability; physical stability
  enables breath work; breath work enables sense control; sense control enables mental focus; mental focus
  ripens into meditation; meditation flowers into samādhi. This verse establishes that yoga is not merely
  postural exercise or breathing technique, but a comprehensive path of transformation that engages body,
  energy, mind, and consciousness.


  Key Terms


  **yama** — Ethical restraints or abstentions; the five are non-harm, truthfulness, non-stealing, non-excess,
  and non-attachment.

  **niyama** — Observances or positive disciplines; the five are purity, contentment, discipline (tapas),
  self-study, and surrender to the divine.

  **aṅga** — Limb or accessory; a component part of the eight-fold yoga system.'
insight: The passage asserts that yoga is not merely a set of postures but a systematic cultivation of
  eight interrelated faculties.
practice: 'Today, practice the first three limbs in sequence as a unified session: (1) Reflect on one
  yama—truthfulness, non-harm, non-stealing, non-excess, or non-attachment—and notice one place in your
  day where you acted in alignment with it. (2) Choose one niyama—purity, contentment, discipline, self-study,
  or surrender—and commit to one small action that embodies it (e.g., a few minutes of study, or tidying
  your practice space). (3) Sit in a comfortable, upright posture (āsana) for 5–10 minutes. Do not strain;
  simply allow your spine to lengthen and your shoulders to settle. Notice how ethical intention and physical
  stability create a foundation for the breath and mind work that follows. This grounds the abstract eight-fold
  teaching in lived experience.'
