- kind: translation
  label: Pratibha Translation
  body: 'You practice the eight accessories of yoga: restraint, posture, breath regulation, abstention,
    meditation, abstraction, absorption, and trance.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that yoga is not merely a set of postures but a systematic cultivation of
    eight interrelated faculties. The first claim is that the eight accessories are hierarchical, each
    building upon the previous, thereby constituting a progressive path toward samādhi. The contested
    move is the inclusion of ‘abstraction’ (वृत्ति) as an accessory; some commentators treat it as a mental
    process rather than a direct practice. In the Sāṃkhya–Yoga framework, the eight are understood as
    tools that transform prakṛti by subduing the vṛtti of the citta. This transformation is existential:
    the practitioner learns to observe the mind’s fluctuations, thereby gaining freedom from the cycle
    of birth and death. The Dvivedi commentary’s reference to extrinsic versus intrinsic accessories aligns
    with the traditional distinction between external practices (posture, breath) and internal processes
    (meditation, abstraction). By integrating both, the sūtra presents a holistic sādhanā that prepares
    the puruṣa to recognize its distinction from prakṛti, ultimately facilitating the dissolution of the
    illusory self. Thus, the eight accessories are not merely techniques but stages of self‑realization,
    each indispensable for the yogi’s liberation.


    Key Terms


    **yama (यम)** — etymology: restraint; tradition: moral discipline; default translation often ''restraint''
    but misses its role as the first step of ethical purification


    **pratyāhāra (प्रतियाहार)** — etymology: withdrawal; tradition: withdrawal of senses; default translation
    ''withdrawal'' omits its function as the gateway to inner focus


    **vṛtti (वृत्ति)** — etymology: fluctuation; tradition: mental modifications; default translation
    ''abstraction'' fails to capture its dynamic, continuous nature


    **samādhi (समाधि)** — etymology: absorption; tradition: final absorption; default translation ''concentration''
    underplays its transcendental aspect


    Cross-Tradition Resonances


    **Yoga Sūtra 2.29:** Enumeration of eight accessories mirrors the eight limbs of Patanjali’s Yoga
    Sūtra, structurally aligning with the progression from yama to samādhi

    *Divergence:* Unlike the earlier limbs, this passage treats each accessory as a distinct practice
    rather than a subset of a single limb


    **Bhaṭṭa, Yogaśāstra, 1.1:** Both texts list eight elements, but Bhaṭṭa’s list includes ‘sattva’ and
    ‘prāṇāyāma’ as separate, whereas here they are combined under breath regulation

    *Divergence:* The Sūtra’s compact form emphasizes functional integration rather than categorical separation


    **Dvivedi, 2.29:** Dvivedi’s commentary explicitly distinguishes extrinsic and intrinsic accessories,
    echoing the Sāṃkhya dualism of prakṛti and puruṣa

    *Divergence:* Dvivedi expands the list with explanatory detail, whereas the original sūtra remains
    terse, leaving interpretation open


    **Patanjali, Sūtra 2.30:** Both passages link breath regulation to the cessation of vṛtti, indicating
    a shared understanding of prāṇāyāma’s role in mental stillness

    *Divergence:* Patanjali’s text treats prāṇāyāma as a limb, while the current sūtra places it as one
    of the eight accessories, suggesting a different pedagogical emphasis'
