sanskrit_devanagari: चन्द्रे ताराव्यूहज्ञानम्
sanskrit_iast: candre tārāvyūhajñānam
translation_literal: By fixing attention on the moon, knowledge of the arrangement of stars arises.
commentary: 'This sūtra appears in Patañjali''s Yoga Sūtras III.28, within the section on *samyama* (the
  unified binding of concentration, meditation, and absorption). It exemplifies how the yogin''s refined
  perceptual capacity, once stabilized through practice on a chosen object, yields extraordinary knowledge
  of phenomena related to that object.


  The moon (*candra*) serves as the focal point for *samyama*. The moon is not chosen arbitrarily: in
  yogic physiology and cosmology, the moon governs the subtle channels (*nāḍī*), the flow of the life-force
  (*prāṇa*), and the mind''s reflective capacity. It is the seat of *soma*, the cooling, nourishing principle
  that stabilizes consciousness.


  When the yogin''s attention becomes perfectly unified on the moon through *samyama*, the boundary between
  subject and object dissolves. The knowledge (*jñāna*) that emerges is not intellectual inference but
  direct, non-dual perception. The arrangement of stars (*tārāvyūha*) — their positions, movements, relationships,
  and the subtle forces governing them — becomes transparent to the yogin''s consciousness. This is not
  astronomy learned from texts; it is immediate knowing arising from the unified field of attention.


  Within the Sāṃkhya-Yoga framework, this demonstrates a fundamental principle: consciousness (*puruṣa*),
  when freed from the distortions of the ordinary mind, has access to knowledge of the subtle structures
  of nature (*prakṛti*). The moon is a bridge between gross and subtle; mastery of attention on the moon
  opens perception to the stellar order that the ordinary eye cannot fully comprehend.


  This sūtra also teaches that *samyama* is not merely introspective. It can be turned toward any object—celestial,
  terrestrial, or subtle—and will yield knowledge proportionate to the depth of unification achieved.
  The yogin becomes a knower of the world''s hidden arrangements.


  Key Terms


  **samyama** — The unified binding of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi)
  on a single object; the yogic method for gaining direct knowledge of subtle phenomena.

  **candra** — The moon; in yoga, the principle of coolness, receptivity, and the flow of prāṇa through
  the left channel (iḍā nāḍī); the seat of soma.

  **tārāvyūha** — The arrangement or configuration of stars; the stellar order and the subtle forces governing
  celestial relationships.'
insight: The central claim of this aphorism is that the moon itself is not merely a celestial body but
  a dynamic repository of the cosmos’ structural knowledge.
practice: On a night when the moon is visible, fix your gaze on it until the boundary between your eye
  and the moon blurs—until you cannot tell if you are looking at it or it is looking through you—and hold
  that threshold without turning away or thinking, letting the knowledge of the stars' positions arise
  as a felt knowing rather than a thought.
