- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this aphorism is that the moon itself is not merely a celestial body but a dynamic repository
    of the cosmos’ structural knowledge. By identifying the moon with the knowledge of the star‑arrangement, Patanjali elevates
    a natural phenomenon to a symbolic mirror of the mind’s capacity to apprehend the world’s underlying order. The contested
    move here is the identification of a physical object (candra) with an abstract faculty (jñāna); some commentators treat
    it as a metaphor, others as a literal ontological equivalence. In the Yoga tradition, this equivalence underscores the
    principle that the puruṣa (consciousness) can be understood through the prakṛti (material world) when the mind is in samādhi,
    the stillness that perceives the star‑arrangement. The Sāṃkhya framework, which separates puruṣa and prakṛti, finds resonance
    in this passage: just as the moon reflects the stars, the puruṣa reflects the patterns of prakṛti. Existentially, the
    sūtra invites the practitioner to recognize that the same faculty that discerns the stars is available within the self;
    by cultivating a calm, moon‑like awareness, one can perceive the hidden order of thoughts and emotions. Satchidananda’s
    brief comment that the system is obtained hints at the practical implication: when the mind settles like the moon, the
    entire cosmic arrangement becomes intelligible, and the practitioner gains mastery over the mind’s fluctuations.


    Key Terms


    **candra (चन्द्र)** — etymology: ‘moon’ -> tradition: luminous reflector of the sun’s rays -> what default translation
    misses: its role as a mirror of the mind’s luminous awareness


    **tārāvyūha (ताराव्यूह)** — etymology: ‘arrangement of stars’ -> tradition: cosmic order or the pattern of consciousness
    -> what default translation misses: the dynamic mapping of mental states


    **jñāna (ज्ञान)** — etymology: ‘knowledge’ -> tradition: both sensory perception and intuitive insight -> what default
    translation misses: its dual function as external observation and internal realization


    **samādhi (समाधि)** — etymology: ‘union’ -> tradition: state of meditative absorption where puruṣa and prakṛti appear
    unified -> what default translation misses: the experiential quality of stillness that mirrors the moon’s calm


    Cross-Tradition Resonances


    **Patanjali Yoga Sutra 3.27, 3.28:** Both sutras use celestial imagery to equate a natural object with a mental faculty,
    illustrating the structural homology of metaphorical identification.

    *Divergence:* While 3.27 identifies the moon as knowledge of star arrangement, 3.28 shifts to the sun as the source of
    that knowledge, breaking the moon‑sun symmetry to emphasize the hierarchy of illumination.


    **Sāṃkhya Karika 2.1:** The Karika speaks of the moon as a reflection of prakṛti’s patterns, mirroring the sūtra’s claim
    of the moon as knowledge.

    *Divergence:* The Karika treats the moon purely as a physical reflector, whereas the sūtra grants it epistemic authority,
    thereby extending the metaphor beyond mere observation.


    **Vijnana Bhairava Upanishad 3.4:** Both texts link celestial bodies with the mind’s capacity to perceive cosmic order.

    *Divergence:* The Upanishad presents the moon as a symbol of the self’s potential, while the Yoga Sutra explicitly ties
    it to the faculty of jñāna, making the link more functional.'
