sanskrit_devanagari: 'सौचात् स्वाङ्गजुगुप्सा परैर असंसर्गः ॥ २.४० ॥


  सत्त्वशुद्धिसुमानस्यैकाग्रेन्‍द्रियजयात्मदर्शनीयोग्यत्वानि च ॥ २.४१ ॥


  सन्तोषाद् अनुत्तमः सुखलाभः ॥ २.४२ ॥


  कायेन्‍द्रियसिद्धिर् अशुद्धिक्षये तपसः ॥ २.४३ ॥


  स्वाध्यायादिष्टदेवता संप्रयोगः ॥ २.४४ ॥


  समाधिसिद्धिर् इश्वरप्रणिधानात् ॥ २.४५ ॥'
sanskrit_iast: 'śaucāt svāṅgajugupsā parair asaṃsargaḥ || 2.40 ||


  sattvaśuddhisaumanasyaikāgryendriyajayātmadarśanayogyatvāni ca || 2.41 ||


  saṃtoṣād anuttamaḥ sukhalābhaḥ || 2.42 ||


  kāyendriyasiddhir aśuddhikṣaye tapasaḥ || 2.43 ||


  svādhyāyād iṣṭadevatāsaṃprayogaḥ || 2.44 ||


  samādhisiddhir īśvarapraṇidhānāt || 2.45 ||'
translation_literal: '**2.40** When purity (śauca) is attained, one feels disgust (jugupsa) toward one’s own body (sva‑aṅga)
  and toward others (parair), leading to cessation of contact (asaṃsargaḥ).

  **2.41** You purify the sattva, the mind becomes cheerful, you attain one-pointedness, master the senses, and become fit
  for self-realization.

  **2.42** From contentment one attains supreme joy.

  **2.43** By austerity, the mastery of body and senses destroys impurities.

  **2.44** Through study of sacred texts, one attains communion with the chosen deity.

  **2.45** By total surrender to God, samādhi is attained.'
commentary: 'Sūtras 2.40–2.45 trace a single arc: the Niyamas (observances) progressively purify prakṛti—body, mind, and will—until
  the practitioner stands ready for samādhi. The sequence is not arbitrary but causal. Śauca (purity) initiates the movement
  by exposing the body''s inherent impurity; this disgust (jugupsa) is not revulsion but lucid disidentification, the first
  crack in the illusion that puruṣa is bound to the body. Once that boundary clarifies, the remaining Niyamas work inward:
  santoṣa (contentment) severs the mind''s chase after external validation, freeing it to rest in its own nature; tapas (austerity)
  burns away the subtle residues of desire and aversion; svādhyāya (study) orients the intellect toward truth; and īśvara-praṇidhāna
  (surrender) dissolves the final knot of ego-will. Each observance operates on a different layer of prakṛti—gross body, emotional-mental,
  intellectual, volitional—yet all serve the same function: the progressive stilling of vṛtti (mental fluctuations) by removing
  their fuel. The genius of the sequence is that it does not demand heroic renunciation but rather reveals, through disciplined
  living, that what seemed desirable was never truly satisfying. Contentment does not require poverty; austerity does not
  require self-harm; purity does not require flight. Rather, each practice clarifies the distinction between puruṣa (the unchanging
  witness) and prakṛti (the ever-changing field), until the mind becomes transparent and samādhi—the absorption into one''s
  own nature—becomes inevitable. The Niyamas are thus not moral commandments imposed from without but invitations to see what
  is already true: that the Self is complete, untouched by the body''s decay, the mind''s turbulence, or the world''s indifference.


  Key Terms


  **śauca** — Purity; the first Niyama, operating on body and mind to expose their impermanence and prompt disidentification
  from prakṛti.

  **santoṣa** — Contentment; the second Niyama, severing the mind''s dependence on external circumstance and anchoring it
  in its own sufficiency.

  **tapas** — Austerity or disciplined heat; the third Niyama, burning away subtle impurities and strengthening the will toward
  liberation.

  **vṛtti-nirodha** — Cessation of mental fluctuations; the ultimate fruit of the Niyamas, enabling the mind to rest in puruṣa''s
  unchanging nature.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.55–2.56 (sthita-prajña, the steady-minded sage):** Both texts describe a progressive inner stabilization
  through disciplined practice, culminating in equanimity and direct knowledge of the Self. The Gītā''s sthita-prajña—unmoved
  by pleasure or pain—parallels the Yoga Sūtras'' practitioner who, through the Niyamas, achieves freedom from vṛtti and abides
  in puruṣa. Divergence: The Gītā emphasizes duty (dharma) and action in the world as the path; the Yoga Sūtras emphasize
  withdrawal and inner purification as the primary means. The Gītā''s sage acts; Patañjali''s sage observes.

  **Epictetus, Enchiridion 1.1–1.2 (what is in our power):** Both Epictetus and the Yoga Sūtras locate freedom not in external
  circumstance but in the discipline of will and perception. Contentment (santoṣa) and the Stoic focus on prohairesis (choice)
  both teach that happiness depends on what we control—our effort, attention, and acceptance—not on what we do not. Divergence:
  Epictetus grounds freedom in rational judgment and duty to the cosmic order; Patañjali grounds it in the metaphysical distinction
  between puruṣa and prakṛti. For Epictetus, virtue is the highest good; for Patañjali, kaivalya (isolation of puruṣa) is.

  **Dhammapada 203–204 (the path to Nirvana through discipline):** The Buddha''s emphasis on śīla (ethical conduct), samādhi
  (concentration), and prajñā (wisdom) as the threefold path mirrors the Yoga Sūtras'' Niyamas as preparatory disciplines
  that quiet the mind and reveal its true nature. Both traditions see moral purification as inseparable from meditative insight.
  Divergence: Buddhism denies a permanent Self (anattā) and teaches the cessation of all conditioned phenomena; Yoga affirms
  puruṣa as eternal and distinct from prakṛti. The Buddha''s goal is Nirvana (the unconditioned); Patañjali''s is kaivalya
  (the isolation and recognition of the Self as eternally free).'
insight: The claim is that tapas, understood as a disciplined burn, functions as a transformative purifying agent that erodes
  both physical and psychic impurities.
practice: Engage in a disciplined practice that systematically challenges and refines your body and senses—such as fasting,
  controlled breathing, or mindful silence—so that each act of austerity burns away a layer of impurity, leading to clearer
  awareness.
