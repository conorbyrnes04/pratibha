- kind: commentary
  label: Pratibha Commentary
  body: 'The claim that a single state of samādhi can annihilate all afflictions and karmic residue is
    a decisive moment in the Yoga canon, marking the transition from the gradual purification of the mind
    to the instant liberation of the soul. The contested move here is the identification of the *samādhi*
    that dissolves *klesha* and *karma* as a *kaivalya* (absolute isolation) rather than a mere meditative
    absorption. In the Sāṃkhya–Yoga framework, *klesha* denotes the root afflictions—avidya, asmita, raga,
    dvesha, abhinivesha—while *karma* refers to the causal residue of actions. The sūtra asserts that
    when the *purusha* is fully isolated from *prakṛti* in the highest samādhi, the causal chain of *karma*
    is severed, and the *klesha* that once animated the mind are rendered inert. This aligns with the
    Sāṃkhya doctrine of *kaivalya* as the state where *purusha* is free from the influence of *prakṛti*
    and its manifestations. The existential import is that liberation is not a gradual shedding but an
    instantaneous dissolution of all causal ties, allowing the practitioner to live as a *jīvanmukta*—a
    liberated being who continues to act without being affected by the outcomes of those actions. The
    commentary of Satchidananda echoes this by noting that the body and mind, though still functioning,
    no longer influence the *purusha*; they become mere instruments of a detached witness. This perspective
    invites practitioners to seek the highest samādhi not as an abstract ideal but as a concrete, experiential
    endpoint where the mind’s habitual patterns collapse, and the self reasserts its pure, unconditioned
    nature.


    Key Terms


    **klesha (क्लेश)** — root affliction → Sāṃkhya: ignorance, ego, desire, aversion, clinging → Yoga:
    mental afflictions that bind purusha to prakṛti; default translation as ‘affliction’ misses the specific
    Sāṃkhya taxonomy.


    **karma (कर्म)** — resulting action → Sāṃkhya: causal residue of actions → Yoga: the stored effects
    that continue to bind the soul; translation ‘action’ omits its causal, binding nature.


    **samādhi (समाधि)** — state of absorption → Sāṃkhya: union of purusha and prakṛti → Yoga: the highest
    meditative absorption where purusha is isolated; ‘concentration’ fails to capture its liberatory quality.


    **kaivalya (काविल्यम्)** — absolute isolation → Sāṃkhya: ultimate freedom of purusha from prakṛti;
    Yoga: state where all karmic residue is annihilated; ‘liberation’ alone does not convey the immediate
    cessation of karma.


    Cross-Tradition Resonances


    **Yoga Sūtra 4.30:** Structural homology: the sūtra’s terse formula mirrors earlier passages where
    a single word (e.g., *nirvāṇa* in 1.1) signals a complete cessation; here *nivṛttiḥ* functions similarly.

    *Divergence:* Unlike 1.1, which speaks of the cessation of *klesha* alone, 4.30 extends the cessation
    to *karma*, thereby broadening the scope from mental afflictions to causal residue.


    **Sāṃkhya Kārikā 1.1:** Both texts posit that *purusha*’s isolation from *prakṛti* yields liberation;
    the Yoga sūtra condenses this into a single samādhi state.

    *Divergence:* The Sāṃkhya text emphasizes gradual discrimination (*viveka*), whereas the Yoga sūtra
    presents an instantaneous dissolution, highlighting a methodological divergence.


    **Patanjali’s Mahābhāṣya 4.1.1:** Both commentaries discuss *klesha* as the root of bondage; the Mahābhāṣya
    elaborates on the threefold nature of *klesha* (avidya, asmita, etc.).

    *Divergence:* The Mahābhāṣya treats *klesha* as a persistent affliction requiring systematic purification,
    whereas 4.30 claims its annihilation in one samādhi.


    **Bāṇabhaṭṭa’s Vāgāyatī 1.1:** The idea that a single moment of insight can dissolve all karmic residue
    appears in the Vāgāyatī’s description of the *kaivalya* of the sage.

    *Divergence:* Bāṇabhaṭṭa’s account is more narrative and symbolic, whereas 4.30 is doctrinal and prescriptive,
    focusing on the technical cessation of *karma*.'
