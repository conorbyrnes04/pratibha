sanskrit_devanagari: ततः क्लेशकर्मणिवृत्तिः
sanskrit_iast: tataḥ kleśakarmanivṛttiḥ
translation_literal: From that, the cessation of afflictions and karmic action.
commentary: 'This sūtra (1.51) concludes Patañjali''s description of nirbīja samādhi—samādhi without seed,
  the highest absorption. The word tataḥ (from that) refers to the attainment of seedless samādhi just
  described. Kleśa (affliction) denotes the five fundamental obstructions: ignorance (avidyā), egoism
  (asmitā), attachment (rāga), aversion (dveṣa), and fear of death (abhiniveśa). These are not merely
  psychological states but ontological misalignments—they distort perception and bind consciousness to
  the cycle of becoming.


  Karma here means both the latent impressions (vāsanā) that drive future action and the momentum of action
  itself. When samādhi deepens to its seedless form, the root ignorance that generates kleśa is directly
  perceived and dissolved. This is not suppression but recognition—the afflictions lose their generative
  power because their false premise (that the self is limited, separate, mortal) is seen through.


  The cessation (nivṛtti) is not temporary suspension but permanent discontinuation. The practitioner
  does not merely transcend kleśa in meditation; the very substrate from which they arise is transformed.
  This marks the threshold between yoga as practice and yoga as liberation (kaivalya). The sūtra is austere
  and definitive: this is what nirbīja samādhi accomplishes.


  Key Terms


  **kleśa** — The five fundamental afflictions (avidyā, asmitā, rāga, dveṣa, abhiniveśa) that obscure
  the self and bind consciousness to suffering and rebirth.

  **karma** — The accumulated impressions (vāsanā) and momentum of action that perpetuate the cycle of
  becoming; dissolved when the root ignorance is transcended.

  **nirbīja samādhi** — Samādhi without seed; the highest absorption in which even the subtle impression
  of the meditator dissolves, revealing pure consciousness and ending the cycle of rebirth.'
insight: The claim that a single state of samādhi can annihilate all afflictions and karmic residue is
  a decisive moment in the Yoga canon, marking the transition from the gradual purification of the mind
  to t
practice: 'The moment a fear, attachment, or aversion arises in your body—a tightness, a pull, a recoil—pause
  and ask: "What false separation am I believing right now?" Hold that question without answering, letting
  the affliction''s premise show itself as a lie, until its grip loosens on its own.'
