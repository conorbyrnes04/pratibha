sanskrit_devanagari: तदाभावात् संयोगाभावः हानं तददृशेः काविल्यम्
sanskrit_iast: tadabhāvāt saṃyogābhāvo hānaṃ taddṛśeḥ kaivalyam
translation_literal: 'When that ceases to be, the joining ceases to be—this is the dissolution. For one
  who sees thus: isolation.'
commentary: 'This sūtra (YS 2.25) stands at a threshold in Patañjali''s teaching. It names the mechanism
  of liberation itself. The ''that'' (tad) refers to avidyā, ignorance—the root misperception that the
  witnessing consciousness (puruṣa) is bound to or identical with the changing field of nature (prakṛti).
  So long as ignorance persists, the saṃyoga—the false joining, the imagined entanglement—persists. The
  moment ignorance dissolves through direct seeing (dṛśi), the joining dissolves. This is not mystical:
  it is the simple reversal of a cognitive error. The puruṣa was never actually joined to prakṛti; it
  only seemed so through the lens of avidyā. When that lens shatters, the illusion of bondage ends. Kaivalyam—aloneness,
  isolation, the state of the self standing in its own nature—is not something gained but something revealed.
  It is the natural condition when the false superimposition is removed. This verse crystallizes the entire
  yogic project: not to acquire something new, but to see clearly what always was. The dissolution (hāna)
  is not annihilation but the undoing of a mistaken identity.


  Key Terms


  **avidyā** — Ignorance or misperception; the root confusion that the eternal witness (puruṣa) is bound
  to or identical with the changing field of nature (prakṛti)

  **saṃyoga** — The false joining or entanglement; the imagined union between consciousness and matter
  that perpetuates the sense of bondage

  **kaivalyam** — Aloneness, isolation, or liberation; the natural state of the self when it stands free
  from the illusion of entanglement with prakṛti'
insight: The passage asserts that liberation (Kaivalya) is the state that appears when the junction between
  the Seer and the world dissolves.
practice: 'The moment you notice yourself claiming ownership of a thought, sensation, or emotion—''this
  is my anxiety,'' ''my memory,'' ''my desire''—pause and whisper: ''the joining ceases.'' Feel the claiming-sense
  release, as if a lens you didn''t know you were looking through suddenly lifts. Repeat this reversal
  each time you catch the false joining reasserting itself throughout your day.'
