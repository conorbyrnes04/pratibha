unit_label: Break of the Junction
title: Break of the Junction
unit_type: sutra
sanskrit_devanagari: तदाभावात् संयोगाभावः हानं तददृशेः काविल्यम्
sanskrit_iast: tadabhāvāt saṃyogābhāvo hānaṃ taddṛśeḥ kaivalyam
translation_literal: The breaking of the junction, through the destruction of ignorance, is that which is seen as Kaivalya.
commentary: 'The passage asserts that liberation (Kaivalya) is the state that appears when the junction between the Seer and
  the world dissolves. The junction (saṃyogābhāva) is not a physical contact but a misidentification that binds the Seer to
  the world. When ignorance (avidyā) is dispelled by right knowledge, the Seer recognises that the world is not his own, and
  the false sense of bondage disappears. The claim is that the very phenomenon that is perceived as liberation is itself the
  dissolution of the false identification. In the Sāṃkhya–Yoga framework, the Seer (puruṣa) is eternally distinct from prakṛti,
  yet the mind’s vṛtti (mental fluctuations) create a false union. The key philosophical move is that Kaivalya is not a new
  ontological status but the negation of the misidentification that produces the junction. This aligns with the Sāṃkhya doctrine
  of the two principles: puruṣa (consciousness) and prakṛti (matter). The Dvivedi commentary emphasizes that the Seer’s belief
  in bondage is the root of suffering; its dissolution is the realization of the Seer’s true nature. The passage thus offers
  an existential prescription: by cultivating right knowledge that sees the world as devoid of self‑ownership, one experiences
  the liberation that is the very absence of the false junction. This is the practical path: to observe the mind’s vṛtti and
  recognize the Seer’s independence, thereby achieving Kaivalya.


  Key Terms


  **saṃyogābhāva (संयोगाभावः)** — ‘union‑state’ – the false identification of puruṣa with prakṛti; default translation ‘junction’
  misses the epistemic nature of the misidentification.


  **avidyā (अविद्या)** — ‘ignorance’ – the epistemic blindness that sustains the saṃyogābhāva; tradition sees it as the root
  of all vṛtti.


  **kaivalyam (काविल्यम्)** — ‘liberation’ – the state of absolute isolation of puruṣa; default ‘freedom’ omits its ontological
  negation of the false union.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.23:** Both 2.23 and 2.25 describe the dissolution of the saṃyogābhāva as the route to Kaivalya; the structure
  is identical: ‘break of X through Y is Z’.

  *Divergence:* In 2.23 the focus is on the breaking of the mind’s vṛtti, whereas 2.25 emphasizes the breaking of the junction
  itself; the latter is more ontological.


  **Sāṃkhya Kārikā 1.4:** Sāṃkhya’s statement that puruṣa is never bound mirrors the claim that Kaivalya is the state of no
  junction.

  *Divergence:* Sāṃkhya presents this as a metaphysical fact, while the Yoga Sūtra frames it as an experiential result of
  knowledge.'
insight: The passage asserts that liberation (Kaivalya) is the state that appears when the junction between the Seer and the
  world dissolves.
practice: Observe your thoughts; when you notice the mind’s tendency to identify the self with the world, consciously detach
  that identification, recognizing that you are the Seer, not the object.
