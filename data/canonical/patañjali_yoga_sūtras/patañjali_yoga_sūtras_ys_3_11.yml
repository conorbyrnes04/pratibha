sanskrit_devanagari: सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समादिपरिनामः
sanskrit_iast: sarvārthataikāgratayoḥ kṣayodayau cittasya samādhipariṇāmaḥ
translation_literal: When the mind's capacity for grasping multiple objects decays and its capacity for single-pointed focus
  arises, this transformation of the mind is called samādhi-transformation.
commentary: 'This sūtra defines the phenomenological marker of samādhi—the highest concentration state in classical yoga—as
  a specific reordering of mental capacity. Patañjali describes it not as a mystical attainment but as a measurable shift:
  the dissolution (kṣaya) of the mind''s natural tendency to scatter across many objects (sarvārtha-tā, multiplicity-orientation)
  and the simultaneous emergence (udaya) of one-pointed focus (taikāgratā, singular-pointedness).


  Within the Yoga–Sāṃkhya framework, this is not suppression but transformation (pariṇāma). The mind does not become blank;
  rather, its inherent capacity redirects. Just as a prism redirects light, the cittasya (of the mind-stuff) undergoes a structural
  reorientation. The dual process—decay of one mode, arising of another—is simultaneous and reciprocal, not sequential.


  This verse clarifies that samādhi is not an exotic state but the natural outcome when the mind''s habitual diffusion ceases.
  It is the mind functioning at its highest efficiency: all its power concentrated rather than fragmented. The word samādhipariṇāmaḥ
  (samādhi-transformation) indicates this is the mind''s own evolution, not an imposed condition. This prepares the ground
  for the subsequent sūtras that describe the stages and fruits of this concentrated state.


  Key Terms


  **sarvārthatā** — The mind''s natural orientation toward grasping multiple objects simultaneously; mental diffusion or scatter.

  **taikāgratā** — One-pointed focus; the mind''s capacity to hold a single object or intention without wavering.

  **pariṇāma** — Transformation or modification; in Yoga–Sāṃkhya, the natural unfolding or reordering of a substance''s inherent
  capacities.'
insight: The passage asserts that the mind’s concentration is not a static state but a dynamic process of setting (kṣaya)
  and rising (udāya).
practice: 'For 5–10 minutes daily, choose a single visual object: a candle flame, a dot on paper, or the tip of your nose.
  Sit upright with steady posture. Place your attention on this object and notice—without judgment—each time your mind wanders
  to multiple thoughts, plans, or sensations (sarvārtha-tā). When you notice this scattering, gently return attention to the
  single point. Do not force. The practice is simply the repeated noticing of multiplicity and the gentle return to unity.
  Over weeks, you will observe the natural decay of the mind''s pull toward many objects and the gradual steadiness of focus.
  This is cittasya samādhipariṇāmaḥ in action—the mind reorganizing itself through its own attention.'
