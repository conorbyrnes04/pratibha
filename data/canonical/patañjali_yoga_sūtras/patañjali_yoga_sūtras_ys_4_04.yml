sanskrit_devanagari: निर्माणचित्तां अस्मिता मात्रात्
sanskrit_iast: nirmāṇacittāny asmitāmātrāt
translation_literal: From asmitā alone—the sense of 'I-am'—arise minds fashioned for particular forms.
commentary: 'This sūtra appears in the context of Patañjali''s analysis of how consciousness becomes bound to individual embodiment.
  The term nirmāṇacittāni (fashioned minds, or minds constructed for specific purposes) refers to the subtle mental instruments
  that become attached to particular bodies and identities across time. Asmitā—the primordial ego-sense, the felt conviction
  of separate selfhood—is identified as the sole generative source of this fragmentation.


  In Sāṃkhya metaphysics, asmitā is the second kleśa (affliction), arising when puruṣa (pure consciousness) mistakes itself
  for prakriti (matter/mind). It is the root contraction from which all subsequent identification flows. This sūtra teaches
  that the entire architecture of individual embodied existence—the construction of a ''me'' with a specific body, history,
  and destiny—emerges from this single misidentification.


  The word mātrāt (from, or solely from) is emphatic: nothing else generates this multiplicity of bound minds. Not karma alone,
  not desire alone, but asmitā—the ego-knot itself—is the sole architect. This is why liberation requires not merely ethical
  purification or knowledge, but the direct dissolution of the sense of separate selfhood through viveka (discrimination)
  and vairāgya (non-attachment).


  For a practitioner, this sūtra reveals why self-inquiry and witness-consciousness practices are central: they create a gap
  between the observing awareness and the ''I-am'' feeling, gradually loosening asmitā''s grip. The fashioned mind can only
  persist as long as the ego believes itself to be real and separate.


  Key Terms


  **asmitā** — The ego-sense; the primordial misidentification of pure consciousness (puruṣa) with mind and body; the root
  kleśa from which all other afflictions arise.

  **nirmāṇacittāni** — Minds fashioned or constructed for particular forms; the subtle mental instruments that become bound
  to individual embodied existence.

  **puruṣa** — Pure, unchanging consciousness; the witness; in bondage, mistakenly identified with prakriti (matter/mind).'
insight: 'The passage asserts a foundational claim of the Yoga school: that the mind’s activity is not an autonomous phenomenon
  but a construction of the ego‑sense, or ‘I‑ness’.'
practice: Whisper 'I am' on your next exhale, and listen to the sound as though it were arising from nowhere—not from you,
  but simply appearing in awareness. Repeat this three times, each whisper lighter, until you cannot tell whether the words
  are being spoken or simply heard. Notice what remains when the sound dissolves.
