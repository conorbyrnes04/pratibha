- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts a foundational claim of the Yoga school: that the mind’s activity is not an autonomous phenomenon
    but a construction of the ego‑sense, or ‘I‑ness’. This is a contested move because it places the locus of creation squarely
    on the subject rather than on the universal principle of consciousness (purūṣa) or the material substratum (prakṛti).
    In the Sāṃkhya framework, the mind is a function of prakṛti, yet here the Yoga text elevates the ego‑sense as the sole
    engine of mental construction, thereby redefining the relationship between purūṣa and prakṛti. The implication for practice
    is existential: by recognizing that thoughts arise from the ego‑sense alone, a practitioner can begin to detach from the
    habitual identification with those thoughts, moving toward the state of kaivalya where purūṣa is no longer bound by prakṛti’s
    vṛtti. The Satchidananda aphorism underscores this by framing the ego‑sense as the ‘cause of other artificially created
    minds’, suggesting that the mind’s multiplicity is an illusion generated by the singular sense of self. Thus, the sutra
    invites a direct, experiential investigation of the ego‑sense as the source of all mental activity, a key step toward
    the dissolution of vṛtti and the realization of pure awareness.


    Key Terms


    **nirmāṇa (निर्माण)** — ‘creation’ -> in Yoga: the process by which the ego‑sense constructs mental objects; contrasts
    with purūṣa’s passive awareness


    **citta (चित्त)** — ‘mind’ -> in this sutra, the mind is not autonomous but a product of the ego‑sense; highlights the
    dependent nature of mental activity


    **asmitā (अस्मिता)** — ‘ego‑sense’ -> the fundamental identification of ‘I’ that, according to Yoga, alone generates the
    manifold mind; differs from Sāṃkhya’s notion of purūṣa as pure consciousness


    **mātrāt (मात्रात्)** — ‘only’ -> emphasizes exclusivity, asserting that no other factor besides the ego‑sense contributes
    to mind creation; underscores the Yoga stance of sole responsibility of the self


    Cross-Tradition Resonances


    **Yoga Sūtra 4.3, 4.4:** Both sutras use the same formula nirmāṇacittāny asmitā, but 4.4 adds mātrāt to stress exclusivity;
    structural homology in the tripartite construction of the clause

    *Divergence:* 4.3 presents a general statement, while 4.4 specifies that the ego‑sense alone is responsible, sharpening
    the causal claim


    **Samkhya Karika 2.1:** Karika attributes vṛtti to the interaction of purūṣa and prakṛti, using a similar tripartite structure
    (purūṣa‑prakṛti‑vṛtti)

    *Divergence:* Yoga reverses the causal order, placing the ego‑sense (a purūṣa attribute) as the sole generator, thereby
    rejecting the dual causality of Sāṃkhya


    **Yoga Sūtra 2.28:** Both sutras discuss the role of the mind in the process of liberation; 2.28 speaks of the mind’s
    dissolution in samādhi

    *Divergence:* While 2.28 focuses on the cessation of vṛtti, 4.4 focuses on the origination of vṛtti, offering a complementary
    perspective on the mind’s dual role'
