- kind: translation
  label: Pratibha Translation
  body: The sight is composed of the elements and the organs; it is of the nature of illumination, action, and position; it
    is useful for experience and for the attainment of ultimate liberation.
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that sight is a composite of prakṛti’s constituents—both the five gross elements (bhūta) and
    the eleven organs (āṅgā) including the mind (buddhi) and the sense‑organ (āliṅkara). It claims that this composite is
    of three natures: illumination (prakāśa), action (kriyā), and mere position (sthiti). The claim is that these three qualities
    are the fundamental modes through which prakṛti manifests, and that sight, as a manifestation, inherits all three. This
    is a contested move in the Yoga tradition because it elevates the sensory apparatus to a status that is simultaneously
    part of prakṛti and yet a means for puruṣa to attain liberation. In the Sāṃkhya‑Yoga synthesis, the organs are seen as
    instruments of prakṛti, but the ultimate goal is to transcend all such instruments. The doctrine here is that the very
    act of seeing is a dynamic process (action) that illuminates the mind, yet it remains a static position (sthiti) in the
    sense that it is a fixed mode of perception. The practical implication is that one must cultivate awareness of the threefold
    nature of sensory experience: recognizing that what is seen is not merely a passive image but an active, illuminating
    process that can either bind or liberate. The Dvivedi commentary reinforces this by linking the three gunas—sattva (illumination),
    rajas (action), tamas (position)—to the sensory experience, thereby providing a metaphysical grounding for the claim.
    Thus, the passage invites the practitioner to observe that the very act of seeing is a tool of evolution, and that by
    mastering this tool—by seeing with clarity, intention, and detachment—one can use it as a means to transcend prakṛti and
    realize puruṣa.


    Key Terms


    **prakāśa (प्रकाश)** — ‘illumination’ – from prakāśa ‘light’; in Sāṃkhya it denotes the sattvic quality of clarity, but
    here it is applied to the sensory organ itself, suggesting that the organ itself is a source of illumination rather than
    merely a receiver of it.


    **kriyā (क्रिया)** — ‘action’ – from kriyā ‘to act’; traditionally denotes the dynamic aspect of prakṛti, but the sūtra
    attributes this dynamic to the organ, implying that the organ is an active agent.


    **sthiti (स्थिति)** — ‘position’ – from sthiti ‘standing’; usually refers to the static state of prakṛti, yet here it
    is used to describe the organ’s inherent, unchanging aspect.


    **buddhi (बुद्धि)** — ‘intellect’ – from buddhi ‘to know’; in Sāṃkhya it is a subtle organ of perception, but the sūtra
    treats it as part of the sensory apparatus, blurring the line between instrument and content.


    Cross-Tradition Resonances


    **Yoga Sūtra 2.18:** The structure ‘X is of the nature of Y, Z, and W’ mirrors the triadic formulation in 1.2 ‘prakṛti
    is of the nature of sattva, rajas, tamas’

    *Divergence:* While 1.2 attributes the triad to prakṛti itself, 2.18 attributes it to the organ of sight, thereby shifting
    the locus of the triad from the universal principle to a specific instrument.


    **Bhaṭṭa, Yogaśāstra, 2.18:** Bhaṭṭa expands the triad to include ‘sight’ as a composite of elements and organs, echoing
    the sūtra’s claim

    *Divergence:* Bhaṭṭa’s elaboration introduces the notion of ‘usefulness for experience’, which the original sūtra omits,
    thereby adding an epistemic dimension.


    **Dvivedi, Commentary on Yoga Sūtra 2.18:** Dvivedi explicitly links the triad to the gunas, reinforcing the sūtra’s claim

    *Divergence:* Dvivedi’s commentary interprets the triad as a metaphysical description of prakṛti’s evolution, whereas
    the sūtra presents it as a descriptive taxonomy of the organ itself.'
