sanskrit_devanagari: प्रकाशक्रियास्थितिशीलं भूतेंद्रियात्मकम् भोगापवर्गार्थं दर्श्यम्
sanskrit_iast: prakāśakriyāsthitiśīlaṃ bhūtendriyātmakaṃ bhogāpavargārthaṃ dṛśyam
translation_literal: What is seen—the visible world—is constituted of light, action, and stability as
  its nature; it is composed of elements and sense-organs; and it exists for the purpose of experience
  and liberation.
commentary: 'This sūtra defines *dṛśya* (the seen, the visible realm) as the fundamental object of perception
  in Yoga–Sāṃkhya metaphysics. It is not random or chaotic, but structured by three interlocking qualities
  or functions:


  **Prakāśa (light/illumination):** The capacity to be known, to reveal itself. Without luminosity—whether
  literal or metaphorical—nothing appears to consciousness.


  **Kriyā (action/dynamism):** The principle of transformation, change, and causation. The visible world
  is not static; it moves, evolves, and produces effects.


  **Sthiti (stability/support):** The binding principle that holds form together, gives structure, and
  allows persistence. Without it, everything would dissolve into flux.


  These three are the *guṇas* (qualities) of *prakṛti* (nature/matter) in their functional aspect. The
  verse then clarifies that this visible realm is *bhūtendriyātmaka*—made of the five elements (earth,
  water, fire, air, space) and the ten sense-organs (five of perception, five of action). Finally, it
  states the *purpose* of the visible world: *bhogāpavargārtham*—for experience (*bhoga*) and for liberation
  (*apavarga*). This dual purpose is crucial: the world serves both to bind consciousness through attachment
  to experience, and simultaneously to liberate it through discrimination and renunciation.


  This sūtra establishes that what we perceive is not illusion but a real, structured manifestation designed
  to serve the soul''s journey toward freedom.


  Key Terms


  **dṛśya** — The seen; the visible world; the entire manifest realm of objects and experience, as opposed
  to the seer (draṣṭṛ)

  **prakāśa, kriyā, sthiti** — Light/illumination, action/dynamism, and stability/support—the three functional
  aspects of prakṛti (nature) that structure all visible phenomena

  **bhogāpavarga** — Experience and liberation; the dual purpose of the visible world—to provide experience
  (which can bind) and the ground for discrimination (which liberates)'
insight: The passage asserts that sight is a composite of prakṛti’s constituents—both the five gross elements
  (bhūta) and the eleven organs (āṅgā) including the mind (buddhi) and the sense‑organ (āliṅkara).
practice: '**Perception with Purpose (Dṛśya Viveka):** Today, choose one ordinary object—a cup, a leaf,
  a hand. For 5–10 minutes, observe it while mentally noting three aspects:


  1. **Prakāśa:** What makes it visible? Notice the light reflecting from it, the contrast that allows
  your eye to distinguish it. Feel how illumination is prerequisite to knowing.


  2. **Kriyā:** What is it *doing*? Even at rest, notice subtle changes—shadows shifting, your breath
  affecting how you perceive it, time passing. Sense the dynamism inherent in manifestation.


  3. **Sthiti:** What holds it together? Notice its form, boundaries, coherence. Without stability, it
  would scatter into atoms.


  Then ask: *Am I experiencing this to bind myself (through desire or aversion), or to learn something
  that frees me?* This simple inquiry begins to separate the *puruṣa* (witness) from *prakṛti* (the seen),
  which is the foundation of yoga.'
