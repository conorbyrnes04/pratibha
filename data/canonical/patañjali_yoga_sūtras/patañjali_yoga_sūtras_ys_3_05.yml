sanskrit_devanagari: तज्जयात् प्रज्ञालोकः
sanskrit_iast: tajjayāt prajñālokaḥ
translation_literal: From mastery of that, a light of knowing arises.
commentary: 'This sūtra (likely YS 2.28, though the title suggests a standalone aphorism) distills a core promise of yoga:
  that disciplined conquest of a particular obstacle or mental pattern yields direct, luminous knowing. The ''that'' (taj)
  refers to the preceding practice—typically the eight limbs (aṣṭāṅga), or more specifically the restraints and observances
  (yama and niyama), or pranayama and sense-withdrawal (prāṇāyāma and pratyāhāra). The word ''mastery'' (jayāt, from jaya:
  victory, conquest) signals not mere intellectual understanding but embodied, hard-won dominion over habitual reactivity.


  Prajñā—often translated as ''wisdom'' or ''insight''—here means direct, non-conceptual knowing that illuminates reality
  as it is, stripped of mental overlay. Alokaḥ (light) is not metaphorical: in the Yoga–Sāṃkhya framework, consciousness (puruṣa)
  is inherently luminous (prakāśa); when the mind''s turbulence (vṛtti) settles through practice, that inherent radiance becomes
  apparent. Knowledge is not acquired from outside but unveiled within.


  The verse teaches a non-linear truth: mastery over one area (breath, sense-craving, anger, distraction) does not merely
  improve that area—it opens a qualitative shift in perception itself. This is why Patañjali emphasizes practice (abhyāsa)
  and dispassion (vairāgya) as twin engines: effort removes obstacles; surrender allows the light to shine through.


  Key Terms


  **taj-jayāt** — From mastery or conquest of that (the preceding practice or obstacle)

  **prajñā** — Direct, non-conceptual knowing; insight that illuminates reality beyond mental constructs

  **alokaḥ** — Light; the inherent luminosity of consciousness revealed when mental turbulence subsides'
insight: The sūtra asserts that the perfected mind (citta) overcomes the subtle illumination of prajñā, thereby attaining
  samādhi.
practice: The instant you notice a habitual reaction arising—tension, distraction, defensiveness—stop and hold your gaze steady
  on whatever is in front of you (a face, a wall, a tree) for three full breaths, allowing the mind's chatter to settle like
  dust. In that cleared space, notice what knowing arrives without you reaching for it.
