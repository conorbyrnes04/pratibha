sanskrit_devanagari: जातिदेशकालसमयानवच्छिन्नाः सर्वभूमा महाव्रतम्
sanskrit_iast: jātideśakālasamayānavacchinnāḥ sārvabhaumā mahāvratam
translation_literal: The great vow, unrestricted by birth, place, time, or circumstance, is universal
  in scope.
commentary: 'This sūtra (II.31) defines mahāvrata—the great vow or ethical discipline—as fundamentally
  different from ordinary moral rules because it transcends all conventional boundaries. The phrase jāti-deśa-kāla-samaya-anavacchinnāḥ
  breaks down the usual conditions that limit ethical practice: jāti (caste, social class, or birth status),
  deśa (geographical location or cultural context), kāla (historical period or season), and samaya (circumstance,
  convention, or social agreement). By declaring these restrictions *absent* (anavacchinnāḥ), Patañjali
  establishes that authentic ethical conduct—rooted in the yamas (restraints) like non-harming, truthfulness,
  and non-stealing—does not depend on who you are, where you live, when you practice, or what your situation
  demands. This is sārvabhaumā: applicable everywhere, to everyone, always. The mahāvrata is thus a universal
  principle, not a culturally negotiated code. Within the Yoga–Sāṃkhya framework, this reflects the recognition
  that puruṣa (consciousness) is identical across all beings and conditions; ethical discipline aligned
  with that truth cannot be partial or conditional. The vow becomes ''great'' precisely because it is
  unconditional—a direct expression of non-dual awareness.


  Key Terms


  **mahāvrata** — The great vow or universal ethical discipline; the highest form of moral conduct, unrestricted
  by external conditions.

  **anavacchinnāḥ** — Unrestricted, unconditioned, not cut off or limited by boundaries.

  **sārvabhaumā** — Universal, all-pervasive, applicable everywhere and to all beings without exception.'
insight: The Sūtra asserts that only those vows which are free from any limiting conditions—no reference
  to caste, locality, era, or instrumental value—constitute the true great vows.
practice: 'Choose one core ethical principle—for example, non-harming (ahiṃsā) or truthfulness (satya).
  For one full day, apply it *without exception* across all contexts: in your professional dealings, private
  conversations, thoughts about others, and even in small daily choices (what you eat, how you speak to
  service workers, your internal commentary). Notice where you instinctively want to make exceptions based
  on circumstance (''it''s just business,'' ''they won''t know,'' ''this situation is different''). Each
  time you catch that impulse, pause and ask: *Is this principle true only sometimes, or always?* Return
  to the unconditional application. Record what you discover about the difference between conditional
  ethics and universal vow.'
