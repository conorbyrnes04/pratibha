sanskrit_devanagari: 'वयाधिस्यन्तानसंशयप्रमादालस्याविरतिभ्रान्तिदर्शनालभद्भूमिकत्वनवास्थितत्वानि चित्तविक्षेपास् ते अन्तरायाः
  ॥ १.३० ॥


  दुःखदौर्मणस्याङगेजयत्वश्वासप्रश्वासाविक्षेपसहभुवः ॥ १.३१ ॥


  ततप्रतिषेधार्थम् एकतत्त्वाभ्यासः ॥ १.३२ ॥'
sanskrit_iast: 'vyādhistyānasaṃśayapramādālasyāviratibhrāntidarśanālabdhabhūmikatvānavasthitatvāni cittavikṣepās te ''ntarāyāḥ
  || 1.30 ||


  duḥkhadaurmanasyāṅgamejayatvaśvāsapraśvāsā vikṣepasahabhuvaḥ || 1.31 ||


  tatpratiṣedhārtham ekatattvābhyāsaḥ || 1.32 ||'
translation_literal: '**1.30** Disease, dullness, doubt, heedlessness, sloth, sensual indulgence, false vision, failure to
  gain ground, instability—these distractions (cittavikṣepās) of the mind are obstacles (antarāyāḥ).

  **1.31** Suffering, despair, trembling of the limbs, irregular breathing—these accompany distraction (vikṣepasahabhuvaḥ).

  **1.32** To counteract these: practice of a single principle (ekatattvābhyāsaḥ).'
commentary: 'These three sūtras form a single diagnostic and therapeutic argument: the obstacles to samādhi are not merely
  external hindrances but internal fragmentations of citta (mind-stuff) that manifest simultaneously in cognition, emotion,
  and breath; their remedy is not elimination but redirection—a continuous, one-pointed conscious practice that holds the
  mind to a single object until the vṛtti (mental modifications) cease their scattering. The architecture is clinical: 1.30
  names the obstacles (disease through instability), 1.31 reveals their somatic signature (pain, despair, irregular breath
  as diagnostic markers), and 1.32 prescribes the unified response (ekāgratā, single-pointed focus, practiced without interruption).
  What makes this cluster philosophically coherent is its implicit claim about the nature of distraction itself. In the Yoga-Sāṃkhya
  framework, prakṛti (matter/nature) is inherently dynamic and multivalent; the guṇas (qualities) naturally pull consciousness
  toward fragmentation. Distraction is not an aberration but prakṛti''s default mode. The obstacles listed in 1.30—doubt,
  sloth, worldly-mindedness, instability—are not foreign invaders but the citta''s own tendency to identify with its modifications
  rather than rest in the witness-consciousness of puruṣa. Sūtra 1.31''s insistence that these obstacles have bodily correlates
  (pain, nervous agitation, breath irregularity) dissolves the false distinction between ''mental'' and ''physical'' obstacles;
  both are expressions of the same underlying fragmentation of prakṛti. The breath becomes the crucial hinge: it is prakṛti''s
  most direct window into the mind''s state, neither purely physical nor purely mental. Sūtra 1.32 then offers the sole antidote:
  abhyāsa (continuous practice) of ekāgratā (one-pointed focus) through conscious meditation. This is not suppression of the
  vṛtti but their channeling into a single groove. By maintaining unbroken attention on one object, the practitioner starves
  the obstacles of the mental energy they require to propagate. The practice is ''conscious'' (samprajñāta) because it requires
  deliberate, wakeful effort—not trance or dissociation. Over time, this continuous re-anchoring of attention weakens the
  mind''s habitual scattering and allows puruṣa to recognize itself as distinct from prakṛti''s play. The cluster thus teaches
  that samādhi is not achieved by fighting obstacles but by systematizing attention so thoroughly that the mind has no remaining
  capacity for distraction.


  Key Terms


  **vṛtti** — mental modification or fluctuation; the mind''s tendency to take on the form of its objects

  **ekāgratā** — one-pointed focus; the concentration of attention on a single object without wavering

  **abhyāsa** — continuous, disciplined practice; the repeated re-anchoring of attention to counteract the mind''s natural
  dispersion

  **samprajñāta-samādhi** — conscious meditation; samādhi accompanied by deliberate, wakeful attention to the object of meditation


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.26:** Both texts treat the wandering mind as the central problem and prescribe continuous, disciplined
  return to a single focus (yoga-yukta) as the remedy. Kṛṣṇa tells Arjuna: ''From wherever the mind wanders due to its restless
  nature, from there one should bring it back and fix it on the Self.'' Divergence: The Gītā frames the single focus as devotion
  to Kṛṣṇa or the Self (Brahman), whereas Patañjali''s sūtras remain phenomenologically neutral about the object, emphasizing
  the mechanism of one-pointed attention itself as the liberative force.

  **Epictetus, Enchiridion 1.1:** Both texts distinguish between what is within our control (prohairesis/abhyāsa, our effort
  and attention) and what is not (external circumstances, bodily sensations). Both prescribe disciplined redirection of attention
  as the path to freedom. Divergence: Epictetus aims at ataraxia (freedom from disturbance) through acceptance of fate; Patañjali
  aims at kaivalya (isolation of puruṣa) through the cessation of mental modifications—a metaphysical rather than merely ethical
  goal.

  **Plotinus, Enneads III.8.4:** Plotinus describes the soul''s fragmentation into multiplicity and its return to unity through
  continuous contemplation of the One. The remedy—sustained, one-pointed attention—parallels Patañjali''s ekāgratā as the
  antidote to the mind''s natural scattering. Divergence: Plotinus locates the source of distraction in the soul''s descent
  into matter; Patañjali treats distraction as prakṛti''s intrinsic nature, requiring not ascent but clear discrimination
  (viveka) between puruṣa and prakṛti.'
insight: The passage asserts that the very sensations of pain, despair, nervousness, and the irregularities of breathing—both
  inhalation and exhalation—serve as external markers of a mind that has slipped from
practice: Identify the most frequent distraction in your meditation—be it disease, doubt, or worldly-mindedness—and consciously
  replace it with focused breath, maintaining awareness of the present moment.
