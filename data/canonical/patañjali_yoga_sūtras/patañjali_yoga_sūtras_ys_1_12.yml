sanskrit_devanagari: अभ्यासवैराग्याभ्यम् तन्निरोधः
sanskrit_iast: abhyāsavairāgyābhyāṃ tannirodhaḥ
translation_literal: Through practice and detachment, that [mental disturbance] is stilled.
commentary: 'This is Patañjali''s foundational prescription for yoga itself (YS 1.12). The ''that'' (tan-)
  refers to the fluctuations of mind (citta-vṛtti) named in the preceding sūtra. The verse establishes
  the two-fold engine of yogic transformation: abhyāsa (repeated, disciplined application) and vairāgya
  (non-clinging, or the progressive release of attachment to objects and outcomes).


  Abhyāsa is not mere repetition; it is sustained, conscious engagement with a chosen focus—breath, mantra,
  posture, or witness-awareness—practiced over a long period with unwavering commitment. Vairāgya is the
  simultaneous loosening of the grip of desire, aversion, and identification with results. These two work
  together: practice without detachment becomes rigid striving; detachment without practice becomes passive
  escapism.


  In the Yoga–Sāṃkhya framework, the mind (citta) is a subtle material instrument (prakṛti) that naturally
  oscillates between attraction and repulsion, memory and anticipation. Nirodha (cessation, stilling)
  does not mean annihilation but rather the settling of these waves into their source—a state of transparent,
  undisturbed witnessing (sākṣī-bhāva). This verse is the bridge between diagnosis (the mind is restless)
  and method (here is how to heal it).


  Key Terms


  **abhyāsa** — sustained, disciplined practice or application; repetition with full awareness and commitment
  over time

  **vairāgya** — non-attachment, dispassion, or the progressive release of clinging to objects, outcomes,
  and identification

  **nirodha** — cessation, stilling, or the settling of mental fluctuations into a state of transparent,
  undisturbed awareness'
