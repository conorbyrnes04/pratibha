  - term: nirodha (निरोध)
    definition: 'ni + √rudh ‘obstruct, restrain’ → cessation/stilling -> in “Suppression Secured by Practice
      and Detachment”: cessation, stilling, or the settling of mental fluctuations into a state of transparent,
      undisturbed awareness -> not annihilation of mind; settling of flux so awareness is no longer hijacked'
  - term: vairāgya (वैराग्य)
    definition: 'vi-rāga ‘dispassion / fading of coloring’ -> in “Suppression Secured by Practice and
      Detachment”: default ‘detachment’ misses its active, transformative quality -> not cold indifference;
      mastery of thirst so objects lose compulsive pull'
  - term: abhyāsa (अभ्यास)
    definition: 'abhi-√ās ‘sit toward’ → sustained practice -> in “Suppression Secured by Practice and
      Detachment”: disciplined effort to control prakṛti -> not sporadic effort; long, uninterrupted,
      earnest cultivation of stability'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Suppression Secured by Practice
      and Detachment”: default ‘fluctuation’ fails to convey its causal link to prakṛti -> not ‘bad thoughts’
      only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Suppression Secured by Practice and Detachment”:
      state where puruṣa is free from prakṛti -> not trance-entertainment or unconsciousness; graded absorption
      where subject–object friction quiets'
