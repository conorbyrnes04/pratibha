sanskrit_devanagari: 'तच्छिद्रेषु प्रत्ययान्तराणि संस्कारभ्यः ॥ ४.२७ ॥


  हाणम् एषां क्लेशवत् उक्तम् ॥ ४.२८ ॥


  प्रसङ्ख्याने ''प्य अ कुसीदस्य सर्वथा विवेकाख्यते धर्ममेघः समादिः ॥ ४.२९ ॥


  ततः क्लेशकर्मणिवृत्तिः ॥ ४.३० ॥'
sanskrit_iast: 'tacchidreṣu pratyayāntarāṇi saṃskārebhyaḥ || 4.27 ||


  hānam eṣāṃ kleśavad uktam || 4.28 ||


  prasaṃkhyāne ''py akusīdasya sarvathā vivekakhyāter dharmameghaḥ samādhiḥ || 4.29 ||


  tataḥ kleśakarmanivṛttiḥ || 4.30 ||'
translation_literal: '**4.27** In the gaps between those, other presentations arise from saṃskāras (latent impressions).

  **4.28** The cessation of these is described as it is for afflictions (kleśa).

  **4.29** For one without craving, even in discernment itself—when discrimination (viveka) shines everywhere—there arises
  the samādhi called the dharma-cloud.

  **4.30** From that: the cessation of affliction (kleśa) and action (karma).'
commentary: 'These four sūtras trace the final dissolution of prakṛti''s hold on puruṣa through a precise inversion of the
  mind''s ordinary operation. Sūtra 4.27 establishes the problem: the mind''s apparent gaps are not empty but saturated with
  saṃskāra (past impressions), which continually regenerate vṛtti (mental modifications). This is not mere distraction—it
  is the mechanism by which prakṛti perpetuates its claim on consciousness. Sūtra 4.28 shifts to method: these impressions
  are not metaphysically immovable but can be actively removed (hānam) through deliberate practice, treating them as obstacles
  rather than inherent features of mind. The practitioner thus moves from passive observer to active agent in her own liberation.
  Sūtra 4.29 introduces the threshold: perfect discrimination (viveka-khyāti) culminates not in achievement of a goal but
  in disinterest even in the highest spiritual rewards. This is the critical move—the mind must relinquish its final attachment,
  which is attachment to liberation itself. When this occurs, the mind enters dharmamegha samādhi, the ''cloud of dharma,''
  a state of unwavering discriminative awareness that transcends all seeking. The metaphor is precise: a cloud obscures nothing
  yet reveals nothing; it simply is, suspended and indifferent. Sūtra 4.30 names the fruit: from this samādhi, both kleśa
  (afflictions) and karma (action and its residue) cease. The sequence reveals Patañjali''s radical claim: kaivalya is not
  achieved by accumulating merit or knowledge but by systematically removing the mechanism by which prakṛti binds puruṣa.
  The mind does not ascend to liberation; it ceases to obstruct it. Puruṣa, eternally free, simply recognizes itself when
  the vṛtti-generating machinery falls silent.


  Key Terms


  **saṃskāra** — past impressions or latent mental traces that seed future thoughts and perpetuate the cycle of mental modification

  **viveka-khyāti** — perfect discriminative discernment between puruṣa (consciousness) and prakṛti (matter), the highest
  form of knowledge

  **dharmamegha samādhi** — the ''cloud of dharma'' state—a samādhi of unwavering, effortless discrimination where all seeking
  ceases and the mind rests in pure witness-consciousness

  **kaivalya** — liberation; the isolation and recognition of puruṣa''s independence from prakṛti and all mental modification


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47–48:** Both texts teach that action without attachment to fruit (nishkāma-karma) is the path to liberation.
  The Gītā''s ''yoga is skill in action'' parallels Patañjali''s removal of impressions as a deliberate practice that yields
  freedom. Divergence: The Gītā emphasizes duty and righteous action within the world; Patañjali''s yoga culminates in the
  cessation of all action and withdrawal of the mind from prakṛti entirely.

  **Plotinus, Enneads 6.9.11:** Plotinus describes the soul''s ascent to the One through progressive negation of lower attachments,
  culminating in a state of unknowing unity. Like dharmamegha samādhi, this is a state beyond striving where the soul ''becomes''
  what it already is. Divergence: Plotinus''s One is transcendent and generative; Patañjali''s puruṣa is eternally isolated
  (kaivalya) and passive, never generative—prakṛti alone manifests.

  **Epictetus, Enchiridion 1:** Epictetus teaches that freedom lies in distinguishing what is ''up to us'' (our judgments)
  from what is not (external events), and in relinquishing attachment to outcomes. This parallels viveka-khyāti''s discrimination
  and the disinterest in rewards. Divergence: Epictetus locates freedom in rational will and virtue within the world; Patañjali
  locates it in the cessation of all mental modification and withdrawal of consciousness from the material realm.'
insight: The claim that a single state of samādhi can annihilate all afflictions and karmic residue is a decisive moment in
  the Yoga canon, marking the transition from the gradual purification of the mind to t
