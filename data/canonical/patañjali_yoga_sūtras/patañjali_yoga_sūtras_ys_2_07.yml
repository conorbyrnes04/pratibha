unit_label: Desire Following Pleasure
title: Desire Following Pleasure
unit_type: sutra
sanskrit_devanagari: सुखानुशायी रागः
sanskrit_iast: sukhānuśayī rāgaḥ
translation_literal: The desire that follows pleasure.
commentary: 'The central claim here is that pleasure itself is not an end but a catalyst for desire; the very moment one experiences
  pleasure, a new desire arises that seeks to sustain or enhance that pleasure. This move—identifying pleasure as the antecedent
  of desire—is contested in the broader Yoga tradition, where some commentators treat pleasure as a neutral stimulus, while
  others, like Dvivedi, explicitly link it to desire. In the Sāṃkhya framework, prakṛti manifests as a dynamic interplay of
  sattva, rajas, and tamas; pleasure (sukha) is a rajas‑driven state that inevitably generates further rajas activity in the
  form of desire (rāga). The implication for practice is existential: one must recognize that every pleasurable experience
  invites a new craving, which can entangle the mind in a cycle of seeking. By bringing conscious awareness to the moment
  pleasure arises, a practitioner can interrupt the automatic transition to desire, thereby preventing the mind from being
  pulled into the endless loop of craving and satisfaction that keeps it bound to prakṛti. This insight aligns with the Yoga
  Sutra’s broader aim of purifying the mind (citta) and achieving samādhi, the state where the mind is no longer driven by
  the oscillations of desire and pleasure. The Sūtra thus serves as a concise reminder that pleasure is not a safe harbor
  but a launchpad for further desire, and that awareness of this transition is essential for liberation.


  Key Terms


  **sukha (सुख)** — sukha (pleasure) -> in Sāṃkhya, the rajas‑driven state of satisfaction; in Yoga, a transient experience
  that can fuel further desire; the translation ‘pleasure’ misses its role as a catalyst for craving.


  **rāga (राग)** — rāga (desire) -> in Sāṃkhya, the active impulse that propels prakṛti toward change; in Yoga, the specific
  desire that arises from pleasure; the term ‘desire’ alone omits its function as the immediate successor to pleasure.


  Cross-Tradition Resonances


  **Yoga Sutra 2.4, 2.5:** Both sutras use a single noun phrase to denote a state that follows a preceding experience (e.g.,
  2.4 ‘kālaḥ’ follows time; 2.5 ‘kālaḥ’ follows the mind), mirroring the structure of 2.7 where ‘sukha’ precedes ‘rāga’.

  *Divergence:* Unlike 2.4 and 2.5, 2.7 explicitly links two experiential states (pleasure and desire) rather than a state
  and its cause, highlighting a causal chain rather than a simple temporal sequence.


  **Yoga Sutra 2.6:** Both sutras employ a succinct, noun‑only construction to capture a complex psychological transition
  (2.6 ‘kālaḥ’ to ‘kālaḥ’), underscoring the economy of expression in the Sūtra.

  *Divergence:* 2.7’s use of the compound ‘sukhānuśayī’ introduces a relational modifier, indicating that desire is not just
  a state but one that specifically follows pleasure, adding a layer of relational specificity absent in 2.6.'
insight: The central claim here is that pleasure itself is not an end but a catalyst for desire; the very moment one experiences
  pleasure, a new desire arises that seeks to sustain or enhance that pleasure.
practice: Let the desire that follows pleasure arise in you.
