- kind: practice
  label: Practice (Abhyasa)
  body: You let go of the very desire to attain the highest reward, and you remain in constant discriminative
    awareness, thereby entering the dharmamegha samādhi.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: 'One who, due to his or her perfect discrimination, is totally disinterested even in the highest
    rewards, remains in the constant discriminative discernment, which called dharmamegha (cloud of dharma)
    samādhi. [Note: The meaning of dharma includes virtue, justice, law, duty, morality, religion, religious
    merit and steadfast decree.]'
