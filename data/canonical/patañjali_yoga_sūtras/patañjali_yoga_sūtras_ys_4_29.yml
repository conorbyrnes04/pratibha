  body: prasaṃkhyāne 'py akusīdasya sarvathā vivekakhyāter dharmameghaḥ samādhiḥ
- kind: translation
  label: Pratibha Translation
  body: When one, by perfect discrimination, becomes entirely disinterested even in the highest rewards,
    one remains in the constant discriminative discernment, which is called dharmamegha (cloud of dharma)
    samādhi.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that liberation is achieved not by striving for higher status but by relinquishing
    all desire, even for the highest spiritual attainments. Patañjali’s dharmamegha samādhi is a state
    of effortless, complete equanimity, where the mind no longer seeks any external validation. This claim
    aligns with the Sāṃkhya view that puruṣa (consciousness) is distinct from prakṛti (matter) and that
    liberation requires the complete dissolution of vṛtti (mental modifications). The sūtra’s emphasis
    on disinterest parallels the idea of the “cloud of dharma” as an all-encompassing, unchanging consciousness
    that transcends individual aspirations. The existential implication is that one must cultivate a mindset
    that is indifferent to both success and failure, thereby allowing puruṣa to shine unimpeded. The commentary’s
    illustration of desire as bondage—where even the desire for God is a hindrance—underscores that liberation
    is not a goal to be attained but a state to be realized. In practice, this means consciously letting
    go of the very intention that would otherwise keep one bound to the cycle of desire and aversion.
    Thus, the sūtra invites practitioners to recognize that true samādhi is not a result of effort but
    the natural unfolding of a mind that has ceased to seek any reward, even the reward of liberation
    itself.


    Key Terms


    **prasaṃkhyāne (प्रसङ्ख्याने)** — prasaṃkhyāne (IAST) -> प्रसङ्ख्याने (Devanagari) -> ‘by perfect
    discrimination’; emphasizes the role of discriminative cognition (viveka) in achieving liberation,
    a concept central to both Yoga and Sāṃkhya


    **vṛtti (वृत्ति)** — vṛtti (IAST) -> वृत्ति (Devanagari) -> ‘mental modification’; in Sāṃkhya, it
    is the activity of prakṛti that obscures puruṣa; the sūtra’s call for disinterest directly negates
    vṛtti


    **samādhi (समादिः)** — samādhi (IAST) -> समादिः (Devanagari) -> ‘state of absorption’; here it is
    a specific form—dharmamegha—highlighting that samādhi is not merely concentration but a cloud of all
    virtuous qualities


    Cross-Tradition Resonances


    **Yoga Sūtra 4.28:** Both 4.28 and 4.29 describe samādhi states that arise from disinterest; 4.28
    focuses on the cessation of desire, while 4.29 specifies the dharmamegha form

    *Divergence:* 4.28 presents a general samādhi, whereas 4.29 narrows it to a cloud of dharma, indicating
    a more refined, all-encompassing state


    **Sāṃkhya Karika 2.5:** The Karika’s assertion that puruṣa is distinct from prakṛti parallels the
    sūtra’s claim that disinterest reveals pure consciousness

    *Divergence:* Karika emphasizes analytical distinction, whereas the sūtra uses experiential disinterest
    as the vehicle


    **Bhaṭṭa’s Upāyaśāstra 5.12:** Both texts discuss the removal of desire as a means to liberation

    *Divergence:* Bhaṭṭa frames it as a gradual process of practice, while the sūtra presents it as an
    instantaneous shift upon complete discrimination'
