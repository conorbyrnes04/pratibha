sanskrit_devanagari: प्रसङ्ख्याने 'प्य अ कुसीदस्य सर्वथा विवेकाख्यते धर्ममेघः समादिः
sanskrit_iast: prasaṃkhyāne 'py akusīdasya sarvathā vivekakhyāter dharmameghaḥ samādhiḥ
translation_literal: Even in the discernment that follows, for one without craving—when viveka-knowledge
  shines in all directions—samādhi becomes the dharma-cloud.
commentary: 'This sūtra describes the final, most refined stage of samādhi in Patañjali''s system, often
  called the ''cloud of dharma'' (dharmamegha-samādhi). It arrives when discrimination (viveka) has matured
  completely and the practitioner has relinquished all grasping, even subtle attachment to the fruits
  of practice.


  The phrase prasaṃkhyāne ''py (''even in the discernment that follows'') points to a state beyond ordinary
  intellectual analysis—a direct, non-dual seeing that pervades all dimensions of consciousness. Akusīdasya
  (''without craving, without interest in gain'') is crucial: this is not a samādhi seized or possessed,
  but one that descends naturally when the mind releases its final hold on becoming and acquisition.


  Vivekakhyāter (''when viveka-knowledge is named, recognized, shines forth'') indicates that discrimination
  has become not a tool but a living reality—the mind''s native clarity. Sarvathā (''in all directions,
  in all ways'') suggests this knowing is not localized or conditional but omnidirectional, saturating
  the entire field of awareness.


  Dharmameghaḥ (''the cloud of dharma'') is a classical metaphor: just as a cloud releases rain without
  intention or effort, this samādhi allows the accumulated merit and insight of practice to dissolve and
  nourish the field of consciousness. What remains is not blankness but a luminous, effortless knowing—the
  threshold of kaivalya (liberation). The practitioner has become transparent to dharma itself.


  Within the Yoga–Sāṃkhya framework, this represents the final dissolution of the subtle ego-sense (ahaṃkāra)
  and the triumph of sattva (clarity) over rajas and tamas. Consciousness recognizes itself as the eternal
  witness, untouched by the play of nature.


  Key Terms


  **viveka** — Discrimination; the capacity to distinguish between consciousness (puruṣa) and nature (prakṛti),
  witness and witnessed; the cornerstone of liberation in Yoga–Sāṃkhya.

  **akusīda** — Without craving, without self-interest; free from the desire to gain or possess; disinterested
  in outcome.

  **dharmamegha-samādhi** — The ''cloud of dharma'' absorption; the penultimate stage of samādhi in which
  all subtle attachments dissolve and the mind becomes a transparent vehicle for the natural unfolding
  of truth.'
insight: The sūtra asserts that liberation is achieved not by striving for higher status but by relinquishing
  all desire, even for the highest spiritual attainments.
practice: Throughout the day, the moment you notice yourself reaching for something—approval, certainty,
  a particular outcome—pause and whisper 'without craving' while releasing your grip (physically open
  your hand if it's clenched). Let discrimination shine in all directions by turning your gaze outward
  to what is actually here, rather than inward to what you want.
