title: Cultivating Samādhi and Alleviating Afflictions
unit_type: sutra
sanskrit_devanagari: समाधिभावनार्थः क्लेशतानुकरणार्थः च
sanskrit_iast: samādhibhāvanārthaḥ kleśatanūkaraṇārthaś ca
translation_literal: The purpose of Samādhi is to cultivate it, and the purpose of alleviating afflictions is also.
commentary: 'The Sūtra asserts that the two primary aims of preliminary Yoga are to engender a habitual state of Samādhi and
  to attenuate the five afflictive tendencies. The philosophical claim is that both cultivation and alleviation are inseparable
  goals, each reinforcing the other. The contested move lies in treating Samādhi not merely as a meditative state but as a
  *prāṇāyāma* of the mind that can be intentionally fostered; this contrasts with the traditional view that Samādhi arises
  spontaneously from disciplined practice. Within the Yoga–Sāṃkhya framework, Samādhi is the *prākṛti*‑free, *puruṣa*‑centered
  awareness that suspends *vṛtti*; alleviating afflictions (*kleśa*) is the removal of the *prākṛti*‑based distortions that
  obscure *puruṣa*’s true nature. Dvivedi’s commentary emphasizes the practical aspect—“for acquiring habitual” and “attenuating
  distractions”—highlighting the experiential immediacy of the Sūtra’s prescription. Existentially, the dual focus invites
  the practitioner to consciously *sādhana* (practice) both by cultivating a steady, focused mind and by systematically dismantling
  the mental habits that lead to suffering. This integrated approach ensures that the practitioner does not merely achieve
  a fleeting state of calm but establishes a durable foundation for higher realization.


  Key Terms


  **samādhi (समाधि)** — samādhi (IAST) -> समा (together) + धि (to think) -> the state of being together with the object; in
  Sāṃkhya, the *puruṣa*‑centered awareness free from *vṛtti*; the translation ‘concentration’ misses its ontological aspect
  of *puruṣa*‑purity.


  **kleśa (क्लेश)** — kleśa (IAST) -> क्लेश (pain, affliction) -> the five *kleśa* (ignorance, ego, desire, aversion, attachment)
  are *prākṛti*‑based distortions; the term ‘afflictions’ omits their role as *prākṛti*‑driven obstacles to *puruṣa*‑realization.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.1, 2.2:** Both Sūtras employ the structure ‘X‑arthaḥ … Y‑arthaḥ’ to list complementary aims; 2.1 focuses
  on the purpose of practice, 2.2 extends to the purpose of alleviating afflictions.

  *Divergence:* While 2.1 treats the aims as separate, 2.2 merges them, suggesting a unified goal rather than a sequential
  process.


  **Yoga Sūtra 1.1:** The opening Sūtra states that Yoga is the cessation of *vṛtti*; 2.2’s emphasis on alleviating *kleśa*
  provides the mechanism by which *vṛtti* is suppressed.

  *Divergence:* 1.1 presents a singular end state, whereas 2.2 introduces a dual procedural pathway—cultivation and alleviation—that
  precedes the cessation.'
insight: The Sūtra asserts that the two primary aims of preliminary Yoga are to engender a habitual state of Samādhi and to
  attenuate the five afflictive tendencies.
practice: Cultivate a steady, habitual Samādhi while simultaneously working to attenuate the five afflictive tendencies.
