sanskrit_devanagari: समाधिभावनार्थः क्लेशतानुकरणार्थः च
sanskrit_iast: samādhibhāvanārthaḥ kleśatanūkaraṇārthaś ca
translation_literal: The practice is undertaken both for the cultivation of samādhi and for the thinning
  of afflictions.
commentary: 'This sūtra appears in the context of Patañjali''s discussion of pratipakṣa-bhāvanā (cultivation
  of the opposite) and the role of disciplined practice (abhyāsa) in yoga. It establishes a dual purpose
  that runs through all yogic effort: the positive aim of deepening absorption (samādhi-bhāvanā) and the
  negative aim of diminishing the kleśas—the five afflictions (avidyā, asmitā, rāga, dveṣa, abhiniveśa)
  that bind consciousness to suffering.


  The sūtra is not prescriptive but descriptive: it names what yoga actually does. Every technique—breath
  work, postural stability, sense withdrawal, concentration—serves both vectors simultaneously. As the
  mind settles into samādhi, the grip of affliction loosens. Conversely, as kleśas thin, samādhi becomes
  accessible. They are not separate goals but two aspects of a single transformation.


  In the Sāṃkhya-Yoga framework, kleśas are the mechanism by which puruṣa (pure consciousness) becomes
  entangled in prakṛti (matter-mind). Their reduction is not annihilation but clarification—the afflictions
  lose their power to obscure. Samādhi, meanwhile, is not escape but direct knowing: the mind becomes
  transparent to its own nature and to the distinction between seer and seen.


  This sūtra also guards against a common misunderstanding: yoga is not only about bliss or transcendence
  (the samādhi-bhāvanā side). It is equally practical and psychological—it heals. The student who sits
  to meditate is simultaneously working to dissolve reactivity, fear, grasping, and delusion. Both dimensions
  matter; both are always present.


  Key Terms


  **samādhi** — Absorption; unified, undistracted mental absorption in which subject-object duality dissolves
  and consciousness rests in its own nature.

  **kleśa** — Affliction or obstacle; the five root afflictions (avidyā, asmitā, rāga, dveṣa, abhiniveśa)
  that bind consciousness to suffering and obscure self-knowledge.

  **pratipakṣa-bhāvanā** — Cultivation of the opposite; a yogic method of weakening negative mental patterns
  by consciously generating their positive counterparts.'
insight: The Sūtra asserts that the two primary aims of preliminary Yoga are to engender a habitual state
  of Samādhi and to attenuate the five afflictive tendencies.
practice: As you move through today, notice the exact moment when an affliction tightens—when fear contracts
  your chest, aversion makes you turn away, or you grip an identity. Pause there without fixing it, and
  simply breathe into that tightness while whispering 'both at once'—acknowledging that in this very moment
  of noticing, samādhi and the thinning of kleśa are already working together, requiring nothing else
  from you.
