sanskrit_devanagari: 'अभ्यासवैराग्याभ्यम् तन्निरोधः ॥ १.१२ ॥


  तत्र स्थितौ यत्नोऽभ्यासः ॥ १.१३ ॥


  सा तु दीर्घकालान्तर्यसत्कारासेवितो दृढभूमिः ॥ १.१४ ॥


  दृष्टानुस्रविकविषयवितृणस्य वशिकारसंज्ञा वैराग्यम् ॥ १.१५ ॥


  तत् परं पुरुषाख्याते गुणवैतृण्यम् ॥ १.१६ ॥'
sanskrit_iast: 'abhyāsavairāgyābhyāṃ tannirodhaḥ || 1.12 ||


  tatra sthitau yatno ''bhyāsaḥ || 1.13 ||


  sa tu dīrghakālanairantaryasatkārāsevito dṛḍhabhūmiḥ || 1.14 ||


  dṛṣṭānuśravikaviṣayavitṛṣṇasya vaśīkārasaṃjñā vairāgyam || 1.15 ||


  tat paraṃ puruṣakhyāter guṇavaitṛṣṇyam || 1.16 ||'
translation_literal: '**1.12** That cessation comes through practice (abhyāsa) and dispassion (vairāgya).

  **1.13** Of these, practice is effort (yatna) toward steadiness (sthiti) in that state.

  **1.14** Practice becomes firmly grounded when cultivated for a long time, without interruption, and
  with sincere devotion.

  **1.15** Dispassion is the mastery (vaśīkāra) that comes when one is free from thirst (vitṛṣṇa) for
  objects—both those seen and those heard of.

  **1.16** The supreme dispassion is freedom from craving for the guṇas (guṇavaitṛṣṇya), born of insight
  into the puruṣa (puruṣakhyāti).'
commentary: 'Sūtras 1.12–1.16 unfold a single argument: the cessation of mental fluctuation (vṛtti-nirodha)
  requires a paired discipline—abhyāsa (sustained practice) and vairāgya (non-attachment)—that together
  establish an unshakeable ground from which puruṣa recognizes its radical independence from prakṛti.
  The logic is cumulative. Sūtra 1.12 posits the two-fold requirement: practice tames the mind''s restlessness;
  detachment dissolves the underlying craving (rāga, dveṣa) that perpetually re-ignites it. This is not
  sequential but reciprocal—practice without detachment hardens into compulsion; detachment without practice
  remains abstract. Sūtra 1.13 clarifies that effort itself *is* the practice; there is no passive arrival
  at samādhi. The yatna (exertion) that sustains focus *constitutes* abhyāsa. Sūtra 1.14 then specifies
  the temporal condition: this effort must be uninterrupted (anantara) and prolonged, transforming practice
  from episodic discipline into a firm ground (dṛḍha-bhūmi)—a second nature of the mind. The shift from
  doing to being occurs through continuity, not intensity alone. Sūtras 1.15–1.16 complete the arc by
  defining vairāgya not as mere renunciation but as the lived consciousness of mastery over desire—the
  recognition that neither sense-objects nor scriptural promises hold sway. This consciousness is itself
  the supreme state (parama-pada), wherein the guṇas (the three qualities of prakṛti) cease their subtle
  influence. Here puruṣa stands alone, no longer entangled in prakṛti''s dynamism. The cluster''s genius
  lies in showing that abhyāsa and vairāgya are not two separate paths but two aspects of one movement:
  disciplined attention reveals the emptiness of craving; the dissolution of craving deepens and stabilizes
  attention. Together they erode the fundamental misidentification of puruṣa with the mind, allowing kaivalya
  (isolation, liberation) to emerge not as an achievement but as a recognition of what puruṣa always already
  is.


  Key Terms


  **abhyāsa** — sustained, continuous practice; disciplined repetition of focused attention that gradually
  stabilizes the mind

  **vairāgya** — non-attachment; the lived absence of craving for sense-objects and scriptural rewards;
  dispassion rooted in direct recognition

  **dṛḍha-bhūmi** — firm ground; the stable, unshakeable foundation of samādhi achieved through uninterrupted
  practice

  **kaivalya** — isolation, aloneness; the liberation of puruṣa from prakṛti, wherein consciousness stands
  in its own nature


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.35 (Arjuna Uvāca):** Both texts emphasize that the mind is restless and difficult
  to control, requiring sustained practice (abhyāsa) and detachment (vairāgya). The Gītā''s prescription
  of yoga as the path to steady consciousness parallels the Yoga Sūtra''s two-fold discipline. Divergence:
  The Gītā frames practice within dharma and duty (svadharma), whereas the Yoga Sūtra treats abhyāsa as
  a universal, non-sectarian method independent of social role or scriptural obligation.

  **Epictetus, Enchiridion 1:** Both Epictetus and Patañjali distinguish between what lies within our
  control (prohairesis/effort, attention) and what does not (external objects, outcomes). Both advocate
  disciplined practice of attention as the path to freedom from disturbance. Divergence: Epictetus grounds
  freedom in rational assent to cosmic order; Patañjali grounds it in the metaphysical separation of puruṣa
  from prakṛti, making liberation ontological rather than merely ethical.

  **Plotinus, Enneads VI.9 (On the Good or the One):** Both Plotinus and Patañjali describe a supreme
  state beyond the fluctuations of multiplicity—the One beyond being for Plotinus, kaivalya for Patañjali—reached
  through disciplined ascent and the cessation of identification with lower principles. Divergence: Plotinus
  emphasizes mystical union and emanation; Patañjali emphasizes discrimination (viveka) and the recognition
  of puruṣa''s eternal aloneness, making liberation a return to what always was rather than a union with
  transcendence.'
