sanskrit_devanagari: तत् परं पुरुषाख्याते गुणवैतृण्यम्
sanskrit_iast: tat paraṃ puruṣakhyāter guṇavaitṛṣṇyam
translation_literal: 'That is the highest state: when the Self is recognized as distinct, the gunas cease
  to hold any pull.'
commentary: 'This sūtra marks the culmination of discriminative knowledge (viveka) in Patañjali''s system.
  The phrase *puruṣakhyāter* (from the recognition of puruṣa, the witnessing Self) indicates the moment
  when the meditator''s awareness stabilizes in its own nature—separate from the flux of matter (prakṛti)
  and its three qualities (sattva, rajas, tamas). *Guṇavaitṛṣṇyam* (absence of thirst for the gunas) does
  not mean the gunas disappear; rather, they lose their binding power. The Self no longer mistakes itself
  for their modifications. This is *kaivalya*, aloneness—not isolation but the freedom of consciousness
  recognizing itself as eternally untouched by the machinery of nature. In the Sāṃkhya framework, this
  is the final asymmetry: prakṛti continues its dance, but puruṣa no longer watches as though hypnotized.
  The gunas still operate in the body-mind, but they no longer generate the sense of personal ownership,
  fear, or compulsion. This is the gateway to what Patañjali calls *mokṣa*—not annihilation but the cessation
  of mistaken identity.


  Key Terms


  **puruṣa** — The eternal, unchanging witnessing consciousness; the Self distinct from all matter and
  mental activity

  **guṇa** — The three qualities of nature (sattva, rajas, tamas) that constitute all manifest reality;
  their interplay creates experience

  **vaitṛṣṇya** — Absence of thirst, craving, or attachment; freedom from the pull or magnetism of objects
  and states'
insight: The claim that the ultimate samādhi is the *para* (highest) cessation of the Gunas rests on the
  ontological distinction between Purusha and Prakriti.
practice: 'Throughout today, each time you notice yourself caught in wanting—a craving, an aversion, a
  pull toward comfort or away from discomfort—pause and ask: *Who is watching this want?* Do not answer
  with words. Instead, turn your attention to the witnessing awareness itself, the one aware of the wanting,
  and rest there for three breaths, letting that awareness recognize its own untouched nature, separate
  from the guna-machinery moving through you.'
