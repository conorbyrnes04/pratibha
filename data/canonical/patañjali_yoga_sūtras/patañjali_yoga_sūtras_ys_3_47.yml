- kind: translation
  label: Pratibha Translation
  body: You embody the mind’s smile, aligning with the purpose of the senses, thereby conquering the senses.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this verse is that the yogic state of mastery is not merely a mental triumph
    but a bodily perfection that mirrors the mind’s own smile. By interpreting *grahaṇa* as the act of
    taking in, *svarūpa* as the inherent form, and *vṛtti* as the pattern of the mind, the verse suggests
    that when the body *smitā* (smiles) in harmony with the *artha* (purpose) of the senses, the senses
    themselves become subservient. This view situates the verse within the broader Samkhya-Yoga synthesis:
    the *purusha* (consciousness) is not detached but actively engaged in shaping the *prakṛti* (material
    world) through disciplined perception. The existential implication is that a practitioner’s body,
    when attuned to the subtle smile of the mind, becomes a vessel of inner grace, thereby transforming
    ordinary bodily faculties into instruments of liberation. The Satchidananda commentary’s emphasis
    on strength, adamantine hardness, and robustness underscores the material dimension of this perfection,
    reminding us that the yogic body is not fragile but solid and resilient. The verse thus bridges the
    metaphysical and the corporeal, urging practitioners to cultivate a body that reflects the mind’s
    serene smile, a practice that ultimately leads to *samādhi* and the realization of *īśvara* as the
    ultimate witness.


    Key Terms


    **grahaṇa (ग्रहन)** — root *grah-* ‘to take, receive’ → ‘perception’ → in yoga, the act of taking
    in sensory data by the mind; the translation ‘taking’ misses the subtlety of intentional, conscious
    reception.


    **svarūpa (स्वरूप)** — ‘own form’ → ‘inherent nature’ → in yoga, the intrinsic nature of a phenomenon;
    the translation ‘form’ omits its role as the self‑identifying essence of the mind’s activity.


    **vṛtti (वृत्ति)** — ‘variation, fluctuation’ → ‘mental modifications’ → in yoga, the patterns of
    mind that bind consciousness; the translation ‘pattern’ underplays its dynamic, binding nature.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 1.1:** Both verses establish a foundational link between the mind’s activity
    and the control of the senses, using a concise formulaic structure that pairs a mental process with
    a bodily outcome.

    *Divergence:* While 1.1 speaks of the mind’s control over the senses, 3.47 specifies that the body’s
    ‘smile’ must align with the senses’ purpose, adding a layer of bodily grace absent in 1.1.


    **Kapila Samkhya Karika 1.2:** Both texts emphasize the importance of aligning *prakṛti* with *purusha*
    through disciplined perception.

    *Divergence:* Kapila’s Karika focuses on the metaphysical alignment, whereas 3.47 introduces a tangible
    bodily metaphor (the smile) to illustrate the same principle.


    **Bhaṭṭa, Yogācāra 3.10:** Both treat the mind’s activity as a mediator between external stimuli and
    internal experience.

    *Divergence:* Yogācāra’s analysis is epistemological, whereas 3.47 frames the mediation in terms of
    bodily perfection and sensory conquest.'
