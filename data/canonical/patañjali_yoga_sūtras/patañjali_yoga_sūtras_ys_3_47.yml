sanskrit_devanagari: ग्रहणस्वरूपस्मिताञ्वयार्थवत्तवासंयमाद् इंद्रियजयः
sanskrit_iast: grahaṇasvarūpāsmitānvayārthavattvasaṃyamād indriyajayaḥ
translation_literal: Through saṃyama on the nature of grasping, the sense of 'I', the continuity of experience,
  and the purposefulness of objects, mastery over the senses is gained.
commentary: 'This sūtra addresses a subtle but crucial stage in the yogic refinement of sensory experience.
  Patañjali is not advocating suppression or denial of the senses, but rather a penetrating investigation
  into their actual mechanism—how they work, what animates them, and what binds consciousness to them.


  The four objects of saṃyama here are layered:


  1. **Grahaṇa-svarūpa** (the nature of grasping itself): the fundamental act by which a sense organ contacts
  an object. This is the raw faculty of perception—how the eye sees, the ear hears. By examining this
  process directly, one stops taking it for granted.


  2. **Asmitā** (the sense of ''I'', ego-sense): the subtle identification that arises with each act of
  perception—"I am seeing," "I am hearing." This is the subject-pole that crystallizes in each moment
  of sensing.


  3. **Anvaya** (continuity, sequence, thread): the way individual perceptions link into a narrative of
  experience. Consciousness does not jump randomly; sensations form a coherent stream. Recognizing this
  continuity as constructed—not inherent—loosens its grip.


  4. **Arthavattva** (purposefulness, object-nature): the apparent solidity and independent reality of
  objects. Through saṃyama, one sees that objects exist *as perceived*—their "purposefulness" is their
  capacity to engage the senses, not an intrinsic property.


  When these four dimensions are held in unified attention (saṃyama), the senses cease to be masters.
  The yogi no longer reacts compulsively to sensory input; the senses become transparent instruments.
  This is **indriya-jaya**: not conquest through force, but freedom through understanding. The senses
  remain functional but no longer bind consciousness to external objects or emotional reactivity.


  This stage typically arises after pratyāhāra (sense withdrawal) and is foundational to the higher samādhis,
  where sense-based distraction dissolves naturally.


  Key Terms


  **saṃyama** — The unified application of dhāraṇā (concentration), dhyāna (meditation), and samādhi (absorption)
  on a single object; the yogic tool for penetrating insight and subtle mastery.

  **indriya-jaya** — Mastery or freedom of the senses; not suppression but the dissolution of compulsive
  reactivity through understanding their true nature.

  **asmitā** — The ego-sense or ''I-maker''; the subtle identification with the perceiver that arises
  in each act of perception; one of the five kleśas (afflictions) when it becomes rigid.'
insight: The central claim of this verse is that the yogic state of mastery is not merely a mental triumph
  but a bodily perfection that mirrors the mind’s own smile.
practice: '**Sensory Transparency Meditation (15 minutes)**


  1. Sit comfortably. Close your eyes for the first 5 minutes and simply observe the *mechanism* of hearing.
  Don''t listen to sounds as meaningful; instead, notice the bare act of the ear receiving vibration.
  Notice how each sound arises, persists, and dissolves. Observe the gap between sound and your sense
  of "I am hearing it."


  2. Open your eyes. For 5 minutes, look at an ordinary object (a cup, a leaf, a wall). Watch the *act
  of seeing* itself—the eye meeting form and color. Notice how a sense of ownership ("I see this") appears
  alongside the seeing. Can you separate the raw seeing from the "I" that claims it?


  3. For the final 5 minutes, with eyes open or closed, observe how individual sensations (a sound, a
  texture, a thought) link into a continuous narrative of "your experience." Notice that this continuity
  feels real, but is actually a construction—each moment is fresh. What holds them together? What would
  happen if you didn''t stitch them into a story?


  Do not force or strain. The point is gentle, curious observation of the sensory machinery itself, not
  suppression. Over weeks, this practice naturally loosens the compulsive grip of the senses.'
