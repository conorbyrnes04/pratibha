sanskrit_devanagari: 'नीरविचारवायशारदये ''ध्यात्मप्रसादः ॥ १.४७ ॥


  र्‍तंभाराः तत्र प्रज्ञा ॥ १.४८ ॥


  श्रुतानुमानप्रज्ञाभ्याम् अन्यविषयः विशेषार्थत्वात् ॥ १.४९ ॥


  तज्जः संस्कारः अङ्‍यासंस्कारप्रतिबन्धी ॥ १.५० ॥


  तस्यापि निरोधे सर्वनिरोधान् निरबीजः समाधिः ॥ १.५१ ॥'
sanskrit_iast: 'nirvicāravaiśāradye ''dhyātmaprasādaḥ || 1.47 ||


  ṛtaṃbharā tatra prajñā || 1.48 ||


  śrutānumānaprajñābhyām anyaviṣayā viśeṣārthatvāt || 1.49 ||


  tajjaḥ saṃskāro ''nyasaṃskārapratibandhī || 1.50 ||


  tasyāpi nirodhe sarvanirodhān nirbījaḥ samādhiḥ || 1.51 ||'
translation_literal: '**1.47** When discernment (vicāra) is lucid and unshaken (nirvicāravaiśāradye),
  the inner light (adhyātmaprasādaḥ) flowers.

  **1.48** There, knowledge (prajñā) is truth-bearing (ṛtaṃbharā).

  **1.49** This differs from knowledge born of scripture (śruta) and inference (anumāna), for it bears
  on particulars (viśeṣārthatvāt).

  **1.50** The imprint (saṃskāra) born of it obstructs all other imprints (anyasaṃskārapratibandhī).

  **1.51** When even that is stilled (nirodhe), all becoming ceases (sarvanirodhān)—seedless absorption
  (nirbījaḥ samādhiḥ).'
commentary: 'These five sūtras trace a single arc: the progressive refinement of consciousness from deliberative
  thought to seedless samādhi, each stage marked by a deepening purity and a corresponding shift in the
  nature of knowledge itself. The movement is not merely negative (cessation of thought) but positive—a
  reorientation toward what sustains consciousness when the mind''s habitual oscillations cease.


  Sūtra 1.47 establishes the foundation: when deliberation (vicāra) falls away, the mind achieves prasāda—a
  crystalline purity that is itself bliss (ānanda). This is not anesthesia but the mind''s native luminosity,
  unclouded by the vṛtti (mental modifications) that ordinarily fragment awareness. The Purusha''s inherent
  nature, untainted by Prakṛti''s agitation, becomes directly felt.


  Sūtra 1.48 introduces the crucial sustaining principle: this purity is not isolated but held in place
  by ṛta, the cosmic order. Knowledge (prajñā) does not float free; it is anchored in the lawful structure
  of reality itself. This prevents the samādhi from collapsing into mere blankness and ensures that consciousness
  remains aligned with truth rather than fantasy.


  Sūtra 1.49 then specifies what kind of knowledge this is: distinct from ordinary perception and inference,
  which generalize and abstract. The knowledge in samādhi apprehends each particular with absolute specificity,
  unmediated by conceptual overlay. It transcends the three standard pramāṇas (means of knowledge) by
  accessing reality directly, as it is.


  Sūtra 1.50 describes the mechanism: a single, blissful impression of the Purusha becomes so dominant
  that all other vṛtti are excluded. The mind ceases its transformations and becomes a pure mirror for
  this one truth. The samādhi is self-sustaining because the mind, once tasting this bliss, has no reason
  to revert to fragmentation.


  Sūtra 1.51 completes the sequence: even when all impressions (saṃskāra) and seeds (bīja) of thought
  dissolve, consciousness persists in a seedless samādhi—nirbīja samādhi. This is the apex: pure awareness
  without object, without content, yet fully conscious. The Purusha stands alone, kaivalya achieved.


  The cluster''s central insight is that liberation is not escape from reality but perfect alignment with
  it. Each stage purifies the mind''s capacity to know, moving from thought-bound knowledge to object-specific
  knowledge to objectless consciousness. The guṇas of Prakṛti settle into sattva (purity), allowing Purusha
  to recognize itself as eternally distinct and free.


  Key Terms


  **nirvicāra** — Non-deliberative state; cessation of analytical thought-modification, allowing direct
  apprehension without conceptual mediation

  **ṛta** — Cosmic order or universal law; the sustaining principle that grounds knowledge in reality
  rather than allowing it to dissolve into ignorance

  **prasāda** — Purity, clarity, or luminosity of consciousness; the crystalline state of mind when vṛtti
  cease and inherent bliss is revealed

  **nirbīja samādhi** — Seedless absorption; the highest samādhi in which all impressions and mental seeds
  dissolve, leaving only pure, objectless consciousness—kaivalya


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.20–23 (Kṛṣṇa on the yogin''s supreme state):** Both texts describe a state where the
  mind becomes steady and unified, freed from distraction, and experiences a bliss beyond sensory pleasure.
  The Gītā''s ''yoga is the cessation of mental fluctuations'' (yogaḥ chitta-vṛtti-nirodhah) parallels
  the Yoga Sūtras'' progression toward seedless samādhi. Divergence: The Gītā emphasizes devotion and
  duty (bhakti, dharma) as the path, whereas the Yoga Sūtras present a more technical, phenomenological
  account of consciousness independent of theistic surrender.

  **Plotinus, Enneads VI.9.11 (The One beyond intellection):** Plotinus describes a state of union with
  the One in which the soul transcends even intellectual knowledge, resting in a simplicity beyond all
  multiplicity—resonant with nirbīja samādhi as objectless consciousness beyond all content. Divergence:
  Plotinus locates this union in a transcendent, non-material principle external to the soul; the Yoga
  Sūtras locate it in the Purusha''s own nature, eternally present but obscured by Prakṛti''s modifications.

  **Dhammapada 21 (Pali Canon: ''Vigilance is the path to the Deathless''):** Both traditions emphasize
  sustained, non-reactive awareness as the gateway to liberation; both warn against the mind''s tendency
  to fragment and wander, and both present a progressive refinement of consciousness. Divergence: The
  Dhammapada frames this as ethical vigilance and mindfulness practice within a moral framework; the Yoga
  Sūtras present it as a technical epistemology of consciousness itself, with less emphasis on ethical
  precepts as prerequisite.'
insight: The central claim of this sutra is that the knowledge arising from direct perception and inference—what
  the Yogi calls pratyaksha and anumana—is not the same as the knowledge that arises in the state
practice: You sit quietly, close your eyes, and focus on a single breath; as you deepen your concentration,
  you allow the mind to dissolve into a state where each breath becomes a distinct, independent reality.
