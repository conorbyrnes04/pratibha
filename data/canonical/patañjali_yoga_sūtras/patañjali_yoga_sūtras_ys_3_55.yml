sanskrit_devanagari: सत्त्वपुरुषयोः शुद्धिसाम्ये कियव्यम् इति
sanskrit_iast: sattvapuruṣayoḥ śuddhisāmye kaivalyam iti
translation_literal: When the purity of sattva and the purity of puruṣa become equal, that is liberation.
commentary: 'This sūtra (IV.34, the final aphorism of the Yoga Sūtras) distills the entire path into a
  single recognition: liberation (kaivalyam) is not an attainment but an alignment. Puruṣa—the witnessing
  consciousness, eternally free and untouched—has always been pure. Sattva, the luminous quality of prakṛti
  (nature), can be refined through practice until it becomes transparent, no longer obscuring or refracting
  the light of awareness. When sattva reaches its highest refinement (śuddhi), it ceases to impose its
  subtle colorations on perception. The two purities ''become equal'' (sāmye) not because puruṣa changes,
  but because sattva stops interfering. This is the non-dual recognition: the witness and the witnessed
  are not separate; there is only consciousness, now recognized as such. In the Yoga–Sāṃkhya framework,
  this marks the final disentanglement (viveka) of the eternal subject from the machinery of nature. No
  new power is gained; only the illusion of bondage dissolves. The sūtra''s simplicity is deceptive—it
  summarizes the entire eight-limbed path as a single threshold: the moment when clarity becomes complete.


  Key Terms


  **puruṣa** — The eternal, unchanging witness-consciousness; the subject that is never an object; in
  Sāṃkhya, the principle of pure awareness distinct from all of nature (prakṛti).

  **sattva** — The luminous, clarifying quality of nature; one of the three guṇas; when refined to its
  highest degree, it becomes transparent and no longer obscures the light of puruṣa.

  **kaivalyam** — Liberation, aloneness, or isolation; the recognition that puruṣa is eternally free and
  distinct from the modifications of nature; the goal of yoga.'
insight: The central claim of this sutra is that liberation (kaivalyam) is not an external attainment
  but the very *purity* of the *Purusha*’s own sameness.
practice: 'Sit quietly for 10–15 minutes. Do not chase thoughts or emotions. Instead, notice the space
  in which thoughts appear—the unchanging awareness that witnesses them without preference. Observe: thoughts
  arise and pass; emotions color and fade; sensations come and go. But the knowing itself—the simple fact
  of awareness—remains constant, untouched, unaffected. Rest as that witness. When you catch yourself
  identifying with a thought or feeling, gently return to the knowing itself. This is not concentration;
  it is recognition. Over weeks, the boundary between ''observer'' and ''observed'' softens. You may glimpse
  moments where there is simply knowing, without a separate ''knower''—not blankness, but clarity without
  division. That glimpse is the beginning of the equality Patañjali names.'
