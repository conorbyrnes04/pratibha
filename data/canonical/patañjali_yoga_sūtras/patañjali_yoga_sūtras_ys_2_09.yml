title: Desire for Life as Attachment
unit_type: sutra
sanskrit_devanagari: स्वरसवाहि विदुषोऽपि तथा रूढ़ोऽभिनिवेशः
sanskrit_iast: svarasavāhī viduṣo 'pi tathārūḍho 'bhiniveśaḥ
translation_literal: The current of one's own nature carries even the wise; thus rooted in this way, clinging
  to life arises.
commentary: 'This sūtra appears in the context of the five kleśas (afflictions) and specifically addresses
  abhiniveśa—the primal fear-driven attachment to continued existence. Patañjali''s point is subtle and
  unsettling: even a person of learning and discrimination (vidvān) cannot escape the undertow of their
  own constitutional nature (svarasa—one''s inherent flavor or quality). The wise are not exempt from
  this current; they too are swept along by it.


  The phrase tathārūḍho (''thus rooted'' or ''established in that way'') suggests that abhiniveśa is not
  merely a psychological habit but a deeply embedded pattern in the fabric of embodied existence itself.
  It is not overcome by intellectual understanding alone. A scholar may comprehend the mechanics of attachment
  intellectually, yet the body-mind continues to cling to life through instinctive self-preservation.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that prakṛti (nature, materiality) operates
  according to its own laws. The guṇas (qualities of matter) generate their own momentum. Even sattvic
  (luminous, discriminative) individuals remain subject to this current until they achieve genuine viveka
  (discernment) and vairāgya (non-attachment) through direct realization, not mere conceptual knowledge.


  The teaching is liberating precisely because it is honest: attachment to life is not a moral failing
  or a sign of stupidity. It is a structural feature of embodied consciousness. Recognition of this truth
  is the first step toward genuine freedom—not fighting the current, but understanding its nature so deeply
  that one ceases to identify with it.


  Key Terms


  **svarasa** — one''s own inherent nature, flavor, or constitutional quality; the intrinsic current of
  prakṛti operating through an individual

  **abhiniveśa** — fear-driven clinging to life; the primal attachment to continued existence; the fifth
  and subtlest kleśa

  **vidvān (viduṣo)** — the wise, learned, or discriminating person; one possessing intellectual knowledge
  and understanding'
insight: The central philosophical claim of this sutra is that attachment is not a mere external craving
  but an intrinsic, self-sustaining force rooted in the very nature of existence.
practice: 'Sit quietly for 10–15 minutes. Bring attention to the natural rhythm of your breath—the automatic,
  unreflective way your body sustains itself. Do not try to change it; simply observe. Notice how the
  body breathes itself, how it wants to continue, how there is an inherent ''yes'' to existence woven
  into every inhalation. Now gently ask: ''Who is observing this?'' Recognize the awareness that witnesses
  even this primal clinging. You are not the current; you are the space in which it flows. Return to this
  recognition daily. Over weeks, this simple shift in perspective—from identification with the survival
  instinct to witnessing it—begins to loosen abhiniveśa''s grip without suppression or denial.'
