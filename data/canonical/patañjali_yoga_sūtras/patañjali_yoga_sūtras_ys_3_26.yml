sanskrit_devanagari: भुवनज्ञनं सूर्ये संयमात्
sanskrit_iast: bhuvanajñānaṃ sūrye saṃyamāt
translation_literal: Through sustained focus on the sun, knowledge of the celestial spheres arises.
commentary: 'This sūtra belongs to the vibhūti pāda (Book III), where Patañjali describes the siddhis—extraordinary capacities—that
  emerge naturally when saṃyama (the unified triad of concentration, meditation, and absorption) is applied to specific objects
  or principles.


  Here, sūrya (the sun) functions as both a physical luminary and a symbolic center of cosmic order and radiant consciousness
  in yogic anatomy and cosmology. When a practitioner directs saṃyama toward the sun—whether as external observation, internal
  visualization of the solar principle (the manipūra chakra or the subtle sun in the heart), or as the archetypal source of
  illumination—the mind becomes attuned to the organizing intelligence that sustains all worlds (bhuvana).


  Bhuvanajñāna means knowledge of the bhuvanas—the realms, spheres, or dimensions of existence. In Sāṃkhya-Yoga metaphysics,
  reality is structured in layers: the gross physical realm, subtle realms of mind and energy, and transcendent dimensions.
  By aligning consciousness with the sun''s principle—its constancy, its power to sustain and reveal—the yogi''s awareness
  expands to perceive and understand the architecture of these worlds.


  This is not intellectual knowledge but direct, intuitive gnosis (jñāna) that comes from identity of consciousness with the
  object of focus. The sun becomes a gateway to cosmological understanding. Practically, this reflects the principle that
  consciousness takes the shape of what it contemplates; sustained attention to the sun''s luminous, ordering nature reorganizes
  the mind''s own field of knowing.


  The sūtra assumes that the inner and outer suns are not separate—that the solar principle operates at every level of existence,
  and that focused attention creates a resonance through which knowledge flows.


  Key Terms


  **saṃyama** — The unified practice of dhāraṇā (concentration), dhyāna (meditation), and samādhi (absorption) applied to
  a single object; the means by which siddhis arise.

  **bhuvana** — Realm, sphere, or dimension of existence; the structured worlds or planes of manifestation in Yoga cosmology.

  **sūrya** — The sun; both the external celestial body and the inner principle of radiance, illumination, and cosmic order.'
insight: The sūtra asserts that disciplined control of the luminous faculty of the mind—metaphorically the Sun—produces empirical
  knowledge of the world.
practice: At the moment the sun breaks the horizon or at noon when it reaches peak brightness, hold your gaze steady on its
  light (through safe means—reflection in water, or the glow at the edge of your vision) until the image of the sun remains
  vivid when you close your eyes; then, with eyes closed, watch that inner sun dissolve and reform, noticing what worlds or
  dimensions of order appear in that radiance before it fades.
