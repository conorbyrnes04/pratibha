unit_label: Unconditioned by Time
title: Unconditioned by Time
unit_type: sutra
sanskrit_devanagari: पूर्वेषाम् अपि गुरुः कालेनावच्छेदात्
sanskrit_iast: pūrveṣām api guruḥ kālenānavacchedāt
translation_literal: Even for the teacher, the past and future do not cut him off; he remains unconditioned by time.
commentary: 'The claim that the Teacher (guru) is beyond temporal causation is a decisive philosophical move that distinguishes
  the ultimate reality from the conditioned world. In the Yoga and Sāṃkhya tradition, this statement is a direct assertion
  that puruṣa, the witness principle, is not subject to the vṛtti of prakṛti. The sūtra therefore serves as a hinge: it affirms
  that the Teacher’s essence is pure, unaltered, and timeless, thereby making him the supreme source of all knowledge. This
  is not merely a metaphysical abstraction; it has existential import for the practitioner. If one internalizes that the Teacher’s
  consciousness is not bound by past or future, one can begin to see one’s own citta as a potential mirror of that timeless
  witness. The Dvivedi commentary’s emphasis on “greatest of all conceivable entities” echoes the Sāṃkhya idea that puruṣa
  is the ultimate principle, beyond any ontological hierarchy. By recognizing the Teacher’s timelessness, the practitioner
  can transcend the habitual vṛtti that keeps the mind in a cycle of past recollection and future anticipation, thereby moving
  toward samādhi. The sūtra thus functions as both a doctrinal anchor and a practical catalyst for inner liberation.


  Key Terms


  **guruḥ (गुरुः)** — etymology: ‘teacher, guide’ -> tradition: the enlightened Teacher, the source of all knowledge -> default
  translation ‘teacher’ misses the ontological status of the Teacher as the unconditioned witness


  **kālenānavacchedāt (कालेनावच्छेदात्)** — kāla: time; eva: indeed; nāva: not; acchedat: cuts off -> tradition: the Teacher
  is not cut off by time -> default translation ‘does not cut off time’ omits the sense of timelessness


  Cross-Tradition Resonances


  **Yoga Sūtra 1.26:** Structural homology: the Teacher is described as unconditioned by time, mirroring the earlier sūtra
  1.25 where the Teacher is said to be unconditioned by the mind

  *Divergence:* While 1.25 focuses on the mind’s lack of conditioning, 1.26 extends this to the temporal dimension, thereby
  broadening the Teacher’s transcendence


  **Sāṃkhya Kārikā 1.1:** Both texts assert that puruṣa is not subject to prakṛti’s vṛtti

  *Divergence:* Sāṃkhya limits the claim to puruṣa’s ignorance of prakṛti, whereas the Yoga Sūtra explicitly states the Teacher’s
  immunity to time, adding a temporal layer


  **Bhaṭṭa’s Commentary on the Yoga Sūtra 1.26:** Bhaṭṭa interprets the sūtra as a statement of the Teacher’s eternal witness
  nature

  *Divergence:* He emphasizes the Teacher’s role as a guide for the aspirant, whereas the sūtra itself remains neutral about
  pedagogical function'
insight: The claim that the Teacher (guru) is beyond temporal causation is a decisive philosophical move that distinguishes
  the ultimate reality from the conditioned world.
practice: You observe the flow of your thoughts and feelings, and consciously remind yourself that you, like the Teacher,
  are not cut off by past or future—your awareness remains the same, whether you are in the present moment or recalling yesterday’s
  events.
