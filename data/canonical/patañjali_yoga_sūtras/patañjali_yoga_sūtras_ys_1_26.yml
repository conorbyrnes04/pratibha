sanskrit_devanagari: पूर्वेषाम् अपि गुरुः कालेनावच्छेदात्
sanskrit_iast: pūrveṣām api guruḥ kālenānavacchedāt
translation_literal: The teacher of those who came before is also a teacher, because time does not divide him.
commentary: 'This sūtra (I.26) addresses a fundamental paradox in yoga philosophy: how can Īśvara—the supreme teacher—guide
  practitioners across different eras if time itself seems to fragment reality into past, present, and future? Patañjali''s
  answer is that the guru principle transcends temporal succession. Īśvara is not bound by kāla (time as a conditioning force);
  therefore, his teaching remains equally accessible and potent whether received by ancient sages or contemporary practitioners.


  Within the Yoga–Sāṃkhya framework, this reflects a crucial insight: the ultimate teacher is not a historical figure whose
  influence fades, but a principle of consciousness (puruṣa) that stands outside prakṛti''s temporal unfolding. The word kālenānavacchedāt
  (literally, "not cut off by time") suggests that time cannot sever or diminish the guru''s presence or efficacy. This is
  not mysticism but a logical consequence of recognizing a dimension of awareness that is not subject to the three guṇas or
  the cycles of becoming.


  For the practitioner, this means that the teachings—whether encountered in ancient texts, through a living teacher, or through
  direct experience—carry the same transformative power. The guru is not merely a person but a function of truth itself, eternally
  available to those who turn toward it. This sūtra also justifies the yogin''s trust in transmitted wisdom: the lineage is
  not weakened by time but strengthened by its very transcendence of temporal decay.


  Key Terms


  **Īśvara** — The supreme consciousness or teacher; the puruṣa untouched by karma, suffering, or the fruits of action

  **kāla** — Time as a conditioning force within prakṛti; the sequential unfolding of cause and effect

  **guruḥ** — The teacher or principle of transmission; that which removes darkness (gu = darkness, ru = remover)'
insight: The claim that the Teacher (guru) is beyond temporal causation is a decisive philosophical move that distinguishes
  the ultimate reality from the conditioned world.
practice: Receive a teaching you learned years ago—from a teacher, book, or moment now half-forgotten—and whisper it aloud
  as though hearing it for the first time today. Notice how it arrives unchanged, yet transformed by who you have become;
  this is the guru principle working across the gap time tried to make.
