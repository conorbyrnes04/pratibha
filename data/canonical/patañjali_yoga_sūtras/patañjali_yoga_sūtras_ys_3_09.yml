sanskrit_devanagari: व्यूत्थानानिरोधसंस्कारयोः अभिभवप्रादुर्भावौ नीरोधक्षणचित्तान्वयो नीरोधपरिणामः
sanskrit_iast: vyutthānanirodhasaṃskārayor abhibhavaprādurbhāvau nirodhakṣaṇacittānvayo nirodhapariṇāmaḥ
translation_literal: When the activating and restraining impressions alternate in their dominance and emergence, and the mind
  becomes continuous with the moment of restraint, this is transformation into cessation.
commentary: 'This sūtra (YS 3.9) describes a critical threshold in meditation where the practitioner''s consciousness stabilizes
  in the state of nirodha (cessation or restraint). The verse addresses the mechanics of how samādhi deepens.


  Vyutthāna refers to the outward-flowing, activating mental impressions—the habitual patterns that pull awareness toward
  objects. Nirodha refers to the restraining impressions that suppress or withdraw from those objects. Both are saṃskāra (latent
  impressions or conditioning patterns) that have been cultivated through practice.


  Abhibhava means ''overpowering'' or ''domination,'' and prādurbhāva means ''emergence'' or ''manifestation.'' The sūtra
  describes a dynamic interplay: sometimes the restraining impression dominates, sometimes the activating one does. This is
  not static suppression but a living oscillation.


  The key phrase is nirodhakṣaṇacittānvayo—the mind becomes ''continuous with'' (anvaya) ''the moment of restraint'' (nirodhakṣaṇa).
  Here, consciousness no longer flickers between restraint and activation; it becomes unified with the restraining impulse
  itself. This is not blank unconsciousness but a highly refined, alert stillness.


  Nirodhapariṇāmaḥ translates as ''transformation into cessation''—a fundamental shift in how consciousness organizes itself.
  This is the gateway to higher samādhis where the mind rests in its own nature rather than chasing content. Within the Yoga–Sāṃkhya
  framework, this represents the progressive withdrawal of the mind (citta) from identifying with the fluctuations of prakṛti
  (nature) and a stabilization in pure witnessing awareness (puruṣa).


  Key Terms


  **vyutthāna** — outward-flowing, activating mental impression; the impulse toward object-engagement

  **nirodha** — restraint, cessation, or withdrawal; the suppression or inward-turning of mental activity

  **saṃskāra** — latent impression, conditioning, or imprint in consciousness that shapes future mental states'
insight: The passage asserts that the mind’s continuous activity of rising and falling (vyutthāna‑nirōdha) culminates in a
  moment of interception (nirōdha‑kṣaṇa).
practice: The next time you notice your mind pulled toward distraction, pause and feel the actual *alternation*—let the outward
  pull arise fully, then sense the restraint arise fully, then the pull again—without choosing sides. Stay with this oscillation
  itself for three complete cycles, until the rhythm becomes continuous and you find yourself resting in the gaps between
  them.
