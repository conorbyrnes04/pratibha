sanskrit_devanagari: बन्धकारणाशिथिल्यत् प्रचारा-संवेदनाच् च चित्तस्य परशरीरावेशः
sanskrit_iast: bandhakāraṇaśaithilyāt pracārasaṃvedanāc ca cittasya paraśarīrāveśaḥ
translation_literal: Through the loosening of the causes of bondage and through the sensing of the movement of the life-force,
  the mind enters into another's body.
commentary: 'This sūtra describes a siddhi—a superphysical capacity—that arises when specific conditions mature in practice.
  It belongs to the section on vibhūti (powers or accomplishments), which Patañjali treats as both natural fruits of samādhi
  and potential obstacles to liberation.


  The mechanism has two parts:


  1. **Bandhakāraṇaśaithilyāt** (through loosening of the causes of bondage): The ordinary mind is bound by identification
  with the body, sense organs, and mental modifications. As practice deepens—particularly through pratyāhāra (sense withdrawal)
  and dhāraṇā (concentration)—the rigid attachment to one''s own physical form begins to soften. The mind no longer exclusively
  identifies with its habitual corporeal anchor.


  2. **Pracārasaṃvedanāc ca** (through sensing the movement): Prāṇa (the vital life-force) moves through channels (nāḍī) in
  patterns of expansion and contraction. As the practitioner becomes sensitive to this subtle current—especially through breath
  regulation and internal attention—they develop direct perception of prāṇa''s flow. This is not imagination but a refined
  sensory capacity that emerges when the gross mind quiets.


  When both conditions align, **cittasya paraśarīrāveśaḥ** (the mind enters another''s body) becomes possible. This is not
  mystical invasion but a shift in the mind''s sense of location and identification. The mind, no longer rigidly bound to
  its native body, can extend its awareness into and through another organism''s prāṇic field.


  Patañjali lists this power to warn practitioners: such abilities, while genuine fruits of practice, are seductive distractions.
  They reinforce the very subtle ego-identification they seem to transcend. The goal is not to acquire powers but to recognize
  them as natural byproducts of loosening bondage—and to continue toward kaivalya (liberation), not to be captured by the
  marvel of what the mind can do.


  This sūtra assumes the Sāṃkhya-Yoga framework: mind (citta) and body are distinct; prāṇa is the subtle link between them;
  and through systematic practice, the mind''s ordinary boundaries become permeable.


  Key Terms


  **bandhakāraṇa** — the causes of bondage; the mechanisms (ego, identification with body, mental habit) that bind consciousness
  to a single form

  **prāṇa** — the vital life-force; the subtle energetic current that animates and links mind and body

  **citta** — mind-stuff; the subtle mental substance that is the instrument of consciousness and capable of taking on different
  forms and locations'
insight: The passage asserts that the superphysical senses—those that arise from the subtle body—act as a binding force on
  the mind when they are not disciplined.
practice: '**Prāṇa-Sensing Meditation (15–20 minutes):**


  1. Sit upright in a quiet space. Close your eyes.


  2. Begin with 5–10 rounds of nāḍī-śodhana (alternate nostril breathing): inhale left, exhale right; inhale right, exhale
  left. This settles and balances prāṇa.


  3. Return to natural breathing. Place your attention at the nostrils. Notice the temperature, texture, and subtle sensation
  of breath entering and leaving. Do not force; simply observe.


  4. Gradually expand your attention: sense the breath moving down the center of the body (madhya-nāḍī, the central channel).
  Feel it as a current of subtle energy, not just air.


  5. Notice where this current seems to pause, accelerate, or pool. Many practitioners feel it in the chest, belly, or lower
  spine.


  6. Without strain, imagine this current expanding slightly—as if your prāṇa were gently widening its field. You are not
  creating sensation; you are refining perception of what is already moving.


  7. Sit with this awareness for 5–10 minutes. When the mind wanders, return to sensing the prāṇic flow.


  **Why this works:** This practice loosens the mind''s exclusive identification with the physical body by training attention
  on the subtle energetic dimension. Over weeks, your sensitivity to prāṇa''s movement sharpens. You begin to perceive the
  mind as distinct from and capable of moving through the prāṇic field—the first step toward the capacity described in this
  sūtra. The practice also reveals why such powers are obstacles: you become fascinated by your own subtle abilities rather
  than pressing toward the dissolution of all identification.'
