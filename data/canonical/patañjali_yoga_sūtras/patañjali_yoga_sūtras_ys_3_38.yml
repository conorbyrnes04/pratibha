- kind: translation
  label: Pratibha Translation
  body: The superphysical senses, when lax, become the very external sensations that bind the mind.
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that the superphysical senses—those that arise from the subtle body—act as a binding force on
    the mind when they are not disciplined. In the Yoga and Sāṃkhya framework, the mind (citta) is the arena where prakṛti’s
    vṛtti (mental modifications) play out. Here, the superphysical senses are identified as the source of vṛtti that entangles
    citta, preventing it from attaining samādhi, the state of complete absorption. The claim is that these senses are not
    merely passive receptors but active obstacles that must be subdued. The contested move is the identification of the superphysical
    senses as the very same forces that, when controlled, become siddhis—powers that can be harnessed for worldly pursuits.
    This duality reflects the Sāṃkhya notion that prakṛti’s elements can be both the cause of bondage and the means of liberation
    when understood correctly. The existential implication is that one must cultivate awareness of these subtle sensations
    and practice their restraint to free citta from vṛtti, thereby achieving samādhi. The passage invites the practitioner
    to see the superphysical senses not as external hindrances but as internal instruments that, if mastered, can be turned
    into siddhis for ethical living and spiritual progress.


    Key Terms


    **citta (चित्त)** — citta: mind; in Sāṃkhya, the observer; here, the mind bound by superphysical senses


    **vṛtti (वृत्ति)** — vṛtti: mental modifications; the fluctuations that bind citta


    **samādhi (समाधि)** — samādhi: absorption; the goal of Yoga where citta is free from vṛtti


    **prakṛti (प्रकृति)** — prakṛti: primordial nature; source of vṛtti and superphysical senses


    Cross-Tradition Resonances


    **Yoga Sūtra 3.38:** identifies superphysical senses as binding forces on citta

    *Divergence:* Unlike later commentaries that treat them as mere obstacles, this sūtra frames them as potential siddhis
    when controlled


    **Yoga Sūtra 2.1:** establishes the role of vṛtti in binding citta

    *Divergence:* Here the focus shifts from general vṛtti to specific superphysical senses


    **Sāṃkhya Karika 1.4:** defines prakṛti as source of vṛtti

    *Divergence:* The sūtra emphasizes the sensory aspect rather than the elemental composition


    **Yoga Sūtra 3.39:** continues discussion of obstacles to samādhi

    *Divergence:* This sūtra uniquely links the obstacles to the superphysical senses, a nuance expanded in subsequent verses'
- kind: key_terms
  label: Key Terms
  items:
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Superphysical Senses as Obstacles”:
      here, the mind bound by superphysical senses -> not ‘brain software’ or an enemy to smash; the reflecting medium whose
      turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Superphysical Senses as Obstacles”: the fluctuations
      that bind citta -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Superphysical Senses as Obstacles”: the goal of Yoga where
      citta is free from vṛtti -> not trance-entertainment or unconsciousness; graded absorption where subject–object friction
      quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Superphysical Senses as Obstacles”: source of vṛtti
      and superphysical senses -> not pastoral ‘Nature’; the tri-guṇa matrix generating all experience including mind'
  - term: bandhakāraṇa
    definition: 'source-term bandhakāraṇa -> in “Superphysical Senses as Obstacles”: that bind consciousness to a single form
      -> default English flattens the technical work this term does here'
