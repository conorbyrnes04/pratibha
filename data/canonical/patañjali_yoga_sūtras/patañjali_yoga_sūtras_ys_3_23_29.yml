sanskrit_devanagari: 'मैत्रियादिषु बलाः ॥ ३.२३ ॥


  बालेषु हस्थिबालादीनि ॥ ३.२४ ॥


  प्रवृत्तिआलोकनयासात् सूक्ष्मव्यवहितविप्रक्रष्टज्ञानम् ॥ ३.२५ ॥


  भुवनज्ञनं सूर्ये संयमात् ॥ ३.२६ ॥


  चन्द्रे ताराव्यूहज्ञानम् ॥ ३.२७ ॥


  ध्रुवे तदगतिज्ञानम् ॥ ३.२८ ॥


  नाभिकृ काया-व्यूहज्ञानम् ॥ ३.२९ ॥'
sanskrit_iast: 'maitryādiṣu balāni || 3.23 ||


  baleṣu hastibalādīni || 3.24 ||


  pravṛttyālokanyāsāt sūkṣmavyavahitaviprakṛṣṭajñānam || 3.25 ||


  bhuvanajñānaṃ sūrye saṃyamāt || 3.26 ||


  candre tārāvyūhajñānam || 3.27 ||


  dhruve tadgatijñānam || 3.28 ||


  nābhicakre kāyavyūhajñānam || 3.29 ||'
translation_literal: '**3.23** In the realm of benevolence and other virtues, there are forces (balāni).

  **3.24** The strengths are in the hands, arms, and limbs.

  **3.25** You observe the mind’s subtle fluctuations, and the knowledge that is already perfected in the subtle realm becomes
  evident.

  **3.26** By restraining the inner Sun, one gains knowledge of the world.

  **3.27** The moon is the knowledge of the arrangement of the stars.

  **3.28** The knowledge that is fixed is that which is known.

  **3.29** You gain knowledge of the stars by focusing your body’s alignment on the pole star.'
commentary: 'Sūtras 3.23–3.29 form a single argument about the structure of knowledge through saṃyama (disciplined attention).
  The cluster moves from recognizing that universal forces (balāni) operate through the body''s limbs (3.23–3.24), to observing
  the mind''s subtle fluctuations to access perfected knowledge (3.25), to applying this epistemic method to macrocosmic objects—the
  inner Sun, the moon, the pole star—thereby gaining knowledge of the world''s arrangement and motion (3.26–3.29). The underlying
  logic is homological: the same saṃyama that reveals the subtle structure of the mind reveals the subtle structure of the
  cosmos. This is not mysticism but rigorous epistemology grounded in Sāṃkhya metaphysics. In that framework, prakṛti (primordial
  matter) manifests at every scale—gross and subtle, individual and universal—through the same guṇas (qualities). The yogi
  who steadies the citta (mind-stuff) and observes its vṛtti (fluctuations) without identification learns to perceive the
  subtle layer (sūkṣma) where all phenomena cohere. Once that perceptual capacity is refined, the same attention can be directed
  outward to celestial bodies and their laws. The ''inner Sun'' (likely the solar plexus or subtle energy center) and the
  pole star are not poetic ornaments but focal points where the microcosm and macrocosm interpenetrate. By aligning the body''s
  subtle structure with cosmic reference points, the practitioner gains direct knowledge (prajñā) of how prakṛti organizes
  itself at every level. This knowledge is not inferential but immediate, arising from saṃyama itself—the unified hold of
  dhāraṇā (concentration), dhyāna (meditation), and samādhi (absorption). The cluster thus demonstrates that liberation (kaivalya)
  is inseparable from a precise, embodied understanding of how consciousness and matter are woven together across all scales
  of existence.


  Key Terms


  **saṃyama** — The unified discipline of concentration, meditation, and absorption; the method by which the yogi gains direct
  knowledge of subtle and gross phenomena

  **balāni** — Forces or energies; the dynamic powers that animate both the body and the cosmos, accessible through disciplined
  observation

  **sūkṣma** — The subtle realm or subtle layer of manifestation; the domain of perfected knowledge accessible through refined
  perception

  **vṛtti** — Fluctuations or modifications of the mind-stuff (citta); the primary obstacles to direct perception that saṃyama
  subdues


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.29:** Both texts assert that the yogi who has steadied the mind perceives the Self in all beings and all
  beings in the Self—a unified vision arising from disciplined attention. The Gītā''s ''samadṛśaḥ'' (equal-sighted) parallels
  the Yoga Sūtra''s claim that refined perception reveals the homology between microcosm and macrocosm. Divergence: The Gītā
  emphasizes devotion and duty as the path to this vision, while the Yoga Sūtras present saṃyama—a purely technical discipline
  of attention—as the sufficient means, with no necessary reference to bhakti or dharma.

  **Plotinus, Enneads 5.8.9:** Plotinus describes how the soul, by withdrawing into itself and achieving unified consciousness,
  gains immediate knowledge of the intelligible realm and its structure—a non-discursive, direct knowing that mirrors the
  Yoga Sūtra''s claim that observation of subtle fluctuations yields perfected knowledge. Divergence: Plotinus grounds this
  knowledge in the soul''s ascent to the One through contemplation of intelligible forms, whereas Patañjali locates it in
  the precise observation of prakṛti''s subtle manifestations, with no appeal to a transcendent source beyond the cosmos itself.

  **Epictetus, Enchiridion 1:** Both Epictetus and the Yoga Sūtras distinguish between what lies within our control (the discipline
  of attention and action) and what does not (external events), and both argue that mastery of the former yields freedom and
  knowledge. Divergence: Epictetus''s freedom is ethical and rational—the alignment of will with nature''s logos—while the
  Yoga Sūtras'' freedom (kaivalya) is metaphysical: the puruṣa''s recognition of its absolute separation from prakṛti, achieved
  through saṃyama rather than through moral reasoning.'
insight: 'The central claim of this brief aphorism is that the very same energies that animate the world—what the sūtra calls
  ‘balāni’—are divided into two categories: those that act swiftly and those that act'
practice: Align your body so that your gaze rests steadily on the pole star (or its terrestrial equivalent) while you breathe
  evenly, and observe how your mind’s wandering diminishes.
