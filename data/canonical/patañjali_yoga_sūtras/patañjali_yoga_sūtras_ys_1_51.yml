sanskrit_devanagari: तस्यापि निरोधे सर्वनिरोधान् निरबीजः समाधिः
sanskrit_iast: tasyāpi nirodhe sarvanirodhān nirbījaḥ samādhiḥ
translation_literal: When even that [mental activity] ceases, all fluctuations are stilled, and samādhi
  without seed arises.
commentary: 'This sūtra marks the culmination of Patañjali''s progressive map of samādhi states. The verse
  refers back to the preceding discussion of samādhi *with* seed (sabīja-samādhi), where meditation objects
  and subtle mental impressions still structure consciousness. Here, ''that'' (tasya) points to the final
  residue of mental activity—even the subtle witness-consciousness and the refined sense of ''I am meditating.''


  When this too undergoes nirodha (cessation, stilling), ''all fluctuations'' (sarva-nirodha) are extinguished.
  The mind does not blank out; rather, all vṛtti (mental waves) and their seeds (bīja) dissolve. What
  remains is nirbīja-samādhi: seedless absorption. In this state, there is no object of meditation, no
  meditator, no trace of saṃskāra (latent impression) that could sprout future mental activity.


  This is not unconsciousness but the puruṣa (witness-consciousness) abiding in its own nature, free from
  the machinery of prakṛti (matter/mind). The Yoga Sūtras treat this as the final goal: kaivalya, isolation
  and autonomy of the self. It is not annihilation but the cessation of identification with mental content.


  In the Sāṃkhya framework underlying Patañjali''s system, this represents the complete discrimination
  (viveka-khyāti) between puruṣa and prakṛti. The mind''s seed-potential is exhausted; no new vṛtti will
  arise from past conditioning. This is liberation while embodied (jīvan-mukti) or the threshold to it.


  Key Terms


  **nirbīja-samādhi** — Seedless absorption; the highest meditative state in which all mental impressions
  and their generative potential are dissolved, leaving only pure witness-consciousness.

  **nirodha** — Cessation, stilling, or suppression; the gradual quieting of mental fluctuations until
  even the subtle sense of self-as-meditator dissolves.

  **bīja** — Seed; the latent impression or saṃskāra that carries the potential to generate future mental
  activity and rebirth.'
insight: The core claim of this sutra is that the practitioner, by annihilating the very act of cessation
  itself, reaches a samādhi that is unconditioned and devoid of any seed (bīja).
practice: In your next meditation, when you notice the subtle sense of 'I am observing' or 'I am meditating,'
  turn your attention toward that witness itself rather than away from it—let it become transparent to
  itself. Continue until even that reflexive sense of observing dissolves into what remains, without grasping
  or naming what that is.
