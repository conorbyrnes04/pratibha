  items:
  - term: nirodha (निरोध)
    definition: 'ni + √rudh ‘obstruct, restrain’ → cessation/stilling -> in “Samādhi Without Seed”: ‘cancellation’
      (from ni- ‘not’ + roha ‘to rise’) → in Yoga, the cessation of mental fluctuations, distinct from
      the Sāṃkhya notion of ‘cancellation’ of prakṛti’s activity -> not annihilation of mind; settling
      of flux so awareness is no longer hijacked'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Samādhi Without Seed”: here specifically
      the ultimate, seedless absorption that transcends even the act of absorption itself -> not trance-entertainment
      or unconsciousness; graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: nirbīja (निर्बीज)
    definition: 'nir + bīja ‘seedless’ -> in “Samādhi Without Seed”: the highest meditative state in which
      all mental impressions and their generative potential are dissolved, leaving only pure witness-consciousness
      -> not blank nihilism; absorption without residual object-seed, toward ultimate restraint'
  - term: sarvanirodha (सर्वनिरोध)
    definition: 'source-term sarvanirodha -> in “Samādhi Without Seed”: ‘total cessation’ → all vṛtti
      are stopped, not just selective ones -> default English flattens the technical work this term does
      here'
  - term: bīja (बीज)
    definition: '‘seed’ — latent causal potency -> in “Samādhi Without Seed”: the latent impression or
      saṃskāra that carries the potential to generate future mental activity and rebirth -> not metaphor
      for ‘potential’ vaguely; technical seed of kleśa/karma/object in absorption theory'
