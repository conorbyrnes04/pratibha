sanskrit_devanagari: 'स्ठूलस्वरूपसूक्ष्माण्वयार्थवत्त्वसंयमाद् भूतजयः ॥ ३.४४ ॥


  ततो णिमादिप्रादुर्भावः काया-संपत् तद्धर्मानभिगातः च ॥ ३.४५ ॥


  रूपलावण्यबलवज्रसंधनानन्त्वानी काया संपत ॥ ३.४६ ॥


  ग्रहणस्वरूपस्मिताञ्वयार्थवत्तवासंयमाद् इंद्रियजयः ॥ ३.४७ ॥


  ततो मनोजवित्वं विकरणभावः प्रधानजयश् च ॥ ३.४८ ॥


  सत्त्वपुरुषाञ्‍यताक्षातिमात्रस्य सर्वाभावाधिष्ठातृत्वं सर्वज्ञातृत्वं च ॥ ३.४९ ॥'
sanskrit_iast: 'sthūlasvarūpasūkṣmānvayārthavattvasaṃyamād bhūtajayaḥ || 3.44 ||


  tato ''ṇimādiprādurbhāvaḥ kāyasaṃpat taddharmānabhighātaś ca || 3.45 ||


  rūpalāvaṇyabalavajrasaṃhananatvāni kāyasaṃpat || 3.46 ||


  grahaṇasvarūpāsmitānvayārthavattvasaṃyamād indriyajayaḥ || 3.47 ||


  tato manojavitvaṃ vikaraṇabhāvaḥ pradhānajayaś ca || 3.48 ||


  sattvapuruṣānyatākhyātimātrasya sarvabhāvādhiṣṭhātṛtvaṃ sarvajñātṛtvaṃ ca || 3.49 ||'
translation_literal: '**3.44** Through constraint (saṃyama) on the gross form, intrinsic nature, subtlety, interconnection,
  and purposiveness of matter—mastery over the elements (bhūta).

  **3.45** From that arise the powers of minuteness and the rest; the body''s perfection (kāyasaṃpat), and the unobstructed
  flow of its properties.

  **3.46** Beauty, grace, strength, and adamantine solidity—these constitute the body''s perfection.

  **3.47** Through constraint on the nature of grasping, the sense of ''I'', interconnection, and purposiveness—mastery over
  the senses (indriya).

  **3.48** From that come swiftness of mind, action without instruments, and mastery over nature itself (pradhāna).

  **3.49** For one who perceives the distinction between sattva and the Self alone—sovereignty over all states of being and
  omniscience.'
commentary: 'Sūtras 3.44–3.49 trace a single arc: the body''s subtle purification (sūkṣma-śuddhi) becomes the instrument through
  which prakṛti''s binding force is reversed, culminating in the recognition that all change belongs to citta alone, while
  puruṣa remains untouched. The sequence moves from external mastery (3.44–3.46) to internal revelation (3.47–3.49).


  The opening three sūtras establish that when saṃyama penetrates the body''s subtle layers—not its gross form but its energetic
  and elemental substrate—the practitioner gains dominion over existence itself (bhūta-jaya). This is not metaphorical. In
  Sāṃkhya-Yoga, prakṛti manifests as the five gross elements (bhūtas) and their subtle counterparts (tanmātras); the body
  ordinarily obeys prakṛti''s momentum. But 3.45 reveals the mechanism: subtle element and gross body are mutually immediate
  (pradurbhāva), each conditioning the other in real time. By saṃyama on this reciprocal binding, one stabilizes rather than
  ruptures it—dharmas (cosmic principles) elevate this binding into conscious alignment. The body then becomes indestructible
  (akṣara), its form, ornament, and strength unified not through ego but through prāṇic integrity. Obstacles dissolve not
  because the body transcends matter but because the practitioner ceases to be entangled in the body''s apparent autonomy.


  The turn at 3.47 is decisive. The mind''s smile (citta-prasāda: lucidity, not sentiment) aligns with sense-purpose (indriya-artha)
  by conquering the senses themselves—a paradox resolved only by recognizing that true mastery means ceasing to resist or
  grasp. From this stance, 3.48 reveals the siddhis: subtle perception (sūkṣma-dṛṣṭi), differentiation (viveka), and the principal
  victories emerge not as acquisitions but as natural disclosures.


  The final sūtra (3.49) is the keystone. All transformation—all vṛtti, all state-change—belongs to sattva-puruṣa''s apparent
  interplay, yet this interplay is only the mind''s fluctuation. Puruṣa itself is unchanging, all-knowing (sarva-jña), and
  the basis of all states precisely because it is untouched by them. The body''s purification, the senses'' mastery, the siddhis''
  emergence—all are movements within prakṛti''s sattva-guna, now transparent to puruṣa''s witnessing. Kaivalya is not escape
  from the body but the body''s complete clarification into a medium of puruṣa''s self-recognition.


  Key Terms


  **sūkṣma-śuddhi** — Purification of subtle aspects; the refinement of the body''s energetic and elemental substrate through
  saṃyama, enabling liberation from prakṛti''s binding.

  **pradurbhāva** — Immediate manifestation or effect; the instantaneous mutual conditioning between subtle element and gross
  body, the mechanism by which saṃyama gains leverage over prakṛti.

  **citta-prasāda** — Lucidity or serene clarity of mind; the state in which mental fluctuation ceases and puruṣa''s witnessing
  becomes evident.

  **sattva-puruṣa** — The apparent union of prakṛti''s sattva-guna (luminous principle) and puruṣa (consciousness); the source
  of all phenomenal change, yet ultimately illusory from puruṣa''s standpoint.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.29:** Both texts assert that the yogi perceives the Self in all beings and all beings in the Self through
  disciplined practice; the body becomes transparent to unified consciousness. Divergence: The Gītā emphasizes devotion and
  action-in-the-world as the path, whereas the Yoga Sūtras isolate saṃyama as the technical means; the Gītā''s puruṣa remains
  engaged, Patañjali''s moves toward kaivalya (isolation).

  **Plotinus, Enneads 4.8 (On the Descent of the Soul):** Both traditions describe the soul''s apparent entanglement in matter
  as a binding that can be reversed through disciplined attention; the body becomes a vehicle for recognition rather than
  a prison. Divergence: Plotinus emphasizes the soul''s inherent divinity and return to the One through intellectual contemplation;
  Patañjali''s puruṣa is eternally free and requires only the removal of ignorance (avidyā), not ascent.

  **Dhammapada 183 (Pali Canon):** The Buddha teaches that mastery over oneself is greater than mastery over others; both
  texts locate true conquest in the reversal of craving and the clarification of perception. Divergence: Buddhism denies a
  permanent Self (anattā) while Yoga Sūtras posit puruṣa as eternal witness; the Buddhist path aims at cessation (nirvāṇa),
  Yoga at kaivalya (isolation of consciousness from prakṛti).'
insight: The claim that the body itself, through the integration of rupa (form), lāvaṇa (ornament), and bala (strength), can
  generate the dissolution of all impediments, is a radical re‑orientation of the trad
practice: You focus your attention on the subtle sensations within your body, consciously mastering the ego sense and aligning
  the purpose of your sense organs, thereby exercising disciplined perception.
