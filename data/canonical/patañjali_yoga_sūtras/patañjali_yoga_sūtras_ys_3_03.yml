title: Conscious Absorption
unit_type: sutra
sanskrit_devanagari: तद् एवार्तमात्रनिर्भासं स्वरूपशून्यम् इव समादिः
sanskrit_iast: tad evārthamātranirbhāsaṃ svarūpaśūnyam iva samādhiḥ
translation_literal: The same, when conscious only of the object, is a samādhi that is empty of its own form.
commentary: 'The passage asserts that true samādhi is not a passive trance but a conscious absorption in which the mind forgets
  the act of thinking and becomes the very object of thought. This claim situates samādhi within the Sāṃkhya framework: puruṣa
  (consciousness) and prakṛti (matter) are distinct, yet in samādhi the puruṣa appears to dissolve into the object, creating
  a unified state. The Dvivedi commentary’s emphasis on the second stage—becoming the object—mirrors the Yogic notion of “pratyāhāra”
  (withdrawal) leading to “pratyāhāra‑samādhi,” where the mind’s focus is internalized. The existential implication is that
  one can transcend ordinary duality by fully identifying with the object, thereby temporarily suspending the self‑object
  distinction. This is a powerful tool for meditation, allowing the practitioner to experience the world as a single, unmediated
  reality. The passage also warns against mere passive trance, aligning with the broader Yoga aim of active, disciplined practice
  rather than accidental absorption. Thus, the text offers a precise model of samādhi that balances the Sāṃkhya dualism with
  the Yogic goal of unity, providing a concrete method for achieving experiential insight.


  Key Terms


  **samādhi (समाधि)** — samādhi (IAST) -> समादिः (Devanagari) -> etymology: ‘to be’ + ‘to be’ (sam + ādi) -> tradition meaning:
  a state of meditative absorption where the mind is united with the object; default translation ‘concentration’ misses the
  experiential unity


  **purusha (पुरुष)** — purūṣa (IAST) -> पुरुष (Devanagari) -> etymology: ‘person’ -> tradition meaning: pure consciousness,
  the subject; default translation ‘person’ overlooks its role as the unchanging witness


  **prakriti (प्रकृति)** — prakṛti (IAST) -> प्रकृति (Devanagari) -> etymology: ‘nature’ -> tradition meaning: material reality,
  dynamic principle; default translation ‘nature’ omits its generative, mutable character


  Cross-Tradition Resonances


  **Yoga Sūtra 3.2:** Both 3.2 and 3.3 describe samādhi as a state of absorption where the mind forgets the act of thinking.

  *Divergence:* 3.2 emphasizes the forgetting of the object, whereas 3.3 emphasizes becoming the object, showing a shift from
  passive to active absorption


  **Bhasya of Shankara on Yoga Sūtra 3.3:** Shankara’s commentary parallels Dvivedi’s focus on the second stage, underscoring
  the union of mind and object.

  *Divergence:* Shankara frames it as the dissolution of the mind’s ego, while Dvivedi stresses the experiential ‘becoming’
  aspect


  **Bhaṭṭa’s Yogabhāṣya 3.3:** Both texts describe samādhi as a state where the mind is empty of its own form.

  *Divergence:* Bhaṭṭa adds the notion of ‘svarūpaśūnyam’ (emptiness of form) as a prerequisite, whereas the current sutra
  presents it as a consequence


  **Māṇḍūkya Upanishad 3.3:** Both mention the idea of forgetting the act of thinking.

  *Divergence:* The Upanishad speaks of the self’s realization, while the Yoga Sūtra focuses on the object of meditation'
insight: The passage asserts that true samādhi is not a passive trance but a conscious absorption in which the mind forgets
  the act of thinking and becomes the very object of thought.
practice: You focus your awareness solely on the object of your meditation, letting go of all thoughts about the act of thinking,
  and allow yourself to become fully absorbed in that object.
