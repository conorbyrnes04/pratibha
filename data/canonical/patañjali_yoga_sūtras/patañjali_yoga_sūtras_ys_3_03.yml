sanskrit_devanagari: तद् एवार्तमात्रनिर्भासं स्वरूपशून्यम् इव समादिः
sanskrit_iast: tad evārthamātranirbhāsaṃ svarūpaśūnyam iva samādhiḥ
translation_literal: That same absorption—shining forth as the object alone, empty of its own form as
  it were—is samādhi.
commentary: 'This sūtra (I.3) defines the threshold of true samādhi by describing what happens when the
  mind becomes perfectly transparent to its object. The phrase ''tad eva'' (that same) refers back to
  the preceding sūtra''s description of yoga as the stilling of mental fluctuations (cittavṛtti-nirodha).
  When fluctuations cease, what remains is not blankness but a radical clarity in which subject and object
  collapse into unified perception.


  ''Arthamātra-nirbhāsaṃ'' means the object shines forth alone—unrefracted by thought, memory, or the
  seer''s conceptual overlay. The mind becomes a perfect medium, like polished glass through which light
  passes without distortion. Simultaneously, ''svarūpa-śūnyam iva''—the mind''s own form becomes as if
  empty. This does not mean the mind ceases to exist, but that its separate identity dissolves. The ''iva''
  (as it were) is crucial: the emptiness is apparent, not absolute annihilation.


  Within the Yoga–Sāṃkhya framework, this describes the moment when puruṣa (the witnessing consciousness)
  recognizes itself as distinct from prakṛti (nature/mind), yet the mind has become so refined and one-pointed
  that it no longer asserts itself as a separate entity. The object is known in its essence, stripped
  of mental coloration. This is the gateway to higher absorptions where even the object-sense eventually
  dissolves.


  The verse distinguishes samādhi from mere concentration (dhāraṇā): in concentration, effort and duality
  remain; in samādhi, the effort dissolves and only the radiance of knowing persists.


  Key Terms


  **samādhi** — Absorption; the state in which the mind becomes unified with its object, subject and object
  merge into a single luminous knowing.

  **arthāmātra-nirbhāsa** — The object shining forth alone; the object appearing in its pure form, uncolored
  by mental modification or the seer''s conceptual filters.

  **svarūpa-śūnya** — Empty of its own form; the mind''s separate identity dissolves, leaving only transparent
  awareness without self-assertion.'
insight: The passage asserts that true samādhi is not a passive trance but a conscious absorption in which
  the mind forgets the act of thinking and becomes the very object of thought.
practice: Choose a simple object—a candle flame, a smooth stone, or a single word like 'om'. Sit comfortably
  and gaze or mentally hold the object for 5–10 minutes without looking away or allowing the mind to wander.
  Do not think about the object; do not narrate it. Simply allow it to be present. When the mind drifts,
  gently return attention without strain or self-judgment. Over weeks, you may notice moments when the
  boundary between 'you watching' and 'the thing watched' softens—when the flame seems to glow by itself,
  or the word resonates without your effort. These brief instants are glimpses of the transparency Patañjali
  describes. Do not grasp at them; simply observe and return to the practice. This is the foundation of
  samādhi.
