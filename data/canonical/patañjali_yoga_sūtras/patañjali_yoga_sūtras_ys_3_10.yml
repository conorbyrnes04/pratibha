sanskrit_devanagari: तस्य प्रशान्तवाहितः संस्कारात्
sanskrit_iast: tasya praśāntavāhitā saṃskārāt
translation_literal: Through the repeated impressions of that [practice], its flow becomes tranquil.
commentary: 'This sūtra belongs to the sequence on samādhi and the stabilization of mind through practice
  (abhyāsa). Patañjali has just described how the mind''s natural tendency toward distraction and oscillation
  can be countered by sustained, devoted effort over a long period without interruption. Here he introduces
  the mechanism by which this happens: saṃskāra, the Sanskrit term for latent impression or groove worn
  into consciousness through repetition.


  The word praśāntavāhitā means a flow that has become calm, settled, or tranquil—the vāhitā (current
  or stream) is now praśānta (peaceful, stilled). This is not a sudden transformation but an organic result
  of saṃskāra, the accumulated weight of practice. Each time the practitioner returns to the object of
  meditation, to breath awareness, or to the restraint of mental fluctuations (cittavṛtti), a subtle impression
  is deposited. Over time, these impressions accumulate and create a new default pathway in consciousness—one
  oriented toward steadiness rather than distraction.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that consciousness (puruṣa) is inherently
  unchanging, but the mind-stuff (citta) is malleable and shaped by repeated action. The sūtra teaches
  that transformation is not mystical but mechanical: it follows the law of habit and conditioning. What
  once required effort—turning attention inward, holding focus—gradually becomes the mind''s natural inclination.
  The tranquility is not imposed from outside but emerges from the texture of practice itself.


  This sūtra is also a realistic teaching: it promises no instant enlightenment, but rather a gradual
  rewiring of mental habit through consistent, humble repetition. It speaks directly to the modern practitioner
  who may feel discouraged by slow progress, reminding them that each session, each breath, each moment
  of restraint is leaving an impression that compounds over time.


  Key Terms


  **saṃskāra** — Latent impression, groove, or conditioning left in consciousness by repeated action;
  the mechanism by which habit becomes second nature.

  **praśānta** — Tranquil, calm, peaceful, stilled; the quality of mind when disturbance has subsided.

  **vāhitā** — Flow, current, or stream; here referring to the continuous movement or momentum of mental
  activity.'
insight: The sūtra asserts that the mind’s impressions, when they are cultivated with regularity, attain
  a steady flow that culminates in the highest samādhi.
practice: Each time your mind wanders during any activity today, notice the moment you return to what
  you're doing—that micro-return itself is the groove being worn. By day's end, you will have made dozens
  of these tiny returns; feel how the path grows more familiar, more worn smooth by your own footsteps.
