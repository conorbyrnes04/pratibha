unit_label: Impressions Become Steady
title: Impressions Become Steady
unit_type: sutra
sanskrit_devanagari: तस्य प्रशान्तवाहितः संस्कारात्
sanskrit_iast: tasya praśāntavāhitā saṃskārāt
translation_literal: Its flow becomes steady by impressions.
commentary: 'The sūtra asserts that the mind’s impressions, when they are cultivated with regularity, attain a steady flow
  that culminates in the highest samādhi. This claim foregrounds the Sāṃkhya notion that puruṣa, the observing consciousness,
  is distinct from prakṛti, the material mind. The sūtra’s focus on the habitual rise of impressions (saṃskāra) underscores
  the idea that the mind’s activity is not random but patterned, and that such patterned activity can be directed toward liberation.
  The contested move here is the implication that steady impressions alone suffice for samādhi, a point that Dvivedi interprets
  as the mind being “annihilated” when impressions are fully integrated. In the broader Yoga tradition, this aligns with the
  emphasis on systematic practice (prāṇāyāma, dhāraṇā) to stabilize the mind. Yet, unlike the more rigorous yogic practices
  that involve external disciplines, this sūtra suggests an internal, habitual cultivation of impressions as the primary vehicle.
  The existential application is clear: by consciously repeating and reinforcing specific impressions, one can transform the
  mind’s restless fluctuations into a stable, meditative state, thereby moving toward liberation. Dvivedi’s commentary, which
  speaks of annihilation and permanence, reflects the ultimate goal of dissolving the mind’s activity into the unchanging
  puruṣa, resonating with the Sāṃkhya view that liberation is achieved when prakṛti is fully subsumed by puruṣa.


  The sūtra’s brevity belies a profound methodological insight: the mind’s habitual patterns, when made steady, become the
  very medium through which the observer (puruṣa) can disengage from the fluctuations of prakṛti. This is a subtle but powerful
  claim that situates the practice of steady impressions at the core of yogic realization, a claim that has been both embraced
  and contested within the Yoga canon.


  Key Terms


  **saṃskāra (संस्कार)** — from Sanskrit ‘to form’; in Sāṃkhya, the latent impressions that shape prakṛti; the translation
  ‘impression’ misses its formative, conditioning role


  **samādhi (समाधि)** — from ‘to put together’; in Yoga, the highest meditative absorption where puruṣa and prakṛti appear
  one


  **puruṣa (पुरुष)** — Sāṃkhya’s pure consciousness; the observer, distinct from prakṛti; the translation ‘self’ often obscures
  its ontological primacy


  **prakṛti (प्रकृति)** — Sāṃkhya’s material nature; the dynamic, evolving mind-matter; ‘nature’ as used in English omits
  its active, generative quality


  Cross-Tradition Resonances


  **Yoga Sūtra 3.10, 3.11:** Both sūtras emphasize the role of habitual impressions in achieving samādhi, mirroring the structural
  pattern of ‘steady flow’ leading to liberation.

  *Divergence:* While 3.10 focuses on the steadying of impressions, 3.11 introduces the concept of ‘purity’ (śuddhi) as a
  prerequisite, indicating a progressive deepening rather than a single-step attainment


  **Yoga Sūtra 1.1:** The opening sūtra’s claim that puruṣa is unchanging parallels the claim that steady impressions lead
  to samādhi, both underscoring the importance of constancy.

  *Divergence:* 1.1 presents puruṣa as inherently constant, whereas 3.10 treats constancy as an achieved state through practice


  **Bhaṭṭa’s Commentary on Yoga Sūtra 3.10:** Bhaṭṭa expands on the need for ‘repeated rising’ of impressions, echoing the
  sūtra’s emphasis on habit.

  *Divergence:* Bhaṭṭa adds the requirement of ‘sustained effort’ (śrama), suggesting that mere steadiness is insufficient
  without active effort'
insight: The sūtra asserts that the mind’s impressions, when they are cultivated with regularity, attain a steady flow that
  culminates in the highest samādhi.
practice: You repeatedly bring your attention to the same mental impression, allowing it to rise often enough that it becomes
  a steady, habitual pattern in your mind.
