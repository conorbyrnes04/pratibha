practice: When you next make a decision, pause and notice the gap between your intention and the moment
  your body begins to move—then deliberately shrink it by half through one breath. Do this three times
  today, each time whispering 'swift mind' as the lag dissolves, until intention and action become nearly
  simultaneous.
