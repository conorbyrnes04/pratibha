  body: Thereafter, the mind’s subtle power of perception, the state of differentiation, and the principal
    victories become evident.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that once the mind’s subtle power of perception (manojavitva) is harnessed,
    the very process of differentiation (vikaraṇabhāva) and the ensuing principal victories (pradhānajaya)
    naturally unfold. This claim foregrounds the Yoga school’s epistemic priority: the mind, when disciplined,
    is the primary instrument of liberation. The contested move here is the implicit causal link between
    perception and victory; while Sāṃkhya treats prakṛti’s differentiation as autonomous, Yoga posits
    that disciplined perception can preempt and direct this process. The sūtra thus bridges the two systems,
    suggesting that the mind’s mastery can steer prakṛti’s unfolding toward samādhi. In practice, this
    translates to focused attention on the subtle sensations within the body, aligning with the Satchidananda
    emphasis on “body anchor.” By mastering the ego sense and the purpose of the sense organs, one cultivates
    a disciplined perception that yields the principal victories—inner stillness, clarity, and ultimately
    liberation. The sūtra’s structure—mind’s power, differentiation, victory—mirrors the triadic progression
    of Yoga: pratyahara, dharana, and samādhi, underscoring the existential applicability of disciplined
    perception as a gateway to liberation.


    Key Terms


    **manojavitva (मनोजवित्व)** — etymology: ‘mind’s subtle power’ -> Sāṃkhya tradition: subtle mind (citta)
    as a distinct faculty -> Yoga: disciplined perception as the means to control prakṛti’s differentiation


    **vikaraṇabhāva (विकरणभाव)** — etymology: ‘state of differentiation’ -> Sāṃkhya: prakṛti’s inherent
    differentiation -> Yoga: differentiation as a process that can be guided by disciplined perception


    **pradhānajaya (प्रमुखजय)** — etymology: ‘principal victories’ -> Sāṃkhya: ultimate liberation (moksha)
    as the final victory -> Yoga: the culmination of disciplined perception leading to samādhi and liberation


    Cross-Tradition Resonances


    **Yoga Sūtra 3.48:** mind’s power of perception precedes differentiation and victory

    *Divergence:* Sāṃkhya treats differentiation as autonomous; Yoga posits it as contingent on disciplined
    perception


    **Yoga Sūtra 2.23:** pratyahara (withdrawal) leads to dharana (concentration) and then samādhi

    *Divergence:* 3.48 places mind’s power before these stages, suggesting a more proactive role


    **Yoga Sūtra 4.1:** samādhi as the ultimate victory

    *Divergence:* 3.48 introduces ‘principal victories’ earlier, implying intermediate victories within
    the process'
