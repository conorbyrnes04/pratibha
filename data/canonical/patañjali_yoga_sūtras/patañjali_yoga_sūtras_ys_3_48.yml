sanskrit_devanagari: ततो मनोजवित्वं विकरणभावः प्रमुखजयः च
sanskrit_iast: tato manojavitvaṃ vikaraṇabhāvaḥ pradhānajayaś ca
translation_literal: From that, there arises swiftness of mind, freedom from dependence on the sense organs,
  and mastery over the primary material nature.
commentary: 'This sūtra (II.45) describes the fruits of perfecting the niyamas, particularly saucha (purity).
  When the practitioner has established genuine internal and external cleanliness, three capacities unfold
  together.


  First, manojavitva—the mind moves with the speed of thought itself, unobstructed by the usual lag between
  intention and cognition. This is not mere quickness but a fundamental alignment of mental process with
  pure awareness.


  Second, vikaraṇabhāva—the yogi no longer depends on the sense organs (indriyas) as the sole gateway
  to knowledge. Perception becomes direct, not filtered through the usual sensory apparatus. This does
  not mean rejecting the senses but transcending their limitations; knowledge arises independent of their
  mediation.


  Third, pradhānajaya—mastery over pradhāna, the primary material nature (prakṛti in its undifferentiated
  state). This is not magical control but the natural consequence of ceasing to be enslaved by material
  conditioning. The yogi can work with the forces of nature rather than being driven by them.


  These three capacities are not separate achievements but facets of a single shift: the mind, freed from
  impurity and fragmentation, operates at its true speed, perceives without sensory distortion, and aligns
  with the deeper laws of existence rather than resisting them. This is the foundation for the higher
  limbs of yoga.


  Key Terms


  **manojavitva** — Swiftness or velocity of mind; the capacity for thought to move instantaneously without
  lag or obstruction.

  **vikaraṇabhāva** — Freedom from dependence on the sense organs; the state of perceiving and knowing
  without relying on the indriyas as intermediaries.

  **pradhāna** — Primary material nature; prakṛti in its undifferentiated, causal form; the root substance
  from which all manifest reality unfolds.'
insight: The sūtra asserts that once the mind’s subtle power of perception (manojavitva) is harnessed,
  the very process of differentiation (vikaraṇabhāva) and the ensuing principal victories (pradhānajaya)
