unit_label: The Mind Is Known; the Puruṣa Is the Knower
title: The Mind Is Known; the Puruṣa Is the Knower
unit_type: sutra_cluster
sutra_range: 4.18-4.21
sanskrit_devanagari: 'सदा ज्ञाताश् चित्तवृत्तयः तत् प्रभोः पुरुषस्य अपरीणामित्वात् ॥ ४.१८ ॥


  न तत् स्वाभासं दृश्यत्वात् ॥ ४.१९ ॥


  एकसमये चोभयानवधारणम् ॥ ४.२० ॥


  चितान्तरदृश्ये बुद्धिबुद्धेर अतिप्रसङ्गः स्मृतिसंकरः च ॥ ४.२१ ॥'
sanskrit_iast: 'sadā jñātāś cittavṛttayas tatprabhoḥ puruṣasyāpariṇāmitvāt || 4.18 ||


  na tat svābhāsaṃ dṛśyatvāt || 4.19 ||


  ekasamaye cobhayānavadhāraṇam || 4.20 ||


  cittāntaradṛśye buddhibuddher atiprasaṅgaḥ smṛtisaṃkaraś ca || 4.21 ||'
translation_literal: '**4.18** The mind''s fluctuations are always known to their master, the Purusha,
  because he is unchanging (apariṇāmitvāt).

  **4.19** It does not shine by its own light, being an object of perception (dṛśyatva).

  **4.20** Nor can both be apprehended in a single moment.

  **4.21** If mind were perceived by another mind, there would follow an infinite regress of intellects
  perceiving intellects (buddhibuddher atiprasaṅga), and confusion of memory (smṛti-saṃkara).'
commentary: 'These four sūtras form a single argument about the ontological and epistemological structure
  that makes liberation possible. Patañjali moves from the unchanging witness (4.18) through the mind''s
  objecthood (4.19), the impossibility of simultaneous subject-object perception (4.20), to the danger
  of intersubjective confusion (4.21)—establishing that the Puruṣa''s freedom depends on recognizing the
  mind as fundamentally *not itself*.


  The pivot is radical: the mind (citta) is prakṛti, inert matter. It appears to think, to perceive, to
  be a self, but this appearance is precisely what binds. The Puruṣa—unchanging, non-acting, eternally
  aware—witnesses all vṛtti (fluctuations) without being altered by them. This is not metaphor. If the
  mind were self-luminous (4.19), it would be its own subject; but it is not. It is always an object—perceived
  by the Puruṣa. The mind cannot be both subject and object in a single moment (4.20) because it is fundamentally
  object. Only the Puruṣa is subject; only the Puruṣa is self-luminous.


  This distinction collapses the ego-illusion at its root. What we call "I" is the mind identifying with
  its own contents. The moment one recognizes that the mind is an object *always already* perceived by
  an unchanging witness, the identification loosens. The mind becomes transparent—a tool, not a self.


  Sūtra 4.21 darkens the picture: when minds interact, memory accumulates across persons, creating a vast
  tangle of association that obscures the simple fact of witnessing. This is why isolation (kaivalya)
  is not mere withdrawal but clarity—the Puruṣa''s aloneness (kevala) is its freedom, precisely because
  the mind''s entanglement with other minds is the machinery of bondage. The path forward is not to perfect
  the mind but to see through it, to rest as the unchanging knower while prakṛti—including the mind—continues
  its dance.


  Key Terms


  **Puruṣa** — The unchanging, non-acting witness-consciousness; the true self, eternally free and self-luminous,
  distinct from all material transformation.

  **Citta** — The mind-stuff; the subtle material instrument of perception and thought, always an object
  of the Puruṣa''s awareness, never a subject.

  **Vṛtti** — Mental fluctuation or modification; the waves of thought, emotion, and perception that arise
  in the citta and are witnessed by the Puruṣa.

  **Kaivalya** — Liberation; the Puruṣa''s recognition of its absolute aloneness and freedom from identification
  with prakṛti and citta.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.25 (Kṛṣṇa on the Ātman):** Both texts assert an unchanging, non-acting witness-self
  that observes the body-mind complex without being touched by its changes. The Gītā''s ''ātmā is eternal,
  immutable'' parallels the Puruṣa''s unchanging nature in 4.18. Divergence: The Gītā emphasizes duty
  (dharma) and action in the world as the path; Yoga Sūtra 4.21 suggests that intersubjective entanglement
  through memory is itself a source of confusion, implying withdrawal or at least non-identification is
  primary.

  **Plotinus, Enneads V.3.8 (The One and the Intellect):** Plotinus describes a transcendent principle
  that ''sees without seeing'' and remains unchanged while all lower levels of reality emanate from it.
  The Puruṣa''s unchanging witnessing parallels this non-acting, non-affected source. Divergence: Plotinus''s
  system is emanationist and hierarchical; Yoga Sūtra posits a strict dualism (Puruṣa and prakṛti) with
  no causal flow between them—the Puruṣa does not emanate the mind; they are eternally separate.

  **Epictetus, Enchiridion 1 (What is and is not in our control):** Both texts distinguish sharply between
  what belongs to the self (the witnessing faculty) and what does not (external events, bodily sensations,
  mental states). Epictetus''s ''some things are up to us, others are not'' mirrors the Puruṣa-citta distinction.
  Divergence: Epictetus locates freedom in right judgment and assent within the mind itself; Yoga Sūtra
  locates it in the Puruṣa''s complete non-identification with the mind, not in the mind''s correct use.'
insight: The central claim of this sutra is that the act of one mind perceiving another’s mind generates
  an unbounded chain of mental associations, thereby undermining the possibility of clear, stable remembra
practice: Observe your thoughts in a single moment; note that each thought is either the perceiver or
  the perceived, but never both—this awareness steadies your mind for deeper concentration.
