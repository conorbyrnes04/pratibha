  items:
  - term: saṃyama (संयम)
    definition: 'sam-√yam ‘hold together’ → the triad dhāraṇā-dhyāna-samādhi as one -> in “Purification
      of the Body’s Subtle Aspect”: in Yoga, the disciplined control of mind and body -> not generic self-control;
      technical confluence that yields prajñā and siddhis'
  - term: svarūpa (स्वरूप)
    definition: 'sva + rūpa ‘own form’ -> in “Purification of the Body’s Subtle Aspect”: The body, when
      its subtle aspects are purified, conquers all existence. -> not personality essence; the Seer’s
      standing in itself when vṛtti quiet'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Purification of the Body’s Subtle
      Aspect”: in Sāṃkhya, the mental modifications that obscure pure consciousness -> not ‘bad thoughts’
      only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Purification of the Body’s
      Subtle Aspect”: in Yoga, the observer distinct from prakṛti -> not ‘person’ as social self; the
      unchanging witness distinct from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Purification of the Body’s Subtle
      Aspect”: in Sāṃkhya, the dynamic, evolving base of all phenomena -> not pastoral ‘Nature’; the tri-guṇa
      matrix generating all experience including mind'
