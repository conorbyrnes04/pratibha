title: Purification of the Body’s Subtle Aspect
unit_type: sutra
sanskrit_devanagari: स्ठूलस्वरूपसूक्ष्माण्वयार्थवत्त्वसंयमाद् भूतजयः
sanskrit_iast: sthūlasvarūpasūkṣmānvayārthavattvasaṃyamād bhūtajayaḥ
translation_literal: Through saṃyama on the gross form, the subtle nature, the sequence of transformation,
  the purpose, and the essential reality—mastery over the elements is attained.
commentary: 'This sūtra describes a graduated method of concentration (saṃyama—the unified practice of
  dhāraṇā, dhyāna, and samādhi) applied to the five elements (bhūta) in their hierarchical manifestation.
  Rather than attempting direct control of gross matter, the yogi traces each element backward through
  its layers of subtlety.


  The progression unfolds as follows: sthūla-svarūpa (the gross, visible form—earth as solid, water as
  liquid, fire as heat, air as wind, space as void); sūkṣma (the subtle template or tanmātra underlying
  each element); anvaya (the causal sequence or lineage—how each element emerges from and depends upon
  the previous one in the cosmic unfoldment); artha-vattva (the purposive principle—why each element exists,
  its functional role in manifestation); and the final layer, the essential reality (tattva)—the pure
  principle itself, prior to differentiation.


  By concentrating progressively through these layers—not forcing the gross element to obey, but understanding
  its subtle architecture—the yogi gains bhūta-jaya: not dominion through will alone, but mastery through
  intimate knowledge of how each element actually functions. This is consonant with Sāṃkhya metaphysics:
  control arises from direct perception of prakṛti''s (nature''s) own structure.


  This is not magical manipulation but refined perception and alignment with natural law. The yogi becomes
  transparent to the element''s own intelligence.


  Key Terms


  **saṃyama** — The unified practice of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi)
  applied to a single object or principle.

  **bhūta** — The five gross elements (earth, water, fire, air, space) and their subtle causal templates
  (tanmātra).

  **tattva** — The essential principle or fundamental reality underlying manifest phenomena; in Sāṃkhya,
  one of the 25 categories of existence.'
insight: The central claim of this sutra is that the body’s subtle qualities, once aligned with the principle
  of restraint (saṃyama), become capable of transcending the entire realm of being.
practice: 'Choose one element—begin with earth (solidity). Sit comfortably and bring attention to a solid
  object before you (a stone, a piece of wood). First, observe its gross form (sthūla-svarūpa): color,
  texture, weight, shape. Hold this for 1–2 minutes. Then shift your attention inward to the subtle template
  (sūkṣma)—the principle of solidity itself, independent of this particular object. Feel that quality
  of density and support within your own body (bones, muscles). Next, contemplate the sequence (anvaya):
  how did this solidity arise? From what subtler principle? Trace it back to space, to potential. Then
  ask: what is the purpose (artha) of earth-element in nature and in my body? Stability, grounding, form-giving.
  Finally, rest in the essential principle (tattva) itself—the pure quality of earthness, prior to any
  form. Spend 2–3 minutes in this deepest layer. Practice this daily for one week with earth; then move
  to water, fire, air, and space in turn. This is not visualization but progressive refinement of attention
  through the element''s own nature.'
