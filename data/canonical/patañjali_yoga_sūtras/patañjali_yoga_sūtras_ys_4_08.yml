  body: तसत् तद्विपाकानुगुणानाम् एवाभिव्यक्तिर् वासनानाम्
- kind: iast
  label: IAST
  body: tatas tadvipākānuguṇānām evābhivyaktir vāsanānām
- kind: translation
  label: Pratibha Translation
  body: These vasanas, for which favorable conditions (vipāka) exist, are the sole manifestations (abhivyakti).
- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that manifestation is contingent on favorable conditions, not an inherent property
    of vasanas. It claims that only those subconscious impressions that find the right combination of
    gunas and circumstances will express themselves in a particular birth. This is a contested move in
    the Yoga tradition, because some commentators argue that vasanas have an autonomous power to manifest
    regardless of external conditions. In the Sāṃkhya framework, however, the interplay of prakṛti’s gunas
    (sattva, rajas, tamas) determines the potentiality of each vasana; without the appropriate anuguṇa,
    the vasana remains latent. The sutra’s emphasis on “evābhivyaktir” underscores the exclusivity of
    manifestation: it is not a passive unfolding but an active expression that requires the alignment
    of internal and external factors. Practically, this means that one must cultivate awareness of the
    subtle conditions that enable a particular vasana to surface, thereby transforming latent potential
    into conscious experience. By recognizing the specific gunic milieu that nurtures a vasana, a practitioner
    can deliberately influence which impressions manifest, turning the mind into a disciplined instrument
    of self‑realization.


    Key Terms


    **vasana (वासना)** — vasana (लत्) -> latent impression; in Sāṃkhya, a conditioned potential; default
    translation ''desire'' misses its role as a conditioned causal factor.


    **vipaka (विपाक)** — vipaka (संज्ञा) -> fruition; in Yoga, the result of a vasana acting under favorable
    gunas; default ''fruit'' ignores its causal, conditioned nature.


    **guna (गुण)** — guna (संज्ञा) -> quality; in Sāṃkhya, the three gunas (sattva, rajas, tamas) that
    shape prakṛti; default ''quality'' omits their dynamic generative function.


    **abhivyakti (अभिव्यक्ति)** — abhivyakti (संज्ञा) -> manifestation; in Yoga, the act of a vasana becoming
    conscious; default ''expression'' fails to convey its conditioned, intentional unfolding.


    Cross-Tradition Resonances


    **Yoga Sutra 4.1:** Both sutras link manifestation to favorable conditions; 4.1 speaks of the mind’s
    fluctuations (vṛtti) being conditioned by prakṛti.

    *Divergence:* 4.8 specifies vasanas as the conditioned entities, whereas 4.1 generalizes to all mental
    states.


    **Yoga Sutra 4.5:** Both sutras emphasize that only certain conditions allow a result; 4.5 discusses
    the mind’s ability to be controlled.

    *Divergence:* 4.8 focuses on latent impressions, while 4.5 addresses the active control of present
    thoughts.


    **Sāṃkhya Karika 1.1:** Both texts assert that prakṛti’s gunas govern the manifestation of conditioned
    phenomena.

    *Divergence:* Karika frames the process as a universal law, whereas 4.8 applies it specifically to
    vasanas.


    **Patanjali 1.1 (Yoga Sutra):** Both sutras introduce the concept of the mind’s fluctuations as conditioned
    by prakṛti.

    *Divergence:* 1.1 establishes the framework, while 4.8 narrows it to the manifestation of vasanas.'
