title: Vasana Manifestation
unit_type: sutra
sanskrit_devanagari: तसत् तद्विपाकानुगुणानाम् एवाभिव्यक्तिर् वासनानाम्
sanskrit_iast: tatas tadvipākānuguṇānām evābhivyaktir vāsanānām
translation_literal: From that, the manifestation of the vāsanās occurs in accordance with the ripening
  of their own consequences.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on the mechanism of karma and
  mental conditioning. The word ''that'' (tatas) refers to the preceding discussion of how actions (karma)
  leave impressions or seeds in the mind. Vāsanā literally means ''fragrance'' or ''coloration''—it denotes
  the subtle, latent impressions or habitual tendencies that persist in the unconscious mind after actions
  are performed.


  The sūtra teaches that these vāsanās do not manifest randomly or all at once. Rather, they emerge (abhivyakti)
  in strict accordance with their own ripening (vipāka)—their maturation according to the laws of cause
  and effect. Just as a seed germinates only when conditions of soil, moisture, and warmth align, a vāsanā
  surfaces into conscious experience and behavior only when its time of fruition arrives.


  This is a crucial insight within the Yoga–Sāṃkhya framework: the mind is not a blank slate but a repository
  of conditioned patterns. These patterns are not erased; they lie dormant until circumstances allow them
  to ripen. The yogi''s work is not to destroy vāsanās (an impossible task) but to cease planting new
  ones through mindful action, and to observe their arising without identification. Understanding this
  mechanism reveals why mere intellectual knowledge cannot transform habit—only patient, consistent practice
  (sādhana) can gradually exhaust old impressions while preventing new ones from taking root.


  The doctrine also implies that liberation (mokṣa) is not instantaneous erasure but the gradual exhaustion
  of all ripening impressions through non-identification and right knowledge.


  Key Terms


  **vāsanā** — Subtle mental impression or latent habitual tendency; the fragrance or coloration left
  in consciousness by past actions, which ripens into future experience

  **vipāka** — Ripening or fruition; the maturation and manifestation of karmic seeds according to their
  own nature and timing

  **abhivyakti** — Manifestation or expression; the emergence of something latent into conscious, perceptible
  form'
insight: The sutra asserts that manifestation is contingent on favorable conditions, not an inherent property
  of vasanas.
practice: 'For one week, choose a single recurring mental habit or emotional reaction you notice (e.g.,
  irritation at a particular time of day, craving for a specific food, defensive response to criticism).
  Each time it arises, pause and silently note: ''This is a vāsanā ripening now. I observe it without
  acting on it.'' Do not suppress it or judge yourself for having it. Simply witness its arising, peak,
  and natural subsiding—like watching a cloud form, drift, and dissolve in the sky. Record in a journal
  how many times it appeared and whether its intensity changed. This practice trains you to see impressions
  as natural phenomena with their own lifecycle, rather than as ''you,'' and interrupts the automatic
  chain of stimulus → habit → reinforcement that plants new seeds.'
