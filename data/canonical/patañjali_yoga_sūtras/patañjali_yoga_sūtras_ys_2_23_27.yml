sanskrit_devanagari: 'स्वस्वामीशक्त्योः स्वरूपोपालभ्धिहेतुः संयोगः ॥ २.२३ ॥


  तस्य हेतुं अविद्या ॥ २.२४ ॥


  तदाभावात् संयोगाभावः हानं तददृशेः काविल्यम् ॥ २.२५ ॥


  विवेकाख्यातिर अविप्लवाः हानोपायः ॥ २.२६ ॥


  तस्य सप्तधः प्रान्तभूमिः प्रज्ञा ॥ २.२७ ॥'
sanskrit_iast: 'svasvāmiśaktyoḥ svarūpopalabdhihetuḥ saṃyogaḥ || 2.23 ||


  tasya hetur avidyā || 2.24 ||


  tadabhāvāt saṃyogābhāvo hānaṃ taddṛśeḥ kaivalyam || 2.25 ||


  vivekakhyātir aviplavā hānopāyaḥ || 2.26 ||


  tasya saptadhā prāntabhūmiḥ prajñā || 2.27 ||'
translation_literal: '**2.23** Union is the cause of the apprehension of the essential nature of the two
  powers—the seen and the seer.

  **2.24** Ignorance is its cause.

  **2.25** From the absence of that [ignorance] comes the absence of union, [which is] the removal; the
  isolation of that seer is liberation.

  **2.26** Unceasing discriminative discernment is the means of removal.

  **2.27** For him, wisdom reaches the seventh and final ground.'
commentary: 'Patañjali''s cluster 2.23–2.27 traces a single causal arc: the misidentification of puruṣa
  (the witnessing consciousness) with prakṛti (the field of manifestation) generates all bondage; ignorance
  (avidyā) is the root; and liberation (kaivalya) emerges through the systematic discrimination between
  seer and seen. The argument moves from diagnosis to remedy without sentimentality. Sūtra 2.23 establishes
  that the ''union of the self-recognizing power and the self-reached form''—the svasvāmiśaktyoḥ saṃyoga—is
  not incidental but constitutive: the very act by which consciousness appears to recognize itself in
  prakṛti''s forms is the mechanism of bondage. This is not a metaphysical accident but the engine of
  experience itself. Sūtra 2.24 then names the cause: avidyā, not mere ignorance but a fundamental misapprehension
  of the distinction between puruṣa and prakṛti. This is the hetu, the proximate reason why the seer mistakes
  the seen for itself. Sūtra 2.25 inverts the logic: kaivalya—aloneness, the isolation of puruṣa—is precisely
  what ''appears'' (dṛśyate) when the saṃyoga dissolves. The word ''appears'' is crucial: liberation is
  not an attainment but a recognition of what already is. Sūtra 2.26 then supplies the method: viveka,
  discrimination—a continuous, disciplined discernment between puruṣa and prakṛti that systematically
  dissolves the false identification. This is not intellectual parsing but a lived practice that rewires
  the citta (mind-stuff). The cluster''s genius is its economy: it does not multiply causes or remedies.
  One root (avidyā), one dissolution (viveka), one outcome (kaivalya). The framework is rigorously non-dualistic:
  puruṣa and prakṛti are eternally separate; the bondage is a cognitive error, not an ontological mixing.
  Yoga''s task is to make that separation evident through sustained discrimination until the vṛtti (mental
  modifications) cease their false mirroring of prakṛti as ''I'' and ''mine.''


  Key Terms


  **saṃyoga** — conjunction or false union between puruṣa and prakṛti; the misidentification that generates
  bondage

  **avidyā** — fundamental ignorance; misapprehension of the distinction between the seer (puruṣa) and
  the seen (prakṛti)

  **viveka** — discrimination; continuous discernment between puruṣa and prakṛti that dissolves false
  identification

  **kaivalya** — liberation; the state of puruṣa''s aloneness and independence from prakṛti


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.2–3 (Kṣetra-Kṣetrajña distinction):** Both texts posit a fundamental duality between
  the field (prakṛti) and the knower of the field (puruṣa), and both locate liberation in recognizing
  this distinction. The Gītā''s ''jñānam'' (knowledge) parallels Yoga''s viveka. Divergence: The Gītā
  emphasizes bhakti and dharma as complementary paths; Patañjali''s Yoga isolates discrimination and mental
  discipline as the sole sufficient means.

  **Epictetus, Enchiridion 1.1–2:** Both identify a root error in judgment (prohairesis gone wrong in
  Epictetus; avidyā in Patañjali) as the source of suffering, and both prescribe a systematic retraining
  of discernment to restore freedom. Divergence: Epictetus grounds freedom in the will''s correct use
  within a providential cosmos; Patañjali grounds it in the recognition of puruṣa''s eternal separation
  from prakṛti, with no cosmic teleology.

  **Plotinus, Enneads 5.1.1 (the One''s self-knowledge):** Both texts explore how consciousness recognizes
  itself and how that self-recognition can become entanglement; both posit a return through discriminative
  intellection. Divergence: Plotinus sees the One''s self-knowledge as a positive emanation; Patañjali
  sees the seer''s apparent self-recognition in prakṛti as the very mechanism of bondage to be undone.'
insight: The central philosophical claim of this verse is that the very act of self‑recognition—what the
  sūtra calls the ‘union of the self‑recognizing power and the self‑reached form’—is itself the causal
