- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this sutra is that the mind’s eye (mūrdhā) is the locus where the subtle, perfected vision (siddha‑darśana)
    is realized through a sustained, unshakable focus. In the Yoga‑Sāṃkhya framework, the mind’s eye is a conceptual tool
    that bridges the external world and the internal observer; it is not merely a physical organ but a metaphysical point
    where the *citta* (mind) aligns with the *prāṇā* of the subtle channels. The sutra’s brevity masks a profound pedagogical
    move: it condenses the entire practice of *samādhi* into the single act of holding the mind’s eye steady, thereby collapsing
    the *vṛtti* (mental fluctuations) into a single, unbroken state. This move is contested in the sense that some commentators
    insist on a gradual build‑up of concentration, whereas here the sutra suggests that the perfected vision is instantly
    available once the mind’s eye is fixed. The practice is thus existential: it invites the practitioner to experience the
    *siddha* (realized) state not as a distant goal but as an immediate, accessible reality. By focusing on the mind’s eye,
    one bypasses the external distractions and directly engages the *citta* in a state of *samādhi* that is both *sādhana*
    (practice) and *siddhi* (accomplishment). This aligns with the broader Yoga tradition’s emphasis on the *yoga* of the
    mind, where the *citta* is trained to become a steady, luminous witness, thereby revealing the *purusha* (pure consciousness)
    that is untouched by the fluctuations of *prakṛti*.


    Key Terms


    **yoga (योग)** — From ‘to bind’ to the binding of the mind’s fluctuations; default translation as ‘practice’ misses its
    ontological role as the union of body, mind, and consciousness.


    **citta (चित्त)** — Etymology: ‘to think’ → the store of impressions; tradition: the dynamic field of mental activity;
    default translation as ‘mind’ overlooks its role as the active observer.


    **vṛtti (वृत्ति)** — ‘to turn’ → the oscillations of the mind; tradition: the mental modifications that obscure *purusha*;
    default translation as ‘thoughts’ misses its dynamic, processual nature.


    **samādhi (समाधि)** — ‘to be united’ → the state of complete absorption; tradition: the culmination of *yoga* where *citta*
    and *purusha* merge; default translation as ‘concentration’ understates its transcendental quality.


    Cross-Tradition Resonances


    **Yoga Sūtra 1.2:** Both sutras invoke the mind’s eye (mūrdhā) as a focal point for realizing the true self, emphasizing
    the centrality of *citta* in the path to liberation.

    *Divergence:* While 1.2 speaks of the mind’s eye as a *kāraṇa* (cause) of *samādhi*, 3.32 presents it as the *siddha*
    (realized) state itself, collapsing cause and effect.


    **Bhaṭṭa’s *Yogaśāstra* 3.1:** Both texts describe the stabilization of the mind’s eye as a means to silence *vṛtti* and
    attain *samādhi*.

    *Divergence:* Bhaṭṭa elaborates a multi‑step process of progressive concentration, whereas 3.32 condenses the practice
    into a single, instantaneous act.


    **Mādhava’s *Yogaśāstra* 4.5:** Both treat the mind’s eye as a locus where *prāṇa* flows, enabling *siddha* vision.

    *Divergence:* Mādhava emphasizes the *prāṇa* channeling through the *nadī*, while 3.32 focuses solely on the mental fixation,
    leaving physiological aspects implicit.'
