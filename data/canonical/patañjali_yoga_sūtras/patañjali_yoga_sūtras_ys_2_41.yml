sanskrit_devanagari: सत्त्वशुद्धिसुमानस्यैकाग्रेन्‍द्रियजयात्मदर्शनीयोग्यत्वानि च
sanskrit_iast: sattvaśuddhisaumanasyaikāgryendriyajayātmadarśanayogyatvāni ca
translation_literal: Purity of mind, cheerfulness, one-pointed focus, mastery of the senses, and fitness
  for self-realization—these too arise.
commentary: 'This sūtra concludes Patañjali''s enumeration of the fruits that emerge from consistent practice
  of the niyamas (observances). The verse names five interlocking capacities that ripen together as the
  practitioner''s inner life stabilizes.


  Sattvaśuddhi (purity of sattva) is not mere moral cleanliness but a refinement of the sattva guṇa itself—the
  subtle matter-principle of clarity and luminosity. As the mind''s habitual turbulence (rajas) and inertia
  (tamas) settle, sattva naturally predominates, and the mind becomes transparent rather than clouded.


  Saumanasya (cheerfulness or well-being) follows naturally. This is not forced positivity but the absence
  of the grinding friction that unexamined habit creates. The nervous system recognizes its own alignment.


  Ekāgratā (one-pointed focus) is the capacity to hold attention without strain. When the mind is not
  divided against itself by unresolved impressions and conflicting desires, it naturally gathers into
  a single beam.


  Indriyajaya (mastery of the senses) does not mean suppression. It means the senses obey the will of
  the mind rather than dragging the mind after them. This is possible only when the mind itself is coherent.


  Atmadarśanayogyatva (fitness for self-realization) is the culmination: the practitioner becomes a suitable
  vessel for direct insight into the true nature of consciousness. The obstacles have not disappeared,
  but they no longer block the way.


  Within the Yoga–Sāṃkhya framework, these five capacities mark the threshold between preliminary practice
  and genuine meditation. They are not achievements to grasp but natural consequences of removing what
  obscures them.


  Key Terms


  **sattva** — The guṇa (quality) of clarity, luminosity, and harmony; the subtle principle that allows
  knowledge and coherence

  **ekāgratā** — One-pointedness; the capacity of attention to gather and hold without fragmentation

  **indriyajaya** — Mastery of the senses; the capacity for the mind to govern sensory input rather than
  be governed by it'
insight: The passage asserts that disciplined practice yields a cascade of inner purification and readiness
  for self‑realization.
practice: 'Through the day, pause three times—morning, midday, evening—and notice: Is my mind transparent
  right now, or clouded? Rather than analyzing why, simply feel the difference in your body between clarity
  and fog, between the grinding friction of internal conflict and the ease of alignment. Let that felt
  difference be your teacher.'
