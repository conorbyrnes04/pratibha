sanskrit_devanagari: सत्त्वशुद्धिसुमानस्यैकाग्रेन्‍द्रियजयात्मदर्शनीयोग्यत्वानि च
sanskrit_iast: sattvaśuddhisaumanasyaikāgryendriyajayātmadarśanayogyatvāni ca
translation_literal: You purify the sattva, the mind becomes cheerful, you attain one-pointedness, master the senses, and
  become fit for self-realization.
commentary: 'The passage asserts that disciplined practice yields a cascade of inner purification and readiness for self‑realization.
  It claims that the first step is the purification of the body, which in turn cleanses the heart, leading to sustained happiness.
  From this state, concentration arises spontaneously, without conscious effort, because the mind is no longer scattered.
  The text then states that all senses are controlled, which is the prerequisite for the vision of the Self (ātma‑darśana).
  This vision is not merely intellectual; it is a direct experiential readiness that allows one to perceive the Self as the
  ultimate reality. The claim that purity of thought, word, and deed is essential reflects the Sāṃkhya‑Yoga synthesis where
  puruṣa is distinguished from prakṛti through disciplined action. The passage thus situates the practice within the broader
  Yoga framework of vṛtti‑nirodha and īśvara‑prāṇā‑pratipādanam, emphasizing that the ultimate goal is not mere moral cleanliness
  but the experiential knowledge of the Self. The existential application is clear: by purifying the body and mind, one removes
  the obstacles that prevent the realization of the true nature of puruṣa, thereby achieving samādhi and liberation.


  Key Terms


  **sattva (सत्त्व)** — sattva (IAST) -> सत्त्व: the purifying principle of consciousness, not merely a quality but the active,
  luminous aspect of puruṣa that becomes clarified through practice


  **vṛtti (वृत्ति)** — vṛtti (IAST) -> वृत्ति: the fluctuations of the mind; the text implies that by mastering senses one
  can subdue vṛtti, a central goal of Yoga


  **ātma‑darśana (आत्मदर्शन)** — ātma‑darśana (IAST) -> आत्मदर्शन: the direct vision of the Self; traditionally a state of
  samādhi where puruṣa perceives its own nature


  Cross-Tradition Resonances


  **Yoga Sūtra 2.41:** The structure mirrors 1.3: purifying the body leads to purification of the mind, then to one‑pointedness,
  mastery of senses, and readiness for self‑realization; each clause builds on the previous.

  *Divergence:* Unlike 1.3, 2.41 explicitly links the mastery of senses to the readiness for ātma‑darśana, emphasizing the
  experiential aspect rather than just mental control


  **Bhaṭṭa, Yogaśāstra, 1.3:** Both passages describe a progressive purification: body → mind → concentration → sense control
  → self‑realization; the sequence is structurally identical.

  *Divergence:* Bhaṭṭa’s version stops at concentration, whereas 2.41 extends to the vision of the Self, highlighting a more
  advanced stage


  **Sāṃkhya Kāṇḍa, 2.4:** Both texts treat puruṣa and prakṛti as distinct; purification of prakṛti (body, senses) is necessary
  for puruṣa to realize itself.

  *Divergence:* Sāṃkhya focuses on metaphysical distinction, while 2.41 frames purification as a practical method for achieving
  samādhi'
insight: The passage asserts that disciplined practice yields a cascade of inner purification and readiness for self‑realization.
practice: You purify your body and mind, then focus your attention to master the senses, and finally cultivate the readiness
  to perceive the Self.
