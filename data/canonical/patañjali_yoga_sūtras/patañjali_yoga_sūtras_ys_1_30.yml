unit_label: Obstacles to Samādhi
title: Obstacles to Samādhi
unit_type: sutra
sanskrit_devanagari: वयाधिस्यन्तानसंशयप्रमादालस्याविरतिभ्रान्तिदर्शनालभद्भूमिकत्वनवास्थितत्वानि चित्तविक्षेपास् ते अन्तरायाः
sanskrit_iast: vyādhistyānasaṃśayapramādālasyāviratibhrāntidarśanālabdhabhūmikatvānavasthitatvāni cittavikṣepās te 'ntarāyāḥ
translation_literal: Disease, doubt, carelessness, sloth, worldly-mindedness, false notion, missing the point, and instability
  distract the mind; they are obstacles to attaining Samādhi.
commentary: 'The passage asserts that a spectrum of mental and physical afflictions—ranging from disease to the subtle drift
  of the mind—constitute the primary obstacles to the sustained state of Samādhi. In the Yoga–Sāṃkhya framework, Samādhi is
  the stilling of citta‑vṛtti, the cessation of the fluctuations of consciousness. The text thereby foregrounds the necessity
  of purifying the mind before it can rest in the union of puruṣa and prakṛti. The contested move here is the inclusion of
  ‘worldly‑mindedness’ (loka‑māna), a term that some commentators argue is a later interpolation; yet its presence underscores
  the perennial Yoga concern that attachment to sensory pleasure undermines meditative focus. Dvivedi’s enumeration of the
  obstacles parallels the classic list in the Bhagavad‑Gītā (2.50) and the Pātañjali’s own 1.30, but he expands it with ‘missing
  the point’ and ‘instability’, thereby making explicit the experiential gap between attaining and maintaining Samādhi. For
  the practitioner, this means that even after the mind has entered the state of Samādhi, vigilance is required to guard against
  the subtle return of doubt and distraction. The passage thus serves as a diagnostic map: identify the specific afflictions
  that plague your practice, and systematically eliminate or transform them through disciplined breath, posture, and ethical
  restraint, thereby enabling the mind to remain in the unaltered awareness that defines true Samādhi.


  Key Terms


  **citta (चित्त)** — citta (Sanskrit) -> mind, consciousness; in Yoga, the subtle mind that experiences vṛtti; the translation
  ‘mind’ omits its role as the substrate of perception and the target of purification.


  **vṛtti (वृत्ति)** — vṛtti (Sanskrit) -> fluctuation, modification; in Sāṃkhya, the manifold alterations of citta; in Yoga,
  the mental modifications that must be stilled for Samādhi.


  **purusha (पुरुष)** — purusha (Sanskrit) -> pure consciousness, self; in Sāṃkhya, the eternal witness; in Yoga, the subject
  that observes the object of prakṛti.


  **prakṛti (प्रकृति)** — prakṛti (Sanskrit) -> material nature, dynamic principle; in Sāṃkhya, the source of all phenomena;
  in Yoga, the changing world that purusha perceives.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.30:** Lists obstacles to Samādhi, mirroring the Bhagavad‑Gītā 2.50’s enumeration of afflictions that hinder
  spiritual progress.

  *Divergence:* While the Gītā focuses on moral and devotional obstacles, the Sūtra emphasizes mental and physical afflictions,
  underscoring Yoga’s distinct diagnostic approach.


  **Pātañjali 1.30:** Both texts identify disease, doubt, and sloth as hindrances to Samādhi.

  *Divergence:* Pātañjali’s list omits ‘worldly‑mindedness’ and ‘instability’, reflecting a narrower scope on internal afflictions
  versus the Sūtra’s broader experiential taxonomy.


  **Bhagavad‑Gītā 2.50:** Both treat ‘doubt’ and ‘carelessness’ as obstacles to spiritual realization.

  *Divergence:* The Gītā frames them within the context of karma and devotion, whereas the Sūtra treats them as direct mental
  disturbances that must be suppressed for Samādhi.


  **Dvivedi 1.30:** Dvivedi expands the Sūtra’s list with ‘missing the point’ and ‘instability’, aligning with the Yoga tradition’s
  emphasis on sustained awareness.

  *Divergence:* Dvivedi’s added terms reflect a contemporary pedagogical lens, whereas the original Sūtra’s concise list preserves
  the ancient diagnostic economy.'
insight: The passage asserts that a spectrum of mental and physical afflictions—ranging from disease to the subtle drift of
  the mind—constitute the primary obstacles to the sustained state of Samādhi.
practice: Identify the most frequent distraction in your meditation—be it disease, doubt, or worldly-mindedness—and consciously
  replace it with focused breath, maintaining awareness of the present moment.
