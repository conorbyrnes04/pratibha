  label: Key Terms
  items:
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Obstacles to Samādhi”: the translation
      ‘mind’ omits its role as the substrate of perception and the target of purification -> not ‘brain software’ or an enemy
      to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Obstacles to Samādhi”: Disease, doubt, carelessness, sloth,
      worldly-mindedness, false notion, missing the point, and instability distract th… -> not trance-entertainment or unconsciousness;
      graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: heya (हेय)
    definition: '√hā ‘abandon’ → that which is to be discarded (future suffering) -> in “Obstacles to Samādhi”: Disease, doubt,
      carelessness, sloth, worldly-mindedness, false notion, missing the point, and instability distract th… -> not past pain
      fixation; the avoidable future duḥkha that viveka aims to cut'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Obstacles to Samādhi”: in Yoga, the mental modifications
      that must be stilled for Samādhi -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep,
      memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Obstacles to Samādhi”: in Yoga, the subject that
      observes the object of prakṛti -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
