sanskrit_devanagari: वयाधिस्यन्तानसंशयप्रमादालस्याविरतिभ्रान्तिदर्शनालभद्भूमिकत्वनवास्थितत्वानि चित्तविक्षेपास्
  ते अन्तरायाः
sanskrit_iast: vyādhistyānasaṃśayapramādālasyāviratibhrāntidarśanālabdhabhūmikatvānavasthitatvāni cittavikṣepās
  te 'ntarāyāḥ
translation_literal: Disease, dullness, doubt, carelessness, laziness, sensory indulgence, false perception,
  failure to establish stable ground, and instability in that ground—these are the scatterings of the
  mind. They are the obstacles.
commentary: 'This sūtra catalogs nine specific impediments that fragment attention and prevent the mind
  from settling into samādhi. Patañjali is not listing abstract vices but concrete, recognizable states
  that practitioners encounter on the path.


  Each obstacle operates as a form of cittavikṣepa—a dispersal or scattering of mental coherence. Disease
  (vyādhi) includes both physical illness and the mental disturbance it creates. Styāna is a particular
  kind of dullness or heaviness—not sleep, but a fog that obscures clarity. Saṃśaya is doubt, especially
  doubt about the method or one''s capacity. Pramāda is negligence or carelessness—knowing what to do
  but not doing it. Alasya is lethargy or lack of energy to practice. Avirati is the inability to withdraw
  from sensory indulgence; the senses pull attention outward. Bhrāntidarśana is false or distorted perception—mistaking
  the path or misinterpreting experience. Alabdhabhūmikatva means failing to establish a stable foundation
  or ground in practice. Anavasthitatva is instability even when some ground has been reached—the inability
  to maintain what has been gained.


  These nine are not moral failings to be judged but natural friction points in the system. The Yoga Sūtras
  treat them as mechanical obstacles, like resistance in a machine. Recognizing them by name is the first
  step toward addressing them through specific countermeasures (pratipakṣa bhāvanā—cultivation of the
  opposite).


  Key Terms


  **cittavikṣepa** — Scattering or dispersal of the mind; fragmentation of mental coherence that prevents
  unified attention

  **antarāya** — Obstacle or impediment; literally ''that which stands between'' the practitioner and
  samādhi

  **bhūmikatva** — Ground or foundation; the stable base or stage established in practice'
insight: The passage asserts that a spectrum of mental and physical afflictions—ranging from disease to
  the subtle drift of the mind—constitute the primary obstacles to the sustained state of Samādhi.
practice: 'For one week, keep a simple log of your meditation or contemplative practice. Each day, note
  which of these nine obstacles arose: Did physical discomfort (vyādhi) interrupt you? Did mental fog
  (styāna) cloud your attention? Did doubt (saṃśaya) make you question the practice? Did carelessness
  (pramāda) cause you to skip or rush? Did lethargy (alasya) pull you toward distraction? Did sensory
  pull (avirati) draw you outward? Did false perception (bhrāntidarśana) arise—misunderstanding what you
  were experiencing? Did you fail to establish ground (alabdhabhūmikatva), or lose ground you''d found
  (anavasthitatva)? Simply naming the obstacle when it appears—without judgment—begins to create space
  between you and it. This awareness itself is the first tool of yoga.'
