title: Breath-Regulation — Prāṇāyāma
unit_type: sutra_cluster
sutra_range: 2.49-2.53
sanskrit_devanagari: 'तस्मिन् सति श्वासप्रश्वासयोः गतिविच्छेदः प्राणायामः ॥ २.४९ ॥


  बाह्याभ्यन्तरस्तम्भवृत्तिर् देशकालसंख्या भिः परिदृश्यो दीर्घसूक्ष्मः ॥ २.५० ॥


  बाह्याभ्यन्तरविषयाक्षेपी चतुर्थः ॥ २.५१ ॥


  ततः क्षीयेते प्रकाशावरणम् ॥ २.५२ ॥


  धारणाः च योग्यता मनसः ॥ २.५३ ॥'
sanskrit_iast: 'tasmin sati śvāsapraśvāsayor gativicchedaḥ prāṇāyāmaḥ || 2.49 ||


  bāhyābhyantarastambhavṛttir deśakālasaṃkhyābhiḥ paridṛṣṭo dīrghasūkṣmaḥ || 2.50 ||


  bāhyābhyantaraviṣayākṣepī caturthaḥ || 2.51 ||


  tataḥ kṣīyate prakāśāvaraṇam || 2.52 ||


  dhāraṇāsu ca yogyatā manasaḥ || 2.53 ||'
translation_literal: '**2.49** When that posture is steady, breath control (prāṇāyāma) is the interruption
  of the flow of inhalation and exhalation (śvāsapraśvāsa).

  **2.50** Its operation is external, internal, or held; grasped by place, time, and number, it becomes
  prolonged and subtle (dīrghasūkṣma).

  **2.51** A fourth type transcends both external and internal objects.

  **2.52** From this, the veil obscuring light (prakāśāvaraṇa) thins away.

  **2.53** And the mind becomes fit for concentration (dhāraṇā).'
commentary: 'Patañjali''s five sūtras on prāṇāyāma form a single argument: breath control is the systematic
  interruption of prakṛti''s automaticity in order to align citta with puruṣa. The movement is from intervention
  (2.49) through graduated technique (2.50–2.51) to liberation of perception (2.52–2.53).


  2.49 establishes the foundational act—cutting off (viccheda) the natural flow of inhalation and exhalation.
  This is not mere physical manipulation but a deliberate rupture in the mind''s habitual entanglement
  with prāṇā, the subtle life force that animates prakṛti. By suspending breath''s automaticity, the yogi
  interrupts the vṛtti-stream that keeps citta bound to material fluctuation.


  2.50–2.51 then specify the method: regulation through deśa (place—the nāḍī channels), kāla (time—duration),
  and saṃkhyā (number—repetition), applied to three modes: bāhya (external exhalation), abhyantara (internal
  retention), and stambha (steady suspension). The fourth type—the internal or external *position* of
  breath—marks the threshold where the yogi perceives the same phenomenon from dual perspectives, loosening
  attachment to a single mode of experience. This graduated technique transforms breath from an unconscious
  autonomic process into a conscious instrument of subtle energy purification.


  The result unfolds in 2.52–2.53: "the covering of light dissolves" (āvaraṇa-kṣaya). In Sāṃkhya terms,
  prakṛti''s three guṇas—especially tamas and rajas—veil the luminosity of puruṣa''s pure witnessing.
  As prāṇāyāma purifies citta, this obscuration lifts. The mind, now freed from its habitual turbulence,
  becomes *yogyatā*—fit, capable, prepared—for sustained action (dhāraṇā) and ultimately samādhi.


  The genius of this cluster lies in its recognition that consciousness and breath are not separate: by
  disciplining one, the yogi transforms the other. Prāṇāyāma is neither mere physiology nor abstract meditation,
  but the precise point where prakṛti''s subtle mechanics become transparent to puruṣa''s unobstructed
  awareness.


  Key Terms


  **prāṇāyāma** — regulation of breath; the systematic modulation of life-force (prāṇā) through control
  of inhalation, exhalation, and retention to purify citta and align it with puruṣa

  **viccheda** — cutting off, interruption; the deliberate suspension of the breath''s natural automatic
  flow

  **āvaraṇa-kṣaya** — dissolution of the covering; the removal of the veil (tamas and rajas) that obscures
  puruṣa''s luminosity

  **yogyatā** — fitness, capability, readiness; the state of citta prepared for sustained mental action
  and samādhi


  Cross-Tradition Resonances


  **Bhagavad Gītā 5.27–28:** Both texts frame sense-withdrawal and breath control as means to turn attention
  inward and stabilize the mind on the Self, preparing for direct realization. The Gītā''s prāṇāyāma-yoga
  parallels Patañjali''s use of breath as a bridge between body and consciousness. Divergence: The Gītā
  emphasizes renunciation of external action and surrender to Kṛṣṇa, while Patañjali''s system treats
  prāṇāyāma as a precise technical practice requiring methodical discipline and quantifiable progression
  (place, time, number).

  **Plotinus, Enneads 4.8.1:** Both Plotinus and Patañjali describe a veiling of the soul''s or puruṣa''s
  inherent light by material entanglement, and both prescribe systematic practice—contemplation or prāṇāyāma—to
  dissolve that obscuration and restore direct perception. Divergence: Plotinus locates the veil in the
  soul''s descent into matter and emphasizes intellectual contemplation; Patañjali grounds the practice
  in the body''s subtle physiology (nāḍī, prāṇā) and treats breath as the concrete instrument of purification.

  **Epictetus, Enchiridion 1.1:** Both Epictetus and Patañjali distinguish between what is within our
  control (breath, attention, mental discipline) and what is not (external events, the body''s automatic
  functions), using this distinction to redirect effort toward mastery of the mind. Divergence: Epictetus
  emphasizes rational judgment and assent to impressions; Patañjali treats breath control as a physiological-energetic
  intervention that directly transforms citta, not merely a matter of rational choice.'
insight: 'The claim that the fourth sutra concerns the breath’s position—internal or external—constitutes
  a pivotal point in the Yoga system: it bridges the phenomenological description of pranāyāma with the
  me'
practice: You observe the breath as it enters and leaves the body, consciously noting whether it feels
  internal (within the nadīs) or external (visible inhalation/exhalation), and pause at the first exhalation
  to mark completion.
