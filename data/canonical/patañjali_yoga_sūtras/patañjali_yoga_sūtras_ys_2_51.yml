sanskrit_devanagari: बाह्याभ्यन्तरविषयाक्षेपी चतुर्थः
sanskrit_iast: bāhyābhyantaraviṣayākṣepī caturthaḥ
translation_literal: The fourth is that which transcends the objects of external and internal focus.
commentary: 'This sūtra completes Patañjali''s four-part taxonomy of āsana (physical posture) begun in
  2.46. The first three positions concern themselves with external stability (sthira), internal ease (sukha),
  and the interplay between effort and relaxation. The fourth position—here called caturthaḥ (the fourth)—marks
  a qualitative shift: it is bāhyābhyantaraviṣayākṣepī, literally ''that which throws off'' or ''transcends''
  (ākṣepī) both external (bāhya) and internal (abhyantara) objects of attention (viṣaya).


  This is not merely a physical posture but a state of postural consciousness where the practitioner ceases
  to oscillate between outer bodily awareness and inner mental focus. The mind no longer alternates between
  proprioceptive sensation and thought; instead, it settles into a unified field of being. In the Yoga–Sāṃkhya
  framework, this represents a gateway toward pratyāhāra (sense withdrawal) and the deeper limbs of yoga.
  The body becomes transparent to awareness; neither the external form nor internal sensation commands
  attention. This fourth position is sometimes understood as the threshold where āsana dissolves into
  meditation itself—where postural practice becomes indistinguishable from mental discipline.


  Historically, commentators like Vyāsa interpret this as the state where the practitioner transcends
  the duality of effort and ease, moving into a spontaneous, effortless stability that requires no deliberate
  management of external or internal factors.


  Key Terms


  **bāhyābhyantara** — external and internal; the duality of outer sensory fields and inner mental/subtle
  domains

  **viṣayākṣepī** — that which transcends or throws off objects of focus; moving beyond object-centered
  awareness

  **āsana** — posture; in classical yoga, a stable, comfortable seat that becomes a gateway to meditation
  and withdrawal of the senses'
insight: 'The claim that the fourth sutra concerns the breath’s position—internal or external—constitutes
  a pivotal point in the Yoga system: it bridges the phenomenological description of pranāyāma with the
  me'
practice: The moment you notice yourself caught between tracking a body sensation and chasing a thought
  about it, stop the oscillation—hold neither. Stand or sit exactly as you are and let your attention
  fall into the space *between* inner and outer, where nothing demands focus. Stay there until the distinction
  dissolves.
