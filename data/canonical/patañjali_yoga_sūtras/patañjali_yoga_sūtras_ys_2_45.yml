sanskrit_devanagari: समाधिसिद्धिर् इश्वरप्रणिधानात्
sanskrit_iast: samādhisiddhir īśvarapraṇidhānāt
translation_literal: Perfection in samādhi comes through surrender to the Lord.
commentary: 'This sūtra (I.23) names īśvarapraṇidhāna—devoted alignment with the transcendent principle—as
  the direct means to samādhisiddhi, the attainment of stable, unbroken absorption. Within the Yoga–Sāṃkhya
  framework, īśvara is not a creator-god but the eternally liberated witness-consciousness, untouched
  by the flux of prakṛti (nature). Praṇidhāna means to direct, bow toward, or surrender one''s whole effort
  and intention. The sūtra asserts that samādhi—the goal of yoga—is not seized by force or intellect alone,
  but realized through a reorientation of the will: ceasing to grasp, and instead aligning oneself with
  what is already free. This is not blind faith but a pragmatic inversion: the ego''s striving creates
  friction and distraction; surrender to a principle beyond ego''s agenda dissolves that friction. The
  perfection (siddhi) is not acquired but revealed when the practitioner stops obstructing it. This verse
  sits among Patañjali''s core prescriptions (I.14, I.20–I.23) for how samādhi is reached: through sustained
  practice, dispassion, and now, through this devotional turning toward the unconditioned.


  Key Terms


  **samādhisiddhi** — The perfection or attainment of samādhi; the stable realization of unbroken absorption
  in the object of meditation

  **īśvarapraṇidhāna** — Devoted surrender or alignment of intention toward īśvara, the eternal witness-consciousness;
  one of the five niyamas (observances)

  **īśvara** — In Patañjali''s system, the transcendent, eternally liberated consciousness, untouched
  by affliction, action, or karmic consequence; the principle of freedom itself'
insight: The sūtra asserts that samādhi, the supreme state of absorption, is achieved through complete
  surrender to Īśvara.
practice: The next time you catch yourself striving—tensing toward a goal, gripping an outcome, forcing
  a decision—pause and whisper the word "praṇidhāna" (surrender-alignment) on your exhale, then deliberately
  relax your jaw, shoulders, and hands as if releasing what you were holding. Let this small gesture of
  unclenching be your alignment with what is already free, beyond your effort.
