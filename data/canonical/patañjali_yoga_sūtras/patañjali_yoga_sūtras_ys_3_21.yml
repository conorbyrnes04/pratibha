- kind: translation
  label: Pratibha Translation
  body: By saṁyama on the form of one’s body and by checking the power of perception by intercepting light from the eyes of
    the observer, the body becomes invisible.
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that the body’s very presence can be negated by a disciplined self‑control that blocks the sensory
    channel through which the body is normally perceived. In the Yoga and Sāṃkhya framework, perception (pratyakṣa) is the
    bridge between prakṛti and puruṣa; it is mediated by the vṛtti of the citta. Here, saṁyama is not merely ethical restraint
    but a technical act that severs the vṛtti of the citta that would ordinarily register bodily form. By disabling the light
    that reaches the observer’s eye, the citta’s vṛtti is prevented from forming an image, and the body’s external manifestation
    dissolves. This is a contested move because it treats the body as a mere perceptual construct rather than an ontological
    entity. The Sāṃkhya tradition holds that the body is a manifestation of prakṛti, yet this sutra elevates the role of the
    observer’s citta to the point where the body’s existence becomes contingent on perception. The existential implication
    is profound: one can achieve a state of non‑being in the world by mastering the very mechanism that gives the body its
    presence. The Satchidananda commentary illustrates this by describing the eye’s retina as the site where the body’s form
    is recorded; by preventing that recording, the body’s image disappears. This aligns with the broader Yoga aim of dissolving
    the illusion of the body (māyā) to realize puruṣa’s pure awareness.


    The sutra also hints at the dual nature of perception: the external light (prakāśa) and the internal receptivity (saṁprayoga).
    By mastering saṁyama, one can control the internal receptivity, thereby nullifying the external light’s effect. This resonates
    with the later Yoga sutra on the mind’s capacity to alter reality through disciplined attention, suggesting a continuity
    in the Yoga canon regarding the power of the mind to transcend physical form.


    Key Terms


    **saṁyama (संयम)** — (Sanskrit) restraint; in Yoga, disciplined control of body, mind, and senses; in Sāṃkhya, a vṛtti
    of citta that aligns with puruṣa


    **citta (चित्त)** — (Sanskrit) mind; in Sāṃkhya, the substratum of all mental activity; in Yoga, the field that can be
    trained to perceive or not perceive


    **vṛtti (वृत्ति)** — (Sanskrit) modification or activity of citta; the dynamic aspect that can be altered by saṁyama


    **prakāśa (प्रकाश)** — (Sanskrit) light; in this sutra, the perceptual signal that must be intercepted to negate bodily
    form


    Cross-Tradition Resonances


    **Yoga Sūtra 3.21:** Structural homology: body (kāya) + perception (pratyakṣa) = invisibility (antardhāna)

    *Divergence:* Unlike later sutras that treat the body as a fixed substrate, here the body’s existence is contingent on
    perceptual mediation


    **Sāṃkhya Kārikā 3.1:** Both texts emphasize the role of vṛtti in mediating prakṛti and puruṣa

    *Divergence:* Sāṃkhya presents vṛtti as a passive modification, whereas Yoga actively controls it through saṁyama


    **Yoga Sūtra 1.13:** Both sutras discuss the power of the mind to alter perception

    *Divergence:* 1.13 focuses on the mind’s capacity to generate images, while 3.21 focuses on the elimination of images'
