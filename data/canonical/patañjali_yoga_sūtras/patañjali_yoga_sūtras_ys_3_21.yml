sanskrit_devanagari: कायरूपसंयमात् तदग्राह्यशक्तिस्तम्भे चक्षुप्रकाशासंप्रयोगे अन्तर्धानम्
sanskrit_iast: kāyarūpasaṃyamāt tadgrāhyaśaktistambhe cakṣuḥprakāśāsaṃprayoge 'ntardhānam
translation_literal: Through constraint applied to the form of the body, when the power by which it is grasped is obstructed,
  and light from the eyes no longer meets the object, concealment occurs.
commentary: 'This sūtra describes a specific application of saṃyama (the unified practice of concentration, meditation, and
  absorption) directed at the body''s visible form. The mechanism is precise: the body remains physically present, but two
  conditions must align for it to become imperceptible.


  First, the yogin applies saṃyama to kāyarūpa—the body as a formed, visible entity. This is not mere thought-suppression;
  it is a direct constraint on the perceptual substrate itself. Second, the sūtra identifies the actual obstacle to perception:
  tadgrāhyaśakti, the power or capacity by which an object is grasped by the senses. When this receptive faculty is stilled
  (stambhe), the sensory apparatus cannot register the form.


  The third condition—cakṣuḥprakāśāsaṃprayoge—clarifies the mechanism further: the light emanating from the eyes (the outward-directed
  perceptual ray in classical yoga ontology) no longer engages with the object. In Sāṃkhya-Yoga metaphysics, perception is
  not passive reception but an active meeting of the perceiver''s light with the object''s light-reflecting capacity.


  The result is antardhānam: disappearance, concealment, or invisibility. The body does not vanish; rather, it becomes unavailable
  to perception. This is not magic but a precise manipulation of the conditions that make perception possible: the alignment
  of the perceiver''s sensory power, the object''s graspable quality, and the medium of light.


  This sūtra sits within a sequence of siddhis (extraordinary capacities) that arise from saṃyama on various elements and
  principles. It demonstrates that the boundary between the visible and invisible is not fixed but depends on the coordination
  of perceptual faculties—a principle with implications for understanding consciousness itself.


  Key Terms


  **saṃyama** — The unified practice of dhāraṇā (concentration), dhyāna (meditation), and samādhi (absorption) applied to
  a single object or principle; the means by which extraordinary capacities (siddhis) are developed.

  **cakṣuḥprakāśa** — The light or radiance of perception emanating from the eyes; in yoga ontology, an active outward-directed
  faculty that meets the object, not a passive reception of reflected light.

  **tadgrāhyaśakti** — The capacity or power by which an object is grasped or perceived; the receptive faculty that makes
  an object available to sensation and cognition.'
insight: The passage asserts that the body’s very presence can be negated by a disciplined self‑control that blocks the sensory
  channel through which the body is normally perceived.
practice: Throughout your day, pause at one moment when you notice someone looking at you—in conversation, passing on the
  street, or in a room. In that instant, withdraw the light of your gaze from them; let your eyes go soft and inward, as if
  the outward ray that meets theirs has been drawn back. Hold this for three breaths and sense what becomes imperceptible
  when your seeing no longer reaches outward to meet them.
