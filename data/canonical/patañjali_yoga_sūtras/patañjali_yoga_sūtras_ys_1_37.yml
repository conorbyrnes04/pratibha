pratibha_layers:
- kind: original
  label: Original
  body: वीतरागविषयं वा चित्तम्
- kind: iast
  label: IAST
  body: vītarāgaviṣayaṃ vā cittam
- kind: translation
  label: Pratibha Translation
  body: The mind that is free from attachment is the object of the mind.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim here is that the very object of the mind—its focus—is itself the mind that has shed all attachment. This
    is a radical inversion of ordinary perception: normally we think of the mind as a passive receiver of objects, yet the
    Sūtra asserts that the mind’s own liberated state becomes the object that the mind must attend to. The move of equating
    the object with the subject is contested; some commentators read it as a poetic device, others as a doctrinal assertion
    that liberation is attained by turning inward. In the Yoga and Sāṃkhya framework, the mind (citta) is the vehicle of experience,
    while the liberated mind (vītarāga) is the state where the mind no longer clings to the changing objects of prakṛti. By
    making the liberated mind the object, the Sūtra invites the practitioner to direct attention to the very quality that
    yields samādhi. Existentially, this means that the path to stillness is not to seek external objects but to recognize
    the mind’s own capacity to be free. Dvivedi’s commentary, which speaks of “Vitardgas” and the absorption of the mind in
    a steady, blissful state, echoes this inward focus; he emphasizes that the result of rajas and tamas is the very mind
    that is free from them. Thus, the Sūtra’s terse statement encapsulates a profound practice: by consciously orienting the
    mind toward its own liberated nature, one cultivates the very samādhi that the Yoga system prizes.


    Key Terms


    **vītarāga (वीतराग)** — etymology: ‘free from attachment’ -> Sāṃkhya tradition: state of mind devoid of rajas and tamas
    -> translation often misses the dynamic quality of ongoing detachment


    **viṣaya (विषय)** — etymology: ‘subject, object’ -> Sāṃkhya: the object of cognition -> translation often reduces to ‘object’
    but here it denotes the mind itself as the focus


    **cittam (चित्तम्)** — etymology: ‘mind, consciousness’ -> Sāṃkhya: the subtle, mutable mind that processes prakṛti ->
    translation often glosses over its role as both subject and object


    Cross-Tradition Resonances


    **Yoga Sūtra 1.35, 1.38:** Both verses use the pattern ‘X viśuddhaḥ’ to describe the mind’s purity; 1.37 mirrors this
    by replacing ‘viśuddhaḥ’ with ‘vītarāga’ and turning the subject into the object

    *Divergence:* Unlike 1.35/1.38 where the mind is described as pure, 1.37 asserts that the mind itself, when free from
    attachment, becomes the very focus of attention, thereby collapsing subject-object distinction


    **Yogācārabhūṣaṇa 1.1:** The idea that the mind’s content is itself the mind echoes the Yogācāra notion of ‘citta‑citta’
    (mind‑mind) as the ultimate reality

    *Divergence:* Yogācāra treats this as a metaphysical principle, whereas the Yoga Sūtra presents it as a practical directive
    for samādhi'
