sanskrit_devanagari: वीतरागविषयं वा चित्तम्
sanskrit_iast: vītarāgaviṣayaṃ vā cittam
translation_literal: Or, the mind becomes steady when its objects are free from attachment.
commentary: 'This sūtra appears in the context of samādhi—the unified, unwavering state of consciousness. Patañjali is offering
  an alternative means to stabilize the mind: rather than forcibly restraining thought-patterns (as in earlier methods), one
  may redirect the mind toward objects that carry no emotional charge, no clinging, no aversion.


  The word vītarāga means ''free from passion, desire, or emotional coloring.'' Viṣaya denotes the object of perception or
  experience. The sūtra suggests that when the mind engages with such objects—whether abstract principles (like the void,
  or pure consciousness itself), or concrete phenomena stripped of personal investment—the natural turbulence of the mind
  settles. There is no fuel for distraction when there is no craving or repulsion.


  This reflects the Yoga–Sāṃkhya understanding that mental agitation arises from the three guṇas (sattva, rajas, tamas) and
  their interplay with desire and aversion. An object without emotional resonance does not trigger the reactive patterns that
  fragment attention. The mind, finding nothing to grasp or reject, naturally enters a state of equilibrium.


  This is not dissociation or numbness; rather, it is a lucid, engaged awareness that observes without attachment. It is a
  practical path for those who find direct suppression of thought too difficult.


  Key Terms


  **vītarāga** — Free from passion, desire, attachment; emotionally neutral or uncolored

  **viṣaya** — Object of perception, sense-field, or domain of experience

  **samādhi** — Unified, unwavering state of consciousness; absorption in which subject and object merge'
insight: The claim here is that the very object of the mind—its focus—is itself the mind that has shed all attachment.
practice: 'Choose a single neutral object—a smooth stone, a candle flame, or a simple geometric form (a circle or dot). Sit
  quietly for 10 minutes. Gaze at or mentally hold this object without trying to extract meaning, memory, or emotion from
  it. Notice any urge to judge it as beautiful or ugly, to compare it to something else, or to daydream about it. Each time
  you notice such a coloring, gently return to bare perception: shape, light, texture, presence. The aim is not blankness
  but clarity—seeing the object as it is, free from your personal investment. Over weeks, you may notice your mind settling
  into a steadier, less reactive state even in daily life.'
