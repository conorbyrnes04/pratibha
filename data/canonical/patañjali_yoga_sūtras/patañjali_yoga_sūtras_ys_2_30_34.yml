sanskrit_devanagari: 'अहिंसासत्यास्तेयब्रह्मचार्यापरिग्रहाः यमाः ॥ २.३० ॥


  जातिदेशकालसमयानवच्छिन्नाः सर्वभूमा महाव्रतम् ॥ २.३१ ॥


  शौचसंतोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः ॥ २.३२ ॥


  वितर्कबाधने प्रतिपक्षभावनम् ॥ २.३३ ॥


  वितर्क हिंसादायः कृतकृतिनुमोदितालभकृतमोहापूर्वकाः मृदुमध्यमाधिमात्रादुहखाज्ञानान्तफलाः इति प्रतिपक्षाभावना ॥ २.३४ ॥'
sanskrit_iast: 'ahiṃsāsatyāsteyabrahmacaryāparigrahā yamāḥ || 2.30 ||


  jātideśakālasamayānavacchinnāḥ sārvabhaumā mahāvratam || 2.31 ||


  śaucasaṃtoṣatapaḥsvādhyāyeśvarapraṇidhānāni niyamāḥ || 2.32 ||


  vitarkabādhane pratipakṣabhāvanam || 2.33 ||


  vitarkā hiṃsādayaḥ kṛtakāritānumoditā lobhakrodhamohapūrvakā mṛdumadhyādhimātrā duḥkhājñānānantaphalā iti pratipakṣabhāvanam
  || 2.34 ||'
translation_literal: '**2.30** You practice non‑violence, truth, celibacy, and restraint, thereby abstaining from killing,
  lying, theft, incontinence, and greed.

  **2.31** These vows, unqualified by class, place, time, or utility, are the great vows, universal in nature.

  **2.32** Purity, contentment, mortification, study, and resignation to Isvara are the observances of this chapter.

  **2.33** When negative thoughts disturb, you generate the opposite thought.

  **2.34** When one acts with violence, or allows it, or even approves it—whether driven by greed, anger, or infatuation—whether
  the act is mild, moderate, or extreme—such conduct is rooted in ignorance and yields inevitable pain. Reflecting upon this
  is the practice of *pratipakṣabhāvanā*.'
commentary: 'Patañjali constructs the ethical foundation of yoga (yama and niyama) not as social convention or pragmatic morality,
  but as a systematic purification of citta—the mind-stuff—that directly serves kaivalya, the liberation of puruṣa from prakṛti.
  The five restraints (yama: ahiṃsā, satya, asteya, brahmacarya, aparigraha) and five observances (niyama: śauca, saṃtoṣa,
  tapas, svādhyāya, īśvara-praṇidhāna) form a unified architecture. Sūtra 2.31 makes the radical claim that only *unconditioned*
  vows—those free from caste, place, time, or utility—constitute mahāvratas (great vows). This universality is not humanitarian
  sentiment but metaphysical necessity: the vṛtti (mental modification) can only be stilled when the will is anchored not
  in social role or outcome but in the unchanging nature of īśvara. Sūtra 2.32 then specifies the observances as active practices
  of commission, not mere abstention. Each—purity, contentment, austerity, study, surrender—addresses a different layer of
  entanglement: śauca purifies the prāṇa and sense-organs; saṃtoṣa arrests the vṛtti of desire and aversion; tapas burns away
  accumulated saṃskāra (latent impressions); svādhyāya discriminates prakṛti from puruṣa; īśvara-praṇidhāna dissolves the
  ego-sense into absolute consciousness. Sūtra 2.33 then reveals the *method* of this purification: pratipakṣabhāvanā, the
  cultivation of the opposite thought. When negative vṛtti arise—violence, falsehood, theft—the practitioner does not suppress
  them through force but generates their antidote. This is not moral repression but cognitive alchemy: the mind is retrained
  at its root. Sūtra 2.34 completes the logic by showing why: any act rooted in greed, anger, or delusion (the three poisons)
  perpetuates avidyā (ignorance) and yields duḥkha (suffering). The reflection on this causal chain—that violence in thought,
  word, or deed, whether enacted, permitted, or merely approved, binds one to prakṛti—becomes itself a practice. Together,
  these sūtras present ethics not as external commandment but as the internal architecture of liberation: the yama and niyama
  are the scaffolding by which citta is progressively freed from vṛtti, allowing puruṣa to recognize its own nature untainted
  by prakṛti''s fluctuations.


  Key Terms


  **mahāvrata** — Great vows; ethical restraints unconditioned by caste, place, time, or utility, universal in their binding
  force

  **pratipakṣabhāvanā** — Cultivation of the opposite thought; the practice of generating antidote thoughts to counteract
  negative mental modifications

  **avidyā** — Ignorance; the fundamental misperception that binds puruṣa to prakṛti and is the root of all suffering

  **vṛtti** — Mental modification or fluctuation; the movements of citta that obscure the true nature of puruṣa


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47–48 (Yoga of Action):** Both texts ground ethical conduct in universal principle rather than outcome:
  the Gītā''s ''yoga is skill in action'' (yogaḥ karmasu kauśalam) and Patañjali''s unconditioned vows both transcend instrumental
  morality. Both teach that right action purifies consciousness. Divergence: The Gītā permits action within one''s dharma
  (caste duty) when performed without attachment; Patañjali explicitly rejects caste-qualified vows, insisting on universality
  that transcends social role.

  **Epictetus, Enchiridion 1.1–2 (Stoic dichotomy of control):** Both Patañjali and Epictetus teach that virtue lies in mastering
  internal assent and thought, not external circumstance. Pratipakṣabhāvanā parallels the Stoic retraining of impressions
  (phantasiai) through reason. Divergence: Epictetus aims at apatheia (freedom from passion) through rational judgment; Patañjali
  aims at kaivalya (isolation of puruṣa) through the dissolution of all vṛtti, including rational thought itself.

  **Dhammapada 5 (Pali Canon):** Both texts assert that harmful action—whether performed, permitted, or approved—perpetuates
  suffering and binds the agent to saṃsāra. Both teach reflection on the causal link between action and duḥkha/dukkha as a
  liberative practice. Divergence: The Dhammapada emphasizes karma and rebirth; Patañjali frames the same principle within
  the puruṣa-prakṛti dualism, locating bondage in the entanglement of consciousness with mental modifications rather than
  in karmic debt across lives.'
insight: The claim here is that the yama of ahimsa is not merely a set of prohibitions but a dynamic regulation of mind, body,
  and speech that aligns the practitioner with the subtle order of prakṛti.
practice: Observe each moment when you approve or tolerate violence, even mildly, and consciously shift your mind to oppose
  it, thereby practicing *pratipakṣabhāvanā*.
