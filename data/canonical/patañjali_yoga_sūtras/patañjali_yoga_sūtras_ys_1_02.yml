title: Suppression of Mental Flux
unit_type: sutra
sanskrit_devanagari: योगः चित्तवृत्तिनिरोधः
sanskrit_iast: yogaś cittavṛttinirodhaḥ
translation_literal: Yoga is the suppression of the transformations of the mind.
commentary: 'The central claim of this aphorism is that yoga is not merely a practice of concentration or meditation, but
  the complete cessation of the mind’s tendency to generate and transform thoughts. The contested move here is the identification
  of the mind’s ‘transformations’ (parinamā) with the entire spectrum of mental activity—from perception to volition—rather
  than limiting yoga to a single technique. In the Sāṃkhya framework, the mind (citta) is the locus of all vṛtti (mental modifications),
  and its unceasing flux is the source of bondage. By declaring yoga as the suppression of these vṛtti, the sutra aligns with
  the Sāṃkhya doctrine that liberation (moksha) arises when puruṣa (consciousness) is disentangled from prakṛti (matter) through
  the cessation of mental activity. Dvivedi’s commentary expands this by parsing the mind into four sub‑principles (manas,
  chitta, ahamkara, buddhi), each capable of generating transformations. The sutra’s claim that yoga is achieved only when
  all these transformations are fully suppressed underscores the existential urgency: unless the mind is still, the self remains
  veiled. This resonates with the practical aim of yoga as a means of attaining samādhi, the state where the mind’s fluctuations
  cease and puruṣa can perceive itself directly. The sutra therefore sets the stage for the subsequent verses that describe
  the gradations of stillness and the ultimate union of self and reality.


  Key Terms


  **citta (चित्त)** — citta (mind) – from ‘cittam’ meaning ‘to be aware’; in Sāṃkhya it is the storehouse of mental modifications;
  the sutra’s emphasis on its suppression highlights the need to quiet the mind’s activity to reveal puruṣa.


  **vṛtti (वृत्ति)** — vṛtti (mental modification) – from ‘vṛtti’ meaning ‘to turn’; in Sāṃkhya it denotes the continuous
  turning of the mind; the sutra’s suppression of vṛtti is the core of yogic practice.


  **puruṣa (पुरुष)** — puruṣa (consciousness) – from ‘puruṣa’ meaning ‘to act’; in Sāṃkhya it is the eternal, unchanging self;
  the sutra’s goal is to free puruṣa from vṛtti.


  **prakṛti (प्रकृति)** — prakṛti (matter) – from ‘prakṛti’ meaning ‘to be born’; in Sāṃkhya it is the dynamic, material reality;
  the sutra implies that puruṣa’s liberation requires detachment from prakṛti’s influence.


  Cross-Tradition Resonances


  **Yoga Sutras 1.1:** Both 1.1 and 1.2 introduce yoga as a process of stilling the mind, but 1.1 frames it as a means to
  attain samādhi, while 1.2 specifies the mechanism (suppression of vṛtti).

  *Divergence:* 1.1 speaks of a goal, 1.2 of a method; the divergence is productive as it moves from abstract aim to concrete
  action.


  **Bhaṭṭa 1.1:** Bhaṭṭa’s first sutra also defines yoga as the cessation of mental modifications, mirroring 1.2’s wording.

  *Divergence:* Bhaṭṭa adds the notion of ‘sādhana’ (practice) whereas 1.2 focuses solely on the suppression aspect.


  **Yogācārabhūmi 1.2:** Yogācārabhūmi similarly describes the suppression of mental flux as the essence of yoga.

  *Divergence:* Yogācārabhūmi introduces the concept of ‘pratītyasamutpāda’ (dependent origination) as a cause of vṛtti, which
  1.2 does not mention, thereby expanding the causal analysis.'
insight: The central claim of this aphorism is that yoga is not merely a practice of concentration or meditation, but the
  complete cessation of the mind’s tendency to generate and transform thoughts.
practice: You now sit in a quiet place, close your eyes, and consciously observe each thought that arises, allowing it to
  pass without engagement, thereby suppressing the mind’s transformations.
