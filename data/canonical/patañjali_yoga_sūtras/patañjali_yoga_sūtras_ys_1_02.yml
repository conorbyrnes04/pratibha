sanskrit_devanagari: योगः चित्तवृत्तिनिरोधः
sanskrit_iast: yogaś cittavṛttinirodhaḥ
translation_literal: Yoga is the stilling of the mind's fluctuations.
commentary: 'This is Patañjali''s opening definition (YS 1.2), and it establishes yoga not as a physical
  practice, philosophy, or belief system, but as a precise technical achievement: the cessation of vritti,
  the constant turning or modification of consciousness. The mind (citta) is understood in Sāṃkhya metaphysics
  as a subtle material instrument—not consciousness itself, but the reflecting surface through which pure
  awareness (puruṣa) perceives the world. Ordinarily, this surface is in constant motion: thoughts, sensations,
  memories, desires, and aversions ripple across it without pause. These fluctuations are vritti—literally
  "turnings" or "modifications." They are not errors to be condemned; they are the mind''s nature. But
  they obscure the mind''s capacity to reflect reality as it is, and they bind awareness to identification
  with mental content. Yoga, then, is the deliberate and sustained suppression (nirodha) of this flux.
  Not annihilation of mind, but its settling into stillness—like sediment in water falling to the bottom
  so the water becomes transparent. When the vritti cease, two things become possible: first, the mind
  reflects without distortion; second, consciousness recognizes itself as distinct from the mind''s movements.
  This definition is radical because it makes yoga a measurable state, not a belief or aspiration. Either
  the fluctuations are present or they are not. Either awareness is caught in the mind''s turning or it
  stands free. The entire eight-limbed path (aṣṭāṅga) that follows is Patañjali''s systematic method for
  achieving this single, transformative stilling.


  Key Terms


  **citta** — The mind-stuff; the subtle material instrument of consciousness in Sāṃkhya metaphysics,
  distinct from pure awareness (puruṣa).

  **vritti** — Fluctuation, modification, or turning of the mind; any movement or content arising in consciousness.

  **nirodha** — Suppression, restraint, or cessation; the stilling or complete arrest of mental modifications.'
insight: The central claim of this aphorism is that yoga is not merely a practice of concentration or
  meditation, but the complete cessation of the mind’s tendency to generate and transform thoughts.
practice: Sit quietly for 10 minutes. Do not try to stop your thoughts. Instead, simply notice the gaps
  between them. When a thought arises, watch it without following it—as you might watch a cloud pass across
  the sky without jumping into it. The moment you notice you have drifted into a thought-stream, gently
  return to the space of noticing itself. You are not suppressing the mind; you are training awareness
  to recognize the stillness that already exists between the mind's movements. Over weeks, these gaps
  naturally lengthen. This is the beginning of nirodha—not force, but recognition.
