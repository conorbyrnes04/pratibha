  items:
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Suppression of Mental Flux”: the sutra’s
      emphasis on its suppression highlights the need to quiet the mind’s activity to reveal puruṣa -> not ‘brain software’
      or an enemy to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: nirodha (निरोध)
    definition: 'ni + √rudh ‘obstruct, restrain’ → cessation/stilling -> in “Suppression of Mental Flux”: the stilling or
      complete arrest of mental modifications -> not annihilation of mind; settling of flux so awareness is no longer hijacked'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Suppression of Mental Flux”: Fluctuation, modification,
      or turning of the mind -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: yoga (योग)
    definition: '√yuj ‘yoke, harness, join’ -> in “Suppression of Mental Flux”: Yoga is the suppression of the transformations
      of the mind. -> not a posture class or romantic ‘union’ fantasy — technical stilling/harnessing of mind'
    lemma_id: yoga
    sense_id: yoga.classical
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Suppression of Mental Flux”: the sutra’s goal
      is to free puruṣa from vṛtti -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
