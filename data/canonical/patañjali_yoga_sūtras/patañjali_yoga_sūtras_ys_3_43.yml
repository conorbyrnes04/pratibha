      error, fantasy, sleep, memory)'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Lightness Through Etheric Balance”: that embodies
      the unimagined flow, highlighting the body’s role as a vehicle for etheric lightness -> not pastoral ‘Nature’; the tri-guṇa
      matrix generating all experience including mind'
  - term: īśvara (ईश्वर)
    definition: '√īś ‘rule, be capable’ → the special puruṣa untouched by kleśa/karma -> in “Lightness Through Etheric Balance”:
      although not explicitly mentioned, the Sūtra’s implication of a guiding force behind the unimagined flow invites the
      reader to consider the subtle role of īśvara in aligning body and ether -> not necessarily a creator-god dogma; Patañjali’s
      omniscient special puruṣa as object of praṇidhāna'
