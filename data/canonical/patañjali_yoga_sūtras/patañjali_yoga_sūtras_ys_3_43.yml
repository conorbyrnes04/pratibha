sanskrit_devanagari: बाहिर अकल्पितः वृत्तिर् महाविदेहाः ततः प्रकाशावरणाक्षयः
sanskrit_iast: bahir akalpitā vṛttir mahāvidehā tataḥ prakāśāvaraṇakṣayaḥ
translation_literal: When the mental fluctuation becomes uncontrivied and external, there is the great
  disembodied state; from this, the obscuration of luminosity dissolves.
commentary: 'This sūtra describes a pivotal threshold in the yogic refinement of consciousness, situated
  within the progression toward kaivalya (liberation). The phrase bahir akalpitā vṛttir—''uncontrivied
  fluctuation that is external''—points to a shift in the nature of mental activity itself. Rather than
  the practitioner forcing or constructing mental states (which would be akalpita in the sense of ''fabricated''),
  the vṛtti becomes spontaneously oriented outward, yet without artifice. This is not distraction; it
  is a natural, effortless transparency of mind.


  Mahāvidehā, the ''great disembodied state,'' does not mean literal separation from the body. In Sāṃkhya-Yoga
  metaphysics, it denotes a condition in which the sense of identification with the physical form and
  its limitations dissolves. The practitioner''s awareness no longer contracts around bodily sensation
  or the ego''s embodied reference point. This is a state of viveka (discrimination) so complete that
  the boundary between ''self'' and ''body'' ceases to be operative.


  From this clarity, prakāśāvaraṇakṣayaḥ—''the decay or dissolution of the veil over luminosity''—occurs
  naturally. Prakāśa (luminosity, radiance) is the inherent clarity of consciousness (puruṣa). In ordinary
  experience, this is obscured by avidyā (ignorance), kleśa (afflictions), and the gravitational pull
  of saṃskāra (latent impressions). When the mind no longer clings to embodied identity, the obscuration
  simply falls away. Light does not need to be created; it needs only to be unveiled.


  This sūtra belongs to the samādhi pāda''s exploration of higher absorptions and the mechanics of liberation.
  It marks the transition from effort-based practice to a state in which the natural radiance of consciousness
  becomes self-evident. The sequence suggests that mahāvidehā is not the final goal but a crucial gateway:
  once the illusion of embodied selfhood dissolves, the obscuring veil over one''s own luminous nature
  cannot persist.


  Key Terms


  **mahāvidehā** — The great disembodied state; a condition in which identification with the physical
  body and its limitations dissolves, revealing consciousness independent of embodied reference.

  **prakāśa** — Luminosity, radiance, or inherent clarity; in Yoga philosophy, the self-revealing nature
  of pure consciousness (puruṣa).

  **akalpitā vṛtti** — An uncontrivied or non-fabricated mental fluctuation; spontaneous mental activity
  free from willful construction or artifice.'
insight: The Sūtra asserts that the outer, unimagined (अकल्पितः) flow of motion (वृत्तिः) inherent in
  the vast bodily form (महाविदेहः) is the very cause of lightness that dissolves the veil of the ether
  (प्रका
practice: 'Release your grip on shaping what arises in your mind—let the next thought, sensation, or perception
  move through you as if it belongs to the space around you rather than to ''you.'' When you notice yourself
  contracting inward to claim or control it, soften your sense of being housed in flesh and bone, and
  allow awareness to extend outward as though your attention has no walls. Repeat this throughout the
  day: the moment you feel the mind''s fabrication loosen, you are touching the great disembodied state.'
