practice: 'Release your grip on shaping what arises in your mind—let the next thought, sensation, or perception move through
  you as if it belongs to the space around you rather than to ''you.'' When you notice yourself contracting inward to claim
  or control it, soften your sense of being housed in flesh and bone, and allow awareness to extend outward as though your
  attention has no walls. Repeat this throughout the day: the moment you feel the mind''s fabrication loosen, you are touching
  the great disembodied state.'
