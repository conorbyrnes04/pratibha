sanskrit_devanagari: बाहिर अकल्पितः वृत्तिर् महाविदेहाः ततः प्रकाशावरणाक्षयः
sanskrit_iast: bahir akalpitā vṛttir mahāvidehā tataḥ prakāśāvaraṇakṣayaḥ
translation_literal: The outer, unimagined flow of motion, vast in bodily form, is the source of lightness that dissolves
  the veil of the ether.
commentary: 'The Sūtra asserts that the outer, unimagined (अकल्पितः) flow of motion (वृत्तिः) inherent in the vast bodily
  form (महाविदेहः) is the very cause of lightness that dissolves the veil of the ether (प्रकाशावरणाक्षयः). This claim foregrounds
  the interdependence of the body and the etheric field: it is not the body alone that achieves lightness, nor the ether alone,
  but the dynamic, unimagined flow that unites them. The contested move is the identification of this flow with the body’s
  vastness; some commentators treat it as a purely metaphysical principle, while others see it as a practical technique. In
  the Yoga and Sāṃkhya tradition, this aligns with the notion that the body, when aligned with the subtle etheric currents,
  can transcend ordinary experience. Practically, the passage invites the practitioner to cultivate a state of non‑conception
  (अकल्पितः) in the flow of bodily movement, thereby dissolving the veil (क्षय) that separates the body from the etheric field.
  By doing so, one achieves a lightness that allows effortless traversal of the ether, a key step toward samādhi and liberation.


  Key Terms


  **vṛtti (वृत्ति)** — vṛtti (IAST) -> वृत्ति (Devanagari) -> ‘flow of motion’; in Sāṃkhya, the dynamic aspect of prakṛti;
  here it is the unimagined, outer flow that dissolves the etheric veil, a nuance lost in simple ‘movement’ translations.


  **prakṛti (प्रकृति)** — prakṛti (IAST) -> प्रकृति (Devanagari) -> ‘nature’ or ‘material reality’; here it refers to the
  vast bodily form (महाविदेहः) that embodies the unimagined flow, highlighting the body’s role as a vehicle for etheric lightness.


  **īśvara (ईश्वरः)** — īśvara (IAST) -> ईश्वरः (Devanagari) -> ‘supreme controller’; although not explicitly mentioned, the
  Sūtra’s implication of a guiding force behind the unimagined flow invites the reader to consider the subtle role of īśvara
  in aligning body and ether.


  Cross-Tradition Resonances


  **Yoga Sūtra 3.43:** Both the outer unimagined flow (बाहिर अकल्पितः) and the vast bodily form (महाविदेहः) are presented
  as the source of lightness, mirroring the earlier claim that the body’s subtle nature enables transcendence.

  *Divergence:* Unlike earlier passages that focus on internal (आन्तर) flows, this Sūtra emphasizes the outer (बाहिर) dimension,
  suggesting a broader scope of practice that includes external environmental alignment.


  **Yoga Sūtra 2.15:** The idea that a particular quality (here, lightness) arises from a specific bodily condition (vastness)
  parallels the claim that the body’s subtle nature (सुखमय) yields the mind’s stillness.

  *Divergence:* While 2.15 links subtle nature to mental stillness, 3.43 links vastness to lightness, indicating a dual pathway
  to liberation: one through subtlety, one through expansiveness.


  **Sāṃkhya Karika 1.4:** Both texts identify the unimagined (अकल्पित) as a key principle in the interaction between prakṛti
  and the subtle realms.

  *Divergence:* Sāṃkhya Karika treats unimagined purely as a metaphysical concept, whereas the Yoga Sūtra applies it concretely
  to bodily movement and etheric traversal.'
