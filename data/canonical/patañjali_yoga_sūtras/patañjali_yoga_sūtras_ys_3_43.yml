practice: Sit comfortably in a quiet place. For 5–10 minutes, practice a simple breath awareness without
  controlling the breath. Notice the natural rhythm of inhalation and exhalation as if you are watching
  it from a distance, neither pushing nor resisting. As you settle, gently shift your attention away from
  the body's sensations (heaviness, temperature, position) and toward the space of awareness itself—the
  'witness' that observes breathing and sensation without being any of them. You are not trying to become
  disembodied or transcendent; simply notice the awareness that is already free of the body's concerns.
  When the mind wanders into thought or bodily sensation, return to this open, external awareness—unforced,
  natural. End by sitting quietly for a minute, allowing any sense of separation between 'observer' and
  'observed' to soften. This simple practice cultivates the shift from internal, constructed mental states
  to an effortless, outward-facing clarity that the sūtra describes.
