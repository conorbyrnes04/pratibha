sanskrit_devanagari: 'मैत्रीकरुणामुदितोकेषाणां सुखदुःखपुण्याभिपुण्यविषयाणां भावनाताश् चित्तप्रसादनम् ॥
  १.३३ ॥


  प्रच्छन्दनविधारणाभ्याम् वा प्राणस्य ॥ १.३४ ॥


  विषयवती वा प्रवृत्तिर उत्पन्ना मनसः स्थिरिनिबन्धनिः ॥ १.३५ ॥


  विसोकाः वा ज्योतिष्मती ॥ १.३६ ॥


  वीतरागविषयं वा चित्तम् ॥ १.३७ ॥


  सपनानिद्राज्ञानालम्बनं वा ॥ १.३८ ॥


  यथाभिमतध्यानाद् वा ॥ १.३९ ॥'
sanskrit_iast: 'maitrīkaruṇāmuditopekṣāṇāṃ sukhaduḥkhapuṇyāpuṇyaviṣayāṇāṃ bhāvanātaś cittaprasādanam ||
  1.33 ||


  pracchardanavidhāraṇābhyāṃ vā prāṇasya || 1.34 ||


  viṣayavatī vā pravṛttir utpannā manasaḥ sthitinibandhanī || 1.35 ||


  viśokā vā jyotiṣmatī || 1.36 ||


  vītarāgaviṣayaṃ vā cittam || 1.37 ||


  svapnanidrājñānālambanaṃ vā || 1.38 ||


  yathābhimatadhyānād vā || 1.39 ||'
translation_literal: '**1.33** By cultivating friendliness toward those who are happy, compassion toward
  those who suffer, joy toward the meritorious, and indifference toward the non-meritorious — serenity
  of mind is attained.

  **1.34** Or through exhalation and retention of the breath.

  **1.35** Or when a sensory experience connected with a subtle object arises, it establishes steadiness
  of mind.

  **1.36** Or by focusing on that which is sorrowless and luminous.

  **1.37** Or by directing the mind toward those who are free from attachment.

  **1.38** Or by taking as support the knowledge derived from dreams and sleep.

  **1.39** Or through meditation on any object of one''s preference.'
commentary: 'Patañjali''s sequence from 1.33 to 1.39 traces a graduated architecture of citta-steadying,
  moving from emotional-cognitive reorientation through prāṇa-manipulation to sensory absorption and finally
  to the mind''s own intrinsic luminosity. The cluster reveals a single argument: the mind (citta) becomes
  stable not through a single method but through a spectrum of approaches calibrated to different temperaments
  and conditions, all converging on the same result—the cessation of vṛtti (mental fluctuations) that
  obscure puruṣa''s witnessing clarity.


  Sūtra 1.33 establishes the affective foundation: maitrī (friendliness), karuṇā (compassion), muditā
  (rejoicing), and upekṣā (equanimous detachment) are not emotional indulgences but precise, active stances
  toward the four cardinal states of experience. They dissolve the egoic bias—the habitual contraction
  toward pleasure and away from pain—that perpetuates vṛtti. This is not passivity but skillful non-identification
  with prakṛti''s emotional colorations.


  Sūtras 1.34–1.35 then offer two complementary somatic paths: prāṇāyāma (breath retention) works through
  the subtle energetic body, creating a momentary pause in the vṛtti''s momentum; sensory absorption (1.35)
  works through deliberate focusing on a single object, collapsing the mind''s oscillation into one-pointed
  attention. Both bypass the need for abstract reasoning and access the body-mind directly.


  Sūtras 1.36–1.38 move inward: the mind''s intrinsic nature is either sorrowless (śoka-free) or luminous
  (prakāśa-full), suggesting that steadiness reveals the mind''s inherent clarity rather than imposing
  it. Meditation on deep sleep (suṣupti) or the knowledge-state that supports it points to the non-dual
  substratum beneath waking consciousness—a direct approach to the puruṣa-prakṛti boundary.


  Sūtra 1.39 concludes with radical permission: practice according to one''s own inclination (iṣṭa-devatā-anuśthānam)
  or habitual focus (abhyāsa). This is not relativism but recognition that the path to samādhi is not
  monolithic; the method matters less than the consistency of application. What unifies all approaches
  is the single intention: the stilling of citta so that puruṣa can recognize itself as eternally free
  (kaivalya). The cluster thus maps a non-linear, multi-entry topology of practice, each sūtra a different
  door into the same silence.


  Key Terms


  **vṛtti** — Mental fluctuations or modifications; the oscillatory patterns of citta that obscure puruṣa''s
  self-recognition

  **upekṣā** — Equanimous detachment or indifference; the active, skillful withdrawal from identification
  with virtue and vice

  **prāṇa** — Life-force or vital breath; the subtle energetic current that governs both bodily and mental
  activity

  **kaivalya** — Absolute isolation or freedom; puruṣa''s recognition of itself as eternally distinct
  from prakṛti


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.48 (yoga is skill in action; samatvaṁ yoga ucyate):** Both texts locate steadiness
  (yoga/samatva) in equanimous action and non-attachment to outcomes rather than in withdrawal. The Gītā''s
  ''perform action without attachment'' mirrors Patañjali''s maitrī-karuṇā framework as an active, engaged
  equanimity. Divergence: The Gītā emphasizes duty (dharma) and action in the world; Patañjali''s sūtras
  are indifferent to ethical content and focus on the mind''s intrinsic mechanics, making Yoga more radically
  phenomenological than the Gītā''s dharmic framework.

  **Epictetus, Enchiridion 1: ''Some things are within our control, others are not'':** Both Stoicism
  and Patañjali''s Yoga locate freedom in the distinction between what can be controlled (one''s response,
  attention, breath) and what cannot (external events, emotions as they arise). Both prescribe a retraining
  of the will through practice. Divergence: Epictetus grounds freedom in rational judgment (prohairesis);
  Patañjali locates it in the pre-rational stilling of citta itself, suggesting that reason is still a
  vṛtti and must be transcended, not perfected.

  **Plotinus, Enneads 5.8.1: ''The mind becomes stable when it turns away from multiplicity toward the
  One'':** Both Neoplatonism and Patañjali describe steadiness as a movement from scattered multiplicity
  (prakṛti''s guṇas, the One''s emanations) toward undivided unity (puruṣa, the One). Both use sensory
  withdrawal and inward focus as the method. Divergence: Plotinus''s One is transcendent and generative;
  Patañjali''s puruṣa is eternally static and witnessing, never creative. The goal is not union with the
  divine source but recognition of one''s own unchanging nature.'
insight: The sūtra asserts that the mind may be fixed upon either the condition of deep sleep or the knowledge
  that sustains it, thereby offering two distinct objects for samādhi.
practice: You cultivate calm by consciously responding to each experience—joy, sorrow, virtue, vice—with
  the corresponding attitude of friendliness, compassion, indifference, or detachment, thereby steadying
  your mind for samādhi.
