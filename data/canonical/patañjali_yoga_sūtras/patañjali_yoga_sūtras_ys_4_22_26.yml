sanskrit_devanagari: 'चितर् अप्रतिसंक्रमायास तदाकारापत्तौ स्वबुद्धिसंवेदनम् ॥ ४.२२ ॥


  दर्श्तृदृश्योपरक्तं चित्तं सर्वार्थम् ॥ ४.२३ ॥


  तद् असंख्येयवासनाभिः चित्रम् अपि परार्थं समहत्वकृत्वात् ॥ ४.२४ ॥


  विशेषदर्शिन आत्माभावभावनानिवृत्तिḥ ॥ ४.२५ ॥


  तदाः विवेकनिम्नं काविल्यप्राग्भारं चित्तम् ॥ ४.२६ ॥'
sanskrit_iast: 'citer apratisaṃkramāyās tadākārāpattau svabuddhisaṃvedanam || 4.22 ||


  draṣṭṛdṛśyoparaktaṃ cittaṃ sarvārtham || 4.23 ||


  tad asaṃkhyeyavāsanābhiś citram api parārthaṃ saṃhatyakāritvāt || 4.24 ||


  viśeṣadarśina ātmabhāvabhāvanānivṛttiḥ || 4.25 ||


  tadā vivekanimnaṃ kaivalyaprāgbhāraṃ cittam || 4.26 ||'
translation_literal: '**4.22** When consciousness, which does not transmigrate, assumes that (puruṣa''s)
  form, there is awareness of one''s own intelligence.

  **4.23** The mind, colored by both the seer and the seen, comprehends all objects.

  **4.24** Though variegated by countless latent impressions, it exists for the sake of another, because
  it operates through association.

  **4.25** For one who perceives the distinction, there is cessation of cultivation of the sense of self-nature.

  **4.26** Then the mind, inclined toward discrimination, gravitates toward liberation.'
commentary: 'These five sūtras trace the final movement of yoga: the mind''s recognition of its own instrumentality
  and the consequent dissolution of mental activity into kaivalya (absolute independence). The argument
  unfolds in three stages. First, 4.22 establishes the foundational asymmetry: the Puruṣa''s consciousness
  is immutable (apratisaṃkramāyās), and the mind (citta) becomes self-aware only by reflecting that unchanging
  awareness—not by generating its own light, but by becoming a mirror. This is the crucial Sāṃkhya move:
  consciousness belongs to Puruṣa alone; the mind is prakṛti, inert, yet capable of taking the form of
  what it observes. Second, 4.23–4.24 deepen the paradox. The citta, colored by both Seer and seen (dṛṣṭṛ-dṛśya),
  becomes ''all-thing'' (sarva-artham)—not through expansion but through the recognition that its apparent
  multiplicity of desires and objects is unified within a single field of perception. Yet this very omniscience
  of the mind-field is revealed as purposive only for another (parārtham): the mind exists to serve the
  Puruṣa''s self-recognition, not its own. The mind''s agency is thus exposed as borrowed, dependent,
  instrumental. Third, 4.25–4.26 complete the reversal. The discriminating one (viveka-khyāti) who clearly
  distinguishes Self from mind ceases all mental activity (vṛtti-nirodha) forever—not through suppression
  but through the insight that mental activity was never truly one''s own. With that cessation, the mind
  itself ''inclines toward discrimination'' (viveka-khyāti-abhiniveśa) and gravitates toward kaivalya.
  The mind does not disappear; it reorients, its restlessness transmuted into a steady inclination toward
  the state where Puruṣa stands alone, witnessing nothing, needing nothing, free. The cluster''s central
  move is the inversion of agency: by recognizing that the mind''s apparent autonomy masks a complete
  dependence on the Puruṣa, the practitioner releases the exhausting illusion of being the doer and becomes
  the witness of the mind''s own dissolution into its true nature—a transparent instrument of the Self''s
  eternal freedom.


  Key Terms


  **apratisaṃkramāyās** — unchangeable, immutable; the quality of Puruṣa''s consciousness that does not
  pass into or transform through the flux of prakṛti

  **parārtham** — for another''s purpose; the principle that prakṛti (including citta) exists not for
  itself but to serve the Puruṣa''s self-recognition

  **viveka-khyāti** — discrimination, discernment; the clear, unwavering distinction between Puruṣa and
  prakṛti that precipitates kaivalya

  **kaivalya** — absolute independence, isolation; the state in which Puruṣa is freed from identification
  with prakṛti and the mind ceases its fluctuations


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47 (''yoga is skill in action''; ''yogaḥ karmasu kauśalam''):** Both texts reframe
  agency as instrumental service: the Gītā teaches action without attachment to fruits; Yoga Sūtra 4.22–4.26
  teaches that the mind''s activity is purposive only when aligned with the Puruṣa, not for its own satisfaction.
  Divergence: The Gītā permits and valorizes ethical action in the world; the Yoga Sūtras culminate in
  the cessation of all mental activity (vṛtti-nirodha) and withdrawal into kaivalya, a more radical renunciation
  of prakṛti''s play.

  **Plotinus, Enneads V.8.11 (the One''s self-sufficiency and the emanation of Intellect):** Both posit
  an immutable, self-sufficient principle (Puruṣa/the One) and a secondary principle (citta/Intellect)
  that exists to reflect and serve the higher reality, achieving its fulfillment through that service.
  Divergence: Plotinus emphasizes the beauty and necessity of emanation and the Intellect''s eternal contemplation
  of the One; the Yoga Sūtras emphasize the final disentanglement and isolation (kaivalya) of Puruṣa from
  prakṛti, a stark dualism rather than a continuous hierarchy.

  **Epictetus, Enchiridion 1 (''some things are within our control, others are not''):** Both distinguish
  between what truly belongs to the self and what does not: Epictetus separates will (prohairesis) from
  external impressions; Yoga Sūtra 4.25 separates Puruṣa (the true Self) from the mind''s activity, freeing
  the practitioner from false ownership of mental fluctuations. Divergence: Epictetus remains engaged
  with the world through disciplined will and virtue; the Yoga Sūtras move toward complete withdrawal
  from prakṛti into kaivalya, where the Puruṣa witnesses nothing and acts not at all.'
