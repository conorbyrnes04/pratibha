- kind: commentary
  label: Pratibha Commentary
  body: 'The claim that the essence of a posture is its steadiness and ease is a decisive move in the
    Yoga tradition, distinguishing the physical from the metaphysical. In the Sādhana Pāda, the third
    accessory, aśana, is presented not as a mere bodily arrangement but as a gateway to the stability
    required for higher meditative states. The insistence on steadiness (sthira) anticipates the later
    Samādhi, where the mind must be as still as the body. Ease (sukha) counters the notion that austerity
    must be painful; it aligns with the Sāṃkhya idea that the prakṛti–puruṣa interaction can be harmonious
    when the body does not become a source of suffering. This interpretation is reinforced by Dvivedi’s
    comment that the posture should not cause pain, echoing the yogic principle that the body should be
    an instrument, not a burden. Practically, this means that a practitioner should choose a posture that
    feels stable and comfortable, thereby preventing the mind from being distracted by physical discomfort.
    Such an approach is crucial for the existential application of yoga: it allows the practitioner to
    inhabit the body without becoming attached to it, thereby facilitating the dissolution of vṛtti and
    the realization of puruṣa’s true nature.


    The philosophical significance lies in the shift from external form to internal quality. By prioritising
    steadiness and ease, the sutra sets the stage for the subsequent emphasis on the mind’s stillness,
    thereby linking the physical discipline to the ultimate goal of self-realisation. It also subtly critiques
    the tendency in some traditions to equate yoga with extreme austerity, offering a more balanced path
    that respects the body’s limits while still pursuing spiritual depth.


    Key Terms


    **sthira (स्थिर)** — steady -> stability of body -> foundational for mental stillness


    **sukha (सुख)** — ease -> absence of pain -> aligns with non-attachment


    **aśana (आसन)** — posture -> physical anchor for meditation -> gateway to samādhi


    Cross-Tradition Resonances


    **Yoga Sutra 2.46, Dvivedi Commentary:** Both emphasize steadiness and ease as defining features of
    aśana

    *Divergence:* Dvivedi expands to include avoidance of pain, while the sutra remains succinct


    **Yoga Sutra 2.47, Patanjali:** Transition to the next accessory, vinyāsa, builds on the steadiness
    of aśana

    *Divergence:* Patanjali introduces a dynamic aspect (movement) that contrasts with the static emphasis
    here


    **Yoga Sutra 1.1, Patanjali:** The ultimate aim of samādhi requires steadiness, echoing the sutra’s
    focus

    *Divergence:* The first sutra speaks of the mind’s stillness, whereas 2.46 focuses on bodily steadiness'
