sanskrit_devanagari: स्थिरसुखम् आसनम्
sanskrit_iast: sthirasukham āsanam
translation_literal: An āsana is that which is both steady and comfortable.
commentary: 'This foundational sūtra (II.46) defines āsana—the physical postures that form the third limb
  of Patañjali''s eightfold path—by two essential qualities that must coexist: sthira (firmness, stability,
  rootedness) and sukha (ease, lightness, pleasantness). Neither alone suffices. A posture held rigidly
  without comfort becomes mere strain; one pursued for comfort alone collapses into slackness and loses
  its integrity.


  Within the Yoga–Sāṃkhya framework, āsana is not gymnastics or display. It is a deliberate seat—literally
  and functionally—that prepares the body-mind for the deeper work of breath regulation (prāṇāyāma) and
  meditation (dhyāna). The body must be stable enough to sit without fidgeting or pain, yet relaxed enough
  that the nervous system can settle and attention can turn inward. This paradox—alert repose—is the gateway.


  The sūtra teaches that perfection in āsana comes not from achieving a difficult shape, but from finding
  the precise balance point where effort and surrender meet. This principle applies to every posture,
  from simple seated positions to complex backbends. When sthira and sukha are both present, the āsana
  becomes a vehicle for stillness rather than an end in itself.


  Key Terms


  **sthira** — Steadiness, firmness, stability; the quality of being grounded and unwavering

  **sukha** — Ease, comfort, lightness; the quality of being free from strain or obstruction

  **āsana** — A stable and comfortable seat or posture; the physical foundation for meditation and breath
  work'
insight: The claim that the essence of a posture is its steadiness and ease is a decisive move in the
  Yoga tradition, distinguishing the physical from the metaphysical.
practice: In your next āsana, press your feet or hands into the ground until you feel sthira arise—a clear
  rootedness—then soften your breath and shoulders until sukha appears alongside it. Hold only as long
  as both qualities coexist; the moment one vanishes, release and begin again.
