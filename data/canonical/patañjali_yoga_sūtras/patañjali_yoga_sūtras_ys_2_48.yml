sanskrit_devanagari: ततो द्वन्द्वानबिग्धात्
sanskrit_iast: tato dvandvānabhighātaḥ
translation_literal: From that, the pairs of opposites no longer strike or harm.
commentary: 'This sūtra (II.48) marks a pivotal threshold in the yogic path. It follows the mastery of
  āsana and prāṇāyāma—the stabilization of the body and breath—and describes the immediate fruit: freedom
  from the constant assault of dvandva, the dualistic pairs (heat and cold, pleasure and pain, gain and
  loss, praise and blame).


  In the Yoga–Sāṃkhya framework, the pairs of opposites are not merely psychological reactions; they are
  the fundamental oscillations of prakṛti (nature), the field of guṇas (qualities) in constant flux. The
  ordinary mind is perpetually buffeted by these contrasts—attraction and aversion, comfort and discomfort—because
  it remains identified with the body and its sensations. When āsana becomes firm and easy (sthira-sukham),
  and when prāṇāyāma establishes rhythmic control of the vital currents, the nervous system achieves a
  new baseline stability. The body no longer sends urgent distress signals; the breath no longer races
  in reaction to circumstance.


  The word abhighātaḥ (from abhi-√han, to strike or wound) suggests that the pairs no longer *wound* or
  *penetrate* the practitioner''s equanimity. This is not dissociation or numbness; it is resilience born
  from genuine steadiness. The yogi remains aware of temperature, sensation, and circumstance, but they
  no longer trigger the habitual contractions of the mind. This is the foundation upon which pratyāhāra
  (sense withdrawal) and dhāraṇā (concentration) become possible—the mind can now turn inward without
  being dragged outward by the relentless tug of preference and aversion.


  This verse also signals a shift in the text''s focus: from external practices (limbs 1–2) to internal
  disciplines (limbs 3–8). The body and breath have done their work; now the mind can be refined.


  Key Terms


  **dvandva** — The pairs of opposites (heat–cold, pleasure–pain, gain–loss); the fundamental dualistic
  oscillations of prakṛti that condition ordinary consciousness.

  **abhighāta** — Striking, wounding, or penetrating harm; the impact or disturbance caused by the pairs
  of opposites on an unstable mind.

  **prakṛti** — Nature; the field of material manifestation composed of the three guṇas (sattva, rajas,
  tamas), which generates all change and duality.'
insight: The claim here is that the disciplined practitioner, having attained a state of samādhi, transcends
  the ordinary dualistic perception of the world.
practice: 'When heat or cold touches your skin, or when praise or blame reaches your ear, pause and notice:
  do not move toward or away from it for three full breaths. Let the sensation or word pass through your
  awareness as you remain rooted in your seat, neither grasping nor rejecting, until the impulse to react
  dissolves on its own.'
