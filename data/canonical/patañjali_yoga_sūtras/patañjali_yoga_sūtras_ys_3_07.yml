sanskrit_devanagari: त्रयम् अन्तरङ्गं पूर्वेभ्यः
sanskrit_iast: trayam antaraṅgaṃ pūrvebhyaḥ
translation_literal: These three are the inner limbs, set apart from what came before.
commentary: 'This sūtra marks a decisive threshold in Patañjali''s eightfold path. The first five limbs—yama,
  niyama, āsana, prāṇāyāma, and pratyāhāra—are preparatory disciplines that work with the body, breath,
  and sensory field. They are external (bahiraṅga) in the sense that they engage with observable conduct,
  physical posture, and the mechanics of withdrawal.


  The three inner limbs (antaraṅga) that follow—dhāraṇā (concentration), dhyāna (meditation), and samādhi
  (absorption)—constitute the direct work of consciousness itself. They are "inner" because they operate
  entirely within the mind''s capacity to sustain, deepen, and ultimately transcend the distinction between
  observer and observed.


  This trichotomy reflects the Yoga–Sāṃkhya framework: the outer limbs prepare the instrument (the body-mind
  complex); the inner limbs deploy that instrument toward its ultimate aim—the isolation and recognition
  of puruṣa (pure awareness) as distinct from prakṛti (nature). The word pūrvebhyaḥ ("from the former
  ones") signals that this is not a rejection of earlier practice but a natural progression. Without the
  stability, breath-control, and sensory mastery of the outer limbs, the inner work cannot take root.


  This verse also establishes the hierarchy of yoga: external discipline creates the conditions; inner
  practice is the actual realization.


  Key Terms


  **antaraṅga** — Inner limb; the three practices (dhāraṇā, dhyāna, samādhi) that work directly with consciousness
  rather than body or breath.

  **bahiraṅga** — Outer limb; the five preliminary disciplines (yama through pratyāhāra) that prepare
  the body-mind instrument.

  **dhāraṇā** — Concentration; the binding of attention to a single point, the first of the three inner
  limbs.'
insight: The passage asserts that the three core practices of Yoga—prāṇāyāma, dhāraṇā, and dhyāna—constitute
  the very heart of the discipline, in contrast to the ancillary techniques described elsewhere.
practice: 'At the threshold between one activity and the next—rising from a meal, closing a door, ending
  a conversation—pause and notice: have you been living in the outer limbs (body moving, senses gathering)
  or have you crossed into the inner? Whisper *antaraṅga* (inner) three times, feeling the word draw your
  awareness from the periphery inward, and carry that recognition into what comes next.'
