- kind: practice
  label: Practice (Abhyasa)
  body: When you feel a thought arise, pause, and in that instant apply restraint, then immediately discern whether the thought
    reflects true reality or mere mental fluctuation.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: The Yogi should neither accept nor smile with pride at the admiration of even the celestial beings, as there is the
    possibility of getting caught again in the undesirable.
