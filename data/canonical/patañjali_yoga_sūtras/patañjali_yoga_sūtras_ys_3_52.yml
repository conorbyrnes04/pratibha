sanskrit_devanagari: क्षणतत्क्रमायः संयमाद् विवेकजम् ज्ञानम्
sanskrit_iast: kṣaṇatatkramayoḥ saṃyamād vivekajaṃ jñānam
translation_literal: Through sustained meditative focus on the moment and the sequence of moments, knowledge born of discernment
  arises.
commentary: 'This sūtra addresses a subtle but transformative capacity: the ability to perceive the distinction between the
  present instant and the flow of time itself. In classical Yoga–Sāṃkhya, reality is understood as a succession of discrete
  moments (kṣaṇa), each arising and dissolving instantaneously. Most minds move through time in a blur, unable to isolate
  individual moments or recognize the gap between them. The practice of saṃyama (concentration, meditation, and absorption
  fused into one) applied to both kṣaṇa (the singular moment) and tatkrama (the sequence or succession of moments) creates
  a friction—a deliberate attention that reveals the mechanism of time itself. This is vivekajaṃ jñānam: knowledge that arises
  from viveka, discrimination or discernment. It is not intellectual knowledge but direct perception of how consciousness
  moves through time, how the unchanging witness observes the constant flux of phenomena. This discernment is liberating because
  it reveals that the true Self (puruṣa) stands apart from temporal succession; it is the eternal witness of moments, not
  bound by them. The practice develops what might be called temporal clarity—the ability to see through the illusion of continuous
  duration into the granular reality beneath it.


  Key Terms


  **kṣaṇa** — A discrete moment or instant; the smallest unit of time in classical Yoga–Sāṃkhya philosophy.

  **tatkrama** — The sequence or succession of moments; the flow or order of temporal progression.

  **viveka** — Discrimination or discernment; the capacity to distinguish between the eternal Self and the changing phenomenal
  world.'
insight: The central claim of this verse is that true insight is not a passive accumulation of experience but an active, moment‑to‑moment
  discernment that arises when the yogi exercises restraint.
practice: 'Between one heartbeat and the next, pause and ask: which moment am I in now? Then wait for the next pulse and ask
  again—not to answer, but to feel the actual gap where one instant dies and another is born. Repeat this three times, letting
  the space between beats become your teacher.'
