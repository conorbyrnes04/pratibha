sanskrit_devanagari: ध्रुवे तदगतिज्ञानम्
sanskrit_iast: dhruve tadgatijñānam
translation_literal: When the object of knowledge becomes stable, there arises direct knowing of its nature.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on samādhi and the progressive
  refinement of perception. The word dhruve (in the locative case, ''in/when stable'') refers to the settling
  or fixing of an object in consciousness—not merely intellectual knowledge, but the stilling of mental
  fluctuation around that object. Tadgati-jñānam is the knowing that flows from or penetrates into (gati)
  the very movement and nature (tad) of the thing itself.


  Within the Yoga–Sāṃkhya framework, this describes a crucial transition: ordinary knowledge (pramāṇa)
  is mediated by the fluctuating mind (vrtti). But when the mind ceases its restless modification and
  becomes one-pointed (ekāgra), a direct, non-dual knowing emerges. The object is no longer filtered through
  mental habit, doubt, or conceptual overlay. This is not mystical rapture but precise epistemological
  clarity—the knower and known align.


  Practically, this reflects the yogic principle that stability (dhāraṇā) precedes insight (dhyāna). A
  wavering attention gathers only fragments and impressions. A held, unwavering attention permits the
  intrinsic nature of the object to reveal itself. This applies equally to external objects (a flame,
  a mantra, a visual form) and internal states (breath, sensation, the sense of ''I'').


  The sūtra also implies that knowledge is not imposed from outside but emerges from the meeting of a
  steady mind with its object. This is why Patañjali emphasizes practice (abhyāsa) and non-attachment
  (vairāgya)—they create the conditions for the mind to become dhruve, and thus for true knowing to arise.


  Key Terms


  **dhruve** — Fixed, stable, immovable; here, the settling of the mind into unwavering focus on a single
  object or point.

  **tadgati-jñānam** — Direct knowing of the nature or movement (gati) of that (tad) object; knowledge
  that arises from intimate, non-mediated contact with what is observed.

  **vrtti** — Mental fluctuation or modification; the restless, habitual patterns of thought that obscure
  clear perception.'
insight: The sutra asserts that true knowledge is not a fleeting insight but a stable, unchanging awareness
  of what is already known.
practice: 'Choose a simple, tangible object: a candle flame, a stone, a single word (mantra), or even
  the sensation of your breath at the nostrils.


  1. Sit comfortably and direct your gaze or attention to this object for 2–3 minutes without looking
  away or mentally drifting.


  2. Notice the first minute: your mind will wander, judge, compare, remember. This is normal vrtti (mental
  fluctuation).


  3. In the second minute, gently return attention each time it strays. Do not force; simply notice and
  return, as if coaxing a child back to a game.


  4. By the third minute, you may notice a subtle shift: the object seems to ''hold'' your attention rather
  than you holding it. The flame appears brighter, or the breath more vivid. Thoughts thin. This is the
  beginning of dhruve—stability.


  5. Remain in this steadiness for another minute if possible. Do not analyze what is happening; simply
  rest in the clarity.


  6. Practice this daily for 5–10 minutes. Over weeks, you will notice that the object''s nature becomes
  more apparent—not through thinking, but through a kind of intimate, non-conceptual knowing. This is
  tadgati-jñānam beginning to unfold.'
