pratibha_layers:
- kind: original
  label: Original
  body: तैव सर्वबीजः समाधिः
- kind: iast
  label: IAST
  body: tā eva sabījaḥ samādhiḥ
- kind: translation
  label: Pratibha Translation
  body: This very state is [samādhi] in which the mind is seeded.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim here is that the very essence of samādhi is that it is a seed—an embryonic, potentialized
    state that, upon awakening, can sprout into myriad distractions. In the Yoga and Sāṃkhya traditions,
    samādhi is the culmination of the pratyāhāra–pratibimba–pratyāhāra cycle, where the mind’s fluctuations
    (vṛtti) are stilled. Yet the term ‘seeded’ (sabījaḥ) signals that this stillness is not a static emptiness
    but a dynamic locus of potential. The Sūtra therefore positions samādhi as a fertile ground for the
    emergence of consciousness, aligning with the Sāṃkhya view that puruṣa (consciousness) and prakṛti
    (matter) are distinct yet interrelated. The Dvivedi commentary’s observation that the seed may grow
    into distractions mirrors the Sāṃkhya notion that prakṛti’s subtle energies (gunas) can reawaken vṛtti
    when puruṣa’s attention lapses. Existentially, this invites practitioners to recognize that even the
    highest meditative state remains a potentiality that must be continually nurtured; the seed must be
    tended lest it sprout into the very mental clutter it seeks to transcend. Thus, the Sūtra offers a
    paradoxical prescription: to achieve samādhi, one must cultivate a mind that remains a seed—ready
    to blossom into higher awareness while resisting the pull of lower distractions.


    Key Terms


    **samādhi (समाधिः)** — root: samā (together) + dhī (to think) -> a state of togetherness of mind;
    in Sūtra it is the culmination of vṛtti control, but the term ‘seeded’ adds a dynamic potentiality
    not captured by the simple ‘concentration’ translation.


    **vṛtti (वृत्ति)** — fluctuation of the mind; in Sāṃkhya, the 12 modes of prakṛti; here it is the
    obstacle that samādhi seeks to still.


    **purūṣa (पुरुषः)** — consciousness, the subject; distinct from prakṛti; its role is to observe and
    sustain the seed.


    **prakṛti (प्रकृति)** — material nature, the source of vṛtti; its subtle energies can reawaken distractions
    from the seed.


    Cross-Tradition Resonances


    **Yoga Sūtra 1.45:** Both 1.45 and 1.46 describe samādhi as a state of stillness; 1.45 speaks of ‘samādhiḥ’
    as the cessation of vṛtti, while 1.46 adds the qualifier ‘seeded’ indicating potentiality.

    *Divergence:* 1.45 presents samādhi as a static cessation, whereas 1.46 introduces dynamic potential,
    suggesting that even in stillness, the mind harbors latent possibilities.


    **Sāṃkhya Kāṇḍa 2, 3:** The notion of a seed aligns with the Sāṃkhya idea that puruṣa and prakṛti
    co‑exist in a latent state, awaiting activation.

    *Divergence:* While Sāṃkhya treats the seed as a metaphysical principle, the Sūtra grounds it in experiential
    practice, making it actionable for meditators.


    **Dvivedi, Commentary on 1.46:** Dvivedi’s observation that the seed may sprout into distractions
    echoes the Sūtra’s implicit warning about the fragility of samādhi.

    *Divergence:* Dvivedi expands the metaphor to a cautionary note, whereas the Sūtra merely states the
    condition, leaving the implication to the reader.


    **Patanjali, Mahāyoga 1.1:** Both texts emphasize the importance of controlling vṛtti to attain samādhi.

    *Divergence:* Patanjali’s Mahāyoga presents a systematic path (yama, niyama, etc.) leading to samādhi,
    while the Sūtra offers a succinct definition without procedural detail.'
- kind: key_terms
  label: Key Terms
  items:
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Seeded Meditation”: in Sūtra it is the
      culmination of vṛtti control, but the term ‘seeded’ adds a dynamic potentiality not captured by
      the simple ‘concentration’ translation -> not trance-entertainment or unconsciousness; graded absorption
      where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: sabīja (सबीज)
    definition: 'sa + bīja ‘with seed’ -> in “Seeded Meditation”: a meditative state in which an object
      persists as the anchor of awareness, contrasted with seedless (nirbīja) absorption -> not botanical
      metaphor only; samādhi still carrying latent object/seed vs seedless'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Seeded Meditation”: here it is the
      obstacle that samādhi seeks to still -> not ‘bad thoughts’ only — any cognitive wave (valid cognition,
      error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Seeded Meditation”: its role
      is to observe and sustain the seed -> not ‘person’ as social self; the unchanging witness distinct
      from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Seeded Meditation”: its subtle
      energies can reawaken distractions from the seed -> not pastoral ‘Nature’; the tri-guṇa matrix generating
      all experience including mind'
