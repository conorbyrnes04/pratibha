title: Seeded Meditation
unit_type: sutra
sanskrit_devanagari: तैव सर्वबीजः समाधिः
sanskrit_iast: tā eva sabījaḥ samādhiḥ
translation_literal: That same absorption is called seeded when it contains a seed—an object of meditation
  that remains.
commentary: 'This sūtra distinguishes sabīja samādhi (seeded absorption) from nirbīja samādhi (seedless
  absorption), a crucial threshold in Patañjali''s map of meditative states. In sabīja samādhi, the meditator''s
  mind becomes unified with an object—whether a mantra, a visual form, a concept, or a subtle sensation—but
  that object persists as the ''seed'' (bīja) around which consciousness crystallizes. The mind is no
  longer scattered across multiple thoughts, yet it has not dissolved into undifferentiated awareness.
  The seed is what keeps the meditation anchored; it is both support and limitation.


  Within the Yoga–Sāṃkhya framework, sabīja samādhi represents a state where prakṛti (nature, manifestation)
  is still present as the object of attention. The individual consciousness (puruṣa) has withdrawn from
  the external world and from mental chatter, but has not yet transcended the subtle realm of objects
  altogether. This is the gateway: profound peace and insight become available here, yet the duality of
  knower and known persists. All the siddhis (powers) and the fruits of yoga practice—clarity, healing,
  intuitive knowledge—can unfold in this state. Yet according to Patañjali, liberation (kaivalya) requires
  going further, to nirbīja samādhi, where even the seed dissolves.


  The practical significance is immense: sabīja samādhi is accessible and stable. It can be cultivated
  deliberately through technique. A meditator can return to it reliably. For most practitioners, this
  is where real transformation begins—where the nervous system finds genuine rest, where insight into
  the nature of mind becomes direct, and where the sense of separate selfhood begins to loosen without
  yet vanishing entirely.


  Key Terms


  **bīja** — Seed; the object of meditation that remains as the focus of unified consciousness in seeded
  absorption.

  **samādhi** — Absorption; a state of unified consciousness in which the meditator, the act of meditation,
  and the object of meditation merge into one.

  **sabīja** — With seed; a meditative state in which an object persists as the anchor of awareness, contrasted
  with seedless (nirbīja) absorption.'
insight: The claim here is that the very essence of samādhi is that it is a seed—an embryonic, potentialized
  state that, upon awakening, can sprout into myriad distractions.
practice: 'Choose a single, simple object: the natural breath at the nostrils, a sacred syllable (like
  ''om''), or a steady internal point of light. Sit comfortably for 10–15 minutes. Close your eyes. Without
  forcing, gently direct your attention to this object. When your mind wanders—and it will—notice the
  wandering without judgment, and return to the object. Do not try to make the mind blank or to achieve
  any special state. The practice is simply the return itself, again and again. Over weeks, you will notice
  moments where the object becomes luminous, where your sense of breathing-as-separate-from-you dissolves,
  where time feels different. These are glimpses of sabīja samādhi: the mind unified around a seed, the
  chatter stilled, yet the seed itself still present. This is the foundation. Rest here, and let it deepen
  naturally.'
