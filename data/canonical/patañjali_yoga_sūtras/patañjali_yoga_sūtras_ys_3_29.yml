sanskrit_devanagari: नाभिकृ काया-व्यूहज्ञानम्
sanskrit_iast: nābhicakre kāyavyūhajñānam
translation_literal: In the wheel at the navel center, knowledge of the body's arrangement arises.
commentary: 'This sūtra belongs to the Vibhūti Pāda (Book III), where Patañjali describes siddhis—extraordinary capacities—that
  emerge from deep concentration (samādhi) on specific objects or centers. The nābhicakra (navel wheel or solar plexus) is
  one of the principal energy centers in yogic anatomy. When the practitioner''s attention becomes absorbed in this locus
  through sustained meditation, a particular kind of jñānam (knowing) manifests: direct, non-conceptual understanding of kāyavyūha—the
  structural organization and distribution of the body itself.


  This is not intellectual knowledge of anatomy. Rather, it is an immediate, luminous perception of how the body is arranged—its
  proportions, channels (nāḍī), elements, and vital currents. The yogi perceives the body not as a solid mass but as an organized
  field of energy and form. This knowing arises spontaneously when the mind becomes one-pointed at the navel center; it is
  a natural fruit of that concentration, not something to be grasped or forced.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that consciousness (puruṣa), when stabilized in a particular
  region of prakṛti (nature/body), gains direct insight into that region''s nature. The navel center is traditionally associated
  with digestion, transformation, and the integration of vital forces. Knowledge arising here pertains to the body''s wholeness
  and coherence—a holistic somatic knowing that transcends ordinary proprioception.


  Key Terms


  **nābhicakra** — The wheel or center at the navel; the solar plexus; a primary energy locus in yogic anatomy

  **kāyavyūha** — The arrangement, distribution, or structural organization of the body as a unified whole

  **jñānam** — Direct, non-dual knowing or insight that arises spontaneously from concentrated absorption'
insight: The sūtra asserts that disciplined bodily alignment toward a fixed celestial point yields insight into the cosmos.
practice: Place your palm flat against your navel and feel the warmth there for three breaths, then slowly trace upward with
  one finger along the midline of your torso—sternum, throat, chin—noticing how the body reveals itself as channels and currents
  rather than solid matter. Repeat this tracing whenever you feel fragmented, letting the finger's path teach you the body's
  own architecture.
