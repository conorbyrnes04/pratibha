sanskrit_devanagari: नाभिकृ काया-व्यूहज्ञानम्
sanskrit_iast: nābhicakre kāyavyūhajñānam
translation_literal: In the wheel at the navel center, knowledge of the body's arrangement arises.
commentary: 'This sūtra belongs to the Vibhūti Pāda (Book III), where Patañjali describes siddhis—extraordinary
  capacities—that emerge from deep concentration (samādhi) on specific objects or centers. The nābhicakra
  (navel wheel or solar plexus) is one of the principal energy centers in yogic anatomy. When the practitioner''s
  attention becomes absorbed in this locus through sustained meditation, a particular kind of jñānam (knowing)
  manifests: direct, non-conceptual understanding of kāyavyūha—the structural organization and distribution
  of the body itself.


  This is not intellectual knowledge of anatomy. Rather, it is an immediate, luminous perception of how
  the body is arranged—its proportions, channels (nāḍī), elements, and vital currents. The yogi perceives
  the body not as a solid mass but as an organized field of energy and form. This knowing arises spontaneously
  when the mind becomes one-pointed at the navel center; it is a natural fruit of that concentration,
  not something to be grasped or forced.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that consciousness (puruṣa), when stabilized
  in a particular region of prakṛti (nature/body), gains direct insight into that region''s nature. The
  navel center is traditionally associated with digestion, transformation, and the integration of vital
  forces. Knowledge arising here pertains to the body''s wholeness and coherence—a holistic somatic knowing
  that transcends ordinary proprioception.


  Key Terms


  **nābhicakra** — The wheel or center at the navel; the solar plexus; a primary energy locus in yogic
  anatomy

  **kāyavyūha** — The arrangement, distribution, or structural organization of the body as a unified whole

  **jñānam** — Direct, non-dual knowing or insight that arises spontaneously from concentrated absorption'
insight: The sūtra asserts that disciplined bodily alignment toward a fixed celestial point yields insight
  into the cosmos.
practice: 'Sit comfortably with an upright spine. Close your eyes and bring your attention to the space
  just above your navel, at the solar plexus. Do not strain or imagine; simply rest your awareness there.
  Breathe naturally. On each exhale, feel a gentle settling at that center. After 2–3 minutes of this
  settling, begin to sense—without forcing—the overall shape and presence of your body as a unified field
  radiating from that point. Notice how your limbs, head, and torso seem to organize around this hub.
  You are not visualizing; you are sensing the body''s coherence from its center. Practice for 10–15 minutes
  daily. Over weeks, a subtle but unmistakable shift may occur: the body no longer feels like separate
  parts but as an integrated whole, and a quiet knowing of its arrangement may dawn.'
