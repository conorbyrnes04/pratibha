sanskrit_devanagari: नाभिकृ काया-व्यूहज्ञानम्
sanskrit_iast: nābhicakre kāyavyūhajñānam
translation_literal: You gain knowledge of the stars by focusing your body’s alignment on the pole star.
commentary: 'The sūtra asserts that disciplined bodily alignment toward a fixed celestial point yields insight into the cosmos.
  This claim situates the practice within the Sāṃkhya–Yoga framework, where the body (kāya) is a vehicle for the mind (citta)
  to perceive the underlying reality (prakṛti). The pole star (nābhicakre) is a metaphor for a stable, unchanging point of
  reference—akin to the puruṣa’s unaltered awareness. By aligning the body (kāyavyūha) with this point, the practitioner stabilizes
  the mind’s fluctuations (vṛtti), enabling the direct apprehension of the stars’ movement (tad gati). The existential import
  is that one can map the external order of the universe by first mastering the internal order of the body and mind. The Satchidananda
  aphorism frames this as a “body anchor”: the body, when disciplined, becomes a fixed point from which the mind can observe
  the dynamic processes of reality. This mirrors the traditional Yoga aim of using the body as a tool for samādhi, yet it
  emphasizes the external, empirical knowledge that arises from internal discipline. The sūtra thus bridges the metaphysical
  goal of liberation with the practical method of bodily stabilization, underscoring that the path to insight begins with
  the physical alignment of the practitioner’s body toward a constant point of reference.


  Key Terms


  **nābhicakre (नाभिकृ)** — nâbhicakre: ‘at the pole star’ (nâbhi‑ ‘at the navel’ + cakre ‘at the point’). In Sāṃkhya, the
  pole star symbolizes the immutable puruṣa; the term highlights the necessity of a fixed point for perception, contrasting
  with the mutable prakṛti.


  **kāyavyūha (कायव्यूह)** — kāyavyūha: ‘body assembly’ (kāya ‘body’ + vyūha ‘arrangement’). It denotes the organized bodily
  posture that serves as the instrument for mental focus, aligning with the Yoga notion that the body is the vehicle for citta’s
  investigation of prakṛti.


  **jñāna (ज्ञानम्)** — jñāna: ‘knowledge’ (root jñā‑ ‘to know’). In this context it refers to empirical, observational knowledge
  derived from disciplined bodily alignment, distinct from the transcendental knowledge of puruṣa.


  Cross-Tradition Resonances


  **Yoga Sūtra 3.27:** Both 3.27 and 3.29 employ a celestial metaphor to link bodily discipline with knowledge; 3.27 speaks
  of the body’s alignment with the sun, while 3.29 uses the pole star.

  *Divergence:* 3.27 emphasizes the dynamic, daily movement of the sun, suggesting a continual practice, whereas 3.29 focuses
  on the fixed point of the pole star, implying a more static, meditative posture.


  **Yoga Sūtra 3.28:** Both sutras discuss the role of the body (kāya) in facilitating mental clarity; 3.28 speaks of the
  body’s ‘surrender’ to the mind, while 3.29 speaks of the body’s alignment to a fixed point.

  *Divergence:* 3.28’s language is more internal (surrender) whereas 3.29’s language is external (alignment), highlighting
  a shift from internal to external stabilization.


  **Sāṃkhya Kārikā 4.1:** The use of a fixed point (pole star) parallels the Sāṃkhya idea of puruṣa as the unchanging observer.

  *Divergence:* Sāṃkhya treats puruṣa as purely transcendental, whereas the sūtra uses the pole star as a tangible, bodily
  reference, making the metaphysical concept accessible.'
insight: The sūtra asserts that disciplined bodily alignment toward a fixed celestial point yields insight into the cosmos.
practice: Align your body so that your gaze rests steadily on the pole star (or its terrestrial equivalent) while you breathe
  evenly, and observe how your mind’s wandering diminishes.
