sanskrit_devanagari: 'क्लेशमूलः कर्माशयो द्रष्टादृष्टजन्मवेदनीयः ॥ २.१२ ॥


  सति मूल तद्विपाको जत्यायुर्भोगाः ॥ २.१३ ॥


  ते ह्लादपरितापफलाः पुण्यापुण्यहेतुत्वात् ॥ २.१४ ॥'
sanskrit_iast: 'kleśamūlaḥ karmāśayo dṛṣṭādṛṣṭajanmavedanīyaḥ || 2.12 ||


  sati mūle tadvipāko jātyāyurbhogāḥ || 2.13 ||


  te hlādaparitāpaphalāḥ puṇyāpuṇyahetutvāt || 2.14 ||'
translation_literal: '**2.12** Rooted in affliction (kleśa), the deposit of action (karmāśaya) bears fruit in lives seen and
  unseen.

  **2.13** With that root established, its ripening (vipāka) yields birth, span of life, and experience.

  **2.14** These bear fruit as pleasure and pain, because their cause is virtue and vice (puṇyāpuṇya).'
commentary: 'Sūtras 2.12–2.14 establish karma''s causal architecture: afflictions (kleśa) root themselves in work''s impressions
  (saṃskāra), which fructify across time as the threefold condition of birth, lifespan, and experience. The argument moves
  from etiology (2.12: whence suffering arises) through ontology (2.13: how the root guarantees fruition) to ethics (2.14:
  why pleasure follows virtue or vice). The pivot is the recognition that karma is not merely past action but a continuous
  imprinting of the citta—the field of consciousness—by the guṇas of prakṛti. Patañjali does not ask whether karma is real;
  he asks how it operates across the seen (dṛṣṭa: present, visible consequences) and unseen (adṛṣṭa: latent, future-bearing
  impressions). This temporal doubling is crucial: the yogi need not wait for rebirth to encounter karmic fruit; every moment
  presents both immediate and deferred consequences. The "root" (mūla) in 2.13 is prakṛti itself—the generative matrix—which
  ensures that so long as puruṣa remains entangled in ignorance (avidyā), the threefold fruition (jāti, āyus, bhoga: class,
  duration, sensation) will manifest. Sūtra 2.14''s claim that pleasure arises from virtue or vice (puṇya-apuṇya) is not moralism
  but mechanics: it names the causal law binding action to result. The insight for practice is stark: one cannot escape karma''s
  fruition while remaining identified with the body-mind complex; one can only cease generating new karma by withdrawing identification
  from its fruits. This is why pratyāhāra (sense-withdrawal) and samādhi (absorption) interrupt the vṛtti-kleśa cycle—they
  sever the reactive loop that perpetuates saṃskāra. The cluster thus frames liberation not as reward for virtue but as the
  cessation of the machinery that produces reward and punishment alike.


  Key Terms


  **saṃskāra** — Karmic impression or latent tendency imprinted in consciousness by past action; the mechanism by which karma
  persists and fructifies

  **dṛṣṭa-adṛṣṭa** — Seen and unseen; the visible (present) and invisible (latent, future-bearing) modes of karmic fruition

  **phala** — Fruit or result; the experiential consequence of action, manifesting as pleasure, pain, or neutral sensation

  **mūla** — Root; prakṛti as the generative ground that ensures karmic impressions will fructify into the threefold condition


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Both texts assert that action (karma) is inevitable and that the yogi''s duty is to act without
  attachment to fruit (phala). Gītā 2.47 (''yoga is skill in action'') parallels Patañjali''s insight that liberation comes
  through disidentification from fruition, not through inaction. Divergence: The Gītā emphasizes dharma (duty) as the frame
  for right action; Patañjali emphasizes the mechanics of impression (saṃskāra) and the interruption of the vṛtti-cycle. The
  Gītā offers a path of engaged action; Yoga offers a path of cessation.

  **Epictetus, Enchiridion 1:** Both teach that external events (class, lifespan, sensation) lie outside one''s control, and
  that freedom lies in withdrawing judgment and desire from them. Epictetus''s dichotomy of prohairesis (choice) and what
  is ''not up to us'' mirrors Patañjali''s distinction between puruṣa (unchanging witness) and prakṛti (the field of fruition).
  Divergence: Epictetus grounds freedom in rational assent and the will; Patañjali grounds it in the cessation of mental fluctuation
  (vṛtti) and the recognition of puruṣa''s inherent separation. Stoicism is volitional; Yoga is non-dual.

  **Dhammapada 1–2:** Both Buddhist and Yoga texts teach that mind (citta/mano) is the forerunner of action and that suffering
  arises from the conditioning of consciousness by past impressions. The law of dependent origination (pratītyasamutpāda)
  parallels the Yoga chain: kleśa → saṃskāra → vṛtti → phala. Divergence: Buddhism denies a permanent self (anātman) and seeks
  the cessation of craving; Yoga affirms puruṣa (eternal consciousness) and seeks its disentanglement from prakṛti. The Buddhist
  path dissolves the agent; the Yoga path reveals the agent as untouched witness.'
insight: 'The passage asserts that the presence of the root (the inherent nature of the soul) guarantees the fruition of karma,
  which manifests in three interrelated realms: class (samskara‑based social rank),'
practice: Observe the present moment, noting how your current social role, lifespan, and sensory experiences are shaped by
  past actions, and consciously cultivate awareness of the unchanging root that underlies all.
