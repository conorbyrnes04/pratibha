sanskrit_devanagari: तस्मिन् सति श्वासप्रश्वासयोः गतिविच्छेदः प्राणायामः
sanskrit_iast: tasmin sati śvāsapraśvāsayor gativicchedaḥ prāṇāyāmaḥ
translation_literal: When that [posture] is established, prāṇāyāma is the interruption of the flow of
  inhalation and exhalation.
commentary: 'This sūtra defines prāṇāyāma—often mistranslated as ''breath control''—with precision: it
  is the deliberate interruption (vicchedaḥ) of the natural movement (gati) of breath. The phrase ''tasmin
  sati'' (''when that is established'') refers back to the previous sūtra on āsana, the stable seated
  posture. Patañjali is emphatic: prāṇāyāma cannot be practiced fruitfully without a firm, comfortable
  seat.


  The term gativicchedaḥ is key. Gati means flow, motion, or trajectory; vicchedaḥ means cutting, breaking,
  or interrupting. This is not mere breathing awareness or gentle breath observation. It is an active
  intervention in the automatic rhythm of respiration—a controlled suspension or modulation of the breath''s
  natural path. In the Yoga–Sāṃkhya framework, prāṇa (the vital force animating the body) moves through
  channels (nāḍī) via inhalation (śvāsa) and exhalation (praśvāsa). By interrupting this flow, the practitioner
  begins to master prāṇa itself, redirecting subtle energy away from the habitual patterns that bind consciousness
  to the body''s mechanical reflexes.


  This is not hyperventilation, breath-holding for duration, or theatrical breathing. It is precise interruption—the
  deliberate pause and modulation of breath rhythm as a means to steady the mind and prepare it for deeper
  states of concentration (dhāraṇā). The practice builds the capacity to hold and direct prāṇa, which
  is the gateway to prātyāhāra (sense withdrawal) and the inner limbs of yoga.


  Key Terms


  **prāṇāyāma** — Interruption and modulation of the breath''s natural flow; the fourth limb of yoga,
  used to direct vital energy (prāṇa) and steady the mind.

  **gativicchedaḥ** — The breaking or interruption of flow; the deliberate suspension of the breath''s
  continuous motion.

  **āsana** — A stable, comfortable seated posture; the third limb of yoga, which must be established
  before prāṇāyāma can be practiced effectively.'
insight: The claim that breath control is a deliberate intervention in the mind’s habitual patterns is
  central to the Sādhana Pāda.
practice: 'Sit in a stable, comfortable posture (āsana) for at least 5–10 minutes. Once settled, observe
  your natural breath for 20 cycles without interference. Then practice a simple interruption pattern:
  Inhale through the nose for a count of 4. Hold (suspend) the breath for a count of 4. Exhale through
  the nose for a count of 4. Pause (interrupt the flow) for a count of 4 before the next inhalation. Repeat
  this cycle 5–10 times. The key is the deliberate pause—the vicchedaḥ—at both the top and bottom of the
  breath. This is not straining; if you feel strain, reduce the count to 2 or 3. The purpose is to interrupt
  the automatic, unconscious flow of breath and begin to experience prāṇa as a force you can direct, not
  merely a reflex you undergo. Practice once daily for 2–3 weeks before lengthening the counts.'
