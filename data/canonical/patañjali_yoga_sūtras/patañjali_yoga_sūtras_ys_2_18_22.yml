sanskrit_devanagari: 'प्रकाशक्रियास्थितिशीलं भूतेंद्रियात्मकम् भोगापवर्गार्थं दर्श्यम् ॥ २.१८ ॥


  विशेषविशेषलिङ्गामात्रालिङ्गानि गुणपरवाणि ॥ २.१९ ॥


  द्रष्टा दृशिमात्रः शुद्धोऽपि प्रत्ययानुपश्यः ॥ २.२० ॥


  तदर्थं एव दर्श्यस्यात्मा ॥ २.२१ ॥


  कृतार्थं प्रति नष्टम् अप्य् अनष्टं तदन्यसाधारणत्वात् ॥ २.२२ ॥'
sanskrit_iast: 'prakāśakriyāsthitiśīlaṃ bhūtendriyātmakaṃ bhogāpavargārthaṃ dṛśyam || 2.18 ||


  viśeṣāviśeṣaliṅgamātrāliṅgāni guṇaparvāṇi || 2.19 ||


  draṣṭā dṛśimātraḥ śuddho ''pi pratyayānupaśyaḥ || 2.20 ||


  tadartha eva dṛśyasyātmā || 2.21 ||


  kṛtārthaṃ prati naṣṭam apy anaṣṭaṃ tadanyasādhāraṇatvāt || 2.22 ||'
translation_literal: '**2.18** The visible world—composed of the elements and sense-organs, characterized by luminosity, activity,
  and inertia—exists for experience and for liberation (bhoga-apavarga).

  **2.19** The constituents of nature (guṇa) are differentiated, undifferentiated, marked only by subtle form, and unmarked.

  **2.20** The seer (draṣṭṛ) is pure vision alone; though luminous, he witnesses only through the mind''s presentations (pratyaya).

  **2.21** The visible world exists for him alone—that is its nature.

  **2.22** Though destroyed for one whose purpose is fulfilled, it remains undestroyed, for it is common to others.'
commentary: 'These five sūtras construct a single argument: prakṛti (the seen) is a purposive instrument composed of elements
  and organs, structured in graduated stages through the guṇas, and exists solely for the experience and liberation of puruṣa
  (the seer). The movement is from mechanism to metaphysics to ethics.


  Sūtra 2.18 establishes that the visible world—both gross elements and subtle organs—is not inert matter but a dynamic triad:
  illumination (prakāśa, sattva), action (kriyā, rajas), and stasis (sthiti, tamas). These are not mere qualities but the
  three guṇas themselves as they manifest in sensory apparatus. Critically, this composite serves a dual function—it enables
  both bondage (through identification with experience) and liberation (through discriminative use). The seer does not transcend
  the organs by rejecting them but by understanding their nature.


  Sūtra 2.19 deepens this by revealing that the guṇas are not static but staged (avasthā). They evolve through defined levels—from
  gross to subtle to causal—mirroring prakṛti''s own unfoldment. This staging is not arbitrary; it provides the yogin a practical
  ladder: each stage can be recognized, its binding power understood, and transcended through disciplined practice. The guṇas
  are thus neither monolithic nor permanent but processual.


  Sūtra 2.20 pivots to the seer''s nature: puruṣa is pure consciousness (jñāna-mātra), untouched by prakṛti''s evolution.
  Yet the seer observes only appearances (ābhāsa), never the object-in-itself, because observation is mediated through intellect
  (buddhi), which is prakṛti''s finest instrument. This is not a defect but the structural condition of embodied existence.
  The seer remains eternally pure even while appearing to see.


  Sūtra 2.21 compresses the relationship: prakṛti''s entire existence (sattvam) is for puruṣa''s sake. This is not exploitation
  but purpose: prakṛti evolves precisely to provide the conditions for puruṣa''s self-recognition and liberation.


  Sūtra 2.22 resolves the apparent paradox: once puruṣa''s purpose is fulfilled—once discrimination (viveka) is complete and
  kaivalya (isolation) is attained—the object ceases to exist for that puruṣa. Yet it persists for others still bound. This
  reveals that the world''s reality is not absolute but perspectival: it exists as long as there is a seer who requires experience.
  The cluster thus argues that prakṛti is neither illusion nor prison but a graduated, purposive structure whose stages can
  be systematically transcended through understanding that the seer and seen are fundamentally distinct, and that this very
  distinction is the gateway to liberation.


  Key Terms


  **guṇa** — The three fundamental qualities or strands of prakṛti (sattva, rajas, tamas); the operative modes through which
  nature manifests and binds or liberates consciousness

  **prakṛti** — Primordial nature or matter; the entire realm of the seen, composed of elements, organs, and intellect, existing
  for the experience and liberation of puruṣa

  **puruṣa** — The seer, pure consciousness, eternally distinct from prakṛti; the witness that observes only appearances yet
  remains untouched by what is observed

  **viveka** — Discriminative discernment; the capacity to distinguish puruṣa from prakṛti, enabling the yogin to recognize
  the guṇas'' stages and transcend their binding power


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.34:** Both texts assert that puruṣa (here kṣetra-jña, the knower of the field) is the unchanging witness
  of prakṛti (kṣetra, the field), and that liberation arises from recognizing this distinction. The Gītā similarly teaches
  that the seer observes nature''s transformations without being altered by them. Divergence: The Gītā emphasizes dharma and
  action within the world as the path to this recognition, whereas the Yoga Sūtras stress systematic withdrawal from the guṇas
  through discriminative meditation and the cessation of vṛtti.

  **Plotinus, Enneads III.8.4:** Plotinus teaches that the One (pure consciousness) remains eternally transcendent and unaffected
  even while emanating the material world, which exists for the soul''s experience and return. Like puruṣa, the One is pure
  gnosis observing manifestation without participation. Divergence: Plotinus conceives the emanation as continuous overflow
  and return through hierarchical levels; Yoga Sūtras present prakṛti''s evolution as a discrete, staged unfolding designed
  specifically for puruṣa''s liberation, with a definitive endpoint (kaivalya) rather than cyclical return.

  **Epictetus, Enchiridion 1:** Epictetus teaches that some things are within our control (our judgments and will) and others
  are not (body, property, reputation), and that freedom comes from accepting this distinction and focusing on what is truly
  ours. Similarly, the Yoga Sūtras teach that puruṣa''s liberation comes from recognizing its distinction from prakṛti''s
  mechanisms. Divergence: Epictetus grounds freedom in rational assent and virtue; the Yoga Sūtras ground it in metaphysical
  discrimination (viveka) and the cessation of mental modifications (vṛtti-nirodha), not ethical choice.'
insight: The passage asserts that sight is a composite of prakṛti’s constituents—both the five gross elements (bhūta) and
  the eleven organs (āṅgā) including the mind (buddhi) and the sense‑organ (āliṅkara).
practice: Observe the sight you are using now; note how it simultaneously illuminates your awareness, acts to bring objects
  into perception, and remains in a fixed position, and use this observation to cultivate mindful awareness of each of these
  qualities.
