sanskrit_devanagari: 'स्थिरसुखम् आसनम् ॥ २.४६ ॥


  प्रयत्नस्यैथिल्यांन्तसमापत्तिभ्याम् ॥ २.४७ ॥


  ततो द्वन्द्वानभिघातः ॥ २.४८ ॥'
sanskrit_iast: 'sthirasukham āsanam || 2.46 ||


  prayatnaśaithilyānantasamāpattibhyām || 2.47 ||


  tato dvandvānabhighātaḥ || 2.48 ||'
translation_literal: '**2.46** Posture (āsana) is steadiness and ease (sthira-sukha).

  **2.47** Through relaxation of effort (prayatna-śaithilya) and absorption in the infinite (ananta-samāpatti).

  **2.48** From that, immunity to the pairs of opposites (dvandva-anabhighāta).'
commentary: 'These three sūtras form a single arc: the body becomes a stable platform (2.46), sustained
  by gentle rather than forceful effort and anchored in the infinite (2.47), which then permits the dissolution
  of dualistic perception itself (2.48). The movement is not from flesh to spirit but from struggle to
  ease to transcendence of the very categories that structure ordinary experience.


  Patañjali''s definition of āsana as sthira-sukha—steady and easy—is a philosophical reorientation of
  the body''s role in liberation. In Sāṃkhya-Yoga metaphysics, prakṛti (matter, including the body) and
  puruṣa (consciousness) are fundamentally distinct; the body ordinarily entraps awareness in vṛtti (mental
  modifications) through identification with sensation and form. But āsana does not reject the body; it
  transforms it into an instrument of non-attachment. Steadiness prevents the mind from being scattered
  by restlessness; ease prevents it from being trapped in the narrative of suffering. The body becomes
  transparent.


  Sūtra 2.47 deepens this by specifying that this transparency arises not through violent effort (prayatna)
  but through mild exertion (prayatna-śaithilya) paired with meditation on the infinite (ananta-samāpatti).
  Here the infinite is not a concept but a reorientation of attention toward what is boundless and unchanging—the
  puruṣa itself, or the ground of consciousness. When effort becomes gentle and the mind rests in the
  infinite, the posture sustains itself; the practitioner no longer strains against the body but allows
  the body to settle into its natural alignment with the unchanging. This is the inversion of ordinary
  practice: not conquering the body through force, but releasing it through surrender to what transcends
  it.


  The result, stated in 2.48, is the cessation of dvandva—the pairs of opposites (hot-cold, pleasure-pain,
  gain-loss) that structure all conditioned experience. This is not numbness but clarity: when the mind
  no longer oscillates between attraction and aversion, it no longer perceives the world through the lens
  of duality. The puruṣa, no longer identified with the vṛtti, stands as witness rather than participant.
  The body, now steady and easy, no longer generates the mental modifications that perpetuate the illusion
  of separation. Kaivalya—the isolation of consciousness from matter—begins here, in the simple act of
  sitting still without resistance.


  Key Terms


  **sthira-sukha** — Steadiness and ease; the dual quality that defines āsana as a stable yet comfortable
  bodily posture

  **prayatna-śaithilya** — Relaxation of effort; the principle of gentle exertion rather than forceful
  striving in practice

  **dvandva** — The pairs of opposites (pleasure-pain, hot-cold, gain-loss) that structure dualistic perception
  and bind consciousness to prakṛti

  **ananta-samāpatti** — Meditation on or absorption into the infinite; fixing the mind on what is boundless
  and unchanging


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.23-24:** Kṛṣṇa teaches that yoga is the cessation of mental modification (yoga-chitta-vṛtti-nirodhah)
  and that it is attained through steady practice (abhyāsa) with non-attachment. Like Patañjali, the Gītā
  locates liberation in the stilling of the mind and the transcendence of effort-driven striving. Divergence:
  The Gītā emphasizes duty (dharma) and devotion (bhakti) as the context for yoga, whereas Patañjali''s
  Yoga Sūtras present a more technical, non-theistic framework focused on the mechanics of consciousness
  and prakṛti-puruṣa separation.

  **Epictetus, Enchiridion §1:** Epictetus teaches that some things are within our control (prohairesis,
  choice) and others are not, and that freedom comes from relinquishing attachment to external things.
  The principle of gentle effort and non-resistance parallels the Stoic acceptance of what cannot be changed.
  Divergence: Epictetus grounds freedom in rational assent to divine order (logos), whereas Patañjali
  grounds it in the recognition of puruṣa''s ontological separation from prakṛti; the Stoic path is ethical
  and cosmological, the yogic path is metaphysical and introspective.

  **Dōgen, Shōbōgenzō, ''Bendōwa'' (On Practice-Enlightenment):** Dōgen teaches that sitting (zazen) is
  not a means to enlightenment but enlightenment itself; the body-mind in stillness is already Buddha-nature.
  Like Patañjali, Dōgen sees the posture as the direct expression of the ultimate state, not a preliminary
  to it. Divergence: Dōgen emphasizes non-dualistic being (the body-mind as one), whereas Patañjali maintains
  the metaphysical dualism of puruṣa and prakṛti; for Dōgen, practice and realization are non-separate;
  for Patañjali, they lead to the discrimination (viveka) that reveals their fundamental difference.'
insight: The claim that the essence of a posture is its steadiness and ease is a decisive move in the
  Yoga tradition, distinguishing the physical from the metaphysical.
practice: Assume a posture that feels naturally steady, then gently shift your attention from the posture
  to the infinite, allowing the body to relax into the practice.
