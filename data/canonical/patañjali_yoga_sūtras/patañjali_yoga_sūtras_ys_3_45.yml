sanskrit_devanagari: ततो णिमादिप्रादुर्भावः काया-संपत् तद्धर्मानभिगातः च
sanskrit_iast: tato 'ṇimādiprādurbhāvaḥ kāyasaṃpat taddharmānabhighātaś ca
translation_literal: From that, the emergence of powers such as minuteness, perfection of the body, and
  the non-obstruction of its qualities.
commentary: 'This sūtra describes the natural fruition of mastery over the elements (bhūta-jayā), the
  preceding attainment. When a yogi stabilizes perception in the subtle dimension of matter—the tanmātras
  or elemental essences—the gross body becomes transparent to will. The siddhi-s (powers) enumerated here
  are not supernatural intrusions but direct consequences of dissolving the boundary between mind and
  matter.


  Aṇimā (minuteness or atomicity) is the capacity to reduce one''s body or perception to the infinitesimal.
  Kāya-sampat (bodily perfection) refers to freedom from disease, fatigue, and decay—the body becomes
  an instrument of pure intention rather than mechanical habit. Tad-dharmānabhighātaḥ (non-obstruction
  of its qualities) means the body''s natural properties—strength, luminosity, lightness—no longer resist
  the yogi''s inner state; there is no friction between mind and flesh.


  Within the Yoga–Sāṃkhya framework, this marks a threshold: the yogi has begun to recognize prakṛti (matter)
  as fundamentally malleable, responsive to the clarity of puruṣa (witness-consciousness). The body is
  no longer an obstacle or a separate machine, but a transparent expression of stable attention. These
  are not magical acquisitions but the ordinary result of removing mental obstruction from the body''s
  own nature.


  Patañjali lists these not to seduce the practitioner into pursuit of powers, but to confirm that the
  path is real: when the mind truly settles, the body answers.


  Key Terms


  **aṇimā** — The siddhi of minuteness or atomicity; the power to perceive or reduce to the infinitesimal
  dimension.

  **kāya-sampat** — Perfection or integrity of the body; freedom from disease, decay, and resistance to
  the yogi''s intention.

  **tanmātra** — The subtle elemental essences (sound, touch, form, taste, smell) that underlie gross
  matter; the threshold between mind and body.'
insight: The passage asserts that the subtle element and the body are mutually dependent, each exerting
  an immediate effect on the other, and that this inter‑binding is elevated by the dharmas.
practice: 'Sit comfortably for 10–15 minutes. Bring attention to the space *inside* your body—not the
  surface, but the inner volume. Begin with the hands: feel the space within the palms, the hollow of
  the fingers, the marrow of the bones. Do not visualize; sense the actual interior. Then expand this
  inward attention to the forearms, upper arms, chest, belly. You are training perception to recognize
  the subtle dimension (tanmātra) of the body—the elemental essence beneath the gross form. As this inner
  space becomes vivid and stable, notice: does the body feel lighter? Do old tensions release? Does breathing
  deepen? This is the beginning of kāya-sampat—the body ceasing to resist your attention. Practice this
  daily. Over weeks, the quality of your presence in the body will shift; you will feel less ''in'' the
  body and more ''as'' the body. This is the ground of the siddhi-s described in the sūtra.'
