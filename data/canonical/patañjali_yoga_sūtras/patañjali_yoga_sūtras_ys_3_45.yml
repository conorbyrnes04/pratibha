sanskrit_devanagari: ततो णिमादिप्रादुर्भावः काया-संपत् तद्धर्मानभिगातः च
sanskrit_iast: tato 'ṇimādiprādurbhāvaḥ kāyasaṃpat taddharmānabhighātaś ca
translation_literal: From that, the emergence of powers such as minuteness, perfection of the body, and the non-obstruction
  of its qualities.
commentary: 'This sūtra describes the natural fruition of mastery over the elements (bhūta-jayā), the preceding attainment.
  When a yogi stabilizes perception in the subtle dimension of matter—the tanmātras or elemental essences—the gross body becomes
  transparent to will. The siddhi-s (powers) enumerated here are not supernatural intrusions but direct consequences of dissolving
  the boundary between mind and matter.


  Aṇimā (minuteness or atomicity) is the capacity to reduce one''s body or perception to the infinitesimal. Kāya-sampat (bodily
  perfection) refers to freedom from disease, fatigue, and decay—the body becomes an instrument of pure intention rather than
  mechanical habit. Tad-dharmānabhighātaḥ (non-obstruction of its qualities) means the body''s natural properties—strength,
  luminosity, lightness—no longer resist the yogi''s inner state; there is no friction between mind and flesh.


  Within the Yoga–Sāṃkhya framework, this marks a threshold: the yogi has begun to recognize prakṛti (matter) as fundamentally
  malleable, responsive to the clarity of puruṣa (witness-consciousness). The body is no longer an obstacle or a separate
  machine, but a transparent expression of stable attention. These are not magical acquisitions but the ordinary result of
  removing mental obstruction from the body''s own nature.


  Patañjali lists these not to seduce the practitioner into pursuit of powers, but to confirm that the path is real: when
  the mind truly settles, the body answers.


  Key Terms


  **aṇimā** — The siddhi of minuteness or atomicity; the power to perceive or reduce to the infinitesimal dimension.

  **kāya-sampat** — Perfection or integrity of the body; freedom from disease, decay, and resistance to the yogi''s intention.

  **tanmātra** — The subtle elemental essences (sound, touch, form, taste, smell) that underlie gross matter; the threshold
  between mind and body.'
insight: The passage asserts that the subtle element and the body are mutually dependent, each exerting an immediate effect
  on the other, and that this inter‑binding is elevated by the dharmas.
practice: Reduce your awareness to a single cell in your body—perhaps in your fingertip or behind your eyes—and hold your
  attention there until you sense its aliveness as distinct from the gross flesh around it. When you feel that infinitesimal
  point of presence, whisper *aṇimā* and notice how the boundary between that cell and your whole body begins to dissolve,
  as if the microscopic and the entire form are the same substance seen at different scales.
