- kind: iast
  label: IAST
  body: tad asaṃkhyeyavāsanābhiś citram api parārthaṃ saṃhatyakāritvāt
- kind: translation
  label: Pratibha Translation
  body: The mind‑stuff, though it has countless desires, exists for another purpose because it can act
    only in association with that other [the Puruṣa].
- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that the mind’s multiplicity of desires does not constitute independent agency;
    rather, it is a dependent phenomenon that exists only in relation to the Self. This is a contested
    move in the Yoga tradition: some commentators, following the Sāṃkhya view, treat the mind as a function
    of prakṛti, while others, such as the Yoga‑Māyā school, emphasize its subordination to the puruṣa.
    Here, the sutra aligns with the latter, underscoring that the mind’s activity is purposive only when
    it is in communion with the puruṣa. The phrase “parārthaṃ” signals that the mind’s ultimate aim is
    not self‑satisfaction but the realization of the other, the unchanging witness. In practical terms,
    this invites the practitioner to recognize that every thought and desire is a signpost pointing toward
    the Self, and that the only way to transform these impulses is to cultivate a relationship with the
    puruṣa through disciplined meditation and ethical conduct. By internalizing this relational dynamic,
    one learns to detach from the mind’s fleeting cravings and to direct its energy toward the unconditioned
    awareness that is the true object of yoga.


    Key Terms


    **asaṃkhyeya (असंख्येय)** — ‘countless’ (from aśaṃkhyeya) → ‘unlimited’; the sutra uses it to emphasize
    the boundless nature of desires, a point that is often glossed over as merely ‘many’.


    **vāsanā (वासना)** — ‘desire’ (from vāṣa) → ‘longing’; here it denotes the mind’s habitual tendencies
    that bind it to prakṛti.


    **citram (चित्रम्)** — ‘mind‑stuff’ (from cit) → ‘consciousness’; the sutra treats it as a dependent
    phenomenon.


    **parārtha (परार्थ)** — ‘other purpose’ (from para + artha) → ‘for another reason’; it signals the
    mind’s ultimate aim toward the puruṣa.


    **saṃhatyakāritvāt (समहत्वकृत्वात्)** — ‘because it can act only in association’ (from samha + tv
    + kṛtvāt); this clause is crucial because it explains the causal relation between mind and puruṣa.


    Cross-Tradition Resonances


    **Yoga‑Māyā, Vāsiṣṭha, 1.1.1:** Both sutras emphasize that the mind’s activity is contingent upon
    the puruṣa, using the term ‘parārtha’ to denote other‑purpose existence.

    *Divergence:* Yoga‑Māyā introduces an explicit reference to the ‘I‑sense’ (ahamkāra) as the mediator,
    whereas the current sutra omits it, focusing solely on the puruṣa–mind relationship.


    **Sāṃkhya, Taittiriya Upaniṣad, 3.2.4:** Both texts discuss the mind’s dependence on prakṛti, yet
    both use the term ‘asaṃkhyeya’ to describe the boundlessness of desires.

    *Divergence:* The Sāṃkhya passage treats desires as inherent to prakṛti, whereas the Yoga sutra frames
    them as instrumental for realizing the puruṣa.


    **Yoga‑Sūtra, 4.24:** The phrase ‘saṃhatyakāritvāt’ parallels the later sutra 4.25’s ‘saṃhatyakāryaḥ’,
    both highlighting the mind’s associative action.

    *Divergence:* While 4.25 expands on the mechanism of association, 4.24 remains concise, leaving the
    reader to infer the underlying process.'
