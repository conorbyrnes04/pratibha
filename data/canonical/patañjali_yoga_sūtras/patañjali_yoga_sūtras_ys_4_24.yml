sanskrit_devanagari: तद् असंख्येयवासनाभिः चित्रम् अपि परार्थं समहत्वकृत्वात्
sanskrit_iast: tad asaṃkhyeyavāsanābhiś citram api parārthaṃ saṃhatyakāritvāt
translation_literal: That mind, though variegated by countless latent impressions, serves another's purpose—functioning
  as an instrument because it is composed of parts.
commentary: 'This sūtra appears in the context of Patañjali''s analysis of the mind''s nature and its
  relationship to the Self (puruṣa). The ''that'' (tad) refers to the mind (citta) as established in preceding
  sūtras. The key claim is that despite the mind''s apparent complexity—its infinite store of vāsanās
  (latent impressions, tendencies, memory traces)—and its capacity to take on countless forms (citram),
  it remains fundamentally an instrument of another. That ''other'' is puruṣa, the witnessing consciousness.


  The reasoning given is crucial: saṃhatyakāritvāt—''because of its composite nature'' or ''because it
  functions through composition.'' The mind is made of parts (the guṇas: sattva, rajas, tamas; or the
  cognitive, affective, and volitional faculties). Anything composite, anything that requires assembly
  or coordination of components, cannot be self-aware or self-directing. It requires an external principle
  of awareness to illuminate it and give it direction. A machine, however intricate, does not operate
  itself.


  This is Sāṃkhya metaphysics: prakṛti (nature, matter, the mind-body complex) is eternally active, creative,
  and diverse, yet insentient. Puruṣa (the Self, consciousness) is eternally passive, unchanging, and
  singular, yet sentient. The mind''s apparent agency is borrowed; it reflects puruṣa''s light but has
  no light of its own. The countless vāsanās make the mind seem rich and autonomous, but they are precisely
  what bind it to the cycle of cause and effect, what make it dependent on something beyond itself to
  know, to choose, to be free.


  For the practitioner, this sūtra dissolves the illusion of the mind as master. The mind is servant—brilliant,
  subtle, capable of great refinement, but not sovereign. Liberation (kaivalya) begins when this is not
  merely understood intellectually but directly perceived: the mind''s infinite complexity is revealed
  as transparent, and the witnessing awareness behind it stands alone.


  Key Terms


  **vāsanā** — Latent impression, tendency, or memory trace left by past experience; the subtle imprint
  that conditions future perception and action

  **citram** — Variegated, manifold, many-colored; referring to the mind''s capacity to take on infinite
  forms and modifications

  **puruṣa** — The Self, pure consciousness, the eternal witnessing principle that is distinct from and
  independent of the mind-body complex'
insight: The sutra asserts that the mind’s multiplicity of desires does not constitute independent agency;
  rather, it is a dependent phenomenon that exists only in relation to the Self.
practice: 'Lift one object—a cup, stone, or book—and hold it steady in both hands. Feel how it requires
  the coordination of your fingers, palms, arms, and breath working together; notice that no single part
  holds it alone. Now whisper: ''This too is composite, serving what sees it.'' Repeat this with three
  objects throughout your day, each time sensing the difference between the assembled instrument and the
  awareness that witnesses it being held.'
