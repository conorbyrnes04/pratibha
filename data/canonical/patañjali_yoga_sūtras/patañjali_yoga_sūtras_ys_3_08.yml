sanskrit_devanagari: तद् अपि बहिरङ्गं निर्बीजस्य
sanskrit_iast: tad api bahiraṅgaṃ nirbījasya
translation_literal: Even that is external to the seedless state.
commentary: 'This sūtra (IV.10) completes Patañjali''s treatment of samādhi by distinguishing the highest,
  seedless absorption (nirbīja-samādhi) from all preceding stages. The word ''that'' (tad) refers to the
  previous sūtra''s description of samādhi with seed (sabīja-samādhi)—the state where subtle mental impressions
  (saṃskāra) and latent tendencies (vāsanā) still exist as the ground of experience. Even this refined,
  luminous state of meditative absorption remains ''external'' (bahiraṅga) or preliminary to the ultimate
  condition.


  The ''seedless'' (nirbīja) state is the final liberation of consciousness (kaivalya), where all seeds
  of future rebirth and mental activity have been exhausted. It lies beyond the reach of any technique,
  practice, or even refined meditation. This sūtra marks the boundary between yoga as method (which operates
  within the realm of seeds and impressions) and yoga as realization (which transcends all mental structure).


  The philosophical implication is crucial: no amount of perfected meditation, no matter how subtle or
  blissful, constitutes liberation itself. The practices of yoga—breath work, posture, concentration—are
  tools that exhaust the seeds but cannot themselves become the seedless state. This is why Patañjali
  says even the highest meditative achievement remains ''external'' to true freedom. The student must
  understand that the goal lies beyond experience, beyond even the most exalted states of consciousness.


  Key Terms


  **nirbīja-samādhi** — Seedless absorption; the final liberation of consciousness where all latent impressions
  and tendencies have been exhausted, beyond all technique and experience.

  **bīja** — Seed; a latent impression, mental tendency, or saṃskāra that generates future experience
  and rebirth.

  **bahiraṅga** — External, outer, or preliminary; here meaning all states and practices that remain within
  the realm of mental activity, however refined.'
insight: The central claim of this verse is that the mind, even when it has been trained to a state of
  stillness, remains an external, non‑productive element relative to the deepest, unconditioned ground
  of aw
practice: Release each technique you know—each breath control, each focal point, each refinement of attention—and
  let them fall away like leaves. Notice what remains when there is nothing left to practice, no method
  to grasp, no seed of effort itself; rest there without trying to rest.
