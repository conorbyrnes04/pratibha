unit_label: Foreign to the Unconscious
title: Foreign to the Unconscious
unit_type: sutra
sanskrit_devanagari: तद् अपि बहिरङ्गं निर्बीजस्य
sanskrit_iast: tad api bahiraṅgaṃ nirbījasya
translation_literal: Even it is foreign to the unconscious.
commentary: 'The central claim of this verse is that the mind, even when it has been trained to a state of stillness, remains
  an external, non‑productive element relative to the deepest, unconditioned ground of awareness. The contested move here
  is the identification of the mind’s position as ‘bahiraṅgaṃ’—outside the inner, fertile field of the unconscious. In the
  Sāṃkhya‑Yoga framework, the mind (citta) is a function of prakṛti, yet it is not the same as the unconditioned puruṣa. Patanjali’s
  own 1.1 declares that yoga is the cessation of the fluctuations of the mind; however, this verse insists that even that
  cessation is still external to the ultimate, unconditioned state. The Dvivedi commentary underscores this by calling the
  state ‘samādhi’ a preparatory stage, foreign to the final, dependence‑free samādhi. Thus, the verse invites the practitioner
  to recognize that the mind’s stillness is merely a provisional tool, not the final destination. Existentially, this means
  that one should not cling to the calm of the mind as the end; instead, one must cultivate a posture of detached observation,
  allowing the mind to remain a spectator to the deeper, unconditioned awareness. This aligns with the Sāṃkhya notion that
  only puruṣa is truly independent, while citta and prakṛti are dependent and thus ‘bahiraṅgaṃ’ to the ultimate reality.


  Key Terms


  **bahiraṅgaṃ (बाहिरङ्गं)** — bahiraṅgaṃ (बाहिरङ्गं) – ‘external, outside the inner field’; from bahir ‘outside’ + aṅga ‘part’;
  in Sāṃkhya it denotes the mind’s position relative to puruṣa, highlighting its dependence


  **nirbījasya (निर्बीजस्य)** — nirbījasya (निर्बीजस्य) – ‘without seed, barren’; from nir- ‘without’ + bīja ‘seed’; signifies
  the mind’s lack of generative power in the deepest unconscious


  **samādhi (समाधि)** — samādhi (समाधि) – ‘concentration, absorption’; in Yoga it is the cessation of vṛtti, but here it is
  qualified as a preparatory stage, foreign to the final, dependence‑free samādhi


  **citta (चित्त)** — citta (चित्त) – ‘mind, consciousness’; in Sāṃkhya a function of prakṛti, yet distinct from puruṣa, thus
  always external (bahiraṅgaṃ) to the ultimate reality


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 1.1:** Both verses declare the mind’s fluctuations as the target of yoga; structurally, each begins
  with a negation of the mind’s activity.

  *Divergence:* While 1.1 focuses on cessation, 3.8 emphasizes the mind’s externality to the unconscious, adding a layer of
  dependence not present in 1.1


  **Patanjali, Yoga Sūtra 3.5:** Both discuss the mind’s readiness for higher states; 3.5 speaks of the mind’s capacity to
  be still, 3.8 notes its foreignness to the unconscious.

  *Divergence:* 3.5 presents the mind as a tool; 3.8 treats it as a provisional, dependent entity


  **Dvivedi, Commentary on Yoga Sūtra 3.8:** Dvivedi’s text mirrors the verse’s claim that samādhi is preparatory, not final.

  *Divergence:* Dvivedi expands on the idea of dependence, whereas the verse itself remains concise, leaving the reader to
  infer the deeper implication'
