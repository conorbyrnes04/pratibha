sutra_range: 3.13-3.15
sanskrit_devanagari: 'एतेन भूतेन्द्रियेषु धर्मलक्षणावस्थापरिणामा व्याख्याताः ॥ ३.१३ ॥


  शान्तोदिताव्यापदेःधर्मानुपाती धर्मी ॥ ३.१४ ॥


  क्रमान्यत्वं परिणामान्यत्वे हेतुः ॥ ३.१५ ॥'
sanskrit_iast: 'etena bhūtendriyeṣu dharmalakṣaṇāvasthāpariṇāmā vyākhyātāḥ || 3.13 ||


  śāntoditāvyapadeśyadharmānupātī dharmī || 3.14 ||


  kramānyatvaṃ pariṇāmānyatve hetuḥ || 3.15 ||'
translation_literal: '**3.13** By what has been stated in the preceding three sutras, the transformations of the visible characteristics,
  time factors and conditions of the elements and senses are also explained.

  **3.14** The substratum (Prakṛti) proceeds through a latent past, an arising present, and an unmanifested future, thereby
  becoming dharmī.

  **3.15** The succession of different phases is the cause of their successive transformations.'
commentary: 'These three sūtras establish that transformation (parināma) operates as a universal law across all manifestations
  of prakṛti—mind, senses, and elements alike—through a temporal structure of succession. Sūtra 3.13 extends the causal principles
  governing mental fluctuation (vṛtti) to the sensory apparatus, dissolving the artificial boundary between psychological
  and physical domains. Both are prakṛti; both obey identical evolutionary laws. This is not mere technical extension but
  an ontological claim: the senses are not inert instruments but dynamic participants in prakṛti''s unfolding. The practitioner
  observing subtle shifts in sensory quality thereby maps the mind''s hidden patterns.


  Sūtra 3.14 then reveals the temporal architecture of this transformation: prakṛti moves through three phases—latent past
  (āśrita), arising present (utthita), and unmanifested future (avyakta)—and in this very process becomes dharmī, the bearer
  of essential nature. This is the cluster''s central move: prakṛti itself, not merely the puruṣa, embodies the quality traditionally
  reserved for the liberated. The distinction between observer and observed thus becomes dynamic rather than static. One does
  not escape prakṛti''s transformation but aligns consciousness with its inherent progression.


  Sūtra 3.15 completes the argument by identifying the *cause* of successive transformations: it is the succession itself
  (kramāntara). Causality here is not a static mechanism but temporal unfolding. Each phase conditions the next; variation
  is generative. The yogi who recognizes this can consciously direct the causal chain toward higher states by understanding
  that progression through stages is not obstacle but engine. The three sūtras together articulate a vision where liberation
  emerges not through rejection of prakṛti''s flow but through conscious participation in its lawful, phase-determined evolution
  toward manifestation and dissolution.


  Key Terms


  **parināma** — transformation or modification; the continuous evolution of prakṛti through successive phases

  **dharmī** — the bearer of essential nature; that which embodies its true character through inherent process

  **kramāntara** — succession of different phases or stages; the temporal sequence that itself generates transformation

  **prakṛti** — primordial matter or nature; the dynamic, evolving ground of all manifestation


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** Both texts affirm that change (parināma/janma-maraṇa) is inherent to prakṛti and that wisdom lies
  in recognizing this lawful process rather than denying it. The Gītā''s ''nityam parināmavantam'' echoes Patañjali''s vision
  of continuous transformation as fundamental. Divergence: The Gītā emphasizes detachment from the fruits of action within
  this flow, whereas Patañjali''s sūtras suggest active alignment with prakṛti''s phases as the path itself, not merely acceptance
  of it.

  **Heraclitus, ''panta rhei'' (all things flow):** Both systems reject static ontology and ground reality in perpetual flux.
  Heraclitus''s river and Patañjali''s kramāntara both make succession and temporal unfolding fundamental to existence. Divergence:
  Heraclitus offers no framework for transcendence or puruṣa-prakṛti distinction; for him, flux is ultimate. Patañjali posits
  puruṣa as unchanging witness precisely to make prakṛti''s transformation intelligible.

  **Plotinus, Enneads III.7 (on time and eternity):** Both philosophers distinguish latent, present, and future as modes of
  manifestation, and both see the soul''s liberation as alignment with the intelligible order underlying temporal succession
  rather than escape from it. Divergence: Plotinus locates the source in transcendent Intellect (Nous); Patañjali''s prakṛti
  is self-evolving through its own guṇas, requiring no external principle.'
insight: 'The statement that the succession of phases itself is the cause of their transformations foregrounds a dynamic,
  processual ontology: causality is not a static, one‑to‑one mapping but a temporal unfold'
practice: Observe each mental phase as it arises, noting how its distinct qualities give rise to the next; consciously let
  the succession flow toward a calmer, more unified state.
