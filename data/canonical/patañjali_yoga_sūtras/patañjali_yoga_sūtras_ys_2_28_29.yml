sanskrit_devanagari: 'योगाङ्गानुश्ठानाद् अशुद्धिक्षये ज्ञानदीप्तिर् आ विवेकाख्यतेः ॥ २.२८ ॥


  यमानी्यमासनप्राणायामप्रतियाहारधारणाध्यानसमाधयोऽष्टावङ्गानि ॥ २.२९ ॥'
sanskrit_iast: 'yogāṅgānuṣṭhānād aśuddhikṣaye jñānadīptir ā vivekakhyāteḥ || 2.28 ||


  yamaniyamāsanaprāṇāyāmapratyāhāradhāraṇādhyānasamādhayo ''ṣṭāv aṅgāni || 2.29 ||'
translation_literal: '**2.28** From the practice of yoga''s limbs (yogāṅga), impurity (aśuddhi) is destroyed, and knowledge
  blazes forth until discernment (vivekakhyāti) shines clear.

  **2.29** The eight limbs (aṣṭāv aṅgāni) are: restraint (yama), observance (niyama), posture (āsana), breath-control (prāṇāyāma),
  sense-withdrawal (pratyāhāra), concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi).'
commentary: 'Sūtras 2.28–2.29 establish yoga''s foundational architecture: the body is the necessary ground of practice, and
  the eight limbs (aṣṭāṅga) are the systematic means by which that ground yields transformation. The movement is from embodied
  discipline to mental purification to discriminative insight. Sūtra 2.28 asserts that anchoring practice in the body (kāya)
  is not mere physicality but the decisive pivot point where citta shifts from vṛtti-entanglement to viveka—the capacity to
  distinguish puruṣa from prakṛti. This is not passive illumination; it is active discernment. Without bodily grounding, the
  mind remains scattered in the fluctuations (vṛtti) of nature''s modifications. Sūtra 2.29 then names the eight limbs not
  as isolated techniques but as a hierarchical sequence: yama and niyama (ethical restraints) establish the outer container;
  āsana and prāṇāyāma (posture and breath) anchor consciousness in the body; pratyāhāra (sense withdrawal) turns attention
  inward; dhāraṇā, dhyāna, and samādhi (concentration, meditation, absorption) progressively dissolve the boundary between
  observer and observed. Each limb subdues a layer of prakṛti''s influence on citta, preparing puruṣa for kaivalya—isolation
  in its own nature. The sūtras together argue that yoga is neither purely mental nor purely physical, but an integrated sādhanā
  in which the body becomes the laboratory where mind recognizes its own freedom. This diverges from non-dualistic systems
  that dismiss the body as ultimately illusory; here the body is the necessary threshold, not an obstacle to transcend but
  a vehicle through which prakṛti''s grip loosens.


  Key Terms


  **aṣṭāṅga** — The eight limbs or accessories of yoga: yama, niyama, āsana, prāṇāyāma, pratyāhāra, dhāraṇā, dhyāna, samādhi

  **viveka** — Discriminative discernment; the capacity to distinguish puruṣa (consciousness) from prakṛti (nature''s modifications)

  **citta-śuddhi** — Purification of the mind-stuff; the clearing of mental fluctuations (vṛtti) that obscure clarity

  **vṛtti** — Mental fluctuations or modifications; the waves of thought, emotion, and perception that veil puruṣa''s true
  nature


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.11–12:** Both texts prescribe a graduated path: the Gītā emphasizes āsana, prāṇāyāma, and mind-control
  as prerequisites to meditation; the Yoga Sūtra''s eight limbs mirror this progression from external discipline to internal
  absorption. Both treat the body as the legitimate starting point for spiritual practice. Divergence: The Gītā frames yoga
  within dharma and bhakti, linking practice to duty and devotion to Kṛṣṇa; the Yoga Sūtra remains epistemologically focused
  on the separation of puruṣa from prakṛti, without invoking a personal deity or cosmic order.

  **Plotinus, Enneads I.6 (''On Beauty''):** Both traditions teach that purification of the lower faculties (body, sense,
  emotion) is necessary for the ascent to higher knowledge. Plotinus describes the soul''s ascent through stages of beauty;
  Patañjali describes the eight limbs as stages of mental clarification. Both reject the notion that the body is merely an
  obstacle. Divergence: Plotinus emphasizes aesthetic and intellectual contemplation as the vehicle; Patañjali emphasizes
  ethical discipline (yama, niyama) and breath-work as the necessary foundation, grounding the path in somatic and moral practice
  rather than intellectual or aesthetic refinement alone.

  **Dhammapada 183–185:** The Buddha teaches that restraint (śīla), concentration (samādhi), and wisdom (paññā) form a progressive
  path to liberation. The Yoga Sūtra''s yama–niyama (restraint), dhāraṇā–dhyāna (concentration), and viveka (wisdom) follow
  the same tripartite structure of ethical foundation, mental discipline, and discriminative insight. Divergence: The Dhammapada
  locates the goal in the cessation of dukkha and the unconditioned (nirvāṇa); the Yoga Sūtra locates it in kaivalya, the
  puruṣa''s recognition of its own isolation from prakṛti. The metaphysical frameworks differ: Buddhism denies a permanent
  self; Yoga affirms puruṣa as eternally distinct.'
insight: The passage asserts that the very act of grounding the yogic practice in the body is the decisive move that transforms
  the mind from a state of impurity to one of luminous knowledge, and that this lum
practice: You sit in a stable posture, regulate your breath, and observe your thoughts, allowing them to arise and dissolve
  without attachment, thereby practicing the eight accessories of yoga.
