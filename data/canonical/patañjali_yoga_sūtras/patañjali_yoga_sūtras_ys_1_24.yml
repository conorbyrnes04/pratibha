  items:
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Untouched Purusha in Samādhi”: The particular
      soul, untouched by afflictions, works, fruition, and impressions, is the distinct Purusha [Ishvara].
      -> not trance-entertainment or unconsciousness; graded absorption where subject–object friction
      quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Untouched Purusha in Samādhi”:
      in Patanjali, a particular, liberated Purusha (Ishvara) who is untouched by afflictions -> not ‘person’
      as social self; the unchanging witness distinct from prakṛti’s display'
  - term: kleśa (क्लेश)
    definition: '√kliś ‘afflict, torment’ → afflictive root-patterns -> in “Untouched Purusha in Samādhi”:
      in this sutra, the source of bondage that the untouched Purusha transcends -> not mere ‘stress’;
      five deep causes (avidyā etc.) that generate suffering and rebirth'
  - term: īśvara (ईश्वर)
    definition: '√īś ‘rule, be capable’ → the special puruṣa untouched by kleśa/karma -> in “Untouched
      Purusha in Samādhi”: a specific, liberated Purusha -> not necessarily a creator-god dogma; Patañjali’s
      omniscient special puruṣa as object of praṇidhāna'
  - term: karma (कर्म)
    definition: '√kṛ ‘do’ → action and its formative result-structure -> in “Untouched Purusha in Samādhi”:
      The particular soul, untouched by afflictions, works, fruition, and impressions, is the distinct
      Purusha [Ishvara]. -> not cosmic scorekeeping cartoon; action-deposit that conditions birth, span,
      and experience'
