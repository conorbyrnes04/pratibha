sanskrit_devanagari: क्लेशकर्मविपाकाशयैः अपरामृत्स्‌त्‌पुरुषविशेषः ईश्वरः
sanskrit_iast: kleśakarmavipākāśayair aparāmṛṣṭaḥ puruṣaviśeṣa īśvaraḥ
translation_literal: The Lord (īśvara) is a distinct purusha, untouched by affliction, action, their ripening,
  or the latent impressions that follow from them.
commentary: 'This sūtra defines īśvara—the Lord or supreme consciousness—within Patañjali''s Yoga–Sāṃkhya
  framework by radical negation. While ordinary purushas (individual consciousnesses) are bound by the
  cycle of kleśa (affliction: ignorance, ego, attachment, aversion, clinging), karma (action), vipāka
  (the fruiting or maturation of karmic seeds), and āśaya (the subliminal deposits or vasanas that perpetuate
  future action), īśvara stands entirely apart from this machinery.


  This is not a theistic claim in the devotional sense. Rather, Patañjali is identifying a logical necessity:
  if consciousness were subject to affliction and karmic consequence, it could never be free. Therefore,
  by definition, a consciousness that is eternally free—and hence capable of being known as a supreme
  exemplar—must never have been bound. Īśvara is purusha-viśeṣa (a particular or supreme form of purusha),
  not a creator-god, but a consciousness that demonstrates what liberation looks like: complete non-involvement
  with the machinery of suffering and conditioning.


  For the practitioner, this sūtra serves two functions: (1) it establishes that freedom is possible,
  because at least one consciousness (īśvara) proves it; (2) it clarifies that the goal of yoga is not
  to become something new, but to recognize the untouched, unconditioned nature of one''s own purusha—to
  realize that the afflictions and karmic entanglements are modifications of prakṛti (nature/mind-matter),
  not of consciousness itself. The path is one of discernment (viveka), not transformation.


  Key Terms


  **kleśa** — Affliction or obstacle; the five are avidyā (ignorance), asmitā (ego), rāga (attachment),
  dveṣa (aversion), and abhiniveśa (clinging to life)

  **vipāka** — Ripening or fruition; the maturation and manifestation of karmic seeds as experience

  **āśaya** — Subliminal impression, deposit, or vasana; the latent tendency or residue left by action
  that seeds future conditioning'
insight: The claim that the Purusha in this passage is a distinct, untouched entity—"Ishvara"—constitutes
  a contested move within the Yoga–Sāṃkhya tradition.
practice: 'Trace one action you take today—drinking tea, sending a message, speaking a word—and mentally
  follow it backward through its layers: the visible deed, the intention behind it, the habit or vasana
  that shaped that intention, the kleśa (fear, desire, ego) at its root. Stop when you reach the affliction.
  Then notice the space of awareness that watches this entire chain without being caught in it—untouched,
  witnessing. Rest there for three breaths.'
