  body: kleśakarmavipākāśayair aparāmṛṣṭaḥ puruṣaviśeṣa īśvaraḥ
- kind: translation
  label: Pratibha Translation
  body: The particular soul, untouched by afflictions, works, fruition, and impressions, is the distinct
    Purusha [Ishvara].
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim that the Purusha in this passage is a distinct, untouched entity—"Ishvara"—constitutes
    a contested move within the Yoga–Sāṃkhya tradition. While Sāṃkhya posits an impersonal principle of
    Purusha, Patanjali elevates a particular, liberated Purusha as the ultimate object of meditation.
    This elevation is not merely a semantic flourish; it reorients the practice from a general metaphysical
    inquiry to a concrete, experiential goal: the realization of an untouched self. The passage underscores
    that afflictions (kleśa), works (karma), fruition (vipāka), and impressions (āśaya) are the very conditions
    that bind the ordinary Purusha to the cycle of samsāra. By declaring the liberated Purusha as “unaffected
    by these,” Patanjali delineates the state of samādhi as the cessation of all vṛtti (mental modifications)
    that arise from these conditions. The Dvivedi commentary further clarifies that this Ishvara is neither
    a personal being nor an impersonal Brahman; it is a particular Purusha who is simultaneously free,
    omniscient, and beyond afflictions. This dual characterization aligns with the Sāṃkhya notion of Purusha
    as the witness consciousness while simultaneously affirming the Yoga emphasis on a specific, attainable
    state of liberation. The existential application is clear: the practitioner must cultivate a mental
    state that mirrors this untouched Purusha, thereby transcending the vṛtti generated by kleśa, karma,
    vipāka, and āśaya. The ultimate aim is samādhi, the union of the individual consciousness with the
    pure, unaffected Purusha, which Patanjali presents as the final refuge for beings seeking liberation.


    Key Terms


    **purusha (पुरुष)** — Purusha (Sāṃkhya) – the impersonal, witnessing consciousness; in Patanjali,
    a particular, liberated Purusha (Ishvara) who is untouched by afflictions.


    **īśvara (ईश्वर)** — Ishvara (Yoga) – a specific, liberated Purusha; distinct from the impersonal
    Brahman, embodying freedom, omniscience, and non-affliction.


    **kleśa (क्लेश)** — Afflictions (Sāṃkhya) – mental states that distort perception; in this sutra,
    the source of bondage that the untouched Purusha transcends.


    **vṛtti (वृत्ति)** — Mental modifications (Sāṃkhya) – fluctuations of consciousness; their cessation
    is the hallmark of samādhi, as implied by the untouched state of Purusha.


    Cross-Tradition Resonances


    **Bhagavad Gita 2.50, "Yoga is the cessation of the fluctuations of the mind.":** Both texts identify
    the cessation of vṛtti as the essence of samādhi, using the term ‘citta’ in Gita and ‘purusha’ in
    Patanjali.

    *Divergence:* Gita frames the cessation in terms of the self’s union with the divine, whereas Patanjali
    emphasizes the untouched, particular Purusha as the object of meditation.


    **Sāṃkhya Karika 1.3, "Purusha is the witness, untouched by prakṛti.":** Both traditions assert Purusha’s
    non-affliction by material conditions; Patanjali extends this to a specific, liberated Purusha.

    *Divergence:* Sāṃkhya treats Purusha as universal and impersonal, while Patanjali individuates it
    as Ishvara, thereby providing a concrete meditative target.


    **Patanjali Yoga Sutra 1.1, "Yoga is the stilling of the fluctuations of the mind.":** The sutra’s
    opening establishes the goal of samādhi; 1.24 specifies the nature of the state to be attained—an
    untouched Purusha.

    *Divergence:* The earlier sutra speaks generally of mind-stillness; 1.24 narrows the focus to a particular,
    liberated consciousness, adding a metaphysical dimension.'
