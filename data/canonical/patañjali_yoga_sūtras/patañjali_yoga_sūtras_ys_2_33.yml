unit_label: Opposite Thought as Remedy
title: Opposite Thought as Remedy
unit_type: sutra
sanskrit_devanagari: वितर्कबाधने प्रतिपक्षभावनम्
sanskrit_iast: vitarkabādhane pratipakṣabhāvanam
translation_literal: When negative thoughts disturb, you generate the opposite thought.
commentary: 'The sutra asserts that the mind’s disturbance is not an irreversible event but a reversible state that can be
  redirected by a conscious shift to the opposite mental image. This is a contested move in the Yoga tradition: some commentators
  insist that the mind’s afflictions are self‑sustaining and require external discipline, whereas Patañjali presents a purely
  internal, volitional technique. By invoking *pratipakṣa* (opposite), he aligns the practice with the Sāṃkhya notion that
  *prabhāva* (manifestation) is a function of *vyāpti* (inference) and can be altered by deliberate *bhāvanā* (mental cultivation).
  The technique is existentially potent because it offers a real‑time, non‑violent tool for the practitioner to prevent a
  thought from crystallizing into a habit. In everyday life, this means that when a thought of anger or fear arises, the yogi
  can immediately replace it with a thought of love or calm, thereby interrupting the *vṛtti* (mental fluctuation) before
  it becomes entrenched. The method is also compatible with the *samādhi* goal of steadying the mind: by mastering the ability
  to redirect mental energy, one cultivates the *niṣkāma* (effortless) state where the mind remains undisturbed by external
  stimuli. This sutra therefore bridges the analytical Sāṃkhya framework with the experiential practice of Yoga, illustrating
  how a simple cognitive pivot can lead to profound psychological transformation.


  Key Terms


  **vitarka (वितर्क)** — etymology: ‘to argue, to consider’; Sāṃkhya tradition: mental speculation that fuels *vṛtti*; default
  translation ‘argument’ misses its role as the source of mental agitation


  **bādhane (बाधने)** — etymology: ‘to disturb, to afflict’; Sāṃkhya: the process by which *prabhāva* (manifestation) becomes
  *vyāpti* (inference); translation ‘upon disturbance’ captures only the result, not the causal action


  **pratipakṣa (प्रतिपक्ष)** — etymology: ‘opposite side’; Yoga: the intentional counter‑thought that reverses the *vṛtti*;
  translation ‘opposite’ misses its dynamic, corrective function


  **bhāvanam (भावनम्)** — etymology: ‘to meditate, to cultivate’; Sāṃkhya: the mental act that produces *prabhāva*; translation
  ‘manifested’ omits its active, volitional aspect


  Cross-Tradition Resonances


  **Yoga Sutra 2.33:** Structural homology with 2.34 where *pratipakṣa* is used to describe the opposite of a *vṛtti*

  *Divergence:* In 2.33 the focus is on negative thoughts; in 2.34 it shifts to the *prabhāva* of the mind, showing a broader
  application of the same principle


  **Sāṃkhya Karika 1.1:** Both texts identify *vitarka* as the root of mental disturbance

  *Divergence:* Karika treats *vitarka* as an inherent cognitive process, whereas Patañjali frames it as a target for conscious
  correction


  **Bhaṭṭa’s Commentary on Yoga Sutras:** Both commentaries emphasize the role of *bhāvanā* in transforming *vṛtti*

  *Divergence:* Bhaṭṭa expands the technique to include *pratyāhāra* (withdrawal), whereas Patañjali limits the method to
  *pratipakṣa bhāvanam*


  **Yoga Vasistha 1.2:** Both texts use the idea of replacing negative thoughts with positive ones to achieve inner peace

  *Divergence:* Yoga Vasistha presents the replacement as a metaphysical shift in perception, while Patañjali presents it
  as a practical mental exercise'
insight: The sutra asserts that the mind’s disturbance is not an irreversible event but a reversible state that can be redirected
  by a conscious shift to the opposite mental image.
practice: When a negative thought arises, immediately replace it with an opposite positive thought.
