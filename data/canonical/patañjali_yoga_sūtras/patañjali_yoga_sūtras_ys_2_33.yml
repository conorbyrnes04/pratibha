sanskrit_devanagari: वितर्कबाधने प्रतिपक्षभावनम्
sanskrit_iast: vitarkabādhane pratipakṣabhāvanam
translation_literal: When harmful thoughts arise, cultivate the opposite state of being.
commentary: 'This sūtra (II.33) offers a direct, practical method for managing the mental disturbances
  (vitarka) that obstruct yoga. Vitarka means ''thought'' or ''deliberation,'' but in this context it
  refers specifically to thoughts that create bondage—violent impulses, lust, greed, anger, delusion.
  Bādhane means ''in the face of obstruction'' or ''when hindered.'' Rather than suppressing or fighting
  these thoughts (which often strengthens them), Patañjali prescribes pratipakṣabhāvana: the cultivation
  of an *opposite* or *counter-state* (pratipakṣa = opposite; bhāvana = cultivation, dwelling in). This
  is not mere intellectual substitution but a lived shift in consciousness. If cruelty arises, one cultivates
  compassion not as denial but as a genuine alternative frequency. The remedy works because the mind cannot
  authentically hold two opposing states simultaneously; the cultivation of the positive naturally displaces
  the negative. This reflects the Sāṃkhya understanding that consciousness (puruṣa) is naturally luminous
  and free; obstructions are patterns of prakṛti (nature/matter) that can be redirected through intelligent
  practice. The method is empirical: test it directly. When a destructive thought appears, rather than
  battling it, turn the mind''s energy toward its opposite virtue—and observe what happens.


  Key Terms


  **vitarka** — Thought-form, deliberation; here, destructive or binding mental patterns that obstruct
  clarity

  **pratipakṣa** — The opposite, counter-state, or antithetical quality

  **bhāvana** — Cultivation, dwelling in, bringing into being through sustained mental presence'
insight: The sutra asserts that the mind’s disturbance is not an irreversible event but a reversible state
  that can be redirected by a conscious shift to the opposite mental image.
practice: 'The moment a harsh thought toward yourself or another takes shape, turn your full gaze—eyes
  open or closed—toward the opposite quality as if it were a tangible presence in the room: if cruelty
  arises, look at compassion; if doubt, look at trust. Hold that gaze steady for three breaths, letting
  the counter-state become more real than the thought that summoned it.'
