      citta: ‘mind’ (Sāṃkhya); stakes the argument of: When the mind is engrossed in a particular sensory enjoyment that has
      arisen, it steadies itself. -> not ‘brain software’ or an enemy to smash; the reflecting medium whose turnings veil
