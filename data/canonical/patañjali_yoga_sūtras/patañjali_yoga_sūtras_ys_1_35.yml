title: Steadying the Mind by Sensory Absorption
unit_type: sutra
sanskrit_devanagari: विषयवती वा प्रवृत्तिर उत्पन्ना मनसः स्थिरिनिबन्धनिः
sanskrit_iast: viṣayavatī vā pravṛttir utpannā manasaḥ sthitinibandhanī
translation_literal: Or, when an activity directed toward objects arises in the mind, it can bind the mind to steadiness.
commentary: 'This sūtra presents an alternative pathway to mental stability that seems counterintuitive: rather than rejecting
  sensory engagement, one may use focused attention on objects as an anchor for the wandering mind. The word viṣayavatī (object-directed)
  and pravṛtti (activity, movement, engagement) suggest deliberate mental action, not passive suppression. Utpannā means ''arisen''
  or ''produced''—the activity is generated, not forced. Sthiti-nibandhanī means ''binding to stability'' or ''securing steadiness.''


  Within the Yoga Sūtras'' framework, this reflects a pragmatic recognition that the mind is naturally active. Rather than
  war against that nature, one harnesses it. This is the principle behind trataka (candle-gazing), mantra repetition, and
  visualization practices—the mind''s own momentum toward objects becomes the vehicle for concentration (dhāraṇā). The Sāṃkhya
  backdrop here is important: prakṛti (nature, including mind-stuff) is inherently dynamic; yoga works with that dynamism,
  not against it alone.


  This sūtra also contextualizes the earlier teaching on vairāgya (non-attachment). Dispassion does not mean numbness or forced
  withdrawal; it means engaging with objects without grasping or aversion, allowing that engagement itself to stabilize attention.
  The mind becomes steady not by fleeing sensation but by meeting it with clear, singular focus.


  Key Terms


  **viṣayavatī** — directed toward objects; object-oriented; having an external focus

  **pravṛtti** — activity, movement, engagement, natural inclination or momentum

  **sthiti-nibandhanī** — binding to steadiness; securing stability; anchoring the mind'
insight: The passage asserts that a mind fixed on a specific sensory pleasure can attain a state of steadiness, a form of
  samādhi.
practice: 'Choose a simple, neutral object: a candle flame, a dot on a wall, the sound of a bell, or a repeated word (mantra).
  Sit comfortably for 5–10 minutes. Direct your full attention to that object. When the mind wanders—and it will—gently return
  it without judgment. Do not try to empty the mind or fight distraction; instead, use the object as a tether. Notice how
  the act of returning attention, repeated, gradually steadies the mind. The object becomes the binding agent. Practice this
  daily for two weeks and observe whether your baseline mental stability improves even outside formal practice.'
