unit_label: Steadying the Mind by Sensory Absorption
title: Steadying the Mind by Sensory Absorption
unit_type: sutra
sanskrit_devanagari: विषयवती वा प्रवृत्तिर उत्पन्ना मनसः स्थिरिनिबन्धनिः
sanskrit_iast: viṣayavatī vā pravṛttir utpannā manasaḥ sthitinibandhanī
translation_literal: When the mind is engrossed in a particular sensory enjoyment that has arisen, it steadies itself.
commentary: 'The passage asserts that a mind fixed on a specific sensory pleasure can attain a state of steadiness, a form
  of samādhi. This claim situates the practice within the Sāṃkhya framework where *citta* (mind) is subject to *vṛtti* (mental
  modifications) arising from *prakṛti* (material nature). By focusing on a single sensory experience, the practitioner temporarily
  suspends the oscillatory *vṛtti*, allowing *citta* to rest in its pure, unaltered state. The move is contested in the sense
  that it employs a sensory object—traditionally considered a source of distraction—to achieve concentration, yet the text
  reframes it as a controlled, purposeful fixation. Dvivedi’s commentary elaborates on the method, suggesting that the practitioner
  should direct attention to the tip of the nose, tongue, palate, or roof of the tongue, thereby transforming ordinary sensory
  input into a meditative object. This technique aligns with the Yogic principle that *samādhi* can be achieved through both
  withdrawal (*pratyāhāra*) and directed attention (*pratyāhāra*). Existentially, the passage offers a pragmatic route for
  those who find it difficult to withdraw from sensory stimuli; by turning the mind toward a single, pleasurable sensation,
  they can cultivate a stable mental state that serves as a foundation for deeper insight. The method underscores the Yogic
  view that *purusha* (consciousness) and *prakṛti* are not irreconcilable; rather, *purusha* can observe *prakṛti*’s manifestations
  without being subsumed by them, achieving a transient yet profound samādhi.


  Key Terms


  **citta (चित्त)** — citta: ‘mind’ (Sāṃkhya) – the conscious observer; default translation ‘mind’ overlooks its role as the
  subtle, receptive substratum of perception


  **vṛtti (वृत्ति)** — vṛtti: ‘mental modification’ (Sāṃkhya) – the fluctuations of *citta*; default ‘thought’ misses its
  dynamic, processual nature


  **prakṛti (प्रकृति)** — prakṛti: ‘material nature’ (Sāṃkhya) – the primal substance of change; default ‘nature’ omits its
  generative, evolving character


  **samādhi (समाधि)** — samādhi: ‘absorption’ (Yogic) – a state of focused, unbroken attention; default ‘concentration’ fails
  to capture its transcendental quality


  Cross-Tradition Resonances


  **Yoga Sutra 1.35:** Use of a sensory object as a meditative focus mirrors the earlier sutra 1.33, where *pratyāhāra* withdraws
  from external objects; here the object is reintroduced but controlled

  *Divergence:* Unlike 1.33’s withdrawal, 1.35 employs the object to achieve steadiness, showing a productive shift from avoidance
  to purposeful engagement


  **Bhagavad Gita 2.50:** Both texts describe the mind’s rest when attention is fixed; Gita speaks of *dhyāna* (meditation)
  on the self, while 1.35 uses sensory enjoyment

  *Divergence:* Gita’s focus is on the eternal Self, whereas 1.35’s object is transient, highlighting a divergent path to
  samādhi


  **Brahmasūtra 3.1:** Both assert that *citta* can be steadied through *vṛtti* control

  *Divergence:* Brahmasūtra emphasizes *pratyāhāra* and *pratyābhyāsa* (practice), whereas 1.35 presents a specific sensory
  technique, indicating a more concrete method'
insight: The passage asserts that a mind fixed on a specific sensory pleasure can attain a state of steadiness, a form of
  samādhi.
practice: Focus your attention on the taste of a single sip of water, letting the flavor occupy your mind fully until it steadies.
