sanskrit_devanagari: तदाः सर्वावरणमालापत्यस्य ज्ञानस्यान्त्याज् ज्ञेयम् अल्पम्
sanskrit_iast: tadā sarvāvaraṇamalāpetasya jñānasyānantyāj jñeyam alpam
translation_literal: Then, when all coverings of knowledge are removed, the knowledge that remains to be known is almost nothing.
commentary: 'The sutra declares that the ultimate state of liberation is reached when every obscuring layer of cognition is
  stripped away, leaving behind an infinitesimal residue of knowledge. This claim foregrounds the paradoxical nature of kaivalya:
  the more one purifies, the less one is left to grasp, yet that very emptiness is the witness of pure consciousness. The
  contested move is the assertion that the remaining knowledge is "almost nothing"; some commentators argue that a subtle,
  non-conceptual awareness persists, whereas others maintain that even this awareness is beyond the scope of knowledge. Within
  the Yoga–Sāṃkhya framework, the sutra underscores the distinction between puruṣa (the witness) and prakṛti (the conditioned
  world). By eliminating the vṛtti (mental modifications) that veil jñāna, the mind attains samādhi, a state where the mind’s
  activity ceases and the self is seen in its unadorned form. The existential implication is that liberation is not a gain
  of new knowledge but the loss of all false identifications; the practitioner learns to live in the stillness that follows
  the dissolution of all mental coverings.


  Key Terms


  **jñāna (ज्ञान)** — root: to know -> Sāṃkhya: the faculty of perception and cognition; Yoga: the object of purification;
  default translation ''knowledge'' misses its role as the medium that becomes the witness when purified


  **sarvāvaraṇa (सर्वावरण)** — root: all coverings -> Sāṃkhya: the layers of ignorance (avidyā) that veil prakṛti; Yoga: the
  mental veils that obscure the true self; default translation ''coverings'' omits the specific epistemic function of these
  veils


  **alpam (अल्पम्)** — root: little -> Sāṃkhya: the residual ignorance that remains after purification; Yoga: the minimal,
  non-conceptual awareness that persists; default translation ''almost nothing'' fails to capture its subtle, non-dual character


  Cross-Tradition Resonances


  **Yoga Sūtra 4.30, 4.31:** Both sutras employ the structure ''tadā ... jñānaḥ'' to describe the state after removal of coverings,
  mirroring the pattern of 4.30 where the coverings are removed and knowledge is described.

  *Divergence:* While 4.30 states that knowledge becomes pure, 4.31 emphasizes that what remains is almost nothing, highlighting
  a shift from quality to quantity.


  **Patanjali, 1.1 (Samādhi):** The phrase ''tadā ... jñānaḥ'' parallels the description of samādhi as the cessation of mental
  modifications, structurally similar to the removal of coverings.

  *Divergence:* Patanjali frames samādhi as a state of concentration, whereas YS 4.31 frames it as an ontological emptiness,
  pointing to different interpretive priorities.


  **Bhatta, 2.1 (Sāṃkhya Prakṛti):** The concept of ''sarvāvaraṇa'' aligns with Bhatta’s discussion of the layers of ignorance
  that veil prakṛti.

  *Divergence:* Bhatta treats these layers as epistemic, while YS 4.31 treats them as ontological coverings that must be removed
  for liberation.'
insight: The sutra declares that the ultimate state of liberation is reached when every obscuring layer of cognition is stripped
  away, leaving behind an infinitesimal residue of knowledge.
practice: Observe the removal of all coverings of your knowledge and notice how what remains is almost nothing.
