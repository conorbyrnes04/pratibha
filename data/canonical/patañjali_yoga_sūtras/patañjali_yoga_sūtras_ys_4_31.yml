sanskrit_devanagari: तदाः सर्वावरणमालापत्यस्य ज्ञानस्यान्त्याज् ज्ञेयम् अल्पम्
sanskrit_iast: tadā sarvāvaraṇamalāpetasya jñānasyānantyāj jñeyam alpam
translation_literal: Then, when knowledge is freed from all coverings and impurities, that knowledge becomes
  infinite—and what remains to be known becomes negligible.
commentary: 'This sūtra describes the culmination of meditative purification in classical yoga. The word
  tadā (''then'') refers to the state achieved through sustained practice of the preceding methods—withdrawal
  of the senses, concentration, and the dissolution of mental fluctuations. When all āvaraṇa (coverings
  or obscurations) and mala (impurities, stains) are removed from jñāna (knowledge or the knowing faculty
  itself), a radical shift occurs: knowledge becomes ananta (infinite, boundless). This is not knowledge
  of many things, but the direct, unobstructed knowing that is the nature of consciousness itself when
  freed from the veil of mental conditioning, ego-identification, and the habit of fragmented perception.
  The second half of the sūtra—jñeyam alpam—completes the logic: if the knowing faculty becomes infinite,
  then what remains ''to be known'' (the objective world, the contents of experience) appears correspondingly
  small, limited, almost insignificant. This reflects the Yoga-Sāṃkhya metaphysics: when puruṣa (the witnessing
  consciousness) recognizes itself as boundless and self-luminous, the entire field of prakṛti (nature,
  objectivity) is seen in its true proportion—as finite, dependent, and derivative. The verse marks the
  threshold where individual knowledge merges into universal knowing, and the seeker realizes that ignorance
  was never a lack of information but a covering, a contraction of consciousness itself.


  Key Terms


  **āvaraṇa** — Covering, veil, or obscuration; the mental and egoic layers that conceal the true nature
  of consciousness

  **mala** — Impurity, stain, or contamination; the residual conditioning and ignorance that clouds the
  knowing faculty

  **ananta** — Infinite, boundless, endless; the quality of consciousness when freed from the limits of
  ego and mental fragmentation'
insight: The sutra declares that the ultimate state of liberation is reached when every obscuring layer
  of cognition is stripped away, leaving behind an infinitesimal residue of knowledge.
practice: When a thought, sensation, or perception arises, trace it backward to its source—not to understand
  it, but to feel the knowing that witnesses it. Let that witnessing presence expand until the thought
  becomes negligible, a speck in boundless awareness. Return to this reversal each time the mind contracts
  around 'what is to be known.'
