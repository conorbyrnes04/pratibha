    definition: 'sam-√yam ‘hold together’ → the triad dhāraṇā-dhyāna-samādhi as one -> in “Threefold Samyama”: The three together
      constitute Samyama. -> not generic self-control; technical confluence that yields prajñā and siddhis'
  - term: yoga (योग)
    definition: '√yuj ‘yoke, harness, join’ -> in “Threefold Samyama”: the term here implies the integrative process of the
      three -> not a posture class or romantic ‘union’ fantasy — technical stilling/harnessing of mind'
    lemma_id: yoga
    sense_id: yoga.classical
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Threefold Samyama”: in Sāṃkhya, the
      totality of mind including feelings, perceptions, and volition -> not ‘brain software’ or an enemy to smash; the reflecting
      medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Threefold Samyama”: the term here underscores the problem
      that the three aim to resolve -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep,
