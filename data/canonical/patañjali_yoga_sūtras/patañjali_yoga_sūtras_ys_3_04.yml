sanskrit_devanagari: त्रयम् एकत्रः संयमः
sanskrit_iast: trayam ekatra saṃyamaḥ
translation_literal: When the three are held together in one place, that is samyama.
commentary: 'This sūtra (3.4) defines samyama as the unified application of dhāraṇā (concentration), dhyāna
  (meditation), and samādhi (absorption) directed toward a single object or point. The word *trayam* (the
  three) refers to these three successive limbs of yoga; *ekatra* (in one place, in one locus) indicates
  their convergence on a single focus; *saṃyamaḥ* names the integrated state that results.


  Samyama is not three separate practices stacked sequentially, but rather a seamless binding together
  of attention, sustained flow, and non-dual absorption all aimed at one target. In the Sāṃkhya-Yoga framework,
  this unified restraint becomes the instrument through which the mind penetrates the nature of objects
  and gains direct knowledge (prajñapti). The three are distinct in their phenomenology—concentration
  requires effort, meditation flows with less friction, samādhi dissolves the meditator-meditation distinction—yet
  when applied to one point, they function as a single power.


  This sūtra marks the threshold where yoga practice becomes a tool for insight. Mastery of samyama is
  said to grant supernatural knowledge (siddhis), not because the practice is magical, but because the
  mind, when fully unified and turned toward any object, perceives its subtle structure and causal relationships
  directly, unmediated by conceptual thought.


  Key Terms


  **dhāraṇā** — Concentration; fixing attention on a single point or object with effort.

  **dhyāna** — Meditation; sustained, effortless flow of attention toward an object.

  **samādhi** — Absorption; non-dual union in which the distinction between observer and observed dissolves.'
insight: The claim of this verse is that the three prāṇāyāma‑related processes—focus, absorption, and
  contemplation—are not merely sequential steps but a unified, inseparable whole.
practice: 'Choose a simple, tangible object: a candle flame, a dot on a wall, or the sensation of breath
  at the nostrils. Sit comfortably and begin by fixing your gaze or attention on it for 2–3 minutes (dhāraṇā—pure
  concentration, allowing the mind to wander but gently returning it). Then sustain that focus without
  effort for another 2–3 minutes, letting attention flow continuously like oil poured from one vessel
  to another (dhyāna—meditation). Finally, for 1–2 minutes, release the sense of ''you'' observing the
  object; let awareness and object merge into a single, undivided knowing (samādhi—absorption). Do not
  strain. The three naturally deepen and merge with patient repetition. Notice how the object reveals
  subtler qualities—texture, light, vibration—as the three unite. This is samyama beginning to work.'
