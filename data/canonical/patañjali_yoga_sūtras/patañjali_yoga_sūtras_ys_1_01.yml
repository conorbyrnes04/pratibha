practice: 'Before reading further into the Yoga Sūtras, pause and ask yourself: *Why am I studying this
  now?* Sit quietly for 2–3 minutes and notice what brought you to this text at this moment. Is there
  a question, a restlessness, a readiness you sense? Write one sentence about it. This simple act honors
  the ''atha''—the threshold. It acknowledges that study is not abstract; it begins with *you*, now, in
  your actual condition. Return to this question periodically as you progress through the sūtras. The
  teaching meets the student who shows up.'
