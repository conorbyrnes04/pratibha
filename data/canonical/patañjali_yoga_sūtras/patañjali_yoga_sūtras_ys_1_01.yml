sanskrit_devanagari: अथ योगानुशासनम्
sanskrit_iast: atha yogānuśāsanam
translation_literal: Now, the teaching of yoga begins.
commentary: 'This opening sūtra marks the threshold of Patañjali''s systematic exposition. ''Atha'' (now)
  signals both a temporal and spiritual readiness—the moment when instruction becomes possible because
  the student has arrived, prepared or circumstance has aligned. It is not arbitrary; in Sanskrit philosophical
  texts, ''atha'' conventionally announces that prerequisites have been met and attention can be directed
  inward.


  ''Yogānuśāsanam'' is the *teaching* (anuśāsanam) of *yoga* (yogānuśāsanam)—not yoga itself, but its
  systematic presentation. Patañjali does not begin by defining yoga; he begins by announcing he will
  teach it. This is pedagogically significant: the framework comes before the definition. The student
  is invited into a structured inquiry, not handed a doctrine.


  Within the Yoga–Sāṃkhya worldview, yoga is the practical method for discriminating the eternal witness-consciousness
  (puruṣa) from the ever-changing field of matter and mind (prakṛti). This sūtra opens the door to that
  discrimination. The word ''anuśāsanam'' also carries the sense of ''discipline'' or ''instruction''—yoga
  is not casual exploration but a rigorous, guided path.


  The sūtra''s simplicity is deceptive. It establishes that what follows is *teaching*—oral, relational,
  requiring a student willing to listen and practice, not merely to read. It honors the lineage and the
  role of the guru.


  Key Terms


  **atha** — Now; a marker of readiness and the beginning of systematic instruction; signals that conditions
  are ripe for learning.

  **yoga** — Union or yoking; the disciplined practice of stilling the fluctuations of mind to reveal
  the unchanging witness-consciousness (puruṣa).

  **anuśāsanam** — Teaching, instruction, or systematic discipline; the transmission of knowledge from
  teacher to student in an ordered way.'
