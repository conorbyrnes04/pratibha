      teaching that opens the path'
  - term: atha (अथ)
    definition: 'atha ‘now’ — auspicious commencement particle -> in “Exposition of Yoga”: a marker of
      readiness and the beginning of systematic instruction -> not filler ‘now then’; marks readiness
      and the opening of authorized instruction'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Exposition of Yoga”: the
      conscious principle; stakes the argument of: Now, the teaching of Yoga begins. -> not ‘person’ as
      social self; the unchanging witness distinct from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Exposition of Yoga”: the primal
      materiality; stakes the argument of: Now, the teaching of Yoga begins. -> not pastoral ‘Nature’;
      the tri-guṇa matrix generating all experience including mind'
