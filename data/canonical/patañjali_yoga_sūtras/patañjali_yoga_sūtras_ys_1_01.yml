- kind: commentary
  label: Pratibha Commentary
  body: 'The opening clause establishes a decisive boundary between the preparatory preface and the substantive
    doctrine, asserting that the subsequent verses constitute a systematic exposition rather than mere
    anecdote. By declaring the text a *yoga‑anuśāsana* (teaching of yoga), Patanjali immediately frames
    the discourse as pedagogical, inviting the student to engage with a structured methodology. This move
    is contested in the tradition: some commentators read the phrase as a mere formalism, while others
    see it as a deliberate demarcation that signals the transition from the *sūtra*’s preface to its core.
    In the Yoga‑Sāṃkhya synthesis, this demarcation is crucial because it signals that the following verses
    will articulate the *prāṇāyāma*‑based path that reconciles Sāṃkhya’s dualism with the experiential
    goal of *samādhi*. The existential application is clear: the student is called to a disciplined practice
    that transforms the mind’s wandering *vṛtti* into a stable awareness of *puruṣa* beyond *prakṛti*.
    The Dvivedi commentary’s observation that Patanjali is a compiler rather than an originator underscores
    the lineage’s respect for earlier teachers such as Hiranyagarbha, thereby situating the text within
    a broader historical continuum. This contextual framing invites the practitioner to view the verses
    not as isolated aphorisms but as a living instruction that bridges ancient insight with contemporary
    practice, thereby making the path of yoga both historically grounded and personally transformative.


    Key Terms


    **yoga (योग)** — etymology: ‘union’ or ‘to bind’; Sāṃkhya tradition: the process of aligning the *puruṣa*
    with the *prakṛti* through disciplined practice; default translation ‘yoga’ often misses the dynamic
    process of integration


    **anuśāsana (अनुशासन)** — etymology: ‘instruction’ or ‘discipline’; tradition: a systematic teaching
    that structures the path; default translation ‘teaching’ may understate its pedagogical rigor


    **puruṣa (पुरुष)** — etymology: ‘person’ or ‘self’; Sāṃkhya: the conscious principle; default translation
    ‘person’ omits its transcendental, non-material nature


    **prakṛti (प्रकृति)** — etymology: ‘nature’ or ‘material reality’; Sāṃkhya: the primal materiality;
    default translation ‘nature’ fails to convey its dynamic, generative quality


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 1.1:** Structural homology with the opening of the *Mahābhārata*’s *Bhagavat*
    chapter, where a new thematic section is signaled by a single declarative clause.

    *Divergence:* While the *Mahābhārata* uses a narrative flourish, Patanjali’s terse declaration emphasizes
    pedagogical intent, reflecting the sūtra’s didactic brevity


    **Kāśyapa, *Yogaśāstra* 2.3:** Both texts employ the term *anuśāsana* to denote a systematic teaching
    framework.

    *Divergence:* Kāśyapa’s usage is broader, encompassing ritual instruction, whereas Patanjali restricts
    it to the internal discipline of mind and breath


    **Vācaspati, *Sāṃkhya Kārikā* 1.1:** The dualism of *puruṣa* and *prakṛti* is introduced early, mirroring
    Patanjali’s later elaboration.

    *Divergence:* Vācaspati presents the dualism as metaphysical ontology, while Patanjali frames it as
    a practical path to liberation


    **Dvivedi, *Yogaśāstra* 1.1:** Both commentaries note the formal opening that signals a new topic.

    *Divergence:* Dvivedi emphasizes the historical role of Patanjali as compiler, whereas Patanjali’s
    own text is silent on authorship, focusing instead on the content'
