sanskrit_devanagari: प्रयत्नस्यैथिल्यांन्तसमापत्तिभ्याम्
sanskrit_iast: prayatnaśaithilyānantasamāpattibhyām
translation_literal: Through the relaxation of effort and the settling into infinity, posture becomes
  steady.
commentary: 'This sūtra (II.47) describes the paradoxical mechanism by which āsana—physical posture—stabilizes.
  Patañjali identifies two simultaneous movements: prayatna-śaithilya (the easing or softening of muscular
  striving) and ananta-samāpatti (absorption into or alignment with the infinite, boundless dimension
  of space or consciousness).


  The teaching cuts against the common misunderstanding that yoga postures demand rigid control or maximum
  effort. Instead, Patañjali proposes that true stability arises when deliberate force relaxes and the
  practitioner''s awareness expands into something vaster than the body itself. This is not collapse or
  passivity—effort remains, but it becomes intelligent and economical rather than tense.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that puruṣa (pure consciousness) and
  prakṛti (nature/body) come into harmony not through domination but through right relationship. When
  the mind stops fighting the body and instead opens to the infinite space (ākāśa) in which the body moves,
  both effort and ease find their natural balance. The body settles because the mind has stopped fragmenting
  its attention.


  This is also preparation for the next sūtra (II.48), which teaches that from this stability, one becomes
  unaffected by the pairs of opposites (dvandva)—heat and cold, success and failure, comfort and discomfort.


  Key Terms


  **prayatna** — deliberate effort, exertion, or muscular engagement

  **śaithilya** — relaxation, softening, or release of tension

  **ananta-samāpatti** — absorption into or alignment with the infinite, boundless dimension (ananta =
  endless; samāpatti = settling, merging)'
insight: The aphorism asserts that the path to samādhi is paved with gentle effort and focus on the infinite,
  not with forceful striving.
practice: Hold any standing or seated posture you occupy right now, and on each exhale, release one layer
  of muscular grip—shoulders, then jaw, then belly—while simultaneously expanding your awareness outward
  to fill the room, then the building, then the sky beyond. Let your skeleton settle into the earth's
  support as your mind dissolves into spaciousness, until the posture holds itself.
