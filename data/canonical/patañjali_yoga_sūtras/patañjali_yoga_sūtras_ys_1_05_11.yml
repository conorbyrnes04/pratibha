sanskrit_devanagari: 'वृत्तयाḥ पञ्चतयः क्लिष्टाक्लिष्टाः ॥ १.५ ॥


  प्रमाणविपर्ययविकलपिन्ड्रास्मृतयः ॥ १.६ ॥


  प्रत्यक्षानुमानागमाः प्रमाणानि ॥ १.७ ॥


  विपर्ययो मिथ्याज्ञानम् अतद्रूपप्रतिṣ्ठम् ॥ १.८ ॥


  शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः ॥ १.९ ॥


  अभावप्रत्यालम्बनः वृत्तिर निद्रा ॥ १.१० ॥


  अनुभूतविषयासंप्रमोषः स्मृतिḥ ॥ १.११ ॥'
sanskrit_iast: 'vṛttayaḥ pañcatayyaḥ kliṣṭākliṣṭāḥ || 1.5 ||


  pramāṇaviparyayavikalpanidrāsmṛtayaḥ || 1.6 ||


  pratyakṣānumānāgamāḥ pramāṇāni || 1.7 ||


  viparyayo mithyājñānam atadrūpapratiṣṭham || 1.8 ||


  śabdajñānānupātī vastuśūnyo vikalpaḥ || 1.9 ||


  abhāvapratyayālambanā vṛttir nidrā || 1.10 ||


  anubhūtaviṣayāsaṃpramoṣaḥ smṛtiḥ || 1.11 ||'
translation_literal: '**1.5** The transformations of the mind are fivefold, each either painful or not painful.

  **1.6** They are [right knowledge], [wrong knowledge], [fancied], [sleeping], and [memory].

  **1.7** Direct cognition, inference, and testimony are the three valid means of knowledge.

  **1.8** Wrong knowledge is a false conception of a thing whose real form does not correspond to that conception.

  **1.9** Imaginary knowledge arises from words alone and is empty of any real object.

  **1.10** The transformation that is based on non-existence is sleep.

  **1.11** Memory is the non‑allowing of a thing to be cognised.'
commentary: 'The five vṛtti (mental transformations) form a complete taxonomy of how the mind operates, and Patañjali''s strategy
  is epistemological: by classifying the mind''s movements into pramāṇa (valid knowledge), viparyaya (misconception), vikalpa
  (imagination), nidra (sleep), and smṛti (memory), he establishes that liberation depends not on silencing the mind but on
  discerning the quality of its operations. The first three categories—direct perception, inference, and testimony—constitute
  the means by which truth can be known; the remaining two—imagination and sleep—are epistemic dead ends; memory occupies
  an ambiguous middle ground, preserving past cognitions but preventing fresh apprehension. What unifies this cluster is the
  recognition that prakṛti (nature/mind-stuff) manifests in multiple modes of knowing and non-knowing, and that the path to
  kaivalya (isolation of puruṣa) requires the practitioner to develop acute discrimination (viveka) among them. The painful
  vṛtti arise when the mind mistakes imagination for knowledge, or when sleep and memory substitute for direct encounter with
  reality. The non-painful vṛtti emerge when cognition aligns with what-is: perception grounded in sensory immediacy, inference
  grounded in valid reasoning, and testimony grounded in reliable authority. This is not a call to reject the mind but to
  refine it—to train the citta to operate through pramāṇa rather than through viparyaya, vikalpa, nidra, and smṛti''s distortions.
  The underlying move is Sāṃkhya''s core insight: prakṛti is not the enemy; ignorance of prakṛti''s true nature is. By mapping
  the five transformations with surgical precision, Patañjali hands the practitioner a diagnostic instrument: observe which
  vṛtti dominates your moment-to-moment experience, recognize whether it yields genuine knowledge or mere appearance, and
  consciously cultivate the discriminative awareness that allows puruṣa to stand apart from all mental content—painful or
  not.


  Key Terms


  **vṛtti** — mental transformation or fluctuation; the movements of citta that either obscure or reveal the nature of reality

  **pramāṇa** — valid means of knowledge (direct perception, inference, testimony); the epistemic instruments through which
  truth is reliably apprehended

  **viparyaya** — false or inverted knowledge; misconception arising when the mind grasps an object contrary to its actual
  form

  **viveka** — discrimination or discernment; the faculty of distinguishing the real from the apparent, puruṣa from prakṛti


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.26:** Both texts emphasize training the mind through disciplined practice (abhyāsa) and non-attachment;
  the Gītā''s call to steady the wandering mind parallels Patañjali''s taxonomy of vṛtti as a means to stabilize citta toward
  samādhi. Divergence: The Gītā frames mental discipline within dharma and devotion to Kṛṣṇa, whereas Patañjali''s Yoga is
  non-theistic and relies on epistemological discrimination alone.

  **Epictetus, Enchiridion 1.1:** Epictetus''s distinction between what is ''in our power'' (prohairesis, choice/assent) and
  what is not parallels Patañjali''s recognition that the mind''s vṛtti are natural movements, but our relationship to them—assenting
  to false knowledge or discriminating true knowledge—is where freedom lies. Divergence: Epictetus locates freedom in the
  will''s assent or refusal; Patañjali locates it in the puruṣa''s witnessing awareness, which transcends even the faculty
  of choice.

  **Plotinus, Enneads III.8.4:** Plotinus describes the soul''s descent into multiplicity and the necessity of turning inward
  to the One; similarly, Patañjali traces how prakṛti''s five-fold manifestations veil puruṣa, and liberation requires seeing
  through them to the unchanging witness. Divergence: Plotinus emphasizes mystical union with the transcendent One; Patañjali
  emphasizes kaivalya as the puruṣa''s permanent aloneness and non-participation in mental content.'
insight: The central claim of this passage is that the five categories listed are the only valid modes of cognition, each
  representing a distinct epistemic state that the practitioner must recognize and transc
practice: Notice when your thoughts cease and the mind settles into a state of stillness; acknowledge that this stillness
  is a transformation rooted in non‑existence, and remain present in that awareness.
