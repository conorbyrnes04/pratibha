sanskrit_devanagari: कायाकाशयोः सम्बन्धस्यमाल् लघुतुलसमापत्तेष् चाकाशगमनम्
sanskrit_iast: kāyākāśayoḥ saṃbandhasaṃyamāl laghutūlasamāpatteś cākāśagamanam
translation_literal: Through concentrated attention on the relationship between body and space-element,
  and by achieving a state of lightness like cotton fiber, movement through the ether becomes possible.
commentary: 'This sūtra describes an advanced siddhī (accomplishment) that emerges from a specific saṃyama—the
  binding together of dhāraṇā (focused attention), dhyāna (sustained meditation), and samādhi (absorption)—applied
  to the interface between the physical body (kāya) and the ākāśa (space-element or ether).


  The mechanism operates on two levels. First, the yogin must recognize that the body is not a solid,
  impenetrable mass but a structured arrangement of elements, including the space-element that pervades
  it. The Yoga–Sāṃkhya framework teaches that all matter is composed of five elements (mahābhūta), and
  ākāśa—the subtlest and most pervasive—is the medium in which all other elements exist. By directing
  saṃyama toward the saṃbandha (relationship, connection, bond) between body and this space-element, the
  practitioner''s awareness shifts from identifying with density and weight to recognizing the spacious,
  permeable nature of embodied existence.


  Second, the fruit of this saṃyama is laghutūlasamāpatti—a state of becoming as light as cotton fiber
  (tūla). This is not mere visualization or metaphor; in the Yoga Sūtras'' framework, saṃyama on any object
  produces a direct, non-conceptual knowing of that object''s essential nature, which in turn grants mastery
  over it. As the body''s relationship to space becomes transparent to consciousness, the gravitational
  and inertial properties that bind the body to the earth naturally diminish. The body becomes, in effect,
  as weightless as the element it has come to embody.


  The result is ākāśagamana—movement through the ether, or levitation. This is not presented as supernatural
  fantasy but as a natural consequence of aligning the body''s subtle structure with the space-element
  that is already its fundamental medium.


  This sūtra belongs to the third chapter (Vibhūti Pāda), which catalogs the powers that arise when saṃyama
  is applied to different objects. It is a teaching on the mechanics of transformation: consciousness,
  when locked onto the true nature of a thing, dissolves the illusion of separation and grants freedom
  within that domain.


  Key Terms


  **ākāśa** — Space-element, the subtlest of the five elements; the medium in which all other elements
  exist; often translated as ether.

  **saṃyama** — The unified binding of dhāraṇā (focus), dhyāna (meditation), and samādhi (absorption)
  on a single object; the instrument by which yogic powers arise.

  **laghutūla** — Lightness like cotton fiber; the state of weightlessness achieved through saṃyama on
  the body–space relationship.'
insight: The central philosophical claim of this verse is that the subtle faculty of hearing—an extension
  of perception—arises not from the ear alone but from the disciplined union of the body (kāyā) with the
practice: Lift one arm slowly forward until it floats at shoulder height, then pause and feel the weight
  of it—now imagine the space within your arm (the hollows, the gaps between cells) gradually expanding
  like cotton fibers opening. With each exhale, let the arm become lighter, less dense, until you sense
  it is held aloft more by the ether around it than by your own strength. Repeat with the other arm, then
  both together, moving them through the air as if you are moving *with* space rather than *through* it.
