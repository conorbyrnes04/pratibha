sanskrit_devanagari: कायाकाशयोः सम्बन्धस्यमाल् लघुतुलसमापत्तेष् चाकाशगमनम्
sanskrit_iast: kāyākāśayoḥ saṃbandhasaṃyamāl laghutūlasamāpatteś cākāśagamanam
translation_literal: By regulating the link between body and ether, one attains subtle hearing beyond ordinary limits.
commentary: 'The central philosophical claim of this verse is that the subtle faculty of hearing—an extension of perception—arises
  not from the ear alone but from the disciplined union of the body (kāyā) with the cosmic medium (ākāśa). This union is not
  a mere physical coupling but a *saṃyama*—a conscious, sustained control of the bodily–etheric relationship. The contested
  move here is the identification of *ākāśa* as a partner in sensory experience, which some commentators treat as a metaphysical
  backdrop rather than an active participant. Within the Yoga and Sāṃkhya framework, the body is an instrument of prakṛti,
  while ākāśa is the substrate that permits the flow of prāṇā. By mastering their interaction, the practitioner transcends
  ordinary hearing, accessing *vṛtti* (mental modifications) that are normally beyond the ear’s reach. This has existential
  implications: the ability to hear beyond the physical world becomes a metaphor for perceiving the subtle layers of consciousness,
  enabling one to discern the *citta*’s fluctuations and ultimately to recognize the *puruṣa* as distinct from prakṛti. The
  verse thus invites a practice that is both bodily and meditative, aligning with the Yoga Sutra’s emphasis on *saṃyama* as
  a gateway to higher states of awareness.


  Key Terms


  **kāyā (कायः)** — kāyā (body) – from root *kā* ‘to be’ + *-yā* ‘that which is’; in Sāṃkhya, the material body, the vehicle
  of prakṛti; the translation ‘body’ omits its role as the dynamic interface between prakṛti and puruṣa.


  **ākāśa (आकाशः)** — ākāśa (ether) – from *ākāś* ‘space’ + *-a*; in Yoga it is the boundless medium that allows the transmission
  of prāṇa; the literal ‘space’ misses its function as the subtle medium of all sensory and energetic exchanges.


  **saṃyama (सम्यमा)** — saṃyama (discipline) – from *sam* ‘together’ + *yama* ‘to restrain’; in Yoga it denotes the conscious,
  sustained control of the body and mind, essential for accessing higher states; the generic ‘discipline’ overlooks its specific
  meditative quality.


  **vṛtti (वृत्ति)** — vṛtti (mental modification) – from *vṛ* ‘to turn’ + *tti* ‘action’; in Sāṃkhya it refers to the fluctuations
  of citta that obscure puruṣa; the term ‘thought’ fails to capture its dynamic, obstructive nature.


  Cross-Tradition Resonances


  **Yoga Sutra 1.2:** Both verses emphasize the role of *saṃyama* in controlling bodily faculties to access subtle states;
  the structure mirrors the pattern of body‑ether interaction.

  *Divergence:* While 1.2 speaks of *saṃyama* in general, 3.42 specifies the ear‑ether link, highlighting a particular sensory
  modality rather than a universal principle.


  **Sāṃkhya Karika 1.1:** The identification of *ākāśa* as a partner in perception parallels the Karika’s assertion that prakṛti’s
  elements (earth, water, fire, air, ether) are inseparable in the functioning of the mind.

  *Divergence:* The Karika treats *ākāśa* as a passive element, whereas the Yoga Sutra presents it as an active medium for
  sensory expansion.


  **Bhaṭṭa’s commentary on Yoga Sutra 3.42:** Bhaṭṭa notes the necessity of *saṃyama* for the subtle hearing, aligning with
  the verse’s claim of disciplined union.

  *Divergence:* He expands the verse to include the role of *prāṇa* regulation, whereas the sutra itself remains concise,
  focusing solely on the body‑ether link.


  **Patanjali, Yoga Sutra 2.46:** Both verses involve the idea that controlled bodily states lead to heightened perception,
  a theme recurring in Patanjali’s discussion of *samādhi*.

  *Divergence:* Patanjali’s passage discusses the cessation of *vṛtti* as a prerequisite for *samādhi*, whereas 3.42 directly
  links *saṃyama* to the activation of a specific subtle faculty.'
insight: The central philosophical claim of this verse is that the subtle faculty of hearing—an extension of perception—arises
  not from the ear alone but from the disciplined union of the body (kāyā) with the
practice: Regulate the breath so that the body’s subtle vibrations align with the surrounding ether, allowing you to hear
  sounds beyond ordinary hearing.
