practice: '**Three-Point Recognition Practice (15 minutes)**


  Sit quietly. Bring to mind a situation or relationship you currently find pleasant or satisfying. Hold
  it clearly in awareness.


  1. **Pariṇāma**: Notice that this pleasant state will change. It is not stable. Feel the subtle anxiety
  beneath the pleasure—the knowing that it cannot last. Sit with that recognition for 2–3 minutes without
  judgment.


  2. **Saṃskāra**: Notice the habitual patterns and old wounds that shape how you relate to this situation.
  What conditioning makes you cling to it? What fear or need drives your attachment? Observe without fixing.
  2–3 minutes.


  3. **Guṇa-conflict**: Notice that even in this moment of clarity, your mind is not truly at rest. There
  is still a subtle restlessness, a pull between wanting more, fearing loss, or judging the experience.
  2–3 minutes.


  Then, without effort, let the attention rest in the space of awareness itself—the unchanging witness
  to all these fluctuations. Notice that this witnessing presence is untouched by the three forms of suffering
  you just observed.


  This is viveka in action: not rejection of life, but clear seeing that liberation is not found in managing
  the guṇas but in recognizing the puruṣa—the Self—that is prior to all of them.'
