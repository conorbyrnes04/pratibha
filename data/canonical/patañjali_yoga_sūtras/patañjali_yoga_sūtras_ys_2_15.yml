sanskrit_devanagari: परिणामतापसंस्कारदुःखैः गुणवृत्तिविरोधाच्च दुःखम् एव सर्वं विवेकिनः
sanskrit_iast: pariṇāmatāpasaṃskāraduḥkhair guṇavṛttivirodhāc ca duḥkham eva sarvaṃ vivekinaḥ
translation_literal: To the discriminating one, all is suffering—from the suffering of transformation,
  the suffering of pain, and the suffering of latent impressions, as well as from the conflict between
  the fluctuations of the guṇas themselves.
commentary: 'This is Patañjali''s stark diagnosis of conditioned existence, presented not as pessimism
  but as the clear seeing (viveka) that marks the beginning of genuine practice. The verse names three
  layers of duḥkha (suffering or unsatisfactoriness) that the discriminating mind recognizes:


  1. **Pariṇāma-duḥkha** (suffering of transformation): All composite things—body, mind, relationships,
  circumstances—are in constant flux. Even pleasant states inevitably change, and the clinging to them
  creates suffering when they pass.


  2. **Tāpa-duḥkha** (suffering of pain): Direct physical and mental anguish, obvious but often treated
  as exceptional rather than structural.


  3. **Saṃskāra-duḥkha** (suffering of latent impressions): The deep conditioning—karmic imprints, habitual
  patterns, unresolved trauma—that shapes perception and reaction beneath conscious awareness. These operate
  even in apparent peace.


  4. **Guṇa-vṛtti-virodha** (conflict of the guṇa-fluctuations): The three guṇas (sattva, rajas, tamas)
  are always in dynamic tension. Even when sattva (clarity, harmony) dominates, its dominance is unstable
  and will shift. This inherent instability is itself a form of suffering.


  The key phrase is **vivekinaḥ**—"to the one who discriminates." This is not abstract knowledge but direct
  recognition. The enlightened (or awakening) person sees that all conditioned existence, however refined
  or pleasant, carries this threefold or fourfold character of duḥkha. This recognition is not meant to
  induce despair but to redirect energy away from seeking lasting satisfaction in the phenomenal world
  and toward the unconditioned Self (puruṣa).


  Within the Yoga–Sāṃkhya framework, this verse establishes why yoga practice is necessary: ordinary consciousness
  mistakes temporary states for lasting peace. Viveka—discrimination—is the first tool that cuts through
  that delusion.


  Key Terms


  **viveka** — Discrimination; the capacity to distinguish between the eternal Self (puruṣa) and the changing
  field of nature (prakṛti); the first essential tool of yoga.

  **guṇa** — The three qualities or modes of prakṛti: sattva (clarity, harmony), rajas (activity, passion),
  tamas (inertia, darkness); all conditioned existence is woven from their interplay.

  **saṃskāra** — Latent impression, karmic trace, or conditioning imprint in the mind; the subtle residue
  of past actions and experiences that shapes present perception and behavior.'
