sanskrit_devanagari: तसाम् अनादित्वं चाशिषः नित्यत्वात्
sanskrit_iast: tāsām anāditvaṃ cāśiṣo nityatvāt
translation_literal: Those impressions are beginningless, and desires are eternal because of their perpetual
  nature.
commentary: 'This sūtra (II.12) addresses a fundamental problem in Yoga–Sāṃkhya philosophy: the apparent
  circularity of bondage. If we ask ''where do desires come from?'' the answer cannot be ''from a beginning
  point,'' because that would require an originating cause outside the system of prakṛti (matter/nature)
  and puruṣa (consciousness). Instead, Patañjali teaches that vāsanā (impressions or subliminal traces)
  and the desires they generate have no temporal origin—they are anāditva, beginningless. This is not
  mysticism but logical necessity: the cycle of desire, action, and impression-formation has always existed
  within the structure of prakṛti itself. Desires persist (nityatva, eternal/perpetual) because the mechanism
  that produces them—the interplay of guṇa (qualities) and the mind''s identification with them—is intrinsic
  to nature''s functioning. Understanding this removes the false hope that desires will simply ''end on
  their own'' and redirects practice toward the real solution: viveka (discrimination) between puruṣa
  and prakṛti, which alone breaks the cycle. The yogi does not wait for desires to exhaust themselves;
  he recognizes their structural inevitability and disidentifies from them through knowledge.


  Key Terms


  **vāsanā** — Subliminal impressions or traces left by past actions and experiences; the latent seeds
  of future desires and conditioning

  **anāditva** — The quality of being beginningless; having no temporal origin or starting point

  **viveka** — Discrimination or discernment; the capacity to distinguish between puruṣa (pure consciousness)
  and prakṛti (nature/matter)'
insight: The sūtra asserts that the desire to live (āśiṣḥ) associated with impressions (tāsām) is devoid
  of a beginning, yet it emanates from an eternal principle.
practice: 'Notice one desire that arises today—hunger, restlessness, the pull toward your phone—and instead
  of tracing backward, pause and ask: *Is this desire new, or am I meeting it again?* Hold the recognition
  that this same pull has moved through you countless times before, perhaps in forms you no longer remember.
  Let that recognition settle without trying to change or escape the desire itself.'
