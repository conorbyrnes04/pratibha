sanskrit_devanagari: अस्तेयप्रतिṣ्ठायां सर्वरत्नोऽपस्ठाम्
sanskrit_iast: asteyapratiṣṭhāyāṃ sarvaratnopasthānam
translation_literal: When non-stealing is firmly established, all treasures present themselves.
commentary: 'This sūtra belongs to the Yoga Sūtras'' treatment of the yamas (ethical restraints), specifically
  asteya—the principle of not taking what is not given. Patañjali asserts that this restraint operates
  as a positive attractor: genuine wealth flows naturally to one who has abandoned the mental habit of
  grasping, coveting, and appropriating.


  The mechanism is both psychological and metaphysical within the Sāṃkhya-Yoga framework. When the mind
  is no longer contracted by desire to possess what belongs to another—whether material goods, attention,
  time, or credit—it releases a tremendous amount of mental energy (śakti) that was bound in that tension.
  This freed energy aligns the practitioner''s subtle nature (sūkṣma śarīra) with natural abundance. More
  practically: a person who has genuinely internalized asteya becomes trustworthy, and trustworthy people
  attract opportunities, relationships, and resources that those driven by acquisition do not.


  The word pratiṣṭhā (established, grounded, firm) suggests this is not a temporary abstinence but a rooted
  transformation of character. Sarvaratna (all jewels, all precious things) is not limited to money; it
  includes knowledge, friendship, health, and the fruits of right action. The sūtra does not promise magical
  wealth but describes the natural ecology of a mind freed from the stealing impulse: such a mind becomes
  a magnet for what it genuinely needs.


  Key Terms


  **asteya** — Non-stealing; the ethical principle of not taking what is not given, rooted in the recognition
  that all beings have inherent rights.

  **pratiṣṭhā** — Firm establishment, grounding; the state of being rooted and stable in a principle or
  practice.

  **sarvaratna** — All jewels, all treasures; the full spectrum of precious things—material, relational,
  and spiritual—that naturally flow to the aligned being.'
insight: The central claim of this sūtra is that ethical restraint—specifically, the negation of theft—constitutes
  the foundational condition for the natural influx of prosperity.
practice: Each time you receive something—a gift, a compliment, an opportunity, a meal—pause and let it
  fully land in your hands or awareness for three breaths before moving it forward or accepting it, noticing
  how the receiving itself (rather than grasping for more) feels in your body.
