- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this sūtra is that ethical restraint—specifically, the negation of theft—constitutes
    the foundational condition for the natural influx of prosperity. In the Sāṃkhya‑Yoga framework, the
    puruṣa’s liberation is achieved by purifying the mind of vṛtti, and the sūtra posits that the vṛtti
    of avarice, manifested as stealing, blocks the flow of prakṛti’s bounty. The contested move here is
    the identification of non‑stealing not merely as a moral precept but as a causal agent that opens
    the channels of wealth; some commentators treat it as a symbolic virtue, others as a literal mechanism.
    By situating the sūtra within the broader Yoga canon, we see a parallel with the earlier aphorism
    that “the mind is the source of all wealth” (YS 2.35), yet this sūtra adds a concrete behavioral injunction.
    The existential import is that the practitioner’s daily conduct—whether in work, consumption, or interpersonal
    relations—directly influences the material and spiritual sustenance that follows. Thus, the sūtra
    invites a lived ethic: cultivate non‑stealing not as a distant ideal but as an active, present‑moment
    practice that invites abundance to flow naturally.


    Key Terms


    **asteya (अस्तेय)** — root: asti (to be) + -eya (negation) -> non‑stealing; in Sāṃkhya, it denotes
    the cessation of the vṛtti of avarice, which is essential for puruṣa’s freedom; the ordinary translation
    ‘not stealing’ omits its role as a purifying practice


    **pratiṣṭhāyām (प्रतिष्ठायाम्)** — pra (forth) + iṣṭhā (establish) -> upon having established; in
    Yoga, it signifies a firm, sustained state of ethical discipline, not merely a momentary act


    **sarva (सर्व)** — all; in Sāṃkhya, it implies the totality of prakṛti’s manifestations, indicating
    that the benefit is not selective but universal


    **ratna (रत्न)** — gem; metaphor for wealth, encompassing material, spiritual, and relational riches;
    the term’s literal sense of precious stone highlights the preciousness of what is received


    Cross-Tradition Resonances


    **Yoga Sūtra 2.35 – ‘cittaḥ sarvasattāṃ sarvabhūtāḥ’:** Both sūtras link the mind’s purity to the
    influx of wealth; 2.35 speaks of the mind as the source, while 2.37 specifies the condition (non‑stealing)
    that activates this source

    *Divergence:* 2.35 is abstract, 2.37 is prescriptive; the latter grounds the former in ethical practice


    **Buddhism, Abhidharma, ‘Khandhāyāna’ – ‘non‑stealing as a precondition for prosperity’:** Structural
    similarity: a precondition (non‑stealing) leading to a positive outcome (prosperity)

    *Divergence:* Buddhist account frames theft as a hindrance to mental clarity, whereas the Yoga text
    frames it as a blockage to material influx


    **Māyāyāna, ‘Brahma Sutra 1.2.5’ – ‘the world is a reflection of the mind’:** Both texts assert that
    external reality (wealth) is a reflection of internal state (non‑stealing)

    *Divergence:* Brahma Sutra emphasizes metaphysical causality, Yoga sūtra emphasizes practical ethics


    **Ānanda, ‘Yoga Vāsiṣṭha 1.1’ – ‘the mind is the source of all wealth’:** Parallel claim that the
    mind generates wealth; the Vāsiṣṭha is more metaphysical, the sūtra is more behavioral'
