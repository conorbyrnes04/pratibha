sanskrit_devanagari: ध्यानहेयस् तद्वृत्तयाḥ
sanskrit_iast: dhyānaheyās tadvṛttayaḥ
translation_literal: The transformations of that [mind] are removed through meditation.
commentary: 'This sūtra appears in the context of Patañjali''s treatment of the kleshas (afflictions)
  and the vrittis (mental modifications or fluctuations). The verse asserts that meditation (dhyāna)—sustained,
  unwavering attention on a single object or principle—serves as the direct means to eliminate the vrittis
  associated with the afflicted mind.


  In the Yoga Sūtras framework, the mind''s natural tendency is to generate endless modifications: desires,
  aversions, memories, imaginings, and conceptual elaborations. These vrittis are the substrate of suffering
  and bondage. While other practices (like pranayama, pratyahara, or ethical discipline) prepare the ground,
  dhyāna is the specific instrument that dissolves these fluctuations at their root.


  The word heyās (removable, to be eliminated) indicates that these vrittis are not permanent features
  of consciousness itself but rather conditioned patterns that can be systematically dissolved. Dhyāna
  works not by suppressing or fighting the mind, but by redirecting attention so completely and steadily
  that the mind''s compulsive generation of modifications ceases naturally. As the mind becomes absorbed
  in the object of meditation, the distinction between observer and observed dissolves, and the vrittis
  lose their power.


  This is a practical statement: meditation is not merely contemplative luxury but a precise technology
  for mental transformation. The sūtra presupposes that one has already stabilized the body (āsana), regulated
  the breath (prānāyāma), and withdrawn the senses (pratyāhāra). Dhyāna is the next stage, where the concentrated
  mind becomes the instrument of liberation.


  Key Terms


  **dhyāna** — Sustained, unbroken meditation; the sixth limb of yoga in which consciousness rests on
  a single object without wavering.

  **vritti** — A modification, fluctuation, or whirlpool of the mind; any mental content or pattern that
  arises in consciousness.

  **heyā** — That which is to be removed, eliminated, or overcome; removable affliction or obstacle.'
insight: The central claim of this verse is that the mind’s habitual modifications—its vṛtti—must be quelled
  through the practice of dhyāna.
practice: 'Choose a simple, stable object of meditation: the natural breath, a visual point (like a candle
  flame or dot on the wall), or a mantra repeated silently. Sit comfortably for 10–15 minutes in a quiet
  space. Close your eyes (unless using a visual object). Begin observing your chosen object without trying
  to change it. When the mind wanders—and it will—gently return attention to the object, without judgment
  or frustration. Do not force concentration; instead, allow your attention to settle naturally, like
  sediment in still water. Practice this daily. Over weeks, you will notice that the mind''s constant
  chatter diminishes, and periods of unbroken focus lengthen. This is dhyāna beginning to work: the vrittis
  are not being fought but are being starved of the attention they feed on. The practice itself is the
  proof.'
