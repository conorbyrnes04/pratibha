sanskrit_devanagari: 'परमाणुपरममहत्त्वान्तो ’स्य वैशिकारः ॥ १.४० ॥


  क्षीणवृत्तरेभिजातस्येवा मणेर् ग्रहितृग्राहणग्राह्येषु तत्त्वशतदंजनातां समापत्तिḥ ॥ १.४१ ॥


  तत्र शब्दार्थज्ञानविकलपैः संकीर्णा स्वितर्का समापत्तिḥ ॥ १.४२ ॥


  स्मृतिपरीशुद्धौ स्वरूपशून्येवार्थमात्रनिर्भासा निःवित्रकाः ॥ १.४३ ॥


  एतायिव सविचारः नीरविचारः च सूक्ष्मविषयः व्याख्याता ॥ १.४४ ॥


  सूक्ष्मविषयत्वं चालीङ्गपर्यवसाम् ॥ १.४५ ॥


  तैव सर्वबीजः समाधिः ॥ १.४६ ॥'
sanskrit_iast: 'paramāṇuparamamahattvānto ''sya vaśīkāraḥ || 1.40 ||


  kṣīṇavṛtter abhijātasyeva maṇer grahītṛgrahaṇagrāhyeṣu tatsthatadañjanatā samāpattiḥ || 1.41 ||


  tatra śabdārthajñānavikalpaiḥ saṃkīrṇā savitarkā samāpattiḥ || 1.42 ||


  smṛtipariśuddhau svarūpaśūnyevārthamātranirbhāsā nirvitarkā || 1.43 ||


  etayaiva savicārā nirvicārā ca sūkṣmaviṣayā vyākhyātā || 1.44 ||


  sūkṣmaviṣayatvaṃ cāliṅgaparyavasānam || 1.45 ||


  tā eva sabījaḥ samādhiḥ || 1.46 ||'
translation_literal: '**1.40** You master the mind from the smallest atom to the greatest infinity.

  **1.41** When the mind’s transforming tendencies are annihilated, the practitioner becomes entirely one with the cogniser,
  the cognition, and the cognised, as if a transparent jewel is absorbed into itself.

  **1.42** There, the concentrated mind, mixed with the word, its meaning, and understanding, narrows to a single point of
  insight.

  **1.43** In this samādhi, the mind is free from all arguments; the object’s true nature is present alone, as if it were
  utterly unlike itself, and the memory of its name, form, meaning, or relation has dissolved.

  **1.44** By these, the deliberative and non‑deliberative [concentrations] that refer to the subtle elements are also explained.

  **1.45** The subtle object of concentration ends in the state of the subtle, where the object ceases to be a distinct entity
  and merges with the observer.

  **1.46** This very state is [samādhi] in which the mind is seeded.'
commentary: 'Sūtras 1.40–1.46 trace a single arc: the mind''s capacity to master reality at every scale, from atom to infinity,
  culminates not in omniscience but in a peculiar transparency—the dissolution of the observer into the observed. The cluster
  moves from mastery (vaśīkāra) through annihilation of mental tendencies (vṛtti-kṣaya) to a final seeded samādhi where subject-object
  duality collapses without obliterating consciousness itself.


  The opening claim—that concentration spans atom to infinity—is not metaphorical expansion but a precise phenomenological
  point: the mind''s capacity to bind itself (vaśya) to an object is scale-invariant. Whether the object is infinitesimal
  or cosmic, the mechanism of samādhi remains identical. This universality matters because it establishes that samādhi is
  not a special state reserved for particular objects, but a structural possibility of citta itself.


  Sūtra 1.41 makes the existential move explicit: when vṛtti cease, the triad of cogniser, cognition, and cognised fuses.
  The transparent jewel metaphor is precise—not blank, but perfectly clear, allowing light to pass through without distortion.
  In Sāṃkhya terms, prakṛti (here, the mental apparatus) becomes so refined that puruṣa''s witnessing presence shines through
  unobstructed. This is not puruṣa absorbing prakṛti, but prakṛti becoming so subtle and still that the distinction between
  subject and object becomes phenomenologically irrelevant.


  Sūtras 1.42–1.43 refine the mechanism: samādhi with seed (sabīja) operates through the semantic triad of word, meaning,
  and understanding fused into a single point. Yet paradoxically, in this very concentration, the object''s name, form, and
  conceptual associations dissolve. The mind does not grasp the object through its conventional markers but penetrates to
  its svarūpa (intrinsic nature), which appears "utterly unlike itself"—stripped of all conceptual overlay. This is the crucial
  tension: semantic engagement (śabda-artha-buddhi) is the vehicle, yet its dissolution is the destination.


  The final sūtras (1.44–1.46) extend this logic to the subtle elements (tanmātra) and establish the endpoint: samādhi with
  seed is precisely the state where the object ceases to be a distinct entity and merges with the observer. This is not kaivalya
  (absolute isolation of puruṣa), but a threshold state—consciousness still has an object, yet the boundary between knower
  and known has become permeable. The "seed" (bīja) is this residual object, which prevents collapse into formless absorption
  yet maintains the structure of conscious knowing.


  Key Terms


  **vṛtti-kṣaya** — annihilation of mental fluctuations; the cessation of citta''s transforming tendencies that permits non-dual
  awareness

  **sabīja-samādhi** — concentration with seed; samādhi in which a subtle object remains, distinguishing it from nirbīja (seedless)
  absorption

  **svarūpa** — intrinsic nature or true form of an object, revealed when conceptual and linguistic overlays dissolve

  **vaśīkāra** — mastery or binding of the mind to an object; the yogi''s capacity to command attention across all scales
  of reality


  Cross-Tradition Resonances


  **Advaita Vedānta (Śaṅkara, Brahma Sūtra Bhāṣya 1.1.4):** Both traditions posit that ultimate knowledge involves the dissolution
  of subject-object duality and the recognition of non-difference between knower and known; the transparent jewel mirrors
  the metaphor of ātman as pure consciousness. Divergence: Advaita seeks immediate recognition of ātman-brahman identity as
  the sole reality, while Yoga-Sāṃkhya retains samādhi with seed as a distinct state before kaivalya, preserving a subtle
  phenomenological structure rather than collapsing into pure non-duality.

  **Plotinus, Enneads 6.9.11 (henosis, mystical union):** Both describe a state where subject and object merge into undifferentiated
  unity, and both emphasize that this union is not passive obliteration but an active, conscious presence. Divergence: Plotinus''s
  henosis is union with The One beyond being and intellection, whereas Yoga''s sabīja-samādhi retains a subtle object and
  the structure of knowing; Yoga does not dissolve into the transcendent but refines consciousness within manifestation.

  **Meister Eckhart, ''Detachment'' (Abgeschiedenheit):** Both traditions teach that liberation requires the annihilation
  of the ego''s habitual patterns and a radical transparency of mind, allowing the divine (or puruṣa) to shine through unobstructed.
  Divergence: Eckhart emphasizes God''s transcendence and the soul''s receptive emptying, while Yoga-Sāṃkhya maintains that
  the yogi actively masters and refines prakṛti through disciplined concentration, not through passive surrender.'
insight: The passage asserts that a true yogi’s mind, when its vṛtti (transforming tendencies) are extinguished, dissolves
  into a state of perfect identity with the triad of cogniser, cognition, and cognised.
practice: Focus your attention on a single point, then gradually widen that focus until it encompasses all of existence, thereby
  mastering the mind from the smallest atom to the greatest infinity.
