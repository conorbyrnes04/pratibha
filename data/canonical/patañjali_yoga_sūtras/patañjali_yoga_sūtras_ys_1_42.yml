sanskrit_devanagari: तत्र शब्दार्थज्ञानविकलपैः संकीर्णा स्वितर्का समापत्तिḥ
sanskrit_iast: tatra śabdārthajñānavikalpaiḥ saṃkīrṇā savitarkā samāpattiḥ
translation_literal: In that absorption, when cognition of word, object, and knowledge are mixed together, the meditative
  state is called savitarkā samāpatti—absorption with deliberation.
commentary: 'This sūtra (1.42) describes the first stable form of samāpatti (absorption or coalescence), the state where the
  meditator''s mind becomes unified with its object. The qualifier savitarkā means ''with vitarka''—with deliberation, reasoning,
  or discursive thought.


  Patañjali distinguishes this from nirvitarkā (without deliberation), which comes later. Here, the mind is still operating
  through the normal channels of cognition: śabda (word or sound), artha (the object or meaning), and jñāna (knowledge or
  awareness of it). These three typically function separately in ordinary consciousness—we hear a word, recognize an object,
  and form knowledge about it as distinct mental acts. In savitarkā samāpatti, these three become saṃkīrṇā (mixed, blended,
  or fused) into a single unified perception.


  This is not confusion but integration. The meditator perceives the object, its name, and the knowing of it as one coherent
  whole, yet the process still involves vitarka—the mind''s natural movement through reasoning and conceptual engagement.
  This is the gateway absorption, the first resting place where the ordinary mind begins to dissolve into meditative unity.
  It is stable enough to be called samāpatti (a ''coming together'' or ''coinciding''), yet still contains the scaffolding
  of thought.


  Within the Yoga–Sāṃkhya framework, this represents the mind (buddhi) beginning to align with its object without yet transcending
  the subject-object duality entirely. The three components of knowing—word, meaning, and knowledge—mirror the three guṇas
  or the triadic structure of perception itself, and their fusion signals the first breakthrough toward non-dual absorption.


  Key Terms


  **savitarkā** — with vitarka; meditative absorption that still involves discursive thought, reasoning, or deliberation through
  the normal channels of cognition

  **samāpatti** — coalescence or absorption; a state in which the meditator, the act of meditation, and the object meditated
  upon become unified or coincident

  **śabdārthajñāna** — the triad of word (śabda), object or meaning (artha), and knowledge (jñāna)—the three components of
  ordinary perception that fuse in absorption'
insight: The sutra asserts that samādhi is not merely a state of stillness but an active, focused engagement of the mind with
  the semantic content of a word.
practice: 'Choose a simple object—a candle flame, a stone, a flower, or even a single word written on paper. Sit quietly and
  gaze at it (or hold it in attention) for 10–15 minutes without looking away or letting the mind wander. As you do, notice
  the three layers: (1) the sensory input or name of the object, (2) the object itself as it appears, and (3) your awareness
  knowing it. Rather than analyzing them, simply allow them to settle into a single, unified perception. Do not force; let
  the mind naturally become absorbed. You may notice a moment when the distinction between ''you observing'' and ''the object
  observed'' softens, and word, meaning, and knowing feel like one event rather than three separate ones. That moment is savitarkā
  samāpatti. Practice this daily for 5–10 minutes to familiarize the mind with this unified state.'
