sanskrit_devanagari: 'देशबन्धः चित्तस्य धारणाः ॥ ३.१ ॥


  तत्र प्रत्ययैकतानता ध्यानम् ॥ ३.२ ॥


  तद् एवार्तमात्रनिर्भासं स्वरूपशून्यम् इव समादिः ॥ ३.३ ॥'
sanskrit_iast: 'deśabandhaś cittasya dhāraṇā || 3.1 ||


  tatra pratyayaikatānatā dhyānam || 3.2 ||


  tad evārthamātranirbhāsaṃ svarūpaśūnyam iva samādhiḥ || 3.3 ||'
translation_literal: '**3.1** **3.1** Binding awareness to a single location—this is concentration (dhāraṇā).

  **3.2** **3.2** The unbroken flow of a single object of awareness in that place—this is meditation (dhyānam).

  **3.3** **3.3** That same meditation, shining as the object alone, emptied of its own form—this is absorption (samādhiḥ).'
commentary: 'These three sūtras map the progressive dissolution of the subject–object duality through disciplined mental practice.
  Sūtra 3.1 establishes dhāraṇā (concentration) as the deliberate fixing of citta upon a single point—not passive drift but
  intentional restraint of vṛtti (mental modifications). This act is foundational: by choosing a śuddha (pure) object, the
  practitioner ensures the mind does not entangle further in prakṛti''s fluctuations. Sūtra 3.2 then describes what occurs
  when this fixation deepens: dhyāna (meditation) emerges as the mind''s ekatā (unity) with the object, a qualitative shift
  where the subject–object distinction begins to thin. This is not mere perceptual alignment but an ontological transformation
  in which the citta''s pratyaya (intentional content) becomes monistic. The mind ceases oscillating between multiple vṛtti
  and settles into a single, self-sustaining reality. Sūtra 3.3 completes the arc by naming samādhi proper: the state in which
  consciousness becomes aware only of the object, stripped of its own form (svarūpa-śūnya). Here the puruṣa (witness consciousness)
  appears to merge with prakṛti''s manifestation—not actually fusing, but so thoroughly absorbed that the distinction collapses
  in lived experience. The three sūtras thus trace a single argument: intentional concentration → unified absorption → objectless
  consciousness. Each stage refines the previous one, moving from active effort (dhāraṇā) through sustained focus (dhyāna)
  to effortless absorption (samādhi). The framework is Sāṃkhya: prakṛti and puruṣa remain eternally distinct, yet through
  disciplined practice the mind can so completely identify with a single object that the usual subject–object duality dissolves,
  revealing the puruṣa''s unchanging witness nature. This is not escape from prakṛti but its temporary transcendence through
  the mind''s own refinement.


  Key Terms


  **dhāraṇā** — concentration; the deliberate fixing of mind upon a single point, the first of the inner three limbs

  **dhyāna** — meditation; the sustained, unbroken flow of the mind unified with its object, the second of the inner three
  limbs

  **samādhi** — absorption; the state in which consciousness is aware only of the object, emptied of its own form, the third
  of the inner three limbs

  **vṛtti** — mental modifications or fluctuations; the movements of citta that obscure the puruṣa''s true nature


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.25–26:** Both texts prescribe a gradual, disciplined withdrawal of the mind from sensory objects toward
  a single focus (Kṛṣṇa instructs Arjuna to fix the mind on the self, step by step), culminating in a unified state of consciousness.
  The three-stage progression mirrors yoga practice across both traditions. Divergence: The Gītā emphasizes devotion and duty
  (bhakti, dharma) as the context for this mental discipline, whereas the Yoga Sūtras present the practice as self-sufficient
  and independent of ethical or devotional framing.

  **Plotinus, Enneads VI.9.11:** Plotinus describes the soul''s ascent toward union with the One through progressive stages
  of contemplation, in which the subject–object distinction dissolves and the soul becomes what it contemplates. The three-fold
  movement (intention, sustained focus, absorption) parallels the Neoplatonic ascent. Divergence: Plotinus locates this union
  in a transcendent metaphysical reality (the One), while Patañjali''s samādhi remains grounded in the phenomenology of citta
  and its relationship to prakṛti and puruṣa within a dualist framework.

  **Epictetus, Enchiridion 1.4:** Both traditions emphasize that liberation comes through disciplined, intentional practice
  (askēsis / abhyāsa) rather than passive acceptance, and both locate freedom in the mastery of the mind''s focus and attachment.
  Divergence: Epictetus frames freedom as ethical (distinguishing what is within our control from what is not), while Patañjali
  frames it as metaphysical (the puruṣa''s recognition of its separation from prakṛti through samādhi).'
insight: The passage asserts that true samādhi is not a passive trance but a conscious absorption in which the mind forgets
  the act of thinking and becomes the very object of thought.
practice: You focus your awareness solely on the object of your meditation, letting go of all thoughts about the act of thinking,
  and allow yourself to become fully absorbed in that object.
