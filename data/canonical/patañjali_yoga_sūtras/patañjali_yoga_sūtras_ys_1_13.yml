sanskrit_devanagari: तत्र स्थितौ यत्नोऽभ्यासः
sanskrit_iast: tatra sthitau yatno 'bhyāsaḥ
translation_literal: There, the effort to remain stable is practice.
commentary: 'This sūtra appears in the context of āsana (posture) and the foundational principle that
  yoga is built on sustained effort toward steadiness. Patañjali has just defined yoga as the cessation
  of mental fluctuations (yogaś citta-vṛtti-nirodhah), and now he addresses the practical means: āsana,
  or seated posture, must be both sthira (stable) and sukha (comfortable). This verse clarifies that the
  work of yoga—abhyāsa, repeated disciplined practice—is precisely the continuous exertion (yatna) required
  to hold oneself in that state of stability.


  The word tatra (there, in that context) refers to the āsana itself. Sthitau (in stability, in remaining
  established) is the goal. Yatna (effort, exertion, strain) is the active ingredient. Abhyāsa (practice,
  repetition, cultivation) is the name given to this sustained effort.


  Within the Yoga–Sāṃkhya framework, this reflects a core principle: the path to liberation (kaivalya)
  requires constant, intelligent exertion against the natural tendency of the mind and body to slip into
  inertia, distraction, or collapse. Stability is not passive; it is an active holding. The practice is
  not a destination but a continuous return to steadiness, again and again. This prepares the ground for
  the later stages of concentration (dhāraṇā) and meditation (dhyāna), which also demand unwavering effort.


  Key Terms


  **abhyāsa** — Sustained, repeated practice; the disciplined effort to cultivate a skill or state of
  mind through consistent application

  **sthira** — Stable, firm, steady; one of the two essential qualities of āsana (the other being sukha,
  ease)

  **yatna** — Effort, exertion, strain; the active muscular and mental force applied to maintain a state
  or achieve a goal'
insight: The central claim of this aphorism is that the very act of sustained effort—yatna—is itself the
  practice (bhyāsa) that brings one into the state (sthiti) of samādhi.
practice: 'The moment you notice yourself settling into a slouch—whether sitting, standing, or walking—pause
  and gather yourself upright with a deliberate breath, naming it silently: ''this effort is the practice.''
  Repeat this small reclamation whenever gravity pulls you down, letting each correction become your abhyāsa,
  the cultivation itself.'
