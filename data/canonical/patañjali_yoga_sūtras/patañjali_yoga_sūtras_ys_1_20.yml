sanskrit_devanagari: श्रद्धावीर्यस्मृतिसमाधिप्रज्ञापूर्वक इतरेषाम्
sanskrit_iast: śraddhāvīryasmṛtisamādhiprajñāpūrvaka itareṣām
translation_literal: For others, the path is preceded by faith, energy, memory, absorption, and insight.
commentary: 'This sūtra appears in the context of Patañjali''s discussion of different entry points into
  yoga practice. The previous sūtra (1.20) describes the direct path of those with intense practice (abhyāsa).
  This verse acknowledges that not all practitioners arrive at samādhi through the same gate.


  The five qualities listed—śraddhā (faith), vīrya (energy), smṛti (memory), samādhi (absorption), and
  prajñā (insight)—form a developmental sequence. They are not separate attainments but rather mutually
  supporting faculties that ripen together.


  Śraddhā is not blind belief but confidence born from direct experience or trust in the teaching and
  teacher. It provides the initial orientation toward practice. Vīrya is the sustained effort and vitality
  that keeps practice alive; without it, faith remains inert. Smṛti is the continuity of awareness—the
  ability to remember the goal and maintain presence across sessions and moments. Samādhi is the absorption
  where subject-object duality dissolves, even partially. Prajñā is the clarity that emerges from that
  absorption, the direct knowing that transcends conceptual understanding.


  The word itareṣām (for others) is crucial: Patañjali recognizes that practitioners vary in temperament,
  capacity, and circumstance. Some arrive through sheer intensity of practice; others need this scaffolding
  of faith, effort, remembrance, and gradual deepening. Both paths are valid. The sūtra validates the
  slower, more methodical approach for those who cannot sustain the fire of abhyāsa alone.


  Within the Yoga–Sāṃkhya framework, these five qualities represent the purification of the mind-field
  (citta) as it turns toward its own source. They are not imposed from outside but are the natural unfolding
  of attention when directed toward truth.


  Key Terms


  **śraddhā** — Faith or confidence; trust in the teaching and the possibility of transformation, grounded
  in direct experience rather than blind belief.

  **vīrya** — Energy, vigor, or sustained effort; the vital force that animates practice and prevents
  stagnation.

  **smṛti** — Memory or continuity of awareness; the capacity to maintain presence and remember the goal
  across time and practice.'
insight: 'The sūtra asserts that samadhi is not an isolated, spontaneous attainment but a culmination
  of a preparatory chain: faith (श्रद्धा) and energy (वीर्य).'
practice: When energy flags during practice, whisper the word 'smṛti' (memory) and pause to recall why
  you began—not as concept but as felt sensation in your body, the actual ease or clarity you've tasted.
  Let that remembering itself become the fuel that carries you forward.
