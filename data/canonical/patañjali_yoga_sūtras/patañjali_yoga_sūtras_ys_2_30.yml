sanskrit_devanagari: अहिंसासत्यास्तेयब्रह्मचार्यापरिग्रहाः यमाः
sanskrit_iast: ahiṃsāsatyāsteyabrahmacaryāparigrahā yamāḥ
translation_literal: Non-harming, truthfulness, non-stealing, celibacy, and non-grasping—these are the
  restraints.
commentary: 'This sūtra names the five yamas, the foundational ethical restraints that form the first
  limb of Patañjali''s eight-limbed path. These are not commandments imposed from outside, but natural
  disciplines that arise when the mind recognizes the unity underlying all beings and the futility of
  harm.


  Each yama operates on multiple levels. Ahiṃsā (non-harming) extends beyond physical violence to the
  subtle violence of harsh thought, judgment, and the harm caused by ignorance. Satya (truthfulness) means
  alignment between thought, word, and deed—not merely factual speech, but authentic expression rooted
  in reality. Asteya (non-stealing) addresses not only theft of objects but theft of time, credit, and
  another''s peace. Brahmacarya (often translated as celibacy, but literally "conduct leading to Brahman")
  traditionally means conservation and right use of vital energy (śakti); in modern contexts, this extends
  to sexual integrity and the wise management of desire. Aparigrahā (non-grasping) means releasing the
  compulsive accumulation of possessions, relationships, and identities—recognizing that attachment creates
  suffering.


  These five restraints are not separate from yoga practice; they are its ethical ground. Without them,
  asana and prāṇāyāma become mere gymnastics. The yamas purify the field of consciousness, removing the
  friction of guilt, fear, and inner contradiction that blocks the deeper states of meditation. They are
  called universal because they apply regardless of caste, place, time, or circumstance—they transcend
  cultural conditioning.


  In the Yoga–Sāṃkhya framework, the yamas align the individual will (puruṣa''s apparent agency) with
  the natural order (satya), reducing the karmically binding force of selfish action and preparing the
  mind for the discriminative knowledge that leads to liberation.


  Key Terms


  **yama** — Restraint or ethical discipline; the first limb of yoga, governing conduct toward others
  and the world.

  **ahiṃsā** — Non-harming; abstention from violence in thought, word, and deed toward all beings.

  **aparigrahā** — Non-grasping; freedom from possessiveness, greed, and the compulsive accumulation of
  objects or relationships.'
insight: The claim here is that the yama of ahimsa is not merely a set of prohibitions but a dynamic regulation
  of mind, body, and speech that aligns the practitioner with the subtle order of prakṛti.
practice: Throughout today, whisper "I do not harm" each time you notice yourself about to speak a judgment,
  withhold credit, rush someone, or tighten around what you possess—let the words interrupt the impulse
  itself, not analyze it afterward.
