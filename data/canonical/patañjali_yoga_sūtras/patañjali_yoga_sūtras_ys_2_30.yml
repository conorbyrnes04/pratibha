  - term: aparigraha (अपरिग्रह)
    definition: 'a- + pari-graha ‘non-grasping/hoarding’ -> in “Forbearance in Practice”: freedom from
      possessiveness, greed, and the compulsive accumulation of objects or relationships -> not aesthetic
      minimalism; release of acquisitive clutch that clarifies why one is born as one is'
  - term: ahiṃsā (अहिंसा)
    definition: 'a- + hiṃsā ‘non-injury’ -> in “Forbearance in Practice”: regulation of mind, body, speech
      to prevent re‑entanglement with prakṛti -> not passivity; active non-harm that ripens into ambient
      safety (pratishṭhā)'
  - term: asteya (अस्तेय)
    definition: 'a- + steya ‘non-stealing’ -> in “Forbearance in Practice”: You practice non‑violence,
