sanskrit_devanagari: सूक्ष्मविषयत्वं चालीङ्गपर्यवसाम्
sanskrit_iast: sūkṣmaviṣayatvaṃ cāliṅgaparyavasānam
translation_literal: The subtle object of concentration extends to the point where the sign itself dissolves.
commentary: 'This sūtra describes the terminal stage of samādhi—the absorption into increasingly refined
  objects of meditation until even the marker or support of concentration vanishes. Patañjali is mapping
  the progression of dhyāna (meditation) into samādhi (absorption). As the meditator''s focus penetrates
  deeper, the object of meditation becomes progressively more subtle (sūkṣma). What begins as gross perception—a
  form, a mantra, a breath—refines into mental impression, then into the bare sense of ''I am meditating,''
  then into the luminous ground of consciousness itself. At this final threshold (paryavasānam), even
  the subtle sign—the last vestige of subject-object duality, the final marker that says ''this is my
  meditation''—dissolves. What remains is absorption without object, the undifferentiated field of awareness.
  This is not blankness but the most refined sattvic state, where consciousness knows itself without the
  mediation of any support (aliṅga). The sūtra teaches that the path inward is a path of progressive subtlety:
  each layer of grossness must be transcended until the meditator arrives at the threshold where even
  the apparatus of meditation dissolves into pure witnessing. This is the gateway to nirvikalpa samādhi—absorption
  beyond form, thought, or any qualifying feature.


  Key Terms


  **sūkṣma** — subtle, refined, imperceptible; the domain of mind and inner sensation as opposed to gross
  physical form

  **aliṅga** — without mark or sign; the state beyond all qualifying attributes, the unmanifest ground
  of being

  **paryavasānam** — termination, endpoint, final boundary; the threshold where one state dissolves into
  another'
insight: The claim here is that the ultimate goal of samādhi is not merely a cessation of mental activity
  but a dissolution of the very object of focus into the observer’s awareness.
practice: 'Follow your chosen meditation object—breath, mantra, or light—inward through three stages:
  first, notice it as a clear external thing; then, as it grows faint, sense it as a mental echo or impression;
  finally, when even that impression thins to almost nothing, stop reaching for it and let your attention
  rest in the bare awareness that knows the fading itself. When you find nothing left to hold, stay there.'
