unit_label: Mind as Director of Functions
title: Mind as Director of Functions
unit_type: sutra
sanskrit_devanagari: प्रवृत्तिभेदे प्रयोजकं चित्तं एकम् अनकेषाम्
sanskrit_iast: pravṛttibhede prayojakaṃ cittam ekam anekeṣām
translation_literal: The mind, as the director of functions, is one among the many.
commentary: 'The central claim of this aphorism is that the yogic mind is the singular, unifying director of all mental functions,
  even though those functions appear as a multiplicity in the created mind. This is a contested move because it challenges
  the common Sāṃkhya view that prakṛti (the material principle) is the source of all vṛtti (mental modifications). Here, the
  yogi’s puruṣa (consciousness) is asserted to be the active agent—an īśvara‑like director—over the manifold vṛtti, thereby
  re‑asserting the autonomy of consciousness over materiality. In the Yoga tradition, this aligns with the Samādhi principle
  of the mind’s stillness: when the mind is directed, the multiplicity of functions collapses into a single awareness. The
  Satchidananda commentary’s emphasis on the “original mind‑stuff” as the director echoes this, suggesting that the yogi’s
  inherent nature (citta) is not a passive receiver but an active regulator. Existentially, this invites practitioners to
  recognize that their inner director can choose to align the many functions toward liberation, rather than being swept along
  by them. Thus, the sutra invites a shift from passive observation to active guidance of one’s own mental processes, a key
  step toward kaivalya.


  Key Terms


  **citta (चित्त)** — citta (mind‑stuff) -> in Sāṃkhya: material mind; in Yoga: the personal, experiential mind that can be
  directed


  **vṛtti (वृत्ति)** — vṛtti (mental modifications) -> in Sāṃkhya: fluctuations of prakṛti; in Yoga: the functions that the
  mind directs


  **puruṣa (पुरुष)** — puruṣa (consciousness) -> in Sāṃkhya: the pure subject; in Yoga: the active director of vṛtti


  **samādhi (समाधि)** — samādhi (union) -> in Sāṃkhya: absorption of prakṛti; in Yoga: the stillness where mind’s multiplicity
  is unified


  Cross-Tradition Resonances


  **Yoga Sūtra 2.1:** Both sutras identify the mind as the central element of experience; 2.1 states that the mind is the
  source of all perception, while 4.5 asserts its directive role over functions.

  *Divergence:* While 2.1 presents the mind as passive source, 4.5 reclaims it as active director, thereby shifting the ontological
  status of citta


  **Sāṃkhya Kāṇḍa 3.12:** Sāṃkhya posits that prakṛti generates vṛtti; 4.5 parallels this by naming the mind as the director
  of vṛtti.

  *Divergence:* Sāṃkhya’s vṛtti are produced by prakṛti, whereas here they are produced by puruṣa’s directive agency


  **Yoga Sūtra 1.3:** Both sutras discuss the multiplicity of functions (vṛtti) arising in the mind.

  *Divergence:* 1.3 describes vṛtti as arising from citta, whereas 4.5 claims citta itself directs these functions, implying
  a higher level of control


  **Sāṃkhya Kāṇḍa 2.5:** Sāṃkhya distinguishes between puruṣa and prakṛti; 4.5 echoes this distinction by focusing on puruṣa’s
  role.

  *Divergence:* Sāṃkhya treats puruṣa as passive observer, while 4.5 attributes active agency to puruṣa'
insight: The central claim of this aphorism is that the yogic mind is the singular, unifying director of all mental functions,
  even though those functions appear as a multiplicity in the created mind.
practice: Direct your attention to the single, unifying mind that directs all mental functions, observing how the many thoughts
  arise under its guidance.
