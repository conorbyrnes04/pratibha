title: Mind as Director of Functions
unit_type: sutra
sanskrit_devanagari: प्रवृत्तिभेदे प्रयोजकं चित्तं एकम् अनकेषाम्
sanskrit_iast: pravṛttibhede prayojakaṃ cittam ekam anekeṣām
translation_literal: When functions diversify, the single mind is the director of many.
commentary: 'This sūtra addresses a fundamental puzzle in Yoga–Sāṃkhya metaphysics: how can one consciousness
  (cittam) orchestrate the multiplicity of bodily and mental operations? The answer is that despite the
  apparent plurality of functions (pravṛtti)—sensory intake, motor action, breath regulation, thought-formation,
  memory—there is one presiding intelligence that directs them all.


  The word pravṛtti means ''activity'' or ''function''; bhede means ''in division'' or ''in differentiation.''
  Prayojaka means ''that which impels'' or ''director.'' Ekam means ''one''; anekeṣām means ''of many.''


  Patañjali is establishing that the mind (citta) is not a passive screen but an active governor. Even
  though we experience a cascade of simultaneous operations—the breath flowing, the eyes tracking, thoughts
  arising, emotions shifting—these are not independent agents. They are coordinated by a single directing
  principle: consciousness itself.


  This is crucial for understanding yoga practice. If the mind were merely a collection of separate functions,
  there would be no unified point of control. But because there is one director, the yogin can use disciplined
  attention (dhāraṇā) and meditation (dhyāna) to align all functions toward a single aim: liberation (mokṣa).
  The diversity of functions becomes an instrument of the unified will.


  Within the Yoga Sūtras'' framework, this sūtra justifies why mental training works: you are not trying
  to control dozens of independent systems, but rather to align yourself with the single intelligence
  that already governs them.


  Key Terms


  **pravṛtti** — Function, activity, or operation; the outward movement or expression of energy

  **cittam** — Mind or consciousness; the principle of awareness that directs and orchestrates all mental
  and bodily functions

  **prayojaka** — That which impels, directs, or governs; the active agent or controller'
insight: The central claim of this aphorism is that the yogic mind is the singular, unifying director
  of all mental functions, even though those functions appear as a multiplicity in the created mind.
practice: Throughout your day, when you notice your functions scattering—attention pulled by sound while
  your hands work, breath shallow while your mind races, body tense while you try to listen—pause and
  whisper 'one director' three times, feeling your spine lengthen as if a single intelligence were gathering
  all these threads from above. Let this be your anchor whenever multiplicity threatens to fragment you.
