title: Misconception as False Knowledge
unit_type: sutra
sanskrit_devanagari: विपर्ययो मिथ्याज्ञानम् अतद्रूपप्रतिṣ्ठम्
sanskrit_iast: viparyayo mithyājñānam atadrūpapratiṣṭham
translation_literal: Misconception is false knowledge that rests upon a form that is not the thing itself.
commentary: 'This sūtra defines viparyaya, one of the five kleshas (afflictions) that cloud perception
  and bind the mind to suffering. Patañjali distinguishes false knowledge from mere absence of knowledge:
  viparyaya is active misperception—a conviction that something *is* what it is not. The phrase atadrūpapratiṣṭham
  (resting on a form other than its own nature) is crucial. It means the false knowledge takes root in
  an apparent form—a shape, quality, or narrative—that does not correspond to the actual nature of the
  object. For example, mistaking a rope for a snake in dim light, or believing the body to be the self,
  or imagining that external objects will bring lasting fulfillment. The misconception has a structure;
  it is not random confusion but a coherent misidentification. Within the Yoga–Sāṃkhya framework, this
  arises from the mind''s habit of projecting its own conceptual overlays onto reality rather than perceiving
  prakṛti (nature) and purusha (consciousness) as they actually are. Viparyaya is more insidious than
  ignorance (avidyā) because it feels like knowledge—it carries conviction. The yogi must learn to recognize
  when the mind is resting upon a borrowed or false form, and gently redirect attention toward direct
  perception and discrimination (viveka).


  Key Terms


  **viparyaya** — misconception or false knowledge; active misperception that rests on an incorrect identification
  of the nature of something

  **mithyājñānam** — false knowledge; knowledge that is fundamentally mistaken or inverted

  **atadrūpapratiṣṭham** — resting upon a form other than its own; grounded in an appearance that does
  not match the actual nature of the thing'
insight: The passage asserts that misapprehension is a kind of knowledge that fails to align with reality,
  thereby negating its usefulness.
practice: 'Hold your gaze on any object before you—a person''s face, a plant, a wall—and the moment you
  notice yourself completing the sentence "this is...," pause and ask: what am I adding that is not actually
  there? Repeat this interruption each time the mind rushes to name, judge, or use what you see, until
  the thing itself emerges separate from your overlay.'
