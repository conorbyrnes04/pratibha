  - term: vitarka (वितर्क)
    definition: 'vi-√tark ‘reason about’ → gross discursive engagement with object -> in “Consciousness
      of Argument and Joy”: the initial, gross phase of meditative absorption in which the mind grasps
      an object through conceptual thought and verbal formulation -> not idle argument; a level of samprajñāta
      still working with gross object-aspect'
  - term: asmitā (अस्मिता)
    definition: 'asmi + -tā ‘I-am-ness’ -> in “Consciousness of Argument and Joy”: → Sāṃkhya: pure consciousness
      -> not healthy self-esteem; the confusion of seer with seeing-instrument (citta)'
  - term: vicāra (विचार)
    definition: 'vi-√car ‘move through’ → subtle reflective engagement -> in “Consciousness of Argument
      and Joy”: the subtle phase of absorption in which the object is perceived directly without verbal
      mediation, as pure quality or essence -> not ordinary rumination; subtler samprajñāta level beyond
      gross vitarka'
  - term: ānanda (आनन्द)
    definition: 'ā-√nand ‘rejoice’ → bliss-tone of certain samādhi -> in “Consciousness of Argument and
