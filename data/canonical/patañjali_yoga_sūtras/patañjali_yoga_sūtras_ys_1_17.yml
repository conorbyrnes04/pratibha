sanskrit_devanagari: वितर्कविचारानन्दस्मितारूपानुगमात् संप्रज्ञातः
sanskrit_iast: vitarkavicārānandāsmitārūpānugamāt saṃprajñātaḥ
translation_literal: Cognitive absorption is recognized by its accompaniment of reasoning, reflection,
  joy, and the sense of 'I'—each taking its own form.
commentary: 'This sūtra defines saṃprajñāta-samādhi (cognitive absorption with seed), the first major
  category of meditative stability in Patañjali''s system. The verse identifies four successive markers
  or qualities that characterize this state: vitarka (reasoning—the initial grasping of an object''s gross
  form), vicāra (reflection—subtle investigation of that object''s nature), ānanda (joy—the bliss that
  naturally arises when the mind settles into unified attention), and asmitā (the sense of individual
  ''I''—the subtle persistence of subject-object duality, even in deep meditation).


  Each of these four unfolds in its own form (rūpa), and their sequential presence confirms that one has
  entered genuine samādhi rather than mere concentration or daydreaming. This is ''cognitive'' absorption
  because the meditator remains aware of the object and the process; consciousness has not yet dissolved
  into undifferentiated unity (which would be asaṃprajñāta-samādhi).


  Within the Yoga–Sāṃkhya framework, this sūtra marks the threshold where prakṛti (nature/mind-stuff)
  becomes transparent to puruṣa (pure consciousness). The four qualities are not obstacles but natural
  stages of refinement: reasoning gives way to subtler reflection, reflection opens into joy, and joy
  reveals the witness-sense (asmitā). Understanding this progression prevents a practitioner from mistaking
  early concentration for final liberation, and it clarifies why joy and clarity are signs of genuine
  progress, not distractions.


  Key Terms


  **vitarka** — Reasoning; the initial, gross phase of meditative absorption in which the mind grasps
  an object through conceptual thought and verbal formulation.

  **vicāra** — Reflection; the subtle phase of absorption in which the object is perceived directly without
  verbal mediation, as pure quality or essence.

  **saṃprajñāta-samādhi** — Cognitive absorption with seed; meditative unity in which the object, process,
  and sense of individual ''I'' remain present, distinguishing it from seedless (asaṃprajñāta) absorption.'
insight: The sūtra declares that samādhi is not merely a passive absorption but a dynamic, tri‑modal awareness
  that simultaneously engages the mind in argument (savitrāka), deliberation (savichara), and the ex
practice: Throughout your day, pause the moment you notice yourself reasoning about something (grasping
  its outline), then track whether reflection follows (investigating its subtlety), then whether a small
  joy arrives—and in that joy, whisper 'I' as a question, not a statement, to feel how the sense of self
  shifts with each stage. Let each take its own form without forcing them into sequence.
