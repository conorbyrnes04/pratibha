  whose very identity is co‑constituted by the duality of Seer (dṛṣṭṛ) and seen (dṛśy
practice: Observe your thoughts as they arise, noting how each thought simultaneously reflects your inner awareness (the Seer)
  and the external content (the seen), and feel how this duality colors your mental field into a unified experience.
