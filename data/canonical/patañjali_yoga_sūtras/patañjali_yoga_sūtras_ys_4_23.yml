practice: 'The next time you perceive something—a person, object, or sensation—pause and notice the exact
  moment the boundary between seer and seen dissolves into one act of knowing. Whisper aloud or internally:
  "stained," letting that word hold both the subject watching and the thing watched, until you feel the
  mind itself as the medium where both have merged.'
