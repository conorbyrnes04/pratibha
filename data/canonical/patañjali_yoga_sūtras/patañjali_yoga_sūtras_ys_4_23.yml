sanskrit_devanagari: दर्श्तृदृश्योपरक्तं चित्तं सर्वार्थम्
sanskrit_iast: draṣṭṛdṛśyoparaktaṃ cittaṃ sarvārtham
translation_literal: The mind, stained by the seer and the seen, serves all purposes.
commentary: 'This sūtra appears in the context of Patañjali''s analysis of how the mind (citta) functions
  as an instrument of perception and action. The verse identifies a fundamental coloration or conditioning
  of the mind that arises from the interplay of two poles: draṣṭṛ (the seer, the witnessing subject) and
  dṛśya (the seen, the object of perception). The word uparakta (stained, colored, tinted) suggests that
  the mind does not exist in a neutral state but is perpetually tinted by this subject-object duality.


  Within the Yoga–Sāṃkhya framework, the seer is understood as puruṣa (pure consciousness), while the
  seen comprises all of prakṛti (nature, matter, manifestation). The mind, being a subtle product of prakṛti,
  naturally reflects and absorbs the coloration of this fundamental duality. This staining is not accidental
  but structural: it is precisely this capacity to be colored by both subject and object that allows the
  mind to function as a versatile instrument (sarvārtham—for all purposes, for every aim or function).


  The sūtra suggests that the mind''s utility—its ability to perceive, remember, reason, and act—depends
  entirely on this dual coloration. Without the play of seer and seen, there would be no content, no movement,
  no purposeful function. Yet this same mechanism is also the source of confusion: the mind, colored by
  both poles, tends to identify itself with either the seer (mistaking itself for consciousness) or the
  seen (mistaking itself for objects), rather than recognizing itself as a transparent medium.


  This verse sets up the diagnostic problem that yoga addresses: liberation requires recognizing that
  the mind''s coloration is not one''s true nature, but rather a functional tool. The practice of yoga
  aims to gradually disidentify from this staining and to restore the seer to its native clarity.


  Key Terms


  **draṣṭṛ** — The seer; the witnessing subject; in Sāṃkhya, the puruṣa or pure consciousness

  **dṛśya** — The seen; the object of perception; all of manifest nature (prakṛti) and its modifications

  **uparakta** — Stained, colored, tinted; conditioned by contact with or proximity to something else'
insight: The central claim of this sutra is that the mind‑field (citta) is not a passive receptacle but
  an active participant whose very identity is co‑constituted by the duality of Seer (dṛṣṭṛ) and seen
