sanskrit_devanagari: अपरिग्रहस्थाये जनमकथं तासं बोधः
sanskrit_iast: aparigrahasthairye janmakathaṃtāsaṃbodhaḥ
translation_literal: When non-grasping becomes stable, knowledge of the origins and circumstances of birth
  arises.
commentary: 'This sūtra belongs to the section on siddhis (extraordinary capacities) that arise from the
  perfection of the yamas—ethical restraints—specifically aparigraha, the principle of non-possessiveness
  or non-grasping. Aparigraha is not merely the absence of hoarding; it is a positive relinquishment of
  the impulse to claim, accumulate, or hold onto objects, experiences, or even identity itself. When this
  relinquishment becomes *sthairye*—stable, rooted, unshakeable—the mind releases its contracted, acquisitive
  posture and gains access to subtler layers of knowledge.


  The sūtra teaches that this stability unlocks *janmakathaṃtāsaṃbodhaḥ*: direct knowing of the *kathā*
  (narrative, circumstances, causes) of *janma* (birth). In the Yoga–Sāṃkhya framework, birth is not random
  but determined by the accumulated impressions (saṃskāras) and karmic patterns that shape the individual''s
  nature and life trajectory. When the grasping mind releases its claim on the world, the veil of ego-driven
  perception thins, and one perceives the actual causal threads—the karmic history—that have woven one''s
  existence into being.


  This is not intellectual knowledge but direct perception (*bodha*) of one''s own generative past. The
  yogi sees how desire, attachment, and the sense of ownership have shaped previous lives and the present
  incarnation. This insight naturally deepens renunciation and accelerates liberation, because one recognizes
  the futility of grasping at what is fundamentally impermanent and causally determined.


  Key Terms


  **aparigraha** — Non-grasping, non-possessiveness; the ethical restraint of relinquishing the impulse
  to claim, hoard, or hold onto objects, experiences, or identity

  **sthairye** — Stability, firmness, rootedness; the condition of a quality or practice becoming unshakeable
  and established in the being

  **janma** — Birth, incarnation; the arising of the individual form shaped by karma and saṃskāra (accumulated
  impressions)'
insight: The claim that the practice of aparigraha—renunciation of unnecessary possession—directly unlocks
  the inquiry into one’s birth is a decisive philosophical move.
practice: 'For one week, practice conscious non-claiming in daily life. When you use an object—a cup,
  a chair, a tool—pause before and after use to silently acknowledge: ''This is not mine; I am borrowing
  it from the world.'' When a thought or emotion arises, observe it without claiming it as ''my thought''
  or ''my feeling''—let it pass like a cloud. At day''s end, sit quietly and reflect on one moment when
  you felt the impulse to possess, control, or claim something (a person''s attention, an outcome, a possession).
  Notice the contraction in your chest or mind. Then consciously release it with the phrase: ''I release
  my grip on this.'' Over time, this practice weakens the acquisitive reflex and creates the inner spaciousness
  in which subtle knowing can emerge.'
