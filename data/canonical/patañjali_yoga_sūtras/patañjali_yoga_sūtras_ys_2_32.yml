sanskrit_devanagari: शौचसंतोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः
sanskrit_iast: śaucasaṃtoṣatapaḥsvādhyāyeśvarapraṇidhānāni niyamāḥ
translation_literal: Purity, contentment, heat-of-effort, self-study, and surrender to the divine—these
  are the observances.
commentary: 'This sūtra completes Patañjali''s foundational ethical framework by naming the five niyamāḥ
  (personal observances or restraints), which follow the five yamas (restraints toward others) given in
  the previous sūtra. Where yamas govern outward conduct, niyamāḥ govern inner discipline and the cultivation
  of a fit vessel for yoga.


  Each observance addresses a specific obstacle to practice:


  **Śauca** (purity) begins with the body—cleanliness, diet, environment—but extends to mental clarity
  and the removal of gross taints. A pure instrument can receive subtle perception.


  **Saṃtoṣa** (contentment) cuts the root of rajas (restless craving). It does not mean passivity but
  rather freedom from the exhausting demand that circumstances be other than they are. This frees energy
  for practice.


  **Tapas** (heat, austerity, effort) is the metabolic fire of transformation. It is not self-punishment
  but disciplined intensity—the willingness to bear difficulty in service of awakening. Tapas burns away
  impurity and weakness.


  **Svādhyāya** (self-study) means study of sacred texts and the teachings, but also honest self-examination.
  It is inquiry into one''s own nature and the nature of consciousness itself.


  **Īśvara-praṇidhāna** (surrender to the divine principle) orients all effort toward something transcendent.
  In the Yoga Sūtras, Īśvara is not a creator-god but the eternal, unchanging consciousness untouched
  by karma. This observance prevents ego from colonizing practice and opens the door to grace.


  These five work together: purity prepares the ground, contentment steadies the mind, effort generates
  the necessary friction for transformation, study provides direction, and surrender dissolves the separate
  self that would claim the fruits. They are not moral commandments imposed from outside but natural conditions
  for the mind to settle and reveal its true nature.


  Key Terms


  **niyamāḥ** — Personal observances or inner disciplines; the five positive practices that cultivate
  fitness for yoga (contrasted with yamas, restraints toward others)

  **tapas** — Heat, austerity, disciplined effort; the metabolic fire of transformation that burns away
  impurity and weakness

  **īśvara-praṇidhāna** — Surrender or dedication to the divine principle (īśvara); orientation of all
  practice toward the eternal, unchanging consciousness'
insight: The passage asserts that the duties described here are of commission, not omission, and therefore
  they constitute the active practice of the yogic path.
practice: Before eating your next meal, pause and name one thing about this food or this moment that is
  already enough—its taste, its warmth, the fact it is here. Whisper *saṃtoṣa* as you take the first bite,
  letting contentment be the seasoning.
