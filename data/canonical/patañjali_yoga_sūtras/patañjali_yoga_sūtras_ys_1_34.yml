- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra claims that the mind can be steadied by a simple breath practice: exhale and then hold
    the breath. This is a concrete, bodily method that bypasses the more abstract notion of samādhi as
    a state of union. The claim is that the mind’s wandering can be suppressed by a deliberate manipulation
    of prāṇa, the life‑force that animates the body. In the Yoga and Sāṃkhya traditions, prāṇa is the
    subtle energy that governs the mind’s fluctuations (vṛtti). By controlling prāṇa, one can influence
    the mind’s activity. The contested move here is the order of the breath: exhale first, then hold.
    Some commentators, following the Maniprabhd, argue that the breath is first expelled, then the retention
    is simply the refusal of new air. Others insist on a sequence of exhale, inhale, hold, exhale, and
    so on. The Dvivedi commentary notes that Patanjali’s mention of only exhaling and holding implies
    that inhalation is implicit; it does not require a separate mention because the act of holding presupposes
    an earlier inhalation. This subtlety shows how the sūtra bridges the abstract and the concrete: the
    abstract goal of steadying the mind is achieved through a concrete bodily act. In practice, this technique
    is immediately applicable to anyone who feels the mind drifting. By consciously exhaling and then
    holding the breath, one creates a momentary pause in the flow of prāṇa, which in turn calms the vṛtti.
    The pause is a micro‑samādhi, a brief suspension of the mind’s activity that can be cultivated daily.
    Over time, this practice can deepen into the more profound states of samādhi described elsewhere in
    the Yoga Sūtra, illustrating the progressive nature of the Yoga path.


    Key Terms


    **prāṇa (प्राण)** — prāṇa (IAST) -> प्राण (Devanagari) -> ‘life‑force’; in Sāṃkhya, the subtle energy
    that animates the body and mind; the term’s literal meaning ‘breath’ is often overlooked in favor
    of the metaphysical connotation of vital energy.


    **vṛtti (वृत्ति)** — vṛtti (IAST) -> वृत्ति (Devanagari) -> ‘mental fluctuation’; in Sāṃkhya, the
    modifications of consciousness; the term’s etymology ‘to turn’ highlights the mind’s restless turning.


    **samādhi (समाधि)** — samādhi (IAST) -> समाधि (Devanagari) -> ‘union’ or ‘concentration’; in Yoga,
    the culmination of the eight limbs; the word’s root ‘sam’ (together) + ‘ādh’ (to hold) points to holding
    the mind together.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 1.34:** Directly links breath control to mental steadiness, mirroring the
    earlier sūtra 1.33 which states that steadying the mind is the first step to samādhi.

    *Divergence:* Unlike 1.33, which speaks abstractly of steadying, 1.34 specifies a bodily method, thereby
    bridging abstract and concrete.


    **Shankara, Vivekachudamani 5:** Both texts emphasize the necessity of controlling prāṇa to subdue
    the mind’s fluctuations.

    *Divergence:* Shankara’s text focuses on the philosophical understanding of mind, whereas the Yoga
    Sūtra provides a practical technique.


    **Dvivedi, Commentary on Yoga Sūtra 1.34:** Dvivedi elaborates on the order of breath, aligning with
    the Maniprabhd’s view of exhale first.

    *Divergence:* Dvivedi’s commentary introduces the idea of ‘not allowing new air’ as retention, a nuance
    not explicit in the original sūtra.'
