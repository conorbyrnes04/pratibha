title: Steadying the Mind by Breath
unit_type: sutra
sanskrit_devanagari: प्रच्छन्दनविधारणाभ्याम् वा प्राणस्य
sanskrit_iast: pracchardanavidhāraṇābhyāṃ vā prāṇasya
translation_literal: Or, by the expulsion and retention of the breath, the life-force is steadied.
commentary: 'This sūtra (II.49) offers a direct, physiological method for stabilizing the mind through
  prāṇa—the vital breath-energy that animates both body and consciousness. The two operations are pracchardana
  (forceful expulsion or release of breath) and vidhāraṇā (holding or retention). Together, they constitute
  prāṇāyāma in its most fundamental form.


  Patañjali presents this as an alternative (vā, ''or'') to the postural and philosophical methods outlined
  in earlier sūtras. The logic is rooted in Sāṃkhya-Yoga physiology: mind and breath are intimately bound.
  Where breath is agitated, the mind scatters; where breath is controlled and rhythmic, mental fluctuation
  (cittavṛtti) naturally subsides. This is not mere metaphor—the oscillation of inhalation and exhalation
  mirrors the oscillation of thought itself.


  The practice works bidirectionally: conscious regulation of breath calms the nervous system and creates
  the conditions for meditative absorption (dhyāna). Over time, steady breath becomes the gateway to pratyāhāra
  (sense withdrawal) and the deeper states of concentration (dhāraṇā) that follow.


  This sūtra is pragmatic and accessible. It does not require philosophical sophistication or elaborate
  visualization—only the willingness to observe and gently master one''s own breathing.


  Key Terms


  **prāṇa** — Vital life-force or breath-energy that animates the body and mind; the animating principle
  of consciousness itself.

  **pracchardana** — Forceful expulsion or release; in breath practice, the deliberate exhalation or discharge
  of breath.

  **vidhāraṇā** — Retention or holding; in breath practice, the pause or suspension of breath after inhalation
  or exhalation.'
insight: 'The sūtra claims that the mind can be steadied by a simple breath practice: exhale and then
  hold the breath.'
practice: 'Sit upright in a comfortable position. For 5 minutes, practice simple breath regulation: inhale
  through the nose for a count of 4, hold for a count of 4, then exhale through the nose for a count of
  4. Pause briefly at the end of the exhale. Repeat this cycle 10–15 times. Notice how your mind settles
  as your breath becomes regular. If your mind wanders, gently return attention to the breath itself—not
  to controlling it, but to observing its natural rhythm. Do this once daily, preferably in the morning
  or early evening. Over weeks, you will notice increased mental clarity and a spontaneous reduction in
  anxiety.'
