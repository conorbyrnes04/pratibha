sanskrit_devanagari: वृत्तिसारूप्यम् अन्यत्र
sanskrit_iast: vṛttisārūpyam itaratra
translation_literal: Elsewhere, there is assimilation into the form of the modifications.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on the nature of the witness-consciousness
  (puruṣa) and its apparent entanglement with mental activity. The word vṛtti refers to the fluctuations
  or modifications of the mind-stuff (citta); sārūpya means taking on the same form, becoming identical
  with, or assimilating into. Itaratra—''elsewhere,'' ''in other states''—signals a contrast with the
  preceding sūtra, which typically discusses the transcendent nature of puruṣa when it remains unidentified
  with mental content.


  The teaching here is subtle: when consciousness is not firmly established in its own nature (as the
  unchanging witness), it habitually assumes the shape of whatever mental modification arises—desire,
  fear, memory, thought. This assimilation is not the true nature of puruṣa; rather, it is a functional
  collapse, a mistaken identity. The puruṣa becomes ''colored'' by the vṛtti, much as a crystal appears
  to take the color of an object placed near it, though the crystal itself remains transparent.


  This verse encapsulates a core diagnostic of yoga: the root confusion that binds us is this very assimilation—the
  reflexive habit of consciousness identifying with its own mental movements. Yoga''s liberation consists
  precisely in breaking this identification and restoring the puruṣa to its autonomous, unchanging status.
  The word ''elsewhere'' implies that there is another way—a state in which consciousness does not assimilate
  into form, but remains distinct. That other way is the fruit of practice.


  Key Terms


  **vṛtti** — A modification, fluctuation, or wave of the mind-stuff (citta); the mental content that
  arises and passes away.

  **sārūpya** — Assimilation into the same form; identification with or taking on the shape of something
  else.

  **puruṣa** — The witness-consciousness, the unchanging subject of experience, distinct from all mental
  modifications and matter.'
insight: The central claim of this verse is that when the mind’s fluctuations (vṛtti) are not subdued,
  the immutable witness (purusha) becomes indistinguishable from the manifold phenomena of the world.
practice: 'Throughout your day, the moment you notice yourself saying or thinking ''I am [emotion/thought]''—stop
  mid-sentence and ask aloud or whisper: ''Who observes this anger?'' or ''Who witnesses this fear?''
  Let the question hang unanswered, returning attention to the space of asking itself rather than to the
  content of the feeling, until the identification loosens.'
