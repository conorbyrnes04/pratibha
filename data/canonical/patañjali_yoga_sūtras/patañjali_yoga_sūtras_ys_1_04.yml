  label: Pratibha Translation
  body: The unconditioned (purusha) is assimilated with the conditioned (prakriti) elsewhere.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this verse is that when the mind’s fluctuations (vṛtti) are not subdued,
    the immutable witness (purusha) becomes indistinguishable from the manifold phenomena of the world.
    This is not a mere metaphysical assertion but a diagnostic of the yogic state: the loss of distinction
    between observer and observed is the very symptom of ignorance. The contested move here is the identification
    of purusha with prakriti “elsewhere” – a point that has been debated by both the Sāṃkhya and Yoga
    schools. Sāṃkhya traditionally maintains a strict dualism, whereas the Yoga sutras allow for a temporary
    assimilation that is remedied by samādhi. The Dvivedi commentary’s observation that “the thinking
    principle transforms itself into objective and subjective phenomena” underscores that the mind’s activity
    is what masks the true nature of purusha. In practice, this means that the yogi must recognize moments
    when the mind’s chatter re‑asserts itself and consciously withdraw to the witness state. Only then
    does the consciousness become “pure and ready to receive all knowledge.” Thus, the verse serves as
    both a warning and a prescription: the failure to maintain the distinction between observer and observed
    leads to assimilation, whereas disciplined practice restores the ontological clarity essential for
    liberation.


    Key Terms


    **purusha (पुरुषः)** — purusha: from *puru* ‘whole’ + *-sha* ‘being’; in Sāṃkhya, the eternal, conscious
    principle; here, the unconditioned witness whose identity with prakriti is the problem


    **prakriti (प्रकृति)** — prakriti: from *prak* ‘to come’ + *-riti* ‘to be’; the material, dynamic
    reality; here, the conditioned world that can assimilate purusha


    **vṛtti (वृत्ति)** — vṛtti: from *vṛ* ‘to turn’ + *-tti* ‘action’; the mental modifications that obscure
    purusha’s distinctness


    **samādhi (समाधि)** — samādhi: from *sam* ‘together’ + *-adhi* ‘to hold’; the yogic absorption that
    restores the separation of purusha and prakriti


    Cross-Tradition Resonances


    **Yoga Sutras 1.1:** Both verses establish the duality of purusha and prakriti; the first declares
    the problem, the second describes its resolution

    *Divergence:* While 1.1 states the problem, 1.4 offers the condition under which assimilation occurs,
    adding the nuance of ‘elsewhere’


    **Sāṃkhya Karika 1.2:** Karika’s assertion of purusha’s eternal distinctness parallels the sutra’s
    claim of assimilation when vṛtti persist

    *Divergence:* Karika does not mention the conditional ‘elsewhere’, focusing instead on the inherent
    dualism


    **Patanjali’s commentary on 1.4:** Patanjali elaborates that vṛtti’s cessation is necessary for purusha’s
    clarity

    *Divergence:* Patanjali emphasizes the role of meditation, whereas the sutra itself merely states
    the assimilation condition'
- kind: key_terms
  label: Key Terms
  items:
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Assimilation of the Unconditioned”:
      here, the conditioned world that can assimilate purusha -> not pastoral ‘Nature’; the tri-guṇa matrix
      generating all experience including mind'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Assimilation of the Unconditioned”:
      The witness-consciousness, the unchanging subject of experience, distinct from all mental modifications
      and matter -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Assimilation of the Unconditioned”:
      the mental modifications that obscure purusha’s distinctness -> not ‘bad thoughts’ only — any cognitive
      wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Assimilation of the Unconditioned”: the
      yogic absorption that restores the separation of purusha and prakriti -> not trance-entertainment
      or unconsciousness; graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: sārūpya
    definition: 'source-term sārūpya -> in “Assimilation of the Unconditioned”: identification with or
      taking on the shape of something else -> default English flattens the technical work this term does
      here'
