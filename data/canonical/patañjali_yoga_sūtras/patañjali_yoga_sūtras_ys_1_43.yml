sanskrit_devanagari: स्मृतिपरीशुद्धौ स्वरूपशून्येवार्थमात्रनिर्भासा निःवित्रकाः
sanskrit_iast: smṛtipariśuddhau svarūpaśūnyevārthamātranirbhāsā nirvitarkā
translation_literal: When memory is purified, the mind becomes empty of its own form and shines forth
  as the object alone—this is non-argumentative samādhi.
commentary: 'This sūtra describes nirvitarkā samādhi, the first stable threshold of meditative absorption
  in Patañjali''s schema. It follows the earlier teaching that samādhi arises when the fluctuations of
  mind settle; here Patañjali specifies the particular quality of a samādhi that is free from vitarka—the
  mental arguing, reasoning, or conceptual overlay that ordinarily colors perception.


  The mechanism is precise: smṛti (memory, or the residual traces of past experience—saṃskāra) must become
  pariśuddha (thoroughly cleansed, purified). When these mental impressions no longer cloud awareness,
  the mind''s own form (svarūpa) becomes śūnya—empty, transparent, no longer asserting itself as a separate
  knower. What remains is arthamātra—the object alone—appearing (nirbhāsā) directly, without the filter
  of conceptual thought or verbal-intellectual processing.


  This is not blank unconsciousness. The object is still present and vivid; what is absent is the subject''s
  habitual commentary, judgment, and naming. In the Yoga–Sāṃkhya framework, this represents a crucial
  shift: the witness (puruṣa) begins to disentangle itself from the mind''s (citta) automatic patterns.
  Memory—usually the mechanism by which the past colonizes the present—becomes so refined that it no longer
  distorts direct perception.


  Nirvitarkā is called ''non-argumentative'' because vitarka (reasoning, deliberation, mental debate)
  has ceased. The mind is still alert and concentrated, but it no longer generates the internal dialogue
  that normally mediates between perceiver and perceived. This is the gateway to deeper samādhis and is
  accessible to sincere practitioners; it is not a rare attainment but a natural consequence of sustained,
  purified attention.


  Key Terms


  **smṛti** — Memory; the residual impressions (saṃskāra) and mental traces that color present perception

  **nirvitarkā** — Non-argumentative or non-deliberative; samādhi in which conceptual reasoning and verbal
  thought have ceased

  **arthamātra** — The object alone; perception of the thing itself, free from the mind''s interpretive
  overlay'
insight: The passage asserts that ultimate absorption occurs when the mind relinquishes all conceptual
  scaffolding—name, form, meaning, relation—and retains only the object’s pure essence.
practice: Choose a simple, visually clear object—a candle flame, a blue sky, or a single leaf. Sit comfortably
  with spine upright. For 5–10 minutes, gaze at the object without naming it, analyzing it, or recalling
  memories it evokes. Each time you notice yourself thinking 'flame,' 'orange,' 'warmth,' or 'I remember,'
  gently return to bare perception—the visual fact itself, prior to the word. Do not strain or suppress
  thought; simply let the object be present without your mental commentary. You will notice moments when
  the object appears vivid and the sense of 'you looking' fades. These are glimpses of nirvitarkā. Practice
  this daily. Over weeks, these moments lengthen. The point is not achievement but the direct experience
  of how memory and naming usually veil what is actually here.
