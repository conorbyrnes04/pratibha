sanskrit_devanagari: 'ते प्रतिप्रसवहेयाः सूक्ष्माः ॥ २.१० ॥


  ध्यानहेयस् तद्वृत्तयाḥ ॥ २.११ ॥'
sanskrit_iast: 'te pratiprasavaheyāḥ sūkṣmāḥ || 2.10 ||


  dhyānaheyās tadvṛttayaḥ || 2.11 ||'
translation_literal: '**2.10** These subtle ones are dissolved by tracing them back to their source (pratiprasava).

  **2.11** Their fluctuations (vṛtti) are dissolved through meditation (dhyāna).'
commentary: 'Patañjali''s two sūtras form a single diagnostic and therapeutic movement: the subtle vṛtti (mental modifications)
  are the root obstacle to liberation, and dhyāna (meditation) is the specific counter-force that dissolves them. The force
  of this pairing lies in its refusal of passivity. The Sāṃkhya framework posits that citta—the thinking principle—is a function
  of prakṛti, the manifest world of transformation. Ordinarily, this would suggest that the puruṣa (witness-consciousness)
  need only stand apart and observe. But Patañjali''s insistence on ''suppression'' (nirodha) marks a crucial turn: the practitioner
  does not merely watch the vṛtti; she actively negates them through disciplined meditation. This is not contradiction of
  Sāṃkhya but its existential completion. The subtle distractions—those dormant impressions (saṃskāra) that lie below gross
  thought—are precisely where ignorance (avidyā) takes root. They cannot be overcome by intellectual recognition alone; they
  require the sustained, embodied practice of dhyāna to be worn away. Meditation here functions as a counter-vṛtti, a transformation
  of the mind that methodically undoes the mind''s habitual patterns. By this suppression, the citta regains its natural transparency
  (sattva), and the puruṣa''s true nature—unchanging, luminous, free—becomes evident. The two sūtras thus articulate the Yoga
  path''s core claim: liberation is neither passive waiting nor intellectual understanding, but active negation of the subtle
  mental formations through sustained meditative discipline. This restores the original clarity of consciousness and enables
  samādhi, the absorption in which puruṣa stands alone (kaivalya).


  Key Terms


  **vṛtti** — Mental modifications or fluctuations of the mind-stuff; the transformations of citta that obscure the true nature
  of puruṣa

  **nirodha** — Suppression or restraint; the active negation of mental modifications through disciplined practice

  **dhyāna** — Meditation; sustained, focused attention used as a disciplined tool to counter and dissolve the mind''s habitual
  patterns

  **citta** — The thinking principle or mind-stuff; the manifest function of prakṛti that generates all mental content and
  must be stilled for liberation


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.26:** Both texts treat the restless mind as the primary obstacle and prescribe disciplined meditation
  (dhyāna) as the active remedy. Kṛṣṇa tells Arjuna: ''Whenever the mind wanders, restless and unsteady, from that place one
  should bring it back and fix it on the Self.'' The emphasis on active return mirrors Patañjali''s insistence on suppression
  rather than mere observation. Divergence: The Gītā frames the practice within devotion and duty (bhakti and karma-yoga),
  whereas Patañjali''s Yoga Sūtras present a more austere, non-theistic framework where meditation alone is the instrument
  of liberation.

  **Epictetus, Enchiridion 1:** Both Epictetus and Patañjali distinguish between what lies within our control (our assent,
  our practice) and what does not (external events, the mind''s initial arising). Both prescribe active discipline—prohairesis
  (moral choice) for Epictetus, nirodha (suppression) for Patañjali—as the means to freedom. Divergence: Epictetus locates
  freedom in the rational will''s correct judgment; Patañjali locates it in the cessation of mental modification itself, a
  state beyond rational thought, pointing toward a non-dual consciousness (puruṣa) rather than a perfected rational faculty.

  **Plotinus, Enneads III.8.4:** Plotinus describes the ascent to the One as requiring the suppression of discursive thought
  and the stilling of the soul''s lower faculties, much as Patañjali prescribes the suppression of vṛtti. Both see the subtle
  movements of mind as the deepest veil obscuring unity. Divergence: Plotinus emphasizes the soul''s ascent through hierarchical
  emanation and intellectual intuition (noesis); Patañjali''s framework is dualistic (puruṣa and prakṛti) and aims at isolation
  (kaivalya) rather than union with a transcendent source.'
insight: The sutra asserts that the most insidious disturbances are the subtle ones, and that their suppression is the primary
  task of the practitioner.
practice: You now actively negate the subtle distractions by merging your mind into the pure sense of being, thereby suppressing
  them.
