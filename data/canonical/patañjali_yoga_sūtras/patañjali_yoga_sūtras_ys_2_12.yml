sanskrit_devanagari: क्लेशमूलः कर्माशयो द्रष्टादृष्टजन्मवेदनीयः
sanskrit_iast: kleśamūlaḥ karmāśayo dṛṣṭādṛṣṭajanmavedanīyaḥ
translation_literal: The root of affliction is the dormant deposit of action, which bears fruit in lives
  both seen and unseen.
commentary: 'This sūtra identifies the mechanism by which suffering perpetuates across time. Kleśa (affliction
  or obstruction) does not arise randomly; it has a source—karmāśaya, the latent reservoir of past deeds.
  This is not moral judgment but causal description: every action leaves an impression (saṃskāra) in the
  subtle body, a potential that must eventually unfold.


  The phrase dṛṣṭādṛṣṭajanmavedanīyaḥ—''to be experienced in lives seen and unseen''—points to two dimensions
  of consequence. Dṛṣṭa (visible, immediate) refers to results we witness in this lifetime: a harsh word
  spoken returns as conflict; a disciplined practice yields clarity. Adṛṣṭa (invisible, deferred) refers
  to karmic fruit that ripens across births, beyond our current perception.


  Within the Yoga–Sāṃkhya framework, this sūtra establishes that bondage is not external imposition but
  self-generated continuity. The afflictions (kleśas: avidyā, asmitā, rāga, dveṣa, abhiniveśa) root themselves
  in action; action deposits itself as dormant potential; that potential flowers as circumstance and suffering
  in future moments. The yogi''s task is not to escape karma retroactively, but to interrupt this cycle
  by ceasing to generate new affliction-laden action and by burning existing impressions through practice
  and insight.


  Key Terms


  **kleśa** — Affliction, obstruction, or fundamental misperception (avidyā, asmitā, rāga, dveṣa, abhiniveśa)
  that clouds awareness and generates suffering.

  **karmāśaya** — The dormant deposit or reservoir of past actions; latent impressions (saṃskāras) held
  in the subtle body, awaiting fruition.

  **saṃskāra** — An impression, groove, or latent tendency left by action in the mind-body; the mechanism
  by which karma becomes stored potential.'
insight: The claim that afflictions arise from the impressions of work (karma) establishes a causal chain
  that is central to both Yoga and Sāṃkhya.
practice: 'For one week, keep a simple log of three actions daily: one you regret (or sense as harmful),
  one you feel neutral about, and one that brought ease or helped another. Each evening, sit quietly for
  five minutes and observe: Which actions left a ''weight'' in your body or mind—a tightness, heaviness,
  or unease? Which left lightness? This is direct perception of karmāśaya forming. Notice that the weight
  is not punishment from outside; it is the action''s own imprint settling into your nervous system. On
  the eighth day, review the pattern. This embodied recognition—that action deposits itself as latent
  tendency—is the first step toward choosing differently. You are not trying to undo past karma; you are
  learning to see how present choice shapes future capacity.'
