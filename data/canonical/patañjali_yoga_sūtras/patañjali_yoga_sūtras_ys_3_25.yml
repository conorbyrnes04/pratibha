  items:
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Strength of Observation”: ‘fluctuation’
      -> Sāṃkhya: mental modifications of citta -> not ‘bad thoughts’ only — any cognitive wave (valid
      cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Strength of Observation”:
      ‘consciousness’ -> Sāṃkhya: eternal, passive witness -> not ‘person’ as social self; the unchanging
      witness distinct from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Strength of Observation”: ‘nature’
      -> Sāṃkhya: material, dynamic reality -> not pastoral ‘Nature’; the tri-guṇa matrix generating all
      experience including mind'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Strength of Observation”: ‘absorption’
      -> Yoga: state of focused, undistracted awareness -> not trance-entertainment or unconsciousness;
      graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: pravṛtti
    definition: 'source-term pravṛtti -> in “Strength of Observation”: here, the continuous arising and
