sanskrit_devanagari: प्रवृत्तिआलोकनयासात् सूक्ष्मव्यवहितविप्रक्रष्टज्ञानम्
sanskrit_iast: pravṛttyālokanyāsāt sūkṣmavyavahitaviprakṛṣṭajñānam
translation_literal: By fixing the light of observation on the flow of mental activity, knowledge of the
  subtle, the hidden, and the distant becomes possible.
commentary: 'This sūtra (III.25) belongs to the vibhūti pāda, the section on extraordinary capacities
  that arise from samyama—the unified application of concentration (dhāraṇā), meditation (dhyāna), and
  absorption (samādhi). Patañjali describes a specific mechanism: when the yogin directs the illuminating
  power of conscious attention (āloka) onto pravṛtti—the movement, flow, or activity of the mind itself—a
  threefold knowledge emerges.


  The three domains of knowledge are presented in a scale of accessibility: sūkṣma (the subtle—things
  ordinarily too fine to perceive), vyavahita (the hidden or obstructed—things blocked from ordinary view),
  and viprakṛṣṭa (the distant—things remote in space or time). This is not mysticism but a description
  of how refined attention operates. When consciousness becomes sufficiently steady and luminous, it can
  penetrate what ordinary perception cannot reach.


  The mechanism rests on a fundamental principle in Yoga-Sāṃkhya: the mind (citta) is itself a subtle
  material substance (prakṛti), and its movements leave traces and patterns. By turning the observing
  capacity inward—by making the flow of thought itself the object of samyama—the yogin gains direct insight
  into processes normally hidden. This is not inference or imagination; it is direct perception of subtle
  domains through a refined instrument.


  In the classical framework, this sūtra explains how yogins develop knowledge of anatomy (the subtle
  channels and centers), of karmic patterns (the hidden causes of events), and of distant or past events
  (through access to the subtle body''s stored impressions). The key is that observation itself becomes
  a tool of knowledge when it is steady, luminous, and turned inward.


  Key Terms


  **pravṛtti** — Flow, movement, or activity; here, the continuous arising and passing of mental events

  **āloka** — Light, illumination, or the luminous power of conscious observation

  **samyama** — The unified application of concentration, meditation, and absorption on a single object,
  producing direct knowledge'
insight: The sūtra asserts that by applying the yogic discipline of observation to the mind’s subtle fluctuations,
  one can immediately access the perfected knowledge that resides within the subtle realm.
practice: Turn your gaze inward as you would aim a lamp into darkness, and watch one mental movement from
  its first stirring to its dissolution—a worry arising, a memory surfacing, a desire forming—without
  naming it, only witnessing its texture, speed, and the space it occupies. Return this luminous attention
  to the next movement that appears.
