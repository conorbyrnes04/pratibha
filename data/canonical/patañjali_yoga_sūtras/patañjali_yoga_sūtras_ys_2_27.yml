sanskrit_devanagari: तस्य सप्तधः प्रान्तभूमिः प्रज्ञा
sanskrit_iast: tasya saptadhā prāntabhūmiḥ prajñā
translation_literal: The wisdom that arises in him reaches its final ground in seven stages.
commentary: 'This sūtra (II.27) marks the culmination of the discriminative knowledge (viveka-khyāti)
  that emerges through sustained practice. Patañjali describes how prajñā—the direct, non-conceptual knowing
  that distinguishes the Self (puruṣa) from matter (prakṛti)—unfolds progressively through seven distinct
  levels or grounds (bhūmi).


  The seven stages represent a deepening penetration into reality: from the initial recognition that bondage
  exists, through the gradual dissolution of the afflictions (kleśa) and their latent impressions (saṃskāra),
  to the final threshold (prānta-bhūmi, literally "frontier ground") where the distinction between knower
  and known becomes so transparent that the mind ceases to generate new modifications. At this seventh
  stage, the yogi stands at the edge of kaivalya—absolute isolation and freedom of consciousness.


  This is not sudden enlightenment but a mapped, verifiable progression. Each stage involves both intellectual
  understanding and the actual transformation of the nervous system''s capacity to sustain that understanding
  without regression. The sūtra emphasizes that wisdom itself has architecture; it unfolds in time, even
  as its final fruit transcends time.


  Within the Yoga–Sāṃkhya framework, this verse confirms that liberation is not granted externally but
  is the natural outcome of correctly seeing the distinction between conscious awareness and all objects
  of awareness. The seven grounds are the yogi''s lived proof that prakṛti (nature) has no power over
  puruṣa (spirit) once that seeing is complete.


  Key Terms


  **prajñā** — Direct, non-conceptual knowing; the wisdom that sees the distinction between consciousness
  and matter without mediation of thought

  **saptadhā bhūmi** — Seven grounds or stages; the progressive levels through which discriminative insight
  unfolds toward liberation

  **prānta** — Frontier, edge, threshold; the final boundary where the mind approaches the state of kaivalya
  (absolute freedom)'
insight: In this passage the Yoga master declares that the ultimate attainment of Yoga is a singular,
  final stage of enlightenment, a state that transcends all intermediate experiences.
practice: 'Over one week, each day reflect on one stage of discernment:


  **Day 1:** Observe where you still believe your thoughts define you. Notice one moment where you watched
  a thought arise and pass without acting on it. That gap is the beginning of viveka.


  **Day 2:** Sit quietly and identify one kleśa (affliction) active in you today—fear, craving, or confusion.
  Don''t fight it; simply name it clearly. This is the second ground: recognition of the obstacle.


  **Day 3:** In meditation, practice the simple distinction: "I am aware of my breath; I am not my breath."
  Repeat this for 10 minutes. Notice the subtle shift in your sense of identity.


  **Day 4:** When a strong emotion arises, pause and ask: "Who is feeling this?" Don''t answer with a
  story. Rest in the question itself. This is the ground of inquiry.


  **Day 5:** Notice one moment where you acted from clarity rather than habit. Mark it. This is the ground
  of integrated action.


  **Day 6:** Sit in meditation and let your mind settle without grasping. Observe the natural peace that
  needs no object. This touches the sixth ground.


  **Day 7:** Rest in simple awareness—not meditating, not doing—for 20 minutes. No goal, no effort to
  reach anything. This is the threshold where wisdom stands alone.'
