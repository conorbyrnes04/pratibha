sanskrit_devanagari: विरामप्रत्यायाभ्यासपूर्वः संस्कारशेषो अन्यः
sanskrit_iast: virāmapratyayābhyāsapūrvaḥ saṃskāraśeṣo 'nyaḥ
translation_literal: When practice ceases, what remains is the imprint alone—a different kind of concentration,
  born from the residue of what has been cultivated.
commentary: 'This sūtra (I.18) marks a subtle but crucial shift in understanding how meditation deepens.
  Patañjali distinguishes between two phases of concentration (samādhi): the active phase, where the mind
  deliberately restrains itself through repeated practice (abhyāsa), and the phase that emerges when that
  deliberate effort stops.


  The word virāma means cessation or pause. Pratyaya is the content or object of consciousness. When the
  meditator stops actively holding the mind to an object—stops the effort itself—something unexpected
  persists: saṃskāra, the subliminal imprint or groove worn into consciousness by sustained practice.
  This residual imprint is described as ''another'' (anya) kind of concentration because it operates without
  the friction of willful restraint.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that consciousness (puruṣa) is naturally
  clear; what clouds it are the fluctuations (vṛtti) driven by habit and conditioning. When effort relaxes,
  the saṃskāra—the deep groove of practice—continues to hold the mind steady almost effortlessly. This
  is the threshold between forced concentration (savicāra or sagarbha samādhi) and the spontaneous, settled
  states that follow.


  The practical implication is profound: meditation does not depend on perpetual striving. The seeds planted
  through disciplined practice eventually bear fruit as natural steadiness. This sūtra reassures practitioners
  that the work is cumulative; even when you stop trying, the imprint remains and deepens.


  Key Terms


  **saṃskāra** — Subliminal imprint, groove, or conditioning left in consciousness by repeated action
  or experience; the latent trace that persists and shapes future perception.

  **virāma** — Cessation, pause, or discontinuation; the stopping or relaxation of active effort.

  **abhyāsa** — Disciplined, repeated practice; the sustained effort to train the mind toward a single
  point or state.'
insight: The sutra asserts that a distinct mode of samādhi exists where the mind is left with only the
  residual samskāras, devoid of any active cognition.
practice: Stop mid-practice—mid-breath, mid-mantra, mid-gaze—and hold completely still for three full
  breaths, doing nothing at all. Notice what continues to move, organize, or hold attention within you
  without your direction. That persistence is the imprint speaking.
