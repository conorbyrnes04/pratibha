- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this verse is that true prajñā (knowledge) is not an isolated faculty but
    is sustained by the underlying principle of ṛta (cosmic order). This aligns with the Sāṃkhya view
    that puruṣa’s cognition is only possible when it is attuned to the lawful order of prakṛti. The contested
    move here is the assertion that ṛta functions as a sustaining force rather than merely a descriptive
    principle; it is an active regulator that keeps prajñā from dissolving into ignorance. In the Yoga
    context, this implies that samādhi is achieved when the mind’s fluctuations are harmonized with ṛta,
    thereby allowing prajñā to remain steady. The Dvivedi commentary, though not quoted verbatim, underscores
    that the ‘anchor’ (bharā) is a metaphor for the firm grounding of consciousness in the immutable law,
    a theme that echoes in Patanjali’s later verses on samādhi. Practically, this means that a practitioner
    should consciously align their awareness with the rhythm of the universe—recognizing the patterns
    of breath, heartbeat, and external cycles—so that their inner knowing is not merely fleeting insight
    but a stable, sustained awareness. This alignment transforms ordinary cognition into a disciplined,
    meditative state that is resilient to distraction, thereby fulfilling the Yoga goal of liberation
    (moksha).


    Key Terms


    **ṛta (र्‍त)** — From the Vedic root meaning ''to be in order''; in Sāṃkhya, ṛta is the principle
    of cosmic law that orders prakṛti. The default translation ‘order’ misses its role as an active regulator
    that sustains consciousness.


    **prajñā (प्रज्ञा)** — Etymologically from prajñā (to know), it denotes discriminative knowledge that
    distinguishes puruṣa from prakṛti. Traditional meaning emphasizes its capacity to perceive the subtle
    distinctions of reality, beyond mere sensory data.


    **tatra (तत्र)** — Means ‘there’ or ‘in that place’. In this context it specifies the locus where
    prajñā is sustained—within the realm of ṛta, not in the chaotic mind.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 1.47:** Both verses discuss the anchoring of cognition in an underlying principle,
    using the metaphor of an anchor (bharā).

    *Divergence:* While 1.47 speaks of the mind’s attachment to the body, 1.48 shifts focus to the cosmic
    order as the anchor, expanding the scope from personal to universal.


    **Kapila Samhita, 1.3:** Kapila asserts that knowledge is possible only when the mind is aligned with
    ṛta, mirroring the claim that prajñā is sustained by ṛta.

    *Divergence:* Kapila’s text frames this alignment as a precondition for all cognition, whereas Patanjali
    presents it as a condition for samādhi, thus narrowing the application.


    **Brahma Sutra 1.2.1:** Both treat ṛta as a foundational principle that underlies all knowledge.

    *Divergence:* Brahma Sutra uses ṛta in a metaphysical context, whereas Patanjali applies it directly
    to meditative practice.'
