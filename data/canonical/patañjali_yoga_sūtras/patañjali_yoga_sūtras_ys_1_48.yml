sanskrit_devanagari: र्‍तंभाराः तत्र प्रज्ञा
sanskrit_iast: ṛtaṃbharā tatra prajñā
translation_literal: There, knowledge becomes saturated with truth—bearing the weight of what is real.
commentary: 'This sūtra (I.48) marks a threshold in the unfolding of samādhi. The meditator has moved
  through savikalpa samādhi (samādhi with seed, with mental form) into a state where the mind''s knowing
  faculty aligns with reality itself. Ṛta means cosmic order, truth, the lawful structure of existence;
  bhara means bearing, carrying, weight. Prajñā is direct knowing—not inference, not memory, but immediate
  wisdom.


  In the Yoga–Sāṃkhya framework, this is the moment when the mind''s reflective capacity (buddhi) ceases
  to distort and begins to mirror prakṛti (nature) and puruṣa (consciousness) as they actually are. The
  knowledge that arises is no longer filtered through the yogi''s personal conditioning, trauma, or conceptual
  overlay. It is *saturated* with ṛta—the ordering principle that holds the cosmos together.


  This is not mystical vagueness. Patañjali is describing a specific cognitive event: when the mind becomes
  still enough, knowledge of what is true naturally emerges. The truth does not need to be constructed;
  it needs only the removal of obstruction. This prajñā is self-validating—it carries its own authority
  because it aligns with the structure of reality itself, not with belief or desire.


  The verse also implies a test: knowledge that is truly saturated with ṛta will be reliable, actionable,
  and consistent with the nature of things. False knowledge, by contrast, wobbles and contradicts itself.


  Key Terms


  **ṛta** — Cosmic order, truth, the lawful structure of reality; that which is in accord with nature
  and universal principle.

  **prajñā** — Direct knowing, wisdom, immediate insight; the faculty of mind that perceives without conceptual
  mediation.

  **savikalpa samādhi** — Meditative absorption in which the mind is unified with an object but retains
  subtle seed-form distinction; the gateway to nirvikalpa (seedless) samādhi.'
insight: The central claim of this verse is that true prajñā (knowledge) is not an isolated faculty but
  is sustained by the underlying principle of ṛta (cosmic order).
practice: 'Sit quietly for 10–15 minutes. Choose one simple, observable fact about your direct experience
  right now—the coolness of air on your skin, the rhythm of your breath, the quality of light in the room,
  a sensation in your body. Do not think *about* it; do not name it elaborately. Simply rest your attention
  on it as it is, without adding story, judgment, or memory.


  Notice: when you stop interpreting and just perceive, does the knowing feel different? Does it carry
  a quality of certainty that does not depend on your opinion? That directness—that uncolored seeing—is
  a taste of ṛtaṃbharā prajñā. You are not generating the knowledge; you are removing the filter and allowing
  what is true to be known. Practice this daily. Over time, this quality of knowing can extend into more
  subtle and complex domains of experience.'
