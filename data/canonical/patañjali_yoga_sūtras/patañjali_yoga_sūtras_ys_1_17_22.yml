sanskrit_devanagari: 'वितर्कविचारानन्दस्मितारूपानुगमात् संप्रज्ञातः ॥ १.१७ ॥


  विरामप्रत्यायाभ्यासपूर्वः संस्कारशेषो अन्यः ॥ १.१८ ॥


  भवप्रत्ययो विड्हप्रकृतिलयाणाम् ॥ १.१९ ॥


  श्रद्धावीर्यस्मृतिसमाधिप्रज्ञापूर्वक इतरेषाम् ॥ १.२० ॥


  तीव्रसंवेगाणाम् आसन्नः ॥ १.२१ ॥


  मृदुमध्यमध्यिमात्रत्वात ततः अपि विशेषः ॥ १.२२ ॥'
sanskrit_iast: 'vitarkavicārānandāsmitārūpānugamāt saṃprajñātaḥ || 1.17 ||


  virāmapratyayābhyāsapūrvaḥ saṃskāraśeṣo ''nyaḥ || 1.18 ||


  bhavapratyayo videhaprakṛtilayānām || 1.19 ||


  śraddhāvīryasmṛtisamādhiprajñāpūrvaka itareṣām || 1.20 ||


  tīvrasaṃvegānām āsannaḥ || 1.21 ||


  mṛdumadhyādhimātratvāt tato ''pi viśeṣaḥ || 1.22 ||'
translation_literal: '**1.17** The conscious one is that which is attended by argumentation, deliberation, joy, and the sense
  of being.

  **1.18** The other form of samādhi is that in which only the residual impressions (samskāras) remain, brought about by the
  practice of the cause of complete suspension.

  **1.19** The state of being [videha] (world‑bound) and [prāyā] (in the realm of prakṛti) is the condition of those who are
  trapped in the concrete universe.

  **1.20** In others, the state of samadhi is preceded by faith and energy. The presence of faith and energetic action recalls
  prior knowledge, enabling discrimination and ultimately leading to the highest samadhi.

  **1.21** It is nearest to those whose feeling is most ardent.

  **1.22** The samādhi state is mild, moderate, and excessive, and it is also special.'
commentary: 'Patañjali maps two distinct forms of samādhi across this cluster, then calibrates the practitioner''s approach
  to them by intensity of aspiration. The first move (1.17–1.18) establishes a binary: samprajñāta-samādhi, in which consciousness
  remains active—reasoning, deliberating, suffused with joy and the sense of ''I am''—and asamprajñāta-samādhi, in which even
  that reflexive awareness dissolves, leaving only dormant samskāras (impressions) suspended in a state of complete vṛtti-cessation.
  This is not a hierarchy of value but a phenomenological taxonomy. Both are samādhi; both rest on vairāgya (detachment),
  the practice that stills the mind''s modifications. The Sāṃkhya frame clarifies the stakes: in samprajñāta, puruṣa (the
  witness) remains luminous within prakṛti''s final, subtlest vṛtti; in asamprajñāta, puruṣa rests in isolation (kaivalya),
  untouched even by the knowledge-vṛtti. The second move (1.19–1.20) addresses a subtle trap: those bound to videha (the body-mind
  apparatus) and prāyā (the realm of manifest nature) mistake embodied consciousness for liberation. True samādhi requires
  faith (śraddhā) and energy (vīrya)—not mere technique but conviction and sustained effort—to kindle discrimination (viveka)
  and ascend to asamprajñāta. The final move (1.21–1.22) is radical: samādhi arrives "nearest to those whose feeling is most
  ardent." Intensity of longing, not intellectual sophistication, determines access. And the state itself admits gradation—mild,
  moderate, intense, and a fourth category (special, perhaps pointing to sahaja or spontaneous abiding)—yet all are samādhi.
  Patañjali thus refuses to flatten the path: he honors both the conscious, joy-filled samādhi of the aspirant and the seedless,
  wordless samādhi of the liberated, while insisting that the difference between them hinges not on technique alone but on
  the heat of genuine renunciation and the clarity born from it.


  Key Terms


  **samprajñāta-samādhi** — Conscious absorption in which the mind remains active in reasoning, deliberation, and the sense
  of being; the samādhi of knowledge-bearing vṛtti

  **asamprajñāta-samādhi** — Unconscious absorption in which all vṛtti cease and only dormant samskāras remain; the samādhi
  of complete suspension leading to kaivalya

  **vairāgya** — Detachment or dispassion; the practice that suspends the mind''s modifications and enables ascent to both
  forms of samādhi

  **viveka** — Discrimination between puruṣa and prakṛti; the faculty awakened by faith and energy that discerns the path
  to asamprajñāta-samādhi


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.20–23:** Kṛṣṇa describes two forms of yogic realization: one in which the mind is stilled yet aware (dhyāna-yoga),
  and one in which the yogi abides in Brahman beyond thought. Like Patañjali, the Gītā honors both the conscious path and
  the transcendent state, and emphasizes that intensity of practice and faith determine progress. Divergence: The Gītā frames
  both paths as devotional surrender to Kṛṣṇa, whereas Patañjali''s system is non-theistic; the Gītā also stresses duty (dharma)
  and action (karma-yoga) as scaffolding, while Patañjali isolates the internal mechanics of mind-cessation.

  **Plotinus, Enneads VI.9.3–4:** Plotinus describes two modes of union with the One: one in which the intellect remains active
  in contemplation (noesis), and one in which the soul transcends even intellection in a wordless, ecstatic touching. Like
  Patañjali, he insists that the higher state is nearer to those of greatest longing and purification, and that both are authentic
  forms of realization. Divergence: Plotinus treats the lower mode as inferior and transient, whereas Patañjali grants samprajñāta-samādhi
  full legitimacy as a stable resting-place; Plotinus also emphasizes emanation and the One''s transcendence, while Patañjali''s
  puruṣa is immanent witness, not transcendent source.

  **Dhammapada 21–22:** The Buddha teaches that mindfulness and energy (viriya) are the path to the deathless, and that those
  with ardent hearts reach Nirvana. Like Patañjali''s emphasis on vīrya and the proximity of samādhi to the intensely aspiring,
  the Dhammapada locates liberation in the heat of genuine effort and longing. Divergence: The Buddha''s path culminates in
  the cessation of all samskāras and the unconditioned (Nirvana), with no intermediate conscious samādhi; Patañjali allows
  samprajñāta-samādhi as a valid resting-place and does not frame the goal in terms of non-self (anattā).'
insight: The sūtra declares that samādhi is not merely a passive absorption but a dynamic, tri‑modal awareness that simultaneously
  engages the mind in argument (savitrāka), deliberation (savichara), and the ex
practice: You observe the mind’s activity and, when you notice it dwelling in the world and the elements, you consciously
  let it rest, allowing your awareness to detach from the body and the material realm.
