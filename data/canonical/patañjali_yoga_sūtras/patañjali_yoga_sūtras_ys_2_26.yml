sanskrit_devanagari: विवेकाख्यातिर अविप्लवाः हानोपायः
sanskrit_iast: vivekakhyātir aviplavā hānopāyaḥ
translation_literal: Unwavering discrimination—this is the means of dissolving attachment.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on the removal of afflictions
  (kleśa). Viveka-khyāti, the clear vision that distinguishes between the eternal Self (puruṣa) and the
  ever-changing field of nature (prakṛti), is not a momentary insight but must be continuous and unshakeable
  (aviplavā—literally ''not wavering, not collapsing''). This steady discrimination is the direct method
  (hānopāya) by which the root cause of suffering—the false identification of consciousness with mental
  and bodily processes—is dissolved.


  Within the Yoga–Sāṃkhya framework, prakṛti (nature) operates through the three guṇas and generates all
  experience, sensation, and thought. The puruṣa (witnessing consciousness) is eternally free but appears
  bound through ignorance (avidyā). The moment discrimination becomes continuous—not just an intellectual
  understanding but a lived recognition that ''I am the unchanging witness, not these changing contents''—the
  mechanism of bondage loses its power. Afflictions (kleśas) feed on the confusion between subject and
  object; viveka-khyāti starves them by maintaining clear seeing.


  This is not suppression or denial of experience, but a fundamental reorientation of identity. The practice
  is not to reject the body or mind, but to stop claiming ownership of their fluctuations. When this seeing
  becomes aviplavā (steady, unbroken), the attachment (rāga) and aversion (dveṣa) that bind consciousness
  to cycles of action and reaction naturally fall away.


  Key Terms


  **viveka-khyāti** — Clear discrimination or discernment; the direct vision that distinguishes puruṣa
  (consciousness) from prakṛti (nature and its modifications)

  **aviplavā** — Unshakeable, unbroken, continuous; not wavering or collapsing under the pressure of habit
  and conditioning

  **hānopāya** — The means or method of dissolution; the direct path by which afflictions (kleśas) and
  false identification are removed'
insight: The central claim here is that true dissolution of ignorance is achieved not by sporadic moments
  of insight but by a sustained, unbroken practice of discrimination.
practice: 'Throughout your day, pause three times (morning, midday, evening) for two minutes. In each
  pause, silently observe one mental or bodily sensation—a thought, an emotion, a physical sensation—and
  inwardly note: ''This is changing; I am aware of it changing. The awareness itself does not change.''
  Do not try to make anything happen or achieve a special state. Simply let the fact of your unchanging
  awareness of changing content become vivid. Over weeks, this simple discrimination—noticing the difference
  between the witness and what is witnessed—begins to loosen the habitual claim that ''I am my thoughts''
  or ''I am my feelings.'' This is the seed of aviplavā viveka-khyāti: discrimination that becomes your
  lived reality, not just an idea.'
