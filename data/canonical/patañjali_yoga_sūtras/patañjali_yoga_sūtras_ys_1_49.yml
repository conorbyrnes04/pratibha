- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this sutra is that the knowledge arising from direct perception and inference—what
    the Yogi calls pratyaksha and anumana—is not the same as the knowledge that arises in the state of
    Xirvichara‑samādhi, which apprehends each particular object with absolute clarity. The sutra therefore
    introduces a new category of cognition, distinct from the traditional triad of pratyaksha, anumana,
    and shabda. This move is contested because it elevates a form of knowledge that is neither purely
    empirical nor purely inferential, yet claims it to be superior. In the Yoga and Sāṃkhya traditions,
    such a claim challenges the primacy of the three pramāṇas, suggesting that the yogic samādhi can bypass
    the limitations of the senses and the mind’s generalizing tendencies. The practical implication is
    that a practitioner, by attaining samādhi, can access the minutest particulars of reality—those that
    are ordinarily obscured by the generalizations of ordinary cognition. Dvivedi’s commentary echoes
    this by noting that the knowledge in samādhi refers to particular objects independent of time and
    place, thereby surpassing the generalizing nature of inference and testimony. This insight invites
    a re‑examination of the hierarchy of pramāṇas, positioning the yogic samādhi as a higher epistemic
    mode that can directly apprehend the true nature of each individual phenomenon, thereby providing
    a concrete existential tool for liberation.


    Key Terms


    **pratyaksha (प्रत्यक्ष)** — direct perception -> empirical knowledge -> here distinct from samādhi
    cognition


    **anumana (अनुमान)** — inference -> logical deduction -> here distinct from samādhi cognition


    **samādhi (समाधि)** — state of absorption -> yogic concentration -> new category of knowledge


    Cross-Tradition Resonances


    **Yoga Sūtra 1.48:** Both sutras discuss the nature of knowledge; 1.48 describes the three pramāṇas,
    while 1.49 introduces a fourth, higher type.

    *Divergence:* 1.49 breaks the triadic structure by asserting a superior knowledge that is not covered
    by the earlier classification


    **Brahma Sutra 2.1.1:** Both texts debate the hierarchy of epistemic means; Brahma Sutra affirms the
    primacy of pratyaksha, anumana, and shabda.

    *Divergence:* Yoga Sūtra 1.49 diverges by positing a knowledge that transcends these, thereby redefining
    the epistemic hierarchy'
