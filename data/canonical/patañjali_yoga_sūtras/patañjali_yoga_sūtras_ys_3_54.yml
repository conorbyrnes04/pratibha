sanskrit_devanagari: तारकं सर्वविषयं सर्वथाविषयम् अकर्मण् चति विवेकजं ज्ञानम्
sanskrit_iast: tārakaṃ sarvaviṣayaṃ sarvathāviṣayam akramaṃ ceti vivekajaṃ jñānam
translation_literal: Knowledge born of discernment is that which penetrates all objects, transcends all
  objects entirely, and operates without sequence—this is the liberating insight.
commentary: 'This sūtra names a rare and pivotal form of knowledge (jñānam) that arises when viveka—the
  faculty of discernment—matures. The verse distinguishes three qualities of this knowledge:


  1. **Tārakam (penetrating)**: The knowledge pierces through or crosses over (tṛ-root) all objects of
  perception. It does not remain stuck in particulars but sees through them.


  2. **Sarvaviṣayam sarvathāviṣayam (all-encompassing yet transcendent)**: It grasps all domains of experience
  (sarvaviṣayam) while simultaneously standing beyond all domains (sarvathāviṣayam). This is not omniscience
  in the sense of collecting information, but rather the simultaneous presence to all experience without
  entanglement in any.


  3. **Akramam (non-sequential)**: Unlike ordinary knowledge, which builds step by step through reasoning
  and time, this knowledge operates akramam—without progression, without the need for logical steps. It
  is direct and whole.


  Within the Yoga–Sāṃkhya framework, this describes the breakthrough moment when the meditator''s awareness
  (puruṣa) recognizes itself as distinct from the entire field of nature (prakṛti)—all objects, all mental
  states, all processes. This is not intellectual knowledge but a shift in the locus of consciousness
  itself. The knowledge is called ''born of discernment'' because it emerges only when viveka has been
  cultivated through sustained practice, and it marks the threshold of liberation (kaivalya).


  Key Terms


  **viveka** — Discernment; the capacity to distinguish puruṣa (pure awareness) from prakṛti (nature and
  its modifications).

  **tārakam** — Penetrating or crossing over; knowledge that pierces through the veil of objects and reveals
  their illusory separation.

  **akramam** — Non-sequential, without steps or progression; direct and simultaneous rather than built
  through logical reasoning.'
insight: The sutra asserts that the mind’s discriminative faculty (viveka) is the means by which the apparent
  sameness of objects is broken into distinct realities.
practice: '**The Simultaneous Witness Practice (15 minutes)**


  Sit comfortably with spine upright. Close your eyes.


  1. **Establish the sequence (2 min)**: Notice your breath, sensations, and thoughts as they arise in
  time. Label each: ''breathing,'' ''tingling,'' ''thinking.'' This is normal, sequential awareness.


  2. **Shift to the simultaneous field (8 min)**: Without stopping the breath or thoughts, deliberately
  widen your attention so that you are aware of *all* of these at once—breath, body, emotions, and the
  space in which they occur—in a single, undivided presence. Do not try to understand or analyze; simply
  hold them all in one awareness. If attention collapses back into sequence, gently expand again.


  3. **Notice the witness (5 min)**: From this simultaneous awareness, notice that there is something
  in you that is *aware of* the entire field—breath, body, thoughts, space—without being any of them.
  This aware presence is untouched by what it witnesses. Rest here.


  This practice trains the mind to taste the difference between sequential knowledge (which always involves
  time and separation) and the non-sequential knowing that Patañjali calls tārakam—the knowledge that
  sees through and beyond all objects while remaining whole.'
