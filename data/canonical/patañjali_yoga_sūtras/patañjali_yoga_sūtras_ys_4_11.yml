sanskrit_devanagari: हेतुपलाःश्रयालम्बनैः सङ्ग्र्हीतत्वाद् एषाम् अभावः तदाभावः
sanskrit_iast: hetuphalāśrayālambanaiḥ saṃgṛhītatvād eṣām abhāve tadabhāvaḥ
translation_literal: Because impressions are held together by cause, effect, support, and object, when
  these are absent, the impressions themselves are absent.
commentary: 'This sūtra explains the structural dependency of vāsanā (latent impressions or mental residues)
  within the Yoga–Sāṃkhya framework. Patañjali identifies four necessary conditions for impressions to
  persist: (1) hetu—the causal agent or root action that generates them; (2) phala—the fruiting or maturation
  of those causes into experience; (3) āśraya—the substrate or ground (typically the mind-stuff, citta)
  in which they lodge; and (4) ālambana—the object or content that gives them specificity and continuity.


  The verse asserts a radical principle: impressions have no independent existence. They are not self-sustaining
  entities but rather dependent phenomena. When any of these four supports is removed or ceases to function,
  the impression collapses. This is not merely theoretical; it directly supports the yoga path. If a practitioner
  can sever the causal chain (through discrimination and non-identification), eliminate the object of
  fixation (through sense-withdrawal or pratyāhāra), or alter the substrate itself (through samādhi),
  the impression loses its binding power.


  This sūtra also implies the inverse: the reason impressions feel so solid and real is precisely because
  all four conditions are currently intact and mutually reinforcing. The work of yoga is to systematically
  dismantle this architecture—not through suppression, but through understanding and releasing the conditions
  that hold impressions in place.


  Key Terms


  **vāsanā** — Latent impression, residual tendency, or mental groove left by past action and perception;
  the seed form of future experience

  **ālambana** — Object of perception or mental fixation; the external or imagined content that anchors
  an impression

  **āśraya** — Substrate, ground, or vessel; the mind-stuff (citta) or body in which impressions lodge
  and are sustained'
insight: 'The central claim of this verse is that the persistence of mental impressions (vṛtti) depends
  on four interdependent conditions: causality (hetu), effect (phala), basis (mūla), and support (āśray).'
practice: 'Identify one recurring mental impression or vāsanā that troubles you (anxiety about failure,
  attraction to a person, craving for recognition). For one week, observe it using the four-factor lens:
  (1) What action or belief is its root cause (hetu)? (2) What result or reward does it promise (phala)?
  (3) Where does it live in your body or mind (āśraya)? (4) What specific object or image holds it (ālambana)?
  Each day, write one sentence for each factor. By the week''s end, you will see that the impression is
  not monolithic but a composite. Then, deliberately withdraw attention from one factor—for instance,
  stop imagining the promised reward, or redirect your gaze from the object. Notice how the impression
  weakens. This direct observation of the four-factor structure is the beginning of freedom.'
