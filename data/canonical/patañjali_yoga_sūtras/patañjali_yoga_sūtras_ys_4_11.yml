- kind: practice
  label: Practice (Abhyasa)
  body: You observe each mental impression, noting its cause, effect, basis, and support; as you become
    aware of these four, you consciously let them dissolve, allowing the impression to vanish.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: The impressions being held together by cause, effect, basis and support, they disappear with the
    disappearance of these four.
