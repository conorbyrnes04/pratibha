- kind: translation
  label: Pratibha Translation
  body: The impressions are held together by cause, effect, basis, and support; when these four are absent,
    the impressions vanish.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this verse is that the persistence of mental impressions (vṛtti) depends
    on four interdependent conditions: causality (hetu), effect (phala), basis (mūla), and support (āśray).
    In the Yoga–Sāṃkhya framework, these four are the operative mechanisms of prakṛti that bind the mind
    to the world. The verse asserts that dissolution of impressions occurs only when all four conditions
    are simultaneously removed, highlighting the inseparability of the causal chain. This contrasts with
    the more common Sāṃkhya view that vṛtti can be suppressed by the pratyakṣa‑prāpti of puruṣa alone;
    here, the emphasis is on the structural collapse of the causal matrix. The implication for practice
    is that one must not merely withdraw attention but must also dismantle the underlying causal fabric—achieving
    a state where cause, effect, basis, and support are no longer operative. This aligns with the Satchidananda
    insight that the disappearance of impressions follows the disappearance of their four foundations,
    underscoring the necessity of a holistic approach to liberation.


    Key Terms


    **hetu (हेतु)** — cause -> Sāṃkhya: initiating principle of change -> Yoga: foundational cause of
    vṛtti; default translation ''cause'' omits its role as the initiating spark of all mental activity.


    **phala (फल)** — effect -> Sāṃkhya: resultant manifestation of change -> Yoga: the outcome that sustains
    vṛtti; default ''effect'' fails to capture its sustaining, generative quality.


    **mūla (मूल)** — basis -> Sāṃkhya: root principle of materiality -> Yoga: the underlying substrate
    that anchors impressions; default ''basis'' misses its ontological primacy.


    **āśray (आश्रय)** — support -> Sāṃkhya: sustaining condition that preserves change -> Yoga: the sustaining
    force that keeps vṛtti from dissolving; default ''support'' overlooks its role as the protective buffer.


    Cross-Tradition Resonances


    **Yoga Sūtra 4.9:** Both verses enumerate the four conditions (hetu, phala, mūla, āśray) as essential
    for vṛtti, showing structural homology in listing.

    *Divergence:* While 4.9 focuses on the presence of these conditions, 4.11 emphasizes their absence
    as the trigger for dissolution, shifting from existence to non‑existence.


    **Sāṃkhya Kāṇḍa 1.1:** Sāṃkhya’s enumeration of the four principles of change parallels the Yoga list,
    indicating shared metaphysics.

    *Divergence:* Sāṃkhya treats the principles as independent, whereas Yoga presents them as interdependent,
    a nuance that informs the Yoga interpretation of vṛtti.


    **Yoga Sūtra 4.12:** The next verse discusses the removal of vṛtti through pratyāhāra, structurally
    following the removal of the four conditions.

    *Divergence:* 4.12 introduces pratyāhāra as a method, whereas 4.11 merely states the condition for
    dissolution, highlighting a procedural versus descriptive difference.'
