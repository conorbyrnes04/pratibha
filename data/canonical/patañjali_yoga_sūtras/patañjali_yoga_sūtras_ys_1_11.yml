  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Memory as Non‑Cognition”: here: the
      locus of *vṛtti* that must be kept from object‑allowing -> not ‘brain software’ or an enemy to smash; the reflecting
      medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Memory as Non‑Cognition”: here: the specific fluctuation
      of object‑allowing that memory must suppress -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error,
      fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Memory as Non‑Cognition”: here: the ultimate
      observer that remains distinct when memory *non‑allows* -> not ‘person’ as social self; the unchanging witness distinct
      from prakṛti’s display'
