unit_label: Memory as Non‑Cognition
title: Memory as Non‑Cognition
unit_type: sutra
sanskrit_devanagari: अनुभूतविषयासंप्रमोषः स्मृतिḥ
sanskrit_iast: anubhūtaviṣayāsaṃpramoṣaḥ smṛtiḥ
translation_literal: Memory is the non-loss of an object that has been experienced.
commentary: 'This sūtra (YS 1.11) defines smṛti (memory) by its essential function: the retention of what
  has already been perceived or lived through. Patañjali uses the compound anubhūta-viṣaya-asaṃpramoṣa—literally,
  ''the non-forgetting of an experienced object''—to distinguish memory from fresh cognition (pramāṇa).
  Memory is not a new act of knowing; it is the persistence of a prior knowing. The prefix a-saṃpramoṣa
  (''non-loss,'' ''non-slipping-away'') emphasizes that memory operates through retention, not through
  new sensory contact or inference. In the Yoga–Sāṃkhya framework, this definition is crucial: memory
  bridges past experience and present consciousness, yet it is not itself direct perception. It arises
  from the subtle impressions (saṃskāra) left by prior experience in the mind-stuff (citta). The yogi
  must recognize that memory, though useful, is a secondary form of knowing—a reconstruction or echo of
  what was lived, not what is living now. This recognition is essential for discriminating between the
  fluctuations of the mind (vṛtti) and pure witnessing awareness (puruṣa). Memory can bind us to habit
  and conditioning, or it can serve as a tool for understanding the patterns of our own consciousness.


  Key Terms


  **smṛti** — Memory; the retention and recollection of prior experience, arising from saṃskāra (subtle
  impressions).

  **anubhūta-viṣaya** — An object or experience that has already been perceived or lived through; the
  content of past knowing.

  **saṃskāra** — Subtle impressions or traces left in the mind by experience; the seeds of memory and
  conditioning.'
insight: The sūtra declares that memory is the *non‑allowing* of a thing to be cognised, a claim that
  situates memory as a *negative* cognitive act rather than a positive recollection.
practice: 'Sit quietly for 10 minutes. Recall a vivid memory from your day—a conversation, a meal, a moment
  outdoors. Notice: What exactly are you experiencing right now? Not the original event, but the memory
  of it. Observe how the memory feels different from direct perception—less sharp, more malleable, colored
  by emotion and interpretation. Now deliberately let the memory fade; watch it dissolve. Then notice
  the gap—the moment when you are not remembering, not thinking about the past. Rest there, in that gap,
  for a few breaths. This simple exercise reveals memory''s true nature: a mental impression, not the
  thing itself. It trains you to see the difference between what you are experiencing now and what you
  are remembering, sharpening the discriminative awareness (viveka) that yoga cultivates.'
