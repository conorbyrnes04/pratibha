  body: You anchor the practice in the body, purify the mind, and discern with clarity.
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that the very act of grounding the yogic practice in the body is the decisive move that transforms
    the mind from a state of impurity to one of luminous knowledge, and that this luminous knowledge is then distinguished
    by clear discrimination. In the Yoga‑Sūtra tradition, the body (kāraṇa) is the locus of the initial sādhanā, and the purifying
    of the mind (citta‑śuddhi) is the first milestone toward samādhi. The phrase “ā vivekakhyāteḥ” signals that the mind’s
    illumination is not merely passive; it actively discerns (viveka) between the real and the unreal. This aligns with the
    Sankhya view that puruṣa, through disciplined practice, can separate itself from prakṛti’s vṛtti. The implication for
    the practitioner is that without bodily anchoring, the mind remains entangled in vṛtti and cannot achieve the clarity
    required for true discernment. Thus, the sūtra offers a concrete prescription: begin with the body, cleanse the mind,
    and cultivate discernment, thereby moving toward the ultimate goal of samādhi. This sequence mirrors the Sankhya epistemology
    that knowledge (jnana) arises when puruṣa is free from prakṛti’s influence, yet it diverges by emphasizing the body as
    the necessary starting point, a nuance that is absent in pure Sankhya texts.


    Key Terms


    **yoga (योग)** — ‘yoga’ (IAST) derives from ‘yuj’ meaning ‘to join’; in Sankhya it denotes the union of puruṣa and prakṛti,
    but here it is specifically the bodily practice that initiates purification.


    **citta (चित्त)** — ‘citta’ (IAST) means ‘mind’ or ‘consciousness’; Sankhya sees it as the fluctuating aspect of prakṛti,
    while here it is the target of purification.


    **vṛtti (वृत्ति)** — ‘vṛtti’ (IAST) refers to the mental modifications; Sankhya lists eight vṛtti, but the sūtra treats
    it as the impurity to be removed.


    **puruṣa (पुरुष)** — ‘puruṣa’ (IAST) is the pure consciousness in Sankhya; the sūtra implies that puruṣa can achieve clarity
    only after the body‑anchored practice purifies citta.


    Cross-Tradition Resonances


    **Yoga Sūtra 2.26:** Both sutras emphasize bodily anchoring (kāraṇa) as the starting point for purification; 2.28 extends
    this by linking purification directly to discernment.

    *Divergence:* While 2.26 speaks of purification alone, 2.28 explicitly introduces the outcome of discernment, highlighting
    a progression.


    **Yoga Sūtra 2.30:** The structure ‘body‑anchor → purification → discernment’ parallels the triad in 2.30 where the mind
    is purified, discerned, and then liberated.

    *Divergence:* 2.30 assumes prior purification, whereas 2.28 presents purification as the immediate consequence of bodily
    anchoring.


    **Sankhya Karika 2.1:** Both texts identify the mind’s fluctuations (vṛtti) as the obstacle to clarity.

    *Divergence:* Sankhya Karika treats vṛtti as inherent to prakṛti, while 2.28 treats it as a state to be purified through
    practice.


    **Yoga Sūtra 2.31:** The idea that discernment follows purification appears in 2.31 as well.

    *Divergence:* 2.31 focuses on the role of the intellect (buddhi) in discernment, whereas 2.28 attributes discernment directly
    to the purified mind.'
