sanskrit_devanagari: योगाङ्गानुश्ठानाद् अशुद्धिक्षये ज्ञानदीप्तिर् आ विवेकाख्यतेः
sanskrit_iast: yogāṅgānuṣṭhānād aśuddhikṣaye jñānadīptir ā vivekakhyāteḥ
translation_literal: Through the practice of yoga's limbs, as impurity diminishes, the light of knowledge blazes forth until
  discernment—called viveka—is fully revealed.
commentary: 'This sūtra (II.28) marks a crucial threshold in Patañjali''s map of yoga. It names the direct result of sustained
  practice of the eight limbs (yama, niyama, āsana, prāṇāyāma, pratyāhāra, dhāraṇā, dhyāna, samādhi): the progressive removal
  of āśuddhi (obscuration, contamination, mental-emotional silt) and the simultaneous kindling of jñānadīpti, the illumination
  of knowing.


  The metaphor is precise. Impurity is not conquered by force but dissolved through consistent practice. As it thins, knowledge—which
  is always present but veiled—becomes luminous. This is not intellectual knowledge (prajñapti) but direct, immediate recognition:
  viveka-khyāti, the discriminative insight that distinguishes the eternal Witness (puruṣa) from the ever-changing field of
  nature (prakṛti). This distinction is the gateway to liberation (kaivalya).


  Within the Yoga–Sāṃkhya framework, viveka is not a belief or philosophy but a perceptual shift: the mind becomes transparent
  enough that the unchanging consciousness can be directly perceived as separate from all mental and physical phenomena. The
  sūtra emphasizes that this clarity is not granted suddenly or by grace alone—it emerges *through* the systematic work of
  the eight limbs. Each limb removes a layer of obscuration: ethical restraints (yama, niyama) purify the field of action;
  postural and breath work (āsana, prāṇāyāma) stabilize the body-mind; sense withdrawal (pratyāhāra) quiets external noise;
  concentration (dhāraṇā) gathers scattered attention; meditation (dhyāna) sustains that gathering; and absorption (samādhi)
  dissolves the boundary between knower and known. The result is viveka: the unshakeable recognition that ''I am not this;
  I am the witness of this.''


  Key Terms


  **yogāṅga** — The eight limbs of yoga: ethical restraints, observances, posture, breath control, sense withdrawal, concentration,
  meditation, and absorption.

  **āśuddhi** — Impurity, obscuration, or contamination—the mental and karmic veils that prevent direct perception of reality.

  **viveka-khyāti** — Discriminative insight; the direct, unmediated recognition of the difference between consciousness (puruṣa)
  and the field of nature (prakṛti).'
