sanskrit_devanagari: 'तद्वैराग्याद् अपि दोषबीजकस्ये काविल्यम् ॥ ३.५० ॥


  स्थायिनुपमन्त्रणे सङ्गसमयाकारणं पुनः अनिष्टप्रसङ्गात् ॥ ३.५१ ॥


  क्षणतत्क्रमायः संयमाद् विवेकजम् ज्ञानम् ॥ ३.५२ ॥


  जाटिलाक्षणादेशैः अन्यतांवच्छेदात् तुल्यायः ततः प्रतिपत्तिḥ ॥ ३.५३ ॥


  तारकं सर्वविषयं सर्वथाविषयम् अकर्मण् चति विवेकजं ज्ञानम् ॥ ३.५४ ॥


  सत्त्वपुरुषयोः शुद्धिसाम्ये कियव्यम् इति ॥ ३.५५ ॥'
sanskrit_iast: 'tadvairāgyād api doṣabījakṣaye kaivalyam || 3.50 ||


  sthānyupanimantraṇe saṅgasmayākaraṇaṃ punar aniṣṭaprasaṅgāt || 3.51 ||


  kṣaṇatatkramayoḥ saṃyamād vivekajaṃ jñānam || 3.52 ||


  jātilakṣaṇadeśair anyatānavacchedāt tulyayos tataḥ pratipattiḥ || 3.53 ||


  tārakaṃ sarvaviṣayaṃ sarvathāviṣayam akramaṃ ceti vivekajaṃ jñānam || 3.54 ||


  sattvapuruṣayoḥ śuddhisāmye kaivalyam iti || 3.55 ||'
translation_literal: '**3.50** From dispassion even toward that, through the destruction of the seed of
  defects, comes kaivalya.

  **3.51** Upon invitation by those in high places, one should not create attachment or pride, because
  of the possibility of undesirable consequences recurring.

  **3.52** From saṃyama on the moment and its succession arises knowledge born of discernment.

  **3.53** From that [discernment-born knowledge] comes the capacity to distinguish between two similar
  things which cannot be differentiated by class, characteristic, or position.

  **3.54** The knowledge born of discernment is transcendent, extends to all objects, relates to all conditions,
  and is without succession.

  **3.55** When there is equality in purity between sattva and puruṣa, that is kaivalya.'
commentary: 'These six sūtras trace a single epistemic movement: the yogi''s progressive refinement of
  discrimination (viveka) until the distinction between puruṣa and prakṛti becomes not merely intellectual
  but lived, moment-to-moment reality. The cluster moves from the foundational recognition (3.50)—that
  liberation arises from discerning sattva (the reflective principle of prakṛti) from puruṣa itself—through
  the paradox of non-attachment to siddhis (3.51), which seals the break from ego-driven seeking. Then
  it narrows the lens: 3.52 locates viveka not in grand insight but in the instantaneous restraint (samya)
  of each fluctuation. Sūtras 3.53–54 deepen this by showing how the yogi learns to perceive the atomic
  distinctness of each moment and the subtle differences between apparently identical objects—a precision
  of attention that trains the intellect (buddhi) to see without projection. Finally, 3.55 completes the
  arc: the puruṣa, through its inherent sameness (unchanging nature), *is* liberation—not something to
  be achieved but to be recognized as already present once the veil of prakṛti''s modifications lifts.
  The movement is from cognitive distinction to perceptual precision to ontological recognition. In Sāṃkhya-Yoga
  terms, this is the trajectory from jñāna (knowledge) to prajñapti (direct discrimination) to kaivalya
  (aloneness): the puruṣa does not *become* free but ceases to mistake itself for the mind''s dance. The
  cluster''s power lies in its refusal of both passivity and striving—the yogi neither waits for grace
  nor grasps at powers, but sustains a razor-edged attention to what is already the case.


  Key Terms


  **viveka** — discrimination; the faculty of distinguishing puruṣa from prakṛti and the real from the
  unreal

  **sattva** — the luminous, reflective guṇa (quality) of prakṛti; the principle of clarity and knowledge
  within matter

  **kaivalya** — aloneness; liberation; the puruṣa''s recognition of its independence from all modifications
  of prakṛti

  **samya** — restraint or self-control; the disciplined holding of attention in the present moment


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47–48:** Both texts teach non-attachment to the fruits of action (karma-phala) as
  the path to liberation. Arjuna is instructed to act without clinging to results; similarly, Patañjali''s
  yogi relinquishes siddhis to break the seed of bondage. Divergence: The Gītā situates this within dharma
  (duty) and devotion to Kṛṣṇa, whereas the Yoga Sūtras ground it in epistemological precision and the
  mechanics of prakṛti alone, with no theistic framework.

  **Epictetus, Enchiridion 1:** Both teach the distinction between what is ''up to us'' (our judgments
  and assent) and what is not (external events), with freedom arising from recognizing and acting on this
  boundary. Divergence: Epictetus remains within the human sphere of choice and virtue; Patañjali''s viveka
  extends to the metaphysical separation of consciousness (puruṣa) from all matter, including the mind
  itself.

  **Dhammapada 277–279:** Both emphasize moment-to-moment mindfulness and the cessation of craving as
  the path to nirvana/kaivalya; both locate liberation in present-tense awareness rather than future attainment.
  Divergence: The Buddha teaches non-self (anattā); Patañjali posits an eternal, unchanging puruṣa whose
  recognition is the very essence of liberation.'
insight: 'The central claim of this verse is that ultimate liberation is achieved not by external practice
  but by an internal cognitive act of distinction: the Self (purusha) is set apart from the material worl'
practice: When you feel a thought arise, pause, and in that instant apply restraint, then immediately
  discern whether the thought reflects true reality or mere mental fluctuation.
