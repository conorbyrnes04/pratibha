pratibha_layers:
- kind: original
  label: Original
  body: मैत्रियादिषु बलाः
- kind: iast
  label: IAST
  body: maitryādiṣu balāni
- kind: translation
  label: Pratibha Translation
  body: In the realm of benevolence and other virtues, there are forces (balāni).
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this brief aphorism is that the very same energies that animate the world—what
    the sūtra calls ‘balāni’—are divided into two categories: those that act swiftly and those that act
    slowly. This duality is not merely a phenomenological observation; it is a metaphysical hinge on which
    the Yoga school rests its understanding of causation and liberation. By recognizing that the same
    force can manifest in two temporal modes, the practitioner learns that the same underlying principle
    can produce both immediate results (quickly manifesting) and delayed outcomes (slowly manifesting).
    This insight is crucial for the yogic practice of *saṁyama* (discipline), which requires the practitioner
    to regulate attention and action in accordance with the nature of the force at play. The commentary
    of Satchidananda, which speaks of obtaining knowledge of the time of death through disciplined observation
    of karmic portents, echoes this duality: the quick and slow forces together inform the yogi’s predictive
    insight. In the broader Sāṃkhya-Yoga synthesis, *balāni* are the dynamic forces that propel the *prakṛti*
    (primordial matter) toward its eventual dissolution, while the *puruṣa* (consciousness) remains the
    silent witness. The existential application is clear: by discerning the temporal character of one’s
    own actions, a yogi can align them with the ultimate goal of *samādhi* (union), thereby transcending
    the cycle of *karmas* that bind the soul. The aphorism invites the practitioner to observe the dual
    nature of all phenomena, to cultivate *saṁyama*, and thereby to gain the knowledge that is “not withheld”
    (ariṣṭebhyo).


    Key Terms


    **maitryādiṣu (मैत्रियादिषु)** — maitrī (friendship, benevolence) + -ādi (and others) → the sphere
    of benevolent and related virtues; in this context, the domain where forces act


    **balāni (बलाः)** — balā (force, power) → plural; in Yoga, the dynamic energies of prakṛti that manifest
    as action; the sūtra’s focus on their dual temporal modes


    Cross-Tradition Resonances


    **Yoga Sūtra 3.23:** Explicit mention of dual temporal modes of forces, mirroring the later discussion
    of *karmas* in 3.27

    *Divergence:* Unlike 3.27, which names the forces as *karmas*, 3.23 uses the more abstract term *balāni*,
    thereby broadening the scope beyond intentional action


    **Yoga Sūtra 3.27:** Classification of *karmas* into quick and slow, paralleling the duality in 3.23

    *Divergence:* 3.27 specifies *karmas* as intentional actions, whereas 3.23 refers to all forces, including
    unintentional and natural phenomena'
