sanskrit_devanagari: मैत्रियादिषु बलाः
sanskrit_iast: maitryādiṣu balāni
translation_literal: In friendliness and the rest, there are strengths.
commentary: 'This sūtra (II.33) identifies a practical principle within Patañjali''s ethical framework:
  the cultivation of four cardinal attitudes—maitri (friendliness), karuṇā (compassion), muditā (sympathetic
  joy), and upekṣā (equanimity)—generates real psychological and spiritual power. The word balāni (strengths)
  does not mean abstract virtue but concrete capacities: the mind becomes resilient, stable, and capable
  of sustained attention when rooted in these attitudes. In the Yoga–Sāṃkhya system, these are not sentimental
  emotions but precise mental disciplines that neutralize the reactive patterns (kleśas) that bind consciousness
  to suffering. When a practitioner genuinely cultivates friendliness toward the happy, compassion toward
  the suffering, joy toward the virtuous, and equanimity toward the harmful, the mind ceases its habitual
  oscillation between attraction and aversion. This cessation itself is a form of strength—a gathering
  of scattered mental force into coherence. The sūtra teaches that ethical cultivation is not ornamental
  but foundational to yogic power (siddhis) and liberation. Without this grounding, any technique becomes
  merely mechanical.


  Key Terms


  **maitri** — Friendliness or benevolence; the attitude of wishing well toward all beings.

  **balāni** — Strengths or powers; real capacities of mind and spirit, not merely abstract virtues.

  **upekṣā** — Equanimity; the even-minded attitude toward all circumstances, neither clinging nor rejecting.'
insight: 'The central claim of this brief aphorism is that the very same energies that animate the world—what
  the sūtra calls ‘balāni’—are divided into two categories: those that act swiftly and those that act'
practice: 'The moment you feel yourself pulled toward or away from someone today—whether attraction or
  aversion—pause and whisper aloud the attitude that opposes that pull: ''friendliness'' toward the one
  you''re drawn to reject, ''equanimity'' toward the one you cling to, ''compassion'' toward indifference,
  ''joy'' toward envy. Repeat the single word until you feel the mind''s oscillation settle into the strength
  beneath it.'
