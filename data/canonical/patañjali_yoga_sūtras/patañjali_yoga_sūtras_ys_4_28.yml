unit_label: Removal of Old Impressions
title: Removal of Old Impressions
unit_type: sutra
sanskrit_devanagari: हाणम् एषां क्लेशवत् उक्तम्
sanskrit_iast: hānam eṣāṃ kleśavad uktam
translation_literal: The removal of these is described in the same way as the removal of afflictions.
commentary: 'This sūtra appears in the context of addressing vāsanā—the deep grooves or subliminal impressions
  left by past actions and mental patterns. Patañjali has just outlined how afflictions (kleśa: ignorance,
  egoism, attachment, aversion, fear of death) are dissolved through discriminative insight and practice.
  Here he teaches that old impressions—the residual traces that persist even after afflictions are intellectually
  understood—follow the same removal process.


  The parallel is instructive: just as kleśa are not eradicated by mere intellectual knowledge but require
  sustained practice (abhyāsa) and non-attachment (vairāgya), so too vāsanā cannot be swept away by willpower
  alone. They thin and fade through the same patient, repeated cultivation of clarity and the gradual
  weakening of identification with mental content. The sūtra implies that the method is not different—what
  works for the root works for the residue.


  This is a reassurance embedded in method: the yogi need not learn a separate technique for ''old patterns.''
  The same steady discrimination, the same return to the witness-consciousness (sākṣī), the same non-reactivity
  that dissolves the afflictions themselves will gradually exhaust the impressions they have left behind.
  Time, repetition, and the refusal to feed them with fresh identification are the agents of their dissolution.


  Key Terms


  **vāsanā** — Subliminal impression, latent tendency, or groove in consciousness left by past actions
  and mental patterns; the residual traces that persist after afflictions are addressed

  **kleśa** — Affliction or cause of suffering—the five root obstacles: ignorance (avidyā), egoism (asmitā),
  attachment (rāga), aversion (dveṣa), and fear of death (abhiniveśa)

  **viveka** — Discriminative discernment or insight; the faculty of distinguishing the eternal Self from
  the changing mental field'
insight: The passage asserts that the practitioner can actively eliminate the lingering afflictions that
  cling to the mind.
practice: 'For one week, choose a single recurring mental pattern or emotional habit you notice in yourself—perhaps
  self-doubt before speaking, irritation at interruption, or the urge to check your phone when bored.
  Each time you notice it arising, pause and observe it without judgment or resistance. Simply note: ''This
  impression is present now. I am aware of it. I do not have to act on it.'' Do not try to force it away;
  instead, return your attention to your breath or to neutral sensation in your body. The pattern will
  likely repeat many times. Each time you witness it without identification, you are applying the same
  discriminative awareness (viveka) that dissolves afflictions. Over days, notice whether the pattern''s
  grip loosens or its frequency shifts. This is the gradual thinning of vāsanā through the method Patañjali
  describes.'
