- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that the practitioner can actively eliminate the lingering afflictions that
    cling to the mind. It is not merely a passive dissolution but an intentional act of *hānam*—the deliberate
    relinquishing of the very *eṣāṃ* that have become habitual disturbances. This move is contested in
    the debate between the *pratyakṣa* and *parokṣa* interpretations of the *sādhana* of *kaivalya*: does
    the removal arise from the inner will of the *puruṣa* or from the external guidance of *īśvara*? The
    Yoga and Sāṃkhya schools converge in recognizing that the *vṛtti* of the mind, once freed from *kleśa*,
    allows the *citta* to rest in its true nature. The existential implication is profound: by consciously
    *hānam* these impressions, one does not merely avoid suffering but actively cultivates the state of
    *kaivalya*—the isolation of the *puruṣa* from the material world. The Satchidananda commentary’s emphasis
    on the removal “as in the case of the obstacles” underscores the practical strategy of treating afflictions
    as obstacles to be cleared, thereby aligning the metaphysical goal with a concrete method of practice.


    Key Terms


    **hānam (हाणम्)** — etymology: ‘to strike, to cut’ -> tradition meaning: deliberate removal or relinquishment
    of mental impressions -> default translation ‘removal’ misses the active, intentional aspect


    **eṣāṃ (एषां)** — etymology: ‘these’ -> tradition meaning: refers to the specific old impressions
    or afflictions that have become habitual -> default translation ‘these’ lacks the nuance of ‘old’
    or ‘imprinted’ impressions


    **kleśavad (क्लेशवत्)** — etymology: ‘like afflictions’ -> tradition meaning: equating the old impressions
    with the afflictions that disturb the mind -> default translation ‘as obstacles’ omits the equivalence
    to *kleśa*


    **uktam (उक्तम्)** — etymology: ‘said, described’ -> tradition meaning: indicates that these impressions
    have been previously discussed or identified as obstacles -> default translation ‘described’ may miss
    the sense of prior exposition


    Cross-Tradition Resonances


    **Yoga Sūtra 1.1:** Both verses emphasize the removal of *kleśa* as the path to liberation; YS 4.28
    mirrors the structure of 1.1 by pairing a verb of removal with a noun of afflictions.

    *Divergence:* While 1.1 speaks of *citta*’s purification in general, 4.28 specifically addresses the
    *eṣāṃ*—the old impressions—highlighting a more concrete target for practice


    **Sāṃkhya Kārikā 2.4:** The Sāṃkhya text describes the *purusha*’s liberation through the separation
    from *prakṛti*’s afflictions, structurally similar to YS 4.28’s focus on removing *kleśa*.

    *Divergence:* Sāṃkhya presents the separation as a passive dissolution of *prakṛti*, whereas YS 4.28
    frames it as an active *hānam* performed by the practitioner'
