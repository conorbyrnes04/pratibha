- kind: practice
  label: Practice (Abhyasa)
  body: Observe an object without attaching it to your mind’s name or image; notice its presence even when you are not consciously
    thinking about it.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: Nor does an object’s existence depend upon a single mind, for if it did, what would become of that object when that
    mind did not perceive it?
