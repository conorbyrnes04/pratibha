    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Object’s Existence Independent of
      Mind”: in Sāṃkhya it is the conscious principle, but here its role is limited to perception, not creation of reality
      -> not ‘brain software’ or an enemy to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: pramāṇa (प्रमाण)
    definition: 'pra-√mā ‘measure accurately’ → valid means of knowing -> in “Object’s Existence Independent of Mind”: load-bearing
      in “”; stakes the argument of: An object’s existence is not dependent on a single mind; if it were, what would become
      of that object when that mind … -> not ‘proof’ in courtroom sense alone; perception, inference, testimony as vṛtti-types'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Object’s Existence Independent of Mind”: the passage
      underscores its autonomous existence independent of puruṣa -> not pastoral ‘Nature’; the tri-guṇa matrix generating
      all experience including mind'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Object’s Existence Independent of Mind”: the
      sūtra reminds that purusha’s perception does not constitute reality -> not ‘person’ as social self; the unchanging witness
      distinct from prakṛti’s display'
  - term: vastu
    definition: 'source-term vastu -> in “Object’s Existence Independent of Mind”: the external or internal phenomenon perceived
      -> default English flattens the technical work this term does here'
