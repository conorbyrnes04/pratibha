unit_label: Object’s Existence Independent of Mind
title: Object’s Existence Independent of Mind
unit_type: sutra
sanskrit_devanagari: न चैकचित्ततन्त्रं चेद् वस्तु तदप्रमाणकम् तदाऽ किम् स्यात्
sanskrit_iast: na caikacittatantraṃ ced vastu tadapramāṇakaṃ tadā kiṃ syāt
translation_literal: If an object were dependent on a single mind alone, and that object lacked measure
  or verification, then what would it be?
commentary: 'This sūtra addresses a fundamental epistemological problem within Yoga-Sāṃkhya metaphysics:
  the relationship between consciousness (citta), the objects it perceives, and the nature of reality
  itself. The verse poses a logical challenge to subjective idealism—the notion that objects exist only
  as mental constructs of one individual mind.


  The sūtra''s force lies in its reductio ad absurdum. If objects were truly tantra (dependent, bound
  to) a single citta (mind-field), they would become apramāṇaka—without measure, without pramāṇa (valid
  means of knowledge). An object that cannot be verified, measured, or known through any consistent means
  of cognition would be indistinguishable from non-existence. The rhetorical question ''what would it
  be?'' (kiṃ syāt) underscores the logical impossibility: such a thing would be nothing at all.


  This reasoning supports the Yoga-Sāṃkhya position that objects possess a reality independent of any
  single observer''s mental state. The external world (prakṛti) exists as an objective field of manifestation,
  knowable through multiple minds and through the pramāṇas (perception, inference, testimony). Individual
  minds (cittāni) are temporary modifications of prakṛti, not its creators or sole arbiters.


  The practical implication for a yogi is profound: liberation does not require denying the world or treating
  it as illusory. Rather, one recognizes that one''s personal mental fluctuations do not define reality.
  This frees the practitioner from solipsistic confusion and grounds discriminative knowledge (viveka)
  in what is actually verifiable and shared.


  Key Terms


  **citta** — The mind-field; the totality of mental modifications and impressions; the instrument of
  individual consciousness

  **vastu** — Object; thing; that which exists; the external or internal phenomenon perceived

  **pramāṇa** — Valid means of knowledge; measure; verification; the instruments by which truth is established
  (perception, inference, testimony)'
insight: The passage asserts that reality is not contingent upon a single consciousness.
practice: 'Sit quietly for 10 minutes. Choose an ordinary object—a cup, a stone, a leaf. Observe it without
  judgment. Then ask yourself: ''Does this object depend on my mind alone for its existence?'' Notice
  what happens when you close your eyes—the object remains. Imagine a hundred other people observing this
  same object; they would describe similar properties. Now observe your own mental reactions to the object—they
  change moment to moment, yet the object''s basic nature persists. This simple inquiry trains viveka
  (discrimination): the ability to distinguish between the mind''s fluctuations (cittavṛtti) and the stable
  reality of objects themselves. Return to this practice whenever you catch yourself in doubt about what
  is real versus what is merely your interpretation.'
