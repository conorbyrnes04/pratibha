sanskrit_devanagari: प्रत्ययस्य परचित्तज्ञानम्
sanskrit_iast: pratyayasya paracittajñānam
translation_literal: Knowledge of another's mind arises from the mental impression itself.
commentary: 'This sūtra appears in the context of siddhis (extraordinary capacities) that emerge from samādhi. Patañjali is
  describing a specific mechanism: when a yogi''s mind becomes sufficiently refined and unified through practice, the mental
  impression (pratyaya) of another person''s consciousness becomes transparent to direct perception. This is not telepathy
  in the modern sense, but rather a consequence of the yogi''s own mind becoming so subtle and unobstructed that it can directly
  apprehend the mental content (citta) of another without the usual barriers of separation.


  The sūtra rests on the Yoga–Sāṃkhya understanding that consciousness (puruṣa) is fundamentally one, and that the apparent
  separation between minds is an effect of material conditioning (prakṛti) and mental obscuration. When those obscurations
  are removed through yoga, direct knowing of another''s mental state becomes possible—not through inference or intuition,
  but through the same mechanism by which one knows one''s own mind: direct apprehension of the mental impression itself.


  This is not presented as a goal of practice, but as a natural byproduct of deep samādhi. Patañjali''s tone is descriptive
  and matter-of-fact: this capacity simply unfolds when the conditions are met. The sūtra assumes that the yogi has already
  achieved the stability of mind (samādhi) described in earlier chapters, and is now exploring what becomes possible when
  that stability is sustained.


  Key Terms


  **pratyaya** — Mental impression, idea, or content of consciousness; the object or modification of mind

  **paracittajñānam** — Direct knowledge of another''s mind or consciousness

  **samādhi** — Unified, absorbed state of mind; the culmination of yoga practice in which subject and object merge'
insight: The sūtra asserts that the mind’s knowledge of another’s mental images is possible, establishing an epistemic bridge
  between self and other.
practice: During a conversation with someone today, pause mid-exchange and notice the exact moment when you shift from hearing
  their words to sensing the quality of their attention—the texture of what they're actually present to. Hold that recognition
  without naming it, letting your own mental chatter settle into stillness. Return to speaking only after that inner quieting
  completes.
