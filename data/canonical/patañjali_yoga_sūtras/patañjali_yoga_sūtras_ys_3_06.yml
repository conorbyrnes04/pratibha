sanskrit_devanagari: तस्य भूमिषु विनियोगः
sanskrit_iast: tasya bhūmiṣu viniyogaḥ
translation_literal: Its application unfolds across distinct stages.
commentary: 'This sūtra appears in the context of samyama—the unified binding of dhāraṇā (concentration),
  dhyāna (meditation), and samādhi (absorption)—and addresses a crucial practical reality: samyama does
  not operate uniformly at all levels of practice. The word bhūmiṣu (in the grounds, territories, or stages)
  refers to the progressive levels of yogic attainment, often mapped as the eight limbs or the ascending
  states of consciousness. Viniyogaḥ means deployment, application, or practical engagement—how the tool
  actually works.


  Patañjali is asserting that samyama''s efficacy, scope, and character shift as the practitioner advances.
  At early stages, samyama applied to gross objects (a flame, the breath, a mantra) yields preliminary
  steadiness and insight. At intermediate stages, it penetrates subtler domains—the sense organs, the
  mind-stuff itself, the relationship between observer and observed. At advanced stages, samyama reaches
  the threshold of prakṛti (nature) itself and the distinction between puruṣa (witness-consciousness)
  and all that is witnessed.


  This is not a flaw in the method but its design. The Yoga Sūtras assume that consciousness unfolds in
  layers, and samyama must be calibrated to each layer. A beginner forcing samyama toward the transcendent
  without mastering it on the sensory and mental planes will meet only frustration. Conversely, remaining
  fixated on gross applications indefinitely arrests development.


  The verse also carries a warning against dogmatism: there is no single correct application of samyama.
  The yogin must recognize which bhūmi (stage) they inhabit and deploy the practice accordingly. This
  requires honest self-assessment and a teacher''s guidance.


  Key Terms


  **bhūmi** — Stage, ground, or level of yogic attainment; the progressive territories of consciousness
  through which practice unfolds.

  **samyama** — The unified binding of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi);
  the integrated tool of inner transformation.

  **viniyoga** — Deployment, application, or practical engagement; the manner in which a method is brought
  to bear on its object.'
insight: The sūtra asserts that Samyama is not a monolithic act but a graduated process, a claim that
  situates the practice within the broader Yoga and Sāṃkhya framework where knowledge unfolds through
  success
practice: 'Select a simple object of samyama appropriate to your current capacity—the natural breath,
  a candle flame, or a single word (like ''so-hum''). Over 10–15 minutes, practice the three-fold binding:
  (1) dhāraṇā—hold your attention on the object without interruption; (2) dhyāna—allow the attention to
  flow continuously, unbroken, without effort or strain; (3) samādhi—notice the moment when the boundary
  between observer and observed softens, when you are no longer ''doing'' but simply aware. Do not force
  the third stage; it arrives when the first two are stable. After practice, reflect: Did you notice resistance,
  drift, or deepening? This honest feedback reveals your current bhūmi. Over weeks, as stability grows,
  you may gradually introduce subtler objects—internal sensations, the space between thoughts, the sense
  of ''I-ness'' itself. Let the practice itself show you when to advance.'
