- kind: original
  label: Original
  body: ततः पुनः शान्तोदितौ तुल्यप्रत्यायौ चित्तस्यैकाग्रतापरिनामः
- kind: iast
  label: IAST
  body: tataḥ punaḥ śāntoditau tulyapratyayau cittasyaikāgratāpariṇāmaḥ
- kind: translation
  label: Pratibha Translation
  body: 'Then again the repressed and the revived are equally present in consciousness: the condition of the mind is transformed
    into unity.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that at the moment of samādhi the mind’s content collapses into a single, undifferentiated awareness,
    where the only discernible states are the repressed and the revived. This is a decisive claim about the nature of consciousness
    in the highest yogic state: it is not a passive stillness but an active re‑configuration of the mind’s contents. The move
    is contested because some commentators read it as a mere description of the mind’s emptiness, while others interpret it
    as an ontological statement that the mind itself becomes one with the re‑pressed and revived impressions. Within the Yoga
    and Sāṃkhya framework, the mind (citta) is ordinarily a field of vṛtti (mental modifications) that oscillate between states
    of retraction (śānti) and activation (odita). Here, however, the vṛtti cease to be distinct; they are subsumed into a
    single, unified state. The Dvivedi commentary’s notion of “avasthāparināma” (transformation of condition) aligns with
    this reading: the mind’s condition is transformed, not merely suppressed. The existential implication is profound: liberation
    is not achieved by annihilating the mind but by allowing it to dissolve into a single awareness that simultaneously contains
    all its former impressions. This unity is the very essence of samādhi, the yogic goal of realizing the self (puruṣa) beyond
    the dualities of prakṛti.


    Key Terms


    **citta (चित्त)** — citta (IAST) -> चित्त (Devanagari) -> mind, the organ of perception and cognition; default translation
    ‘mind’ omits its role as the dynamic field of vṛtti in Yoga philosophy.


    **vṛtti (वृत्ति)** — vṛtti (IAST) -> वृत्ति (Devanagari) -> mental modifications, fluctuations of citta; tradition sees
    them as the source of ignorance, not merely thoughts.


    **samādhi (समाधि)** — samādhi (IAST) -> समाधि (Devanagari) -> a state of absorption; tradition distinguishes between various
    samādhi types, here the one where vṛtti collapse.


    **puruṣa (पुरुष)** — puruṣa (IAST) -> पुरुष (Devanagari) -> the pure consciousness, the subject; tradition contrasts it
    with prakṛti, the object.


    Cross-Tradition Resonances


    **Yoga Sūtra 3.12:** The structure mirrors 3.11, where the mind’s content is described as a single entity; both use the
    pattern ‘tataḥ … tulyapratyayau …’ to emphasize equivalence.

    *Divergence:* While 3.11 speaks of the mind’s content becoming one, 3.12 specifies that the content is the repressed and
    revived, thus narrowing the scope to specific vṛtti.


    **Bhaṭṭa 3.12.1:** Both texts employ the idea that the mind’s state at samādhi is a transformation (parināma) of its condition.

    *Divergence:* Bhaṭṭa adds a causal explanation involving the ‘first transformation’ becoming ripe, whereas the YS merely
    states the outcome, leaving the process implicit.


    **Kṛṣṇasūtra 3.12:** Both use the term ‘tulyapratyayau’ to denote equivalence of states within consciousness.

    *Divergence:* Kṛṣṇasūtra interprets the equivalence as a metaphysical identity, while the YS treats it phenomenologically.'
