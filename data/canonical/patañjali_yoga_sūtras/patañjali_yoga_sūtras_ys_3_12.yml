      not random change; structured transformation of dharma/lakṣaṇa/avasthā that saṃyama can know'
  - term: pratyaya (प्रत्यय)
    definition: 'prati-√i ‘go toward’ → cognitive content/presentation -> in “Consciousness of Repression and Revival”: Then
