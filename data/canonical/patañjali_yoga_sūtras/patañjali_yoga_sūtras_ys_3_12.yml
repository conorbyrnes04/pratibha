sanskrit_devanagari: ततः पुनः शान्तोदितौ तुल्यप्रत्यायौ चित्तस्यैकाग्रतापरिनामः
sanskrit_iast: tataḥ punaḥ śāntoditau tulyapratyayau cittasyaikāgratāpariṇāmaḥ
translation_literal: 'From that, again: when the subsiding and arising of mental content are equally balanced, the transformation
  of consciousness into one-pointed focus occurs.'
commentary: 'This sūtra describes a critical threshold in meditation practice—the moment when the mind''s natural oscillation
  between activity and rest becomes symmetrical enough that consciousness undergoes a qualitative shift into ekāgratā (one-pointed
  stability).


  The phrase śāntoditau tulyapratyayau is the hinge: śānta (subsiding, calming) and udita (arising, emerging) represent the
  two poles of mental flux. When these two movements carry equal weight—neither suppressed nor amplified—something shifts.
  This is not forced concentration but a natural consequence of balanced observation.


  Within the Yoga–Sāṃkhya framework, this marks the transition from preliminary practice (pratyāhāra, sense withdrawal) into
  genuine dhāraṇā (sustained attention). The cittasyaikāgratāpariṇāmaḥ (transformation of consciousness into singular focus)
  is not a new faculty appearing but rather the natural settling that occurs when the mind''s restlessness is no longer fed
  by either grasping or aversion.


  The word pariṇāmaḥ (transformation, metamorphosis) is crucial: this is not suppression or control but an organic shift in
  the texture of consciousness itself. The mind does not become rigid; it becomes coherent. This is why Patañjali emphasizes
  balance—tulyapratyayau—rather than force. When both the wave-like rising and falling of thought are met with equal, non-preferential
  awareness, the underlying current becomes visible.


  This sūtra speaks to practitioners who have already begun observing their mind and now encounter the paradox: the more evenly
  you regard both activity and quietude, the less you need to ''do'' anything. The mind naturally consolidates.


  Key Terms


  **śāntoditau** — subsiding and arising; the two poles of mental fluctuation (calming and emergence)

  **tulyapratyayau** — equally balanced mental content or awareness; non-preferential observation of both states

  **ekāgratāpariṇāmaḥ** — transformation of consciousness into one-pointed focus; the organic shift from scattered to unified
  attention'
insight: The passage asserts that at the moment of samādhi the mind’s content collapses into a single, undifferentiated awareness,
  where the only discernible states are the repressed and the revived.
practice: Watch the pause between your exhale and inhale—the exact moment when subsiding becomes arising. Do not lengthen
  it, do not rush past it. Return to this threshold ten times today, in ordinary moments (waiting, walking, listening), until
  the two movements feel like equal partners rather than opposites.
