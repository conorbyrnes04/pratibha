unit_label: Successive Phases as Cause
title: Successive Phases as Cause
unit_type: sutra
sanskrit_devanagari: क्रमाण्यत्वं परिनामाण्यत्वे कारणः
sanskrit_iast: kramānyatvaṃ pariṇāmānyatve hetuḥ
translation_literal: The succession of different phases is the cause of their successive transformations.
commentary: 'The statement that the succession of phases itself is the cause of their transformations foregrounds a dynamic,
  processual ontology: causality is not a static, one‑to‑one mapping but a temporal unfolding. In the Yoga and Sāṃkhya traditions,
  this resonates with the idea that *kramā* (sequence) is a fundamental principle of reality, as seen in the Sāṃkhya triad
  of *prakṛti*, *puruṣa*, and *kṛti*. Here, the *kramā* of evolutionary stages (*anyatva*) is not merely descriptive but generative;
  it is the *hetu* that propels *parināma* (transformation). This mirrors the Yogic notion that *samādhi* is attained through
  a progressive alignment of *citta* and *vṛtti*, each stage conditioning the next. The commentary invites an existential
  application: by recognizing that our own mental states evolve in succession, we can consciously direct the causal chain
  toward higher states of consciousness. The Satchidananda aphorism underscores that the differences in stages are themselves
  the engine of change, a subtle reminder that variation is not a hindrance but the very mechanism of evolution. Thus, the
  sutra teaches that awareness of the *kramā* enables us to become active agents in our own transformation.


  Key Terms


  **kramā (क्रम)** — kramā (क्रम) -> ''sequence, succession'' in Sāṃkhya; in Yoga, the ordered unfolding of states; the sutra
  treats it as causal


  **anyatva (अन्यत्व)** — anyatva (अन्यत्व) -> ''difference, otherness''; in Sāṃkhya, the diversity of prakṛti; here, the
  distinct phases that generate change


  **parināma (परिनामा)** — parināma (परिनामा) -> ''transformation, evolution''; in Yoga, the development of consciousness;
  the sutra links it to the causal succession


  **hetu (हेतु)** — hetu (हेतु) -> ''cause''; in Sāṃkhya, the principle of causation; here, the succession itself is the cause


  Cross-Tradition Resonances


  **Yoga Sūtra 3.15:** Explicit claim that kramā (sequence) is the cause of parināma (transformation)

  *Divergence:* Unlike Sāṃkhya''s triadic causality where *kṛti* is the agent, here the process itself is the agent


  **Bhaṭṭārāyaṇa, Yogaśāstra, 3.15:** Parallels the idea that evolution is self‑causal

  *Divergence:* Bhaṭṭārāyaṇa emphasizes *purusha* as the observer, whereas the sutra abstracts to the process


  **Mādhava, Yogaśāstra, 3.16:** Extends the causal chain to the final *samādhi*

  *Divergence:* Mādhava introduces *samādhi* as the endpoint, whereas 3.15 stops at the generative process


  **Sāṃkhya Kārikā 2.3:** Describes *anyatva* as the variety in prakṛti

  *Divergence:* The Kārikā treats *anyatva* as a static property, not a causal mechanism'
insight: 'The statement that the succession of phases itself is the cause of their transformations foregrounds a dynamic,
  processual ontology: causality is not a static, one‑to‑one mapping but a temporal unfold'
practice: Observe each mental phase as it arises, noting how its distinct qualities give rise to the next; consciously let
  the succession flow toward a calmer, more unified state.
