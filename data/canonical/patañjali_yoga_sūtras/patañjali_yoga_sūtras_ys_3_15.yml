title: Successive Phases as Cause
unit_type: sutra
sanskrit_devanagari: क्रमाण्यत्वं परिनामाण्यत्वे कारणः
sanskrit_iast: kramānyatvaṃ pariṇāmānyatve hetuḥ
translation_literal: The succession of distinct phases is the cause of the succession of distinct transformations.
commentary: 'This sūtra appears in the context of Patañjali''s analysis of how change (pariṇāma) occurs
  in nature and mind. The verse establishes a causal principle: transformation does not happen randomly
  or all at once, but unfolds through an ordered sequence of stages (krama). Each phase must complete
  before the next emerges—this is the mechanism of becoming itself.


  In the Yoga–Sāṃkhya framework, prakṛti (nature, matter) evolves through successive modifications. The
  guṇas (qualities) shift their proportions in a lawful, step-by-step manner. Similarly, in the yogi''s
  practice, mental transformation (cittavṛtti-pariṇāma) occurs through distinct, sequential stages: first
  distraction, then fixation, then clarity, then absorption. One cannot skip stages. This principle also
  governs the unfolding of siddhis (powers)—they emerge in their proper order as obstacles dissolve.


  The practical implication is profound: the yogi learns to recognize and honor the natural rhythm of
  change. Forcing transformation or expecting instant results violates this law of succession. Progress
  is measured not by dramatic leaps but by the steady completion of each phase. This teaches patience,
  discernment of where one actually stands in the sequence, and trust in the organic unfolding of practice.


  Key Terms


  **krama** — succession, sequence, ordered progression; the step-by-step unfolding of change in time

  **pariṇāma** — transformation, modification, the actual change or evolution of a substance or state

  **anyatva** — otherness, distinctness, the quality of being different or separate; here, the discrete
  nature of successive phases'
insight: 'The statement that the succession of phases itself is the cause of their transformations foregrounds
  a dynamic, processual ontology: causality is not a static, one‑to‑one mapping but a temporal unfold'
practice: 'For one week, choose a single daily habit you wish to transform—perhaps how you begin your
  morning, how you sit in meditation, or how you respond to frustration. Map out the distinct phases this
  change requires: (1) awareness of the current pattern, (2) intention to shift, (3) initial awkward attempts,
  (4) gradual ease, (5) stable new pattern. Each day, notice which phase you are in without judgment.
  Do not skip ahead mentally; instead, fully inhabit the current stage. At day''s end, journal one observation
  about what that phase required. This trains direct perception of how transformation actually moves through
  time, aligning your expectation with the law of successive phases.'
