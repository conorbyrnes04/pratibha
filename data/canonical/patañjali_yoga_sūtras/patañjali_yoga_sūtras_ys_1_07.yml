sanskrit_devanagari: प्रत्यक्षानुमानागमाः प्रमाणानि
sanskrit_iast: pratyakṣānumānāgamāḥ pramāṇāni
translation_literal: Direct perception, inference, and testimony are the means of valid knowledge.
commentary: 'This sūtra (I.7) establishes the three foundational instruments by which a yogi—or any seeker—can
  reliably know reality. Patañjali is not dismissing reason or study; he is grounding yoga in epistemology.


  Pratyakṣa (direct perception) is immediate sensory contact with an object. In yoga practice, this includes
  the direct experience of breath, sensation, and mental states as they arise—not filtered through conceptual
  overlay. When you feel the coolness of inhalation or the weight of the body in seated posture, that
  is pratyakṣa.


  Anumāna (inference) is logical reasoning from observed premises. If you notice that your mind becomes
  scattered after eating heavy food, you infer a causal link. Yoga texts themselves rely on inference:
  "Since the mind is subject to disturbance, there must be a means to stabilize it."


  Āgama (testimony) is reliable transmission of knowledge from trustworthy sources—the Vedas, the guru''s
  direct instruction, the accumulated wisdom of the lineage. A student cannot rediscover all yoga through
  personal experiment alone; they rely on the tested teachings of those who have walked the path.


  Within the Sāṃkhya framework underlying yoga, these three pramāṇas (means of valid knowledge) are how
  consciousness (puruṣa) can distinguish itself from the fluctuations of nature (prakṛti). Without reliable
  instruments of knowing, discrimination remains clouded.


  For a modern practitioner, this sūtra validates both direct somatic awareness and intellectual study.
  It also warns against blind belief: āgama must be tested against direct experience and reason, not accepted
  uncritically.


  Key Terms


  **pratyakṣa** — Direct perception; immediate sensory encounter with an object, unmediated by inference
  or memory.

  **anumāna** — Inference; logical deduction from observed premises, yielding knowledge of what is not
  directly perceived.

  **āgama** — Testimony; reliable transmission of knowledge from authoritative sources, texts, and teachers.'
insight: 'The Yoga Sutra asserts that only three pramāṇas are legitimate: pratyakṣa (direct perception),
  anumāna (inference), and śabda (testimony).'
practice: 'Today, practice the three pramāṇas in a single sitting session:


  1. **Pratyakṣa (10 minutes):** Sit quietly and attend only to direct sensation—breath, heartbeat, temperature,
  texture of cloth on skin. Name nothing; simply receive what is present. Notice how thought tries to
  interpret; gently return to bare sensation.


  2. **Anumāna (5 minutes):** Observe a pattern in your practice. For example: "When I breathe slowly,
  my shoulders relax. When I tense my jaw, my breath becomes shallow." Write down one cause-and-effect
  link you infer from your own experience.


  3. **Āgama (5 minutes):** Return to a single line from a yoga text you trust—perhaps "The mind becomes
  steady through practice and non-attachment" (I.12-13). Sit with it. Let it illuminate what you have
  just observed directly and reasoned about. Notice how teaching and experience converge.'
