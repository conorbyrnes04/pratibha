sanskrit_devanagari: प्रत्यक्षानुमानागमाः प्रमाणानि
sanskrit_iast: pratyakṣānumānāgamāḥ pramāṇāni
translation_literal: Direct cognition, inference, and testimony are the three valid means of knowledge.
commentary: 'The Yoga Sutra asserts that only three pramāṇas are legitimate: pratyakṣa (direct perception), anumāna (inference),
  and śabda (testimony). This triad is not merely a list but a claim that all cognition, even the most abstract, ultimately
  reduces to one of these modes. The sutra’s brevity masks a profound ontological stance: the world is apprehended through
  the interplay of sense, reason, and language, each of which is a manifestation of the mind’s activity. The contested move
  here is the exclusion of other Nyāya pramāṇas such as upamāṇa (analogy) and arthapatti (postulation). By limiting the sources,
  the Yoga tradition elevates the primacy of direct experience and authoritative testimony, thereby aligning with the Sankhya
  view that the mind (citta) is the locus of all cognition. Practically, this means that one must cultivate a disciplined
  sensory awareness, develop logical inference skills, and critically evaluate the reliability of verbal information. The
  Dvivedi commentary’s mention of Veda as the highest śabda underscores the Yoga emphasis on internalizing sacred knowledge
  as a means to transcend ordinary perception. Thus, the sutra invites practitioners to recognize that every insight—whether
  a fleeting sensory impression or a profound doctrinal truth—originates from one of these three pramāṇas, and that mastery
  over them is the path to samādhi.


  Key Terms


  **pratyakṣa (प्रत्यक्ष)** — direct perception -> immediate sensory contact -> foundational for all subsequent cognition


  **anumāna (अनुमान)** — inference -> logical deduction from known relations -> bridges sensory data and abstract concepts


  **śabda (शब्द)** — testimony -> reliable verbal transmission -> especially the Veda as supreme source


  Cross-Tradition Resonances


  **Nyāya Sūtras, 1.1:** Both Nyāya and Yoga enumerate pratyakṣa, anumāna, śabda as pramāṇas, showing structural homology
  in the triadic schema

  *Divergence:* Nyāya includes upamāṇa, whereas Yoga omits it, reflecting a stricter epistemological boundary


  **Mīmāṃsā Prakāśa, 2.3:** Mīmāṃsā’s addition of arthapatti parallels Yoga’s inclusion of śabda as a means of knowledge

  *Divergence:* Mīmāṃsā treats arthapatti as a distinct pramāṇa, whereas Yoga subsumes it within śabda, indicating a different
  ontological prioritization


  **Vedānta Śāstra, 5.2:** Vedānta’s identification of Veda as the highest śabda echoes Yoga’s elevation of śabda

  *Divergence:* Vedānta allows for non-vedic śabda in certain contexts, whereas Yoga restricts śabda to Vedic testimony'
insight: 'The Yoga Sutra asserts that only three pramāṇas are legitimate: pratyakṣa (direct perception), anumāna (inference),
  and śabda (testimony).'
practice: Observe your senses attentively, noting each direct perception as it arises, and consciously evaluate whether it
  is a true pratyakṣa, a logical inference, or a trustworthy testimony.
