sanskrit_devanagari: चितर् अप्रतिसंक्रमायास तदाकारापत्तौ स्वबुद्धिसंवेदनम्
sanskrit_iast: citer apratisaṃkramāyās tadākārāpattau svabuddhisaṃvedanam
translation_literal: When consciousness does not pass into the form of an object, yet that form is assumed,
  there is self-luminous awareness of one's own mind.
commentary: 'This sūtra addresses a subtle and critical distinction in the yogic phenomenology of perception.
  The verse describes a state in which the usual mechanism of consciousness—whereby the mind (buddhi)
  takes on the shape of perceived objects and thereby knows them—is interrupted or transcended, yet cognition
  continues.


  In ordinary perception, consciousness appears to migrate into the object''s form (pratisaṃkrama). The
  mind becomes the object; subject and object merge in representation. But Patañjali here describes an
  alternative mode: consciousness remains unmoved (apratisaṃkrama), does not flow into external form,
  yet the mind''s own nature—its inherent luminosity (svabuddhi)—becomes directly evident. This is self-knowing
  awareness, freed from the mediation of object-forms.


  This state represents a threshold between samādhi and sahaja—between absorbed meditation and the natural,
  unforced recognition of consciousness itself. The mind no longer needs to become something else to know
  itself. It recognizes its own light without projection or identification with form. This is the ground
  of viveka (discrimination) and the beginning of true vairāgya (non-attachment), because the mind no
  longer clings to the illusion that it must become objects to know them.


  Within the Yoga–Sāṃkhya framework, this describes the reversal of prakṛti''s usual movement (the inward
  turn of pravritti toward apavṛitti). Puruṣa—the unchanging witness—is no longer obscured by the mind''s
  compulsive shape-shifting. The buddhi recognizes itself as the instrument of consciousness rather than
  consciousness itself, and in that recognition, consciousness shines as its own evidence.


  Key Terms


  **cit** — consciousness; the unchanging witness-principle (puruṣa) that illuminates all experience

  **apratisaṃkrama** — non-migration; the state in which consciousness does not flow into or assume the
  form of objects

  **svabuddhisaṃvedana** — self-luminous awareness of one''s own mind; direct recognition of the mind''s
  intrinsic light without mediation by object-forms'
insight: This sutra makes a decisive claim that the Purusha’s consciousness is immutable and that self‑recognition
  is achieved when the mind‑stuff reflects that very consciousness.
practice: When you perceive something—a face, a sound, a thought—pause mid-recognition and withdraw your
  attention backward, as if pulling consciousness out of the object's shape itself. Hold that backward
  gaze for three breaths, feeling the mind's own light without any form filling it. Notice what remains
  aware when nothing is being perceived.
