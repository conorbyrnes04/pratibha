  body: Then the mind‑stuff inclines toward discrimination, gravitating toward the state of absolute independence.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this verse is that the mind, when properly directed, naturally seeks the highest form of discernment—kaivalya.
    This is not a mere intellectual exercise but a dynamic process where the subtle field of citta is drawn to the pure, unconditioned
    reality that is the object of true discrimination. The contested move here is the notion that the mind’s inclination is
    not passive but actively gravitating, implying a causal agency that Yoga and Sāṃkhya attribute to the interplay of puruṣa
    and prakṛti. In the Sāṃkhya framework, discrimination (viveka) is the faculty that separates puruṣa (consciousness) from
    prakṛti (matter). When this faculty is sharpened, the mind’s mass (bhāra) is pulled toward the light of kaivalya, the
    ultimate liberation where puruṣa is free from prakṛti’s influence. This mirrors the Satchidananda observation that the
    mind “gravitates toward Absoluteness.” The existential import is that practitioners need not merely observe but must actively
    cultivate discrimination, allowing the mind to shed the weight of ignorance and align with the unconditioned. The verse
    therefore serves as a call to intentional practice: to let the mind’s natural tendency toward discernment become the vehicle
    for attaining kaivalya, the state of absolute independence. By recognizing the mind’s inherent gravitation, one can harness
    it as a tool for liberation rather than a passive spectator.


    Key Terms


    **viveka (विवेक)** — viveka (विवेक) – from root vī (to see) + eka (one) – literally ‘seeing one’; in Sāṃkhya, the faculty
    that distinguishes puruṣa from prakṛti; the translation ‘discrimination’ captures the act but misses the subtlety of active
    discernment as a means of liberation.


    **kaivalya (काविल्य)** — kaivalya (काविल्य) – from ka (to be) + vī (to be separate) – literally ‘separation’; in Yoga,
    the state of absolute independence where puruṣa is free from prakṛti; the common translation ‘liberation’ understates
    the ontological independence it denotes.


    **cittam (चित्तम्)** — cittam (चित्तम्) – mind‑stuff or mental field; in Sāṃkhya, the dynamic aspect of consciousness
    that undergoes vṛtti; the term ‘mind’ often reduces its subtle, field-like nature.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 1.1:** Both verses posit the mind as the locus of activity that can be directed; 4.26 uses a gravitation
    metaphor whereas 1.1 uses a causative verb, showing structural homology in the subject–verb–object pattern.

    *Divergence:* While 1.1 presents the mind as a passive recipient of instruction, 4.26 emphasizes its active inclination,
    suggesting a shift from external teaching to internal agency.


    **Bhartrhari, Yogabindu 9:** The notion of the mind’s mass (bhāra) gravitating toward kaivalya parallels Bhartrhari’s
    use of ‘weight’ to describe the mind’s attachment to prakṛti.

    *Divergence:* Bhartrhari’s text frames the gravitation as a metaphoric burden, whereas 4.26 frames it as a purposeful
    pull toward liberation, highlighting a productive divergence in motivational framing.'
