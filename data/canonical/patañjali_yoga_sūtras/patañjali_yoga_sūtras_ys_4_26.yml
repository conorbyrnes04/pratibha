sanskrit_devanagari: तदाः विवेकनिम्नं काविल्यप्राग्भारं चित्तम्
sanskrit_iast: tadā vivekanimnaṃ kaivalyaprāgbhāraṃ cittam
translation_literal: Then the mind, inclined toward discernment, becomes weighted toward absolute aloneness.
commentary: 'This sūtra describes a critical threshold in meditation practice where the ordinary gravitational pull of the
  mind—its habitual descent into identification with objects, emotions, and mental constructs—reverses. The word *viveka*
  (discernment) refers to the yogic capacity to distinguish between the unchanging witness-consciousness (puruṣa) and the
  ever-changing field of mental phenomena (prakṛti). When this discernment becomes *nimna* (inclined, sloping downward), the
  mind''s weight naturally settles toward *kaivalya* (aloneness, absolute isolation of consciousness from all objectivity).


  The phrase *prāgbhāra* (weighted beforehand, or bearing weight forward) suggests that the mind now carries its momentum
  in a new direction—not outward toward sense objects but inward toward the non-dual ground of awareness. This is not a forced
  withdrawal but a natural reorientation that occurs when the distinction between subject and object becomes vivid and unshakeable
  through sustained practice.


  In the Yoga–Sāṃkhya framework, this represents the penultimate stage before kaivalya is stabilized. The mind has not yet
  dissolved into pure consciousness, but it has begun to *gravitate* there, as though pulled by an invisible weight. This
  is the state of a practitioner whose discriminative insight has matured enough that the world of objects no longer holds
  primary allegiance; instead, the mind''s inherent tendency now flows toward its own source—the witnessing principle untouched
  by experience.


  Key Terms


  **viveka** — Discernment; the yogic faculty that distinguishes between puruṣa (unchanging consciousness) and prakṛti (changing
  nature and mind).

  **kaivalya** — Absolute aloneness; the final liberation where consciousness recognizes itself as eternally separate from
  all objects and mental modifications.

  **cittam** — Mind-stuff; the field of mental modifications (vṛtti) that reflects and responds to experience.'
insight: The central claim of this verse is that the mind, when properly directed, naturally seeks the highest form of discernment—kaivalya.
practice: Throughout your day, when you notice your attention pulling outward toward an object or person, pause and let your
  gaze soften inward—not closing your eyes, but releasing the grip of looking. Feel the weight of your awareness settling
  downward, as if it were sinking through your body like water finding its level, away from the pull of what you were about
  to grasp.
