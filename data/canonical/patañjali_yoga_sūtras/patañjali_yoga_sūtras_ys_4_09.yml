sanskrit_devanagari: जातिदेशकालव्यवहितानाम् अप्य आन्तर्यम् स्मृतिसंस्कारयोः एकरूपत्वात्
sanskrit_iast: jātideśakālavyavahitānām apy ānantaryaṃ smṛtisaṃskārayor ekarūpatvāt
translation_literal: Even when separated by birth, place, and time, there is an unbroken continuity between
  memory and impression, because they share the same form.
commentary: 'This sūtra addresses a fundamental paradox in yogic psychology: how can a present memory
  or impression be causally linked to an event that occurred in a different life, place, or era? Patañjali''s
  answer is radical—memory (smṛti) and the latent impression or trace (saṃskāra) are not two separate
  things connected by time; they are the same phenomenon viewed from different angles.


  In the Sāṃkhya-Yoga framework, saṃskāra is the subtle imprint left in the mind-stuff (citta) by experience.
  When conditions align—through practice, circumstance, or the ripening of karma—that dormant trace resurfaces
  as smṛti (remembrance or direct knowing). The key insight is ekarūpatvāt: they have ''one form.'' They
  are not linked by a chain of causation across time; rather, they are expressions of a single, continuous
  substrate.


  This explains how a yogi can access knowledge of past lives, how an impression planted in childhood
  resurfaces decades later, or how a practice performed years ago suddenly bears fruit. Birth (jāti),
  place (deśa), and time (kāla) are categories that divide the external world, but the inner continuity
  of impression and memory transcends these divisions. There is no gap (vyavahita) that breaks the thread—only
  apparent separation in the realm of form and sequence.


  This sūtra also prepares the ground for understanding how yoga works: by purifying and directing the
  saṃskāras, the yogi rewrites the substrate of consciousness itself, making liberation possible regardless
  of past conditioning.


  Key Terms


  **saṃskāra** — A latent impression, trace, or conditioning left in the mind-stuff by experience; the
  subtle seed of karma that shapes future perception and action.

  **smṛti** — Memory, remembrance, or direct recollection; the activation of a dormant saṃskāra in conscious
  awareness.

  **ekarūpatvāt** — Because of having one form or nature; the principle that memory and impression are
  expressions of a single underlying continuum, not separate entities.'
insight: The passage asserts that the causal chain of desire does not break at the point of fulfillment;
  rather, the same mental imprint persists as both desire and recollection.
practice: 'The next time you recognize something—a face, a song, a scent—pause and trace backward through
  the layers: sensation → memory → the original moment. Notice how the present impression and the past
  event feel like the same shape wearing different clothes across time. Hold this recognition without
  trying to bridge them; let the ''one form'' reveal itself in the gap between then and now.'
