- kind: practice
  label: Practice (Abhyasa)
  body: Observe each desire as it arises, and immediately note the memory of that desire after its fulfillment,
    to become aware of the persistent impression that links them.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: Although desires are separated from their fulfillments by class, space and time, they have an
    uninterrupted relationship because the impressions [of desires] and memories of them are identical.
