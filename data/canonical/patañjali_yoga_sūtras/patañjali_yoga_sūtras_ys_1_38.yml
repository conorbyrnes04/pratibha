  items:
  - term: ālambana (आलम्बन)
    definition: 'ā-√lamb ‘lean on’ → support/object of meditation -> in “Concentration on Deep Sleep”: Support, object of
      focus, or ground upon which consciousness rests in meditation -> not crutch in a weak sense; the chosen support that
      citta rests upon in practice'
  - term: nidrā (निद्रा)
    definition: 'ni-√drā ‘sleep’ → sleep as a distinct vṛtti -> in “Concentration on Deep Sleep”: a natural state where gross
      mental modifications cease -> not mere rest; a cognition of absence that still counts as mental modification to be stilled'
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Concentration on Deep Sleep”: in Yoga,
      the locus of vṛtti and the seat of samādhi -> not ‘brain software’ or an enemy to smash; the reflecting medium whose
      turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Concentration on Deep Sleep”: the dynamic process that
      obscures puruṣa’s pure awareness -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep,
      memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Concentration on Deep Sleep”: samādhi: the state of absorption
      where citta is fixed on an object, dissolving vṛtti -> not trance-entertainment or unconsciousness; graded absorption
      where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
