- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that the mind’s vacant spaces are not empty but fertile grounds where other
    thoughts, seeded by past impressions, sprout. It claims that the mind’s apparent stillness is a deceptive
    veil; beneath it, a dynamic interplay of residual impressions (saṃskāra) continually generates new
    content (pratyaya). This is a contested move within the Yoga‑Sāṃkhya framework: while Sāṃkhya emphasizes
    the primacy of puruṣa’s passive awareness, the Yoga school insists that even the most subtle mental
    fluctuations are products of prakṛti’s residuals, thereby necessitating a disciplined practice to
    render the mind still. The implication is existential: liberation (kaivalya) is attainable only when
    the mind’s gaps are cleared of these residual impressions, allowing puruṣa to experience itself unmediated.
    The Satchidananda aphorism underscores this by highlighting that distracting thoughts “may arise due
    to past impressions,” reinforcing the idea that the mind’s emptiness is not a void but a repository
    of latent content. In practice, this means cultivating a vigilant awareness that observes each arising
    notion without attachment, thereby preventing the past from re‑manifesting as new distractions. The
    ultimate goal is to transform the mind from a passive receiver of impressions into an active, self‑conscious
    observer, thereby achieving samādhi and, ultimately, kaivalya.


    Key Terms


    **pratyaya (प्रत्‍यय)** — pratyaya (IAST) – from prā‑ (before) + taya (to hold) → ‘content, notion,
    thought’; in Sāṃkhya, it denotes the mental content that arises from prakṛti; the term’s literal sense
    of ‘holding before’ is lost in the default translation ‘content’ which fails to convey its dynamic,
    pre‑manifested nature.


    **antarāṇi (अन्तराणि)** — antarāṇi (IAST) – plural of antarā (other, different); in Sāṃkhya it refers
    to the other, external impressions that influence the mind; the usual translation ‘others’ omits the
    subtle distinction that these are not external objects but internal residuals.


    **saṃskārebhyaḥ (संस्कारभ्यः)** — saṃskārebhyaḥ (IAST) – from saṃskāra (impression, conditioning)
    + bhyaḥ (from); literally ‘from impressions’; in Sāṃkhya it specifically denotes the residuals of
    past actions that persist in prakṛti; the generic translation ‘from past impressions’ fails to capture
    the causal potency of these residuals.


    Cross-Tradition Resonances


    **Yoga Sūtra 4.28, ‘tacchidreṣu pratyayāntarāṇi saṃskārebhyaḥ’:** Both 4.27 and 4.28 share the same
    syntactic frame: subject (tac), gap marker (chidreṣu), object (pratyayāntarāṇi), and causal clause
    (saṃskārebhyaḥ). The structure underscores the recurring theme that the mind’s vacuities are fertile
    grounds for residual impressions.

    *Divergence:* While 4.27 presents the observation as a general principle, 4.28 expands by explicitly
    linking the arising notions to the specific causal chain of past impressions, thereby tightening the
    causal inference.


    **Yoga Sūtra 4.26, ‘tacchidreṣu pratyayāntarāṇi saṃskārebhyaḥ’:** The earlier sūtra mirrors the same
    pattern, reinforcing the idea that the mind’s gaps are consistently populated by residual impressions
    across the discourse.

    *Divergence:* 4.26 omits the explicit mention of ‘tac’ as a demonstrative, which in 4.27 functions
    to emphasize the universality of the phenomenon, suggesting a pedagogical refinement.'
