title: Distractions Arising from Past Impressions
unit_type: sutra
sanskrit_devanagari: तच्छिद्रेषु प्रत्ययान्तराणि संस्कारभ्यः
sanskrit_iast: tacchidreṣu pratyayāntarāṇi saṃskārebhyaḥ
translation_literal: In those gaps, other mental contents arise from latent impressions.
commentary: 'This sūtra belongs to Patañjali''s analysis of mental distraction and the obstacles to stable
  meditation. The preceding context (I.30-31) identifies disease, dullness, doubt, carelessness, laziness,
  sensory indulgence, false perception, failure to establish practice, and regression as nine obstacles
  to yoga. When a practitioner attempts to steady the mind on a single object (ekāgratā), gaps or breaks
  (chidra) inevitably appear in that focus. The sūtra explains what fills those gaps: pratyaya-antara,
  other mental contents or alternative thought-forms, which emerge spontaneously from saṃskāra—the deep
  grooves of conditioning, habit, and past experience embedded in the subtle body.


  Within the Yoga–Sāṃkhya framework, saṃskāra represents the latent potency of past actions and impressions
  that remain dormant in prakṛti (nature/mind-stuff) until activated by circumstance or attention. They
  are not random; they follow the law of karma and the individual''s psychological history. When the conscious
  effort to maintain focus weakens, the mind''s natural tendency is to revert to these well-worn pathways.
  This is not failure—it is the honest description of how the untrained mind operates.


  The teaching is diagnostic and compassionate: distraction is not a moral failing but a mechanical consequence
  of unrefined mental habit. Understanding this shifts practice from self-blame to clear observation.
  The sūtra implicitly points forward to the need for sustained practice (abhyāsa) and non-attachment
  (vairāgya) to gradually weaken the hold of saṃskāra and stabilize the mind in the gaps themselves, eventually
  reaching a state where no gaps arise because the mind rests in its own nature.


  Key Terms


  **chidra** — Gap, break, or fissure; here, the lapses in meditative focus where the mind loses its anchor.

  **pratyaya** — Mental content, thought-form, or cognitive modification; any object or modification of
  consciousness.

  **saṃskāra** — Latent impression, conditioning, or karmic groove; the subtle residue of past actions
  and experiences that shapes present mental tendencies.'
insight: The passage asserts that the mind’s vacant spaces are not empty but fertile grounds where other
  thoughts, seeded by past impressions, sprout.
practice: 'Sit comfortably and choose a simple focal point—the natural breath, a mantra, or a visual image.
  Practice for 5–10 minutes. Each time you notice your attention has wandered, gently note what pulled
  you away: a memory, a worry, a sensation, a fantasy. Do not judge. Simply name the content silently
  (''thinking about work,'' ''body sensation,'' ''old memory'') and return to the breath. Over weeks,
  you will recognize recurring patterns—these are your saṃskāra at work. The practice is not to eliminate
  them but to see them clearly and, through repeated gentle return, to create new grooves of stability.
  This builds the foundation for deeper meditation.'
