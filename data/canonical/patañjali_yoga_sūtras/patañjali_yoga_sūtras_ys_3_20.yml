unit_label: Reject External Support
title: Reject External Support
unit_type: sutra
sanskrit_devanagari: ना च त त् साःलम्बनं तस्याविषयिभूतत्वात्
sanskrit_iast: na ca tat sālambanaṃ tasyāviṣayībhūtatvāt
translation_literal: And not that support, from that object of being.
commentary: 'The sutra asserts that the true support for the practitioner is not an external or mental aid but the intrinsic
  object of being itself. In the Yoga‑Sāṃkhya framework, the mind’s vṛtti (mental fluctuations) are often treated as supports
  that can be harnessed or discarded. Here, Patanjali explicitly rejects such a strategy, insisting that the only reliable
  anchor is the pure, unconditioned reality of the self—purusha—expressed in the phrase tasyāviṣayībhūtatvāt (from that object
  of being). This move is contested in the tradition because many commentators (e.g., the Śānti‑Sūtra) interpret the “support”
  as the meditative concentration (dhyāna) that steadies the mind. Patanjali’s stance, however, elevates the ontological status
  of purusha above all mental techniques, implying that samādhi is achieved by aligning with the self’s inherent nature rather
  than by cultivating external aids. The existential implication is profound: the practitioner must abandon reliance on thoughts,
  motives, or external conditions and instead turn inward to the self’s own being. This aligns with Satchidananda’s observation
  that the motive behind a thought is not the object of samyama; the true object is the self’s unchanging essence. By internalizing
  this principle, one learns to let go of the illusion of support and to rest in the self’s own presence, thereby advancing
  toward liberation.


  Key Terms


  **sālambanaṃ (साःलम्बनम्)** — sā (support) + laṃana (to lean) -> support; in Yoga, often refers to external aids or mental
  focus; here it is negated, indicating that external aids are not the true support.


  **tasyāviṣayībhūtatvāt (तस्याविषयिभूतत्वात्)** — tasyā (that) + viṣaya (object) + bhūta (being) + tva (essence) + āt (from)
  -> from that object of being; denotes the intrinsic reality of purusha, the only true anchor.


  **na ca (ना च)** — na (not) + ca (and) -> conjunction of negation; signals that the preceding clause is excluded from the
  list of supports.


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 3.20:** Explicit negation of external support mirrors the Sankhya principle that purusha is independent
  of prakṛti; only purusha is the true support.

  *Divergence:* While Sankhya treats support as inherent in purusha, Patanjali’s sutra emphasizes the need to discard all
  external aids, highlighting a more radical inward focus.


  **Śānti‑Sūtra 1.2:** The Śānti‑Sūtra speaks of dhyana as the support for samādhi, structurally similar to the idea of a
  support.

  *Divergence:* Patanjali’s negation turns this support into a falsehood, underscoring that dhyana is a tool, not the ultimate
  anchor.


  **Bhaṭṭa, Yoga Vāsiṣṭha 2.3:** Bhaṭṭa describes the mind’s fluctuations as potential supports if properly harnessed.

  *Divergence:* Patanjali rejects this harnessing, insisting that reliance on vṛtti is insufficient for true samādhi.'
insight: The sutra asserts that the true support for the practitioner is not an external or mental aid but the intrinsic object
  of being itself.
practice: Do not rely on external or mental aids; instead, anchor yourself in the pure object of being.
