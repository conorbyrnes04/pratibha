unit_label: Reject External Support
title: Reject External Support
unit_type: sutra
sanskrit_devanagari: ना च त त् साःलम्बनं तस्याविषयिभूतत्वात्
sanskrit_iast: na ca tat sālambanaṃ tasyāviṣayībhūtatvāt
translation_literal: And that support is not for him, because it has become outside the range of his perception.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on samādhi and the progression
  beyond external supports. The verse addresses a yogi who has advanced beyond reliance on external objects
  or props for meditation. The word sālambana (with support) refers to any external anchor—a mantra, visual
  form, breath count, or physical sensation used as a meditation object. Tasyāviṣayībhūtatvāt (having
  become outside the range of perception) indicates that as consciousness refines through practice, gross
  external supports naturally fall away; they are no longer accessible to the yogi''s inward-turned attention.


  This is not rejection through force of will, but recognition through direct experience. The advanced
  practitioner''s sense field (viṣaya) has shifted inward. External supports become irrelevant not because
  they are forbidden, but because the mind no longer needs them—it has found subtler grounds for stability.
  This reflects the Yoga–Sāṃkhya principle that consciousness (puruṣa) progressively disentangles from
  the objects of nature (prakṛti) as discrimination deepens.


  The sūtra teaches non-clinging (vairāgya) not as ascetic denial, but as natural consequence of inward
  maturation. A beginner requires external support; an adept has moved beyond it. Neither stage is superior
  in moral terms; each is appropriate to its level of development.


  Key Terms


  **sālambana** — with external support or prop; a meditation object outside consciousness that serves
  as an anchor

  **viṣaya** — field of perception, range of sense or mental engagement; the domain accessible to consciousness
  at any given stage

  **vairāgya** — non-attachment or natural dispassion; the spontaneous release of clinging as wisdom matures'
insight: The sutra asserts that the true support for the practitioner is not an external or mental aid
  but the intrinsic object of being itself.
practice: Release your current meditation object—whether breath, mantra, or image—mid-practice, and notice
  what remains present without your effort to hold it. If nothing arises, sit in that absence itself;
  if something subtle persists, follow only that. Do this once this week, and observe whether the support
  fell away or your attention simply moved beyond needing it.
