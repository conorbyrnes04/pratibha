sanskrit_devanagari: 'स्वविषयासंप्रयोगे चित्तसवृपानुकारे इवन्द्रियाणां प्रतियाहारः ॥ २.५४ ॥


  ततः परमावश्यतेंद्रियाणाम् ॥ २.५५ ॥'
sanskrit_iast: 'svaviṣayāsaṃprayoge cittasvarūpānukāra ivendriyāṇāṃ pratyāhāraḥ || 2.54 ||


  tataḥ paramā vaśyatendriyāṇām || 2.55 ||'
translation_literal: '**2.54** When the senses are not engaged with their objects, they imitate the mind''s own nature—this
  is sense-withdrawal (pratyāhāra).

  **2.55** From that comes supreme mastery of the senses (indriyāṇām).'
commentary: 'Pratyāhāra—the withdrawal of the senses—marks the threshold between external discipline and internal mastery.
  These two sūtras articulate a single movement: the senses, ordinarily autonomous agents of distraction, are brought into
  alignment with the mind (citta), and through that alignment, brought under absolute control (paramā vaśya). The mechanism
  is not suppression but reorientation. The mind does not destroy sensory capacity; rather, it becomes the organizing principle
  to which the senses conform. In Sāṃkhya terms, this is the reversal of the ordinary flow: prakṛti (nature, including the
  sense organs) typically acts upon puruṣa (the witness consciousness) through the vṛttis (mental fluctuations). Pratyāhāra
  interrupts that flow by making the senses obey the mind''s intention rather than external stimuli. This is why 2.54 speaks
  of the senses ''aligning with'' (anukaraṇa) the mind—they cease to be independent conduits and become instruments of focused
  attention. Once this reorientation is complete, 2.55 declares the result: supreme mastery. This is not domination through
  force but through the restoration of proper hierarchy. The practitioner discovers that the senses have no autonomous power;
  their apparent tyranny over attention was always a function of the mind''s own distraction. By withdrawing sensory input
  deliberately, one starves the vṛttis of their fuel and reveals the mind''s capacity to rest in its own nature, uncolored
  by external objects. This is the gateway to samādhi and ultimately to kaivalya—the isolation of puruṣa from prakṛti—because
  it demonstrates that consciousness itself is independent of sensation. Pratyāhāra thus accomplishes what the external disciplines
  (yama, niyama, āsana, prāṇāyāma) prepare for: it turns the entire sensory apparatus from an obstacle into an instrument
  of liberation.


  Key Terms


  **pratyāhāra** — withdrawal or abstraction of the senses from their objects; the fifth limb of yoga in which sensory input
  is deliberately retracted and brought under the mind''s governance

  **paramā vaśya** — supreme mastery or subjection; the highest degree of control over the senses, achieved when they cease
  to act autonomously and obey the mind''s intention

  **vṛtti** — mental fluctuation or modification; the waves of thought-content that ordinarily bind consciousness to external
  objects through sensory engagement


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.58–2.59:** Both texts describe the withdrawal of the senses as a prerequisite for stable wisdom (sthita-prajña).
  The Gītā speaks of the sage whose senses are ''withdrawn from their objects as a tortoise withdraws its limbs,'' and both
  traditions treat this as the foundation of equanimity and liberation. Divergence: The Gītā emphasizes withdrawal as a sign
  of already-established wisdom and equanimity in action (sthita-prajña), whereas the Yoga Sūtras present pratyāhāra as a
  deliberate practice that *enables* the higher states; the Gītā''s sage has already transcended, while the yogi is still
  cultivating.

  **Plotinus, Enneads IV.8.1:** Plotinus describes the soul''s withdrawal from sensory distraction as a necessary condition
  for union with the One, arguing that the multiplicity of sense-objects fragments attention and that reintegration of consciousness
  requires turning inward from external stimuli. Divergence: Plotinus frames withdrawal as an ascent toward transcendent unity,
  whereas Yoga Sūtras 2.54–2.55 frame it as the restoration of the mind''s proper function and the senses'' correct subordination
  within the embodied system; the goal is not escape from the body but mastery within it.

  **Epictetus, Enchiridion 1:** Epictetus teaches that we have no control over external impressions (phantasiai) but absolute
  control over our assent to them; pratyāhāra similarly rests on the insight that the senses'' power over the mind is not
  intrinsic but depends on the mind''s habitual engagement. Divergence: Epictetus locates freedom in the will''s refusal to
  assent, a Stoic act of judgment; Yoga Sūtras locate it in the senses'' actual withdrawal and realignment, a psychosomatic
  reorientation, not merely a shift in rational perspective.'
insight: The claim that the practitioner can exert absolute control over the senses is not a mere technicality; it is the
  decisive turning point where the yogic process moves from passive observation to active
practice: You now consciously observe each sense, allowing its impulses to arise and pass without attachment, thereby exercising
  supreme mastery over them.
