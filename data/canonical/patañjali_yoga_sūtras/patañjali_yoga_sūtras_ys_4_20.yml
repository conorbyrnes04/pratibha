title: Simultaneous Non-Perception
unit_type: sutra
sanskrit_devanagari: एकसमेयं कोभयाञ्वाधारणम्
sanskrit_iast: ekasamaye cobhayānavadhāraṇam
translation_literal: At one and the same moment, both cannot be held in steady focus.
commentary: 'This sūtra addresses a fundamental constraint of conscious attention within the yogic framework.
  Patañjali is describing the impossibility of simultaneously maintaining equal, unwavering concentration
  (dhāraṇā) on two distinct objects or states. The word *ekasamaye* (at a single time) emphasizes the
  temporal unity of consciousness; *cobhaya* (and both) names the dual objects; *anadhāraṇam* (non-holding,
  non-steadying) declares the impossibility.


  This principle operates within Sāṃkhya metaphysics: the mind (buddhi) is a singular instrument of perception
  and cognition. While the mind can oscillate rapidly between objects, creating an illusion of simultaneity,
  true *dhāraṇā*—the steady, unbroken fixation required for meditation—cannot genuinely divide itself.
  This is not a limitation to overcome through effort, but rather a structural fact about how consciousness
  engages with multiplicity.


  The practical implication is profound: the yogi learns that mastery lies not in expanding attention
  across many things, but in progressively narrowing focus to one object until that object and the mind
  become unified (samādhi). The sūtra implicitly teaches that attempts to maintain dual concentration
  are futile; wisdom consists in accepting this and choosing what is worthy of singular attention.


  In the context of the Yoga Sūtras'' progression, this verse clarifies why the practices of pratyāhāra
  (sense withdrawal) and dhāraṇā (concentration) are necessary disciplines. They train the mind to honor
  its own nature: to be one-pointed, not scattered.


  Key Terms


  **dhāraṇā** — Steady, unwavering concentration or holding of attention on a single object or point

  **ekasamaye** — At one and the same moment; in a single instant of time

  **samādhi** — Absorption or union; the state in which the meditator, the meditation, and the object
  of meditation become unified'
insight: The core claim of this sutra is that consciousness (citta) cannot be both the perceiver and the
  perceived in the same instant; it is either the subject or the object, but never both simultaneously.
practice: Choose a single object of focus—a candle flame, a mantra syllable (like *om*), or the sensation
  of breath at the nostrils. Sit comfortably for 5–10 minutes. Each time you notice the mind has split
  its attention (planning the future, remembering the past, judging the present), gently acknowledge the
  split without frustration, and return to the single object. Do not try to hold multiple objects at once;
  instead, notice how the mind naturally wants to wander, and use that recognition as your teacher. The
  practice is not about perfection but about honest observation of attention's actual nature. Over weeks,
  you will find that periods of genuine one-pointedness become more stable and frequent, and the mind's
  restlessness becomes more transparent.
