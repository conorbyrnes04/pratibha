unit_label: Simultaneous Non-Perception
title: Simultaneous Non-Perception
unit_type: sutra
sanskrit_devanagari: एकसमेयं कोभयाञ्वाधारणम्
sanskrit_iast: ekasamaye cobhayānavadhāraṇam
translation_literal: In a single moment, the mind‑stuff does not perceive both subject and object.
commentary: 'The core claim of this sutra is that consciousness (citta) cannot be both the perceiver and the perceived in
  the same instant; it is either the subject or the object, but never both simultaneously. This bifurcation is the decisive
  move that distinguishes the Yoga school from other philosophical systems that allow a unified perception. In the Sāṃkhya‑Yoga
  framework, puruṣa (the true self) is the sole subject, while prakṛti (the material world) is the object. The sutra’s insistence
  that the mind‑stuff cannot perceive both at once underscores the ontological separation between puruṣa and prakṛti, thereby
  justifying the practice of detachment (vairāgya) and the cultivation of samādhi. The existential implication is profound:
  if one can observe that the mind is never both subject and object, one can begin to recognize the illusory nature of the
  self‑identification with the mind and thus move toward liberation (kaivalya). The Satchidananda commentary’s remark that
  simultaneity proves the mind is not self‑luminous echoes this point, highlighting that the mind’s inability to be both subject
  and object reveals its dependent nature. By internalizing this duality, a practitioner learns to witness thoughts as mere
  objects, thereby reducing identification with them and facilitating the ascent to pure awareness.


  Key Terms


  **citta (चित्त)** — citta (mind‑stuff) -> in Sāṃkhya: the active, conscious principle; in Yoga: the instrument of perception;
  the sutra shows its limitation as neither subject nor object simultaneously.


  **puruṣa (पुरुष)** — puruṣa (true self) -> Sāṃkhya: the eternal, passive witness; Yoga: the ultimate subject; the sutra’s
  claim that puruṣa cannot be both subject and object reinforces its distinctness from citta.


  **prakṛti (प्रकृति)** — prakṛti (material nature) -> Sāṃkhya: the dynamic, evolving principle; Yoga: the object of perception;
  the sutra’s duality underscores the separation between prakṛti and puruṣa.


  **samādhi (समाधि)** — samādhi (concentration/absorption) -> Yoga: the state where citta is still and perceives only puruṣa;
  the sutra’s duality is a prerequisite for achieving samādhi.


  Cross-Tradition Resonances


  **Yoga Sūtra 4.20:** Explicit denial of simultaneous subject‑object perception mirrors the Sāṃkhya distinction between puruṣa
  and prakṛti.

  *Divergence:* While Sāṃkhya presents the distinction as ontological, the Yoga sutra frames it as a perceptual limitation
  of citta, thereby making it a practical diagnostic for meditation.


  **Bhaṭṭa Kaivalyaśāstra 1.2:** Both texts assert that the mind cannot be both subject and object, using this to justify
  detachment.

  *Divergence:* Kaivalyaśāstra emphasizes the mind’s inherent duality as a metaphysical truth, whereas the Yoga sutra uses
  it as a methodological tool for samādhi.


  **Māṇḍūkya Upaniṣad 4.1:** The Upaniṣad’s statement that the self is distinct from the mind parallels the sutra’s claim
  of non‑simultaneity.

  *Divergence:* The Upaniṣad presents the distinction as a metaphysical realization, while the sutra presents it as an experiential
  observation during meditation.


  **Patanjali’s Mahāyoga 2.1:** Both texts discuss the mind’s dual role as subject and object, but Patanjali allows a temporary
  overlap in the process of samādhi.

  *Divergence:* Patanjali’s model permits a transitional state where citta is both subject and object during the ascent, whereas
  the sutra strictly prohibits simultaneity at any instant.'
insight: The core claim of this sutra is that consciousness (citta) cannot be both the perceiver and the perceived in the
  same instant; it is either the subject or the object, but never both simultaneously.
practice: Observe your thoughts in a single moment; note that each thought is either the perceiver or the perceived, but never
  both—this awareness steadies your mind for deeper concentration.
