- kind: practice
  label: Practice (Abhyasa)
  body: Observe the moment when you notice another person’s thoughts; pause, and let your own mind remain still, preventing
    the cascade of memories that follows.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: If the perception of one mind by another mind be postulated, we would have to assume an endless number of them and
    the result would be confusion of memory.
