sanskrit_devanagari: चितान्तरदृश्ये बुद्धिबुद्धेर अतिप्रसङ्गः स्मृतिसंकरः च
sanskrit_iast: cittāntaradṛśye buddhibuddher atiprasaṅgaḥ smṛtisaṃkaraś ca
translation_literal: If the mind were to perceive another mind, there would follow an infinite regress
  of intellects perceiving intellects, and confusion of memory.
commentary: 'This sūtra addresses a fundamental logical problem in epistemology: the nature of self-awareness
  and the limits of perception. Patañjali is refuting a naive model in which consciousness (citta) could
  know itself by becoming an object of perception—as though one mind could stand outside itself to observe
  another mind observing it.


  The argument unfolds in two parts. First: *atiprasaṅga* (infinite regress). If mind A perceives mind
  B, then mind B must itself be perceived by mind C, which must be perceived by mind D, and so on without
  end. This logical impossibility shows that consciousness cannot be known through the perceptual mechanism
  that knows objects.


  Second: *smṛti-saṃkara* (confusion of memory). If minds were objects that could be perceived, memories
  would become entangled and indistinguishable—whose memory belongs to which mind? The integrity of individual
  recollection would collapse.


  Within the Yoga–Sāṃkhya framework, this sūtra establishes that the *sākṣī* (witness consciousness) is
  fundamentally different from both the mind (citta) and its objects. The Self does not know itself by
  becoming an object; it knows by being the unchanging ground of all knowing. This distinction is crucial:
  the mind can be observed, refined, and stilled, but the observer itself transcends the observing mechanism.
  This is why meditation does not make the Self an object—it removes the veils that obscure recognition
  of what already is.


  Key Terms


  **citta** — mind-stuff; the subtle substance of mental modifications and impressions

  **buddhi** — intellect; the faculty of discernment and determination within the mind

  **smṛti** — memory; the trace and recollection of past experience'
insight: The central claim of this sutra is that the act of one mind perceiving another’s mind generates
  an unbounded chain of mental associations, thereby undermining the possibility of clear, stable remembra
practice: 'Sit quietly and notice: right now, can you observe your own mind observing? Try to catch the
  act of thinking as it happens. You will find that the moment you try to make your awareness an object
  of itself, it slips away—there is only the thought, not a separate watcher of the watcher. Instead,
  rest as the simple fact of awareness itself, without trying to make it into something you can see. Notice
  how this resting is already complete, already present, requiring no object and no second mind to verify
  it. Return to this non-objective knowing whenever the mind pulls you back into the trap of trying to
  observe the observer.'
