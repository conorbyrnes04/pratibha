    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Perception of Minds”: in Sāṃkhya,
      the conscious, observing principle -> not ‘brain software’ or an enemy to smash; the reflecting medium whose turnings
      veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: aṅga (अङ्ग)
    definition: '‘limb/accessory’ of the eightfold path -> in “Perception of Minds”: When the mind of one person is perceived
      by the mind of another, the resulting association of memory becomes so vast … -> not body-part list for its own sake;
      interdependent accessories culminating in samādhi'
  - term: smṛti (स्मृति)
    definition: '√smṛ ‘remember’ → memory as re-presentation -> in “Perception of Minds”: the trace and recollection of past
      experience -> not archival storage only; a vṛtti that re-lives past experience without adding new object'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Perception of Minds”: default ‘thought’ misses its dynamic,
      turning nature -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Perception of Minds”: default ‘concentration’ omits its role
      as the witness state -> not trance-entertainment or unconsciousness; graded absorption where subject–object friction
      quiets'
