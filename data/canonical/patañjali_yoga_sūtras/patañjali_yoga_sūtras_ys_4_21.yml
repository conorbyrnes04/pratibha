sanskrit_devanagari: चितान्तरदृश्ये बुद्धिबुद्धेर अतिप्रसङ्गः स्मृतिसंकरः च
sanskrit_iast: cittāntaradṛśye buddhibuddher atiprasaṅgaḥ smṛtisaṃkaraś ca
translation_literal: When the mind of one person is perceived by the mind of another, the resulting association of memory
  becomes so vast that it leads to confusion.
commentary: 'The central claim of this sutra is that the act of one mind perceiving another’s mind generates an unbounded
  chain of mental associations, thereby undermining the possibility of clear, stable remembrance. This is a contested move
  in the Yoga and Sāṃkhya traditions: while some commentators treat it as a warning against the illusion of duality, others
  read it as a diagnostic of the mind’s tendency to project its own contents onto others. The sutra situates itself in the
  broader discourse on the nature of citta (mind) and its vṛtti (mental modifications). By highlighting the proliferative
  effect of inter‑mind perception, it points to the existential application of cultivating a detached observer (samādhi) who
  can recognize these projections without being ensnared by them. The notion that “memory becomes confused” echoes Sāṃkhya’s
  idea that the mind, when entangled in its own vṛtti, loses its capacity to discern puruṣa (the pure witness). Thus, the
  sutra invites the practitioner to develop a state of stillness where the mind’s own vṛtti is no longer amplified by external
  projections, thereby moving toward kaivalya (liberation).


  Key Terms


  **citta (चित्त)** — citta (mind) – from ‘to be’; in Sāṃkhya, the conscious, observing principle; default translation ‘mind’
  overlooks its role as the locus of perception and memory


  **vṛtti (वृत्ति)** — vṛtti (mental modification) – from ‘to turn’; in Yoga, the fluctuations that obscure puruṣa; default
  ‘thought’ misses its dynamic, turning nature


  **samādhi (समाधि)** — samādhi (concentration) – from ‘to settle’; in Yoga, the absorption that stills citta; default ‘concentration’
  omits its role as the witness state


  **purusha (पुरुष)** — purusha (pure consciousness) – from ‘man’ or ‘person’; in Sāṃkhya, the unchanging witness; default
  ‘person’ neglects its ontological primacy


  Cross-Tradition Resonances


  **Yoga Sūtra 4.20:** Both sutras discuss the mind’s perception of another mind, using the term ‘citta’ and the idea of an
  endless chain of associations.

  *Divergence:* While 4.20 focuses on the multiplicity of minds, 4.21 emphasizes the resulting confusion of memory, shifting
  the focus from plurality to quality


  **Sāṃkhya Kārikā 2.3:** The notion of vṛtti as a source of confusion parallels the Kārikā’s description of mental modifications
  obscuring puruṣa.

  *Divergence:* The Kārikā presents vṛtti as a general phenomenon, whereas the sutra specifically links it to inter‑mind perception


  **Yoga Sūtra 2.10:** Both sutras employ the concept of samādhi as the antidote to mental confusion.

  *Divergence:* 2.10 describes samādhi as the cessation of vṛtti, while 4.21 implies that samādhi must be cultivated to prevent
  the proliferation of memory associations


  **Bhaṭṭa Śāntiśāstrī 1.5:** The idea of endless associations mirrors Bhaṭṭa’s discussion of the mind’s endless reflections.

  *Divergence:* Bhaṭṭa attributes the endlessness to the mind’s own activity, whereas the sutra attributes it to the act of
  perceiving another mind'
insight: The central claim of this sutra is that the act of one mind perceiving another’s mind generates an unbounded chain
  of mental associations, thereby undermining the possibility of clear, stable remembra
practice: Observe the moment when you notice another person’s thoughts; pause, and let your own mind remain still, preventing
  the cascade of memories that follows.
