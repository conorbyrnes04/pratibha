appendixes:
- commentator: Swami Satchidananda (1978, attributed aphorism)
  text: A word, its meaning and the idea behing it are normally confused because of superimposition upon
    one another. By saṁyama on the word [or sound] produced by any being, knowledge of its meaning is
    obtained.
