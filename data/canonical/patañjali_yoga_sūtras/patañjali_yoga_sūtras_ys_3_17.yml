sanskrit_devanagari: शब्दार्थप्रतयाणाम् इतरताराध्यासात् संकरः श तप्रविभागसंयमात् सर्वभूतरुतज्ञानम्
sanskrit_iast: śabdārthapratyayānām itaretarādhyāsāt saṃkaraś tatpravibhāgasaṃyamāt sarvabhūtarutajñānam
translation_literal: Word, meaning, and idea are superimposed upon one another, creating confusion. Through concentrated discernment
  of their distinct separation, knowledge of the sounds made by all beings arises.
commentary: 'This sūtra addresses a fundamental cognitive entanglement that obscures direct perception. In ordinary consciousness,
  three distinct elements collapse into one muddy experience: the sound (śabda)—the acoustic vibration itself; the meaning
  (artha)—the referent or object; and the idea (pratyaya)—the mental construct or image that arises in response. We hear a
  word and instantly conflate the phoneme, its conventional reference, and our personal association, as if they were a single
  thing.


  Patañjali identifies this as adhyāsa (superimposition)—a cognitive overlay where boundaries dissolve. This confusion is
  not merely semantic; it obscures the yogin''s ability to perceive reality as it actually manifests. The sūtra then prescribes
  a specific practice: saṃyama (the unified application of dhāraṇā, dhyāna, and samādhi) on the vibhāga (distinction, separation)
  between these three elements.


  When the yogin applies this discernment through saṃyama, a remarkable capacity emerges: sarvabhūtarutajñānam—direct knowledge
  of the utterances, cries, and sonic expressions of all beings. This is not translation or interpretation; it is immediate
  comprehension of what any creature''s sound communicates. The mechanism is clear: by untangling the knot of word-meaning-idea
  confusion in oneself, one becomes transparent to the actual communicative content of sound itself, unfiltered by conceptual
  overlay.


  This sūtra sits within the Vibhūti Pāda (the chapter on powers) and reflects the Yoga–Sāṃkhya principle that clarity of
  perception follows from discrimination (viveka) between the layers of experience. It presupposes that confusion is not inherent
  to sound or meaning, but to the superimposition of one upon the other in the untrained mind.


  Key Terms


  **adhyāsa** — Superimposition; the cognitive overlay by which distinct elements are mistaken for a unified whole

  **vibhāga** — Distinction, separation, or differentiation; the act of discerning boundaries between categories or layers

  **saṃyama** — The unified binding together of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi) on
  a single object, yielding direct knowledge'
insight: The passage asserts that the mind’s habitual conflation of a word, its denotation, and the idea it evokes is a primary
  obstacle to clear cognition.
practice: 'Choose a simple, unfamiliar sound—a bird call, a musical note, a word in a language you don''t speak, or even your
  own voice recorded and played back. Listen to it three times in succession.


  First listening: Notice the raw acoustic event—frequency, duration, texture, rhythm. Attend only to the vibration itself,
  as pure sensation. Do not name it or assign meaning.


  Second listening: Now allow the conventional meaning or association to arise (if any). What does this sound signify? What
  object or idea does it point to? Notice the mental image or concept that forms.


  Third listening: Observe the gap between the two. The sound itself is unchanged; the meaning is a separate layer. Can you
  hold both in awareness without collapsing them into one? Can you perceive the sound without automatically triggering the
  meaning?


  Repeat this exercise weekly with different sounds. Over time, you will notice your listening becoming clearer and less automatic.
  This is the beginning of the discernment (vibhāga) Patañjali describes. The practice trains the mind to separate what it
  habitually fuses, creating the cognitive flexibility required for saṃyama.'
