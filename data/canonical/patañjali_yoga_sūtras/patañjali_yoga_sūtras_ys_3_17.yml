- kind: practice
  label: Practice (Abhyasa)
  body: Pause whenever you speak, and consciously focus on the word you are uttering, observing its sound and meaning without
    letting your thoughts merge them.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: A word, its meaning and the idea behing it are normally confused because of superimposition upon one another. By saṁyama
    on the word [or sound] produced by any being, knowledge of its meaning is obtained.
