sanskrit_devanagari: स्वविषयासंप्रयोगे चित्तसवृपानुकारे इवन्द्रियाणां प्रतियाहारः
sanskrit_iast: svaviṣayāsaṃprayoge cittasvarūpānukāra ivendriyāṇāṃ pratyāhāraḥ
translation_literal: When the senses are not engaged with their own objects, the mind takes on a form resembling the senses
  themselves—this is the withdrawal of the senses, pratyāhāra.
commentary: 'This sūtra (II.54) defines pratyāhāra, the fifth limb of yoga, by describing its mechanism rather than its result.
  The phrase svaviṣayāsaṃprayoge (''when not joined to their own objects'') establishes the condition: the senses have turned
  away from external stimuli. In that moment of non-engagement, something remarkable occurs: cittasvarūpānukāra (''the mind
  assumes a form resembling [the senses]''). This is not dissociation or numbness, but an imitation—the mind itself becomes
  sense-like, taking on the quality of sensory apparatus without the sensory content.


  Within the Yoga–Sāṃkhya framework, this is crucial: normally the mind (citta) is shaped by its objects through the senses
  (indriyāṇāṃ). In pratyāhāra, that dependency inverts. The senses lose their pull toward external objects, and the mind,
  freed from that gravitational field, mirrors the senses'' own nature—their capacity to receive, their openness, their sensitivity—but
  now turned inward or neutralized. The indriyāṇāṃ (senses) are not destroyed; they are withdrawn (pratyāhāra, literally ''drawing
  back''), like a tortoise retracting its limbs.


  This is not suppression but a reorientation of sensory capacity. It is the gateway between the external disciplines (yama,
  niyama, āsana, prāṇāyāma) and the internal ones (dhāraṇā, dhyāna, samādhi). Without pratyāhāra, the mind remains enslaved
  to sense-objects; with it, the mind becomes its own master, capable of concentration.


  Key Terms


  **pratyāhāra** — Withdrawal or drawing-back of the senses from external objects; the fifth limb of yoga, wherein sensory
  capacity is reoriented inward or neutralized rather than suppressed.

  **indriyāṇāṃ** — The senses (sight, hearing, smell, taste, touch); the channels through which the mind normally engages
  with external objects.

  **citta** — The mind-field or consciousness-stuff; the medium in which mental modifications (vṛtti) arise and are witnessed.'
insight: The central claim of this sutra is that abstraction is not merely a mental act but a coordinated withdrawal of the
  senses from their external objects, allowing the mind to dominate perception.
practice: Close your eyes and let your ears, eyes, nose, tongue, and skin go slack—as if they were empty vessels with no one
  home behind them. Notice how, in that abandonment, your mind itself begins to *feel* like an open ear, a receptive surface
  with no agenda. Hold this mirroring for as long as the sensation stays alive, then return to one sense at a time as you
  open your eyes.
