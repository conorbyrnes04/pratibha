sanskrit_devanagari: स्वविषयासंप्रयोगे चित्तसवृपानुकारे इवन्द्रियाणां प्रतियाहारः
sanskrit_iast: svaviṣayāsaṃprayoge cittasvarūpānukāra ivendriyāṇāṃ pratyāhāraḥ
translation_literal: The mind imitates the objects of the senses; this is the practice of abstraction, whereby the senses
  withdraw from their objects and align with the mind.
commentary: 'The central claim of this sutra is that abstraction is not merely a mental act but a coordinated withdrawal of
  the senses from their external objects, allowing the mind to dominate perception. In the Yoga and Sāṃkhya framework, this
  aligns with the notion that the mind (citta) is the locus of all mental activity, while the senses (indriyas) are the conduits
  of external information. By ‘pratyāhāra’—the first of the eight limbs of yoga—one learns to retract the senses, thereby
  preventing the mind from being distracted by sensory flux. This sutra therefore bridges the abstract theory of mind with
  a concrete practice: the disciplined retraction of sensory input. The Dvivedi commentary elaborates that the senses become
  “assimilated” to the mind, a process that mirrors the Sāṃkhya idea of the mind’s interaction with prakṛti. The existential
  implication is profound: by mastering pratyāhāra, one gains the ability to focus the mind on a single object, a prerequisite
  for samādhi. This sutra thus offers a practical entry point into the higher yogic states, showing how the withdrawal of
  sensory data is the first step toward liberation.


  Key Terms


  **citta (चित्त)** — citta (mind) – in Sāṃkhya, the active, thinking principle; in Yoga, the locus of mental activity; the
  sutra treats it as the target of sensory withdrawal, a nuance often lost in literal translations


  **pratyāhāra (प्रत्याहार)** — pratyāhāra (retraction) – the first limb of yoga; here defined as the withdrawal of the senses
  from their objects, enabling the mind to dominate perception


  **indriyas (इन्द्रियाणि)** — indriyas (senses) – in Sāṃkhya, the interface between prakṛti and puruṣa; the sutra emphasizes
  their assimilation to the mind, a subtle shift from mere perception to controlled influence


  Cross-Tradition Resonances


  **Yoga Sutras 2.54:** Structural homology: the sutra’s phrase ‘cittasvarūpānukāra’ parallels the earlier 2.32 ‘cittamātraḥ’
  in its focus on the mind’s form; both emphasize the mind’s primacy.

  *Divergence:* While 2.32 speaks of the mind alone, 2.54 introduces the senses as active participants, expanding the scope
  from internal cognition to external sensory control


  **Samkhya Karika 3.1:** Both texts describe the mind’s interaction with prakṛti via the senses; the sutra’s pratyāhāra mirrors
  the Karika’s notion of ‘pratibimba’ (reflection).

  *Divergence:* The sutra frames this interaction as a deliberate practice, whereas the Karika presents it as a natural phenomenon
  of prakṛti


  **Dvivedi Commentary, 2.54:** Dvivedi’s description of the senses becoming ‘assimilated’ to the mind echoes the sutra’s
  idea of withdrawal; both highlight the active role of the mind in shaping perception.

  *Divergence:* Dvivedi expands the sutra’s terse statement into a detailed process of control, adding the notion of continuous
  readiness, which the sutra itself does not explicitly state'
insight: The central claim of this sutra is that abstraction is not merely a mental act but a coordinated withdrawal of the
  senses from their external objects, allowing the mind to dominate perception.
practice: Withdraw your senses from their objects and align them with your mind, allowing the mind to dominate perception.
