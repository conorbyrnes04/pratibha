sanskrit_devanagari: ते प्रतिप्रसवहेयाः सूक्ष्माः
sanskrit_iast: te pratiprasavaheyāḥ sūkṣmāḥ
translation_literal: Those subtle ones are removed by returning them to their source.
commentary: 'This sūtra addresses the dissolution of sūkṣmā vṛtti—the fine, barely perceptible fluctuations
  of mind that persist even after gross distractions have been stilled. These are not the obvious thought-forms
  (like planning, memory, or sensory chatter) but the delicate impressions, latent tendencies, and half-formed
  mental movements that hover at the threshold of consciousness.


  The method is pratiprasava—literally ''reverse flow'' or ''return to origin.'' Rather than fighting
  these subtle disturbances through suppression or force, the practitioner traces each fine ripple backward
  to its generative source: the unmanifest field of prakṛti (nature) from which all mental content arises.
  In the Sāṃkhya-Yoga framework, this is the return of the differentiated (sūkṣma) to the undifferentiated
  (pradhāna).


  This is not rejection but reabsorption. When attention gently follows a subtle distraction inward to
  its root—the silent ground from which it emerged—the disturbance naturally dissolves. The practitioner
  does not push the thought away; instead, consciousness moves upstream, and the subtle fluctuation loses
  coherence and returns to potential rather than manifest form.


  This sūtra typically appears in the context of the five obstacles (kleśa) and their remedies, and marks
  the transition from gross to increasingly refined stages of mental clarification. It presumes the practitioner
  has already stabilized attention enough to perceive these delicate movements.


  Key Terms


  **sūkṣmā** — subtle, fine; here, the delicate, barely perceptible fluctuations of mind that linger after
  gross distractions have been stilled

  **pratiprasava** — reverse flow, return to origin; the process of tracing a manifest phenomenon back
  to its unmanifest source

  **vṛtti** — fluctuation, modification, or wave-form of the mind; any mental content or movement'
insight: The sutra asserts that the most insidious disturbances are the subtle ones, and that their suppression
  is the primary task of the practitioner.
practice: When a thought dissolves but leaves a faint trace—a ghost-impression, a half-felt pull—reverse
  your attention inward like rewinding a thread, following that gossamer strand back through the layers
  until it vanishes into the stillness it came from. Do this each time you catch the tail-end of a subtle
  mental movement, without trying to name or analyze it; simply trace it home.
