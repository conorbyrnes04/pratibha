sanskrit_devanagari: द्रष्टा दृशिमात्रः शुद्धोऽपि प्रत्ययानुपश्यः
sanskrit_iast: draṣṭā dṛśimātraḥ śuddho 'pi pratyayānupaśyaḥ
translation_literal: The seer is pure vision alone, untouched by content, yet appears to witness the flow
  of mental impressions.
commentary: 'This sūtra stands at the heart of Patañjali''s metaphysics of consciousness. The draṣṭā (seer,
  the witnessing subject) is defined as dṛśimātraḥ—vision itself, nothing more, nothing less. This is
  the puruṣa of Sāṃkhya philosophy: pure, unchanging awareness stripped of all qualities, all modifications,
  all objects.


  The phrase śuddho ''pi (pure, even so) emphasizes that despite this radical purity, the seer is not
  inert or absent. The final clause, pratyayānupaśyaḥ, is the paradox: the seer "appears to witness" or
  "seems to follow" (anupaśyaḥ) the pratyaya—the mental impressions, thought-forms, and contents of consciousness.
  This is not true witnessing in the sense of active engagement; it is more like reflection. The seer''s
  purity is never compromised. Rather, the seer''s presence—its mere luminosity—illuminates the field
  of mental content (prakṛti), and this illumination creates the appearance that the seer is watching.


  This sūtra dissolves a common confusion: the seer does not *do* anything, does not *become* anything,
  does not *change* through observation. The seer is the unchanging ground of all seeing. What appears
  to be the seer''s involvement in mental life is actually the seer''s reflection in the mirror of the
  mind. Once this is deeply understood, the confusion between subject and object—between the witness and
  the witnessed—begins to unravel, and liberation (kaivalya) becomes possible.


  Key Terms


  **draṣṭā** — The seer; the witnessing subject; puruṣa; pure consciousness itself

  **pratyaya** — Mental impression, thought-form, or content of consciousness; the modifications of the
  mind (citta-vṛtti)

  **puruṣa** — Pure spirit or consciousness in Sāṃkhya-Yoga; the unchanging witness, distinct from prakṛti
  (matter/nature)'
insight: The passage asserts that the seer (puruṣa) is inherently pure gnosis, yet his act of seeing is
  limited to the appearance of the object, mediated by intellect.
practice: 'Hold your gaze on a fixed point—a candle flame, a leaf, a crack in the wall—for several minutes
  without trying to understand it or name what you see. Let the object''s details flow past your awareness
  like clouds while you remain the still, untouched space where seeing happens. Notice: you are not the
  seeing itself, but the luminosity that makes seeing possible.'
