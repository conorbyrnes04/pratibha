sanskrit_devanagari: विसोकाः वा ज्योतिष्मती
sanskrit_iast: viśokā vā jyotiṣmatī
translation_literal: Or [samādhi may be attained through meditation on] the sorrowless [state], which
  shines with light.
commentary: 'This sūtra presents an alternative path to samādhi through what Patañjali calls viśokā—a
  condition free from sorrow or grief. The term viśokā (vi-śoka) literally means ''without sorrow,'' pointing
  to a mental state untouched by suffering, loss, or emotional turbulence. This is paired with jyotiṣmatī,
  ''radiant'' or ''luminous,'' suggesting that this sorrowless condition naturally manifests as inner
  brightness or clarity.


  Within the Yoga–Sāṃkhya framework, this verse acknowledges that samādhi need not be forced through breath
  control (prāṇāyāma) or sense withdrawal alone. Instead, one may cultivate samādhi by consciously dwelling
  in or recalling states of freedom from pain—moments when the mind is untroubled and luminous. This is
  a contemplative rather than forceful approach.


  The ''light'' (jyotiṣmatī) is not external illumination but the natural radiance of consciousness when
  it is no longer clouded by grief, anxiety, or mental contraction. In classical yoga, this inner light
  is understood as the reflection of puruṣa (pure awareness) becoming visible as the mind settles into
  its natural transparency. The practice recognizes that sorrow and contraction obscure consciousness;
  their absence reveals it.


  This sūtra also connects to Patañjali''s earlier teaching that samādhi arises through faith, vigor,
  memory, concentration, and discernment (1.20). Here, the emphasis falls on cultivating a mental state—sorrowlessness—that
  becomes the gateway. It is a reminder that yoga is not only technique but also the cultivation of inner
  conditions that allow consciousness to recognize itself.


  Key Terms


  **viśokā** — sorrowless, free from grief or pain; a mental state unobstructed by suffering

  **jyotiṣmatī** — luminous, radiant, shining; the natural clarity of consciousness when unobscured

  **samādhi** — absorption or integration; the state in which the mind, object, and knower merge into
  unified awareness'
insight: The sūtra declares that the mind, when it is either free from sorrow or illuminated by light,
  achieves the state of samādhi.
practice: 'Sit comfortably and bring to mind a moment when you felt genuinely free from worry—perhaps
  after completing meaningful work, in nature, or in the presence of someone you trust. Do not strain
  to recreate the emotion; simply recall the quality of that state: the absence of heaviness, the openness,
  the clarity. Notice how your body feels when you touch that memory—the relaxation in your chest, the
  ease in your breath. Rest your attention there for 5–10 minutes, not grasping at the feeling but allowing
  it to be present. If sorrow or distraction arises, gently return to the quality of sorrowlessness itself,
  as if you are recognizing a light that was always there beneath the clouds. This is not escapism but
  the direct cultivation of a mental condition in which samādhi naturally emerges.'
