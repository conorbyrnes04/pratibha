- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra declares that the mind, when it is either free from sorrow or illuminated by light,
    achieves the state of samādhi. This duality is not a mere contrast but a synthesis: sorrowlessness
    (viśokā) is the absence of pain, while light (jyotiṣmatī) is the presence of sattvic clarity. The
    philosophical claim is that samādhi is realized when the mind transcends both negative and positive
    polarities, arriving at a neutral, luminous awareness. The contested move is the identification of
    light with the pure sattva quality; some commentators insist that light is merely a metaphor for insight,
    whereas others treat it as a literal radiance of consciousness. Within the Yoga and Sāṃkhya framework,
    this sūtra situates samādhi as the culmination of puruṣa’s discernment from prakṛti, where the mind’s
    vṛtti (mental fluctuations) are stilled. The existential application is that practitioners can cultivate
    a sorrowless, luminous mind by purifying their thoughts and aligning breath with the subtle prāṇas,
    thereby stabilizing the mind’s fluctuations. Dvivedi’s commentary reinforces this by linking the light
    to the eight-petaled lotus of the heart, suggesting a meditative posture that invites the four prāṇas
    and the point (bindu) to coalesce into a single luminous center. This integration of body and mind
    exemplifies the Yoga principle that samādhi is both a psychological and physiological state, achieved
    through disciplined practice and inner awareness.


    Key Terms


    **viśokā (विसोकः)** — viśokā (sorrowless) -> Sāṃkhya: absence of pain; Yoga: state of equanimity


    **jyotiṣmatī (ज्योतिष्मती)** — jyotiṣmatī (full of light) -> Sāṃkhya: manifestation of sattva; Yoga:
    luminous awareness


    **samādhi (समाधि)** — samādhi (concentration) -> Sāṃkhya: state of pure consciousness; Yoga: union
    of puruṣa with prakṛti


    **vṛtti (वृत्ति)** — vṛtti (mental fluctuation) -> Sāṃkhya: variations of mind; Yoga: obstacle to
    samādhi


    Cross-Tradition Resonances


    **Yoga Sūtra 1.36:** dual description of mind as sorrowless or luminous mirrors the earlier 1.35’s
    emphasis on mind’s fluctuation; both use a binary to capture a spectrum.

    *Divergence:* While 1.35 focuses on the mind’s agitation, 1.36 presents its resolution, shifting from
    negative to positive polarity


    **Yoga Sūtra 1.33:** Both invoke the mind’s capacity to be either in pain or in light, underscoring
    the role of prāṇa in stabilizing consciousness.

    *Divergence:* 1.33 describes the mind’s fluctuation in terms of prāṇa, whereas 1.36 abstracts to sorrowlessness/luminance,
    showing a move from mechanistic to phenomenological framing


    **Sāṃkhya Kāṇḍa 2.5:** The duality of sorrowlessness and light parallels the Sāṃkhya distinction between
    puruṣa (consciousness) and prakṛti (matter).

    *Divergence:* Sāṃkhya presents the duality as ontological, whereas the Yoga sūtra presents it as experiential
    states of mind


    **Dvivedi, Commentary on 1.36:** Dvivedi’s reference to the lotus heart and prāṇas echoes the Yoga
    emphasis on bodily meditations to achieve samādhi.

    *Divergence:* Dvivedi adds a concrete bodily practice (lotus posture) absent in the terse sūtra, illustrating
    how the same textual idea can be expanded into praxis'
