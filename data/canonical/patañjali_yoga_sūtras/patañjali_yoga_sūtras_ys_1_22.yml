title: Mild, Moderate, Excessive Samādhi
unit_type: sutra
sanskrit_devanagari: मृदुमध्यमध्यिमात्रत्वात ततः अपि विशेषः
sanskrit_iast: mṛdumadhyādhimātratvāt tato 'pi viśeṣaḥ
translation_literal: From the mild, moderate, and excessive grades of samādhi, there arises a further
  distinction.
commentary: 'This sūtra (II.41 in the standard numbering) marks a crucial refinement in Patañjali''s account
  of samādhi. Having established that samādhi is the natural fruit of practice (abhyāsa) and non-attachment
  (vairāgya), he now acknowledges that samādhi itself exists in graduated intensities—not as a binary
  state but as a spectrum of depth and stability.


  The three grades—mṛdu (mild), madhya (moderate), and adhimātra (excessive)—describe the force and clarity
  with which consciousness settles into its object. A mild samādhi may flicker, waver, or remain shallow;
  the meditator touches the threshold of absorption but does not fully stabilize there. Moderate samādhi
  holds steady; the mind rests in the object with consistent attention and begins to yield insight. Excessive
  samādhi is intense, unwavering, and saturated with direct knowing—the boundary between subject and object
  grows transparent.


  The phrase tato ''pi viśeṣaḥ (''from that, moreover, a distinction'') signals that even within these
  grades, further nuance emerges. Different practitioners will naturally gravitate toward different depths
  depending on their constitution (prakṛti), prior conditioning (saṃskāra), and the particular object
  of meditation. The Yoga Sūtras do not prescribe a single path but recognize that the architecture of
  consciousness unfolds differently for each person. This verse prevents the false expectation that samādhi
  is monolithic or that all practitioners will experience it identically.


  Within the Sāṃkhya framework underlying the Yoga Sūtras, this graduated view aligns with the principle
  that prakṛti (nature) manifests in infinite modulations. Just as the guṇas (sattva, rajas, tamas) combine
  in different proportions to create the visible world, so too the quality of samādhi reflects the predominant
  guṇa in the meditator''s mind. A sattvic (luminous) mind naturally tends toward clearer, more stable
  absorption; a rajasic (active) mind may experience restless or forceful samādhi; a tamasic (inert) mind
  may slip into dullness even in meditation.


  This sūtra also implies that practitioners should not judge their progress by comparison to others or
  by an idealized standard. The mild samādhi of a sincere beginner is valid and fruitful; it plants the
  seed of genuine meditation. Over time, through consistent practice and the natural ripening of the mind,
  that mild absorption may deepen into moderate, then into more profound states. The distinction is not
  hierarchical judgment but phenomenological description—a map to help practitioners recognize where they
  actually are and trust the process.


  Key Terms


  **mṛdu** — Mild, soft, or gentle; in samādhi, a shallow or wavering absorption with intermittent clarity.

  **madhya** — Middle or moderate; in samādhi, a steady, balanced state of attention with sustained focus
  on the object.

  **adhimātra** — Excessive, intense, or supreme; in samādhi, a powerful, unwavering absorption marked
  by vivid direct knowing.'
insight: The claim here is that the depth of samādhi is not a single continuum but a triadic classification
  that mirrors the threefold gradations of effort and feeling found in the preceding verses.
practice: During your next meditation or focused activity, deliberately notice the exact moment when your
  attention shifts from wavering (mild) to steady (moderate)—mark it with a slight nod of your head. Then
  continue watching for the threshold where steadiness begins to deepen into luminous clarity (excessive),
  and mark that too with another nod. Repeat this three-part recognition daily until you can feel these
  grades arising and passing like waves, without clinging to any of them.
