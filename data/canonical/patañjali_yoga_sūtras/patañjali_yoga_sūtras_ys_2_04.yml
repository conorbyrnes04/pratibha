title: Ignorance as Root of Distraction
unit_type: sutra
sanskrit_devanagari: अविद्या क्षेत्रं उत्तरेषां प्रसुप्ततानुविचिन्नोदाराणाम्
sanskrit_iast: avidyā kṣetram uttareṣāṃ prasuptatanuvicchinnodārāṇām
translation_literal: Ignorance is the field in which the other afflictions—whether dormant, attenuated,
  interrupted, or fully active—take root and grow.
commentary: 'This sūtra (YS 2.4) establishes avidyā (ignorance) as the foundational condition underlying
  all kleśas (afflictions). The verse employs an agricultural metaphor: ignorance functions as the soil
  (kṣetram) that nourishes the remaining four kleśas—asmitā (ego-sense), rāga (attachment), dveṣa (aversion),
  and abhiniveśa (fear of death).


  The phrase ''uttareṣāṃ prasuptatanuvicchinnodārāṇām'' describes the four states in which these afflictions
  exist:


  1. **Prasuptā** (dormant)—latent, not currently active but present in the unconscious substrate

  2. **Tanu** (attenuated)—weakened or thinned through practice, yet not eliminated

  3. **Vicchinna** (interrupted)—temporarily suspended through meditation or favorable conditions

  4. **Udāra** (fully active/gross)—manifesting openly in thought, speech, and action


  The critical insight is that ignorance itself must be addressed first. No matter which state the other
  kleśas occupy, they cannot be truly dissolved without removing the ignorance that permits them to exist.
  Ignorance is the humus; the other afflictions are seeds. Without the soil, they cannot germinate or
  persist.


  In the Yoga–Sāṃkhya framework, avidyā is the mistaking of the non-Self (prakṛti, the field of nature)
  for the Self (puruṣa, pure consciousness). This fundamental confusion generates all subsequent suffering.
  The other kleśas are merely expressions or consequences of this root error.


  Key Terms


  **avidyā** — Ignorance; the fundamental misperception of prakṛti (nature/non-self) as puruṣa (consciousness/self),
  the root of all affliction

  **kleśa** — Affliction or obstacle; the five are avidyā, asmitā, rāga, dveṣa, and abhiniveśa

  **kṣetram** — Field; the fertile ground or substrate in which conditions arise and persist'
insight: The central claim of this sutra is that ignorance (avidyā) is the ontological source of all five
  causes of distraction (vṛtti).
practice: '**Daily Ignorance Audit (10 minutes)**


  Each morning or evening, sit quietly and identify one assumption you hold about yourself, your body,
  or your life that you have never directly verified. Examples: ''I am not capable of meditation,'' ''My
  body is weak,'' ''I need external approval to be worthy.''


  Write it down. Then ask: *Where did this belief come from? Is it actually true, or is it a story I inherited
  or accepted without inquiry?* Sit with the discomfort of not-knowing for 2–3 minutes.


  This practice directly weakens avidyā by introducing conscious doubt into habitual assumptions. Over
  weeks, you begin to notice how many of your reactions, attachments, and aversions rest on unexamined
  beliefs—the very ignorance Patañjali names. As you observe this, the field itself becomes visible, and
  its grip loosens.'
