pratibha_layers:
- kind: original
  label: Original
  body: अविद्या क्षेत्रं उत्तरेषां प्रसुप्ततानुविचिन्नोदाराणाम्
- kind: iast
  label: IAST
  body: avidyā kṣetram uttareṣāṃ prasuptatanuvicchinnodārāṇām
- kind: translation
  label: Pratibha Translation
  body: Ignorance is the field of the five causes of distraction, which arise in the directions of the
    four states of the mind.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this sutra is that ignorance (avidyā) is the ontological source of all five
    causes of distraction (vṛtti). It asserts that the field of ignorance is not a passive backdrop but
    an active generator that manifests itself in the four qualitative states of the mind—dormant, attenuated,
    over‑powered, and expanded. This is a contested move because it elevates ignorance from a mere epistemic
    defect to a metaphysical principle that shapes the very structure of mental activity. In the Yoga‑Sāṃkhya
    tradition, such a stance aligns with the view that prakṛti, through its ignorance, produces the multiplicity
    of vṛtti, yet it diverges from the more neutral Sāṃkhya account where ignorance is simply a property
    of prakṛti without causal primacy. The sutra’s insistence on ignorance as the root invites an existential
    application: by recognizing ignorance as the field that conditions all distractions, one can target
    its dissolution through disciplined practice, thereby moving toward samādhi. Dvivedi’s commentary
    expands this by classifying the distractions into four experiential categories, illustrating how ignorance
    manifests differently across states of consciousness. This practical taxonomy underscores the sutra’s
    philosophical claim and provides a roadmap for practitioners to identify and neutralize the specific
    form of ignorance that governs their current mental state.


    Key Terms


    **avidyā (अविद्या)** — ignorance -> primal ignorance of prakṛti -> the field that generates all vṛtti;
    standard translation ‘ignorance’ omits its ontological generative role


    **vṛtti (वृत्ति)** — mental modifications -> in this sutra, the five causes of distraction; standard
    translation ‘modifications’ fails to capture the causal network


    **samādhi (समाधि)** — state of absorption -> here defined as the condition where distractions are
    reduced to zero; standard translation ‘concentration’ misses the eliminative aspect


    Cross-Tradition Resonances


    **Yoga Sūtra 2.4:** identifies ignorance as the field of the five causes of distraction, paralleling
    YS 2.5 which lists the causes themselves

    *Divergence:* while 2.5 enumerates the causes, 2.4 attributes them all to a single source, thereby
    unifying the causal chain


    **Sāṃkhya Kārikā 2.1:** both texts posit ignorance as a fundamental principle of prakṛti

    *Divergence:* Sāṃkhya treats ignorance as a property of prakṛti, whereas the Yoga sutra treats it
    as the active generator of vṛtti


    **Bhāvanā‑Śāstra 1.2:** both discuss the four states of mind (dormant, attenuated, over‑powered, expanded)

    *Divergence:* Bhāvanā‑Śāstra focuses on meditative cultivation, whereas the sutra uses these states
    to classify the manifestations of ignorance'
- kind: key_terms
  label: Key Terms
  items:
  - term: avidyā (अविद्या)
    definition: 'a- + vidyā ‘non-knowing’ — mis-seeing the permanent/impure/self etc. -> in “Ignorance
      as Root of Distraction”: ignorance -> primal ignorance of prakṛti -> the field that generates all
      vṛtti -> not simple ignorance of facts; structural misidentification that parents the other kleśas'
    lemma_id: vidya
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Ignorance as Root of Distraction”:
      mental modifications -> in this sutra, the five causes of distraction -> not ‘bad thoughts’ only
      — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Ignorance as Root of Distraction”: state
      of absorption -> here defined as the condition where distractions are reduced to zero -> not trance-entertainment
      or unconsciousness; graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: kleśa (क्लेश)
    definition: '√kliś ‘afflict, torment’ → afflictive root-patterns -> in “Ignorance as Root of Distraction”:
      the five are avidyā, asmitā, rāga, dveṣa, and abhiniveśa -> not mere ‘stress’; five deep causes
      (avidyā etc.) that generate suffering and rebirth'
  - term: kṣetram
    definition: 'source-term kṣetram -> in “Ignorance as Root of Distraction”: the fertile ground or substrate
      in which conditions arise and persist -> default English flattens the technical work this term does
      here'
