sanskrit_devanagari: 'ईश्वरप्रणिधानाद वा ॥ १.२३ ॥


  क्लेशकर्मविपाकाशयैः अपरामृत्स्‌त्‌पुरुषविशेषः ईश्वरः ॥ १.२४ ॥


  तत्र निरितिशायम् सर्वज्ञबीजम् ॥ १.२५ ॥


  पूर्वेषाम् अपि गुरुः कालेनावच्छेदात् ॥ १.२६ ॥


  तस्य वाचकः प्राणवः ॥ १.२७ ॥


  तज्जपः तदर्थभावनम् ॥ १.२८ ॥


  ततः प्रत्यक्ष‑चेतना‑अधिगमः अपि अन्तराय‑भावः च ॥ १.२९ ॥'
sanskrit_iast: 'īśvarapraṇidhānād vā || 1.23 ||


  kleśakarmavipākāśayair aparāmṛṣṭaḥ puruṣaviśeṣa īśvaraḥ || 1.24 ||


  tatra niratiśayaṃ sarvajñabījam || 1.25 ||


  pūrveṣām api guruḥ kālenānavacchedāt || 1.26 ||


  tasya vācakaḥ praṇavaḥ || 1.27 ||


  tajjapas tadarthabhāvanam || 1.28 ||


  tataḥ pratyakcetanādhigamo ''py antarāyābhāvaś ca || 1.29 ||'
translation_literal: '**1.23** By devotion to the Supreme (Iśvara).

  **1.24** The particular soul, untouched by afflictions, works, fruition, and impressions, is the distinct Purusha [Ishvara].

  **1.25** There, the seed of all‑knowing is fixed in its ultimate form.

  **1.26** Even for the teacher, the past and future do not cut him off; he remains unconditioned by time.

  **1.27** His indicator is the word of glory.

  **1.28** You repeat the word, and you meditate upon its meaning.

  **1.29** Hence the attainment of cognition of the subjective and the absence of obstacles arise.'
commentary: 'Patañjali''s cluster (1.23–1.29) constructs a single argument: that samādhi—the cessation of mental modification
  (vṛtti-nirodha)—is accessible through devotion to Īśvara, a particular liberated Puruṣa who stands as the paradigm of untouched
  consciousness. The move is both metaphysical and soteriological. Īśvara is not Brahman, nor is he merely a psychological
  construct; he is a specific Puruṣa eternally free from kleśa (affliction), karma (action), vipāka (fruition), and āśaya
  (latent impressions)—the very mechanisms that bind ordinary consciousness to prakṛti. By fixing devotion on this figure,
  the practitioner does not escape into abstraction but orients toward a concrete, realized state. The seed of omniscience
  (ājñāna-bīja) dwells in Īśvara in its ultimate, unfolded form, uncut by time or causality. This is crucial: Īśvara transcends
  the temporal order that governs all conditioned beings, making him the sole teacher who remains unconditioned by past and
  future. The practical gate is the sacred syllable OM (praṇava), Īśvara''s indicator. Repetition and meditation on OM''s
  meaning (japa and dhyāna) are not devotional ornaments but direct methods of aligning the practitioner''s citta with the
  divine model. Through this practice, two fruits ripen: direct cognition of the inner self (ātma-jñāna) and the removal of
  obstacles (antarāya-abhāva). The framework is Sāṃkhya-Yoga: prakṛti binds through identification; Puruṣa is eternally free.
  Īśvara exemplifies this freedom in a form the mind can contemplate. Surrender (prapatti) here is not passivity but the active
  dissolution of false agency—recognizing that the vṛtti-generating ego is not the self. By meditating on one who has already
  achieved this recognition, the practitioner''s own vṛtti gradually lose their binding power, and the untouched witness (sākṣī)
  emerges as one''s true nature.


  Key Terms


  **Īśvara** — A particular liberated Puruṣa, eternally free from affliction and karma, serving as the supreme object of devotion
  and the paradigm of kaivalya

  **praṇava (OM)** — The sacred syllable, Īśvara''s acoustic indicator, used in japa and dhyāna to align consciousness with
  the divine model

  **vṛtti-nirodha** — Cessation of mental modifications; the core aim of yoga, achieved through devotion to Īśvara

  **kaivalya** — Isolation or absolute freedom of Puruṣa from prakṛti; the final liberation exemplified by Īśvara and attainable
  by the practitioner


  Cross-Tradition Resonances


  **Bhagavad Gītā 12.6–7 (bhakti-yoga path):** Both texts present devotion as a direct path to liberation, with the deity
  (Kṛṣṇa / Īśvara) as the supreme refuge; surrender of agency dissolves the ego-bound mind Divergence: The Gītā emphasizes
  action (karma-yoga) performed with devotion in the world; Patañjali''s Īśvara is transcendent and untouched by time, requiring
  inward meditation rather than engaged duty

  **Plotinus, Enneads VI.9 (The One as transcendent principle):** Both posit an ultimate principle beyond all modification
  and time, accessible through contemplative alignment; the practitioner''s consciousness mirrors the divine model Divergence:
  Plotinus'' One is utterly impersonal and beyond knowledge; Īśvara, though transcendent, is the seed of omniscience and a
  personal object of devotion

  **Epictetus, Enchiridion 1.1 (what is and is not in our control):** Both teach that true freedom lies in relinquishing false
  agency and aligning will with a higher order; obstacles dissolve when the ego ceases to resist Divergence: Epictetus grounds
  freedom in rational assent to natural law; Patañjali grounds it in devotional absorption into Īśvara''s transcendent model,
  requiring meditation on the sacred syllable'
insight: The claim here is that the highest state of samādhi—Parasādhi—can be attained not only through the elimination of
  attachment but also by an absolute surrender to the will of Iśvara.
practice: You observe the flow of your thoughts and feelings, and consciously remind yourself that you, like the Teacher,
  are not cut off by past or future—your awareness remains the same, whether you are in the present moment or recalling yesterday’s
  events.
