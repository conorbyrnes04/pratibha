sanskrit_devanagari: 'जन्मौषधिमन्त्रतपःसमाधिजाḥ सिद्धयः ॥ ४.१ ॥


  जैत्यन्तरपरिणामः प्रकृतिपूरात् ॥ ४.२ ॥


  निमित्तं अप्रयोजकं प्रकृतीनां वरणभेदस तु ततः क्षेत्रिकवत् ॥ ४.३ ॥'
sanskrit_iast: 'janmauṣadhimantratapaḥsamādhijāḥ siddhayaḥ || 4.1 ||


  jātyantarapariṇāmaḥ prakṛtyāpūrāt || 4.2 ||


  nimittam aprayojakaṃ prakṛtīnāṃ varaṇabhedas tu tataḥ kṣetrikavat || 4.3 ||'
translation_literal: '**4.1** Perfections (siddhayaḥ) arise from birth, herbs, incantations, austerity (tapaḥ), and absorption
  (samādhi).

  **4.2** The transformation into another form springs from nature''s abundance (prakṛti-āpūrāt).

  **4.3** An instrumental cause (nimitta) does not set nature in motion; it merely breaks through the obstruction—as a farmer
  breaks the dam, not the water.'
commentary: 'These three sūtras form a single argument about the mechanics of transformation and the practitioner''s place
  within them. Patañjali establishes that siddhis (extraordinary capacities) are not magical accidents but fruits of prior
  yogic work embedded in the causal continuum—a claim that immediately situates practice within karma and rebirth. He then
  moves outward: the same principle that produces siddhis also governs the overflow (āpūra) of prakṛti itself, the ceaseless
  transformation of species and states. This is not chaos but lawful flux. The third sūtra then performs the crucial philosophical
  move: the causal principle is not external, not a separate god or ineffable force, but intrinsic to prakṛti''s own nature.
  The field (kṣetra) metaphor is decisive. Just as a farmer does not create water but removes obstacles so it flows naturally,
  the yogin does not generate consciousness or siddhis but clears the vṛtti (mental fluctuations) that obstruct prakṛti''s
  orderly unfolding. This preserves the puruṣa-prakṛti dualism while denying any need for external intervention—whether divine
  grace, substances, or mantras. The implication is radical: your effort, guided by method, suffices. Siddhis arise not from
  acquiring something foreign but from the practitioner aligning with prakṛti''s intrinsic causal momentum through samādhi.
  Kaivalya (liberation) is thus not escape from prakṛti but the puruṣa''s recognition of its own unchanging nature amid prakṛti''s
  perpetual transformation. The cluster teaches that understanding the law of transformation is itself transformative.


  Key Terms


  **siddhis** — extraordinary powers or capacities that arise as fruits of yogic practice and prior karma

  **prakṛti** — primordial matter or nature; the dynamic, self-transforming principle that generates all manifest forms

  **kṣetra** — field; the arena of prakṛti''s manifestation where the yogin''s effort removes obstacles to natural flow

  **vṛtti** — mental fluctuations or modifications of consciousness that obscure the puruṣa''s true nature


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** Both texts ground action (karma) in a lawful, self-sustaining cosmic order (prakṛti/svabhāva) and
  teach that the practitioner succeeds by aligning effort with that order rather than imposing will externally. Divergence:
  The Gītā emphasizes duty (dharma) and devotion as the primary means of alignment, whereas Patañjali privileges direct meditative
  insight (samādhi) into the mechanics of prakṛti itself.

  **Epictetus, Enchiridion 1:** Both teach a sharp distinction between what lies in one''s control (inner effort, mental discipline)
  and what does not (external outcomes, the flux of events), and both argue that freedom lies in mastering the former. Divergence:
  Epictetus grounds this in rational will and virtue; Patañjali grounds it in the metaphysical dualism of puruṣa and prakṛti,
  making the distinction ontological rather than merely ethical.

  **Plotinus, Enneads III.8 (on Nature):** Both envision a hierarchical emanation from a transcendent principle through successive
  levels of manifestation, and both suggest that lower levels unfold according to their own intrinsic nature without external
  compulsion. Divergence: Plotinus''s emanation is a continuous overflow from the One; Patañjali''s prakṛti is eternal and
  co-equal with puruṣa, not subordinate to it, preserving strict dualism rather than monistic hierarchy.'
insight: The passage asserts that the causal factor of evolution is not an extraneous or futile element of prakṛti, but rather
  that the distinctions we observe in nature are merely the field‑like manifestation
practice: Observe the subtle shifts in your thoughts and sensations as they transform from one state to another, noting how
  each change feels like an overflow of a deeper, underlying reality.
