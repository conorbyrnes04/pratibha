sanskrit_devanagari: सा तु दीर्घकालान्तर्यसत्कारासेवितो दृढभूमिः
sanskrit_iast: sa tu dīrghakālanairantaryasatkārāsevito dṛḍhabhūmiḥ
translation_literal: That practice becomes firmly rooted when cultivated continuously, over a long duration,
  with sincere dedication and respect.
commentary: 'This sūtra (I.14) defines the threshold at which practice (abhyāsa) transitions from mere
  repetition into genuine transformation. Patañjali is answering a practical question: how long, and how
  intensely, must one practice before yoga yields stable results?


  The key terms work together as a progression:


  *Dīrghakāla* (long duration) rules out the fantasy of quick attainment. Yoga is not a weekend workshop.
  The classical texts speak of practice across years and lifetimes.


  *Nairantarya* (without interruption, continuous) specifies that sporadic effort—practicing intensely
  for three months, then abandoning it for six—does not build the necessary ground. Consistency matters
  more than intensity.


  *Satkāra* (respect, proper regard, sincere care) indicates that the practice must be undertaken with
  genuine commitment, not mechanical repetition or half-hearted compliance. You must actually value what
  you are doing.


  *Āsevita* (served, cultivated, attended to) suggests active engagement—the practitioner is not passive
  but deliberately tending the practice as one tends a garden.


  *Dṛḍhabhūmi* (firm ground, solid foundation) is the result: the nervous system, mind, and subtle body
  develop a stable substrate. Samādhi becomes possible not as a fleeting glimpse but as an accessible
  state. The practitioner''s inner life gains ballast.


  This sūtra is both encouraging and sobering. It promises that persistent, respectful practice *will*
  work—but it demands patience and consistency. It speaks to the modern practitioner''s impatience: there
  is no shortcut, but the path is reliable.


  Key Terms


  **dīrghakāla** — long duration; extended time; the recognition that transformation requires sustained
  engagement, not brief effort

  **nairantarya** — continuity without interruption; unbroken practice; consistency as essential to building
  stable ground

  **satkāra** — sincere respect, proper regard, genuine care; the quality of attention and reverence brought
  to practice'
insight: The sutra asserts that the essence of samādhi is not a fleeting moment of awareness but a sustained,
  unbroken state of firmness that crystallizes into second nature.
practice: Choose one action you do daily without thought—walking to work, washing dishes, making tea—and
  perform it tomorrow with full attention to each micro-movement, as an act of deliberate respect for
  the practice itself. Repeat this same action with the same quality of care for 40 consecutive days,
  treating any interruption as a reset to day one.
