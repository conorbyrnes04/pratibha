- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that the essence of samādhi is not a fleeting moment of awareness but a sustained,
    unbroken state of firmness that crystallizes into second nature. The claim is that true concentration
    is a permanent, resting posture of the mind, not a momentary recall. This aligns with the Sāṃkhya
    view that puruṣa, when detached from prakṛti, attains a steady state. The contested move is the emphasis
    on *antaryas* (interruption) as a barrier; some commentators read it as a mere procedural caution,
    but here it is a decisive boundary between ordinary practice and the permanent state of samādhi. The
    sutra’s structure mirrors earlier Yoga Sutra passages that link *dṛḍhabhūmi* (firm ground) with *samādhi*,
    yet it diverges by insisting that the firmness is achieved *antaryas* (without intermission) rather
    than merely *dīrghakālana* (long duration). This nuance is productive because it elevates the quality
    of practice from mere endurance to a continuous, unbroken internal focus. In everyday life, the implication
    is that one must cultivate a continuous, uninterrupted attention to the chosen object, thereby transforming
    habitual activity into a stable, meditative posture. The Dvivedi commentary’s reference to “second
    nature” echoes this, noting that the mind, though engaged in ordinary functions, rests in a state
    that is no longer subject to volitional fluctuation. Thus, the sutra offers an existential prescription:
    to practice with such steadiness that the mind itself becomes a fixed, unchanging ground, the very
    hallmark of samādhi.


    Key Terms


    **dṛḍhabhūmi (दृढभूमिः)** — etymology: ‘dṛḍha’ (firm) + ‘bhūmi’ (ground) → tradition: a stable, unshakable
    state of consciousness; default translation ‘firm ground’ misses the implication of inner permanence
    rather than external steadiness.


    **antaryas (अन्तर्यस्)** — etymology: ‘antara’ (interior) + ‘-yas’ (negative suffix) → tradition:
    uninterrupted, continuous practice; default translation ‘without intermission’ understates its role
    as a boundary between ordinary and samādhi states.


    **samādhi (समाधिः)** — etymology: ‘sam’ (together) + ‘ādh’ (to sit) + ‘i’ (suffix) → tradition: a
    state of complete absorption; default translation ‘concentration’ omits its quality as a resting,
    unchanging ground.


    Cross-Tradition Resonances


    **Yoga Sutra 1.13:** Both sutras use the metaphor of a firm ground (*dṛḍhabhūmi*) to describe the
    outcome of sustained practice.

    *Divergence:* While 1.13 speaks of the ground as a result of *dṛḍha* (firmness) alone, 1.14 adds the
    crucial modifier *antaryas* (without interruption), emphasizing continuity as the decisive factor.


    **Yoga Sutra 1.15:** The next sutra discusses the mind’s rest in *samādhi* as a state of *śānti* (peace).

    *Divergence:* 1.14’s focus on *antaryas* prefigures 1.15’s rest, but 1.15 does not explicitly link
    the rest to uninterrupted practice, making 1.14’s claim more prescriptive.


    **Bhaṭṭa Kaṇḍa, Yogabhāṣā:** Both texts describe *dṛḍhabhūmi* as a stable state achieved through *dṛḍha*
    practice.

    *Divergence:* Bhaṭṭa Kaṇḍa allows periodic breaks for reflection, whereas 1.14 insists on *antaryas*,
    thereby rejecting any pause.'
