sanskrit_devanagari: 'कर्माशुक्लाकृष्णं योगिनस् त्रिविधम् इतरेषाम् ॥ ४.७ ॥


  तसत् तद्विपाकानुगुणानाम् एवाभिव्यक्तिर् वासनानाम् ॥ ४.८ ॥


  जातिदेशकालव्यवहितानाम् अप्य आन्तर्यम् स्मृतिसंस्कारयोः एकरूपत्वात् ॥ ४.९ ॥


  तसाम् अनादित्वं चाशिषः नित्यत्वात् ॥ ४.१० ॥


  हेतुपलाःश्रयालम्बनैः सङ्ग्र्हीतत्वाद् एषाम् अभावः तदाभावः ॥ ४.११ ॥'
sanskrit_iast: 'karmāśuklākṛṣṇaṃ yoginas trividham itareṣām || 4.7 ||


  tatas tadvipākānuguṇānām evābhivyaktir vāsanānām || 4.8 ||


  jātideśakālavyavahitānām apy ānantaryaṃ smṛtisaṃskārayor ekarūpatvāt || 4.9 ||


  tāsām anāditvaṃ cāśiṣo nityatvāt || 4.10 ||


  hetuphalāśrayālambanaiḥ saṃgṛhītatvād eṣām abhāve tadabhāvaḥ || 4.11 ||'
translation_literal: '**4.7** The action of a yogin is neither white nor black; for others, it is threefold.

  **4.8** From that arise the manifestation of latent impressions (vāsanā) alone, according to the ripening of karma (vipāka).

  **4.9** There is unbroken continuity between memory and subliminal activation (saṃskāra), even when separated by birth,
  place, and time, because of their sameness of form.

  **4.10** These impressions are without beginning, since desire (āśis) is eternal.

  **4.11** Held together by cause, effect, support, and object, they cease to exist when those cease to exist.'
commentary: 'These five sūtras trace a single argument about the mechanics of liberation through the lens of vāsanā (latent
  impression). The movement is: the Yogi transcends karmic categorization (4.7) because vāsanās manifest only under specific
  conditions (4.8), yet desire itself persists as an unbroken chain of impression and memory across time (4.9), sustained
  by a beginningless will-to-live (4.10), until the four supports that hold impressions together dissolve (4.11). The underlying
  claim is that prakṛti''s machinery—the guṇas, vipāka (ripening), and the vasanas themselves—operates according to strict
  causal law, but the Yogi escapes this law not by moral perfection but by ceasing to generate new impressions. Patañjali''s
  move is subtle: he does not deny that ordinary beings are bound by karma (white, black, mixed); he asserts that the Yogi''s
  actions leave no karmic residue because they arise from a consciousness no longer identified with prakṛti''s fluctuations.
  This is possible only because vāsanās are not autonomous forces but require the alignment of conditions (guṇas, time, circumstance)
  to manifest. The Yogi, having withdrawn identification from the mind''s vṛtti, no longer creates the psychological conditions
  that would activate latent impressions. Yet for the unenlightened, desire persists as an identical impression whether unfulfilled
  or remembered, creating a perpetual loop. This loop is held in place by four supports: cause (hetu), effect (phala), basis
  (āśraya), and support (ālambana). When these four cease—when the Yogi ceases to identify with the mind''s contents, ceases
  to create new causes, and ceases to provide the psychological substrate for impressions to lodge—the vasanas simply dissolve.
  Kaivalya is thus not a mystical state but the natural consequence of withdrawing the conditions that sustain prakṛti''s
  hold on puruṣa.


  Key Terms


  **vāsanā** — Latent impression or subliminal desire-memory that persists in the mind and shapes future manifestations; the
  mechanism by which past actions condition present experience.

  **vipāka** — Ripening or favorable conditions; the specific alignment of guṇas and circumstances required for a vāsanā to
  manifest into conscious experience.

  **kaivalya** — Isolation or liberation; the state in which puruṣa is freed from identification with prakṛti''s modifications,
  achieved when the four supports of impressions dissolve.

  **guṇa** — Quality or strand of prakṛti (sattva, rajas, tamas); the fundamental constituents whose interplay determines
  the nature and manifestation of mental impressions.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47–48 (yoga as action without attachment):** Both texts argue that the liberated agent acts without generating
  karmic residue; the Gītā''s ''yoga is skill in action'' parallels Patañjali''s claim that the Yogi''s actions are neither
  white nor black because they arise from equanimity, not from ego-driven desire. Divergence: The Gītā emphasizes duty (dharma)
  and devotion to Kṛṣṇa as the path to actionless action, whereas Patañjali locates liberation in the withdrawal of identification
  from the mind''s impressions themselves, making it a purely cognitive-phenomenological process independent of devotional
  content.

  **Epictetus, Enchiridion (what is and is not in our control):** Epictetus argues that impressions (phantasiai) arise but
  we control our assent to them; similarly, Patañjali argues that vāsanās arise according to causal law, but the Yogi ceases
  to identify with them, thus breaking the chain of desire and memory. Divergence: Epictetus frames this as a matter of will
  and moral choice (prohairesis), whereas Patañjali frames it as a matter of discriminative knowledge (viveka) and the natural
  dissolution of supports; the Stoic emphasizes ethical agency, the Yogi the cessation of agency itself.

  **Plotinus, Enneads III.6 (on the unbroken chain of desire and the descent of soul):** Plotinus describes how the soul''s
  descent into matter is sustained by a continuous chain of desire and memory that perpetuates embodiment; Patañjali''s image
  of vāsanās held together by four supports mirrors this idea of a causal chain that must be broken for liberation. Divergence:
  Plotinus emphasizes the soul''s return to the One through contemplative ascent, whereas Patañjali emphasizes the cessation
  of the mind''s modifications; the Neoplatonic path is one of ascent and union, the Yogic path is one of isolation (kaivalya)
  and non-identification.'
insight: 'The central claim of this verse is that the persistence of mental impressions (vṛtti) depends on four interdependent
  conditions: causality (hetu), effect (phala), basis (mūla), and support (āśray).'
practice: Observe the desire to live arising in your mind; note its lack of a discernible beginning, and recognize that it
  springs from an eternal source, allowing you to detach and rest in the present moment.
