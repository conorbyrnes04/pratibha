unit_label: Distinction of Self and Mind
title: Distinction of Self and Mind
unit_type: sutra
sanskrit_devanagari: विशेषदर्शिन आत्माभावभावनानिवृत्तिḥ
sanskrit_iast: viśeṣadarśina ātmabhāvabhāvanānivṛttiḥ
translation_literal: For one who perceives the distinction between the Self and the mind, the false identification
  with mental formations ceases.
commentary: 'This sūtra marks a critical threshold in yoga practice: the recognition that the witnessing
  Self (ātman) is fundamentally separate from the mind''s content and movements. Patañjali uses viśeṣa—distinction
  or discrimination—as the operative faculty. The yogi who has cultivated this clear seeing (darśina)
  recognizes that thoughts, emotions, and mental constructs (bhāva) are objects arising within consciousness,
  not the consciousness itself. The term ātmabhāvabhāvanā—the false sense that the Self is identical with
  mental phenomena—dissolves through this discriminative insight. This is not intellectual understanding
  alone but direct perception born from sustained practice. The cessation (nivṛtti) is automatic; it requires
  no effort to ''stop'' identifying once the distinction becomes luminous. This verse sits at the heart
  of yoga''s liberatory mechanism: the mind continues to function, but the sense of being bound to it—of
  being *its* movements—falls away. The Self remains untouched, a silent witness. This is the foundation
  of kaivalya, isolation or aloneness of the Self.


  Key Terms


  **viśeṣa** — distinction, discrimination; the capacity to discern difference between Self and not-Self

  **ātman** — the Self; pure consciousness, witness, untouched by mental processes

  **bhāva** — mental formations, states, or phenomena; the content of mind'
insight: The central claim of this aphorism is that the cessation of all mental activity (vinivṛttiḥ)
  follows directly from the act of distinguishing the Self (ātmā) from the mind (citta).
practice: 'Sit quietly for 10 minutes. Notice thoughts, sensations, and emotions as they arise. With each
  one, silently ask: ''Who is aware of this thought?'' or ''Who is witnessing this feeling?'' Do not answer
  intellectually. Simply rest attention in the awareness that *observes* the mental event, not in the
  event itself. You will notice a subtle shift: the thought continues, but you are no longer fused with
  it. You are the space in which it appears. Return to this noticing whenever you catch yourself identified
  with a story or emotion. This is the seed of viśeṣa-darśana.'
