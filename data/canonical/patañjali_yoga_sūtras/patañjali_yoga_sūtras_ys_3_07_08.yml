sanskrit_devanagari: 'त्रयम् अन्तरङ्गं पूर्वेभ्यः ॥ ३.७ ॥


  तद् अपि बहिरङ्गं निर्बीजस्य ॥ ३.८ ॥'
sanskrit_iast: 'trayam antaraṅgaṃ pūrvebhyaḥ || 3.7 ||


  tad api bahiraṅgaṃ nirbījasya || 3.8 ||'
translation_literal: '**3.7** These three are inner limbs (antaraṅga) compared to the preceding ones (pūrva).

  **3.8** Yet even these are outer limbs (bahiraṅga) relative to the seedless state (nirbīja).'
commentary: 'These two sūtras trace a paradoxical inward movement that ultimately points beyond itself.
  Sūtra 3.7 elevates prāṇāyāma, dhāraṇā, and dhyāna as the intimate core of Yoga—closer to the self than
  the external limbs (yama, niyama, āsana, pratyāhāra). Yet 3.8 immediately qualifies this elevation:
  even these three, even samādhi itself, remain bahiraṅga—external, foreign to the unconditioned ground.
  The argument is not that internal practices are false or useless; rather, it traces the structure of
  prakṛti itself, which includes all modifications of citta, however subtle. In Sāṃkhya-Yoga metaphysics,
  prakṛti operates across a spectrum from gross (the body, sense organs) to increasingly refined (breath,
  attention, meditative absorption). The three inner limbs work within this spectrum, refining the instrument
  of mind toward transparency. But transparency is not identity with puruṣa. Samādhi—even the deepest
  meditative state—remains a vṛtti, a fluctuation of prakṛti, because it is still an object of consciousness,
  still a state that arises and subsides. The unconditioned witness (puruṣa) cannot itself become an object
  of practice or attainment. What Patañjali establishes here is the logical limit of yoga as method: practice
  can polish the mirror of citta to perfect stillness, but the mirror itself, no matter how refined, is
  not the light that illuminates it. This is not pessimism but precision. The practitioner must recognize
  that the intimacy of the inner limbs is real and necessary—they are the gateway—yet simultaneously understand
  that no state achieved through practice can be the final reality. Kaivalya (isolation, liberation) is
  not a state to be attained but a recognition of what puruṣa always already is: untouched by the entire
  machinery of prakṛti, including the machinery of meditation itself.


  Key Terms


  **bahiraṅga** — external, outer, foreign to; here denoting that even refined mental states remain outside
  the unconditioned ground

  **samādhi** — meditative absorption or unified consciousness; here understood as a vṛtti (modification)
  of prakṛti, not puruṣa itself

  **kaivalya** — isolation, aloneness; the liberation of puruṣa from identification with prakṛti, achieved
  through recognition rather than attainment


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47 (yoga as skill in action, without attachment to fruit):** Both texts distinguish
  between the instrument (action, practice, mind) and the true agent (puruṣa); both teach that mastery
  lies in using the instrument without identifying with its results. Divergence: The Gītā emphasizes duty
  and right action in the world; Patañjali''s sūtras point toward the withdrawal of prakṛti''s machinery
  altogether, a more radical non-identification.

  **Plotinus, Enneads 6.9.3 (the One beyond being and intellect):** Both traditions posit an ultimate
  reality beyond all mental states and objects of consciousness; both teach that contemplative practice
  refines the soul/mind but cannot itself reach the transcendent ground. Divergence: Plotinus emphasizes
  emanation and the continuity of levels; Yoga-Sāṃkhya insists on the absolute separation (kaivalya) between
  puruṣa and prakṛti, with no ontological bridge.

  **Meister Eckhart, ''God is not being or goodness'' (Sermons):** Both warn against clinging to even
  the highest experiential states (Eckhart''s ''divine union'') as final; both point to a reality that
  transcends all states, even bliss. Divergence: Eckhart''s God is the creative ground of being itself;
  Yoga''s puruṣa is utterly passive and inert, witnessing but never acting or creating.'
insight: The central claim of this verse is that the mind, even when it has been trained to a state of
  stillness, remains an external, non‑productive element relative to the deepest, unconditioned ground
  of aw
practice: Apply prāṇāyāma, dhāraṇā, and dhyāna in succession, focusing each practice as an intimate, internal
  step toward calm, present awareness.
