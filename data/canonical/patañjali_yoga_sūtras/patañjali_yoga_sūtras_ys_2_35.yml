sanskrit_devanagari: अहिंसाप्रतिष्ठायाम् तस्संनिधौ वैरत्यागः
sanskrit_iast: ahiṃsāpratiṣṭhāyāṃ tatsaṃnidhau vairatyāgaḥ
translation_literal: When nonviolence is firmly established, all hostility dissolves in the presence of
  one who embodies it.
commentary: 'This sūtra (II.35) describes a direct consequence of stabilizing ahiṃsā—not as a moral aspiration
  but as a lived, embodied reality. The Sanskrit construction is precise: ahiṃsāpratiṣṭhāyāṃ (when nonviolence
  is established, grounded, made firm) sets the condition. Tatsaṃnidhau (in the proximity, in the presence
  of that one) indicates that this is not abstract virtue but a tangible field effect. Vairatyāgaḥ (the
  abandonment, relinquishment of enmity) is what naturally occurs.


  Within the Yoga–Sāṃkhya framework, this is not sentimentalism. Patañjali is describing a real transformation
  of the subtle body and its radiative capacity (śakti). When the yogi''s nervous system, breath, and
  mental intention are no longer contaminated by the violent impulse—the desire to harm, dominate, or
  reject—a coherence emerges. This coherence is felt by others. Animals cease to fear. Aggressive persons
  find their hostility has no target to grip onto; it dissipates like a fist closing on air.


  The word vairā (enmity, hostility, opposition) is not overcome through suppression or forced forgiveness.
  It is *abandoned* (tyāga) because the field around the established yogin no longer generates the conditions
  that produce it. This is why the sūtra emphasizes *pratiṣṭhā*—establishment, not effort. Once ahiṃsā
  is rooted (like a tree with deep roots), the fruit follows naturally.


  This also corrects a common misreading: the sūtra does not say the yogi becomes passive or weak. Rather,
  the aggressive reflex—the knee-jerk impulse to strike back, to defend through harm—simply ceases to
  arise. What remains is clarity, strength, and the capacity to act without poison.


  Key Terms


  **ahiṃsā** — Non-harming; the absence of the impulse to injure, dominate, or reject; a foundational
  ethical restraint and subtle bodily state

  **pratiṣṭhā** — Establishment, grounding, firm rooting; the condition of being settled and stable, not
  merely intellectual but embodied

  **vairā** — Enmity, hostility, opposition, the aggressive or rejecting impulse in others that naturally
  ceases when it encounters true nonviolence'
insight: The sutra asserts that the mere act of firmly establishing ahiṁsā (nonviolence) transforms the
  practitioner into a pacific center that dissolves enmity.
practice: Stand in a doorway or threshold before entering a space where you typically encounter tension
  or hostility—a meeting, a difficult relationship, a charged environment. Arrive there three breaths
  early. On each exhale, release the armoring in your chest and shoulders, letting your body become a
  still point rather than a defended one. Enter only when your nervous system feels genuinely settled,
  not braced. Notice what shifts in how others meet you.
