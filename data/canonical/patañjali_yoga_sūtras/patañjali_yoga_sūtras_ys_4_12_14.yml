sanskrit_devanagari: 'अतीतानागतं स्वरूपतोऽस्य अध्वाभेदाद् धर्माणाम् ॥ ४.१२ ॥


  ते व्यक्तसूक्ष्मा गुणात्मा नः ॥ ४.१३ ॥


  परिणामैकत्वाद् वस्तुतत्त्वम् ॥ ४.१४ ॥'
sanskrit_iast: 'atītānāgataṃ svarūpato ''sty adhvabhedād dharmāṇām || 4.12 ||


  te vyaktasūkṣmā guṇātmānaḥ || 4.13 ||


  pariṇāmaikatvād vastutattvam || 4.14 ||'
translation_literal: '**4.12** Past and future exist in their own nature, divided by the path of properties (dharma).

  **4.13** They are manifest and subtle, constituted of the guṇas (guṇātman).

  **4.14** The reality of a thing (vastu) is one through the unity of transformation (pariṇāma).'
commentary: 'These three sūtras form a single argument about the nature of reality that dissolves the conventional distinctions
  between time, object, and subject. Patañjali moves from the temporal (4.12) through the subjective (4.13) to the ontological
  ground (4.14), revealing that all three apparent divisions rest on a single misperception: the belief that multiplicity
  is fundamental.


  Sūtra 4.12 establishes that past and future are not separate moments but subsist within the present object in its true form
  (vastu-rūpa). This is not mysticism but a precise claim about prakṛti: time itself is a vṛtti, a modification of the mind-stuff,
  and the mind''s habit of projecting past and future onto objects is a superimposition. The object as it truly is—undivided
  by temporal categories—exists now. This cuts the root of temporal suffering: regret and anticipation are revealed as mental
  constructs layered over a unified present.


  Sūtra 4.13 shifts the ground by asserting that these subtle and manifested qualities (guṇas) belong to the self (ātmā).
  This is the crucial move: it refuses the abstract dualism of puruṣa and prakṛti by showing that the self is inseparable
  from the guṇas that constitute experience. The self is not a bare witness but the locus where the guṇas individuate themselves.
  This makes the guṇas accessible to direct observation and transformation through practice—they are not alien forces but
  the very texture of one''s own nature.


  Sūtra 4.14 completes the argument by grounding all objects in the uniformity (sāmya) of the guṇas. The reality (vastu) of
  any thing arises not from its apparent distinctness but from the homogeneous distribution of sattva, rajas, and tamas within
  it. Multiplicity is surface; sameness is depth. The practitioner who recognizes this uniformity—who perceives the same guṇic
  play in all objects and in the self—dissolves the illusion of separateness and approaches kaivalya. The three sūtras together
  teach that liberation is the direct perception that time, object, and subject are not three things but one undivided reality,
  perpetually present, known through the recognition of the guṇas'' uniform ground.


  Key Terms


  **vastu-rūpa** — The real form or true nature of an object, undivided by temporal or conceptual categories

  **guṇa** — The three constituent qualities of prakṛti (sattva, rajas, tamas) that compose all manifest reality

  **sāmya** — Uniformity or homogeneity; the undifferentiated state of the guṇas that grounds the reality of all things

  **kaivalya** — Liberation; the isolation of puruṣa from prakṛti through direct recognition of their distinction


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14–15:** Both texts teach that the fluctuation of sense-experience (sukha-duḥkha, past-future) is transient
  and that equanimity arises from perceiving the unchanging ground beneath temporal change. Kṛṣṇa''s instruction to Arjuna
  parallels Patañjali''s dissolution of temporal anxiety. Divergence: The Gītā emphasizes dharma and duty as the means to
  transcend temporal suffering, whereas the Yoga Sūtras locate liberation in the direct perception of the guṇas'' uniformity
  through meditation alone.

  **Parmenides, Fragment 8:** Both argue that true reality is undivided and eternal, and that the appearance of multiplicity
  and temporal succession is illusory. The unchanging ''what is'' in Parmenides mirrors the vastu-rūpa and sāmya of Patañjali.
  Divergence: Parmenides denies becoming and change entirely; Patañjali accepts prakṛti''s manifestation as real but sees
  it as grounded in an underlying uniformity that transcends the observer''s temporal categories.

  **Plotinus, Enneads III.7 (On Eternity and Time):** Plotinus teaches that time is a product of the soul''s descent into
  multiplicity, and that eternity—the undivided present—is the true nature of reality. Both texts locate temporal suffering
  in the mind''s false division of the present. Divergence: Plotinus grounds eternity in the One''s transcendence; Patañjali
  grounds the undivided present in the guṇas'' uniformity within prakṛti, making the ground of reality immanent rather than
  transcendent.'
insight: The central claim of this sutra is that the ontological status of all objects is grounded in the homogeneous distribution
  of the three gunas—sattva, rajas, and tamas—within them.
practice: Observe the present moment, noting how thoughts of past and future arise, and gently remind yourself that they are
  merely impressions within the same real form of experience.
