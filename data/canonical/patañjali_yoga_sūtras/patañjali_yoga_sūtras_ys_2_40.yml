title: Purification and Disgust
unit_type: sutra
sanskrit_devanagari: सौचात् स्वाङ्गजुगुप्सा परैर असंसर्गः
sanskrit_iast: śaucāt svāṅgajugupsā parair asaṃsargaḥ
translation_literal: From purification arises disgust with one's own body, and non-attachment to contact
  with others.
commentary: 'This sūtra describes a natural psychological consequence of sustained purification practice
  (śauca). Śauca encompasses both external cleanliness (bathing, clean surroundings, pure food) and internal
  purification (clearing mental and energetic obstructions through prāṇāyāma, meditation, dietary discipline).
  As the practitioner''s sensitivity sharpens through these disciplines, an organic revulsion emerges—not
  pathological self-hatred, but clear seeing: the body is temporary, fluid-filled, subject to decay. This
  is svāṅgajugupsā, literally a recoiling or disgust directed toward one''s own limbs and flesh. Simultaneously,
  the constant contact-seeking that ordinarily binds us to others (asaṃsargaḥ, non-union or non-clinging)
  naturally diminishes. This is not misanthropy but disenchantment with superficial entanglement. In the
  Yoga–Sāṃkhya framework, this marks a critical threshold: the practitioner begins to discriminate between
  the eternal witness (puruṣa) and the ever-changing material body-mind (prakṛti). The disgust is not
  the goal but a sign of deepening clarity. It prepares the ground for non-attachment (vairāgya) and steadier
  inward focus. Without this natural recoiling, the pull of sensory life remains too strong to transcend.


  Key Terms


  **śauca** — Purification; the first of the niyamas (observances). Includes external cleanliness and
  internal refinement through diet, breath, and mental discipline.

  **svāṅgajugupsā** — Disgust or recoiling directed at one''s own body; a natural outcome of heightened
  sensitivity and discrimination between the eternal self and the perishable form.

  **asaṃsargaḥ** — Non-union or non-clinging; freedom from compulsive attachment and contact-seeking with
  others; a sign of emerging vairāgya (dispassion).'
insight: The sūtra asserts that the very act of purification, which is a hallmark of disciplined practice,
  paradoxically engenders a revulsion toward the body.
practice: 'After washing your hands or face with deliberate attention to the water''s temperature and
  texture, pause and let your gaze rest on your own skin—the subtle changes in color, the fine hairs,
  the impermanence written in each line. Notice without judgment the slight recoil, the faint recognition
  of what is temporary and bound to change, and let that clear seeing sharpen rather than soften your
  next interaction: speak to the person nearest you with less need, less grasping for their approval or
  presence.'
