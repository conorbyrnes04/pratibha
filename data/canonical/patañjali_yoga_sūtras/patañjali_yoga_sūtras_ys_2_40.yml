  body: śaucāt svāṅgajugupsā parair asaṃsargaḥ
- kind: translation
  label: Pratibha Translation
  body: When purity (śauca) is attained, one feels disgust (jugupsa) toward one’s own body (sva‑aṅga)
    and toward others (parair), leading to cessation of contact (asaṃsargaḥ).
- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that the very act of purification, which is a hallmark of disciplined practice,
    paradoxically engenders a revulsion toward the body. This is not a mere physical aversion but a profound
    existential detachment: the body, once seen as a vessel of impurity, becomes a hindrance to higher
    realization. The contested move here is the identification of disgust with the cessation of contact;
    some commentators read it as a temporary state of disinterest, while others see it as a permanent
    renunciation of bodily attachment. In the Sāṃkhya–Yoga framework, the body (prakṛti) is the locus
    of vṛtti, the fluctuations that bind puruṣa. By cultivating śauca, the aspirant purifies the mind
    and thereby exposes the body’s inherent impurity, prompting a shift from identification with the body
    to identification with puruṣa. This shift has practical implications: it frees the practitioner from
    the compulsive desire for sensual gratification, allowing sustained focus on dhyana and samādhi. The
    Satchidananda commentary underscores this by noting that the disgust is not hatred but a necessary
    disinterest that redirects energy toward meditation. Thus, the sūtra teaches that purification is
    not merely cleanliness but a radical reorientation of the self away from the body and toward the Self,
    a theme that resonates throughout the Yoga Sūtras as a prerequisite for higher states of consciousness.


    Key Terms


    **śauca (सौच)** — purity -> śauca (purity of mind and body) -> in this sūtra, it triggers a re-evaluation
    of the body as a site of impurity, beyond the usual meaning of cleanliness


    **jugupsa (जुगुप्सा)** — disgust -> jugupsa (aversion) -> here it denotes a deliberate, contemplative
    disinterest in bodily contact, not mere dislike


    **asaṃsargaḥ (असंसर्गः)** — cessation of contact -> asaṃsargaḥ (non‑contact) -> signifies the withdrawal
    from bodily interactions as a means to prevent attachment, distinct from the ordinary sense of non‑association


    Cross-Tradition Resonances


    **Yoga Sūtra 2.39:** Both 2.39 and 2.40 describe the psychological shift that follows purification,
    showing structural homology in the use of śauca as a catalyst for change

    *Divergence:* While 2.39 focuses on the mind’s purification, 2.40 extends the effect to bodily detachment,
    illustrating a progressive deepening of practice


    **Bhaṭṭa’s Commentary on the Yoga Sūtras, 2.40:** Bhaṭṭa parallels the sūtra’s notion of disgust with
    the concept of ‘śauca‑prāṇā‑sādhana’ (purification of breath) as a means to detach from the body

    *Divergence:* Bhaṭṭa adds the element of breath control, which the sūtra omits, thereby expanding
    the practical dimension


    **Sāṃkhya Kārikā, chapter on Purusha‑Prakriti:** Both texts treat the body as a manifestation of prakṛti
    that must be transcended to realize puruṣa

    *Divergence:* The Kārikā presents this transcendence as a metaphysical necessity, whereas the Yoga
    Sūtra frames it as a psychological outcome of purification'
