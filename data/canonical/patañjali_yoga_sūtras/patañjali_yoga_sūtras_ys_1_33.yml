sanskrit_devanagari: मैत्रीकरुणामुदितोकेषाणां सुखदुःखपुण्याभिपुण्यविषयाणां भावनाताश् चित्तप्रसादनम्
sanskrit_iast: maitrīkaruṇāmuditopekṣāṇāṃ sukhaduḥkhapuṇyāpuṇyaviṣayāṇāṃ bhāvanātaś cittaprasādanam
translation_literal: By cultivating friendliness toward those in happiness, compassion toward those in
  suffering, joy toward those in virtue, and equanimity toward those in vice—the mind becomes clear and
  settled.
commentary: 'This sūtra (I.33) prescribes a precise mental discipline for stabilizing consciousness through
  four cardinal attitudes (brahmaviharas in Buddhist terms, though here embedded in Yoga philosophy).
  Patañjali is not describing a moral commandment but a *technical procedure*—a bhāvanā, a deliberate
  cultivation that directly produces cittaprasādana, the settling and clarification of the mind-stuff
  itself.


  The mechanism is psychological and energetic: when the mind encounters the world divided into four categories
  of beings and circumstances, untrained reactivity (rāga, dveṣa, moha) creates turbulence. The four attitudes—maitrī
  (friendliness), karuṇā (compassion), mudita (sympathetic joy), upekṣā (equanimity)—are not sentimental
  overlays but precise antidotes to the mind''s habitual distortions.


  Crucially, these are *directed* at specific objects: sukha (happiness/ease), duḥkha (suffering), puṇya
  (virtue/merit), and apuṇya (vice/demerit). The yogi does not float in abstract benevolence; he or she
  trains the response-pattern to each actual category of experience. This prevents the mind from oscillating
  between attraction and aversion—the root of mental agitation (vikṣepa).


  The result is cittaprasādana: a luminous, undisturbed clarity. Prasāda means both ''grace'' and ''transparency''—the
  mind becomes like still water, capable of reflecting reality without distortion. This is a prerequisite
  for samādhi (absorption), not a final attainment, but it is the gateway.


  Key Terms


  **bhāvanā** — Deliberate cultivation or mental formation; the repeated, intentional practice of a state
  or quality until it becomes stable in consciousness.

  **cittaprasādana** — The clarification and settling of the mind-stuff; a luminous, undisturbed transparency
  of consciousness free from agitation and distortion.

  **upekṣā** — Equanimity; a state of non-reactive, clear-eyed presence toward circumstances or beings
  that are neither helpful nor harmful to one''s practice.'
insight: The central claim of this passage is that equanimity is cultivated by a balanced, active response
  to all emotional states, not by passive surrender.
practice: 'For one week, practice the Four Attitudes in daily life. Choose one person or situation in
  each category:


  1. **Sukha (happiness):** Identify someone thriving or content. When you think of them or encounter
  them, consciously generate maitrī—a warm, unguarded friendliness. Notice any envy or dismissal arising;
  let the attitude of genuine goodwill replace it.


  2. **Duḥkha (suffering):** Choose someone in visible difficulty (a struggling colleague, someone grieving,
  or even a news figure). Direct karuṇā—not pity, but a steady, clear wish for their relief. Feel the
  difference between sentiment and genuine compassionate presence.


  3. **Puṇya (virtue):** Observe someone acting with integrity, kindness, or discipline. Generate mudita—authentic
  joy in their merit, free of comparison. This is harder than it sounds; notice resistance.


  4. **Apuṇya (vice):** Identify someone behaving harmfully or selfishly. Rather than judgment or anger,
  cultivate upekṣā—equanimity, a clear-eyed non-reactivity. This does not mean approval; it means refusing
  to let their action disturb your own mental clarity.


  Each morning, sit for 5 minutes and mentally visit each category, reinforcing the attitude. Track any
  shift in your baseline mental state—restlessness, reactivity, or the opposite. This is cittaprasādana
  beginning to manifest.'
