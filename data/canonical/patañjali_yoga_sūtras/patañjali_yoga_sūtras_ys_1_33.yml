sanskrit_devanagari: मैत्रीकरुणामुदितोकेषाणां सुखदुःखपुण्याभिपुण्यविषयाणां भावनाताश् चित्तप्रसादनम्
sanskrit_iast: maitrīkaruṇāmuditopekṣāṇāṃ sukhaduḥkhapuṇyāpuṇyaviṣayāṇāṃ bhāvanātaś cittaprasādanam
translation_literal: By cultivating friendliness toward those in happiness, compassion toward those in suffering, joy toward
  those in virtue, and equanimity toward those in vice—the mind becomes clear and settled.
commentary: 'This sūtra (I.33) prescribes a precise mental discipline for stabilizing consciousness through four cardinal
  attitudes (brahmaviharas in Buddhist terms, though here embedded in Yoga philosophy). Patañjali is not describing a moral
  commandment but a *technical procedure*—a bhāvanā, a deliberate cultivation that directly produces cittaprasādana, the settling
  and clarification of the mind-stuff itself.


  The mechanism is psychological and energetic: when the mind encounters the world divided into four categories of beings
  and circumstances, untrained reactivity (rāga, dveṣa, moha) creates turbulence. The four attitudes—maitrī (friendliness),
  karuṇā (compassion), mudita (sympathetic joy), upekṣā (equanimity)—are not sentimental overlays but precise antidotes to
  the mind''s habitual distortions.


  Crucially, these are *directed* at specific objects: sukha (happiness/ease), duḥkha (suffering), puṇya (virtue/merit), and
  apuṇya (vice/demerit). The yogi does not float in abstract benevolence; he or she trains the response-pattern to each actual
  category of experience. This prevents the mind from oscillating between attraction and aversion—the root of mental agitation
  (vikṣepa).


  The result is cittaprasādana: a luminous, undisturbed clarity. Prasāda means both ''grace'' and ''transparency''—the mind
  becomes like still water, capable of reflecting reality without distortion. This is a prerequisite for samādhi (absorption),
  not a final attainment, but it is the gateway.


  Key Terms


  **bhāvanā** — Deliberate cultivation or mental formation; the repeated, intentional practice of a state or quality until
  it becomes stable in consciousness.

  **cittaprasādana** — The clarification and settling of the mind-stuff; a luminous, undisturbed transparency of consciousness
  free from agitation and distortion.

  **upekṣā** — Equanimity; a state of non-reactive, clear-eyed presence toward circumstances or beings that are neither helpful
  nor harmful to one''s practice.'
insight: The central claim of this passage is that equanimity is cultivated by a balanced, active response to all emotional
  states, not by passive surrender.
practice: The next time you encounter someone happy, someone suffering, someone acting virtuously, and someone acting viciously—in
  whatever order they appear in your day—whisper the matching word (maitrī, karuṇā, mudita, upekṣā) as you exhale, letting
  it settle in your chest like a tuning fork, and notice how the turbulence in your own mind shifts.
