sanskrit_devanagari: तज्जपः तदर्थभावनम्
sanskrit_iast: tajjapas tadarthabhāvanam
translation_literal: The repetition of that [mantra] and meditation on its meaning constitute the practice.
commentary: 'This sūtra (I.28) establishes japa—the rhythmic recitation of a chosen sound or mantra—as
  a dual practice: both the mechanical utterance and the sustained contemplation of what that utterance
  signifies. Patañjali does not separate sound from sense; they form a single integrated method. The ''that''
  (taj) refers to Īśvara''s name, introduced in the previous sūtra, though the principle applies to any
  chosen mantra. Japa works through two channels: the vibration and repetition anchor the mind''s restless
  movement, while simultaneous reflection on the mantra''s meaning (arthabhāvana) prevents the practice
  from becoming mere mechanical recitation. This is not mindless chanting; it is a conscious binding of
  attention to both the sonic and semantic dimensions of a chosen word or phrase. Within the Yoga–Sāṃkhya
  framework, this practice directly addresses the kleśas (afflictions) by occupying the mind''s tendency
  to wander, and by aligning consciousness with a chosen object of contemplation, it prepares the ground
  for samādhi. The mantra becomes a bridge between the gross (audible sound) and the subtle (meaning,
  intention, resonance).


  Key Terms


  **japa** — Repetition of a mantra, name, or sacred sound; the practice of reciting with focused intention.

  **arthabhāvana** — Meditation on or contemplation of the meaning; sustained reflection on the significance
  of what is being recited.

  **mantra** — A sound, word, or phrase chosen as an object of meditation and repetition; a tool for focusing
  and transforming consciousness.'
insight: The central claim of this sutra is that the practice of japa—repetition of a word or syllable—must
  be coupled with a sustained, intentional meditation on its significance.
practice: 'Choose a short mantra or meaningful phrase—it may be a single Sanskrit word (such as ''om,''
  ''śānti,'' or ''aham''), a personal name, or a phrase in any language that holds significance for you.
  Sit comfortably and begin to repeat it aloud or in a whisper, at a natural pace, for 5–10 minutes. As
  you speak or think the words, simultaneously hold the meaning in awareness: What does this word evoke?
  What quality or intention does it carry? When the mind drifts (it will), gently return both the repetition
  and the contemplation of meaning. Notice how the rhythm of sound and the resonance of meaning together
  anchor your attention. This is japa with arthabhāvana—the marriage of utterance and understanding.'
