sanskrit_devanagari: श्रुतराकाशयोः सम्बन्धस्यम् दिव्यम् श्रुतम्
sanskrit_iast: śrotrākāśayoḥ saṃbandhasaṃyamād divyaṃ śrotram
translation_literal: Through focused attention on the relationship between the ear and the space of sound,
  extraordinary hearing arises.
commentary: 'This sūtra belongs to the section on siddhis (extraordinary capacities) that emerge from
  saṃyama—the unified application of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi)
  on a chosen object. Here, Patañjali specifies the ear (śrotra) and ākāśa (the subtle space or medium
  through which sound travels) as the focal point.


  The sūtra rests on a fundamental Yoga–Sāṃkhya principle: all phenomena arise from the interaction of
  consciousness (puruṣa) with the subtle elements (tanmātra). Sound (śabda-tanmātra) pervades ākāśa, the
  most subtle of the five elements. By bringing saṃyama to bear on the *relationship* (saṃbandha) between
  the sensory organ (ear) and its corresponding subtle field (sound-space), the yogin dissolves the ordinary
  limitations of hearing.


  Divya (divine, extraordinary) hearing is not clairvoyance but rather a refined perceptual capacity:
  the ability to hear sounds ordinarily imperceptible—distant voices, subtle vibrations, the inner hum
  of prāṇa itself. This arises not through magical intervention but through the natural consequence of
  aligning individual consciousness with the subtle mechanics of perception itself.


  The mechanism is crucial: saṃyama on the *bond* (not merely the ear or space alone) reveals that hearing
  is a relational event. When the mind becomes transparent to this relationship, it ceases to filter or
  limit what can be perceived. The siddhi is thus a restoration of natural perceptual wholeness, not an
  addition of power.


  Key Terms


  **śrotra** — The ear; the sensory organ of hearing and its corresponding cognitive faculty.

  **ākāśa** — Space or ether; the subtlest of the five elements, the medium through which sound (śabda)
  propagates.

  **saṃyama** — The unified binding of concentration, meditation, and absorption on a single object; the
  means by which siddhis (extraordinary capacities) arise.'
insight: The claim that sensory perception can be transformed into a divine faculty rests on the notion
  that the ear’s internal atmosphere, when regulated, transcends ordinary hearing.
practice: In the space between when a sound reaches your ear and when you name it, pause and feel the
  invisible medium it traveled through—the ākāśa itself. Do this three times today with three different
  sounds (a voice, traffic, birdsong), each time resting your attention not on the sound's meaning but
  on the relationship between your ear's capacity to receive and the boundless space that carried it to
  you.
