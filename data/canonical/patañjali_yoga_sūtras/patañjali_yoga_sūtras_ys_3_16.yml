sanskrit_devanagari: परिणामतयासंयमाद् अतितानागतज्ञनम्
sanskrit_iast: pariṇāmatrayasaṃyamād atītānāgatajñānam
translation_literal: Through concentrated mastery of the three stages of transformation, knowledge of
  what has passed and what is to come arises.
commentary: 'This sūtra belongs to the section on siddhis (extraordinary capacities) that emerge from
  samyama—the unified binding of attention through dharaṇā (focus), dhyāna (sustained meditation), and
  samādhi (absorption). Patañjali here describes a specific application: samyama directed toward pariṇāma-traya,
  the three-fold process of transformation that governs all manifestation.


  In Sāṃkhya metaphysics, every object or state undergoes three phases of transformation: (1) the latent
  potential state (dharma), (2) the present manifest state (lakṣaṇa), and (3) the dissolving or transitional
  state (avasthā). When a yogi applies samyama to this triple rhythm—understanding how anything moves
  through past form, present expression, and future dissolution—the mind gains access to temporal knowledge
  beyond ordinary perception.


  This is not supernatural guessing. Rather, by perceiving the deep structural pattern of how change itself
  operates, the meditator can read backward (atīta, what has passed) and forward (anāgata, what approaches)
  along the continuum of transformation. The mechanism is direct perception of causality and sequence,
  not inference or imagination.


  This sūtra illustrates a key principle: siddhis arise not from wishing or prayer, but from precise,
  sustained attention to the actual laws governing prakṛti (nature). Knowledge follows understanding of
  mechanism.


  Key Terms


  **pariṇāma-traya** — The three-fold transformation: latent potential (dharma), manifest present (lakṣaṇa),
  and dissolving transition (avasthā) through which all phenomena move.

  **samyama** — The unified binding of dharaṇā (focused attention), dhyāna (unbroken meditation), and
  samādhi (absorption) into a single continuous act of knowing.

  **atīta-anāgata** — Past and future; knowledge of what has already occurred and what will unfold, accessed
  through direct perception of causal sequence rather than inference.'
insight: The central claim of this sutra is that disciplined practice (saṁyama) is not merely a present‑moment
  technique but a transformative process that bridges the past, present, and future.
practice: 'Choose one recurring cycle in your daily life—the breath, a habit, or a physical sensation.
  For 5–10 minutes, sit quietly and observe its three-fold pattern: (1) its arising or beginning phase,
  (2) its peak or sustained phase, (3) its fading or dissolution phase. Do not force; simply notice how
  each phase necessarily gives way to the next. Repeat this observation over several days with the same
  cycle. You will begin to perceive the *rhythm* beneath the change—and with it, an intuitive sense of
  what comes next, not by guessing but by recognizing the pattern. This is a seed of the sūtra''s teaching:
  mastery of transformation reveals time.'
