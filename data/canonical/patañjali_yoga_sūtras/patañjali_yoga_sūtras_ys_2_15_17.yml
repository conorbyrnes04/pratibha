sanskrit_devanagari: 'परिणामतापसंस्कारदुःखैः गुणवृत्तिविरोधाच्च दुःखम् एव सर्वं विवेकिनः ॥ २.१५ ॥


  हेयं दुःखं अनागतम् ॥ २.१६ ॥


  द्रष्टृदृश्ययोः संयोगः हेयहेतुः ॥ २.१७ ॥'
sanskrit_iast: 'pariṇāmatāpasaṃskāraduḥkhair guṇavṛttivirodhāc ca duḥkham eva sarvaṃ vivekinaḥ || 2.15 ||


  heyaṃ duḥkham anāgatam || 2.16 ||


  draṣṭṛdṛśyayoḥ saṃyogo heyahetuḥ || 2.17 ||'
translation_literal: '**2.15** All things are misery for the enlightened, because of consequences, anxiety, and impressions,
  and also because of the opposition of the actions of the qualities.

  **2.16** This misery that has not yet arrived is to be prevented.

  **2.17** The joining of the seer and the seen is the cause of that which is to be warded off.'
commentary: 'These three sūtras form a single diagnostic and prescriptive movement: they identify suffering as structural
  (2.15), declare it preventable (2.16), and name its root cause (2.17). Together they establish the logical scaffold of Yoga''s
  therapeutic project.


  Sūtra 2.15 does not counsel pessimism but precision. The enlightened one (vivekī) perceives all phenomena as suffering not
  because the world is inherently dark, but because the enlightened mind has penetrated the guṇa-mechanism itself. Every vṛtti—every
  fluctuation of the citta—arises from the interplay of sattva, rajas, and tamas. Each action of the guṇas produces a counter-action;
  each impression (saṃskāra) conditions the next; each moment of anxiety binds attention to the cycle. The enlightened discernment
  is thus a recognition of *structural* suffering: not feeling, but seeing the architecture of bondage. This is the diagnostic
  phase.


  Sūtra 2.16 shifts from diagnosis to strategy. If all experienced reality carries suffering, the yogin''s task is not to
  endure it but to prevent its arising. The sūtra''s emphasis on "that which has not yet come" (anāgatam) marks Yoga as a
  *preventive* discipline. This is not passive resignation but active vigilance—a cultivation of vṛtti-nigraha (restraint
  of mental fluctuation) before suffering crystallizes into experience. The practitioner observes the seeds of future distress
  in present habit and thought, and withdraws attention before they germinate. This is the strategic phase.


  Sūtra 2.17 completes the logic by naming the root: *saṃyoga*, the joining of seer and seen. Puruṣa—the unchanging witness—and
  dṛśya—the ever-shifting manifold of prakṛti—are ontologically distinct. Yet ignorance (avidyā) fuses them. The citta, itself
  a product of prakṛti, mistakes itself for the puruṣa; the seer identifies with the seen. This misidentification is not a
  cognitive slip but the very mechanism of bondage. All vṛtti, all saṃskāra, all guṇa-action flows from this primal confusion.
  To prevent suffering (2.16), one must dissolve this joining (2.17); to dissolve it, one must see it clearly (2.15). The
  three sūtras thus form a causal chain: *seeing* the structure of suffering motivates *prevention* of its manifestation,
  which requires *severing* the false union of puruṣa and prakṛti. Kaivalya—the isolation of puruṣa—is the inevitable conclusion.


  Key Terms


  **saṃyoga** — the false joining or identification of puruṣa (seer) with dṛśya (seen); the root mechanism of bondage

  **viveka** — discriminative discernment; the enlightened perception that penetrates the guṇa-mechanism and sees suffering
  as structural

  **anāgatam duḥkham** — suffering that has not yet manifested; the object of yogic prevention and anticipatory vigilance

  **vṛtti-nigraha** — restraint or cessation of mental fluctuations; the practical means of preventing future suffering


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** Both texts trace suffering to identification with sense-objects and mental fluctuation (saṅga
  leading to kāma, kāma to krodha). Both prescribe discriminative wisdom and withdrawal of attention as remedy. Divergence:
  The Gītā emphasizes dharma and action-in-the-world; Yoga emphasizes cessation of vṛtti and the puruṣa-prakṛti distinction
  as the sole path to freedom.

  **Epictetus, Enchiridion 1:** Both teach that suffering arises not from external events but from false judgment about them—from
  identifying the self with what is not-self. Both counsel preemptive discernment and detachment. Divergence: Epictetus grounds
  freedom in rational will and virtue; Yoga grounds it in the ontological separation of puruṣa from prakṛti and the cessation
  of mental modification.

  **Dhammapada 278–279:** Both identify craving and identification with phenomena as the root of dukkha, and both prescribe
  mindful observation and non-attachment as the path to liberation. Divergence: Buddhism denies a permanent puruṣa or ātman;
  Yoga asserts kaivalya—the eternal isolation of puruṣa—as the goal.'
insight: The Sūtra asserts that the foremost object of yogic practice is the preemptive avoidance of suffering that has not
  yet manifested.
practice: Observe each experience you have and note the consequence, anxiety, or impression that follows, then consciously
  step back to witness it without attachment.
