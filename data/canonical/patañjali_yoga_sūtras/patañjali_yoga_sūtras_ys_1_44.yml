sanskrit_devanagari: एतायिव सविचारः नीरविचारः च सूक्ष्मविषयः व्याख्याता
sanskrit_iast: etayaiva savicārā nirvicārā ca sūkṣmaviṣayā vyākhyātā
translation_literal: By this same method, both the deliberative and non-deliberative absorptions concerned
  with subtle objects have been explained.
commentary: 'This sūtra concludes Patañjali''s exposition of the four primary samādhis (1.17–1.18), now
  extending the framework to subtle domains. The phrase ''by this same method'' (etayaiva) refers back
  to the immediately preceding distinction between savicāra (absorption with deliberation) and nirvicāra
  (absorption without deliberation)—a distinction that applies not only to gross sense-objects but equally
  to sūkṣmaviṣayā, the subtle objects of perception.


  In classical yoga epistemology, ''subtle'' refers to the refined or causal dimensions of experience:
  the tanmātras (sense-potentials), the subtle body, mental formations, and the field of pure consciousness
  itself. Where savicāra-samādhi involves sustained cognitive engagement with an object—turning it over
  mentally, examining it—nirvicāra-samādhi is absorption in which the object is present but thought-activity
  has ceased; the mind rests in unified knowing without deliberation.


  The significance here is that these two modes of samādhi are not limited to external or gross phenomena.
  A yogi may enter savicāra-samādhi while meditating on a subtle principle (such as the five elements
  in their potential form, or the nature of the ego-sense), and then progress to nirvicāra-samādhi on
  the same object, where knowing becomes direct and non-discursive. This progression marks the deepening
  of meditative stability and the refinement of consciousness itself.


  Patañjali''s systematic exposition—gross objects with deliberation, gross objects without deliberation,
  subtle objects with deliberation, subtle objects without deliberation—establishes that the mechanism
  of samādhi is universal and scalable. The yogi''s practice is not bound to one level but can move fluidly
  across the spectrum of manifestation, from the densest to the most rarefied.


  Key Terms


  **savicāra** — absorption accompanied by deliberation; meditative engagement in which thought-activity
  examines and turns over the object

  **nirvicāra** — absorption without deliberation; meditative unity in which the object is known directly,
  without discursive mental activity

  **sūkṣmaviṣayā** — subtle objects; the refined or causal dimensions of experience, including sense-potentials
  (tanmātras), mental principles, and states of consciousness'
insight: The sūtra asserts that the same duality of concentration—deliberative (sādhana) and non‑deliberative
  (nir‑sādhana)—applies not only to the gross elements but also to the subtle ones.
practice: 'Choose a subtle object of meditation—for instance, the concept of ''space'' (ākāśa) or the
  quality of ''lightness'' (laghutvam). Sit quietly and bring this quality into awareness. For 5–10 minutes,
  deliberately contemplate it: ask yourself what it means, how it manifests in your body, how it relates
  to other qualities. Notice the play of thought. This is savicāra meditation. Then, without abandoning
  the object, allow your thinking to settle. Stop asking questions. Simply rest in the presence of the
  quality itself—space as it is, lightness as it is—without mental commentary or analysis. Remain here
  for another 5–10 minutes. This transition from deliberation to non-deliberation, even on a single subtle
  object, gives direct experience of the two modes Patañjali describes and trains the mind to move between
  them with intention.'
