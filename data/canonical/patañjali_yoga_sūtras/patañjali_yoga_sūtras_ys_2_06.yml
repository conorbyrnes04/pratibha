sanskrit_devanagari: द्रिगदर्शनशक्तिर एकात्मतेवास्मिता
sanskrit_iast: dṛgdarśanaśaktyor ekātmatevāsmitā
translation_literal: The sense of 'I' arises when the power of seeing and the power of sight appear to
  be a single unified being.
commentary: 'This sūtra (II.6) defines asmitā, the second of the five afflictions (kleśa), and locates
  its root mechanism in a fundamental confusion about consciousness itself.


  In the Yoga–Sāṃkhya framework, dṛk (the seer, pure awareness) and darśana-śakti (the capacity to perceive,
  the instrument of seeing) are ontologically distinct. The seer is unchanging, non-instrumental witness-consciousness
  (puruṣa). The power of sight—including mind, senses, and their operations—belongs to the evolving, instrumental
  realm of prakṛti (nature). These two are meant to remain separate; their distinction is the very ground
  of liberation.


  Asmitā occurs when this distinction collapses into apparent unity (ekātmatā). The witness-consciousness
  seems to *become* the seeing-power; the eternal seer identifies with the temporal instrument of perception.
  This false merger generates the sense of individual doership and ownership: "I see, I know, I am the
  one who experiences." From this misidentification flow all subsequent afflictions—desire, aversion,
  fear of death, and clinging to life.


  The sūtra''s precision is crucial: it is not that the two *are* unified, but that they *appear* (iva)
  to be so. The confusion is optical, not ontological. This makes asmitā distinctly subtle—more fundamental
  than the grosser kleśas—because it operates at the level of self-sense itself, before desire or aversion
  crystallize. It is the primordial contraction in which consciousness seems to shrink into the body-mind
  and claim it as "I."


  Patañjali''s diagnosis opens the path to remedy: if asmitā is a case of mistaken identity, then discriminative
  insight (viveka) into the actual separation of seer and seen can dissolve it.


  Key Terms


  **dṛk** — The seer; pure witness-consciousness (puruṣa); the unchanging subject of all perception.

  **darśana-śakti** — The power or capacity of sight; the instrumental apparatus of perception (mind,
  senses, their operations) belonging to prakṛti.

  **asmitā** — The sense of individual ''I''; the second kleśa; the false identification of consciousness
  with the body-mind instrument.'
insight: The sūtra asserts that the very faculty of perception, when it is identified with the singularity
  of the self, produces the experience known as the sense of being.
practice: 'Throughout one waking hour, each time you notice yourself saying ''I'' or ''me''—in thought
  or speech—pause and ask: which is speaking, the unchanging witness or the changing instrument of perception?
  Do not answer; let the question itself create a gap between the two, like light separating from its
  lens.'
