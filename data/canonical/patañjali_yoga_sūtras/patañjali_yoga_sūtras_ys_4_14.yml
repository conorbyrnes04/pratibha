sanskrit_devanagari: परिणामैकत्वाद् वस्तुतत्त्वम्
sanskrit_iast: pariṇāmaikatvād vastutattvam
translation_literal: From the uniformity of transformation, the true nature of substance becomes apparent.
commentary: 'This sūtra addresses a fundamental problem in Sāṃkhya-Yoga epistemology: how do we know what
  something truly is when we only ever perceive its changing forms? The answer lies in recognizing that
  all transformation (pariṇāma) of a substance follows a consistent pattern—the guṇas (qualities of matter:
  sattva, rajas, tamas) recombine and shift, yet the underlying substance remains invariant. When you
  observe that gold becomes a ring, then a bracelet, then dust, you recognize gold''s essential nature
  precisely because the transformations are lawful and uniform. They follow the same principles of material
  causation. Similarly, in meditation, when the mind-stuff (citta) undergoes successive modifications—thoughts,
  sensations, emotions—the yogi learns to discern the unchanging witness-consciousness (puruṣa) behind
  these uniform patterns of change. The constancy within flux reveals what is real. This sūtra thus establishes
  that substance-nature (vastu-tattva) is knowable not through static observation but through understanding
  the coherent, singular law governing all its transformations. It is the gateway to discriminative knowledge
  (viveka) between the eternal and the ephemeral.


  Key Terms


  **pariṇāma** — transformation or modification; the process by which substance changes form while remaining
  essentially itself

  **vastu-tattva** — the true nature or essential reality of a substance; that which remains constant
  beneath apparent change

  **guṇa** — the three fundamental qualities of matter (sattva, rajas, tamas) whose permutations produce
  all phenomenal change'
insight: The central claim of this sutra is that the ontological status of all objects is grounded in
  the homogeneous distribution of the three gunas—sattva, rajas, and tamas—within them.
practice: Watch one substance transform across three states today—water to steam to condensation, clay
  to pot to dust, or fruit to juice to compost. As each form dissolves into the next, whisper "the substance
  remains" and feel your attention drop beneath the surfaces to what persists unchanged through every
  shift.
