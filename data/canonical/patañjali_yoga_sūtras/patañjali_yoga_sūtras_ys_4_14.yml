title: Uniformity of Gunas
unit_type: sutra
sanskrit_devanagari: परिणामैकत्वाद् वस्तुतत्त्वम्
sanskrit_iast: pariṇāmaikatvād vastutattvam
translation_literal: The reality of things arises from the uniformity of the gunas.
commentary: 'The central claim of this sutra is that the ontological status of all objects is grounded in the homogeneous
  distribution of the three gunas—sattva, rajas, and tamas—within them. In the Yoga–Sāṃkhya framework, this stands in contrast
  to the dualistic insistence that only puruṣa (consciousness) and prakṛti (matter) are fundamental. Here, the sutra asserts
  that prakṛti’s manifestation, its ‘vastu’, is not an arbitrary assemblage but a coherent whole whose essence, or tattva,
  is the very sameness of its constituent gunas. This sameness is not a passive sameness but an active, dynamic unity that
  gives rise to the observable reality. The implication for practice is that the practitioner must cultivate an awareness
  of this internal uniformity, recognizing that the perceived multiplicity of objects is a surface phenomenon superimposed
  upon an underlying oneness. By aligning one’s mind with this uniformity—through meditation on the sameness of the gunas—one
  can dissolve the illusion of separateness, thereby moving toward kaivalya. The sutra’s brevity masks a profound ontological
  claim: that the very fabric of reality is woven from the consistent interplay of the gunas, and that liberation is achieved
  by perceiving this weave as a single, indivisible truth.


  Key Terms


  **परिणाम (परिणाम)** — परिणाम (transformation) -> in Yoga, denotes the dynamic unfolding of prakṛti; default translation
  ‘change’ misses its role as the process that reveals the unity of gunas


  **एकत्व (एकत्व)** — एकत्व (oneness) -> in Sāṃkhya, refers to the uniformity of gunas within prakṛti; default ‘unity’ overlooks
  its specific implication for the sameness that grounds reality


  **वस्तु (वस्तु)** — वस्तु (thing) -> in Yoga, signifies the manifested object of prakṛti; default ‘object’ neglects its
  ontological status as the concrete expression of gunic uniformity


  **तत्त्व (तत्त्व)** — तत्त्व (that‑ness) -> in Sāṃkhya, denotes the essential nature of prakṛti; default ‘nature’ omits
  its function as the defining reality of the object


  Cross-Tradition Resonances


  **Patanjali Yoga Sutra 2.1:** Both sutras posit that the essence of objects is derived from an underlying unity; 2.1 speaks
  of the mind’s power to transform perception, mirroring the transformation implied by ‘परिणाम’

  *Divergence:* Patanjali focuses on mental activity, whereas this sutra attributes reality to the intrinsic uniformity of
  gunas, shifting agency from mind to prakṛti


  **Samkhya Karika 2.1:** Both texts emphasize the role of prakṛti’s gunas in constituting reality; the Karika describes the
  three gunas as the basis of all change

  *Divergence:* The Karika presents gunas as independent qualities, whereas here they are presented as a unified whole that
  grants reality to objects


  **Bhaṭṭārāyaṇa Yoga Sutra 2.2:** Both sutras discuss the transformation of perception into reality through the mind’s activity

  *Divergence:* Bhaṭṭārāyaṇa emphasizes the mind’s role in creating illusion, while this sutra underscores the inherent uniformity
  of gunas as the source of reality'
insight: The central claim of this sutra is that the ontological status of all objects is grounded in the homogeneous distribution
  of the three gunas—sattva, rajas, and tamas—within them.
practice: Observe each object you encounter and consciously note the uniform presence of sattva, rajas, and tamas within it,
  recognizing that this sameness is the true reality.
