title: Complete Absorption in the Cognised
unit_type: sutra
sanskrit_devanagari: क्षीणवृत्तरेभिजातस्येवा मणेर् ग्रहितृग्राहणग्राह्येषु तत्त्वशतदंजनातां समापत्तिḥ
sanskrit_iast: kṣīṇavṛtter abhijātasyeva maṇer grahītṛgrahaṇagrāhyeṣu tatsthatadañjanatā samāpattiḥ
translation_literal: When the mind’s transforming tendencies are annihilated, the practitioner becomes entirely one with the
  cogniser, the cognition, and the cognised, as if a transparent jewel is absorbed into itself.
commentary: 'The passage asserts that a true yogi’s mind, when its vṛtti (transforming tendencies) are extinguished, dissolves
  into a state of perfect identity with the triad of cogniser, cognition, and cognised. This is not merely a passive absorption
  but an active, intentional suspension of the mind’s habitual fluctuations. In the Sāṃkhya‑Yoga framework, such a state is
  the culmination of the systematic control (niṣkāra) of prakṛti by puruṣa, yielding samādhi that is not a mere cessation
  of thought but a transcendental unity. The text’s emphasis on “kṣīṇavṛtter” (annihilation of vṛtti) foregrounds the necessity
  of disciplined concentration (dharana) and the subsequent dissolution (samādhi). The analogy of a transparent jewel suggests
  that the yogi’s awareness becomes as clear and untainted as a crystal, yet it is not a passive observer; rather, it is the
  very medium through which the cognised manifests. This aligns with Dvivedi’s observation that the mind “loses itself” in
  the object, yet the object itself is seen in its place. The philosophical claim here is that liberation is achieved not
  by external detachment but by internal annihilation of the mind’s own transformations, allowing the self to be fully present
  in the object of meditation. This has existential implications: it teaches that the path to self‑realisation is a deliberate,
  sustained practice of stilling the mind’s tendencies, leading to a state where subject and object merge into a single, luminous
  awareness.


  Key Terms


  **kṣīṇavṛtter (क्षीणवृत्त)** — ‘kṣīṇa’ (annihilation) + ‘vṛtta’ (transforming tendency) – the deliberate cessation of mental
  fluctuations; in Sāṃkhya this is the first step toward samādhi, contrasting with the passive ‘śānta’ state of ordinary stillness.


  **citta (चित्त)** — ‘citta’ (mind) – the organ of perception and cognition; here it is the locus of vṛtti that must be annihilated
  for union with the cogniser.


  **vṛtti (वृत्ति)** — ‘vṛtti’ (mental activity) – the dynamic, transforming tendencies of citta; its annihilation (kṣīṇavṛtter)
  is essential for samādhi.


  **samādhi (समाधि)** — ‘samādhi’ (absorption) – the state of complete identity with the cogniser, cognition, and cognised;
  in this sutra it is the result of annihilating vṛtti.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.41:** Explicit linkage of annihilated vṛtti to identity with cogniser, cognition, cognised

  *Divergence:* Unlike later sutras that separate the three as distinct objects, here they are merged into a single experience
  of absorption.


  **Yoga Sūtra 1.42:** Continuation of the theme of absorption into the cognised

  *Divergence:* 1.42 narrows focus to the cognised alone, whereas 1.41 presents a triadic unity.


  **Yoga Sūtra 1.43:** Further elaboration on the nature of the absorbed state

  *Divergence:* 1.43 introduces the idea of the mind becoming the object, a development from the mere identity expressed in
  1.41.


  **Yoga Sūtra 1.40:** Preceding sutra discusses the cessation of vṛtti

  *Divergence:* 1.40 describes the process of annihilation, while 1.41 states the resulting state, highlighting the causal
  chain.'
insight: The passage asserts that a true yogi’s mind, when its vṛtti (transforming tendencies) are extinguished, dissolves
  into a state of perfect identity with the triad of cogniser, cognition, and cognised.
practice: You sit quietly, focus your attention on a single object, and consciously let all mental fluctuations cease, allowing
  your awareness to become fully one with that object.
