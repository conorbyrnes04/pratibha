sanskrit_devanagari: क्षीणवृत्तरेभिजातस्येवा मणेर् ग्रहितृग्राहणग्राह्येषु तत्त्वशतदंजनातां समापत्तिḥ
sanskrit_iast: kṣīṇavṛtter abhijātasyeva maṇer grahītṛgrahaṇagrāhyeṣu tatsthatadañjanatā samāpattiḥ
translation_literal: When the mental fluctuations have been worn thin, absorption (samāpatti) arises as
  a transparency—like a jewel assuming the color of what lies beneath it—in which the one who grasps,
  the act of grasping, and the thing grasped become unified in their essential nature.
commentary: 'This sūtra describes samāpatti, the culminating stage of meditation where subject-object
  duality dissolves. Patañjali uses the jewel metaphor (maṇi) to illustrate a precise yogic mechanism:
  just as a transparent gem takes on the hue of its substrate without losing its own nature, the meditator''s
  consciousness becomes so refined (kṣīṇavṛtti—worn thin, depleted of obscuring fluctuations) that it
  mirrors the object of meditation perfectly. The three terms—grahītṛ (knower), grahaṇa (knowing), grāhya
  (known)—represent the classical Sāṃkhya triad of subject, process, and object. In samāpatti, these collapse
  into non-duality not through intellectual understanding but through direct perceptual transparency.
  This is not blank unconsciousness but heightened lucidity where consciousness and its object become
  indistinguishable. The sūtra emphasizes that this requires prior purification of the mind (kṣīṇavṛtti)—fluctuations
  must genuinely thin out, not merely be suppressed. The ''essential nature'' (tatsthatadañjanatā) suggests
  that both knower and known reveal their true form when the mediating mental activity ceases. This is
  the gateway to kaivalya, the final liberation described in Yoga Sūtra 4.34.


  Key Terms


  **kṣīṇavṛtti** — Mental fluctuations worn thin or depleted; the prerequisite clarity of mind from which
  absorption arises

  **samāpatti** — Complete absorption or coalescence; the state in which subject and object merge into
  unified perception

  **grahītṛ-grahaṇa-grāhya** — The Sāṃkhya triad: knower, knowing, and known—the three poles of ordinary
  consciousness that dissolve in samāpatti'
insight: The passage asserts that a true yogi’s mind, when its vṛtti (transforming tendencies) are extinguished,
  dissolves into a state of perfect identity with the triad of cogniser, cognition, and cognised.
practice: 'Place a clear glass or crystal object between you and a colored surface—a cloth, wall, or flower.
  Watch how the jewel takes on that color while remaining itself, transparent and unchanged. Now close
  your eyes and let your awareness become that jewel: notice how thought, the thinker, and what is being
  thought begin to lose their separate edges, each one coloring and being colored by the others until
  you cannot say where one ends and another begins. When you open your eyes, the jewel will teach you
  what you just were.'
