      work this term does here'
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Complete Absorption in the Cognised”:
      here it is the locus of vṛtti that must be annihilated for union with the cogniser -> not ‘brain software’ or an enemy
      to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Complete Absorption in the Cognised”: is essential for
      samādhi -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Complete Absorption in the Cognised”: in this sutra it is
