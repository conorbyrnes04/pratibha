sanskrit_devanagari: 'तपःस्वाध्यायेः‑ईश्वरप्रणिधानानि क्रियायोगः ॥ २.१ ॥


  समाधिभावनार्थः क्लेशतानुकरणार्थः च ॥ २.२ ॥'
sanskrit_iast: 'tapaḥsvādhyāyeśvarapraṇidhānāni kriyāyogaḥ || 2.1 ||


  samādhibhāvanārthaḥ kleśatanūkaraṇārthaś ca || 2.2 ||'
translation_literal: '**2.1** Austerity (tapas), self-study (svādhyāya), and surrender to the Lord (īśvarapraṇidhāna)
  constitute the yoga of action (kriyāyoga).

  **2.2** It is undertaken for the cultivation of meditative absorption (samādhibhāvanā) and the attenuation
  of affliction (kleśatanūkaraṇa).'
commentary: 'Patañjali opens the second pāda by establishing kriyā yoga—yoga enacted through disciplined
  action—as the practical gateway to samādhi and the dissolution of kleśa (afflictions). The three pillars
  of this yoga are tapas (austerity as conscious self-purification), svādhyāya (study of sacred texts
  and self-inquiry), and īśvara-praṇidhāna (surrender to the divine principle). These are not external
  mortifications or mere intellectual exercises, but integrated practices that systematically purify the
  citta (mind-stuff) and reorient prakṛti''s movements toward puruṣa''s unconditioned awareness.


  The philosophical architecture here is crucial: within Sāṃkhya-Yoga, prakṛti operates through vṛtti
  (mental modifications) that obscure puruṣa''s true nature. Kleśa—ignorance, egoism, attachment, aversion,
  and fear of death—are the root distortions that perpetuate this obscuration. Sūtra 2.1 asserts that
  tapas, svādhyāya, and īśvara-praṇidhāna function as active counterforces: tapas burns away accumulated
  mental residue (saṃskāra); svādhyāya redirects the intellect toward truth rather than habitual delusion;
  īśvara-praṇidhāna dissolves the ego-centered will that sustains kleśa. These are not passive surrenders
  but intentional practices that harness prakṛti''s own dynamism for liberation.


  Sūtra 2.2 clarifies the dual purpose: kriyā yoga cultivates samādhi as a stable, habitual state (not
  a fleeting glimpse) while simultaneously attenuating the five kleśa. This is not redundancy but reciprocal
  causation. As kleśa weaken through systematic practice, the citta naturally gravitates toward samādhi;
  conversely, as samādhi deepens, the practitioner sees through the illusions that feed kleśa. The text
  thus rejects both quietism (waiting for grace) and mere intellectual understanding (jñāna without sādhana).
  It insists that embodied, disciplined action within the world of prakṛti is the necessary means by which
  puruṣa''s freedom becomes experientially real. The practitioner does not escape prakṛti but transforms
  the relationship to it—moving from unconscious entanglement (avidyā) to conscious participation in one''s
  own liberation.


  Key Terms


  **kriyā yoga** — yoga of action; the preliminary discipline of tapas, svādhyāya, and īśvara-praṇidhāna
  that purifies the mind and prepares it for samādhi

  **tapas** — austerity; conscious self-purification through disciplined practice that burns away mental
  obscurations and saṃskāra

  **kleśa** — the five afflictions (avidyā, asmitā, rāga, dveṣa, abhiniveśa) that bind consciousness to
  prakṛti and perpetuate suffering

  **īśvara-praṇidhāna** — surrender to the divine principle; devotional alignment that dissolves ego-centered
  will and opens the citta to grace


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.1–6.2:** Both texts define yoga as disciplined action (karma-yoga / kriyā-yoga) that
  integrates practice, study, and devotion. The Gītā''s insistence that ''yoga is skill in action'' (yogaḥ
  karmasu kauśalam) parallels Patañjali''s framing of kriyā yoga as intentional, systematic practice rather
  than passive renunciation. Divergence: The Gītā emphasizes action in the world (svadharma) without attachment
  to results, whereas Patañjali''s kriyā yoga is explicitly preparatory—aimed at samādhi and kleśa-reduction
  rather than dharmic duty. The Gītā''s actor remains engaged in social obligation; Patañjali''s practitioner
  is progressively withdrawn from prakṛti''s entanglements.

  **Epictetus, Enchiridion 1.1–1.2:** Both philosophers distinguish what lies within human control (disciplined
  will, study, practice) from what does not (external outcomes, others'' opinions). Epictetus''s ''dichotomy
  of control'' and Patañjali''s tapas-svādhyāya framework both locate liberation in the systematic training
  of attention and intention rather than in circumstance. Divergence: Epictetus remains within a Stoic
  metaphysics of reason and fate; Patañjali invokes a dualistic ontology (puruṣa-prakṛti) where liberation
  means transcending prakṛti entirely, not merely aligning reason with cosmic order. For Epictetus, virtue
  is the goal; for Patañjali, virtue is the means to kaivalya (absolute isolation of puruṣa).

  **Dhammapada 183–185:** The Buddha''s teaching that ''effort is the path to the Deathless; heedlessness
  is the path to death'' resonates with Patañjali''s insistence on tapas and disciplined practice as the
  foundation of liberation. Both traditions reject passivity and emphasize intentional cultivation of
  mental states. Divergence: The Buddha teaches the Middle Way, explicitly rejecting extreme asceticism;
  Patañjali''s tapas, while not self-mortification, remains a more austere framework. More fundamentally,
  Buddhism denies a permanent puruṣa or ātman, whereas Patañjali''s entire system rests on liberating
  puruṣa from prakṛti''s conditioning—a metaphysical gulf.'
insight: The passage asserts that the path to samādhi begins with a triad of disciplined actions—mortification,
  study, and devotion—each of which purifies the mind and aligns it with the divine will.
practice: You practice preliminary Yoga by engaging in disciplined self‑austerity, studying sacred texts,
  and surrendering your will to the divine, thereby purifying your mind and aligning it with the ultimate
  reality.
