unit_label: Continence Yields Vigor
title: Continence Yields Vigor
unit_type: sutra
sanskrit_devanagari: ब्रह्मचार्यप्रतिष्ठायाम् वीर्यलाभः
sanskrit_iast: brahmacaryapratiṣṭhāyāṃ vīryalābhaḥ
translation_literal: By establishing continence, one gains vigor.
commentary: 'The passage asserts that disciplined continence (brahmacarya) is the prerequisite for acquiring vital energy
  (vīrya). It is not merely a moral injunction but a strategic cultivation of inner resources. In the Sāṃkhya‑Yoga framework,
  the mind’s fluctuations (vṛtti) drain the subtle energies that sustain the body and the higher faculties. By restraining
  the senses and conserving the vital fluid, the practitioner preserves the prāṇa that fuels the mind’s activity, thereby
  enabling sustained meditative concentration (samādhi). The claim is that without this energetic reserve, the mind remains
  exhausted and cannot engage in the disciplined practice required for liberation. This view aligns with the Sāṃkhya doctrine
  that prakṛti’s subtle energies, once conserved, can be transformed into ojas, which fortifies the body and mind. The existential
  implication is clear: a life lived in moderation cultivates the stamina necessary to confront the trials of the world and
  to progress toward self‑realization. The Satchidananda commentary’s emphasis on “saving energy” echoes this, though it expands
  into social and relational contexts. The core philosophical move—identifying continence as the source of vigor—remains contested
  in some traditions that prioritize direct meditative practice over bodily discipline. Nonetheless, within the Yoga canon,
  this strategy is presented as indispensable for sustaining the practice of the higher yogas.


  Key Terms


  **brahmacarya (ब्रह्मचार्य)** — ‘brahma’ (the Absolute) + ‘carya’ (to act); traditionally means celibacy or disciplined
  conduct; the translation ‘continence’ captures the practice of conserving vital energy but omits its role as a preparatory
  stage for higher yogic realization.


  **vīrya (वीर्य)** — ‘vīrya’ denotes vital energy or vigor; beyond mere physical strength, it encompasses mental and spiritual
  dynamism that supports sustained practice.


  **lābhaḥ (लाभः)** — ‘lābhaḥ’ means gain or profit; in this context it signals the accumulation of inner resources rather
  than external wealth.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.38:** Structural parallel: ‘brahmacaryapratiṣṭhāyāṃ vīryalābhaḥ’ mirrors the earlier Sūtra 2.37 ‘brahmāṇḍaḥ
  svābhāvikaḥ’ in pattern of compound + verb + object, emphasizing foundational quality leading to outcome.

  *Divergence:* While 2.37 speaks of the inherent nature of the cosmos, 2.38 focuses on the practitioner’s cultivation, shifting
  from cosmic to personal agency.


  **Bhaṭṭa’s Sādhana Pāda:** Both treat brahmacarya as a preparatory stage; Bhaṭṭa elaborates on its psychological effects,
  whereas the Sūtra condenses it to a single causal claim.

  *Divergence:* Bhaṭṭa’s commentary expands the experiential dimension, whereas the Sūtra remains aphoristic, leaving interpretation
  to the practitioner.'
insight: The passage asserts that disciplined continence (brahmacarya) is the prerequisite for acquiring vital energy (vīrya).
practice: Establish continence now, and you will experience increased vigor in your daily activities.
