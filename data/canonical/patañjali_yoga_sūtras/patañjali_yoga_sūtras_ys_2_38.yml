title: Continence Yields Vigor
unit_type: sutra
sanskrit_devanagari: ब्रह्मचार्यप्रतिष्ठायाम् वीर्यलाभः
sanskrit_iast: brahmacaryapratiṣṭhāyāṃ vīryalābhaḥ
translation_literal: When continence is firmly established, vigor is gained.
commentary: 'This sūtra appears in Patañjali''s treatment of the niyamas (observances), specifically brahmacarya—often
  translated as celibacy or chastity, but more precisely the conservation and right direction of vital
  energy. The word brahmacarya literally means ''conduct leading toward Brahman'' or the absolute; it
  is not merely sexual abstinence but a disciplined channeling of prāṇa (life force) away from dissipation
  and toward spiritual practice.


  The term pratiṣṭhā means ''firmly established'' or ''grounded''—not a temporary restraint but a stable,
  integrated state. When this foundation is solid, vīrya (vigor, potency, heroic strength) naturally arises.
  In the Yoga–Sāṃkhya framework, vīrya is not mere physical stamina but the concentrated vital power available
  for meditation, breath work, and the ascent of kuṇḍalinī śakti. Energy that would otherwise be scattered
  through habitual indulgence becomes available as mental clarity, resilience, and spiritual momentum.


  This is not moralistic prohibition but energetic economy: the body and mind have finite reserves of
  prāṇa. When brahmacarya is established—meaning the practitioner has genuinely transformed their relationship
  to desire rather than merely suppressing it—the reclaimed energy manifests as heightened capacity for
  practice, deeper states of concentration, and accelerated progress on the path. The vigor is both subtle
  (mental acuity, steadiness) and gross (physical endurance, vitality).


  Key Terms


  **brahmacarya** — Conduct of vital energy toward the absolute; disciplined channeling of prāṇa away
  from compulsive dispersal; often translated as celibacy or continence, but fundamentally an energetic
  principle.

  **pratiṣṭhā** — Firm establishment, grounding, or stable foundation; a state that is integrated and
  enduring, not temporary or forced.

  **vīrya** — Vigor, potency, heroic strength, or concentrated vital power; the capacity for sustained
  effort and penetrative insight in practice.'
insight: The passage asserts that disciplined continence (brahmacarya) is the prerequisite for acquiring
  vital energy (vīrya).
practice: 'At the moment you feel an impulse to disperse your attention—toward a screen, fantasy, distraction,
  or compulsive doing—pause and place your hand on your lower belly. Breathe in for a count of four, feeling
  the prāṇa gather inward and downward, then exhale slowly. Repeat three times, naming silently: ''vigor
  returns.'' Notice how the scattered impulse transforms into collected presence.'
