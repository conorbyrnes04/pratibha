    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Consciousness in the Realm of
      Reality”: the subtle, intelligent matrix of nature from which all form emerges -> not pastoral ‘Nature’;
      the tri-guṇa matrix generating all experience including mind'
  - term: videha (विध)
    definition: '‘vid’ (to know) + ‘aha’ (to be) -> in “Consciousness in the Realm of Reality”: the term’s
      literal meaning of ‘world‑bound’ is often lost in translations that render it simply as ‘body’ ->
      default English flattens the technical work this term does here'
  - term: prāyā (प्राय)
    definition: '‘prā’ (to go) + ‘yā’ (going) -> in “Consciousness in the Realm of Reality”: translations
      often gloss it as ‘realm of nature’ but miss its ontological status as the field of activity ->
      default English flattens the technical work this term does here'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Consciousness in the Realm of Reality”:
      translations often use ‘meditation’ but fail to convey its depth as the cessation of all mental
      fluctuations -> not trance-entertainment or unconsciousness; graded absorption where subject–object
      friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Consciousness in the Realm
      of Reality”: translations often simplify it to ‘soul’ but neglect its role as the witness consciousness
      -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
