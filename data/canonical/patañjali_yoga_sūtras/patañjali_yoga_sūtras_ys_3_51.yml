sanskrit_devanagari: स्थायिनुपमन्त्रणे सङ्गसमयाकारणं पुनः अनिष्टप्रसङ्गात्
sanskrit_iast: sthānyupanimantraṇe saṅgasmayākaraṇaṃ punar aniṣṭaprasaṅgāt
translation_literal: When the deities or celestial powers offer enticement through the attainment of stable
  supernatural abilities, one must not become attached or proud—for such attachment leads again to undesirable
  entanglement.
commentary: 'This sūtra addresses a critical juncture in yogic practice: the emergence of siddhis (supernatural
  powers or accomplishments). As the mind stabilizes through sustained practice, genuine capacities arise—clairvoyance,
  telepathy, levitation, and other abilities documented across yogic literature. The sūtra warns that
  these attainments become a trap precisely because they are real and alluring.


  The phrase sthānyupanimantraṇe (''invitation through stable powers'') suggests that once a siddhi manifests,
  both external forces (personified as deities) and the practitioner''s own ego tempt one to linger, to
  cultivate, to display, or to become identified with these powers. Saṅgasmayākaraṇam (''attachment and
  pride'') names the psychological poison: the ego colonizes the achievement and claims it as personal
  attainment.


  Patañjali''s diagnosis is precise: this attachment (saṅga) loops back into aniṣṭaprasaṅga—''undesirable
  entanglement'' or renewed bondage. The practitioner who becomes fascinated by siddhis has fundamentally
  reversed direction. Instead of moving toward kaivalya (liberation), they have become ensnared in a subtle
  form of prakṛti (the manifest world), merely at a finer level.


  Within the Yoga–Sāṃkhya framework, siddhis are not illusions; they are real modifications of prakṛti
  accessible to a purified mind. But they are still modifications—still within the realm of becoming,
  not being. The non-attachment Patañjali prescribes is not denial but clear seeing: these powers are
  useful tools for the journey, not destinations. The moment one stops to admire the view, one has left
  the path.


  Key Terms


  **siddhi** — An extraordinary power or accomplishment arising from yogic practice; a real but subtle
  modification of prakṛti that can become a trap if pursued as an end in itself.

  **saṅga** — Attachment, clinging, or identification; the ego''s tendency to grasp and claim ownership
  of experiences or attainments.

  **kaivalya** — Liberation or aloneness; the final goal of yoga, in which consciousness (puruṣa) stands
  free from all entanglement with the manifest world (prakṛti).'
insight: The central claim of this verse is that the very act of clinging to siddhis—whether they are
  subtle powers or external accolades—constitutes a form of attachment that perpetuates bondage.
practice: 'This week, notice one small capacity or achievement you possess—perhaps a skill, a moment of
  clarity, a positive quality others have praised. Sit quietly for 5–10 minutes and observe the impulse
  to identify with it, to strengthen it, to show it off, or to feel special because of it. Do not suppress
  the impulse; simply watch it arise and pass. Then ask yourself: ''If this capacity were to vanish tomorrow,
  would I still be?'' Feel into the answer. This simple inquiry trains the mind to hold accomplishments
  lightly, to use them without being used by them. Repeat with a different capacity each day for a week.'
