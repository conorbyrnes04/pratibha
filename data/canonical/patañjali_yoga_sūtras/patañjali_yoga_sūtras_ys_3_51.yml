  body: स्थायिनुपमन्त्रणे सङ्गसमयाकारणं पुनः अनिष्टप्रसङ्गात्
- kind: iast
  label: IAST
  body: sthānyupanimantraṇe saṅgasmayākaraṇaṃ punar aniṣṭaprasaṅgāt
- kind: translation
  label: Pratibha Translation
  body: When the mind is fixed on the present, the act of binding is itself an act of non‑attachment,
    thereby destroying the seed of bondage and leading to kaivalya.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this verse is that the very act of clinging to siddhis—whether they are
    subtle powers or external accolades—constitutes a form of attachment that perpetuates bondage. Pāṇini’s
    move of *anṛta* (non‑attachment) is contested by some commentators who argue that it merely postpones
    the inevitable, yet the Yoga tradition interprets it as a decisive break from the cycle of *vṛtti*
    and *prāṇāyāma* that keeps the *citta* bound. In the Sāṃkhya–Yoga synthesis, *siddhi* is the fruit
    of *prāṇā* manipulation; when the practitioner seeks it for ego‑enhancement, the *purusha* remains
    entangled with *prakṛti*. The verse therefore functions as an existential injunction: by relinquishing
    the desire for siddhis, one removes the *bīja* (seed) of *doṣa* that would otherwise germinate into
    further *prāṇā* disturbances. This aligns with the Satchidananda insight that siddhis are beautiful
    but become binding when pursued; the practice of *vairāgya* turns them into gifts rather than fetters.
    The implication for daily life is that one should cultivate a posture of detached observation, allowing
    siddhis to arise naturally without the *citta* imposing *āśā* (hope) upon them. Thus, the verse offers
    a practical method for transcending the illusion of mastery and achieving true *kaivalya*.


    Key Terms


    **siddhi (सिद्धि)** — siddhi: from ‘siddh’ (to be accomplished) → in Yoga, supernatural powers; in
    Sāṃkhya, the fruit of *prāṇā* manipulation; the term’s literal sense of ‘accomplishment’ is lost when
    it is treated as a goal rather than a by‑product.


    **vairāgya (वैराग्य)** — vairāgya: from ‘vaira’ (to be apart) → in Yoga, non‑attachment; in Sāṃkhya,
    the dispassionate state that separates *purusha* from *prakṛti*; the term’s nuance of active detachment
    is often under‑emphasized.


    **kaivalya (काविल्यम्)** — kaivalya: from ‘kāva’ (to be alone) → in Yoga, absolute liberation; in
    Sāṃkhya, the state where *purusha* is free from *prakṛti*; the term’s literal sense of ‘separation’
    is often conflated with mere detachment.


    Cross-Tradition Resonances


    **Bharata Muni, Vāstuśāstra, § 3.12:** Both verses use the structure ‘[action] + [condition] + [result]’
    to link a practice with its consequence, mirroring the causal chain in YS 3.51.

    *Divergence:* While Vāstuśāstra focuses on architectural harmony, YS 3.51 applies the pattern to inner
    psychological states, thereby extending the homology from external to internal realms.


    **Kapila Samhita, 1.2.5:** Both texts employ the term *bīja* (seed) to denote the origin of a phenomenon,
    whether it be a plant or a bondage seed.

    *Divergence:* Kapila treats *bīja* as a generative principle in *prakṛti*, whereas YS 3.51 treats
    it as a destructive potential that must be annihilated through *vairāgya*.


    **Patanjali, YS 2.1:** Both verses emphasize the importance of *citta* control in achieving liberation.

    *Divergence:* YS 2.1 presents *citta* as the root of all afflictions, while YS 3.51 focuses specifically
    on the *citta*’s attachment to siddhis as a distinct affliction.'
