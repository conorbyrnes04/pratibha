sanskrit_devanagari: सत्त्वपुरुषायोर अत्यान्तासंकीर्णयोः प्रत्ययाविशेषो भोगः परार्थात् स्वार्थसंयमात्
  पुरुषज्ञानम्
sanskrit_iast: sattvapuruṣayor atyantāsaṃkīrṇayoḥ pratyayāviśeṣo bhogaḥ parārthāt svārthasaṃyamāt puruṣajñānam
translation_literal: When sattva and purusha are utterly unmixed, the undifferentiated flow of experience
  is enjoyment—for another's purpose. From relinquishing that other-directed aim, through restraint of
  one's own purpose, comes knowledge of purusha.
commentary: 'This sūtra addresses the final knot of bondage: the subtle identification between consciousness
  (purusha) and the luminous quality of mind (sattva). Even when all gross fluctuations cease and the
  mind becomes transparent and blissful, a seeker may mistake this refined mental clarity for liberation
  itself. The sūtra warns that such experience—however pure and undifferentiated it appears—remains *bhoga*,
  enjoyment or experience, because it still serves *para-artha*, another''s purpose: the evolutionary
  agenda of prakṛti (nature), not the purusha''s own freedom.


  The turning point comes through *svārthasaṃyama*: restraint or non-identification with one''s own habitual
  aim (the subtle desire to maintain even sattvic states). This is not rejection but dispassionate observation.
  By withdrawing investment from the goal of refined experience itself—by ceasing to be the enjoyer even
  of sattva''s luminosity—the purusha recognizes itself as the witnessing consciousness that was never
  bound. This recognition (*puruṣajñānam*) is not another experience to attain but the collapse of the
  subject-object duality that sustained all experience.


  Within the Yoga–Sāṃkhya framework, this marks the transition from *samprajñāta samādhi* (absorption
  with object-consciousness) to *asamprajñāta samādhi* (seedless absorption), and ultimately to *kaivalya*
  (isolation/liberation): the purusha''s recognition of its nature as eternally free, untouched by the
  play of sattva.


  Key Terms


  **sattva** — The luminous, harmonious quality of nature (prakṛti); clarity, goodness, and transparency
  of mind; one of the three guṇas.

  **purusha** — Pure consciousness; the witnessing subject; the true self, eternally free and untouched
  by the modifications of nature.

  **bhoga** — Experience, enjoyment, or the state of being an enjoyer; any condition in which consciousness
  identifies with content rather than recognizing itself as the witness.'
insight: The central claim of this sutra is that the deepest experience of the [sattva‑purusha] is not
  a mere pleasure but a disciplined insight that arises only through self‑control.
practice: 'In meditation, when you experience clarity, peace, or luminous mental states, pause and ask:
  *Who is experiencing this?* Do not try to deepen the state or hold it. Instead, gently withdraw your
  sense of ownership from it. Notice the subtle satisfaction or pride in having achieved such a state—and
  let that go too. Rest as the awareness that observes the arising and passing of all states, including
  the most refined ones. This is not suppression but a shift from being the enjoyer to being the witness.
  Practice this for 5–10 minutes daily after your regular meditation, or whenever sattvic states arise
  naturally.'
