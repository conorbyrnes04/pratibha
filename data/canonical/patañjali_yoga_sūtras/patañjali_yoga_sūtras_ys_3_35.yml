  items:
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Experience of the Sattva‑Purusha”:
      → Saṃkhya: the unchanging, passive witness -> not ‘person’ as social self; the unchanging witness
      distinct from prakṛti’s display'
  - term: saṃyama (संयम)
    definition: 'sam-√yam ‘hold together’ → the triad dhāraṇā-dhyāna-samādhi as one -> in “Experience
      of the Sattva‑Purusha”: The experience of the [sattva‑purusha] is the most intense concentration
      of [pratyaya] (direct perception). -> not generic self-control; technical confluence that yields
      prajñā and siddhis'
  - term: pratyaya (प्रत्यय)
    definition: 'prati-√i ‘go toward’ → cognitive content/presentation -> in “Experience of the Sattva‑Purusha”:
      translation as ‘perception’ understates its epistemic status as the sole means of valid knowledge
      -> not grammatical ‘suffix’; the mind’s object-presenting content in a given moment'
  - term: sattva (सत्त्व)
    definition: 'sat + tva ‘being-ness / luminosity-clarity strand’ -> in “Experience of the Sattva‑Purusha”:
      → Saṃkhya: the principle of harmony and clarity that animates prakṛti -> not moral ‘goodness’ alone;
      the guṇa of clarity that can still bind if identified with'
  - term: samāyama (समायाम)
    definition: 'source-term samāyama -> in “Experience of the Sattva‑Purusha”: translation as ‘self‑control’
      lacks its specific yogic connotation of sustained, balanced attention -> default English flattens
      the technical work this term does here'
