sanskrit_devanagari: विशेषविशेषलिङ्गामात्रालिङ्गानि गुणपरवाणि
sanskrit_iast: viśeṣāviśeṣaliṅgamātrāliṅgāni guṇaparvāṇi
translation_literal: 'The stages of the guṇas are: the differentiated, the undifferentiated, the marked-only, and the unmarked.'
commentary: 'This sūtra (YS 1.45) maps the hierarchical unfoldment of the three guṇas—sattva, rajas, and tamas—across four
  ontological levels, a crucial framework in Sāṃkhya metaphysics that Patañjali integrates into yoga practice.


  **The Four Stages:**


  1. **Viśeṣa (differentiated)**: The gross, manifest realm of individual objects, sense-perceptions, and distinct forms.
  Here the guṇas appear as separate, localized qualities in matter—the wood is brown, the fire is hot. This is the world of
  everyday experience and the five gross elements (bhūta).


  2. **Aviśeṣa (undifferentiated)**: The subtle realm where objects have lost individual distinction but retain potential
  form. This is the domain of the tanmātras (subtle essences) and the subtle body (sūkṣma-śarīra). The guṇas operate here
  as tendencies rather than manifest properties.


  3. **Liṅgamātra (marked-only)**: The causal level where only the *mark* or *signature* of manifestation remains—pure potentiality
  with the capacity to differentiate. This approaches the threshold of prakṛti''s creative impulse (prakṛti-pradhāna), where
  the guṇas exist in perfect equilibrium but retain the *seed-form* of all future expression.


  4. **Aliṅga (unmarked)**: Prakṛti in its unmanifest, transcendent state—the ground of all becoming, prior to any mark, form,
  or quality. This is prakṛti as pure potential, indistinguishable from the guṇas in their causal unity, yet not yet the first
  stirring of creation.


  **Yogic Significance:**


  For the practitioner, this sūtra clarifies that samādhi (absorption) involves a progressive inversion of this hierarchy.
  The yogi learns to withdraw attention from the gross (viśeṣa) through the subtle (aviśeṣa), past the causal seed-forms (liṅgamātra),
  until consciousness rests in the unmarked ground (aliṅga)—or more precisely, in puruṣa''s pure witnessing, which is eternally
  distinct from all guṇa-stages. This is not annihilation but a return to the source of manifestation, where the guṇas cease
  to bind because they are no longer mistaken for the Self.


  The sūtra also teaches that ignorance (avidyā) operates at all four levels; liberation requires seeing through each layer''s
  apparent solidity to the unchanging witness beyond.


  Key Terms


  **guṇa** — The three fundamental qualities of prakṛti (matter/nature): sattva (luminosity, harmony), rajas (activity, passion),
  and tamas (inertia, darkness). All manifest reality is their interplay.

  **prakṛti** — The field of nature, matter, or creative potential in Sāṃkhya; the entire manifest and unmanifest cosmos,
  eternally distinct from puruṣa (consciousness).

  **tanmātra** — The subtle essences or potentials of the five elements (sound, touch, form, taste, smell); the bridge between
  gross matter and causal potential.'
insight: The sūtra asserts that the Gunas are not merely abstract qualities but exist in distinct, progressive stages.
practice: '**Reverse Layering Meditation (Guṇa-Pratyāhāra)**


  Sit comfortably. Spend 2 minutes observing gross objects around you—their colors, shapes, textures (viśeṣa). Notice how
  your mind names and categorizes them.


  Then close your eyes and shift attention to the *sensations* beneath the forms: warmth, pressure, vibration, space. These
  are the undifferentiated substrates (aviśeṣa) from which all perception arises. Spend 2 minutes here, feeling how all sensation
  is actually one field of subtle energy.


  Next, move deeper: sense the *potential* for sensation—the quiet readiness of the nervous system, the capacity for awareness
  itself before any particular sensation arises (liṅgamātra). This is the seed-level. Rest here for 2 minutes.


  Finally, release even that sense of potential. Rest in pure awareness—not *your* awareness of something, but awareness itself,
  unmarked and untouched (aliṅga). No effort, no object. 2–3 minutes.


  Return slowly, reversing the layers. This practice trains the mind to recognize that all grossness is born from subtlety,
  all subtlety from causal potential, and all causation from the unmarked ground—and that you, the witness, are none of these.'
