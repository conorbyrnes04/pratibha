sanskrit_devanagari: ततः क्षीयेते प्रकाशावरणम्
sanskrit_iast: tataḥ kṣīyate prakāśāvaraṇam
translation_literal: Then the covering that obscures light is worn away.
commentary: 'This sūtra appears in the context of pratipakṣa-bhāvanā (cultivation of the opposite) and
  the progressive refinement of mental activity through yogic practice. When the mind''s habitual patterns
  of distraction, aversion, and false identification are systematically countered through disciplined
  practice, the obscuring layers dissolve.


  Prakāśa (light) in Yoga–Sāṃkhya refers to the inherent luminosity of consciousness itself—the capacity
  to know, to illuminate experience. This is not metaphorical light but the fundamental property of sentience.
  Āvaraṇa (covering, veil) represents the accumulated conditioning, mental turbidity (rajas and tamas),
  and the identification with the body-mind apparatus that prevents direct recognition of this luminosity.


  The word kṣīyate (is worn away, diminishes) suggests a gradual erosion rather than sudden revelation.
  Through consistent practice—whether āsana, prāṇāyāma, or meditation—the density of mental obscuration
  thins. Thoughts slow. The gaps between thoughts widen. In those gaps, the intrinsic clarity of awareness
  becomes unmistakable.


  This is not the acquisition of something new but the removal of obstruction. The light was always present;
  only the veil required dissolution. This directly supports the Yoga Sūtras'' non-dualistic vision: consciousness
  is self-luminous; bondage is forgetting this through mental habit.


  Key Terms


  **prakāśa** — Light, luminosity; in Yoga–Sāṃkhya, the self-illuminating quality of pure consciousness
  (puruṣa)

  **āvaraṇa** — Covering, veil, obscuration; the mental and karmic conditions that obscure direct recognition
  of consciousness

  **kṣīyate** — Is worn away, diminishes, dissolves; indicates gradual attenuation through practice'
insight: The sūtra asserts that the practice annihilates the veil that obscures the soul’s luminous nature.
practice: Through each day's routine tasks—washing, eating, walking—pause mid-action and let your attention
  rest on the space of awareness itself rather than its contents, as though watching the light that shows
  the activity instead of the activity itself. When you notice you've drifted back into identifying with
  thought or sensation, simply return to sensing that luminous knowing-quality, wearing away the habit
  of obscuration through this repeated, gentle recognition.
