- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that the practice annihilates the veil that obscures the soul’s luminous nature. In Sāṃkhya, the
    soul (puruṣa) is eternally luminous, yet its light is shrouded by prakṛti’s manifold manifestations, which are the products
    of karma. The ‘covering of light’ is therefore the composite of all passively generated phenomena that obscure the soul’s
    inherent bliss. By the disciplined practice (pi‑ai‑i‑y‑ma), this veil is removed, allowing the soul to experience its
    true nature directly. This aligns with the Yoga school’s emphasis on samādhi as the state where the mind is absorbed (dharana)
    into the subject, thereby revealing the soul’s pure awareness. The Dvivedi commentary’s mention of the soul’s blissful
    freedom echoes the Sāṃkhya view that the soul’s inherent bliss is latent until the veil is shed. The existential implication
    is that liberation is not a future event but an immediate realization achievable through disciplined practice, underscoring
    the immediacy of the yogic path.


    The sūtra’s brevity masks a profound claim: that the very act of practice is the agent of dissolution. It is not the passive
    removal of ignorance but an active, intentional effort that dispels the ‘light’s covering.’ This resonates with the notion
    that the mind, once purified, becomes fit for absorption (LII I.), suggesting a causal link between the removal of the
    veil and the mind’s capacity for deep concentration. The practice here is not merely a technique but a transformative
    process that brings the practitioner into direct communion with the soul’s luminous essence.


    Key Terms


    **prakāśāvaraṇam (प्रकाशावरणम्)** — prakāśa (light) + āvaraṇa (covering) -> the veil that obscures the soul’s inherent
    light; the term highlights the duality of illumination and concealment, a nuance lost in simple translations of ‘veil’
    or ‘cover’.


    **pi‑ai‑i‑y‑ma (पी‑आइ‑इ‑य‑मा)** — a composite of yogic practices aimed at purifying the mind; in Sāṃkhya, it represents
    the systematic removal of karma-generated obscurations, thereby revealing the soul’s true nature.


    **puruṣa (पुरुष)** — the conscious principle, eternally luminous and blissful; its light is the subject of the sūtra’s
    claim.


    **prakṛti (प्रकृति)** — the material principle, source of all phenomena; its manifestations constitute the ‘covering of
    light’ that must be dispelled.


    Cross-Tradition Resonances


    **Yoga Sūtra 2.52:** Structural homology: the sūtra’s terse formulation mirrors the pattern of earlier verses where a
    single action (e.g., ‘tataḥ’ + verb) precedes a state of dissolution.

    *Divergence:* Unlike prior verses that focus on external objects, this sūtra centers on an internal veil, expanding the
    scope of what can be ‘destroyed’.


    **Sāṃkhya Kāṇḍa 1.1:** Both texts posit that the soul’s light is obscured by prakṛti; the sūtra operationalizes this by
    prescribing practice.

    *Divergence:* Sāṃkhya remains descriptive, whereas the Yoga Sūtra introduces an active, prescriptive dimension.


    **Dvivedi Commentary on 2.52:** Both emphasize the soul’s blissful nature and the role of practice in revealing it.

    *Divergence:* Dvivedi’s commentary expands the metaphor to include karma-generated phenomena, whereas the sūtra keeps
    the focus narrowly on the ‘covering of light’.'
