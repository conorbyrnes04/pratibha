sanskrit_devanagari: बाह्याभ्यन्तरस्तम्भवृत्तिर् देशकालसंख्या भिः परिदृश्यो दीर्घसूक्ष्मः
sanskrit_iast: bāhyābhyantarastambhavṛttir deśakālasaṃkhyābhiḥ paridṛṣṭo dīrghasūkṣmaḥ
translation_literal: The breath-movement that is external, internal, and held is observed through place,
  time, and count, becoming long and subtle.
commentary: 'This sūtra (II.50) defines the refined practice of prāṇāyāma—the regulation of breath-force
  that prepares the mind for meditation. Patañjali identifies three phases of breath-work: bāhya (the
  outward breath), abhyantara (the inward breath), and stambha (the suspension or retention between them).
  These are not random or mechanical; they are systematically refined through three measurable dimensions:
  deśa (the place or channel through which breath moves), kāla (the duration of each phase), and saṃkhyā
  (the count or ratio maintaining proportion).


  The result of this disciplined observation is that breath becomes dīrgha (extended, unhurried) and sūkṣma
  (subtle, refined). This is not about forcing the breath but about training attention to perceive and
  gently extend its natural rhythm. As breath becomes long and subtle, the mind naturally settles; agitation
  ceases because the vehicle of mental fluctuation (the breath-body) has been calmed.


  Within the Yoga–Sāṃkhya framework, this practice works at the interface between gross (sthūla) and subtle
  (sūkṣma) dimensions of embodied consciousness. Prāṇa (the life-force) becomes tractable through systematic
  observation, and that tractability opens the door to pratyāhāra (sense-withdrawal) and dhāraṇā (concentration).
  The emphasis on *observation* (paridṛṣṭaḥ) rather than mere control reflects the non-violent, sattvic
  approach: you are witnessing the breath''s refinement, not forcing it.


  Key Terms


  **prāṇāyāma** — Regulation and extension of prāṇa (vital breath-force) through controlled inhalation,
  exhalation, and retention; a foundational limb of yoga that bridges body and mind.

  **stambha** — Retention or suspension of breath; the pause between inhalation and exhalation where the
  breath is held steady.

  **sūkṣma** — Subtle, refined, or minute; the refined state of breath and perception that arises through
  disciplined practice.'
insight: The central claim of this passage is that pranāyāma is not merely a physical exercise but a systematic
  modulation of the subtle energies that constitute the mind’s activity.
practice: 'Sit comfortably with an upright spine. Establish a baseline: breathe naturally for one minute
  and count how many complete breaths occur. Then begin a simple counted practice: inhale for a count
  of 4, hold for a count of 4, exhale for a count of 4 (equal ratio). Do this for 5 minutes, maintaining
  awareness of where the breath enters (nostrils), where it travels (throat, chest, belly), and where
  it rests during the hold. Notice whether your breath becomes smoother and quieter over these minutes.
  The point is not to strain but to observe the breath becoming naturally longer and finer as attention
  stabilizes. Return to natural breathing. Over weeks, you may gently extend the count to 5 or 6, but
  only if the breath remains smooth and the mind calm. This is the essence of the sūtra: systematic observation
  (through place, time, count) that yields refinement (long and subtle breath) without force.'
