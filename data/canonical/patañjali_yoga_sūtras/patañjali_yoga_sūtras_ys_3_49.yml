sanskrit_devanagari: सत्त्वपुरुषाञ्‍यताक्षातिमात्रस्य सर्वाभावाधिष्ठातृत्वं सर्वज्ञातृत्वं च
sanskrit_iast: sattvapuruṣānyatākhyātimātrasya sarvabhāvādhiṣṭhātṛtvaṃ sarvajñātṛtvaṃ ca
translation_literal: When the distinction between sattva (the luminous principle of mind-stuff) and puruṣa
  (the witnessing consciousness) is recognized as mere conceptual overlay, then that [sattva] becomes
  the ruler of all states and the knower of all things.
commentary: 'This sūtra addresses a critical threshold in yoga practice: the moment when the practitioner
  stops conflating the mind''s reflective luminosity with consciousness itself. Sattva—the sattvic guṇa,
  the quality of clarity, harmony, and reflection in prakṛti—naturally mirrors and illuminates experience.
  Puruṣa is the unchanging witness, the subject that observes all mental and physical phenomena without
  participating in them. The sūtra''s phrase ''anyatākhyātimātra'' (mere designation of difference) suggests
  that the apparent separation between mind and consciousness is a conceptual habit, not an ontological
  fact. Once this distinction is truly recognized—not intellectually, but through direct perception in
  meditation—sattva ceases to masquerade as the self. Paradoxically, this clarity allows sattva to function
  perfectly as the instrument of omniscience and omnipotence within the field of prakṛti. The mind becomes
  transparent; consciousness shines through it without obstruction. This is not the mind becoming all-knowing,
  but the mind becoming so refined and still that it offers no resistance to the light of puruṣa. The
  sūtra points to a non-dual recognition that resolves the subject-object duality at the level of subtle
  perception.


  Key Terms


  **sattva** — The sattvic guṇa; the luminous, reflective, harmonizing principle of prakṛti; the quality
  of clarity and goodness in mind-stuff

  **puruṣa** — Consciousness; the eternal, unchanging witness; the subject that observes all phenomena
  without participation or transformation

  **anyatākhyāti** — Mere designation of difference; the conceptual overlay that falsely separates sattva
  and puruṣa'
insight: 'The sūtra asserts a radical ontological demarcation: the Purusha, the eternal witness, is immutable,
  and the only thing that changes within it is the vṛtti, the mind’s fluctuation.'
practice: In your next moment of mental clarity—when a thought, sensation, or perception feels vivid and
  luminous—pause and whisper 'mere designation' while letting your gaze soften behind your eyes, neither
  grasping the clarity as yourself nor pushing it away, until the distinction between the brightness and
  the one aware of it dissolves on its own.
