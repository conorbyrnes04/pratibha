  - term: sattva (सत्त्व)
    definition: 'sat + tva ‘being-ness / luminosity-clarity strand’ -> in “Only Mind Fluctuates”: the
      term’s generic meaning as ‘good’ is lost in the philosophical context where it denotes the pure
      witness itself -> not moral ‘goodness’ alone; the guṇa of clarity that can still bind if identified
      with'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Only Mind Fluctuates”: the sūtra’s
      claim that vṛtti is the only change within Purusha reframes it as the sole locus of impermanence
      -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
