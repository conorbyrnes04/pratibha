title: Only Mind Fluctuates
unit_type: sutra
sanskrit_devanagari: सत्त्वपुरुषाञ्‍यताक्षातिमात्रस्य सर्वाभावाधिष्ठातृत्वं सर्वज्ञातृत्वं च
sanskrit_iast: sattvapuruṣānyatākhyātimātrasya sarvabhāvādhiṣṭhātṛtvaṃ sarvajñātṛtvaṃ ca
translation_literal: The only change of the Sattva‑Purusha is the mind’s fluctuation; it is the basis of all states and the
  all‑knowing reality.
commentary: 'The sūtra asserts a radical ontological demarcation: the Purusha, the eternal witness, is immutable, and the
  only thing that changes within it is the vṛtti, the mind’s fluctuation. This is not a mere psychological observation but
  a metaphysical claim that the Purusha itself is the *adhishthātrta* (basis) of all phenomena, while the *sarvajñātṛtva*
  (all‑knowing) attribute is inherent to it. The contested move lies in elevating the vṛtti to the sole locus of change, thereby
  excluding *prakṛti* from the domain of alteration. In the Sāṃkhya framework, this aligns with the dualism of Purusha and
  Prakṛti, yet it diverges from the usual emphasis on Prakṛti’s dynamic unfolding. The sūtra’s brevity masks a profound existential
  instruction: by recognizing that only the mind fluctuates, one can detach from the illusion of bodily and mental flux and
  rest in the unchanging witness. This resonates with the Satchidananda commentary’s emphasis on mastery over the primary
  cause (Prakṛti) through the mind’s control, but the Pratibha view foregrounds the Purusha’s primacy as the true foundation
  of all experience. Practically, this invites a meditation that continually returns to the observation that the self is the
  constant, while thoughts and sensations are transient vṛtti.


  Key to this practice is the distinction between the *sattva* (the pure aspect of Purusha), the *purusha* (the witness),
  the *vṛtti* (the mind’s fluctuation), and the *adhishthātrta* (the basis of all states). By internalizing these terms, one
  can navigate the subtle layers of consciousness and achieve the liberation that Patanjali’s Yoga Sūtra ultimately seeks.


  Key Terms


  **sattva (सत्त्व)** — sattva: ‘pure’ or ‘good’ quality; in Sāṃkhya, the subtle, luminous aspect of Purusha that is the basis
  of all consciousness; the term’s generic meaning as ‘good’ is lost in the philosophical context where it denotes the pure
  witness itself.


  **purusha (पुरुष)** — purusha: ‘self’, ‘consciousness’; etymologically from *pur* ‘to be’ + *-usha* ‘possessor’; in Sāṃkhya,
  the eternal, immutable witness; the default translation ‘person’ or ‘human’ obscures its metaphysical role as the substratum
  of all experience.


  **vṛtti (वृत्ति)** — vṛtti: ‘fluctuation’, ‘mental modification’; derived from *vṛtti* ‘turning’ or ‘change’; in Patanjali’s
  system, the mind’s activity that obscures Purusha; the sūtra’s claim that vṛtti is the only change within Purusha reframes
  it as the sole locus of impermanence.


  **adhishthātrta (आधिष्ठातृत्व)** — adhishthātrta: ‘being the basis’, ‘foundation’; from *adhishthā* ‘to stand upon’; in
  Sāṃkhya, the Purusha’s role as the underlying support of all states; the term’s literal sense of ‘support’ is enriched to
  mean the metaphysical ground of being.


  Cross-Tradition Resonances


  **Sāṃkhya Karika 1.1:** Both texts affirm the dualism of Purusha and Prakṛti, with Purusha as the unchanging witness; the
  sūtra’s focus on vṛtti as the sole change mirrors the Karika’s statement that Purusha is the only reality that does not
  change.

  *Divergence:* While the Karika emphasizes Prakṛti’s dynamic unfolding, the sūtra excludes Prakṛti from the realm of change,
  presenting a stricter demarcation.


  **Bhagavad Gita 2.20:** Both highlight the soul’s eternal nature versus the body’s transient nature; the Gita’s ‘soul is
  not born, nor does it die’ parallels the sūtra’s claim that only the mind fluctuates.

  *Divergence:* The Gita frames the soul’s permanence in terms of rebirth, whereas the sūtra frames it in terms of ontological
  basis, focusing on the mind’s vṛtti as the only change.


  **Yoga Vasistha 1.1:** Both texts present the mind as the source of illusion; the Vasistha’s story of the king’s delusion
  aligns with the sūtra’s assertion that vṛtti is the sole change within Purusha.

  *Divergence:* The Vasistha uses narrative to illustrate the point, while the sūtra delivers a concise aphorism, making the
  latter more abstract and foundational.


  **Patanjali Yoga Sūtra 1.2:** Both recognize the mind’s fluctuations as obstacles to liberation; the sūtra’s emphasis on
  vṛtti as the only change complements Patanjali’s broader list of afflictions.

  *Divergence:* Patanjali enumerates multiple afflictions, whereas the sūtra reduces the scope to a single ontological change,
  sharpening the focus on the mind’s role.'
insight: 'The sūtra asserts a radical ontological demarcation: the Purusha, the eternal witness, is immutable, and the only
  thing that changes within it is the vṛtti, the mind’s fluctuation.'
practice: Notice that only your mind fluctuates; you remain unchanged.
