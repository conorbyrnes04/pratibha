sanskrit_devanagari: कुर्मणाड्यम् स्थैर्यम्
sanskrit_iast: kūrmanāḍyāṃ sthairyam
translation_literal: Steadiness arises in the tortoise channel.
commentary: 'This sūtra refers to one of the subtle energy pathways (nāḍī) in the yogic body—specifically
  the kūrmanāḍī, the ''tortoise channel,'' which is traditionally located in the region of the throat
  pit (kūrma means tortoise; the channel takes its name from the tortoise-like quality of the throat''s
  retraction and stability). When attention is directed to this nāḍī through prānāyāma or internal focus,
  a particular quality of steadiness (sthairyam) emerges—not merely physical stability, but a consolidated,
  grounded presence that anchors the practitioner''s awareness.


  Within the Yoga Sūtras'' framework of prānāyāma and the subtle body, this verse belongs to the sequence
  of techniques that harness the movement of vital force (prāṇa) through specific channels to produce
  states of mental and energetic equilibrium. The kūrmanāḍī is one of the lesser-known but potent conduits;
  its stabilization is said to calm the fluctuations of mind and to deepen the sense of being rooted even
  as awareness expands. This steadiness is not rigidity but a dynamic poise—the tortoise''s ability to
  withdraw and hold firm, metaphorically applied to the nervous system and the subtle body.


  The sūtra is practical: it promises that by working with this particular channel, the practitioner will
  naturally experience a consolidation of energy and a quieting of mental agitation. This is part of Patañjali''s
  broader teaching that the body and breath are not obstacles to yoga but instruments through which the
  mind can be steadied and refined.


  Key Terms


  **kūrmanāḍī** — The ''tortoise channel,'' a subtle energy pathway in the throat region; its activation
  produces steadiness and inward consolidation.

  **sthairyam** — Steadiness, firmness, or stability—a quality of grounded presence and unshakeable poise
  in both body and mind.

  **nāḍī** — A subtle energy channel through which prāṇa (vital life force) flows; the yogic body is said
  to contain thousands of such channels.'
insight: 'The claim that the mind can be steadied by focusing on a single, small locus—here the pit of
  the throat—reveals a central Yoga principle: that the mind’s restless fluctuations (vṛtti) can be quelled
