- kind: commentary
  label: Pratibha Commentary
  body: 'The claim that the mind can be steadied by focusing on a single, small locus—here the pit of the throat—reveals a
    central Yoga principle: that the mind’s restless fluctuations (vṛtti) can be quelled by a precise, sustained attention.
    This is a contested move because it places the locus of control in a bodily site rather than in the abstract realm of
    the self (puruṣa). In the Sāṃkhya framework, the mind (citta) is a function of prakṛti, and its fluctuations are the result
    of ignorance (avidyā). By directing attention to the throat, the practitioner is effectively severing the mind’s habitual
    patterns, allowing the subtle energy (prāṇa) to settle and the mind to return to its unaltered state. The practice is
    existentially relevant: it offers a concrete, daily technique for anyone—cooking, working, or meditating—to cultivate
    calm without elaborate postures. The Satchidananda commentary’s emphasis on the “body anchor” underscores that this is
    not a mystical trick but a practical tool that can be applied immediately, even by a cook who wishes to calm the mind
    while stirring a pot. The method resonates with the broader Yoga aim of achieving samādhi, a state of steady, undistracted
    awareness, by first mastering the most immediate and accessible point of focus. It also anticipates later yogic practices
    that use the throat as a gateway to higher states, such as the chanting of mantras or the control of breath through the
    navel and throat. Thus, the sutra presents a bridge between bodily awareness and the ultimate goal of self‑realization,
    making the abstract teachings of Yoga accessible in everyday life.


    Key Terms


    **citta (चित्त)** — citta: mind; in Sāṃkhya, the organ of perception and cognition, a function of prakṛti; the sutra’s
    focus on steadying citta through bodily attention highlights its mutable nature.


    **vṛtti (वृत्ति)** — vṛtti: fluctuation of the mind; the sutra’s method seeks to halt vṛtti by anchoring attention, thereby
    illustrating the Yoga view that mental activity is a function of ignorance.


    **puruṣa (पुरुष)** — puruṣa: pure consciousness; the sutra’s implicit claim that steadiness achieved through bodily focus
    can still lead to the recognition of puruṣa’s distinctness from prakṛti.


    **prakṛti (प्रकृति)** — prakṛti: primal nature; the sutra’s technique is a means to reduce prakṛti’s influence on citta,
    thereby enabling the practitioner to experience the unchanging self.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 2.1:** Both sutras employ a single, precise locus (the throat in 3.31, the mind in 2.1) to initiate
    control over mental activity.

    *Divergence:* While 2.1 speaks of the mind’s wandering, 3.31 prescribes a bodily anchor, suggesting a more embodied approach
    to the same goal.


    **Bhatkhande, Yogasūtra Bhashya 3.31:** The commentary emphasizes the practical, everyday applicability of the throat
    anchor, mirroring the sutra’s terse directive.

    *Divergence:* Bhatkhande expands on the sutra’s brevity by linking it to specific pranāyāma practices, whereas the sutra
    itself remains agnostic about technique.


    **Satchidananda, Yoga Sūtra Commentary 3.31:** Both texts highlight the throat as a gateway to inner stillness.

    *Divergence:* Satchidananda frames it as a ‘body anchor’ for immediate use, while the sutra presents it as a universal
    method for all practitioners.'
