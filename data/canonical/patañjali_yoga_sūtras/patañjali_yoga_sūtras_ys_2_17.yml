- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra makes a decisive claim: misfortune arises from the misidentification of the seer (puruṣa)
    with the seen (dṛśya). This is the contested move that elevates a simple epistemic error to an ontological
    misalignment. In the Yoga‑Sāṃkhya framework, the seer is the pure, unchanging witness, while the seen
    is the ever‑changing manifold of prakṛti. When the two are fused, the seer becomes entangled in the
    fluctuations of prakṛti, and the illusion of a single, unified reality takes root. The sūtra therefore
    points to the root of all misery as the very act of *saṃyoga*—the union of puruṣa and dṛśya. This
    aligns with Patanjali’s later discussion of *vṛtti* as the source of suffering, yet it diverges by
    foregrounding the *seeker‑seen* relationship rather than the mind’s fluctuations. Dvivedi’s commentary
    reinforces this by noting that the junction of seer and sight is the cause of all misery, and that
    bliss resides only in the pure seer. The existential application is clear: by cultivating a clear
    distinction between awareness and its objects, one can prevent the causal chain that leads to suffering.
    This sūtra therefore invites a practice of continual self‑inspection, ensuring that the observer remains
    distinct from the observed, thereby averting the very causes of misery it identifies.


    Key Terms


    **puruṣa (पुरुष)** — purusha (Sanskrit) – ‘the self’; in Sankhya, the eternal, conscious principle;
    the term’s literal meaning ‘person’ is insufficient, as it omits the transcendental, unchanging aspect
    that is the true subject of experience.


    **dṛśya (दृश्य)** — dṛśya (Sanskrit) – ‘the seen’ or ‘object of perception’; etymologically ‘that
    which is seen’; in Yoga it denotes the entire perceptual field, including senses and mental images,
    not merely external objects.


    **saṃyoga (संयोग)** — saṃyoga (Sanskrit) – ‘union’ or ‘joining’; traditionally refers to the causal
    binding of puruṣa and prakṛti; here it signifies the ontological conflation that produces suffering.


    **hetu (हेतु)** — hetu (Sanskrit) – ‘cause’ or ‘agent’; in Patanjali’s grammar it denotes the cause
    of a verb’s action; in this sūtra it marks the causal status of the seer‑seen union.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtras 2.18:** Both 2.17 and 2.18 identify a root cause of misery—2.17 cites the
    seer‑seen union, 2.18 cites the mind’s fluctuations—showing structural homology in the pattern of
    causal analysis.

    *Divergence:* While 2.17 locates the cause in the ontological misidentification of puruṣa and dṛśya,
    2.18 attributes it to the mental *vṛtti*; the former is more metaphysical, the latter more psychological,
    illustrating a productive shift from ontology to epistemology.


    **Sāṃkhya Tattva‑bhāṣya, Chapter 4:** The text’s discussion of *saṃyoga* as the binding of puruṣa
    and prakṛti mirrors the sūtra’s claim that the seer‑seen union is causal.

    *Divergence:* Unlike the Tattva‑bhāṣya, which treats *saṃyoga* as a permanent binding, the sūtra presents
    it as a temporary, misidentifying act that can be undone through practice.'
