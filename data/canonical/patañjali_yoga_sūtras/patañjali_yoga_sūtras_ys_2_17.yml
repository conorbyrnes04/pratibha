  items:
  - term: draṣṭṛ (द्रष्टृ)
    definition: '√dṛś ‘see’ → the Seer -> in “Seer and Sight: The Cause”: puruṣa in its role as pure witnessing
      consciousness, unchanging and untouched by what it observes -> not the eyeball-subject; puruṣa as
      pure seeing, ordinarily seeming colored by what is seen'
  - term: dṛśya (दृश्य)
    definition: '‘the seeable’ — prakṛti as object for the Seer -> in “Seer and Sight: The Cause”: in
      Yoga it denotes the entire perceptual field, including senses and mental images, not merely external
      objects -> not only outer world; includes mind and body as experienced object-field'
  - term: heya (हेय)
    definition: '√hā ‘abandon’ → that which is to be discarded (future suffering) -> in “Seer and Sight:
      The Cause”: The joining of the seer and the seen is the cause of that which is to be warded off.
      -> not past pain fixation; the avoidable future duḥkha that viveka aims to cut'
  - term: hetu (हेतु)
    definition: '‘cause/reason’ -> in “Seer and Sight: The Cause”: in this sūtra it marks the causal status
      of the seer‑seen union -> not vague ‘reason why’; the causal factor (often saṃyoga of seer/seen)
      producing heya'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Seer and Sight: The Cause”:
      the term’s literal meaning ‘person’ is insufficient, as it omits the transcendental, unchanging
      aspect that is the true subject of experience -> not ‘person’ as social self; the unchanging witness
      distinct from prakṛti’s display'
