sanskrit_devanagari: द्रष्टृदृश्ययोः संयोगः हेयहेतुः
sanskrit_iast: draṣṭṛdṛśyayoḥ saṃyogo heyahetuḥ
translation_literal: The union of the seer and the seen is the cause of what must be discarded.
commentary: 'This sūtra identifies the root problem that yoga addresses: the mistaken identification of
  puruṣa (the witnessing consciousness) with prakṛti (the field of perception and matter). Patañjali names
  this confusion—this saṃyoga or intimate joining—as the fundamental hetu, the generative cause, of all
  suffering and bondage (heyahetuḥ: that which produces what must be abandoned).


  The draṣṭṛ (seer, witness) is pure awareness, untouched and unchanging. The dṛśya (sight, the seen)
  is everything perceived: thoughts, sensations, emotions, the body, the world—all the modifications of
  prakṛti. When these two are experienced as fused or identified with each other, the seer wrongly believes
  itself to be the doer, the experiencer, the sufferer. This false union generates avidyā (ignorance)
  and perpetuates the cycle of kleśa (affliction) and saṃsāra (bondage).


  The sūtra is diagnostic, not prescriptive. It points to what must be undone: not the seer or the seen
  themselves, but their false marriage. The entire path of yoga that follows is designed to dissolve this
  saṃyoga—to restore the seer to its own nature (kaivalya) while allowing the seen to move freely according
  to its own laws. This verse is the problem statement from which all remedy flows.


  Key Terms


  **draṣṭṛ** — The seer; puruṣa in its role as pure witnessing consciousness, unchanging and untouched
  by what it observes.

  **dṛśya** — The seen; all objects of perception—thoughts, sensations, the body, the world—the entire
  field of prakṛti or nature.

  **saṃyoga** — Union, joining, intimate fusion; here, the false identification of the seer with the seen,
  the root cause of bondage.'
insight: 'The sūtra makes a decisive claim: misfortune arises from the misidentification of the seer (puruṣa)
  with the seen (dṛśya).'
practice: 'The next time you catch yourself saying ''I am doing'' or ''I am feeling''—mid-sentence, mid-thought—stop
  and reverse it: whisper aloud, ''This is being done; this is being felt.'' Repeat the reversal three
  times, letting your body register the shift from doer to witness, from identified to separate.'
