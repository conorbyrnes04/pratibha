unit_type: sutra
sanskrit_devanagari: तस्य हेतुं अविद्या
sanskrit_iast: tasya hetur avidyā
translation_literal: Ignorance is the cause of that.
commentary: 'This sūtra appears in the context of Patañjali''s analysis of the kleshas (afflictions or
  obstacles to liberation). The pronoun ''that'' refers to the entire chain of suffering—the misidentification
  of the Self (purusha) with the body-mind apparatus (prakriti), and all consequent bondage. Avidyā, often
  translated as ''ignorance,'' is more precisely a fundamental misperception: the mistaking of the impermanent,
  limited, and insentient for the eternal, infinite, and conscious. It is the root klesha from which all
  others—egoism (asmitā), attachment (rāga), aversion (dvesha), and fear of death (abhinivesha)—naturally
  unfold.


  Patañjali''s diagnosis is radical: suffering is not imposed from outside, nor is it punishment. It arises
  from a single, correctable error in perception. When the mind mistakes the body and its fluctuations
  for the Self, it becomes entangled in the illusion of personal doership and experiencership. This ignorance
  is not mere intellectual confusion; it is a structural misalignment of consciousness with its true nature.
  The sūtra''s brevity underscores its centrality: all yogic practice aims at dissolving this single root
  cause.


  Within the Yoga–Sāṃkhya framework, avidyā is the forgetting of the fundamental distinction (viveka)
  between purusha and prakriti. The entire apparatus of yoga—ethical restraint, posture, breath control,
  sense withdrawal, concentration, meditation, and absorption—serves one purpose: to burn away this ignorance
  and restore the clarity of discriminative knowledge (viveka-khyāti).


  Key Terms


  **avidyā** — Fundamental misperception; the mistaking of the impermanent, limited body-mind for the
  eternal, infinite Self; root cause of all affliction.

  **klesha** — Affliction or obstacle to liberation; the five are avidyā, asmitā (egoism), rāga (attachment),
  dvesha (aversion), and abhinivesha (fear of death).

  **viveka** — Discriminative discernment; the ability to distinguish between purusha (consciousness)
  and prakriti (nature/matter); the antidote to avidyā.'
insight: The sutra asserts that ignorance (avidyā) is the proximate cause of the seer’s misidentification
  of the self.
practice: 'Sit quietly for five minutes. Notice one thought, sensation, or emotion arising right now.
  Observe it carefully, then ask yourself: ''Am I this thought? Am I this sensation?'' Pause. Notice that
  you are aware of it, but you are not identical to it. The awareness itself is unchanged, untouched,
  observing. Repeat this inquiry with two or three more experiences. This simple act of discrimination—recognizing
  the difference between the witness and what is witnessed—directly counters avidyā. You are not practicing
  belief; you are practicing direct perception of the gap between subject and object. Do this daily for
  two weeks and notice what shifts in how you relate to your own mind.'
