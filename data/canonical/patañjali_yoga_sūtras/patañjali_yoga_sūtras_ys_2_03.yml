practice: '**The Five-Fold Witness Practice** (15 minutes, daily)


  Sit comfortably. Over five breathing cycles, silently name each affliction as it arises in your present
  moment:


  1. **Avidyā**: Notice one belief you hold as absolute truth about yourself or the world. Pause. Ask:
  "Is this truly fixed, or am I seeing only part of the picture?" Breathe.


  2. **Asmitā**: Observe the sense of "I" that seems to be doing this practice. Where is it located? Can
  you find its edges? Notice how it claims ownership of your breath, your thoughts. Breathe.


  3. **Rāga**: Name one thing you want right now—comfort, approval, a result from this practice. Feel
  the pull. Don''t reject it; simply see it clearly. Breathe.


  4. **Dveṣa**: Name one thing you''re resisting or pushing away—a sensation, emotion, or person. Feel
  the recoil. Breathe.


  5. **Abhiniveśa**: Sense the subtle fear beneath—the wish to keep existing, to not dissolve, to remain
  "me." Don''t fight it. Simply witness it. Breathe.


  After naming all five, sit in silence for five breaths. You are not eliminating the kleśas; you are
  seeing them clearly. That clarity is the first step toward their natural unwinding.'
