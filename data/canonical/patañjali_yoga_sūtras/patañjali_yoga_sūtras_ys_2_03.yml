  items:
  - term: kleśa (क्लेश)
    definition: '√kliś ‘afflict, torment’ → afflictive root-patterns -> in “Obscure Roots of Suffering”:
      the five root patterns that generate suffering and bondage -> not mere ‘stress’; five deep causes
      (avidyā etc.) that generate suffering and rebirth'
  - term: abhiniveśa (अभिनिवेश)
    definition: 'abhi-ni-√viś ‘enter intensely into’ → clutch at continuity/life -> in “Obscure Roots
      of Suffering”: the survival instinct that sustains the cycle of rebirth -> not only fear of death;
      instinctive clinging to existence even in the wise'
  - term: avidyā (अविद्या)
    definition: 'a- + vidyā ‘non-knowing’ — mis-seeing the permanent/impure/self etc. -> in “Obscure Roots
      of Suffering”: ignorance -> misidentification of puruṣa with prakṛti -> the root of all klesha,
      not merely lack of knowledge -> not simple ignorance of facts; structural misidentification that
      parents the other kleśas'
    lemma_id: vidya
  - term: asmitā (अस्मिता)
    definition: 'asmi + -tā ‘I-am-ness’ -> in “Obscure Roots of Suffering”: Ignorance, attachment, hatred,
      and their manifestations are the root causes of afflictions. -> not healthy self-esteem; the confusion
      of seer with seeing-instrument (citta)'
  - term: dveṣa (द्वेष)
    definition: '√dviṣ ‘hate’ → aversion -> in “Obscure Roots of Suffering”: Ignorance, attachment, hatred,
      and their manifestations are the root causes of afflictions. -> not moral disapproval alone; reactive
      push-away that mirrors rāga as binding force'
