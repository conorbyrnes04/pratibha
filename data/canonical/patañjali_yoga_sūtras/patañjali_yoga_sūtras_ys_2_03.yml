sanskrit_devanagari: अविद्यास्मितारागद्वेषाभिनिवेशाः कलेशाः
sanskrit_iast: avidyāsmitārāgadveṣābhiniveśāḥ kleśāḥ
translation_literal: Ignorance, ego-sense, attachment, aversion, and the will to persist—these are the
  afflictions.
commentary: 'This sūtra (II.3) names the five foundational kleśas (afflictions or obstructions) that generate
  all suffering in the Yoga–Sāṃkhya framework. Each is a root distortion of perception and action:


  **Avidyā** (ignorance) is the primal misperception—taking the impermanent for permanent, the impure
  for pure, pain for pleasure, and the non-Self (prakṛti) for the Self (puruṣa). It is not mere lack of
  knowledge but active false seeing.


  **Asmitā** (ego-sense or ''I-am-ness'') is the collapse of awareness into identification with the body-mind
  apparatus. It is the sense of being a separate, bounded agent—the root of all personal doership.


  **Rāga** (attachment or desire) is the magnetic pull toward what feels pleasant or promising. It binds
  consciousness to objects and experiences, perpetuating the cycle of seeking.


  **Dveṣa** (aversion or repulsion) is the equal and opposite force—the recoil from what feels painful,
  threatening, or undesirable. Like rāga, it chains awareness to the object world through resistance.


  **Abhiniveśa** (the will to persist, or fear of annihilation) is the deep, often unconscious clinging
  to existence itself—the survival instinct and the terror of cessation. Even in deep sleep or meditation,
  this subtle drive persists until liberation.


  These five are not separate diseases but interlocking mechanisms. Avidyā is the soil; asmitā is the
  sense of separate agency that makes the others possible; rāga and dveṣa are the outward and inward pulls
  that bind the ego to experience; abhiniveśa is the underlying momentum that keeps the whole system running.
  Together they constitute the machinery of bondage. The yoga path systematically dissolves each layer.


  Key Terms


  **kleśa** — Affliction, obstruction, or coloring of consciousness; the five root patterns that generate
  suffering and bondage

  **avidyā** — Ignorance or fundamental misperception; mistaking the impermanent for permanent, the non-Self
  for Self

  **abhiniveśa** — The deep-seated will to persist or fear of annihilation; the survival instinct that
  sustains the cycle of rebirth'
insight: The claim here is that the triad of ignorance (avidyā), attachment (rāga), and hatred (veṣa)
  are not merely psychological states but ontological conditions that give rise to the afflictive states
