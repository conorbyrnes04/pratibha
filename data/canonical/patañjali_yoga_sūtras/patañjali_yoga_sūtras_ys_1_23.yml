sanskrit_devanagari: ईश्वरप्रणिधानाद वा
sanskrit_iast: īśvarapraṇidhānād vā
translation_literal: Or, through devotion to the Lord, samādhi may be attained.
commentary: 'This sūtra appears as YS 1.23 and offers an alternative gateway to samādhi alongside the
  more commonly emphasized path of abhyāsa (disciplined practice) and vairāgya (non-attachment). Patañjali
  introduces īśvara—the Lord, understood in classical Yoga as a special puruṣa untouched by affliction,
  karma, or the fruits of action—as an object of devotion (praṇidhāna) capable of catalyzing the meditative
  absorption that constitutes samādhi.


  The particle vā (or) signals that this is not the sole method but a legitimate alternative, particularly
  suited to practitioners whose temperament inclines toward bhakti (devotion) rather than purely technical
  discipline. Praṇidhāna means to direct, to bow toward, to offer one''s practice as an oblation. In this
  frame, the mind''s oscillation (cittavṛtti) is stilled not through force or analysis but through the
  gravitational pull of surrender to something transcendent.


  Within the Yoga–Sāṃkhya metaphysics, īśvara functions as a mirror or focal point—a consciousness so
  perfectly unentangled from prakṛti (nature) that meditation upon it naturally dissolves the practitioner''s
  own entanglement. This is not theism in the devotional-emotional sense alone; it is a precise yogic
  technology: the mind, by aligning with a consciousness already free, begins to recognize its own freedom.


  For modern practitioners, this sūtra validates the role of faith, reverence, and heart-centered practice
  within yoga''s systematic framework—a corrective to the purely technical or materialist readings that
  dominate contemporary yoga.


  Key Terms


  **īśvara** — The Lord; in classical Yoga, a special puruṣa (consciousness) eternally free from affliction,
  karma, and bondage—an object of meditation and devotion.

  **praṇidhāna** — Devotion, dedication, or the act of bowing toward; the offering of one''s practice
  and attention to a transcendent reality.

  **samādhi** — Meditative absorption; the state in which the mind becomes unified with its object, free
  from fluctuation and the sense of separation.'
insight: The claim here is that the highest state of samādhi—Parasādhi—can be attained not only through
  the elimination of attachment but also by an absolute surrender to the will of Iśvara.
practice: 'Each morning, sit quietly for five minutes. Choose an object of reverence—this may be īśvara
  in any form that resonates (a concept of the divine, nature, the cosmos, or simply the principle of
  consciousness itself). Place one hand on your heart. Silently repeat a simple phrase of dedication:
  ''I offer this practice to that which is already free'' or ''My effort bows to what I cannot grasp.''
  Do not strain for feeling; simply hold the intention steady. Notice how the mind, when pointed toward
  something larger than itself, naturally becomes quieter. This is praṇidhāna—not belief, but the act
  of directing attention and intention toward what transcends the small self.'
