sanskrit_devanagari: ईश्वरप्रणिधानाद वा
sanskrit_iast: īśvarapraṇidhānād vā
translation_literal: By devotion to the Supreme (Iśvara).
commentary: 'The claim here is that the highest state of samādhi—Parasādhi—can be attained not only through the elimination
  of attachment but also by an absolute surrender to the will of Iśvara. This move, often contested in the Yoga tradition,
  is that devotion is not merely a mental posture but a total relinquishment of agency, aligning one’s actions with the divine
  will. In the Sāṃkhya–Yoga framework, the mind’s vṛtti (mental fluctuations) are rooted in the identification of the self
  with prakṛti. By recognizing Iśvara as the supreme ruler, the practitioner dissolves the illusion of self‑agency, thereby
  neutralizing the raga that fuels attachment. The Dvivedi commentary underscores this by describing devotion as “self‑abandonment”
  and “entire dependence,” which resonates with the Sāṃkhya notion of puruṣa’s transcendence over prakṛti. Existentially,
  this suggests that true liberation is achieved when one ceases to act as an autonomous agent and instead becomes an instrument
  of a higher order, thereby transcending the dualities of good and evil. The practice of surrender, therefore, is not a passive
  resignation but an active alignment with the divine will, which, in turn, dissolves the very vṛtti that obstructs samādhi.


  Key Terms


  **īśvara (ईश्वर)** — root: īś (to rule) + -vara (possessor) → ‘the ruler’; in Sāṃkhya, Iśvara is the supreme, unchanging
  consciousness that is distinct from prakṛti; the term here implies a personal deity rather than abstract principle


  **samādhi (समाधि)** — from sam (together) + ādh (to hold) → ‘to hold together’; in Yoga, the final stage of absorption where
  the mind is still; this sūtra speaks of Parasādhi, the unconscious, complete absorption


  **vṛtti (वृत्ति)** — mental modifications or fluctuations; in Sāṃkhya, vṛtti are the processes that bind puruṣa to prakṛti;
  the sūtra targets the vṛtti of attachment


  **prakṛti (प्रकृति)** — the primordial material nature; in Sāṃkhya, it is the dynamic, mutable principle that constitutes
  the universe; the sūtra contrasts it with the immutable Iśvara


  Cross-Tradition Resonances


  **Yoga Sūtra 1.23:** The structure ‘X by Y’ parallels 1.20 ‘Nirvāṇaṃ saṃyogaḥ’ where the means is presented as a prepositional
  phrase; both use a single particle to introduce the method.

  *Divergence:* While 1.20 presents the means as a state (nirvāṇa), 1.23 presents it as an action (devotion), shifting from
  an internal state to an external practice


  **Yoga Sūtra 1.24:** Both 1.23 and 1.24 employ the particle ‘vā’ to offer alternative paths to samādhi, mirroring the dualism
  of ‘or’ in the English translation.

  *Divergence:* 1.24 introduces a different method (the ‘other’ path) that contrasts with the devotion of 1.23, highlighting
  the multiplicity of techniques within the same sūtra


  **Bhaṭṭārī’s Commentary on 1.23:** Bhaṭṭārī interprets ‘īśvarapraṇidhāna’ as a surrender of the mind to the divine will,
  aligning with the Sāṃkhya idea of puruṣa’s transcendence.

  *Divergence:* He emphasizes the role of faith (śraddhā) as a prerequisite, whereas the sūtra itself merely states the method,
  leaving the prerequisite implicit'
insight: The claim here is that the highest state of samādhi—Parasādhi—can be attained not only through the elimination of
  attachment but also by an absolute surrender to the will of Iśvara.
practice: You surrender your will entirely to the Supreme, acting only as an instrument of His grace, without attachment to
  results.
