    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: praṇidhāna (प्रणिधान)
    definition: 'pra-ni-√dhā ‘place thoroughly toward’ → dedicated surrender/orientation -> in “Devotion
      as Path to Samādhi”: the offering of one''s practice and attention to a transcendent reality ->
      not fatalistic resignation; active offering of practice-mind toward īśvara'
  - term: īśvara (ईश्वर)
    definition: '√īś ‘rule, be capable’ → the special puruṣa untouched by kleśa/karma -> in “Devotion
      as Path to Samādhi”: the term here implies a personal deity rather than abstract principle -> not
      necessarily a creator-god dogma; Patañjali’s omniscient special puruṣa as object of praṇidhāna'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Devotion as Path to Samādhi”: the
      sūtra targets the vṛtti of attachment -> not ‘bad thoughts’ only — any cognitive wave (valid cognition,
      error, fantasy, sleep, memory)'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Devotion as Path to Samādhi”:
      the sūtra contrasts it with the immutable Iśvara -> not pastoral ‘Nature’; the tri-guṇa matrix generating
      all experience including mind'
