sanskrit_devanagari: सोपक्रामं निरुपक्रामं च कर्म तत्त्स्यमाद् अपरान्तज्ञानं आरिष्टेभ्यो वा
sanskrit_iast: sopakramaṃ nirupakramaṃ ca karma tatsaṃyamād aparāntajñānam ariṣṭebhyo vā
translation_literal: Action with initiation and action without initiation—both kinds of karma. Through
  saṃyama on that, knowledge of the end-time arises, or through omens.
commentary: 'This sūtra belongs to Patañjali''s section on siddhis (supernatural powers or refined perceptions)
  that arise from concentrated inquiry into specific objects. Here the object is karma itself in its dual
  manifestation: sopakrama (action that has a clear beginning, momentum, and unfolding sequence) and nirupakrama
  (action that appears to have no visible cause or initiation—spontaneous, latent, or karmic fruition).


  The yogi applies saṃyama (the unified triad of dhāraṇā, dhyāna, and samādhi) to this distinction. By
  holding the mind steadily on how actions originate and how they complete, the practitioner develops
  aparāntajñānam—direct knowing of the *aparānta*, the end-point or final outcome. This is not mere intellectual
  prediction; it is a refined perceptual capacity to sense the trajectory of events as they ripen.


  The phrase *ariṣṭebhyo vā* (''or through omens'') offers an alternative: one may also gain this knowledge
  through reading signs and portents in nature—the traditional yogic reading of subtle indicators. However,
  the primary path is saṃyama itself.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that all action (karma) is ultimately
  a modification of prakṛti (nature), and the purified mind of the yogi becomes transparent to the subtle
  laws governing causation and completion. The sūtra assumes that by the time a yogi reaches this stage,
  discrimination (viveka) between puruṣa and prakṛti is already well established, allowing direct insight
  into the mechanics of becoming.


  Key Terms


  **saṃyama** — The unified practice of concentration (dhāraṇā), meditation (dhyāna), and absorption (samādhi)
  applied to a single object; the instrument by which yogic powers and refined perceptions arise.

  **aparānta** — The end-point, final outcome, or completion-moment of an action or event; knowledge of
  what will come to pass.

  **karma** — Action and its inherent consequences; the law of cause and effect operating through intention
  and deed in the Yoga–Sāṃkhya system.'
insight: The sūtra asserts that the practice of karma, whether active or passive, is a single, unified
  act.
practice: Trace backward through one action you completed today—a conversation, a meal, a decision—until
  you find the moment you cannot locate its beginning. Hold your attention there, at that threshold between
  initiated and uninitiated, and notice what quality of knowing arises in the gap itself.
