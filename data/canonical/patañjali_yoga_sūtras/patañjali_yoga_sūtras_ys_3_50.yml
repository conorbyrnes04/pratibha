sanskrit_devanagari: तद्वैराग्याद् अपि दोषबीजकस्ये काविल्यम्
sanskrit_iast: tadvairāgyād api doṣabījakṣaye kaivalyam
translation_literal: Through dispassion toward even that, the seed of defect is destroyed, and isolation
  is attained.
commentary: 'This sūtra (IV.26) marks the final threshold of Patañjali''s yoga system. It follows the
  recognition that even the highest attainments—the siddhis (powers) and the subtle experiences of samādhi—are
  objects of the mind and therefore subject to the same mechanics of attachment and aversion that bind
  ordinary consciousness.


  The word *tadvairāgyād* (dispassion toward that) refers to relinquishing even the most refined fruits
  of practice: the bliss of meditation, the clarity of insight, the extraordinary perceptions. This is
  not rejection of achievement but the maturation of non-attachment into the realm of the transcendent
  itself.


  *Doṣabīja* (the seed of defect) names the root cause of all bondage—the fundamental misidentification
  of consciousness (puruṣa) with the fluctuations of mind and matter (prakṛti). As long as one clings
  to experience—even luminous experience—this seed remains viable, capable of sprouting new cycles of
  becoming.


  When that final attachment dissolves, *kaivalyam* (isolation, aloneness, absolute independence) manifests.
  This is not loneliness but the recognition that consciousness was never bound, never implicated in the
  world''s operations. It is the permanent disentanglement of the witness from the witnessed.


  Within the Yoga–Sāṃkhya framework, this represents the ultimate discrimination (viveka) between puruṣa
  and prakṛti—not as intellectual knowledge but as lived reality. The mind ceases to obscure; prakṛti
  continues its dance, but the Self stands free.


  Key Terms


  **vairāgya** — Dispassion, non-attachment; the progressive release of identification with objects and
  experiences, culminating in indifference even to the fruits of practice.

  **doṣabīja** — The seed of defect or affliction; the root ignorance (avidyā) that perpetuates the false
  identification of consciousness with mind and matter.

  **kaivalyam** — Isolation, aloneness, absolute independence; the final state in which consciousness
  recognizes itself as eternally distinct from and unbound by the natural world.'
insight: 'The central claim of this verse is that ultimate liberation is achieved not by external practice
  but by an internal cognitive act of distinction: the Self (purusha) is set apart from the material worl'
practice: 'Sit quietly for 10–15 minutes. Begin by observing any pleasant sensations, insights, or states
  of calm that arise. Rather than pushing them away, simply notice the impulse to hold onto them—the subtle
  grasping. Mentally acknowledge: ''Even this peace is not me; I am the awareness witnessing it.'' Repeat
  this recognition each time you notice yourself settling into a comfortable state. The goal is not to
  destroy the peace but to loosen your identity from it. Over weeks, this practice teaches the mind that
  freedom lies not in acquiring finer experiences but in releasing the claim of ownership over any experience
  whatsoever. This is the dispassion that ripens into kaivalyam.'
