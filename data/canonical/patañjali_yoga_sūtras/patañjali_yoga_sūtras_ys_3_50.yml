  items:
  - term: vairāgya (वैराग्य)
    definition: 'vi-rāga ‘dispassion / fading of coloring’ -> in “Supremacy through Distinction”: the
      progressive release of identification with objects and experiences, culminating in indifference
      even to the fruits of practice -> not cold indifference; mastery of thirst so objects lose compulsive
      pull'
  - term: kaivalya (कैवल्य)
    definition: 'kevala ‘alone/absolute’ → aloneness/independence of puruṣa -> in “Supremacy through Distinction”:
      By recognizing the distinction between the pure reflective nature [sattva] and the Self, one attains
      supreme mastery … -> not lonely isolation; establishment in own-form when guṇas reverse and citi-śakti
      stands as itself'
    lemma_id: moksa
  - term: sabīja (सबीज)
    definition: 'sa + bīja ‘with seed’ -> in “Supremacy through Distinction”: By recognizing the distinction
      between the pure reflective nature [sattva] and the Self, one attains supreme mastery … -> not botanical
      metaphor only; samādhi still carrying latent object/seed vs seedless'
  - term: sattva (सत्त्व)
    definition: 'sat + tva ‘being-ness / luminosity-clarity strand’ -> in “Supremacy through Distinction”:
      By recognizing the distinction between the pure reflective nature [sattva] and the Self, one attains
      supreme mastery … -> not moral ‘goodness’ alone; the guṇa of clarity that can still bind if identified
      with'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Supremacy through Distinction”:
      > ‘mental modification’ -> in Sāṃkhya, the dynamic fluctuations of citta -> not ‘bad thoughts’ only
      — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
