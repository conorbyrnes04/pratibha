sanskrit_devanagari: परमाणुपरममहत्त्वान्तो ’स्य वैशिकारः
sanskrit_iast: paramāṇuparamamahattvānto 'sya vaśīkāraḥ
translation_literal: Mastery extends from the infinitesimal atom to the vastness of infinity—this is the scope of his dominion.
commentary: 'This sūtra (III.45) describes the fruit of perfected samyama (concentrated meditation) on the relationship between
  the perceiver and the perceived. When a yogi has refined the mind''s capacity to hold attention simultaneously on the smallest
  and largest scales of existence, a profound shift occurs: the distinction between observer and object collapses into unified
  knowing. The phrase paramāṇu (atom, the ultimate particular) to paramamahattvānta (the infinite expanse, the ultimate universal)
  marks the full spectrum of manifest reality. Vaśīkāra means dominion or mastery—not domination over external things, but
  the freedom that comes from direct perception of how consciousness pervades all scales. In the Sāṃkhya framework underlying
  Patañjali''s yoga, this represents the yogi''s recognition that puruṣa (the witnessing self) is untouched by yet intimately
  aware of all manifestation, from quantum to cosmic. This is not supernatural power but the natural result of removing the
  obscurations (kleśas) that fragment perception. The yogi no longer experiences reality as fragmented into separate scales;
  he perceives the unified field in which all dimensions coexist. This mastery is freedom itself—the end of the illusion that
  consciousness is bound by size or scope.


  Key Terms


  **paramāṇu** — The atom or infinitesimal particular; the smallest indivisible unit in classical Indian philosophy

  **paramamahattvā** — Supreme vastness or infinity; the ultimate expanse of the manifest universe

  **vaśīkāra** — Mastery, dominion, or freedom; the state of unobstructed knowing and non-resistance'
insight: The claim of this verse is that true samādhi is a mastery that spans the entire spectrum of reality, from the minuscule
  to the boundless.
practice: Hold your gaze on a single point—a leaf, a stone, a person's eye—until you sense the vastness behind it; then expand
  that same gaze to take in the whole sky or room at once, letting both scales live in your awareness simultaneously, and
  notice what dissolves between the smallest and largest thing you can perceive.
