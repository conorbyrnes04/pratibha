title: Contentment Yields Supreme Joy
unit_type: sutra
sanskrit_devanagari: सन्तोषाद् अनुत्तमः सुखलाभः
sanskrit_iast: saṃtoṣād anuttamaḥ sukhalābhaḥ
translation_literal: From contentment arises unsurpassed gain of ease.
commentary: 'This sūtra appears in the Yoga Sūtras'' section on the niyamas—the observances that refine
  the practitioner''s inner life. Contentment (saṃtoṣa) is not passive resignation or denial of legitimate
  effort; rather, it is the settled acceptance of what is, paired with disciplined action toward what
  ought to be. The word anuttamaḥ means ''unexcelled'' or ''supreme''—there is no higher grade of sukha
  (ease, well-being, or joy) than what flows from this state.


  Within the Yoga–Sāṃkhya framework, contentment dissolves the friction between desire and circumstance.
  Most suffering arises from the gap between what we crave and what we have. When that gap closes—not
  through acquisition but through acceptance—the energy normally consumed by craving and complaint becomes
  available for genuine practice and clarity. Sukha-lābha, the ''gaining of ease,'' is both immediate
  (the relief of releasing resistance) and cumulative (the deepened stability that allows meditation and
  insight to deepen).


  This is not the contentment of complacency. The yogi remains disciplined, studies, and practices with
  full commitment. But contentment means the yogi does not poison effort with resentment, does not sabotage
  progress with self-pity, and does not mistake the absence of ease for virtue. The supreme joy that arises
  is sukha in its deepest sense: the unshakeable well-being that comes when the mind stops fighting reality
  and begins to work with it.


  Key Terms


  **saṃtoṣa** — Contentment; the settled acceptance of what is, without resentment or denial, paired with
  disciplined effort.

  **sukha** — Ease, well-being, or joy; the natural state when the mind ceases to resist reality.

  **anuttama** — Unsurpassed, supreme, unexcelled; indicating the highest grade or quality.'
insight: The Sūtra asserts that contentment (सन्तोष) is the sole source of the highest happiness.
practice: 'When you feel the tightness of wanting something to be different than it is, pause and whisper
  aloud: ''This is what is true right now''—then notice what energy or attention becomes available in
  that instant of release, however small. Repeat this once each day at the moment you feel it most acutely.'
