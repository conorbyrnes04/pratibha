sanskrit_devanagari: बालेषु हस्थिबालादीनि
sanskrit_iast: baleṣu hastibalādīni
translation_literal: In the limbs, there are strengths like that of an elephant and so forth.
commentary: 'This sūtra appears in the section on siddhis (supernatural capacities) that arise from practice.
  Patañjali is describing a specific category of preternatural power: the development of extraordinary
  physical strength in the body''s limbs through yogic cultivation.


  The phrase ''like that of an elephant and so forth'' (hastibalādīni) uses the elephant as the archetypal
  example of brute strength, then gestures toward other animal powers—the speed of a bird, the grip of
  a serpent, the leap of a monkey. These are not literal transformations but rather the capacity to manifest
  animal-like force through the body.


  Within the Yoga–Sāṃkhya framework, this power emerges when the practitioner''s control over prāṇa (vital
  breath) becomes refined enough that it can be directed intensively into specific limbs or muscle groups.
  The underlying mechanism is not muscular hypertrophy but rather the removal of energetic blockages (granthis)
  and the harmonization of prāṇa and apāna currents, allowing latent śakti (power) to manifest.


  Crucially, Patañjali lists such siddhis not as goals but as potential obstacles to liberation. A yogi
  who becomes fascinated by newfound strength may become attached to it, delaying progress toward kaivalya
  (liberation). The sūtra''s placement in the text serves as both a map of what naturally unfolds and
  a warning: recognize these powers, do not cling to them.


  This verse also reflects the non-dualistic understanding of the body in yoga: the body is not merely
  flesh and bone but a vehicle for conscious prāṇa. When that prāṇa is fully awakened and directed, ordinary
  physical limitations dissolve.


  Key Terms


  **bala** — Strength or power; in yoga, the capacity to manifest force through conscious control of prāṇa
  rather than mere muscular effort.

  **prāṇa** — Vital life-force or breath-energy; the animating power that moves through the body''s channels
  (nāḍīs) and can be directed through practice.

  **siddhi** — Supernatural or preternatural capacity that arises as a byproduct of advanced yoga practice;
  Patañjali warns against attachment to such powers as they can obstruct liberation.'
insight: The sūtra asserts that the dynamic forces of the body—its ‘strengths’—are not abstract qualities
  but are situated in the physical apparatus of the hands, arms, and limbs.
practice: 'Seated in a comfortable position, bring your attention to your right arm. Inhale slowly for
  a count of four, and as you do, imagine prāṇa (vital energy) flowing from your heart down through your
  shoulder, arm, and into your fingertips. As you exhale, gently tense the muscles of your arm—not violently,
  but with steady, conscious contraction—while maintaining the sense of energy flowing through it. Repeat
  this five times on the right arm, then five times on the left. Then, standing, perform this same breath-and-tension
  sequence with your legs: inhale while imagining energy descending, exhale while engaging the muscles.
  The point is not to build muscle but to cultivate conscious command over prāṇa in the limbs. Over weeks,
  you may notice that ordinary tasks require less effort and that your movements feel more coordinated
  and powerful. This is the beginning of bala (strength) in the yogic sense: not force divorced from awareness,
  but force animated by prāṇa.'
