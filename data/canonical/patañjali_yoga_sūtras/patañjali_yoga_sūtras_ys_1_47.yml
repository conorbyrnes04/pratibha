sanskrit_devanagari: नीरविचारवायशारदये 'ध्यात्मप्रसादः
sanskrit_iast: nirvicāravaiśāradye 'dhyātmaprasādaḥ
translation_literal: When the non-deliberative mind becomes steady and clear, inner luminosity arises.
commentary: 'This sūtra marks a crucial threshold in meditative absorption (samādhi). Patañjali distinguishes
  between two grades of samādhi: savicāra (with deliberation, involving subtle mental reasoning about
  the object) and nirvicāra (without deliberation, where even the subtle mental activity ceases and only
  the object-essence remains). When nirvicāra samādhi stabilizes—when the meditator no longer needs to
  think *about* the object but rests as the object itself—a spontaneous clarity (prasāda) floods the inner
  field. This is not a thought or an achievement; it is the natural radiance that emerges when the mind''s
  deliberative machinery falls silent. The term adhyātma (inner, pertaining to the self) signals that
  this luminosity is not external but intrinsic—the mind''s own nature shining forth once obstruction
  ceases. In the Yoga–Sāṃkhya framework, this represents the purification of sattva (clarity) within the
  mind-stuff (citta), a direct perception of consciousness itself unmediated by conceptual overlay. This
  prasāda becomes the ground for higher insights and the recognition of puruṣa (the witnessing self) as
  distinct from all mental content.


  Key Terms


  **nirvicāra** — absorption without deliberation; meditative state in which subtle mental reasoning ceases
  and only the essence of the object remains

  **prasāda** — clarity, luminosity, or grace; the natural radiance of consciousness when obstruction
  is removed

  **adhyātma** — inner, pertaining to the self; intrinsic rather than external'
insight: The sūtra declares that when the mind ceases to engage in deliberative activity (nirvicāra) it
  attains a state of absolute purity (prasāda) that is the very bliss of the mind (dhyātmā).
practice: Stop mid-thought on a deliberate question or problem you're turning over, and notice the exact
  instant the mental machinery pauses—hold that gap without rushing to the next thought. In that suspension,
  let your inner field brighten on its own; do not search for luminosity or name it, only allow the clarity
  that surfaces when the reasoning stops.
