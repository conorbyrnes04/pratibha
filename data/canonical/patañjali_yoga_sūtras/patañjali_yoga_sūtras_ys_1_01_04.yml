sanskrit_devanagari: 'अथ योगानुशासनम् ॥ १.१ ॥


  योगः चित्तवृत्तिनिरोधः ॥ १.२ ॥


  तदा द्रष्टुः स्वरूपेऽवस्थानम् ॥ १.३ ॥


  वृत्तिसारूप्यम् इतरत्र ॥ १.४ ॥'
sanskrit_iast: 'atha yogānuśāsanam || 1.1 ||


  yogaś cittavṛttinirodhaḥ || 1.2 ||


  tadā draṣṭuḥ svarūpe ''vasthānam || 1.3 ||


  vṛttisārūpyam itaratra || 1.4 ||'
translation_literal: '**1.1** Now, the teaching of yoga.

  **1.2** Yoga is the stilling of the mind''s fluctuations (cittavṛtti).

  **1.3** Then the seer (draṣṭṛ) abides in its own nature (svarūpa).

  **1.4** Otherwise, it takes the form of the fluctuations (vṛtti).'
commentary: 'Patañjali''s opening movement is architectonic: he establishes yoga as a systematic teaching
  (1.1), defines its mechanism as suppression of mental transformations (1.2), and then reveals its fruit—the
  seer''s recognition of its own unchanging nature (1.3)—before gesturing toward the metaphysical ground
  that makes this possible (1.4). The cluster traces a single argument: bondage is the entanglement of
  puruṣa (consciousness, the seer) with the vṛtti (mental modifications) of citta (mind-stuff), which
  is itself a product of prakṛti (matter). Yoga is not a cultivation of new states but a systematic *nirodha*—cessation,
  suppression—of the mind''s ceaseless transformations. This is not mere quietism; it is the removal of
  the obstacle that prevents puruṣa from recognizing itself. When vṛtti cease, the seer does not become
  something new; it *remains in its own nature* (svarūpa), revealing that puruṣa has always been untouched
  by the mind''s flux. The Sāṃkhya framework here is decisive: prakṛti (including mind) is eternally active,
  generative, transformative; puruṣa is eternally still, witnessing, free. The sūtras do not promise that
  practice will *create* freedom but that it will *unveil* the freedom that is already the seer''s nature.
  Sūtra 1.4 complicates this by noting that elsewhere (in ordinary consciousness) puruṣa appears assimilated
  with prakṛti—a misidentification born of ignorance. The teaching thus pivots on a single insight: yoga
  is the disciplined reversal of this false assimilation through the methodical stilling of mind, allowing
  puruṣa to recognize its own svarūpa and thereby achieve kaivalya (isolation, aloneness—the ultimate
  freedom of the seer from the seen).


  Key Terms


  **vṛtti** — mental modifications or fluctuations; the mind''s ceaseless transformations (perception,
  emotion, thought, volition) that veil the seer

  **nirodha** — suppression, cessation, or restraint; the core mechanism of yoga—the stilling of vṛtti

  **puruṣa** — consciousness, the eternal seer or witness; the unchanging subject that is distinct from
  and untouched by prakṛti

  **svarūpa** — one''s own nature or essential form; the puruṣa''s intrinsic state of freedom and awareness,
  veiled by mental activity


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.25–26:** Both texts teach that the self (ātman/puruṣa) is eternally free and untouched
  by mental turbulence; liberation arises through the disciplined stilling of the mind (manas) and the
  recognition of one''s true nature beyond thought. Divergence: The Gītā emphasizes devotion and action
  (karma-yoga) as complementary paths alongside meditation, whereas Patañjali''s Yoga Sūtras present nirodha
  of vṛtti as the singular, direct mechanism of liberation.

  **Plotinus, Enneads V.8.1:** Plotinus describes the soul''s return to the One through the cessation
  of discursive thought and the recognition of an unchanging, transcendent principle that is eternally
  present; like puruṣa, the One is untouched by the flux of becoming. Divergence: Plotinus emphasizes
  a mystical ascent and union with the transcendent, whereas Patañjali''s kaivalya is the seer''s recognition
  of its own aloneness—not merger but clear discrimination (viveka) between puruṣa and prakṛti.

  **Epictetus, Enchiridion 1.1–2:** Both traditions teach that freedom lies not in controlling external
  circumstances but in recognizing what is within one''s power—for Epictetus, the faculty of choice (prohairesis);
  for Patañjali, the puruṣa''s intrinsic nature, which is independent of mental modifications. Divergence:
  Epictetus grounds freedom in rational will and moral discipline, whereas Patañjali locates it in the
  metaphysical distinction between consciousness and matter, requiring not ethical choice but the cessation
  of all mental activity.'
insight: The opening clause establishes a decisive boundary between the preparatory preface and the substantive
  doctrine, asserting that the subsequent verses constitute a systematic exposition rather than mer
practice: You now sit in a quiet place, close your eyes, and consciously observe each thought that arises,
  allowing it to pass without engagement, thereby suppressing the mind’s transformations.
