sanskrit_devanagari: उदानजयाज् जलपङ्ककंठाकादिष्व असङ्ग उत्क्रान्तिस्च
sanskrit_iast: udānajayāj jalapaṅkakaṇṭakādiṣv asaṅga utkrāntiś ca
translation_literal: Through mastery of udāna, non-attachment arises toward water, mud, thorns, and the
  like; and the ability to transcend [the body] emerges.
commentary: 'This sūtra belongs to Patañjali''s sequence on vibhūti (extraordinary capacities) that arise
  from perfected control of the vital currents. Udāna is the upward-moving prāṇa, governing buoyancy,
  levitation, and the subtle body''s ascent at death. The phrase ''jalapaṅkakaṇṭakādi'' (water, mud, thorns,
  etc.) names obstacles and dense material that normally impede or injure the body. When udāna is mastered
  through sustained prāṇāyāma and internal focus, two things occur:


  1. **Asaṅga** (non-attachment/non-clinging): The practitioner ceases to identify with or cling to material
  resistance. Water no longer pulls downward; mud no longer binds; thorns no longer pierce. This is not
  immunity but freedom from the reactive relationship to density.


  2. **Utkrānti** (transcendence/departure): The subtle body can separate from or move independent of
  gross matter. This is not levitation in the magical sense, but rather the capacity to direct consciousness
  and the energy body beyond the weight and friction of the physical form.


  Within the Yoga–Sāṃkhya framework, this reflects the progressive liberation of puruṣa (consciousness)
  from prakriti (matter). As the vital winds are refined and unified, the sense of being bound to physical
  laws dissolves. This is not supernatural but the natural outcome of recognizing the distinction between
  the witness and the witnessed.


  The practical implication: mastery of breath and internal current is mastery of the boundary between
  consciousness and matter. The yogi becomes neither enslaved to the body''s weight nor identified with
  its limitations.


  Key Terms


  **udāna** — The upward-moving vital current (prāṇa); governs buoyancy, speech, and the subtle body''s
  ascent; located in the throat and head.

  **asaṅga** — Non-attachment, non-clinging; freedom from reactive identification with or resistance to
  external conditions.

  **utkrānti** — Transcendence, departure, or the ability to move beyond; here, the capacity of consciousness
  or the subtle body to transcend material limitation.'
insight: The sūtra asserts that the very act of breath rising (udāna) and the subsequent flow of a pulse
  that resembles water (jalapaṅkakaṇṭaka) constitute the decisive motion that frees the mind from its
  bond
practice: '**Udāna Awakening Practice (10–15 minutes)**


  1. Sit upright in a comfortable cross-legged or kneeling posture. Lengthen the spine; draw the chin
  slightly back to align the cervical spine.


  2. **Establish the upward current**: Inhale through the nose for a count of 4, directing the breath
  sensation upward along the spine from the base to the crown. Feel the lift and buoyancy as you inhale.


  3. **Pause and hold**: Retain the breath for a count of 4. In this stillness, mentally trace the path
  from your feet to the crown, imagining a thread of light rising upward. This is udāna''s natural direction.


  4. **Exhale with release**: Exhale for a count of 6, but do not collapse. Instead, maintain the lifted
  spine and the sense of weightlessness even as the breath leaves.


  5. **Rest**: After the exhale, pause for 2 counts. Notice any lightness, spaciousness, or sense of non-weight
  in your body.


  6. **Repeat**: Continue for 8–10 rounds. Do not strain. The goal is to familiarize the nervous system
  with the upward, buoyant quality of udāna, not to force levitation.


  7. **Seal the practice**: After the final round, sit in stillness for 1–2 minutes. Observe whether your
  sense of the body''s weight has shifted. Notice any subtle sense of separation between your awareness
  and your physical form.


  **Effect**: Regular practice of this technique refines udāna, loosens identification with physical density,
  and cultivates the inner experience of non-attachment to material resistance. Over time, this translates
  into both psychological freedom and a refined capacity to direct energy beyond the body''s ordinary
  boundaries.'
