  body: By the rising of the breath and the movement of the water‑like pulse, the mind’s attachment dissolves
    and advances.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that the very act of breath rising (udāna) and the subsequent flow of a pulse
    that resembles water (jalapaṅkakaṇṭaka) constitute the decisive motion that frees the mind from its
    bondage to the body. This is a contested move in that some commentators treat the pulse as a mere
    physiological phenomenon, while others read it as a subtle energetic current that carries the mind’s
    awareness. In the Yoga‑Sāṃkhya framework, the breath is the first external stimulus (prāṇāyāma) that
    awakens the subtle body, and the pulse is the internal manifestation of that stimulus, a conduit for
    the mind’s transition from the gross to the subtle. The sūtra therefore bridges the external practice
    of breath control with the internal experience of mind‑body separation, a key step toward samādhi.
    The existential implication is that liberation is not a distant goal but an immediate, experiential
    release that can be accessed by consciously observing the breath and pulse. This aligns with the Satchidananda
    aphorism, which emphasizes the loosening of the bondage of mind to body through knowledge of the mind’s
    functioning; the sūtra provides the concrete sensory gateway—breath and pulse—through which that knowledge
    is actualized. Thus, the sūtra invites practitioners to use the breath as a catalyst for the pulse,
    thereby dissolving attachment and enabling progressive ascent toward the ultimate state of samādhi.


    Key Terms


    **udāna (उदान)** — etymology: ‘to rise’ -> Sāṃkhya tradition: the rising of prāṇa (breath) that initiates
    the subtle body; default translation ‘breath’ misses the dynamic, rising quality that signals the
    start of the yogic process.


    **jalapaṅkakaṇṭaka (जलपङ्ककंठा)** — etymology: ‘water‑like pulse’ -> Sāṃkhya tradition: a subtle energetic
    current that flows like water, carrying the mind’s awareness; default translation ‘pulse’ overlooks
    its fluid, continuous nature that differentiates it from ordinary heartbeats.


    **asaṅga (असङ्ग)** — etymology: ‘not attached’ -> Sāṃkhya tradition: the state of mind freed from
    the body’s influence; default translation ‘detachment’ fails to convey the active dissolution of attachment.


    **utkrānti (उत्क्रान्ति)** — etymology: ‘advancement’ -> Sāṃkhya tradition: the forward movement of
    the mind toward higher states; default translation ‘progress’ does not capture the yogic sense of
    transcendental ascent.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtras 1.1:** Both passages begin with a reference to breath as the initiating factor
    for the yogic process, establishing a structural parallel in the opening clause.

    *Divergence:* While 1.1 speaks of breath as a general stimulus, 3.39 specifies the rising of the breath
    and the subsequent pulse, adding a concrete sensory detail absent in 1.1.


    **Patanjali, Yoga Sūtras 1.2:** The theme of detachment (asaṅga) appears in both, linking the dissolution
    of mind‑body bondage to the practice of breath.

    *Divergence:* 1.2 uses a general statement of detachment, whereas 3.39 ties it explicitly to the pulse’s
    flow, indicating a more nuanced, experiential pathway.


    **Shankara, Vivekachudamani 2.1:** Both texts emphasize the role of subtle bodily processes (breath,
    pulse) in awakening consciousness, reflecting a shared Sāṃkhya‑Vedānta heritage.

    *Divergence:* Shankara’s passage is philosophical and abstract, while 3.39 provides a practical, sensory
    instruction, making the yogic process more accessible.'
