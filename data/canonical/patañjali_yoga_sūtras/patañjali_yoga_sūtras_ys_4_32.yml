sanskrit_devanagari: ततः कृतार्थानां परिणामक्रमसमाप्तिर गुणानाम
sanskrit_iast: tataḥ kṛtārthānāṃ pariṇāmakramasamāptir guṇānām
translation_literal: Then, for those who have fulfilled their purpose, the sequential transformation of
  the guṇas comes to completion.
commentary: 'This sūtra marks the culmination of the yogin''s relationship with prakṛti (nature) and its
  three constituent forces—sattva, rajas, and tamas. The phrase kṛtārthānāṃ (''those whose purpose is
  fulfilled'') refers to the guṇas themselves, not the practitioner. Throughout manifestation, the guṇas
  cycle through endless transformations (pariṇāmakramaḥ), each state giving rise to the next in an unbroken
  sequence. When the yogin achieves kaivalya (isolation of puruṣa from prakṛti), the guṇas have completed
  their function: they no longer need to generate experience, perception, or the sense of individual agency.
  The guṇas do not disappear—they simply cease their dance of transformation relative to that consciousness.
  This is not annihilation but release. The guṇas return to their source in prakṛti, their purposefulness
  exhausted. For the liberated yogin, this means the machinery of nature—causation, time, change, and
  the three-fold coloring of experience—no longer binds awareness. The sūtra assumes the Sāṃkhya framework:
  prakṛti exists to serve puruṣa''s awakening; once that awakening is complete, prakṛti''s obligation
  is fulfilled.


  Key Terms


  **guṇa** — The three fundamental qualities of prakṛti: sattva (luminosity, harmony), rajas (activity,
  passion), and tamas (inertia, darkness).

  **pariṇāmaḥ** — Transformation or modification; the continuous flux of nature through sequential states.

  **kaivalya** — Isolation or aloneness; the final liberation in which puruṣa (consciousness) stands free
  from prakṛti (nature).'
insight: The central claim of this verse is that the primal attributes (guṇas) cease their activity once
  the soul has received the experience they were intended to provide.
practice: Watch one cycle of transformation complete itself—a breath cycle, a thought arising and dissolving,
  a conversation beginning and ending—and at its conclusion, release your grip on naming it as 'yours.'
  Let the guṇas finish their dance without your commentary, as if you were witnessing prakṛti's purpose
  fulfilled independent of your witnessing.
