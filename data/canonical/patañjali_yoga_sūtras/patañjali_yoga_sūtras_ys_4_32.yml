  items:
  - term: hāna (हान)
    definition: '√hā ‘abandon’ → cessation/abandonment as goal -> in “Termination of the Guṇas”: Then
      the guṇas, having fulfilled their purpose, terminate their sequence of transformations. -> not repression;
      the ending of future suffering’s cause through viveka'
  - term: pariṇāma (परिणाम)
    definition: 'pari-√nam ‘bend around / transform’ → transformation -> in “Termination of the Guṇas”:
      Then the guṇas, having fulfilled their purpose, terminate their sequence of transformations. ->
      not random change; structured transformation of dharma/lakṣaṇa/avasthā that saṃyama can know'
  - term: guṇa (गुण)
    definition: '‘strand/quality’ — sattva, rajas, tamas as constitutive modes -> in “Termination of the
      Guṇas”: the term ‘guṇa’ in this sutra implies an active, purposive agent, not merely a passive attribute
      -> not optional personality traits; the dynamic constitution of all prakṛtic phenomena'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Termination of the Guṇas”: here
      it is portrayed as a teacher that ceases its work once its purpose is fulfilled -> not pastoral
      ‘Nature’; the tri-guṇa matrix generating all experience including mind'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Termination of the Guṇas”:
      in this sutra, the soul is the recipient of the guṇas’ experience, whose liberation is the ultimate
      goal -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
