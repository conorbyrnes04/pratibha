    definition: 'citi ‘awareness’ + śakti ‘power’ — consciousness-power as such -> in “Siddhis from Past
      Practices”: Siddhis arise from practices performed in previous births. -> not a goddess add-on;
      puruṣa’s own knowing-power standing in svarūpa at kaivalya'
    lemma_id: cit
  - term: siddhi (सिद्धि)
    definition: '√sidh ‘accomplish’ → accomplishment/power -> in “Siddhis from Past Practices”: the translation
      ‘accomplishment’ misses its connotation of a perfected, liberated function -> not the goal; attainments
