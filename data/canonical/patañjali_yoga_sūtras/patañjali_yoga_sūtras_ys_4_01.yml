sanskrit_devanagari: जन्मौषधिमन्त्रतपःसमाधिजाḥ सिद्धयः
sanskrit_iast: janmauṣadhimantratapaḥsamādhijāḥ siddhayaḥ
translation_literal: Perfected capacities arise from birth, from herbs, from mantra, from austerity, and
  from samādhi.
commentary: 'This sūtra (III.45) enumerates five distinct origins of siddhis—the extraordinary powers
  or perfected abilities that emerge in yoga practice. Patañjali is not claiming all five are equally
  reliable or desirable; rather, he is mapping the phenomenological landscape of how such capacities manifest.


  Janma (birth) refers to innate gifts—some individuals are born with heightened perception, intuition,
  or unusual abilities, often as a residue of past-life practice (saṃskāra). Auṣadhi (herbs, medicinal
  plants) acknowledges that certain botanical preparations can temporarily alter consciousness or enhance
  specific faculties, though Patañjali treats this as a lower, unstable path. Mantra (sacred utterance,
  vibrational formula) works through the power of sound and repetition to attune the nervous system and
  invoke particular śaktis (energies). Tapas (heat, austerity, disciplined effort) generates transformative
  friction—fasting, breath work, and rigorous practice burn through mental obscuration. Samādhi (absorption,
  unified consciousness) is the supreme source: when the mind merges completely with its object, the boundary
  between knower and known dissolves, and siddhis naturally unfold as expressions of that unified field.


  The sūtra''s placement in the Vibhūti Pāda (chapter on powers) signals a critical teaching: siddhis
  are real, but they are also distractions. The yogi may develop clairvoyance, telepathy, or healing ability
  through any of these five gates, yet attachment to such powers becomes an obstacle to kaivalya (liberation).
  Patañjali will soon warn that these very capacities can trap the aspirant in subtle ego-inflation.


  Key Terms


  **siddhi** — Perfected capacity or extraordinary power that arises from yogic practice; any ability
  beyond ordinary human function.

  **samādhi** — Unified absorption; the state in which the meditator, meditation, and object of meditation
  merge into one undivided awareness.

  **tapas** — Heat, austerity, disciplined effort; the transformative friction generated by sustained
  practice and self-restraint.'
insight: The passage asserts that psychic powers are not spontaneously generated in the present life but
  are the fruits of prior yogic activity.
practice: Observe which capacity emerges most naturally in you today—notice whether it arrives from your
  innate gifts (birth), from a substance or food you consume (herbs), from a word or sound that moves
  you (mantra), from effort and discipline you exert (austerity), or from a moment of absorbed stillness
  (samādhi). Name it aloud once you recognize its source, then trust that origin for the next seven days
  without trying to force the others.
