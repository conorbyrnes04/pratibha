      turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Mind’s Mastery over Change”: the translation
      ‘self’ often obscures its role as the master of citta -> not ‘person’ as social self; the unchanging witness distinct
      from prakṛti’s display'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Mind’s Mastery over Change”: in Yoga, the fluctuations
      of citta that must be observed -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep,
      memory)'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Mind’s Mastery over Change”: the translation ‘nature’
      neglects its role as the source of change -> not pastoral ‘Nature’; the tri-guṇa matrix generating all experience including
      mind'
  - term: cittavṛtti
    definition: 'source-term cittavṛtti -> in “Mind’s Mastery over Change”: the mental waves or thought-patterns that arise
