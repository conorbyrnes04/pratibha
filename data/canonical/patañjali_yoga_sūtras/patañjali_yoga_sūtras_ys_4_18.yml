sanskrit_devanagari: सदा ज्ञाताश् चित्तवृत्तयः तत् प्रभोः पुरुषस्य अपरीणामित्वात्
sanskrit_iast: sadā jñātāś cittavṛttayas tatprabhoḥ puruṣasyāpariṇāmitvāt
translation_literal: The mind's fluctuations are always known because of the unchanging nature of their
  master, the puruṣa.
commentary: 'This sūtra (YS 4.18) resolves a fundamental problem in Yoga–Sāṃkhya metaphysics: if consciousness
  (puruṣa) is utterly transcendent and unchanging, how can it know anything? How does awareness function
  in a world of constant change?


  Patañjali''s answer is elegant. The puruṣa does not *become* aware through effort or transformation.
  Rather, all mental fluctuations (cittavṛtti)—thoughts, perceptions, emotions, sensations—are *perpetually
  illuminated* by the unchanging presence of consciousness itself. The puruṣa is like a motionless mirror
  or lamp: it does not move toward objects or change to accommodate them, yet everything that arises in
  the mind-field is spontaneously known in its light.


  The phrase *sadā jñātāś* (always known) is crucial. Knowledge is not acquired; it is the natural condition
  of the mind''s contents when they arise before consciousness. The puruṣa''s *apariṇāmitvāt* (non-transformation,
  immutability) is precisely what makes it a reliable witness. Because it never changes, it can know all
  change without being confused or corrupted by it.


  This teaching dissolves the dualism between knower and known at the highest level: the puruṣa does not
  *do* anything to know. Knowing happens because consciousness is present. The yogi''s task is not to
  make the mind know better, but to recognize that what is already always known—the stable awareness behind
  all flux—is one''s true nature.


  In practice, this means that liberation (kaivalya) is not a future achievement but the recognition of
  what already is: the untouched, unchanging witness of all experience.


  Key Terms


  **cittavṛtti** — fluctuations or modifications of the mind-stuff; the mental waves or thought-patterns
  that arise and pass away

  **puruṣa** — pure consciousness; the unchanging witness-self, distinct from all mental and material
  phenomena

  **apariṇāmitvāt** — on account of non-transformation or immutability; the quality of remaining forever
  unchanged'
insight: The central claim of this sutra is that the Purusha, as the immutable witness, is the sole cognizer
  of the mind’s ever‑shifting states.
practice: Sit quietly for 10 minutes. Choose any object of attention—the breath, a sound, a visual point.
  As you observe it, deliberately notice the *unchanging awareness* in which the object appears and changes.
  The breath comes and goes; sounds arise and fade; thoughts move through the field of attention. But
  the space of awareness itself—the 'knowing' in which all this happens—does not move or transform. It
  is the same now as it was five minutes ago, even though everything within it has changed. Rest attention
  on this stable, untouched quality of awareness itself, not on its contents. This is a direct taste of
  puruṣa as the eternal witness.
