sanskrit_devanagari: अनीत्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मक्‌ह्यात्मिर् अविद्या
sanskrit_iast: anityāśuciduḥkhānātmasu nityaśucisukhātmakhyātir avidyā
translation_literal: Ignorance is the mistaken perception of what is impermanent, impure, painful, and
  not-self as permanent, pure, pleasurable, and self.
commentary: 'This sūtra defines avidyā (ignorance) as the root misidentification underlying all suffering
  in the Yoga–Sāṃkhya framework. It is not mere lack of knowledge, but active misperception—a reversal
  of reality.


  The four pairs of opposites map onto the fundamental nature of embodied existence:


  1. **Permanence vs. impermanence (nitya/anitya)**: The body, mind, and all mental formations are in
  constant flux. Ignorance freezes them into imagined stability.


  2. **Purity vs. impurity (śuci/aśuci)**: The body is subject to decay, disease, and elimination. Ignorance
  cloaks it in an illusion of cleanliness and refinement.


  3. **Pleasure vs. pain (sukha/duḥkha)**: All sensory and mental experiences rooted in identification
  with the body-mind are ultimately tinged with suffering—either active pain, the pain of change, or the
  subtle dissatisfaction of conditioned pleasure. Ignorance inverts this, seeing the body and its experiences
  as sources of lasting happiness.


  4. **Self vs. not-self (ātman/anātman)**: The puruṣa (conscious witness) is distinct from all objects
  of experience, including the body and mind. Ignorance fuses the eternal, unchanging awareness with the
  changing vehicle it inhabits.


  This misidentification is not intellectual error alone—it is a perceptual habit so deep it shapes sensation,
  emotion, and choice. The entire machinery of kleśa (affliction) flows from this single inversion. Recognition
  of this sūtra is the beginning of discriminative discernment (viveka), which Patañjali names as the
  direct antidote to avidyā.


  Key Terms


  **avidyā** — Ignorance; the fundamental misperception that inverts the nature of reality, mistaking
  the impermanent for permanent, the impure for pure, the painful for pleasurable, and the not-self for
  self.

  **viveka** — Discriminative discernment; the capacity to distinguish between the eternal puruṣa and
  the changing field of nature (prakṛti), and between what is real and what is merely apparent.

  **puruṣa** — The conscious witness; the unchanging, eternal subject of awareness, distinct from all
  objects and modifications of nature.'
insight: The sūtra asserts that ignorance (avidyā) is a misidentification that projects the opposite qualities
  onto a thing.
practice: '**Reverse Identification Inquiry (15 minutes)**


  Sit comfortably. Bring to mind something you habitually identify with—your appearance, a skill, an emotion,
  a role. Notice the conviction with which you claim it as ''me'' or ''mine.''


  Now systematically apply the four reversals:


  1. **Impermanence**: Trace this quality backward and forward in time. When did it arise? How has it
  changed? How will it inevitably change or disappear? Feel the instability.


  2. **Impurity**: Acknowledge the body''s material nature—its need to eliminate waste, its vulnerability
  to disease, its eventual decay. Do not suppress or judge; simply see clearly.


  3. **Pain**: Honestly examine whether this identity has ever delivered lasting, uncomplicated happiness,
  or whether satisfaction has always been mixed with fear of loss, boredom, or subtle dissatisfaction.


  4. **Not-self**: Ask: "Who is aware of this quality changing? Who observes these emotions and thoughts
  about it?" Notice the witnessing awareness that remains untouched by the flux you''ve just traced.


  Repeat with different identifications. The goal is not intellectual conviction but a felt shift in how
  tightly you cling to the misidentification. Over weeks, this practice loosens avidyā''s grip and strengthens
  viveka.'
