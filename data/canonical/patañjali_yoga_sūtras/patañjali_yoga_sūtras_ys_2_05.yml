unit_label: Ignorance as Misidentification
title: Ignorance as Misidentification
unit_type: sutra
sanskrit_devanagari: अनीत्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मक्‌ह्यात्मिर् अविद्या
sanskrit_iast: anityāśuciduḥkhānātmasu nityaśucisukhātmakhyātir avidyā
translation_literal: Ignorance is taking the non‑eternal, impure, evil, and non‑real to be eternal, pure, good, and real.
commentary: 'The sūtra asserts that ignorance (avidyā) is a misidentification that projects the opposite qualities onto a
  thing. It is not merely a lack of knowledge but a positive, self‑generated conviction that transforms the non‑real into
  the real. In the Yoga and Sāṃkhya framework, this misidentification is the root of the threefold illusion—cogniser, cognised,
  and instrument—binding the puruṣa to prakṛti. The sūtra’s structure mirrors the classic triad of ignorance, delusion, and
  bondage, underscoring that ignorance is the first step in the causal chain that leads to bondage. The misidentification
  is not an external force but an internal, self‑produced state that must be dismantled through disciplined practice. The
  existential implication is that one’s experience of suffering and joy is contingent upon this misidentification; by recognizing
  the true nature of the self and the world, the practitioner dissolves the illusion and attains liberation. Dvivedi’s commentary
  highlights that ignorance is not a mere absence of knowledge but a distinct mental state that actively misattributes qualities.
  This aligns with the Yoga sutra’s emphasis on the self‑generated nature of ignorance, reinforcing the need for self‑discipline
  (sādhana) to correct the misidentification and restore the authentic relationship between puruṣa and prakṛti.


  Key Terms


  **avidyā (अविद्या)** — avidyā: from a- (not) + vid (to know) → ignorance; in Sāṃkhya it denotes the misidentification that
  creates the threefold reality of cogniser, cognised, and instrument, a self‑generated conviction rather than mere lack of
  knowledge.


  **puruṣa (पुरुष)** — puruṣa: the conscious principle; in Sāṃkhya, the eternal, unchanging self; its misidentification with
  prakṛti leads to bondage.


  **prakṛti (प्रकृति)** — prakṛti: the material, dynamic principle; its misidentification with puruṣa creates the illusion
  of multiplicity.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.5:** Ignorance = misidentification of opposite qualities

  *Divergence:* Unlike later commentaries that separate ignorance from delusion, this sutra treats ignorance as the primary
  misidentification that engenders delusion.


  **Sāṃkhya Kāṇḍa 1.5:** Threefold reality of cogniser, cognised, instrument

  *Divergence:* Sāṃkhya explicitly names the threefold, whereas the sutra implies it through the misidentification of qualities.


  **Dvivedi, Commentary on YS 2.5:** Ignorance is a positive mental state, not mere privation

  *Divergence:* Dvivedi expands on the sutra’s terse statement, clarifying that ignorance actively constructs reality rather
  than merely lacking it.'
insight: The sūtra asserts that ignorance (avidyā) is a misidentification that projects the opposite qualities onto a thing.
practice: Observe each thought as it arises and consciously note whether it attributes eternal purity or non‑eternal impurity,
  thereby correcting the misidentification in real time.
