- kind: original
  label: Original
  body: अनीत्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मक्‌ह्यात्मिर् अविद्या
- kind: iast
  label: IAST
  body: anityāśuciduḥkhānātmasu nityaśucisukhātmakhyātir avidyā
- kind: translation
  label: Pratibha Translation
  body: Ignorance is taking the non‑eternal, impure, evil, and non‑real to be eternal, pure, good, and
    real.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that ignorance (avidyā) is a misidentification that projects the opposite qualities
    onto a thing. It is not merely a lack of knowledge but a positive, self‑generated conviction that
    transforms the non‑real into the real. In the Yoga and Sāṃkhya framework, this misidentification is
    the root of the threefold illusion—cogniser, cognised, and instrument—binding the puruṣa to prakṛti.
    The sūtra’s structure mirrors the classic triad of ignorance, delusion, and bondage, underscoring
    that ignorance is the first step in the causal chain that leads to bondage. The misidentification
    is not an external force but an internal, self‑produced state that must be dismantled through disciplined
    practice. The existential implication is that one’s experience of suffering and joy is contingent
    upon this misidentification; by recognizing the true nature of the self and the world, the practitioner
    dissolves the illusion and attains liberation. Dvivedi’s commentary highlights that ignorance is not
    a mere absence of knowledge but a distinct mental state that actively misattributes qualities. This
    aligns with the Yoga sutra’s emphasis on the self‑generated nature of ignorance, reinforcing the need
    for self‑discipline (sādhana) to correct the misidentification and restore the authentic relationship
    between puruṣa and prakṛti.


    Key Terms


    **avidyā (अविद्या)** — avidyā: from a- (not) + vid (to know) → ignorance; in Sāṃkhya it denotes the
    misidentification that creates the threefold reality of cogniser, cognised, and instrument, a self‑generated
    conviction rather than mere lack of knowledge.


    **puruṣa (पुरुष)** — puruṣa: the conscious principle; in Sāṃkhya, the eternal, unchanging self; its
    misidentification with prakṛti leads to bondage.


    **prakṛti (प्रकृति)** — prakṛti: the material, dynamic principle; its misidentification with puruṣa
    creates the illusion of multiplicity.


    Cross-Tradition Resonances


    **Yoga Sūtra 2.5:** Ignorance = misidentification of opposite qualities

    *Divergence:* Unlike later commentaries that separate ignorance from delusion, this sutra treats ignorance
    as the primary misidentification that engenders delusion.


    **Sāṃkhya Kāṇḍa 1.5:** Threefold reality of cogniser, cognised, instrument

    *Divergence:* Sāṃkhya explicitly names the threefold, whereas the sutra implies it through the misidentification
    of qualities.


    **Dvivedi, Commentary on YS 2.5:** Ignorance is a positive mental state, not mere privation

    *Divergence:* Dvivedi expands on the sutra’s terse statement, clarifying that ignorance actively constructs
    reality rather than merely lacking it.'
- kind: key_terms
  label: Key Terms
  items:
  - term: hāna (हान)
    definition: '√hā ‘abandon’ → cessation/abandonment as goal -> in “Ignorance as Misidentification”:
      Ignorance is taking the non‑eternal, impure, evil, and non‑real to be eternal, pure, good, and real.
      -> not repression; the ending of future suffering’s cause through viveka'
  - term: duḥkha (दुःख)
    definition: 'dus + kha ‘bad axle-hole’ → suffering/friction -> in “Ignorance as Misidentification”:
      Ignorance is taking the non‑eternal, impure, evil, and non‑real to be eternal, pure, good, and real.
      -> not only acute pain; the structural unsatisfactoriness yogins see even in pleasure’s change'
  - term: avidyā (अविद्या)
    definition: 'a- + vidyā ‘non-knowing’ — mis-seeing the permanent/impure/self etc. -> in “Ignorance
      as Misidentification”: in Sāṃkhya it denotes the misidentification that creates the threefold reality
      of cogniser, cognised, and instrument, a self‑generated conviction rather than mere lack of knowledge
      -> not simple ignorance of facts; structural misidentification that parents the other kleśas'
    lemma_id: vidya
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Ignorance as Misidentification”:
      its misidentification with prakṛti leads to bondage -> not ‘person’ as social self; the unchanging
      witness distinct from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Ignorance as Misidentification”:
      its misidentification with puruṣa creates the illusion of multiplicity -> not pastoral ‘Nature’;
      the tri-guṇa matrix generating all experience including mind'
