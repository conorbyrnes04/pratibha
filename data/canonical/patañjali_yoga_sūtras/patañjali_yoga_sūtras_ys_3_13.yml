sanskrit_devanagari: एतना भूतेंद्रियेṣu धर्मलक्षणावस्था परिवर्तनाः व्याख्याताḥ
sanskrit_iast: etena bhūtendriyeṣu dharmalakṣaṇāvasthāpariṇāmā vyākhyātāḥ
translation_literal: By this method, the transformations of dharma, lakṣaṇa, and avasthā occurring in
  the elements and sense organs are fully explained.
commentary: 'This sūtra (III.13) concludes Patañjali''s exposition of parināma—the three-fold transformation
  that governs all manifest reality. The preceding sūtras outlined how dharma (intrinsic quality or form),
  lakṣaṇa (characteristic mark or temporal phase), and avasthā (condition or state) undergo continuous
  modification in both gross elements (bhūta) and the sense organs (indriya) through which we perceive
  them.


  The word etena (''by this'') refers back to the framework of parināma just established: the principle
  that all conditioned phenomena arise from and return to prakṛti through lawful transformation. This
  is not random flux but intelligible process. When the yogi understands these three dimensions of change—the
  essential quality, its distinguishing feature in time, and its present condition—he grasps the mechanics
  of manifestation itself.


  For the Yoga-Sāṃkhya view, this understanding is liberatory because it reveals that what appears solid
  and permanent is actually a flowing pattern of transformations. The sense organs (indriya) are not separate
  from the elements; they are subtle expressions of the same transformative principle. By recognizing
  this, the practitioner ceases to reify experience and begins to witness the play of prakṛti without
  identification.


  This sūtra marks the completion of a technical teaching: the yogi now possesses a coherent map of how
  reality changes, which prepares him for the higher stages where transformation itself becomes an instrument
  of insight and eventual liberation.


  Key Terms


  **parināma** — Transformation; the lawful unfolding of prakṛti through successive modifications of form,
  quality, and state.

  **dharma** — Intrinsic quality, essential characteristic, or defining form of a thing.

  **lakṣaṇa** — Distinguishing mark, temporal phase, or characteristic sign that differentiates one moment
  or state from another.'
insight: The central claim of this sutra is that the same causal principles that govern the mind’s fluctuations
  also govern the sensory apparatus.
practice: 'Throughout one ordinary activity today—eating, walking, or speaking—pause three times and name
  aloud what is changing: first its essential nature (''this is bitter'' or ''this is solid''), then its
  temporal mark (''now arising'' or ''now fading''), then its present condition (''strong'' or ''weakening'').
  By naming these three dimensions of transformation as they occur, you embody the parināma itself rather
  than merely observing it.'
