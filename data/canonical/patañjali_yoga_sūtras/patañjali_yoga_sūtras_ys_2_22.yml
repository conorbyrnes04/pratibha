title: Purushic Continuity Amidst Destruction
unit_type: sutra
sanskrit_devanagari: कृतार्थं प्रतिप्रत्याशा नष्टं अपि नष्टः तदन्यसाधारणत्वात्
sanskrit_iast: kṛtārthaṃ prati naṣṭam apy anaṣṭaṃ tadanyasādhāraṇatvāt
translation_literal: When the purpose is fulfilled, the object of action is destroyed for the doer, yet it remains undestroyed
  for others; thus the object is ordinarily common to all.
commentary: 'The Sūtra asserts that the destruction of an object by a practitioner does not entail its universal annihilation.
  The contested move is the distinction between the *purūṣa* who has realized the *saṃkhyā* of *prakṛti* and the *purūṣas*
  who have not. In the Sāṃkhya framework, *prakṛti* is a singular, eternal nature whose manifestations are manifold. The Sūtra
  resolves the paradox of a single *purūṣa* attaining liberation while *prakṛti* persists for the rest. It does so by positing
  that the *purūṣa*’s realization renders *prakṛti* inert in his experience, but the inert *prakṛti* continues to act upon
  the other *purūṣas*. This preserves the integrity of the *saṃkhyā* of *prakṛti* without violating its indestructibility.
  The Dvivedi commentary echoes this by noting that the *purūṣa*’s cessation of action does not negate *prakṛti*’s universal
  effects. Existentially, the passage reminds practitioners that liberation is a personal, not a universal, transformation;
  the world’s continued functioning does not diminish one’s attainment. It encourages a disciplined practice that recognizes
  the dual reality of personal liberation and collective persistence, thereby fostering a balanced, non-egoistic approach
  to *saṃkhyā* and *samādhi*.


  Key Terms


  **purūṣa (पुरूष)** — purūṣa (Sāṃkhya) – the conscious principle, distinct from prakṛti; default translation ‘person’ omits
  its metaphysical role as the observer and the locus of liberation.


  **prakṛti (प्रकृति)** — prakṛti (Sāṃkhya) – the primal, generative nature, eternal and indestructible; default translation
  ‘nature’ fails to convey its role as the dynamic substrate of all manifestations.


  **saṃkhyā (संख्या)** — saṃkhyā (Sāṃkhya) – the enumeration of elements (purūṣa, prakṛti, and their constituents); default
  translation ‘count’ overlooks its ontological significance.


  **samādhi (समाधि)** — samādhi (Yoga) – a state of meditative absorption and union; default translation ‘concentration’ misses
  its transcendental aspect.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.22:** Structural homology with 2.21: both address the fate of objects post-action, using the same grammatical
  construction (kṛtārthaṃ…apya…nashṭam).

  *Divergence:* While 2.21 speaks of the object’s destruction for the doer, 2.22 extends this to the object’s continued existence
  for others, highlighting a broader communal implication.


  **Sāṃkhya Kārikā 2.10:** Both texts discuss the inertness of *prakṛti* after *purūṣa*’s realization, employing the term
  *nashṭam* to denote cessation of effect.

  *Divergence:* The Sūtra frames this in the context of personal liberation, whereas the Kārikā presents it as a metaphysical
  principle affecting all *purūṣas*.


  **Dvivedi Commentary 2.22:** Dvivedi parallels the Sūtra’s claim with the idea that *prakṛti* remains active for other *purūṣas*.

  *Divergence:* Dvivedi introduces the notion of *ptsrums* (inherent qualities) to explain multiplicity, a nuance absent in
  the terse Sūtra.'
insight: The Sūtra asserts that the destruction of an object by a practitioner does not entail its universal annihilation.
practice: Feel the object of your current action as it dissolves for you, yet recognize it remains present for others; let
  this awareness guide you to act with detached compassion.
