  items:
  - term: dhāraṇā (धारणा)
    definition: '√dhṛ ‘hold’ → binding mind to a place -> in “Purushic Continuity Amidst Destruction”:
      When the purpose is fulfilled, the object of action is destroyed for the doer, yet it remains undestroyed
      for others;… -> not casual focus; deliberate localization of citta that begins saṃyama'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Purushic Continuity Amidst
      Destruction”: the conscious principle, distinct from prakṛti -> not ‘person’ as social self; the
      unchanging witness distinct from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Purushic Continuity Amidst Destruction”:
      the primal, generative nature, eternal and indestructible -> not pastoral ‘Nature’; the tri-guṇa
      matrix generating all experience including mind'
  - term: saṃkhyā (संख्या)
    definition: 'source-term saṃkhyā -> in “Purushic Continuity Amidst Destruction”: load-bearing in “”;
      stakes the argument of: When the purpose is fulfilled, the object of action is destroyed for the
      doer, yet it remains undestroyed for others;… -> ‘count’ overlooks its ontological significance'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Purushic Continuity Amidst Destruction”:
      a state of meditative absorption and union -> not trance-entertainment or unconsciousness; graded
      absorption where subject–object friction quiets'
