sanskrit_devanagari: कृतार्थं प्रतिप्रत्याशा नष्टं अपि नष्टः तदन्यसाधारणत्वात्
sanskrit_iast: kṛtārthaṃ prati naṣṭam apy anaṣṭaṃ tadanyasādhāraṇatvāt
translation_literal: When the purpose is fulfilled, that which has been destroyed remains undestroyed
  for another; because it is shared in common by many.
commentary: 'This sūtra addresses a fundamental paradox in Yoga–Sāṃkhya metaphysics: the relationship
  between prakṛti (nature/matter) and the multiple puruṣas (conscious witnesses). Once a puruṣa achieves
  its goal—liberation (kaivalya)—the dissolution of its individual field of experience might seem to mean
  the end of prakṛti itself. But prakṛti does not cease; it continues to operate for other puruṣas who
  have not yet attained their purpose. The world is not annihilated when one individual awakens.


  This verse corrects a potential misunderstanding: liberation is not cosmic destruction but rather the
  withdrawal of one conscious principle from entanglement with matter. Prakṛti''s guṇas (qualities) continue
  their dance, the objects of experience persist, and other beings continue their journey through bondage
  and practice. The liberated yogin does not obliterate reality; he simply ceases to mistake himself for
  it.


  Within classical Yoga, this teaching has profound implications for ethics and compassion. The world
  does not vanish when you awaken. Your liberation does not negate the reality or suffering of others
  still bound. This grounds the yogic path in a kind of cosmic realism: enlightenment is not escape from
  a false universe, but clear seeing within a universe that continues, shared by all beings.


  Key Terms


  **kṛtārthaṃ** — having fulfilled its purpose; the state of a puruṣa that has achieved its goal (kaivalya)

  **prakṛti** — primordial nature; the dynamic continuum of matter, energy, and qualities (guṇas) that
  persists independent of any single conscious witness

  **kaivalya** — isolation, aloneness; the yogic goal of puruṣa recognizing itself as eternally distinct
  from prakṛti'
insight: The Sūtra asserts that the destruction of an object by a practitioner does not entail its universal
  annihilation.
practice: When you witness someone else's struggle today—grief, confusion, or repetitive suffering—notice
  the impulse to dissolve their problem or make it disappear. Instead, let their world remain exactly
  as it is while you withdraw your need to fix it; feel the difference between compassion that acts and
  compassion that simply does not add your entanglement to their burden.
