sutra_range: 3.4-3.6
sanskrit_devanagari: 'त्रयम् एकत्रः संयमः ॥ ३.४ ॥


  तज्जयात् प्रज्ञालोकः ॥ ३.५ ॥


  तस्य भूमिषु विनियोगः ॥ ३.६ ॥'
sanskrit_iast: 'trayam ekatra saṃyamaḥ || 3.4 ||


  tajjayāt prajñālokaḥ || 3.5 ||


  tasya bhūmiṣu viniyogaḥ || 3.6 ||'
translation_literal: '**3.4** The binding of these three together is *saṃyama* (constraint).

  **3.5** From mastery of that, the light of discernment (*prajñā*) arises.

  **3.6** Its application unfolds across the stages (*bhūmi*).'
commentary: 'Sūtras 3.4–3.6 articulate the architecture of saṃyama—the unified practice of dhāraṇā (focus), dhyāna (absorption),
  and samādhi (contemplation)—as a graduated path to the discriminative knowledge that liberates puruṣa from prakṛti. The
  three sūtras build a single argument: first, that these three mental disciplines fuse into one inseparable whole (3.4);
  second, that this unified practice overcomes the subtle illumination of prajñā—the discriminative faculty itself (3.5);
  and third, that this conquest unfolds not instantaneously but through successive stages of refinement (3.6). The central
  move is the recognition that liberation requires not merely the cessation of vṛtti (mental fluctuations) but the active
  mastery of the very instrument—prajñā—that ordinarily mediates between puruṣa and prakṛti. In the Sāṃkhya framework, prajñā
  is the highest function of prakṛti, the luminous discernment that allows consciousness to know itself through nature. To
  ''conquer'' prajñā (tajjayāt) means to transcend the need for this mediation: the puruṣa becomes self-luminous, requiring
  no external faculty of knowing. Yet this transcendence is not sudden. Saṃyama must be ''applied by stages'' (anukramāt),
  mirroring prakṛti''s own evolution from gross to subtle to causal. The practitioner moves through the layers of mind—from
  coarse mental objects to subtle impressions to the threshold of pure consciousness—systematically dissolving the illusion
  that puruṣa and prakṛti are entangled. Only when all three disciplines operate as a single, seamless act of consciousness
  does the mind cease to obstruct the self''s recognition of its own unconditioned nature. This is the gateway to kaivalya:
  the aloneness of puruṣa, freed from the need to know itself through the mirror of prakṛti.


  Key Terms


  **saṃyama** — The unified practice of dhāraṇā, dhyāna, and samādhi; the integrated discipline that binds consciousness to
  a single object until the distinction between knower and known dissolves.

  **prajñā** — The discriminative faculty or luminous knowing-power of prakṛti; the subtle illumination that ordinarily mediates
  between puruṣa and the world, conquered when puruṣa realizes its self-luminous nature.

  **vṛtti** — Mental modifications or fluctuations; the ripples of thought and perception that bind consciousness to prakṛti
  and obscure the puruṣa''s true nature.

  **anukramāt** — By stages or in gradual succession; the principle that spiritual realization unfolds through progressive
  refinement rather than instantaneous leap.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.35 (Arjuna''s doubt about the wavering mind; Kṛṣṇa''s response on gradual practice):** Both texts affirm
  that mastery of consciousness requires disciplined, incremental cultivation rather than sudden attainment; the Gītā''s ''abhyāsa''
  (practice) parallels Yoga Sūtra''s ''anukramāt'' (by stages). Divergence: The Gītā emphasizes devotion (bhakti) and surrender
  to Īśvara as the catalyst for steadiness, whereas Patañjali''s Yoga Sūtras locate the power of transformation in the practitioner''s
  own systematic application of saṃyama.

  **Plotinus, Enneads 5.8.1 (the ascent of the soul through successive levels of intellection to union with the One):** Both
  traditions posit a hierarchical unfolding of consciousness through stages, culminating in a non-dual realization where the
  knower transcends the need for mediation by any faculty. Divergence: Plotinus describes an ascent through emanation and
  return within a theistic framework; Patañjali''s Sāṃkhya model is dualistic (puruṣa/prakṛti), with liberation as recognition
  of separation rather than mystical union.

  **Epictetus, Enchiridion 1 (the dichotomy of control: what is ''up to us'' and what is not):** Both Epictetus and Patañjali
  identify the mind''s mastery over its own operations—not external events—as the seat of freedom; saṃyama, like Stoic prohairesis,
  is the disciplined alignment of internal faculty with reality. Divergence: Epictetus grounds freedom in rational assent
  to logos (universal reason); Patañjali grounds it in the discrimination of puruṣa from prakṛti, a metaphysical distinction
  foreign to Stoic materialism.'
insight: The sūtra asserts that Samyama is not a monolithic act but a graduated process, a claim that situates the practice
  within the broader Yoga and Sāṃkhya framework where knowledge unfolds through success
practice: Apply Samyama progressively through the bhūmis, beginning with the gross form, then the subtle, and finally the
  absolute, ensuring each stage is fully integrated before proceeding.
