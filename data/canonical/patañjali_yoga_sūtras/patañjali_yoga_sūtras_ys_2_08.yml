unit_label: Aversion to Pain
title: Aversion to Pain
unit_type: sutra
sanskrit_devanagari: दुःखानुशयी द्वेषः
sanskrit_iast: duḥkhānuśayī dveṣaḥ
translation_literal: Aversion is the imprint left by pain.
commentary: 'This sūtra appears in Patañjali''s analysis of the kleśas (afflictions), specifically addressing
  dveṣa (aversion or repulsion). The compound duḥkhānuśayī reveals the mechanism: duḥkha (suffering, pain,
  discomfort) leaves an anuśaya (residual impression, subliminal trace) that crystallizes as dveṣa—the
  reactive tendency to push away, reject, or resist.


  Unlike simple dislike, which is a momentary preference, dveṣa is rooted in *memory* of pain. When you
  burn your hand on a stove, the immediate sensation is duḥkha. But long after the burn heals, the aversion
  persists—a deep-seated flinch, a stored pattern. This is the anuśaya, the dormant seed. Every time you
  approach heat, that imprint activates as dveṣa: the compulsive turning away.


  Within Sāṃkhya metaphysics, this matters because aversion, like all kleśas, binds the puruṣa (witness-consciousness)
  to prakṛti (matter-nature). It keeps you locked in reaction rather than choice. The yogi must recognize
  that dveṣa is not truth—it is a conditioned response, a ghost of past pain. By observing it without
  identification, one can begin to loosen its grip.


  This sūtra also implies a pedagogical point: you cannot eliminate aversion by force. You must trace
  it backward to the pain-impression that seeded it, then work with that root through practice (abhyāsa)
  and dispassion (vairāgya).


  Key Terms


  **dveṣa** — Aversion, repulsion, or the reactive tendency to reject and push away; one of the five kleśas.

  **duḥkha** — Pain, suffering, discomfort, or any experience of contraction and unease.

  **anuśaya** — A residual impression, dormant trace, or subliminal imprint left by experience in the
  mind-field.'
insight: Aversion, as defined here, is not merely a passive reaction but an active, self‑sustaining state
  that fixes the mind upon suffering.
practice: 'When you notice yourself recoiling from something—a person, a task, a sensation, a memory—pause
  and place your hand on the site of the original wound (real or metaphorical). Breathe there for three
  breaths, whispering: ''This is the imprint, not the present.'' Let the aversion be seen as the ghost
  of old pain, not a command to obey.'
