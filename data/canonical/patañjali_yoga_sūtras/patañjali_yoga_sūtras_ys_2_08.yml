  body: The one who dwells upon pain is aversion.
- kind: commentary
  label: Pratibha Commentary
  body: 'Aversion, as defined here, is not merely a passive reaction but an active, self‑sustaining state
    that fixes the mind upon suffering. In the Yoga and Sāṃkhya traditions, the mind’s habitual tendencies
    (vṛtti) are the root of bondage; aversion is a particular vṛtti that perpetuates the illusion of a
    separate self. The claim that aversion *dwells* on pain underscores its self‑reinforcing nature: pain
    becomes the object, and the object becomes the subject. This mirrors the Sāṃkhya notion of *prabhāva*—the
    effect that arises from a cause—where pain (prabhāva) is the cause of aversion, and aversion, in turn,
    generates further pain. The existential application is clear: by recognizing aversion as a self‑generated
    vṛtti, one can intervene at its point of origin, thereby breaking the cycle of suffering. Dvivedi’s
    brief remark that the meaning is “plain” invites the practitioner to see the immediacy of this insight:
    the mind’s fixation on pain is itself the very pain it seeks to escape. Thus, the practice of *sādhana*
    involves observing the mind’s tendency to cling to pain and consciously redirecting attention toward
    the unconditioned witness, thereby dissolving the vṛtti of aversion.


    Key Terms


    **duḥkhānuśayī (दुःखानुशयी)** — duḥkhānuśayī (duḥkha + anusaya) → ‘dweller upon pain’; in Sāṃkhya,
    the mind’s fixation on pain is a vṛtti that perpetuates ignorance


    **dveṣaḥ (द्वेषः)** — dveṣaḥ (dvī + eṣaḥ) → ‘aversion’; in Yoga, a vṛtti that binds the soul to prakṛti
    through negative emotion


    Cross-Tradition Resonances


    **Yoga Sūtra 2.8:** Directly states that aversion dwells on pain, establishing a causal loop

    *Divergence:* Unlike later commentaries that elaborate on the mechanism, this terse statement invites
    immediate experiential verification


    **Sāṃkhya Kāṇḍa 1.3:** Describes pain as a prabhāva that generates aversion

    *Divergence:* Sāṃkhya presents pain as an effect, whereas the Sūtra presents aversion as the cause
    of pain


    **Bhaṭṭārāyaṇa, Vāgīyat 2.1:** Notes that aversion is a vṛtti that binds the mind

    *Divergence:* Bhaṭṭārāyaṇa expands on the psychological processes, whereas the Sūtra remains aphoristic'
