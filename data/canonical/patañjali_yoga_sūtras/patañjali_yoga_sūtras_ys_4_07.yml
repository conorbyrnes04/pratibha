sanskrit_devanagari: कर्माशुख़लाकृष्णं योगिनः त्रिविधं अन्येषाम्
sanskrit_iast: karmāśuklākṛṣṇaṃ yoginas trividham itareṣām
translation_literal: For the yogi, action is neither white nor black; for others, it is threefold.
commentary: 'This sūtra addresses a fundamental distinction between the karma of one established in yoga
  and the karma of ordinary beings. In Sāṃkhya-Yoga metaphysics, actions are classified by their quality
  and consequence: śukla (white/pure/sattvic) actions produce pleasant results, kṛṣṇa (black/dark/tamasic)
  actions produce painful results, and miśra (mixed/rajasic) actions produce mixed outcomes. This threefold
  division applies to those still bound by the ordinary mechanisms of cause and effect—those whose actions
  spring from desire, aversion, and ignorance.


  The yogi, however, has transcended this framework. Through sustained practice and the stabilization
  of mind (cittavṛtti-nirodhana), the yogi acts without attachment to outcome, without the ego-driven
  impulse that colors ordinary action. Such action is neither white nor black because it generates no
  binding karmic residue. It is action performed in a state of equanimity (samatva), rooted in discrimination
  (viveka) and the recognition of the unchanging Self beyond the flux of doing and consequence.


  This does not mean the yogi becomes passive or morally inert. Rather, action flows naturally from clarity
  and absence of personal investment. The yogi may act skillfully and ethically, but without the psychological
  knots that bind ordinary actors to their deeds. The distinction is one of consciousness: ordinary action
  is colored by mental modification and desire; yogic action is transparent, free from the staining force
  of ego-driven intention.


  This teaching points toward the later Bhagavad Gītā doctrine of nishkāma karma (actionless action) and
  establishes that liberation is not withdrawal from the world but transformation of one''s relationship
  to doing itself.


  Key Terms


  **śukla** — white, pure, sattvic; actions and their results characterized by clarity, harmony, and light

  **kṛṣṇa** — black, dark, tamasic; actions and their results characterized by delusion, heaviness, and
  suffering

  **yogin** — one established in yoga; a practitioner who has achieved integration of mind and stable
  discrimination'
insight: The sūtra asserts that the Yogi’s karma is beyond dualistic evaluation, while ordinary karma
  is classified into good, bad, and mixed.
practice: During one complete action today—eating a meal, having a conversation, or completing a task—release
  your grip on the outcome before you begin. Notice the moment you would normally tense toward a result
  (approval, completion, success), and instead let your hands, voice, and attention move as if the action
  itself were already complete and satisfied. Return to this release each time you feel the outcome-hunger
  return.
