unit_label: Yogi's Equanimous Action
title: Yogi's Equanimous Action
unit_type: sutra
sanskrit_devanagari: कर्माशुख़लाकृष्णं योगिनः त्रिविधं अन्येषाम्
sanskrit_iast: karmāśuklākṛṣṇaṃ yoginas trividham itareṣām
translation_literal: The Yogi’s actions are neither white nor black; the actions of others are of three kinds.
commentary: 'The sūtra asserts that the Yogi’s karma is beyond dualistic evaluation, while ordinary karma is classified into
  good, bad, and mixed. This distinction is not merely a semantic trick but a philosophical claim that the Yogi’s consciousness
  has transcended the puruṣa‑prakṛti duality that normally governs vṛtti. In the Sāṃkhya‑Yoga framework, the Yogi is a fully
  realized puruṣa, detached from prakṛti’s fluctuating vṛtti; hence his actions do not acquire the karmic quality of purity
  or impurity. The contested move here is the negation of both ‘white’ (śukla) and ‘black’ (kṛṣṇa) for the Yogi, which some
  commentators argue is a rhetorical device rather than a doctrinal statement. However, the Satchidananda commentary treats
  it as literal, suggesting that the Yogi’s actions are performed with such equanimity that they are not subject to moral
  categorization. This aligns with the idea of samādhi as a state where the mind is no longer a vṛtti‑producing instrument.
  Existentially, the sūtra invites practitioners to cultivate an attitude of impartiality, recognizing that the external world
  may label actions, but the internal witness remains uncolored. By internalizing this stance, one moves closer to kaivalya,
  where the self is no longer bound by the dualities of good and bad.


  Key Terms


  **karmā (कर्म)** — root: *karm- ‘to do’; in Sāṃkhya, action is a manifestation of prakṛti; in Patanjali, karma is the causal
  residue that binds puruṣa to the world; the term here emphasizes that even the Yogi’s actions are still actions but lack
  karmic charge.


  **śukla (शुख़ल)** — etymology: *śuk- ‘white, pure’; in Sāṃkhya, śukla denotes purity of mind; the sūtra uses it to denote
  moral goodness, but the negation for the Yogi indicates transcendence of moral purity.


  **kṛṣṇa (कृष्ण)** — root: *kṛṣ- ‘black, dark’; in Sāṃkhya, kṛṣṇa represents impurity or moral badness; its negation for
  the Yogi signals freedom from moral impurity.


  **yoginḥ (योगिनः)** — derived from *yog- ‘to unite’; in Patanjali, a yogi is one who has achieved samādhi; here it marks
  the subject whose karma is beyond duality.


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 1.1:** Both verses begin with a negation of ordinary vṛtti: 1.1 states that yoga is the cessation
  of mind‑waves, while 4.7 negates the moral categorization of the Yogi’s actions; structurally, each clause introduces a
  dualistic opposition that is then transcended.

  *Divergence:* Where 1.1 speaks of cessation of all vṛtti, 4.7 limits the transcendence to the realm of moral evaluation,
  leaving ordinary vṛtti still present in the world.


  **Patanjali, Yoga Sūtra 1.2:** Both verses use a tripartite classification of phenomena: 1.2 lists the three states of mind
  (vṛtti, nirodha, samādhi), whereas 4.7 lists the three kinds of others’ actions (good, bad, mixed); the structure mirrors
  the tripartite schema of Sāṃkhya.

  *Divergence:* 1.2’s tripartite is ontological (states of mind), while 4.7’s is epistemological (judgments about actions),
  showing a shift from internal states to external moral assessment.'
insight: The sūtra asserts that the Yogi’s karma is beyond dualistic evaluation, while ordinary karma is classified into good,
  bad, and mixed.
practice: Act with equanimity, refusing to label your deeds as good or bad, and observe how this impartial stance dissolves
  the duality of karma.
