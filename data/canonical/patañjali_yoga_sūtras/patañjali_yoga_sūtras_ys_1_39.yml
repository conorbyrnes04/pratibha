title: Meditation by Habit
unit_type: sutra
sanskrit_devanagari: यथाभिमतध्यानाद् वा
sanskrit_iast: yathābhimatadhyānād vā
translation_literal: Or, by meditation on whatever form is cherished by one's own inclination.
commentary: 'This sūtra (YS 1.39) offers a radical permission within the classical yoga system: the meditator
  may choose an object of focus according to personal affinity rather than following a prescribed form.
  The phrase yathābhimata—''according to one''s own preference''—signals that the path of dhyāna (meditative
  absorption) need not be dogmatic. This appears in the context of samādhi (unified consciousness), where
  Patañjali has just outlined various entry points: meditation on luminous inner space, on the heart of
  the wise, on the dream state, on light itself. Here he adds: or simply on what draws *you*.


  This is not license for distraction. The qualifier dhyānād—''through meditation''—means the chosen object
  must be held with genuine meditative stability, not casual preference. The yoga system recognizes that
  genuine absorption requires resonance between practitioner and focus. A form that feels alien or imposed
  will resist the settling of mind (citta). By contrast, an object aligned with one''s nature—whether
  a deity, a mantra-sound, a natural element, an abstract principle, or a quality like compassion—becomes
  a natural resting place for attention.


  Within Sāṃkhya metaphysics, this reflects the principle that consciousness (puruṣa) recognizes itself
  through the mirror of what it loves. The ''cherished'' object is not arbitrary; it often points to what
  the mind already intuitively knows. Habit (abhyāsa) and inclination (abhimata) work together: what we
  return to repeatedly becomes the groove through which samādhi flows.


  Key Terms


  **yathābhimata** — according to one''s own preference or inclination; what is cherished or naturally
  favored

  **dhyāna** — meditative absorption; sustained, unbroken attention on a chosen object

  **abhyāsa** — repeated practice; the habit or groove formed by consistent return to the same focus'
insight: The central claim of this sutra is that the essence of samādhi is not a fixed external object
  but the disciplined, self‑chosen focus of the mind.
practice: Choose one form or object that genuinely calls to you—not what you think you *should* meditate
  on, but what your attention naturally gravitates toward. This might be a visual image (a candle flame,
  a deity form, a natural landscape), a sound (a mantra, a phrase, a tone), a quality (steadiness, openness,
  compassion), or even a felt sense in the body. Sit comfortably for 10–15 minutes. Gently return your
  attention to this chosen object whenever the mind wanders. Do not strain; let the familiarity and affinity
  do the work. Notice over days or weeks whether this natural choice deepens your capacity for sustained
  attention compared to a form imposed by external instruction. The goal is not perfection but the discovery
  that meditation becomes effortless when aligned with your own nature.
