- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that the mind’s fluctuations (vṛtti) are not a monolithic phenomenon but a
    composite of five distinct types, each capable of being either painful (kliṣṭa) or not painful (akliṣṭa).
    This classification foregrounds the dual nature of mental states and invites a nuanced approach to
    their regulation. In the Yoga and Sāṃkhya traditions, vṛtti is the root obstacle to liberation; by
    recognizing its fivefold structure, one can target specific patterns—such as doubt, attachment, aversion,
    pride, and fear—rather than treating all fluctuations as a homogeneous block. The Dvivedi commentary’s
    emphasis on mastering painful vṛtti by the not‑painful ones underscores the practical strategy of
    cultivating non‑painful states (akliṣṭa) as a means of subduing the painful ones. Existentially, this
    invites practitioners to observe their mental habits, identify which of the five categories they fall
    into, and consciously shift toward the non‑painful counterpart. The sutra therefore functions as a
    diagnostic tool: it maps the terrain of the mind, delineates the pathways of suffering, and points
    to the antidote—non‑painful vṛtti—within the same framework. Such a dualistic yet integrated view
    aligns with the Sāṃkhya notion of prakṛti’s manifold manifestations and the Yoga goal of purifying
    the citta to achieve samādhi. The sutra’s brevity masks a profound methodological insight: liberation
    is attainable not by erasing all fluctuations, but by transforming the painful into the non‑painful
    through disciplined practice.


    Key Terms


    **vṛtti (वृत्ति)** — etymology: ‘to turn, to change’ -> Sāṃkhya tradition: mental modifications that
    obscure puruṣa’s true nature -> default translation ‘fluctuation’ misses the active process of change


    **kliṣṭa (क्लिष्ट)** — etymology: ‘obstructed, painful’ -> Sāṃkhya tradition: states of mind that
    bind puruṣa -> default translation ‘painful’ overlooks the binding quality


    **akliṣṭa (अक्लिष्ट)** — etymology: ‘unobstructed, not painful’ -> Sāṃkhya tradition: states that
    reveal puruṣa’s clarity -> default translation ‘not painful’ omits the revealing aspect


    Cross-Tradition Resonances


    **Yoga Sūtra 1.5:** Fivefold classification of vṛtti mirrors the fivefold nature of prakṛti in Sāṃkhya
    (five gunas, five organs, etc.)

    *Divergence:* While Sāṃkhya enumerates static qualities, the sutra focuses on dynamic mental states,
    thereby extending the static framework into a processual domain


    **Yoga Sūtra 2.1:** Both sutras employ the term vṛtti to denote mental fluctuation

    *Divergence:* 2.1 discusses vṛtti in the context of samādhi, whereas 1.5 introduces a taxonomic structure,
    indicating a shift from descriptive to prescriptive use


    **Bhaṭṭa’s Commentary on Yoga Sūtra 1.5:** Bhaṭṭa identifies the five vṛtti as doubt, attachment,
    aversion, pride, and fear

    *Divergence:* Bhaṭṭa’s list is more specific than the sutra’s abstract categories, showing a later
    exegetical elaboration'
