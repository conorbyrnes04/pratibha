sanskrit_devanagari: वृत्तयाḥ पञ्चतयः क्लिष्टाक्लिष्टाः
sanskrit_iast: vṛttayaḥ pañcatayyaḥ kliṣṭākliṣṭāḥ
translation_literal: The fluctuations of mind are fivefold, and they are either afflictive or non-afflictive.
commentary: 'This sūtra appears in Patañjali''s opening analysis of the mind''s nature (YS 1.5–1.11).
  It establishes a crucial classification: the five vṛttis (mental fluctuations or modifications) are
  not monolithic. Rather, each operates on a spectrum determined by whether it generates kleśa (affliction,
  suffering, bondage) or remains free from it.


  The five vṛttis themselves are enumerated in the next sūtra: pramāṇa (valid knowledge), viparyaya (misperception),
  vikalpa (conceptual imagination), nidrā (sleep), and smṛti (memory). Each can arise in either mode.
  A perception grounded in direct evidence (pramāṇa) may liberate understanding or, if colored by desire
  or aversion, become afflictive. Sleep may be restful or agitated. Memory may clarify or entangle.


  This distinction is foundational to yoga''s therapeutic aim. Yoga is not about eliminating the mind—that
  is impossible and unnecessary. Rather, it is about recognizing which mental movements bind us (kliṣṭa)
  and which do not (akliṣṭa), and gradually cultivating the latter while dissolving the former. The afflictive
  fluctuations are those rooted in or reinforcing the five kleśas: ignorance (avidyā), ego-sense (asmitā),
  attachment (rāga), aversion (dveṣa), and fear of death (abhiniveśa). Non-afflictive fluctuations arise
  from clarity, discrimination, and alignment with one''s true nature.


  This sūtra invites the practitioner to begin the work of discernment—viveka—which is the gateway to
  liberation.


  Key Terms


  **vṛtti** — A fluctuation, modification, or wave of the mind; any mental content or movement

  **kliṣṭa** — Afflicted, painful, or binding; a mental fluctuation that reinforces ignorance and suffering

  **akliṣṭa** — Non-afflicted, unbound, or liberating; a mental fluctuation that arises from or leads
  toward clarity and freedom'
insight: The sutra asserts that the mind’s fluctuations (vṛtti) are not a monolithic phenomenon but a
  composite of five distinct types, each capable of being either painful (kliṣṭa) or not painful (akliṣṭa).
practice: 'Throughout the day, the moment you notice a mental fluctuation arising—a thought, memory, perception,
  or emotion—pause and ask silently: *Does this bind me or free me?* Do not answer; simply hold the question
  as you exhale, letting the fluctuation continue without judgment. Repeat this inquiry each time you
  catch yourself caught.'
