sutra_range: 4.15-4.17
sanskrit_devanagari: 'वस्तुसाम्ये चित्तभेदात् तैः विभक्तः पन्थाः ॥ ४.१५ ॥


  न चैकचित्ततन्त्रं चेद् वस्तु तदप्रमाणकम् तदाऽ किम् स्यात् ॥ ४.१६ ॥


  तदुपरागापेक्षित्वाच् चित्तस्य वस्तु ज्नाताज्ञातम् ॥ ४.१७ ॥'
sanskrit_iast: 'vastusāmye cittabhedāt tayor vibhaktaḥ panthāḥ || 4.15 ||


  na caikacittatantraṃ ced vastu tadapramāṇakaṃ tadā kiṃ syāt || 4.16 ||


  taduparāgāpekṣitvāc cittasya vastu jñātājñātam || 4.17 ||'
translation_literal: '**4.15** Because the mind’s differences divide the same object, the paths are separated.

  **4.16** An object’s existence is not dependent on a single mind; if it were, what would become of that object when that
  mind no longer perceives it?

  **4.17** That object is known or unknown depending on the mind’s conditioning.'
commentary: 'These three sūtras form a single argument about the ontological and epistemological status of objects in relation
  to mind. Patañjali moves from the observation that mind introduces differentiation (4.15), through the claim that objects
  exist independently of any single consciousness (4.16), to the paradoxical conclusion that an object''s knowability is entirely
  determined by the mind''s conditioning (4.17). The logic is not contradictory but dialectical: prakṛti (including both objects
  and the mind that perceives them) operates according to its own nature, independent of any individual puruṣa; yet the mind''s
  vṛtti—its modifications shaped by saṃskāra and the guṇas—entirely determines what appears as known or unknown to that particular
  consciousness. The contested move lies in holding both truths simultaneously. On one hand, 4.16 rejects subjective idealism:
  the object does not vanish when unperceived by me, nor does my mind create its existence. This protects the reality of prakṛti
  and guards against the egoic delusion that consciousness is the measure of being. On the other hand, 4.17 affirms that knowledge
  itself is not a passive mirroring but a function of the mind''s upādhis (conditioning factors). The same object remains
  ontologically independent, yet epistemologically it exists only as known or unknown relative to a given citta''s state.
  This distinction is crucial for kaivalya: liberation does not require the world to disappear or consciousness to merge with
  an undifferentiated absolute. Rather, it requires the puruṣa to recognize itself as eternally distinct from prakṛti''s play—including
  the mind''s endless coloring and dividing of objects. The practitioner thus learns to see objects as they are (neither created
  by mind nor dependent on mind for their being), while simultaneously recognizing that their appearance in consciousness
  is wholly determined by mental conditioning. This insight dissolves both the illusion of control (the mind cannot make or
  unmake reality) and the illusion of passivity (the mind entirely shapes what is knowable to it). Samādhi becomes the state
  in which this double truth is realized without contradiction.


  Key Terms


  **vṛtti** — mental modification or fluctuation; the movements of citta that both obscure and selectively reveal objects

  **prakṛti** — primordial nature or materiality; the independent, self-operating ground of all phenomena including mind and
  objects

  **upādhi** — conditioning factor or limiting adjunct; the coloring or modification imposed by the mind''s state on the appearance
  of objects

  **kaivalya** — isolation or aloneness; the liberation in which puruṣa recognizes its eternal distinction from prakṛti''s
  modifications


  Cross-Tradition Resonances


  **Advaita Vedānta (Śaṅkara, Brahma Sūtra Bhāṣya 2.2.28-32):** Both traditions distinguish between the independent reality
  of brahman/prakṛti and the mind''s role in determining appearance. Śaṅkara similarly argues that ignorance (avidyā) colors
  perception without affecting the object''s intrinsic nature. Divergence: Advaita ultimately collapses the distinction between
  knower and known into non-dual brahman; Yoga-Sāṃkhya maintains puruṣa and prakṛti as eternally separate, with the mind belonging
  to prakṛti, not puruṣa.

  **Kant, Critique of Pure Reason (Transcendental Idealism):** Both Patañjali and Kant argue that objects as they appear to
  consciousness are shaped by the mind''s structure (categories/vṛtti), yet both affirm that objects possess an independent
  reality beyond that appearance. Divergence: Kant''s thing-in-itself remains forever unknowable; Patañjali''s prakṛti, though
  independent of any single mind, is knowable through samādhi and the cultivation of sattva-dominant vṛtti.

  **Dhammapada 1-2 (Buddha on mind as the source of experience):** Both traditions emphasize that the mind''s conditioning
  determines the character of experience and that liberation requires transformation of mental patterns rather than external
  change. Divergence: Buddhism denies a permanent puruṣa or self; Yoga affirms puruṣa as the eternal witness distinct from
  all mental conditioning, making the goal not the cessation of self but its recognition as untouched by prakṛti.'
insight: The central claim of this sutra is that the multiplicity of experience arises not from the object itself but from
  the mind’s tendency to differentiate.
practice: Observe the present moment, noting how your thoughts split the same experience into separate categories, and gently
  return your attention to the undivided awareness of the moment.
