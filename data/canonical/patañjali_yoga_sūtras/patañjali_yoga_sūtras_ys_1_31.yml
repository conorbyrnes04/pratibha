sanskrit_devanagari: दुःखदौर्मणस्याङगेजयत्वश्वासप्रश्वासाविक्षेपसहभुवः
sanskrit_iast: duḥkhadaurmanasyāṅgamejayatvaśvāsapraśvāsā vikṣepasahabhuvaḥ
translation_literal: Pain, dejection, trembling of the limbs, irregular breathing—these are companions
  that arise together with distraction of the mind.
commentary: 'This sūtra from Patañjali''s second chapter identifies the somatic and mental signatures
  of *vikṣepa* (mental scattering or distraction), one of the nine obstacles to yoga practice. Rather
  than treating these as separate problems, Patañjali presents them as a unified syndrome—a constellation
  of symptoms that appear together.


  The verse lists five markers: *duḥkha* (pain or suffering), *daurmanasya* (despondency or low mood),
  *aṅgamejayatva* (trembling or instability in the body), and *śvāsa-praśvāsa* (irregular or labored breathing—both
  inhalation and exhalation disrupted). All five are *sahabhuvāḥ*—co-arising, mutually supporting, inseparable.


  This is crucial for understanding the Yoga Sūtras'' framework: the mind and body are not separate domains.
  Distraction is not merely a mental phenomenon; it manifests as physical agitation, emotional turbulence,
  and respiratory dysregulation. A practitioner who notices trembling limbs, shallow or erratic breath,
  or creeping despair is receiving clear feedback that the mind has fragmented into *vikṣepa*.


  Within classical Sāṃkhya-Yoga metaphysics, this makes sense: *citta* (the mind-stuff) and the body are
  both modifications of *prakṛti* (nature). Disturbance in one layer ripples through all. The remedy,
  therefore, is not to suppress symptoms but to recognize them as signals and return to a practice that
  steadies both breath and attention—typically through *prāṇāyāma* (breath regulation) and *dhāraṇā* (concentration).


  The sūtra''s genius lies in its diagnostic clarity: if you are experiencing this cluster, you are in
  *vikṣepa*. The path forward is systematic re-integration through breath work and focused attention.


  Key Terms


  **vikṣepa** — Scattering or distraction of the mind; one of the nine obstacles to yoga practice, characterized
  by inability to maintain focus

  **citta** — Mind-stuff or consciousness-field; the subtle substance of mental activity that yoga aims
  to stabilize

  **prāṇāyāma** — Regulation and extension of breath; a foundational practice that directly steadies both
  mind and nervous system'
insight: The passage asserts that the very sensations of pain, despair, nervousness, and the irregularities
  of breathing—both inhalation and exhalation—serve as external markers of a mind that has slipped from
practice: '**The Stabilizing Breath Anchor (5–10 minutes daily)**


  1. Sit upright in a comfortable position. Notice without judgment: Are you experiencing any trembling,
  shallow breathing, or low mood right now?


  2. Place one hand on your heart, one on your belly. Breathe naturally for three cycles, simply observing
  the quality of your breath. Is it smooth or jagged? Deep or shallow?


  3. Now begin *Ujjāyī* breathing (ocean breath): Inhale through the nose for a count of 4, slightly constricting
  the throat so you hear a soft ocean-like sound. Exhale for a count of 4 with the same gentle constriction.
  Continue for 10 rounds.


  4. After 10 rounds, return to natural breathing and notice: Has the trembling lessened? Is your mood
  slightly lighter? Has your breath become more even?


  5. If you notice the mind wandering into worry or distraction, gently return attention to the sound
  and sensation of the breath. Do not force; simply return.


  This practice directly addresses the five symptoms: steady breath calms the nervous system (reducing
  trembling and pain), rhythmic breathing elevates mood naturally, and the focus required in breath awareness
  interrupts the scattering of *vikṣepa*. Over time, this becomes your early-warning system: when you
  feel the cluster returning, you know to return to the breath.'
