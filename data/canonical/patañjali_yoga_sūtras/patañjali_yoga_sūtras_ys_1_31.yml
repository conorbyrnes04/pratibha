  items:
  - term: duḥkha (दुःख)
    definition: 'dus + kha ‘bad axle-hole’ → suffering/friction -> in “Obstacles in Breath and Mind”: Pain, despair, nervousness,
      inspiration, and expiration accompany the causes of distraction. -> not only acute pain; the structural unsatisfactoriness
      yogins see even in pleasure’s change'
  - term: aṅga (अङ्ग)
    definition: '‘limb/accessory’ of the eightfold path -> in “Obstacles in Breath and Mind”: Pain, despair, nervousness,
      inspiration, and expiration accompany the causes of distraction. -> not body-part list for its own sake; interdependent
      accessories culminating in samādhi'
  - term: atha (अथ)
    definition: 'atha ‘now’ — auspicious commencement particle -> in “Obstacles in Breath and Mind”: Pain, despair, nervousness,
      inspiration, and expiration accompany the causes of distraction. -> not filler ‘now then’; marks readiness and the opening
      of authorized instruction'
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Obstacles in Breath and Mind”: the
      term’s; stakes the argument of: Pain, despair, nervousness, inspiration, and expiration accompany the causes of distraction.
      -> not ‘brain software’ or an enemy to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Obstacles in Breath and Mind”: the term’s common rendering
      as ‘thought’ neglects its broader phenomenological scope -> not ‘bad thoughts’ only — any cognitive wave (valid cognition,
      error, fantasy, sleep, memory)'
