title: Mind‑Stuff as Object
unit_type: sutra
sanskrit_devanagari: न तः स्वभावं दर्शयत्वात्
sanskrit_iast: na tat svābhāsaṃ dṛśyatvāt
translation_literal: The mind-stuff is not self-luminous, because it is an object of perception.
commentary: 'This sūtra establishes a fundamental distinction in Yoga–Sāṃkhya metaphysics: mind-stuff
  (citta) cannot be self-aware or self-illuminating in its own right, precisely because it functions as
  an object—something perceived, known, or witnessed. The logic is direct: whatever is perceived must
  be perceived *by* something else. If citta were self-luminous (svābhāsa), it would need no external
  witness; but since it appears as an object within consciousness, it must be dependent on a perceiver
  beyond itself. That perceiver is puruṣa (the witnessing self), which alone is truly self-luminous and
  independent. This verse resolves a critical philosophical problem: how can mind-stuff—the instrument
  of knowledge—itself be known? The answer: it cannot know itself; it can only be known by the unchanging
  subject, puruṣa. This distinction justifies the entire yogic project: liberation comes not through perfecting
  the mind, but through recognizing oneself as the witness *prior to* mind-stuff. The mind-stuff is brilliant
  and complex, but it is still an object, still dependent, still not the ultimate knower.


  Key Terms


  **citta** — mind-stuff; the subtle substance of mental activity, including intellect, ego, and memory;
  the instrument of knowing, not the knower itself

  **dṛśyatva** — the quality of being an object of perception; objecthood; the condition of being seen
  or known by another

  **puruṣa** — the witnessing self; the unchanging conscious subject that illuminates all objects but
  is never itself an object'
insight: The sūtra asserts that the mind‑stuff (citta) is not the subject of its own perception; it is
  merely an object that the Purusha perceives.
practice: 'Throughout this day, each time you catch yourself believing you understand something—a person''s
  motive, a situation''s meaning, your own feeling—pause and notice: you are *perceiving* that understanding
  as an object in awareness, not inhabiting it as the witness itself. Whisper inwardly, ''I am witnessing
  this knowing, not being it,'' and return to the simple fact of perceiving, without claiming to illuminate
  what you see.'
