sanskrit_devanagari: जैत्यन्तरपरिणामः प्रकृतिपूरात्
sanskrit_iast: jātyantarapariṇāmaḥ prakṛtyāpūrāt
translation_literal: The transformation into a different class of being occurs through the filling-up
  of nature's potential.
commentary: 'This sūtra addresses a profound yogic possibility: the transmutation of one''s essential
  nature or embodied form into another category of existence. The phrase jātyantarapariṇāmaḥ (transformation
  into another birth-class or species) describes not metaphorical change but actual ontological shift—the
  kind of siddhi or perfected capacity that classical yoga posits as possible through mastery of prakṛti
  (nature, matter, the field of manifestation).


  The mechanism is prakṛtyāpūrāt: through the complete saturation, fulfillment, or exhaustion of prakṛti''s
  latent potentials (āpūra = filling, completing). In Sāṃkhya metaphysics, prakṛti contains infinite dormant
  capacities (śaktis). When a yogi''s consciousness (puruṣa) ceases to identify with ordinary modifications
  of matter and instead consciously directs the flow of prakṛti''s inherent powers, the body and its class-nature
  can be remolded.


  This is not magic but precision: just as a potter reshapes clay by understanding its nature, the advanced
  practitioner reshapes their own manifestation by understanding and redirecting the fundamental forces
  (guṇas, tattvas) that compose it. The prerequisite is samādhi and the mastery of mental transformation
  (cittavṛttis) taught in earlier chapters.


  In the Yoga Sūtras'' framework, this sits among the highest siddhis—capacities that arise naturally
  when ignorance (avidyā) is dissolved and the yogi''s will aligns with the grain of prakṛti itself, rather
  than resisting it.


  Key Terms


  **jātyantara** — another class, species, or category of birth; a different order of embodied existence

  **prakṛti** — nature; the field of manifestation; matter and its infinite potentials in Sāṃkhya metaphysics

  **āpūra** — filling, saturation, or complete actualization of latent capacity'
insight: The core claim of this aphorism is that the very dynamism that characterises the world—its continual
  birth, death, and rebirth—is itself a manifestation of prakṛti’s inexorable flow.
practice: Throughout this day, each time you notice a fixed habit of body or mind—a familiar ache, a repeated
  thought, a default gesture—pause and whisper "filling-up" on your exhale, then deliberately move or
  respond in a way that contradicts that pattern. Let prakṛti's latent potential reshape this moment's
  possibility through your conscious refusal of what feels inevitable.
