title: Transformation of Nature
unit_type: sutra
sanskrit_devanagari: जैत्यन्तरपरिणामः प्रकृतिपूरात्
sanskrit_iast: jātyantarapariṇāmaḥ prakṛtyāpūrāt
translation_literal: The change of one species into another arises from the overflow of nature.
commentary: 'The core claim of this aphorism is that the very dynamism that characterises the world—its continual birth, death,
  and rebirth—is itself a manifestation of prakṛti’s inexorable flow. In the Yoga and Sāṃkhya traditions, prakṛti is the primal,
  unmanifested material reality that, through its own internal drives, gives rise to the multiplicity of species (jāti). The
  phrase “antara‑pariṇāmaḥ” stresses that this transformation is not a simple succession but a change into a distinctly different
  class, underscoring the non‑static, ever‑shifting character of material existence. The suffix “‑āpūrāt” (from overflow)
  evokes the idea that prakṛti’s influence is not merely a passive background but an active, overflowing force that permeates
  all beings. This resonates with the Sāṃkhya notion that prakṛti is a self‑sustaining, self‑generating system whose internal
  oscillations produce the cosmic cycle. The implication for the practitioner is that by recognising the fluidity of prakṛti,
  one can cultivate a detached awareness that does not cling to any particular species or state. This detachment, in turn,
  paves the way for samādhi, where the mind rests in its true nature, untouched by the vicissitudes of prakṛti’s overflow.
  Thus, the aphorism invites us to observe the continual transformation of the world as a reminder of the impermanent, ever‑changing
  nature of our own mental states, encouraging a practice of steady, non‑identification with the flux of experience.


  Key Terms


  **jāti (जाती)** — etymology: ‘born’ → Sāṃkhya: class of beings determined by birth; default translation ‘species’ misses
  the ontological weight of birth‑determined identity


  **antara (अन्तर)** — etymology: ‘between’ → Sāṃkhya: denotes a distinct, separate class; translation ‘other’ loses sense
  of categorical difference


  **pariṇāma (परिणाम)** — etymology: ‘to flow’ → Sāṃkhya: transformation as a result of prakṛti’s internal drive; translation
  ‘change’ omits causal flow


  **prakṛti (प्रकृति)** — etymology: ‘nature’ → Sāṃkhya: primordial material reality; default ‘nature’ ignores its self‑generating,
  dynamic character


  **āpūrāt (आपूरात्)** — etymology: ‘from overflow’ → Sāṃkhya: overflow of prakṛti’s influence; translation ‘from’ misses
  the idea of active, unbounded influx


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 2.1:** Both passages posit that prakṛti’s internal drive produces the multiplicity of species (jāti)
  and that this drive is continuous, akin to the ‘overflow’ metaphor.

  *Divergence:* While Patanjali speaks of the ‘flow’ of prakṛti as a general principle, YS 4.2 specifies the overflow as the
  source of inter‑species transformation, adding a causal nuance absent in 2.1


  **Sāṃkhya Kāṇḍa 1:** The concept of prakṛti’s self‑generating overflow mirrors the Sāṃkhya assertion that prakṛti’s inherent
  energy (śakti) perpetually creates new forms.

  *Divergence:* Sāṃkhya treats this overflow as an internal, self‑contained process, whereas YS 4.2 frames it as an external
  influx, suggesting a more dynamic interaction with the world


  **Bādarāyana, Yoga Vāsiṣṭha 4.2:** Both texts link the transformation of species to the overflow of nature, implying a causal
  chain from prakṛti to jātis.

  *Divergence:* Yoga Vāsiṣṭha emphasizes the role of the individual’s karma in triggering overflow, whereas YS 4.2 presents
  the overflow as an inherent, unavoidable aspect of prakṛti'
insight: The core claim of this aphorism is that the very dynamism that characterises the world—its continual birth, death,
  and rebirth—is itself a manifestation of prakṛti’s inexorable flow.
practice: Observe the subtle shifts in your thoughts and sensations as they transform from one state to another, noting how
  each change feels like an overflow of a deeper, underlying reality.
