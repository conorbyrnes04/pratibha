sanskrit_devanagari: तदर्थं एव दर्श्यस्यात्मा
sanskrit_iast: tadartha eva dṛśyasyātmā
translation_literal: The nature of what is seen exists solely for the sake of that—for the purpose of
  the seer.
commentary: 'This sūtra (2.21 in the standard Yoga Sūtra sequence) establishes a fundamental metaphysical
  principle within Sāṃkhya-Yoga: the entire manifest world (dṛśya) has no independent purpose or being
  of its own. Its sole function is to serve the seer (draṣṭṛ), the witnessing consciousness (puruṣa).
  This is not a statement about human intention or design, but about the nature of prakṛti (matter, manifestation)
  itself—it is inherently instrumental, a field of experience created for consciousness to know itself
  through experience and eventual liberation.


  The word ''ātmā'' here means ''essence'' or ''nature''—what something fundamentally is. The sūtra asserts
  that the essential nature of the visible world is purposiveness directed toward the witness. This dissolves
  any notion that the world exists for its own sake, or that matter is self-sufficient. It also implies
  that once the seer recognizes this truth—that all experience, all sensation, all mental content is arising
  for its own recognition—the binding power of the world begins to dissolve.


  This is not nihilism; it is clarification of relationship. The world is real as an instrument of experience,
  but not ultimate or independent. Understanding this distinction is central to moving from entanglement
  (saṃsāra) toward freedom (kaivalya).


  Key Terms


  **dṛśya** — The seen, the visible, the manifest world of objects and experiences; everything that can
  be perceived

  **draṣṭṛ (implied)** — The seer, the witness; puruṣa or consciousness itself, which observes without
  being changed

  **ātmā** — Essential nature, intrinsic being; here meaning the fundamental character or purpose of something'
insight: The sūtra asserts that the very essence of perception—its being—exists for the seer.
practice: 'Reverse your gaze inward at the moment you reach for something—a cup, a door handle, a phone.
  Before touching it, whisper: ''This exists to be known by me.'' Feel how that object becomes transparent,
  a messenger rather than a thing, and notice what shifts in your hand, your breath, your sense of why
  you wanted it at all.'
