sanskrit_devanagari: ततः प्रत्यक्ष‑चेतना‑अधिगमः अपि अन्तराय‑भावः च
sanskrit_iast: tataḥ pratyakcetanādhigamo 'py antarāyābhāvaś ca
translation_literal: From that, there arises both the direct knowing of consciousness itself and the absence
  of obstacles.
commentary: 'This sūtra appears in the context of samādhi and the refinement of meditative absorption.
  Patañjali is describing what becomes available once the practitioner has stabilized in a particular
  state of practice—likely referring to the preceding discussion of fixed attention (dhāraṇā) or absorption
  (dhyāna).


  The phrase pratyakcetanādhigama means ''direct apprehension of consciousness''—not intellectual knowledge
  about consciousness, but immediate, non-dual awareness of the knowing principle itself. This is distinct
  from ordinary perception (pratyakṣa) of objects; here, consciousness recognizes its own nature without
  the mediation of thought or sense impression.


  Antarāyābhāva—''the state of being free from obstacles''—refers to the removal of the nine obstacles
  (antarāya) listed earlier in the Yoga Sūtras: disease, dullness, doubt, carelessness, laziness, sensory
  indulgence, false perception, failure to stabilize, and regression. When the mind settles into genuine
  meditative absorption, these obstructions naturally fall away; they cannot coexist with authentic samādhi.


  The ''and'' (ca) is crucial: these two fruits arise together. The direct knowing of consciousness and
  the dissolution of obstacles are not separate achievements but two aspects of the same maturation. As
  the veil of mental turbulence clears, consciousness recognizes itself. As consciousness recognizes itself,
  the conditions that obscure it dissolve.


  Within the Yoga–Sāṃkhya framework, this reflects the progressive disentanglement of Puruṣa (the witnessing
  consciousness) from Prakṛti (the manifest field of mind and matter). The obstacles are all modifications
  of Prakṛti; their absence reveals the luminous, untouched nature of Puruṣa.


  Key Terms


  **pratyakcetanādhigama** — Direct, immediate apprehension of consciousness itself, not mediated by thought
  or sense perception

  **antarāya** — Obstacles to meditative practice: disease, dullness, doubt, carelessness, laziness, sensory
  indulgence, false perception, failure to stabilize, and regression

  **samādhi** — Meditative absorption; the state in which the mind, object, and knowing merge into unified
  awareness'
insight: The sutra asserts that the practice of Japa, when properly directed, culminates in the direct
  cognition of the subjective self (purum) and simultaneously eliminates all obstacles.
practice: 'Pause mid-activity and ask: ''What is aware right now?'' Not the thought that answers, but
  the knowing itself—hold your attention on that gap between question and response until the questioner
  and questioned dissolve into one awareness. When obstacles arise (doubt, restlessness, distraction),
  notice them as ripples on the surface while the depths remain untouched.'
