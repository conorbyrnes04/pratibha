  body: Hence the attainment of cognition of the subjective and the absence of obstacles arise.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that the practice of Japa, when properly directed, culminates in the direct
    cognition of the subjective self (purum) and simultaneously eliminates all obstacles. This claim situates
    the sūtra squarely within the Sāṃkhya‑Yoga synthesis: the Japa is a meditative technique that turns
    the mind inward, thereby suspending the external flow of the senses and allowing the pratyaksha (direct)
    awareness of purum to surface. The term *antarāyā*—traditionally understood as the “inner obstacles”
    that hinder the mind’s focus—here is rendered as *absence of obstacles*, underscoring the transformative
    potential of Japa to dissolve the very conditions that keep the mind from perceiving *purum*. Dvivedi’s
    commentary emphasizes that the *cognition of the subjective* is not a mere intellectual insight but
    an experiential realization that the *purum* is inseparable from *prakṛti*. In practical terms, this
    sutra invites the practitioner to recognize that the obstacles are not external objects but internal
    tendencies of the mind to wander. By repeatedly focusing on the name of *Ishvara* (or any chosen mantra),
    the practitioner trains the mind to remain fixed, thereby rendering the *antarāyā* inert. The existential
    implication is profound: once the obstacles are absent, the mind no longer projects onto the external
    world, and the *purum* becomes the sole locus of experience. This realization is the gateway to *samādhi*,
    the ultimate goal of Yoga, where the practitioner experiences unity with the *purum* and the *purur*.*


    Key Terms


    **purum (पुर्म)** — purum (IAST) -> पुम् (Devanagari) -> ‘pure consciousness’; in Sāṃkhya, the intelligential
    principle; the translation ‘subjective’ misses its ontological status as the non‑material, ever‑present
    witness.


    **antarāyā (अन्तरायः)** — antarāyā (IAST) -> अन्तरायः (Devanagari) -> ‘inner obstacles’; traditionally
    obstacles to samādhi, but here rendered as their *absence*, highlighting the transformative goal of
    the practice.


    **cognition (चेतना)** — cetanā (IAST) -> चेतना (Devanagari) -> ‘direct awareness’; in this sutra it
    denotes the experiential realization of purum, not mere intellectual knowledge.


    Cross-Tradition Resonances


    **Yoga Sūtra 1.29:** Structural homology: the sutra pairs a result (cognition) with its enabling condition
    (absence of obstacles) in a single clause, mirroring the earlier sutra 1.28 where Japa is linked to
    the attainment of samādhi.

    *Divergence:* Unlike 1.28, where the focus is on the ultimate goal (samādhi), 1.29 emphasizes the
    intermediate state (cognition) and the removal of obstacles, suggesting a layered progression rather
    than a single endpoint.


    **Bhāṣya of Dvivedi, 1.29:** Dvivedi’s commentary parallels the sutra’s claim by equating *cognition
    of the subjective* with *purum*, reinforcing the idea that the mind’s inward turn reveals the pure
    consciousness.

    *Divergence:* Dvivedi expands the sutra by explicitly linking the practice to the cessation of external
    sensory flow, whereas the sutra itself remains concise, leaving the mechanistic details to commentary.'
