sanskrit_devanagari: तस्य वाचकः प्राणवः
sanskrit_iast: tasya vācakaḥ praṇavaḥ
translation_literal: The syllable OM is the indicator of that [supreme reality].
commentary: 'This sūtra (I.27) establishes OM (praṇava) as the sonic emblem or name-bearer of Īśvara,
  the supreme conscious principle that Patañjali introduced in the preceding aphorism. The term vācaka
  means ''that which points to'' or ''designates''—OM does not contain or exhaust the infinite, but serves
  as its acoustic symbol and gateway.


  Within the Yoga–Sāṃkhya framework, sound (śabda) is recognized as a direct means of knowledge (pramāṇa).
  OM is not merely a word; it is the primordial vibration (nāda) closest to undifferentiated consciousness.
  By meditating on OM, the practitioner aligns the mind with the frequency of pure awareness itself. This
  is why Patañjali recommends japa (repetition) and abhyāsa (sustained practice) with OM as the vehicle.


  The sūtra does not claim OM creates or contains Īśvara, but rather that it is the most direct sonic
  pointer available to human perception. Through OM, the infinite becomes accessible to the finite mind—not
  through intellectual understanding, but through resonance and absorption (samādhi).


  Key Terms


  **praṇava** — The sacred syllable OM; the primordial sound-symbol representing the infinite and serving
  as the sonic gateway to Īśvara.

  **vācaka** — That which designates, points to, or indicates; a signifier or name-bearer.

  **Īśvara** — The supreme conscious principle, untouched by suffering or karma; the eternal witness and
  object of devotion in classical yoga.'
insight: The central claim of this brief aphorism is that the very essence of all spiritual practice is
  encapsulated in a single utterance—OM.
practice: 'Sit upright in a comfortable posture. Close your eyes. Inhale slowly through the nose for a
  count of four. On the exhale, vocalize OM as a continuous sound: begin with ''AH'' (ā), transition to
  ''OOH'' (u), and conclude with ''MMM'' (m), allowing the vibration to resonate in the head and chest
  for the full length of the breath. The ''M'' should hum until the breath is spent. Repeat for 5–10 minutes
  without strain. Notice where the vibration is felt most vividly—often the forehead, heart, or crown.
  Do not chase any experience; simply allow the sound to carry attention inward. Practice once daily,
  preferably in the early morning.'
