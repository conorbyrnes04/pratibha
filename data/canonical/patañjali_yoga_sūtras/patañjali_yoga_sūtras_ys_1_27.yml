unit_label: Indicator of the Word
title: Indicator of the Word
unit_type: sutra
sanskrit_devanagari: तस्य वाचकः प्राणवः
sanskrit_iast: tasya vācakaḥ praṇavaḥ
translation_literal: His indicator is the word of glory.
commentary: 'The central claim of this brief aphorism is that the very essence of all spiritual practice is encapsulated in
  a single utterance—OM. By designating OM as the "indicator," the Yoga Sūtra asserts that the path to liberation is not a
  series of external actions but an inward attunement to the primordial sound that animates reality. This move—identifying
  a phonetic symbol as the locus of all experience—has been contested by some commentators who argue that the Sūtra merely
  points to a mnemonic device rather than a metaphysical reality. However, within the Sāṃkhya‑Yoga framework, the sound is
  not a mere mnemonic; it is the dynamic principle (prāṇa) that bridges the inert prakṛti and the active puruṣa. The Sūtra’s
  brevity invites the practitioner to experience OM as a living witness (īśvara) that both sustains and transcends the mind’s
  fluctuations (vṛtti). In practice, this means that the practitioner should not merely recite OM, but should feel its resonance
  as the very vibration of the self, thereby dissolving the distinction between the speaker and the spoken. The Dvivedi commentary’s
  emphasis on OM as the "secret of secrets" dovetails with the Mandukya Upanishad’s depiction of the syllable as the gateway
  to the three states of consciousness, reinforcing the idea that the word itself is a map of the psyche. Thus, the Sūtra
  invites an existential application: by aligning one’s breath and awareness with OM, one aligns the individual self with
  the universal sound, thereby achieving samādhi.


  Key Terms


  **vācaka (वाचकः)** — etymology: ‘indicator, speaker’ -> Sāṃkhya tradition: the element that signifies the presence of puruṣa
  within prakṛti -> the translation ‘indicator’ misses the idea that it is the very medium through which puruṣa is made manifest
  in the world


  **praṇava (प्राणवः)** — etymology: ‘source of breath, sound’ -> in Yoga tradition: the sacred syllable OM, the primal vibration
  of the universe -> the term ‘word of glory’ in translation obscures its role as the dynamic principle that unites mind,
  body, and cosmos


  Cross-Tradition Resonances


  **Mandukya Upanishad, 1.1:** Both texts treat OM as the ultimate reality, with the Upanishad describing its three states
  (AUM, A, U, M) and the Sūtra condensing this into the notion of an indicator.

  *Divergence:* The Upanishad elaborates on the experiential states, whereas the Sūtra presents a single, functional designation,
  thereby streamlining the concept for practical application


  **Bhagavad Gita, 4.34:** Both texts link the sound to the divine principle that permeates creation.

  *Divergence:* The Gita frames the sound as a means of worship and knowledge, while the Sūtra presents it as the very instrument
  of liberation, emphasizing its role as a marker rather than a tool


  **Yoga Vasistha, 1.2:** Both treat OM as the bridge between the finite mind and the infinite self.

  *Divergence:* The Vasistha expands into narrative allegory, whereas the Sūtra remains aphoristic, focusing solely on the
  ontological function'
insight: The central claim of this brief aphorism is that the very essence of all spiritual practice is encapsulated in a
  single utterance—OM.
practice: Recite the syllable OM with mindful awareness of its glory, letting each breath resonate with its vibration.
