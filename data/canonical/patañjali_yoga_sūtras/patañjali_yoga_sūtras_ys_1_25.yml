title: Omniscience as Ultimate Seed
unit_type: sutra
sanskrit_devanagari: तत्र निरितिशायम् सर्वज्ञबीजम्
sanskrit_iast: tatra niratiśayaṃ sarvajñabījam
translation_literal: In that state, there exists an unsurpassable seed of omniscience.
commentary: 'This sūtra appears in the context of samādhi and the progressive refinement of consciousness toward liberation.
  The word tatra (in that state) refers to the highest forms of meditative absorption—specifically, the state beyond even
  the finest seed-form of mental modification (bīja-vasanā). Niratiśayam means without comparison, supreme, unexcelled. Sarvajña-bījam
  is the seed or root-potential of all-knowing.


  Patañjali is not claiming that the yogi becomes omniscient in the sense of knowing all facts. Rather, he points to a fundamental
  shift in consciousness: when the mind settles into its purest, most undifferentiated form—what Sāṃkhya calls the threshold
  between prakṛti and puruṣa—a latent capacity emerges. This is the seed-potential (bīja) of knowing without the usual subject-object
  split. It is unsurpassable because it is prior to the fragmentation of consciousness into knower, knowing, and known.


  In the Yoga-Sāṃkhya framework, this represents the dissolution of all vṛtti (mental modifications) into their causal matrix.
  The yogi does not gain encyclopedic knowledge; rather, consciousness recognizes its own nature as the ground of all knowing.
  This is why it is called a bīja—a seed, not the full tree. It is potential, not actualized omniscience, yet it is the irreducible
  source from which all authentic knowing springs.


  This state is beyond the reach of ordinary intellect (buddhi) and is accessible only through the sustained stability of
  samādhi. It marks the threshold of kaivalya, where the puruṣa (witnessing consciousness) stands apart from all modifications
  of prakṛti.


  Key Terms


  **bīja** — Seed; the causal potential or latent form of something; here, the unmanifest root of omniscient knowing.

  **niratiśaya** — Without comparison, unsurpassable, supreme; beyond all measure or limitation.

  **sarvajña** — All-knowing; in Yoga, not encyclopedic knowledge but the non-dual knowing inherent in pure consciousness
  (puruṣa).'
insight: The passage asserts that in the supreme reality the seed of omniscience is fully realized.
practice: In the moment just before thought arises—in that hairline gap between breath and impulse—hold your gaze inward without
  grasping. Let the seed remain unsprouted, the knowing unborn. Return to that threshold ten times today, each time releasing
  the urge to name what you find there.
