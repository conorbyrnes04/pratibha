  items:
  - term: bīja (बीज)
    definition: '‘seed’ — latent causal potency -> in “Omniscience as Ultimate Seed”: here, the unmanifest root of omniscient
      knowing -> not metaphor for ‘potential’ vaguely; technical seed of kleśa/karma/object in absorption theory'
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Omniscience as Ultimate Seed”: the
      term here implies the full spectrum of mental states, not just consciousness -> not ‘brain software’ or an enemy to
      smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Omniscience as Ultimate Seed”: the sūtra’s reference
      to the seed of omniscience implies a vṛtti that has reached its ultimate limit -> not ‘bad thoughts’ only — any cognitive
      wave (valid cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Omniscience as Ultimate Seed”: here it is the
      locus where the seed of omniscience is fixed -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s
      display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Omniscience as Ultimate Seed”: the sūtra contrasts
      the fixed seed in purusha with the mutable prakṛti -> not pastoral ‘Nature’; the tri-guṇa matrix generating all experience
      including mind'
