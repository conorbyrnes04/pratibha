sanskrit_devanagari: 'निर्माणचित्तां अस्मिता मात्रात् ॥ ४.४ ॥


  प्रवृत्तिभेदे प्रयोजकं चित्तं एकम् अनकेषाम् ॥ ४.५ ॥


  तत्र ध्यायनजम् अनाशयम् ॥ ४.६ ॥'
sanskrit_iast: 'nirmāṇacittāny asmitāmātrāt || 4.4 ||


  pravṛttibhede prayojakaṃ cittam ekam anekeṣām || 4.5 ||


  tatra dhyānajam anāśayam || 4.6 ||'
translation_literal: '**4.4** The minds created [by practice] arise from I-am-ness alone (nirmāṇacitta, asmitāmātra).

  **4.5** Among the many [created minds] differing in their activities, one mind (citta) is the mover—the singular agent (prayojaka).

  **4.6** Of these, the mind born of meditation (dhyānaja) leaves no residue (anāśaya).'
commentary: 'These three sūtras trace a single arc: from the ego-sense as the root generator of multiplicity (4.4), through
  the unified mind''s capacity to direct those functions (4.5), to the meditation-born mind that transcends karmic conditioning
  altogether (4.6). The movement is not merely psychological but ontological, reframing the relationship between puruṣa and
  prakṛti within Yoga''s distinctive vision.


  Sūtra 4.4 establishes that ahaṃkāra (ego-sense, the sense of ''I'') alone creates minds—a deliberate narrowing of causality
  that departs from classical Sāṃkhya''s attribution of all vṛtti to prakṛti. By locating creative agency in the ego-sense
  rather than in prakṛti''s blind unfolding or puruṣa''s passive witness-consciousness, Yoga positions the ego as both the
  problem and the leverage point. The multiplicity of minds (the many citta-s generated in ordinary consciousness) are not
  inevitable emanations from matter but constructions of habitual self-identification. This is not mere psychology: it is
  a metaphysical claim that the binding force is the subject''s own contraction into ''I-ness.''


  Sūtra 4.5 then reveals the countermovement. Among all these ego-generated minds, there exists one mind that functions as
  director (niyantṛ) of the many functions. This is not a new mind but the same citta freed from ego''s tyranny—a mind that
  has recovered its capacity to govern rather than be governed. The sūtra''s insistence that this directing mind is "one among
  the many" is crucial: it does not deny multiplicity but shows that unity can emerge within it, that consciousness can regain
  sovereignty over its own modifications without requiring their annihilation.


  Sūtra 4.6 completes the arc by naming the condition of this sovereignty: the mind born of meditation (dhyāna-ja) is free
  of āśaya (karmic residue). The word ''born'' signals not gradual refinement but ontological rupture. Through sustained meditative
  focus, a new mind emerges—one that has shed the vasanas (latent impressions) that ordinarily bind puruṣa to prakṛti''s cycles.
  This is not the ego-sense creating yet another mind; it is the ego-sense itself dissolved in the fire of dhyāna, leaving
  a consciousness that is no longer the architect of its own bondage. The freedom is anāśaya—not merely calm or concentrated,
  but residue-free, the karmic substrate itself burned away.


  The three sūtras thus map the Yoga path: recognize the ego as the sole creator of mental multiplicity; recover the mind''s
  capacity to direct rather than be directed; and through meditation, birth a consciousness so thoroughly purged of conditioning
  that it stands as kaivalya—puruṣa no longer entangled in prakṛti''s vṛtti, but established in its own luminous nature.


  Key Terms


  **ahaṃkāra** — ego-sense, the sense of ''I-ness''; in Yoga, the root generator of mental multiplicity and bondage

  **dhyāna-ja** — born of meditation; a mind that emerges through sustained meditative focus, ontologically transformed

  **anāśaya** — free of residue; devoid of karmic impressions (vasanas) that ordinarily bind consciousness to prakṛti

  **niyantṛ** — director, governor; the unified mind''s capacity to regulate the multiplicity of functions rather than be
  swept by them


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5–6.6:** The Gītā similarly distinguishes between the ego-driven mind (ahaṃkāra-bound) and the mind that
  has become the self''s ally through practice (yoga-yukta), capable of directing the senses rather than being driven by them.
  Divergence: The Gītā frames this as duty (dharma) and devotion (bhakti) within a theistic cosmos; the Yoga Sūtras frame
  it as a purely technical metaphysical operation independent of cosmic order or divine will.

  **Plotinus, Enneads III.8.4:** Plotinus describes a consciousness that has ascended beyond the multiplicity of individual
  mind (nous) to recover unity with the One, a transformation that involves shedding the ego''s fragmentation—resonant with
  the Yoga move from ego-created minds to the unified directing mind. Divergence: Plotinus emphasizes mystical ascent and
  the transcendent One beyond being; Yoga emphasizes the isolation (kaivalya) of puruṣa within prakṛti, a non-theistic metaphysics
  of consciousness and matter.

  **Epictetus, Enchiridion 1.1–1.2:** Epictetus teaches that some things are in our control (our judgments, desires, aversions)
  and some are not, and freedom lies in recognizing this distinction—paralleling Yoga''s insight that the mind can recover
  agency by ceasing to identify with ego-generated constructions. Divergence: Epictetus grounds freedom in rational discrimination
  within the natural order; Yoga grounds it in the ontological separation of puruṣa from prakṛti through meditation, a metaphysical
  rather than ethical framework.'
