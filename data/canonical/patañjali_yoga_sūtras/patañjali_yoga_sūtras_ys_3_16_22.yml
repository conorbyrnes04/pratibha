sanskrit_devanagari: 'परिणामतयासंयमाद् अतितानागतज्ञनम् ॥ ३.१६ ॥


  शब्दार्थप्रतयाणाम् इतरताराध्यासात् संकरः श तप्रविभागसंयमात् सर्वभूतरुतज्ञानम् ॥ ३.१७ ॥


  संस्कारसाक्षात्कारात् पूर्वजातिज्ञानम् ॥ ३.१८ ॥


  प्रत्ययस्य परचित्तज्ञानम् ॥ ३.१९ ॥


  ना च त त् साःलम्बनं तस्याविषयिभूतत्वात् ॥ ३.२० ॥


  कायरूपसंयमात् तदग्राह्यशक्तिस्तम्भे चक्षुप्रकाशासंप्रयोगे अन्तर्धानम् ॥ ३.२१ ॥


  सोपक्रामं निरुपक्रामं च कर्म तत्त्स्यमाद् अपरान्तज्ञानं आरिष्टेभ्यो वा ॥ ३.२२ ॥'
sanskrit_iast: 'pariṇāmatrayasaṃyamād atītānāgatajñānam || 3.16 ||


  śabdārthapratyayānām itaretarādhyāsāt saṃkaraś tatpravibhāgasaṃyamāt sarvabhūtarutajñānam || 3.17 ||


  saṃskārasākṣātkaraṇāt pūrvajātijñānam || 3.18 ||


  pratyayasya paracittajñānam || 3.19 ||


  na ca tat sālambanaṃ tasyāviṣayībhūtatvāt || 3.20 ||


  kāyarūpasaṃyamāt tadgrāhyaśaktistambhe cakṣuḥprakāśāsaṃprayoge ''ntardhānam || 3.21 ||


  sopakramaṃ nirupakramaṃ ca karma tatsaṃyamād aparāntajñānam ariṣṭebhyo vā || 3.22 ||'
translation_literal: '**3.16** Through constraint (saṃyama) on the three transformations (pariṇāma), knowledge
  of past and future.

  **3.17** Sound, meaning, and the mental impression (pratyaya) are confused by mutual superimposition
  (adhyāsa); through constraint on their differentiation, knowledge of the utterance of all beings.

  **3.18** Through direct perception of the subliminal impressions (saṃskāra), knowledge of former births.

  **3.19** Through constraint on the mental impression, knowledge of another''s mind.

  **3.20** Yet that knowledge is not supported by an object, for the object does not fall within its scope.

  **3.21** Through constraint on the form of the body—when the power to be grasped is suspended and light
  is disconnected from the eye—invisibility.

  **3.22** Action (karma) is either with initial impulse or without; through constraint on it, knowledge
  of the end time; or from omens.'
commentary: 'Sūtras 3.16–3.22 form a unified argument about the scope and mechanism of yogic knowing:
  once the mind is stilled through saṁyama (disciplined restraint on an object), the practitioner gains
  direct access to knowledge ordinarily veiled by the mind''s habitual conflations and temporal limitations.
  The sequence moves from temporal knowledge (past and future) through linguistic and interpersonal knowing,
  to the paradoxical powers of invisibility and action-withdrawal—each illustrating the same underlying
  principle: that saṁyama dissolves the boundary between knower and known by removing the mental modifications
  (vṛtti) that obscure direct perception. The pivot is sūtra 3.17, which diagnoses the root obstacle:
  the superimposition (adhyāsa) of word, meaning, and idea upon one another. This is not merely a linguistic
  problem but an epistemological one rooted in prakṛti''s nature to conflate and obscure. By applying
  saṁyama to the sound itself—the most immediate, sensory layer—the practitioner bypasses conceptual mediation
  and accesses meaning directly, as puruṣa witnessing prakṛti''s unfolding. This same method extends backward
  (3.18: knowledge of past births through saṃskāra, the mind''s own stored impressions) and interpersonally
  (3.19: knowledge of others'' thoughts through their mental images). The final sūtras (3.21–3.22) reveal
  the paradox: mastery of saṁyama does not grant magical powers in the conventional sense but rather the
  freedom to withdraw perception itself—to render the body invisible not through illusion but through
  the yogi''s capacity to disengage the citta from its entanglement with the sense organs and their objects.
  The cluster thus teaches that all knowledge beyond ordinary cognition flows from a single practice:
  the disciplined, non-dual attention that reveals consciousness (puruṣa) as eternally separate from and
  untouched by the mind''s modifications, even as it illuminates them.


  Key Terms


  **saṁyama** — disciplined, sustained attention on a single object; the unified practice of concentration,
  meditation, and absorption that dissolves the boundary between knower and known

  **adhyāsa** — superimposition; the habitual conflation of distinct categories (word, meaning, idea;
  self, mind, body) that obscures direct perception

  **saṃskāra** — latent impression or trace left by past experience in the mind; the causal substrate
  of memory and continuity across lifetimes

  **vṛtti** — mental modification or fluctuation; the mind''s habitual patterns of distortion that veil
  the witness consciousness (puruṣa)


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.55–2.56 (sthita-prajña, the steadfast sage):** Both texts locate extraordinary knowledge
  in the stilling of mental fluctuations; the Gītā''s ''sthita-prajña'' whose mind is unshaken mirrors
  the yogi whose saṁyama dissolves ordinary perception to reveal direct knowing. Divergence: The Gītā
  emphasizes equanimity and duty (dharma) as the fruit of stillness, whereas Patañjali''s Yoga treats
  siddhis (powers) and kaivalya (liberation) as the fruit, with no necessary ethical framework attached
  to the practice itself.

  **Plotinus, Enneads 4.8.1 (memory and the undescended soul):** Plotinus describes how the soul retains
  knowledge of its prior existence and can access it through contemplative withdrawal from sensory distraction;
  Patañjali''s sūtra 3.18 parallels this via saṃskāra as the mind''s own archive of past births. Divergence:
  Plotinus grounds this in the soul''s eternal nature and its non-descent into matter, whereas Patañjali
  situates it within prakṛti''s cyclic evolution and the puruṣa''s witness-consciousness, offering a more
  dualistic metaphysics.

  **Epictetus, Enchiridion 1 (what is and is not in our control):** Both texts teach that true freedom
  lies in mastering attention and perception rather than external circumstances; Epictetus''s ''prohairesis''
  (moral choice) and Patañjali''s saṁyama both redirect the will inward to the mind''s own operations.
  Divergence: Epictetus anchors freedom in ethical judgment and virtue, whereas Patañjali treats it as
  the fruit of non-dual knowing and the dissolution of the ego-mind''s claim to agency, leading to kaivalya
  rather than virtue.'
insight: The central claim of this sutra is that disciplined practice (saṁyama) is not merely a present‑moment
  technique but a transformative process that bridges the past, present, and future.
practice: Apply disciplined restraint to your thoughts, actions, and sensations as you move through each
  stage of your daily life, observing how this practice reveals knowledge of past patterns and future
  possibilities.
