title: Fixing the Mind
unit_type: sutra
sanskrit_devanagari: देशबन्धः चित्तस्य धारणाः
sanskrit_iast: deśabandhaś cittasya dhāraṇā
translation_literal: The mind is fixed upon a point.
commentary: 'The central claim of this verse is that the path to samādhi is the deliberate act of fixing the mind on a single
  object, whether internal or external. By asserting that dhāraṇā is the *means* to samādhi, the author elevates concentration
  above mere passive awareness; it is an active, intentional act of the *citta* (mind) that transforms ordinary perception
  into a sustained, unbroken focus. The contested move here is the identification of dhāraṇā as a *prāpti* (acquisition) rather
  than a *prāśn* (questioning) of the object; some commentators read it as a simple fixation, others as a deeper, self‑initiated
  awareness. In the Sāṃkhya–Yoga framework, the *citta* is the third limb of the *pañca‑karmas* (fivefold path), and its control
  is essential for the *puruṣa* (consciousness) to detach from *prakṛti* (nature). The verse prescribes that the object of
  fixation must be *śuddha* (pure) and *īśvarī* (divine), thereby ensuring that the *citta* does not become entangled in the
  *vṛtti* (mental modifications) of *prakṛti*. This aligns with the Dvivedi commentary’s emphasis on choosing a holy, pure
  object, whether it be a deity, a bodily plexus, or a simple bodily part like the tip of the tongue. The existential application
  is clear: by consciously directing the mind toward a pure object, one cultivates the mental steadiness required to transcend
  the *vṛtti* and experience the unchanging *puruṣa*. The practice of dhāraṇā thus becomes a disciplined, intentional act
  that bridges the gap between ordinary cognition and the contemplative state of samādhi, embodying the Yoga Sutra’s overarching
  goal of liberation through the mastery of the mind.


  Key Terms


  **citta (चित्त)** — citta (mind) – from ‘cint’ (to think) – in Sāṃkhya, the third limb of the path; in Yoga, the object
  of control


  **vṛtti (वृत्ति)** — vṛtti (mental modification) – from ‘vṛtti’ (to turn) – the fluctuations of the mind that bind puruṣa
  to prakṛti


  **puruṣa (पुरुष)** — puruṣa (consciousness) – from ‘puru’ (to exist) – the subject that observes, distinct from prakṛti


  **prakṛti (प्रकृति)** — prakṛti (nature) – from ‘prakṛti’ (to be made) – the material substratum that generates vṛtti


  **samādhi (समाधि)** — samādhi (contemplative absorption) – from ‘samā’ (together) + ‘dhi’ (to hold) – the state of unified,
  unbroken attention


  **īśvara (ईश्वर)** — īśvara (supreme principle) – from ‘īś’ (to be master) – the divine attribute that purifies the object
  of dhāraṇā


  Cross-Tradition Resonances


  **Yoga Sutras 1.1:** Both verses posit dhāraṇā as the means to samādhi, linking the mind’s fixation to liberation.

  *Divergence:* While 1.1 speaks of the mind’s wandering, 3.1 focuses on intentional fixing, highlighting a shift from passive
  to active control


  **Bhaṭṭa Kaṇḍa 2.1:** Both treat dhāraṇā as a practice involving a chosen object, internal or external.

  *Divergence:* Bhaṭṭa allows any object, whereas the Yoga Sutra restricts it to pure, holy objects to avoid vṛtti


  **Māṇḍūkya Upaniṣad 3.2:** Both emphasize the importance of a pure object for spiritual focus.

  *Divergence:* The Upaniṣad frames the object as a metaphysical principle, while the Sutra presents it as a practical meditative
  technique


  **Yogopadeśa 4.5:** Both describe dhāraṇā as a sustained, unbroken attention.

  *Divergence:* Yogopadeśa stresses the role of breath, whereas the Sutra omits breath, focusing solely on mental fixation'
insight: The central claim of this verse is that the path to samādhi is the deliberate act of fixing the mind on a single
  object, whether internal or external.
practice: You now fix your mind on a single, pure object—be it a deity, a bodily part, or a mental image—maintaining that
  focus without distraction.
