title: Fixing the Mind
unit_type: sutra
sanskrit_devanagari: देशबन्धः चित्तस्य धारणाः
sanskrit_iast: deśabandhaś cittasya dhāraṇā
translation_literal: The fixing of the mind in one place is concentration.
commentary: 'This sūtra defines dhāraṇā, the sixth limb of Patañjali''s eightfold path, by isolating its
  essential mechanism: the binding (bandha) of consciousness (citta) to a single location or object (deśa).
  The word deśa means ''place'' or ''region''—it can refer to a physical location, a point in the body,
  or a conceptual focus. Dhāraṇā is not meditation (dhyāna) or absorption (samādhi); it is the deliberate,
  sustained act of tethering attention to one point.


  Within the Yoga–Sāṃkhya framework, this practice addresses a fundamental problem: the mind''s natural
  tendency to scatter across sense objects and mental impressions (vṛtti). By binding the mind to a single
  deśa—whether the tip of the nose, the heart center (hṛdaya), the space between the eyebrows, or a mantra—the
  practitioner interrupts the outward flow of consciousness and begins to consolidate its power. This
  is not suppression but redirection: the mind''s inherent capacity for attention is collected and held
  steady.


  The sūtra''s economy is significant. It does not say ''the mind becomes still'' or ''thoughts cease,''
  but rather ''the mind is bound to one place.'' This acknowledges that concentration is an active holding,
  a voluntary yoking of attention. Over time, as dhāraṇā deepens, the boundary between the mind and its
  object begins to dissolve, and dhyāna (unbroken flow of awareness toward the object) naturally arises.
  But at this stage, the work is simple and precise: bind the mind to one place and keep it there.


  Key Terms


  **deśa** — place, region, or point of focus—the object or location to which the mind is bound

  **bandha** — binding, fixing, or locking—the act of holding or restraining

  **dhāraṇā** — concentration or holding; the sixth limb of yoga in which the mind is steadied at a single
  point'
insight: The central claim of this verse is that the path to samādhi is the deliberate act of fixing the
  mind on a single object, whether internal or external.
practice: Choose a single point of focus. The most accessible for modern practice is the breath at the
  nostrils. Sit upright in a comfortable position. Close your eyes or soften your gaze downward. Bring
  your attention to the sensation of the breath as it enters and leaves the nostrils—the coolness of the
  inhale, the warmth of the exhale. Do not try to control the breath; simply observe it. Each time your
  mind wanders (and it will), gently return attention to that single point. Practice for 5–10 minutes
  daily. The goal is not to empty the mind or achieve bliss, but to notice how many times attention drifts
  and how many times you can bring it back. This repeated return is the practice of deśabandha. Over weeks,
  the intervals between distraction and return will lengthen, and the mind will begin to rest more naturally
  at the chosen point.
