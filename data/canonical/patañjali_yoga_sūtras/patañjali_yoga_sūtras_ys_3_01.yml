  items:
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Fixing the Mind”: in Sāṃkhya, the
      third limb of the path -> not ‘brain software’ or an enemy to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: dhāraṇā (धारणा)
    definition: '√dhṛ ‘hold’ → binding mind to a place -> in “Fixing the Mind”: the sixth limb of yoga in which the mind is
      steadied at a single point -> not casual focus; deliberate localization of citta that begins saṃyama'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Fixing the Mind”: the fluctuations of the mind that
      bind puruṣa to prakṛti -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Fixing the Mind”: the subject that observes,
      distinct from prakṛti -> not ‘person’ as social self; the unchanging witness distinct from prakṛti’s display'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Fixing the Mind”: the material substratum that generates
      vṛtti -> not pastoral ‘Nature’; the tri-guṇa matrix generating all experience including mind'
