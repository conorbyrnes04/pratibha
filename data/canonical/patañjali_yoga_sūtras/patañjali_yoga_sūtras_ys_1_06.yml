  items:
  - term: viparyaya (विपर्यय)
    definition: 'vi-pari-√i ‘go the wrong way’ → misconception -> in “Right Knowledge and Its Forms”:
      in Yoga, viparyaya denotes the misapprehension that arises when the mind reverses the true nature
      of objects, leading to ignorance -> not mere mistake of detail; false cognition mistaking the form
      of something for what it is not'
  - term: pramāṇa (प्रमाण)
    definition: 'pra-√mā ‘measure accurately’ → valid means of knowing -> in “Right Knowledge and Its
      Forms”: the term’s literal sense of ‘measure’ is lost when it is treated merely as a tool rather
      than the result of cognition -> not ‘proof’ in courtroom sense alone; perception, inference, testimony
      as vṛtti-types'
  - term: vikalpa (विकल्प)
    definition: 'vi-√kḷp ‘fashion alternately’ → verbal/constructive ideation -> in “Right Knowledge and
      Its Forms”: in Samkhya, vikalpa is the mental fabrication that turns the mind away from reality,
      creating a false image -> not all thinking; cognition following words without a corresponding object
      present'
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: nidrā (निद्रा)
    definition: 'ni-√drā ‘sleep’ → sleep as a distinct vṛtti -> in “Right Knowledge and Its Forms”: They
      are [right knowledge], [wrong knowledge], [fancied], [sleeping], and [memory]. -> not mere rest;
      a cognition of absence that still counts as mental modification to be stilled'
  - term: heya (हेय)
    definition: '√hā ‘abandon’ → that which is to be discarded (future suffering) -> in “Right Knowledge
      and Its Forms”: They are [right knowledge], [wrong knowledge], [fancied], [sleeping], and [memory].
      -> not past pain fixation; the avoidable future duḥkha that viveka aims to cut'
