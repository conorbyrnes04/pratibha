- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this passage is that the five categories listed are the only valid modes
    of cognition, each representing a distinct epistemic state that the practitioner must recognize and
    transcend. The contested move lies in the identification of ‘fancied’ (vikalpa) and ‘sleeping’ (indra)
    as epistemic states rather than mere mental activities; this aligns with the Samkhya notion that ignorance
    (avidya) manifests in multiple guises, yet it diverges from the later Yoga commentaries that treat
    indra solely as a sensory faculty. In the Yoga–Samkhya framework, pramāṇa (knowledge) is the vehicle
    of liberation, but only when it is untainted by viparyaya (misconception) or vikalpa (imagination).
    Dvivedi’s brief mention of ‘fancy, sleep, and memory’ underscores the practical reality that our mind
    constantly oscillates among these states, thereby sustaining the illusion of duality. By systematically
    identifying and labeling each state, the practitioner gains the awareness necessary to detach from
    the fluctuating mind (citta) and approach samādhi, the stillness that reveals puruṣa’s true nature.
    This exercise is existentially relevant: it teaches that liberation is not a distant ideal but a present
    practice of discerning the quality of each thought as it arises, thereby reducing the grip of prakṛti
    and moving toward the realization of the self as pure awareness.


    Key Terms


    **pramāṇa (प्रमाण)** — root: prā (to go) + māṇa (to measure) -> measurement; in Samkhya, pramāṇa is
    the means of valid cognition, encompassing perception, inference, and testimony; the term’s literal
    sense of ‘measure’ is lost when it is treated merely as a tool rather than the result of cognition.


    **viparyaya (विपर्यय)** — vip (in) + ary (to change) -> change or reversal; in Yoga, viparyaya denotes
    the misapprehension that arises when the mind reverses the true nature of objects, leading to ignorance;
    the term’s etymology highlights the dynamic reversal of perception.


    **vikalpa (विकलप)** — vik (to turn) + alp (small) -> small turning; in Samkhya, vikalpa is the mental
    fabrication that turns the mind away from reality, creating a false image; the term’s literal sense
    of turning is crucial to understanding its role as a deceptive cognitive state.


    **smṛti (स्मृति)** — root: smṛ (to remember) -> remembrance; in Yoga, smṛti refers to the residual
    imprint of past cognition that influences present perception; its etymology underscores continuity,
    which is why smṛti can both preserve knowledge and perpetuate ignorance.


    Cross-Tradition Resonances


    **Patanjali, Yoga Sūtra 1.1:** Both passages enumerate the five pramāṇas, establishing a structural
    homology in listing epistemic categories.

    *Divergence:* While Patanjali lists perception, inference, testimony, intuition, and non-cognition,
    YS 1.6 replaces inference and testimony with wrong knowledge, fancied, sleeping, and memory, reflecting
    a more phenomenological focus.


    **Kapila Samkhya Karika 1.2:** Kapila also distinguishes between right and wrong knowledge, but frames
    them in terms of puruṣa and prakṛti interaction.

    *Divergence:* YS 1.6 abstracts the categories into mental states rather than ontological categories,
    thereby making the doctrine more immediately applicable to meditative practice.


    **Dvivedi, Commentary on YS 1.6:** Dvivedi explicitly identifies the five states as ‘fancy, sleep,
    and memory’, mirroring the YS wording.

    *Divergence:* Dvivedi’s commentary expands the list with an implicit reference to ‘wrong knowledge’,
    whereas the original sūtra lists it explicitly, suggesting a later editorial addition.'
