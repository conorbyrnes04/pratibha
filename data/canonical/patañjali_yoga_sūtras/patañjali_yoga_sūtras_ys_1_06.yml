sanskrit_devanagari: प्रमाणविपर्ययविकलपिन्ड्रास्मृतयः
sanskrit_iast: pramāṇaviparyayavikalpanidrāsmṛtayaḥ
translation_literal: Right knowledge, misperception, imagination, sleep, and memory—these are the five
  modifications of mind.
commentary: 'This sūtra (I.6) establishes the foundational taxonomy of mental operations within Patañjali''s
  system. It answers a crucial question: what exactly *is* the mind doing at any given moment? The answer
  is: one of five things.


  Pramāṇa (right knowledge) is direct, valid cognition—perception that corresponds to reality. It arises
  through three channels: sensory perception (pratyakṣa), inference (anumāna), and testimony (āgama).
  This is not belief or opinion; it is knowledge that can be verified and tested.


  Viparyaya (misperception) is its opposite: cognition that *appears* valid but contradicts reality. The
  rope mistaken for a snake, the mirage mistaken for water—these are viparyaya. Critically, misperception
  *feels* like right knowledge to the one experiencing it. This is why discrimination (viveka) becomes
  essential in yoga practice.


  Vikalpa (imagination or conceptual construction) is cognition without a corresponding object in reality.
  It is the mind''s capacity to generate images, narratives, and possibilities independent of sensory
  input—the realm of fantasy, projection, and mental elaboration.


  Nidrā (sleep) is a distinct mental state, not mere absence of mind. In sleep, the sense organs withdraw
  but a subtle form of mental activity persists—hence why dreams occur and why sleep is listed as a *modification*
  rather than a cessation.


  Smṛti (memory) is the retention and recall of past impressions (saṃskāra). It is not the past event
  itself, but the mind''s reconstruction of it—always filtered, colored, and subject to distortion.


  Why does Patañjali list these five? Because yoga''s goal is to transcend all of them. The practitioner
  must first recognize that most of daily consciousness is spent in viparyaya, vikalpa, and distorted
  smṛti. Even pramāṇa, though valid, is still a *modification*—still movement in the mind-field (citta).
  The ultimate aim is to reach a state beyond all five: pure witness consciousness (puruṣa) untouched
  by mental fluctuation.


  This verse is not merely descriptive psychology; it is a map of bondage and the first step toward freedom.


  Key Terms


  **pramāṇa** — valid knowledge or right cognition; direct perception, inference, or testimony that corresponds
  to reality

  **viparyaya** — misperception or false knowledge; cognition that appears valid but contradicts actual
  reality

  **vikalpa** — imagination, conceptual construction, or mental elaboration without a corresponding external
  object'
insight: The central claim of this passage is that the five categories listed are the only valid modes
  of cognition, each representing a distinct epistemic state that the practitioner must recognize and
  transc
practice: '**The Five-State Audit (Pañca-Avasthā Sākṣī)**: For one day, carry a small notebook. Every
  hour, pause for 30 seconds and ask: *Which of the five am I in right now?* Write the letter: P (pramāṇa—direct
  knowing), V (viparyaya—false knowing), I (vikalpa—imagination), S (sleep/drowsiness), M (memory/recall).
  Be honest. You will likely find yourself cycling through V, I, and M far more than P. Notice patterns:
  when do you slip into misperception? When does imagination take over? When are you lost in memory? This
  simple audit builds *viveka* (discrimination)—the ability to distinguish real from unreal, present from
  reconstructed past. Over weeks, this awareness alone begins to loosen the grip of false knowing and
  habitual mental patterns.'
