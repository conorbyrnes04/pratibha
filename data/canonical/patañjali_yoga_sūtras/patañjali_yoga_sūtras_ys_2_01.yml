sanskrit_devanagari: तपःस्वाध्यायेः‑ईश्वरप्रणिधानानि क्रियायोगः
sanskrit_iast: tapaḥsvādhyāyeśvarapraṇidhānāni kriyāyogaḥ
translation_literal: In this sūtra, preliminary Yoga is defined as the practice of austerity, study, and devotion to the divine.
  The practice involves self‑discipline (tapaḥ), diligent study (svādhyāya), and surrender to the divine (īśvara‑praṇidhāna).
commentary: 'The passage asserts that the path to samādhi begins with a triad of disciplined actions—mortification, study,
  and devotion—each of which purifies the mind and aligns it with the divine will. This triad is not merely a set of external
  rituals but a systematic method of transforming the prāṇāyāma and the subtle energies that govern the mind. The contested
  move here is the identification of ‘mortification’ with the broader concept of tapas, which in the Sāṃkhya framework is
  an active force of self‑purification rather than passive suffering. By framing tapas as a conscious, intentional practice,
  the text bridges the Sāṃkhya notion of puruṣa‑prakṛti interaction with the yogic goal of samādhi. The commentary of Dvivedi
  echoes this by emphasizing the importance of disciplined practice as a means to attain samādhi, yet it expands the scope
  to include the reading of sacred texts, thereby integrating scriptural study into the yogic regimen. The philosophical claim
  is that the disciplined mind, when freed from the vicissitudes of vṛtti through systematic practice, can experience the
  unconditioned state of puruṣa, thereby realizing the ultimate goal of Yoga. This has existential relevance: it offers a
  concrete method for individuals trapped in habitual patterns, showing that disciplined practice can dissolve the illusion
  of separateness and bring one into communion with the universal consciousness.


  Key Terms


  **tapaḥ (तपः)** — tapas (IAST) -> ''austerity'' in Sāṃkhya; in Yoga, a deliberate self‑discipline that purifies the mind
  and prāṇas, beyond mere physical penance


  **svādhyāya (स्वाध्यायः)** — svādhyāya (IAST) -> ''self‑study''; in Yoga, the systematic contemplation of sacred texts and
  mantras to align the mind with divine principles


  **īśvara‑praṇidhāna (ईश्वर‑प्रणिधान)** — īśvara‑praṇिधान (IAST) -> ''surrender to the divine''; in Yoga, the conscious relinquishment
  of egoic control to the divine will, facilitating the dissolution of vṛtti


  Cross-Tradition Resonances


  **Yoga Sūtra 2.1:** Structural homology: the triadic formulation (tapaḥ, svādhyāya, īśvara‑praṇidhāna) mirrors the Sāṃkhya
  triad of puruṣa, prakṛti, and the cause of their interaction

  *Divergence:* While Sāṃkhya presents puruṣa and prakṛti as fixed entities, the Yoga text reinterprets the triad as dynamic
  practices that transform the mind, thereby making the philosophical distinction actionable


  **Dvivedi Commentary 2.1:** Dvivedi expands the mortification concept to include fasts and penances, aligning with the broader
  Dharmic tradition of asceticism

  *Divergence:* Dvivedi’s emphasis on scriptural study introduces an epistemic dimension absent in the terse Yoga Sūtra, suggesting
  a more integrative approach to liberation'
insight: The passage asserts that the path to samādhi begins with a triad of disciplined actions—mortification, study, and
  devotion—each of which purifies the mind and aligns it with the divine will.
practice: You practice preliminary Yoga by engaging in disciplined self‑austerity, studying sacred texts, and surrendering
  your will to the divine, thereby purifying your mind and aligning it with the ultimate reality.
