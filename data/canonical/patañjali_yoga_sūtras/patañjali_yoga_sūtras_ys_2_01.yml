sanskrit_devanagari: तपःस्वाध्यायेः‑ईश्वरप्रणिधानानि क्रियायोगः
sanskrit_iast: tapaḥsvādhyāyeśvarapraṇidhānāni kriyāyogaḥ
translation_literal: Austerity, self-study, and surrender to the divine are the yoga of action.
commentary: 'This opening sūtra of Patañjali''s second book (Sādhana Pāda) establishes the practical foundation
  of yoga—what he calls kriyā-yoga, the yoga of doing or practice. It is not a mystical attainment but
  a deliberate threefold discipline that prepares the body, mind, and will for the deeper stages of meditation
  and liberation.


  Tapaḥ (austerity or disciplined heat) refers to sustained effort and the willingness to endure discomfort
  in service of transformation. This is not self-harm but the metabolic friction of practice—the tapas
  that burns away impurity and resistance. In the Yoga Sūtras'' framework, this includes āsana (posture),
  prāṇāyāma (breath regulation), and the restraints and observances (yama and niyama) that follow in later
  sūtras.


  Svādhyāya (self-study) means intimate examination of one''s own nature, patterns, and conditioning.
  It includes study of sacred texts and teachings, but more fundamentally, it is honest introspection—witnessing
  how the mind actually works, where attachment and aversion arise, and what obscures clarity. This is
  the cognitive dimension of practice.


  Iśvara-praṇidhāna (surrender to the divine, or dedication to something transcendent) is the devotional
  and relinquishing dimension. It acknowledges that effort alone is insufficient; there must be an orientation
  toward what lies beyond the ego''s grasp. In Patañjali''s non-theistic framework, this means aligning
  practice toward the highest principle (Purusha) rather than personal gain.


  Together, these three form the preliminary yoga—not advanced techniques, but the essential ground. They
  are called preliminary because they prepare the conditions for the later limbs (pratyāhāra, dhāraṇā,
  dhyāna, samādhi) to unfold naturally. Patañjali will later show how this threefold practice directly
  addresses the afflictions (kleśas) that bind consciousness to suffering.


  Key Terms


  **tapaḥ** — Disciplined effort, austerity, or the metabolic heat generated by sustained practice that
  burns away impurity and resistance.

  **svādhyāya** — Self-study; intimate examination of one''s own nature, patterns, and conditioning through
  introspection and sacred study.

  **īśvara-praṇidhāna** — Surrender or dedication to the divine principle; alignment of practice toward
  what transcends the personal ego.'
insight: The passage asserts that the path to samādhi begins with a triad of disciplined actions—mortification,
  study, and devotion—each of which purifies the mind and aligns it with the divine will.
practice: 'Choose one area of your daily life where you will practice these three elements together for
  one week:


  1. **Tapaḥ (Austerity):** Commit to a specific physical discipline—perhaps a daily 20-minute practice
  of standing poses or breath work, done consistently even when you don''t feel like it. The point is
  to build capacity through gentle resistance, not punishment. Notice the internal heat and aliveness
  that emerges.


  2. **Svādhyāya (Self-Study):** Each day after your physical practice, sit quietly for 5 minutes and
  observe one recurring pattern in your mind or behavior without judgment. Write it down. What triggers
  it? How does your body respond? Simply witness and record.


  3. **Īśvara-Praṇidhāna (Surrender):** Begin and end each session by acknowledging something larger than
  your personal will—whether that is the intelligence of your body, the vastness of breath, or an explicit
  spiritual principle. Offer your effort toward understanding rather than toward achievement or control.


  At week''s end, notice what has shifted in your clarity, stability, or sense of purpose. This is kriyā-yoga
  in action.'
