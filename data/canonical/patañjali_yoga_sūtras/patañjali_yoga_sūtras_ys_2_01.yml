  - term: praṇidhāna (प्रणिधान)
    definition: 'pra-ni-√dhā ‘place thoroughly toward’ → dedicated surrender/orientation -> in “Preliminary
      Yoga of Practice”: In this sūtra, preliminary Yoga is defined as the practice of austerity, study,
      and devotion to the divine. -> not fatalistic resignation; active offering of practice-mind toward
      īśvara'
  - term: svādhyāya (स्वाध्याय)
    definition: 'sva + adhyāya ‘self-study / study of what is one’s own’ -> in “Preliminary Yoga of Practice”:
      in Yoga, the systematic contemplation of sacred texts and mantras to align the mind with divine
      principles -> not generic reading; scriptural/self-inquiry that can culminate in contact with desired
      deity/form'
  - term: īśvara (ईश्वर)
    definition: '√īś ‘rule, be capable’ → the special puruṣa untouched by kleśa/karma -> in “Preliminary
      Yoga of Practice”: in Yoga, the conscious relinquishment of egoic control to the divine will, facilitating
      the dissolution of vṛtti -> not necessarily a creator-god dogma; Patañjali’s omniscient special
      puruṣa as object of praṇidhāna'
  - term: tapaḥ (तपः)
    definition: 'source-term tapaḥ -> in “Preliminary Yoga of Practice”: in Yoga, a deliberate self‑discipline
