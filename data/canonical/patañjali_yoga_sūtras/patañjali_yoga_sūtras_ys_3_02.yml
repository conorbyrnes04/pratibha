unit_type: sutra
sanskrit_devanagari: तत्र प्रत्ययैकतानता ध्यानम्
sanskrit_iast: tatra pratyayaikatānatā dhyānam
translation_literal: There, the unbroken flow of a single object of awareness is meditation.
commentary: 'This sūtra defines dhyāna—the sixth limb of yoga—by its essential mechanism: sustained, undivided
  attention on one focal point (pratyaya). The word tatra (''there'') refers back to the preceding context
  of concentration (dhāraṇā), the fifth limb, where attention is first gathered. Dhyāna advances this
  by removing the effort of *holding* and allowing consciousness to flow continuously toward its object
  without interruption or fragmentation.


  The compound pratyayaikatānatā literally means ''one-pointedness of the object of awareness''—not merely
  thinking about something repeatedly, but a seamless continuity of cognition. This is the threshold between
  deliberate practice and the spontaneous absorption that leads to samādhi. In the Yoga–Sāṃkhya framework,
  dhyāna represents the mind (citta) aligning itself so completely with a chosen object that subject-object
  duality begins to dissolve, yet the meditator remains aware of the meditation itself. Once even this
  witnessing awareness merges with the object, samādhi (the seventh limb) begins.


  This sūtra emphasizes that meditation is not mystical or vague—it is a precise, observable mental state:
  unbroken continuity of attention. The quality of this flow determines the depth of practice and readiness
  for absorption.


  Key Terms


  **pratyaya** — object of awareness; the content of consciousness; what the mind takes as its focus

  **ekātānatā** — one-pointedness; unbroken continuity in a single direction

  **dhyāna** — meditation; sustained, uninterrupted flow of attention on a chosen object, the sixth limb
  of yoga'
insight: The central claim of this sutra is that absorption (dhjana) is not merely a passive fixation
  but an ontological unification of the mind (citta) with its object.
practice: 'Choose a simple, stable object: the breath at the nostrils, a candle flame, the sound of a
  mantra, or a visual point. Sit comfortably for 10–15 minutes. Begin by anchoring attention deliberately
  (dhāraṇā practice). Then, instead of ''holding'' or effortfully returning attention each time it wanders,
  cultivate a gentle, continuous *following* of the object. When the mind drifts, notice without judgment
  and resume the flow—do not restart from effort, but re-enter the stream. The goal is to experience even
  30 seconds of unbroken continuity. Over weeks, this flow lengthens naturally. You will notice the difference
  between concentration (which feels like gripping) and meditation (which feels like a river moving in
  one direction). This is dhyāna.'
