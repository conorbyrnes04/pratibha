unit_label: Unity of Mind in Absorption
title: Unity of Mind in Absorption
unit_type: sutra
sanskrit_devanagari: तत्र प्रत्ययैकतानता ध्यानम्
sanskrit_iast: tatra pratyayaikatānatā dhyānam
translation_literal: The unity of the mind with the object is absorption.
commentary: 'The central claim of this sutra is that absorption (dhjana) is not merely a passive fixation but an ontological
  unification of the mind (citta) with its object. In the Sāṃkhya–Yoga framework, the mind’s activity (vṛtti) is a manifestation
  of prakṛti, and its cessation in a single object constitutes the first stage of samādhi. Here, the sutra asserts that when
  the mind’s pratyaya (intention) becomes monistic (ekatā), the very distinction between subject and object dissolves. This
  is the contested move: the claim that the mind’s unity with the object is not a mere perceptual alignment but a transformative
  ontological shift. Dvivedi’s commentary underscores that the mind must be conscious only of itself and the object, hinting
  at the dual self–object awareness that characterizes the highest samādhi. The sutra therefore situates absorption as the
  threshold where citta ceases to oscillate and becomes a single, self‑sustaining reality, aligning with Patanjali’s later
  description of the four stages of samādhi. Practically, this means that in meditation one must sustain a single, unwavering
  focus on the chosen object until the mind’s fluctuations subside, thereby actualizing the unity that the sutra demands.


  Key Terms


  **citta (चित्त)** — citta: ‘mind’ in Sāṃkhya; beyond mere consciousness, it is the active, mutable aspect of prakṛti that
  undergoes vṛtti; the sutra’s focus on its unity with the object elevates it from a passive receiver to an active participant
  in reality.


  **vṛtti (वृत्ति)** — vṛtti: ‘mental modifications’ in Patanjali; the sutra’s reference to the mind’s unity implies the cessation
  of vṛtti, a key step toward samādhi.


  **samādhi (समाधि)** — samādhi: ‘absorption’ or ‘concentration’ in Yoga; the sutra’s use of dhjana anticipates the four stages
  of samādhi, marking the first stage where mind and object are one.


  **prakṛti (प्रकृति)** — prakṛti: the primordial material nature in Sāṃkhya; the sutra’s emphasis on the mind’s unity with
  the object reflects the transformation of prakṛti’s duality into a singular reality.


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 3.2:** Structural homology: the sutra’s terse two‑word form mirrors the earlier 3.1 ‘tatra pratyayaikatā’
  and foreshadows the later 3.3 ‘tatra vṛttiḥ’—a triplet of mind, object, and activity.

  *Divergence:* While 3.1 and 3.3 emphasize the mind’s separation and activity, 3.2 uniquely asserts their unification, breaking
  the pattern to introduce the concept of absorption.


  **Vātsyāyana, Vāstavikāyāyana, 1.1:** Both texts describe the mind’s fixation on an object as a step toward liberation;
  Vātsyāyana’s phrasing ‘citta‑śaktir’ parallels the sutra’s ‘citta‑pratyayaikatā’ in highlighting the mind’s power in unification.


  **Dvivedi, Commentary on YS 3.2:** Dvivedi’s emphasis on the mind’s simultaneous awareness of itself and the object echoes
  Patanjali’s later description of the fourth stage of samādhi, where the observer and observed merge.


  **Bhatta, Yoga Bhashya, 3.2:** Bhatta’s expansion of ‘dhjana’ as ‘the mind’s complete fixation’ structurally aligns with
  the sutra’s two‑word brevity, yet diverges by adding a qualitative dimension (complete fixation) that the sutra omits.'
insight: The central claim of this sutra is that absorption (dhjana) is not merely a passive fixation but an ontological unification
  of the mind (citta) with its object.
practice: Focus your attention on a single object, and maintain that focus until the mind’s fluctuations cease, thereby uniting
  mind and object in absorption.
