  items:
  - term: pratyaya (प्रत्यय)
    definition: 'prati-√i ‘go toward’ → cognitive content/presentation -> in “Unity of Mind in Absorption”: what the mind
      takes as its focus -> not grammatical ‘suffix’; the mind’s object-presenting content in a given moment'
  - term: dhyāna (ध्यान)
    definition: '√dhyā ‘contemplate’ → unbroken flow toward the object -> in “Unity of Mind in Absorption”: sustained, uninterrupted
      flow of attention on a chosen object, the sixth limb of yoga -> not ‘thinking about’; continuous single-current cognizing
      that deepens dhāraṇā'
  - term: citta (चित्त)
    definition: '√cit ‘perceive/notice’ → mind-continuum as cognizing instrument -> in “Unity of Mind in Absorption”: the
      sutra’s focus on its unity with the object elevates it from a passive receiver to an active participant in reality ->
      not ‘brain software’ or an enemy to smash; the reflecting medium whose turnings veil puruṣa'
    lemma_id: citta
    sense_id: citta.shaiva
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Unity of Mind in Absorption”: the sutra’s reference
      to the mind’s unity implies the cessation of vṛtti, a key step toward samādhi -> not ‘bad thoughts’ only — any cognitive
      wave (valid cognition, error, fantasy, sleep, memory)'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Unity of Mind in Absorption”: the sutra’s use of dhjana anticipates
      the four stages of samādhi, marking the first stage where mind and object are one -> not trance-entertainment or unconsciousness;
      graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
