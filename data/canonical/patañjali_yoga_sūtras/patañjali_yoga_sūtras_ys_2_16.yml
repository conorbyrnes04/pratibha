sanskrit_devanagari: हेयं दुःखं अनागतम्
sanskrit_iast: heyaṃ duḥkham anāgatam
translation_literal: Suffering that has not yet arrived can be avoided.
commentary: 'This sūtra (YS 2.16) presents a cornerstone of yogic prevention—the recognition that future
  pain is not inevitable but can be intercepted through deliberate practice. In the Sāṃkhya framework,
  suffering (duḥkha) arises from the confusion of prakṛti (nature, matter) with puruṣa (consciousness).
  The three forms of suffering are ādhyātmika (internal), ādhibhautika (from external objects), and ādhidaivika
  (from cosmic forces). Anāgata duḥkha—suffering not yet manifest—is the most tractable form because it
  exists only as potential, as a karmic seed not yet sprouted. The yogi''s task is to recognize these
  approaching patterns of suffering (through discrimination, viveka) and dissolve them before they crystallize
  into lived experience. This is not optimism but precise observation: by understanding the mechanisms
  of suffering (kleśa, vāsanā, saṃskāra), one can interrupt the causal chain. The practice of yoga itself—ethical
  discipline (yama-niyama), posture (āsana), breath regulation (prāṇāyāma), sense withdrawal (pratyāhāra),
  and meditation (dhyāna)—functions as this preventive medicine. The verse assumes that consciousness,
  when properly trained, can operate in the future tense, recognizing and dissolving suffering before
  it manifests as pain in the body or mind.


  Key Terms


  **duḥkha** — suffering, pain, or unsatisfactoriness; the fundamental condition that yoga addresses

  **anāgata** — not yet arrived, future, not yet manifest; refers to suffering as potential rather than
  actualized

  **heya** — to be avoided, preventable, or rejected; that which can be deliberately set aside through
  practice'
insight: The Sūtra asserts that the foremost object of yogic practice is the preemptive avoidance of suffering
  that has not yet manifested.
practice: 'Each morning, sit quietly for five minutes and ask yourself: What patterns of suffering am
  I likely to encounter today? These might be emotional (reactivity to criticism), physical (tension from
  poor posture), or relational (conflict with a specific person). Name one. Then, before that situation
  arises, rehearse a single conscious response: a breath practice (4-count inhale, 6-count exhale), a
  phrase of self-compassion, or a deliberate pause. When the triggering moment arrives during your day,
  this pre-planted intention acts as an interruption—you meet the potential suffering with awareness rather
  than automaticity. Over weeks, you will notice certain predicted sufferings never materialize because
  you have already altered the causal chain through this simple act of prevention.'
