  body: Because the mind’s differences divide the same object, the paths are separated.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim of this sutra is that the multiplicity of experience arises not from the object itself but from
    the mind’s tendency to differentiate. The contested move is the assertion that the same object (वस्तु) can be ‘साम्ये’—identical—yet
    the mind (चित्त) introduces bheda (भेद) that splits the path (पन्था). In the Yoga–Sāṃkhya framework, this aligns with
    the idea that prakṛti’s vṛtti (mental modifications) obscure the true nature of puruṣa. The sutra therefore foregrounds
    the role of citta as the source of illusion, echoing Patanjali’s earlier statement that “citta is the root of all suffering.”
    By emphasizing that the mind’s differentiation is the root of disunity, the sutra invites the practitioner to recognize
    that liberation (kaivalya) requires the dissolution of these mental divisions. The practice of samādhi, as described in
    later sutras, is the means by which one can experience the undivided reality of puruṣa, free from vṛtti. The Satchidananda
    commentary’s brief remark that “same object may vary” underscores the paradoxical nature of perception: the same external
    reality can appear different depending on the mind’s state. This sutra thus serves as a philosophical reminder that the
    path to liberation is not about changing external circumstances but about transforming the mind’s habitual pattern of
    differentiation.


    Key Terms


    **citta (चित्त)** — citta (mind) – from ‘cint’ (to think) – in Sāṃkhya, the conscious principle that undergoes vṛtti;
    the sutra highlights its role as the source of differentiation, a nuance beyond the generic ‘mind’ translation.


    **vṛtti (वृत्ति)** — vṛtti (mental modification) – from ‘vṛtti’ (to turn) – denotes the mind’s habitual patterns; the
    sutra’s focus on mind’s division of the same object points to vṛtti as the mechanism of illusion.


    **puruṣa (पुरुष)** — puruṣa (pure consciousness) – from ‘puruṣ’ (to be) – in Sāṃkhya, the immutable witness; the sutra’s
    implication that liberation requires seeing beyond citta’s bheda to puruṣa’s unity.


    **prakṛti (प्रकृति)** — prakṛti (primordial matter) – from ‘prakṛti’ (to be born) – the dynamic aspect of reality that
    is obscured by citta’s vṛtti; the sutra’s emphasis on the mind’s division underscores the need to transcend prakṛti’s
    modifications.


    Cross-Tradition Resonances


    **Yoga Sutras 1.2:** Both sutras identify citta as the root of illusion; 1.2 states ‘citta is the root of suffering’,
    while 4.15 specifies that the mind’s differentiation (bheda) creates separate paths.

    *Divergence:* 1.2 speaks generally of suffering, whereas 4.15 narrows the focus to the specific mechanism of mind’s division
    of a single object.


    **Bhaṭṭa Śānti 4.15:** Bhaṭṭa echoes the idea that the mind’s differentiation leads to multiple paths, mirroring Patanjali’s
    wording but with a more explicit reference to ‘bheda’ as the cause of separation.

    *Divergence:* Bhaṭṭa’s text uses a more elaborate explanation of how the mind’s divisions arise, whereas Patanjali’s sutra
    is more concise.


    **Māṇḍūkya Upaniṣad 2.1:** The Upaniṣad discusses the same object appearing differently to different minds, paralleling
    the sutra’s claim that ‘same object’ can be ‘साम्ये’ yet divided by mind.

    *Divergence:* The Upaniṣad attributes the variation to differing states of consciousness, while Patanjali attributes it
    specifically to citta’s bheda.


    **Shankara’s Brahma Sutra 2.1.1:** Shankara’s sutra discusses the multiplicity arising from ignorance, aligning with the
    idea that mind’s differentiation creates separate paths.

    *Divergence:* Shankara’s focus is on ignorance (avidyā) as the root, whereas Patanjali pinpoints citta’s bheda as the
    operative cause.'
