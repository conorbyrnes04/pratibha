sanskrit_devanagari: वस्तुसाम्ये चित्तभेदात् तैः विभक्तः पन्थाः
sanskrit_iast: vastusāmye cittabhedāt tayor vibhaktaḥ panthāḥ
translation_literal: When objects appear the same, the mind's differentiation creates a divided path between them. Through
  this mental distinction, the way forward becomes separated.
commentary: 'This sūtra addresses a fundamental paradox in perception and liberation: two minds observing the same object
  will experience different realities because consciousness itself fragments experience. Patañjali is not claiming objects
  are inherently multiple—vastusāmye (in object-sameness)—but that cittabhedāt (through the mind''s differentiation) a single
  thing becomes many paths.


  Within the Yoga–Sāṃkhya framework, this reveals how prakṛti (nature/materiality) remains one, yet puruṣa (consciousness)
  multiplies experience through mental modification (vṛtti). The "divided path" (vibhaktaḥ panthāḥ) refers to how conditioning,
  memory, and conceptual overlay cause seekers to diverge in their understanding and practice, even when studying the same
  teaching or facing the same circumstance.


  The liberatory insight here is radical: if the mind''s differentiation creates separation, then the dissolution of mental
  distinction—the stilling of cittabhedāt—returns one to the unified object and unified consciousness. This is why nirodha
  (cessation of mental fluctuation) is the gateway to kaivalya (isolation/liberation). The verse warns that as long as the
  mind divides, the path remains fragmented; unity of perception signals the approach to non-dual realization.


  Key Terms


  **vastusāmye** — in object-sameness; when the external thing remains one and unchanged

  **cittabhedāt** — through the mind''s differentiation or division; mental fragmentation that creates multiplicity from unity

  **vibhaktaḥ panthāḥ** — the divided or separated path; the fragmented way forward created by mental distinction'
insight: The central claim of this sutra is that the multiplicity of experience arises not from the object itself but from
  the mind’s tendency to differentiate.
practice: 'For 10 minutes, choose one ordinary object (a cup, a stone, a leaf). Observe it without naming or categorizing.
  Notice the moment your mind labels it, compares it to memory, judges it beautiful or plain. Each label is a cittabhedāt—a
  mental differentiation that splits the unified perception. When you catch yourself dividing, pause. Return to bare seeing:
  shape, color, texture, light—without the story. Repeat this cycle. Over weeks, you will notice how much of what you call
  "seeing" is actually mental overlay, and how rare unified perception actually is. This trains the recognition that liberation
  lies not in changing objects but in ceasing the mind''s habitual fragmentation.'
