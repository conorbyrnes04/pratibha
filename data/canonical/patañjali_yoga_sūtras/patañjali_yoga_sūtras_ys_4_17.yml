sanskrit_devanagari: तदुपरागापेक्षित्वाच् चित्तस्य वस्तु ज्नाताज्ञातम्
sanskrit_iast: taduparāgāpekṣitvāc cittasya vastu jñātājñātam
translation_literal: An object becomes known or unknown depending on whether the mind takes on its coloration;
  the object itself is neither inherently known nor unknown.
commentary: 'This sūtra (II.21 in the Yoga Sūtra sequence) addresses a fundamental epistemological problem:
  the relationship between consciousness (citta), the object (vastu), and knowledge itself. Patañjali
  argues that an object''s status as ''known'' or ''unknown'' is not an intrinsic property of the object,
  but rather depends entirely on whether the mind (citta) becomes colored by it—that is, whether the mind
  takes on the form of that object through the process of perception.


  The word uparāga means ''coloration'' or ''staining''—the mind''s capacity to assume the shape of what
  it perceives. This is the mechanism of vritti (mental modification). An object exists independently,
  but its knowability is contingent on the mind''s engagement. A sound exists in the forest whether anyone
  hears it or not, but it is ''known'' only when the auditory faculty and mind are present and attuned.


  This teaching dissolves the naive realist view that objects are simply ''out there'' waiting to be known.
  It also corrects the idealist extreme by affirming that objects do exist independently (vastu). The
  knowing relationship is neither purely objective nor purely subjective—it is relational. This principle
  is essential for understanding why yoga practice focuses on training the mind rather than chasing external
  objects: the quality of knowledge depends on the quality of the knowing instrument.


  Within the Sāṃkhya framework, this reflects the distinction between prakṛti (the field of objects) and
  puruṣa (the witnessing consciousness). The object belongs to prakṛti; the knowing belongs to the relationship
  between puruṣa and the mind''s capacity to reflect.


  Key Terms


  **uparāga** — coloration, staining, or the mind''s assumption of the form of an object through perception

  **citta** — the mind-stuff or consciousness-field; the instrument of knowing that takes the shape of
  its objects

  **vastu** — an object or thing; that which exists independently in the field of nature (prakṛti)'
insight: The central claim of this verse is that the mind’s own conditioning determines the status of
  an object as known or unknown.
practice: 'Sit quietly for 10 minutes. Choose an ordinary object—a cup, a leaf, a stone. Place it before
  you. For the first 3 minutes, simply look at it without naming it or thinking about its uses. Notice:
  does the object feel ''known'' or ''unknown'' in this bare perception? Then, for 3 minutes, think about
  the object''s history, material, function, and associations. Notice how the same object now feels ''known''
  because your mind has colored it with concepts and memory. Finally, for 4 minutes, return to simple
  seeing without the overlay of thought. Observe the difference between the object as it appears when
  your mind is engaged versus when it is quiet. This direct experience reveals how knowledge is not a
  property of the object itself, but arises from the meeting of mind and thing.'
