pratibha_layers:
- kind: original
  label: Original
  body: स्वस्वामीशक्त्योः स्वरूपोपालभ्धिहेतुः संयोगः
- kind: iast
  label: IAST
  body: svasvāmiśaktyoḥ svarūpopalabdhihetuḥ saṃyogaḥ
- kind: translation
  label: Pratibha Translation
  body: The union of the self‑recognizing power and the self‑reached form is the cause of the conjunction.
- kind: commentary
  label: Pratibha Commentary
  body: 'The central philosophical claim of this verse is that the very act of self‑recognition—what the
    sūtra calls the ‘union of the self‑recognizing power and the self‑reached form’—is itself the causal
    principle that brings about all experience. In the Yoga‑Sāṃkhya framework, the seer (puruṣa) and the
    seen (prakṛti) are not merely co‑existing; their inseparable junction is the engine of the entire
    experiential world. This is a contested move: some commentators, following the Dvivedi tradition,
    read the phrase as a warning against the ‘junction to be warded off,’ whereas the Pratibha reading
    interprets it positively as the very mechanism that enables mokṣa. The existential import is that
    by understanding and consciously aligning with this union, one can transform the ordinary flow of
    vṛtti (mental modifications) into a sustained state of samādhi (concentration), thereby realizing
    puruṣa’s true nature. The commentary underscores that the seer’s power is not an external force but
    an inner gnosis that, when harmonized with prakṛti’s power, produces blissful, self‑knowing experience.
    This aligns with the Sāṃkhya notion that puruṣa’s transcendence is achieved through the dispassionate
    observation of prakṛti’s manifestations, yet here the emphasis is on the dynamic interplay that initiates
    that observation.


    Key to the sūtra is the term ‘svasvāmiśaktyoḥ,’ which literally means ‘the power that recognizes itself.’
    It is this self‑recognizing power that, when coupled with the form it has attained (svarūpa), creates
    the conjunction that is the root of all experience. The sūtra thus bridges the epistemic gap between
    the observer and the observed, suggesting that the very act of recognition is the first step toward
    liberation.


    Key terms:


    Key Terms


    **svasvāmiśaktyoḥ (स्वस्वामीशक्त्योः)** — self‑recognizing power -> in Sāṃkhya, puruṣa’s awareness;
    in Yoga, the inner witness; the term highlights that the power itself is aware of itself, a nuance
    lost in simple translations


    **svarūpa (स्वरूप)** — self‑reached form -> the manifested aspect of puruṣa; contrasts with prakṛti;
    indicates that the seer has attained a form that is still distinct from prakṛti


    **saṃyogaḥ (संयोगः)** — union/conjunction -> the causal nexus between puruṣa and prakṛti; in Yoga,
    the dynamic interaction that generates experience; in Sāṃkhya, the moment of interaction that initiates
    change


    Cross-Tradition Resonances


    **Yoga Sūtra 2.23:** Explicit identification of the causal union (saṃyogaḥ) as the root of all experience,
    mirroring the Sāṃkhya idea of puruṣa‑prakṛti interaction

    *Divergence:* Unlike the Sāṃkhya emphasis on the passive observation of prakṛti, the Yoga text presents
    the union as an active, self‑recognizing power that initiates experience


    **Bhāṣya of Dvivedi, 2.23:** Interprets the union as a potential source of wrong knowledge, warning
    the practitioner

    *Divergence:* The Pratibha reading reframes it positively, seeing the same union as the gateway to
    mokṣa, thus shifting the ethical orientation


    **Yoga Sūtra 2.17:** Earlier verse warns against the ‘junction to be warded off,’ suggesting a dual
    nature of saṃyoga

    *Divergence:* The current verse resolves this tension by clarifying that the junction is indeed the
    cause of experience, thereby reconciling the warning with the affirmative claim


    **Sāṃkhya Karika 1.1:** Defines puruṣa as the witness and prakṛti as the seen, establishing the framework
    for saṃyoga

    *Divergence:* Yoga expands the framework by attributing self‑recognition to the power itself, adding
    a layer of agency absent in the Sāṃkhya Karika'
