title: Union of Seer and Sight
unit_type: sutra
sanskrit_devanagari: स्वस्वामीशक्त्योः स्वरूपोपालभ्धिहेतुः संयोगः
sanskrit_iast: svasvāmiśaktyoḥ svarūpopalabdhihetuḥ saṃyogaḥ
translation_literal: The union of the seer and the seen arises as the cause of the recognition of their
  respective natures.
commentary: 'This sūtra appears in the context of Patañjali''s explanation of how bondage occurs and,
  by extension, how liberation becomes possible. The seer (puruṣa, the witnessing consciousness) and the
  seen (prakṛti, the field of nature including mind, senses, and objects) are fundamentally distinct in
  their essence. Yet through saṃyoga—a joining or entanglement—they appear to merge in experience.


  The phrase svarūpopalabdhi (recognition of one''s own form or nature) is crucial. Normally, the seer
  mistakes itself for the seen; consciousness identifies with mental modifications, emotions, and perceptions
  as if they were its own substance. This false identification is the root of suffering (kleśa) in Yoga–Sāṃkhya
  philosophy.


  Patañjali''s point is subtle: the very contact or union of seer and seen becomes the *means* by which
  each can be recognized in its true form—but only when that union is properly understood and then dissolved
  through discriminative knowledge (viveka). The seer learns its nature through the mirror of the seen;
  the seen reveals its mechanical, non-conscious character through the seer''s witnessing. This recognition
  is both the problem (when misidentified) and the gateway to freedom (when clearly discerned).


  This sūtra establishes the framework for all subsequent yoga practice: we work with the union of consciousness
  and nature precisely to untangle them, to restore the seer to its own luminous independence.


  Key Terms


  **puruṣa (seer)** — Consciousness itself; the witnessing subject, unchanging and non-active, the true
  self in Sāṃkhya metaphysics

  **prakṛti (seen)** — Nature; the field of all manifestation including mind, senses, and objects; fundamentally
  non-conscious but dynamic

  **saṃyoga** — Union, contact, or entanglement; the apparent joining of seer and seen that generates
  both bondage and the possibility of discrimination'
insight: The central philosophical claim of this verse is that the very act of self‑recognition—what the
  sūtra calls the ‘union of the self‑recognizing power and the self‑reached form’—is itself the causal
  pri
practice: 'Sit quietly for 10 minutes. Choose a simple sensation—the breath, or the weight of your body
  on the seat. Observe it without naming or judging. Notice: there is the sensation itself (the seen),
  and there is the awareness aware of it (the seer). Do not try to separate them; simply keep both in
  view. When the mind wanders, gently return to this dual noticing. Each time you catch the difference
  between the sensation and the awareness of the sensation, you are practicing viveka—the discrimination
  that Patañjali calls the seed of liberation. Over weeks, this simple noticing begins to loosen the knot
  of identification and reveals the seer as distinct from all that is seen.'
