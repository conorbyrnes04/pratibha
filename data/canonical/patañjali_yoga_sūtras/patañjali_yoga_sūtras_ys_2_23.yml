  items:
  - term: yoga (योग)
    definition: '√yuj ‘yoke, harness, join’ -> in “Union of Seer and Sight”: The union of the self‑recognizing
      power and the self‑reached form is the cause of the conjunction. -> not a posture class or romantic
      ‘union’ fantasy — technical stilling/harnessing of mind'
    lemma_id: yoga
    sense_id: yoga.classical
  - term: saṃyoga (संयोग)
    definition: 'sam-√yuj ‘join together’ → conjunction of seer and seen -> in “Union of Seer and Sight”:
      the apparent joining of seer and seen that generates both bondage and the possibility of discrimination
      -> not romantic union; the mis-conjunction that is the hetu of suffering'
  - term: hetu (हेतु)
    definition: '‘cause/reason’ -> in “Union of Seer and Sight”: The union of the self‑recognizing power
      and the self‑reached form is the cause of the conjunction. -> not vague ‘reason why’; the causal
      factor (often saṃyoga of seer/seen) producing heya'
  - term: svasvāmiśaktyoḥ (स्वस्वामीशक्त्योः)
    definition: 'source-term svasvāmiśaktyoḥ -> in “Union of Seer and Sight”: the term highlights that
      the power itself is aware of itself, a nuance lost in simple translations -> default English flattens
      the technical work this term does here'
  - term: svarūpa (स्वरूप)
    definition: 'sva + rūpa ‘own form’ -> in “Union of Seer and Sight”: indicates that the seer has attained
      a form that is still distinct from prakṛti -> not personality essence; the Seer’s standing in itself
      when vṛtti quiet'
