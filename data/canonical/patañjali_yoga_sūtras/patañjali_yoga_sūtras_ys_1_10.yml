unit_label: Sleep as Transformation
title: Sleep as Transformation
unit_type: sutra
sanskrit_devanagari: अभावप्रत्यालम्बनः वृत्तिर निद्रा
sanskrit_iast: abhāvapratyayālambanā vṛttir nidrā
translation_literal: Sleep is the mental modification that rests upon the absence of content.
commentary: 'Patañjali defines nidrā (sleep) not as mere unconsciousness, but as a specific vṛtti—a movement
  or modification of consciousness itself. The key phrase abhāvapratyayālambanā means ''supported by or
  grounded in the cognition of absence.'' This is crucial: sleep is not nothing. It is a conscious state,
  but one whose object is the absence of objects—a void-like substrate (abhāva). The mind does not simply
  vanish; rather, it settles into a condition where no distinct content arises, yet awareness persists
  in a latent form.


  Within the Yoga–Sāṃkhya framework, this definition places sleep among the five vṛttis (modifications
  of mind): right knowledge, misperception, imagination, sleep, and memory. Sleep is thus a legitimate
  mental function, not a failure of consciousness. It serves a purpose: the mind''s natural rhythm of
  engagement and withdrawal, activity and rest. The abhāva (absence) that anchors sleep is not annihilation
  but a return to undifferentiated potential—the field from which all mental content emerges.


  This sūtra invites a radical reframing: if sleep is a vṛtti, it can be observed, understood, and even
  refined through practice. The yogi does not merely fall asleep; he or she can learn to witness the transition
  into sleep, to recognize the quality of that absence, and to maintain a thread of awareness even as
  the mind releases its objects. This is the gateway to practices like yoga nidrā (yogic sleep) and the
  cultivation of witness-consciousness that persists through all states.


  Key Terms


  **vṛtti** — A modification, fluctuation, or movement of the mind; the five vṛttis are the basic categories
  of mental activity (right knowledge, misperception, imagination, sleep, memory).

  **abhāva** — Absence, void, or non-manifestation; not nothingness but the unmanifest potential from
  which content arises.

  **pratyaya** — Cognition, perception, or the object of consciousness; here, the ''knowing'' of absence
  itself.'
insight: The sūtra asserts that sleep is a transformation rooted in the absence of change.
practice: 'Tonight, as you prepare for sleep, sit upright for two minutes with eyes closed. Mentally scan
  your body and notice what you are aware of: sensations, thoughts, the sense of ''I am here.'' Then lie
  down and, rather than forcing sleep, simply watch the process of letting go. Notice the moment when
  you stop tracking your breath, when thoughts become dreamlike and fragmentary. Do not try to stay awake;
  instead, cultivate a gentle curiosity about the threshold itself—the point where the mind releases its
  grip on objects. You are not trying to achieve anything, only to notice: What is the quality of awareness
  just before sleep takes over? What remains present in that absence? Over weeks, this simple witnessing
  can deepen your sleep and also reveal that consciousness does not vanish—it only withdraws from the
  surface.'
