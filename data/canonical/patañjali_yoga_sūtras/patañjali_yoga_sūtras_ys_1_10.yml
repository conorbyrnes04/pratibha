  items:
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Sleep as Transformation”: here it
      is the target of suppression -> not ‘bad thoughts’ only — any cognitive wave (valid cognition, error,
      fantasy, sleep, memory)'
  - term: pratyaya (प्रत्यय)
    definition: 'prati-√i ‘go toward’ → cognitive content/presentation -> in “Sleep as Transformation”:
      here, the ''knowing'' of absence itself -> not grammatical ‘suffix’; the mind’s object-presenting
      content in a given moment'
  - term: ālambana (आलम्बन)
    definition: 'ā-√lamb ‘lean on’ → support/object of meditation -> in “Sleep as Transformation”: The
      transformation that is based on non-existence is sleep. -> not crutch in a weak sense; the chosen
      support that citta rests upon in practice'
  - term: nidrā (निद्रा)
    definition: 'ni-√drā ‘sleep’ → sleep as a distinct vṛtti -> in “Sleep as Transformation”: The transformation
      that is based on non-existence is sleep. -> not mere rest; a cognition of absence that still counts
      as mental modification to be stilled'
  - term: abhāva (अभाव)
    definition: '‘abha’ (absence) + ‘-va’ (possessive suffix) -> in “Sleep as Transformation”: in Sāṃkhya
      it denotes the non‑existence of a quality, here the non‑existence of transformation -> ‘nothingness’
      misses the active process of becoming non‑existent'
