practice: 'Sit comfortably for 10–15 minutes in a quiet space. Begin with natural breath awareness for
  2–3 minutes to settle the mind. Then choose a simple, neutral object of focus—the breath at the nostrils,
  a candle flame at eye level, or a single word (like ''om''). Do not strain. When attention drifts, gently
  return it without judgment or self-criticism. The key is consistency and gentleness, not force. After
  the formal sitting, pause for one minute and simply notice: what arises in your mind now? Is there a
  quality of clarity or spaciousness? Can you sense a difference between thoughts that feel ''yours''
  (laden with personal concern) and insights that seem to appear on their own? This contrast—between conditioned
  mental noise and what emerges from stillness—is the lived recognition of anāśayam. Practice this daily
  for two weeks and observe whether insights from these quiet moments feel less entangled with your usual
  worries and preferences.'
