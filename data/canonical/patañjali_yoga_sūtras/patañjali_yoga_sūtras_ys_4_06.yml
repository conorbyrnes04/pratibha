sanskrit_devanagari: तत्र ध्यायनजम् अनाशयम्
sanskrit_iast: tatra dhyānajam anāśayam
translation_literal: In that state, what arises from meditation is without residual impression or latent
  tendency.
commentary: 'This sūtra appears in the context of Patañjali''s discussion of samādhi and the transformation
  of consciousness through sustained meditative absorption. The phrase ''tatra'' (in that state) refers
  to the condition of deep meditation or samādhi described in preceding verses. ''Dhyānajam'' means ''born
  of or arising from meditation''—the insights, perceptions, or states that emerge when the mind settles
  into focused contemplation. The crucial term is ''anāśayam'': literally ''without āśaya'' (receptacle,
  deposit, or latent impression). This points to a radical freedom: when knowledge or experience arises
  directly from meditation rather than from mental conditioning, it carries no embedded tendency to generate
  future karma or perpetuate saṃskāra (mental grooves).


  Within the Yoga–Sāṃkhya framework, this reflects the distinction between jñāna (knowledge) that arises
  from direct perception of prakṛti and puruṣa versus jñāna filtered through the kleshas (afflictions)
  and saṃskāras. When meditation is sufficiently refined, the mind becomes transparent; what appears in
  that transparency is not colored by the yogin''s stored impressions or desires. This is why such meditation-born
  insight naturally liberates rather than binds. The verse suggests that freedom is not something achieved
  through effort alone, but rather discovered when the mind becomes still enough that truth appears unmediated
  by psychological residue.


  Key Terms


  **dhyāna** — Meditation; sustained, unwavering focus of attention on a single object or principle

  **āśaya** — Latent impression, deposit, or receptacle; the embedded tendency or vasana that shapes future
  experience

  **samādhi** — Absorption; the state in which subject and object merge and the mind becomes unified and
  still'
insight: 'The claim that liberation is achieved by a mind that is *born* through meditation is a decisive
  philosophical move: it elevates the act of meditative birth to the very threshold of kaivalya, rather
