sanskrit_devanagari: हृदये चित्तसंवित
sanskrit_iast: hṛdaye cittasaṃvit
translation_literal: In the heart, there is direct knowing of the mind.
commentary: 'This sūtra appears in the Yoga Sūtras'' section on samādhi-related practices and points to a subtle yogic principle:
  the heart (hṛdaya) is not merely an organ but a seat of direct perception (saṃvit). When the practitioner''s attention settles
  into the heart region—understood in yoga as the energetic center where consciousness and breath converge—a non-conceptual
  knowing of the mind''s nature becomes accessible. This is not intellectual understanding but immediate recognition (saṃvit,
  literally ''togetherness-knowing''). The mind (citta) is typically the object of observation in yoga practice; here, the
  sūtra suggests that by anchoring awareness in the heart, the observer and observed collapse into a unified field of knowing.
  This aligns with the Yoga-Sāṃkhya framework: the heart becomes a gateway where the witness (puruṣa) recognizes itself as
  distinct from mental fluctuations (vṛtti). The practice is not forced concentration but a gentle, sustained resting of attention
  in the cardiac region, allowing the mind''s inherent luminosity to reveal itself. This is foundational to deeper stages
  of meditation where the sense of separation between knower and known dissolves.


  Key Terms


  **hṛdaya** — Heart; in yoga, the energetic and conscious center of being, not merely the physical organ but a locus of direct
  knowing (saṃvit) and the meeting point of prāṇa and consciousness.

  **citta** — Mind-stuff; the subtle substance of mental activity, including thoughts, emotions, and impressions; the field
  of fluctuations (vṛtti) that yoga aims to stabilize.

  **saṃvit** — Direct knowing or immediate recognition; consciousness that knows itself without the mediation of thought;
  a unified field of awareness.'
insight: The sūtra asserts that the heart (hṛdaya) is the locus where the mind (citta) attains unity (saṃvit) with its own
  core.
practice: When a thought arises, let your awareness drop into the chest cavity as though following the thought downward into
  the heart itself—not observing the thought from outside, but meeting it in that deeper chamber where knowing happens without
  naming. Stay there until the thought dissolves into stillness, then notice what remains.
