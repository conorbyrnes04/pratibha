sanskrit_devanagari: हृदये चित्तसंवित
sanskrit_iast: hṛdaye cittasaṃvit
translation_literal: In the heart, there is direct knowing of the mind.
commentary: 'This sūtra appears in the Yoga Sūtras'' section on samādhi-related practices and points to
  a subtle yogic principle: the heart (hṛdaya) is not merely an organ but a seat of direct perception
  (saṃvit). When the practitioner''s attention settles into the heart region—understood in yoga as the
  energetic center where consciousness and breath converge—a non-conceptual knowing of the mind''s nature
  becomes accessible. This is not intellectual understanding but immediate recognition (saṃvit, literally
  ''togetherness-knowing''). The mind (citta) is typically the object of observation in yoga practice;
  here, the sūtra suggests that by anchoring awareness in the heart, the observer and observed collapse
  into a unified field of knowing. This aligns with the Yoga-Sāṃkhya framework: the heart becomes a gateway
  where the witness (puruṣa) recognizes itself as distinct from mental fluctuations (vṛtti). The practice
  is not forced concentration but a gentle, sustained resting of attention in the cardiac region, allowing
  the mind''s inherent luminosity to reveal itself. This is foundational to deeper stages of meditation
  where the sense of separation between knower and known dissolves.


  Key Terms


  **hṛdaya** — Heart; in yoga, the energetic and conscious center of being, not merely the physical organ
  but a locus of direct knowing (saṃvit) and the meeting point of prāṇa and consciousness.

  **citta** — Mind-stuff; the subtle substance of mental activity, including thoughts, emotions, and impressions;
  the field of fluctuations (vṛtti) that yoga aims to stabilize.

  **saṃvit** — Direct knowing or immediate recognition; consciousness that knows itself without the mediation
  of thought; a unified field of awareness.'
insight: The sūtra asserts that the heart (hṛdaya) is the locus where the mind (citta) attains unity (saṃvit)
  with its own core.
practice: 'Sit comfortably with your spine upright. Close your eyes. Place your attention gently at the
  center of your chest, approximately at the level of your physical heart. Do not strain or visualize
  anything; simply rest your awareness there as if listening from that space. Notice the natural rhythm
  of your breath without trying to control it. When the mind wanders—as it will—gently return attention
  to the heart center without judgment. Practice this for 10–15 minutes daily. Over time, you may notice
  a subtle shift: thoughts and emotions begin to feel less like intrusions and more like movements within
  a larger, stable field of awareness centered in the heart. This is the direct knowing (saṃvit) the sūtra
  points to—not a thought about the mind, but an immediate recognition of consciousness itself.'
