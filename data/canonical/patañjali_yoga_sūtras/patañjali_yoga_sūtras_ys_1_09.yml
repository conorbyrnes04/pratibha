sanskrit_devanagari: शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः
sanskrit_iast: śabdajñānānupātī vastuśūnyo vikalpaḥ
translation_literal: Vikalpa is knowledge that follows upon words, yet lacks any corresponding object.
commentary: 'This sūtra (I.9) defines vikalpa—one of the five kinds of mental modification (vṛtti) that Patañjali catalogues
  in the opening chapters. Unlike perception (pratyakṣa), which arises from direct sensory contact with a real object, vikalpa
  is a construction of meaning built entirely from linguistic or conceptual scaffolding. The Sanskrit śabdajñāna means ''word-knowledge''—understanding
  that arises when we hear or think a word. Ānupātī means ''following upon'' or ''dependent on.'' Vastuśūnyo means ''empty
  of object'' or ''devoid of a real thing.'' The crucial distinction: when you hear the word ''unicorn'' or ''tomorrow,''
  your mind generates a vivid image or sense of meaning, but no actual object corresponds to it in the present moment. This
  is vikalpa. It differs from memory (smṛti), which recalls a past object that did exist. Vikalpa is imagination, inference,
  or verbal abstraction—the mind''s capacity to move freely through language and concept without anchoring to immediate reality.
  In the Yoga-Sāṃkhya framework, vikalpa is not false or harmful in itself; it is a natural function of mind (citta). However,
  it becomes an obstacle to liberation (kaivalya) when mistaken for direct knowledge or when it obscures the distinction between
  word, concept, and reality. The practice of yoga involves learning to recognize vikalpa, to use it skillfully when needed,
  and to transcend it when seeking the unchanging witness (puruṣa) beyond all mental modification.


  Key Terms


  **vikalpa** — Mental modification based on verbal or conceptual meaning without a corresponding present object; imagination
  or abstraction.

  **śabdajñāna** — Knowledge that arises from words, language, or conceptual labels rather than direct perception.

  **vastuśūnya** — Empty of or devoid of a real object; lacking objective referent in the present moment.'
insight: The claim that vikalpa is a mental construct with no external correlate is a decisive philosophical stance.
practice: 'Whisper aloud the word ''tomorrow,'' then pause and ask: what am I touching right now? Repeat this three times
  throughout your day—each time noticing the gap between the vivid mental shape the word creates and the absence of any present
  object to grasp.'
