sanskrit_devanagari: 'बन्धकारणाशिथिल्यत् प्रचारा-संवेदनाच् च चित्तस्य परशरीरावेशः ॥ ३.३८ ॥


  उदानजयाज् जलपङ्ककंठाकादिष्व असङ्ग उत्क्रान्तिस्च ॥ ३.३९ ॥


  समानजयाज् ज्वलनम् ॥ ३.४० ॥


  श्रोत्राकाशयोः संबन्धसंयमाद् दिव्यं श्रोत्रम् ॥ ३.४१ ॥


  कायाकाशयोः सम्बन्धस्यमाल् लघुतुलसमापत्तेष् चाकाशगमनम् ॥ ३.४२ ॥


  बाहिर अकल्पितः वृत्तिर् महाविदेहाः ततः प्रकाशावरणाक्षयः ॥ ३.४३ ॥'
sanskrit_iast: 'bandhakāraṇaśaithilyāt pracārasaṃvedanāc ca cittasya paraśarīrāveśaḥ || 3.38 ||


  udānajayāj jalapaṅkakaṇṭakādiṣv asaṅga utkrāntiś ca || 3.39 ||


  samānajayāj jvalanam || 3.40 ||


  śrotrākāśayoḥ saṃbandhasaṃyamād divyaṃ śrotram || 3.41 ||


  kāyākāśayoḥ saṃbandhasaṃyamāl laghutūlasamāpatteś cākāśagamanam || 3.42 ||


  bahir akalpitā vṛttir mahāvidehā tataḥ prakāśāvaraṇakṣayaḥ || 3.43 ||'
translation_literal: '**3.38** When the binding-causes (bandhakāraṇa) grow slack and the movement of life-force
  (pracāra) is perceived, the mind enters another''s body (paraśarīrāveśaḥ).

  **3.39** By mastery of the upward breath (udāna), there is no clinging to water, mud, thorns, and the
  like; and ascent (utkrānti) occurs.

  **3.40** By mastery of the middle breath (samāna), radiance (jvalanam) arises.

  **3.41** By constraint (saṃyama) on the relation between ear and space (ākāśa), divine hearing (divyaṃ
  śrotram) comes.

  **3.42** By constraint on the relation between body and space, and by entering into the lightness of
  cotton—passage through space (ākāśagamanam) occurs.

  **3.43** When the outward fluctuation (vṛtti) is unformed, the great disembodied state (mahāvidehā)
  follows; then the obscuration of light (prakāśāvaraṇa) is destroyed.'
commentary: 'Sūtras 3.38–3.43 trace a single arc: the transformation of sensory bondage into sensory liberation
  through prāṇic mastery. The cluster begins (3.38) by naming the problem—superphysical senses (indriya)
  become vṛtti that bind citta when left undisciplined—then moves through breath-work and prāṇa control
  to culminate in a radical reordering of the body-mind relationship.


  The pivot is prāṇa. Sūtra 3.39 identifies the rising of udāna and the flow of the subtle pulse as the
  mechanism by which attachment dissolves. This is not metaphorical: the sūtras posit that conscious regulation
  of the vital currents (prāṇa) directly loosens the citta''s entanglement with prakṛti''s grosser modifications.
  Sūtra 3.40 extends this into the famous siddhi of levitation and voluntary departure from the body—not
  as supernatural fantasy but as the natural consequence of complete mastery over the upward prāṇa. When
  udāna is fully controlled, the yogi''s consciousness no longer identifies with the physical frame; the
  body becomes an instrument rather than a prison.


  Sūtras 3.41–3.43 then reverse the direction: having subdued the outward-binding senses, the practitioner''s
  perceptual faculties are reoriented inward and upward. The ear becomes divine hearing (divyaśrotra)
  through binding the air-element in harmony. The body-ether link, when regulated, yields subtle perception
  beyond ordinary limits. Finally, 3.43 names the source: the vast, unimagined outer flow of motion—prakṛti''s
  own dynamism—becomes the very lightness that dissolves the veil of ether (ākāśa).


  The unified teaching: mastery of prāṇa reverses the direction of the senses from outward bondage to
  inward liberation. The superphysical senses that initially bind (3.38) become, when properly channeled
  through prāṇic discipline, the instruments of divine perception and ultimate detachment. This reflects
  the Sāṃkhya insight that prakṛti''s forces are neither inherently liberating nor binding—their valence
  depends on whether consciousness (puruṣa) remains identified with them or recognizes itself as separate.
  The siddhi of levitation and divine hearing are not rewards but symptoms of that recognition: when the
  yogi no longer clings to the body through prāṇic attachment, the body''s apparent solidity and sensory
  limitation dissolve, revealing the subtle, weightless nature of consciousness itself.


  Key Terms


  **udāna** — The upward-moving vital current (prāṇa); its mastery is the key to transcending physical
  limitation and voluntary departure from the body

  **indriya** — The senses, both gross and superphysical; when undisciplined, they bind citta through
  vṛtti; when mastered, they become channels of divine perception

  **divyaśrotra** — Divine or subtle hearing; the transformation of ordinary auditory sense into a faculty
  of supernormal perception through prāṇic and elemental regulation

  **ākāśa** — Ether, the subtlest element; the veil of ether dissolves when the yogi masters the flow
  of prāṇa and recognizes consciousness as weightless and unbound


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.34–35:** Both texts affirm that the mind (citta/manas) is restless and difficult to
  control, yet through disciplined practice (abhyāsa) and detachment (vairāgya), mastery is possible.
  The Gītā''s image of the mind as ''wavering like the wind'' parallels the Yoga Sūtras'' description
  of prāṇic currents as the vehicle of mental attachment. Divergence: The Gītā emphasizes devotion (bhakti)
  and action (karma) as complementary paths; the Yoga Sūtras isolate prāṇic and sensory discipline as
  the direct technical means, with less emphasis on theistic surrender or ethical action as primary.

  **Plotinus, Enneads IV.8.1–2 (on the subtle body and ascent):** Plotinus describes the soul''s ascent
  through progressively subtle bodies and the dissolution of sensory attachment as consciousness rises
  toward the One. Like the Yoga Sūtras, he posits that liberation involves a reversal of the senses''
  outward flow and a recognition of weightlessness beyond material form. Divergence: Plotinus grounds
  ascent in intellectual intuition (noesis) and union with transcendent Being; the Yoga Sūtras ground
  it in prāṇic technique and the recognition of puruṣa-prakṛti duality, without Plotinus''s emphasis on
  the Good as the ultimate source.

  **Dhammapada 23 (on mastery of the mind):** Both traditions teach that mastery of the mind through disciplined
  practice yields freedom from suffering and the dissolution of ordinary perception. The image of the
  mind as a wild force that must be tamed appears in both. Divergence: The Dhammapada emphasizes ethical
  conduct (śīla) and the cessation of craving as the path; the Yoga Sūtras emphasize prāṇic control and
  the technical manipulation of subtle currents, with less explicit focus on moral precepts as prerequisite.'
insight: The sūtra asserts that the very act of breath rising (udāna) and the subsequent flow of a pulse
  that resembles water (jalapaṅkakaṇṭaka) constitute the decisive motion that frees the mind from its
  bond
practice: You now consciously direct the upward prāṇa (udāna) from your heart through the crown of your
  head, feeling the subtle current rise and rise, and as it strengthens, you sense your body becoming
  lighter, as if it could lift off the ground.
