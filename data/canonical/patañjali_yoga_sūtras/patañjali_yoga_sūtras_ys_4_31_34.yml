sanskrit_devanagari: 'तदाः सर्वावरणमालापत्यस्य ज्ञानस्यान्त्याज् ज्ञेयम् अल्पम् ॥ ४.३१ ॥


  ततः कृतार्थानां परिणामक्रमसमाप्तिर गुणानाम ॥ ४.३२ ॥


  क्षणप्रत्योगी परिनामपरान्तनिरग्राह्यः क्रमः ॥ ४.३३ ॥


  पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः काविल्यम् स्वरूपप्रतिष्ठा वा चितीशक्तिरिति ॥ ४.३४ ॥'
sanskrit_iast: 'tadā sarvāvaraṇamalāpetasya jñānasyānantyāj jñeyam alpam || 4.31 ||


  tataḥ kṛtārthānāṃ pariṇāmakramasamāptir guṇānām || 4.32 ||


  kṣaṇapratiyogī pariṇāmāparāntanirgrāhyaḥ kramaḥ || 4.33 ||


  puruṣārthaśūnyānāṃ guṇānāṃ pratiprasavaḥ kaivalyaṃ svarūpapratiṣṭhā vā citiśaktir iti || 4.34 ||'
translation_literal: '**4.31** Then, knowledge stripped of all obscuring impurity becomes infinite; what
  remains to be known is negligible (jñeya).

  **4.32** From that, the sequence of transformation (pariṇāma) of the gunas (guṇa) ceases, their purpose
  (kṛtārtha) fulfilled.

  **4.33** Sequence (krama) is grasped only at the endpoint of transformation (pariṇāma), moment by moment
  (kṣaṇa) correlative.

  **4.34** Isolation (kaivalya) is the reversion (pratiprasava) of the gunas (guṇa) emptied of purpose
  for the self (puruṣārtha)—or the power of consciousness (citiśakti) established in its own form (svarūpa).'
commentary: 'These four sūtras trace the final dissolution of prakṛti''s hold on puruṣa, articulating
  kaivalya not as acquisition but as the progressive removal of what obscures the self''s inherent nature.
  The movement is from epistemic clarity (4.31) through purposive cessation of the guṇas (4.32), via recognition
  of time''s seamless texture (4.33), to the supreme aloneness itself (4.34).


  4.31 establishes the paradox at kaivalya''s threshold: as all vṛtti (mental modifications) dissolve—the
  very mechanisms through which knowledge arises—what remains is almost nothing, yet this nothing is the
  puruṣa witnessing its own freedom. Knowledge here means conditioned knowing, the subject-object duality
  that prakṛti manufactures. The "almost nothing" is not nihilism but the irreducible presence of consciousness
  itself, which cannot be known as an object because it is the eternal subject. This inverts the usual
  trajectory of learning: liberation comes not through accumulation but through the systematic stripping
  away of false identifications.


  4.32 reframes prakṛti''s agency: the guṇas—sattva, rajas, tamas—do not blindly perpetuate themselves
  but cease their transformations once their pedagogical purpose is exhausted. This is the crucial move:
  prakṛti is not an enemy to be conquered but a provisional instrument that withdraws when its function
  is complete. The guṇas have evolved consciousness through countless cycles precisely so that puruṣa
  might recognize itself as eternally separate from their dance. When that recognition is stable, prakṛti''s
  reason for manifestation dissolves.


  4.33 deepens this by revealing the texture of that dissolution: time itself is not a series of discrete,
  isolated moments but an unbroken succession where each moment is simultaneously the culmination of its
  own transformation and yet remains graspable, present. This sūtra dissolves the illusion that moments
  are fragmented; rather, each kṣaṇa (instant) contains both finality and continuity. For the practitioner,
  this means samādhi is not an escape from time but a settling into its true nature—a seamless present
  where past and future no longer fragment consciousness. The mind ceases to grasp at what was or anticipate
  what might be.


  4.34 consummates the sequence: kaivalya arises when the guṇas have completed their purpose and return
  to prakṛti, leaving no further reason to serve puruṣa. The Purusha then abides in its own svarūpa (essential
  nature)—not in a transcendent realm but in the simple, unadorned fact of its own consciousness. This
  is not a mystical state but the logical endpoint of Sāṃkhya''s dualism: when prakṛti''s activity ceases,
  the witness stands alone, not because it has gone anywhere but because it has finally ceased to mistake
  itself for the world. The "power of pure consciousness" settling in its own nature is kaivalya—not a
  reward but a recognition.


  Key Terms


  **kaivalya** — Absolute aloneness or isolation; the final liberation of puruṣa from prakṛti, achieved
  when all mental modifications cease and consciousness rests in its own nature.

  **guṇas** — The three primal qualities (sattva, rajas, tamas) that constitute prakṛti; their interplay
  generates all manifest phenomena and mental states.

  **vṛtti** — Mental modifications or fluctuations of the mind; the patterns of cognition that veil puruṣa
  and must be stilled for liberation.

  **puruṣa** — The eternal, unchanging witness-consciousness; the self that is distinct from and untouched
  by prakṛti''s transformations.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.45 & 6.35:** Both texts affirm that liberation involves transcendence of the guṇas''
  influence and a settling into one''s true nature (svarūpa). The Gītā''s emphasis on performing action
  without attachment mirrors Yoga''s recognition that prakṛti continues its work while puruṣa remains
  untouched. Divergence: The Gītā integrates duty (dharma) and devotion as paths within prakṛti''s field,
  whereas Patañjali''s Yoga seeks direct cessation of all mental activity. The Gītā does not advocate
  the complete withdrawal that kaivalya demands.

  **Plotinus, Enneads VI.9.11 (The One):** Both Plotinus and Patañjali describe liberation as a return
  to undifferentiated unity—the One in Neoplatonism, puruṣa in Yoga—where multiplicity dissolves and consciousness
  rests in its own nature beyond subject-object duality. Divergence: Plotinus emphasizes an ascent through
  intellectual intuition and beauty, whereas Yoga prescribes systematic cessation of mental modification
  (nirodha). Plotinus''s One emanates reality; Patañjali''s puruṣa is eternally separate from prakṛti''s
  emanations.

  **Meister Eckhart, ''Sermon 52'' (Gelassenheit—letting go):** Eckhart''s doctrine of releasement (Gelassenheit)
  parallels Yoga''s recognition that liberation is not acquisition but the removal of impediments—a surrender
  of the ego-self to its true nature, which is already present. Divergence: Eckhart frames this within
  Christian mysticism as union with God; Patañjali remains within a dualistic framework where puruṣa never
  merges with prakṛti but recognizes its eternal aloneness. The goal is separation, not union.'
insight: The central philosophical claim of this sūtra is that the true nature of reality is a continuous,
  unbroken stream of moments, each moment being the culmination of its own transformation yet still disc
practice: Observe the subtle shifts in your thoughts and emotions; when you notice a pattern of change
  that no longer serves your growth, acknowledge that the guṇas have completed their work and gently let
  it go.
