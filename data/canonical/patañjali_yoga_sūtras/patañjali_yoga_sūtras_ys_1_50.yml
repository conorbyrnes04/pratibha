  body: तज्जः संस्कारः अङ्‍यासंस्कारप्रतिबन्धी
- kind: iast
  label: IAST
  body: tajjaḥ saṃskāro 'nyasaṃskārapratibandhī
- kind: translation
  label: Pratibha Translation
  body: The impression that arises in this Samadhi blocks other impressions from taking hold, and the
    last truth impressed upon the mind is the blissful cognition of the Purusha. The mind ceases to transform
    itself into anything else besides this impression. The great advantage of this Samadhi is that the
    mind becomes free from all foulness and becomes so pure that it embraces only this blissful cognition.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim here is that a single, sustained impression in Samadhi functions as a gatekeeper, preventing
    the influx of other impressions. This is a contested move in the Yoga tradition: some commentators,
    such as Dvivedi, emphasize the *pratibandhī* (blocking) function of the Samadhi impression, while
    others argue that the Samadhi itself is a state of *samādhi* that transcends all impressions. By situating
    this sūtra within the Sāṃkhya framework, we see that the *saṃskāra* (impression) is not merely a residual
    memory but an active agent that shapes the *citta* (mind). The *purusha* is revealed as the ultimate
    object of this blissful cognition, and the *prakṛti* is rendered inert by the Samadhi’s focus. The
    existential application is clear: by cultivating a single, pure impression, one can achieve liberation
    from the endless cycle of *vṛtti* (mental fluctuations). Dvivedi’s commentary underscores this by
    noting that the Samadhi’s impression “prevents other impressions from gaining ground,” thereby illustrating
    the practical method of mental discipline. This aligns with the broader Yoga goal of *samādhi* as
    a means to *moksha* (liberation).


    Key Terms


    **tajjaha (तज्जः)** — etymology: ‘that which is produced by a cause’; in tradition: the specific impression
    arising in Samadhi; default translation ‘impression’ misses its role as a gatekeeper of consciousness


    **saṃskāra (संस्कार)** — etymology: ‘impression, imprint’; in tradition: the residual imprint that
    shapes *citta*; default translation ‘impression’ overlooks its active, formative function


    **pratibandhī (प्रतिबन्धी)** — etymology: ‘blocking, preventing’; in tradition: the Samadhi’s function
    to block other impressions; default translation ‘blocking’ lacks the nuance of active mental control


    **samādhi (समाधि)** — etymology: ‘union, absorption’; in tradition: a state of focused consciousness
    that transcends ordinary cognition; default translation ‘samadhi’ often treated as a mere state rather
    than a dynamic process


    Cross-Tradition Resonances


    **Yoga Sūtra 1.50:** Structural homology: the use of a single, sustained impression to block other
    impressions mirrors the earlier sūtra 1.49’s emphasis on the mind’s focus

    *Divergence:* While 1.49 speaks of *citta*’s focus, 1.50 specifies the *saṃskāra* as the blocking
    agent, adding a layer of active control


    **Bhaṭṭa 1.1.1:** Both texts describe Samadhi as a state where the mind is free from *vṛtti*; the
    structural pattern of ‘impression blocks other impressions’ is echoed

    *Divergence:* Bhaṭṭa focuses on the *citta*’s stillness, whereas this sūtra emphasizes the *saṃskāra*’s
    role, shifting the locus of control


    **Vātsyāyana 1.1.1:** The idea of a single impression dominating consciousness parallels Vātsyāyana’s
    notion of *pratyakṣa* (direct perception) as the ultimate reality

    *Divergence:* Vātsyāyana frames it as an epistemic claim, while the sūtra frames it as a meditative
    technique'
