sanskrit_devanagari: 'व्यूत्थानानिरोधसंस्कारयोः अभिभवप्रादुर्भावौ नीरोधक्षणचित्तान्वयो नीरोधपरिणामः ॥
  ३.९ ॥


  तस्य प्रशान्तवाहितः संस्कारात् ॥ ३.१० ॥


  सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समादिपरिनामः ॥ ३.११ ॥


  ततः पुनः शान्तोदितौ तुल्यप्रत्यायौ चित्तस्यैकाग्रतापरिनामः ॥ ३.१२ ॥'
sanskrit_iast: 'vyutthānanirodhasaṃskārayor abhibhavaprādurbhāvau nirodhakṣaṇacittānvayo nirodhapariṇāmaḥ
  || 3.9 ||


  tasya praśāntavāhitā saṃskārāt || 3.10 ||


  sarvārthataikāgratayoḥ kṣayodayau cittasya samādhipariṇāmaḥ || 3.11 ||


  tataḥ punaḥ śāntoditau tulyapratyayau cittasyaikāgratāpariṇāmaḥ || 3.12 ||'
translation_literal: '**3.9** When the subliminal impressions (saṃskāra) of emergence (vyutthāna) and
  cessation (nirodha) are eclipsed and brought forth in turn, the mind''s transformation into cessation
  (nirodhapariṇāma) follows the moment of cessation (nirodhakṣaṇa).

  **3.10** From that, a serene flow (praśāntavāhitā) arises through subliminal impression (saṃskāra).

  **3.11** The mind''s transformation into absorption (samādhipariṇāma) is the waning of multiplicity
  and the arising of one-pointedness (taikāgratā).

  **3.12** Then again, when the peaceful and the emergent states bear equal impressions (pratyaya), the
  mind''s transformation into one-pointedness (ekāgratāpariṇāma) occurs.'
commentary: 'Sūtras 3.9–3.12 trace a single arc: the mind''s transformation from oscillation into unified
  stillness through the stabilization and eventual transcendence of its own impressional activity. The
  cluster moves from the moment of interception (nirōdha-kṣaṇa, 3.9)—where the mind''s rise-and-fall ceases—through
  the steady cultivation of impressions (saṃskāra, 3.10), the dynamic reorientation of concentration (3.11),
  and finally to the equipoise of suppressed and revived mental states (3.12). The central insight is
  that prakṛti''s own mechanism—the patterned flux of vṛtti—becomes the instrument of its own cessation.
  Rather than imposing external force, the yogi recognizes that the mind''s habitual oscillations, when
  made conscious and steady, naturally converge toward a threshold where all transformation collapses
  into witness-awareness. This is not annihilation but recognition: the puruṣa was always distinct from
  the mind''s activity; stabilized impressions simply make that distinction unmistakable. Sūtra 3.10''s
  claim that steady flow arises from impressions is not a contradiction but a paradox—the mind''s own
  momentum, redirected inward through practice, exhausts itself. By 3.12, the opposites (suppressed/revived,
  rising/falling) are held in simultaneous presence without preference; the mind becomes transparent to
  its own stillness. The Sāṃkhya architecture is preserved: prakṛti (the mind''s transformations) does
  not cease to exist but ceases to obscure puruṣa (the unchanging witness). This is kaivalya not as escape
  but as recognition—the mind''s final transformation is the recognition that it was never the self.


  Key Terms


  **nirōdha-kṣaṇa** — The moment of interception where mental fluctuations cease and the mind becomes
  a still, witnessing presence

  **saṃskāra** — Impressions or habitual patterns that, when stabilized, become the vehicle for the mind''s
  convergence toward samādhi

  **vṛtti** — Mental modifications or fluctuations that arise from prakṛti and are the substance of ordinary
  consciousness

  **kaivalya** — Liberation; the final recognition of puruṣa''s absolute distinctness from prakṛti''s
  transformations


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.35 (Arjuna''s doubt about the restless mind; Kṛṣṇa''s reply on steady practice):**
  Both texts affirm that the mind''s restlessness is not overcome by force but by steady, habitual cultivation
  (abhyāsa); the Gītā''s ''practice with non-attachment'' parallels Yoga Sūtra 3.10''s emphasis on steady
  impressions as the path to stability Divergence: The Gītā frames stability within devotional surrender
  (bhakti) and duty (dharma), whereas the Yoga Sūtras remain strictly phenomenological, treating the mind''s
  stabilization as an autonomous technical achievement independent of theistic orientation

  **Plotinus, Enneads III.8 (on the soul''s ascent through self-knowledge and the cessation of multiplicity):**
  Plotinus describes the soul''s return to the One through the dissolution of discursive thought into
  unified vision; like Yoga Sūtra 3.12''s equipoise of opposites, this is a transcendence of duality through
  recognition rather than negation Divergence: Plotinus posits an ontological hierarchy (the One, Intellect,
  Soul) toward which ascent occurs, whereas Patañjali''s puruṣa is not hierarchically above prakṛti but
  simply other—a lateral distinctness rather than a vertical transcendence

  **Epictetus, Enchiridion 1 (on what is and is not in our control; the freedom of assent):** Both traditions
  locate freedom not in the suppression of impressions but in the shift of attention: Epictetus teaches
  that we control our assent to impressions, not the impressions themselves; Yoga Sūtra 3.10–3.12 similarly
  shows that steadiness arises from redirected awareness, not eradication Divergence: Epictetus remains
  within the framework of rational choice and virtue, whereas the Yoga Sūtras point toward a pre-rational,
  non-volitional samādhi where even the sense of ''choosing'' dissolves into witness-awareness'
insight: The passage asserts that at the moment of samādhi the mind’s content collapses into a single,
  undifferentiated awareness, where the only discernible states are the repressed and the revived.
practice: You repeatedly bring your attention to the same mental impression, allowing it to rise often
  enough that it becomes a steady, habitual pattern in your mind.
