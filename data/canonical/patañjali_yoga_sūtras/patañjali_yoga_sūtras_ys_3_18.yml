- kind: commentary
  label: Pratibha Commentary
  body: 'The sūtra asserts that the mind’s own activator impressions (saṃskāra) serve as the immediate
    cause of direct perception (sākṣat) of knowledge (jñāna) regarding one’s earlier births. This claim
    foregrounds the epistemic autonomy of the self: the self, through disciplined attention (saṃyama),
    accesses its own stored impressions without external mediation. The contested move lies in treating
    saṃskāra as both a causal agent and a source of knowledge; some commentators read it as merely a residual
    imprint, while others, following the Sāṃkhya ontology, elevate it to a generative principle. By situating
    this process within the broader Yoga framework—where the mind’s fluctuations (vṛtti) are subdued (samādhi)
    to reveal the true self (puruṣa)—the sūtra offers an existential method: one learns to observe one’s
    own mental impressions, thereby uncovering the continuity of consciousness across lifetimes. This
    practice aligns with the Satchidananda insight that “impressions, knowledge of past birth is obtained,”
    underscoring that the act of perceiving these impressions is itself a form of self‑realization. In
    daily life, this translates into mindful inquiry: when a thought or feeling arises, one asks, “What
    past experience does this reflect?”—thereby turning ordinary cognition into a portal to the soul’s
    history.


    Key Terms


    **saṃskāra (संस्कार)** — root संस्कृत ‘to act’ + –कार ‘doer’ → ‘activator impression’ (mind’s stored
    imprint); in Sāṃkhya, it is the causal principle of materiality, whereas the default translation ‘impression’
    overlooks its generative role.


    **sākṣat (साक्षात्)** — direct, immediate; literally ‘face‑to‑face’; in Yoga, it denotes perception
    without mediation, contrasting with indirect (paroksha) knowledge.


    **karaṇāt (कारणात्)** — from the cause; here it signals that the perception arises from the very act
    of saṃskāra, highlighting the self‑causal nature of cognition.


    **pūrva (पूर्व)** — previous, prior; in this context it specifies temporal precedence, marking the
    knowledge as pertaining to earlier births rather than the present.


    Cross-Tradition Resonances


    **Patanjali YS 1.1 – Yogaś citta‑vṛtti‑nirodhaḥ:** Both verses posit that knowledge arises from the
    mind’s own processes (citta and vṛtti) rather than external senses; structurally, each uses a causal
    chain ending in jñāna.

    *Divergence:* YS 3.18 specifies the causal agent as saṃskāra and the mode of perception as direct
    (sākṣat), whereas YS 1.1 remains generic, focusing on the cessation of mental fluctuations.


    **Patanjali YS 3.19 – Saṃskāra‑sākṣat‑karaṇāt‑pūrvajātijñānam:** The next sūtra repeats the structure
    but adds the explicit reference to prior birth, reinforcing the continuity of consciousness.

    *Divergence:* YS 3.18 stops at the causal mechanism, leaving the content of knowledge implicit; YS
    3.19 explicitly identifies the content, thereby expanding the epistemic claim.


    **Sāṃkhya Tattva‑bhāṣya – Prakṛti‑saṃskāra‑paricchedam:** Both texts treat saṃskāra as a manifestation
    of prakṛti’s causal activity; the structural similarity lies in attributing causation to an internal
    principle.

    *Divergence:* While the Tattva‑bhāṣya frames saṃskāra within the dualism of puruṣa and prakṛti, YS
    3.18 presents it as a self‑sufficient epistemic tool, thereby sidestepping the dualistic ontology.'
