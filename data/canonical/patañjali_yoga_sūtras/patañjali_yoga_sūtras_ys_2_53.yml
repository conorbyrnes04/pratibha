sanskrit_devanagari: धारणाः च योग्यता मनसः
sanskrit_iast: dhāraṇāsu ca yogyatā manasaḥ
translation_literal: Fitness for the practice of concentration belongs to the mind.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on the prerequisites and capacities
  needed for yoga practice. The term dhāraṇāsu (in concentrations, plural) refers to the sustained focusing
  of attention on a single point—a foundational technique in classical yoga. Yogyatā means fitness, readiness,
  or suitability; it denotes the capacity or qualification required. Manasaḥ (of the mind) makes clear
  that this fitness is a property of the mind itself.


  The sūtra asserts a simple but profound truth: the ability to concentrate is not external to the mind—it
  is an inherent capacity that the mind possesses. This stands in contrast to a common misunderstanding
  that concentration is something foreign that must be imposed upon an unruly mind. Rather, the mind has
  a natural aptitude for dhāraṇā (holding, fixing attention). The practice of yoga works by awakening
  and refining this latent fitness.


  Within the Yoga–Sāṃkhya framework, the mind (manas) is understood as a subtle instrument of perception
  and cognition. Its fitness for concentration is not a moral achievement but a recognition of its inherent
  nature. When obstacles (antarāya) are removed—distractions, restlessness, doubt, physical discomfort—this
  innate capacity naturally expresses itself. The sūtra thus encourages the practitioner: you are not
  building concentration from nothing; you are uncovering what is already present.


  Key Terms


  **dhāraṇā** — Concentration; the fixing or holding of attention on a single point, object, or concept.

  **yogyatā** — Fitness, suitability, readiness, or inherent capacity to perform a function.

  **manas** — Mind; the subtle organ of cognition and internal perception in Sāṃkhya–Yoga philosophy.'
insight: The central claim of this verse is that the capacity for action (yogyatā) is not an inherent
  trait but arises from the disciplined application of attention (dhāraṇā).
practice: When your attention fractures across multiple thoughts today, pause and notice which single
  thing—a sound, sensation, or image—your mind naturally settles on without effort. Rest there for three
  breaths, recognizing this as your mind's own fitness already at work, not something you must force into
  being.
