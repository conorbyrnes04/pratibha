pratibha_layers:
- kind: original
  label: Original
  body: ते ह्लादपरितापफलाः पुण्यापुण्यहेतुत्वात्
- kind: iast
  label: IAST
  body: te hlādaparitāpaphalāḥ puṇyāpuṇyahetutvāt
- kind: translation
  label: Pratibha Translation
  body: 'They (the three: class, life, and experience) enjoy pleasure as the fruit of their actions, because
    the cause is virtue or vice.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Sūtra asserts that pleasure is not an intrinsic quality of the self but a contingent outcome
    of the causal chain of action. The three refer to the triad of *kāla* (class), *jīvana* (life), and
    *anubhūti* (experience) that together constitute the lived reality of the practitioner. By stating
    that pleasure is a *phala* (fruit) of *hetu* (cause), the text foregrounds the causal integrity of
    the Sāṃkhya–Yoga framework: *prakṛti* (nature) produces *vyāsa* (action), which yields *phala* (fruit).
    The implication for the practitioner is that pleasure is a sign, not a goal; it is a diagnostic of
    the efficacy of action. This aligns with the Yoga principle that *samādhi* is the cessation of *vṛtti*
    (mental fluctuations) and that true liberation (*moksha*) is achieved when the *purusha* (consciousness)
    is disentangled from the *prakṛti*‑generated *phala*. The Dvivedi commentary’s emphasis on virtue
    or vice as the causal determinant mirrors the Sāṃkhya notion of *gunas* (qualities) shaping the outcome.
    Thus, the sūtra invites the practitioner to cultivate *dharma* (righteous action) so that the resulting
    pleasure is a wholesome sign of progress rather than a source of attachment. This existential application
    underscores that the ultimate aim is not pleasure itself but the insight that pleasure arises from
    action and can be transcended through disciplined practice.


    Key Terms


    **hlādaparitāpa (ह्लादपरिताप)** — etymology: hla (pleasure) + para (beyond) + tapa (heat, austerity)
    -> beyond-pleasure austerity; tradition meaning: the state of enduring pleasure beyond ordinary desire;
    default translation misses the nuanced link to austerity and transcendence


    **puṇya (पुण्य)** — etymology: puṇ (good) + ya (suffix) -> merit; tradition meaning: accumulated virtue
    that influences future actions; default translation often renders as ‘goodness’ but omits its causal
    role as a determinant of *phala*


    **hetutva (हेतुत्व)** — etymology: hetu (cause) + tv (nominalizer) -> causality; tradition meaning:
    the principle that every effect is bound to a cause; default translation as ‘cause’ fails to capture
    its ontological status as a governing principle in Sāṃkhya


    Cross-Tradition Resonances


    **Bhagavad Gita 2.50:** Both texts assert that the fruit of action is pleasure or pain, and that the
    self is the experiencer; the structural pattern of ‘cause → effect → experience’ is mirrored.

    *Divergence:* The Gita frames the fruit as a result of *karma* performed with detachment, whereas
    the Yoga Sūtra explicitly links the fruit to the moral quality (virtue or vice) of the action, highlighting
    a more direct ethical causality


    **Yoga Vasistha 1.1:** The Vasistha also describes pleasure as a *phala* of *karmas*, using the same
    triadic structure of class, life, and experience.

    *Divergence:* Unlike the Sūtra, the Vasistha expands the triad to include *samskara* (mental impressions),
    thereby broadening the causal network beyond the immediate action


    **Sāṃkhya Karika 1.1:** Both texts employ the principle of *hetutva* to explain the emergence of *phala*
    from *vyāsa* (action).

    *Divergence:* The Karika presents *hetutva* as an inherent property of *prakṛti*, whereas the Sūtra
    treats it as a functional determinant that can be altered through ethical conduct'
