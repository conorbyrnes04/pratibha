unit_label: Pleasure as Fruit of Action
title: Pleasure as Fruit of Action
unit_type: sutra
sanskrit_devanagari: ते ह्लादपरितापफलाः पुण्यापुण्यहेतुत्वात्
sanskrit_iast: te hlādaparitāpaphalāḥ puṇyāpuṇyahetutvāt
translation_literal: Those [mental formations] bear fruits of pleasure and pain because they arise from
  causes rooted in virtue and non-virtue.
commentary: 'This sūtra appears in Patañjali''s analysis of how karma—action and its ethical valence—generates
  the texture of mental life. The word *te* (those) refers to the *vāsanās* or *saṃskāras* (latent impressions
  and mental formations) discussed in the preceding context. Patañjali is explaining the mechanism by
  which actions classified as *puṇya* (meritorious, wholesome) and *apuṇya* (demeritorious, unwholesome)
  produce their inevitable experiential consequences: *hlāda* (pleasure, delight) and *paritāpa* (pain,
  distress).


  This is not moral punishment imposed from outside, but rather the intrinsic nature of how conditioned
  action unfolds. A wholesome action—one rooted in clarity, non-harm, and alignment with reality—naturally
  germinates into pleasant experience. An unwholesome action—rooted in delusion, harm, or contraction—naturally
  bears painful fruit. The sūtra grounds the yogin''s ethical practice (*yama* and *niyama*) in direct
  causality, not commandment.


  Crucially, Patañjali is also pointing toward liberation: as long as one acts from the dualistic framework
  of merit and demerit, one remains bound to the pleasure-pain cycle. The goal of yoga is to transcend
  this binary altogether through the cessation of mental formations (*citta-vṛtti-nirodha*), not merely
  to accumulate merit. This sūtra therefore serves both as a justification for ethical conduct and as
  a subtle reminder of its ultimate insufficiency for mokṣa.


  Key Terms


  **puṇya** — meritorious, wholesome action; that which is aligned with truth, non-harm, and clarity

  **apuṇya** — demeritorious, unwholesome action; that which arises from delusion, harm, or contraction

  **vāsanā** — latent impression or subtle trace left by action in the mind; the seed-form of future experience'
insight: The Sūtra asserts that pleasure is not an intrinsic quality of the self but a contingent outcome
  of the causal chain of action.
practice: 'For one week, after each significant action or decision, pause and honestly classify it: Did
  this arise from clarity, compassion, and non-harm (puṇya), or from confusion, self-interest, and harm
  (apuṇya)? Write it down without judgment. Then, over the following days, notice the quality of mental
  states that follow—the texture of ease or friction, clarity or heaviness. You are not seeking reward
  or punishment, but training direct perception of the causal link between action and the mind''s condition.
  This builds the empirical conviction that ethics is not imposed law, but lived physics.'
