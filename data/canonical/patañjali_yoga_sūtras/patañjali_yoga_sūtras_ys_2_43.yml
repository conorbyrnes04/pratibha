- kind: practice
  label: Practice (Abhyasa)
  body: Engage in a disciplined practice that systematically challenges and refines your body and senses—such
    as fasting, controlled breathing, or mindful silence—so that each act of austerity burns away a layer
    of impurity, leading to clearer awareness.
