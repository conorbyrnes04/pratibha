sanskrit_devanagari: कायेन्‍द्रियसिद्धिर् अशुद्धिक्षये तपसः
sanskrit_iast: kāyendriyasiddhir aśuddhikṣaye tapasaḥ
translation_literal: When impurity diminishes through austerity, perfection of body and senses arises.
commentary: 'This sūtra appears in the Yoga Sūtras'' treatment of kriyā-yoga (practical yoga), the preliminary
  discipline that prepares the mind for samādhi. Patañjali identifies tapas—often translated as ''heat''
  or ''austerity''—as one of three foundational practices (alongside svādhyāya and īśvara-praṇidhāna).


  The mechanism here is direct: aśuddhi (impurity, obstruction, or dullness) accumulates in the kāya (body-form)
  and its indriya (sense organs and their governing faculties). This impurity is not merely physical dirt
  but refers to the subtle blockages, rigidities, and obscurations that prevent the body-sense apparatus
  from functioning with clarity and responsiveness. Tapas—disciplined effort, heat-generating practice,
  or sustained austerity—acts as a purifying agent.


  As impurity (aśuddhi) diminishes (kṣaye), two things manifest: kāya-indriya-siddhi, the perfection or
  attainment (siddhi) of the body-sense complex. This is not superhuman power but rather the restoration
  of the body-sense system to its natural, unobstructed state—a prerequisite for deeper yogic work. The
  body becomes stable, responsive, and transparent to the will; the senses become acute without being
  reactive.


  Within Sāṃkhya-Yoga philosophy, this reflects the principle that prakṛti (nature, matter) is inherently
  pure but becomes clouded by rajas (agitation) and tamas (inertia). Tapas burns away these obscurations,
  allowing sattva (clarity, harmony) to predominate. The body-sense apparatus then becomes a reliable
  instrument rather than an obstacle.


  This is not about mortification for its own sake, but about the intelligent use of disciplined effort
  to remove what blocks natural function.


  Key Terms


  **tapas** — Disciplined heat-generating effort or austerity; the practice of sustained, intentional
  exertion to purify and transform.

  **aśuddhi** — Impurity, obstruction, or dullness; the subtle blockages in body and mind that obscure
  natural function.

  **siddhi** — Perfection, attainment, or accomplished state; the restoration of a faculty to its full,
  natural capacity.'
insight: The claim is that tapas, understood as a disciplined burn, functions as a transformative purifying
  agent that erodes both physical and psychic impurities.
practice: 'Daily Tapas Practice: Heat-Building Through Breath and Movement


  Each morning, before other practices, spend 10–15 minutes on this simple austerity:


  1. Sit upright in a comfortable cross-legged or kneeling position.

  2. Begin with 20 rounds of Bhastrikā (bellows breath): forceful, equal inhale-exhale through the nose,
  using the diaphragm to pump the breath. This generates prāṇic heat and clears stagnation.

  3. Follow with 5 minutes of slow, deliberate sun salutations (Sūrya Namaskāra), moving with full attention
  and breath coordination. Move slowly enough that you feel the effort; this is tapas, not cardio.

  4. Finish with 2 minutes of Ujjāyī breath (victorious breath): gentle ocean-like sound on the exhale,
  sitting still. Feel the subtle heat and clarity that has arisen.


  The key is consistency and intention: you are deliberately generating heat and effort to burn away dullness
  and obstruction. Over weeks, you will notice the body becoming lighter, more responsive, and the senses
  sharper and less reactive. This is kāya-indriya-siddhi beginning to manifest.'
