sanskrit_devanagari: क्षणप्रत्योगी परिनामपरान्तनिरग्राह्यः क्रमः
sanskrit_iast: kṣaṇapratiyogī pariṇāmāparāntanirgrāhyaḥ kramaḥ
translation_literal: Succession is that which is grasped only at the endpoint of transformation, corresponding
  to each moment.
commentary: 'This sūtra defines *krama* (succession, sequence, order) as the fundamental structure through
  which change (*pariṇāma*) becomes perceptible to consciousness. Patañjali is answering a critical question:
  if reality is constantly transforming at the atomic or momentary level, how do we experience continuity
  and sequence at all?


  The answer lies in the nature of perception itself. Each *kṣaṇa* (moment, discrete unit of time) generates
  a corresponding transformation. We do not perceive the transformation *during* the moment; rather, we
  grasp it only at the *aparānta* (endpoint, terminus) of that transformation—when one state has completed
  and the next begins. This endpoint is where the discontinuity becomes visible to the mind.


  Within the Yoga–Sāṃkhya framework, this teaching has profound implications. The apparent flow of time,
  causality, and even the sense of a continuous "self" are all constructs built from these discrete moments
  of transformation. The yogi who develops *pratiprasava* (involution of the mind) and keen observation
  can begin to perceive this granular structure directly—seeing how each moment arises and passes, how
  each transformation completes and yields to the next.


  This is not mere intellectual philosophy. It points to a direct meditative insight: when the mind becomes
  sufficiently still and refined, the usual blur of experience resolves into discrete pulses. One begins
  to notice the gaps between thoughts, the discrete nature of sensation, the way consciousness itself
  seems to refresh moment by moment. This recognition weakens the illusion of a solid, continuous, unchanging
  self—a central aim of yoga practice.


  The sūtra also prepares the ground for understanding *nirodha* (cessation). If succession is built from
  moment-endpoints, then the interruption or cessation of that succession—the stopping of the transformation-chain—is
  the gateway to *kaivalya* (liberation).


  Key Terms


  **kṣaṇa** — A discrete moment or instant; the smallest unit of time in Yoga–Sāṃkhya metaphysics.

  **pariṇāma** — Transformation, change, or modification; the continuous process of becoming in manifest
  reality.

  **aparānta** — The endpoint or terminus of a transformation; the boundary where one state completes
  and another begins.'
