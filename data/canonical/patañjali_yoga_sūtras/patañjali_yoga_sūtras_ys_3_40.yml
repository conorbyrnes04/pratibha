- kind: practice
  label: Practice (Abhyasa)
  body: You now consciously direct the upward prāṇa (udāna) from your heart through the crown of your
    head, feeling the subtle current rise and rise, and as it strengthens, you sense your body becoming
    lighter, as if it could lift off the ground.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: By mastery over the udāna nerve current (the upward vital air), one accomplishes levitation over
    water, swamps, thorns, etc. and can leave the body at will.
