unit_label: Mastery of the Upward Current
title: Mastery of the Upward Current
unit_type: sutra
sanskrit_devanagari: समानजयाज् ज्वलनम्
sanskrit_iast: samānajayāj jvalanam
translation_literal: By mastering the upward prāṇa current, one can levitate over water, mud, thorns, and other obstacles,
  and leave the body at will.
commentary: 'The central claim of this verse is that the yogic practitioner, through disciplined control of the udāna prāṇa,
  achieves a transcendental state that transcends physical limitations. The contested move here is the notion that mastery
  of a single prāṇa channel can produce both levitation and the ability to leave the body—an assertion that some commentators
  see as hyperbolic, while others accept it as a symbolic illustration of the yogi’s detachment from the material world. Within
  the Yoga and Sāṃkhya framework, udāna is one of the five prāṇas, and its elevation is linked to the ascent of consciousness
  from prakṛti to puruṣa. The verse underscores the existential application of this control: by mastering the upward flow,
  the practitioner learns to detach from the body’s sensory attachments, thereby attaining samādhi and ultimately realizing
  the distinction between puruṣa and prakṛti. The Satchidananda aphorism reinforces this by equating mastery with the ability
  to “leave the body at will,” suggesting that the yogic body becomes a vessel that can be abandoned when consciousness is
  fully liberated. This aligns with the broader yogic goal of achieving a state where the mind is no longer bound by the body’s
  vicissitudes, allowing one to navigate the world—whether literally or metaphorically—without fear or limitation.


  Key Terms


  **udāna (उदाना)** — etymology: ‘upward’ + ‘flow’ -> tradition meaning: the prāṇa channel that rises from the heart to the
  head; default translation ‘upward prāṇa’ misses its role as the vehicle for transcendence


  **prāṇa (प्राण)** — etymology: ‘breath’ -> tradition meaning: vital life force; default translation ‘breath’ overlooks its
  function as the dynamic energy sustaining all subtle processes


  **samādhi (समाधि)** — etymology: ‘to settle’ -> tradition meaning: state of absorption where mind is still; default translation
  ‘concentration’ omits its transcendental quality of union with puruṣa


  **puruṣa (पुरुष)** — etymology: ‘person’ -> tradition meaning: pure consciousness, the subject; default translation ‘person’
  fails to convey its absolute, unchanging nature


  Cross-Tradition Resonances


  **Yoga Sūtra 1.2:** Both verses use a two-word imperative structure to denote mastery over a subtle energy (samānajayāj
  jvalanam vs. samādhāyāḥ prāṇāḥ)

  *Divergence:* While 1.2 focuses on controlling prāṇa for internal stability, 3.40 extends this control to external phenomena
  (levitation), illustrating a developmental progression


  **Hatha Yoga Pradipika 1.1:** The motif of ‘leaving the body’ appears in both texts, indicating a shared belief in the yogi’s
  ability to detach from the physical form

  *Divergence:* The Hatha text presents it as a mystical experience, whereas the Sūtra presents it as a direct consequence
  of mastering udāna, thereby emphasizing practical technique over mysticism


  **Bādarāṭa Upaniṣad 1.3:** Both texts describe the rising of prāṇa from the heart to the head, symbolizing the ascent of
  consciousness

  *Divergence:* The Upaniṣad uses a more philosophical allegory (the soul’s ascent), while the Sūtra frames it as a tangible,
  physical phenomenon (levitation)'
insight: The central claim of this verse is that the yogic practitioner, through disciplined control of the udāna prāṇa, achieves
  a transcendental state that transcends physical limitations.
practice: You now consciously direct the upward prāṇa (udāna) from your heart through the crown of your head, feeling the
  subtle current rise and rise, and as it strengthens, you sense your body becoming lighter, as if it could lift off the ground.
