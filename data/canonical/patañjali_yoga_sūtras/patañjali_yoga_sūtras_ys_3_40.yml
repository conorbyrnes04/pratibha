  label: Key Terms
  items:
  - term: prāṇa (प्राण)
    definition: 'pra-√an ‘breathe forth’ → vital breath/force -> in “Mastery of the Upward Current”: ‘breath’
      -> tradition meaning: vital life force -> not oxygen alone; the life-current whose regulation alters
      citta’s coverings'
  - term: udāna (उदाना)
    definition: '‘upward’ + ‘flow’ -> tradition meaning: the prāṇa channel that rises from the heart to
      the head -> in “Mastery of the Upward Current”: ‘upward’ + ‘flow’ -> tradition meaning: the prāṇa
      channel that rises from the heart to the head -> ‘upward prāṇa’ misses its role as the vehicle for
      transcendence'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Mastery of the Upward Current”: ‘to settle’
      -> tradition meaning: state of absorption where mind is still -> not trance-entertainment or unconsciousness;
      graded absorption where subject–object friction quiets'
    lemma_id: samadhi
    sense_id: samadhi.yoga
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Mastery of the Upward Current”:
      ‘person’ -> tradition meaning: pure consciousness, the subject -> not ‘person’ as social self; the
      unchanging witness distinct from prakṛti’s display'
  - term: samāna
    definition: 'source-term samāna -> in “Mastery of the Upward Current”: the vital current centered
      at the navel that governs digestion, metabolism, and energetic equilibration throughout the body
      -> default English flattens the technical work this term does here'
