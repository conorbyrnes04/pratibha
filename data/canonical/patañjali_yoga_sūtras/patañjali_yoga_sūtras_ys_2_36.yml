sanskrit_devanagari: सत्यप्रतििष्ठायाम् कर्मफलाश्रयत्वम्
sanskrit_iast: satyapratiṣṭhāyāṃ kriyāphalāśrayatvam
translation_literal: When truthfulness is firmly established, actions and their fruits come to rest upon
  it.
commentary: 'This sūtra appears in the section on the *niyamas* (observances), specifically under *satya*
  (truthfulness). Patañjali teaches that truthfulness is not merely ethical compliance but a transformative
  power that restructures the yogi''s relationship to causality itself.


  The phrase *satyapratiṣṭhāyām* means ''when truthfulness is established'' or ''grounded''—suggesting
  a stable, foundational condition, not a momentary act. *Kriyāphalāśrayatvam* literally means ''the quality
  of being a support or resting place for action and its fruit.'' The word *āśraya* (resting place, refuge)
  is key: it suggests that actions and their consequences naturally orient toward and depend upon the
  truthful person.


  Within the Yoga–Sāṃkhya framework, this reflects a subtle metaphysics. When the mind is rooted in satya—alignment
  with what *is*, rather than distortion or denial—there is no friction between intention, action, and
  outcome. The yogi does not chase results or deny consequences; instead, the natural law of karma (*kriyāphala*)
  becomes transparent and trustworthy. Actions performed from a ground of truth tend toward their proper
  fruit without strain or deception. The yogi''s words and deeds align with reality, so reality itself
  supports their unfolding.


  This is not magical thinking. It is the recognition that truthfulness removes the hidden resistance,
  self-sabotage, and karmic entanglement that ordinarily obscure the direct link between effort and result.
  When you do not lie to yourself or others, your actions are coherent; their fruits arrive without obstruction.


  Key Terms


  **satya** — Truthfulness; alignment with what is; the second niyama, the observance of speaking and
  living in accordance with reality rather than distortion or denial.

  **kriyāphala** — Action and its fruit; the result or consequence that naturally follows from an action,
  governed by the law of karma.

  **āśraya** — Resting place, refuge, or support; that upon which something depends or is grounded.'
insight: The core claim of this aphorism is that *satya* (truthfulness) functions as a metaphysical catalyst
  that transforms effort into effortless attainment.
practice: When you notice yourself about to speak or act, pause and feel where that impulse rests—in habit,
  fear, or what you actually know to be true. Let your words or movements come only from the ground of
  what is, not from what you wish were so, and notice how the consequence settles differently when it
  does.
