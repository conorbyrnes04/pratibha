sanskrit_devanagari: पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः काविल्यम् स्वरूपप्रतिष्ठा वा चितीशक्तिरिति
sanskrit_iast: puruṣārthaśūnyānāṃ guṇānāṃ pratiprasavaḥ kaivalyaṃ svarūpapratiṣṭhā vā citiśaktir iti
translation_literal: The supreme state of independence arises when the qualities (guṇas) dissolve back into Prakṛti, leaving
  no purpose to serve the Purusha; alternatively, the power of pure consciousness settles in its own pure nature.
commentary: 'The claim here is that kaivalya is not a new ontological category but the natural conclusion of the Purusha–Prakṛti
  interaction: when the guṇas cease to act, the Purusha rests in its own nature. This is the contested move that Patañjali
  makes—he does not posit a separate realm of liberation but a state achieved by the withdrawal of the guṇas. In the Sāṃkhya
  framework, Purusha is the passive witness, Prakṛti is the active material ground, and the guṇas are the dynamic modes that
  animate Prakṛti. Liberation is reached when the guṇas, having completed their function of animating Prakṛti, retract themselves;
  Purusha then is no longer engaged in the cycle of action and becomes a pure observer. The existential implication is that
  the practitioner need not seek external conditions for freedom; rather, by mastering the mind‑body system so that the guṇas
  finish their work, one attains a state where consciousness is unbound. This echoes Satchidananda’s observation that “the
  power of pure consciousness settles in its own pure nature,” but the Pratibha view stresses that this settlement is a natural
  consequence of the guṇas’ withdrawal, not a metaphysical insertion. The commentary therefore invites the reader to see kaivalya
  as the inevitable outcome of disciplined practice, not a mystical leap. It also highlights that the Purusha’s rest is not
  passive idleness but an active, self‑sufficient state of being, aligning with the Yoga Sutra’s broader theme of *citta‑vṛtti‑nirodhaḥ*
  leading to *svarūpa‑vasthānam*.


  Key Terms


  **puruṣa (पुरुष)** — Purusha (Sāṃkhya) – the passive, unchanging witness; default translation ‘person’ misses its ontological
  role as the substratum of consciousness


  **guṇa (गुण)** — Guṇa – the three qualities (sattva, rajas, tamas) that animate Prakṛti; default translation ‘quality’ obscures
  their dynamic, constitutive function


  **prakṛti (प्रकृति)** — Prakṛti – the material ground, the unmanifested potential; default translation ‘nature’ fails to
  convey its role as the substrate of all change


  **kaivalya (काविल्यम्)** — Kaivalya – absolute liberation, the state of independence; default translation ‘separation’ neglects
  its meaning as the natural state of Purusha after guṇa withdrawal


  Cross-Tradition Resonances


  **Yoga Sutra 1.1, 1.2, 1.3:** The triad of citta‑vṛtti‑nirodhaḥ leading to svarūpa‑vasthānam mirrors the structure of 4.34
  where the withdrawal of guṇas leads to kaivalya

  *Divergence:* Unlike the early sutras that focus on mind‑control, 4.34 emphasizes the ontological shift of guṇas, highlighting
  a different mechanism of liberation


  **Sāṃkhya Kāṇḍa 2.3:** Both texts describe Purusha as the passive witness and Prakṛti as the active ground; the movement
  of guṇas is a shared theme

  *Divergence:* Sāṃkhya treats the withdrawal of guṇas as a theoretical possibility, whereas Patañjali presents it as the
  experiential endpoint of practice


  **Yoga Sutra 4.31:** The progression from the dissolution of guṇas to the establishment of kaivalya follows the same causal
  chain as the earlier sutras’ description of the dissolution of *kleshas*

  *Divergence:* 4.31 discusses klesha dissolution, while 4.34 focuses on guṇa dissolution, showing a parallel but distinct
  path to liberation'
insight: 'The claim here is that kaivalya is not a new ontological category but the natural conclusion of the Purusha–Prakṛti
  interaction: when the guṇas cease to act, the Purusha rests in its own nature.'
practice: Observe the subtle changes in your thoughts and sensations; when you notice a thought arising, let it pass without
  attachment, allowing the underlying consciousness to settle into its own pure nature.
