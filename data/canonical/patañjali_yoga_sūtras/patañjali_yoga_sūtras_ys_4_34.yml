- kind: practice
  label: Practice (Abhyasa)
  body: Observe the subtle changes in your thoughts and sensations; when you notice a thought arising,
    let it pass without attachment, allowing the underlying consciousness to settle into its own pure
    nature.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: Thus, the supreme state of Independence manifests while t he guṇas reabsorb themselves into Prakṛti,
    having no more purpose to serve the Puruṣa. Or [to look from another angle] the power of pure consciousness
    settles in its own pure nature.
