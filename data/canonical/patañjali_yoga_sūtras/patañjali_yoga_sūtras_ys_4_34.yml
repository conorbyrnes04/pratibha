sanskrit_devanagari: पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः काविल्यम् स्वरूपप्रतिष्ठा वा चितीशक्तिरिति
sanskrit_iast: puruṣārthaśūnyānāṃ guṇānāṃ pratiprasavaḥ kaivalyaṃ svarūpapratiṣṭhā vā citiśaktir iti
translation_literal: When the guṇas, emptied of purpose for the puruṣa, return to their source, that is
  kaivalya—the abiding in one's own nature, or the power of consciousness itself.
commentary: 'This sūtra presents the culmination of yoga: the state of kaivalya, or radical independence.
  It describes the mechanism of liberation in terms native to Sāṃkhya metaphysics.


  The guṇas (sattva, rajas, tamas—the three qualities or strands of matter) exist in constant flux to
  serve a purpose: the experience and evolution of the puruṣa (the witnessing consciousness). They create
  the entire field of mind, sense, and world. As long as the puruṣa mistakes itself for the experiencer—as
  long as it believes the guṇas'' dance is *for it*—bondage persists.


  Kaivalya occurs when the guṇas lose their "purpose" (artha) relative to the puruṣa. This is not annihilation
  but *pratiprasava*—a return to their undifferentiated source, like rivers flowing back to the ocean.
  The guṇas cease their elaborate performance because the puruṣa no longer watches as if watching were
  its nature.


  The sūtra offers two synonymous descriptions of this state:

  1. *Svarūpapratiṣṭhā*: abiding established in one''s own nature—the puruṣa rests as pure witness, untouched
  by the machinery of matter.

  2. *Citiśakti*: the power or radiance of consciousness itself—not consciousness *doing* anything, but
  consciousness recognizing itself as the sole reality.


  This is not trance or blankness. It is the puruṣa''s recognition of its own nature as eternally free,
  untouched by the three guṇas, and complete in itself. The world may continue to appear, but there is
  no longer identification with it, no longer the sense that experience is *happening to me*.


  Key Terms


  **kaivalya** — Radical aloneness or independence; the state in which puruṣa recognizes itself as eternally
  free from the guṇas and their modifications.

  **guṇa** — The three qualities or strands of matter (sattva, rajas, tamas) that compose all manifest
  reality and whose fluctuations create experience.

  **puruṣa** — The witnessing consciousness; the eternal, unchanging subject that is the sole reality
  beyond all material and mental modification.'
insight: 'The claim here is that kaivalya is not a new ontological category but the natural conclusion
  of the Purusha–Prakṛti interaction: when the guṇas cease to act, the Purusha rests in its own nature.'
practice: '**Recognition Practice: The Witness Behind Preference**


  Sit quietly for 10 minutes. Notice any thought, sensation, or emotion that arises. Before reacting to
  it or naming it, pause and ask: *Who is aware of this?* Do not answer with a concept. Simply notice
  that there is an awareness present that is not the thought itself, not the body, not even the feeling.


  Then observe: Does this awareness prefer the thought to go away or stay? Does it judge the sensation
  as good or bad? Usually you will notice that *you* (the conditioned mind) have preferences, but the
  pure awareness behind the noticing has none. It simply registers.


  Repeat this daily for two weeks. The point is not to achieve a state but to recognize the gap between
  the guṇas in motion (thoughts, feelings, sensations) and the unmoved witness. That recognition, deepened,
  is the beginning of kaivalya—the puruṣa''s independence from the guṇas'' purpose.'
