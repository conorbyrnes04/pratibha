sanskrit_devanagari: अतीतानागतं स्वरूपतोऽस्य अध्वाभेदाद् धर्माणाम्
sanskrit_iast: atītānāgataṃ svarūpato 'sty adhvabhedād dharmāṇām
translation_literal: Past and future exist in their own nature because of the distinction of paths in
  the properties of things.
commentary: 'This sūtra addresses a fundamental metaphysical question: do past and future truly exist,
  or are they merely mental constructs? Patañjali''s answer is that they do exist—but not as we ordinarily
  perceive them. The key lies in understanding *adhva-bheda*, the differentiation of paths or sequences.


  In the Yoga–Sāṃkhya framework, all manifest phenomena arise from prakṛti (primordial nature) as successive
  modifications. Each object or event possesses *dharma* (properties, qualities, or characteristic modifications).
  These dharmas are not static; they unfold along a temporal axis. What we call ''past'' is the dharma-configuration
  that has already manifested; what we call ''future'' is the dharma-configuration that has not yet manifested.
  Both exist in prakṛti as potential or actual forms—they are not mere mental projections.


  The distinction between paths (*adhva-bheda*) refers to the different sequences or trajectories through
  which dharmas arrange themselves. A seed contains the future tree not as imagination but as latent potential;
  the fallen leaf contains the past tree in its material form. Both are real modifications of prakṛti''s
  nature.


  This teaching undermines the ordinary mind''s illusion that only the present moment is real. For the
  yogin, recognizing the actual existence of past and future—not as psychological time but as real configurations
  of prakṛti—is essential to understanding how karma operates and how the mind becomes bound to temporal
  succession. Liberation involves seeing through this temporal binding altogether.


  Key Terms


  **dharma** — property, quality, or characteristic modification of a thing; the specific nature or law
  governing an entity''s manifestation

  **adhva-bheda** — distinction or differentiation of paths; the sequential unfolding of different configurations
  or trajectories through time

  **prakṛti** — primordial nature; the field of all manifest forms, qualities, and transformations in
  the Sāṃkhya system'
insight: The sutra asserts that past and future are not separate entities but are inherent in the present,
  the real form of the object.
practice: 'Hold a single object in your hands and trace with your fingertips the sequence of its properties—its
  weight, temperature, texture, color—as they shift moment to moment. As you feel each quality arise and
  pass, whisper aloud: ''This path was, this path is, this path will be,'' recognizing that past, present,
  and future are not in your mind but already present as the unfolding dharmas in the thing itself.'
