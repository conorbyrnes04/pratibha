  - term: dharma (धर्म)
    definition: '√dhṛ ‘uphold’ → property/quality upheld by a substrate -> in “Real Form of Past and Future”:
      the specific nature or law governing an entity''s manifestation -> not only ‘duty/religion’; here
      often a property-phase of an underlying dharmin'
    lemma_id: dharma
  - term: heya (हेय)
    definition: '√hā ‘abandon’ → that which is to be discarded (future suffering) -> in “Real Form of
      Past and Future”: The past and future are present in the real form of the object, because they are
      not divided from the same reality. -> not past pain fixation; the avoidable future duḥkha that viveka
      aims to cut'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Real Form of Past and Future”: the
      fluctuations of consciousness -> not ‘bad thoughts’ only — any cognitive wave (valid cognition,
      error, fantasy, sleep, memory)'
  - term: prakṛti (प्रकृति)
    definition: 'pra-√kṛ ‘bring forth’ → productive nature/matter -> in “Real Form of Past and Future”:
      the mutable, creative principle -> not pastoral ‘Nature’; the tri-guṇa matrix generating all experience
      including mind'
