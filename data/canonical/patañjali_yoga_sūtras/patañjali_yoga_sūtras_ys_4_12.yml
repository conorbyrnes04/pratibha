- kind: translation
  label: Pratibha Translation
  body: The past and future are present in the real form of the object, because they are not divided from
    the same reality.
- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that past and future are not separate entities but are inherent in the present,
    the real form of the object. This claim challenges the conventional temporal distinction that treats
    past and future as distinct moments. In the Yoga–Sāṃkhya framework, time is a product of prakṛti’s
    vṛtti, and the puruṣa’s awareness of these vṛtti is mediated through samādhi. By stating that past
    and future are present in the real form, the sutra invites the practitioner to recognize that the
    mind’s habitual identification with temporal categories is illusory. The existential application is
    that one need not cling to past regrets or future anxieties; instead, one can cultivate a direct,
    non‑dual awareness of the present as the only true reality. This aligns with the Satchidananda insight
    that the past and future are manifested only through differences in characteristics, which are ultimately
    superimposed on the same underlying reality. The sutra therefore serves as a reminder that the real
    form of the object—its pure, unchanging essence—surpasses the fleeting vṛtti of time, and that liberation
    (kaivalya) is achieved by seeing this unity.


    Key Terms


    **svarūpa (स्वरूप)** — etymology: ‘sva’ (own) + ‘rūpa’ (form) → ‘own form’; tradition: the inherent,
    unaltered nature of an object; default translation ‘real form’ misses the ontological claim of non‑dual
    essence.


    **vṛtti (वृत्ति)** — etymology: ‘vṛtti’ (turning, change) → ‘mental modification’; tradition: the
    fluctuations of consciousness; default translation ‘activity’ fails to convey its dynamic, illusory
    character.


    **prakṛti (प्रकृति)** — etymology: ‘prakṛti’ (original nature) → ‘primordial material nature’; tradition:
    the mutable, creative principle; default translation ‘nature’ omits its role as the source of vṛtti.


    Cross-Tradition Resonances


    **Yoga Sūtra 1.2:** Both sutras use the structure ‘X Yā Yā’ to denote the duality of temporal states;
    here ‘atītānāgataṃ’ parallels ‘kāla‑kāla’ in 1.2.

    *Divergence:* While 1.2 speaks of time as a function of prakṛti, 4.12 asserts that past and future
    are contained in the real form, thus subverting the earlier temporal hierarchy.


    **Bhaṭṭa’s Commentary on Yoga Sūtra 4.12:** Bhaṭṭa expands on the idea that ‘adhvabhedād’ (without
    division) refers to the non‑duality of past and future, echoing the sutra’s claim.

    *Divergence:* Bhaṭṭa interprets the sutra as a metaphysical statement about the nature of reality,
    whereas the original text merely states a phenomenological observation.'
