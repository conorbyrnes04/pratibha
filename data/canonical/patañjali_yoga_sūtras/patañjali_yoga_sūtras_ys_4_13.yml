sanskrit_devanagari: ते व्यक्तसूक्ष्मा गुणात्मा नः
sanskrit_iast: te vyaktasūkṣmā guṇātmānaḥ
translation_literal: Those [modifications of mind] are both gross and subtle in nature, constituted of
  the guṇas.
commentary: 'This sūtra appears in the context of Patañjali''s analysis of the mental modifications (vṛtti)
  and their underlying substance. The verse asserts that all mental phenomena—whether they manifest as
  coarse, observable thoughts and emotions or as subtle, barely perceptible impressions and tendencies—share
  a common nature: they are woven from the three guṇas (sattva, rajas, tamas), the fundamental qualities
  of prakṛti (manifest nature).


  Within the Yoga–Sāṃkhya framework, this is crucial. The Self (puruṣa) is utterly distinct from all modifications,
  gross or subtle. By recognizing that *every* mental state—from the loudest anxiety to the quietest underlying
  bias—is made of guṇic substance, the yogin understands that none of these constitute the true witness.
  The gross mind (waking thought, emotion, sensation) is obviously prakṛti. But the subtle mind (saṃskāra,
  vāsanā, the deep-set impressions that color perception before conscious thought) is *also* prakṛti,
  also guṇic, also *not* the Self.


  This dissolves a common trap: mistaking subtle mental peace, refined intuition, or the sense of an inner
  observer for the puruṣa itself. The sūtra says: no. All of it—coarse and fine—is nature. The Self stands
  apart, untouched by this entire spectrum.


  Key Terms


  **vyakta** — gross, manifest, perceptible; the coarse or observable form

  **sūkṣma** — subtle, fine, not directly perceptible; the causal or latent form

  **guṇa** — the three fundamental qualities of prakṛti (sattva, rajas, tamas) that constitute all manifest
  and unmanifest nature'
insight: The passage asserts that the self (ātmā) is inseparable from the subtle manifestations of the
  guṇas.
practice: 'For one week, practice **layered witnessing**. Each morning and evening, sit quietly for 10
  minutes. First, notice gross mental content: thoughts, feelings, bodily sensations. Simply name them:
  "thinking," "feeling tense," "hearing." After 3–4 minutes, shift attention to subtler layers: the *tendency*
  to think before thoughts arise, the *mood* or texture beneath emotion, the barely-conscious preferences
  and aversions shaping what you notice. Do not try to change anything. The point is to recognize that
  both layers—the obvious and the hidden—are *processes*, not your essence. You are the unchanging awareness
  in which both occur. This direct observation weakens identification with the entire spectrum of mental
  nature.'
