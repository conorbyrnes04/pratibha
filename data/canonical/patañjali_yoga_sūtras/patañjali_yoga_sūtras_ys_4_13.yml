- kind: commentary
  label: Pratibha Commentary
  body: 'The passage asserts that the self (ātmā) is inseparable from the subtle manifestations of the guṇas. This is a decisive
    move in the Yoga‑Sāṃkhya synthesis: the self is not a passive observer but an active bearer of the subtle qualities that
    animate prakṛti. By stating that the qualities are ‘manifested and subtle’, the sutra bridges the dualism of puruṣa and
    prakṛti, showing that the self’s nature is not a mere metaphysical abstraction but a lived, experiential reality. In Sāṃkhya,
    the guṇas are impersonal forces; here, they are individuated by the self, thereby providing a concrete locus for practice.
    The existential implication is that one can access the subtle guṇas through disciplined awareness, thereby transforming
    ordinary experience into a vehicle for liberation. This aligns with the Satchidananda insight that the qualities belong
    to the self, emphasizing that liberation is the recognition of one’s inherent subtle nature rather than an external attainment.
    The sutra thus invites practitioners to observe the subtle qualities within themselves, turning inward awareness into
    a means of realizing the self’s true nature.


    Key Terms


    **vyakta (व्यक्त)** — ‘manifest’ -> in Sāṃkhya, the guṇas are impersonal; here, vyakta indicates the self’s active role
    in bringing them into experiential reality.


    **sūkṣma (सूक्ष्म)** — ‘subtle’ -> denotes the fine-grained, non-physical qualities of prakṛti; its pairing with vyakta
    signals the self’s capacity to both manifest and embody subtle forces.


    **guṇa (गुण)** — ‘primal force’ -> the three qualities (sattva, rajas, tamas) that constitute prakṛti; the sutra claims
    these qualities are inherent to the self.


    **ātmā (आत्मा)** — ‘self’ -> in Sāṃkhya, a passive observer; here, it is the bearer of subtle qualities, making it a dynamic
    participant in the evolution of consciousness.


    Cross-Tradition Resonances


    **Yoga Sūtra 4.12:** Both sutras link the self with the guṇas, asserting that the self is the locus of their manifestation.

    *Divergence:* While 4.12 speaks of the self as the source of the guṇas, 4.13 specifies that the qualities are both manifested
    and subtle, adding a layer of experiential nuance.


    **Sāṃkhya Kāṇḍa 1:** Sāṃkhya presents guṇas as impersonal forces; the Yoga sutra reinterprets them as embodied in the
    self.

    *Divergence:* Yoga’s claim of the self’s inherent subtle qualities challenges Sāṃkhya’s purely impersonal view, thereby
    expanding the ontological status of the guṇas.


    **Yoga Sūtra 2.1:** Both sutras emphasize the importance of recognizing the nature of the self for liberation.

    *Divergence:* 2.1 focuses on the distinction between puruṣa and prakṛti; 4.13 directly ties the self to the subtle guṇas,
    offering a more concrete path for practice.'
