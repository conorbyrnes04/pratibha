sanskrit_devanagari: तीव्रसंवेगाणाम् आसन्नः
sanskrit_iast: tīvrasaṃvegānām āsannaḥ
translation_literal: For those whose intensity of practice is sharp and sustained, liberation draws near.
commentary: 'This sūtra (I.21) appears in the context of Patañjali''s discussion of the varying speeds
  at which yoga bears fruit. The word tīvra means acute, fierce, or intense; saṃvega denotes urgency,
  momentum, or the driving force of earnest practice. Āsannaḥ means near or proximate. Together, the verse
  asserts a direct correlation: the fiercer and more sustained one''s commitment to yoga, the closer one
  moves to kaivalya (liberation).


  Within the Yoga–Sāṃkhya framework, this reflects a fundamental principle: yoga is not passive waiting
  but active discernment and discipline. The proximity of liberation is not a reward granted arbitrarily,
  but a natural consequence of the intensity and consistency with which the practitioner engages the eight
  limbs—especially pratyāhāra (sense withdrawal), dhāraṇā (concentration), and dhyāna (meditation). Tīvra-saṃvega
  is not mere enthusiasm or emotional fervor; it is a mature, unwavering commitment rooted in viveka (discrimination)
  and vairāgya (non-attachment).


  Patañjali distinguishes practitioners by their intensity: mild (mṛdu), moderate (madhya), and intense
  (tīvra). Only those with tīvra-saṃvega experience rapid progress. This is not discouraging—it is liberating.
  It tells the practitioner that effort matters, that consistency compounds, and that the goal is not
  distant or arbitrary but directly proportional to the quality of one''s practice.


  Key Terms


  **tīvra** — Intense, acute, sharp; in yoga, refers to the fierceness and consistency of one''s practice.

  **saṃvega** — Urgency, momentum, driving force; the earnest and sustained energy directed toward liberation.

  **āsannaḥ** — Near, proximate, close; indicates the approach or imminence of the goal.'
insight: The claim here is that the samādhi state is not a distant, abstract attainment but is immediately
  accessible to those who possess a certain quality of feeling—specifically, a vigorous, resolute influe
practice: Before you practice today, stand and feel your spine lengthen upward while your feet press down—hold
  this vertical alignment for three breaths, sensing the line of effort that connects earth to sky. Carry
  this same alert posture into your practice itself, and whenever you notice your body or attention beginning
  to slacken, return to that vertical spine-line as a reminder that liberation draws near only through
  the sharpness of sustained engagement, not through comfort.
