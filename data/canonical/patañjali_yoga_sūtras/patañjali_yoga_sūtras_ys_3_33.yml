- kind: commentary
  label: Pratibha Commentary
  body: 'The claim that the totality of experience is produced by a reflective process foregrounds the Yoga school’s epistemic
    stance: perception is not a passive reception but an active, self‑referential act. In this passage the term *prātibhā*
    is used in its technical sense of ‘reflection’ or ‘mirroring’—the mind’s capacity to project the external onto the internal.
    The contested move is the identification of the *whole* (*sarvam*) with the product of this reflection, thereby denying
    any independent, unmediated reality. This aligns with the Sāṃkhya view that all phenomena are manifestations of *prakṛti*
    (nature) and that *puruṣa* (consciousness) merely observes. Yet, unlike Sāṃkhya’s strict dualism, the Yoga text here implies
    that the observer’s reflective faculty is itself a *sāmānya* (common) function that can produce the entire experiential
    field. The implication for practice is that by cultivating a disciplined, focused awareness—what Satchidananda calls *saṁyama*
    on the crown’s light—one can refine the reflective faculty to see the underlying unity of all phenomena. This is an existential
    application: the practitioner learns to recognize that the perceived multiplicity is a mirror image of a single source,
    thereby reducing the illusion of separateness and fostering liberation. The passage also anticipates later yogic techniques
    such as *pratyāhāra* (withdrawal of the senses), where the mind’s reflective power is turned inward, and *dhyāna* (meditation),
    where the reflection becomes a still point of consciousness. Thus, the text offers a concise but profound bridge between
    theory and lived practice, urging the yogi to use the mind’s reflective capacity as a tool for self‑realization.


    Key Terms


    **prātibhā (प्रतिभा)** — from ‘pratibhaḥ’ meaning ‘reflection, manifestation’; in Yoga it denotes the mind’s capacity
    to mirror external reality, a function distinct from passive perception


    **sarvam (सर्वम्)** — ‘the whole’; in Yoga it refers to the totality of experiential phenomena, not an ontological absolute


    **saṁyama (समयम्)** — from ‘samā‑yama’ meaning ‘control, restraint’; in Yoga it is the disciplined regulation of mind
    and senses, a prerequisite for higher meditative states


    **pratyāhāra (प्रत्याहार)** — withdrawal of the senses; a stage where the reflective faculty turns inward, aligning with
    the idea that the whole is produced by reflection


    Cross-Tradition Resonances


    **Yoga Sūtra 3.33:** Both Yoga and Sāṃkhya treat the mind’s reflective faculty as central to perception; the Yoga text
    explicitly states that the whole is manifested by reflection, mirroring Sāṃkhya’s assertion that *prakṛti* is the source
    of all phenomena.

    *Divergence:* Yoga emphasizes the practitioner’s active role in refining this reflection through *saṁyama*, whereas Sāṃkhya
    presents it as a passive, inherent property of *prakṛti*


    **Yoga Sūtra 2.1:** The earlier sutra declares that the mind is the source of all perceptions; 3.33 extends this by specifying
    that the source is the reflective faculty, not merely the mind’s receptive aspect.

    *Divergence:* This move narrows the scope from general cognition to a specific mechanism, thereby sharpening the path
    for practical cultivation


    **Sāṃkhya Kāṇḍa 2:** Both traditions agree that *puruṣa* observes *prakṛti*; 3.33 implies that the observation itself
    is a reflective act, suggesting a more dynamic interaction.

    *Divergence:* Yoga posits that *puruṣa* can influence the reflective process through discipline, whereas Sāṃkhya treats
    it as a fixed, passive observation'
