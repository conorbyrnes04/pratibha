sanskrit_devanagari: प्रातिभाद् वा सर्वम्
sanskrit_iast: prātibhād vā sarvam
translation_literal: Or, all things arise through reflection.
commentary: 'This sūtra appears in Patañjali''s discussion of siddhis—the extraordinary capacities that
  emerge from yogic practice. The term prātibhā means intuitive insight, direct knowing, or luminous understanding
  that arises spontaneously without discursive reasoning. Vā (''or'') signals an alternative means of
  knowledge or manifestation. Sarvam (''all'') refers to the entire field of experience—objects, their
  qualities, relationships, and meanings.


  The sūtra teaches that the yogi''s refined perceptual apparatus can access knowledge of any object or
  domain not through intellectual analysis or sensory gathering, but through a direct, non-mediated reflection
  or mirroring. Just as a perfectly still pond reflects the entire sky without effort or distortion, the
  clarified mind (citta) becomes a transparent medium through which knowledge manifests spontaneously.
  This is not imagination or projection; it is a mode of knowing in which the boundary between knower
  and known temporarily dissolves, and understanding arises whole and immediate.


  Within the Yoga–Sāṃkhya framework, this reflects the principle that consciousness (puruṣa) is eternally
  aware, and that obstacles to knowledge are not inherent to mind but are distortions—ripples, cloudiness,
  identification with mental content. When those distortions settle, the mind becomes a perfect reflective
  surface, and knowledge of ''all things'' becomes available not as accumulated information but as direct
  intuitive presence. This is distinct from ordinary memory or inference; it is a spontaneous knowing
  that arises when the yogic state reaches sufficient subtlety and transparency.


  Key Terms


  **prātibhā** — Intuitive insight or spontaneous knowing; direct luminous understanding that arises without
  discursive reasoning or sensory mediation.

  **citta** — The mind-field or consciousness-stuff; the subtle medium of thought, emotion, and perception
  that becomes clarified through yoga.

  **puruṣa** — Consciousness or the witnessing self; the eternal, unchanging awareness that is the ground
  of all experience in Sāṃkhya–Yoga philosophy.'
insight: 'The claim that the totality of experience is produced by a reflective process foregrounds the
  Yoga school’s epistemic stance: perception is not a passive reception but an active, self‑referential
  act.'
practice: 'Sit in a comfortable upright posture. Bring your attention to the space between your eyebrows
  (ājñā cakra). Without strain, allow your gaze to rest there—not forcing or concentrating hard, but gently
  settling awareness at that point. Now, choose a simple object of nature you know well: a tree, a river,
  a flame, or the ocean. Do not visualize it; instead, allow it to appear in the space of your inner awareness
  as if reflected on a still, dark mirror. Do not think about the object or analyze it. Simply let it
  be present, whole and immediate, as if the knowing itself is happening without your effort. Practice
  for 5–10 minutes daily. Over time, you may notice that knowledge about the object—its qualities, its
  nature, even subtle aspects—arises spontaneously without thinking. This is a gentle entry into prātibhā:
  the direct, unmediated knowing that the sūtra describes.'
