sanskrit_devanagari: 'अविद्यास्मितारागद्वेषाभिनिवेशाः कलेशाः ॥ २.३ ॥


  अविद्या क्षेत्रं उत्तरेषां प्रसुप्ततानुविचिन्नोदाराणाम् ॥ २.४ ॥


  अनीत्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मक्‌ह्यात्मिर् अविद्या ॥ २.५ ॥


  दृग्दर्शनशक्त्योर् एकात्मतेवास्मिता ॥ २.६ ॥


  सुखानुशायी रागः ॥ २.७ ॥


  दुःखानुशयी द्वेषः ॥ २.८ ॥


  स्वरसवाहि विदुषोऽपि तथा रूढ़ोऽभिनिवेशः ॥ २.९ ॥'
sanskrit_iast: 'avidyāsmitārāgadveṣābhiniveśāḥ kleśāḥ || 2.3 ||


  avidyā kṣetram uttareṣāṃ prasuptatanuvicchinnodārāṇām || 2.4 ||


  anityāśuciduḥkhānātmasu nityaśucisukhātmakhyātir avidyā || 2.5 ||


  dṛgdarśanaśaktyor ekātmatevāsmitā || 2.6 ||


  sukhānuśayī rāgaḥ || 2.7 ||


  duḥkhānuśayī dveṣaḥ || 2.8 ||


  svarasavāhī viduṣo ''pi tathārūḍho ''bhiniveśaḥ || 2.9 ||'
translation_literal: '**2.3** Ignorance (avidyā), I-maker (asmitā), attachment (rāga), aversion (dveṣa), and clinging to life
  (abhiniveśa)—these are the afflictions (kleśa).

  **2.4** Ignorance is the field in which the others—whether dormant, attenuated, interrupted, or fully active—take root.

  **2.5** Ignorance is the mistaking of the impermanent for permanent, the impure for pure, suffering for happiness, and the
  not-self for self.

  **2.6** I-maker is the identification of the power of seeing (dṛg) with the power of the seen (darśana), as if they were
  one.

  **2.7** Attachment (rāga) follows in the wake of pleasure.

  **2.8** Aversion (dveṣa) follows in the wake of suffering.

  **2.9** Clinging to life (abhiniveśa), flowing from its own nature, takes root even in the wise.'
commentary: 'The five afflictions (kleśas) form a unified causal structure rooted in a single ontological error: the misidentification
  of puruṣa with prakṛti. Sūtras 2.3–2.5 establish ignorance (avidyā) as the generative field—not mere epistemic absence but
  a positive, self-perpetuating conviction that inverts reality. Avidyā projects eternality onto the impermanent, purity onto
  the impure, goodness onto the harmful, and reality onto the non-real. This inversion is not passive; it actively binds consciousness
  to the flux of nature. From this root ignorance, the remaining kleśas unfold as natural consequences: attachment (rāga)
  and aversion (dveṣa) emerge as the affective response to this false identification, and abhiniveśa (clinging to existence)
  sustains the entire structure even in the learned, who intellectually grasp truth yet remain neurologically bound to the
  survival impulse. The sūtras reveal that ignorance operates across all four mental states (kṣipta, mūḍha, vikṣipta, ekāgra),
  making it not a localized defect but the very condition of embodied consciousness. The practitioner''s task is not to eliminate
  these states through force but to recognize their common source in the false equation of the witnessing self (puruṣa) with
  the witnessed phenomena (prakṛti). Sūtra 2.6''s claim that perception united with the sense of ''I-ness'' generates individual
  identity points to the precise mechanism: the faculty of seeing itself becomes contaminated when reflexively turned inward
  without discernment (viveka). Liberation (kaivalya) requires not suppression of the kleśas but their dissolution through
  the restoration of the puruṣa''s original non-identification with prakṛti''s movements. This is why the sequence moves from
  the ontological (avidyā) through the affective (rāga, dveṣa) to the existential (abhiniveśa)—each layer depends on the one
  before, and each dissolves when the fundamental misidentification is seen through.


  Key Terms


  **avidyā** — Ignorance; the positive misidentification that inverts reality by attributing permanence, purity, and reality
  to the impermanent, impure, and non-real.

  **kleśa** — Affliction or obstacle; the five root causes (avidyā, rāga, dveṣa, abhiniveśa, asmitā) that bind consciousness
  to prakṛti and obstruct samādhi.

  **puruṣa** — Consciousness or witness; the unchanging subject that appears bound when falsely identified with the modifications
  of prakṛti (citta and vṛtti).

  **abhiniveśa** — Clinging to existence; the instinctive attachment to life and fear of annihilation that persists even in
  the learned and sustains the entire kleśa structure.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** Both texts trace suffering to the misidentification of the self with sense-objects and emotional
  reactions. The Gītā warns that dwelling on sense-objects generates attachment, which breeds desire, anger, and delusion—a
  causal chain identical to Patañjali''s kleśa structure. Divergence: The Gītā emphasizes duty (dharma) and surrender to the
  divine as the remedy, whereas Patañjali prescribes viveka (discernment) and disciplined practice (abhyāsa) without invoking
  devotional surrender or cosmic order.

  **Epictetus, Enchiridion 1.1–2:** Both Epictetus and Patañjali locate the root of suffering in false judgments about what
  is ''ours'' and what is ''not ours.'' Epictetus teaches that we suffer not from external events but from our assent to false
  impressions—a mechanism parallel to avidyā''s inversion of reality. Divergence: Epictetus grounds liberation in rational
  assent and moral choice within the social order, whereas Patañjali locates it in the metaphysical separation of puruṣa from
  prakṛti, requiring a dissolution of individual identity rather than its ethical refinement.

  **Dhammapada 1–2:** Both traditions teach that affliction originates in mental misperception: the Dhammapada opens with
  the claim that mind precedes all phenomena, and suffering arises from the illusion of a separate self—echoing Patañjali''s
  avidyā as the root of bondage. Divergence: Buddhism denies a permanent puruṣa altogether (anattā), whereas Patañjali posits
  puruṣa as eternally real but falsely identified with prakṛti; the remedy is recognition of non-identity rather than the
  Buddhist deconstruction of the self-concept itself.'
