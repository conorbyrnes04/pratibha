sanskrit_devanagari: शान्तोदिताव्यापदेःधर्मानुपाती धर्मी
sanskrit_iast: śāntoditāvyapadeśyadharmānupātī dharmī
translation_literal: The substrate (dharmī) follows the sequence of dharmas that are dormant, arising,
  and unmanifest.
commentary: 'This sūtra addresses a fundamental principle of manifestation in Yoga–Sāṃkhya metaphysics:
  the nature of the underlying reality (dharmī, literally ''the bearer of qualities'') in relation to
  the qualities or states (dharmas) it expresses. The three conditions enumerated—śānta (dormant, pacified),
  udita (arisen, active), and avyapadeśya (unmanifest, indeterminate)—describe the cyclical phases through
  which any potentiality moves as it conditions both mind and perception.


  In the context of Patañjali''s system, this operates on multiple registers: the guṇas (sattva, rajas,
  tamas) cycle through these states; the vṛttis (mental modifications) emerge and subside according to
  this pattern; and even the witness-consciousness (puruṣa) appears to undergo apparent transformation
  as it reflects the play of prakṛti''s manifestations.


  The word dharmānupātī (''following the order of dharmas'') is crucial: it suggests that the substrate
  is not static or independent, but rather responsive to and coherent with the sequence of qualities appearing
  and disappearing. This is not a dualistic split but an intimate correlation—the ground participates
  in the rhythm of what arises from it. For the practitioner, this means that by observing the three states
  of any mental or physical phenomenon, one can trace back to the unchanging substratum that permits all
  three states to occur.


  This sūtra bridges Yoga''s phenomenology with its metaphysical foundation, preparing the ground for
  practices of discrimination (viveka) that isolate the witness from the witnessed.


  Key Terms


  **dharmī** — The substrate or bearer; the underlying reality that sustains and permits the manifestation
  of qualities (dharmas).

  **dharma** — Quality, state, or characteristic; in this context, the manifest or potential conditions
  that arise and subside in relation to the substratum.

  **śānta, udita, avyapadeśya** — Three phases of manifestation: dormant/pacified, arisen/active, and
  unmanifest/indeterminate respectively.'
insight: The verse asserts that the substratum itself is dharmī, i.e.
practice: 'Observe a single mental state or sensation over the course of a day—perhaps restlessness, clarity,
  or fatigue. Notice three phases: (1) when it is dormant or absent (śānta), (2) when it is actively present
  and felt (udita), and (3) when it is neither clearly present nor absent, but hovering in potential (avyapadeśya).
  Do not try to change it; simply track which phase it occupies at different moments. By the end of the
  day, ask yourself: What remains constant through all three phases? What is the ''ground'' that allows
  this state to be dormant one moment, active the next, and ambiguous at other times? Rest your attention
  there, in that unchanging substrate, for a few breaths. This simple observation begins to reveal the
  dharmī—the bearer—beneath the play of dharmas.'
