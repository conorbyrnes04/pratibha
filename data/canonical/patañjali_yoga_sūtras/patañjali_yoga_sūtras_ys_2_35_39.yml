sanskrit_devanagari: 'अहिंसाप्रतिष्ठायाम् तस्संनिधौ वैरत्यागः ॥ २.३५ ॥


  सत्यप्रतििष्ठायाम् कर्मफलाश्रयत्वम् ॥ २.३६ ॥


  अस्तेयप्रतिṣ्ठायां सर्वरत्नोऽपस्ठाम् ॥ २.३७ ॥


  ब्रह्मचार्यप्रतिष्ठायाम् वीर्यलाभः ॥ २.३८ ॥


  अपरिग्रहस्थाये जनमकथं तासं बोधः ॥ २.३९ ॥'
sanskrit_iast: 'ahiṃsāpratiṣṭhāyāṃ tatsaṃnidhau vairatyāgaḥ || 2.35 ||


  satyapratiṣṭhāyāṃ kriyāphalāśrayatvam || 2.36 ||


  asteyapratiṣṭhāyāṃ sarvaratnopasthānam || 2.37 ||


  brahmacaryapratiṣṭhāyāṃ vīryalābhaḥ || 2.38 ||


  aparigrahasthairye janmakathaṃtāsaṃbodhaḥ || 2.39 ||'
translation_literal: '**2.35** You firmly establish nonviolence; in your presence all hostility ceases.

  **2.36** When one establishes truthfulness, one rests upon the fruits of action.

  **2.37** When one is firmly established in non‑stealing, all wealth approaches him.

  **2.38** By establishing continence, one gains vigor.

  **2.39** When non‑greed is firmly established, the how and why of one’s birth are thoroughly illuminated.'
commentary: 'These five sūtras form a unified argument: the yama (ethical restraints) are not merely moral prescriptions but
  causal mechanisms that reshape both the practitioner''s inner nature and outer circumstance. The structure is consistent—each
  restraint, when firmly established (pratiṣṭhā), generates a specific fruit (phala)—yet the fruits escalate in subtlety from
  social transformation (2.35) through effortless attainment (2.36), material prosperity (2.37), vital force (2.38), to metaphysical
  illumination (2.39). The underlying logic is Sāṃkhya: the yama work by purifying the citta (mind-stuff) of vṛtti (fluctuations)
  rooted in avidyā (ignorance). When ahiṁsā is established, the practitioner''s citta no longer radiates the subtle vibration
  of enmity, and hostility dissolves in the social field. When satya is established, the mind aligns with prakṛti''s rational
  order, and effort transmutes into spontaneous fruition—the vṛtti cease their distorting work, and the puruṣa perceives results
  directly. When asteya is established, the vṛtti of grasping releases its grip, and wealth flows naturally. When brahmacarya
  is established, vital energy (ojas) consolidates rather than dissipates. Finally, when aparigraha is established, the mind
  releases its entanglement with the guṇas (qualities of nature), and the practitioner glimpses the causal mechanics of rebirth
  itself—the how and why of janma (birth). The cluster thus presents the yama not as external rules imposed by authority but
  as internal alignments that progressively unveil the practitioner''s true nature and the nature of prakṛti. Each restraint
  removes a specific obstruction to the puruṣa''s discernment (viveka). The progression culminates in kaivalya (isolation/liberation):
  the final sūtra''s illumination of birth-causation signals the practitioner''s readiness to transcend the cycle entirely.


  Key Terms


  **pratiṣṭhā** — firm establishment or grounding; the stable internalization of a restraint or virtue

  **phala** — fruit or result; the natural consequence or supernatural gift that arises from established practice

  **vṛtti** — mental modification or fluctuation; the disturbances in citta that obscure the puruṣa''s true nature

  **yama** — ethical restraint or abstention; the first limb of yoga comprising ahiṁsā, satya, asteya, brahmacarya, and aparigraha


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19 & 4.23:** Like the Gītā''s teaching that action performed without attachment yields its fruit naturally,
  the Yoga Sūtras here present ethical restraint as a causal force that operates beyond ordinary effort—satya and asteya function
  as self-fulfilling principles that align the agent with dharma''s inherent order. Divergence: The Gītā emphasizes renunciation
  of desire for results (phala-tyāga) alongside action, whereas these sūtras suggest that proper restraint automatically secures
  results without the need for renunciation; the Gītā''s path requires simultaneous detachment, while Patañjali''s path suggests
  restraint itself generates detachment.

  **Epictetus, Enchiridion 1.1-2:** Both traditions locate freedom in the disciplined alignment of will with what is within
  one''s control—for Epictetus, assent and intention; for Patañjali, the yama and the purification of citta. Both argue that
  this inner alignment transforms the external field: the Stoic sage becomes invulnerable to external harm, and the yogi becomes
  a center of peace. Divergence: Epictetus grounds freedom in rational judgment of what is ''up to us,'' whereas Patañjali
  grounds it in the metaphysical distinction between puruṣa and prakṛti; Stoicism emphasizes cognitive assent, while Yoga
  emphasizes the subtle causal power of established virtue.

  **Dhammapada 223-224 (on sīla, ethical conduct):** The Buddhist teaching that ethical conduct (sīla) naturally generates
  peace, prosperity, and spiritual clarity parallels the Yoga Sūtras'' claim that each yama produces its specific fruit; both
  traditions treat virtue as a causal force, not merely a moral ideal. Divergence: Buddhism emphasizes sīla as the foundation
  for samādhi and paññā (wisdom) within a single path to nirvana, whereas Patañjali presents each restraint as generating
  a distinct, concrete fruit (wealth, vigor, illumination), suggesting a more differentiated metaphysics of ethical causation.'
insight: The central claim of this sūtra is that ethical restraint—specifically, the negation of theft—constitutes the foundational
  condition for the natural influx of prosperity.
practice: Observe each thought and word; if it contradicts truth, immediately correct it, so that your mind rests solely on
  the fruits of honest action.
