      active witnessing aspect'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Mastery of Desire and Non‑Attachment”:
      ‘to turn’ -> tradition: mental fluctuations that obscure purūṣa’s nature -> -> not ‘bad thoughts’
      only — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Mastery of Desire and Non‑Attachment”:
      ‘man’ -> tradition: pure consciousness, distinct from prakṛti -> -> not ‘person’ as social self;
      the unchanging witness distinct from prakṛti’s display'
