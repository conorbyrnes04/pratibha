title: Mastery of Desire and Non‑Attachment
unit_type: sutra
sanskrit_devanagari: दृष्टानुस्रविकविषयवितृणस्य वशिकारसंज्ञा वैराग्यम्
sanskrit_iast: dṛṣṭānuśravikaviṣayavitṛṣṇasya vaśīkārasaṃjñā vairāgyam
translation_literal: Non-attachment is the mastery and recognition of freedom from craving for objects
  perceived through the senses or heard of through tradition.
commentary: 'This sūtra defines vairāgya (non-attachment) not as forced renunciation or grim denial, but
  as a natural mastery—vaśīkāra—that arises when craving (tṛṣṇā) ceases. The verse distinguishes two domains
  of desire: dṛṣṭa (directly perceived through the senses) and anuśravika (known through report, scripture,
  or cultural transmission). A yogi may hear of heavenly pleasures or see an attractive object, yet remains
  unmoved because the root impulse to grasp has been mastered.


  This is not suppression. Patañjali describes a state where the object is still cognized, but the compulsive
  pull toward it dissolves. The mechanism is psychological and energetic: when the mind no longer identifies
  craving as "I want this," the vasana (latent impression) that would normally trigger grasping simply
  does not activate. Vairāgya emerges as a byproduct of discriminative insight (viveka) into the transient
  and ultimately unsatisfying nature of sensory experience.


  Within the Yoga–Sāṃkhya framework, this marks a critical threshold: the practitioner begins to disengage
  the sattva (clarity) of consciousness from rajas (the agitating force of desire). The result is not
  numbness but freedom—the capacity to act without being driven by craving, to perceive without being
  captured by wanting.


  Key Terms


  **vairāgya** — Non-attachment; freedom from craving arising through discriminative insight into the
  nature of sense objects and their transience.

  **vaśīkāra** — Mastery or dominion; the capacity to govern or regulate a faculty or impulse, here applied
  to the mastery of desire.

  **tṛṣṇā** — Craving or thirst; the compulsive pull toward sensory objects or imagined pleasures that
  binds the mind to the cycle of seeking.'
insight: The central claim of this verse is that true non‑attachment is not merely the absence of craving,
  but the *conscious* mastery of desire itself.
practice: 'Today, practice conscious non-engagement with one recurring desire. Choose something you habitually
  crave—a food, a social media check, a thought pattern, a purchase impulse. When the craving arises,
  pause. Do not suppress it or indulge it. Instead, observe it as a visitor: notice where you feel it
  in your body, what story accompanies it, and how long it persists if you simply watch without acting.
  The goal is not to eliminate desire but to recognize that you are not identical to it. You can perceive
  the wanting without being compelled by it. Repeat this small experiment throughout the day. This is
  the seed of vaśīkāra—mastery through clear seeing, not force.'
