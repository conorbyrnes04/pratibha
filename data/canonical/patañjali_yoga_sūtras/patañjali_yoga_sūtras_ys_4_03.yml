sanskrit_devanagari: निमित्तं अप्रयोजकं प्रकृतीनां वरणभेदस तु ततः क्षेत्रिकवत्
sanskrit_iast: nimittam aprayojakaṃ prakṛtīnāṃ varaṇabhedas tu tataḥ kṣetrikavat
translation_literal: The cause is not the activator of nature's constituents; rather, the breaking of
  the barrier happens through that—like a farmer opening an irrigation channel.
commentary: 'This sūtra addresses a fundamental misunderstanding about causation in yoga practice. Patañjali
  clarifies that the *nimittam* (instrumental cause, the yogi''s effort or intention) does not *produce*
  or *drive* the constituents of prakṛti (matter, energy, the manifest world). Instead, the yogi''s practice
  functions as a *remover of obstruction*—a varaṇabheda, a rupture or dissolution of what blocks the natural
  flow.


  The farmer analogy is precise: the farmer does not create water or make it flow uphill. The water already
  exists under pressure, seeking its course. The farmer''s work is to breach the dam or open the sluice.
  Similarly, the yogi does not manufacture prāṇa, kuṇḍalinī, or enlightenment. These capacities exist
  within prakṛti itself. Practice removes the mental, energetic, and structural barriers—ignorance, contraction,
  rigidity—that prevent their natural unfolding.


  This teaching sits at the heart of yoga''s non-dualistic understanding: you are not *making* liberation
  happen through willpower alone. You are removing what prevents it. This reframes effort (tapas) not
  as forcing, but as intelligent obstruction-clearing. It also explains why some practices seem to work
  "effortlessly" once the barrier dissolves—because the energy was always there, waiting.


  Within the Yoga–Sāṃkhya framework, this confirms that prakṛti has its own inherent intelligence and
  momentum (śakti). The yogi''s role is alignment and removal, not creation.


  Key Terms


  **nimittam** — instrumental or efficient cause; in yoga, the yogi''s conscious effort or intention

  **prakṛti** — nature; the field of manifest energy and matter; the dynamic principle of manifestation
  in Sāṃkhya

  **varaṇabheda** — breaking or dissolution of a barrier; the removal of obstruction rather than creation
  of something new'
insight: The passage asserts that the causal factor of evolution is not an extraneous or futile element
  of prakṛti, but rather that the distinctions we observe in nature are merely the field‑like manifestation
practice: '**Barrier-Sensing Breath (5–10 minutes daily):**


  1. Sit comfortably. Close your eyes.

  2. Breathe normally and notice where your breath feels *blocked* or *tight*—in the chest, throat, belly,
  or nostrils. Do not force.

  3. On each exhale, mentally *release* that point. Imagine the barrier softening, not you pushing harder.

  4. Use the image: you are opening a channel, not generating the flow. The breath wants to move; you
  are just removing the dam.

  5. After 5 minutes, notice if the breath has naturally deepened or freed itself.


  This embodies the sūtra: your effort is removal, not production. Over time, this teaches the nervous
  system the difference between striving and allowing.'
