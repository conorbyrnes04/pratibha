- kind: practice
  label: Practice (Abhyasa)
  body: Identify a mental obstacle that blocks your awareness of the present moment and remove it by consciously
    shifting your attention to the breath.
- kind: appendix
  label: Swami Satchidananda (1978, attributed aphorism)
  body: Incidental events do not directly cause natural evolution; they just remove the obstacles as a
    farmer [removes the obstacles in the water course running to the field].
