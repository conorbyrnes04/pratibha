sanskrit_devanagari: तदा द्रष्टुः स्वरूपेऽवस्थानम्
sanskrit_iast: tadā draṣṭuḥ svarūpe 'vasthānam
translation_literal: Then the seer abides in his own nature.
commentary: 'This sūtra (I.3) marks the threshold of yoga''s fulfillment. Patañjali defines yoga itself
  in I.2 as the stilling of mental fluctuations (citta-vṛtti-nirodha); this verse shows what becomes possible
  when that stilling is complete.


  The word *tadā* (then) points to a specific moment: when the mind''s turbulence ceases, the *draṣṭṛ*
  (seer, witness, the subject of perception) naturally settles into *svarūpa* (its own form, intrinsic
  nature). This is not achievement through effort, but rather the natural state that emerges when obstruction
  is removed.


  In the Yoga–Sāṃkhya framework, the seer is *puruṣa*—pure consciousness, eternally distinct from matter
  (*prakṛti*) and the mind (*citta*). Ordinarily, the seer is entangled with mental content: we mistake
  thoughts, emotions, and sensations for ourselves. When citta-vṛtti ceases, this confusion dissolves.
  The seer no longer identifies with the fluctuating mind; it rests in its own luminous, unchanging nature.


  *Avasthānam* (abiding, standing, remaining) suggests stability and ease—not a state to be grasped or
  maintained through strain, but a natural repose. This is the goal of yoga: not the acquisition of powers
  or experiences, but the recognition of what the seer already is, freed from the veil of mental activity.


  Key Terms


  **draṣṭṛ (seer)** — The subject of perception; pure consciousness or puruṣa; the witness that observes
  but is not itself an object.

  **svarūpa (own nature)** — Intrinsic form or essence; the unchanging, self-luminous character of the
  seer when freed from identification with mental content.

  **citta-vṛtti (mental fluctuations)** — The waves or modifications of the mind-stuff; the thought-patterns
  and perceptions that ordinarily veil the seer''s true nature.'
insight: The sutra asserts that the true self, the seer, is not altered by the myriad mental fluctuations
  but remains constant in its own nature.
practice: 'When you catch yourself explaining who you are—your name, role, history, preference—pause mid-sentence
  and ask: who is aware that I am saying this? Notice the silent witnessing presence behind the words,
  untouched by them. Return to that awareness three times today, each time you hear yourself narrating
  yourself.'
