  items:
  - term: hāna (हान)
    definition: '√hā ‘abandon’ → cessation/abandonment as goal -> in “Seer Abides in Himself”: Then the
      seer remains in his own nature. -> not repression; the ending of future suffering’s cause through
      viveka'
  - term: seer (दर्शुः)
    definition: '‘one who sees’ -> Sāṃkhya tradition: the conscious principle (puruṣa) that perceives
      -> in “Seer Abides in Himself”: ‘one who sees’ -> Sāṃkhya tradition: the conscious principle (puruṣa)
      that perceives -> ‘seer’ misses its ontological status as the ultimate, unchanging subject'
  - term: vṛtti (वृत्ति)
    definition: '√vṛt ‘turn, revolve’ → a turning/modification -> in “Seer Abides in Himself”: tradition
      meaning: the changing states of consciousness that obscure the true self -> not ‘bad thoughts’ only
      — any cognitive wave (valid cognition, error, fantasy, sleep, memory)'
  - term: puruṣa (पुरुष)
    definition: '‘person/witness’ in Sāṃkhya — pure awareness as seer -> in “Seer Abides in Himself”:
      tradition meaning: the true self that remains unchanged -> not ‘person’ as social self; the unchanging
      witness distinct from prakṛti’s display'
  - term: samādhi (समाधि)
    definition: 'sam-ā-√dhā ‘settle completely together’ -> in “Seer Abides in Himself”: tradition meaning:
      the culmination of meditation where mind is still -> not trance-entertainment or unconsciousness;
      graded absorption where subject–object friction quiets'
