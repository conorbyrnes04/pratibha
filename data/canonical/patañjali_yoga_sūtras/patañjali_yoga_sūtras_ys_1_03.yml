- kind: commentary
  label: Pratibha Commentary
  body: 'The sutra asserts that the true self, the seer, is not altered by the myriad mental fluctuations
    but remains constant in its own nature. This claim foregrounds the Sāṃkhya distinction between puruṣa
    (consciousness) and prakṛti (matter), and it is the foundational point for the Yoga practice of samādhi:
    a sustained, unchanging awareness. The contested move here is the identification of the seer with
    the ultimate, unchanging consciousness (puruṣa) rather than with the changing phenomena (vrtti). In
    the Yoga and Sāṃkhya traditions, this move is crucial because it delineates the goal of liberation
    as the experiential realization of puruṣa’s eternal, blissful state. The Dvivedi commentary elaborates
    that when the vrtti of the mind are suppressed, only the unchanging seer remains; this is the “Nirbijasamadhi”
    or supreme samādhi. The philosophical import is that the practitioner must learn to anchor attention
    in the seer’s own nature, thereby suspending the constant flux of thoughts and perceptions. Existentially,
    this translates into a practice of present‑moment awareness that does not cling to transient mental
    images but observes them as passing phenomena. The sutra’s brevity masks a profound epistemological
    claim: knowledge of the self is not a conceptual construction but a direct, immediate experience of
    the self’s unchanging nature. This insight underpins the Yoga school’s emphasis on meditation as a
    means to quiet the mind and reveal the pure, unaltered consciousness that is the true subject of experience.


    Key Terms


    **seer (दर्शुः)** — etymology: ‘one who sees’ -> Sāṃkhya tradition: the conscious principle (puruṣa)
    that perceives; default translation ‘seer’ misses its ontological status as the ultimate, unchanging
    subject


    **vrtti (वृत्ति)** — etymology: ‘fluctuation’ -> Sāṃkhya: the manifold modifications of the mind;
    tradition meaning: the changing states of consciousness that obscure the true self; default translation
    ‘thought’ overlooks its role as the obstacle to samādhi


    **puruṣa (पुरुष)** — etymology: ‘person’ -> Sāṃkhya: the immutable, conscious principle; tradition
    meaning: the true self that remains unchanged; default translation ‘person’ misses its metaphysical
    significance


    **samādhi (समाधि)** — etymology: ‘union’ -> Yoga: a state of focused, unbroken awareness; tradition
    meaning: the culmination of meditation where mind is still; default translation ‘concentration’ understates
    its transcendental quality


    Cross-Tradition Resonances


    **Yoga Sūtra 1.3:** Structural homology: the sutra’s single clause mirrors 1.1’s ‘seeker’ clause,
    emphasizing the subject’s role; divergence: 1.3 specifies the seer’s unchanging nature, unlike 1.1
    which merely introduces the seeker

    *Divergence:* The specificity of ‘in his own nature’ expands the abstract notion of the seeker into
    a concrete ontological claim, enabling the subsequent sutras to discuss the mechanics of samādhi


    **Sāṃkhya Karika 2.1:** Both texts assert that puruṣa is distinct from prakṛti and remains unchanged;
    divergence: Sāṃkhya Karika treats puruṣa as a passive observer, whereas the Yoga sutra implies an
    active abiding within the self

    *Divergence:* This active aspect allows Yoga to prescribe meditative practices that cultivate the
    seer’s presence


    **Dvivedi Commentary 1.3:** Dvivedi’s explanation parallels the sutra’s claim that the seer remains
    unchanged amid vrtti; divergence: Dvivedi explicitly names the state as Nirbijasamadhi, a term not
    present in the sutra

    *Divergence:* The sutra’s brevity leaves the nomenclature open, allowing later commentaries to label
    the state differently


    **Patanjali’s Mahābhāṣya 1.3:** Both texts discuss the seer’s abiding in itself; divergence: Patanjali’s
    commentary adds the notion of ‘sattva’ as the quality of the seer, whereas the sutra does not specify
    any quality

    *Divergence:* The omission in the sutra permits a broader interpretation of the seer’s nature, not
    limited to sattva'
