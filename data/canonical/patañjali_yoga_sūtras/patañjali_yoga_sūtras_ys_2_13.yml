sanskrit_devanagari: सति मूल तद्विपाको जत्यायुर्भोगाः
sanskrit_iast: sati mūle tadvipāko jātyāyurbhogāḥ
translation_literal: When the root remains, its fruition follows—birth, lifespan, and experience.
commentary: 'This sūtra appears in the context of Patañjali''s teaching on karma (action) and its binding
  effects. The ''root'' (mūle) refers to the deep-seated impressions (saṃskāra) and latent tendencies
  (vāsanā) that arise from past actions and remain embedded in the subtle body even after those actions
  have concluded. These roots are the karmic seeds that have not yet sprouted into manifest consequence.


  The ''fruition'' (vipāka) is the inevitable maturation of karma—the unfolding of consequences that must
  occur as long as the causal root persists. This fruition manifests in three concrete dimensions of embodied
  existence:


  1. **Jāti** (birth/species/condition): The particular form or circumstance into which one is born—human,
  animal, or other—determined by the weight and nature of past karma.


  2. **Āyus** (lifespan/duration): The length and quality of life granted in this birth, also karmic in
  origin.


  3. **Bhogāḥ** (experiences/enjoyments/sufferings): The specific circumstances, relationships, pleasures,
  and pains that constitute one''s lived reality.


  Patañjali''s point is mechanistic and non-fatalistic: as long as the karmic root exists in latent form,
  its effects must unfold. This is not punishment or reward from a judge, but the natural law of action
  and consequence. The implication is clear—to escape this cycle, one must address the root itself through
  practice (sādhana), not merely manage the fruits. This is why yoga emphasizes the cultivation of non-attachment
  (vairāgya) and the direct realization of puruṣa (pure consciousness) as the means to burn the seeds
  before they sprout.


  Key Terms


  **mūla** — Root; the latent karmic impressions (saṃskāra) and tendencies (vāsanā) that persist in subtle
  form and generate future consequences.

  **vipāka** — Fruition or ripening; the inevitable manifestation of karma''s consequences in the form
  of circumstances, experiences, and conditions.

  **saṃskāra** — Karmic imprint or subliminal activator; the subtle residue of past actions that shapes
  present tendencies and future births.'
