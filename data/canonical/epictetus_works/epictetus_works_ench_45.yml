sanskrit_devanagari: λούεταί τις ταχέως· μὴ εἴπῃς ὅτι κακῶς, ἀλλʼ ὅτι ταχέως. πίνει τις πολὺν οἶνον· μὴ
  εἴπῃς ὅτι κακῶς, ἀλλʼ ὅτι πολύν. πρὶν γὰρ διαγνῶναι τὸ δόγμα, πόθεν οἶσθα, εἰ κακῶς; οὕτως οὐ συμβήσεταί
  σοι ἄλλων μὲν φαντασίας καταληπτικὰς λαμβάνειν, ἄλλοις δὲ συγκατατίθεσθαι.
translation_literal: 'Someone bathes quickly: do not say, “He does it badly,” but only, “He bathes quickly.”
  Someone drinks much wine: do not say, “He does it badly,” but only, “He drinks much.” For before you
  have discerned the guiding conviction, how do you know that it is bad? In this way, you will not find
  yourself taking clear impressions from one thing while giving assent to something else.'
commentary: 'Epictetus begins with deliberately ordinary scenes: a hurried bath, abundant wine. The point
  is not that quick bathing or heavy drinking must be harmless. It is that the bare appearance—ταχέως,
  “quickly,” or πολύν, “much”—does not yet warrant the moral verdict κακῶς, “badly.” The observer has
  seen an action, but has not yet understood the δόγμα: the person’s settled judgment, principle, or reasoning
  behind it.


  The final sentence names the Stoic error precisely. A φαντασία, an impression, presents what appears
  to be the case; συγκατάθεσις, assent, is our further act of endorsing it. To say “he bathes quickly”
  is to stay near what was actually given. To say “he behaves badly” adds an interpretation that may not
  be warranted. The exercise is therefore not indifference to conduct, but care for one’s own faculty
  of judgment: let assent follow understanding rather than outrun it.


  Key Terms


  **ταχέως** — quickly; the observable manner of the action.

  **κακῶς** — badly; the evaluative judgment Epictetus tells us not to rush into.

  **δόγμα** — a settled conviction or guiding judgment underlying conduct.

  **συγκατατίθεσθαι** — to give assent; to endorse an impression as true.


  Cross-Tradition Resonances


  **Matthew 7:1 — “Judge not, that you be not judged.”:** Both teachings interrupt the reflex to pronounce
  on another person from limited outward evidence. Divergence: The Gospel saying frames judgment within
  reciprocity and divine judgment, while Epictetus analyzes the error as premature assent to an impression.

  **Pirkei Avot 2:4 — “Do not judge your fellow until you have reached his place.”:** Both counsel humility
  because another person’s situation and reasons may be unknown to us. Divergence: Pirkei Avot stresses
  sympathetic identification with the other’s condition; Epictetus stresses the logical discipline of
  distinguishing observation from evaluation.

  **Qur’an 49:6 — “If a wicked person comes to you with news, verify it…”:** Each text asks the hearer
  to withhold consequential acceptance until the matter has been properly examined. Divergence: The Qur’anic
  passage concerns verifying reported information in order to avoid harming a community; Epictetus addresses
  one’s immediate judgments about observed behavior.'
practice: 'For one day, whenever you catch yourself judging someone’s behavior, state the scene again
  using only visible facts. Then add: “I do not yet know the δόγμα behind this.”'
