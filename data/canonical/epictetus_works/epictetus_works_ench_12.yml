sanskrit_devanagari: εἰ προκόψαι θέλεις, ἄφες τοὺς τοιούτους ἐπιλογισμούς. ἐὰν ἀμελήσω τᾶν ἐμῶν, οὐχ ἕξω
  διατροφάς· ἐὰν μὴ κολάσω τὸν παῖδα, πονηρὸς ἔσται. κρεῖσσον γὰρ λιμῷ ἀποθανεῖν ἄλυπον καὶ ἄφοβον γενόμενον
  ἢ ζῆν ἐν ἀφθόνοις ταρασσόμενον. κρεῖττον δὲ τὸν παῖδα κακὸν εἶναι ἢ σὲ κακοδαίμονα. ἄρξαι τοιγαροῦν
  ἀπὸ τῶν σμικρῶν. ἐκχεῖται τὸ ἐλάδιον, κλέπτεται τὸ οἰνάριον· ἐπίλεγε ὅτι τοσούτου πωλεῖται ἀπάθεια,
  τοσούτου ἀταραξία· προῖκα δὲ οὐδὲν περιγίνεται. ὅταν δὲ καλῇς τὸν παῖδα, ἐνθυμοῦ, ὅτι δύναται μὴ ὑπακοῦσαι
  καὶ ὑπακούσας μηδὲν ποιῆσαι ὧν θέλεις· ἀλλʼ οὐχ οὕτως ἐστὶν αὐτῷ καλῶς, ἵνα ἐπʼ ἐκείνῳ ᾖ τὸ σὲ μὴ ταραχθῆναι.
translation_literal: 'If you want to make progress, let go of calculations such as these: “If I neglect
  my own affairs, I shall have nothing to eat; if I do not punish my slave, he will turn out wicked.”
  For it is better to die of hunger after becoming free from pain and fear than to live amid plenty while
  disturbed. It is better for the slave to be bad than for you to be unhappy. Therefore begin with small
  things. The little oil is spilled; the little wine is stolen. Say to yourself: “This is the price at
  which freedom from passion is sold; this is the price of tranquility. Nothing is gained for nothing.”
  And when you call your slave, remember that he may not obey; and, even if he does obey, he may do none
  of what you wish. But his situation is not so favorable that your not being disturbed should depend
  on him.'
commentary: 'The passage begins by exposing the apparently practical reasoning that makes our peace conditional:
  food, household order, another person’s behavior. Epictetus does not deny that hunger, spilled oil,
  or disobedience are real inconveniences. Rather, he asks whether the preservation of such external arrangements
  is worth the inner cost of fear and agitation. To “make progress” (προκόψαι) is to stop treating external
  security as the condition of a good life.


  The small domestic losses are a training ground. Ἀπάθεια, not numbness but freedom from enslaving passions,
  and ἀταραξία, undisturbedness, have a price: one must surrender the demand that every possession remain
  safe and every person comply. The final sentence is especially sharp. Another person may fail to obey,
  but that person must not possess the power to determine whether you are disturbed. The passage thus
  relocates responsibility from managing the world to governing one’s own judgment.


  Key Terms


  **προκόψαι** — to make progress, especially in philosophical and ethical formation

  **ἐπιλογισμούς** — calculations or lines of reasoning that rationalize anxiety

  **ἀπάθεια** — freedom from destructive passions and compulsive emotional disturbance

  **ἀταραξία** — tranquility; a condition of being unshaken


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna urges action without attachment to the fruits of action, paralleling
  Epictetus’s refusal to stake one’s peace on outcomes. Divergence: The Gītā situates detached action
  within devotion and dharma, while Epictetus frames the issue chiefly as rational independence from externals.

  **Dhammapada 1–2:** The opening verses make mind and intention central to suffering and well-being,
  much as Epictetus locates disturbance in one’s response rather than in the loss itself. Divergence:
  The Dhammapada develops this through karma, craving, and liberation from rebirth; this Stoic passage
  focuses on present moral freedom and judgment.

  **Matthew 6:25–34:** Jesus’ counsel not to be anxious about food and clothing echoes the challenge to
  fears about provision and survival. Divergence: Matthew grounds freedom from anxiety in trust in God’s
  providential care, whereas Epictetus emphasizes disciplined adjustment of one’s own evaluations.'
practice: 'When a minor frustration occurs today—a delay, spill, broken item, or ignored request—pause
  before reacting. Name the loss plainly, then say: “My calm is not purchased by controlling this.” Take
  one useful action if needed, but do not add resentment to the event.'
