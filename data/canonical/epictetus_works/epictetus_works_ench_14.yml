sanskrit_devanagari: ἐὰν θέλῃς τὰ τέκνα σου καὶ τὴν γυναῖκα καὶ τοὺς φίλους σου πάντοτε ζῆν, ἠλίθιος εἶ·
  τὰ γὰρ μὴ ἐπὶ σοὶ θέλεις ἐπὶ σοὶ εἶναι καὶ τὰ ἀλλότρια σὰ εἶναι. οὕτω κἂν τὸν παῖδα θέλῃς μὴ ἁμαρτάνειν,
  μωρὸς εἶ· θέλεις γὰρ τὴν κακίαν μὴ εἶναι κακίαν, ἀλλʼ ἄλλο τι. ἐὰν δὲ θέλῃς ὀρεγόμενος μὴ ἀποτυγχάνειν,
  τοῦτο δύνασαι. τοῦτο οὖν ἄσκει, ὃ δύνασαι. κύριος ἑκάστου ἐστὶν ὁ τῶν ὑπʼ ἐκείνου θελομένων ἢ μὴ θελομένων
  ἔχων τὴν ἐξουσίαν εἰς τὸ περιποιῆσαι ἢ ἀφελέσθαι. ὅστις οὖν ἐλεύθερος εἶναι βούλεται, μήτε θελέτω τι
  μήτε φευγέτω τι τῶν ἐπʼ ἄλλοις· εἰ δὲ μή, δουλεύειν ἀνάγκη.
translation_literal: 'If you want your children, your wife, and your friends to live forever, you are
  foolish: you are asking for what is not up to you to be up to you, and for what belongs to others to
  be yours. Likewise, if you want your servant not to make mistakes, you are foolish: you want vice not
  to be vice, but to be something else. But if you want, in your desiring, not to fail, that is within
  your power. So practice this: practice what you can do. The master of each person is whoever holds power
  over the things that person wants or does not want—the power to secure them or take them away. Therefore
  whoever wishes to be free should neither desire nor avoid anything that depends on others; otherwise,
  slavery is unavoidable.'
commentary: 'Epictetus opens with deliberately severe language: the wish that loved ones should “always
  live” mistakes a natural love for a claim of possession. What is mortal, independent, and exposed to
  change cannot be made “ours” merely because we love it. The same error appears in wanting another person—the
  παῖς, a household servant or attendant—not to err. Such a wish tries to remake the moral order itself,
  as though κακία, vice or moral failure, could cease to be what it is.


  The turn comes with ὀρεγόμενος μὴ ἀποτυγχάνειν: one can desire without failing if one trains desire
  to seek only what lies within one’s own agency. This is not emotional indifference toward family or
  friends; it is a refusal to hold them hostage to one’s need for security. Epictetus defines mastery
  starkly: whoever can grant or remove the objects of your desire has authority over you. Freedom therefore
  requires redirecting desire and avoidance away from things ἐπʼ ἄλλοις, dependent on others, and toward
  the governance of one’s own moral response.


  Key Terms


  **ὀρεγόμενος** — desiring or reaching toward; the activity of aspiration that must be trained.

  **ἐξουσίαν** — power or authority, especially the power to secure or remove what someone wants.

  **ἐλεύθερος** — free; not subject to another through one’s attachments.

  **δουλεύειν** — to be enslaved; the condition produced by dependence on what others control.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna directs Arjuna toward action rather than possession of its results,
  paralleling Epictetus’s effort to detach aspiration from outcomes beyond one’s command. Divergence:
  The Gītā frames disciplined action within devotion and dharma, whereas Epictetus here grounds freedom
  chiefly in independence from external control.

  **Gospel of Matthew 6:19–21:** Jesus warns against storing treasure where loss is inevitable, much as
  Epictetus warns that attachment to perishable externals exposes a person to bondage. Divergence: Matthew
  redirects the heart toward treasure in heaven; Epictetus directs desire toward what cannot be taken
  from one’s own agency.

  **Mishnah Avot 4:1:** Ben Zoma’s question, “Who is mighty? One who conquers his impulse,” echoes the
  Stoic conviction that genuine strength lies in self-rule rather than command over events or people.
  Divergence: Avot presents self-mastery within a Jewish ethical and communal horizon, while Epictetus
  develops it as a theory of freedom from dependency.'
practice: 'Make two columns: “up to me” and “not up to me.” Put one present worry in the second column,
  then write one response, judgment, or action that belongs in the first. For today, aim your effort only
  at that response, and notice each time your mind tries to demand a guarantee from another person or
  from events.'
