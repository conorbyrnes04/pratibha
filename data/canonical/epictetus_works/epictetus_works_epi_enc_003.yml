unit_label: The Actor Who Does Not Choose the Part
title: The Actor Who Does Not Choose the Part
unit_type: sutra
sanskrit_devanagari: Μέμνησο, ὅτι ὑποκριτὴς εἶ δράματος, οἵου ἂν θέλῃ ὁ διδάσκαλος· ἂν βραχύ, βραχέος·
  ἂν μακρόν, μακροῦ· ἂν πτωχὸν ὑποκρίνασθαί σε θέλῃ, ἵνα καὶ τοῦτον εὐφυῶς ὑποκρίνῃ· ἂν χωλόν, ἂν ἄρχοντα,
  ἂν ἰδιώτην. Σὸν γὰρ τοῦτ' ἔστι, τὸ δοθὲν ὑποκρίνεσθαι καλῶς· ἐκλέξασθαι δ' αὐτὸ ἄλλου.
sanskrit_iast: '*(Greek text. See Key Terms for structural Sanskrit mapping.)*'
translation_literal: 'Remember that you are an actor [*hypokritēs*] in a drama of whatever kind the Director
  [*didaskalos*] chooses — short, if the drama is short; long, if it is long. If the Director wants you
  to play a poor man, play it skillfully. A lame man — the same. A ruler, a private person — the same.
  This is your business: to play the given part well. The choosing of the part belongs to another.'
commentary: 'The *hypokritēs* image is the most theologically charged move in the *Enchiridion*, and it
  is compressed to the point of exploding quietly. In seven lines, Epictetus resolves three of the deepest
  problems in Stoic ethics: theodicy (why do good people suffer bad fates?), personal identity (who am
  I when stripped of social role?), and the relationship between individual agency and cosmic order (*logos*).
  His answer to all three is the same figure: the actor.


  What makes this counterintuitive is that we tend to read "actor" as a diminishment — the Stoic sage
  reduced to a puppet, stripped of genuine authorship. But Epictetus''s frame runs the opposite way. The
  actor who performs a role of poverty with *euhyōs* — skillfully, with natural grace — is doing something
  the audience of the wretched cannot do: they are expressing freedom precisely in the territory most
  would call bondage. The slave who says "I am this role and only this role" is truly enslaved; the one
  who says "I am playing this role on the stage of the cosmos, and I am playing it well" is free in the
  only sense that matters. Identity is relocated from the character to the act of playing.


  The *didaskalos* (director, literally "teacher") is Epictetus''s compressed term for what Stoics call
  the *logos* that governs the cosmos, Providence, Zeus — the rational principle whose script is the ordering
  of all things. This is where §XVII intersects with Stoic theology: the acceptance of one''s given role
  is not fatalism but participation. Marcus Aurelius will later expand this into sustained meditation;
  here it appears as a sharp, unadorned instrument. The practice implied is existential: to enact your
  actual circumstances with the same craft a skilled actor brings to a difficult role — not performing
  happiness, but performing the role''s *own* excellence.


  The Pratibhā translation departs from Higginson by rendering *didaskalos* as "Director" rather than
  "Author" — the original term is specifically theatrical, meaning the one who trains and directs the
  production, not merely the playwright. This matters because it preserves the live, responsive quality
  of the relationship: the sage is in ongoing relationship with the directing *logos*, not reading a fixed
  script alone.


  Key Terms:


  **hypokritēs (ὑποκριτής)** — actor, literally "one who answers from beneath" — in Greek theatrical practice,
  the one who responded from behind the mask, giving voice to the character. The word contains *hypo*
  (under) + *krinō* (to separate, judge, answer) — the actor is one who discriminates from an underlying
  position. Epictetus''s choice of this word is precise: the *hypokritēs* never confuses the mask with
  the face. The skilled actor embodies the character completely while remaining the actor. This is the
  Stoic sage''s relationship to their social role — total engagement without identification.


  **didaskalos (διδάσκαλος)** — director, teacher, trainer — the one who shapes and guides the production.
  Higginson translates "Author," but the theatrical term specifically refers to the director-trainer of
  the ancient Greek drama, who selected actors, assigned roles, and guided performance. Epictetus''s choice
  of *didaskalos* over *poiētēs* (poet/playwright) shifts the metaphor from text-based authorship to live
  direction — the relationship with Providence is ongoing, responsive, and formative, not merely scripted.


  **kalos (καλῶς)** — beautifully, excellently, well — the adverb from *kalos* (beautiful, noble, good).
  The instruction to "play it *kalos*" is not merely competent execution but excellent, noble performance
  — the same word used for moral beauty throughout Greek ethics. This single word connects theatrical
  craft to ethical virtue: playing the part well is not about putting on a brave face but about realizing
  the *aretē* (excellence) appropriate to one''s actual situation.


  Cross-Tradition Resonances:


  **Bhagavad Gītā 3.19–3.22:** Kṛṣṇa instructs Arjuna to act as one who has transcended attachment to
  outcome — and then offers himself as the supreme example: even Kṛṣṇa, who has nothing to gain and nothing
  to lose, continues to act within the cosmic order, for if he did not, the worlds would fall into chaos.
  Like Epictetus''s actor, Kṛṣṇa''s engagement with the role is total and its motivation entirely internal
  to the role''s excellence. *Divergence:* The Gītā''s framework is explicitly devotional — the offering
  of action to the divine, the dissolution of the ego-agent into Brahman-agency. Epictetus''s framework
  is entirely rational: the sage plays the role well because reason shows this to be correct, not out
  of love for the Director. Devotion and discrimination are parallel paths to the same liberation from
  outcome-attachment.


  **Śiva Sūtras 3.9:** *nartaka ātmā* — "The Self is a dancer [*nartaka*]." Kṣemarāja''s commentary on
  this sūtra reads: Śiva performs the cosmic dance in the theater of his own Consciousness, and the yogin
  who recognizes this recognizes that all roles — all phenomenal appearances — are performances of the
  one *ātman*. The structural resonance with §XVII is precise: both use theatrical performance as the
  governing metaphor for the relationship between the absolute subject and its conditional expressions.
  *Divergence:* In the Śaiva frame, the distinction between actor and Director collapses at the level
  of recognition — the dancer *is* the dance *is* the audience. Epictetus maintains the distinction: the
  sage is the actor, *logos* is the Director, and confusion between them is the error. The Śaiva frame
  expands outward to identity; the Stoic frame holds the distinction as the source of freedom.


  **Zhuāngzǐ, Chapter 3 (養生主, "The Secret of Nourishing Life"):** Cook Ding butchers the ox with such
  perfect skill that his knife never encounters resistance — he follows the natural structure, the principle
  (*lǐ* 理) already in things. When the Prince commends his art, Cook Ding says: "What I follow is the
  Tao." Like Epictetus''s actor, Cook Ding demonstrates a mode of engagement that is total, skillful,
  and free — not despite the constraints of the task but through complete attunement to them. *Divergence:*
  Zhuangzi''s model is *wúwéi* — the actor disappears into the action itself, the self effaces in the
  doing. Epictetus''s model retains the actor as a conscious agent performing consciously. Both describe
  the same freedom from ego-investment in outcome, but Zhuangzi reaches it by dissolving the actor, Epictetus
  by clarifying them.'
insight: The *hypokritēs* image is the most theologically charged move in the *Enchiridion*, and it is
  compressed to the point of exploding quietly.
practice: 'Take one role you are currently performing — parent, partner, teacher, student, patient — and
  hold it in mind not as what you *are* but as what you have been given to *play*. For this role, ask:
  what would excellent performance look like, stripped of all concern about how it is received, rewarded,
  or recognized? Not "how can I make this role go better" but "what does this role, played with full craft,
  actually require of me today?" Act from that answer for one encounter, without regard to whether the
  audience — anyone watching — approves or disapproves.


  *Three anchor units; remaining sections (§§II–IV, VI–XVI, XVIII–LI) available for expansion*'
