sanskrit_devanagari: τῆς περὶ τοὺς θεοὺς εὐσεβείας ἴσθι ὅτι τὸ κυριώτατον ἐκεῖνό ἐστιν, ὀρθὰς ὑπολήψεις
  περὶ αὐτῶν ἔχειν ὡς ὄντων καὶ διοικούντων τὰ ὅλα καλῶς καὶ δικαίως καὶ σαυτὸν εἰς τοῦτο κατατεταχέναι,
  τὸ πείθεσθαι αὐτοῖς καὶ εἴκειν πᾶσι τοῖς γινομένοις καὶ ἀκολουθεῖν ἑκόντα ὡς ὑπὸ τῆς ἀρίστης γνώμης
  ἐπιτελουμένοις. οὕτω γὰρ οὐ μέμψῃ ποτὲ τοὺς θεοὺς οὔτε ἐγκαλέσεις ὡς ἀμελούμενος. ἄλλως δὲ οὐχ οἷόν
  τε τοῦτο γίνεσθαι, ἐὰν μὴ ἄρῃς ἀπὸ τῶν οὐκ ἐφʼ ἡμῖν καὶ ἐν τοῖς ἐφʼ ἡμῖν μόνοις θῇς τὸ ἀγαθὸν καὶ τὸ
  κακόν. ὡς, ἄν γέ τι ἐκείνων ὑπολάβῃς ἀγαθὸν ἢ κακόν, πᾶσα ἀνάγκη, ὅταν ἀποτυγχάνῃς ὧν θέλεις καὶ περιπίπτῃς
  οἷς μὴ θέλεις, μέμψασθαί σε καὶ μισεῖν τοὺς αἰτίους. πέφυκε γὰρ πρὸς τοῦτο πᾶν ζῷον τὰ μὲν βλαβερὰ φαινόμενα
  καὶ τὰ αἴτια αὐτῶν φεύγειν καὶ ἐκτρέπεσθαι, τὰ δὲ ὠφέλιμα καὶ τὰ αἴτια αὐτῶν μετιέναι τε καὶ τεθηπέναι.
  ἀμήχανον οὖν βλάπτεσθαί τινα οἰόμενον χαίρειν τῷ δοκοῦντι βλάπτειν, ὥσπερ καὶ τὸ αὐτῇ τῇ βλάβῃ χαίρειν
  ἀδύνατον. ἔνθεν καὶ πατὴρ ὑπὸ υἱοῦ λοιδορεῖται, ὅταν τῶν δοκούντων ἀγαθῶν εἶναι τῷ παιδὶ μὴ μεταδιδῷ·
  καὶ Πολυνείκην καὶ Ἐτεοκλέα τοῦτʼ ἐποίησε πολεμίους ἀλλήλοις τὸ ἀγαθὸν οἴεσθαι τὴν τυραννίδα. διὰ τοῦτο
  καὶ ὁ γεωργὸς λοιδορεῖ τοὺς θεούς, διὰ τοῦτο ὁ ναύτης, διὰ τοῦτο ὁ ἔμπορος, διὰ τοῦτο οἱ τὰς γυναῖκας
  καὶ τὰ τέκνα ἀπολλύντες. ὅπου γὰρ τὸ συμφέρον, ἐπεῖ καὶ τὸ εὐσεβές. ὥστε, ὅστις ἐπιμελεῖται τοῦ ὀρέγεσθαι
  ὡς δεῖ καὶ ἐκκλίνειν, ἐν τῷ αὐτῷ καὶ εὐσεβείας ἐπιμελεῖται. σπένδειν δὲ καὶ θύειν καὶ ἀπάρχεσθαι κατὰ
  τὰ πάτρια ἑκάστοτε προσήκει καθαρῶς καὶ μὴ ἐπισεσυρμένως μηδὲ ἀμελῶς μηδέ γε γλίσχρως μηδὲ ὑπὲρ δύναμιν.
translation_literal: 'Know that the most important part of reverence toward the gods is to hold sound
  beliefs about them: that they exist, that they govern the whole well and justly, and that you have assigned
  yourself to obey them, yield to everything that occurs, and willingly follow it as something brought
  about by the finest intelligence. For in this way you will never blame the gods or charge them with
  neglecting you.


  This cannot happen otherwise unless you remove good and bad from the things not up to us and place them
  only among the things up to us. For if you suppose that any of those external things is good or bad,
  then, whenever you fail to get what you want or fall into what you do not want, you must blame and hate
  those responsible. Every living creature is naturally disposed to flee and turn aside from what appears
  harmful, along with its causes, and to pursue and admire what appears beneficial, along with its causes.
  It is impossible for someone who thinks he is being harmed to take joy in what seems to harm him—just
  as it is impossible to rejoice in the harm itself.


  That is why a father is abused by his son when he does not give him a share of what the child takes
  to be goods. It was this that made Polyneices and Eteocles enemies: each believed tyranny to be a good.
  For this reason the farmer curses the gods, the sailor curses them, the merchant curses them, and so
  do those who lose wives and children. Wherever a person places his advantage, there too he places his
  piety. Thus whoever takes care to desire and avoid as one should is, at the same time, taking care of
  piety.


  It is also fitting to pour libations, sacrifice, and offer first-fruits according to the customs of
  one’s ancestors, doing so with purity—not casually or carelessly, not stingily, and not beyond one’s
  means.'
commentary: 'Epictetus locates εὐσέβεια, “piety” or reverence, first in judgment rather than ceremony.
  To think rightly about the gods is to regard the whole as διοικούντων, governed, “well and justly,”
  and then to take up one’s own station within that order. The demanded response is not passivity but
  ἑκόντα, willing cooperation: obedience and assent to events as expressions of the best understanding.


  The argument turns on τὰ οὐκ ἐφʼ ἡμῖν and τὰ ἐφʼ ἡμῖν, things not in our power and things in our power.
  If health, wealth, office, safety, or even the survival of loved ones are treated as final goods, frustration
  will require an object of accusation: gods, parents, rivals, weather, fortune. Epictetus traces even
  family hatred and political violence to this misplaced valuation. Ritual therefore has a place, but
  it is secondary and must be proportionate, attentive, and clean; its deepest basis is the disciplined
  ordering of desire and aversion.


  Key Terms


  **εὐσέβεια** — Reverence or piety, understood chiefly as right judgment and fitting conduct.

  **ὑπολήψεις** — Beliefs or assumptions; the evaluative judgments that shape one’s response to events.

  **τὰ οὐκ ἐφʼ ἡμῖν** — Things not up to us—the external conditions over which our agency does not rule.

  **ἑκόντα** — Willingly; consenting rather than merely submitting to what occurs.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita likewise directs attention to one’s proper action rather than possession
  of its results, loosening the grip of frustrated expectation. Divergence: The Gita frames this discipline
  through devotional duty to Krishna, whereas Epictetus argues from rational assent to a providentially
  ordered whole.

  **Job 1:21:** Job’s response to devastating loss—receiving both possession and deprivation under God—echoes
  the refusal to make fortune the final measure of good. Divergence: Job remains a dramatic encounter
  with a personal God and undeserved suffering; Epictetus offers a philosophical account meant to prevent
  accusation through revised judgment.

  **Qur''an 2:216:** The verse warns that people may dislike what is good for them or love what is harmful,
  paralleling Epictetus’ suspicion of immediate appearances of benefit and injury. Divergence: The Qur''an
  grounds the warning in God’s superior knowledge, while Epictetus emphasizes the Stoic distinction between
  external events and one’s evaluative agency.'
practice: 'When something unwanted happens today, write two columns: “not up to me” and “up to me.” Put
  the event and its outcome in the first; put your judgment, chosen response, and next honorable action
  in the second. Before acting, say: “I will pursue what is mine to govern, and meet the rest without
  accusation.”'
