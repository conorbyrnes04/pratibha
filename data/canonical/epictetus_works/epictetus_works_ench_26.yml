sanskrit_devanagari: τὸ βούλημα τῆς φύσεως καταμαθεῖν ἔστιν ἐξ ὧν οὐ διαφερόμεθα πρὸς ἀλλήλους. οἷον,
  ὅταν ἄλλου παιδάριον κατεάξῃ τὸ ποτήριον, πρόχειρον εὐθὺς λέγειν ὅτι τῶν γινομένων ἐστίν. ἴσθι οὖν,
  ὅτι, ὅταν καὶ τὸ σὸν κατεαγῇ, τοιοῦτον εἶναί σε δεῖ, ὁποῖον ὅτε καὶ τὸ τοῦ ἄλλου κατεάγη. οὕτω μετατίθει
  καὶ ἐπὶ τὰ μείζονα. τέκνον ἄλλου τέθνηκεν ἢ γυνή; οὐδείς ἐστιν ὃς οὐκ ἂν εἴποι ὅτι ἀνθρώπινον· ἀλλʼ
  ὅταν τὸ αὐτοῦ τινος ἀποθάνῃ, εὐθὺς οἴμοι, τάλας ἐγώ. ἐχρῆν δὲ μεμνῆσθαι, τί πάσχομεν περὶ ἄλλων αὐτὸ
  ἀκούσαντες.
translation_literal: 'We can discern nature’s intention from the cases in which we do not dispute with
  one another. For example, when another person’s child breaks a cup, one is immediately ready to say,
  “Such things happen.” Know, then, that when your own cup is broken, you ought to be in the same condition
  as when another’s was broken. Extend this in the same way to greater things. Someone else’s child or
  wife has died: there is no one who would not say, “That is human.” But when one of a person’s own dies,
  at once it is, “Ah, wretched me!” Yet we ought to remember how we are affected when we hear this same
  news about others.'
commentary: 'Epictetus proposes an observational route to the βούλημα τῆς φύσεως, “nature’s intention”
  or ordering: look at events when they do not yet strike our private interest. A broken cup belonging
  to someone else appears plainly as one of the ordinary things that occur. The point is not that a cup—or
  a beloved person—has no value; it is that our first judgment changes radically when possession and attachment
  enter the scene. What seemed a universal feature of mortal life becomes, in our own case, an intolerable
  exception.


  The passage’s severity lies in its movement from a cup to the death of a child or spouse. “It is human”
  (ἀνθρώπινον) is easy to say at a distance, but Epictetus asks the reader to recall that calm recognition
  when grief becomes personal. This is not an instruction to feel nothing. Rather, it exposes the partiality
  of our judgments and asks for a steadier assent to what is not ours to command. The exercise trains
  the faculty of judgment toward the consistency characteristic of Stoic προαίρεσις: one’s responsible
  moral choice amid events that arrive without permission.


  Key Terms


  **βούλημα** — will, purpose, or intended ordering; here, what nature’s course reveals.

  **φύσεως** — of nature; the larger order of generation, loss, and change.

  **καταμαθεῖν** — to observe closely and learn thoroughly.

  **ἀνθρώπινον** — human, mortal, belonging to the common condition of human life.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** “For one who is born, death is certain” similarly frames death as an inescapable
  feature of embodied existence rather than a personal anomaly. Divergence: The Gītā grounds this teaching
  in the soul’s continuing existence and dharma, whereas Epictetus here emphasizes consistency in human
  judgment.

  **Job 1:21:** Job’s “The LORD gave, and the LORD has taken away” likewise answers devastating loss by
  placing it within an order larger than individual possession. Divergence: Job addresses a personal God
  in worship and anguish; Epictetus’s argument is chiefly therapeutic and philosophical, beginning from
  impartial observation.

  **Montaigne, Essays I.20, “That to Philosophize Is to Learn to Die”:** Montaigne also treats mortality
  as a truth made less tyrannical by repeated reflection before calamity arrives. Divergence: Montaigne’s
  essay often lingers in personal, skeptical reflection, while Epictetus gives a sharp comparative exercise
  aimed at correcting an immediate inconsistency.'
practice: At the day’s end, name one annoyance or loss that happened to someone else and the measured
  words you would naturally offer them. Then apply those exact words to one of your own frustrations.
  Do not deny any feeling; simply notice where your judgment becomes less fair when the cup is yours.
