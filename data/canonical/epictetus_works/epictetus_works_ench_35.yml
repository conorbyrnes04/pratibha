unit_label: Do Not Hide the Right Act
title: Do Not Hide the Right Act
unit_type: chapter
sanskrit_devanagari: ὅταν τι διαγνούς, ὅτι ποιητέον ἐστί, ποιῇς, μηδέποτε φύγῃς ὀφθῆναι πράσσων αὐτό,
  κἂν ἀλλοῖόν τι μέλλωσιν οἱ πολλοὶ περὶ αὐτοῦ ὑπολαμβάνειν. εἰ μὲν γὰρ οὐκ ὀρθῶς ποιεῖς, αὐτὸ τὸ ἔργον
  φεῦγε· εἰ δὲ ὀρθῶς, τί φοβῇ τοὺς ἐπιπλήξοντας οὐκ ὀρθῶς;
translation_literal: Whenever, after discerning a matter, you judge that it must be done, do it—and never
  avoid being seen doing it, even if the many are likely to form some strange opinion about it. For if
  you are acting wrongly, avoid the deed itself; but if you are acting rightly, why fear those who will
  wrongly reproach you?
commentary: 'The passage begins not with rash resolve but with discernment: διαγνούς means having distinguished
  or decided the matter. Only after this examination does the πράσσειν, the doing, follow. Epictetus does
  not commend mere defiance of convention; he demands that one first determine whether the act is genuinely
  ποιητέον, something that ought to be done.


  The real test comes when οἱ πολλοί, “the many,” interpret the action αλλοῖόν τι, as something other
  than it is. Their misunderstanding may tempt a person to conceal a sound deed. Epictetus counters with
  a sharp alternative: if the action is not ὀρθῶς, rightly done, flee the action—not the spectators. But
  if it is right, public blame has no authority to overturn one’s considered judgment. The point is not
  to seek notoriety, but to refuse to let fear of reproach govern one’s moral agency.


  Key Terms


  **διαγνούς** — having discerned or reached a considered judgment.

  **ποιητέον** — to be done; expressing what duty requires.

  **ὀφθῆναι** — to be seen; to come into public view.

  **οἱ πολλοί** — the many, the crowd, whose opinion is treated as unstable.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna directs Arjuna toward faithful performance of the work that belongs
  to him, without making success or failure the measure of action. Divergence: The Gītā frames action
  through dharma, devotion, and detachment from results, whereas Epictetus here stresses rational correctness
  and freedom from the crowd’s blame.

  **Confucius, Analects 4.14:** Confucius advises concern not over lacking recognition, but over becoming
  worthy of recognition—a similar release from dependence on public approval. Divergence: The Analects
  remains deeply concerned with cultivated social relationships and exemplary standing, while Epictetus
  more sharply opposes one’s judgment to the opinions of the many.

  **John 12:42–43:** The Gospel criticizes those who withheld open confession because they preferred human
  praise to divine praise, echoing the danger of hiding conviction from fear of others. Divergence: John
  casts the conflict as fidelity to God and faith in Christ; Epictetus gives no appeal to revelation,
  grounding the issue in ethical discernment.'
practice: 'Before avoiding a necessary action because it may look bad, write down: “What exactly is the
  act? Why is it right or wrong?” If it is wrong, stop; if it is right, perform one modest, visible step
  without explaining yourself defensively.'
