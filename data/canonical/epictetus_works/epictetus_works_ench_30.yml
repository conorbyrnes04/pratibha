sanskrit_devanagari: τὰ καθήκοντα ὡς ἐπίπαν ταῖς σχέσεσι παραμετρεῖται. πατήρ ἐστιν· ὑπαγορεύεται ἐπιμελεῖσθαι,
  παραχωρεῖν ἁπάντων, ἀνέχεσθαι λοιδοροῦντος, παίοντος. ἀλλὰ πατὴρ κακός ἐστι. μή τι οὖν πρὸς ἀγαθὸν πατέρα
  φύσει ᾠκειώθης; ἀλλὰ πρὸς πατέρα. ὁ ἀδελφὸς ἀδικεῖ. τήρει τοιγαροῦν τὴν τάξιν τὴν σεαυτοῦ πρὸς αὐτὸν
  μηδὲ σκόπει, τί ἐκεῖνος ποιεῖ, ἀλλὰ τί σοὶ ποιήσαντι κατὰ φύσιν ἡ σὴ ἕξει προαίρεσις· σὲ γὰρ ἄλλος οὐ
  βλάψει, ἂν μὴ σὺ θέλῃς· τότε δὲ ἔσῃ βεβλαμμένος, ὅταν ὑπολάβῃς βλάπτεσθαι. οὕτως οὖν ἀπὸ τοῦ γείτονος,
  ἀπὸ τοῦ πολίτου, ἀπὸ τοῦ στρατηγοῦ τὸ καθῆκον εὑρήσεις, ἐὰν τὰς σχέσεις ἐθίζῃ θεωρεῖν.
translation_literal: 'Duties are, for the most part, measured by our relationships. He is your father:
  this directs you to care for him, to yield to him in everything, and to bear with him when he insults
  or strikes you. “But he is a bad father.” Were you, then, joined by nature to a good father? No: to
  a father. Your brother does you wrong. Keep, therefore, your own proper position toward him. Do not
  look at what he is doing; look rather at what you can do that will keep your own faculty of choice in
  accordance with nature. For another person will not harm you unless you choose it; you will be harmed
  only when you suppose yourself harmed. In this way, from a neighbor, a citizen, or a general, you will
  discover your duty, if you make a habit of considering relationships.'
commentary: 'Epictetus begins with τὰ καθήκοντα, fitting or appropriate actions, and says that they are
  generally “measured” by σχέσεις, the relations in which one stands. A father’s bad character does not
  erase the fact that he is a father; a brother’s injustice does not cancel one’s own fraternal station.
  This is not praise of cruelty or a claim that abuse is good. It is a discipline of refusing to let another
  person’s conduct dictate the quality of one’s own action.


  The central question is not, “What has he done?” but, “What response will preserve my προαίρεσις in
  accord with nature?” Προαίρεσις is the deliberating moral agency that remains one’s own. Thus injury
  in the decisive Stoic sense is not identical with insult, loss, or a blow: one becomes truly harmed
  when one judges oneself to have been morally damaged. By repeatedly seeing the relation—neighbor, citizen,
  commander—one finds the particular shape of one’s responsibility without surrendering one’s inner freedom.


  Key Terms


  **καθήκοντα** — fitting duties or actions appropriate to one’s situation

  **σχέσεσι** — relationships or relational positions that help determine duty

  **προαίρεσις** — one’s deliberative moral purpose or faculty of choice

  **βλάψει** — will harm; here, harm in the morally decisive sense


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita likewise directs a person toward faithful action in the sphere of duty
  rather than fixation on outcomes controlled by others. Divergence: Its account is grounded in devotion,
  karma, and dharma, whereas Epictetus centers the inviolability of rational moral choice.

  **Matthew 5:39:** Jesus’ instruction not to answer injury with retaliatory violence parallels Epictetus’
  refusal to make another’s blow the measure of one’s response. Divergence: Matthew frames nonretaliation
  within the coming reign of God and enemy-love; Epictetus frames it as protection of one’s own proairesis.

  **Analects 4.18:** Confucius treats filial relation as morally formative and counsels respectful persistence
  even when parents are difficult to correct. Divergence: The Analects stresses ritual propriety and remonstrance
  within family hierarchy, while Epictetus emphasizes inner judgment and endurance.'
practice: 'When a difficult interaction arises today, name the relationship first: “parent,” “colleague,”
  “neighbor,” or “citizen.” Then ask: “What response belongs to my role, and what response keeps my προαίρεσις
  steady?” Choose one concrete action—respectful speech, a clear boundary, patient silence, or practical
  help—without making your peace depend on the other person’s behavior.'
