sanskrit_devanagari: ἐπὶ παντὸς πρόχειρα ἑκτέον ταῦτα· ἄγου δέ μʼ, ὦ Ζεῦ, καὶ σύ γʼ ἡ Πεπρωμένη, ὅποι
  ποθʼ ὑμῖν εἰμι διατεταγμένος· ὡς ἕψομαί γʼ ἄοκνος· ἢν δέ γε μὴ θέλω, κακὸς γενόμενος, οὐδὲν ἧττον ἕψομαι.
  ὅστις δʼ ἀνάγκῃ συγκεχώρηκεν καλῶς, σοφὸς παρʼ ἡμῖν, καὶ τὰ θεῖʼ ἐπίσταται. ἀλλʼ, ὦ Κρίτων, εἰ ταύτῃ
  τοῖς θεοῖς φίλον, ταύτῃ γενέσθω. ἐμὲ δὲ Ἄνυτος καὶ Μέλιτος ἀποκτεῖναι μὲν δύνανται, βλάψαι δὲ οὔ.
translation_literal: 'Keep these words ready for every occasion: “Lead me, Zeus, and you, Fate, wherever
  you have assigned my place. I will follow without hesitation; and if I refuse, made cowardly by it,
  I shall follow all the same. Whoever has given willing assent to necessity is, in our view, wise and
  understands divine things.” “But, Crito, if this is what pleases the gods, let it be so.” “Anytus and
  Meletus may put me to death, but they cannot injure me.”'
commentary: 'This final chapter gathers brief sayings into a discipline of readiness. The opening imperative,
  πρόχειρα ἑκτέον, means that these words are to be kept “at hand”: not admired as literature, but available
  when events press upon us. The speaker asks Zeus and Πεπρωμένη (“Fate,” the allotted course) to lead
  him to the station already assigned. The decisive difference is not whether one will undergo what comes—one
  will—but whether one follows ἄοκνος, without shrinking or delay, or is dragged along after becoming
  κακός, morally degraded by resistance.


  The saying about ἀνάγκη, necessity, does not praise passivity. To have συγκεχώρηκεν, “given assent”
  or “yielded agreement,” is an act of judgment: the person aligns the will with what cannot be otherwise.
  The concluding Socratic words sharpen the Stoic distinction. Anytus and Meletus can affect the body,
  even kill it; they cannot truly βλάψαι, harm the person, because real harm belongs to corrupted character
  and judgment. Fate may govern circumstances, but one’s moral response remains the place where wisdom
  is enacted.


  Key Terms


  **πρόχειρα** — ready to hand; immediately available for use in a crisis.

  **Πεπρωμένη** — Fate; the destined or allotted course of events.

  **ἀνάγκῃ** — necessity; what must be accepted because it cannot be otherwise.

  **βλάψαι** — to harm or damage; here, to inflict genuine moral injury.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** Krishna directs Arjuna toward faithful action without possessive attachment
  to outcomes, much as Epictetus directs the will to cooperate with what arrives. Divergence: The Gita
  emphasizes performing one’s dharma and offering action, whereas this passage concentrates on consenting
  inwardly to an inescapable cosmic order.

  **Qur''an 57:22:** The verse presents events as written before they occur, inviting a posture not shattered
  by loss or intoxicated by gain. Divergence: The Qur''an frames decree within the will of the one personal
  Creator and a relation of worship, while Epictetus speaks in Stoic terms of Zeus, Fate, and rational
  assent.

  **Dhammapada 160:** “One is indeed one’s own protector” parallels the claim that external agents can
  destroy the body without possessing the power to ruin one’s deepest moral good. Divergence: Buddhist
  teaching generally avoids grounding this freedom in obedience to a providential Fate, instead analyzing
  suffering through craving, conduct, and insight.'
practice: 'When something unwelcome happens today, pause before reacting and name it in two columns: “what
  has occurred” and “what is mine to choose now.” Then say quietly: “I may not choose the event, but I
  can follow it without becoming worse,” and take one deliberate, honorable next action.'
