sanskrit_devanagari: οὗτοί σε οἱ διαλογισμοὶ μὴ θλιβέτωσαν ἄτιμος ἐγὼ βιώσομαι καὶ οὐδεὶς οὐδαμοῦ. εἰ
  γὰρ ἡ ἀτιμία ἐστὶ κακόν, οὐ δύνασαι ἐν κακῷ εἶναι διʼ ἄλλον, οὐ μᾶλλον ἢ ἐν αἰσχρῷ· μή τι οὖν σόν ἐστιν
  ἔργον τὸ ἀρχῆς τυχεῖν ἢ παραληφθῆναι ἐφʼ ἑστίασιν; οὐδαμῶς. πῶς οὖν ἔτι τοῦτʼ ἔστιν ἀτιμία; πῶς δὲ οὐδεὶς
  οὐδαμοῦ ἔσῃ, ὃν ἐν μόνοις εἶναί τινα δεῖ τοῖς ἐπὶ σοί, ἐν οἷς ἔξεστί σοι εἶναι πλείστου ἀξίῳ; ἀλλά σοι
  οἱ φίλοι ἀβοήθητοι ἔσονται. τί λέγεις τὸ ἀβοήθητοι; οὐχ ἕξουσι παρὰ σοῦ κερμάτιον· οὐδὲ πολίτας Ῥωμαίων
  αὐτοὺς ποιήσεις. τίς οὖν σοι εἶπεν, ὅτι ταῦτα τῶν ἐφʼ ἡμῖν ἐστιν, οὐχὶ δὲ ἀλλότρια ἔργα; τίς δὲ δοῦναι
  δύναται ἑτέρῳ, ἃ μὴ ἔχει αὐτός; κτῆσαι οὖν, φησίν, ἵνα ἡμεῖς ἔχωμεν. εἰ δύναμαι κτήσασθαι τηρῶν ἐμαυτὸν
  αἰδήμονα καὶ πιστὸν καὶ μεγαλόφρονα, δείκνυε τὴν ὁδὸν καὶ κτήσομαι. εἰ δʼ ἐμὲ ἀξιοῦτε τὰ ἀγαθὰ τὰ ἐμαυτοῦ
  ἀπολέσαι, ἵνα ὑμεῖς τὰ μὴ ἀγαθὰ περιποιήσησθε, ὁρᾶτε ὑμεῖς, πῶς ἄνισοί ἐστε καὶ ἀγνώμονες. τί δὲ καὶ
  βούλεσθε μᾶλλον; ἀργύριον ἢ φίλον πιστὸν καὶ αἰδήμονα; εἰς τοῦτο οὖν μοι μᾶλλον συλλαμβάνετε καὶ μή,
  διʼ ὧν ἀποβαλῶ αὐτὰ ταῦτα, ἐκεῖνά με πράσσειν ἀξιοῦτε. ἀλλʼ ἡ πατρίς, ὅσον ἐπʼ ἐμοί, φησίν, ἀβοήθητος
  ἔσται. πάλιν, ποίαν καὶ ταύτην βοήθειαν; στοὰς οὐχ ἕξει διὰ σὲ οὔτε βαλανεῖα. καὶ τί τοῦτο; οὐδὲ γὰρ
  ὑποδήματα ἔχει διὰ τὸν χαλκέα οὐδʼ ὅπλα διὰ τὸν σκυτέα· ἱκανὸν δέ, ἐὰν ἕκαστος ἐκπληρώσῃ τὸ ἑαυτοῦ ἔργον.
  εἰ δὲ ἄλλον τινὰ αὐτῇ κατεσκεύαζες πολίτην πιστὸν καὶ αἰδήμονα, οὐδὲν ἂν αὐτὴν ὠφέλεις; ναί. οὐκοῦν
  οὐδὲ σὺ αὐτὸς ἀνωφελὴς ἂν εἴης αὐτῇ. τίνα οὖν ἕξω, φησί, χώραν ἐν τῇ πόλει; ἣν ἂν δύνῃ φυλάττων ἅμα
  τὸν πιστὸν καὶ αἰδήμονα. εἰ δὲ ἐκείνην ὠφελεῖν βουλόμενος ἀποβαλεῖς ταῦτα, τί ὄφελος ἂν αὐτῇ γένοιο
  ἀναιδὴς καὶ ἄπιστος ἀποτελεσθείς;
translation_literal: 'Do not let thoughts like these trouble you: “I shall live without honor, and be
  nobody anywhere.” For if lack of honor is an evil, you cannot be brought into evil by another person
  any more than you can be brought into something shameful by another. Is it, then, your own task to obtain
  public office or to be included at a banquet? Certainly not. How, then, can this still be dishonor?
  And how will you be nobody anywhere, when you need be somebody only in those matters that depend on
  you, in which you are allowed to be of the highest worth?


  “But my friends will be without help from me.” What do you mean by “without help”? They will not get
  a small coin from you, nor will you make them Roman citizens. And who told you that such things are
  among what depends on us, rather than being another’s business? Who can give another what he does not
  possess himself? “Then acquire these things,” someone says, “so that we may have them.” If I can acquire
  them while keeping myself decent, trustworthy, and high-minded, show me the way, and I will acquire
  them. But if you demand that I throw away the goods that are truly mine, so that you may procure things
  that are not good, consider how unfair and ungrateful you are. What would you rather have: money, or
  a friend who is trustworthy and decent? Help me, then, toward becoming that kind of friend; do not ask
  me to pursue things through which I shall lose these very qualities.


  “But, so far as I am concerned, my country too will be left without help.” Again, what sort of help
  do you mean? It will not have colonnades or public baths because of you. And what of that? It does not
  have shoes because of the smith, nor weapons because of the cobbler. It is enough if each person fulfills
  his own proper work. If you furnished your city with one more citizen who was trustworthy and decent,
  would you not benefit it at all? “Yes.” Then you yourself would not be useless to it either. “What position,
  then, shall I have in the city?” Whatever position you can hold while at the same time preserving your
  trustworthiness and decency. But if, in wishing to benefit the city, you cast these aside, what benefit
  could you be to it once you have become shameless and faithless?'
commentary: 'Epictetus begins by exposing the hidden premise in the fear of being “nobody”: that public
  recognition, office, invitations, and influence constitute a person’s worth. His reply turns on τὰ ἐφʼ
  ἡμῖν, “the things that depend on us.” Appointment to office and access to elite social occasions belong
  to circumstances shaped by others; they therefore cannot by themselves either honor or degrade a person.
  The arena in which one can truly be “of greatest worth” is the moral use of one’s own judgment and conduct.


  The argument then tests this principle against two powerful claims: duty to friends and duty to one’s
  city. Epictetus does not dismiss help; rather, he challenges the assumption that help means money, patronage,
  or political leverage. The goods one must first preserve are being αἰδήμων, decent or morally reverent,
  πιστός, trustworthy, and μεγαλόφρων, high-minded. A friend or citizen who sacrifices these in pursuit
  of external usefulness becomes precisely the kind of person least able to help anyone. The passage’s
  civic vision is therefore demanding but unspectacular: fulfill one’s proper work, and contribute to
  the city by being a person whose character can be relied upon.


  Key Terms


  **ἀτιμία** — Dishonor or loss of public standing; the supposed evil the passage redefines.

  **τὰ ἐφʼ ἡμῖν** — “Things that depend on us”: the sphere of one’s responsible moral agency.

  **αἰδήμονα** — Decent, morally restrained, reverent toward what is right.

  **πιστόν** — Trustworthy, faithful, dependable in friendship and civic life.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna likewise directs attention to one’s rightful action rather than to securing
  its results, echoing Epictetus’ distinction between one’s work and outcomes controlled by others. Divergence:
  The Gītā frames disciplined action within devotion, dharma, and liberation, whereas Epictetus argues
  chiefly from the Stoic independence of moral agency.

  **Confucius, Analects 4.16:** Confucius says that the exemplary person understands righteousness while
  the petty person understands profit; Epictetus similarly asks whether one values money above a trustworthy
  and decent friend. Divergence: Confucian ethics emphasizes cultivated relationships and ritual roles,
  while Epictetus grounds the issue more sharply in the inner boundary of what is or is not up to us.

  **Mark 8:36:** “What does it profit a person to gain the whole world and forfeit their life?” closely
  parallels the warning against acquiring external advantages by losing one’s true moral goods. Divergence:
  Mark’s saying concerns the soul in relation to God and ultimate salvation; Epictetus’ account is philosophical,
  locating ruin in the corruption of character itself.'
practice: When you feel pressure to gain status, access, or influence, write down the external result
  you want and the quality it may tempt you to compromise. Then name one action you can take today that
  preserves being πιστός and αἰδήμων—even if it does not improve your standing.
