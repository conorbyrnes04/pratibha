sanskrit_devanagari: τάξον τινὰ ἤδη χαρακτῆρα σαυτῷ καὶ τύπον, ὃν φυλάξεις ἐπί τε σεαυτοῦ ὢν καὶ ἀνθρώποις
  ἐντυγχάνων. καὶ σιωπὴ τὸ πολὺ ἔστω ἢ λαλείσθω τὰ ἀναγκαῖα καὶ διʼ ὀλίγων. σπανίως δέ ποτε καιροῦ παρακαλοῦντος
  ἐπὶ τὸ λέγειν λέξον μέν, ἀλλὰ περὶ οὐδενὸς τῶν τυχόντων· μὴ περὶ μονομαχιῶν, μὴ περὶ ἱπποδρομιῶν, μὴ
  περὶ ἀθλητῶν, μὴ περὶ βρωμάτων ἢ πομάτων, τῶν ἑκασταχοῦ, μάλιστα δὲ μὴ περὶ ἀνθρώπων ψέγων ἢ ἐπαινῶν
  ἢ συγκρίνων. ἂν μὲν οὖν οἷός τε ᾖς, μετάγαγε τοῖς σοῖς λόγοις καὶ τοὺς τῶν συνόντων ἐπὶ τὸ προσῆκον.
  εἰ δὲ ἐν ἀλλοφύλοις ἀποληφθεὶς τύχοις, σιώπα. γέλως μὴ πολὺς ἔστω μηδὲ ἐπὶ πολλοῖς μηδὲ ἀνειμένος. ὅρκον
  παραίτησαι, εἰ μὲν οἷόν τε, εἰς ἅπαν, εἰ δὲ μή, ἐκ τῶν ἐνόντων. ἑστιάσεις τὰς ἔξω καὶ ἰδιωτικὰς διακρούου·
  ἐὰν δέ ποτε γίνηται καιρός, ἐντετάσθω σοι ἡ προσοχή, μήποτε ἄρα ὑπορρυῇς εἰς ἰδιωτισμόν. ἴσθι γάρ, ὅτι,
  ἐὰν ὁ ἑταῖρος ᾖ μεμολυσμένος, καὶ τὸν συνανατριβόμενον αὐτῷ συμμολύνεσθαι ἀνάγκη, κἂν αὐτὸς ὢν τύχῃ
  καθαρός. τὰ περὶ τὸ σῶμα μέχρι τῆς χρείας ψιλῆς παραλάμβανε, οἷον τροφάς, πόμα, ἀμπεχόνην, οἰκίαν, οἰκετίαν·
  τὸ δὲ πρὸς δόξαν ἢ τρυφὴν ἅπαν περίγραφε. περὶ ἀφροδίσια εἰς δύναμιν πρὸ γάμου καθαρευτέον· ἁπτομένῳ
  δὲ ὧν νόμιμόν ἐστι μεταληπτέον. μὴ μέντοι ἐπαχθὴς γίνου τοῖς χρωμένοις μηδὲ ἐλεγκτικός· μηδὲ πολλαχοῦ
  τὸ ὅτι αὐτὸς οὐ χρῇ, παράφερε. ἐὰν τίς σοι ἀπαγγείλῃ ὅτι ὁ δεῖνά σε κακῶς λέγει, μὴ ἀπολογοῦ πρὸς τὰ
  λεχθέντα, ἀλλʼ ἀποκρίνου διότι ἠγνόει γὰρ τὰ ἄλλα τὰ προσόντα μοι κακά, ἐπεὶ οὐκ ἂν ταῦτα μόνα ἔλεγεν.
  εἰς τὰ θέατρα τὸ πολὺ παριέναι οὐκ ἀναγκαῖον. εἰ δέ ποτε καιρὸς εἴη, μηδενὶ σπουδάζων φαίνου ἢ σεαυτῷ,
  τοῦτʼ ἔστι. θέλε γίνεσθαι μόνα τὰ γινόμενα καὶ νικᾶν μόνον τὸν νικῶντα· οὕτω γὰρ οὐκ ἐμποδισθήσῃ. βοῆς
  δὲ καὶ τοῦ ἐπιγελᾶν τινι ἢ ἐπὶ πολὺ συγκινεῖσθαι παντελῶς ἀπέχου. καὶ μετὰ τὸ ἀπαλλαγῆναι μὴ πολλὰ περὶ
  τῶν γεγενημένων διαλέγου, ὅσα μὴ φέρει πρὸς τὴν σὴν ἐπανόρθωσιν· ἐμφαίνεται γὰρ ἐκ τοῦ τοιούτου, ὅτι
  ἐθαύμασας τὴν θέαν. εἰς ἀκροάσεις τινῶν μὴ εἰκῇ μηδὲ ῥᾳδίως πάριθι· παριὼν δὲ τὸ σεμνὸν καὶ τὸ εὐσταθὲς
  καὶ ἅμα ἀνεπαχθὲς φύλασσε. ὅταν τινὶ μέλλῃς συμβαλεῖν, μάλιστα τῶν ἐν ὑπεροχῇ δοκούντων, πρόβαλε σαυτῷ,
  τί ἂν ἐποίησεν ἐν τούτῳ Σωκράτης ἢ Ζήνων, καὶ οὐκ ἀπορήσεις τοῦ χρήσασθαι προσηκόντως τῷ ἐμπεσόντι.
  ὅταν φοιτᾷς πρός τινα τῶν μέγα δυναμένων, πρόβαλε, ὅτι οὐχ εὑρήσεις αὐτὸν ἔνδον, ὅτι ἀποκλεισθήσῃ, ὅτι
  ἐντιναχθήσονταί σοι αἱ θύραι, ὅτι οὐ φροντιεῖ σου. κἂν σὺν τούτοις ἐλθεῖν καθήκῃ, ἐλθὼν φέρε τὰ γινόμενα
  καὶ μηδέποτε εἴπῃς αὐτὸς πρὸς ἑαυτὸν ὅτι οὐκ ἦν τοσούτου· ἰδιωτικὸν γὰρ καὶ διαβεβλημένον πρὸς τὰ ἐκτός.
  ἐν ταῖς ὁμιλίαις ἀπέστω τὸ ἑαυτοῦ τινων ἔργων ἢ κινδύνων ἐπὶ πολὺ καὶ ἀμέτρως μεμνῆσθαι. οὐ γάρ, ὡς
  σοὶ ἡδύ ἐστι τὸ τῶν σῶν κινδύνων μεμνῆσθαι, οὕτω καὶ τοῖς ἄλλοις ἡδύ ἐστι τὸ τῶν σοὶ συμβεβηκότων ἀκούειν.
  ἀπέστω δὲ καὶ τὸ γέλωτα κινεῖν· ὀλισθηρὸς γὰρ ὁ τρόπος εἰς ἰδιωτισμὸν καὶ ἅμα ἱκανὸς τὴν αἰδῶ τὴν πρὸς
  σὲ τῶν πλησίον ἀνιέναι. ἐπισφαλὲς δὲ καὶ τὸ εἰς αἰσχρολογίαν προελθεῖν. ὅταν οὖν τι συμβῇ τοιοῦτον,
  ἂν μὲν εὔκαιρον ᾖ, καὶ ἐπίπληξον τῷ προελθόντι· εἰ δὲ μή, τῷ γε ἀποσιωπῆσαι καὶ ἐρυθριᾶσαι καὶ σκυθρωπάσαι
  δῆλος γίνου δυσχεραίνων τῷ λόγῳ.
