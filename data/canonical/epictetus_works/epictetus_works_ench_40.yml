sanskrit_devanagari: αἱ γυναῖκες εὐθὺς ἀπὸ τεσσαρεσκαίδεκα ἐτῶν ὑπὸ τῶν ἀνδρῶν κυρίαι καλοῦνται. τοιγαροῦν
  ὁρῶσαι, ὅτι ἄλλο μὲν οὐδὲν αὐταῖς πρόσεστι, μόνον δὲ συγκοιμῶνται τοῖς ἀνδράσι, ἄρχονται καλλωπίζεσθαι
  καὶ ἐν τούτῳ πάσας ἔχειν τὰς ἐλπίδας. προσέχειν οὖν ἄξιον, ἵνα αἴσθωνται, διότι ἐπʼ οὐδενὶ ἄλλῳ τιμῶνται
  ἢ τῷ κόσμιαι φαίνεσθαι καὶ αἰδήμονες.
translation_literal: From the age of fourteen, women are at once called “ladies” by men. Seeing, then,
  that nothing else is offered to them, but only sleeping with men, they begin to adorn themselves and
  to place all their hopes in this. It is therefore worth taking care that they recognize that they are
  valued for nothing else than appearing orderly and modest.
commentary: 'This brief chapter exposes a social mechanism: men confer the title κυρίαι, “ladies” or “mistresses,”
  upon girls at an early age, while leaving them few acknowledged paths except marriage and sexual partnership.
  In that constrained setting, καλλωπίζεσθαι—making oneself beautiful, adorning oneself—becomes the apparent
  route to security and esteem. Epictetus does not portray this as a freely chosen vanity so much as a
  hope cultivated by a narrow social world.


  The proposed remedy, however, remains deeply marked by the gender hierarchy of its setting. Women are
  urged toward being κόσμιαι and αἰδήμονες, orderly and modest; the passage does not imagine equal access
  to education, civic action, or independent vocation. Yet its Stoic pressure point is recognizable: worth
  should not rest upon outward display or another person''s desire. Read critically, the chapter both
  diagnoses the reduction of women to sexual and decorative roles and offers an inadequate, socially conventional
  alternative rather than a fully emancipatory one.


  Key Terms


  **κυρίαι** — “ladies” or “mistresses,” a status-title bestowed by men.

  **συγκοιμῶνται** — “they sleep with,” referring plainly to sexual or marital cohabitation.

  **καλλωπίζεσθαι** — “to beautify oneself” or “adorn oneself.”

  **αἰδήμονες** — “modest,” “reserved,” or governed by a sense of shame.


  Cross-Tradition Resonances


  **Plato, Republic V.455d–456a:** Plato argues that women and men may share the same natural capacities
  and therefore should receive comparable education and public roles, challenging the confinement assumed
  in this passage. Divergence: Plato''s argument serves an ideal city''s collective order, whereas Epictetus
  here addresses personal formation within an already unequal social arrangement.

  **1 Timothy 2:9–10:** This passage similarly contrasts elaborate adornment with a reputation grounded
  in modesty and good conduct. Divergence: The epistle frames its counsel through religious devotion and
  good works, while Epictetus frames the issue as social valuation and moral appearance.

  **Mary Wollstonecraft, A Vindication of the Rights of Woman, ch. 5 (1792):** Wollstonecraft likewise
  observes that women are trained to seek power through beauty because society withholds more substantial
  forms of education and independence. Divergence: Where Epictetus recommends modest respectability, Wollstonecraft
  demands structural change and the cultivation of women''s rational autonomy.'
practice: For one week, notice one moment each day when you evaluate yourself or another person chiefly
  by attractiveness, status, or desirability. Write down one non-external quality—judgment, courage, fairness,
  skill, or care—that deserves greater weight, and act on it in one small concrete way.
