sanskrit_devanagari: θάνατος καὶ φυγὴ καὶ πάντα τὰ δεινὰ φαινόμενα πρὸ ὀφθαλμῶν ἔστω σοι καθʼ ἡμέραν,
  μάλιστα δὲ πάντων ὁ θάνατος· καὶ οὐδὲν οὐδέποτε οὔτε ταπεινὸν ἐνθυμηθήσῃ οὔτε ἄγαν ἐπιθυμήσεις τινός.
translation_literal: Let death, exile, and everything that appears frightening stand before your eyes
  each day—above all, death. Then you will never entertain a base thought, nor will you desire anything
  with excess.
commentary: 'The instruction is not to brood anxiously over catastrophe, but to keep the basic vulnerability
  of human life honestly in sight. Death, banishment, and the πολλά τὰ δεινὰ φαινόμενα—things that present
  themselves as terrible—are to be placed πρὸ ὀφθαλμῶν, “before one’s eyes,” every day. What is regularly
  faced loses some of its power to surprise, flatter, or govern the mind.


  Death receives special emphasis, μάλιστα δὲ πάντων ὁ θάνατος, because it is the limit that clarifies
  every lesser attachment. Remembering it checks both ταπεινὸν thought—servile, petty, or morally lowering
  calculation—and ἄγαν desire, desire that has exceeded its measure. The point is ethical liberation:
  when external losses are no longer unthinkable, one need not compromise one’s inner judgment in order
  to secure possessions, status, or safety.


  Key Terms


  **θάνατος** — death; the final human limit, set foremost in reflection.

  **φυγή** — exile or banishment; loss of one’s place and public security.

  **δεινὰ φαινόμενα** — things appearing terrible; feared events as they present themselves to the mind.

  **ἄγαν** — excessively, beyond due measure.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations 2.11:** Marcus urges frequent reflection on death so that one may act,
  speak, and think with greater seriousness in the present. Divergence: Marcus frames the exercise within
  cosmic nature and duty, while Epictetus here stresses freedom from degraded thought and excessive wanting.

  **Buddhist Satipaṭṭhāna Sutta (MN 10), charnel-ground contemplations:** The discourse directs practitioners
  to contemplate the body’s mortality in order to loosen attachment and delusion. Divergence: The Buddhist
  practice analyzes impermanence and non-self, whereas Epictetus aims at the steadiness of moral agency
  amid feared externals.

  **Ecclesiastes 7:2:** “It is better to go to the house of mourning” because the living may take the
  end of all people to heart. Divergence: Ecclesiastes gives mortality reflection a wisdom-and-reverence
  orientation; Epictetus gives it a distinctly Stoic therapeutic purpose of moderating desire.'
practice: 'For seven days, spend two quiet minutes each morning naming one loss you fear—death, illness,
  displacement, reputation, or possession. Then write one sentence: “Since this is not guaranteed, today
  I will not trade my character for it.” Choose one modest action that follows from that sentence.'
