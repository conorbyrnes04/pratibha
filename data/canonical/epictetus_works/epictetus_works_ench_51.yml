sanskrit_devanagari: εἰς ποῖον ἔτι χρόνον ἀναβάλλῃ τὸ τῶν βελτίστων ἀξιοῦν σεαυτὸν καὶ ἐν μηδενὶ παραβαίνειν
  τὸν διαιροῦντα λόγον; παρείληφας τὰ θεωρήματα, οἷς ἔδει σε συμβάλλειν, καὶ συμβέβληκας. ποῖον οὖν ἔτι
  διδάσκαλον προσδοκᾷς, ἵνα εἰς ἐκεῖνον ὑπερθῇ τὴν ἐπανόρθωσιν ποιῆσαι τὴν σεαυτοῦ; οὐκ ἔτι εἶ μειράκιον,
  ἀλλὰ ἀνὴρ ἤδη τέλειος. ἂν νῦν ἀμελήσῃς καὶ ῥᾳθυμήσῃς καὶ ἀεὶ προθέσεις ἐκ προθέσεως ποιῇ καὶ ἡμέρας
  ἄλλας ἐπʼ ἄλλαις ὁρίζῃς, μεθʼ ἃς προσέξεις σεαυτῷ, λήσεις σεαυτὸν οὐ προκόψας, ἀλλʼ ἰδιώτης διατελέσεις
  καὶ ζῶν καὶ ἀποθνῄσκων. ἤδη οὖν ἀξίωσον σεαυτὸν βιοῦν ὡς τέλειον καὶ προκόπτοντα· καὶ πᾶν τὸ βέλτιστον
  φαινόμενον ἔστω σοι νόμος ἀπαράβατος. κἂν ἐπίπονόν τι ἢ ἡδὺ ἢ ἔνδοξον ἢ ἄδοξον προσάγηται, μέμνησο,
  ὅτι νῦν ὁ ἀγὼν καὶ ἤδη πάρεστι τὰ Ὀλύμπια καὶ οὐκ ἔστιν ἀναβάλλεσθαι οὐκέτι καὶ ὅτι παρὰ μίαν ἡμέραν
  καὶ ἓν πρᾶγμα καὶ ἀπόλλυται προκοπὴ καὶ σῴζεται. Σωκράτης οὕτως ἀπετελέσθη, ἐπὶ πάντων τῶν προσαγομένων
  αὐτῷ μηδενὶ ἄλλῳ προσέχων ἢ τῷ λόγῳ. σὺ δὲ εἰ καὶ μήπω εἶ Σωκράτης, ὡς Σωκράτης γε εἶναι βουλόμενος
  ὀφείλεις βιοῦν.
translation_literal: 'How much longer will you put off judging yourself worthy of the best, and refusing
  in any matter to transgress the principle that distinguishes what is within your power from what is
  not? You have received the doctrines by which you were meant to measure things, and you have measured
  them. What teacher, then, are you still waiting for, so that you may defer to him the work of correcting
  yourself? You are no longer a youth; you are already a grown man. If now you are negligent and slack,
  forever making resolution after resolution, setting one day after another on which you will attend to
  yourself, you will fail to notice that you have made no progress. You will remain an ordinary person
  throughout both life and death.


  So now count yourself worthy to live as one who is complete and making progress. Let every better course,
  once it appears to you, stand as a law you do not violate. And whenever something arduous or pleasant,
  celebrated or obscure, is presented to you, remember: the contest is now; the Olympic games are already
  upon you; there is no further postponement. Progress is lost or preserved through a single day, through
  a single act. Socrates reached his fulfillment in this way: in everything brought before him, he attended
  to nothing but reason. And you, even if you are not yet Socrates, ought to live as one who wishes to
  become Socrates.'
commentary: 'Epictetus opens with a sharp question of delay: what remains to be awaited? The student has
  already received the θεωρήματα, the principles or considered teachings, and has put them to the test.
  The issue is therefore no longer intellectual acquisition but enactment. The “distinguishing principle”
  (ὁ διαιρῶν λόγος) evokes the Stoic division between what depends on us and what does not; one’s task
  is to make that discrimination governing rather than merely familiar. To keep seeking a future teacher
  can become an excuse for avoiding present responsibility.


  The passage presses maturity as a practical condition, not an age or status. Repeated προθέσεις, resolutions,
  can themselves become a form of ῥᾳθυμία, slackness, when they substitute plans for action. Hence the
  athletic image: the ἀγών is not approaching but present, and every attractive or painful appearance
  is a moment of trial. “Olympia” means that there is no rehearsal outside the contest. Socrates is offered
  not as an object of imitation by superficial resemblance, but as a model of unwavering attention to
  λόγος: in each particular encounter, he let rational and ethical judgment decide what to do.


  Key Terms


  **ὁ διαιρῶν λόγος** — the discriminating principle: reason that separates what is ours to govern from
  what is not.

  **θεωρήματα** — established teachings or principles received for reflection and use.

  **προκοπή** — moral progress, the ongoing advance of one’s character and judgment.

  **ἀγών** — a contest or struggle; here, the immediate ethical test of life.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna directs Arjuna toward disciplined action without attachment to results,
  paralleling Epictetus’s insistence that the decisive work is one’s present response. Divergence: The
  Gītā frames action through devotion, dharma, and relation to Krishna, whereas Epictetus grounds the
  demand chiefly in rational moral agency.

  **Dhammapada 276:** “You yourselves must strive” closely matches Epictetus’s refusal to let the learner
  postpone self-correction in dependence on another teacher. Divergence: The Buddhist verse places the
  path within liberation from craving and ignorance, while Epictetus emphasizes living consistently with
  Stoic reason and nature.

  **James 1:22, New Testament:** The warning to be doers rather than hearers echoes Epictetus’s contrast
  between possessing doctrines and actually living by them. Divergence: James presents obedient action
  in relation to God’s word, whereas Epictetus speaks of fidelity to λόγος and the formation of one’s
  own rational faculty.'
practice: 'At the start of one day, name a single likely “Olympic moment”: a criticism, temptation, inconvenience,
  or opportunity for display. Write the response that accords with your best judgment; when the moment
  arrives, pause, distinguish what is yours to govern, and perform that one response without postponement.'
