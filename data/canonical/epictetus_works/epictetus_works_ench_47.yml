sanskrit_devanagari: ὅταν εὐτελῶς ἡρμοσμένος ᾖς κατὰ τὸ σῶμα, μὴ καλλωπίζου ἐπὶ τούτῳ μήδʼ, ἂν ὕδωρ πίνῃς,
  ἐκ πάσης ἀφορμῆς λέγε, ὅτι ὕδωρ πίνεις. κἂν ἀσκῆσαί ποτε πρὸς πόνον θέλῃς. σεαυτῷ καὶ μὴ τοῖς ἔξω· μὴ
  τοὺς ἀνδριάντας περιλάμβανε· ἀλλὰ διψῶν ποτε σφοδρῶς ἐπίσπασαι ψυχροῦ ὕδατος καὶ ἔκπτυσον καὶ μηδενὶ
  εἴπῃς.
translation_literal: When you have accustomed your body to a plain way of living, do not make an ornament
  of it. Even if you drink water, do not keep saying at every opportunity, “I drink water.” And if you
  ever wish to train yourself for endurance, do it for your own sake, not for outsiders. Do not go about
  embracing statues; rather, when you are intensely thirsty, take cold water into your mouth and spit
  it out—and tell no one.
commentary: 'Epictetus distinguishes disciplined simplicity from the performance of simplicity. To be
  εὐτελῶς ἡρμοσμένος, fitted to a modest bodily regimen, is worthwhile; but καλλωπίζου warns against turning
  that very plainness into decoration. One can make a vanity even out of refusing luxuries, converting
  water-drinking, fasting, or toughness into a public identity.


  The point is not that bodily training is worthless. Epictetus permits ἀσκῆσαι πρὸς πόνον, training toward
  the bearing of pain. Yet its proper destination is σεαυτῷ, oneself, rather than τοῖς ἔξω, the people
  outside. The startling image of taking cold water while thirsty and spitting it out describes an exercise
  in command over impulse; its final condition, μηδενὶ εἴπῃς, protects it from becoming theater. Discipline
  serves the inward faculty of choice, not an audience’s admiration.


  Key Terms


  **εὐτελῶς** — plainly, frugally, without costly display

  **καλλωπίζου** — make yourself splendid; here, adorn yourself vainly

  **ἀσκῆσαι** — to train or exercise oneself through deliberate practice

  **πόνον** — toil, hardship, or pain


  Cross-Tradition Resonances


  **Matthew 6:16–18:** Jesus instructs those who fast not to make their practice visible, but to keep
  it before God rather than people. Divergence: Matthew frames hidden fasting in relation to divine reward,
  whereas Epictetus frames secrecy as protection of ethical independence from reputation.

  **Bhagavad Gītā 6.16–17:** The Gītā commends a disciplined balance in eating, recreation, effort, sleep,
  and waking, treating bodily regimen as part of spiritual steadiness. Divergence: Its ideal is moderation
  rather than Epictetus’s brief, deliberately severe test of thirst and self-command.

  **Dhammapada 141:** The verse denies that outward austerities—such as nakedness, matted hair, dirt,
  or fasting—by themselves purify a person. Divergence: The Buddhist verse measures purity chiefly through
  release from doubt and inner defilement, while Epictetus emphasizes non-display and the governance of
  impulse.'
practice: For one day, choose one modest inconvenience—plain food, a brief cold rinse, or leaving your
  phone untouched for an hour. Do it quietly, without announcing it, posting it, or hinting at it; afterward
  ask whether the practice strengthened your freedom or merely gave you a story to tell.
