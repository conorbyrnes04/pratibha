sanskrit_devanagari: ὡς τὸ ἡμέρα ἐστί καὶ νύξ ἐστι πρὸς μὲν τὸ διεζευγμένον μεγάλην ἔχει ἀξίαν, πρὸς δὲ
  τὸ συμπεπλεγμένον ἀπαξίαν, οὕτω καὶ τὸ τὴν μείζω μερίδα ἐκλέξασθαι πρὸς μὲν τὸ σῶμα ἐχέτω ἀξίαν, πρὸς
  δὲ τὸ τὸ κοινωνικὸν ἐν ἑστιάσει, οἷον δεῖ, φυλάξαι, ἀπαξίαν ἔχει. ὅταν οὖν συνεσθίῃς ἑτέρῳ, μέμνησο,
  μὴ μόνον τὴν πρὸς τὸ σῶμα ἀξίαν τῶν παρακειμένων ὁρᾶν, ἀλλὰ καὶ τὴν πρὸς τὸν ἑστιάτορα αἰδῶ φυλάξαι.
translation_literal: Just as the statements “it is day” and “it is night” have great force when offered
  as alternatives, but no force when joined together, so too choosing the larger portion may have value
  for the body, yet has no value when the question is how to preserve the social propriety required at
  a dinner. Therefore, when you dine with someone, remember not to consider only the bodily value of what
  is set before you, but also to maintain respect toward your host.
commentary: 'Epictetus begins with a small lesson in logic. A proposition may be apt in one relation and
  worthless in another: day and night work as alternatives (τὸ διεζευγμένον), not as a combined assertion
  (τὸ συμπεπλεγμένον). He then transfers this precision to the table. Taking more food can be rationally
  advantageous if the body alone is the measure; it becomes unfitting when a shared meal is understood
  as a social act.


  The contrast is not between eating and refusing to eat, nor between pleasure and asceticism. It is between
  a narrowly bodily calculation and the κοινωνικόν, the social bond that must be preserved “as is appropriate.”
  The final imperative, αἰδῶ φυλάξαι, means to guard a sense of respectful restraint toward the host.
  Stoic care here is attentive rather than dour: one notices the food, but also the persons, customs,
  and mutual regard that make the meal more than food.


  Key Terms


  **διεζευγμένον** — a disjunctive proposition: an either/or statement.

  **συμπεπλεγμένον** — a conjoined proposition: a statement whose parts are linked together.

  **κοινωνικόν** — the social or communal dimension of an action.

  **αἰδῶ** — reverent respect, modest restraint, or regard for another.


  Cross-Tradition Resonances


  **Confucius, Analects 12.2:** Confucius links humane conduct with not imposing upon others what one
  would not wish for oneself; Epictetus likewise makes awareness of another person integral to ordinary
  conduct. Divergence: The Analects frames this chiefly as reciprocal humaneness, while Epictetus frames
  it as a rational judgment about what is fitting in a particular relation.

  **Bhagavad Gita 6.17:** The Gita praises moderation in eating, recreation, effort, sleep, and waking;
  both texts refuse to treat appetite as the sole guide. Divergence: The Gita''s moderation serves yogic
  freedom from suffering, whereas Epictetus''s immediate concern is decorum and respect within a shared
  meal.

  **Rule of St. Benedict 39:** Benedict regulates meals so that eating remains ordered to communal life
  rather than private indulgence, much as Epictetus places the table within a social order. Divergence:
  Benedict gives a formal monastic rule with prescribed portions, while Epictetus offers an individual
  exercise of judgment in the presence of a host.'
practice: 'At your next shared meal, pause before taking a second or especially desirable serving. Ask:
  “What does my body need, and what choice best honors the people sharing this table?” Serve yourself
  accordingly, then give deliberate attention to conversation and gratitude.'
