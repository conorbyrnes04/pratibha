title: The Only Unconquerable Aim
unit_type: verse
section: Enchiridion 19
translation_literal: You may be unconquerable, if you enter into no combat in which it is not in your
  own control to conquer. When, therefore, you see anyone eminent in honors, or power, or in high esteem
  on any other account, take heed not to be hurried away with the appearance, and to pronounce him happy;
  for, if the essence of good consists in things in our own control, there will be no room for envy or
  emulation. But, for your part, don't wish to be a general, or a senator, or a consul, but to be free;
  and the only way to this is a contempt of things not in our own control.
commentary: 'Epictetus redefines victory before he recommends detachment. A person is unconquerable not
  by acquiring superior rank, influence, or reputation, but by refusing to stake the good on outcomes
  governed by others, institutions, fortune, or public judgment. Honors have a powerful “appearance”:
  they invite the immediate inference that their possessor is flourishing. Stoic discipline interrupts
  that inference. Since good and bad properly belong to the use of impressions—to rational choice and
  character—another’s office cannot diminish one’s own good, nor can one’s lack of office constitute failure.
  Envy and competitive imitation therefore rest on a false standard of value. The target is not passive
  withdrawal from civic life: one may serve as general or senator if circumstances and duty call. But
  such roles must be accepted as external materials, never desired as conditions of freedom. Freedom is
  independence of one’s moral purpose from what cannot be secured by one’s own agency.


  Key Terms


  **prohairesis** — The faculty of rational moral choice: the sphere in which one’s good and freedom reside.

  **eph’ hēmin** — “Up to us”: what depends on our own judgment, assent, intention, and action.

  **adiaphora** — Indifferents: externals such as office, status, and esteem, not goods or evils in themselves.

  **eleutheria** — Freedom understood as non-dependence on external conditions for one’s flourishing.


  Cross-Tradition Resonances


  **Bhagavad Gita: Krishna’s teaching on action without attachment to fruits:** Both locate steadiness
  in directing oneself to what one can rightly do rather than to success, prestige, or results. Divergence:
  The Gita frames disciplined action within devotion, dharma, and relation to Krishna; Epictetus grounds
  freedom in the sovereignty of rational choice within a Stoic cosmos.

  **The Sermon on the Mount: treasure and divine approval rather than public display:** Both challenge
  the tendency to treat visible honor and human esteem as reliable signs of a good life. Divergence: Christian
  teaching centers dependence on God and transformation before God; Epictetus emphasizes the agent’s correct
  use of impressions and the internal locus of moral good.

  **Montaigne, "Of the Inconstancy of Our Actions" and related essays on rank:** Montaigne similarly exposes
  how social distinction can mislead people about worth and happiness. Divergence: Montaigne’s skeptical,
  observational ethics often stresses human variability; Epictetus offers a more systematic claim that
  virtue alone is good and invulnerable.'
practice: 'When you notice envy toward someone’s status, name the external precisely—title, income, influence,
  praise—then ask: “What judgment or action is mine to govern now?” Perform one such action without comparing
  your standing to theirs.'
