sanskrit_devanagari: ἀνίκητος εἶναι δύνασαι, ἐὰν εἰς μηδένα ἀγῶνα καταβαίνῃς, ὃν οὐκ ἔστιν ἐπὶ σοὶ νικῆσαι.
  ὅρα μήποτε ἰδών τινα προτιμώμενον ἢ μέγα δυνάμενον ἢ ἄλλως εὐδοκιμοῦντα μακαρίσῃς, ὑπὸ τῆς φαντασίας
  συναρπασθείς. ἐὰν γὰρ ἐν τοῖς ἐφʼ ἡμῖν ἡ οὐσία τοῦ ἀγαθοῦ ᾖ, οὔτε φθόνος οὔτε ζηλοτυπία χώραν ἔχει·
  σύ τε αὐτὸς οὐ στρατηγός, οὐ πρύτανις ἢ ὕπατος εἶναι θελήσεις, ἀλλʼ ἐλεύθερος. μία δὲ ὁδὸς πρὸς τοῦτο,
  καταφρόνησις τῶν οὐκ ἐφʼ ἡμῖν.
