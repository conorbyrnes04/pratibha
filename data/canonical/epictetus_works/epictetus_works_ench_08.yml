section: Enchiridion 8
translation_literal: Don't demand that things happen as you wish, but wish that they happen as they do happen, and you will
  go on well.
commentary: 'This maxim condenses Epictetus’ discipline of desire. Distress arises when the mind treats external events as
  if they owed obedience to its preferences: health, reputation, political outcomes, other people’s choices, and even the
  timing of loss. Stoic freedom does not consist in making the world conform to one’s will, but in bringing one’s will into
  lucid cooperation with the world’s causal order. This is not passive approval of every deed or condition. One may still
  act vigorously to prevent injustice, seek treatment, advise a friend, or alter circumstances where action is available.
  The difference lies in the object of commitment: one commits unconditionally to using one’s rational agency well, while
  holding outcomes without demand. To “wish” events as they occur is therefore an exercise in correct judgment: what happens
  is material for virtue, not a verdict on one’s well-being. The good person does not call every event pleasant; rather, they
  refuse to make their flourishing depend on its being otherwise.


  Key Terms


  **eph’ hēmin** — “Up to us”: the sphere of judgment, intention, and chosen response, rather than external outcome.

  **prohairesis** — The rational moral faculty of choice that can use every circumstance well or badly.

  **hormē** — Impulsion or practical movement; Stoicism trains impulse to follow reason and reality rather than demand.

  **heimarmenē** — Fated causal order: the interconnected course of events to which the wise person gives rational assent.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations:** Marcus repeatedly urges cooperation with the whole and treats obstacles as occasions for
  virtuous action, closely matching Epictetus’ relocation of freedom from events to one’s response. Divergence: Marcus often
  frames this through civic duty and the cosmos as a single organism; Epictetus here states the point more starkly as a discipline
  of desire.

  **Bhagavad Gita:** The Gita instructs Arjuna to act without attachment to the fruits of action, paralleling the Stoic refusal
  to stake one’s peace on results. Divergence: The Gita grounds disciplined action in devotion, dharma, and Krishna’s divine
  revelation, whereas Epictetus emphasizes rational agency and assent within Stoic providence.

  **Reinhold Niebuhr, the Serenity Prayer:** Its distinction between accepting what cannot be changed and courageously changing
  what can be changed echoes the Stoic distinction between externals and responsible agency. Divergence: Niebuhr’s prayer
  is explicitly addressed to God and leaves room for petitionary dependence; Epictetus’ formulation is chiefly an exercise
  in philosophical judgment.'
practice: 'When a frustration occurs today, pause before reacting and write two short clauses: “The event is not mine to command”
  and “My present use of it is mine.” Then choose one specific action that expresses fairness, courage, or self-command, while
  deliberately releasing any demand for the result.'
