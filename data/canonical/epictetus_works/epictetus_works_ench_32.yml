sanskrit_devanagari: ὅταν μαντικῇ προσίῃς, μέμνησο, ὅτι, τί μὲν ἀποβήσεται, οὐκ οἶδας, ἀλλὰ ἥκεις ὡς παρὰ
  τοῦ μάντεως αὐτὸ πευσόμενος, ὁποῖον δέ τι ἐστίν, ἐλήλυθας εἰδώς, εἴπερ εἶ φιλόσοφος. εἰ γάρ ἐστί τι
  τῶν οὐκ ἐφʼ ἡμῖν, πᾶσα ἀνάγκη μήτε ἀγαθὸν αὐτὸ εἶναι μήτε κακόν. μὴ φέρε οὖν πρὸς τὸν μάντιν ὄρεξιν
  ἢ ἔκκλισιν μηδὲ τρέμων αὐτῷ πρόσει, ἀλλὰ διεγνωκώς, ὅτι πᾶν τὸ ἀποβησόμενον ἀδιάφορον καὶ οὐδὲν πρὸς
  σέ, ὁποῖον δʼ ἂν ᾖ, ἔσται αὐτῷ χρήσασθαι καλῶς καὶ τοῦτο οὐθεὶς κωλύσει. θαῤῥῶν οὖν ὡς ἐπὶ συμβούλους
  ἔρχου τοὺς θεούς· καὶ λοιπόν, ὅταν τί σοι συμβουλευθῇ, μέμνησο τίνας συμβούλους παρέλαβες καὶ τίνων
  παρακούσεις ἀπειθήσας. ἔρχου δὲ ἐπὶ τὸ μαντεύεσθαι, καθάπερ ἠξίου Σωκράτης, ἐφʼ ὧν ἡ πᾶσα σκέψις τὴν
  ἀναφορὰν εἰς τὴν ἔκβασιν ἔχει καὶ οὔτε ἐκ λόγου οὔτε ἐκ τέχνης τινὸς ἄλλης ἀφορμαὶ δίδονται πρὸς τὸ
  συνιδεῖν τὸ προκείμενον· ὥστε, ὅταν δεήσῃ συγκινδυνεῦσαι φίλῳ ἢ πατρίδι, μὴ μαντεύεσθαι, εἰ συγκινδυνευτέον.
  καὶ γὰρ ἂν προείπῃ σοι ὁ μάντις φαῦλα γεγονέναι τὰ ἱερά, δῆλον ὅτι θάνατος σημαίνεται ἢ πήρωσις μέρους
  τινὸς τοῦ σώματος ἢ φυγή· ἀλλʼ αἱρεῖ ὁ λόγος καὶ σὺν τούτοις παρίστασθαι τῷ φίλῳ καὶ τῇ πατρίδι συγκινδυνεύειν.
  τοιγαροῦν τῷ μείζονι μάντει πρόσεχε, τῷ Πυθίῳ, ὃς ἐξέβαλε τοῦ ναοῦ τὸν οὐ βοηθήσαντα ἀναιρουμένῳ τῷ
  φίλῳ.
translation_literal: 'When you approach divination, remember this: you do not know what will happen; you
  have come to learn it from the diviner. But you have come already knowing what sort of thing it is,
  if indeed you are a philosopher. For if it belongs among the things not up to us, it must necessarily
  be neither good nor bad. Therefore do not bring desire or aversion to the diviner, and do not come before
  him trembling. Rather, decide beforehand that whatever is going to occur is indifferent and nothing
  to you; whatever it may be, you will be able to make good use of it, and no one will prevent you from
  doing so. So go confidently to the gods as to advisers. And afterward, when some counsel has been given
  you, remember what advisers you have accepted and whom you will be disregarding if you disobey.


  But go to seek an oracle, as Socrates thought right, only in matters where the entire inquiry concerns
  the outcome and where neither reasoning nor any other skill supplies starting-points for seeing what
  should be done. Thus, when it is necessary to share danger with a friend or with one’s country, do not
  seek an oracle about whether you should share the danger. For even if the diviner should announce that
  the sacrifices are unfavorable, it is plain that death, the loss of some part of the body, or exile
  is being signified. Yet reason chooses, even with these possibilities, to stand beside one’s friend
  and to face danger together with one’s country. Therefore attend to the greater diviner, the Pythian
  god, who drove from his temple the man who had not helped his friend while that friend was being killed.'
commentary: 'Epictetus does not simply dismiss divination. He sharply limits its proper sphere. An oracle
  may disclose an ἀποβησόμενον, an event that will come to pass, but the event belongs to the realm of
  things οὐκ ἐφʼ ἡμῖν, “not up to us.” Such things cannot by themselves constitute good or evil. The crucial
  question is not whether danger, illness, exile, or success awaits, but whether one will use what happens
  well. This is why the seeker must leave ὄρεξις (grasping desire) and ἔκκλισις (avoidant recoil) outside
  the sanctuary: fear turns counsel into a demand for reassurance.


  The final movement is more demanding still. There are cases in which no prediction is needed because
  λόγος, reasoned moral judgment, already shows the path. One should not ask whether to stand with a friend
  or defend one’s country when duty is clear merely because the cost may be terrible. Epictetus contrasts
  lesser signs with the “greater diviner,” Apollo at Pytho: divine counsel, properly understood, does
  not excuse cowardice. The oracle cannot relieve a person of responsibility for the one domain in which
  Stoic freedom is exercised—the quality of one’s chosen response.


  Key Terms


  **οὐκ ἐφʼ ἡμῖν** — “Not up to us”: external events that do not fall under our governing agency.

  **ἀδιάφορον** — Indifferent: neither morally good nor bad in itself.

  **ὄρεξις** — Desire or reaching after what one hopes to obtain.

  **λόγος** — Reasoned account or rational judgment that can disclose what duty requires.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna directs Arjuna toward action without possessiveness about results, much
  as Epictetus separates right action from the outcome that follows. Divergence: The Gītā frames disciplined
  action as devotion within a theistic and karmic order, whereas Epictetus emphasizes the moral use of
  externals and Stoic rational agency.

  **Plato, Apology 28d–29a:** Socrates says that fear of death must not make one abandon the post assigned
  by god or justice; Epictetus likewise denies that possible death should decide whether one stands by
  friend or city. Divergence: Plato presents Socrates’ particular divine mission and courtroom defense,
  while Epictetus gives a general rule for restricting divination.

  **Confucius, Analects 14.12:** Confucius praises the person who, seeing what is right, fails to act
  only as lacking courage; Epictetus similarly treats clear obligation as prior to calculations of personal
  safety. Divergence: The Analects stresses cultivated social virtue and ritual-human relations, whereas
  Epictetus grounds steadfastness in the distinction between what is and is not up to us.'
practice: 'Before asking for advice about an uncertain outcome, write two columns: “What may happen” and
  “What I can choose.” Then ask whether reason already makes a duty plain—especially toward a friend,
  family member, or community—and commit to one honorable action without requiring a guarantee of safety
  or success.'
