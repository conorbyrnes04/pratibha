sanskrit_devanagari: ὅταν ἡδονῆς τινος φαντασίαν λάβῃς, καθάπερ ἐπὶ τῶν ἄλλων, φύλασσε σαυτόν, μὴ συναρπασθῇς
  ὑπʼ αὐτῆς· ἀλλʼ ἐκδεξάσθω σε τὸ πρᾶγμα, καὶ ἀναβολήν τινα παρὰ σεαυτοῦ λάβε. ἔπειτα μνήσθητι ἀμφοτέρων
  τῶν χρόνων, καθʼ ὅν τε ἀπολαύσεις τῆς ἡδονῆς, καὶ καθʼ ὃν ἀπολαύσας ὕστερον μετανοήσεις καὶ αὐτὸς σεαυτῷ
  λοιδορήσῃ· καὶ τούτοις ἀντίθες ὅπως ἀποσχόμενος χαιρήσεις καὶ ἐπαινέσεις αὐτὸς σεαυτόν. ἐὰν δέ σοι καιρὸς
  φανῇ ἅψασθαι τοῦ ἔργου, πρόσεχε, μὴ ἡττήσῃ σε τὸ προσηνὲς αὐτοῦ καὶ ἡδὺ καὶ ἐπαγωγόν· ἀλλʼ ἀντιτίθει,
  πόσῳ ἄμεινον τὸ συνειδέναι σεαυτῷ ταύτην τὴν νίκην νενικηκότι.
translation_literal: 'When an impression of some pleasure comes to you, as in other cases, guard yourself
  against being carried off by it. Let the matter wait for you, and allow yourself some delay. Then recall
  both moments: the one in which you will enjoy the pleasure, and the one in which, after enjoying it,
  you will later regret it and rebuke yourself. Set against these the way you will rejoice if you refrain,
  and will praise yourself. But if a suitable occasion seems to arise for doing the thing, take care that
  its pleasantness, sweetness, and allure do not defeat you. Put before yourself instead how much better
  it is to know within yourself that you have won this victory.'
commentary: 'Epictetus begins not with an order to extinguish pleasure but with the arrival of a φαντασία,
  an impression or appearance. The danger is that one may be συναρπασθῇ, swept away before judgment has
  had time to act. His remedy is deliberately modest: ἀναβολή, postponement. By making the object “wait,”
  a person opens a space in which the first attractive appearance no longer rules alone.


  The passage asks the reader to compare two futures: fleeting enjoyment followed by regret and self-reproach,
  or abstention followed by joy and self-respect. This is not merely a calculation of consequences; it
  concerns the quality of one’s inward relation to oneself. Even where action may seem timely, its προσηνές,
  ἡδύ, and ἐπαγωγόν—its friendliness, sweetness, and seductive pull—must not conquer one’s judgment. The
  deeper good is συνειδέναι σεαυτῷ, knowing oneself inwardly as one who has achieved a victory.


  Key Terms


  **φαντασία** — An impression or appearance presented to the mind.

  **ἀναβολή** — A postponement: the deliberate interval inserted before acting.

  **μετανοήσεις** — You will regret or change your mind afterward.

  **συνειδέναι** — To know with oneself inwardly; to possess a clear conscience of one’s action.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** The Gītā traces how dwelling on sense-objects grows into attachment, desire,
  and ruin, likewise urging vigilance before desire takes command. Divergence: Its account is embedded
  in devotion, karma, and liberation, whereas Epictetus frames the issue as the discipline of rational
  self-governance.

  **James 1:14–15:** James describes desire as luring a person onward and, once embraced, giving birth
  to destructive consequences; Epictetus similarly focuses on the moment before consent. Divergence: James
  treats temptation within a theological account of sin, while Epictetus emphasizes voluntary judgment
  and the preservation of inner freedom.

  **Augustine, Confessions 8.11–12:** Augustine dramatizes a divided will caught between immediate habit
  and the call to a more whole life, much like Epictetus’s contrast between momentary sweetness and later
  self-reproach. Divergence: Augustine finally locates liberation in divine grace, whereas Epictetus presents
  victory chiefly as an achievement of trained moral agency.'
practice: When a tempting pleasure appears today, do not decide immediately. Wait ten minutes, name the
  impression aloud or in writing, and picture both the next hour and the next morning. Then choose the
  action that you will be able to acknowledge inwardly without self-reproach.
