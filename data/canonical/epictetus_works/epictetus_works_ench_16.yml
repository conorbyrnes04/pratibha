sanskrit_devanagari: ὅταν κλαίοντα ἴδῃς τινὰ ἐν πένθει ἢ ἀποδημοῦντος τέκνου ἢ ἀπολωλεκότα τὰ ἑαυτοῦ,
  πρόσεχε μή σε ἡ φαντασία συναρπάσῃ ὡς ἐν κακοῖς ὄντος αὐτοῦ τοῖς ἐκτός, ἀλλʼ εὐθὺς ἔστω πρόχειρον ὅτι
  τοῦτον θλίβει οὐ τὸ συμβεβηκός (ἄλλον γὰρ οὐ θλίβει), ἀλλὰ τὸ δόγμα τὸ περὶ τούτου. μέχρι μέντοι λόγου
  μὴ ὄκνει συμπεριφέρεσθαι αὐτῷ, κἂν οὕτω τύχῃ, καὶ συνεπιστενάξαι· πρόσεχε μέντοι μὴ καὶ ἔσωθεν στενάξῃς.
translation_literal: 'When you see someone weeping in grief—whether for a child away from home or for
  possessions lost—take care that the impression does not sweep you along, as though he were suffering
  harm from external things. Keep ready at once the thought: it is not what happened that distresses him—for
  it does not distress someone else—but his judgment about what happened. Yet do not hesitate to meet
  him sympathetically in words; if the occasion calls for it, even join in his lament. Only take care
  not to lament inwardly as well.'
commentary: 'Epictetus begins with a deliberately arresting scene: another person’s tears can seize the
  observer through φαντασία, the immediate appearance or impression of events. The danger is not compassion
  itself, but being carried away by the apparent verdict that an external loss is, in itself, an evil.
  The same event, he observes, does not afflict everyone alike; distress arises through the δόγμα, the
  settled judgment or belief attached to it. This is a concise application of the Stoic distinction between
  what happens and the evaluative assent we give to what happens.


  The closing qualification is crucial. Stoic freedom is not emotional bluntness. One may speak gently,
  adopt the mourner’s register, and even weep beside them: social responsiveness has its place. But one
  must not στενάξῃς inwardly—groan within—as if one’s own ruling judgment had accepted that the loss destroys
  a human good. Epictetus thus asks for a compassion that accompanies another person without surrendering
  one’s own moral clarity.


  Key Terms


  **φαντασία** — An impression or appearance presented to the mind, before one has judged it true.

  **δόγμα** — A conviction or evaluative judgment through which an event is taken to be good or bad.

  **συμβεβηκός** — What has happened—the contingent occurrence itself.

  **συνεπιστενάξαι** — To join another in lamenting or groaning alongside them.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Krishna describes pleasure and pain as passing contacts and urges endurance;
  similarly, Epictetus refuses to treat changing circumstances as the final measure of good or evil. Divergence:
  The Gītā places endurance within devotion and duty before Krishna, whereas Epictetus here concentrates
  on the mind’s judgment about an event.

  **Dhammapada 1–2:** These verses make mental intention primary in the arising of suffering and well-being,
  paralleling Epictetus’s claim that distress depends on one’s interpretive stance. Divergence: The Buddhist
  text frames this in terms of karma and the cultivation of mind, while Epictetus frames it as disciplined
  assent to impressions.

  **Romans 12:15:** Paul’s instruction to “weep with those who weep” accords with Epictetus’s permission
  to share outwardly in another’s sorrow. Divergence: Paul presents shared grief as an expression of communal
  love in Christ; Epictetus adds a Stoic warning not to inwardly judge the external loss an evil.'
practice: 'When someone brings you bad news, pause before naming the event a disaster. Offer one concrete
  act of presence—listen, say “I am here,” or help with a task—while silently asking: “What is the fact,
  and what judgment am I adding to it?”'
