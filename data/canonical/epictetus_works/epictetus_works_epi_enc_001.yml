source_excerpt: 'Of all things, some are in our power [*eph'' hēmin*] and some are not. In our power: judgment [*hypolēpsis*],
  impulse [*hormē*], desire [*orexis*], aversion [*ekklisin*] — in short, everything that is our own doing. Not in our power:
  body, property, reputation, office — everything that is not our own doing.'
translation_literal: 'Of all things, some are in our power [*eph'' hēmin*] and some are not. In our power: judgment [*hypolēpsis*],
  impulse [*hormē*], desire [*orexis*], aversion [*ekklisin*] — in short, everything that is our own doing. Not in our power:
  body, property, reputation, office — everything that is not our own doing.


  What is in our power is by nature unimpeded, unshackled, ungoverned from outside. What is not in our power is weak, enslaved,
  subject to obstruction, not ours. Remember this: if you treat as free what is by nature enslaved, and as your own what belongs
  to another, you will be impeded, you will grieve, you will be thrown into disorder — you will blame gods and human beings
  alike. But if you take as yours only what is actually yours, and see what belongs to another as it really is — not yours
  — no one will ever coerce you, no one will block you, you will blame no one, you will accuse no one, you will do nothing
  against your will, you will have no enemy, nothing will harm you.


  Since you are aiming at things this consequential, remember: allow yourself not the slightest inclination toward the other
  class. You must wholly abandon some, and for now defer the rest. For if you want both — that liberation, and also wealth
  and office — you will likely miss both; and you will certainly forfeit the only thing through which freedom and happiness
  are possible.


  Practice at once the ability to say to every difficult appearance [*phantasia*]: "You are an appearance, not at all what
  you claim to be." Then examine it by the rule you have — above all this one: does it belong to what is in our power, or
  to what is not? And if it belongs to the latter, be ready to say: "This is nothing to me."'
commentary: 'The first word of the *Enchiridion*, *tōn ontōn* — "of things that are" — establishes that Epictetus is making
  an ontological claim before a moral one. The division between *eph'' hēmin* (in our power) and *ouk eph'' hēmin* (not in
  our power) is not a pragmatic sorting of manageable from unmanageable concerns; it is a claim about the structure of reality
  itself. What falls outside our power is not merely difficult to control — it is genuinely *alien*, not ours by nature, and
  treating it as ours constitutes a category error, a misidentification as fundamental as confusing the actor with the mask.


  The counterintuitive move that almost every reader makes here is to hear this as resignation or withdrawal. It reads like
  the counsel of a slave who has learned to minimize desire to survive servitude. But Epictetus — himself a former slave —
  means the opposite. The division is a precision instrument, not a surrender. Its purpose is to identify the one domain that
  is genuinely, unassailably free: *prohairesis*, the faculty of rational choice. This is not a faculty restricted by circumstance.
  It cannot be removed by Nero, ruined by illness, or lost in exile. Epictetus''s argument is that most people have this entirely
  backwards: they spend their energy managing what is not theirs (body, reputation, outcome) and neglect the only thing that
  is absolutely theirs (their relationship to appearances, their acts of judgment). Freedom, on this account, is not the expansion
  of external control but the recognition that the only genuine control was always already here.


  The closing instruction — "examine it by the rule: does this concern what is in our power or not?" — is a *pratipakṣa bhāvana*
  avant la lettre, a counter-practice: interrupt the automatic movement toward the appearance, apply the rule, then respond
  from the *hegemonikon* (ruling faculty) rather than from reflex. This is not passive; it requires constant vigilance, which
  Epictetus elsewhere calls *prosochē*, attention to oneself.


  Key Terms:


  **eph'' hēmin (ἐφ'' ἡμῖν)** — literally "upon us," "up to us" — the foundational Stoic distinction locating freedom within
  the range of what is genuinely ours. Not "what we can control" in the managerial sense (which still implies effort toward
  external outcomes), but what is constitutively internal to us as rational agents. The phrase cannot be rendered simply as
  "in our control" without losing the metaphysical weight: Epictetus is arguing that the self *just is* this domain — everything
  outside it is not we, but what we mistakenly identify with.


  **prohairesis (προαίρεσις)** — from *pro* (before) + *haireō* (to take, choose) — the faculty that "chooses in advance,"
  the deliberative capacity that precedes and conditions all particular choices. Standard translations render this as "will"
  or "intention," both of which are too vague. *Prohairesis* is specifically the faculty that evaluates *phantasiai* (appearances)
  and determines whether to assent to them. It is the seat of moral identity for Epictetus — the one thing that cannot be
  taken from us even when everything external is stripped away. Crucially, *prohairesis* is not a passive receiver but an
  active evaluator: assent (*synkatathesis*) is always an act.


  **phantasia (φαντασία)** — appearance, impression, semblance — the primary object that *prohairesis* acts upon. Not "illusion"
  (which carries a negative judgment already settled), but the raw appearing of things before the judging faculty weighs in.
  The practice of calling the phantasia "merely an appearance, not the thing itself" is the opening move of the entire Stoic
  ethical program: interrupt the automatic slide from appearance to reactive response by inserting the moment of evaluation.


  **hegemonikon (ἡγεμονικόν)** — ruling faculty, literally "that which leads" — the Stoic term for the commanding center of
  the soul from which *prohairesis* operates. Often rendered "mind" or "reason," but the specificity matters: the hegemonikon
  is not intellect in the abstract but the sovereign faculty whose proper function is to govern the soul''s relationship to
  appearances. Damage to the hegemonikon through careless assent is the root of all suffering in Epictetus''s analysis.


  Cross-Tradition Resonances:


  **Vijñāna Bhairava Tantra, dhāraṇā 118:** *cittam eva hi saṃsāraṃ* — "mind alone is the cycle of bondage." The VBT, like
  Epictetus, locates the problem not in external conditions but in the mind''s relationship to its own contents. Both traditions
  prescribe a discriminative act — for Epictetus, the examination of *phantasiai*; for the VBT, the recognition that *vikalpa*
  (conceptual construction) is imposed on experience rather than identical with it. *Divergence:* For Epictetus, the discriminative
  act produces *apatheia* (freedom from reactive passion) within the embodied life of the Stoic sage. For the VBT, the same
  recognition opens into the recognition of *cit* (pure Consciousness) as the ground of the one who discriminates — the meditator
  dissolves into the discriminating act itself. The Stoic sage becomes free *as* a self; the Tantric practitioner discovers
  there was never a bound self to free.


  **Bhagavad Gītā 2.47:** *karmaṇy evādhikāras te mā phaleṣu kadācana* — "Your claim is to action alone, never to its fruits."
  Kṛṣṇa''s instruction to Arjuna maps structurally onto §I: act from what is in your power (action itself), relinquish what
  is not (outcome). Both passages prescribe radical redirection of attention from the downstream (result, reputation, consequence)
  to the upstream (the quality of one''s own engagement). *Divergence:* The Gītā''s framing is sacrificial — action offered
  to Brahman, ego surrendered to the divine order. Epictetus''s framing is precisely rational: the argument depends on *logos*,
  not on devotion. The Gītā practitioner offers the fruit; the Stoic practitioner simply recognizes the fruit was never theirs.
  These are different relationships to the same boundary.


  **Zhuāngzǐ, Chapter 2 (齊物論, "On the Equalization of Things"):** "The pivot of the Tao (*dào*) passes through the center,
  where all things converge." Zhuangzi, like Epictetus, locates the problem in the mind''s tendency to adjudicate from a fixed
  standpoint — to name things as good or bad from the position of the small self. The practice of *qi wu* (equalizing things)
  parallels the Stoic practice of examining *phantasiai*: before assenting, recognize that the appearance is conditioned by
  perspective. *Divergence:* Zhuangzi''s move is ultimately a dissolution of the evaluating position itself — the Daoist sage
  inhabits the Tao as a ground that contains all perspectives without adjudicating between them. Epictetus retains the rational
  evaluator as the source of freedom; Zhuangzi would read even this retaining as a subtle form of attachment to selfhood.'
