practice: 'The next time an appearance arrives that pulls at you — news that disturbs, a message that provokes, a plan that
  threatens to collapse — stop before any movement toward it. Notice that there is a pull, as if the appearance were reaching
  across a boundary and gripping you. Now ask precisely: does this belong to what is in my power, or to what is not? If it
  belongs to the second category, say it plainly, even silently: "This is not mine." Notice what happens in the body when
  you say this — not as suppression, but as accurate recognition. Then, and only then, decide what, if anything, you will
  actually do.'
sanskrit_devanagari: Τῶν ὄντων τὰ μέν ἐστιν ἐφ᾽ ἡμῖν, τὰ δὲ οὐκ ἐφ᾽ ἡμῖν. Ἐφ᾽ ἡμῖν μὲν ὑπόληψις, ὁρμή, ὄρεξις, ἔκκλισις, καὶ
  ἑνὶ λόγῳ ὅσα ἡμέτερα ἔργα. Οὐκ ἐφ᾽ ἡμῖν δὲ τὸ σῶμα, ἡ κτῆσις, δόξα, ἀρχή, καὶ ἑνὶ λόγῳ ὅσα οὐχ ἡμέτερα ἔργα.
