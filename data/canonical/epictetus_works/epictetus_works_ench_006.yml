section: Enchiridion 9
sanskrit_devanagari: Νόσος ἐμπόδιον σώματος, προαιρέσεως δὲ οὔ, ἐὰν αὐτὴ θέλῃ. Χωλότης ἐμπόδιον σκέλους, προαιρέσεως δὲ οὔ.
  Καὶ τοῦτο ἐπὶ παντὸς τοῦ συμβαίνοντος ὑποτίθει· εὑρήσεις γὰρ αὐτὸ ἐμπόδιον ἄλλου τινός, σοῦ δὲ οὔ.
sanskrit_iast: ''
translation_literal: 'Sickness is an impediment to the body, but not to the will [prohairesis], unless the will itself chooses
  it to be. Lameness is an impediment to the leg, but not to the will. Apply this to everything that happens: you will find
  it an impediment to something else, but not to yourself.'
commentary: 'Epictetus does not deny bodily pain, disability, dependency, or loss. Sickness genuinely obstructs bodily capacities;
  lameness genuinely limits a leg. His distinction is instead between what happens to a person and the use the person makes
  of what happens. Prohairesis—the rational faculty of choice, judgment, and moral purpose—need not be damaged by the body’s
  condition. It is injured only when it assents to a false conclusion: that external limitation is itself disgraceful, intolerable,
  or an excuse for injustice and despair. “Yourself” here does not mean the entire empirical individual, but the moral agent
  insofar as that agent judges and chooses. The claim is demanding but not callous: illness may require treatment, rest, help,
  grief, and altered plans. Yet none of these necessities compels cowardice, bitterness, deception, or abandonment of one’s
  role. The obstacle belongs to a particular function; virtue concerns how one meets it.


  Key Terms


  **προαίρεσις (prohairesis)** — The faculty of deliberate moral choice: one’s governing judgments, intentions, and assent.

  **ἐμπόδιον (empodion)** — An impediment or obstacle; it hinders some function without necessarily corrupting character.

  **συμβαίνον (symbainon)** — Whatever happens or befalls one: an event to be assessed rather than automatically feared.


  Cross-Tradition Resonances


  **Viktor Frankl, Man’s Search for Meaning:**  Divergence: Frankl writes from existential psychotherapy and emphasizes meaning;
  Epictetus grounds freedom in Stoic moral judgment and the distinction between what is and is not up to us.

  **Bhagavad Gita 2:**  Divergence: The Gita frames disciplined action through dharma, devotion, and a metaphysics of the
  enduring self; Epictetus focuses more narrowly on rational assent and prohairesis.

  **Marcus Aurelius, Meditations 5.20:**  Divergence: Marcus often stresses providence and cosmic cooperation; this Enchiridion
  passage makes the practical distinction in a compressed, almost diagnostic form.'
practice: 'When discomfort, illness, or limitation arises, write two lines: “This obstructs my body or circumstances by…”
  and “My judgment and chosen response remain free to…” Then choose one small action—resting honestly, asking for help, keeping
  an appointment, speaking truthfully, or accepting treatment—that expresses that freedom.'
