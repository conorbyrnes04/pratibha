unit_label: Keep Faith with Your Rule
title: Keep Faith with Your Rule
unit_type: chapter
sanskrit_devanagari: ὅσα προτίθεται, τούτοις ὡς νόμοις, ὡς ἀσεβήσων, ἂν παραβῇς, ἔμμενε. ὅ τι δʼ ἂν ἐρῇ
  τις περὶ σοῦ, μὴ ἐπιστρέφου· τοῦτο γὰρ οὐκ ἔτʼ ἔστι σόν.
translation_literal: Whatever commitments you set before yourself, remain faithful to them as to laws—as
  though breaking them would be an act of irreverence. And whatever anyone may say about you, do not turn
  your attention toward it; for that is no longer yours.
commentary: 'The passage asks for a severe fidelity to one’s chosen moral standard. What one προτίθεται—sets
  before oneself as an aim or principle—is to be held ὡς νόμοις, “as laws.” The comparison is deliberately
  strong: to παραβῇς, to step across or violate such a boundary, is treated as ἀσεβήσων, an impiety. Epictetus
  is not praising stubborn attachment to every passing decision, but calling for reverence toward the
  rational commitments that shape a life of character.


  The second sentence marks the boundary of responsibility. Another person’s judgment, “whatever someone
  may say concerning you,” lies outside your proper sphere; it is no longer σόν, yours. Reputation is
  made in other minds and cannot be governed directly. The discipline here is not indifference to whether
  one has acted well, but refusal to surrender one’s attention to the unstable verdicts of spectators.


  Key Terms


  **προτίθεται** — sets before oneself; proposes as a guiding aim or commitment.

  **νόμοις** — laws; standards granted binding authority.

  **παραβῇς** — you transgress or cross beyond a prescribed boundary.

  **ἐπιστρέφου** — turn your attention toward; concern yourself with.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward responsibility for action rather than possession
  of its results, much as Epictetus redirects concern from public judgment to one’s own conduct. Divergence:
  The Gītā frames disciplined action within devotion and dharma, whereas this passage grounds its counsel
  in Stoic ownership and self-command.

  **Dhammapada 81:** Like a solid rock unmoved by wind, the wise person is not shaken by praise or blame;
  Epictetus likewise refuses to let others’ speech command attention. Divergence: The Dhammapada places
  this steadiness within the path beyond craving and suffering, while Epictetus emphasizes fidelity to
  a chosen rational rule.

  **Marcus Aurelius, Meditations 4.18:** Marcus repeatedly counsels returning to one’s own ruling center
  rather than being carried away by what others think or say. Divergence: Marcus’s reflections often place
  this inward return within a cosmic order and universal community, while Epictetus here gives a terse
  practical injunction.'
practice: At the beginning of the day, write one specific principle you intend to keep—for example, “I
  will speak without contempt.” In the evening, ask only whether you kept it; if praise or criticism arose,
  note it without revisiting it as a measure of your worth.
