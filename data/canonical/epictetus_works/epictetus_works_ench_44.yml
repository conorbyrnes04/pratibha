sanskrit_devanagari: οὗτοι οἱ λόγοι ἀσύνακτοι ἐγώ σου πλουσιώτερός εἰμι, ἐγώ σου ἄρα κρείσσων· ἐγώ σου
  λογιώτερος, ἐγώ σου ἄρα κρείσσων. ἐκεῖνοι δὲ μᾶλλον συνακτικοί ἐγώ σου πλουσιώτερός εἰμι, ἡ ἐμὴ ἄρα
  κτῆσις τῆς σῆς κρείσσων· ἐγώ σου λογιώτερος, ἡ ἐμὴ ἄρα λέξις τῆς σῆς κρείσσων. σὺ δέ γε οὔτε κτῆσις
  εἶ οὔτε λέξις.
translation_literal: 'These arguments do not follow: “I am wealthier than you; therefore I am better than
  you.” “I am more learned than you; therefore I am better than you.” These, rather, do follow: “I am
  wealthier than you; therefore my possessions are better than yours.” “I am more learned than you; therefore
  my manner of expression is better than yours.” But you yourself are neither a possession nor a manner
  of expression.'
commentary: 'Epictetus exposes a small logical leap with large moral consequences. The first comparisons
  are ἀσύνακτοι, “non-conclusive”: having more money or more learning does not establish that one human
  being is κρείσσων, better or superior, than another. The conclusion quietly substitutes the whole person
  for one feature associated with that person.


  The corrected inferences are συνακτικοί, properly connected. Greater wealth may mean that one’s κτῆσις,
  one’s property, exceeds another’s; greater learning may make one’s λέξις, speech or expression, more
  cultivated. Yet these are things belonging to, or exercised by, a person; they are not the person. The
  final sentence refuses the common reduction of human worth to assets, polish, education, or social display.


  Key Terms


  **ἀσύνακτοι** — not logically connected; conclusions that do not follow from their premises

  **συνακτικοί** — logically connected or conclusive

  **κτῆσις** — a possession, property, or acquired holding

  **λέξις** — speech, diction, or manner of expression


  Cross-Tradition Resonances


  **Bhagavad Gītā 5.18:** The wise person sees with equal regard a learned and humble brahmin, a cow,
  an elephant, a dog, and an outcaste; outward distinctions do not settle the deepest measure of a being.
  Divergence: The Gītā grounds this equal vision in a spiritual realization of the same reality, whereas
  Epictetus here makes a logical and ethical distinction between a person and that person’s attributes.

  **Qur’an 49:13:** Human rank is not established by tribe, lineage, or social distinction; true honor
  is located elsewhere than inherited or visible status. Divergence: The Qur’an names God-consciousness
  as the criterion of honor, while Epictetus’ passage chiefly denies that wealth and learning can by themselves
  prove personal superiority.

  **James 2:1–4:** The warning against favoring the richly dressed visitor over the poor directly challenges
  the tendency to treat possessions as evidence of greater human worth. Divergence: James frames partiality
  as a violation of faith and communal justice; Epictetus frames the error first as an invalid inference.'
practice: 'When you notice yourself ranking someone—or yourself—by income, credentials, eloquence, or
  appearance, state the comparison precisely: “Their resources are greater,” or “Her presentation is more
  polished.” Then add: “That does not tell me who is the better person.”'
