section: Enchiridion 21
sanskrit_devanagari: Θάνατον καὶ φυγὴν καὶ πάντα τὰ δοκοῦντα δεινὰ πρὸ ὀφθαλμῶν ἔχε καθ’ ἡμέραν, μάλιστα δὲ τὸν θάνατον· καὶ
  οὐδέποτε οὐδὲν ταπεινὸν ἐννοήσεις οὐδὲ ἐπιθυμήσεις οὐδέν.
sanskrit_iast: ''
translation_literal: Keep death, exile, and all things that seem terrible before your eyes each day—death above all; and you
  will never entertain a degrading thought or desire anything without measure.
commentary: 'This is not an injunction to morbidity but an exercise in Stoic moral perspective. Death and exile are among
  the things commonly called terrible, yet Epictetus marks them as τὰ δοκοῦντα δεινά: things that only seem dreadful. They
  are external events, not choices of the will, and therefore cannot by themselves damage one’s character. Their daily recollection
  breaks the spell by which comfort, status, security, and continued life appear to be absolute goods. “Degrading” thought
  concerns the mind’s surrender of its governing faculty to fear, flattery, resentment, or grasping desire. One who remembers
  mortality is less available for servile ambition: no office, possession, or approval can be worth treachery to one’s rational
  agency. The point is not to cease loving persons or preferring health and home, but to prefer them conditionally—without
  making one’s integrity depend upon retaining them.


  Key Terms


  **θάνατος (thanatos)** — Death; the supreme test case for treating what is not up to us as not morally evil.

  **φυγή (phygē)** — Exile; loss of place, citizenship, and familiar standing, yet not loss of moral purpose.

  **δοκοῦντα δεινά (dokounta deina)** — “Seeming terrible things”; apparent evils whose terror rests on judgment rather than
  their bare occurrence.

  **ἐπιθυμία (epithymia)** — Desire; when ungoverned, it seeks external conditions as though they were necessary for a good
  life.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations:** Marcus repeatedly rehearses death and the transience of reputation to free himself for
  just action in the present. Divergence: Marcus often emphasizes cosmic change and nature’s whole; Epictetus here stresses
  the discipline of desire and the sovereignty of judgment.

  **Buddhist maranasati, mindfulness of death:** Buddhist death-recollection undermines complacency and attachment by making
  impermanence vividly present. Divergence: Buddhist practice is embedded in no-self, karma, and liberation from craving,
  whereas Epictetus grounds freedom in rational assent and moral agency.

  **Montaigne, “That to Philosophize Is to Learn to Die”:** Montaigne argues that familiarizing oneself with death liberates
  life from fear and dependence on fortune. Divergence: Montaigne’s essay is exploratory and personal; Epictetus gives a stricter
  ethical training aimed at correcting evaluative judgments.'
practice: 'Each morning, name one loss you fear—death, illness, disgrace, separation, or displacement—and say: “This may occur,
  but my use of it is up to me.” Then identify one action today in which you will not trade honesty, fairness, or courage
  for security or approval.'
