unit_label: The Injury of a Mistaken View
title: The Injury of a Mistaken View
unit_type: chapter
sanskrit_devanagari: ὅταν σέ τις κακῶς ποιῇ ἢ κακῶς λέγῃ, μέμνησο, ὅτι καθήκειν αὐτῷ οἰόμενος ποιεῖ ἢ
  λέγει. οὐχ οἷόν τε οὖν ἀκολουθεῖν αὐτὸν τῷ σοὶ φαινομένῳ, ἀλλὰ τῷ ἑαυτῷ, ὥστε, εἰ κακῶς αὐτῷ φαίνεται,
  ἐκεῖνος βλάπτεται, ὅστις καὶ ἐξηπάτηται. καὶ γὰρ τὸ ἀληθὲς συμπεπλεγμένον ἄν τις ὑπολάβῃ ψεῦδος, οὐ
  τὸ συμπεπλεγμένον βέβλαπται, ἀλλʼ ὁ ἐξαπατηθείς. ἀπὸ τούτων οὖν ὁρμώμενος πρᾴως ἕξεις πρὸς τὸν λοιδοροῦντα.
  ἐπιφθέγγου γὰρ ἐφʼ ἑκάστῳ ὅτι ἔδοξεν αὐτῷ.
translation_literal: 'When someone treats you badly or speaks badly of you, remember that he acts or speaks
  because he thinks it is fitting for him to do so. He cannot, then, follow what appears right to you,
  but only what appears right to himself. Therefore, if things appear badly to him, he is the one harmed,
  since he has also been deceived. For if someone takes a true conjunction to be false, the conjunction
  itself has not been damaged, but the person who has been misled. Starting from these thoughts, you will
  respond gently to one who abuses you. For in each case say to yourself: “That is how it seemed to him.”'
commentary: 'Epictetus redirects attention from the insult received to the judgment that produced it.
  The abusive person does not act in obedience to your view of the situation, but to τῷ ἑαυτῷ, “what appears
  [right] to himself.” This does not excuse wrongdoing or declare the insult true. It identifies its source:
  a mistaken appearance, an error in discernment. The offender’s real injury is not something he inflicts
  upon another, but the deception by which he mistakes bad for good or fitting.


  The logical illustration is deliberately cool: someone may judge a true συμπεπλεγμένον—a compound proposition
  or connected statement—to be false. That mistaken judgment changes nothing in the truth itself; it damages
  the one deceived. In the same way, slander does not automatically reach the moral center of its target.
  The recommended response, πρᾴως, is gentleness: not passivity, but a refusal to let another person’s
  confused impression commandeer one’s own judgment. The repeated inner phrase, “it seemed so to him”
  (ἔδοξεν αὐτῷ), creates space between provocation and response.


  Key Terms


  **κακῶς** — Badly, wrongly, or maliciously; the manner of harmful speech or action.

  **ἐξηπάτηται** — Has been deceived; describes the offender as misled by his own judgment.

  **συμπεπλεγμένον** — A connected or compound proposition; an example drawn from Stoic logic.

  **πρᾴως** — Gently or mildly; the disposition urged in replying to abuse.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations 4.3:** Marcus likewise advises meeting another’s wrongdoing by considering
  that the person acts from ignorance of good and evil. Divergence: Marcus emphasizes the shared rational
  kinship of human beings, while Epictetus here foregrounds the logical fact that error harms the person
  who holds it.

  **Dhammapada 5:** “Hatreds are never settled by hatred”; both texts interrupt the reciprocal escalation
  of injury and retaliation. Divergence: The Dhammapada frames the matter through the cessation of hatred,
  whereas Epictetus analyzes the offender’s evaluative mistake and the independence of truth from opinion.

  **Luke 23:34:** Jesus’ plea, “Father, forgive them, for they do not know what they are doing,” similarly
  sees ignorance at work in harmful action. Divergence: Luke places forgiveness within prayer, divine
  mercy, and a redemptive narrative; Epictetus offers a philosophical exercise for preserving one’s own
  calm judgment.'
practice: At the next sharp remark, pause before answering and silently say, “It seemed so to them.” Name
  the likely judgment behind the remark—fear, misunderstanding, status anxiety, or anger—then give one
  measured response, or choose silence, without repeating the insult inwardly.
