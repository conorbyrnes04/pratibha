unit_label: Loving Without Possession
title: Loving Without Possession
unit_type: verse
section: Enchiridion 3
translation_literal: Concerning each of the things that delight you or provide utility or are loved, remember
  to say to yourself what sort of thing it is, starting from the smallest things. If you love a pot, say
  'I love a pot.' For when it is broken, you will not be disturbed. If you kiss your little child or your
  wife, say that you are kissing a human being. For when they die, you will not be disturbed.
commentary: 'Epictetus does not ask us to deny that a cup is useful or that a child is beloved. He asks
  us to correct the judgment that makes their continued presence a condition of our peace. Naming the
  object by its general kind—“a ceramic cup,” “a human being”—interrupts the imagination’s claim that
  this particular thing is exempt from change. Its fragility and mortality are not insults to its value
  but features of its nature. Disturbance arises when we demand that what is not up to us remain ours.
  The exercise therefore shifts attachment from possessive dependence to lucid appreciation: one may care,
  serve, and grieve, while refusing to accuse reality for following its course. The severe example of
  spouse and child reveals the Stoic target: not affection, but the hidden inference that love gives one
  a guarantee against loss. What remains inviolable is the use one makes of the event—one’s judgment,
  choice, and conduct.


  Key Terms


  **prohairesis** — The rational faculty of choice: the domain in which one can respond rightly to loss.

  **eph'' hemin** — “Up to us”: our judgments and intentions, not the survival or possession of external
  things.

  **phantasia** — An appearance or impression; here, the impression that a loved object is securely “mine.”

  **apatheia** — Freedom from destructive passions generated by false judgments, not indifference to persons.


  Cross-Tradition Resonances


  **Buddhist contemplation of impermanence (anicca):** Both disciplines train attention on the instability
  of cherished things so that clinging does not become suffering. Divergence: Stoicism centers the rational
  governance of judgment and moral agency; Buddhist analyses often extend impermanence into a critique
  of any enduring self.

  **Bhagavad Gita, Krishna’s teaching on the deathlessness of the self:** The Gita likewise urges action
  and care without incapacitating attachment to outcomes, including death. Divergence: The Gita grounds
  detachment in a metaphysics of the enduring atman and devotion to Krishna, whereas Epictetus appeals
  to the mortal nature of externals and the autonomy of rational choice.

  **Montaigne, ‘That to Philosophize Is to Learn to Die’:** Montaigne treats habitual awareness of death
  as a way to weaken fear and restore freedom in ordinary life. Divergence: Montaigne’s reflective, personal
  acceptance of finitude is less systematically tied than Epictetus’s exercise to the strict distinction
  between what depends on us and what does not.'
practice: 'Choose one valued object or person today. Silently name its general nature—“a borrowed material
  thing” or “a mortal human being”—then add: “Its presence is not mine to command; my care and my judgment
  are.” Let this sharpen gratitude and attentive kindness rather than withdrawal.'
