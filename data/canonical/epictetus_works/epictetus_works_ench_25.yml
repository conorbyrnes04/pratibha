sanskrit_devanagari: Προετιμήθη σού τις ἐν ἑστιάσει ἢ ἐν προσαγορεύσει ἢ ἐν τῷ παραληφθῆναι εἰς συμβουλίαν;
  εἰ μὲν ἀγαθὰ ταῦτά ἐστι, χαίρειν σε δεῖ, ὅτι ἔτυχεν αὐτῶν ἐκεῖνος· εἰ δὲ κακά, μὴ ἄχθου, ὅτι σὺ αὐτῶν
  οὐκ ἔτυχες· μέμνησο δέ, ὅτι οὐ δύνασαι μὴ ταὐτὰ ποιῶν πρὸς τὸ τυγχάνειν τῶν οὐκ ἐφʼ ἡμῖν τῶν ἴσων ἀξιοῦσθαι.
  πῶς γὰρ ἴσον ἔχειν δύναται ὁ μὴ φοιτῶν ἐπὶ θύρας τινὸς τῷ φοιτῶντι; ὁ μὴ παραπέμπων τῷ παραπέμποντι;
  ὁ μὴ ἐπαινῶν τῷ ἐπαινοῦντι, ἄδικος οὖν ἔσῃ καὶ ἄπληστος, εἰ μὴ προϊέμενος ταῦτα, ἀνθʼ ὧν ἐκεῖνα πιπράσκεται,
  προῖκα αὐτὰ βουλήσῃ λαμβάνειν. ἀλλὰ πόσου πιπράσκονται θρίδακες; ὀβολοῦ, ἂν οὕτω τύχῃ. ἂν οὖν τις προέμενος
  τὸν ὀβολὸν λάβῃ θρίδακας, σὺ δὲ μὴ προέμενος μὴ λάβῃς, μὴ οἴου ἔλαττον ἔχειν τοῦ λαβόντος. ὡς γὰρ ἐκεῖνος
  ἔχει θρίδακας, οὕτω σὺ τὸν ὀβολόν, ὃν οὐκ ἔδωκας. τὸν αὐτὸν δὴ τρόπον καὶ ἐνταῦθα. οὐ παρεκλήθης ἐφʼ
  ἑστίασίν τινος; οὐ γὰρ ἔδωκας τῷ καλοῦντι, ὅσου πωλεῖ τὸ δεῖπνον. ἐπαίνου δʼ αὐτὸ πωλεῖ, θεραπείας πωλεῖ.
  δὸς οὖν τὸ διάφορον, εἰ σοι λυσιτελεῖ, ὅσου πωλεῖται. εἰ δὲ κἀκεῖνα θέλεις μὴ προΐεσθαι καὶ ταῦτα λαμβάνειν,
  ἄπληστος εἶ καὶ ἀβέλτερος. οὐδὲν οὖν ἔχεις ἀντὶ τοῦ δείπνου; ἔχεις μὲν οὖν τὸ μὴ ἐπαινέσαι τοῦτον, ὃν
  οὐκ ἤθελες, τὸ μὴ ἀνασχέσθαι αὐτοῦ τῶν ἐπὶ τῆς εἰσόδου.
translation_literal: 'Has someone been preferred to you at a dinner, in a greeting, or in being invited
  into consultation? If these are good things, you ought to be glad that he obtained them; but if they
  are bad, do not be distressed that you did not obtain them. Remember: unless you do the same things,
  you cannot expect to be counted worthy of an equal share in things that are not up to us. For how can
  the person who does not make calls at someone’s door have the same standing as the one who does? Or
  the person who does not escort him as the one who does? Or the person who does not praise him as the
  one who does?


  You will be unjust, then, and insatiable, if you want to receive these things for nothing without giving
  up what they are sold for. What is the price of a head of lettuce? An obol, perhaps. So if someone pays
  the obol and gets the lettuce, while you do not pay and do not get it, do not suppose that you possess
  less than he does. For just as he has the lettuce, so you have the obol that you did not give away.
  The same applies here. Were you not invited to someone’s dinner? That is because you did not give the
  host the price at which he sells his meal. He sells it for praise; he sells it for service. Pay the
  price, then, if it benefits you, at what it is being sold for. But if you wish both not to give up those
  things and also to receive these, you are greedy and foolish.


  Do you have nothing in exchange for the dinner? Indeed you do: you have not praised a man you did not
  wish to praise, and you have not endured his humiliations at the entrance.'
commentary: 'The passage begins with the sting of ordinary exclusion: another person is favored at a meal,
  publicly greeted, or admitted to counsel. Epictetus first unsettles the assumption that such recognition
  is simply good. If it is genuinely good, another''s gain should occasion joy; if it is bad, exclusion
  is no injury. The central distinction is between what comes to us through other people''s choices and
  what belongs to our own responsible agency. Invitations, honors, and access to powerful persons belong
  among the things that are not fully ours to command.


  The lettuce and obol image makes the argument deliberately plain. Social favor is not mysteriously distributed:
  it has a price. One may purchase it with ἔπαινος, praise, and θεραπεία, attendance or service. Epictetus
  does not deny that this exchange can work; he asks whether it is worth the cost. The error is to demand
  the dinner while refusing the currency in which it is sold. Such a demand is ἄπληστος, an appetite that
  wants incompatible goods at once.


  The final reversal is crucial. Refusing patronage is not merely going without; it is receiving something
  else: freedom from unwanted flattery and from the insults or indignities attached to waiting at another''s
  doorway. The passage thus measures apparent loss against the preservation of one''s moral independence,
  the sphere later Stoics would associate with προαίρεσις, one''s faculty of deliberate choice.


  Key Terms


  **ἄχθου** — be distressed; inwardly burdened or vexed.

  **ἄπληστος** — insatiable, unable to recognize a sufficient share.

  **ἔπαινος** — praise; here, the currency by which favor is purchased.

  **θεραπεία** — service or attendance, especially deferential service to a patron.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita counsels commitment to one''s action without claiming possession of
  its fruits, much as Epictetus refuses to ground well-being in externally awarded results. Divergence:
  The Gita frames detached action within devotion and dharma, whereas this passage focuses on the social
  price of honors and the independence gained by declining it.

  **Laozi, Daodejing 44:** Its question, “Fame or one''s own person—which is dearer?”, parallels Epictetus''s
  invitation to weigh public recognition against what one must surrender for it. Divergence: The Daodejing
  tends toward yielding and simplicity in relation to the Way; Epictetus offers a sharper account of voluntary
  exchange and moral accounting.

  **Gospel of Matthew 6:1:** The warning against performing righteousness in order to be seen by others
  echoes the critique of praise-seeking and public approval. Divergence: Matthew directs the reader toward
  reward from God the Father, while Epictetus grounds the refusal of display in self-governance and freedom
  from dependence.'
practice: 'When you feel overlooked today, name the specific recognition you wanted. Then ask: “What would
  this have cost me in praise, compliance, or self-respect?” Write down one thing you retain by not paying
  that price, and act from that retained freedom.'
