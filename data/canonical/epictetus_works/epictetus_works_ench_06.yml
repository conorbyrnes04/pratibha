sanskrit_devanagari: ἐπὶ μηδενὶ ἐπαρθῇς ἀλλοτρίῳ προτερήματι. εἰ ὁ ἵππος ἐπαιρόμενος ἔλεγεν ὅτι καλός
  εἰμι, οἰστὸν ἂν ἦν· σὺ δέ, ὅταν λέγῃς ἐπαιρόμενος ὅτι ἵππον καλὸν ἔχω, ἴσθι, ὅτι ἐπὶ ἵππου ἀγαθῷ ἐπαίρῃ.
  τί οὖν ἐστι σόν; χρῆσις φαντασιῶν. ὥσθʼ, ὅταν ἐν χρήσει φαντασιῶν κατὰ φύσιν σχῇς, τηνικαῦτα ἐπάρθητι·
  τότε γὰρ ἐπὶ σῷ τινι ἀγαθῷ ἐπαρθήσῃ.
translation_literal: Do not grow proud over any advantage that belongs to something else. If a horse,
  puffed up, were to say, “I am handsome,” that might be bearable. But when you say proudly, “I have a
  handsome horse,” know that your pride rests on the horse’s good quality. What, then, is your own? The
  use you make of impressions. Therefore, when you conduct yourself in the use of impressions in accordance
  with nature, then be uplifted; for then you will be taking pride in a good that is truly your own.
commentary: 'Epictetus distinguishes sharply between what one possesses and what one is. A beautiful horse,
  like wealth, reputation, family standing, or bodily talent, may be pleasant and useful; but its excellence
  is not the owner’s excellence. To boast of it is to borrow dignity from something ἀλλότριον, “belonging
  to another.” The joke about the horse exposes the confusion: the horse could at least claim beauty as
  its own attribute, while its rider cannot.


  The human good is χρῆσις φαντασιῶν, the “use of impressions”: how one receives, assesses, and responds
  to appearances. The point is not to suppress every impression, but to handle them κατὰ φύσιν, “according
  to nature,” with rational discernment and fitting judgment. Epictetus does permit a kind of uplift or
  pride, ἐπάρθητι—but only when it rests on one’s own good: a rightly ordered response to what comes before
  the mind.


  Key Terms


  **ἀλλοτρίῳ προτερήματι** — an advantage belonging to another; an excellence that is not truly one’s
  own

  **χρῆσις φαντασιῶν** — the use or handling of impressions—one’s responsible judgment about appearances

  **κατὰ φύσιν** — according to nature; in accord with the rational and fitting order of human life

  **ἀγαθῷ** — a good; here, the genuine good attributable to one’s own character and judgment


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita directs a person toward responsibility for action rather than attachment
  to outcomes, similarly relocating dignity from external results to one’s inward orientation. Divergence:
  The Gita grounds this discipline in devotion and dharma, whereas Epictetus frames it chiefly as rational
  mastery in the use of impressions.

  **Dhammapada 62:** Its warning that possessions and relations are not ultimately “mine” parallels Epictetus’s
  refusal to build identity upon what can be owned or lost. Divergence: The Buddhist verse serves a broader
  teaching on nonattachment and the absence of a permanent self; Epictetus retains a robust moral agent
  responsible for judgment.

  **Confucius, Analects 4.14:** Confucius counsels concern for becoming worthy rather than for lacking
  recognition, much like Epictetus’s preference for inner excellence over status-bearing goods. Divergence:
  Confucian cultivation is deeply relational and shaped by ritual roles, while Epictetus makes the individual’s
  judgment the central site of freedom.'
practice: 'When you notice yourself taking pride in a possession, achievement, connection, or compliment,
  pause and ask: “What part of this is actually mine?” Then name one judgment or action—patience, fairness,
  courage, restraint—through which you can use the present impression κατὰ φύσιν.'
