sanskrit_devanagari: μέτρον κτήσεως τὸ σῶμα ἑκάστῳ ὡς ὁ ποὺς ὑποδήματος. ἐὰν μὲν οὖν ἐπὶ τούτου στῇς,
  φυλάξεις τὸ μέτρον· ἐὰν δὲ ὑπερβῇς, ὡς κατὰ κρημνοῦ λοιπὸν ἀνάγκη φέρεσθαι· καθάπερ καὶ ἐπὶ τοῦ ὑποδήματος,
  ἐὰν ὑπὲρ τὸν πόδα ὑπερβῇς, γίνεται κατάχρυσον ὑπόδημα, εἶτα πορφυροῦν, κεντητόν. τοῦ γὰρ ἅπαξ ὑπὲρ τὸ
  μέτρον ὅρος οὐθείς ἐστιν.
translation_literal: 'Let the body be, for each person, the measure of what one acquires, just as the
  foot is the measure of a shoe. If you hold to this, you will preserve the proper limit; but if you go
  beyond it, you are thereafter bound to be carried downhill, as over a cliff. So too with a shoe: once
  you exceed the needs of the foot, it becomes a gilded shoe, then a purple one, embroidered. For once
  the boundary of measure has been crossed, there is no fixed stopping-point.'
commentary: 'Epictetus makes bodily need a practical standard for possession: the σώμα, the body, sets
  the measure of acquisition just as the πούς, the foot, determines the size of footwear. The point is
  not hostility toward material things. Shoes are necessary; what matters is that they answer to the foot
  rather than becoming objects through which one seeks display, rank, or distinction.


  The image changes sharply when one ὑπερβῇς, “steps beyond” the limit. Excess is not pictured as a stable
  place where one may comfortably stop, but as movement over a κρημνός, a precipice. One luxury generates
  another: gold, purple dye, embroidery. These are not merely expensive objects but conventional signs
  of status. The final claim is severe: after one has abandoned τὸ μέτρον, “the measure,” there is no
  intrinsic boundary left. Desire no longer takes its rule from need, and thus must look endlessly outward
  for a new standard.


  Key Terms


  **μέτρον** — Measure, due limit, or proportion; the governing standard of sufficiency.

  **κτήσεως** — Of acquisition or possession; what one obtains and keeps.

  **σῶμα** — Body; here, the natural criterion for material provision.

  **ὑπερβῇς** — You go beyond or overstep; the decisive crossing of a proper boundary.


  Cross-Tradition Resonances


  **Matthew 6:19–21:** Jesus warns against storing up perishable earthly treasures and directs attention
  toward the condition of the heart, much as Epictetus distrusts possessions pursued beyond need. Divergence:
  Matthew grounds the warning in devotion to God and heavenly treasure, whereas Epictetus argues from
  rational measure and freedom from dependence.

  **Bhagavad Gita 2.70:** The Gita praises the person who remains undisturbed as desires flow toward him,
  like rivers entering a full ocean; both texts oppose the endless enlargement of appetite. Divergence:
  The Gita frames equanimity within devotion, karma, and liberation, while Epictetus focuses on disciplined
  judgment concerning externals.

  **Dao De Jing 33:** The saying that one who knows contentment is rich parallels Epictetus''s insistence
  that enough is determined by a fitting limit rather than social display. Divergence: The Daoist text
  commends alignment with the Dao and an unforced simplicity, while Epictetus emphasizes deliberate moral
  vigilance against false valuation.'
practice: 'Before making one nonessential purchase this week, name the bodily or practical need it would
  meet. If it meets none, wait forty-eight hours and notice which desire remains: use, comfort, admiration,
  or fear of lacking.'
