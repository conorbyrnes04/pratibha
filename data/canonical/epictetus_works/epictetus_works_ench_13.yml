section: Enchiridion 13
translation_literal: If you want to improve, be content to be thought foolish and stupid with regard to
  external things. Don't wish to be thought to know anything; and even if you appear to be somebody important
  to others, distrust yourself. For, it is difficult to both keep your faculty of choice in a state conformable
  to nature, and at the same time acquire external things. But while you are careful about the one, you
  must of necessity neglect the other.
commentary: 'Epictetus identifies a conflict of attention rather than condemning every external possession.
  Status, expertise, and public importance demand continual management of other people’s judgments; they
  invite comparison, display, anxiety, and accommodation to forces outside one’s control. The cost is
  paid in prohairesis: one begins choosing not what is just, lucid, and fitting, but what will preserve
  an image. To accept appearing uninformed or insignificant in external matters is therefore an exercise
  in freedom. It loosens the reflex to defend prestige and makes room for the only success Stoicism treats
  as unconditionally good: the sound use of one’s judgments, impulses, and refusals. The warning to distrust
  oneself when admired is especially sharp. Praise can be mistaken for moral progress, while social authority
  can conceal dependence on applause. Epictetus does not prescribe cultivated incompetence or a theatrical
  humility. He prescribes a clear priority: where external advancement and integrity compete, integrity
  must govern, because only the latter belongs to the agent’s own moral work.


  Key Terms


  **prohairesis** — The rational faculty of choice: the proper site of moral responsibility and freedom.

  **eph'' hēmin** — What is ''up to us,'' chiefly our judgments, intentions, and voluntary responses.

  **doxa** — Opinion or reputation; unstable social estimation rather than a genuine good.

  **katà phusin** — In accordance with nature: rationally and ethically ordered rather than led by externals.


  Cross-Tradition Resonances


  **Tao Te Ching, especially its esteem for humility and the low place:** Both distrust the pursuit of
  prominence and portray self-lowering as a condition of freedom from social competition. Divergence:
  Daoist humility often follows attunement to the Dao and nonassertive action; Epictetus grounds the discipline
  in accountable rational choice and the control distinction.

  **The Sermon on the Mount: warnings against public religious display:** Both challenge action aimed
  at being seen and treat human approval as spiritually corrupting when it becomes the goal. Divergence:
  The Gospel frames hiddenness before God and divine reward; Epictetus frames independence from praise
  as protection of one''s own moral faculty.

  **Bhagavad Gita on acting without attachment to fruits:** Both counsel committed action without making
  outward result, recognition, or success the basis of one’s inner condition. Divergence: The Gita situates
  nonattachment within devotion, dharma, and Krishna''s cosmic teaching; Epictetus emphasizes autonomy
  of judgment within a Stoic providential order.'
practice: Before one conversation today, choose one point on which you will not advertise competence,
  correct a minor slight, or seek credit. Notice the urge to secure an impression; silently classify that
  impression as not up to you, then return attention to speaking truthfully and acting fairly.
