section: Enchiridion 20
translation_literal: Remember, that not he who gives ill language or a blow insults, but the principle
  which represents these things as insulting. When, therefore, anyone provokes you, be assured that it
  is your own opinion which provokes you. Try, therefore, in the first place, not to be hurried away with
  the appearance. For if you once gain time and respite, you will more easily command yourself.
commentary: 'This section locates insult not simply in another’s words or action, but in the evaluative
  judgment by which one takes oneself to have been diminished or wronged. Epictetus does not deny that
  blows and abuse occur, nor does he praise passivity before injustice. His point is narrower and more
  radical: another person initiates an external event, but rage requires the assent of one’s own ruling
  faculty to the appearance that the event is an insult demanding reactive retaliation. The first discipline
  is therefore temporal. Do not immediately fuse appearance, judgment, and impulse into action. A pause
  creates room for prohairesis to examine what is actually at stake: character, choice, and response remain
  one’s own; reputation and another’s conduct do not. This respite is not emotional suppression but the
  recovery of agency. By delaying assent, one can answer firmly if needed, without surrendering inner
  command to the provocateur.


  Key Terms


  **phantasia** — An appearance or impression presented to the mind, not yet endorsed as true or commanding.

  **synkatathesis** — Assent: the mind’s endorsement of an impression, through which it becomes a judgment.

  **prohairesis** — The rational faculty of choice that governs one’s judgments, intentions, and responses.

  **eph'' hēmin** — “Up to us”: what belongs to our agency, especially our use of impressions.


  Cross-Tradition Resonances


  **Buddhist teaching on the “second arrow”:**  Divergence: The Buddhist image is chiefly about suffering
  and craving, while Epictetus frames the issue as rational assent and the preservation of moral agency.

  **Marcus Aurelius, Meditations:**  Divergence: Marcus often broadens this into a cosmic and civic perspective;
  this section concentrates more tightly on immediate provocation and delay.

  **Viktor Frankl, Man’s Search for Meaning:**  Divergence: Frankl develops an existential psychotherapy
  oriented toward meaning under extreme conditions, rather than the Stoic account of assent, virtue, and
  impressions.'
practice: 'At the next perceived slight, remain silent for three slow breaths. Mentally label: “appearance,
  not verdict.” Then identify the judgment—such as “I have been disrespected”—and ask whether acting angrily
  would express your chosen character. Reply, set a boundary, or disengage only after this pause.'
