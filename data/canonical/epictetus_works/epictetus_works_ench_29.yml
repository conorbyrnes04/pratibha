sanskrit_devanagari: ἑκάστου ἔργου σκόπει τὰ καθηγούμενα καὶ τὰ ἀκόλουθα αὐτοῦ καὶ οὕτως ἔρχου ἐπʼ αὐτό.
  εἰ δὲ μή, τὴν μὲν πρώτην προθύμως ἥξεις ἅτε μηδὲν τῶν ἑξῆς ἐντεθυμημένος, ὕστερον δὲ ἀναφανέντων δυσχερῶν
  τινων αἰσχρῶς ἀποστήσῃ. θέλεις Ὀλύμπια νικῆσαι; κἀγώ, νὴ τοὺς θεούς· κομψὸν γάρ ἐστιν. ἀλλὰ σκόπει τὰ
  καθηγούμενα καὶ τὰ ἀκόλουθα καὶ οὕτως ἅπτου τοῦ ἔργου. δεῖ σʼ εὐτακτεῖν, ἀναγκοτροφεῖν, ἀπέχεσθαι πεμμάτων,
  γυμνάζεσθαι πρὸς ἀνάγκην, ἐν ὥρᾳ τεταγμένῃ, ἐν καύματι, ἐν ψύχει, μὴ ψυχρὸν πίνειν, μὴ οἶνον, ὡς ἔτυχεν,
  ἁπλῶς ὡς ἰατρῷ παραδεδωκέναι σεαυτὸν τῷ ἐπιστάτῃ, εἶτα ἐν τῷ ἀγῶνι παρορύσσεσθαι, ἔστι δὲ ὅτε χεῖρα
  ἐκβαλεῖν, σφυρὸν στρέψαι, πολλὴν ἁφὴν καταπιεῖν, ἔσθʼ ὅτε μαστιγωθῆναι καὶ μετὰ τούτων πάντων νικηθῆναι.
  ταῦτα ἐπισκεψάμενος, ἂν ἔτι θέλῃς, ἔρχου ἐπὶ τὸ ἀθλεῖν. εἰ δὲ μή, ὡς τὰ παιδία ἀναστραφήσῃ, ἃ νῦν μὲν
  παλαιστὰς παίζει, νῦν δὲ μονομάχους, νῦν δὲ σαλπίζει, εἶτα τραγῳδεῖ· οὕτω καὶ σὺ νῦν μὲν ἀθλητής, νῦν
  δὲ μονομάχος, εἶτα ῥήτωρ, εἶτα φιλόσοφος, ὅλῃ δὲ τῇ ψυχῇ οὐδέν· ἀλλʼ ὡς πίθηκος πᾶσαν θέαν, ἣν ἂν ἴδῃς,
  μιμῇ καὶ ἄλλο ἐξ ἄλλου σοι ἀρέσκει. οὐ γὰρ μετὰ σκέψεως ἦλθες ἐπί τι οὐδὲ περιοδεύσας, ἀλλʼ εἰκῇ καὶ
  κατὰ ψυχρὰν ἐπιθυμίαν. οὕτω θεασάμενοί τινες φιλόσοφον καὶ ἀκούσαντες οὕτω τινὸς λέγοντος, ὡς Εὐφράτης
  λέγει (καίτοι τίς οὕτω δύναται εἰπεῖν, ὡς ἐκεῖνος; ), θέλουσι καὶ αὐτοὶ φιλοσοφεῖν. ἄνθρωπε, πρῶτον
  ἐπίσκεψαι, ὁποῖόν ἐστι τὸ πρᾶγμα· εἶτα καὶ τὴν σεαυτοῦ φύσιν κατάμαθε, εἰ δύνασαι βαστάσαι. πένταθλος
  εἶναι βούλει ἢ παλαιστής; ἴδε σεαυτοῦ τοὺς βραχίονας, τοὺς μηρούς, τὴν ὀσφὺν κατάμαθε. ἄλλος γὰρ πρὸς
  ἄλλο πέφυκε. δοκεῖς, ὅτι ταῦτα ποιῶν ὡσαύτως δύνασαι ἐσθίειν, ὡσαύτως πίνειν, ὁμοίως ὀρέγεσθαι, ὁμοίως
  δυσαρεστεῖν; ἀγρυπνῆσαι δεῖ, πονῆσαι, ἀπὸ τῶν οἰκείων ἀπελθεῖν, ὑπὸ παιδαρίου καταφρονηθῆναι, ὑπὸ τῶν
  ἀπαντώντων καταγελασθῆναι, ἐν παντὶ ἧττον ἔχειν, ἐν τιμῇ, ἐν ἀρχῇ, ἐν δίκῃ, ἐν πραγματίῳ παντί. ταῦτα
  ἐπίσκεψαι. εἰ θέλεις ἀντικαταλλάξασθαι τούτων ἀπάθειαν, ἐλευθερίαν, ἀταραξίαν· εἰ δὲ μή, μὴ προσάγαγε.
  μὴ ὡς τὰ παιδία νῦν φιλόσοφος, ὕστερον δὲ τελώνης, εἶτα ῥήτωρ, εἶτα ἐπίτροπος Καίσαρος. ταῦτα οὐ συμφωνεῖ.
  ἕνα σε δεῖ ἄνθρωπον ἢ ἀγαθὸν ἢ κακὸν εἶναι· ἢ τὸ ἡγεμονικόν σε δεῖ ἐξεργάζεσθαι τὸ σαυτοῦ ἢ τὸ ἐκτὸς
  ἢ περὶ τὰ ἔσω φιλοτεχνεῖν ἢ περὶ τὰ ἔξω· τοῦτʼ ἔστιν ἢ φιλοσόφου τάξιν ἐπέχειν ἢ ἰδιώτου.
translation_literal: 'For every undertaking, consider what leads it and what follows from it; then set
  out upon it. Otherwise, at first you will rush in eagerly, since you have considered none of what comes
  next; but later, when certain hardships appear, you will withdraw disgracefully.


  Do you want to win at Olympia? So do I, by the gods—it is a fine thing. But consider what comes before
  and after, and only then take hold of the project. You must live by rule, keep a strict diet, abstain
  from pastries, train under compulsion, at an appointed hour, in heat and cold; not drink cold water
  or wine whenever the fancy takes you; in short, hand yourself over to the trainer as to a physician.
  Then, in the contest, you must dig in: perhaps dislocate a hand, twist an ankle, swallow much dust,
  sometimes be flogged—and, after all this, be defeated. When you have examined these things, if you still
  wish it, go into athletics.


  If not, you will behave like children, who now play wrestlers, now gladiators, now blow a trumpet, and
  then act tragedy. So too, now you are an athlete, then a gladiator, then an orator, then a philosopher—yet
  with your whole soul, nothing at all. Like an ape, you imitate every spectacle you see, and one thing
  after another pleases you. For you have not approached anything with examination or surveyed it from
  all sides, but randomly and out of a chilly, passing desire.


  Thus some people, on seeing a philosopher and hearing someone speak as Euphrates speaks—though who could
  speak quite like him?—want to become philosophers too. Man, first examine what the matter is; then learn
  your own nature, to see whether you can bear it. Do you wish to be a pentathlete or a wrestler? Look
  at your arms; study your thighs and your lower back. One person is naturally fitted for one thing, another
  for another.


  Do you suppose that, while doing this, you can eat in the same way, drink in the same way, desire in
  the same way, and be dissatisfied in the same way? You must go without sleep, labor, leave your family,
  be slighted by a servant, laughed at by passersby, and come off worse in every matter—in honor, office,
  lawsuits, and every little business. Consider these things. Consider whether you are willing to exchange
  them for freedom from passion, freedom, and tranquility. If not, do not come near it. Do not be like
  children: a philosopher now, then a tax collector, then an orator, then Caesar’s administrator. These
  things do not harmonize. You must be one person—either good or bad. You must cultivate either your own
  ruling faculty or what lies outside it; either work carefully on what is within or on what is without.
  That is: take the station of a philosopher, or that of an ordinary person.'
commentary: 'The governing instruction is to inspect both τὰ καθηγούμενα, “the things that lead up to”
  an undertaking, and τὰ ἀκόλουθα, “the things that follow from” it. Epictetus does not attack ambition
  itself: Olympic victory is “a fine thing.” What he opposes is the fantasy of acquiring an end without
  accepting its conditions. The athletic catalogue deliberately strips glory of its sheen—regimen, exposure,
  injury, humiliation, and even defeat remain possible. Desire becomes serious only when it can look steadily
  at the entire sequence.


  The passage then widens from sport to philosophy. The ape-like person copies whatever appears impressive,
  while the person of judgment asks both what the work demands and what his own φύσις, nature or constitution,
  can sustain. This is not merely career advice. The proposed exchange is between outward standing and
  ἀπάθεια, ἐλευθερία, and ἀταραξία: freedom from enslaving passions, freedom itself, and untroubled steadiness.
  To pursue these requires a unified ἡγεμονικόν, the ruling faculty, rather than a life scattered among
  borrowed roles and passing enthusiasms.


  Key Terms


  **τὰ καθηγούμενα** — The prior conditions and demands that lead into an undertaking.

  **τὰ ἀκόλουθα** — The consequences and accompanying costs that follow it.

  **φύσις** — One’s native constitution or fitting capacity.

  **ἡγεμονικόν** — The ruling faculty: the inward center of judgment and choice.


  Cross-Tradition Resonances


  **Luke 14:28:** Jesus asks who would begin building a tower without first sitting down to calculate
  the cost, closely echoing Epictetus’ demand to assess an undertaking before entering it. Divergence:
  Luke’s image serves the urgency of discipleship and the kingdom of God; Epictetus directs calculation
  toward coherent Stoic self-formation.

  **Bhagavad Gita 3.35:** The Gita’s claim that one’s own dharma, even imperfectly performed, is better
  than another’s well performed parallels the call to know one’s φύσις rather than imitate another’s vocation.
  Divergence: The Gita frames fitting action within dharma, devotion, and rebirth, whereas Epictetus frames
  it through rational nature and the freedom of the ruling faculty.

  **Rule of St. Benedict, Prologue 45–50:** Benedict warns the entrant to monastic life that the way to
  God is narrow and difficult, inviting a tested commitment rather than romantic enthusiasm. Divergence:
  Benedict’s discipline is communal and ordered toward grace and salvation; Epictetus’ discipline is primarily
  a philosophical training in autonomy and tranquility.'
practice: 'Before taking on one desired role this week, write two columns: its καθηγούμενα (required habits,
  sacrifices, and training) and its ἀκόλουθα (likely consequences, losses, and uncertainties). Read both
  aloud, then either choose one concrete daily discipline for seven days or consciously decline the role
  for now.'
