sanskrit_devanagari: ἐφʼ ἑκάστου τῶν προσπιπτόντων μέμνησο ἐπιστρέφων ἐπὶ σεαυτὸν ζητεῖν, τίνα δύναμιν
  ἔχεις πρὸς τὴν χρῆσιν αὐτοῦ. ἐὰν καλὸν ἴδῃς ἢ καλήν, εὑρήσεις δύναμιν πρὸς ταῦτα ἐγκράτειαν· ἐὰν πόνος
  προσφέρηται, εὑρήσεις καρτερίαν· ἂν λοιδορία, εὑρήσεις ἀνεξικακίαν. καὶ οὕτως ἐθιζόμενόν σε οὐ συναρπάσουσιν
  αἱ φαντασίαι.
translation_literal: With every event that comes upon you, remember to turn back to yourself and ask what
  power you possess for using it well. If you see a handsome person or a beautiful woman, you will find
  self-restraint for such an encounter. If hardship is presented to you, you will find endurance; if abuse,
  you will find patience with wrong. And if you train yourself in this way, your impressions will not
  carry you off by force.
commentary: 'Epictetus does not begin by asking how to remove difficult encounters; he asks how to make
  use of them: τίνα δύναμιν ἔχεις πρὸς τὴν χρῆσιν αὐτοῦ, “what capacity do you have for its use?” The
  decisive turn is ἐπὶ σεαυτόν, back toward oneself. An attractive body, pain, and insult are not treated
  as identical things, but each becomes an occasion for a fitting excellence: ἐγκράτεια, self-command;
  καρτερία, steadfast endurance; and ἀνεξικακία, a refusal to be embittered by injury.


  The final danger is not simply the outer event but the φαντασίαι, the impressions or appearances that
  seize the mind and urge immediate assent. Habitual practice, ἐθιζόμενον, creates a space between what
  appears and what one does. The passage therefore offers neither numbness nor escape: it calls for a
  trained capacity to receive experience without being dragged along by it.


  Key Terms


  **χρῆσις** — use or handling: the practical employment one makes of an event.

  **ἐγκράτεια** — self-mastery, especially restraint in the presence of desire.

  **καρτερία** — steadfast endurance under pain or hardship.

  **φαντασίαι** — impressions or appearances that present themselves to the mind.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations 5.20:** Marcus likewise urges the mind to convert what obstructs action
  into material for action, treating adversity as something that can be used rather than merely suffered.
  Divergence: Marcus emphasizes the rational whole and communal duty more explicitly, while Epictetus
  here catalogs personal capacities for distinct kinds of encounter.

  **Bhagavad Gita 2.14:** The Gita teaches endurance of contact with pleasure and pain as transient conditions,
  paralleling Epictetus''s appeal to καρτερία in hardship. Divergence: The Gita frames endurance within
  devotion, dharma, and liberation from rebirth; Epictetus grounds the exercise in Stoic moral agency.

  **Dhammapada 223:** Its counsel to conquer anger through non-anger closely resembles ἀνεξικακία, the
  disciplined refusal to answer insult with retaliatory bitterness. Divergence: The Buddhist verse is
  embedded in a path of non-self and the cessation of craving, whereas Epictetus appeals to the agent''s
  own available powers.'
practice: 'When a strong impression arises today—desire, discomfort, or criticism—pause before responding.
  Name the event, ask “What capacity can I use here?”, and choose one: restraint, endurance, or patient
  non-retaliation. Record one sentence afterward about whether the impression led you or you used it.'
