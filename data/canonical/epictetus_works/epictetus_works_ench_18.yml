sanskrit_devanagari: κόραξ ὅταν μὴ αἴσιον κεκράγῃ, μὴ συναρπαζέτω σε ἡ φαντασία· ἀλλʼ εὐθὺς διαίρει παρὰ
  σεαυτῷ καὶ λέγε ὅτι τούτων ἐμοὶ οὐδὲν ἐπισημαίνεται, ἀλλʼ ἢ τῷ σωματίῳ μου ἢ τῷ κτησειδίῳ μου ἢ τῷ δοξαρίῳ
  μου ἢ τοῖς τέκνοις ἢ τῇ γυναικί. ἐμοὶ δὲ πάντα αἴσια σημαίνεται, ἐὰν ἐγὼ θέλω· ὅ τι γὰρ ἂν τούτων ἀποβαίνῃ,
  ἐπʼ ἐμοί ἐστιν ὠφεληθῆναι ἀπʼ αὐτοῦ.
translation_literal: 'When a raven gives an inauspicious cry, do not let the impression sweep you away.
  Instead, immediately make a distinction within yourself and say: “None of this is a sign about me; it
  concerns perhaps my body, my little possessions, my reputation, my children, or my wife.” But for me
  every sign is favorable, if I choose it to be. For whatever comes from these things, it lies with me
  to gain benefit from it.'
commentary: 'The raven’s cry is not treated as an argument to be refuted by better divination. Epictetus
  addresses the more immediate danger: φαντασία, the impression that rushes in and seizes the mind. The
  remedy is to “divide” the matter within oneself: an omen, if it indicates anything at all, points to
  externals—body, possessions, public standing, and even beloved family members—not to the moral self.


  The startling claim that “every sign is favorable” does not mean that every event is pleasant. It means
  that every event can become material for good use. The phrase ἐπʼ ἐμοί, “it is up to me,” locates freedom
  not in controlling what occurs but in being able to draw benefit from it. A feared loss may become an
  occasion for courage, affection an occasion for gratitude without possessiveness, and disgrace an occasion
  for integrity. The omen is thus displaced by προαίρεσις: the faculty of deliberate moral choice, implied
  here in the repeated “if I wish” and “it lies with me.”


  Key Terms


  **φαντασία** — An impression or appearance that presents itself to the mind and may carry it away.

  **αἴσιον / αἴσια** — Auspicious, favorable; first attributed to the omen, then redefined by one’s use
  of events.

  **κτησειδίῳ** — A small possession or petty bit of property; the diminutive underscores its external
  and slight status.

  **ἐπʼ ἐμοί** — “Up to me” or “within my power”: the sphere of responsible response.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations 8.47:** Marcus likewise says that what happens to each person is fitted
  to them and can be received as material for a rational life. Divergence: Marcus frames this chiefly
  within cosmic nature and providence, while Epictetus here focuses sharply on refusing the authority
  of an ominous impression.

  **Bhagavad Gita 2.47:** The Gita directs a person toward responsibility for action rather than possession
  of outcomes, paralleling Epictetus’s relocation of agency from events to one’s response. Divergence:
  The Gita situates action within dharma and devotion to Krishna; Epictetus grounds the present passage
  in Stoic moral freedom and the use of impressions.

  **Dhammapada 1–2:** The opening verses of the Dhammapada place mind before experience, suggesting that
  suffering or well-being follows the manner in which one meets what arises. Divergence: Buddhist teaching
  analyzes craving, ignorance, and non-self, whereas Epictetus preserves a robustly responsible choosing
  self that can make use of circumstances.'
practice: 'At the next alarming sign, message, rumor, or bodily sensation, pause before interpreting it.
  Name it as a φαντασία, list what external it concerns, and ask: “What beneficial use—patience, courage,
  fairness, or gratitude—remains up to me now?” Then do one action answering that question.'
