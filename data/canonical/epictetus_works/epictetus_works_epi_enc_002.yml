sanskrit_devanagari: Ταράσσει τοὺς ἀνθρώπους οὐ τὰ πράγματα, ἀλλὰ τὰ περὶ τῶν πραγμάτων δόγματα. Οἷον ὁ θάνατος οὐδὲν δεινόν·
  εἰ γὰρ ἦν, ἐφάνη ἂν καὶ Σωκράτει· ἀλλὰ τὸ δόγμα τὸ περὶ τοῦ θανάτου, ὅτι δεινόν, ἐκεῖνο τὸ δεινόν ἐστιν.
sanskrit_iast: '*(Greek text; no Sanskrit original. Key philosophical terms mapped to nearest Sanskrit structural equivalents
  in Key Terms.)*'
translation_literal: 'Human beings are disturbed not by things [*pragmata*] but by the judgments [*dogmata*] they form about
  things. Death, for instance, is nothing terrible — if it were, it would have seemed terrible to Socrates. What is terrible
  is the *judgment* about death, that it is terrible; that is what the terror actually is.


  When we are blocked, then, or disturbed, or grieved, let us never assign the cause to another, but to ourselves — that is,
  to our own judgments. It is the mark of an uninstructed person to assign responsibility for their own suffering to another.
  The one who is beginning to be instructed assigns it to themselves. The one who has fully arrived assigns it to neither.'
commentary: 'This is the most concise and most philosophically explosive passage in the *Enchiridion*, and it is routinely
  softened by interpretation. Epictetus is not saying that our attitude toward things matters, or that we should try to look
  on the bright side. He is making a strong metaphysical claim: disturbance has no external cause. The *pragmata* — the actual
  events, the things that happen — are causally inert with respect to the soul''s condition. The disturbance is produced entirely
  by the *dogma*, the judgment or belief superimposed on the event. This is not relativism (Socrates''s example is carefully
  chosen: even death, the most apparently terrible thing, produced no disturbance in one who had examined his judgments).
  It is, rather, a claim about the architecture of suffering: every episode of suffering includes, as its structural component,
  an act of mistaken assent.


  What is counterintuitive here is the middle term of the typology: the beginner reproaches others; the advancing practitioner
  reproaches *themselves*. This looks like progress — taking responsibility, self-examination. But Epictetus explicitly distinguishes
  this from the perfected practitioner, who reproaches *neither*. Self-reproach is an advance on blame-projection, but it
  remains within the same error structure: it still treats the disturbance as something requiring a responsible party. The
  perfected practitioner sees that the question "whose fault is this?" is itself the wrong question, a product of the same
  confused *dogmata* that produced the disturbance in the first place. This third stage is not indifference but clarity —
  a form of *apatheia* that does not abolish care but relocates it entirely in the domain of *prohairesis*.


  This passage is the psychological core of Stoic ethics, and its resonance with early Buddhist analysis of *dukkha* (the
  arising of suffering through mental construction) is among the most structurally precise in all of comparative philosophy.


  Key Terms:


  **dogma (δόγμα)** — judgment, tenet, the decree of the mind — not "dogma" in the pejorative modern sense (fixed, unexamined
  belief), but the active judgment the ruling faculty passes on a *phantasia*. For Epictetus, every experience of disturbance
  contains a hidden *dogma* — an act of evaluation in which the mind has declared something to be terrible, shameful, or desirable.
  The disturbance is not the thing; it is this decree. Recognizing the *dogma* as a decree means recognizing it as reversible
  through re-examination.


  **pragma (πρᾶγμα)** — thing, matter, affair — the event or state of affairs as such, before any evaluative overlay. The
  structural claim of §V depends on maintaining the distinction between *pragma* (the death, the insult, the illness) and
  *dogma* (the judgment about it). Modern psychology calls this the distinction between activating event and belief, or between
  stimulus and interpretation — but Epictetus''s version is stronger: the *pragma* has no psychological force whatsoever except
  through the *dogma*. The event does not disturb; only the decree disturbs.


  **tarassō (ταράσσω)** — to disturb, trouble, throw into disorder — the Greek word cognate with the English "turmoil." It
  is the opposite of *ataraxia* (undisturbedness), which is the Epicurean equivalent of the Stoic *apatheia*. The word implies
  an upheaval of internal order — things placed where they do not belong. Epictetus''s argument is that tarassō is always
  self-produced, which means it is always self-curable: the same faculty that issued the bad decree can revoke and reissue
  it correctly.


  Cross-Tradition Resonances:


  **Dhammapada 1–2:** *mano pubbaṅgamā dhammā, mano seṭṭhā manomayā* — "Mind is the forerunner of all actions; mind is chief,
  mind-made are they." The Pali canon''s opening verses assert the same causal primacy of mental construction over external
  event that Epictetus argues in §V. Both locate the genesis of suffering in a mental act — assent in Epictetus, *cetanā*
  (intention/volition) in the Buddha — not in the events themselves. *Divergence:* The Buddhist analysis continues into *anattā*
  — the insight that the faculty doing the judging is itself not a fixed self. Epictetus''s *prohairesis* is precisely the
  one thing that *is* stable, the inviolable core of the Stoic sage''s identity. Buddhism dissolves the judge; Stoicism purifies
  it. Both are responses to suffering through precision about causation, but their endpoints are structurally opposed.


  **Pratyabhijñāhṛdayam, Sūtra 1 (Kṣemarāja):** *citih svatantrā viśva-siddhi-hetuḥ* — "Consciousness [*cit*], absolutely
  free, is the cause of the universe''s manifestation." Kṣemarāja''s opening sūtra locates the creative power of *cit* at
  the source of experience — reality as it appears is not simply received but produced by the free pulsation of awareness.
  This reverses the direction of Epictetus''s argument but preserves its structure: in both cases, the quality of one''s experience
  is not determined by external conditions but by what the mind does with its own movement. For Epictetus, the mind distorts
  by issuing bad *dogmata*; for the Pratyabhijñā, the bound soul contracts *cit* into *vikalpas* that occlude its own freedom.
  *Divergence:* Epictetus treats the corrected mind as the endpoint; the Pratyabhijñā treats correct understanding of mind''s
  nature as the revelation of Śiva''s freedom — the correction opens into something vaster than any corrected individual could
  contain. These are convergent diagnoses with radically different cures.


  **Meister Eckhart, Sermon 52 (Armut des Geistes):** "If a man is truly poor in spirit [*arm an geiste*], there is neither
  suffering nor joy that can disturb him, for he has emptied himself of self-will so completely that nothing can find purchase
  in him." Eckhart''s *Abgeschiedenheit* (detachment) produces the same state Epictetus describes in the perfected practitioner
  who reproaches neither self nor other. Both are describing a condition in which disturbance has nothing to attach to. *Divergence:*
  Eckhart''s route is kenotic — emptying the self to make room for the ground of God (*Gottheit*). Epictetus''s route is discriminative
  — sharpening the self''s rational capacity to the point where bad *dogmata* can no longer form. Eckhart empties; Epictetus
  clarifies. The resulting freedom looks similar from outside but is achieved through structurally opposite movements.'
insight: This is the most concise and most philosophically explosive passage in the *Enchiridion*, and it is routinely softened
  by interpretation.
practice: 'When you notice agitation arising — the quickening of the chest, the narrowing of thought, the urgency to act or
  respond — pause and locate the judgment underneath it. Not "what is happening?" but "what have I just declared about what
  is happening?" Find the hidden decree: "This is terrible." "This means I have failed." "This is unacceptable." Say that
  decree clearly to yourself. Then ask: is this judgment the event, or is it something I have added to the event? Sit with
  the gap between the two. You do not need to resolve it — only to become familiar with the space between the happening and
  the decree.'
