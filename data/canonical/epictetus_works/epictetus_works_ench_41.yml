sanskrit_devanagari: Ἀφυΐας σημεῖον τὸ ἐνδιατρίβειν τοῖς περὶ τὸ σῶμα, οἷον ἐπὶ πολὺ γυμνάζεσθαι, ἐπὶ
  πολὺ ἐσθίειν, ἐπὶ πολὺ πίνειν, ἐπὶ πολὺ ἀποπατεῖν, ὀχεύειν. ἀλλὰ ταῦτα μὲν ἐν παρέργῳ ποιητέον· περὶ
  δὲ τὴν γνώμην ἡ πᾶσα ἔστω ἐπιστροφή.
translation_literal: 'A mark of dullness is to linger over matters of the body: to exercise for too long,
  eat for too long, drink for too long, evacuate oneself, or have sex. Such things should be done only
  incidentally; let your whole attention be directed toward your judgment.'
commentary: 'Epictetus does not condemn the body or its ordinary needs. His target is ἐνδιατρίβειν: making
  one’s dwelling, as it were, among bodily occupations—treating food, training, drink, sex, and bodily
  maintenance as life’s central business. The repeated ἐπὶ πολὺ, “for too long” or “excessively,” exposes
  not the acts themselves but the attention and time lavished upon them.


  The corrective is a reordering of concern. Bodily matters belong ἐν παρέργῳ, “by the way,” as secondary
  work; the πλήρης ἐπιστροφή, the whole turning of one’s attention, is to be around one’s γνώμη. Here
  γνώμη is not merely an opinion but one’s settled judgment or moral orientation—the faculty through which
  a person meets appearances, chooses, and forms character. The body must be cared for; the mind’s governing
  judgment must be cultivated.


  Key Terms


  **ἀφυΐας** — lack of natural intelligence or moral discernment; a failure to recognize what deserves
  priority.

  **ἐνδιατρίβειν** — to spend one’s time absorbed or lingering in something.

  **ἐν παρέργῳ** — as a subordinate, incidental task rather than one’s principal work.

  **γνώμην** — one’s considered judgment, disposition, or guiding moral outlook.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.16–17:** The Gītā rejects both excess and deprivation in eating, recreation, sleep,
  and effort, commending a measured life ordered toward disciplined practice. Divergence: Its moderation
  serves yoga and devotion to Krishna, whereas Epictetus here directs attention chiefly toward the rational
  formation of judgment.

  **Plato, Republic 403c–404a:** Plato warns that excessive devotion to physical training can make a person
  coarse, just as excessive musical cultivation can make one soft; education must order the soul as a
  whole. Divergence: Plato frames the issue within civic education and the harmony of soul-parts, while
  Epictetus gives an immediate rule for individual Stoic practice.

  **Matthew 6:25–33:** Jesus tells his hearers not to be consumed by food, drink, or clothing, but to
  seek first the kingdom of God and righteousness. Divergence: Matthew grounds the release from anxiety
  in trust in divine providence, while Epictetus grounds it in disciplined attention to one’s own judgment.'
practice: 'For one day, meet meals, exercise, grooming, and digital health-tracking as necessary errands:
  do each deliberately, without extending it for pleasure or self-display. Afterward, spend five quiet
  minutes examining one judgment that governed your day: “What did I take to be necessary, and was it?”'
