section: Enchiridion 2
translation_literal: 'Remember that following desire promises the attainment of that of which you are desirous; and aversion
  promises the avoiding that to which you are averse. However, he who fails to obtain the object of his desire is disappointed,
  and he who incurs the object of his aversion wretched. If, then, you confine your aversion to those objects only which are
  contrary to the natural use of your faculties, which you have in your own control, you will never incur anything to which
  you are averse. But if you are averse to sickness, or death, or poverty, you will be wretched. Remove aversion, then, from
  all things that are not in our control, and transfer it to things contrary to the nature of what is in our control. But,
  for the present, totally suppress desire: for, if you desire any of the things which are not in your own control, you must
  necessarily be disappointed; and of those which are, and which it would be laudable to desire, nothing is yet in your possession.
  Use only the appropriate actions of pursuit and avoidance; and even these lightly, and with gentleness and reservation.'
commentary: 'Epictetus treats desire and aversion as commitments that expose a person to injury: to desire is to stake one’s
  well-being on attainment; to avert oneself is to stake it on avoidance. The decisive distinction is not between pleasant
  and painful objects, but between what depends on one’s rational agency and what does not. Sickness, death, and poverty are
  not called good; rather, they cannot rightly be made the objects of unconditional aversion, because their occurrence is
  not authored by the will. The proper object of aversion is misuse of one’s own capacities: false judgment, cowardice, injustice,
  and refusal of one’s role. The instruction to suspend desire is pedagogical severity. A beginner readily turns even admirable
  aims into anxious demands for results. First one learns not to make externals conditions of happiness; only then can desire
  be directed steadily toward virtuous action. Freedom here is not insulation from events, but freedom from making events
  sovereign over one’s moral condition.


  Key Terms


  **eph’ hēmin** — “Up to us”: what belongs to the exercise of one’s own rational agency, rather than to external outcome.

  **prohairesis** — The faculty of moral choice or settled volition, whose use constitutes one’s proper good or bad.

  **orexis** — Desire or reaching-out; it must be disciplined so that it does not depend on uncontrollable objects.

  **ekklisis** — Aversion or avoidance; rightly aimed at one’s own vicious judgments and choices, not at fate.


  Cross-Tradition Resonances


  **Bhagavad Gita, especially its teaching on action without attachment to fruits:** Both counsel committed action while refusing
  to rest one’s inner condition on whether a chosen result arrives. Divergence: The Gita frames detachment within devotion,
  dharma, and liberation from rebirth; Epictetus frames it through the sovereignty of rational moral choice.

  **Buddhist teaching on craving and dukkha:** Both identify attachment to unstable conditions as a source of distress and
  recommend discipline of desire. Divergence: Buddhist analysis usually denies a permanent self and aims at cessation of craving;
  Epictetus preserves an accountable rational agent whose choices must be rightly used.

  **Augustine’s distinction between enjoying God and using temporal goods:** Both warn that treating perishable goods as ultimate
  objects of love makes the person vulnerable to misery. Divergence: Augustine redirects desire toward God as the supreme
  object of enjoyment, whereas Epictetus initially counsels the novice to suspend desire and secure the will’s integrity.'
practice: 'At the start of one difficult day, write down a feared outcome—illness, rejection, loss, or delay. Beside it, list
  the one misuse of your own agency that would truly merit aversion in that situation. Rehearse: “I will not demand the outcome;
  I will guard my judgment, speech, and action.”'
