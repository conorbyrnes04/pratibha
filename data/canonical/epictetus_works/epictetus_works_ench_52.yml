sanskrit_devanagari: ὁ πρῶτος καὶ ἀναγκαιότατος τόπος ἐστὶν ἐν φιλοσοφίᾳ ὁ τῆς χρήσεως τῶν θεωρημάτων,
  οἷον τὸ μὴ ψεύδεσθαι· ὁ δεύτερος ὁ τῶν ἀποδείξεων, οἷον πόθεν ὅτι οὐ δεῖ ψεύδεσθαι· τρίτος ὁ αὐτῶν τούτων
  βεβαιωτικὸς καὶ διαρθρωτικός, οἷον πόθεν ὅτι τοῦτο ἀπόδειξις; τί γάρ ἐστιν ἀπόδειξις, τί ἀκολουθία,
  τί μάχη, τί ἀληθές, τί ψεῦδος; οὐκοῦν ὁ μὲν τρίτος τόπος ἀναγκαῖος διὰ τὸν δεύτερον, ὁ δὲ δεύτερος διὰ
  τὸν πρῶτον· ὁ δὲ ἀναγκαιότατος καὶ ὅπου ἀναπαύεσθαι δεῖ, ὁ πρῶτος. ἡμεῖς δὲ ἔμπαλιν ποιοῦμεν· ἐν γὰρ
  τῷ τρίτῳ τόπῳ διατρίβομεν καὶ περὶ ἐκεῖνόν ἐστιν ἡμῖν ἡ πᾶσα σπουδή· τοῦ δὲ πρώτου παντελῶς ἀμελοῦμεν.
  τοιγαροῦν ψευδόμεθα μέν, πῶς δὲ ἀποδείκνυται ὅτι οὐ δεῖ ψεύδεσθαι, πρόχειρον ἔχομεν.
translation_literal: 'The first and most necessary domain in philosophy is the use of its principles—for
  example, not to lie. The second concerns demonstrations: for example, from what source do we know that
  one ought not to lie? The third, which confirms and analyzes these demonstrations themselves, asks such
  questions as: What makes this a demonstration? What is a consequence? What is a contradiction? What
  is true? What is false?


  The third domain, then, is necessary for the sake of the second, and the second for the sake of the
  first. But the first is the most necessary, and there is where one ought to come to rest. Yet we do
  the reverse: we linger in the third domain, and all our zeal is spent on it, while we utterly neglect
  the first. Consequently, we do lie—but we have ready at hand a proof that lying ought not to be done.'
commentary: 'Epictetus orders philosophy by its purpose. The first τόπος, or “field,” is not theoretical
  assent but χρῆσις, the lived use of teachings. “Do not lie” is his deliberately plain example: philosophy
  reaches its proper completion when a person actually speaks truthfully. Arguments explaining why truthfulness
  is required have their place, as does the more technical inquiry into what counts as proof, inference,
  contradiction, truth, and falsehood. But these later studies are subordinate instruments, not the goal.


  The sting lies in ἔμπαλιν, “the other way around.” Students can make logical analysis their whole σπουδή,
  their earnest occupation, while failing at the moral work for which analysis exists. Epictetus does
  not reject proof; he calls the second and third domains necessary. He rejects stopping there. The final
  irony is sharp: people lie in practice, yet can immediately supply a demonstration that lying is wrong.
  Intellectual readiness, detached from conduct, is not wisdom.


  Key Terms


  **χρήσεως** — use or application; the practical employment of philosophical teachings.

  **θεωρημάτων** — principles or propositions contemplated in philosophical study.

  **ἀπόδειξις** — a demonstration or proof establishing why a claim follows.

  **σπουδή** — serious effort, zeal, or concentrated concern.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1, 1103b26–29:** Aristotle says ethical inquiry aims not merely at
  knowing what virtue is but at becoming good, closely matching Epictetus''s priority of practiced truthfulness
  over abstract study. Divergence: Aristotle emphasizes habituation in the virtues, whereas Epictetus
  here frames the issue as the proper ordering of philosophical and logical disciplines.

  **James 1:22 (New Testament):** “Be doers of the word, and not hearers only” similarly warns that receiving
  sound teaching without embodying it is self-deception. Divergence: James grounds action in obedience
  to God''s word, while Epictetus speaks from a Stoic concern with rational training and the use of principles.

  **Zhuangzi, Chapter 13, “The Way of Heaven”:** The chapter criticizes clinging to transmitted words
  and traces while missing the living understanding from which they arose, paralleling Epictetus''s attack
  on fixation upon secondary formulations. Divergence: Zhuangzi often loosens attachment to fixed doctrines
  altogether, whereas Epictetus retains firm ethical principles and asks that they be enacted.'
practice: 'Choose one principle for today—such as “I will not distort what happened.” Before a difficult
  conversation, state it silently; afterward, note whether your words served the principle or merely defended
  your image. Do not analyze the failure first: name one more truthful sentence you could have spoken.'
