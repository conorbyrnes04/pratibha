sanskrit_devanagari: μηδαμοῦ σεαυτὸν εἴπῃς φιλόσοφον μηδὲ λάλει τὸ πολὺ ἐν ἰδιώταις περὶ τῶν θεωρημάτων,
  ἀλλὰ ποίει τὸ ἀπὸ τῶν θεωρημάτων· οἷον ἐν συμποσίῳ μὴ λέγε, πῶς δεῖ ἐσθίειν, ἀλλʼ ἔσθιε, ὡς δεῖ. μέμνησο
  γάρ, ὅτι οὕτως ἀφῃρήκει πανταχόθεν Σωκράτης τὸ ἐπιδεικτικόν, ὥστε ἤρχοντο πρὸς αὐτὸν βουλόμενοι φιλοσόφοις
  ὑπʼ αὐτοῦ συσταθῆναι, κἀκεῖνος ἀπῆγεν αὐτούς. οὕτως ἠνείχετο παρορώμενος. κἂν περὶ θεωρήματός τινος
  ἐν ἰδιώταις ἐμπίπτῃ λόγος, σιώπα τὸ πολύ· μέγας γὰρ ὁ κίνδυνος εὐθὺς ἐξεμέσαι, ὃ οὐκ ἔπεψας. καὶ ὅταν
  εἴπῃ σοί τις, ὅτι οὐδὲν οἶσθα, καὶ σὺ μὴ δηχθῇς, τότε ἴσθι, ὅτι ἄρχῃ τοῦ ἔργου. ἐπεὶ καὶ τὰ πρόβατα
  οὐ χόρτον φέροντα τοῖς ποιμέσιν ἐπιδεικνύει πόσον, ἔφαγεν, ἀλλὰ τὴν νομὴν ἔσω πέψαντα ἔρια ἔξω φέρει
  καὶ γάλα· καὶ σὺ τοίνυν μὴ τὰ θεωρήματα τοῖς ἰδιώταις ἐπιδείκνυε, ἀλλʼ ἀπʼ αὐτῶν πεφθέντων τὰ ἔργα.
translation_literal: 'Never call yourself a philosopher, and do not speak at length among ordinary people
  about theoretical principles. Instead, act from those principles. At a dinner, for example, do not explain
  how one ought to eat; eat as one ought. Remember that Socrates so thoroughly stripped away every display
  of himself that people came to him wishing to be introduced by him to philosophers, and he would take
  them to others. Thus he endured being overlooked. If discussion of some doctrine arises among ordinary
  people, remain mostly silent. There is great danger that you will immediately vomit up what you have
  not digested. And when someone tells you that you know nothing, if you are not stung by it, then know
  that you are beginning the work. Sheep do not bring grass to their shepherds to show how much they have
  eaten; having digested their fodder within, they bring forth wool and milk without. So you too: do not
  display doctrines to ordinary people, but display the deeds that come from doctrines once they have
  been digested.'
commentary: 'This chapter opposes philosophical display to philosophical formation. Epictetus does not
  reject λόγος or θεωρήματα, theoretical teachings; he rejects the premature urge to exhibit them. A principle
  has not yet become one''s own merely because one can repeat it. It must be inwardly "digested" (πεφθέντων),
  transformed into stable action. Hence the deliberately ordinary example of a meal: the person who knows
  how to eat need not lecture at the table about eating.


  Socrates embodies this refusal of self-advertisement. He does not claim the title "philosopher," accepts
  being passed over, and even sends seekers elsewhere. Such endurance is itself evidence of training:
  when another says, "You know nothing," the decisive question is whether the ego is wounded (δηχθῇς).
  Not being bitten by the insult marks only a beginning, but it is a real beginning of the work.


  The sheep image gives the chapter its governing test. Grass carried about is not nourishment; wool and
  milk are the visible products of nourishment assimilated within. Likewise, Stoic teaching should issue
  in έργα, deeds: composure, proportion, self-command, and conduct that needs no announcement. The passage
  thus redirects attention from a philosophical identity one claims to a life that quietly manifests what
  it has learned.


  Key Terms


  **φιλόσοφον** — a philosopher; here, a label one should not eagerly claim for oneself.

  **θεωρημάτων** — theoretical principles or doctrines, especially teachings not yet embodied in conduct.

  **πέψας / πεφθέντων** — having digested; a metaphor for inwardly assimilating teaching.

  **ἔργα** — deeds or works; the outward evidence of principles truly lived.


  Cross-Tradition Resonances


  **Matthew 6:1–4:** Jesus warns against performing righteousness before others in order to be seen, paralleling
  Epictetus''s suspicion of moral and intellectual display. Divergence: Matthew frames hidden action in
  relation to God and divine reward, whereas Epictetus focuses on the formation and proof of one''s own
  character.

  **Laozi, Daodejing 56:** The line often rendered "Those who know do not speak; those who speak do not
  know" shares the chapter''s esteem for reticence over self-proclaiming expertise. Divergence: The Daodejing
  points toward accord with the Dao and a paradoxical ideal of nonassertion; Epictetus specifically insists
  that Stoic doctrines become visible as disciplined deeds.

  **Bhagavad Gita 3.21:** Krishna teaches that whatever a person of standing does, others follow; action
  rather than mere instruction shapes the world. Divergence: The Gita places exemplary action within dharma,
  devotion, and the maintenance of cosmic order, while Epictetus concentrates on unshowy personal moral
  training.'
practice: For one day, choose a single principle you are tempted to explain—patience, moderation, or not
  reacting to insult. Do not mention the principle or advise anyone about it. At day's end, name one concrete
  deed that showed it had been "digested," and one moment when you merely wanted to display it.
