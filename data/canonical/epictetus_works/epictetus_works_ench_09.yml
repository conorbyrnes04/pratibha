title: The Uninjured Faculty
unit_type: verse
section: Enchiridion 9
translation_literal: Sickness is a hindrance to the body, but not to your ability to choose, unless that
  is your choice. Lameness is a hindrance to the leg, but not to your ability to choose. Say this to yourself
  with regard to everything that happens, then you will see such obstacles as hindrances to something
  else, but not to yourself.
commentary: 'Epictetus separates the organism from the moral agent. Disease, disability, loss, and constraint
  can block bodily functions and alter what actions are practically available; they do not, by themselves,
  corrupt judgment, intention, or the use one makes of appearances. The crucial qualification is that
  the ruling faculty is harmed only “unless that is your choice”: suffering becomes ethical damage when
  one adds resentment, self-pity, cowardice, or the belief that an external event has made life worthless.
  “Not to yourself” therefore does not mean that pain is unreal or that one should refuse treatment. It
  means that the self in the strict Stoic sense is prohairesis, the capacity to assent, refuse assent,
  choose, and aim at what is good. Every obstacle should be redescribed precisely: it impedes a limb,
  possession, plan, or reputation, but it need not impede integrity.


  Key Terms


  **prohairesis** — The rational capacity of moral choice: the Stoic self that can use circumstances well
  or badly.

  **eph’ hēmin** — “Up to us”: what belongs to our responsible use of judgment, rather than to external
  outcomes.

  **synkatathesis** — Assent: the mind’s acceptance or rejection of an impression as true or worth pursuing.

  **prosochē** — Attentiveness: watchfulness over one’s judgments at the moment an impression arrives.


  Cross-Tradition Resonances


  **Bhagavad Gita:**  Divergence: The Gita grounds disciplined action in devotion, dharma, and Krishna’s
  divine reality, whereas Epictetus here stresses the autonomy of rational choice.

  **Boethius, The Consolation of Philosophy:**  Divergence: Boethius develops this through Fortune, providence,
  and the ascent of the soul; Epictetus gives a more immediate exercise in classifying impressions.

  **Viktor Frankl, Man’s Search for Meaning:**  Divergence: Frankl frames this in terms of meaning, responsibility,
  and existential therapy, not the Stoic doctrine that virtue alone is good.'
practice: 'When an obstruction appears today, write one sentence in two columns: “This hinders ___” and
  “It does not compel my judgment to ___.” Then name one virtuous next action still available—such as
  asking for help, resting without complaint, telling the truth, or revising a plan.'
