title: The Traveler’s Custody
unit_type: verse
section: Enchiridion 11
translation_literal: Never say of anything, "I have lost it"; but, "I have returned it." Is your child
  dead? It is returned. Is your wife dead? She is returned. Is your estate taken away? Well, and is not
  that likewise returned? "But he who took it away is a bad man." What difference is it to you who the
  giver assigns to take it back? While he gives it to you to possess, take care of it; but don't view
  it as your own, just as travelers view a hotel.
commentary: 'Epictetus attacks the possessive judgment hidden in grief and resentment: “I have lost” assumes
  that persons and goods were securely mine. Stoic discipline replaces ownership with temporary stewardship.
  Child, spouse, and estate belong to the order of things not wholly eph’ hēmin—not up to us—and therefore
  cannot be guaranteed by our choice. Saying “returned” is not a denial that death hurts or that theft
  is unjust; it corrects the inference that external removal has damaged one’s moral self. The wrongdoer
  may indeed be vicious, but his action does not determine whether I respond with rage, blame, or integrity.
  What remains mine is the use I make of appearances: to care faithfully for what is entrusted, without
  fastening my identity or happiness to its continued presence. The hotel image is deliberately severe:
  one should inhabit life’s goods attentively and gratefully, yet with the readiness of a traveler who
  knows the lodging was never a permanent possession.


  Key Terms


  **eph’ hēmin** — “Up to us”: the sphere of judgment, intention, and chosen response, unlike death or
  possession.

  **prohairesis** — The moral faculty of choice that can preserve integrity amid every external reversal.

  **adiaphora** — Externally indifferent things: goods such as property and even bodily survival do not
  constitute moral good or evil.

  **oikeiōsis** — Appropriation or affiliation: natural attachment is real, but Stoicism resists turning
  attachment into possessive claim.


  Cross-Tradition Resonances


  **Job 1:21:**  Divergence: Job responds in a theistic covenantal frame and may lament before God; Epictetus
  stresses rational assent and the distinction between what is and is not up to us.

  **Bhagavad Gita, especially Arjuna’s grief and Krishna’s teaching on the imperishable self:**  Divergence:
  The Gita grounds its counsel in ātman, rebirth, dharma, and devotion; Epictetus does not require this
  metaphysics and focuses on prohairesis.

  **Buddhist teaching on impermanence and non-attachment:**  Divergence: Stoicism preserves a robust moral
  agency and treats rational virtue as the sole good; Buddhist accounts often analyze the very sense of
  an enduring owner or self more radically.'
practice: 'Choose one valued possession or relationship today. Silently name it as “entrusted, not owned,”
  then perform one concrete act of careful stewardship—repair, gratitude, attention, or kindness—while
  rehearsing: “Its continuance is not mine to command; my use of this moment is.”'
