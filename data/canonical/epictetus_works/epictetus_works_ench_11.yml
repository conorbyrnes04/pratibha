sanskrit_devanagari: μηδέποτε ἐπὶ μηδενὸς εἴπῃς ὅτι ἀπώλεσα αὐτό, ἀλλʼ ὅτι ἀπέδωκα. τὸ παιδίον ἀπέθανεν;
  ἀπεδόθη. ἡ γυνὴ ἀπέθανεν; ἀπεδόθη. τὸ χωρίον ἀφῃρέθην. οὐκοῦν καὶ τοῦτο ἀπεδόθη. ἀλλὰ κακὸς ὁ ἀφελόμενος.
  τί δὲ σοὶ μέλει, διὰ τίνος σε ὁ δοὺς ἀπῄτησε; μέχρι δʼ ἂν διδῷ, ὡς ἀλλοτρίου αὐτοῦ ἐπιμελοῦ, ὡς τοῦ
  πανδοχείου οἱ παριόντες.
