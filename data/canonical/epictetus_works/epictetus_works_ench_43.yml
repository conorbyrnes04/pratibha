title: The Handle of Kinship
unit_type: verse
section: Enchiridion 43
translation_literal: Everything has two handles, the one by which it may be carried, the other by which it cannot. If your
  brother acts unjustly, don't lay hold on the action by the handle of his injustice, for by that it cannot be carried; but
  by the opposite, that he is your brother, that he was brought up with you; and thus you will lay hold on it, as it is to
  be carried.
commentary: 'Epictetus distinguishes the event from the evaluative “handle” by which one takes it up. A brother’s unjust act
  is not thereby made just, nor is correction excluded. But if one grips only “his injustice,” the mind fastens on an external
  wrong and readily turns it into anger, grievance, and reciprocal injury. The other handle recalls a relation: he is brother,
  fellow-raised, and therefore an object of fitting concern. This is not sentimental concealment of fault; it is a discipline
  of judgment. The Stoic asks which description permits action governed by reason and social duty rather than passion. One
  may rebuke, set limits, or seek repair, yet do so as a rational being addressing another rational being, not as an enemy
  consumed by blame. The “carryable” handle is thus the perspective from which the burden can be borne without surrendering
  prohairesis. Kinship broadens the field of obligation and interrupts the fantasy that another’s vice authorizes one’s own.


  Key Terms


  **prohairesis** — The rational faculty of choice: one’s use of impressions and moral response remain one’s own.

  **phantasia** — An impression or presented appearance, which may be described and assented to in more than one way.

  **oikeiōsis** — The Stoic recognition of affinity and belonging that grounds concern for relatives and fellow humans.

  **kathēkon** — An appropriate action, determined by one’s roles and circumstances rather than by reactive emotion.


  Cross-Tradition Resonances


  **Buddhist mettā (loving-kindness):**  Divergence: Buddhist practice often frames this through compassion, non-self, and
  the ending of suffering; Epictetus frames it through rational assent, role, and the Stoic distinction between what depends
  on us and what does not.

  **Jesus’ teaching to love enemies (Matthew 5):**  Divergence: The Gospel teaching is grounded in imitation of a divine Father
  and an ethic of grace; Epictetus argues chiefly from the preservation of rational agency and natural human fellowship.

  **Confucian filial and fraternal ethics:**  Divergence: Confucianism emphasizes ritualized roles and relational harmony,
  whereas Epictetus focuses on the individual’s inner judgment and freedom from passion amid any relational conflict.'
practice: 'When someone close to you wrongs you, write two brief descriptions: first, the offense alone; second, the same
  event including your relation and your role. Before speaking or acting, ask which description enables a just, specific response
  without anger deciding for you.'
