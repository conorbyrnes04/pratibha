unit_label: No Target for Evil
title: No Target for Evil
unit_type: chapter
sanskrit_devanagari: ὥσπερ σκοπὸς πρὸς τὸ ἀποτυχεῖν οὐ τίθεται, οὕτως οὐδὲ κακοῦ φύσις ἐν κόσμῳ γίνεται.
translation_literal: Just as no target is set up in order to be missed, so no nature of evil comes to
  be within the cosmos.
commentary: 'The image is spare and exact. A σκοπός is a mark or target: its very placement implies aim,
  direction, and the possibility of hitting it. To set a target “for missing” (πρὸς τὸ ἀποτυχεῖν) would
  undo the intelligibility of the act. Epictetus extends this point from deliberate human action to the
  κόσμος, the ordered whole.


  His claim is not that painful, destructive, or morally vicious things never occur. Rather, he denies
  that κακόν has a φύσις—a positive, native nature or purposive standing—within reality as a whole. Evil
  is not an intended principle built into the world''s order. The aphorism therefore asks the student
  to distinguish between particular losses and the judgment that the universe itself is fundamentally
  aimed at harm.


  Key Terms


  **σκοπός** — a target, mark, or guiding aim

  **ἀποτυχεῖν** — to miss the mark; to fail to hit one''s aim

  **φύσις** — nature, inherent constitution, or native character

  **κόσμῳ** — the ordered world or cosmos


  Cross-Tradition Resonances


  **Plato, Timaeus 29e:** Plato says that the maker of the cosmos is good and therefore fashions the world
  with order rather than envy or malice. Divergence: Plato grounds cosmic goodness in a divine craftsman,
  whereas Epictetus gives a compact Stoic inference from purposive order itself.

  **Augustine, Enchiridion 11:** Augustine argues that evil is not a substance but a privation of good,
  paralleling the denial that evil possesses an independent φύσις. Divergence: Augustine frames the point
  through Christian creation and sin, while Epictetus offers no account here of creation, fall, or redemption.

  **Maimonides, Guide for the Perplexed III.10:** Maimonides treats many evils as privations or consequences
  of material and human conditions rather than as a positive divine intention. Divergence: Maimonides
  develops a detailed theology of providence and matter; Epictetus states a practical ethical confidence
  in cosmic order.'
practice: 'When something goes badly today, name the event without calling it proof that reality is hostile.
  Ask: “What is the actual loss, and what extra judgment am I adding about the world?”'
