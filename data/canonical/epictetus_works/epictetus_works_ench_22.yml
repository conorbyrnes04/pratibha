title: The Raised Eyebrow
unit_type: chapter
sanskrit_devanagari: εἰ φιλοσοφίας ἐπιθυμεῖς, παρασκευάζου αὐτόθεν ὡς καταγελασθησόμενος, ὡς καταμωκησομένων
  σου πολλῶν, ὡς ἐρούντων ὅτι ἄφνω φιλόσοφος ἡμῖν ἐπανελήλυθε καὶ πόθεν ἡμῖν αὕτη ἡ ὀφρύς; σὺ δὲ ὀφρὺν
  μὲν μὴ σχῇς· τῶν δὲ βελτίστων σοι φαινομένων οὕτως ἔχου, ὡς ὑπὸ τοῦ θεοῦ τεταγμένος εἰς ταύτην τὴν χώραν·
  μέμνησό τε διότι, ἐὰν μὲν ἐμμείνῃς τοῖς αὐτοῖς, οἱ καταγελῶντές σου τὸ πρότερον οὗτοί σε ὕστερον θαυμάσονται,
  ἐὰν δὲ ἡττηθῇς αὐτῶν, διπλοῦν προσλήψῃ καταγέλωτα.
translation_literal: 'If you desire philosophy, prepare yourself at once to be laughed at, to have many
  people mock you, saying, “Suddenly a philosopher has come back among us! And where did he get that lofty
  eyebrow?” But do not put on a lofty eyebrow yourself. Rather, hold fast to what seems best to you, as
  one assigned by God to this post. Remember: if you remain with the same commitments, those who first
  laughed at you will later admire you; but if you yield to them, you will receive a double measure of
  ridicule.'
commentary: 'Epictetus begins with a deliberately unromantic picture of φιλοσοφία: not private refinement,
  but a way of life conspicuous enough to invite derision. The imagined critics notice the newcomer’s
  ὀφρύς, the “eyebrow,” a sign of affected gravity or philosophical superiority. Yet the answer is not
  to retreat into inconspicuousness. It is to refuse both theatrical seriousness and surrender. One must
  not wear the philosopher’s face; one must live the philosopher’s judgment.


  The central demand is ἐμμείνῃς, “remain in” or “persist in” the same things. What matters is not winning
  an argument with mockers but holding one’s place—τὴν χώραν—to which God has assigned one. This is a
  quiet expression of Stoic moral vocation: the individual should faithfully enact the role given, without
  dependence on public approval. If admiration comes, it is incidental; if one is ἡττηθῇς, “defeated”
  by mockery and abandons one’s course, the laughter becomes double because both the original change and
  the collapse have become spectacles.


  Key Terms


  **φιλοσοφίας** — of philosophy; not merely theory, but the pursuit and practice of wisdom.

  **ὀφρύς** — eyebrow; here, a figurative sign of pompous or performative seriousness.

  **ἐμμείνῃς** — you remain steadfast; to persist in one’s chosen commitments.

  **ἡττηθῇς** — you are defeated; here, overcome by others’ ridicule or pressure.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā likewise tells the practitioner to attend to rightful action rather
  than to the fruits or reactions that follow from it. Divergence: Its teaching is framed through devotion
  and liberation from karma, whereas Epictetus emphasizes constancy under social mockery in one’s providentially
  assigned role.

  **Matthew 5:11–12:** Jesus calls those insulted and persecuted on account of righteousness blessed,
  treating public rejection as no final verdict on the faithful person. Divergence: Matthew grounds endurance
  in relation to God’s kingdom and prophetic reward; Epictetus chiefly counsels freedom from the crowd’s
  judgment.

  **Marcus Aurelius, Meditations 5.3:** Marcus urges himself to stop delaying and to live according to
  the work proper to a human being, despite distraction or resistance. Divergence: Marcus writes as self-exhortation
  within an imperial and cosmic perspective, while this passage directly prepares a beginner for the comic
  hostility of others.'
practice: Choose one small, principled habit you have avoided because it may look strange—pausing before
  reacting, declining gossip, or keeping a promise. Do it quietly for seven days. When embarrassment arises,
  name it as “the crowd’s laughter,” relax any performative ὀφρύς, and return to the act itself.
