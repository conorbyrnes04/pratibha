unit_label: Do Not Hand Over Your Mind
title: Do Not Hand Over Your Mind
unit_type: chapter
sanskrit_devanagari: εἰ μὲν τὸ σῶμά σού τις ἐπέτρεπε τῷ ἀπαντήσαντι, ἠγανάκτεις ἄν· ὅτι δὲ σὺ τὴν γνώμην
  τὴν σεαυτοῦ ἐπιτρέπεις τῷ τυχόντι, ἵνα, ἐὰν λοιδορήσηταί σοι, ταραχθῇ ἐκείνη καὶ συγχυθῇ, οὐκ αἰσχύνῃ
  τούτου ἕνεκα;
translation_literal: If you let someone you met take possession of your body, you would be indignant.
  Yet when you hand your own judgment over to whoever happens along—so that, if he abuses you, it becomes
  shaken and thrown into confusion—are you not ashamed to do this?
commentary: 'Epictetus begins with an intentionally jarring comparison. To surrender one''s σώμα, one''s
  body, to a stranger would plainly seem degrading and intolerable. But he asks why we accept an analogous
  surrender in the realm that matters more: our γνώμη, our faculty of judgment, the mind''s stance toward
  what happens. An insult does not simply enter and produce turmoil; turmoil arises when one''s judgment
  grants the insult authority.


  The phrase τῷ τυχόντι, “to just anyone one happens to encounter,” sharpens the rebuke. The speaker may
  be careless, malicious, or ignorant, yet we allow that random person to govern our inner condition.
  For Epictetus, this is a failure to guard what is truly τὰ ἐφʼ ἡμῖν, “what depends on us.” The point
  is not that abuse is good or that one must remain in harmful situations. It is that another''s words
  need not become the ruler of one''s προαίρεσις, one''s moral power of choice.


  Key Terms


  **σῶμα** — body; the outward person, used as the shocking lesser comparison.

  **γνώμη** — judgment, disposition, or considered mental stance.

  **λοιδορήσηταί** — may revile or abuse; speech intended to demean.

  **ταραχθῇ** — may be disturbed, agitated, or inwardly unsettled.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The steady person is described as one not shaken by suffering or swept away
  by passion, much as Epictetus urges independence from another''s insult. Divergence: The Gītā frames
  steadiness within devotion, dharma, and liberation from rebirth; Epictetus frames it as the proper use
  of rational judgment.

  **Proverbs 25:28:** “Like a city breached, without walls, is one who lacks self-control”: both images
  treat unguarded inward life as a kind of exposure to invasion. Divergence: Proverbs emphasizes moral
  self-restraint under the fear of God, whereas Epictetus focuses on the autonomy of one''s evaluative
  faculty.

  **Marcus Aurelius, Meditations 4.3:** Marcus repeatedly counsels withdrawal into the inner ruling center,
  where external speech cannot damage the mind unless it is admitted. Divergence: Marcus writes as a Stoic
  emperor practicing private reminders, while Epictetus addresses the listener directly with confrontational
  pedagogical shame.'
practice: 'At the next slight or insult, pause before replying. Silently distinguish: “Those are their
  words; this is my judgment.” Name the first interpretation that stirs you, then choose one steadier
  judgment—perhaps, “This does not determine my worth”—before deciding whether any response is needed.'
