sanskrit_devanagari: ἰδιώτου στάσις καὶ χαρακτήρ· οὐδέποτε ἐξ ἑαυτοῦ προσδοκᾷ ὠφέλειαν ἢ βλάβην, ἀλλʼ
  ἀπὸ τῶν ἔξω. φιλοσόφου στάσις καὶ χαρακτήρ· πᾶσαν ὠφέλειαν καὶ βλάβην ἐξ ἑαυτοῦ προσδοκᾷ. σημεῖα προκόπτοντος·
  οὐδένα ψέγει, οὐδένα ἐπαινεῖ, οὐδένα μέμφεται, οὐδενὶ ἐγκαλεῖ, οὐδὲν περὶ ἑαυτοῦ λέγει ὡς ὄντος τινὸς
  ἢ εἰδότος τι. ὅταν ἐμποδισθῇ τι ἢ κωλυθῇ, ἑαυτῷ ἐγκαλεῖ. κἄν τις αὐτὸν ἐπαινῇ, καταγελᾷ τοῦ ἐπαινοῦντος
  αὐτὸς παρʼ ἑαυτῷ· κἂν ψέγῃ, οὐκ ἀπολογεῖται. περίεισι δὲ καθάπερ οἱ ἄρρωστοι, εὐλαβούμενός τι κινῆσαι
  τῶν καθισταμένων, πρὶν πῆξιν λαβεῖν. ὄρεξιν ἅπασαν ἦρκεν ἐξ ἑαυτοῦ· τὴν δʼ ἔκκλισιν εἰς μόνα τὰ παρὰ
  φύσιν τῶν ἐφʼ ἡμῖν μετατέθεικεν. ὁρμῇ πρὸς ἅπαντα ἀνειμένῃ χρῆται. ἂν ἠλίθιος ἢ ἀμαθὴς δοκῇ, οὐ πεφρόντικεν.
  ἐνί τε λόγῳ, ὡς ἐχθρὸν ἑαυτὸν παραφυλάσσει καὶ ἐπίβουλον.
