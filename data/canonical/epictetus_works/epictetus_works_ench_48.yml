section: Enchiridion 48
translation_literal: 'The condition and characteristic of a vulgar person, is, that he never expects either
  benefit or hurt from himself, but from externals. The condition and characteristic of a philosopher
  is, that he expects all hurt and benefit from himself. The marks of a proficient are, that he censures
  no one, praises no one, blames no one, accuses no one, says nothing concerning himself as being anybody,
  or knowing anything: when he is, in any instance, hindered or restrained, he accuses himself; and, if
  he is praised, he secretly laughs at the person who praises him; and, if he is censured, he makes no
  defense. But he goes about with the caution of sick or injured people, dreading to move anything that
  is set right, before it is perfectly fixed. He suppresses all desire in himself; he transfers his aversion
  to those things only which thwart the proper use of our own faculty of choice; the exertion of his active
  powers towards anything is very gentle; if he appears stupid or ignorant, he does not care, and, in
  a word, he watches himself as an enemy, and one in ambush.'
commentary: "Epictetus contrasts the vulgar person’s moral outsourcing with the philosopher’s return to\
  \ responsibility. “Benefit” and “hurt” are not primarily events, reputation, praise, obstruction, or\
  \ bodily circumstance; they arise from the use one makes of impressions. Thus the proficient does not\
  \ merely adopt a modest social manner. He has begun to locate good and evil in prohairesis, the faculty\
  \ that assents, refuses, chooses, and uses circumstances. His refusal to accuse others includes refusal\
  \ to make public claims of wisdom: self-display would reveal dependence on external recognition. Laughter\
  \ at praise is not contempt for the praiser but distance from a verdict that cannot make one good. Likewise,\
  \ accepting censure without automatic defense tests whether one’s peace rests on reputation. The image\
  \ of an injured person supplies an important qualification: progress is fragile. The student restrains\
  \ desire and narrows aversion because untrained impulses can readily disturb the still-unsettled ruling\
  \ faculty. This is disciplined caution, not passivity or self-hatred.\n\nKey Terms\n\n**prohairesis**\
  \ — The rational faculty of choice or moral purpose, where Stoics locate genuine good and evil.\n**eph’\
  \ hēmin** — “Up to us”: what depends on our own use of impressions, rather than on external outcomes.\n\
  **orexis** — Desire; in training, it is restrained so that one does not stake happiness on uncertain\
  \ externals.\n**ekklisis** — Aversion; it should be directed only toward misuse of one’s own faculty\
  \ of choice.\n\nCross-Tradition Resonances\n\n**Bhagavad Gita:** \n**Jesus, Sermon on the Mount:** \n\
  **Montaigne, \"Of the Education of Children\":** "
practice: 'At the next moment of praise, blame, or frustration, pause before speaking and write one sentence:
  “What is mine to govern here is ___.” Name only your judgment, intention, or response; do not name another
  person’s fault. Then take one action consistent with that answer without explaining or defending yourself.'
