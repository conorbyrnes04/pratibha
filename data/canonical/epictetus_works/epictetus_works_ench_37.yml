unit_label: The Role That Exceeds You
title: The Role That Exceeds You
unit_type: chapter
sanskrit_devanagari: ἐὰν ὑπὲρ δύναμιν ἀναλάβῃς τι πρόσωπον, καὶ ἐν τούτῳ ἠσχημόνησας καί, ὃ ἠδύνασο ἐκπληρῶσαι,
  παρέλιπες.
translation_literal: If you take on a role beyond your strength, you will not only cut a poor figure in
  it; you will also have left undone what you were capable of carrying through.
commentary: 'Epictetus warns against ἀναλαμβάνειν πρόσωπον, “taking up a role” or public persona, when
  it lies ὑπὲρ δύναμιν, beyond one’s actual power. The issue is not modesty for its own sake, nor a ban
  on growth. It is a demand for accurate judgment: a person should distinguish between an aspiration and
  a charge they can presently sustain.


  The consequence is double. One ἠσχημόνησας—appears unfitting or makes an unbecoming showing—in the oversized
  role; meanwhile, one has παρέλιπες, passed over, the work one could have fulfilled. Stoic discipline
  is therefore not merely about avoiding failure. It asks us to honor the sphere in which responsible
  action is genuinely available, rather than sacrificing attainable duties to an impressive but ill-suited
  πρόσωπον.


  Key Terms


  **ὑπὲρ δύναμιν** — beyond one’s strength or capacity.

  **ἀναλάβῃς** — you take up or assume, especially a burden, task, or role.

  **πρόσωπον** — a role, character, or social persona one undertakes.

  **παρέλιπες** — you neglected, omitted, or left undone.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.35:** The Gītā counsels doing one’s own dharma imperfectly rather than another’s duty
  well, similarly valuing a fitting task over a more glamorous borrowed one. Divergence: Its teaching
  is framed through dharma and inherited social-religious duty, whereas Epictetus speaks more generally
  of capacity and the role one elects to assume.

  **Aristotle, Nicomachean Ethics II.6, 1106b36–1107a2:** Aristotle’s virtue as a mean “relative to us”
  likewise requires perception of what is proportionate to a particular person and circumstance. Divergence:
  Aristotle develops an ethical theory of cultivated character and the mean; Epictetus gives a sharp practical
  warning about overreaching in roles.

  **Gospel of Luke 14:28–30:** Jesus’ image of someone calculating the cost before building a tower echoes
  the need to assess one’s resources before undertaking a public project. Divergence: Luke uses the image
  to press the costly demands of discipleship, while Epictetus aims at fitting self-assignment and the
  preservation of manageable duties.'
practice: Before accepting one new commitment today, name its actual demands—time, skill, attention, and
  emotional cost. Then name one duty you could reliably fulfill instead. Accept the larger role only if
  it does not require abandoning the nearer one.
