sanskrit_devanagari: '(5:11) מְתוּקָה֙ שְׁנַ֣ת הָעֹבֵ֔ד אִם־מְעַ֥ט וְאִם־הַרְבֵּ֖ה יֹאכֵ֑ל וְהַשָּׂבָע֙
  לֶֽעָשִׁ֔יר אֵינֶ֛נּוּ מַנִּ֥יחַֽ ל֖וֹ לִישֽׁוֹן׃

  (5:12) יֵ֚שׁ רָעָ֣ה חוֹלָ֔ה רָאִ֖יתִי תַּ֣חַת הַשָּׁ֑מֶשׁ עֹ֛שֶׁר שָׁמ֥וּר לִבְעָלָ֖יו לְרָעָתֽוֹ׃

  (5:13) וְאָבַ֛ד הָעֹ֥שֶׁר הַה֖וּא בְּעִנְיַ֣ן רָ֑ע וְהוֹלִ֣יד בֵּ֔ן וְאֵ֥ין בְּיָד֖וֹ מְאֽוּמָה׃

  (5:14) כַּאֲשֶׁ֤ר יָצָא֙ מִבֶּ֣טֶן אִמּ֔וֹ עָר֛וֹם יָשׁ֥וּב לָלֶ֖כֶת כְּשֶׁבָּ֑א וּמְא֨וּמָה֙ לֹא־יִשָּׂ֣א
  בַעֲמָל֔וֹ שֶׁיֹּלֵ֖ךְ בְּיָדֽוֹ׃

  (5:15) וְגַם־זֹה֙ רָעָ֣ה חוֹלָ֔ה כָּל־עֻמַּ֥ת שֶׁבָּ֖א כֵּ֣ן יֵלֵ֑ךְ וּמַה־יִּתְר֣וֹן ל֔וֹ שֶֽׁיַּעֲמֹ֖ל
  לָרֽוּחַ׃'
translation_literal: '(5:11) Sweet is the sleep of one who works, whether he eats little or much; but
  the abundance of the rich does not let him sleep.

  (5:12) There is a grievous evil that I have seen beneath the sun: wealth kept by its owner to his own
  harm.

  (5:13) That wealth is lost through a bad venture; then he fathers a son, and nothing remains in his
  hand.

  (5:14) As he came forth naked from his mother''s womb, so he will return, going as he came; from all
  his toil he will carry nothing away in his hand.

  (5:15) This too is a grievous evil: exactly as he came, so he goes. What gain is there for one who toils
  for the wind?'
commentary: 'The passage begins with an arresting reversal: the worker''s sleep is מְתוּקָה (metuqah),
  “sweet,” even if the worker has only little to eat. The rich person, by contrast, is troubled not simply
  by hunger or need but by שָׂבָע (sovaʿ), abundance or fullness. Possession has become unrest. Qoheleth
  does not romanticize deprivation; rather, he observes that having more than one can peacefully receive
  may itself become a burden.


  The evil becomes “grievous” when wealth, carefully guarded, turns against its possessor. A bad undertaking
  can erase it, leaving a father unable to place anything in his son''s hand. The image of the empty hand
  governs the closing lines: one enters the world naked and departs without carrying even the fruit of
  one’s עָמָל (ʿamal), laborious striving. The final phrase, “toiling for the wind,” does not deny that
  work has value; it exposes the futility of treating what cannot be retained as though it were lasting
  gain.


  Key Terms


  **מְתוּקָה (metuqah)** — sweet; pleasant, used here of the laborer''s sleep.

  **עֹשֶׁר (ʿosher)** — wealth or riches, which may be preserved yet become harmful.

  **עָמָל (ʿamal)** — toil, wearisome labor, often carrying the sense of striving under pressure.

  **יִתְרוֹן (yitron)** — advantage, surplus, or enduring gain—the question Qoheleth repeatedly presses.


  Cross-Tradition Resonances


  **Matthew 6:19–21:** Jesus warns against storing up earthly treasures that can be lost, echoing Qoheleth’s
  vision of wealth that cannot be carried away. Divergence: Matthew directs the reader toward treasure
  in heaven, while Qoheleth here emphasizes the earthly instability of gain without offering that explicit
  heavenly alternative.

  **Dhammapada 62:** The verse observes that the foolish person worries, “My sons, my wealth,” though
  neither son nor wealth is finally one''s own; this resembles the father left with nothing after his
  riches vanish. Divergence: The Dhammapada grounds its warning in non-attachment and the doctrine of
  non-self, whereas Qoheleth speaks from within the Israelite frame of mortality, labor, and divine order.

  **Epic of Gilgamesh, Tablet X:** Siduri counsels Gilgamesh to receive food, clothing, family, and daily
  life rather than pursue an impossible permanence, paralleling Qoheleth’s resistance to acquisitive striving.
  Divergence: Gilgamesh is driven by the quest to escape death, while Qoheleth soberly treats death’s
  naked finality as the condition that measures every possession.'
practice: 'Before sleep, place your wallet, keys, or another symbol of what you manage in an open hand.
  Name one necessary provision with gratitude, then open your hand and say: “I came with nothing; I cannot
  keep everything.” Sit quietly for three breaths, and let rest—not accumulation—be the final work of
  the day.'
