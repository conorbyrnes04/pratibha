sanskrit_devanagari: '(7:6) כִּ֣י כְק֤וֹל הַסִּירִים֙ תַּ֣חַת הַסִּ֔יר כֵּ֖ן שְׂחֹ֣ק הַכְּסִ֑יל וְגַם־זֶ֖ה
  הָֽבֶל׃

  (7:7) כִּ֥י הָעֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽיאַבֵּ֥ד אֶת־לֵ֖ב מַתָּנָֽה׃

  (7:8) ט֛וֹב אַחֲרִ֥ית דָּבָ֖ר מֵֽרֵאשִׁית֑וֹ ט֥וֹב אֶֽרֶךְ־ר֖וּחַ מִגְּבַהּ־רֽוּחַ׃

  (7:9) אַל־תְּבַהֵ֥ל בְּרֽוּחֲךָ֖ לִכְע֑וֹס כִּ֣י כַ֔עַס בְּחֵ֥יק כְּסִילִ֖ים יָנֽוּחַ׃

  (7:10) אַל־תֹּאמַר֙ מֶ֣ה הָיָ֔ה שֶׁ֤הַיָּמִים֙ הָרִ֣אשֹׁנִ֔ים הָי֥וּ טוֹבִ֖ים מֵאֵ֑לֶּה כִּ֛י לֹ֥א מֵחָכְמָ֖ה
  שָׁאַ֥לְתָּ עַל־זֶֽה׃'
translation_literal: 'For like the crackling of thornbushes beneath a pot, so is the laughter of a fool;
  this too is vapor.


  For oppression can drive a wise person mad, and a gift corrupts the heart.


  Better is a matter''s end than its beginning; better is one patient in spirit than one lofty in spirit.


  Do not be swift in your spirit to grow angry, for anger comes to rest in the lap of fools.


  Do not say, “Why were the former days better than these?” For it is not from wisdom that you ask about
  this.'
commentary: 'The fool''s laughter is compared to thorns burning under a cooking pot: noisy, sudden, and
  quickly spent. The sound may be lively, but it yields little lasting heat. Qoheleth calls it הֶבֶל (hevel),
  “vapor”: not necessarily nonexistent, but insubstantial and unable to bear the weight placed upon it.


  The passage then acknowledges that folly is not merely an individual defect. עֹשֶׁק (osheq), oppression
  or extortion, can distort even the wise, while a “gift” can ruin the heart when it functions as a corrupting
  payment. Wisdom therefore requires patience—an “end of a matter” may disclose what its beginning concealed—and
  restraint of the spirit. Anger is pictured as making its home in the fool''s lap, held close and nursed.
  The final warning also resists sentimental nostalgia: declaring earlier days superior is not, by itself,
  a wise diagnosis of the present.


  Key Terms


  **הֶבֶל (hevel)** — Vapor, breath; that which is fleeting and insubstantial.

  **עֹשֶׁק (osheq)** — Oppression, exploitation, or extortion.

  **אֶרֶךְ־רוּחַ (erekh-ruaḥ)** — Long of spirit; patient, slow to react.

  **כַּעַס (kaʿas)** — Anger, vexation, or provocation.


  Cross-Tradition Resonances


  **Proverbs 14:29:** Proverbs likewise joins patience with understanding and treats quick temper as a
  form of folly. Divergence: Qoheleth adds a sober social dimension, recognizing that oppression itself
  can unmake even a wise person''s judgment.

  **James 1:19–20:** James urges believers to be slow to anger, since human anger does not produce God''s
  righteousness. Divergence: James frames the warning within obedience to God, while Qoheleth presents
  it as a practical observation about where anger settles.

  **Dhammapada 5:** The Dhammapada teaches that hatred is not ended by hatred, but by non-hatred. Divergence:
  Qoheleth does not set out a doctrine of universal non-hatred; it warns specifically against the foolish
  habit of harboring anger.'
practice: 'When irritation rises today, do not answer for one full minute. Feel where anger is held in
  the body, take six slow breaths, and then ask: “What might the end of this matter reveal that its beginning
  does not?”'
