sanskrit_devanagari: '(2:6) עָשִׂ֥יתִי לִ֖י בְּרֵכ֣וֹת מָ֑יִם לְהַשְׁק֣וֹת מֵהֶ֔ם יַ֖עַר צוֹמֵ֥חַ עֵצִֽים׃

  (2:7) קָנִ֨יתִי֙ עֲבָדִ֣ים וּשְׁפָח֔וֹת וּבְנֵי־בַ֖יִת הָ֣יָה לִ֑י גַּ֣ם מִקְנֶה֩ בָקָ֨ר וָצֹ֤אן הַרְבֵּה֙
  הָ֣יָה לִ֔י מִכֹּ֛ל שֶֽׁהָי֥וּ לְפָנַ֖י בִּירוּשָׁלִָֽם׃

  (2:8) כָּנַ֤סְתִּי לִי֙ גַּם־כֶּ֣סֶף וְזָהָ֔ב וּסְגֻלַּ֥ת מְלָכִ֖ים וְהַמְּדִינ֑וֹת עָשִׂ֨יתִי לִ֜י
  שָׁרִ֣ים וְשָׁר֗וֹת וְתַעֲנוּגֹ֛ת בְּנֵ֥י הָאָדָ֖ם שִׁדָּ֥ה וְשִׁדּֽוֹת׃

  (2:9) וְגָדַ֣לְתִּי וְהוֹסַ֔פְתִּי מִכֹּ֛ל שֶׁהָיָ֥ה לְפָנַ֖י בִּירוּשָׁלִָ֑ם אַ֥ף חָכְמָתִ֖י עָ֥מְדָה
  לִּֽי׃

  (2:10) וְכֹל֙ אֲשֶׁ֣ר שָֽׁאֲל֣וּ עֵינַ֔י לֹ֥א אָצַ֖לְתִּי מֵהֶ֑ם לֹֽא־מָנַ֨עְתִּי אֶת־לִבִּ֜י מִכָּל־שִׂמְחָ֗ה
  כִּֽי־לִבִּ֤י שָׂמֵ֨חַ֙ מִכָּל־עֲמָלִ֔י וְזֶֽה־הָיָ֥ה חֶלְקִ֖י מִכָּל־עֲמָלִֽי׃'
translation_literal: '(6) I made for myself pools of water, to water from them a forest where trees were
  growing.

  (7) I acquired male slaves and female slaves, and I had household-born servants. I also had herds of
  cattle and flocks in great number, more than all who had been before me in Jerusalem.

  (8) I gathered for myself silver and gold, and the treasure of kings and provinces. I provided myself
  male singers and female singers, and the delights of humankind—a woman, and women.

  (9) So I became great, and increased beyond all who were before me in Jerusalem; yet my wisdom also
  remained with me.

  (10) Whatever my eyes asked for, I did not withhold from them. I denied my heart no joy, for my heart
  rejoiced in all my toil; and this was my portion from all my toil.'
commentary: 'The speaker’s catalogue rises outwardly and inwardly: irrigated pools sustain a growing woodland;
  then come laborers, livestock, royal wealth, music, and sexual pleasures. The repeated phrase “for myself”
  gives the inventory its insistent center. Everything is gathered, made, or acquired under the gaze of
  the self. Even the human beings listed among the possessions expose the passage’s royal economy: its
  splendor is inseparable from domination.


  Yet the account is not merely boastful. In verse 9, wisdom still “stood with” the speaker; he claims
  to observe the experiment even while conducting it. Verse 10 names joy as the immediate חֵלֶק (ḥeleq),
  a “portion” or allotted share, of his עָמָל (ʿamal), his strenuous labor. This is a real reward, but
  it is carefully limited: joy is only the portion from toil, not a declaration that accumulation has
  secured lasting meaning.


  Key Terms


  **עָמָל (ʿamal)** — toil, labor, or wearisome exertion.

  **חֵלֶק (ḥeleq)** — a share, portion, or allotted lot.

  **שִׂמְחָה (śimḥah)** — joy, gladness, celebration.

  **חָכְמָה (ḥokhmah)** — wisdom, practical discernment.


  Cross-Tradition Resonances


  **Luke 12:16–21, Parable of the Rich Fool:** Both texts portray enlarged resources and abundant goods
  as unable, by themselves, to settle the question of a life’s true good. Divergence: Qoheleth grants
  a genuine present joy as the worker’s portion, whereas Luke’s parable focuses on sudden death and being
  rich toward God.

  **Bhagavad Gita 2.47:** Both texts attend closely to action and its relation to the one who acts, questioning
  whether labor’s visible yield is the final measure of life. Divergence: The Gita counsels relinquishment
  of attachment to fruits of action; Qoheleth here reports delight in the fruit of his own toil.

  **Dhammapada 186–187:** The Buddhist verses warn that sensual pleasures do not satisfy desire, paralleling
  Qoheleth’s larger examination of pleasure and acquisition. Divergence: This passage still records pleasure
  as a legitimate temporary portion, rather than treating it solely as an object to be renounced.'
practice: 'Take a slow walk through one space you maintain—a room, garden, desk, or workplace. Name three
  things your labor has produced, then sit quietly for five minutes and ask: “What joy is present now,
  apart from acquiring one more thing?”'
