sanskrit_devanagari: '(1:6) הוֹלֵךְ֙ אֶל־דָּר֔וֹם וְסוֹבֵ֖ב אֶל־צָפ֑וֹן סוֹבֵ֤ב ׀ סֹבֵב֙ הוֹלֵ֣ךְ הָר֔וּחַ
  וְעַל־סְבִיבֹתָ֖יו שָׁ֥ב הָרֽוּחַ׃

  (1:7) כָּל־הַנְּחָלִים֙ הֹלְכִ֣ים אֶל־הַיָּ֔ם וְהַיָּ֖ם אֵינֶ֣נּוּ מָלֵ֑א אֶל־מְק֗וֹם שֶׁ֤הַנְּחָלִים֙
  הֹֽלְכִ֔ים שָׁ֛ם הֵ֥ם שָׁבִ֖ים לָלָֽכֶת׃

  (1:8) כָּל־הַדְּבָרִ֣ים יְגֵעִ֔ים לֹא־יוּכַ֥ל אִ֖ישׁ לְדַבֵּ֑ר לֹא־תִשְׂבַּ֥ע עַ֨יִן֙ לִרְא֔וֹת וְלֹא־תִמָּלֵ֥א
  אֹ֖זֶן מִשְּׁמֹֽעַ׃

  (1:9) מַה־שֶּֽׁהָיָה֙ ה֣וּא שֶׁיִּהְיֶ֔ה וּמַה־שֶׁנַּֽעֲשָׂ֔ה ה֖וּא שֶׁיֵּעָשֶׂ֑ה וְאֵ֥ין כָּל־חָדָ֖שׁ
  תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (1:10) יֵ֥שׁ דָּבָ֛ר שֶׁיֹּאמַ֥ר רְאֵה־זֶ֖ה חָדָ֣שׁ ה֑וּא כְּבָר֙ הָיָ֣ה לְעֹֽלָמִ֔ים אֲשֶׁ֥ר הָיָ֖ה
  מִלְּפָנֵֽנוּ׃'
translation_literal: 'The wind goes toward the south, then turns toward the north; turning and turning,
  the wind travels, and upon its circuits the wind returns.


  All the streams go to the sea, yet the sea is not filled; to the place where the streams go, there they
  return to go again.


  All things are exhausting—no one can fully tell it. The eye is not satisfied with seeing, nor is the
  ear filled by hearing.


  What has been is what will be, and what has been done is what will be done; there is nothing wholly
  new beneath the sun.


  Is there a thing of which one says, “Look—this is new”? It has already existed in ages that were before
  us.'
commentary: 'Qoheleth watches the world in motion: wind circles from south to north and returns upon its
  סְבִיבוֹתָיו (sevivotav), its rounds; streams pour into the sea without bringing it to fullness, only
  to return again to their going. This is not a picture of a dead universe, but of restless continuity.
  Nature moves constantly, yet its movement does not seem to arrive at a final surplus or completion.


  The human creature belongs inside this same pattern. “All things are יְגֵעִים (yege''im), wearying”:
  reality exceeds speech, while eye and ear remain unfilled. Desire for another sight, another sound,
  another discovery persists even amid abundance. Thus the claim that nothing is new “beneath the sun”
  is less a denial that events differ than a sober judgment about recurring human patterns. What is announced
  as unprecedented often proves to have an older likeness, already present before our time.


  Key Terms


  **הָרוּחַ (haruaḥ)** — the wind; also a word that can suggest breath or spirit, here moving in repeated
  circuits

  **הַנְּחָלִים (hannaḥalim)** — the streams or seasonal watercourses flowing toward the sea

  **יְגֵעִים (yege''im)** — wearying, exhausting, beyond easy mastery or description

  **חָדָשׁ (ḥadash)** — new; that which is claimed to be unprecedented


  Cross-Tradition Resonances


  **Heraclitus, Fragment 12 (DK 22B12):** Heraclitus likewise uses rivers to contemplate a world marked
  by continual movement and recurrence. Divergence: Heraclitus stresses flux—one does not step into the
  same river—whereas Qoheleth stresses the enduring repetitiveness of the whole cycle.

  **Bhagavad Gita 2.14:** The Gita describes sensory contacts as coming and going, inviting endurance
  amid their impermanence. Divergence: The Gita directs this insight toward disciplined detachment and
  liberation, while Qoheleth here lingers with the unsated weariness of perception.

  **Marcus Aurelius, Meditations 4.3:** Marcus observes the swift passing and recycling of things in the
  cosmos, diminishing the glamour of novelty. Divergence: Stoic reflection seeks inward consent to rational
  cosmic order; Qoheleth offers observation without yet supplying that philosophical resolution.'
practice: For ten minutes, sit outdoors or by an open window. Attend to one repeating motion—wind in leaves,
  traffic, breath, water, light—and quietly name each return. Then write one sentence naming a “new” concern
  in your life and one older human pattern it may share.
