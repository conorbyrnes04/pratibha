sanskrit_devanagari: '(8:1) מִ֚י כְּהֶ֣חָכָ֔ם וּמִ֥י יוֹדֵ֖עַ פֵּ֣שֶׁר דָּבָ֑ר חָכְמַ֤ת אָדָם֙ תָּאִ֣יר
  פָּנָ֔יו וְעֹ֥ז פָּנָ֖יו יְשֻׁנֶּֽא׃

  (8:2) אֲנִי֙ פִּי־מֶ֣לֶךְ שְׁמ֔וֹר וְעַ֕ל דִּבְרַ֖ת שְׁבוּעַ֥ת אֱלֹהִֽים׃

  (8:3) אַל־תִּבָּהֵ֤ל מִפָּנָיו֙ תֵּלֵ֔ךְ אַֽל־תַּעֲמֹ֖ד בְּדָבָ֣ר רָ֑ע כִּ֛י כָּל־אֲשֶׁ֥ר יַחְפֹּ֖ץ
  יַעֲשֶֽׂה׃

  (8:4) בַּאֲשֶׁ֥ר דְּבַר־מֶ֖לֶךְ שִׁלְט֑וֹן וּמִ֥י יֹֽאמַר־ל֖וֹ מַֽה־תַּעֲשֶֽׂה׃

  (8:5) שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְעֵ֣ת וּמִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃'
translation_literal: 'Who is like the wise person, and who knows how to interpret a matter? A person’s
  wisdom brightens the face, and the hardness of that face is changed.


  I say: Keep the king’s command, because of the oath of God. Do not hasten away from his presence; do
  not persist in an evil matter, for he does whatever he desires. Since the king’s word carries authority,
  who can say to him, “What are you doing?”


  Whoever keeps a command will not know an evil thing; and the heart of the wise knows the proper time
  and the judgment.'
commentary: 'The passage opens with admiration for the חָכָם (ḥakham), the wise person who can discern
  the פֵּשֶׁר (pesher), the meaning or resolution of a matter. Wisdom is not merely inward possession:
  it illumines the face and alters its עֹז (ʿoz), its severity or hard-set strength. The wise person becomes
  visibly different—not necessarily carefree, but less rigid before the complexities of life.


  Qoheleth then turns soberly toward royal power. The king’s word is שִׁלְטוֹן (shilton), effective dominion;
  it cannot easily be challenged. Yet the counsel is not simple celebration of authority. In an environment
  where a ruler may do what he pleases, wisdom consists in measured conduct: neither a panicked departure
  nor stubborn involvement in a bad cause. This is practical discernment under constraint.


  The final line gives wisdom its deeper work. Keeping a command may shield one from “an evil thing,”
  but the wise heart also knows עֵת וּמִשְׁפָּט (ʿet u-mishpat), the right time and the fitting judgment.
  Wisdom is therefore not blind compliance. It is the patient capacity to recognize when, how, and under
  what judgment one must act.


  Key Terms


  **חָכְמָה (ḥokhmah)** — wisdom; practical and discerning insight

  **פֵּשֶׁר (pesher)** — interpretation, explanation, or resolution of a matter

  **שִׁלְטוֹן (shilton)** — dominion, governing authority

  **מִשְׁפָּט (mishpat)** — judgment, justice, or a fitting decision


  Cross-Tradition Resonances


  **Romans 13:1–7:** Paul likewise urges recognition of governing authority and practical submission within
  public order. Divergence: Qoheleth offers prudent counsel in the face of royal power, whereas Romans
  frames authority more explicitly as ordained by God for social good.

  **Analects 2.3:** Confucius distinguishes rule by coercive punishment from moral formation, sharing
  this passage’s concern for wise conduct within political life. Divergence: The Analects places greater
  hope in the ruler’s virtue, while Qoheleth stresses the king’s largely unanswerable power.

  **Dhammapada 256–257:** The Dhammapada teaches that true judgment is not hasty but is exercised by one
  who weighs matters wisely and impartially. Divergence: Its focus is moral and spiritual judgment in
  general, while Qoheleth specifically addresses discernment under monarchy.'
practice: 'Before a difficult conversation with a supervisor, official, or other authority, pause for
  three breaths and write two brief lines: “What is the right time?” and “What is the fitting judgment?”
  Then speak without haste, flattery, or needless defiance.'
