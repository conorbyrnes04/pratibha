sanskrit_devanagari: '(9:6) גַּ֣ם אַהֲבָתָ֧ם גַּם־שִׂנְאָתָ֛ם גַּם־קִנְאָתָ֖ם כְּבָ֣ר אָבָ֑דָה וְחֵ֨לֶק
  אֵין־לָהֶ֥ם עוֹד֙ לְעוֹלָ֔ם בְּכֹ֥ל אֲשֶֽׁר־נַעֲשָׂ֖ה תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (9:7) לֵ֣ךְ אֱכֹ֤ל בְּשִׂמְחָה֙ לַחְמֶ֔ךָ וּֽשֲׁתֵ֥ה בְלֶב־ט֖וֹב יֵינֶ֑ךָ כִּ֣י כְבָ֔ר רָצָ֥ה הָאֱלֹהִ֖ים
  אֶֽת־מַעֲשֶֽׂיךָ׃

  (9:8) בְּכָל־עֵ֕ת יִהְי֥וּ בְגָדֶ֖יךָ לְבָנִ֑ים וְשֶׁ֖מֶן עַל־רֹאשְׁךָ֥ אַל־יֶחְסָֽר׃

  (9:9) רְאֵ֨ה חַיִּ֜ים עִם־אִשָּׁ֣ה אֲשֶׁר־אָהַ֗בְתָּ כָּל־יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔ךָ אֲשֶׁ֤ר נָֽתַן־לְךָ֙
  תַּ֣חַת הַשֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑ךָ כִּ֣י ה֤וּא חֶלְקְךָ֙ בַּֽחַיִּ֔ים וּבַעֲמָ֣לְךָ֔ אֲשֶׁר־אַתָּ֥ה
  עָמֵ֖ל תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (9:10) כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְךָ֛ לַעֲשׂ֥וֹת בְּכֹחֲךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְחֶשְׁבּוֹן֙
  וְדַ֣עַת וְחָכְמָ֔ה בִּשְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּה׃ ס'
translation_literal: '(9:6) Their love, their hatred, and their envy have already vanished; and they will
  never again have a share in anything that is done beneath the sun.


  (9:7) Go: eat your bread with gladness, and drink your wine with a good heart, for God has already looked
  with favor upon your deeds.


  (9:8) Let your garments be white at every time, and let oil not be lacking upon your head.


  (9:9) See life with the wife whom you love, through all the days of your fleeting life which he has
  given you beneath the sun—all your fleeting days. For that is your portion in life and in your toil
  by which you labor beneath the sun.


  (9:10) Whatever your hand finds to do, do it with your strength; for in Sheol, where you are going,
  there is no doing, no reckoning, no knowledge, and no wisdom.'
commentary: 'The passage begins with a hard boundary: the dead no longer participate in what happens “beneath
  the sun.” Love, hatred, and envy—the passions by which people cling to the world—have perished. Qoheleth
  does not offer this observation to make life empty, but to make its present gifts vivid. Because no
  permanent claim can be made upon the world, bread, wine, clean clothing, fragrant oil, and beloved companionship
  become occasions for grateful attention.


  The repeated word הֶבֶל (hevel), often suggesting breath, vapor, or transience, does not erase life’s
  goodness. It names its fragility. The beloved wife, daily food, and one’s עָמָל (ʿamal), laboring toil,
  are called one’s “portion”: not possessions secured forever, but gifts allotted for the days at hand.
  Verse 10 gives the summons its sharpness: act with all your strength now. The horizon of Sheol makes
  neither frantic achievement nor passive despair fitting; it calls for wholehearted, earthly faithfulness.


  Key Terms


  **הֶבֶל (hevel)** — breath, vapor, transience; the fleeting character of mortal life

  **חֵלֶק (ḥeleq)** — portion or allotted share, especially one’s present share in life

  **עָמָל (ʿamal)** — toil, labor, often work marked by effort and weariness

  **שְׁאוֹל (Sheol)** — the realm of the dead, where earthly activity and calculation cease


  Cross-Tradition Resonances


  **Epic of Gilgamesh, Tablet X (Siduri’s counsel):** Siduri directs the mortal Gilgamesh toward daily
  joy, clean clothing, bathing, and delight in household life because human life is brief. Divergence:
  Qoheleth frames eating, drinking, adornment, love, and work as a portion received under God’s favorable
  regard, rather than simply mortality’s consolation.

  **Bhagavad Gita 3:19:** The Gita likewise urges resolute action: one should perform the work that must
  be done rather than surrender oneself to inaction. Divergence: Its ideal is action without attachment
  for spiritual liberation, whereas Qoheleth joins vigorous work to the immediate enjoyment of one’s mortal
  portion before Sheol.

  **Luke 12:19–20:** Both texts place eating, drinking, and human plans beneath the sobering fact that
  life can end suddenly. Divergence: Luke’s parable rebukes the rich man’s self-secure abundance, while
  Qoheleth explicitly commends humble enjoyment of bread and wine as gifts already received.'
practice: Today, put on one clean or beautiful garment, prepare and eat a simple meal without screens,
  and share it with someone you love if possible. Then choose one neglected task that your hand can actually
  do and give it thirty undivided minutes of your strength.
