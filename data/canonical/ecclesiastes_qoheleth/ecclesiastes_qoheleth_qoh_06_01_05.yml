sanskrit_devanagari: '(6:1) יֵ֣שׁ רָעָ֔ה אֲשֶׁ֥ר רָאִ֖יתִי תַּ֣חַת הַשָּׁ֑מֶשׁ וְרַבָּ֥ה הִ֖יא עַל־הָאָדָֽם׃

  (6:2) אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן־ל֣וֹ הָאֱלֹהִ֡ים עֹשֶׁר֩ וּנְכָסִ֨ים וְכָב֜וֹד וְֽאֵינֶ֨נּוּ חָסֵ֥ר לְנַפְשׁ֣וֹ
  ׀ מִכֹּ֣ל אֲשֶׁר־יִתְאַוֶּ֗ה וְלֹֽא־יַשְׁלִיטֶ֤נּוּ הָֽאֱלֹהִים֙ לֶאֱכֹ֣ל מִמֶּ֔נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י
  יֹֽאכֲלֶ֑נּוּ זֶ֥ה הֶ֛בֶל וָחֳלִ֥י רָ֖ע הֽוּא׃

  (6:3) אִם־יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְשָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְרַ֣ב ׀ שֶׁיִּהְי֣וּ יְמֵֽי־שָׁנָ֗יו
  וְנַפְשׁוֹ֙ לֹא־תִשְׂבַּ֣ע מִן־הַטּוֹבָ֔ה וְגַם־קְבוּרָ֖ה לֹא־הָ֣יְתָה לּ֑וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖נּוּ
  הַנָּֽפֶל׃

  (6:4) כִּֽי־בַהֶ֥בֶל בָּ֖א וּבַחֹ֣שֶׁךְ יֵלֵ֑ךְ וּבַחֹ֖שֶׁךְ שְׁמ֥וֹ יְכֻסֶּֽה׃

  (6:5) גַּם־שֶׁ֥מֶשׁ לֹא־רָאָ֖ה וְלֹ֣א יָדָ֑ע נַ֥חַת לָזֶ֖ה מִזֶּֽה׃'
translation_literal: 'There is an evil I have seen beneath the sun, and it weighs heavily upon humankind:
  a man to whom God gives wealth, possessions, and honor, lacking nothing for himself of all that he desires,
  yet God does not give him power to partake of it; instead, a stranger consumes it. This is breath and
  a grievous affliction.


  Should a man father a hundred children and live many years—however numerous the days of his years may
  be—yet his appetite is not satisfied with good, and he receives no burial, I say that the stillborn
  child is better off than he. For it comes in futility and goes away in darkness, and in darkness its
  name is covered. Though it has not seen the sun or known anything, it has more rest than that man.'
commentary: 'Qoheleth names this condition רָעָה (ra''ah), an evil or calamity: abundance is present,
  yet the capacity to receive it as one’s own is withheld. Wealth, property, honor, and even the fulfillment
  of desire cannot secure enjoyment. The repeated agency of God makes the observation sharper: possession
  is not mastery, and life’s goods are not automatically available to the person who has them.


  The passage then presses its argument to an appalling edge. A long-lived father of a hundred, if left
  unsatisfied and unburied, is judged less fortunate than הַנָּפֶל (hannefel), the stillborn. This is
  not sentimentality about death, but a severe exposure of life emptied of good and dignity. The stillborn
  enters and departs in הֶבֶל (hevel), vapor-like futility, yet possesses נַחַת (naḥat), rest, beyond
  the restless man whose years and descendants have not become a life.


  Key Terms


  **רָעָה (ra''ah)** — evil, harm, or grievous misfortune

  **נְכָסִים (nekhasim)** — possessions, property, assets

  **הֶבֶל (hevel)** — vapor, transience, futile emptiness

  **נַחַת (naḥat)** — rest, settled ease


  Cross-Tradition Resonances


  **Job 3:11–19:** Job longs for the rest of one who died at birth, portraying death as a place where
  the exhausted and oppressed cease from turmoil. Divergence: Job speaks from personal anguish and seeks
  release, while Qoheleth uses the stillborn as a comparative judgment on a prosperous but unfulfilled
  life.

  **Psalm 49:16–20:** The psalm warns that wealth and honor cannot accompany a person beyond death, nor
  guarantee lasting light. Divergence: Psalm 49 grounds its warning in confidence in God’s redemption,
  whereas Qoheleth here remains with the observable tragedy of unenjoyed possession.

  **Luke 12:16–21:** Jesus’ parable of the rich fool similarly portrays stored-up abundance as unable
  to secure one’s life or future. Divergence: Luke directs the hearer toward being rich toward God; Qoheleth’s
  saying offers no explicit remedy, only a searching recognition of life’s limits.'
practice: Place one ordinary nourishing thing before you—a cup of water, bread, or fruit. Before consuming
  it, name aloud one possession or achievement you cannot finally control; then receive the food slowly,
  giving thanks for the present ability to enjoy it.
