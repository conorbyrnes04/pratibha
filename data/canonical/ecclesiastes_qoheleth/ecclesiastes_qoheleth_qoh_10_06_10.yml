sanskrit_devanagari: '(10:6) נִתַּ֣ן הַסֶּ֔כֶל בַּמְּרוֹמִ֖ים רַבִּ֑ים וַעֲשִׁירִ֖ים בַּשֵּׁ֥פֶל יֵשֵֽׁבוּ׃

  (10:7) רָאִ֥יתִי עֲבָדִ֖ים עַל־סוּסִ֑ים וְשָׂרִ֛ים הֹלְכִ֥ים כַּעֲבָדִ֖ים עַל־הָאָֽרֶץ׃

  (10:8) חֹפֵ֥ר גּוּמָּ֖ץ בּ֣וֹ יִפּ֑וֹל וּפֹרֵ֥ץ גָּדֵ֖ר יִשְּׁכֶ֥נּוּ נָחָֽשׁ׃

  (10:9) מַסִּ֣יעַ אֲבָנִ֔ים יֵעָצֵ֖ב בָּהֶ֑ם בּוֹקֵ֥עַ עֵצִ֖ים יִסָּ֥כֶן בָּֽם׃

  (10:10) אִם־קֵהָ֣ה הַבַּרְזֶ֗ל וְהוּא֙ לֹא־פָנִ֣ים קִלְקַ֔ל וַחֲיָלִ֖ים יְגַבֵּ֑ר וְיִתְר֥וֹן הכשיר
  חָכְמָֽה׃'
translation_literal: '(6) Folly is set in many lofty places, while the wealthy sit in lowliness.

  (7) I have seen servants riding on horses, and princes walking on the ground like servants.

  (8) Whoever digs a pit may fall into it; whoever breaches a wall may be bitten by a snake.

  (9) Whoever moves stones may be hurt by them; whoever splits wood may be endangered by it.

  (10) If the iron is dull and one has not sharpened its edge, then greater strength must be exerted;
  yet wisdom brings the advantage of making one effective.'
commentary: 'Qoheleth first observes a world turned upside down: הַסֶּכֶל (hassekhel, “folly”) occupies
  elevated stations, while those called עֲשִׁירִים (ʿashirim, “wealthy ones”) are made to sit below. The
  images of servants on horses and princes walking like servants are not merely complaints about status.
  They expose the instability of visible order: rank does not reliably disclose worth, competence, or
  wisdom.


  The saying then turns from public disorder to the hazards embedded in work itself. Digging, dismantling,
  lifting, and splitting are necessary acts, yet each contains its own danger. The final image gathers
  the lesson: a dull iron tool can still do its work, but only at the cost of excessive force. Wisdom
  is not abstract cleverness; it is the capacity to prepare, to notice an edge gone dull, and to act with
  fitting skill. Against wasteful exertion, חָכְמָה (ḥokhmah, “wisdom”) offers a more effective way.


  Key Terms


  **הַסֶּכֶל (hassekhel)** — folly; foolishness, especially as it appears in positions of influence

  **גּוּמָּץ (gummats)** — a pit or excavation, a danger that can ensnare its maker

  **בַּרְזֶל (barzel)** — iron; here, the cutting tool whose edge has become dull

  **חָכְמָה (ḥokhmah)** — wisdom; practical discernment that enables effective action


  Cross-Tradition Resonances


  **Proverbs 26:27:** “Whoever digs a pit” echoes the proverb that the one who excavates a pit may fall
  into it, portraying wrongdoing or reckless action as self-returning. Divergence: Proverbs explicitly
  frames the image around malice and its recoil, while Qoheleth also applies such peril to ordinary, morally
  neutral labor.

  **Tao Te Ching 58:** The Tao Te Ching observes that under disordered rule, uprightness may become distorted
  and goodness may turn strange, much like Qoheleth’s vision of misplaced persons and positions. Divergence:
  The Tao Te Ching directs attention toward noncoercive, humble governance, whereas Qoheleth moves quickly
  from political inversion to the practical risks of work.

  **Dhammapada 280:** The Dhammapada warns that one who does not rise when it is time to act, despite
  being capable, fails to find the path of wisdom; Qoheleth likewise values timely, capable action over
  mere exertion. Divergence: The Buddhist verse concerns spiritual discipline and liberation, while Ecclesiastes
  10:10 concerns the tangible efficiency gained by sharpening a tool and using skill.'
practice: 'Before one necessary task today, pause for two minutes to inspect and prepare: sharpen, organize,
  ask for instruction, or remove one foreseeable hazard. Then begin with less force and greater attention.'
