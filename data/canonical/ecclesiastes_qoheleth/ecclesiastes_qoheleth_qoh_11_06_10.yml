sanskrit_devanagari: '(11:6) בַּבֹּ֨קֶר֙ זְרַ֣ע אֶת־זַרְעֶ֔ךָ וְלָעֶ֖רֶב אַל־תַּנַּ֣ח יָדֶ֑ךָ כִּי֩ אֵֽינְךָ֨
  יוֹדֵ֜ע אֵ֣י זֶ֤ה יִכְשָׁר֙ הֲזֶ֣ה אוֹ־זֶ֔ה וְאִם־שְׁנֵיהֶ֥ם כְּאֶחָ֖ד טוֹבִֽים׃

  (11:7) וּמָת֖וֹק הָא֑וֹר וְט֥וֹב לַֽעֵינַ֖יִם לִרְא֥וֹת אֶת־הַשָּֽׁמֶשׁ׃

  (11:8) כִּ֣י אִם־שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָאָדָ֖ם בְּכֻלָּ֣ם יִשְׂמָ֑ח וְיִזְכֹּר֙ אֶת־יְמֵ֣י הַחֹ֔שֶׁךְ
  כִּֽי־הַרְבֵּ֥ה יִהְי֖וּ כָּל־שֶׁבָּ֥א הָֽבֶל׃

  (11:9) שְׂמַ֧ח בָּח֣וּר בְּיַלְדוּתֶ֗יךָ וִֽיטִֽיבְךָ֤ לִבְּךָ֙ בִּימֵ֣י בְחוּרוֹתֶ֔ךָ וְהַלֵּךְ֙ בְּדַרְכֵ֣י
  לִבְּךָ֔ וּבְמַרְאֵ֖י עֵינֶ֑יךָ וְדָ֕ע כִּ֧י עַל־כָּל־אֵ֛לֶּה יְבִֽיאֲךָ֥ הָאֱלֹהִ֖ים בַּמִּשְׁפָּֽט׃

  (11:10) וְהָסֵ֥ר כַּ֨עַס֙ מִלִּבֶּ֔ךָ וְהַעֲבֵ֥ר רָעָ֖ה מִבְּשָׂרֶ֑ךָ כִּֽי־הַיַּלְד֥וּת וְהַֽשַּׁחֲר֖וּת
  הָֽבֶל׃'
translation_literal: '(11:6) In the morning sow your seed, and toward evening do not let your hand be
  still; for you do not know which will prosper—this or that—or whether both alike will prove good.


  (11:7) Light is sweet, and it is good for the eyes to behold the sun.


  (11:8) For if a person lives many years, let him rejoice in all of them; yet let him remember the days
  of darkness, for they will be many. Everything that is coming is vapor.


  (11:9) Rejoice, young man, in your youth; let your heart cheer you in the days of your vigor. Walk in
  the paths of your heart and according to what your eyes behold; but know that for all these things God
  will bring you into judgment.


  (11:10) So remove vexation from your heart, and put away harm from your flesh; for youth and the dawn
  of life are vapor.'
commentary: 'Qoheleth begins with a farmer’s wisdom: sow in the morning and keep your hand active into
  evening. The reason is not confidence in mastery but the opposite: “you do not know” (אֵינְךָ יוֹדֵעַ,
  ʾenekha yodeaʿ) what undertaking will succeed. Uncertainty need not produce paralysis. One works faithfully,
  while admitting that outcomes remain beyond one’s command.


  The passage then turns toward the sweetness of light and the pleasure of seeing the sun. Such delight
  is genuine, yet it is held beside the coming “days of darkness” and the recurring verdict הֶבֶל (hevel),
  vapor: fleeting, unsubstantial, impossible to secure. Youth is therefore neither condemned nor idolized.
  The young are summoned to joy, desire, and movement, but also to judgment (מִשְׁפָּט, mishpat). Qoheleth’s
  counsel is expansive and bracing: receive life’s brightness, relinquish corrosive anger, and live freely
  in ways that can answer before God.


  Key Terms


  **זַרְעֶךָ (zarʿekha)** — “your seed”; what one sows or entrusts to an uncertain future.

  **אוֹר (ʾor)** — “light”; the sweet gift of being alive and seeing the sun.

  **הֶבֶל (hevel)** — “vapor” or “breath”; that which is fleeting and cannot be held fast.

  **מִשְׁפָּט (mishpat)** — “judgment”; God’s moral reckoning concerning human action.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita directs a person toward faithful action without possession of its results,
  resembling Qoheleth’s call to sow despite not knowing what will prosper. Divergence: The Gita grounds
  detachment in disciplined devotion and liberation, while Qoheleth emphasizes creaturely uncertainty
  under God’s judgment.

  **Matthew 6:34:** Jesus’ warning not to be consumed by tomorrow echoes Qoheleth’s refusal to let uncertainty
  prevent present faithfulness. Divergence: Matthew centers trust in the Father’s provision, whereas Qoheleth
  here advises diversified labor without offering a promise of provision.

  **Seneca, On the Shortness of Life 1.3:** Seneca likewise urges people not to squander the brief span
  of life, a concern akin to Qoheleth’s summons to receive light and youth attentively. Divergence: Seneca
  seeks wisdom through rational command of one’s time; Qoheleth keeps human life answerable to God and
  marked by hevel.'
practice: At morning, name two small acts of “sowing” you can do today—one practical, one relational—and
  do both without demanding a visible result. At evening, stand outdoors or by a window for three minutes,
  notice the remaining light, and release one vexation from your heart in a brief prayer.
