sanskrit_devanagari: '(2:11) וּפָנִ֣יתִֽי אֲנִ֗י בְּכָל־מַעֲשַׂי֙ שֶֽׁעָשׂ֣וּ יָדַ֔י וּבֶֽעָמָ֖ל שֶׁעָמַ֣לְתִּי
  לַעֲשׂ֑וֹת וְהִנֵּ֨ה הַכֹּ֥ל הֶ֨בֶל֙ וּרְע֣וּת ר֔וּחַ וְאֵ֥ין יִתְר֖וֹן תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (2:12) וּפָנִ֤יתִֽי אֲנִי֙ לִרְא֣וֹת חָכְמָ֔ה וְהוֹלֵל֖וֹת וְסִכְל֑וּת כִּ֣י ׀ מֶ֣ה הָאָדָ֗ם שֶׁיָּבוֹא֙
  אַחֲרֵ֣י הַמֶּ֔לֶךְ אֵ֥ת אֲשֶׁר־כְּבָ֖ר עָשֽׂוּהוּ׃

  (2:13) וְרָאִ֣יתִי אָ֔נִי שֶׁיֵּ֥שׁ יִתְר֛וֹן לַֽחָכְמָ֖ה מִן־הַסִּכְל֑וּת כִּֽיתְר֥וֹן הָא֖וֹר מִן־הַחֹֽשֶׁךְ׃

  (2:14) הֶֽחָכָם֙ עֵינָ֣יו בְּרֹאשׁ֔וֹ וְהַכְּסִ֖יל בַּחֹ֣שֶׁךְ הוֹלֵ֑ךְ וְיָדַ֣עְתִּי גַם־אָ֔נִי שֶׁמִּקְרֶ֥ה
  אֶחָ֖ד יִקְרֶ֥ה אֶת־כֻּלָּֽם׃

  (2:15) וְאָמַ֨רְתִּֽי אֲנִ֜י בְּלִבִּ֗י כְּמִקְרֵ֤ה הַכְּסִיל֙ גַּם־אֲנִ֣י יִקְרֵ֔נִי וְלָ֧מָּה חָכַ֛מְתִּי
  אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְדִבַּ֣רְתִּי בְלִבִּ֔י שֶׁגַּם־זֶ֖ה הָֽבֶל׃'
translation_literal: '(11) Then I turned to consider all the works my hands had made, and the toil in
  which I had labored to make them; and look: it was all vapor and a herding of wind, with no enduring
  surplus beneath the sun.


  (12) Then I turned to examine wisdom, madness, and folly. For what can the person who comes after the
  king do, beyond what has already been done?


  (13) Yet I saw that wisdom has an advantage over folly, as light has an advantage over darkness.


  (14) The wise one has eyes in his head, while the fool walks in darkness; but I also came to know that
  one event befalls them all.


  (15) So I said in my heart, “As the event of the fool befalls him, so it will befall me. Why, then,
  have I become wiser to such excess?” And I said in my heart, “This too is vapor.”'
commentary: 'Qoheleth looks back upon achievement—everything his own hands have produced and the labor
  invested in it—and finds no lasting יִתְרוֹן (yitron), no remainder that can be retained “beneath the
  sun.” His verdict, הֶבֶל (hevel), is not simply that work is worthless. It is more like breath, mist,
  or vapor: tangible for a moment, then impossible to hold. The phrase רְעוּת רוּחַ, “a herding of wind,”
  sharpens the image: one strives to gather and direct what will not stay gathered.


  The speaker does not flatten wisdom and folly into identical things. Wisdom is genuinely preferable,
  as light surpasses darkness; the wise person sees where he or she is going. Yet wisdom cannot finally
  exempt its bearer from מִקְרֶה אֶחָד (miqreh eḥad), “one event,” the shared contingency of mortal life.
  Thus Qoheleth’s question is not anti-wisdom but painfully exact: if death reaches wise and foolish alike,
  what ultimate excess has wisdom secured? Even this sober insight becomes hevel when it is made into
  a claim of permanent mastery.


  Key Terms


  **הֶבֶל (hevel)** — Vapor, breath, evanescence; what cannot be grasped or made lasting.

  **עָמָל (ʿamal)** — Toil or labor, especially strenuous effort expended in making and achieving.

  **יִתְרוֹן (yitron)** — Surplus, advantage, or lasting gain remaining after the effort.

  **מִקְרֶה (miqreh)** — An occurrence or fate that happens to someone; here, the one shared event.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita counsels action without possessiveness toward its fruits, echoing Qoheleth’s
  refusal to treat labor’s outcomes as secure possession. Divergence: The Gita grounds disciplined action
  in dharma and devotion, while Qoheleth here offers no comparable assurance that work participates in
  a stable cosmic duty.

  **Dhammapada 277:** Its declaration that conditioned things are impermanent parallels Qoheleth’s vision
  of achievement as hevel, unable to endure. Divergence: The Dhammapada directs insight into impermanence
  toward liberation from suffering; Qoheleth’s meditation remains within the unresolved pressure of shared
  mortality.

  **Marcus Aurelius, Meditations 2.11:** Marcus urges remembrance of death and the swift passing of reputation
  and human affairs, much as Qoheleth sees wise and foolish brought under one event. Divergence: Stoic
  reflection seeks inward moral freedom through assent to nature, whereas Qoheleth stresses the troubling
  insufficiency even of wisdom itself.'
practice: 'At day’s end, hold one object connected with your work—a tool, notebook, key, or device—and
  name one thing it enabled. Then breathe out slowly and say: “This is good, but I cannot keep it.” Write
  one wise next action for tomorrow, not as a guarantee of gain, but as a way of walking in the light.'
