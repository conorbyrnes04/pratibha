  qa_issues: 'Verse 15: ''to such excess'' adds an interpretive nuance not clearly present in ''אָז יוֹתֵר''
    which more straightforwardly means ''then more'' or ''then excessively/overmuch'' - the phrase is
    better rendered as ''why then was I so much wiser'' or ''why have I been wiser then, excessively''
    without the ''to such'
