sanskrit_devanagari: '(5:16) גַּ֥ם כָּל־יָמָ֖יו בַּחֹ֣שֶׁךְ יֹאכֵ֑ל וְכָעַ֥ס הַרְבֵּ֖ה וְחָלְי֥וֹ וָקָֽצֶף׃

  (5:17) הִנֵּ֞ה אֲשֶׁר־רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר־יָפֶ֣ה לֶֽאֶכוֹל־וְ֠לִשְׁתּוֹת וְלִרְא֨וֹת טוֹבָ֜ה
  בְּכָל־עֲמָל֣וֹ ׀ שֶׁיַּעֲמֹ֣ל תַּֽחַת־הַשֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי־חיו אֲשֶׁר־נָֽתַן־ל֥וֹ הָאֱלֹהִ֖ים
  כִּי־ה֥וּא חֶלְקֽוֹ׃

  (5:18) גַּ֣ם כָּֽל־הָאָדָ֡ם אֲשֶׁ֣ר נָֽתַן־ל֣וֹ הָאֱלֹהִים֩ עֹ֨שֶׁר וּנְכָסִ֜ים וְהִשְׁלִיט֨וֹ לֶאֱכֹ֤ל
  מִמֶּ֨נּוּ֙ וְלָשֵׂ֣את אֶת־חֶלְק֔וֹ וְלִשְׂמֹ֖חַ בַּעֲמָל֑וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא׃

  (5:19) כִּ֚י לֹ֣א הַרְבֵּ֔ה יִזְכֹּ֖ר אֶת־יְמֵ֣י חַיָּ֑יו כִּ֧י הָאֱלֹהִ֛ים מַעֲנֶ֖ה בְּשִׂמְחַ֥ת לִבּֽוֹ׃'
translation_literal: '(5:16) All his days, too, he eats in darkness, with much vexation, sickness, and
  anger.


  (5:17) Look: this is what I have seen to be good and fitting—for one to eat and drink, and to find goodness
  in all the labor at which one toils beneath the sun, throughout the numbered days of life that God has
  given him; for this is his portion.


  (5:18) Moreover, whenever God gives a person wealth and possessions, and grants him power to eat from
  them, to receive his portion, and to rejoice in his labor—this is God’s gift.


  (5:19) For he will not dwell much on the days of his life, because God keeps him occupied with the joy
  of his heart.'
commentary: 'The passage turns from the bleak image of a person eating “in darkness” amid vexation, illness,
  and anger to a deliberately modest vision of the good. Qoheleth does not promise that labor will yield
  permanence or that riches will secure a life. Instead, he names the fitting human response: to eat,
  drink, and “see good” amid one’s ʿamal—one’s strenuous labor—during the limited number of days allotted
  by God.


  The recurring word חֵלֶק (ḥeleq), “portion,” is crucial. A portion is neither total possession nor ultimate
  control; it is the share one receives. Even wealth and goods are not enough by themselves: God must
  also grant the power to enjoy them. Thus joy is not presented as an achievement purchased by abundance,
  but as a gift that enables a person to inhabit ordinary life gratefully. The final line does not erase
  mortality; rather, the heart’s joy keeps a person from being consumed by the passing tally of days.


  Key Terms


  **חֵלֶק (ḥeleq)** — portion, allotted share

  **עָמָל (ʿamal)** — toil, laborious effort

  **מַתַּת אֱלֹהִים (mattat ʾElohim)** — a gift from God

  **שִׂמְחַת לֵב (simḥat lev)** — joy of heart


  Cross-Tradition Resonances


  **Sirach 14:11–16:** Ben Sira likewise urges a person to enjoy what is good and to give oneself one’s
  due share before death removes the opportunity. Divergence: Sirach frames enjoyment more directly as
  generosity toward oneself and others, while Qoheleth emphasizes God-given capacity to enjoy one’s portion.

  **Epicurus, Letter to Menoeceus 127–130:** Epicurus commends simple satisfactions and freedom from anxious
  craving rather than endless accumulation. Divergence: Epicurus grounds tranquility in prudent philosophical
  judgment, whereas Qoheleth calls enjoyment a gift dependent upon God.

  **Luke 12:15–21:** Jesus’ parable of the rich fool similarly denies that an abundance of possessions
  can guarantee life or security. Divergence: Luke presses toward being rich toward God and warns against
  hoarding, while Qoheleth here affirms the faithful enjoyment of wealth when its use is granted by God.'
practice: At one meal this week, set aside screens and hurry. Name the food, the labor that brought it
  to you, and one limited “portion” of life you can receive with thanks rather than try to control.
