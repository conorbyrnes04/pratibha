sanskrit_devanagari: '(10:16) אִֽי־לָ֣ךְ אֶ֔רֶץ שֶׁמַּלְכֵּ֖ךְ נָ֑עַר וְשָׂרַ֖יִךְ בַּבֹּ֥קֶר יֹאכֵֽלוּ׃

  (10:17) אַשְׁרֵ֣יךְ אֶ֔רֶץ שֶׁמַּלְכֵּ֖ךְ בֶּן־חוֹרִ֑ים וְשָׂרַ֨יִךְ֙ בָּעֵ֣ת יֹאכֵ֔לוּ בִּגְבוּרָ֖ה
  וְלֹ֥א בַשְּׁתִֽי׃

  (10:18) בַּעֲצַלְתַּ֖יִם יִמַּ֣ךְ הַמְּקָרֶ֑ה וּבְשִׁפְל֥וּת יָדַ֖יִם יִדְלֹ֥ף הַבָּֽיִת׃

  (10:19) לִשְׂחוֹק֙ עֹשִׂ֣ים לֶ֔חֶם וְיַ֖יִן יְשַׂמַּ֣ח חַיִּ֑ים וְהַכֶּ֖סֶף יַעֲנֶ֥ה אֶת־הַכֹּֽל׃

  (10:20) גַּ֣ם בְּמַדָּֽעֲךָ֗ מֶ֚לֶךְ אַל־תְּקַלֵּ֔ל וּבְחַדְרֵי֙ מִשְׁכָּ֣בְךָ֔ אַל־תְּקַלֵּ֖ל עָשִׁ֑יר
  כִּ֣י ע֤וֹף הַשָּׁמַ֨יִם֙ יוֹלִ֣יךְ אֶת־הַקּ֔וֹל וּבַ֥עַל הכנפים יַגֵּ֥יד דָּבָֽר׃'
translation_literal: 'Woe to you, O land, when your king is a youth and your officials feast in the morning.


  Blessed are you, O land, when your king is a son of nobles and your officials eat at the proper time—for
  strength and not for drinking.


  Through laziness the rafters sag, and through idle hands the house leaks.


  For merriment they prepare a feast, and wine gladdens life, but money answers everything.


  Even in your mind do not curse a king, and in your bedroom chambers do not curse a rich person, for
  a bird of the sky will carry the voice, and the winged creature will tell the matter.'
commentary: 'Qoheleth moves from the governance of a land to the upkeep of a house, treating both as structures
  vulnerable to mistimed appetite and neglected labor. A ruler who is a נָעַר (na''ar), a youth lacking
  the needed maturity, and officials who feast at morning signal a public order given over to appetite.
  By contrast, the officials of the fortunate land eat בָּעֵת (ba''et), “at the proper time”: food is
  not condemned, but it must serve גְּבוּרָה (gevurah), strength, rather than drunken dissipation.


  The leaking house makes the political observation bodily and ordinary. Neglect is not dramatic at first:
  beams sink, drops fall, and the damage accumulates. Verse 19 then speaks with Qoheleth’s characteristically
  cool realism: bread, wine, and money have their practical powers, even if none can master the larger
  instability of life. The final warning turns inward. A private curse may not remain private; speech
  travels by means beyond one’s control. Wisdom here is not silence born merely of fear, but alertness
  to the material and social consequences of careless words.


  Key Terms


  **נָעַר (na''ar)** — a youth; here, an immature or inexperienced ruler

  **בָּעֵת (ba''et)** — at the fitting time, in due season

  **עַצְלָה (atslah)** — slothfulness, negligence

  **גְּבוּרָה (gevurah)** — strength, vigor, capacity for effective action


  Cross-Tradition Resonances


  **Confucius, Analects 13.3:** Confucius links sound governance with the proper ordering of names, duties,
  and conduct; Qoheleth likewise sees civic health in disciplined leadership and timely action. Divergence:
  Confucius stresses moral-political rectification, while Qoheleth offers compressed observations about
  the fragility of social order rather than a program of reform.

  **Bhagavad Gita 3.8:** The Gita urges one to perform necessary action, since even bodily life cannot
  continue without work; Qoheleth’s leaking house similarly portrays the cost of neglected labor. Divergence:
  The Gita frames action as sacred duty performed without attachment, whereas Qoheleth emphasizes the
  plain material consequences of idleness.

  **Luke 12:3:** Luke warns that what is spoken in private will be made known; Ecclesiastes imagines a
  bird of the heavens carrying a concealed utterance abroad. Divergence: Luke’s saying concerns ultimate
  disclosure before God, while Qoheleth’s counsel is worldly prudence amid political and social vulnerability.'
practice: Inspect one small neglected part of your dwelling today—a loose hinge, cluttered surface, dripping
  tap, or unpaid task—and repair or tend it for fifteen minutes. As you work, notice one complaint you
  have been rehearsing privately; write it down, then reshape it into a careful, responsible action or
  conversation.
