sanskrit_devanagari: '(2:1) אָמַ֤רְתִּֽי אֲנִי֙ בְּלִבִּ֔י לְכָה־נָּ֛א אֲנַסְּכָ֛ה בְשִׂמְחָ֖ה וּרְאֵ֣ה
  בְט֑וֹב וְהִנֵּ֥ה גַם־ה֖וּא הָֽבֶל׃

  (2:2) לִשְׂח֖וֹק אָמַ֣רְתִּי מְהוֹלָ֑ל וּלְשִׂמְחָ֖ה מַה־זֹּ֥ה עֹשָֽׂה׃

  (2:3) תַּ֣רְתִּי בְלִבִּ֔י לִמְשׁ֥וֹךְ בַּיַּ֖יִן אֶת־בְּשָׂרִ֑י וְלִבִּ֞י נֹהֵ֤ג בַּֽחָכְמָה֙ וְלֶאֱחֹ֣ז
  בְּסִכְל֔וּת עַ֣ד אֲשֶׁר־אֶרְאֶ֗ה אֵי־זֶ֨ה ט֜וֹב לִבְנֵ֤י הָאָדָם֙ אֲשֶׁ֤ר יַעֲשׂוּ֙ תַּ֣חַת הַשָּׁמַ֔יִם
  מִסְפַּ֖ר יְמֵ֥י חַיֵּיהֶֽם׃

  (2:4) הִגְדַּ֖לְתִּי מַעֲשָׂ֑י בָּנִ֤יתִי לִי֙ בָּתִּ֔ים נָטַ֥עְתִּי לִ֖י כְּרָמִֽים׃

  (2:5) עָשִׂ֣יתִי לִ֔י גַּנּ֖וֹת וּפַרְדֵּסִ֑ים וְנָטַ֥עְתִּי בָהֶ֖ם עֵ֥ץ כָּל־פֶּֽרִי׃'
translation_literal: 'I said in my heart, “Come now, I will test you with joy; look upon what is good.”
  But see: this too was vapor.


  Of laughter I said, “It is madness”; and of joy, “What does this accomplish?”


  I explored in my heart how to refresh my body with wine, while my heart still led me with wisdom, and
  how to take hold of folly, until I might see what good human beings can do beneath the heavens through
  the numbered days of their lives.


  I made my works great: I built houses for myself; I planted vineyards for myself.


  I made for myself gardens and parks, and planted in them every kind of fruit tree.'
commentary: 'Qoheleth begins with an inward experiment: “I said in my heart” (אָמַרְתִּי אֲנִי בְּלִבִּי).
  Joy is not dismissed before it is tried; it is tested. Yet the verdict comes swiftly: even pleasure
  is הֶבֶל (hevel), a vapor—real enough to be felt, but impossible to grasp or preserve. Laughter becomes
  “madness,” not necessarily because it is evil, but because it cannot finally answer the question, “What
  does this accomplish?”


  The experiment grows more deliberate in verse 3. The speaker explores wine and folly while insisting
  that wisdom still guides his heart. He seeks not mere excess, but knowledge of what is good for mortals
  during their few, numbered days. The houses, vineyards, gardens, and fruit trees are splendid answers
  to mortality: human beings build, plant, and cultivate. Yet their abundance also prepares the reader
  for Qoheleth’s unsettling question: can even beautiful, fruitful labor overcome the passing nature of
  the one who enjoys it?


  Key Terms


  **הֶבֶל (hevel)** — Vapor, breath, or fleeting futility; something elusive and unsustainable.

  **שִׂמְחָה (simḥah)** — Joy, gladness, or festivity—the pleasure Qoheleth sets out to test.

  **חָכְמָה (ḥokhmah)** — Wisdom; discerning guidance that remains present even in the experiment with
  pleasure.

  **פַּרְדֵּסִים (pardesim)** — Parks or enclosed orchards, places of cultivated abundance.


  Cross-Tradition Resonances


  **Epic of Gilgamesh, Tablet X (Siduri’s counsel):** Siduri directs the mortal Gilgamesh toward ordinary
  enjoyments—food, clothing, bathing, and family—as fitting goods within a finite life. Divergence: Siduri
  offers daily enjoyment as a practical answer to mortality, while Qoheleth tests enjoyment and finds
  it unable to yield a lasting verdict of meaning.

  **Bhagavad Gita 2:47:** The Gita distinguishes faithful action from attachment to its fruits, echoing
  Qoheleth’s concern that human achievement cannot secure ultimate possession. Divergence: The Gita grounds
  detached action in dharma and devotion, whereas this passage remains within Qoheleth’s searching, unresolved
  inquiry into what is good.

  **Luke 12:16–21, the parable of the rich fool:** Both passages picture amassed productivity and abundance—stored
  goods in Luke, houses and orchards in Qoheleth—set against the brevity of human life. Divergence: Luke
  explicitly judges the wealthy man before God, while Qoheleth here records an experiment without yet
  issuing that theological condemnation.'
practice: 'Tend one living thing today: water a plant, prune a branch, or prepare and eat a piece of fruit
  slowly. As you do, ask aloud: “What good can I receive today without trying to make it last forever?”'
