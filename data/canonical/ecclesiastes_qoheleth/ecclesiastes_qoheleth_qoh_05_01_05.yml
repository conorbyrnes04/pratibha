sanskrit_devanagari: '(5:1) אַל־תְּבַהֵ֨ל עַל־פִּ֜יךָ וְלִבְּךָ֧ אַל־יְמַהֵ֛ר לְהוֹצִ֥יא דָבָ֖ר לִפְנֵ֣י
  הָאֱלֹהִ֑ים כִּ֣י הָאֱלֹהִ֤ים בַּשָּׁמַ֨יִם֙ וְאַתָּ֣ה עַל־הָאָ֔רֶץ עַֽל־כֵּ֛ן יִהְי֥וּ דְבָרֶ֖יךָ מְעַטִּֽים׃

  (5:2) כִּ֛י בָּ֥א הַחֲל֖וֹם בְּרֹ֣ב עִנְיָ֑ן וְק֥וֹל כְּסִ֖יל בְּרֹ֥ב דְּבָרִֽים׃

  (5:3) כַּאֲשֶׁר֩ תִּדֹּ֨ר נֶ֜דֶר לֵֽאלֹהִ֗ים אַל־תְּאַחֵר֙ לְשַׁלְּמ֔וֹ כִּ֛י אֵ֥ין חֵ֖פֶץ בַּכְּסִילִ֑ים
  אֵ֥ת אֲשֶׁר־תִּדֹּ֖ר שַׁלֵּֽם׃

  (5:4) ט֖וֹב אֲשֶׁ֣ר לֹֽא־תִדֹּ֑ר מִשֶׁתִּדּ֖וֹר וְלֹ֥א תְשַׁלֵּֽם׃

  (5:5) אַל־תִּתֵּ֤ן אֶת־פִּ֨יךָ֙ לַחֲטִ֣יא אֶת־בְּשָׂרֶ֔ךָ וְאַל־תֹּאמַר֙ לִפְנֵ֣י הַמַּלְאָ֔ךְ כִּ֥י
  שְׁגָגָ֖ה הִ֑יא לָ֣מָּה יִקְצֹ֤ף הָֽאֱלֹהִים֙ עַל־קוֹלֶ֔ךָ וְחִבֵּ֖ל אֶת־מַעֲשֵׂ֥ה יָדֶֽיךָ׃'
translation_literal: '(5:1) Do not let your mouth be hasty, nor let your heart rush to bring forth a word
  before God. For God is in the heavens, while you are upon the earth; therefore let your words be few.


  (5:2) For a dream comes through much preoccupation, and the voice of a fool through many words.


  (5:3) When you vow a vow to God, do not delay in fulfilling it, for he takes no pleasure in fools. What
  you vow, fulfill.


  (5:4) Better that you should not vow than that you should vow and not fulfill it.


  (5:5) Do not give your mouth leave to bring guilt upon your flesh; and do not say before the messenger,
  “It was an error.” Why should God be angered by your voice and ruin the work of your hands?'
commentary: 'Qoheleth begins with the mouth and the heart: neither outward speech nor inward intention
  should race ahead in God’s presence. The contrast is spatial and moral—God is “in the heavens” and the
  human speaker is “upon the earth.” This is not a denial of nearness, but a summons to creaturely proportion.
  Few words are not necessarily empty words; they are words chastened by attention.


  The saying about dreams links them to רֹב עִנְיָן (rov ʿinyan), an abundance of preoccupation or busyness;
  likewise, the fool’s voice arises from an abundance of words. Vows expose the practical consequence
  of speech. A נֶדֶר (neder) is not casual religious language but a binding promise, and delay turns verbal
  devotion into folly. Qoheleth refuses the easy retreat—“It was an error”—because speech has material
  consequence: it can endanger one’s “flesh” and the work of one’s hands. Reverence here is enacted not
  by grand declarations, but by measured speech and completed commitments.


  Key Terms


  **אַל־תְּבַהֵל (ʾal-tevahel)** — Do not be hasty; do not rush impulsively.

  **דְּבָרֶיךָ מְעַטִּים (devarekha meʿattim)** — Your words should be few.

  **נֶדֶר (neder)** — A vow, a solemn promise made to God.

  **שַׁלֵּם (shallem)** — Fulfill; make whole by carrying out what was vowed.


  Cross-Tradition Resonances


  **Matthew 6:7–8:** Jesus cautions against piling up words in prayer, echoing Qoheleth’s counsel that
  speech before God should not be excessive. Divergence: Matthew emphasizes trust in a Father who knows
  needs beforehand, whereas Qoheleth stresses the heaven-and-earth asymmetry and the danger of rash speech.

  **Pirkei Avot 1:17:** Rabban Shimon ben Gamliel’s praise of silence finds a close parallel in Qoheleth’s
  preference for few words over the fool’s verbal abundance. Divergence: Pirkei Avot presents silence
  chiefly as wisdom’s safeguard, while Qoheleth situates restraint particularly before God and in the
  making of vows.

  **Bhagavad Gita 17.15:** The Gita names speech that is truthful, beneficial, and non-agitating as a
  discipline, akin to Qoheleth’s demand for responsible utterance. Divergence: The Gita frames restrained
  speech within ascetic discipline and devotion, while Qoheleth concentrates on vows and their concrete
  obligation.'
practice: Before making any promise today, pause for three breaths and state it in one plain sentence.
  Write it down only if you are genuinely prepared to fulfill it; otherwise, let the promise remain unspoken.
