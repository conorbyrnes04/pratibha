sanskrit_devanagari: '(11:1) שַׁלַּ֥ח לַחְמְךָ֖ עַל־פְּנֵ֣י הַמָּ֑יִם כִּֽי־בְרֹ֥ב הַיָּמִ֖ים תִּמְצָאֶֽנּוּ׃

  (11:2) תֶּן־חֵ֥לֶק לְשִׁבְעָ֖ה וְגַ֣ם לִשְׁמוֹנָ֑ה כִּ֚י לֹ֣א תֵדַ֔ע מַה־יִּהְיֶ֥ה רָעָ֖ה עַל־הָאָֽרֶץ׃

  (11:3) אִם־יִמָּלְא֨וּ הֶעָבִ֥ים גֶּ֨שֶׁם֙ עַל־הָאָ֣רֶץ יָרִ֔יקוּ וְאִם־יִפּ֥וֹל עֵ֛ץ בַּדָּר֖וֹם וְאִ֣ם
  בַּצָּפ֑וֹן מְק֛וֹם שֶׁיִּפּ֥וֹל הָעֵ֖ץ שָׁ֥ם יְהֽוּא׃

  (11:4) שֹׁמֵ֥ר ר֖וּחַ לֹ֣א יִזְרָ֑ע וְרֹאֶ֥ה בֶעָבִ֖ים לֹ֥א יִקְצֽוֹר׃

  (11:5) כַּאֲשֶׁ֨ר אֵֽינְךָ֤ יוֹדֵ֨עַ֙ מַה־דֶּ֣רֶךְ הָר֔וּחַ כַּעֲצָמִ֖ים בְּבֶ֣טֶן הַמְּלֵאָ֑ה כָּ֗כָה
  לֹ֤א תֵדַע֙ אֶת־מַעֲשֵׂ֣ה הָֽאֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת־הַכֹּֽל׃'
translation_literal: '(11:1) Send out your bread upon the face of the waters, for after many days you
  will find it.


  (11:2) Give a share to seven, and even to eight, for you do not know what calamity may come upon the
  earth.


  (11:3) If the clouds are filled with rain, they pour it out upon the earth; and if a tree falls to the
  south or to the north, in the place where the tree falls, there it will remain.


  (11:4) Whoever watches the wind will not sow, and whoever keeps looking at the clouds will not reap.


  (11:5) Just as you do not know the course of the wind, or how the bones are formed in the womb of the
  pregnant woman, so you do not know the work of God, who makes all things.'
commentary: 'Qoheleth counsels open-handed action in a world that cannot be secured. To “send” one’s bread
  over the waters is to release sustenance beyond immediate possession or visible return. The instruction
  to give a חֵלֶק (ḥēleq, share) to “seven, and even eight” presses generosity beyond a carefully calculated
  minimum: disaster may come, and no one knows where need—or future help—will arise.


  The passage does not promise mastery over uncertainty. Rain falls when clouds have filled, and a fallen
  tree remains where it has landed; some realities simply arrive and cannot be revised. Yet this is not
  an excuse for paralysis. The one who endlessly observes the רוּחַ (rúaḥ, wind) never sows. Human beings
  do not grasp the wind’s way, the hidden growth of bones in a womb, or the full מַעֲשֵׂה (maʿăśeh, work)
  of God. Therefore wisdom here is neither prediction nor passivity, but faithful work and generous release
  amid mystery.


  Key Terms


  **שַׁלַּח (shallaḥ)** — send forth; release or dispatch

  **חֵלֶק (ḥēleq)** — portion, share, allotted part

  **רוּחַ (rúaḥ)** — wind; also breath or spirit

  **מַעֲשֵׂה (maʿăśeh)** — work, deed, or making


  Cross-Tradition Resonances


  **Bhagavad Gita 2:47:** The Gita urges committed action without possession of the results, much as Qoheleth
  urges sowing rather than waiting for perfectly favorable conditions. Divergence: The Gita grounds this
  counsel in disciplined duty and detachment, while Qoheleth emphasizes human ignorance before God’s inscrutable
  making.

  **Luke 6:38:** Jesus’ saying, “Give, and it will be given to you,” echoes the passage’s confidence that
  bread released may in time be found again. Divergence: Luke frames return within a moral measure of
  divine reciprocity, whereas Qoheleth’s image remains more indirect and set within practical uncertainty.

  **Tao Te Ching 8:** Its praise of water’s lowly, life-giving movement resonates with bread cast upon
  waters and with action that does not cling to control. Divergence: The Tao Te Ching commends alignment
  with the Dao, while Qoheleth explicitly names the unknowable work of God.'
practice: Prepare a small portion of food, money, or time to give away this week without seeking acknowledgment.
  Before giving it, stand outdoors for one minute and notice the wind; name one task you have delayed
  while waiting for certainty, then take its first practical step today.
