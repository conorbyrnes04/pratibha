sanskrit_devanagari: '(1:1) דִּבְרֵי֙ קֹהֶ֣לֶת בֶּן־דָּוִ֔ד מֶ֖לֶךְ בִּירוּשָׁלִָֽם׃

  (1:2) הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַכֹּ֥ל הָֽבֶל׃

  (1:3) מַה־יִּתְר֖וֹן לָֽאָדָ֑ם בְּכָל־עֲמָל֔וֹ שֶֽׁיַּעֲמֹ֖ל תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (1:4) דּ֤וֹר הֹלֵךְ֙ וְד֣וֹר בָּ֔א וְהָאָ֖רֶץ לְעוֹלָ֥ם עֹמָֽדֶת׃

  (1:5) וְזָרַ֥ח הַשֶּׁ֖מֶשׁ וּבָ֣א הַשָּׁ֑מֶשׁ וְאֶ֨ל־מְקוֹמ֔וֹ שׁוֹאֵ֛ף זוֹרֵ֥חַֽ ה֖וּא שָֽׁם׃'
translation_literal: 'The words of Qoheleth, son of David, king in Jerusalem.


  “Vapor of vapors,” says Qoheleth; “vapor of vapors—everything is vapor.”


  What lasting surplus does anyone gain from all the labor at which one toils beneath the sun?


  A generation goes, and a generation comes, while the earth stands enduringly.


  The sun rises, and the sun sets; then it hastens toward its place, and there it rises again.'
commentary: 'Qoheleth opens not with an argument but with a cry: הֲבֵל הֲבָלִים (hevel havalim), “vapor
  of vapors.” Hevel is not simply a statement that all things are evil or worthless. It evokes breath,
  mist, and a vanishing exhalation: what is real enough to be seen, yet cannot be held. The doubled form
  intensifies the claim. Everything human beings treat as solid, final, or possessable is exposed as passing.


  The question of verse 3 focuses this insight: what יִתְרוֹן (yitron), what remaining advantage or surplus,
  comes from all one’s עָמָל (ʿamal), weary labor, “beneath the sun”? The following images do not deny
  the beauty of the world; they show its ceaseless indifference to human striving. Generations pass while
  the earth remains, and the sun itself runs its ancient course. Its motion is described as restless,
  even breathless, yet it arrives again at its rising-place. Against this great recurrence, Qoheleth asks
  readers to reckon honestly with the kind of gain they seek.


  Key Terms


  **הֶבֶל (hevel)** — vapor, breath, or mist; what is fleeting and impossible to grasp securely.

  **יִתְרוֹן (yitron)** — surplus, profit, or enduring advantage left over from effort.

  **עָמָל (ʿamal)** — toil or labor, often carrying the sense of burdensome exertion.

  **תַּחַת הַשָּׁמֶשׁ (taḥat ha-shemesh)** — “under the sun,” the sphere of ordinary mortal life and observation.


  Cross-Tradition Resonances


  **Psalm 90:3–6:** Psalm 90 likewise contrasts human generations, which pass like sleep or grass, with
  a reality that outlasts them. Divergence: The psalm turns explicitly toward God as humanity’s enduring
  dwelling, whereas Qoheleth here remains with the troubling question of earthly gain.

  **Marcus Aurelius, Meditations 2.17:** Marcus reflects on the rapid disappearance of persons, events,
  and even memory, echoing Qoheleth’s sober attention to passing generations. Divergence: Stoic reflection
  seeks freedom through rational consent to cosmic order; Qoheleth’s voice is more searching and less
  programmatic.

  **Bhagavad Gita 2.27:** The Gita’s assertion that death follows birth and birth follows death parallels
  Qoheleth’s vision of recurring human succession. Divergence: The Gita places this cycle within teachings
  about the enduring self and duty, while this passage emphasizes the elusive yield of toil under the
  sun.'
practice: At sunrise or sunset, stand outdoors for five quiet minutes. Notice the sun’s movement, take
  several slow breaths, and name one labor you cannot finally control; then choose one small act of care
  you can faithfully do today without demanding permanent results.
