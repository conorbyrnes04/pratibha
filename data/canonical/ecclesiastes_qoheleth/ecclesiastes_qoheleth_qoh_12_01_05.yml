sanskrit_devanagari: '(12:1) וּזְכֹר֙ אֶת־בּ֣וֹרְאֶ֔יךָ בִּימֵ֖י בְּחוּרֹתֶ֑יךָ עַ֣ד אֲשֶׁ֤ר לֹא־יָבֹ֨אוּ֙
  יְמֵ֣י הָֽרָעָ֔ה וְהִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין־לִ֥י בָהֶ֖ם חֵֽפֶץ׃

  (12:2) עַ֠ד אֲשֶׁ֨ר לֹֽא־תֶחְשַׁ֤ךְ הַשֶּׁ֨מֶשׁ֙ וְהָא֔וֹר וְהַיָּרֵ֖חַ וְהַכּוֹכָבִ֑ים וְשָׁ֥בוּ הֶעָבִ֖ים
  אַחַ֥ר הַגָּֽשֶׁם׃

  (12:3) בַּיּ֗וֹם שֶׁיָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַבַּ֔יִת וְהִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶחָ֑יִל וּבָטְל֤וּ הַטֹּֽחֲנוֹת֙
  כִּ֣י מִעֵ֔טוּ וְחָשְׁכ֥וּ הָרֹא֖וֹת בָּאֲרֻבּֽוֹת׃

  (12:4) וְסֻגְּר֤וּ דְלָתַ֨יִם֙ בַּשּׁ֔וּק בִּשְׁפַ֖ל ק֣וֹל הַֽטַּחֲנָ֑ה וְיָקוּם֙ לְק֣וֹל הַצִּפּ֔וֹר
  וְיִשַּׁ֖חוּ כָּל־בְּנ֥וֹת הַשִּֽׁיר׃

  (12:5) גַּ֣ם מִגָּבֹ֤הַּ יִרָ֨אוּ֙ וְחַתְחַתִּ֣ים בַּדֶּ֔רֶךְ וְיָנֵ֤אץ הַשָּׁקֵד֙ וְיִסְתַּבֵּ֣ל הֶֽחָגָ֔ב
  וְתָפֵ֖ר הָֽאֲבִיּוֹנָ֑ה כִּֽי־הֹלֵ֤ךְ הָאָדָם֙ אֶל־בֵּ֣ית עוֹלָמ֔וֹ וְסָבְב֥וּ בָשּׁ֖וּק הַסֹּפְדִֽים׃'
translation_literal: Remember your Creator in the days of your youth, before the harsh days come and the
  years arrive when you say, “I find no pleasure in them”; before the sun and the light grow dark, with
  the moon and the stars, and clouds return after the rain. On the day when the guards of the house tremble,
  and the strong men bend; when the grinders cease because they are few, and those who look through the
  windows grow dim; when the doors to the street are shut, as the sound of grinding sinks low; when one
  rises at a bird’s call, and all the daughters of song are brought low. One also fears heights, and terrors
  lie in the road; the almond tree is despised, the grasshopper drags itself along, and the caper berry
  fails—for the human being goes to the house of eternity, while mourners make their rounds in the street.
commentary: 'The summons begins not with an abstract meditation but with an imperative: וּזְכֹר (uzekhor),
  “remember.” To remember one’s Creator is more than to retain an idea; it is to live attentively and
  faithfully while strength, pleasure, and opportunity remain. The passage does not sentimentalize youth.
  It names youth as the season before days arrive in which delight itself becomes difficult to find.


  Its images of decline are layered and deliberately elusive: a darkened sky, a house whose guards shake,
  grinders that become few, windows that dim, doors that close, and song that sinks. Whether each figure
  maps precisely onto a bodily faculty matters less than the accumulating sense of a whole life becoming
  vulnerable. Even the recurring clouds after rain suggest that relief does not end the storm. The final
  movement is unblinking: האדם (ha’adam), the human being, goes to “the house of eternity,” while public
  mourning continues outside. Yet the urgency of the poem is not despair; it is a call to remember before
  mortality makes postponement impossible.


  Key Terms


  **בּוֹרְאֶיךָ (boreʾekha)** — your Creator

  **בְּחוּרֹתֶיךָ (beḥurotekha)** — your youthfulness; your youthful days

  **חֵפֶץ (ḥefets)** — pleasure, delight, desire

  **בֵּית עוֹלָמוֹ (beit ʿolamo)** — his house of eternity; the enduring abode


  Cross-Tradition Resonances


  **Psalm 90:12:** “Teach us to number our days” likewise turns human brevity into a summons for wise-hearted
  living. Divergence: The psalm asks God for wisdom amid brief life, whereas Qoheleth paints aging through
  a sustained, enigmatic sequence of bodily and domestic images.

  **Sirach 18:19–20:** Ben Sira urges preparation before acting and self-examination before sickness,
  echoing the call not to delay serious attention to life before decline. Divergence: Sirach frames preparedness
  primarily in terms of commandment and judgment, while Qoheleth here centers remembrance of the Creator
  amid the fading powers of age.

  **Marcus Aurelius, Meditations 2.17:** Marcus urges immediate right action because life is uncertain
  and may end at any moment. Divergence: Stoic counsel appeals to reason, nature, and duty; Qoheleth addresses
  the hearer personally before the Creator and culminates in mourning and the eternal house.'
practice: At dawn, take a slow ten-minute walk without headphones. Notice one capacity you usually overlook—balance,
  hearing, sight, breath, memory—and speak a brief gratitude for it; then do one unpostponed act of care,
  reconciliation, or generosity.
