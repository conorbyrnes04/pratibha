sanskrit_devanagari: '(10:11) אִם־יִשֹּׁ֥ךְ הַנָּחָ֖שׁ בְּלוֹא־לָ֑חַשׁ וְאֵ֣ין יִתְר֔וֹן לְבַ֖עַל הַלָּשֽׁוֹן׃

  (10:12) דִּבְרֵ֥י פִי־חָכָ֖ם חֵ֑ן וְשִׂפְת֥וֹת כְּסִ֖יל תְּבַלְּעֶֽנּוּ׃

  (10:13) תְּחִלַּ֥ת דִּבְרֵי־פִ֖יהוּ סִכְל֑וּת וְאַחֲרִ֣ית פִּ֔יהוּ הוֹלֵל֖וּת רָעָֽה׃

  (10:14) וְהַסָּכָ֖ל יַרְבֶּ֣ה דְבָרִ֑ים לֹא־יֵדַ֤ע הָאָדָם֙ מַה־שֶׁיִּֽהְיֶ֔ה וַאֲשֶׁ֤ר יִֽהְיֶה֙ מֵֽאַחֲרָ֔יו
  מִ֖י יַגִּ֥יד לֽוֹ׃

  (10:15) עֲמַ֥ל הַכְּסִילִ֖ים תְּיַגְּעֶ֑נּוּ אֲשֶׁ֥ר לֹֽא־יָדַ֖ע לָלֶ֥כֶת אֶל־עִֽיר׃'
translation_literal: 'If a snake bites before it has been charmed, there is no gain for the master of
  the tongue.


  The words from a wise man’s mouth are gracious, but a fool’s lips consume him. The beginning of his
  mouth’s words is folly, and the end of his speech is wicked madness. Yet the fool multiplies words:
  no one knows what will come to pass, and who can tell him what will be after him?


  The toil of fools wears them out—those who do not know how to go to a city.'
commentary: 'The opening image is deliberately sharp: a snake that bites בְּלוֹא־לָחַשׁ (belo laḥash),
  before the charmer’s incantation or skill can be brought to bear, leaves the “master of the tongue”
  with no benefit. Speech, the passage suggests, has its moment; expertise uttered too late cannot undo
  damage already done. The saying also prepares for the irony that follows: one who claims mastery of
  words may still be overtaken by what has already escaped control.


  The wise person’s words possess חֵן (ḥen), grace, favor, or fittingness; they do not merely convey information
  but create a humane space around the speaker. The fool, by contrast, is devoured by his own lips. His
  speech begins in סִכְלוּת (sikhlut), folly, and ripens into destructive delirium. His many words presume
  knowledge of an unknowable future, while his עֲמָל (ʿamal), laboring toil, leaves him worn out by even
  the most basic task: finding his way to the city. Qoheleth’s portrait is not simply of intellectual
  deficiency, but of speech detached from limits, reality, and competent action.


  Key Terms


  **לַחַשׁ (laḥash)** — A whispered charm or incantation; here, the act meant to restrain a snake.

  **חֵן (ḥen)** — Grace, favor, or pleasant fittingness in the wise person’s speech.

  **כְּסִיל (kesil)** — A fool: one marked by stubborn, undisciplined judgment rather than mere lack of
  learning.

  **עֲמָל (ʿamal)** — Toil or wearying labor, often carrying the sense of burdensome exertion.


  Cross-Tradition Resonances


  **Proverbs 10:19:** “When words are many, transgression is not absent” closely parallels Qoheleth’s
  fool who multiplies words beyond his knowledge. Divergence: Proverbs offers a direct moral maxim, while
  Qoheleth frames excessive speech within human ignorance about the future.

  **James 3:5–8:** James likewise depicts the tongue as small yet dangerously powerful, capable of setting
  great harm in motion. Divergence: James emphasizes the tongue’s moral and communal corruption; Qoheleth
  stresses the speaker’s self-consuming folly and practical futility.

  **Dhammapada 63:** The Dhammapada observes that a fool who recognizes his foolishness has some wisdom,
  while one who thinks himself wise is truly foolish—akin to Qoheleth’s talkative pretension. Divergence:
  The Buddhist saying turns toward awakening through self-recognition, whereas Qoheleth dwells on the
  observable consequences of foolish speech and labor.'
practice: 'Before speaking in one consequential conversation today, pause for three breaths and ask: “What
  do I know, what do I not know, and what few words would carry grace?” Then speak only those words.'
