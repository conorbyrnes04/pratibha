sanskrit_devanagari: '(9:1) כִּ֣י אֶת־כָּל־זֶ֞ה נָתַ֤תִּי אֶל־לִבִּי֙ וְלָב֣וּר אֶת־כָּל־זֶ֔ה אֲשֶׁ֨ר
  הַצַּדִּיקִ֧ים וְהַחֲכָמִ֛ים וַעֲבָדֵיהֶ֖ם בְּיַ֣ד הָאֱלֹהִ֑ים גַּֽם־אַהֲבָ֣ה גַם־שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙
  הָֽאָדָ֔ם הַכֹּ֖ל לִפְנֵיהֶֽם׃

  (9:2) הַכֹּ֞ל כַּאֲשֶׁ֣ר לַכֹּ֗ל מִקְרֶ֨ה אֶחָ֜ד לַצַּדִּ֤יק וְלָרָשָׁע֙ לַטּוֹב֙ וְלַטָּה֣וֹר וְלַטָּמֵ֔א
  וְלַזֹּבֵ֔חַ וְלַאֲשֶׁ֖ר אֵינֶ֣נּוּ זֹבֵ֑חַ כַּטּוֹב֙ כַּֽחֹטֶ֔א הַנִּשְׁבָּ֕ע כַּאֲשֶׁ֖ר שְׁבוּעָ֥ה
  יָרֵֽא׃

  (9:3) זֶ֣ה ׀ רָ֗ע בְּכֹ֤ל אֲשֶֽׁר־נַעֲשָׂה֙ תַּ֣חַת הַשֶּׁ֔מֶשׁ כִּֽי־מִקְרֶ֥ה אֶחָ֖ד לַכֹּ֑ל וְגַ֣ם
  לֵ֣ב בְּֽנֵי־הָ֠אָדָם מָלֵא־רָ֨ע וְהוֹלֵל֤וֹת בִּלְבָבָם֙ בְּחַיֵּיהֶ֔ם וְאַחֲרָ֖יו אֶל־הַמֵּתִֽים׃

  (9:4) כִּי־מִי֙ אֲשֶׁ֣ר יבחר אֶ֥ל כָּל־הַחַיִּ֖ים יֵ֣שׁ בִּטָּח֑וֹן כִּֽי־לְכֶ֤לֶב חַי֙ ה֣וּא ט֔וֹב
  מִן־הָאַרְיֵ֖ה הַמֵּֽת׃

  (9:5) כִּ֧י הַֽחַיִּ֛ים יוֹדְעִ֖ים שֶׁיָּמֻ֑תוּ וְהַמֵּתִ֞ים אֵינָ֧ם יוֹדְעִ֣ים מְא֗וּמָה וְאֵֽין־ע֤וֹד
  לָהֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽם׃'
translation_literal: 'For I have taken all this to heart and examined all this: that the righteous and
  the wise and their works are in the hand of God. Whether it be love or hatred, no one knows; all lies
  before them.


  Everything is the same for everyone: the same fate befalls the righteous and the wicked, the good and
  the clean and the unclean, the one who sacrifices and the one who does not sacrifice. As it is with
  the good, so with the sinner; as with the one who takes an oath, so with the one who fears to take an
  oath.


  This is the evil in all that happens under the sun: that the same fate comes to all. Moreover, the hearts
  of people are full of evil, and madness is in their hearts while they live, and afterward they join
  the dead.


  For whoever is among the living has hope, for even a living dog is better than a dead lion.


  For the living know that they will die, but the dead know nothing; they have no more reward, for the
  memory of them is forgotten.'
commentary: 'Qoheleth begins with disciplined reflection: he has placed the matter “upon [his] heart”
  in order to examine it. His conclusion is not that God has abandoned the righteous and wise; on the
  contrary, they and their deeds remain “in the hand of God.” Yet that hand cannot be read off from visible
  outcomes. אַהֲבָה (ahavah, “love”) and שִׂנְאָה (sin’ah, “hatred”) are not reliably disclosed by one’s
  circumstances. The same מִקְרֶה (miqreh), a happening or lot, meets the devout and the irreverent alike.


  This shared mortality is called רָע (raʿ), an evil or grievous fact beneath the sun, especially because
  human hearts are already marked by wrongdoing and הוֹלֵלוֹת (holelot), wild folly. Still, the passage
  turns sharply at verse 4: attachment to “all the living” means there remains בִּטָּחוֹן (bittaḥon),
  a ground for confidence. The comparison of a living dog with a dead lion is deliberately undignified:
  present life, however lowly, possesses awareness. The living know they will die—and that bitter knowledge
  itself marks the remaining possibility of response, action, and attention.


  Key Terms


  **מִקְרֶה (miqreh)** — A happening, occurrence, or allotted fate; here, the same mortal event that reaches
  everyone.

  **הוֹלֵלוֹת (holelot)** — Madness, recklessness, or deranged folly lodged in human hearts.

  **בִּטָּחוֹן (bittaḥon)** — Confidence or security, belonging to one who remains among the living.

  **זִכְרָם (zikhram)** — Their remembrance; the memory of the dead that has faded away.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.27:** The Gita likewise states that death is certain for the born, making mortality
  an inescapable human condition. Divergence: The Gita frames death within rebirth and the enduring self,
  whereas Qoheleth here emphasizes the dead’s lack of knowledge and reward.

  **Marcus Aurelius, Meditations 2.11:** Marcus urges reflection on death as a common destiny, a truth
  that should clarify one’s present conduct. Divergence: Stoic thought finds a rational cosmic order accessible
  through virtue; Qoheleth stresses that visible outcomes do not reveal God’s favor or disfavor.

  **Qur’an 3:185:** The Qur’an declares that every soul will taste death, echoing Qoheleth’s insistence
  that no moral or ritual category escapes mortality. Divergence: The Qur’an explicitly directs the reader
  toward final recompense, while this passage dwells on the apparent end of recompense and remembrance
  within earthly experience.'
practice: For ten minutes, sit with an ordinary living thing—a plant, animal, or your own breathing body.
  Name silently three facts of life present now, then do one small unfinished act of care today while
  you still have the knowledge and capacity of the living.
