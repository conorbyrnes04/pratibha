sanskrit_devanagari: '(12:6) עַ֣ד אֲשֶׁ֤ר לֹֽא־ירחק חֶ֣בֶל הַכֶּ֔סֶף וְתָרֻ֖ץ גֻּלַּ֣ת הַזָּהָ֑ב וְתִשָּׁ֤בֶר
  כַּד֙ עַל־הַמַּבּ֔וּעַ וְנָרֹ֥ץ הַגַּלְגַּ֖ל אֶל־הַבּֽוֹר׃

  (12:7) וְיָשֹׁ֧ב הֶעָפָ֛ר עַל־הָאָ֖רֶץ כְּשֶׁהָיָ֑ה וְהָר֣וּחַ תָּשׁ֔וּב אֶל־הָאֱלֹהִ֖ים אֲשֶׁ֥ר נְתָנָֽהּ׃

  (12:8) הֲבֵ֧ל הֲבָלִ֛ים אָמַ֥ר הַקּוֹהֶ֖לֶת הַכֹּ֥ל הָֽבֶל׃

  (12:9) וְיֹתֵ֕ר שֶׁהָיָ֥ה קֹהֶ֖לֶת חָכָ֑ם ע֗וֹד לִמַּד־דַּ֨עַת֙ אֶת־הָעָ֔ם וְאִזֵּ֣ן וְחִקֵּ֔ר תִּקֵּ֖ן
  מְשָׁלִ֥ים הַרְבֵּֽה׃

  (12:10) בִּקֵּ֣שׁ קֹהֶ֔לֶת לִמְצֹ֖א דִּבְרֵי־חֵ֑פֶץ וְכָת֥וּב יֹ֖שֶׁר דִּבְרֵ֥י אֱמֶֽת׃'
translation_literal: 'Before the silver cord is drawn away, and the golden bowl is crushed; before the
  pitcher is shattered at the spring, and the wheel is broken at the cistern. Then the dust returns to
  the earth as it was, and the breath returns to God who gave it. “Hevel of hevels,” says Qoheleth; “all
  is hevel.”


  Moreover, because Qoheleth was wise, he continued to teach the people knowledge. He weighed and searched
  out, arranging many sayings. Qoheleth sought to find words of delight, and what was written uprightly—words
  of truth.'
commentary: 'The images gather around life’s necessary instruments: a cord, a bowl, a pitcher, a wheel,
  a spring. Each serves to hold, draw, or convey what sustains life; each is vulnerable to breaking. The
  passage does not treat death as an abstraction but as the collapse of familiar material means. Dust,
  עָפָר (ʿafar), goes back to earth, while the רוח (ruaḥ), the breath or spirit bestowed by God, returns
  to its giver.


  Qoheleth’s cry, הֶבֶל (hevel), does not simply call creation worthless. It names its vapor-like elusiveness:
  what cannot be secured, retained, or mastered. Yet the epilogue presents wisdom as a careful labor.
  Qoheleth teaches, weighs, investigates, and orders sayings, seeking both “words of delight” and “words
  of truth.” In the face of mortality, truthful speech remains a fitting and demanding human work.


  Key Terms


  **הֶבֶל (hevel)** — Vapor, breath, evanescence; that which slips beyond lasting grasp.

  **רוּחַ (ruaḥ)** — Breath, wind, or spirit; here, what returns to God.

  **עָפָר (ʿafar)** — Dust or loose earth, the material to which the body returns.

  **אֱמֶת (ʾemet)** — Truth, reliability, or faithfulness.


  Cross-Tradition Resonances


  **Genesis 3:19:** Both texts speak of human beings returning to dust, locating mortality within creaturely
  earthliness. Divergence: Genesis frames this return within the judgment pronounced after disobedience,
  while Qoheleth meditates on mortality without recounting that primal offense.

  **Bhagavad Gita 2.22:** The Gita likewise distinguishes the perishing body from a continuing principle
  of life. Divergence: The Gita teaches the soul’s passage into another body, whereas Qoheleth says the
  breath returns to God and does not describe rebirth.

  **Dhammapada 277:** Its declaration that conditioned things are impermanent parallels Qoheleth’s perception
  of instability and passingness. Divergence: The Dhammapada directs this insight toward liberation through
  Buddhist practice, while Qoheleth joins mortality to God as giver and receiver of breath.'
practice: Fill a small bowl with water and hold it quietly for one minute. Notice its weight and its vulnerability
  to spilling; then pour it onto soil or into a basin, naming one possession, role, or certainty you cannot
  finally keep. End by taking three slow breaths in gratitude for the breath presently given.
