sanskrit_devanagari: '(3:16) וְע֥וֹד רָאִ֖יתִי תַּ֣חַת הַשָּׁ֑מֶשׁ מְק֤וֹם הַמִּשְׁפָּט֙ שָׁ֣מָּה הָרֶ֔שַׁע
  וּמְק֥וֹם הַצֶּ֖דֶק שָׁ֥מָּה הָרָֽשַׁע׃

  (3:17) אָמַ֤רְתִּֽי אֲנִי֙ בְּלִבִּ֔י אֶת־הַצַּדִּיק֙ וְאֶת־הָ֣רָשָׁ֔ע יִשְׁפֹּ֖ט הָאֱלֹהִ֑ים כִּי־עֵ֣ת
  לְכָל־חֵ֔פֶץ וְעַ֥ל כָּל־הַֽמַּעֲשֶׂ֖ה שָֽׁם׃

  (3:18) אָמַ֤רְתִּֽי אֲנִי֙ בְּלִבִּ֔י עַל־דִּבְרַת֙ בְּנֵ֣י הָאָדָ֔ם לְבָרָ֖ם הָאֱלֹהִ֑ים וְלִרְא֕וֹת
  שְׁהֶם־בְּהֵמָ֥ה הֵ֖מָּה לָהֶֽם׃

  (3:19) כִּי֩ מִקְרֶ֨ה בְֽנֵי־הָאָדָ֜ם וּמִקְרֶ֣ה הַבְּהֵמָ֗ה וּמִקְרֶ֤ה אֶחָד֙ לָהֶ֔ם כְּמ֥וֹת זֶה֙
  כֵּ֣ן מ֣וֹת זֶ֔ה וְר֥וּחַ אֶחָ֖ד לַכֹּ֑ל וּמוֹתַ֨ר הָאָדָ֤ם מִן־הַבְּהֵמָה֙ אָ֔יִן כִּ֥י הַכֹּ֖ל הָֽבֶל׃

  (3:20) הַכֹּ֥ל הוֹלֵ֖ךְ אֶל־מָק֣וֹם אֶחָ֑ד הַכֹּל֙ הָיָ֣ה מִן־הֶֽעָפָ֔ר וְהַכֹּ֖ל שָׁ֥ב אֶל־הֶעָפָֽר׃'
translation_literal: 'Moreover, I saw beneath the sun: in the place of judgment, there was wickedness;
  and in the place of righteousness, there was wickedness.


  I said in my heart, “God will judge the righteous and the wicked, for there is a time there for every
  purpose and for every deed.”


  I said in my heart concerning the children of humankind: God tests them, to let them see that, as far
  as they are concerned, they are beasts.


  For the fate of human beings and the fate of beasts is one fate for them: as this one dies, so that
  one dies; one breath belongs to all. Humanity has no advantage over the beast, for all is hevel.


  All go to one place. All came from the dust, and all return to the dust.'
commentary: 'Qoheleth begins with an institutional wound: wickedness occupies both “the place of judgment”
  and “the place of righteousness.” The places meant to restrain evil have become its dwelling. Yet his
  response is not confidence in visible moral order; it is a guarded inward assertion that God will judge
  both righteous and wicked, in a fitting time for every חֵפֶץ (ḥefets), purpose or matter, and every
  deed.


  The thought then turns sharply toward mortality. God’s testing exposes human beings as בְּהֵמָה (behemah),
  creatures like beasts in their shared death. The “one breath” and the common return to עָפָר (ʿafar),
  dust, undo human pretension. This is not simply contempt for embodied life: it is a severe leveling.
  The claim that all is הֶבֶל (hevel)—vapor, breath, what slips from one’s grasp—makes injustice and human
  grandeur alike answerable to the frailty of dust.


  Key Terms


  **מִשְׁפָּט (mishpat)** — judgment, justice, or the judicial order.

  **רֶשַׁע (reshaʿ)** — wickedness; wrongdoing that is found even where justice should reside.

  **הֶבֶל (hevel)** — vapor, breath, transience; that which proves elusive and unsubstantial.

  **עָפָר (ʿafar)** — dust, the common material origin and destination of all creatures.


  Cross-Tradition Resonances


  **Genesis 3:19:** “Dust you are, and to dust you shall return” closely parallels Qoheleth’s vision of
  a common return to dust. Divergence: Genesis frames the return as part of the consequence of disobedience,
  while Qoheleth stresses mortality as the shared lot of humans and animals.

  **Psalm 82:1–4:** The psalm summons God into the divine assembly to judge unjust rulers and defend the
  vulnerable, echoing Qoheleth’s concern that justice has been corrupted. Divergence: Psalm 82 presses
  urgently toward public vindication, whereas Qoheleth lingers in the unresolved sight of wickedness within
  courts.

  **Buddhist Dhammapada 277:** Its teaching that conditioned things are impermanent resonates with Qoheleth’s
  hevel and his insistence on death’s leveling power. Divergence: The Dhammapada directs impermanence
  toward liberation from attachment, while Qoheleth joins transience to divine judgment and the language
  of God.'
practice: Visit a patch of bare ground or hold a small pinch of soil for three quiet minutes. Name one
  injustice you have witnessed, then name one status or achievement you cling to. Return the soil to the
  ground and choose one specific act this week that serves justice without seeking advantage.
