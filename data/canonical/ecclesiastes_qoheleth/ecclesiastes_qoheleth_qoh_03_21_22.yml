sanskrit_devanagari: '(3:21) מִ֣י יוֹדֵ֗עַ ר֚וּחַ בְּנֵ֣י הָאָדָ֔ם הָעֹלָ֥ה הִ֖יא לְמָ֑עְלָה וְר֨וּחַ֙
  הַבְּהֵמָ֔ה הַיֹּרֶ֥דֶת הִ֖יא לְמַ֥טָּה לָאָֽרֶץ׃

  (3:22) וְרָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵאֲשֶׁ֨ר יִשְׂמַ֤ח הָאָדָם֙ בְּֽמַעֲשָׂ֔יו כִּי־ה֖וּא חֶלְק֑וֹ
  כִּ֣י מִ֤י יְבִיאֶ֨נּוּ֙ לִרְא֔וֹת בְּמֶ֖ה שֶׁיִּהְיֶ֥ה אַחֲרָֽיו׃'
translation_literal: Who knows whether the breath of humankind rises upward, while the breath of the beast
  goes down into the earth? So I saw that there is nothing better than for a person to take joy in their
  work, for that is their portion. For who can bring them back to see what will be after them?
commentary: 'Qoheleth answers the question of life beyond death not with a doctrine but with a question:
  מִי יוֹדֵעַ (mi yodeaʿ), “who knows?” The human רוּחַ (ruaḥ), breath or spirit, may rise; the animal’s
  may descend to the earth. Yet the phrasing withholds certainty. The speaker does not simply erase human
  distinction, but refuses to build a settled confidence on what cannot be seen.


  This uncertainty turns the gaze toward the immediate gift of life. There is “nothing better” than rejoicing
  in one’s מעשים (maʿasim), one’s deeds or work, because this is one’s חֵלֶק (ḥeleq), allotted portion.
  This is not a command to possess everything or solve the future. It is an invitation to receive the
  work, delight, and responsibility presently given, since no one can return from the afterward to make
  it available for inspection.


  Key Terms


  **רוּחַ (ruaḥ)** — breath, wind, or spirit; the life-force whose destiny Qoheleth leaves uncertain

  **בְּהֵמָה (behemah)** — beast or animal; the creature set beside humanity in the question of mortality

  **מַעֲשִׂים (maʿasim)** — deeds, actions, or work; the sphere in which a person may find joy

  **חֵלֶק (ḥeleq)** — portion or allotted share; the present gift assigned to a person


  Cross-Tradition Resonances


  **Genesis 2:7:** Genesis portrays the human as animated by God’s breathed life, paralleling Qoheleth’s
  concern with the breath or spirit of living creatures. Divergence: Genesis narrates humanity’s origin
  with assurance, while Qoheleth declines certainty about the breath’s destination after death.

  **Bhagavad Gita 2.20:** The Gita likewise addresses death by distinguishing the perishable body from
  a continuing principle of life. Divergence: The Gita confidently declares the self unborn and undying;
  Qoheleth asks, “Who knows?” and does not offer such certainty.

  **Marcus Aurelius, Meditations 2.14:** Marcus counsels attention to the brief present life and to the
  work fitting for one’s place, akin to Qoheleth’s joy in one’s portion. Divergence: Stoic reflection
  seeks composure through rational acceptance of nature, whereas Qoheleth grounds present joy in the divinely
  bounded limits of human knowledge.'
practice: At the end of one ordinary task today, stop for three breaths. Name the work you have done,
  receive it as your present portion, and refrain for one minute from rehearsing outcomes you cannot yet
  see.
