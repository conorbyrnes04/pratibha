sanskrit_devanagari: '(8:11) אֲשֶׁר֙ אֵין־נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָרָעָ֖ה מְהֵרָ֑ה עַל־כֵּ֡ן מָלֵ֞א
  לֵ֧ב בְּֽנֵי־הָאָדָ֛ם בָּהֶ֖ם לַעֲשׂ֥וֹת רָֽע׃

  (8:12) אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּמַאֲרִ֣יךְ ל֑וֹ כִּ֚י גַּם־יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה־טּוֹב֙
  לְיִרְאֵ֣י הָאֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִלְּפָנָֽיו׃

  (8:13) וְטוֹב֙ לֹֽא־יִהְיֶ֣ה לָֽרָשָׁ֔ע וְלֹֽא־יַאֲרִ֥יךְ יָמִ֖ים כַּצֵּ֑ל אֲשֶׁ֛ר אֵינֶ֥נּוּ יָרֵ֖א
  מִלִּפְנֵ֥י אֱלֹהִֽים׃

  (8:14) יֶשׁ־הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל־הָאָרֶץ֒ אֲשֶׁ֣ר ׀ יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵהֶם֙
  כְּמַעֲשֵׂ֣ה הָרְשָׁעִ֔ים וְיֵ֣שׁ רְשָׁעִ֔ים שֶׁמַּגִּ֥יעַ אֲלֵהֶ֖ם כְּמַעֲשֵׂ֣ה הַצַּדִּיקִ֑ים אָמַ֕רְתִּי
  שֶׁגַּם־זֶ֖ה הָֽבֶל׃

  (8:15) וְשִׁבַּ֤חְתִּֽי אֲנִי֙ אֶת־הַשִּׂמְחָ֔ה אֲשֶׁ֨ר אֵֽין־ט֤וֹב לָֽאָדָם֙ תַּ֣חַת הַשֶּׁ֔מֶשׁ כִּ֛י
  אִם־לֶאֱכ֥וֹל וְלִשְׁתּ֖וֹת וְלִשְׂמ֑וֹחַ וְה֞וּא יִלְוֶ֣נּוּ בַעֲמָל֗וֹ יְמֵ֥י חַיָּ֛יו אֲשֶׁר־נָֽתַן־ל֥וֹ
  הָאֱלֹהִ֖ים תַּ֥חַת הַשָּֽׁמֶשׁ׃'
translation_literal: 'Because the decree against an evil deed is not carried out swiftly, the human heart
  is fully set within them to do evil. Though a sinner does evil a hundred times and prolongs his days,
  yet I know that it will go well with those who fear God, who stand in fear before him. But it will not
  go well with the wicked, nor will he lengthen his days like a shadow, because he does not fear before
  God.


  There is a vaporous absurdity that occurs upon the earth: there are righteous people who receive what
  accords with the deeds of the wicked, and there are wicked people who receive what accords with the
  deeds of the righteous. I said, This too is vapor.


  So I praised joy: for there is nothing better for a human being under the sun than to eat and drink
  and rejoice. This will stay beside him in his labor through the days of his life which God has given
  him under the sun.'
commentary: 'The passage begins with a sober social observation: when the פִתְגָם (pitgam), the judicial
  sentence or decree, does not come swiftly, wrongdoing gains courage. Delay is not morally neutral; it
  can make the human heart “full” of purpose to do evil. Yet Qoheleth places this observation beside a
  conviction he still possesses: reverence for God is ultimately good, while the wicked person’s apparent
  extension of life is as insubstantial as a shadow.


  But this conviction does not erase what Qoheleth sees. In 8:14, righteous and wicked alike receive outcomes
  that appear fitted to the other’s deeds. This is הֶבֶל (hevel): not merely emptiness, but the baffling,
  vapor-like incongruity of life’s moral weather. Qoheleth does not solve that contradiction with a scheme
  of easy recompense. Instead, he commends joy—eating, drinking, and rejoicing—as a companion in one’s
  עָמָל (ʿamal), one’s toilsome labor. Such joy is neither denial nor escape; it is a finite gift received
  honestly beneath the sun.


  Key Terms


  **פִתְגָם (pitgam)** — A decree, verdict, or official pronouncement; here, the sentence against evil.

  **יָרֵא (yareʾ)** — To fear or revere; a posture of awe and accountability before God.

  **הֶבֶל (hevel)** — Vapor, breath, or transience; Qoheleth’s name for life’s elusive and unjust incongruities.

  **עָמָל (ʿamal)** — Labor marked by exertion and weariness; the work that fills mortal days.


  Cross-Tradition Resonances


  **Psalm 73:2–17:** The psalmist is troubled by the ease of the wicked, much as Qoheleth observes that
  unjust people may prosper and endure. Divergence: Psalm 73 finds decisive clarity in God’s sanctuary
  and the wicked’s final downfall, whereas Qoheleth leaves the earthly reversal openly unresolved.

  **Matthew 5:45:** Jesus describes sun and rain falling upon both evil and good people, recognizing a
  world in which visible conditions do not neatly mirror moral worth. Divergence: Matthew frames this
  shared exposure as a summons to imitate divine generosity; Qoheleth frames it as hevel and turns toward
  grateful enjoyment.

  **Bhagavad Gita 2.47:** The Gita counsels committed action without possessiveness toward outcomes, a
  discipline fitting a world where results evade human moral calculation. Divergence: The Gita grounds
  this in detachment from the fruits of action and liberation, while Qoheleth commends embodied joy in
  God-given daily life.'
practice: Prepare a simple meal, set the table without screens, and eat slowly. Before the first bite,
  name one injustice you cannot resolve and one ordinary gift you can receive today; then share the meal
  with gratitude, refusing both numbness and false certainty.
