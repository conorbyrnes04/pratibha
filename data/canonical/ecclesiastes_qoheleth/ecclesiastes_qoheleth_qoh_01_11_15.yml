sanskrit_devanagari: '(1:11) אֵ֥ין זִכְר֖וֹן לָרִאשֹׁנִ֑ים וְגַ֨ם לָאַחֲרֹנִ֜ים שֶׁיִּהְי֗וּ לֹֽא־יִהְיֶ֤ה
  לָהֶם֙ זִכָּר֔וֹן עִ֥ם שֶׁיִּהְי֖וּ לָאַחֲרֹנָֽה׃ פ

  (1:12) אֲנִ֣י קֹהֶ֗לֶת הָיִ֥יתִי מֶ֛לֶךְ עַל־יִשְׂרָאֵ֖ל בִּירוּשָׁלִָֽם׃

  (1:13) וְנָתַ֣תִּי אֶת־לִבִּ֗י לִדְר֤וֹשׁ וְלָתוּר֙ בַּֽחָכְמָ֔ה עַ֛ל כָּל־אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת
  הַשָּׁמָ֑יִם ה֣וּא ׀ עִנְיַ֣ן רָ֗ע נָתַ֧ן אֱלֹהִ֛ים לִבְנֵ֥י הָאָדָ֖ם לַעֲנ֥וֹת בּֽוֹ׃

  (1:14) רָאִ֨יתִי֙ אֶת־כָּל־הַֽמַּעֲשִׂ֔ים שֶֽׁנַּעֲשׂ֖וּ תַּ֣חַת הַשָּׁ֑מֶשׁ וְהִנֵּ֥ה הַכֹּ֛ל הֶ֖בֶל
  וּרְע֥וּת רֽוּחַ׃

  (1:15) מְעֻוָּ֖ת לֹא־יוּכַ֣ל לִתְקֹ֑ן וְחֶסְר֖וֹן לֹא־יוּכַ֥ל לְהִמָּנֽוֹת׃'
translation_literal: 'There is no remembrance of those who came before; nor will there be remembrance
  of those who come after, among those who will come still later.


  I, Qoheleth, was king over Israel in Jerusalem. I set my heart to seek out and explore by wisdom all
  that is done beneath the heavens. It is a grievous occupation that God has given to the children of
  humankind to be occupied with.


  I have seen all the deeds done beneath the sun, and look: all is vapor, a pursuit of wind. What is twisted
  cannot be straightened; what is lacking cannot be counted.'
commentary: 'The passage moves from forgotten generations to the speaker’s own royal inquiry. Even a king
  in Jerusalem, furnished with authority and leisure for investigation, cannot secure lasting remembrance.
  Qoheleth gives his heart to both “seek” and “explore,” verbs suggesting sustained, searching attention
  rather than casual pessimism. Yet the task proves an עִנְיַן רָע (ʿinyan raʿ), a harsh or grievous business
  laid upon humanity.


  His verdict, הֶבֶל (hevel), names not simply worthlessness but breath, mist, something real yet ungraspable
  and quickly gone. The phrase רְעוּת רוּחַ (reʿut ruaḥ) intensifies this: human striving is like herding—or
  pursuing—the wind. Verse 15 refuses easy repair. Some distortion remains beyond correction, and some
  absence cannot be totaled up into a manageable account. Qoheleth’s wisdom begins in clear sight: it
  sees the world’s fractures without pretending that insight itself can mend them.


  Key Terms


  **זִכָּרוֹן (zikkaron)** — remembrance; the public memory that fails to preserve generations.

  **עִנְיַן רָע (ʿinyan raʿ)** — a grievous occupation or troubling task.

  **הֶבֶל (hevel)** — vapor, breath, transience; what cannot be held fast.

  **רְעוּת רוּחַ (reʿut ruaḥ)** — pursuit or herding of wind; futile striving after what cannot be mastered.


  Cross-Tradition Resonances


  **Psalm 90:9–12:** Psalm 90 likewise measures human life as swiftly passing and asks for wisdom through
  numbering one’s days. Divergence: The psalm turns mortality into a prayer for divine instruction, while
  Qoheleth emphasizes the unresolved burden of human inquiry.

  **Bhagavad Gita 2.16:** The Gita distinguishes the enduring real from what lacks lasting being, paralleling
  Qoheleth’s distrust of what appears substantial but passes away. Divergence: The Gita offers a stable,
  imperishable reality beneath change; Qoheleth here supplies no such metaphysical resolution.

  **Marcus Aurelius, Meditations 4.33:** Marcus reflects that both those remembered and those who remember
  soon vanish, echoing Qoheleth’s meditation on oblivion. Divergence: Stoic reflection commends inward
  consent to cosmic order, whereas Qoheleth calls the human task a grievous allotment from God.'
practice: Take a ten-minute walk without recording, photographing, or messaging. Notice three things that
  cannot be kept—a shifting shadow, a breeze, a passing sound—and then write one sentence naming a “crooked”
  matter you cannot presently straighten; leave it without proposing a solution.
