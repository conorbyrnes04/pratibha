sanskrit_devanagari: '(2:21) כִּי־יֵ֣שׁ אָדָ֗ם שֶׁעֲמָל֛וֹ בְּחָכְמָ֥ה וּבְדַ֖עַת וּבְכִשְׁר֑וֹן וּלְאָדָ֞ם
  שֶׁלֹּ֤א עָֽמַל־בּוֹ֙ יִתְּנֶ֣נּוּ חֶלְק֔וֹ גַּם־זֶ֥ה הֶ֖בֶל וְרָעָ֥ה רַבָּֽה׃

  (2:22) כִּ֠י מֶֽה־הֹוֶ֤ה לָֽאָדָם֙ בְּכָל־עֲמָל֔וֹ וּבְרַעְי֖וֹן לִבּ֑ו שֶׁה֥וּא עָמֵ֖ל תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (2:23) כִּ֧י כָל־יָמָ֣יו מַכְאֹבִ֗ים וָכַ֨עַס֙ עִנְיָנ֔וֹ גַּם־בַּלַּ֖יְלָה לֹא־שָׁכַ֣ב לִבּ֑וֹ גַּם־זֶ֖ה
  הֶ֥בֶל הֽוּא׃

  (2:24) אֵֽין־ט֤וֹב בָּאָדָם֙ שֶׁיֹּאכַ֣ל וְשָׁתָ֔ה וְהֶרְאָ֧ה אֶת־נַפְשׁ֛וֹ ט֖וֹב בַּעֲמָל֑וֹ גַּם־זֹה֙
  רָאִ֣יתִי אָ֔נִי כִּ֛י מִיַּ֥ד הָאֱלֹהִ֖ים הִֽיא׃

  (2:25) כִּ֣י מִ֥י יֹאכַ֛ל וּמִ֥י יָח֖וּשׁ ח֥וּץ מִמֶּֽנִּי׃'
translation_literal: 'For there is one whose labor is done with wisdom, with knowledge, and with skill;
  yet to someone who has not labored for it, he gives it as his portion. This too is vapor, and a great
  evil.


  For what does a person gain from all his toil and from the striving of his heart, with which he toils
  beneath the sun?


  For all his days are painful, and his occupation is vexation; even in the night his heart does not lie
  down. This too is vapor.


  There is nothing better for a person than to eat and drink and let himself see good in his labor. This
  also, I have seen, comes from the hand of God.


  For who can eat, and who can feel enjoyment, apart from Him?'
commentary: 'Qoheleth looks at accomplished work and sees its wound: a person may labor with חָכְמָה (ḥokhmah),
  knowledge, and skill, only to leave the resulting “portion” to one who did not earn it. The problem
  is not merely death or injustice in the abstract, but the severing of effort from possession. Such an
  outcome is called הֶבֶל (hevel), a breath or vapor—real enough to be felt, yet impossible to hold—and
  “a great evil.”


  The question in verse 22 presses the matter inward: what remains from outward toil and the “striving”
  of the heart? The worker’s days are pain, his business vexation, and even night offers no resting place
  for his heart. Yet Qoheleth does not conclude that life has no good. He turns toward the small, bodily
  goods of eating, drinking, and perceiving goodness amid one’s עָמָל (ʿamal, toil). These are not wages
  secured by mastery; they are received “from the hand of God.” The final question underscores the limit
  of self-sufficiency: enjoyment itself cannot finally be manufactured or possessed on one’s own terms.


  Key Terms


  **הֶבֶל (hevel)** — Vapor, breath, transience; what proves elusive and insubstantial.

  **עָמָל (ʿamal)** — Toil or labor, especially exhausting and burdensome work.

  **חֵלֶק (ḥeleq)** — Portion, share, or allotted inheritance.

  **רַעְיוֹן (raʿyon)** — Striving, preoccupation, or inward pursuit of the heart.


  Cross-Tradition Resonances


  **Sirach 14:11–14:** Ben Sira urges a person to enjoy what is good while life and opportunity remain,
  echoing Qoheleth’s welcome of eating, drinking, and receiving good from one’s labor. Divergence: Sirach
  frames enjoyment more directly as generous self-care under mortality, whereas Qoheleth emphasizes how
  enjoyment itself depends upon God’s gift amid the frustration of labor.

  **Bhagavad Gita 2:47:** The Gita counsels action without possessive attachment to its fruits, paralleling
  Qoheleth’s recognition that the fruit of labor may pass to another. Divergence: The Gita offers disciplined
  detachment as a spiritual path, while Qoheleth does not present a program of liberation but soberly
  commends grateful enjoyment within human limits.

  **Matthew 6:25–34:** Jesus’ teaching against anxious care speaks to Qoheleth’s sleepless heart and redirects
  attention from anxious striving toward trust in God’s provision. Divergence: Matthew grounds its exhortation
  in confidence about God’s fatherly care and coming kingdom; Qoheleth remains more unsettled, stressing
  the opacity and instability of life under the sun.'
practice: 'At the end of one workday, set aside ten minutes before eating: name one task you cannot control
  after it leaves your hands, then eat a simple meal slowly and speak aloud one sentence of thanks for
  the good presently given.'
