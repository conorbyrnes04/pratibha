sanskrit_devanagari: '(4:11) גַּ֛ם אִם־יִשְׁכְּב֥וּ שְׁנַ֖יִם וְחַ֣ם לָהֶ֑ם וּלְאֶחָ֖ד אֵ֥יךְ יֵחָֽם׃

  (4:12) וְאִֽם־יִתְקְפוֹ֙ הָאֶחָ֔ד הַשְּׁנַ֖יִם יַעַמְד֣וּ נֶגְדּ֑וֹ וְהַחוּט֙ הַֽמְשֻׁלָּ֔שׁ לֹ֥א בִמְהֵרָ֖ה
  יִנָּתֵֽק׃

  (4:13) ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְחָכָ֑ם מִמֶּ֤לֶךְ זָקֵן֙ וּכְסִ֔יל אֲשֶׁ֛ר לֹא־יָדַ֥ע לְהִזָּהֵ֖ר עֽוֹד׃

  (4:14) כִּֽי־מִבֵּ֥ית הָסוּרִ֖ים יָצָ֣א לִמְלֹ֑ךְ כִּ֛י גַּ֥ם בְּמַלְכוּת֖וֹ נוֹלַ֥ד רָֽשׁ׃

  (4:15) רָאִ֨יתִי֙ אֶת־כָּל־הַ֣חַיִּ֔ים הַֽמְהַלְּכִ֖ים תַּ֣חַת הַשָּׁ֑מֶשׁ עִ֚ם הַיֶּ֣לֶד הַשֵּׁנִ֔י
  אֲשֶׁ֥ר יַעֲמֹ֖ד תַּחְתָּֽיו׃'
translation_literal: '(11) Again, if two lie down together, they become warm; but how can one alone keep
  warm?

  (12) Though someone may overpower one person, two can stand against him; and a threefold cord is not
  quickly torn apart.

  (13) Better a poor but wise youth than an old and foolish king who no longer knows how to take warning.

  (14) For from a house of prisoners he may go forth to reign, though even in his kingship he was born
  poor.

  (15) I saw all the living who walk beneath the sun siding with the second youth, who would rise in his
  place.'
commentary: 'The saying begins with bodily need: warmth, defense, and the vulnerability of the solitary
  person. Two people lying together can share warmth; two can resist an assailant. The image of the three-stranded
  cord extends this logic: relationship is not merely pleasant but strengthening. The phrase לֹא בִמְהֵרָה
  (lo vimherah), “not quickly,” is measured rather than absolute; even a strong bond may break, yet it
  does not yield easily.


  The scene then turns from companionship to rule. A יֶלֶד מִסְכֵּן וְחָכָם (yeled misken ve-ḥakham),
  a poor wise youth, surpasses an aged king whose folly is his refusal to be warned. Status reverses:
  a prisoner may become king, while one born amid royalty may be poor. Yet the crowds who follow “the
  second youth” also hint at the restlessness of public allegiance. Wisdom may rise, but acclaim itself
  remains unstable beneath the sun.


  Key Terms


  **חוּט הַמְשֻׁלָּשׁ (ḥut ha-meshullash)** — “a threefold cord,” an image of reinforced, resilient connection.

  **מִסְכֵּן (misken)** — “poor” or “impoverished,” describing the youth without social advantage.

  **חָכָם (ḥakham)** — “wise,” denoting practical discernment rather than rank or age.

  **לְהִזָּהֵר (lehizzaher)** — “to take warning,” the capacity the old king has ceased to exercise.


  Cross-Tradition Resonances


  **Sirach 6:14:** “A faithful friend is a sturdy shelter”; both texts portray human companionship as
  a form of protection amid danger. Divergence: Sirach emphasizes the loyalty of a faithful friend, while
  Qoheleth stresses the practical strength created by shared presence.

  **Pirkei Avot 1:6:** “Acquire for yourself a companion”; this rabbinic maxim likewise treats companionship
  as necessary for a well-lived life. Divergence: Pirkei Avot particularly links companionship with study
  and moral accountability, whereas Qoheleth begins with warmth and defense.

  **Dhammapada 328:** The Dhammapada advises finding a wise companion for the journey, echoing Qoheleth’s
  preference for wisdom over isolated weakness and folly. Divergence: The Dhammapada counsels solitary
  progress when no worthy companion is found; Qoheleth here foregrounds the risks of being alone.'
practice: 'Choose one person this week and offer a concrete strand of support: share a meal, make a needed
  call, accompany them on an errand, or ask plainly, “Where could you use someone beside you?”'
