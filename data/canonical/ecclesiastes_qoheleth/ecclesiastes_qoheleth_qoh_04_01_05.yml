sanskrit_devanagari: '(4:1) וְשַׁ֣בְתִּֽי אֲנִ֗י וָאֶרְאֶה֙ אֶת־כָּל־הָ֣עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים
  תַּ֣חַת הַשָּׁ֑מֶשׁ וְהִנֵּ֣ה ׀ דִּמְעַ֣ת הָעֲשֻׁקִ֗ים וְאֵ֤ין לָהֶם֙ מְנַחֵ֔ם וּמִיַּ֤ד עֹֽשְׁקֵיהֶם֙
  כֹּ֔חַ וְאֵ֥ין לָהֶ֖ם מְנַחֵֽם׃

  (4:2) וְשַׁבֵּ֧חַ אֲנִ֛י אֶת־הַמֵּתִ֖ים שֶׁכְּבָ֣ר מֵ֑תוּ מִן־הַ֣חַיִּ֔ים אֲשֶׁ֛ר הֵ֥מָּה חַיִּ֖ים עֲדֶֽנָה׃

  (4:3) וְטוֹב֙ מִשְּׁנֵיהֶ֔ם אֵ֥ת אֲשֶׁר־עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא־רָאָה֙ אֶת־הַמַּעֲשֶׂ֣ה הָרָ֔ע
  אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַשָּֽׁמֶשׁ׃

  (4:4) וְרָאִ֨יתִֽי אֲנִ֜י אֶת־כָּל־עָמָ֗ל וְאֵת֙ כָּל־כִּשְׁר֣וֹן הַֽמַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת־אִ֖ישׁ
  מֵרֵעֵ֑הוּ גַּם־זֶ֥ה הֶ֖בֶל וּרְע֥וּת רֽוּחַ׃

  (4:5) הַכְּסִיל֙ חֹבֵ֣ק אֶת־יָדָ֔יו וְאֹכֵ֖ל אֶת־בְּשָׂרֽוֹ׃'
translation_literal: '(4:1) Again I turned and saw all the oppressions done beneath the sun: look—the
  tears of the oppressed, and no one to comfort them. Power was in the hand of their oppressors, and no
  one comforted them.


  (4:2) Then I declared the dead fortunate—those who have already died—more than the living who are still
  alive.


  (4:3) Yet better than either is one who has not yet existed, who has not seen the evil deed that is
  done beneath the sun.


  (4:4) And I saw that every labor and every skillful accomplishment in work springs from one person’s
  envy of another. This too is vapor, a chasing after wind.


  (4:5) The fool folds his hands and consumes his own flesh.'
commentary: 'Qoheleth turns again to look, and what he sees is not an abstract problem but tears: דִּמְעַת
  הָעֲשֻׁקִים, “the tears of the oppressed.” The line is made more grievous by its repetition: there is
  no מְנַחֵם (menaḥem), no comforter. The oppressors possess כֹּחַ (koaḥ), power; the afflicted possess
  tears. Faced with a world in which power is so unevenly held and suffering so unattended, the speaker’s
  comparisons of death and nonexistence are not a cool doctrine but the extremity of lament.


  The gaze then moves from public injustice to the economy of achievement. Even עָמָל (ʿamal), strenuous
  labor, and every accomplished work may be driven by קִנְאָה (qinʾah), competitive envy between neighbors.
  Such success is הֶבֶל (hevel): breathlike, insubstantial, unable to bear the weight placed upon it.
  Yet the answer is not inert refusal. The fool’s folded hands lead to self-consumption; the passage exposes
  both frantic rivalry and paralyzing withdrawal as ways a distorted world devours human life.


  Key Terms


  **הָעֲשֻׁקִים (ha-ʿashuqim)** — the oppressed, those subjected to exploitation or violence

  **מְנַחֵם (menaḥem)** — a comforter, one who offers consoling presence

  **עָמָל (ʿamal)** — toil, burdensome labor and the effort it entails

  **הֶבֶל (hevel)** — vapor or breath; what is fleeting, elusive, and unable to endure


  Cross-Tradition Resonances


  **Exodus 3:7:** God declares that he has seen Israel’s affliction and heard their cry under oppressors,
  answering the same spectacle of suffering Qoheleth observes. Divergence: Exodus immediately frames divine
  seeing as the beginning of deliverance, while Qoheleth’s scene remains marked by the absence of a comforter.

  **Job 3:11–19:** Job’s curse of the day of his birth likewise imagines nonexistence and death as rest
  from a grievous world. Divergence: Job’s lament rises from his own catastrophic loss, whereas Qoheleth’s
  bleak comparison follows his witness of systemic oppression.

  **James 3:16:** James links jealousy and self-seeking with disorder and every vile practice, paralleling
  Qoheleth’s suspicion that achievement is fueled by envy. Divergence: James contrasts such envy with
  wisdom from above, while Qoheleth here offers no transcendent remedy and instead warns against foolish
  passivity.'
practice: For ten minutes, sit with your hands open rather than folded. Name one instance of suffering
  near you that needs a “comforter,” then take one concrete, noncompetitive action today—send support,
  share resources, accompany someone, or advocate for them.
