sanskrit_devanagari: '(9:11) שַׁ֜בְתִּי וְרָאֹ֣ה תַֽחַת־הַשֶּׁ֗מֶשׁ כִּ֣י לֹא֩ לַקַּלִּ֨ים הַמֵּר֜וֹץ
  וְלֹ֧א לַגִּבּוֹרִ֣ים הַמִּלְחָמָ֗ה וְ֠גַם לֹ֣א לַחֲכָמִ֥ים לֶ֨חֶם֙ וְגַ֨ם לֹ֤א לַנְּבֹנִים֙ עֹ֔שֶׁר
  וְגַ֛ם לֹ֥א לַיֹּדְעִ֖ים חֵ֑ן כִּי־עֵ֥ת וָפֶ֖גַע יִקְרֶ֥ה אֶת־כֻּלָּֽם׃

  (9:12) כִּ֡י גַּם֩ לֹֽא־יֵדַ֨ע הָאָדָ֜ם אֶת־עִתּ֗וֹ כַּדָּגִים֙ שֶׁנֶּֽאֱחָזִים֙ בִּמְצוֹדָ֣ה רָעָ֔ה
  וְכַ֨צִּפֳּרִ֔ים הָאֲחֻז֖וֹת בַּפָּ֑ח כָּהֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽאָדָ֔ם לְעֵ֣ת רָעָ֔ה כְּשֶׁתִּפּ֥וֹל
  עֲלֵיהֶ֖ם פִּתְאֹֽם׃

  (9:13) גַּם־זֹ֛ה רָאִ֥יתִי חָכְמָ֖ה תַּ֣חַת הַשָּׁ֑מֶשׁ וּגְדוֹלָ֥ה הִ֖יא אֵלָֽי׃

  (9:14) עִ֣יר קְטַנָּ֔ה וַאֲנָשִׁ֥ים בָּ֖הּ מְעָ֑ט וּבָֽא־אֵלֶ֜יהָ מֶ֤לֶךְ גָּדוֹל֙ וְסָבַ֣ב אֹתָ֔הּ
  וּבָנָ֥ה עָלֶ֖יהָ מְצוֹדִ֥ים גְּדֹלִֽים׃

  (9:15) וּמָ֣צָא בָ֗הּ אִ֤ישׁ מִסְכֵּן֙ חָכָ֔ם וּמִלַּט־ה֥וּא אֶת־הָעִ֖יר בְּחָכְמָת֑וֹ וְאָדָם֙ לֹ֣א
  זָכַ֔ר אֶת־הָאִ֥ישׁ הַמִּסְכֵּ֖ן הַהּֽוּא׃'
translation_literal: '(9:11) Again I saw under the sun: the race does not belong to the swift, nor the
  battle to the strong; bread does not belong to the wise, wealth to the discerning, nor favor to those
  who know. For time and encounter overtake them all.


  (9:12) Indeed, a human being does not know his time. Like fish caught in a cruel net, and like birds
  seized in a trap, so are human beings ensnared at a harmful time, when it falls upon them suddenly.


  (9:13) This also I saw as wisdom under the sun, and it seemed great to me:


  (9:14) There was a small city, with few people in it. A great king came against it, surrounded it, and
  built mighty siegeworks against it.


  (9:15) But within it was found a poor wise man, and by his wisdom he delivered the city. Yet no one
  remembered that poor man.'
commentary: 'Qoheleth again looks “under the sun” and unsettles the easy confidence that ability guarantees
  reward. Speed, strength, wisdom, discernment, and knowledge are real goods, yet none can command the
  outcome. “Time and encounter” (עֵת וָפֶגַע, ʿet va-fegaʿ) come upon all: the appointed moment and the
  unforeseen occurrence. The fish net and bird trap make the point bodily. Disaster is not always the
  harvest of folly; often it descends suddenly, before its victims recognize their season.


  The small-city story then gives wisdom a genuine, if chastened, dignity. A poor man (אִישׁ מִסְכֵּן,
  ʾish misken) possesses wisdom sufficient to save a city from a great king''s siege. Wisdom can accomplish
  what force cannot. Yet the final line refuses a triumphant moral: the deliverer is forgotten. Qoheleth
  neither dismisses wisdom nor promises it public honor. It is powerful, necessary, and vulnerable to
  neglect—an answer to danger that may itself vanish from communal memory.


  Key Terms


  **עֵת וָפֶגַע (ʿet va-fegaʿ)** — “time and encounter”: an appointed moment joined with an unforeseen
  happening.

  **מְצוֹדָה (metsodah)** — A net or trap; here an image of sudden, inescapable peril.

  **חָכְמָה (ḥokhmah)** — Wisdom: practical, discerning capacity that can preserve a community.

  **מִסְכֵּן (misken)** — Poor or needy; the socially slighted man who proves wise.


  Cross-Tradition Resonances


  **Psalm 33:16–17:** The psalm likewise denies that a king is saved by a great army or a warrior by great
  strength. Divergence: Psalm 33 redirects confidence toward the LORD’s watchful care, whereas Qoheleth
  here emphasizes the unpredictability of time and occurrence without offering that resolution.

  **Luke 12:16–21:** Jesus’ parable of the rich fool similarly portrays a person unable to secure the
  future despite apparent resources and planning. Divergence: Luke frames the sudden demand of life explicitly
  as divine judgment upon greed; Qoheleth’s observation is broader and includes the capable, wise, and
  innocent alike.

  **Bhagavad Gita 2.47:** The Gita counsels action without claiming mastery over its fruits, paralleling
  Qoheleth’s refusal to equate skill with guaranteed results. Divergence: The Gita grounds this counsel
  in disciplined detachment and devotion within dharma, while Qoheleth lingers on contingency and the
  fragile public fate of wisdom.'
practice: Before beginning one necessary task today, name aloud what lies within your care—attention,
  preparation, courage—and what does not—outcome, timing, recognition. Then do the task carefully, and
  quietly acknowledge one unnoticed act of wisdom by another person.
