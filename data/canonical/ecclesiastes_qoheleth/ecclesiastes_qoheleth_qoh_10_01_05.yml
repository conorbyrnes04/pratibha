sanskrit_devanagari: '(10:1) זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵחָכְמָ֥ה
  מִכָּב֖וֹד סִכְל֥וּת מְעָֽט׃

  (10:2) לֵ֤ב חָכָם֙ לִֽימִינ֔וֹ וְלֵ֥ב כְּסִ֖יל לִשְׂמֹאלֽוֹ׃

  (10:3) וְגַם־בַּדֶּ֛רֶךְ כשהסכל הֹלֵ֖ךְ לִבּ֣וֹ חָסֵ֑ר וְאָמַ֥ר לַכֹּ֖ל סָכָ֥ל הֽוּא׃

  (10:4) אִם־ר֤וּחַ הַמּוֹשֵׁל֙ תַּעֲלֶ֣ה עָלֶ֔יךָ מְקוֹמְךָ֖ אַל־תַּנַּ֑ח כִּ֣י מַרְפֵּ֔א יַנִּ֖יחַ חֲטָאִ֥ים
  גְּדוֹלִֽים׃

  (10:5) יֵ֣שׁ רָעָ֔ה רָאִ֖יתִי תַּ֣חַת הַשָּׁ֑מֶשׁ כִּשְׁגָגָ֕ה שֶׁיֹּצָ֖א מִלִּפְנֵ֥י הַשַּׁלִּֽיט׃'
translation_literal: 'Dead flies make the perfumer’s oil stink and bubble over; so a little folly outweighs
  wisdom and honor.


  The heart of the wise leans to the right, but the heart of the fool to the left.


  Even when the fool walks along the road, his understanding fails him, and he shows everyone that he
  is a fool.


  If the ruler’s anger rises against you, do not abandon your place; for calmness leaves great offenses
  at rest.


  There is an evil I have seen beneath the sun, like an error issuing from the ruler’s presence:'
commentary: 'The opening image is deliberately unpleasant: זְבוּבֵי מָוֶת (zevuvē mavet), “flies of death,”
  spoil precious perfumed oil. What is costly, fragrant, and carefully prepared can be ruined by something
  tiny and corrupting. So too, a small measure of סִכְלוּת (sikhlut), folly, can carry more public weight
  than a person’s wisdom and honor. Qoheleth is not denying the value of wisdom; he is observing how fragile
  reputation is, and how conspicuous foolishness becomes.


  The contrast of right and left depicts an inward moral direction: the wise person’s לֵב (lev), heart
  or mind, is rightly disposed, while the fool’s is askew. Folly cannot remain hidden; it accompanies
  him down the road and announces itself. Yet the counsel concerning an angry ruler is strikingly practical:
  do not impulsively leave your post. מַרְפֵּא (marpeʾ), gentleness or composure, can quiet even serious
  wrongs. The passage closes by naming political disorder as a grievous “error” proceeding from the one
  who rules—a reminder that folly is not confined to private life.


  Key Terms


  **זְבוּבֵי מָוֶת (zevuvē mavet)** — “flies of death,” an image of small decay producing grave corruption.

  **סִכְלוּת (sikhlut)** — folly, stupidity, or ruinous lack of judgment.

  **לֵב (lev)** — heart, the inner seat of thought, will, and moral orientation.

  **מַרְפֵּא (marpeʾ)** — calmness, healing gentleness, or a soothing response.


  Cross-Tradition Resonances


  **Proverbs 14:8:** “The wisdom of the prudent is to discern their way,” paralleling Qoheleth’s concern
  that wisdom is shown in one’s direction and conduct. Divergence: Proverbs speaks more confidently of
  prudence’s benefit, while Qoheleth stresses how easily a little folly can eclipse it.

  **Epictetus, Enchiridion 20:** Epictetus counsels restraint when provoked, akin to Qoheleth’s advice
  not to abandon one’s place when a ruler’s anger rises. Divergence: Epictetus grounds composure in mastery
  of one’s judgments, whereas Qoheleth presents it as prudent conduct within an unstable hierarchy.

  **Dhammapada 5:** The verse teaches that hostility is not ended by hostility, a close parallel to the
  calming force of gentle restraint. Divergence: The Dhammapada offers a universal moral principle about
  hatred; Ecclesiastes addresses a particular political encounter with a superior.'
