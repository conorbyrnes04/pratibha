sanskrit_devanagari: '(7:11) טוֹבָ֥ה חָכְמָ֖ה עִֽם־נַחֲלָ֑ה וְיֹתֵ֖ר לְרֹאֵ֥י הַשָּֽׁמֶשׁ׃

  (7:12) כִּ֛י בְּצֵ֥ל הַֽחָכְמָ֖ה בְּצֵ֣ל הַכָּ֑סֶף וְיִתְר֣וֹן דַּ֔עַת הַֽחָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽיהָ׃

  (7:13) רְאֵ֖ה אֶת־מַעֲשֵׂ֣ה הָאֱלֹהִ֑ים כִּ֣י מִ֤י יוּכַל֙ לְתַקֵּ֔ן אֵ֖ת אֲשֶׁ֥ר עִוְּתֽוֹ׃

  (7:14) בְּי֤וֹם טוֹבָה֙ הֱיֵ֣ה בְט֔וֹב וּבְי֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת־זֶ֤ה לְעֻמַּת־זֶה֙ עָשָׂ֣ה
  הָֽאֱלֹהִ֔ים עַל־דִּבְרַ֗ת שֶׁלֹּ֨א יִמְצָ֧א הָֽאָדָ֛ם אַחֲרָ֖יו מְאֽוּמָה׃

  (7:15) אֶת־הַכֹּ֥ל רָאִ֖יתִי בִּימֵ֣י הֶבְלִ֑י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּצִדְק֔וֹ וְיֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ
  בְּרָעָתֽוֹ׃'
translation_literal: '(7:11) Wisdom is good alongside an inheritance; it is an advantage for those who
  behold the sun. (7:12) For one is sheltered by wisdom as one is sheltered by money; yet the gain of
  knowledge is this: wisdom preserves the life of its possessor. (7:13) Look upon the work of God: who
  can straighten what he has made crooked? (7:14) On a day of well-being, be in well-being; and on a day
  of adversity, consider: God has made this alongside that, so that no one may discover anything that
  comes after him. (7:15) I have seen everything in the days of my vapor: there is a righteous person
  perishing in his righteousness, and there is a wicked person prolonging his days in his wrongdoing.'
commentary: 'Qoheleth commends wisdom without turning it into a guarantee. Like an inheritance, it is
  a tangible advantage among “those who behold the sun,” the living. Both wealth and wisdom offer a צֵל
  (tsel), a shade or shelter; but wisdom possesses a further יִתְרוֹן (yitron), an enduring surplus: it
  keeps its owner alive. This is not necessarily a promise of immunity from death, but a claim that wise
  discernment is life-giving amid life’s exposures.


  Yet the speaker immediately directs the reader to God’s unstraightenable work. The command “look” does
  not invite resignation without attention, but sober perception. Good and bad days stand “alongside”
  one another, frustrating any scheme by which humans could master what follows. The final observation
  refuses simplistic moral accounting: the righteous may perish precisely while righteous, while the wicked
  may endure in evil. In the days of his הֶבֶל (hevel), his fleeting and insubstantial life, Qoheleth
  does not deny justice; he denies that its full pattern is visibly or mechanically available to us.


  Key Terms


  **חָכְמָה (ḥokhmah)** — wisdom; practical and perceptive skill for living

  **צֵל (tsel)** — shade, shelter, or protective cover

  **יִתְרוֹן (yitron)** — advantage, surplus, or gain

  **הֶבֶל (hevel)** — vapor; life’s fleeting, elusive quality


  Cross-Tradition Resonances


  **Job 21:7:** Job likewise asks why the wicked live on, grow old, and increase in power, echoing Qoheleth’s
  refusal of easy retributive formulas. Divergence: Job frames the question as a protest within a larger
  dispute over suffering, while Qoheleth offers a compressed observation about life’s inscrutable pattern.

  **Bhagavad Gita 2.14:** The Gita teaches that pleasure and pain come and go and calls for endurance
  amid their alternation, resembling Qoheleth’s attention to good and adverse days. Divergence: The Gita
  directs the hearer toward disciplined equanimity and liberation, whereas Qoheleth stresses the limits
  of knowing God’s ordering of events.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within human control from what does
  not, a distinction congenial to Qoheleth’s question about straightening what God has bent. Divergence:
  Stoicism locates freedom in the governance of one’s judgments, while Qoheleth grounds the limit in God’s
  sovereign and opaque work.'
practice: For one week, at day’s end name one “good-day” gift and one “adverse-day” difficulty. Give thanks
  for the first; for the second, write one thing you cannot straighten and one small faithful action you
  can take tomorrow.
