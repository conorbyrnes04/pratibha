sanskrit_devanagari: '(7:16) אַל־תְּהִ֤י צַדִּיק֙ הַרְבֵּ֔ה וְאַל־תִּתְחַכַּ֖ם יוֹתֵ֑ר לָ֖מָּה תִּשּׁוֹמֵֽם׃

  (7:17) אַל־תִּרְשַׁ֥ע הַרְבֵּ֖ה וְאַל־תְּהִ֣י סָכָ֑ל לָ֥מָּה תָמ֖וּת בְּלֹ֥א עִתֶּֽךָ׃

  (7:18) ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּזֶ֔ה וְגַם־מִזֶּ֖ה אַל־תַּנַּ֣ח אֶת־יָדֶ֑ךָ כִּֽי־יְרֵ֥א אֱלֹהִ֖ים
  יֵצֵ֥א אֶת־כֻּלָּֽם׃

  (7:19) הַֽחָכְמָ֖ה תָּעֹ֣ז לֶחָכָ֑ם מֵֽעֲשָׂרָה֙ שַׁלִּיטִ֔ים אֲשֶׁ֥ר הָי֖וּ בָּעִֽיר׃

  (7:20) כִּ֣י אָדָ֔ם אֵ֥ין צַדִּ֖יק בָּאָ֑רֶץ אֲשֶׁ֥ר יַעֲשֶׂה־טּ֖וֹב וְלֹ֥א יֶחֱטָֽא׃'
translation_literal: 'Do not make yourself excessively righteous, and do not make yourself overly wise;
  why should you bring ruin upon yourself?


  Do not become excessively wicked, nor become a fool; why should you die before your time?


  It is good that you hold fast to this, and from that do not withdraw your hand; for one who fears God
  will come forth from them all.


  Wisdom gives strength to the wise person more than ten rulers who were in a city.


  For there is no human being on earth so righteous that he does good and never sins.'
commentary: 'Qoheleth warns against extremes that ruin rather than heal. “Do not make yourself excessively
  righteous” does not commend injustice; rather, it challenges a righteousness that has become inflated,
  rigid, or self-made. Likewise, the warning against being “excessively wicked” does not establish a tolerable
  measure of evil. Both sayings expose paths of self-destruction: pride disguised as virtue on one side,
  and foolish lawlessness on the other. The repeated question, “Why?” presses the reader toward sober
  self-knowledge.


  Verse 18 asks the reader to keep hold of both cautions, not releasing either one. The יְרֵא אֱלֹהִים
  (yereʾ Elohim), the one who fears God, is not the person who has mastered every moral calculation, but
  one who lives reverently within human limits. Wisdom, חָכְמָה (ḥokhmah), gives greater strength than
  political power, yet it does not make a person sinless. The final line dismantles spiritual self-congratulation:
  no צַדִּיק (tsaddiq), no righteous person, does good without ever missing the mark.


  Key Terms


  **צַדִּיק (tsaddiq)** — righteous; one who acts justly or stands in the right.

  **רָשַׁע (rashaʿ)** — to act wickedly; to become morally culpable.

  **חָכְמָה (ḥokhmah)** — wisdom, practical discernment that gives strength.

  **יְרֵא אֱלֹהִים (yereʾ Elohim)** — one who fears God, living with reverence and accountable humility.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6:** Aristotle describes virtue as a fitting mean between destructive
  excesses, paralleling Qoheleth’s suspicion of ruinous extremes. Divergence: Aristotle grounds the mean
  in cultivated rational virtue, whereas Qoheleth centers the fear of God and emphasizes the inescapability
  of sin.

  **Dhammapada 183:** The counsel to avoid evil, cultivate good, and purify the mind similarly directs
  moral life away from folly and harm. Divergence: The Dhammapada frames liberation through disciplined
  purification, while Qoheleth speaks of reverence for God and does not present sinlessness as attainable.

  **Romans 3:23:** Paul’s statement that all have sinned closely echoes Qoheleth’s claim that no one on
  earth does good without sinning. Divergence: Romans develops this universal failure into an argument
  about redemption in Christ; Qoheleth’s saying remains a wisdom observation about human limitation.'
practice: At day’s end, hold your hands open for one minute and name one place where you were rigid or
  self-righteous and one place where you were careless or foolish. Ask for reverence, then choose one
  small, concrete act of repair for the next day.
