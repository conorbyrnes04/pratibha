sanskrit_devanagari: (2:26) כִּ֤י לְאָדָם֙ שֶׁטּ֣וֹב לְפָנָ֔יו נָתַ֛ן חָכְמָ֥ה וְדַ֖עַת וְשִׂמְחָ֑ה וְלַחוֹטֶא֩
  נָתַ֨ן עִנְיָ֜ן לֶאֱס֣וֹף וְלִכְנ֗וֹס לָתֵת֙ לְטוֹב֙ לִפְנֵ֣י הָֽאֱלֹהִ֔ים גַּם־זֶ֥ה הֶ֖בֶל וּרְע֥וּת
  רֽוּחַ׃
translation_literal: For to the person who is good before him, he gives wisdom, knowledge, and joy; but
  to the sinner he gives the occupation of gathering and storing up, to hand it over to the one who is
  good before God. This also is vapor and a chasing of wind.
commentary: 'The verse distinguishes two kinds of receiving. The one who is טוֹב לְפָנָיו (tov lefanav),
  “good before him,” is given not merely goods but inner capacities: חָכְמָה (wisdom), דַּעַת (knowledge),
  and שִׂמְחָה (joy). Qoheleth does not portray joy as a commodity earned by successful labor; it is a
  gift granted within one’s standing before God.


  By contrast, the חוֹטֵא (ḥoteʾ), the sinner, receives עִנְיָן (ʿinyan), an absorbing and burdensome
  occupation: collecting and hoarding. The bitter irony is that this amassed wealth may finally be transferred
  to another. Such accumulation, when it becomes an end in itself, is הֶבֶל (hevel), a breathlike vapor,
  and רְעוּת רוּחַ (reʿut ruaḥ), an attempt to chase or shepherd the wind—strenuous, elusive, and without
  lasting grasp.


  Key Terms


  **חָכְמָה (ḥokhmah)** — wisdom; practical and discerning understanding given by God.

  **שִׂמְחָה (simḥah)** — joy; gladness received as a gift rather than secured by possession.

  **עִנְיָן (ʿinyan)** — task, occupation, or burdensome preoccupation.

  **הֶבֶל (hevel)** — vapor, breath, transience; that which cannot be held securely.


  Cross-Tradition Resonances


  **Matthew 6:19–20:** Jesus warns against storing up perishable earthly treasure, paralleling Qoheleth’s
  suspicion that accumulation cannot provide secure fulfillment. Divergence: Matthew redirects treasure
  explicitly toward heaven, whereas Qoheleth here stresses God’s inscrutable redistribution of goods and
  the gift of present joy.

  **Bhagavad Gita 3.19:** The Gita commends action without attachment to its fruits, echoing the warning
  that labor devoted to possession can become spiritually empty. Divergence: The Gita frames detachment
  as a discipline of duty leading toward liberation; Qoheleth frames the matter as an observation about
  divine giving and life’s vaporous outcome.

  **Qur’an 57:20:** The Qur’an describes worldly life as diversion, adornment, rivalry, and competition
  in wealth, resonating with Qoheleth’s portrayal of compulsive gathering. Divergence: The Qur’an sets
  this contrast within a strong summons to repentance and the enduring reward of God, while Qoheleth concludes
  here with the unresolved image of wind-chasing.'
practice: 'For one day, before buying, saving, or organizing any possession, pause for three breaths and
  ask: “Will this serve wisdom, knowledge, or joy—or only the labor of gathering?” Give away one useful
  item or a small sum in gratitude.'
