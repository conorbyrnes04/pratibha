sanskrit_devanagari: '(3:1) לַכֹּ֖ל זְמָ֑ן וְעֵ֥ת לְכָל־חֵ֖פֶץ תַּ֥חַת הַשָּׁמָֽיִם׃ ס

  (3:2) עֵ֥ת לָלֶ֖דֶת וְעֵ֣ת לָמ֑וּת עֵ֣ת לָטַ֔עַת וְעֵ֖ת לַעֲק֥וֹר נָטֽוּעַ׃

  (3:3) עֵ֤ת לַהֲרוֹג֙ וְעֵ֣ת לִרְפּ֔וֹא עֵ֥ת לִפְר֖וֹץ וְעֵ֥ת לִבְנֽוֹת׃

  (3:4) עֵ֤ת לִבְכּוֹת֙ וְעֵ֣ת לִשְׂח֔וֹק עֵ֥ת סְפ֖וֹד וְעֵ֥ת רְקֽוֹד׃

  (3:5) עֵ֚ת לְהַשְׁלִ֣יךְ אֲבָנִ֔ים וְעֵ֖ת כְּנ֣וֹס אֲבָנִ֑ים עֵ֣ת לַחֲב֔וֹק וְעֵ֖ת לִרְחֹ֥ק מֵחַבֵּֽק׃'
translation_literal: 'For everything there is a season, and a time for every undertaking beneath the heavens:
  a time to give birth and a time to die; a time to plant and a time to uproot what was planted; a time
  to kill and a time to heal; a time to break down and a time to build; a time to weep and a time to laugh;
  a time for mourning and a time for dancing; a time to cast away stones and a time to gather stones;
  a time to embrace and a time to draw back from embracing.'
commentary: 'Qoheleth opens with the broad claim that all things have their זְמָן (zeman), their appointed
  season, and their עֵת (ʿet), their particular moment. The paired lines do not merely offer comfort;
  they name the uneven, often painful rhythm of life beneath heaven. Birth stands beside death, planting
  beside uprooting, healing beside killing. Human beings live amid changes they cannot finally schedule
  or master.


  Yet the passage does not portray life as meaningless stillness. Its verbs are concrete: plant, build,
  weep, dance, gather, embrace. Wisdom here lies in discerning the character of the present time rather
  than forcing one posture upon every hour. Even intimacy has its season: there is a fitting time for
  לַחֲבֹק (laḥavoq), to embrace, and another for stepping back. The poem gives dignity both to action
  and restraint, to lament and delight.


  Key Terms


  **זְמָן (zeman)** — a season or appointed span of time

  **עֵת (ʿet)** — a particular time, occasion, or moment

  **חֵפֶץ (ḥefets)** — a matter, purpose, or undertaking

  **לַחֲבֹק (laḥavoq)** — to embrace


  Cross-Tradition Resonances


  **Genesis 8:22:** Genesis likewise speaks of enduring cycles—seedtime and harvest, cold and heat, summer
  and winter, day and night. Divergence: Genesis grounds these cycles in God''s covenant with the earth,
  while Qoheleth attends more closely to the changing seasons of human action and feeling.

  **Bhagavad Gita 2.27:** The Gita observes that death is certain for one who is born, echoing Qoheleth''s
  pairing of birth and death. Divergence: The Gita places this truth within a teaching on the enduring
  self and rebirth; Qoheleth''s lines remain within the observable course of life beneath the heavens.

  **Dhammapada 277:** The Buddhist saying that all conditioned things are impermanent accords with Qoheleth''s
  vision of life as continual transition. Divergence: The Dhammapada directs insight into impermanence
  toward release from attachment, whereas this passage chiefly counsels attentiveness to the fittingness
  of each time.'
practice: At day’s end, name one reality that is asking to be received rather than changed—grief, work,
  rest, repair, celebration, closeness, or distance—and take one small bodily action suited to that season.
