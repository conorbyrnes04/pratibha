- kind: key_terms
  label: Key Terms
  items:
  - term: pulaaku
    definition: 'Fulɓe-ness: reserve, endurance, shame-honor — Lasnet does not use the word; he records
      the visible rule: impassibility, and the seclusion-school of legends'
  - term: impassibilité
    definition: impassibility, the face that does not leak pain — honor as composure; stoicism is a fair
      gloss if you remember it is public and communal here, not a private Roman notebook
  - term: déshonneur
    definition: dishonor in complaining — shame as social ontology; later semteende (reserve, shame);
      Lasnet has the sanction without the Pulaar word
  - term: gardiens
    definition: elder guardians of the seclusion-house — transmitters, not only nurses of wounds; the
      office is to speak the people into the next generation
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic apatheia
    resonance: Both treat the uncomplaining face as a form of freedom.
    divergence: Stoic impassibility is an inward judgment about what is up to us; Fulɓe impassibility
      here is honor before witnesses.
  - citation: Kashmir Śaiva vīra (heroic) posture
    resonance: Both demand a steadiness that does not flinch.
    divergence: The tantric hero's steadiness is in consciousness amid appearance; this steadiness is
      in a social body that must not shame the group.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one necessary difficulty you are already in. For one day, do not advertise it and do not
    complain of it. In the evening, listen to someone older tell a story — live, if you can — as if endurance
    without transmission were incomplete.
