  label: Original
  body: Pendant toute l'opération les jeunes gens doivent conserver l'impassibilité la plus grande; il
    y aurait déshonneur à se plaindre. Le soir, ils écoutent les légendes et les fables de leurs gardiens.
- kind: translation
  label: Pratibha Translation
  body: Through the whole operation the young men must keep the greatest impassibility; it would be dishonor
    to complain. In the evening they listen to the legends and fables of their guardians.
