unit_label: Honor Is Impassibility
title: Honor Is Impassibility
unit_type: teaching_passage
commentary: 'Pain is not the teaching. The teaching is that a public ordeal is the place where honor is
  either kept or lost, and that the keeping looks like stillness. Dishonor is not the cut. Dishonor is
  the complaint. Lasnet''s chapter is a colonial medical description of circumcision; this unit refuses
  the surgical content and keeps the philosophical rule that the description accidentally recorded. Threshold,
  not anatomy.


  This is as close as the PD ethnography comes to pulaaku without naming it. Reserve, self-mastery, the
  refusal to make inner weather into noise: Lasnet sees it on the initiation ground and also, elsewhere,
  in the continual gravity of the adult Peul who rarely dances. The evening of legends is the other half
  of initiation. Impassibility without transmission would be only toughness. The guardians tell the stories
  that make the boys into a people. Pre-Islamic and Islamic Fulɓe both circumcise; what the remnant shares
  with the older world is not the knife but the school: seclusion, elder speech, a body that must not
  betray itself.


  Existentially the teaching is not seek pain. It is: when you are already in a necessary difficulty,
  do not add the second wound of display. Keep the face. Then, in the evening, listen. Initiation that
  is only endurance is brutality. Initiation that is endurance plus story is how a tradition reproduces.'
