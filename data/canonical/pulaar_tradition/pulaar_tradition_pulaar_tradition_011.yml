unit_label: Affection for the Herd Greater Than for Children
title: Affection for the Herd Greater Than for Children
unit_type: teaching_passage
commentary: 'Care is the rite. Lasnet wants a gasp: these people love cows more than children. The colonial
  sentence is sensational. The philosophical reading is colder. In a pastoral ontology the herd is the
  continuing body of the group. Children matter; the herd is how children eat, how bridewealth is named,
  how the path is chosen. Affection greater than for children is not a ranking of persons as disposable.
  It is a ranking of what must not be allowed to die if the people are to remain a people. The scandal
  is the observer''s. The teaching is that love can be liturgical without being cute.


  "True affection" (véritable affection) and "make themselves loved" (s''en font aimer) are two directions
  of the same relation. Knowledge is not inventory. They know the animals admirably because they live
  in the midst of them, and the animals answer. Nagge is not stock. Nagge is a being you can be loved
  by. That is why later sources can call the old cult boolâtrie without ever finding a cow-idol: the cult
  is this two-way care.


  Existentially the teaching refuses a spirituality that reserves love for the human face and treats every
  other life as instrument. If the being that feeds you cannot be loved, your cult is already empty. You
  do not have to outrank your children. You do have to notice which non-human life you treat as if it
  could not love you back, and whether that refusal is wisdom or a thinned world.'
