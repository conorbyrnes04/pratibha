- kind: key_terms
  label: Key Terms
  items:
  - term: affection véritable
    definition: true affection — Lasnet's word for a love that outranks even children in his ranking;
      do not moralize it as cruelty to children; read it as the herd being the group's ongoing life
  - term: s'en font aimer
    definition: make themselves loved by the herd — knowledge as two-way; the animals are not mute property
  - term: nagge
    definition: the cow as the being this affection is for — not a pet and not a unit of meat
  - term: pulaaku
    definition: the honor-code that will later name reserve around this love so it does not become display
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Christian Good Shepherd
    resonance: Both make care of the flock the image of right relation.
    divergence: The Gospel metaphor points past sheep to persons; Lasnet's Fulɓe point at the cattle as
      the actual center of care.
  - citation: Zhuāngzǐ's butcher Ding
    resonance: Both locate mastery in knowing a living body's grain so well that relation becomes easy.
    divergence: Ding's ox is already for the blade; the Fulɓe ox is for continued life, milk, and motion.
- kind: practice
  label: Practice (Abhyasa)
  body: Give one living non-human being — animal, tree, patch of ground — a full act of care today, done
    as if it could love you back. Do not narrate it as metaphor. Do the care. That is the rite.
