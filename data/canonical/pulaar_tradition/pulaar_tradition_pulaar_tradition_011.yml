translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Sans cesse au milieu de leurs troupeaux, ils les connaissent admirablement et s'en font aimer,
    d'ailleurs ils ont pour eux une véritable affection, plus grande souvent que pour leurs propres enfants.
- kind: translation
  label: Pratibha Translation
  body: Always in the midst of their herds, they know them admirably and make themselves loved by them.
    They have for the animals a true affection, often greater than for their own children.
- kind: commentary
  label: Pratibha Commentary
  body: 'Care is the rite. Lasnet wants a gasp: these people love cows more than children. The colonial
