title: Consult the Mother Before a Great Act
unit_type: sutra
sanskrit_devanagari: La femme peule est beaucoup plus considérée que chez les autres peuplades du Sénégal, elle exerce souvent
  un grand ascendant sur son mari et, malgré la latitude que donne à celui-ci le Coran, il est rare qu'elle laisse pénétrer
  une seconde femme dans sa case; elle est respectée et très écoutée de ses enfants, un Peul n'accomplit jamais une action
  importante sans consulter sa mère.
sanskrit_iast: 'Not applicable. The practice-term is French *consulter sa mère*. Later Fulɓe social language names the mother''s
  people and the strength of the maternal line; Lasnet records the decision-rule: no important act without her.'
translation_literal: The Peul woman is held in much higher regard than among the other peoples of Senegal. She often exerts
  a great ascendancy over her husband, and despite the latitude the Qur'an gives him it is rare that she lets a second wife
  into her house. She is respected and closely listened to by her children. A Peul never accomplishes an important action
  without consulting his mother.
commentary: 'The claim is a decision-procedure, not a compliment to "the status of women." Lasnet is comparing colonial ethnic
  files. Strip the ranking. What remains is a rule of counsel: before a great act, ask the mother. Islam''s legal polygamy
  is in the same paragraph and is described as practically checked by the wife. The deeper remnant is maternal consultation
  as a condition of action. Authority is not only the almamy, the marabout, or the *ardo*. Authority is the woman from whom
  one was born, still speaking.


  In a cattle-people this is not a sentimental exception to patriarchy; it is how a mobile household keeps a memory that is
  not written. The mother is the one who has seen the herd, the marriages, the failures. To act without her is to act without
  the household''s archive. Pre-Islamic West African social philosophy, as Delafosse will say of clans generally, runs through
  ancestors. This sentence makes the living mother the nearest ancestor who can still answer.


  Existentially the teaching is against heroic solitude. An "important action" that cannot survive being told to one''s mother
  is probably vanity. Consultation is not permission-as-infantilism. It is the test that the act belongs to a line and not
  only to a mood.


  Key Terms:


  **consulter sa mère** - consult one''s mother -> the condition of a great act -> "ask mom" as joke misses that Lasnet says
  *never* (*jamais*) and *important action*.


  **ascendant** - the wife''s ascendancy over the husband -> practical authority inside a Qur''anic frame that legally favors
  the man -> remnant: the house is not the Qur''an''s diagram.


  **très écoutée** - closely listened to -> children as a listening body -> the opposite of the colonial cartoon of the silent
  African woman.


  **action importante** - important action -> the threshold at which counsel becomes mandatory -> daily acts may be free;
  founding acts are not.


  Cross-Tradition Resonances:


  **Confucian filial consultation:** Both make the parent a living source of right action.

  *Divergence:* Confucian counsel is often paternal and ritualized as *xiao*; this sentence specifies the mother.


  **Delphic counsel before a great act:** Both refuse to let a founding decision be merely private.

  *Divergence:* Delphi is an oracle of the god; here the oracle is the mother.


  **Serer household genius (this corpus):** Both keep the house as a spiritually thick place, not a male club.

  *Divergence:* Serer thickness is a *génie de la case*; Fulɓe thickness in this unit is a speaking woman.'
insight: The claim is a decision-procedure, not a compliment to "the status of women." Lasnet is comparing colonial ethnic
  files.
practice: Before one important action this week, consult a living elder woman in your line — mother, aunt, teacher — and tell
  her the act in plain speech. Do not perform the consultation as theater. Change the act if her hearing finds it thinner
  than you thought.
