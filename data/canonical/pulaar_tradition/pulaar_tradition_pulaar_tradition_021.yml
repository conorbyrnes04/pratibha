unit_label: Never Sell the Breeding Stock
title: Never Sell the Breeding Stock
unit_type: teaching_passage
commentary: 'There is a second never inside the first. Calves and cows do not sell because they are the
  mother-line. Pack oxen rarely sell because they are the people''s feet. Lasnet''s bœufs porteurs are
  not meat waiting for a buyer. They are the mount, led by a nose-ring, the body that makes displacement
  possible when pasture fails. To sell the breeding stock is to sell the future. To sell the pack oxen
  is to sell the path. Both refusals are the same cult: nagge as what must remain if the group is to remain.


  "Rarely part with them" (s''en défont rarement) is weaker than jamais and still a law. The market may
  take a surplus ox. It may not take the trained body that carries the camp. A spirituality that sells
  its means of motion for a good price has already chosen to become sedentary cargo. The herd-cult will
  not make that bargain. Affection and interest, again, are one.


  Existentially the teaching is: do not sell the thing that lets you move. People sell their rest, their
  tools, their teachers, their animals of burden, and then wonder why they cannot change pasture. Keep
  the breeding line. Keep the pack. The ox that is only meat is the only ox the market is owed.'
