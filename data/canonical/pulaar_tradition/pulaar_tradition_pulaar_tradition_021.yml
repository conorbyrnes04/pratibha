- kind: key_terms
  label: Key Terms
  items:
  - term: bœufs porteurs
    definition: pack oxen — the mount of a cattle-people; rarely sold because they are the path, not the
      surplus
  - term: anneau
    definition: nose-ring — the instrument of leading, not of ownership-as-cruelty; the animal is conducted,
      not dragged as cargo
  - term: s'en défont rarement
    definition: rarely part with them — the second never, weaker in grammar, same in cult
  - term: nagge
    definition: the living capital that must not be alienated — mother-line and mount together
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Homeric horses of the kings, not for trade
    resonance: Both mark the trained animal of motion as outside ordinary sale.
    divergence: Homeric horses are aristocratic prestige; Fulɓe pack oxen are the camp's ordinary feet.
  - citation: Daoist uncarved block that is not sold as timber
    resonance: Both refuse to turn the source-body into merchandise.
    divergence: Laozi's block is unused potential; the pack ox is used every day and still not sold.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the one tool, animal, practice, or relationship that is your pack ox — the thing that lets
    you move. Refuse one offer to part with it today, even a flattering one. The market may have your
    surplus. It may not have your feet.
provenance:
