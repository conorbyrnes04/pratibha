translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Ils ont un assez grand nombre de bœufs porteurs bien dressés et qu'ils conduisent par un anneau
    passé dans la cloison nasale ; ces animaux constituent leur monture la plus fréquente [...] les Peuls
    s'en défont rarement. Dans leurs marchés ils ne se défont que des bœufs, jamais des veaux ni des vaches.
- kind: translation
  label: Pratibha Translation
  body: They have a good number of well-trained pack oxen, led by a ring through the nasal septum; these
    animals are their most usual mount. The Peuls rarely part with them. In their markets they part only
    with oxen, never with calves or cows.
- kind: commentary
  label: Pratibha Commentary
  body: 'There is a second never inside the first. Calves and cows do not sell because they are the mother-line.
