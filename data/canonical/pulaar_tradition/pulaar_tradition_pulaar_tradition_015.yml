translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Leur principal revenu est dans les troupeaux ; ils ont des bœufs et des moutons en grand nombre
    [...] Ils vendent aussi du lait et du beurre que les femmes peules portent dans des outres en cuir
    ou de grandes calebasses ; pour leur consommation particulière ils n'usent comme les Maures que de
    petit lait. [...] d'autant mieux considérés qu'ils en ont davantage et sont plus habiles à les soigner.
- kind: translation
  label: Pratibha Translation
  body: Their principal revenue is in the herds; they have oxen and sheep in great number. They also sell
    milk and butter, which Peul women carry in leather skins or large calabashes; for their own consumption
    they use, like the Moors, only sour milk. They are the better considered the more they have and the
    more skilled they are at caring for them.
