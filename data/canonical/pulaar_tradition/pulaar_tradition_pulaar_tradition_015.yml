unit_label: Women Carry the Milk
title: Women Carry the Milk
unit_type: teaching_passage
commentary: 'The herd is wealth and honor, and the visible carrier of that wealth is a woman with a calabash.
  Lasnet''s commerce chapter wants a revenue line. What he records is a gendered liturgy of milk. Men
  are better considered the more animals they have and the more skilled they are at care. Women carry
  the milk and the butter to the place where the surplus becomes exchange. The camp itself drinks petit
  lait, sour milk — the thinner remainder. The rich part of the gift walks to market on a woman''s head
  or hip.


  This is not a lesson that women are porters and men are owners. It is a lesson that honor (considérés)
  is skill at care, and that the cult''s product is milk, not meat. A people who will not sell cows will
  still sell what the cow gives. The woman who carries the skin or the calabash is the public face of
  boolâtrie after conversion: Islam may own Friday; the milk-road still belongs to the herd.


  Existentially the teaching is that honor and care are one count. You are not more considered because
  you hoard. You are more considered because you have more life in your keeping and you know how to keep
  it. Ask who in your household actually carries the gift to the world, and whether you have mistaken
  the carrier for a servant of the cult instead of its priest.'
