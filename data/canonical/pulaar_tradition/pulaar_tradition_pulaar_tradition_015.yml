- kind: key_terms
  label: Key Terms
  items:
  - term: lait et beurre
    definition: milk and butter — the cult's surplus; meat is not the sentence; milk is
  - term: considérés
    definition: considered, honored — honor as a function of herd-size and skill at care, not of speech
  - term: petit lait
    definition: sour milk, the camp's own drink — the rich part walks out; the thin part stays
  - term: nagge
    definition: the source whose milk women carry — wealth and honor in one living body
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vedic go-dohana, the milking as rite
    resonance: Both make milking and the gift of milk a public religious-economic act.
    divergence: Vedic milking is often a priestly morning office; here the public carrier is the Peul
      woman on the path to market.
  - citation: Serer milk poured at the baobab (this corpus)
    resonance: Both treat milk as the matter of relation, not only of diet.
    divergence: Serer milk is offered upward to spirits; Fulɓe milk in this sentence is carried outward
      as wealth that still honors the herd.
- kind: practice
  label: Practice (Abhyasa)
  body: Carry one gift you usually let someone else carry — food, a message, a payment, a care — all the
    way to its recipient today. Do it as the public face of what you live from, not as an errand.
