- kind: key_terms
  label: Key Terms
  items:
  - term: dot ... toujours exprimée en vaches
    definition: bridewealth always expressed in cows — the cow as unit of speech, even when payment is
      substituted; European dowry (goods the bride brings) is the wrong direction
  - term: nagge
    definition: cow, specifically, not generic livestock — milk-life, not meat-wealth only; substituting
      sheep or cloth is allowed; substituting the name is not
  - term: sadaaki
    definition: later Pulaar bridewealth (from Arabic ṣadāq) — Islamic legal name; Lasnet's fact is that
      the measure remains bovine
  - term: l'honore
    definition: honors him — bridewealth as honor, not only transfer; pulaaku later names honor-shame;
      Lasnet has the structure without the word
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vedic bride-gift and cattle as dakṣiṇā
    resonance: Both make cattle the measurable form of a sacred bond.
    divergence: Vedic cattle-gift is priestly and hymnic; Fulɓe cattle-gift here is affinal and remains
      so under Qur'anic law.
  - citation: Aristotle on timē (honor)
    resonance: Both treat honor as something that must be publicly measured.
    divergence: Greek honor is civic and martial; this honor is pastoral and nuptial.
- kind: practice
  label: Practice (Abhyasa)
  body: Take one obligation you owe a person — thanks, help, repair. Name it in the unit that is actually
    sacred to you, not in the unit that is convenient. Then give a piece of that, not a substitute that
    keeps the name empty.
