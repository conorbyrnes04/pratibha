unit_label: Bridewealth Is Always Named in Cows
title: Bridewealth Is Always Named in Cows
unit_type: teaching_passage
commentary: 'Cattle are not only food and motion; they are the language of honor in alliance. Lasnet is
  describing marriage regulated by the laws of the Qur''an, with a marabout reciting prayers. Inside that
  Islamic frame the dowry-word is still bovine. You may pay in money, sheep, or cloth, but you name the
  gift in cows. The pre-Islamic measure survives as the unit of speech. That is how a cult remains after
  the temple is gone: it becomes the currency of respect.


  "Honors him the more as it is higher" is a ranking that can become vanity. The philosophical core is
  prior to the vanity. A people whose primitive cult was the herd will measure a binding of families in
  the same beings that determine the path. Fifteen cows is not a price-tag on a woman in the market sense
  Lasnet''s achetée wants. It is the herd acknowledging a new household. Later Pulaar names bridewealth
  sadaaki (from Arabic ṣadāq) when the frame is Islamic; Lasnet''s ethnographic fact is that the unit
  of honor remains nagge even when payment is substituted.


  Existentially the teaching is about what you still count when you think you have changed religions.
  If your sacred is cattle, your contracts will speak cow even on a mosque day. Ask what unit you always
  express things in — money, credentials, time, attention. That unit is your remaining cult.'
