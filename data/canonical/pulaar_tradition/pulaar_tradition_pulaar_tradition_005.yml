translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: 'La dot est proportionnelle à la fortune du mari et l''honore d''autant qu''elle est plus élevée
    : pour une jeune fille, elle peut aller jusqu''à quinze vaches, à dix pour une femme déjà mariée;
    cette dot est toujours exprimée en vaches.'
- kind: translation
  label: Pratibha Translation
  body: 'The bridewealth is proportional to the husband''s fortune and honors him the more as it is higher:
    for a young woman it may go as far as fifteen cows, ten for a woman already married. This bridewealth
    is always expressed in cows.'
- kind: commentary
  label: Pratibha Commentary
