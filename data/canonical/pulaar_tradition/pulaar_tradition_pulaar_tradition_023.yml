- kind: key_terms
  label: Key Terms
  items:
  - term: Founangui
    definition: country of the east — the Fulɓe autonym for the cradle; not Egypt, not Rome; a pasture
      that failed
  - term: pâturages
    definition: pastures — the true cause of the first migration; origin as hunger of the herd
  - term: antérieure à l'islamisme
    definition: earlier than Islam — the chronological warrant for reading a pre-Islamic remainder
  - term: nagge
    definition: the cattle whose hunger wrote the first path out of the east
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Abraham leaving Canaan/Haran for pasture and promise
    resonance: Both begin a people with a departure caused by life that must be fed.
    divergence: Abraham's departure is commanded by God; the Fulɓe departure is commanded by exhausted
      grass.
  - citation: Daoist uncarved beginning
    resonance: Both prefer a poor origin to a legendary ancestry.
    divergence: Laozi's beginning is metaphysical; Founangui is a named east the cattle could no longer
      keep.
- kind: practice
  label: Practice (Abhyasa)
  body: Write one sentence of origin that names a lack — a pasture that failed, a work that ended, a place
    that could not feed you — and the move that followed. Keep that sentence today as your Founangui.
    Do not upgrade it into a proud genealogy.
