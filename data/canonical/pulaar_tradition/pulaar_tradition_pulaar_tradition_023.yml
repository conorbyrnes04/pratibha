unit_label: The East Was the Cradle
title: The East Was the Cradle
unit_type: teaching_passage
commentary: 'Origin is a pasture story, not a race story. Lasnet''s chapter opens with European fantasies
  — Egypt, a lost Roman legion — which this unit refuses. What the Fulɓe tell him is Founangui, the country
  of the east, left when the grass failed. The first displacement is already the law of unit 3: the herd''s
  need decides the path. Self-account is not a skull-index. Self-account is: we were where the cattle
  could eat, and then we were not.


  "Earlier than Islam" (antérieure à l''islamisme) is the chronological claim that warrants the whole
  collection. Migration is old enough that a great part is still unconverted. The remainder is not a footnote
  to the imamate. The imamate is a later form of a people who already moved for nagge. Distinctness, in
  the usable sense, is occupational and liturgical — herders with one cult — not the racial ranking Lasnet''s
  physical-anthropology pages try to install. Those pages are skipped.


  Existentially the teaching is that your true origin-story is the first time you left because something
  living could not eat. Nations prefer a glorious cradle. The Fulɓe sentence is poorer and truer: the
  east was enough, then it was not, and the herd walked. If your myth of beginning has no hunger in it,
  it is a costume.'
