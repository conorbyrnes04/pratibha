translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Quant aux Peuls eux-mêmes, ils se considèrent comme tout à fait distincts des nègres et se donnent
    pour berceau le Founangui, (pays de l'est) qu'ils quittèrent quand la région n'eut plus assez de pâturages
    pour nourrir leurs troupeaux. Quelle que soit l'origine des Peuls, leur migration à travers le continent
    africain [...] est antérieure à l'islamisme, car aujourd'hui une grande partie de leur population
    est encore fétichiste.
- kind: translation
  label: Pratibha Translation
  body: As for the Peuls themselves, they hold themselves quite distinct and give as their cradle Founangui,
    the country of the east, which they left when the region no longer had enough pasture to feed their
    herds. Whatever the origin of the Peuls, their migration across the African continent is earlier than
    Islam, for today a great part of their population is still fetishist.
- kind: commentary
  label: Pratibha Commentary
  body: 'Origin is a pasture story, not a race story. Lasnet''s chapter opens with European fantasies
    — Egypt, a lost Roman legion — which this unit refuses. What the Fulɓe tell him is Founangui, the
    country of the east, left when the grass failed. The first displacement is already the law of unit
    3: the herd''s need decides the path. Self-account is not a skull-index. Self-account is: we were
    where the cattle could eat, and then we were not.


    "Earlier than Islam" (antérieure à l''islamisme) is the chronological claim that warrants the whole
