translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: D'après Reclus, leur culte primitif aurait été la boolâtrie et dans leur mahométisme actuel on
    peut encore relever beaucoup de coutumes qui témoignent de leurs anciennes pratiques. La propreté
    qu'ils observent dans leurs bouveries a quelque chose de religieux.
- kind: translation
  label: Pratibha Translation
  body: According to Reclus, their primitive cult appears to have been cattle-worship (boolâtrie), and
    in their present Islam many customs can still be read that witness to their ancient practices. The
    cleanliness they observe in their cattle-pens has something religious about it.
- kind: commentary
  label: Pratibha Commentary
