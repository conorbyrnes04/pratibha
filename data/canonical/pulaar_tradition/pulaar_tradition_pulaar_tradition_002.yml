unit_label: The Primitive Cult Was Cattle-Worship
title: The Primitive Cult Was Cattle-Worship
unit_type: teaching_passage
commentary: 'Pre-Islamic Pulaar religion is mostly visible as remainder. Reclus does not claim to have
  watched a Fulɓe cow-temple. He infers a prior cult from what Islam did not erase. Lasnet repeats the
  sentence almost verbatim in 1900, which tells you how thin the ethnographic file still was. There is
  no Gueno here, no initiation cave, no milk-cosmogony. There is a European -latry word, boolâtrie, coined
  from Latin bos on the model of idolâtrie, and then a concrete rite: the cattle-pen is kept as if it
  were a holy place.


  "Something religious" (quelque chose de religieux) in the cleanliness of the bouveries is the philosophical
  hinge. Hygiene can be merely practical. Reclus sees that it is not merely practical. The pen is where
  the cult-object lives. To keep it clean is to keep the relation intact. Conversion to Islam changes
  the Friday and the prayer-direction; it does not empty the pen of its older gravity. "Primitive" in
  1887 French is an evolutionary ranking. The usable sense is prior: the cattle-relation is older than
  the mosque, and still standing.


  Existentially the teaching is about what conversion does not convert. A new confession can rename the
  sky and still leave the daily shrine standing. If you want the pre-Islamic Pulaar world, do not start
  with a reconstructed myth. Start with the place that is still treated as if it were sacred: the enclosure
  of the herd.'
