- kind: key_terms
  label: Key Terms
  items:
  - term: boolâtrie
    definition: Reclus's coinage from Latin bos, ox, on the model of idolâtrie — a scholar's -latry, not
      a Pulaar autonym; idolatry of cows overstates images; the next clause (clean pens, surviving customs)
      is the actual content
  - term: bouveries
    definition: cattle-pens, byres — the built form of the cult; barn is too agricultural-European; this
      is the enclosure that still receives guests as a mark of respect
  - term: nagge
    definition: the cow as the being the pen is kept for — Pulaar does not need boolâtrie; it needs the
      clean enclosure of nagge
  - term: culte primitif
    definition: 'primitive cult — chronological claim: Islam is later; cattle-relation is earlier; primitive
      as ranking is refused, prior is kept'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hebrew mishkan, care of the holy enclosure
    resonance: Both treat the kept enclosure as a religious fact, not a shed.
    divergence: The tabernacle is portable because God dwells there; the Fulɓe pen is holy because the
      herd lives there.
  - citation: Shinto shrine sweeping
    resonance: Both locate reverence in cleanliness before any spoken doctrine.
    divergence: Shinto cleanliness has kami and a shrine lineage; Reclus has no named spirit of the pen
      — only something religious.
- kind: practice
  label: Practice (Abhyasa)
  body: Clean one place that keeps what you live from — kitchen, stall, desk, threshold — as if the cleanliness
    were already a rite. Do not add incense. Notice whether the care feels merely practical or whether
    it has something religious in it. That notice is the remnant.
