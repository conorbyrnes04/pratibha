translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Ce sont les besoins de leurs troupeaux qui déterminent leurs déplacements; quand les pâturages
    d'une région sont épuisés, ils vont plus loin et, si c'est nécessaire, changent plusieurs fois dans
    la même année.
- kind: translation
  label: Pratibha Translation
  body: It is the needs of their herds that determine their displacements. When the pastures of a region
    are exhausted, they go farther, and if necessary they change several times in the same year.
