unit_label: The Herd Decides the Path
title: The Herd Decides the Path
unit_type: teaching_passage
commentary: 'The world is not a map on which cattle are cargo. The world is a network of pasture, water,
  and milk, and human motion is a function of that network. "The needs of their herds determine their
  displacements" is a metaphysics of path. You do not choose a destination and then bring the cows. The
  cows'' thirst and hunger choose. Later Pulaar names the move egga, transhumance, and the camp wuro;
  Lasnet does not. He records the structure: the herd''s need is the law of motion.


  Changing several times in one year is not restlessness. It is fidelity to a living body that cannot
  eat last season''s grass. A sedentary spirituality will hear this as lack of place. The pastoral claim
  is the opposite: place is wherever the herd can still live. When the pasture is exhausted, staying is
  the betrayal. The path is not a pilgrimage toward a shrine. The path is the next water.


  Existentially the teaching is against a spirituality that leaves the body of the world unmanaged. If
  your path is only inward, the riverbank stays a cliff and the milk dries. Here the path is a decision
  the living make for you, and you honor it by moving. The later units on the ramp, the dummy calf, and
  affection greater than children are the same ontology told as single acts. This unit is the law those
  acts obey: the herd decides.'
