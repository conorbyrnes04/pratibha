- kind: key_terms
  label: Key Terms
  items:
  - term: besoins de leurs troupeaux
    definition: needs of their herds — the law of motion; economic necessity is true and too thin; Lasnet
      places this sentence inside mœurs, not inside a chapter on markets
  - term: egga
    definition: later Pulaar for transhumance — not in Lasnet; the structure he records is the herd's
      need as path
  - term: wuro
    definition: camp, the temporary human place that follows nagge rather than founding a town
  - term: déplacements
    definition: displacements — not travel-as-leisure; the group is a function of pasture
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśāvāsya Upaniṣad 1, īśā vāsyam idam sarvam
    resonance: Both refuse to treat the living world as dead property you arrange at will.
    divergence: The Upaniṣad covers the world with the Lord; this passage covers the path with the herd's
      need.
  - citation: Zhuāngzǐ, wandering
    resonance: Both prefer a mobile life that does not stockpile a single address as the real.
    divergence: Zhuāngzǐ's wandering is a freedom from fixed use; Fulɓe mobility in this source is bound
      to pasture and water.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you move today — house, job, opinion — ask what living need is actually choosing the displacement.
    Let that need, not the map, decide the next hour. If nothing living is choosing, you are moving as
    cargo, not as a herder.
