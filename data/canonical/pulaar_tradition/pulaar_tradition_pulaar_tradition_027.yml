pratibha_layers:
- kind: original
  label: Original
  body: Il ne conclut rien sans avoir longuement réfléchi et être sûr de son fait, n'hésitant pas d'ailleurs
    à rouler de son mieux ceux qui traitent avec lui.
- kind: translation
  label: Pratibha Translation
  body: He concludes nothing without having reflected at length and being sure of his ground — and he
    does not hesitate to get the better of those who deal with him.
- kind: commentary
  label: Pratibha Commentary
  body: 'Slowness is the ethic; "trickster" is the observer''s insult. Lasnet wants a character sketch:
    hypocrite, cunning, he will roll you if he can. Invert the slur. What the sentence actually teaches
    is a decision-rule: conclude nothing until you have reflected at length and are sure of your fact.
    A people who never confess wealth, never sell cows, and consult the mother before a great act will
