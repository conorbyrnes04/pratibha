- kind: key_terms
  label: Key Terms
  items:
  - term: longuement réfléchi
    definition: having reflected at length — the decision-rule; not cunning-as-vice
  - term: sûr de son fait
    definition: sure of his ground — the close-condition; haste is the real derogation
  - term: pulaaku
    definition: reserve of pace as well as of face — slowness as honor
  - term: conclut rien
    definition: concludes nothing — the never of speech in the market, kin to never confessing wealth
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic delay of assent
    resonance: Both refuse to conclude while the impression is still rushing you.
    divergence: Stoic delay is about inner judgments; this delay is about a bargain that could cost nagge.
  - citation: Confucian caution in speech and compact
    resonance: Both treat a hasty yes as a moral failure.
    divergence: Confucian caution is civic sincerity; Fulɓe caution is pastoral — the herd cannot be unsaid.
- kind: practice
  label: Practice (Abhyasa)
  body: Delay one conclusion today that you were about to make at someone else's pace — a purchase, a
    yes, a send. Reflect until you are sure of the fact. Then conclude, or refuse. Do not roll anyone.
    Be slow.
