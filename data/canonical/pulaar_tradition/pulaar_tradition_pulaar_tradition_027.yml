unit_label: Long Reflection Before Any Bargain
title: Long Reflection Before Any Bargain
unit_type: teaching_passage
commentary: 'Slowness is the ethic; "trickster" is the observer''s insult. Lasnet wants a character sketch:
  hypocrite, cunning, he will roll you if he can. Invert the slur. What the sentence actually teaches
  is a decision-rule: conclude nothing until you have reflected at length and are sure of your fact. A
  people who never confess wealth, never sell cows, and consult the mother before a great act will not
  close a bargain at the stranger''s tempo. The colonial officer experiences that slowness as fraud. The
  remnant experiences it as not being hurried off the path the herd already chose.


  "Sure of his fact" (sûr de son fait) is the complement of impassibility. At the threshold you do not
  complain. At the market you do not rush. Both are pulaaku: the face and the pace do not leak. Getting
  the better of a counterpart can become theft; refuse that as teaching. Keep the long reflection. A cattle-people
  whose wealth walks away if you guess wrong has reasons to be slow that a cash-trader does not share.


  Existentially the teaching is against the modern virtue of closing fast. If you conclude in order to
  seem decisive, you have already sold the cow. Reflect until you are sure. The stranger''s impatience
  is not a moral claim on you. It is his tempo. You are not required to adopt it.'
