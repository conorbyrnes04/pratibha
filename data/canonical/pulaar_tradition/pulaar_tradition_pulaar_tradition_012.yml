translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Pour les faire abreuver ils ne se contentent pas de les conduire vers les bords les moins escarpés,
    mais ils leur font une route en taillant un plan incliné de façon à faciliter l'accès de la rivière.
- kind: translation
  label: Pratibha Translation
  body: To water them they do not merely lead them to the least steep banks; they cut them a road, carving
    a ramp so the river can be reached.
- kind: commentary
  label: Pratibha Commentary
  body: 'Affection that will not cut the bank is sentiment. The Fulɓe rite in this sentence is earthwork.
