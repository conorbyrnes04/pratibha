unit_label: Cut a Ramp So the Cattle Can Drink
title: Cut a Ramp So the Cattle Can Drink
unit_type: teaching_passage
commentary: 'Affection that will not cut the bank is sentiment. The Fulɓe rite in this sentence is earthwork.
  They do not wait for a gentle slope to appear. They make a road (ils leur font une route) by carving
  an inclined plane so the cattle can drink. The river is there. Access is not. Care is the difference
  between a cliff and a path. This is liturgy in soil: the sacred-economic body of the herd must reach
  water, and the human task is to remove the unnecessary steepness.


  "They do not content themselves" (ils ne se contentent pas) is the moral verb. The easy piety would
  be to lead the animals to the least bad bank and call it enough. The remnant cult does more. It alters
  the land so the dependent life can drink without injury. Engineering is the wrong European word if it
  means a project detached from love. This is how affection looks when it has tools.


  Existentially the teaching is against a care that stays in feeling. If a being you claim to serve cannot
  reach what it needs, your affection is a report, not a rite. Cut the ramp. The path-unit said the herd
  decides the displacement. This unit says you still have to make the last yards possible with your hands.'
