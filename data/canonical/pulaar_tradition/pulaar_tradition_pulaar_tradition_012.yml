- kind: key_terms
  label: Key Terms
  items:
  - term: plan incliné
    definition: the carved ramp to water — a made path for the sacred-economic body of the herd; engineering
      misses that this is how affection looks when it has tools
  - term: abreuver
    definition: to water the herd — the verb of the rite; not a chore appended to religion; the religion
      is this verb
  - term: faire une route
    definition: to make them a road — the cattle are given a way, not merely driven to a brink
  - term: nagge
    definition: the drinkers for whom the bank is cut — the cult-object as a body that thirsts
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isaiah 40:3–4, make straight a highway
    resonance: Both treat path-making as a religious act, not mere travel logistics.
    divergence: Isaiah prepares a road for God; the Fulɓe cut a road for the herd — the cult-object is
      the thirsty animal, not the arriving Lord.
  - citation: Daoist wuwei and the low water
    resonance: Both honor water as the place life must reach.
    divergence: Wuwei prefers not to force the bank; this remnant forces the bank so the cattle are not
      forced.
- kind: practice
  label: Practice (Abhyasa)
  body: Remove one unnecessary steepness between a dependent life and water, food, rest, or you. A form,
    a step, a locked door, a delayed reply. Cut one ramp today. Do not announce it as kindness. Let the
    easier access be the whole of the act.
