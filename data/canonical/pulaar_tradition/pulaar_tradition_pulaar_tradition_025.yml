- kind: key_terms
  label: Key Terms
  items:
  - term: gourbis
    definition: straw shelters of movable mats — the house as a thing women make and the group can leave
  - term: abandonnent complètement
    definition: abandon completely — fidelity to the herd, not failure at housing
  - term: besoins de leurs troupeaux
    definition: needs of their herds — the same law that decides the path now decides the walls
  - term: wuro
    definition: later Pulaar camp — the human place that follows nagge; not in Lasnet; the structure is
      this abandonment
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hebrew mishkan, the portable dwelling
    resonance: Both refuse to let holiness require a permanent house.
    divergence: The tabernacle is portable because God travels; the Fulɓe hut is leavable because the
      herd travels.
  - citation: Daoist unfixed dwelling
    resonance: Both prefer a life that can be set down.
    divergence: Zhuāngzǐ's unfixedness is freedom from use; this unfixedness is obedience to pasture.
- kind: practice
  label: Practice (Abhyasa)
  body: Abandon one installation today that you have been maintaining out of habit — a folder, a corner,
    a plan that no longer feeds what you actually keep alive. Leave it completely. Rebuild the needed
    piece farther on, lighter.
