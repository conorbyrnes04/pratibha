translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Les Peuls étant nomades et se déplaçant suivant les besoins de leurs troupeaux n'ont guère d'installation
    bien définitive ; leurs cases sont des paillottes rondes [...] souvent ce sont de simples gourbis
    en paille faits de paillassons mobiles fabriqués par les femmes ; lorsqu'ils se déplacent, ils les
    abandonnent complètement et vont reconstruire plus loin.
- kind: translation
  label: Pratibha Translation
  body: The Peuls, being nomads and moving according to the needs of their herds, have almost no lasting
    installation. Their huts are round straw houses; often they are simple straw shelters of movable mats
    made by the women. When they move, they abandon them completely and go rebuild farther on.
- kind: commentary
  label: Pratibha Commentary
