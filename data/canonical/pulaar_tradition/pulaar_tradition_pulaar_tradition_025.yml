unit_label: The House Is Left Behind
title: The House Is Left Behind
unit_type: teaching_passage
commentary: 'The house is not the shrine. The herd is. When the pasture fails, the hut is abandoned completely
  (ils les abandonnent complètement) and built again farther on. Women make the mats; the mats move or
  are left. Lasnet notes that in Futa Jallon, where the land can feed the cattle without displacement,
  one finds thick-walled houses and verandas. Settlement is the exception that proves the law: when the
  herd does not force a path, the house may thicken. When the herd forces a path, the house is straw.


  This is the architectural form of unit 3. A spirituality that confuses the sacred with real estate will
  hear abandonment as poverty. The remnant cult hears it as fidelity. You do not owe the walls a vigil
  if the animals cannot eat. Villages are clean and undefended — Lasnet says they present no defense —
  because the wealth can walk and the shrine is not a granary you must fortify. The clean pen, not the
  hut, is the place that has something religious in it.


  Existentially the teaching is: leave the room that no longer feeds the life you serve. People stay in
  houses, jobs, and identities out of respect for walls. The Fulɓe sentence is colder and kinder. Abandon
  the hut. Rebuild farther on. The cult walked first.'
