- kind: key_terms
  label: Key Terms
  items:
  - term: satigui
    definition: old title of the Futa Toro Fulɓe chief, before El Hadj Omar — a political name the jihad
      suppressed; the district pair outlived it
  - term: ardo
    definition: the political-military office each tribe kept after the satigui was abolished
  - term: tamsir
    definition: the religious office kept beside the ardo — the other half of what the high title could
      not take with it
  - term: El Hadj Omar
    definition: ʿUmar Tall — the reformer after whom the satigui no longer stands; used here only to date
      the older title, not to teach his law
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Israel after the last judge, before the kings
    resonance: Both remember a political form older than the later central office.
    divergence: Israel's memory becomes kingship; Futa Toro's satigui is suppressed and the older pair
      (ardo, tamsir) remains.
  - citation: Japanese tennō and shogun
    resonance: Both show a high name that can recede while working offices continue.
    divergence: The tennō remains as symbol; the satigui is abolished. The Fulɓe remainder is the tribal
      pair, not an empty throne.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one title you have already lost — a job, a role, a reputation. Today, keep the work the title
    used to name, without the name. Do not rebuild the crown. Keep the pair of acts the crown was covering.
