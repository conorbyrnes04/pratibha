unit_label: Satigui Before El Hadj Omar
title: Satigui Before El Hadj Omar
unit_type: teaching_passage
commentary: 'A title can die and the pair of offices remain. Satigui is the old name of the Futa Toro
  chief, older than the jihad of El Hadj Omar (ʿUmar Tall). Lasnet is careful: well before. The 1913 chronicle
  of Siré-Abbâs-Soh, used here only for social form, remembers the same depth — a Fulɓe political name
  that Islam later overwrote. The function was suppressed. What was not suppressed is the tribal pair:
  ardo and tamsir, with village chiefs under them. Conversion can remove a crown and still leave the district
  grammar standing.


  Heredity and first caste are Lasnet''s colonial ranking of a pastoral aristocracy. Do not teach caste-contempt
  as the lesson. The usable claim is continuity under a new confession. The satigui is gone. The ardo
  is not. A people whose remaining cult is the herd will keep the offices that still serve motion, counsel,
  and the sacred even when the highest title has been abolished by a reformer. The chronicle is not used
  here for Islamic law. It is used for this fact of form: names change; the pair remains.


  Existentially the teaching is about what you keep when a reform erases your favorite title. If the only
  thing that made you a people was the high name, the reform wins. If you still have an ardo and a tamsir
  — a force and a meaning, a move and a counsel — the people are not gone. Let the satigui die. Keep the
  pair.'
