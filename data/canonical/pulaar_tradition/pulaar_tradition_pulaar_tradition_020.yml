pratibha_layers:
- kind: original
  label: Original
  body: Le chef des Peuls du Fouta-Toro portait autrefois le titre de satigui, bien avant El Hadj Omar,
    sa fonction a été supprimée ; chaque tribu a conservé son ardo et son tamsir, les chefs de village
    sont sous leurs ordres ; ces fonctions sont devenues héréditaires et ne peuvent sortir de la première
    caste.
- kind: translation
  label: Pratibha Translation
  body: The chief of the Peuls of Futa Toro formerly bore the title satigui, well before El Hadj Omar;
    his office has been suppressed. Each tribe has kept its ardo and its tamsir; the village chiefs are
    under their orders. These offices have become hereditary and cannot leave the first caste.
