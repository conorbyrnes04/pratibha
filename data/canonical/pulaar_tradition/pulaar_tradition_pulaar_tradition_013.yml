  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Quand une vache a perdu son veau, pour que son lait ne tarisse point ils font un mannequin avec
    la peau de l'animal et n'hésitent pas à la téter eux-mêmes.
- kind: translation
  label: Pratibha Translation
  body: When a cow has lost her calf, so that her milk will not dry they make a dummy from the animal's
    skin and do not hesitate to suckle her themselves.
- kind: commentary
  label: Pratibha Commentary
