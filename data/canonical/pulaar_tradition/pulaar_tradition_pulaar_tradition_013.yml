- kind: key_terms
  label: Key Terms
  items:
  - term: mannequin
    definition: calf-skin dummy to keep milk flowing — a stand-in that preserves relation after death;
      not an idol; an anti-drying rite
  - term: lait
    definition: milk — life as a flow that can tarry or dry; the remnant cult is a technology against
      drying
  - term: tarisse
    definition: dry up — the danger the rite answers; a closed udder is a closed shrine
  - term: nagge
    definition: the cow whose gift must not stop — the cult-object as a body that can refuse if the relation
      is broken
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Egyptian opening-of-the-mouth for the dead
    resonance: Both use a device so a life-function does not stop at a death.
    divergence: The Egyptian rite opens the dead to eat in the next world; this Fulɓe rite keeps the living
      cow giving in this one.
  - citation: Serer first-fruits of milk (this corpus)
    resonance: Both treat milk as a religious good, not only a food.
    divergence: Serer milk is poured to spirits; this milk is kept flowing by a skin-stand-in after a
      calf's death.
- kind: practice
  label: Practice (Abhyasa)
  body: Where a gift in your life is drying because its first recipient is gone — a skill no one asks
    for, a care with no obvious home — make one honest stand-in today so the gift can still move. Do not
    wait for the original form to return.
