unit_label: The Dummy Calf-Skin Keeps the Milk
title: The Dummy Calf-Skin Keeps the Milk
unit_type: teaching_passage
commentary: 'Death is not allowed to stop the relation. The calf has died. The cow''s body is about to
  close. The remnant cult answers with a device: a mannequin of the calf''s own skin, and if needed the
  herder''s mouth where the calf''s mouth was. The dummy is not a fetish that one worships. It is a stand-in
  that keeps milk, which is life, from drying because a particular body has gone. Pre-Islamic Pulaar practice,
  as this passage can recover it, is full of such devices. They look like husbandry. They are husbandry
  as cult.


  "So that her milk will not dry" (pour que son lait ne tarisse point) is the purpose-clause that makes
  the act philosophical. The aim is not to deny death and not to harvest a resource from a grieving animal
  as if grief were nothing. The aim is continuity of the gift. Milk is how the herd feeds the camp. A
  dried cow is a closed shrine. The skin-dummy is an anti-drying rite: keep the cow in relation after
  the calf is gone.


  Existentially the teaching is against a piety that abandons a relation when its first form dies. When
  the obvious recipient is gone, do you let the gift dry, or do you make a stand-in honest enough that
  the source can still give? The dummy is strange. The drying is worse. Lasnet''s "they do not hesitate"
  is his shock. The herder''s lack of hesitation is the ethic: dignity is keeping the milk, not keeping
  your mouth unused.'
