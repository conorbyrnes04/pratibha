pratibha_layers:
- kind: original
  label: Original
  body: Économe et défiant, il n'avoue jamais sa richesse par crainte d'être volé ; très hypocrite et
    très retors, il ne conclut rien sans avoir longuement réfléchi et être sûr de son fait.
- kind: translation
  label: Pratibha Translation
  body: Thrifty and wary, he never confesses his wealth for fear of being robbed. He concludes nothing
    without having reflected at length and being sure of his ground.
