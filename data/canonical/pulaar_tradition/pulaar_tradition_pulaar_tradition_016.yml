- kind: key_terms
  label: Key Terms
  items:
  - term: n'avoue jamais sa richesse
    definition: never confesses his wealth — reserve as pastoral law, not hypocrisy; the observer's slur
      is refused
  - term: pulaaku
    definition: the honor-code of reserve — later name for the face that does not display the herd
  - term: défiant
    definition: wary, distrustful — Lasnet's temperament-word; the usable sense is that the cult-object
      is not public information
  - term: longuement réfléchi
    definition: having reflected at length — the other half of the sentence; silence plus slowness, not
      cunning-as-vice
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 6:3–4, do not let the left hand know
    resonance: Both refuse the public confession of the good you hold.
    divergence: Matthew hides alms from praise; this Fulɓe silence hides the herd from seizure — same
      reserve, different predator.
  - citation: Stoic inner citadel
    resonance: Both treat the inner count as not owed to the forum.
    divergence: The Stoic hides judgments; the Fulɓe herder hides cows. One is a soul-practice; the other
      is a people-practice around nagge.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when asked how much you have — money, plans, progress — give no number. Keep one real good
    unspoken. Notice the itch to avow. That itch is the stranger already inside the camp.
