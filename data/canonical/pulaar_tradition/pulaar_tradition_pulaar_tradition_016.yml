unit_label: Do Not Confess Wealth
title: Do Not Confess Wealth
unit_type: teaching_passage
commentary: 'Do not confess the herd. Lasnet''s next words are hypocrite and trickster — observer-error.
  What he actually saw is a refuse of display. A pastoral people whose wealth is walking animals does
  not owe a census to the stranger, the taxer, or the raider. "He never avows his wealth" (il n''avoue
  jamais sa richesse) is pulaaku as economy: reserve is not a lie about the world; it is a refusal to
  make the cult-object into a target. Fear of being robbed is the practical clause. The philosophical
  clause is never: wealth that must be spoken is already half lost.


  The slur hypocrite is what a colonial officer calls a man who will not open his ledger. The usable teaching
  is the long reflection before any conclusion, and the silence about the count of cows. Bridewealth is
  named in cows inside the alliance. The market is told only about oxen. The stranger is told nothing.
  These are not three ethics. They are one grammar of what may be said about nagge.


  Existentially the teaching is against the modern duty to narrate your assets — followers, income, attainments
  — as if silence were fraud. Some silences are the remaining cult. If you cannot keep a number unspoken,
  you have no herd, only a shop-window. Reflect long. Conclude when you are sure. Do not confess the count.'
