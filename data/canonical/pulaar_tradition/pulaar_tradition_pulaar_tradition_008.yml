unit_label: Greet the Dead with Green Leaves
title: Greet the Dead with Green Leaves
unit_type: teaching_passage
commentary: 'The dead remain addressable, and the correct address from a pastoral people is green plant-matter
  thrown in passing. Lasnet wants this to be generic Islam: respect, tombs, the eastward face of the grave.
  The specific gesture is not generic. A handful of herbes or feuilles vertes is what you would give a
  living herd. The greeting to the dead is forage. The ancestor is still, in the remnant logic, a being
  who can be met on the road and who understands the gift of grass.


  "In passing" (en passant) matters. This is not a festival of the dead and not a sacrifice that stops
  the caravan. Mobility continues; relation continues inside mobility. Nomad respect cannot always be
  a vigil at a fixed grave. It can be a toss of green as you go by. The dead do not require you to become
  sedentary. They require that you not pass them as if they were stones.


  Existentially the teaching is a correction to both amnesia and ostentation. You do not have to build
  a shrine at every loss. You do have to refuse to walk past the dead as scenery. Give them something
  living and green, and keep moving. That is pastoral piety. The next unit on sacrilege is the negative
  of this greeting: what you must not do to a tomb is the other face of the same address.'
