- kind: key_terms
  label: Key Terms
  items:
  - term: poignée d'herbes ou de feuilles vertes
    definition: handful of grass or green leaves — forage as greeting; flowers on a grave is the nearest
      European picture and still too garden; this is pasture thrown to the dead
  - term: salut
    definition: 'greeting, salute — the dead are met as persons on the road; offering is true; greeting
      is more exact: you acknowledge, you do not bargain'
  - term: trépassés
    definition: those who have passed over — the dead as having gone a way, not as having become nothing;
      the same root of passage as the travelers who greet them
  - term: en voyage
    definition: on a journey — the rite belongs to mobility; a sedentary memorial mass is another religion's
      tempo
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Serer speaking into the ear of the dead (this corpus)
    resonance: Both refuse to treat the corpse-side of the world as mute.
    divergence: Serer speech is intimate and at the body; Fulɓe greeting is a toss of green from the road.
  - citation: Homeric choai, drink-offerings to the dead
    resonance: Both give the dead a portion of the living world's goods.
    divergence: Greek libation is wine and blood at a pit; this portion is pasture.
- kind: practice
  label: Practice (Abhyasa)
  body: On one walk today, when you pass a cemetery, a roadside memorial, or even a tree that marks a
    death you know, do not pass as if it were scenery. Stop long enough to set down something green —
    a leaf, a blade of grass. Greet, do not speechify, and go on.
