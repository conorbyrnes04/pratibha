translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Chaque fois que des Peuls en voyage rencontrent une tombe ou un cimetière, ils jettent en passant
    une poignée d'herbes ou de feuilles vertes, sorte de salut qu'ils adressent aux trépassés.
- kind: translation
  label: Pratibha Translation
  body: Every time Peuls on a journey meet a tomb or a cemetery, they throw as they pass a handful of
    grass or green leaves. It is a kind of greeting they address to those who have gone over.
- kind: commentary
  label: Pratibha Commentary
  body: 'The dead remain addressable, and the correct address from a pastoral people is green plant-matter
    thrown in passing. Lasnet wants this to be generic Islam: respect, tombs, the eastward face of the
