- kind: key_terms
  label: Key Terms
  items:
  - term: mœurs de bergers
    definition: manners of shepherds — Lasnet's distinction-word; occupational and liturgical, not racial
  - term: s'en font aimer
    definition: make themselves loved — the success-condition of knowing; the herd answers
  - term: sans cesse au milieu
    definition: always in the midst — knowledge as presence, not as periodic inspection
  - term: nagge
    definition: the beings whose love is the measure of the herder's knowledge
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 10:14, I know my own and my own know me
    resonance: Both make knowing and being known the definition of the shepherd.
    divergence: The Gospel's shepherd is the Christ; this shepherd is a Fulɓe herder whose cult-object
      is the herd itself.
  - citation: Upaniṣadic tat tvam asi as recognition
    resonance: Both treat real knowledge as a two-way identity, not a catalogue.
    divergence: The Upaniṣad recognizes the Self; this sentence recognizes the cow as a being that can
      love you back.
- kind: practice
  label: Practice (Abhyasa)
  body: Spend one uninterrupted hour in the midst of a life you claim to know — a person, an animal, a
    work. Do not improve it. See whether you are wanted there. If not, change the hands, not the story.
