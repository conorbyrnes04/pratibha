unit_label: They Make Themselves Loved
title: They Make Themselves Loved
unit_type: teaching_passage
commentary: 'Knowledge here is not a list of marks on the ear. It is a life spent in the midst (sans cesse
  au milieu) until the animals love you back. Lasnet''s first philosophical sentence on Peul manners is
  this: they are shepherds, they know, they are loved. Distinction is occupational and relational, not
  anatomical. The physical-anthropology pages that follow in his book are skipped as contempt. This sentence
  is kept as teaching. To know admirably is already a rite. To be loved by the known is the rite''s success.


  "Make themselves loved" (s''en font aimer) puts agency on the herder without making the cow an object.
  You can fail at this. You can live in the midst and still not be loved, if you are only a driver. The
  remnant cult is the opposite of driving. It is a two-way recognition: the human knows the animal; the
  animal accepts the human. Boolâtrie without this clause would be a European word for stock-breeding.
  With this clause it is a relation.


  Existentially the teaching is that mastery without being loved is only control. If the lives you claim
  to know do not want you near them, you do not know them yet. Stay in the midst longer. Change your hands.
  Do not add a theory of shepherdhood on top of a relation that has not yet answered.'
