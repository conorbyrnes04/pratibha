translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Les Peuls se distinguent des autres races de l'Afrique par leurs mœurs de bergers. Sans cesse
    au milieu de leurs troupeaux, ils les connaissent admirablement et s'en font aimer.
- kind: translation
  label: Pratibha Translation
  body: The Peuls distinguish themselves from the other peoples of Africa by their manners as shepherds.
    Always in the midst of their herds, they know them admirably and make themselves loved by them.
- kind: commentary
  label: Pratibha Commentary
  body: 'Knowledge here is not a list of marks on the ear. It is a life spent in the midst (sans cesse
    au milieu) until the animals love you back. Lasnet''s first philosophical sentence on Peul manners
    is this: they are shepherds, they know, they are loved. Distinction is occupational and relational,
    not anatomical. The physical-anthropology pages that follow in his book are skipped as contempt. This
    sentence is kept as teaching. To know admirably is already a rite. To be loved by the known is the
    rite''s success.


    "Make themselves loved" (s''en font aimer) puts agency on the herder without making the cow an object.
    You can fail at this. You can live in the midst and still not be loved, if you are only a driver.
    The remnant cult is the opposite of driving. It is a two-way recognition: the human knows the animal;
