sanskrit_devanagari: Sans cesse au milieu de leurs troupeaux, ils les connaissent admirablement et s'en font aimer, d'ailleurs
  ils ont pour eux une véritable affection, plus grande souvent que pour leurs propres enfants; pour les faire abreuver ils
  ne se contentent pas de les conduire vers les bords les moins escarpés, mais ils leur font une route en taillant un plan
  incliné de façon à faciliter l'accès de la rivière; quand une vache a perdu son veau, pour que son lait ne tarisse point
  ils font un mannequin avec la peau de l'animal et n'hésitent pas à la téter eux-mêmes. Ce sont les besoins de leurs troupeaux
  qui déterminent leurs déplacements.
sanskrit_iast: 'Not applicable. The practice-terms are French ethnographic: *troupeaux*, *plan incliné*, *mannequin* of calf-skin.
  Later Pulaar pastoral vocabulary (*egga*, transhumance; *wuro*, camp) is not in Lasnet; the structure is: the herd''s need
  is the law of motion.'
translation_literal: Always in the midst of their herds, they know them admirably and make themselves loved by them; they
  have for the animals a true affection, often greater than for their own children. To water them they do not merely lead
  them to the least steep banks; they cut them a road, carving a ramp so the river can be reached. When a cow has lost her
  calf, so that her milk will not dry they make a dummy from the animal's skin and do not hesitate to suckle her themselves.
  It is the needs of their herds that determine their displacements.
commentary: 'The claim is cosmological in the only form the 1900 source can state it: the world is not a map on which cattle
  are cargo. The world is a network of pasture, water, and milk, and human motion is a function of that network. "The needs
  of their herds determine their displacements" is a metaphysics of path. You do not choose a destination and then bring the
  cows. The cows'' thirst and hunger choose, and you cut the bank so they can drink.


  The scandal sentence — affection often greater than for children — is colonial sensationalism and also a real ranking of
  care. Lasnet wants you to gasp. The philosophical reading is colder: in a pastoral ontology the herd is the continuing body
  of the group. Children matter; the herd is how children eat. Cutting a ramp into a riverbank is liturgy in earth. The calf-skin
  dummy is liturgy in skin: a refusal to let milk, which is life, stop because a particular calf has died. The dummy is not
  a fetish that one worships. It is a device that keeps the cow in relation. Pre-Islamic Pulaar practice, as this passage
  can recover it, is full of such devices. They look like husbandry. They are husbandry *as* cult.


  Existentially the teaching is against a spirituality that leaves the body of the world unmanaged. If your "path" is only
  inward, the riverbank stays a cliff and the milk dries. Here the path is a ramp you cut with your hands.


  Key Terms:


  **besoins de leurs troupeaux** - "needs of their herds" -> the law of motion -> "economic necessity" is true and too thin;
  Lasnet places this sentence inside *mœurs*, not inside a chapter on markets.


  **plan incliné** - the carved ramp to water -> a made path for the sacred-economic body of the herd -> "engineering" misses
  that this is how affection looks when it has tools.


  **mannequin** - calf-skin dummy to keep milk flowing -> a stand-in that preserves relation after death -> not an idol; an
  anti-drying rite.


  **affection véritable** - "true affection" -> Lasnet''s word for a love that outranks even children in his ranking -> do
  not moralize it as cruelty to children; read it as the herd being the group''s ongoing life.


  Cross-Tradition Resonances:


  **Īśāvāsya Upaniṣad 1 (*īśā vāsyam idam sarvam*):** Both refuse to treat the living world as dead property.

  *Divergence:* The Upaniṣad covers the world with the Lord; this passage covers the path with the herd''s need.


  **Christian Good Shepherd:** Both make care of the flock the image of right relation.

  *Divergence:* The Gospel metaphor points past sheep to persons; Lasnet''s Fulɓe point *at* the cattle as the actual center
  of care.


  **Zhuāngzǐ''s butcher Ding:** Both locate mastery in knowing a living body''s grain so well that action becomes easy.

  *Divergence:* Ding''s ox is already for the blade; the Fulɓe ox is for continued life, milk, and motion.'
insight: 'The claim is cosmological in the only form the 1900 source can state it: the world is not a map on which cattle
  are cargo.'
practice: 'Before you move today — house, job, opinion — ask what living need is actually choosing the displacement. If you
  can, cut one "ramp": remove one unnecessary steepness between a dependent life and water, food, rest, or you. Let the need,
  not the map, decide the next hour.'
