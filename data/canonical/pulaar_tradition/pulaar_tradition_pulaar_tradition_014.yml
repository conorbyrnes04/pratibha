- kind: key_terms
  label: Key Terms
  items:
  - term: veaux ni des vaches
    definition: calves nor cows — the unsaleable reproductive body of the herd; oxen are the only licit
      market flesh
  - term: bœufs
    definition: oxen — the surplus male who may leave; not the mother, not the young
  - term: affection ... intérêt
    definition: affection and interest — Lasnet's pair; do not split them; the cult and the economy are
      one refusal
  - term: nagge
    definition: the cow who does not go to market — the same being bridewealth names and sale is forbidden
      to take
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vedic prohibition on selling the cow of the household
    resonance: Both mark the reproductive cow as outside ordinary trade.
    divergence: Vedic unsaleability is often priestly and hymnic; this rule is a market sentence spoken
      over Fulɓe stalls.
  - citation: Hebrew firstlings and the unsacrificed dam
    resonance: Both distinguish the young and the mother from what may be alienated.
    divergence: Biblical law is theistic command; this never is affection-and-interest as a single pastoral
      law.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one thing you will not sell — a tool, a promise, a living tie, an hour. Keep the refusal
    today when a convenient offer appears. If you cannot name a never, you are living as if you had only
    oxen and no cows.
