pratibha_layers:
- kind: original
  label: Original
  body: Dans leurs marchés ils ne se défont que des bœufs, jamais des veaux ni des vaches, autant d'ailleurs
    par affection que par intérêt, car ils sont très attachés à leurs animaux.
- kind: translation
  label: Pratibha Translation
  body: In their markets they part only with oxen, never with calves or cows. They do this as much from
    affection as from interest, for they are deeply attached to their animals.
- kind: commentary
  label: Pratibha Commentary
  body: 'The market is allowed a surplus male. It is not allowed the reproductive body. Calves and cows
    do not leave. Oxen may. Lasnet sees both affection and interest and, for once, does not force you
    to choose. The two are the same structure: the herd''s future is not merchandise. What can be sold
    is what the cult can spare without drying the source. A people whose remaining cult is the herd will
    have a market ethic that looks like stubbornness to a trader and like liturgy to anyone who has read
    the boolâtrie sentence.


    "Never" (jamais) is the philosophical word. Not rarely, not unless the price is high. The cow and
    the calf are outside the bargain. Bridewealth can name fifteen cows; the market cannot take a cow.
