unit_label: Never Sell Calves or Cows, Only Oxen
title: Never Sell Calves or Cows, Only Oxen
unit_type: teaching_passage
commentary: 'The market is allowed a surplus male. It is not allowed the reproductive body. Calves and
  cows do not leave. Oxen may. Lasnet sees both affection and interest and, for once, does not force you
  to choose. The two are the same structure: the herd''s future is not merchandise. What can be sold is
  what the cult can spare without drying the source. A people whose remaining cult is the herd will have
  a market ethic that looks like stubbornness to a trader and like liturgy to anyone who has read the
  boolâtrie sentence.


  "Never" (jamais) is the philosophical word. Not rarely, not unless the price is high. The cow and the
  calf are outside the bargain. Bridewealth can name fifteen cows; the market cannot take a cow. The difference
  is that bridewealth keeps nagge inside the alliance of households, while sale to Sarakole, Tukulor,
  or Wolof speculators sends her out of the people. The ox can go. The mother-line of the herd cannot.


  Existentially the teaching is about what you will not monetize. Everyone has a market. The question
  is whether anything in your life is marked never. If everything is for sale at the right price, you
  have no remaining cult. Affection and interest here are not two motives. They are one refusal: the source-body
  stays.'
