- kind: key_terms
  label: Key Terms
  items:
  - term: ardo
    definition: Pulaar political-military chief of a district — named by the almamy; not a generic chief;
      the force-office of the pair
  - term: tamsir
    definition: religious chief of a district — Lasnet's tamsir / tamsii; the speech-office beside the
      ardo
  - term: almamy
    definition: imam-head of the theocratic republic — holds both powers at the top but must take the
      opinion of elders
  - term: anciens et notables
    definition: elders and notables — the counsel the almamy is not free to skip
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Roman consuls and pontifex
    resonance: Both split or pair force with sacred speech so one mouth is not the whole city.
    divergence: Rome's pair is civic and priestly in a written constitution; ardo and tamsir are district
      offices under an almamy who still hears elders.
  - citation: Confucian wang and shi
    resonance: Both refuse to let military command be the only authority.
    divergence: The Chinese pair is king and scholar-ritualist; the Fulɓe pair is pastoral-military ardo
      and religious tamsir in a cattle republic.
- kind: practice
  label: Practice (Abhyasa)
  body: 'On one decision today, split the office: let one person (or one hour) handle the force of the
    act, and another handle what the act means. Do not let a single mood be both ardo and tamsir. Take
    one elder''s opinion before you close.'
