translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Les grandes agglomérations de Peuls sont organisées, comme au Fouta-Djallon, en républiques théocratiques
    ayant à leur tête un almamy qui exerce le pouvoir temporel et religieux en prenant l'opinion des anciens
    et des notables ; chaque district a un chef politique et militaire, ardo, et un chef religieux, tamsir,
    nommés par l'almamy.
- kind: translation
  label: Pratibha Translation
  body: The great Peul agglomerations are organized, as in Futa Jallon, into theocratic republics headed
    by an almamy who exercises temporal and religious power while taking the opinion of the elders and
    notables. Each district has a political and military chief, ardo, and a religious chief, tamsir, named
    by the almamy.
- kind: commentary
  label: Pratibha Commentary
  body: 'Power here is split on purpose. The almamy holds both temporal and religious office at the top,
    but he takes the opinion of elders, and under him the district is two offices: ardo (political, military)
    and tamsir (religious). Lasnet is describing the imamate as he found it. The usable social form is
    older than the particular Islamic titles: a cattle-people will not let one man be the only mouth.
    The herd decides the path; the people decide by pairing force with speech about the sacred.


    Ardo is the Pulaar word the source actually names. It is not a generic chief. It is the political-military
    office of a district, still standing after the satigui of Futa Toro was suppressed. Tamsir (Lasnet''s
    tamsir / tamsii) is the religious counterpart. The pair is the teaching. A cult of the herd that has
