unit_label: Ardo and Tamsir
title: Ardo and Tamsir
unit_type: teaching_passage
commentary: 'Power here is split on purpose. The almamy holds both temporal and religious office at the
  top, but he takes the opinion of elders, and under him the district is two offices: ardo (political,
  military) and tamsir (religious). Lasnet is describing the imamate as he found it. The usable social
  form is older than the particular Islamic titles: a cattle-people will not let one man be the only mouth.
  The herd decides the path; the people decide by pairing force with speech about the sacred.


  Ardo is the Pulaar word the source actually names. It is not a generic chief. It is the political-military
  office of a district, still standing after the satigui of Futa Toro was suppressed. Tamsir (Lasnet''s
  tamsir / tamsii) is the religious counterpart. The pair is the teaching. A cult of the herd that has
  entered Islam does not become a single sword. It becomes a two-headed district under an almamy who must
  still hear the anciens.


  Existentially the teaching is against the fantasy of the solitary founder. If you hold both the sword
  and the prayer in one person and will not take anyone''s opinion, you are not more traditional than
  the Fulɓe imamate. You are less. Split the office. Hear the elders. Name an ardo for the move and a
  tamsir for the meaning.'
