pratibha_layers:
- kind: original
  label: Original
  body: De l'accord unanime des indigènes interrogés à cet égard, il résulte que c'est l'ancêtre du clan
    qui aurait institué ce nom et cet interdit et aurait solennellement transmis l'un et l'autre à tous
    ses descendants à venir. Ailleurs, par exemple chez les Peuls, on opposera les Dialloubé aux Hanhanbé,
    c'est-à-dire les gens du clan Diallo aux gens du clan Kan. Les diverses langues en usage dans l'Afrique
    noire désignent en général le nom de clan par une expression que l'on pourrait traduire par « terme
    honorifique » ou « titre de noblesse », comme diamou (ce qui grandit) en mandingue ou yettôdé (ce
    qui honore) en peul. L'interdit a été institué par l'ancêtre en même temps que le nom de clan.
- kind: translation
  label: Pratibha Translation
  body: By the unanimous agreement of those questioned on this point, it is the ancestor of the clan who
    instituted this name and this prohibition and solemnly transmitted both to all descendants to come.
    Among the Peuls, for example, one opposes the Dialloubé to the Hanhanbé — the people of clan Diallo
    to the people of clan Kan. The languages of Black Africa generally call the clan name by an expression
    one might translate as "honorific term" or "title of nobility," such as diamou ("that which enlarges")
    in Manding or yettôdé ("that which honors") in Peul. The prohibition was instituted by the ancestor
    at the same time as the clan name.
- kind: commentary
  label: Pratibha Commentary
