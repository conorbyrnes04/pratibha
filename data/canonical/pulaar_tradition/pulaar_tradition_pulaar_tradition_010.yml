unit_label: The Clan Honor-Name and the Ancestor's Interdit
title: The Clan Honor-Name and the Ancestor's Interdit
unit_type: teaching_passage
commentary: 'Identity is a double gift from an ancestor: a name that honors, and a prohibition that binds.
  Delafosse is writing a pan-West-African theory; he pauses on the Fulɓe because they illustrate the structure
  without always wearing the clan name as a surname in daily address. You still say Dialloubé against
  Hanhanbé when you need to name a people. Yettôdé means "that which honors." To call someone by the clan
  name is to say they have known ancestors. The interdit is not a random food taboo. It is usually the
  species that saved the ancestor, or the object bound up with the founding escape. You do not eat or
  harm what saved the one who made you a people.


  This is the pre-Islamic Fulɓe social cosmology that the cattle-cult units do not yet reach. Herds explain
  motion, milk, and bridewealth. Clan interdit explains why the human group is not just a herd of humans.
  An ancestor acted, was saved, named the name, and laid a forever-avoidance on the descendants. Islam
  can add a silsila of marabouts; it does not have to erase Diallo and Kan. The 1913 Futa chronicle is
  used here only for this social form, not for Islamic law. The remainder is kinship as liturgy.


  Existentially the teaching is that you are not a self-invented individual with preferences. You are
  a descendant under a name and under a refusal. The refusal is the more philosophical half. Anyone can
  wear a proud name. The interdit is the name''s cost: there is a living kind you will not destroy, because
  your ancestor''s life came through it.'
