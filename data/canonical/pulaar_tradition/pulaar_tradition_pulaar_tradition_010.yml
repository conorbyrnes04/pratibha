    Delafosse is writing a pan-West-African theory; he pauses on the Fulɓe because they illustrate the
    structure without always wearing the clan name as a surname in daily address. You still say Dialloubé
    against Hanhanbé when you need to name a people. Yettôdé means "that which honors." To call someone
