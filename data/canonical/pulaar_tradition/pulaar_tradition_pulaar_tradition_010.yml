- kind: key_terms
  label: Key Terms
  items:
  - term: yettôdé
    definition: Pulaar that which honors — the clan honor-name; not a nickname and not a European surname;
      to address someone by it is homage, affirming that the person has known ancestors
  - term: interdit
    definition: ancestor-instituted avoidance (animal, plant, object) — often the helper-species of the
      founding story; taboo is usable if you keep the ancestor as legislator; totem is what Delafosse
      warns against
  - term: Dialloubé / Hanhanbé
    definition: people of Diallo vs people of Kan — Fulɓe clan as collective, even when the name is not
      stacked on the personal name in daily speech
  - term: ancêtre du clan
    definition: the clan ancestor who instituted name and prohibition together — the legislator of identity;
      without this figure the honor-name is just branding
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Israelite tribes and food laws
    resonance: Both bind a people by ancestor-given name plus prohibition.
    divergence: Torah prohibitions are theistic and written; clan interdit is ancestral and oral, often
      tied to a rescue-story of a particular species.
  - citation: Confucian surname and ancestral hall
    resonance: Both treat the name as honor that must be lived up to.
    divergence: The Chinese name is patrilineal ritual with tablets; yettôdé is a spoken honorific whose
      partner-institution is an avoidance, not a tablet.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one prohibition you actually live by that you did not invent — a food you will not eat, a
    cruelty you will not do, a place you will not spoil — because someone before you bound you. Keep it
    today on purpose, as if the ancestor were still the legislator. If you cannot name any such prohibition,
    you are living as if you had no yettôdé.
