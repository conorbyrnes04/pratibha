  cultural_context: 'Pulaar (Fulfulde) is the language of the Fulɓe (Peul, Foulah, Fulani). By 1900 most
    groups known to European observers were Muslim. Pre-Islamic practice survives in the PD record as
    remaining pagan pastoral pockets whose only cult is the herd, and as remnants inside Islam: herd-love,
    spirit-warding at birth, green-leaf greeting of the dead, cow bridewealth, the mother''s counsel,
    clan yettôdé and ancestor interdit. There is no indigenous written scripture. These layers restore
    the claim without colonial contempt. Racial anthropology, costume catalogs, and surgical detail are
    refused. Observer slurs (hypocrite, thief) are inverted as error. The 1961 Koumen cosmology is not
    used.'
  original_source: Lasnet, Une mission au Sénégal (1900), Peuls — Mœurs. Coutumes
  original_reliability: SOURCED — French observer sentence from Lasnet 1900, Crozals 1883, Reclus as cited,
    or Delafosse–Gaden 1913 for social form; Hampâté Bâ 1961 not used
