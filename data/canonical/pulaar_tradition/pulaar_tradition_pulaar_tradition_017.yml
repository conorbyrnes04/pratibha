unit_label: Gravity Is the Honor-Face
title: Gravity Is the Honor-Face
unit_type: teaching_passage
commentary: 'Honor has a face, and the face is gravity. Lasnet writes affecte une gravité continuelle
  as if it were a pose. The remnant reading is pulaaku: reserve as the way a cattle-people refuse to leak
  inner weather into noise. Dancing rarely is not joylessness. It is the same impassibility that initiation
  already taught as déshonneur to complain. The herd-cult produces a public body that does not advertise
  itself. Continual gravity is how that body walks through a village of louder cults.


  "The women never dance" must not be taught as a lesson against women. It is Lasnet''s gendered observation
  of the same reserve. If pulaaku is shame-honor and self-mastery, then the women of the camp are not
  being denied a pleasure as inferiors; they are being described as the stricter keepers of the honor-face.
  Handle the sentence as ethnography of semteende, not as a rule that women should be still while men
  may move. The philosophical claim is reserve, not misogyny. A tradition that consults the mother before
  every great act is not a tradition whose women are ornaments.


  Existentially the teaching is that not every joy needs a noise. Disdain for noisy pleasures can become
  pride, and Lasnet is happy to record pride. The usable core is smaller: keep a gravity that does not
  require the room to know how you feel. If your honor depends on being seen celebrating, you have already
  sold the face the herd-cult was keeping.'
