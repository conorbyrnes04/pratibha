- kind: key_terms
  label: Key Terms
  items:
  - term: pulaaku
    definition: Fulɓe-ness — reserve, endurance, shame-honor; Lasnet's gravité continuelle is the visible
      rule without the name
  - term: gravité continuelle
    definition: continual gravity — the honor-face; not joylessness; completeness of form
  - term: semteende
    definition: later Pulaar shame-reserve — the inner hinge of not leaking; women never dance is Lasnet's
      gendered note on this, not a ranking of persons
  - term: plaisirs bruyants
    definition: noisy pleasures — what the remnant refuses; disdain can curdle into pride; the teaching
      is reserve, not contempt for neighbors
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic gravity of the sage
    resonance: Both treat composure as a public ethic, not a private mood.
    divergence: Stoic gravity is a judgment about impressions; Fulɓe gravity here is a people-face around
      the herd and the mother.
  - citation: Zen dignity of ordinary walking
    resonance: Both refuse noisy display as a mark of realization.
    divergence: Zen dignity is emptiness walking; this dignity is pulaaku walking — shame-honor, not no-self.
- kind: practice
  label: Practice (Abhyasa)
  body: 'For one social hour today, keep continual gravity: no performance of mood, no extra noise to
    prove you belong. Do not police anyone else''s dance. Keep your own face. That is the honor-form,
    not a ban on women.'
