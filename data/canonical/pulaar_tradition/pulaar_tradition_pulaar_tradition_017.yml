translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Fervent musulman mais non fanatique, il affecte une gravité continuelle, danse rarement (les femmes
    ne dansent jamais) et méprise les plaisirs bruyants des autres populations.
- kind: translation
  label: Pratibha Translation
  body: A fervent Muslim but not a fanatic, he keeps a continual gravity. He dances rarely (the women never
    dance), and disdains the noisy pleasures of the other peoples.
