- kind: key_terms
  label: Key Terms
  items:
  - term: nagge
    definition: Pulaar cow / cattle — the cult-object Crozals could not name; later PD sources use nagge
      / na'i for the living center the French called troupeaux
  - term: culte des troupeaux
    definition: cult of the herds — Crozals/Bayol's name for the last pagan liturgical center; cattle-raising
      as mere economy misses why they reached for a religious word
  - term: pulaaku
    definition: 'Fulɓe-ness: reserve, endurance, shame-honor — not in Crozals; the later name for the
      ethic that keeps the herd-cult from becoming mere stock-breeding'
  - term: sans se préoccuper du lendemain
    definition: without concern for tomorrow — pastoral present, not fecklessness; planning is the next
      pasture
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vedic go, cow as wealth-and-rite
    resonance: Both locate the sacred in living cattle rather than in a manufactured image.
    divergence: Vedic ritual is a named sacrifice with priests and meter; this Pulaar remainder has no
      temple and no recorded hymn in the PD sources — only the prospering of the herd.
  - citation: Serer first-fruits at the baobab (this corpus)
    resonance: Both refuse to empty the near world for a distant God.
    divergence: Serer practice pours milk and millet at a tree or stone; remaining pagan Fulɓe, in this
      sentence, have no other cult than the animals themselves.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, take one living being that depends on you — a person, an animal, a plant — and make its
    prospering the whole of the rite. Do not add a prayer on top. Do not postpone care until a better
    cosmology arrives. The cult is the keeping.
