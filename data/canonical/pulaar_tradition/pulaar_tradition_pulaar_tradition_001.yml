unit_id: pulaar_tradition.pulaar_tradition_001
unit_label: The Remaining Cult Is the Herd
title: The Remaining Cult Is the Herd
unit_type: teaching_passage
commentary: 'The remaining religion is not a missing temple. It is a single cult with a living object:
  the herd. Crozals, compiling Park, Mollien, and Bayol, hunts for idolatry among the Fulɓe and cannot
  find a shrine. What he finds instead, among the last openly pagan nomads of the Upper Niger hinterland,
  is one relation of care. "Only one cult" (n''ont qu''un culte) is the philosophical sentence. Cows are
  not carved as idols. Crozals says in the next breath that image-worship among the Peuls is an exception
  of the poorest and most isolated. The center is not a statue. The center is nagge — the cow as the being
  you keep alive.


  "Without concern for tomorrow" is not improvidence. It is the pastoral present tense. The herd is fed,
  watered, moved, and protected today. Cosmology, if it exists, is not stored in a book; it is stored
  in the continued life of the animals. Later Fulɓe literature will name a creator and an ur-cow. These
  1883 pages do not. They record what a public-domain observer could still see: where Islam has not yet
  replaced the old center, the center is cattle.


  The teaching cuts two modern errors. One is that a people without a temple has no religion. The other
  is that "animism" must mean a crowded pantheon. Here the world is already full, but the cult is single.
  You do not collect gods. You keep the herd alive. That keeping is the rite. Pulaaku later names the
  honor-code around this life; the 1883 sentence is older and plainer: one cult, the herd.'
