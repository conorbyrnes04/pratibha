translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Même aujourd'hui, on trouve dans le Wassallah et le Kankan des Peulhs nomades qui n'ont qu'un
    culte, celui de leurs troupeaux, qu'ils font prospérer le mieux qu'ils peuvent, sans se préoccuper
    du lendemain.
- kind: translation
  label: Pratibha Translation
  body: 'Even today, in Wassallah and Kankan, one finds nomad Peuls who have only one cult: that of their
    herds. They make the herds prosper as best they can, without concern for tomorrow.'
