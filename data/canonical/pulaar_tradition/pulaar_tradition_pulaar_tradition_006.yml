unit_id: pulaar_tradition.pulaar_tradition_006
unit_label: Ward the Spirits Until the Seventh Day
title: Ward the Spirits Until the Seventh Day
unit_type: teaching_passage
commentary: 'The week between birth and name is a spiritually open interval. Islam''s seventh-day naming
  did not abolish the older danger; it only scheduled its close. Lasnet calls the ceremony a baptism because
  he is writing for French readers. It is the Muslim name-giving — later Pulaar simmol / innde. Beside
  it, not instead of it, the mother is armed. A dagger is a poor tool against a spirit if you think in
  mosque categories. It is a precise tool if you think, as the remnant does, that the unnamed child and
  the newly delivered mother are exposed to persons who are not flesh.


  This is the same structure Delafosse names for West African animism generally: the near world is populated
  by free souls that can act, and the living take measures. The measure here is metal worn on the body.
  The seventh day does not only confer a name; it ends a vigil. Pre-Islamic Pulaar practice, in the only
  form this source can show it at the cradle, is apotropaic: keep the spirits off until the child is spoken
  into the human group.


  Existentially the teaching is that beginnings are not safe by default. A birth is not yet a belonging.
  Belonging waits on a rite, and until the rite the world is leaky. You do not have to accept Lasnet''s
  dagger as your object. You do have to notice which of your own beginnings you treat as spiritually unguarded,
  as if a new life, a new love, or a new work needed no vigil.'
