- kind: key_terms
  label: Key Terms
  items:
  - term: mauvais esprits
    definition: evil spirits — Lasnet's French for harmful non-human persons around birth; not the Islamic
      jinn as a learned category, and not a psychology of bad mood; a populated interval between birth
      and name
  - term: poignard
    definition: dagger worn by the mother until day seven — apotropaic metal; weapon as crime-tool is
      the wrong picture; this is a ward, like an amulet that happens to be a blade
  - term: simmol / innde
    definition: later Pulaar naming — Lasnet's baptême is the Islamic seventh-day name-giving; the remnant
      is the need for a ward until the naming
  - term: septième jour
    definition: seventh-day naming, Islamic in Lasnet's framing — the scheduled end of exposure
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Greek amphidromia and Roman name-day
    resonance: Both treat the days after birth as incomplete belonging.
    divergence: Classical rites walk the child or purify the house; this remnant arms the mother.
  - citation: Serer mammam (this corpus)
    resonance: Both populate the near world with addressable, dangerous powers.
    divergence: Serer address the spirits with libation; this Fulɓe remnant drives them off with a blade
      until the name is given.
- kind: practice
  label: Practice (Abhyasa)
  body: 'If something in your life is newly born — a project, a recovery, a household — keep a seven-day
    vigil. Do not announce it as finished on day one. Each day, perform one small warding act: a boundary,
    a silence, a refusal of premature display. On the seventh day, give it a name out loud.'
