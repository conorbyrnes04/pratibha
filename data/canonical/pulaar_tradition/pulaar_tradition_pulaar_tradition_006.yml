translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Comme chez les autres musulmans le baptême a lieu le septième jour après la naissance et la mère
    porte jusque-là un poignard destiné à écarter les mauvais esprits.
- kind: translation
  label: Pratibha Translation
  body: As among other Muslims, the naming takes place on the seventh day after birth, and until then
    the mother wears a dagger meant to keep off the evil spirits.
- kind: commentary
  label: Pratibha Commentary
