sanskrit_devanagari: À la fin du XVIIIe siècle la conversion des différents groupes Peulhs n'est pas complète. Il arrive que
  dans un même État, à côté des Peulhs musulmans formant la masse, une minorité païenne s'est maintenue. Mungo-Park parle
  de ces Peulhs qui « restent attachés à leurs anciennes superstitions ». Au commencement de ce siècle, dans le Djolof, les
  Peulhs étaient tous païens, et, s'il faut en croire Mollien, portaient une haine violente aux musulmans. À deux journées
  de Timbo, le Sangarari, visité par Mollien, est alors habité par des Peulhs païens. Près de Kankoli, à l'ouest du Fouta-Djalon,
  le même voyageur trouve également un village de Peulhs païens.
sanskrit_iast: 'Not applicable. Place-names in the sources: Djolof (Jolof, Senegal); Timbo (capital of Futa Jallon); Sangarari;
  Kankoli, west of Futa Jallon. Park''s English, as Crozals quotes it: Peuls who "remain attached to their ancient superstitions."'
translation_literal: At the end of the eighteenth century the conversion of the different Peul groups is not complete. It
  happens that in one and the same state, beside the Muslim Peuls who form the mass, a pagan minority has held on. Mungo Park
  speaks of those Peuls who "remain attached to their ancient superstitions." At the beginning of this century, in the Djolof,
  the Peuls were all pagan and, if Mollien is to be believed, bore a violent hatred toward Muslims. Two days from Timbo, Sangarari,
  visited by Mollien, is then inhabited by pagan Peuls. Near Kankoli, west of Futa Jallon, the same traveler also finds a
  village of pagan Peuls.
commentary: 'The claim is historical before it is doctrinal: pre-Islamic Pulaar practice is not a hypothesis projected backward
  from twentieth-century myth. It is a demographic fact in the travel literature of 1799–1820, still summarized in 1883. Conversion
  is incomplete. In one state two Fulɓe populations coexist. The Jolof Peuls are reported as entirely pagan around 1800. Pagan
  villages stand within two days of Timbo, the theocratic capital of Futa Jallon. Reclus will add, for the Upper Benue, tribes
  "who have remained pagan and whose men still keep their herds."


  Park''s word "superstitions" is contempt and should not be adopted as teaching. What it marks is attachment to an older
  cult that Islam had not replaced. Mollien''s "violent hatred" of Muslims, if accurate, is the political edge of that attachment
  in a century of Fulɓe jihads: the pagan pastoral remnant is not merely leftover custom; it is a party. Crozals''s larger
  book is about Muslim Fulɓe empire. This paragraph is his admission that the empire did not cover the whole people.


  Existentially the teaching is against the myth of total conversion. A tradition is allowed to have a remainder. The remainder
  is where the older ontology is still practiced rather than remembered. For this corpus, that remainder is the warrant for
  the other units: cattle-cult, spirit-warding, green-leaf greeting, clan *interdit*. They are not "folklore inside Islam"
  only. They are what the last pagans were still doing, and what Muslims still do without calling it a second religion.


  Key Terms:


  **minorité païenne** - "pagan minority" -> Crozals''s demographic name for Fulɓe who have not taken Islam -> "animist" is
  Delafosse''s better later word; "fetishist" is Lasnet''s worse one.


  **anciennes superstitions** - Park via Crozals: "ancient superstitions" -> the older cult under a Protestant traveler''s
  insult -> the usable content is *ancient* and *attached*, not *superstition*.


  **Djolof** - Jolof, Senegal -> a Wolof-dominated country where Fulɓe herders are reported still pagan ca. 1800 -> proof
  that Senegambian Fulɓe religion is not identical with Futa Toro Islam.


  **Timbo / Fouta-Djalon** - the Muslim imamate''s capital, with pagan Peul villages two days away -> the map of remainder:
  not far from the mosque, the old cult still has a village.


  Cross-Tradition Resonances:


  **Late antique pagans beside Christian empire:** Both show conversion as a patchwork inside one people, not a clean replacement.

  *Divergence:* Mediterranean paganism left temples and texts; Pulaar paganism in these sources leaves herds, villages, and
  hostility, not a written liturgy.


  **Japanese *shinbutsu* (kami practice beside Buddhism):** Both keep an older local cult under or beside a later universal
  religion.

  *Divergence:* Japan institutionalizes the coexistence; Crozals''s Fulɓe coexistence is still conflictual (Mollien''s "hatred").


  **Serer resistance to conversion in Lasnet (this corpus):** Both Senegambian cases show Islam as incomplete overlay.

  *Divergence:* Serer sources in this corpus still describe Roog, *mammam*, and baobab libation as a living public religion;
  Fulɓe paganism is already a minority report.'
insight: 'The claim is historical before it is doctrinal: pre-Islamic Pulaar practice is not a hypothesis projected backward
  from twentieth-century myth.'
practice: Name one older practice in your own life that a later "conversion" — religious, professional, or intellectual —
  did not actually erase. Do not despise it as leftover superstition. Keep it for one day as the remainder that tells the
  truth about what you still serve.
