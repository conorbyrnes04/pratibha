unit_label: Pagan Pockets Were Still Attested
title: Pagan Pockets Were Still Attested
unit_type: teaching_passage
commentary: 'Pre-Islamic Pulaar practice is not a hypothesis projected backward from a twentieth-century
  myth. It is a demographic fact in the travel literature of 1799–1820, still summarized in 1883 and 1900.
  Conversion is incomplete. In one state two Fulɓe populations coexist. Lasnet''s word fétichistes is
  the colonial file-name; tiedo (tièdo) is the Senegambian word for those who have not taken Islam. Park''s
  "superstitions" is contempt and should not be adopted as teaching. What it marks is attachment to an
  older cult that Islam had not replaced.


  Crozals''s larger book is about Muslim Fulɓe empire. This paragraph is his admission that the empire
  did not cover the whole people. The Jolof Peuls are reported as entirely pagan around 1800. Pagan villages
  stand within two days of Timbo, the theocratic capital of Futa Jallon. The remainder is the warrant
  for every other unit in this collection: cattle-cult, spirit-warding, green-leaf greeting, clan interdit.
  They are not folklore inside Islam only. They are what the last pagans were still doing, and what Muslims
  still do without calling it a second religion.


  Existentially the teaching is against the myth of total conversion. A tradition is allowed to have a
  remainder. The remainder is where the older ontology is still practiced rather than remembered. Do not
  despise your own unconverted remainder as leftover superstition. It is often the only honest cult you
  still have.'
