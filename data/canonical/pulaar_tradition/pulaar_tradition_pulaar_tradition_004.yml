- kind: key_terms
  label: Key Terms
  items:
  - term: tièdo / tiedo
    definition: Senegambian name for those who have not taken Islam — Lasnet's fétichistes is the colonial
      file-word; tiedo is the local demographic
  - term: minorité païenne
    definition: pagan minority — Crozals's name for Fulɓe who have not taken Islam; Delafosse's later
      animist is cleaner; fetishist is Lasnet's worse one
  - term: Fouta-Toro / Fouta-Djallon
    definition: the Muslim imamates; the map of remainder is not far from the mosque — the old cult still
      has a village
  - term: anciennes superstitions
    definition: 'Park via Crozals: ancient superstitions — the older cult under a traveler''s insult;
      the usable content is ancient and attached, not superstition'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Late antique pagans beside Christian empire
    resonance: Both show conversion as a patchwork inside one people, not a clean replacement.
    divergence: Mediterranean paganism left temples and texts; Pulaar paganism in these sources leaves
      herds, villages, and a named remainder, not a written liturgy.
  - citation: Serer resistance to conversion in Lasnet (this corpus)
    resonance: Both Senegambian cases show Islam as incomplete overlay.
    divergence: Serer sources in this corpus still describe a living public religion; Fulɓe paganism is
      already a minority report beside the imamate.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one older practice in your own life that a later conversion — religious, professional, or
    intellectual — did not actually erase. Keep it for one day as the remainder that tells the truth about
    what you still serve.
