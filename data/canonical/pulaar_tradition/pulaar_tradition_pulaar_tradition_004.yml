pratibha_layers:
- kind: original
  label: Original
  body: La majorité de la race est convertie à l'islamisme, cependant beaucoup d'agglomérations du Sénégal
    et de la Haute-Gambie sont encore fétichistes, tièdos; leur nombre diminue chaque jour avec les progrès
    constants de l'islamisme. À la fin du XVIIIe siècle la conversion des différents groupes Peulhs n'est
    pas complète. Il arrive que dans un même État, à côté des Peulhs musulmans formant la masse, une minorité
    païenne s'est maintenue.
- kind: translation
  label: Pratibha Translation
  body: The majority of the people is converted to Islam; nevertheless many settlements of Senegal and
    the Upper Gambia are still fetishist, tiedo; their number diminishes each day with the constant progress
    of Islam. At the end of the eighteenth century the conversion of the different Peul groups is not
    complete. In one and the same state, beside the Muslim Peuls who form the mass, a pagan minority has
    held on.
