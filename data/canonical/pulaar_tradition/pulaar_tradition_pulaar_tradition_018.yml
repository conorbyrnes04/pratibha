unit_label: The Fetishists Still Till
title: The Fetishists Still Till
unit_type: teaching_passage
commentary: 'The old center still has dirt on its hands. Lasnet''s fétichistes is the colonial word for
  those who have not taken Islam — the same remainder the tiedo sentence named. They till. They also raise
  the cattle with the greatest care. Conversion, in this paragraph, has produced a pride that will not
  touch the earth. The remnant has not forgotten that a people who live from herd and field must still
  stoop. Pride that will not till is not pulaaku. Pulaaku is reserve. This pride is a new honor that has
  detached itself from the cult-object.


  "Too proud to work the land" is Lasnet''s comparison, and it can be read as a slur on Muslims or as
  a slur on pagans. Refuse both. The philosophical move is the remainder: where the old cult is still
  practiced, labor and cattle-care are one life. Where the new confession has become a rank, the land
  is left to someone else. The lougan (field) beside the herd is the settled form of boolâtrie in fertile
  Senegambia — not a betrayal of nomadism, but the same care when pasture does not force a move.


  Existentially the teaching is that a converted identity can become too fine to do the work that still
  feeds it. If your new name will not stoop, it is not a deeper religion. It is a costume. Keep one contact
  with the dirt that your pride has started to outsource.'
