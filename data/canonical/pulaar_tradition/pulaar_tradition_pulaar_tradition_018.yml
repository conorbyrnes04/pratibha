translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Dans les régions fertiles comme celles que l'on rencontre en Gambie, en Casamance, dans le haut
    Sénégal, ils sont devenus agriculteurs et cultivent leurs lougans tout en élevant leur bétail avec
    le plus grand soin. Il est bon d'ajouter que ce sont ordinairement les fétichistes qui se livrent
    à ces travaux, les musulmans étant trop orgueilleux pour travailler la terre.
- kind: translation
  label: Pratibha Translation
  body: In fertile regions such as those of the Gambia, Casamance, and the upper Senegal, they have become
    farmers and cultivate their fields while still raising their cattle with the greatest care. It is
    well to add that it is ordinarily the fetishists who give themselves to this work, the Muslims being
    too proud to work the land.
- kind: commentary
  label: Pratibha Commentary
