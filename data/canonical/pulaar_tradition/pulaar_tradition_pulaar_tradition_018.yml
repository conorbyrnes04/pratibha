- kind: key_terms
  label: Key Terms
  items:
  - term: fétichistes
    definition: Lasnet's file-word for the unconverted — the remainder who still till; not a lesson in
      "fetishism"; a demographic of the old center
  - term: lougans
    definition: fields, cultivated plots — the settled companion of the herd in fertile Casamance and
      upper Senegal
  - term: trop orgueilleux
    definition: too proud — conversion as a rank that drops the earth; pulaaku is not this pride
  - term: plus grand soin
    definition: greatest care — even as farmers they raise cattle as the undropped cult
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Genesis 2–3, tilling after the garden
    resonance: Both bind human work to the ground that feeds.
    divergence: Genesis tills under a curse; this remnant tills as the unconverted center, while the converted
      have become too proud.
  - citation: Benedictine ora et labora
    resonance: Both refuse a religion that will not put its hands to the field.
    divergence: The monastery theorizes work as prayer; Lasnet's fetishists simply still do the work the
      new rank has dropped.
- kind: practice
  label: Practice (Abhyasa)
  body: Do one necessary earth-work today that your present identity considers beneath it — wash, carry,
    dig, mend, cook. Do it as the fetishist who still tills, not as a favor. Notice the pride that wanted
    to delegate it.
