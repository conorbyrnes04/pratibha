unit_label: Ward the Spirits Until the Seventh Day
title: Ward the Spirits Until the Seventh Day
unit_type: sutra
sanskrit_devanagari: Comme chez les autres musulmans le baptême a lieu le septième jour après la naissance et la mère porte
  jusque-là un poignard destiné à écarter les mauvais esprits.
sanskrit_iast: Not applicable. Lasnet's "baptême" is the Islamic naming on the seventh day (*simmol* / *innde* in later Pulaar
  usage). The remnant is the dagger against *mauvais esprits* — evil spirits — worn until that naming.
translation_literal: As among other Muslims, the naming-baptism takes place on the seventh day after birth, and until then
  the mother wears a dagger meant to keep off the evil spirits.
commentary: 'The claim is that the week between birth and name is a spiritually open interval, and that Islam''s seventh-day
  naming did not abolish the older danger, only scheduled its close. Lasnet calls the ceremony a baptism because he is writing
  for French readers. It is the Muslim name-giving. Beside it, not instead of it, the mother is armed. A dagger is a poor
  tool against a spirit if you think in mosque categories. It is a precise tool if you think, as the remnant does, that the
  unnamed child and the newly delivered mother are exposed to persons who are not flesh.


  This is the same structure Delafosse names for West African animism generally: the near world is populated by free souls
  that can act, and the living take measures. The measure here is metal worn on the body. The seventh day does not only confer
  a name; it ends a vigil. Pre-Islamic Pulaar practice, in the only form this source can show it at the cradle, is apotropaic:
  keep the spirits off until the child is spoken into the human group.


  Existentially the teaching is that beginnings are not safe by default. A birth is not yet a belonging. Belonging waits on
  a rite, and until the rite the world is leaky. You do not have to accept Lasnet''s dagger as your object. You do have to
  notice which of your own beginnings you treat as spiritually unguarded, as if a new life, a new love, or a new work needed
  no vigil.


  Key Terms:


  **mauvais esprits** - "evil spirits" -> Lasnet''s French for harmful non-human persons around birth -> not the Islamic *jinn*
  as a learned category, and not a psychology of "bad mood"; a populated interval between birth and name.


  **poignard** - dagger worn by the mother until day seven -> apotropaic metal -> "weapon" as crime-tool is the wrong picture;
  this is a ward, like an amulet that happens to be a blade.


  **septième jour** - seventh-day naming, Islamic in Lasnet''s framing -> the scheduled end of exposure -> the remnant is
  not the naming (Muslim) but the need for a ward *until* the naming (older).


  **baptême** - Lasnet''s Christian word for the naming feast -> do not import original sin; import only the public reception
  of the child into named life.


  Cross-Tradition Resonances:


  **Greek *amphidromia* and Roman name-day:** Both treat the days after birth as incomplete belonging.

  *Divergence:* Classical rites walk the child or purify the house; this remnant arms the mother.


  **Jewish *brit* on the eighth day:** Both close an interval with a public religious act.

  *Divergence:* Circumcision-as-covenant is not this unit (and is not taught here); the Pulaar seventh day in Lasnet is naming,
  with a spirit-ward beside it.


  **Serer *mammam* (this corpus):** Both populate the near world with addressable, dangerous powers.

  *Divergence:* Serer address the spirits with libation; this Fulɓe remnant drives them off with a blade until the name is
  given.'
insight: The claim is that the week between birth and name is a spiritually open interval, and that Islam's seventh-day naming
  did not abolish the older danger, only scheduled its close.
practice: 'If something in your life is newly born — a project, a recovery, a household — keep a seven-day vigil. Do not announce
  it as finished on day one. Each day, perform one small warding act: a boundary, a silence, a refusal of premature display.
  On the seventh day, give it a name out loud.'
