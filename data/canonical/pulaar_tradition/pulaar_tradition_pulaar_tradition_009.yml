    test that the act belongs to a line and not only to a mood.'
- kind: key_terms
  label: Key Terms
  items:
  - term: consulter sa mère
    definition: consult one's mother — the condition of a great act; ask mom as joke misses that Lasnet
      says never (jamais) and important action
  - term: ardo
    definition: political-military chief — one of the public authorities this rule still outranks for
      a founding act; the mother is nearer than the office
  - term: ascendant
    definition: the wife's ascendancy over the husband — practical authority inside a Qur'anic frame that
      legally favors the man; the house is not the Qur'an's diagram
  - term: action importante
    definition: important action — the threshold at which counsel becomes mandatory; daily acts may be
      free; founding acts are not
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Confucian filial consultation
    resonance: Both make the parent a living source of right action.
    divergence: Confucian counsel is often paternal and ritualized as xiao; this sentence specifies the
      mother.
  - citation: Delphic counsel before a great act
    resonance: Both refuse to let a founding decision be merely private.
    divergence: Delphi is an oracle of the god; here the oracle is the mother.
- kind: practice
  label: Practice (Abhyasa)
  body: Before one important action this week, consult a living elder woman in your line — mother, aunt,
    teacher — and tell her the act in plain speech. Do not perform the consultation as theater. Change
    the act if her hearing finds it thinner than you thought.
