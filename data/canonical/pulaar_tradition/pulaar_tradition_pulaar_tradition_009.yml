unit_label: Consult the Mother Before a Great Act
title: Consult the Mother Before a Great Act
unit_type: teaching_passage
commentary: 'This is a decision-procedure, not a compliment in a colonial ranking of "the status of women."
  Lasnet is comparing ethnic files. Strip the ranking. What remains is a rule of counsel: before a great
  act, ask the mother. Islam''s legal polygamy is in the same paragraph and is described as practically
  checked by the wife. The deeper remnant is maternal consultation as a condition of action. Authority
  is not only the almamy, the marabout, or the ardo. Authority is the woman from whom one was born, still
  speaking.


  In a cattle-people this is not a sentimental exception to patriarchy; it is how a mobile household keeps
  a memory that is not written. The mother is the one who has seen the herd, the marriages, the failures.
  To act without her is to act without the household''s archive. Pre-Islamic West African social philosophy,
  as Delafosse will say of clans generally, runs through ancestors. This sentence makes the living mother
  the nearest ancestor who can still answer.


  Existentially the teaching is against heroic solitude. An important action that cannot survive being
  told to one''s mother is probably vanity. Consultation is not permission-as-infantilism. It is the test
  that the act belongs to a line and not only to a mood.'
