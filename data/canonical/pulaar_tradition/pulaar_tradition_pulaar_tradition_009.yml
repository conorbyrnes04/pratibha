translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: La femme peule est beaucoup plus considérée que chez les autres peuplades du Sénégal, elle exerce
    souvent un grand ascendant sur son mari et, malgré la latitude que donne à celui-ci le Coran, il est
    rare qu'elle laisse pénétrer une seconde femme dans sa case; elle est respectée et très écoutée de
    ses enfants, un Peul n'accomplit jamais une action importante sans consulter sa mère.
- kind: translation
  label: Pratibha Translation
  body: The Peul woman is held in much higher regard than among the other peoples of Senegal. She often
    exerts a great ascendancy over her husband, and despite the latitude the Qur'an gives him it is rare
    that she lets a second wife into her house. She is respected and closely listened to by her children.
    A Peul never accomplishes an important action without consulting his mother.
- kind: commentary
  label: Pratibha Commentary
  body: 'This is a decision-procedure, not a compliment in a colonial ranking of "the status of women."
    Lasnet is comparing ethnic files. Strip the ranking. What remains is a rule of counsel: before a great
    act, ask the mother. Islam''s legal polygamy is in the same paragraph and is described as practically
    checked by the wife. The deeper remnant is maternal consultation as a condition of action. Authority
    is not only the almamy, the marabout, or the ardo. Authority is the woman from whom one was born,
    still speaking.


    In a cattle-people this is not a sentimental exception to patriarchy; it is how a mobile household
    keeps a memory that is not written. The mother is the one who has seen the herd, the marriages, the
    failures. To act without her is to act without the household''s archive. Pre-Islamic West African
