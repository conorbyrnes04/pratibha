translation_provenance: English is a Pratibha rendering (pd_adapted) from Alexandre Lasnet, *Une mission
  au Sénégal* (1900); L. de Crozals as quoted there / in the 1883 Peul notices; Élisée Reclus as cited
  by Lasnet on *boolâtrie*; and Maurice Delafosse with Henri Gaden, *Chroniques du Foûta sénégalais* (Siré-Abbâs-Soh,
  1913) where the chronicle is used for social form not for Islamic law. Hampâté Bâ 1961 is not used.
pratibha_layers:
- kind: original
  label: Original
  body: Les Peuls font d'habiles artisans, malheureusement un homme libre croirait déroger en s'occupant
    d'autre chose que de ses troupeaux ou de ses cultures ; aussi les ouvriers qu'ils possèdent sont-ils
    le plus souvent des étrangers, Toucouleurs en majorité, et jouissent-ils de peu de considération.
- kind: translation
  label: Pratibha Translation
  body: The Peuls make skilled artisans; unfortunately a free man would think he derogated by occupying
    himself with anything other than his herds or his fields. So the workers they have are most often
    foreigners, Tukulor in the majority, and they enjoy little consideration.
- kind: commentary
  label: Pratibha Commentary
  body: 'The old center is still the only work that does not feel like a fall. Lasnet''s malheureusement
    and his note that artisans enjoy little consideration are colonial caste-gossip. Do not teach contempt
    for smiths, weavers, or griots. The Bambados griots, he says later, are a category apart. The usable
    claim is narrower and older: a free Fulɓe person''s work is the herd and, in fertile country, the
    field. Every other craft is socially marked as not-the-cult. That marking can become injustice. The
    philosophical remainder is that the cult still knows which labor is its own.


    "Would think he derogated" (croirait déroger) is honor-language. Pulaaku here is occupational: you
