- kind: key_terms
  label: Key Terms
  items:
  - term: déroger
    definition: to derogate, to fall from rank — honor as staying with herd and field; do not teach this
      as contempt for artisans
  - term: homme libre
    definition: free man — the pastoral subject whose work is nagge and lougan; caste-language is Lasnet's;
      the cult-claim is occupational
  - term: troupeaux ou de ses cultures
    definition: herds or fields — the two licit labors of the old center
  - term: pulaaku
    definition: honor that can curdle into pride about work; the usable core is not leaving the cult-labor
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato's Republic, one man one work
    resonance: Both assign a people a proper labor and treat leaving it as a fall.
    divergence: Plato's fall is civic injustice; this fall is leaving the herd-cult for a marked trade.
      Do not import Plato's contempt.
  - citation: Benedictine refusal of idleness
    resonance: Both treat a named labor as the religious life of a community.
    divergence: The monastery theorizes all work as prayer; the Fulɓe remnant theorizes one work — herd
      and field — as the work that does not derogate.
- kind: practice
  label: Practice (Abhyasa)
  body: Give one hour today to the labor that is actually your cult — the care, the field, the keeping
    — and refuse one piece of work that only looks like status. Do not despise anyone else's craft. Keep
    your own from derogating.
