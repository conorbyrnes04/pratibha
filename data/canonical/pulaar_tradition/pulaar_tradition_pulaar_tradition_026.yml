unit_label: A Free Man Would Derogate
title: A Free Man Would Derogate
unit_type: teaching_passage
commentary: 'The old center is still the only work that does not feel like a fall. Lasnet''s malheureusement
  and his note that artisans enjoy little consideration are colonial caste-gossip. Do not teach contempt
  for smiths, weavers, or griots. The Bambados griots, he says later, are a category apart. The usable
  claim is narrower and older: a free Fulɓe person''s work is the herd and, in fertile country, the field.
  Every other craft is socially marked as not-the-cult. That marking can become injustice. The philosophical
  remainder is that the cult still knows which labor is its own.


  "Would think he derogated" (croirait déroger) is honor-language. Pulaaku here is occupational: you do
  not leave nagge for a trade. The same people who will not sell cows will not become the people who make
  the knife, except the redsmiths (abharbéy) who work gold and silver and remain Peul. Iron is left to
  others. The herd-cult keeps its hands on animals and earth, and lets the rest of the workshop stand
  beside it without becoming it.


  Existentially the teaching is not "despise makers." It is: know which work is your remaining cult, and
  do not abandon it for a livelihood that only looks like status. If you have left the one labor that
  still feels like a rite, you have already derogated, whatever your new title is. Return a hand to the
  herd or the field — the life you actually keep.'
