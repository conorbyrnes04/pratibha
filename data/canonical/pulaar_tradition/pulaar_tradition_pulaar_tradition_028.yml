unit_label: Honor Is Skill at Care
title: Honor Is Skill at Care
unit_type: teaching_passage
commentary: 'Honor is not a speech. Honor is a count of living bodies plus a skill. Lasnet''s considérés
  is the same honor bridewealth measures in cows and initiation measures in impassibility. Here the measure
  is explicit: the more animals, and the more able at care (plus habiles à les soigner). Possession without
  skill is not the full sentence. Skill without animals is not either. The remnant cult joins them. You
  tend them yourselves (s''en occupent eux-mêmes). Delegated care is already a thinning of honor.


  This is boolâtrie without the Latin word. Reclus saw something religious in the clean pen. Lasnet sees
  honor in the hand that knows how to keep the animal alive. Pulaaku is often taught as reserve and shame.
  This unit adds the missing half: competence. A grave face over a dying calf is not honor. The ramp,
  the dummy skin, the unsold cow, the carried milk — those are honor as skill. The collection ends where
  it began. The remaining cult is the herd, and the remaining honor is being good at the cult.


  Existentially the teaching is against honor as display and against care as a feeling. If you want to
  be considered, have more life in your keeping and be more able at keeping it. Tend it yourself. The
  mother you consult, the ancestor''s interdit, the green leaves on the road — all of them assume a person
  whose hands still know the animals. Without that skill the rest is costume.'
