- kind: key_terms
  label: Key Terms
  items:
  - term: habiles à les soigner
    definition: skilled at caring for them — honor as competence, not as speech or face alone
  - term: considérés
    definition: 'considered, honored — the public measure: more life in keeping, more skill at keeping'
  - term: s'en occupent eux-mêmes
    definition: tend them themselves — delegated care thins the cult
  - term: pulaaku
    definition: reserve plus this competence — shame-honor without skill is only a face
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, aretē as excellence in a function
    resonance: Both make honor a skill in a proper work, not a title.
    divergence: Aristotle's excellence is civic and rational; this excellence is pastoral — the function
      is keeping nagge alive.
  - citation: Zen care of the ordinary thing
    resonance: Both locate dignity in how a thing is tended, not in talk about tending.
    divergence: Zen care is emptiness in the hand; Fulɓe care is the herd in the hand, and the honor-count
      that follows.
- kind: practice
  label: Practice (Abhyasa)
  body: Tend one living thing yourself today — do not delegate the care. Do the skilled act, not the gesture.
    Let honor be the improvement in your hands, not the story you tell about being a caring person.
provenance:
