unit_label: Tomb Profanation Is Sacrilege
title: Tomb Profanation Is Sacrilege
unit_type: teaching_passage
commentary: 'The negative of the green-leaf greeting is a hard word: sacrilège. Lasnet frames it as generic
  Islam. The Fulɓe intensification is pastoral. A people who throw forage to the dead as they pass will
  treat the disturbance of a grave as more than bad manners. Profanation is the opposite of salut. One
  act acknowledges the trépassés as persons on the road. The other treats the tomb as a thing that can
  be opened, used, or mocked. Sacrilege means the dead are still inside the cult, not outside it as scenery.


  "Like all Muslims" is the observer''s leveling. Keep the leveling as a date — this is recorded inside
  Islam — and keep the specific gravity. In a mobile world the grave is one of the few fixed points. The
  camp can be abandoned; the tomb cannot be treated as abandoned property. That is why the greeting is
  in passing and the prohibition is absolute. You may not stay. You may not violate.


  Existentially the teaching is that some places are not available for your project. A grave is not a
  resource. If you can turn every fixed point of the dead into use, you have no ancestors, only land.
  Yettôdé said the ancestor legislates a living avoidance. This unit says the ancestor also legislates
  an unmoveable spot. Do not profane it. Greet it, and go.'
