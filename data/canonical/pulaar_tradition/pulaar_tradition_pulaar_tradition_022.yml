- kind: key_terms
  label: Key Terms
  items:
  - term: sacrilège
    definition: sacrilege — profanation of a tomb as a religious crime, not a civic nuisance; the dead
      remain inside the cult
  - term: profaner
    definition: to profane — the opposite of the green-leaf salut; treating the grave as available
  - term: tombe
    definition: tomb — one of the few fixed points in a mobile pastoral world; the camp may be left; this
      may not be used
  - term: trépassés
    definition: those who have gone over — still owed a greeting and a prohibition, not only a memory
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Antigone, the unburied brother
    resonance: Both treat violence to the dead as a religious rupture, not a policy dispute.
    divergence: Antigone defies the city to bury; this unit forbids the living to open what is already
      buried.
  - citation: Serer refusal to treat the dead as mute (this corpus)
    resonance: Both keep the corpse-side of the world under law.
    divergence: Serer law is speech into the ear; Fulɓe law here is a ban on profanation plus a toss of
      green.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, leave one place of the dead untouched that you might have used — a shortcut across a cemetery,
    a joke at a memorial, a photograph for display. Pass, greet if you can, and do not take.
