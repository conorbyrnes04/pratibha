translation_provenance: English is a Pratibha study rendering of a teaching attributed to Rūmī; the Persian
  original was withdrawn pending public-domain verification, so this unit is offered translation-only.
  Some imagery derives from the Dīwān-e Šams rather than the Mathnawī.
