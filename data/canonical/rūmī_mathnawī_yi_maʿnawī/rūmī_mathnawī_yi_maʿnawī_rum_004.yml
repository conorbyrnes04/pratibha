unit_id: rūmī_mathnawī_yi_maʿnawī.rum_004
unit_label: Body and Soul Are Not Hidden — Yet None Has Permission to See the Soul
title: Body and Soul Are Not Hidden — Yet None Has Permission to See the Soul
unit_type: sutra
sanskrit_devanagari: 'سرِّ من از نالهٔ من دور نیست /// لیک چشم و گوش را آن نور نیست

  تن ز جان و جان ز تن مستور نیست /// لیک کس را دیدِ جان دستور نیست'
sanskrit_iast: See Original.
translation_literal: My secret is not far from my cry — but eye and ear lack that light. Body is not veiled from soul, nor
  soul from body — yet none is authorized to see the soul.
commentary: 'Intimacy of body-soul is given; visionary permission is not. Existentially: stop demanding proof of the soul
  as an object; attend the cry that already speaks it. The reed is the human spirit cut from the divine reed-bed; complaint
  is theology in the mode of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: Intimacy of body-soul is given; visionary permission is not.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel the cut from the bed.
  Do not explain it — let the tone complain.
