unit_id: rūmī_mathnawī_yi_maʿnawī.rum_002
unit_label: Whoever Is Far from Their Origin Seeks Return
title: Whoever Is Far from Their Origin Seeks Return
unit_type: sutra
sanskrit_devanagari: 'سینه خواهم شَرحه شَرحه از فراق /// تا بگویم شرح درد اشتیاق

  هر کسی کو دور ماند از اصلِ خویش /// باز جوید روزگارِ وصل خویش'
sanskrit_iast: See Original.
translation_literal: I want a breast torn open by parting, so I may explain the pain of longing. Whoever
  stays far from their own origin seeks again the time of union.
commentary: 'Distance from origin generates the search for reunion. The contested claim is that longing
  is not accidental psychology but structural. Existentially: ask what "origin" your current ache is pointing
  toward. The reed is the human spirit cut from the divine reed-bed; complaint is theology in the mode
  of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: Distance from origin generates the search for reunion.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel
  the cut from the bed. Do not explain it — let the tone complain.
