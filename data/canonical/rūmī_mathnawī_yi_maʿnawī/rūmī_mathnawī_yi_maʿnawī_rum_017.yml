unit_label: The Mirror-Heart Receives Infinite Form
title: The Mirror-Heart Receives Infinite Form
unit_type: sutra
sanskrit_devanagari: 'بعد از آن آمد به سوی رومیان /// پرده را بالا کشیدند از میان

  عکس آن تصویر و آن کردارها /// زد بر این صافی شده دیوارها

  هر چه آن جا دید اینجا به نمود /// دیده را از دیده خانه می‌ربود

  رومیان آن صوفیانند ای پدر /// بی‌ز تکرار و کتاب و بی‌هنر

  لیک صیقل کرده‌اند آن سینه‌ها /// پاک از آز و حرص و بخل و کینه‌ها

  آن صفای آینه وصف دل است /// کاو نقوش بی‌عدد را قابل است

  صورت بی‌صورت بی‌حد غیب /// ز آینه‌ی دل تافت بر موسی ز جیب

  عقل اینجا ساکت آمد یا مضل /// ز آنکه دل با اوست یا خود اوست دل'
sanskrit_iast: See Original.
translation_literal: 'Afterward he came toward the Greeks; the curtain was raised from between them. The
  reflection of those images and those works struck upon these walls that had become polished. Whatever
  he saw there appeared here more beautifully—it took the eye away from the eye''s dwelling-place. The
  Greeks, O father, are the Sufis: without repetition and books and without acquired skill. But they have
  burnished those breasts, clean of greed and avarice and miserliness and hatreds. That purity of the
  mirror is the description of the heart—for it is receptive to forms without number. The formless, infinite
  Form of the Unseen shone forth from Moses''s breast upon the mirror of the heart. Here intellect becomes
  silent or goes astray—because the heart is with Him, or rather it is He.'
commentary: 'Sufism is redefined as burnished breast, not erudition. The heart as unbounded mirror receives
  what heaven cannot contain. The climax risks identity language: the heart is with God, or is God — a
  flash of union that must not become slogan. Existentially: polish one envy or hatred until something
  can reflect that you did not paint.


  Key Terms


  **آینه‌ی دل** — mirror of the heart.


  **صورت بی‌صورت** — formless form; the Unseen''s paradox.


  **صفا ṣafā** — purity/clarity of the mirror.


  Cross-Tradition Resonances


  **Eckhart (God writing on blank tablet):** Both need a cleared receptacle for the Absolute.

  *Divergence:* Eckhart''s tablet awaits inscription; Rūmī''s mirror reflects already-painted forms more
  truly.


  **Know Yourself / Balyānī (only the One is):** Both press heart-identity language.

  *Divergence:* Balyānī is more absolute in denying otherness; Rūmī keeps the narrative of polish and
  reflection.'
insight: Sufism is redefined as burnished breast, not erudition.
practice: 'Sit facing a wall or closed eyes. Imagine burnishing the breast once per breath — greed, haste,
  resentment as rust. End with: may what I did not paint appear.'
