title: God Rebukes Moses — You Came to Unite, Not Divide
unit_type: sutra
sanskrit_devanagari: 'تو برای وصل کردن آمدی /// یا برای فَصل کردن آمدی؟

  تا توانی پا مَنِه اندر فَراق /// اَبْغَضُ الْاَشْیاء عِندي الطَّلاق

  هر کسی را سیرتی بنهاده‌ام /// هر کسی را اصطلاحی داده‌ام

  ما بَری از پاک و ناپاکی همه /// از گِرانجانی و چالاکی همه

  ما زبان را نَنْگریم و قال را /// ما روان را بنگریم و حال را

  ناظرِ قلبیم اگر خاشِع بوَد /// گرچه گفتِ لَفظ، ناخاضِع رُوَد

  زانک دل جَوهر بوَد، گفتن عَرَض /// پس طُفَیل آمد عَرَض، جَوهرْ غَرَض

  چند ازین اَلفاظ و اِضْمار و مَجاز؟ /// سوزْ خواهمْ سوز، با آن سوزْ ساز'
sanskrit_iast: See Original.
translation_literal: Did you come to unite or to separate? As much as you can, do not set foot in separation
  — 'The most hateful of things to Me is divorce.' I have appointed for each person a disposition, I have
  given to each person a manner of expression. We are free from all purity and impurity, from all sluggishness
  and agility. We do not look at the tongue and the words, We look at the soul and the state. We regard
  the heart — whether it is humble, even though the verbal expression may proceed without humility. For
  the heart is substance, speech is accident; thus accident is subsidiary, substance is the goal. How
  long these words and implications and metaphors? I want burning, burning — make accord with that burning.
commentary: 'God''s rebuke relocates criteria from verbal purity to relational effect: unite or divide.
  Existentially: measure speech by whether it joins or splits lovers from the Beloved.


  Key Terms


  **حال / قال ḥāl / qāl** — state / speech.


  **سوز sūz** — burning.


  **ملت عشق** — the creed/community of love.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9 (even a leaf offered with devotion):** Both privilege sincere offering over formal
  perfection.

  *Divergence:* The Gītā keeps varṇa-dharma frames; Rūmī''s love-creed speaks across forms.


  **Eckhart (silence / not naming detachment):** Both warn that correct speech can spoil intimacy.

  *Divergence:* Eckhart''s worry is exiting the ground by naming; Rūmī''s is shaming the lover''s tongue.'
insight: 'God''s rebuke relocates criteria from verbal purity to relational effect: unite or divide.'
practice: Pray for one minute in deliberately simple, even "crude" language of care. Then sit one minute
  in burning without words. Notice which felt more true.
