unit_id: rūmī_mathnawī_yi_maʿnawī.rum_005
unit_label: This Cry Is Fire, Not Wind — Without That Fire, Be Nothing
title: This Cry Is Fire, Not Wind — Without That Fire, Be Nothing
unit_type: sutra
sanskrit_devanagari: 'آتش است این بانگِ نای و نیست باد /// هر که این آتش ندارد نیست باد

  آتش عشق است کاندر نی فتاد /// جوشش عشق است کاندر میْ فتاد'
sanskrit_iast: See Original.
translation_literal: This sound of the reed is fire, not wind; whoever does not have this fire, may he
  not exist. It is love's fire that fell into the reed; it is love's ebullition that fell into the wine.
commentary: 'The nay''s breath is love''s fire, not mere air. Existentially: check whether your speech
  carries heat or only clever wind. The reed is the human spirit cut from the divine reed-bed; complaint
  is theology in the mode of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: The nay's breath is love's fire, not mere air.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel
  the cut from the bed. Do not explain it — let the tone complain.
