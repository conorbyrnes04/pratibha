title: Moses Condemns the Shepherd as Unbeliever
unit_type: sutra
sanskrit_devanagari: 'گفت با آنکس که ما را آفرید /// این زمین و چرخ ازو آمد پدید

  گفت موسی های بس مُدبِر شدی /// خود مسلمان ناشده کافر شدی

  این چه ژاژست این چه کفرست و فُشار /// پنبه‌ای اندر دهان خود فشار

  گفت ای موسی دهانم دوختی /// وز پشیمانی تو جانم سوختی

  جامه را بدرید و آهی کرد تفت /// سر نهاد اندر بیابانی و رفت

  وحی آمد سوی موسی از خدا /// بندهٔ ما را ز ما کردی جدا'
sanskrit_iast: See Original.
translation_literal: 'He said to the One who created us: this earth and heavens came into being from Him.
  Moses said: Alas, you have become utterly confused; not yet having become Muslim, you have become an
  unbeliever. What babble is this, what blasphemy and filth? Stuff cotton in your own mouth! He said:
  O Moses, you have sewn my mouth shut, and from remorse you have burned my soul. He tore his garment
  and gave a hot sigh, laid his head down in a wilderness and departed. Revelation came to Moses from
  God: You have separated Our servant from Us.'
commentary: 'Prophetic correctness attacks living intimacy. The contested drama is orthodoxy wounding
  love. Existentially: where do you police others'' language of God?


  Key Terms


  **حال / قال ḥāl / qāl** — state / speech.


  **سوز sūz** — burning.


  **ملت عشق** — the creed/community of love.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9 (even a leaf offered with devotion):** Both privilege sincere offering over formal
  perfection.

  *Divergence:* The Gītā keeps varṇa-dharma frames; Rūmī''s love-creed speaks across forms.


  **Eckhart (silence / not naming detachment):** Both warn that correct speech can spoil intimacy.

  *Divergence:* Eckhart''s worry is exiting the ground by naming; Rūmī''s is shaming the lover''s tongue.'
insight: Prophetic correctness attacks living intimacy.
practice: Pray for one minute in deliberately simple, even "crude" language of care. Then sit one minute
  in burning without words. Notice which felt more true.
