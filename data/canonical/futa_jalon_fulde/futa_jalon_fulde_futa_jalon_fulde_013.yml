- kind: translation
  label: Pratibha Translation
  body: The mother Fatima, of Hausa, stood and bowed in prayer, then made the prostration. As she raised
    her head a shot struck the ground on the very spot where her head had touched it. She continued her
    prayer. She did not stop, she did not move, she did not fear, until she had finished.
- kind: commentary
  label: Pratibha Commentary
  body: 'Prayer is not a shelter from the shot. It is a refusal to let the shot become the liturgy. The
    ground takes the ball where the forehead was. She finishes. Fatima of Hausa bows, prostrates; as she
    lifts her head a shot strikes the exact spot her head had touched. She continues. She does not stop,
    move, or fear until she finishes. The contested move is to read this as magic protection or as female
    piety for display. Futa Jalon Fulde — a Hausa woman in a highland war-tradition — gives a phenomenology
