unit_id: futa_jalon_fulde.futa_jalon_fulde_013
unit_label: Trad. I / XX, Fatima of Hausa under fire
title: She Did Not Leave the Prayer
unit_type: verse
commentary: 'Prayer is not a shelter from the shot. It is a refusal to let the shot become the liturgy.
  The ground takes the ball where the forehead was. She finishes. Fatima of Hausa bows, prostrates; as
  she lifts her head a shot strikes the exact spot her head had touched. She continues. She does not stop,
  move, or fear until she finishes. The contested move is to read this as magic protection or as female
  piety for display. Futa Jalon Fulde — a Hausa woman in a highland war-tradition — gives a phenomenology
  of attention. The juulde is not a bunker. The shot lands. The liturgy does not incorporate it. She does
  not restart to include the event. She does not narrate. She completes. This is not Futa Toro proverb
  composure, where the heart is not a joint. This is a body that will not let gunfire rewrite the sequence
  of rakʿa. Existentially: finish one act of prayer or attention while a disturbance is happening. Do
  not restart. Do not narrate until you are done. The ground may take what was aimed at you. That is not
  the point. The point is that the shot does not get to be the new imam. dartidaano, dillaano, hulataano:
  three refusals. Stopping, moving, fearing. She withholds all three until timmini, finished.'
