- kind: key_terms
  label: Key Terms
  items:
  - term: juulde
    definition: ritual prayer (Fulde for ṣalāt) — a sequence that can be finished; English 'prayer' is
      too vague
  - term: tufi
    definition: she prostrated — the forehead on the ground that the shot then occupies
  - term: hulataano
    definition: she did not fear — a negative that is conduct, not a feeling-claim
  - term: timmini
    definition: she finished, completed — the whole teaching in a perfective; 'continued' would still
      be during
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dhammapada 25, by effort the wise man makes an island that no flood can overwhelm
    resonance: Both keep a completed inner sequence against a surrounding violence.
    divergence: The Dhammapada's island is built by effort over time; Fatima finishes one prayer while
      a shot takes the ground.
  - citation: Marcus Aurelius, Meditations 5.20, the impediment to action advances action
    resonance: Both refuse to let an obstacle rewrite the act.
    divergence: Marcus converts obstacle into material; Fatima does not convert the shot at all. She simply
      finishes.
- kind: practice
  label: Practice (Abhyasa)
  body: Finish one act of prayer or attention while a disturbance is happening in the room. Do not restart.
    Do not narrate the disturbance until you are done.
