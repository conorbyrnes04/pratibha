  cultural_context: Futa Jalon (Fuuta Jaloo, Guinea highlands). Reichardt collected from Futa Jalon speakers.
    The three traditions are (I) wars of Sheikh al-Ḥājj Umar of Futa, (II) origin of the Pulo nation from
    Fezzan, (III) war of Alfa Muhammed Juhe of Masina with Imams Omar and Ibrahim. Scripture appendix
    is missionary — not ingested. Orthography is Reichardt's 1876 Latin plate, not modern Pular ɓ ɗ ƴ
    ŋ. OCR of the IA Google scan is damaged; Fulde lines are cleaned reconstructions of Reichardt's transcription
    of the key sentence, not a new critical edition.
