- kind: key_terms
  label: Key Terms
  items:
  - term: ɓerɗe
    definition: breasts / hearts (pl. of ɓernde) — inner organs of feeling made clean; English 'hearts'
      is too sentimental; 'breasts' keeps the body
  - term: laaɓi
    definition: became clean, cleared — a completed inner washing; 'reconciled' is a diplomatic gloss
      that hides the washing
  - term: huɗo
    definition: grass — the land's ordinary cover; its refusal is the archive
  - term: hakkunde-maɓɓe
    definition: between them — the gap the sheikh enters; peace is a location before it is a mood
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B5, they purify themselves with blood as if one who had stepped in mud were to
      wash with mud
    resonance: Both keep a stain that washing-talk will not erase.
    divergence: Heraclitus mocks ritual detergent; Fulde lets the earth refuse grass as a witness that
      peace happened and the wound remains.
  - citation: Yoruba òwe, 'Peace is the father of friendship'
    resonance: Both rank peace as a generative power, not a mood.
    divergence: The òwe fathers friendship; this tradition scars the ground. One is kinship-proverb, the
      other highland war-memory.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand between two people who are killing a relation. Do not take a side. Afterward, do not plant
    over the wound as if it never happened.
