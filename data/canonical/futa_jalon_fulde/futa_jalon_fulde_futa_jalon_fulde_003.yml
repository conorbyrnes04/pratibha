- kind: translation
  label: Pratibha Translation
  body: He got in between them and exhorted them and prevented them from fighting until there were clean
    breasts between them. Until this day grass does not grow on the spot where the fight took place.
- kind: commentary
  label: Pratibha Commentary
  body: 'Peace is a power, not a mood. The ground keeps the wound after the men stop. Umar gets between
    Hausa and Bornu, exhorts, prevents fighting, until ɓerɗe laaɓi — clean breasts — exist between them.
    Then the tradition adds a geographic remainder: until this day grass does not grow on the spot. The
    contested move is to treat reconciliation as a feeling that evaporates when the speech ends. Futa
    Jalon Fulde makes peace a force that enters a gap and leaves a scar on the earth. Clean breasts are
    an inner clearing. The bare patch is the outer archive. The men can go home. The ground will not pretend.
    This is highland war-memory, not a Senegal-valley mallol about small acts returning. Reichardt''s
    informants keep the place as a witness. Existentially: when you stop a killing, do not plant immediately
    over the site as if the relation were never wounded. The teaching is against both endless feud and
