- kind: key_terms
  label: Key Terms
  items:
  - term: defte
    definition: books (pl. of deftere, from Arabic daftar) — copies as irreplaceable objects, not 'knowledge'
      in the abstract
  - term: almuudo
    definition: pupil, student — the one who carries the sheikh on his back; English 'disciple' is too
      churchy
  - term: yaltude
    definition: to come out — grief as a refusal of the doorway
  - term: mbuli
    definition: were burned — a completed destruction; 'lost' is too mild
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuāngzǐ, wheelwright Bian, the knack that cannot be put in the book
    resonance: Both split the living knower from the copy.
    divergence: Zhuāngzǐ distrusts the book; Umar grieves the copies because this highland cannot replace
      them, then sends for paper.
  - citation: Lal Ded, vakhs on the house burned and the self remaining
    resonance: Both refuse to let a burned house be the end of the speaker.
    divergence: Lal burns the inner house as liberation; Umar sits in a burned library and must be carried
      out, then trusts God by restocking.
- kind: practice
  label: Practice (Abhyasa)
  body: 'If a work of yours is destroyed today, name both truths: you can make another, and this one cannot
    be replaced. Then send for paper.'
