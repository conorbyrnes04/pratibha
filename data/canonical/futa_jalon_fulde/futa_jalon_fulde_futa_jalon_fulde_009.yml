- kind: translation
  label: Pratibha Translation
  body: 'He sat in his house and would not come out. He said: why should I come out, seeing that my books
    are all burned? A pupil took him on his back and said: it is you who have written all these books,
    and if God will you may still write others. He answered: you speak truly, but books like these cannot
    be had in this country. After that he trusted in God.'
