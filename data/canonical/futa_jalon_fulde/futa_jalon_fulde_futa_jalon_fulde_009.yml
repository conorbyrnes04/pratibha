unit_label: Trad. I / XX, books burned at Jugunko
title: Why Should I Come Out
unit_type: verse
commentary: 'Grief for books is not vanity. The pupil''s move is correct and incomplete: the writer can
  write again, and also these copies cannot be had here. Trust in God is not a shrug. It is sending money
  and paper to Timbuktu. After the burning at Jugunko, Umar will not come out. Why should I, seeing that
  my books are all burned? A pupil carries him on his back: you wrote these; if God wills you can write
  others. Umar: you speak truly, but books like these cannot be had in this country. Then he trusts God.
  The contested move is to treat the loss of a library as either pride or as nothing. Futa Jalon Fulde
  keeps both truths in one exchange. The writer is not the copies. The copies are not replaceable in this
  highland. Trust that follows is practical: paper from Timbuktu, not a smile. Futa Toro Pulaar will proverbialize
  inheritance as milk. Here the inheritance is a burned room and a pupil''s back. Existentially: if a
  work of yours is destroyed, name both: you can make another, and this one cannot be replaced. Then send
  for paper. Do not call the sending a lack of faith. The sending is the faith. The pupil is right that
  the writer remains. The sheikh is right that this country cannot reprint what burned. Both sentences
  are the teaching.'
