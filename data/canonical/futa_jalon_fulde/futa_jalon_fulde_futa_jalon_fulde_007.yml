- kind: key_terms
  label: Key Terms
  items:
  - term: laamu aduna
    definition: kingdom / rule of this world — Arabic dunyā in Fulde; 'politics' is too secular; this
      is the chair that incurs sin
  - term: bakkatuuji
    definition: sins, faults (Arabic via Fulde) — borne by the two who wanted the chair, not by the soldiers
      only
  - term: ronndata
    definition: will inherit / bear — the sins as a load passed to the claimants
  - term: haɓa-taa
    definition: do not fight — the exhortation that lasts only as long as the body is in sight
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 2.47, you have a right to action, not to the fruit
    resonance: Both uncouple the fight from the chair it wants.
    divergence: The Gītā keeps Arjuna in the war; Fulde tells two Imams their war-for-kingship is already
      the sin, and the guns restart when the sheikh leaves.
  - citation: Gospel of Thomas 81, let him who has become rich reign, and let him who has power renounce
    resonance: Both treat worldly rule as a spiritual emergency.
    divergence: Thomas asks renunciation of power; this scene shows power resuming the instant the witness
      is out of sight.
- kind: practice
  label: Practice (Abhyasa)
  body: Today refuse to let two people use you as a pause in their fight. If they only stop while you
    stand there, name that. Do not call it peace.
