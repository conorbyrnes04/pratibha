- kind: translation
  label: Pratibha Translation
  body: He went between them and exhorted them not to fight each other on account of the kingdom of this
    world. He told them that they would each have to bear the sins of those who fight on either side on
    their account. They put aside their guns until he was out of sight; then they began to fire again.
