unit_label: Trad. I / XX, Omar and Suri fighting for the kingdom
title: The Kingdom of This World
unit_type: verse
commentary: 'The sin of a war for kingship stays with the two who wanted the chair. Presence stops the
  guns; absence restarts them. A peace that needs your body in the gap is not yet a peace. Umar goes between
  Omar and Suri, exhorts them not to fight for laamu aduna, the kingdom of this world, and tells each
  he will bear the sins of those who fight on his account. They put the guns aside until he is out of
  sight; then they fire again. The contested move is to call the pause peace. Futa Jalon Fulde is brutal
  here. The sheikh''s body is a temporary law. When the body leaves, the chair-hunger returns. The sins
  do not leave with him. They stay on the two who wanted the kingdom. This is highland Imam-war, not Futa
  Toro cattle-proverb. Reichardt''s tradition names the guns and the sight-line. Existentially: if two
  people only stop while you stand there, you are not a peacemaker. You are a pause. Name that. Do not
  let them use your presence as a moral alibi. Peace is what continues after you are gone. Until then,
  you are grass in a gap, and they are waiting. The teaching is against both the romance of the mediator
  and the innocence of the claimants. The chair is the sin. The pause is not the cure.'
