- kind: key_terms
  label: Key Terms
  items:
  - term: konngol
    definition: word, utterance, the given teaching — not vocabulary; English 'word' is too thin; this
      is the sentence you are forbidden to edit
  - term: waylaaki
    definition: did not change, did not turn — a hard negative; 'was faithful' adds a mood the Fulde does
      not gild
  - term: dubi jeeɗiɗi
    definition: seven years — duration as credential; English 'apprenticeship' is a trade; this is time
      spent not altering a word
  - term: hoore-makko
    definition: his head / himself — the self given over; 'devotion' is too pious; this is the head placed
      in the teacher's house
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gaden, Pulaar Texts, Mallol 145, 'What the Cow Ate, the Heifer Suckles' (Futa Toro)
    resonance: Both make transmission bodily rather than certificated.
    divergence: The mallol is milk in a Senegal-valley proverb dialect; this is seven years of unchanged
      speech in Futa Jalon Fulde narrative. Do not collapse the dialects.
  - citation: Bhagavad Gītā 4.34, approach the knower with homage and service
    resonance: Both put service before the handing-on of knowledge.
    divergence: The Gītā names inquiry as a third; here the only named act is not changing the word.
- kind: practice
  label: Practice (Abhyasa)
  body: Keep one teacher's word unchanged for seven days. Do not improve it.
