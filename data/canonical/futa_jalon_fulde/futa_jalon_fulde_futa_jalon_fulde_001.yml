unit_label: Trad. I / XX, service to Muhammed Legali at Medina
title: Seven Years Without Changing the Word
unit_type: verse
commentary: 'Transmission is not a certificate. It is seven years of not changing the word. Khalifa is
  given after service, not after talent. Futa Jalon Fulde tells this as a highland war-tradition about
  Umar at Medina under Muhammed Legali, not as a Futa Toro proverb. The contested move is to treat spiritual
  succession as a gift of brilliance. Reichardt''s sentence refuses that. o waylaaki konngol-makko: he
  did not change his word. The word is the teacher''s. Changing it is the student''s first vanity. Talent
  wants to improve the sentence. Service keeps it. Seven years of house-care — every task in the room,
  the self given over — is the only credential the tradition will name. Later Futa Jalon will crown Imams
  and fight for kingship; this unit is the prior ethic. A man who will command armies first spent seven
  years as a servant of a word. Existentially the sentence trains against charismatic shortcut. You do
  not become the next voice by being more gifted than the last voice. You become it by not altering what
  was given, until the giver can trust that the word will survive your mouth. Khalifa is the name for
  that survival, not for your originality. Downriver Futa Toro Pulaar will later proverbialize transmission
  as milk. Highland Fulde here narrates it as duration plus fidelity. Same language family, different
  pedagogy: years in a house, not an image of a cow.'
