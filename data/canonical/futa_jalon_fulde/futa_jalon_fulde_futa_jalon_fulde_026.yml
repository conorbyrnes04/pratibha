  label: Pratibha Translation
  body: 'Modi Ibrahima Kabba said: Almami, sit; anything that will be sufficient for you will do for all
    of us. Fear ye not; the blessings of our elders are left to us; their prayers He will answer.'
- kind: commentary
  label: Pratibha Commentary
  body: 'After flight and slaughter, the teaching is hospitality plus inheritance. Sufficiency is shared,
    not ranked. The elders'' blessing is a remainder that still works. Modi Ibrahima Kabba at Kebali says:
    Almami, sit; anything sufficient for you will do for all of us. Fear not; the blessings of our elders
    are left to us; their prayers He will answer. Tradition III — Masina war, flight — ends in a highland
    welcome. The contested move is to treat refugees as a lesser plate and the elders as a finished past.
    Futa Jalon Fulde makes barkewol mawɓe a remainder that still operates. Sufficiency is one measure
    for host and guest. Sit. Do not fear. The prayers of the dead are still being answered. This is not
    Futa Toro milk-transmission; it is blessing as leftover force after a massacre. Existentially: take
    in one person who has fled a failure. Give them what is sufficient for you, not a lesser plate. Say
    the elders'' blessing is still here. The teaching is against both charity-as-hierarchy and the idea
