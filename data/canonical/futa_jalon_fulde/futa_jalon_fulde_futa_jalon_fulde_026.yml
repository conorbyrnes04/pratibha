    a seat, not a speech. luti e amen, left with us: the elders are not gone as force. Their duʿāʾ is
    still a working remainder.'
- kind: key_terms
  label: Key Terms
  items:
  - term: barkewol
    definition: blessing (baraka in Fulde) — a remainder that still works; English 'blessing' is a wish;
      this is leftover force
  - term: mawɓe
    definition: elders, the old ones — the source of the remainder; not 'ancestors' as a cult-name only
  - term: luti
    definition: is left, remains — inheritance as what was not taken by the slaughter
  - term: jooɗee
    definition: sit (imperative) — hospitality as a seat before it is a speech
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gaden, Pulaar Texts, Mallol 145, 'What the Cow Ate, the Heifer Suckles' (Futa Toro)
    resonance: Both transmit a prior generation's substance into the living.
    divergence: The mallol is milk in another dialect's proverb; this is baraka left after flight and
      slaughter in Futa Jalon Fulde. Same family of thought, not the same speech.
  - citation: Yoruba òwe, 'Full-belly child says to hungry-belly child'
    resonance: Both know the temptation of a ranked plate.
    divergence: 'The òwe mocks the full child''s speech; Kabba forbids the ranking in advance: what suffices
      for the Almami suffices for all.'
- kind: practice
  label: Practice (Abhyasa)
  body: Take in one person who has fled a failure. Give them what is sufficient for you, not a lesser
    plate. Say the elders' blessing is still here.
