unit_label: Trad. I / XX, Bello asks a book on Qadiri / Tijani
title: That the Two Paths Not Injure Each Other
unit_type: verse
commentary: 'A second path is not an enemy. Inability to enter one ṭarīqa is not a license to harm. Bello
  asks Umar for a book on the Qadiri people so that those who cannot take the Tijani way will not injure
  themselves, and so that hostile rivalry will not grow. The contested move is to treat a new affiliation
  as a war on the old one. Futa Jalon Fulde, speaking a Tijani sheikh''s diplomacy inside a Qadiri caliphate,
  refuses that war. The book is not a recruitment tract. It is a fence against ƴettude that becomes bone.
  Two West African paths — Qadiriyya already planted, Tijaniyya arriving with Umar — are told here as
  capable of injuring each other, and therefore as needing a written restraint. This is not Futa Toro
  proverb ethics. It is highland-Sokoto path politics in Reichardt''s Latin Fulde. Existentially: name
  the practice you cannot take up. That inability is not a critique of the people who can. It is also
  not a demand that they abandon theirs. The teaching is against both conversion-by-scorn and loyalty-by-mockery.
  A second path in the same town is a test of ɓerɗe, not of victory. The book Bello wants is a peace between
  ways, not a winner.'
