translation_provenance: 'English is a Pratibha rendering (pd_adapted) from C.A.L. Reichardt''s facing
  English in *Grammar of the Fulde Language* (London: Church Missionary House, 1876 — public domain).
  Fulde is Reichardt''s Latin transcription of Futa Jalon traditions (Umar Tal wars from Alfa Muhammed
  Sadi; origin from Muhammed Sadi and Ibrahim Mandinka). This is Futa Jalon Fulde, not Futa Toro Pulaar.
  Does not follow Gaden 1931 or Hampâté Bâ.'
pratibha_layers:
- kind: original
  label: Original
  body: Bello wi'i Omaru yo o winndu deftere fi Qadiri'en yo ɓe waasataa ñiɓtude hakkunde-maɓɓe, yo ɓe
    ɓe mbaawaa ƴettude Tijani ɓe bona hoore-maɓɓe.
- kind: iast
  label: Romanization
  body: Bello wi'i Omaru yo o winndu deftere fi Qadiri'en yo ɓe waasataa ñiɓtude hakkunde-maɓɓe, yo ɓe
    ɓe mbaawaa ƴettude Tijani ɓe bona hoore-maɓɓe.
- kind: translation
  label: Pratibha Translation
  body: Muhammed Bello told Sheikh Omaru to write a book concerning the Qadiri people, exhorting that
    there be no hostile rivalry, that those who are not able to adopt the Tijani path may not injure themselves.
- kind: commentary
  label: Pratibha Commentary
  body: 'A second path is not an enemy. Inability to enter one ṭarīqa is not a license to harm. Bello
    asks Umar for a book on the Qadiri people so that those who cannot take the Tijani way will not injure
    themselves, and so that hostile rivalry will not grow. The contested move is to treat a new affiliation
    as a war on the old one. Futa Jalon Fulde, speaking a Tijani sheikh''s diplomacy inside a Qadiri caliphate,
    refuses that war. The book is not a recruitment tract. It is a fence against ƴettude that becomes
    bone. Two West African paths — Qadiriyya already planted, Tijaniyya arriving with Umar — are told
    here as capable of injuring each other, and therefore as needing a written restraint. This is not
    Futa Toro proverb ethics. It is highland-Sokoto path politics in Reichardt''s Latin Fulde. Existentially:
    name the practice you cannot take up. That inability is not a critique of the people who can. It is
