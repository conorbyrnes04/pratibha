    A second path in the same town is a test of ɓerɗe, not of victory. The book Bello wants is a peace
    between ways, not a winner.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ñiɓtude
    definition: hostile rivalry, injurious competition — not 'debate'; the harm of two paths grinding
  - term: ƴettude
    definition: to take up, adopt — the Tijani path as something taken, not as a conquest of the Qadiri
  - term: Qadiri'en / Tijani
    definition: the two ṭarīqas named in Fulde — English 'sects' is a fight-word; here they are paths
      that can injure
  - term: bona hoore-maɓɓe
    definition: injure themselves / spoil their own heads — harm as self-harm, not only as harm to the
      other path
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 4.11, however people approach me, I grant them that path
    resonance: Both refuse to make a second approach an enemy.
    divergence: The Gītā speaks from a divine center; Bello asks a human sheikh to write a fence between
      two orders.
  - citation: Gospel of Thomas 47, no one can mount two horses
    resonance: Both know two ways can tear a person.
    divergence: Thomas forbids double riding; Fulde asks those who cannot take the second horse not to
      injure themselves or the first.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one practice you cannot take up. Do not mock the people who can. Do not require them to mock
    yours.
