- kind: original
  label: Original
  body: mi nanii ɓe mbi'a ko kanko woni ndunngu, ko min woni ceedu. Nde ndunngu ari, on nji'a kala haako
    wonti haako; ko kanko ndunngu, min nganndi ko min ceedu.
- kind: iast
  label: Romanization
  body: mi nanii ɓe mbi'a ko kanko woni ndunngu, ko min woni ceedu. Nde ndunngu ari, on nji'a kala haako
    wonti haako; ko kanko ndunngu, min nganndi ko min ceedu.
- kind: translation
  label: Pratibha Translation
  body: I hear they say he is the rainy season, and of myself that I am the dry season. When the rains
    come you see all the leaves turn green; he is the rainy season, we know we are the dry season.
- kind: commentary
  label: Pratibha Commentary
