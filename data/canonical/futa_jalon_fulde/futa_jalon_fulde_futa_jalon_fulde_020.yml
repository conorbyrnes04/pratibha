unit_label: Trad. I / XX, namesake Imams
title: The Rainy Season and the Dry
unit_type: verse
commentary: 'Two powers, one namesake. He accepts the dry name. Green leaves are not the only season that
  is true. Futa Jalon Fulde here thinks climate as political theology. He hears they say the other Imam
  is ndunngu, the rains, and he is ceedu, the dry. When the rains come the leaves turn green; he is the
  rain, we know we are the dry. The contested move is to fight for the green name. Highland Fulde — Guinea''s
  actual rainy and dry seasons as political speech — lets him keep the dry. Futa Toro, down the Senegal,
  has a different flood-calendar and a different proverb-world. Do not collapse them. Here climate is
  how two namesake Imams rank power. Green is visible success. Dry is the season that is also true. Existentially:
  let someone else be the rain today. Keep one dry-season duty that does not compete for green. The teaching
  is against envy of the namesake who makes things look alive. A highland that only honors ndunngu will
  starve in ceedu. Both seasons are the year. Accepting the dry name is already a politics. haako wonti
  haako, every leaf becomes a leaf: the rain''s advertisement. The dry does not advertise. It remains.'
