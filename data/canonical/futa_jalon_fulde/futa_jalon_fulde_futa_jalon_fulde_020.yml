- kind: key_terms
  label: Key Terms
  items:
  - term: ndunngu
    definition: rainy season — the namesake's title as visible increase; English 'prosperity' loses the
      climate
  - term: ceedu
    definition: dry season — the accepted name; not 'failure', a true half of the year
  - term: haako
    definition: leaf, foliage — the rain's proof; green as political theology
  - term: min nganndi
    definition: we know — the dry season's self-knowledge, without contest
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B67, God is day night, winter summer
    resonance: Both make opposed seasons one truth rather than a ranking.
    divergence: Heraclitus's god is the identity of the pair; this Imam accepts being only the dry half.
  - citation: Zhuāngzǐ, the useless and the useful, winter and summer trees
    resonance: Both refuse to let the green season be the only success.
    divergence: Zhuāngzǐ praises the unused; Fulde lets a namesake be rain and still keeps a dry-season
      office.
- kind: practice
  label: Practice (Abhyasa)
  body: Let someone else be the rain today. Keep one dry-season duty that does not compete for green.
