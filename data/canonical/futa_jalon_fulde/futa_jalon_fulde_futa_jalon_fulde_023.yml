- kind: key_terms
  label: Key Terms
  items:
  - term: jibirde
    definition: abode, dwelling-place — assigned, not discovered; English 'home' is preference; this is
      a pointed highland
  - term: Futa Jallo
    definition: Fuuta Jaloo — the Guinea highland as a named destination; not Futa Toro
  - term: du'ani-ɓe
    definition: he prayed for them — the founding act; sending without prayer would be mere geography
  - term: caɗeele
    definition: trouble, difficulty — what drives the asking; origin as flight, not as triumph
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lal Ded, vakh on the true home not being the house you were born in
    resonance: Both uncouple abode from first preference.
    divergence: Lal's home is inner Śiva; Suware points at a highland and prays. One is Kashmiri nakedness,
      the other a Mandinka sending.
  - citation: Genesis 12:1, go to the land I will show you
    resonance: Both found a people by a sending toward an unseen land.
    divergence: Abram is sent by God; Sedi and Seri are sent by a Mandinka wali who also prays. The highland
      is named in advance.
- kind: practice
  label: Practice (Abhyasa)
  body: Ask one living elder where your abode is — not where you prefer. Go as far as that sentence. Do
    not renegotiate the highland.
