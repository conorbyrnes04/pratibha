unit_label: Trad. II / XXI, Suware sends Sedi and Seri
title: There Is Your Abode
unit_type: verse
commentary: 'Origin here is not a blood myth first. It is a sending. A Mandinka wali points two Arab-descended
  men at a highland and prays. Futa Jalon is an assigned home, not a found one. Sedi and Seri come to
  Suware: trouble has befallen our land; we ask a favor. He says go until you reach the country called
  Futa Jallo — there is your abode. He prays for them. The contested move is to treat Futa Jalon as an
  ancestral finding or a conquest-right. Tradition II in Reichardt is origin-speech: a Mandinka holy man
  assigns a highland to two men and prays. Blood may be in the background — Fezzan, Arab descent in the
  larger tale. The sentence that founds the home is a sending plus a duʿāʾ. This is not Futa Toro Pulaar''s
  river-valley self-account, and it is not a Gaden mallol. Do not tell the highland as if it were the
  Senegal floodplain. Existentially: ask one living elder where your abode is — not where you prefer.
  Go as far as that sentence. Do not renegotiate the highland. The teaching is against both romantic wandering
  and blood-myth as first philosophy. Home can be a prayer someone else spoke over a place you had not
  chosen. jibirde, abode, is assigned. The prayer is the legal act.'
