unit_label: Trad. I / XX, Karta conspiracy
title: He Did Not Believe Until It Showed
unit_type: verse
commentary: 'Suspicion is not wisdom. He waits for the showing. The cost is real: people die behind walls
  while he refuses a rumor. The teaching is against both naivete-as-virtue and intelligence-as-accusation.
  His people say Karta will kill us. The Sheikh does not believe until things show out; then he sees the
  truth. The contested move is to treat this delay as either saintly innocence or as culpable stupidity.
  Futa Jalon Fulde keeps the cost and the method. goongɗinaano haa huunde feeñi — he did not assent until
  the thing appeared. Highland war will punish the wait. The tradition still refuses rumor as a sufficient
  cause of action. This is not Futa Toro mallol that truth catches the lie on a road. This is a commander
  who will not move on a story. Existentially: do not act on a warning about people until you have seen
  the thing. If you already believed a rumor, walk it back until it shows. The teaching does not promise
  that waiting is safe. It promises that accusation without appearance is not wisdom. Safety and wisdom
  are not the same office. goonga, the truth, arrives as a showing, not as a clever suspicion confirmed
  in private.'
