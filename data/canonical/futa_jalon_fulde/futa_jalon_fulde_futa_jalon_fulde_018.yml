- kind: key_terms
  label: Key Terms
  items:
  - term: goongɗinaano
    definition: he did not believe / did not assent — withheld credence, not stupidity
  - term: feeñi
    definition: showed out, became apparent — truth as appearance, not as rumor-work
  - term: goonga
    definition: truth — what is seen after the showing; English 'facts' is too forensic
  - term: kaaldi
    definition: they spoke, they told — the rumor as speech, not yet as world
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B1, men fail to understand the logos even after they have heard it
    resonance: Both wait on a showing that speech is not yet.
    divergence: Heraclitus' logos is always already there; Umar will not treat a warning as a showing
      until the thing appears.
  - citation: Gospel of Thomas 5, know what is in front of your face and what is hidden will be revealed
    resonance: Both bind knowledge to what is in front.
    divergence: Thomas promises a reveal from facing; Fulde pays a war-cost for refusing to act on what
      is only said.
- kind: practice
  label: Practice (Abhyasa)
  body: Today do not act on a warning about people until you have seen the thing. If you already believed
    a rumor, walk it back until it shows.
