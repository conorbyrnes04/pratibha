unit_label: Trad. II / XXI, council after Talansan
title: The War Is Not Legal Without a King
unit_type: verse
commentary: 'Violence that wants to call itself jihad requires a named political form. Futa Jalon refuses
  freelance sacred war. The king is a legal condition, not a prize. After Talansan they meet to choose
  a king, because jihadi hasataa e ɓawa lamɗo — the war with infidels is not legal without a king. Their
  head man says crown the Alfa of Timbo. The contested move is to treat the crown as loot from the war.
  Highland Fulde inverts the order: first a named responsible person, then the war may call itself jihad.
  Without a lamɗo the same fighting is illegal even to those who want it. This is Futa Jalon''s political
  theology of Imamship, not Futa Toro proverb kingship — a king is not a comrade — and not a Senegal-valley
  mallol. Existentially: do not join a fight that has no named responsible person. If you are asked to
  fight, ask who is king of it. If no one is, leave. The teaching is against both anarchic holy war and
  the romance of the leaderless cause. A name you can hold to account is the minimum legality. The Alfa
  of Timbo is that name, not a trophy. The drum-cut of the previous unit is what this council is trying
  to make unrepeatable. hasataa, is not legal: the war''s own jurists refuse the freelance.'
