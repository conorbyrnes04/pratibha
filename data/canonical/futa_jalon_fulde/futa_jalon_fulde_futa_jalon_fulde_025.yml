- kind: key_terms
  label: Key Terms
  items:
  - term: jihadi
    definition: jihad, the war that wants a sacred name — illegal here without a king; English 'crusade'
      is the wrong religion
  - term: lamɗo
    definition: king — a legal condition of the war, not its prize
  - term: hasataa
    definition: is not legal, does not befit — a juristic negative; 'should not' is too mild
  - term: kawritii
    definition: they met, they assembled — deliberation as the form that makes a king, not a battlefield
      acclamation
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Marcus Aurelius, Meditations 1.14, on a polity in which there is the same law for all
    resonance: Both make a named political form the condition of legitimate force.
    divergence: Marcus remembers a Stoic cosmopolis; Fulde requires an Imam of Timbo before the highland
      war may call itself jihad.
  - citation: Gaden, Pulaar Texts, 'A Father's Counsel' (Futa Toro), a king is not a comrade
    resonance: Both refuse to confuse kingship with intimacy.
    divergence: Gaden's mallol is Futa Toro warning against false nearness to a king; this is Futa Jalon
      requiring a king so that war can be legal. Different dialect, opposite office of the crown.
- kind: practice
  label: Practice (Abhyasa)
  body: Do not join a fight that has no named responsible person. If you are being asked to fight, ask
    who is king of it. If no one is, leave.
