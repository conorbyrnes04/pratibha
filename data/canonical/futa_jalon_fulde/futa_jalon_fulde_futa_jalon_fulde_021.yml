  label: Pratibha Translation
  body: 'He filled a vessel with little stones and walked with it softly; he did not lose any. He filled
    another and ran; he lost the stones right and left. He said: whoever moves now resembles the first;
    whoever leaves it until he is driven by force is the second.'
