unit_label: Trad. I / XX, Bundu must move
title: The Vessel of Stones
unit_type: verse
commentary: 'Timing is the teaching, not the destination. Bundu refused and later moved with confusion
  — cows, goods, people lost in the forest. The parable was already the mercy. He fills a vessel with
  small stones, walks softly, loses none. He fills another, runs, loses stones right and left. Whoever
  moves now is the first; whoever waits until driven by force is the second. The contested move is to
  hear this as a travel tip. Futa Jalon Fulde makes a njoru of kaaƴe into a theology of when. Bundu''s
  later panicked move is the second vessel already proven. The parable was the mercy they refused. This
  is highland counsel to a neighboring land, not a Futa Toro rope-and-well proverb, though both think
  in containers. Existentially: move one thing you will otherwise be forced to move. Carry it walking,
  not running. The teaching is against both premature flight and the pride of staying until the forest
  takes the cows. Soft walking is not slowness as virtue. It is the only pace at which the stones stay
  in the vessel. Force will make you run. Running is already the loss. e jam, in peace: the first vessel''s
  pace. sembe, force: the second''s driver. Choose the pace while you still can.'
