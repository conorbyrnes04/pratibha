- kind: key_terms
  label: Key Terms
  items:
  - term: njoru
    definition: vessel, container — the life that can hold or spill; English 'plan' is too mental
  - term: kaaƴe
    definition: stones, pebbles — the goods of a move; small, easy to lose at a run
  - term: e jam
    definition: in peace, softly — the pace that keeps the stones; not 'calmly' as mood
  - term: sembe
    definition: force, power — what drives the second vessel; the run is already the spill
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dhammapada 21, heedfulness is the path to the deathless
    resonance: Both make timing of attention the difference between keeping and spilling.
    divergence: The Dhammapada's heed is a path; Fulde's heed is a walking pace with a vessel of stones.
  - citation: Marcus Aurelius, Meditations 4.26, each thing is done in its season
    resonance: Both refuse a forced out-of-season act.
    divergence: Marcus's season is inner assent; this parable is a highland people who will lose cows
      in a forest if they wait for force.
- kind: practice
  label: Practice (Abhyasa)
  body: Move one thing you will otherwise be forced to move. Carry it walking, not running.
