    is a seat of power. The wall is.'
- kind: key_terms
  label: Key Terms
  items:
  - term: yanaande
    definition: tomb, grave — the death-side of the interval; English 'shrine' gilds it; this is a burial
  - term: minbar
    definition: pulpit (Arabic minbar) — the speech-side; not a throne, a step from which one exhorts
  - term: hakkunde
    definition: between, in the interval — the philosophical place; English 'among' loses the two poles
  - term: Waʿaz
    definition: admonition, exhortation (Arabic waʿẓ) — a genre of counsel, not of decree; 'sermon' is
      too ecclesiastical
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Marcus Aurelius, Meditations 2.17, life as a sojourn between birth and death
    resonance: Both locate the work of a life in an interval, not on a throne.
    divergence: Marcus writes the interval as Stoic physics; Fulde writes it as a body leaning between
      tomb and pulpit.
  - citation: Gospel of Thomas 42, 'Be passers-by'
    resonance: Both refuse to settle teaching into an office.
    divergence: Thomas's passer-by has no monument; Umar sits between two of the Prophet's monuments and
      still will not take a chair.
- kind: practice
  label: Practice (Abhyasa)
  body: Write one counsel sitting between a death you know and a speech you owe. Do not sit on a chair
    of rank.
