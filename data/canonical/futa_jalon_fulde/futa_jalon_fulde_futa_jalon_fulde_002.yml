unit_label: Trad. I / XX, composition at the Prophet's tomb
title: Between the Tomb and the Pulpit
unit_type: verse
commentary: 'The book is written in the interval between grave and pulpit — death and speech. Teaching
  is not a throne. Umar sits hakkunde yanaande Annabi e minbar, between the Prophet''s tomb and the minbar,
  back against the wall. The architecture is the argument. He does not sit on the pulpit. He does not
  lie in the grave. He occupies the interval. The contested move is to treat composition as an ascent
  to a chair. Futa Jalon Fulde locates the finished book in a posture of leaning, not of ruling. The title
  he gives it — Waʿaz, admonition to those who desire right — is already a refusal of throne-speech. Admonition
  addresses desire, not subjects. Reichardt''s highland tradition is not Futa Toro proverb-speech; it
  is a travel-narrative of a Tijani sheikh writing at the Prophet''s house. The wall takes his back. The
  two monuments take his sides. What is produced there is counsel for people who wish to follow God, not
  a manifesto of office. Existentially: every teaching you write sits somewhere. If it sits on rank, it
  is already a different book. The interval between a death you know and a speech you owe is the only
  honest desk. The grave keeps you from inflation. The pulpit keeps you from silence. Neither is a seat
  of power. The wall is.'
