    he will miss — not because he lost, because he was made comfortable.'
- kind: key_terms
  label: Key Terms
  items:
  - term: aduna
    definition: this world (Arabic dunyā) — the comforter; English 'world' is too neutral; this is the
      ease that misplaces
  - term: laakara
    definition: the other world, the hereafter — where he fears he will not be found
  - term: newn-ii-mi
    definition: has made me comfortable / eased me — victory as softness, not as glory
  - term: aljanna
    definition: the garden, paradise — the place comfort might cost; 'heaven' is too generic
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Marcus Aurelius, Meditations 6.30, take care not to be Caesarified
    resonance: Both treat success as the moment of spiritual danger.
    divergence: Marcus warns against imperial coloring; Umar weeps that comfort may hide him from God.
  - citation: Bhagavad Gītā 2.38, treat pleasure and pain, gain and loss alike
    resonance: Both uncouple victory from spiritual location.
    divergence: The Gītā asks evenness in the act; Fulde shows tears after the win as the evenness that
      is still possible.
- kind: practice
  label: Practice (Abhyasa)
  body: After one success today, do not celebrate first. Ask whether this comfort has hidden you. If yes,
    do one hidden act that cannot be posted.
