unit_label: Trad. I / XX, tears entering Dengerabe
title: He Weeps After Victory
unit_type: verse
commentary: 'Victory is the danger. Comfort is the spiritual emergency. He does not weep for the dead
  of Minyin in this sentence; he weeps that success might misplace him relative to God. Entering Dengerabe
  they see him in tears. Why does he weep — he went to war, he won? He says the world has made him comfortable,
  and he fears God may not find him in the other world, not in heaven. The contested move is to read the
  tears as compassion for the slain or as performance. Futa Jalon Fulde gives a harder reading: aduna
  has eased him. Ease is the threat. laakara, the other world, may not contain him if comfort has already
  placed him. Highland jihad here is not Futa Toro proverb about God having other than leaves for the
  couscous. It is a sheikh crying that success is a misplacement. Existentially: after one success, do
  not celebrate first. Ask whether this comfort has hidden you. If yes, do one hidden act that cannot
  be posted. The teaching is against victory-as-proof. The war can be won and the soul lost in the same
  afternoon. The tears are the only accurate report. aljanna, the garden, is named as the place he fears
  he will miss — not because he lost, because he was made comfortable.'
