translation_provenance: 'English is a Pratibha rendering (pd_adapted) from C.A.L. Reichardt''s facing
  English in *Grammar of the Fulde Language* (London: Church Missionary House, 1876 — public domain).
  Fulde is Reichardt''s Latin transcription of Futa Jalon traditions (Umar Tal wars from Alfa Muhammed
  Sadi; origin from Muhammed Sadi and Ibrahim Mandinka). This is Futa Jalon Fulde, not Futa Toro Pulaar.
  Does not follow Gaden 1931 or Hampâté Bâ.'
pratibha_layers:
- kind: original
  label: Original
  body: 'ɓe nji''i o wuli gite naatoyde saare. Ɓe wi''i: ko waɗi Al Hajji o wuli, o haɓii o dañii? O wi''i:
    ko wuli-mi ko mi miijii no aduna newn-ii-mi; mi huli Allah heɓataa-mi e laakara, wonaa e aljanna.'
- kind: iast
  label: Romanization
  body: 'ɓe nji''i o wuli gite naatoyde saare. Ɓe wi''i: ko waɗi Al Hajji o wuli, o haɓii o dañii? O wi''i:
    ko wuli-mi ko mi miijii no aduna newn-ii-mi; mi huli Allah heɓataa-mi e laakara, wonaa e aljanna.'
- kind: translation
  label: Pratibha Translation
  body: 'They saw that he was moved to tears as he entered the town. They said: what is the matter with
    Al Hajji — he went to war, he was victorious, why does he weep? He said what moved him to tears was
    that the world had made him comfortable, and he fears God may not find him in the other world, not
    in heaven.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Victory is the danger. Comfort is the spiritual emergency. He does not weep for the dead of Minyin
    in this sentence; he weeps that success might misplace him relative to God. Entering Dengerabe they
    see him in tears. Why does he weep — he went to war, he won? He says the world has made him comfortable,
    and he fears God may not find him in the other world, not in heaven. The contested move is to read
    the tears as compassion for the slain or as performance. Futa Jalon Fulde gives a harder reading:
    aduna has eased him. Ease is the threat. laakara, the other world, may not contain him if comfort
    has already placed him. Highland jihad here is not Futa Toro proverb about God having other than leaves
