- kind: key_terms
  label: Key Terms
  items:
  - term: ngondi
    definition: we are tired, we are exhausted — a bodily fact allowed to stop a charge
  - term: en jooɗo
    definition: let us sit — the sheikh included; English 'rest' is a break; this is a shared sitting
  - term: golle
    definition: guns (here) — the tool that will not fire if God is unwilling; will is not in the metal
  - term: sembe Allah
    definition: the power of God — what you see when you sit instead of charging
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuāngzǐ, Cook Ding, the pause in the joints of the ox
    resonance: Both make a pause the first skill, not a failure of nerve.
    divergence: Cook Ding's pause is craft inside a carcass; the sheikh's sit is command inside a tired
      army.
  - citation: Marcus Aurelius, Meditations 6.13, on not being a puppet pulled by impulse
    resonance: Both refuse to let urgency be identical with right action.
    divergence: Marcus trains inner delay; Fulde sits the whole troop down and waits on whether the gun
      will even fire.
- kind: practice
  label: Practice (Abhyasa)
  body: When a necessary work meets real tiredness today, sit down with the tired people. Do not give
    a speech. Do not call sitting surrender.
