- kind: translation
  label: Pratibha Translation
  body: 'The soldiers said to Al Hajji that they are tired; the Sheikh said they must fight; they say
    they are tired. The Sheikh said: if you are tired, well, let us sit down; you see the power of God;
    you know your gun won''t give fire if God be unwilling.'
- kind: commentary
  label: Pratibha Commentary
  body: 'He does not shame tired men into a charge. He sits. The gun is not a will. This is not quietism;
    after the sitting he prays, and the war continues by another gate. The first move with exhaustion
