unit_label: Trad. I / XX, soldiers tired at Minyin
title: If You Are Tired, Sit Down
unit_type: verse
commentary: 'He does not shame tired men into a charge. He sits. The gun is not a will. This is not quietism;
  after the sitting he prays, and the war continues by another gate. The first move with exhaustion is
  to sit. Soldiers at Minyin say they are tired. The Sheikh says they must fight. They repeat they are
  tired. He says: if you are tired, well, let us sit down; you see the power of God; you know your gun
  will not fire if God is unwilling. The contested move is to hear sitting as surrender or as a trick.
  Futa Jalon Fulde lets the sheikh join the tiredness. en jooɗo — let us sit — includes him. The gun''s
  misfire is theologized, not as an excuse to quit the campaign, but as a limit on will. Later the war
  finds another gate. The first move remains the sit. This is highland command ethics, not Futa Toro proverb
  patience, and not a mallol about the heart that will not bend. Existentially: when necessary work meets
  real tiredness, sit down with the tired people. Do not give a speech. Do not call sitting surrender.
  If the work is still required, it will reopen by another door. The speech that shames exhaustion is
  already a false gun. ngondi, we are tired, is allowed to be the last human word before the sit.'
