unit_label: Trad. I / XX, Kauja's two hundred wives
title: Choose Four and Let the Rest Go Free
unit_type: verse
commentary: 'The ordinance is a reduction of possession, not a romance. The hurt is the teaching. A king
  whose household is a warehouse is being asked to become a man with four. Kauja has two hundred wives.
  The Sheikh: if they are free, choose four and let the rest go — this is sariya diina. It hurts the king
  and the foremost men who possess many. The contested move is to hear the four as a marital ideal or
  as colonial reform. Futa Jalon Fulde, speaking sharīʿa into a highland king''s warehouse, makes the
  law a cut in hoarding. The women are not a romance plot. They are a stock. The hurt of the men who have
  many is the proof that the sentence landed. This is not Futa Toro proverb about a second wife not being
  a wife. It is legal reduction of a royal hoard. Existentially: name one hoard you keep past need — objects,
  claims, people on a string. Release all but what you can actually keep faith with. The teaching is against
  both libertine accumulation and the fantasy that the cut is about love. Faith has a number you can actually
  keep. The rest is warehouse. yoppu heddiiɓe ɓe njaha: let the remainder go. The going is their freedom,
  not the king''s generosity.'
