- kind: key_terms
  label: Key Terms
  items:
  - term: sariya diina
    definition: the law of the religion (sharīʿa) — a cut in possession, not a love-rule
  - term: nayi
    definition: four — the number you can keep faith with; English 'limit' hides that it is a count of
      persons
  - term: ndimaaɗɓe
    definition: free persons — the condition of the release; if they are free they cannot be stock
  - term: yoppu
    definition: let go, release — the remainder's road out; 'divorce' is too modern-legal
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dhammapada 186–187, not by a rain of coins is thirst quenched
    resonance: Both refuse accumulation as a spiritual good.
    divergence: The Dhammapada addresses thirst; Fulde addresses a king's warehouse of wives and the hurt
      of men who have many.
  - citation: Gaden, Pulaar Texts, 'A Father's Counsel' (Futa Toro), a second wife is not a wife
    resonance: Both warn that multiplied household is not multiplied marriage.
    divergence: Gaden's mallol is Futa Toro proverb dialect about false nearness; this is Futa Jalon legal
      reduction of a royal hoard. Different dialect, different genre.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one hoard you keep past need (objects, claims, people on a string). Release all but what
    you can actually keep faith with.
