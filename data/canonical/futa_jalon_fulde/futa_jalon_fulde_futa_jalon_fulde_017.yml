translation_provenance: 'English is a Pratibha rendering (pd_adapted) from C.A.L. Reichardt''s facing
  English in *Grammar of the Fulde Language* (London: Church Missionary House, 1876 — public domain).
  Fulde is Reichardt''s Latin transcription of Futa Jalon traditions (Umar Tal wars from Alfa Muhammed
  Sadi; origin from Muhammed Sadi and Ibrahim Mandinka). This is Futa Jalon Fulde, not Futa Toro Pulaar.
  Does not follow Gaden 1931 or Hampâté Bâ.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Sheikh wi''i-mo: rewɓe-maa ɓuri nayi; so ɓe ndimaaɗɓe, suɓo nayi, yoppu heddiiɓe ɓe njaha. Ɗum
    woni sariya diina.'
- kind: iast
  label: Romanization
  body: 'Sheikh wi''i-mo: rewɓe-maa ɓuri nayi; so ɓe ndimaaɗɓe, suɓo nayi, yoppu heddiiɓe ɓe njaha. Ɗum
    woni sariya diina.'
- kind: translation
  label: Pratibha Translation
  body: 'The Sheikh said unto him: his wives are more than four; if they are free he must choose four
    and let the rest go free — this is the order of the faith. This hurt the king''s feelings, and those
    of the foremost men who possessed many wives.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The ordinance is a reduction of possession, not a romance. The hurt is the teaching. A king whose
    household is a warehouse is being asked to become a man with four. Kauja has two hundred wives. The
