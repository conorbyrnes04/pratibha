- kind: translation
  label: Pratibha Translation
  body: A contention of civilities took place; neither wished to take precedence. Both sat on the ground
    leaving the mat vacant between them.
- kind: commentary
  label: Pratibha Commentary
  body: 'Honor that cannot sit on the ground is not honor. The vacant mat is the teaching. When Umar meets
    Muhammed Bello, neither will take precedence. Both sit on the earth and leave the daago empty between
