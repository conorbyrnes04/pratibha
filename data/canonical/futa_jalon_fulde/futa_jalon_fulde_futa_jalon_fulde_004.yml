- kind: key_terms
  label: Key Terms
  items:
  - term: daago
    definition: mat — the honor-seat left vacant; English 'rug' is furniture; this is the rank neither
      will take
  - term: teddungal
    definition: honor, civility, the contention of respect — not 'politeness'; a struggle over who will
      not go first
  - term: leydi
    definition: earth, ground, land — where they actually sit; 'floor' is too indoor; this is the country
      under the mat
  - term: ɓolɗo
    definition: vacant, left unused — the teaching is the emptiness, not the sitting
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuāngzǐ, the useless tree that survives by not being timber
    resonance: Both make vacancy a form of honor that refuses use.
    divergence: Zhuāngzǐ's tree lives by being unfit; the mat is fit and still left empty by two men who
      could take it.
  - citation: Marcus Aurelius, Meditations 1.17, on not being seated above others
    resonance: Both refuse precedence as a spiritual act.
    divergence: Marcus thanks the gods for a temperament; Fulde stages two bodies on the ground and a
      third object unused.
- kind: practice
  label: Practice (Abhyasa)
  body: Today leave the best seat empty between you and the person you honor. Sit on the floor.
