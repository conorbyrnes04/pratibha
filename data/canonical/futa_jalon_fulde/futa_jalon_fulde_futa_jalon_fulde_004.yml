unit_label: Trad. I / XX, meeting Muhammed Bello
title: The Mat Left Vacant
unit_type: verse
commentary: 'Honor that cannot sit on the ground is not honor. The vacant mat is the teaching. When Umar
  meets Muhammed Bello, neither will take precedence. Both sit on the earth and leave the daago empty
  between them. The contested move is to treat honor as a higher seat. Futa Jalon Fulde — here a Sokoto
  encounter told in highland speech — makes teddungal a contention of refusals. The mat is the prize neither
  will take. Sitting on leydi, the ground, is not humility as costume. It is the only posture that can
  keep two masters in one room without one becoming the other''s floor. Futa Toro Pulaar will later proverbialize
  honor as koyēra, shame ranked above death. This Fulde scene does not proverbialize. It stages. The empty
  mat is a third presence: the rank both men refuse to occupy in front of the other. Existentially: the
  best seat in the room is the one that would make you first. Leave it. Sit where the floor already is.
  If you cannot sit on the ground, your honor is still a chair. The teaching is the vacancy, not the courtesy-speech
  around it. Two men who can leave a mat unused have already finished the meeting.'
