unit_label: Trad. I / XX, Banjugu kills Jimba
title: Find His Life Back
unit_type: verse
commentary: 'An enemy-king still has a life that is not yours to farm out. Honor left Jimba alive. The
  proxy who kills him does not inherit the sheikh''s war; he inherits a debt. Banjugu kills Jimba. Umar:
  I did not tell him to kill Jimba; if he has killed him he is responsible for his life; I left him by
  a word of honor because he was a king; he must find his life back. The contested move is to treat a
  lieutenant''s kill as the leader''s intent. Futa Jalon Fulde splits the war from the life. Jimba was
  an enemy and a lamɗo. Honor left him alive. The proxy wanted to finish the story. The sheikh returns
  the yonki as a debt the killer must carry. This is highland king-ethics inside jihad, not a Futa Toro
  mallol about the cow''s hoof on the calf. Existentially: do not let anyone kill a quarrel for you that
  you had chosen to leave alive. If they already have, say: that death is yours, not mine. The teaching
  is against both pacifism-as-brand and assassination-as-loyalty. A word of honor to a king is not cancelled
  by a useful corpse. konngol teddungal, the word of honor, is a life-left-alive. Finding the life back
  is a debt that cannot be paid in loyalty-talk.'
