- kind: key_terms
  label: Key Terms
  items:
  - term: yonki
    definition: life, soul, the living breath — what the killer now owes; English 'life' is biological;
      this is a debt
  - term: lamɗo
    definition: king — the reason honor left him alive; 'chief' is too small; the office is the fence
  - term: konngol teddungal
    definition: word of honor — the sentence that kept Jimba alive; not a contract, a spoken honor
  - term: ronndi
    definition: is responsible for / has inherited — the kill as a load, not as a favor
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 2.19–21, he who thinks this kills and he who thinks this is killed
    resonance: Both refuse to let a killing be a simple transfer of the leader's will.
    divergence: The Gītā metaphysically denies the kill; Umar morally returns the life as the killer's
      debt.
  - citation: Gospel of Thomas 98, the assassin who kills the powerful man at home
    resonance: Both know a killing done by a proxy.
    divergence: Thomas's assassin is the soul's own act against power; here the proxy's kill is refused
      as the sheikh's war.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today do not let anyone kill a quarrel for you that you had chosen to leave alive. If they already
    have, say: that death is yours, not mine.'
