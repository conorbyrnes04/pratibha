- kind: translation
  label: Pratibha Translation
  body: 'He replied: he had not told him that he must kill Jimba; if he has killed him he is responsible
    for his life. He left him alone and returned by his word of honor because he was a king. If he has
    killed him he must find his life back.'
- kind: commentary
  label: Pratibha Commentary
