unit_label: Trad. I / XX, dream of Alfa Muhammed Yakaya
title: The Fire Whose End He Did Not See
unit_type: verse
commentary: 'A true vocation is a fire whose edge you do not get to inventory. The dreamer carries the
  sheikh and cannot keep the name of the place. Alfa Muhammed Yakaya sees Al Hajji set fire to the grass.
  The field burns. He does not see the end of the fire until he wakes. The contested move is to require
  a map before a calling. Futa Jalon Fulde gives vocation as an unclosed burn. The dreamer is not shown
  the last village. He is shown grass catching. Reichardt''s highland tradition — Umar''s wars told as
  fire on the savanna — will later fill in the towns. The dream refuses that inventory. You carry a sheikh
  the way you carry a fire you did not start and cannot pace. Existentially: begin one act whose end you
  cannot see. The demand for the last town before the first step is already a refusal of the dream. This
  is not Futa Toro proverb causality, where every affair has a sababu you can name. This is highland oneiric
  theology: the cause is given; the edge is withheld. Trust is the walking into a field already burning,
  not the counting of acres from a hill. Waking is not a completion of the map. Waking is the admission
  that the end was not granted.'
