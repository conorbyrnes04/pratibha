- kind: key_terms
  label: Key Terms
  items:
  - term: yiite
    definition: fire — vocation as burn, not as plan; English 'zeal' is a mood; this is grass catching
  - term: joofirde
    definition: end, termination, the edge — the thing the dream withholds
  - term: ladde
    definition: field, bush, uncultivated land — the theater of the burn; not a hearth
  - term: ummii
    definition: he arose / awoke — waking as the cut, not as understanding
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B30, the cosmos as an ever-living fire kindling in measures
    resonance: Both make fire the form of a process you do not own.
    divergence: Heraclitus' fire is the world's measure; this dream-fire has no shown measure until waking
      cuts it.
  - citation: Bhagavad Gītā 11, Arjuna cannot bear the vision of the infinite form
    resonance: Both withhold the complete inventory of a calling.
    divergence: Arjuna sees too much and asks it to stop; Yakaya is not shown the end at all.
- kind: practice
  label: Practice (Abhyasa)
  body: Begin one act whose end you cannot see. Do not demand the map before the first step.
