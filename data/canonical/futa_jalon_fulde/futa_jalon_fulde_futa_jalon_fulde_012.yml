- kind: key_terms
  label: Key Terms
  items:
  - term: hoolii e Allah
    definition: trusted in God — trust as the going, not as a prior emotion; English 'faith' is too interior
  - term: yeewde
    definition: to face, to look upon, to confront — the particular inability; 'meet' is too mild
  - term: mi yaha
    definition: I will go — the whole courage in a future of walking
  - term: waawaa
    definition: I am not able — accurate limit, not a vice-name
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 18.66, abandon all dharmas, go to me alone
    resonance: Both bind going to a trust named in the same breath.
    divergence: The Gītā's going is refuge in Kṛṣṇa; Basi's going is an errand toward a feared king.
  - citation: Yoruba òwe, 'Boasting is not courage'
    resonance: Both refuse to let a loud mouth be the virtue.
    divergence: The òwe negates the boast; Fulde gives one quiet sentence that is the going.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the one visit you have refused out of fear of a hard person. Go once. Trust is the going,
    not a feeling beforehand.
