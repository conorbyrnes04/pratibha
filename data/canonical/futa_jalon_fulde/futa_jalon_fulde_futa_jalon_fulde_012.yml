unit_label: Trad. I / XX, Basi sent to Jimba
title: I Will Go and Trust in God
unit_type: verse
commentary: 'Courage here is not temperament. It is a sentence: I will go, and trust in God. The others
  are not cowards in general; they are unable to face this king. The teaching is the one yes. Al Hajji
  calls men to face Jimba. Each says: I cannot. Basi says: mi yaha, mi hoolii e Allah. The contested move
  is to moralize the refusals as a character defect. Futa Jalon Fulde lets them stand as accurate self-knowledge:
  this king, this errand, I cannot. Basi''s yes is not a louder personality. It is a going plus a trust
  named in the same breath. Trust is not a feeling beforehand. It is the walking. Highland Fulde here
  is a war-camp ethics of named errands, not Futa Toro proverb courage, and not a mallol about boasting.
  Existentially: name the one visit you have refused out of fear of a hard person. Go once. Do not wait
  to feel ready. The sentence is the courage. The others remain in the story as a mercy: not everyone
  is asked to be Basi toward every Jimba. The one yes is enough for the teaching. Do not conscript the
  rest. yeewde Jimba, to face Jimba, is a particular inability. Honor it as particular. Then let the one
  who can go, go.'
