unit_label: Trad. I / XX, letters from every side at Konja
title: He Does Not Know Which Place He Turns
unit_type: verse
commentary: 'Demand is not direction. A messenger who knows his next town from his mail has already stopped
  being sent. At Konja letters come from every side. He stands in the midst: the world seeks him; he is
  a messenger; whoever says he turns to Dengerabe, Nyoro, or Futa Toro tells a story; he himself does
  not know unless God the Lord gives him the road. The contested move is to treat a full inbox as guidance.
  Futa Jalon Fulde — and here the tradition names Futa Toro as one of the false destinations — makes nulaaɗo,
  messenger, incompatible with a self-chosen itinerary. The highland sheikh will not let downriver Futa,
  or any other town, become a plan he authored from other people''s letters. Demand is the world''s hunger.
  Direction is God''s. Existentially: do not answer three invitations today. Sit until one direction is
  given that you did not generate. The teaching is against both people-pleasing itineraries and the vanity
  of the man who is sought. Being sought is the danger. The messenger who enjoys being sought has already
  arrived at the wrong town. fenaande, a lie, is the story that he has a next town. The honest sentence
  is mi anndaa, I do not know.'
