- kind: key_terms
  label: Key Terms
  items:
  - term: nulaaɗo
    definition: messenger, the one sent — incompatible with a self-chosen next town; English 'leader'
      is the trap
  - term: laawol
    definition: road, way, direction — what God gives; not a schedule
  - term: fenaande
    definition: lie, untrue story — the rumor of a planned destination
  - term: ɗaɓɓii-yam
    definition: sought me, hunted after me — the world's demand, which is not yet a road
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuāngzǐ, the useless tree and the man of no use whom no one can conscript
    resonance: Both refuse a usefulness that would write the itinerary.
    divergence: Zhuāngzǐ survives by being unusable; Umar is hyper-usable and therefore must not know
      the next town.
  - citation: Ibn ʿArabī / Balyānī, on the servant who has no remaining will
    resonance: Both make not-knowing the condition of being sent.
    divergence: Balyānī annihilates the servant's will as metaphysics; Fulde keeps a man standing among
      letters, refusing Futa Toro as a plan.
- kind: practice
  label: Practice (Abhyasa)
  body: Do not answer three invitations today. Sit until one direction is given that you did not generate.
