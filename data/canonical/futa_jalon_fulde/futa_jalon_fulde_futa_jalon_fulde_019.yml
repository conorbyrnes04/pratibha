- kind: translation
  label: Pratibha Translation
  body: He stood in the midst of them. He said the world did seek after him; he was a messenger. Whoever
    says he turns his face to Dengerabe tells a story; to Nyoro, lies; to Futa Toro, what is untrue. He
    himself does not know to which place he turns unless God the Lord gives him His directions.
- kind: commentary
  label: Pratibha Commentary
  body: 'Demand is not direction. A messenger who knows his next town from his mail has already stopped
    being sent. At Konja letters come from every side. He stands in the midst: the world seeks him; he
