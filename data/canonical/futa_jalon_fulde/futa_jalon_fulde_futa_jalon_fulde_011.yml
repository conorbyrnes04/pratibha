translation_provenance: 'English is a Pratibha rendering (pd_adapted) from C.A.L. Reichardt''s facing
  English in *Grammar of the Fulde Language* (London: Church Missionary House, 1876 — public domain).
  Fulde is Reichardt''s Latin transcription of Futa Jalon traditions (Umar Tal wars from Alfa Muhammed
  Sadi; origin from Muhammed Sadi and Ibrahim Mandinka). This is Futa Jalon Fulde, not Futa Toro Pulaar.
  Does not follow Gaden 1931 or Hampâté Bâ.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Tamba''en wi''i: so ɗum woni e amen o wara-mo, walla o piya-mo, walla o yeeyoo-mo. Rewɓe Sheikh''en
    wi''i: so kulle teemedere mbusi e sahaa gooto, ɗum wonaa hay huunde. Sheikh wi''ataa hay huunde; o
    hokkate en goɗɗe, o hokkate mbusaaɗe baylo yo o moƴƴin.'
- kind: iast
  label: Romanization
  body: 'Tamba''en wi''i: so ɗum woni e amen o wara-mo, walla o piya-mo, walla o yeeyoo-mo. Rewɓe Sheikh''en
    wi''i: so kulle teemedere mbusi e sahaa gooto, ɗum wonaa hay huunde. Sheikh wi''ataa hay huunde; o
    hokkate en goɗɗe, o hokkate mbusaaɗe baylo yo o moƴƴin.'
- kind: translation
  label: Pratibha Translation
  body: 'The Tamba people said: if it were among us he would kill that man, or flog him, or sell him on
    account of the gun. The Sheikh''s followers said: if a hundred guns should burst at one time it would
    be nothing. The Sheikh would say nothing to us; he would give us others and give the broken ones to
    the blacksmith to be repaired.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Two economies of accident. A king''s honor kills the man whose tool failed. A sheikh''s honor
