unit_label: Trad. I / XX, burst gun at the welcome
title: A Hundred Guns Would Be Nothing
unit_type: verse
commentary: 'Two economies of accident. A king''s honor kills the man whose tool failed. A sheikh''s honor
  repairs the tool. The broken gun is not a crime. At a welcome a gun bursts. Tamba people: if it were
  among us he would kill, flog, or sell the man. The Sheikh''s people: if a hundred guns burst at once
  it would be nothing; he would say nothing, give others, give the broken ones to the blacksmith. The
  contested move is to treat a failed tool as a failed person. Futa Jalon Fulde stages a comparison of
  honors. Royal honor is a wound that must be paid in a body. Sheikhly honor is a repair that must be
  paid in iron. baylo, the smith, is the third party who receives the break. This is highland court-and-camp
  ethics, not a Senegal mallol about small acts returning. Existentially: when someone''s tool fails in
  your house, repair it. Do not punish the person for the break. If your honor requires a body, it is
  Tamba honor. If it requires a smith, it is this teaching. The hundred guns are a hyperbole that protects
  the one accident. Nothing is not indifference. It is the refusal to make a crime of metal. The man lives.
  The iron goes to the baylo.'
