- kind: key_terms
  label: Key Terms
  items:
  - term: kulle
    definition: guns — the failed tools; English 'weapons' is too grand; these are instruments that burst
  - term: baylo
    definition: blacksmith — the third party of repair; honor that uses a smith instead of a scaffold
  - term: mbusi
    definition: burst, broken — accident as metal-event, not as moral event
  - term: hay huunde
    definition: nothing at all — the sheikh's measure of the accident; not 'forgiveness', a refusal to
      make it a case
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Marcus Aurelius, Meditations 4.49, the rock the wave breaks on
    resonance: Both refuse to let an accident become a verdict on the person.
    divergence: Marcus trains an inner rock; Fulde sends the broken gun to a smith and gives the man another.
  - citation: Yoruba òwe, 'An accident is not like a result that is foreseen'
    resonance: Both split accident from intended result.
    divergence: 'The òwe is epistemic; this tradition is political: two honors, kill versus repair.'
- kind: practice
  label: Practice (Abhyasa)
  body: When someone's tool fails in your house today, repair it. Do not punish the person for the break.
