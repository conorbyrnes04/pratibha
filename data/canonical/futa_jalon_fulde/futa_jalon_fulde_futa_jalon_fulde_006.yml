- kind: translation
  label: Pratibha Translation
  body: 'When he saw the great crowd that followed Almami Bakari, he said: you must not leave Futa; if
    you leave Futa, Futa will suffer. Almami Bakari said the religion is the religion of God, the right
    way — he would not hinder any Futa people from following Al Hajji.'
