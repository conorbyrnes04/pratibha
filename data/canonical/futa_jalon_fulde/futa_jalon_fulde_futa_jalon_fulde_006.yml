unit_id: futa_jalon_fulde.futa_jalon_fulde_006
unit_label: Trad. I / XX, Almami Bakari at Jugunko
title: If You Leave Futa, Futa Will Suffer
unit_type: verse
commentary: 'Two goods collide: the land needs its people; the path may call them out. The almami refuses
  to police God''s road. Omar names the cost to the land. At Jugunko he sees the crowd following Almami
  Bakari and says: do not leave Futa; if you leave, Futa will suffer. Bakari answers that the religion
  is God''s, the right way — he will not hinder Futa people from following Al Hajji. The contested move
  is to resolve the collision by picking one good and calling the other worldly. Futa Jalon Fulde keeps
  both sentences in the same scene. Omar''s Futa here is the highland that will later lose men to his
  own jihad. The irony is already the teaching. The sheikh who will draw the world after him first names
  what the land loses when the people go. Bakari''s refusal to police diina is also a teaching: God''s
  road is not a border guard''s job. Existentially: before you leave a place that needs you, say aloud
  what it will suffer. If you still go, do not pretend the land will not. The two goods remain two. Futa
  Toro, downriver, is another Futa with another leaving-story; do not collapse the names. This is highland
  political theology, not a mallol. The crowd is the wound being named in advance.'
