- kind: key_terms
  label: Key Terms
  items:
  - term: Futa
    definition: here Fuuta Jaloo, the Guinea highland — not Futa Toro on the Senegal; English 'Futa' flattens
      two polities
  - term: fooloto
    definition: will suffer, will be weakened — a future of the land, not of the traveler's soul
  - term: diina
    definition: religion (Arabic dīn) — Bakari's counter-good; 'faith' is too inward; this is a public
      road
  - term: laawol goonga
    definition: the right way, the true road — path as road, not as opinion
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lal Ded, vakh on leaving the house for the road
    resonance: Both stage a collision between household-land and a calling-out.
    divergence: Lal's leaving is Kashmiri Shaiva nakedness; this is a Futa Jalon crowd and an almami who
      will not hinder God's road.
  - citation: Analects 4.19, while the parents live, do not travel far
    resonance: Both name the cost of leaving those who need you.
    divergence: Confucius binds the son to the parents' life; Fulde binds a people to a highland that
      will suffer their going.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you leave a place that needs you, say aloud what it will suffer. If you still go, do not
    pretend it will not.
