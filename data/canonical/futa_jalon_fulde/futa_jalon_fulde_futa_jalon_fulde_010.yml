unit_label: Trad. I / XX, scarce water at Dingerawi
title: God Will Make That Easy
unit_type: verse
commentary: 'This is not a prosperity slogan. It is a refusal to let scarcity veto a place already given
  in a dream. The ease is God''s, not the sheikh''s technique. People who know the land say water is scarce
  at Dingerawi. Al Hajji: see, God will make that easy. After arrival, a blessing of water. The contested
  move is to hear Allah waɗata ɗum newi as a technique for getting what you want. Futa Jalon Fulde ties
  the sentence to a prior dream-place. The land-knowers are not fools. Scarcity is real. The sheikh does
  not argue hydrology. He refuses to let the known dryness cancel a given destination. Ease, when it comes,
  is attributed to God, not to the caravan''s skill. This is highland itinerant theology, not a Futa Toro
  proverb about wells and ropes matching. Existentially: name one necessary place that looks dry. Go without
  a second plan. Ask for water only after you have arrived. The teaching is against both magical thinking
  and the veto of the expert. The expert may be right about the land. The dream may still be the road.
  You find out by arriving, not by winning the argument at the previous camp. newi, ease, is what God
  does to a dryness you did not pick for comfort.'
