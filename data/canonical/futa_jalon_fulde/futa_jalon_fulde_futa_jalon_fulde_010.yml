- kind: key_terms
  label: Key Terms
  items:
  - term: ndiyam
    definition: water — the scarce good; English 'resources' loses the drink
  - term: newi
    definition: easy, made easy — God's act, not a method; 'prosperity' is the slogan this unit refuses
  - term: annduɓe leydi
    definition: those who know the land — local expertise that is true and still not a veto
  - term: famɗi
    definition: is scarce, is little — a fact the sheikh does not deny, only refuses as a stop
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ibn ʿArabī / Balyānī, the secret of the one who is God, on tawakkul
    resonance: Both refuse a second plan that would replace trust.
    divergence: Balyānī dissolves the servant into the Real; Fulde keeps the land-knowers' fact and still
      walks into the dry place.
  - citation: Dhammapada 5, hatreds never cease by hatred
    resonance: Both refuse to let a known hardness be the last word.
    divergence: The Dhammapada's cease is ethical; here the hardness is hydrological and the ease is God's
      after arrival.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one necessary place that looks dry. Go to it without a second plan. Ask for water only after
    you have arrived.
