translation_provenance: 'English is a Pratibha rendering (pd_adapted) from C.A.L. Reichardt''s facing
  English in *Grammar of the Fulde Language* (London: Church Missionary House, 1876 — public domain).
  Fulde is Reichardt''s Latin transcription of Futa Jalon traditions (Umar Tal wars from Alfa Muhammed
  Sadi; origin from Muhammed Sadi and Ibrahim Mandinka). This is Futa Jalon Fulde, not Futa Toro Pulaar.
  Does not follow Gaden 1931 or Hampâté Bâ.'
pratibha_layers:
- kind: original
  label: Original
  body: Sheikh anndi yimɓe-makko njaasi, ɓe nji'ii kirse konu-makko. Sheikh deeƴii haa ɓe ngari e yeeso-makko.
    Caggal ɗum o itti-mo e golle.
- kind: iast
  label: Romanization
  body: Sheikh anndi yimɓe-makko njaasi, ɓe nji'ii kirse konu-makko. Sheikh deeƴii haa ɓe ngari e yeeso-makko.
    Caggal ɗum o itti-mo e golle.
- kind: translation
  label: Pratibha Translation
  body: The Sheikh knew that his people took offence when they saw the war dress of those men. The Sheikh
    kept silence till they came into his presence. After that he deposed him from his office.
- kind: commentary
  label: Pratibha Commentary
  body: 'He does not soothe the envy in the yard. Silence until the face-to-face, then the act. The dress
