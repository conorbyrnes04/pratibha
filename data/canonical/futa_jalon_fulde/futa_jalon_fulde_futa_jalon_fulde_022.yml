unit_label: Trad. I / XX, Alfa Othman's war dress
title: He Kept Silence Until They Came
unit_type: verse
commentary: 'He does not soothe the envy in the yard. Silence until the face-to-face, then the act. The
  dress caused the offence; the office is what he removes. The Sheikh knows his people took offence at
  Alfa Othman''s war dress. He keeps silence until they come into his presence. Then he deposes him. The
  contested move is to manage the corridor. Futa Jalon Fulde gives a sequence: knowledge, silence, presence,
  removal. The kirse, the war dress, bred envy in the yard. The sheikh will not comment there. He will
  not soothe. He waits for the face. Then he acts on the office, not on the cloth. Highland camp politics,
  not a Futa Toro mallol about not speaking of the father''s marriage — though both know a silence that
  is not cowardice. Existentially: when a display in your circle breeds envy, do not comment in the corridor.
  Wait until the person is in front of you. Then act or refuse to act. Do not gossip the dress. The teaching
  splits the cause (the display) from the remedy (the office). Soothing the yard would have left the office
  intact and the envy fed. deeƴii, he kept silence, is the method. itti-mo e golle, he removed him from
  the work, is the act that silence made possible.'
