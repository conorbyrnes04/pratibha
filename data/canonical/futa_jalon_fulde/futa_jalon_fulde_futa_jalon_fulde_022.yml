- kind: key_terms
  label: Key Terms
  items:
  - term: deeƴii
    definition: he kept silence, he was still — method, not passivity; English 'waited' loses the closed
      mouth
  - term: kirse
    definition: war dress, military costume — the display that bred offence; not the crime, the spark
  - term: yeeso-makko
    definition: his face / his presence — the condition of the act; corridor speech is refused
  - term: golle
    definition: office, work, function — what is removed; the dress stays a dress, the office is the stake
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 6, do not lie and do not do what you hate, for all is revealed
    resonance: Both refuse a hidden corridor speech.
    divergence: Thomas universalizes reveal; Fulde sequences silence until the face, then a public removal.
  - citation: Gaden, Pulaar Texts, Mallol 151, 'He Will Not Speak of His Father's Marriage' (Futa Toro)
    resonance: Both keep a silence that is honor, not fear.
    divergence: Gaden's mallol is a last fence on family speech in another dialect; this is a commander's
      silence until the offender is in front of him. Do not collapse them.
- kind: practice
  label: Practice (Abhyasa)
  body: When a display in your circle breeds envy, do not comment in the corridor. Wait until the person
    is in front of you. Then act or refuse to act. Do not gossip the dress.
