- kind: translation
  label: Pratibha Translation
  body: 'He drew his knife and cut up their kettle drum. He came to Karamoko Alfa and said: brother, I
    have torn the big drum of the unbelievers. He said to him: you have done mischief sadly; our family
    and friends are not there.'
