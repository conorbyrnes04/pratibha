- kind: key_terms
  label: Key Terms
  items:
  - term: dundurundu / dunduru
    definition: kettle drum, the big drum — a public instrument, not a doctrine; cutting it is an act
      against a town
  - term: hefereeɓe
    definition: unbelievers — Suri's name for the drum's people; Alfa will not let the name authorize
      the cut
  - term: bone
    definition: mischief, harm, wrong — the official name of the first cut; English 'zeal' is what Suri
      thought he had
  - term: musibba-meɗe
    definition: our family and friends — the missing condition; without them in the town the cut is freelance
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 1.31–37, Arjuna's kinship-horror before the war
    resonance: Both make kin-location a condition of sacred violence.
    divergence: Arjuna sees his people on the field and will not fight; Alfa sees that his people are
      not in the town and names the cut mischief.
  - citation: Yoruba òwe, 'Strife never begets a gentle child'
    resonance: Both refuse to let a first violent act found a gentle order.
    divergence: The òwe is proverbial genetics of strife; Fulde is the founding story of Futa Jalon's
      jihad as a kinship failure.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you break a public instrument of people who are not yours, ask who will pay. If your family
    is not in that town, do not cut the drum.
