unit_label: Trad. II / XXI, Almami Suri at Wosogorama
title: You Have Torn the Drum of the Unbelievers
unit_type: verse
commentary: 'Zeal that starts a holy war by cutting a drum is named mischief when it is done where your
  people are not. The first jihad of Futa Jalon begins as a kinship problem, not a triumph. Almami Suri
  cuts the kettle drum at Wosogorama, returns to Timbo, tells Karamoko Alfa: I have torn the big drum
  of the unbelievers. The answer: you have done mischief sadly; our family and friends are not there.
  The contested move is to hear the cut as the start of glory. Highland Fulde names it bone, mischief.
  The drum is a public instrument of people who are not yours. Zeal that cannot locate kin in the town
  is not yet a legal war. Tradition II will soon require a king for jihad to be legal. This unit is the
  prior disaster: freelance sacred vandalism. Do not collapse this with Futa Toro ethics; the drum and
  the highland Imam-founding are Futa Jalon''s own beginning. Existentially: before you break a public
  instrument of people who are not yours, ask who will pay. If your family is not in that town, do not
  cut the drum. The teaching is against zeal that outruns kinship. dundurundu is not a theology. It is
  a drum. Cutting it where musibba-meɗe, our people, are absent, is already the mischief. The knife was
  sure. The kinship was not.'
