  label: Original
  body: The worship of the “Great Mystery” was silent, solitary, free from all self-seeking. It was silent,
    because all speech is of necessity feeble and imperfect; therefore the souls of my ancestors ascended
    to God in wordless adoration. It was solitary, because they believed that He is nearer to us in solitude,
    and there were no priests authorized to come between a man and his Maker. None might exhort or confess
    or in any way meddle with the religious experience of another. Among us all men were created sons
    of God and stood erect, as conscious of their divinity. Our faith might not be formulated in creeds,
    nor forced upon any who were unwilling to receive it; hence there was no preaching, proselyting, nor
    persecution, neither were there any scoffers or atheists.
provenance:
