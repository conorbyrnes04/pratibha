unit_label: The worship of the “Great Mystery” was silent, solitary, free from all self-seeking
title: The worship of the “Great Mystery” was silent, solitary, free from all self-seeking
unit_type: reflection
original: The worship of the “Great Mystery” was silent, solitary, free from all self-seeking. It was
  silent, because all speech is of necessity feeble and imperfect; therefore the souls of my ancestors
  ascended to God in wordless adoration. It was solitary, because they believed that He is nearer to us
  in solitude, and there were no priests authorized to come between a man and his Maker. None might exhort
  or confess or in any way meddle with the religious experience of another. Among us all men were created
  sons of God and stood erect, as conscious of their divinity. Our faith might not be formulated in creeds,
  nor forced upon any who were unwilling to receive it; hence there was no preaching, proselyting, nor
  persecution, neither were there any scoffers or atheists.
commentary: 'Eastman presents Dakota spiritual practice as fundamentally non-institutional: worship occurs
  in silence and solitude because speech fails to reach the sacred, and because direct relationship with
  the Great Mystery requires no intermediary. The passage emphasizes spiritual equality—all people stand
  as conscious of their own divinity—which Eastman contrasts implicitly with hierarchical religious structures.
  His claim that there were ''no scoffers or atheists'' suggests not enforced uniformity but rather a
  culture where the spiritual framework was so integrated that rejection took different forms than in
  societies with competing doctrines.'
practice: Today, find ten minutes alone in a quiet place. Rather than speaking or thinking about what
  you believe, simply sit with the awareness that you are conscious—that awareness itself is present.
  Notice what arises without naming it as religious or secular. This mirrors Eastman's emphasis on wordless,
  solitary attunement.
abhyasa: Today, find ten minutes alone in a quiet place. Rather than speaking or thinking about what you
