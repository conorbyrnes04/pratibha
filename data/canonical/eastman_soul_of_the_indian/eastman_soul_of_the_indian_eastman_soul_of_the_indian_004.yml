  body: That solitary communion with the Unseen which was the highest expression of our religious life
    is partly described in the word bambeday, literally “mysterious feeling,” which has been variously
    translated “fasting” and “dreaming.” It may better be interpreted as “consciousness of the divine.”
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: I. The Great Mystery
original: That solitary communion with the Unseen which was the highest expression of our religious life
  is partly described in the word bambeday, literally “mysterious feeling,” which has been variously translated
  “fasting” and “dreaming.” It may better be interpreted as “consciousness of the divine.”
