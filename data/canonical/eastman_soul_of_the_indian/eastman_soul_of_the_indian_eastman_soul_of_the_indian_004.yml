- kind: key_terms
  label: Key Terms
  body: '**bambeday** — A Dakota word meaning ''mysterious feeling''; the practice of solitary communion
    with the sacred, often involving fasting and heightened awareness; Eastman interprets it as ''consciousness
    of the divine.''

    **the Unseen** — Eastman''s term for the sacred or divine reality that is encountered through bambeday;
    that which is present but not visible to ordinary perception.'
  items:
  - term: bambeday
    definition: A Dakota word meaning 'mysterious feeling'; the practice of solitary communion with the
      sacred, often involving fasting and heightened awareness; Eastman interprets it as 'consciousness
      of the divine.'
  - term: the Unseen
    definition: Eastman's term for the sacred or divine reality that is encountered through bambeday;
      that which is present but not visible to ordinary perception.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Meister Eckhart, ''Breakthrough'' sermons:** Both Eckhart and Eastman describe a direct, wordless
    encounter with the divine through stillness and inward turning; both resist doctrinal mediation. Divergence:
    Eckhart emphasizes the annihilation of the self (''letting go''), while Eastman''s bambeday appears
    to sharpen and refine consciousness rather than dissolve it.


    **Upanishads, Kena Upanishad (''By whom is the mind directed?''):** Both traditions point to a ''mysterious''
    dimension of reality that cannot be grasped by ordinary intellect but only by direct experience. Divergence:
    The Upanishads frame this through metaphysical inquiry into Brahman; Eastman emphasizes solitary,
    embodied practice within a relational cosmos.'
