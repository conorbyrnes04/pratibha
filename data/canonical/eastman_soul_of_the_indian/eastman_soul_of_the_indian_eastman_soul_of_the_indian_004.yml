unit_label: That solitary communion with the Unseen which was the highest expression
title: That solitary communion with the Unseen which was the highest expression
unit_type: reflection
original: That solitary communion with the Unseen which was the highest expression of our religious life
  is partly described in the word bambeday, literally “mysterious feeling,” which has been variously translated
  “fasting” and “dreaming.” It may better be interpreted as “consciousness of the divine.”
commentary: Eastman identifies bambeday as the spiritual core of Dakota religious practice—a direct, solitary
  encounter with the sacred that transcends simple fasting or dreaming. By translating it as 'consciousness
  of the divine,' he points to an active, felt knowing rather than a passive state, suggesting that the
  sacred is not distant but accessible through disciplined inward attention. This passage invites us to
  consider how different traditions name the experience of touching something beyond the ordinary self.
practice: Today, find fifteen minutes of genuine solitude—outdoors if possible. Without agenda or technique,
  simply notice what arises when you stop talking, planning, and performing. What quality of awareness
  emerges? Sit with that, without naming it yet.
abhyasa: Today, find fifteen minutes of genuine solitude—outdoors if possible. Without agenda or technique,
