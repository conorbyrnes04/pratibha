unit_label: Next to this, the matter that concerns him most is…
title: Next to this, the matter that concerns him most is…
unit_type: reflection
commentary: 'Eastman describes a spiritual paradox central to Dakota understanding: the coexistence of grief and faith. Even
  with certainty of continued spiritual connection beyond death, the material suffering of those left behind—especially children—remains
  a profound concern. This is not a contradiction but a recognition that love operates simultaneously in the physical and
  spiritual realms, and that genuine faith does not erase earthly sorrow.



  Key Terms



  **spiritual companionship** — Continued relationship and presence with the deceased beyond physical death, held as real
  and sustaining within Dakota belief



  Cross-Tradition Resonances



  **Dhammapada, verses on attachment and impermanence:** Both traditions acknowledge that love persists even when we understand
  the impermanence of physical form. Divergence: The Dhammapada frames attachment itself as the root of suffering to be transcended;
  Eastman presents family affection as intrinsically good, with grief as its natural expression.


  **Ecclesiastes 3:4 (''a time to weep, and a time to laugh; a time to mourn''):** Both honor mourning as a legitimate spiritual
  state, not something to overcome through belief alone. Divergence: Ecclesiastes emphasizes cyclical seasons of emotion;
  Eastman locates grief and faith as simultaneous rather than sequential.'
