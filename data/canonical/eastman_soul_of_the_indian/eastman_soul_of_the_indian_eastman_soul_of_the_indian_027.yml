  body: Next to this, the matter that concerns him most is the parting with his dear ones, especially
    if he have any little children who must be left behind to suffer want. His family affections are strong,
    and he grieves intensely for the lost, even though he has unbounded faith in a spiritual companionship.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Vi. On The Border-Land Of Spirits
original: Next to this, the matter that concerns him most is the parting with his dear ones, especially
  if he have any little children who must be left behind to suffer want. His family affections are strong,
  and he grieves intensely for the lost, even though he has unbounded faith in a spiritual companionship.
