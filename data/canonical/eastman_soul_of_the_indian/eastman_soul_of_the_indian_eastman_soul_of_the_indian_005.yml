- kind: key_terms
  label: Key Terms
  body: '**bambeday** — A religious retreat or vision-quest experience marking spiritual maturation in
    Dakota practice, involving fasting, exposure to elements, and solitary communion with the sacred.

    **Great Mystery** — Eastman''s term for the sacred or divine presence encountered in the bambeday;
    the ultimate reality toward which the ritual is oriented.'
  items:
  - term: bambeday
    definition: A religious retreat or vision-quest experience marking spiritual maturation in Dakota
      practice, involving fasting, exposure to elements, and solitary communion with the sacred.
  - term: Great Mystery
    definition: Eastman's term for the sacred or divine presence encountered in the bambeday; the ultimate
      reality toward which the ritual is oriented.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Exodus 24:12–18 (Moses on Mount Sinai):** Both texts place revelation on a high place, involve
    fasting and exposure, and frame the encounter as solitary and transformative. Both use ascent as spiritual
    method. Divergence: Eastman''s account emphasizes the seeker''s self-preparation and internal vision;
    the biblical account emphasizes God''s initiative and the giving of law. The Dakota youth seeks clarity;
    Moses receives commandment.


    **Dhammapada 383–384 (on renunciation and the forest hermit):** Both traditions value withdrawal from
    social life, simplicity of dress and possession, and silence as paths to insight. Both see the natural
    world as a teacher. Divergence: The Buddhist path aims at cessation of desire and escape from suffering;
    Eastman''s account suggests the bambeday awakens ''motive power''—a renewed engagement with life and
    community, not withdrawal from it.


    **Meister Eckhart, ''Poverty'' (medieval Christian mysticism):** Both Eckhart and Eastman prize radical
    emptiness—the stripping of will, possession, and self-concern—as the condition for encountering the
    divine. Both use nakedness (literal or metaphorical) as spiritual language. Divergence: Eckhart seeks
    union through negation of the self; Eastman''s account suggests the youth emerges with clarified purpose
    and ''motive power,'' implying the self is refined, not annihilated.'
