  of confirmation or conversion in Christian experience. Having first prepared himself by means of the purifying vapor-bath,
  and cast off as far as possible all human or fleshly influences, the young man sought out the noblest height, the most commanding
  summit in all the surrounding region. Knowing that God sets no value upon material things, he took with him no offerings
  or sacrifices other than symbolic objects, such as paints and tobacco. Wishing to appear before Him in all humility, he
  wore no clothing save his moccasins and breech-clout. At the solemn hour of sunrise or sunset he took up his position, overlooking
  the glories of earth and facing the “Great Mystery,” and there he remained, naked, erect, silent, and motionless, exposed
  to the elements and forces of His arming, for a night and a day to two days and nights, but rarely longer. Sometimes he
  would chant a hymn without words, or offer the ceremonial “filled pipe.” In this holy trance or ecstasy the Indian mystic
  found his highest happiness and the motive power of his existence.
abhyasa: Today, find a place—a hill, a quiet room with a window, anywhere you can see far—and sit for even fifteen minutes
  in silence, facing outward. Notice what you wear, what you carry, what you habitually do. Set one of these aside (a phone,
  a task, a familiar thought). Observe what arises when you stop filling the space with words or motion.
