  no lesser cathedral!
abhyasa: 'Today, find one natural place—a tree, a body of water, a patch of sky, the wind. Spend ten minutes there without
  agenda. Notice what Eastman calls the ''mysterious, shadowy aisles'' or ''sunlit bosom''—the specific textures and presences.
  Let yourself be poetical: what does this place say or show?'
