pratibha_layers:
- kind: original
  label: Original
  body: There were no temples or shrines among us save those of nature. Being a natural man, the Indian
    was intensely poetical. He would deem it sacrilege to build a house for Him who may be met face to
    face in the mysterious, shadowy aisles of the primeval forest, or on the sunlit bosom of virgin prairies,
    upon dizzy spires and pinnacles of naked rock, and yonder in the jeweled vault of the night sky! He
    who enrobes Himself in filmy veils of cloud, there on the rim of the visible world where our Great-Grandfather
    Sun kindles his evening camp-fire, He who rides upon the rigorous wind of the north, or breathes forth
    His spirit upon aromatic southern airs, whose war-canoe is launched upon majestic rivers and inland
    seas--He needs no lesser cathedral!
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: I. The Great Mystery
