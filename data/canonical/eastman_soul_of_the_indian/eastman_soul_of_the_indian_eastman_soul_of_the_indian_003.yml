title: There were no temples or shrines among us save those…
unit_type: reflection
commentary: 'Eastman articulates a theology of presence: the sacred is encountered directly in the natural world rather than
  confined to human-made structures. This passage refuses the dichotomy between ''spiritual'' and ''material''—forest, prairie,
  rock, sky, and weather are not symbols of the divine but its actual dwelling places. The poetic intensity Eastman names
  is not decoration but the appropriate human response to a God who is radically accessible and alive in creation.



  Key Terms



  **Great-Grandfather Sun** — A relational name for the sun as a living presence and kinship relation, not an abstraction;
  reflects Dakota kinship language extended to natural forces.

  **natural man** — In Eastman''s usage here: a human being in right relation to the natural world, not ''uncivilized'' but
  attuned and poetical.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts locate the sacred in what is subtle, pervasive, and beyond human construction—''the
  ancient masters were profound and subtle.'' Neither requires temples. Divergence: Eastman emphasizes relational presence
  and kinship; the Tao emphasizes the nameless, impersonal ground. Eastman''s God has agency and intention (''enrobes,'' ''rides,''
  ''breathes'').


  **Psalm 19:1–2 (Hebrew Bible):** Both declare that creation itself speaks the sacred: ''The heavens declare the glory of
  God.'' Both reject the notion that the divine is absent from the natural world. Divergence: The Psalm treats nature as testimony
  to a God beyond it; Eastman suggests the divine is *present* in nature, not merely witnessed through it.


  **Meister Eckhart, ''God is in all things'':** Both reject institutional mediation and assert immediate divine presence
  in the material world; both use poetic language to convey what cannot be contained. Divergence: Eckhart''s God is transcendent
  and immanent simultaneously; Eastman''s emphasis is on the relational, kinship-based encounter in specific places.'
