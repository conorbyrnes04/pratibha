- kind: key_terms
  label: Key Terms
  body: '**admixture** — A deliberate blending of Christian and traditional Dakota spiritual elements,
    created by Dakota communities themselves during a period of rapid change.

    **folk-lore** — Traditional stories and knowledge; here, Dakota narratives that absorbed and reframed
    biblical narratives in indigenous terms.'
