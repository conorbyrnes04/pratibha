- kind: original
  label: Original
  body: During the era of reconstruction they modified their customs and beliefs continually, creating
    a singular admixture of Christian with pagan superstitions, and an addition to the old folk-lore of
    disguised Bible stories under an Indian aspect. Even their music shows the influence of the Catholic
    chants. Most of the material collected by modern observers is necessarily of this promiscuous character.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iii. Ceremonial And Symbolic Worship
