      by Dakota communities themselves during a period of rapid change.
  - term: folk-lore
    definition: Traditional stories and knowledge; here, Dakota narratives that absorbed and reframed
      biblical narratives in indigenous terms.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Bhabha, *The Location of Culture* — concept of hybridity:** Both recognize that cultural mixing
    is not passive corruption but active, creative remaking by communities under pressure. Divergence:
    Eastman writes from inside the tradition as witness; Bhabha theorizes from postcolonial criticism.
    Eastman''s tone is observational; Bhabha''s is analytical.


    **Ecclesiastes 1:9 — ''there is nothing new under the sun'':** Both suggest that human meaning-making
    recycles and recontextualizes older forms. Divergence: Ecclesiastes implies cyclical futility; Eastman
    implies adaptive vitality and survival.'
