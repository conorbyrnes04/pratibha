  body: During the era of reconstruction they modified their customs and beliefs continually, creating a singular admixture
    of Christian with pagan superstitions, and an addition to the old folk-lore of disguised Bible stories under an Indian
    aspect. Even their music shows the influence of the Catholic chants. Most of the material collected by modern observers
    is necessarily of this promiscuous character.
