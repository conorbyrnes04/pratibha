pratibha_layers:
- kind: original
  label: Original
  body: 'And when the day of days in her life dawns--the day in which there is to be a new life, the miracle of whose making
    has been intrusted to her, she seeks no human aid. She has been trained and prepared in body and mind for this her holiest
    duty, ever since she can remember. The ordeal is best met alone, where no curious or pitying eyes embarrass her; where
    all nature says to her spirit: “‘Tis love! ‘tis love! the fulfilling of life!” When a sacred voice comes to her out of
    the silence, and a pair of eyes open upon her in the wilderness, she knows with joy that she has borne well her part in
    the great song of creation!'
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his own words, published
    to interpret Native spirituality across cultures. A living tradition — offered here as a study reading, with respect to
    Dakota descendants.
