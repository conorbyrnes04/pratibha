- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts value
    solitude and stillness as conditions for clarity and alignment with natural process; both see non-interference
    as wisdom. Divergence: Eastman emphasizes active preparation and joyful participation, whereas the
    Tao counsels receptive emptiness and non-action.


    **Psalm 139: ''I praise you because I am fearfully and wonderfully made'':** Both affirm the body''s
    sacred design and a woman''s intimate knowledge of her own making. Divergence: The Psalm addresses
    God''s creative gaze; Eastman locates the sacred encounter in nature and the woman''s own spirit,
    not in external divine address.'
