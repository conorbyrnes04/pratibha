abhyasa: Sit quietly and reflect on a time you faced a threshold or ordeal alone—a moment when you had to trust your own preparation
  and the world around you. Notice what 'nature' (your breath, light, sound, sensation) seemed to say to you then. Write one
  sentence about what you knew in that solitude.
