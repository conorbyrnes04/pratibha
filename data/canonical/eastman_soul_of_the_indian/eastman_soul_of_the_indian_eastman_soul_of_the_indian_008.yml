unit_label: And when the day of days in her life dawns--the day in which there is to be a new life
title: And when the day of days in her life dawns--the day in which there is to be a new life
unit_type: reflection
original: 'And when the day of days in her life dawns--the day in which there is to be a new life, the
  miracle of whose making has been intrusted to her, she seeks no human aid. She has been trained and
  prepared in body and mind for this her holiest duty, ever since she can remember. The ordeal is best
  met alone, where no curious or pitying eyes embarrass her; where all nature says to her spirit: “‘Tis
  love! ‘tis love! the fulfilling of life!” When a sacred voice comes to her out of the silence, and a
  pair of eyes open upon her in the wilderness, she knows with joy that she has borne well her part in
  the great song of creation!'
commentary: Eastman presents childbirth as a woman's sacred solitude and spiritual completion, not a medical
  event or social crisis. The passage frames her preparation, courage, and communion with nature as constitutive
  of dignity and cosmic participation—she is not a patient needing rescue, but a participant in creation
  itself. This reflects a Dakota understanding of womanhood as spiritually autonomous and ecologically
  embedded, where the 'great song of creation' includes her body's knowledge.
practice: Sit quietly and reflect on a time you faced a threshold or ordeal alone—a moment when you had
  to trust your own preparation and the world around you. Notice what 'nature' (your breath, light, sound,
  sensation) seemed to say to you then. Write one sentence about what you knew in that solitude.
abhyasa: Sit quietly and reflect on a time you faced a threshold or ordeal alone—a moment when you had
  to trust your own preparation and the world around you. Notice what 'nature' (your breath, light, sound,
  sensation) seemed to say to you then. Write one sentence about what you knew in that solitude.
