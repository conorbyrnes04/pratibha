- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Dhammapada (Buddhist text), verses on the body and discipline:** Both traditions teach that
    mastery of the senses is foundational to ethical life; the body is the site where spiritual practice
    begins. Divergence: Eastman frames this as a *social and moral code*—a collective law—whereas the
    Dhammapada emphasizes individual liberation from suffering.


    **Plato, *Republic*: the well-ordered soul in the well-ordered body:** Both propose that physical
    harmony reflects and enables moral order; the body is not separate from virtue. Divergence: Eastman
    grounds this in a *system of training* embedded in community life, whereas Plato''s emphasis is more
    on rational hierarchy within the individual soul.'
