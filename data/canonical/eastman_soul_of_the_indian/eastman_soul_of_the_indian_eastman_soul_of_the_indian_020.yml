  label: Original
  body: The moment that man conceived of a perfect body, supple, symmetrical, graceful, and enduring--in
    that moment he had laid the foundation of a moral life! No man can hope to maintain such a temple
    of the spirit beyond the period of adolescence, unless he is able to curb his indulgence in the pleasures
    of the senses. Upon this truth the Indian built a rigid system of physical training, a social and
    moral code that was the law of his life.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iv. Barbarism And The Moral Code
