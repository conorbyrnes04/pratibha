unit_label: The moment that man conceived of a perfect body, supple, symmetrical, graceful
title: The moment that man conceived of a perfect body, supple, symmetrical, graceful
unit_type: reflection
original: The moment that man conceived of a perfect body, supple, symmetrical, graceful, and enduring--in
  that moment he had laid the foundation of a moral life! No man can hope to maintain such a temple of
  the spirit beyond the period of adolescence, unless he is able to curb his indulgence in the pleasures
  of the senses. Upon this truth the Indian built a rigid system of physical training, a social and moral
  code that was the law of his life.
commentary: 'Eastman argues that the Indian moral life begins not with abstract doctrine but with a concrete
  vision: the disciplined body as a spiritual foundation. The passage suggests that physical integrity—maintained
  through restraint—is inseparable from ethical maturity; the body is not an obstacle to spirit but its
  necessary temple. This reverses a common Western dualism by making sensory discipline the *ground* of
  moral life, not its opposite.'
practice: 'Today, notice one moment when you feel pulled toward sensory indulgence (food, distraction,
  comfort). Pause and ask: What would it mean to honor my body as a ''temple'' in this small choice? Not
  through denial, but through conscious restraint. Observe what shifts.'
