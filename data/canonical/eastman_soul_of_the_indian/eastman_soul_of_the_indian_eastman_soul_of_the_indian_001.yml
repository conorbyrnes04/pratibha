title: The original attitude of the American Indian toward the Eternal
unit_type: reflection
original: The original attitude of the American Indian toward the Eternal, the “Great Mystery” that surrounds
  and embraces us, was as simple as it was exalted. To him it was the supreme conception, bringing with
  it the fullest measure of joy and satisfaction possible in this life.
commentary: 'Eastman presents the Dakota relationship to the sacred as fundamentally characterized by
  simplicity and elevation—not complexity of doctrine, but directness of encounter with what he calls
  the ''Great Mystery.'' This attitude, he suggests, is not primitive but rather stripped of unnecessary
  mediation, and it produces a concrete fruit: joy and life-satisfaction. The passage invites us to consider
  whether spiritual depth requires elaborate theology or whether it can rest in immediate, uncluttered
  awareness.'
practice: 'Sit quietly for five minutes. Notice what surrounds and embraces you—air, light, sound, presence.
  Without naming it theologically, simply acknowledge: this vastness is here. What shifts in your sense
  of satisfaction or peace when you stop trying to explain it and simply meet it?'
