original: The original attitude of the American Indian toward the Eternal, the “Great Mystery” that surrounds and embraces
  us, was as simple as it was exalted. To him it was the supreme conception, bringing with it the fullest measure of joy and
  satisfaction possible in this life.
abhyasa: 'Sit quietly for five minutes. Notice what surrounds and embraces you—air, light, sound, presence. Without naming
  it theologically, simply acknowledge: this vastness is here. What shifts in your sense of satisfaction or peace when you
  stop trying to explain it and simply meet it?'
