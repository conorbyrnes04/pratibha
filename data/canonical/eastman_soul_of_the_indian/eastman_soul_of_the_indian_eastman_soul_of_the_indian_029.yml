pratibha_layers:
- kind: original
  label: Original
  body: The old-time burial of the Plains Indians was upon a scaffold of poles, or a platform among the
    boughs of a tree--their only means of placing the body out of reach of wild beasts, as they had no
    implements with which to dig a suitable grave. It was prepared by dressing in the finest clothes,
    together with some personal possessions and ornaments, wrapped in several robes, and finally in a
    secure covering of raw-hide. As a special mark of respect, the body of a young woman or a warrior
    was sometimes laid out in state in a new teepee, with the usual household articles and even with a
    dish of food left beside it, not that they supposed the spirit could use the implements or eat the
    food but merely as a last tribute. Then the whole people would break camp and depart to a distance,
    leaving the dead alone in an honorable solitude.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Vi. On The Border-Land Of Spirits
