abhyasa: 'Today, consider one person you have lost or one you know who is grieving. Reflect: What objects, clothes, or spaces
  held meaning for that person? How might you honor their memory not by supposing they ''need'' these things, but as Eastman
  describes—as a ''last tribute'' that acknowledges both their life and their departure?'
