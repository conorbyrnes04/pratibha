abhyasa: Today, find ten minutes of genuine quiet. Sit without filling silence with thought, speech, or distraction. Notice
  where you feel 'storms'—restlessness, reaction, the urge to speak or move. Practice returning to stillness, as if you were
  that tree or pool. Observe what becomes visible when you stop.
