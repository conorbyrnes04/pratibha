pratibha_layers:
- kind: original
  label: Original
  body: The first American mingled with his pride a singular humility. Spiritual arrogance was foreign
    to his nature and teaching. He never claimed that the power of articulate speech was proof of superiority
    over the dumb creation; on the other hand, it is to him a perilous gift. He believes profoundly in
    silence--the sign of a perfect equilibrium. Silence is the absolute poise or balance of body, mind,
    and spirit. The man who preserves his selfhood ever calm and unshaken by the storms of existence--not
    a leaf, as it were, astir on the tree; not a ripple upon the surface of shining pool--his, in the
    mind of the unlettered sage, is the ideal attitude and conduct of life.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iv. Barbarism And The Moral Code
