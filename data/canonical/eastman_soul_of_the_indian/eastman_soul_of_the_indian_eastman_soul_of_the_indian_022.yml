work_title: The Soul of the Indian
unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_022
unit_label: Naturally magnanimous and open-minded
title: Naturally magnanimous and open-minded
unit_type: reflection
original: Naturally magnanimous and open-minded, the red man prefers to believe that the Spirit of God
  is not breathed into man alone, but that the whole created universe is a sharer in the immortal perfection
  of its Maker. His imaginative and poetic mind, like that of the Greek, assigns to every mountain, tree,
  and spring its spirit, nymph, or divinity either beneficent or mischievous. The heroes and demigods
  of Indian tradition reflect the characteristic trend of his thought, and his attribution of personality
  and will to the elements, the sun and stars, and all animate or inanimate nature.
commentary: Eastman articulates a Dakota understanding of the sacred as distributed throughout creation
  rather than confined to human beings alone. By describing this as a natural inclination of the Dakota
  mind—to perceive spirit, personality, and will in mountains, trees, elements, and celestial bodies—he
  positions this not as superstition but as a coherent metaphysical vision. The passage suggests that
  for Dakota thought, divinity is relational and present everywhere, making all of creation a participant
  in the sacred rather than a resource separate from it.
practice: Today, sit with one natural element or place you encounter (a tree, stone, stream, or patch
  of sky). Rather than naming it, listen for what quality or presence it seems to hold. Notice without
  judgment whether you sense any 'personality' or intention in it. This is not belief-making, but an exercise
  in the perceptual shift Eastman describes.
abhyasa: Today, sit with one natural element or place you encounter (a tree, stone, stream, or patch of
  sky). Rather than naming it, listen for what quality or presence it seems to hold. Notice without judgment
  whether you sense any 'personality' or intention in it. This is not belief-making, but an exercise in
  the perceptual shift Eastman describes.
