- kind: key_terms
  label: Key Terms
  body: '**Spirit of God** — In Eastman''s usage here, the sacred or divine presence understood as pervading
    all creation, not limited to human souls alone.

    **immortal perfection of its Maker** — The enduring, divine quality shared by all created things as
    participants in the Creator''s nature.'
  items:
  - term: Spirit of God
    definition: In Eastman's usage here, the sacred or divine presence understood as pervading all creation,
      not limited to human souls alone.
  - term: immortal perfection of its Maker
    definition: The enduring, divine quality shared by all created things as participants in the Creator's
      nature.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... The Tao flows through
    all things.'':** Both traditions locate the sacred as a pervasive presence flowing through all phenomena
    rather than confined to one realm. Divergence: Eastman emphasizes personality and will in natural
    beings; the Tao is described as beyond naming and personality, more fundamental than intention.


    **Spinoza''s *Ethics*: ''God, or Nature'' — all things are modes of one infinite substance.:** Both
    reject a dualism separating spirit from matter, seeing divinity as immanent in the natural world.
    Divergence: Eastman''s vision grants individual spirits and agencies to natural beings; Spinoza''s
    monism dissolves individual personality into one infinite whole.


    **Heraclitus: ''All things flow; all things have logos (divine reason).'':** Both assign a kind of
    intelligence or order to natural phenomena as expressions of a universal principle. Divergence: Eastman
    speaks of beneficent or mischievous spirits with will; Heraclitus emphasizes impersonal, rational
    order underlying change.'
