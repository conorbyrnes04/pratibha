pratibha_layers:
- kind: original
  label: Original
  body: Naturally magnanimous and open-minded, the red man prefers to believe that the Spirit of God is
    not breathed into man alone, but that the whole created universe is a sharer in the immortal perfection
    of its Maker. His imaginative and poetic mind, like that of the Greek, assigns to every mountain,
    tree, and spring its spirit, nymph, or divinity either beneficent or mischievous. The heroes and demigods
    of Indian tradition reflect the characteristic trend of his thought, and his attribution of personality
    and will to the elements, the sun and stars, and all animate or inanimate nature.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: V. The Unwritten Scriptures
original: Naturally magnanimous and open-minded, the red man prefers to believe that the Spirit of God
  is not breathed into man alone, but that the whole created universe is a sharer in the immortal perfection
  of its Maker. His imaginative and poetic mind, like that of the Greek, assigns to every mountain, tree,
  and spring its spirit, nymph, or divinity either beneficent or mischievous. The heroes and demigods
  of Indian tradition reflect the characteristic trend of his thought, and his attribution of personality
  and will to the elements, the sun and stars, and all animate or inanimate nature.
