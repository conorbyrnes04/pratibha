unit_label: The American Indian was an individualist in religion…
title: The American Indian was an individualist in religion…
unit_type: reflection
commentary: 'Eastman articulates a Dakota spiritual vision centered on parental responsibility rather than institutional mediation—each
  person answers directly for their own spiritual development, and parents hold a quasi-priestly role because they create
  and protect life, mirroring divine function. This challenges the reader to see ''individualism'' not as isolation but as
  accountability: spirituality is relational (parent-child) and grounded in the creative act itself, not delegated to a separate
  priestly class. The passage suggests that proximity to the sacred comes through the ordinary work of nurturing, not through
  institutional authority.



  Key Terms



  **individualist in religion** — Direct, personal spiritual accountability—not mediated by priests or institutions, but lived
  through one''s own conscience and relationships.

  **priestly office** — In this passage, the sacred function of creating, protecting, and spiritually guiding another—a role
  Eastman locates in parents, not clergy.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their knowledge
  is unfathomable.'':** Both texts resist institutional mediation of the sacred and locate wisdom in direct relationship and
  natural function rather than hierarchy. Divergence: Eastman emphasizes *parental creative power* as the bridge to the divine;
  the Tao Te Ching points toward wu wei (non-action) and mystery beyond human roles.


  **Ecclesiastes 12:13: ''Fear God and keep his commandments, for this is the whole duty of man.'':** Both passages locate
  ultimate spiritual responsibility in the individual, not an intermediary institution. Divergence: Ecclesiastes frames duty
  as obedience to commandment; Eastman frames it as relational stewardship and creative participation in divine function.


  **Meister Eckhart: ''God is in the innermost part of each thing... the more inward you go, the more unified you become.'':**
  Both suggest the sacred is accessed through direct interiority and personal accountability, not external priestly apparatus.
  Divergence: Eckhart emphasizes mystical union with the divine within; Eastman grounds the sacred in the social act of parenting
  and protection.'
