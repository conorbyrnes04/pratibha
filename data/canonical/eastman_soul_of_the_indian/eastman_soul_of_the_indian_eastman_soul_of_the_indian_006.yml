  label: Original
  body: The American Indian was an individualist in religion as in war. He had neither a national army nor an organized church.
    There was no priest to assume responsibility for another’s soul. That is, we believed, the supreme duty of the parent,
    who only was permitted to claim in some degree the priestly office and function, since it is his creative and protecting
    power which alone approaches the solemn function of Deity.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his own words, published
    to interpret Native spirituality across cultures. A living tradition — offered here as a study reading, with respect to
    Dakota descendants.
  section: Ii. The Family Altar
original: The American Indian was an individualist in religion as in war. He had neither a national army nor an organized
  church. There was no priest to assume responsibility for another’s soul. That is, we believed, the supreme duty of the parent,
  who only was permitted to claim in some degree the priestly office and function, since it is his creative and protecting
  power which alone approaches the solemn function of Deity.
abhyasa: 'Reflect today on one person for whom you hold creative or protective responsibility (a child, elder, mentee, or
  even a project you shepherd). Notice: what spiritual or moral weight does that role carry? What wisdom or integrity does
  it demand of you? Sit with that for five minutes without rushing to answer.'
