unit_label: Every religion has its Holy Book, and ours was a mingling of history, poetry, and prophecy
title: Every religion has its Holy Book, and ours was a mingling of history, poetry, and prophecy
unit_type: reflection
original: Every religion has its Holy Book, and ours was a mingling of history, poetry, and prophecy,
  of precept and folk-lore, even such as the modern reader finds within the covers of his Bible. This
  Bible of ours was our whole literature, a living Book, sowed as precious seed by our wisest sages, and
  springing anew in the wondering eyes and upon the innocent lips of little children. Upon its hoary wisdom
  of proverb and fable, its mystic and legendary lore thus sacredly preserved and transmitted from father
  to son, was based in large part our customs and philosophy.
commentary: Eastman presents Dakota spiritual knowledge as a living, orally transmitted literature—not
  written but embodied in storytelling, proverb, and the teaching of children. He draws a deliberate parallel
  to the Bible to help his (largely non-Native) readers recognize the sophistication and sacred authority
  of Dakota wisdom, while emphasizing that this 'Book' remains alive through each generation's retelling
  rather than fixed in print. The passage insists that custom and philosophy flow from this transmitted
  knowledge, making spirituality inseparable from daily practice and kinship.
practice: Today, listen for one piece of wisdom—a proverb, story, or teaching—that has been passed to
  you orally (from a parent, elder, or tradition). Sit with it silently for a few minutes. Notice how
  it lives differently in your memory and body than words on a page might. What does it ask of you now?
