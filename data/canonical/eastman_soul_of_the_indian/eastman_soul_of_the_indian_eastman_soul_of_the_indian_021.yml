- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Psalm 119 (Hebrew Bible):** Both treat sacred knowledge as a lamp to the feet and light to
    the path—guiding daily life and custom through transmitted wisdom. Divergence: The Psalm fixes this
    wisdom in written Torah; Eastman''s ''Book'' remains oral and regenerative, ''springing anew'' in
    each child''s eyes rather than inscribed.


    **Plato, *Phaedrus* (on oral vs. written tradition):** Both privilege living speech and memory over
    dead letters; wisdom must be spoken and received, not merely read. Divergence: Plato fears writing
    will weaken memory; Eastman celebrates oral transmission as the *form* of sacred knowledge itself,
    not a substitute for writing.


    **Confucian *Li* (ritual propriety):** Both root custom and philosophy in transmitted teachings; practice
    and precept are inseparable. Divergence: Confucianism emphasizes formal ritual and hierarchy; Eastman
    stresses the organic, poetic, and familial nature of transmission—''from father to son'' through wonder
    and innocence.'
