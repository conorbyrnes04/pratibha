  label: Original
  body: Every religion has its Holy Book, and ours was a mingling of history, poetry, and prophecy, of
    precept and folk-lore, even such as the modern reader finds within the covers of his Bible. This Bible
    of ours was our whole literature, a living Book, sowed as precious seed by our wisest sages, and springing
    anew in the wondering eyes and upon the innocent lips of little children. Upon its hoary wisdom of
    proverb and fable, its mystic and legendary lore thus sacredly preserved and transmitted from father
    to son, was based in large part our customs and philosophy.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: V. The Unwritten Scriptures
original: Every religion has its Holy Book, and ours was a mingling of history, poetry, and prophecy,
  of precept and folk-lore, even such as the modern reader finds within the covers of his Bible. This
  Bible of ours was our whole literature, a living Book, sowed as precious seed by our wisest sages, and
  springing anew in the wondering eyes and upon the innocent lips of little children. Upon its hoary wisdom
  of proverb and fable, its mystic and legendary lore thus sacredly preserved and transmitted from father
  to son, was based in large part our customs and philosophy.
