- kind: key_terms
  label: Key Terms
  body: '**the great Mysterious One** — The divine principle in Santee Dakota creation teaching, characterized
    by remaining hidden and not anthropomorphized; the source from which Sun and Earth emerge as creative
    agents.

    **Sun and Earth** — The male and female principles through which creation actively unfolds; the primary
    agents of generation rather than the Mysterious One itself.'
  items:
  - term: the great Mysterious One
    definition: The divine principle in Santee Dakota creation teaching, characterized by remaining hidden
      and not anthropomorphized; the source from which Sun and Earth emerge as creative agents.
  - term: Sun and Earth
    definition: The male and female principles through which creation actively unfolds; the primary agents
      of generation rather than the Mysterious One itself.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, opening verses:** Both teach that the ultimate source (Tao / Mysterious One)
    cannot be directly named or depicted, and that creation flows through natural complementarity rather
    than command. Divergence: Eastman grounds this in specific celestial and earthly bodies (Sun, Earth),
    while the Tao Te Ching remains more abstract and non-dual.


    **Heraclitus, fragments on flux and hidden harmony:** Both suggest that reality unfolds through dynamic
    relationship and that the deepest principle operates ''in the background,'' invisible yet generative.
    Divergence: Eastman''s account emphasizes gender and fertility as organizing principles, while Heraclitus
    emphasizes tension and strife as the hidden driver.


    **Meister Eckhart, on God''s hiddenness and creation:** Both describe the divine as remaining withdrawn
    and mysterious while creation proceeds through natural and relational means. Divergence: Eckhart frames
    this within Christian apophatic theology and the soul''s union with God; Eastman''s account is cosmological
    and ecological rather than mystical-personal.'
