  label: Original
  body: In the Sioux story of creation, the great Mysterious One is not brought directly upon the scene or conceived in anthropomorphic
    fashion, but remains sublimely in the background. The Sun and the Earth, representing the male and female principles,
    are the main elements in his creation, the other planets being subsidiary. The enkindling warmth of the Sun entered into
    the bosom of our mother, the Earth, and forthwith she conceived and brought forth life, both vegetable and animal.
