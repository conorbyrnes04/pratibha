title: In the Sioux story of creation, the great Mysterious…
unit_type: reflection
commentary: 'Eastman presents a creation cosmology where the divine remains intentionally hidden—not personified or directly
  depicted—while creation unfolds through the generative encounter of Sun and Earth as complementary principles. This structure
  suggests that the sacred operates through relationship and natural process rather than through command or direct intervention,
  placing human understanding in a position of humble observation rather than presumption about divine form.



  Key Terms



  **the great Mysterious One** — The divine principle in Santee Dakota creation teaching, characterized by remaining hidden
  and not anthropomorphized; the source from which Sun and Earth emerge as creative agents.

  **Sun and Earth** — The male and female principles through which creation actively unfolds; the primary agents of generation
  rather than the Mysterious One itself.



  Cross-Tradition Resonances



  **Tao Te Ching, opening verses:** Both teach that the ultimate source (Tao / Mysterious One) cannot be directly named or
  depicted, and that creation flows through natural complementarity rather than command. Divergence: Eastman grounds this
  in specific celestial and earthly bodies (Sun, Earth), while the Tao Te Ching remains more abstract and non-dual.


  **Heraclitus, fragments on flux and hidden harmony:** Both suggest that reality unfolds through dynamic relationship and
  that the deepest principle operates ''in the background,'' invisible yet generative. Divergence: Eastman''s account emphasizes
  gender and fertility as organizing principles, while Heraclitus emphasizes tension and strife as the hidden driver.


  **Meister Eckhart, on God''s hiddenness and creation:** Both describe the divine as remaining withdrawn and mysterious while
  creation proceeds through natural and relational means. Divergence: Eckhart frames this within Christian apophatic theology
  and the soul''s union with God; Eastman''s account is cosmological and ecological rather than mystical-personal.'
