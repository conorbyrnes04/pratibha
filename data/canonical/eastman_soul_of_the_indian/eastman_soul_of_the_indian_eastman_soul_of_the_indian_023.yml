  label: Original
  body: In the Sioux story of creation, the great Mysterious One is not brought directly upon the scene
    or conceived in anthropomorphic fashion, but remains sublimely in the background. The Sun and the
    Earth, representing the male and female principles, are the main elements in his creation, the other
    planets being subsidiary. The enkindling warmth of the Sun entered into the bosom of our mother, the
    Earth, and forthwith she conceived and brought forth life, both vegetable and animal.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: V. The Unwritten Scriptures
original: In the Sioux story of creation, the great Mysterious One is not brought directly upon the scene
  or conceived in anthropomorphic fashion, but remains sublimely in the background. The Sun and the Earth,
  representing the male and female principles, are the main elements in his creation, the other planets
  being subsidiary. The enkindling warmth of the Sun entered into the bosom of our mother, the Earth,
  and forthwith she conceived and brought forth life, both vegetable and animal.
