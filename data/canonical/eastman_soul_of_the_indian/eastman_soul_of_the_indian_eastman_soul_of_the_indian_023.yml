original: In the Sioux story of creation, the great Mysterious One is not brought directly upon the scene or conceived in
  anthropomorphic fashion, but remains sublimely in the background. The Sun and the Earth, representing the male and female
  principles, are the main elements in his creation, the other planets being subsidiary. The enkindling warmth of the Sun
  entered into the bosom of our mother, the Earth, and forthwith she conceived and brought forth life, both vegetable and
  animal.
abhyasa: 'Today, notice one moment of natural generation or growth—a plant unfurling, warmth entering a space, two elements
  meeting. Pause and consider: what is happening here without my naming or controlling it? What remains mysterious in the
  act itself?'
