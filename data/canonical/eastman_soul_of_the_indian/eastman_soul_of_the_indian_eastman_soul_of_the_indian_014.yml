pratibha_layers:
- kind: original
  label: Original
  body: It is noteworthy that the first effect of contact with the whites was an increase of cruelty and
    barbarity, an intensifying of the dark shadows in the picture! In this manner the “Sun Dance” of the
    Plains Indians, the most important of their public ceremonials, was abused and perverted until it
    became a horrible exhibition of barbarism, and was eventually prohibited by the Government.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iii. Ceremonial And Symbolic Worship
original: It is noteworthy that the first effect of contact with the whites was an increase of cruelty
  and barbarity, an intensifying of the dark shadows in the picture! In this manner the “Sun Dance” of
  the Plains Indians, the most important of their public ceremonials, was abused and perverted until it
  became a horrible exhibition of barbarism, and was eventually prohibited by the Government.
