- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Frantz Fanon, *The Wretched of the Earth*:** Both Eastman and Fanon argue that colonialism
    does not refine but corrupts indigenous practice, turning it toward violence or caricature. Divergence:
    Fanon emphasizes violent resistance as necessary response; Eastman here emphasizes interpretive recovery
    and cross-cultural explanation.


    **Ecclesiastes 1:9 (''there is nothing new under the sun''):** Both suggest that human nature contains
    both light and shadow; the question is what conditions amplify which. Divergence: Ecclesiastes treats
    this as cosmic inevitability; Eastman locates it in historical contact and colonial policy—thus changeable.'
  items:
  - citation: Frantz Fanon, *The Wretched of the Earth*
    resonance: Both Eastman and Fanon argue that colonialism does not refine but corrupts indigenous practice,
      turning it toward violence or caricature.
    divergence: Fanon emphasizes violent resistance as necessary response; Eastman here emphasizes interpretive
      recovery and cross-cultural explanation.
  - citation: Ecclesiastes 1:9 ('there is nothing new under the sun')
    resonance: Both suggest that human nature contains both light and shadow; the question is what conditions
      amplify which.
    divergence: Ecclesiastes treats this as cosmic inevitability; Eastman locates it in historical contact
      and colonial policy—thus changeable.
