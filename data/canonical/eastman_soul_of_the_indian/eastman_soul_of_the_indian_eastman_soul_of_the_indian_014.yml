unit_label: It is noteworthy that the first effect of contact with the whites
title: It is noteworthy that the first effect of contact with the whites
unit_type: reflection
original: It is noteworthy that the first effect of contact with the whites was an increase of cruelty
  and barbarity, an intensifying of the dark shadows in the picture! In this manner the “Sun Dance” of
  the Plains Indians, the most important of their public ceremonials, was abused and perverted until it
  became a horrible exhibition of barbarism, and was eventually prohibited by the Government.
commentary: 'Eastman argues that European contact did not ''civilize'' Native peoples but rather amplified
  existing practices toward extremity and harm—the Sun Dance, a central ceremonial, was distorted by this
  contact into something unrecognizable and ultimately suppressed by colonial authority. His point cuts
  against the colonial narrative of ''savage customs'': he locates the barbarism not in Native tradition
  itself, but in the collision and corruption that contact produced. This reverses the burden of judgment
  onto the colonizer.'
practice: 'Reflect on a tradition or practice you hold dear. Consider: what happens to it under pressure,
  judgment, or external control? Does it become exaggerated, defensive, or distorted? Write one sentence
  about how you might protect its integrity.'
