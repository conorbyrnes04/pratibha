  body: 'If you ask him: “What is silence?” he will answer: “It is the Great Mystery!” “The holy silence
    is His voice!” If you ask: “What are the fruits of silence?” he will say: “They are self-control,
    true courage or endurance, patience, dignity, and reverence. Silence is the cornerstone of character.”'
