- kind: key_terms
  label: Key Terms
  body: '**the Great Mystery** — In this passage, the sacred or divine reality that speaks through silence;
    the ultimate ground Eastman identifies with the holy.

    **holy silence** — Not emptiness but the voice or presence of the Great Mystery; silence as a form
    of communication or revelation.'
