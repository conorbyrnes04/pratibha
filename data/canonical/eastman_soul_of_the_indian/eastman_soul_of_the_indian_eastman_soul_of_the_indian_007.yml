  - term: Great Mystery
    definition: Eastman's term for the sacred or divine presence that Dakota spiritual life orients toward;
      the ultimate reality of which all creation partakes.
  - term: brotherhood with all creation
    definition: A relational stance toward the natural world—not dominion or separation, but kinship and
      mutual belonging.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both texts prize silence, stillness, and receptivity as paths to
    wisdom. The sage ''keeps to the mother'' and moves through the world without forcing. Divergence:
    Eastman locates this receptivity specifically in the pregnant body and maternal practice, whereas
    Laozi addresses the sage''s inner state universally.


    **Meister Eckhart, ''Breakthrough'' sermons:** Both emphasize the soul''s openness and ''poverty''
    (emptiness of ego) as necessary for divine influence; both use natural imagery (wilderness, water)
    to evoke this state. Divergence: Eckhart frames breakthrough as transcendence of the self; Eastman
    frames it as deepening kinship with the world, not escape from it.


    **Ecclesiastes 3:1–8 (''A time for every purpose''):** Both recognize that human life unfolds in seasons
    and rhythms; both honor the body and its natural cycles as spiritually significant. Divergence: Ecclesiastes
    emphasizes the cyclical return and human limitation; Eastman emphasizes the mother''s active spiritual
    agency in shaping the future.'
