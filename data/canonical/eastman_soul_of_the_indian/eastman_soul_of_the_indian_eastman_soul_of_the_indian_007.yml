- kind: key_terms
  label: Key Terms
  body: '**Great Mystery** — Eastman''s term for the sacred or divine presence that Dakota spiritual life
    orients toward; the ultimate reality of which all creation partakes.

    **brotherhood with all creation** — A relational stance toward the natural world—not dominion or separation,
    but kinship and mutual belonging.'
