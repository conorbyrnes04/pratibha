pratibha_layers:
- kind: original
  label: Original
  body: The Indian was a religious man from his mother’s womb. From the moment of her recognition of the
    fact of conception to the end of the second year of life, which was the ordinary duration of lactation,
    it was supposed by us that the mother’s spiritual influence counted for most. Her attitude and secret
    meditations must be such as to instill into the receptive soul of the unborn child the love of the
    “Great Mystery” and a sense of brotherhood with all creation. Silence and isolation are the rule of
    life for the expectant mother. She wanders prayerful in the stillness of great woods, or on the bosom
    of the untrodden prairie, and to her poetic mind the immanent birth of her child prefigures the advent
    of a master-man--a hero, or the mother of heroes--a thought conceived in the virgin breast of primeval
    nature, and dreamed out in a hush that is only broken by the sighing of the pine tree or the thrilling
    orchestra of a distant waterfall.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Ii. The Family Altar
original: The Indian was a religious man from his mother’s womb. From the moment of her recognition of
  the fact of conception to the end of the second year of life, which was the ordinary duration of lactation,
  it was supposed by us that the mother’s spiritual influence counted for most. Her attitude and secret
  meditations must be such as to instill into the receptive soul of the unborn child the love of the “Great
  Mystery” and a sense of brotherhood with all creation. Silence and isolation are the rule of life for
  the expectant mother. She wanders prayerful in the stillness of great woods, or on the bosom of the
  untrodden prairie, and to her poetic mind the immanent birth of her child prefigures the advent of a
  master-man--a hero, or the mother of heroes--a thought conceived in the virgin breast of primeval nature,
  and dreamed out in a hush that is only broken by the sighing of the pine tree or the thrilling orchestra
  of a distant waterfall.
