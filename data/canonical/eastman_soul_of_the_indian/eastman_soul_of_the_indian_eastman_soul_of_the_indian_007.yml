unit_label: The Indian was a religious man from his mother’s womb
title: The Indian was a religious man from his mother’s womb
unit_type: reflection
original: The Indian was a religious man from his mother’s womb. From the moment of her recognition of
  the fact of conception to the end of the second year of life, which was the ordinary duration of lactation,
  it was supposed by us that the mother’s spiritual influence counted for most. Her attitude and secret
  meditations must be such as to instill into the receptive soul of the unborn child the love of the “Great
  Mystery” and a sense of brotherhood with all creation. Silence and isolation are the rule of life for
  the expectant mother. She wanders prayerful in the stillness of great woods, or on the bosom of the
  untrodden prairie, and to her poetic mind the immanent birth of her child prefigures the advent of a
  master-man--a hero, or the mother of heroes--a thought conceived in the virgin breast of primeval nature,
  and dreamed out in a hush that is only broken by the sighing of the pine tree or the thrilling orchestra
  of a distant waterfall.
commentary: Eastman describes a Dakota understanding of spiritual formation that begins before birth,
  rooted in the mother's inner life and her immersion in natural solitude. The passage presents conception
  not as a biological fact alone but as a spiritual transmission—the mother's meditations and attitude
  shape the child's soul toward reverence for the 'Great Mystery' and kinship with all beings. This framework
  treats pregnancy as a contemplative practice, not a passive state, and locates spiritual education in
  the body, the land, and the quality of attention a mother brings to her waiting.
practice: 'Today, sit in a quiet place—indoors or outside—for ten minutes without agenda. Notice what
  arises in the stillness: a thought, a feeling, a sound. Rather than dismiss it, ask: *What is this teaching
  me about connection?* This mirrors the passage''s emphasis on silence and receptivity as spiritual disciplines,
  available to anyone regardless of tradition.'
