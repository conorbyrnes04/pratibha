unit_label: There was no prescribed ceremony of burial, though…
title: There was no prescribed ceremony of burial, though…
unit_type: reflection
commentary: 'Eastman describes Dakota burial practice not as rigid ritual but as flexible honor—the body''s placement and
  posture communicate the person''s character and values to the living and to the landscape itself. A warrior facing his enemy
  even in death embodies a principle: that courage and dignity persist beyond the body''s end. The choice of hilltop suggests
  the deceased remains part of the community''s visual and spiritual geography, not removed from it.



  Key Terms



  **sitting position, facing the enemy** — A posture of defiance and presence; the body''s final orientation as a statement
  of character and resolve, not submission.



  Cross-Tradition Resonances



  **Bhagavad Gita, Arjuna''s stand at Kurukshetra:** Both traditions honor the warrior who faces conflict with courage; death
  does not negate the stance taken in life. Divergence: The Gita emphasizes duty and dharma as cosmic law; Eastman emphasizes
  the individual''s personal defiance and the community''s witnessing of it.


  **Heraclitus, ''character is destiny'':** Both suggest that how one stands—one''s bearing and choices—defines one''s essence,
  even beyond death. Divergence: Heraclitus speaks of an abstract logos; Eastman grounds character in the body''s literal
  posture and the land''s memory.'
