pratibha_layers:
- kind: original
  label: Original
  body: There was no prescribed ceremony of burial, though the body was carried out with more or less
    solemnity by selected young men, and sometimes noted warriors were the pall-bearers of a man of distinction.
    It was usual to choose a prominent hill with a commanding outlook for the last resting-place of our
    dead. If a man were slain in battle, it was an old custom to place his body against a tree or rock
    in a sitting position, always facing the enemy, to indicate his undaunted defiance and bravery, even
    in death.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Vi. On The Border-Land Of Spirits
original: There was no prescribed ceremony of burial, though the body was carried out with more or less
  solemnity by selected young men, and sometimes noted warriors were the pall-bearers of a man of distinction.
  It was usual to choose a prominent hill with a commanding outlook for the last resting-place of our
  dead. If a man were slain in battle, it was an old custom to place his body against a tree or rock in
  a sitting position, always facing the enemy, to indicate his undaunted defiance and bravery, even in
  death.
