- kind: key_terms
  label: Key Terms
  body: '**sitting position, facing the enemy** — A posture of defiance and presence; the body''s final
    orientation as a statement of character and resolve, not submission.'
  items:
  - term: sitting position, facing the enemy
    definition: A posture of defiance and presence; the body's final orientation as a statement of character
      and resolve, not submission.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Bhagavad Gita, Arjuna''s stand at Kurukshetra:** Both traditions honor the warrior who faces
    conflict with courage; death does not negate the stance taken in life. Divergence: The Gita emphasizes
    duty and dharma as cosmic law; Eastman emphasizes the individual''s personal defiance and the community''s
    witnessing of it.


    **Heraclitus, ''character is destiny'':** Both suggest that how one stands—one''s bearing and choices—defines
    one''s essence, even beyond death. Divergence: Heraclitus speaks of an abstract logos; Eastman grounds
    character in the body''s literal posture and the land''s memory.'
  items:
