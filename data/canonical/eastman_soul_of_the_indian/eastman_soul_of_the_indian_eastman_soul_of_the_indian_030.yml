unit_label: There was no prescribed ceremony of burial
title: There was no prescribed ceremony of burial
unit_type: reflection
original: There was no prescribed ceremony of burial, though the body was carried out with more or less
  solemnity by selected young men, and sometimes noted warriors were the pall-bearers of a man of distinction.
  It was usual to choose a prominent hill with a commanding outlook for the last resting-place of our
  dead. If a man were slain in battle, it was an old custom to place his body against a tree or rock in
  a sitting position, always facing the enemy, to indicate his undaunted defiance and bravery, even in
  death.
commentary: 'Eastman describes Dakota burial practice not as rigid ritual but as flexible honor—the body''s
  placement and posture communicate the person''s character and values to the living and to the landscape
  itself. A warrior facing his enemy even in death embodies a principle: that courage and dignity persist
  beyond the body''s end. The choice of hilltop suggests the deceased remains part of the community''s
  visual and spiritual geography, not removed from it.'
practice: Today, visit or visualize a place of significance in your own life—a hill, tree, or threshold.
  Sit facing something that once challenged you. Notice what it means to hold your posture, your attention,
  your presence there. What does your body's orientation say about what you value?
abhyasa: Today, visit or visualize a place of significance in your own life—a hill, tree, or threshold.
  Sit facing something that once challenged you. Notice what it means to hold your posture, your attention,
  your presence there. What does your body's orientation say about what you value?
