- kind: original
  label: Original
  body: The fur-traders, the “Black Robe” priests, the military, and finally the Protestant missionaries, were the men who
    began the disintegration of the Indian nations and the overthrow of their religion, seventy-five to a hundred years before
    they were forced to enter upon reservation life. We have no authentic study of them until well along in the transition
    period, when whiskey and trade had already debauched their native ideals.
