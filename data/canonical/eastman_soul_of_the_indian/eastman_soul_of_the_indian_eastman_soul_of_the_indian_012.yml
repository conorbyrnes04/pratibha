  label: Original
  body: The fur-traders, the “Black Robe” priests, the military, and finally the Protestant missionaries,
    were the men who began the disintegration of the Indian nations and the overthrow of their religion,
    seventy-five to a hundred years before they were forced to enter upon reservation life. We have no
    authentic study of them until well along in the transition period, when whiskey and trade had already
    debauched their native ideals.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iii. Ceremonial And Symbolic Worship
original: The fur-traders, the “Black Robe” priests, the military, and finally the Protestant missionaries,
  were the men who began the disintegration of the Indian nations and the overthrow of their religion,
  seventy-five to a hundred years before they were forced to enter upon reservation life. We have no authentic
  study of them until well along in the transition period, when whiskey and trade had already debauched
  their native ideals.
