  label: Original
  body: As a child, I understood how to give; I have forgotten that grace since I became civilized. I
    lived the natural life, whereas I now live the artificial. Any pretty pebble was valuable to me then;
    every growing tree an object of reverence. Now I worship with the white man before a painted landscape
    whose value is estimated in dollars! Thus the Indian is reconstructed, as the natural rocks are ground
    to powder, and made into artificial blocks which may be built into the walls of modern society.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iv. Barbarism And The Moral Code
original: As a child, I understood how to give; I have forgotten that grace since I became civilized.
  I lived the natural life, whereas I now live the artificial. Any pretty pebble was valuable to me then;
  every growing tree an object of reverence. Now I worship with the white man before a painted landscape
  whose value is estimated in dollars! Thus the Indian is reconstructed, as the natural rocks are ground
  to powder, and made into artificial blocks which may be built into the walls of modern society.
