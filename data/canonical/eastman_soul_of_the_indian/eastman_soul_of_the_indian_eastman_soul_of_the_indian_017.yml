unit_type: reflection
commentary: 'Eastman contrasts his childhood Dakota practice of perceiving inherent worth in natural objects with the alienation
  he experiences after assimilation into Euro-American society. His critique is not romantic nostalgia but a sharp observation:
  civilization has replaced direct, reverent relationship with nature with mediated, commodified perception. The metaphor
  of rocks ground into powder suggests that assimilation is a violent transformation, not an upgrade—the individual loses
  their original form to become a standardized unit of a foreign structure.



  Key Terms



  **the natural life** — In Eastman''s usage, a way of being characterized by direct perception of inherent worth in creation,
  and the practice of giving without calculation—contrasted with ''artificial'' life organized around commodity and accumulation.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts describe a loss of original nature through civilization: ''The ancient masters
  were profound and wise... because they were so profound, they cannot be described.'' Eastman similarly mourns the forgetting
  of an original grace through ''reconstruction.'' Divergence: The Tao Te Ching frames this as a universal human condition;
  Eastman specifically identifies it as the consequence of colonial assimilation and cultural erasure.


  **Ecclesiastes 2:11 (''all is vanity''):** Both passages critique the futility of valuing things by human estimation—Ecclesiastes
  condemns the pursuit of wealth and achievement; Eastman condemns the reduction of nature to dollar value. Divergence: Ecclesiastes
  concludes with resignation to human limitation; Eastman''s tone is accusatory, naming a specific historical rupture rather
  than an eternal human condition.


  **Heraclitus, Fragment 123 (on phusis/nature):** Heraclitus emphasizes that nature reveals itself to those who attend carefully;
  Eastman''s childhood practice of reverence toward ''every growing tree'' parallels this attentive perception of natural
  being. Divergence: Heraclitus assumes nature''s intelligibility is always available to the wise; Eastman suggests it can
  be systematically forgotten and replaced through social reconstruction.'
