category: root_text
work_id: eastman_soul_of_the_indian
work_title: The Soul of the Indian
unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_017
unit_label: As a child, I understood how to give
title: As a child, I understood how to give
unit_type: reflection
original: As a child, I understood how to give; I have forgotten that grace since I became civilized.
  I lived the natural life, whereas I now live the artificial. Any pretty pebble was valuable to me then;
  every growing tree an object of reverence. Now I worship with the white man before a painted landscape
  whose value is estimated in dollars! Thus the Indian is reconstructed, as the natural rocks are ground
  to powder, and made into artificial blocks which may be built into the walls of modern society.
commentary: 'Eastman contrasts his childhood Dakota practice of perceiving inherent worth in natural objects
  with the alienation he experiences after assimilation into Euro-American society. His critique is not
  romantic nostalgia but a sharp observation: civilization has replaced direct, reverent relationship
  with nature with mediated, commodified perception. The metaphor of rocks ground into powder suggests
  that assimilation is a violent transformation, not an upgrade—the individual loses their original form
  to become a standardized unit of a foreign structure.'
practice: 'Today, find one natural object (a stone, leaf, branch) and spend five minutes with it as Eastman
  describes his childhood practice: not naming its market value or aesthetic category, but simply attending
  to it as worthy of reverence in itself. Notice what shifts in your perception when you release the impulse
  to evaluate or possess.'
abhyasa: 'Today, find one natural object (a stone, leaf, branch) and spend five minutes with it as Eastman
  describes his childhood practice: not naming its market value or aesthetic category, but simply attending
  to it as worthy of reverence in itself. Notice what shifts in your perception when you release the impulse
  to evaluate or possess.'
