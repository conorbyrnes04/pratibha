abhyasa: 'Today, find one natural object (a stone, leaf, branch) and spend five minutes with it as Eastman describes his childhood
  practice: not naming its market value or aesthetic category, but simply attending to it as worthy of reverence in itself.
  Notice what shifts in your perception when you release the impulse to evaluate or possess.'
