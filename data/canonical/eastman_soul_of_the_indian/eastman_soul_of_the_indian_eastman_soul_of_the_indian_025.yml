- kind: key_terms
  label: Key Terms
  body: '**First-Born of the Sioux** — The original human being in this Dakota creation account, characterized
    by self-sufficiency and the capacity to teach.

    **Little Boy Man** — The second being, created as an innocent and dependent child, whose growth through
    teaching by the Elder Brother establishes the model for human development and spiritual transmission.'
  items:
  - term: First-Born of the Sioux
    definition: The original human being in this Dakota creation account, characterized by self-sufficiency
      and the capacity to teach.
  - term: Little Boy Man
    definition: The second being, created as an innocent and dependent child, whose growth through teaching
      by the Elder Brother establishes the model for human development and spiritual transmission.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Genesis 2:18–22 (Hebrew Bible):** Both accounts address human solitude and the creation of
    a companion to end it; both ground subsequent law and custom in this primordial relationship. Divergence:
    Genesis frames the second being as created from the first''s body to be a ''helper'' and mate; Eastman''s
    account creates a brother from a splinter, emphasizing equality and pedagogical rather than complementary
    or hierarchical relationship.


    **Plato''s *Symposium* (ancient Greek philosophy):** Both explore the human need for companionship
    and the formative power of mentorship in shaping character and understanding. Divergence: Plato locates
    this need in erotic or philosophical desire between peers; Eastman grounds it in the elder''s duty
    to nurture the young, making teaching—not desire—the primary bond.'
  items:
