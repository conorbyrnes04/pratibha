- kind: original
  label: Original
  body: At last, like Adam, the “First-Born” of the Sioux became weary of living alone, and formed for
    himself a companion--not a mate, but a brother--not out of a rib from his side, but from a splinter
    which he drew from his great toe! This was the Little Boy Man, who was not created full-grown, but
    as an innocent child, trusting and helpless. His Elder Brother was his teacher throughout every stage
    of human progress from infancy to manhood, and it is to the rules which he laid down, and his counsels
    to the Little Boy Man, that we trace many of our most deep-rooted beliefs and most sacred customs.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: V. The Unwritten Scriptures
