pratibha_layers:
- kind: original
  label: Original
  body: In the old days, when a Sioux warrior found himself in the very jaws of destruction, he might
    offer a prayer to his father, the Sun, to prolong his life. If rescued from imminent danger, he must
    acknowledge the divine favor by making a Sun Dance, according to the vow embraced in his prayer, in
    which he declared that he did not fear torture or death, but asked life only for the sake of those
    who loved him. Thus the physical ordeal was the fulfillment of a vow, and a sort of atonement for
    what might otherwise appear to be reprehensible weakness in the face of death. It was in the nature
    of confession and thank-offering to the “Great Mystery,” through the physical parent, the Sun, and
    did not embrace a prayer for future favors.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Iii. Ceremonial And Symbolic Worship
