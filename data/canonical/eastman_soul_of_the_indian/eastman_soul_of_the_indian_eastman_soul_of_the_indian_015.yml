title: In the old days, when a Sioux warrior found himself…
unit_type: reflection
commentary: 'Eastman presents the Sun Dance not as mystical spectacle but as a structured covenant: a warrior in mortal peril
  makes a conditional vow to the Sun (understood as mediator to the Great Mystery), and if spared, fulfills that vow through
  physical ordeal. The ordeal itself is neither punishment nor self-mortification for its own sake, but the *keeping of a
  promise*—a way of acknowledging debt and restoring balance after being rescued. The passage emphasizes reciprocity and accountability:
  one does not ask for life for oneself alone, but for those dependent on you, and one does not use the vow to secure future
  favors, only to honor what has already been given.



  Key Terms



  **Great Mystery** — The ultimate sacred reality or creative force to which prayers and offerings are directed; understood
  here as transcendent and mediated through natural forms like the Sun.

  **Sun Dance** — A ceremonial ordeal undertaken to fulfill a vow made in extremity; a physical enactment of covenant-keeping
  and thanksgiving.



  Cross-Tradition Resonances



  **Hebrew Bible, Psalm 116 (''I love the Lord, because he heard my voice''):** Both texts frame rescue as creating an obligation:
  the psalmist asks ''What shall I render to the Lord for all his benefits to me?'' Eastman''s warrior similarly must *do*
  something to acknowledge deliverance. Divergence: The psalmist''s response is inward devotion and testimony; Eastman emphasizes
  a *physical, embodied* fulfillment of a *prior conditional vow*, not a spontaneous gift.


  **Tao Te Ching, Chapter 15 (''The ancient masters were subtle, profound, and unfathomable''):** Both texts value restraint
  and balance: the Tao warns against grasping for future favor; Eastman explicitly states the vow ''did not embrace a prayer
  for future favors.'' Divergence: The Tao teaches non-action and wu-wei; Eastman''s warrior must *act decisively*—the ordeal
  is necessary, not transcended.


  **Aristotle, Nicomachean Ethics, on reciprocal justice and the mean:** Both texts treat obligation as a form of justice:
  one must repay what one owes. Eastman''s warrior restores balance through the ordeal, as Aristotle''s just person restores
  proportion. Divergence: Aristotle grounds reciprocity in rational calculation and civic order; Eastman grounds it in sacred
  covenant and kinship (the vow is made ''for the sake of those who loved him'').'
