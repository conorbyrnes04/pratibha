  label: Original
  body: Long before I ever heard of Christ, or saw a white man, I had learned from an untutored woman the essence of morality.
    With the help of dear Nature herself, she taught me things simple but of mighty import. I knew God. I perceived what goodness
    is. I saw and loved what is really beautiful. Civilization has not taught me anything better!
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his own words, published
    to interpret Native spirituality across cultures. A living tradition — offered here as a study reading, with respect to
    Dakota descendants.
