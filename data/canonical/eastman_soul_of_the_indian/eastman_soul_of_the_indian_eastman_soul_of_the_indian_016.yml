title: Long before I ever heard of Christ, or saw a white…
unit_type: reflection
commentary: 'Eastman claims that moral knowledge—understanding of God, goodness, and beauty—came to him before European contact,
  through a woman''s teaching and direct encounter with the natural world. He does not reject civilization but asserts that
  it has not *improved* upon what he already knew. This is a statement about the sufficiency and integrity of Dakota moral
  formation, not a romantic rejection of learning itself.



  Key Terms



  **untutored woman** — A person whose moral teaching came from lived practice and relationship rather than formal schooling;
  in Eastman''s account, his grandmother or another elder who transmitted Dakota values.

  **dear Nature herself** — The natural world as a direct teacher and source of moral and spiritual knowledge, not merely
  a setting but an active presence in formation.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described
  with difficulty.'':** Both texts suggest that deep wisdom is simple, difficult to articulate, and known through direct perception
  rather than explanation. Divergence: Eastman grounds his knowing in a specific person and place (Dakota woman, nature);
  the Tao Te Ching points toward an impersonal, nameless principle.


  **Thoreau, Walden: ''I went to the woods because I wished to live deliberately... and not, when I came to die, discover
  that I had not lived.'':** Both writers trust nature as a teacher and question whether civilization''s offerings constitute
  genuine improvement. Divergence: Thoreau frames nature-learning as a deliberate experiment and personal choice; Eastman
  describes it as the ordinary inheritance of his upbringing.


  **Socrates in Plato''s Apology: ''The unexamined life is not worth living.'':** Both assert that true knowledge of goodness
  is available to those who attend carefully—not the exclusive property of the formally educated. Divergence: Socrates emphasizes
  rational questioning and dialogue; Eastman emphasizes receptive learning from a teacher and from nature.'
