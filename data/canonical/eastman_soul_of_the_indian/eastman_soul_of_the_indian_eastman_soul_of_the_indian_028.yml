- kind: commentary
  label: Pratibha Commentary
  body: 'Eastman describes mourning practices that embody grief through radical physical and material
    sacrifice—cutting hair, blackening faces, gashing skin, surrendering possessions—rather than through
    restrained social convention. The passage suggests that authentic mourning is a total surrender of
