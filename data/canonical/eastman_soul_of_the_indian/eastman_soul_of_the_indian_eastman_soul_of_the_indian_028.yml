- kind: key_terms
  label: Key Terms
  body: '**wailing** — Continuous vocal mourning, described here as reaching ''utter voicelessness''—a
    sound that is both musical and piercing, suggesting grief expressed as an audible, communal act rather
    than silent endurance.'
  items:
  - term: wailing
    definition: Continuous vocal mourning, described here as reaching 'utter voicelessness'—a sound that
      is both musical and piercing, suggesting grief expressed as an audible, communal act rather than
      silent endurance.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Job 1:20 (Hebrew Bible):** Job tears his robe and shaves his head in response to catastrophic
    loss, using the body and appearance as instruments of lament. Divergence: Eastman emphasizes the *continuation*
    and communal nature of mourning (wailing night and day), whereas Job''s act is more singular and quickly
    moves toward philosophical questioning.


    **Iliad, Book 18 (Homer):** Achilles and the Myrmidons engage in prolonged, physical mourning for
    Patroclus—cutting hair, blackening faces, refusing food—as a total surrender to grief. Divergence:
    Homer frames this within heroic honor and social status; Eastman emphasizes the *release* of all earthly
    concern and possession, suggesting a spiritual rather than status-based transformation.'
  items:
  - citation: Job 1:20 (Hebrew Bible)
    resonance: Job tears his robe and shaves his head in response to catastrophic loss, using the body
      and appearance as instruments of lament.
    divergence: Eastman emphasizes the *continuation* and communal nature of mourning (wailing night and
      day), whereas Job's act is more singular and quickly moves toward philosophical questioning.
  - citation: Iliad, Book 18 (Homer)
