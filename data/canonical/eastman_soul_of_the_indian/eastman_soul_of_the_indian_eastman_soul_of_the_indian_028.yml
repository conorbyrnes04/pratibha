pratibha_layers:
- kind: original
  label: Original
  body: The outward signs of mourning for the dead are far more spontaneous and convincing than is the
    correct and well-ordered black of civilization. Both men and women among us loosen their hair and
    cut it according to the degree of relationship or of devotion. Consistent with the idea of sacrificing
    all personal beauty and adornment, they trim off likewise from the dress its fringes and ornaments,
    perhaps cut it short, or cut the robe or blanket in two. The men blacken their faces, and widows or
    bereaved parents sometimes gash their arms and legs till they are covered with blood. Giving themselves
    up wholly to their grief, they are no longer concerned about any earthly possession, and often give
    away all that they have to the first comers, even to their beds and their home. Finally, the wailing
    for the dead is continued night and day to the point of utter voicelessness; a musical, weird, and
    heart-piercing sound, which has been compared to the “keening” of the Celtic mourner.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Vi. On The Border-Land Of Spirits
