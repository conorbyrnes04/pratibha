  label: Original
  body: Finally there appeared mysteriously Ish-na-e-cha-ge, the “First-Born,” a being in the likeness
    of man, yet more than man, who roamed solitary among the animal people and understood their ways and
    their language. They beheld him with wonder and awe, for they could do nothing without his knowledge.
    He had pitched his tent in the centre of the land, and there was no spot impossible for him to penetrate.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: V. The Unwritten Scriptures
original: Finally there appeared mysteriously Ish-na-e-cha-ge, the “First-Born,” a being in the likeness
  of man, yet more than man, who roamed solitary among the animal people and understood their ways and
  their language. They beheld him with wonder and awe, for they could do nothing without his knowledge.
  He had pitched his tent in the centre of the land, and there was no spot impossible for him to penetrate.
