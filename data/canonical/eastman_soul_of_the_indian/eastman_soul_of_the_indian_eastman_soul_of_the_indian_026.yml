pratibha_layers:
- kind: original
  label: Original
  body: The attitude of the Indian toward death, the test and background of life, is entirely consistent
    with his character and philosophy. Death has no terrors for him; he meets it with simplicity and perfect
    calm, seeking only an honorable end as his last gift to his family and descendants. Therefore he courts
    death in battle; on the other hand, he would regard it as disgraceful to be killed in a private quarrel.
    If one be dying at home, it is customary to carry his bed out of doors as the end approaches, that
    his spirit may pass under the open sky.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Vi. On The Border-Land Of Spirits
