- kind: key_terms
  label: Key Terms
  body: '**the test and background of life** — Death understood not as separate from life, but as its
    measure and context—the frame that gives life meaning and reveals character.'
  items:
  - term: the test and background of life
    definition: Death understood not as separate from life, but as its measure and context—the frame that
      gives life meaning and reveals character.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Plato, *Apology* (Socrates on death):** Both texts present death as a threshold where character
    is revealed and virtue is tested; both reject fear as the proper response. Divergence: Socrates emphasizes
    individual philosophical knowledge; Eastman emphasizes duty to family and community as the measure
    of an honorable death.


    **Analects of Confucius (on ritual propriety and context):** Both traditions hold that the *context*
    of an action—not the action alone—determines its moral meaning; courage in battle differs from violence
    in quarrel. Divergence: Confucius grounds meaning in social hierarchy and role; Eastman grounds it
    in the relationship between the individual spirit and the natural world (the open sky).'
