- kind: key_terms
  label: Key Terms
  body: '**transition period** — In Eastman''s usage, the era of cultural change initiated by contact
    with European settlers—marked by gradual influence on customs before formal displacement, not a single
    event.

    **nomadic life** — The mobile, seasonal lifeways of Plains peoples before forced settlement; Eastman
    notes cultural shifts occurred even while this way of life continued.'
  items:
  - term: transition period
    definition: In Eastman's usage, the era of cultural change initiated by contact with European settlers—marked
      by gradual influence on customs before formal displacement, not a single event.
  - term: nomadic life
    definition: The mobile, seasonal lifeways of Plains peoples before forced settlement; Eastman notes
      cultural shifts occurred even while this way of life continued.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Walter Benjamin, ''Theses on the Philosophy of History'' (1940):** Both Eastman and Benjamin
    attend to how dominant forces reshape culture insidiously, before overt rupture—Benjamin''s ''state
    of exception'' parallels Eastman''s ''insidious effect.'' Divergence: Benjamin theorizes this as a
    universal historical problem; Eastman speaks from lived experience of a specific colonial encounter,
    grounding abstraction in Dakota reality.


    **Ecclesiastes 1:9 (''there is nothing new under the sun''):** Both texts question whether what appears
    novel is truly so—Eastman suggests ''modern'' ceremonies may mask older losses rather than represent
    continuity. Divergence: Ecclesiastes offers cyclical resignation; Eastman''s tone is diagnostic and
    clarifying, inviting readers to see through surface claims.'
