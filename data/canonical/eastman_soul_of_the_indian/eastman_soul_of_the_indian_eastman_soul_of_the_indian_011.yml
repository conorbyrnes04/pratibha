- kind: original
  label: Original
  body: The public religious rites of the Plains Indians are few, and in large part of modern origin, belonging properly to
    the so-called “transition period.” That period must be held to begin with the first insidious effect upon their manners
    and customs of contact with the dominant race, and many of the tribes were so influenced long before they ceased to lead
    the nomadic life.
