  label: Original
  body: Presently she returns to the camp, carrying the mysterious, the holy, the dearest bundle! She feels the endearing
    warmth of it and hears its soft breathing. It is still a part of herself, since both are nourished by the same mouthful,
    and no look of a lover could be sweeter than its deep, trusting gaze.
