  label: Original
  body: Presently she returns to the camp, carrying the mysterious, the holy, the dearest bundle! She
    feels the endearing warmth of it and hears its soft breathing. It is still a part of herself, since
    both are nourished by the same mouthful, and no look of a lover could be sweeter than its deep, trusting
    gaze.
provenance:
  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his
    own words, published to interpret Native spirituality across cultures. A living tradition — offered
    here as a study reading, with respect to Dakota descendants.
  section: Ii. The Family Altar
original: Presently she returns to the camp, carrying the mysterious, the holy, the dearest bundle! She
  feels the endearing warmth of it and hears its soft breathing. It is still a part of herself, since
  both are nourished by the same mouthful, and no look of a lover could be sweeter than its deep, trusting
  gaze.
