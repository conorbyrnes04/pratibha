- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts locate
    wisdom in receptive presence and non-interference; the mother receives the child as it is. Divergence:
    Eastman emphasizes the warmth and active nourishment of relationship, while the Tao emphasizes stillness
    and emptiness.


    **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
    point to a mutual, non-dual gaze as the site of the sacred. Divergence: Eckhart''s language is metaphysical
    and abstract; Eastman grounds the sacred in the body, breath, and milk.'
