commentary: 'Eastman describes the bond between mother and newborn as a continuation of physical and spiritual unity—''still
  a part of herself''—rather than a separation. The child is ''mysterious'' and ''holy'' not because it is distant or unknowable,
  but because the ordinary act of nursing and gazing holds sacred presence. This passage suggests that Dakota spirituality
  locates the sacred in intimate, embodied relationship rather than in abstraction or ritual alone.



  Key Terms



  **the mysterious, the holy** — In this passage, qualities that belong to the newborn and the bond itself—not distant or
  ceremonial, but intimate and alive.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts locate wisdom in receptive presence
  and non-interference; the mother receives the child as it is. Divergence: Eastman emphasizes the warmth and active nourishment
  of relationship, while the Tao emphasizes stillness and emptiness.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both point to a mutual, non-dual
  gaze as the site of the sacred. Divergence: Eckhart''s language is metaphysical and abstract; Eastman grounds the sacred
  in the body, breath, and milk.'
