  and no look of a lover could be sweeter than its deep, trusting gaze.
abhyasa: Sit quietly and recall a moment when you felt genuinely seen by another person—their gaze meeting yours without judgment.
  Notice what 'deep, trusting gaze' felt like in your body. What did that presence ask of you?
