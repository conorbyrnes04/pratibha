  collection: The Soul of the Indian
  cultural_context: Charles Eastman (Ohíyeʼsa) was a Santee Dakota writer and physician; these are his own words, published
    to interpret Native spirituality across cultures. A living tradition — offered here as a study reading, with respect to
    Dakota descendants.
