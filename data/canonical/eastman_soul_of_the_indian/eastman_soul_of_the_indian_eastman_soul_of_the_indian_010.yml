abhyasa: Spend 10 minutes in silence outdoors, or by a window. Notice one natural element (bird, tree, water, wind). Rather
  than naming it scientifically, observe it as a presence—what is it doing, expressing, or communicating? Write or sit with
  one image without interpretation.
