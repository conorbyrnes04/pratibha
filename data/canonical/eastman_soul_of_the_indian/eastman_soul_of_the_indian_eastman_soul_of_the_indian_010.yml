  body: She continues her spiritual teaching, at first silently--a mere pointing of the index finger to nature; then in whispered
    songs, bird-like, at morning and evening. To her and to the child the birds are real people, who live very close to the
    “Great Mystery”; the murmuring trees breathe His presence; the falling waters chant His praise.
