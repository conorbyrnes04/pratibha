title: God Alone Contains All Temporal Distinctions
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: Praise belongs to God, before whose oneness there is no before unless the before is He
  and after whose singleness there is no after unless the after is He. He is, and there is not with Him
  any before or after, above or below, closeness or distance, how or where or when, time or moment or
  duration, manifested existence or place.
translation_literal: In the name of God, the Merciful, the Compassionate, and from Him we ask for aid.
  Praise be to God, before whose oneness there was no before—unless the Before be He—and after whose singleness
  there is no after, unless the After be He. He is, and with Him there is no after nor before, nor above
  nor below, nor far nor near, nor union nor division, nor how nor where nor when, nor times nor moment
  nor age, nor being nor place. And He is now as He was. He is the One without oneness, and the Single
  without singleness. He is not composed of name and named, for His name is He and His named is He. So
  there is no name other than He, nor any named. He is the First without firstness, and the Last without
  lastness. He is the Outward without outwardness, and the Inward without inwardness. I mean that He is
  the very existence of the First and the very existence of the Last, the very existence of the Outward
  and the very existence of the Inward. So there is no first nor last, no outward nor inward, except Him,
  without these becoming Him or His becoming them.
commentary: 'This opening establishes the treatise''s central claim: that God is not one being among others
  but the sole Reality (waḥdat al-wujūd), the very existence underlying every category by which we ordinarily
  divide up the world. Notice the paradoxical grammar—''oneness without oneness,'' ''First without firstness.''
  By negating the abstract quality even as he affirms the name, the author blocks us from turning God
  into a thing describable by qualities. To say God is ''the First'' does not place Him at the head of
  a sequence; rather, past eternity, future eternity, and present time are all simply His existence, without
  any of them possessing existence of their own. Every temporal and spatial distinction—before/after,
  above/below, near/far, when/where—is dissolved because these presuppose a plurality of existents, and
  there is in reality only One. The move is not to erase time and place as experiences but to deny them
  independent being apart from God. ''He is now as He was'' is the refrain: nothing has been added to
  or subtracted from the divine reality by the appearance of the world. This dismantles the notion that
  creation introduces genuine ''newness'' alongside God. Understanding this reframes self-knowledge as
  knowledge of God, the theme the treatise will develop: since you have no existence of your own, to know
  your own reality truly is to know His.


  Key Terms


  **waḥdat al-wujūd** — ''Oneness of being''—the doctrine that there is only one Reality/Existence, God,
  and that all apparent existents have no independent being apart from Him.

  **tawḥīd** — The affirmation of divine unity; here deepened from a creedal statement into the recognition
  that nothing whatsoever possesses existence beside God.

  **al-awwal wa-l-ākhir** — ''The First and the Last''—divine names affirmed here ''without firstness
  or lastness,'' meaning God is the very existence of all temporal poles rather than a term within a sequence.'
insight: ''
practice: Reaching for something across the room, pause mid-gesture and whisper 'the Outward without outwardness'—letting
  the near hand and far object dissolve into the single existence that is stretching between them. Let
  the reaching continue, but as His act, not yours.
sanskrit_devanagari: 'الحمد لله الذي لم يكن قبل وحدانيته قبلُ إلا والقبل هو، ولم يكن بعد فردانيَّته بَعْدُ
  إلا والبَعْد هو. كان ولا بَعْد معه ولا قبل، ولا فوق ولا تحت، ولا قُرْب ولا بُعْد، ولا كيف، ولا أين ولا
  حين، ولا أوان ولا وقت ولا زمان، ولا كون ولا مكان، وهو الآن كما كان.


  هو الواحد بلا وحدانية، وهو الفرد بلا فردانية. ليس مركَّبًا من الاسم والمسمَّى: هو الأول بلا أولية وهو
  الآخِر بلا آخِرية، وهو الظاهر بلا ظاهرية وهو الباطن بلا باطنية؛ أعني أنه هو وجود حروف "الأول" وهو وجود
  حروف "الآخِر"، وهو وجود حروف "الباطن" وهو وجود حروف "الظاهر". فلا أول ولا آخِر ولا ظاهر ولا باطن إلا
  وهو بلا صيران. هذه الحروف وجوده، وصيران وجوده هذه الحروف. – فافهم هذا لئلا تقع في غلط الحلولية.'
sanskrit_iast: 'al-ḥamdu lil-lāh alladhī lam yakun qabla waḥdāniyyatih qablu illā wal-qabl huwa, walam
  yakun baʿda fardāniyyatih baʿdu illā wal-baʿd huwa. kāna walā baʿd maʿahu walā qabla, walā fawqa walā
  taḥta, walā qurb walā buʿd, walā kayfa, walā ayna walā ḥayna, walā awān walā waqt walā zamān, walā kawn
  walā makān, wa huwa al-ān kamā kāna.


  huwa al-wāḥid bilā waḥdāniyya, wa huwa al-fard bilā fardāniyya. laysa murakkaban min al-ism wal-masmā:
  huwa al-awwal bilā awwaliyya wa huwa al-ākhir bilā ākhiriyya, wa huwa al-ẓāhir bilā ẓāhiriyya wa huwa
  al-bāṭin bilā bāṭiniyya; aʿnī annahu huwa wujūd ḥurūf "al-awwal" wa huwa wujūd ḥurūf "al-ākhir", wa
  huwa wujūd ḥurūf "al-bāṭin" wa huwa wujūd ḥurūf "al-ẓāhir". fa-lā awwal walā ākhir walā ẓāhir walā bāṭin
  illā wa huwa bilā ṣayrān. hādhihi al-ḥurūf wujūdhu, wa ṣayrān wujūdhu hādhihi al-ḥurūf. – fafham hādhā
  li-allā taqaʿ fī ghalṭ al-ḥulūliyya.'
