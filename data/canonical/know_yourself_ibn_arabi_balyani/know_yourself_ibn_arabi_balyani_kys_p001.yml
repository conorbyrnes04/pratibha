unit_label: God Is Beyond Every Before and After
title: God Is Beyond Every Before and After
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: Praise belongs to God, before whose oneness there is no before unless the before is He
  and after whose singleness there is no after unless the after is He. He is, and there is not with Him
  any before or after, above or below, closeness or distance, how or where or when, time or moment or
  duration, manifested existence or place.
translation_literal: Praise be to God, before whose oneness there was no before, unless the Before was
  He; and after whose singleness there is no after, unless the After is He. He is, and with Him there
  is no after or before, no above or below, no far or near, no how, where, or when, no time, moment, or
  age, no being or place. And He is now as He was.
commentary: 'The passage begins from an uncompromising claim: God is not one item within the universe,
  however supreme, but the Reality by which every temporal, spatial, and conceptual distinction is possible.
  “Before” and “after” cannot stand outside Him as independent coordinates; neither can height and depth,
  nearness and distance, or the questions “how?” and “where?” The formula “He is now as He was” does not
  merely place God in an immensely long duration. It denies that divine reality is altered by the appearance
  of the world or measured by its sequence of moments. In the idiom later associated with waḥdat al-wujūd,
  all determinate things depend upon Being, while God is not contained by the determinations through which
  creatures are known. This is why self-knowledge can become knowledge of the Lord: to know the self truthfully
  is to see that its location, duration, qualities, and apparent independence are not self-grounding.
  The contested move is severe. It risks being heard as a flat denial of creaturely reality, or as collapsing
  Creator and creature into one substance. The text instead guards divine transcendence by refusing every
  relation that would place God and the world side by side. Yet its language presses toward a radical
  non-duality that many theologians judged hazardous.'
insight: ''
practice: Today, when you notice yourself saying “God is far away” or “God was there then,” pause once
  and silently release the spatial or temporal image; then attend to the fact that the awareness making
  the judgment is itself not self-created.
sanskrit_devanagari: الحمد لله الذي لم يكن قبل وحدانيته قبلُ إلا والقبل هو، ولم يكن بعد فردانيَّته بَعْدُ
  إلا والبَعْد هو. كان ولا بَعْد معه ولا قبل، ولا فوق ولا تحت، ولا قُرْب ولا بُعْد، ولا كيف، ولا أين ولا
  حين، ولا أوان ولا وقت ولا زمان، ولا كون ولا مكان، وهو الآن كما كان.
