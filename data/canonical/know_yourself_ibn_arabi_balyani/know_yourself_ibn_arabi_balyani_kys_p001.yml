source_excerpt: Praise belongs to God, before whose oneness there is no before unless the before is He and after whose singleness
  there is no after unless the after is He. He is, and there is not with Him any before or after, above or below, closeness
  or distance, how or where or when, time or moment or duration, manifested existence or place.
translation_literal: Praise belongs to God, before whose oneness there is no before unless the before is He and after whose
  singleness there is no after unless the after is He. He is, and there is not with Him any before or after, above or below,
  closeness or distance, how or where or when, time or moment or duration, manifested existence or place.
