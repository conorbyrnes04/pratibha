  items:
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: God Alone Contains All Temporal Distinctions Pearl #1 Praise
      belongs to God, before whose oneness there is no before unless the before is He and after whose
      si… Trap: hearing a creedal slogan rather than ontological exclusivity of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: He is, and there is not with Him any before or after,
      above or below, closeness or distance, how or where or when, time or moment or duration, manifested
      exist… Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and
      world'
  - term: huwa (هو)
    definition: 'Arabic third-person ‘He’ → the Real indicated beyond naming; deixis that refuses captive
      definition Here: He is, and there is not with Him any before or after, above or below, closeness
      or distance, how or where or when, time or moment or duration, manifested exist… Trap: hearing a
      mere pronoun rather than apophatic pointing'
  layer_provenance: editorial-enriched
