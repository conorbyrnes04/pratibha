- kind: key_terms
  label: Key Terms
  items:
  - term: وحدانيته
    definition: waḥdāniyya, from w-ḥ-d, “being one” -> God’s oneness prior to every imaginable ‘before’
      -> not merely numerical unity, as though God were one member of a class.
  - term: فردانيَّته
    definition: 'fardāniyya, from f-r-d, “being single, incomparable” -> the divine singularity after
      which no ‘after’ remains -> more than the default gloss ‘oneness’: it stresses unrivalled non-pairing.'
  - term: كيف
    definition: kayf, “how-ness” -> any modality by which a thing can be described or imagined -> not
      simply a question-word, but the category of qualifying determination.
  - term: كون
    definition: kawn, from k-w-n, “to be/become” -> phenomenal being or becoming, set beside place and
      time among created determinations -> not identical with God’s unconditioned reality.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” gives Qur’anic warrant for speaking
      of God without temporal or spatial rivalry.
    divergence: The passage intensifies the verse into an explicit negation of before, after, above, below,
      and every qualifying relation.
  - citation: Qur’an 112:1-4
    resonance: Sūrat al-Ikhlāṣ affirms divine oneness, self-sufficiency, and incomparability.
    divergence: Its concise creed does not itself articulate the metaphysical claim that all temporal
      and spatial categories fail before divine reality.
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, “Adam” chapter
    resonance: The later Akbarian vocabulary likewise treats the cosmos as dependent disclosure rather
      than an independent reality alongside God.
    divergence: 'This short opening is more apophatic: it enumerates and strips away relations before
      explaining manifestation or divine names.'
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice yourself saying “God is far away” or “God was there then,” pause once and
    silently release the spatial or temporal image; then attend to the fact that the awareness making
    the judgment is itself not self-created.
