title: Existence Dissolves When Attention Turns Inward
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- way
source_excerpt: What is meant is that you never were and never will be, whether through yourself or through
  Him or in Him or with Him. You have neither ceased to be nor are you existent. You are Him and He is
  you, without any of these imperfections. If you know your existence in this way, then you know God,
  and if not, then not.
translation_literal: 'The Prophet (upon whom be peace) points out by this that you are not you: you are
  He, without you—not He entering into you, nor you entering into Him, nor He proceeding forth from you,
  nor you proceeding forth from Him. And it is not meant by this that you are something that exists, or
  that your attributes are something that exists; rather, it is meant that you never were nor will be,
  whether by yourself, or through Him, or in Him, or along with Him. You are neither ceasing to be nor
  still existing. You are He, without any of these limitations. So if you know your existence in this
  way, then you know God; and if not, then not.


  Most of those who know God make the ceasing of existence, and the ceasing of that ceasing, a condition
  for attaining the knowledge of God—and that is an error and a clear oversight. For the knowledge of
  God does not presuppose the ceasing of existence, nor the ceasing of that ceasing. For things have no
  existence, and what does not exist cannot cease to exist. To speak of ceasing to be implies affirming
  existence first, and that is polytheism. So if you know yourself without existence or ceasing to be,
  then you know God; and if not, then not.'
commentary: 'This passage strikes at the very heart of Balyānī''s teaching and at a common misunderstanding
  among seekers. The theme—that ''existence dissolves when attention turns inward''—must be handled carefully,
  for the text insists that nothing actually dissolves, because there was never a rival existence there
  to begin with. The saying ''Whoso knoweth himself knoweth his Lord'' is read not as a program of self-annihilation
  but as an unveiling of what always was. To ''turn attention inward'' is not to erase the self, but to
  discover that the self one imagined was never an independent reality at all.


  Here lies the treatise''s sharp critique of a popular Sufi vocabulary of fanāʾ (passing away) and even
  fanāʾ al-fanāʾ (the passing away of passing away). Balyānī argues that to speak of your existence ''ceasing''
  secretly grants that your existence was real in the first place—and to posit a real existence alongside
  God is shirk (associating a partner with God). The logic is unforgiving: extinction requires a something
  to be extinguished; if you were truly a something, you could not be extinguished; if you are nothing,
  there is nothing to extinguish. Either way, the language of ''annihilation'' smuggles in the very duality
  it claims to overcome.


  This is the practical face of waḥdat al-wujūd, the oneness of being. You are not asked to destroy yourself
  and merge into God, as though two things became one. Rather you are asked to recognize that ''you''
  were only ever a case of mistaken identity. The phrase ''you are He, without you'' guards both sides:
  it denies that you are a separate existent, and it equally denies any crude incarnation (God entering
  you or you entering God). Nothing enters, nothing exits, nothing merges—because there were never two.
  Self-knowledge, then, is simply the removal of ignorance, like a man learning his own true name.


  Key Terms


  **fanāʾ** — Sufi term for ''passing away'' or annihilation of the self in God; Balyānī critiques it
  as subtly affirming a separate existence that must be extinguished, which he regards as hidden shirk.

  **maʿrifa** — Direct experiential knowledge of God; here identified with true self-knowledge, since
  to know one''s own non-independent reality is to know God.

  **waḥdat al-wujūd** — The ''oneness of being'': the doctrine that there is only one true Existence,
  God''s, and that the apparent existence of creatures is not a second reality alongside His.'
insight: ''
practice: Speaking of yourself, drop the word 'am' and say instead 'He, without me'—as you wash a dish,
  cross a room, answer a question, let the phrase quietly replace the sense that someone independent is
  doing these things. Notice that nothing has to disappear for this to be true; there was never a second
  one there to remove.
