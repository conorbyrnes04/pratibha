unit_label: Knowing the Self Dissolves the Claim of Separate Being
title: Knowing the Self Dissolves the Claim of Separate Being
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- way
source_excerpt: What is meant is that you never were and never will be, whether through yourself or through
  Him or in Him or with Him. You have neither ceased to be nor are you existent. You are Him and He is
  you, without any of these imperfections. If you know your existence in this way, then you know God,
  and if not, then not.
translation_literal: 'By this the Prophet—may God bless him and grant him peace—points out that you are
  not you: you are He, without you. He does not enter into you, nor do you enter into Him; He does not
  proceed from you, nor do you proceed from Him. This does not mean that you, or your attributes, are
  something that exists; rather, it means that you never were and never will be, whether by yourself,
  through Him, in Him, or with Him. You neither cease to be nor continue to exist. You are He, without
  any of these limitations. If you know your existence in this way, then you know God; if not, then not.'
commentary: 'The passage makes its most daring claim without allowing it to be reduced to incarnation,
  mixture, or a two-sided union: “you are He” is immediately qualified by “without you.” In the grammar
  of waḥdat al-wujūd, the point is not that a finite ego becomes divine, nor that God occupies a human
  container. Rather, the independent reality the ego assumes for itself is denied. The self known here
  is not the psychological personality but the supposed “I” that claims being of its own. To know oneself
  is therefore to find no self-subsisting existence alongside God; self-knowledge becomes knowledge of
  the Lord because the only real wujūd is God’s. The repeated refusals—neither in, with, nor apart; neither
  perishing nor remaining—also reject familiar mystical maps in which an individual first exists and then
  is annihilated. Balyānī’s contested move is more radical: annihilation cannot be an event affecting
  a truly existent creature, since that would still posit another being over against God. Critics can
  rightly worry that this language erases creaturely difference and moral agency. The text answers by
  treating difference as a mode of appearance and ignorance, not as a second source of existence.'
insight: ''
practice: 'Today, when you notice yourself saying “my life” or “my achievement,” pause once and silently
  ask: “What in this moment is truly mine by itself?”'
sanskrit_devanagari: 'أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل» أنت هو بلا أنت: لا هو داخل فيك
  ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك موجود وصفتك هكذا أبدًا: غني به. إنك
  ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود. أنت هو، وهو أنت، بلا علَّة من
  هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.'
