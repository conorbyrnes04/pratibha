- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: Here lies the treatise''s sharp critique of a popular Sufi vocabulary of fanāʾ (passing
      away) and even fanāʾ al-fanāʾ (the passing away of passing away). Trap: self-erasure as quietism
      or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This is the practical face of waḥdat al-wujūd, the oneness
      of being. Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and
      world'
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This is the practical face of waḥdat al-wujūd, the oneness of being.
      Trap: pantheist collapse that erases servant/Lord distinction'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: Balyānī argues that to speak of your existence ''ceasing'' secretly grants that your existence
      was real in the first place—and to posit a real existence alongsid… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
  - term: nafs (نفس)
    definition: '‘self/soul/breath’ → the claiming self that must be known so its independence can be
      seen through Here: And it is not meant by this that you are something that exists, or that your
      attributes are something that exists; rather, it is meant that you never were nor… Trap: psychologizing
      as ego-therapy without ontological stakes'
  layer_provenance: editorial-enriched
