- kind: key_terms
  label: Key Terms
  items:
  - term: أنت
    definition: The pronoun anta, “you,” names the presumed separate self in this passage, not simply
      the everyday person; the default gloss misses that its claim to independent being is what is being
      undone.
  - term: هو
    definition: Huwa, “He,” is the Qur’anic divine pronoun of sheer otherness; here it indicates the sole
      reality of being, not a deity fused with an individual subject.
  - term: وجودك
    definition: From w-j-d, “to find” or “be present,” wujūd means existence; “your existence” is examined
      as a claim, and its independence—not lived appearance as such—is denied.
  - term: معه
    definition: Maʿa means “with”; denying that one exists “with Him” excludes even a dependent co-presence
      that might preserve God and creature as two beings side by side.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural vocabulary
      behind the treatise’s refusal of before, after, inside, and outside as limits on God.
    divergence: The Qur’anic verse praises God through these Names; this passage extends them into an
      uncompromising denial of any independently existing self.
  - citation: “Whoever knows himself knows his Lord” (man ʿarafa nafsahu faqad ʿarafa rabbahu)
    resonance: 'The treatise treats this famous Sufi maxim as its governing key: recognizing the self’s
      non-independence discloses the divine reality.'
    divergence: Though widely circulated in Sufi literature, the saying is not securely established as
      a Prophetic hadith in the major canonical collections; Balyānī gives it a particularly radical ontological
      reading.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself saying “my life” or “my achievement,” pause once and silently
    ask: “What in this moment is truly mine by itself?”'
