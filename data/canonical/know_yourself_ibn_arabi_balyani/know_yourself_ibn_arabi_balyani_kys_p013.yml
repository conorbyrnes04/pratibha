work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p013
unit_label: Revelation Has No Sender Apart from God
title: Revelation Has No Sender Apart from God
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
source_excerpt: He sent Himself from Himself, through Himself to Himself. There is no intermediary or
  means other than Him. There is no difference between the sender, that which is sent and the one to whom
  it is sent. The very existence of the prophetic message is His existence.
translation_literal: 'His Prophet is He, His messenger is He, His message is He, and His word is He: He
  sends Himself by Himself, from Himself to Himself. There is no intermediary and no means other than
  He, and no difference between the Sender, that which is sent, and the one to whom it is sent. The existence
  of the letters of praise is His existence alone: there is no other—neither His praise, nor His name,
  nor His named.'
commentary: 'The passage presses divine unity into the event of revelation itself. Prophethood, messenger,
  message, speech, sender, and recipient cannot finally stand as independently existing terms alongside
  God. In the idiom of waḥdat al-wujūd, their apparent plurality is not a set of realities competing with
  the One Reality; it is the One’s self-disclosure. Thus self-knowledge is knowledge of the Lord because
  the self one takes to be an autonomous knower, hearer, or recipient has no separate being from which
  to encounter God as an object. God is said to send Himself to Himself: revelation is Reality making
  Reality known through the forms of speech, prophecy, and reception. The contested move is unmistakable.
  Classical theology ordinarily safeguards distinctions between God, the angelic messenger, the prophet,
  divine speech, and the human hearer. Balyānī’s compressed formulation does not merely connect these
  by divine causality; it denies that their difference amounts to a second existence. Read charitably,
  this is not a claim that historical distinctions vanish at the level of practice or law, but that they
  have no self-subsisting ontological standing. Its danger, and its force, lie in refusing to let even
  sacred mediation become a veil over the sole Reality.'
insight: ''
practice: 'Today, when you receive a word of guidance or correction, pause before claiming it as merely
  ‘from me’ or ‘from another,’ and silently ask: what dependence on God makes this hearing possible?'
sanskrit_devanagari: 'نبيُّه هو، ورسوله هو، ورسالته هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه،
  لا واسطة ولا سبب غيره، ولا تفاوُت بين المرسِل والمرسَل به والمرسَل إليه. وجود حروف الثناء وجوده لا غير،
  لا ثناؤه ولا اسمه ولا مُسمَّاه.'
