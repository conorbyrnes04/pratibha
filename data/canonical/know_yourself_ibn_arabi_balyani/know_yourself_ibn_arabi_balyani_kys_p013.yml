source_excerpt: He sent Himself from Himself, through Himself to Himself. There is no intermediary or
  means other than Him. There is no difference between the sender, that which is sent and the one to whom
  it is sent. The very existence of the prophetic message is His existence.
translation_literal: His Prophet is He, and His sending is He, and His word is He. He sent Himself, by
  Himself, to Himself. There was no mediator nor any means other than He. There is no difference between
  the Sender and the thing sent, and between the one who is sent and the one to whom he is sent. The very
  existence of the prophetic message is His existence. There is no other, and there is no existence belonging
  to any other than He — nor to its ceasing to be, nor to its name, nor to its named.
commentary: 'This dense passage drives home the central claim of the treatise: that there is truly only
  one existence, God''s existence, and that everything we take to be separate is in fact a mode of His
  self-disclosure. The chain ''He sent Himself, by Himself, to Himself'' collapses the ordinary structure
  of communication — sender, message, medium, recipient — into a single reality. In ordinary experience
  these four are distinct; in the vision of tawḥīd they are revealed as one, since nothing possesses an
  existence of its own that could stand over against God. The ''prophetic message'' is not a bridge thrown
  across a gap between two beings, for there is no gap and no second being. Its very existence is His
  existence. This prepares the treatise''s signature teaching: that self-knowledge is God''s self-knowledge.
  If the self has no independent existence, then when the self truly knows itself, it is God knowing Himself
  through what appeared to be other than Him. The passage also quietly guards against two errors: incarnationism
  (God ''entering'' a thing) and the notion that the self must be annihilated to reach God. Both errors
  secretly assume that the self has some real existence — either to be indwelt or to be extinguished.
  The teaching here is subtler: there is nothing to annihilate, because there was never a genuine second
  existence to begin with. Knowledge does not add or subtract existence; it only removes ignorance.


  Key Terms


  **tawḥīd** — The affirmation of God''s oneness; here understood in its deepest sense as the recognition
  that there is only one existence, God''s, and no genuine ''other'' alongside Him.

  **waḥdat al-wujūd** — The ''oneness of being'' — the doctrine that all apparent existents have no existence
  of their own but are manifestations of the single divine existence.

  **fanāʾ** — ''Ceasing to be'' or annihilation of the self; the treatise critiques taking this as a precondition
  for knowing God, since a self that never truly existed cannot be annihilated.'
insight: ''
practice: 'Speak a short sentence aloud to no one — ''the light is on,'' or any plain phrase — and, as
  the words leave you, trace the whole event: the one speaking, the speaking, the words, the one hearing.
  Let each of the four dissolve into the single existence sounding through all of them, so that nothing
  is sent across any gap because there is no gap and no second one.'
sanskrit_devanagari: 'حجابه وحدانيته، فلا يحجبه شيءٌ غير حجابه. وجوده وحدانيته، تستَّر بوحدانيته بلا كيفية.
  لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه. نبيُّه هو، ورسوله هو، ورسالته
  هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه، لا واسطة ولا سبب غيره، ولا تفاوُت بين المرسِل والمرسَل
  به والمرسَل إليه. وجود حروف الثناء وجوده لا غير، لا ثناؤه ولا اسمه ولا مُسمَّاه.'
sanskrit_iast: 'ḥijābuh waḥdānīyatu, fa-lā yaḥjubah shayʾun ghayra ḥijābih. wujūduhu waḥdānīyatu, tastaṭṭar
  biwaḥdānīyatihi bilā kayfiyyah. lā yarāhu aḥadun ghayrahu: lā nabiyyun mursal, walā walīyyun kāmil,
  walā malak muqarrab yaʿrifuhu. nabiyyuh huwa, wa-rasūluhu huwa, wa-risālatuhu huwa, wa-kalāmuhu huwa:
  arsal nafsahu binafsihi min nafsihi ilā nafsihi, lā wāsiṭah walā sabab ghayrahu, walā tafāwut bayna-l-mursil
  wal-mursal bihi wal-mursal ilaih. wujūd ḥurūf al-thanāʾ wujūduhu lā ghayra, lā thanāʾuhu walā ismuhu
  walā musammāh.'
