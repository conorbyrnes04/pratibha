- kind: key_terms
  label: Key Terms
  items:
  - term: نبيُّه
    definition: 'from n-b-ʾ, ‘to announce’ or ‘bear news’ -> the prophet is named as God’s own prophetic
      disclosure -> more than the default gloss ‘His prophet’: it destabilizes the prophet as an independently
      existing bearer of a message.'
  - term: رسالته
    definition: from r-s-l, ‘to send forth’ -> God’s message or sending is identified with Him -> not
      merely information delivered from one being to another, but the divine act of self-manifestation.
  - term: واسطة
    definition: from w-s-ṭ, ‘middle, intermediary’ -> every mediating link is denied independent ultimacy
      -> not simply a practical go-between, but a supposed ontological interval between God and God’s
      disclosure.
  - term: مُسمَّاه
    definition: the ‘named,’ from s-m-w/s-m, the object designated by a name -> name and named are refused
      separate being beside God -> missed by ‘thing named,’ which can obscure the critique of reifying
      linguistic distinctions.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 4:170
    resonance: The Qur’an calls Muḥammad God’s messenger who brings the truth from his Lord, grounding
      revelation in divine initiative.
    divergence: The verse retains the ordinary relation of Lord, messenger, and addressed people; this
      passage collapses their independent ontological standing into the One.
  - citation: Qur’an 42:51
    resonance: Revelation is described as God speaking through modes that include a messenger sent by
      His permission.
    divergence: Its articulated modes protect mediation within revelation, whereas the present text declares
      no intermediary or means other than God.
  - citation: Qur’an 57:3
    resonance: God is ‘the First and the Last, the Outward and the Inward,’ a formula underlying this
      treatise’s non-dual language.
    divergence: The Qur’anic proclamation need not entail that prophet, message, and recipient are simply
      God in the strong ontological sense asserted here.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you receive a word of guidance or correction, pause before claiming it as merely
    ‘from me’ or ‘from another,’ and silently ask: what dependence on God makes this hearing possible?'
