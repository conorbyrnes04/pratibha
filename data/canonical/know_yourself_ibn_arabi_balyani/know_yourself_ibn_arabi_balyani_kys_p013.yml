- kind: key_terms
  label: Key Terms
  items:
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: The very existence of the prophetic message is His existence.
      Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and world'
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Trap: hearing a creedal slogan rather than ontological exclusivity
      of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both texts make attention itself the primary instrument of knowledge: Ibn Arabi''s return
      of attention to the knower (rather than content) structurally mirrors the Siva Sutra''s equation
      of sustained attention with knowledge itself. In both, the shift is from what is known to the quality
      of knowing.'
    divergence: Ibn Arabi frames this as a reflexive movement of the divine Self (Himself to Himself),
      while the Siva Sutra treats attention as a yogic practice accessible to the practitioner; one is
      metaphysical circularity, the other is methodological discipline.
    passage_id: siva_sutra.ss_ii_12
  - citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
    resonance: 'Both passages establish a correspondence between an inner principle (the Self/Atman) and
      a mediating form (Om''s four quarters, or the triadic self-sending): each uses structural analysis
      to map the knower onto a symbolic system that enables self-inquiry.'
    divergence: Ibn Arabi's self-sending is a single reflexive act of divine consciousness, while the
      Mandukya uses phonetic correspondence as an analytical tool to stabilize the mind in meditation;
      one is ontological, the other is epistemological.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe clarity arising through intensified attention directed inward: the
      Yoga Spandakarika''s ardent striving toward the supreme tremor parallels Ibn Arabi''s inward return
      of attention, where effort and focus dissolve obscuration.'
    divergence: Ibn Arabi emphasizes the reflexive nature of attention (returning to the knower), while
      the Yoga Spandakarika frames it as striving toward an external-yet-inner sacred principle; the former
      is self-referential, the latter is devotional.
    passage_id: yoga_spandakarika.sp_36
  layer_provenance: generated_grounded
