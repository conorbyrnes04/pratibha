- kind: key_terms
  label: Key Terms
  items:
  - term: كان
    definition: from kāna, “to be” -> “He was” marks no past temporal state but the denial that God undergoes
      change -> the default “was” can misleadingly suggest that God once existed in time.
  - term: الآن
    definition: “now,” from a term for the present instant -> the present is invoked to collapse the contrast
      between past and present in relation to God -> not a claim that God occupies an everlasting moment.
  - term: وحدانية
    definition: from wāḥid, “one” -> numerical or conceptual oneness denied of God -> missed when “the
      One” is heard as simply the highest member of a numerical series.
  - term: فردانية
    definition: from fard, “single, unique” -> even isolated singularity is negated as a divine qualification
      -> not mere uniqueness, since uniqueness still contrasts one thing with others.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural matrix
      for denying that temporal or spatial opposites limit God.
    divergence: The verse names paired divine attributes; this passage intensifies them by negating the
      very relational categories through which the pairs are ordinarily understood.
  - citation: Qur’an 42:11
    resonance: “There is nothing like unto Him” supports the refusal to attribute creaturely location,
      temporality, and composition to God.
    divergence: The treatise draws a stronger metaphysical consequence, moving from incomparability toward
      the denial of any independently existing other.
  - citation: 'Hadith: “Whoso knows himself knows his Lord”'
    resonance: 'The later guiding maxim of the treatise is prepared here: self-knowledge requires seeing
      the limits of the self’s supposedly independent, located existence.'
    divergence: The saying is widely circulated in Sufi literature but is not established as a canonical
      prophetic hadith; the treatise gives it a distinctly nondual reading.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you catch yourself defining who you are by a role, place, schedule, or status, pause
    once and silently say: “These describe me; they do not ground my being.”'
