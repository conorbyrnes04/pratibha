unit_label: The One Beyond Every Relation
title: The One Beyond Every Relation
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: He is, and there is not with Him any before or after, above or below, closeness or distance,
  how or where or when, time or moment or duration, manifested existence or place. And He is now as He
  has always been. He is the one without oneness and the single without singleness.
translation_literal: 'He is, and there is with Him no after or before, nor above or below, nor far or
  near, nor how or where or when, nor time or moment or age, nor being or place. And He is now as He was.


  He is the One without oneness, and the Single without singleness.'
commentary: 'The passage makes an uncompromising claim: God is not one item within a field of relations.
  Before and after, high and low, nearness and distance, place, duration, and even determinate being belong
  to the order through which creatures locate one another; they cannot contain or qualify the Real. “He
  is now as He was” does not merely say that God remains unchanged through time. It denies that time provides
  a standpoint from which God could be measured at all. The paradox of “the One without oneness” presses
  further. Divine unity is not a numerical unit—a one opposed to two or many—for numerical oneness already
  belongs to the world of countable forms. In the idiom of waḥdat al-wujūd, this clears the ground for
  knowing the Lord through the self: the self one takes to be an independently situated thing, defined
  by where, when, and what it is, has no self-subsisting existence beside God. The contested move is radical:
  rather than simply affirming God’s transcendence over the world, the treatise strips creaturely reality
  of independent being. Its apophatic language therefore can sound both fiercely transcendent and startlingly
  nondual, while insisting that neither spatial union nor incarnation is meant.'
insight: ''
practice: 'Today, when you catch yourself defining who you are by a role, place, schedule, or status,
  pause once and silently say: “These describe me; they do not ground my being.”'
sanskrit_devanagari: 'كان ولا بَعْد معه ولا قبل، ولا فوق ولا تحت، ولا قُرْب ولا بُعْد، ولا كيف، ولا أين
  ولا حين، ولا أوان ولا وقت ولا زمان، ولا كون ولا مكان، وهو الآن كما كان.


  هو الواحد بلا وحدانية، وهو الفرد بلا فردانية.'
