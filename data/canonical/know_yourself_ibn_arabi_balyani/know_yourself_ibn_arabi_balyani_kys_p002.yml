- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 12 · The Silence — Turīya as Amātrā
    resonance: Both texts negate all relational and temporal categories (before/after, measure, phenomena) to point toward
      a fourth state that transcends dualistic experience. The Sufi passage strips away spatial-temporal predicates; the Upanishadic
      passage names Turīya as 'without measure' and 'cessation of phenomena'—both using systematic negation to disclose what
      remains.
    divergence: Ibn Arabi emphasizes divine transcendence and the absolute unity of God's being; Gaudapada locates this fourth
      state as the Self (Ātman), accessible through contemplative recognition rather than theological assertion.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_015
  - citation: Patañjali Yoga Sūtras 4.31
    resonance: Both passages describe a radical removal or stripping away—of relational predicates in the Sufi text, of 'coverings
      of knowledge' in the Yoga Sūtra—leaving what is almost nothing or nearly unknowable. The move is one of subtraction
      toward a residual, irreducible awareness.
    divergence: Patañjali frames this as the final fruit of yogic practice (kaivalya); Ibn Arabi presents it as the eternal
      nature of divine being, not an achievement but a recognition of what always is.
    passage_id: patañjali_yoga_sūtras.ys_4_31
  - citation: Astavakra Gita — Verse 6.1
    resonance: 'Both use spatial metaphor (space/pot, infinite container and finite content) to dissolve subject-object duality
      and reveal the Self as boundless ground. The structure inverts ordinary perception: the world becomes small within consciousness,
      not consciousness within the world.'
    divergence: Astavakra employs the metaphor to teach non-dual realization of the individual self; Ibn Arabi's negation
      serves to isolate divine transcendence beyond all spatial or relational categories whatsoever.
    passage_id: astavakra_gita.asg_6_1
