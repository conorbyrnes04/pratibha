source_excerpt: He is, and there is not with Him any before or after, above or below, closeness or distance,
  how or where or when, time or moment or duration, manifested existence or place. And He is now as He
  has always been. He is the one without oneness and the single without singleness.
translation_literal: In the name of God, the Merciful, the Compassionate, whose aid we seek. Praise be
  to God, before whose oneness there was no before, unless the Before were He, and after whose singleness
  there is no after, unless the After be He. He is, and with Him there is no after nor before, no above
  nor below, no far nor near, no union nor division, no how nor where nor when, no time nor moment nor
  age, no being nor place. And He is now as He was. He is the One without oneness, and the Single without
  singleness. He is not composed of name and named, for His name is He and His named is He. There is no
  name other than He, nor any named. So He is the Name and the Named. He is the First without firstness,
  and the Last without lastness. He is the Outward without outwardness, and the Inward without inwardness.
  I mean that He is the very existence of the First and the very existence of the Last, the very existence
  of the Outward and the very existence of the Inward. So there is no first nor last, no outward nor inward,
  except Him—without these becoming Him, or His becoming them.
commentary: 'This opening passage lays the foundation of the treatise''s radical doctrine of tawḥīd, or
  divine oneness, in its fullest ontological form—what later tradition called waḥdat al-wujūd, the oneness
  of being. The author''s method is to name every category by which the mind ordinarily divides reality
  (before/after, above/below, near/far, how/where/when) and to deny each one of God. This is not merely
  apophatic caution; it asserts that all such distinctions are relational and therefore inapplicable to
  the One who alone truly is. The striking phrase ''the One without oneness'' guards against the subtle
  error of turning God''s unity into a numerical or conceptual attribute standing alongside His essence.
  Even ''oneness'' as a describable quality would introduce a second thing beside God. The identification
  of name and named (''His name is He and His named is He'') collapses the usual gap between a word and
  the reality it points to, teaching that in the divine case there is nothing behind the name to which
  the name merely refers. The concluding balance—He is the very existence of First and Last, Outward and
  Inward, yet these do not ''become'' Him nor He them—preserves the treatise''s careful line: total identity
  of being without confusion, incarnation, or fusion. The phrase ''He is now as He was'' anchors the whole
  teaching in present immediacy: the divine reality is not a past origin nor a future goal but the always-already-present
  ground of every moment. This prepares the reader for the central claim to come—that self-knowledge is
  knowledge of God, because one''s own being is nothing other than His.


  Key Terms


  **tawḥīd** — The affirmation of God''s absolute oneness; here taken to its ontological limit as the
  recognition that only God truly exists.

  **waḥdat al-wujūd** — The ''oneness of being''—the doctrine that all existence is a single reality,
  God''s, with apparent multiplicity being modes of His self-disclosure.

  **al-Ẓāhir wa-l-Bāṭin** — The Outward and the Inward, two of the divine names; the passage identifies
  God as their very existence, denying any outwardness or inwardness added to Him.'
insight: ''
practice: The next time you catch yourself saying "before" or "after," "here" or "there," pause on the
  word and whisper the line "He is now as He was," letting the distinction you just made dissolve back
  into the One who admits no such division.
sanskrit_devanagari: 'الحمد لله الذي لم يكن قبل وحدانيته قبلُ إلا والقبل هو، ولم يكن بعد فردانيَّته بَعْدُ
  إلا والبَعْد هو. كان ولا بَعْد معه ولا قبل، ولا فوق ولا تحت، ولا قُرْب ولا بُعْد، ولا كيف، ولا أين ولا
  حين، ولا أوان ولا وقت ولا زمان، ولا كون ولا مكان، وهو الآن كما كان.


  هو الواحد بلا وحدانية، وهو الفرد بلا فردانية. ليس مركَّبًا من الاسم والمسمَّى: هو الأول بلا أولية وهو
  الآخِر بلا آخِرية، وهو الظاهر بلا ظاهرية وهو الباطن بلا باطنية؛ أعني أنه هو وجود حروف "الأول" وهو وجود
  حروف "الآخِر"، وهو وجود حروف "الباطن" وهو وجود حروف "الظاهر". فلا أول ولا آخِر ولا ظاهر ولا باطن إلا
  وهو بلا صيران. هذه الحروف وجوده، وصيران وجوده هذه الحروف. – فافهم هذا لئلا تقع في غلط الحلولية.'
sanskrit_iast: 'al-ḥamdu lil-lāh alladhī lam yakun qabla waḥdāniyyatih qablu illā wal-qabl huwa, walam
  yakun baʿda fardāniyyatih baʿdu illā wal-baʿd huwa. kāna walā baʿd maʿahu walā qabla, walā fawqa walā
  taḥta, walā qurb walā buʿd, walā kayfa, walā ayna walā ḥayna, walā awān walā waqt walā zamān, walā kawn
  walā makān, wa huwa al-ān kamā kāna.


  huwa al-wāḥid bilā waḥdāniyya, wa huwa al-fard bilā fardāniyya. laysa murakkaban min al-ism wal-masmā:
  huwa al-awwal bilā awwaliyya wa huwa al-ākhir bilā ākhiriyya, wa huwa al-ẓāhir bilā ẓāhiriyya wa huwa
  al-bāṭin bilā bāṭiniyya; aʿnī annahu huwa wujūd ḥurūf "al-awwal" wa huwa wujūd ḥurūf "al-ākhir", wa
  huwa wujūd ḥurūf "al-bāṭin" wa huwa wujūd ḥurūf "al-ẓāhir". fa-lā awwal walā ākhir walā ẓāhir walā bāṭin
  illā wa huwa bilā ṣayrān. hādhihi al-ḥurūf wujūdhu, wa ṣayrān wujūdhu hādhihi al-ḥurūf. – fafham hādhā
  li-allā taqaʿ fī ghalṭ al-ḥulūliyya.'
