- kind: key_terms
  label: Key Terms
  items:
  - term: نَفْسُهُ
    definition: nafs, “self/soul,” from a root associated with breath -> the inward self that whispers
      -> more than a modern psychological ego or merely the lower appetitive soul.
  - term: تُوَسْوِسُ
    definition: waswasa, a repeated faint whisper or insinuation -> the self’s most subtle inner prompting
      -> not only temptation, but the barely articulated movement of inward consciousness.
  - term: أَقْرَبُ
    definition: qaruba, to be near -> God’s incomparable intimacy with the human being -> not physical
      closeness, since the Risāla explicitly removes far and near from God.
  - term: حَبْلِ الْوَرِيدِ
    definition: ḥabl, cord, and warīd, the life-bearing neck vein -> an image of embodied immediacy ->
      not a claim that God occupies the body or is a bodily organ.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān 50:16
    resonance: God creates, knows the self’s whispering, and is nearer than the jugular vein.
    divergence: The verse states radical nearness; it does not itself spell out the Risāla’s denial that
      things possess existence beside God.
  - citation: 'Weir, “Know Yourself”: “there is with Him no ... far nor near”'
    resonance: The Risāla treats nearness and distance as inadequate spatial predicates for the divine.
    divergence: Its metaphysical conclusion is sharper than the verse’s devotional and epistemic language.
  - citation: Qurʾān 2:115, “whithersoever ye turn, there is the Face of God”
    resonance: Both passages unsettle the idea that God is confined to a location.
    divergence: The Face-verse concerns divine presence in every direction, while 50:16 focuses on inward
      knowledge and intimacy.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when a private worry or impulse arises, pause before reacting and name it silently as a
