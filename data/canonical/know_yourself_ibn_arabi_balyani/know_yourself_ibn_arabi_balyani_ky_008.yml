section: Qur’an 50:16
sanskrit_devanagari: وَلَقَدْ خَلَقْنَا الْإِنسَانَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِ نَفْسُهُ ۖ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ
  حَبْلِ الْوَرِيدِ
sanskrit_iast: ''
translation_literal: Surely We created the human being, and We know what his self whispers within him; and We are nearer to
  him than the jugular vein.
commentary: "This is Qur’anic speech, repeatedly resonant with the self-knowledge teaching associated with Ibn ʿArabī and\
  \ with the treatise commonly attributed to ʿAbd al-Karīm al-Jīlī or Balyānī. Its point is not that God occupies a location\
  \ physically closer than an anatomical vessel. Nearness here concerns the Real’s inseparability from every act of knowing,\
  \ willing, breathing, and inward whispering. The nafs, the self that speaks to itself and imagines itself autonomous, is\
  \ already known from within by the One upon whom its very existence depends. In non-dual Sufi reading, the seeker does not\
  \ travel across a distance to find God as an external object. Rather, the illusion of distance is disclosed as a veil produced\
  \ by heedlessness and by the ego’s claim to independent being. Yet this intimacy does not erase the distinction between\
  \ servant and Lord: the servant is contingent and receptive; the Real alone is self-subsisting.\n\nKey Terms\n\n**نَفْس\
  \ (nafs)** — The self or soul; here, especially the inwardly whispering, self-regarding dimension of human experience.\n\
  **أَقْرَب (aqrab)** — Nearer; not spatial proximity alone, but an intimacy prior to ordinary subject-object awareness.\n\
  **حَبْلِ الْوَرِيد (ḥabl al-warīd)** — The jugular vein, an image of life’s most immediate bodily nearness.\n**الحَقّ (al-Ḥaqq)**\
  \ — The Real: God as the ultimately real, self-subsisting ground of all contingent being.\n\nCross-Tradition Resonances\n\
  \n**Acts 17:27–28:** \n**Upaniṣads, especially the inner controller (antaryāmin):** \n**Augustine, Confessions III.6.11:** "
practice: 'Sit quietly for five minutes and attend to a single inward thought as it arises. Do not suppress or interpret it.
  Silently note: “This whisper is known before I possess it.” Return attention to the bare fact of awareness, without trying
  to picture God as an object.'
