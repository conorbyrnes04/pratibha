    Either way, the passage makes humility radical: even spiritual “vision” cannot become a private achievement.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ʿilm
    definition: From the root ʿ-l-m, “to know” or “mark distinctly” -> here even learned, conceptual knowledge
      cannot grasp God as an object -> the default gloss “knowledge” misses its contrast with immediate
      divine self-knowing.
  - term: wahm
    definition: From w-h-m, supposition, estimation, or imaginal conjecture -> the faculty that gives
      subtle form and limit to what is conceived -> “imagination” can miss its warning against mentally
      manufacturing a God one can picture.
  - term: idrāk
    definition: From d-r-k, “to catch up with, reach, attain” -> perception is rejected as an act that
      comprehends or encloses the Real -> the default gloss “perception” misses the sense of successful
      cognitive capture.
  - term: al-ʿayn al-bāṭin
    definition: ʿayn is eye or source; bāṭin is inward, hidden -> the inward eye names contemplative or
      spiritual sight -> it is not condemned as worthless, but denied adequacy as an independently possessed
      vision of God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 6:103
    resonance: “Sight does not apprehend Him, while He apprehends sight” closely echoes the refusal of
      sensory and perceptual mastery.
    divergence: The Qur’anic verse preserves a clear asymmetry between God and creatures; this passage
      extends that asymmetry into the stronger claim that only God sees and knows God.
  - citation: Qur’an 57:3
    resonance: The declaration that God is the First, the Last, the Outward, and the Inward supports the
      treatise’s effort to deny spatial and temporal limits.
    divergence: The verse names divine attributes; the treatise draws from them a more sweeping metaphysical
      account of knowing and apparent otherness.
  - citation: “Whoever knows himself knows his Lord” (widely cited Sufi saying)
    resonance: The saying frames self-knowledge as the route by which the false claim of an independent
      self is exposed.
    divergence: Its hadith status is disputed, and the present passage gives it a distinctly nondual reading
      rather than a merely ethical call to know one’s dependence and limits.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself claiming certainty about God, pause once and say: “My knowing
    does not contain the Real”; then let that sentence make you listen more carefully to one person before
    replying.'
