source_excerpt: He is not in anything and no thing is in Him, whether entering into Him or coming out
  of Him. It is in this way that you should know Him and not through theoretical knowledge, reason, understanding
  or conjecture, nor with the senses, the external eye or interior sight or perception. No one sees Him
  except Himself, no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: 'Understand, therefore, so that you do not fall into the error of those who believe
  in the incarnations of God: He is not in a thing, nor is a thing in Him, whether entering in or proceeding
  forth. You must know Him after this fashion — not by knowledge, nor by intellect, nor by understanding,
  nor by imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception.
  None sees Him except Himself; none perceives Him except Himself. By Himself He sees Himself, and by
  Himself He knows Himself. None sees Him other than He, and none perceives Him other than He. His veil
  is only a part of His oneness; nothing veils Him other than He. His veil is the concealment of His existence
  in His oneness, without any quality. None sees Him other than He — no prophet sent, no perfected saint,
  no angel brought near knows Him. His Prophet is He, and His sending is He, and His word is He.'
commentary: 'This passage marks the crucial turn signaled by the unit''s theme: knowledge cannot be aimed
  at God as an object standing over against a knowing subject, because such a duality would already assume
  two existences. The author systematically dismantles every faculty by which we ordinarily ''grasp''
  an object — intellect, sense, imagination, outer and inner sight — not because God is beyond these faculties,
  but because there is no separate ''He'' out there to be reached by them. The startling conclusion is
  that God is known only by God: ''By Himself He sees Himself, and by Himself He knows Himself.'' In the
  logic of waḥdat al-wujūd (the oneness of being), the knower, the knowing, and the known collapse into
  a single reality. The ''veil'' is likewise reinterpreted: it is not another thing obscuring God, for
  that would grant existence to something other than He; rather the veil is simply His own oneness, His
  concealment of His existence within Himself. This is why the treatise later warns against the doctrine
  of ''ceasing to be'' (fanāʾ): to speak of annihilating the self presupposes that the self first genuinely
  existed as an independent thing to be annihilated — and that supposition is itself the hidden polytheism
  the text seeks to root out. True maʿrifa is therefore not an achievement of the seeker''s faculties
  but the removal of ignorance, a shift in recognition, whereby one understands that what was seeking
  was never other than the Sought.


  Key Terms


  **maʿrifa** — Experiential, intuitive knowledge of God — not theoretical or acquired information, but
  a direct recognition in which the knower discovers that his own being is not other than the Real.

  **waḥdat al-wujūd** — The oneness of being: the doctrine that there is only one true existence, God''s,
  so that all apparent ''others'' have no independent reality of their own.

  **ḥijāb** — Veil; here reinterpreted not as a separate barrier but as God''s own oneness — His self-concealment
  within Himself, with nothing other than He doing the veiling.'
insight: ''
practice: 'Sit quietly and turn attention toward any object of awareness — a sound, the breath, a sensation.
  Each time you notice the mind moving to ''grasp'' it as something separate that you, the knower, are
  observing, gently ask: ''Who is the one seeing this?'' Follow the attention back from the seen toward
  the seer, without trying to reach a conclusion or an experience. Rest in the bare fact of awareness
  itself, letting the division between knower and known soften. Do this for ten minutes, releasing every
  attempt to ''attain'' anything, since attainment would presuppose a separate self to attain it.'
