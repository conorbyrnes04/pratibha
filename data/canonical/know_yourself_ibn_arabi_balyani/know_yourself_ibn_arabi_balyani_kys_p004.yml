unit_label: Only the Real Knows the Real
title: Only the Real Knows the Real
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
- way
source_excerpt: He is not in anything and no thing is in Him, whether entering into Him or coming out
  of Him. It is in this way that you should know Him and not through theoretical knowledge, reason, understanding
  or conjecture, nor with the senses, the external eye or interior sight or perception. No one sees Him
  except Himself, no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: 'He is not in a thing, nor is a thing in Him, whether entering in or proceeding forth.
  It is necessary that you know Him in this way: not by knowledge (ʿilm), nor by intellect, nor by understanding,
  nor by imagination, nor by the eye, nor by outward sense, nor by the inward eye, nor by perception.
  None sees Him except Himself; none perceives Him except Himself; none knows Him except Himself. By Himself
  He knows Himself: He sees Himself, and no one other than He sees Him.'
commentary: 'The claim is not merely that God exceeds the senses; it is that every ordinary relation by
  which a knower stands over against a known object fails before the Real. God is neither contained by
  a thing nor contained within it, so language of indwelling, emanation, departure, and arrival is refused.
  The passage then presses the point beyond theology into epistemology: discursive learning, reason, imagination,
  sensory sight, inward vision, and perception cannot place God before a human subject as an object. In
  the idiom of waḥdat al-wujūd, the one who appears to know is not an independently existing knower set
  beside God. Thus self-knowledge becomes knowledge of the Lord when the self’s claimed separateness is
  recognized as lacking independent reality. The contested move is decisive: “none sees Him except Himself”
  can sound like a denial of creaturely knowledge, moral responsibility, and the Creator–creation distinction.
  Defenders read it as denying autonomous possession of knowledge, not denying revelation or devotion;
  critics see it as collapsing the worshipper into the Worshipped. Either way, the passage makes humility
  radical: even spiritual “vision” cannot become a private achievement.'
insight: ''
practice: 'Today, when you notice yourself claiming certainty about God, pause once and say: “My knowing
  does not contain the Real”; then let that sentence make you listen more carefully to one person before
  replying.'
sanskrit_devanagari: لا هو في شيء، ولا شيء فيه، لا داخلاً ولا خارجًا. ينبغي أن نعرفه بهذه الصفة، لا بالعلم
  ولا بالعقل، ولا بالفهم ولا بالوهم ولا بالعين، ولا بالحسِّ الظاهر ولا بالعين الباطن ولا بالإدراك. لا
  يراه إلا هو، ولا يدركه إلا هو، ولا يعلمه إلا هو بنفسه، وبنفسه يعرف نفسه؛ يرى نفسه، لا يراه أحدٌ غيره.
