source_excerpt: No sent prophet, perfect saint or angel brought close knows Him. His prophet is He, His
  messenger is He, His message is He and His word is He. He sent Himself from Himself, through Himself
  to Himself.
translation_literal: 'Understand this, so that you do not fall into the error of the Ḥulūlīs (those who
  believe in God''s incarnation): He is not in a thing, nor is a thing in Him, whether entering in or
  proceeding forth. You must know Him in this way—not by knowledge, nor by intellect, nor by understanding,
  nor by imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception.
  None sees Him except Himself; none perceives Him except Himself. By Himself He sees Himself, and by
  Himself He knows Himself. None sees Him other than He, and none perceives Him other than He. His veil
  is only a part of His oneness; nothing veils Him other than He. His veil is only the concealment of
  His existence in His oneness, without any quality. None sees Him other than He—no sent prophet, no perfected
  saint, no angel brought near knows Him. His prophet is He, His sending is He, and His word is He. He
  sent Himself, through Himself, to Himself. There was no mediator nor any means other than He. There
  is no difference between the Sender and the thing sent, and the one sent and the one to whom he is sent.
  The very existence of the prophetic message is His existence. There is no other, and there is no existence
  to any other than He—nor to its ceasing to be, nor to its name, nor to its named.'
commentary: 'This passage presses the doctrine of waḥdat al-wujūd (the oneness of being) to its sharpest
  point. First it fences off a common misunderstanding: the unity taught here is not incarnationism (ḥulūl),
  where God ''enters'' a creature, nor emanation, where something ''proceeds forth'' from Him. Both models
  still assume two existents—God and a thing—and so quietly reinstate the very duality that tawḥīd denies.
  The author''s alternative is radical: there are not two existents at all. Because only God truly is,
  only God can be the knower and the known. Every faculty by which we normally seek Him—intellect, imagination,
  sense, even ''knowledge'' itself—belongs to the realm of the presumed second existent, the ego, and
  therefore cannot reach Him. ''By Himself He knows Himself.'' The knowing is not something we perform
  toward a distant object; it is God''s self-knowing occurring, as it were, in the place we mistakenly
  call ''us.'' The treatment of prophecy makes the same point structurally: sender, message, messenger,
  and recipient are not four things but one Reality expressing itself. The ''veil'' that seems to hide
  God is not another substance blocking the view—it is nothing but His oneness, the sheer intensity of
  His presence, which we misread as absence. This dismantles the popular notion that self-knowledge is
  achieved by ''ceasing to be'' (fanāʾ), for annihilation presupposes there was a self to annihilate—and
  to affirm such a self, even in order to erase it, is a subtle polytheism.


  Key Terms


  **waḥdat al-wujūd** — The oneness of being: the doctrine that there is only one true Existence—God''s—and
  that all apparent ''others'' have no independent reality.

  **ḥulūl** — Incarnationism; the belief that God enters into or indwells a created thing. The text rejects
  it because it still assumes two existents.

  **fanāʾ** — ''Ceasing to be'' or annihilation of the self. The author critiques treating it as a precondition
  for knowing God, since to annihilate a self is first to affirm its existence.'
insight: ''
practice: Whisper 'none sees Him other than He' as you go about an ordinary task, and each time the phrase
  leaves your lips, release the sense that it is you saying it—let the words be spoken through you rather
  than by you.
sanskrit_devanagari: 'حجابه وحدانيته، فلا يحجبه شيءٌ غير حجابه. وجوده وحدانيته، تستَّر بوحدانيته بلا كيفية.
  لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه. نبيُّه هو، ورسوله هو، ورسالته
  هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه، لا واسطة ولا سبب غيره، ولا تفاوُت بين المرسِل والمرسَل
  به والمرسَل إليه. وجود حروف الثناء وجوده لا غير، لا ثناؤه ولا اسمه ولا مُسمَّاه.'
sanskrit_iast: 'ḥijābuh waḥdānīyatu, fa-lā yaḥjubah shayʾun ghayra ḥijābih. wujūduhu waḥdānīyatu, tastaṭṭar
  biwaḥdānīyatihi bilā kayfiyyah. lā yarāhu aḥadun ghayrahu: lā nabiyyun mursal, walā walīyyun kāmil,
  walā malak muqarrab yaʿrifuhu. nabiyyuh huwa, wa-rasūluhu huwa, wa-risālatuhu huwa, wa-kalāmuhu huwa:
  arsal nafsahu binafsihi min nafsihi ilā nafsihi, lā wāsiṭah walā sabab ghayrahu, walā tafāwut bayna-l-mursil
  wal-mursal bihi wal-mursal ilaih. wujūd ḥurūf al-thanāʾ wujūduhu lā ghayra, lā thanāʾuhu walā ismuhu
  walā musammāh.'
