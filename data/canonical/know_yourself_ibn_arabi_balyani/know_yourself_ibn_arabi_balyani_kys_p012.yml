pratibha_layers:
- kind: original
  label: Original
  body: 'لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه. نبيُّه هو، ورسوله هو، ورسالته
