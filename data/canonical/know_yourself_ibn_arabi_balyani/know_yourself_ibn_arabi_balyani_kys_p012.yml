unit_id: know_yourself_ibn_arabi_balyani.kys_p012
unit_label: The Knower, Message, and Messenger Are One
title: The Knower, Message, and Messenger Are One
unit_type: teaching_passage
thesis: This line points to a deeper order that is received through attentive listening rather than conceptual
  noise.
themes:
- awareness
source_excerpt: No sent prophet, perfect saint or angel brought close knows Him. His prophet is He, His
  messenger is He, His message is He and His word is He. He sent Himself from Himself, through Himself
  to Himself.
translation_literal: 'None sees Him except Himself: no sent prophet, no perfected saint, and no angel
  brought near knows Him. His Prophet is He, His Messenger is He, His message is He, and His word is He.
  He sends Himself by Himself, from Himself to Himself.'
commentary: 'The claim is uncompromising: divine reality cannot become an object possessed by even the
  highest creaturely knower. Prophet, saint, and near angel name supreme stations within the religious
  imagination, yet each remains excluded from knowing God as an other standing before it. Only God sees
  and knows God. The passage then radicalizes prophecy: its sender, messenger, message, and speech are
  all referred back to the one Reality. In the idiom of waḥdat al-wujūd, this does not merely praise divine
  transcendence; it denies independent standing to every term that might form a relation alongside God.
  Self-knowledge therefore cannot mean that an individual ego discovers a divine object. It means seeing
  through the claim that the self is an autonomous knower over against a known Lord. The contested move
  is precisely this collapse of prophetic mediation into divine self-disclosure. Many theologians safeguard
  a real distinction between God, revelation, and messenger; the treatise presses instead toward non-duality,
  while insisting that this is neither incarnation nor God’s entry into a creature. Its logic is severe:
  when otherness is no longer taken as self-subsisting, the knowing enacted through every locus belongs,
  in truth, to God alone.'
insight: ''
practice: 'Today, when you receive praise, correction, or insight, pause once before claiming it as “mine”
  and say inwardly: “The knower is not independent.” Then respond with humility rather than self-importance.'
sanskrit_devanagari: 'لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه. نبيُّه هو،
  ورسوله هو، ورسالته هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه'
