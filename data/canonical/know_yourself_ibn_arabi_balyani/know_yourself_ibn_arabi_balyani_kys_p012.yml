- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: divine reality cannot become an object possessed by even the highest
    creaturely knower. Prophet, saint, and near angel name supreme stations within the religious imagination,
    yet each remains excluded from knowing God as an other standing before it. Only God sees and knows
    God. The passage then radicalizes prophecy: its sender, messenger, message, and speech are all referred
    back to the one Reality. In the idiom of waḥdat al-wujūd, this does not merely praise divine transcendence;
    it denies independent standing to every term that might form a relation alongside God. Self-knowledge
    therefore cannot mean that an individual ego discovers a divine object. It means seeing through the
    claim that the self is an autonomous knower over against a known Lord. The contested move is precisely
    this collapse of prophetic mediation into divine self-disclosure. Many theologians safeguard a real
    distinction between God, revelation, and messenger; the treatise presses instead toward non-duality,
    while insisting that this is neither incarnation nor God’s entry into a creature. Its logic is severe:
    when otherness is no longer taken as self-subsisting, the knowing enacted through every locus belongs,
    in truth, to God alone.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ولي كامل
    definition: walī, from w-l-y, nearness, friendship, and guardianship; here the spiritually 'perfected
      saint' is denied final possession of divine knowledge; the default gloss 'saint' can miss the claim
      to intimate divine proximity.
  - term: رسالة
    definition: risāla, from r-s-l, sending or dispatch; here it is not merely a doctrinal message but
      the very event of divine self-communication, identified with the One who sends.
  - term: كلام
    definition: kalām, speech or discourse; in this passage God's word is not treated as a separate object
      between speaker and hearer, but as an aspect of the single divine Reality.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 6:103
    resonance: “Sight does not encompass Him, while He encompasses sight” supports the asymmetry of creaturely
      perception and divine knowing.
    divergence: The verse maintains divine incomparability; this treatise extends that asymmetry into
      a sweeping identification of prophetic and revelatory terms with God.
  - citation: Qur'an 53:10
    resonance: The revelation to God's servant evokes the intimacy and priority of divine communication
      over human authorship.
    divergence: The Qur'anic scene still names servant and revealer distinctly, whereas the treatise's
      language strains toward eliminating every independent relatum.
  - citation: Hadith qudsi, Ṣaḥīḥ al-Bukhārī, “My servant continues to draw near to Me...”
    resonance: Its phrase that God becomes the servant's hearing and sight resonates with divine action
      disclosed through human faculties.
    divergence: The hadith frames this as nearness granted to a servant; the present passage makes the
      more controversial claim that none but God knows God.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you receive praise, correction, or insight, pause once before claiming it as “mine”
    and say inwardly: “The knower is not independent.” Then respond with humility rather than self-importance.'
