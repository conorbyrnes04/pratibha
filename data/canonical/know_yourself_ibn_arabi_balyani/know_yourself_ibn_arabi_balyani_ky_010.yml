unit_label: God Precedes Every Before and Outlasts Every After
title: God Precedes Every Before and Outlasts Every After
unit_type: verse
section: Treatise on Unity, on temporal distinctions
sanskrit_devanagari: ''
sanskrit_iast: ''
translation_literal: In the name of God, the Merciful, the Compassionate, and from Him we ask aid. Praise
  be to God, before whose oneness there was no before—unless the Before is He—and after whose singleness
  there is no after—except that the After is He. He is, and with Him there is no after or before, no above
  or below, no far or near.
commentary: 'The opening claim is not merely that God exists at every point on a timeline. It contests
  the very framework by which a timeline, a location, or a relation could stand over against Him. “Before,”
  “after,” “above,” “below,” “far,” and “near” are meaningful within the differentiated world; the treatise
  denies that they delimit the Real. Thus “He is now as He was” does not describe an enduring object that
  survives through time. It means that divine being is not altered by the appearance of temporal sequence
  at all. In the idiom of waḥdat al-wujūd, every apparent relation depends upon the One whose reality
  is not one item within the field of relations. This frames self-knowledge as knowledge of the Lord:
  when you investigate the self that says “I was,” “I will be,” “I am near,” or “I am far,” you find these
  are contingent determinations, not an independently grounded existence. The contested move is radical:
  the text shifts from God’s incomparability to the denial that any “other” has standing as a co-present
  reality. Critics can hear this as erasing creation or collapsing Creator and creature; defenders hear
  it as refusing to grant finite forms independent being while preserving their appearance and divine
  dependence.'
practice: Today, when you notice yourself measuring life by “before” and “after,” pause once and name
  the present as dependent, not self-grounded.
