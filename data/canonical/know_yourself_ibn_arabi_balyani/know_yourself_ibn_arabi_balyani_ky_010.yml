section: Treatise on Unity, on temporal distinctions
sanskrit_devanagari: al-qablu wa-l-baʿdu lahu, wa-huwa al-āna kamā kāna.
sanskrit_iast: ''
translation_literal: The before and the after are His; and He is now as He was.
commentary: 'The saying does not merely assert that God existed before the world and will remain after it. Its sharper claim
  is that temporal succession itself—“before” (qabl) and “after” (baʿd)—belongs to the domain of manifestation and is comprehended
  by the Real. The Real is not one item moving through time, nor a being located at one end of a temporal series. “He is now
  as He was” therefore denies alteration in the divine Reality, while also challenging the seeker’s ordinary assumption that
  awakening is an event by which the Real becomes newly present. What changes is the servant’s attribution: the self ceases
  to claim independent existence, power, or knowledge. In the idiom of the treatise, self-knowledge discloses that the apparent
  knower, the passage of states, and the time in which they seem to occur are dependent determinations, not rivals to the
  One.


  Key Terms


  **qabl** — “before,” a temporal relation belonging to created manifestation rather than to the Real’s essence.

  **baʿd** — “after,” the complementary temporal relation likewise comprehended by, not imposed upon, God.

  **al-āna** — “now,” indicating that the divine reality is not altered by the succession of temporal moments.

  **kamā kāna** — “as He was,” affirming divine immutability rather than mere persistence through time.


  Cross-Tradition Resonances


  **Augustine, Confessions XI.13:** Augustine says that God’s years neither come nor go, portraying divine eternity as a changeless
  presence rather than an extended temporal duration. Divergence: Augustine frames this chiefly through the Creator’s transcendence
  over created time, whereas this saying emphasizes that before and after themselves belong to manifestation within the Real’s
  comprehending scope.

  **Boethius, The Consolation of Philosophy V.6:** Boethius defines eternity as the complete and simultaneous possession of
  endless life, closely paralleling the claim that God is now as He was. Divergence: Boethius develops a philosophical account
  of divine foreknowledge and providence, while the present formulation is more explicitly apophatic about temporal predicates
  and divine alteration.

  **Plotinus, Enneads III.7.3:** Plotinus contrasts time’s successive movement with eternity’s life possessed all at once,
  echoing the denial that the highest principle undergoes before and after. Divergence: Plotinus’s eternal Nous remains within
  a graded emanationist metaphysics, whereas the saying concerns the Real in a theistic language of divine unity and sovereignty.'
practice: For ten minutes, attend to each thought that says “I was,” “I will be,” or “I am becoming.” Silently label it “before”
  or “after,” then return to the bare present awareness in which the label appears. Do not try to imagine timelessness; simply
  notice that temporal thoughts arise and pass without enclosing awareness itself.
