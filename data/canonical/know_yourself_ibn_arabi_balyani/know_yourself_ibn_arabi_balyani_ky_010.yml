section: Treatise on Unity, on temporal distinctions
sanskrit_devanagari: al-qablu wa-l-baʿdu lahu, wa-huwa al-āna kamā kāna.
sanskrit_iast: ''
translation_literal: The before and the after are His; and He is now as He was.
commentary: 'The saying does not merely assert that God existed before the world and will remain after it. Its sharper claim
  is that temporal succession itself—“before” (qabl) and “after” (baʿd)—belongs to the domain of manifestation and is comprehended
  by the Real. The Real is not one item moving through time, nor a being located at one end of a temporal series. “He is now
  as He was” therefore denies alteration in the divine Reality, while also challenging the seeker’s ordinary assumption that
  awakening is an event by which the Real becomes newly present. What changes is the servant’s attribution: the self ceases
  to claim independent existence, power, or knowledge. In the idiom of the treatise, self-knowledge discloses that the apparent
  knower, the passage of states, and the time in which they seem to occur are dependent determinations, not rivals to the
  One.


  Key Terms


  **qabl** — “Before,” a temporal relation belonging to the order of manifested succession.

  **baʿd** — “After,” the correlative temporal relation likewise encompassed by, not imposed upon, the Real.

  **al-āna** — “Now,” the present moment, invoked to deny that divine reality undergoes temporal change.

  **kamā kāna** — “As He was,” an affirmation of divine immutability beyond before-and-after.


  Cross-Tradition Resonances


  **Boethius, The Consolation of Philosophy, V.6:** Boethius defines divine eternity as the complete and simultaneous possession
  of endless life, contrasting God’s timeless presence with the successive duration of temporal beings. Divergence: Boethius
  frames the point through Latin philosophical theology and eternity’s total simultaneity, whereas this saying emphasizes
  that qabl and baʿd themselves belong to manifestation under the Real.

  **Augustine, Confessions XI.13–14:** Augustine argues that God did not create the world in time but created time itself,
  so there is no temporal “before” in which God waited to create. Divergence: Augustine’s concern is chiefly creation and
  the origin of time, while the present formulation more directly negates temporal alteration in God through the formula “He
  is now as He was.”

  **Nāgārjuna, Mūlamadhyamakakārikā 19.1–3:** Nāgārjuna analyzes time through the mutually dependent concepts of past, present,
  and future, undermining their status as independently existing realities. Divergence: Madhyamaka uses this analysis to establish
  the emptiness of temporal phenomena without positing an eternal divine Real that comprehends them.'
practice: For ten minutes, attend to each thought that says “I was,” “I will be,” or “I am becoming.” Silently label it “before”
  or “after,” then return to the bare present awareness in which the label appears. Do not try to imagine timelessness; simply
  notice that temporal thoughts arise and pass without enclosing awareness itself.
