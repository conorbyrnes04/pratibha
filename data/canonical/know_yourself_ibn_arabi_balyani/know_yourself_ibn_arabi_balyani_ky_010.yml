- kind: key_terms
  label: Key Terms
  items:
  - term: aḥadiyya
    definition: from aḥad, “one/unique” -> divine oneness before all relational counting -> more than
      the default gloss “unity,” since it excludes the contrast of one with many.
  - term: qabl
    definition: “before” -> a temporal priority denied of God except as a divine name -> not simply an
      earlier date in an infinite past.
  - term: baʿd
    definition: “after” -> temporal posteriority denied of God except as a divine name -> not merely God’s
      permanence after everything else ends.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural cluster
      developed by the treatise.
    divergence: The Qur'anic verse names these divine predicates; the treatise presses them into a metaphysical
      denial of independent relational reality.
  - citation: Qur'an 112:1–4
    resonance: Its declaration of God’s absolute uniqueness supports the refusal of likeness, dependence,
      and comparable relations.
    divergence: The sūrah does not itself articulate the treatise’s account of time, space, and the apparent
      world.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice yourself measuring life by “before” and “after,” pause once and name the
