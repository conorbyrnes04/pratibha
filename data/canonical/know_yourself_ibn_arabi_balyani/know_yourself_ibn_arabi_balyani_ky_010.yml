translation_literal: The before and the after are His; and He is now as He was.
commentary: 'The saying does not merely assert that God existed before the world and will remain after it. Its sharper claim
  is that temporal succession itself—“before” (qabl) and “after” (baʿd)—belongs to the domain of manifestation and is comprehended
  by the Real. The Real is not one item moving through time, nor a being located at one end of a temporal series. “He is now
  as He was” therefore denies alteration in the divine Reality, while also challenging the seeker’s ordinary assumption that
  awakening is an event by which the Real becomes newly present. What changes is the servant’s attribution: the self ceases
  to claim independent existence, power, or knowledge. In the idiom of the treatise, self-knowledge discloses that the apparent
  knower, the passage of states, and the time in which they seem to occur are dependent determinations, not rivals to the
  One.


  Key Terms


  **al-qabl** — the “before,” temporal priority within manifested succession.

  **al-baʿd** — the “after,” temporal posteriority within manifested succession.

  **al-āna** — the present “now,” denied ultimate independence from the Real.

  **kamā kāna** — “as He was,” affirming divine immutability beyond temporal alteration.


  Cross-Tradition Resonances


  **Augustine, Confessions XI.13:** Augustine describes God’s years as neither coming nor going, paralleling the claim that
  the divine is not carried along by before and after. Divergence: Augustine frames divine timelessness chiefly through Creator–creation
  distinction, whereas this formulation emphasizes temporal succession as contained within manifestation.

  **Boethius, Consolation of Philosophy V.6:** Boethius defines eternity as the complete and simultaneous possession of endless
  life, closely matching the denial that God undergoes temporal change. Divergence: Boethius offers a philosophical account
  of eternity, while the present saying speaks from a metaphysics of the Real and manifestation.

  **Plotinus, Enneads III.7.3:** Plotinus contrasts eternal reality’s abiding all-at-once presence with time’s successive
  movement from before to after. Divergence: Plotinus situates eternity primarily in Intellect and the One’s transcendence,
  whereas the saying directly predicates unchanging presence of God.'
practice: For ten minutes, attend to each thought that says “I was,” “I will be,” or “I am becoming.” Silently label it “before”
  or “after,” then return to the bare present awareness in which the label appears. Do not try to imagine timelessness; simply
  notice that temporal thoughts arise and pass without enclosing awareness itself.
