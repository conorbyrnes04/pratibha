- kind: key_terms
  label: Key Terms
  items:
  - term: العُرَّاف
    definition: 'ʿurrāf, plural of ʿārif, from ʿ-r-f, “to know or recognize” -> those reputed to know
      God -> more pointed than the default gloss “gnostics”: the passage criticizes a recognizable spiritual
      elite.'
  - term: فناء
    definition: fanāʾ, from f-n-y, “to pass away, perish” -> the alleged extinction of existence -> not
      merely emotional selflessness or humility, but a technical claim whose hidden presupposition is
      under attack.
  - term: فناء الفناء
    definition: fanāʾ al-fanāʾ, “the passing away of passing away” -> the removal even of awareness of
      annihilation -> missed by “complete annihilation,” since the author rejects the whole sequence as
      conceptually misplaced.
  - term: إثبات الوجود
    definition: ithbāt al-wujūd, “affirming/positing existence” -> the prior attribution of existence
      to a thing -> not a neutral observation; it is the decisive metaphysical error in the passage’s
      argument.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” supplies a scriptural vocabulary for the priority
      of God over all transient things.
    divergence: 'The verse speaks of perishing, whereas this passage presses further: things have no independent
      existence that could undergo perishing.'
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” resonates with the treatise’s
      denial that any temporal or spatial opposite stands alongside God.
    divergence: The Qur’anic formulation need not itself entail the text’s radical denial of created being.
  - citation: 'Hadith: “Who knows himself knows his Lord”'
    resonance: 'The treatise makes self-knowledge the route to divine knowledge: discern the non-independence
      of the self, and the Lord alone is known as truly real.'
    divergence: Though foundational in Sufi literature, this saying is not generally established as an
      authenticated prophetic hadith; the passage uses it as spiritual authority.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself defending an identity—your success, injury, status, or opinion—pause
    once and say inwardly: “This claim is not self-subsisting.” Then respond to the situation without
    needing that claim to be absolute.'
