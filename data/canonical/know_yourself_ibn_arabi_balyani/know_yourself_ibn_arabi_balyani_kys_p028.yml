title: What Never Existed Cannot Dissolve
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- knowledge
- emptiness
- self
- awareness
- illusion
- truth
source_excerpt: The knowledge of God does not require the passing away of existence or the passing away
  of that passing away because things have no existence and what does not exist cannot pass away. Passing
  away implies the prior existence of the thing that passes away.
translation_literal: Most of those called 'knowers of God' make the ceasing of existence, and the ceasing
  of that ceasing, a condition for attaining the knowledge of God. But this is an error and a plain oversight.
  For the knowledge of God does not presuppose the ceasing of existence, nor the ceasing of that ceasing.
  Things have no existence, and what does not exist cannot cease to exist, for ceasing to be implies first
  positing existence—and that is polytheism. So if you know yourself without existence or ceasing to be,
  then you know God; and if not, then not. In making the knowledge of God conditional upon the ceasing
  of existence and the ceasing of that ceasing, there is a hidden assertion of polytheism. For the Prophet
  (peace be upon him) said, 'Whoever knows himself knows his Lord'—he did not say, 'Whoever makes himself
  cease to be knows his Lord.' To affirm the other makes its extinction impossible; and that whose affirmation
  is not allowable, its extinction is not allowable either. Your existence is nothing, and nothing cannot
  be added to something, whether perishing or unperishing, existent or non-existent. The Prophet points
  to the fact that you are non-existent now just as you were non-existent before creation.
commentary: 'This passage strikes at the heart of Balyānī''s radical non-dualism. Many spiritual seekers
  imagine the goal is fanāʾ—the annihilation or ''passing away'' of the self—and then even the annihilation
  of that annihilation. The treatise exposes a subtle contradiction: to speak of your self ''passing away''
  presupposes that your self was there in the first place, an independent existence that must be dissolved.
  But if you grant yourself real, independent being alongside God, you have already committed shirk (associating
  a partner with God), because you have posited a second existence. True tawḥīd, the passage insists,
  does not require you to destroy something that never was. You were ''non-existent now as you were non-existent
  before creation.'' There is nothing to annihilate. What must vanish is not your being but your ignorance—the
  mistaken supposition that you ever possessed a self apart from God. Knowledge of self, then, is not
  the erasure of a real thing but the recognition that there was never a separate thing at all. This is
  why the Prophetic saying reads ''knows himself,'' not ''annihilates himself'': self-knowledge, not self-destruction,
  is the doorway to knowing the Lord.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self in God, a stage sought by many Sufis; the treatise
  critiques treating it as a precondition for knowing God, since it wrongly presupposes a real self that
  must be destroyed.

  **tawḥīd** — The affirmation of God''s absolute oneness; here understood so radically that positing
  any independent existence beside God—even one destined to pass away—is regarded as shirk.

  **shirk** — Polytheism or associating partners with God; in this text, even affirming your own separate
  existence (in order to then annihilate it) counts as a subtle form of shirk.'
insight: ''
practice: 'Reach out and try to grasp your own reflection in a window or dark screen—notice your hand
  meets only glass, nothing to hold and nothing to release. Let the failure to seize anything be the answer:
  there was never a separate self needing to be annihilated, only the ignorance that it was ever there.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
