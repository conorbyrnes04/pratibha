unit_id: know_yourself_ibn_arabi_balyani.kys_p028
unit_label: God’s Knowledge Does Not Depend on Annihilation
title: God’s Knowledge Does Not Depend on Annihilation
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- knowledge
source_excerpt: The knowledge of God does not require the passing away of existence or the passing away
  of that passing away because things have no existence and what does not exist cannot pass away. Passing
  away implies the prior existence of the thing that passes away.
translation_literal: And most of those who know God make the passing away of existence, and the passing
  away of that passing away, a condition for attaining the knowledge of God; and that is an error and
  a clear oversight. For the knowledge of God does not require the passing away of existence, nor the
  passing away of its passing away. For a thing has no existence, and what has no existence cannot pass
  away; for passing away comes after the affirmation of existence.
commentary: 'The claim is deliberately sharper than a conventional account of fanāʾ, or mystical annihilation.
  Many knowers, the author says, treat the disappearance of the self—and then the disappearance of consciousness
  of that disappearance—as a necessary threshold for knowing God. The text contests the premise: annihilation
  can only apply to something first granted independent existence. To posit such an existence, even in
  order to erase it, is already to install an “other” beside God. In its uncompromising waḥdat al-wujūd
  logic, the self is not a rival entity that must be destroyed; its apparent separateness is a misapprehension.
  Self-knowledge is therefore knowledge of the Lord because to know oneself truly is to see that one’s
  supposed self-standing existence was never there. The contested move is obvious: this passage converts
  the language of spiritual experience into an ontological assertion that things simply lack existence
  in their own right. Other Sufi writers preserve fanāʾ as a disciplined transformation of egoic attachment,
  while theologians may object that denying created existence collapses the Creator–creature distinction.
  Here, however, the correction sought is not self-erasure but the removal of the false claim that there
  was an independently existing self to erase.'
insight: ''
practice: 'Today, when you notice yourself defending an identity—your success, injury, status, or opinion—pause
  once and say inwardly: “This claim is not self-subsisting.” Then respond to the situation without needing
  that claim to be absolute.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود.'
