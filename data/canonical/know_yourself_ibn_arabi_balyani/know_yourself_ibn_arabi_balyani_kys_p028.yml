- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: Many spiritual seekers imagine the goal is fanāʾ—the annihilation or ''passing away''
      of the self—and then even the annihilation of that annihilation. Trap: self-erasure as quietism
      or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: True tawḥīd, the passage insists, does not require you
      to destroy something that never was. Trap: hearing a creedal slogan rather than ontological exclusivity
      of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: But if you grant yourself real, independent being alongside God, you have already committed
      shirk (associating a partner with God), because you have posited a… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: What Never Existed Cannot Dissolve Pearl #28 Most of those
      called ''knowers of God'' make the ceasing of existence, and the ceasing of that ceasing, a condition…
      Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and world'
  - term: nafs (نفس)
    definition: '‘self/soul/breath’ → the claiming self that must be known so its independence can be
      seen through Here: So if you know yourself without existence or ceasing to be, then you know God;
      and if not, then not. Trap: psychologizing as ego-therapy without ontological stakes'
  layer_provenance: editorial-enriched
