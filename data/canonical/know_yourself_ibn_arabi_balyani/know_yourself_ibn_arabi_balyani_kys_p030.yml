work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p030
unit_label: 'Pearl #30'
title: Knowing God Through Annihilation of Self
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
source_excerpt: If you know yourself without existing and passing away, then you know God, and if not,
  then not. By making the knowledge of God dependent on the passing away of your existence and the passing
  away of that passing away, there is an affirmation of something other than God.
translation_literal: 'Most of ''those who know God'' (al-ʿurrāf) make the ceasing of existence, and the
  ceasing of that ceasing, a condition for attaining the knowledge of God. This is an error and a plain
  oversight. For the knowledge of God does not presuppose the ceasing of existence, nor the ceasing of
  that ceasing. Things have no existence, and what does not exist cannot cease to exist. To speak of ceasing
  to be already implies that existence has been posited—and that is polytheism. So if you know yourself
  without existence or ceasing to be, then you know God; and if not, then not.


  In making the knowledge of God conditional upon the ceasing of existence, and upon the ceasing of that
  ceasing, there is an implicit assertion of polytheism. For the Prophet (peace be upon him) said, ''Whoso
  knoweth himself,'' and did not say, ''Whoso maketh himself to cease to be.'' To affirm the other makes
  its extinction impossible; and that whose affirmation is not permissible—its extinction is not permissible
  either. Your existence is nothing, and nothing cannot be added to something, whether perishing or unperishing,
  existent or non-existent. The Prophet points to the truth that you are non-existent now, just as you
  were non-existent before creation. For now is past eternity, and now is future eternity, and now is
  present time; yet God (exalted be His name) is the existence of past eternity, of future eternity, and
  of present time—without any of these ever coming to have existence of their own.'
commentary: 'This passage strikes at a subtle spiritual error that Balyānī sees among the mystics themselves.
  Many who claim knowledge of God (the ʿurrāf) treat fanāʾ—the annihilation or ''passing away'' of the
  self—as the prerequisite for union: first the self must cease, then even the awareness of its ceasing
  must cease. Balyānī rejects this as covert polytheism (shirk). His logic is precise: to speak of something
  ''passing away'' you must first have granted that it genuinely existed. But if the creature truly possessed
  an independent existence that then dissolved, you have affirmed a real ''other'' alongside God—and affirming
  any independent reality beside the One is the very definition of associating a partner with God. The
  deeper teaching, rooted in waḥdat al-wujūd (the oneness of being), is that the self never had autonomous
  existence to begin with. There is nothing to annihilate. The Prophet''s saying ''Whoso knoweth himself
  knoweth his Lord'' points not to a process of self-destruction but to a recognition: you were never
  a separate reality. Self-knowledge is therefore not a heroic act of self-erasure but a clearing away
  of ignorance—like a person who always was, but simply did not know their true name. God alone is; the
  eternal ''now'' is His existence, and the creature''s supposed being and non-being are equally nothing
  before it.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the ego-self; here critiqued as a misleading goal, since
  to annihilate the self is to presume it first had real independent existence.

  **waḥdat al-wujūd** — The oneness of being: the doctrine that there is only one true Existence—God''s—and
  that created things have no autonomous reality apart from Him.

  **shirk** — Associating a partner with God; here extended to mean affirming any independent existence
  alongside God, which even the belief in a self that must ''cease to be'' secretly implies.'
insight: ''
practice: 'The next time you try to quiet or erase your ego—straining to make the ''I'' disappear—stop
  the effort mid-struggle and let the question land instead: what am I working so hard to annihilate,
  if it was never there to begin with? Let the striving fall slack, not because the self ceased, but because
  there was never a self to cease.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
