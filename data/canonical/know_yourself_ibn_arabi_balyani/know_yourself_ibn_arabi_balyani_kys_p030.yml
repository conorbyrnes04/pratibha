source_excerpt: If you know yourself without existing and passing away, then you know God, and if not,
  then not. By making the knowledge of God dependent on the passing away of your existence and the passing
  away of that passing away, there is an affirmation of something other than God.
translation_literal: 'Most of ''those who know God'' (al-ʿurrāf) make the ceasing of existence, and the
  ceasing of that ceasing, a condition for attaining the knowledge of God. This is an error and a plain
  oversight. For the knowledge of God does not presuppose the ceasing of existence, nor the ceasing of
  that ceasing. Things have no existence, and what does not exist cannot cease to exist. To speak of ceasing
  to be already implies that existence has been posited—and that is polytheism. So if you know yourself
  without existence or ceasing to be, then you know God; and if not, then not.


  In making the knowledge of God conditional upon the ceasing of existence, and upon the ceasing of that
  ceasing, there is an implicit assertion of polytheism. For the Prophet (peace be upon him) said, ''Whoso
  knoweth himself,'' and did not say, ''Whoso maketh himself to cease to be.'' To affirm the other makes
  its extinction impossible; and that whose affirmation is not permissible—its extinction is not permissible
  either. Your existence is nothing, and nothing cannot be added to something, whether perishing or unperishing,
  existent or non-existent. The Prophet points to the truth that you are non-existent now, just as you
  were non-existent before creation. For now is past eternity, and now is future eternity, and now is
  present time; yet God (exalted be His name) is the existence of past eternity, of future eternity, and
  of present time—without any of these ever coming to have existence of their own.'
commentary: 'This passage strikes at a subtle spiritual error that Balyānī sees among the mystics themselves.
  Many who claim knowledge of God (the ʿurrāf) treat fanāʾ—the annihilation or ''passing away'' of the
  self—as the prerequisite for union: first the self must cease, then even the awareness of its ceasing
  must cease. Balyānī rejects this as covert polytheism (shirk). His logic is precise: to speak of something
  ''passing away'' you must first have granted that it genuinely existed. But if the creature truly possessed
  an independent existence that then dissolved, you have affirmed a real ''other'' alongside God—and affirming
  any independent reality beside the One is the very definition of associating a partner with God. The
  deeper teaching, rooted in waḥdat al-wujūd (the oneness of being), is that the self never had autonomous
  existence to begin with. There is nothing to annihilate. The Prophet''s saying ''Whoso knoweth himself
  knoweth his Lord'' points not to a process of self-destruction but to a recognition: you were never
  a separate reality. Self-knowledge is therefore not a heroic act of self-erasure but a clearing away
  of ignorance—like a person who always was, but simply did not know their true name. God alone is; the
  eternal ''now'' is His existence, and the creature''s supposed being and non-being are equally nothing
  before it.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the ego-self; here critiqued as a misleading goal, since
  to annihilate the self is to presume it first had real independent existence.

  **waḥdat al-wujūd** — The oneness of being: the doctrine that there is only one true Existence—God''s—and
  that created things have no autonomous reality apart from Him.

  **shirk** — Associating a partner with God; here extended to mean affirming any independent existence
  alongside God, which even the belief in a self that must ''cease to be'' secretly implies.'
insight: ''
practice: 'The next time you try to quiet or erase your ego—straining to make the ''I'' disappear—stop
  the effort mid-struggle and let the question land instead: what am I working so hard to annihilate,
  if it was never there to begin with? Let the striving fall slack, not because the self ceased, but because
  there was never a self to cease.'
