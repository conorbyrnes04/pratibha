- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is deliberately more radical than the familiar Sufi sequence of selfhood, annihilation
    (fanāʾ), and abiding in God. The author denies that knowledge of the Lord awaits the destruction of
    an independently existing self—or even the disappearance of that destruction. Why? Because making
    annihilation a required event quietly grants the self a reality first: there must be something there
    to vanish, and then a second state in which its vanishing vanishes. In this waḥdat al-wujūd argument,
    that sequence installs an “other” beside God and thus risks shirk, association. Self-knowledge is
    therefore not an experience in which a real creature crosses over into God; it is recognition that
    the supposed autonomous existence of the self was never a second existence at all. The contested move
    lies precisely here. It refuses both crude incarnation and a two-party mystical union, yet speaks
    in a way that can erase the Creator-creature distinction guarded by many theologians. Its discipline
    is epistemic: ignorance falls away, not a substantial self. To know yourself rightly is to see that
    dependence is not an attribute added to your being, but the exposure of the claim to independent being
    as unfounded.'
- kind: key_terms
  label: Key Terms
  items:
  - term: وجود
    definition: 'w-j-d, ‘to find’ or ‘be present’ -> the self’s supposed independent existence -> more
      than the default ‘existence’: it is the claim to reality whose denial drives the argument.'
  - term: فناء
    definition: f-n-y, ‘to pass away’ -> mystical annihilation, including the annihilation of annihilation
      -> not simply death or disappearance, but a technical spiritual station the passage refuses to make
      necessary.
  - term: شرك
    definition: sh-r-k, ‘sharing, partnership’ -> affirming a reality alongside God through the logic
      of a self that must be annihilated -> more forceful than the default gloss ‘polytheism.’
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural language
      through which the treatise denies an independent before, after, or outside of God.
    divergence: The verse declares divine comprehensiveness; this passage draws the more controversial
      metaphysical conclusion that the creature’s alleged existence is no reality needing extinction.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: 'The treatise takes the maxim as its governing axiom: self-knowledge and knowledge of God
      are inseparable.'
    divergence: The saying’s transmission and meaning have been debated, and the author gives it a specifically
      nondual reading rather than a moral, psychological, or devotional one.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you catch yourself defending an identity as though it were self-sustaining, pause
    and name one concrete dependency—breath, care, food, time, or mercy—then act from gratitude rather
    than possession.
