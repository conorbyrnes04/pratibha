source_excerpt: It is not that He enters into you or that you enter into Him, or that He comes out of you or that you come
  out of Him. That does not mean that you have being and you are qualified by this or that attribute. What is meant is that
  you never were and never will be, whether through yourself or through Him or in Him or with Him.
translation_literal: It is not that He enters into you or that you enter into Him, or that He comes out of you or that you
