- kind: translation
  label: Pratibha Translation
  body: He does not enter into thee, nor dost thou enter into Him; nor does He proceed forth from thee,
    nor dost thou proceed forth from Him. Nor is it meant by this that thou art something existing, or
    that thy attributes exist in this way. It means that thou never wast and never wilt be, whether by
