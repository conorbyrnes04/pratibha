work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p020
unit_label: The Self Has No Independent Being
title: The Self Has No Independent Being
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
source_excerpt: It is not that He enters into you or that you enter into Him, or that He comes out of
  you or that you come out of Him. That does not mean that you have being and you are qualified by this
  or that attribute. What is meant is that you never were and never will be, whether through yourself
  or through Him or in Him or with Him.
translation_literal: He does not enter into thee, nor dost thou enter into Him; nor does He proceed forth
  from thee, nor dost thou proceed forth from Him. Nor is it meant by this that thou art something existing,
  or that thy attributes exist in this way. It means that thou never wast and never wilt be, whether by
  thyself, through Him, in Him, or along with Him.
commentary: 'The claim rejects every spatial and ontological picture in which God and the self are two
  entities that might move into, out of, toward, or alongside one another. In the language of waḥdat al-wujūd,
  the problem is not distance from God but the assumption that the creature possesses a being of its own
  which could be joined to divine being. The passage therefore presses self-knowledge beyond introspection:
  to know the self is to find no self-subsisting “I” standing over against the Lord. Its contested move
  is uncompromising. It does not merely say that human existence depends on God; it denies that the self
  ever has being “by itself,” even while refusing crude incarnation, mixture, or mutual indwelling. “In
  Him” and “with Him” are denied as well, because both can preserve an imagined second thing related to
  God. Critics may hear this as collapsing Creator and creature, while its defenders say it protects divine
  oneness by treating creaturely separateness as a mistake of perception, not a second reality. The passage
  thus makes knowledge of the Lord inseparable from relinquishing the claim to autonomous existence.'
insight: ''
practice: 'Today, when you say “my time,” “my success,” or “my failure,” pause once and silently replace
  the possessive claim with: “This is not self-subsisting; it is received.”'
sanskrit_devanagari: 'لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك
  موجود وصفتك هكذا أبدًا: غني به. إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه'
