source_excerpt: It is not that He enters into you or that you enter into Him, or that He comes out of
  you or that you come out of Him. That does not mean that you have being and you are qualified by this
  or that attribute. What is meant is that you never were and never will be, whether through yourself
  or through Him or in Him or with Him.
translation_literal: 'And so the Prophet (upon whom be peace) said: "Whoever knows himself knows his Lord."
  And he said: "I know my Lord by my Lord." By this the Prophet points out that you are not you: you are
  He, without you — not He entering into you, nor you entering into Him, nor He proceeding forth from
  you, nor you proceeding forth from Him. And it is not meant by this that you are something that exists,
  or that your attributes are something that exists. Rather, it is meant that you never were, nor will
  you ever be, whether by yourself, or through Him, or in Him, or along with Him. You are neither ceasing
  to be nor still existing. You are He, without any of these limitations. So if you know your existence
  in this way, then you know God; and if not, then not.'
commentary: 'This passage strikes at the root of the ego''s most persistent illusion — that it possesses
  a separate, independent existence. The Prophetic saying "Whoever knows himself knows his Lord" is read
  not as a two-step ascent from a real self to a real God, but as a collapse of that very duality. The
  text refuses four spatial-relational metaphors (entering, exiting, in both directions) because each
  of them secretly presupposes two distinct existents that could stand in relation. The teaching of waḥdat
  al-wujūd (the oneness of being) is more radical: there are not two things to be related at all. What
  is striking is the double negation applied to the self — you are neither an existent nor something ''ceasing
  to be'' (fanāʾ). The author''s polemic against the Sufis who make annihilation a precondition of gnosis
  rests precisely here: to ''cease to be'' you would first have to genuinely ''be,'' and to affirm that
  independent being is already shirk (associating a partner with God). Since your existence was never
  truly your own — it was always His existence appearing — there is nothing to annihilate. The passage
  teaches that self-knowledge is not the destruction of a self but the recognition that the self was never
  a rival reality to begin with. What ''remains'' is not you-plus-God but simply the one Being, which
  was always all there was.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self; here critiqued, since to annihilate the self
  one must first grant it real existence — which itself is shirk.

  **maʿrifa** — Experiential gnosis or direct knowing; the self-knowledge that is identical with the knowledge
  of God.

  **waḥdat al-wujūd** — The oneness of being: the doctrine that there is only one true existence, God''s,
  and all apparent ''others'' are that one Being manifesting.'
insight: ''
practice: Say aloud the word 'I,' then pause and ask what it named — was there ever a thing there to enter,
  exit, or vanish? Let the question hang unanswered, and go about your next task without stopping to locate
  the one who acts.
sanskrit_devanagari: 'ولهذا قال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي، مَن عرف نفسَه فقد عرف ربَّه."
  وقال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي." أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل»
  أنت هو بلا أنت: لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك موجود
  وصفتك هكذا أبدًا: غني به. إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود.
  أنت هو، وهو أنت، بلا علَّة من هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.'
sanskrit_iast: 'walahādhā qāla – ṣallā llāhu ʿalayh wa sallam –: "ʿaraftu rabbī bi-rabbī, man ʿarafa nafsahu
  faqad ʿarafa rabbahu." wa-qāla – ṣallā llāhu ʿalayh wa sallam –: "ʿaraftu rabbī bi-rabbī." ʾashāra –
  ṣallā llāhu ʿalayh wa sallam – bi-dhālika annaka lasta anta, «bal» anta huwa bilā anta: lā huwa dākhil
  fīka walā huwa khārij mink, walā anta khārij minhu walā anta dākhil fīhi; walā bi-dhālika annaka mawjūd
  wa-ṣifātuka hakadhā abadan: ghanī bihi. innaka mā kunta qaṭṭ walā takūn, lā binafsika walā fīhi walā
  maʿahu, walā anta fānin walā mawjūd. anta huwa, wa-huwa anta, bilā ʿilla min hādhihi al-ʿilal. fa-in
  ʿarafta wujūdaka bihādhihi al-ṣifah faqad ʿarafta llāh. – wa-illā fa-lā.'
