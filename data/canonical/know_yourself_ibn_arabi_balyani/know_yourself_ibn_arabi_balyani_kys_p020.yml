- kind: commentary
  label: Pratibha Commentary
  body: 'The claim rejects every spatial and ontological picture in which God and the self are two entities
    that might move into, out of, toward, or alongside one another. In the language of waḥdat al-wujūd,
    the problem is not distance from God but the assumption that the creature possesses a being of its
    own which could be joined to divine being. The passage therefore presses self-knowledge beyond introspection:
    to know the self is to find no self-subsisting “I” standing over against the Lord. Its contested move
    is uncompromising. It does not merely say that human existence depends on God; it denies that the
    self ever has being “by itself,” even while refusing crude incarnation, mixture, or mutual indwelling.
    “In Him” and “with Him” are denied as well, because both can preserve an imagined second thing related
    to God. Critics may hear this as collapsing Creator and creature, while its defenders say it protects
    divine oneness by treating creaturely separateness as a mistake of perception, not a second reality.
    The passage thus makes knowledge of the Lord inseparable from relinquishing the claim to autonomous
    existence.'
- kind: key_terms
  label: Key Terms
  items:
  - term: داخل
    definition: 'from d-kh-l, “to enter” -> denies divine entry into the self or the self’s entry into
      God -> more than the default gloss “inside”: it rejects containment and reciprocal indwelling.'
  - term: خارج
    definition: from kh-r-j, “to go out, emerge” -> denies procession from either God or the self -> not
      simply “outside,” but a refusal of emanation as a movement between two beings.
  - term: موجود
    definition: from w-j-d, “to be found, to exist” -> the passage refuses independent creaturely existence
      -> missed by “existent,” which can obscure the polemic against a self-standing reality beside God.
  - term: معه
    definition: maʿa, “with” + pronoun “Him” -> even being ‘with God’ is denied when it implies a companion
      reality -> not merely spiritual nearness or companionship.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural grammar
      for denying an independent before, after, inside, or outside.
    divergence: The Qur’anic verse does not itself state that creatures never were or will be; that stronger
      ontological conclusion is the treatise’s formulation.
  - citation: Qur’an 50:16
    resonance: God is said to be nearer than the jugular vein, undermining an imagined distance that must
      be crossed to reach Him.
    divergence: Nearness in the verse need not mean identity; this passage explicitly blocks both separation
      and any literal indwelling.
  - citation: Hadith, “Whoever knows himself knows his Lord”
    resonance: The treatise reads self-knowledge as disclosure of the self’s lack of autonomous being
      and therefore of God’s sole reality.
    divergence: This saying is widely circulated in Sufi literature but is not securely established as
      a Prophetic hadith; other readings take it as knowledge of dependence rather than ontological nonexistence.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my time,” “my success,” or “my failure,” pause once and silently replace
    the possessive claim with: “This is not self-subsisting; it is received.”'
