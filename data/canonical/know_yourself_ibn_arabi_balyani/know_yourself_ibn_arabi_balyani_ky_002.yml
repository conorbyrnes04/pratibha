sanskrit_devanagari: anta lā anta bal anta Huwa
sanskrit_iast: ''
translation_literal: Thou art not thou; rather, thou art He.
commentary: 'This compressed formulation, transmitted in the Treatise on Unity (Risālat al-Aḥadiyya), is not a claim that
  the empirical individual becomes an independent second divinity. Its force is eliminative: the self imagined as autonomous—possessing
  being, power, knowledge, and agency of its own—is denied. What remains is al-Ḥaqq, “the Real,” whose being alone truly is.
  “Thou” is therefore not erased as an appearance or locus of manifestation, but stripped of the claim to self-subsistence.
  The phrase belongs to a Sufi discourse of tawḥīd, divine oneness, in which knowing oneself means discovering one’s radical
  poverty and contingency before the Real. Attribution of the treatise has long been divided between Ibn ʿArabī and ʿAbd al-Karīm
  al-Jīlī or Muḥammad b. ʿĪsā al-Balyānī; its teaching is nevertheless firmly situated within the Ibn ʿArabī–influenced language
  of unity.


  Key Terms


  **anta** — “thou,” the addressed self whose presumed independent reality is negated.

  **lā anta** — “not thou,” denying autonomous being, agency, and self-possession.

  **Huwa** — “He,” the divine pronoun indicating the sole Real presence beyond finite selfhood.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7, “tat tvam asi” (“That thou art”).:** Both formulations unsettle the ordinary individual self
  by locating its deepest truth in an ultimate reality rather than in separate egohood. Divergence: The Upaniṣadic saying
  positively identifies ātman with Brahman, whereas “anta lā anta bal anta Huwa” proceeds through the negation of the servant’s
  autonomous being before affirming God’s reality.

  **Galatians 2:20, “It is no longer I who live, but Christ who lives in me.”:** Paul likewise describes a transformed subjectivity
  in which the old self no longer claims independent life or agency. Divergence: Paul’s language remains explicitly Christological
  and covenantal, preserving a relation of believer to Christ rather than articulating the metaphysical priority of al-Ḥaqq’s
  being alone.

  **Nāgārjuna, Mūlamadhyamakakārikā 18.1, on the absence of a self-existing self.:** Madhyamaka and this formula both dismantle
  the notion that the person possesses an inherently independent identity. Divergence: Nāgārjuna denies intrinsic existence
  without affirming a singular divine Real, while the Treatise on Unity directs the negation of creaturely independence toward
  Huwa, God.'
practice: 'Sit quietly and notice each thought that says “my” knowledge, “my” power, or “my” achievement. After each, inwardly
  say: “Not mine; all being belongs to al-Ḥaqq.” Do not imagine becoming God; attend instead to the contingency of the claimant
  and to the dependence of every breath.'
