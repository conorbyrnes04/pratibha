- kind: key_terms
  label: Key Terms
  items:
  - term: anta
    definition: 'Arabic second-person pronoun, “you” -> the self imagined as a distinct possessor of being
      -> more than the default grammatical “thou”: it marks the claimed independent standpoint under interrogation.'
  - term: lā anta
    definition: lā, “no/not,” plus anta, “you” -> not a denial of empirical personhood but of self-subsistent
      reality -> missed when glossed merely as personal annihilation or moral self-hatred.
  - term: Huwa
    definition: '“He,” the Qur’anic pronoun of divine ipseity -> God as the sole Real in the passage’s
      argument -> more than an ordinary pronoun: it names irreducible divine reality, not an object alongside
      others.'
  - term: waḥdat al-wujūd
    definition: “oneness/unity of being” -> the interpretive horizon in which only God truly is and creatures
      lack independent being -> not simply the claim that all things are numerically God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural language
      surrounding the treatise’s denial of any reality outside God.
    divergence: The Qur’anic verse does not itself state that the human self is “He”; that is the treatise’s
      metaphysical extension.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” supports the claim that all finite things lack
      enduring independent reality.
    divergence: Classical readings commonly retain created things as real but perishable, whereas this
      passage drives toward their nonexistence apart from God.
  - citation: 'Ḥadīth: “Whoever knows himself knows his Lord”'
    resonance: The treatise uses this saying to make self-knowledge the threshold of divine knowledge.
    divergence: Its status as a Prophetic ḥadīth is disputed, and many interpreters take it to teach dependence
      and creatureliness rather than identity.
