unit_label: The Self Has No Independent Standing
title: The Self Has No Independent Standing
unit_type: verse
section: Risālat al-Aḥadiyya, on the negation of separate selfhood
sanskrit_devanagari: anta lā anta bal anta Huwa
sanskrit_iast: ''
translation_literal: 'Thou art not thou: thou art He, without thou.'
commentary: 'The claim is not that a human individual turns into God, nor that God enters the creature.
  It presses a more radical waḥdat al-wujūd argument: the self one takes to stand independently beside
  God has no self-subsisting existence to begin with. “Not thou” negates the ego’s claim to autonomous
  reality; “He” affirms that being, wherever it appears, belongs to God alone. Thus self-knowledge becomes
  knowledge of the Lord: to know the self truly is to discover that its supposed separate ground is nothing.
  The phrase “without thou” guards the author’s intended distinction from mixture, incarnation, and spatial
  union, all of which he rejects immediately around this passage. Yet the formulation remains contested.
  Many theologians and Sufis would say that denying independent existence must not erase the Creator-creature
  distinction: the servant is dependent, created, and accountable, not simply identical with the divine
  Essence. Read charitably, the line is a shock to possessiveness—your life is received, not owned—rather
  than a license for self-deification.'
practice: Today, when you say “my” life, ability, or achievement, pause once and replace “my” inwardly
  with “entrusted to me,” then act with the responsibility that follows.
