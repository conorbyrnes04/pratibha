sanskrit_devanagari: anta lā anta bal anta Huwa
sanskrit_iast: ''
translation_literal: Thou art not thou; rather, thou art He.
commentary: 'This compressed formulation, transmitted in the Treatise on Unity (Risālat al-Aḥadiyya), is not a claim that
  the empirical individual becomes an independent second divinity. Its force is eliminative: the self imagined as autonomous—possessing
  being, power, knowledge, and agency of its own—is denied. What remains is al-Ḥaqq, “the Real,” whose being alone truly is.
  “Thou” is therefore not erased as an appearance or locus of manifestation, but stripped of the claim to self-subsistence.
  The phrase belongs to a Sufi discourse of tawḥīd, divine oneness, in which knowing oneself means discovering one’s radical
  poverty and contingency before the Real. Attribution of the treatise has long been divided between Ibn ʿArabī and ʿAbd al-Karīm
  al-Jīlī or Muḥammad b. ʿĪsā al-Balyānī; its teaching is nevertheless firmly situated within the Ibn ʿArabī–influenced language
  of unity.


  Key Terms


  **anta** — “Thou,” the addressed self whose presumed independent reality is being undone.

  **lā anta** — “Not thou,” negating autonomous possession of being, power, knowledge, or agency.

  **bal** — “Rather,” marking the corrective turn from illusory selfhood to divine reality.

  **Huwa** — “He,” the Qurʾanic divine pronoun indicating al-Ḥaqq as the sole truly real being.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7, “tat tvam asi”:** Like “Thou art He,” the mahāvākya identifies the deepest truth of the apparent
  individual with ultimate reality, Brahman. Divergence: The Upaniṣadic formula affirms identity of ātman and Brahman, whereas
  the present formulation chiefly negates the servant’s claim to independent being before al-Ḥaqq.

  **Galatians 2:20, Paul: “It is no longer I who live, but Christ who lives in me”:** Paul likewise describes a displacement
  of the autonomous ego by a reality that alone becomes the true principle of life and action. Divergence: Paul’s language
  remains Christological and covenantal, preserving the distinction between redeemed creature and Creator rather than articulating
  ontological non-independence in Ibn ʿArabī’s terms.

  **Plotinus, Enneads VI.9.11:** Plotinus describes union with the One as a condition in which knower and known are no longer
  experienced as two, paralleling the collapse of self-assertion before ultimate reality. Divergence: Plotinus frames this
  through ascent from multiplicity to the transcendent One, while the treatise’s formula invokes the personal divine pronoun
  Huwa and the Islamic vocabulary of al-Ḥaqq.'
practice: 'Sit quietly and notice each thought that says “my” knowledge, “my” power, or “my” achievement. After each, inwardly
  say: “Not mine; all being belongs to al-Ḥaqq.” Do not imagine becoming God; attend instead to the contingency of the claimant
  and to the dependence of every breath.'
