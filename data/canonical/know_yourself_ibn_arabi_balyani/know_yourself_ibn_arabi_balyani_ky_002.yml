section: Risālat al-Aḥadiyya, on the negation of separate selfhood
sanskrit_devanagari: anta lā anta bal anta Huwa
sanskrit_iast: ''
translation_literal: Thou art not thou; rather, thou art He.
commentary: 'This compressed formulation, transmitted in the Treatise on Unity (Risālat al-Aḥadiyya), is not a claim that
  the empirical individual becomes an independent second divinity. Its force is eliminative: the self imagined as autonomous—possessing
  being, power, knowledge, and agency of its own—is denied. What remains is al-Ḥaqq, “the Real,” whose being alone truly is.
  “Thou” is therefore not erased as an appearance or locus of manifestation, but stripped of the claim to self-subsistence.
  The phrase belongs to a Sufi discourse of tawḥīd, divine oneness, in which knowing oneself means discovering one’s radical
  poverty and contingency before the Real. Attribution of the treatise has long been divided between Ibn ʿArabī and ʿAbd al-Karīm
  al-Jīlī or Muḥammad b. ʿĪsā al-Balyānī; its teaching is nevertheless firmly situated within the Ibn ʿArabī–influenced language
  of unity.


  Key Terms


  **anta** — “thou,” the addressed self or apparent individual.

  **lā anta** — “not thou,” denying autonomous selfhood and independent being.

  **bal** — “rather,” marking the corrective turn from negation to disclosure.

  **Huwa** — “He,” the Qurʾanic divine pronoun indicating the uniquely Real.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7, tat tvam asi:** Like “thou art That,” the formula overturns ordinary self-identification by
  grounding the self in an ultimate reality rather than in its separate individuality. Divergence: Advaita commonly articulates
  an identity of ātman and Brahman, whereas this Arabic formulation stresses the negation of the servant’s independent being
  before al-Ḥaqq.

  **Galatians 2:20, Paul:** Paul’s claim that it is no longer he who lives but Christ who lives in him similarly displaces
  the autonomous ego with a divine life operative within the person. Divergence: Paul frames this transformation through Christ,
  faith, and personal communion, while the formula here concerns the ontological non-independence of all created agency before
  God.

  **Heart Sūtra, form is emptiness and emptiness is form:** The Heart Sūtra likewise destabilizes the assumption that the
  person or phenomena possess self-subsistent reality. Divergence: Mahāyāna emptiness does not posit a singular divine Real
  whose being alone is, whereas the present formula culminates in Huwa, the personal-pronominal designation of God.'
practice: 'Sit quietly and notice each thought that says “my” knowledge, “my” power, or “my” achievement. After each, inwardly
  say: “Not mine; all being belongs to al-Ḥaqq.” Do not imagine becoming God; attend instead to the contingency of the claimant
  and to the dependence of every breath.'
