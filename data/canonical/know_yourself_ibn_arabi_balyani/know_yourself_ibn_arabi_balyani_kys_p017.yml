- kind: key_terms
  label: Key Terms
  items:
  - term: نفس
    definition: nafs, from a root concerning breath/self -> the supposed individual reality known in self-knowledge
      -> not merely “soul,” psyche, or lower ego.
  - term: ربّ
    definition: rabb, “lord, sustainer, master” -> the divine Reality known when the self’s independent
      claim falls away -> more relational and nurturing than the default bare “God.”
  - term: هو
    definition: huwa, “He” -> the sole reality affirmed when the autonomous “you” is denied -> not a masculine
      person among persons, but the Qur’anic pronoun of divine ipseity.
  - term: حلول
    definition: ḥulūl, “entering in, indwelling” -> rejected by the paired denials of God entering the
      servant or the servant entering God -> missed if nonduality is read as incarnation or fusion.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural grammar
      for denying any reality outside divine presence.
    divergence: The verse affirms divine comprehensiveness; this passage presses it into a stronger denial
      of the creature’s independent being.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” supports the claim that all finite things lack
      enduring self-subsistence before God.
    divergence: The Qur’anic wording can be read as eschatological perishing, whereas this treatise reads
      it as present ontological non-otherness.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The saying anchors the path of self-knowledge in knowledge of God and became central in
      Sufi teaching.
    divergence: Its prophetic attribution is disputed in hadith criticism, and this text gives it an unusually
      uncompromising metaphysical interpretation.
- kind: practice
  label: Practice (Abhyasa)
