unit_label: Knowing the Self Removes the Fiction of Otherness
title: Knowing the Self Removes the Fiction of Otherness
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- self
source_excerpt: Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their
  self, knows their Lord. He also said, I knew my Lord through my Lord. What the Prophet pointed out by
  that, is that you are not you but you are Him and there is no you.
translation_literal: 'And for this the Prophet—peace be upon him—said: “I knew my Lord by my Lord; whoever
  knows himself knows his Lord.” And he said—peace be upon him—“I knew my Lord by my Lord.” By this he
  points out that you are not you: rather, you are He, without a you. He is not entering into you, nor
  proceeding out from you; nor are you proceeding out from Him, nor entering into Him.'
commentary: 'The passage makes its decisive claim through the maxim of self-knowledge: to know the self
  truly is to know the Lord. But the “self” at issue is not a psychological ego whose divine core is discovered.
  It is the presumed independently existing “you.” Once that presumption is withdrawn, the text says,
  there is no second reality standing beside God. This is its waḥdat al-wujūd logic: God alone truly is,
  while creaturely distinction belongs to appearance, relation, and naming rather than a separate being.
  Hence the careful refusals of entering, leaving, or mutual indwelling. The author rejects ḥulūl, the
  idea that God occupies a creature, just as firmly as he rejects a creature’s movement into God. “You
  are He, without a you” is therefore not meant as a spatial merger or an exaltation of the individual
  personality. It is a radical denial that the ego ever possessed self-standing existence. The contested
  move is precisely this: ordinary Creator–creature distinction is recast as a distinction within manifestation,
  not between two independently real beings. The saying attributed to the Prophet functions here less
  as a moral exhortation than as metaphysical disclosure.'
insight: ''
practice: 'Today, when you say “my” about one possession, feeling, or accomplishment, pause and silently
  ask: “What here actually stands by itself?”'
sanskrit_devanagari: 'ولهذا قال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي، مَن عرف نفسَه فقد عرف ربَّه."
  وقال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي." أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل»
  أنت هو بلا أنت: لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه'
