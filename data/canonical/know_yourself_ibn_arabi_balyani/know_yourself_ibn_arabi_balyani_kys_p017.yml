unit_label: 'Pearl #17'
title: The Knower Dissolves Into The Known
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- self
source_excerpt: Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their
  self, knows their Lord. He also said, I knew my Lord through my Lord. What the Prophet pointed out by
  that, is that you are not you but you are Him and there is no you.
translation_literal: 'For this reason the Prophet (upon whom be peace) said: "Whoever knows himself knows
  his Lord." And he said (upon him be peace): "I know my Lord by my Lord." By this the Prophet points
  out that you are not you: you are He, without you—not that He enters into you, nor that you enter into
  Him, nor that He proceeds forth from you, nor that you proceed forth from Him. And it is not meant by
  this that you are something that exists, or that your attributes are something that exists; rather,
  it is meant that you never were nor ever will be, whether by yourself, or through Him, or in Him, or
  along with Him. You are neither ceasing to be nor still existing. You are He, without any of these limitations.
  So if you know your existence in this way, then you know God; and if not, then not.'
commentary: 'This passage stands at the heart of the treatise''s teaching on the oneness of being (waḥdat
  al-wujūd) and self-knowledge as the direct gateway to knowledge of God. The Prophetic saying, "Whoever
  knows himself knows his Lord," is read not as a moral maxim about humility but as a metaphysical disclosure:
  the reality of the self, when truly examined, is found to be nothing other than the reality of God.
  The author is careful to guard against two errors. First, he rejects incarnationism (ḥulūl) and any
  language of ''entering'' or ''proceeding forth,'' since these would presuppose two separate existences
  that then combine or separate. Second—and this is the passage''s most striking move—he refuses the common
  Sufi framing that one must ''cease to be'' (fanāʾ) in order to reach God. To speak of ceasing to be,
  he argues elsewhere, secretly affirms that the self had an independent existence in the first place,
  which is itself a hidden polytheism. The self never had autonomous being to lose. ''You are neither
  ceasing to be nor still existing'' cuts beneath both extinction and persistence: there is only the one
  Existence, which was always He. Self-knowledge, then, is not the annihilation of a real self but the
  dissolution of the illusion that there was ever a separate knower standing apart from the Known.


  Key Terms


  **maʿrifa** — Direct, intuitive knowledge or gnosis of God—here identified with true self-knowledge,
  as distinct from discursive learning (ʿilm) or intellect.

  **fanāʾ** — ''Ceasing to be'' or self-annihilation; the treatise critiques treating it as a precondition
  for knowing God, since it wrongly presupposes the self had independent existence to begin with.

  **waḥdat al-wujūd** — The oneness of being: the doctrine that there is only one true Existence—God''s—and
  that the apparent existence of the self and world is not a second reality alongside it.'
insight: ''
practice: 'Catch yourself in the middle of saying ''I did this'' or ''I want that,'' and let the sentence
  hang unfinished—feeling for the ''you'' the words assume, and finding no one there behind them. Let
  the assumption dissolve without replacing it with anything, neither a self that vanishes nor a self
  that remains: only He, without limitation.'
sanskrit_devanagari: 'ولهذا قال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي، مَن عرف نفسَه فقد عرف ربَّه."
  وقال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي." أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل»
  أنت هو بلا أنت: لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك موجود
  وصفتك هكذا أبدًا: غني به. إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود.
  أنت هو، وهو أنت، بلا علَّة من هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.'
sanskrit_iast: 'walahādhā qāla – ṣallā llāhu ʿalayh wa sallam –: "ʿaraftu rabbī bi-rabbī, man ʿarafa nafsahu
  faqad ʿarafa rabbahu." wa-qāla – ṣallā llāhu ʿalayh wa sallam –: "ʿaraftu rabbī bi-rabbī." ʾashāra –
  ṣallā llāhu ʿalayh wa sallam – bi-dhālika annaka lasta anta, «bal» anta huwa bilā anta: lā huwa dākhil
  fīka walā huwa khārij mink, walā anta khārij minhu walā anta dākhil fīhi; walā bi-dhālika annaka mawjūd
  wa-ṣifātuka hakadhā abadan: ghanī bihi. innaka mā kunta qaṭṭ walā takūn, lā binafsika walā fīhi walā
  maʿahu, walā anta fānin walā mawjūd. anta huwa, wa-huwa anta, bilā ʿilla min hādhihi al-ʿilal. fa-in
  ʿarafta wujūdaka bihādhihi al-ṣifah faqad ʿarafta llāh. – wa-illā fa-lā.'
