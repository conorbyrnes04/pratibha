source_excerpt: Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their self, knows their
  Lord. He also said, I knew my Lord through my Lord. What the Prophet pointed out by that, is that you are not you but you
  are Him and there is no you.
translation_literal: Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their self, knows
  their Lord. He also said, I knew my Lord through my Lord. What the Prophet pointed out by that, is that you are not you
  but you are Him and there is no you.
