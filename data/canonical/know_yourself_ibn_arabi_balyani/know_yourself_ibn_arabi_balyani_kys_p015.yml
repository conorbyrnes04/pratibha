- kind: key_terms
  label: Key Terms
  items:
  - term: رسوله
    definition: From r-s-l, “to send” -> the one sent, named here as God Himself -> not merely a human
      courier with independent being.
  - term: رسالة
    definition: From r-s-l, sending or message -> the revelatory relation itself -> more than a delivered
      text; it is an appearance of the one Real.
  - term: واسطة
    definition: From w-s-ṭ, a middle or intermediary -> any mediating link between sender and recipient
      is denied -> not simply a rejection of prophets, but of independent causal intermediaries.
  - term: مُسمَّاه
    definition: From s-m-w/s-m, “that which is named” -> the referent corresponding to a name -> not a
      separate object added alongside the divine Name.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan 53:3–4
    resonance: The Prophet does not speak from caprice; what he conveys is revelation, supporting the
      passage’s insistence that prophetic speech derives wholly from God.
    divergence: The Qurʾanic verses retain the Prophet as the recipient and conveyor, whereas this tract
      collapses sender, message, and recipient at the level of ultimate existence.
  - citation: Qurʾan 17:1
    resonance: God is the acting subject who takes His servant by night, grounding prophetic mission in
      divine initiative.
    divergence: The verse preserves the servant’s distinct designation; the tract’s metaphysical rhetoric
      denies independent being to such distinction.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The saying supplies the treatise’s governing link between self-knowledge and knowledge
      of God.
    divergence: Its status as a Prophetic hadith is disputed, and the present passage gives it a strongly
      nondual ontological interpretation rather than a merely ethical or spiritual one.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you offer one brief word of praise—“Praise be to God”—pause and notice the speaker,
    the sound, and the praise as dependent gifts rather than possessions of a separate self.
