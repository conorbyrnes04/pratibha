source_excerpt: The very existence of the prophetic message is His existence. There is no existence to
  any other who could pass away, or have a name or be named. Because of this, the Prophet, God bless him
  and give him peace, said, Whoever knows their self, knows their Lord.
translation_literal: 'The very existence of the prophetic message is His existence. There is no other,
  and there is no existence belonging to any other than He — nor to its ceasing to be (fanāʾ), nor to
  its name, nor to its named. It is for this reason that the Prophet, upon whom be peace, said: "Whoso
  knoweth himself knoweth his Lord." And he said, upon him be peace: "I know my Lord by my Lord." By this
  the Prophet points out that you are not you: you are He, without you — not He entering into you, nor
  you entering into Him, nor He proceeding forth from you, nor you proceeding forth from Him. It is not
  meant by this that you are something that exists, or that your attributes are something that exists,
  but rather that you never were nor will be, whether by yourself, or through Him, or in Him, or along
  with Him. You are neither ceasing to be nor still existing. You are He, without any of these limitations.
  If, then, you know your existence in this way, then you know God; and if not, then not.'
commentary: 'This passage stands at the heart of the treatise''s teaching on the oneness of being (waḥdat
  al-wujūd). The author identifies the prophetic message itself — sender, sending, word, and recipient
  — with the single divine existence, so that there is genuinely no ''other'' to receive or transmit anything.
  On this basis he interprets the celebrated ḥadīth ''Whoso knoweth himself knoweth his Lord'' not as
  a comparison between two realities, the self and God, but as a disclosure that the self has no independent
  existence at all. To ''know yourself'' is to realize that ''you are not you: you are He.'' The subtle
  point the author insists upon is that this is neither a doctrine of incarnation (God descending into
  you) nor of union in the crude sense (you merging into God). Both would presuppose two existents. Rather,
  there was never a ''you'' to begin with. This is why the text carefully avoids the language of fanāʾ,
  ''ceasing to be'': to cease to be, one must first have been, and to posit a prior independent existence
  for the self is, for this author, a form of hidden polytheism (shirk). Self-knowledge, then, is not
  the annihilation of a real self but the removal of an illusion — the recognition that the only Knower
  who ever was is God knowing Himself.


  Key Terms


  **maʿrifa** — Experiential, intimate knowledge of God — here identified with true self-knowledge, since
  to know the self''s non-independence is to know the divine reality that alone exists.

  **fanāʾ** — ''Passing away'' or ceasing to be; the annihilation of the ego often sought by Sufis. The
  author critiques it as subtly presupposing that the self really existed, and so urges recognition over
  annihilation.

  **waḥdat al-wujūd** — The ''oneness of being'': the teaching that there is only one true existence,
  God''s, so that all apparent ''others'' have no existence of their own.'
insight: ''
practice: 'Sit quietly and turn attention to the sense of ''I'' — the one who seems to be observing, breathing,
  thinking. Instead of trying to make this ''I'' disappear or dissolve, gently inquire: ''Was this self
  ever truly self-standing, or has it always been borrowing its existence?'' Rest in the question without
  forcing an answer. Each time the mind reasserts ''but here I am,'' return softly to the recognition:
  the very awareness by which I seek is not mine but His. Let the search itself become an act of witnessing
  that the Seeker and the Sought are one.'
