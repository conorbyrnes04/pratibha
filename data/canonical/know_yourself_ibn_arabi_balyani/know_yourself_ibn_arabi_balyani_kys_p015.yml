unit_label: The Messenger, Message, and Sender Are One Reality
title: The Messenger, Message, and Sender Are One Reality
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- self
source_excerpt: The very existence of the prophetic message is His existence. There is no existence to
  any other who could pass away, or have a name or be named. Because of this, the Prophet, God bless him
  and give him peace, said, Whoever knows their self, knows their Lord.
translation_literal: His Prophet is He, and His sending is He, and His word is He. He sends Himself with
  Himself from Himself to Himself. There is no mediator nor any means other than He, and there is no difference
  between the Sender, that by which He is sent, and the one to whom He is sent. The very existence of
  the letters of praise is His existence alone—not His praise, nor His name, nor His named.
commentary: 'The passage presses divine oneness beyond the familiar distinction between God, revelation,
  messenger, speech, and recipient. In its uncompromising waḥdat al-wujūd logic, each term is not an independently
  existing item standing beside God and linked to Him by an act of sending. The Sender, the sending, the
  message, and its destination are names for the one Real existence. Even “the letters of praise”—the
  articulated forms through which praise appears—have no existence of their own; their appearing is dependent
  entirely on the Real. Yet the final denial is deliberately severe: it does not merely say that praise
  belongs to God, but refuses to grant praise, name, and named a separate ontological footing. This is
  the contested move. Read devotionally, it safeguards tawḥīd by denying autonomy to every created form.
  Read incautiously, it can seem to erase the real distinctions maintained by prophetic religion: God
  speaks, a prophet receives, and creatures praise. The tract instead treats these distinctions as valid
  at the level of manifestation while denying that they constitute a second being. Self-knowledge follows
  this same path: to know oneself is to discover that one’s presumed independent reality cannot stand
  over against the Lord.'
insight: ''
practice: Today, when you offer one brief word of praise—“Praise be to God”—pause and notice the speaker,
  the sound, and the praise as dependent gifts rather than possessions of a separate self.
sanskrit_devanagari: 'نبيُّه هو، ورسوله هو، ورسالته هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه،
  لا واسطة ولا سبب غيره، ولا تفاوُت بين المرسِل والمرسَل به والمرسَل إليه. وجود حروف الثناء وجوده لا غير،
  لا ثناؤه ولا اسمه ولا مُسمَّاه.'
