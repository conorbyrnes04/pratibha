  items:
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This passage strikes at the heart of the treatise''s teaching on the
      oneness of being (waḥdat al-wujūd). Trap: pantheist collapse that erases servant/Lord distinction'
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: The most subtle point is the rejection of ''ceasing to be'' (fanāʾ) as the goal. Trap:
      self-erasure as quietism or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This passage strikes at the heart of the treatise''s teaching
      on the oneness of being (waḥdat al-wujūd). Trap: treating ‘existence’ as a neutral metaphysical
      predicate shared equally by God and world'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Here: Experiential knowledge or gnosis of God. Trap: equating mystical knowing
      with accumulated doctrine'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: To say ''I must cease to exist'' secretly affirms that I first existed as something separate;
      and to affirm a rival existence is precisely shirk (associating a p… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
