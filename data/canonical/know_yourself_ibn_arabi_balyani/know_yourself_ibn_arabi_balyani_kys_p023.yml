source_excerpt: You have neither ceased to be nor are you existent. You are Him and He is you, without
  any of these imperfections. If you know your existence in this way, then you know God, and if not, then
  not.
translation_literal: 'The Prophet (upon whom be peace) points out by this that you are not you: you are
  He, without you—not He entering into you, nor you entering into Him, nor He proceeding forth from you,
  nor you proceeding forth from Him. And it is not meant by this that you are something that exists, or
  that your attributes are something that exists; rather it is meant that you never were, nor will you
  ever be, whether by yourself, or through Him, or in Him, or along with Him. You are neither ceasing
  to be nor still existing. You are He, without any of these limitations. Then if you know your existence
  in this way, you know God; and if not, then not.'
commentary: 'This passage strikes at the heart of the treatise''s teaching on the oneness of being (waḥdat
  al-wujūd). The Prophetic saying ''Whoso knoweth himself knoweth his Lord'' is read not as a call to
  introspection about a separate self, but as a disclosure that the self one imagines to be one''s own
  has no independent existence at all. Notice the careful negations: the text refuses both ''entering
  in'' and ''proceeding forth'' (the language of incarnation and emanation), because both presuppose two
  realities—God and something else. The most subtle point is the rejection of ''ceasing to be'' (fanāʾ)
  as the goal. To say ''I must cease to exist'' secretly affirms that I first existed as something separate;
  and to affirm a rival existence is precisely shirk (associating a partner with God). The author''s radical
  move is to say you are ''neither ceasing to be nor still existing''—you never had an existence to lose.
  Self-knowledge, then, is not the destruction of the self but the recognition that the self was always
  only a name for God''s own existence appearing. Knowing God and knowing oneself truly are a single act
  of unveiling, not a ladder of annihilation.


  Key Terms


  **waḥdat al-wujūd** — The ''oneness of being''—the doctrine that there is only one true Existence (God''s),
  and all apparent things are that single Existence in its self-disclosure, not additional realities beside
  it.

  **fanāʾ** — ''Ceasing to be'' or annihilation of the self. The treatise critiques treating this as the
  goal, since to speak of losing one''s existence presupposes one had a separate existence to lose—a hidden
  form of shirk.

  **maʿrifa** — Experiential knowledge or gnosis of God. Here it is identified with true self-knowledge:
  to know oneself rightly is to realize one is not other than God''s own existence.'
insight: ''
practice: 'Sit quietly and turn attention to the bare sense ''I am.'' Instead of trying to dissolve or
  annihilate this sense—which subtly reaffirms it as a possession—simply ask: ''Whose existence is this?
  Did I ever bring myself into being?'' Rest in the recognition that the very awareness looking is not
  yours to lose, because it was never separately yours to begin with. Let the effort to ''become nothing''
  fall away, and abide instead in the plain seeing that there is only one Existence, appearing as this
  looking. Do this for a few minutes daily without straining after any special state.'
