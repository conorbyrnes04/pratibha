work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p023
unit_label: Knowing the Self Beyond Existence and Nonexistence
title: Knowing the Self Beyond Existence and Nonexistence
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- way
source_excerpt: You have neither ceased to be nor are you existent. You are Him and He is you, without
  any of these imperfections. If you know your existence in this way, then you know God, and if not, then
  not.
translation_literal: Thou never wast nor wilt be, whether by thyself or in Him or along with Him. Thou
  art neither ceasing to be nor still existing. Thou art He, and He is thou, without one of these limitations.
  Then if thou knowest thine existence thus, thou knowest God; and if not, then not.
commentary: 'The claim presses the treatise’s uncompromising account of divine oneness: self-knowledge
  does not uncover an independently existing human self standing before God, nor even a self that has
  to be annihilated into God. It sees that the alternatives governing ordinary thought—existing or perishing,
  separate or contained, with God or in God—cannot delimit the Real. Thus the saying “thou art He, and
  He is thou” is not presented as an incarnation, mixture, or travel of one being into another. The surrounding
  passage explicitly rejects each of those models. Its contested waḥdat al-wujūd move is stronger and
  riskier: what appears as the creature’s existence has no self-subsisting reality alongside God’s existence.
  To know the self is therefore to recognize one’s utter non-independence, and thereby to know the Lord
  as the only Real. Critics rightly hear in this formulation a collapse of the Creator-creature distinction;
  defenders answer that it denies not distinction as appearance, relation, and divine address, but independent
  being. The passage also refuses to make mystical “annihilation” a spiritual achievement: one need not
  produce one’s extinction, because the self was never an autonomous existent to begin with.'
insight: ''
practice: 'Today, when you say “my life” or “my achievement,” pause once and silently replace possession
  with dependence: “This is not self-subsisting; it is received from God.”'
sanskrit_devanagari: إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود. أنت هو،
  وهو أنت، بلا علَّة من هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.
