- kind: translation
  label: Pratibha Translation
  body: Thou never wast nor wilt be, whether by thyself or in Him or along with Him. Thou art neither
    ceasing to be nor still existing. Thou art He, and He is thou, without one of these limitations. Then
    if thou knowest thine existence thus, thou knowest God; and if not, then not.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim presses the treatise’s uncompromising account of divine oneness: self-knowledge does
    not uncover an independently existing human self standing before God, nor even a self that has to
    be annihilated into God. It sees that the alternatives governing ordinary thought—existing or perishing,
    separate or contained, with God or in God—cannot delimit the Real. Thus the saying “thou art He, and
    He is thou” is not presented as an incarnation, mixture, or travel of one being into another. The
    surrounding passage explicitly rejects each of those models. Its contested waḥdat al-wujūd move is
    stronger and riskier: what appears as the creature’s existence has no self-subsisting reality alongside
    God’s existence. To know the self is therefore to recognize one’s utter non-independence, and thereby
    to know the Lord as the only Real. Critics rightly hear in this formulation a collapse of the Creator-creature
    distinction; defenders answer that it denies not distinction as appearance, relation, and divine address,
    but independent being. The passage also refuses to make mystical “annihilation” a spiritual achievement:
    one need not produce one’s extinction, because the self was never an autonomous existent to begin
    with.'
- kind: key_terms
  label: Key Terms
  items:
  - term: وجود
    definition: w-j-d, “to find, be present, exist” -> the existence one attributes to oneself -> not
      merely “existence,” but claimed self-standing actuality, which the passage denies.
  - term: فانٍ
    definition: f-n-y, “to pass away, perish” -> the status of being annihilated or ceasing -> not a mystical
      stage the seeker must attain, since no independent entity is there to perish.
  - term: هو
    definition: the pronoun “He” -> God as the sole Real named in the reciprocal formula -> more charged
      than the default gloss “he,” because it bears the doctrine’s claim about reality, not personal identity.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural language
      through which the treatise denies any reality outside divine encompassing presence.
    divergence: The Qur'anic verse does not itself state that the human self is identical with God; the
      treatise draws a far more metaphysical conclusion.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: 'The passage makes this maxim its governing inference: knowledge of the self’s non-independence
      becomes knowledge of the Lord.'
    divergence: Though immensely influential in Sufi writing, this wording is not established as a sound
      Prophetic hadith by hadith critics.
  - citation: Qur'an 28:88
    resonance: “Everything is perishing except His Face” supports the treatise’s refusal to grant enduring
      independent being to things.
    divergence: Many interpreters understand perishing eschatologically or as dependence on God, rather
      than as the immediate nonexistence of all other being.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my life” or “my achievement,” pause once and silently replace possession
    with dependence: “This is not self-subsisting; it is received from God.”'
