- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: divine self-knowledge has no second knower standing outside God.
    In the language of waḥdat al-wujūd, this excludes not only a rival being but also an independent human
    standpoint from which God could be grasped as an object. God’s “veil” is not a barrier erected by
    creatures, matter, sin, or distance. It is divine oneness itself: the very non-duality that prevents
