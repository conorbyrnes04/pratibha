- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both texts locate knowledge in the quality and direction of attention itself rather than in external content:
      Ibn Arabi''s ''knows Himself through Himself'' and the Siva Sutra''s ''sustained attention is knowledge'' both make
      attention the instrument and object of knowing collapse into one act.'
    divergence: Ibn Arabi emphasizes the reflexive self-knowing of the divine knower, while the Siva Sutra treats attention
      as a cultivable human practice that generates knowledge.
    passage_id: siva_sutra.ss_ii_12
  - citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
    resonance: 'Both passages establish a methodological correspondence between a formal structure (Om''s four quarters /
      the Self''s fourfold nature) and direct self-inquiry: the structure becomes the means by which attention turns inward
      to recognize its own ground.'
    divergence: Ibn Arabi's inward turn is immediate and non-dual (self knowing itself), while the Mandukya uses systematic
      phonetic-ontological mapping as the scaffolding for that recognition.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe how intensified, directed attention—turning back upon itself or striving toward what eludes
      ordinary perception—reveals what was always present: the supreme principle becomes apparent through the very effort
      of attention itself.'
    divergence: Ibn Arabi presents this as the eternal structure of divine self-knowledge, while the Yoga Spandakarika frames
      it as a tantric practice requiring ardent striving to manifest the sacred tremor.
    passage_id: yoga_spandakarika.sp_36
