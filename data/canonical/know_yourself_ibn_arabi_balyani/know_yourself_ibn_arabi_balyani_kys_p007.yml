- kind: key_terms
  label: Key Terms
  items:
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: His veil is His oneness since nothing veils Him other than
      Him. Trap: hearing a creedal slogan rather than ontological exclusivity of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  - term: nafs (نفس)
    definition: '‘self/soul/breath’ → the claiming self that must be known so its independence can be
      seen through Here: Whenever you catch yourself trying to ''see'' or ''grasp'' God as something before
      you, drop the seeking mid-reach and let the words fall through you: ''By Himself… Trap: psychologizing
      as ego-therapy without ontological stakes'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Here: '' Rest in the recognition that the very looking is not yours to perform.
      Trap: equating mystical knowing with accumulated doctrine'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both texts locate knowledge in the quality and direction of attention itself rather than
      in external content: Ibn Arabi''s ''knows Himself through Himself'' and the Siva Sutra''s ''sustained
      attention is knowledge'' both make attention the instrument and object of knowing collapse into
      one act.'
    divergence: Ibn Arabi emphasizes the reflexive self-knowing of the divine knower, while the Siva Sutra
      treats attention as a cultivable human practice that generates knowledge.
    passage_id: siva_sutra.ss_ii_12
  - citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
    resonance: 'Both passages establish a methodological correspondence between a formal structure (Om''s
      four quarters / the Self''s fourfold nature) and direct self-inquiry: the structure becomes the
      means by which attention turns inward to recognize its own ground.'
    divergence: Ibn Arabi's inward turn is immediate and non-dual (self knowing itself), while the Mandukya
      uses systematic phonetic-ontological mapping as the scaffolding for that recognition.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe how intensified, directed attention—turning back upon itself or striving
      toward what eludes ordinary perception—reveals what was always present: the supreme principle becomes
      apparent through the very effort of attention itself.'
    divergence: Ibn Arabi presents this as the eternal structure of divine self-knowledge, while the Yoga
      Spandakarika frames it as a tantric practice requiring ardent striving to manifest the sacred tremor.
    passage_id: yoga_spandakarika.sp_36
  layer_provenance: generated_grounded
