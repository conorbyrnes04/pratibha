source_excerpt: He knows Himself through Himself and He sees Himself by means of Himself. No one but He
  sees Him. His veil is His oneness since nothing veils Him other than Him. His own being veils Him.
translation_literal: You must know Him in this way—not by knowledge ('ilm), nor by intellect, nor by understanding,
  nor by imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception.
  None sees Him except Himself; none perceives Him except Himself. By Himself He sees Himself, and by
  Himself He knows Himself. None sees Him other than He, and none perceives Him other than He. His veil
  is His very oneness; nothing veils Him other than He. His veil is simply the concealment of His existence
  in His oneness, without any quality. None sees Him other than He—no prophet who is sent, nor saint made
  perfect, nor angel brought near knows Him. His Prophet is He, His sending is He, and His word is He.
  He sent Himself, by Himself, to Himself. There was no mediator and no means other than He. There is
  no difference between the Sender and the thing sent, and the one sent and the one to whom He is sent.
  The very existence of the prophetic message is His existence. There is nothing other, and there is no
  existence to anything other than He.
commentary: 'This passage strikes at the heart of the treatise''s teaching on tawḥīd understood as waḥdat
  al-wujūd—the oneness of being. The author insists that God cannot be reached by any faculty of the seeker:
  not intellect, sense, imagination, nor the ''inner eye'' so prized in some mystical schools. Every faculty
  presupposes a knower distinct from the known, a witness separate from the witnessed—and that very duality
  is what the passage dissolves. The startling claim is that God is known only by God: ''By Himself He
  sees Himself, and by Himself He knows Himself.'' Since there is in reality only one existence, any ''seeing''
  of God must ultimately be God''s own self-seeing. The image of the ''veil'' reverses ordinary intuition.
  We usually imagine a veil as something foreign standing between us and God. Here the only veil is God''s
  own oneness—His existence is ''concealed in His oneness, without any quality.'' Nothing external hides
  Him; rather, the very intensity and totality of His presence is what appears to us as concealment. To
  seek self-knowledge, then, is not to acquire information about a separate self, nor to add a witness
  alongside God. It is to recognize that the seeker, the seeking, and the sought were never two. This
  is why the treatise later refuses the language of ''ceasing to be'' (fanāʾ): to speak of annihilating
  the self is to first grant the self an independent existence that must then be destroyed—a subtle form
  of shirk (associating a partner with God). The path is not the abolition of a real ''other'' but the
  recognition that there was never an other to abolish.


  Key Terms


  **tawḥīd** — The affirmation of divine oneness. In this treatise it is radicalized into waḥdat al-wujūd—the
  recognition that there is only one true existence, God''s, so that nothing possesses being alongside
  or apart from Him.

  **maʿrifa** — Experiential, gnostic knowledge of God (contrasted with ''ilm, discursive knowledge).
  Here it is knowledge God has of Himself through the knower, since ''by Himself He knows Himself.''

  **ḥijāb** — ''Veil.'' Not a foreign barrier concealing God, but His own oneness—the concealment of His
  existence within itself, so that nothing veils Him except Him.'
insight: ''
practice: 'Whenever you catch yourself trying to ''see'' or ''grasp'' God as something before you, drop
  the seeking mid-reach and let the words fall through you: ''By Himself He sees Himself.'' Rest in the
  recognition that the very looking is not yours to perform.'
