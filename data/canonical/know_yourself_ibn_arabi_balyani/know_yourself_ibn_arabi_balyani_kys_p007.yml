unit_label: God Alone Knows and Veils God
title: God Alone Knows and Veils God
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
source_excerpt: He knows Himself through Himself and He sees Himself by means of Himself. No one but He
  sees Him. His veil is His oneness since nothing veils Him other than Him. His own being veils Him.
translation_literal: By Himself He sees Himself, and by Himself He knows Himself. None sees Him other
  than He, and none perceives Him other than He. His veil is [only a part of] His oneness; nothing veils
  other than He. His veil is [only] the concealment of His existence in His oneness, without any quality.
commentary: 'The claim is uncompromising: divine self-knowledge has no second knower standing outside
  God. In the language of waḥdat al-wujūd, this excludes not only a rival being but also an independent
  human standpoint from which God could be grasped as an object. God’s “veil” is not a barrier erected
  by creatures, matter, sin, or distance. It is divine oneness itself: the very non-duality that prevents
  the Real from appearing as one identifiable thing among others. Self-knowledge, therefore, is knowledge
  of the Lord only when the self is no longer assumed to possess a separate, self-subsisting act of knowing.
  This is the passage’s contested move. It can sound as though creaturely consciousness is simply abolished,
  or as though the distinction between God and servant is erased. Defenders instead read it as an ontological
  claim: the servant has no independent being or power by which to contain, comprehend, or veil God; every
  disclosure and every knowing depends upon the Real. Yet the text presses further than ordinary devotional
  language, making even the knower’s access to God God’s own self-manifestation rather than an achievement
  owned by the individual.'
insight: ''
practice: 'Today, when you notice yourself trying to possess certainty about God, pause for one minute
  and say inwardly: “The knower is not independent.” Then meet one person without reducing them to an
  object of your judgment.'
