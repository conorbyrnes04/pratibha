- kind: key_terms
  label: Key Terms
  items:
  - term: حجاب
    definition: ḥ-j-b, to screen or withhold -> the veil is God’s own oneness, not an external obstruction
      -> more than the default gloss “veil,” it names concealment through overwhelming non-duality.
  - term: أحدية
    definition: from a-ḥ-d, one/unique -> divine oneness admits no second alongside it -> not merely numerical
      “unity,” but absoluteness before which relation and comparison fail.
  - term: معرفة
    definition: ʿ-r-f, to recognize or know -> knowing God is not acquired mastery over a divine object
      -> more intimate and transformative than the default gloss “knowledge.”
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan 24:35
    resonance: 'The Light Verse joins disclosure and concealment: God guides to His light whom He wills,
      while the divine reality exceeds ordinary representation.'
    divergence: This passage radicalizes the point by calling divine oneness itself the veil, rather than
      presenting a symbolic image of light.
  - citation: Qurʾan 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supports the text’s refusal
      to locate God within ordinary spatial or conceptual oppositions.
    divergence: 'The present claim focuses specifically on who can know or perceive God: ultimately God
      alone.'
  - citation: Hadith qudsi, “I was sick and you did not visit Me” (Ṣaḥīḥ Muslim)
    resonance: The saying unsettles the separation of divine presence from the vulnerable human other.
    divergence: The hadith retains an ethical address to the servant; this passage draws an explicitly
      metaphysical conclusion about divine being and self-disclosure.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself trying to possess certainty about God, pause for one minute and
    say inwardly: “The knower is not independent.” Then meet one person without reducing them to an object
    of your judgment.'
