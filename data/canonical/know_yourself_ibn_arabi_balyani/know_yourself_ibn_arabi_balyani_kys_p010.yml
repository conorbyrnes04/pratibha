unit_label: Divine Oneness Is Its Own Veil
title: Divine Oneness Is Its Own Veil
unit_type: teaching_passage
thesis: This line points to a deeper order that is received through attentive listening rather than conceptual
  noise.
themes:
- awareness
source_excerpt: His being is concealed by His oneness without any condition. No one other than He sees
  Him. No sent prophet, perfect saint or angel brought close knows Him. His prophet is He, His messenger
  is He, His message is He and His word is He.
translation_literal: 'He is concealed in His oneness, without any quality. None sees Him other than He:
  no sent prophet, perfected saint, or angel brought near knows Him. His Prophet is He, His Messenger
  is He, His message is He, and His word is He.'
commentary: 'The claim is uncompromising: divine unity is not a reality standing exposed before a separate
  knower. It is itself the “veil”—not an added screen, but the very absence of any second standpoint from
  which God could be grasped. On this account, prophets, saints, and angels do not possess God as an object
  of knowledge. Revelation too is described reflexively: the sender, messenger, message, and speech are
  all He. In the idiom often associated with waḥdat al-wujūd, this presses self-knowledge beyond psychological
  introspection: to know oneself rightly is to discover that the supposedly independent knower has no
  autonomous being before the Real. The contested move is evident. Classical theological accounts ordinarily
  preserve real distinctions between God, revelation, messenger, and recipient; this passage radically
  collapses such relational language into divine self-disclosure. Its point need not be that prophetic
  vocation is meaningless, but that no creaturely office gives mastery over God. Even the highest religious
  forms are occasions in which the One alone is ultimately manifest and knowing.'
insight: ''
practice: 'Today, when you notice yourself claiming certainty about God, pause for one minute and say
  inwardly: “The One I seek cannot be made into my object”; then let that humility shape one concrete
  act of listening.'
sanskrit_devanagari: 'تستَّر بوحدانيته بلا كيفية. لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك
  مقرَّب يعرفه. نبيُّه هو، ورسوله هو، ورسالته هو، وكلامه هو'
