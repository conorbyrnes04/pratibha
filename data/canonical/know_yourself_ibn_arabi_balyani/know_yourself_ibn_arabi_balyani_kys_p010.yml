pratibha_layers:
- kind: original
  label: Original
  body: 'تستَّر بوحدانيته بلا كيفية. لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه.
    نبيُّه هو، ورسوله هو، ورسالته هو، وكلامه هو'
- kind: translation
  label: Pratibha Translation
  body: 'He is concealed in His oneness, without any quality. None sees Him other than He: no sent prophet,
    perfected saint, or angel brought near knows Him. His Prophet is He, His Messenger is He, His message
    is He, and His word is He.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: divine unity is not a reality standing exposed before a separate
    knower. It is itself the “veil”—not an added screen, but the very absence of any second standpoint
    from which God could be grasped. On this account, prophets, saints, and angels do not possess God
    as an object of knowledge. Revelation too is described reflexively: the sender, messenger, message,
    and speech are all He. In the idiom often associated with waḥdat al-wujūd, this presses self-knowledge
    beyond psychological introspection: to know oneself rightly is to discover that the supposedly independent
    knower has no autonomous being before the Real. The contested move is evident. Classical theological
    accounts ordinarily preserve real distinctions between God, revelation, messenger, and recipient;
    this passage radically collapses such relational language into divine self-disclosure. Its point need
    not be that prophetic vocation is meaningless, but that no creaturely office gives mastery over God.
    Even the highest religious forms are occasions in which the One alone is ultimately manifest and knowing.'
- kind: key_terms
  label: Key Terms
  items:
  - term: وحدانيته
    definition: 'waḥdāniyya, from w-ḥ-d, “being one” -> God’s uncompounded oneness becomes the concealment
      of divine reality -> more than the default gloss “unity”: it denies an external vantage point on
      God.'
  - term: تستَّر
    definition: tasattara, from s-t-r, “to cover, conceal, veil oneself” -> the Real is hidden through
      His own oneness -> not a material barrier or a creaturely veil placed between two separate beings.
  - term: ولي كامل
    definition: walī, “one near, entrusted, protected,” with kāmil, “complete” -> the spiritually perfected
      friend of God -> not simply a “saint,” but even consummate proximity does not turn God into an object
      possessed by another.
  - term: رسالة
    definition: risāla, from r-s-l, “sending, dispatching” -> prophetic message and mission are identified
      with the divine self-disclosure -> more than a detachable text or information transmitted between
      independent parties.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural grammar
      for divine all-encompassment.
    divergence: The Qur’anic verse does not itself identify prophet, messenger, message, and divine speech
      without qualification.
  - citation: Qur’an 42:51
    resonance: Revelation is presented as God’s speech or communication, including through a messenger
      sent by His permission.
    divergence: Its explicit structure of God, messenger, and recipient retains distinctions that this
      passage rhetorically interiorizes.
  - citation: 'Hadith qudsi: “My servant continues to draw near to Me…” (Ṣaḥīḥ al-Bukhārī)'
    resonance: Divine action is said to become the servant’s hearing and sight, supporting the language
      of radical divine proximity.
    divergence: The hadith still says “My servant” and “draw near,” whereas this text stresses that no
      knower other than God remains.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself claiming certainty about God, pause for one minute and say inwardly:
    “The One I seek cannot be made into my object”; then let that humility shape one concrete act of listening.'
