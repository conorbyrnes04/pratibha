source_excerpt: His being is concealed by His oneness without any condition. No one other than He sees
  Him. No sent prophet, perfect saint or angel brought close knows Him. His prophet is He, His messenger
  is He, His message is He and His word is He.
translation_literal: His veil is only a part of His oneness; nothing veils Him other than He. His veil
  is simply the concealment of His existence within His oneness, without any quality. None sees Him other
  than He — no sent prophet, no perfected saint, no angel brought near knows Him. His prophet is He, His
  sending is He, and His word is He. He sent Himself, with Himself, to Himself. There was no mediator
  nor any means other than He. There is no difference between the Sender and the thing sent, and the one
  sent and the one to whom he is sent. The very existence of the prophetic message is His existence. There
  is no other, and there is no existence belonging to any other than He.
commentary: 'This passage drives the doctrine of waḥdat al-wujūd (the oneness of being) to its most radical
  conclusion regarding revelation itself. If nothing truly exists but God, then even the great mediating
  structures of religion — prophet, message, word, the act of sending — cannot be a second reality standing
  alongside Him. The author dissolves every apparent duality (Sender/sent, messenger/recipient) back into
  a single existence. The ''veil'' that conceals God is not something external opposed to Him; it is nothing
  other than His own oneness. Ignorance, then, is not a screen made of other-than-God, but simply our
  failure to recognize that what we take to be ''other'' is in fact He. This guards against two errors
  the treatise repeatedly attacks: the incarnationist idea that God ''enters into'' things (ḥulūl), and
  the notion that knowledge of God requires the self to ''cease to be'' (fanāʾ). Since the self never
  had an independent existence to begin with, there is nothing to annihilate — only ignorance to be lifted.
  Knowing oneself is knowing God because the seer, the seen, and the seeing are one; only He knows Himself
  through Himself.


  Key Terms


  **waḥdat al-wujūd** — The oneness (or unity) of being: the doctrine that there is only one real existence,
  God''s, and that all apparent ''others'' have no independent existence of their own.

  **ḥulūl** — Incarnation or indwelling — the belief that God enters into or resides within created things,
  which the treatise explicitly rejects.

  **fanāʾ** — ''Ceasing to be'' or annihilation of the self; the treatise argues this is a misleading
  condition for knowing God, since the self never had a real existence to be annihilated.'
insight: ''
practice: 'Reach for something ordinary — a cup, a door handle, another person''s hand — and as your fingers
  close around it, say inwardly: ''There is no other than He.'' Let the reaching, the reacher, and the
  thing reached collapse into one single act, and continue reaching for things all day as if He alone
  were touching Himself.'
