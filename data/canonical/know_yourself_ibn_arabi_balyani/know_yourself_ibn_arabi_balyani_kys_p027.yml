- kind: key_terms
  label: Key Terms
  items:
  - term: العُرَّاف
    definition: ʿarrāf, from ʿ-r-f, “to know/recognize” -> those reputed to know God -> not simply occult
      “diviners,” but mystical knowers whose doctrine is being criticized.
  - term: فناء الوجود
    definition: fanāʾ, “passing away, extinction” + wujūd, “being/existence” -> the annihilation of existence
      proposed as a condition of gnosis -> more radical than the default gloss “ego death,” since the
      issue is whether any creaturely being was ever independently real.
  - term: فناء الفناء
    definition: fanāʾ al-fanāʾ, “the extinction of extinction” -> a second-order disappearance of awareness
      of one’s own annihilation -> not a spiritual achievement here, but evidence that one has first reified
      what cannot possess existence.
  - term: إثبات الوجود
    definition: ithbāt, “affirming/positing,” + wujūd, “existence” -> granting existence to the thing
      later said to vanish -> missed by “passing away,” which can hide the text’s polemic against ontological
      affirmation of an other.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 28:88
    resonance: “Everything is perishing except His Face” is later read in this treatise as denying any
      independent existent besides God.
    divergence: The Qur'anic wording can also be read as affirming created things while declaring their
      perishability; this passage rejects that temporal ontology.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The treatise makes self-knowledge disclose the self’s lack of autonomous existence and
      thereby divine oneness.
    divergence: The report’s status and meaning are disputed, and many interpreters take it as knowledge
      of dependence and limitation, not identity-language about being.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my existence,” pause once and replace the possessive claim with a question:
    what in this moment is actually mine by itself?'
