- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: The author critiques the widespread doctrine that liberating knowledge (maʿrifa) requires
      fanāʾ — the ''passing away'' or annihilation of the self — and even the… Trap: self-erasure as quietism
      or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: Here understood in its most radical sense (waḥdat al-wujūd):
      only God''s existence is real, and nothing exists alongside Him. Trap: treating ‘existence’ as a
      neutral metaphysical predicate shared equally by God and world'
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: Here understood in its most radical sense (waḥdat al-wujūd): only God''s
      existence is real, and nothing exists alongside Him. Trap: pantheist collapse that erases servant/Lord
      distinction'
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: But from the standpoint of pure tawḥīd (oneness of being),
      only God truly is; the self and all created things have no independent existence to begin with.
      Trap: hearing a creedal slogan rather than ontological exclusivity of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  - term: nafs (نفس)
    definition: '‘self/soul/breath’ → the claiming self that must be known so its independence can be
      seen through Here: So if you know yourself without existence or ceasing to be, then you know God;
      and if not, then not. Trap: psychologizing as ego-therapy without ontological stakes'
  layer_provenance: editorial-enriched
