source_excerpt: That is clearly an error and misconception. The knowledge of God does not require the
  passing away of existence or the passing away of that passing away because things have no existence
  and what does not exist cannot pass away.
translation_literal: 'Most of those who know God make the ceasing of existence, and the ceasing of that
  ceasing, a condition for attaining the knowledge of God. This is an error and a clear oversight. For
  the knowledge of God does not presuppose the ceasing of existence, nor the ceasing of that ceasing.
  Things have no existence, and what does not exist cannot cease to exist. For ceasing to be implies the
  positing of existence, and that is polytheism. So if you know yourself without existence or ceasing
  to be, then you know God; and if not, then not.


  To make the knowledge of God conditional upon the ceasing of existence, and the ceasing of that ceasing,
  involves an assertion of polytheism. For the Prophet (peace be upon him) said, "Whoever knows himself,"
  and did not say, "Whoever makes himself cease to be." For to affirm the other makes its extinction impossible;
  and that whose affirmation is not allowable, its extinction is not allowable either. Your existence
  is nothing, and nothing cannot be added to something, whether perishing or unperishing, existent or
  non-existent. The Prophet points to the fact that you are non-existent now, just as you were non-existent
  before creation. For now is past eternity, and now is future eternity, and now is present time. God
  (exalted be His name) is the existence of past eternity, of future eternity, and of present time, yet
  without past eternity, future eternity, or present time ever existing.'
commentary: 'This passage strikes at the heart of Balyānī''s teaching and distinguishes it sharply from
  more common Sufi formulations. The author critiques the widespread doctrine that liberating knowledge
  (maʿrifa) requires fanāʾ — the ''passing away'' or annihilation of the self — and even the annihilation
  of that annihilation (fanāʾ al-fanāʾ). His argument is rigorously logical: to speak of something ''passing
  away'' is first to grant that it existed. But from the standpoint of pure tawḥīd (oneness of being),
  only God truly is; the self and all created things have no independent existence to begin with. Therefore
  there is nothing there to annihilate. To insist on annihilation is subtly to reaffirm the reality of
  the self — and thus to commit shirk (polytheism), the very error one hoped to escape.


  The deeper teaching is that self-knowledge is not a transformation, an achievement, or a loss, but a
  correction of ignorance. You were never a separate being who then dissolved into God; you simply were
  never separate at all. The Prophetic saying is precise: ''Whoever knows himself knows his Lord'' — knowledge,
  not annihilation. The passage on ''now'' (al-ān) is a striking contemplative point: past eternity, future
  eternity, and present moment all collapse into the eternal now that is God''s own reality, in which
  nothing has ever come to be. Your non-existence before creation and your non-existence ''now'' are the
  same non-existence.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self in God, a classical Sufi station. Balyānī critiques
  treating it as a precondition for knowledge, since claiming there is a self to annihilate reaffirms
  its illusory existence.

  **tawḥīd** — The affirmation of divine oneness. Here understood in its most radical sense (waḥdat al-wujūd):
  only God''s existence is real, and nothing exists alongside Him.

  **maʿrifa** — Direct, experiential knowledge of God, which for Balyānī is identical with true self-knowledge
  — the removal of ignorance rather than the destruction of any real self.'
insight: ''
practice: Catch yourself mid-effort as you struggle to erase some flaw or 'let go' of your ego, and stop
  the striving cold — the very fight to annihilate it secretly insists it was real. Let the hand that
  was pushing it away simply open, resting in the fact that there was never anything there to remove.
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
