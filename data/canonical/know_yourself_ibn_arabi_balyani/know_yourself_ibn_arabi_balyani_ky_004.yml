sanskrit_devanagari: Iʿlam annahu laysa fī al-wujūd illā Allāh taʿālā.
sanskrit_iast: ''
translation_literal: Know that there is nothing in existence save God, the Exalted.
commentary: 'This sentence states the treatise’s governing claim: wujūd, real existence, belongs properly and without division
  to God alone. It does not merely say that God is the highest being among other beings; rather, all apparently independent
  things are denied self-subsisting reality. Creaturely forms, selves, actions, and attributes appear, but their being is
  received, contingent, and without independence from the Real (al-Ḥaqq). In the logic of the treatise, self-knowledge does
  not culminate in discovering an autonomous inner essence. It culminates in seeing that the ego’s claim to possess existence
  is borrowed and illusory. This is why the formula can be spiritually dangerous if turned into a slogan: it does not authorize
  the ordinary self to declare itself God. It dissolves precisely that possessive selfhood, leaving the servant as a locus
  of manifestation, dependence, and worship. The attribution of the treatise has long circulated under Ibn ʿArabī’s name,
  though modern scholarship commonly associates it with ʿAbd Allāh al-Balyānī.


  Key Terms


  **اعلم** — “Know”: an imperative calling for direct metaphysical recognition rather than mere information.

  **الوجود** — “Existence” or “being”: the reality that the sentence predicates exclusively of God.

  **الله تعالى** — “God, the Exalted”: the sole truly self-subsisting reality in the statement.'
practice: 'For ten minutes, notice each thought, sensation, and claim of “mine.” Silently ask: “Does this possess being of
  itself?” Do not answer conceptually; let each appearance be recognized as dependent, then rest in humble awareness of the
  Real.'
