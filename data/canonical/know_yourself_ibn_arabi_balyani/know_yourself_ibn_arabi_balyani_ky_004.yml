section: Risālat al-Aḥadiyya (Treatise on Unity), opening thesis
sanskrit_devanagari: Iʿlam annahu laysa fī al-wujūd illā Allāh taʿālā.
sanskrit_iast: ''
translation_literal: Know that there is nothing in existence save God, the Exalted.
commentary: 'This sentence states the treatise’s governing claim: wujūd, real existence, belongs properly and without division
  to God alone. It does not merely say that God is the highest being among other beings; rather, all apparently independent
  things are denied self-subsisting reality. Creaturely forms, selves, actions, and attributes appear, but their being is
  received, contingent, and without independence from the Real (al-Ḥaqq). In the logic of the treatise, self-knowledge does
  not culminate in discovering an autonomous inner essence. It culminates in seeing that the ego’s claim to possess existence
  is borrowed and illusory. This is why the formula can be spiritually dangerous if turned into a slogan: it does not authorize
  the ordinary self to declare itself God. It dissolves precisely that possessive selfhood, leaving the servant as a locus
  of manifestation, dependence, and worship. The attribution of the treatise has long circulated under Ibn ʿArabī’s name,
  though modern scholarship commonly associates it with ʿAbd Allāh al-Balyānī.


  Key Terms


  **اعلم** — “Know”: an imperative calling for direct metaphysical recognition rather than mere opinion.

  **الوجود** — “Existence/being”: the reality attributed properly and unrestrictedly to God alone.

  **إلّا الله** — “Save God”: an exclusive formulation denying independent self-subsisting being to all else.


  Cross-Tradition Resonances


  **Upaniṣads, Chāndogya Upaniṣad 6.2.1, “One only, without a second.”:** Like the sentence’s exclusive claim, this passage
  grounds the plurality of things in an underlying nondual reality. Divergence: The Upaniṣadic formulation identifies ultimate
  reality as sat/Brahman, whereas Ibn ʿArabī’s formulation preserves the explicitly Qurʾānic name Allāh and its theological
  horizon.

  **Parmenides, fragment B8, “What is, is ungenerated and imperishable.”:** Parmenides likewise contrasts true being with
  the unstable, derivative world of ordinary appearances. Divergence: Parmenides’ Being is not articulated as the freely creating,
  named, and worshipped God affirmed in this Islamic metaphysical claim.

  **Meister Eckhart, sermon on John 1:1, “All creatures are a pure nothing.”:** Eckhart similarly denies creatures any independent
  ontological standing before the divine ground that gives them being. Divergence: Eckhart’s language of the Godhead and divine
  ground differs from Ibn ʿArabī’s insistence on Allāh as the sole reality in whom contingent forms receive existence.'
practice: 'For ten minutes, notice each thought, sensation, and claim of “mine.” Silently ask: “Does this possess being of
  itself?” Do not answer conceptually; let each appearance be recognized as dependent, then rest in humble awareness of the
  Real.'
