- kind: key_terms
  label: Key Terms
  items:
  - term: al-wujūd
    definition: from wajada, “to find” or “to be present” -> existence/reality itself belongs only to
      God here -> more than the default gloss “existence,” it implies the actuality by which anything
      can be found or manifest.
  - term: illā
    definition: the Arabic exclusion particle, “except/save” -> it negates every claimant to independent
      existence before affirming God -> not merely numerical monotheism, but an uncompromising ontological
      restriction.
  - term: Allāh taʿālā
    definition: Allāh, the divine Name; taʿālā, “is exalted” -> God is named as transcendent even while
      said to be the only existence -> the epithet resists reducing divine reality to the visible world.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān 28:88
    resonance: “Everything is perishing except His Face” supports the treatise’s denial of enduring independent
      reality to all besides God.
    divergence: The Qurʾānic verse can be read as affirming created things that perish, whereas this treatise
      intensifies it into the claim that no other existence is present at all.
  - citation: Qurʾān 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” provides the scriptural vocabulary
      through which the treatise speaks of divine all-encompassing reality.
    divergence: The verse does not itself require the thesis that creaturely existence is simply unreal
      or non-independent.
  - citation: Ibn ʿArabī, Fuṣūṣ al-ḥikam, “Ḥikmat ilāhiyya fī kalimat Ādamiyya”
    resonance: Ibn ʿArabī likewise distinguishes the Real’s being from the dependent forms in which the
      Real is disclosed, making self-knowledge a site of divine recognition.
    divergence: The attribution and interpretation of this short treatise remain contested; its uncompromising
      formulas can sound less carefully qualified than Ibn ʿArabī’s broader discussions of divine transcendence
      and manifestation.
