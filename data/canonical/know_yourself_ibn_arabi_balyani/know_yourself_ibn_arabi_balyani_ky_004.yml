unit_label: God Alone Is Existence
title: God Alone Is Existence
unit_type: verse
section: Risālat al-Aḥadiyya (Treatise on Unity), opening thesis
sanskrit_devanagari: Iʿlam annahu laysa fī al-wujūd illā Allāh taʿālā.
sanskrit_iast: ''
translation_literal: Know that there is no existence save God, whose name is exalted.
commentary: 'This is the treatise’s governing claim: what is ordinarily called “existence” does not belong
  independently to the self, the world, or any created thing. In the idiom of waḥdat al-wujūd, God is
  not one being among other beings; He is the sole Reality by which anything appears to be. Thus self-knowledge
  is knowledge of the Lord: when the seeker investigates the apparently separate “I,” its claim to self-subsistence
  dissolves, and what remains is dependence upon divine Being. The passage does not merely urge devotion
  to one God; it makes the stronger ontological assertion that no other reality possesses existence in
  its own right. That is its contested move. Critics can hear it as collapsing Creator and creation, or
  as authorizing a careless identity claim between human and God. The surrounding argument tries to block
  both conclusions: it denies that God enters creatures, that creatures enter God, or that two beings
  unite. Yet its language presses beyond ordinary theological distinctions, treating creaturely otherness
  as a misperception rather than an independently existing counterpart to God. The knowing required here
  is therefore not conceptual information but a transformation in how the self’s reality is seen.'
practice: 'Today, when you say “my life” or “my ability,” pause once and replace the possessive claim
  inwardly with: “This has no independence from God.”'
