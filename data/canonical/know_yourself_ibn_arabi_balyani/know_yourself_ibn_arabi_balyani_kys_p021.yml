- kind: commentary
  label: Pratibha Commentary
  body: 'The passage makes its most uncompromising claim: self-knowledge does not disclose a finite self
    standing in some relation to God, but dissolves the very premise of an independently existing self.
    In the vocabulary of waḥdat al-wujūd, existence belongs properly and truly to God alone; the creature
    is not a second being that might be self-subsistent, divinely sustained, contained in God, or joined
    to God. Each of those formulations still leaves two terms—God and a real other—and thus, for this
    text, compromises divine oneness. “Know yourself” therefore means recognizing that the self one ordinarily
    takes to be real has no being of its own. The contested move is evident in the phrase “not ... in
    Him or along with Him”: this is not merely mystical dependence or intimacy, but a denial that creaturely
    existence has positive reality beside the Real. Such language can sound like identity between God
    and the person, yet the treatise simultaneously blocks simple incarnation, mixture, entry, or union.
    Its intended distinction is between God’s sole reality and the self’s imagined autonomous status—not
    a claim that an individual ego becomes divine. The result is a radical re-description of servanthood:
    one does not possess being and then offer it to God; one sees that every claim to possession was already
    unfounded.'
- kind: key_terms
  label: Key Terms
  items:
  - term: موجود
    definition: from w-j-d, “to find” or “be”; here, an existent thing. The issue is not whether you appear
      or act, but whether you possess being independently enough to count as a second existent.
  - term: صفة
    definition: from w-ṣ-f, “to describe”; an attribute or qualification. The passage denies that personal
      qualities have self-standing ontological reality, not that ordinary descriptions are pragmatically
      usable.
  - term: معه
    definition: from maʿa, “with”; here, being alongside God. More than companionship, it names the metaphysical
      assumption that there can be a real co-existing other beside the One.
  - term: غني به
    definition: 'ghaniyy, “independent, free of need,” with bi-hi, “through/by Him.” The phrase presses
      against self-sufficiency: what seems like creaturely independence is not an independent possession.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural horizon
      for denying any temporal or spatial counterpart to God.
    divergence: The Qur’anic verse proclaims divine comprehensiveness; the treatise extends this into
      a stronger denial of creaturely being as such.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” supports the text’s insistence that no created
      thing has ultimate permanence.
    divergence: A common reading affirms created things that perish; this treatise reads the verse as
      denying independent existence even before perishing.
  - citation: “Whoever knows himself knows his Lord”
    resonance: 'The treatise makes this widely circulated saying its governing formula: knowledge of the
      self opens directly onto knowledge of God.'
    divergence: The saying is not established as a sound Prophetic hadith by standard hadith criticism,
      and the treatise gives it a distinctly nondual metaphysical interpretation.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my ability,” “my status,” or “my problem,” pause once and silently add:
    “This has no independence from God.” Then act responsibly, without turning that reminder into passivity.'
