pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: For many Sufis, the spiritual path culminates in fanāʾ—the annihilation of the self—and
      then even the annihilation of that annihilation. Trap: self-erasure as quietism or dissociation
      rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: Under waḥdat al-wujūd (the oneness of being), the created self never
      possessed real existence to begin with. Trap: pantheist collapse that erases servant/Lord distinction'
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: Under waḥdat al-wujūd (the oneness of being), the created
      self never possessed real existence to begin with. Trap: treating ‘existence’ as a neutral metaphysical
      predicate shared equally by God and world'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Trap: equating mystical knowing with accumulated doctrine'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: But the author regards this as a subtle idolatry (shirk). Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
  layer_provenance: editorial-enriched
