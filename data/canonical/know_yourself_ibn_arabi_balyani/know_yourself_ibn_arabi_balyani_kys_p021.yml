- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: Both texts locate knowledge or realization in the quality and direction of attention itself rather than in
      external content or attributes. Ibn Arabi negates passing attributes to redirect attention to the knower; the Siva Sutra
      identifies sustained attention as the substance of knowledge.
    divergence: Ibn Arabi emphasizes negation of false identification with attributes; the Siva Sutra posits attention as
      an active, positive principle of consciousness.
    passage_id: siva_sutra.ss_ii_12
  - citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
    resonance: Both establish a method of self-inquiry that turns inward by mapping or analyzing the knower's own nature through
      systematic correspondence—Ibn Arabi through negation of attributes, the Mandukya through the fourfold analysis of Om
      and consciousness states.
    divergence: The Mandukya uses phonetic and phenomenological scaffolding (Om, waking/dream/deep sleep); Ibn Arabi works
      through direct negation without intermediary structures.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both describe a paradoxical intensification of perception through focused effort: the object becomes clearer
      when attention is ardently directed toward it, mirroring how clarity of the knower emerges when attention returns inward
      rather than dispersing outward.'
    divergence: The Yoga Spandakarika frames this as perception of an external sacred tremor; Ibn Arabi frames it as recognition
      of the knower's own non-attributed nature.
    passage_id: yoga_spandakarika.sp_36
