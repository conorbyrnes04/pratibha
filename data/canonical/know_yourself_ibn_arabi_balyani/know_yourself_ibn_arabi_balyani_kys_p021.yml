pratibha_layers:
- kind: original
  label: Original
  body: 'ولا بذلك أنك موجود وصفتك هكذا أبدًا: غني به. إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه'
- kind: translation
  label: Pratibha Translation
  body: It is not meant by this that you are anything that exists, or that your attributes are anything
    that exists; rather, it means that you never were and never will be, whether by yourself, through
