source_excerpt: That does not mean that you have being and you are qualified by this or that attribute.
  What is meant is that you never were and never will be, whether through yourself or through Him or in
  Him or with Him.
translation_literal: 'The Prophet (upon whom be peace) indicates by this that you are not you: you are
  He, without you—not He entering into you, nor you entering into Him, nor He proceeding forth from you,
  nor you proceeding forth from Him. And it is not meant by this that you are something that exists, or
  that your attributes are something that exists. Rather, what is meant is that you never were, nor will
  you ever be, whether by yourself or through Him or in Him or along with Him. You are neither ceasing
  to be nor still existing. You are He, without any of these limitations. So if you know your existence
  in this way, then you know God; and if not, then not.


  Most of those who know God make the ceasing of existence, and the ceasing of that ceasing, a condition
  for attaining the knowledge of God—and that is an error and a plain oversight. For the knowledge of
  God does not presuppose the ceasing of existence, nor the ceasing of that ceasing. For things have no
  existence, and what does not exist cannot cease to exist. Ceasing to be implies first positing existence,
  and that is polytheism. So if you know yourself without existence or ceasing to be, then you know God;
  and if not, then not.'
commentary: 'This passage strikes at the heart of Balyānī''s radical reading of the ḥadīth ''Whoso knoweth
  himself knoweth his Lord.'' The Prophet, he insists, said ''knows himself,'' not ''makes himself cease
  to be.'' The distinction is decisive. For many Sufis, the spiritual path culminates in fanāʾ—the annihilation
  of the self—and then even the annihilation of that annihilation. But the author regards this as a subtle
  idolatry (shirk). To speak of ''ceasing to be'' presupposes that there was first a genuine, independent
  existence to be extinguished; and to affirm such an existence beside God is precisely to posit a second
  reality alongside the One. Under waḥdat al-wujūd (the oneness of being), the created self never possessed
  real existence to begin with. You are not something that exists and then dissolves; you simply never
  were an independent ''you'' at all. The self is not annihilated—it is recognized as having always been
  nothing but Him. Thus the goal is not the dramatic self-erasure of the mystic, but the quiet unveiling
  of a truth that was always the case: the knower dissolves not into oblivion but into knowing itself,
  where seer, seen, and seeing are one. Self-knowledge, correctly understood, is not the achievement of
  a state but the removal of ignorance—like one who knew nothing and then comes to know: his being does
  not change, only his ignorance departs.


  Key Terms


  **maʿrifa** — Direct experiential knowledge or gnosis—here, the knowledge of the self that is identical
  with the knowledge of God, arrived at not by intellect or annihilation but by unveiling.

  **fanāʾ** — The Sufi doctrine of ''passing away'' or annihilation of the self in God. Balyānī critiques
  its literal application, arguing that to ''cease to be'' wrongly presupposes a real existence to extinguish.

  **shirk** — Associating a partner with God; polytheism. The author extends this to the very affirmation
  of an independent created existence alongside the sole reality of God.'
insight: ''
practice: Whenever you begin to say 'I' today—'I want,' 'I think,' 'I did'—let the word finish on your
  tongue without correcting or silencing it, and notice that there was never a separate one saying it,
  only He speaking as 'you, without you.' Let each 'I' become not a claim of existence but a place where
  nothing independent was ever standing.
