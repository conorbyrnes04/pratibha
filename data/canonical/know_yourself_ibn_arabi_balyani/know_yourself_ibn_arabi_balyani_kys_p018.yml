- kind: key_terms
  label: Key Terms
  items:
  - term: عرفت
    definition: from ʿ-r-f, “to know, recognize” -> a direct recognition of the Lord -> more than ordinary
      informational knowledge or doctrinal assent.
  - term: ربِّي
    definition: from r-b-b, “to nurture, govern, sustain” -> “my Lord,” the one through whom the speaker
      knows -> not merely a generic name for a remote deity.
  - term: بربِّي
    definition: bi-, “by/through,” plus “my Lord” -> God is both the means and the known in this recognition
      -> missed when “by” is heard as only a human proof or argument.
  - term: أنت هو بلا أنت
    definition: “you are He, without you” -> negates an independently self-subsisting ego while rejecting
      entry, exit, and mixture -> not a simple equation of the empirical person with God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supports the treatise’s refusal
      to locate God as one being among others.
    divergence: The verse does not itself formulate the text’s uncompromising conclusion that the separate
      self has no existence.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” is used in Akbarian writings to stress the radical
      dependence of all that appears.
    divergence: Its immediate Qur’anic force concerns God’s abiding reality; reading it as denial of all
      creaturely existence is a distinctive metaphysical extension.
  - citation: Hadith qudsi, Ṣaḥīḥ Muslim 2569
    resonance: “I was sick and you did not visit Me” identifies service to creatures with service directed
      to God, loosening a simple God/world separation.
    divergence: It commands ethical care for the sick; it does not explicitly teach identity of divine
      and creaturely existence.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when “my success,” “my failure,” or “my identity” arises in your mind, pause once and
    silently ask: “What here exists by itself?” Then perform one needed act of care without making it
    proof of a separate self.'
