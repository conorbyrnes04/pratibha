work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p018
unit_label: Knowing the Lord Unmakes the Independent Self
title: Knowing the Lord Unmakes the Independent Self
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: He also said, I knew my Lord through my Lord. What the Prophet pointed out by that, is
  that you are not you but you are Him and there is no you. It is not that He enters into you or that
  you enter into Him, or that He comes out of you or that you come out of Him. That does not mean that
  you have being and you are qualified by this or that attribute.
translation_literal: 'And he said—peace be upon him—“I knew my Lord by my Lord.” By this the Prophet points
  out that you are not you: rather, you are He, without you. It is not that He enters into you, nor that
  you enter into Him; nor that He proceeds from you, nor that you proceed from Him. Nor does this mean
  that you are something existing, or that your attributes exist in this way at all.'
commentary: 'The saying “I knew my Lord by my Lord” grounds knowledge not in a human faculty standing
  over against God, but in God’s own self-disclosure. Its following claim is deliberately sharper: the
  self one takes to be an independently existing “you” has no such standing. In the vocabulary of waḥdat
  al-wujūd, there is no second existence alongside divine Being from which a knower could reach a separate
  God. Yet the text immediately blocks a crude spatial mysticism. “He” does not enter the servant, and
  the servant does not enter, emerge from, or mix with Him. The point is not incarnation, movement, or
  fusion between two already established entities. Nor, it insists, does the human self retain a real
  existence and merely acquire a divine attribute. The contested move lies precisely here: ordinary selfhood
  is treated as a claim made by ignorance, not as an independently real thing later abolished. Self-knowledge
  therefore means seeing the dependency and unreality of the separate claimant; knowledge of the Lord
  is God known through God, rather than an object possessed by the ego.'
insight: ''
practice: 'Today, when “my success,” “my failure,” or “my identity” arises in your mind, pause once and
  silently ask: “What here exists by itself?” Then perform one needed act of care without making it proof
  of a separate self.'
sanskrit_devanagari: 'وقال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي." أشار – صلى الله عليه وسلم – بذلك
  أنك لست أنت، «بل» أنت هو بلا أنت: لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛
  ولا بذلك أنك موجود وصفتك هكذا أبدًا'
