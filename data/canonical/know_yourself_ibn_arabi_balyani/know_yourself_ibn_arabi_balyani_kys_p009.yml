source_excerpt: His own being veils Him. His being is concealed by His oneness without any condition.
  No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows Him.
translation_literal: 'Understand this, so that you do not fall into the error of those who believe in
  incarnation: He is not in a thing, nor is a thing in Him, whether entering in or proceeding forth. You
  must know Him in this way — not by knowledge (''ilm), nor by intellect, nor by understanding, nor by
  imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception. None sees
  Him except Himself; none perceives Him except Himself. By Himself He sees Himself, and by Himself He
  knows Himself. None sees Him other than He, and none perceives Him other than He. His veil is only a
  part of His oneness; nothing veils Him other than He. His veil is simply the concealment of His existence
  in His oneness, without any quality. None sees Him other than He — no sent prophet, no perfected saint,
  no angel brought near knows Him. His prophet is He, His sending is He, and His word is He. He sent Himself,
  with Himself, to Himself. There was no mediator and no means other than He.'
commentary: 'This passage strikes at the heart of the treatise''s teaching on the oneness of being (waḥdat
  al-wujūd). The author first guards against a crude misunderstanding: the doctrine is not that God dwells
  inside creatures or that creatures enter into God (the error of the incarnationists). Rather, since
  there is in truth only one existence, the whole apparatus of ''in'' and ''out,'' ''entering'' and ''proceeding
  forth,'' collapses. Notice how the text systematically dismantles every faculty by which we might hope
  to grasp God — knowledge, intellect, imagination, sense, outer and inner eye. Each is a created instrument,
  and no created instrument can seize the Real. The decisive claim is that only He knows His own being:
  ''By Himself He sees Himself, and by Himself He knows Himself.'' Human self-knowledge, then, is not
  the knower grasping an object; it is God''s own self-knowing shining through what we mistake for a separate
  self. The most striking image is that God''s ''veil'' is nothing other than His oneness. There is no
  external screen hiding Him — the very intensity of His singular being is what conceals Him, much as
  excess of light blinds the eye. This dissolves the whole quest for a ''mediator'': prophet, message,
  and word are all He, sent by Him, through Him, to Him. Knowledge of God is therefore never an achievement
  added to us; it is the removal of the illusion that we were ever anything apart.


  Key Terms


  **waḥdat al-wujūd** — The ''oneness of being'': the doctrine that there is only one true existence,
  which is God''s, and that all apparent ''others'' have no independent being of their own.

  **ḥijāb** — ''Veil.'' Here, paradoxically, God''s veil is nothing other than His own oneness — no external
  screen conceals Him; the sheer singularity of His being is itself the concealment.

  **maʿrifa** — Experiential, intimate knowledge of God, distinguished from discursive knowledge (''ilm);
  here shown to be ultimately God''s own self-knowing rather than a human acquisition.'
insight: ''
practice: Standing before a mirror, drop the assumption that you are the one looking, and let the words
  "By Himself He sees Himself" rest on the seeing itself — until you cannot say who is the seer and who
  the seen. Let the search for a knower dissolve into the knowing that was already there before you looked.
