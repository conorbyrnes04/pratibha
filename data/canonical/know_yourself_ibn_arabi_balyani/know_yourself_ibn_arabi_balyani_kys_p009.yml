- kind: translation
  label: Pratibha Translation
  body: 'His veil is His oneness: nothing veils Him except His veil. His existence is His oneness, concealed
    by His oneness without any quality. None sees Him except Himself; no sent prophet, perfected saint,
    or angel brought near knows Him.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: God is not hidden by a created screen, distance, or deficiency of
    spiritual rank. The only “veil” is divine oneness itself—the impossibility of setting a knower over
    against an object known as though God were one being among others. In the treatise’s waḥdat al-wujūd
    logic, every such opposition already grants independent standing to an “other.” Thus even prophets,
    saints, and near angels do not know God as an external object; God alone sees and knows God. Self-knowledge
    consequently does not culminate in a privileged human possession of the divine. It undoes the self
    imagined as a separate knower, disclosing that the reality by which one knows is not one’s private
    property. The contested move lies in identifying the divine veil with divine oneness and then pressing
    this toward the denial of any genuinely independent creaturely existence. Many theologians safeguard
    an enduring Creator-creature distinction and read divine incomparability without collapsing the reality
    of creatures. Balyānī’s formulation instead treats separateness itself as the epistemic veil: not
    a thing blocking God, but the habit of imagining a thing other than Him.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ḥijāb
    definition: 'From ḥ-j-b, “to screen, bar, conceal.” Here it is not a material curtain between God
      and creatures, but divine oneness itself: the non-objectifiability of the Real, missed when “veil”
      is glossed simply as separation.'
  - term: waḥdāniyya
    definition: From w-ḥ-d, “being one.” In this passage it means the divine uniqueness that excludes
      a second standpoint from which God could be observed, not merely numerical oneness.
  - term: kayfiyya
    definition: From kayfa, “how?”—the mode or manner of a thing. “Without any quality” denies a knowable
      modality for God; it does not merely say that God’s qualities are difficult to describe.
  - term: walī kāmil
    definition: Walī, from w-l-y, one who is near or under divine guardianship; kāmil means complete or
      perfected. Even the fully realized saint does not become an independent subject who comprehends
      God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 6:103
    resonance: “Sight comprehends Him not, while He comprehends all sight” closely supports the asymmetry
      of seeing and knowing stated here.
    divergence: The Qur’anic verse does not itself draw the treatise’s stronger ontological conclusion
      that no other possesses independent existence or knowing.
  - citation: Qur’an 57:3
    resonance: Its naming of God as “the First and the Last, the Outward and the Inward” resonates with
      the treatise’s refusal to locate God within ordinary oppositions.
    divergence: The verse affirms divine all-encompassment, whereas this passage makes oneness itself
      the veil that dissolves the knower-known duality.
  - citation: Ibn ʿArabī, Fuṣūṣ al-Ḥikam, chapter on Noah
    resonance: The Akbarian language of divine self-disclosure in forms helps illuminate why created vision
      cannot stand outside the Real and master it.
    divergence: This short treatise states the point in an especially absolute idiom; its attribution
      to Ibn ʿArabī has long been disputed, and its rhetoric need not represent every nuance of his writings.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice yourself treating God as a distant object to be mentally grasped, pause
    for one minute and release the demand to picture or possess the divine; attend instead to the bare
    fact that awareness is given.
