work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p009
unit_label: Divine Oneness Is Its Own Veil
title: Divine Oneness Is Its Own Veil
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: His own being veils Him. His being is concealed by His oneness without any condition.
  No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows Him.
translation_literal: 'His veil is His oneness: nothing veils Him except His veil. His existence is His
  oneness, concealed by His oneness without any quality. None sees Him except Himself; no sent prophet,
  perfected saint, or angel brought near knows Him.'
commentary: 'The claim is uncompromising: God is not hidden by a created screen, distance, or deficiency
  of spiritual rank. The only “veil” is divine oneness itself—the impossibility of setting a knower over
  against an object known as though God were one being among others. In the treatise’s waḥdat al-wujūd
  logic, every such opposition already grants independent standing to an “other.” Thus even prophets,
  saints, and near angels do not know God as an external object; God alone sees and knows God. Self-knowledge
  consequently does not culminate in a privileged human possession of the divine. It undoes the self imagined
  as a separate knower, disclosing that the reality by which one knows is not one’s private property.
  The contested move lies in identifying the divine veil with divine oneness and then pressing this toward
  the denial of any genuinely independent creaturely existence. Many theologians safeguard an enduring
  Creator-creature distinction and read divine incomparability without collapsing the reality of creatures.
  Balyānī’s formulation instead treats separateness itself as the epistemic veil: not a thing blocking
  God, but the habit of imagining a thing other than Him.'
insight: ''
practice: Today, when you notice yourself treating God as a distant object to be mentally grasped, pause
  for one minute and release the demand to picture or possess the divine; attend instead to the bare fact
  that awareness is given.
sanskrit_devanagari: 'حجابه وحدانيته، فلا يحجبه شيءٌ غير حجابه. وجوده وحدانيته، تستَّر بوحدانيته بلا كيفية.
  لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه.'
