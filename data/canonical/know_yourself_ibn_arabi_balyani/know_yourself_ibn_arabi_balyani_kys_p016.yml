source_excerpt: There is no existence to any other who could pass away, or have a name or be named. Because
  of this, the Prophet, God bless him and give him peace, said, Whoever knows their self, knows their
  Lord.
translation_literal: 'The very existence of the prophetic message is His existence. There is no other,
  and there is no existence belonging to any other than He, nor to its ceasing to be (fanāʾ), nor to its
  name, nor to its named. And for this reason the Prophet, upon whom be peace, said: "Whoever knows himself
  knows his Lord." And he said, upon him be peace: "I know my Lord by my Lord." By this the Prophet points
  out that you are not you: you are He, without you — He does not enter into you, nor you into Him, nor
  does He proceed forth from you, nor you from Him. And it is not meant by this that you are something
  that exists, or that your attributes are something that exists; rather it means that you never were,
  nor will you be, whether by yourself, or through Him, or in Him, or along with Him. You are neither
  ceasing to be nor still existing. You are He, without any of these limitations. So if you know your
  existence in this way, then you know God; and if not, then not.'
commentary: 'This passage stands at the heart of the treatise''s teaching on waḥdat al-wujūd, the oneness
  of being. The author reads the famous ḥadīth ''Whoever knows himself knows his Lord'' not as a two-step
  ascent from creature to Creator, but as the collapse of the very distinction between them. To ''know
  yourself'' is to recognize that there was never a separate self to know — ''you are He, without you.''
  The text is careful to guard against two errors. First, incarnationism (ḥulūl): God does not ''enter''
  the self, nor does the self merge into God, for entering and proceeding forth still presuppose two existents.
  Second, and more subtly, the author critiques the widespread Sufi doctrine that the path requires ''ceasing
  to be'' (fanāʾ). To make annihilation a precondition of gnosis is, paradoxically, to affirm the existence
  of the thing that must be annihilated — and that affirmation is itself a hidden polytheism (shirk).
  Since the self never had independent existence in the first place, nothing can ''pass away.'' What ceases
  is not the self but the illusion of the self''s separate reality, just as when ignorance lifts, knowledge
  does not replace one existence with another; the existence remains and only the ignorance departs. The
  illusion of an ''other'' is precisely the veil, and the veil, the treatise insists, is nothing but God''s
  own oneness concealing itself.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self in God. The treatise critiques treating fanāʾ
  as a required stage, since to annihilate the self presupposes it exists — a subtle form of shirk. True
  gnosis recognizes the self never had independent existence.

  **maʿrifa** — Experiential, intimate knowledge or gnosis — here, self-knowledge that is identical with
  knowledge of God, as in the ḥadīth ''Whoever knows himself knows his Lord.''

  **waḥdat al-wujūd** — The ''oneness of being'': the doctrine that there is only one real Existence,
  God''s, and that all apparent others have no existence of their own but are self-disclosures of the
  One.'
insight: ''
practice: Sit quietly and bring to mind the phrase 'I am not I; there is only He.' Rather than trying
  to annihilate or empty yourself — which subtly reaffirms a self to be emptied — simply observe each
  arising sense of a separate 'I' (the one thinking, the one meditating) and gently recognize that it,
  too, has no existence of its own. Do not push it away; see that there was never anything there to push
  away. Rest in the recognition that what appears as 'you' is a momentary self-disclosure of the One,
  and let the seeking itself become the seen.
