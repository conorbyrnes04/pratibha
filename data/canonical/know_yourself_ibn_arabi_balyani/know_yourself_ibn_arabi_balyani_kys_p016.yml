- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
    resonance: 'Both texts locate the problem in *misdirected attention*: the soul/self continuously manifests its true nature,
      but remains obscured because consciousness is absorbed in transient content (sense-experiences, passing phenomena).
      Clarity requires a reversal of attention back to the knower itself.'
    divergence: Plotinus frames this as a metaphysical fact about the soul's continuous activity; Ibn Arabi emphasizes the
      ontological non-existence of the 'other' (passing content), making the inward turn a recognition of what never truly
      was.
    passage_id: plotinus_enneads.enn_v_1_12
  - citation: 'Vijnana Bhairava — Yukti #61'
    resonance: 'Both propose that entry into a non-dual or void state reveals the Self''s true nature directly. The structural
      move is: dissolve the multiplicity of named/passing things, and the Self manifests as what remains—the unchanging knower.'
    divergence: Vijnana Bhairava locates this in nondual consciousness as the ground of manifestation; Ibn Arabi denies existence
      to the 'other' entirely, making the inward turn a negation of false attribution rather than an ascent to a higher state.
    passage_id: vijnana_bhairava.yukti_061
