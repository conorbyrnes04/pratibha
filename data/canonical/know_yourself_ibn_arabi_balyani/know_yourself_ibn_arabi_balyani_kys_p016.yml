- kind: key_terms
  label: Key Terms
  items:
  - term: nafs
    definition: Arabic root n-f-s, breath/self -> the self whose supposed independent reality is examined
      -> not simply the psychological ego or “soul.”
  - term: maʿrifa
    definition: Arabic root ʿ-r-f, to recognize or know -> direct recognition of the Lord through knowing
      the self’s non-independence -> more than conceptual information (ʿilm).
  - term: ghayr
    definition: Arabic for other, another -> whatever is posited as existing apart from God -> not merely
      a different object within a shared universe.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural pattern
      for denying an independent before, after, exterior, or interior to God.
    divergence: The verse names divine all-encompassment; this passage draws the stronger metaphysical
      conclusion that no other possesses being.
  - citation: Qurʾan 28:88
    resonance: “Everything is perishing except His Face” is later invoked in the treatise to affirm that
      all apparent things lack enduring reality before God.
    divergence: A common reading concerns eventual perishing; the treatise reads it as a statement about
      present non-independence.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The saying condenses the path of self-knowledge into knowledge of God.
    divergence: Its hadith authentication is disputed, while the treatise gives it an uncompromising ontological
      interpretation.
