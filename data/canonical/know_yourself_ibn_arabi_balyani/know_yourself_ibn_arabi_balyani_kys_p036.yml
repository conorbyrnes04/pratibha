- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
    resonance: Both texts negate all positive predicates (temporal, conscious, unconscious) to point toward what cannot be
      conceptually grasped—Ibn Arabi denies eternity-without-beginning/end and timelessness while Mandukya denies inward/outward
      consciousness and consciousness itself—each negation clearing the ground for direct recognition of what remains.
    divergence: Mandukya uses systematic negation (neti neti) as a ladder to Turīya's transcendent fourth state; Ibn Arabi's
      negation collapses the distinction between God's being and the unreality of temporal categories, emphasizing paradox
      and surrender rather than hierarchical ascent.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
  - citation: Patañjali Yoga Sūtras 4.31
    resonance: 'Both texts describe a radical subtraction: when all coverings or conceptual overlays dissolve, what remains
      is almost nothing—a knowledge so stripped of content that it approaches emptiness, yet this emptiness is the true knowledge
      itself.'
    divergence: Patañjali frames this as the final stage of yogic discrimination (kaivalya) where subject-object duality collapses;
      Ibn Arabi presents it as a paradoxical simultaneity where God's being and the non-being of all categories coexist, emphasizing
      mystical recognition over systematic progression.
    passage_id: patañjali_yoga_sūtras.ys_4_31
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts locate knowledge in a reflexive turn—reflection becoming self-knowledge, and the direct disclosure
      of truth through cessation of interpretive overlay—where the act of knowing itself reveals the Self without mediation.
    divergence: Śiva Sūtra grounds this in Śāmbhavopāya (the direct path of Śiva's grace) as an ontological principle of consciousness;
      Ibn Arabi's pointer suspends interpretation itself, asking the reader to let insight disclose directly rather than through
      systematic reflection.
    passage_id: siva_sutra.ss_i_17
