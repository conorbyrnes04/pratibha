source_excerpt: God is the very being of eternity-without-beginning, eternity-without-end and timelessness
  even though in reality there is no eternity-without-beginning, eternity-with-out-end or timelessness.
  If it were otherwise, He would not be alone, without any associate.
translation_literal: The Prophet points to the fact that you are non-existent now just as you were non-existent
  before the creation. For now is past eternity, and now is future eternity, and now is past time. And
  God (whose name be exalted) is the very existence of past eternity and the existence of future eternity
  and the existence of past time — yet without past eternity, future eternity, or past time ever having
  existed at all. For if it were not so, He would not be by Himself without any partner, and it is indispensable
  that He should be by Himself without any partner. For His 'partner' would be one whose existence lay
  in his own essence, not in the existence of God; and whoever were in that position would not be dependent
  upon Him. Then, in that case, there would be a second Lord — which is absurd. God (whose name be exalted)
  can have no partner, nor like, nor equal.
commentary: 'This passage strikes at one of the subtlest attachments of the seeker: the reification of
  time and eternity themselves. Ordinary devotion imagines God as everlasting — extending infinitely backward
  into ''eternity-without-beginning'' (azal) and forward into ''eternity-without-end'' (abad). Balyānī
  dismantles this by insisting that these temporal categories have no independent existence. God is the
  very being underlying past eternity, future eternity, and present time, yet none of these actually exists
  as a distinct reality. The ''now'' is not a slice of duration but the sole standpoint of the Real, in
  which past and future eternity collapse. The argument is rigorously logical: if eternity or time existed
  alongside God, they would constitute a ''partner'' — a reality self-subsisting in its own essence rather
  than in God. But tawḥīd admits no such second reality. Thus the teaching is not merely metaphysical
  decoration; it is a direct consequence of divine oneness. To grasp that eternity dissolves when truly
  known is to see that your own supposed persistence ''through time'' was never yours, and never a thing
  at all. You were non-existent before creation and remain so now — not annihilated, but simply never
  an independent existent. What appears as your continuity is the manifestation of the one Existence,
  which alone is.


  Key Terms


  **azal / abad** — Eternity-without-beginning (azal) and eternity-without-end (abad); here shown to have
  no independent existence, being only names for the one divine Existence.

  **tawḥīd** — The affirmation of God''s absolute oneness; here extended to deny that time or eternity
  could exist as a second reality beside God.

  **shirk** — Associating a partner with God; Balyānī treats the positing of any self-subsisting reality
  — even ''time'' — as a form of hidden polytheism.'
insight: ''
practice: Draw a single line on paper and let your finger rest at its exact midpoint; feel how the whole
  line to your left and to your right has no existence except at this one point where your finger touches,
  and know that 'before' and 'after' are only this. Let the line be time, the point be now, and your resting
  finger be the only real.
