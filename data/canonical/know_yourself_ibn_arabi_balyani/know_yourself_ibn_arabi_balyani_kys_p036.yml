- kind: translation
  label: Pratibha Translation
  body: For God is the existence of past eternity, the existence of future eternity, and the existence
    of primordial timelessness; yet without past eternity, future eternity, or primordial timelessness
    existing. For otherwise He would not be alone, without any partner.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is not merely that God lasts through infinite time. It is sharper: what is called beginningless
    eternity, endless duration, and ancientness has no independent reality alongside Him. God is their
    “existence,” while these temporal or conceptual horizons are denied separate standing. This is a characteristic
    waḥdat al-wujūd move: every apparent determination is referred back to the one Real, rather than being
    granted even a subtle co-eternity with God. The argument protects tawḥīd by refusing a second reality—not
    only another god, but also an independently existing “eternity” in which God might reside. Self-knowledge
    follows the same logic. To know oneself is to discover that one’s presumed self-standing existence
    is not an additional fact beside the Real. The contested move is evident: the text does not simply
    say that creatures depend on God; it treats all otherness, including time itself, as lacking existence
    in its own right. Many theologians preserve a firmer distinction between God and created things, even
    while affirming radical dependence. Here, however, distinction is relocated from independent being
    to the level of names, appearances, and relations.'
- kind: key_terms
  label: Key Terms
  items:
  - term: الأزل
    definition: from a root suggesting what has no beginning -> beginningless eternity -> not simply “the
      distant past,” but a category the passage refuses to treat as an entity beside God.
  - term: الأبد
    definition: from a root denoting perpetuity -> endless futurity -> more than “forever”; it is the
      imagined limitless after that cannot stand independently with God.
  - term: القِدَم
    definition: from q-d-m, priorness or ancientness -> primordial precedence -> missed by “timelessness,”
      which can hide its role as a conceptual claim of priority denied separate reality.
  - term: لا شريك له
    definition: sh-r-k, sharing or partnership -> no co-holder of reality -> stronger than denying rival
      worship; it excludes any independently subsisting associate.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last” similarly denies that temporal priority and posteriority
      limit God.
    divergence: The verse states divine names; this passage draws the more daring ontological conclusion
      that beginninglessness and endlessness themselves have no existence apart from Him.
  - citation: Qur’an 112:1–4
    resonance: The insistence that God has no partner echoes the uncompromising divine uniqueness of al-Ikhlāṣ.
    divergence: The sūrah does not explicitly identify all apparent realities with God’s existence, whereas
      this text presses toward that waḥdat al-wujūd formulation.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The treatise frames knowledge of the self as the route by which dependence and non-self-subsistence
      are disclosed.
    divergence: The saying’s status and interpretation are debated; this text gives it a highly metaphysical,
      nondual reading rather than an ethical or devotional one.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you feel pressed by time—by what is overdue, finished, or still to come—pause for
    one minute and say inwardly: “These horizons do not stand by themselves.” Then do the next necessary
    act without treating urgency as an independent power.'
