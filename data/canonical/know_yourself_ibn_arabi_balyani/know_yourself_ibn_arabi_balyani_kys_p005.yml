- kind: commentary
  label: Pratibha Commentary
  body: 'The passage makes an uncompromising claim: God cannot become an object standing before a human
    knower. Every ordinary faculty—learned knowledge, reason, understanding, imaginative representation,
    sensory sight, inward vision, and perception—presumes a distinction between one who grasps and a thing
    grasped. For this text’s waḥdat al-wujūd logic, that distinction cannot finally obtain in relation
    to the Real. God alone is both the knower and the known; “by Himself” excludes any independent cognitive
    standpoint. Self-knowledge thus becomes knowledge of the Lord not because an individual ego possesses
    divinity, but because the supposedly separate self is disclosed as having no autonomous existence
    from which to know God as an external other. The contested move is severe. It turns apophatic humility
    into an ontological assertion: not merely that finite minds fail to comprehend God, but that no creaturely
    act of seeing, knowing, or perceiving is ultimately other than God’s self-disclosure. Critics can
    hear pantheism or the erasure of moral and devotional creaturehood; defenders hear a safeguard against
    making God one being among others. The text nevertheless refuses crude incarnation or fusion: it denies
    that God enters a thing or that a thing enters God.'
- kind: key_terms
  label: Key Terms
  items:
  - term: العلم
    definition: ʿilm, from ʿ-l-m, “to know” or “mark distinctly” -> discursive or acquired knowing is
      set aside -> more than the default gloss “knowledge,” it names a mode that separates subject from
      object.
  - term: الوهم
    definition: 'wahm, from w-h-m, “to suppose” or “imagine” -> the faculty that frames or conjectures
      an object -> missed by “conjecture” alone: it includes the mind’s subtle production of a graspable
      divine image.'
  - term: العين الباطن
    definition: al-ʿayn al-bāṭin, “the inward eye” -> even interior contemplative vision does not possess
      God -> not simply mystical intuition, but a faculty still liable to make God into a seen object.
  - term: بنفسه
    definition: 'bi-nafsihi, “by Himself” -> God knows Himself through no mediating faculty -> more than
      reflexive emphasis: it grounds the passage’s denial of an independent knower beside God.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 6:103
    resonance: “Eyes do not apprehend Him, while He apprehends the eyes” closely supports the denial that
      ordinary sight contains God.
    divergence: The Qur’anic verse maintains divine incomparability; this passage extends the point to
      say that God alone sees and knows Himself.
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural language
      through which the treatise describes the Real’s all-encompassing presence.
    divergence: The passage presses those names toward a strong nondual account of knowing, rather than
      leaving a clear Creator-creature distinction in view.
  - citation: Hadith qudsi, “My servant continues to draw near to Me ... I become his hearing ... and
      his sight” (Ṣaḥīḥ al-Bukhārī)
    resonance: The hadith imagines hearing and sight as divinely sustained in the servant, resonating
      with the text’s displacement of autonomous human faculties.
    divergence: The hadith retains the relation of servant and Lord; this passage risks collapsing that
      relation into God’s sole self-knowing.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you catch yourself forming a confident mental picture of God, pause for one minute,
    release the picture, and say inwardly: “You are not an object before my mind.”'
