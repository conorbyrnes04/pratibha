source_excerpt: It is in this way that you should know Him and not through theoretical knowledge, reason,
  understanding or conjecture, nor with the senses, the external eye or interior sight or perception.
  No one sees Him except Himself, no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: 'Understand this, then, so that you do not fall into the error of those who believe
  in the incarnation of God: He is not in a thing, nor is a thing in Him, neither entering in nor going
  forth. You must know Him after this fashion — not by knowledge (''ilm), nor by intellect, nor by understanding,
  nor by imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception.
  None sees Him but Himself; none perceives Him but Himself. By Himself He sees Himself, and by Himself
  He knows Himself. None sees Him other than He, and none perceives Him other than He. His veil is but
  a part of His oneness; nothing veils Him other than He. His veil is only the concealment of His existence
  in His oneness, without any quality. None sees Him other than He — no sent prophet, nor saint made perfect,
  nor angel brought near knows Him. His Prophet is He, and His sending is He, and His word is He. He sent
  Himself, with Himself, to Himself. There was no mediator, nor any means, other than He.'
commentary: 'This passage presses the heart of waḥdat al-wujūd (the oneness of being) to its sharpest
  point: because there is only one Reality, the knowing of God can only ever be God''s knowing of Himself.
  Every human faculty the author lists — discursive knowledge, reason, imagination, the outer and inner
  senses — is disqualified not because it is too weak, but because each faculty implies a knower separate
  from the known. Where there is genuinely only One, no second subject exists to do the knowing. Hence
  the striking chain: seer and seen, sender and sent, are collapsed into the single divine Self. The ''veil''
  is redefined not as a barrier God places between Himself and us, but as an aspect of His very oneness
  — He is hidden by nothing other than His own singularity. The critique of incarnationism (ḥulūl) and
  of ''entering'' or ''going forth'' guards against the crude misreading that would make creature and
  Creator two things that mingle. The teaching is subtler: there was never a genuine two to begin with.
  To ''know Him after this fashion'' is therefore not to acquire an object of knowledge but to recognize
  that the very act of knowing already belongs to Him alone.


  Key Terms


  **ma''rifa** — Direct, unmediated gnosis or realized knowledge of God, contrasted here with discursive
  ''ilm; ultimately it is God''s knowledge of Himself, not the creature''s knowledge of an external object.

  **ḥulūl** — ''Indwelling'' or incarnation — the doctrine that God enters into or descends into created
  things. The author rejects it as an error that presupposes two separate realities.

  **ḥijāb** — The ''veil'' — reinterpreted not as something external concealing God, but as an aspect
  of His own oneness; nothing veils Him except He Himself.'
insight: ''
practice: Withdraw your hand from every phrase you are about to say — 'I see,' 'I know,' 'I understand'
  — and let the sentence finish itself as 'He sees, He knows,' surrendering the seer back to the One who
  is seeing. Do this at your desk, in conversation, while looking out a window, until the little claimant
  behind your eyes quietly forgets to step forward.
sanskrit_devanagari: لا هو في شيء، ولا شيء فيه، لا داخلاً ولا خارجًا. ينبغي أن نعرفه بهذه الصفة، لا بالعلم
  ولا بالعقل، ولا بالفهم ولا بالوهم ولا بالعين، ولا بالحسِّ الظاهر ولا بالعين الباطن ولا بالإدراك. لا
  يراه إلا هو، ولا يدركه إلا هو، ولا يعلمه إلا هو بنفسه، وبنفسه يعرف نفسه؛ يرى نفسه، لا يراه أحدٌ غيره.
sanskrit_iast: lā huwa fī shayʾ, wa-lā shayʾ fīhi, lā dākhilan wa-lā khārijan. yanbaghī an naʿrifahu bihādhihi
  ṣifah, lā bi-l-ʿilm wa-lā bi-l-ʿaql, wa-lā bi-l-fahm wa-lā bi-l-wahm wa-lā bi-l-ʿayn, wa-lā bi-l-ḥiss
  al-ẓāhir wa-lā bi-l-ʿayn al-bāṭin wa-lā bi-l-idrāk. lā yarāhu illā huwa, wa-lā yudrikuhu illā huwa,
  wa-lā yaʿlamuhu illā huwa binafsihi, wa-binafsihi yaʿrifu nafsahu; yarā nafsahu, lā yarāhu aḥadun ghayruhu.
