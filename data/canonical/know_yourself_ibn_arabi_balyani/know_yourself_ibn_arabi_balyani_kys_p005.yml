unit_id: know_yourself_ibn_arabi_balyani.kys_p005
unit_label: Only God Knows God
title: Only God Knows God
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
- way
source_excerpt: It is in this way that you should know Him and not through theoretical knowledge, reason,
  understanding or conjecture, nor with the senses, the external eye or interior sight or perception.
  No one sees Him except Himself, no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: It is necessary that thou know Him after this fashion, not by knowledge, nor by intellect,
  nor by understanding, nor by imagination, nor by sense, nor by the outward eye, nor by the inward eye,
  nor by perception. None sees Him save Himself; none perceives Him save Himself; none knows Him save
  Himself by Himself.
commentary: 'The passage makes an uncompromising claim: God cannot become an object standing before a
  human knower. Every ordinary faculty—learned knowledge, reason, understanding, imaginative representation,
  sensory sight, inward vision, and perception—presumes a distinction between one who grasps and a thing
  grasped. For this text’s waḥdat al-wujūd logic, that distinction cannot finally obtain in relation to
  the Real. God alone is both the knower and the known; “by Himself” excludes any independent cognitive
  standpoint. Self-knowledge thus becomes knowledge of the Lord not because an individual ego possesses
  divinity, but because the supposedly separate self is disclosed as having no autonomous existence from
  which to know God as an external other. The contested move is severe. It turns apophatic humility into
  an ontological assertion: not merely that finite minds fail to comprehend God, but that no creaturely
  act of seeing, knowing, or perceiving is ultimately other than God’s self-disclosure. Critics can hear
  pantheism or the erasure of moral and devotional creaturehood; defenders hear a safeguard against making
  God one being among others. The text nevertheless refuses crude incarnation or fusion: it denies that
  God enters a thing or that a thing enters God.'
insight: ''
practice: 'Today, when you catch yourself forming a confident mental picture of God, pause for one minute,
  release the picture, and say inwardly: “You are not an object before my mind.”'
sanskrit_devanagari: ينبغي أن نعرفه بهذه الصفة، لا بالعلم ولا بالعقل، ولا بالفهم ولا بالوهم ولا بالعين،
  ولا بالحسِّ الظاهر ولا بالعين الباطن ولا بالإدراك. لا يراه إلا هو، ولا يدركه إلا هو، ولا يعلمه إلا هو
  بنفسه
