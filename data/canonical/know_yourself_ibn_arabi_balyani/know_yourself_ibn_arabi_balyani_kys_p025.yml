- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is deliberately sharper than a call to mystical self-erasure. To know oneself is to
    recognize that one’s supposed independent existence has never stood alongside God’s existence. On
    this account, self-knowledge is knowledge of the Lord because the self cannot be an autonomous second
    reality. The text therefore contests a familiar Sufi sequencing: first the servant is annihilated
    (fanāʾ), then even awareness of annihilation disappears, and only then God is known. Its objection
    is logical as much as devotional: annihilation can apply only to something genuinely existent, and
    granting such independent existence to the self already installs an “other” beside God. In the idiom
    of waḥdat al-wujūd, the issue is not that a real creature travels across a gap to unite with a real
    God; rather, the imagined separateness that makes such a journey seem necessary is exposed. This is
    the contested move. Critics can hear in it an erasure of creaturely reality, moral agency, and the
    Creator–creation distinction; defenders hear an uncompromising defense of divine oneness, denying
    independence rather than denying experienced multiplicity. The passage’s practical force is epistemic:
    do not seek to become nothing as though you were first something apart. Examine the claim of apartness
    itself.'
- kind: key_terms
  label: Key Terms
  items:
  - term: معرفة
    definition: ʿ-r-f, to recognize or know through acquaintance -> knowledge of God disclosed through
      knowing the self -> more than information or doctrinal assent.
  - term: الوجود
    definition: w-j-d, finding, being, existence -> the supposedly independent existence whose status
      is questioned -> not merely the everyday fact that bodies and events appear.
  - term: فناء
    definition: f-n-y, to perish or pass away -> the annihilation of existence, followed by ‘annihilation
      of annihilation’ -> not simply ascetic renunciation or physical death.
  - term: العُرَّاف
    definition: from ʿ-r-f, those characterized by gnosis -> the knowers whom the author nevertheless
      critiques -> not every religious scholar, nor necessarily a claim that all mystics agree.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 57:3
    resonance: God is named ‘the First and the Last, the Outward and the Inward,’ supporting the treatise’s
      refusal to locate another independent reality before, after, or beside Him.
    divergence: The Qur'anic verse does not itself state that creatures have no existence or reject fanāʾ
      as a condition of knowledge.
  - citation: 'Hadith: ‘Whoever knows himself knows his Lord’'
    resonance: 'The treatise takes this maxim as its governing warrant: self-knowledge and knowledge of
      God are inseparable.'
    divergence: Its transmission as a Prophetic hadith is disputed, and the radical metaphysical interpretation
      here goes beyond the maxim’s bare wording.
  - citation: Qur'an 28:88
    resonance: ‘Everything is perishing except His Face’ is later read in the treatise as denying independent
      existence to all else.
    divergence: The verse can also be read as affirming the transience of created things, without identifying
      their existence directly with God’s existence.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say or think “my existence,” pause once and ask: what exactly in this experience
    claims to exist independently of God?'
