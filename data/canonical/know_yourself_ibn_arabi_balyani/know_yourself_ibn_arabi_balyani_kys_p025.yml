- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: The critique of ''ceasing to be'' (fanāʾ) is therefore surprising and precise. Trap:
      self-erasure as quietism or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This is the heart of waḥdat al-wujūd, the oneness of being:
      there is only one true existence, God''s existence, and what we take to be our own separate being
      is… Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and world'
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This is the heart of waḥdat al-wujūd, the oneness of being: there is
      only one true existence, God''s existence, and what we take to be our own separate being is… Trap:
      pantheist collapse that erases servant/Lord distinction'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Here: Direct experiential knowledge or gnosis of God; here identified with
      true self-knowledge — knowing that one has no existence apart from God. Trap: equating mystical
      knowing with accumulated doctrine'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: That hidden affirmation is itself the polytheism (shirk) the seeker meant to escape. Trap:
      narrowing to idol-worship while missing subtle self-ascription of agency'
  layer_provenance: editorial-enriched
