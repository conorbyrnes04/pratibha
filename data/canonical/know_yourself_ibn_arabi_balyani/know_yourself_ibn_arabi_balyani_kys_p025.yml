title: Self-Knowledge as the Gateway to Divine Knowledge
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- knowledge
- way
source_excerpt: If you know your existence in this way, then you know God, and if not, then not. Most
  of those who claim to know God make the knowledge of God dependent on the passing away of existence
  and on the passing away of that passing away.
translation_literal: If you know your existence in this way, then you know God; and if not, then not.
  Most of those who claim to know God make the ceasing of existence — and the ceasing of that ceasing
  — a condition for attaining the knowledge of God. But this is an error and a plain oversight. For the
  knowledge of God does not presuppose the ceasing of existence, nor the ceasing of that ceasing. Things
  have no existence, and what does not exist cannot cease to exist. To speak of ceasing to be implies
  first positing an existence, and that is polytheism. So if you know yourself without any existence or
  ceasing to be, then you know God; and if not, then not. To make the knowledge of God conditional upon
  the ceasing of existence, and the ceasing of that ceasing, involves an assertion of polytheism. For
  the Prophet (upon whom be peace) said, 'Whoever knows himself,' and did not say, 'Whoever makes himself
  cease to be.' To affirm something makes its extinction impossible; and that whose affirmation is not
  allowable — its extinction is not allowable either. Your existence is nothing, and nothing cannot be
  added to something, whether perishing or unperishing, existent or non-existent. The Prophet points to
  the fact that you are non-existent now, just as you were non-existent before creation.
commentary: 'This passage strikes at a subtle spiritual error that the treatise regards as fatal: the
  assumption that the seeker must first exist as a separate self and then annihilate that self in order
  to reach God. Balyānī (writing in the voice long ascribed to Ibn ʿArabī) argues that self-knowledge
  is not the destruction of an independent self but the recognition that no such independent self ever
  existed. This is the heart of waḥdat al-wujūd, the oneness of being: there is only one true existence,
  God''s existence, and what we take to be our own separate being is, in reality, nothing. The critique
  of ''ceasing to be'' (fanāʾ) is therefore surprising and precise. To say ''I must annihilate my existence''
  secretly affirms that my existence is real and my own — otherwise there would be nothing to annihilate.
  That hidden affirmation is itself the polytheism (shirk) the seeker meant to escape. Even worse, some
  speak of ''the ceasing of the ceasing,'' piling a second affirmation upon the first. The Prophet''s
  saying is decisive: he said ''whoever knows himself,'' not ''whoever annihilates himself.'' Knowledge,
  not destruction, is the path. Just as coming to know a fact does not create the fact but merely removes
  ignorance of it, so realizing that you are nothing apart from God removes an illusion without altering
  anything real. You were non-existent before creation and remain so now; only your ignorance of this
  needs to pass away, not your ''self.''


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self in God — the classical Sufi ideal that this
  treatise critiques, arguing that to seek to annihilate one''s existence secretly presupposes that such
  existence is real.

  **maʿrifa** — Direct experiential knowledge or gnosis of God; here identified with true self-knowledge
  — knowing that one has no existence apart from God.

  **shirk** — Polytheism or associating a partner with God; the treatise extends this to any affirmation
  of an independent existence alongside God''s existence, even one''s own self.'
insight: ''
practice: 'Ask, in the middle of any ordinary act — lifting a cup, opening a door — ''Who is doing this?''
  and refuse both answers: neither an ''I'' that must be destroyed, nor a self that clings; let the question
  dissolve the doer without ever having granted him a separate existence to lose.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
