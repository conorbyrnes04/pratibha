source_excerpt: You are Him and He is you, without any of these imperfections. If you know your existence
  in this way, then you know God, and if not, then not. Most of those who claim to know God make the knowledge
  of God dependent on the passing away of existence and on the passing away of that passing away.
translation_literal: 'The Prophet (peace be upon him) indicates by this that you are not you: you are
  He, without you—not He entering into you, nor you entering into Him, nor He proceeding forth from you,
  nor you proceeding forth from Him. And it is not meant by this that you are something that exists, or
  that your attributes are something that exists; rather, it is meant that you never were, nor ever will
  be, whether by yourself, or through Him, or in Him, or along with Him. You are neither ceasing to be
  nor still existing. You are He, without any of these limitations. Then if you know your existence in
  this way, then you know God; and if not, then not. And most of those who know God make the ceasing of
  existence—and the ceasing of that ceasing—a condition for attaining the knowledge of God. But that is
  an error and a clear oversight. For the knowledge of God does not presuppose the ceasing of existence,
  nor the ceasing of that ceasing. For things have no existence, and what does not exist cannot cease
  to exist. For ceasing to be implies the positing of existence, and that is polytheism. Then if you know
  yourself without existence or ceasing to be, then you know God; and if not, then not.'
commentary: 'This passage strikes at the heart of the treatise''s teaching on waḥdat al-wujūd (the oneness
  of being). The author corrects a subtle but pervasive error among spiritual seekers: the belief that
  one must first exist as a separate self and then annihilate that self (fanāʾ) in order to reach God.
  Against this, he insists that the self never had any independent existence to begin with. To require
  a ''passing away'' is to secretly affirm that there was a real, standing self to pass away—and that
  affirmation is itself a form of hidden polytheism (shirk), because it sets up a second existence alongside
  God''s single reality. The point is not that you must destroy yourself, but that you must recognize
  you were never a self at all: ''You are He, without you.'' Self-knowledge (maʿrifa), then, is not the
  achievement of extinction but the removal of ignorance. Nothing is added or subtracted from reality;
  only a false assumption about a separate ''you'' dissolves. The subtlety is that even ''the passing
  away of the passing away''—a refined stage in Sufi vocabulary—still smuggles in the assumption of a
  self, and so it too is rejected. True tawḥīd leaves no residue of a second existence, not even in the
  mode of something that once was and then ceased.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the ego-self in God; the author critiques treating it
  as a required act, since it presupposes a real self that must first exist to be annihilated.

  **maʿrifa** — Direct experiential knowledge of God, here identified with true self-knowledge: to know
  that you are not a separate existence but ''He, without you.''

  **shirk** — Polytheism or association; here, the subtle error of affirming any independent existence
  alongside God—even the existence one intends to annihilate.'
insight: ''
practice: 'Sit quietly and turn attention to the sense of ''I'' that seems to observe your breath and
  thoughts. Instead of trying to still or erase this ''I'' (which subtly reinforces it as something real),
  gently ask: ''What is it that never came into being in the first place?'' Do not try to annihilate the
  self; simply notice that the self you were about to fight against cannot be located as a standing, independent
  thing. Rest in that not-finding, without effort, allowing the search itself—rather than any destruction—to
  reveal that there was never a separate existence to defend or dissolve.'
