- kind: commentary
  label: Pratibha Commentary
  body: 'The passage presses its most contested claim: knowledge of the self is knowledge of the Lord
    because the self has no independent existence standing beside God. “Thou art He” does not mean that
    an individual creature becomes God, that God enters the creature, or that two beings fuse. Those are
    precisely the spatial and causal “limitations” the treatise refuses. Its waḥdat al-wujūd argument
    is instead that only divine Being is truly real; the apparently separate “I” is not a second existent
    needing to be merged back into the One. On this basis it rejects a familiar Sufi sequence: first fanāʾ,
    the passing-away of the self, then fanāʾ al-fanāʾ, the passing-away even of that experience. The author
    calls this mistaken because extinction presumes that something independently exists to be extinguished.
    Self-knowledge here is therefore not the production of a mystical state but the removal of an error
    about ownership of existence. This is the risky metaphysical move of the Risāla: it safeguards absolute
    divine oneness by denying real otherness, while its language can sound like an identity claim. Read
    charitably, the claim concerns the source and reality of being, not the ego’s possession of divinity.'
- kind: key_terms
  label: Key Terms
  items:
  - term: وجود
    definition: 'w-j-d, “to find, be present” -> the existence one takes to be one’s own -> more than
      the default gloss “existence”: it is the disputed claim to independent reality.'
  - term: فناء
    definition: 'f-n-y, “to pass away, perish” -> the annihilation of supposed selfhood invoked by many
      mystics -> more than simple destruction: a technical spiritual account the passage explicitly challenges.'
  - term: فناء الفناء
    definition: '“the passing-away of passing-away” -> the removal of awareness of one’s own annihilation
      -> more than an intensified fanāʾ: it marks a debated second-order mystical attainment.'
  - term: العُرَّاف
    definition: 'ʿ-r-f, “to know, recognize” -> those reputed to know God -> more pointed than “gnostics”:
      the phrase permits the author to criticize established mystical authorities.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supports the treatise’s refusal
      to place God within ordinary before-and-after or inside-and-outside relations.
    divergence: The verse proclaims divine names; this passage draws the stronger ontological conclusion
      that no independent self exists beside God.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The treatise treats self-knowledge as the direct threshold of knowledge of God.
    divergence: Though famous in Sufi writing, this report is not generally established as an authenticated
      Prophetic hadith; the treatise gives it major doctrinal weight.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my life” or “my achievement,” pause once and silently ask: “What in this
    moment is truly mine by itself?” Then let the question loosen one act of self-possession without trying
    to erase yourself.'
