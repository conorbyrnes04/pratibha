source_excerpt: You are Him and He is you, without any of these imperfections. If you know your existence in this way, then
  you know God, and if not, then not. Most of those who claim to know God make the knowledge of God dependent on the passing
  away of existence and on the passing away of that passing away.
translation_literal: You are Him and He is you, without any of these imperfections. If you know your existence in this way,
  then you know God, and if not, then not. Most of those who claim to know God make the knowledge of God dependent on the
  passing away of existence and on the passing away of that passing away.
