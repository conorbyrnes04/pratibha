work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p024
unit_label: Self-Knowledge Does Not Require Annihilation
title: Self-Knowledge Does Not Require Annihilation
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- knowledge
- way
source_excerpt: You are Him and He is you, without any of these imperfections. If you know your existence
  in this way, then you know God, and if not, then not. Most of those who claim to know God make the knowledge
  of God dependent on the passing away of existence and on the passing away of that passing away.
translation_literal: 'Thou art He, without one of these limitations. Then if thou know thine existence
  thus, then thou knowest God; and if not, then not.


  And most of “those who know God” make a ceasing of existence and the ceasing of that ceasing a condition
  of attaining the knowledge of God, and that is an error and a clear oversight.'
commentary: 'The passage presses its most contested claim: knowledge of the self is knowledge of the Lord
  because the self has no independent existence standing beside God. “Thou art He” does not mean that
  an individual creature becomes God, that God enters the creature, or that two beings fuse. Those are
  precisely the spatial and causal “limitations” the treatise refuses. Its waḥdat al-wujūd argument is
  instead that only divine Being is truly real; the apparently separate “I” is not a second existent needing
  to be merged back into the One. On this basis it rejects a familiar Sufi sequence: first fanāʾ, the
  passing-away of the self, then fanāʾ al-fanāʾ, the passing-away even of that experience. The author
  calls this mistaken because extinction presumes that something independently exists to be extinguished.
  Self-knowledge here is therefore not the production of a mystical state but the removal of an error
  about ownership of existence. This is the risky metaphysical move of the Risāla: it safeguards absolute
  divine oneness by denying real otherness, while its language can sound like an identity claim. Read
  charitably, the claim concerns the source and reality of being, not the ego’s possession of divinity.'
insight: ''
practice: 'Today, when you say “my life” or “my achievement,” pause once and silently ask: “What in this
  moment is truly mine by itself?” Then let the question loosen one act of self-possession without trying
  to erase yourself.'
sanskrit_devanagari: 'أنت هو، وهو أنت، بلا علَّة من هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله.
  – وإلا فلا.


  وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء'
