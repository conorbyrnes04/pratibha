- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: Knowledge of God Requires No Annihilation Pearl #26 Most of those who claim to know God
      make the knowledge of God dependent on the passing away of existence an… Trap: self-erasure as quietism
      or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: Knowledge of God Requires No Annihilation Pearl #26 Most
      of those who claim to know God make the knowledge of God dependent on the passing away of existence
      an… Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and world'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Here: Let that failed effort collapse into recognition: there is no ''you''
      here to be extinguished, only the one existence looking through your eyes. Trap: equating mystical
      knowing with accumulated doctrine'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments
    resonance: 'Both passages diagnose a false knowledge that masquerades as true knowledge: Heraclitus
      observes that people lack understanding of daily encounters yet believe themselves knowledgeable;
      Ibn Arabi identifies claimants to God-knowledge who mistake a particular epistemic procedure (annihilation
      of existence) for actual knowledge of God. Each text exposes a structural confusion between the
      appearance of knowing and genuine knowing.'
    divergence: Heraclitus locates the error in inattention to the universal Logos accessible through
      listening; Ibn Arabi locates it in a methodological trap where practitioners confuse the dissolution
      of self with access to divine knowledge, requiring a different kind of recognition.
    passage_id: heraclitus_fragments.hfr_p005
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
    resonance: 'Both texts point toward a knowledge that transcends ordinary cognitive categories by negating
      the subject-object distinction: the Upaniṣad teaches that knowing the unknowable requires understanding
      essential oneness; Ibn Arabi suggests that true God-knowledge requires the passing away of the knower''s
      existence itself, dissolving the duality that sustains conventional knowing.'
    divergence: The Upaniṣad frames this as a positive instruction in non-dual perception; Ibn Arabi frames
