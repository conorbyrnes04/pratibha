unit_label: Knowing God Does Not Require Annihilation
title: Knowing God Does Not Require Annihilation
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- knowledge
source_excerpt: Most of those who claim to know God make the knowledge of God dependent on the passing
  away of existence and on the passing away of that passing away. That is clearly an error and misconception.
translation_literal: And most of those who know God make the passing away of existence, and the passing
  away of that passing away, a condition for attaining the knowledge of God; and that is an error and
  a clear oversight.
commentary: 'The claim is polemical: genuine knowledge of God does not begin by first producing a spiritual
  event called fanāʾ, “passing away,” and then cancelling even that event in fanāʾ al-fanāʾ. Within this
  radical account of waḥdat al-wujūd, such a requirement already grants the self or world a positive existence
  that can undergo extinction. The author instead presses a more uncompromising argument: what is imagined
  as an independent existent beside God never possessed that status in the first place. Self-knowledge
  is therefore not the discovery of a substantial ego which is later destroyed, but the recognition that
  one’s supposed independent reality is a misapprehension. To know the self in this sense is to know the
  Lord as the sole reality. The contested move is obvious. It shifts from denying independent existence—a
  familiar theological assertion of creaturely dependence—to language that can seem to deny created reality
  altogether, and it dismisses major Sufi disciplines of annihilation as conceptual error. Defenders may
  read this as a correction to reifying mystical states; critics see it as collapsing the Creator–creature
  distinction and emptying moral and devotional transformation of its meaning.'
insight: ''
practice: 'Today, when you catch yourself treating your identity, achievement, or fear as self-subsisting,
  pause and say: “This has no independence from God”; then perform one ordinary act of care without making
  it proof of a separate self.'
