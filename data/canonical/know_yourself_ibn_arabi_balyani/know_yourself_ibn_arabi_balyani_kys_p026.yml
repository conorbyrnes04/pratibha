abhyasa: 'Look at your own hand and try, sincerely, to annihilate it into God — then notice the absurdity:
  you cannot erase what was never a separate thing to begin with. Let that failed effort collapse into
  recognition: there is no ''you'' here to be extinguished, only the one existence looking through your
  eyes.'
