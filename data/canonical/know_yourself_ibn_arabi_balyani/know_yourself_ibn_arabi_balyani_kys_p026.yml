- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is polemical: genuine knowledge of God does not begin by first producing a spiritual
    event called fanāʾ, “passing away,” and then cancelling even that event in fanāʾ al-fanāʾ. Within
    this radical account of waḥdat al-wujūd, such a requirement already grants the self or world a positive
    existence that can undergo extinction. The author instead presses a more uncompromising argument:
    what is imagined as an independent existent beside God never possessed that status in the first place.
    Self-knowledge is therefore not the discovery of a substantial ego which is later destroyed, but the
    recognition that one’s supposed independent reality is a misapprehension. To know the self in this
    sense is to know the Lord as the sole reality. The contested move is obvious. It shifts from denying
    independent existence—a familiar theological assertion of creaturely dependence—to language that can
    seem to deny created reality altogether, and it dismisses major Sufi disciplines of annihilation as
    conceptual error. Defenders may read this as a correction to reifying mystical states; critics see
    it as collapsing the Creator–creature distinction and emptying moral and devotional transformation
    of its meaning.'
- kind: key_terms
  label: Key Terms
  items:
  - term: العُرَّاف
    definition: from ʿ-r-f, “to know, recognize” -> those reputed to possess maʿrifa, gnosis -> not merely
      “mystics,” but claimants to a discerning knowledge of God.
  - term: معرفة الله
    definition: from ʿ-r-f, recognition or intimate knowing -> knowledge of God sought through knowing
      the self -> more participatory and existential than the default gloss “information about God.”
  - term: فناء الوجود
    definition: fanāʾ, passing away or perishing, plus wujūd, existence -> annihilation of purported individual
      existence -> not simply emotional selflessness or the extinction of bodily life.
  - term: فناء الفناء
    definition: “the passing away of passing away” -> the removal of awareness of one’s own annihilation
      -> not a higher technique here, but the second premise the author rejects.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Hadith: “Whoso knows himself knows his Lord” (man ʿarafa nafsahu ʿarafa rabbahu)'
    resonance: The treatise treats self-knowledge as the direct route to knowledge of God and interprets
      the self’s apparent independence as the central veil.
    divergence: The saying is widely circulated in Sufi literature but is not generally accepted as a
      sound prophetic hadith; this passage also gives it an unusually uncompromising ontological reading.
  - citation: 'Qur''an 28:88: “Everything is perishing except His Face”'
    resonance: The later argument of the treatise reads perishing as evidence that no independent reality
      endures beside God.
    divergence: Many exegetes retain the real, created existence of things while affirming their contingency
      and eventual passing; the treatise pushes toward a denial of independent being from the outset.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you catch yourself treating your identity, achievement, or fear as self-subsisting,
    pause and say: “This has no independence from God”; then perform one ordinary act of care without
    making it proof of a separate self.'
