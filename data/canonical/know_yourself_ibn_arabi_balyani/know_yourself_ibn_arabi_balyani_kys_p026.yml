source_excerpt: Most of those who claim to know God make the knowledge of God dependent on the passing
  away of existence and on the passing away of that passing away. That is clearly an error and misconception.
translation_literal: 'Most of those who know God make the ceasing of existence, and the ceasing of that
  ceasing, a condition for attaining the knowledge of God — and that is an error and a clear oversight.
  For the knowledge of God does not presuppose the ceasing of existence, nor the ceasing of that ceasing.
  For things have no existence, and what does not exist cannot cease to exist. For ceasing to be implies
  first positing an existence, and that is polytheism. So if you know yourself without existence or ceasing
  to be, then you know God; and if not, then not.


  In making the knowledge of God conditional upon the ceasing of existence and the ceasing of that ceasing,
  there is involved an assertion of polytheism. For the Prophet (upon whom be peace) said, ''Whoso knows
  himself,'' and did not say, ''Whoso makes himself to cease to be.'' For to affirm something makes its
  extinction impossible; and, on the other hand, that whose affirmation is not allowable — its extinction
  is likewise not allowable. Your existence is nothing, and nothing cannot be added to something, whether
  perishing or unperishing, existent or non-existent. The Prophet points to the fact that you are non-existent
  now, just as you were non-existent before the Creation.'
commentary: 'This passage strikes at a subtle spiritual error that Balyānī sees infecting even advanced
  seekers: the belief that the summit of the path is fanāʾ, the annihilation of the self, followed even
  by the annihilation of that annihilation. The author''s argument is startlingly logical. To ''annihilate''
  the self, you must first grant that the self genuinely exists as something apart from God. But from
  the standpoint of waḥdat al-wujūd — the oneness of being — nothing exists except God''s own existence.
  What has no independent reality cannot be made to pass away; you cannot annihilate a shadow. Therefore
  the very project of self-annihilation smuggles in a hidden dualism, positing ''you'' alongside God —
  which is precisely shirk (associating a partner with God), the one sin Islam names unforgivable.


  The hinge of the teaching is the Prophet''s saying: ''Whoso knows himself knows his Lord.'' The verb
  is *knows*, not *annihilates*. Liberation comes not by destroying a real self but by the removal of
  ignorance concerning a self that was never independently real. The author''s later image makes this
  vivid: a man who thinks his name is Muhammad but discovers it is really Mahmud loses nothing in existence
  — only a false name drops away. So too, in true self-knowledge, nothing that exists is destroyed; only
  a misidentification dissolves. You are ''non-existent now as you were before the Creation'' — meaning
  your reality was always and only God''s reality, and realizing this changes nothing in being, only everything
  in understanding.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self in God, often taken as the goal of the Sufi
  path; Balyānī critiques treating it as a precondition for knowing God, since it presupposes a real,
  separate self that must be destroyed.

  **maʿrifa** — Experiential knowledge or gnosis of God; here shown to arise not through annihilating
  existence but through the removal of ignorance about one''s true reality.

  **shirk** — Associating a partner with God; the author argues that positing a self with genuine independent
  existence — even in order to annihilate it — is itself a hidden form of shirk.'
insight: ''
practice: 'Look at your own hand and try, sincerely, to annihilate it into God — then notice the absurdity:
  you cannot erase what was never a separate thing to begin with. Let that failed effort collapse into
  recognition: there is no ''you'' here to be extinguished, only the one existence looking through your
  eyes.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
