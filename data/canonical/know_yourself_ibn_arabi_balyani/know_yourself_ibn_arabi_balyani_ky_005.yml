- kind: key_terms
  label: Key Terms
  items:
  - term: ḥijāb
    definition: 'from ḥ-j-b, “to screen, bar, or seclude” -> the veil is God’s own oneness rather than
      a thing between God and creation -> more than the default gloss “veil”: it names the impossibility
      of objectifying the Absolute.'
  - term: aḥadiyya
    definition: from aḥad, “one, uniquely one” -> divine oneness conceals divine existence from relational,
      qualified knowledge -> not merely numerical unity, which would make God one member of a class.
  - term: wujūd
    definition: from w-j-d, “to find, be present, exist” -> God’s existence is said to be concealed in
      divine oneness -> not simply “being” as an abstract concept, but the reality claimed as truly present.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 24:35
    resonance: The Light Verse joins divine transcendence to imagery of disclosure, making light a traditional
      language for divine manifestation and obscurity.
    divergence: This passage does not identify the veil with created light; it identifies it with divine
      oneness beyond all qualification.
  - citation: Qur’an 42:11
    resonance: “Nothing is like Him” safeguards the incomparability implied by knowing God “without any
      quality.”
    divergence: The treatise’s language of non-otherness is more metaphysically daring than the Qur’anic
      formula itself and has therefore been disputed.
  - citation: Hadith qudsi, “My servant continues to draw near to Me…”
    resonance: It frames nearness to God as a transformation of perception and action rather than mere
      information.
    divergence: The hadith preserves servant and Lord as relational terms; this treatise tends to interpret
      such relation through the unreality of independent otherness.
