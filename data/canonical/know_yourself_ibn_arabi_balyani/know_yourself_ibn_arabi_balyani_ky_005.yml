section: Risālat al-Aḥadiyya, on the veil
sanskrit_devanagari: al-ḥijābu nūrun, wa-anta maḥjūbun bi-l-nūr.
sanskrit_iast: ''
translation_literal: The veil is light, and you are veiled from Him by the light.
commentary: 'This compressed saying overturns the ordinary religious image of a dark barrier separating creature from God.
  The obstacle is not simply ignorance, sin, or absence of illumination. It is light itself: every intelligible disclosure,
  spiritual state, vision, doctrine, and sense of “I know” can become a veil when it is taken as something possessed by a
  separate self. In the non-dual idiom associated with the Risālat al-Aḥadiyya, the Real is not hidden by distance; rather,
  the seeker’s own fixation on appearances—including luminous appearances—constitutes concealment. “Light” therefore has a
  double valence. It is the medium in which things are manifest, yet as an object distinguished from the Real it remains a
  limit. The saying does not reject illumination; it rejects stopping at it. The final veil is the knower’s claim to be a
  knower standing before a known God.


  Key Terms


  **al-ḥijāb** — the veil or covering that prevents direct vision.

  **nūr** — light, including manifest illumination and intelligible disclosure.

  **maḥjūb** — veiled or prevented from direct access.


  Cross-Tradition Resonances


  **Pseudo-Dionysius, Mystical Theology 1.3:** Dionysius likewise teaches that approaching the divine requires passing beyond
  every light of knowledge into unknowing. Divergence: Dionysius emphasizes a supra-luminous divine darkness, whereas this
  saying paradoxically names light itself as the operative veil.

  **Kena Upaniṣad 2.3–4:** The Upaniṣad denies that Brahman is grasped by one who thinks it known, paralleling the warning
  that possessed spiritual knowledge obscures the Real. Divergence: The Upaniṣad frames the issue primarily as Brahman’s transcendence
  of cognition, while the Arabic saying focuses on light as a veil over the perceiving self.

  **Plotinus, Enneads VI.9.11:** Plotinus holds that union with the One surpasses the knower-known division, so reflective
  awareness can impede the simplicity of vision. Divergence: Plotinus describes ascent beyond multiplicity through intellectual
  purification, whereas the saying gives no graded metaphysical ascent and treats even illumination as potentially obstructive.'
practice: 'Sit quietly for ten minutes. Notice any image, feeling, insight, or inward brightness that arises. Instead of pursuing
  or rejecting it, ask: “To whom does this appear?” Rest without making the experience into an object possessed by a separate
  observer.'
