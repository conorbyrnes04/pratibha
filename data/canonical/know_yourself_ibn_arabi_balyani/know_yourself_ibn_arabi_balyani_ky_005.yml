section: Risālat al-Aḥadiyya, on the veil
sanskrit_devanagari: al-ḥijābu nūrun, wa-anta maḥjūbun bi-l-nūr.
sanskrit_iast: ''
translation_literal: The veil is light, and you are veiled from Him by the light.
commentary: 'This compressed saying overturns the ordinary religious image of a dark barrier separating creature from God.
  The obstacle is not simply ignorance, sin, or absence of illumination. It is light itself: every intelligible disclosure,
  spiritual state, vision, doctrine, and sense of “I know” can become a veil when it is taken as something possessed by a
  separate self. In the non-dual idiom associated with the Risālat al-Aḥadiyya, the Real is not hidden by distance; rather,
  the seeker’s own fixation on appearances—including luminous appearances—constitutes concealment. “Light” therefore has a
  double valence. It is the medium in which things are manifest, yet as an object distinguished from the Real it remains a
  limit. The saying does not reject illumination; it rejects stopping at it. The final veil is the knower’s claim to be a
  knower standing before a known God.


  Key Terms


  **al-ḥijāb** — The veil or screening barrier, here paradoxically identified with illumination rather than darkness.

  **nūr** — Light, meaning divine disclosure, intelligibility, vision, or spiritual illumination that can itself conceal the
  Real.

  **maḥjūbun** — Veiled or screened off, indicating the subject’s condition of being prevented from direct realization.


  Cross-Tradition Resonances


  **Kena Upaniṣad 2.3:** The Upaniṣad teaches that Brahman is not known by one who thinks it known, paralleling the claim
  that a possessed experience of illumination can obstruct realization. Divergence: The Kena frames the problem primarily
  as the inadequacy of epistemic mastery, whereas this saying specifically casts divine light itself as the veil.

  **Pseudo-Dionysius, Mystical Theology 1.3:** Dionysius describes entry into the divine darkness beyond every light and every
  act of knowing, much as this saying denies that illumination as such is final access to God. Divergence: Dionysius emphasizes
  transcendence beyond affirmative theology, while the Arabic formulation presents light as a veil generated within the relation
  of the self to divine manifestation.

  **The Cloud of Unknowing, chapters 3–4:** The anonymous author counsels passing beyond conceptual knowledge through a cloud
  of unknowing, paralleling the warning that spiritual and intellectual disclosures can become obstacles. Divergence: The
  Cloud prescribes cultivated unknowing as a devotional method, whereas this saying concentrates on the paradox that even
  luminous disclosure veils when appropriated by a separate self.'
practice: 'Sit quietly for ten minutes. Notice any image, feeling, insight, or inward brightness that arises. Instead of pursuing
  or rejecting it, ask: “To whom does this appear?” Rest without making the experience into an object possessed by a separate
  observer.'
