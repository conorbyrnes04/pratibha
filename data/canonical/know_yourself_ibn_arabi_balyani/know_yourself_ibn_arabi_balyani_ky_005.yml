translation_literal: The veil is light, and you are veiled from Him by the light.
commentary: 'This compressed saying overturns the ordinary religious image of a dark barrier separating creature from God.
  The obstacle is not simply ignorance, sin, or absence of illumination. It is light itself: every intelligible disclosure,
  spiritual state, vision, doctrine, and sense of “I know” can become a veil when it is taken as something possessed by a
  separate self. In the non-dual idiom associated with the Risālat al-Aḥadiyya, the Real is not hidden by distance; rather,
  the seeker’s own fixation on appearances—including luminous appearances—constitutes concealment. “Light” therefore has a
  double valence. It is the medium in which things are manifest, yet as an object distinguished from the Real it remains a
  limit. The saying does not reject illumination; it rejects stopping at it. The final veil is the knower’s claim to be a
  knower standing before a known God.


  Key Terms


  **al-ḥijāb** — the veil or covering that obstructs direct apprehension.

  **nūr** — light, here paradoxically the very medium that can conceal.

  **maḥjūb** — veiled or screened off, a passive condition of being obscured.


  Cross-Tradition Resonances


  **Kena Upaniṣad 2.3:** The Upaniṣad teaches that Brahman is rightly known by one who does not think it fully known, paralleling
  the claim that luminous knowledge can obstruct realization. Divergence: Its apophatic warning concerns Brahman’s inexhaustibility
  rather than a veil cast by light before a divine Thou.

  **Pseudo-Dionysius, Mystical Theology 1.3:** Dionysius describes ascent into a divine darkness beyond every intelligible
  light and concept, much as this saying treats spiritual disclosure as potentially veiling. Divergence: Dionysius contrasts
  divine darkness with created intellectual light, whereas the Arabic saying calls the veil itself light.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness undermines attachment
  to any supposedly self-standing insight or doctrine. Divergence: Madhyamaka does not posit a hidden personal God from whom
  one is veiled, but analyzes all phenomena as empty of intrinsic nature.'
practice: 'Sit quietly for ten minutes. Notice any image, feeling, insight, or inward brightness that arises. Instead of pursuing
  or rejecting it, ask: “To whom does this appear?” Rest without making the experience into an object possessed by a separate
  observer.'
