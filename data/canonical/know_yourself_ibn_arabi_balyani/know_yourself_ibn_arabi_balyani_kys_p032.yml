source_excerpt: The Prophet said, Whoever knows their self, knows their Lord. He did not say, Whoever annihilates their self,
  knows their Lord. Your being is nothing and whatever is nothing cannot be placed in relationship to anything else, whether
  it is capable of passing away or not and whether it is existent or nonexistent.
