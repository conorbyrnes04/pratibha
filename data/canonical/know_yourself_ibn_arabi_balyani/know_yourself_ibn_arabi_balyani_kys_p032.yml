unit_label: Knowing the Self Requires No Annihilation
title: Knowing the Self Requires No Annihilation
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- self
source_excerpt: The Prophet said, Whoever knows their self, knows their Lord. He did not say, Whoever
  annihilates their self, knows their Lord. Your being is nothing and whatever is nothing cannot be placed
  in relationship to anything else, whether it is capable of passing away or not and whether it is existent
  or nonexistent.
translation_literal: 'For this the Prophet—peace be upon him—said: “Whoever knows himself knows his Lord.”
  And he said: “I know my Lord by my Lord.” By this he points out that you are not you: you are He, without
  you—not that He enters into you, nor that you enter into Him, nor that He comes forth from you, nor
  that you come forth from Him. Nor does this mean that you or your attributes have any existence. Rather,
  it means that you never were and never will be, whether by yourself, through Him, in Him, or with Him.
  You are neither passing away nor remaining. You are He, without any of these limitations. If you know
  your existence in this way, then you know God; otherwise, not.


  Most of those who claim knowledge of God make the passing away of existence, and the passing away of
  that passing away, a condition for attaining the knowledge of God. This is an error and a clear oversight.
  For the knowledge of God does not require the passing away of existence, nor the passing away of its
  passing away. The thing has no existence, and what has no existence cannot pass away; for passing away
  comes only after existence has been affirmed. If you know yourself without existence or passing away,
  then you know God; otherwise, not.


  To make the knowledge of God depend upon the passing away of existence and the passing away of that
  passing away is to affirm association. For when you make the knowledge of God depend on the passing
  away of existence and its passing away, existence belongs to other than God, together with its opposite—and
  this is clear association. The Prophet said: “Whoever knows himself knows his Lord”; he did not say:
  “Whoever passes away from himself knows his Lord.” For affirming an other contradicts its passing away;
  and what may not be affirmed may not be said to pass away. Your existence is nothing, and nothing cannot
  be added to anything: neither passing nor unpassing, neither existent nor non-existent.'
commentary: 'The passage’s contested claim is stronger than the familiar Sufi counsel to “die before you
  die.” It denies that self-annihilation (fanāʾ), even followed by the “annihilation of annihilation,”
  is a prerequisite for knowing God. Why? Fanāʾ can imply that a real, independent self first exists and
  then disappears. For this radical waḥdat al-wujūd argument, that sequence already grants “other-than-God”
  a kind of being, however temporary; that is precisely the association (shirk) it seeks to refuse. Self-knowledge
  is therefore not the destruction of an entity but the removal of a false attribution: the claim that
  the self possesses existence in its own right. “You are He, without you” does not straightforwardly
  authorize a merger of two beings. The text explicitly rejects entering, exiting, indwelling, and reciprocal
  union. Yet its language remains theologically volatile, because it identifies the self’s apparent being
  wholly with divine Being and says “you are He.” Classical theologians would object that this erases
  the Creator–creature distinction, while more careful Akbarian readers take it as a claim about existence,
  not about the servant’s essence or legal and ethical responsibility. The knowing sought is thus a shift
  in seeing: no self-standing “I” is found beside God.'
insight: ''
practice: 'Today, when you say “my life,” “my ability,” or “my achievement,” pause once and silently replace
  possession with dependence: “This has no independent existence from God.” Then continue the task with
  full responsibility, without turning the thought into passivity.'
sanskrit_devanagari: 'ولهذا قال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي، مَن عرف نفسَه فقد عرف ربَّه."[22]
  وقال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي." أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل»
  أنت هو بلا أنت: لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك موجود
  وصفتك هكذا أبدًا: غني به. إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود.
  أنت هو، وهو أنت، بلا علَّة من هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.


  وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء[23] – وذلك غلط وسهو واضح: فإن
  معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود له، وما لا وجود
  له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ الله. – وإلا
  فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم.'
