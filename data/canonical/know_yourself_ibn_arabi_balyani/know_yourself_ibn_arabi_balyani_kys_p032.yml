  label: Practice (Abhyasa)
  body: 'Today, when you say “my life,” “my ability,” or “my achievement,” pause once and silently replace
    possession with dependence: “This has no independent existence from God.” Then continue the task with
    full responsibility, without turning the thought into passivity.'
