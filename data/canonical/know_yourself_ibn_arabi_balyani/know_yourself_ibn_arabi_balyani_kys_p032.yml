- kind: key_terms
  label: Key Terms
  items:
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This is waḥdat al-wujūd (the oneness of being) applied
      rigorously—not a merging of two things into one, but the recognition that there was never a second
      thing… Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and
      world'
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This is waḥdat al-wujūd (the oneness of being) applied rigorously—not
      a merging of two things into one, but the recognition that there was never a second thing… Trap:
      pantheist collapse that erases servant/Lord distinction'
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: This passage strikes at the very heart of the treatise''s
      teaching on tawḥīd and self-knowledge. Trap: hearing a creedal slogan rather than ontological exclusivity
      of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: The author is critiquing a common Sufi misreading whereby the path requires ''ceasing
      to be'' (fanāʾ) and then the ''ceasing of that ceasing. Trap: self-erasure as quietism or dissociation
      rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: '' His argument is subtle but decisive: to speak of annihilating something is first to affirm
      that it truly exists—and to affirm an existence alongside God is p… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
