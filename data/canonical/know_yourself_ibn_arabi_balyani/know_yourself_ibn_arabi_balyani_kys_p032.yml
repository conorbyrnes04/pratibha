- kind: key_terms
  label: Key Terms
  items:
  - term: معرفة
    definition: ʿ-r-f, “to recognize or know” -> direct recognition of the self’s non-independent reality
      and hence of the Lord -> more than ordinary information or doctrinal knowledge.
  - term: فناء
    definition: f-n-y, “to pass away, perish” -> the annihilation-state the author rejects as a necessary
      condition of knowing God -> not simply humility, ascetic self-denial, or psychological ego-loss.
  - term: فناء الفناء
    definition: “the passing away of passing away” -> a second-order mystical formula criticized here
      because it still presumes an existent subject and a real annihilation -> not a higher spiritual
      achievement automatically endorsed by the text.
  - term: الشرك
    definition: sh-r-k, “sharing, partnership” -> attributing any independently real existence to other
      than God -> broader here than the default gloss of overt idol worship.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural grammar
      for denying a being outside divine reality.
    divergence: The verse does not itself state that creatures have no existence or that self-knowledge
      entails the text’s radical identity-language.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” readily supports the claim that only God finally
      endures.
    divergence: Many exegetes understand perishing as created transience, not as the denial that creatures
      truly exist in a dependent, created manner.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: 'The saying functions as the passage’s governing maxim: reflection on the self discloses
      radical dependence upon God.'
    divergence: Though immensely influential in Sufi literature, it is not generally accepted as a sound
      Prophetic hadith by hadith critics; the author gives it a particularly uncompromising metaphysical
      reading.
