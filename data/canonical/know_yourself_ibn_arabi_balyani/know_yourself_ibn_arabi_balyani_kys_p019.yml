- kind: key_terms
  label: Key Terms
  items:
  - term: أنت
    definition: Second-person pronoun, “you” -> the apparently self-standing subject is addressed and
      undone -> not merely the empirical personality or moral ego.
  - term: هو
    definition: “He,” the Qur’anic pronoun of divine identity -> names the sole reality invoked in “you
      are He” -> not a claim that a human individual becomes God by fusion.
  - term: بلا أنت
    definition: “Without you” -> the formula denies an independently subsisting “you” -> stronger than
      the default gloss of humility or ordinary dependence.
  - term: معه
    definition: “With Him” -> excludes coexistence alongside God as a separate being -> not simply companionship,
      proximity, or divine assistance.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supports the treatise’s refusal
      to locate God within temporal or spatial relations.
    divergence: The Qur'anic verse need not itself deny the real, created existence of creatures as radically
      as this treatise does.
  - citation: Qur'an 28:88
    resonance: “Everything is perishing except His Face” is read in the wider treatise as denying enduring
      being to anything other than God.
    divergence: Many Qur'anic commentators take it as a declaration of creaturely perishability, not as
      proof that creatures never possess existence in any sense.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The saying supplies the treatise’s governing movement from self-knowledge to knowledge
      of God.
    divergence: Its transmission and status are disputed, and the treatise gives it a more metaphysically
      absolute interpretation than ethical or devotional readings do.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my time,” “my ability,” or “my achievement,” pause once and silently replace
    possession with gratitude: “This is not self-grounded; it is received from God.”'
