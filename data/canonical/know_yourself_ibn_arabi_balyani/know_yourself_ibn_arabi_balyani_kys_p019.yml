  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: Second, and more subtly, the error of those who make ''ceasing to be'' (fanāʾ) a precondition
      for knowing God. Trap: self-erasure as quietism or dissociation rather than clearing of false independence'
    lemma_id: fana
