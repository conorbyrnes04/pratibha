  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This passage stands at the heart of the treatise''s teaching
      on waḥdat al-wujūd — the oneness of being. Trap: treating ‘existence’ as a neutral metaphysical
      predicate shared equally by God and world'
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This passage stands at the heart of the treatise''s teaching on waḥdat
      al-wujūd — the oneness of being. Trap: pantheist collapse that erases servant/Lord distinction'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Here: Direct, experiential knowledge or gnosis — here, the self-knowledge
      that is identical with knowledge of God, since the self was never other than He. Trap: equating
      mystical knowing with accumulated doctrine'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: To say ''I must cease to be'' still affirms that there was a real ''I'' to be extinguished
      — and to affirm a second existence alongside God is precisely shirk (ass… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
