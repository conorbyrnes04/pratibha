source_excerpt: What the Prophet pointed out by that, is that you are not you but you are Him and there
  is no you. It is not that He enters into you or that you enter into Him, or that He comes out of you
  or that you come out of Him. That does not mean that you have being and you are qualified by this or
  that attribute. What is meant is that you never were and never will be, whether through yourself or
  through Him or in Him or with Him.
translation_literal: 'And for this the Prophet (peace be upon him) said: "Whoever knows himself knows
  his Lord." And he said (peace be upon him): "I know my Lord by my Lord." By this the Prophet points
  out that you are not you: you are He, without you — not He entering into you, nor you entering into
  Him, nor He proceeding forth from you, nor you proceeding forth from Him. And it is not meant by this
  that you are something that exists, or that your attributes are something that exists, but rather that
  you never were nor will be, whether by yourself, or through Him, or in Him, or along with Him. You are
  neither ceasing to be nor still existing. You are He, without any of these limitations. So if you know
  your existence in this way, then you know God; and if not, then not.'
commentary: 'This passage stands at the heart of the treatise''s teaching on waḥdat al-wujūd — the oneness
  of being. The hadith ''Whoever knows himself knows his Lord'' is read not as a call to introspection
  about a separate self, but as a disclosure that the self one imagines to possess an independent existence
  was never there at all. The author carefully guards against two errors. First, incarnationism (ḥulūl):
  the relation of self to God is not one of God entering the creature or the creature entering God, for
  that would presuppose two distinct existents. Second, and more subtly, the error of those who make ''ceasing
  to be'' (fanāʾ) a precondition for knowing God. To say ''I must cease to be'' still affirms that there
  was a real ''I'' to be extinguished — and to affirm a second existence alongside God is precisely shirk
  (associating partners). The genius of the phrasing ''you are neither ceasing to be nor still existing''
  dismantles both horns: there is nothing to annihilate because there was never an independent self to
  begin with. Self-knowledge, then, is not the achievement of a new state but the removal of ignorance
  — the recognition that the only existence is His existence.


  Key Terms


  **fanāʾ** — ''Passing away'' or ''ceasing to be''; the Sufi notion of self-annihilation. The treatise
  critiques making fanāʾ a precondition for knowing God, since to require the extinction of a self is
  already to affirm that self''s real existence.

  **maʿrifa** — Direct, experiential knowledge or gnosis — here, the self-knowledge that is identical
  with knowledge of God, since the self was never other than He.

  **ḥulūl** — Incarnation or indwelling — the belief that God enters into a creature. The author explicitly
  rejects this: there is no entering in or proceeding forth, for there are not two existents.'
insight: ''
practice: 'Sit quietly and, instead of trying to ''let go'' of yourself or annihilate the ego (which subtly
  reasserts a self to be destroyed), gently investigate the assumption itself: Where is this separate
  ''I'' that would need to cease? Turn attention to whatever seems most solidly ''you'' — a thought, a
  sensation, a sense of being a witness — and ask of it, ''Does this stand on its own, or is it borrowed
  being?'' Rest in the recognition that you never possessed an independent existence to lose. Let the
  seeking dissolve not by effort but by seeing there was never anything but His being.'
