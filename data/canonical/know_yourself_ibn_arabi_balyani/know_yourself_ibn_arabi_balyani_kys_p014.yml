source_excerpt: There is no difference between the sender, that which is sent and the one to whom it is
  sent. The very existence of the prophetic message is His existence. There is no existence to any other
  who could pass away, or have a name or be named. Because of this, the Prophet, God bless him and give
  him peace, said, Whoever knows their self, knows their Lord.
translation_literal: 'There is no difference between the Sender and the thing sent, and between the person
  sent and the person to whom he is sent. The very existence of the prophetic message is His existence.
  There is no other, and there is no existence belonging to any other than He — nor to its ceasing to
  be (fanāʾ), nor to its name, nor to its named. It is for this reason that the Prophet, upon whom be
  peace, said: "Whoso knoweth himself knoweth his Lord." And he said, upon him be peace: "I know my Lord
  by my Lord." By this the Prophet points out that you are not you: you are He, without you — He not entering
  into you, nor you into Him; He not proceeding forth from you, nor you from Him. It is not meant that
  you are something that exists, or that your attributes are anything that exists, but rather that you
  never were nor will ever be, whether by yourself, or through Him, or in Him, or along with Him. You
  are neither ceasing to be nor still existing. You are He, without any of these limitations. So if you
  know your existence in this way, then you know God; and if not, then not.'
commentary: 'This passage lies at the heart of the treatise''s teaching on the oneness of being (waḥdat
  al-wujūd). The chain of prophetic sending — Sender, message, one sent, one sent to — is dissolved into
  a single reality: all are His existence. The point is not a poetic exaggeration but a rigorous consequence
  of tawḥīd: if only God truly is, then every apparent ''other'' that could send, receive, know, or pass
  away has no independent existence to begin with. This is why the author repeatedly resists the language
  of fanāʾ (''ceasing to be'') as it is popularly understood. To speak of the self ''passing away'' presupposes
  that the self first existed as something real and separate — and to posit such a separate existence
  is already a subtle polytheism (shirk). The famous ḥadīth ''Whoso knoweth himself knoweth his Lord''
  is therefore read not as an instruction to annihilate a real self, but as a disclosure that there was
  never a self standing apart from God to annihilate. Self-knowledge is not the destruction of the knower
  but the recognition that the knower was always He. Notice the delicate balance: ''you are He, without
  you'' — this is neither incarnation (God entering the creature) nor emanation (the creature flowing
  from God), both of which the treatise firmly rejects. It is the simple, vertiginous recognition that
  duality was never founded in reality.


  Key Terms


  **fanāʾ** — Literally ''passing away'' or ''ceasing to be.'' In common Sufi usage, the annihilation
  of the ego in God. This treatise critiques the popular understanding: since the self never had independent
  existence, there is nothing real to annihilate — to insist on fanāʾ is subtly to affirm the very separate
  self one claims to erase.

  **tawḥīd** — The affirmation of God''s absolute oneness. Here it is pressed to its radical conclusion:
  not merely that there is one God, but that there is no existence whatsoever besides His — so that no
  genuine ''other'' exists to be united with or separated from Him.

  **maʿrifa** — Direct, experiential knowledge of God, distinct from discursive learning (''ilm). The
  treatise identifies knowledge of the self with knowledge of God: to truly know oneself is to know that
  one''s existence is His existence.'
insight: ''
practice: 'Repeat under your breath through the day the line ''you are not you: you are He,'' letting
  it interrupt each moment you feel most solidly yourself. Do not try to erase the ''you'' — simply let
  the phrase remind you there was never a separate self there to erase.'
