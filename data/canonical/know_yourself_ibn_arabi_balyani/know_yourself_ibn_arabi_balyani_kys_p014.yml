source_excerpt: There is no difference between the sender, that which is sent and the one to whom it is
  sent. The very existence of the prophetic message is His existence. There is no existence to any other
  who could pass away, or have a name or be named. Because of this, the Prophet, God bless him and give
  him peace, said, Whoever knows their self, knows their Lord.
translation_literal: 'His Prophet is He, His Messenger is He, His message is He, and His word is He. He
  sends Himself, by Himself, from Himself to Himself: there is no mediator and no means other than He.
  There is no difference between the Sender, that by which the message is sent, and the one to whom it
  is sent. The existence of the letters of praise is His existence alone—not their praise, nor their name,
  nor their named. Therefore the Prophet—God bless him and give him peace—said: “I knew my Lord by my
  Lord. Whoever knows himself knows his Lord.”'
commentary: 'The passage presses divine oneness beyond the familiar claim that God sends prophets or reveals
  speech. Sender, messenger, message, speech, and recipient are said to be distinguishable only at the
  level of expression, not as independently existing realities. In the idiom of waḥdat al-wujūd, every
  such relation has its being only as God’s self-disclosure: He “sends Himself, by Himself, from Himself
  to Himself.” The point is not simply devotional hyperbole. It denies a second, self-standing reality
  that could mediate between God and God, or stand beside Him as an autonomous hearer. Hence self-knowledge
  becomes knowledge of the Lord. The “self” to be known is not chiefly one’s psychology, moral temperament,
  or private ego; it is the supposed independent existence claimed by the knower. To know it rightly is
  to find that it has no existence of its own. The contested move is unmistakable: distinctions central
  to prophecy—God, messenger, revelation, audience—are redescribed as modes of one Reality. Critics can
  see this as collapsing Creator and creature and as blurring prophetic mediation; defenders read it as
  protecting absolute tawḥīd, while leaving the distinctions operative in religious life without granting
  them independent being. The paired sayings make knowing God neither an inference from the self nor an
  achievement possessed by the self: the Lord is known “by my Lord.”'
insight: ''
practice: 'Today, when you say “I did this” or “this is mine,” pause once and quietly ask: what in this
  moment exists independently of the One who gives it being?'
sanskrit_devanagari: 'نبيُّه هو، ورسوله هو، ورسالته هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه،
  لا واسطة ولا سبب غيره، ولا تفاوُت بين المرسِل والمرسَل به والمرسَل إليه. وجود حروف الثناء وجوده لا غير،
  لا ثناؤه ولا اسمه ولا مُسمَّاه.


  ## [من عرف نفسه عرف ربّه]


  ولهذا قال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي، مَن عرف نفسَه فقد عرف ربَّه."'
