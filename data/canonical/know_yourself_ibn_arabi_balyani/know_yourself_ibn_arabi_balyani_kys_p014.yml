- kind: key_terms
  label: Key Terms
  items:
  - term: رسوله
    definition: rasūl, from r-s-l, “to send forth” -> the divine messenger is identified here with the
      One who sends -> more than the default gloss “messenger,” it marks a relation denied independent
      existence.
  - term: واسطة
    definition: wāsiṭa, “middle, intermediary” -> no third entity mediates the movement from God to God
      -> not merely a practical “means,” but any independently real link between terms.
  - term: نفسه
    definition: nafs, “self, soul, person” -> in “He sent Himself,” it names divine self-relation; in
      the maxim it destabilizes the human self’s claim to separateness -> not simply the individual psyche.
  - term: من عرف نفسه عرف ربّه
    definition: “Whoever knows his self knows his Lord” -> self-knowledge reveals the non-independence
      of the self and thus divine reality -> not a generic maxim of introspection or ethical self-awareness.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” provides the scriptural vocabulary
      for divine reality encompassing every apparent relation.
    divergence: The verse does not itself identify messenger, message, and recipient as one existence;
      the epistle draws a stronger metaphysical conclusion.
  - citation: Qur’an 53:10
    resonance: “He revealed to His servant what He revealed” preserves revelation as an act whose ultimate
      source is God alone.
    divergence: The Qur’anic formulation retains God and servant in grammatical relation, whereas this
      passage radically interiorizes the whole relation within divine self-disclosure.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: 'The saying supplies the epistle’s governing formula: the path to knowledge of the Lord
      passes through knowledge of the self.'
    divergence: Though immensely influential in Sufi writing, it is not established as a sound Prophetic
      hadith in the major canonical collections; the text gives it a distinctively nondual reading.
