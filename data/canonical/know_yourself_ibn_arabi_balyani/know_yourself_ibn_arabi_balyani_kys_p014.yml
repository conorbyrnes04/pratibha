unit_label: The Messenger, Message, and Knower Are One Reality
title: The Messenger, Message, and Knower Are One Reality
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
