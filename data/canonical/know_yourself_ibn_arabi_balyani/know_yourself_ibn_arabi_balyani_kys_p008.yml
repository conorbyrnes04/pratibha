- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is not that God is hidden behind a second thing—whether matter, the ego, concepts,
    or a cosmic screen. Divine oneness itself is the “veil”: the very absoluteness by which no independently
    standing seer can confront God as an object. In the idiom of waḥdat al-wujūd, whatever seems to know
    God as another has no autonomous existence from which to do so. Thus God alone sees God, through God.
    Self-knowledge becomes knowledge of the Lord when the self’s presumed independent standpoint is recognized
    as empty: the seeker does not acquire a view of a distant deity but discovers that the division of
    knower and Known cannot finally hold. The contested move is decisive. The passage does not merely
    affirm divine incomparability; it presses toward an ontological non-otherness that can sound as though
    creaturely reality is simply denied. Critics, including many theologians, resist this as collapsing
