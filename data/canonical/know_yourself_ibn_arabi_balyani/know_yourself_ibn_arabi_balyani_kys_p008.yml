unit_label: Divine Oneness Is Its Own Veil
title: Divine Oneness Is Its Own Veil
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: His veil is His oneness since nothing veils Him other than Him. His own being veils Him.
  His being is concealed by His oneness without any condition. No one other than He sees Him.
translation_literal: His Veil is His oneness; nothing veils Him other than His Veil. His existence is
  His oneness, concealed by His oneness without any quality. No one other than He sees Him.
commentary: 'The claim is not that God is hidden behind a second thing—whether matter, the ego, concepts,
  or a cosmic screen. Divine oneness itself is the “veil”: the very absoluteness by which no independently
  standing seer can confront God as an object. In the idiom of waḥdat al-wujūd, whatever seems to know
  God as another has no autonomous existence from which to do so. Thus God alone sees God, through God.
  Self-knowledge becomes knowledge of the Lord when the self’s presumed independent standpoint is recognized
  as empty: the seeker does not acquire a view of a distant deity but discovers that the division of knower
  and Known cannot finally hold. The contested move is decisive. The passage does not merely affirm divine
  incomparability; it presses toward an ontological non-otherness that can sound as though creaturely
  reality is simply denied. Critics, including many theologians, resist this as collapsing Creator and
  creation. Its defenders answer that it does not identify finite forms with the divine Essence, but denies
  those forms any self-subsisting being.'
insight: ''
practice: Today, when you catch yourself treating God as an object you can possess in thought, pause for
  one breath and release that mental image without replacing it.
sanskrit_devanagari: حجابه وحدانيته، فلا يحجبه شيءٌ غير حجابه. وجوده وحدانيته، تستَّر بوحدانيته بلا كيفية.
  لا يراه أحدٌ غيره
