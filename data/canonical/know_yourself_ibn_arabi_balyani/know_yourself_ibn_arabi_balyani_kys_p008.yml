    Essence, but denies those forms any self-subsisting being.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ḥijāb
    definition: ḥ-j-b, to screen or withhold -> the veil is divine oneness itself -> not a material barrier
      between God and a human observer.
  - term: waḥdāniyya
    definition: w-ḥ-d, being one -> God’s uncompounded oneness conceals Him from every putatively separate
      knower -> more than the default gloss “unity.”
  - term: wujūd
    definition: w-j-d, being or existence -> God’s existence is said to be His oneness -> not merely an
      entity’s ordinary existence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 6:103
    resonance: “Eyes do not apprehend Him, while He apprehends all eyes” closely supports the asymmetry
      of seeing and being seen.
    divergence: The Qur’anic verse emphasizes divine transcendence; this passage develops it into the
      claim that only God sees God.
  - citation: Qur’an 42:11
    resonance: “Nothing is like unto Him” guards the divine incomparability implied by a veil beyond creaturely
      access.
    divergence: The treatise moves from incomparability to a strong denial of any independent creaturely
      standpoint.
  - citation: Hadith qudsī, “I was his hearing by which he hears and his sight by which he sees”
    resonance: It supplies a devotional analogue for divine agency in human seeing.
    divergence: The hadith describes nearness to God; the present text makes the more radical ontological
      assertion that no other sees Him at all.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you catch yourself treating God as an object you can possess in thought, pause for
    one breath and release that mental image without replacing it.
