source_excerpt: His veil is His oneness since nothing veils Him other than Him. His own being veils Him.
  His being is concealed by His oneness without any condition. No one other than He sees Him.
translation_literal: 'Understand this, so that you do not fall into the error of those who believe in
  the indwelling of God in creatures. He is not in a thing, nor is a thing in Him — neither entering into
  Him nor proceeding forth from Him. You must know Him in this way: not through knowledge (''ilm), nor
  intellect, nor understanding, nor imagination, nor sense, nor the outward eye, nor the inward eye, nor
  perception. No one sees Him but Himself; no one perceives Him but Himself. By Himself He sees Himself,
  and by Himself He knows Himself. None sees Him other than He, and none perceives Him other than He.
  His veil is His very oneness; nothing veils Him other than He. His veil is only the concealment of His
  existence within His oneness, without any quality. None sees Him other than He — no sent prophet, nor
  perfected saint, nor angel brought near knows Him. His prophet is He, His sending is He, and His word
  is He.'
commentary: 'This passage strikes at the heart of waḥdat al-wujūd (the oneness of being). Balyānī first
  clears away a fatal misunderstanding: the doctrine is not incarnationism (ḥulūl), where God ''enters''
  a creature, nor union of two separate things. There is no ''entering'' or ''proceeding forth'' because
  there are never two beings to begin with. Then comes the striking teaching of our theme: God''s only
  veil is His own oneness. We normally imagine a veil as something external that blocks our view — but
  here the veil is not other than the Real. What conceals God is precisely His own overwhelming presence,
  His singular being. Nothing stands between the seeker and God except the seeker''s assumption of a separate
  self doing the seeking. This is why the passage insists that no faculty — reason, imagination, sense,
  even mystical vision — can grasp Him: every faculty presupposes a knowing subject distinct from a known
  object, and that duality is itself the illusion. Only He sees Himself, knows Himself, perceives Himself.
  The seeker''s true ''seeing'' of God is not the self attaining an object, but God''s self-knowing occurring
  where the illusory self once stood. Even prophecy is folded into this oneness: the sender, the sending,
  and the word are all He.


  Key Terms


  **waḥdat al-wujūd** — The oneness of being; the doctrine that there is only one Reality, and all apparent
  existents are the self-disclosure of that single Being, not separate beings alongside it.

  **ḥulūl** — Incarnation or indwelling — the belief that God enters into or dwells within a creature.
  Balyānī explicitly rejects this as an error, since it presupposes two beings.

  **ḥijāb** — Veil; here reinterpreted so that God''s only veil is His own oneness, meaning nothing external
  conceals Him — the seeming concealment is His own undivided presence.'
insight: ''
practice: Ask silently, 'Who is looking?' — then let every answer that arrives (a self, an eye, a mind)
  dissolve as just another thing that would need its own seer, until the searching collapses back into
  the seeing that was never yours. Rest there where no separate one remains to find Him.
