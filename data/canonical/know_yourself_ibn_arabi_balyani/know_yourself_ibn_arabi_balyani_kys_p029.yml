- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ
    definition: Arabic fanāʾ, “passing away” or “perishing,” from a root denoting cessation -> the passage
      rejects it when it implies that the self first truly exists -> the default gloss “ego-death” can
      miss the logical objection to any independently existing ego.
  - term: wujūd
    definition: Arabic wujūd, “existence,” from wajada, “to find” -> what is denied to the self as a reality
      beside God -> “being” can miss its polemical force against autonomous creaturely reality.
  - term: shirk
    definition: Arabic shirk, “association” or assigning a partner -> here, positing an existent that
      later undergoes annihilation -> “idolatry” is too narrow, since the target is metaphysical co-existence
      with God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” supports the treatise’s insistence that only
      God has enduring reality.
    divergence: The verse can describe created things as perishing, whereas this passage argues that their
      independent existence was never affirmable in the first place.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The treatise makes self-knowledge the direct route to knowledge of God.
    divergence: The saying is widely used in Sufi literature but is not generally accepted as a sound
      Prophetic hadith; Balyānī also gives it an exceptionally nondual metaphysical sense.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself defending a fixed identity—“my status,” “my achievement,” or
    “my failure”—pause and say inwardly: “This claim has no independent existence,” then respond to the
    situation with one concrete act of humility.'
