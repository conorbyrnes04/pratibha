- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is deliberately more radical than the familiar Sufi account of fanāʾ, the passing-away
    of the ego before God. Balyānī argues that annihilation can only apply to something first granted
    real independent existence. To say “I exist, then I vanish” therefore leaves an “I” standing over
    against God, however briefly; even the attempt to abolish that vanishing repeats the same structure.
    Self-knowledge here is not psychological introspection, nor a spiritual event in which a separate
    self is absorbed. It is recognition that the self never possessed existence alongside God in the first
    place. On this waḥdat al-wujūd reading, God alone is truly real, while creaturely identity is a misapprehension
    of dependence and otherness. The contested move is unmistakable: the treatise labels the language
