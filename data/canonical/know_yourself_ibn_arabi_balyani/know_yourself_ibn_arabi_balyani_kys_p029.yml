- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 7
    resonance: 'Both texts locate knowledge through a reorientation of attention: the Sufi passage identifies
      clarity by turning inward to the knower (away from passing content), while Plotinus prescribes turning
      inward to perceive the Unity that is always present but obscured by outward focus. Each makes the
      same structural move—knowledge requires redirecting attention from the external to the source of
      perception itself.'
    divergence: Ibn Arabi grounds this inward turn in the metaphysics of passing away (fanā), a dissolution
      of the phenomenal self, whereas Plotinus grounds it in the soul's continuous activity that merely
      awaits recognition, a difference between annihilation and unveiling.
    passage_id: plotinus_enneads.enn_vi_9_07
  - citation: Siva Sutra — Śāktopāya
    resonance: Both equate sustained or focused attention with knowledge itself rather than treating attention
      as a mere tool for acquiring knowledge. The Siva Sutra's 'Sustained attention is knowledge' and
      the Ibn Arabi passage's emphasis on clarity through returned attention both collapse the distinction
      between the act of attending and the state of knowing.
    divergence: The Siva Sutra operates within a non-dual Kashmiri Shaivism where attention and consciousness
      are ontologically identical, while Ibn Arabi's framework emphasizes the knower's self-recognition
      through the dissolution of what passes away, a more explicitly phenomenological reversal.
    passage_id: siva_sutra.ss_ii_12
