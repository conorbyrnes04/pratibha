- kind: translation
  label: Pratibha Translation
  body: Passing away implies the prior existence of the thing that passes away. If you know yourself without
    existing and passing away, then you know God, and if not, then not. By making the knowledge of God
    dependent on the passing away of your existence and the passing away of that passing away, there is
    an affirmation of something other than God.
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: Knowledge of God Requires Annihilation of Self Pearl #29 Passing away implies the prior
      existence of the thing that passes away. Trap: self-erasure as quietism or dissociation rather than
      clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: nafs (نفس)
    definition: '‘self/soul/breath’ → the claiming self that must be known so its independence can be
      seen through Here: If you know yourself without existing and passing away, then you know God, and
      if not, then not. Trap: psychologizing as ego-therapy without ontological stakes'
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: Knowledge of God Requires Annihilation of Self Pearl #29
      Passing away implies the prior existence of the thing that passes away. Trap: treating ‘existence’
      as a neutral metaphysical predicate shared equally by God and world'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Trap: narrowing to idol-worship while missing subtle self-ascription of agency'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 7
    resonance: 'Both texts locate knowledge through a reorientation of attention: the Sufi passage identifies
      clarity by turning inward to the knower (away from passing content), while Plotinus prescribes turning
      inward to perceive the Unity that is always present but obscured by outward focus. Each makes the
      same structural move—knowledge requires redirecting attention from the external to the source of
      perception itself.'
    divergence: Ibn Arabi grounds this inward turn in the metaphysics of passing away (fanā), a dissolution
      of the phenomenal self, whereas Plotinus grounds it in the soul's continuous activity that merely
      awaits recognition, a difference between annihilation and unveiling.
