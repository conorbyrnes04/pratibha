work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p029
unit_label: Knowing God Beyond Existence and Annihilation
title: Knowing God Beyond Existence and Annihilation
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
source_excerpt: Passing away implies the prior existence of the thing that passes away. If you know yourself
  without existing and passing away, then you know God, and if not, then not. By making the knowledge
  of God dependent on the passing away of your existence and the passing away of that passing away, there
  is an affirmation of something other than God.
translation_literal: 'For passing away implies the assertion of existence. Then if you know yourself without
  existence or passing away, you know God; and if not, then not.


  In making the knowledge of God dependent on the passing away of existence and on the passing away of
  that passing away, there is an assertion of polytheism.'
commentary: 'The claim is deliberately more radical than the familiar Sufi account of fanāʾ, the passing-away
  of the ego before God. Balyānī argues that annihilation can only apply to something first granted real
  independent existence. To say “I exist, then I vanish” therefore leaves an “I” standing over against
  God, however briefly; even the attempt to abolish that vanishing repeats the same structure. Self-knowledge
  here is not psychological introspection, nor a spiritual event in which a separate self is absorbed.
  It is recognition that the self never possessed existence alongside God in the first place. On this
  waḥdat al-wujūd reading, God alone is truly real, while creaturely identity is a misapprehension of
  dependence and otherness. The contested move is unmistakable: the treatise labels the language of fanāʾ
  shirk because it seems to posit a real entity that can undergo extinction. Many Sufis, however, use
  fanāʾ precisely to deny autonomous selfhood, not to establish it; they would treat annihilation as the
  disappearance of the claim to selfhood, not the destruction of a second being. The passage presses its
  paradox to prevent every residue of duality.'
insight: ''
practice: 'Today, when you notice yourself defending a fixed identity—“my status,” “my achievement,” or
  “my failure”—pause and say inwardly: “This claim has no independent existence,” then respond to the
  situation with one concrete act of humility.'
sanskrit_devanagari: 'فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ الله. –
  وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك'
