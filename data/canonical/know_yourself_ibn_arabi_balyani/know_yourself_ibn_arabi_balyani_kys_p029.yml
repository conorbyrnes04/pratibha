title: Knowledge of God Requires Annihilation of Self
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
source_excerpt: Passing away implies the prior existence of the thing that passes away. If you know yourself
  without existing and passing away, then you know God, and if not, then not. By making the knowledge
  of God dependent on the passing away of your existence and the passing away of that passing away, there
  is an affirmation of something other than God.
translation_literal: Most of those who know God make the ceasing of existence, and the ceasing of that
  ceasing, a condition for attaining the knowledge of God. This is an error and a plain oversight. For
  the knowledge of God does not presuppose the ceasing of one's existence, nor the ceasing of that ceasing.
  Things have no existence, and what does not exist cannot cease to exist. To speak of ceasing to be implies
  the positing of existence, and that is polytheism. So if you know yourself without existence or ceasing
  to be, then you know God; and if not, then not. To make the knowledge of God conditional upon the ceasing
  of existence, and the ceasing of that ceasing, involves an assertion of polytheism. For the Prophet
  (upon whom be peace) said, 'Whoso knows himself,' and did not say, 'Whoso makes himself to cease to
  be.' The affirmation of something other makes its extinction impossible; and that which cannot rightly
  be affirmed cannot rightly be extinguished either. Your existence is nothing, and nothing cannot be
  added to something, whether that thing be perishing or unperishing, existent or non-existent. The Prophet
  points to the fact that you are non-existent now, just as you were non-existent before the creation.
  For now is past eternity, and now is future eternity, and now is present time. And God (exalted be His
  name) is the existence of past eternity, of future eternity, and of present time, yet without past eternity,
  future eternity, or present time ever existing at all.
commentary: 'This passage strikes at a subtle spiritual error that Balyānī (writing in the tradition ascribed
  to Ibn ʿArabī) sees even among advanced mystics: the belief that fanāʾ — the annihilation or ''passing
  away'' of the self — is the precondition for knowing God. The author''s radical claim is that this teaching,
  however pious it sounds, secretly reintroduces the very polytheism it means to abolish. His logic is
  precise: to say ''my self must pass away'' presupposes that my self genuinely exists in the first place.
  But if the creature possessed real, independent existence that then had to be extinguished, one would
  have affirmed a reality standing alongside God — a second existence — which is shirk. From the standpoint
  of waḥdat al-wujūd, there is only one existence, God''s own. The creature never had a self-standing
  existence to lose. Hence the Prophet''s words are exact: ''Whoso knows himself knows his Lord'' — not
  ''Whoso annihilates himself.'' Self-knowledge is not the destruction of a real self but the recognition
  that there was never a separate self to begin with. The seeker''s task shifts from a heroic project
  of self-erasure to a quiet awakening: seeing that one is ''non-existent now as before creation.'' The
  striking meditation on time — that past eternity, future eternity, and the present moment all collapse
  into the divine ''now'' — reinforces this: God''s being is the only reality across all supposed times,
  none of which independently exist. The error corrected here is spiritual pride disguised as humility,
  for even ''passing away'' can become an achievement one claims.


  Key Terms


  **fanāʾ** — ''Passing away'' or annihilation of the self in God. The passage critiques treating it as
  a precondition for knowing God, arguing that it wrongly presupposes the self had real, independent existence
  to lose.

  **waḥdat al-wujūd** — The ''oneness of being'' — the doctrine that only God truly exists, and all apparent
  things have no independent existence apart from His.

  **shirk** — Polytheism, or associating partners with God. Here it names the hidden error of affirming
  any existence alongside God''s, even the existence one claims to annihilate.'
insight: ''
practice: Say aloud 'I must get rid of my ego' — then hear how the sentence has already smuggled in a
  self solid enough to be gotten rid of. Let the effort to annihilate it collapse in a single laugh, and
  rest in the fact that there was never a second existence there to remove.
