- kind: key_terms
  label: Key Terms
  items:
  - term: اللاشيء
    definition: lā shayʾ, “no-thing” -> the creaturely self considered as independently real -> more radical
      than the default gloss “nothing,” because it denies a rival ontological standing rather than merely
      worth or substance.
  - term: الأزل
    definition: al-azal, beginninglessness or past eternity -> gathered into the divine “now” -> not simply
      an infinitely long past, but freedom from temporal beginning.
  - term: الأبد
    definition: al-abad, endlessness or future eternity -> likewise named in the now -> not mere everlasting
      duration, which would still be temporal succession.
  - term: القِدَم
    definition: al-qidam, primordial pre-eternity/ancientness -> a temporal category whose reality is
      grounded in God -> missed when glossed only as “oldness.”
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the scriptural vocabulary
      behind the treatise’s refusal to locate God within temporal or spatial opposites.
    divergence: The Qur'anic verse predicates these Names of God; this passage develops them into a sweeping
      denial of independent being to all else.
  - citation: Qur'an 28:88
    resonance: “Everything is perishing except His Face” is congenial to the claim that nothing possesses
      enduring reality in itself.
    divergence: The verse can be read as announcing the future perishability of created things, whereas
      this text insists that their independent existence is already nothing.
  - citation: 'Hadith: “Who knows himself knows his Lord”'
    resonance: 'The saying functions here as the program of self-knowledge: seeing through the self''s
      supposed autonomy discloses divine reality.'
    divergence: Its hadith authentication is disputed, and the treatise gives it a distinctly nondual
      metaphysical interpretation not required by the saying itself.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say “my time” or “my life,” pause once and silently replace the possessive claim
    with gratitude: “This moment does not stand by itself; it is received from God.”'
