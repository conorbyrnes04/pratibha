- kind: key_terms
  label: Key Terms
  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away, evanescence’ → passing-away of the egoic claim before the
      Real Here: To speak of ''ceasing to be'' (fanāʾ) as a spiritual achievement quietly smuggles back
      in the assumption that there was a real, independent self there to be exti… Trap: self-erasure as
      quietism or dissociation rather than clearing of false independence'
    lemma_id: fana
    sense_id: fana.sufi
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This passage strikes at the heart of waḥdat al-wujūd (the
      oneness of being) by dismantling the very idea that the self is a ''thing'' capable of standing
      in rela… Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and
      world'
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This passage strikes at the heart of waḥdat al-wujūd (the oneness of
      being) by dismantling the very idea that the self is a ''thing'' capable of standing in rela… Trap:
      pantheist collapse that erases servant/Lord distinction'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: To speak of ''ceasing to be'' (fanāʾ) as a spiritual achievement quietly smuggles back in
      the assumption that there was a real, independent self there to be exti… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: This passage strikes at the heart of waḥdat al-wujūd (the
      oneness of being) by dismantling the very idea that the self is a ''thing'' capable of standing
      in rela… Trap: hearing a creedal slogan rather than ontological exclusivity of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  layer_provenance: editorial-enriched
