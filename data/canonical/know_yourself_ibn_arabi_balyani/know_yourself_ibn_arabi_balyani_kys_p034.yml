work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p034
unit_label: 'Pearl #34'
title: Your Being Cannot Relate to Anything
unit_type: teaching_passage
thesis: Your being is nothing and whatever is nothing cannot be placed in relationship to anything else,
  whether it is capable of passing away or not and whether it is existent or nonexistent.
themes:
- emptiness
- self
- death
- knowledge
- consciousness
- non-attachment
source_excerpt: Your being is nothing and whatever is nothing cannot be placed in relationship to anything
  else, whether it is capable of passing away or not and whether it is existent or nonexistent. The Prophet
  alluded to the fact that you are nonexistent now as you were nonexistent before creation, because now
  is eternity-without-beginning and now is eternity-without-end and now is timelessness. God is the very
  being of eternity-without-beginning, eternity-without-end and timelessness even though in reality there
  is no eternity
translation_literal: 'For the Prophet (peace be upon him) said, "Whoever knows himself," and did not say,
  "Whoever makes himself cease to be." For affirming the existence of another makes that other''s extinction
  impossible; and conversely, that whose affirmation is not permissible cannot have an extinction that
  is permissible either. Your existence is nothing, and nothing cannot be added to something — whether
  that something is perishing or unperishing, existent or non-existent. The Prophet points to the fact
  that you are non-existent now, just as you were non-existent before creation. For now is past eternity,
  and now is future eternity, and now is present time. And God (exalted be His name) is the existence
  of past eternity, and the existence of future eternity, and the existence of present time — yet without
  past eternity, future eternity, or present time ever truly existing. For if it were otherwise, He would
  not be by Himself without any partner; and it is indispensable that He be by Himself without any partner.
  For a ''partner'' would be one whose existence lay in his own essence rather than in the existence of
  God, and whoever were in that position would not be dependent upon Him. In that case there would be
  a second Lord, which is absurd: God (exalted be His name) can have no partner, nor like, nor equal.'
commentary: 'This passage strikes at the heart of waḥdat al-wujūd (the oneness of being) by dismantling
  the very idea that the self is a ''thing'' capable of standing in relation to God. The logic is deceptively
  simple: your being is nothing, and nothing cannot be joined, added, compared, or opposed to anything.
  To speak of ''ceasing to be'' (fanāʾ) as a spiritual achievement quietly smuggles back in the assumption
  that there was a real, independent self there to be extinguished — and that assumption is itself the
  subtle polytheism (shirk) the treatise exposes. The Prophet''s saying is precise: ''Whoever knows himself,''
  not ''Whoever annihilates himself.'' Knowledge, not destruction, is the operative act, because there
  was never a rival existence to destroy. The temporal teaching is equally radical: ''now'' is not a fleeting
  slice between past and future but the standing reality of past eternity, future eternity, and present
  time — all of which are God''s existence and none of which possess existence of their own. You are ''non-existent
  now as you were before creation'' precisely because there is only one Being, and creation added nothing
  to it. To grant yourself even a borrowed, dependent existence ''beside'' God is to posit a second Lord,
  and that the author flatly declares absurd. Self-knowledge is thus knowledge of God because the ''self''
  one truly knows is nothing but His being.


  Key Terms


  **fanāʾ** — ''Passing away'' or self-annihilation; here critiqued when treated as a goal, since it presupposes
  a real self to be extinguished — a subtle form of shirk.

  **shirk** — Associating a partner with God; the treatise argues that positing any independent existence
  ''beside'' God, even one''s own, is a hidden form of it.

  **waḥdat al-wujūd** — The ''oneness of being'' — the doctrine that there is only one real Existence,
  God''s, and all apparent others have no existence of their own.'
insight: ''
practice: Ask yourself once, silently, "Who knows himself?" — and instead of hunting for an answer, watch
  how no separate knower steps forward to be found. Let the question dissolve the searcher rather than
  reward it.
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
