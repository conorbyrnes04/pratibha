practice: Read this passage slowly three times. Pause for one minute and write one sentence about how
  to apply it today.
sanskrit_devanagari: وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ، ولا موجود ولا معدوم.
  «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم. فالله هو وجود الأزل
  ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم
