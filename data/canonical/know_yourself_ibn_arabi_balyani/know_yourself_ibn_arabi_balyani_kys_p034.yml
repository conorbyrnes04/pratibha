unit_label: Nothing Stands Alongside the Eternal Now
title: Nothing Stands Alongside the Eternal Now
unit_type: teaching_passage
thesis: Your being is nothing and whatever is nothing cannot be placed in relationship to anything else,
  whether it is capable of passing away or not and whether it is existent or nonexistent.
themes: []
source_excerpt: Your being is nothing and whatever is nothing cannot be placed in relationship to anything
  else, whether it is capable of passing away or not and whether it is existent or nonexistent. The Prophet
  alluded to the fact that you are nonexistent now as you were nonexistent before creation, because now
  is eternity-without-beginning and now is eternity-without-end and now is timelessness. God is the very
  being of eternity-without-beginning, eternity-without-end and timelessness even though in reality there
  is no eternity
translation_literal: Thine existence is nothing, and nothing cannot be added to something, whether perishing
  or unperishing, existent or non-existent. The Prophet points to the fact that thou art non-existent
  now as thou wast non-existent before the Creation. For now is past eternity, and now is future eternity,
  and now is past time. And God is the existence of past eternity and the existence of future eternity
  and the existence of past time; yet there is no existence of past eternity, future eternity, or past
  time.
commentary: 'The claim is not merely that creatures are short-lived, but that no independent creaturely
  being ever stands beside God. The passage presses waḥdat al-wujūd to its sharpest edge: “you” are not
  a second reality which first exists and then must be annihilated. Rather, what is taken as a self-subsisting
  existence is nothing in the first place; hence it cannot receive predicates such as lasting, passing
  away, existent, or non-existent as though it were a thing alongside God. “Now” names the collapse of
  temporal measures before the divine Reality: beginningless eternity, endless eternity, and ancientness
  are said to be present, while God is their very existence without being enclosed by them. Self-knowledge
  therefore becomes knowledge of the Lord when the claim of autonomous being is exposed. The contested
  move is obvious: the author does not simply say that all things depend upon God, but denies them any
  reality apart from His being. Critics can hear in this a collapse of Creator and creation; defenders
  answer that it rejects rivalry, composition, and a second existence, not the distinction of devotional
  address or revealed law. The text asks for a radical correction of how “I exist” is imagined, not a
  casual declaration that the individual ego is God.'
insight: ''
practice: 'Today, when you say “my time” or “my life,” pause once and silently replace the possessive
  claim with gratitude: “This moment does not stand by itself; it is received from God.”'
sanskrit_devanagari: وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ، ولا موجود ولا معدوم.
  «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم. فالله هو وجود الأزل
  ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم
