source_excerpt: Your being is nothing and whatever is nothing cannot be placed in relationship to anything
  else, whether it is capable of passing away or not and whether it is existent or nonexistent. The Prophet
  alluded to the fact that you are nonexistent now as you were nonexistent before creation, because now
  is eternity-without-beginning and now is eternity-without-end and now is timelessness. God is the very
  being of eternity-without-beginning, eternity-without-end and timelessness even though in reality there
  is no eternity
translation_literal: 'For the Prophet (peace be upon him) said, "Whoever knows himself," and did not say,
  "Whoever makes himself cease to be." For affirming the existence of another makes that other''s extinction
  impossible; and conversely, that whose affirmation is not permissible cannot have an extinction that
  is permissible either. Your existence is nothing, and nothing cannot be added to something — whether
  that something is perishing or unperishing, existent or non-existent. The Prophet points to the fact
  that you are non-existent now, just as you were non-existent before creation. For now is past eternity,
  and now is future eternity, and now is present time. And God (exalted be His name) is the existence
  of past eternity, and the existence of future eternity, and the existence of present time — yet without
  past eternity, future eternity, or present time ever truly existing. For if it were otherwise, He would
  not be by Himself without any partner; and it is indispensable that He be by Himself without any partner.
  For a ''partner'' would be one whose existence lay in his own essence rather than in the existence of
  God, and whoever were in that position would not be dependent upon Him. In that case there would be
  a second Lord, which is absurd: God (exalted be His name) can have no partner, nor like, nor equal.'
commentary: 'This passage strikes at the heart of waḥdat al-wujūd (the oneness of being) by dismantling
  the very idea that the self is a ''thing'' capable of standing in relation to God. The logic is deceptively
  simple: your being is nothing, and nothing cannot be joined, added, compared, or opposed to anything.
  To speak of ''ceasing to be'' (fanāʾ) as a spiritual achievement quietly smuggles back in the assumption
  that there was a real, independent self there to be extinguished — and that assumption is itself the
  subtle polytheism (shirk) the treatise exposes. The Prophet''s saying is precise: ''Whoever knows himself,''
  not ''Whoever annihilates himself.'' Knowledge, not destruction, is the operative act, because there
  was never a rival existence to destroy. The temporal teaching is equally radical: ''now'' is not a fleeting
  slice between past and future but the standing reality of past eternity, future eternity, and present
  time — all of which are God''s existence and none of which possess existence of their own. You are ''non-existent
  now as you were before creation'' precisely because there is only one Being, and creation added nothing
  to it. To grant yourself even a borrowed, dependent existence ''beside'' God is to posit a second Lord,
  and that the author flatly declares absurd. Self-knowledge is thus knowledge of God because the ''self''
  one truly knows is nothing but His being.


  Key Terms


  **fanāʾ** — ''Passing away'' or self-annihilation; here critiqued when treated as a goal, since it presupposes
  a real self to be extinguished — a subtle form of shirk.

  **shirk** — Associating a partner with God; the treatise argues that positing any independent existence
  ''beside'' God, even one''s own, is a hidden form of it.

  **waḥdat al-wujūd** — The ''oneness of being'' — the doctrine that there is only one real Existence,
  God''s, and all apparent others have no existence of their own.'
insight: ''
practice: Ask yourself once, silently, "Who knows himself?" — and instead of hunting for an answer, watch
  how no separate knower steps forward to be found. Let the question dissolve the searcher rather than
  reward it.
