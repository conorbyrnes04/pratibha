title: Knowing Your Reality Is Knowing the Lord
unit_type: verse
section: Treatise on Unity, opening dictum
sanskrit_devanagari: مَنْ عَرَفَ نَفْسَهُ فَقَدْ عَرَفَ رَبَّهُ
sanskrit_iast: ''
translation_literal: “Whoso knoweth himself knoweth his Lord.”
commentary: 'This saying supplies the treatise’s governing inference: self-knowledge is not chiefly moral
  introspection, psychological self-description, or knowledge of an individual soul. It is knowledge of
  the self’s alleged lack of independent existence. In the argument of waḥdat al-wujūd, when the seeker
  investigates the “I” thought to stand beside God, that supposed other is disclosed as having no being
  of its own; only God truly is. Thus knowledge of the self becomes knowledge of the Lord, not because
  a human being is simply identical with God in an ordinary sense, but because the self’s claim to separate
  reality is denied. The contested move is decisive: the text shifts from recognizing radical dependence
  upon God to asserting that no existence belongs to the creature as other. It explicitly rejects accounts
  of union, incarnation, or one thing entering another, yet its rhetoric of non-otherness has often sounded
  dangerously close to them. The saying therefore names an epistemic reversal: what appears nearest—one’s
  own self—proves not an autonomous knower, but the site at which divine Reality alone is to be recognized.'
practice: 'Today, notice one moment when you defend an identity—status, opinion, hurt, or role—and quietly
  ask: “What in this claim is truly mine by itself?” Then let the question remain open without trying
  to manufacture an answer.'
