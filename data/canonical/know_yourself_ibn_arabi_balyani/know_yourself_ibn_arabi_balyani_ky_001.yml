- kind: key_terms
  label: Key Terms
  items:
  - term: نَفْس
    definition: nafs, from a root associated with breath/self -> the reality or supposed existence of
      the seeker, and by extension all that is imagined beside God -> not merely the lower ego, psyche,
      or ‘soul.’
  - term: رَبّ
    definition: rabb, lord, master, sustainer -> God known as the sole real ground of being -> more than
      a conventional title for a deity external to the worshipper.
  - term: عَرَفَ
    definition: ʿarafa, to know, recognize, become acquainted with -> a direct recognition of reality
      through the self -> not simply acquiring doctrinal information.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 41:53
    resonance: God promises to show signs ‘in themselves’ until truth becomes clear; inner disclosure
      and recognition converge.
    divergence: The Qur’anic verse does not itself state that the self lacks all independent existence
      or identify its reality with divine existence.
  - citation: Qur’an 28:88
    resonance: ‘Everything is perishing except His Face’ supports the treatise’s insistence on God’s unmatched
      reality.
    divergence: The treatise reads this as denial of any other existent; many theological readings retain
      real created existence while affirming its contingency and perishability.
  - citation: 'Hadith: “Whoever knows himself knows his Lord”'
    resonance: The aphorism is the explicit hinge for the treatise’s path from self-knowledge to knowledge
      of God.
    divergence: Though widely circulated in Sufi literature, its status as a Prophetic hadith is disputed;
      the treatise gives it an especially uncompromising ontological interpretation.
