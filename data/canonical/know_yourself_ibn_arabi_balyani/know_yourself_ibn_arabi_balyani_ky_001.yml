section: Treatise on Unity, opening dictum
sanskrit_devanagari: مَنْ عَرَفَ نَفْسَهُ فَقَدْ عَرَفَ رَبَّهُ
sanskrit_iast: ''
translation_literal: Whoso knoweth his self (nafs) hath known his Lord (Rabb).
commentary: 'This celebrated maxim supplies the governing paradox of the Treatise on Unity: the way to the Real is not flight
  toward an object outside oneself, but penetration of the assumed independent self. Nafs here should not be reduced to the
  modern psychological ego. It can name the self, soul, animating principle, or the individuated “I” that claims autonomy.
  To know it truly is to discover its contingency: it possesses no self-subsisting being, power, or knowledge apart from God.
  Such knowledge is therefore not self-deification; it is the collapse of the illusion that there are two independent realities,
  knower and Known. “Lord” (Rabb) evokes God as sustaining, ordering, and bringing creatures to completion. The saying is
  widely transmitted in Sufi literature and is central to texts attributed to Ibn ʿArabī and ʿAbd al-Karīm al-Jīlī/Balyānī
  traditions, though it is not securely established as a prophetic ḥadīth.


  Key Terms


  **نَفْس** — Self, soul, or individuated “I,” whose apparent independence is exposed as contingent.

  **رَبّ** — Lord, sustainer, and divine source upon whom the self depends.

  **عَرَفَ** — Knew or recognized, implying direct realization rather than merely conceptual information.


  Cross-Tradition Resonances


  **Plato, Alcibiades I 133c:** Socrates teaches that self-knowledge requires the soul to look toward what is divine, paralleling
  the maxim’s movement from knowing oneself to knowing God. Divergence: Plato frames this through the soul’s rational likeness
  to the divine, whereas the maxim foregrounds the self’s radical contingency before the Lord.

  **Augustine, De vera religione 39.72:** Augustine directs the seeker inward because truth dwells in the inner person, closely
  paralleling the turn from external objects to interior recognition. Divergence: Augustine’s interior truth is articulated
  through Christian doctrines of creation and illumination, while the Arabic maxim states the relation in compressed language
  of self and Lord.

  **Chandogya Upanishad 6.8.7, the teaching tat tvam asi:** The Upanishadic instruction links realization of one’s deepest
  self with realization of ultimate reality, resembling the maxim’s union of self-knowledge and divine knowledge. Divergence:
  Advaita readings often identify the deepest self with Brahman, whereas this maxim can preserve the asymmetry between the
  contingent nafs and the sustaining Rabb.'
practice: 'Sit quietly for ten minutes and attend to the thought “I.” Each time an identity, possession, feeling, or achievement
  arises—“my body,” “my knowledge,” “my choice”—ask: “Does this sustain itself?” Let the answer become a silent recognition
  of dependence on the Rabb, without trying to imagine or objectify God.'
