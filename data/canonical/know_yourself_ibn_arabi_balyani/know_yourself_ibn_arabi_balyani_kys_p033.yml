unit_label: Knowing the Self Does Not Require Its Annihilation
title: Knowing the Self Does Not Require Its Annihilation
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- self
source_excerpt: He did not say, Whoever annihilates their self, knows their Lord. Your being is nothing
  and whatever is nothing cannot be placed in relationship to anything else, whether it is capable of
  passing away or not and whether it is existent or nonexistent.
translation_literal: 'For this reason the Prophet—peace be upon him—said: “I know my Lord by my Lord;
  whoever knows himself knows his Lord.” And he said—peace be upon him—“I know my Lord by my Lord.” By
  this he indicates that you are not you: rather, you are He without you. He does not enter into you,
  nor proceed forth from you; nor do you proceed forth from Him or enter into Him. Nor does it mean that
  you exist, or that your attributes exist in this way. You never were, nor will be: not by yourself,
  nor in Him, nor with Him. You are neither passing away nor still existing. You are He, and He is you,
  without any of these qualifications. If you know your existence in this way, then you know God; if not,
  then not.


  Most of those who know God make the passing away of existence, and the passing away of that passing
  away, a condition of knowing God—exalted is He. That is a plain error and oversight. Knowledge of God
  does not require the passing away of existence, nor the passing away of its passing away. For the thing
  has no existence, and what has no existence cannot pass away; passing away comes only after existence
  has been asserted. If you know yourself without existence or passing away, then you know God; if not,
  then not.


  To make knowledge of God conditional on the passing away of existence and of that passing away is to
  assert association. If you make knowledge of God depend on these, then existence belongs to other than
  God, as does its opposite—and this is plain association. For the Prophet said, “Whoever knows himself
  knows his Lord”; he did not say, “Whoever passes away from himself knows his Lord.” To affirm an other
  contradicts its passing away; and what may not be affirmed may not be said to pass away. Your existence
  is nothing, and nothing cannot be added to anything: neither passing nor unpassing, neither existent
  nor non-existent.'
commentary: 'The passage makes its most contested claim by refusing to treat fanāʾ—often rendered “annihilation”—as
  the ladder to divine knowledge. Its argument is severe: if a self must first be extinguished, then it
  must have possessed an independent reality capable of extinction. That prior assertion of an “other”
  beside God is, for the author, precisely shirk, association. In this waḥdat al-wujūd idiom, self-knowledge
  is not the discovery of a divine substance hidden inside an individual, nor a merger of two beings.
  It is the collapse of the claim that the individual possesses being in its own right. Thus “you are
  He” is immediately fenced about with denials of entry, exit, mixture, and spatial relation. The text
  wants neither incarnation nor union, but an uncompromising account of God as the sole reality of being.
  Its polemic against fellow mystics is notable: even the refined doctrine of “the annihilation of annihilation”
  can preserve the very duality it seeks to overcome, if there remains a real self that first vanishes.
  The attributed saying, “Whoever knows himself knows his Lord,” becomes a diagnostic: know the self as
  radically non-self-subsisting, and the Lord is known as the One without a second. This is metaphysical
  self-knowledge, not ordinary introspection—and it remains the treatise’s daring, controversial move.'
insight: ''
practice: Today, when you notice yourself claiming credit, control, or self-sufficiency, pause and name
  one concrete dependency—breath, food, another person, circumstance—and quietly release the claim that
  your being stands by itself.
sanskrit_devanagari: 'ولهذا قال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي، مَن عرف نفسَه فقد عرف ربَّه."[22]
  وقال – صلى الله عليه وسلم –: "عرفت ربِّي بربِّي." أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل»
  أنت هو بلا أنت: لا هو داخل فيك ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك موجود
  وصفتك هكذا أبدًا: غني به. إنك ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود.
  أنت هو، وهو أنت، بلا علَّة من هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.


  وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء[23] – وذلك غلط وسهو واضح: فإن
  معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود له، وما لا وجود
  له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ الله. – وإلا
  فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم.'
