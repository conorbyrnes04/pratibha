- kind: key_terms
  label: Key Terms
  items:
  - term: معرفة
    definition: ʿ-r-f, “to recognize or know” -> direct recognition of the self’s non-independent reality
      and thereby of God -> more than the default gloss “knowledge,” it implies a knowing acquaintance
      or disclosure.
  - term: فناء
    definition: f-n-y, “to pass away, perish” -> the author rejects making mystical extinction a prerequisite
      for knowing God -> not merely emotional ego-loss, but a technical claim about whether finite being
      was ever independently real.
  - term: فناء الفناء
    definition: “the passing away of passing away” -> a second-order mystical formula rejected here because
      it can imply that an existent self first underwent extinction -> more precise than the default gloss
      “annihilation of annihilation.”
  - term: الشرك
    definition: sh-r-k, “sharing, partnership” -> positing any being or reality alongside God, even one
      later said to vanish -> not simply overt idolatry, but a metaphysical attribution of independent
      existence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supplies the Qur’anic grammar
      of an all-encompassing divine reality that the treatise develops.
    divergence: The Qur’anic verse does not itself state that creatures have no reality or that self-knowledge
      entails the identity-language used here.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” is frequently invoked in Sufi reflection on the
      non-abiding character of all that is other than God.
    divergence: 'This passage presses beyond temporal perishing: it argues that what lacks independent
      existence cannot literally undergo extinction at all.'
  - citation: 'Ḥadīth: “Whoever knows himself knows his Lord”'
    resonance: The saying became a central Sufi maxim for linking self-knowledge with knowledge of God.
    divergence: Its status as a securely authenticated Prophetic hadith is disputed, while this treatise
      gives it a highly specific nondual metaphysical interpretation.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice yourself claiming credit, control, or self-sufficiency, pause and name
    one concrete dependency—breath, food, another person, circumstance—and quietly release the claim that
    your being stands by itself.
