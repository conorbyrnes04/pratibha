work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p033
unit_label: 'Pearl #33'
title: Nothingness Cannot Relate to Anything
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- self
source_excerpt: He did not say, Whoever annihilates their self, knows their Lord. Your being is nothing
  and whatever is nothing cannot be placed in relationship to anything else, whether it is capable of
  passing away or not and whether it is existent or nonexistent.
translation_literal: For the Prophet (peace be upon him) said, "Whoever knows himself," and did not say,
  "Whoever makes himself cease to be." For the affirmation of the other makes its extinction impossible,
  and conversely, that whose affirmation is not allowable — its extinction is not allowable either. Your
  existence is nothing, and nothing cannot be added to something, whether that something is perishing
  or unperishing, existent or non-existent. The Prophet points to the fact that you are non-existent now,
  just as you were non-existent before the Creation. For now is past eternity, and now is future eternity,
  and now is past time. And God — whose name be exalted — is the existence of past eternity, the existence
  of future eternity, and the existence of past time, yet without past eternity, future eternity, or past
  time ever existing. For were it not so, He would not be by Himself without any partner; and it is indispensable
  that He be by Himself without any partner. His so-called 'partner' would be one whose existence lay
  in his own essence rather than in the existence of God, and whoever were in that position would not
  be dependent upon Him — in which case there would be a second Lord, which is absurd. God, whose name
  be exalted, can have no partner, no like, and no equal.
commentary: 'This passage strikes at the heart of the treatise''s teaching on waḥdat al-wujūd, the oneness
  of being. The author draws a decisive contrast between the Prophet''s words — "Whoever knows himself
  knows his Lord" — and the phrase many aspirants substitute for it: "Whoever annihilates himself." The
  critique is precise: to speak of annihilating or ''ceasing to be'' presupposes that there was a real,
  independent self to be annihilated. But such affirmation is exactly what tawḥīd forbids. If your existence
  were genuinely something, it could not be extinguished; and if it is genuinely nothing, there is nothing
  there to extinguish. Either way, the whole drama of ''passing away'' collapses. The key logical move
  is that nothingness cannot be placed in relationship to anything: what is truly nothing cannot be added
  to, subtracted from, joined with, or separated from God. To insist on annihilation is therefore to smuggle
  in a second existence alongside God — a hidden polytheism (shirk). The author reframes the spiritual
  path not as the destruction of a real self but as the removal of ignorance concerning a self that was
  never independently real. God alone possesses necessary existence; He is the very reality underlying
  past eternity, future eternity, and present time, without any of these being co-eternal beings beside
  Him. Self-knowledge, then, is realizing that one never was a separate ''partner'' to the Lord in the
  first place.


  Key Terms


  **waḥdat al-wujūd** — The oneness of being; the doctrine that there is only one true existence, that
  of God, and nothing possesses independent existence alongside Him.

  **fanāʾ** — Literally ''passing away'' or annihilation; the author critiques treating it as the erasure
  of a real self, since that assumes an independent existence God does not permit.

  **shirk** — Associating a partner with God; here extended to the subtle error of affirming any independent
  existence beside God, even one''s own self.'
insight: ''
practice: 'Whisper the words "knows himself" — not "annihilates himself" — on each in-breath, and let
  the correction land: there is no self here to first build up and then destroy, only a knowing that was
  never a thing beside God.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له. وواجب أن يكون وحده لا شريك له: فإن "شريكه" هو الذي يكون وجودُه بذاته، لا بوجود الله؛
  ومَن يكن كذلك لم يكن محتاجًا إليه، فيكون إذًا ربًّا ثانيًا – وذلك محال: فليس لله شريك ولا ندٌّ ولا كفؤ.
  ومَن رأى شيئًا مع الله أو من الله أو في الله – وذلك الشيء يحتاج إلى الله بالربوبية – فقد جعل ذلك الشيء
  أيضًا شريكًا يحتاج إلى الله بالربوبية. ومن جوَّزَ أن يكون مع الله شيءٌ يقوم بنفسه، أو يقوم به، أو هو
  فانٍ عن وجوده أو عن فنائه، فهو بعدُ ما شمَّ رائحة معرفة النفس، لأن مَن جوَّزَ أن يكون موجودًا سواه،
  قائمًا به، فيه يصير فانيًا في فنائه، فتسلسل الفناء بالفناء، – وذلك شِرْك بعد شِرْك، وليس بمعرفة النفس،
  – هو مُشْرِك، لا عارف بالله ولا بنفسه.'
sanskrit_iast: 'wa akthar al-ʿurrāf ʾaḍāfū maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ
  – wa dhālika ghalṭ wa sahw wāḍiḥ: faʾinna maʿrifat Allāh – taʿālā – lā taḥtāj ilā fanāʾ al-wujūd wa
  lā ilā fanāʾ fanāʾih, liʾanna al-shayʾ lā wujūd lahu, wa mā lā wujūd lahu lā fanāʾ lahu; faʾinna al-fanāʾ
  baʿda ʾithbāt al-wujūd. fa-idhā ʿarafta nafsak bilā wujūd wa lā fanāʾ faqad ʿarafta Allāh. – wa illā
  fa-lā.


  wa fī ʾiḍāfat maʿrifat Allāh – taʿālā – ilā fanāʾ al-wujūd wa ilā fanāʾ fanāʾih ʾithbāt al-shirk, liʾannak
  idhā ʾaḍafta maʿrifat Allāh ilā fanāʾ al-wujūd wa fanāʾ al-fanāʾ, kāna al-wujūd li-ghayr Allāh wa naqīḍuh
  – wa hunāka shirk wāḍiḥ, liʾanna al-nabī – ṣallā Allāh ʿalayh wa sallam – qāla: "man ʿarafa nafsahu
  faqad ʿarafa rabbahu," wa lam yaqūl: "man fanī ʿan nafsihi ʿarafa rabbahu." faʾinna ʾithbāt al-ghayr
  yunāqiḍ fanāʾahu, wa mā lā yajāz thubūtuh lā yajāz fanāʾuh. wujūdak lā shayʾ, wa al-lā shayʾ lā yuḍāf
  ilā shayʾ, lā fān wa lā ghayr fān, wa lā mawjūd wa lā maʿdūm. "anta" al-ān kamā kunta maʿdaman qabla
  al-takwīn. fa-al-ān al-ʾazal, wa al-ān al-ʾabad, wa al-ān al-qidam. fa-Allāh huwa wujūd al-ʾazal wa
  wujūd al-ʾabad wa wujūd al-qidam; fa-innahu bilā wujūd al-ʾazal wa al-ʾabad wa al-qidam lam yakun kathālika
  mā kāna waḥdahu lā sharīk lahu. wa wājib an yakūna waḥdahu lā sharīk lahu: fa-ʾinna "sharīkuhu" huwa
  alladhī yakūn wujūduhu bi-dhātihi, lā bi-wujūd Allāh; wa man yakun kathālika lam yakun muḥtājān ilayh,
  fa-yakūn idhān rabbān thānī – wa dhālika muḥāl: fa-laysa li-Allāh sharīk wa lā nadd wa lā kufūʾ. wa
  man rāʾa shayʾan maʿ Allāh aw min Allāh aw fī Allāh – wa dhālika al-shayʾ yaḥtāj ilā Allāh bi-l-rubūbiyya
  – faqad jaʿala dhālika al-shayʾ ayḍan sharīkan yaḥtāj ilā Allāh bi-l-rubūbiyya. wa man jawwaza an yakūna
  maʿ Allāh shayʾun yaqūm binafsihi, aw yaqūm bihi, aw huwa fān ʿan wujūdihi aw ʿan fanāʾih, fa-huwa baʿdū
  mā shamma rāʾiḥat maʿrifat al-nafs, liʾanna man jawwaza an yakūna mawjūdān siwāh, qāʾimān bihi, fīhi
  yaṣīr fānīan fī fanāʾih, fa-tasalsal al-fanāʾ bi-l-fanāʾ, – wa dhālika shirk baʿda shirk, wa laysa bi-maʿrifat
  al-nafs, – huwa mushrik, lā ʿārif bi-Allāh wa lā bi-nafsihi.'
