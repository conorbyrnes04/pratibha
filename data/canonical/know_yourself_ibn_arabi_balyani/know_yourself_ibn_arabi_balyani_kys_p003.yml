unit_label: God Is Known Only by Himself
title: God Is Known Only by Himself
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
- way
source_excerpt: Understand this so as not to make the mistake of those who believe in incarnation. He
  is not in anything and no thing is in Him, whether entering into Him or coming out of Him. It is in
  this way that you should know Him and not through theoretical knowledge, reason, understanding or conjecture,
  nor with the senses, the external eye or interior sight or perception. No one sees Him except Himself,
  no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: 'Understand this, therefore, lest you fall into the error of those who believe in
  indwelling. He is not in a thing, nor is a thing in Him, whether entering in or proceeding forth. You
  must know Him in this manner: not by knowledge, nor intellect, nor understanding, nor imagination, nor
  the outward sense, nor the inward eye, nor perception. None sees Him except Himself; none perceives
  Him except Himself; none knows Him except Himself, by Himself.'
commentary: 'The claim is uncompromising: God cannot be located in a thing, contained by a thing, or apprehended
  by a human faculty. The warning against ḥulūl rejects the notion that the divine essence literally enters
  creatures, just as it rejects the reverse image of creatures entering or departing God. For this text,
  waḥdat al-wujūd is not a theory of spatial fusion between two already-existing realities. It denies
  that creaturely “otherness” has the independent standing required for either containment or union. Hence
  self-knowledge as knowledge of the Lord does not mean that an individual ego discovers itself to be
  God. It means that the claimant of separate knowing is unmasked: God alone is seer, known, and knowing.
  The contested move lies precisely here. Language of divine self-disclosure can preserve transcendence
  by refusing every “how” and “where,” yet it can also seem to erase the creature–Creator distinction
  on which many theologians insist. The passage protects itself by negation: no indwelling, no exit, no
  sensory or intellectual capture. Its realization is not possession of God as an object, but the collapse
  of the assumption that God stands before a separate subject as an object of cognition.'
insight: ''
practice: Today, when you notice yourself trying to picture, possess, or explain God, pause once and release
  that image; say inwardly, “You are not contained by my knowing,” then return to the task before you.
sanskrit_devanagari: 'فافهم هذا لئلا تقع في غلط الحلولية.


  لا هو في شيء، ولا شيء فيه، لا داخلاً ولا خارجًا. ينبغي أن نعرفه بهذه الصفة، لا بالعلم ولا بالعقل، ولا
  بالفهم ولا بالوهم ولا بالعين، ولا بالحسِّ الظاهر ولا بالعين الباطن ولا بالإدراك. لا يراه إلا هو، ولا
  يدركه إلا هو، ولا يعلمه إلا هو بنفسه'
