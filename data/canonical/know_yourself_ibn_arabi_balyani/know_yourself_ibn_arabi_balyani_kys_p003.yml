source_excerpt: Understand this so as not to make the mistake of those who believe in incarnation. He is not in anything and
  no thing is in Him, whether entering into Him or coming out of Him. It is in this way that you should know Him and not through
  theoretical knowledge, reason, understanding or conjecture, nor with the senses, the external eye or interior sight or perception.
  No one sees Him except Himself, no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: Understand this so as not to make the mistake of those who believe in incarnation. He is not in anything
