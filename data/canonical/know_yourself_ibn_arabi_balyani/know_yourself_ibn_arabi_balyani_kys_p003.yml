- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: God cannot be located in a thing, contained by a thing, or apprehended
    by a human faculty. The warning against ḥulūl rejects the notion that the divine essence literally
    enters creatures, just as it rejects the reverse image of creatures entering or departing God. For
    this text, waḥdat al-wujūd is not a theory of spatial fusion between two already-existing realities.
    It denies that creaturely “otherness” has the independent standing required for either containment
    or union. Hence self-knowledge as knowledge of the Lord does not mean that an individual ego discovers
    itself to be God. It means that the claimant of separate knowing is unmasked: God alone is seer, known,
    and knowing. The contested move lies precisely here. Language of divine self-disclosure can preserve
    transcendence by refusing every “how” and “where,” yet it can also seem to erase the creature–Creator
    distinction on which many theologians insist. The passage protects itself by negation: no indwelling,
    no exit, no sensory or intellectual capture. Its realization is not possession of God as an object,
    but the collapse of the assumption that God stands before a separate subject as an object of cognition.'
- kind: key_terms
  label: Key Terms
  items:
  - term: الحلولية
    definition: ḥ-l-l, to alight, dwell, or be installed -> advocates of divine indwelling in a creature
      -> more specific and stronger than the default gloss “incarnation”; the target is metaphysical location
      or containment.
  - term: شيء
    definition: shayʾ, a thing, entity, or anything whatever -> neither God is “in” a thing nor a thing
      “in” God -> not merely a material object, but any determinate other that could establish a relation
      of container and contained.
  - term: الإدراك
    definition: 'd-r-k, to catch up with, reach, or comprehend -> perceptual or cognitive grasp of God
      is denied -> more than ordinary “perception”: it suggests attaining and encompassing its object.'
  - term: بنفسه
    definition: bi-nafsihi, by Himself / through His own self -> God knows Himself without an external
      knower or instrument -> not simply reflexive consciousness, but divine self-sufficiency in knowing.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 6:103
    resonance: “Sight does not comprehend Him, while He comprehends sight” closely supports the denial
      that any creaturely seeing encloses God.
    divergence: The passage extends the Qur’anic formulation into a comprehensive account in which seeing,
      perceiving, and knowing are all God’s own act.
  - citation: Qur’an 57:3
    resonance: The divine names “the First and the Last, the Outward and the Inward” frame God beyond
      ordinary coordinates and oppositions.
    divergence: Here that transcendence is used directly against spatial relation—being in, entering,
      or leaving a thing.
  - citation: Junayd of Baghdad, sayings on tawḥīd
    resonance: Junayd’s sober Sufi insistence on God’s incomparability resonates with the refusal to describe
      divine reality through creaturely relations.
    divergence: This treatise presses the language of non-otherness further, making its ontology more
      vulnerable to charges of collapsing distinction.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice yourself trying to picture, possess, or explain God, pause once and release
    that image; say inwardly, “You are not contained by my knowing,” then return to the task before you.
