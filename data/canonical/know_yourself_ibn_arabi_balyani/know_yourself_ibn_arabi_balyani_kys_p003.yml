source_excerpt: Understand this so as not to make the mistake of those who believe in incarnation. He
  is not in anything and no thing is in Him, whether entering into Him or coming out of Him. It is in
  this way that you should know Him and not through theoretical knowledge, reason, understanding or conjecture,
  nor with the senses, the external eye or interior sight or perception. No one sees Him except Himself,
  no one reaches Him except Himself and no one knows Him except Himself.
translation_literal: 'Understand this, so that you do not fall into the error of those who believe in
  incarnations of God: He is not in a thing, nor is a thing in Him, whether entering in or proceeding
  forth. You must know Him in this way — not by knowledge (''ilm), nor by intellect, nor by understanding,
  nor by imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception.
  None sees Him save Himself; none perceives Him save Himself. By Himself He sees Himself, and by Himself
  He knows Himself. None sees Him other than He, and none perceives Him other than He. His veil is only
  a part of His oneness; nothing veils Him other than He. His veil is only the concealment of His existence
  in His oneness, without any quality.'
commentary: 'This passage marks a decisive turn: the object of knowledge and the knower collapse into
  one. The treatise first clears away two errors. The first is incarnationism (ḥulūl) — the belief that
  God enters into a creature or a creature into God. The author denies any spatial or relational language:
  He is neither ''in'' a thing nor a thing ''in'' Him, for such talk still presumes two existents. The
  second, subtler, is the assumption that the created faculties — reason, imagination, sense, even ''inner
  sight'' — could reach God as an object among objects. Every faculty listed is a created instrument,
  and no created instrument can grasp the uncreated. The radical claim of waḥdat al-wujūd follows: since
  there is only one existence, the seeing, knowing, and perceiving of God can only be God''s own act.
  ''By Himself He knows Himself.'' Knowledge here is not a bridge from a subject to a distant object;
  it is the single Reality recognizing itself. The ''veil'' is likewise reinterpreted — it is not something
  other than God obstructing Him, but merely His oneness concealing itself in its own simplicity. Thus
  self-knowledge is not the acquisition of information but the falling-away of the illusion that there
  is a separate self to do the knowing.


  Key Terms


  **ḥulūl** — Incarnation or indwelling — the belief that God enters into a created form; explicitly rejected
  here as still positing two separate existences.

  **maʿrifa** — Direct, unmediated knowing of God, distinguished from discursive knowledge (''ilm), reason,
  or sense-perception; ultimately God''s knowledge of Himself.

  **ḥijāb** — Veil — here understood not as an external barrier but as God''s own oneness concealing itself,
  so that nothing other than He ever veils Him.'
insight: ''
practice: Sit quietly and attempt to 'know' your own awareness. Notice that every faculty you reach for
  — thought, image, sensation, inner looking — is itself an object appearing within awareness, not awareness
  itself. Each time you try to grasp the knower as an object, gently release the attempt and rest in the
  bare fact of knowing, without turning it into something known. Let the search for an object dissolve
  into the recognition that the seeker and the sought are not two.
