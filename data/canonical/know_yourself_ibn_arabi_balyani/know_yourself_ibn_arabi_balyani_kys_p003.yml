- kind: original
  label: Original
  body: 'فافهم هذا لئلا تقع في غلط الحلولية.


    لا هو في شيء، ولا شيء فيه، لا داخلاً ولا خارجًا. ينبغي أن نعرفه بهذه الصفة، لا بالعلم ولا بالعقل،
