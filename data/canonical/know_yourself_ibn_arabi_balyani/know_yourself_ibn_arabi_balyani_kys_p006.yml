- kind: commentary
  label: Pratibha Commentary
  body: 'The passage presses an uncompromising claim: God cannot be made into an object standing before
    a human knower. Sight, perception, and knowledge ordinarily imply a relation between two—the one who
    knows and the thing known. Here that duality is denied at its root. In the language later associated
    with waḥdat al-wujūd, only the Real (al-Ḥaqq) is truly present to the Real; divine self-knowledge
