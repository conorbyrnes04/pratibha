    union. Its intended point is not possession of divinity by the ego, but the removal of the ego’s claim
    to autonomous vision.'
- kind: key_terms
  label: Key Terms
  items:
  - term: يرى
    definition: 'from r-ʾ-y, ‘to see’ -> God sees Himself -> more than physical sight: it includes immediate
      disclosure, not an observer’s visual act.'
  - term: يدركه
    definition: from d-r-k, ‘to catch up with, attain, encompass’ -> none attains or comprehends Him except
      He -> missed by the default gloss ‘perceive,’ which can sound like ordinary sensation.
  - term: يعلمه
    definition: from ʿ-l-m, ‘to know’ -> divine knowing belongs to God alone and is exercised by Himself
      -> not acquired information or conceptual theology.
  - term: بنفسه
    definition: bi-nafsihi, ‘by/through Himself’ -> both the means and locus of divine self-knowledge
      -> not reflexive isolation, but denial of any independent instrument of knowledge.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan 6:103
    resonance: “Sight perceives Him not, but He perceives sight” closely supports the asymmetry between
      creaturely seeing and divine perception.
    divergence: The verse preserves the distinction between God and perceiving creatures; this passage
      intensifies it into the claim that only God sees God.
  - citation: Qurʾan 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” underlies the treatise’s refusal
      to locate God as one object among others.
    divergence: The Qurʾanic formula need not entail the treatise’s sweeping identification of every knower’s
      reality with divine self-disclosure.
  - citation: Hadith qudsi, “I become his hearing … and his sight” (Ṣaḥīḥ al-Bukhārī)
    resonance: It depicts nearness to God through transformed hearing and sight, making divine agency
      central to human perception.
    divergence: The hadith concerns the devoted servant; this text makes the stronger ontological claim
      that no one other than God sees Him at all.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself claiming certainty about God, pause for one minute and replace
    the claim with: “My knowing does not contain the Real.”'
