- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: Both texts locate knowledge in the quality and direction of attention itself rather than in external content
      or objects. Ibn Arabi's 'no one knows Him except Himself' and the Siva Sutra's 'sustained attention is knowledge' both
      make attention the primary instrument and locus of knowing.
    divergence: Ibn Arabi emphasizes a reflexive turning inward toward the divine Self as the sole knower, while the Siva
      Sutra presents attention as a universal epistemological principle that constitutes knowledge itself, without necessarily
      invoking theological reflexivity.
    passage_id: siva_sutra.ss_ii_12
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe knowledge arising through a reversal of ordinary attention: Ibn Arabi''s inward turn away
      from ''passing content'' parallels the Yoga Spandakarika''s principle that the sacred tremor becomes perceptible precisely
      when attention shifts from distraction to ardent striving—a reorientation of the perceiving faculty itself.'
    divergence: Ibn Arabi frames this as a metaphysical necessity (only the Self knows itself), while the Yoga Spandakarika
      frames it as a phenomenological technique (effort and angle of perception reveal what was obscured by inattention).
    passage_id: yoga_spandakarika.sp_36
  - citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
    resonance: Both passages establish a correspondence between a subtle inner principle and a method of inquiry that transforms
      that principle into a complete path of self-knowledge. Ibn Arabi's inward return to the knower parallels the Mandukya's
      mapping of consciousness-states onto Om, making the vehicle of inquiry itself a mirror of what is sought.
    divergence: Ibn Arabi emphasizes the exclusivity and unity of the divine knower, while the Mandukya employs systematic
      analytical correspondence and phonetic meditation as the structural method.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
