- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.9
    resonance: 'Both passages dissolve individual identity through a collapse of temporal or phenomenal
      boundaries: Ibn Arabi collapses past-present-future into an eternal now where the self is ''nonexistent,''
      while Chāndogya VI.9 describes creatures merging into the True and ceasing to recognize individual
      forms in death or deep sleep. Each uses a threshold state (timelessness vs. sleep/death) to reveal
      the illusory nature of separate selfhood.'
    divergence: Ibn Arabi grounds this in metaphysical nonexistence and the eternal present as a direct
      pointer to truth; the Upaniṣad frames it as a merger into Brahman through natural dissolution, emphasizing
      continuity of being rather than negation.
    passage_id: chāndogya_upaniṣad.chu_vi_09
  - citation: Patañjali Yoga Sūtras 4.4
    resonance: 'Both identify ego-sense (ahaṃkāra / ''I-making'') as the generative principle of apparent
      multiplicity: Patañjali states the ego-sense alone creates minds, while Ibn Arabi''s ''nonexistence''
      points to the illusory nature of the separate self that generates the illusion of time and individuation.
      Each locates the root of phenomenal appearance in a false sense of autonomous agency.'
    divergence: Patañjali treats ego-sense as a technical mechanism within the yoga system of mental modification;
      Ibn Arabi frames nonexistence as a mystical realization of one's actual metaphysical status before
      and after creation, emphasizing prophetic unveiling over systematic analysis.
    passage_id: patañjali_yoga_sūtras.ys_4_04
