source_excerpt: The Prophet alluded to the fact that you are nonexistent now as you were nonexistent before
  creation, because now is eternity-without-beginning and now is eternity-without-end and now is timelessness.
  God is the very being of eternity-without-beginning, eternity-without-end and timelessness even though
  in reality there is no eternity-without-beginning, eternity-with-out-end or timelessness.
translation_literal: 'The Prophet points to the fact that you are non-existent now, just as you were non-existent
  before the creation. For now is past eternity, now is future eternity, and now is past time. And God—whose
  name be exalted—is the existence of past eternity, the existence of future eternity, and the existence
  of past time, yet without past eternity, future eternity, or past time ever existing. For if it were
  not so, He would not be by Himself without any partner, and it is indispensable that He should be by
  Himself without any partner. For His ''partner'' would be one whose existence lay in his own essence,
  not in the existence of God; and whoever occupied that position would not be dependent upon Him. In
  that case there would be a second Lord, which is absurd: God—whose name be exalted—can have no partner,
  nor like, nor equal.'
commentary: 'This passage delivers the treatise''s most radical teaching on time and being. The famous
  Prophetic saying, ''Whoso knoweth himself knoweth his Lord,'' is unfolded here into a meditation on
  your own non-existence. The author insists that you are non-existent now, precisely as you were before
  creation—not that you were once real and then vanished, but that you never possessed an independent
  existence at all. The subtle move is the collapse of past eternity (azal), future eternity (abad), and
  time into a single ''now.'' These three temporal frames have no reality in themselves; they are only
  names for the one undivided reality of God, who is their very being. This is the heart of waḥdat al-wujūd:
  there is only one existence, the Real''s, and what we call time, self, and world are its self-disclosures,
  not rival beings standing beside it. The logic is protective of tawḥīd: if any created thing possessed
  existence rooted in its own essence, it would be self-subsistent, independent of God, and therefore
  a second Lord—the very definition of shirk (associating partners). By denying the creature any autonomous
  being, the author guards the absolute oneness and singularity of God. The passage thus reframes eternity
  not as something you attain but as the ground you already stand upon; your nonexistence is the mirror
  in which divine eternity is reflected without obstruction.


  Key Terms


  **azal / abad** — Eternity-without-beginning (azal, past eternity) and eternity-without-end (abad, future
  eternity); here reduced to a single ''now,'' names for God''s one undivided being rather than real durations.

  **tawḥīd** — The affirmation of divine oneness; in this treatise, the recognition that there is only
  one existence—God''s—so that attributing independent being to any creature is shirk (idolatry).

  **wujūd** — Being or existence; the treatise''s central term for the single reality belonging to God
  alone, of which all apparent things are manifestations without possessing existence in themselves.'
insight: ''
practice: 'Sit quietly and bring attention to this present moment—the bare ''now.'' Notice that the past
  you remember exists only as thought arising now, and the future you anticipate only as thought arising
  now. Let the imagined line of time dissolve into this single present. Then turn the same inquiry upon
  yourself: search for the ''you'' that persists across time and find that it too is only a present appearance,
  with no independent substance you can grasp. Rest in that unfindability, letting it become not a loss
  but an opening—the one Reality present as this very moment, needing no future eternity to be complete.'
