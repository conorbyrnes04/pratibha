    that this refusal can sound as though moral agency, devotion, and creaturehood are merely verbal appearances.'
- kind: key_terms
  label: Key Terms
  items:
  - term: نفس
    definition: nafs, “self” or “soul,” from a root associated with breath -> here it means one’s supposed
      separate reality, not merely the lower ego -> the default gloss “soul” misses the ontological claim.
  - term: فناء
    definition: fanāʾ, “passing away” or “perishing” -> the text rejects making it a stage required for
      knowing God -> “annihilation” can wrongly suggest an actually existing entity is destroyed.
  - term: فناء الفناء
    definition: fanāʾ al-fanāʾ, “the passing away of passing away” -> a reflexive mystical formulation
      the author contests -> “annihilation of annihilation” misses its polemical role here.
  - term: الشرك
    definition: shirk, “association” or assigning partnership -> affirming any being alongside God is
      treated as its conceptual root -> “polytheism” can obscure this subtler metaphysical accusation.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supports the passage’s denial
      that temporal and spatial contrasts stand over against God.
    divergence: The Qur’anic verse does not itself state that created selves have no existence or condemn
      fanāʾ discourse as shirk.
  - citation: 'Hadith: “Whoever knows himself knows his Lord” (من عرف نفسه فقد عرف ربه)'
    resonance: The treatise makes this maxim the hinge between knowing the self’s non-independence and
      knowing divine oneness.
    divergence: Its status as a Prophetic hadith is disputed; the argument depends on its mystical reception
      rather than secure canonical authentication.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” is often read in Sufi traditions as pointing
      beyond transient beings to God alone.
    divergence: 'This passage goes further: it denies not only permanence to things but their independent
      existence even before any supposed perishing.'
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you say or think “my existence,” pause once and replace it inwardly with: “this life
    is not self-subsisting”; then let that recognition make one concrete act of gratitude or service less
    about defending yourself.'
