thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes: []
source_excerpt: The Prophet alluded to the fact that you are nonexistent now as you were nonexistent before
  creation, because now is eternity-without-beginning and now is eternity-without-end and now is timelessness.
  God is the very being of eternity-without-beginning, eternity-without-end and timelessness even though
  in reality there is no eternity-without-beginning, eternity-with-out-end or timelessness.
translation_literal: 'The Prophet—peace be upon him—points out by this that you are not you: rather, you
  are He, without you. He does not enter into you, nor proceed forth from you; nor do you proceed forth
  from Him, nor enter into Him. Nor does this mean that you, or your attributes, exist in any way. You
  never were, nor will you be: not by yourself, nor in Him, nor with Him. You are neither passing away
  nor existing. You are He, and He is you, without any of these limitations. If you know your existence
  in this way, then you know God; otherwise, not.


  Most of those who know God make the passing away of existence, and the passing away of that passing
  away, a condition for knowing God—exalted is He. This is a clear error and oversight. Knowledge of God
  does not require the passing away of existence, nor the passing away of its passing away; for the thing
  has no existence, and what has no existence has no passing away. Passing away follows upon affirming
  existence. If you know yourself without existence or passing away, then you know God; otherwise, not.


  To make knowledge of God depend on the passing away of existence and on the passing away of that passing
  away is to affirm association. For when you make knowledge of God depend on them, existence belongs
  to other than God, as does its opposite—and that is plain association. The Prophet—peace be upon him—said,
  “Whoever knows himself knows his Lord”; he did not say, “Whoever passes away from himself knows his
  Lord.” Affirming an other contradicts its passing away; and what may not be affirmed may not be said
  to pass away. Your existence is nothing, and nothing cannot be added to something: neither passing nor
  unpassing, neither existent nor nonexistent. You are now as you were nonexistent before creation. Now
  is pre-eternity; now is everlastingness; now is primordiality. God is the existence of pre-eternity,
  the existence of everlastingness, and the existence of primordiality; for without their existence He
  would not be as He is: One, without partner.'
commentary: 'The passage’s decisive claim is that self-knowledge is not a spiritual technique for destroying
  a real self, but recognition that the self never possessed independent being. Its target is a familiar
  Sufi sequence: first fanāʾ, the annihilation of the ego or creaturely existence, then fanāʾ al-fanāʾ,
  the disappearance even of awareness of that annihilation. The author calls this a mistake because annihilation
  presumes that something truly existed and then ceased. In his uncompromising waḥdat al-wujūd logic,
  that prior affirmation grants “other than God” a share of existence; it therefore becomes shirk, association.
  “Know yourself” means discern the contingency and nullity of the claimed autonomous “I,” not enact its
  extinction. The startling formula, “you are He, and He is you,” is immediately fenced about with denials
  of incarnation, indwelling, exit, entry, and reciprocal transformation. Yet those safeguards do not
  make the doctrine uncontroversial. Critics can reasonably say that its rhetoric collapses the Creator–creature
  distinction despite rejecting ḥulūl. The text’s wager is that divine oneness is protected only by refusing
  every independent reality to the world and self; its risk is that this refusal can sound as though moral
  agency, devotion, and creaturehood are merely verbal appearances.'
insight: ''
practice: 'Today, when you say or think “my existence,” pause once and replace it inwardly with: “this
  life is not self-subsisting”; then let that recognition make one concrete act of gratitude or service
  less about defending yourself.'
sanskrit_devanagari: 'أشار – صلى الله عليه وسلم – بذلك أنك لست أنت، «بل» أنت هو بلا أنت: لا هو داخل فيك
  ولا هو خارج منك، ولا أنت خارج منه ولا أنت داخل فيه؛ ولا بذلك أنك موجود وصفتك هكذا أبدًا: غني به. إنك
  ما كنت قط ولا تكون، لا بنفسك ولا فيه ولا معه، ولا أنت فانٍ ولا موجود. أنت هو، وهو أنت، بلا علَّة من
  هذه العلل. فإن عرفتَ وجودك بهذه الصفة فقد عرفتَ الله. – وإلا فلا.


  وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء[23] – وذلك غلط وسهو واضح: فإن
  معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود له، وما لا وجود
  له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ الله. – وإلا
  فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه." فإن إثبات الغير يناقض
  فناءه، وما لا يجوز ثبوتُه لا يجوز فناؤه. وجودك لا شيء، واللاشيء لا يُضاف إلى شيء، لا فانٍ ولا غير فانٍ،
  ولا موجود ولا معدوم. «أنت» الآن كما كنتَ معدَمًا قبل التكوين. فالآن الأزل، والآن الأبد، والآن القِدَم.
  فالله هو وجود الأزل ووجود الأبد ووجود القِدَم؛ فإنه بلا وجود الأزل والأبد والقِدَم لم يكن كذلك ما كان
  وحده لا شريك له.'
