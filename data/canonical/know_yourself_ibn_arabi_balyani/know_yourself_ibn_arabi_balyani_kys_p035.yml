- kind: key_terms
  label: Key Terms
  items:
  - term: wujūd (وجود)
    definition: 'Arabic wujūd ‘finding/being found; existence’ → being as what is found in God alone;
      creatures have no independent wujūd Here: This is the heart of waḥdat al-wujūd: there is only one
      existence, the Real''s, and what we call time, self, and world are its self-disclosures, not rival
      being… Trap: treating ‘existence’ as a neutral metaphysical predicate shared equally by God and
      world'
  - term: tawḥīd (توحيد)
    definition: 'Arabic tawḥīd from waḥḥada ‘to make/declare one’ → absolute oneness of the Real, radicalized
      here as sole agency and sole being Here: The logic is protective of tawḥīd: if any created thing
      possessed existence rooted in its own essence, it would be self-subsistent, independent of God,
      and the… Trap: hearing a creedal slogan rather than ontological exclusivity of wujūd'
    lemma_id: tawhid
    sense_id: tawhid.islamic
  - term: waḥdat al-wujūd
    definition: '‘unity of being/finding’ → the Real’s being is one; multiplicity is relational appearance,
      not rival substances Here: This is the heart of waḥdat al-wujūd: there is only one existence, the
      Real''s, and what we call time, self, and world are its self-disclosures, not rival being… Trap:
      pantheist collapse that erases servant/Lord distinction'
  - term: shirk (شرك)
    definition: '‘association/partnership’ → ascribing independent power or being to what is other-than-God
      Here: The logic is protective of tawḥīd: if any created thing possessed existence rooted in its
      own essence, it would be self-subsistent, independent of God, and the… Trap: narrowing to idol-worship
      while missing subtle self-ascription of agency'
  - term: maʿrifa (معرفة)
    definition: 'from ʿarafa ‘to know/recognize’ → gnosis as recognition of the Real’s sole agency, not
      informational theology Here: The affirmation of divine oneness; in this treatise, the recognition
      that there is only one existence—God''s—so that attributing independent being to any creatu… Trap:
      equating mystical knowing with accumulated doctrine'
  layer_provenance: editorial-enriched
