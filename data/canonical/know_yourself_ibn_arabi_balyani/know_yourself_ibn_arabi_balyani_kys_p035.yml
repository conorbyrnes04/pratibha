source_excerpt: The Prophet alluded to the fact that you are nonexistent now as you were nonexistent before creation, because
  now is eternity-without-beginning and now is eternity-without-end and now is timelessness. God is the very being of eternity-without-beginning,
  eternity-without-end and timelessness even though in reality there is no eternity-without-beginning, eternity-with-out-end
  or timelessness.
