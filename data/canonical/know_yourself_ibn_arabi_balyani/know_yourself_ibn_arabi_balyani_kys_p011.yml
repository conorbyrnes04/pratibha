- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: God cannot become an object possessed by a creature’s vision or
    knowledge. Even prophecy, sainthood, and angelic nearness do not establish a second knower standing
    before a known God. In the grammar of waḥdat al-wujūd, the sole reality and agency of knowing belong
    to the Real: God sees Himself and makes Himself known through forms that are conventionally called
    prophet, messenger, message, and speech. Thus self-knowledge is knowledge of the Lord not because
    an individual ego discovers a divine item within itself, but because the supposed independent knower
    is unmasked as lacking self-standing reality. The contested move arrives in the identification of
    every term of revelation with God: sender, envoy, recipient, and communication are said to be He.
    Read charitably, this denies that revelation is an event occurring between independently existing
