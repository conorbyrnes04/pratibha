- kind: practice
  label: Practice (Abhyasa)
  body: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts posit a universal principle (Logos/Divine Reality) that exists perpetually but
      remains inaccessible to ordinary perception; the barrier is not the principle's absence but humanity's
      habitual inattention to what is always already present.
    divergence: Heraclitus emphasizes the universal Logos as rational order that people fail to recognize
      despite hearing it; Ibn Arabi locates the barrier in the ego-self's inability to perceive the Divine
      except through receptive listening, a more explicitly mystical epistemology.
    passage_id: heraclitus_fragments.hfr_p002
  - citation: 'Vijnana Bhairava — Yukti #104'
    resonance: Both propose that sustained meditative attention to a principle—whether words naming the
      Divine or the Divine itself—collapses the distinction between knower and known, allowing direct
      realization rather than conceptual understanding.
    divergence: Yukti 104 uses verbal formulas and their meaning as the vehicle for non-dual recognition;
      Ibn Arabi's 'attentive listening' operates through silence and receptivity rather than active meditation
      on conceptual content.
    passage_id: vijnana_bhairava.yukti_104
  layer_provenance: generated_grounded
