unit_label: God Alone Is Seer, Knower, and Messenger
title: God Alone Is Seer, Knower, and Messenger
unit_type: teaching_passage
thesis: This line points to a deeper order that is received through attentive listening rather than conceptual
  noise.
themes:
- awareness
source_excerpt: No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows
  Him. His prophet is He, His messenger is He, His message is He and His word is He. He sent Himself from
  Himself, through Himself to Himself.
translation_literal: 'None sees Him other than He: no sent prophet, no perfected saint, and no angel brought
  near knows Him. His Prophet is He, His Messenger is He, His message is He, and His word is He. He sends
  Himself by Himself, from Himself to Himself.'
commentary: 'The claim is uncompromising: God cannot become an object possessed by a creature’s vision
  or knowledge. Even prophecy, sainthood, and angelic nearness do not establish a second knower standing
  before a known God. In the grammar of waḥdat al-wujūd, the sole reality and agency of knowing belong
  to the Real: God sees Himself and makes Himself known through forms that are conventionally called prophet,
  messenger, message, and speech. Thus self-knowledge is knowledge of the Lord not because an individual
  ego discovers a divine item within itself, but because the supposed independent knower is unmasked as
  lacking self-standing reality. The contested move arrives in the identification of every term of revelation
  with God: sender, envoy, recipient, and communication are said to be He. Read charitably, this denies
  that revelation is an event occurring between independently existing parties; it insists on divine self-disclosure.
  Read critically, it seems to erase the distinction between Creator and creature, and with it the ordinary
  theological meaning of prophetic mediation. The text itself resists a crude incarnationist reading by
  denying entry, exit, and mixture: it is not saying God occupies a prophet as one body occupies another,
  but that no reality, knowledge, or act stands outside the divine Reality.'
insight: ''
practice: 'Today, when you notice the thought “I alone am seeing and knowing,” pause for one minute and
  silently ask: “What in this moment is given rather than self-produced?”'
sanskrit_devanagari: 'لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه. نبيُّه هو،
  ورسوله هو، ورسالته هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه'
