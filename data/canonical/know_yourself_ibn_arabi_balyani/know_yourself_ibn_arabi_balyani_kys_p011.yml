source_excerpt: No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows
  Him. His prophet is He, His messenger is He, His message is He and His word is He. He sent Himself from
  Himself, through Himself to Himself.
translation_literal: No one other than He sees Him. No sent prophet, perfect saint or angel brought close
  knows Him. His prophet is He, His messenger is He, His message is He and His word is He. He sent Himself
  from Himself, through Himself to Himself.
commentary: This line points to a deeper order that is received through attentive listening rather than
  conceptual noise.
insight: ''
practice: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears
  it.
sanskrit_devanagari: 'لا يراه أحدٌ غيره: لا نبي مرسل، ولا ولي كامل، ولا مَلَك مقرَّب يعرفه. نبيُّه هو،
  ورسوله هو، ورسالته هو، وكلامه هو: أرسلَ نفسَه بنفسه من نفسه إلى نفسه'
