- kind: key_terms
  label: Key Terms
  items:
  - term: يراه
    definition: From r-ʾ-y, “to see” -> direct vision or apprehension of God -> more than ordinary visual
      sight; it includes the act of witnessing itself.
  - term: ولي كامل
    definition: Walī, from w-l-y, nearness, friendship, guardianship; kāmil, complete -> the fully realized
      saint -> not merely a morally excellent holy person, but one thought to have reached spiritual completion.
  - term: رسالة
    definition: From r-s-l, sending forth -> prophetic message or mission -> not just a text delivered
      by a messenger, but the very relation and act of divine sending.
  - term: نفسه
    definition: Nafs, self -> God’s own Self in the formula of self-sending -> not an individual psychological
      ego, the default modern sense of “self.”
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 53:11-18
    resonance: The vision passage grounds prophetic seeing in a disclosure that exceeds ordinary perception
      and culminates in signs of the Lord.
    divergence: The Qur'anic passage retains the prophet’s distinct role, whereas this treatise presses
      toward identity of seer, message, and sender.
  - citation: Qur'an 4:164
    resonance: God’s speaking to Moses affirms revelation as divine address rather than merely human religious
      reflection.
    divergence: The verse presents God speaking to a prophet; the present passage collapses the ordinary
      relational distinction into divine self-address.
  - citation: 'Hadith qudsi, Sahih Muslim: “I was sick and you did not visit Me”'
    resonance: Divine speech is heard through the vulnerable human other, making service to creatures
      answerable to God.
    divergence: The hadith sustains ethical address between servant and God; this text generalizes such
      language into a metaphysical assertion about all existence.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice the thought “I alone am seeing and knowing,” pause for one minute and
    silently ask: “What in this moment is given rather than self-produced?”'
