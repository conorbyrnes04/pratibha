source_excerpt: No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows
  Him. His prophet is He, His messenger is He, His message is He and His word is He. He sent Himself from
  Himself, through Himself to Himself.
translation_literal: 'Understand, therefore, so that you do not fall into the error of those who believe
  in incarnation: He is not in a thing, nor is a thing in Him, whether entering in or proceeding forth.
  You must know Him in this way — not by knowledge (''ilm), nor by intellect, nor by understanding, nor
  by imagination, nor by sense, nor by the outward eye, nor by the inward eye, nor by perception. None
  sees Him but Himself; none perceives Him but Himself. By Himself He sees Himself, and by Himself He
  knows Himself. None sees Him other than He, and none perceives Him other than He. His veil is a part
  of His oneness; nothing veils Him other than He. His veil is only the concealment of His existence in
  His oneness, without any quality. None sees Him other than He — no sent prophet, nor perfect saint,
  nor angel brought near, knows Him. His Prophet is He, His sending is He, and His word is He. He sent
  Himself, with Himself, to Himself. There was no mediator nor any means other than He. There is no difference
  between the Sender and the thing sent, and the one sent and the one to whom he is sent. The very existence
  of the prophetic message is His existence. There is no other, and there is no existence belonging to
  any other than He.'
commentary: 'This passage presses the doctrine of the oneness of being (waḥdat al-wujūd) to its sharpest
  point: since only God truly exists, only God can know God. The treatise first guards against a subtle
  error — imagining God as a thing ''inside'' creation or creation as a thing ''inside'' God (the error
  attributed to the incarnationists). Both spatial images secretly posit two existences. The author then
  systematically strips away every faculty by which we might claim to grasp the divine essence — reason,
  imagination, sense, even inward vision — not to induce despair but to dislodge the ego''s presumption
  that IT could be the knower. If God is the sole reality, then the seeing, knowing, and perceiving of
  God can only be God''s own act turned upon Himself. The striking image of the ''veil'' completes this:
  God is not hidden by something external to Himself; His only ''veil'' is His very oneness, the sheer
  intensity of His singular presence, which we mistake for absence. Finally, the collapse of prophet,
  message, sender, and recipient into one existence teaches that even revelation is not a bridge between
  two beings but God''s self-disclosure to Himself. The ''you'' who seeks knowledge is invited to recognize
  that the very capacity to know is borrowed — indeed it is His.


  Key Terms


  **ḥijāb (veil)** — The ''veil'' between the seeker and God; here reinterpreted not as a barrier external
  to God but as His very oneness — nothing hides Him except Himself.

  **maʿrifa** — Direct, intuitive knowing of God, contrasted with discursive ''ilm; in this text it is
  ultimately God''s own self-knowledge rather than a human achievement.

  **tawḥīd** — The affirmation of God''s absolute oneness; radicalized here to mean that no existence
  at all belongs to any other than God.'
insight: ''
practice: As you exhale, let the word 'He' ride out on the breath — not as something you say, but as the
  breath saying itself through you. When the next breath comes without your ordering it, feel that the
  breathing was never yours to do.
