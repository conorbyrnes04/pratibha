    from beside God.'
- kind: key_terms
  label: Key Terms
  items:
  - term: فناء
    definition: fanāʾ, from the root f-n-y, “to pass away” -> the alleged extinction of existence and
      then of that extinction -> not merely humility or ego-loss, but a metaphysical claim the passage
      rejects as unnecessary.
  - term: وجود
    definition: 'wujūd, from w-j-d, “being, finding” -> supposedly independent creaturely existence ->
      more than the default gloss “existence”: it is the very status whose attribution to other-than-God
      is at stake.'
  - term: الشرك
    definition: shirk, from sh-r-k, “to share, associate” -> positing an existence other than God, even
      one later said to vanish -> not only overt idol worship, but metaphysical association.
  - term: نفسه
    definition: nafs, “self, soul, person” -> the self known in the saying attributed to the Prophet ->
      not simply the psychological ego, but the apparent reality taken to stand beside God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 57:3
    resonance: “He is the First and the Last, the Outward and the Inward” supports the treatise’s refusal
      to locate a second independent reality outside the divine all-encompassingness.
    divergence: The Qur’anic verse does not itself state that created things lack existence or condemn
      fanāʾ as shirk.
  - citation: Qur’an 28:88
    resonance: “Everything is perishing except His Face” is readily read alongside the claim that all
      apparent being lacks independent permanence.
    divergence: 'The passage goes further: it says things do not first exist and then perish, whereas
      the verse’s standard readings preserve creation’s contingent reality.'
  - citation: “Whoever knows himself knows his Lord” (man ʿarafa nafsahu faqad ʿarafa rabbahu)
    resonance: The author makes this maxim the hinge of self-knowledge as direct recognition of divine
      reality.
    divergence: Though famous in Sufi literature, the saying is not generally established as a sound Prophetic
      hadith; its meaning has been interpreted in many less ontologically radical ways.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself claiming “my success,” “my failure,” or “my possession,” pause
    once and replace the claim inwardly with: “This has no independent standing.” Then let that recognition
    make you more responsible and less self-important in the next action you take.'
