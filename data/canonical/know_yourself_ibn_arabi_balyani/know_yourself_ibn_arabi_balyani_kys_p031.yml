source_excerpt: By making the knowledge of God dependent on the passing away of your existence and the
  passing away of that passing away, there is an affirmation of something other than God. The Prophet
  said, Whoever knows their self, knows their Lord.
translation_literal: By making the knowledge of God conditional upon the ceasing of existence, and upon
  the ceasing of that ceasing, there is involved an assertion of polytheism. For the Prophet (peace be
  upon him) said, "Whoso knoweth himself," and did not say, "Whoso maketh himself to cease to be." For
  the affirmation of the other makes its extinction impossible; and that whose affirmation is not allowable,
  its extinction is not allowable either. Your existence is nothing, and nothing cannot be added to something,
  whether that something be perishing or unperishing, existent or non-existent. The Prophet points to
  the fact that you are non-existent now, just as you were non-existent before the Creation. For now is
  past eternity, and now is future eternity, and now is present time. And God (whose name be exalted)
  is the existence of past eternity, of future eternity, and of present time — yet without past eternity,
  future eternity, or present time ever having existed. For if it were not so, He would not be by Himself
  without any partner, and it is indispensable that He should be by Himself without any partner.
commentary: 'This passage strikes at a subtle spiritual error made even by advanced seekers: the belief
  that one must first *annihilate* one''s own existence (and then annihilate the awareness of that annihilation)
  in order to arrive at knowledge of God. Balyānī argues that this doctrine, however pious it sounds,
  secretly smuggles in polytheism (shirk). To speak of your existence ''passing away'' presupposes that
  your existence was real in the first place — and to affirm a real existence alongside God is precisely
  to posit a second alongside the One. The Prophet''s saying is exact: ''Whoso knoweth himself knoweth
  his Lord'' — not ''whoso makes himself cease to be.'' Knowledge, not extinction, is the gateway. The
  teaching rests on the radical claim of waḥdat al-wujūd (oneness of being): there is only one existence,
  God''s existence, and what you call ''your'' existence is simply nothing — never real, therefore never
  in need of destruction. The self is not a thing to be abolished but an illusion to be seen through.
  Just as light dispels darkness without darkness having ever been a substance that must be ''removed,''
  true self-knowledge dispels the illusion of independent selfhood without any real ''passing away'' occurring.
  The reference to the eternal ''now'' reframes time itself: you were ''non-existent'' before creation
  and remain so now, because all that truly *is*, is God — the existence underlying past, future, and
  present alike.


  Key Terms


  **fanāʾ** — ''Passing away'' or self-annihilation; the mystical extinction of the ego in God. Balyānī
  critiques the notion of fanāʾ as a *precondition* for divine knowledge, since it presupposes a real
  self that must be destroyed.

  **shirk** — Polytheism or association; affirming a reality alongside God. Here, insisting on the ''passing
  away'' of one''s existence is itself a hidden shirk, because it treats the illusory self as something
  real.

  **waḥdat al-wujūd** — ''Oneness of being''; the doctrine that there is only one true existence — God''s
  — and all apparent existence is His self-disclosure, not a second reality.'
insight: ''
practice: 'Whenever the thought ''I must let go of myself'' arises today, stop and correct it silently:
  there is nothing here to let go of, for it was never added to God''s existence in the first place. Rest
  in that word — ''nothing'' — not as loss but as the plain fact that only He is.'
