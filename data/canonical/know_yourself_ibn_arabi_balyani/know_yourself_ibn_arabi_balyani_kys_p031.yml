- kind: commentary
  label: Pratibha Commentary
  body: 'The passage’s claim is deliberately sharper than the usual Sufi account of fanāʾ: self-knowledge
    is not achieved by first extinguishing a real self, because no independent self was ever there to
    extinguish. In its waḥdat al-wujūd logic, to posit “my existence” and then narrate its dissolution
    leaves two terms in play—God and a creaturely being that must disappear. The author calls that residual
