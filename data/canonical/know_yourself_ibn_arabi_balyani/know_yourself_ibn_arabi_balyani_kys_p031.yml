- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 7
    resonance: 'Both texts identify a structural inversion: knowledge of the ultimate requires redirecting attention *away*
      from what habitually occupies it (external things / passing content) *toward* what is always present but obscured (the
      Unity / the knower itself). The move is not acquisition but reorientation of perception.'
    divergence: Plotinus frames this as a continuous soul-act obscured by sense-focus; Ibn Arabi frames it as the dissolution
      of the separate self-sense (fanā) to reveal God alone—a metaphysical erasure rather than a perceptual shift.
    passage_id: plotinus_enneads.enn_vi_9_07
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both propose that knowledge emerges through a reversal of ordinary attention: sustained focus on the knower
      (attention itself) rather than on content becomes the method. Knowledge is not acquired from outside but recognized
      as the nature of attention when turned inward.'
    divergence: The Siva Sutra treats attention as an intrinsic power of consciousness to be recognized; Ibn Arabi treats
      knowledge as dependent on the annihilation of the knower's separate existence—a via negativa rather than a via positiva
      of recognition.
    passage_id: siva_sutra.ss_ii_12
