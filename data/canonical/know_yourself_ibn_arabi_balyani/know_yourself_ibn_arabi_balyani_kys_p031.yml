work_title: Know Yourself (Ibn Arabi / Balyani)
unit_id: know_yourself_ibn_arabi_balyani.kys_p031
unit_label: Knowing God Does Not Require the Self to Vanish
title: Knowing God Does Not Require the Self to Vanish
unit_type: teaching_passage
thesis: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
themes:
- attention
- knowledge
- self
source_excerpt: By making the knowledge of God dependent on the passing away of your existence and the
  passing away of that passing away, there is an affirmation of something other than God. The Prophet
  said, Whoever knows their self, knows their Lord.
translation_literal: 'Most of those who know God make the passing away of existence, and the passing away
  of that passing away, a condition for attaining the knowledge of God; and that is an error and a clear
  oversight. For the knowledge of God does not require the passing away of existence, nor the passing
  away of that passing away. Things have no existence, and what does not exist cannot pass away; for passing
  away comes only after existence has been affirmed. If you know yourself without existence or passing
  away, then you know God; if not, then not.


  In making the knowledge of God depend upon the passing away of existence and the passing away of that
  passing away, there is an affirmation of polytheism. For if you make the knowledge of God depend on
  these, existence belongs to other than God, along with its opposite—and there is evident polytheism.
  For the Prophet, peace be upon him, said, “Whoever knows himself knows his Lord”; he did not say, “Whoever
  passes away from himself knows his Lord.”'
commentary: 'The passage’s claim is deliberately sharper than the usual Sufi account of fanāʾ: self-knowledge
  is not achieved by first extinguishing a real self, because no independent self was ever there to extinguish.
  In its waḥdat al-wujūd logic, to posit “my existence” and then narrate its dissolution leaves two terms
  in play—God and a creaturely being that must disappear. The author calls that residual posit shirk,
  not because devotional practice is dispensable, but because the metaphysical premise grants other-than-God
  a standing of its own. Knowledge of the Lord is therefore recognition rather than an event of annihilation:
  know the self as devoid of self-subsisting existence, and the divine reality alone is disclosed. This
  is a contested move. Many Sufis retain fanāʾ as a disciplined transformation of egoic claims and speak
  carefully of creaturehood before God; theologians may also object that collapsing all existence into
  divine existence blurs the Creator–creation distinction. The text presses its paradox anyway: the prophetic
  maxim says “know,” not “make yourself vanish.” Its target is not humility, but the hidden assumption
  that an independently real “you” could either persist beside God or be removed from beside God.'
insight: ''
practice: 'Today, when you notice yourself claiming “my success,” “my failure,” or “my possession,” pause
  once and replace the claim inwardly with: “This has no independent standing.” Then let that recognition
  make you more responsible and less self-important in the next action you take.'
sanskrit_devanagari: 'وأكثر العُرَّاف أضافوا معرفة الله – تعالى – إلى فناء الوجود وفناء الفناء – وذلك
  غلط وسهو واضح: فإن معرفة الله – تعالى – لا تحتاج إلى فناء الوجود ولا إلى فناء فنائه، لأن الشيء لا وجود
  له، وما لا وجود له لا فناء له؛ فإن الفناء بعد إثبات الوجود. فإذا عرفت نفسك بلا وجود ولا فناء فقد عرفتَ
  الله. – وإلا فلا.


  وفي إضافة معرفة الله – تعالى – إلى فناء الوجود وإلى فناء فنائه إثباتُ الشرك، لأنك إذا أضفت معرفة الله
  إلى فناء الوجود وفناء الفناء، كان الوجود لغير الله ونقيضه – وهناك شرك واضح، لأن النبي – صلى الله عليه
  وسلم – قال: "مَن عرف نفسَه فقد عرف ربَّه"، ولم يقل: "مَن فني عن نفسه عرف ربَّه."'
