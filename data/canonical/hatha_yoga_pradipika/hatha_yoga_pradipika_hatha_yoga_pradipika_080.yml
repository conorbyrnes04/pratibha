unit_label: On Prāṇāyāma — 2.11
title: Kumbhakas should be performed gradually four times…
unit_type: verse
commentary: 'This verse prescribes a systematic, graduated approach to kumbhaka (breath retention), the cornerstone practice
  of prāṇāyāma in haṭha yoga. The specificity of numbers—80 repetitions per session, 320 daily—reflects the text''s conviction
  that transformation through breath work is measurable and progressive, not spontaneous. The fourfold rhythm (morning, noon,
  evening, midnight) aligns practice with natural cycles, suggesting that breath mastery unfolds in time, not outside it.



  Key Terms



  **kumbhaka** — Retention of breath; a core prāṇāyāma technique in which the breath is held after inhalation or exhalation
  to deepen prāṇic control and subtlize the mind.

  **prāṇāyāma** — Regulation and extension of breath; one of the eight limbs of yoga, used to direct and refine vital life-force
  (prāṇa) for physical and spiritual development.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, II.49–50 (on prāṇāyāma as breath regulation):** Both texts treat breath control as a systematic,
  progressive discipline that prepares the mind for deeper states. Both emphasize gradual increase in capacity. Divergence:
  Patañjali frames prāṇāyāma more abstractly as a means to steady the mind; the Haṭha Yoga Pradīpikā gives concrete numerical
  targets and a daily schedule, grounding practice in measurable repetition.


  **Tao Te Ching, ch. 15 (on the sage''s subtle mastery):** Both traditions value refinement through patient, cyclical practice
  rather than force; both suggest that mastery emerges from alignment with natural rhythms (day/night, seasons). Divergence:
  The Haṭha text prescribes explicit technique and number; the Taoist passage speaks of effortless action (wu wei) and avoids
  quantified methods.'
