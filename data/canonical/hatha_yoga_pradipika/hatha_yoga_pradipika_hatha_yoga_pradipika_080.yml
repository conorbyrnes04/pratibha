  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Kumbhakas should be performed gradually four times during day and night (i.e., morning, noon, evening and midnight),
  till the number of Kumbhakas for one time is 80 and for day and night together it is 320.
abhyasa: 'Today, observe your own breath at four different times (morning, midday, evening, before sleep). Without forcing
  retention, simply notice: How does your breath quality shift across the day? What conditions (posture, digestion, mood,
  light) affect it? This prepares the ground for understanding why a systematic practice might be anchored to these hours.'
