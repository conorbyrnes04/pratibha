unit_label: On Prāṇāyāma — 2.42
title: Steadiness of mind comes when the air moves freely
unit_type: verse
commentary: 'This verse distills a core insight of haṭha yoga: mental stability is not achieved through
  force of will alone, but through the subtle regulation of breath and energy. When the prāṇa (vital air)
  flows unobstructed through the central channel (suṣumnā nāḍī, the ''middle''), the mind naturally settles
  into manonmani—a state of non-dual awareness where subject and object dissolve. The passage suggests
  that technique and physiology serve consciousness: steady breath conditions steady mind.



  Key Terms



  **manonmani** — A state of mind transcending ordinary thought; literally ''mind-without-mind,'' where
  dualistic awareness dissolves and consciousness rests in itself.

  **prāṇa (air/vital force)** — The subtle life-energy that animates body and mind; in this context, its
  free movement through the central channel is the condition for mental steadiness.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś citta-vṛtti-nirodhah'' (Yoga is the stilling of the mind''s fluctuations):**
  Both texts identify yoga as a state of mental cessation or profound calm; both imply that technique
  serves this end. Divergence: Patañjali emphasizes mental discipline directly; Haṭha Yoga Pradīpikā locates
  the gateway through the body''s subtle channels and breath.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both traditions point to a state of being that transcends ordinary
  conceptual mind and emerges when obstruction ceases. Divergence: The Tao Te Ching emphasizes paradox
  and wordlessness; Haṭha Yoga Pradīpikā offers a practical physiology of how that state arises.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  suggest a non-dual awareness where subject-object distinction collapses into unified consciousness.
  Divergence: Eckhart frames this as divine union; the Haṭha text presents it as a natural outcome of
  prāṇic alignment, without theological language.'
