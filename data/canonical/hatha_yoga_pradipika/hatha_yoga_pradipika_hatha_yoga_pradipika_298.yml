translation: Or, who can know the true greatness of the Raja Yoga. Knowledge, mukti, condition, and Siddhis
  can be learnt by instructions from a guru alone.
abhyasa: Today, reflect on one area of your life where you have genuinely needed a teacher or mentor—not
  just information, but presence and correction. Notice the difference between reading about something
  and learning it from someone who embodies it. Hold that recognition without judgment.
