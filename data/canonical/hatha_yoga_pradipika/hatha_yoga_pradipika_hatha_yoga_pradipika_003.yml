  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Owing to the darkness arising from the multiplicity of opinions people are unable to know the Rāja Yoga. Compassionate
  Swātmārāma composes the Hatha Yoga Pradipikā like a torch to dispel it.
abhyasa: 'Sit quietly and notice one place where you feel confused or pulled in multiple directions today—whether in practice,
  relationship, or decision. Rather than seeking more information, take three slow, conscious breaths, feeling your body''s
  weight and presence. Ask: what does my direct experience, right now, tell me? Let the body be your torch through the fog.'
