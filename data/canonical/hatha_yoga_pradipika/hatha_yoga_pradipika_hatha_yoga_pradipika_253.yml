  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By practice, the discharged bindu is drawn out. One can draw back and preserve one's own discharged bindu.
abhyasa: Sit quietly for five minutes and notice your own energy—where it flows, where it scatters. Without judgment, simply
  observe the difference between moments of dispersal and moments of gathering. This simple witnessing is the first step toward
  the intentional conservation the text describes.
