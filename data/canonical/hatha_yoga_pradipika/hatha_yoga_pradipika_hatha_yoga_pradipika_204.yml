  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Turning the tongue upwards, it is fixed on three ways (esophagus, windpipe and palate). Thus it makes the Khachari
  Mudra, and is called the Vyoma Chakra.
abhyasa: Sit quietly and gently notice the natural position of your tongue in your mouth. Without strain, explore what happens
  when you turn your attention inward and upward—toward the roof of the mouth, the soft palate, and the space behind the eyes.
  Spend 2–3 minutes simply observing the quality of awareness that arises when the tongue's orientation shifts. This is contemplation,
  not technique; no forcing.
