title: Turning the tongue upwards, it is fixed on three…
unit_type: verse
commentary: 'This passage describes a specific tongue placement (khechari mudrā) that redirects attention and subtle energy
  upward through the body''s central channels. The practice is presented as a physical gesture with metaphysical consequence:
  by turning the tongue inward and fixing it on the three pathways, the practitioner engages what is called the ''void wheel''
  (vyoma chakra), suggesting a shift in consciousness toward the spacious, empty dimension of awareness. The teaching assumes
  that body, breath, and mind are inseparable instruments of yoga.



  Key Terms



  **khechari mudrā** — A mudrā (seal or gesture) in which the tongue is turned upward and fixed on the three channels; traditionally
  understood as a means of redirecting prāṇa (vital energy) and stabilizing consciousness.

  **vyoma chakra** — Literally ''void wheel'' or ''ether wheel''; the subtle center or state of consciousness associated with
  the upward-turned tongue, pointing toward spaciousness and emptiness.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts point to a reorientation of the
  body-mind toward stillness and clarity; the tongue''s upward turn parallels the inward turn toward the unmoving center.
  Divergence: The Tao Te Ching emphasizes spontaneous non-action (wu wei), while the Haṭha Yoga Pradīpikā prescribes specific
  physical techniques as deliberate means to that state.


  **Patañjali''s Yoga Sūtra, I.2: ''Yoga is the cessation of the fluctuations of the mind.'':** Both texts treat yoga as a
  discipline that stills mental turbulence; the mudrā is a tool for that stilling, just as āsana and prāṇāyāma are in Patañjali''s
  framework. Divergence: Patañjali emphasizes mental discipline directly, while the Haṭha Yoga Pradīpikā works through the
  body and breath as the primary gateway.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both suggest a reversal or
  inversion of ordinary perception—turning inward to access a deeper dimension of awareness or unity. Divergence: Eckhart''s
  language is theistic and mystical; the Haṭha Yoga Pradīpikā remains phenomenological, describing the mechanics of subtle
  anatomy without invoking a personal deity.'
