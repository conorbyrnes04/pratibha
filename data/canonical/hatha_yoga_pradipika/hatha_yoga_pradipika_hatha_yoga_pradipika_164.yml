translation: There is nothing in the three worlds which may be difficult to obtain for him or her who
  is able to keep the air confined according to pleasure, by means of Kevala Kumbhaka.
abhyasa: Sit quietly today and simply observe your natural breath for five minutes without trying to change
  it. Notice where the breath seems to pause or linger on its own. This grounds you in the reality of
  breath as something both automatic and capable of conscious relationship—the foundation upon which Kevala
  Kumbhaka is built.
practice: Sit quietly today and simply observe your natural breath for five minutes without trying to
