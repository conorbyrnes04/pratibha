  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: It can be closed from the front also (by stopping the movements of the Prana), and then surely
  it becomes the Khechari. By practice, this Khechari leads to Unmani.
abhyasa: 'Sit quietly and observe the natural flow of your breath for a few minutes. Then gently notice
  where your attention rests—whether it moves outward with sensation or can rest inward. Without forcing,
  sense what it might mean for the mind to ''close from the front,'' turning away from external preoccupation.
  Return to natural breathing. This is not the technique itself, but a contemplative glimpse of the principle:
  the stilling of outward-moving energy.'
