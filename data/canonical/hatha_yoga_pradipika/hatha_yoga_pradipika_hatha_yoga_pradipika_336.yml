title: It can be closed from the front also (by stopping…
unit_type: verse
commentary: 'This verse describes a subtle yogic state in which the forward movement of prāṇa (vital breath/energy)
  is arrested through practice, resulting in what is called Khechari—a condition traditionally associated
  with the tongue''s position and the mind''s inward turn. The passage suggests that Khechari is not merely
  a physical technique but a gateway to Unmani, a state of consciousness beyond ordinary mental activity.
  The emphasis on ''by practice'' underscores that such states are cultivated gradually through disciplined
  repetition, not sudden or accidental.



  Key Terms



  **Khechari** — A yogic state or mudrā in which the forward movement of prāṇa is arrested; traditionally
  associated with inward-turning awareness and preparation for higher states of consciousness.

  **Unmani** — A state beyond ordinary mind (mani = mind); a condition of consciousness transcending mental
  fluctuation, often described as the threshold of samādhi.

  **Prāṇa** — Vital life-force or breath-energy; in yoga philosophy, the animating power that moves through
  the body and can be directed through practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts present yoga as a stilling or arrest of ordinary mental movement; the Pradīpikā locates this
  in the control of prāṇa, while Patañjali frames it as direct cessation of thought-patterns. Divergence:
  The Pradīpikā emphasizes embodied, energetic practice (prāṇāyāma, mudrā) as the means, whereas Patañjali''s
  sūtra is more abstract and does not prescribe specific techniques.


  **Tao Te Ching 15 (Laozi): ''The ancient masters were profound and subtle... Because they were subtle,
  they must be described with difficulty.'':** Both traditions point to states of consciousness that lie
  beyond ordinary language and require patient, sustained practice to approach; both honor the paradox
  of describing the indescribable. Divergence: The Pradīpikā offers concrete technical steps (closing
  prāṇa, practicing Khechari), while the Tao Te Ching emphasizes non-action (wu wei) and the futility
  of method itself.


  **Meister Eckhart: ''The more we empty ourselves, the more room we make for God.'':** Both suggest that
  a turning inward and cessation of outward movement creates space for a higher state or presence; both
  value the emptying or stilling of ordinary consciousness. Divergence: Eckhart''s language is theistic
  and devotional (union with God), while the Pradīpikā remains within a non-theistic yogic framework focused
  on energy and consciousness itself.'
