title: Place the palms of both hands on the ground, and…
unit_type: verse
commentary: 'This passage describes a single posture—Mayūrāsana (the Peacock Pose)—by its mechanical alignment:
  hands grounded, navel resting on the elbows, body extended backward in a rigid line. The image of the
  body ''like a stick'' suggests both structural integrity and the surrender of the body to a precise
  geometric form. In the Haṭha Yoga Pradīpikā''s framework, such āsanas are not mere physical exercises
  but preparatory disciplines that stabilize and concentrate the body-mind, making it a fit vessel for
  prāṇāyāma and deeper states.



  Key Terms



  **āsana** — A steady, comfortable physical posture; in haṭha yoga, a disciplined bodily position used
  to prepare the nervous system and mind for meditation and breath work.

  **Mayūrāsana** — The Peacock Pose, named for its resemblance to a peacock''s display; a demanding arm
  balance in which the body is supported and extended horizontally.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'' (the posture should be steady and comfortable):**
  Both texts frame āsana as a balance between effort and ease, structure and naturalness. Divergence:
  The Yoga Sūtra emphasizes the *quality* of steadiness and comfort; the Haṭha Yoga Pradīpikā emphasizes
  the *specific form* and its technical demands.


  **Daodejing 15 (Laozi): ''The ancient masters were subtle, mysterious, profound, responsive… like a
  stick of wood'':** Both use the image of a stick or rigid form to suggest a state of non-resistance
  and natural alignment. Divergence: The Daodejing''s ''stick'' is metaphorical for yielding emptiness;
  the Haṭha Yoga Pradīpikā''s is literal—the body must *become* structurally rigid to channel vital force.'
