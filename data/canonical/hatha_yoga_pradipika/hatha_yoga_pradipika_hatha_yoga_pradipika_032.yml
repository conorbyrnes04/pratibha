translation: Place the palms of both hands on the ground, and place the navel on both the elbows and balancing
  thus, the body should be stretched backwards like a stick. This is called Mayura-āsana.
abhyasa: 'Sit quietly and visualize the alignment described—palms down, navel supported, spine extended—without
  attempting the pose itself. Notice what stability or rigidity arises in your imagination. Then observe
  your actual seated posture: where do you habitually collapse or brace? This contemplation can deepen
  your felt sense of how alignment relates to presence.'
