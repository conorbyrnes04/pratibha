translation: On the completion of Kumbhaka, the mind should be given rest. By practicing in this way one
  is raised to the position of (succeeds in getting) Raja Yoga.
abhyasa: Today, after a few rounds of steady breathing, pause gently at the end of an exhale for a natural
  count. When you release, notice the quality of stillness that arises—not blank, but alert. Observe how
  the mind settles without effort in that moment. This is the seed of what the text calls 'rest.'
