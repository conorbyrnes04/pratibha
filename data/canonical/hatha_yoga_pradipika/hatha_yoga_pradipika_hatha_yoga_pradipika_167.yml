title: On the completion of Kumbhaka
unit_type: verse
commentary: 'This brief verse distills a core principle of haṭha yoga: that breath retention (kumbhaka)
  is not an end in itself, but a threshold. When the breath is held and then released, the mind naturally
  settles into stillness—not through force, but through the physiology of practice. This ''rest'' of mind
  is presented as the gateway to rāja yoga, the ''royal'' yoga of mental mastery, suggesting that haṭha
  (the yoga of force and effort) is a preparatory ladder, not the summit.



  Key Terms



  **Kumbhaka** — Retention of breath; a controlled pause in prāṇāyāma practice, traditionally held after
  inhalation or exhalation.

  **Rāja Yoga** — The ''royal yoga'' of mental discipline and samādhi; in this text''s framework, the
  fruit of haṭha practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts locate yoga''s goal in the stilling of mind; the Pradīpikā shows breath retention as a practical
  means to that end. Divergence: Patañjali emphasizes philosophical definition; Svātmārāma emphasizes
  embodied technique as the path.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of
  their knowledge is unfathomable.'':** Both traditions value a non-forcing approach—allowing natural
  rest rather than grasping for states. Divergence: The Pradīpikā prescribes specific physical practices;
  the Tao Te Ching points to effortless action without technique.'
