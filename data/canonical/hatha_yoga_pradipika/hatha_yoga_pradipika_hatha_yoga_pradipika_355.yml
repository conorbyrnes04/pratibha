translation: Adinatha propounded 1 1/4 crore methods of trance, and they are all extant. Of these, the
  hearing of the anahata nada is the only one, the chief, in my opinion.
abhyasa: In a quiet moment today, sit upright and close your eyes. Without forcing or straining, listen
  inwardly—not for external sound, but for the subtle hum, tone, or vibration that may arise in the space
  of the heart or head. Do not grasp or judge what you hear; simply attend. This is an invitation to the
  *anahata nada*, not a demand. Return to ordinary listening whenever the mind wanders.
