  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: If the tongue can touch with its end the hole from which falls the rasa (juice) which is saltish, bitter, sour,
  milky and similar to ghee and honey, one can drive away disease, destroy old age, can evade an attack of arms, become immortal
  in eight ways and can attract fairies.
abhyasa: 'Sit quietly and bring gentle awareness to the roof of your mouth and the back of your throat. Without forcing or
  straining, notice the subtle tastes and sensations present there—salt, sweetness, warmth. Spend five minutes simply observing,
  without trying to change anything. This is a threshold: noticing that the body is not blank, but alive with sensation and
  flavor. Return to this awareness daily as an entry into the text''s vision of the body as a living pharmacy.'
