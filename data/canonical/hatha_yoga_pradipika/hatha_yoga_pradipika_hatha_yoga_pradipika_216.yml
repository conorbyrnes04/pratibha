  body: If the tongue can touch with its end the hole from which falls the rasa (juice) which is saltish, bitter, sour, milky
    and similar to ghee and honey, one can drive away disease, destroy old age, can evade an attack of arms, become immortal
    in eight ways and can attract fairies.
