  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the thoughts and activities are destroyed, then the Laya Stage is produced, to describe which is beyond
  the power of speech, being known by self-experience alone.
abhyasa: Today, notice one moment when your thinking naturally quiets—perhaps during breath awareness, a walk, or listening
  to music. Rather than trying to analyze or extend that moment, simply rest in it for a few breaths. Observe how the quality
  of awareness shifts when mental chatter pauses, without naming or judging what arises.
