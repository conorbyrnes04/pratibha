  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: If the Yogi or Yogini drinks Somarasa (juice) by sitting with the tongue turned backwards
  and mind concentrated, there is no doubt he or she conquers death within 15 days.
abhyasa: Sit quietly today and simply notice the position and sensation of your tongue in your mouth.
  Without straining, observe how awareness of the tongue's placement affects your mental focus and breath.
  This modest attention honors the text's emphasis on concentrated mind (chitta) as inseparable from physical
  technique—the foundation before any advanced practice.
