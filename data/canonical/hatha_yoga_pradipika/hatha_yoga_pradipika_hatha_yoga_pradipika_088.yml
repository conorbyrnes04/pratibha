translation: When the nadis become free from impurities, and there appear the outward signs of success,
  such as lean body and glowing color, then one should feel certain of success.
abhyasa: 'Today, observe your body without judgment—its energy, clarity, and vitality—as a honest measure
  of your current state. Notice where you feel blocked or dull, and where you feel open and alive. This
  simple witnessing is itself a form of yoga: honest attention to what is.'
