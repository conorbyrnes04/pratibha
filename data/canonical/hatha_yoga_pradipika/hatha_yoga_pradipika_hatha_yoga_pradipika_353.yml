title: Salutations to Thee
unit_type: verse
commentary: 'This invocation opens the text by honoring the subtle anatomical and energetic channels through
  which transformation occurs in haṭha yoga practice. Suṣumnā (the central channel), Kuṇḍalinī (the coiled
  power at the base of the spine), and the lunar nectar (sudha) represent the inner landscape the practitioner
  awakens to and works with. By saluting these forces—not as external gods but as dimensions of one''s
  own being—Svātmārāma establishes that yoga is fundamentally a recognition and honoring of what already
  exists within, waiting to be known.



  Key Terms



  **Suṣumnā** — The central energy channel running through the spine, traditionally understood as the
  primary pathway for the rise of kuṇḍalinī and awakening in haṭha yoga.

  **Kuṇḍalinī** — The coiled, dormant spiritual power residing at the base of the spine, which haṭha yoga
  practices aim to awaken and guide upward through the central channel.

  **Sudha** — Literally ''nectar'' or ''ambrosia,'' born of the moon (Chandra); the subtle essence or
  bliss said to flow when higher centers are activated.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.3.3-4): ''Know the Self as lord of a chariot, the body as the chariot
  itself.'':** Both texts treat the body as a vehicle for inner knowledge and awakening; both honor subtle
  forces within as worthy of reverence and systematic exploration. Divergence: The Upaniṣads emphasize
  the Self (Ātman) as the ultimate reality to be known; the Haṭha Yoga Pradīpikā focuses on the energetic
  and postural methods to prepare the body-mind for that knowing.


  **Tantric liturgy (e.g., invocations in Śrī Vidyā): ''Salutations to the Goddess in all her forms.'':**
  Both traditions honor divine power (Śakti) as immanent and accessible through the body and subtle channels;
  both use invocation to establish reverence before practice. Divergence: Tantric invocations often address
  Śakti as cosmic feminine principle; this passage addresses the channels and energies as impersonal forces
  within one''s own physiology.


  **Daoism (Daodejing 10): ''Can you remain unmoving till the mud settles and the water is clear?'':**
  Both traditions value patient, non-forceful alignment with inner currents; both suggest that clarity
  arises through receptivity rather than willful grasping. Divergence: Daoism emphasizes wu-wei (non-action);
  haṭha yoga employs deliberate prāṇāyāma and āsana to redirect and awaken dormant energy.'
