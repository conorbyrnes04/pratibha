translation: Salutations to Thee, O Susumna, to Thee O Kundalini, to Thee O Sudha, born of Chandra, to
  Thee O Manonmani! to Thee O great power, energy and the intelligent spirit.
abhyasa: 'Before sitting to practice today, pause and silently acknowledge the three channels within you:
  the central axis of your spine, the dormant energy coiled at its base, and the subtle sweetness or stillness
  you may sense in your upper body or mind. This need not be visualization—simple recognition and respect
  suffice. Let this set an intention of reverence rather than force.'
