translation: When the belly is filled with air and the inside of the body is filled to its utmost with
  air, the body floats on the deepest water, like a leaf of a lotus.
abhyasa: 'Today, in a safe, seated position, observe your own buoyancy: take a full, comfortable breath
  and notice how your body feels lighter, how your spine naturally lengthens. Do not force or strain.
  Simply notice the relationship between fullness of breath and ease of posture. This is the passage''s
  teaching made immediate.'
