sanskrit_devanagari: 'नित्यं सोम-कला-पूर्णं शरीरं यस्य योगिनः ।

  तक्षकेणापि दष्टस्य विषं तस्य न सर्पति इन्धनानि यथा वह्निस् तैल-वर्ति च दीपकः ।

  तथा सोम-कला-पूर्णं देही देहं न मुञ्चति'
