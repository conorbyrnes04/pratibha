unit_label: On Prāṇāyāma — 2.91
title: When the belly is filled with air and the inside of…
unit_type: verse
commentary: 'This passage describes a specific physiological effect of prāṇāyāma (breath retention): when
  the lungs and body cavity are fully inflated with air, buoyancy naturally follows. The image of the
  lotus leaf—light, unsubmerged, at ease on water—suggests that mastery of breath creates not merely a
  physical phenomenon but a state of effortless stability. The passage implies that breath work produces
  tangible, observable results, grounding the practice in the body''s own laws rather than mystical abstraction.



  Key Terms



  **prāṇāyāma** — regulation and expansion of breath (prāṇa, vital energy); foundational practice in haṭha
  yoga for controlling the body and mind

  **haṭha** — the union of sun (ha) and moon (ṭha) energies; the physical and energetic practices that
  prepare the body for meditation and samādhi



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize subtle mastery over force: ''The ancient masters were profound
  and wise; because they were hard to understand, I will try to describe them.'' The lotus leaf floats
  not by effort but by its nature—as the sage acts without forcing. Divergence: The Haṭha Yoga Pradīpikā
  grounds wisdom in precise bodily technique and breath; the Tao Te Ching points toward non-action (wu
  wei) and the uncarved block, less concerned with method.


  **Patañjali''s Yoga Sutras, II.49–50 (prāṇāyāma):** Both texts treat prāṇāyāma as a foundational limb
  of yoga that steadies the mind and prepares for higher states. The Haṭha Yoga Pradīpikā offers concrete,
  embodied description of breath''s effects. Divergence: Patañjali emphasizes prāṇāyāma''s role in withdrawing
  the senses and steadying attention; the Pradīpikā here highlights its direct physical manifestation
  (buoyancy), suggesting a more materialist entry point.


  **Heraclitus, Fragment 12 (on flux and balance):** Both suggest that apparent stability arises from
  dynamic equilibrium—the lotus leaf remains afloat through the interplay of weight and buoyancy, as Heraclitus
  saw all being as tension between opposites. Divergence: Heraclitus speaks of cosmic flux and strife;
  the Pradīpikā describes a practical, repeatable bodily state achieved through discipline, not a metaphysical
  principle.'
