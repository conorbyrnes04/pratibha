translation: The Yogi or Yogini who, sitting with Padmâsana, can control breathing, there is no doubt,
  is free from bondage.
abhyasa: Today, sit comfortably (in lotus or another stable seat if accessible to you). For a few minutes,
  simply observe your breath without changing it. Notice where tension or ease arises in the body as you
  breathe. This simple witnessing—not yet formal prāṇāyāma—begins to establish the link between postural
  steadiness and breath awareness that the text points toward.
