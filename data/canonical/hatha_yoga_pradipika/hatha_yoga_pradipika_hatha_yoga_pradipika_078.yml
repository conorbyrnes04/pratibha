translation: Inhaling thus through the one, through which it was expelled, and having restrained it there,
  till possible, it should be exhaled through the other, slowly and not forcibly.
abhyasa: Today, sit quietly for a few minutes. Close your right nostril gently with your thumb, inhale
  through the left nostril at a natural pace. Pause briefly. Close the left nostril, exhale through the
  right. Repeat 5–10 times, never straining. Notice how the simple reversal of breath's direction affects
  your attention and ease.
practice: Today, sit quietly for a few minutes. Close your right nostril gently with your thumb, inhale
  through the left nostril at a natural pace. Pause briefly. Close the left nostril, exhale through the
  right. Repeat 5–10 times, never straining. Notice how the simple reversal of breath's direction affects
  your attention and ease.
