unit_label: On Prāṇāyāma — 2.9
title: Inhaling thus through the one
unit_type: verse
commentary: 'This passage describes a foundational prāṇāyāma technique: alternate-nostril breathing, where
  breath is drawn in through one nostril, held, and released through the other. The instruction emphasizes
  gentleness (''slowly and not forcibly'') and natural capacity (''till possible''), suggesting that breath
  work is not about force or achievement but about attentive, sustainable regulation. This restraint and
  reversal of the breath''s path is presented as a practical means to calm and direct the vital energy
  (prāṇa) that the text treats as foundational to all higher yoga.



  Key Terms



  **prāṇāyāma** — regulation and extension of breath; in haṭha yoga, a primary practice for directing
  vital energy (prāṇa) and preparing the mind for meditation

  **prāṇa** — vital life-force or energy that moves through the body; the object of regulation in breath
  practice



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali):** Both texts treat breath regulation as a gateway practice: Patañjali
  calls prāṇāyāma the means to ''sever the veil covering the light of knowledge.'' The Pradīpikā passage
  similarly treats breath control as preparatory to higher states. Divergence: Patañjali emphasizes prāṇāyāma''s
  role in mental clarity and knowledge; the Pradīpikā is more concrete and embodied, giving specific techniques
  for how to regulate the breath itself.


  **Tao Te Ching 15 (Laozi):** Both texts value non-force and natural capacity: ''The ancient masters
  were subtle, profound, and unfathomable... because they could not be fully known, they must be described
  by their appearance.'' The Pradīpikā''s ''not forcibly'' and ''till possible'' echo this wisdom of working
  with nature rather than against it. Divergence: Laozi speaks of the Way''s ineffable nature; the Pradīpikā
  offers a specific, repeatable technique, grounding the principle in embodied practice.


  **Heraclitus, Fragment 12:** Both suggest that reversal and balance are keys to understanding: Heraclitus
  speaks of the path ''up and down'' as one and the same. The alternate-nostril technique reverses the
  breath''s usual path, implying that wisdom lies in seeing opposites as complementary. Divergence: Heraclitus
  is metaphysical and cosmological; the Pradīpikā is pragmatic and somatic, offering a method rather than
  a philosophical claim.'
