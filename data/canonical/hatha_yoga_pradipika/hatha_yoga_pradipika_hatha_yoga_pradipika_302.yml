  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: When the Prana flows in the Susumna, and the mind has entered sunya, then the Yogi or Yogini
  is free from the effects of Karmas.
abhyasa: 'Today, sit quietly and observe where your breath naturally flows—through which nostril, with
  what rhythm, in what quality of mind. Without forcing, simply notice: Is attention scattered, or gathered?
  Are you aware of any sense of central flow, or only the surface breath? This noticing itself begins
  the alignment the verse describes.'
