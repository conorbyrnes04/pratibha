unit_label: On Samādhi — 4.12
title: When the Prana flows in the Susumna, and the mind…
unit_type: verse
commentary: 'This verse distills the central aim of haṭha yoga: the alignment of vital breath (prāṇa)
  with the central energy channel (suṣumnā) and the simultaneous stilling of mind into emptiness (śūnya).
  When both occur together, the passage suggests, the practitioner transcends the binding force of karma—not
  through moral correction alone, but through a direct shift in the body-mind-energy system. This frames
  haṭha yoga not as mere physical discipline but as a practical technology for liberation.



  Key Terms



  **Prāṇa** — Vital life-force or breath-energy that animates the body and mind; the animating principle
  in haṭha yoga practice.

  **Suṣumnā** — The central energy channel running through the spine, traditionally said to be the path
  through which awakened prāṇa rises toward liberation.

  **Śūnya** — Emptiness or void; a state of mind free from thought-patterns and ego-identification, cultivated
  through yoga practice.



  Cross-Tradition Resonances



  **Yoga Sutras 1.2 (Patañjali): ''Yoga is the stilling of the fluctuations of the mind.'':** Both texts
  identify mental stillness as the core of yoga; both treat it as the gateway to freedom. Divergence:
  The Yoga Sutras emphasize mental discipline through philosophical discrimination; the Haṭha Yoga Pradīpikā
  locates that stillness in the body''s energy channels, making it embodied rather than purely cognitive.


  **Bhagavad Gītā 2.47 (on karma yoga): ''You have a right to perform your prescribed duty, but you are
  not entitled to the fruits of action.'':** Both texts address liberation from karma''s binding effects,
  suggesting a path beyond mechanical cause-and-effect. Divergence: The Gītā emphasizes right action and
  detachment from results; the Haṭha Yoga Pradīpikā suggests karma is transcended through a direct energetic-meditative
  shift, not through ethical conduct.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... their minds were empty.'':** Both
  traditions prize emptiness of mind and align it with mastery and freedom from compulsion. Divergence:
  The Tao Te Ching reaches emptiness through wu-wei (non-action); the Haṭha Yoga Pradīpikā reaches it
  through precise prāṇāyāma and energy-channel work—active cultivation rather than non-doing.'
