  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Placing the right ankle on the left side and the left ankle on the right side, makes Gomukha-āsana,
  having the appearance of a cow.
abhyasa: 'Sit upright and gently cross your right ankle to the left side and left ankle to the right side
  (or work toward this if tight). Notice without forcing: how does this asymmetrical crossing affect your
  spine, breath, and sense of grounding? Sit for a few breaths and observe whether the posture''s name—''cow-face''—evokes
  anything in your felt sense of stability or presence.'
