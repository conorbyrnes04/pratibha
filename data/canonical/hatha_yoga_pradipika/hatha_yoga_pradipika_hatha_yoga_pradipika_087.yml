  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The air should be expelled with proper tact and should be filled in skillfully; and when
  it has been kept confined properly it brings success. (N.B.--The above caution is necessary to warn
  the aspirants against omitting any instruction; and in their zeal to gain success or siddhis early,
  to begin the practice, either by using too much force in filling in, confining and expelling the air,
  or by omitting any instructions, it may cause unnecessary pressure on their ears, eyes, &c., and cause
  pain. Every word in the instructions is full of meaning and is necessarily used in the slokas, and should
  be followed very carefully and with due attention. Thus there will be nothing to fear whatsoever. We
  are inhaling and exhaling the air throughout our lives without any sort of danger, and Pranayama being
  only a regular form of it, there should be no cause to fear.)
abhyasa: 'Today, observe one complete breath cycle—exhale, inhale, pause—without forcing or rushing. Notice
  where you habitually strain or skip. Then, in a quiet moment, perform three slow cycles with equal attention
  to each phase: releasing fully, receiving fully, holding gently. This simple attention to balance mirrors
  the text''s core teaching.'
