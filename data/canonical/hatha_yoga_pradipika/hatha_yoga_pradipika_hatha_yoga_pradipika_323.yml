  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: They often speak of Laya; but what is meant by it? Laya is simply the forgetting of the objects
  of senses when the Vâsanas (desires) do not rise into existence again.
abhyasa: 'Today, notice one moment when you are absorbed in an activity—reading, walking, listening—where
  you forget to want something else. Observe: did the sense-objects disappear, or did your desire for
  them simply pause? Sit with that distinction for a few breaths.'
