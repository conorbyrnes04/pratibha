title: They often speak of Laya;
unit_type: verse
commentary: 'This passage defines laya—a state central to haṭha yoga''s aim—not as exotic trance but as
  the natural cessation of sensory distraction when desire itself stops arising. Svātmārāma cuts through
  mystification: laya is the simple, observable fact of the mind released from the pull of sense-objects
  because the underlying tendencies (vāsanās) that fuel craving have quieted. This grounds the entire
  practice in a clear mechanism: work with breath and body to exhaust the root patterns, and the mind''s
  entanglement with the world dissolves on its own.



  Key Terms



  **Laya** — Absorption or dissolution; here, the forgetting of sensory objects that occurs when the deep
  patterns of desire (vāsanās) cease to generate new cravings.

  **Vāsanās** — Latent impressions, tendencies, or desires; the root patterns in the mind that habitually
  pull attention toward sense-objects.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12 (Patañjali): ''abhyāsa-vairāgyābhyāṁ tannirodhah'' (practice and non-attachment arrest
  the fluctuations of mind):** Both texts locate the stilling of mind in the exhaustion of habitual patterns—Patañjali
  through practice and detachment, Svātmārāma through the specific mechanics of laya. Divergence: Patañjali
  emphasizes the dual effort of practice and renunciation; Svātmārāma focuses on the automatic forgetting
  that follows when vāsanās dry up, suggesting a more passive, natural unfolding.


  **Bhagavad Gītā 2.59 (Kṛṣṇa): ''Though the wise see sense-objects, they do not attach; the taste for
  them fades when the Supreme is seen.'':** Both passages describe a state where sense-objects lose their
  grip—not through suppression but through a shift in consciousness or the exhaustion of desire. Divergence:
  The Gītā attributes this to vision of the Supreme; the Pradīpikā attributes it to the mechanical quieting
  of vāsanās through haṭha practice, without invoking transcendent knowledge.


  **Heraclitus (Fragment 45): ''The path up and down are one and the same.'':** Both suggest that the
  dissolution of ordinary perception (forgetting objects) and the ascent to a subtler awareness are not
  separate movements but one process. Divergence: Heraclitus speaks of paradox and unity; Svātmārāma offers
  a sequential mechanism—first the vāsanās quiet, then laya follows naturally.'
