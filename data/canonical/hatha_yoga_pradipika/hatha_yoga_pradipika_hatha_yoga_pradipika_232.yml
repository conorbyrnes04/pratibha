translation: Going up the Apana enters the zone of fire, i.e., the stomach. The flame of fire struck by
  the air is thereby lengthened. (Note. In the center of the body is the seat of fire, like heated gold.
  In men it is triangular, in quadrupeds square, in birds circular. There is a long thin flame in this
  fire. It is gastric fire.)
abhyasa: Sit quietly and notice the warmth in your belly. Without forcing, observe your natural breath
  and the subtle sensations of heat or coolness as you inhale and exhale. Simply witness whether breath
  and internal temperature seem connected. This prepares awareness for why traditional practitioners undertake
  formal breath work under guidance.
