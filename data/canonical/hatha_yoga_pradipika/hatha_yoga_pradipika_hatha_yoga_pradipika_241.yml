translation: The Prana becomes calm and latent by this means, and thus there is no death, old age, disease,
  etc.
abhyasa: 'Today, observe your own breath without altering it: notice where it is restless (scattered,
  shallow, reactive) and where it is naturally calm (deep, steady, present). This simple witnessing begins
  to reveal what the text means by prāṇa becoming ''calm and latent''—not suppressed, but gathered and
  still.'
