translation: A yogi or yogini desirous of success should keep the knowledge of Hatha Yoga secret; for
  it becomes potent by concealing, and impotent by exposing.
abhyasa: 'Before your next practice session, pause and ask: What am I protecting by practicing in solitude
  or with intention? Notice whether you practice differently when alone versus when observed. This simple
  awareness can deepen your sense of practice as a private covenant with yourself and the lineage.'
