title: A yogi or yogini desirous of success should keep
unit_type: verse
commentary: 'This opening injunction frames haṭha yoga as a practice requiring discretion and protected
  transmission. The passage suggests that the power of these techniques—physical, energetic, and contemplative—depends
  not on their secrecy as such, but on the conditions of sincere, committed practice within a contained
  relationship (teacher-student). Exposure to casual curiosity or public spectacle is understood to dilute
  both the practitioner''s focus and the tradition''s integrity. The gendering of ''yogi or yogini'' acknowledges
  that this teaching applies equally to all sincere seekers.



  Key Terms



  **Hatha Yoga** — The yoga of force or effort; the system of physical postures, breath control, and energetic
  locks that prepares the body and mind for meditation and liberation (rāja yoga).

  **potent / impotent** — In this context, the efficacy or deadening of practice—its capacity to transform
  consciousness and energy—contingent on how it is held and transmitted.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... because they were subtle,
  they must be described with difficulty.'':** Both texts associate depth of knowledge with restraint
  in speech and a resistance to public display; the teaching''s power lies in its hiddenness from the
  merely curious. Divergence: The Tao Te Ching emphasizes the inscrutability of the Way itself, while
  the Haṭha Yoga Pradīpikā emphasizes the protection of a *practice* and its transmission lineage.


  **Kena Upaniṣad: ''That which cannot be expressed by speech, but by which speech is expressed—know that
  alone to be Brahman.'':** Both suggest that the deepest knowledge resists casual utterance and thrives
  in silence or protected space; transmission occurs beyond mere words. Divergence: The Upaniṣad points
  to the ultimate reality beyond language, while the Pradīpikā is concerned with the practical conditions
  for learning a method.


  **Matthew 7:6 (Christian): ''Give not that which is holy unto the dogs... lest they trample them under
  their feet.'':** Both warn against exposing sacred or potent knowledge to those unprepared or disrespectful;
  discernment in transmission is a form of protection. Divergence: The Christian passage emphasizes moral
  judgment of the recipient''s worthiness, while the Pradīpikā emphasizes the structural conditions of
  practice itself.'
