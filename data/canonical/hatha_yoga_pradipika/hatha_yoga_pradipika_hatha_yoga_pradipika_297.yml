translation: This equality and oneness of the self and the ultra self, when all Samkalpas cease to exist,
  is called Samadhi.
abhyasa: Sit quietly for five minutes. Notice one recurring thought or intention (saṃkalpa) that shapes
  how you see yourself—a story about who you are or what you need. Rather than fighting it, simply observe
  it arise and pass, without reinforcing it. In that small gap of non-engagement, rest. This glimpse of
  the mind without its constructs is a seed of the samādhi Svātmārāma describes.
