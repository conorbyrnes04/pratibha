translation: Maha Mudra, Maha Bandha, Maha Vedha, Khechari, Uddiyana Bandha, Mula Bandha, Jalandhara Bandha.
abhyasa: 'Today, simply sit quietly and mentally review each name without performing the practices: Maha
  Mudra, Maha Bandha, Maha Vedha, Khechari, Uddiyana Bandha, Mula Bandha, Jalandhara Bandha. Notice which
  names resonate or feel unfamiliar. This familiarization honors the text''s pedagogical intent: to place
  these techniques in your awareness as a map, inviting future study under guidance.'
