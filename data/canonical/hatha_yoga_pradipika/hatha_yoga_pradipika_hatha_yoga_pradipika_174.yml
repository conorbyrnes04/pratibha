title: Maha Mudra, Maha Bandha, Maha Vedha, Khechari…
unit_type: verse
commentary: 'This verse lists seven foundational seals and locks (mudrā and bandha) that form the core
  technical vocabulary of haṭha yoga practice. Rather than describing their mechanics, Svātmārāma presents
  them as a sequence—a graduated path through which prāṇa (vital energy) is directed, contained, and refined.
  The passage assumes the reader knows these are not mere physical postures but energetic technologies;
  their naming here is an invocation of their place in the yogic ladder toward samādhi.



  Key Terms



  **mudrā** — A seal or gesture—here, energetic configurations of body and breath that redirect and concentrate
  prāṇa

  **bandha** — A lock or binding—a muscular and energetic contraction that contains and channels vital
  force

  **prāṇa** — Vital life-force or breath-energy that animates the body and is the vehicle of yoga practice



  Cross-Tradition Resonances



  **Yoga Sūtra 2.29 (Patañjali): ''yama, niyama, āsana, prāṇāyāma, pratyāhāra, dhāraṇā, dhyāna, samādhi'':**
  Both texts present yoga as an eight-limbed or graduated path; Svātmārāma''s list of mudrā and bandha
  occupies the technical middle ground of that path. Divergence: Patañjali''s sūtra is philosophical and
  ethical in scope; Svātmārāma''s list is purely technical and energetic, reflecting haṭha yoga''s focus
  on the body as the primary laboratory.


  **Taoist internal alchemy texts (e.g., *Secret of the Golden Flower*): emphasis on circulating and storing
  vital essence through specific body locks and channels:** Both traditions use physical seals and contractions
  to direct subtle energy upward and inward, treating the body as a microcosm of transformation. Divergence:
  Haṭha yoga''s bandha are explicitly linked to a philosophical goal (samādhi, liberation); Taoist practice
  often emphasizes longevity and immortality as primary aims.


  **Meister Eckhart: ''God flows into all things'':** Both suggest that energy or divine presence moves
  through channels or vessels; the seals and locks of haṭha yoga are containers for that flow, much as
  Eckhart''s soul is a vessel for God''s influx. Divergence: Eckhart''s language is theistic and mystical;
  Svātmārāma''s is technical and phenomenological, treating prāṇa as a natural force to be mastered rather
  than a divine gift to be received.'
