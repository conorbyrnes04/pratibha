title: In the third stage, the sound of a drum is known to…
unit_type: verse
commentary: 'This verse describes an advanced stage of prāṇāyāma practice where internal sound (nāda)
  arises spontaneously, signaling that vital breath (vāyu) has entered a subtle space called the Mahāśūnya—understood
  as a threshold of extraordinary capacities (siddhis). The passage treats sound and breath movement as
  reliable markers of deepening practice, suggesting that the body''s own signals guide the practitioner
  toward states traditionally associated with power and liberation.



  Key Terms



  **Śūnya** — Emptiness or void; in haṭha yoga, a subtle space within the body where consciousness and
  breath converge.

  **Vāyu** — Vital breath or life-force; the subtle energetic current that moves through channels (nāḍīs)
  in yogic anatomy.

  **Siddhis** — Extraordinary capacities or powers said to arise from advanced spiritual practice; traditionally
  approached with caution to avoid distraction from liberation.



  Cross-Tradition Resonances



  **Yoga Sūtras of Patañjali, 3.37:** Both texts acknowledge that siddhis (powers) naturally arise in
  advanced practice and can serve as markers of genuine progress. Divergence: Patañjali warns against
  attachment to siddhis as obstacles to kaivalya (liberation); the Pradīpikā here presents them neutrally
  as the destination of a specific breath-stage, without moral caution.


  **Upaniṣads (e.g., Kena Upaniṣad):** Both invoke subtle sound (śabda) and emptiness (śūnya) as gateways
  to transcendent knowledge beyond ordinary perception. Divergence: The Upaniṣads approach these through
  inquiry and meditation on brahman; the Pradīpikā locates them in precise bodily practices and breath
  control.'
