  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: In the third stage, the sound of a drum is known to arise in the Sunya between the eyebrows,
  and then the Vayu goes to the Mahasunya, which is the home of all the siddhis.
abhyasa: Sit quietly for 5–10 minutes with gentle attention to the space between the eyebrows (ājñā chakra).
  Do not force or visualize; simply notice any subtle sensations, vibrations, or sounds that may arise
  naturally. If nothing appears, rest in the listening itself. This cultivates sensitivity to the body's
  own feedback without strain.
