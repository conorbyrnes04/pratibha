translation: Pressing Yoni (perineum) with the heel, contract up the anus. By drawing the Apana thus,
  Mula Bandha is made.
abhyasa: Sit comfortably with spine upright. Inhale slowly through the nose. On the exhale, gently contract
  the muscles of the perineum and anus as if drawing energy upward toward the navel. Hold briefly, then
  release on the inhale. Repeat 3–5 times, observing any sensation of internal lift or stability. This
  is exploratory only; formal practice requires qualified guidance.
