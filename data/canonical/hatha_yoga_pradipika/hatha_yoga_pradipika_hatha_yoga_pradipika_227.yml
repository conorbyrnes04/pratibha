title: Pressing Yoni (perineum) with the heel
unit_type: verse
commentary: 'This verse describes Mula Bandha (''root lock''), a foundational prāṇāyāma technique that
  redirects downward-flowing vital energy (apāna) upward through muscular engagement at the perineum.
  The practice is presented as a precise, embodied method—not mystical but mechanical—for controlling
  the flow of breath and life-force within the body. Mula Bandha appears early in the text as a prerequisite
  for deeper prāṇāyāma work, suggesting that mastery of the body''s subtle channels begins with concrete
  anatomical action.



  Key Terms



  **Mula Bandha** — The ''root lock''—a muscular contraction at the perineum used to redirect apāna (downward-moving
  life-force) upward and stabilize prāṇa during breath work.

  **Apana** — One of five vital winds (vāyu) in yogic anatomy; the downward-moving force governing elimination
  and sexual energy, redirected upward through bandha practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''Sthira sukham āsanam'' (''posture should be steady and comfortable''):**
  Both texts ground yoga in precise physical alignment as the foundation for subtle work; the body is
  not transcended but refined. Divergence: The Yoga Sūtra emphasizes mental ease alongside steadiness,
  while the Haṭha Pradīpikā focuses on muscular lock and energy redirection as primary tools.


  **Tao Te Ching 10: ''Can you remain unmoving till the mud settles?'':** Both traditions use physical
  restraint and internal gathering (of energy or attention) to access deeper states; control precedes
  liberation. Divergence: The Taoist passage speaks of stillness and clarity through non-action, while
  Mula Bandha is an active, deliberate muscular engagement.'
