translation: The Satwa of his or her body becomes free from all disturbances. In truth, he or she becomes
  the lord or lady of the Yogis and Yoginis in this world.
abhyasa: 'Today, notice one moment of mental disturbance—restlessness, doubt, or reaction. Rather than
  suppress it, observe how it moves through your body and breath. Ask: what would it feel like if this
  disturbance had no ground to stand on? Sit quietly for five minutes with that question, without forcing
  an answer.'
