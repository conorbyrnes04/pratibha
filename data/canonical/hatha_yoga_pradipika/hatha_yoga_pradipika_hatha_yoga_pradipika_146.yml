unit_label: On Prāṇāyāma — 2.77
title: The Satwa of his or her body becomes free
unit_type: verse
commentary: 'This verse distills the fruit of sustained haṭha practice: a purified, settled state of mind
  (satwa) that is no longer turbulent or fragmented. The passage suggests that such stability is not merely
  personal peace, but a kind of natural authority or mastery—the practitioner becomes a guide or exemplar
  among other seekers. The claim is radical yet grounded: perfection of the body-breath system yields
  a quality of being that others recognize and trust.



  Key Terms



  **Satwa** — In classical Yoga and Sāṃkhya philosophy, one of three guṇas (qualities); satwa is clarity,
  harmony, and luminosity—the refined state of mind free from agitation and delusion.

  **Haṭha yoga** — The yoga of force or effort; the systematic practice of āsana (postures), prāṇāyāma
  (breath control), and other techniques to prepare the body and subtle channels for higher states of
  consciousness.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.48 (sthita-prajñasya kā bhāṣā):** Both texts describe equanimity and freedom from
  disturbance as the mark of a realized being—a steadiness that is both inner and recognized by others.
  Divergence: The Gītā emphasizes duty and action within the world; the Haṭha Yoga Pradīpikā focuses on
  technical bodily discipline as the gateway to that stability.


  **Patañjali''s Yoga Sūtra 1.2 (yogaś chitta-vṛtti-nirodhah):** Both root yoga in the stilling of mental
  fluctuations; both imply that this stillness is the true achievement. Divergence: Patañjali emphasizes
  mental discipline directly; Svātmārāma teaches that the body and breath are the practical lever for
  that mental work.


  **Heraclitus, Fragment 45 (a dry soul is wisest):** Both suggest that clarity and mastery arise from
  a refined, undisturbed state—a kind of inner dryness or purity that enables wisdom. Divergence: Heraclitus
  speaks of wisdom as intellectual virtue; the Haṭha text grounds it in embodied practice and the transformation
  of vital energy.'
