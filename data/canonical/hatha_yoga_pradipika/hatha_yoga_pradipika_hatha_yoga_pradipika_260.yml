title: This Yoga is achieved by courageous wise men
unit_type: verse
commentary: 'Svātmārāma opens with a stark claim: haṭha yoga demands both courage and wisdom, and requires
  active engagement—it is not a passive gift. The exclusion of the slothful is not moral judgment but
  a practical statement: the practices (breath work, postures, inner locks) require sustained effort and
  clear intention. This frames yoga not as escape or comfort, but as a discipline that calls forth the
  student''s own agency and discernment.



  Key Terms



  **Yoga** — In this context, the integrated practice of haṭha yoga—physical, energetic, and meditative
  disciplines—understood as a path toward higher states of consciousness (rāja yoga).

  **Sloth (ālasya)** — Inertia, lethargy, or lack of will; the opposite of the active engagement required
  to sustain yogic practice.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.23–24:** Both texts emphasize that yoga requires steadfast effort and discipline;
  the Gītā similarly warns that yoga is ''hard to attain'' without dedication. Divergence: The Gītā frames
  effort within devotion to the divine; the Pradīpikā emphasizes the technical and courageous mastery
  of the body''s energies themselves.


  **Aristotle, Nicomachean Ethics II.1:** Both suggest that virtue (or skill) is not innate but cultivated
  through repeated, deliberate practice—requiring courage and wisdom to sustain. Divergence: Aristotle''s
  focus is ethical habit; Svātmārāma''s is the transformation of subtle bodily energies toward liberation.'
