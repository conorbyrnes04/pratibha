title: In a clean spot, clean room and charming ground, he…
unit_type: verse
commentary: 'This opening instruction establishes the foundational conditions for practice: external cleanliness,
  a prepared space, and an inward orientation toward lineage (guru) and the sacred (deity). The passage
  suggests that haṭha yoga is not merely physical technique but a relational act—rooted in respect for
  transmission and devotion. The sequence (clean space, then seated posture, then remembrance) implies
  that outer order and inner reverence are inseparable prerequisites for what follows.



  Key Terms



  **āsana** — A seat or posture; here, the cloth or mat upon which one sits for practice, establishing
  a stable and respectful foundation.

  **guru** — A teacher or guide; invoked here as a living link in the transmission of practice and wisdom.



  Cross-Tradition Resonances



  **Dhammapada, verse 24 (Buddhist tradition):** Both texts emphasize the necessity of right conditions
  and mindful preparation before undertaking transformative practice; remembrance of the teacher parallels
  the Buddhist refuge in the Sangha. Divergence: The Dhammapada emphasizes ethical conduct as the foundation;
  the Haṭha Yoga Pradīpikā begins with spatial and devotional preparation, suggesting a different entry
  point.


  **Tao Te Ching, chapter 15 (Daoist tradition):** Both texts value simplicity, clarity, and a return
  to foundational conditions—the ''clean spot'' echoes the Daoist emphasis on emptiness and preparation.
  Divergence: The Haṭha Yoga Pradīpikā explicitly invokes lineage and deity, whereas the Tao Te Ching
  points toward an impersonal, nameless source.'
