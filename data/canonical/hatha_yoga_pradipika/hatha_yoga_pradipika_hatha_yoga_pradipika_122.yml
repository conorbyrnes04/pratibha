translation: In a clean spot, clean room and charming ground, he or she should spread a soft âsana (cloth
  for sitting on). Having seated on it and remembering in his or her mind his or her guru and his or her
  god or goddess.
abhyasa: Before sitting today, choose or prepare a small, clean space—even a corner. Sit there briefly
  and bring to mind someone (teacher, elder, ancestor, or sacred figure) who represents wisdom or care
  to you. Notice how this simple act of remembrance shifts your inner state before you begin anything
  else.
