title: Evening sandhya should always be performed after practice
unit_type: verse
commentary: 'This brief instruction anchors haṭha yoga practice within a rhythmic, cyclical view of time
  and the body''s receptivity. The prescription to perform evening sandhya (twilight ritual/transition)
  after practice suggests that yoga is not isolated exertion but part of a larger ceremonial and temporal
  order—one that honors the body''s natural transitions and closes the practice with ritual attention.
  Practicing at midnight (rather than dawn) marks haṭha yoga as a specific, perhaps more subtle or advanced
  undertaking, distinct from other spiritual disciplines, and implies that the night hours hold particular
  potency for internal work.



  Key Terms



  **sandhya** — Twilight ritual or transitional practice, performed at dawn or dusk; here, a ceremonial
  closing after yoga practice

  **haṭha yoga** — The yoga of force or effort; the physical and energetic practices (āsana, prāṇāyāma,
  mudrā, bandha) that prepare the body and mind for meditation and liberation



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both texts honor timing and subtlety: the Tao Te Ching speaks
  of working with natural rhythms and the unseen; the Pradīpikā prescribes midnight practice, suggesting
  that depth work happens in stillness and darkness. Divergence: The Tao Te Ching emphasizes non-action
  (wu wei) and effortlessness, while haṭha yoga explicitly names itself the yoga of ''force'' or disciplined
  effort.


  **Ecclesiastes 3:1: ''To everything there is a season, and a time to every purpose under heaven.'':**
  Both passages root spiritual work in temporal order—the recognition that certain times are suited to
  certain practices, and that rhythm itself is sacred. Divergence: Ecclesiastes speaks of life''s seasons
  broadly (birth, death, weeping, dancing); the Pradīpikā is prescriptive about a specific esoteric practice
  at a specific hour.'
