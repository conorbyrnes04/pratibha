translation: Success comes to him or her who is engaged in the practice. How can one get success without
  practice; for by merely reading books on Yoga, one can never get success.
abhyasa: Today, notice one moment where you read or think about a practice (yoga, meditation, or another
  discipline) instead of doing it. Pause, and choose one small action—three conscious breaths, one minute
  of stillness, one stretch—and do it. Observe the difference between knowing and doing.
