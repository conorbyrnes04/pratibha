title: He or she is really the guru and not to be…
unit_type: verse
commentary: 'This verse establishes a crucial boundary: the guru''s authority rests not in being a divine
  incarnation, but in faithful transmission of lineage knowledge. The teaching itself—the mudras passed
  mouth-to-ear across generations—is what confers legitimacy, not the guru''s personal spiritual status
  or claims to godhood. This grounds the teacher-student relationship in practice and continuity rather
  than charisma or supernatural authority.



  Key Terms



  **guru** — A qualified teacher who transmits knowledge and practice through direct lineage; authority
  derives from faithful transmission, not personal divinity.

  **mudra** — A gesture, seal, or energetic lock used in haṭha yoga practice; here, any teaching passed
  down through the lineage.



  Cross-Tradition Resonances



  **Dhammapada 190:** Both reject guru-worship based on appearance or claims: ''Not by matted hair, nor
  by lineage, nor by caste does one become a brahmin. One in whom truth and dharma exist—he is pure, he
  is a brahmin.'' Divergence: The Dhammapada emphasizes the student''s own virtue as the measure; the
  Haṭha Yoga Pradīpikā emphasizes the teacher''s fidelity to transmitted method.


  **Kena Upanishad I.2:** Both suggest the guru is a conduit rather than the source: ''That which cannot
  be perceived by the eye... but by which the eye sees—know that alone to be Brahman.'' The teaching points
  beyond the teacher. Divergence: The Upanishad points to transcendent reality; the Haṭha Yoga Pradīpikā
  grounds authority in the practical lineage of mudras and techniques.'
