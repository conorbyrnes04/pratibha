  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: This exercise increases the appetite; and, therefore, one who practices it, should obtain
  a good supply of food. If the food be scanty, it will burn him or her at once.
abhyasa: 'Before or after your next breath practice, pause and notice your hunger—physical and otherwise.
  Ask: Am I adequately nourished (food, rest, community) to sustain what I am undertaking? This simple
  check honors the teaching that practice without care becomes harm.'
