title: This exercise increases the appetite;
unit_type: verse
commentary: 'This passage addresses a practical consequence of intense prāṇāyāma practice: the body''s
  metabolic demand increases sharply, and without adequate nourishment, the practitioner risks harm rather
  than progress. Svātmārāma grounds yoga not in abstract spirituality but in the body''s real needs, suggesting
  that sincere practice requires material support—food, rest, stability—as much as discipline. The warning
  implies that yoga is not ascetic denial but intelligent attunement to what the body requires to transform.



  Key Terms



  **prāṇāyāma** — regulation and extension of breath; foundational practice in haṭha yoga that increases
  vital energy (prāṇa) and metabolic demand



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16–17 (on yoga and moderation in eating):** Both texts insist that yoga requires balance—neither
  excess nor deprivation—and that the body must be honored as the vessel of practice. Divergence: The
  Gītā frames moderation as a virtue of temperance; the Pradīpikā frames it as a practical necessity to
  avoid burning out.


  **Hippocratic Corpus (on regimen and the body''s needs):** Both treat the body as a system with measurable
  needs; practice without proper diet is folly in both traditions. Divergence: The Pradīpikā ties nourishment
  to spiritual transformation; the Hippocratic texts are purely medical.'
