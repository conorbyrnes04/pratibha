title: Nada is the snare for catching the mind;
unit_type: verse
commentary: 'This verse presents sound (nāda) as a paradoxical tool: both a trap and a means of liberation.
  The mind, compared to a wild deer, is elusive and restless; nāda—whether internal vibration or mantra—functions
  as bait that draws and fixes attention. Once the mind is ''caught'' in focused listening or resonance,
  it becomes tractable, capable of being stilled or transformed. The image suggests that what captures
  the mind''s wandering nature is also what can lead to its mastery.



  Key Terms



  **nāda** — Sound or vibration; in haṭha yoga, the subtle internal sound heard in meditation, or the
  principle of resonance used to gather and stabilize the mind.

  **samādhi** — Absorption or unified consciousness; the goal of yoga practice, where the mind merges
  with its object of focus.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.26 (on steadying the mind):** Both texts treat the mind as naturally restless and
  requiring a method—here, sound; there, repeated practice—to anchor it toward liberation. Divergence:
  The Gītā emphasizes renunciation and duty; the Pradīpikā emphasizes embodied technique and internal
  vibration as the primary path.


  **Patañjali''s Yoga Sūtra 1.14 (practice and detachment):** Both recognize that the mind must be ''caught''
  or held steady through sustained effort before transformation occurs. Divergence: Patañjali stresses
  dispassion (vairāgya) as the counterpart to practice; Svātmārāma emphasizes the sensory and energetic
  capture via nāda itself.'
