translation: Nada is the snare for catching the mind; and, when it is caught like a deer, it can be killed
  also like it.
abhyasa: Sit quietly and listen to the ambient sound around you—traffic, wind, breath—without naming or
  judging it. When your mind wanders, return attention to the sound itself, as if you were a deer drawn
  to a call. Notice how sound naturally gathers and steadies attention. Practice this for 5–10 minutes,
  observing whether the mind becomes quieter as it becomes more focused.
practice: Sit quietly and listen to the ambient sound around you—traffic, wind, breath—without naming
