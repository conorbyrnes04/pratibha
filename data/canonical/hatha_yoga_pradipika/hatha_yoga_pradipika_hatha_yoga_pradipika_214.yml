  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The word (râsana[?]) means tongue; eating it is thrusting it in the gullet which destroys
  great sins.
abhyasa: Sit quietly and gently notice the position of your tongue in your mouth. Without forcing or straining,
  become aware of how the tongue naturally rests. This simple attention—observing rather than manipulating—can
  open inquiry into how the body and subtle awareness are linked in yogic practice.
