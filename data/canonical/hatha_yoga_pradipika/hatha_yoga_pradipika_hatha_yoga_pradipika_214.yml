title: The word (râsana[?]) means tongue;
unit_type: verse
commentary: 'This cryptic verse describes a practice (likely khecarī mudrā, the tongue-lock) in which
  the tongue is drawn back toward the throat. The passage frames this physical action as spiritually potent—capable
  of ''destroying great sins''—suggesting that haṭha yoga operates not merely on the body but on the subtle
  karmic dimension of the practitioner. The compression of profound claim into plain anatomical language
  is characteristic of the Pradīpikā''s style: material technique and spiritual result are presented as
  inseparable.



  Key Terms



  **mudrā** — A ''seal'' or gesture—physical posture or lock of the body (and energy channels) used to
  direct and contain prāṇa (life force) in yogic practice

  **prāṇa** — Life force or vital breath; the animating energy that moves through the body and is refined
  through yogic practice



  Cross-Tradition Resonances



  **Patañjali, Yoga Sūtra 1.2 (yogaś chitta-vṛtti-nirodhah):** Both texts treat yoga as a disciplined
  transformation of consciousness; the Pradīpikā''s emphasis on physical technique as a gateway to inner
  states aligns with Patañjali''s integration of body and mind. Divergence: Patañjali emphasizes mental
  restraint (vṛtti-nirodhah) as primary; the Pradīpikā privileges prāṇāyāma and mudrā as the practical
  entry point, suggesting the body is the first teacher.


  **Taoist internal alchemy texts (e.g., Secret of the Golden Flower):** Both traditions locate spiritual
  transformation in precise manipulation of subtle energies through the body—tongue, breath, channels—rather
  than abstract meditation alone. Divergence: The Pradīpikā frames these practices within karma and sin;
  Taoist alchemy emphasizes immortality and cosmic harmony, a different soteriological horizon.'
