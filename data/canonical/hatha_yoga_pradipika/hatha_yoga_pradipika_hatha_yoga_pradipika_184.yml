title: Consumption, leprosy, prolapsus anii, colic, and…
unit_type: verse
commentary: 'This verse lists specific physical ailments—digestive disorders, skin disease, and structural
  collapse—that the Mahā Mudrā is said to address, grounding the practice in concrete bodily benefit rather
  than abstract spirituality. The passage reflects haṭha yoga''s pragmatic orientation: the body is not
  transcended but refined and healed through precise technique, making physical wellness a legitimate
  gateway to higher states. The enumeration of illnesses suggests the text speaks to practitioners with
  real suffering, not merely philosophical seekers.



  Key Terms



  **Mahā Mudrā** — A seal or gesture (mudrā) described in the Haṭha Yoga Pradīpikā as a powerful practice;
  ''mahā'' means great. In this context, it is presented as a therapeutic and transformative technique.

  **haṭha yoga** — The yoga of force or effort; the systematic cultivation of bodily posture, breath control,
  and energetic locks to prepare the nervous system for meditation and liberation.



  Cross-Tradition Resonances



  **Hippocratic Corpus (ancient Greek medicine):** Both traditions assume that specific practices address
  specific bodily imbalances—a diagnostic, empirical approach to health rather than one-size-fits-all
  remedy. Divergence: Greek medicine attributed illness to humoral imbalance; haṭha yoga locates it in
  prāṇic (energetic) obstruction and seeks to restore flow through mudrā and prāṇāyāma rather than bloodletting
  or herbs.


  **Daoism / Zhuangzi:** Both honor the body as a microcosm worthy of cultivation and see physical practice
  as inseparable from spiritual refinement. Divergence: Daoism often emphasizes wu wei (non-action); haṭha
  yoga is explicitly haṭha—forceful, disciplined technique requiring sustained effort and a teacher''s
  guidance.'
