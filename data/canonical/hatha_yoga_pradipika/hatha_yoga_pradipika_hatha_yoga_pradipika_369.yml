  label: Translation
  body: Contemplation on the space between the eyebrows is, in my opinion, best for accomplishing soon
    the Unmani state. For people of small intellect, it is a very easy method for obtaining perfection
    in the Raja-Yoga. The Laya produced by nada, at once gives experience (of spiritual powers).
