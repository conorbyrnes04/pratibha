  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Ida is called the goddess Ganges, Pingala goddess Yamuna. In the middle of the Ida and the
  Pingala is the infant widow, Kundali.
abhyasa: 'Sit quietly and bring attention to the space between your nostrils—the meeting place of breath.
  Without forcing, notice the subtle flow of air through each nostril. Silently acknowledge: one side
  is the river of the moon, one the river of the sun. Rest your awareness in the center channel between
  them for a few breaths, simply witnessing the stillness there.'
