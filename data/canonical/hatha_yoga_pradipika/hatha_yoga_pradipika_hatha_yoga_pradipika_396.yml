translation: There is no doubt, such a Yogi or Yogini becomes free from all states, from all cares, and
  remains like one dead.
abhyasa: 'Today, notice one moment when you are caught in a ''state'' or ''care''—a worry, preference,
  or emotional reaction. Pause. Observe it without trying to change it, as if you were watching something
  that no longer belongs to you. Breathe slowly and ask: what would it feel like to remain unmoved by
  this, like a witness rather than a participant?'
