translation: Having stretched the feet on the ground, like a stick, and having grasped the toes of both
  feet with both hands, when one sits with his or her forehead resting on the thighs, it is called Paschima
  Tâna.
abhyasa: 'Sit with legs extended. Without forcing, fold forward from the hips and gently grasp your shins,
  ankles, or toes—wherever your hands naturally reach. Rest your forehead toward your thighs (or knees,
  if that is your current capacity). Breathe naturally for several breaths. Notice: Where do you feel
  length? Where does effort arise? This is not about depth but about honest alignment and breath.'
