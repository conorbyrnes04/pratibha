title: It should be filled up to the lotus
unit_type: verse
commentary: 'This passage describes a prāṇāyāma technique in which breath is drawn upward through the
  body with deliberate force and sound, activating key energy centers (throat, chest, heart). The ''lotus
  of the heart'' refers to the spiritual center traditionally located at the heart chakra, understood
  as a seat of subtle energy and consciousness. The instruction emphasizes embodied, somatic engagement—sound,
  touch, and forceful movement—as means to direct and concentrate vital breath (prāṇa), a foundational
  principle in haṭha yoga''s path toward inner stability and higher states.



  Key Terms



  **prāṇa** — Vital life force or breath-energy that animates the body and mind; the object of regulation
  in prāṇāyāma practice.

  **lotus of the heart** — A subtle energy center (chakra) traditionally located at the heart, conceived
  as a seat of consciousness and spiritual awakening in yogic anatomy.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.29 (on breath control and sacrifice):** Both texts treat breath regulation as a disciplined
  practice that purifies and elevates consciousness, linking physical technique to spiritual transformation.
  Divergence: The Gītā frames breath control within a broader ethical and devotional context; the Haṭha
  Yoga Pradīpikā isolates it as a technical method with its own intrinsic power.


  **Patañjali''s Yoga Sūtra 2.49 (on prāṇāyāma as preparation for meditation):** Both texts present breath
  work as a foundational rung on the ladder toward samādhi, not an end in itself. Divergence: Patañjali
  emphasizes prāṇāyāma''s role in steadying the mind; the Pradīpikā emphasizes somatic sensation and the
  activation of subtle energy channels.'
