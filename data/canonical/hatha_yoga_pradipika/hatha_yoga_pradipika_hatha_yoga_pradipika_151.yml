translation: It should be filled up to the lotus of the heart, by drawing it in with force, making noise
  and touching the throat, the chest and the head.
abhyasa: Sit comfortably and, under no strain, practice slow inhalation through the nose while mentally
  tracing the path from your lower abdomen upward through your chest to your heart center. Notice any
  subtle sensations or vibrations in the throat and chest. Do not force or strain; the aim is awareness,
  not achievement. Repeat 3–5 times, then rest and observe the quality of your breath and presence.
