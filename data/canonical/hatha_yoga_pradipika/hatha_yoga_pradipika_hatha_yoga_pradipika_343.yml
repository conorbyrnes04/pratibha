  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Placing the mind into the Kundalini, and getting the later into the mind, by looking upon
  the Buddhi (intellect) with mind (reflexively), the Param Pada (Brahma) should be obtained.
abhyasa: 'Sit quietly and bring gentle awareness to the base of your spine. Without forcing or visualizing,
  simply notice the quality of attention itself—how awareness can both move outward and fold back upon
  itself. Then observe the mind observing: watch a thought arise, then notice the awareness that knows
  the thought. Rest in that reflexive space for a few minutes, without grasping.'
