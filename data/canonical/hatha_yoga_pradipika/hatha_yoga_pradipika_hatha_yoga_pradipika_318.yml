  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The breathing is calmed when the mind becomes steady and calm; and hence the preservation
  of bindu. The preservation of this latter makes the satwa established in the body.
abhyasa: 'Today, sit quietly for five minutes. Notice your breath without controlling it. Observe: when
  your mind wanders or tightens, does your breath become shallow or irregular? When you return attention
  gently to the breath, does the mind settle? Simply witness this reciprocal relationship—you need not
  ''fix'' anything, only see how mind and breath mirror each other.'
