title: The breathing is calmed when the mind becomes…
unit_type: verse
commentary: 'This passage describes a cascade of refinement: steady mind produces calm breath, which preserves
  bindu (the vital essence or generative force), which in turn establishes sattva (clarity, purity, harmony)
  in the body. The teaching suggests that mental steadiness is not merely a psychological state but has
  direct physiological consequences—breath and vital essence are not separate from mind but expressions
  of the same underlying stability. This economy of cause and effect is central to haṭha yoga''s claim
  that working with the body''s energies (prāṇa, bindu) is a direct path to transformation.



  Key Terms



  **bindu** — The vital drop or essence; in haṭha yoga, the concentrated generative force whose preservation
  is understood as essential to spiritual development and embodied stability.

  **sattva** — Clarity, purity, harmony, and luminosity; one of the three guṇas (qualities) of nature;
  here, the refined state of the body when vital essence is preserved.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12 (Patañjali): ''abhyāsa-vairāgyābhyāṁ tannirodhah'' (practice and non-attachment bring
  cessation of mental fluctuations):** Both texts posit that mental steadiness is foundational; the Pradīpikā
  adds that this steadiness has a somatic correlate in breath and vital essence. Divergence: Patañjali
  emphasizes mental discipline through philosophical means (vairāgya, dispassion); the Pradīpikā works
  through the body''s energetic channels, suggesting a more direct physiological path.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... their minds were still like a calm
  lake'':** Both traditions associate stillness of mind with a natural, undisturbed state and recognize
  this as foundational to deeper knowledge. Divergence: The Tao Te Ching emphasizes wu-wei (non-action)
  and receptivity; the Pradīpikā prescribes active prāṇāyāma and kriyā techniques to achieve that stillness.


  **Heraclitus, Fragment 12: ''All things flow'' (panta rhei):** Both acknowledge that breath and vital
  force are in constant motion; mastery lies in understanding and harmonizing this flow rather than denying
  it. Divergence: Heraclitus emphasizes flux as the nature of reality itself; the Pradīpikā seeks to stabilize
  and preserve the vital essence within that flux.'
