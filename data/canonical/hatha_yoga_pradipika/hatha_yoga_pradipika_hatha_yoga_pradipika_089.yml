title: By removing the impurities, the air can be…
unit_type: verse
commentary: 'This verse describes the cascade of benefits that follow from purification through prāṇāyāma
  practice: once the subtle channels (nāḍī) are cleared of obstruction, the breath becomes tractable and
  responsive to intention, appetite normalizes, inner sound (nāda) manifests, and physical health follows.
  The passage presents a non-linear causality—purification is not merely a moral or spiritual goal, but
  a practical prerequisite for the body and mind to function as intended instruments for yoga.



  Key Terms



  **impurities (mala)** — Obstructions in the subtle energy channels (nāḍī) and gross body that prevent
  the free flow of breath and vital force (prāṇa); removed through systematic practice.

  **divine sound (nāda)** — The inner, unstruck sound (ānāhata nāda) that arises spontaneously in meditation
  as the mind becomes subtle and refined; a sign of deepening practice.



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both texts
  present mastery as a refinement that increases responsiveness and attunement—breath becomes ''according
  to one''s wish'' as the Tao becomes naturally responsive to the sage. Divergence: The Haṭha Yoga Pradīpikā
  grounds this refinement in concrete bodily practice and purification; the Tao Te Ching emphasizes non-action
  and paradox.


  **Patañjali''s Yoga Sutras 2.28: ''By the practice of the limbs of yoga, impurities are destroyed; then
  arises wisdom which leads to discriminative awareness.'':** Both texts link purification (removal of
  mala/impurity) to clarity of perception and inner awakening; both present yoga as a systematic path.
  Divergence: Patañjali emphasizes discriminative wisdom (viveka) as the fruit; the Haṭha Yoga Pradīpikā
  emphasizes tangible signs: appetite, sound, health, and breath control.


  **Hippocrates: ''Healing is a matter of time, but it is sometimes also a matter of opportunity.'':**
  Both recognize that health emerges when conditions are properly aligned—here, when channels are clear
  and breath flows freely. Divergence: Hippocrates speaks of external timing and circumstance; the Haṭha
  Yoga Pradīpikā locates the opportunity within systematic internal work.'
