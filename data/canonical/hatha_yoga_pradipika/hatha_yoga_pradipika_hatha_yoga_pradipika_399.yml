title: He or she whose mind is neither sleeping, waking…
unit_type: verse
commentary: 'This verse describes liberation not as a state of blankness, but as a mind freed from the
  ordinary categories of consciousness itself—neither bound by sleep''s oblivion nor waking''s subject-object
  division, neither clinging to memory nor lost in forgetfulness. The paradoxical phrasing (neither disappearing
  nor appearing) suggests a consciousness that transcends the dualistic flicker of phenomenal existence.
  For the Haṭha Yoga Pradīpikā, this is the fruit of disciplined practice: a mind so refined through breath
  and posture that it rests in its own nature, prior to the usual mental operations.



  Key Terms



  **liberated** — In this context, freed from the conditioned patterns of mind (sleep, waking, memory,
  forgetting) that ordinarily bind consciousness to the cycle of experience.



  Cross-Tradition Resonances



  **Upaniṣads (Māṇḍūkya Upaniṣad, on turīya):** Both describe a fourth state of consciousness beyond waking,
  dreaming, and deep sleep—a witnessing awareness untouched by ordinary mental states. Divergence: The
  Upaniṣad names this state explicitly (turīya, ''the fourth''); the Pradīpikā defines it only by negation,
  emphasizing the paradox of what cannot be named.


  **Meister Eckhart, ''the naked Godhead'':** Both point to a consciousness stripped of all mental content
  and categorical thinking, a radical emptiness that is fullness. Divergence: Eckhart frames this as union
  with God; the Pradīpikā presents it as the mind''s own intrinsic nature, accessed through bodily and
  breath discipline.


  **Heraclitus, Fragment 45 (''the way up and down are one''):** Both suggest that opposites (appearing/disappearing,
  waking/sleeping) dissolve in a higher unity that transcends logical contradiction. Divergence: Heraclitus
  speaks of cosmic flux and logos; the Pradīpikā locates this unity in the individual mind through yoga
  practice.'
