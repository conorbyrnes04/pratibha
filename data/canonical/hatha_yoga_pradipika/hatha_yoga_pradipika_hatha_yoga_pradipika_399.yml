  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: He or she whose mind is neither sleeping, waking, remembering, destitute of memory, disappearing
  nor appearing, is liberated.
abhyasa: Today, sit quietly for five minutes. Without forcing or suppressing, notice the gaps between
  your thoughts—the brief spaces where you are neither actively remembering nor forgetting, neither fully
  alert nor drifting. Rest your attention there, gently, without trying to hold or lose it. This is a
  small taste of the mind's freedom from its own machinery.
