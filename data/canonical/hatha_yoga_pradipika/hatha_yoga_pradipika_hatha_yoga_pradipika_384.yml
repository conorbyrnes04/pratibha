translation: Nada is the bolt of the stable door for the horse (the minds of the Yogis and Yoginis). A
  Yogi or Yoginis should determine to practice constantly in the hearing of the nada sounds.
abhyasa: Sit quietly for 5–10 minutes in a comfortable position. Close your ears gently with your fingers
  or simply turn attention inward. Listen for any subtle sounds—a high-pitched tone, humming, or vibration—without
  forcing or imagining. When the mind wanders, return to listening. Notice how this simple act of attending
  to inner sound affects the quality of your mental restlessness.
