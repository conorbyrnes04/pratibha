  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: No success in Raja Yoga without Hatha Yoga, and no success in Hatha Yoga without Raja Yoga.
  One should, therefore, practice both of these well, till complete success is gained.
abhyasa: 'Today, as you practice an āsana or prāṇāyāma, pause midway and notice: Am I attending only to
  the physical sensation, or am I also observing the quality of my mind—its steadiness, clarity, or distraction?
  Let this dual awareness remind you that the posture and breath are not ends in themselves, but invitations
  to witness and refine the mind.'
