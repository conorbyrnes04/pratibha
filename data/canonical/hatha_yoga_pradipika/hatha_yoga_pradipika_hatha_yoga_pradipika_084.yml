translation: Just as lions, elephants and tigers are controlled by and by, so the breath is controlled
  by slow degrees, otherwise (i.e., by being hasty or using too much force) it kills the practitioner
  himself or herself.
abhyasa: 'Today, observe one cycle of your natural breath without trying to change it. Notice where you
  feel the breath most vividly—nostrils, chest, belly. Simply witness it as you would watch a wild animal
  from a safe distance: with attention, without force. This grounds the verse''s caution in direct experience.'
