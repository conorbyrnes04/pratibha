unit_label: On Prāṇāyāma — 2.15
title: Just as lions, elephants and tigers are controlled…
unit_type: verse
commentary: 'This verse warns that breath control (prāṇāyāma) demands patience and graduated effort, not
  force or haste. The animal metaphors—lions, elephants, tigers—suggest that the breath, like a powerful
  wild force, must be tamed incrementally through respect and skill, not conquered through aggression.
  The teaching implies that the breath is both the instrument and the teacher: mishandled, it becomes
  dangerous; approached with humility and care, it becomes a vehicle for deeper practice.



  Key Terms



  **prāṇāyāma** — Regulation and extension of breath; a foundational practice in haṭha yoga that works
  with vital life force (prāṇa) through controlled breathing.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize subtlety and gentleness over force: ''The ancient masters
  were profound and subtle... because they were subtle, they must be described with difficulty.'' Svātmārāma''s
  warning mirrors the Taoist principle that mastery comes through wu wei (non-forcing action). Divergence:
  The Haṭha Yoga Pradīpikā frames the danger as physical harm to the practitioner, while the Tao Te Ching
  emphasizes the inefficacy of force itself—a metaphysical rather than physiological concern.


  **Aristotle, Nicomachean Ethics, II.2:** Both texts teach that virtue (or mastery) is acquired through
  habituation and gradual practice: ''we become brave by doing brave acts.'' Svātmārāma''s ''by and by''
  echoes the necessity of incremental training. Divergence: Aristotle''s focus is ethical habituation
  toward a mean; Svātmārāma''s is energetic regulation toward samādhi—a different end, though the method
  of gradualism converges.'
