translation: Having kept it confined so long as possible, it should be expelled slowly. Having practiced
  on the left side, it should be practiced on the right side.
abhyasa: Sit comfortably and observe one complete breath cycle through each nostril separately, without
  forcing retention. Notice any asymmetry in ease, length, or sensation between left and right. This simple
  observation—not a full practice—can ground awareness in the body's natural imbalances and the possibility
  of gradual equilibration.
practice: Sit comfortably and observe one complete breath cycle through each nostril separately, without
  forcing retention. Notice any asymmetry in ease, length, or sensation between left and right. This simple
  observation—not a full practice—can ground awareness in the body's natural imbalances and the possibility
  of gradual equilibration.
