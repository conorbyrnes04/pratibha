title: Having kept it confined so long as possible, it…
unit_type: verse
commentary: 'This verse describes a foundational prāṇāyāma technique: retention of breath (kumbhaka) followed
  by controlled exhalation, practiced alternately through each nostril. The instruction emphasizes balance
  and symmetry—what is done on one side must be mirrored on the other—suggesting that haṭha yoga seeks
  equilibrium between opposing forces (left/right, sun/moon channels). The deliberate pacing (''slowly'')
  and the discipline of ''confining'' breath point to the cultivated control of life-force (prāṇa) as
  central to the path.



  Key Terms



  **kumbhaka** — retention or holding of breath; a pause in the breath cycle used to intensify prāṇa control

  **prāṇa** — vital life-force or breath-energy that animates the body and mind



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize subtle mastery and gradual refinement over force; the Tao
  speaks of ''returning to infancy'' through patient practice, as the Pradīpikā teaches breath control
  through sustained, gentle discipline. Divergence: The Tao Te Ching emphasizes non-action (wu wei) and
  naturalness, while the Pradīpikā prescribes deliberate technique and systematic practice as the means
  to liberation.


  **Patañjali''s Yoga Sūtra, II.49–50:** Both texts treat prāṇāyāma as a rung on the ladder to higher
  states; Patañjali similarly describes breath regulation as preparation for concentration (dhāraṇā).
  Divergence: Patañjali presents prāṇāyāma more abstractly as a limb of yoga; the Pradīpikā offers concrete,
  embodied instructions for its practice.'
