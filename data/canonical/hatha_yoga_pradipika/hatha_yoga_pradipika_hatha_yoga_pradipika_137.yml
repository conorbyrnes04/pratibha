translation: After taking food he or she should read books treating of salvation, or hear Puranas and
  repeat the name of God.
abhyasa: After your next meal, spend ten minutes with a text that speaks to your own spiritual longing—sacred
  or philosophical writing that steadies the mind. Notice how the body, having been fed, becomes a quieter
  vessel for attention. This simple pairing honors the passage's insight that care for the physical and
  the contemplative are not separate acts.
