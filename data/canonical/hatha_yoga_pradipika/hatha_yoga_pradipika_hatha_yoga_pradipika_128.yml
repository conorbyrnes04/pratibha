  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: While practicing, he or she should sit with Siddhâsana, and having performed bandhu and Kumbhaka,
  should begin with 10 Pranayamas the first day, and go on increasing 6 daily.
abhyasa: Sit comfortably today and observe your natural breath for 2–3 minutes without changing it. Notice
  where breath moves in your body, its rhythm, any holding or tension. This simple witnessing honors the
  text's emphasis on prāṇa as the bridge between body and mind, and prepares the ground for formal practice
  under qualified guidance.
