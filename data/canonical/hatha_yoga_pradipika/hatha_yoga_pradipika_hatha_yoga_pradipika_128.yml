unit_label: On Prāṇāyāma — 2.59
title: While practicing, he or she should sit with…
unit_type: verse
commentary: 'This verse outlines the foundational protocol for beginning prāṇāyāma practice: a specific
  seated posture (Siddhāsana), energetic locks (bandha), breath retention (Kumbhaka), and a graduated
  increase in repetitions. The progression—10 cycles on day one, then 6 additional cycles daily—reflects
  a principle central to the text: that haṭha yoga works through disciplined, incremental refinement of
  the vital breath (prāṇa) rather than force. The instruction assumes a living teacher-student relationship,
  as the text elsewhere emphasizes.



  Key Terms



  **prāṇāyāma** — Regulation and expansion of the vital breath (prāṇa) through controlled inhalation,
  retention, and exhalation; a core limb of haṭha yoga leading toward meditative absorption.

  **bandha** — Energetic locks or seals created by muscular contractions at specific points in the body,
  used to direct and contain prāṇa during breath work.

  **Kumbhaka** — Retention of breath; the pause between inhalation and exhalation, a key technique for
  intensifying prāṇic work.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize gradual, subtle refinement over dramatic transformation:
  ''The ancient masters were profound and subtle… because they were subtle, they must be described with
  difficulty.'' The Haṭha Yoga Pradīpikā''s daily increment of 6 cycles embodies this patient unfolding.
  Divergence: The Tao Te Ching emphasizes wu-wei (non-action), while the Pradīpikā prescribes deliberate,
  structured technique—a difference between yielding to natural flow and actively harnessing vital force.


  **Aristotle, Nicomachean Ethics II.1:** Both teach that virtue (or mastery) arises through repeated,
  graduated practice: ''We become just by doing just acts, temperate by doing temperate acts, brave by
  doing brave acts.'' The Pradīpikā''s daily increase mirrors this habituation model. Divergence: Aristotle
  grounds practice in ethical habit and social virtue; the Pradīpikā grounds it in the physiology and
  metaphysics of prāṇa and the path to samādhi.


  **Dhammapada, v. 21:** Both texts stress disciplined, incremental effort: ''Vigilance is the path to
  the Deathless; heedlessness is the path to death.'' The Pradīpikā''s precise protocol demands the same
  attentive, day-by-day commitment. Divergence: The Dhammapada frames practice as ethical mindfulness
  and liberation from suffering; the Pradīpikā frames it as energetic and somatic refinement toward transcendent
  absorption (samādhi).'
