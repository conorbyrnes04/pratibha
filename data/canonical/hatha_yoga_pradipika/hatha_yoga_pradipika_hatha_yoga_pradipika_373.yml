translation: In the beginning, the sounds heard are of great variety and very loud; but, as the practice
  increases, they become more and more subtle.
abhyasa: Sit quietly for 5–10 minutes in a comfortable upright posture. Without forcing, listen inwardly
  to any sounds present—ringing, humming, rushing, or silence itself. Notice their character without judgment.
  Return to this practice over weeks; observe whether the quality of what you hear shifts or becomes more
  refined. This is not about achieving a particular sound, but cultivating patient, non-grasping attention.
