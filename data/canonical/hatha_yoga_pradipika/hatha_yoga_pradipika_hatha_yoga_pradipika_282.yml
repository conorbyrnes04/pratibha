translation: After moving the Kundali, plenty of Bhastra should be performed. By such practice, he or
  she has no fear from the god of death.
abhyasa: 'Sit quietly and observe your natural breath for two minutes. Notice where fear of death or loss
  arises in your body—chest, belly, throat. Without forcing, simply acknowledge it. Then reflect: what
  would change if you trusted the continuity of your own vital energy, rather than identifying only with
  the fragile physical form? Return to observing the breath.'
