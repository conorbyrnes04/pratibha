translation: By the purification of Prana, and Apana, urine and excrements decrease. Even an old man or
  woman becomes young by constantly practicing Mula Bandha.
abhyasa: Sit quietly and bring awareness to the base of your spine and pelvic floor. Without forcing,
  notice the natural rhythm of your breath and the subtle sensations in that region. This is a beginning
  of *attention* to the area Mūla Bandha addresses—not an instruction to practice the bandha itself, but
  an invitation to sense why the text locates renewal there.
practice: Sit quietly and bring awareness to the base of your spine and pelvic floor. Without forcing,
