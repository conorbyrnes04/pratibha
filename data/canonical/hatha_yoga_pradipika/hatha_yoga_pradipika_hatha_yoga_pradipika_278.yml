  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By this Kundalini leaves the entrance of the Susumna at once, and the Prana enters it of itself.
abhyasa: 'Sit quietly and notice where your breath naturally flows—nostrils, chest, belly. Without forcing, observe: where
  does attention and sensation follow the breath? This simple noticing honors the passage''s insight that prāṇa moves ''of
  itself'' when obstacles soften, rather than through strain.'
