unit_label: On Samādhi — 4.98
title: The antahkarana (mind), like a deer, becomes…
unit_type: verse
commentary: 'This verse uses the metaphor of a deer captivated by sound to illustrate how the mind''s natural tendency toward
  distraction can paradoxically become a tool for its own mastery. When the antahkarana (the inner instrument of mind, intellect,
  and ego) is arrested by a single object of attention—here, a sound—it becomes still and vulnerable. For the ''expert archer''
  (the practitioner of yoga), this stillness is the opening: the mind that has been gathered and made motionless is now ready
  to be ''killed,'' or dissolved, into higher states of consciousness. The passage suggests that mastery begins not with forcing
  the mind into submission, but with understanding its nature and using its own mechanisms of absorption against its habitual
  restlessness.



  Key Terms



  **antahkarana** — The inner instrument of mind, intellect, and sense of individual ego; the subtle apparatus through which
  consciousness operates and perceives.

  **rāja yoga** — The ''royal path'' of yoga, traditionally understood as the direct cultivation of samādhi (absorption) through
  mastery of mind; haṭha yoga is presented here as a preparatory ladder to it.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.25–26 (on steadying the mind):** Both texts teach that the mind becomes still through patient, repeated
  practice of focusing on a single object, and that this stillness is the gateway to higher realization. Divergence: The Gītā
  emphasizes the mind''s return to the Self through devotion and discrimination; the Pradīpikā emphasizes the body-breath-mind
  nexus and the technical practices (āsana, prāṇāyāma) that prepare the ground.


  **Patañjali''s Yoga Sūtra 1.12–14 (on abhyāsa and vairāgya):** Both texts recognize that mastery of mind requires both sustained
  practice and a kind of non-grasping; the deer''s absorption mirrors the one-pointed focus (ekāgratā) that Patañjali names
  as essential. Divergence: Patañjali frames the path as ethical and philosophical; the Pradīpikā is explicitly embodied and
  technical, rooting the work in prāṇa (life-force) and the physical body.


  **Heraclitus, Fragment 45 (on the bow and lyre):** Both use the image of a tool (bow, bell) and a natural creature (deer,
  name) to suggest that tension and harmony, stillness and motion, are complementary principles in any mastery. Divergence:
  Heraclitus speaks of cosmic tension and flux as fundamental; the Pradīpikā speaks of transcending flux through the dissolution
  of mind into samādhi.'
