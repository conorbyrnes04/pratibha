  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The antahkarana (mind), like a deer, becomes absorbed and motionless on hearing the sound of bells, etc.; and
  then it is very easy for an expert archer to kill it.
abhyasa: Today, sit quietly and choose one simple sound—a bell, a chime, or even the hum of a single note. Rather than trying
  to quiet your mind, allow it to become completely absorbed in that sound, as the deer becomes absorbed. Notice how, in that
  absorption, the usual chatter falls away. Spend 5–10 minutes with this, and observe what stillness feels like when it arises
  naturally, not forced.
