translation: Amaroli, Vajroli and Saholi are accomplished when the mind becomes calm and Prana has entered
  the middle channel.
abhyasa: 'Today, notice the quality of your ordinary breath and attention. Without forcing, observe: when
  your mind settles (even briefly—during a walk, or watching light), does your breathing seem to deepen
  or center? This simple noticing honors the passage''s teaching that calm mind and centered breath are
  not separate achievements but aspects of a single reorientation.'
