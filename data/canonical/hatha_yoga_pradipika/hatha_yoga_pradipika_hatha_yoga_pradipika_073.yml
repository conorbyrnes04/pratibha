title: The breath does not pass through the middle channel
unit_type: verse
commentary: 'This passage identifies a central problem in haṭha yoga: the energy channels (nadis) are
  obstructed by impurities, preventing the breath (prana) from flowing through the central channel (susumna),
  which is necessary for the highest meditative state (unmani avastha). The text frames the entire practice
  as a systematic removal of these blockages—without clean channels, the goal remains unreachable. This
  establishes why the preliminary disciplines of the text (asana, pranayama, mudra, bandha) are not optional
  refinements but essential prerequisites.



  Key Terms



  **susumna** — The central energy channel of the body, running along the spine; the pathway through which
  prana must flow for the highest states of yoga to be realized.

  **nadis** — The subtle channels or pathways through which vital energy (prana) circulates in the body;
  their purity or obstruction directly affects spiritual progress.

  **unmani avastha** — A state of consciousness beyond the mind (unmani = ''no-mind''); a meditative absorption
  considered a gateway to samadhi and the culmination of haṭha yoga practice.



  Cross-Tradition Resonances



  **Yoga Sutras 1.2 (Patañjali): ''Yoga is the cessation of the fluctuations of the mind.'':** Both texts
  treat yoga as the stilling of mental activity; the Pradīpikā locates this stilling in the body''s energetic
  purification, while Patañjali emphasizes direct mental discipline. Divergence: The Pradīpikā assumes
  the body and breath are the primary instruments of transformation; the Sutras treat the mind as primary
  and the body as secondary.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... Because they were subtle, they
  must be described with difficulty.'':** Both traditions recognize that subtle obstruction (impurity,
  blockage) prevents access to the highest states; both require patient, precise work to clear the way.
  Divergence: The Pradīpikā offers concrete technical practices (pranayama, mudra); the Tao Te Ching points
  toward non-action and paradox as the method.


  **Dhammapada 273: ''The path to the Deathless is mindfulness; heedlessness is the path to death.'':**
  Both texts present a clear binary: one path leads to liberation, the other to bondage; both require
  active purification or cultivation to traverse the higher path. Divergence: The Dhammapada emphasizes
  ethical conduct and mental vigilance; the Pradīpikā emphasizes energetic and respiratory purification
  as the primary means.'
