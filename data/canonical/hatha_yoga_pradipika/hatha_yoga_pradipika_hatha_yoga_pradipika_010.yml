commentary: 'This passage frames haṭha yoga not as an esoteric secret but as practical shelter—a house
  against suffering, a stable foundation like the tortoise that bears the world in Hindu cosmology. The
  ''three tāpas'' (heat, burning, afflictions) refer to the three categories of suffering recognized in
  classical yoga philosophy: those arising from the body and mind, from other beings, and from the cosmos
  itself. The image suggests that yoga''s physical and energetic disciplines are not ornamental but protective,
  offering refuge to those who commit to sustained practice.



  Key Terms



  **tāpas** — Burning, heat, or affliction; in yoga philosophy, the three categories of suffering: those
  from one''s own body-mind, from other beings, and from the natural world.

  **haṭha yoga** — The yoga of force or effort; the system of physical postures, breath control, and energy
  locks presented as a preparatory path toward rāja yoga (the royal yoga of meditation and samādhi).



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12 (Patañjali): ''abhyāsa vairāgyābhyāṁ tannirodhah'' (practice and non-attachment bring
  cessation of mental fluctuations):** Both texts present yoga as a disciplined, sustained practice that
  yields protection or freedom from suffering through commitment. Divergence: The Yoga Sūtra emphasizes
  mental discipline and non-attachment as the mechanism; the Haṭha Yoga Pradīpikā emphasizes the body
  and breath as the primary instruments of that protection.


  **Dhammapada 21: ''Heedfulness is the path to the Deathless; heedlessness is the path to death.'':**
  Both texts present a disciplined practice as a shelter or refuge from suffering, requiring sustained
  attention and commitment. Divergence: The Dhammapada frames the refuge as ethical mindfulness and wisdom;
  the Haṭha Yoga Pradīpikā locates it in the body''s energetic and physical transformation.'
