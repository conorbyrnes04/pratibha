  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Like a house protecting one from the heat of the sun, Hatha Yoga protects its practisers
  from the burning heat of the three Tāpas; and, similarly, it is the supporting tortoise, as it were,
  for those who are constantly devoted to the practice of Yoga.
abhyasa: 'Today, notice one moment of inner or outer ''heat''—restlessness, friction, discomfort—and pause.
  Recall that your breath and body are available as shelter. Take three slow, deliberate breaths, feeling
  the stability of your seated or standing form. This simple act echoes the passage''s promise: that yoga
  practice, even in small measure, can be a refuge.'
