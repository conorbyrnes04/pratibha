  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Pressing the left heel to the perineum and place the right foot on the left thigh.
abhyasa: 'Sit quietly and notice your own seated posture right now. Without forcing any adjustment, observe: where does your
  spine naturally want to lengthen? Where do your legs rest? This passage invites you to recognize that how we sit shapes
  what becomes possible in meditation—stability in the body creates conditions for steadiness in the mind.'
