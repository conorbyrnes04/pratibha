  body: Press firmly the heel of the left foot against the perineum, and the right heel above the lingha.
    With the chin pressing on the chest, one should sit calmly, having restrained the senses, and gaze
    steadily at the space between the eyebrows. This is called the Siddha âsana, the opener of the door
    of salvation.
