title: The belly above the navel is pressed backwards…
unit_type: verse
commentary: 'This verse describes Uddiyana Bandha—a contraction of the abdominal wall that draws energy
  upward—as a protective force against mortality itself. The metaphor of a lion subduing an elephant suggests
  that this seemingly simple physical action has profound spiritual potency: it is not merely muscular
  but a means of mastering the force of decay and dissolution. The passage implies that haṭha yoga''s
  physical techniques are gateways to transcendence, not separate from it.



  Key Terms



  **Uddiyana Bandha** — A lock or seal in haṭha yoga practice involving the upward drawing of the abdominal
  wall and diaphragm, traditionally used to direct and contain prāṇa (vital energy).

  **bandha** — A muscular lock or energetic seal used in yoga practice to contain and direct the flow
  of prāṇa.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.27 (''death is certain for the born''):** Both texts acknowledge death as an inescapable
  reality that yoga practice must address directly, not deny. Divergence: The Gītā frames acceptance of
  death through knowledge and duty; the Pradīpikā offers a somatic technique as the means of transcendence.


  **Patañjali''s Yoga Sūtra 2.46 (''āsana is steady and comfortable''):** Both root yoga in the body as
  the foundation for higher states, treating physical practice as spiritually significant. Divergence:
  Patañjali emphasizes the quality of ease in posture; the Pradīpikā emphasizes dynamic locks and energy
  control as transformative power.'
