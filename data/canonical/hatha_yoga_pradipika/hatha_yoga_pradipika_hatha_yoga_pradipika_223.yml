translation: The belly above the navel is pressed backwards towards the spine. This Uddiyana Bandha is
  like a lion for the elephant of death.
abhyasa: Sit quietly and bring awareness to the space just above your navel. Without forcing, notice the
  natural rise and fall of your belly with breath. Reflect on what it might mean to 'press backward'—not
  as strain, but as a gentle gathering of energy toward your spine. What shifts in your sense of vitality
  or presence when you hold this awareness?
