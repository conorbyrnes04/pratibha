translation: The following six bring speedy success:-- Courage, daring, perseverance, discriminative knowledge,
  faith, aloofness from company.
abhyasa: 'Today, notice one moment when you hesitate in your practice (physical, meditative, or ethical).
  Ask: which of these six is absent? Is it courage to feel what arises? Discriminative knowledge of what
  truly serves? Or faith that the effort matters? Name it plainly, and return to your practice with that
  quality as your focus.'
