  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The mind is like a serpent, forgetting all its unsteadiness by hearing the nada, it does not run away anywhere.
abhyasa: In your next breath practice or meditation, pause and listen inwardly for any subtle sound, vibration, or hum—whether
  in the ears, the heart, or the space between thoughts. Do not strain; simply notice what is already sounding. Return to
  this listening whenever the mind feels scattered, as an anchor rather than a goal.
