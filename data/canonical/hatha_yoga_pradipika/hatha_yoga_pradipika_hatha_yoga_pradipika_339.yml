unit_label: On Samādhi — 4.49
title: Freeing the mind from all thoughts and thinking
unit_type: verse
commentary: 'This verse describes a foundational posture of haṭha yoga practice: a state of mental stillness
  achieved through deliberate cessation of thought-activity, paired with stable physical seating. The
  image of ''a pot in space''—solid yet permeable, grounded yet open—suggests that the yogin becomes a
  vessel for something larger than the individual mind. The practice is not escape from thought but a
  disciplined emptying, creating conditions for the deeper work of yoga to unfold.



  Key Terms



  **āsana** — A steady, comfortable seated posture; the physical foundation for meditation and breath
  work in yoga practice.

  **ākāśa (ether/space)** — In yoga philosophy, the subtle element of space or ether; here, the boundless
  medium through which the stilled mind moves.



  Cross-Tradition Resonances



  **Tao Te Ching 15:** Both texts prize stillness and emptiness as the ground of wisdom: ''The ancient
  masters were profound and subtle... because they were subtle, they can only be described with difficulty.''
  Svātmārāma similarly points to a state beyond conceptual mind. Divergence: The Haṭha Yoga Pradīpikā
  anchors emptiness in a specific bodily practice (āsana, prāṇāyāma), whereas the Tao Te Ching emphasizes
  the Way itself as prior to all technique.


  **Patañjali''s Yoga Sūtra 1.2 (yogaś citta-vṛtti-nirodhah):** Both texts define yoga as the stilling
  of mental fluctuations. Svātmārāma''s ''freeing the mind from all thoughts'' echoes Patañjali''s foundational
  definition. Divergence: Patañjali''s sūtra is aphoristic and philosophical; Svātmārāma grounds the same
  principle in concrete physical practice and imagery.


  **Meister Eckhart, ''Poverty of Spirit'':** Eckhart speaks of becoming ''empty'' so that God may work:
  ''A person should be so poor that he is not and has not and wills not and desires not.'' The yogin''s
  emptying of thought parallels this receptive poverty. Divergence: Eckhart''s emptiness is framed theologically
  (union with God); Svātmārāma''s is presented as a technical state within a systematic path to samādhi,
  without explicit theistic language.'
