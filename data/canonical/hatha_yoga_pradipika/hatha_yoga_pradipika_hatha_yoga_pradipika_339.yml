translation: Freeing the mind from all thoughts and thinking of nothing, one should sit firmly like a
  pot in the space (surrounded and filled with the ether).
abhyasa: Sit upright in a comfortable, stable position. For 5–10 minutes, notice each thought as it arises,
  and gently release it without engagement—as though watching clouds pass through an open sky. Return
  attention to the quality of stillness itself, the 'space' around and within you. Do not strain; let
  the mind settle naturally.
practice: Sit upright in a comfortable, stable position. For 5–10 minutes, notice each thought as it arises,
