title: Kundali Sakti sleeps on the bulb
unit_type: verse
commentary: 'This passage presents Kundalini Shakti—the dormant spiritual power coiled at the base of
  the spine—as the pivotal force that determines liberation or bondage depending on the practitioner''s
  knowledge and awareness. The text suggests that Kundalini is not inherently good or bad, but rather
  responds to the state of consciousness: for those who understand yoga (self-knowledge), it becomes the
  means of moksha (liberation); for the ignorant, it remains a force of entanglement. To ''know'' yoga,
  then, is fundamentally to know Kundalini and her nature.



  Key Terms



  **Kundalini Shakti** — The dormant spiritual power or feminine energy coiled at the base of the spine;
  the force that, when awakened through yoga practice, conducts the practitioner toward liberation.

  **moksha** — Liberation; release from the cycle of bondage and rebirth; the ultimate goal of yoga practice.

  **yoga** — In this context, not merely physical postures, but the knowledge and direct realization of
  one''s true nature through disciplined practice.



  Cross-Tradition Resonances



  **Katha Upanishad (II.3.1): ''The Self is not known through study of the scriptures, nor through intellect,
  nor through much learning; but by him alone whom It chooses.'':** Both passages emphasize that true
  knowledge (of Kundalini, of the Self) is not merely intellectual but requires a direct, intimate knowing—a
  grace or recognition beyond ordinary understanding. Divergence: The Upanishad stresses the Self''s choosingness
  and transcendence; the Haṭha Yoga Pradīpikā locates the liberating force within the body itself and
  makes its awakening contingent on the yogi''s own practice and awareness.


  **Bhagavad Gita (II.39): ''This knowledge I have told you; now hear of yoga. Endowed with this wisdom,
  you will be freed from bondage.'':** Both texts present knowledge and yoga as inseparable paths to freedom;
  both suggest that ignorance is the root of bondage. Divergence: The Gita emphasizes knowledge of dharma
  and duty; the Haṭha Yoga Pradīpikā grounds liberation in the specific knowledge of Kundalini and her
  movement within the subtle body.


  **Heraclitus, Fragment 50: ''Listening not to me but to the Logos, it is wise to acknowledge that all
  things are one.'':** Both suggest that true knowing requires attunement to a force or principle beyond
  the ego; both imply that ignorance is a failure of this attunement. Divergence: Heraclitus points to
  a universal rational principle (Logos); the Haṭha Yoga Pradīpikā locates the principle of liberation
  in a specific embodied energy that must be consciously engaged.'
