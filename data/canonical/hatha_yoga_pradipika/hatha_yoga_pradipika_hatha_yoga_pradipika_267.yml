abhyasa: 'Today, sit quietly and place your attention at the base of your spine (the mūlādhāra). Without
  forcing or visualizing, simply notice the quality of your awareness there—heaviness, lightness, numbness,
  aliveness. Reflect: Am I meeting this place with knowledge (understanding my own nature) or ignorance
  (mechanical habit)? Let this simple noticing be your practice.'
