translation: When the system of Nadis becomes clear of the impurities by properly controlling the prana,
  then the air, piercing the entrance of the Susumna, enters it easily.
abhyasa: 'Today, observe your breath without forcing it. Notice where your attention naturally rests—nostrils,
  chest, belly. Gently ask: where do I feel blockage or resistance in my breathing? Sit with that awareness
  for five minutes. This is not practice, but honest noticing—the first step toward understanding what
  ''impurities'' might mean in your own body.'
