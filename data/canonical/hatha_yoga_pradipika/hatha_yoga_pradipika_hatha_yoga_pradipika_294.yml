title: Raja Yoga, Samadhi, Unmani, Manonmani, Amaratwa…
unit_type: verse
commentary: 'Svātmārāma presents a cascade of Sanskrit terms—each naming a state of liberation or transcendence—as fundamentally
  identical. Rather than hierarchical stages, these are synonyms for a single realization: the cessation of ordinary mind
  and the dissolution of subject-object duality. This opening move establishes that haṭha yoga''s technical practices (which
  follow in the text) are not ends in themselves, but a unified path toward one irreducible freedom.



  Key Terms



  **Samādhi** — Absorption or integration of consciousness; the culmination of meditative practice in which subject and object
  merge.

  **Sahaja** — Natural, spontaneous; liberation that arises effortlessly, without strain or artifice.

  **Jīvan Mukti** — Liberation while living; freedom realized in embodied life, not deferred to death.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Māṇḍūkya Upaniṣad on Turīya):** Both texts name the transcendent state as the fourth (*turīya*), beyond
  waking, dream, and sleep—a unified consciousness underlying all experience. Divergence: The Upaniṣads emphasize *ātman*
  (self) as the ground; Svātmārāma emphasizes the *cessation of mind* (*amanaska*) as the gateway.


  **Advaita Vedānta (Śaṅkara): non-duality (*advaita*):** Both traditions name the ultimate as non-dual (*adwaitama*), transcending
  all separation and multiplicity. Divergence: Advaita Vedānta stresses jñāna (knowledge); the Haṭha Yoga Pradīpikā insists
  that embodied prāṇāyāma and kriyā are necessary catalysts for that realization.


  **Daoism (Zhuangzi): wu wei (non-action) and ziran (spontaneity):** The term *sahaja* (natural, spontaneous) echoes the
  Daoist ideal of effortless action arising from alignment with the Way. Divergence: Daoism emphasizes social and cosmic harmony;
  haṭha yoga locates spontaneity in the individual''s inner physiology and consciousness.'
