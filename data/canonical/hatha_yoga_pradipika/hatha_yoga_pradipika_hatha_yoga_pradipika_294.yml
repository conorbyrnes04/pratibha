abhyasa: 'Sit quietly and silently repeat or contemplate one of these terms—perhaps *samādhi* or *sahaja*—without grasping
  for its meaning. Notice how the mind reaches for definition, then rests. This mirrors the passage''s point: the names point
  beyond themselves to what cannot be named, only lived.'
