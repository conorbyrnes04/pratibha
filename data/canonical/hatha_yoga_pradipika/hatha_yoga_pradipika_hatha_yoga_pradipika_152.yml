unit_label: On Prāṇāyāma — 2.83
title: It should be expelled again and filled again and…
unit_type: verse
commentary: 'This verse describes the fundamental rhythm of prāṇāyāma—the deliberate cycling of breath
  expulsion and inhalation—using the blacksmith''s bellows as its model. The comparison is precise: just
  as bellows must be emptied and refilled repeatedly to generate heat and transform metal, the breath
  must be cycled with intention and regularity to transform the subtle body. The repetition (''again and
  again'') emphasizes that this is not a single act but a disciplined practice, a rhythm to be embodied.



  Key Terms



  **prāṇāyāma** — Regulation and extension of breath; one of the core practices of haṭha yoga, understood
  as a means to direct vital energy (prāṇa) through the body''s subtle channels.



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both texts value cyclical, repetitive practice as a path to
  subtle transformation; both use natural metaphors (bellows, water, valley) to convey the work. Divergence:
  The Tao Te Ching emphasizes non-action and mystery; the Haṭha Yoga Pradīpikā prescribes precise, deliberate
  technique.


  **Bhagavad Gītā 6.11-12: ''In a clean place, having established a firm seat... let him practice yoga
  for the purification of the self.'':** Both texts frame yoga as a disciplined, methodical practice requiring
  repetition and proper conditions for inner transformation. Divergence: The Gītā emphasizes mental steadiness
  and devotion; the Pradīpikā focuses on the mechanics of breath and subtle body.'
