translation: It should be expelled again and filled again and again as before, just as a pair of bellows
  of the blacksmith is worked.
abhyasa: 'Sit quietly for a few minutes. Observe one complete breath cycle—exhalation, inhalation, pause.
  Now imagine a blacksmith''s bellows: empty, then full, then empty again. Without forcing, notice how
  your own breath naturally follows this opening and closing. Repeat this observation for five cycles,
  letting the image anchor your awareness to the breath''s dual motion.'
