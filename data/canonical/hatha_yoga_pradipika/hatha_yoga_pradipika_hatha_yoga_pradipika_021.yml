  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Having kept both the hands under both the thighs, with the body straight, when one sits calmly
  in this posture, it is called Swastika.
abhyasa: Sit with your spine naturally upright. Place both hands under your thighs, palms down. Notice
  how this gesture naturally draws your shoulders back and your chest forward. Breathe quietly for 2–3
  minutes, observing whether this simple arrangement settles your mind or reveals restlessness. This is
  not 'doing' yoga, but preparing the body to listen.
