translation: He or she should be neither of his or her inside nor of his or her outside world; and, leaving
  all thoughts, he or she should think of nothing.
abhyasa: 'Sit quietly for five minutes. Notice where your attention naturally goes—to internal sensations,
  emotions, or external sounds and sights. Rather than suppress either, simply observe the gap between
  them: the awareness that is neither your thoughts nor the world around you. Rest there, without grasping
  or rejecting what arises.'
