title: He or she should be neither
unit_type: verse
commentary: 'This verse describes a state of consciousness beyond the dualism of inner and outer—neither
  absorbed in thought nor in sensory experience. The instruction to ''think of nothing'' does not mean
  blank unconsciousness, but rather the cessation of the mind''s habitual oscillation between subject
  and object, self and world. This is presented as a prerequisite condition for the deeper states of yoga,
  where the practitioner becomes available to something beyond the constructed self.



  Key Terms



  **samādhi** — In this context, the absorbed meditative state toward which haṭha yoga practices aim;
  a condition of unified consciousness beyond subject-object division



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.48 (''yoga is skill in action''):** Both texts present yoga as a discipline of consciousness
  that transcends ordinary mental activity and dualistic perception. Divergence: The Gītā emphasizes equanimity
  *within* action; this passage emphasizes the cessation of thought itself as the gateway.


  **Meister Eckhart, ''Blessed are the poor in spirit'':** Both point to a radical emptying—not of content,
  but of the ego''s claim to know or possess. Divergence: Eckhart frames this spiritually and theologically;
  the Pradīpikā frames it as a technical yogic state accessible through bodily and breath practice.


  **Tao Te Ching 15: ''The ancient masters were subtle, profound, and deep'':** Both describe a state
  of non-action and non-grasping as the highest attainment. Divergence: The Tao Te Ching emphasizes natural
  spontaneity; the Pradīpikā emphasizes disciplined practice as the means to reach it.'
