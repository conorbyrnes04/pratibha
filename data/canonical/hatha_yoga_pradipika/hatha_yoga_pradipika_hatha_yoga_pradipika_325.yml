translation: Aiming at Brahman inwardly, while keeping the sight directed to the external objects, without
  blinking the eyes, is called Sambhavi Mudra, hidden in the Vedas and the Sastras.
abhyasa: 'For a few minutes today, sit upright and choose a fixed point at eye level (a mark on a wall,
  a candle flame, or the horizon). Gaze at it without blinking while mentally turning your attention inward—toward
  silence, breath, or the sense of awareness itself. Notice what happens when you hold both directions:
  the outer steadiness and the inner listening. Do not strain; if the eyes water, blink and begin again.
  This is the basic shape of the mudra.'
