title: The bulb is above the anus, a vitasti (12 angulas)…
unit_type: verse
commentary: 'This passage describes the mūlādhāra cakra (root center) in anatomical-symbolic terms, locating
  it in the subtle body as a precise, measurable entity with specific qualities: soft, white, folded.
  The Pradīpikā grounds mystical anatomy in concrete description, suggesting that yoga''s inner geography
  is not merely metaphorical but accessible to systematic observation and practice. This ''bulb'' becomes
  the foundation upon which prāṇic circulation and higher states are built.



  Key Terms



  **mūlādhāra** — The ''root support'' or base cakra, located at the base of the spine; the foundation
  of prāṇic circulation in haṭha yoga

  **vitasti** — A traditional measure of length, here used to specify the distance of the cakra above
  the anus (approximately 12 finger-widths)

  **angula** — A unit of measurement in classical Indian texts, roughly the width of a finger; used here
  for precise anatomical description



  Cross-Tradition Resonances



  **Upaniṣads (Yoga Upaniṣads, e.g., Kuṇḍalinī Upaniṣad):** Both texts locate subtle energy centers within
  the body and describe them with anatomical precision, treating inner anatomy as real and mappable. Divergence:
  The Upaniṣads often emphasize the transcendent light or consciousness at each center; the Pradīpikā
  is more pragmatic, focusing on measurable location and physical qualities for practice.


  **Aristotle''s De Anima:** Both traditions attempt to locate and describe the seat of vital force or
  animating principle within the body using concrete spatial language. Divergence: Aristotle grounds his
  account in observable anatomy and logic; the Pradīpikā describes a subtle body invisible to ordinary
  sight, known through practice and transmission.


  **Daoist internal alchemy texts (e.g., Secret of the Golden Flower):** Both traditions map energy centers
  and circulation routes within the body as a path to transformation and higher consciousness. Divergence:
  The Pradīpikā emphasizes breath control (prāṇāyāma) as the primary method; Daoist texts often foreground
  visualization and the refinement of jīng (essence) into qì (energy).'
