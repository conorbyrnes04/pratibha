translation: The bulb is above the anus, a vitasti (12 angulas) long, and measures 4 angulas (3 inches)
  in extent and is soft and white, and appears as if a folded cloth.
abhyasa: 'Sit quietly and bring gentle awareness to the base of the spine. Without forcing or visualizing,
  simply notice the quality of sensation or presence there—softness, stability, or emptiness. Rest attention
  there for a few breaths. This is not activation but familiarization: meeting the body as the text describes
  it, as a real location within your own form.'
