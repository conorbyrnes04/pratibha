  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Resting both the hands equally on the ground, he or she should raise himself or herself a
  little and strike his or her buttocks against the ground gently. The air, leaving both the passages
  (Ida and Pingala), starts into the middle one.
abhyasa: Sit comfortably with hands placed on the ground beside you. Without strain, gently lift your
  torso slightly and allow your weight to settle back down with a soft tap. Pause and notice any shift
  in your breath or inner sensation. Repeat 3–5 times, attending to the quality of gentleness rather than
  impact. This is observation only; do not attempt the full technique without qualified guidance.
