  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: In the practice of Kevala Pranayama when it can be performed successfully without Rechaka
  and Puraka, then it is called Kevala Kumbhaka.
abhyasa: 'Sit quietly today and observe one full breath cycle: notice the inhale, exhale, and the natural
  pause between them. Do not practice retention without guidance, but simply witness where your breath
  naturally pauses. Reflect on what ''independence'' from the breath''s rhythm might mean—a mind no longer
  driven by its pulse.'
