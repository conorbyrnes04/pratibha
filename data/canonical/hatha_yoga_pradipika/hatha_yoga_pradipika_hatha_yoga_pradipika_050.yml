  च तच् चेतसि ।

  वारं वारम् अपानम् ऊर्ध्वम् अनिलं प्रोत्सारयन् पूरितं न्यञ्चन् प्राणम् उपैति बोधम् अतुलं शक्ति-प्रभावान्
  नरः'
