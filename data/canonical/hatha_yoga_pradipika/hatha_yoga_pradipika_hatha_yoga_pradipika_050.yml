translation: Having kept both hands together in the lap, performing the Padmâsana firmly, keeping the
  chin fixed to the chest and contemplating on Him in the mind, by drawing the apâna-vâyu up (performing
  Mula Bandha) and pushing down the air after inhaling it, joining thus the prana and apâna in the navel,
  one gets the highest intelligence by awakening the sakti (kundalini) thus. (N.B.-- When Apâna Vâyu is
  drawn gently up and after filling the lungs with the air from outside, the prana is forced down by and
  by so as to join both of them in the navel, they both enter then the Kundalini and, reaching the Brahma
  randra (the great hole), they make the mind calm. Then the mind can contemplate on the nature of the
  atmana and can enjoy the highest bliss.)
abhyasa: 'Sit comfortably with spine upright. Without forcing breath or straining, notice the natural
  rhythm of your inhalation and exhalation for several minutes. Then, simply observe: where do you sense
  the breath entering your body, and where does it seem to settle? Bring gentle awareness to the center
  of your belly. This is a preparation for understanding the passage''s concern with breath meeting and
  centering, without attempting the advanced technique described.'
