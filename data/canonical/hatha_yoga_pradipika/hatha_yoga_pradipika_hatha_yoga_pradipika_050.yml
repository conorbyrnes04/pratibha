title: Having kept both hands together in the lap…
unit_type: verse
commentary: 'This passage describes a specific prāṇāyāma practice—the controlled meeting of apāna (downward-moving
  breath) and prāṇa (upward-moving breath) at the navel center—as a means to awaken kuṇḍalinī śakti and
  stabilize the mind toward self-knowledge. The text presents the practice as a ladder: precise bodily
  posture and breath control create the conditions for energetic awakening, which in turn quiets the mind
  and opens it to contemplation of ātman (the self). The emphasis is on *joining* opposing forces, suggesting
  that yoga''s power lies in integration rather than transcendence alone.



  Key Terms



  **apāna-vāyu** — The downward-moving vital force or breath, associated with elimination and grounding;
  in this practice, it is drawn upward to meet prāṇa.

  **prāṇa** — The upward-moving vital force or breath, associated with vitality and expansion; here, it
  is directed downward to meet apāna.

  **kuṇḍalinī śakti** — The dormant spiritual power or energy coiled at the base of the spine; awakening
  it is understood as central to higher states of consciousness and self-realization.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 10:** Both texts speak of balancing opposites—yin and yang, or apāna and prāṇa—as
  the path to harmony and wisdom. The Tao Te Ching asks, ''Can you remain unmoving till the mud settles?'';
  the Haṭha Yoga Pradīpikā describes breath-joining as a means to calm the mind. Divergence: The Tao Te
  Ching emphasizes *non-action* and natural settling; the Haṭha Yoga Pradīpikā prescribes *precise technique*
  and deliberate control to achieve that stillness.


  **Upaniṣads (e.g., Kaṭha Upaniṣad, on ātman):** Both texts present the realization of ātman (self) as
  the ultimate goal, and both suggest that ordinary consciousness must be stilled or transformed to perceive
  it. The Pradīpikā offers a practical method; the Upaniṣads offer philosophical inquiry. Divergence:
  The Upaniṣads emphasize direct inquiry and negation (''neti neti''); the Pradīpikā emphasizes embodied
  practice and energetic transformation as the gateway to that same realization.


  **Heraclitus, Fragment 51 (on harmony of opposites):** Heraclitus teaches that ''harmony is hidden,
  manifest in tension''—opposites in balance create coherence. The Pradīpikā''s joining of apāna and prāṇa
  reflects this principle: opposing forces unified generate higher intelligence. Divergence: Heraclitus
  speaks of universal cosmic principle; the Pradīpikā grounds the principle in the individual body and
  breath, making it a personal, reproducible practice rather than a philosophical observation.'
