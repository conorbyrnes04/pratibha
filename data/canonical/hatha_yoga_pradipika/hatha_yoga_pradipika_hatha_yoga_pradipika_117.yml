title: Taking any comfortable posture and performing the âsana
unit_type: verse
commentary: 'This opening instruction grounds yoga practice in the body''s immediate capacity: finding
  comfort, then using breath as the primary tool of attention and energy. The specificity of the right
  nostril signals that haṭha yoga is not merely stretching or philosophy, but a precise somatic discipline
  where breath pathways and their effects are mapped and intentional. By beginning with what is accessible—a
  comfortable seat and the breath already present—the text invites the practitioner into a gradual, embodied
  inquiry rather than demanding extraordinary attainment.



  Key Terms



  **āsana** — A steady, comfortable posture; the physical foundation from which breath and energy work
  arise.

  **prāṇa** — The vital life-force or breath-energy that animates the body and is cultivated through yogic
  practice.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra 2.46: ''sthira sukham āsanam'' (the posture should be steady and comfortable):**
  Both texts insist that yoga begins with ease and stability, not strain. Comfort is not a luxury but
  a prerequisite for deeper work. Divergence: The Pradīpikā moves immediately into breath technique, while
  Patañjali emphasizes the mental quality (steadiness) that the posture cultivates.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of
  their knowledge is unfathomable.'':** Both traditions value gradual, attentive unfolding rather than
  force; both begin with the ordinary (breath, water) as gateway to the subtle. Divergence: The Pradīpikā
  is prescriptive and technical (right nostril, specific technique), while the Tao Te Ching points toward
  non-action and the unmeasurable.'
