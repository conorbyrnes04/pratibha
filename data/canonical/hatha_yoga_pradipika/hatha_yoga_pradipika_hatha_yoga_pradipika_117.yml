translation: Taking any comfortable posture and performing the âsana, the Yogi or Yogini should draw in
  air slowly, through the right nostril.
abhyasa: Today, sit comfortably for five minutes. Close your left nostril gently with your finger, and
  simply observe the quality of your breath entering through the right nostril—its temperature, texture,
  pace. Do not force or manipulate; notice only. This simple observation begins the yogic attention without
  requiring advanced technique.
