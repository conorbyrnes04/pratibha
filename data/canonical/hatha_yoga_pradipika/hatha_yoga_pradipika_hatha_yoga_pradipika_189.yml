title: Some are of opinion that the closing of throat is…
unit_type: verse
commentary: 'This verse addresses a technical disagreement among practitioners about how to execute a
  bandha (energetic lock or seal) during prāṇāyāma. Rather than settling the dispute authoritatively,
  Svātmārāma acknowledges that different schools hold different views—some consider throat closure essential,
  others find that tongue placement alone suffices. The passage reveals that even in a foundational manual,
  haṭha yoga permits interpretive flexibility within the bounds of recognized technique, suggesting that
  the *effect* (sealing the breath and energy) matters more than rigid uniformity of method.



  Key Terms



  **bandha** — A lock or seal; a muscular and energetic contraction used in prāṇāyāma and āsana to direct
  and contain the flow of breath and vital force (prāṇa).

  **prāṇāyāma** — Regulation and extension of breath; a foundational practice in haṭha yoga for refining
  the vital life force.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra 2.46 (sthira sukham āsanam):** Both texts prioritize the *quality of effect*
  (steadiness and ease, or effective sealing) over a single prescribed form, allowing adaptation within
  principle. Divergence: The Sūtra speaks broadly of āsana; this passage is narrowly technical, debating
  a specific anatomical detail within one practice.


  **Taoist internal alchemy texts (e.g., *Secret of the Golden Flower*):** Both traditions use precise
  tongue and throat placements to direct subtle energy; both acknowledge multiple valid lineages and methods.
  Divergence: The Haṭha Yoga Pradīpikā frames variation as legitimate disagreement among schools; Taoist
  texts often present methods as sequential stages rather than alternatives.'
