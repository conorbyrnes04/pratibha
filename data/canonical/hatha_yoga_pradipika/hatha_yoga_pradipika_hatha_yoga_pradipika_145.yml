translation: He or she is regarded adorable by the Yoginis and becomes the destroyer of the cycle of creation.
  He or she is not afflicted with hunger, thirst, sleep or lassitude.
abhyasa: 'Today, during or after a simple breathing practice, notice one moment when a bodily sensation
  (hunger, restlessness, heaviness) arises and passes without demanding your full attention. Observe how
  awareness itself remains untouched by the sensation''s coming and going. This small noticing is an entry
  into the passage''s vision: that the body''s cycles need not bind the witness.'
