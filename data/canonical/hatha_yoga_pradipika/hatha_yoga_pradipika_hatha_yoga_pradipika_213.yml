commentary: 'This passage elevates the yogin and yoginī as beings of extraordinary spiritual merit whose
  very presence sanctifies their lineage, country, and all who encounter them. The opening statement on
  diet (cow flesh and ''immortal liquor'') appears to signal renunciation of conventional social markers;
  the lengthy note reframes the passage''s true concern: that one who realizes the discrimination between
  Puruṣa (pure consciousness) and Prakṛti (nature/matter)—the classical Sāṃkhya insight central to yoga—becomes
  a living gateway to liberation for others. The text suggests that yoga is not a personal achievement
  alone, but a state of being that radiates grace across generations.



  Key Terms



  **Puruṣa** — Pure consciousness or witness; in Sāṃkhya philosophy, the eternal, unchanging subject distinct
  from all material manifestation.

  **Prakṛti** — Nature or matter; the dynamic, ever-changing field of manifestation, distinct from Puruṣa.

  **mokṣa** — Liberation; release from the cycle of birth and death, understood here as accessible through
  contact with one established in yoga.



  Cross-Tradition Resonances



  **Bhagavad Gītā 5.24–25 (on the yogin''s inner peace and radiance):** Both texts present the accomplished
  yogin as inwardly unified and a source of blessing to the world; the Gītā emphasizes the yogin''s own
  peace, while the Pradīpikā emphasizes the liberating effect on others. Divergence: The Gītā frames yoga
  as compatible with dharmic duty and social role; the Pradīpikā''s opening suggests a radical break from
  conventional family markers.


  **Patañjali''s Yoga Sūtra 1.14 (on steady, devoted practice over a long time):** Both texts honor the
  yogin as one who has cultivated sustained commitment; the Pradīpikā extends this to suggest the yogin
  becomes a transmitter of grace. Divergence: The Sūtra focuses on the individual''s own attainment; the
  Pradīpikā emphasizes the yogin''s role as a liberating presence for others.


  **Upaniṣadic teaching on the sage as a bridge between worlds (e.g., Kaṭha Upaniṣad):** Both traditions
  recognize the enlightened person as a living connection between transcendent and manifest reality, worthy
  of reverence. Divergence: The Pradīpikā ties this specifically to the haṭha yoga path and its systematic
  practices, whereas the Upaniṣads approach realization through knowledge and meditation alone.'
