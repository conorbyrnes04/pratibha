  label: Translation
  body: 'Those who eat the flesh of the cow and drink the immortal liquor daily, are regarded by me men
    of noble family. Others are but a disgrace to their families. (Note: Fortunate are the parents and
    blessed is the country and the family where a Yogi or Yogini is born. Anything given to such a Yogi
    or Yogini, becomes immortal. One, who discriminates between Purusa and Prakriti, purges the sins of
    a million incarnations, by seeing, speaking, and touching such men (i.e. Yogi or Yogini). A Yogi or
    Yogini far exceeds a thousand householders, a hundred vanapraasthas, and a thousand Brahmacharis.
    Who can know the reality of the Raja Yoga? That country is very sacred where resides a man or woman
    who knows it. By seeing and honoring him or her, generations of ignorant men get moksa, what to speak
    of those who are actually engaged in it. He or she knows internal and external yoga, deserves adoration
    from you and me, what if he or she is adored by the rest of mankind! Those who engage in the great
    yoga, once or thrice daily, are to be known as masters of great wealth (mabeshwaras) or Lords.)'
