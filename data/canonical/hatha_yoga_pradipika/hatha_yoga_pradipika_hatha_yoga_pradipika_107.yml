  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By carrying the Apana Vayu up to the throat, the food, etc., in the stomach are vomited, By degrees, the system
  of Nadis (Sankhini) becomes known. This is called in Hatha as Gaja Karani.
abhyasa: 'Sit quietly and observe the natural downward flow of your breath and energy through your body. Without forcing or
  attempting the technique itself, simply contemplate: where do you sense heaviness, blockage, or downward pull in your torso?
  What would it mean to gently reverse or redirect that flow? This contemplation prepares the ground for understanding why
  such practices are traditionally taught only in person.'
