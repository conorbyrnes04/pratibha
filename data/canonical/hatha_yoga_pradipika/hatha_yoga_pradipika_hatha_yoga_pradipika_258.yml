translation: Being free from the exercise of Vajroli, man and woman should both rub it on their bodies.
abhyasa: Reflect on a yoga practice or teaching you have encountered that seemed inaccessible to you.
  Consider whether there is a simpler, preparatory, or modified form of that practice available to you
  now—not as a permanent substitute, but as a genuine entry point. Notice how the tradition meets you
  at your current capacity.
