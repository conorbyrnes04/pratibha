unit_label: On Prāṇāyāma — 2.6
title: Therefore, Pranayama should be performed daily with…
unit_type: verse
commentary: 'This verse establishes prāṇāyāma not as a casual practice but as a disciplined daily undertaking, grounded in
  a particular quality of mind. The insistence on *sāttvika buddhi*—an intellect free from restlessness and dullness—suggests
  that breath work is as much a matter of inner clarity as of technique. The specific aim, purifying the suṣumnā (the central
  energy channel), locates prāṇāyāma within a larger cosmology of subtle anatomy, where obstruction blocks the path to higher
  states.



  Key Terms



  **prāṇāyāma** — Regulation and extension of breath; foundational practice in haṭha yoga for directing vital energy (prāṇa)
  and preparing the mind for meditation.

  **sāttvika buddhi** — Intellect or discernment characterized by clarity, harmony, and balance; free from rajas (restlessness,
  passion) and tamas (inertia, delusion).

  **suṣumnā** — The central subtle energy channel running through the spine; in haṭha yoga cosmology, the primary pathway
  for kundalinī and higher consciousness.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.14 (Patañjali):** Both texts emphasize that yoga practice requires consistent, devoted effort over time (*sa
  tu dīrgha-kāla*—''over a long time''). The Pradīpikā''s ''daily'' mirrors this commitment to regularity. Divergence: The
  Yoga Sūtra frames practice in terms of renunciation and detachment; the Pradīpikā is more explicitly somatic and energetic,
  concerned with purifying channels rather than transcending attachment.


  **Bhagavad Gītā 2.45 (sāttvika guṇa):** Both texts invoke *sattva* as the quality of mind necessary for spiritual progress—clarity,
  harmony, and discrimination. The Gītā teaches that sāttvika action leads upward; the Pradīpikā applies this to breath practice
  specifically. Divergence: The Gītā addresses sattva in the context of action and duty within the world; the Pradīpikā locates
  it within an internal, physiological discipline aimed at transcendence.


  **Heraclitus, Fragment 45 (''You cannot step twice into the same river''):** Both suggest that constancy and attention to
  process matter more than static knowledge. Daily prāṇāyāma, like the river, is never identical; each practice requires fresh
  presence. Divergence: Heraclitus speaks of universal flux and contradiction; the Pradīpikā assumes a stable subtle anatomy
  that can be purified through disciplined practice, a more optimistic metaphysics of transformation.'
