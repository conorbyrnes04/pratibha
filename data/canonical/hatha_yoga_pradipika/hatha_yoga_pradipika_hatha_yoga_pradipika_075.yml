  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Therefore, Pranayama should be performed daily with satwika buddhi (intellect free from raja and tama or activity
  and sloth), in order to drive out the impurities of the susumna.
abhyasa: 'Before your next breath practice, pause and notice the quality of your mind: Are you agitated, dull, or relatively
  clear? Rather than forcing practice, spend a few moments settling—perhaps through a few conscious breaths or a brief pause—until
  you feel a steadier, more lucid presence. Then begin, holding that intention of clarity throughout.'
