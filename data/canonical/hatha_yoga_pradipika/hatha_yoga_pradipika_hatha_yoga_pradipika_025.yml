title: Taking the posture of Padmâ-âsana and carrying the hands
unit_type: verse
commentary: 'This passage describes a specific transformation of the body in space: the lotus posture
  (Padmāsana) becomes the rooster pose (Kukkuṭāsana) through a precise shift of weight and hand placement.
  The instruction assumes mastery of the foundational lotus and teaches how one stable form can become
  another through intentional adjustment—a microcosm of the haṭha yoga method itself, where the body is
  refined and redirected toward subtler states. The passage is plain and technical, offering no mystical
  claim, only the geometry of practice.



  Key Terms



  **Padmāsana** — The lotus posture, a foundational seated position in haṭha yoga in which the feet are
  folded onto the thighs.

  **Kukkuṭāsana** — The rooster pose, a more advanced variation in which the body is lifted above the
  ground using the hands and arms while maintaining the lotus configuration of the legs.

  **Āsana** — A physical posture or pose in yoga practice, traditionally understood as a stable and comfortable
  seat for meditation and prāṇāyāma.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, II.46: ''sthira sukham āsanam'' (the posture should be steady and comfortable):**
  Both texts emphasize āsana as a foundation requiring both stability and ease; the Pradīpikā passage
  shows how one stable form transitions to another while maintaining that dual quality. Divergence: Patañjali''s
  sūtra is aphoristic and philosophical, while the Pradīpikā passage is concrete and anatomical, describing
  the *how* rather than the principle.


  **Daodejing, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth
  of their knowledge is unfathomable.'':** Both traditions value precision in small, incremental shifts—the
  Daoist sage moves through the world with minimal force, as the yogi moves through postures with exact
  hand and weight placement. Divergence: The Daodejing speaks of non-action and spontaneity, while the
  Pradīpikā passage describes deliberate, technical instruction requiring a teacher''s guidance.'
