  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: When the Rudra granthi is pierced, and the air enters the seat of the Lord (the space between
  the eyebrows), then the perfect sound like that of a flute is produced.
abhyasa: In your next seated meditation, after a few minutes of settling, gently direct awareness to the
  space between your eyebrows (ājñā). Without straining, listen inwardly for any subtle sounds—humming,
  whistling, or bell-like tones—that may arise. Do not chase them; simply notice if they appear, and return
  to natural breath awareness. This cultivates sensitivity to the subtle body's own signals.
