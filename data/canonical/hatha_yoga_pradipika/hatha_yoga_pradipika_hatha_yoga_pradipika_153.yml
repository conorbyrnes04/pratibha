  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: In the same way, the air of the body should be moved intelligently, filling it through Suyra
  when fatigue is experienced.
abhyasa: When you notice fatigue today—mental fog, physical heaviness, or low energy—pause and take five
  slow, deliberate breaths through your right nostril only (left nostril gently closed), observing whether
  your energy or clarity shifts. Notice without judgment what 'intelligent' breathing feels like in your
  own body.
