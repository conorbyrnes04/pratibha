title: In the same way, the air of the body should be…
unit_type: verse
commentary: 'This verse teaches that breath (prāṇa, ''air'') is not merely mechanical but requires intelligent,
  purposeful direction—a foundational principle of haṭha yoga practice. The instruction to draw breath
  through Surya (the right nostril, associated with solar energy and activation) when fatigue arises suggests
  that prāṇāyāma is a practical tool for regulating the body''s vital force and restoring capacity. The
  phrase ''in the same way'' implies this follows an earlier principle, anchoring breath-work within a
  larger system of bodily cultivation.



  Key Terms



  **prāṇa (air/vital force)** — The life-force or breath-energy that animates the body; in haṭha yoga,
  it is cultivated and directed through conscious breathing and physical practice.

  **Surya (Sun)** — The right nostril, associated with solar, heating, and activating energy; contrasted
  with Chandra (moon/left nostril), which is cooling and calming.



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both texts
  prize subtle, intelligent action over force—the Tao Te Ching in governance and nature, the Haṭha Yoga
  Pradīpikā in breath and body. Divergence: The Tao Te Ching emphasizes non-action (wu wei) and yielding;
  haṭha yoga explicitly cultivates deliberate, skillful intervention in the body''s processes.


  **Patañjali''s Yoga Sutras 1.14: ''Practice becomes firmly grounded when attended to for a long time,
  without interruption, and with sincere devotion.'':** Both texts ground yoga in sustained, conscious
  practice rather than passive belief; both see technique as a path to mastery. Divergence: Patañjali
  emphasizes mental steadiness and devotion; the Haṭha Yoga Pradīpikā foregrounds the body and breath
  as primary instruments.'
