title: Place the feet on the thighs, with the soles…
unit_type: verse
commentary: 'This verse describes Padmasana (lotus pose), a foundational seated posture in haṭha yoga.
  The precise symmetry—feet on thighs, palms upward—establishes both physical stability and an openness
  of the body that the tradition associates with receptivity to prāṇa (vital breath) and inward attention.
  The upward orientation of palms and soles suggests not mere comfort, but a deliberate alignment of the
  body''s surfaces toward subtle energetic work.



  Key Terms



  **Padmasana** — Lotus pose; a seated posture with feet placed on the thighs, traditionally used for
  meditation and prāṇāyāma practice

  **Prāṇa** — Vital life-force or breath-energy that flows through the body; central to haṭha yoga practice



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, II.46: ''sthira sukham āsanam'' (posture should be steady and comfortable):**
  Both texts emphasize that āsana is not mere physical positioning but a balanced state supporting deeper
  practice. Divergence: The Yoga Sutras remain abstract about which posture; the Haṭha Yoga Pradīpikā
  is concrete and prescriptive.


  **Upaniṣads (e.g., Śvetāśvatara Upaniṣad VI.13): emphasis on seated stillness as gateway to brahman-realization:**
  Both traditions use stable posture as a threshold to transcendent awareness. Divergence: The Upaniṣads
  focus on knowledge (jñāna); the Pradīpikā emphasizes prāṇic and somatic preparation.'
