  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Place the feet on the thighs, with the soles upward, and place the hands on the thighs, with
  the palms upwards.
abhyasa: Sit in a comfortable cross-legged position. Without forcing, notice the quality of your spine
  when your hands rest palms-up on your thighs versus palms-down. Observe whether the upward-facing palms
  naturally open your chest and shoulders. Spend 2–3 minutes simply noticing how posture shapes your breath
  and awareness.
