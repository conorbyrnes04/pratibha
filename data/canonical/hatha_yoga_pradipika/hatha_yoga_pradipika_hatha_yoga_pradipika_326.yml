  label: Translation
  body: When the Yogi or Yogini remains inwardly attentive to the Brahman, keeping the mind and the Prana
    absorbed, and the sight steady, as if seeing everything while in reality seeing nothing outside, below,
    or above, verily then it is called the Sambhavi Mudra, which is learnt by the favor of a guru. Whatever,
    wonderful, Sunya or Asunya is perceived, is to be regarded as the manifestation of that great Sambhu
    (Siva).
