  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: When the Yogi or Yogini remains inwardly attentive to the Brahman, keeping the mind and the
  Prana absorbed, and the sight steady, as if seeing everything while in reality seeing nothing outside,
  below, or above, verily then it is called the Sambhavi Mudra, which is learnt by the favor of a guru.
  Whatever, wonderful, Sunya or Asunya is perceived, is to be regarded as the manifestation of that great
  Sambhu (Siva).
abhyasa: Sit quietly today with eyes open and gaze softly at a neutral point (wall, horizon). Without
  straining, practice withdrawing your attention inward while keeping the eyes relaxed and steady. Notice
  the quality of 'seeing without grasping'—where the eyes function but the mind rests in stillness. This
  is a preliminary taste of the inward-outward balance the passage describes.
