unit_label: On Samādhi — 4.36
title: When the Yogi or Yogini remains inwardly attentive…
unit_type: verse
commentary: 'This passage describes Sambhavi Mudra as a state of paradoxical perception: the practitioner
  remains inwardly absorbed in Brahman (ultimate reality) while the eyes remain open and steady, yet perceive
  nothing external. The teaching emphasizes that all phenomena—whether experienced as void (Śūnya) or
  form (Asūnya)—are manifestations of Śiva, the ultimate principle. The mudra is not a technique alone
  but a fruit of grace (guru''s favor) and inner reorientation, where the distinction between seer and
  seen dissolves.



  Key Terms



  **Sambhavi Mudra** — A gesture or seal of perception in which the yogi''s gaze is steady and open, yet
  consciousness is absorbed inwardly in Brahman; a state where external seeing and internal realization
  coincide.

  **Brahman** — In Vedantic philosophy, the ultimate, non-dual reality or consciousness underlying all
  existence.

  **Śūnya / Asūnya** — Void and non-void; emptiness and form—complementary aspects of manifestation, both
  recognized as expressions of Śiva.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts describe a state of profound perception where the sage ''sees''
  by not-seeing, remaining empty and receptive while the world moves through them. Divergence: The Haṭha
  Yoga Pradīpikā anchors this state in a theistic vision (Śiva as ultimate), while the Tao Te Ching remains
  non-theistic and emphasizes wu-wei (non-action).


  **Meister Eckhart, ''Detachment'' sermons:** Both describe a paradoxical inward-outward awareness where
  the practitioner is fully present yet ''empty'' of self-will, perceiving all things as divine manifestation.
  Divergence: Eckhart emphasizes detachment from creatures and union with God through negation; the passage
  here celebrates all manifestation (Śūnya and Asūnya alike) as Śiva''s play.


  **Bhagavad Gītā, ch. 5.8–9:** Both teach that the yogi acts and perceives in the world while remaining
  inwardly unattached and absorbed in the eternal, transcending the illusion of doership. Divergence:
  The Gītā emphasizes ethical action (karma yoga) as the path; Sambhavi Mudra is a direct perceptual state
  requiring guru initiation and prāṇāyāma discipline.'
