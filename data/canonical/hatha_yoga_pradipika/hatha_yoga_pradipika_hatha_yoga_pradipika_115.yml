unit_label: On Prāṇāyāma — 2.46
title: Kumbhaka is the keeping the air confined inside
unit_type: verse
commentary: 'This passage teaches the mechanics of breath retention (kumbhaka) and expulsion (rechaka)
  as tools for directing vital energy (prāṇa) into the central channel (Suṣumnā Nādī). The three bandhas—locks
  of the body—work together to seal and redirect prāṇa upward through the spine rather than dispersing
  it outward. The text presents prāṇāyāma not as mere breathing exercise but as a precise technology for
  awakening and stabilizing the subtle energy body, foundational to the yogic path.



  Key Terms



  **Kumbhaka** — Retention of breath; the holding of prāṇa within the body after inhalation.

  **Suṣumnā Nādī** — The central energy channel running through the vertebral column; the primary pathway
  through which prāṇa ascends toward higher states of consciousness.

  **Bandha** — An energetic lock or contraction of specific body regions (throat, pelvic floor, abdomen)
  used to seal and redirect prāṇa.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali): ''Tasmin sati śvāsa-praśvāsayorgati-vicchedaḥ prāṇāyāmaḥ'' (When āsana
  is perfected, prāṇāyāma—the regulation of breath—follows):** Both texts treat breath control as a systematic
  technology for refining and directing subtle energy toward liberation. Divergence: The Yoga Sūtra situates
  prāṇāyāma within a broader eight-limbed path; the Haṭha Pradīpikā emphasizes the anatomical and energetic
  specificity of bandhas and nādīs.


  **Upaniṣads (e.g., Kaṭha Upaniṣad 2.3.13): ''When the five senses are stilled, along with the mind,
  and the intellect does not waver, that is called the highest state'':** Both traditions recognize that
  controlling the breath and vital forces leads to mental stillness and higher awareness. Divergence:
  The Upaniṣads emphasize the transcendence of sense and mind; the Haṭha Pradīpikā provides concrete somatic
  techniques to achieve this state.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  can only be described with difficulty'':** Both texts acknowledge that the deepest work involves subtle,
  invisible currents (prāṇa / Tao) that require precise practice to perceive and direct. Divergence: The
  Haṭha Pradīpikā offers explicit anatomical and technical instruction; the Tao Te Ching points toward
  the ineffable through paradox and non-action.'
