  label: Translation
  body: Kumbhaka is the keeping the air confined inside. Rechaka is expelling the confined air. The instructions
    for Puraka, Kumbhaka and Rechaka will be found at the proper place and it should be carefully followed.
    By drawing up from below (Mula Bandha) and contracting the throat (Jalanddhara Bandha) and by pulling
    back the middle of the front portion of the body (i.e., belly), the Prana goes to the Brahma Nadi(Susumna)
    (N.B.-- The middle hole, through the vertebral column, through which the spinal cord passes, is called
    the Susumna Nadi of the Yogis and Yoginis. The two other sympathetic cords, one on each side of the
    spinal cord, are called the Ida and the Pingala Nadis. These will be described later on.)
