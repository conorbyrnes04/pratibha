abhyasa: 'Today, sit quietly and observe one complete breath cycle: notice the natural pause after inhale
  (kumbhaka) and after exhale (rechaka). Without forcing, simply witness these moments of stillness. This
  attentiveness to the breath''s natural rhythm prepares awareness for formal practice under qualified
  guidance.'
