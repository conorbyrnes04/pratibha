translation: Some are devoted to the Vedas, some to Nigama, while others are enwrapt in Logic, but none
  knows the value of this mudra, which enables one to cross the ocean of existence.
abhyasa: 'Sit quietly and notice your breath and body as they are now, without judgment or correction.
  Reflect: what do I know through direct sensation that no book has taught me? Hold that awareness for
  a few minutes. This simple noticing begins to honor the teaching that embodied knowledge has its own
  integrity.'
