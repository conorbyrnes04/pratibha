translation: Uddiyana is always very easy, when learnt from a guru. The practiser of this, if old, becomes
  young again.
abhyasa: 'Sit quietly today and observe the natural movement of your abdomen with each breath—expansion
  and contraction. Do not attempt the lock itself without guidance. Simply notice: where does the breath
  seem to originate? What happens when you bring gentle awareness there? This prepares the ground for
  later study with a teacher.'
