  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Pressing the heel well against the anus, draw up the air by force, again and again till it
  (air) goes up.
abhyasa: Sit comfortably upright. Without forcing, notice where your breath naturally travels in your
  body—chest, belly, nostrils. Then, for one conscious breath cycle, gently press your lower abdomen and
  pelvic floor as you inhale slowly through the nose, imagining the breath rising upward. Do not strain.
  Repeat 2–3 times, then rest and observe any subtle shift in sensation or awareness.
