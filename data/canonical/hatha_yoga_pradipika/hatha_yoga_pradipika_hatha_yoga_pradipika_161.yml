  body: Considering Puraka (Filling), Rechaka (expelling) and Kumhaka (confining), Pranayama is of three
    kinds, but considering it accompanied by Puraka and Rechaka, and without these, it is of two kinds
    only, i.e., Sabita (with) and Kevala (alone).
