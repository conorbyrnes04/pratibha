translation: Considering Puraka (Filling), Rechaka (expelling) and Kumhaka (confining), Pranayama is of
  three kinds, but considering it accompanied by Puraka and Rechaka, and without these, it is of two kinds
  only, i.e., Sabita (with) and Kevala (alone).
abhyasa: 'Today, sit quietly and observe your breath for three minutes without changing it. Notice: the
  inhalation (puraka), the exhalation (rechaka), and any natural pause (kumbhaka) between them. Simply
  witnessing these three phases as they arise is itself a form of prāṇāyāma awareness—the beginning of
  *sabīta* (conscious) practice.'
practice: 'Today, sit quietly and observe your breath for three minutes without changing it. Notice: the
