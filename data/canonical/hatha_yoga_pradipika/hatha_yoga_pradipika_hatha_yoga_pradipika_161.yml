unit_label: On Prāṇāyāma — 2.92
title: Considering Puraka (Filling)
unit_type: verse
commentary: 'This passage establishes the foundational taxonomy of prāṇāyāma—the regulation of breath-energy
  that forms the bridge between body and mind in haṭha yoga practice. By naming the three phases (inhalation,
  exhalation, retention) and then regrouping them into two modes (with or without the breath movements),
  Svātmārāma shows that prāṇāyāma can be approached either as a structured, conscious technique or as
  a spontaneous, internalized state. The distinction between *sabīta* and *kevala* hints at a progression:
  the deliberate practice eventually yields to a condition where the breath regulates itself, pointing
  toward the subtler dimensions of yoga.



  Key Terms



  **Prāṇāyāma** — Regulation and extension of the breath-energy (prāṇa); one of the eight limbs of yoga,
  here presented as a systematic practice with distinct phases.

  **Kumbhaka** — The retention or holding of the breath; the pause or containment phase within the breath
  cycle.

  **Kevala** — Alone, isolated, or independent; here referring to prāṇāyāma practiced without deliberate
  inhalation and exhalation—a spontaneous or internalized state.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali): ''Tasmin sati śvāsa-praśvāsayoḥ gati-vicchedaḥ prāṇāyāmaḥ'' (When āsana
  is mastered, prāṇāyāma is the interruption of the flow of inhalation and exhalation).:** Both texts
  treat prāṇāyāma as a deliberate intervention in the breath cycle—a conscious pause or regulation that
  marks the transition from body-centered to subtle practice. Divergence: Patañjali emphasizes prāṇāyāma
  as a *consequence* of stable posture, whereas Svātmārāma presents it as a systematic discipline with
  its own internal structure and progression.


  **Taoist internal alchemy (Neidan): the circulation of breath-energy through microcosmic and macrocosmic
  channels, with emphasis on retention and refinement.:** Both traditions recognize that breath-work involves
  phases of intake, release, and holding, and that mastery involves moving from conscious technique toward
  spontaneous flow. Divergence: The Haṭha Yoga Pradīpikā frames prāṇāyāma as a rung on the ladder to *samādhi*
  (absorption), while Taoist practice often emphasizes the circulation and storage of vital essence (*jīng*,
  *qì*) within the body''s energy channels.'
