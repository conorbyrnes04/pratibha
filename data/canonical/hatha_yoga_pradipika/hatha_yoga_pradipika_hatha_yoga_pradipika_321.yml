translation: By the suspension of respiration and the annihilation of the enjoyments of the senses, when
  the mind becomes devoid of all the activities and remains changeless, then the Yogi or Yogini attains
  to the Laya Stage.
abhyasa: 'Today, sit quietly for five minutes. Notice one moment when your breath naturally steadies and
  your attention turns inward, away from external sensations. Rather than forcing anything, simply observe:
  what happens to the quality of your thinking when both breath and senses soften together? Sit with that
  observation without judgment.'
