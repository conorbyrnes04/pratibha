title: By the suspension of respiration and the annihilation
unit_type: verse
commentary: 'This verse describes a threshold state—*laya* (dissolution or absorption)—where the ordinary
  mind ceases its restless activity through two coordinated movements: the stilling of breath and the
  withdrawal of sensory engagement. The passage suggests that when both body (via breath control) and
  senses fall quiet, the mind itself becomes ''changeless''—not blank, but freed from the constant churn
  of mental modification. This is presented as a real attainment available to sincere practitioners, not
  mere theory.



  Key Terms



  **Laya** — Dissolution or absorption; a meditative state in which the individual mind merges into or
  rests within a unified field, beyond ordinary mental activity.

  **Yogi / Yogini** — A male or female practitioner of yoga; one who pursues union or integration through
  disciplined practice.



  Cross-Tradition Resonances



  **Patañjali, Yoga Sūtra 1.2 (''yogaś chitta-vṛtti-nirodhah''):** Both texts define yoga as the stilling
  of mental fluctuations; the Pradīpikā verse shows this stilling as a lived, embodied process via breath
  and sense withdrawal. Divergence: Patañjali emphasizes the cessation of *vṛtti* (modifications) as the
  core definition; the Pradīpikā treats breath suspension and sensory withdrawal as the *means* to that
  end.


  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.3.10-11): the senses turned inward, the mind stilled:** Both traditions
  teach that withdrawal of the senses and quieting of mind are pathways to deeper knowledge or unity.
  Divergence: The Upaniṣads emphasize knowledge (*jñāna*) as the fruit; the Pradīpikā emphasizes *laya*—a
  state of absorption—as the gateway to *rāja yoga*.


  **Meister Eckhart: ''The more we empty ourselves, the more God fills us'':** Both suggest that cessation
  of ordinary mental activity and sensory engagement opens a space for something transcendent to be known.
  Divergence: Eckhart frames this as union with God through negation; the Pradīpikā frames it as a yogic
  state (*laya*) within a systematic path of practice.'
