  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Keeping the feet in Vajra-âsana (Padma-âsana), hold them firmly with the hands. The position
  of the bulb then will be near the ankle joint, where it should be pressed.
abhyasa: Sit in a comfortable cross-legged position (Padmāsana or Vajrāsana). Clasp your hands around
  your shins or ankles. Without strain, notice the contact between your hands and legs, and bring gentle
  awareness to the area between your ankle and the base of your spine. Breathe slowly and observe any
  subtle sensations or shifts in your sense of grounding. Do this for 2–3 minutes as a preliminary to
  deeper practice.
