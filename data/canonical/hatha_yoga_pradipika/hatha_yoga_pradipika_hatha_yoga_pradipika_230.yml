translation: Prana, Apana, Nada and Bindu uniting into one in this way, give success in Yoga, undoubtedly.
abhyasa: Sit quietly and notice your natural breath. Without forcing, sense the upward quality of the
  inhale and the downward quality of the exhale. Rather than controlling them, imagine them meeting at
  a single point in the center of your chest—a place of stillness between the two movements. Rest there
  for a few breaths. This is a contemplative entry into the principle the verse names.
