unit_label: On Prāṇāyāma — 2.43
title: To accomplish it, various Kumbhakas are performed…
unit_type: verse
commentary: 'This verse affirms that mastery of breath retention (kumbhaka) is central to haṭha yoga''s
  transformative power. The text suggests that expertise lies not in a single technique but in the skilled
  variation of practices—different kumbhakas suited to different conditions and stages. The promise of
  ''wonderful success'' points to tangible, experiential results that arise from disciplined, differentiated
  practice rather than mechanical repetition.



  Key Terms



  **kumbhaka** — Retention or suspension of breath; a foundational prāṇāyāma technique in which the breath
  is held after inhalation or exhalation to direct and stabilize vital energy (prāṇa).

  **haṭha yoga** — The yoga of force or effort; a systematic path using āsana (postures), prāṇāyāma (breath
  control), and other techniques to prepare the body-mind for meditation and liberation.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.14 (Patañjali): ''Practice becomes firmly grounded when attended to for a long time,
  without interruption, and with sincere devotion.'':** Both texts emphasize that mastery emerges through
  sustained, devoted practice rather than sporadic effort; skill is built through consistency. Divergence:
  Patañjali stresses the inner attitude (devotion, continuity) as the ground of practice, while the Pradīpikā
  emphasizes the *variation* of techniques as the path to success—suggesting that flexibility and differentiation
  are equally vital.


  **Tao Te Ching 48 (Laozi): ''In pursuit of learning, every day something is acquired. In pursuit of
  Tao, every day something is dropped.'':** Both traditions recognize that transformation requires a shift
  in approach—not accumulation of knowledge alone, but refinement and release through disciplined practice.
  Divergence: The Pradīpikā locates success in the *mastery of varied techniques*, whereas Laozi points
  toward simplification and non-action; haṭha yoga embraces deliberate effort where Taoism counsels wu-wei
  (non-forcing).


  **Heraclitus, Fragment 45: ''The path up and down are one and the same.'':** Both suggest that apparent
  opposites—different kumbhakas, or ascent and descent—are unified in a single transformative process.
  Divergence: Heraclitus speaks of paradox and flux as fundamental to reality itself, while the Pradīpikā
  treats varied kumbhakas as practical tools leading toward a stable, liberated state.'
