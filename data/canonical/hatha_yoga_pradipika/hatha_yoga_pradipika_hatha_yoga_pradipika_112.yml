  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: To accomplish it, various Kumbhakas are performed by those who are expert in the methods;
  for, by the practice of different Kumbhakas, wonderful success is attained.
abhyasa: Today, observe one complete breath cycle without forcing retention. Notice the natural pause
  that occurs after inhalation and exhalation. Rather than attempting kumbhaka, simply witness where breath
  naturally holds, and reflect on how attention itself changes the breath's rhythm.
practice: Today, observe one complete breath cycle without forcing retention. Notice the natural pause
