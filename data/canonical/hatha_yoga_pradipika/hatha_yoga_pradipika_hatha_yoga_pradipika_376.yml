translation: Though hearing loud sounds like those of thunder, kettle drums, &c., one should practice
  with the subtle sounds also.
abhyasa: 'During a few minutes of slow, steady breathing today, notice any sounds that arise—both external
  noise and the subtle inner hum or whistle of the breath itself. Rather than dismissing the obvious sounds,
  use them as a threshold: let them remind you to listen deeper, into the quieter frequencies beneath
  them. This trains the ear of attention.'
