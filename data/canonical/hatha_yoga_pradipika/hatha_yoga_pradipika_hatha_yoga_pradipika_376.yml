title: Though hearing loud sounds like those of thunder…
unit_type: verse
commentary: 'This verse teaches progressive refinement of attention during prāṇāyāma practice. The practitioner
  begins by noticing gross, obvious sounds (thunder, drums) that arise naturally during breath work, then
  trains awareness to detect increasingly subtle inner sounds (nāda). The instruction honors both registers
  of experience—the loud and the delicate—as valid stages on a single path, suggesting that mastery lies
  not in rejecting the obvious but in learning to perceive what lies beneath it.



  Key Terms



  **nāda** — The subtle inner sound or vibration perceived during prāṇāyāma and meditation; distinguished
  here from gross external sounds.

  **prāṇāyāma** — Breath regulation and energy control; a foundational practice in haṭha yoga that prepares
  the mind for meditation and samādhi.



  Cross-Tradition Resonances



  **Tao Te Ching 15:** Both texts value the subtle over the obvious: ''The ancient masters were profound
  and subtle'' — refinement of perception is the mark of mastery. Divergence: The Tao Te Ching emphasizes
  non-action and emptiness; the Haṭha Yoga Pradīpikā prescribes active, disciplined practice to reach
  that state.


  **Dhammapada 21:** Both teach that vigilance and attention to the fine details of inner experience lead
  to liberation: ''Mindfulness is the path to the Deathless.'' Divergence: The Dhammapada frames this
  as ethical mindfulness; the Pradīpikā frames it as sensory and energetic refinement through breath and
  sound.'
