translation: These three Bandhas are the best of all and have been practiced by the masters. Of all the
  means of success in Hatha Yoga, they are known to the Yogis and Yoginis as the chief ones.
abhyasa: 'Today, notice where you habitually hold or release tension in your body—throat, abdomen, pelvic
  floor. Without forcing, simply observe the quality of your breath in each region. This simple awareness
  is the ground on which bandha practice rests: you cannot work skillfully with what you do not feel.'
