  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Kundali is of a bent shape, and has been described to be like a serpent. He or she who has moved that Sakti is
  no doubt Mukta (released from bondage).
abhyasa: 'Sit quietly and place attention at the base of your spine. Without forcing, notice the quality of sensation or energy
  there—heaviness, coolness, stillness, or subtle vibration. Breathe naturally and ask: What does it feel like to be ''coiled''
  in habit, contraction, or unawareness? This is contemplation, not technique; it prepares the ground for understanding what
  ''moving'' the energy might mean.'
