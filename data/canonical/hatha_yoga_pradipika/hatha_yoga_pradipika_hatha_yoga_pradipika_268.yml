title: Kundali is of a bent shape, and has been described…
unit_type: verse
commentary: 'This verse distills the central aim of haṭha yoga: awakening kuṇḍalinī, the coiled energy traditionally conceived
  as serpentine force at the base of the spine. The passage asserts that moving or rousing this Śakti (creative power) is
  itself liberation—not a preliminary step, but the realization itself. The serpent metaphor suggests both dormancy (coiled,
  bent) and potential for upward movement, implying that bondage is a state of stillness and freedom is kinetic awakening.



  Key Terms



  **Kuṇḍalinī** — The coiled, serpentine vital force or Śakti traditionally located at the base of the spine; awakening and
  raising it is understood as central to liberation in haṭha yoga.

  **Śakti** — Creative, dynamic power or feminine principle; in this context, the life-force that, when moved or awakened,
  brings release from bondage.

  **Mukta** — Released, liberated, or freed from bondage (saṃsāra); the state of one who has realized freedom through spiritual
  practice.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both texts point to a
  hidden, coiled potential within the body-mind that, when accessed or moved, reveals freedom and profound responsiveness.
  Divergence: The Tao Te Ching emphasizes subtlety and non-action (wu wei), whereas the Haṭha Yoga Pradīpikā explicitly prescribes
  active practices (āsana, prāṇāyāma, bandha) to awaken and move the energy.


  **Upaniṣads (e.g., Kaivalya Upaniṣad): ''Ātman alone is real; the world is illusion.'':** Both traditions locate liberation
  in an inner realization or awakening rather than external circumstance; freedom is recognition of what already is. Divergence:
  The Upaniṣads emphasize knowledge (jñāna) and non-dual understanding, while this verse roots liberation in the movement
  and activation of embodied energy (Śakti).


  **Heraclitus, Fragment 51: ''They do not understand how that which is at variance with itself is in agreement with itself.'':**
  Both suggest that apparent opposites—coiled and moving, bound and free—are unified in a single dynamic process. Divergence:
  Heraclitus speaks of cosmic flux and logos as eternal principle, whereas the Haṭha Yoga Pradīpikā locates this movement
  in the individual body and consciousness through deliberate practice.'
