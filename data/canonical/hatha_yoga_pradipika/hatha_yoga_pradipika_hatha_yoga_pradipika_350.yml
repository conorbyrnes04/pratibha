unit_label: On Samādhi — 4.60
title: All this movable and immovable world is mind
unit_type: verse
commentary: 'This verse presents a radical non-dualism: the entire manifest world—both changing and unchanging—is
  constituted by mind itself. When the practitioner reaches *unmani avastha* (the state beyond mind),
  the ordinary subject-object duality (*dwaita*) dissolves because the mental activity that ordinarily
  constructs that separation ceases. The passage frames haṭha yoga''s physical and energetic practices
  not as ends in themselves, but as means to this transcendence of mind-based reality.



  Key Terms



  **unmani avastha** — The state beyond mind; a condition in which ordinary mental activity ceases and
  non-dual awareness is realized.

  **dwaita** — Duality; the subject-object distinction that arises through the functioning of mind.



  Cross-Tradition Resonances



  **Advaita Vedānta (Śaṅkara): ''Brahman alone is real; the world is appearance; the individual self is
  not different from Brahman.'':** Both teach that apparent multiplicity and separation are mental constructs;
  liberation is recognition of non-dual reality. Divergence: The Pradīpikā emphasizes *practice* (yoga)
  as the path to this realization, whereas classical Advaita emphasizes *knowledge* (*jñāna*) and discrimination.


  **Yogasūtra 1.2: ''Yoga is the cessation of the fluctuations of the mind (*yogaś citta-vṛtti-nirodhah*).'':**
  Both identify the stilling of mental activity as the core goal; both see ordinary mind as the obstacle
  to true seeing. Divergence: The Yogasūtra does not explicitly frame the world itself as mind; it focuses
  on the mind''s modifications (*vṛtti*) as the problem.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... their minds were vast and profound.'':**
  Both suggest that wisdom involves transcending ordinary mental categories and entering a state of unified
  perception. Divergence: The Tao Te Ching emphasizes natural spontaneity and non-action (*wu wei*), while
  the Pradīpikā prescribes deliberate yogic discipline.'
