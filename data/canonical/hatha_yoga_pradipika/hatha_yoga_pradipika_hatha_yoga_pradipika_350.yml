translation: All this movable and immovable world is mind. When the mind has attained to the unmani avastha,
  there is no dwaita (from the absence of the working of the mind).
abhyasa: Sit quietly for five minutes. Notice how your sense of 'self' and 'world' depends on the constant
  activity of thought—labeling, comparing, separating. Without judgment, observe one moment where that
  mental narration pauses. Rest there briefly. This glimpse touches what the text calls the unmani state.
