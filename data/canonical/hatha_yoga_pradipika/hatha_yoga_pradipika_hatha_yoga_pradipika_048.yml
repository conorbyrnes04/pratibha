translation: Gaze on the tip of the nose, keeping the tongue pressed against the root of the teeth of
  the upper jaw, and the chin against the chest, and raise the air up slowly, i.e., pull the apâna-vâyu
  gently upwards.
abhyasa: 'Sit upright. Without strain, bring your gaze to the tip of your nose. Press your tongue lightly
  against the upper teeth. Draw your chin slightly toward your chest. Breathe naturally and observe: does
  this simple alignment shift your sense of presence or inner attention? Notice without judgment.'
