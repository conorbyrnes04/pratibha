title: Gaze on the tip of the nose
unit_type: verse
commentary: 'This passage describes a foundational prāṇāyāma technique that coordinates physical alignment
  (gaze, tongue, chin) with subtle energy work (drawing apāna-vāyu upward). The specificity of each instruction—from
  the focal point of the eyes to the precise tongue placement—suggests that haṭha yoga understands the
  body as an integrated system where gross posture and subtle breath-energy are inseparable. The gentle,
  deliberate quality (''slowly,'' ''gently'') indicates that force is rejected in favor of attentive cultivation.



  Key Terms



  **apāna-vāyu** — In haṭha yoga physiology, the downward-moving vital air or life-force; here, the practice
  aims to redirect it upward, reversing its natural flow as part of energy cultivation.

  **prāṇāyāma** — Regulation and extension of breath and vital energy; a central limb of haṭha yoga practice.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra II.49 (prāṇāyāma definition):** Both texts treat breath-work as a disciplined,
  sequential practice that refines the subtle body and prepares the mind for higher states. Divergence:
  Patañjali emphasizes prāṇāyāma as a bridge to sense-withdrawal (pratyāhāra); this passage focuses on
  the mechanics of energy reversal itself.


  **Taoist internal alchemy (neidan) — circulation of qi:** Both traditions understand breath and subtle
  energy as manipulable forces that can be drawn upward through the body''s central channel via precise
  postural and mental focus. Divergence: The Haṭha Yoga Pradīpikā grounds the practice in a theistic framework
  (union with Śiva); Taoist alchemy is often presented as cosmological self-cultivation without explicit
  deity.'
