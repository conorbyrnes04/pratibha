  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Time, in the form of night and day, is made by the sun and the moon. That the Susumna devours
  this time (death) even, is a great secret.
abhyasa: 'Sit quietly and observe your breath for five minutes. Notice how your awareness of time shifts
  when attention is drawn inward, away from clocks and daylight. Reflect: what changes when you turn your
  senses from the external sun and moon to the inner channels? No technique required—simply notice the
  difference between clock-time and the time of your own breath.'
