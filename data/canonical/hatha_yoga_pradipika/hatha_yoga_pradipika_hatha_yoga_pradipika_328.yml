  body: Fix the gaze on the light (seen on the tip of the nose) and raise the eyebrows a little, with
    the mind contemplating as before (in the Sambhavi Mudras, that is, inwardly thinking of Brahma, but
    apparently looking outside). This will create the Unmani avastha at once.
