  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Fix the gaze on the light (seen on the tip of the nose) and raise the eyebrows a little, with the mind contemplating
  as before (in the Sambhavi Mudras, that is, inwardly thinking of Brahma, but apparently looking outside). This will create
  the Unmani avastha at once.
abhyasa: Sit comfortably. Without strain, soften your gaze toward the tip of your nose or slightly upward. Notice any subtle
  luminosity or sensation there. Simultaneously, allow your awareness to rest inwardly, as if watching from behind the eyes.
  Hold this for a few breaths, observing what happens when attention is neither fully external nor fully withdrawn.
