commentary: 'This verse describes a subtle practice of dual awareness: the eyes are positioned to gaze at an inner light while
  the body remains outwardly still, and the mind holds an inward contemplation of Brahma even as the gaze appears directed
  outward. The text claims this simultaneous inward-outward posture produces *Unmani avastha* — a state beyond ordinary mind
  — suggesting that yoga''s aim is not dissociation from the body but a transformation of how consciousness inhabits it.



  Key Terms



  **Unmani avastha** — A state of consciousness transcending ordinary mind (manas); literally ''the state beyond mind,'' described
  here as achievable through coordinated gaze and inner contemplation.

  **Sambhavi Mudra** — A gesture or seal of the senses in which the gaze is fixed inwardly while the eyes appear to look outward;
  a practice of unified awareness.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, 3.2 (dhāraṇā):** Both texts treat focused attention as a gateway to transformed states of consciousness;
  concentration on a point (here, the nose-tip) is foundational. Divergence: The Yoga Sutras emphasize withdrawal of the senses
  (pratyāhāra) as preparation, whereas this passage integrates outer form with inner attention simultaneously.


  **Meister Eckhart, ''God is in the innermost part'':** Both suggest that the divine (Brahma / God) is accessed through inward
  turning while remaining embodied and present. Divergence: Eckhart emphasizes surrender and unknowing; this text prescribes
  a precise technical method with measurable results.'
