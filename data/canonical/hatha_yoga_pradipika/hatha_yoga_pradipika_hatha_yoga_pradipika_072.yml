  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: So long as the (breathing) air stays in the body, it is called life. Death consists in the
  passing out of the (breathing) air. It is, therefore, necessary to restrain the breath.
abhyasa: 'Today, pause and notice one complete breath cycle—inhalation, retention, exhalation. Without
  forcing, simply observe: this movement is your life happening. Repeat three times with gentle attention.
  This simple noticing is the foundation of all prāṇāyāma: recognizing breath as the tangible presence
  of life.'
