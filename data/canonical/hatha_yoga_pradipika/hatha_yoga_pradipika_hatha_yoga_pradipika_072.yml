unit_label: On Prāṇāyāma — 2.3
title: So long as the (breathing) air stays in the body…
unit_type: verse
commentary: 'This passage grounds haṭha yoga practice in a fundamental observation: breath and life are
  inseparable. By identifying prāṇa (vital breath/energy) as the marker of embodied existence, Svātmārāma
  establishes why breath control (prāṇāyāma) is not merely a technique but a direct engagement with the
  boundary between life and death. The imperative to ''restrain the breath'' thus becomes an act of conscious
  participation in the continuity of existence itself—a practical threshold where the yogi meets the forces
  that sustain embodiment.



  Key Terms



  **prāṇa** — The vital breath or life-force that animates the body; its presence constitutes life, its
  departure constitutes death.

  **prāṇāyāma** — The restraint, regulation, or expansion of breath; a central practice in haṭha yoga
  aimed at directing and refining vital energy.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.27:** Both texts treat death as the departure of a vital principle and life as its
  presence; both frame this recognition as foundational to spiritual practice. Divergence: The Gītā contextualizes
  this within karma and rebirth; the Pradīpikā focuses on the immediate technical practice of breath control
  as the means to harness this principle.


  **Taoist texts (e.g., Secret of the Golden Flower):** Both traditions identify breath as the vehicle
  of subtle energy and emphasize its cultivation through conscious restraint and circulation. Divergence:
  Taoist practice often emphasizes the circulation of breath through energy channels; the Pradīpikā presents
  breath restraint as a gateway to samādhi and transcendence of embodied limitation.'
