title: Viparita Karani, Vijroli, and Sakti Chalana
unit_type: verse
commentary: 'This verse names three mudrās (Viparita Karani, Vijroli, Sakti Chalana) as part of a set
  of ten mudrās said to transcend decay and mortality. The passage reflects haṭha yoga''s central claim:
  that precise bodily and energetic practices can transform the human condition itself, moving the practitioner
  beyond the ordinary cycle of aging. The mudrās are presented not as mere physical exercises but as instruments
  of liberation, grounding the spiritual aim of yoga in concrete somatic work.



  Key Terms



  **mudrā** — A gesture, seal, or energetic lock—in haṭha yoga, a specific practice involving posture,
  breath, and internal muscular engagement, said to direct and concentrate vital force (prāṇa).

  **prāṇa** — Vital life-force or breath-energy that animates the body and mind; the primary substance
  worked with in prāṇāyāma and mudrā practice.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... who can gradually make the
  muddy water clear?'':** Both traditions locate transformation in patient, embodied practice rather than
  intellectual knowledge; both suggest that clarity emerges through disciplined work with the body''s
  own nature. Divergence: The Tao Te Ching emphasizes wu-wei (non-action, effortlessness), while haṭha
  yoga explicitly prescribes vigorous, structured techniques—a more active intervention in the body''s
  processes.


  **Plato, Phaedo: the soul imprisoned in the body, seeking escape through philosophy.:** Both address
  the problem of embodied existence and mortality as central to spiritual practice. Divergence: Plato
  frames the body as a prison from which the soul must flee; haṭha yoga treats the body as the very instrument
  and site of liberation, not an obstacle to transcend.


  **Dhammapada, v. 21: ''Heedfulness is the path to the Deathless; heedlessness is the path to death.'':**
  Both traditions posit that disciplined, attentive practice leads beyond mortality; both see ordinary
  human life as a kind of sleep or forgetfulness. Divergence: The Dhammapada emphasizes mental vigilance
  and ethical conduct; the Haṭha Yoga Pradīpikā locates the work in specific bodily and energetic techniques.'
