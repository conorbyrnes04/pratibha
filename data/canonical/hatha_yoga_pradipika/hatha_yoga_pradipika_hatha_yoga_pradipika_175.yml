translation: Viparita Karani, Vijroli, and Sakti Chalana. These are the ten Mudras which annihilate old
  age and death.
abhyasa: 'Read this verse slowly. Notice what it claims: that specific practices address not abstract
  spiritual goals but the concrete human fear of aging and death. Sit quietly and ask yourself: what does
  it mean that a yoga tradition locates transcendence in the body''s own capacities, rather than escape
  from the body? Hold that question without rushing to answer.'
