title: Sitkari is performed by drawing in the air through
unit_type: verse
commentary: 'This verse describes Sitkari, a specific breathing practice in which air is inhaled through
  the mouth with the tongue positioned between the lips, then exhaled through the nose—a reversal of ordinary
  breath flow. The claim that regular practice brings one ''next to the God of love and beauty'' (Kāma)
  suggests that this prāṇāyāma refines the subtle body and sensory faculties, aligning the practitioner
  with qualities of grace and aesthetic perception. The passage exemplifies how haṭha yoga texts link
  precise physical technique to spiritual and divine attainment.



  Key Terms



  **Sitkari** — A prāṇāyāma (breathing practice) in which air is drawn in through the mouth with the tongue
  between the lips and expelled through the nose, traditionally said to cool and refine the body and mind.

  **Kāma** — In Hindu philosophy, the deity and principle of desire, love, and aesthetic beauty; here
  invoked as a state of refined sensory and spiritual grace accessible through practice.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra 1.12–14 (abhyāsa and vairāgya):** Both texts emphasize that consistent, devoted
  practice (abhyāsa) over time produces transformation; Sitkari, like all yoga techniques, requires repetition
  to yield its fruit. Divergence: The Sūtra focuses on the mental discipline of practice and non-attachment,
  while the Pradīpikā grounds transformation in specific bodily techniques and their physiological effects.


  **Tao Te Ching 15 (the sage''s subtle mastery):** Both suggest that refinement comes through precise,
  humble attention to small actions—here, the exact placement of the tongue and direction of breath—rather
  than force or grandeur. Divergence: The Tao Te Ching emphasizes wu-wei (non-action) and paradox, while
  Sitkari is an explicit, intentional technique with a defined goal.


  **Heraclitus, Fragment 45 (hidden harmony):** The passage implies that ordinary breath and body conceal
  a deeper order; by reversing the breath''s path, one accesses that hidden alignment and beauty. Divergence:
  Heraclitus speaks of universal flux and logos; the Pradīpikā locates transformation in the individual
  body and its subtle channels (nāḍī).'
