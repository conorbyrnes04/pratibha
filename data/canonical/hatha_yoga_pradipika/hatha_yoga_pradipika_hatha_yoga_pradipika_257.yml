abhyasa: 'Read the passage slowly twice. Notice how the text moves from naming abstract practices to concrete
  material instruction. Sit quietly and consider: what does it mean that a spiritual technique requires
  both subtle understanding and humble, ordinary preparation? No action needed beyond this reflection.'
