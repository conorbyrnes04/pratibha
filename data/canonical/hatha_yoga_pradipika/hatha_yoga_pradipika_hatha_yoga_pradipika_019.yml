translation: Being the first accessory of Hatha Yoga, āsana is described first. It should be practiced
  for gaining steady posture, health and lightness of body.
abhyasa: 'Today, sit in a comfortable upright posture for five minutes—whether cross-legged, kneeling,
  or on a chair. Notice without forcing: Where do you feel steady? Where does tension pull you off-center?
  Where does the body feel light or heavy? This simple inquiry honors the passage''s three aims: you are
  cultivating steadiness, attending to the body''s condition, and sensing the possibility of ease.'
