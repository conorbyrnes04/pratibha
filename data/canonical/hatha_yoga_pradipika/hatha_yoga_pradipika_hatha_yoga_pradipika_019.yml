title: Being the first accessory of Hatha Yoga, āsana is…
unit_type: verse
commentary: 'This opening statement establishes āsana—physical posture—as the foundational gateway to
  haṭha yoga practice, valued not for acrobatic display but for three concrete fruits: stability of seat,
  bodily health, and a quality of ease or buoyancy. The term ''accessory'' (aṅga, limb) signals that āsana
  is one component in a larger system, yet its placement first reflects the text''s pragmatic recognition
  that the body must be prepared before subtler work with breath and mind becomes possible or fruitful.



  Key Terms



  **āsana** — Posture or seat; in haṭha yoga, the physical positions through which the body is stabilized
  and prepared for breath and meditative work.

  **haṭha yoga** — The yoga of force or effort; a systematic path using physical postures, breath control,
  and energy locks to prepare the body-mind for higher states of awareness.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali):** Both texts ground yoga in the body: Patañjali defines āsana as ''sthira
  sukham''—steady and comfortable—echoing the Pradīpikā''s emphasis on stability and ease. Divergence:
  Patañjali treats āsana as one of eight limbs in a more philosophical framework; the Pradīpikā presents
  it as the practical first step of a specific embodied method.


  **Plato, *Phaedrus* (on the body as vehicle):** Both traditions recognize the body as an instrument
  requiring care and alignment before higher faculties can function well. Divergence: Plato views the
  body primarily as a potential obstacle to the soul; the Pradīpikā treats it as an essential ally and
  medium of transformation.'
