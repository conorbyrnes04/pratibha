title: Such a one does not hear the noise of the conch and…
unit_type: verse
commentary: 'This verse describes a state of profound inward absorption in which the practitioner becomes
  deaf to external sound—even loud ritual instruments—and the body enters a condition of apparent inertness
  or suspension. The ''Unmani avastha'' (the state beyond mind) marks a threshold where ordinary sensory
  awareness and bodily responsiveness dissolve, suggesting that advanced practice can produce a radical
  shift in consciousness where the body is no longer the seat of ordinary sensation or volition. The image
  of the body ''like a piece of wood'' is not meant as death, but as a sign of transcendence of the body''s
  usual reactive nature.



  Key Terms



  **Unmani avastha** — The state beyond mind; a condition of consciousness in which the ordinary discriminating
  mind is transcended and the practitioner rests in undifferentiated awareness.

  **haṭha yoga** — The yoga of force or effort; the physical and energetic practices (āsana, prāṇāyāma,
  mudrā, bandha) used as a foundation for higher states of meditation and liberation.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of the fluctuations
  of mind):** Both texts point to a state in which the mind''s ordinary activity ceases, allowing a deeper
  consciousness to emerge. The Haṭha Yoga Pradīpikā''s image of sensory withdrawal aligns with Patañjali''s
  emphasis on stilling mental turbulence. Divergence: Patañjali frames yoga as a philosophical system
  of discrimination and restraint; the Pradīpikā emphasizes embodied, energetic practices (prāṇāyāma,
  kriyā) as the means to that same goal, suggesting the body is not an obstacle but a vehicle.


  **Meister Eckhart: ''The eye by which I see God is the same eye by which God sees me'':** Both suggest
  a state of consciousness in which subject-object duality dissolves and ordinary sensory and mental filters
  fall away, revealing a unified awareness. Divergence: Eckhart''s language is theistic and mystical;
  the Pradīpikā remains phenomenological and technical, describing states of consciousness without invoking
  a personal God.


  **Zhuangzi, ''The Useless Tree'': the tree that is worthless for lumber survives; the sage becomes ''useless''
  to the world''s demands:** Both use the image of becoming inert or ''like wood'' as a sign of freedom—not
  death, but release from the compulsion to react and serve ordinary purposes. Divergence: Zhuangzi''s
  uselessness is a social and ethical stance; the Pradīpikā''s ''wooden'' body is a sign of inward transcendence
  of bodily sensation itself.'
