translation: Such a one does not hear the noise of the conch and Dundubhi. Being in the Unmani avastha,
  his or her body becomes like a piece of wood.
abhyasa: Sit quietly for ten minutes. Notice which sounds pull your attention outward (traffic, voices,
  ambient noise). Rather than resisting them, observe the gap between the sound arriving and your mind's
  reaction to it. Can you rest in that gap, even briefly? This is not about achieving the state described—which
  requires years of practice—but about recognizing how attention habitually follows sensation, and experimenting
  with a different relationship to it.
