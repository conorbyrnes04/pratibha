translation: To accomplish this, the tongue is lengthened by cutting the fraenum linguae, moving, and
  pulling it. When it can touch the space between the eyebrows, then the Kechari can be accomplished.
abhyasa: 'Sit quietly and gently explore the underside of your tongue with awareness. Without forcing
  or injuring, notice the frenulum (the tissue beneath). Reflect on how haṭha yoga treats the body as
  a precise instrument: what small, patient refinements in your own practice—breath, posture, attention—might
  gradually open capacities you do not yet possess?'
