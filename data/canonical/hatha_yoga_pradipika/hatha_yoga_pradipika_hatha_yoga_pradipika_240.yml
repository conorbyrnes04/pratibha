translation: By drawing up the mulasthana (anus), Uddiyana Bandha should be performed. The flow of the
  air should be directed to the Susumna, by closing the Ida and the Pingala.
abhyasa: Sit quietly and bring awareness to your lower abdomen and pelvic floor. On an exhale, gently
  draw the lower belly and pelvic floor upward (without strain). Notice any shift in the quality of your
  breath or inner attention. Release on the inhale. Repeat 3–5 times, observing without judgment how the
  body responds.
practice: Sit quietly and bring awareness to your lower abdomen and pelvic floor. On an exhale, gently
