title: By drawing up the mulasthana (anus), Uddiyana…
unit_type: verse
commentary: 'This verse describes a foundational lock (bandha) and breath-channel practice central to
  haṭha yoga''s physiology of subtle energy. Uddiyana Bandha—the upward drawing of the lower abdomen—is
  presented as a means to redirect prāṇa (vital force) into the central channel (Suṣumnā), away from the
  lateral channels (Iḍā and Piṅgalā) associated with lunar and solar energies. The passage assumes a subtle
  anatomy in which breath, body, and energy are inseparable, and in which deliberate muscular and respiratory
  action can reorient the flow of life-force toward liberation.



  Key Terms



  **Uddiyana Bandha** — A muscular lock in which the lower abdomen and pelvic floor are drawn upward,
  traditionally used to redirect prāṇa and support prāṇāyāma practice.

  **Suṣumnā** — The central energy channel running along the spine, through which prāṇa is said to flow
  toward higher states of consciousness.

  **Iḍā and Piṅgalā** — The left and right subtle channels, associated respectively with lunar (cooling,
  receptive) and solar (heating, active) energies; their balance is foundational to haṭha practice.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts propose that
  deliberate, subtle bodily action (or restraint) creates conditions for a refined inner state; the settling
  of prāṇa mirrors the settling of the mind. Divergence: The Tao Te Ching emphasizes non-action and receptivity;
  the Haṭha Yoga Pradīpikā prescribes precise muscular and respiratory techniques as the means to that
  state.


  **Patañjali''s Yoga Sutras, II.46: ''Sthira sukham āsanam'' (posture should be steady and comfortable).:**
  Both texts ground yoga in the body as a vehicle for refined states; bandha, like āsana, is a physical
  anchor for prāṇa and mind. Divergence: Patañjali emphasizes the mental quality of steadiness; the Haṭha
  Yoga Pradīpikā foregrounds the energetic and anatomical mechanisms by which the body facilitates that
  state.


  **Kabbalistic concept of the three pillars (severity, equilibrium, mercy) in the Tree of Life.:** Both
  traditions map subtle anatomy as channels or pathways through which spiritual energy must be balanced
  and directed toward a central axis of integration. Divergence: Kabbalah works primarily through symbol
  and contemplation; haṭha yoga uses embodied, kinesthetic practice as the primary method.'
