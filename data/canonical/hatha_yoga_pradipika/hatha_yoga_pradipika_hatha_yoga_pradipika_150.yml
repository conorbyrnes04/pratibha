translation: Binding the Padma-âsana and keeping the body straight, closing the mouth carefully, let the
  air be expelled through the nose.
abhyasa: Sit upright in a comfortable cross-legged position. Close your mouth gently. Exhale slowly and
  completely through your nose, observing the quality of the breath without forcing it. Repeat three times,
  noticing how posture, closure, and breath direction work together. This simple act is the threshold
  of the practice.
practice: Sit upright in a comfortable cross-legged position. Close your mouth gently. Exhale slowly and
  completely through your nose, observing the quality of the breath without forcing it. Repeat three times,
  noticing how posture, closure, and breath direction work together. This simple act is the threshold
  of the practice.
