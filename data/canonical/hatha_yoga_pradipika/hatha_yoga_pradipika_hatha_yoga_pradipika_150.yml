sanskrit_devanagari: 'ऊर्वोर् उपरि संस्थाप्य शुभे पाद-तले उभे ।

  पद्मासनं भवेद् एतत् सर्व-पाप-प्रणाशनम् सम्यक् पद्मासनं बद्ध्वा सम-ग्रीवोदरः सुधीः ।

  मुखं संयम्य यत्नेन प्राणं घ्राणेन रेचयेत्'
