title: Binding the Padma-âsana and keeping the body…
unit_type: verse
commentary: 'This verse distills the foundational posture and breath control that anchor haṭha yoga practice.
  By naming three simultaneous acts—stable seated form, erect spine, and controlled exhalation through
  the nose—the text shows that yoga is not merely physical contortion but an integrated discipline of
  body, breath, and attention. The specificity (nose, not mouth) signals that breath work is precise and
  deliberate, not casual.



  Key Terms



  **Padma-āsana** — The lotus pose; a seated posture in which the feet are crossed and placed on the thighs,
  traditionally used for meditation and breath work.

  **āsana** — A stable, comfortable bodily posture; one of the eight limbs of yoga, foundational to prāṇāyāma
  and meditation.

  **prāṇāyāma** — Regulation and extension of breath; systematic control of vital life-force through breathing
  techniques.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'' — the posture should be steady and comfortable.:**
  Both texts emphasize that āsana is not mere physical positioning but a balance of stability and ease,
  a foundation for deeper work. Divergence: The Yoga Sūtra speaks of āsana in abstract principle; the
  Pradīpikā gives concrete, embodied instruction in a specific pose.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both traditions prize precision and restraint—the Pradīpikā''s
  careful closure of the mouth and deliberate exhalation echo the Taoist attention to minimal, exact action.
  Divergence: The Pradīpikā is prescriptive and technical; the Tao Te Ching is apophatic and paradoxical.


  **Dhammapada 376: ''Mindfulness is the path to the Deathless; heedlessness is the path to death.'':**
  Both texts locate transformation in attentive, deliberate practice—the Pradīpikā''s careful binding
  and breath control embody the mindfulness the Dhammapada names. Divergence: The Pradīpikā works through
  the body and prāṇa; the Dhammapada emphasizes mental vigilance and ethical conduct.'
