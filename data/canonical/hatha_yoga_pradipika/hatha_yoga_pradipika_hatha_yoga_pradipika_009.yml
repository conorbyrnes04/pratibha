translation: These Mahāsiddhas (great masters), breaking the sceptre of death, are roaming in the universe.
abhyasa: Sit quietly for a few minutes and contemplate what 'death' means to you—not physical death, but
  the small deaths of habit, fear, and identification. Notice one rigid belief or fear you carry as if
  it were absolute law. Imagine, without strain, what freedom from that single 'sceptre' might feel like.
  Return to your breath.
