abhyasa: Before practicing any āsana today, pause and recall one teacher or practitioner—real or from
  lineage—whose example inspires your own effort. Let that remembrance settle into your body as you begin;
  notice how it shifts your intention from mere physical exercise toward participation in something larger
  than yourself.
