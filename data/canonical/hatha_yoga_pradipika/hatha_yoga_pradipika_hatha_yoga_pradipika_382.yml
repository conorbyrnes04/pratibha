  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Those desirous of the kingdom of Yoga, should take up the practice of hearing the anahata
  nada, with mind collected and free from all cares.
abhyasa: Sit quietly for 5–10 minutes in a comfortable, upright posture. Close your ears gently with your
  fingers or simply turn attention inward. Listen without grasping—for any subtle vibration, hum, or resonance
  arising in the body or mind. Do not strain or imagine; simply notice what emerges when the mind settles.
  This is an invitation to *nāda yoga*, not a performance.
