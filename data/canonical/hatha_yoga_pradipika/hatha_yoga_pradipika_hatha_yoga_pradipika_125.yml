  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Before Kumbhaka, he or she should perform Viparita Karni Mudra, in order that he or she may be able to perform
  Jalandhar bandha comfortably.
abhyasa: Reflect on one practice or discipline in your own life where you have rushed ahead without preparation. Notice what
  happened. Then identify one small preparatory step you could take today—not the main goal, but the ground it needs. Sit
  with that humility.
