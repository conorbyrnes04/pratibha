unit_label: On Prāṇāyāma — 2.56
title: Before Kumbhaka, he or she should perform Viparita…
unit_type: verse
commentary: 'This brief instruction establishes a preparatory sequence: the inversion of Viparita Karni Mudra readies the
  body and energy channels for Jalandhar bandha, a throat lock essential to breath retention (Kumbhaka). The passage assumes
  a graduated path—each practice creates conditions for the next—reflecting the Pradīpikā''s vision of haṭha yoga as a methodical,
  embodied discipline. Comfort (sukham) in the practice is not incidental but necessary; forcing locks without preparation
  risks harm and blocks the flow toward samādhi.



  Key Terms



  **Kumbhaka** — Retention of breath; a central prāṇāyāma practice in which the breath is held after inhalation or exhalation
  to direct and stabilize vital energy (prāṇa).

  **Jalandhar bandha** — A throat lock created by gently drawing the chin toward the chest, used to seal and direct prāṇa
  during breath retention and meditation.

  **Viparita Karni Mudra** — An inversion practice (often described as a shoulder stand or similar posture) that reverses
  the flow of energy and prepares the nervous system for deeper prāṇāyāma work.



  Cross-Tradition Resonances



  **Aristotle, *Nicomachean Ethics* II.1:** Both texts teach that virtue (or mastery) arises through habituation in right
  order—small, preparatory acts build capacity for greater ones. Comfort in practice is cultivated, not assumed. Divergence:
  Aristotle emphasizes moral habit and character; the Pradīpikā works through the body and subtle energy channels as the vehicle
  of transformation.


  **Tao Te Ching 15:** Both honor the subtle and preparatory: ''The ancient masters were profound and subtle''—they moved
  without forcing, understood that readiness precedes action. Divergence: The Pradīpikā is explicitly technical and sequential;
  the Tao Te Ching teaches through paradox and non-action, not step-by-step instruction.


  **Dhammapada 21:** Both traditions recognize that heedfulness and gradual cultivation—not sudden effort—lead to liberation:
  ''Heedfulness is the path to the Deathless.'' Divergence: The Pradīpikā locates the path in prāṇa and the subtle body; the
  Dhammapada in mindfulness of mind and conduct.'
