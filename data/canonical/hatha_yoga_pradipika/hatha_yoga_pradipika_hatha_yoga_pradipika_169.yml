title: As the chief of the snakes is the support of the…
unit_type: verse
commentary: 'This verse establishes kuṇḍalinī—the subtle energy coiled at the base of the spine—as the
  foundational power upon which all yogic practice rests. By comparing it to the mythic serpent Śeṣa,
  who bears the earth and all its weight, Svātmārāma suggests that kuṇḍalinī is not merely one technique
  among many, but the living ground from which all tantric and yogic methods derive their efficacy. The
  image conveys both immense power and patient, stable support.



  Key Terms



  **Kuṇḍalinī** — The coiled serpent-power residing at the base of the spine; in haṭha yoga, the dormant
  subtle energy that, when awakened through practice, rises through the central channel and enables higher
  states of consciousness.

  **Tantra** — In this context, the yogic practices and techniques (āsana, prāṇāyāma, mudrā, etc.) that
  form the body of haṭha yoga; often refers more broadly to non-dual spiritual systems that work with
  subtle energy and embodied transformation.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts speak of an invisible, foundational principle (the Tao; kuṇḍalinī)
  that supports and animates all manifest phenomena. The sage or yogi aligns with this ground. Divergence:
  The Tao Te Ching emphasizes non-action and formlessness; the Haṭha Yoga Pradīpikā prescribes active,
  embodied techniques to awaken and direct the foundational power.


  **Upaniṣads (e.g., Kaṭha Upaniṣad):** Both traditions speak of a supreme energy or principle (Brahman,
  kuṇḍalinī) that underlies all existence and is the goal of spiritual practice. Divergence: The Upaniṣads
  approach this through knowledge and meditation on non-dual reality; the Haṭha Yoga Pradīpikā approaches
  it through systematic bodily and energetic practices.


  **Heraclitus, Fragment 30:** Both suggest a hidden, dynamic order (logos; kuṇḍalinī-śakti) that governs
  and sustains the visible world, accessible only to those who inquire deeply. Divergence: Heraclitus
  emphasizes flux and rational principle; the Haṭha Yoga Pradīpikā emphasizes a dormant, coiled power
  that must be deliberately awakened through disciplined practice.'
