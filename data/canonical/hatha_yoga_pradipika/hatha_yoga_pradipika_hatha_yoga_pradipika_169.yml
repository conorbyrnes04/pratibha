  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: As the chief of the snakes is the support of the earth with all the mountains and forests
  on it, so all the Tantras (Yoga practices) rest on the Kundalini. (The Vertebral column.)
abhyasa: Sit quietly and place gentle awareness at the base of your spine. Without forcing or visualizing,
  simply notice the quality of stability or presence there—as if acknowledging an ancient, patient foundation
  beneath your whole being. Breathe naturally for a few minutes, returning attention whenever it wanders.
