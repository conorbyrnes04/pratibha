translation: The sound which a muni hears by closing his or her ears with his or her fingers, should be
  heard attentively, till the mind becomes steady in it.
abhyasa: In a quiet moment, gently close your ears with your fingertips and listen inward for 2–3 minutes.
  Notice any humming, ringing, or rushing sounds that arise. Rather than analyzing them, simply rest your
  attention there, returning whenever the mind wanders. Observe whether sustained listening creates any
  steadiness or shift in your mental state.
practice: In a quiet moment, gently close your ears with your fingertips and listen inward for 2–3 minutes.
  Notice any humming, ringing, or rushing sounds that arise. Rather than analyzing them, simply rest your
  attention there, returning whenever the mind wanders. Observe whether sustained listening creates any
  steadiness or shift in your mental state.
