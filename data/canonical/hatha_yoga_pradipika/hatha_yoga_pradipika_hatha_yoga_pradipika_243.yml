translation: The whole of the nectar, possessing divine qualities, which exudes from the Soma (Chandra)
  is devoured by the Surya; and, owing to this, the body becomes old.
abhyasa: 'Sit quietly and observe your own breath and energy throughout the day. Notice moments when you
  feel depleted or ''consumed'' (fatigue, scattered attention, physical decline) and moments when you
  feel regenerated (rest, focus, vitality). Without judgment, simply witness: where does your soma—your
  vital reserve—seem to go? This simple observation can deepen your felt sense of why the text teaches
  techniques to preserve and recirculate energy rather than allow it to be ''devoured.'''
