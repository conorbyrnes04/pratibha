title: The whole of the nectar
unit_type: verse
commentary: 'This verse uses solar and lunar symbolism to describe a fundamental metabolic principle:
  the sun (Surya) consumes the regenerative nectar (soma) that flows from the moon (Chandra), and this
  consumption drives aging and decay of the body. The passage suggests that aging is not inevitable fate
  but a process of energy depletion that can be observed and potentially redirected through yogic practice.
  By understanding this dynamic, the practitioner recognizes why prāṇāyāma and other haṭha techniques
  aim to preserve, circulate, or reverse the downward flow of vital essence.



  Key Terms



  **Soma (Chandra)** — The moon principle; in this passage, the source of regenerative nectar or vital
  essence that sustains the body.

  **Surya** — The sun principle; in this passage, the force that consumes or depletes the soma, driving
  aging and bodily decline.

  **Nectar (amṛta)** — The divine, life-sustaining fluid or essence that flows from the moon; its preservation
  or circulation is a goal of haṭha practice.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15 (Lao Tzu):** Both texts describe the body as a dynamic system of opposing forces
  (yin/yang, soma/surya) in constant flux, and suggest that wisdom lies in understanding and balancing
  these forces rather than resisting them. Divergence: The Tao Te Ching emphasizes non-action and natural
  flow; the Haṭha Yoga Pradīpikā prescribes active techniques (āsana, prāṇāyāma, bandha) to redirect and
  preserve energy.


  **Upaniṣads (e.g., Kaṭha Upaniṣad):** Both employ solar and lunar symbolism to describe subtle energetic
  anatomy and the relationship between gross and subtle bodies; both frame yogic practice as a means to
  transcend ordinary bodily decay. Divergence: The Upaniṣads focus primarily on knowledge (jñāna) and
  the Self; the Haṭha Yoga Pradīpikā emphasizes embodied technique (kriyā) as the gateway to that knowledge.


  **Ecclesiastes 12:1–7 (Hebrew Bible):** Both passages contemplate aging and bodily decline as a natural,
  observable process; both imply that awareness of this process is spiritually significant. Divergence:
  Ecclesiastes frames aging as inevitable vanity and calls for remembrance of the Creator; the Haṭha Yoga
  Pradīpikā frames aging as a reversible energetic process and offers practical methods to arrest or redirect
  it.'
