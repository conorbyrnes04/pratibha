  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Prana, flowing through the Susumna, brings about the condition of manonmani; other practices are simply futile
  for the Yogi or Yogini.
abhyasa: Today, sit quietly and notice your breath's natural pathway. Without forcing, observe whether your awareness tends
  toward the left nostril, right nostril, or a sense of center. This simple noticing—without technique—honors the text's emphasis
  on prāṇa's movement as the real work, inviting you to sense rather than strain.
