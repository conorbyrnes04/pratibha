title: Without Raja Yoga, this earth, the night, and the…
unit_type: verse
commentary: 'This verse asserts that haṭha yoga''s physical and energetic practices—āsana (steadiness),
  kumbhaka (breath retention), and mudrā (gesture)—remain incomplete and lack true radiance without rāja
  yoga, the mastery of mind itself. The passage uses the metaphor of night (cessation, stillness) to describe
  kumbhaka as a pause in the breath''s activity, suggesting that technical perfection of the body and
  breath is merely the scaffold; the real beauty emerges only when these practices serve the awakening
  of consciousness. This reflects the text''s core teaching: haṭha is the preparatory path, not the destination.



  Key Terms



  **Rāja Yoga** — The yoga of the mind and consciousness; the mastery of mental states toward samādhi.
  In this text, the ultimate fruit toward which haṭha practices are directed.

  **Kumbhaka** — Retention of breath; the cessation of prāṇa''s outward and inward movement. Metaphorically
  described here as ''night''—a state of stillness and absence of motion.

  **Mudrā** — Energetic gesture or seal; a practice that directs and locks prāṇa (life force) within the
  body.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts place the stilling of mind at yoga''s heart; external practices are means, not ends. Divergence:
  The Yoga Sūtra emphasizes mental discipline directly; the Haṭha Pradīpikā uses the body and breath as
  the entry point to that same goal.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both suggest that true mastery transcends technique and enters
  a realm beyond description—the ''beauty'' that emerges only in depth. Divergence: The Tao Te Ching points
  to paradox and wordlessness; the Haṭha Pradīpikā offers a systematic ladder of practices as the path
  to that transcendence.


  **Bhagavad Gītā 6.3 (on the yoga of action): ''For the sage who seeks to attain yoga, action is said
  to be the means.'':** Both texts frame physical/energetic practice as instrumental—a means to higher
  realization, not an end in itself. Divergence: The Gītā emphasizes action and duty in the world; the
  Haṭha Pradīpikā focuses on internal energetic transformation through breath and posture.'
