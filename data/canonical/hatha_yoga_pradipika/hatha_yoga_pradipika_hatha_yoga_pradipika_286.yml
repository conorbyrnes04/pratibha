translation: 'Without Raja Yoga, this earth, the night, and the Mudras, be they howsoever wonderful, do
  not appear beautiful. (Note: Raja Yoga=âsana. Earth=steadiness, calmness. Night=Kumbhaka; cessations
  of the activity of the Prana, just as King''s officials cease moving at night. Hence night means absence
  of motion, i.e., Kumbhaka.)'
abhyasa: 'Today, during a simple breath-retention practice (kumbhaka), notice the quality of stillness
  not just in the body but in the mind. Rather than counting or forcing, observe: does the pause in breath
  create a pause in thought? What becomes visible in that quiet? This small inquiry honors the passage''s
  hint that technique alone is hollow—the real work is what happens to awareness.'
