  label: Translation
  body: 'Without Raja Yoga, this earth, the night, and the Mudras, be they howsoever wonderful, do not
    appear beautiful. (Note: Raja Yoga=âsana. Earth=steadiness, calmness. Night=Kumbhaka; cessations of
    the activity of the Prana, just as King''s officials cease moving at night. Hence night means absence
    of motion, i.e., Kumbhaka.)'
