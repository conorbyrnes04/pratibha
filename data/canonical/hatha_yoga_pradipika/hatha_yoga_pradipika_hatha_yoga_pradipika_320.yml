translation: This very laya is what is called moksa, or, being a sectarian, you may not call it moksa;
  but when the mind becomes absorbed, a sort of ecstasy is experienced.
abhyasa: Sit quietly for five minutes. Notice the moments when your thinking quiets—perhaps while watching
  breath, or in a gap between thoughts. Rather than naming or judging the state, simply rest in the quality
  of absorption itself, without grasping. Return gently when the mind re-engages.
