title: This very laya is what is called moksa, or, being a…
unit_type: verse
commentary: 'Svātmārāma here points to a direct experience—the absorption of mind (laya)—as the heart
  of liberation, while acknowledging that different traditions may name or frame this differently. The
  passage is pragmatic rather than dogmatic: whether one calls it mokṣa (liberation) or simply ''ecstasy''
  (a state of absorbed consciousness), the actual experience of mind dissolving into stillness is what
  matters. This suggests that the technical practices of haṭha yoga are not ends in themselves, but means
  to this experiential threshold where the ordinary thinking mind ceases and something unified remains.



  Key Terms



  **laya** — Dissolution or absorption; in this context, the merging or stilling of the individual mind
  into a unified, undifferentiated state of consciousness.

  **mokṣa** — Liberation; freedom from the cycle of rebirth and suffering; here presented as synonymous
  with the direct experience of laya.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of the fluctuations
  of mind):** Both texts identify the stilling of mental activity as the core of yoga and liberation.
  Divergence: Patañjali emphasizes cessation as a technical definition; Svātmārāma emphasizes the felt
  ecstasy of that state, making it more phenomenological.


  **Advaita Vedānta (Śaṅkara): Brahman alone is real; the self is non-dual:** Both traditions point to
  a unified, non-dual consciousness as the ultimate reality and the goal of practice. Divergence: Advaita
  is primarily a path of knowledge (jñāna); haṭha yoga here uses embodied practice and prāṇa to arrive
  at the same threshold.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both suggest
  a state where subject-object duality dissolves and consciousness becomes unified. Divergence: Eckhart
  frames this as divine union; Svātmārāma frames it as the natural result of mind''s absorption, without
  invoking theistic language.'
