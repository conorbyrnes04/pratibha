unit_label: On Prāṇāyāma — 2.67
title: Some like camphor, and betel leaf
unit_type: verse
commentary: 'This brief passage addresses the diet of practitioners engaged in prāṇāyāma, suggesting that
  while betel leaf has general appeal, yogis and yoginis benefit from consuming it in its plain form—without
  the additives (lime, areca nut, catechu) that typically accompany it. The teaching reflects a principle
  woven through the Pradīpikā: that yoga practice requires attentiveness to the body''s condition and
  subtle channels, and that even small choices in consumption matter. Plain betel leaf, apparently, supports
  the breath-work without the heating or stimulating effects of the prepared form.



  Key Terms



  **Prāṇāyāma** — Regulation and extension of the breath; a foundational practice in haṭha yoga that works
  with the vital life-force (prāṇa) through controlled breathing.

  **Yogis and Yoginis** — Male and female practitioners of yoga; the text''s use of both terms acknowledges
  that the path is open to all genders.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16 (on yoga and moderation in eating):** Both texts teach that the yogi''s diet should
  be moderate and conducive to practice, not indulgent or stimulating. Divergence: The Gītā speaks broadly
  of sattvic (pure) foods; the Pradīpikā gives a specific, practical example tied directly to prāṇāyāma''s
  demands.


  **Patañjali''s Yoga Sutras 2.32 (on śauca, purity, as a niyama):** Both texts suggest that purity—including
  in what enters the body—supports yoga practice and mental clarity. Divergence: Patañjali frames it as
  an ethical discipline; the Pradīpikā frames it as a physiological aid to breath-work.'
