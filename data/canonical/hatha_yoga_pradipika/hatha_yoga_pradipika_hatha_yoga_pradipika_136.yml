  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Some like camphor, and betel leaf. To the Yogis and Yoginis, practicing Pranayama, betel
  leaf without powders, i.e., lime, nuts and katha, is beneficial.
abhyasa: 'Today, notice one small dietary choice you make habitually—a spice, sweetener, or accompaniment.
  Pause before consuming it and ask: does this support my energy and clarity, or does it cloud them? You
  need not change anything, but observe with the yogic principle in mind: that the body is an instrument
  for practice, and what we take in affects the breath.'
