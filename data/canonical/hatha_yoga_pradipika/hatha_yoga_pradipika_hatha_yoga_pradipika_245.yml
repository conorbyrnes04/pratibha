title: Above the navel and below the palate respectively…
unit_type: verse
commentary: 'This passage locates two fundamental energetic centers—Surya (sun) and Chandra (moon)—within
  the body''s subtle anatomy, positioning them as poles of an internal system. The brief mention of Viparita
  Karani suggests that specific postural practices are designed to work with these centers under direct
  transmission from a teacher, implying that the body''s subtle geography is not merely conceptual but
  actionable through disciplined practice.



  Key Terms



  **Surya** — The sun; here, a center of solar (heating, active) energy located above the navel in the
  subtle body.

  **Chandra** — The moon; here, a center of lunar (cooling, receptive) energy located below the palate
  in the subtle body.

  **Viparita Karani** — An inverted posture or practice mentioned in the text as a method learned from
  the guru for working with the Surya and Chandra centers.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 10 & 28 (yin-yang polarity):** Both traditions recognize complementary polar forces—solar/lunar
  or yang/yin—as fundamental to the body''s subtle functioning and require balancing practice. Divergence:
  The Haṭha Yoga Pradīpikā locates these poles within specific anatomical sites and links them to postural
  technique; the Tao Te Ching speaks of polarity more cosmologically and emphasizes non-action (wu wei)
  rather than structured practice.


  **Upaniṣads (e.g., Kaṭha Upaniṣad, on nāḍī and prāṇa):** Both texts posit an invisible energetic anatomy
  (nāḍī, chakra, prāṇa) that underlies physical embodiment and can be refined through discipline. Divergence:
  The Upaniṣads emphasize knowledge (jñāna) and meditation on Brahman; the Haṭha Yoga Pradīpikā foregrounds
  somatic technique (āsana, prāṇāyāma) as the primary means.


  **Heraclitus, Fragment 67 (opposites as unity):** Both suggest that apparent opposites—sun and moon,
  hot and cold—are not enemies but complementary forces necessary to a coherent whole. Divergence: Heraclitus
  speaks of cosmic flux and logos; the Haṭha Yoga Pradīpikā offers a practical somatic map and method
  for harmonizing opposites within the individual body.'
