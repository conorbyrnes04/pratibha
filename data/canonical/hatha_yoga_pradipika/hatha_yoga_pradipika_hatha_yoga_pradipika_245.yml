translation: Above the navel and below the palate respectively, are the Surya and the Chandra. The exercise,
  called the Viparita Karani, is learnt from the guru's instructions.
abhyasa: Sit quietly and bring gentle awareness to the space below your palate and the space above your
  navel. Do not strain or visualize forcefully; simply notice the quality of attention and warmth in each
  region. Observe whether one feels cooler, warmer, or more active than the other. This simple noticing
  honors the text's claim that these are real loci of energy, worthy of contemplation.
practice: Sit quietly and bring gentle awareness to the space below your palate and the space above your
