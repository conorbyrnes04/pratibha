title: If there be excess of fat or phlegm
unit_type: verse
commentary: 'This verse establishes a foundational principle of haṭha yoga: practice must be adapted to
  the individual body''s actual condition, not applied uniformly to all. The text recognizes that excess
  fat or phlegm (kapha in Ayurvedic terms) creates specific obstructions to prāṇa flow, and prescribes
  the six kriyas as a preparatory purification. For those without such imbalances, these intensive cleansing
  practices are unnecessary—a pragmatic acknowledgment that yoga is not one-size-fits-all, but responsive
  to embodied reality.



  Key Terms



  **kriyas** — Cleansing or purificatory actions; in haṭha yoga, six techniques (neti, dhauti, nauli,
  basti, kapālabhāti, trāṭaka) designed to remove excess humors and prepare the body for prāṇāyāma

  **kapha** — In Ayurvedic physiology, the dosha (constitutional quality) of heaviness, coolness, and
  lubrication; excess kapha manifests as fat, phlegm, and sluggishness



  Cross-Tradition Resonances



  **Hippocratic Corpus (ancient Greek medicine):** Both traditions recognize that treatment must match
  the patient''s humoral or constitutional state; one size does not fit all. Divergence: The Haṭha Yoga
  Pradīpikā frames this within a spiritual ladder to samādhi, whereas Greek medicine aims at health and
  balance as ends in themselves.


  **Aristotle, *Nicomachean Ethics* (on phronesis / practical wisdom):** Both emphasize discernment and
  adaptation to particular circumstances rather than rigid rule-following. Divergence: Aristotle''s phronesis
  concerns ethical action in society; the Pradīpikā applies discernment to the body''s energetic readiness
  for yoga.'
