translation: If there be excess of fat or phlegm in the body, the six kinds of kriyas (duties) should
  be performed first. But others, not suffering from the excess of these, should not perform them.
abhyasa: 'Today, observe your body without judgment: do you experience heaviness, sluggishness, or congestion?
  Rather than forcing a standard practice, ask what your body actually needs. If you feel clear and light,
  move toward breath and meditation. If you feel dense or blocked, consider gentler movement or simply
  note this as information for a qualified teacher.'
