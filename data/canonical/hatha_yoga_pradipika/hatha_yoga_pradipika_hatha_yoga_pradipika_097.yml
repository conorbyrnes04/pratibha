title: By practicing Basti with water, the Dhatus, the…
unit_type: verse
commentary: 'This verse presents Basti—a cleansing practice using water—as a foundational tool for settling
  the entire system: the bodily tissues (Dhatus), the sense organs (Indriyas), and the mind itself. The
  passage reflects haṭha yoga''s understanding that physical purification and energetic regulation are
  inseparable from mental clarity; the promise of radiance, vitality, and the dissolution of ailments
  suggests that obstruction—physical, sensory, or mental—is the root of disorder.



  Key Terms



  **Basti** — A cleansing practice (kriyā) traditionally performed with water; in the Haṭha Yoga Pradīpikā,
  one of the preliminary purifications meant to prepare the body and mind for prāṇāyāma and meditation.

  **Dhatus** — The seven bodily tissues (plasma, blood, muscle, fat, bone, marrow, reproductive fluid)
  whose balance and vitality are foundational to health in yogic and Āyurvedic understanding.

  **Indriyas** — The sense organs and their associated faculties of perception; their steadiness is understood
  as essential to mental stability and spiritual practice.



  Cross-Tradition Resonances



  **Yoga Sūtras 1.12 (Patañjali): ''abhyāsa vairāgyābhyāṁ tannirodhah'' (practice and non-attachment bring
  stillness of the mind):** Both texts posit that systematic practice (here, Basti; there, meditation)
  calms mental fluctuation and brings order to the whole being. Divergence: The Yoga Sūtras emphasize
  mental discipline and renunciation; the Haṭha Yoga Pradīpikā begins with the body and its purification
  as the gateway.


  **Hippocratic medicine (ancient Greek): the doctrine of bodily humors and purification through cleansing:**
  Both traditions recognize that physical obstruction and imbalance manifest as disorder across body,
  sensation, and mood, and that cleansing restores wholeness. Divergence: Hippocratic theory locates health
  in humoral balance; haṭha yoga locates it in the flow of prāṇa (vital energy) through channels and the
  clarity of the Dhatus.


  **Ecclesiastes 3:11 (Hebrew Bible): ''He has made everything beautiful in its time'':** Both suggest
  an underlying order and radiance (glow) that emerges when disorder is removed and things return to their
  proper nature. Divergence: Ecclesiastes speaks of divine timing and acceptance; the Haṭha Yoga Pradīpikā
  offers a practical method to actively restore that order through technique.'
