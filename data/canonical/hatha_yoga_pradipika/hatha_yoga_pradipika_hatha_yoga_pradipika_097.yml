  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: By practicing Basti with water, the Dhatus, the Indriyas and the mind become calm. It gives
  glow and tone to the body and increases the appetite. All the disorders disappear.
abhyasa: 'Today, observe one moment when your mind, senses, or body feel agitated or sluggish. Notice:
  are they connected? Without performing Basti (which requires proper instruction), simply reflect on
  how a single act of intentional cleansing or settling—a glass of water, a few conscious breaths, a brief
  pause—might calm all three simultaneously.'
