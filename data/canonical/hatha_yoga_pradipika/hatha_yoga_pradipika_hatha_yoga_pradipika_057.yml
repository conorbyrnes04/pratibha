title: The expert Yogis and Yoginis call this Goraksa âsana
unit_type: verse
commentary: 'This brief passage names a foundational seated posture—Gorakṣa āsana—and attributes to it
  a specific, practical benefit: the dissolution of fatigue. The naming after Gorakṣa (a legendary haṭha
  yoga master) suggests lineage and authority; the emphasis on expert practitioners (''Yogis and Yoginis'')
  grounds the claim in lived experience rather than theory. The passage exemplifies the Pradīpikā''s method:
  each āsana is presented as a tool with a measurable effect, part of the systematic preparation of the
  body for deeper states.



  Key Terms



  **āsana** — A seated or bodily position; in haṭha yoga, a stable, comfortable posture used as a foundation
  for breath work and meditation.

  **Gorakṣa** — A legendary haṭha yoga master and founder-figure of the Nāth tradition; invoked here as
  the namesake of a specific āsana, conferring lineage authority.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'' (the posture should be steady and comfortable):**
  Both texts treat āsana as foundational and insist on ease; both see posture as preparation for higher
  states. Divergence: Patañjali emphasizes the dual quality (steadiness and ease); the Pradīpikā passage
  focuses on a specific therapeutic outcome (fatigue relief).


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both traditions value embodied, practical knowledge transmitted
  through lineage rather than abstract doctrine. Divergence: The Pradīpikā names its practices explicitly
  and claims direct effects; the Tao Te Ching resists naming and emphasizes paradox.'
