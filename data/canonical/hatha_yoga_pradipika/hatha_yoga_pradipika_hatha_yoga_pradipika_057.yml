translation: The expert Yogis and Yoginis call this Goraksa âsana. By sitting with this âsana, the Yogi
  or Yogini gets rid of fatigue.
abhyasa: 'Sit in a comfortable cross-legged or kneeling position today. Before moving on, pause and notice
  where fatigue lives in your body—shoulders, eyes, breath, mind. Sit quietly for 2–3 minutes, attending
  to how the simple act of settling into an intentional posture begins to shift that fatigue. This is
  not mastery, but an opening to the question the text poses: how does posture itself become medicine?'
