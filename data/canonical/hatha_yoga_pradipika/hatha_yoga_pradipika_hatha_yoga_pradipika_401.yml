translation: He or she who, though awake, appears like one sleeping, and is without inspiration and expiration,
  is certainly free.
abhyasa: 'Sit quietly for five minutes. Notice your natural breath without changing it. Observe the space
  between inhalation and exhalation—that tiny pause. Rest your attention there, in that stillness. Do
  not force or manipulate; simply witness. This mirrors the verse''s image: remaining alert and present
  while the breath grows quiet and the mind settles.'
