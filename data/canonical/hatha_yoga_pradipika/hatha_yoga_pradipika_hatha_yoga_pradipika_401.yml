unit_label: On Samādhi — 4.111
title: He or she who, though awake, appears like one…
unit_type: verse
commentary: 'This verse describes a paradoxical state of liberation achieved through mastery of breath
  and mind: the yogi remains outwardly composed and inwardly still, neither agitated by the world nor
  caught in the mechanical rhythms of ordinary respiration. The phrase ''appears like one sleeping'' suggests
  a withdrawal of reactive engagement, while ''without inspiration and expiration'' points to a subtle
  breath-control or transcendence of breath-dependency itself. Freedom here is not escape but a radical
  equanimity—awake yet unmoved, alive yet released from the compulsive patterns that bind ordinary consciousness.



  Key Terms



  **prāṇāyāma** — Regulation and extension of breath; foundational practice in haṭha yoga for controlling
  vital energy (prāṇa) and preparing the mind for meditation.

  **samādhi** — Absorption or unified consciousness; the final limb of yoga in which the meditator, object
  of meditation, and meditation merge into one undifferentiated state.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.56–57 (on the sage unmoved by opposites):** Both texts describe the liberated person
  as one who remains inwardly unshaken by external conditions—neither elated nor depressed. The Gītā emphasizes
  equanimity toward pleasure and pain; the Pradīpikā emphasizes stillness of breath and mind. Divergence:
  The Gītā grounds this freedom in wisdom and duty (dharma); the Pradīpikā locates it in the subtle mastery
  of prāṇa and the body''s energetic channels.


  **Tao Te Ching 15 (on the sage''s mysterious stillness):** Both describe the sage as one who appears
  ordinary or asleep to the world, yet possesses deep inner clarity. Both prize non-action and non-forcing
  as paths to freedom. Divergence: The Tao Te Ching emphasizes wu-wei (non-action) as alignment with the
  Tao''s natural flow; the Pradīpikā emphasizes disciplined prāṇāyāma and bodily practice as the means
  to that stillness.


  **Upaniṣads (e.g., Kaivalya Upaniṣad, on liberation as self-knowledge):** Both traditions teach that
  true freedom (mokṣa/kaivalya) is an inner realization, not dependent on external circumstance, and that
  the breath and mind are keys to accessing it. Divergence: The Upaniṣads emphasize knowledge (jñāna)
  of Brahman as the direct path; the Pradīpikā presents haṭha yoga—embodied, systematic practice—as the
  preparatory ladder to that knowledge.'
