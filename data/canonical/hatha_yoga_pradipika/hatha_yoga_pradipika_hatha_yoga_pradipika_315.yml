translation: By the suspension of the one, therefore, comes the suspension of the other, and by the operations
  of the one are brought about the operations of the other. When they are present, the Idriyas (the senses)
  remain engaged in their proper functions, and when they become latent then there is moksa.
abhyasa: 'Today, observe one moment where your breath and mind are visibly linked: perhaps anxiety quickens
  your breath, or a deep exhale calms a racing thought. Rather than trying to change either, simply notice
  the reciprocal dance. This noticing itself is the beginning of the suspension the text describes.'
