  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: This middle Nadi becomes straight by steady practice of postures; Pranayama and Mudras of
  Yogis and Yoginis.
abhyasa: Today, sit quietly and notice your natural breath. Without forcing, observe whether your breathing
  feels more open on one side of your body than the other. This simple noticing honors the text's concern
  with the energy channels and invites you to sense, rather than conceptualize, what 'straightening' might
  mean in your own embodied experience.
