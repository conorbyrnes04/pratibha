translation: He or she should practice mudras properly, as instructed by his or her guru. Then sitting
  with Padmâsana, he or she should hear anahata nada attentively.
abhyasa: Sit comfortably today for five minutes in a quiet place. Without forcing anything, simply listen
  inward—not for a specific sound, but for the ambient hum or vibration that may arise in the space of
  your own awareness. Notice whether attention itself shifts when you listen rather than think.
practice: Sit comfortably today for five minutes in a quiet place. Without forcing anything, simply listen
  inward—not for a specific sound, but for the ambient hum or vibration that may arise in the space of
  your own awareness. Notice whether attention itself shifts when you listen rather than think.
