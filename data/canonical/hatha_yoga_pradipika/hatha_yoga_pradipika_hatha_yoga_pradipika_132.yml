title: He or she should practice mudras properly, as…
unit_type: verse
commentary: 'This passage distills the haṭha yoga path into two essential acts: disciplined practice under
  guidance, and meditative listening to the subtle sound (anahata nada) that arises in stillness. The
  progression—from mudra (energetic seal) to seated posture to inner listening—suggests that outer technique
  opens the door to direct, non-conceptual perception. The emphasis on guru instruction and attentive
  hearing marks this as a path of both method and receptivity.



  Key Terms



  **mudra** — An energetic seal or gesture (hand, body, or internal) that directs and contains prāṇa (life
  force) within specific channels; here, a foundational practice requiring proper transmission from a
  teacher.

  **Padmāsana** — The lotus posture; a seated position traditionally used for meditation and prāṇāyāma,
  said to stabilize the spine and support inward focus.

  **anahata nada** — The ''unstruck sound''—an inner, spontaneous vibration or tone perceived in deep
  meditation, independent of external sound; a marker of subtle energy activation.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize receptive listening and stillness as gateways to subtle perception:
  ''The ancient masters were profound and subtle... Who can wait quietly while the mud settles?'' Divergence:
  The Tao Te Ching emphasizes natural spontaneity and non-action (wu wei), whereas the Haṭha Yoga Pradīpikā
  prescribes deliberate technique and guru-guided discipline as the means to that receptivity.


  **Dhammapada, v. 376–377:** Both traditions teach that liberation arises through sustained, mindful
  practice under proper guidance: ''By effort, vigilance, discipline, and self-control, the wise one makes
  an island for himself.'' Divergence: The Dhammapada emphasizes ethical conduct and mental discipline
  as the foundation, while the Haṭha Yoga Pradīpikā locates the gateway in energetic and sonic phenomena
  of the body.


  **Meister Eckhart, ''Detachment'' sermons:** Both invite a shift from active thinking to receptive listening:
  ''The more we empty ourselves... the more we are filled''; the passage similarly moves from doing (mudra)
  to hearing (anahata nada). Divergence: Eckhart frames emptiness in terms of Christian surrender to divine
  grace, whereas the Haṭha Yoga Pradīpikā grounds it in embodied prāṇic circulation and the body''s own
  subtle resonance.'
