  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the body becomes lean, the face glows with delight, Anahata-nada manifests, and eyes are clear, the body
  is healthy, bindu under control, and appetite increases, then one should know that the Nadis are purified and success in
  Hatha Yoga is approaching.
abhyasa: 'Today, after a period of conscious breathing or gentle āsana, pause and notice: Is there a quality of lightness
  or clarity in your body? Do you perceive any internal sound or vibration in the heart region? Rather than forcing experience,
  simply observe what is present without judgment. This simple noticing cultivates the discernment the text invites.'
