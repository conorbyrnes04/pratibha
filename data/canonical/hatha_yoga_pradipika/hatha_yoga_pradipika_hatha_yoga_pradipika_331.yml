translation: One should not meditate on the Linga (i.e., Atman) in the day (i.e., while Surya or Pingala
  is working) or at night (when Ida is working), but should always contemplate after restraining both.
abhyasa: 'Sit comfortably today and simply notice: when do you feel most scattered or restless (Piṅgalā
  active)? When do you feel dull or withdrawn (Iḍā active)? Without forcing anything, observe these natural
  cycles in your own breath and attention. This noticing is the first step toward the ''restraining''
  the verse describes.'
