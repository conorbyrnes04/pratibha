translation: I am going to describe the procedure of the practice of Yoga, in order that Yogis and Yoginis
  may succeed. A wise man or woman or woulman should leave his or her bed in the Usa Kala (i.e., at the
  peep of dawn or 4 o'clock) in the morning.
abhyasa: Tomorrow morning, set an intention to wake at or near dawn. Before rising, sit quietly for a
  few breaths and notice the quality of the early morning—the stillness, the light, the body's state.
  This simple observation honors the text's recognition that certain times carry different energetic qualities
  for practice.
practice: Tomorrow morning, set an intention to wake at or near dawn. Before rising, sit quietly for a
