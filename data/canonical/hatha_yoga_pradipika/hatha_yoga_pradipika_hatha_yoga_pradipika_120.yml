unit_label: On Prāṇāyāma — 2.51
title: I am going to describe the procedure
unit_type: verse
commentary: 'Svātmārāma opens the Pradīpikā by establishing yoga as a disciplined practice requiring specific
  conditions—not a casual pursuit but one demanding intentional timing and commitment. The invocation
  of dawn (Uṣa Kāla) is not merely practical; it signals that yoga practice aligns with natural rhythms
  and the body''s own subtle receptivity at that hour. By addressing ''Yogis and Yoginis'' equally, the
  text establishes that yoga is available to all sincere practitioners regardless of gender, a significant
  inclusivity for a 15th-century manual.



  Key Terms



  **Uṣa Kāla** — The time of dawn or early morning (around 4 a.m.), considered an auspicious hour for
  yoga practice in the tradition.

  **Yoga** — As presented here, a systematic practice with procedures and disciplines, undertaken by practitioners
  (yogis and yoginis) to achieve specific results.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16–17 (on discipline and moderation):** Both texts emphasize that yoga requires regulated
  living—sleep, waking, and practice conducted with measure and intention, not excess. Divergence: The
  Gītā frames discipline within a broader ethical and devotional context (dharma, bhakti), while the Pradīpikā
  focuses on the technical procedures themselves.


  **Tao Te Ching 15 (on the sage''s early rising and attentiveness):** Both traditions recognize dawn
  as a time of heightened awareness and receptivity, when the practitioner can work most effectively with
  subtle energies. Divergence: The Tao Te Ching emphasizes spontaneous naturalness; the Pradīpikā prescribes
  specific procedural discipline.'
