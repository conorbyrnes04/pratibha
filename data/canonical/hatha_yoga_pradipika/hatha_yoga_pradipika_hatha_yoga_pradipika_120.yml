  body: I am going to describe the procedure of the practice of Yoga, in order that Yogis and Yoginis
    may succeed. A wise man or woman or woulman should leave his or her bed in the Usa Kala (i.e., at
    the peep of dawn or 4 o'clock) in the morning.
