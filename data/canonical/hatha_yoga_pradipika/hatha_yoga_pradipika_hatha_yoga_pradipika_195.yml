translation: The union of the Ida and Pingala is effected, in order to bring about immortality. When the
  air becomes as it were dead (by leaving its course through the Ida and the Pingala) (i.e., when it has
  been kept confined), then it should be expelled.
abhyasa: Sit quietly and observe your natural breath for one minute without changing it. Then, in a single
  slow cycle, inhale through one nostril, hold the breath gently for a count of four, and exhale through
  the other. Notice the quality of stillness in the held breath—neither forced nor slack. Repeat three
  times, then return to natural breathing. Reflect on what 'union' might mean in your own body's experience.
practice: Sit quietly and observe your natural breath for one minute without changing it. Then, in a single
