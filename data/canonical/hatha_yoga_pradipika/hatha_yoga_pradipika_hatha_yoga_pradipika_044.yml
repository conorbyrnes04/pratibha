translation: Success in one Siddhâsana alone becoming firmly established, one gets Unmani at once, and
  the three bonds (Bandhas) are accomplished of themselves.
abhyasa: 'Sit in a comfortable seated posture today. Rather than moving between many poses, choose one
  and return to it repeatedly over several days or weeks. Each time, notice the quality of your attention:
  Is the pose becoming more stable? Is your breath settling? What shifts in your mind when you stop seeking
  novelty and instead deepen into stillness?'
