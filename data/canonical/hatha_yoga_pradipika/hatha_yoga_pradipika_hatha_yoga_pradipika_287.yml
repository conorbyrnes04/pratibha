translation: All the practices relating to air should be performed with concentrated mind. A wise man
  or woman should not allow his or her mind to wander away.
abhyasa: Before any breathing practice today, sit quietly for one minute and notice where your attention
  actually rests—on sensation, sound, thought, or distraction. Then choose one conscious breath cycle
  and sustain full attention on the sensation of air moving. When the mind wanders (it will), gently return
  without judgment. This simple return is the practice.
