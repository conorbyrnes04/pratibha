title: All the practices relating to air should be…
unit_type: verse
commentary: 'This verse establishes a foundational principle: the efficacy of prāṇāyāma and breath-work
  depends entirely on mental steadiness, not mechanical repetition. Svātmārāma addresses both male and
  female practitioners equally, emphasizing that wisdom lies not in the complexity of technique but in
  the quality of attention brought to it. The warning against a wandering mind suggests that scattered
  practice is not merely ineffective but potentially counterproductive—the breath follows thought, and
  thought must be gathered.



  Key Terms



  **prāṇāyāma** — Regulation and extension of breath; literally ''expansion of life-force.'' In this passage,
  ''practices relating to air.''

  **concentrated mind** — Ekāgratā; single-pointed attention or focus, essential for the efficacy of breath-work
  and the path toward samādhi.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.26 (on meditation and mind-control):** Both texts insist that mental discipline is
  the prerequisite for any spiritual practice; the wandering mind is the primary obstacle. Divergence:
  The Gītā frames this within a broader ethical and devotional context, whereas Svātmārāma focuses specifically
  on the mechanics of breath and energy.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa and vairāgya):** Both emphasize that practice (abhyāsa) requires
  sustained, focused effort; the mind must be trained to remain steady. Divergence: Patañjali presents
  this as a philosophical principle of all yoga, while Svātmārāma grounds it in the specific physiology
  of breath-work.


  **Meister Eckhart, ''Detachment'' (on undivided attention):** Both traditions teach that spiritual work
  demands an undivided, present mind; fragmentation negates the work. Divergence: Eckhart emphasizes detachment
  from all content; Svātmārāma emphasizes concentration *on* the breath itself as the vehicle.'
