  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Salutation to Âdinātha (Siva) who expounded the knowledge of Hatha Yoga, which like a staircase
  leads the aspirant to the high pinnacled Rāja Yoga.
abhyasa: 'Today, before or during your practice, pause and ask: What am I ascending toward? Notice whether
  you approach your āsana or breath work as mere physical exercise, or as a deliberate step on a longer
  staircase. Let this reframe your intention—not perfecting the pose, but using it as a rung.'
