translation: Susumna (Sunya Padavi) becomes a main road for the passage of Prana, and the mind then becomes
  free from all connections (with its objects of enjoyments) and Death is then evaded.
abhyasa: Sit quietly and observe where your attention habitually goes—to sensation, memory, anticipation,
  desire. Without forcing, simply notice the pattern. Then, for a few breaths, imagine a luminous thread
  running vertically through the center of your body, from base to crown. Let your awareness rest there,
  neutral and open. Notice if the mind's usual restlessness softens. Return to ordinary awareness. This
  is not prāṇāyāma practice, but a contemplative glimpse of what 'central passage' might mean.
