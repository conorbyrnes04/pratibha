  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Place the head on the ground and the feet up into the sky, for a second only the first day,
  and increase this time daily.
abhyasa: 'If you have experience with inversions and clearance from a teacher: today, practice a supported
  headstand (using forearms and hands, or a wall) for only 10–15 seconds. Notice the shift in blood flow,
  breath, and mental clarity without strain. The point is not achievement but humble beginning—the daily
  increase Svātmārāma prescribes.'
