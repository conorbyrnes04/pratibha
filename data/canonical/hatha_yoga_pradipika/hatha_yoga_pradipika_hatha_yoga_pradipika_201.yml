  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Taking a sharp, smooth and clean instrument, of the shape of a cactus leaf, the frenulum of the tongue should
  be cut a little (as much as a hairs thickness), at a time.
abhyasa: Today, examine your own tongue's range of motion without any physical intervention. Notice where it naturally reaches,
  where it feels restricted, and how breath and throat sensation shift as you gently explore. This simple observation honors
  the text's attention to the tongue as a site of both physical and energetic significance.
