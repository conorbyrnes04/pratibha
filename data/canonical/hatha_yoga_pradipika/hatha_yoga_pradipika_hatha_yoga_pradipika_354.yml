translation: I will describe now the practice of anahata nada, as propounded by Goraksa Natha, for the
  benefit of those who are unable to understand the principles of knowledge -- a method, which is liked
  by the ignorant also.
abhyasa: Sit quietly in a comfortable upright posture. Close your ears gently with your thumbs or fingers,
  or simply listen inwardly without external sound. Notice any subtle vibrations, hums, or tones arising
  in the inner ear or head. Do not strain or imagine; simply attend with patient curiosity for 5–10 minutes.
  This is a first taste of listening to anahata nada—the 'sound that is not struck by two things'—without
  needing to understand its metaphysics.
