  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Conquering, then, the pleasures of the mind, ecstasy is spontaneously produced which is devoid
  of evils, pains, old age, disease, hunger and sleep.
abhyasa: Today, notice one moment when you pursue a mental pleasure (a thought, anticipation, or distraction).
  Pause. Instead of indulging or suppressing it, observe it with gentle non-engagement—as if watching
  a cloud pass. Note what arises in that small gap of non-pursuit. This is a microcosm of the 'conquering'
  the text describes.
