translation: Having assumed the Kukkuta-āsana, when one grasps his or her neck by crossing his or her
  hands behind his or her head, and lies in this posture with his or her back touching the ground, it
  becomes Uttāna Kurma-āsana, from its appearance like that of a tortoise
abhyasa: 'Sit upright and cross your hands behind your head as described. Notice the sensation of your
  spine lengthening or compressing, your chest opening or closing. Without forcing the full pose, simply
  observe how a small change in hand position alters your entire postural field. Reflect: what does it
  mean to *become* the shape you hold, even briefly?'
