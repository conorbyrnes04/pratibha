title: Having assumed the Kukkuta-āsana
unit_type: verse
commentary: 'This passage describes a single āsana through its physical form and the tortoise it resembles—a
  method of teaching posture by visual analogy rather than abstract instruction. The text moves from one
  position (Kukkuta, the rooster) to another (Uttāna Kurma, the supine tortoise) by a simple modification
  of hand and spine placement, suggesting that āsana practice builds through incremental, intelligible
  shifts in the body''s geometry. The naming after animals reflects a foundational principle in haṭha
  yoga: the body becomes a mirror of natural forms, and in holding these forms, the practitioner may access
  qualities associated with them.



  Key Terms



  **āsana** — A seated or postural position in yoga practice, traditionally understood as a stable, comfortable
  seat for meditation, but in haṭha yoga expanded to include many physical forms.

  **Kukkuta-āsana** — The rooster posture, from which the tortoise posture is derived by modification.

  **Uttāna Kurma-āsana** — The supine tortoise posture, named for its resemblance to a turtle lying on
  its back.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'' — the posture should be steady and comfortable.:**
  Both texts ground āsana in the body''s actual sensation and stability rather than mere form. Divergence:
  The Sūtra emphasizes the inner quality (steadiness and ease); this passage emphasizes outer resemblance
  and visual teaching, suggesting a more embodied, naturalistic approach.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both traditions teach through concrete, observable analogy (animal
  forms, natural images) rather than abstract principle. Divergence: The Haṭha text uses analogy to make
  practice *accessible* and teachable; the Tao Te Ching uses it to point toward what *cannot* be fully
  named.


  **Aristotle, *De Anima*: the soul is the form (morphe) of the body.:** Both suggest that form and essence
  are inseparable—by inhabiting a shape, something essential may be known. Divergence: Aristotle speaks
  of soul as the organizing principle of a living body; haṭha yoga suggests that *assuming* a form can
  awaken or align subtle energies within the practitioner.'
