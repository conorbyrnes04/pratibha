  body: Having assumed the Kukkuta-āsana, when one grasps his or her neck by crossing his or her hands
    behind his or her head, and lies in this posture with his or her back touching the ground, it becomes
    Uttāna Kurma-āsana, from its appearance like that of a tortoise
