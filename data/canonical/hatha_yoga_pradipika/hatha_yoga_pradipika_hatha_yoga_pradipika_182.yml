translation: Having practiced with the left nostril, it should be practiced with the right one; and, when
  the number on both sides becomes equal, then the mudra should be discontinued.
abhyasa: Today, sit quietly and observe which nostril feels more open or restricted. Without forcing,
  gently practice breathing longer through the more congested side, then balance it with the clearer side.
  Notice when the breath feels equally easy on both—that moment of equilibrium is the teaching.
practice: Today, sit quietly and observe which nostril feels more open or restricted. Without forcing,
  gently practice breathing longer through the more congested side, then balance it with the clearer side.
  Notice when the breath feels equally easy on both—that moment of equilibrium is the teaching.
