translation: He or she is not devoured by death, is not bound by his or her actions. The Yogi or Yogini
  who is engaged in Samadhi is overpowered by none.
abhyasa: 'Sit quietly for five minutes today. Notice one moment when you are fully absorbed in breath,
  sensation, or awareness—when the sense of ''I am doing'' dissolves into simple presence. Afterward,
  reflect: in that moment, did fear or regret have any hold? This glimpse is what the text calls samādhi''s
  freedom.'
