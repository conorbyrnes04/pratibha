unit_label: On Samādhi — 4.107
title: He or she is not devoured by death
unit_type: verse
commentary: 'This verse distills the soteriological promise of yoga: that absorption in samādhi (unified
  consciousness) liberates the practitioner from the twin forces that bind ordinary existence—mortality
  and karmic consequence. The passage does not claim immortality of the body, but rather freedom from
  the existential grip of death and action; the yogi or yogini who stabilizes in samādhi transcends the
  machinery of bondage itself. This is the fruit of the entire haṭha yoga path: not supernatural power,
  but radical non-subjection.



  Key Terms



  **Samādhi** — Absorption or unified consciousness; the culmination of yoga practice in which the individual
  mind merges with its object of meditation, transcending subject-object duality.

  **Yogi / Yogini** — A male or female practitioner of yoga; one engaged in systematic discipline to realize
  liberation.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts present yoga as freedom from the compulsion
  of action and its fruits; the Gītā emphasizes performing duty without attachment, while the Pradīpikā
  locates freedom in samādhi itself. Divergence: The Gītā grounds liberation in right action and surrender
  to the divine; the Pradīpikā emphasizes direct absorption of consciousness as the mechanism of release.


  **Patañjali''s Yoga Sūtra 1.2 (yoga is the cessation of mental fluctuations):** Both texts identify
  yoga with a stilling of ordinary mind-activity; both imply that this stillness is itself liberation.
  Divergence: The Sūtra is aphoristic and philosophical; the Pradīpikā is practical and embodied, grounding
  samādhi in breath, posture, and energy channels.


  **Upaniṣadic teaching (ātman = brahman; the self is not bound):** Both affirm that the true self is
  inherently free and untouched by death and karma; both point to direct realization as the means. Divergence:
  The Upaniṣads teach this through inquiry and knowledge; the Pradīpikā teaches it through systematic
  bodily and prāṇic discipline.'
