title: Having caught the toes of the foot with both
unit_type: verse
commentary: 'This verse describes Dhanurasana (Bow Pose) as a physical configuration: the body becomes
  an archer''s bow, with the feet drawn toward the ears and the hands grasping the toes. The image is
  precise and kinetic—not merely a static shape, but an action of ''drawing'' and ''catching,'' suggesting
  that the pose is an embodied metaphor for tension and resilience. In the context of haṭha yoga''s systematic
  progression, such āsanas are presented as preparatory disciplines that organize the body''s energy and
  attention, readying the practitioner for subtler work.



  Key Terms



  **Dhanurasana** — The Bow Pose; a haṭha yoga āsana in which the practitioner lies prone, grasps the
  feet with the hands, and draws the chest and legs upward, creating the shape of a drawn bow.

  **āsana** — A steady, comfortable physical posture or seat; in haṭha yoga, one of the foundational practices
  through which the body is prepared and refined.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.48 (yoga as equanimity in action):** Both texts present a disciplined bodily practice
  as a means to inner steadiness; the bow-shape suggests the archer''s focused aim, echoing Krishna''s
  teaching of yoga as skill in action. Divergence: The Gītā emphasizes mental equanimity amid duty, while
  this verse focuses on the physical form itself as the primary vehicle of transformation.


  **Patañjali''s Yoga Sūtra 2.46 (āsana as ''sthira sukham''—steady and comfortable):** Both texts present
  āsana as a disciplined posture; Dhanurasana embodies the tension required to hold a stable form. Divergence:
  Patañjali defines āsana abstractly as a quality of mind-body integration, whereas this verse gives a
  concrete anatomical instruction.'
