translation: Having caught the toes of the foot with both hands and carried them to the ears by drawing
  the body like a bow, it becomes Dhanura âsana.
abhyasa: 'Sit or stand and visualize your body as a bow: feet as the curved ends, spine as the shaft,
  breath as the string. Without forcing, notice where you naturally hold tension and where you release.
  This contemplative image can inform how you approach any physical practice today—as an interplay of
  effort and ease rather than mere exertion.'
