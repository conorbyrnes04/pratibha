translation: By this means the Visnu knot (in the throat) is pierced which is indicated by highest pleasure
  experienced, and then the Bheri sound (like the beating of a kettle drum) is evolved in the vacuum in
  the throat.
abhyasa: During your next prāṇāyāma session, after establishing a steady rhythm, pause and listen inwardly
  to the subtle sounds arising in the throat and head—not straining, but noticing. If you encounter a
  quality of ease or unexpected pleasure in the throat region, do not dismiss it as distraction; note
  it as potential feedback from your practice. This attentiveness trains discrimination between mechanical
  breathing and genuine prāṇic movement.
