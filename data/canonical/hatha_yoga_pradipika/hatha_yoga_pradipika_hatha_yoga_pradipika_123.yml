abhyasa: Before your next practice session, pause and consciously name the place and time ('I practice
  here, now'). Make a simple internal vow—what is your sincere intention today? Bow or place your hands
  at heart center, acknowledging something greater than your individual effort. Notice how this shift
  in attitude changes the quality of your practice.
