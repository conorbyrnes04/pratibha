  body: 'Having extolled the place and the time and taking up the vow thus: ''To day by the grace of God,
    I will perform Pranayamas with âsanas for gaining samadhi (trance) and its fruits.'' He or she should
    salute the infinite Deva, Lord of the Nagas, to insure success in the âsanas (postures).'
