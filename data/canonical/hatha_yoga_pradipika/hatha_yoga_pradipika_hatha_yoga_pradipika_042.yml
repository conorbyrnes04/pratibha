title: By contemplating on oneself
unit_type: verse
commentary: 'This verse distills the haṭha yoga path into three interlocking disciplines: self-inquiry
  (contemplation), restraint in consumption, and sustained postural practice. The specificity of ''Siddhāsana
  for 12 years'' signals that yoga is not rapid transformation but patient embodiment—a long apprenticeship
  in which the body becomes the instrument of self-knowledge. ''Success'' (siddhi) here likely means not
  supernatural power but the stable, integrated state from which higher yoga (rāja yoga) becomes possible.



  Key Terms



  **Siddhāsana** — A seated posture (literally ''perfection pose'') in which one heel presses the perineum
  and the other leg extends; traditionally considered auspicious for meditation and prāṇāyāma practice.

  **siddhi** — Perfection, accomplishment, or success; in yoga, often refers to both the attainment of
  stable meditative states and, in later texts, supernatural abilities—here likely the former.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16–17 (on yoga as moderation):** Both texts emphasize measured eating and disciplined
  practice as the foundation of yoga; the Gītā similarly warns against excess and deficiency. Divergence:
  The Gītā frames yoga within dharma and devotion to Kṛṣṇa, while the Pradīpikā presents it as a technical,
  embodied path independent of theistic commitment.


  **Aristotle, Nicomachean Ethics (on virtue through habituation):** Both suggest that excellence emerges
  through sustained, patient repetition over years—virtue and mastery are not sudden but cumulative. Divergence:
  Aristotle grounds virtue in rational deliberation and social context; the Pradīpikā locates it in the
  body''s subtle energies and inner contemplation.


  **Daoism, Zhuangzi (on wu wei and effortless action):** Both traditions suggest that true mastery involves
  a kind of non-forcing—the yogi''s ''success'' and the sage''s spontaneous action both emerge from long
  preparation that eventually dissolves into ease. Divergence: Daoism emphasizes naturalness and non-action
  from the outset; haṭha yoga prescribes rigorous, intentional discipline as the means to that ease.'
