translation: By contemplating on oneself, by eating sparingly, and by practicing Siddhâsana for 12 years,
  the Yogi or Yogini obtains success.
abhyasa: Today, sit quietly for a few minutes and observe one moment of eating or drinking with full attention—noticing
  texture, taste, and the impulse to consume. This simple act honors both the contemplative and restraint
  dimensions the verse names, grounding them in ordinary life.
