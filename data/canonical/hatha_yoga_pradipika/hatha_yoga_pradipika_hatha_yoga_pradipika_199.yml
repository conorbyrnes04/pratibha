title: The Kechari Mudra is accomplished by thrusting the tongue
unit_type: verse
commentary: 'This verse describes Kechari Mudra as a precise psychosomatic gesture: the tongue is inverted
  and drawn inward toward the throat, while attention is held at the center point between the eyebrows.
  The mudra is not merely physical but integrates tongue, throat, and inner gaze into a unified focal
  practice. In the Pradīpikā''s framework, such mudras are tools for gathering and directing the subtle
  currents (nāḍī and prāṇa) that ordinarily disperse outward, thereby supporting the ascent toward higher
  states of absorption.



  Key Terms



  **Kechari Mudra** — A seal or gesture in which the tongue is turned inward and the gaze is fixed at
  the center; traditionally understood as a means to direct prāṇa and support meditative absorption.

  **mudra** — A symbolic gesture or seal of the body and energy; in haṭha yoga, mudras combine physical
  position, breath, and attention to channel subtle forces.

  **gullet** — The throat or upper esophagus; the passage through which the inverted tongue is directed
  in this practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 3.2 (Patañjali): ''tatra pratyaya-ekatānatā dhyānam'' (meditation is the continuous flow
  of attention toward one object):** Both texts emphasize unified, sustained attention as central to yoga
  practice; Kechari Mudra embodies this principle through the convergence of tongue, throat, and gaze.
  Divergence: Patañjali''s sūtra is epistemological (about the nature of attention itself), while the
  Pradīpikā verse is technical and embodied, prescribing a specific physical method.


  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.3.12): the self is ''smaller than small, larger than large,'' found
  in the heart-cave:** Both traditions locate realization in an inner, subtle center; Kechari Mudra''s
  ''middle'' gaze suggests an inward turn toward that hidden seat. Divergence: The Upaniṣads speak of
  the self as transcendent principle; the Pradīpikā treats the mudra as a practical instrument for energy
  work, not metaphysical doctrine.'
