commentary: 'This verse addresses the material foundation of practice: the yogi''s body must be nourished deliberately and
  generously to support the rigorous work of prāṇāyāma and āsana. Rather than prescribing asceticism, Svātmārāma insists that
  strength-giving foods—rich, sweet, and grounding—are not obstacles to yoga but necessities. The phrase ''according to his
  or her desire'' grants the practitioner agency, suggesting that yoga attends to individual constitution and need, not a
  one-size doctrine.



  Key Terms



  **tonics (rasāyana)** — Substances or foods that build strength, vitality, and resilience in the body; in classical yoga,
  essential support for sustained practice.

  **humors (dhātu)** — In Ayurvedic anatomy (foundational to haṭha yoga), the body''s constituent tissues and qualities; nourishment
  aims to balance and strengthen them.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16 (on yoga and moderation in eating):** Both texts ground yoga in embodied life: the Gītā teaches that
  yoga is ''not for one who eats too much or too little''; Svātmārāma affirms that eating well is part of the path. Divergence:
  The Gītā emphasizes restraint and balance; Svātmārāma explicitly endorses richness and sweetness, suggesting haṭha yoga''s
  particular demand for robust physical fuel.


  **Taoist dietary alchemy (e.g., Secret of the Golden Flower):** Both traditions view food as subtle energy (prāṇa / qì)
  and the body as a vessel requiring intentional nourishment for inner work. Divergence: Taoist texts often emphasize rare
  or alchemically prepared substances; Svātmārāma names ordinary foods (milk, ghee, butter), grounding practice in accessible
  life.'
