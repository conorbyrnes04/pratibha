  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: A yogi or yogini should eat tonics (things giving strength), well sweetened, greasy (made with ghee), milk butter,
  etc., which may increase humors of the body, according to his or her desire.
abhyasa: 'Today, notice one meal or snack you consume. Before eating, pause and ask: Does this nourish my body for the work
  I am doing? Am I eating with intention, or habit? Svātmārāma invites you to eat deliberately—not ascetically, but wisely—as
  part of your practice.'
