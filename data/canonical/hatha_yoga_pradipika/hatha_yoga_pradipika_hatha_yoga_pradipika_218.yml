abhyasa: 'Sit quietly and visualize the three channels (ida, pingala, susumna) running along your spine.
  Without forcing any physical practice, simply contemplate: Where does my vital energy naturally flow?
  What would it mean to redirect it upward rather than allow it to dissipate? Rest in this inquiry for
  5–10 minutes, noticing any shifts in your sense of internal space or energy.'
