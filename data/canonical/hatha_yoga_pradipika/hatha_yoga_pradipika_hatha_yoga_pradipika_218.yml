  body: On the top of the Meru (vertabral column), concealed in a hole, is the Somarasa (nectar of Chandra);
    the wise, whose intellect is not over-powered by Raja and Tamas gunas, but in whom Satwa guna is predominant,
    say there is the (universal spirit) atma in it. It is the source of the down-going Ida, Pingala and
    Susumna Nadis, which are the Ganges, the Yamuna and the Sarasvati. From that Chandra is shed the essence
    of the body which causes death of men. It should, therefore, be stopped from shedding. This (Khechari
    Mudra) is a very good instrument for this purpose. There is no other means of achieving this end.
