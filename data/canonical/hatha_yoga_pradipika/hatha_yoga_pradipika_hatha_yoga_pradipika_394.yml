  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: All the accumulations of sins are destroyed by practicing always with the nada; and the mind
  and the airs do certainly become latent in the colorless (Paramatmana).
abhyasa: Today, in a quiet moment, sit upright and listen inwardly for any subtle sound, vibration, or
  hum—whether actual or imagined. Do not strain; simply rest attention there for 5–10 minutes. Notice
  if the mind grows quieter as you listen. This is a preliminary approach to *nāda* yoga as described
  in the text.
