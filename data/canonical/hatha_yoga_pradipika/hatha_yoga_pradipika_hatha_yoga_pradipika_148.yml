title: This Sitali Kumbhaka cures colic
unit_type: verse
commentary: 'This verse presents a single prāṇāyāma technique (Sitali Kumbhaka—cooling breath with retention)
  as a therapeutic agent addressing a specific range of physical ailments. The passage reflects haṭha
  yoga''s pragmatic orientation: breath work is not merely contemplative but acts directly on the body''s
  humoral and energetic systems. The enumeration of conditions—from digestive (colic, spleen) to metabolic
  (hunger, thirst) to acute (fever, poison)—suggests the text views prāṇāyāma as a precise tool, each
  technique matched to particular imbalances.



  Key Terms



  **Sitali Kumbhaka** — A cooling prāṇāyāma (breath practice) involving inhalation through a rolled tongue
  and retention of breath; kumbhaka means ''pot'' or ''retention.''

  **prāṇāyāma** — Regulation and extension of prāṇa (life-force) through controlled breathing; a foundational
  limb of haṭha yoga.



  Cross-Tradition Resonances



  **Hippocratic Corpus (On Airs, Waters, Places):** Both texts link environmental and physiological factors
  (breath, temperature, humors) to health and disease, treating the body as a responsive system. Divergence:
  The Hippocratic texts emphasize external climate and diet; the Pradīpikā locates therapeutic agency
  in the practitioner''s own breath control.


  **Charaka Samhita (Ayurvedic medical text):** Both enumerate specific diseases (colic, fever, bile disorders)
  and propose targeted interventions, grounding practice in observable pathology. Divergence: Charaka
  prescribes herbs and diet; the Pradīpikā prescribes internal breath work as the primary remedy.'
