  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: This Sitali Kumbhaka cures colic, (enlarged) spleen, fever, disorders of bile, hunger, thirst,
  and counteracts poisons.
abhyasa: 'Today, sit quietly and observe your natural breath for one minute. Then, if you have learned
  Sitali Kumbhaka from a qualified teacher, practice it for a few cycles and notice any shift in your
  body''s temperature or digestive ease. If unfamiliar with the technique, simply reflect: what physical
  complaint or imbalance calls to you, and how might breath itself be a first medicine?'
