translation: When Pranayama is performed after getting rid of obesity born of the defects of phlegm, by
  the performance of the six duties, it easily brings success.
abhyasa: 'Today, before any breath work, notice: Do you feel heaviness, sluggishness, or congestion in
  your body or mind? Rather than forcing pranayama, spend five minutes with gentle movement, warm water,
  or light stretching to kindle internal warmth and clarity. Observe how a prepared vessel receives practice
  differently than a congested one.'
