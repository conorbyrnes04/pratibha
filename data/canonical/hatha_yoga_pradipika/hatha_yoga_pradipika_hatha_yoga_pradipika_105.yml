unit_label: On Prāṇāyāma — 2.36
title: When Pranayama is performed after getting rid of…
unit_type: verse
commentary: 'This verse establishes a prerequisite condition for effective prāṇāyāma: the body must first
  be purified and lightened of excess phlegm (kapha), one of the three humors in yogic physiology. The
  ''six duties'' (ṣaṭ-karma) are preparatory cleansing practices that remove internal obstructions—both
  physical and energetic. Only when this foundation is laid does prāṇāyāma (breath regulation) yield its
  fruit ''easily,'' suggesting that forcing the practice without preparation creates resistance. The passage
  reflects a gradualist, body-honoring approach: mastery comes not from willpower alone, but from systematic
  removal of obstacles.



  Key Terms



  **Prāṇāyāma** — Regulation and extension of the breath; a foundational yogic practice for directing
  vital energy (prāṇa) and preparing the mind for meditation.

  **Ṣaṭ-karma (six duties)** — Six purificatory practices (neti, dhauti, nauli, basti, kapālabhāti, trataka)
  that cleanse the body and energy channels before advanced prāṇāyāma.

  **Kapha (phlegm)** — One of the three humors in yogic and Āyurvedic physiology, associated with heaviness,
  moisture, and inertia; excess kapha obstructs prāṇa flow.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both
  texts honor a preparatory emptying—clearing obstacles before the real work begins; mastery emerges from
  alignment with natural process, not force. Divergence: The Tao Te Ching emphasizes non-action and spontaneity;
  the Haṭha Yoga Pradīpikā prescribes specific, methodical practices—active purification precedes receptivity.


  **Aristotle, Nicomachean Ethics: ''We are what we repeatedly do. Excellence, then, is not an act, but
  a habit.'':** Both recognize that success requires removing obstacles and establishing proper conditions;
  the body and mind must be trained through disciplined practice. Divergence: Aristotle focuses on virtue
  and habit formation through ethical choice; the Haṭha Yoga Pradīpikā locates the obstacle in the physical
  body''s humoral imbalance, requiring somatic purification.


  **Dhammapada, v. 183: ''The path to the Deathless is mindfulness; heedlessness is the path to death.'':**
  Both texts present a sequential path: first remove what obscures (phlegm, heedlessness), then the true
  practice becomes effective and ''easy.'' Divergence: The Dhammapada emphasizes mental vigilance and
  ethical conduct; the Haṭha Yoga Pradīpikā locates the primary work in the body''s physiology and energetic
  channels.'
