  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: These three are the great secrets. They are the destroyers of old age and death, increase
  the appetite, confer the accomplishments of Anima, etc.
abhyasa: Sit quietly for five minutes today and observe your breath without controlling it. Notice where
  it moves, its rhythm, its quality. This simple witnessing is the threshold of prāṇāyāma—the recognition
  that breath is not merely air, but the vehicle of vital force. Return to this observation whenever you
  remember.
