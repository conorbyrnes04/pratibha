unit_label: On Mudrās — 3.29
title: These three are the great secrets
unit_type: verse
commentary: 'This verse distills the promise of haṭha yoga''s core practices into their transformative
  fruit: the reversal of decay, vitality, and access to subtle powers (siddhis). The passage does not
  name the ''three'' explicitly here, but in context refers to the foundational techniques—likely āsana,
  prāṇāyāma, and mudrā—presented as ''secrets'' because their efficacy depends on precise transmission
  and sincere practice. The claim is radical: these are not merely physical disciplines but gateways to
  both longevity and the extraordinary capacities traditionally attributed to advanced yogins.



  Key Terms



  **siddhis (accomplishments)** — Extraordinary powers or attainments said to arise from yogic practice,
  including anima (the ability to become infinitesimally small) and others; understood here as natural
  fruits of mastery over prāṇa (vital energy) rather than supernatural gifts.

  **prāṇa** — Vital life-force or breath-energy that animates the body and mind; the primary object of
  regulation in haṭha yoga.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both
  texts present yogic/Taoist mastery as a reversal of ordinary decay and a gateway to subtle perception
  and power. Divergence: The Tao Te Ching emphasizes wu-wei (non-action) and paradox; the Haṭha Yoga Pradīpikā
  is explicit about disciplined technique and systematic practice.


  **Patañjali''s Yoga Sūtra, III.45: ''From mastery of the senses comes supreme subtlety.'':** Both texts
  link yogic discipline to the emergence of refined capacities and freedom from ordinary limitation. Divergence:
  Patañjali frames siddhis as potential distractions from liberation; the Pradīpikā presents them as natural
  confirmations of practice.


  **Ecclesiastes 12:1: ''Remember your Creator in the days of your youth, before the days of trouble come.'':**
  Both texts address the inevitability of aging and decay, and the value of practice undertaken early.
  Divergence: Ecclesiastes counsels remembrance and piety; the Pradīpikā offers a somatic technology claimed
  to arrest decay itself.'
