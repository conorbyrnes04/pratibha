title: The mind, like an elephant habituated to wander in…
unit_type: verse
commentary: 'This verse uses the familiar image of an untamed elephant to describe the mind''s tendency
  toward distraction and sensory indulgence. The ''sharp goad'' (a tool for directing elephants) is identified
  as anahata nada—the unstruck or inner sound—suggesting that subtle sonic vibration, rather than force
  or suppression, is the precise instrument for redirecting mental wandering. The passage implies that
  control arises not through violence but through attentiveness to a refined inner phenomenon, positioning
  sound as a bridge between gross distraction and subtle discipline.



  Key Terms



  **anahata nada** — Literally ''unstruck sound''—the inner, soundless sound or subtle vibration perceived
  in meditation, traditionally located at the heart center; used as a focus for concentration and refinement
  of consciousness.

  **haṭha** — Union of sun (ha) and moon (tha) energies; the physical and energetic practices that prepare
  the body-mind for higher states of yoga.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.26 (on the restless mind):** Both texts acknowledge the mind''s natural tendency to
  wander and the need for a specific method to steady it. The Gītā emphasizes practice and detachment;
  the Pradīpikā locates the tool in inner sound. Divergence: The Gītā frames control through ethical discipline
  and devotion; the Pradīpikā grounds it in a psycho-acoustic phenomenon accessible through direct perception.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa and vairāgya—practice and non-attachment):** Both traditions
  teach that the mind requires both steady practice and a refined object of focus to achieve stability.
  The ''goad'' here is a form of abhyāsa (disciplined practice). Divergence: Patañjali emphasizes the
  dual path of effort and letting-go; the Pradīpikā emphasizes a specific sensory-subtle technique as
  the primary instrument.


  **Heraclitus: ''The path up and down are one and the same'':** Both suggest that apparent opposites—wandering
  and control, outer sound and inner silence—are unified through a single principle of attention and transformation.
  Divergence: Heraclitus speaks of cosmic flux and paradox; the Pradīpikā offers a practical yogic method
  rooted in the body-breath-mind nexus.'
