translation: The mind, like an elephant habituated to wander in the garden of enjoyments, is capable of
  being controlled by the sharp goad of anahata nada.
abhyasa: 'Sit quietly for five minutes and listen inwardly for any subtle sound or vibration—a hum, a
  high-pitched tone, or a quality of silence itself. Do not strain; simply notice what arises in the space
  between thought and sensation. This is an introductory approach to the principle the text names: using
  inner listening as a gentle anchor for attention.'
