translation: The perspiration exuding from exertion of practice should be rubbed into the body (and not
  wiped), as by so doing the body becomes strong.
abhyasa: 'During or after physical practice today, notice any perspiration. Rather than immediately wiping
  it away, pause and consciously rub a small amount back into your skin—perhaps your forearms or shoulders.
  Observe what this gesture does to your sense of the body: does it shift your relationship to effort,
  to the body''s natural responses, or to the boundary between ''self'' and ''exertion''?'
