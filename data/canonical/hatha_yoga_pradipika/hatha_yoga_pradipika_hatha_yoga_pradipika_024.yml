title: Placing the right ankle on the left side
unit_type: verse
commentary: 'This verse describes a specific seated posture (āsana) called Kurma-āsana, the Tortoise Pose,
  by naming the precise placement of the ankles relative to the perineum. The naming itself—*kurma* meaning
  tortoise—suggests the inward-turning, protective quality of the pose: like a tortoise withdrawing into
  its shell, the practitioner folds inward. The verse establishes that āsana is not merely physical positioning
  but a named, transmitted knowledge shared among the community of yogis and yoginis, grounding practice
  in lineage and precision.



  Key Terms



  **āsana** — A steady, comfortable seated or postural position; in haṭha yoga, the physical foundation
  for breath work and meditation.

  **Kurma-āsana** — The Tortoise Pose; a specific āsana in which the ankles are crossed at the perineum,
  creating an inward-folding shape.



  Cross-Tradition Resonances



  **Yoga Sūtras of Patañjali, II.46: *sthira-sukham āsanam*:** Both texts treat āsana as a foundational
  practice—Patañjali emphasizes steadiness and ease (*sthira-sukha*), while the Pradīpikā specifies the
  anatomical precision needed to embody that quality. Divergence: Patañjali speaks of āsana philosophically
  and functionally; the Pradīpikā is concrete and technical, naming particular poses.


  **Tao Te Ching, 15: *The ancient masters were profound and subtle... because they were subtle, they
  can only be described with difficulty.*:** Both traditions suggest that true knowledge is transmitted
  through precise, embodied practice rather than abstract explanation; the tortoise''s withdrawal mirrors
  the Taoist principle of wu wei (non-forcing action). Divergence: The Pradīpikā gives explicit anatomical
  instruction, while Lao Tzu points toward the limits of language itself.'
