translation: Placing the right ankle on the left side of the anus, and the left ankle on the right side
  of it, makes what the Yogis and Yoginis call Kurma-âsana.
abhyasa: Sit comfortably and notice the quality of *inwardness* in your own seated posture. Without forcing
  any specific shape, observe where your body naturally turns attention inward—toward the spine, the breath,
  the center. This simple noticing honors the principle that āsana is a meeting place between body and
  awareness.
