  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: To remedy this, the opening of the Surya is avoided by excellent means. It is to be learnt
  best by instructions from a guru; but not by even a million discussions.
abhyasa: Today, notice one thing you have tried to learn only through reading, video, or discussion without
  direct guidance. Reflect honestly on what remains unclear or uncertain in your body or practice. Consider
  what it might mean to seek a qualified teacher for one thing you genuinely wish to understand.
