title: Those whose sleep has decreased by practice and…
unit_type: verse
commentary: 'This verse describes a threshold condition: the yogi whose ordinary sleep naturally diminishes through sustained
  practice, and whose mind settles into samādhi (absorption), becomes capable of receiving the fruits of mudrā—specifically
  Śāmbhavī and others. The passage suggests that mudrā is not merely a technique applied to an unprepared mind, but rather
  a ripening of inner conditions. The ''beneficial accomplishments'' (siddhis) flow not from the mudrā alone, but from the
  convergence of reduced sleep, mental calm, and the mudrā itself.



  Key Terms



  **samādhi** — Absorption or meditative union; a state of mind unified and stilled, often described as the culmination of
  yogic practice.

  **mudrā** — A seal or gesture; in haṭha yoga, typically a physical posture or energetic lock believed to direct and contain
  vital force (prāṇa).

  **Śāmbhavī** — A specific mudrā mentioned by name; traditionally associated with gazing at the eyebrow center or inner light.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12–1.14 (Patañjali): ''abhyāsa vairāgyābhyāṁ tannirodhah'' (practice and non-attachment arrest mental fluctuation):**
  Both texts emphasize that inner accomplishment arises from sustained practice creating a prepared ground, not from technique
  alone. Divergence: The Yoga Sūtra stresses the dual path of practice and detachment; the Pradīpikā verse emphasizes the
  body-based sign (decreased sleep) as evidence of readiness.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... Because they were subtle, they must be described with
  difficulty.'':** Both suggest that true accomplishment emerges quietly, through alignment with natural processes rather
  than force or display. Divergence: The Pradīpikā names specific practices and results (mudrā, siddhis); the Tao Te Ching
  deliberately resists naming and technique.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both point to a reciprocal
  readiness: the practitioner''s inner condition and the grace or fruit of practice meeting as one. Divergence: Eckhart emphasizes
  divine reciprocity and union; the Pradīpikā remains focused on the yogi''s disciplined preparation and the mudrā''s mechanical
  efficacy.'
