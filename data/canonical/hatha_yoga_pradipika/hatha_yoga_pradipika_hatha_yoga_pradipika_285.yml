  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Those whose sleep has decreased by practice and mind has become calm by samadhi, get beneficial accomplishments
  by Sambhavi and other Mudras.
abhyasa: 'Observe today: when your mind is most settled (perhaps after meditation or a period of focused work), notice the
  quality of your attention. Without forcing sleep or practice, simply note whether your ordinary restlessness has genuinely
  quieted. This noticing itself is the practice—recognizing the conditions within you, rather than chasing technique.'
