title: Then rock salt and yellow myrobalan (both powdered)…
unit_type: verse
commentary: 'This cryptic instruction appears to describe a preparatory or purificatory treatment, likely of the nāḍī (energy
  channels) or the physical body itself, using common Ayurvedic substances. The precise, measured repetition—powdering, rubbing,
  waiting seven days, cutting minutely—reflects haṭha yoga''s characteristic marriage of subtle practice with concrete, embodied
  technique. The passage assumes a student working under guidance through a graduated process, where even small adjustments
  matter.



  Key Terms



  **nāḍī** — In haṭha yoga, the subtle channels through which prāṇa (life force) flows; often understood as both energetic
  and physiological pathways requiring purification and balance



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize subtle, gradual refinement over dramatic transformation: ''The ancient masters
  were profound and subtle… patient as winter frost.'' Divergence: The Haṭha Yoga Pradīpikā grounds subtlety in precise bodily
  technique and material substance, whereas the Tao Te Ching emphasizes non-action and formlessness.


  **Dhammapada, v. 183:** Both honor disciplined, incremental practice: ''Drip by drip the water pot is filled; likewise the
  wise one gathers merit little by little.'' Divergence: The Dhammapada frames accumulation in ethical and karmic terms, while
  this passage works through physiological and energetic channels.'
