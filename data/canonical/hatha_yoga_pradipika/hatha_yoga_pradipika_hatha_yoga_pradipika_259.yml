translation: This is called Sahajoli, and should be relied on by Yogis and Yoginis. It does good and gives
  moksa.
abhyasa: 'Today, notice one moment where effort and ease arise together—in breath, movement, or attention.
  Rather than forcing or collapsing, observe how the two can coexist. This mirrors the spirit of sahajoli:
  the natural union of opposing forces.'
