unit_label: On Mudrās — 3.44
title: As fire is inseparably connected with the wood and…
unit_type: verse
commentary: 'This passage uses the inseparability of fire and wood, light and fuel, to illustrate an unbreakable
  bond between consciousness (ātman, ''soul'') and the body when the body is suffused with amṛta (''nectar''),
  the subtle secretion of Soma. The teaching suggests that through haṭha yoga practice—particularly the
  retention and refinement of vital fluids and energies—the practitioner anchors consciousness in the
  body not as imprisonment, but as a vehicle for immortality. The note clarifies that Soma is not merely
  metaphorical: it is located in the sahasrāra (thousand-petalled lotus at the crown) and its preservation,
  rather than its wasteful dissipation, is the key to transcending death.



  Key Terms



  **amṛta** — Nectar; the subtle, immortal essence secreted by Soma; its retention is said to confer freedom
  from death.

  **Soma** — The lunar principle located in the sahasrāra (thousand-petalled lotus in the brain); source
  of a vital secretion whose conservation is central to haṭha yoga practice.

  **ātman** — Soul or self; the consciousness that, when the body is full of nectar, remains inseparably
  bound to the body as its animating principle.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.3.3–4):** Both texts teach that the self (ātman) is the eternal
  witness indwelling the body, and that knowledge of this union transcends death. Divergence: The Upaniṣads
  emphasize knowledge (jñāna) and renunciation; the Haṭha Yoga Pradīpikā emphasizes embodied practice
  (kriyā) and the refinement of subtle physiology.


  **Tao Te Ching 10:** Both traditions teach that the preservation and circulation of vital essence (qi/prāṇa)
  within the body-mind is the path to wholeness and longevity. Divergence: The Taoist text speaks of returning
  to the uncarved block and non-action; the haṭha yoga text prescribes specific practices and bodily disciplines.


  **Meister Eckhart, ''God flows into a pure soul as oil flows into a hollow container'':** Both suggest
  an intimate, flowing union between the divine (or transcendent principle) and a prepared vessel—here,
  the body full of nectar. Divergence: Eckhart emphasizes surrender and emptiness; the Haṭha Yoga Pradīpikā
  emphasizes active cultivation and the gathering of vital force.'
