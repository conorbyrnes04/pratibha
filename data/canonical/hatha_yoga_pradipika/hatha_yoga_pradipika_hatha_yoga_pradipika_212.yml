  body: As fire is inseparably connected with the wood and light is connected with the wick and oil, so
    does the soul not leave the body full of nectar exuding from the Soma. (Note.--Soma (Chandra) is described
    later on located in the thousand-petalled lotus in the human brain, and is the same as is seen on
    Sivas' head in pictures, and from which a sort of juice exudes. It is the restraining of this exudation
    which makes one immortal.)
