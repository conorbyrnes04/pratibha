  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: As fire is inseparably connected with the wood and light is connected with the wick and oil,
  so does the soul not leave the body full of nectar exuding from the Soma. (Note.--Soma (Chandra) is
  described later on located in the thousand-petalled lotus in the human brain, and is the same as is
  seen on Sivas' head in pictures, and from which a sort of juice exudes. It is the restraining of this
  exudation which makes one immortal.)
abhyasa: Sit quietly and observe the natural rhythm of your breath at the crown of your head. Without
  forcing, notice any subtle sensation of coolness, moisture, or flow there. Simply witness this for five
  minutes, cultivating the sense that your awareness is not separate from the body's own luminous processes.
  This grounds the teaching that soul and body, when refined, are inseparable.
