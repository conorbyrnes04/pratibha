title: Indifference to worldly enjoyments is very difficult to obtain
unit_type: verse
commentary: 'Svātmārāma opens with a stark acknowledgment: the path to yoga requires three difficult turns—away
  from worldly attachment, toward direct knowledge of reality, and into samādhi (unified consciousness).
  None of these arises by accident or intellect alone; each depends on grace and the living presence of
  a qualified teacher. The passage establishes yoga not as technique but as transformation, and the guru
  not as information-giver but as the necessary catalyst.



  Key Terms



  **Samādhi** — A state of unified, absorbed consciousness in which the distinction between observer and
  observed dissolves; the goal of yoga practice.

  **guru** — A qualified spiritual teacher whose presence and guidance are understood as essential to
  genuine transformation, not merely intellectual transmission.

  **Realities** — Direct, experiential knowledge of the true nature of existence, beyond conceptual understanding.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.34:** Both texts insist the guru is indispensable: ''Know this by prostration, by
  inquiry, and by service; the wise who see the truth will teach you knowledge.'' The guru mediates between
  aspiration and realization. Divergence: The Gītā frames the guru within a devotional relationship to
  Krishna; the Haṭha Yoga Pradīpikā presents the guru as a structural necessity for any yoga practice,
  regardless of devotional orientation.


  **Dhammapada 21:** Both traditions teach that detachment from sensory craving is foundational: ''The
  wise one guards the doors of the senses, is moderate in eating, faithful and industrious.'' Indifference
  to worldly enjoyment is the threshold. Divergence: The Buddha emphasizes ethical discipline and mindfulness
  as the path; Svātmārāma points toward samādhi as the fruit, with the guru as its gate.


  **Meister Eckhart, ''Counsels on Discernment'':** Eckhart writes that union with God requires ''letting
  go of all creatures''—a resonance with the difficulty of indifference to worldly things as prerequisite
  for higher knowledge. Divergence: Eckhart locates this knowledge in direct divine encounter; Svātmārāma
  locates it in samādhi, a state cultivated through bodily and breath practices under a teacher''s guidance.'
