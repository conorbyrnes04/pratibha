translation: Indifference to worldly enjoyments is very difficult to obtain, and equally difficult is
  the knowledge of the Realities to obtain. It is very difficult to get the condition of Samadhi, without
  the favor of a true guru.
abhyasa: 'Today, notice one small attachment or distraction that pulls your attention from your breath
  or present moment. Name it without judgment. Then ask: what would it mean to be indifferent to this—not
  to reject it, but to see it clearly and choose what matters more? Sit with that question for five minutes.'
