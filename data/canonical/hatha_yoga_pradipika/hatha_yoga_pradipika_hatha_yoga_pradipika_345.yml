translation: One should become void in and void out, and void like a pot in the space. Full in and full
  outside, like a jar in the ocean.
abhyasa: 'Sit quietly for a few minutes. On the inhale, imagine yourself as an empty vessel—hollow, permeable,
  without resistance. On the exhale, sense that same emptiness extending outward into the space around
  you. Then reverse: feel yourself as full—saturated with breath, presence, or subtle energy—and sense
  that fullness continuous with the fullness of the space outside your skin, as if there were no real
  boundary. Return to the first image, then the second, several times. Notice what shifts in your sense
  of self and space.'
