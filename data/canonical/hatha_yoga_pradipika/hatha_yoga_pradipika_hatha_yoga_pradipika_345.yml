title: One should become void in and void out, and void…
unit_type: verse
commentary: 'This paradoxical instruction describes two complementary states of internal emptiness and
  external fullness that the practitioner cultivates through breath and awareness. The first image—void
  within, void without, like a hollow pot in space—suggests the removal of obstruction and ego-clinging,
  allowing prāṇa (vital energy) to move freely. The second—full within, full without, like a jar submerged
  in the ocean—points to the dissolution of the boundary between self and the vast field of energy or
  consciousness, so that inner fullness and outer fullness become indistinguishable. Together, they map
  a paradox central to haṭha yoga: by emptying the personal will and habitual patterns, one becomes full
  of something larger.



  Key Terms



  **void (śūnya)** — emptiness; in this context, the removal of obstruction, ego-contraction, and resistance
  to the flow of prāṇa

  **prāṇa** — vital life-force or breath-energy that moves through the body and is refined through yogic
  practice



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize emptiness and receptivity as the mark of mastery: ''The ancient
  masters were profound and subtle… Because they were subtle, they must be described with difficulty.''
  Emptiness allows the Tao (or prāṇa) to move unobstructed. Divergence: The Haṭha Yoga Pradīpikā pairs
  emptiness with fullness in a single state; the Tao Te Ching emphasizes emptiness as the primary virtue,
  with fullness as a secondary consequence.


  **Meister Eckhart, ''Poverty of Spirit'':** Eckhart teaches that the soul must become ''empty'' of will
  and attachment so that God''s fullness can pour in: ''A person should be so poor that he is not and
  has not a place where God can work.'' The paradox of emptying to be filled appears in both. Divergence:
  Eckhart''s emptiness is explicitly relational to God; the Haṭha Yoga Pradīpikā describes a state of
  energetic and spatial continuity without invoking a personal deity.


  **Dhammapada, v. 154:** The Buddha teaches that the wise person is ''empty'' of greed, hatred, and delusion,
  and thereby at peace. Emptiness of ego-clinging is the gateway to liberation in both traditions. Divergence:
  The Dhammapada emphasizes ethical and mental emptiness; the Haṭha Yoga Pradīpikā speaks of a spatial
  and energetic emptiness cultivated through breath and subtle body practice.'
