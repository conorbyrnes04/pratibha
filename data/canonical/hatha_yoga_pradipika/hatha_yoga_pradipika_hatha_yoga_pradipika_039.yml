translation: Some call this Siddhâsana, some Vajrâsana. Others call it Mukta âsana or Gupta âsana.
abhyasa: 'Today, when you settle into a seated posture, notice the names or labels you carry for it—whether
  from your teacher, tradition, or personal practice. Sit with the question: What remains true about this
  posture beneath its name? Let the practice itself, rather than its title, be your anchor.'
