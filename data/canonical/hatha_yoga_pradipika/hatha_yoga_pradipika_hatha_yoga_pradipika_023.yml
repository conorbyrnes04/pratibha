translation: One foot is to be placed on the thigh of the opposite side; and so also the other foot on
  the opposite thigh. This is called Virâsana.
abhyasa: Sit upright on a firm surface. Cross your legs so each foot rests on the opposite thigh, keeping
  your spine tall and shoulders relaxed. Spend 2–3 minutes observing the symmetry of your body and the
  stability this pose offers. Notice whether one side feels more open than the other—this asymmetry is
  ordinary and is itself an invitation to patient, balanced attention.
