commentary: 'This brief instruction describes Vīrāsana (the ''hero pose''), a seated cross-legged position
  foundational to haṭha yoga practice. The symmetry of the posture—each foot mirroring the other on the
  opposite thigh—reflects a principle central to haṭha yoga: the balancing of opposing forces (left and
  right channels, sun and moon energies). The simplicity of the instruction itself models the Pradīpikā''s
  pedagogical approach: clear, geometric, repeatable, and accessible to a sincere practitioner.



  Key Terms



  **Vīrāsana** — The ''hero pose''; a seated cross-legged āsana in which each foot is placed on the opposite
  thigh, used as a stable foundation for meditation and breath work.

  **āsana** — A physical posture or seat in yoga practice; traditionally understood as a stable, comfortable
  position that prepares the body for prāṇāyāma and meditation.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'':** Both texts emphasize āsana as a balance of
  steadiness (sthira) and ease (sukha); Vīrāsana exemplifies this principle through its symmetrical, grounded
  form. Divergence: The Yoga Sūtra speaks of āsana philosophically and universally; the Pradīpikā offers
  concrete anatomical instruction for a specific pose.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both texts value simplicity and precision in describing practice;
  the Pradīpikā''s spare language mirrors the Taoist preference for unadorned instruction. Divergence:
  The Pradīpikā is explicitly technical and prescriptive, whereas the Tao Te Ching often speaks through
  paradox and negation.'
