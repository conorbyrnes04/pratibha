translation: 'The ten rules of conduct are: ahimsâ (non-injuring), truth, non-stealing, continence, forgiveness,
  endurance, compassion, meekness, sparing diet, and cleanliness.'
abhyasa: 'Today, notice one moment where you acted (or could act) from one of these ten: perhaps choosing
  a kind word over a sharp one (meekness), or eating simply without excess (sparing diet). Observe without
  judgment—not to achieve perfection, but to sense how ethical choice and bodily awareness are woven together.'
