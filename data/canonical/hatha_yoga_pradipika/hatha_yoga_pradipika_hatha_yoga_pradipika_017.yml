title: 'The ten rules of conduct are:'
unit_type: verse
commentary: 'Svātmārāma opens the Haṭha Yoga Pradīpikā by grounding physical practice in ethical foundation—the
  ten rules of conduct (yama) that precede āsana and prāṇāyāma. This list reflects the classical yoga
  framework: these virtues are not ornamental but constitute the soil from which genuine practice grows.
  Without them, the text suggests, technique alone remains hollow. The emphasis on restraint (continence,
  sparing diet) and gentleness (compassion, meekness, forgiveness) reveals that haṭha yoga is not merely
  bodily discipline but a reorientation of how one inhabits the world.



  Key Terms



  **ahimsâ** — Non-injuring; non-violence in thought, word, and deed toward all beings.

  **yama** — Ethical restraints or rules of conduct; the foundation of yoga practice preceding physical
  postures.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.30–I.31 (yama and niyama):** Both texts place ethical conduct as the prerequisite
  for yoga. Patañjali lists the same virtues (ahimsâ, satya, asteya, brahmacharya, aparigraha) as the
  first limb. Divergence: The Haṭha Yoga Pradīpikā emphasizes these rules as grounding for haṭha practice
  specifically, whereas Patañjali presents them as universal to all yoga paths.


  **Dhammapada, vv. 183–185 (on right conduct):** Both traditions teach that ethical foundation precedes
  inner transformation; virtue quiets the mind and prepares it for deeper work. Divergence: The Dhammapada
  frames conduct primarily as a path to the cessation of suffering, while the Haṭha Yoga Pradīpikā presents
  it as the ground for energetic and meditative practice.


  **Aristotle, Nicomachean Ethics, II.1 (virtue as habit):** Both suggest that virtues are cultivated
  through repeated practice and become second nature, not merely intellectual assent. Divergence: Aristotle
  grounds virtue in reason and the mean between extremes; the Haṭha Yoga Pradīpikā grounds it in the body''s
  subtle energies and the path to samādhi.'
