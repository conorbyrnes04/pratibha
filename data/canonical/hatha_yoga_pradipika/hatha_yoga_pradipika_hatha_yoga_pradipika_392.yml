title: All the methods of Hatha are meant for gaining…
unit_type: verse
commentary: 'This opening statement frames haṭha yoga not as an end in itself, but as a deliberate preparation
  for rāja yoga—the yoga of mind and consciousness. The passage asserts that the physical and energetic
  disciplines of haṭha (āsana, prāṇāyāma, mudrā, bandha) are instrumental means, not ultimate goals. The
  promise—that mastery of rāja yoga allows one to ''overcome death''—suggests a transformation of consciousness
  so complete that ordinary mortality loses its grip, pointing to liberation (mokṣa) rather than mere
  physical immortality.



  Key Terms



  **Haṭha Yoga** — The yoga of forceful effort; the system of physical postures, breath control, and energetic
  locks designed to purify and prepare the body-mind for higher states of consciousness.

  **Rāja Yoga** — The yoga of the mind; the path of meditation and direct realization of consciousness,
  often associated with Patañjali''s eight-limbed system (aṣṭāṅga), culminating in samādhi.



  Cross-Tradition Resonances



  **Patañjali, Yoga Sūtra 1.2 (''yogaś citta-vṛtti-nirodhah''):** Both texts treat yoga as fundamentally
  a work of consciousness—stilling mental fluctuations. Svātmārāma echoes this by positioning haṭha as
  the *means* to that mental mastery. Divergence: Patañjali emphasizes direct mental discipline; the Pradīpikā
  insists the body and breath must be refined first, suggesting a more gradualist, embodied path.


  **Bhagavad Gītā 6.3 (''ārurukṣor muner yogam karma kāraṇam ucyate''):** Both texts teach that action
  (karma, practice) is the ladder for the seeker; effort precedes repose. Haṭha is the ''action'' that
  leads to rāja yoga''s stillness. Divergence: The Gītā emphasizes karma yoga (action in the world); the
  Pradīpikā focuses on internal, systematic practices withdrawn from worldly engagement.


  **Heraclitus, Fragment 51 (''the path up and down are one and the same''):** Both suggest a unified
  process: the descent into body and breath (haṭha) and the ascent into consciousness (rāja) are not opposed
  but continuous. Divergence: Heraclitus speaks of cosmic flux; the Pradīpikā posits a linear, hierarchical
  progression from gross to subtle.'
