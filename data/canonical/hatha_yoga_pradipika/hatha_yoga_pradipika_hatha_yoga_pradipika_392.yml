translation: All the methods of Hatha are meant for gaining success in Raja-Yoga; for, the man or woman,
  who is well-established in the Raja-Yoga, overcomes death.
abhyasa: 'Today, as you practice any āsana or breath work, pause and ask: *What inner state am I cultivating?*
  Rather than perfecting the form, notice whether the practice settles your mind, steadies your attention,
  or opens a sense of spaciousness. This simple inquiry reorients technique toward its true purpose—preparing
  the ground for deeper meditation and insight.'
