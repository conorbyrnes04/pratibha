  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Then, drawing in the air through the surya slowly, the belly should be filled, and after
  performing Kumbhaka as before, it should be expelled slowly through the chandra (left nostril).
abhyasa: 'Today, sit comfortably and practice one round: inhale slowly through your right nostril (closing
  the left with your ring finger), hold the breath gently for a few counts, then exhale slowly through
  your left nostril. Notice the quality of slowness itself—how it changes your awareness of the breath
  and body.'
