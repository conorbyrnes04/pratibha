unit_label: On Prāṇāyāma — 2.8
title: Then, drawing in the air through the surya slowly…
unit_type: verse
commentary: 'This passage describes a foundational breathing practice (prāṇāyāma) in which breath is drawn
  through the right nostril (surya, ''sun''), the belly is filled, held (kumbhaka), and then released
  through the left nostril (chandra, ''moon''). The instruction emphasizes slowness and deliberate control—qualities
  central to haṭha yoga''s method of refining the vital force (prāṇa) through the body''s channels. The
  alternation between sun and moon nostrils reflects a broader cosmology in which opposing energies are
  balanced to prepare the mind for deeper states of meditation.



  Key Terms



  **kumbhaka** — retention or holding of the breath; a pause in the breath cycle used to deepen prāṇic
  control

  **prāṇāyāma** — regulation and extension of breath; foundational practice for directing vital life-force
  through the body''s subtle channels

  **surya / chandra** — sun and moon; the right and left nostrils respectively, associated with complementary
  energetic qualities



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize slowness and subtlety as marks of mastery: ''The ancient
  masters were profound and subtle... because they were subtle, they must be described with difficulty.''
  The Haṭha passage''s emphasis on drawing breath ''slowly'' echoes this valuing of the imperceptible.
  Divergence: The Tao Te Ching speaks of non-action (wu wei) and naturalness; the Haṭha text prescribes
  deliberate, structured technique—effort aimed at transcending effort.


  **Patañjali''s Yoga Sūtra, II.49-50 (on prāṇāyāma):** Both texts present prāṇāyāma as a systematic practice
  that steadies the mind and prepares it for meditation. The Sūtra likewise emphasizes regulation of breath
  as a bridge to inner stillness. Divergence: Patañjali''s sūtras are aphoristic and philosophical; the
  Haṭha Pradīpikā is explicitly procedural and anatomical, naming specific nostrils and body regions.


  **Heraclitus, Fragment 12 (on balance of opposites):** The alternation between surya and chandra—sun
  and moon, right and left—reflects a principle of dynamic equilibrium through opposing forces, akin to
  Heraclitus''s vision of harmony arising from tension. Divergence: Heraclitus speaks of cosmic strife
  as eternal; the Haṭha text treats the balancing of opposites as a means to transcend duality and reach
  samādhi.'
