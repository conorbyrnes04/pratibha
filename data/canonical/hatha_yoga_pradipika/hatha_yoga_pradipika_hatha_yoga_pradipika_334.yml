  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: That Mudra is called Khechari which is performed in the supportless space between the Surya and the Chandra (the
  Ida and the Pingala) and called the Vyoma Chakra.
abhyasa: Sit quietly and bring awareness to the center line of your body, between left and right. Without forcing breath or
  sensation, simply notice the quality of stillness or space there—neither fully left nor fully right. Rest attention there
  for a few minutes, observing what arises without grasping.
