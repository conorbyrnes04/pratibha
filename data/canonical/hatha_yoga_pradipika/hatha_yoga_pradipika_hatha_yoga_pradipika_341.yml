title: By thus practicing, night and day, the breathing is…
unit_type: verse
commentary: 'This verse distills the central promise of haṭha yoga: that disciplined work with breath
  (prāṇāyāma) over time yields a pacified mind. The phrase ''night and day'' signals constancy rather
  than occasional effort—yoga is not a technique applied once but a sustained orientation. As breath steadies,
  mental turbulence naturally subsides; the text treats this not as metaphorical but as a direct causal
  link, suggesting that the breath and mind are intimately woven.



  Key Terms



  **prāṇāyāma** — Regulation and extension of breath; foundational practice in haṭha yoga for controlling
  vital energy (prāṇa) and preparing the mind for meditation.

  **samādhi** — Absorption or meditative union; the culmination of yoga practice in which the mind merges
  with its object of focus, transcending subject-object duality.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12 (Patañjali): ''abhyāsa vairāgyābhyāṁ tannirodhah'' (practice and non-attachment bring
  cessation of mental fluctuations):** Both texts root mental stillness in sustained practice; the Haṭha
  Yoga Pradīpikā specifies breath-work as the vehicle, while Patañjali speaks more broadly of practice
  (abhyāsa) and detachment. Divergence: Patañjali emphasizes the dual requirement of effort and renunciation;
  the Haṭha passage suggests breath-control alone naturally yields calm, without explicit mention of psychological
  relinquishment.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... Because they were subtle, they
  must be described with difficulty.'':** Both traditions prize constancy and subtlety over force; the
  Haṭha text''s ''night and day'' echoes the Taoist emphasis on patient, continuous alignment with natural
  rhythms. Divergence: The Haṭha Yoga Pradīpikā prescribes specific technical practices (breath retention,
  bandha), whereas the Tao Te Ching advocates wu-wei (non-action), trusting spontaneous unfolding.


  **Dhammapada 5: ''Mindfulness is the path to the Deathless; heedlessness is the path to death.'':**
  Both texts link disciplined attention (here, to breath) with liberation and mental clarity; both treat
  practice as a threshold between confusion and awakening. Divergence: The Dhammapada frames the stakes
  in terms of rebirth and mortality; the Haṭha Yoga Pradīpikā focuses on the immediate, embodied transformation
  of breath and mind within a single lifetime.'
