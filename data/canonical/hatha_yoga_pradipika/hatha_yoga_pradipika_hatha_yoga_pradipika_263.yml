translation: The bindu discharged in the practice of Vajroli should be mixed with ashes, and the rubbing
  it on the best parts of the body gives divine sight.
abhyasa: 'Sit quietly and bring attention to the space between the eyebrows (ājñā cakra). Without straining,
  notice what ''sight'' means to you beyond the eyes—inner vision, intuition, clarity. Ask: what would
  it mean to see ''divinely''? Hold this inquiry without forcing an answer.'
