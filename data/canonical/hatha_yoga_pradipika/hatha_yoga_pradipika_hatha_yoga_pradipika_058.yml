title: The Nâdis should be cleansed of their impurities by…
unit_type: verse
commentary: 'This verse presents a foundational premise of haṭha yoga: that the subtle channels (nāḍīs)
  through which vital energy flows must first be purified before higher states of consciousness become
  accessible. The passage names the primary means—postural work (āsanas), breath retention (kumbhakas),
  and energetic seals (mudrās)—as practical tools for this cleansing. The logic is sequential: impurity
  blocks flow; systematic practice removes obstruction; clarity enables ascent toward samādhi.



  Key Terms



  **Nāḍīs** — Subtle energy channels in the yogic body through which prāṇa (vital life force) flows; their
  purification is presented here as prerequisite to higher practice.

  **Kumbhaka** — Retention of breath; a prāṇāyāma technique in which the breath is held after inhalation
  or exhalation.

  **Mudrā** — Energetic seal or gesture; a practice that directs and concentrates prāṇa, used here alongside
  āsana and kumbhaka for purification.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts treat the body as a system requiring refinement before wisdom manifests:
  ''The ancient masters were profound and subtle... because they were subtle, they must be described with
  difficulty.'' Divergence: The Tao Te Ching emphasizes paradox and non-action; the Haṭha Yoga Pradīpikā
  prescribes specific, deliberate techniques.


  **Patañjali''s Yoga Sūtra, II.28:** Both texts treat purification as a necessary stage: Patañjali names
  āsana and prāṇāyāma as means to remove ''obstacles'' (antarāya) to clarity. Divergence: Patañjali emphasizes
  mental obstacles and philosophical discrimination; this passage foregrounds the energetic/physiological
  dimension.'
