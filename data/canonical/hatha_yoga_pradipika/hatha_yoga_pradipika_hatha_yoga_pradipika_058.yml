translation: The Nâdis should be cleansed of their impurities by performing the mudrâs, etc., (which are
  the practices relating to the air) âsanas, Kumbhakas and various curious mudrâs.
abhyasa: Sit quietly and bring awareness to your breath. Without forcing, notice where your breathing
  feels restricted or uneven—perhaps one nostril, or shallow upper chest. This simple observation honors
  the teaching that awareness itself is the first step toward clearing what blocks us, before any formal
  technique.
