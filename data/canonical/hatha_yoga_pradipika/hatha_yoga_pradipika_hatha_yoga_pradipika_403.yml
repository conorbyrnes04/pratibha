translation: As long as the Prana does not enter and flow in the middle channel and the vindu does not
  become firm by the control of the movements of the Prana; as long as the mind does not assume the form
  of Brahma without any effort in contemplation, so long all the talk of knowledge and wisdom is merely
  the nonsensical babbling of a mad man or woman.
abhyasa: 'Sit quietly for five minutes. Notice where your attention habitually rests—in thought, sensation,
  or breath. Without forcing, simply observe whether your awareness feels scattered or gathered. Ask yourself:
  Am I speaking or thinking about yoga, or am I practicing it? Let the question sit without answering.'
