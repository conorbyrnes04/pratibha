title: The bath should bring all the daily duties briefly…
unit_type: verse
commentary: 'This brief instruction embeds a practical wisdom: the body''s rhythms and needs are not obstacles
  to practice, but part of its proper conduct. By bathing after practice, resting at midday, and eating
  at appropriate times, the yogi honors the body''s natural cycles rather than forcing it into an austere
  or disembodied ideal. The passage suggests that haṭha yoga is not rejection of the body''s ordinary
  life, but a disciplined integration of it—a foundation for the subtler work to come.



  Key Terms



  **haṭha** — Literally ''force'' or ''effort''; the yoga of physical postures, breath, and energy practices,
  understood as a preparatory path toward rāja yoga (the yoga of mind and meditation).



  Cross-Tradition Resonances



  **Aristotle, Nicomachean Ethics II.6 (the doctrine of the mean):** Both texts counsel a middle path—neither
  excess nor deficiency—in bodily practice and daily habit as the ground of virtue and higher development.
  Divergence: Aristotle grounds this in rational habit formation for ethical character; the Pradīpikā
  grounds it in energetic and spiritual preparation for samādhi.


  **Tao Te Ching 15 (the sage moves in accord with natural timing):** Both honor the body''s natural rhythms
  and cycles as wisdom rather than weakness; both see alignment with natural timing as essential to practice.
  Divergence: The Tao Te Ching emphasizes effortless spontaneity; the Pradīpikā emphasizes disciplined,
  structured practice within natural rhythms.'
