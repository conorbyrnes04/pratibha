  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The bath should bring all the daily duties briefly to an end. At noon also a little rest
  should be taken at the end of the exercise, and then food should be taken.
abhyasa: Today, notice one moment when your body signals a genuine need (thirst, fatigue, hunger, or the
  need to move). Rather than pushing past it or indulging it carelessly, pause and meet it with simple
  attention and care. Observe how this small act of honoring the body's rhythm affects your sense of presence.
