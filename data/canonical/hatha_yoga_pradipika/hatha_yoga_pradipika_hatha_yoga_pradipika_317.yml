  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: O Parvati! Mercury and breathing, when made steady, destroy diseases and the dead himself or herself comes to
  life (by their means). By their (proper) control, moving in the air is attained.
abhyasa: Today, observe one conscious breath cycle (inhale, hold, exhale) with full attention to the sensation of breath moving
  through your body. Notice where it feels steady and where it feels scattered. Do not force; simply witness. This simple
  act honors the text's premise that awareness of breathing itself is the beginning of its 'steadying.'
