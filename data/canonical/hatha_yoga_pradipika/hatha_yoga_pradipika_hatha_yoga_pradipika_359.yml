unit_label: On Samādhi — 4.69
title: When the Brahma granthi (in the heart) is pierced…
unit_type: verse
commentary: 'This verse describes a specific somatic experience said to arise when prāṇāyāma (breath regulation)
  dissolves an energetic knot (granthi) at the heart center. The ''vacuum'' or emptiness that follows
  is not mere absence but a state of happiness—suggesting that obstruction itself, not space, is the source
  of suffering. The ''anahat sounds'' (literally ''unstruck sounds'') are inner vibrations perceived as
  music, marking a shift in subtle perception when the energy channels open.



  Key Terms



  **Brahma granthi** — An energetic knot or blockage in the heart center, said in haṭha yoga to obstruct
  the flow of prāṇa (vital energy) and spiritual awakening.

  **Anahat sounds** — Literally ''unstruck sounds''—subtle inner vibrations or tones perceived in the
  body during advanced prāṇāyāma and meditation, traditionally understood as signs of refined perception.

  **Prāṇāyāma** — Regulation and extension of breath; a foundational practice in haṭha yoga said to purify
  and direct vital energy through the body''s subtle channels.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts associate emptiness or spaciousness with wisdom and well-being:
  ''The ancient masters were profound and subtle... because they were subtle, they can only be described
  with difficulty.'' The Haṭha Yoga Pradīpikā''s ''vacuum of the heart'' parallels the Taoist emphasis
  on wu wei (non-action) and inner void as fullness. Divergence: The Tao Te Ching emphasizes emptiness
  as a natural, ever-present principle; the Pradīpikā locates it as an achievement requiring disciplined
  practice to pierce through obstruction.


  **Upaniṣads (e.g., Kaṭha Upaniṣad):** Both texts speak of the heart as a locus of ultimate knowledge
  and subtle sound (nāda) as a pathway to the Self. The Pradīpikā''s anahat sounds echo the Upaniṣadic
  notion of the OM vibration as the ground of reality. Divergence: The Upaniṣads approach these truths
  through philosophical inquiry and intuition; the Pradīpikā grounds them in embodied, technical practice—prāṇāyāma
  and bandha as means.


  **Meister Eckhart, ''The Breakthrough'':** Eckhart speaks of ''breaking through'' to a divine emptiness
  beyond all images and concepts, which brings peace. The Pradīpikā''s piercing of the granthi and the
  resulting happiness in emptiness share this paradox: fullness through void. Divergence: Eckhart''s breakthrough
  is framed as mystical union with God through surrender; the Pradīpikā is systematic and physiological,
  mapping specific energy centers and techniques.'
