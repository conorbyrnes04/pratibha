title: Just as sparing food is among Yamas
unit_type: verse
commentary: 'This verse establishes a hierarchy of practices by analogy: just as ethical restraint (Yama)
  and non-harming (Niyama) are foundational to moral conduct, Siddhāsana is foundational to physical practice.
  The comparison suggests that posture is not merely physical but part of an integrated ethical and contemplative
  path. By naming Siddhāsana ''chief of all āsanas,'' the text implies that mastery of one stable seat
  is more valuable than facility in many poses.



  Key Terms



  **Yama** — Ethical restraints or disciplines; the first limb of yoga practice, including non-violence,
  truthfulness, and non-stealing.

  **Niyama** — Observances or personal practices; the second limb of yoga, including purity, contentment,
  and austerity.

  **Siddhāsana** — A seated posture in which one heel presses the perineum and the other leg extends;
  traditionally considered a powerful seat for prāṇāyāma and meditation.

  **Āsana** — Posture or seat; the physical positions of yoga practice, traditionally understood as a
  stable and comfortable foundation for breath and meditation.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'':** Both texts emphasize that āsana should be
  steady and comfortable, not merely physical contortion. The Haṭha Yoga Pradīpikā''s elevation of one
  ''chief'' posture echoes the Sūtra''s principle that quality of seat matters more than quantity. Divergence:
  Patañjali treats āsana as one limb among eight and does not rank specific postures; the Pradīpikā gives
  detailed technical emphasis to particular seats and their energetic effects.


  **Bhagavad Gītā 6.11-12 (Krishna on meditation posture):** Both texts root inner practice in outer stability—the
  Gītā prescribes a firm, clean seat for meditation; the Pradīpikā makes the seat itself a gateway to
  prāṇāyāma and samādhi. Divergence: The Gītā emphasizes ethical preparation (Yama/Niyama) before posture;
  the Pradīpikā assumes ethics are already in place and focuses on the technical mastery of specific āsanas.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle''—emphasis on simplicity and returning
  to root:** Both traditions value depth over multiplicity: one well-mastered seat or principle outweighs
  scattered knowledge. The ''chief'' posture mirrors the Taoist return to simplicity. Divergence: The
  Pradīpikā is explicitly technical and prescriptive; the Tao Te Ching resists naming and systematization,
  preferring paradox and non-action.'
