translation: Just as sparing food is among Yamas, and Ahimsâ among the Niyamas, so is Siddhâsana called
  by adepts the chief of all the âsanas.
abhyasa: 'Sit in a comfortable, upright posture today—whether Siddhāsana or another stable seat—and notice
  how steadiness of the body affects steadiness of breath and mind. Observe without forcing: does physical
  stability create a felt sense of inner stability?'
practice: 'Sit in a comfortable, upright posture today—whether Siddhāsana or another stable seat—and notice
  how steadiness of the body affects steadiness of breath and mind. Observe without forcing: does physical
  stability create a felt sense of inner stability?'
