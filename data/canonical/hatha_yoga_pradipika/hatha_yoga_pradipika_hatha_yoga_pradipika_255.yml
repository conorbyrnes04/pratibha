  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: By preserving bindu, the body of the Yogi or Yogini emits a pleasing smell. There is no fear
  of death, so long as the bindu is well-established in the body.
abhyasa: 'Today, notice your own vitality: your breath, energy level, any sense of aliveness or depletion.
  Without forcing anything, simply observe where you feel most present in your body. This attentiveness
  itself is a first step toward the yogic concern with preserving and refining internal energy.'
