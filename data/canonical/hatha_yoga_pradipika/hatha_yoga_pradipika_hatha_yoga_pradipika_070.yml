unit_label: On Prāṇāyāma — 2.1
title: Posture becoming established
unit_type: verse
commentary: 'This verse establishes the sequential foundation of haṭha yoga: stable posture (āsana) precedes
  breath work (prāṇāyāma), which in turn requires self-mastery and disciplined diet. The text emphasizes
  that prāṇāyāma is not an isolated technique but emerges from a prepared body and mind, and crucially,
  must be learned from a qualified teacher (guru). The mention of both Yogi and Yogini signals that these
  practices are available to all sincere practitioners regardless of gender.



  Key Terms



  **āsana** — A steady, comfortable posture; the physical foundation of yoga practice from which prāṇāyāma
  and deeper work arise.

  **prāṇāyāma** — Regulation and extension of breath; a central practice for directing vital energy (prāṇa)
  and preparing the mind for meditation.

  **guru** — A qualified teacher; in this context, one who transmits prāṇāyāma instruction directly and
  safely to a student.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''sthira sukham āsanam'' (posture should be steady and comfortable):**
  Both texts ground yoga in the body''s stable readiness; the Pradīpikā extends this to show posture as
  the prerequisite for breath work. Divergence: The Sūtra emphasizes the quality of ease within steadiness;
  the Pradīpikā focuses more on the sequential ladder of practices.


  **Confucian Analects: ''The superior man thinks always of virtue, the common man thinks of comfort''
  (Analects 4.16):** Both texts stress disciplined eating and self-mastery as moral and practical foundations
  for higher work. Divergence: Confucianism frames this as social virtue; the Pradīpikā frames it as energetic
  and spiritual preparation.


  **Heraclitus: ''Character is destiny'' (attributed):** The Pradīpikā''s insistence on the yogi being
  ''master of himself or herself'' echoes the idea that inner discipline shapes outer capacity. Divergence:
  Heraclitus speaks of character as fate; the Pradīpikā presents self-mastery as a deliberate practice
  to be cultivated.'
