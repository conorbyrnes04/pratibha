translation: Posture becoming established, a Yogi or Yogini, master of himself or herself, eating salutary
  and moderate food, should practice pranayama, as instructed by his or her guru.
abhyasa: 'Today, sit in a posture that feels stable and alert to you—whether cross-legged, kneeling, or
  on a chair. Before attempting any breath work, simply notice: Is my spine upright? Are my shoulders
  relaxed? Am I eating and resting in ways that support my practice? This preparatory awareness honors
  the text''s insistence that technique rests on foundation.'
