title: It should be restrained, as before, and then let…
unit_type: verse
commentary: 'This verse describes a foundational prāṇāyāma technique: inhaling through one nostril, retaining
  the breath with control, and exhaling through the other. The passage grounds the practice in concrete
  physiological effects—clearing respiratory obstruction and stimulating digestion—suggesting that haṭha
  yoga views breath work not as merely symbolic but as having direct, observable impact on the body''s
  humoral balance. The simplicity of the instruction reflects the Pradīpikā''s pedagogical aim: to present
  techniques as learnable steps, each with measurable results.



  Key Terms



  **Iḍā** — The left energy channel (nāḍī) in yogic anatomy, associated in this context with exhalation
  and the cooling, lunar principle.

  **Śleṣma** — Phlegm or kapha (one of the three humors in Āyurvedic medicine); excess moisture or heaviness
  in the respiratory and digestive systems.



  Cross-Tradition Resonances



  **Āyurveda (classical medical texts, e.g., Caraka Saṃhitā):** Both traditions understand breath and
  digestion as interconnected; prāṇāyāma and diet are used to balance humoral imbalance (kapha excess
  here). Divergence: The Pradīpikā frames prāṇāyāma as a yoga practice leading toward samādhi, whereas
  Āyurvedic texts treat breathing primarily as a medical intervention.


  **Patañjali''s Yoga Sūtra IV.26 (on the removal of ignorance through practice):** Both texts assume
  that systematic, repeated practice yields progressive refinement—here, physical; there, cognitive. Divergence:
  The Pradīpikā emphasizes tangible bodily results as motivating evidence, while the Sūtra points toward
  liberation of consciousness as the ultimate fruit.'
