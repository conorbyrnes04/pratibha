translation: It should be restrained, as before, and then let out through the Ida (the left nostril).
  This removes slesma (phlegm) in the throat and increases the appetite.
abhyasa: Today, sit quietly and observe one complete breath cycle through each nostril separately (without
  retention, if you are unfamiliar with prāṇāyāma). Notice any difference in airflow, temperature, or
  ease between left and right. This simple observation honors the text's attention to the body's actual
  experience rather than abstraction.
