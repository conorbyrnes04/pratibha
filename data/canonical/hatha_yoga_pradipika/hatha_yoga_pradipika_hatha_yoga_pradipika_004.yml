title: Matsyendra
unit_type: verse
commentary: 'This opening verse establishes a lineage of transmission: the knowledge of haṭha yoga is
  not invented but inherited through a chain of accomplished teachers (Matsyendra and Goraksa being legendary
  siddhas), and Svātmārāma positions himself as a grateful recipient of their grace rather than an originator.
  The phrase ''by their favor'' (prasāda) signals that mastery is not earned through effort alone but
  requires the blessing of those who have realized the practice—a foundational principle in yoga traditions
  where direct transmission from teacher to student is considered essential.



  Key Terms



  **Haṭha Vidyā** — The science or knowledge of haṭha yoga; the systematic practice of physical postures,
  breath control, and energy locks aimed at preparing the body and mind for higher states of consciousness.

  **prasāda (favor/grace)** — In this context, the blessing or grace of accomplished teachers that enables
  the transmission and reception of spiritual knowledge; not mere intellectual transfer but an empowerment
  through relationship.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.34: ''Know that by prostration, by question, and by service, the wise who have seen
  the truth will teach you knowledge.'':** Both texts emphasize that authentic knowledge comes through
  relationship with a qualified teacher and requires humility and service from the student. Divergence:
  The Gītā stresses the student''s active posture of seeking (prostration, questioning, service), while
  the Haṭha Yoga Pradīpikā emphasizes the teacher''s grace as the enabling condition.


  **Katha Upaniṣad 1.2.8: ''This Self cannot be attained by study, nor by intellect, nor by much learning.'':**
  Both suggest that direct realization requires something beyond intellectual transmission—a grace or
  transmission that transcends mere information. Divergence: The Upaniṣad points to the Self as ultimately
  beyond teaching; the Haṭha Yoga Pradīpikā offers a concrete method (haṭha practice) as the vehicle for
  that grace.'
