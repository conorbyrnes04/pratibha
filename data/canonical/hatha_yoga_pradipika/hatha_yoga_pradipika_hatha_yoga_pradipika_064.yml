title: Wheat, rice, barley, shâstik (a kind of rice), good…
unit_type: verse
commentary: 'This passage grounds yoga practice in ordinary, nourishing foods—not asceticism or exotic substances, but staples
  available to the householder. The list emphasizes sattvic (pure, harmonizing) foods that support the body''s capacity for
  breath work and meditation without creating heaviness or agitation. By naming specific foods, Svātmārāma anchors the spiritual
  path in the material world, suggesting that yoga is not a flight from the body but a refinement of it through what we consume.



  Key Terms



  **sattvic** — In Ayurvedic and yogic thought, foods and qualities that are pure, light, and conducive to clarity and spiritual
  practice (implied in this passage''s emphasis on wholesome, easily digestible foods).



  Cross-Tradition Resonances



  **Bhagavad Gītā 17.8–10 (on sattvic, rajasic, and tamasic foods):** Both texts link diet directly to spiritual capacity,
  naming wholesome foods as supports for practice. Divergence: The Gītā frames food within a tripartite cosmic quality system;
  the Pradīpikā simply lists what is ''beneficial,'' without explicit cosmic philosophy.


  **Hippocrates, ''Let food be thy medicine'':** Both traditions see food as integral to health and well-being, not separate
  from spiritual or physical discipline. Divergence: The Pradīpikā specifies foods for yoga practice; Hippocrates speaks to
  medicine and general health.'
