  body: Wheat, rice, barley, shâstik (a kind of rice), good corns, milk, ghee, sugar, butter, sugarcandy, honey, dried ginger,
    Parwal (a vegetable), the five vegetables, moong, pure water, these are very beneficial to those who practice Yoga.
