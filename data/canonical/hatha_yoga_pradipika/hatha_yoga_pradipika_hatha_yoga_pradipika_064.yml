  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Wheat, rice, barley, shâstik (a kind of rice), good corns, milk, ghee, sugar, butter, sugarcandy, honey, dried
  ginger, Parwal (a vegetable), the five vegetables, moong, pure water, these are very beneficial to those who practice Yoga.
abhyasa: 'Today, notice one meal or snack you consume. Before eating, pause and ask: Does this food feel light and clarifying,
  or heavy and dulling? Reflect on how your choice affects your energy and mind over the next few hours. No judgment—simple
  observation.'
