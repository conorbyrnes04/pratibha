title: As a door is opened with a key, so the Yogi or…
unit_type: verse
commentary: 'This verse presents haṭha yoga as a practical technology of liberation, not mere physical
  discipline. The simile of the key and door suggests that kundalini awakening is not mystical accident
  but methodical work—the practices of haṭha yoga are the means, kundalini is the mechanism, and mukti
  (liberation) is the result. The phrasing ''Yogi or Yogini'' affirms that this path is open to practitioners
  of any gender, a notable inclusivity for a 15th-century text.



  Key Terms



  **kundalini** — In this text, the dormant spiritual energy coiled at the base of the spine; awakened
  and directed upward through haṭha yoga practice to open the path to liberation.

  **mukti** — Liberation; the ultimate goal of yoga practice, understood here as freedom achieved through
  the opening of kundalini.

  **haṭha yoga** — The yoga of force or effort; the systematic practice of āsana (postures), prāṇāyāma
  (breath control), mudrā (seals), and other techniques to prepare the body and mind for higher states.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both
  texts present a hidden mechanism (kundalini / the Tao) that responds to skillful, patient practice rather
  than force alone. Divergence: The Tao Te Ching emphasizes non-action and spontaneity; the Haṭha Yoga
  Pradīpikā prescribes deliberate, structured technique.


  **Heraclitus, Fragment 51: ''The path up and down are one and the same.'':** Both suggest that a single
  practice (breath, attention, or the logos) simultaneously descends into and ascends from the material
  world. Divergence: Heraclitus speaks of cosmic unity; Svātmārāma locates the path specifically in the
  body and kundalini.


  **Meister Eckhart: ''The door must be opened from within.'':** Both affirm that liberation requires
  an interior act—not external salvation, but the practitioner''s own work. Divergence: Eckhart emphasizes
  surrender and grace; the Haṭha Yoga Pradīpikā emphasizes technique and disciplined effort.'
