  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: As a door is opened with a key, so the Yogi or Yogini opens the door of mukti by opening
  Kundalini by means of Hatha Yoga.
abhyasa: 'Today, bring awareness to one deliberate breath cycle (inhale, hold, exhale). As you breathe,
  silently note: ''This breath is a key.'' Notice how attention itself opens something—a subtle shift
  in awareness, a quieting of thought. This is not kundalini work, but an entry into the principle: that
  conscious practice, however small, unlocks what was closed.'
