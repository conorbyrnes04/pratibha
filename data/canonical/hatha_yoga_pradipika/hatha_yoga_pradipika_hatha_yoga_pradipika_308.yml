  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In this body there are 72,000 openings of Nadis; of these, the Susumna, which has the Sambhavi Sakti in it, is
  the only important one, the rest are useless.
abhyasa: Today, in a quiet moment, sit upright and bring awareness to the center of your body—from the base of your spine
  to the crown of your head. Without forcing breath or visualization, simply notice the sense of a central axis within you.
  Return to this awareness whenever your attention scatters outward. This is a gentle recognition of the principle the verse
  names.
