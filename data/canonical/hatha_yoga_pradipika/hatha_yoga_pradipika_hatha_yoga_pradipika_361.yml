translation: In the second stage, the airs are united into one and begun moving in the middle channel.
  The Yogi's or Yogini’s posture becomes firm, and he or she becomes wise like a god.
abhyasa: Sit quietly today and notice where your breath naturally flows—left nostril, right nostril, or
  balanced. Without forcing, observe for a few minutes. This simple noticing honors the passage's attention
  to the breath's pathways and prepares the ground for understanding why unification of the currents matters.
