  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The high-souled Acharyas (Teachers) of yore gained experience in the various methods of Samadhi themselves, and
  then they preached them to others.
abhyasa: 'Reflect today on a teaching or practice you have received. Ask: Do I trust it because someone merely told me to,
  or because I have tested it in my own body and mind? Consider one small practice (breath, posture, or attention) you will
  undertake yourself this week, so that any wisdom you later share comes from your own ground.'
