title: The high-souled Acharyas (Teachers) of yore gained…
unit_type: verse
commentary: 'This verse establishes a foundational principle: authentic teaching of samādhi (absorption/liberation) arises
  from direct, lived experience, not mere intellectual transmission. The lineage of yoga is grounded in the teacher''s own
  practice and realization—they ''gained experience'' first, then ''preached'' (taught) from that ground. This frames the
  Haṭha Yoga Pradīpikā itself as part of an unbroken chain of practitioners who have walked the path and now offer guidance
  to sincere students.



  Key Terms



  **Samādhi** — Meditative absorption or unified consciousness; the culmination of yoga practice in which the mind becomes
  one with its object, often understood as liberation or enlightenment.

  **Acharya** — Teacher or master; one who embodies and transmits spiritual knowledge through both example and instruction.



  Cross-Tradition Resonances



  **Dhammapada, verse 276 (Buddha): ''Be lamps unto yourselves.'':** Both texts emphasize that authentic realization cannot
  be given; it must be verified through one''s own practice and direct seeing. Divergence: The Dhammapada stresses individual
  self-reliance; the Haṭha Yoga Pradīpikā locates that verification within a lineage of teachers who have already walked the
  path.


  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... because they were subtle, they can only be described
  with difficulty.'':** Both honor the wisdom of those who came before and suggest that true teaching emerges from deep, lived
  understanding rather than mere words. Divergence: The Haṭha Yoga Pradīpikā is explicit about transmission and method; the
  Tao Te Ching suggests the deepest truths resist articulation.


  **Meister Eckhart: ''A master is one who has become transparent to the divine action.'':** Both traditions see the teacher
  as one who has undergone transformation and now serves as a conduit for truth to reach students. Divergence: Eckhart emphasizes
  divine grace and transparency; the Haṭha Yoga Pradīpikā emphasizes methodical practice and experiential mastery of specific
  techniques.'
