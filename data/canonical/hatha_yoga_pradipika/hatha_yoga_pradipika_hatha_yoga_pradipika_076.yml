translation: Sitting in the Padmâsana posture the Yogi or Yogini should fill in the air through the left
  nostril (closing the right one); and, keeping it confined according to one's ability, it should be expelled
  slowly through the surya (right nostril).
abhyasa: Sit comfortably with a straight spine. Close your right nostril gently with your thumb, inhale
  slowly through your left nostril, then close the left and exhale through the right. Notice the quality
  of your attention and any shift in your mental state. Do this for 3–5 rounds, without strain. Observe
  what 'according to one's ability' means for you today.
practice: Sit comfortably with a straight spine. Close your right nostril gently with your thumb, inhale
  slowly through your left nostril, then close the left and exhale through the right. Notice the quality
  of your attention and any shift in your mental state. Do this for 3–5 rounds, without strain. Observe
  what 'according to one's ability' means for you today.
