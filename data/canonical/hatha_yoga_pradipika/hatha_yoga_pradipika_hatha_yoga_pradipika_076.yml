title: Sitting in the Padmâsana posture the Yogi or Yogini…
unit_type: verse
commentary: 'This passage describes a foundational prāṇāyāma technique—controlled breathing through alternate
  nostrils—presented as a concrete, embodied practice. The instruction assumes a stable seated posture
  (Padmāsana) and emphasizes restraint (''keeping it confined according to one''s ability''), suggesting
  that prāṇāyāma is not about force but about gradual, attentive mastery of the breath. The asymmetry—inhaling
  through the left (associated with the cooling channel, Iḍā) and exhaling through the right (associated
  with the heating channel, Piṅgalā)—implies that breath work is understood as a circulation of subtle
  energy, not merely physical respiration.



  Key Terms



  **Padmāsana** — The lotus posture; a seated position traditionally used for meditation and breath work,
  in which the feet are placed on the thighs.

  **Prāṇāyāma** — Regulation or extension of the breath (prāṇa = life-force; āyāma = expansion/restraint);
  a core practice in haṭha yoga for directing subtle energy.

  **Surya** — Literally ''sun''; here, the right nostril, associated with solar (heating, activating)
  energy in yogic anatomy.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali): ''tasmin sati śvāsa-praśvāsayoh gati-vicchedah prāṇāyāmah'' (When āsana
  is mastered, prāṇāyāma is the regulation of the breath.):** Both texts place prāṇāyāma as a disciplined,
  sequential practice that follows stable posture and requires conscious control. Divergence: The Yoga
  Sūtra treats prāṇāyāma more abstractly as a limb of the eight-fold path; the Pradīpikā gives concrete
  anatomical and energetic detail.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty.'':** Both traditions honor restraint and gradual refinement (''according
  to one''s ability'') as the mark of genuine practice, not force or display. Divergence: The Pradīpikā
  is prescriptive and technical; the Tao Te Ching is apophatic and poetic.


  **Heraclitus, Fragment 12: ''All things flow'' (panta rhei).:** The breath, like the river, is a constant
  flow; mastering its rhythm is mastering a fundamental law of nature. Divergence: Heraclitus speaks of
  flux as inevitable; the Pradīpikā implies that conscious regulation of flow is the path to liberation.'
