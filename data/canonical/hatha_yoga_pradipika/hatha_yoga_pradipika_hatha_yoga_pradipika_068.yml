  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Success cannot be attained by adopting a particular dress (Vesa). It cannot be gained by telling tales. Practice
  alone is the means to success. This is true, there is no doubt.
abhyasa: Today, notice one way you might be relying on external identity (a label, a story you tell about yourself, an image)
  instead of actual practice. Then do one small, concrete thing—one breath practice, one āsana held with attention, one moment
  of genuine observation—and let that be enough.
