title: Success cannot be attained by adopting a particular…
unit_type: verse
commentary: 'Svātmārāma cuts through external markers of spiritual identity—robes, lineage stories, reputation—to assert that
  yoga''s fruit comes only through direct, sustained practice. The passage is both a corrective to spiritual pretense and
  an invitation: the path is open to anyone willing to work, not reserved for the specially dressed or eloquently credentialed.
  This pragmatism anchors the entire Pradīpikā''s technical teachings in lived effort rather than belief or appearance.



  Key Terms



  **Vesa** — Dress or outward appearance; in this context, the external trappings or costume of spiritual identity.

  **Practice (Abhyāsa)** — Sustained, direct engagement with the techniques and disciplines of yoga; the only reliable means
  to realization according to this passage.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''yoga is skill in action''):** Both texts emphasize doing over mere appearance or talk; yoga is a
  verb, not an identity to wear. Divergence: The Gītā frames practice within dharma and duty; Svātmārāma isolates practice
  itself as the sole criterion of success.


  **Dhammapada 183 (''not by matted hair, nor by lineage... by practice is one purified''):** Both reject external markers
  (hair, caste, dress) in favor of actual discipline and transformation. Divergence: The Dhammapada emphasizes moral purification;
  the Pradīpikā points toward prāṇāyāma and samādhi as the fruit.


  **Meister Eckhart: ''God is not found in the soul by adding anything but by a process of subtraction'':** Both suggest that
  spiritual attainment requires stripping away pretense and false accumulation, not collecting more. Divergence: Eckhart speaks
  of divine union through negation; Svātmārāma prescribes positive, embodied technique.'
