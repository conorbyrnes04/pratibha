commentary: 'This passage locates the supreme seat of consciousness—Śiva, the transcendent principle—at
  the ājñā chakra (between the eyebrows), and describes a state in which the mind becomes wholly absorbed
  in that locus. This absorption is named Turya, the ''fourth'' state beyond waking, dream, and deep sleep,
  and is characterized as beyond the reach of death. The teaching suggests that through focused attention
  on this subtle center, the practitioner enters a dimension of consciousness untouched by temporal dissolution.



  Key Terms



  **Turya** — The ''fourth'' state of consciousness, transcending waking, dream, and deep sleep; a state
  of pure awareness beyond the mind''s ordinary fluctuations.

  **Ājñā (seat between the eyebrows)** — The subtle center of inner perception and command; the locus
  where mind and transcendent principle are said to meet.



  Cross-Tradition Resonances



  **Upaniṣads (Māṇḍūkya Upaniṣad, on Turya):** Both texts identify Turya as a fourth state of consciousness
  beyond the three ordinary states, characterized by non-dual awareness and freedom from time. Divergence:
  The Haṭha Yoga Pradīpikā emphasizes the *location* (between the eyebrows) and the *method* (absorption
  of mind) to access Turya, whereas the Upaniṣad treats it more abstractly as the ground of all states.


  **Bhagavad Gītā 6.13 (on steady meditation and the seat of the mind):** Both texts teach that steadying
  the mind in a single focus—here, a sacred inner place—leads to a state beyond ordinary consciousness
  and fear. Divergence: The Gītā emphasizes equanimity and detachment from action, while the Haṭha Yoga
  Pradīpikā foregrounds the specific psycho-physical technique and anatomical locus.


  **Patañjali''s Yoga Sūtra 1.2 (yoga as cessation of mental fluctuations):** Both texts define the yogic
  goal as the stilling of mind (citta-vṛtti-nirodha) and point toward a state of pure consciousness beyond
  death and change. Divergence: The Yoga Sūtra remains philosophically abstract about method, while the
  Haṭha Yoga Pradīpikā grounds the practice in a concrete anatomical and energetic focus.'
