translation: The seat of Siva is between the eyebrows, and the mind becomes absorbed there. This condition
  (in which the mind is thus absorbed) is known as Turya, and death has no access there.
abhyasa: Sit quietly and, without strain, rest your inner gaze at the space between the eyebrows. Do not
  force or visualize; simply allow your attention to settle there as if listening inward. Notice any subtle
  shift in the quality of awareness. Practice for 5–10 minutes, returning gently whenever the mind wanders.
  Observe what 'absorption' feels like, even in small measure.
