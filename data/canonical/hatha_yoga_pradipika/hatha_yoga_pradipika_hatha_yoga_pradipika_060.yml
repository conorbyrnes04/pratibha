translation: Abstemious feeding is that in which 3/4 of hunger is satisfied with food, well cooked with ghee and sweets, and
  eaten with the offering of it to Siva.
abhyasa: At your next meal, pause before eating and mentally offer the food to what you understand as the sacred or divine.
  Eat slowly, stopping when you feel about three-quarters satisfied rather than full. Notice the difference in your body and
  mind afterward—lightness, clarity, absence of heaviness.
