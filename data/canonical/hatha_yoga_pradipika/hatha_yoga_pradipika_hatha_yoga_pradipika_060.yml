title: Abstemious feeding is that in which 3/4 of hunger…
unit_type: verse
commentary: 'This verse defines proper diet for a yoga practitioner not as ascetic deprivation, but as mindful moderation
  paired with devotion. By satisfying three-quarters of hunger rather than fullness, the body remains light and the mind clear—conditions
  necessary for prāṇāyāma and meditation. The emphasis on ghee, sweets, and ritual offering (to Śiva) shows that nourishment
  is inseparable from reverence; eating becomes a spiritual act, not mere fuel.



  Key Terms



  **Abstemious feeding** — Moderate, disciplined eating that satisfies hunger without excess; a foundational practice for
  yoga.

  **Śiva** — The supreme deity to whom the offering of food and practice is made; here, the ultimate recipient of devotion.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16:** Both texts teach that yoga is not for the glutton or the starver, but for the moderate eater; diet
  directly affects the mind''s capacity for practice. Divergence: The Gītā frames moderation in terms of sattva (purity) and
  its opposite qualities; the Pradīpikā emphasizes the practical lightness needed for breath and energy work.


  **Tao Te Ching 15:** Both traditions value restraint and simplicity as pathways to clarity and subtle perception; fullness
  obscures wisdom. Divergence: The Pradīpikā explicitly ties eating to devotional offering, whereas the Tao Te Ching remains
  non-theistic and focuses on natural balance.'
