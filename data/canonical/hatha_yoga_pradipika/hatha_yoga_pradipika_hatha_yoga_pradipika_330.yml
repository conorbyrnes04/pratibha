translation: With steady calm mind and half closed eyes, fixed on the tip of the nose, stopping the Ida
  and the Pingala without blinking, he or she who can see the light which is the all, the seed, the entire
  brilliant, great Tatwama, approaches Him, who is the great object. What is the use of more talk?
abhyasa: 'Sit quietly today for five minutes. Without strain, soften your gaze downward toward the tip
  of your nose (or simply close your eyes gently). Notice the quality of your breath and the steadiness
  of your mind. Rather than ''achieving'' anything, simply observe: What happens when attention becomes
  still and inward? What, if any, subtle luminosity or clarity arises in that quietness?'
