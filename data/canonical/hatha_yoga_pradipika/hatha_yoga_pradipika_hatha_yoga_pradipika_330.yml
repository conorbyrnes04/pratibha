  label: Translation
  body: With steady calm mind and half closed eyes, fixed on the tip of the nose, stopping the Ida and
    the Pingala without blinking, he or she who can see the light which is the all, the seed, the entire
    brilliant, great Tatwama, approaches Him, who is the great object. What is the use of more talk?
