title: Tratika destroys the eye diseases and removes…
unit_type: verse
commentary: 'This brief verse presents *tratika* (steady gazing, typically at a fixed point or light) as both a therapeutic
  and transformative practice—one that clears physical obstruction (eye disease) and mental dullness (sloth). The instruction
  to guard it ''like a box of jewelry'' suggests the practice holds value not because it is mystical, but because it is potent
  and easily misapplied; secrecy here means discretion, respect for the practice''s power, and the need for proper guidance—a
  common refrain in classical yoga texts about techniques that work directly with subtle energies.



  Key Terms



  **tratika** — Steady, unwavering gazing at a fixed point; a practice said to purify the eyes and settle the mind.

  **sloth** — Mental dullness, lethargy, or lack of clarity—one of the obstacles to yoga practice.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.14 (sa tu dīrgha-kāla...):** Both texts emphasize that yoga practice requires sustained, patient
  effort over time to bear fruit; tratika embodies this principle through the discipline of unwavering attention. Divergence:
  Patañjali speaks of practice in general; the Haṭha Yoga Pradīpikā isolates a specific technique and its concrete benefits
  (eye health, mental clarity).


  **Dhammapada, verse 282 (Appamādo amatapadaṁ...):** Both traditions identify heedfulness (or steady attention) as the path
  to liberation and warn against sloth as a primary obstacle. Divergence: The Buddha emphasizes ethical mindfulness; Svātmārāma
  grounds the same principle in a somatic, optical practice.'
