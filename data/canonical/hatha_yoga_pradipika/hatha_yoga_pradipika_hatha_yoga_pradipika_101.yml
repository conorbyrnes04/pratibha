  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Tratika destroys the eye diseases and removes sloth, etc. It should be kept secret very carefully, like a box
  of jewelry.
abhyasa: Today, sit in a quiet place and choose a steady point to gaze upon—a candle flame, a dot on a wall, or the horizon.
  Without strain, rest your eyes there for 1–2 minutes, blinking naturally. Notice any mental restlessness or heaviness that
  arises and passes. This is not a staring contest; it is an invitation to steadiness. Afterward, close your eyes gently and
  observe the quality of your attention.
