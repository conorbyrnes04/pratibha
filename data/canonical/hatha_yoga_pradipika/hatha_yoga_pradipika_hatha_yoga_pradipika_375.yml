translation: In the last stage, the sounds resemble those from tinklets, flute, Vina, bee, &c. These various
  kinds of sounds are heard as being produced in the body.
abhyasa: Sit quietly for 5–10 minutes in a comfortable upright posture. After a few minutes of natural
  breathing, gently close your ears with your thumbs (or simply listen inwardly without external sound).
  Notice any subtle tones, hums, or vibrations that arise—without forcing or imagining them. Simply observe
  what is already present. This simple listening is a threshold into the nāda tradition.
