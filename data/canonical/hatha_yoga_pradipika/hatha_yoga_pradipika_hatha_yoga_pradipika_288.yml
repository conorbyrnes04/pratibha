title: These are the Mudras
unit_type: verse
commentary: 'This opening statement frames mudrā (energetic seals or gestures) as a systematic teaching
  transmitted from Ādinātha (Śiva, the primordial teacher in haṭha yoga lineage) to the present. By asserting
  that each mudrā confers ''great accomplishments'' (siddhis), the text establishes mudrā not as mere
  physical gesture but as a potent technology of transformation—one that requires proper transmission
  and respect. The passage signals that what follows is not innovation but received wisdom, grounding
  the practitioner''s work in a lineage of authority.



  Key Terms



  **Mudrā** — A seal or gesture—physical, energetic, or symbolic—used in haṭha yoga practice to direct
  and concentrate prāṇa (vital force) and facilitate spiritual accomplishment.

  **Ādinātha** — The primordial or first teacher; in haṭha yoga tradition, identified with Śiva, the source
  of the teachings on yoga practice.

  **Siddhis** — Accomplishments, powers, or perfections that arise from sustained spiritual practice;
  here, the fruits of mudrā work.



  Cross-Tradition Resonances



  **Yoga Sūtras of Patañjali, I.14:** Both texts emphasize that practice (sādhana) must be grounded in
  continuity and respect for transmission (''sa tu dīrgha-kāla…''). The Haṭha Yoga Pradīpikā''s invocation
  of Ādinātha parallels Patañjali''s appeal to lineage authority. Divergence: Patañjali focuses on mental
  discipline and renunciation; the Haṭha Yoga Pradīpikā grounds accomplishment in embodied technique (mudrā,
  prāṇāyāma), treating the body as a vehicle rather than an obstacle.


  **Bhagavad Gītā, IV.1–2:** Both passages invoke a divine teacher (Śiva/Kṛṣṇa) and a lineage of transmission
  (''evam paramparā-prāptam''). Knowledge is presented as received, not invented. Divergence: The Gītā
  emphasizes knowledge (jñāna) and devotion; the Haṭha Yoga Pradīpikā privileges praxis—the actual performance
  of mudrā and breath—as the direct path.


  **Tao Te Ching, 10:** Both suggest that subtle, non-forceful techniques (mudrā as ''seal''; wu-wei as
  ''non-action'') yield profound results when aligned with natural principle. Divergence: The Tao Te Ching
  speaks of effortless harmony with the Way; the Haṭha Yoga Pradīpikā assumes disciplined, intentional
  practice under guidance as necessary for accomplishment.'
