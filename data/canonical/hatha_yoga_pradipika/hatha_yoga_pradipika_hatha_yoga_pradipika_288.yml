translation: These are the Mudras, as explained by Adinatha (Siva). Every one of them is the giver of
  great accomplishments to the practiser.
abhyasa: 'Sit quietly and consider: What does it mean for a gesture or seal to ''accomplish'' something?
  Rather than performing any mudrā, simply notice one gesture your body naturally makes when you are concentrated,
  calm, or intentional (hands at rest, a particular posture). Observe it without judgment. This plants
  the question: how might conscious gesture and inner state be woven together?'
