title: 'By nature, Mercury and mind are unsteady:'
unit_type: verse
commentary: 'This aphorism draws a parallel between the fluidity of mercury (a classical symbol of volatility
  and transformation) and the inherent restlessness of mind. The passage asserts that steadiness of mind
  is not a rare or supernatural attainment, but rather the key that unlocks all human potential—suggesting
  that most obstacles to accomplishment arise not from external limitation but from internal wavering.
  In the context of haṭha yoga, this frames the entire discipline as a practical technology for stabilizing
  what is naturally unstable, making the mastery of prāṇāyāma and mental focus foundational rather than
  optional.



  Key Terms



  **Mercury (Parada)** — In classical Indian thought, mercury symbolizes fluidity, changeability, and
  the principle of transformation; here used as a metaphor for the mind''s natural tendency toward instability.

  **Steadiness (Sthiratā)** — The quality of being firm, stable, and unwavering; in yoga philosophy, the
  prerequisite for all accomplishment and the direct aim of prāṇāyāma and meditation practices.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.26 (on the restless mind):** Both texts identify mind''s restlessness as the primary
  obstacle and emphasize disciplined practice as the remedy. Divergence: The Gītā frames steadiness as
  devotional surrender to Krishna; the Pradīpikā frames it as a technical achievement through breath and
  body control.


  **Heraclitus, Fragment 41 (on flux and stability):** Both recognize that change and fluidity are fundamental
  to nature, yet both imply that wisdom lies in perceiving or achieving stability within flux. Divergence:
  Heraclitus celebrates flux as the eternal principle; the Pradīpikā treats steadiness as the goal to
  be won through practice.


  **Dhammapada 33 (on guarding the mind):** Both traditions teach that mastery of mind is the foundation
  of all beneficial action and freedom. Divergence: The Dhammapada emphasizes ethical restraint and mindfulness;
  the Pradīpikā emphasizes energetic and physiological techniques specific to haṭha yoga.'
