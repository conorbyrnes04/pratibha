  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: 'By nature, Mercury and mind are unsteady: there is nothing in the world which cannot be
  accomplished when these are made steady.'
abhyasa: 'Today, notice one moment when your attention scatters—during a conversation, a task, or a transition.
  Rather than judging it, simply pause and ask: *What would this action or thought look like if my attention
  were fully gathered here?* Return to it once, deliberately. This small act honors the teaching without
  requiring formal practice.'
