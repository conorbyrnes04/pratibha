  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Neti is the cleaner of the brain and giver of divine sight. It soon destroys all the diseases of the cervical
  and scapular regions.
abhyasa: 'Today, observe the quality of your breath and attention. Notice where you hold tension in the neck, shoulders, or
  jaw. Without forcing, gently bring awareness to the space between your eyebrows and the crown of your head. Sit quietly
  for a few minutes and ask: what would it mean to ''see'' more clearly if the obstacles in my body were removed? This is
  contemplation, not technique.'
