translation: In order, therefore, to awaken this goddess, who is sleeping at the entrance of Brahma Dwara
  (the great door), mudras should be practiced well.
abhyasa: Today, sit quietly and place your awareness at the base of your spine. Without forcing or visualizing,
  simply notice the quality of sensation or presence there. Bring gentle attention to this place for 3–5
  minutes, as an act of respectful acknowledgment. This is not technique but contemplative familiarization
  with the location the text names.
