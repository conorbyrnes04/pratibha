translation: Sitting with Mukta âsana and with the Sambhavi Mudra, the Yogi or Yogini should hear the
  sound inside his or her right ear, with collected mind.
abhyasa: Sit comfortably with your spine upright. Soften your gaze slightly inward and upward (toward
  the space between the eyebrows), without strain. Gently direct your attention to the interior space
  of your right ear. Rather than listening *for* sound, simply notice what is already present—a hum, a
  tone, a vibration. Do this for 5–10 minutes with an attitude of patient, non-grasping attention. If
  the mind wanders, return it gently.
