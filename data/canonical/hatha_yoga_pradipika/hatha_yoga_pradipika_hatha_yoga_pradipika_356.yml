title: Sitting with Mukta âsana and with the Sambhavi…
unit_type: verse
commentary: 'This passage describes a foundational practice of internal listening: the yogi sits in an
  open, comfortable posture and directs attention inward to subtle sound perceived in the right ear, using
  a specific gaze (Sambhavi Mudra) to steady the mind. The instruction assumes that sound—not external
  noise, but an inner vibration or resonance—is accessible to a collected, attentive consciousness, and
  that hearing it is part of the yogic path toward deeper states of awareness.



  Key Terms



  **Mukta āsana** — A comfortable, stable seated posture; literally ''liberated pose''—any position that
  allows the spine to be upright and the body relaxed for meditation.

  **Sambhavi Mudra** — A gesture or inward gaze in which the eyes are directed toward the space between
  the eyebrows or inward, used to concentrate and interiorize the mind.



  Cross-Tradition Resonances



  **Upaniṣads (Śvetāśvatara Upaniṣad 2.12):** Both texts point to an inner sound or vibration (nāda) as
  a gateway to higher consciousness; the Upaniṣads speak of hearing the eternal sound within meditation.
  Divergence: The Upaniṣads emphasize the sound as cosmic principle (brahman); the Pradīpikā presents
  it as a practical technique within a systematic bodily discipline.


  **Meister Eckhart, ''Detachment and Poverty of Spirit'':** Both traditions value a collected, inward-turned
  attention as the condition for encountering what is subtle and true; both require quieting the ordinary
  mind. Divergence: Eckhart''s emphasis is on emptiness and union with the divine will; the Pradīpikā''s
  is on perception of subtle energies and sound as a rung on the ladder to samādhi.'
