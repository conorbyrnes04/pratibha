translation: The fire, catching firewood, is extinguished along with it (after burning it up); and so
  the mind also, working with the nada, becomes latent along with it.
abhyasa: Sit quietly and listen inwardly for the subtle sound or vibration (nada) within—a high-pitched
  tone, hum, or resonance that arises in stillness. Rather than chasing it, simply rest your attention
  there without effort. Notice how, as your mind settles into this listening, the usual chatter and movement
  of thought naturally quiets, like a fire consuming its last fuel.
