title: The fire, catching firewood, is extinguished along…
unit_type: verse
commentary: 'This passage uses the metaphor of fire consuming its fuel to describe how the mind, when
  absorbed in the subtle sound (nada), dissolves into stillness. The fire does not persist after its work
  is done; similarly, the mind engaged in nada-yoga does not remain as a separate, active force but becomes
  latent—present but quiescent. The image suggests that yoga practice is not about suppressing the mind
  through force, but allowing it to exhaust itself naturally through focused engagement, leaving only
  undisturbed awareness.



  Key Terms



  **nada** — The subtle, inner sound or vibration perceived in deep meditation; used in haṭha yoga as
  a focal point for the mind''s absorption.

  **latent** — Present but inactive or dormant; in this context, the mind''s state of being conscious
  yet without movement or disturbance.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts describe the sage as one who becomes still and empty, allowing
  natural processes to complete themselves without interference. Divergence: The Tao Te Ching emphasizes
  non-action (wu wei) as a way of life; the Haṭha Yoga Pradīpikā prescribes specific practices (nada-yoga)
  as the means to reach that stillness.


  **Dhammapada, v. 383-384:** Both teach that the mind, when properly engaged, naturally ceases its restless
  seeking and finds peace. Divergence: The Dhammapada emphasizes ethical conduct and mindfulness of impermanence;
  this passage focuses on absorption in subtle sound as the vehicle.


  **Meister Eckhart, ''Sermon 52'':** Both describe a state where the individual will or mind ''lets go''
  and becomes one with a deeper reality, leaving no separate agent. Divergence: Eckhart frames this as
  union with God through negation of self; the Haṭha Yoga Pradīpikā frames it as the mind''s natural dissolution
  through engagement with nada.'
