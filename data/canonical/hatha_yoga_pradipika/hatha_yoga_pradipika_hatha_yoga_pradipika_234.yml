translation: The Kundalini, which has been sleeping all this time, becomes well heated by this means and
  awakens well. It becomes straight like a serpent, struck dead with a stick.
abhyasa: Sit quietly and observe the base of your spine. Without forcing, notice any subtle sensations
  of warmth or tingling there. Breathe slowly and evenly for several minutes, imagining gentle heat building
  in that region. This is not an advanced practice, but a simple way to develop awareness of the body's
  interior landscape that yogic texts assume.
practice: Sit quietly and observe the base of your spine. Without forcing, notice any subtle sensations
