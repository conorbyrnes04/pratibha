title: 'The six kinds of duties are:'
unit_type: verse
commentary: 'Svātmārāma opens the section on cleansing practices (śaṭ-karma) by naming six preparatory
  actions that purify the body''s channels and organs. These are not ornamental but foundational: the
  text treats them as duties (karma), suggesting they are obligations for serious practitioners. By listing
  them plainly and calling them ''actions,'' the passage establishes that haṭha yoga begins with concrete,
  embodied work—not philosophy or visualization, but systematic physical purification as the ground for
  breath and mind practices to follow.



  Key Terms



  **śaṭ-karma (six actions)** — The six purificatory practices named in this passage: foundational physical
  and organ-cleansing techniques in haṭha yoga, traditionally taught by a qualified teacher before advancing
  to prāṇāyāma and meditation.

  **Dhauti, Basti, Neti, Trataka, Nauti, Kapala Bhati** — The six specific cleansing practices listed;
  their precise methods are taught orally and are not detailed in this passage alone.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.28 (Patañjali): ''yogāṅgānuṣṭhānād aśuddhi-kṣaye jñāna-dīptir ā-viveka-khyāteḥ'' (By
  practicing the limbs of yoga, impurity is destroyed; knowledge shines forth, leading to discrimination):**
  Both texts present purification as prerequisite to higher knowledge. The Sūtra frames it philosophically
  as the removal of obscuration; the Pradīpikā names it as concrete duty. Divergence: The Sūtra speaks
  of purification abstractly as a fruit of all eight limbs; the Pradīpikā isolates six physical techniques
  as the first, necessary step.


  **Taoist inner alchemy (Neidan): emphasis on circulating and refining vital essences through channels,
  beginning with purification of organs:** Both traditions recognize the body as a system of channels
  requiring cleansing before energy work; both treat this as foundational, not optional. Divergence: Haṭha
  yoga''s śaṭ-karma are specific, named, teachable actions; Taoist practice often emphasizes internal
  visualization and microcosmic circulation rather than external cleansing techniques.


  **Maimonides (Mishneh Torah, Laws of Ethical Conduct): emphasis on physical health and bodily discipline
  as preparation for intellectual and spiritual work:** Both recognize that the body must be tended and
  purified before higher faculties can function properly. Divergence: Maimonides frames bodily care as
  hygiene and moral discipline; the Pradīpikā treats it as systematic yogic technique with specific energetic
  purposes.'
