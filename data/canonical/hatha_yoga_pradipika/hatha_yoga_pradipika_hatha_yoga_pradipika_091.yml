translation: 'The six kinds of duties are: Dhauti, Basti, Neti, Trataka, Nauti and Kapala Bhati. These
  are called the six actions.'
abhyasa: Read through the six names slowly, noticing which ones are unfamiliar. If you have access to
  a qualified teacher, ask them to explain one of these practices and its purpose. If not, simply sit
  with the fact that these traditions recognize the body as needing deliberate cleansing before subtler
  work begins—and reflect on what 'cleansing' might mean in your own practice.
