translation: The mind, captivated in the snare of nada, gives up all its activity; and, like a bird with
  clipped wings, becomes calm at once.
abhyasa: Sit quietly today and listen for the subtle inner sound—a high-pitched tone, hum, or vibration
  often heard in deep silence. Do not strain; simply notice if it arises. When you find it, rest your
  attention there gently for a few minutes. Observe whether your thinking slows or stills.
