title: The mind, captivated in the snare of nada, gives up…
unit_type: verse
commentary: 'This verse uses the metaphor of sound (nada) as a trap that stills the restless mind—not
  through force, but through captivation. The image of a bird with clipped wings suggests that when attention
  is absorbed in the subtle vibration of nada, the mind''s habitual outward-seeking ceases naturally,
  and stillness emerges. The passage presents a paradox: constraint becomes liberation, and loss of activity
  becomes gain.



  Key Terms



  **nada** — The inner sound or vibration; in haṭha yoga, a subtle auditory phenomenon used as an object
  of meditation to stabilize and absorb the mind.

  **samādhi** — Absorption or unified consciousness; the goal toward which practices like nada meditation
  are directed.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts point to stillness and simplicity as the fruit of practice: ''The
  ancient masters were profound and subtle... because they were subtle, they can only be described with
  difficulty.'' Divergence: The Tao Te Ching emphasizes wordless knowing and paradox; the Haṭha Yoga Pradīpikā
  offers a concrete sonic technique to reach that state.


  **Bhagavad Gītā 6.26:** Both teach that the restless mind can be steadied through focused practice:
  ''Wherever the mind wanders, unsteady and distracted, from there one should bring it back and fix it
  on the Self.'' Divergence: The Gītā emphasizes the Self as the anchor; the Pradīpikā uses nada—an external-yet-internal
  phenomenon—as the specific tool.


  **Meister Eckhart, ''Talks of Instruction'':** Both suggest that true stillness comes not from effort
  but from surrender: ''A person should be so poor that he is not and has not any place that God can work
  in.'' Divergence: Eckhart frames this as emptiness before God; the Pradīpikā frames it as the mind''s
  natural response when captivated by nada.'
