title: Other postures are of no use
unit_type: verse
commentary: 'This verse distills the haṭha yoga path to its essential elements: a stable seated posture
  (Siddhāsana) and mastery of breath retention (Kevala Kumbhaka), which together calm the vital force
  (Prāṇa Vāyu). The claim is radical—once these two are perfected, other postures become superfluous—suggesting
  that yoga''s aim is not physical virtuosity but the stilling of the life-force itself. This economy
  of means reflects the text''s pragmatic view: the body is a vehicle for subtle transformation, not an
  end in itself.



  Key Terms



  **Siddhāsana** — A seated posture traditionally used for meditation and breath work; literally ''the
  perfected pose,'' associated with stability and readiness for prāṇāyāma.

  **Prāṇa Vāyu** — The vital life-force or breath-energy in the body; one of five main currents of prāṇa
  in classical yoga anatomy.

  **Kevala Kumbhaka** — Breath retention without preceding inhalation or exhalation; the ''isolated''
  or ''natural'' hold, considered an advanced state in prāṇāyāma practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''Sthira sukham āsanam'' (posture should be steady and comfortable):**
  Both texts prioritize stability and ease over complexity; the body is a foundation, not a display. Divergence:
  Patañjali speaks of āsana in general terms; Svātmārāma names a specific seat and links it directly to
  breath mastery, making the posture inseparable from prāṇāyāma.


  **Taoist internal alchemy (Neidan): emphasis on ''gathering the breath'' and stillness of the life-force:**
  Both traditions see breath-control as the gateway to subtle transformation; both value economy and precision
  over quantity of practice. Divergence: Taoism often emphasizes circulation and microcosmic orbit; the
  Haṭha Yoga Pradīpikā here stresses *restraint* and *calm* as the goal, not movement.


  **Bhagavad Gītā 6.11-12: ''In a clean place, seated firm, one should practice yoga for the purification
  of the self'':** Both texts link posture, place, and inner purification; both see external form as supporting
  inner work. Divergence: The Gītā emphasizes moral and mental discipline alongside posture; the Haṭha
  Yoga Pradīpikā isolates the breath-body nexus as primary.'
