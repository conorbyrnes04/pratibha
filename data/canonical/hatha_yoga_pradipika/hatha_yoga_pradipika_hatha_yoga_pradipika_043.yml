translation: Other postures are of no use, when success has been achieved in Siddhâsana, and Prâna Vâyu
  becomes calm and restrained by Kevala Kumbhaka.
abhyasa: Sit comfortably today and observe your natural breath for five minutes without changing it. Notice
  where you feel movement—chest, belly, nostrils. This simple witnessing is the ground of all prāṇāyāma.
  No retention needed; just familiarity with the breath as a living, responsive current.
