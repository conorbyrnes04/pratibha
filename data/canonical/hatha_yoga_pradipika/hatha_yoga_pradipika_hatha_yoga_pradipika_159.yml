unit_label: On Prāṇāyāma — 2.90
title: Closing the passages with Jalandhar Bandha firmly
unit_type: verse
commentary: 'This verse describes a specific prāṇāyāma technique—Murchha—that combines throat lock (Jalandhar
  Bandha), breath retention after inhalation (Puraka), and slow exhalation to produce a state of mental
  suspension or swoon. The term ''murchha'' (swooning) names both the technique and its effect: a temporary
  dissolution of ordinary mental activity that brings ease. The passage treats a physical practice as
  a direct means to alter consciousness, suggesting that precise control of breath and energy channels
  yields states beyond ordinary thought.



  Key Terms



  **Jalandhar Bandha** — A throat lock created by pressing the chin toward the chest, used to direct and
  contain prāṇa (vital energy) during breath work.

  **Puraka** — The inhalation phase of prāṇāyāma; here, the breath is held after filling the lungs.

  **Murchha** — Literally ''swooning'' or fainting; a prāṇāyāma technique that induces a state of mental
  suspension and comfort through controlled breath and bandha.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.2 (yogaś chitta-vṛtti-nirodhah):** Both texts treat yoga as a stilling
  of mental fluctuations; Murchha achieves this through breath control rather than direct meditation.
  Divergence: Patañjali emphasizes restraint of thought-waves as the definition of yoga itself, while
  the Pradīpikā treats prāṇāyāma as a preparatory tool for that state.


  **Tao Te Ching, ch. 15 (the sage moves like water, holds stillness):** Both traditions value a state
  of ease and non-resistance; Murchha''s ''comfort'' echoes the Taoist ideal of effortless action. Divergence:
  The Tao Te Ching teaches non-action (wu wei) as natural; the Pradīpikā prescribes precise technical
  effort to reach a similar quietude.


  **Meister Eckhart, ''the soul must become empty'':** Both point to a temporary emptying or suspension
  of ordinary consciousness as spiritually significant. Divergence: Eckhart frames emptiness as receptivity
  to divine presence; the Pradīpikā frames it as a physiological state conducive to samādhi, without explicit
  theological language.'
