translation: Closing the passages with Jalandhar Bandha firmly at the end of Puraka, and expelling the
  air slowly, is called Murchha, from its causing the mind to swoon and give comfort.
abhyasa: Today, sit comfortably and observe your natural breath for a few cycles. Then, on an inhalation,
  gently press your chin toward your chest (Jalandhar Bandha), hold the breath briefly, and exhale slowly
  through the nose. Notice any lightness, quieting, or subtle shift in awareness. Do this no more than
  3–5 times. This is observation only—not instruction; a qualified teacher is needed for safe practice.
practice: Today, sit comfortably and observe your natural breath for a few cycles. Then, on an inhalation,
  gently press your chin toward your chest (Jalandhar Bandha), hold the breath briefly, and exhale slowly
  through the nose. Notice any lightness, quieting, or subtle shift in awareness. Do this no more than
  3–5 times. This is observation only—not instruction; a qualified teacher is needed for safe practice.
