translation: There is no doubt, that cough, asthma, enlargement of the spleen, leprosy, and 20 kinds of
  diseases born of phlegm, disappear by the practice of Dhauti Karma
abhyasa: 'Today, reflect on one chronic physical complaint you carry. Rather than seeking immediate remedy,
  sit quietly and ask: what imbalance in my body or breath might underlie this? Notice without judgment.
  This mirrors the diagnostic posture of haṭha yoga—seeing the body as a system of flows and blockages,
  not isolated symptoms.'
