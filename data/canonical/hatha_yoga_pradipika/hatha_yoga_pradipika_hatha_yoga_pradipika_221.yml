translation: Uddiyana is so called by the Yogis and Yoginis, because by its practice the Prana (vayu),
  flies (flows) in the Susumna.
abhyasa: 'Sit quietly and observe where your breath naturally moves—chest, belly, nostrils. Without forcing,
  notice: what would it mean for your vital energy to ''fly'' or gather in a central channel rather than
  scatter outward? This contemplation prepares the ground for understanding why such practices exist.'
