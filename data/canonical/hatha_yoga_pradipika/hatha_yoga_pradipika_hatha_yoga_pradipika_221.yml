title: Uddiyana is so called by the Yogis and Yoginis…
unit_type: verse
commentary: 'This verse names a foundational bandha (energy lock) and explains its purpose: uddiyana redirects
  the life-force (prāṇa) into the central channel (suṣumnā), the pathway of ascent toward higher states.
  The term itself—''flying'' or ''flowing upward''—describes both the physical action and its energetic
  result. For Svātmārāma, technique and outcome are inseparable: the practice IS the redirection.



  Key Terms



  **uddiyana** — A bandha (energetic lock) in haṭha yoga, literally ''flying upward''; traditionally involves
  abdominal engagement to redirect prāṇa into the suṣumnā.

  **suṣumnā** — The central energy channel of the subtle body, running along the spine; the primary pathway
  through which prāṇa ascends toward higher consciousness.

  **prāṇa** — Life-force or vital energy; in yoga physiology, the animating power that flows through channels
  (nāḍī) in the subtle body.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts describe a subtle, invisible force (prāṇa / tao) that flows through
  the body-cosmos and can be harmonized through practice and attention. Divergence: The Tao Te Ching emphasizes
  receptivity and non-action (wu wei); the Haṭha Yoga Pradīpikā prescribes specific, deliberate techniques
  to redirect energy.


  **Upaniṣads (e.g., Kaṭha Upaniṣad, II.3.16):** Both root yoga practice in the idea that consciousness
  ascends through a central channel when the senses and mind are stilled. Divergence: The Upaniṣads emphasize
  knowledge and meditation; the Pradīpikā foregrounds embodied technique (āsana, prāṇāyāma, bandha) as
  the means.'
