  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: He or she should resign the fruits of all he or her practice reverently to God, and, on rising
  on completion of the practice, a warm bath should be taken.
abhyasa: After any physical practice today—yoga, exercise, or even focused work—pause and consciously
  release the outcome. Acknowledge any sense of accomplishment or fatigue, then mentally offer it to what
  you understand as sacred or greater than yourself. Notice how this shift in intention changes your sense
  of the effort.
