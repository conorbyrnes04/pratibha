unit_label: On Prāṇāyāma — 2.64
title: He or she should resign the fruits of all he or her…
unit_type: verse
commentary: 'This brief instruction anchors the physical discipline of haṭha yoga in devotion and humility:
  the practitioner is asked to offer the results of effort to the divine rather than claim them as personal
  attainment. The prescription for a warm bath after practice is both practical (cooling the body after
  internal heat work) and symbolic—a ritual closure that honors the body as a vessel and resets the practitioner
  for ordinary life. Together, these gestures prevent spiritual pride and integrate practice into a life
  of reverence.



  Key Terms



  **haṭha yoga** — The yoga of force or effort; a systematic path using physical postures (āsana), breath
  control (prāṇāyāma), and energetic locks (bandha) to prepare the body and mind for higher states of
  meditation and union (samādhi).

  **resignation of fruits** — The renunciation of personal claim to the results of one''s practice; offering
  outcomes to the divine rather than ego, a principle rooted in bhakti (devotion) and karma yoga.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts teach that yoga involves right action without
  attachment to results; the Gītā frames this as *yoga* itself, while the Pradīpikā applies it specifically
  to physical practice. Divergence: The Gītā addresses all action in life; the Pradīpikā focuses narrowly
  on the completion of a discrete practice session.


  **Meister Eckhart, ''Detachment'' sermons:** Both emphasize releasing personal will and claim to outcomes
  as essential to spiritual work; both see this as liberation from ego. Divergence: Eckhart frames detachment
  as a state of consciousness; the Pradīpikā embeds it in a concrete ritual (offering + bathing) that
  marks the boundary of practice.


  **Tao Te Ching 48 (the sage does nothing, yet nothing remains undone):** Both suggest that true efficacy
  comes through non-grasping and alignment with something larger than personal will. Divergence: The Tao
  Te Ching speaks of effortless action in the world; the Pradīpikā prescribes deliberate effort *within*
  practice, then release of its fruits.'
