  body: 'The two Nadis should be stopped firmly by contracting the throat. This is called the middle circuit
    or center (Madhya Chakra), and it stops the 16 adharas (i.e., vital parts). (Note: The sixteen vital
    parts mentioned by renowned Yogis and Yoginis are the (1) thumbs, (2) ankles, (3) knees, (5) the prepuce,
    (6) organs of generation, (7) the navel, (8) the heart, (9) the neck, (10) the throat, (11) the palate,
    (12) the nose, (13) the middle of the eyebrows, (14) the forehead, (15) the head and (16) the Brahmarandra.)'
