title: The two Nadis should be stopped firmly by contracting
unit_type: verse
commentary: 'This passage describes a prāṇāyāma technique in which the throat is contracted to redirect
  energy through the central channel (Suṣumnā Nāḍī), the ''middle circuit.'' The enumeration of sixteen
  vital points—from the physical (thumbs, knees) to the subtle (the space between the eyebrows, the crown)—suggests
  that haṭha yoga treats the body not as merely material but as a map of energy centers and thresholds.
  By ''stopping'' these points through breath control, the practitioner is said to stabilize and gather
  vital force, preparing the ground for deeper meditative states.



  Key Terms



  **Madhya Chakra** — The ''middle circuit'' or central channel; in this passage, the pathway created
  when the two lateral energy channels (Idā and Piṅgalā) are stilled through throat contraction, allowing
  prāṇa to flow upward through the center.

  **Adhāra** — Vital points or ''supports'' in the body—both gross (physical joints and organs) and subtle
  (energy centers)—that are stabilized and integrated through yogic practice.

  **Brahmarandhra** — The ''aperture of Brahmā''; the crown of the head, traditionally understood as the
  highest vital point and the gateway to transcendent consciousness.



  Cross-Tradition Resonances



  **Tao Te Ching, Ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts emphasize stillness
  and settling as prerequisites for clarity; the Haṭha Yoga Pradīpikā''s ''stopping'' of the nāḍīs parallels
  the Taoist image of allowing turbulence to subside. Divergence: The Tao Te Ching speaks of natural,
  effortless settling, while the Haṭha text prescribes deliberate physical technique (throat contraction)
  to achieve stabilization.


  **Patañjali''s Yoga Sūtra 2.46: ''Āsana is steady and comfortable.'':** Both root yoga in the body''s
  stability and ease; the Haṭha text''s enumeration of vital points extends Patañjali''s principle into
  a detailed somatic map. Divergence: Patañjali emphasizes the mental quality (steadiness and ease) that
  āsana produces, while the Haṭha Pradīpikā focuses on the energetic and anatomical specifics of prāṇa
  control.


  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.3.13): ''The wise know the Self as eternal, while the foolish run
  after desires.'':** Both traditions posit a subtle, luminous center (the Self / Brahmarandhra) accessible
  through disciplined inner work, not mere intellectual knowledge. Divergence: The Upaniṣads approach
  this center through meditation and knowledge (jñāna), while the Haṭha Pradīpikā emphasizes embodied
  technique (kriyā and prāṇāyāma) as the primary path.'
