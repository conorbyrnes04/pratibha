abhyasa: Today, sit quietly and bring gentle awareness to your throat. Without forcing, notice the natural
  passage of breath there. Imagine a thread of light running from the base of your spine to the crown
  of your head. As you exhale slowly, sense this central channel becoming steady and luminous. Return
  to ordinary breathing. This is not the full technique—only a contemplative acknowledgment of the body's
  inner geography.
