translation: O immortal one (that is, the yogi or yogini who has attained to the condition of Samadhi),
  I salute thee! Even death itself, into whose mouth the whole of this moveable and immovable world has
  fallen, has been conquered by thee.
abhyasa: 'Sit quietly today and notice one moment when your sense of ''I'' or ''self'' loosens—in deep
  listening, absorption in work, or simple presence. Do not force it. Afterward, reflect: what felt different
  about that moment? This small opening may hint at the stability and freedom the text associates with
  samādhi.'
