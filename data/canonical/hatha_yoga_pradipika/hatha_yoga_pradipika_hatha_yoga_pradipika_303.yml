unit_label: On Samādhi — 4.13
title: O immortal one
unit_type: verse
commentary: 'This verse honors the yogi who has realized samādhi—a state of absorption beyond ordinary
  consciousness—as having transcended even death itself. The passage suggests that samādhi is not merely
  a mental state but a transformation so complete that the yogi moves beyond the universal condition of
  mortality that binds all creatures. The salutation (''I salute thee'') frames this realization not as
  superhuman fantasy but as an actual human achievement worthy of reverence, grounding the text''s promise
  that yoga leads to liberation.



  Key Terms



  **samādhi** — A state of profound meditative absorption in which the distinction between observer and
  observed dissolves; the culmination of yoga practice and the gateway to liberation.

  **haṭha yoga** — The yoga of force or effort; the systematic practice of āsana (posture), prāṇāyāma
  (breath control), and other techniques to prepare the body and mind for higher states of consciousness.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.20 (''na jāyate mriyate vā kadācit''—the Self is never born nor does it die):** Both
  texts point to a deathless reality accessible through spiritual practice; the Gītā speaks of the eternal
  ātman, the Pradīpikā of the yogi''s realization of it. Divergence: The Gītā emphasizes the Self''s inherent
  eternality as metaphysical truth; the Pradīpikā emphasizes the yogi''s *conquest* of death through disciplined
  practice, suggesting transformation rather than mere recognition.


  **Patañjali''s Yoga Sūtra 1.2 (''yogaś citta-vṛtti-nirodhah''—yoga is the cessation of mental fluctuations):**
  Both texts treat yoga as a path to a radically altered state of consciousness in which ordinary limitations
  fall away. Divergence: Patañjali defines yoga functionally (cessation of thought-patterns); the Pradīpikā
  celebrates its fruit (conquest of death), emphasizing embodied practice and grace.


  **Katha Upaniṣad 1.2.25 (''nāyam ātmā pravacanena labhyaḥ''—the Self is not attained by mere words):**
  Both texts insist that liberation requires direct realization, not intellectual knowledge alone; both
  honor the accomplished sage. Divergence: The Upaniṣad stresses the Self''s transcendence of speech and
  intellect; the Pradīpikā grounds realization in concrete bodily techniques—breath, posture, and energy
  channels.'
