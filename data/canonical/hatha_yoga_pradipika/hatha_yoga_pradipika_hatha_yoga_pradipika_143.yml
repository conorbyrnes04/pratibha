translation: It destroys the defects of the nadis, dropsy and disorders of Dhatu (humors). Ujjayi should
  be performed in all conditions of life, even while walking or sitting.
abhyasa: 'Today, practice Ujjayi breathing for 2–3 minutes while sitting quietly: inhale through the nose
  with a slight constriction in the throat (creating a soft ocean-like sound), exhale the same way. Notice
  any shift in mental clarity or ease in the body. You need not understand the nāḍīs to sense its calming
  effect.'
