title: Salutation to the Lord of the Nagas
unit_type: verse
commentary: 'This passage opens the Haṭha Yoga Pradīpikā with reverence to Śeṣa, the cosmic serpent who
  upholds existence itself, establishing that physical practice is not mere exercise but an act within
  a sacred cosmos. The instruction that follows is pragmatic: āsana practice should be matched to the
  body''s actual condition—rest (śavāsana) is prescribed only when fatigue appears, not as routine. This
  reflects a core principle of haṭha yoga: attunement to the body''s present state, not blind adherence
  to form.



  Key Terms



  **āsana** — A steady, comfortable physical posture; in haṭha yoga, the foundation of embodied practice.

  **śavāsana** — The corpse pose; a state of complete rest and receptivity, used to integrate the effects
  of practice.

  **Śeṣa** — The infinite serpent of Hindu cosmology who supports all worlds; invoked here as the sustaining
  principle underlying physical existence.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts emphasize yoga as a disciplined engagement
  with one''s actual condition rather than abstract perfection. Divergence: The Gītā frames this within
  duty and renunciation; the Pradīpikā grounds it in somatic attunement and the body''s wisdom.


  **Aristotle, Nicomachean Ethics (virtue as habituation and mean):** Both suggest that practice must
  be calibrated to present capacity, not imposed uniformly. Divergence: Aristotle seeks ethical mean through
  reason; the Pradīpikā seeks it through direct bodily sensing and cosmic alignment.


  **Daoism, Zhuangzi (wu wei, non-forcing action):** Both reject rigid adherence to form in favor of responsiveness
  to what is. Divergence: Daoism emphasizes spontaneous naturalness; the Pradīpikā situates this within
  a structured, hierarchical cosmology and lineage transmission.'
