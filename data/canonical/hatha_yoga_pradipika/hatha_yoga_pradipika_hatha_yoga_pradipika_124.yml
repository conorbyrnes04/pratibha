  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Salutation to the Lord of the Nagas, who is adorned with thousands of heads, set with brilliant
  jewels (manis), and who has sustained the whole universe, nourishes it, and is infinite. After this
  he or she should begin his or her exercise of âsanas and when fatigued, he or she should practice sava
  âsana. Should there be no fatigue, he or she should not practice it.
