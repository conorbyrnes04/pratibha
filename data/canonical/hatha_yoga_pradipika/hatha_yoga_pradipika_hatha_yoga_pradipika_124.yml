  body: Salutation to the Lord of the Nagas, who is adorned with thousands of heads, set with brilliant
    jewels (manis), and who has sustained the whole universe, nourishes it, and is infinite. After this
    he or she should begin his or her exercise of âsanas and when fatigued, he or she should practice
    sava âsana. Should there be no fatigue, he or she should not practice it.
