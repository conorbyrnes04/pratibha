  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Mind gets the properties of calcined mercury. When deprived of its unsteadiness it is calcined,
  combined with the sulphur of nada, and then it roams like it in the supportless akasa or Brahma.
abhyasa: Sit quietly for 5–10 minutes. Notice the restlessness of your ordinary mind (its 'unsteadiness').
  Then, without forcing, listen inwardly for any subtle sound or vibration—the nāda. Let attention rest
  there gently. Observe whether the mind, when gathered around this inner sound, becomes less scattered.
  This is a simple entry into the passage's teaching.
