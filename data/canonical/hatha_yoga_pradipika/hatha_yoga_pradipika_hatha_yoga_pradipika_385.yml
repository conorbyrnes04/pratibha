title: Mind gets the properties of calcined mercury
unit_type: verse
commentary: 'This passage uses alchemical metaphor to describe the transformation of mind through yogic
  practice. The ''calcining'' of mercury (a classical alchemical image of purification and fixation) represents
  the stilling of mental fluctuation; when mind is stabilized and united with nāda (the inner sound or
  vibration), it transcends ordinary support and dwells in the formless expanse of Brahma. The image suggests
  that disciplined practice renders the mind incorruptible and capable of abiding in non-dual awareness.



  Key Terms



  **nāda** — The inner sound or vibration; in haṭha yoga, a subtle auditory phenomenon used as an anchor
  for meditation and a sign of prāṇic refinement.

  **ākāśa** — Space or ether; here, the formless, unsupported expanse into which the stilled mind enters—a
  state beyond ordinary mental content.

  **Brahma** — In this context, the ultimate reality or non-dual consciousness; the ground into which
  the perfected mind dissolves.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś citta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts identify the stilling of mind-fluctuation as the core aim; the Haṭha Yoga Pradīpikā adds
  an alchemical and sonic dimension to how that stilling is achieved and experienced. Divergence: Patañjali''s
  sūtra is aphoristic and universal; Svātmārāma''s passage is concrete and embodied, grounding the teaching
  in prāṇic and sensory practice.


  **Taittirīya Upaniṣad (2.1): ''From ākāśa, vāyu is born; from vāyu, agni...'' (the emanation of elements
  from space):** Both texts treat ākāśa as a fundamental principle—here, the ultimate ground or container
  into which consciousness returns. Divergence: The Upaniṣad describes cosmic emanation; the Pradīpikā
  describes individual transformation and the mind''s entry into that formless space.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both passages
  point to a non-dual union in which the observer and the observed, or the mind and its ground, become
  one. Divergence: Eckhart emphasizes divine reciprocity and personhood; Svātmārāma emphasizes the impersonal,
  alchemical perfection of the instrument (mind) itself.'
