title: As with air, in and out of the body, remains…
unit_type: verse
commentary: 'This verse teaches that when the breath (prāṇa) is stilled and centered—like air that moves
  neither in nor out—the mind naturally becomes stable and fixed in the highest center (Brahma randhra,
  the crown aperture). The image suggests that breath and mind are not separate: mastery of one brings
  mastery of the other. This is the practical foundation of haṭha yoga''s claim to serve rāja yoga (the
  yoga of mind): by anchoring the breath, the practitioner anchors consciousness itself.



  Key Terms



  **prāṇa** — Life force or vital breath; in this context, the subtle energy that moves with the physical
  breath and can be directed through practice.

  **Brahma randhra** — Literally ''the aperture of Brahma''; the highest energy center in the subtle body,
  located at the crown of the head, associated with transcendent consciousness.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts locate yoga''s goal in the stilling of mind; the Pradīpikā offers breath-work as the practical
  means to achieve what the Sūtra names as the definition. Divergence: The Sūtra emphasizes mind directly;
  the Pradīpikā emphasizes the body-breath pathway as the entry point, reflecting haṭha yoga''s distinctive
  somatic approach.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of
  their knowledge is unfathomable... Who can wait quietly while the mud settles?'':** Both texts prize
  stillness and the settling of turbulence (mental or elemental) as a path to clarity and wisdom. Divergence:
  The Tao Te Ching emphasizes receptive waiting; the Pradīpikā describes active regulation of breath-energy,
  reflecting yoga''s more interventionist somatic discipline.


  **Meister Eckhart: ''Blessed are the pure in heart, for they shall see God... Purity means that the
  soul is so completely unified and gathered into itself that nothing can scatter it.'':** Both passages
  locate spiritual realization in the unification and stabilization of consciousness, moving from multiplicity
  to singular focus. Divergence: Eckhart frames this as moral and contemplative grace; the Pradīpikā frames
  it as a technical result of breath mastery, grounding the work in physiology.'
