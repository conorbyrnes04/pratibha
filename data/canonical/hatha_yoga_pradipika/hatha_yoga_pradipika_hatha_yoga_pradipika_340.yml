translation: As with air, in and out of the body, remains unmoved, so the breath with mind becomes steady
  in its place (i.e., in Brahma randhra).
abhyasa: Today, sit quietly and observe your natural breath without forcing it. Notice moments when your
  breath becomes still or subtle—perhaps between the inhale and exhale. In those moments, gently note
  where your awareness rests. This simple observation (not technique) begins to reveal the intimate link
  between breath stability and mental steadiness that the text describes.
