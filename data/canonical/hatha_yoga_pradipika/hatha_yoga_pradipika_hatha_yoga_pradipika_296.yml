  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When the Prana becomes lean (vigourless) and the mind becomes absorbed, then their becoming equal is called Samadhi.
abhyasa: Sit quietly for five minutes. Notice the quality of your breath—is it agitated, shallow, or coarse? Without forcing,
  simply observe. Then notice the quality of your mind—scattered, restless, or settled? Rather than trying to change either,
  watch whether they move together. This simple noticing begins to reveal the intimate link between prāṇa and mind that the
  text describes.
