commentary: 'This verse distills samādhi—the culmination of yoga practice—into a precise physiological and mental condition:
  the vital energy (prāṇa) loses its agitation and becomes subtle, while consciousness settles into absorption. The equation
  of prāṇa and mind in this state suggests they are not separate forces but aspects of a single unified condition. Samādhi
  here is not a distant mystical attainment but the natural result of systematic practice that quiets both breath-energy and
  thought.



  Key Terms



  **Prāṇa** — Vital life-force or breath-energy; in this context, the subtle energetic dimension of respiration that can become
  agitated or refined.

  **Samādhi** — Absorption or integration; a state in which prāṇa and mind become equal and unified, marking the threshold
  to higher yoga.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, 1.2:** Both texts define yoga as the stilling of mental fluctuations (citta-vṛtti-nirodha);
  Samādhi is the fruit of that stillness. Divergence: The Haṭha Yoga Pradīpikā emphasizes the prāṇa-body as the direct vehicle,
  whereas Patañjali''s sūtras approach samādhi primarily through mental discipline and discrimination.


  **Tao Te Ching, ch. 15:** Both texts suggest that mastery involves becoming ''lean'' or empty—the sage becomes ''subtle
  like mist''; here, prāṇa becomes vigourless and refined. Divergence: The Tao Te Ching speaks of emptiness as a natural state
  of the sage; the Haṭha text describes it as an achieved condition through systematic practice.


  **Bhagavad Gītā, 6.20–23:** Both describe meditation as a state where mind and breath settle into stillness, and the practitioner
  experiences unified consciousness. Divergence: The Gītā frames this as devotional surrender to the divine; the Haṭha text
  presents it as a technical outcome of prāṇa-work, independent of theistic orientation.'
