title: Contract the throat and press the chin firmly against
unit_type: verse
commentary: 'This verse presents a physical lock (bandha) as both a somatic technique and a soteriological
  claim: the contraction of the throat and pressing of the chin are said to arrest decay and mortality
  itself. The passage assumes that the body is not merely flesh but a site where vital force (prāṇa) can
  be redirected and contained; by sealing the throat, the practitioner prevents the dissipation of life-energy
  upward, preserving it for transformation. The claim that a physical gesture ''destroys old age and death''
  reflects the haṭha yoga worldview in which mastery of the body''s subtle channels and locks is inseparable
  from liberation.



  Key Terms



  **Jalandhara Bandha** — A throat lock created by contracting the throat and pressing the chin to the
  chest; one of the three principal bandhas in haṭha yoga, used to contain and direct prāṇa.

  **Bandha** — An energetic lock or seal in the body, created through muscular contraction, used to redirect
  vital force (prāṇa) during breath and meditation practices.



  Cross-Tradition Resonances



  **Taittirīya Upaniṣad (II.1): ''From ātman, space arose; from space, air; from air, fire…'':** Both
  texts view the body as a microcosm of cosmic principles and energies that can be refined through precise
  practice; the Upaniṣad traces emanation outward, while the Pradīpikā traces prāṇa inward through locks
  and seals. Divergence: The Upaniṣad emphasizes knowledge (jñāna) of these principles; the Pradīpikā
  emphasizes embodied technique (kriyā) to harness them.


  **Heraclitus, Fragment 45: ''The path up and down are one and the same.'':** Both suggest that a single
  practice—here, the throat lock—operates simultaneously on multiple levels: physical sensation, breath
  control, and the arrest of temporal decay. Divergence: Heraclitus speaks of paradox and flux; the Pradīpikā
  speaks of fixing and sealing, suggesting a reversal of entropy rather than an embrace of it.


  **Ecclesiastes 3:2: ''A time to be born, and a time to die…'':** Both acknowledge old age and death
  as fundamental conditions; the Pradīpikā, however, claims a practice can ''destroy'' them, whereas Ecclesiastes
  affirms their inevitability. Divergence: Ecclesiastes counsels acceptance; the Pradīpikā counsels active
  transformation through the body.'
