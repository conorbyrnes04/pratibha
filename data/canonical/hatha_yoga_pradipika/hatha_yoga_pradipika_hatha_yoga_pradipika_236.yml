translation: Contract the throat and press the chin firmly against the chest. This is called Jalandhara
  Bandha, which destroys old age and death.
abhyasa: Sit upright in a comfortable posture. Inhale slowly through the nose. As you retain the breath,
  gently lower your chin toward your chest without straining, feeling a mild contraction at the throat.
  Hold for a few seconds, then release and exhale. Repeat 3–5 times, noticing any sense of internal gathering
  or stillness. This is not a substitute for proper instruction, but an invitation to sense how a small
  physical adjustment might alter your experience of breath and presence.
