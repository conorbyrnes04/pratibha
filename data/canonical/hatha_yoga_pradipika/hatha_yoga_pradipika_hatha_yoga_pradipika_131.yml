unit_label: On Prāṇāyāma — 2.62
title: This has been spoken of by wise men as Anuloma and…
unit_type: verse
commentary: 'This passage presents a sequential curriculum of prāṇāyāma techniques, moving from solar
  heating (Sūrya Bhedan) through cooling and stabilizing practices, suggesting that breath work follows
  an intelligible order rather than arbitrary choice. The phrase ''wise man or woman'' signals that these
  practices are available to all sincere practitioners regardless of gender—a notable inclusivity for
  a 15th-century text. The final clause (''he or she may practice others or not'') acknowledges that mastery
  of these core techniques may be sufficient; the path is not about accumulating endless practices but
  about depth and discernment.



  Key Terms



  **Anuloma and Viloma** — Alternate nostril breathing; literally ''with the grain'' and ''against the
  grain,'' referring to the flow of prāṇa (vital energy) through the left and right channels

  **Bandha** — Energy lock or seal; muscular contractions used in conjunction with breath to direct and
  contain prāṇa

  **Prāṇāyāma** — Regulation and expansion of breath and vital life force through controlled breathing
  techniques



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali): ''tasmin sati śvāsa-praśvāsayoḥ gati-vicchedaḥ prāṇāyāmaḥ'' (breath regulation
  follows from steady posture):** Both texts treat prāṇāyāma as a structured progression that builds on
  prior mastery—breath work is not the beginning but a logical next step Divergence: The Yoga Sūtra emphasizes
  prāṇāyāma as a gateway to sense withdrawal; the Pradīpikā names specific techniques and their heating/cooling
  properties, grounding the practice in physiology


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they
  must be described with difficulty'':** Both honor a lineage of wise practitioners and suggest that mastery
  lies in refinement rather than multiplication of effort Divergence: The Pradīpikā is explicitly prescriptive
  and technical; the Tao Te Ching resists naming and instruction as a matter of principle


  **Heraclitus, Fragment 45: ''You cannot step into the same river twice'':** The Pradīpikā''s acknowledgment
  that practitioners may ''practice others or not'' reflects an acceptance that each breath, each body,
  is unique and requires discernment rather than dogma Divergence: Heraclitus speaks of flux as fundamental
  reality; the Pradīpikā assumes stable techniques that work across different practitioners'
