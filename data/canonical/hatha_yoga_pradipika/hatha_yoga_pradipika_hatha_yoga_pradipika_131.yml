  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: This has been spoken of by wise men as Anuloma and Viloma. Having practiced Surya Bhedan,
  with Bandhas, the wise man or woman should practice Ujjayi and then Sitkari Sitali, and Bhastrika, he
  or she may practice others or not.
abhyasa: Today, notice your own breath without trying to change it. Observe whether you naturally breathe
  more through one nostril or the other, and whether your breath feels warm or cool, agitated or calm.
  This simple witnessing is the ground from which formal prāṇāyāma grows—a reminder that the text assumes
  you already know your breath before technique begins.
