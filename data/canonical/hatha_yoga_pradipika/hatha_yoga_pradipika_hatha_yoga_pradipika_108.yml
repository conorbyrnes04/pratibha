  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Brahna and other Devas were always engaged in the exercise of Pranayama, and, by means of it, got rid of the
  fear of death. Therefore, one should practice pranayama regularly.
abhyasa: Today, notice one moment when fear arises—however small. Pause, and take five slow, deliberate breaths, extending
  the exhale slightly longer than the inhale. Observe whether the quality of the fear shifts. This simple act honors the passage's
  claim that breath-work and freedom from fear are intimately linked.
