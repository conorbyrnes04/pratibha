  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: By moving this, for two muhurtas, it is drawn up a little by entering the Susumna (spinal
  column).
abhyasa: Sit quietly for a few minutes and observe the natural rhythm of your breath along the spine.
  Without forcing, notice where you sense aliveness or subtle movement in the central channel. This simple
  awareness—without technique—honors the passage's teaching that attention itself is the beginning of
  awakening.
