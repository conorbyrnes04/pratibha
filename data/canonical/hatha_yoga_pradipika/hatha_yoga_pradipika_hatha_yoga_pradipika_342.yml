translation: By rubbing the body over with Amrita (exuding from the moon), from head to foot, one gets
  Mahakaya, i.e., great strength and energy.
abhyasa: Sit quietly and bring attention to the crown of your head. Imagine or sense a cool, luminous
  nectar gathering there. Over several minutes, slowly trace this sensation downward—through the face,
  throat, chest, belly, and to the feet—as though you are consciously distributing vital energy throughout
  your form. Notice any shifts in your sense of aliveness or steadiness.
