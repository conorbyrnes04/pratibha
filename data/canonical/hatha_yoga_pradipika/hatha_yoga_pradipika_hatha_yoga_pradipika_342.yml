commentary: 'This verse describes a subtle practice in which the practitioner cultivates awareness of
  amṛta—the nectar or ambrosial fluid traditionally associated with the lunar center in the head—and directs
  its flow downward through the body. The result is mahākāya, understood here as great bodily strength
  and vital energy. The passage suggests that haṭha yoga is not merely mechanical exercise but involves
  refinement of subtle forces; the ''rubbing'' is likely internal and imaginative rather than literal
  friction, part of the energetic cultivation that prepares the body for higher states.



  Key Terms



  **amṛta** — Nectar or ambrosial fluid; in haṭha yoga, the subtle secretion from the lunar center (often
  located at the crown or palate) that sustains and energizes the body when circulated through practice.

  **mahākāya** — Great body or great strength; the robust physical and energetic condition resulting from
  successful cultivation and distribution of vital forces.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 10: ''Can you remain unmoving till the mud settles?'':** Both texts suggest that
  subtle internal refinement—not forceful action—generates true strength and clarity. Divergence: The
  Tao Te Ching emphasizes stillness and non-action; the Haṭha Yoga Pradīpikā prescribes specific practices
  and energy circulation to achieve vitality.


  **Upaniṣads (e.g., Kaṭha Upaniṣad): references to the subtle body and channels (nāḍī) through which
  life-force flows:** Both root strength and liberation in the circulation of vital essence through the
  subtle anatomy. Divergence: The Upaniṣads emphasize knowledge (jñāna) and the Self; the Haṭha Yoga Pradīpikā
  emphasizes embodied technique and prāṇa as the primary vehicle.'
