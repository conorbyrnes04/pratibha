unit_label: On Prāṇāyāma — 2.61
title: This has been spoken of by wise men as Anuloma and…
unit_type: verse
commentary: 'This passage presents a sequential map of prāṇāyāma practices, moving from solar-heating
  techniques (Surya Bhedan) through throat-sounding and cooling methods to bellows-breath work. The phrase
  ''wise men and women'' signals that these are not gender-bound practices, and the closing ''or not''
  acknowledges that the path is not rigidly linear—the practitioner''s own discernment and condition matter.
  The text treats prāṇāyāma as a graduated ladder, each technique preparing the subtle body for the next.



  Key Terms



  **Anuloma and Viloma** — Alternate nostril breathing practices; literally ''with the grain'' and ''against
  the grain,'' referring to the flow of prāṇa (vital energy) through the subtle channels

  **Bandha** — Energy locks or seals—muscular and energetic contractions used to direct and contain prāṇa
  during breath work

  **Prāṇāyāma** — Regulation and expansion of vital breath; the formal practice of breath control as a
  means of refining the nervous system and preparing for meditation



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali):** Both texts treat breath as the bridge between body and mind, and both
  present prāṇāyāma as a prerequisite for deeper states. The Pradīpikā''s sequential method echoes the
  Sūtra''s emphasis on systematic progression. Divergence: The Sūtra is aphoristic and philosophical;
  the Pradīpikā is explicitly technical and prescriptive, naming specific techniques rather than principles.


  **Tao Te Ching 15 (Laozi):** Both traditions prize subtle mastery of breath and energy as a path to
  wisdom; both suggest that the sage works with natural forces rather than forcing them. Divergence: The
  Tao Te Ching emphasizes non-action (wu wei); the Pradīpikā prescribes deliberate, disciplined practice—a
  more active cultivation.


  **Bhagavad Gītā 6.11-12 (meditation and breath):** Both texts present breath regulation as foundational
  to meditation and self-realization, and both honor the role of a qualified guide. Divergence: The Gītā
  frames breath work within devotion and duty; the Pradīpikā treats it as a technical science with its
  own logic and stages.'
