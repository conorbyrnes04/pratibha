title: When the whole system of the nadis which is full of…
unit_type: verse
commentary: 'This verse establishes a causal sequence: purification of the nāḍī system (the network of
  subtle energy channels) precedes mastery of prāṇa (life force). The passage suggests that impurities—blockages,
  stagnation, or imbalance in these channels—obstruct the yogi''s capacity for conscious regulation of
  breath and vital energy. Cleaning is thus not merely physical but a prerequisite for the refined control
  that leads toward higher states of meditation.



  Key Terms



  **nāḍī** — In haṭha yoga, the subtle channels through which prāṇa (vital energy) flows; often described
  as a network with three principal channels (iḍā, piṅgalā, suṣumnā).

  **prāṇa** — Life force or vital energy; in yoga practice, the breath and the subtle energy that animates
  the body and mind.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts present a preparatory state (clearing, emptying) as necessary before
  mastery or flow: ''The ancient masters were profound and subtle... because they were subtle, they must
  be described with difficulty.'' Divergence: The Tao Te Ching emphasizes paradox and ineffability; the
  Haṭha Yoga Pradīpikā offers concrete practices (āsana, prāṇāyāma) as the method of purification.


  **Patañjali''s Yoga Sutras, I.12 (abhyāsa-vairāgyābhyāṁ tannirodhah):** Both texts present yoga as requiring
  systematic preparation: the Sutras teach that practice and non-attachment arrest mental fluctuations;
  the Pradīpikā teaches that nāḍī purification enables prāṇa control. Divergence: Patañjali emphasizes
  mental discipline (citta-vṛtti); Svātmārāma emphasizes energetic and physiological preparation as the
  foundation.


  **Heraclitus, Fragment 45:** Both suggest that order and clarity emerge from prior disorder: ''You cannot
  step into the same river twice''—implying constant flow and the need to work with what moves. Divergence:
  Heraclitus celebrates flux itself; the Pradīpikā views impurity as an obstacle to be overcome, not embraced.'
