  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: When the whole system of the nadis which is full of impurities, is cleaned, then the Yogi
  or Yogini becomes able to control the Prana.
abhyasa: Today, notice your breath without forcing it. Observe where it flows easily and where it seems
  restricted or shallow. This simple awareness—without manipulation—is a first step toward recognizing
  the state of your own nāḍī system and cultivating the sensitivity needed for deeper practice.
