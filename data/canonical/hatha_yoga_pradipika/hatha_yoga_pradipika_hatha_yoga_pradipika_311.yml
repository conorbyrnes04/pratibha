  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By whom the breathing has been controlled, by him or her the activities of the mind also have been controlled;
  and, conversely, by whom the activities of the mind have been controlled, by him or her the breathing also has been controlled.
abhyasa: 'For five minutes today, notice your breath without changing it. When your mind wanders, gently return attention
  to the breath. Observe: does steadying the gaze on breath naturally quiet thought? Does a moment of mental calm deepen or
  lengthen your breath? Record what you notice without judgment.'
