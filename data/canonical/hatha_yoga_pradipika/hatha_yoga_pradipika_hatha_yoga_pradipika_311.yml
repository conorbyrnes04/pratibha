title: By whom the breathing has been controlled, by him…
unit_type: verse
commentary: 'This passage articulates the reciprocal relationship between breath and mind that is central to haṭha yoga''s
  method: control of one naturally yields control of the other. Rather than presenting them as separate systems, Svātmārāma
  shows them as expressions of a single vital current (prāṇa). This bidirectional principle justifies why breath work (prāṇāyāma)
  is not mere physiology but a direct path to mental steadiness—and why mental discipline strengthens the breath. It is both
  practical observation and philosophical claim: the body and mind are not divided.



  Key Terms



  **prāṇa** — The vital life-force or breath-energy that animates both body and mind; in haṭha yoga, the primary vehicle of
  practice and transformation.

  **prāṇāyāma** — Regulation or extension of breath; one of the core practices of haṭha yoga, used to influence and stabilize
  the mind.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12 (Patañjali): ''abhyāsa-vairāgyābhyāṁ tannirodhah'' — practice and non-attachment bring about the cessation
  of mental fluctuations.:** Both texts place breath or practice as the means to mental control; both see technique as a ladder
  to inner stillness. Divergence: Patañjali emphasizes the psychological attitude (vairāgya, non-attachment) alongside practice,
  whereas this passage focuses on the mechanical reciprocity itself.


  **Tao Te Ching 10: ''Can you remain unmoving till the mud settles? Can you remain still till the right action arises?''
  — the Taoist principle of wu-wei (non-action).:** Both suggest that true control comes through alignment with a natural
  current rather than force; both see breath/energy as the medium of harmony. Divergence: The Haṭha Yoga Pradīpikā emphasizes
  active regulation and technique, while the Tao Te Ching counsels receptive yielding and minimal intervention.


  **Heraclitus, Fragment 12: ''All things flow; nothing abides'' — the unity of opposites and the primacy of flux.:** Both
  recognize breath and mind as expressions of a single flowing process; both reject a static view of the self. Divergence:
  Heraclitus celebrates perpetual change as the nature of reality, while haṭha yoga uses breath control to stabilize and transcend
  mental flux toward samādhi.'
