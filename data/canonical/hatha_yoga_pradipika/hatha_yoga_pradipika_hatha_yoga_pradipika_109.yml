  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: So long as the breath is restrained in the body, so long as the mind is undisturbed, and so long as the gaze
  is fixed between the eyebrows, there is no fear from Death.
abhyasa: Today, sit quietly for five minutes. Notice your breath without forcing it. Gently draw your inner gaze to the space
  between your eyebrows (the ājñā center), allowing your eyes to soften there. Observe how steadying the gaze naturally calms
  the mind and deepens the breath. Notice what happens to your sense of vulnerability or fear in that collected state.
