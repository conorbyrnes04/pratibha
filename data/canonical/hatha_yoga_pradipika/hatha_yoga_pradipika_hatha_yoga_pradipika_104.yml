translation: When inhalation and exhalation are performed very quickly, like a pair of bellows of a blacksmith,
  it dries up all the disorders from the excess of phlegm, and is known as Kapala Bhati.
abhyasa: Today, sit upright in a quiet place. Observe your natural breath for a few cycles. Then, if you
  are familiar with the technique or learning under guidance, practice a short round of rapid exhalations
  through the nose (allowing inhalation to be passive), noticing any sensations of clarity or lightness
  in the head and sinuses. If unfamiliar, simply reflect on how breath—usually automatic—can become a
  conscious instrument of purification.
