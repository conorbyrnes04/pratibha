  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Therefore, this comfortably sleeping Arundhati should always be moved; for by so doing the
  Yogi or Yogini gets rid of diseases.
abhyasa: Sit quietly and bring attention to the central axis of your spine from the base to the crown.
  Without forcing, notice where your breath and awareness naturally flow, and where they seem to hesitate
  or 'sleep.' Choose one simple practice—three rounds of alternate nostril breathing, or a gentle spinal
  twist—and do it with the intention of gently awakening that dormant channel. Observe what shifts.
