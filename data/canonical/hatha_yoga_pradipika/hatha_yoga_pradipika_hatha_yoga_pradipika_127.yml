title: Such as "Saluting Yogindras and their disciples and guru
unit_type: verse
commentary: 'This invocation establishes the ethical and relational ground of haṭha yoga practice: the
  student begins not in isolation but in acknowledgment of a lineage of accomplished practitioners (Yogindras),
  their students, and the remover of obstacles (Vinayaka). The phrase ''unite with me'' suggests that
  practice is an act of communion—between student and teacher, between the practitioner and the tradition
  itself—undertaken with a ''composed mind'' (śānta-citta), indicating that mental steadiness is both
  prerequisite and fruit. The passage frames yoga not as technique alone but as a disciplined relationship.



  Key Terms



  **Yogindra** — A master or accomplished adept of yoga; one who has attained mastery through sustained
  practice.

  **Vinayaka** — A name for Gaṇeśa, the remover of obstacles; invoked at the beginning of spiritual undertakings
  to clear impediments to practice.

  **composed mind** — A state of mental clarity and steadiness (śānta-citta); the inner condition required
  for authentic practice.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.41 (on yoga as steadiness of mind):** Both texts locate yoga''s essence in mental
  composure and single-pointed intention rather than mere physical technique. Divergence: The Gītā emphasizes
  yoga as duty (dharma) within social life; the Pradīpikā presents it as a systematic ladder of embodied
  practices leading inward.


  **Confucian Analects (on honoring teachers and lineage):** Both traditions root practice in reverence
  for those who transmit wisdom and in the student''s humble positioning within a chain of transmission.
  Divergence: Confucianism emphasizes social order and filial duty; the Pradīpikā''s invocation is mystical
  and soteriological, aimed at liberation rather than social harmony.


  **Meister Eckhart (''releasement'' and union):** Both suggest that spiritual practice requires a composed,
  receptive mind and a surrender of ego into something larger than the individual self. Divergence: Eckhart''s
  union is with the Godhead through negation; the Pradīpikā''s ''unite with me'' points toward integration
  of the individual consciousness within a living lineage and ultimately samādhi.'
