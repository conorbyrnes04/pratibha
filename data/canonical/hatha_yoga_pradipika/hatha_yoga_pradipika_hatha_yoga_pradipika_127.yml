translation: Such as "Saluting Yogindras and their disciples and guru Vinayaka, the Yogi or Yogini should
  unite with me with composed mind."
abhyasa: Before beginning your practice today, pause and silently acknowledge one teacher or guide who
  has shaped your understanding—whether a living instructor, a text, or a lineage you study. Sit with
  composed breath for three minutes, holding the intention that your practice honors both those who came
  before and the present moment. Notice how this shifts your internal state.
