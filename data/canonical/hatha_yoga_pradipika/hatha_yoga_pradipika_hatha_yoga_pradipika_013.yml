  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The room should have a small door, be free from holes, hollows, neither too high nor too low, well plastered
  with cow-dung and free from dirt, filth and insects. On its outside there should be bowers, raised platform (chabootrā),
  a well, and a compound. These characteristics of a room for Hatha Yogis and Hatha Yoginis have been described by adepts
  in the practice of Hatha.
abhyasa: 'Today, notice the quality of the space where you practice or study. Without judgment, observe: Is it clean? Does
  it feel contained and calm, or scattered? Choose one small action—clearing clutter, opening a window, or simply sitting
  in a corner you''ve made intentional—and practice there. Let the care for your environment be inseparable from care for
  your practice.'
