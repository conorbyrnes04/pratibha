  body: The room should have a small door, be free from holes, hollows, neither too high nor too low, well plastered with
    cow-dung and free from dirt, filth and insects. On its outside there should be bowers, raised platform (chabootrā), a
    well, and a compound. These characteristics of a room for Hatha Yogis and Hatha Yoginis have been described by adepts
    in the practice of Hatha.
