translation: Yogis and Yoginis should always take wholesome food and never anything unwholesome. After
  dinner he or she should eat Ilachi or lavanga.
abhyasa: 'Before your next meal, pause and ask: Is this food nourishing or depleting to my body and energy?
  Eat with that awareness. After eating, if available, chew a cardamom seed or small piece of clove slowly,
  noticing how it affects your digestion and mental clarity.'
