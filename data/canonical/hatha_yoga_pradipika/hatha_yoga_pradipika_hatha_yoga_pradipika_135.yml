title: Yogis and Yoginis should always take wholesome food
unit_type: verse
commentary: 'This brief instruction embeds a principle central to haṭha yoga: the body is not separate
  from practice, but its vessel and instrument. By attending to diet—choosing ''wholesome'' food and avoiding
  ''unwholesome''—the practitioner honors the physical substrate through which prāṇa (vital energy) moves.
  The mention of cardamom (ilachi) and clove (lavanga) after meals suggests not mere nutrition but digestive
  support and subtle refinement, implying that even small choices serve the larger work of purification
  and energy cultivation.



  Key Terms



  **wholesome food (sāttvic āhāra)** — In yoga philosophy, food that is pure, light, and conducive to
  clarity and spiritual practice; contrasted with food that is heavy, stimulating, or tamasic (dull/inert).

  **Ilachi (cardamom) and lavanga (clove)** — Aromatic spices traditionally used in Ayurveda and yoga
  practice to support digestion and refine the subtle channels (nāḍī) through which prāṇa flows.



  Cross-Tradition Resonances



  **Bhagavad Gītā 17.8–10 (on sāttvic, rājasic, and tamasic food):** Both texts link dietary choice to
  spiritual capacity: what we consume shapes our mental and energetic state. The Gītā teaches that pure
  food supports clarity and devotion. Divergence: The Gītā frames diet within a broader ethics of action
  (karma yoga); the Pradīpikā focuses narrowly on the practitioner''s immediate energetic and digestive
  wellbeing as a prerequisite for āsana and prāṇāyāma.


  **Hippocratic corpus (''Let food be thy medicine''):** Both traditions recognize that food is not mere
  fuel but medicine—a tool for maintaining and refining the body''s function. Divergence: The Hippocratic
  view is primarily preventive and curative; the Pradīpikā''s dietary guidance is explicitly instrumental
  to spiritual transformation and energy work.'
