translation: Some acharyas (teachers) do not advocate any other practice, being of opinion that all the
  impurities are dried up by the practice of Pranayama.
abhyasa: 'Today, observe your breath without manipulation for five minutes. Notice where you habitually
  hold tension, where the breath flows freely, where it catches. This simple witnessing—the foundation
  before any formal prāṇāyāma—begins to reveal what the text calls ''impurities'': the places where body,
  energy, and mind are not yet transparent to themselves.'
