unit_label: On Prāṇāyāma — 2.37
title: Some acharyas (teachers) do not advocate any other practice
unit_type: verse
commentary: 'This verse captures a significant pedagogical stance within haṭha yoga: that prāṇāyāma (breath
  regulation) alone can purify the system of all obstructions and impurities that obscure the path to
  liberation. Rather than prescribing a complex ladder of practices, some teachers emphasize the sufficiency
  of breath work, suggesting that the manipulation of vital energy (prāṇa) through controlled breathing
  dissolves the subtle blockages—physical, energetic, and mental—that bind the practitioner. This reflects
  a broader tension in yoga philosophy between comprehensive method and radical simplification.



  Key Terms



  **Prāṇāyāma** — Regulation and extension of breath; in this passage, the primary or sole practice through
  which subtle impurities are purified and dissolved.

  **Impurities (aśuddhi)** — Obstructions—physical, energetic, or mental—that obscure clarity and obstruct
  the path to higher states; here, understood as subject to dissolution through breath practice alone.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.52 (Patañjali): ''From that [āsana], the covering of light is destroyed.'':** Both texts
  assert that a single foundational practice can dissolve obscuration; here āsana, there prāṇāyāma—each
  presented as sufficient to clear the way. Divergence: Patañjali emphasizes āsana as the gateway; Svātmārāma''s
  teachers elevate prāṇāyāma, suggesting breath work penetrates deeper than posture alone.


  **Tao Te Ching 15: ''The ancient masters were subtle, profound, and deep... Who can wait quietly while
  the mud settles?'':** Both suggest that a single, patient practice—breath or stillness—allows natural
  clarification without forced effort. Divergence: The Tao Te Ching counsels non-action; the Haṭha Yoga
  Pradīpikā prescribes active prāṇāyāma technique, a deliberate energetic discipline.


  **Bhagavad Gītā 6.12 (on meditation): ''One should hold the body, head, and neck erect... and gaze at
  the tip of the nose.'':** Both traditions recognize that a focused, singular practice—breath or gaze—can
  concentrate and purify the mind. Divergence: The Gītā emphasizes mental steadiness through external
  focus; the Pradīpikā locates purification in the manipulation of prāṇa itself, a more energetic claim.'
