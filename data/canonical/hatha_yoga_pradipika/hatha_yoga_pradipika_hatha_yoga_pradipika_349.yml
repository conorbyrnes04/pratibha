title: When the knowable
unit_type: verse
commentary: 'This verse distills a non-dual realization central to haṭha yoga''s ultimate aim: the dissolution
  of the subject-object split that ordinarily structures experience. When both the knower and the known
  cease to stand apart—when the apparatus of knowing itself dissolves—duality collapses, and what remains
  is not a state of ignorance but a unitive awareness beyond the binary of consciousness and its objects.
  This is the fruit toward which the physical and energetic practices of haṭha yoga are oriented.



  Key Terms



  **duality (dvaitā)** — The fundamental subject-object division that structures ordinary consciousness;
  in yoga philosophy, the illusion that obscures non-dual reality.

  **knowable (jñeya)** — That which can be known; the object of knowledge, as distinct from the knower.



  Cross-Tradition Resonances



  **Advaita Vedānta (Śaṅkara, 8th c.):** Both teach that the apparent separation of subject and object
  is illusory, and that realization dissolves this duality into non-dual awareness (Brahman). Divergence:
  Advaita emphasizes jñāna (intellectual discrimination and knowledge) as the primary means; haṭha yoga
  privileges the body and breath as entry points, treating knowledge as a fruit of practice rather than
  its seed.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... so subtle they cannot be described.'':**
  Both point to a state beyond conceptual knowing, where the knower and known merge into an ineffable
  simplicity. Divergence: The Tao Te Ching emphasizes wu-wei (non-action) and naturalness; haṭha yoga
  prescribes deliberate, systematic practice to reach that state.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  dissolve the boundary between subject and object, knower and known, into a unified vision. Divergence:
  Eckhart frames this as divine union and grace; haṭha yoga presents it as the natural fruit of disciplined
  prāṇāyāma and meditation, accessible through technique.'
