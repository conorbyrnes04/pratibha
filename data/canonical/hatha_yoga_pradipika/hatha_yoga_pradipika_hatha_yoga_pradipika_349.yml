translation: When the knowable, and the knowledge, are both destroyed equally, then there is no second
  way (i.e., Duality is destroyed).
abhyasa: Sit quietly and observe a single object (breath, flame, sound) without naming or analyzing it.
  Notice the moment you slip into 'I am observing this'—the split between observer and observed. Rather
  than forcing unity, simply watch that split arise and release, again and again, until the effort itself
  becomes transparent.
