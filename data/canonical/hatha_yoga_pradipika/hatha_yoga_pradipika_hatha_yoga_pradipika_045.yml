  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: There is no âsana like the Siddhâsana and no Kumbhaka like the Kevala. There is no mudrâ like the Khechari and
  no laya like the Nada (Anahâta Nâda).
abhyasa: Today, sit in a comfortable cross-legged position and listen inwardly for the subtle sound beneath thought—a hum,
  a bell-tone, or vibration in the head or heart. Do not force it; simply notice what arises when the mind quiets. This is
  a first acquaintance with Nāda, the inner resonance the text names as the supreme dissolution.
