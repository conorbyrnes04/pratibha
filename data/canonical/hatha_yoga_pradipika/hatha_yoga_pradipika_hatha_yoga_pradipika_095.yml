commentary: 'This passage describes *basti karma*, a cleansing practice that works directly with the subtle
  energy channels by mechanically stimulating and contracting the anal sphincter. The text presents it
  matter-of-factly as a *kriyā* (purificatory action) — one of several internal cleansings in haṭha yoga
  meant to prepare the body-mind for prāṇāyāma and meditation. The emphasis on the contraction-and-release
  cycle suggests that basti, like other haṭha practices, aims to awaken and direct prāṇa (vital force)
  through disciplined physical engagement rather than through visualization alone.



  Key Terms



  **basti karma** — A cleansing practice (*kriyā*) involving controlled contraction and release of the
  anal sphincter, traditionally performed in water; one of several preparatory purifications in haṭha
  yoga.

  **kriyā** — A purificatory or energetic action; in haṭha yoga, internal cleansings and practices that
  prepare the body and energy channels for higher states.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, II.46 (sthira sukham āsanam):** Both texts ground yoga in the body''s actual
  capacity — posture should be ''steady and comfortable.'' Basti similarly works within the body''s natural
  mechanics to refine control. Divergence: Patañjali emphasizes the mental quality of āsana (steadiness-ease);
  the Pradīpikā passage is purely technical and mechanical, with no mention of mental state.


  **Taoist internal alchemy texts (e.g., *The Secret of the Golden Flower*):** Both traditions use precise
  physical practices to circulate and refine subtle energy; both treat the body as a laboratory for transformation,
  not merely a vessel. Divergence: Taoist practice typically emphasizes microcosmic circulation and visualization;
  basti is a direct, localized mechanical action without explicit visualization.


  **Hippocratic medicine and Ayurvedic *śodhana* (purification):** All three recognize internal cleansing
  as foundational to health and spiritual readiness; basti appears in Ayurvedic medicine as well, suggesting
  a shared empirical lineage. Divergence: Ayurvedic basti uses oils and herbs; the Pradīpikā''s version
  is purely mechanical, suggesting a yoga-specific adaptation for prāṇic rather than humoral balance.'
