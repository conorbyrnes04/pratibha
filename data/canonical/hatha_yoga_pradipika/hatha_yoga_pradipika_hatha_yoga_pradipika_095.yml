translation: Squatting in navel deep water, and intoducing a six inches long, smooth piece of 1/2 an inch
  diameter pipe, open at both ends, half inside the anus; it (anus) should be drawn up (contracted) and
  then expelled. This washing is called Basti Karma.
abhyasa: 'Sit quietly and bring awareness to the base of the spine and pelvic floor. Without straining,
  gently contract the anal sphincter on an exhale, hold for 2–3 breaths, then release on an inhale. Repeat
  5–10 times, observing any subtle shifts in energy or sensation. This simple *bandha* (lock) echoes the
  principle of basti: that subtle control emerges through honest, grounded attention to the body''s interior.'
