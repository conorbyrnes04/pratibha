  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: In the beginning there is perspiration, in the middle stage there is quivering, and in the
  last or third stage, one obtains steadiness; and then the breath should be made steady or motionless.
abhyasa: 'Today, notice one small physical practice (walking, sitting, breathing) and observe: Where do
  you feel strain or effort? Where does ease begin to appear? Rather than forcing stillness, simply witness
  the natural progression from exertion to rest, and trust that steadiness arrives in its own time.'
