  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: When the sleeping Kundalini awakens by favor of a guru, then all the lotuses (in the six
  chakras or centers) and all the knots are pierced through.
abhyasa: 'Sit quietly today and notice where you feel blocked or contracted—in breath, attention, or body.
  Rather than forcing change, bring gentle awareness to one such place and silently acknowledge: ''I do
  not know how to open this alone.'' This mirrors the text''s humility about needing grace beyond technique.'
