unit_label: On Prāṇāyāma — 2.24
title: A strip of cloth, about 3 inches wide and 15 cubits…
unit_type: verse
commentary: 'This passage describes dhauti karma, a cleansing practice that works directly with the physical
  body as a vessel for yogic transformation. The emphasis on gradual progression, warmth, and the guru''s
  guidance reflects a core principle of haṭha yoga: that the body is not an obstacle to transcendence
  but a precise instrument requiring patient, methodical cultivation. The practice treats the digestive
  tract as a channel that can be purified and refined, mirroring the yogic understanding that physical
  cleansing prepares the subtle pathways (nāḍī) for the movement of prāṇa (vital energy).



  Key Terms



  **Dhauti Karma** — A cleansing practice (karma = action/work) in which a cloth strip is swallowed and
  withdrawn to purify the digestive tract; one of the preliminary kriyas (purification techniques) in
  haṭha yoga.

  **Prāṇa** — Vital life force or breath-energy that animates the body and is refined through yogic practice;
  central to understanding why physical purification matters in the yogic path.

  **Guru** — A qualified teacher who shows the correct passage and method; in haṭha yoga, the guru''s
  direct guidance is essential for safe, effective practice.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra 2.28 (Aṣṭāṅga Yoga):** Both texts present yoga as a systematic, step-by-step
  path requiring discipline and purification before higher states are reached. Dhauti karma is one of
  the kriyas that prepares the body-mind for the eight limbs. Divergence: Patañjali emphasizes ethical
  and mental disciplines (yama, niyama) as foundational; the Haṭha Yoga Pradīpikā begins with the body
  itself as the primary instrument, suggesting a different entry point into the same tradition.


  **Heraclitus, Fragment 45 (''The path up and down are one and the same''):** Both suggest that transformation
  requires moving through what resists us—the cloth moving through the body mirrors the paradox that descent
  (into the body''s channels) and ascent (toward refinement) are inseparable. Divergence: Heraclitus speaks
  metaphorically of unity; dhauti karma is literal, embodied practice, grounding the principle in flesh
  and breath rather than abstract philosophy.


  **Ecclesiastes 5:2 (''Let your words be few''):** Both value restraint, gradual progression, and respect
  for a process that cannot be rushed—the cloth is swallowed ''little by little,'' and wisdom is not seized
  but absorbed patiently. Divergence: Ecclesiastes warns against hasty speech to God; dhauti karma is
  a physical discipline that assumes the body itself is a sacred text to be read and refined through patient
  attention.'
