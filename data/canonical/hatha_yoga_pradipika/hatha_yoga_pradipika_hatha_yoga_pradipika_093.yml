  body: 'A strip of cloth, about 3 inches wide and 15 cubits long, is pushed in (swallowed), when moist
    with warm water, through the passage shown by the guru, and is taken out again. This is called Dhauti
    Karma. (N.B.-- The strip should be moistened with a little warm water, and the end should be held
    with the teeth. It is swallowed slowly, little by little: thus, first day 1 cubit, 2nd day 2 cubits,
    3rd day 3 cubits, and so on. After swallowing it the stomach should be given a good, round motion
    from left to right, and then it should be taken out slowly and gently.)'
