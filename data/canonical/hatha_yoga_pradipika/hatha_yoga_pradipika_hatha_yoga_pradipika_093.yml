abhyasa: Sit quietly and bring awareness to your throat and esophagus. Without performing the full practice,
  contemplate what it means to consciously inhabit and gradually refine a bodily passage—to move slowly
  through resistance with patience and trust in a lineage of knowledge. Notice any resistance or openness
  that arises.
