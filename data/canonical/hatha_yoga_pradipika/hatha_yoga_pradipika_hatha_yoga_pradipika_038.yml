translation: This Siddhâsana is performed also by placing the left heel on the Medhra (above the penis),
  and placing the right one next to it.
abhyasa: Sit quietly and notice your natural seated posture. Without forcing, observe where your weight
  settles, how your spine aligns, and whether your base feels stable or restless. This simple noticing—before
  attempting any formal āsana—cultivates the attentiveness that the Pradīpikā assumes a student brings
  to technical instruction.
