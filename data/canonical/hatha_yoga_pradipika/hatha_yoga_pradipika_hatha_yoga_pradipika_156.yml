translation: It quickly awakens the Kundalini, purifies the system, gives pleasure, and is beneficial.
  It destroys phlegm and the impurities accumulated at the entrance of the Brahma Nadi.
abhyasa: Sit comfortably and observe your natural breath for three minutes. Notice where you feel restriction
  or ease—in the nostrils, chest, or belly. This simple witnessing is a first step toward understanding
  what 'purification' might mean in your own body-mind, without forcing technique.
