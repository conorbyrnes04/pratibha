title: 'In all the Yogas, there are four states:'
unit_type: verse
commentary: 'Svātmārāma presents yoga as a progressive unfolding through four distinct stages, each building
  on the last. This schema suggests that the yogic path is not instantaneous but requires a structured
  maturation—from initial effort through deepening familiarity to final perfection. The naming of stages
  (especially the vivid ''jar'' metaphor) implies that the practitioner''s inner vessel must be prepared
  and integrated before the highest state can manifest.



  Key Terms



  **arambha** — the preliminary stage; the initial effort and commencement of practice

  **ghata** — the state of a jar; the stage in which the practitioner''s inner vessel is being shaped
  and prepared

  **parichaya** — the known state; deepening familiarity and integration with the practice

  **nispatti** — consummation; the perfected or mature state of realization



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.23–24 (on yoga as gradual steadying of mind):** Both texts affirm that yoga unfolds
  through stages rather than sudden attainment; effort and patience are required. Divergence: The Gītā
  emphasizes the stilling of thought-waves, while the Pradīpikā''s four stages focus on the transformation
  of the practitioner''s vessel and inner energy.


  **Aristotle, Nicomachean Ethics II.1–2 (on virtue as habit and habituation):** Both suggest that mastery
  emerges through repeated practice and gradual internalization, not intellectual knowledge alone. Divergence:
  Aristotle frames stages as moral habituation in action; Svātmārāma frames them as energetic and contemplative
  unfolding within the body-mind.


  **Dante, Purgatorio (the ascent through circles of purification):** Both present the spiritual path
  as a structured ascent through recognizable phases, each preparing for the next. Divergence: Dante''s
  circles are moral and theological; the Pradīpikā''s stages are phenomenological—describing the actual
  experience of prāṇa and consciousness.'
