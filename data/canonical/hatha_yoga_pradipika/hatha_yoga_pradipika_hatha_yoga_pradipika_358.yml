  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: 'In all the Yogas, there are four states: (1) arambha or the preliminary, (2) Ghata, or the
  state of a jar, (3) Parichaya (known), (4) nispatti (consummate).'
abhyasa: Today, reflect honestly on which stage you inhabit in a practice you undertake (yoga, meditation,
  study, or craft). Notice whether you are still gathering momentum (arambha), beginning to feel the shape
  of the work (ghata), becoming intimate with its textures (parichaya), or approaching mastery (nispatti).
  Do not judge; simply name it. This recognition itself is part of the path.
