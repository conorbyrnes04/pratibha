title: Having placed with the right foot at the root of…
unit_type: verse
commentary: 'This passage describes a seated posture (āsana) in which the practitioner crosses the legs
  and grasps the feet from behind, creating a stable, symmetrical form. The text claims both mundane benefits—appetite,
  disease resistance—and subtle energetic effects: awakening of Kundalini (the coiled power at the base
  of the spine) and retention of the ''nectar'' (amṛta) that ordinarily ''sheds'' from the moon-center
  (associated with the upper palate or subtle body). The passage treats the physical body and the subtle
  energy body as a unified system, where correct postural alignment and bodily discipline directly influence
  inner transformation.



  Key Terms



  **āsana** — A steady, comfortable seated or bodily position; in haṭha yoga, the physical foundation
  for breath work and meditation.

  **Kundalini** — The coiled serpentine power or energy said to rest dormant at the base of the spine,
  awakened through yogic practice to ascend the central channel.

  **amṛta (nectar)** — The subtle fluid or immortal essence traditionally associated with the upper palate
  or moon-center; its loss or retention is linked to spiritual vitality.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra, II.46: ''sthira sukham āsanam'' (the posture should be steady and comfortable):**
  Both texts ground yoga in the body''s alignment and ease, treating posture as the foundation for inner
  work. Divergence: Patañjali emphasizes the *quality* of steadiness and ease; the Haṭha Yoga Pradīpikā
  emphasizes the *specific form* and its energetic consequences.


  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive… Who can
  wait quietly while the mud settles?'':** Both traditions value patient, embodied stillness as a gateway
  to subtle transformation. Divergence: The Tao Te Ching speaks of natural spontaneity; the Haṭha Yoga
  Pradīpikā prescribes deliberate, structured techniques to awaken dormant power.


  **Upaniṣads (e.g., Kaṭha Upaniṣad, I.3.13): the body as a chariot, the senses as horses, the mind as
  reins:** Both treat the physical body as an instrument through which subtle energies and consciousness
  operate. Divergence: The Upaniṣads use metaphor; the Haṭha Yoga Pradīpikā offers practical techniques
  to harness and direct those energies.'
