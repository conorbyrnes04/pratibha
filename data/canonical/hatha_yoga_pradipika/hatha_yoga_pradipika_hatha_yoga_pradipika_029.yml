  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Having placed with the right foot at the root of the left thigh, let the toe be grasped with
  the right hand passing over the back, and having placed the left foot on the right thigh at its root,
  let it be grasped with the left hand passing behind the back. This is the âsana, as explained by Sri
  Matsyânatha. It increases appetite and is an instrument for destroying the group of the most deadly
  diseases. Its practice awakens the Kundalini, stops the nectar shedding from the moon in people.
abhyasa: Sit comfortably and observe your own seated posture today. Notice where your spine naturally
  wants to lengthen, where your breath flows easily, and where it feels restricted. Without forcing any
  complex pose, simply sit upright for five minutes and attend to the quality of stillness and symmetry
  your body can find. This prepares the ground for understanding why traditional texts link posture to
  inner awakening.
