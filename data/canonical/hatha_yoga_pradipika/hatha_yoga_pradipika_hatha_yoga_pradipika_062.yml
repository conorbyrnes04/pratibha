translation: Food heated again, dry, having too much salt, sour, minor grains, and vegetables that cause
  burning sensation, should not be eaten. Fire, women, travelling, etc., should be avoided.
abhyasa: 'Today, notice one meal or snack you consume. Before eating, pause and ask: Does this feel light
  and clarifying, or heavy and dulling? After eating, observe your mental clarity and energy over the
  next hour. This simple awareness—without judgment—begins to reveal your own body''s wisdom about what
  truly nourishes practice.'
