title: Food heated again, dry, having too much salt, sour…
unit_type: verse
commentary: 'This verse outlines dietary and lifestyle restraints (niyama) as foundational to haṭha yoga
  practice. The text treats food and conduct not as moral absolutes but as practical conditions that either
  support or obstruct the subtle body''s capacity for prāṇāyāma and meditation. The specificity—reheated
  food, excess salt, sour tastes—suggests that digestion itself is understood as a prāṇic process; poor
  digestion clouds the mind and destabilizes the energy channels (nāḍī). Avoidance of ''fire, women, travelling''
  points to a broader principle: the practitioner must conserve and stabilize prāṇa (life force) rather
  than dissipate it through sensory excess or restlessness.



  Key Terms



  **prāṇa** — Life force or vital energy; in haṭha yoga, the subtle breath that animates body and mind,
  regulated through āsana and prāṇāyāma.

  **niyama** — Observance or restraint; ethical and practical disciplines that prepare the body-mind for
  yoga practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.32 (Patañjali): ''śauca santoṣa tapas svādhyāya īśvara-praṇidhānāni niyamāḥ'' (purity,
  contentment, austerity, self-study, and surrender are observances):** Both texts ground yoga in ethical
  and practical discipline before advanced technique; dietary purity is part of a larger ecology of restraint.
  Divergence: The Yoga Sūtra lists niyama abstractly; the Haṭha Yoga Pradīpikā gives concrete, sensory
  guidance (salt, heat, sourness), treating the body as a precise instrument.


  **Bhagavad Gītā 17.8–10 (Kṛṣṇa on sāttvic food): ''Foods that increase life, purity, strength, health,
  joy, and cheerfulness are sāttvic; those that are bitter, sour, salty, hot, pungent, dry, and burning
  are rājasic.'':** Both texts classify foods by their energetic effect; both warn against heating, salt,
  and sourness as destabilizing to practice. Divergence: The Gītā frames diet within a broader cosmology
  of guṇa (qualities); the Haṭha Yoga Pradīpikā is more narrowly focused on prāṇic stability and the practitioner''s
  immediate capacity for breath work.


  **Heraclitus, Fragment 101: ''I prefer things that are hidden to things that are obvious'' (or: the
  hidden harmony is stronger than the obvious):** Both suggest that subtle, interior work (prāṇa, hidden
  order) requires withdrawal from obvious external stimulation (travel, sensory indulgence). Divergence:
  Heraclitus speaks of cosmic order; the Haṭha Yoga Pradīpikā speaks of personal prāṇic economy and the
  body as the field of practice.'
