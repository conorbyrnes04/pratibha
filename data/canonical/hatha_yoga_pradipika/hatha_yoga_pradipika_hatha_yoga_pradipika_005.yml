title: The following Siddhas (masters) are said to have…
unit_type: verse
commentary: 'This lineage list establishes haṭha yoga not as a modern invention but as a transmitted teaching
  with roots in divine and human mastery. By naming Śiva (Ādinātha) first, the text grounds the practice
  in the sacred; by then listing human adepts—especially Matsyendra and Gorakṣanātha, who appear in multiple
  yogic traditions—it claims continuity between the transcendent and the embodied. The passage asserts
  that what follows in the manual is not speculation but a living lineage of proven realization.



  Key Terms



  **Siddhas** — Perfected masters; beings who have attained supernatural powers and spiritual realization
  through disciplined practice.

  **Ādinātha (Śiva)** — The ''first lord'' or primordial teacher; in yogic tradition, Śiva is the originator
  of yoga teaching.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.1–2 (the lineage of yoga teaching):** Both texts assert that spiritual knowledge is
  transmitted through an unbroken chain of teachers, lending authority and authenticity to the practice.
  Divergence: The Gītā emphasizes the teaching of wisdom (jñāna) and duty (dharma); the Haṭha Yoga Pradīpikā
  grounds authority in embodied mastery and supernatural attainment (siddhi).


  **Patañjali''s Yoga Sūtra 1.1 (opening invocation to the lineage):** Both texts begin by invoking or
  naming the tradition''s roots, establishing credibility before presenting systematic teaching. Divergence:
  Patañjali opens with a definition of yoga itself; Svātmārāma opens with names, emphasizing persons and
  presence over abstract principle.'
