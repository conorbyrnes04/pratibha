  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The following Siddhas (masters) are said to have existed in former times:- Sri Adinātha (Siva),
  Matsyendra, Nātha, Sābar, Anand, Bhairava, Chaurangi, Mina Nātha, Goraksanātha, Virupāksa, Bilesaya.
abhyasa: 'Today, before or after your practice, pause and recall one teacher, elder, or exemplar whose
  wisdom or skill shaped your own learning. Notice how their presence—even in memory—steadies your intention.
  This mirrors the function of the lineage: to remind the practitioner that the path is walked by many,
  across time.'
