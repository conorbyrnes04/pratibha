title: Sitting with Maha Bandha, the Yogi or Yogini should…
unit_type: verse
commentary: 'This passage describes a foundational prāṇāyāma practice in which the practitioner uses physical
  locks (bandha) and breath retention to arrest the movement of vital currents (vāyu) within the body.
  The instruction to ''keep the mind collected'' suggests that control of breath and energy are inseparable
  from mental steadiness—a core principle of haṭha yoga, where physical technique serves the refinement
  of consciousness. The stopping of prāṇa and apāna (upward and downward flows) through throat closure
  points to a deliberate reversal or suspension of ordinary physiological patterns, understood as a step
  toward deeper states of meditation.



  Key Terms



  **Mahā Bandha** — A comprehensive lock or seal of the body, combining contraction of multiple points
  to redirect and contain vital energy (prāṇa).

  **Vāyu** — Vital winds or currents of energy in the body; here specifically prāṇa (upward flow) and
  apāna (downward flow).

  **Samādhi** — Absorption or unified consciousness; the ultimate goal toward which haṭha yoga practices
  are directed.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12 (Patañjali): ''abhyāsa vairāgyābhyāṁ tannirodhah'' (practice and non-attachment arrest
  the fluctuations of mind):** Both texts present technique (here breath control, there practice generally)
  as a means to stillness of mind. The stopping of vāyu parallels the arresting of mental fluctuation.
  Divergence: Patañjali emphasizes psychological non-attachment; the Haṭha Yoga Pradīpikā works through
  the body''s energetic anatomy, treating physical restraint as primary.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... Because they were subtle, they
  must be described with difficulty.'':** Both traditions recognize that subtle internal currents (Taoist
  ch''i, yogic prāṇa) require disciplined attention and cannot be grasped by ordinary perception. Divergence:
  The Tao Te Ching counsels yielding and non-action; the Haṭha Yoga Pradīpikā prescribes active, precise
  physical technique to redirect energy.


  **Meister Eckhart: ''The more we empty ourselves, the more room we make for God'':** Both suggest that
  restraint and cessation (stopping the breath, emptying the self) create space for a higher state of
  consciousness or union. Divergence: Eckhart''s emptiness is spiritual surrender; the Haṭha Yoga Pradīpikā''s
  stopping is a deliberate physiological intervention, not passive receptivity.'
