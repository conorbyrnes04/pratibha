translation: Sitting with Maha Bandha, the Yogi or Yogini should fill the air and keep his or her mind
  collected. The movements of the Vayus (Prana and Apana) should be stopped by closing the throat.
abhyasa: Today, sit comfortably and observe your natural breath for a few minutes without changing it.
  Notice where you feel movement—throat, chest, belly. Then, simply become aware of the idea that breath
  and mind move together. You need not attempt the bandha described here (which requires proper guidance),
  but this simple pairing of attention—breath with mind—honors the passage's core insight that they are
  one.
practice: Today, sit comfortably and observe your natural breath for a few minutes without changing it.
  Notice where you feel movement—throat, chest, belly. Then, simply become aware of the idea that breath
