unit_label: On Prāṇāyāma — 2.72
title: Having closed the opening of the Nadi (larynx)
unit_type: verse
commentary: 'This verse describes a foundational prāṇāyāma technique in which the breath is drawn inward
  with deliberate control, creating audible friction as it moves through the throat and chest. The instruction
  emphasizes both the *path* of the breath (a felt journey from throat downward) and the *quality* of
  its movement (marked by sound, indicating resistance and conscious regulation). This sensory feedback—the
  audible quality—serves as a practical anchor for the practitioner''s attention, transforming breathing
  from an automatic act into a witnessed, refined process.



  Key Terms



  **Nadi** — In this context, the channel or passage through which breath flows; here specifically the
  larynx or throat opening. (In broader yoga philosophy, nadis are subtle energy channels, but this passage
  refers to the physical pathway.)

  **Prāṇāyāma** — Regulation and extension of breath; one of the eight limbs of yoga, used to direct vital
  energy (prāṇa) and prepare the mind for meditation.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize subtle, refined perception: the sage ''moves like water''
  and observes the fine details of natural process. Here, the audible breath becomes a gateway to understanding
  the body''s inner landscape. Divergence: The Tao Te Ching emphasizes wu-wei (non-action), whereas this
  passage prescribes deliberate technique and conscious control of the breath.


  **Patañjali''s Yoga Sūtra, II.49–50 (on prāṇāyāma):** Both texts treat prāṇāyāma as a disciplined practice
  that refines the mind''s capacity for concentration and prepares the ground for deeper meditation. Divergence:
  The Yoga Sūtra emphasizes the philosophical fruit (steadiness and clarity of mind), while the Haṭha
  Yoga Pradīpikā focuses on the concrete, embodied technique and its sensory markers.


  **Heraclitus, Fragment 12 (on listening):** Both invite attentiveness to what is ordinarily overlooked—Heraclitus
  to the logos underlying all things, here to the subtle sound and sensation of one''s own breath as a
  window into bodily intelligence. Divergence: Heraclitus speaks of universal principle; this passage
  is pragmatically focused on a specific, repeatable somatic technique.'
