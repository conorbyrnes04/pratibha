translation: Having closed the opening of the Nadi (larynx), the air should be drawn in such a way that
  it goes touching from the throat to the chest, and making noise while passing.
abhyasa: Sit comfortably and, with mouth closed, inhale slowly through the nose while slightly constricting
  the throat to create a soft, ocean-like sound (ujjāyī breath). Notice the sensation of cool air entering
  at the throat and the warmth of the breath descending toward the chest. Do not force; let the sound
  arise naturally from gentle resistance. Observe for 5–10 breaths how this audible quality steadies your
  mind.
