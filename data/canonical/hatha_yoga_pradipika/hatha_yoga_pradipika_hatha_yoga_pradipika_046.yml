  body: Place the right foot on the left thigh and the left foot on the right thigh, and grasp the toes
    with the hands crossed over the back. Press the chin against the chest and gaze on the tip of the
    nose. This is called the Padmâsana, the destroyer of the diseases of the Yamis.
