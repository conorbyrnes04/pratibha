translation: Place the right foot on the left thigh and the left foot on the right thigh, and grasp the
  toes with the hands crossed over the back. Press the chin against the chest and gaze on the tip of the
  nose. This is called the Padmâsana, the destroyer of the diseases of the Yamis.
abhyasa: Sit in a comfortable cross-legged position. Without forcing into full lotus, notice where your
  spine naturally wants to lengthen and where your gaze naturally settles. Spend 2–3 minutes observing
  the relationship between your posture, your breath, and your mental state. What shifts when you sit
  with intentional alignment?
