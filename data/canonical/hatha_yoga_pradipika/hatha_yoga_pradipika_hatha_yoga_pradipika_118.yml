unit_label: On Prāṇāyāma — 2.49
title: Then it should be confined within
unit_type: verse
commentary: 'This passage describes a foundational prāṇāyāma technique: alternating nostril breathing,
  in which the breath is drawn in through one nostril, retained and circulated through the body, then
  released through the other. The image of the breath filling ''from the nails to the tips of the hair''
  suggests a subtle pervasion of the entire embodied self, not merely mechanical respiration. The practice
  treats the body as a unified energetic field through which prāṇa (vital force) can be directed and refined,
  a central premise of haṭha yoga''s path toward steadiness of mind.



  Key Terms



  **prāṇāyāma** — regulation and extension of the breath; a foundational practice in haṭha yoga aimed
  at directing and refining vital force (prāṇa) through the body and mind

  **prāṇa** — vital life force or energy that animates the body and mind, understood in yoga as the medium
  through which consciousness and bodily function are linked



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49–50 (Patañjali): prāṇāyāma as the fourth limb, following āsana:** Both texts place
  breath regulation as a disciplined step toward mental steadiness and higher states; both treat it as
  foundational rather than peripheral. Divergence: The Yoga Sūtra emphasizes prāṇāyāma''s role in preparing
  the mind for concentration; the Haṭha Yoga Pradīpikā emphasizes the subtle circulation of prāṇa through
  the body itself as a vehicle of transformation.


  **Upaniṣads (e.g., Katha Upaniṣad 2.3.13): breath as a bridge between body and Self:** Both traditions
  recognize the breath as a link between the gross and subtle dimensions of being, and as a means of accessing
  deeper states of awareness. Divergence: The Upaniṣads approach breath philosophically as a metaphor
  for the universal principle; the Haṭha Yoga Pradīpikā treats it as a precise, embodied technique with
  measurable effects.'
