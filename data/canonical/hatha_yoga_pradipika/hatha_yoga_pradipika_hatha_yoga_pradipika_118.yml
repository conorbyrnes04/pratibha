translation: Then it should be confined within, so that it fills from the nails to the tips of the hair,
  and let it out through the left nostril slowly. (Note.-- This is to be done alternately with both the
  nostrils, drawing in through one, expelling through the other, and vice versa.)
abhyasa: 'Sit comfortably with an upright spine. Close your right nostril gently with your thumb; inhale
  slowly through the left nostril for a count of 4. Close both nostrils and hold the breath for a count
  of 4. Release the left nostril, close the right, and exhale through the right for a count of 4. Reverse:
  inhale right, hold, exhale left. Repeat 5–10 rounds, moving slowly and with attention to the quality
  of the breath rather than speed.'
practice: 'Sit comfortably with an upright spine. Close your right nostril gently with your thumb; inhale
  slowly through the left nostril for a count of 4. Close both nostrils and hold the breath for a count
  of 4. Release the left nostril, close the right, and exhale through the right for a count of 4. Reverse:
  inhale right, hold, exhale left. Repeat 5–10 rounds, moving slowly and with attention to the quality
  of the breath rather than speed.'
