  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The Yogi or Yogini, who has been able to move the Sakti deserves success. It is useless to
  say more, suffice it to say that he or she or she conquers death playfully.
abhyasa: Sit quietly today and notice where you feel aliveness or energy moving in your body—breath, warmth,
  tingling, flow. Rather than forcing anything, simply observe and acknowledge this Śakti as it naturally
  moves. Rest your attention there for 5–10 minutes without judgment. This simple noticing is the beginning
  of the movement the text describes.
