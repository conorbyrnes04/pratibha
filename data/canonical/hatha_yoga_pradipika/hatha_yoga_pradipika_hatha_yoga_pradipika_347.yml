  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The whole of this world and all the schemes of the mind are but the creations of thought. Discarding these thoughts
  and taking leave of all conjectures, O Rama! obtain peace.
abhyasa: 'Today, pause once and notice: what you call ''the world'' right now—the room, your concerns, your sense of self—exists
  only as it appears in awareness. Without judgment, observe one thought arising and dissolving. Do not try to stop thinking;
  simply watch the gap between thoughts. Rest there, however briefly. This is the peace the verse points to.'
