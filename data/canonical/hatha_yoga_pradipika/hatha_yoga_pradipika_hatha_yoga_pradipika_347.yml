commentary: 'This verse presents the mind''s constructions—both external world and internal schemes—as ultimately thought-dependent,
  and proposes that liberation (peace) comes through cessation of mental elaboration rather than through engagement with its
  contents. The teaching aligns haṭha yoga''s physical and energetic practices with a non-dualist recognition: the world as
  experienced is inseparable from the mind that perceives it, and freedom lies not in perfecting thought but in releasing
  it. The address to Rama signals a lineage teaching, passed from teacher to student.



  Key Terms



  **thought (vikalpa)** — Mental construction, conjecture, or conceptual elaboration; the mind''s habit of dividing and naming
  experience rather than resting in direct awareness

  **peace (śānti)** — Liberation from the turbulence of mental schemes; a state of non-agitation that comes from release of
  thought-patterns, not from achievement



  Cross-Tradition Resonances



  **Tao Te Ching 48:** Both teach that pursuit of knowledge and mental striving increase entanglement, and that peace comes
  through letting go of conceptual elaboration. Divergence: The Tao Te Ching emphasizes natural action (wu wei) and return
  to simplicity; the Haṭha Yoga Pradīpikā grounds this insight in systematic practice (āsana, prāṇāyāma) as a means to still
  the mind.


  **Advaita Vedānta (Upaniṣads, esp. Māṇḍūkya):** Both recognize the world as a mental construction and teach that liberation
  involves transcending thought-patterns to realize non-dual awareness. Divergence: Advaita emphasizes direct inquiry and
  discrimination (viveka); the Haṭha Yoga Pradīpikā locates the same realization through embodied practice and energy work
  (prāṇa).


  **Dhammapada 203:** Both teach that cessation of mental proliferation (papañca in Pali; vikalpa in Sanskrit) is the path
  to peace and awakening. Divergence: The Buddhist text emphasizes ethical conduct and mindfulness as the foundation; the
  Haṭha Yoga Pradīpikā begins with physical posture and breath as the gateway to the same stilling.'
