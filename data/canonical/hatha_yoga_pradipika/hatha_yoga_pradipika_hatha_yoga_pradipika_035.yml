  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Siva taught 84 âsanas. Of these the first four being essential ones, I am going to explain them here.
abhyasa: 'Today, sit quietly and consider one physical practice or posture you do regularly. Rather than seeking novelty,
  ask: What is essential about this? What would I lose if I removed it? Notice how returning attention to fundamentals can
  deepen rather than diminish your engagement.'
