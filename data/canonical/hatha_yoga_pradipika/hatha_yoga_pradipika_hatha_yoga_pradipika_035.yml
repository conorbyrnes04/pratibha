title: Siva taught 84 âsanas
unit_type: verse
commentary: 'Svātmārāma opens by grounding haṭha yoga in a mythic lineage—the god Śiva as original teacher—yet immediately
  narrows focus to four foundational postures from a vast repertoire. This gesture establishes both the tradition''s depth
  and its pedagogical pragmatism: mastery begins not with accumulation but with essentials. The number 84 itself carries symbolic
  weight in yogic cosmology, yet the text''s restraint—teaching only four—suggests that depth in practice matters more than
  breadth of knowledge.



  Key Terms



  **āsana** — Posture or seat; in haṭha yoga, the physical positions through which the body becomes a vessel for prāṇa (vital
  energy) and the mind steadies toward meditation.

  **haṭha yoga** — The yoga of force or effort; the practical discipline of posture, breath, and energy locks that prepares
  the body and subtle channels for higher states of consciousness.



  Cross-Tradition Resonances



  **Aristotle, *Nicomachean Ethics* I.7 — ''excellence is not an act but a habit'':** Both texts suggest mastery emerges through
  repetition of fundamentals rather than pursuit of the exotic; the four essential āsanas parallel the cultivation of virtue
  through practice. Divergence: Aristotle grounds ethics in reason and social virtue; the Pradīpikā grounds practice in the
  body''s subtle energies and the goal of samādhi (absorption), a non-rational state.


  **Confucian *Analects* VI.27 — ''the Master seldom spoke of profit, fate, and benevolence'':** Both traditions value restraint
  in teaching: what is *not* said or taught can be as instructive as what is. Svātmārāma''s choice to teach four postures
  mirrors the Confucian principle of economy in transmission. Divergence: Confucius emphasizes social propriety and human
  relationship; Svātmārāma''s restraint serves the inward journey toward samādhi, not social harmony.


  **Tao Te Ching 15 — ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their knowledge is
  unfathomable.'':** Both texts suggest that true teaching conceals as much as it reveals; the vastness (84 āsanas) is acknowledged
  but the path is narrow (four essentials), honoring the student''s readiness. Divergence: Laozi emphasizes non-action and
  naturalness; Svātmārāma emphasizes disciplined prāṇāyāma and deliberate energetic work, a more active cultivation.'
