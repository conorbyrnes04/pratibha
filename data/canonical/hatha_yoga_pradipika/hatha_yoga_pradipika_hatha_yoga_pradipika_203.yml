title: One should go on doing thus, regularly for six…
unit_type: verse
commentary: 'This brief instruction concerns *jihvā bandha* (tongue lock) or a related preparatory practice
  in which sustained, regular effort over an extended period produces a physiological change—the severing
  of the lingual frenum. The passage emphasizes that transformation in haṭha yoga is not instantaneous
  but requires disciplined, consistent practice; the body itself becomes a site of gradual remaking. This
  reflects the text''s broader teaching that mastery of the physical vehicle is foundational to higher
  states.



  Key Terms



  **jihvā** — The tongue; in haṭha yoga, the site of specific locks and practices that redirect prāṇa
  (vital energy) and prepare the body for meditation.

  **haṭha** — Literally ''force'' or ''effort''; the yoga of physical postures, breath control, and energy
  locks designed to purify and prepare the body-mind for samādhi.



  Cross-Tradition Resonances



  **Dhammapada 183: ''Patience is the highest austerity.'':** Both texts locate transformation in sustained,
  humble effort rather than dramatic breakthrough; discipline over time is the true path. Divergence:
  The Dhammapada frames patience as ethical virtue and mental training; the Haṭha Yoga Pradīpikā grounds
  it in the body''s own capacity to be remade through technique.


  **Aristotle, Nicomachean Ethics II.1: ''We are what we repeatedly do; excellence, then, is not an act,
  but a habit.'':** Both emphasize that repeated practice, not isolated effort, produces lasting change
  in the practitioner''s nature. Divergence: Aristotle addresses moral habit and virtue; the Pradīpikā
  speaks of literal physiological transformation as the means to spiritual attainment.'
