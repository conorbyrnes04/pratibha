title: Being calm, one should gaze steadily at a small…
unit_type: verse
commentary: 'This verse describes *trataka* (steady gazing), a foundational practice that trains the mind''s
  capacity to hold attention without wavering. By fixing the gaze on a single point until tears naturally
  arise, the practitioner cultivates both ocular steadiness and mental one-pointedness—qualities essential
  for the deeper states of meditation (*samādhi*) that haṭha yoga prepares. The tears are not forced but
  emerge as a sign that the practice is working; they indicate a natural release and softening of the
  gaze-holding effort.



  Key Terms



  **Trataka** — Steady, unwavering gazing at a single point; a foundational practice that stabilizes attention
  and prepares the mind for meditation.

  **Samādhi** — Absorption or meditative union; the highest state of yoga in which subject and object
  merge into undifferentiated awareness.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.14 (abhyāsa vairāgyābhyāṁ tannirodhah):** Both texts emphasize that steady,
  repeated practice (*abhyāsa*) is the foundation for stilling the mind''s fluctuations. Trataka exemplifies
  this principle through a concrete technique. Divergence: Patañjali speaks of practice in abstract terms;
  the Haṭha Yoga Pradīpikā grounds it in a specific bodily method, reflecting haṭha''s emphasis on the
  body as a vehicle for inner transformation.


  **Dhammapada, verse 282 (mindfulness is the path to the Deathless):** Both traditions recognize that
  focused attention—whether through gazing or mindful awareness—is a direct path to liberation and transcendence
  of ordinary consciousness. Divergence: The Dhammapada emphasizes mindfulness of all actions and thoughts;
  trataka isolates and concentrates attention on a single external object, a more specialized technique.


  **Meister Eckhart, ''God is in the innermost part of the soul'':** Both suggest that by stilling the
  outward-moving mind through a simple, focused act, one opens access to deeper dimensions of consciousness
  or being. Divergence: Eckhart''s path is contemplative surrender to divine presence; trataka is a technical
  practice of sensory discipline that prepares the ground for that opening.'
