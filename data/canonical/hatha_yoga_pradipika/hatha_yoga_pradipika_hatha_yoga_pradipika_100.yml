translation: Being calm, one should gaze steadily at a small mark, till eyes are filled with tears. This
  is called Tratika by acharyas.
abhyasa: Choose a small mark (a dot on a wall, a candle flame, or a point of light). Sit comfortably in
  a quiet space. Without straining, fix your gaze on the mark for 2–3 minutes, keeping your eyes open
  and steady. Notice when tears begin to form naturally—do not force them. When they come, pause gently
  and close your eyes, observing the afterimage and any sense of calm that follows. Practice once daily
  for a week.
practice: Choose a small mark (a dot on a wall, a candle flame, or a point of light). Sit comfortably
