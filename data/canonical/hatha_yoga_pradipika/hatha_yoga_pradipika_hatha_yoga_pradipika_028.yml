translation: Having placed with the right foot at the root of the left thigh, let the toe be grasped with
  the right hand passing over the back, and having placed the left foot on the right thigh at its root,
  let it be grasped with the left hand passing behind the back. This is the âsana, as explained by Sri
  Matsyânatha. It increases appetite and is an instrument for destroying the group of the most deadly
  diseases. Its practice awakens the Kundalini, stops the nectar shedding from the moon in people.
abhyasa: Sit upright and, if accessible to your body, cross your legs and gently grasp your feet from
  behind. Hold for a few breaths, noticing the symmetry, the mild compression in the lower abdomen, and
  any sense of steadiness or internal attention this posture creates. Do not strain; the point is to feel
  how a specific shape of the body can shift your awareness.
practice: Sit upright and, if accessible to your body, cross your legs and gently grasp your feet from
  behind. Hold for a few breaths, noticing the symmetry, the mild compression in the lower abdomen, and
  any sense of steadiness or internal attention this posture creates. Do not strain; the point is to feel
  how a specific shape of the body can shift your awareness.
