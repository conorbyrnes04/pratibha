title: Having placed with the right foot at the root of…
unit_type: verse
commentary: 'This passage describes a seated posture (āsana) in which the practitioner crosses the legs
  and grasps the feet from behind—a binding that creates symmetry and internal compression. The text claims
  practical benefits (appetite, disease resistance) alongside subtle energetic ones: awakening of kundalinī
  (the coiled power at the base of the spine) and arrest of the downward flow of subtle nectar from the
  ''moon'' (the upper energy centers). The passage treats the body as both a physical and energetic instrument,
  where precise alignment serves transformation.



  Key Terms



  **āsana** — A seated or postural position; in haṭha yoga, a stable and comfortable bodily configuration
  used to prepare the nervous system for breath work and meditation.

  **kundalinī** — The coiled spiritual energy traditionally located at the base of the spine; awakening
  or raising it is understood as central to yogic transformation.

  **nectar (amṛta) / moon** — In yogic physiology, a subtle fluid or energy associated with the upper
  centers (especially the head); its downward loss is seen as dissipation, and its retention as conservation
  of vital force.



  Cross-Tradition Resonances



  **Patañjali, Yoga Sūtra 2.46: ''sthira sukham āsanam'' (the posture should be steady and comfortable):**
  Both texts treat āsana as a foundation for inner work, emphasizing stability and ease rather than strain
  or display. Divergence: Patañjali speaks of āsana abstractly as a principle; this passage gives a specific
  bodily instruction tied to energetic effects.


  **Daoist internal alchemy texts (e.g., *Secret of the Golden Flower*): circulation of vital essence
  through microcosmic orbit:** Both traditions map subtle energy flows through the body and use postural/breathing
  practices to redirect and conserve that flow. Divergence: The Haṭha Yoga Pradīpikā emphasizes kundalinī
  awakening as the goal; Daoism often emphasizes balance and circulation without necessarily ''raising''
  a dormant force.


  **Ecclesiastes 5:11: ''The laborer''s appetite works for him'' (appetite as a sign of health and right
  living):** Both recognize appetite as a marker of bodily well-being and proper function. Divergence:
  Ecclesiastes speaks of appetite in the context of labor and social life; the Haṭha Yoga Pradīpikā ties
  it to a specific practice and subtle physiology.'
