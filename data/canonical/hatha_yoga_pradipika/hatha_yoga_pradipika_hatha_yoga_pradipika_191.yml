  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: This Maha Bandha is the most skillful means for cutting away the snares of death. It brings
  about the conjunction of the Triveni (Ida, Pingala and Susumna) and carries the mind to Kedar (the space
  between the eyebrows, which is the seat of Siva).
abhyasa: 'Today, sit quietly and bring awareness to the space between your eyebrows—the location named
  Kedar in the text. Without forcing breath or muscular effort, simply notice what arises there: coolness,
  light, stillness, or nothing at all. Let this gentle attention rest there for a few minutes. This is
  contemplative preparation, not the bandha itself.'
