  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The union of the mind and the sound is called the Raja-Yoga. The (real) Yogi or Yogini becomes
  the creator and destroyer of the universe, like God.
abhyasa: Sit quietly and listen to the subtle sound within—the hum of breath, the pulse of heartbeat,
  or the inner ringing sometimes called nāda. Rather than grasping for it, allow your awareness to rest
  gently on whatever sound or vibration arises naturally. Notice how attention itself becomes unified
  with what it hears, without separation between listener and sound.
