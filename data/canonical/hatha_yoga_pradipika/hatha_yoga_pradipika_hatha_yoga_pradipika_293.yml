title: Raja Yoga, Samadhi, Unmani, Manonmani, Amaratwa…
unit_type: verse
commentary: 'Svātmārāma opens by naming the ultimate goal of haṭha yoga practice through a cascade of
  Sanskrit terms, each pointing to the same non-dual realization. Rather than defining these states sequentially,
  he presents them as synonymous—different names for a single, indivisible liberation. This rhetorical
  move signals that the technical practices (āsana, prāṇāyāma, bandha) that follow are not ends in themselves,
  but instruments pointing toward this unified awakening, which transcends ordinary mind and the sense
  of separate selfhood.



  Key Terms



  **Rāja Yoga** — The ''royal yoga,'' the supreme path of yoga culminating in samādhi; the goal toward
  which haṭha yoga is a preparatory discipline.

  **Samādhi** — Absorption or unified consciousness; the state in which the distinction between subject
  and object dissolves.

  **Jīvan Mukti** — Liberation while living; freedom from bondage achieved during embodied life, not only
  after death.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Māṇḍūkya Upaniṣad on Turīya):** Both texts name the transcendent fourth state (Turya)
  as the ground of all other states of consciousness, and both use multiple names to point beyond conceptual
  language. Divergence: The Upaniṣads emphasize Turīya as eternal and unchanging; Svātmārāma emphasizes
  it as an attainable goal through systematic practice.


  **Advaita Vedānta (Śaṅkara) on Advaita (non-duality):** Both traditions affirm non-dual realization
  (Adwaitama) as the ultimate truth and use multiple synonyms to bypass intellectual grasping. Divergence:
  Advaita Vedānta privileges jñāna (knowledge) and renunciation; the Haṭha Yoga Pradīpikā insists that
  embodied practice (kriyā, prāṇāyāma) is the necessary gateway.


  **Bhagavad Gītā (2.55–56) on Sthita-Prajña (steady wisdom):** Both texts describe a state of unshakeable
  equanimity and freedom from mental turbulence as the fruit of yoga. Divergence: The Gītā frames this
  within dharma and duty; the Haṭha Yoga Pradīpikā frames it as the natural outcome of prāṇic mastery,
  independent of ethical context.'
