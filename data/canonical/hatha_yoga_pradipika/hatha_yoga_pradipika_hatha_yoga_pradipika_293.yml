abhyasa: Read through the list slowly, pausing after each term. Notice which names resonate or perplex
  you most. Choose one—perhaps 'Sahaja' (natural ease) or 'Jīvan Mukti' (liberation while living)—and
  hold it gently in awareness during a few minutes of quiet sitting. What does that particular name suggest
  about freedom?
