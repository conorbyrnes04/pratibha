title: These Mudras should be kept secret by every means…
unit_type: verse
commentary: 'This passage emphasizes the protective discretion required around mudrā practice, comparing it to intimate domestic
  privacy and precious valuables. The comparison suggests that mudrās are both potent (worthy of safeguarding) and relational—their
  power depends partly on the bounded, trusting context in which they are transmitted. The instruction reflects a traditional
  pedagogical stance: certain practices are not withheld from malice, but preserved within the teacher-student relationship
  where proper understanding and readiness can be verified.



  Key Terms



  **Mudrā** — A gesture, seal, or energetic lock used in haṭha yoga to direct and contain vital force (prāṇa); traditionally
  taught within a lineage and practiced with intention.



  Cross-Tradition Resonances



  **Dhammapada, verse 19 (on guarding the mind):** Both texts emphasize protection of inner practice through restraint and
  discretion—the Buddha teaches guarding the senses as one guards a city; here, mudrās are guarded as treasures. Divergence:
  The Dhammapada frames secrecy as self-protection against distraction; the Haṭha Yoga Pradīpikā frames it as honoring a lineage
  and the teacher-student bond.


  **Kena Upaniṣad, opening: ''By whom willed and directed does the mind go forth?'':** Both texts treat certain knowledge
  as requiring initiation and proper transmission—not all truths are equally accessible to all seekers at all times. Divergence:
  The Upaniṣad emphasizes the unknowability of the ultimate; the Haṭha Yoga Pradīpikā emphasizes the practical necessity of
  qualified guidance in embodied practice.'
