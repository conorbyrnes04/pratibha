  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: These Mudras should be kept secret by every means, as one keeps one's box of jewelry, and should, on no account
  be told to any one, just as husband and wife keep their dealings secret.
abhyasa: Today, reflect on one practice or insight you have learned from a trusted teacher. Notice the difference between
  speaking of it casually and holding it with reverence—not as secrecy born of shame, but as care born of respect. What changes
  in your relationship to the practice when you honor its transmission?
