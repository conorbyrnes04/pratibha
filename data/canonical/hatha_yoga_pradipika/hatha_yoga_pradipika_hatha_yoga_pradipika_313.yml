title: Breathing is lessened when the mind becomes…
unit_type: verse
commentary: 'This passage articulates a reciprocal relationship between breath and mind: as mental absorption deepens, breathing
  naturally quiets; conversely, restraint of prāṇa (vital force/breath) facilitates that very absorption. The text presents
  not a linear cause-and-effect but a mutual feedback loop—each supports the other. This mutual dependence is central to haṭha
  yoga''s method: by working with the body''s breath, one can access and stabilize mental states that would otherwise seem
  remote or involuntary.



  Key Terms



  **Prāṇa** — Vital life-force or breath-energy; in yoga, the animating power that moves through the body and can be directed
  through practice.

  **Absorption (dhyāna-like state)** — A state of focused, undistracted mental engagement; the mind unified on a single object
  or principle.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yoga is the stilling of the fluctuations of the mind.'':** Both texts identify mental quieting
  as yoga''s aim; both imply that breath/prāṇa and mind are intimately linked. Divergence: Patañjali emphasizes cessation
  of mental fluctuations as the definition itself; the Pradīpikā emphasizes the *mechanism*—breath restraint as a practical
  lever.


  **Tao Te Ching 15: ''The ancient masters were subtle, profound, and fathomless... their minds became one with the Way.'':**
  Both suggest that deep states arise through a kind of non-forcing alignment; both imply that outer and inner (breath and
  mind) are not separate. Divergence: The Tao Te Ching emphasizes wu-wei (non-action); the Pradīpikā prescribes deliberate
  prāṇāyāma practice as the means.


  **Heraclitus, Fragment 12: ''All things flow; nothing abides.'':** Both recognize that breath and mind are in constant flux;
  both suggest that understanding this flow is key to wisdom. Divergence: Heraclitus treats flux as metaphysical truth; the
  Pradīpikā treats it as a practical lever for transformation through restraint.'
