  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Breathing is lessened when the mind becomes absorbed, and the mind becomes absorbed when the Prana is restrained.
abhyasa: 'Today, sit quietly for five minutes. Notice without forcing: when your attention settles on a single object (a sound,
  sensation, or image), does your breathing naturally become quieter or more subtle? Simply observe this correlation. No technique
  required—only honest noticing of how absorption and breath move together in your own experience.'
