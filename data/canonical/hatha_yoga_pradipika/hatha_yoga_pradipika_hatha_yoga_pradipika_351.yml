title: Mind disappears by removing the knowable
unit_type: verse
commentary: 'This verse distills the haṭha yoga path to a radical simplification: the mind''s nature is
  to know objects, and when that knowing function ceases—when there is nothing left to grasp or cognize—the
  mind itself dissolves. What remains is ātmā, the self or pure consciousness, no longer obscured by mental
  activity. The passage suggests that yoga is fundamentally a subtraction: not acquiring something new,
  but removing the veil of mental knowing to reveal what already is.



  Key Terms



  **ātmā** — The self or pure consciousness; in this passage, what persists when the mind''s activity
  of knowing ceases.

  **knowable** — Objects of knowledge; the contents of mind; what the mind grasps and cognizes.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Māṇḍūkya Upaniṣad):** Both teach that the ātmā is the unchanging witness beyond mental
  states and that direct realization requires transcending the knowing mind. Divergence: The Upaniṣads
  emphasize knowledge (jñāna) as the path; the Haṭha Yoga Pradīpikā privileges embodied practice (āsana,
  prāṇāyāma) as the means to that realization.


  **Meister Eckhart, ''Breakthrough'' sermons:** Both describe a radical emptying—Eckhart''s ''poverty
  of spirit'' and this text''s removal of the knowable—as the condition for encountering the divine or
  true self. Divergence: Eckhart frames this as union with God through grace; the Haṭha Yoga Pradīpikā
  treats it as a natural result of systematic practice.


  **Dhammapada (e.g., verse 21):** Both suggest that cessation of mental proliferation (saṅkhāra) leads
  to peace and the uncovering of what is. Divergence: The Dhammapada emphasizes ethical conduct and mindfulness;
  this passage points directly to the dissolution of the knowing faculty itself.'
