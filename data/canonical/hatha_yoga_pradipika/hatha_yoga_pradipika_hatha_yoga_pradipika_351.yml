translation: Mind disappears by removing the knowable, and, on its disappearance, atma only remains behind.
abhyasa: 'Today, in a quiet moment, notice one thought or perception as it arises. Rather than following
  it, gently ask: ''Who is aware of this thought?'' Rest attention there—not on the content, but on the
  awareness itself—for a few breaths. This simple inquiry mirrors the passage''s inversion: turning from
  the known (objects, thoughts) toward the knower.'
