  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Sipping a little water, he or she should begin the exercise of Pranayama, after saluting
  Yogindras, as described in the Kurma Purana, in the words of Siva.
abhyasa: 'Before any breathing practice today, pause and acknowledge: the teachers who have carried this
  knowledge, the body you inhabit, and the intention behind the practice. A simple gesture of respect—palms
  together, a moment of silence—can restore the sacred dimension to what might otherwise become routine.'
