commentary: 'This brief instruction establishes prāṇāyāma not as a mechanical technique but as a sacred
  act, framed by reverence (salutation to the Yogindras—accomplished yogis) and grounded in divine teaching
  (the words of Śiva). The modest detail—sipping water—suggests that even the body''s preparation is part
  of the practice''s integrity. The passage positions haṭha yoga within a lineage of transmission, linking
  the practitioner to both human exemplars and the divine source of the teaching.



  Key Terms



  **Prāṇāyāma** — Regulation and extension of the breath; a foundational practice in haṭha yoga for directing
  and refining vital energy (prāṇa).

  **Yogindras** — Accomplished yogis or masters of yoga; exemplars of the tradition whose authority and
  attainment are invoked.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.11–12 (preparation for meditation):** Both texts emphasize proper preparation—posture,
  place, and mind—before entering the core practice, treating the body and environment as integral to
  spiritual work. Divergence: The Gītā stresses mental discipline and detachment; the Haṭha Yoga Pradīpikā
  emphasizes the body and breath as the primary vehicle, not obstacles to transcend.


  **Patañjali''s Yoga Sūtra 1.14 (abhyāsa, devoted practice):** Both texts frame yoga as a disciplined,
  sustained effort grounded in respect for the teaching and its lineage. Divergence: Patañjali''s sūtra
  is aphoristic and philosophical; the Pradīpikā is procedural and embodied, offering concrete techniques
  rather than metaphysical principles.'
