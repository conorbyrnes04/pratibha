translation: The Vayu should be made to enter the Susumna without restraint by him or her who has practices
  the control of breathing and has awakened the Kundali by the (gastric) fire.
abhyasa: 'Sit quietly and observe the quality of your breath today—not to manipulate it, but to notice:
  Is it smooth or jagged? Shallow or full? Does it favor one nostril? This simple witnessing honors the
  text''s emphasis on breath as the vehicle of transformation, and prepares the ground for formal practice
  under guidance.'
