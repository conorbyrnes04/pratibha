  body: If the air be inhaled through the left nostril, it should be expelled again through the other,
    and filling it through the right nostril, confining it there, it should be expelled through the left
    nostril. By practicing in this way, through the right and the left nostrils alternately, the whole
    of the collection of the nadis of the yamis (practisers) becomes clean, i.e., free from impurities,
    after 3 months and over.
