unit_label: On Prāṇāyāma — 2.10
title: If the air be inhaled through the left nostril, it…
unit_type: verse
commentary: 'This passage describes nāḍī śodhana (purification of the energy channels), presenting prāṇāyāma
  as a systematic cleansing practice rather than mere breathing technique. The text grounds spiritual
  development in the body''s subtle anatomy: by alternating breath through left and right nostrils over
  sustained practice, the practitioner removes energetic blockages that impede the flow of prāṇa (vital
  force). The promise of measurable transformation—''after 3 months and over''—suggests that haṭha yoga
  treats the body as a real, responsive instrument of inner work, not metaphor.



  Key Terms



  **nāḍī** — Energy channel or pathway in the subtle body through which prāṇa (vital force) flows; the
  text refers to their purification as essential to practice.

  **prāṇa** — Vital life force or breath-energy; the animating power that moves through the body and is
  refined through yogic practice.

  **yāmī** — Practitioner or one who engages in disciplined practice (from yama, restraint or discipline).



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts treat the body as a subtle instrument responsive to disciplined
  attention: ''The ancient masters were profound and subtle... because they were subtle, they must be
  described with difficulty.'' The Haṭha Yoga Pradīpikā similarly suggests that inner transformation requires
  patient, precise practice. Divergence: The Tao Te Ching emphasizes wu-wei (non-action) and spontaneity;
  the Haṭha Yoga Pradīpikā prescribes specific, methodical techniques—a more interventionist path to refinement.


  **Patañjali''s Yoga Sūtra, II.46 (on āsana):** Both texts present yoga as a ladder of embodied practices
  leading to higher states; the Pradīpikā''s focus on nāḍī purification as prerequisite echoes Patañjali''s
  view that the body and breath are instruments for mental clarity. Divergence: Patañjali emphasizes āsana
  as ''steady and comfortable'' posture; the Pradīpikā is more technical and energetic, foregrounding
  prāṇāyāma and subtle anatomy over postural ease.


  **Ecclesiastes 3:1 (''To everything, a season''):** Both texts honor time and process: the Pradīpikā''s
  ''3 months and over'' mirrors the wisdom that transformation cannot be rushed—there is a season for
  each stage of work. Divergence: Ecclesiastes speaks of life''s cyclical seasons as given; the Pradīpikā
  frames time as something the practitioner *actively structures* through discipline to achieve specific
  results.'
