translation: If the air be inhaled through the left nostril, it should be expelled again through the other,
  and filling it through the right nostril, confining it there, it should be expelled through the left
  nostril. By practicing in this way, through the right and the left nostrils alternately, the whole of
  the collection of the nadis of the yamis (practisers) becomes clean, i.e., free from impurities, after
  3 months and over.
abhyasa: 'Today, practice a few rounds of nāḍī śodhana: inhale through the left nostril (right nostril
  closed), exhale through the right; then inhale right, exhale left. Repeat 5–10 times at a natural pace.
  Notice any asymmetry in the ease or quality of breath between sides. This simple observation begins
  to attune you to the passage''s claim: that the nostrils and breath reflect and can reshape the body''s
  subtle channels.'
practice: 'Today, practice a few rounds of nāḍī śodhana: inhale through the left nostril (right nostril
