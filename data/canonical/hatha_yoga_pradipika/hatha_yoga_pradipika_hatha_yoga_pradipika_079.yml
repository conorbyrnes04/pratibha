  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: If the air be inhaled through the left nostril, it should be expelled again through the other,
  and filling it through the right nostril, confining it there, it should be expelled through the left
  nostril. By practicing in this way, through the right and the left nostrils alternately, the whole of
  the collection of the nadis of the yamis (practisers) becomes clean, i.e., free from impurities, after
  3 months and over.
