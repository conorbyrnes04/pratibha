translation: By practicing this Basti Karma, colic, enlarged spleen, and dropsy, arising from the disorders
  of Vata (air), pitta (bile) and kapha (phlegm), are all cured.
abhyasa: 'Today, reflect on one physical discomfort you experience (heaviness, restlessness, stagnation,
  etc.). Without attempting the practice itself, consider: Which of the three qualities—air (movement/dryness),
  fire (heat/intensity), or water/earth (heaviness/slowness)—seems most active in that discomfort? Simply
  naming the imbalance, rather than fighting it, is a first step toward understanding how yoga addresses
  the root rather than the symptom.'
practice: 'Today, reflect on one physical discomfort you experience (heaviness, restlessness, stagnation,
  etc.). Without attempting the practice itself, consider: Which of the three qualities—air (movement/dryness),
  fire (heat/intensity), or water/earth (heaviness/slowness)—seems most active in that discomfort? Simply
  naming the imbalance, rather than fighting it, is a first step toward understanding how yoga addresses
  the root rather than the symptom.'
