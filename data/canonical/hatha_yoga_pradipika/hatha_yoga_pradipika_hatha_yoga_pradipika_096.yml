title: By practicing this Basti Karma, colic, enlarged…
unit_type: verse
commentary: 'This verse presents Basti Karma—a cleansing practice—as a therapeutic intervention that addresses
  imbalances across all three humors (doṣas) of Ayurvedic medicine. Rather than treating symptoms in isolation,
  the text suggests that a single, well-executed practice can restore equilibrium to the body''s fundamental
  constitutional elements, thereby resolving diverse ailments. This reflects haṭha yoga''s integration
  with Ayurvedic physiology: the body is understood as a dynamic system of flows and qualities, and therapeutic
  practice works by rebalancing these forces rather than attacking disease directly.



  Key Terms



  **Basti Karma** — A cleansing action (karma) involving the lower abdomen and intestines; one of the
  ṣaṭ-karmas (six purificatory practices) in haṭha yoga.

  **Vata, Pitta, Kapha** — The three doṣas or constitutional humors in Ayurvedic medicine: Vata (air/movement),
  Pitta (fire/transformation), and Kapha (water/earth/stability). Their balance is understood as fundamental
  to health.



  Cross-Tradition Resonances



  **Hippocratic corpus (On the Nature of Man):** Both systems posit that health arises from the balance
  of fundamental bodily elements (humors in Greek medicine, doṣas in Ayurveda) and that disease reflects
  their disorder. Divergence: The Haṭha Yoga Pradīpikā offers a specific *practice* (Basti Karma) as the
  remedy, whereas Hippocratic medicine emphasizes diet, bloodletting, and evacuation as primary interventions.


  **Tao Te Ching, ch. 15:** Both texts suggest that true mastery works with natural forces rather than
  against them—the sage aligns with the Tao; the yogi aligns with the body''s inherent flows (prāṇa, doṣas).
  Divergence: The Haṭha Yoga Pradīpikā is explicitly prescriptive and technical, offering concrete techniques;
  the Tao Te Ching speaks through paradox and non-action (wu wei).


  **Aristotle, Nicomachean Ethics (on virtue as mean):** Both propose that health or excellence lies in
  a mean state—balance between extremes—rather than in any single quality. Divergence: Aristotle''s mean
  is an ethical and intellectual ideal; the Haṭha Yoga Pradīpikā''s balance is physiological and energetic,
  achieved through embodied practice.'
