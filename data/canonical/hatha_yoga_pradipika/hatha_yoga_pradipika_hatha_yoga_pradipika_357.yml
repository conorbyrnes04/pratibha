translation: The ears, the eyes, the nose, and the mouth should be closed and then the clear sound is
  heard in the passage of the Susumna which has been cleansed of all its impurities.
abhyasa: Sit quietly today for a few minutes. Gently close your eyes, and lightly press your ears closed
  with your fingers or palms. Without straining, notice what sounds arise in the silence—perhaps a high-pitched
  tone, a hum, or a rushing quality. Do not chase it; simply observe. This is an introduction to listening
  inward, the foundation of this practice.
practice: Sit quietly today for a few minutes. Gently close your eyes, and lightly press your ears closed
  with your fingers or palms. Without straining, notice what sounds arise in the silence—perhaps a high-pitched
  tone, a hum, or a rushing quality. Do not chase it; simply observe. This is an introduction to listening
  inward, the foundation of this practice.
