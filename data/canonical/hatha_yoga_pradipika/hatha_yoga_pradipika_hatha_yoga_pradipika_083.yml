title: During the first stage of practice the food…
unit_type: verse
commentary: 'This brief teaching addresses the material support needed for embodied practice. Early in
  haṭha yoga training, when the nervous system and subtle channels are being refined through āsana and
  prāṇāyāma, sattvic (pure, nourishing) foods like milk and ghee are recommended to support the body''s
  transformation. Once practice deepens and stabilizes, the practitioner''s physiology itself becomes
  self-regulating, and dietary strictness naturally loosens—not from indulgence, but from genuine integration.
  The passage suggests that discipline is contextual: a scaffold that can be released once the structure
  holds.



  Key Terms



  **haṭha yoga** — The yoga of force or effort; the systematic practice of āsana (postures), prāṇāyāma
  (breath control), and mudrā (seals) to prepare the body and mind for meditation and liberation.

  **sattvic** — In Ayurvedic and yogic thought, foods and qualities that are pure, light, and conducive
  to clarity and spiritual development; milk and ghee are classic examples.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16–17 (on moderation in eating and sleep):** Both texts teach that disciplined use
  of the body''s needs—food, rest, practice—is the foundation of yoga, and excess or deficiency both obstruct
  progress. Divergence: The Gītā emphasizes perpetual moderation as a virtue; the Pradīpikā suggests that
  outer discipline can eventually become unnecessary once inner stability is achieved.


  **Aristotle, Nicomachean Ethics (on habituation and virtue):** Both propose that repeated practice with
  external supports (rules, foods, routines) eventually becomes internalized, so the practitioner acts
  rightly without conscious effort. Divergence: Aristotle frames this as moral habit; the Pradīpikā frames
  it as energetic and physiological transformation of the subtle body.'
