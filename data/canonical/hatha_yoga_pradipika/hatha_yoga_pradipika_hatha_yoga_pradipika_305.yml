translation: How can it be possible to get knowledge, so long as the Prana is living and the mind has
  not died? No one else can get moksa except one who can make one's Prana and mind latent.
abhyasa: 'Today, sit quietly for five minutes and simply observe: notice how your breath and your thoughts
  move together. When breath quickens, does mind scatter? When mind settles, does breath slow? No need
  to change anything—just witness the inseparability Svātmārāma names. This observation itself is the
  beginning of the work.'
practice: 'Today, sit quietly for five minutes and simply observe: notice how your breath and your thoughts
  move together. When breath quickens, does mind scatter? When mind settles, does breath slow? No need
  to change anything—just witness the inseparability Svātmārāma names. This observation itself is the
  beginning of the work.'
