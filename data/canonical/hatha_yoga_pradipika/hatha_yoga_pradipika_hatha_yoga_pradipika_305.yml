  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: How can it be possible to get knowledge, so long as the Prana is living and the mind has not died? No one else
  can get moksa except one who can make one's Prana and mind latent.
abhyasa: 'Today, sit quietly for five minutes and simply observe: notice how your breath and your thoughts move together.
  When breath quickens, does mind scatter? When mind settles, does breath slow? No need to change anything—just witness the
  inseparability Svātmārāma names. This observation itself is the beginning of the work.'
