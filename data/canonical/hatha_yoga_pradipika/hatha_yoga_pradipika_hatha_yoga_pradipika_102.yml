translation: Sitting on the toes with heels raised above the ground, and the palms resting on the ground,
  and in this bent posture the belly is moved forcibly from left to right, just as in vomiting. This is
  called by adepts the Nauli Karma.
abhyasa: Sit quietly and observe the natural movement of your abdomen during a full breath cycle—inhalation
  and exhalation. Notice how the belly responds to breath without force. This observation prepares the
  body-mind for understanding why such practices demand both precision and a teacher's guidance.
practice: Sit quietly and observe the natural movement of your abdomen during a full breath cycle—inhalation
  and exhalation. Notice how the belly responds to breath without force. This observation prepares the
  body-mind for understanding why such practices demand both precision and a teacher's guidance.
