  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: These four are:-- The Siddha, Padma, Simha and Bhadra. Even of these, the Siddha-âsana, being very comfortable,
  one should always practice it.
abhyasa: Sit in a comfortable cross-legged position today. Rather than forcing a shape, notice where your spine naturally
  lengthens and your shoulders release. Spend five minutes simply observing the quality of 'comfort' in your seated body—not
  slack, but genuinely at ease. This trains the felt sense that āsana is not achievement but alignment.
