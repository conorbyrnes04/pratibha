  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: With composed mind 80 Kumbhakas should be performed at a time; beginning first with the chandra (the left nostril)
  and then the surya (the right nostril).
abhyasa: Sit comfortably and observe your natural breath for a few minutes. Notice which nostril feels more open. Without
  forcing retention, simply practice closing the right nostril and breathing gently through the left for several breaths,
  then switch. This honors the passage's attention to the two channels without attempting advanced kumbhaka, which requires
  qualified guidance.
practice: Sit comfortably and observe your natural breath for a few minutes. Notice which nostril feels more open. Without
  forcing retention, simply practice closing the right nostril and breathing gently through the left for several breaths,
  then switch. This honors the passage's attention to the two channels without attempting advanced kumbhaka, which requires
  qualified guidance.
