unit_label: On Prāṇāyāma — 2.60
title: With composed mind 80 Kumbhakas should be performed…
unit_type: verse
commentary: 'This verse prescribes a foundational prāṇāyāma practice: breath retention (kumbhaka) performed in a structured
  sequence, alternating between the lunar (left) and solar (right) channels. The emphasis on ''composed mind'' signals that
  the practice is not merely mechanical—mental steadiness is both prerequisite and fruit. The specific number (80) and the
  ordered progression (left before right) reflect the text''s view that haṭha yoga works through precise, graduated discipline
  to prepare the nervous system and subtle body for deeper meditation.



  Key Terms



  **kumbhaka** — retention or suspension of breath; a central prāṇāyāma technique in which the breath is held after inhalation
  or exhalation

  **chandra** — the lunar channel; in haṭha yoga, the left nostril and its associated energy pathway (iḍā nāḍī)

  **surya** — the solar channel; the right nostril and its associated energy pathway (piṅgalā nāḍī)



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali):** Both texts emphasize breath control (prāṇāyāma) as a deliberate step on the path to mental
  steadiness and higher states. The Pradīpikā''s ''composed mind'' echoes the Sūtra''s concern with preparing consciousness.
  Divergence: The Yoga Sūtra treats prāṇāyāma more abstractly as a limb of practice; the Pradīpikā gives concrete, numbered
  techniques, reflecting its role as a practical manual rather than aphoristic philosophy.


  **Taoist internal alchemy (neigong) traditions:** Both systems work with paired energetic channels (left/right, yin/yang)
  and breath retention to circulate vital force; both see the practice as preparatory for higher consciousness. Divergence:
  The Pradīpikā frames the channels (nāḍī) within a Sanskrit cosmology of lunar and solar principles; Taoist texts use different
  anatomical and cosmological maps, and do not typically invoke a single teacher-lineage framework.


  **Ecclesiastes 3:1 (''a time for every purpose''):** Both passages suggest that spiritual practice unfolds through ordered,
  sequential steps—there is a right time and right way for each phase. Divergence: Ecclesiastes speaks of life''s seasons
  and human affairs; the Pradīpikā prescribes a technical bodily discipline, not a reflection on fate or divine timing.'
