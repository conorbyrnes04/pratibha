translation: Fill in the air, keeping the chin firm against the chest, and, having pressed the air, and
  the mind should be fixed on the middle of the eyebrows or in the susumna (the spine).
abhyasa: Sit upright. Inhale slowly through the nose, gently press your chin toward your chest (without
  strain), and hold the breath while resting your gaze—either at the point between the eyebrows or inwardly
  along the spine. Notice what happens to your mind when breath and attention align. Release gently. Repeat
  2–3 times. This is a study exploration only; formal practice requires a teacher.
practice: Sit upright. Inhale slowly through the nose, gently press your chin toward your chest (without
  strain), and hold the breath while resting your gaze—either at the point between the eyebrows or inwardly
  along the spine. Notice what happens to your mind when breath and attention align. Release gently. Repeat
  2–3 times. This is a study exploration only; formal practice requires a teacher.
