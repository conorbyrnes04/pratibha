  body: He or she who drinks the clear stream of liquor of the moon (soma) falling from the brain to the
    sixteen-petalled lotus (in the heart), obtained by means of Prana by applying the tongue to the hole
    of the pendant in the palate, and by meditating on the great power (Kundalini), becomes free from
    disease and tender in body, like the stalk of a lotus, and the Yogi or Yogini lives a very long life.
