translation: The air should be drawn in through the right nostril by pressing the thumb against the left
  side of the nose, so as to close the left nostril; and when filled to the full, it should be closed
  with the fourth finger (the one next to the little finger) and kept confined.
abhyasa: Sit comfortably and observe your natural breathing for one minute without changing it. Then,
  gently press your left nostril closed with your thumb and inhale slowly through the right nostril for
  a count of four. Close the right nostril with your ring finger and hold the breath for a count of four.
  Notice any sensation of containment or stillness. Do this three times, then return to natural breathing.
  This is observation only—not a full prāṇāyāma practice.
practice: Sit comfortably and observe your natural breathing for one minute without changing it. Then,
