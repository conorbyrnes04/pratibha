title: The air should be drawn in through the right
unit_type: verse
commentary: 'This passage describes a foundational prāṇāyāma technique—the deliberate control of breath
  through specific nostril channels using finger placement. The instruction assumes breath itself is a
  substance to be directed and contained, not merely inhaled passively; the precision of which fingers
  close which nostril suggests that the path of air through the body carries significance. This technique
  appears early in the text as a preparatory practice, establishing mastery over the breath as a prerequisite
  for deeper states.



  Key Terms



  **prāṇāyāma** — regulation and extension of breath; in haṭha yoga, a systematic practice of controlling
  the flow of air through specific channels and techniques

  **nāḍī** — energy channel or pathway in the subtle body; here implied through the distinction between
  right and left nostrils as separate conduits



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali):** Both texts treat breath control as a discrete, teachable practice that
  precedes higher states of meditation. Divergence: Patañjali emphasizes breath control as a means to
  steady the mind; the Pradīpikā focuses on the mechanics and containment of air itself.


  **Taoist internal alchemy texts (e.g., Secret of the Golden Flower):** Both traditions treat breath
  as a subtle substance to be circulated and stored in the body through precise technique. Divergence:
  The Pradīpikā specifies anatomical channels (nostrils, fingers); Taoist texts often work with energy
  centers and meridians in more abstract terms.'
