title: Salutation to the Guru, the dispenser of happiness…
unit_type: verse
commentary: 'This opening invocation establishes the guru as the living embodiment of the three fundamental
  principles of tantric philosophy—Nada (sound/vibration), Bindu (point/seed), and Kali (the dynamic feminine
  power)—and frames devotion to the teacher as the gateway to liberation. The passage does not separate
  intellectual knowledge from embodied transformation; the guru *is* these principles made manifest, and
  relationship to the guru becomes the practice itself.



  Key Terms



  **Guru** — The teacher; in this context, one who embodies and transmits the principles of transformation,
  appearing as the living unity of sound, seed-point, and dynamic power.

  **Nada** — Sound or vibration; the subtle cosmic sound underlying manifestation, foundational to tantric
  practice.

  **Bindu** — The point or seed; the infinitesimal source from which all manifestation emerges, central
  to tantric cosmology.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.34:** Both texts honor the guru as essential to knowledge: ''Know that by prostration,
  by question, and by service, the wise who have seen the truth will teach you knowledge.'' Divergence:
  The Gītā emphasizes the guru''s transmission of wisdom through teaching; the Pradīpikā presents the
  guru as the embodied principle itself, not merely its messenger.


  **Meister Eckhart, ''The Aristocrats'':** Both suggest that the highest teaching is not conceptual but
  participatory—the teacher as a living manifestation of what is to be realized. Divergence: Eckhart emphasizes
  detachment and the Godhead''s transcendence; the Pradīpikā grounds realization in embodied practice
  and the guru''s immanent presence.'
