  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Salutation to the Guru, the dispenser of happiness to all, appearing as Nada, Vindu and Kali.
  One who is devoted to him or her, obtains the highest bliss.
abhyasa: Sit quietly and recall a moment when you learned something true not from words alone, but from
  presence—a teacher's example, a gesture, a silence. Notice what shifted in you. Sit with that recognition
  without needing to name it.
