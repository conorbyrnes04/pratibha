  label: Translation
  body: 'They have been explained by Adi Natha (Siva) and give eight kinds of divine wealth. They are
    loved by all the Siddhas and are hard to attain even by the Marutas. (Note.--The eight Aiswarikis
    are: Anima (becoming small, like an atom), Mahima (becoming great, like akas, by drawing in atoms
    of prakriti), Garima (light things, like cotton becoming very heavy like mountains). Prapti (coming
    within easy reach of everything; as touching the moon with the little finger, while standing on the
    earth). Prakamya (non-resistance to the desires, as entering the earth like water). Isata (mastery
    over matter and objects made of it). Vasitwa (controlling the animate and inanimate objects).'
