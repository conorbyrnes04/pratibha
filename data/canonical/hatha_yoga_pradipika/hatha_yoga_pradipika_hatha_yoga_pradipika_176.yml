title: They have been explained by Adi Natha (Siva) and…
unit_type: verse
commentary: 'This passage presents the eight siddhis (supernatural powers or ''divine wealth'') as fruits of yogic practice,
  attributed to Śiva (Ādi Nātha) and prized by accomplished practitioners (Siddhas). The text frames these capacities—from
  atomic subtlety to cosmic expansion, from effortless access to mastery over matter and life—not as ends in themselves but
  as markers of advanced attainment, notably difficult even for celestial beings (Marutas). The passage suggests that haṭha
  yoga''s disciplined work on breath, body, and subtle channels can yield extraordinary capacities, though the tradition''s
  deeper aim remains samādhi and rāja yoga, not siddhi-seeking.



  Key Terms



  **siddhis (Aiswarikis)** — Eight kinds of divine wealth or supernatural powers that arise from yogic practice: anima (becoming
  infinitesimally small), mahima (becoming infinitely large), garima (making light things heavy), prapti (reaching anything
  effortlessly), prakamya (moving through matter without resistance), īśatva (mastery over matter), vaśitva (control over
  animate and inanimate beings), and (implicitly) a eighth.

  **Ādi Nātha (Śiva)** — The primordial Lord; in haṭha yoga tradition, the originating teacher of yogic knowledge and practice.

  **Siddhas** — Accomplished or perfected beings; practitioners who have attained mastery through spiritual discipline.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra III.37–48 (on vibhūti, supernatural powers):** Both texts acknowledge that yogic practice naturally
  generates extraordinary capacities—levitation, knowledge of past/future, superhuman strength—and frame them as real but
  secondary to liberation. Divergence: Patañjali warns explicitly against attachment to siddhis as obstacles to kaivalya (liberation);
  the Haṭha Yoga Pradīpikā passage here simply lists them as ''loved by Siddhas,'' without cautioning against distraction.


  **Bhagavad Gītā II.47 (on non-attachment to fruits of action):** Both traditions value disciplined practice while cautioning
  against grasping for results; the eight powers are presented as natural fruits, not the goal. Divergence: The Gītā emphasizes
  duty and surrender to the divine will; the Haṭha Yoga Pradīpikā emphasizes the technical mastery of prāṇa and body as the
  mechanism producing these fruits.


  **Daodejing 15 (on the sage''s subtle mastery):** Both suggest that deep practice yields a kind of effortless power—the
  sage ''moves through the world like water''; the yogi gains prapti and prakamya, moving without resistance. Divergence:
  The Daodejing emphasizes non-action (wuwei) and emptiness; the Haṭha Yoga Pradīpikā emphasizes precise technical discipline
  (bandha, mudrā, prāṇāyāma) as the path to that mastery.'
