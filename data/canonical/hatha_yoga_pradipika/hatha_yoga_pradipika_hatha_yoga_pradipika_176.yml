  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: 'They have been explained by Adi Natha (Siva) and give eight kinds of divine wealth. They are loved by all the
  Siddhas and are hard to attain even by the Marutas. (Note.--The eight Aiswarikis are: Anima (becoming small, like an atom),
  Mahima (becoming great, like akas, by drawing in atoms of prakriti), Garima (light things, like cotton becoming very heavy
  like mountains). Prapti (coming within easy reach of everything; as touching the moon with the little finger, while standing
  on the earth). Prakamya (non-resistance to the desires, as entering the earth like water). Isata (mastery over matter and
  objects made of it). Vasitwa (controlling the animate and inanimate objects).'
abhyasa: 'Reflect today on one capacity you take for granted—moving your body, sensing the world, affecting what surrounds
  you. Sit quietly and notice: what would it mean to lose it? To refine it infinitely? Rather than chasing supernatural powers,
  use this contemplation to recognize how much subtle mastery already lives in ordinary embodied awareness, and how practice
  deepens it.'
