translation: By means of various postures and different Kumbhakas, when the great power (Kundali) awakens,
  then the Prana becomes absorbed in Sunya (Samadhi).
abhyasa: 'Sit quietly and observe your breath without controlling it. Notice where you feel energy or
  aliveness in your body—spine, belly, heart. Without forcing, simply acknowledge: the breath moves through
  me; I am not separate from this movement. Rest there for five minutes. This modest attention honors
  the passage''s insight that prāṇa is already present and can be witnessed.'
