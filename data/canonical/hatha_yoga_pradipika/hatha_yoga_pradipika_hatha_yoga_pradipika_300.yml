unit_label: On Samādhi — 4.10
title: By means of various postures and different Kumbhakas
unit_type: verse
commentary: 'This verse distills the haṭha yoga path into a single causal chain: physical discipline (āsana
  and breath retention) catalyzes the awakening of kuṇḍalinī, the dormant vital force coiled at the base
  of the spine. When kuṇḍalinī rises, the ordinary movement of prāṇa (life-force) stills and dissolves
  into śūnya—often understood as the void of non-dual awareness, or samādhi. The passage presents haṭha
  yoga not as mere physical culture, but as a systematic technology for redirecting embodied energy toward
  liberation.



  Key Terms



  **Kuṇḍalinī** — The ''great power'' or coiled serpent-force said to lie dormant at the base of the spine;
  awakened through yogic practice, it rises through the central channel and facilitates liberation.

  **Śūnya** — Emptiness or the void; here, the state of samādhi in which individual prāṇa merges into
  undifferentiated consciousness, beyond subject-object duality.

  **Kumbhaka** — Retention of breath; a prāṇāyāma technique in which the breath is held after inhalation
  or exhalation to intensify and direct vital energy.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś citta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts locate yoga''s goal in the stilling of ordinary consciousness; the Haṭha Yoga Pradīpikā specifies
  the bodily means (āsana, prāṇāyāma) by which this cessation is achieved. Divergence: Patañjali emphasizes
  mental discipline and discrimination; the Pradīpikā privileges the body and breath as the primary lever
  for transformation.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of
  their knowledge is unfathomable.'':** Both traditions teach that the deepest states arise through patient,
  non-forced attunement to an underlying energy or principle (prāṇa / Tao) already present in the body.
  Divergence: The Tao Te Ching emphasizes wu-wei (non-action); the Pradīpikā prescribes deliberate, structured
  techniques (āsana, kumbhaka) as the necessary means.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  point to a dissolution of subject-object duality in an ultimate state of union or non-dual awareness
  (samādhi / Godhead). Divergence: Eckhart frames this as mystical grace and divine encounter; the Pradīpikā
  presents it as a reproducible result of systematic bodily practice.'
