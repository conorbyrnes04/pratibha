  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Pressing the Yoni (perineum) with the heel of the left foot, and stretching forth the right
  foot, its toes should be grasped by the thumb and first finger.
abhyasa: 'Sit upright today and gently press your left heel toward your perineum while extending your
  right leg forward. Without forcing, reach your thumb and forefinger toward your right toes. Notice the
  quality of attention this creates: where does your breath naturally settle? What happens when you hold
  both the grounding and the reaching at once, rather than collapsing into either?'
