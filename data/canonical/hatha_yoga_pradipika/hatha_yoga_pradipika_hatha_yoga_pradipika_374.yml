  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: In the first stage, the sounds are surging, thundering like the beating of kettle drums and
  jingling ones. In the intermediate stage, they are like those produced by conch, Mridanga, bells, &c.
abhyasa: In a quiet seated posture, after several minutes of steady breathing, gently close the ears with
  the thumbs (or simply listen inward with soft attention) and notice what sounds arise—not from outside,
  but from within the body and mind. Do not chase or grasp them; simply observe their quality and any
  shift over time. This is a gentle, non-forced introduction to the phenomenon the text describes.
