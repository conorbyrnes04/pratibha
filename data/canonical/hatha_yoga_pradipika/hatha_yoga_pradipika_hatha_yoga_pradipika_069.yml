title: Âsanas
unit_type: verse
commentary: 'This closing verse frames haṭha yoga not as an end in itself, but as a methodical path toward
  rāja yoga—the ''royal'' yoga of mental mastery and samādhi. The passage emphasizes that āsanas (postures),
  kumbhakas (breath retentions), and other ''divine means'' are tools to be practiced systematically and
  persistently (''till the fruit is obtained''). The language suggests a graduated, purposeful discipline:
  physical and energetic practices are the foundation, not ornament.



  Key Terms



  **haṭha yoga** — The yoga of forceful effort; the systematic practice of postures, breath control, and
  energetic locks to prepare the body and mind for rāja yoga.

  **rāja yoga** — The ''royal'' yoga; the culmination of haṭha practice, focused on mental discipline,
  meditation, and samādhi (absorption).

  **kumbhaka** — Retention of breath; a central prāṇāyāma technique in which the breath is held after
  inhalation or exhalation.



  Cross-Tradition Resonances



  **Yoga Sūtras of Patañjali, 1.12:** Both texts present yoga as a progressive discipline: Patañjali teaches
  ''abhyāsa'' (sustained practice) and ''vairāgya'' (non-attachment to results); the Pradīpikā similarly
  frames haṭha as persistent practice toward a fruit. Both honor effort within a larger aim. Divergence:
  Patañjali emphasizes mental discipline and renunciation from the outset; the Pradīpikā begins with the
  body and breath as the primary instruments, suggesting a more embodied entry point.


  **Tao Te Ching, ch. 48:** Both texts suggest that mastery comes through a kind of non-forcing: the Tao
  Te Ching teaches that ''in the pursuit of learning, every day something is acquired''; the Pradīpikā''s
  ''divine means'' imply a natural unfolding when practice is aligned. Divergence: The Pradīpikā emphasizes
  systematic technique and effort (''haṭha'' = force); the Tao Te Ching counsels wu wei (non-action),
  a more receptive stance.


  **Heraclitus, Fragment 51 (on the path up and down):** Both suggest a journey with direction and purpose:
  the Pradīpikā''s ladder from haṭha to rāja mirrors Heraclitus''s sense that understanding requires movement
  through opposites toward unity. Divergence: Heraclitus speaks of cosmic flux and paradox; the Pradīpikā
  offers a concrete, graduated method with defined stages and techniques.'
