abhyasa: 'Today, as you practice any āsana or breath work, pause briefly before and after to notice: Am
  I treating this as an end, or as a means? What quality of attention am I bringing? This simple check
  honors the text''s reminder that haṭha yoga is a ladder, not a destination.'
