translation: Keep the atma inside the Kha (Brahma) and place Brahma inside your atma. Having made everything
  pervaded with Kha (Brahma), think of nothing else.
abhyasa: 'Sit quietly and bring attention to the space within your body—the breath moving through it,
  the felt sense of inner vastness. Then expand your awareness to the space around you, the air, the openness.
  Without straining, notice: is there truly a boundary between inner and outer space? Rest in that noticing
  for a few minutes, letting thought settle.'
