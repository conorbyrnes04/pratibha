translation: Place the hands on the thighs, with stretched fingers, and keeping the mouth open and the
  mind collected, gaze on the tip of the nose.
abhyasa: Sit upright with hands resting on your thighs, palms down, fingers extended. Keep your mouth
  gently open. Without straining, let your gaze settle on the tip of your nose—not forcing focus, but
  allowing the eyes to rest there naturally. Notice how this simple alignment quiets mental chatter. Hold
  for 1–2 minutes, then release. Observe any shift in your sense of presence.
practice: Sit upright with hands resting on your thighs, palms down, fingers extended. Keep your mouth
