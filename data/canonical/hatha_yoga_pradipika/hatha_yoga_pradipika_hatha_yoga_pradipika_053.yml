commentary: 'This verse prescribes a foundational gazing practice (nāsikāgra-dṛṣṭi, nose-tip gaze) paired
  with specific hand and postural alignment, designed to anchor attention and stabilize the mind. The
  instruction integrates body, breath, and perception into a single gesture: by fixing the eyes inward
  on a near point, the practitioner naturally quiets mental scatter and prepares the nervous system for
  deeper work. The simplicity of the instruction—hands, mouth, gaze, mind—reflects haṭha yoga''s principle
  that physical precision and sensory focus are not separate from meditation, but its foundation.



  Key Terms



  **nāsikāgra-dṛṣṭi** — Gaze fixed on the tip of the nose; a concentration technique that directs sensory
  attention inward and steadies the mind.

  **haṭha yoga** — The yoga of force or effort; the practice of āsana, prāṇāyāma, mudrā, and other physical
  and energetic techniques as a means to prepare the body and mind for higher states.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.46 (Patañjali): ''Sthira sukham āsanam'' (posture should be steady and comfortable):**
  Both texts ground meditation in bodily stability and ease; the Pradīpikā''s nose-gaze practice embodies
  this principle by linking postural precision to mental focus. Divergence: The Sūtra emphasizes the quality
  of the posture itself; the Pradīpikā adds a specific sensory anchor (the gaze), treating perception
  as an active tool for concentration.


  **Dhammapada 282: ''Mindfulness is the path to the Deathless; heedlessness is the path to death'':**
  Both traditions locate liberation in the cultivation of unwavering attention; the nose-gaze practice
  is a direct method for training that attention. Divergence: The Dhammapada frames mindfulness as ethical
  vigilance; the Pradīpikā treats it as a psycho-physical technique, using the body as the primary instrument.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both suggest
  that inward gazing and perception are not separate from the ultimate aim; the act of looking inward
  is itself a form of union. Divergence: Eckhart emphasizes divine reciprocity and grace; the Pradīpikā
  presents a systematic, embodied method requiring disciplined practice and a teacher''s guidance.'
