  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Laying down on the ground, like a corpse, is called Sava-âsana. It removes fatigue and gives
  rest to the mind.
abhyasa: Lie flat on your back in a quiet space for 5–10 minutes with legs extended and arms at your sides,
  palms open. Release any deliberate effort; let gravity hold you. Notice where fatigue lives in your
  body—shoulders, jaw, belly—and simply allow it to settle into the earth. Observe the quality of your
  mind as the body stills.
