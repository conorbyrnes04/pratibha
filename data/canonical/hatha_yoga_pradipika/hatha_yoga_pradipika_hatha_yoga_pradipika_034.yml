title: Laying down on the ground, like a corpse, is called…
unit_type: verse
commentary: 'This deceptively simple instruction names Śavāsana—literally ''corpse pose''—not as a final
  relaxation afterthought but as a deliberate practice with two effects: dissolution of physical exhaustion
  and mental quietude. The metaphor of the corpse is precise: the body is laid down without effort or
  resistance, suggesting a surrender that paradoxically restores. In the Pradīpikā''s architecture, even
  this foundational posture serves the path toward samādhi by clearing the obstacles of fatigue and mental
  agitation.



  Key Terms



  **Śavāsana** — Corpse pose; a lying posture in which the body is placed on the ground without tension,
  used to rest and calm the mind.

  **āsana** — A steady, comfortable posture or seat; in haṭha yoga, physical positions used to prepare
  the body and mind for meditation and higher states.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.48 (yoga as equanimity):** Both texts present yoga as a means to steady the mind and
  release agitation; Śavāsana embodies the principle of *samatva* (evenness) through bodily stillness.
  Divergence: The Gītā emphasizes equanimity amid action and duty, while Śavāsana achieves it through
  deliberate non-action and surrender.


  **Patañjali''s Yoga Sūtra 2.46 (āsana as sthira-sukham, steady and comfortable):** Both texts define
  āsana not by complexity but by the quality of ease and stability it produces in body and mind. Divergence:
  Patañjali presents āsana as preparation for prāṇāyāma and meditation; the Pradīpikā here emphasizes
  its immediate restorative function.'
