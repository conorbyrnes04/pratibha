title: In the doctrine of the sect of the Kapalikas, the…
unit_type: verse
commentary: 'This verse addresses a specific practice (Amaroli) within the Kapalika tradition, distinguishing
  it from broader haṭha yoga by naming a particular sect and offering a physiological rationale for selective
  engagement with bodily substances. The instruction to discard the ''first'' and ''last'' streams reflects
  a principle common throughout the Pradīpikā: discrimination and refinement in practice—taking what serves
  the work of yoga and rejecting what obstructs it. The passage assumes a somatic knowledge (the role
  of bile, the variability of secretions) that grounds esoteric practice in observable bodily function.



  Key Terms



  **Amaroli** — A practice within certain tantric and haṭha yoga traditions involving selective engagement
  with bodily secretions; here, the Pradīpikā specifies the ''mid stream'' as the refined portion.

  **Kapalika** — A sect within the broader tantric tradition; the Pradīpikā acknowledges this practice
  as belonging to their ''doctrine,'' situating haṭha yoga within a larger esoteric landscape.



  Cross-Tradition Resonances



  **Tao Te Ching 15: ''The ancient masters were subtle, profound, and deep''—they knew how to discern
  the useful from the useless.:** Both texts prize discrimination and refinement; both reject excess and
  crudity in favor of the subtle middle way. Divergence: The Tao Te Ching emphasizes non-action and naturalness;
  the Pradīpikā prescribes deliberate, embodied technique.


  **Aristotle''s doctrine of the mean (Nicomachean Ethics): virtue lies between excess and deficiency.:**
  Both the passage and Aristotle locate wisdom in choosing the middle term, rejecting extremes. Divergence:
  Aristotle applies this to ethics and character; the Pradīpikā applies it to somatic and energetic practice.'
