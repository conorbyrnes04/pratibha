  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: In the doctrine of the sect of the Kapalikas, the Amaroli is the drinking of the mid stream;
  leaving the 1st, as it is a mixture of too much bile and the last, which is useless.
abhyasa: 'Sit quietly and observe the principle of discernment: notice what you habitually consume, practice,
  or attend to without question. Today, ask of one daily habit: Is this the ''first stream'' (excess,
  impurity, distraction)? The ''middle'' (refined, useful)? Or the ''last'' (depleted, useless)? Practice
  choosing the middle consciously.'
