  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: When the air has ceased to move in the right and the left nostrils, and has begun to flow
  in the middle path, then Khechari Mudra can be accomplished there. There is no doubt of this.
abhyasa: Today, sit quietly and simply observe where your breath naturally flows—which nostril dominates,
  or if it alternates. Do not force or manipulate. Notice without judgment. This builds the sensitivity
  to subtle breath patterns that the text assumes a practitioner develops over time.
practice: Today, sit quietly and simply observe where your breath naturally flows—which nostril dominates,
