  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In Jalandhara Bandha, the indications of a perfect contraction of throat are, that the nectar does not fall into
  the fire (the Surya situated in the navel), and the air is not disturbed.
abhyasa: 'Sit quietly and bring gentle awareness to your throat and the space between your collarbones. Without forcing, notice
  the quality of your breath: is it smooth, uninterrupted, easy? This sensitivity to non-disturbance—to what remains calm—is
  the inner measure the text points to. Practice noticing rather than achieving.'
