  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Both the mind and the breath are united together, like milk and water; and both of them are equal in their activities.
  Mind begins its activities where there is the breath, and the Prana begins its activities where there is the mind.
abhyasa: 'Sit quietly for five minutes. Notice: without deliberate effort, where does your attention naturally rest—on the
  breath, or on a thought? Then gently follow one complete breath cycle (inhale, pause, exhale, pause) and observe whether
  the mind settles or becomes more active. Return to this simple observation without judgment.'
