translation: After six months, the wrinkles and grey hair are not seen. He or she who practices it daily,
  even for two hours, conquers death.
abhyasa: 'Today, notice one sign of aging or impermanence in your own body—a grey hair, a line, a stiffness.
  Rather than resist it, sit quietly and observe it without judgment. Then ask: what in me does not age?
  Spend five minutes attending to breath, sensation, or awareness itself—the dimension the text suggests
  haṭha practice awakens.'
