  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Yogi or Yogini observing Brahmacharya (continence) and always eating sparingly, gets success within 40 days
  by practice with Kundali.
abhyasa: Today, notice one area where you habitually overindulge—food, speech, sensory input, or mental distraction. Choose
  one small restraint (eating one meal more slowly, speaking less, sitting quietly for five minutes) and observe how even
  minor discipline affects your clarity and energy. This is not asceticism for its own sake, but a direct inquiry into how
  moderation sharpens attention.
