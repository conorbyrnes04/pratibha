translation: This Maha Mudra has been described as the giver of great success (Siddhi) to men. It should
  be kept secret by every effort, and not revealed to any and everyone.
abhyasa: Today, reflect on one practice or teaching you have received that required trust and preparation
  before it bore fruit. Notice how premature disclosure or casual application might have diminished its
  power. Consider what 'secrecy' might mean not as hiding, but as respect—keeping sacred things in the
  care of those ready to receive them.
