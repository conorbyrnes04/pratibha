  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: By stopping the throat (by Jalandhara Bandha) the air is drawn in from outside and carried
  down. Just as a snake struck with a stick becomes straight like a stick, in the same way, sakti (susumna)
  becomes straight at once. Then the Kundalini becoming as it were dead, and, leaving both the Ida and
  the Pingala, enters the susumna (the middle passage).
