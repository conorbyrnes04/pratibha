title: By stopping the throat (by Jalandhara Bandha) the air
unit_type: verse
commentary: 'This passage describes a physiological-energetic mechanism: by contracting the throat (Jalandhara
  Bandha), the practitioner directs breath downward and awakens the central energy channel (susumna),
  which normally lies dormant between the two lateral channels (Ida and Pingala). The simile of the struck
  snake—forced from coiled rest into straightness—suggests that constraint and pressure are necessary
  to redirect subtle energy from its habitual paths into the spine''s core. The passage frames this as
  a prerequisite awakening: Kundalini must ''leave'' its ordinary circulation to enter the central way.



  Key Terms



  **Jalandhara Bandha** — A throat lock or contraction created by drawing the chin toward the chest; used
  to direct and contain prāṇa (vital breath) during prāṇāyāma.

  **Susumna** — The central energy channel running through the spine, traditionally understood as the
  pathway for the ascent of Kundalini and the highest states of yoga.

  **Kundalini** — The coiled, dormant spiritual energy at the base of the spine; awakened and directed
  upward through practice to realize samādhi.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were subtle, mysterious, profound, responsive.'':** Both
  texts prize the subtle redirection of natural force (breath, energy, water) through constraint and attention
  rather than force; both see the practitioner as aligning with an inherent order. Divergence: The Haṭha
  Yoga Pradīpikā is explicitly technical and anatomical in its metaphors, whereas the Tao Te Ching remains
  apophatic and non-prescriptive about method.


  **Patañjali''s Yoga Sūtra, II.49: ''Prāṇāyāma is the regulation of the flow of inhalation and exhalation.'':**
  Both texts treat breath regulation as foundational to yoga; both see it as a means to steady the mind
  and access deeper states. Divergence: Patañjali emphasizes breath as a tool for mental steadiness; the
  Haṭha Yoga Pradīpikā emphasizes its role in activating and directing subtle energy channels.


  **Heraclitus, Fragment 51: ''They do not understand how that which is at variance with itself is in
  agreement with itself.'':** Both suggest that apparent constraint or opposition (the struck snake, the
  tension of opposites) generates alignment and awakening. Divergence: Heraclitus speaks of cosmic logos
  and paradox; the Haṭha Yoga Pradīpikā speaks of embodied energetic mechanics and a specific anatomical
  pathway.'
