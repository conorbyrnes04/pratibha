  body: By stopping the throat (by Jalandhara Bandha) the air is drawn in from outside and carried down.
    Just as a snake struck with a stick becomes straight like a stick, in the same way, sakti (susumna)
    becomes straight at once. Then the Kundalini becoming as it were dead, and, leaving both the Ida and
    the Pingala, enters the susumna (the middle passage).
