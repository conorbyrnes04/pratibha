translation: By stopping the throat (by Jalandhara Bandha) the air is drawn in from outside and carried
  down. Just as a snake struck with a stick becomes straight like a stick, in the same way, sakti (susumna)
  becomes straight at once. Then the Kundalini becoming as it were dead, and, leaving both the Ida and
  the Pingala, enters the susumna (the middle passage).
abhyasa: Sit upright. Gently draw your chin slightly toward your chest (Jalandhara Bandha) without straining.
  Observe your breath—notice how the contraction seems to deepen and lengthen your inhalation. Breathe
  slowly for 5–10 cycles, attending to the sensation of breath moving along the spine's centerline rather
  than diffusing outward. Do not force; simply notice.
practice: Sit upright. Gently draw your chin slightly toward your chest (Jalandhara Bandha) without straining.
  Observe your breath—notice how the contraction seems to deepen and lengthen your inhalation. Breathe
  slowly for 5–10 cycles, attending to the sensation of breath moving along the spine's centerline rather
  than diffusing outward. Do not force; simply notice.
