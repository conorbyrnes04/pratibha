title: Manthāna, Bhairava, Siddhi Buddha, Kanthadi…
unit_type: verse
commentary: 'This passage lists eight names or titles, likely referring to accomplished yogis or siddhas (perfected beings)
  within the haṭha yoga lineage. The enumeration suggests a lineage of transmission—a chain of realized practitioners whose
  authority and example ground the teachings that follow. By invoking these names, Svātmārāma anchors his manual not in abstract
  philosophy but in a living, embodied tradition of accomplished teachers.



  Key Terms



  **siddha** — A perfected or accomplished being; in yoga contexts, one who has attained supernatural powers or spiritual
  realization through disciplined practice.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.1–2 (paramparā, the chain of transmission):** Both texts honor knowledge passed through a lineage of realized
  teachers rather than invented anew. Divergence: The Gītā emphasizes the unbroken chain of *knowledge* (jñāna); the Pradīpikā
  invokes specific *names*, grounding authority in particular embodied practitioners.


  **Zen Buddhist transmission of the lamp (dentorokú):** Both traditions validate teaching through succession of named masters,
  each recognized as having realized the path. Divergence: Zen emphasizes sudden insight (satori); haṭha yoga here suggests
  gradual, systematic cultivation through bodily and breath practices.'
