  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: There are two causes of the activities of the mind; (1) Vâsana (desires) and (2) the respiration
  (the Prana). Of these, the destruction of the one is the destruction of both.
abhyasa: 'Today, notice one moment when a desire arises (for food, distraction, comfort, approval). Pause
  and observe your breathing—is it shallow, rapid, held? Then reverse: take five slow, even breaths and
  notice whether the urgency of that desire softens. This simple observation embodies the passage''s teaching
  without requiring formal technique.'
