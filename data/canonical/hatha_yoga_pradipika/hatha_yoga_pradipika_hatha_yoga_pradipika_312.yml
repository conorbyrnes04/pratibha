title: There are two causes of the activities of the mind;
unit_type: verse
commentary: 'Svātmārāma identifies a single root mechanism underlying mental turbulence: desire and breath
  are not separate causes but two expressions of one underlying agitation. By stilling one—whether through
  restraint of desire or regulation of breath—the other naturally ceases. This economy of causation is
  central to haṭha yoga''s claim that physical practices (prāṇāyāma, āsana) are not mere preliminaries
  but direct means to mental stillness and liberation.



  Key Terms



  **Vāsana** — Latent desires, impressions, or tendencies that drive mental activity and perpetuate the
  cycle of craving and aversion.

  **Prāṇa** — Life-force or vital breath; here, the subtle energy whose movement correlates with and sustains
  mental fluctuation.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):**
  Both texts locate yoga''s aim in stilling the mind; the Pradīpikā offers a practical dual-lever (breath
  and desire) where Patañjali names the goal abstractly. Divergence: Patañjali emphasizes discriminative
  knowledge (viveka) as the means; the Pradīpikā privileges embodied technique (prāṇāyāma) as the primary
  tool.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of
  their knowledge is unfathomable... Who can wait quietly while the mud settles?'':** Both suggest that
  stillness arises through non-forcing; the Pradīpikā''s regulation of breath mirrors the Taoist principle
  of working with natural process rather than against it. Divergence: The Pradīpikā prescribes active,
  systematic technique; the Tao Te Ching counsels receptive waiting and non-action (wu wei).


  **Dhammapada 5: ''Mindfulness is the path to the Deathless; heedlessness is the path to death.'':**
  Both traditions see mental discipline—whether through breath-work or mindful attention—as the threshold
  between bondage and liberation. Divergence: The Buddha emphasizes ethical conduct and insight into impermanence;
  the Pradīpikā locates transformation in the subtle physiology of prāṇa and energy channels (nāḍī).'
