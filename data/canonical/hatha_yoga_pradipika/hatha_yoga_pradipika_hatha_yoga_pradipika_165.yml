title: He or she obtains the position of Raja Yoga
unit_type: verse
commentary: 'This passage presents breath retention (kumbhaka) as the catalyst for awakening kundalini—the
  dormant energy coiled at the base of the spine—which in turn purifies the central energy channel (susumna
  nadi). The claim is direct: mastery of kumbhaka is not merely a technique but a gateway to raja yoga,
  the ''royal path'' of meditative absorption. The passage assumes a subtle physiology in which energy
  blockages are real obstacles to liberation, and their removal through pranayama is both possible and
  necessary.



  Key Terms



  **Kumbhaka** — Retention of breath; the deliberate pause after inhalation or exhalation, used in pranayama
  to intensify and direct prana (vital energy).

  **Kundalini** — The dormant spiritual energy traditionally conceived as coiled at the base of the spine,
  awakened through yogic practice to rise through the central channel toward liberation.

  **Susumna** — The central energy channel (nadi) running through the spine; purification of this channel
  is considered essential for higher states of consciousness.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize the subtle and invisible (the Tao that ''cannot be named'';
  the nadi that cannot be seen by anatomy) as the seat of transformation. Divergence: The Tao Te Ching
  emphasizes non-action and receptivity; the Haṭha Yoga Pradīpikā prescribes precise, vigorous techniques
  to awaken dormant power.


  **Patañjali''s Yoga Sutras, II.49:** Both texts treat pranayama as a foundational practice that prepares
  the mind for higher states; breath control is a bridge, not an end. Divergence: Patañjali frames pranayama
  as one limb among eight; the Pradīpikā elevates kumbhaka and kundalini as central to the entire path.


  **Meister Eckhart, ''Breakthrough'' sermons:** Both suggest that liberation requires a radical inner
  transformation—a ''breaking through'' of ordinary consciousness into a unified state. Divergence: Eckhart
  locates this in the soul''s union with God through negation; the Pradīpikā locates it in the body''s
  subtle energy channels awakened by technique.'
