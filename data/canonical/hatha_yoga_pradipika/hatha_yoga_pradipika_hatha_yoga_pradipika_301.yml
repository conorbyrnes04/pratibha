unit_label: On Samādhi — 4.11
title: The Yogi or Yogini whose sakti has awakened
unit_type: verse
commentary: 'This verse distills the paradox at the heart of haṭha yoga: disciplined practice (āsana,
  prāṇāyāma, bandha) is undertaken precisely so that effort itself becomes unnecessary. When śakti—the
  vital, conscious energy coiled at the base of the spine—awakens and rises, and when the practitioner
  releases attachment to the fruits of action, samādhi (absorption, union) arrives spontaneously, not
  as achievement but as natural consequence. The passage suggests that renunciation and awakening are
  not separate from practice but its fulfillment.



  Key Terms



  **śakti** — Vital, conscious energy; in haṭha yoga, the dormant power (often visualized as a serpent
  at the base of the spine) that awakens through practice and rises through the central channel.

  **samādhi** — Absorption, union, or meditative absorption; the state in which individual consciousness
  merges with the object of meditation or ultimate reality, beyond effort or duality.



  Cross-Tradition Resonances



  **Bhagavad Gītā, 2.47 (karma yoga):** Both teach that right action performed without attachment to results
  leads to liberation; effort aligned with dharma becomes effortless. Divergence: The Gītā emphasizes
  duty and social order; the Haṭha Yoga Pradīpikā focuses on internal energetic transformation as the
  mechanism of freedom.


  **Tao Te Ching, 48 (wu wei, non-action):** Both point to a paradoxical state where doing and non-doing
  converge; mastery appears as absence of strain. Divergence: The Taoist text speaks of cosmic alignment
  and natural flow; haṭha yoga locates the transformation in the body''s subtle anatomy and the awakening
  of śakti.


  **Meister Eckhart, ''Releasement'' (Gelassenheit):** Both describe a state of surrender—renouncing will
  and attachment—as the gateway to union with the divine or ultimate reality. Divergence: Eckhart emphasizes
  intellectual and spiritual surrender; the Pradīpikā grounds liberation in somatic practice and energetic
  awakening.'
