translation: The Yogi or Yogini whose sakti has awakened, and who has renounced all actions, attains to
  the condition of Samadhi, without any effort.
abhyasa: 'Today, notice one habitual action you perform with effort and expectation of result—a posture
  held, a breath counted, a task completed for gain. Pause before or during it, and ask: *What if I released
  the need for this to ''work''?* Not abandoning the action, but releasing your grip on its outcome. Observe
  what shifts in the quality of attention.'
