translation: Immortal liquor is the nectar exuding from the moon (Chandra situated on the left side of
  the space between the eyebrows). It is produced by the fire which is generated by thrusting the tongue.
abhyasa: Sit quietly and bring attention to the space between your eyebrows. Without forcing or straining,
  notice the natural position of your tongue in your mouth. Observe any subtle sensations—warmth, coolness,
  tingling, or flow—in that region over 5–10 minutes. This is not instruction in the technique, but an
  invitation to sense the terrain the text describes.
