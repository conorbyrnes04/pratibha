title: These six kinds of actions which cleanse the body…
unit_type: verse
commentary: 'Svātmārāma emphasizes that the preliminary cleansing practices (ṣaṭ-karma) are not mere hygiene
  but transformative work that yields subtle capacities—and must be guarded as sacred knowledge. The injunction
  to ''keep secret'' reflects the traditional understanding that these practices require proper context,
  qualified guidance, and sincere commitment; their power lies partly in their protected transmission.
  This opening frames haṭha yoga not as public technique but as disciplined inner work.



  Key Terms



  **ṣaṭ-karma** — The six cleansing actions of haṭha yoga; preliminary practices that purify the body''s
  channels and humors, preparing it for breath work and meditation.

  **samādhi** — Absorption or unified consciousness; the ultimate state of yoga toward which all practices
  point.



  Cross-Tradition Resonances



  **Tao Te Ching 15:** Both texts prize hiddenness and subtlety: ''The ancient masters were profound and
  subtle''—true mastery is not displayed but lived quietly. Divergence: The Tao Te Ching speaks of hiddenness
  as natural simplicity; Svātmārāma frames it as deliberate protection of sacred practice.


  **Dhammapada 185–186:** Both emphasize earnest, sustained effort: ''Earnestness is the path to the Deathless''—transformation
  requires sincere commitment, not casual dabbling. Divergence: The Dhammapada stresses ethical conduct
  as the foundation; the Pradīpikā begins with bodily purification and prāṇa.'
