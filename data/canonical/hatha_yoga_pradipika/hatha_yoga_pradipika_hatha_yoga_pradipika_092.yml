translation: These six kinds of actions which cleanse the body should be kept secret. They produce extraordinary
  attributes and are performed with earnestness by the best Yogis and Yoginis.
abhyasa: Reflect today on one practice or discipline in your own life that requires both earnestness and
  discretion—something you do not broadcast but that gradually transforms you. Notice how keeping it private
  (not from shame, but from reverence) changes your relationship to it.
