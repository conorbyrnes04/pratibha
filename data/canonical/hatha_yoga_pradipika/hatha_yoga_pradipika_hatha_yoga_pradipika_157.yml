translation: 'This Bhastrika should be performed plentifully, for it breaks the three knots: Brahma granthi
  (in the chest), Visnu granthi (in the throat), and Rudra granthi (between the eyebrows) of the body.'
abhyasa: Sit comfortably with an upright spine. Observe your natural breath for a few cycles. Then, without
  forcing, notice where you feel constriction or heaviness in your chest, throat, or between the eyebrows.
  Bring gentle awareness to one of these places as you breathe. This simple noticing—without judgment—is
  a contemplative entry into the text's concern with blockage and flow.
