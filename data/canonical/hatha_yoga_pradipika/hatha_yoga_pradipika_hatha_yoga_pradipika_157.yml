title: This Bhastrika should be performed plentifully
unit_type: verse
commentary: 'The passage presents Bhastrika (the ''bellows'' breath) as a direct means to dissolve three
  energetic obstructions (granthis) mapped onto the body''s vertical axis. These knots are understood
  as blockages that prevent the free flow of prāṇa (vital energy) and must be cleared for progression
  toward higher states of consciousness. The text''s confidence—''should be performed plentifully''—reflects
  the classical haṭha yoga view that systematic breath work is not merely calming but transformative,
  literally opening channels of the body-mind.



  Key Terms



  **granthi** — Knot; in haṭha yoga, an energetic obstruction or contraction in the subtle body that impedes
  the flow of prāṇa and must be dissolved for spiritual progress.

  **Bhastrika** — Bellows breath; a vigorous prāṇāyāma technique involving rapid, forceful inhalations
  and exhalations, traditionally used to generate heat and clear energetic blockages.

  **prāṇa** — Vital life force or energy that animates the body and mind; the subject of regulation in
  prāṇāyāma practice.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, 1.12–14 (abhyāsa and vairāgya):** Both texts emphasize sustained, earnest
  practice (abhyāsa) as the means to remove obstacles to inner clarity; the Bhastrika passage echoes this
  faith in methodical technique. Divergence: Patañjali''s obstacles are primarily mental (distraction,
  doubt); the Haṭha Yoga Pradīpikā locates them as physical-energetic knots requiring breath and body
  work.


  **Taoist internal alchemy (neigong): clearing blockages in the meridian system:** Both traditions map
  the body as a system of energy channels with specific obstructions that must be opened; both use breath
  and subtle body awareness as tools. Divergence: The Taoist system emphasizes circulation and return
  (microcosmic orbit); the haṭha yoga granthis are mapped vertically along a central axis (suṣumnā) toward
  transcendence rather than cyclical harmony.


  **Meister Eckhart: ''The eye by which I see God is the same eye by which God sees me'':** Both suggest
  that inner obstruction—whether psychological or energetic—prevents direct perception or union; both
  imply that clearing these blocks reveals what is already present. Divergence: Eckhart''s ''knot'' is
  conceptual and volitional (the separate self); the Haṭha Yoga Pradīpikā treats it as a literal energetic
  phenomenon requiring somatic practice.'
