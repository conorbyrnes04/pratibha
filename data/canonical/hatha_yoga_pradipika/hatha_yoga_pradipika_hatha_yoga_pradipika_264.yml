  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Kutilanga (crooked-bodied), Kundalini, Bhujangi (a she-serpent) Sakti, Ishwari, Kuundali, Arunddhati, -- all
  these words are synonymous.
abhyasa: Sit quietly and silently repeat each of these names for the serpent power in turn—Kundalini, Bhujangi, Shakti, Ishwari—noticing
  how each epithet (coiled, serpentine, power, ruler) evokes a different quality or aspect of the same reality. Observe whether
  one name resonates more vividly than others, and what that preference might reveal about your own intuitive entry into the
  teaching.
