commentary: 'This verse establishes that the serpent power—known by many names across Sanskrit philosophical and tantric vocabularies—is
  a single reality approached through multiple designations. By listing synonyms (crooked-bodied, coiled, she-serpent, divine
  power, ruler), Svātmārāma signals that practitioners should not be confused by textual variation; the names point to one
  transformative force. This opening move grounds the subsequent technical teachings in a unified metaphysical vision rather
  than scattered techniques.



  Key Terms



  **Kundalini** — The coiled serpent power; the dormant spiritual energy traditionally located at the base of the spine, which
  haṭha yoga aims to awaken and direct upward through the central channel.

  **Shakti** — Divine power or energy; in tantric contexts, the active, feminine principle of manifestation and transformation.

  **Ishwari** — The feminine form of Ishwara (Lord); here, the sovereign or ruling power, emphasizing the Kundalini''s supreme
  status.



  Cross-Tradition Resonances



  **Upanishads (e.g., Katha Upanishad 1.3.3-4) — the atman as ''smaller than the small, greater than the great'':** Both texts
  use multiple metaphors and names to point toward a single transcendent reality that exceeds any single description. Divergence:
  The Upanishads emphasize the atman as witness and consciousness; the Haṭha Yoga Pradīpikā emphasizes Kundalini as an active,
  embodied energy to be mobilized through technique.


  **Pseudo-Dionysius, *Mystical Theology* — ''the divine darkness'' known by negation and many names:** Both acknowledge that
  ultimate reality transcends singular naming and requires the reader to hold multiple appellations in mind simultaneously.
  Divergence: Pseudo-Dionysius approaches the divine through apophatic (negative) theology; Svātmārāma offers positive, embodied
  designations tied to praxis.


  **Heraclitus, Fragment 50 — ''all things flow'' (panta rhei), the hidden harmony of opposites:** Both suggest that apparent
  multiplicity (many names, many forms) conceals an underlying unified principle in constant motion. Divergence: Heraclitus
  emphasizes cosmic flux and logos; Svātmārāma emphasizes a localized, embodied power that can be awakened and directed through
  discipline.'
