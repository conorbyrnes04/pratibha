translation: This excellent Surya Bhedana cleanses the forehead (frontal sinuses), destroys the disorders
  of Vata, and removes the worms, and, therefore, it should be performed again and again.
abhyasa: 'Today, observe your own breath''s quality and any subtle sensations in your forehead and sinuses.
  Without attempting the technique itself (which requires proper guidance), simply notice: where does
  your breath feel clear or obstructed? This attentiveness to breath as a vehicle of health—not abstraction—honors
  the text''s grounded approach.'
