title: This excellent Surya Bhedana cleanses the forehead…
unit_type: verse
commentary: 'This brief instruction praises Sūrya Bhedana (a specific prāṇāyāma technique involving solar
  breath) for its concrete physiological effects: clearing the frontal sinuses, balancing vāta (one of
  the three humors in Ayurvedic anatomy), and eliminating parasites. The repeated emphasis (''again and
  again'') suggests that consistent practice, not a single session, produces these benefits. The passage
  reflects haṭha yoga''s pragmatic stance: breath work is not merely symbolic but materially transformative,
  addressing both gross bodily ailments and subtle constitutional imbalances.



  Key Terms



  **Sūrya Bhedana** — A prāṇāyāma technique involving solar breath; literally ''sun-piercing,'' traditionally
  practiced by inhaling through the right nostril to activate heating, energizing qualities.

  **vāta** — In Ayurvedic physiology, one of three constitutional humors (doṣa), associated with air,
  movement, and dryness; imbalance causes disorders of the nervous and digestive systems.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra 2.49 (prāṇāyāma as preparation for concentration):** Both texts treat breath
  regulation as foundational work—not an end in itself, but a means to steady the mind and body for higher
  states. Divergence: The Pradīpikā passage emphasizes concrete medical benefit (clearing sinuses, eliminating
  parasites), whereas Patañjali remains abstract about prāṇāyāma''s purpose, focusing on mental preparation.


  **Hippocratic corpus (humoral medicine and repeated practice):** Both traditions recognize constitutional
  imbalances (humors/doṣa) and prescribe repeated therapeutic action to restore equilibrium. Divergence:
  The Pradīpikā locates the remedy in breath and subtle energy channels, while Hippocratic medicine relied
  on bloodletting, diet, and purgation.'
