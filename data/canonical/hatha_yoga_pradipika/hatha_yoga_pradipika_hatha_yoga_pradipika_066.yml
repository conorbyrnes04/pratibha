title: Whether young, old or too old, sick or lean, one…
unit_type: verse
commentary: 'This verse removes the most common excuse for spiritual practice: that one''s body, age,
  or circumstance disqualifies them. Svātmārāma insists that haṭha yoga is accessible to anyone willing
  to abandon *alasya* (laziness or inertia)—the real obstacle is not the body''s condition but the mind''s
  willingness to engage. By naming youth, age, sickness, and leanness explicitly, the text acknowledges
  real physical variation while asserting that none of it prevents *siddhi* (success, or the fruit of
  practice). This democratizes what might otherwise seem an elite discipline.



  Key Terms



  **alasya** — Laziness, inertia, or the habitual postponement of effort; the primary internal obstacle
  to yoga practice according to this verse.

  **siddhi** — Success, accomplishment, or the fruit of sustained practice; here, the realization that
  comes from consistent engagement with yoga.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.23–24 (on yoga as discipline for all):** Both texts affirm that yoga is a path open
  to practitioners of any condition, requiring only steadiness and dedication rather than special birth
  or circumstance. Divergence: The Gītā emphasizes equanimity and duty (*dharma*) as the frame; the Pradīpikā
  focuses on the concrete removal of laziness as the immediate gate.


  **Dhammapada 21 (on effort as the path to the Deathless):** Both traditions teach that consistent effort—not
  talent or favorable circumstance—is the engine of transformation, and that laziness is the primary foe.
  Divergence: The Dhammapada frames effort within the context of ethical conduct and wisdom; the Pradīpikā
  locates it within the body''s prāṇic and postural disciplines.


  **Meister Eckhart, ''Blessed are the poor in spirit'' (on readiness over condition):** Both suggest
  that external condition—poverty, age, weakness—is irrelevant to spiritual opening; what matters is the
  inner posture of willingness. Divergence: Eckhart emphasizes detachment and surrender to divine will;
  the Pradīpikā emphasizes active, embodied discipline and the cultivation of vital force.'
