translation: Whether young, old or too old, sick or lean, one who discards laziness, gets success if he
  or she practices Yoga.
abhyasa: Today, notice one small resistance to practice—fatigue, doubt, a sense that 'today isn't the
  right day.' Name it as laziness without judgment, and do one small practice anyway (three conscious
  breaths, one simple āsana, a minute of stillness). Observe what shifts when you act despite the excuse.
