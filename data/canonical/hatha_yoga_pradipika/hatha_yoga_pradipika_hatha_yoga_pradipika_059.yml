  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By regular and close attention to Nâda (anâhata nâda) in Hatha Yoga, a Brahmachari, sparing in diet, unattached
  to objects of enjoyment, and devoted to Yoga, gains success, no doubt, within a year.
abhyasa: Today, in a quiet moment, sit upright and listen inwardly to the subtle sounds within your own body—a ringing, humming,
  or vibration in the ears or heart region. Do not strain; simply notice what arises when external noise fades. Return to
  this listening for a few minutes without expectation. This is a first acquaintance with the practice the text names.
