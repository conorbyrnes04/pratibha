translation: In the evening the exercise should begin after finishing Sandyha, as before, beginning the
  practice 3 ghatika or one hour before the sun sets.
abhyasa: 'Notice the next time you practice (or sit quietly) in late afternoon. Observe how the quality
  of light, temperature, and your own energy shift as the sun approaches the horizon. Without forcing
  anything, simply sit with the question: *How does my body and breath respond to this threshold between
  day and night?* This is not mysticism but attentiveness to what the text assumes—that timing and natural
  rhythm matter.'
