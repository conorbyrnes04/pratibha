title: In the evening the exercise should begin after finishing
unit_type: verse
commentary: 'This brief instruction anchors yogic practice to the natural rhythm of day and the completion
  of ritual duty (Sandhyā). By placing prāṇāyāma and āsana in the hour before sunset, Svātmārāma aligns
  the aspirant''s inner work with the transition between day and night—a liminal time when the body''s
  energies are said to be naturally receptive. The timing is neither arbitrary nor merely practical; it
  reflects the yoga tradition''s view that practice harmonizes with cosmic rhythms and that ritual purity
  (completing Sandhyā first) prepares the vessel for deeper work.



  Key Terms



  **Sandhyā** — Ritual observance performed at dawn and dusk; literally ''junction'' or ''twilight.''
  Here, the completion of this duty is a prerequisite for formal yoga practice, suggesting that practice
  rests on prior devotional and ritual grounding.

  **ghaṭikā** — A traditional unit of time in Indian measurement, approximately 24 minutes; three ghaṭikās
  equal roughly one hour.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16–17 (on yoga practice and discipline):** Both texts emphasize that yoga requires
  regularity, proper timing, and integration with one''s duties (dharma). The Gītā speaks of the yogi
  who is ''moderate in eating, recreation, and sleep''; the Pradīpikā specifies the hour and prerequisite
  ritual. Divergence: The Gītā frames timing more broadly (avoiding extremes); the Pradīpikā is prescriptive
  about a specific window, suggesting a more technical, physiological concern with prāṇa and the body''s
  cycles.


  **Tao Te Ching 15 (on the sage moving with natural timing):** Both traditions honor alignment with natural
  rhythms—the Taoist sage acts in accord with the Tao''s unforced timing; Svātmārāma places practice at
  the sun''s threshold, honoring the body''s natural receptivity. Divergence: The Tao Te Ching emphasizes
  non-action and spontaneity; the Pradīpikā prescribes precise timing and technique, reflecting yoga''s
  systematic methodology.


  **Ecclesiastes 3:1 (''To everything, a season''):** Both recognize that human action has proper seasons
  and rhythms; practice is not timeless but situated in the turning of day and duty. Divergence: Ecclesiastes
  speaks of life''s seasons philosophically; the Pradīpikā is practical and technical, concerned with
  the physiology of breath and energy at a specific hour.'
