  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Always living in a good locality and having known the secret of the Susumna, which has a
  middle course, and making the Vayu move in it, (the Yogi or Yogini) should restrain the Vayu in the
  Brahma randhra.
abhyasa: Today, sit quietly in a clean, peaceful space. Without forcing breath, simply notice where your
  attention naturally settles in your body. Observe whether your awareness tends to scatter outward or
  whether you can gently draw it inward and upward along the spine. This is a first, non-technical acquaintance
  with the principle of gathering and directing subtle energy.
