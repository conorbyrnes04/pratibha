unit_label: On Mudrās — 3.12
title: It should be expelled then, slowly only and not…
unit_type: verse
commentary: 'This passage emphasizes restraint and gradualism in prāṇic work—the breath or vital force
  must be released with patience, never forced. The term ''Mahā Mudrā'' (the Great Seal) is invoked as
  a name earned through this principle of gentle mastery, suggesting that true wisdom lies not in aggressive
  manipulation of the body''s energies but in their respectful, measured release. The passage appeals
  to lineage authority (''great masters'') to ground this teaching in lived tradition rather than theory
  alone.



  Key Terms



  **Mahā Mudrā** — The Great Seal; in this context, a practice or principle of prāṇic work distinguished
  by gentle, non-violent release of breath or vital force.

  **prāṇa** — Vital life force or breath; the subtle energy that animates the body and is refined through
  haṭha yoga practice.



  Cross-Tradition Resonances



  **Tao Te Ching, verse 15:** Both texts prize subtlety and non-force: ''The ancient masters were profound
  and subtle... because they were subtle, they can only be described with difficulty.'' Svātmārāma''s
  insistence on slow, non-violent release echoes the Taoist principle of wu wei (non-action). Divergence:
  The Haṭha Yoga Pradīpikā frames this restraint within a systematic bodily practice aimed at samādhi,
  whereas the Tao Te Ching speaks of a way of being that transcends technique.


  **Dhammapada, verse 183:** Both traditions value gradual, patient cultivation: ''Gradual is the path,
  gradual the effort, gradual the attainment.'' Svātmārāma''s ''slowly only'' echoes this Buddhist emphasis
  on steady, incremental practice. Divergence: The Dhammapada frames gradualness as ethical and mental
  discipline, while the Haṭha Yoga Pradīpikā applies it specifically to the manipulation of prāṇa and
  the body''s subtle channels.


  **Meister Eckhart, ''Detachment'' sermons:** Both warn against force and violence in spiritual work:
  Eckhart teaches that the soul must be ''empty'' and receptive rather than grasping; Svātmārāma teaches
  that prāṇa must be released gently, not seized. Divergence: Eckhart''s detachment is primarily psychological
  and metaphysical, whereas Svātmārāma''s gentleness is a somatic principle embedded in breath and energy
  work.'
