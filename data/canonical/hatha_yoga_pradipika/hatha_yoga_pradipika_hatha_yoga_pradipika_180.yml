  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: It should be expelled then, slowly only and not violently. For this very reason, the best
  of wise men call it the Maha Mudra. This Muha Mudra has been propounded by great masters.
abhyasa: 'Today, notice one moment where you habitually rush or force—breath, movement, speech, or decision.
  Pause. Practice one conscious exhalation where you release slowly, without strain, observing the difference
  between effort and ease. This mirrors the passage''s teaching: wisdom often lies in what we *don''t*
  do forcefully.'
