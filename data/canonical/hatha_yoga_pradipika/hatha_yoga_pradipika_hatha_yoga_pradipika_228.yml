  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The Apana, naturally inclining downward, is made to go up by force. This Mula Bandha is spoken
  of by Yogis and Yoginis as done by contracting the anus.
abhyasa: Sit quietly and notice the natural downward pull in your lower abdomen and pelvic floor—the apāna's
  ordinary direction. Without forcing, gently contract the anal sphincter and pelvic floor for a few breaths,
  observing the subtle shift in sensation and energy. Release and rest. This simple awareness—of reversal,
  of conscious redirection—is the seed of the practice.
