title: The Apana, naturally inclining downward, is made to…
unit_type: verse
commentary: 'This verse describes Mūla Bandha—a foundational lock in haṭha yoga—as a reversal of the apāna''s
  natural downward flow through muscular contraction. The passage presents the practice not as mystical
  but as a deliberate, forceful redirection of embodied energy; it is the body''s own capacity to work
  against its habitual tendency that enables yogic transformation. By naming both yogis and yoginīs as
  practitioners, the text acknowledges that this work belongs equally to all genders.



  Key Terms



  **Apāna** — One of the five vital winds (vāyus) in yogic anatomy; naturally flows downward and governs
  elimination and descent.

  **Mūla Bandha** — The root lock; a contraction of the pelvic floor and anal sphincter used to redirect
  apāna upward and seal prāṇic energy.



  Cross-Tradition Resonances



  **Tao Te Ching, Ch. 15:** Both texts prize the reversal or inversion of natural tendency as a mark of
  mastery: ''The ancient masters were subtle, profound, and deep. Because they are too deep to be known,
  they must be described by their contraries.'' Divergence: The Haṭha Yoga Pradīpikā grounds reversal
  in the body''s muscular action, while the Tao Te Ching speaks of reversal as a paradox of wisdom and
  non-action (wu wei).


  **Patañjali''s Yoga Sūtra, II.46 (sthira sukham āsanam):** Both texts assume that yoga works through
  the body—through effort and steadiness—as a means toward subtler states. The Pradīpikā''s ''force''
  echoes the disciplined engagement required in all āsana and prāṇāyāma. Divergence: The Sūtra emphasizes
  balance (steadiness and ease together), while this passage stresses the necessity of forceful reversal
  against nature''s grain.'
