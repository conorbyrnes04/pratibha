  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This âsana soon destroyed all diseases, and removes abdominal disorders, and also those arising from irregularities
  of phlegm, bile and wind, digests unwholesome food taken in excess, increases appetite and destroys the most deadly poison.
abhyasa: Today, practice one āsana slowly and with full attention to how your breath, digestion, and sense of ease shift.
  Notice without judgment whether you feel more settled or more open afterward. This simple observation honors the text's
  claim that posture acts on the whole system.
