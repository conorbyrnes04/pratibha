translation: Out of the 84 âsanas Siddhâsana should always be practiced, because it cleanses the impurities
  of 72,000 nâdis.
abhyasa: Sit in a quiet place and, without strain, assume Siddhāsana (or a comfortable seated posture
  if you are unfamiliar with the form). Spend 5–10 minutes simply observing your breath and any sensations
  in the spine and torso. Notice whether stillness in the body creates any shift in mental clarity. This
  is a beginning inquiry into the link between postural stability and inner refinement.
