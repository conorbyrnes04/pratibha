unit_label: On Prāṇāyāma — 2.45
title: At the end of Puraka, Jalandhara Bandha should be…
unit_type: verse
commentary: 'This verse prescribes the precise timing of two foundational locks (bandhas) within the breath
  cycle, establishing that Jalandhara Bandha (throat lock) belongs at the completion of inhalation and
  retention, while Uddiyana Bandha (abdominal lock) is explicitly forbidden during exhalation''s beginning.
  The specificity reveals the text''s concern with protecting the subtle energy channels (nāḍīs) and the
  integrity of prāṇa flow—each lock serves a distinct function at its proper moment, and misplacement
  risks disruption rather than refinement.



  Key Terms



  **Puraka** — Inhalation; the filling of the lungs with air from outside, as clarified in the passage
  itself.

  **Kumbhaka** — Retention of breath; the pause between inhalation and exhalation where prāṇa is held
  and concentrated.

  **Rechaka** — Exhalation; the release and emptying of breath outward.

  **Bandha** — Lock or seal; an energetic contraction of specific body regions used to direct and contain
  prāṇa (vital force) during breath work.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts honor the subtle mastery of timing and non-action: ''The ancient
  masters were profound and subtle... because they were subtle, they must be described with difficulty.''
  Precision in breath-work mirrors the Taoist principle that the deepest effects arise from exact attunement,
  not force. Divergence: The Haṭha Yoga text is explicitly prescriptive and technical, naming exact anatomical
  locks and breath phases, whereas the Tao Te Ching speaks through paradox and emptiness, avoiding technical
  nomenclature.


  **Patañjali''s Yoga Sutras, II.49-50 (on prāṇāyāma):** Both texts treat prāṇāyāma as a gateway practice:
  Patañjali notes that mastery of breath steadies the mind and prepares for concentration (dhāraṇā). The
  Haṭha Pradīpikā''s precision with bandhas serves the same aim—to harness and direct prāṇa toward samādhi.
  Divergence: Patañjali remains philosophical and aphoristic; the Haṭha Pradīpikā is a practical manual
  that names specific anatomical techniques and their sequencing.


  **Heraclitus, Fragment 51 (on hidden harmony):** Both suggest that true order lies in precise relationship
  and timing rather than obvious symmetry: ''They do not understand how that which differs with itself
  is in agreement.'' The bandhas work not by brute force but by knowing *when* each lock serves the whole.
  Divergence: Heraclitus speaks through paradox about universal flux; the Haṭha text speaks through concrete
  instruction about the body''s energy channels.'
