abhyasa: 'Today, observe your natural breath cycle without forcing it. Notice the three phases: inhalation
  (puraka), retention (kumbhaka), and exhalation (rechaka). Simply witness where each phase begins and
  ends. This attentiveness to the breath''s architecture prepares the ground for understanding why traditional
  practices place specific techniques at specific moments—not as rules imposed, but as invitations to
  work *with* the breath''s own nature.'
