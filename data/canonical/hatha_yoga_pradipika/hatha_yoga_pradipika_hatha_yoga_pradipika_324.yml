translation: The Vedas and the Sastras are like ordinary public women. Sambhavi Mudra is the one, which
  is secluded like a respectable lady.
abhyasa: 'Today, notice the difference between knowing *about* something and *experiencing* it directly.
  Choose one teaching or idea you have read or heard. Sit quietly for a few minutes and ask: Do I merely
  understand this intellectually, or have I felt its truth in my body and breath? This simple inquiry
  honors the passage''s distinction between public knowledge and the secluded, intimate knowing that practice
  cultivates.'
