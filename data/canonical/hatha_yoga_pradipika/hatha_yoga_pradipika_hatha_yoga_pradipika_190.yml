title: This stops the upward motion of all the nadis
unit_type: verse
commentary: 'This verse describes a bandha (energetic lock or contraction) that arrests the flow of vital currents (nadis)
  moving upward through the body. The text claims that this particular practice—identified as Mula Bandha—confers siddhis,
  or extraordinary capacities or perfections. The passage presents bandha not as mere physical technique but as a mechanism
  for redirecting subtle energy toward spiritual attainment, suggesting that control of the nadis is central to the haṭha
  yoga path toward higher realization.



  Key Terms



  **nadi** — In yoga philosophy, a subtle channel or pathway through which vital energy (prana) flows; often described as
  distinct from the physical nervous system.

  **bandha** — A lock or energetic contraction, typically involving muscular engagement and breath retention, used to direct
  or contain prana within specific regions of the body.

  **siddhi** — A perfection, power, or extraordinary capacity said to arise from sustained yogic practice; may be understood
  as spiritual attainment or subtle ability.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, 3.37–3.50 (on siddhis):** Both texts affirm that mastery of subtle energies and mental states
  yields extraordinary capacities; siddhis are presented as natural fruits of yoga. Divergence: Patañjali warns that attachment
  to siddhis can obstruct liberation, whereas the Haṭha Yoga Pradīpikā presents them more straightforwardly as signs of progress
  and gifts of practice.


  **Tao Te Ching, ch. 15 (on the sage''s mastery of subtle forces):** Both traditions suggest that control of invisible currents
  or forces—whether qi or prana—is the mark of advanced practice and leads to extraordinary capability. Divergence: The Tao
  Te Ching emphasizes non-action and receptivity, while the Haṭha Yoga Pradīpikā prescribes deliberate, structured techniques
  (bandha, prāṇāyāma) to achieve mastery.'
