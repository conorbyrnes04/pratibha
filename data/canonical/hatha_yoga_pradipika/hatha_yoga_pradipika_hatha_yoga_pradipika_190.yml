  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This stops the upward motion of all the nadis. Verily this Muha Bandha is the giver of great Siddhis.
abhyasa: Sit quietly and bring attention to the base of your spine. Without forcing, gently notice the natural flow of energy
  or sensation in your body—upward along the spine, or dispersed. Observe for a few minutes how attention itself seems to
  gather or redirect subtle currents. This is contemplative only; actual bandha practice requires qualified guidance.
