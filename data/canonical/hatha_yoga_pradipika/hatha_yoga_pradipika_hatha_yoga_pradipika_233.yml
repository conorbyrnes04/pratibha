  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: These, fire and Apana, go to the naturally hot Prana, which, becoming inflamed thereby, causes
  burning sensation in the body.
abhyasa: In a comfortable seated position, bring gentle awareness to any natural warmth in your body—chest,
  belly, or along the spine. Without forcing breath or movement, simply notice where heat or tingling
  arises. This simple observation honors the text's premise that pranic activity manifests as sensation,
  and trains sensitivity to the body's own signals during practice.
