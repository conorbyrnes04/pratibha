  body: Bitter, sour, saltish, green vegetables, fermented, oily, mixed with til seed, rape seed, intoxicating
    liquors, fish, meat, curds, chhaasa pulses, plums, oil-cake, asafoetida (hinga), garlic, onion, etc.,
    should not be eaten.
