  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Bitter, sour, saltish, green vegetables, fermented, oily, mixed with til seed, rape seed,
  intoxicating liquors, fish, meat, curds, chhaasa pulses, plums, oil-cake, asafoetida (hinga), garlic,
  onion, etc., should not be eaten.
abhyasa: 'Before your next meal, pause and notice: which foods on this list do you habitually consume?
  Choose one to reduce or eliminate for the next week. Observe without judgment whether your energy, digestion,
  or mental clarity shifts. This is not rule-keeping but empirical self-study (svadhyāya).'
