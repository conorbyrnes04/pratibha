title: Bitter, sour, saltish, green vegetables, fermented…
unit_type: verse
commentary: 'This dietary restriction list reflects a classical yoga understanding that certain foods
  create heaviness, agitation, or toxicity in the body-mind system, thereby obstructing the subtle channels
  (nāḍī) and the steady, clear awareness required for prāṇāyāma and meditation. The passage does not moralize
  eating as sin, but treats diet as a practical instrument: what we consume shapes the quality of prāṇa
  (vital energy) and mental clarity available for practice. The specificity of the list—naming fermented,
  pungent, and heavy foods—suggests that yoga is not ascetic rejection but calibrated choice for efficacy.



  Key Terms



  **prāṇa** — vital life-force or breath-energy that animates the body and mind; the subject of prāṇāyāma
  practice

  **nāḍī** — subtle energy channels through which prāṇa flows; their clarity is necessary for advanced
  practice



  Cross-Tradition Resonances



  **Bhagavad Gītā 17.8–10 (Sāttvic, Rājasic, Tāmasic foods):** Both texts classify foods by their energetic
  quality and effect on consciousness; sattvic (pure) foods support spiritual practice. Divergence: The
  Gītā frames diet within a broader philosophy of guṇas (qualities); the Pradīpikā is narrowly focused
  on prāṇāyāma efficacy.


  **Hippocratic medicine (humoral balance):** Both traditions view diet as regulating internal balance
  and clarity; excess of certain tastes (bitter, sour, salty) disturbs equilibrium. Divergence: Hippocratic
  theory targets bodily humors; the Pradīpikā targets subtle energy and mental obstruction.


  **Daoist dietary cultivation (e.g., Secret of the Golden Flower):** Both treat food as medicine for
  energy refinement; heavy or fermented foods are seen as clouding inner work. Divergence: Daoism emphasizes
  longevity and immortality; the Pradīpikā emphasizes samādhi and liberation.'
