translation: He or she who knows the Kechari Mudra is not afflicted with disease, death, sloth, sleep,
  hunger, thirst, and swooning.
abhyasa: 'Today, sit quietly and observe one of the afflictions named—perhaps heaviness, hunger, or the
  pull of sleep. Rather than resisting it, notice how it arises and passes. Ask: what would it mean to
  be so rooted in my own vital energy that this condition no longer *moves* me? This is not suppression,
  but an inquiry into the text''s suggestion that stability precedes freedom.'
