unit_label: On Samādhi — 4.37
title: The two states, the Sambhavi and the Khechari, are…
unit_type: verse
commentary: 'This verse teaches that two distinct mudrās—Sambhavi (gazing at the heart) and Khechari (the tongue gesture in
  the space between the eyebrows)—differ in their physical location but converge in their fruit: absorption of mind into a
  blissful, void-like ground of being. The passage suggests that the path to inner happiness is not singular; what matters
  is the inward turn itself, not the specific technique, so long as it leads the mind to rest in what is called Chita-sukha—the
  joy intrinsic to consciousness itself.



  Key Terms



  **Sambhavi** — A mudrā in which the gaze is turned inward toward the heart; one of two primary states described in this
  passage.

  **Khechari** — A mudrā involving the tongue and the space between the eyebrows; the second primary state, differing from
  Sambhavi by its seat.

  **Chita-sukha** — The intrinsic bliss or happiness of consciousness itself; the ground into which the mind is absorbed through
  these practices.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.2 (''yogaś chitta-vritti-nirodhah''—yoga is the cessation of mental fluctuations):** Both
  texts point to the stilling of mind as the gateway to a deeper state; the Haṭha Yoga Pradīpikā locates this stillness in
  absorption into blissful consciousness. Divergence: Patañjali emphasizes the *cessation* of fluctuations as the primary
  aim; the Pradīpikā emphasizes the *positive* nature of what remains—sukha, happiness—suggesting a more affirmative metaphysics.


  **Meister Eckhart, ''The Godhead is pure nothingness'':** Both traditions describe the ultimate ground as ''void'' (śūnya)
  yet paradoxically full of bliss; both suggest that conceptual understanding must dissolve. Divergence: Eckhart''s void is
  theological (the Godhead beyond being); the Pradīpikā''s void is phenomenological—the lived experience of consciousness
  without object or limitation.


  **Tao Te Ching, ch. 15 (''The ancient masters were subtle, profound, and deep''—dwelling in stillness):** Both texts suggest
  that different external forms or practices may lead to the same inner realization of stillness and harmony. Divergence:
  The Tao Te Ching speaks of the sage''s natural, effortless way; the Pradīpikā prescribes specific bodily and energetic techniques
  as the means to that ease.'
