  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The two states, the Sambhavi and the Khechari, are different because of their seats (being the heart and the
  space between the eyebrows respectively); but both cause happiness, for the mind becomes absorbed in the Chita-sukha-Rupa-atmana
  which is void.
abhyasa: Today, sit quietly and notice where your attention naturally settles when you close your eyes—perhaps the heart region,
  the space between the brows, or elsewhere. Rather than forcing a technique, gently rest your awareness there for a few minutes,
  observing whether the mind grows quieter and any subtle sense of ease or spaciousness arises. This is a gentle inquiry into
  your own seat of absorption, not a formal mudrā practice.
