abhyasa: 'Sit quietly and place your awareness at the base of your spine. Without forcing or visualizing,
  simply notice the quality of sensation or stillness there. Breathe naturally and ask silently: ''What
  lies dormant here? What would it mean to awaken?'' Return to breath. This is not technique, but contemplative
  inquiry into the passage''s central image.'
