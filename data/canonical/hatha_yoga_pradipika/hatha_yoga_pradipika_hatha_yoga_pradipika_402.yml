  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: The Yogi or Yogini, engaged in Samadhi, cannot be killed by any instrument, and is beyond
  the controlling powers of beings. He or she is beyond the reach of incantations and charms.
abhyasa: Sit quietly today and notice one moment when you feel fully absorbed in an activity—a task, a
  conversation, a breath. Observe how, in that moment, worry or external distraction seems to lose its
  grip. This is a small echo of the stability the passage describes. Return to that quality of attention
  when you feel scattered.
