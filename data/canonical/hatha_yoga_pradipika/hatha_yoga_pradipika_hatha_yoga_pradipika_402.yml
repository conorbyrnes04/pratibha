unit_label: On Samādhi — 4.112
title: The Yogi or Yogini, engaged in Samadhi, cannot be…
unit_type: verse
commentary: 'This passage describes samādhi—the culminating absorption of yoga practice—as a state of
  such profound integration that the practitioner becomes invulnerable to external harm, whether physical,
  magical, or social. The claim is not metaphorical but ontological: in samādhi, the ordinary boundaries
  between self and world dissolve, placing the yogi beyond the reach of forces that operate through those
  boundaries. This reflects the text''s view that yoga is not merely physical training but a transformation
  of one''s fundamental relationship to existence.



  Key Terms



  **Samādhi** — Meditative absorption or union; the culminating state in yoga where the mind becomes unified
  with its object, transcending ordinary subject-object duality.

  **Yogi / Yogini** — A male or female practitioner of yoga; one engaged in the systematic discipline
  of physical, energetic, and mental cultivation.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.70 (on the sage unmoved by desire):** Both texts describe a state beyond the reach
  of ordinary forces—the Gītā''s sage is untouched by desire and fear; the Pradīpikā''s yogi is beyond
  weapons and charms. Divergence: The Gītā emphasizes ethical detachment and duty; the Pradīpikā emphasizes
  the technical, energetic transformation of prāṇāyāma and samādhi.


  **Patañjali''s Yoga Sūtra 1.2 (yoga as cessation of mental fluctuations):** Both texts locate yoga''s
  power in the stilling of ordinary mental activity, from which invulnerability or freedom naturally arises.
  Divergence: The Sūtra is aphoristic and philosophical; the Pradīpikā is practical and embodied, grounding
  freedom in breath and energy work.'
