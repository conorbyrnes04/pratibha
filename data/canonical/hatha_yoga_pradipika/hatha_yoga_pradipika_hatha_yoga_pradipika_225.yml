title: The portions above and below the navel, should be…
unit_type: verse
commentary: 'This verse describes a core prāṇāyāma or bandha practice—the drawing of the abdominal region
  toward the spine—and makes an extraordinary claim: that sustained practice over six months yields mastery
  over death. The passage reflects the haṭha yoga worldview in which the body''s subtle energies, when
  redirected and controlled through precise technique, can transform one''s relationship to mortality
  itself. The specificity of ''six months'' suggests both a realistic training timeline and a symbolic
  threshold; ''conquering death'' likely means transcending fear of it, or accessing a state of consciousness
  beyond ordinary temporal consciousness, rather than literal immortality.



  Key Terms



  **navel (nābhi)** — In haṭha yoga, the navel region is a vital energy center; practices that engage
  it are said to affect the whole system of prāṇa (life force).

  **conquer death (mṛtyu-jaya)** — In yoga philosophy, not literal immortality, but liberation from the
  fear and ignorance that bind consciousness to the cycle of suffering and rebirth.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.20 (''na jāyate mriyate vā kadācit''—''the Self is never born, nor does it die''):**
  Both texts point toward a transcendence of death-consciousness through knowledge or practice; death
  is reframed as illusion or irrelevance. Divergence: The Gītā teaches this through jñāna (wisdom); the
  Pradīpikā teaches it through embodied prāṇa-work, making the body itself a vehicle of liberation.


  **Taoist internal alchemy (neidan): circulation of qi through the microcosmic orbit to refine and preserve
  the life force:** Both traditions use subtle-body practices and breath control to redirect vital energy
  inward, away from dissipation, toward longevity and transcendence. Divergence: Taoism often emphasizes
  preservation and longevity as practical aims; haṭha yoga frames the practice as a rung on the ladder
  to samādhi, a state beyond time.'
