title: As camphor disappears in fire, and rock salt in…
unit_type: verse
commentary: 'This verse distills the ultimate aim of haṭha yoga practice: the dissolution of individual
  mind into the unchanging Self (ātmā). The similes—camphor vanishing in flame, salt dissolving in water—suggest
  not annihilation but a loss of separate form; the substance remains, but its bounded identity ceases.
  The passage frames the yogic path not as acquisition but as recognition that the mind''s apparent independence
  is illusory when unified with what is eternal.



  Key Terms



  **ātmā** — The eternal Self or innermost essence; in Advaita and haṭha yoga contexts, the unchanging
  consciousness underlying all individual minds.

  **mind (manas)** — The individual, fluctuating faculty of thought and identity; here portrayed as capable
  of union with the ātmā, at which point its separate sense dissolves.



  Cross-Tradition Resonances



  **Upaniṣads (Kaṭha Upaniṣad 2.3.1): ''When all desires that dwell in the heart are cast away, then the
  mortal becomes immortal and attains Brahman here.'':** Both passages describe liberation as the dissolution
  of individual desire and identity into the infinite; both use the language of loss as gain. Divergence:
  The Upaniṣad emphasizes renunciation of desire; the Haṭha Yoga Pradīpikā emphasizes the *practice* (āsana,
  prāṇāyāma) that prepares the mind for such dissolution.


  **Bhagavad Gītā 2.72: ''This is the state of Brahmi; having attained it, one is not deluded. Abiding
  in it at the time of death, one attains the bliss of Brahman.'':** Both describe a stable, non-deluded
  state of unity with the absolute; both treat it as the fruit of spiritual practice. Divergence: The
  Gītā frames this within dharma and action; the Haṭha Yoga Pradīpikā locates it in the body-based techniques
  of prāṇāyāma and mudrā.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both
  suggest a non-dual recognition in which subject-object duality collapses; both use paradox to point
  beyond conceptual thought. Divergence: Eckhart''s formulation is apophatic and relational (God and soul);
  the Haṭha Yoga text is non-relational—mind and ātmā are not two meeting, but one identity revealed.'
