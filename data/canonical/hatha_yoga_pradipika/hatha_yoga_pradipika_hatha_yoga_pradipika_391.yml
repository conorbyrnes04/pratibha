  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual
    of haṭha yoga — āsana, prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices
    (especially prāṇāyāma, kriyā, and bandha) are traditionally learned under a qualified teacher; offered
    here as a study reading, not an instruction manual.
translation: Whatever is heard in the form of nada, is the sakti (power). That which is formless, the
  final state of the Tatwas, is the Parameswara.
abhyasa: In a quiet moment, sit upright and listen—not to external noise, but to any subtle inner sound
  or vibration (a hum, a tone, a silence with texture). Notice how attention itself seems to move between
  what is heard and what hears. Rest there, without grasping either.
