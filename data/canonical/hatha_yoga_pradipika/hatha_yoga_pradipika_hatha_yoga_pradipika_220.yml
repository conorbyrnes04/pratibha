translation: There is only one seed germinating the whole universe from it; and there is only one Mudra,
  called Khachari. There is only one deva (god) without any one's support, and there is one condition
  called Manonmani.
abhyasa: Sit quietly and hold the awareness that the breath moving through you now is the same vital force
  (prāṇa) that animates all beings. Notice, without forcing, how this recognition begins to quiet the
  mind's usual chatter and sense of separation.
