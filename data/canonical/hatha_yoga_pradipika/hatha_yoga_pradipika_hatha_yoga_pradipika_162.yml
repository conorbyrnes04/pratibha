unit_label: On Prāṇāyāma — 2.93
title: Exercise in Sahita should be continued till success…
unit_type: verse
commentary: 'This passage marks a progression in prāṇāyāma practice: from Sahita (breathing with deliberate inhalation and
  exhalation) to Kevala (breath retention without the mechanical cycle). The shift is not merely technical but marks a threshold—when
  the breath can be held ''with ease,'' the practitioner has moved from disciplined technique to a state where the breath
  itself becomes still and natural. This ease signals readiness for deeper work.



  Key Terms



  **Sahita** — Breathing practice with deliberate inhalation (Puraka) and exhalation (Rechaka); the foundational stage of
  prāṇāyāma.

  **Kevala** — Breath retention (kumbhaka) practiced alone, without the mechanical cycle of inhalation and exhalation; a refined
  state of prāṇāyāma.

  **Rechaka and Puraka** — Exhalation and inhalation respectively; the two active phases of breath control that are absent
  in Kevala.



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali): ''tasmin sati śvāsa-praśvāsayoḥ gati-vicchedaḥ prāṇāyāmaḥ'' — breath control is the cessation
  of the movement of inhalation and exhalation.:** Both texts describe prāṇāyāma as a stilling of the breath''s natural oscillation,
  moving toward a state of suspension. Divergence: Patañjali emphasizes the cessation itself as the definition; Svātmārāma
  emphasizes the *ease* with which this occurs, suggesting a qualitative ripening rather than mere technical achievement.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described with
  difficulty... How can I describe them? Like someone fording a river in winter.'':** Both traditions value a state of natural,
  effortless action (wu wei / sahaja) that emerges only after disciplined practice. Divergence: The Haṭha text is explicitly
  prescriptive and sequential; the Tao Te Ching resists method and hierarchy, pointing instead to a paradoxical simplicity.


  **Heraclitus, Fragment 45: ''The path up and down are one and the same.'':** Both suggest a threshold where opposites (effort
  and ease, movement and stillness) converge into a unified state. Divergence: Heraclitus speaks of paradox and simultaneity;
  Svātmārāma describes a linear progression from one stage to another, with success as the marker of readiness.'
