  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Exercise in Sahita should be continued till success in Kevala is gained. This latter is simply confining the
  air with ease, without Rechaka and Puraka.
abhyasa: Today, observe your own breathing without changing it. Notice where effort appears and where breath flows naturally.
  This simple witnessing prepares the ground for understanding what 'ease' means in practice—not strain, but a quality of
  relaxed attention.
