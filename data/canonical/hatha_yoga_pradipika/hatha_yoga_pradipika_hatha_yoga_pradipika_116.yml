abhyasa: Today, sit quietly and simply notice where you sense movement or aliveness in your body—heart,
  belly, throat, limbs. Without forcing anything, observe the natural rhythm of breath and energy. This
  grounds the passage's map in your own felt experience, preparing the ground for formal practice under
  guidance.
