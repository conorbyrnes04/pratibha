  body: By pulling up the Apana Vayu and by forcing the Prana Vayu down the throat, the yogi or yogini,
    liberated from old age, becomes young, as it were 16 years old. (Note.--The seat of the Prana is the
    heart; of the Apana anus; of the Samana the region about the navel; of Udana the throat; while the
    Vyana moves throughout the body.)
