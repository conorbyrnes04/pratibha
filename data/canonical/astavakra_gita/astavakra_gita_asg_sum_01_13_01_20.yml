  unchanging Self (kūṭastha), the body-identification as the noose (pāśa), the bondage of even seeking...'
translation_literal: 'Contemplate the Self as the unmoving, non-dual consciousness.


  I am the appearance; having shed confusion, I am neither outer nor inner form.


  Long have you been bound, child, by the rope of identification with the body. I am consciousness—cut
  through that with the sword of knowledge and be free.


  You are without attachment, without action, without burden, cool in nature. This very abiding in samādhi
  is your bondage.


  This entire universe is pervaded by you, woven through you as it truly is. You are of the nature of
  pure consciousness—do not fall into petty-mindedness.


  Be without dependence, without change, without weight, with a cool heart. Unshaken, of unfathomable
  intellect, abide as the vasana of consciousness alone.


  Know the form-bearing as false, the formless as unmoving. Through this teaching of truth, there is no
  return to birth.


  As the reflection stands within the mirror, so too the Supreme Lord stands within this body. Just so.


  One space pervades all, outside and inside the pot alike. Eternal, unbroken Brahman dwells thus in all
  beings.'
commentary: 'This passage forms the heart of Aṣṭāvakra''s radical teaching: the Self (ātman) is eternally
  free, untouched by bondage or practice. The guru moves through several interlocking recognitions.


  First, he establishes the nature of the witness-consciousness (sākṣin): it is kūṭastha (immovable, unchanging),
  advaita (non-dual), and self-luminous. The seeker''s confusion arises not from the Self but from identification
  with appearance—the body-mind complex. The metaphor of the rope binding is apt: it is not the Self that
  is bound, but the sense of ''I-am-the-doer'' that must be severed by the sword of knowledge (jñānakhaḍga).


  Second, Aṣṭāvakra points to a subtle trap: even samādhi (meditative absorption) can become a subtle
  bondage if the meditator still harbors the sense of ''one who abides in samādhi.'' True freedom is prior
  to all states—waking, dream, sleep, or trance. The Self is niṣkriya (actionless), niḥsaṅga (unattached),
  and nirañjana (untainted). It cannot be improved or degraded by practice.


  Third, the teaching uses the mirror and the pot as pointers to non-dual pervasion. Just as space (vyoma)
  is one, both outside and inside the pot, so Brahman (the absolute consciousness) is singular, pervading
  all beings yet never divided. The universe is ''woven through'' the Self not as a creation separate
  from it, but as an appearance within it—like waves in the ocean, never separate from water.


  The final instruction is crucial: form-bearing (sākāra) appearances are mithyā (false—not absolutely
  real, but not wholly unreal either), while the formless (nirākāra) consciousness is niścala (immovable,
  unchanging). This discrimination cuts through the root of rebirth: once the Self is recognized as the
  ever-free witness, the mechanism of karma and return dissolves. There is no ''one'' to be reborn because
  there never was a separate doer to begin with.


  The passage speaks to the ever-present freedom of the sākṣin—the witness that observes all states, all
  actions, all identifications, yet remains untouched. This is not a freedom to be gained but to be recognized
  as already the case.


  Key Terms


  **sākṣin** — The witness-consciousness; the ever-present awareness that observes all states and experiences
  without being affected by them.

  **kūṭastha** — The immovable, unchanging principle; that which stands firm and unshaken at the core
  of all change.

  **niṣkriya** — Actionless, free from agency; the Self''s nature as untouched by doership or the sense
  of ''I am the actor.'''
insight: ''
practice: 'The moment you notice yourself as the observer of your body moving through space—walking, sitting,
  eating—interrupt that observation and ask: who is watching? Then stop looking for an answer and return
  to the ordinary action, now as the unmoving consciousness in which the body appears, like a reflection
  in a mirror that does not move when the reflection moves.'
sanskrit_devanagari: 'कूटस्थं बोधमद्वैतमात्मानं परिभावय ।


  आभासोऽहं भ्रमं मुक्त्वा भावं बाह्यमथान्तरम् ॥


  देहाभिमानपाशेन चिरं बद्धोऽसि पुत्रक ।


  बोधोऽहं ज्ञानखड्गेन तन्निकृत्य सुखी भव ॥


  निःसङ्गो निष्क्रियोऽसि त्वं स्वप्रकाशो निरञ्जनः ।


  अयमेव हि ते बन्धः समाधिमनुतिष्ठसि ॥


  त्वया व्याप्तमिदं विश्वं त्वयि प्रोतं यथार्थतः ।


  शुद्धबुद्धस्वरूपस्त्वं मा गमः क्षुद्रचित्तताम् ॥


  निरपेक्षो निर्विकारो निर्भरः शीतलाशयः ।


  अगाधबुद्धिरक्षुब्धो भव चिन्मात्रवासनः ॥


  साकारमनृतं विद्धि निराकारं तु निश्चलम् ।


  एतत्तत्त्वोपदेशेन न पुनर्भवसम्भवः ॥


  यथैवादर्शमध्यस्थे रूपेऽन्तः परितस्तु सः ।


  तथैवाऽस्मिन् शरीरेऽन्तः परितः परमेश्वरः ॥


  एकं सर्वगतं व्योम बहिरन्तर्यथा घटे ।


  नित्यं निरन्तरं ब्रह्म सर्वभूतगणे तथा ॥'
sanskrit_iast: 'kūṭasthaṃ bodhamadvaitamātmānaṃ paribhāvaya |


  ābhāso''haṃ bhramaṃ muktvā bhāvaṃ bāhyamathāntaram ||


  dehābhimānapāśena ciraṃ baddho''si putraka |


  bodho''haṃ jñānakhaḍgena tannikṛtya sukhī bhava ||


  niḥsaṅgo niṣkriyo''si tvaṃ svaprakāśo nirañjanaḥ |


  ayameva hi te bandhaḥ samādhimanutiṣṭhasi ||


  tvayā vyāptamidaṃ viśvaṃ tvayi protaṃ yathārthataḥ |


  śuddhabuddhasvarūpastvaṃ mā gamaḥ kṣudracittatām ||


  nirapekṣo nirvikāro nirbharaḥ śītalāśayaḥ |


  agādhabuddhirakṣubdho bhava cinmātravāsanaḥ ||


  sākāramanṛtaṃ viddhi nirākāraṃ tu niścalam |


  etattattvopadeśena na punarbhavasambhavaḥ ||


  yathaivādarśamadhyasthe rūpe''ntaḥ paritastu saḥ |


  tathaivā''smin śarīre''ntaḥ paritaḥ parameśvaraḥ ||


  ekaṃ sarvagataṃ vyoma bahirantaryathā ghaṭe |


  nityaṃ nirantaraṃ brahma sarvabhūtagaṇe tathā ||'
