sanskrit_devanagari: 'एको विशुद्धबोधोऽहमिति निश्चयवह्निना ।

  प्रज्वाल्याज्ञानगहनं वीतशोकः सुखी भव ॥'
sanskrit_iast: 'eko viśuddha-bodho''ham iti niścaya-vahninā |

  prajvālya ajñāna-gahanaṃ vītaśokaḥ sukhī bhava ||'
translation_literal: With the fire of the certainty "I am the one, pure consciousness," burn down the dense forest of ignorance
  and be free from sorrow.
commentary: 'Extended Translation:

  With the fire of the certainty "I am the one, pure consciousness," burn down the dense forest of ignorance and be free from
  sorrow. Be happy.


  *Niścaya* — certainty — is not belief. It is not provisional acceptance. It is the fire (*vahni*) that burns without remainder.
  The forest of ignorance (*ajñāna-gahanam*) is dense precisely because it is not a collection of false beliefs that can be
  corrected one by one — it is a structural orientation, a taken-for-granted relationship to experience. Fire does not argue
  with a forest; it burns it. The certainty that "I am one, pure consciousness" (*eko viśuddha-bodhaḥ*) operates similarly:
  it does not negotiate with the ego''s claims but simply illuminates the ground in which those claims arise. Note the sequence:
  *niścaya* first, then burning, then freedom from sorrow (*vītaśokaḥ*), then happiness — not the other way around. Happiness
  is downstream of recognition, not its cause.'
insight: 'Extended Translation:

  With the fire of the certainty "I am the one, pure consciousness," burn down the dense forest of ignorance and be free from
  sorrow.'
practice: 'Repeat internally, very slowly: "I am one pure consciousness." Not as affirmation in the pop-psychology sense,
  but as an experiment in *niścaya*. Let it settle rather than be asserted. Notice where it meets resistance (the mind''s
  counter-claims) and where it simply rings true. The ringing-true is the fire beginning.'
