- kind: key_terms
  label: Key Terms
  items:
  - term: viśuddha-bodha
    definition: pure consciousness; *viśuddha* (pure, utterly clean, without admixture) + *bodha* (knowing, consciousness)
  - term: niścaya
    definition: certainty, conviction; from *ni* (down, fully) + *caya* (to settle); a settling-down into truth
  - term: vahni
    definition: fire; from *vah* (to carry); fire as that which carries away, consumes, purifies
  - term: ajñāna-gahanam
    definition: the dense forest of ignorance; *gahanam* (dense, impenetrable thicket); the image of ignorance as an ecology,
      not a simple error
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijñāhṛdayam 14
    resonance: '*citivahni* — the Fire of Consciousness that, even when covered, continues to burn; here Aṣṭāvakra asks us
      to recognize and stoke that fire deliberately'
    divergence: ''
    passage_id: pratyabhijnahrdayam.phr_014
  - citation: Heraclitus Fragment 30
    resonance: the ever-living fire as the *logos* of the cosmos — consciousness-as-fire is an ancient Indo-European resonance
    divergence: ''
    passage_id: ''
  - citation: Gospel of Thomas 10
    resonance: '"I have cast fire upon the world, and see, I am guarding it until it blazes" — the same fire of recognition,
