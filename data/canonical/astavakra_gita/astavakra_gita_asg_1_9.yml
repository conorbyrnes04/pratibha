title: Certainty as the Fire That Burns Ignorance
unit_type: sutra
sanskrit_devanagari: 'एको विशुद्धबोधोऽहमिति निश्चयवह्निना ।

  प्रज्वाल्याज्ञानगहनं वीतशोकः सुखी भव ॥'
sanskrit_iast: 'eko viśuddha-bodho''ham iti niścaya-vahninā |

  prajvālya ajñāna-gahanaṃ vītaśokaḥ sukhī bhava ||'
translation_literal: I am one, pure consciousness—hold this certainty as a blazing fire. Set the dense
  forest of ignorance ablaze with it, and you will dwell free of sorrow, at ease.
commentary: 'This verse from Aṣṭāvakra''s teaching cuts to the heart of Advaita realization. The ''I''
  here is not the ego-bound person, but the ever-present witness-consciousness (sākṣin) that observes
  all experience without being touched by it. The Sanskrit eko viśuddha-bodho—''one pure consciousness''—points
  to non-duality: there is no multiplicity of selves, only the singular, untouched awareness that has
  always been free.


  The image of niścaya-vahni, the ''fire of certainty,'' is crucial. Ignorance (ajñāna) is not a substance
  to be destroyed by external force, but a false identification—a dense tangle (gahana) of mistaken belief
  that ''I am the body-mind.'' When direct certainty arises that you are consciousness itself, not its
  contents, that false identification burns away instantly. The fire does not create the Self; it removes
  the obscuration.


  Vītaśokaḥ—''free of sorrow''—is the natural result. Sorrow arises only when we believe we are limited,
  vulnerable, and responsible for outcomes. The witness-Self, by its very nature, stands apart from all
  becoming, all doing, all consequence. It is not that you become free; you recognize you have never been
  bound.


  This verse teaches that liberation is not a state to be achieved but a truth to be seen clearly. The
  certainty itself is the fire; no practice, no discipline, no future attainment is needed—only the direct
  recognition: ''I am that untouched, unchanging consciousness.''


  Key Terms


  **sākṣin** — The witness-consciousness; the unchanging awareness that observes all experience without
  identification or agency.

  **ajñāna** — Ignorance; the false identification with the body-mind and the forgetting of one''s true
  nature as consciousness.

  **niścaya** — Certainty; direct, unshakeable recognition of the truth, not intellectual belief.'
insight: 'Extended Translation:

  With the fire of the certainty "I am the one, pure consciousness," burn down the dense forest of ignorance
  and be free from sorrow.'
practice: When a sorrow or complaint arises in your mind today, pause and whisper the line 'I am one,
  pure consciousness'—not as affirmation but as a blade. Watch that sorrow like smoke passing through
  an untouched sky, and notice what remains aware of both the smoke and the sky. Return to this noticing
  each time the dense forest of complaint tries to grow back.
