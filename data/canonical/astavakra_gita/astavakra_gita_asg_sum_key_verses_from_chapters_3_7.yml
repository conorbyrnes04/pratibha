source_excerpt: '3.3 — The Universe as Ocean

  viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare | so''ham asmīti vijñāya kiṃ dīna iva dhāvasi ||

  "The universe manifests like waves in the ocean.'
translation_literal: 'The universe shines forth here like waves in the ocean. Knowing ''I am that,'' why
  do you run about as though diminished?


  I am infinite like space; the world is natural like a pot. This knowing brings neither renunciation
  nor grasping, no dissolution.


  In me, the boundless ocean, the universe is merely a name—a mental construct. I stand as this: utterly
  still, without form.'
commentary: 'These three verses form a unified teaching on the ever-free, ever-present Self (ātman). The
  first verse establishes the core recognition: just as waves have no separate existence from the ocean—they
  are the ocean in motion—so the entire universe (viśvam) arises and subsides within the Self without
  ever touching its nature. The questioner (presumably Janaka) is asked why, having glimpsed this truth
  (''I am that''), he continues to behave as though bound, diminished, or incomplete. The question itself
  dissolves the illusion of doership.


  The second verse deepens this by using two spatial metaphors. Space (ākāśa) is the classical Advaita
  image for consciousness: all-pervasive, untouched by what moves within it, neither accepting nor rejecting.
  The world (jagat) is ''natural'' (prākṛta)—it arises from prakṛti (nature/materiality) as a pot arises
  from clay. Crucially, this recognition brings ''neither renunciation nor grasping, no dissolution''
  (na tyāgo na graho layaḥ). The Self does not need to renounce the world or grasp it; there is no process
  of dissolution or integration because the Self was never bound. This cuts through both ascetic rejection
  and spiritual seeking.


  The third verse completes the vision: the Self is described as ''boundless ocean'' (ananta-mahā-ambhodhau),
  and the universe within it is ''merely a name''—a vikalpanā, a mental construct, a conceptual overlay
  with no independent reality. The Self remains ''utterly still'' (atiśānta) and ''without form'' (nirākāra).
  This is not nihilism; it is the recognition that consciousness itself is the only reality, and all apparent
  multiplicity is its play, never separate from it.


  The teaching points to the sākṣin (witness-consciousness) that observes all experience—thought, sensation,
  emotion, even the sense of ''I am a doer''—without being implicated in any of it. The freedom being
  pointed to is not something to achieve but something to recognize as already the case. The very act
  of ''running about'' (dhāvasi) in spiritual seeking, renunciation, or self-improvement is the forgetting
  of what you already are.


  Key Terms


  **sākṣin** — The witness-consciousness; the unchanging awareness that observes all experience without
  being affected by it.

  **vikalpanā** — Mental construct, conceptual overlay, imagination; the apparent multiplicity of the
  world as a projection of mind rather than independent reality.

  **ātman** — The Self; consciousness itself; the non-dual reality that is both the innermost essence
  of the individual and the ground of all existence.'
insight: ''
practice: 'The next time you feel yourself rushing—toward a goal, away from discomfort, seeking something—stop
  and whisper, ''Why do I run about as though diminished?'' Then stand still for three breaths, feeling
  your body as space itself: untouched, all-pervasive, with the world moving like waves within you, not
  against you.'
sanskrit_devanagari: 'विश्वं स्फुरति यत्रेदं तरङ्गा इव सागरे ।


  सोऽहमस्मीति विज्ञाय किं दीन इव धावसि ॥


  आकाशवदनन्तोऽहं घटवत् प्राकृतं जगत् ।


  इति ज्ञानं तथैतस्य न त्यागो न ग्रहो लयः ॥


  मय्यनन्तमहाम्भोधौ विश्वं नाम विकल्पना ।


  अतिशान्तो निराकार एतदेवाहमास्थितः ॥'
sanskrit_iast: 'viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare |


  so''hamasmīti vijñāya kiṃ dīna iva dhāvasi ||


  ākāśavadananto''haṃ ghaṭavat prākṛtaṃ jagat |


  iti jñānaṃ tathaitasya na tyāgo na graho layaḥ ||


  mayyanantamahāmbhodhau viśvaṃ nāma vikalpanā |


  atiśānto nirākāra etadevāhamāsthitaḥ ||'
