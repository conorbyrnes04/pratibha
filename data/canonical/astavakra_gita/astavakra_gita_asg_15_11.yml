  items:
  - term: ananta-mahāmbhodhi (अनन्तमहाम्भोधि)
    definition: 'ananta ‘endless’ + mahā ‘great’ + ambhodhi ‘ocean’ → the Self as infinite ocean in which world-waves rise
      → trap: poetic metaphor only; here it is ontological location'
  - term: viśva-vīci (विश्ववीचि)
    definition: 'viśva ‘universe’ + vīci ‘wave’ → universe as wave-nature within awareness → trap: ‘world’ as solid second
      substance'
    lemma_id: maya
    sense_id: maya.advaita
  - term: vṛddhi / kṣati (वृद्धि / क्षति)
    definition: 'growth / loss → neither accrues to ocean-Self when waves rise or fall → trap: spiritual progress as addition
      to Self'
