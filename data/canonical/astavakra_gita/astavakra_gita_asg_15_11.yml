sanskrit_devanagari: 'त्वय्यनन्तमहाम्भोधौ विश्ववीचिः स्वभावतः ।

  उदेतु वास्तमायातु न ते वृद्धिर्न वा क्षतिः ॥'
sanskrit_iast: 'tvayy ananta-mahāmbhodhau viśva-vīciḥ svabhāvataḥ |

  udetu vāstamāyātu na te vṛddhi na vā kṣatiḥ ||'
translation_literal: In you, the infinite great ocean, the wave of the universe rises and sets by its own nature.
commentary: 'Extended Translation:

  In you, the infinite great ocean, the wave of the universe rises and sets by its own nature. There is neither growth nor
  loss for you.


  *Na te vṛddhiḥ na vā kṣatiḥ* — neither growth nor loss for you — is the practical consequence of the ocean-wave recognition.
  If you are the ocean, the arising of a wave does not add to you; its subsiding does not diminish you. Pleasure does not
  grow you; pain does not diminish you. Praise does not expand you; blame does not contract you. This is *samadarśana* — equal
  vision — but grounded not in moral equanimity but in ontological recognition. The yogi who embodies this does not suppress
  response to pleasure and pain; they simply recognize that the ocean is not enlarged or reduced by the wave.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 15: *viśvam ātmasāt karoti* — making the universe one''s own; the same ocean-recognition in active
  voice

  - Plotinus *Enneads* VI.5: the One is not increased by what proceeds from it, nor diminished; the perfect parallel

  - Dào Dé Jīng ch. 16: "Returning to the root is stillness. Returning to the root is called returning to destiny" — the wave
  returning to the ocean as the natural movement


  ## Chapters 16–18 · *The Liberated One*


  > *These chapters constitute the text''s portrait of the jīvanmukta — the one liberated while living. Rather than prescriptions,
  they are descriptions: phenomenological accounts of what liberation looks like from the outside and feels like from the
  inside. They function as a mirror for the reader''s own recognition.*'
insight: 'Extended Translation:

  In you, the infinite great ocean, the wave of the universe rises and sets by its own nature.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
