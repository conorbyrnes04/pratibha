title: The Ocean Remains Unchanged by Its Waves
unit_type: sutra
sanskrit_devanagari: 'त्वय्यनन्तमहाम्भोधौ विश्ववीचिः स्वभावतः ।

  उदेतु वास्तमायातु न ते वृद्धिर्न वा क्षतिः ॥'
sanskrit_iast: 'tvayy ananta-mahāmbhodhau viśva-vīciḥ svabhāvataḥ |

  udetu vāstamāyātu na te vṛddhi na vā kṣatiḥ ||'
translation_literal: In you, the infinite ocean, the universe-wave rises and falls by its own nature. Whether it emerges or
  dissolves, you gain nothing, you lose nothing.
commentary: 'This verse is the heart of Advaita''s radical claim: you are not the wave, but the ocean itself. The Sanskrit
  structure—tvayy ananta-mahāmbhodhau (in you, the infinite great ocean)—places the Self (ātman) as the unchanging ground
  in which all appearance moves. Viśva-vīciḥ (the universe-wave) is not separate from that ocean; it arises *svabhāvataḥ*
  (by its own nature, or inherently), meaning without requiring any agent or effort from the ocean. The ocean does not *do*
  the waving; the wave is simply what the ocean looks like when movement occurs.


  The final line—na te vṛddhi na vā kṣatiḥ (no increase for you, no decrease)—demolishes the illusion of personal gain and
  loss. This is the sākṣin (witness) teaching: the Self observes all change but is never touched by it. You do not become
  better when circumstances improve, nor worse when they collapse. The doer-sense (kartṛtva) and the sense of being affected
  (bhokṛtva) are both waves; the witnessing awareness is the ocean.


  For the spiritual seeker, this verse cuts through the root of bondage: the belief that *I* am doing, *I* am gaining, *I*
  am losing. Once this is seen directly—not as philosophy but as lived recognition—seeking itself dissolves. There is no one
  to become free; freedom is what remains when the false doer is seen through.


  Key Terms


  **sākṣin** — The witness-consciousness; the Self as pure awareness that observes all phenomena without identification or
  change

  **svabhāvataḥ** — By its own nature; inherently; without external causation—pointing to the spontaneous appearance of the
  world without requiring an agent

  **kartṛtva** — Doership; the false sense of being an agent or actor; the root illusion that binds consciousness to the body-mind'
insight: 'Extended Translation:

  In you, the infinite great ocean, the wave of the universe rises and sets by its own nature.'
practice: 'When something you feared happens or something you wanted arrives, pause and place your hand on your chest. Feel
  your heartbeat—that steady rhythm that continues unchanged whether the news was good or terrible. Let that pulse remind
  you: you are the ocean in which this wave rose and fell. Whisper once: ''I gain nothing, I lose nothing.'' Then return to
  what comes next.'
