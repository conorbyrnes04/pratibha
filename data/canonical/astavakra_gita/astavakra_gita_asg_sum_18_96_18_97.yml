- kind: commentary
  label: Pratibha Commentary
  body: 'Devanāgarī (18.96)

    न सुखी न च वा दुःखी न विरक्तो न सङ्गवान् ।

    न मुमुक्षुर्न वा मुक्ता न किञ्चिन्न च किञ्चन ॥


    IAST

    na sukhī na ca vā duḥkhī na virakto na saṅgavān |

    na mumukṣur na vā muktā na kiñcin na ca kiñcana ||


    Pratibhā Translation

    He is neither happy nor sad, neither detached nor attached, neither desirous of liberation nor liberated. He is neither
    something nor nothing.


    Pratibhā Commentary

    The text dissolves every conceptual category that might contain the liberated state. Happy/sad — no. Detached/attached
    — no. Seeker of liberation/liberated — no. Something/nothing — no. Every binary is refused. This is not nihilism — it
    is apophasis taken to its logical conclusion. Every concept we might apply is derived from the dualistic mind that the
    liberated one has recognized as secondary. The liberated one cannot be contained by any of these categories because all
    these categories are appearances in the witnessing awareness that is their nature. This verse is the Advaita equivalent
    of Nāgārjuna''s catuṣkoṭi (four-cornered negation) — systematically refusing every ontological position.


    Key Terms

    virakta/saṅgavān — detached/attached; both poles of the attachment spectrum are transcended, not achieved

    mumukṣu/mukta — seeker of liberation/liberated; even these meta-categories dissolve; the liberated one is not "liberated"
    in a way that can be contrasted with "bound"

    kiñcin/kiñcana — something/nothing; the final binary, the most fundamental — refused


    Cross-Tradition Resonance

    Mūlamadhyamakakārikā 18.8: the fully realized state cannot be said to be existent, non-existent, both, or neither — the
    same fourfold negation

    Pseudo-Dionysius, Mystical Theology: God is beyond all affirmation and all negation — the same apophatic structure applied
    to divinity rather than liberation

    Meister Eckhart: the soul in the Grunde "neither knows nor loves" in the ordinary sense — the same dissolution of all
    predicates


    > In the final two chapters, Janaka speaks entirely from sovereign recognition. The form is a series of kva (where?) questions
    — rhetorical negations that dissolve every conceptual category by asking where it could possibly be located in the one
    who has recognized the Self. The effect is cumulative: each "where is X?" dissolves another layer of conceptual overlay
    until only the pure recognition remains.'
