source_excerpt: 'Devanāgarī (18.96)

  न सुखी न च वा दुःखी न विरक्तो न सङ्गवान् ।

  न मुमुक्षुर्न वा मुक्ता न किञ्चिन्न च किञ्चन ॥'
translation_literal: Not happy, not unhappy; not detached, not attached. Not seeking liberation, not liberated; nothing and
  yet not nothing. In distraction he is not distracted; in absorption he is not absorbed. In dullness he is not dull—blessed
  one. In learning he is not learned.
commentary: 'These two verses present the paradox at the heart of Advaita: the ever-present witness-Self (sākṣin) stands prior
  to and untouched by all states and conditions. The teaching demolishes the seeker''s last refuge—the hope that some state
  or attainment will finally secure freedom.


  The first verse negates the entire emotional and volitional landscape: happiness and suffering are both movements of the
  mind; attachment and detachment are both mental postures; the desire for liberation and the claim to have achieved it are
  both ego''s strategies. The Self is ''nothing''—no object, no thing—yet simultaneously ''not nothing,'' because it is the
  ever-present awareness in which all things appear.


  The second verse extends this into the realm of mental states. Whether the mind is scattered (vikṣepa) or collected (samādhi),
  whether consciousness appears as dullness (jāḍya) or as intellectual brilliance (paṇḍitya), the witness remains untouched.
  The Self does not become distracted when the mind scatters, nor does it become concentrated when the mind settles. It does
  not become dull or learned. It simply IS—the unchanging ground of all experience.


  The word ''dhanyaḥ'' (blessed, fortunate) is crucial: the one who truly understands this paradox is blessed not because
  they have achieved something, but because they have ceased to seek. They recognize that the freedom they sought was never
  absent, and the bondage they feared was never real. The Self was always already free, untouched by the drama of states,
  practices, and attainments.


  Key Terms


  **sākṣin** — The witness-consciousness; the ever-present awareness that observes all states, thoughts, and experiences without
  being affected by them.

  **vikṣepa** — Distraction or scattering of the mind; mental agitation and dispersal of attention.

  **samādhi** — Absorption or meditative absorption; a state of unified, concentrated consciousness (yet still a state, not
  the Self).'
insight: ''
practice: 'Midway through any activity—working, speaking, eating—stop and notice: am I in this moment as the one experiencing
  it, or as the awareness in which it occurs? Don''t answer; let the question dissolve the boundary. Return to the activity,
  carrying both possibilities at once.'
sanskrit_devanagari: 'न सुखी न च वा दुःखी न विरक्तो न सङ्गवान् ।


  न मुमुक्षुर्न वा मुक्ता न किञ्चिन्न च किञ्चन ॥


  विक्षेपेऽपि न विक्षिप्तः समाधौ न समाधिमान् ।


  जाड्येऽपि न जडो धन्यः पाण्डित्येऽपि न पण्डितः ॥'
