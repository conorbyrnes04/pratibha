- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — Dependent Arising Is Emptiness Is the Middle Way
    resonance: 'Both texts dissolve binary oppositions through a negation-based logic: Astavakra negates all pairs (happy/sad,
      attached/detached, bound/free) to reveal a non-dual state, while Nagarjuna''s dependent arising negates inherent existence
      itself, showing that emptiness is the middle way beyond conceptual extremes.'
    divergence: Astavakra negates dualities to reveal a transcendent witness-consciousness, whereas Nagarjuna negates all
      essences (including consciousness) to reveal the interdependent nature of phenomena—a metaphysical rather than phenomenological
      move.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_18
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 6
    resonance: 'Both texts mark a limit to conceptual knowledge: the Astavakra passage negates all states and positions to
      point beyond the mind''s categories, and Plotinus similarly states the Unity cannot be grasped through ordinary mental
      processes—each suspending rational discourse at the threshold of the absolute.'
    divergence: Astavakra negates through enumeration of psychological states to reveal the witness, while Plotinus negates
      through critique of discursive intellect itself, emphasizing the transcendence of the One beyond even intelligible form.
    passage_id: plotinus_enneads.enn_vi_9_06
  - citation: 'Vijnana Bhairava — Yukti #63'
    resonance: 'Both employ a technique of radical subtraction—Astavakra negates all positions and states to reveal what remains,
      while Vijnana Bhairava''s Yukti #63 instructs the mind to become ''supportless'' by releasing all mental content, arriving
      at the eternal Absolute through the dissolution of all supports.'
    divergence: Astavakra's negation is descriptive (naming the paradoxical state of the liberated one), while Vijnana Bhairava's
      is prescriptive (a meditation technique to achieve that state through sonic and attentional practice).
    passage_id: vijnana_bhairava.yukti_063
