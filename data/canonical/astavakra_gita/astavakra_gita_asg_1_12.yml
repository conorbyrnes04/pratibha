- kind: key_terms
  label: Key Terms
  items:
  - term: vibhu
    definition: all-pervading, omnipresent; from *vi* (across) + *bhū* (to be); that which pervades without limit
  - term: pūrṇa
    definition: full, complete, lacking nothing; the Self's intrinsic fullness as the opposite of *saṃsāra*'s sense of lack
  - term: akriya
    definition: inactive; the Self does not act, even though action occurs *in* it
  - term: bhrāma
    definition: delusion, confusion, mistaken wandering; from *bhram* (to wander); the structural error that generates the
      appearance of bondage
  - term: iva
    definition: as if, as though; the crucial qualifier — *saṃsāravān iva*, "as if a wanderer in saṃsāra"
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Spanda Kārikā I.1
    resonance: the Self as *spanda* — vibrating, active
    divergence: 'but Aṣṭāvakra says *akriya*. The tension between these two is productive: Pratyabhijñā emphasizes the Self''s
      dynamic self-expression; Advaita emphasizes its absolute stillness'
    passage_id: ''
  - citation: Plotinus *Enneads* VI.9
    resonance: the One is beyond all activity; existence proceeds from it without the One acting
    divergence: ''
    passage_id: ''
  - citation: Dào Dé Jīng ch. 37
    resonance: '*wuwei* — non-action; the Tao does nothing yet nothing is left undone; *akriya* as natural ground of all action'
    divergence: ''
    passage_id: ''
