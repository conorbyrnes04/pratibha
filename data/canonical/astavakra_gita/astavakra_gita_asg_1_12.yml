title: Delusion Alone Creates the Appearance of Bondage
unit_type: sutra
sanskrit_devanagari: 'आत्मा साक्षी विभुः पूर्ण एको मुक्तश्चिदक्रियः ।

  असङ्गो निःस्पृहः शान्तो भ्रमात्संसारवानिव ॥'
sanskrit_iast: 'ātmā sākṣī vibhuḥ pūrṇa eko muktaś cid akriyaḥ |

  asaṅgo niḥspṛhaḥ śānto bhrāmāt saṃsāravān iva ||'
translation_literal: The Self is a witness, all-pervading, complete, singular, and free. It is consciousness itself, without
  action. Unattached, without desire, at peace—yet through delusion alone it appears to wander in the cycle of becoming.
commentary: 'This verse cuts to the heart of Advaita''s central paradox: the Self (ātmā) is already and eternally free, yet
  appears bound. Aṣṭāvakra establishes five immutable qualities of the Self: it is sākṣī (witness-consciousness), vibhu (all-pervading),
  pūrṇa (complete, lacking nothing), eka (singular, non-dual), and mukta (liberated). These are not achievements but the Self''s
  actual nature. The Self is cit (pure consciousness) and akriya (actionless)—it neither acts nor causes action, yet all action
  appears to occur within its witnessing presence. It is asaṅga (unattached to experience) and niḥspṛha (free from craving),
  naturally śānta (at peace). The final line delivers the teaching''s sting: bhrāmāt saṃsāravān iva—''through delusion alone
  it appears as if wandering in saṃsāra.'' The word bhrāmāt (from bhrama, delusion or confusion) is key. There is no actual
  bondage, no real cycle, no genuine becoming. The appearance of bondage is not a cosmic fact but a perceptual error—a mistaking
  of the body-mind for the Self. The verse does not say the Self becomes bound; it says bondage appears, like a rope mistaken
  for a snake. This is the radical teaching: you have never actually been in bondage. What is required is not escape but recognition
  of what you have always been.


  Key Terms


  **sākṣī** — witness-consciousness; the ever-present awareness that observes all experience without being altered by it

  **bhrama** — delusion, confusion, or misperception; the mistaking of one thing for another (like rope for snake)

  **saṃsāra** — the cycle of becoming, the apparent round of birth, death, and rebirth; here revealed as appearance only,
  not reality'
insight: 'Extended Translation:

  The Self is witness, all-pervading, full, one, free, consciousness, and inactive.'
practice: 'Pause mid-action—while walking, speaking, or working—and hold your gaze steady on whatever is happening as though
  you are watching a play unfold on a distant stage. Let the thought arise: ''I am the unchanging space in which this entire
  scene moves,'' and feel the difference between the actor and the theater itself.'
