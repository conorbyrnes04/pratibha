sanskrit_devanagari: 'आत्मा साक्षी विभुः पूर्ण एको मुक्तश्चिदक्रियः ।

  असङ्गो निःस्पृहः शान्तो भ्रमात्संसारवानिव ॥'
sanskrit_iast: 'ātmā sākṣī vibhuḥ pūrṇa eko muktaś cid akriyaḥ |

  asaṅgo niḥspṛhaḥ śānto bhrāmāt saṃsāravān iva ||'
translation_literal: The Self is witness, all-pervading, complete, one, free, consciousness, and actionless.
  It is unattached, desireless, and peaceful, yet through delusion appears as if bound in worldly existence.
commentary: 'Extended Translation:

  The Self is witness, all-pervading, full, one, free, consciousness, and inactive. Unattached, desireless,
  peaceful — yet through delusion, it appears as though caught in the cycle of existence.


  A compressed catechism of the Self''s nature in seven qualities, followed by the diagnostic qualifier:
  *bhrāmāt* — through delusion — it *appears* (*iva*) as though caught. *Iva* — "as if," "as though" —
  is the crucial term. The Self does not actually enter *saṃsāra*; it cannot, being *vibhu* (all-pervading)
  and *pūrṇa* (full, lacking nothing). What enters saṃsāra is *bhrāma* — the delusion itself, which has
  no independent ontological status. The appearance of bondage is real as appearance; the bondage itself
  is not real. This distinction — between the *reality of the appearance* and the *appearance of reality*
  — is the heart of Advaita epistemology and the precise difference between Aṣṭāvakra and a naive idealism
  that denies experience.


  Cross-Tradition Resonance:

  - Spanda Kārikā I.1: the Self as *spanda* — vibrating, active — but Aṣṭāvakra says *akriya*. The tension
  between these two is productive: Pratyabhijñā emphasizes the Self''s dynamic self-expression; Advaita
  emphasizes its absolute stillness

  - Plotinus *Enneads* VI.9: the One is beyond all activity; existence proceeds from it without the One
  acting

  - Dào Dé Jīng ch. 37: *wuwei* — non-action; the Tao does nothing yet nothing is left undone; *akriya*
  as natural ground of all action


  Key Terms


  **sākṣī** — The witnessing Self, present to experience without becoming an agent within it.

  **akriyaḥ** — Actionless, indicating that the Self is not itself the doer of embodied activity.

  **asaṅgaḥ** — Unattached, untouched by the changing conditions with which it seems associated.

  **bhrāmāt** — Through delusion, the cognitive error by which the free Self appears to undergo saṃsāra.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.31–32.:** The Gītā likewise describes the imperishable Self as nonacting and untainted
  even while abiding in the body. Divergence: The Gītā embeds this teaching in a devotional and ethical
  framework of duty, whereas this verse states the Self''s freedom with no immediate practical injunction.

  **Patañjali, Yoga Sūtra 1.3.:** Yoga Sūtra 1.3 says that when mental fluctuations cease, the seer abides
  in its own nature, paralleling the verse''s peaceful witnessing consciousness. Divergence: Classical
  Yoga generally affirms many distinct puruṣas and an independent prakṛti, while this verse calls the
  Self one and all-pervading.

  **Udāna 8.3.:** The Buddhist Udāna''s unborn, unbecome, unmade, and unfabricated evokes an unconditioned
  freedom beyond the cycle of conditioned becoming. Divergence: The Udāna does not establish an eternal
  witnessing ātman, since Buddhist teaching rejects a permanent self as the basis of liberation.'
insight: 'Extended Translation:

  The Self is witness, all-pervading, full, one, free, consciousness, and inactive.'
practice: 'Bring to mind something you are currently "caught" in — a worry, a relationship tension, a
  craving. Now notice the awareness in which this "catching" is appearing. Is the awareness itself caught?
  Can the witness be wounded? The witness is *asaṅga* — uncontaminated. Knowing this does not dissolve
  the tension; it relocates you in relation to it.


  ### 1.13 — 1.20

  *(Summary: Aṣṭāvakra continues the declaration through six more verses, elaborating the unchanging Self
  (kūṭastha), the body-identification as the noose (pāśa), the bondage of even seeking samādhi, the universe
  as strung in the Self like beads on a string, and the pot-in-space analogy. Each ends with the same
  imperative: be happy, be free, right now.)*


  *Full verses available in the philological appendix.*


  ## Chapter 2 · *Janaka''s Recognition*

  ### The Student Becomes the Knower


  > *What is extraordinary about Chapter 2 is that Janaka does not say "I understand." He says "I am."
  The dialogue has crossed a threshold. For the remainder of the text, Janaka speaks not as seeker but
  as one who recognizes — and Aṣṭāvakra''s subsequent chapters become confirmation, elaboration, and protection
  of what Janaka has seen.*'
