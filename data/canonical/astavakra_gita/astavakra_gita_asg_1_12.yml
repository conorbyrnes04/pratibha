- kind: translation
  label: Pratibha Translation
  body: The Self is witness, all-pervading, full, one, free, consciousness, and inactive.
- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    The Self is witness, all-pervading, full, one, free, consciousness, and inactive. Unattached, desireless, peaceful — yet
    through delusion, it appears as though caught in the cycle of existence.


    A compressed catechism of the Self''s nature in seven qualities, followed by the diagnostic qualifier: *bhrāmāt* — through
    delusion — it *appears* (*iva*) as though caught. *Iva* — "as if," "as though" — is the crucial term. The Self does not
    actually enter *saṃsāra*; it cannot, being *vibhu* (all-pervading) and *pūrṇa* (full, lacking nothing). What enters saṃsāra
    is *bhrāma* — the delusion itself, which has no independent ontological status. The appearance of bondage is real as appearance;
    the bondage itself is not real. This distinction — between the *reality of the appearance* and the *appearance of reality*
    — is the heart of Advaita epistemology and the precise difference between Aṣṭāvakra and a naive idealism that denies experience.'
- kind: key_terms
  label: Key Terms
  items:
  - term: vibhu
    definition: all-pervading, omnipresent; from *vi* (across) + *bhū* (to be); that which pervades without limit
  - term: pūrṇa
    definition: full, complete, lacking nothing; the Self's intrinsic fullness as the opposite of *saṃsāra*'s sense of lack
  - term: akriya
    definition: inactive; the Self does not act, even though action occurs *in* it
  - term: bhrāma
    definition: delusion, confusion, mistaken wandering; from *bhram* (to wander); the structural error that generates the
      appearance of bondage
  - term: iva
    definition: as if, as though; the crucial qualifier — *saṃsāravān iva*, "as if a wanderer in saṃsāra"
- kind: resonances
  label: Cross-Tradition Resonances
  items:
