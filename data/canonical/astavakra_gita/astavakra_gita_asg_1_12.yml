    resonance: the Self as *spanda* — vibrating, active
    divergence: 'but Aṣṭāvakra says *akriya*. The tension between these two is productive: Pratyabhijñā emphasizes the Self''s
      dynamic self-expression; Advaita emphasizes its absolute stillness'
