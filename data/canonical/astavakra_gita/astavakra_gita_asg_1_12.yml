- kind: practice
  label: Practice (Abhyasa)
  body: 'Bring to mind something you are currently "caught" in — a worry, a relationship tension, a craving. Now notice the
    awareness in which this "catching" is appearing. Is the awareness itself caught? Can the witness be wounded? The witness
    is *asaṅga* — uncontaminated. Knowing this does not dissolve the tension; it relocates you in relation to it.


    ### 1.13 — 1.20

    *(Summary: Aṣṭāvakra continues the declaration through six more verses, elaborating the unchanging Self (kūṭastha), the
    body-identification as the noose (pāśa), the bondage of even seeking samādhi, the universe as strung in the Self like
    beads on a string, and the pot-in-space analogy. Each ends with the same imperative: be happy, be free, right now.)*


    *Full verses available in the philological appendix.*


    ## Chapter 2 · *Janaka''s Recognition*

    ### The Student Becomes the Knower


    > *What is extraordinary about Chapter 2 is that Janaka does not say "I understand." He says "I am." The dialogue has
    crossed a threshold. For the remainder of the text, Janaka speaks not as seeker but as one who recognizes — and Aṣṭāvakra''s
    subsequent chapters become confirmation, elaboration, and protection of what Janaka has seen.*'
