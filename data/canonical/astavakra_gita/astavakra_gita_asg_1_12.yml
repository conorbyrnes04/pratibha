- kind: key_terms
  label: Key Terms
  items:
  - term: vibhu
    definition: all-pervading, omnipresent; from *vi* (across) + *bhū* (to be); that which pervades without
      limit
  - term: pūrṇa
    definition: full, complete, lacking nothing; the Self's intrinsic fullness as the opposite of *saṃsāra*'s
      sense of lack
  - term: akriya
    definition: inactive; the Self does not act, even though action occurs *in* it
  - term: bhrāma
    definition: delusion, confusion, mistaken wandering; from *bhram* (to wander); the structural error
      that generates the appearance of bondage
  - term: iva
    definition: as if, as though; the crucial qualifier — *saṃsāravān iva*, "as if a wanderer in saṃsāra"
