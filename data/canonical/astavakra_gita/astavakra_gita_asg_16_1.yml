sanskrit_devanagari: 'क्व चास्ति क्व च वा नास्ति क्वास्ति चैकं क्व च द्वयम् ।

  बहुनात्र किमुक्तेन किञ्चिन्नोत्तिष्ठते मम ॥'
sanskrit_iast: 'kva cāsti kva ca vā nāsti kvāsti caikaṃ kva ca dvayam |

  bahunātra kim uktena kiñcin nottiṣṭhate mama ||'
translation_literal: Where is there being, where is there not-being? Where is the one, where is the other? Why speak at length
  of many things? Nothing whatsoever arises in me.
commentary: 'This verse cuts through the entire apparatus of conceptual knowledge—the very categories by which the mind divides
  reality into existence and non-existence, unity and duality, presence and absence. The speaker (Aṣṭāvakra, voicing the Self''s
  own recognition) is not denying that appearances occur in the world; rather, he is pointing to the witness-consciousness
  (sākṣin) for whom no category sticks, no division holds.


  The rhetorical questions ''where is being, where is non-being'' do not expect answers because they expose the futility of
  asking them *from* the standpoint of the Self. The Self does not inhabit any location where these opposites could be sorted.
  It is not that the Self knows being and non-being; it is that the Self is prior to the very distinction. This is the radical
  non-dual insight: the ever-present, untouched witness cannot be caught in the net of conceptual pairs.


  The final line—''nothing whatsoever arises in me''—is the crux. This is not nihilism or denial of the world. It is the recognition
  that the Self is actionless, untouched by the arising and falling of all phenomena. Just as the sky is untouched by clouds,
  the Self remains unstirred by the entire play of existence and non-existence. The doer-ship, the sense of ''I am the agent,''
  the burden of karma—all dissolve when this is seen. What remains is the unborn stillness, the ever-free witness that was
  never bound and never acted.


  Key Terms


  **sākṣin** — The witness-consciousness; the ever-present awareness that observes all phenomena without being affected by
  them.

  **ātman** — The Self; the non-dual consciousness that is one''s true nature, untouched by becoming, doership, or bondage.

  **ajanma** — The unborn; that which has never come into being and therefore cannot perish—the eternal ground of all appearance.'
insight: 'Extended Translation:

  Where is existence, where is non-existence, where is oneness, where is duality?'
practice: 'Whenever you catch yourself asking ''why'' or ''how'' about anything—a problem, a feeling, a situation—stop mid-thought
  and whisper: ''Nothing whatsoever arises in me.'' Let the question dissolve without being answered, and notice what remains
  aware of the silence where the question was.'
