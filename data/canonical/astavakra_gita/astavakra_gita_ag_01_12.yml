title: The Witness of the Elements
unit_type: verse
sanskrit_devanagari: 'न पृथ्वी न जलं नाग्निर् न वायुर् द्यौर् न वा भवान् ।

  एषां साक्षिणम् आत्मानं चिद्रूपं विद्धि मुक्तये ॥ १.१२ ॥'
sanskrit_iast: 'na pṛthvī na jalaṃ nāgnir na vāyur dyaur na vā bhavān |

  eṣāṃ sākṣiṇam ātmānaṃ cidrūpaṃ viddhi muktaye || 1.12 ||'
translation_literal: You are not earth, water, fire, air, or sky. Know the Self as the witness of these,
  of the nature of consciousness (cit), for liberation.
commentary: 'The verse removes identification not merely with the body but with the entire elemental field
  from which body and world are conceived: solidity, fluidity, heat, movement, and space. “You” are not
  one item within that field, nor the personal subject that claims it. Āṣṭāvakra directs attention to
  that by which all such appearances are known: the sākṣin, the witness. This witness is not a separate
  observer standing apart from objects; it is consciousness itself, the self-revealing condition in which
  body, senses, thoughts, and elements appear. Thus liberation is not produced by changing the elements,
  refining the personality, or reaching another realm. It is the recognition that awareness was never
  made of, bound by, or altered by what it knows. The instruction is epistemic and immediate: know your
  identity as cidrūpa, consciousness-nature.


  Key Terms


  **sākṣin** — the witness: that which knows all appearances without becoming an object among them

  **ātmānam** — the Self, one’s true identity rather than the body-mind person

  **cidrūpam** — of the nature or form of consciousness

  **muktaye** — for liberation, freedom from misidentification and bondage


  Cross-Tradition Resonances


  **Early Buddhist contemplation observes body, feeling, mind, and phenomena as known, changing processes
  rather than a stable self.:**  Divergence: Āṣṭāvakra positively identifies the ultimate as consciousness-Self;
  classical Buddhism generally rejects any enduring ātman behind experience.

  **Stoic practice distinguishes what is within one’s rational discernment from the external flux of body,
  circumstance, and material events.:**  Divergence: Stoicism retains an ethically active rational agent
  embedded in cosmic nature, whereas this verse points beyond agenthood to the non-doing witness.

  **Apophatic writers such as Pseudo-Dionysius negate finite concepts and images in seeking what exceeds
  created things.:**  Divergence: Christian apophasis preserves a Creator-creature distinction; Advaita
  here treats the deepest Self as non-dual consciousness, not as an eternally separate creature before
  God.'
practice: 'Sit quietly and note five kinds of experience: solidity, fluidity, warmth, movement, and spaciousness.
  With each, ask: “Is this known?” Then rest as the knowing itself, without trying to turn that knowing
  into an object or image.'
