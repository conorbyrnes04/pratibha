commentary: 'Devanāgarī (8.1–8.2)

  तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।

  तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति ॥


  IAST

  tadā bandho yadā cittaṃ kiñcid vāñchati śocati |

  tadā muktir yadā cittaṃ na vāñchati na śocati ||


  Pratibhā Translation

  Bondage is when the mind desires, grieves, grasps, releases, rejoices, or is angered. Liberation is when the mind does none
  of these.


  Pratibhā Commentary

  The most operational definition of bondage and liberation in the text — and deceptively simple. Tadā — at that time — makes
  these simultaneous states rather than permanent conditions. Bondage and liberation are not ontological categories but descriptions
  of the mind''s current movement. When the mind''s movement is characterized by vāñchati (desiring), śocati (grieving), muñcati
  (releasing), gṛhṇāti (grasping), hṛṣyati (rejoicing), kupyati (getting angry) — that is bondage. When none of these movements
  are occurring — that is liberation. This does not require enlightenment as a permanent state; it requires, moment by moment,
  the absence of these contractions.'
insight: ''
practice: Choose one ordinary action today and perform it without haste or self-narration. End with one breath of gratitude.
sanskrit_devanagari: 'तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।


  किञ्चिन् मुञ्चति गृह्णाति किञ्चिद्धृष्यति कुप्यति ॥


  तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति ।


  न मुञ्चति न गृह्णाति न हृष्यति न कुप्यति ॥


  तदा बन्धो यदा चित्तं सक्तं कास्वपि दृष्टिषु ।


  तदा मोक्षो यदा चित्तमसक्तं सर्वदृष्टिषु ॥


  यदा नाहं तदा मोक्षो यदाहं बन्धनं तदा ।


  मत्वेति हेलया किञ्चिन्मा गृहाण विमुञ्च मा ॥'
sanskrit_iast: 'tadā bandho yadā cittaṃ kiñcid vāñchati śocati |


  kiñcin muñcati gṛhṇāti kiñciddhṛṣyati kupyati ||


  tadā muktiryadā cittaṃ na vāñchati na śocati |


  na muñcati na gṛhṇāti na hṛṣyati na kupyati ||


  tadā bandho yadā cittaṃ saktaṃ kāsvapi dṛṣṭiṣu |


  tadā mokṣo yadā cittamasaktaṃ sarvadṛṣṭiṣu ||


  yadā nāhaṃ tadā mokṣo yadāhaṃ bandhanaṃ tadā |


  matveti helayā kiñcinmā gṛhāṇa vimuñca mā ||'
