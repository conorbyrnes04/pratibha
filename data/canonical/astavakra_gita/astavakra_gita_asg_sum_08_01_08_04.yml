- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.7
    resonance: 'Both texts define liberation through the cessation of mental movement: the Astavakra identifies bondage as
      the mind''s desire and grief, while the Chāndogya defines the liberated Self as one that ''desires only what it ought
      to and imagines only what it ought to''—a mind stilled into rightness rather than reactive grasping.'
    divergence: The Chāndogya locates this stillness in the eternal Self's intrinsic nature, whereas Astavakra treats it as
      a recognition available to the mind itself when it ceases its own movements.
    passage_id: chāndogya_upaniṣad.chu_viii_07
  - citation: The Book of Chuang Tzu — Emptiness That Can Receive
    resonance: 'Both passages move toward liberation by negating the mind''s habitual operations: Astavakra names bondage
      as the mind''s desires and sorrows, while Yan Hui''s ''fasting of the mind'' (心齋) empties the mind of its constant grasping,
      leaving only receptive emptiness.'
    divergence: Astavakra frames this as a direct recognition of the mind's non-binding nature, while Zhuangzi prescribes
      a gradual discipline of emptying to reach the state where the mind no longer obstructs.
    passage_id: the_book_of_chuang_tzu.zhuangzi_md_004
  - citation: Bhagavad Gita — Knowledge Burns Ownership
    resonance: 'Both texts propose that a shift in understanding transforms the ontological status of action and mental states:
      Astavakra shows that bondage and freedom are determined by the mind''s relationship to its own movements, while the
      Bhagavad Gita teaches that true knowing ''alters the ontology of action'' itself.'
    divergence: The Gita emphasizes action performed without attachment through knowledge of duty, whereas Astavakra emphasizes
      the mind's cessation of desire and grief as the direct marker of freedom, independent of action.
    passage_id: bhagavad_gita.bg_md_004
