source_excerpt: 'Devanāgarī (8.1–8.2)

  तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।

  तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति ॥'
translation_literal: 'Bondage occurs when the mind desires something, grieves, releases something, grasps
  something, rejoices, or grows angry.


  Liberation occurs when the mind desires nothing, grieves nothing, releases nothing, grasps nothing,
  neither rejoices nor grows angry.


  Bondage occurs when the mind is attached to any particular viewpoint. Liberation occurs when the mind
  is unattached to all viewpoints.


  When there is no ''I,'' there is liberation. When there is an ''I,'' there is bondage. Knowing this
  much, do not cling to anything or push anything away.'
commentary: 'These four verses form the heart of Aṣṭāvakra''s teaching on freedom. They dismantle the
  illusion that bondage and liberation are states to be achieved or conditions imposed from outside. Instead,
  they reveal that bondage and liberation are the direct result of the mind''s relationship to experience.


  In verses 1–2, the teaching is stark: bondage is not a metaphysical prison but the activity of the mind
  itself—its wanting, its sorrow, its releasing and grasping, its emotional reactivity. Liberation is
  not escape to another realm but the cessation of this very movement. The mind at rest, unswayed by desire
  or aversion, is free. This is not passivity or numbness; it is the natural state when the mind stops
  treating experience as something to be controlled or possessed.


  Verse 3 deepens this: bondage is attachment to any fixed view—any belief that reality is *this way*
  and not that way. The moment the mind identifies with a perspective (whether philosophical, personal,
  or perceptual), it has bound itself. Liberation is the mind''s freedom from all viewpoints, not as blank
  unconsciousness but as the capacity to see through any position without being imprisoned by it.


  Verse 4 delivers the radical core: the sense of ''I'' as a doer, a separate agent, is itself bondage.
  When that sense dissolves—when there is no one claiming ownership of actions, thoughts, or experiences—liberation
  is immediate and complete. The final instruction is crucial: do not even cling to this teaching or strain
  to eliminate the ''I.'' That very effort reinforces the doer. Simply recognize the truth and let go
  of all grasping and rejecting.


  The witness-Self (sākṣin) remains untouched by all of this. It is the ever-free awareness in which the
  mind''s movements appear and disappear. Bondage and liberation are movements *within* consciousness,
  not conditions *of* consciousness. The Self is already free; the teaching points to the recognition
  of what has never been bound.


  Key Terms


  **sākṣin** — The witness-consciousness; the ever-present awareness that observes all mental and sensory
  activity without being affected by it.

  **cittam** — Mind or mental substance; the instrument of desire, emotion, attachment, and identification
  that creates the sense of bondage.

  **dṛṣṭi** — Viewpoint or perspective; any fixed belief or conceptual position to which the mind attaches
  itself, creating limitation.'
insight: ''
practice: 'The next time you notice yourself wanting, grieving, grasping, or growing angry—stop mid-movement
  and name it aloud: ''This is bondage.'' Then drop your shoulders, release your jaw, and ask: ''What
  if I release this viewpoint entirely?'' Feel the difference in your body when you do.'
sanskrit_devanagari: 'तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।


  किञ्चिन् मुञ्चति गृह्णाति किञ्चिद्धृष्यति कुप्यति ॥


  तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति ।


  न मुञ्चति न गृह्णाति न हृष्यति न कुप्यति ॥


  तदा बन्धो यदा चित्तं सक्तं कास्वपि दृष्टिषु ।


  तदा मोक्षो यदा चित्तमसक्तं सर्वदृष्टिषु ॥


  यदा नाहं तदा मोक्षो यदाहं बन्धनं तदा ।


  मत्वेति हेलया किञ्चिन्मा गृहाण विमुञ्च मा ॥'
sanskrit_iast: 'tadā bandho yadā cittaṃ kiñcid vāñchati śocati |


  kiñcin muñcati gṛhṇāti kiñciddhṛṣyati kupyati ||


  tadā muktiryadā cittaṃ na vāñchati na śocati |


  na muñcati na gṛhṇāti na hṛṣyati na kupyati ||


  tadā bandho yadā cittaṃ saktaṃ kāsvapi dṛṣṭiṣu |


  tadā mokṣo yadā cittamasaktaṃ sarvadṛṣṭiṣu ||


  yadā nāhaṃ tadā mokṣo yadāhaṃ bandhanaṃ tadā |


  matveti helayā kiñcinmā gṛhāṇa vimuñca mā ||'
