- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    When there is no "I," there is liberation. When there is "I," there is bondage. Knowing this, with ease, neither grasp
    anything nor renounce anything.


    The most direct statement of the *ahaṃkāra* doctrine. When the ego-structure (*ahaṃ* as contraction) is operational, bondage
    is the result — not as punishment but as structural consequence. When that contraction releases, liberation is the natural
    condition of what remains. *Helayā* — with ease, with lightness — is crucial: the prescription is not a grim spiritual
    discipline but a relaxation. And the final line — neither grasp nor renounce — is the text''s most radical practical instruction.
    If you grasp, you reinforce the ego that grasps. If you renounce, you reinforce the ego that renounces. *Māgṛhāṇa vimuñca
    mā* — do neither. Let be. This is *wu wei* in Sanskrit.'
- kind: key_terms
  label: Key Terms
  items:
  - term: helā
    definition: ease, play, lightness; from *hel* (to sport, to play); liberation as the natural ease of the uncontracted
      Self
  - term: māgṛhāṇa
    definition: do not grasp; the double imperative; the *mā* (not) + imperative construction marks urgency
  - term: vimuñca mā
    definition: do not release/renounce; grasping and releasing are two movements of the same contracted mind
