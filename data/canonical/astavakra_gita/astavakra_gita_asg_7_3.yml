title: Ego's Absence as Liberation's Condition
unit_type: sutra
sanskrit_devanagari: 'यदा नाहं तदा मोक्षो यदाहं बन्धनं तदा ।

  मत्वेति हेलया किञ्चिन्मा गृहाण विमुञ्च मा ॥'
sanskrit_iast: 'yadā nāhaṃ tadā mokṣo yadāhaṃ bandhanaṃ tadā |

  matveti helayā kiñcin mā gṛhāṇa vimuñca mā ||'
translation_literal: When there is no 'I', there is liberation. When there is 'I', there is bondage. Knowing
  this much, hold nothing as real, grasp nothing, release nothing.
commentary: 'This verse cuts to the heart of Advaita''s central claim: bondage and liberation are not
  conditions that happen to a self, but are the direct result of the presence or absence of the ego-sense
  itself.


  The structure is stark and reversible: nāhaṃ (no I) → mokṣa (liberation); ahaṃ (I-sense) → bandhanam
  (bondage). This is not a causal chain but an identity. Where ego-identification arises, the sense of
  being bound arises with it. Where ego-identification dissolves, bondage dissolves—not because something
  has been achieved, but because the false premise has been seen through.


  The second line introduces a radical instruction: matveti helayā—''knowing this, with indifference''
  or ''with a light touch.'' The word helayā suggests ease, casualness, even playfulness. Once you see
  that bondage and freedom hinge on the presence or absence of the ego-sense, you are told not to grasp
  this teaching as a doctrine to be held, nor to cling to liberation as a goal to be won, nor to reject
  bondage as an enemy to be fought.


  Kiñcin mā gṛhāṇa vimuñca mā—''do not hold anything as real; do not release anything.'' This is the non-dual
  instruction: there is no one to grasp, nothing to grasp at, and no act of grasping that matters. The
  witness-Self (sākṣin) stands prior to all this movement of ego and its strategies. It is already free
  because it has never identified with the doer or the bound one. The instruction is not to do something,
  but to stop the pretense of doing anything about it.


  This verse invites the reader to see that the very effort to become free, if it is rooted in the ego''s
  desire for liberation, only reinforces the ego. True seeing is the collapse of the ego-sense itself—not
  its improvement or transcendence, but its recognition as never-real.


  Key Terms


  **ahaṃ** — The ego-sense, the false identification with the individual doer; the ''I''-thought that
  claims agency and ownership

  **mokṣa** — Liberation; the natural freedom that is revealed when the ego-sense is no longer believed
  to be real

  **sākṣin** — The witness-Self; the ever-present awareness that observes all experience but is never
  itself an object of experience'
insight: 'Extended Translation:

  When there is no "I," there is liberation.'
practice: 'Throughout your day, when you catch yourself grasping, defending, or holding tight to something
  (an opinion, a possession, a grievance, a plan), pause and whisper the exact words from the passage:
  ''hold nothing as real, grasp nothing, release nothing''—then open your hand (literally, if it''s closed)
  and let your grip soften. Notice if the ''I'' that was doing the grasping loosens in that same moment.'
