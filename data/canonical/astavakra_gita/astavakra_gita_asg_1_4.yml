sanskrit_devanagari: 'यदि देहं पृथक् कृत्य चिति विश्राम्य तिष्ठसि ।

  अधुनैव सुखी शान्तो बन्धमुक्तो भविष्यसि ॥'
sanskrit_iast: 'yadi dehaṃ pṛthak kṛtya citi viśrāmya tiṣṭhasi |

  adhunaiva sukhī śānto bandhamukto bhaviṣyasi ||'
translation_literal: If you set the body aside and rest in consciousness, you will be happy, peaceful, and free from bondage
  — right now.
commentary: '*Adhunaiva* — right now, this very moment — is the hinge of the entire verse and one of the hinge-phrases of
  the entire text. Not after practice. Not after purification. Not after death or final samādhi. Now. The condition is not
  effort but a shift of resting-place (*viśrāmya* — having rested): instead of taking the body as your home, home in consciousness.
  *Pṛthak kṛtya* does not mean physically separating from the body or ignoring it — it means ceasing to identify it as the
  locus of the self. This is the core Pratyabhijñā gesture: recognition, not achievement.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 13: *antarmukhī-bhāvena* — through the inward-facing movement, the mind itself becomes Citi; the same
  turn described here

  - VBT Dhāraṇā 1: *dvādaśānta* practice — resting in awareness at the natural pauses of breath; the same quality of *viśrāmya*

  - Eckhart, Sermon 52: *Abgeschiedenheit* (detachment) as the condition for the Grunde — the ground of the soul recognized
  when identity has shifted from creature to source


  Key Terms


  **adhunaiva** — Immediately, in this very moment, emphasizing liberation as present rather than deferred.

  **pṛthak kṛtya** — Having set apart, meaning disidentifying the body from the self rather than physically abandoning it.

  **citi** — In consciousness, the luminous aware reality in which one is invited to rest.

  **viśrāmya** — Having rested, indicating a shift of existential abiding rather than an achievement produced by effort.


  Cross-Tradition Resonances


  **Bāhiya Sutta, Udāna 1.10:** Its instruction to remain with bare seeing, hearing, sensing, and cognizing likewise presents
  freedom as immediately available through release of self-identification. Divergence: The Buddhist discourse denies an enduring
  conscious self, whereas this verse treats consciousness as the abiding reality in which one rests.

  **Epictetus, Enchiridion 1:** Epictetus similarly counsels distinguishing oneself from bodily conditions and locating freedom
  in what is not subject to external control. Divergence: Stoicism grounds freedom in rational moral agency and disciplined
  judgment, not in resting in a nondual consciousness beyond bondage.

  **Meister Eckhart, Sermon 52, On the Poor in Spirit:** Eckhart’s call for inward detachment from created identity parallels
  the verse’s release of bodily selfhood in an immediate return to one’s deepest ground. Divergence: Eckhart frames detachment
  through the soul’s relation to God and divine birth, rather than identifying consciousness itself as the liberated ground.'
insight: '*Adhunaiva* — right now, this very moment — is the hinge of the entire verse and one of the hinge-phrases of the
  entire text.'
practice: '*Adhunaiva* — right now. Without changing anything — without closing your eyes, without adjusting your posture
  — simply notice: there is awareness present. The body is being held in awareness, not the other way around. Let this be
  enough for thirty seconds. This is *viśrāmya* — resting in the fact that is already the case.'
