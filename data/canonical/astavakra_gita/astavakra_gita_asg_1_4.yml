title: Freedom Awaits in This Very Moment
unit_type: sutra
sanskrit_devanagari: 'यदि देहं पृथक् कृत्य चिति विश्राम्य तिष्ठसि ।

  अधुनैव सुखी शान्तो बन्धमुक्तो भविष्यसि ॥'
sanskrit_iast: 'yadi dehaṃ pṛthak kṛtya citi viśrāmya tiṣṭhasi |

  adhunaiva sukhī śānto bandhamukto bhaviṣyasi ||'
translation_literal: If you set the body apart and rest in awareness, you will be happy and peaceful right now, free from
  bondage.
commentary: 'This verse cuts to the heart of Advaita''s radical claim: liberation is not a future attainment but the ever-present
  condition of consciousness itself. The instruction is deceptively simple—*pṛthak kṛtya*, ''setting apart'' or ''distinguishing''—the
  body from the witnessing awareness (*citi*). This is not dissociation or denial of the body''s existence, but a clear cognitive
  shift: recognizing that you are not the body, its sensations, or its history. The body continues to function; what changes
  is the reference point of identity.


  The phrase *viśrāmya tiṣṭhasi*, ''rest in'' or ''abide as,'' points to a settling into what is already the case. You are
  already awareness; the instruction is to stop mistaking yourself for the body and to notice the consciousness in which all
  experience arises. This recognition is not earned through future effort—*adhunaiva*, ''right now''—because the witness-Self
  (sākṣin) was never bound. Bondage is a misidentification, not an ontological fact.


  The promise *sukhī śānto bandhamukto bhaviṣyasi*—''you will be happy, peaceful, and free from bondage''—does not mean happiness
  arrives later. Rather, when the false identification with the body-mind dissolves, the peace and freedom that are the nature
  of awareness itself become obvious. The ''will be'' (*bhaviṣyasi*) is not temporal promise but the inevitable recognition
  that follows clear seeing. This is the non-dual teaching: you are already free; only the illusion of bondage needs to be
  seen through.


  Key Terms


  **citi** — Consciousness; pure awareness; the witnessing principle that illuminates all experience without being affected
  by it.

  **sākṣin** — The witness; the unchanging awareness that observes the body-mind and the world but is never identified with
  them.

  **bandha** — Bondage; the false identification of the Self with the body-mind, which creates the sense of limitation and
  suffering.'
insight: '*Adhunaiva* — right now, this very moment — is the hinge of the entire verse and one of the hinge-phrases of the
  entire text.'
practice: 'Right now, without moving, notice the sensation of sitting or standing—weight, temperature, texture—and simultaneously
  ask: ''Who is noticing this?'' Let the answer come not as thought but as the simple recognition that awareness itself is
  already here, untouched by what the body feels. Rest there for three breaths as that witnessing presence, then continue
  your day without trying to hold or repeat the recognition.'
