- kind: translation
  label: Pratibha Translation
  body: If you set the body aside and rest in consciousness, you will be happy, peaceful, and free from bondage — right now.
- kind: commentary
  label: Pratibha Commentary
  body: '*Adhunaiva* — right now, this very moment — is the hinge of the entire verse and one of the hinge-phrases of the
    entire text. Not after practice. Not after purification. Not after death or final samādhi. Now. The condition is not effort
    but a shift of resting-place (*viśrāmya* — having rested): instead of taking the body as your home, home in consciousness.
    *Pṛthak kṛtya* does not mean physically separating from the body or ignoring it — it means ceasing to identify it as the
    locus of the self. This is the core Pratyabhijñā gesture: recognition, not achievement.'
- kind: key_terms
  label: Key Terms
  items:
  - term: deha
    definition: body; from *dih* (to smear, to plaster); what is compounded and subject to change
  - term: pṛthak kṛtya
    definition: having set apart, having separated; the act of dis-identification, not physical removal
  - term: citi
    definition: in/as Consciousness (locative); resting *in* awareness rather than *in* body-identification
  - term: viśrāmya
    definition: having rested, taking rest; the quality of the recognition — effortless, like coming home
  - term: adhunaiva
    definition: right now, at this very moment; the radical immediacy of the teaching
