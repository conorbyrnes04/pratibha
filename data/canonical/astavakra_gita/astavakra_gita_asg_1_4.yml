  items:
  - term: deha
    definition: body; from *dih* (to smear, to plaster); what is compounded and subject to change
  - term: pṛthak kṛtya
    definition: having set apart, having separated; the act of dis-identification, not physical removal
  - term: citi
    definition: in/as Consciousness (locative); resting *in* awareness rather than *in* body-identification
    lemma_id: cit
  - term: viśrāmya
    definition: having rested, taking rest; the quality of the recognition — effortless, like coming home
  - term: adhunaiva
    definition: right now, at this very moment; the radical immediacy of the teaching
