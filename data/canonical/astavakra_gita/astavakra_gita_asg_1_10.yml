- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    Where this universe appears like an imagined rope-snake — there lies bliss, supreme bliss. You are that knowing. Be happy.


    The *rajju-sarpa* (rope-snake) is the most famous illustration in Advaita philosophy: seeing a coiled rope in dim light
    and mistaking it for a snake. When the light comes and the rope is seen clearly, the snake does not "disappear" — it was
    never there. The world, similarly, does not disappear in liberation — it is recognized as what it always was: the one
    Consciousness appearing as multiplicity. *Yatra* — "where" — points not to a location but to the ground of recognition
    itself. That ground is *ānanda* — bliss — and specifically *paramānanda*, supreme bliss. Not the bliss of pleasant experience,
    which is a mental event, but the intrinsic fullness of consciousness knowing itself. *Sa bodhaḥ tvaṃ* — that knowing is
    you.'
- kind: key_terms
  label: Key Terms
  items:
  - term: rajju-sarpa
    definition: rope-snake; the paradigmatic Advaita illustration of *vivartavāda* (the doctrine of apparent transformation)
  - term: kalpita
    definition: imagined, superimposed; from *kḷp* (to arrange, to imagine); the universe as the mind's superimposition on
      Consciousness
  - term: bhāti
    definition: appears, shines; from *bhā* (to shine); the universe as appearance within the light of awareness
  - term: paramānanda
    definition: supreme bliss; the intrinsic fullness of Consciousness, prior to and independent of all pleasant experience
  - term: bodha
    definition: knowing, pure consciousness; here as the locus of bliss, not merely the instrument of knowledge
