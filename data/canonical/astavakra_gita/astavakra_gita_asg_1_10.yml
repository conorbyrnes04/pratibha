- kind: practice
  label: Practice (Abhyasa)
  body: 'Look at any object in your environment. Now ask: what is the object *appearing in*? What is the field or space in
    which this object is arising? Rest in that field — the awareness within which the object is a guest. The object remains.
    Your relationship to it shifts from "thing encountered" to "appearance within." Notice what quality of ease or bliss is
    latent in that shift.'
