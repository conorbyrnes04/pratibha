title: The Universe Dissolves In Clear Seeing
unit_type: sutra
sanskrit_devanagari: 'यत्र विश्वमिदं भाति कल्पितं रज्जुसर्पवत् ।

  आनन्दपरमानन्दः स बोधस्त्वं सुखं भव ॥'
sanskrit_iast: 'yatra viśvam idaṃ bhāti kalpitaṃ rajju-sarpavat |

  ānanda-paramānandaḥ sa bodhas tvaṃ sukhaṃ bhava ||'
translation_literal: Where this universe appears as a mere construct—like a snake imagined in a rope—there
  is bliss, supreme bliss. That knowing is what you are. Be at ease.
commentary: 'This verse cuts to the heart of Advaita''s central insight: the world you perceive is not
  what it seems. Just as a rope in dim light can be mistaken for a snake, the undifferentiated Self (ātman)
  appears as a multiplicity of forms—the universe—when obscured by ignorance (avidyā). The word *kalpitaṃ*
  (constructed, imagined) is key: the cosmos is not denied or destroyed, but recognized as a superimposition,
  a mental construct overlaid on the non-dual reality.


  The verse then pivots to the witness of this recognition. *Bodhas* (knowing, consciousness) is not the
  mind''s knowledge of objects, but the luminous awareness in which all appearance—rope and snake alike,
  universe and ego—is seen through. This knowing is *you*: the sākṣin (witness) that stands untouched
  by what it observes. The progression from *ānanda* (bliss) to *paramānandaḥ* (supreme bliss) suggests
  that when the illusion dissolves in clear seeing, what remains is not a new state to achieve, but the
  ever-present peace of the Self, freed from the burden of imagined doership and bondage.


  The final phrase *sukhaṃ bhava* (be at ease, abide in ease) is not an exhortation to become something
  other, but an invitation to recognize what you already are—the unchanging consciousness in which all
  appearance, including the sense of being a separate doer, is merely seen.


  Key Terms


  **rajju-sarpa** — rope-snake; the classic Advaita metaphor for how one thing (the non-dual Self) appears
  as another (the universe) due to ignorance

  **sākṣin** — witness; the unchanging consciousness that observes all appearance without being affected
  by it

  **kalpita** — constructed, imagined, superimposed; indicating that the world is not illusory in the
  sense of being unreal, but real only as appearance, like the snake in the rope'
insight: 'Extended Translation:

  Where this universe appears like an imagined rope-snake — there lies bliss, supreme bliss.'
practice: 'In the next moment you mistake something—mishear a word, misread a sign, see a shadow as a
  shape—pause and let your gaze rest on the actual thing. Notice how the false image dissolves the instant
  you see clearly, yet both the illusion and the seeing happen in the same awareness. Whisper: ''That
  knowing is what I am.'''
