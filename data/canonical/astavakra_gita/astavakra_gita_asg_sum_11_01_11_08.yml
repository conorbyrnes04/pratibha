- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 2.39
    resonance: 'Both texts establish that certainty about the nature of existence (Astavakra: changes
      are simply nature; Patañjali: non-greed is established) produces liberation from the mechanism that
      generates suffering and bondage. The move is: cognitive/volitional settlement → automatic cessation
      of the generative force.'
    divergence: Astavakra locates the pivot in recognizing the unchanging witness amid change; Patañjali
      locates it in the ethical discipline of non-attachment, which then illuminates karmic causation.
    passage_id: patañjali_yoga_sūtras.ys_2_39
  - citation: Pratyabhijnahrdayam — Sutra 16
    resonance: 'Both texts describe a state where recognition of one''s true identity (Astavakra: certainty
      that suffering arises only through thought, freeing one from it; Pratyabhijnahrdayam: stable recognition
      of identity with Consciousness) persists even as the phenomenal world continues uninterrupted. The
      move is: identity-shift that leaves the world unchanged but dissolves suffering.'
    divergence: Astavakra emphasizes the negation of mental construction as the mechanism; Pratyabhijnahrdayam
      emphasizes positive recognition of authorship and Consciousness as the mechanism.
    passage_id: pratyabhijnahrdayam.phr_016
  - citation: The Book of Chuang Tzu — The Shadow Cannot Be Outrun
    resonance: Both texts diagnose suffering as arising from a false cognitive posture—Astavakra identifies
      it as the certainty that things *must* be otherwise, Chuang Tzu identifies it as the futile attempt
      to escape what cannot be escaped. Both show suffering as self-generated through resistance to what
      is.
    divergence: Astavakra prescribes cognitive reversal (certainty that things are as they are); Chuang
      Tzu prescribes cessation of the futile gesture itself, pointing to a non-volitional alignment.
    passage_id: the_book_of_chuang_tzu.zhuangzi_md_031
