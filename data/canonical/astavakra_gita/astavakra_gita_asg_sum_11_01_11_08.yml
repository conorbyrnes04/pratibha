commentary: '11.1: One certain that the changes of existence are simply the nature of things — remains unchanging, free from
  suffering


  11.5 — The Suffering Diagnosis


  Devanāgarī

  चिन्तया जायते दुःखं नान्यथेहेति निश्चयी ।

  तया हीनः सुखी शान्तः सर्वत्र गलितस्पृहः ॥


  IAST

  cintayā jāyate duḥkhaṃ nānyatheheti niścayī |

  tayā hīnaḥ sukhī śāntaḥ sarvatra galitaspṛhaḥ ||


  Pratibhā Translation

  One certain that suffering arises from worry and from nothing else — becomes free from worry, and thus remains happy, peaceful,
  and free from desires everywhere.


  Pratibhā Commentary

  Cintā — worry, anxious thought, rumination — is named as the sole generator of suffering. Not circumstances, not other people,
  not fate, not karma in the conventional sense. Worry. This is not a claim that nothing difficult happens, but that the suffering
  arising from difficult things is generated by the mind''s worried relationship to them, not by the things themselves. Nānyathā
  — no other way — is absolute. The one who is certain of this is not suppressing worry but has genuinely seen its mechanism
  and therefore has no compulsion to engage it. Galitaspṛhā — desires have dissolved (galita, "melted away") — is the fruit:
  not forced renunciation but natural dissolution of the grasping that generated the worry.


  11.6 — Body and Bondage


  nāhaṃ deho na me deho bodho''hamiti niścayī

  "One certain that ''I am not the body, the body is not mine, I am pure consciousness'' — lives as if they have attained
  liberation"


  11.7 — Universal Self


  ābrahmastambaparyantam ahameveti niścayī

  "One certain that ''I am everything, from Brahma to the smallest blade of grass'' — remains undifferentiated, pure, peaceful"


  Key Terms (Chapter 11)

  niścayī — one who is certain; not one who hopes or believes but one who knows with certainty

  cintā — worry, anxious thought; from cint (to think with agitation); the generating mechanism of suffering

  galitaspṛhā — one whose desires have melted; galita (melted, dissolved naturally) — not forcibly removed but naturally released


  Cross-Tradition Resonance

  Marcus Aurelius, Meditations IV.3: "You have power over your mind, not outside events. Realize this and you will find strength."
  — a Stoic parallel to 11.5, but Aṣṭāvakra goes further: even the one who is certain of this is liberated, not merely strengthened

  Epictetus on prohairesis: the sustained parallel across the Stoic-Advaita axis culminates here; both traditions locate suffering
  in the mind''s relationship to events, not the events themselves

  Vijñāna Bhairava Tantra 78: the practice of santośa (contentment) as direct entry into the ground — the fruit described
  in 11.5


  Practice (Abhyāsa)

  Take a current worry. Not to dismiss it but to locate it precisely: is it the situation that is causing suffering, or is
  it the worry about the situation? Notice the distinction. The situation may be real and may require action. The worry is
  a separate event. Can you address the situation without adding the layer of worry? This is 11.5 as a practical experiment.'
