title: Infinity Dissolves All Renunciation
unit_type: sutra
sanskrit_devanagari: 'आकाशवदनन्तोऽहं घटवत् प्राकृतं जगत् ।


  इति ज्ञानं तथैतस्य न त्यागो न ग्रहो लयः ॥'
sanskrit_iast: 'ākāśavadananto''haṃ ghaṭavat prākṛtaṃ jagat |


  iti jñānaṃ tathaitasya na tyāgo na graho layaḥ ||'
translation_literal: I am infinite like space; the world is natural like a pot—this knowing is itself. For him there is no
  renunciation, no grasping, no dissolution.
commentary: 'This verse cuts to the heart of Advaita''s radical freedom. The self-knowledge (jñānam) being pointed to is not
  intellectual belief but direct recognition: ''I am boundless like ākāśa''—not contained, not limited by form. The world
  (jagat) is then seen as prākṛta, natural, spontaneous—like a pot that arises in clay without the clay becoming ''the potter''
  or ''renouncing'' its nature.


  The second line dissolves the very framework of spiritual practice. Once this recognition lands, there is no tyāga (renunciation
  of the world), no graha (grasping toward liberation), no laya (dissolution into some higher state). These are all movements
  of the ego trying to escape or improve itself. But the witness-Self (sākṣin) was never bound, never doing, never becoming.
  It simply is—untouched by the world''s arising and dissolving, as space is untouched by the pots that form and break within
  it.


  This is not nihilism or passivity. It is the end of the seeker''s project itself. When the infinite nature of consciousness
  is recognized, the very categories of bondage and liberation, action and inaction, collapse. What remains is simple, ordinary
  presence—free not because it escaped something, but because it never was what it imagined itself to be.


  Key Terms


  **ākāśa** — Space or ether; used here as a metaphor for infinite, unbound consciousness that contains all forms yet remains
  unchanged

  **prākṛta** — Natural, spontaneous, arising from prakṛti (nature); what unfolds without effort or doership

  **sākṣin** — The witness-Self; consciousness that observes all experience without being modified by it'
insight: 'Extended Translation:

  I am infinite like space; the material world is like a pot in space.'
practice: 'Hold your gaze on any object—a cup, a wall, a face—and let it remain there without naming or claiming it. Notice:
  the space around it does not become the object, the object does not touch the space. Rest as that untouched space for as
  long as the gaze holds.'
