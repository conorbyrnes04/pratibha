translation_literal: I am infinite like space; the material world is like a pot in space.
commentary: 'Extended Translation:

  I am infinite like space; the material world is like a pot in space. Knowing this, there is no renunciation, no acceptance,
  no dissolution.


  ākāśavad ananto''haṃ ghaṭavat prākṛtaṃ jagat | iti jñānaṃ tathaitasya na tyāgo na graho layaḥ ||

  "I am infinite like space; the material world is like a pot in space. Knowing this, there is no renunciation, no acceptance,
  no dissolution."'
insight: 'Extended Translation:

  I am infinite like space; the material world is like a pot in space.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
