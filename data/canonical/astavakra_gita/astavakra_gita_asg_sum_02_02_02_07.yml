- kind: commentary
  label: Pratibha Commentary
  body: 'Chapters 2.2–2.7 develop the ocean-wave metaphor through a series of parallel declarations, each arriving at the
    same recognition from a slightly different angle. Janaka speaks in a sustained first-person voice of recognition, using
    the great analogies:


    2.2: Just as I illuminate this body, I illuminate the entire world — the Self as universal light

    2.3: Having set aside body and world, I now perceive the supreme Self — the shift of identification

    2.4: Just as waves, foam, and bubbles are not separate from water, so the world is not separate from the Self — the non-separation
    of world and ground

    2.5: Just as cloth is nothing but threads upon reflection, so the world is nothing but the Self — the substance-attribute
    relationship reversed

    2.6: Just as sugar is pervaded throughout by the cane-juice, so I pervade the world uninterruptedly — the Self as substrate
    of all'
- kind: key_terms
  label: Key Terms
  items:
  - term: prakāśa (प्रकाश)
    definition: '√kāś ‘shine’ → Self as the one light illuminating body and world → trap: physical light metaphor only'
    lemma_id: prakasa
    sense_id: prakasa.shaiva
  - term: paramātman (परमात्मन्)
    definition: 'supreme Self seen after body-world are set aside → trap: a distant deity-self'
    lemma_id: atman
    sense_id: atman.upanishadic
  - term: taraṅga / phenā (तरङ्ग / फेना)
    definition: 'wave / foam → world as water’s own display, not other-than-Self → trap: world-denial; difference is modal,
      not ontological'
    lemma_id: maya
    sense_id: maya.advaita
