source_excerpt: Chapters 2.2–2.7 develop the ocean-wave metaphor through a series of parallel declarations,
  each arriving at the same recognition from a slightly different angle.
translation_literal: 'Just as I alone illuminate this body, so too the world. / Therefore, the entire
  world is mine—or perhaps nothing at all.


  I have now abandoned this body, this vast universe. / Yet from some hidden skill, the supreme Self is
  still perceived.


  As waves, foam, and bubbles are not separate from water, / so the universe born from the Self is not
  separate from the Self.


  When examined, a cloth is nothing but thread; / examined the same way, this universe is nothing but
  the Self.


  As molasses is pervaded by sugar throughout, / so the universe is fashioned in me and pervaded by me
  without cease.


  From ignorance of the Self, the world shines forth. / From knowledge of the Self, it does not shine.
  / From ignorance of the rope, a snake appears to shine. / From knowledge of the rope, it shines no longer.'
commentary: 'This sequence moves from the paradox of ownership to the dissolution of separation. The opening
  verse establishes the radical non-dual position: the world appears only as a function of consciousness—my
  consciousness. The ''or perhaps nothing at all'' is not skepticism but precision: if the world is truly
  my manifestation, then it has no independent reality. The second verse deepens this by noting that even
  after ''abandoning'' the body-universe (through recognition), the Supreme Self is perceived—not as an
  achievement, but as an ever-present fact glimpsed through some ''hidden skill'' (kauśala), meaning sudden
  grace or the collapse of the false boundary.


  The wave-water analogy is classical Advaita, but here it serves a specific function: it dissolves the
  appearance of multiplicity without denying the appearance itself. The universe is real as manifestation,
  unreal as separate entity. The thread-cloth comparison extends this: just as cloth has no existence
  apart from thread, the universe has no existence apart from the Self. This is not metaphorical but ontological.


  The molasses-sugar verse (often overlooked) is crucial: it suggests not just non-separation but active,
  continuous pervading. The universe does not merely appear *in* the Self; it is saturated *by* the Self
  at every point. This addresses the question: if all is the Self, why does the world seem so solid, so
  other?


  The final verse—the rope-snake—is the teaching''s pivot. The snake is not a defect in the rope; it is
  the rope appearing as snake through ignorance. Knowledge does not destroy the rope; it reveals what
  was always true. Similarly, knowledge of the Self does not destroy the world; it reveals the world''s
  true nature as the Self''s own radiance. The world does not ''cease to exist'' but ceases to *shine*
  as an independent reality. This is the non-dual resolution: not annihilation, but recognition.


  Key Terms


  **ātman** — The Self; the non-dual consciousness that is the sole reality, the witness of all appearance.

  **viśva** — The universe; the totality of manifestation, which is non-separate from the Self.

  **ātmājñāna** — Knowledge of the Self; direct recognition that dissolves the appearance of multiplicity
  and bondage.'
