translation_literal: 'Just as I alone illuminate this body, so too the world. / Therefore, the entire world is mine—or perhaps
  nothing at all.


  I have now abandoned this body, this vast universe. / Yet from some hidden skill, the supreme Self is still perceived.


  As waves, foam, and bubbles are not separate from water, / so the universe born from the Self is not separate from the Self.


  When examined, a cloth is nothing but thread; / examined the same way, this universe is nothing but the Self.


  As molasses is pervaded by sugar throughout, / so the universe is fashioned in me and pervaded by me without cease.


  From ignorance of the Self, the world shines forth. / From knowledge of the Self, it does not shine. / From ignorance of
  the rope, a snake appears to shine. / From knowledge of the rope, it shines no longer.'
commentary: 'This sequence moves from the paradox of ownership to the dissolution of separation. The opening verse establishes
  the radical non-dual position: the world appears only as a function of consciousness—my consciousness. The ''or perhaps
  nothing at all'' is not skepticism but precision: if the world is truly my manifestation, then it has no independent reality.
  The second verse deepens this by noting that even after ''abandoning'' the body-universe (through recognition), the Supreme
  Self is perceived—not as an achievement, but as an ever-present fact glimpsed through some ''hidden skill'' (kauśala), meaning
  sudden grace or the collapse of the false boundary.


  The wave-water analogy is classical Advaita, but here it serves a specific function: it dissolves the appearance of multiplicity
  without denying the appearance itself. The universe is real as manifestation, unreal as separate entity. The thread-cloth
  comparison extends this: just as cloth has no existence apart from thread, the universe has no existence apart from the
  Self. This is not metaphorical but ontological.


  The molasses-sugar verse (often overlooked) is crucial: it suggests not just non-separation but active, continuous pervading.
  The universe does not merely appear *in* the Self; it is saturated *by* the Self at every point. This addresses the question:
  if all is the Self, why does the world seem so solid, so other?


  The final verse—the rope-snake—is the teaching''s pivot. The snake is not a defect in the rope; it is the rope appearing
  as snake through ignorance. Knowledge does not destroy the rope; it reveals what was always true. Similarly, knowledge of
  the Self does not destroy the world; it reveals the world''s true nature as the Self''s own radiance. The world does not
  ''cease to exist'' but ceases to *shine* as an independent reality. This is the non-dual resolution: not annihilation, but
  recognition.


  Key Terms


  **ātman** — The Self; the non-dual consciousness that is the sole reality, the witness of all appearance.

  **viśva** — The universe; the totality of manifestation, which is non-separate from the Self.

  **ātmājñāna** — Knowledge of the Self; direct recognition that dissolves the appearance of multiplicity and bondage.'
insight: ''
practice: '**The Rope-Snake Reversal (15 minutes, daily):** Sit quietly and bring to mind something you fear, desire, or feel
  bound by—a person, a situation, a thought pattern. Hold it clearly in awareness. Then ask: ''What is the substance here?
  What is aware of this?'' Notice that the feared or desired object appears *within* awareness, not outside it. Just as the
  snake appears within the rope''s form, this object appears within the field of your knowing. Now deliberately shift your
  attention from the object to the aware-ness itself—the background in which the object moves. Rest there for several breaths.
  The object does not disappear, but its grip loosens; it is revealed as a shape taken by your own consciousness, not an independent
  threat or prize. Repeat this reversal whenever you notice yourself caught in reactivity. Over time, this simple shift—from
  object to the aware-ness of the object—begins to dissolve the illusion of separation that sustains all bondage.'
sanskrit_devanagari: 'यथा प्रकाशयाम्येको देहमेनं तथा जगत् ।


  अतो मम जगत्सर्वमथवा न च किञ्चन ॥


  स शरीरमहो विश्वं परित्यज्य मयाधुना ।


  कुतश्चित् कौशलाद् एव परमात्मा विलोक्यते ॥


  यथा न तोयतो भिन्नास्तरङ्गाः फेनबुद्बुदाः ।


  आत्मनो न तथा भिन्नं विश्वमात्मविनिर्गतम् ॥


  तन्तुमात्रो भवेद् एव पटो यद्वद् विचारितः ।


  आत्मतन्मात्रमेवेदं तद्वद् विश्वं विचारितम् ॥


  यथैवेक्षुरसे क्लृप्ता तेन व्याप्तैव शर्करा ।


  तथा विश्वं मयि क्लृप्तं मया व्याप्तं निरन्तरम् ॥


  आत्माज्ञानाज्जगद्भाति आत्मज्ञानान्न भासते ।


  रज्ज्वज्ञानादहिर्भाति तज्ज्ञानाद् भासते न हि ॥'
sanskrit_iast: 'yathā prakāśayāmyeko dehamenaṃ tathā jagat |


  ato mama jagatsarvamathavā na ca kiñcana ||


  sa śarīramaho viśvaṃ parityajya mayādhunā |


  kutaścit kauśalād eva paramātmā vilokyate ||


  yathā na toyato bhinnāstaraṅgāḥ phenabudbudāḥ |


  ātmano na tathā bhinnaṃ viśvamātmavinirgatam ||


  tantumātro bhaved eva paṭo yadvad vicāritaḥ |


  ātmatanmātramevedaṃ tadvad viśvaṃ vicāritam ||


  yathaivekṣurase klṛptā tena vyāptaiva śarkarā |


  tathā viśvaṃ mayi klṛptaṃ mayā vyāptaṃ nirantaram ||


  ātmājñānājjagadbhāti ātmajñānānna bhāsate |


  rajjvajñānādahirbhāti tajjñānād bhāsate na hi ||'
