practice: '**The Rope-Snake Reversal (15 minutes, daily):** Sit quietly and bring to mind something you
  fear, desire, or feel bound by—a person, a situation, a thought pattern. Hold it clearly in awareness.
  Then ask: ''What is the substance here? What is aware of this?'' Notice that the feared or desired object
  appears *within* awareness, not outside it. Just as the snake appears within the rope''s form, this
  object appears within the field of your knowing. Now deliberately shift your attention from the object
  to the aware-ness itself—the background in which the object moves. Rest there for several breaths. The
  object does not disappear, but its grip loosens; it is revealed as a shape taken by your own consciousness,
  not an independent threat or prize. Repeat this reversal whenever you notice yourself caught in reactivity.
  Over time, this simple shift—from object to the aware-ness of the object—begins to dissolve the illusion
  of separation that sustains all bondage.'
sanskrit_devanagari: 'यथा प्रकाशयाम्येको देहमेनं तथा जगत् ।


  अतो मम जगत्सर्वमथवा न च किञ्चन ॥


  स शरीरमहो विश्वं परित्यज्य मयाधुना ।


  कुतश्चित् कौशलाद् एव परमात्मा विलोक्यते ॥


  यथा न तोयतो भिन्नास्तरङ्गाः फेनबुद्बुदाः ।


  आत्मनो न तथा भिन्नं विश्वमात्मविनिर्गतम् ॥


  तन्तुमात्रो भवेद् एव पटो यद्वद् विचारितः ।


  आत्मतन्मात्रमेवेदं तद्वद् विश्वं विचारितम् ॥


  यथैवेक्षुरसे क्लृप्ता तेन व्याप्तैव शर्करा ।


  तथा विश्वं मयि क्लृप्तं मया व्याप्तं निरन्तरम् ॥


  आत्माज्ञानाज्जगद्भाति आत्मज्ञानान्न भासते ।


  रज्ज्वज्ञानादहिर्भाति तज्ज्ञानाद् भासते न हि ॥'
sanskrit_iast: 'yathā prakāśayāmyeko dehamenaṃ tathā jagat |


  ato mama jagatsarvamathavā na ca kiñcana ||


  sa śarīramaho viśvaṃ parityajya mayādhunā |


  kutaścit kauśalād eva paramātmā vilokyate ||


  yathā na toyato bhinnāstaraṅgāḥ phenabudbudāḥ |


  ātmano na tathā bhinnaṃ viśvamātmavinirgatam ||


  tantumātro bhaved eva paṭo yadvad vicāritaḥ |


  ātmatanmātramevedaṃ tadvad viśvaṃ vicāritam ||


  yathaivekṣurase klṛptā tena vyāptaiva śarkarā |


  tathā viśvaṃ mayi klṛptaṃ mayā vyāptaṃ nirantaram ||


  ātmājñānājjagadbhāti ātmajñānānna bhāsate |


  rajjvajñānādahirbhāti tajjñānād bhāsate na hi ||'
