sanskrit_devanagari: 'न कर्ता न भोक्ता न बन्धो न मोक्षः ।

  साक्षी निरञ्जनः शान्तः केवलो ऽहम् इति श्रुतिः ॥ १८.१३ ॥'
sanskrit_iast: 'na kartā na bhoktā na bandho na mokṣaḥ |

  sākṣī nirañjanaḥ śāntaḥ kevalo ''ham iti śrutiḥ || 18.13 ||'
translation_literal: 'Not doer, not enjoyer, not bondage, not liberation—witness, untouched, at peace, alone: thus the Upaniṣad
  declares ''I am.'' (kartā: agent; bhoktā: experiencer; bandho: binding; mokṣaḥ: release; sākṣī: witness; nirañjanaḥ: untainted;
  śāntaḥ: tranquil; kevalaḥ: sole, non-dual)'
commentary: 'This verse crystallizes the radical non-dual vision: the Self is not implicated in the machinery of action, experience,
  or even the dualistic framework of bondage-and-liberation. The traditional seeker imagines a bound self that must be freed;
  Aṣṭāvakra dissolves that fiction. The witness (sākṣī)—pure consciousness—stands eternally apart from the three guṇas and
  their modifications. Nirañjana (untouched, stainless) echoes Upaniṣadic language; śānta (peaceful, quiescent) signals the
  absence of seeking. Kevala (alone, singular) negates multiplicity. The phrase ''iti śrutiḥ'' (thus the Upaniṣad declares)
  anchors this in Vedantic authority, yet the teaching is immediate recognition, not doctrine. The verse dissolves both bondage-narratives
  and liberation-narratives into the seamless presence of what already is.


  Key Terms


  **sākṣī** — witness-consciousness, the non-participating observer of all mental and physical phenomena

  **nirañjanaḥ** — untainted, unstained by the qualities (guṇas) and their transformations

  **kevalaḥ** — alone, non-dual, without second—the singular reality undivided by subject-object duality

  **kartā na** — negation of agency: the Self performs no action and bears no responsibility


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.31–32 (Kṛṣṇa on the unchanging witness):** Both texts establish the ātman as an immobile sākṣī observing
  the flux of prakṛti without participation or taint. Divergence: The Gītā preserves a framework of dharmic action and devotion;
  Aṣṭāvakra dissolves even the seeker''s aspiration for mokṣa as illusory.

  **Advaita Vedānta, Śaṅkara''s Brahma Sūtra Bhāṣya 1.1.4 (nirguṇa brahman):** Both deny qualities and modifications to the
  ultimate Self, positioning it as eternally free and untouched by bondage. Divergence: Śaṅkara retains a two-level epistemology
  (paramārthika and vyāvahārika); Aṣṭāvakra collapses even that distinction in immediate non-dual recognition.

  **Upaniṣad, Kaṭha Upaniṣad 1.3.12 (ātmā na jayate na mriyate):** Both invoke Upaniṣadic authority to declare the Self beyond
  birth, death, and the dualistic categories of bondage and release. Divergence: The Kaṭha frames liberation as a goal to
  be attained through discipline; Aṣṭāvakra insists it is already the case and seeking itself is the error.'
practice: 'Sit quietly. Notice the flow of thoughts, sensations, emotions. Ask: ''Who observes this?'' Do not answer conceptually.
  Rest as the simple, untouched awareness that is aware of all change without being changed. Return to this recognition whenever
  the mind claims doership or seeks liberation. This is not an achievement—it is the recognition of what you already are.'
