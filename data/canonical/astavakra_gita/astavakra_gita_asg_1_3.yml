- kind: translation
  label: Pratibha Translation
  body: You are not earth, nor water, nor fire, nor air, nor space.
- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    You are not earth, nor water, nor fire, nor air, nor space. Know the Self as the witness of all these — of the nature
    of pure consciousness — and be liberated.


    The classical five-element negation (*neti neti* in compressed form), but Aṣṭāvakra moves immediately to the positive
    identification: *cid-rūpa*, of the nature of consciousness. This is the Pratyabhijñā move as well — negation alone is
    insufficient, even dangerous, if it produces only a sense of void. The teaching is: you are not any of these objects,
    but you are the *sākṣin* — the witness — in whom all these objects arise. And that witness is not a neutral blank screen:
    it is *cid-rūpam*, the very nature of knowing, of luminous awareness. Liberation (*muktaye*) is placed at the end of the
    verse as the fruit of this recognition — not a future event but the immediate consequence of *viddhi*, of *knowing* this
    directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: pañca mahābhūta
    definition: 'the five great elements: earth (*pṛthvī*), water (*jala*), fire (*agni*), air (*vāyu*), space (*dyau/ākāśa*)'
  - term: sākṣin
    definition: the witness; from *sākṣāt* (directly, in front of); the pure awareness that sees without being seen, knows
      without being known
  - term: cid-rūpa
    definition: of the nature of consciousness; *cit* (pure awareness) + *rūpa* (form, nature); awareness as the essential
      nature of the Self
  - term: viddhi
    definition: know! (imperative); direct, immediate knowing, not intellectual understanding
