title: The Self Transcends The Five Elements
unit_type: sutra
sanskrit_devanagari: 'न पृथ्वी न जलं नाग्निर्न वायुर्द्यौर्न वा भवान् ।

  एषां साक्षिणमात्मानं चिद्रूपं विद्धि मुक्तये ॥'
sanskrit_iast: 'na pṛthvī na jalaṃ nāgnir na vāyur dyaur na vā bhavān |

  eṣāṃ sākṣiṇam ātmānaṃ cid-rūpaṃ viddhi muktaye ||'
translation_literal: You are neither earth, nor water, nor fire, nor air, nor sky. Know yourself as the
  witness of these five—the Self, luminous consciousness itself—and be free.
commentary: 'This verse cuts through the fundamental error of self-identification with the body and its
  elemental composition. The five elements (pañcabhūta)—earth, water, fire, air, and space—constitute
  the gross physical form and the subtle body through which experience appears to flow. Yet the teaching
  here is unambiguous: you are not these.


  The word sākṣiṇam (witness) is central. The Self does not become the elements; it remains eternally
  apart, observing their play without involvement or transformation. This is the sākṣin—the unchanging
  awareness in which all elemental processes, sensations, and bodily functions are known. It is not a
  witness that judges or evaluates; it is the simple, luminous presence in which all experience occurs.


  Cid-rūpaṃ—"of the nature of consciousness"—clarifies that this witnessing Self is not inert or blank.
  It is sentience itself, the very light by which anything is known. This consciousness does not depend
  on the elements; rather, the elements depend on it for their very appearance.


  The phrase viddhi muktaye (know this for liberation) is not an exhortation to acquire something new.
  Liberation is the direct recognition of what you already are. The moment the false identification with
  the five elements falls away—not through effort but through clear seeing—bondage dissolves. You do not
  become free; you recognize that freedom is your ever-present nature.


  Key Terms


  **sākṣin** — The witness; the unchanging consciousness that observes all experience without being affected
  by it

  **pañcabhūta** — The five elements (earth, water, fire, air, space) that compose the gross and subtle
  bodies

  **cid-rūpa** — Of the nature of consciousness; sentient, luminous awareness itself'
insight: 'Extended Translation:

  You are not earth, nor water, nor fire, nor air, nor space.'
practice: 'When you next feel a strong physical sensation—pain, cold, heat, hunger, fatigue—pause and
  hold your attention on the sensation itself without naming it or moving away. Notice: the sensation
  is known, felt, present to you. Now notice the knowing itself—the luminous awareness in which this sensation
  appears, unchanged by it. Rest as that witnessing presence for three breaths, then resume your day.'
