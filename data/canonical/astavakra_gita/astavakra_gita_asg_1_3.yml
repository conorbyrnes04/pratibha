- kind: key_terms
  label: Key Terms
  items:
  - term: pañca mahābhūta
    definition: 'the five great elements: earth (*pṛthvī*), water (*jala*), fire (*agni*), air (*vāyu*), space (*dyau/ākāśa*)'
  - term: sākṣin
    definition: the witness; from *sākṣāt* (directly, in front of); the pure awareness that sees without being seen, knows
      without being known
  - term: cid-rūpa
    definition: of the nature of consciousness; *cit* (pure awareness) + *rūpa* (form, nature); awareness as the essential
      nature of the Self
  - term: viddhi
    definition: know! (imperative); direct, immediate knowing, not intellectual understanding
