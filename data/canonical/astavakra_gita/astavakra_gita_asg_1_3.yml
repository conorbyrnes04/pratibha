- kind: practice
  label: Practice (Abhyasa)
  body: 'Become aware of sound. Now notice: you are not the sound. Become aware of a sensation in the body. Notice: you are
    not the sensation. Become aware of a thought. Notice: you are not the thought. What remains when all objects are excluded?
    That remainder — the simple fact of being aware — is *cid-rūpa*. Rest there for two minutes.'
