- kind: iast
  label: IAST
  body: 'muktim icchasi cet tāta viṣayān viṣavat tyaja |

    kṣamā-ārjava-dayā-toṣa-satyaṃ pīyūṣavad bhaja ||'
- kind: translation
  label: Pratibha Translation
  body: If you desire liberation, O child, abandon sense objects like poison and cultivate forgiveness, sincerity, compassion,
    contentment, and truth as if they were nectar.
- kind: commentary
  label: Pratibha Commentary
  body: 'The text''s only concession to graduated practice — and even here, the framing is radical. Aṣṭāvakra does not say
    "reduce attachment" or "practice moderation." He says *viṣavat* — like poison. The absoluteness is deliberate: from the
    perspective of the already-free Self, engagement driven by craving is indeed toxic to the recognition of one''s nature.
    The five qualities prescribed (*kṣamā*, *ārjava*, *dayā*, *toṣa*, *satya*) are not moral virtues in a conventional sense
    — they are the natural expressions of a mind whose grasping has loosened. Forgiveness flows from one who is not injured
    at the level of Self. Contentment flows from one who lacks nothing. These are not causes of liberation but its early symptoms.'
- kind: key_terms
  label: Key Terms
  items:
  - term: viṣaya
    definition: sense objects, objects of desire; from *viṣ* (to pervade); that which pervades and conditions the mind
  - term: viṣavat
    definition: like poison; the comparison is not moralizing but ontological — what distracts from recognition is structurally
      harmful
  - term: kṣamā
    definition: forgiveness, patience; the capacity to not be wounded at the level of ego
  - term: ārjava
    definition: sincerity, straightforwardness; *ṛju* meaning straight; the absence of self-deception
  - term: dayā
    definition: compassion; from *day* (to sympathize); the natural responsiveness of an open heart
  - term: toṣa
    definition: contentment, satisfaction; the absence of structural lack
  - term: satya
    definition: truth; alignment between inner knowing and outer expression
- kind: resonances
  label: Cross-Tradition Resonances
  items:
