- kind: key_terms
  label: Key Terms
  items:
  - term: viṣaya
    definition: sense objects, objects of desire; from *viṣ* (to pervade); that which pervades and conditions
      the mind
  - term: viṣavat
    definition: like poison; the comparison is not moralizing but ontological — what distracts from recognition
      is structurally harmful
  - term: kṣamā
    definition: forgiveness, patience; the capacity to not be wounded at the level of ego
  - term: ārjava
    definition: sincerity, straightforwardness; *ṛju* meaning straight; the absence of self-deception
  - term: dayā
    definition: compassion; from *day* (to sympathize); the natural responsiveness of an open heart
  - term: toṣa
    definition: contentment, satisfaction; the absence of structural lack
  - term: satya
    definition: truth; alignment between inner knowing and outer expression
