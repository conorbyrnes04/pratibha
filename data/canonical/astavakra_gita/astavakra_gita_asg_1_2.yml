- kind: practice
  label: Practice (Abhyasa)
  body: 'Choose one of the five qualities — whichever feels most absent today. Not as a moral discipline but as an experiment:
    what happens when forgiveness (or sincerity, or contentment) is simply allowed rather than performed? Notice whether it
    has a texture of openness or contraction.'
