title: 'Poison and Nectar: The Radical Abandonment'
unit_type: sutra
sanskrit_devanagari: 'मुक्तिमिच्छसि चेत्तात विषयान् विषवत्त्यज ।

  क्षमार्जवदयातोषसत्यं पीयूषवद् भज ॥'
sanskrit_iast: 'muktim icchasi cet tāta viṣayān viṣavat tyaja |

  kṣamā-ārjava-dayā-toṣa-satyaṃ pīyūṣavad bhaja ||'
translation_literal: If you truly desire liberation, dear one, abandon the objects of sense as you would
  poison. Cultivate patience, straightforwardness, compassion, contentment, and truth as you would nectar.
commentary: 'This verse presents the classical Advaita move: a radical inversion of ordinary valuation.
  The world of sense-objects (viṣayān)—what the mind habitually grasps as desirable—is reframed as poison
  (viṣavat). Not because the world is inherently evil, but because attachment to it perpetuates the illusion
  of the separate doer-self, the one who seeks, acquires, and suffers loss. The poison is not in the object
  but in the identification with the one who wants it.


  The second half does not ask for ascetic rejection of virtue, but for a complete reversal of appetite.
  The five qualities—patience (kṣamā), integrity or guilelessness (ārjava), compassion (dayā), contentment
  (toṣa), and truth (satya)—are called nectar (pīyūṣavat). Why? Because they dissolve the contraction
  of the ego-sense. They are not moral achievements to be proud of; they are the natural overflow of one
  who no longer identifies as the doer. Patience arises when there is no one resisting. Straightforwardness
  flows when there is no one protecting a separate image. Compassion emerges when the boundary between
  self and other has been seen through. Contentment settles when there is no one demanding more. Truth
  speaks when there is no one hiding.


  The verse does not say ''become virtuous to earn liberation.'' It says: if you want to see what you
  already are—the untouched witness (sākṣin) of all arising and passing—then stop feeding the poison of
  grasping, and let these qualities drink you. They are the medicine that dissolves the false self, not
  achievements of the false self.


  Key Terms


  **viṣayān** — Objects of sense-experience; the field of desire and attachment that binds the sense of
  separate selfhood

  **sākṣin** — The witness-consciousness; the ever-present, untouched awareness that observes all mental
  and sensory events without identification

  **muktim** — Liberation; the direct recognition of one''s nature as the free, non-dual Self, beyond
  all bondage and doership'
insight: The text's only concession to graduated practice — and even here, the framing is radical.
practice: 'Each time you taste, touch, or consume something you desire today—food, a sensation, a sight—hold
  it in full awareness for three breaths without swallowing or turning away, then silently name it: ''Poison
  that promises, nectar that frees'' and notice which quality (patience, compassion, truth, straightforwardness,
  contentment) arises as you release your grip on it.'
