title: Beyond Caste, Beyond Sensory Form
unit_type: sutra
sanskrit_devanagari: 'न त्वं विप्रादिको वर्णो नाश्रमी नाक्षगोचरः ।

  असङ्गोऽसि निराकारो विश्वसाक्षी सुखी भव ॥'
sanskrit_iast: 'na tvaṃ viprādiko varṇo nāśramī nākṣagocaraḥ |

  asaṅgo''si nirākāro viśvasākṣī sukhī bhava ||'
translation_literal: You are not a Brahmin or any caste, not bound by life-stage or social order, not
  an object of the senses. You are unattached, formless, the witness of all—be happy.
commentary: 'This verse cuts through every identity that the mind clings to. Aṣṭāvakra begins by naming
  what you are *not*: not the social rank (viprādi—Brahmin and others), not the varṇa system of hereditary
  class, not the āśrama—the four life-stages (student, householder, forest-dweller, renunciate) that structure
  Hindu life. These are all constructs layered onto the body and mind.


  Then he goes deeper: you are not *akṣagocaraḥ*—not within the reach of the senses. The senses grasp
  objects; they cannot grasp the one who witnesses sensing itself. This is the crucial move. The body
  has form, color, texture; the senses have their domains. But you—the *sākṣī*, the witness—stand apart
  from all of it.


  The three positive declarations follow: *asaṅgo* (unattached, without entanglement), *nirākāro* (formless,
  without shape or boundary), and *viśvasākṣī* (the witness of all that appears). These are not achievements
  to reach. They describe what you already are, obscured only by false identification with form, role,
  and sensation.


  The final command—*sukhī bhava*, "be happy"—is not sentimental. It is an invitation to recognize that
  happiness is not something to gain but the natural state when the false knot of "I am the doer, the
  sufferer, the one bound by caste and circumstance" unties itself. The witness-Self needs nothing, lacks
  nothing, and is already at rest.


  Key Terms


  **sākṣī** — witness; the conscious principle that observes all experience without being affected by
  it

  **asaṅga** — unattached, non-clinging; free from entanglement with objects and identities

  **viśvasākṣī** — witness of all; the universal awareness that pervades and observes the entire field
  of experience'
insight: 'Extended Translation:

  You are no caste, no stage of life, nothing perceivable by the senses.'
practice: 'Throughout this day, each time you notice yourself thinking about who you are—your role, your
  status, your appearance, your competence—pause and ask: who is aware that I am thinking this? Hold your
  attention on that witnessing awareness itself, not on the thought or identity, until the sense of being
  the observer (not the observed) becomes tangible.'
