sanskrit_devanagari: 'न त्वं विप्रादिको वर्णो नाश्रमी नाक्षगोचरः ।

  असङ्गोऽसि निराकारो विश्वसाक्षी सुखी भव ॥'
sanskrit_iast: 'na tvaṃ viprādiko varṇo nāśramī nākṣagocaraḥ |

  asaṅgo''si nirākāro viśvasākṣī sukhī bhava ||'
translation_literal: You are no caste, no stage of life, nothing perceivable by the senses.
commentary: 'Extended Translation:

  You are no caste, no stage of life, nothing perceivable by the senses. You are unattached, formless, the witness of the
  universe. Be happy.


  A socially radical verse embedded in a metaphysical one. The *varṇa* system — the hierarchical social classification of
  Brahmin, Kṣatriya, Vaiśya, Śūdra — is explicitly named and negated. You are not your social identity. You are not your stage
  of life (*āśrama*). You are not anything perceivable through the senses (*akṣagocaraḥ* — beyond the reach of the senses).
  Then the positive declarations: *asaṅga* (unattached, uncontaminated by contact), *nirākāra* (formless), *viśvasākṣī* (witness
  of the entire universe). The verse ends with *sukhī bhava* — be happy — an imperative addressed not to the seeker but to
  the one who has recognized what it is. Happiness is not the reward for correct practice. It is the natural state of the
  uncontracted Self.


  Cross-Tradition Resonance:

  - Gospel of Thomas 77: "I am the light that is over all things. I am all" — the same universal witness consciousness named
  from a different tradition

  - Spanda Kārikā I.1: the Self as the vibrating ground of the entire cosmos, neither inside nor outside any category

  - Zhuāngzǐ ch. 2: *qiwulun* (equalizing all things) — all social, conceptual, and perceptual categories are equalized in
  the ground of awareness


  Key Terms


  **varṇa** — Hereditary social class or caste, here denied as the Self’s true identity.

  **āśramī** — One defined by a life-stage order such as student, householder, forest-dweller, or renunciant.

  **akṣagocaraḥ** — Within the range of the senses; the Self is said to be beyond sensory objectification.

  **viśvasākṣī** — The witness of the universe, aware without being entangled in what appears.


  Cross-Tradition Resonances


  **Bhagavad Gītā 5.18.:** The Gītā’s wise person sees Brahmin, cow, elephant, dog, and outcaste with equal vision, paralleling
  the transcendence of status distinctions. Divergence: The Gītā still upholds svadharma and varṇa-linked social duty, whereas
  this verse negates varṇa as any identity of the Self.

  **Sutta Nipāta 1.7, Vasala Sutta.:** The Buddha rejects birth as the basis of nobility or degradation and locates ethical
  worth in conduct rather than caste. Divergence: The Vasala Sutta frames liberation through moral action and non-self, while
  this verse affirms a formless, universal witnessing Self.

  **Epictetus, Enchiridion 1.:** Epictetus distinguishes what is truly one’s own from external conditions such as reputation,
  position, and circumstance, much as the verse detaches identity from social roles. Divergence: Stoicism locates freedom
  in rational agency and disciplined judgment, not in realization of an unattached cosmic witness beyond the senses.'
insight: 'Extended Translation:

  You are no caste, no stage of life, nothing perceivable by the senses.'
practice: 'For one minute, drop every identity label you carry — profession, nationality, spiritual tradition, relational
  role. Not with effort but as an experiment: what remains when none of these labels apply? Note the quality of that remainder.
  Is it smaller without the labels, or larger?'
