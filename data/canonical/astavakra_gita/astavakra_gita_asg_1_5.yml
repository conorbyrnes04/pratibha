- kind: key_terms
  label: Key Terms
  items:
  - term: varṇa
    definition: caste, social class; literally "color" — the text dissolves the entire system with one
      negation
  - term: āśrama
    definition: stage of life (student, householder, forest-dweller, renunciant); social role also negated
  - term: akṣagocaraḥ
    definition: beyond the range of the senses; *akṣa* (eye, sense organ) + *gocara* (within range)
  - term: asaṅga
    definition: unattached, untouched; the Self makes contact with everything without being contaminated
      by anything
  - term: nirākāra
    definition: formless; *nir* (without) + *ākāra* (form); that which cannot be objectified
  - term: viśvasākṣī
    definition: the universal witness; the Self as the witness not just of personal experience but of
      the entire universe
