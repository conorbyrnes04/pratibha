- kind: key_terms
  label: Key Terms
  items:
  - term: nirañjana
    definition: stainless, uncolored; *nir* (without) + *añjana* (collyrium/color); awareness that takes no taint from what
      appears in it
  - term: prakṛteḥ paraḥ
    definition: beyond nature; *prakṛti* (primal nature, the ground of matter and mind) + *para* (beyond, transcendent); the
      Self as what is not constituted by any natural process
  - term: viḍambita
    definition: tricked, deceived, made a fool of; the recognition as including a retrospective humor about the seeking itself
  - term: moha
    definition: delusion, confusion; from *muh* (to be confused); the structural bewilderment of not recognizing one's own
      nature
    lemma_id: moha
    sense_id: moha.shaiva_advaita
