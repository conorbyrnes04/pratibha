sanskrit_devanagari: 'अहो निरञ्जनः शान्तो बोधोऽहं प्रकृतेः परः ।

  एतावन्तमहं कालं मोहेनैव विडम्बितः ॥'
sanskrit_iast: 'aho nirañjanaḥ śānto bodho''haṃ prakṛteḥ paraḥ |

  etāvantam ahaṃ kālaṃ mohenaiva viḍambitaḥ ||'
translation_literal: Oh!
commentary: 'Extended Translation:

  Oh! I am the stainless, peaceful knowing, beyond nature. For such a long time, I was merely deluded!


  The exclamation *aho* — Oh! — is the sound of recognition breaking through. Not the "aha!" of intellectual solution, but
  the "Oh!" of a person who has just found their keys in their own hand after searching the house for an hour. *Viḍambitaḥ*
  — tricked, deceived, made a fool of — captures the retrospective quality of the moment. The recognition retroactively illuminates
  the entire period of seeking: it was all *moha* (delusion), the delusion of not recognizing what was always present. *Etāvantam
  kālam* — for so long — is an expression of both wonder and gentle self-compassion. The first word of Janaka''s recognition
  is not "I know" but "I am": *bodhaḥ aham* — I am consciousness itself.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 13: the mind *itself* becoming Citi through *antarmukhī-bhāva* — Janaka''s *aho* is the sound of this
  turning

  - Zen *kenshō* accounts: the characteristic retrospective laughter — "how could I have not seen this?" — is the same *viḍambita*
  quality

  - Plotinus *Enneads* VI.9.10: the soul''s return to the One described as a shock of recognition — "there was no distance"


  Key Terms


  **nirañjanaḥ** — Stainless or untouched, indicating awareness untainted by the conditions it illumines.

  **śāntaḥ** — Peaceful or quiescent, denoting the intrinsic stillness of the self beyond mental agitation.

  **prakṛteḥ paraḥ** — Beyond prakṛti, meaning transcendent of material nature and its changing guṇas.

  **viḍambitaḥ** — Deceived, mocked, or made a fool of, expressing amazement at identification born of delusion.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 4.3.7, "asaṅgo hy ayaṃ puruṣaḥ":** Like Aṣṭāvakra’s stainless awareness beyond nature, this passage
  describes the inner person as unattached amid the experiences it witnesses. Divergence: The Upaniṣadic context develops
  a fuller doctrine of the self’s states and cosmic identity, while this verse concentrates on the immediate shock of having
  been deluded.

  **Aṅguttara Nikāya 1.49–52, the luminous mind:** The Buddhist teaching that the mind is luminous and obscured by adventitious
  defilements parallels the verse’s recognition that apparent bondage does not stain the knowing itself. Divergence: Early
  Buddhism denies a permanent self or witnessing ātman, whereas Aṣṭāvakra explicitly declares an enduring “I” that is beyond
  prakṛti.

  **Epictetus, Enchiridion 1:** Epictetus’s distinction between what is within one’s control and external events echoes the
  movement from confused entanglement to a calm standpoint not governed by changing conditions. Divergence: Stoicism grounds
  freedom in disciplined judgment and ethical agency, while Aṣṭāvakra locates freedom in realizing a metaphysical awareness
  already prior to nature.'
insight: 'Extended Translation:

  Oh!'
practice: 'Can you recall a moment when you recognized something that was in front of you the whole time? The specific quality
  of that retroactive clarity — the "how did I miss this?" — is structurally similar to *pratyabhijñā*. Sit with that quality
  as a taste of what recognition of the Self might feel like.


  ### 2.2 — 2.7 *(Ocean and Wave series)*'
