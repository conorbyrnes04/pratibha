title: Recognition of What Was Always Present
unit_type: sutra
sanskrit_devanagari: 'अहो निरञ्जनः शान्तो बोधोऽहं प्रकृतेः परः ।

  एतावन्तमहं कालं मोहेनैव विडम्बितः ॥'
sanskrit_iast: 'aho nirañjanaḥ śānto bodho''haṃ prakṛteḥ paraḥ |

  etāvantam ahaṃ kālaṃ mohenaiva viḍambitaḥ ||'
translation_literal: Ah, I am the stainless, the peaceful, consciousness itself—beyond nature. Yet for
  so long I have been deceived by delusion into forgetting this very thing.
commentary: 'This verse marks a turning point in the Aṣṭāvakra Gītā: the recognition of what was never
  actually lost. The speaker awakens to his true nature as nirañjana (untouched, stainless), śānta (inherently
  at rest), and bodha (luminous awareness itself)—and crucially, as paraḥ prakṛteḥ, standing prior to
  and independent of all nature, all becoming, all change.


  The force of the verse lies in the second line: etāvantam ahaṃ kālaṃ—"for this entire span of time"—the
  Self has been bound only by moha, delusion or forgetting. Not by any actual bondage. The verb viḍambitaḥ
  (deceived, deluded) is passive; the Self did not do the deceiving—it was obscured by the mind''s own
  confusion. This is the radical non-dual insight: the witness-consciousness (sākṣin) that observes all
  experience, including the sense of being bound, was never actually bound at all.


  What shifts is not the Self but recognition. The "I am" that now sees through the delusion is the same
  "I am" that was always present, watching the dream of bondage unfold. The aho (ah!) is the breath of
  sudden clarity—not a becoming, but a remembering of what never changed. This verse invites the reader
  to stop seeking liberation and instead notice: the freedom you seek is the very ground from which the
  seeking arises.


  Key Terms


  **nirañjana** — stainless, untouched, unsullied—the Self that remains unaffected by all experience

  **sākṣin** — the witness-consciousness, the ever-present awareness that observes all states and events
  without being modified by them

  **moha** — delusion, forgetting, the apparent veiling of the Self''s true nature by identification with
  mind and body'
insight: 'Extended Translation:

  Oh!'
practice: 'Whisper aloud, "I am the stainless, the peaceful"—then stop mid-sentence and listen to the
  silence that holds those words. Notice: the awareness hearing your own voice is untouched by the words
  themselves, unchanged by their meaning. Repeat this three times throughout your day, each time letting
  the silence after speaking be longer than the speaking itself.'
