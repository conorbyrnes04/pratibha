- kind: translation
  label: Pratibha Translation
  body: Oh!
- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    Oh! I am the stainless, peaceful knowing, beyond nature. For such a long time, I was merely deluded!


    The exclamation *aho* — Oh! — is the sound of recognition breaking through. Not the "aha!" of intellectual solution, but
    the "Oh!" of a person who has just found their keys in their own hand after searching the house for an hour. *Viḍambitaḥ*
    — tricked, deceived, made a fool of — captures the retrospective quality of the moment. The recognition retroactively
    illuminates the entire period of seeking: it was all *moha* (delusion), the delusion of not recognizing what was always
    present. *Etāvantam kālam* — for so long — is an expression of both wonder and gentle self-compassion. The first word
    of Janaka''s recognition is not "I know" but "I am": *bodhaḥ aham* — I am consciousness itself.'
- kind: key_terms
  label: Key Terms
  items:
  - term: nirañjana
    definition: stainless, uncolored; *nir* (without) + *añjana* (collyrium/color); awareness that takes no taint from what
      appears in it
  - term: prakṛteḥ paraḥ
    definition: beyond nature; *prakṛti* (primal nature, the ground of matter and mind) + *para* (beyond, transcendent); the
      Self as what is not constituted by any natural process
  - term: viḍambita
    definition: tricked, deceived, made a fool of; the recognition as including a retrospective humor about the seeking itself
  - term: moha
    definition: delusion, confusion; from *muh* (to be confused); the structural bewilderment of not recognizing one's own
      nature
    lemma_id: moha
    sense_id: moha.shaiva_advaita
