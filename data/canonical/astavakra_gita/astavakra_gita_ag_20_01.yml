sanskrit_devanagari: 'क्वोपदेशः क्व वा शास्त्रं क्व शिष्यः क्व च वा गुरुः ।

  क्वास्ति पुरुषार्थो वा निरुपाधेः शिवस्य मे ॥ २०.१ ॥'
sanskrit_iast: 'kvopadeśaḥ kva vā śāstraṃ kva śiṣyaḥ kva ca vā guruḥ |

  kvāsti puruṣārtho vā nirupādheḥ śivasya me || 20.1 ||'
translation_literal: For me—the auspicious one (śiva), free of limiting adjuncts (upādhi)—where are instruction, scripture,
  disciple, or teacher? Where, indeed, is any human aim (puruṣārtha)?
commentary: 'Aṣṭāvakra speaks from the standpoint not of the empirical person but of pure awareness itself. Teacher, student,
  scripture, and instruction belong to the field in which ignorance seems to arise and a remedy is consequently sought. Likewise,
  the puruṣārthas—the recognized human aims of duty, prosperity, pleasure, and liberation—presume an individual who lacks
  something or must attain something. The Self, however, is nirupādhi: not qualified, bounded, or made into a particular entity
  by body, mind, role, or condition. As śiva, it is intrinsically whole and auspicious. The verse therefore does not forbid
  study or dismiss a guru at the practical level. It denies that these relations define or complete awareness. Instruction
  has fulfilled its function when it reveals that the seeker was never other than the freedom sought.


  Key Terms


  **upadeśa** — instruction, spiritual teaching

  **śāstra** — scripture, authoritative teaching-text

  **puruṣārtha** — human aim or value to be attained

  **nirupādhi** — free of limiting adjuncts or imposed conditions


  Cross-Tradition Resonances


  **Zen’s language of a direct transmission ‘outside the scriptures’ parallels the claim that awakening is not finally contained
  in texts or concepts.:**  Divergence: Zen generally avoids affirming an eternal Self, whereas Aṣṭāvakra explicitly speaks
  from the standpoint of immutable awareness.

  **The Daodejing’s suspicion of proliferating doctrines and deliberate striving resembles this release of imposed spiritual
  tasks.:**  Divergence: Daoism speaks of alignment with the Dao and natural spontaneity; this verse grounds freedom specifically
  in non-dual Self-awareness.

  **The Cloud of Unknowing treats concepts and religious images as unable to grasp God, inviting a knowing beyond discursive
  mastery.:**  Divergence: Apophatic Christianity ordinarily preserves a distinction between creature and God; Aṣṭāvakra collapses
  seeker and ultimate reality into non-dual awareness.'
practice: 'Sit quietly for five minutes. Notice every identity that appears—student, practitioner, confused person, successful
  person—and silently ask: “What is aware of this role?” Rest as that aware presence without trying to improve it.'
