title: Moral and Experiential Identity Belong to Mind
unit_type: sutra
sanskrit_devanagari: 'धर्माधर्मौ सुखं दुःखं मानसानि न ते विभो ।

  न कर्तासि न भोक्तासि मुक्त एवासि सर्वदा ॥'
sanskrit_iast: 'dharmādharmau sukhaṃ duḥkhaṃ mānasāni na te vibho |

  na kartāsi na bhoktāsi mukta evāsi sarvadā ||'
translation_literal: Virtue and vice, pleasure and pain—these are all of the mind, not of you, O Lord.
  You are neither the doer nor the enjoyer. You are ever free.
commentary: 'This verse cuts to the heart of Advaita''s radical claim: the Self (ātman) stands utterly
  apart from the moral, experiential, and volitional machinery that the mind runs. Dharma and adharma—right
  action and wrong action—belong to the mental-ethical apparatus; they are constructs of conditioned consciousness,
  not properties of the witnessing Self. Similarly, sukha and duḥkha (pleasure and pain) are mental events,
  fluctuations in the subtle body''s experience. The verse addresses the seeker as ''vibho'' (Lord, Master)—invoking
  the inherent sovereignty of the Self—to awaken recognition of what has always been true: you have never
  truly acted (na kartāsi), never truly experienced the fruits of action as a bound entity (na bhoktāsi).
  The doer-enjoyer is a superimposition on the mind; the Self remains the untouched, ever-present witness
  (sākṣin). The final declaration—''mukta evāsi sarvadā'' (you are ever free)—is not a promise of future
  liberation but a statement of fact: freedom is not attained; it is recognized as your eternal nature.
  No moral effort, no experiential journey, no karmic accounting touches the Self. This is the direct
  pointing to what you already are.


  Key Terms


  **dharma-adharma** — virtue and vice; the entire moral-ethical framework belonging to conditioned mind,
  not to the Self

  **sākṣin** — the witness-consciousness; the Self as the untouched observer of all mental, emotional,
  and volitional events

  **kartṛtva-bhoktṛtva** — doership and enjoyership; the false identification with action and its fruits,
  a property of mind alone'
insight: 'Extended Translation:

  Righteousness and unrighteousness, pleasure and pain — these belong to the mind, not to you, O All-pervading
  One.'
practice: Whenever you notice yourself claiming 'I did that' or 'I feel this pain,' stop mid-thought and
  let your gaze drop to your hands or chest—hold it there for three breaths while silently witnessing
  the thought dissolve like a cloud passing through empty sky, untouched by it. Repeat this interruption
  each time the sense of doership or ownership arises throughout your day, until the gap between the thought
  and the witnessing becomes obvious.
