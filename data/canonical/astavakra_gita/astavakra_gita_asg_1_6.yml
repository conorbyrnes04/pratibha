- kind: key_terms
  label: Key Terms
  items:
  - term: dharma/adharma
    definition: righteousness/unrighteousness; the moral poles of action; here assigned to mind, not Self
  - term: mānasāni
    definition: of the mind, mental; from *manas* (mind); the crucial assignment — these are mental events, not Self-events
  - term: kartā
    definition: doer, agent; the sense of being the originator of action
  - term: bhoktā
    definition: enjoyer, experiencer; the sense of being the one who receives experience
  - term: mukta
    definition: free, liberated; *mukta evāsi* — you *are* free, not you *will be* free
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijñāhṛdayam 9
    resonance: the *saṁsārī* is covered by *mala* — the structural sense of being a doer; liberation is the recognition that
      this sense of doership never belonged to the Self
    divergence: ''
    passage_id: pratyabhijnahrdayam.phr_009
  - citation: Epictetus on *prohairesis
    resonance: what is "up to us" vs. what is not
    divergence: 'but here the reversal is more radical: even what seems most "up to us" (our moral choices) is assigned to
