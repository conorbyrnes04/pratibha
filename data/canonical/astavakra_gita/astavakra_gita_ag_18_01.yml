title: The Dream of Delusion
unit_type: verse
sanskrit_devanagari: 'यस्य बोधोदये तावत् स्वप्नवद् भवति भ्रमः ।

  तस्मै सुखैकरूपाय नमः शान्ताय तेजसे ॥ १८.१ ॥'
sanskrit_iast: 'yasya bodhodaye tāvat svapnavad bhavati bhramaḥ |

  tasmai sukhaikarūpāya namaḥ śāntāya tejase || 18.1 ||'
translation_literal: Homage to that peaceful radiance, whose sole nature is bliss, for whom, with the arising of awakening
  (bodha), delusion (bhrama) becomes like a dream.
commentary: 'The verse opens not with an instruction but with salutation: liberation is not manufactured by the individual;
  it is recognition of the ever-present reality named here as peaceful radiance. When bodha, direct knowing, arises, bhrama
  does not necessarily mean that appearances vanish. The world, body, thought, and action may continue to appear, just as
  images continue in a dream while it lasts. What ends is their power to define, bind, or threaten the knower. They are understood
  as dependent appearances within awareness, rather than as an independent reality confronting a separate self. Sukhaikarūpa—“of
  the single nature of bliss”—does not point to a passing pleasurable feeling. It indicates the unconditioned ease of awareness,
  free of lack because it is not an object needing completion. Śānta, peaceful, qualifies this as non-reactive clarity; tejas,
  radiance, as self-revealing intelligence. The homage is thus directed to one’s own innermost reality, not to an external
  deity.


  Key Terms


  **bodhodaya** — the arising of direct awakening or knowledge

  **bhrama** — delusion, misapprehension, or mistaken appearance

  **sukhaikarūpa** — having bliss or ease as one’s sole nature

  **tejas** — radiance, luminous power, self-manifesting clarity


  Cross-Tradition Resonances


  **Madhyamaka repeatedly compares conditioned phenomena to dreams: they appear and function, yet lack independent, intrinsic
  existence.:**  Divergence: Madhyamaka does not affirm the Aṣṭāvakra Gītā’s enduring pure Awareness or Self as an ultimate
  substance.

  **Zen awakening is often described as seeing through the constructed solidity of the self and its world, while ordinary
  activity continues.:**  Divergence: Zen generally resists defining awakening as a permanent bliss-nature or metaphysical
  witnessing consciousness.

  **Plotinus locates freedom in turning from externally scattered identification toward the self-present intelligible source,
  beyond ordinary disturbance.:**  Divergence: His Neoplatonic ascent retains a graded metaphysical procession and return,
  unlike this verse’s immediate Advaitic recognition of oneself as the radiant reality.'
practice: 'For five minutes, let sensations, thoughts, and perceptions arise without correcting them. Silently note, “appearing
  in awareness.” Then ask: “What in me is unchanged by the appearance and disappearance of this experience?” Rest as that
  noticing, without seeking a special state.'
