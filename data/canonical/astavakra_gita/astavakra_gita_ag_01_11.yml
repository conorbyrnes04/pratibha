unit_type: verse
sanskrit_devanagari: 'भावाभावविकारश् च स्वभावाद् इति निश्चयी ।

  निर्विकारो गतक्लेशः सुखेनैवोपशाम्यति ॥ १.११ ॥'
sanskrit_iast: 'bhāvābhāvavikāraś ca svabhāvād iti niścayī |

  nirvikāro gatakleśaḥ sukhenaivopaśāmyati || 1.11 ||'
translation_literal: One who knows with certainty that the changes of being and non-being arise by nature
  becomes changeless, free of affliction, and effortlessly comes to peace.
commentary: 'The verse turns on a decisive discernment: every bhāva—every appearing state, event, possession,
  identity, or mental condition—and every abhāva—its absence, loss, or cessation—belongs to the field
  of vikāra, alteration. Their arising and passing is svabhāvāt: according to their own contingent nature,
  not through a deficiency in the witnessing Self. This is not fatalism, nor an instruction to suppress
  experience. Pleasure, grief, achievement, and failure may continue to occur; what ends is the claim
  that awareness itself has been improved, damaged, enlarged, or diminished by them. The niścayī, one
  established in this certainty, is nirvikāra because he no longer locates himself in the changing object.
  Klesha loses its footing when experience is no longer interpreted as a verdict on the Self. Peace is
  therefore not manufactured by a further mental event; it is recognized as the untroubled character of
  awareness when grasping relaxes.


  Key Terms


  **bhāva / abhāva** — presence or becoming / absence or cessation

  **vikāra** — modification, alteration

  **svabhāvāt** — by inherent nature; according to the nature of phenomena

  **nirvikāra** — unmodified, changeless


  Cross-Tradition Resonances


  **Both identify conditioned experiences as arising and passing, so clinging to them produces distress.:**  Divergence:
  Classical Buddhism generally denies an enduring self behind phenomena, while this Advaita verse affirms
  changeless awareness as the witness.

  **Stoic practice distinguishes unstable external events from the inner stance that need not be disturbed
  by them.:**  Divergence: Stoicism centers ethical rational agency and virtuous action; Aṣṭāvakra grounds
  freedom more radically in identity with untouched awareness.

  **The movement toward effortless settling recalls wu-wei: not forcing oneself against the natural movement
  of things.:**  Divergence: Daoist language usually emphasizes harmony with the Dao, whereas this verse
  makes a non-dual claim about the changeless Self.'
practice: 'For ten minutes, label each noticed experience quietly as “appearing” or “disappearing”—thought,
  sensation, sound, mood—then ask: “What in this moment knows the change, yet is not itself changing?”
  Rest as that knowing without trying to improve the state.'
