sanskrit_devanagari: 'एको द्रष्टासि सर्वस्य मुक्तप्रायोऽसि सर्वदा ।

  अयमेव हि ते बन्धो द्रष्टारं पश्यसीतरम् ॥'
sanskrit_iast: 'eko draṣṭāsi sarvasya muktaprāyo''si sarvadā |

  ayameva hi te bandho draṣṭāraṃ paśyasītaram ||'
translation_literal: You are the one witness of everything, ever almost free.
commentary: 'Extended Translation:

  You are the one witness of everything, ever almost free. Your only bondage is this: you see the seer as other than yourself.


  Perhaps the most compressed diagnosis of bondage in the tradition. *Muktaprāyaḥ* — "almost free," nearly liberated, substantially
  free — acknowledges that the ordinary person is not wholly ignorant. Something is recognized. But one error remains: *draṣṭāraṃ
  paśyasi itaram* — you see the seer as other. The witness is objectified. Awareness becomes a thing observed rather than
  the ground of all observing. This reflexive error — consciousness turning itself into an object and then failing to recognize
  the subject that is doing the turning — is the precise mechanism of bondage. There is no other bondage. No karma, no ignorance,
  no sin — only this one structural reversal.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 12: *svaśaktibhiḥ vyāmohitatā* — bewildered by one''s own powers; the same structural error described
  in different terms

  - Plotinus, *Enneads* V.3: the One cannot know itself as object — the seer cannot be seen; when it tries, it generates the
  illusion of otherness

  - Zen kōan tradition: "What is the face you had before your parents were born?" — the question designed to produce exactly
  the recognition that 1.7 names


  Key Terms


  **draṣṭā** — The witnessing knower, presented here as the single seer of all experience.

  **muktaprāyaḥ** — “Almost free” or “nearly liberated,” indicating that only a residual error remains.

  **bandhaḥ** — Bondage, defined not as experience itself but as misidentifying the witness as an other.

  **itaram** — Other or separate, the imagined alterity imposed upon the seer.


  Cross-Tradition Resonances


  **Bāhiya Sutta, Udāna 1.10.:** Its instruction that in the seen there is only the seen similarly cuts the construction of
  a separate subject standing apart from experience. Divergence: The Buddhist sutta denies an enduring self or witness, whereas
  this verse affirms a single witnessing reality.

  **Plotinus, Enneads VI.9.11.:** Plotinus describes the highest realization as a unitive seeing in which knower and known
  are no longer experienced as distinct. Divergence: Plotinus frames this unity as ascent toward the transcendent One, while
  the Aṣṭāvakra verse identifies the ever-present witness as already one’s own nature.

  **Augustine, Confessions III.6.11.:** Augustine’s confession that God is “more inward than my inmost self” parallels the
  turn from outward objectification toward the deepest ground of awareness. Divergence: Augustine preserves the ontological
  distinction between Creator and creature, whereas the verse treats otherness from the seer as the remaining bondage.'
insight: 'Extended Translation:

  You are the one witness of everything, ever almost free.'
practice: Try to see the seer. Not through introspection (which is still looking inward at objects) but by simply recognizing
  that whatever is doing the looking cannot be looked at. Rest in that impossibility. The frustration of not being able to
  see the seer is the closest most people come to the *draṣṭā* itself.
