sanskrit_devanagari: 'एको द्रष्टासि सर्वस्य मुक्तप्रायोऽसि सर्वदा ।

  अयमेव हि ते बन्धो द्रष्टारं पश्यसीतरम् ॥'
sanskrit_iast: 'eko draṣṭāsi sarvasya muktaprāyo''si sarvadā |

  ayameva hi te bandho draṣṭāraṃ paśyasītaram ||'
translation_literal: 'You are the one witness of all, ever nearly free. This alone is your bondage: that
  you see another witness.'
commentary: 'Extended Translation:

  You are the one witness of everything, ever almost free. Your only bondage is this: you see the seer
  as other than yourself.


  Perhaps the most compressed diagnosis of bondage in the tradition. *Muktaprāyaḥ* — "almost free," nearly
  liberated, substantially free — acknowledges that the ordinary person is not wholly ignorant. Something
  is recognized. But one error remains: *draṣṭāraṃ paśyasi itaram* — you see the seer as other. The witness
  is objectified. Awareness becomes a thing observed rather than the ground of all observing. This reflexive
  error — consciousness turning itself into an object and then failing to recognize the subject that is
  doing the turning — is the precise mechanism of bondage. There is no other bondage. No karma, no ignorance,
  no sin — only this one structural reversal.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 12: *svaśaktibhiḥ vyāmohitatā* — bewildered by one''s own powers; the same structural
  error described in different terms

  - Plotinus, *Enneads* V.3: the One cannot know itself as object — the seer cannot be seen; when it tries,
  it generates the illusion of otherness

  - Zen kōan tradition: "What is the face you had before your parents were born?" — the question designed
  to produce exactly the recognition that 1.7 names


  Key Terms


  **eko draṣṭā** — the single witness, the nondual awareness in which all experience appears.

  **muktaprāyaḥ** — almost free or virtually liberated, indicating recognition obscured by a residual
  error.

  **bandhaḥ** — bondage, here consisting solely in misidentifying the witness as an other.

  **itaram** — other or different, the objectified seer mistakenly taken to stand apart from oneself.


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.4:** Its teaching of the reality that is the hearing behind hearing and seeing behind
  sight parallels the verse''s witness that cannot itself be reduced to an object. Divergence: The Kena
  expresses the point through apophatic formulations about Brahman, while Aṣṭāvakra directly diagnoses
  bondage as seeing the seer as other.

  **Bāhiya Sutta, Udāna 1.10:** The instruction that in the seen there is only the seen similarly removes
  the imagined subject-object structure that generates grasping and confinement. Divergence: The Buddhist
  discourse avoids affirming an eternal witnessing Self, whereas this verse explicitly identifies liberation
  with the one witness.

  **Plotinus, Enneads VI.9.11:** Plotinus describes the highest contemplative realization as a unification
  in which knower and known are no longer experienced as two. Divergence: Plotinus frames this union as
  ascent toward the transcendent One, while the Aṣṭāvakra verse presents the witness as already one''s
  immediate identity.'
insight: 'Extended Translation:

  You are the one witness of everything, ever almost free.'
practice: Try to see the seer. Not through introspection (which is still looking inward at objects) but
  by simply recognizing that whatever is doing the looking cannot be looked at. Rest in that impossibility.
  The frustration of not being able to see the seer is the closest most people come to the *draṣṭā* itself.
