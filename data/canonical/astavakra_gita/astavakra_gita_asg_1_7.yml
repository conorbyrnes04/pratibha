- kind: practice
  label: Practice (Abhyasa)
  body: Try to see the seer. Not through introspection (which is still looking inward at objects) but by simply recognizing
    that whatever is doing the looking cannot be looked at. Rest in that impossibility. The frustration of not being able
    to see the seer is the closest most people come to the *draṣṭā* itself.
