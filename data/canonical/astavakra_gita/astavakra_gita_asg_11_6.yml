unit_label: The Threefold Certainty That Liberates While Living
title: The Threefold Certainty That Liberates While Living
unit_type: sutra
sanskrit_devanagari: नाहं देहो न मे देहो बोधोऽहमिति निश्चयी। कस्यापि ननु लोकेऽस्मिन् जीवन्मुक्तो न दृश्यते॥
sanskrit_iast: nāhaṃ deho na me deho bodho'ham iti niścayī | kasyāpi nanu loke'smin jīvanmukto na dṛśyate
  ||
translation_literal: One who is certain that 'I am not the body, nor is the body mine; I am consciousness'
  — for whom in this world would such a person not be seen as liberated while living?
commentary: 'Certitude (*niścayī*) is the operative word — not belief, not aspiration, but settled recognition.
  The verse stacks three negations that dismantle the primary bondage-structure: *nāhaṃ dehaḥ* (I am not
  the body), *na me dehaḥ* (the body is not mine), *bodho''ham* (I am pure knowing). Each negation targets
  a different layer of identification. The first removes ontological confusion; the second removes possessive
  attachment; the third affirms what remains when both fall away. What remains is not a thing but *bodha*
  — luminous knowing itself, prior to the subject-object split.

  The second half of the verse is Aṣṭāvakra''s characteristic irony: such a one *lives as if liberated*
  (*jīvanmukta*), yet "who is ever seen as liberated while living?" The world cannot recognize liberation
  because it looks for signs in behavior, appearance, or social role — while the liberated one has simply
  stopped performing bondage. This is not anti-social withdrawal but the collapse of the inner drama that
  makes bondage visible.


  Key Terms


  **niścayī** — One possessed of settled certainty or firm recognition; not mere belief but direct, unshakeable
  conviction that persists as lived reality.

  **jīvanmukta** — Liberation while living; the state of one who is free from bondage while embodied,
  recognized not by external signs but by the collapse of inner identification with body and ego.

  **bodha** — Pure luminous knowing or consciousness itself, prior to the subject-object division; what
  remains when all identification with body and possession falls away.


  Cross-Tradition Resonances


  **Upaniṣads, Aitareya Upaniṣad 1.1:** Both affirm consciousness (*prajñāna*) as the ultimate reality
  underlying all existence, and both use negation of the body-mind complex to point toward this ground.
  Divergence: The Upaniṣads emphasize cosmic identity (*tat tvam asi*), while Aṣṭāvakra emphasizes the
  immediate collapse of the bondage-structure through three-fold negation in the present moment.

  **Bhagavad Gītā 2.20–25 (Kṛṣṇa on the ātman):** Both teach that the true self is unborn, unchanging,
  and untouched by the body''s fate; both use negation to dismantle identification with the physical form.
  Divergence: The Gītā frames this within duty (*dharma*) and action in the world, while Aṣṭāvakra''s
  irony suggests the liberated one is invisible precisely because they have stopped performing any role,
  including duty.

  **Advaita Vedānta, Śaṅkara on Brahma Sūtra 1.1.4:** Both use layered negation (*neti neti*) to remove
  false identification and point to non-dual consciousness as what remains; both distinguish between intellectual
  understanding and lived realization. Divergence: Śaṅkara emphasizes systematic inquiry and the authority
  of scripture, while Aṣṭāvakra''s verse pivots on the ironic paradox that such realization renders one
  invisible to the world''s gaze.'
insight: Certitude (*niścayī*) is the operative word — not belief, not aspiration, but settled recognition.
practice: When bodily identification arises — fatigue, pain, aging — hold the threefold formula silently.
  Not I. Not mine. I am knowing. Notice whether the formula dissolves the grip of identification or merely
  adds another thought on top. The test is in the quality of contact with sensation, not in the words.
