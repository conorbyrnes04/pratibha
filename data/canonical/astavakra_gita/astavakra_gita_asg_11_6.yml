sanskrit_devanagari: नाहं देहो न मे देहो बोधोऽहमिति निश्चयी। कस्यापि ननु लोकेऽस्मिन् जीवन्मुक्तो न दृश्यते॥
sanskrit_iast: nāhaṃ deho na me deho bodho'ham iti niścayī | kasyāpi nanu loke'smin jīvanmukto na dṛśyate
  ||
translation_literal: 'I am not the body, the body is not mine—I am consciousness itself. Whoever holds
  this certainty with unwavering conviction: such a one, living in this world, is never seen as bound.'
commentary: 'This verse distills the threefold negation that dissolves the root of bondage. The first
  negation—''I am not the body''—severs identification with the physical form. The second—''the body is
  not mine''—cuts the possessive claim that makes the body feel like ''my'' instrument or property. Together
  these two clear away the illusion of agency: if I am not the body and do not own it, then I cannot be
  its doer.


  The third statement—''I am consciousness itself'' (bodho''ham)—is not a new acquisition but a recognition
  of what has always been true. This consciousness (bodha) is the ever-present witness (sākṣin) that observes
  all states—waking, dream, sleep—without being touched by any of them. It is not produced, does not act,
  and cannot be bound.


  The Sanskrit niścayī (one who holds with certainty) points to a conviction so clear and stable that
  it becomes the ground of direct knowing, not mere intellectual belief. When this triple certainty settles
  into lived understanding, the person remains outwardly active in the world—eating, speaking, working—yet
  inwardly untouched by the sense of being a separate doer. This is jīvanmukti: liberation while living.
  The body-mind continues its patterns, but the false identification with it has dissolved. The witness
  stands free, and that freedom is already complete.


  Key Terms


  **sākṣin** — The witness-consciousness; the unchanging awareness that observes all experience without
  being affected by it

  **jīvanmukti** — Liberation while living; freedom from the sense of separate doership even while the
  body-mind continues to function in the world

  **bodha** — Consciousness, sentience, or awakeness itself—the luminous aware-ness that is one''s true
  nature'
insight: Certitude (*niścayī*) is the operative word — not belief, not aspiration, but settled recognition.
practice: 'Through each waking hour today, whenever you notice yourself saying ''my'' (my body, my hand,
  my breath, my thought), pause and whisper the reversal: ''the body, the hand, the breath, the thought''—stripping
  the possessive claim with each utterance until the doer dissolves and only witnessing remains.'
