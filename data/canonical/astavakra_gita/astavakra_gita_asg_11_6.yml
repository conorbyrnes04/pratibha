- kind: practice
  label: Practice (Abhyasa)
  body: When bodily identification arises — fatigue, pain, aging — hold the threefold formula silently. Not I. Not mine. I
    am knowing. Notice whether the formula dissolves the grip of identification or merely adds another thought on top. The
    test is in the quality of contact with sensation, not in the words.
