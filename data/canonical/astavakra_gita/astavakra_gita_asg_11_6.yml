- kind: original
  label: Original
  body: नाहं देहो न मे देहो बोधोऽहमिति निश्चयी। कस्यापि ननु लोकेऽस्मिन् जीवन्मुक्तो न दृश्यते॥
- kind: iast
  label: IAST
  body: nāhaṃ deho na me deho bodho'ham iti niścayī | kasyāpi nanu loke'smin jīvanmukto na dṛśyate ||
- kind: translation
  label: Pratibha Translation
  body: One certain that "I am not the body, the body is not mine, I am pure consciousness" — lives as if already liberated;
    though who, in this world, is ever seen as liberated while living?
- kind: commentary
  label: Pratibha Commentary
  body: 'Certitude (*niścayī*) is the operative word — not belief, not aspiration, but settled recognition. The verse stacks
    three negations that dismantle the primary bondage-structure: *nāhaṃ dehaḥ* (I am not the body), *na me dehaḥ* (the body
    is not mine), *bodho''ham* (I am pure knowing). Each negation targets a different layer of identification. The first removes
    ontological confusion; the second removes possessive attachment; the third affirms what remains when both fall away. What
    remains is not a thing but *bodha* — luminous knowing itself, prior to the subject-object split.

    The second half of the verse is Aṣṭāvakra''s characteristic irony: such a one *lives as if liberated* (*jīvanmukta*),
    yet "who is ever seen as liberated while living?" The world cannot recognize liberation because it looks for signs in
    behavior, appearance, or social role — while the liberated one has simply stopped performing bondage. This is not anti-social
    withdrawal but the collapse of the inner drama that makes bondage visible.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bodha (बोध)
    definition: '√budh ‘awaken, know’ → pure knowing identified as ‘I’ after body-claim falls → trap: ‘understanding’ as conceptual
      assent'
    lemma_id: jnana
    sense_id: jnana.indic
  - term: jīvanmukta (जीवन्मुक्त)
    definition: 'jīvan ‘while living’ + mukta ‘freed’ → liberation as present recognition, not post-mortem status → trap:
      a special holy career rather than the verse’s ironic rarity'
    lemma_id: moksa
    sense_id: moksa.vedanta
  - term: deha (देह)
    definition: '√dih ‘smear, fashion’ → the fashioned body refused as both identity and property → trap: body-hatred; the
      text negates identification, not embodiment'
    lemma_id: sarira
