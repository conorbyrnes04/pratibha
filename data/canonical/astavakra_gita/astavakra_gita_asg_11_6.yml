    Cross-Tradition Resonances:

    - Pratyabhijñāhṛdayam 12: bondage is seeing the seer as other; here the threefold formula reverses
    that error at the level of body-ownership.

    - Epictetus, Enchiridion §1: distinguish what is yours from what is not — parallel division, but Aṣṭāvakra
    goes further: even the body is not "yours" in the way appropriation assumes.

    - Tantrasāra, opening verse: the heart as seat where stillness and movement meet; *bodha''ham* names
    the still knowing in which bodily movement appears without being owned.'
