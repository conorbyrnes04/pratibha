title: Self-Conception Determines Bondage or Freedom
unit_type: sutra
sanskrit_devanagari: 'मुक्ताभिमानी मुक्तो हि बद्धो बद्धाभिमान्यपि ।

  किंवदन्तीह सत्येयं या मतिः सा गतिर्भवेत् ॥'
sanskrit_iast: 'muktābhimānī mukto hi baddho baddhābhimāny api |

  kiṃvadantīha satyeyaṃ yā matiḥ sā gatir bhavet ||'
translation_literal: One who holds the conviction 'I am free' is indeed free; one who holds the conviction
  'I am bound' is bound. Whatever understanding one cherishes here—that very understanding becomes one's
  destination.
commentary: 'This verse cuts to the heart of Advaita''s radical claim: liberation is not a state to be
  achieved but a recognition already true. The Sanskrit muktābhimānī—literally ''one whose conviction
  is freedom''—points not to wishful thinking but to a shift in self-conception so fundamental it restructures
  lived reality.


  The parallel structure (muktābhimānī mukto hi / baddho baddhābhimāny api) establishes an unsettling
  symmetry: freedom and bondage are not objective conditions imposed from outside but crystallizations
  of how one understands oneself. The witness-Self (sākṣin) is always untouched, always free—yet identification
  with the body-mind, with doership, with the sense of being a limited agent creates the *experience*
  of bondage. This is not delusion in the sense of hallucination; it is a real contraction of consciousness,
  a genuine forgetting of what one is.


  The final line—yā matiḥ sā gatir bhavet (the understanding one holds becomes one''s destination)—reveals
  that there is no external judge, no cosmic accountant. The mind''s conviction about itself *is* the
  path; understanding *is* the fruit. This is why self-inquiry (ātma-vicāra) is not a technique to acquire
  something new but a recognition of what has never been bound.


  The verse does not say ''become free'' or ''realize yourself.'' It says: the one who knows himself as
  free *is* free. The knowing and the being are one act. This is the non-dual teaching in its most direct
  form.


  Key Terms


  **sākṣin** — The witness-consciousness; the unchanging awareness that observes all experience without
  being affected by it

  **mati** — Understanding, conviction, or the settled sense of who one takes oneself to be; the mind''s
  self-conception

  **abhimānī** — One who holds a conviction or identification; literally ''one who has the sense of I-ness
  regarding something'''
insight: 'Extended Translation:

  The one who thinks themselves free is indeed free; the one who thinks themselves bound is indeed bound.'
practice: 'The next time you catch yourself thinking ''I cannot'' or ''I am stuck,'' stop mid-breath and
  reverse the conviction aloud in a whisper: ''I hold the understanding that I am free.'' Repeat it three
  times, feeling the shift in your chest and spine, then notice what becomes possible in the next moment.'
