  - term: mukta/baddha
    definition: free/bound; the two fundamental self-identifications and their consequences
  - term: mati
    definition: conviction, understanding, the deep mind-set; not surface belief but structural orientation
  - term: gati
    definition: going, trajectory, condition, direction of travel; what follows necessarily from the *mati*
