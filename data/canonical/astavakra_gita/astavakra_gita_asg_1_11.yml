sanskrit_devanagari: 'मुक्ताभिमानी मुक्तो हि बद्धो बद्धाभिमान्यपि ।

  किंवदन्तीह सत्येयं या मतिः सा गतिर्भवेत् ॥'
sanskrit_iast: 'muktābhimānī mukto hi baddho baddhābhimāny api |

  kiṃvadantīha satyeyaṃ yā matiḥ sā gatir bhavet ||'
translation_literal: The one who thinks themselves free is indeed free; the one who thinks themselves
  bound is indeed bound.
commentary: 'Extended Translation:

  The one who thinks themselves free is indeed free; the one who thinks themselves bound is indeed bound.
  This is the truth in the world — as is one''s conviction, so is one''s condition.


  This verse is sometimes misread as a simple assertion of positive thinking. It is actually a profound
  statement about the ontological primacy of self-identification. *Abhimāna* — what one takes oneself
  to be, the self-concept — is not merely psychological; it is constitutive of the experiential field.
  The one who has genuinely recognized themselves as the free Self (*mukta-abhimānī*) is not performing
  liberation — they are liberated, because liberation was never anything other than the recognition of
  what was always the case. Conversely, the one who is structurally convinced of bondage (*baddha-abhimānī*)
  recreates bondage in every moment, even if they intellectually "know" they are free. *Yā matiḥ sā gatiḥ*
  — as the deep conviction (*mati*), so the trajectory (*gati*). This is not a law of attraction; it is
  a statement about the creative power of fundamental self-identification.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 11: *muktābhimāna* as the recognition of one''s nature as Śiva — not an achievement
  but a seeing

  - A Course in Miracles: "The mind''s power is absolute" — a Western parallel to the creative primacy
  of *abhimāna*

  - William James, *The Varieties of Religious Experience*: the "will to believe" as a constitutive force
  in experience — a functional parallel from the psychology of religion


  Key Terms


  **muktābhimānī** — One whose self-identification is “I am free,” indicating freedom through non-identification
  with bondage.

  **baddhābhimānī** — One whose self-identification is “I am bound,” thereby sustaining the appearance
  of limitation.

  **matiḥ** — Conviction, understanding, or settled mental orientation; here the formative view one holds
  of oneself.

  **gatiḥ** — One’s condition, course, or existential destination; one becomes as one’s conviction is.


  Cross-Tradition Resonances


  **Patañjali, Yoga Sūtra 1.3–1.4:** Yoga Sūtra teaches that the Seer abides in its own nature when mental
  modifications cease, but otherwise appears identified with those modifications, paralleling bondage
  as misidentification. Divergence: Patañjali prescribes disciplined cessation of citta-vṛttis, whereas
  this verse foregrounds immediate liberation through the conviction of one’s freedom.

  **Epictetus, Enchiridion 5:** Epictetus says people are disturbed not by things but by their judgments
  about things, closely paralleling the verse’s claim that one’s inner appraisal determines one’s lived
  condition. Divergence: Stoicism treats judgments as ethical and practical sources of distress, while
  the Aṣṭāvakra Gītā treats self-identification as constitutive of metaphysical bondage or liberation.

  **Dhammapada 1.1–2:** The Dhammapada opens by declaring that mind precedes phenomena and that suffering
  or happiness follows according to one’s mental orientation, echoing the causal force of matiḥ. Divergence:
  Buddhist teaching rejects an enduring self to be liberated, whereas the Aṣṭāvakra Gītā presupposes recognition
  of the ever-free Self beyond mistaken identification.'
insight: 'Extended Translation:

  The one who thinks themselves free is indeed free; the one who thinks themselves bound is indeed bound.'
practice: For five minutes, hold — not as performance but as genuine inquiry — the self-identification
  "I am the free witness." Notice what resists this, what agrees with it, and what simply cannot be placed
  in either camp. The resistance is *baddha-abhimāna* at work. The agreement is the Self recognizing itself.
  What cannot be placed is closest to the truth.
