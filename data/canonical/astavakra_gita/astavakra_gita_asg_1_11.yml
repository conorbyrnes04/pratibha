- kind: translation
  label: Pratibha Translation
  body: The one who thinks themselves free is indeed free; the one who thinks themselves bound is indeed bound.
- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    The one who thinks themselves free is indeed free; the one who thinks themselves bound is indeed bound. This is the truth
    in the world — as is one''s conviction, so is one''s condition.


    This verse is sometimes misread as a simple assertion of positive thinking. It is actually a profound statement about
    the ontological primacy of self-identification. *Abhimāna* — what one takes oneself to be, the self-concept — is not merely
    psychological; it is constitutive of the experiential field. The one who has genuinely recognized themselves as the free
    Self (*mukta-abhimānī*) is not performing liberation — they are liberated, because liberation was never anything other
    than the recognition of what was always the case. Conversely, the one who is structurally convinced of bondage (*baddha-abhimānī*)
    recreates bondage in every moment, even if they intellectually "know" they are free. *Yā matiḥ sā gatiḥ* — as the deep
    conviction (*mati*), so the trajectory (*gati*). This is not a law of attraction; it is a statement about the creative
    power of fundamental self-identification.'
- kind: key_terms
  label: Key Terms
  items:
  - term: abhimāna
    definition: self-identification, pride, what one takes oneself to be; from *abhi* (toward) + *māna* (measure, estimation);
      the deep structural self-concept
  - term: mukta/baddha
    definition: free/bound; the two fundamental self-identifications and their consequences
  - term: mati
    definition: conviction, understanding, the deep mind-set; not surface belief but structural orientation
  - term: gati
    definition: going, trajectory, condition, direction of travel; what follows necessarily from the *mati*
