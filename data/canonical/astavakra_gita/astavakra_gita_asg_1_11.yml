- kind: practice
  label: Practice (Abhyasa)
  body: For five minutes, hold — not as performance but as genuine inquiry — the self-identification "I am the free witness."
    Notice what resists this, what agrees with it, and what simply cannot be placed in either camp. The resistance is *baddha-abhimāna*
    at work. The agreement is the Self recognizing itself. What cannot be placed is closest to the truth.
