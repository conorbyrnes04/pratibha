sanskrit_devanagari: 'विश्वं स्फुरति यत्रेदं तरङ्गा इव सागरे ।

  तत्त्वमेव न सन्देहश्चिन्मूर्ते विजवरो भव ॥'
sanskrit_iast: 'viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare |

  tattvam eva na sandehaḥ cinmūrte vijvaro bhava ||'
translation_literal: The universe appears in you like waves in the ocean.
commentary: 'Extended Translation:

  The universe appears in you like waves in the ocean. You are that — no doubt — O embodiment of pure consciousness. Remain
  free from agitation.


  Key Terms


  **viśvam** — the whole manifested universe or field of appearances.

  **sphurati** — shines forth, vibrates, or appears in awareness.

  **cinmūrte** — O embodiment of pure consciousness.

  **vijvaraḥ** — free from fever, agitation, or inward distress.


  Cross-Tradition Resonances


  **Laṅkāvatāra Sūtra, chapter 2:** The sūtra compares the arising of mental phenomena from store-consciousness to waves arising
  in the ocean, paralleling the universe’s appearance as waves within consciousness. Divergence: The Buddhist analysis denies
  an eternal witnessing Self, whereas this verse identifies the hearer with pure consciousness itself.

  **Plotinus, Enneads V.1.7:** Plotinus describes multiplicity as proceeding from and remaining dependent upon the intelligible
  source, much as waves are inseparable from the sea. Divergence: Plotinus distinguishes the transcendent One from Intellect
  and soul, while the verse directly names the seeker as consciousness in which all appears.

  **Daodejing, chapter 34:** The Daodejing portrays the great Dao as flowing everywhere and sustaining the myriad things without
  being exhausted or disturbed by them. Divergence: The Dao is not presented as a self-luminous conscious Self, whereas the
  verse explicitly grounds appearances in pure consciousness.'
insight: 'Extended Translation:

  The universe appears in you like waves in the ocean.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
