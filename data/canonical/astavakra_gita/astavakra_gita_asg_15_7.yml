  label: Key Terms
  items:
  - term: sphurati (स्फुरति)
    definition: '√sphur ‘throb, flash forth’ → universe appears as vibration within consciousness → trap: creation as manufacture
      outside awareness'
    lemma_id: spanda
  - term: cinmūrti (चिन्मूर्ति)
    definition: 'cit ‘awareness’ + mūrti ‘embodied form’ → addressed as embodiment of pure consciousness → trap: ‘form’ as
      solid idol rather than awareness appearing'
    lemma_id: cit
  - term: vijvara (विज्वर)
    definition: 'vi- ‘without’ + jvara ‘fever, agitation’ → remain free from feverish identification with waves → trap: emotional
      numbness as the goal'
