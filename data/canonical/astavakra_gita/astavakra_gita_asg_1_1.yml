- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit with the question "how?" — any "how?" currently alive in your spiritual life. Notice the shape of the question:
    it assumes a gap between here and there, between seeker and sought. Can you sense, even faintly, a presence that does
    not belong to the question? That presence is what Aṣṭāvakra will point to.'
