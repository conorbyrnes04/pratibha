- kind: translation
  label: Pratibha Translation
  body: 'Janaka said: How is knowledge attained?'
- kind: commentary
  label: Pratibha Commentary
  body: 'Extended Translation:

    Janaka said: How is knowledge attained? How does liberation come? How is dispassion reached? Tell me this, O Lord.


    The text opens with the three questions that frame every spiritual tradition: epistemology (*jñāna* — how do we know?),
    soteriology (*mukti* — how are we freed?), and the psychology of renunciation (*vairāgya* — how does attachment loosen?).
    Janaka is asking as a genuine seeker. What is remarkable is how rapidly Aṣṭāvakra answers — not with a teaching program
    but with a single declaration that makes the questions obsolete. The questions assume liberation is somewhere to be reached.
    The answer reveals it was never absent.'
- kind: key_terms
  label: Key Terms
  items:
  - term: jñāna
    definition: knowledge; here the non-dual recognition that is itself liberation, not a stepping-stone toward it
  - term: mukti / mokṣa
    definition: liberation, release; the text will argue this cannot be "attained" because the Self is already free
  - term: vairāgya
    definition: dispassion, non-attachment; from *vi* (away) + *rāga* (coloring, passion); the fading of compulsive engagement
      with objects
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijñāhṛdayam Sūtra 1
    resonance: '*citiḥ svatantrā* — Consciousness is already sovereign; the question of "how to attain" is the first obstacle.'
    divergence: ''
    passage_id: pratyabhijnahrdayam.phr_001
  - citation: Dào Dé Jīng ch. 48
    resonance: '"In pursuit of learning, every day something is acquired. In pursuit of Tao, every day something is dropped."
      Janaka is still acquiring; Aṣṭāvakra will show him what to drop.'
    divergence: ''
    passage_id: ''
  - citation: Meister Eckhart, Sermon 52
    resonance: '"If you want the kernel, you must break the shell" — the shell here is precisely Janaka''s three questions.'
    divergence: ''
    passage_id: ''
