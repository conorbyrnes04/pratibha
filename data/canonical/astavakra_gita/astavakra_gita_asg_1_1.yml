title: The Three Doors of Liberation Open
unit_type: sutra
sanskrit_devanagari: 'कथं ज्ञानमवाप्नोति कथं मुक्तिर्भविष्यति ।

  वैराग्यं च कथं प्राप्तमेतद् ब्रूहि मम प्रभो ॥'
sanskrit_iast: 'kathaṃ jñānam avāpnoti kathaṃ muktir bhaviṣyati |

  vairāgyaṃ ca kathaṃ prāptam etad brūhi mama prabho ||'
translation_literal: How does knowledge arise? How will liberation come to be? And how is dispassion obtained? Tell me this,
  O Lord.
commentary: 'This verse opens the Aṣṭāvakra Gītā with King Janaka''s direct questions—the perennial inquiry of the sincere
  seeker. He asks three things that appear sequential but point to a single realization.


  The questioner assumes knowledge, liberation, and dispassion are *attainments*—things to be acquired through effort or grace.
  Yet the teaching that follows reveals they are not acquisitions at all, but recognitions of what already is. Jñāna (knowledge)
  is not a new faculty but the collapse of the false knower. Mukti (liberation) is not a future state but the ever-present
  freedom of the witness-Self (sākṣin), which was never bound. Vairāgya (dispassion) is not renunciation of objects but the
  natural falling away of identification when the Self is seen as untouched by experience.


  Janaka''s humility—calling Aṣṭāvakra ''prabho'' (Lord, though the sage is a hunchbacked boy)—signals readiness. He does
  not assume he knows the answer. This openness is itself the gateway. The teaching will show that all three questions collapse
  into one: the recognition that the Self is eternally free, untouched by knowledge or ignorance, action or bondage. The ''how''
  of the question dissolves when it is seen that there is no one to acquire anything and nowhere to go.


  Key Terms


  **jñāna** — Knowledge; direct, non-conceptual recognition of the Self''s nature as ever-free consciousness.

  **mukti** — Liberation; the realization that the Self was never bound, only apparently identified with body and mind.

  **vairāgya** — Dispassion; the natural cessation of identification with objects and experiences when the Self is recognized
  as their unchanging witness.'
insight: 'Extended Translation:

  Janaka said: How is knowledge attained?'
practice: 'Whisper aloud the three questions—''How does knowledge arise? How will liberation come? How is dispassion obtained?''—then
  pause and notice: which one tugs at you as if it''s still missing, still ahead? Hold that tugging sensation in your chest
  without moving toward it, and let it show you the assumption that you are the one who must acquire it.'
