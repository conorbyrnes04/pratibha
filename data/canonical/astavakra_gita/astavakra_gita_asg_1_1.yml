  items:
  - term: jñāna
    definition: knowledge; here the non-dual recognition that is itself liberation, not a stepping-stone toward it
    lemma_id: jnana
  - term: mukti / mokṣa
    definition: liberation, release; the text will argue this cannot be "attained" because the Self is already free
  - term: vairāgya
    definition: dispassion, non-attachment; from *vi* (away) + *rāga* (coloring, passion); the fading of compulsive engagement
      with objects
