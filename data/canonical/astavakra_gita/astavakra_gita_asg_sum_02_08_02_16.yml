- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 2.3
    resonance: 'Both texts identify ignorance as the root cause of suffering and posit a single diagnostic move: Patañjali
      names ignorance (avidyā) as the mūla (root) of afflictions; Astavakra names duality (dvaita) as the mūla of suffering.
      Each locates the problem in a fundamental misperception that generates all downstream affliction.'
    divergence: Patañjali's framework is psychological-ontological (ignorance of the distinction between puruṣa and prakṛti),
      while Astavakra's is non-dual (ignorance of the singular cidrasomalaḥ); Patañjali prescribes an eightfold path, Astavakra
      prescribes recognition alone.
    passage_id: patañjali_yoga_sūtras.ys_2_03
  - citation: Pratyabhijnahrdayam — Sutra 12
    resonance: 'Both texts diagnose suffering as a failure of self-recognition: Astavakra identifies duality as the root of
      suffering and its cure as recognition of oneness; Pratyabhijñā identifies bewilderment by one''s own powers through
      ignorance of authorship as the bondage. Both locate the problem in forgetting or not recognizing what one truly is.'
    divergence: Pratyabhijñā emphasizes the forgetting of one's creative agency (the fivefold act), while Astavakra emphasizes
      the forgetting of non-dual consciousness; Pratyabhijñā is a recognition-of-authorship path, Astavakra is a recognition-of-oneness
      path.
    passage_id: pratyabhijnahrdayam.phr_012
  layer_provenance: generated_grounded
