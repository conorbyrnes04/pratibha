source_excerpt: Key verse — 2.16
translation_literal: 'Light is my own form; I am not separate from that. When the universe shines, I alone am shining.


  Look—this universe is a conceptual overlay, appearing in me through ignorance, like a serpent in rope, water in a mirage,
  a bracelet in gold.


  From me the universe has emerged; into me it will dissolve, like a pot in clay, a wave in water, a bracelet in gold.


  Look—I bow to myself: I am that which has no destruction. Even the annihilation of the world from Brahmā to grass blade
  occurs while I remain.


  Look—I bow to myself: I am one, even embodied. Nowhere do I go, nowhere do I arrive; I pervade the universe and stand still.


  Look—I bow to myself: there is no one here equal to me in skill. Without touching the body, I have held this universe for
  ages.


  Look—I bow to myself: I possess nothing. Or rather, everything that falls within the range of word and mind is mine.


  Knower, knowing, and known—this triad is not real. Where this appears, I am that: consciousness without stain or form.


  Duality is the root of suffering; there is no other cure for it. All this seen is false. I am the one, consciousness without
  stain or form.'
commentary: 'This sequence of eight verses forms the heart of the Aṣṭāvakra Gītā''s radical proclamation of non-dual Self-recognition.
  The teaching moves through a series of recognitions, each beginning with ''aho ahaṃ namo mahyaṃ'' (Look—I bow to myself),
  that systematically dismantle the illusion of separation and doership.


  The opening verses establish the fundamental insight: consciousness (prakāśa) is the intrinsic nature of the Self; it is
  not acquired or added. The universe appears within this consciousness like images in a mirror—real as appearances, yet without
  independent existence. The three classical examples (serpent in rope, water in mirage, bracelet in gold) illustrate how
  a single substance appears as multiplicity through ignorance (ajñāna), not through actual transformation.


  What makes these verses distinctive is their tone of celebration and self-recognition rather than negation. The repeated
  ''aho ahaṃ namo mahyaṃ'' is not self-congratulation but radical acknowledgment: the witness-Self (sākṣin) recognizes itself
  as untouched by the apparent world it observes. This Self has no destruction because it was never born; it sustains all
  manifestation without effort or involvement, like space containing all objects without being affected by them.


  The verse ''jñānaṃ jñeyaṃ tathā jñātā tritayaṃ nāsti vāstavam'' dissolves the subject-object duality at its root. The apparent
  knower, the act of knowing, and the known object are all mental constructs arising in ignorance. When this triad collapses,
  what remains is the non-dual witness—consciousness (cit) without form (nirañjana), without the stain of becoming.


  The final declaration—''duality is the root of suffering; there is no other cure''—points to why this recognition matters
  existentially. Bondage is not a metaphysical problem but an experiential one rooted in the illusion of separation. The only
  medicine is the direct recognition that ''I am that one consciousness,'' untouched by the apparent world, free before any
  practice begins. This is the ever-free (nitya-mukta) Self that the Gītā keeps pointing toward.


  Key Terms


  **prakāśa** — Light, luminosity, consciousness as the self-revealing principle; the intrinsic nature of awareness

  **sākṣin** — The witness; the non-dual consciousness that observes all experience without being affected by it

  **ajñāna** — Ignorance; the apparent veiling of non-dual consciousness that creates the illusion of separation and multiplicity'
insight: ''
practice: Each time you perceive something—a sight, sound, thought, or sensation—pause and whisper 'I alone am shining' while
  feeling the light of awareness illuminating that very perception, as if the object and the knowing of it are both the same
  luminous substance appearing as two. Continue this through your day until the boundary between observer and observed dissolves
  into a single radiance.
sanskrit_devanagari: 'प्रकाशो मे निजं रूपं नातिरिक्तोऽस्म्यहं ततः ।


  यदा प्रकाशते विश्वं तदाहं भास एव हि ॥


  अहो विकल्पितं विश्वमज्ञानान्मयि भासते ।


  रूप्यं शुक्तौ फणी रज्जौ वारि सूर्यकरे यथा ॥


  मत्तो विनिर्गतं विश्वं मय्येव लयमेष्यति ।


  मृदि कुम्भो जले वीचिः कनके कटकं यथा ॥


  अहो अहं नमो मह्यं विनाशो यस्य नास्ति मे ।


  ब्रह्मादिस्तम्बपर्यन्तं जगन्नाशोऽपि तिष्ठतः ॥


  अहो अहं नमो मह्यमेकोऽहं देहवानपि ।


  क्वचिन्न गन्ता नागन्ता व्याप्य विश्वमवस्थितः ॥


  अहो अहं नमो मह्यं दक्षो नास्तीह मत्समः ।


  असंस्पृश्य शरीरेण येन विश्वं चिरं धृतम् ॥


  अहो अहं नमो मह्यं यस्य मे नास्ति किञ्चन ।


  अथवा यस्य मे सर्वं यद् वाङ्मनसगोचरम् ॥


  ज्ञानं ज्ञेयं तथा ज्ञाता त्रितयं नास्ति वास्तवम् ।


  अज्ञानाद् भाति यत्रेदं सोऽहमस्मि निरञ्जनः ॥


  द्वैतमूलमहो दुःखं नान्यत्तस्याऽस्ति भेषजम् ।


  दृश्यमेतन् मृषा सर्वमेकोऽहं चिद्रसोमलः ॥'
sanskrit_iast: 'prakāśo me nijaṃ rūpaṃ nātirikto''smyahaṃ tataḥ |


  yadā prakāśate viśvaṃ tadāhaṃ bhāsa eva hi ||


  aho vikalpitaṃ viśvamajñānānmayi bhāsate |


  rūpyaṃ śuktau phaṇī rajjau vāri sūryakare yathā ||


  matto vinirgataṃ viśvaṃ mayyeva layameṣyati |


  mṛdi kumbho jale vīciḥ kanake kaṭakaṃ yathā ||


  aho ahaṃ namo mahyaṃ vināśo yasya nāsti me |


  brahmādistambaparyantaṃ jagannāśo''pi tiṣṭhataḥ ||


  aho ahaṃ namo mahyameko''haṃ dehavānapi |


  kvacinna gantā nāgantā vyāpya viśvamavasthitaḥ ||


  aho ahaṃ namo mahyaṃ dakṣo nāstīha matsamaḥ |


  asaṃspṛśya śarīreṇa yena viśvaṃ ciraṃ dhṛtam ||


  aho ahaṃ namo mahyaṃ yasya me nāsti kiñcana |


  athavā yasya me sarvaṃ yad vāṅmanasagocaram ||


  jñānaṃ jñeyaṃ tathā jñātā tritayaṃ nāsti vāstavam |


  ajñānād bhāti yatredaṃ so''hamasmi nirañjanaḥ ||


  dvaitamūlamaho duḥkhaṃ nānyattasyā''sti bheṣajam |


  dṛśyametan mṛṣā sarvameko''haṃ cidrasomalaḥ ||'
