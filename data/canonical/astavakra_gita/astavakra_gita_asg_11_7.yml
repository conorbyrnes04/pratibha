title: Nothing Arises in the Witness
unit_type: sutra
sanskrit_devanagari: 'क्व चास्ति क्व च वा नास्ति क्वास्ति चैकं क्व च द्वयम् ।

  बहुनात्र किमुक्तेन किञ्चिन्नोत्तिष्ठते मम ॥'
sanskrit_iast: 'kva cāsti kva ca vā nāsti kvāsti caikaṃ kva ca dvayam |

  bahunātra kim uktena kiñcin nottiṣṭhate mama ||'
translation_literal: Where does it exist, where does it not exist? Where is there one, where is there
  two? Why speak at length about this? Nothing whatsoever arises in me.
commentary: 'This verse cuts through the fundamental confusion that binds the seeker: the habit of dividing
  reality into categories of presence and absence, unity and multiplicity. The speaker—Aṣṭāvakra—is not
  making a philosophical claim about the nature of existence. He is pointing directly to the witness-consciousness
  (sākṣin) that stands prior to all such distinctions.


  The opening questions (kva cāsti... kva ca dvayam) enumerate the conceptual pairs through which the
  mind habitually carves up experience: existence/non-existence, one/many. These are the very scaffolding
  of thought. Yet from the standpoint of the ever-present witness, none of these categories *arise in
  me*—they do not touch the Self.


  The phrase kiñcin nottiṣṭhate mama is the heart: "nothing whatsoever arises in me." Not "I reject these
  distinctions" or "I transcend them through effort." Rather, from the perspective of the Self that Aṣṭāvakra
  embodies and invites Janaka to recognize, no phenomenon—no appearance, no thought, no division—has ever
  truly arisen *as* the Self. The Self is not a container in which things arise and pass; it is the unchanging,
  untouched witness to all arising.


  This is radical freedom: not the freedom to choose or control what arises, but the recognition that
  you are not the one to whom anything arises. You are the space in which all appearance occurs, yet you
  remain unstained by it. The very questions about existence and non-existence, about unity and duality,
  are movements *in* consciousness, not movements *of* consciousness. The Self never moves, never becomes,
  never is bound by the conceptual net.


  For the modern reader caught in the exhaustion of trying to fix the self, this verse offers a simple
  reversal: stop trying to become free. Recognize that nothing has ever truly happened to you. You are
  the witness, untouched and ever-free.


  Key Terms


  **sākṣin** — The witness-consciousness; the unchanging awareness that observes all phenomena without
  being affected by them

  **ātman** — The Self; the non-dual reality that is your true nature, distinct from the body-mind and
  all that arises in it

  **uttiṣṭhate** — Arises, stands up, comes into being; here used to denote any appearance or manifestation'
insight: 'Extended Translation:

  Where is existence, where is non-existence, where is oneness, where is duality?'
practice: 'Throughout your day, the moment you catch yourself asking ''Is this real or not?'' or ''Is
  this one thing or many?''—pause and notice: that question itself is arising, but you are aware of it
  arising. Let your attention drop beneath the question to the simple fact of awareness itself, untouched
  by what it knows. Repeat this noticing each time the mind divides.'
