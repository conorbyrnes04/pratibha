sanskrit_devanagari: 'क्व चास्ति क्व च वा नास्ति क्वास्ति चैकं क्व च द्वयम् ।

  बहुनात्र किमुक्तेन किञ्चिन्नोत्तिष्ठते मम ॥'
sanskrit_iast: 'kva cāsti kva ca vā nāsti kvāsti caikaṃ kva ca dvayam |

  bahunātra kim uktena kiñcin nottiṣṭhate mama ||'
translation_literal: Where is existence, where is non-existence, where is oneness, where is duality?
commentary: 'Extended Translation:

  Where is existence, where is non-existence, where is oneness, where is duality? What more is there to say? Nothing arises
  in me.


  *Kiñcin nottiṣṭhate mama* — nothing arises in me. Not "I have understood that nothing arises." Not "I believe in the groundlessness
  of phenomena." Simply: nothing arises in me. The *I* that was asking Janaka''s questions in Chapter 1 — *how is knowledge
  attained? how does liberation come?* — has been recognized as an appearance. In that recognition, the questions themselves
  cannot arise. Where would they arise from? There is no seeker left to generate them. *Bahunātra kim uktena* — what more
  needs to be said? The text ends in silence. Not the silence of having nothing to say, but the silence of a question that
  has dissolved along with the one who was asking it.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 20: *iti śivam* — the seal-phrase; both texts end in the dissolution of the teaching into the recognition
  it was pointing toward

  - Dào Dé Jīng ch. 1: the Tao that can be named is not the eternal Tao — the text begins where the Dào ends, in the dissolution
  of all conceptual frames

  - Wittgenstein, *Tractatus* 7: "What we cannot speak about we must pass over in silence" — a convergent endpoint from a
  radically different intellectual tradition


  ## Appendix: Structural Notes for the Pratibhā Corpus


  ### The Aṣṭāvakra Gītā and the Pratibhā Dialogue Mode


  The text''s compare-mode potential is exceptionally high. The five most productive cross-tradition dialogues:


  1. **Aṣṭāvakra Gītā 1.7 ↔ Pratyabhijñāhṛdayam 12**: Both texts locate bondage in the same structural error — seeing the
  seer as other. The difference: Kṣemarāja explains the mechanism (saṃskāra, mala, the three structural impurities); Aṣṭāvakra
  simply names the error and asks why you haven''t stopped.


  2. **Aṣṭāvakra Gītā 8.4 ↔ Dào Dé Jīng ch. 48**: *helayā* (with ease) and *wuwei* (non-action) as parallel prescriptions.
  But where the Dào Dé Jīng speaks cosmologically, Aṣṭāvakra speaks personally: *you* specifically, do not grasp and do not
  renounce.


  3. **Aṣṭāvakra Gītā 18.96 ↔ Mūlamadhyamakakārikā 18**: Both texts refuse every binary predication of the realized state.
  The difference: Nāgārjuna argues for the refusal; Aṣṭāvakra simply describes it as the lived condition of the liberated
  one.


  4. **Aṣṭāvakra Gītā 16.1 ↔ Meister Eckhart, Sermon 52**: Both texts argue that even the finest spiritual doctrine must be
  forgotten for genuine peace. Eckhart frames it as detachment from all images; Aṣṭāvakra as *sarvavismaraṇa*. The most productive
  dialogue in the Western-Advaita axis.


  5. **Aṣṭāvakra Gītā 2.16 ↔ Vijñāna Bhairava Tantra**: Both diagnose the root of suffering and prescribe its dissolution
  — but VBT offers 112 specific practices; Aṣṭāvakra offers one recognition. The dialogue between these two is the dialogue
  between *sādhana* (practice path) and *pratyabhijñā* (recognition path).


  ### Translation Note

  The Pratibhā translation prioritizes philosophical precision over literal fidelity. Key departure: *bodha* is consistently
  rendered "consciousness" or "knowing" rather than "wisdom" (the more common choice), to maintain alignment with the Pratyabhijñā
  vocabulary throughout the corpus. *Sukha* in the repeated imperative *sukhī bhava* is rendered "be happy" rather than "be
  blissful" — the text''s point being that happiness is the natural unconstructed state, not a peak experience to achieve.


