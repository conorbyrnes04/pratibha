insight: 'Extended Translation:

  Where is existence, where is non-existence, where is oneness, where is duality?'
practice: 'For one day, experiment with the following: do what arises to be done, without adding "I am doing this" on top.
  Not suppressing action but simply allowing it to occur without the commentary of ownership. Notice: does the quality of
  action change? Does it become easier, lighter, more precise? The dry leaf does not strain. This is the practice of 18.21.


  ### 18.96 — 18.97 *(The Paradoxical State)*'
