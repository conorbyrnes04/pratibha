- kind: translation
  label: Pratibha Translation
  body: One certain that suffering arises from worry and from nothing else — becomes free from worry, and thus remains happy,
    peaceful, and free from desires everywhere.
- kind: commentary
  label: Pratibha Commentary
  body: '*Cintā* — worry, anxious thought, rumination — is named as the sole generator of suffering. Not circumstances, not
    other people, not fate, not karma in the conventional sense. Worry. This is not a claim that nothing difficult happens,
    but that the *suffering* arising from difficult things is generated by the mind''s worried relationship to them, not by
    the things themselves. *Nānyathā* — no other way — is absolute. The one who is certain of this is not suppressing worry
    but has genuinely seen its mechanism and therefore has no compulsion to engage it. *Galitaspṛhā* — desires have dissolved
    (*galita*, "melted away") — is the fruit: not forced renunciation but natural dissolution of the grasping that generated
    the worry.


    **11.6** — Body and Bondage


    *nāhaṃ deho na me deho bodho''hamiti niścayī*

    "One certain that ''I am not the body, the body is not mine, I am pure consciousness'' — lives as if they have attained
    liberation"


    **11.7** — Universal Self


    *ābrahmastambaparyantam ahameveti niścayī*

    "One certain that ''I am everything, from Brahma to the smallest blade of grass'' — remains undifferentiated, pure, peaceful"'
- kind: key_terms
  label: Key Terms
  items:
  - term: niścayī
    definition: one who is certain; not one who hopes or believes but one who *knows with certainty*
  - term: cintā
    definition: worry, anxious thought; from *cint* (to think with agitation); the generating mechanism of suffering
  - term: galitaspṛhā
    definition: one whose desires have melted; *galita* (melted, dissolved naturally) — not forcibly removed but naturally
      released
- kind: resonances
  label: Cross-Tradition Resonances
  items:
