title: Worry Alone Generates All Suffering
unit_type: sutra
sanskrit_devanagari: 'चिन्तया जायते दुःखं नान्यथेहेति निश्चयी ।

  तया हीनः सुखी शान्तः सर्वत्र गलितस्पृहः ॥'
sanskrit_iast: 'cintayā jāyate duḥkhaṃ nānyatheheti niścayī |

  tayā hīnaḥ sukhī śāntaḥ sarvatra galitaspṛhaḥ ||'
translation_literal: Suffering arises from worry alone—there is no other way; this is certain. Free from
  worry, one dwells in happiness and peace, indifferent everywhere, all craving dissolved.
commentary: 'This verse cuts to the heart of Advaita''s radical diagnosis: suffering has no external cause.
  It is generated entirely by the mind''s obsessive turning-over of experience—cintayā, worry or rumination.
  The word niścayī (certain, decisive) signals that this is not opinion but direct observation: the mechanism
  is absolute.


  The second line reveals the immediate consequence: hīnaḥ (free from, lacking) worry, one naturally abides
  in sukha (ease, happiness) and śānti (peace). This is not an achievement but a return to what already
  is. The phrase sarvatra galitaspṛhaḥ—craving melted away everywhere—shows that when worry ceases, the
  grasping that fuels all seeking dissolves too.


  The deeper teaching: you are the sākṣin (witness) to all mental activity, including worry itself. Worry
  is an object appearing in consciousness; it is not what you are. The verse does not ask you to suppress
  worry (that would be another form of doership) but to recognize that your true nature—the Self—is untouched
  by it. When this recognition settles, worry loses its grip not through effort but through clear seeing.


  Key Terms


  **cintayā** — worry, rumination, obsessive mental turning-over; the root cause of suffering according
  to this verse

  **sākṣin** — the witness; the unchanging consciousness that observes all mental and bodily activity
  without being affected by it

  **spṛhā** — craving, desire, grasping; the fuel of bondage, which dissolves when worry ceases'
insight: '*Cintā* — worry, anxious thought, rumination — is named as the sole generator of suffering.'
practice: 'The moment worry begins its familiar loop in your mind, stop mid-thought and ask your body:
  where is this worry living right now? Place your hand on your chest, your belly, or your throat—wherever
  you feel the tightness—and breathe into that place three times while silently observing: this sensation
  is appearing; I am the space in which it appears. Then release your hand and continue moving through
  your day, leaving the worry as an object you have noticed rather than a problem you must solve.'
