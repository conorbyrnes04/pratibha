- kind: practice
  label: Practice (Abhyasa)
  body: 'Take a current worry. Not to dismiss it but to locate it precisely: is it the *situation* that is causing suffering,
    or is it the *worry about the situation*? Notice the distinction. The situation may be real and may require action. The
    worry is a separate event. Can you address the situation without adding the layer of worry? This is 11.5 as a practical
    experiment.


    ## Chapter 15 · *The Ocean and the Waves*'
