title: Rest in Awareness
unit_type: verse
sanskrit_devanagari: 'यदि देहं पृथक् कृत्य चिति विश्राम्य तिष्ठसि ।

  अधुनैव सुखी शान्तो बन्धमुक्तो भविष्यसि ॥ २.१ ॥'
sanskrit_iast: 'yadi dehaṃ pṛthak kṛtya citi viśrāmya tiṣṭhasi |

  adhunaiva sukhī śānto bandhamukto bhaviṣyasi || 2.1 ||'
translation_literal: If, setting the body apart, you stand resting in awareness (citi), you will immediately be happy, peaceful,
  and free from bondage.
commentary: 'The instruction is not to destroy, neglect, or literally leave the body. “Setting the body apart” means discerning
  it as an object known: sensations, posture, age, pleasure, and pain appear to awareness and therefore cannot be the aware
  subject itself. Citi is not a thought about consciousness, nor a state produced by meditation; it is the self-luminous knowing
  in which body and world are present. To “rest” there is to cease lending identity to what changes. The verse’s radical claim
  is adhunaiva—“right now”: liberation is not the eventual reward of bodily purification or accumulated practice. Bondage
  is the error of taking oneself to be a limited embodied person; freedom is the recognition that one is the witness of that
  person. Happiness and peace are named not as acquired experiences but as the natural condition of awareness uncontracted
  by identification.


  Key Terms


  **deha** — body; the embodied object mistakenly taken as the self

  **citi** — pure awareness; self-luminous consciousness

  **viśrāmya** — having rested; ceasing to seek footing in changing objects

  **bandhamukta** — free from bondage; released from limiting identification


  Cross-Tradition Resonances


  **Upaniṣadic witness teaching, especially the distinction between the knower and the known:** Like the Upaniṣads, this verse
  directs attention from changing body-mind phenomena to the knowing principle. Divergence: Aṣṭāvakra states the conclusion
  with unusual immediacy, treating recognition itself as liberation now.

  **Buddhist mindfulness and insight into the body as not-self:** Both invite observation of the body rather than reflexive
  identification with it. Divergence: Classical Buddhism generally refuses an eternal witnessing Self, whereas this Advaita
  verse identifies pure awareness as one’s true nature.

  **Christian apophatic contemplation, such as resting beyond images and discursive thought:** Both point toward a quiet relinquishment
  of finite identifications and conceptual grasping. Divergence: Apophatic Christianity ordinarily preserves a creator-creature
  distinction; Aṣṭāvakra’s non-dualism does not.'
practice: 'For five minutes, notice bodily sensations one by one and silently label each, “known.” Then ask: “What is aware
  of this?” Do not answer conceptually; rest as the bare knowing in which the sensations arise and pass.'
