title: 'Waves and Ocean: The Illusion of Separation'
unit_type: sutra
sanskrit_devanagari: 'विश्वं स्फुरति यत्रेदं तरङ्गा इव सागरे ।


  सोऽहमस्मीति विज्ञाय किं दीन इव धावसि ॥'
sanskrit_iast: 'viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare |


  so''hamasmīti vijñāya kiṃ dīna iva dhāvasi ||'
translation_literal: In that place where this universe arises like waves in the ocean—knowing 'I am that'—why
  do you run about as if afflicted?
commentary: 'This verse presents the foundational Advaitic vision: the cosmos is not separate from the
  Self but appears within it as waves appear within the ocean. The Sanskrit sphurati (arises, shines forth,
  bursts into appearance) suggests not creation ex nihilo but spontaneous manifestation—like waves that
  have no independent substance from water. The comparison is exact: a wave has no separate being from
  the ocean; its apparent individuality is a temporary form of what is fundamentally oceanic.


  The second line shifts from vision to lived recognition: so''ham (I am that) is not intellectual assent
  but direct knowing (vijñāya). The verse then poses a piercing question: if you have truly recognized
  yourself as the ocean-like Self in which all appearance moves, why do you still run about like a dīna
  (afflicted, diminished, suffering being)? This is not scolding but diagnostic. The running—the anxiety,
  the seeking, the sense of lack—persists only when identification remains with the wave-form rather than
  the oceanic ground.


  The teaching points to the ever-free witness (sākṣin) that is untouched by the movements it observes.
  Just as the ocean is unmoved by its waves, the Self is unaffected by the universe''s arising and subsiding.
  Bondage is the illusion of being a separate wave; freedom is the recognition that you are the ocean
  itself—not acquiring something new, but ceasing to believe in your own limitation.


  Key Terms


  **sphurati** — arises, shines forth, bursts into appearance; suggests spontaneous manifestation rather
  than deliberate creation

  **so''ham** — I am that; the recognition of identity between individual consciousness and the infinite
  Self

  **sākṣin** — the witness; the ever-present, unchanging awareness that observes all experience without
  being affected by it'
insight: 'Extended Translation:

  The universe manifests like waves in the ocean.'
practice: Pause mid-stride the next time you feel urgency or worry rising—stop walking, stand still, and
  feel the ground beneath your feet while whispering 'I am that' three times, each time expanding your
  awareness outward as if you are the ocean and this very anxiety is only a wave moving across your surface,
  not separate from you.
