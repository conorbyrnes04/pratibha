sanskrit_devanagari: विश्वं स्फुरति यत्रेदं तरङ्गा इव सागरे
sanskrit_iast: viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare
translation_literal: The universe manifests like waves in the ocean.
commentary: 'Extended Translation:

  The universe manifests like waves in the ocean. Knowing ''I am that'' — why do you run about like a
  miserable person?


  viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare | so''ham asmīti vijñāya kiṃ dīna iva dhāvasi ||

  "The universe manifests like waves in the ocean. Knowing ''I am that'' — why do you run about like a
  miserable person?"'
insight: 'Extended Translation:

  The universe manifests like waves in the ocean.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how
  to apply it today.
