- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Fluttering in the Brahma-Wheel
    resonance: 'Both texts use a spatial metaphor of apparent separation within a unified whole: waves
      in ocean (Astavakra) and the swan-self wandering as separate within the Brahma-wheel (Svetasvatara).
      Each depicts the manifest universe as a play of differentiation that obscures underlying non-duality.'
    divergence: Astavakra emphasizes the illusory nature of manifestation itself (waves as transient forms),
      while Svetasvatara locates the problem in the self's false perception of separation from the Impeller
      (ignorance as misidentification rather than unreality).
    passage_id: svetasvatara_upanishad.svu_006
  - citation: Isavasya Upanishad — Mantra 7
    resonance: 'Both passages move from the metaphysical claim of unity to the soteriological consequence:
      recognizing the wave-like universe as ocean-manifestation dissolves delusion, just as seeing unity
      dissolves sorrow and delusion in Isavasya. The structure is: unity-recognition → cessation of suffering.'
    divergence: Astavakra grounds liberation in direct perception of the universe's illusory form-nature,
      while Isavasya frames it as the experiential result of non-dual vision without specifying the mechanism
      of manifestation.
    passage_id: isavasya_upanishad.isa_013
  - citation: 'Vijnana Bhairava — Yukti #97'
    resonance: 'Both texts derive equanimity and non-attachment from recognizing an underlying sameness
      or plenitude pervading all apparent differences: the ocean-substance identical in all waves parallels
      the Absolute''s total plenitude being the same in all beings, yielding equal-mindedness toward opposites.'
    divergence: Astavakra uses the wave-ocean metaphor to establish the unreality of differentiation itself,
      while Vijnana Bhairava accepts the reality of beings but grounds equanimity in their shared participation
      in the Absolute's fullness.
    passage_id: vijnana_bhairava.yukti_097
