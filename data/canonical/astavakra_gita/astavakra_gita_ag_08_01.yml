title: The Movements of Bondage
unit_type: verse
sanskrit_devanagari: 'तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।

  किञ्चिद् मुञ्चति गृह्णाति किञ्चिद् हृष्यति कुप्यति ॥ ८.१ ॥'
sanskrit_iast: 'tadā bandho yadā cittaṃ kiñcid vāñchati śocati |

  kiñcid muñcati gṛhṇāti kiñcid hṛṣyati kupyati || 8.1 ||'
translation_literal: Bondage (bandha) is then, when the mind (citta) desires something, grieves; abandons something, grasps;
  rejoices at something, or becomes angry.
commentary: 'Aṣṭāvakra locates bondage not in outward circumstance, action, possession, or social role, but in the mind’s
  reflex of taking a position toward an object. Desire projects fulfillment into what is absent; grief resists what is present
  or lost; grasping and rejection divide experience into what must be secured and what must be expelled. Delight and anger,
  too, are not condemned as moral faults but exposed as movements of dependence: the mind is pulled by favorable and unfavorable
  conditions. “Something” (kiñcit) is repeated to stress that any particular object can become the occasion for bondage. The
  teaching is radical because it does not prescribe acquiring better objects or emotions. It points instead to the awareness
  in which all these movements arise. That awareness does not desire, mourn, hold, discard, celebrate, or rage; it is the
  unaltered witness of citta’s changing states.


  Key Terms


  **bandha** — bondage; identification with limiting mental movement

  **citta** — mind-stuff; the changing field of thought, feeling, and preference

  **vāñchati** — desires; seeks fulfillment in an object

  **gṛhṇāti** — grasps; appropriates or clings


  Cross-Tradition Resonances


  **The Second Noble Truth identifies craving (taṇhā) and clinging (upādāna) as conditions of suffering; reactive attraction
  and aversion bind experience.:**  Divergence: Early Buddhism generally denies an eternal witnessing Self, whereas Aṣṭāvakra
  identifies freedom with one’s already-present pure awareness.

  **Epictetus treats disturbance as arising from attachment to externals and from judgments that demand events conform to
  one’s preferences.:**  Divergence: Stoicism cultivates rational assent and ethical agency; Aṣṭāvakra ultimately undercuts
  the identification of oneself even with the deliberating agent.

  **Eckhart’s Gelassenheit, or releasement, calls for detachment from possessive willing and from dependence on created things.:**  Divergence:
  Eckhart frames detachment within a Christian relation between creature and God, while Aṣṭāvakra speaks from non-dual identity
  with awareness itself.'
practice: For five minutes, notice each impulse to get, avoid, keep, celebrate, or resist. Silently name it “movement of mind,”
  then rest as the awareness that notices it without following its demand.
