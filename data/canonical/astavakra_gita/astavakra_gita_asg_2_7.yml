title: Mind's Reactivity Is the Bondage Itself
unit_type: sutra
sanskrit_devanagari: 'तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।

  तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति ॥'
sanskrit_iast: 'tadā bandho yadā cittaṃ kiñcid vāñchati śocati |

  tadā muktir yadā cittaṃ na vāñchati na śocati ||'
translation_literal: Bondage arises when the mind desires something or grieves over something. Liberation
  comes when the mind neither desires nor grieves.
commentary: 'This verse cuts to the heart of Advaita''s radical claim: bondage is not imposed from outside,
  nor is it a cosmic punishment. It is the mind''s own reactivity—its constant reaching toward what it
  wants and recoiling from what it fears. The moment consciousness identifies with these movements of
  desire (vāñchati) and sorrow (śocati), it seems to become bound. The verse does not say bondage is *caused
  by* these movements; it says bondage *is* these movements. They are the same thing.


  Liberation (mukti) is not a distant state to be earned through effort. It is the natural condition of
  the mind when reactivity ceases. Notice: the verse does not say the mind must be destroyed, or that
  desire must be violently suppressed. It simply describes what happens when the mind stops grasping and
  resisting—when it rests in its own nature without the compulsion to want or mourn.


  The deeper implication is that the witness-Self (sākṣin) is already free. It observes all desire and
  grief without being touched by them. The bondage belongs only to the identified mind; the Self that
  watches the mind''s dance has never been bound. When this is seen clearly—when the mind recognizes itself
  as an object being observed rather than the observer—the reactivity loses its grip. Not because it is
  fought, but because it is seen through.


  This verse invites a radical shift: stop trying to fix the mind through discipline or practice. Instead,
  notice the mind''s reactivity as it happens, and recognize that you are the awareness in which it appears.
  That recognition alone is the unraveling of bondage.


  Key Terms


  **bandha (bondage)** — The apparent binding of consciousness through identification with the mind''s
  desires and aversions; not external but the mind''s own reactivity mistaken for the Self

  **mukti (liberation)** — Freedom; the natural state when the mind ceases its compulsive reaching and
  withdrawing, revealing the ever-free witness-Self

  **citta (mind)** — The field of thought, emotion, and mental modification; the instrument through which
  bondage appears to occur, and through whose quieting freedom is recognized'
insight: 'Extended Translation:

  Bondage is when the mind desires, grieves, grasps, releases, rejoices, or is angered.'
practice: The moment a desire or grief arises in you today, pause and whisper aloud the exact words from
  the passage—'neither desires nor grieves'—then notice what happens to that impulse in the silence that
  follows, without trying to change it.
