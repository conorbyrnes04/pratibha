sanskrit_devanagari: 'तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति ।

  तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति ॥'
sanskrit_iast: 'tadā bandho yadā cittaṃ kiñcid vāñchati śocati |

  tadā muktir yadā cittaṃ na vāñchati na śocati ||'
translation_literal: Bondage is when the mind desires, grieves, grasps, releases, rejoices, or is angered.
commentary: 'Extended Translation:

  Bondage is when the mind desires, grieves, grasps, releases, rejoices, or is angered. Liberation is when the mind does none
  of these.


  The most operational definition of bondage and liberation in the text — and deceptively simple. *Tadā* — at that time —
  makes these simultaneous states rather than permanent conditions. Bondage and liberation are not ontological categories
  but descriptions of the mind''s current movement. When the mind''s movement is characterized by *vāñchati* (desiring), *śocati*
  (grieving), *muñcati* (releasing), *gṛhṇāti* (grasping), *hṛṣyati* (rejoicing), *kupyati* (getting angry) — that is bondage.
  When none of these movements are occurring — that is liberation. This does not require enlightenment as a permanent state;
  it requires, moment by moment, the absence of these contractions.


  Cross-Tradition Resonance:

  - Mūlamadhyamakakārikā: Nāgārjuna''s analysis of *duḥkha* as arising from conceptual proliferation (*prapañca*) — different
  analysis, same diagnosis of the root

  - Meister Eckhart: "All suffering comes from love and attachment" — a partial parallel, though Aṣṭāvakra is more structurally
  precise

  - Pratyabhijñāhṛdayam 12: *vyāmohitatā saṃsāritvam* — bewilderment by one''s own powers is the condition of bondage; 2.16
  names the root of that bewilderment as duality


  Key Terms


  **citta** — The mind-heart, whose movements mark bondage or freedom.

  **vāñchati** — Desires or longs for; craving is identified as bondage.

  **śocati** — Grieves or mourns; sorrow is likewise a binding mental movement.

  **muktiḥ** — Liberation, present when the mind neither desires nor grieves.


  Cross-Tradition Resonances


  **Dhammapada 216:** The verse states that grief arises from craving, closely paralleling Aṣṭāvakra’s diagnosis of desire
  and sorrow as bondage. Divergence: The Dhammapada frames the remedy through the cessation of craving within Buddhist dependent
  origination rather than through Aṣṭāvakra’s witnessing Self.

  **Bhagavad Gītā 2.56:** The sthitaprajña is described as undisturbed in sorrow and free from longing, fear, and anger, echoing
  this equanimous definition of freedom. Divergence: The Gītā embeds such steadiness in devotion and disciplined action, whereas
  this verse presents non-desiring directly as liberation.

  **Epictetus, Enchiridion 5:** Epictetus locates distress not in things themselves but in one’s judgments about them, paralleling
  the claim that mental agitation constitutes bondage. Divergence: Stoicism seeks rational correction of judgments and virtuous
  agency, not the radical cessation of desire characteristic of this Advaitic formulation.'
insight: 'Extended Translation:

  Bondage is when the mind desires, grieves, grasps, releases, rejoices, or is angered.'
practice: 'Identify your current most active suffering — whatever carries the most charge. Now look at its structure: is there
  a "me" and something "other" at its heart (a person, a situation, a quality of self)? This duality is *dvaita-mūlam*. The
  practice is not to eliminate the other pole but to notice: both poles appear in the same awareness. That awareness is neither
  of the poles. Rest there.


  ## Chapters 3–7 · *Janaka''s Expanding Recognition*


  > *In these chapters, the dialogue shifts: Aṣṭāvakra poses questions and challenges, and Janaka''s responses demonstrate
  progressive deepening. Rather than the seeker''s "how?" of Chapter 1, Janaka speaks from the sovereign ease of recognized
  freedom.*


  ### Key Verses from Chapters 3–7


  **3.3** — *The Universe as Ocean*

  *viśvaṃ sphurati yatredaṃ taraṅgā iva sāgare | so''ham asmīti vijñāya kiṃ dīna iva dhāvasi ||*

  "The universe manifests like waves in the ocean. Knowing ''I am that'' — why do you run about like a miserable person?"


  **6.1** — *Space and Pot*

  *ākāśavad ananto''haṃ ghaṭavat prākṛtaṃ jagat | iti jñānaṃ tathaitasya na tyāgo na graho layaḥ ||*

  "I am infinite like space; the material world is like a pot in space. Knowing this, there is no renunciation, no acceptance,
  no dissolution."


  **7.3** — *The Formless Infinite*

  *mayy ananta-mahāmbhodhau viśvaṃ nāma vikalpanā | atiśānto nirākāra etadeva aham āsthitaḥ ||*

  "In me, the infinite great ocean, the world is merely imagination. I am utterly peaceful, formless, established in this
  alone."


  **Cross-Tradition note (Chapters 3–7)**: The ocean imagery of Chapters 2–7 directly parallels Plotinus'' *Enneads* II.9
  on the One as the boundless ocean from which all streams proceed. The pot-in-space (*ghaṭa-ākāśa*) analogy of 6.1 recurs
  verbatim in the Māṇḍūkya Upaniṣad''s Kārikā — Aṣṭāvakra likely draws from this shared vocabulary.


  ## Chapter 8 · *Bondage and Liberation Defined*


  ### 8.1 — 8.4'
