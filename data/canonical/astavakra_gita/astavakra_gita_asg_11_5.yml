unit_label: Verse 11.5
title: Worry Alone Generates All Suffering
unit_type: sutra
sanskrit_devanagari: 'चिन्तया जायते दुःखं नान्यथेहेति निश्चयी ।

  तया हीनः सुखी शान्तः सर्वत्र गलितस्पृहः ॥'
sanskrit_iast: 'cintayā jāyate duḥkhaṃ nānyatheheti niścayī |

  tayā hīnaḥ sukhī śāntaḥ sarvatra galitaspṛhaḥ ||'
translation_literal: Suffering arises from worry alone—there is no other cause, the wise know this as certain. Free from worry,
  one is happy and at peace, indifferent everywhere, desire fallen away.
commentary: 'This verse cuts to the root: suffering is not inherent in the world or circumstances, but generated entirely
  by the mind''s anxious preoccupation (cintā). The word niścayī—''the one who knows with certainty''—points to direct recognition,
  not belief. The teaching is radical because it locates bondage not in external events but in a single, reversible mental
  habit: the compulsive spinning of worry.


  The second line reveals the inverse: remove worry, and what remains is happiness (sukhī), peace (śāntaḥ), and what the text
  calls galitaspṛhaḥ—desire that has ''fallen away'' or ''melted.'' This is not suppression but natural release. The phrase
  sarvatra—''everywhere''—signals that this freedom is not conditional on circumstances changing; it is independent of place,
  time, or situation.


  Crucially, this points to the witness-Self (sākṣin) that observes both worry and its absence without being touched by either.
  The Self does not generate suffering; the Self is the ever-free awareness in which worry appears and disappears. When worry
  ceases, what was always present—the untouched, peaceful witness—is recognized. The verse invites a shift from identifying
  with the worried mind to recognizing oneself as the awareness in which worry moves.


  Key Terms


  **cintā** — Worry, anxious preoccupation, mental rumination; the habitual spinning of thought around past and future.

  **sākṣin** — The witness-Self, the aware presence that observes all mental and sensory events without being affected by
  them.

  **galitaspṛhaḥ** — Desire that has fallen away or melted; the natural release of craving when the mind is no longer caught
  in worry.'
insight: '*Cintā* — worry, anxious thought, rumination — is named as the sole generator of suffering.'
practice: 'The moment you notice worry arising—whether about past, future, or present—pause and ask: ''Who is aware that I
  am worrying?'' Hold your attention on that witnessing presence for three breaths, letting the worry continue or dissolve
  without your involvement. Repeat this reversal each time worry catches you today.'
