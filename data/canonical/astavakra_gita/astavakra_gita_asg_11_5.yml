unit_type: sutra
sanskrit_devanagari: 'चिन्तया जायते दुःखं नान्यथेहेति निश्चयी ।

  तया हीनः सुखी शान्तः सर्वत्र गलितस्पृहः ॥'
sanskrit_iast: 'cintayā jāyate duḥkhaṃ nānyatheheti niścayī |

  tayā hīnaḥ sukhī śāntaḥ sarvatra galitaspṛhaḥ ||'
translation_literal: One certain that suffering arises from worry and from nothing else — becomes free from worry, and thus
  remains happy, peaceful, and free from desires everywhere.
commentary: '*Cintā* — worry, anxious thought, rumination — is named as the sole generator of suffering. Not circumstances,
  not other people, not fate, not karma in the conventional sense. Worry. This is not a claim that nothing difficult happens,
  but that the *suffering* arising from difficult things is generated by the mind''s worried relationship to them, not by
  the things themselves. *Nānyathā* — no other way — is absolute. The one who is certain of this is not suppressing worry
  but has genuinely seen its mechanism and therefore has no compulsion to engage it. *Galitaspṛhā* — desires have dissolved
  (*galita*, "melted away") — is the fruit: not forced renunciation but natural dissolution of the grasping that generated
  the worry.'
insight: '*Cintā* — worry, anxious thought, rumination — is named as the sole generator of suffering.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
