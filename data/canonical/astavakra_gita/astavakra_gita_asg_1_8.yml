- kind: translation
  label: Pratibha Translation
  body: Bitten by the great black serpent of egoism in the form of "I am the doer," drink the nectar of the conviction "I
    am not the doer" and be happy.
- kind: commentary
  label: Pratibha Commentary
  body: 'The serpent metaphor is precise: a snakebite is swift, total, and immediately life-threatening. *Ahaṃkāra* — the
    sense of "I am the doer" — works exactly this way: a single structural error that, once lodged, colors the entire field
    of experience with the toxin of doer-ship. The antidote is also total: *nāhaṃ kartā* — I am not the doer. This is not
    a consoling philosophy ("well, ultimately nothing matters"). It is a direct recognition: the Self does not originate action.
    Action arises in the field of *prakṛti* (nature), passes through the instrument of the body-mind, and the witness — the
    *draṣṭā* of 1.7 — simply knows it. The sense of "I am doing this" is the serpent''s venom. *Viśvāsāmṛtam* — the nectar
    of this conviction — must be drunk, not merely tasted intellectually.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ahaṃkāra
    definition: ego, the "I-maker"; from *aham* (I) + *kāra* (maker); the structural sense of being a doer/subject
  - term: mahākṛṣṇāhi
    definition: great black serpent; *kṛṣṇa* (black) + *ahi* (serpent); the image of egoism as lethal venom
  - term: daṃśita
    definition: bitten; the condition of the ordinary person — already bitten, already affected
  - term: viśvāsa
    definition: conviction, trust, certainty; not merely intellectual acceptance but deep structural knowing
  - term: amṛta
    definition: nectar, immortality-essence; *a* (not) + *mṛta* (death); what liberates from the death-cycle
