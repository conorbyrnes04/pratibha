title: The Antidote to Doer-Ship
unit_type: sutra
sanskrit_devanagari: 'अहं कर्तेत्यहंमानमहाकृष्णाहिदंशितः ।

  नाहं कर्तेति विश्वासामृतं पीत्वा सुखं चर ॥'
sanskrit_iast: 'ahaṃ karteti ahaṃmāna-mahākṛṣṇāhi-daṃśitaḥ |

  nāhaṃ karteti viśvāsa-amṛtaṃ pītvā sukhaṃ cara ||'
translation_literal: 'Bitten by the great serpent of ego-sense—''I am the doer''—you suffer. Drink the
  nectar of trust: ''I am not the doer,'' and move through the world at ease.'
commentary: 'This verse cuts to the root of bondage: the conviction that ''I do.'' The image of the serpent''s
  bite is precise—ego-sense (ahaṃmāna) is not merely false belief but actively toxic, injecting venom
  that poisons every action and experience. The ''I am the doer'' stance creates an imaginary agent caught
  in the machinery of cause and effect, responsibility, and consequence. It is the fundamental misidentification
  that makes freedom seem distant.


  The remedy is not intellectual denial but a shift in trust (viśvāsa). ''I am not the doer'' is called
  amṛtam—the deathless nectar—because it dissolves the illusion of personal agency and reveals what has
  always been true: the Self (ātman) is the ever-free witness (sākṣin) of all action. Actions happen in
  the body-mind, but the seer of action stands untouched. This is not passivity or nihilism; it is freedom
  from the false knot of ''I-do-ness.'' When you stop claiming doership, you no longer bind yourself to
  results. Paradoxically, you then act with clarity, without the friction of ego-defense.


  The verse invites a radical reorientation: from ''I am responsible for all outcomes'' to ''I witness
  what unfolds.'' This is not escape from life but liberation within it. The word sukham—ease, happiness—follows
  naturally; it is the natural state when the false doer-sense dissolves and the witness rests in its
  own nature.


  Key Terms


  **ahaṃmāna** — ego-sense, the false conviction ''I am the individual doer''; the root of bondage

  **sākṣin** — witness-consciousness; the ever-free Self that observes all action and experience without
  involvement

  **viśvāsa** — trust, confidence; here, the liberating conviction that rests in the truth of non-doership'
insight: 'The serpent metaphor is precise: a snakebite is swift, total, and immediately life-threatening.'
practice: 'The moment you catch yourself saying or thinking ''I did that'' or ''I made that happen,''
  whisper aloud or internally the counter-current: ''It moved through me.'' Repeat this reversal three
  times, feeling the shift from agent to vessel, until the serpent''s grip loosens and your shoulders
  drop.'
