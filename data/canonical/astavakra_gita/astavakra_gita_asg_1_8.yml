- kind: practice
  label: Practice (Abhyasa)
  body: 'Notice the next action you take — reaching for a cup, turning a page, adjusting your posture. Immediately after:
    was there a "doer" present, or did the action simply occur? Experiment, repeatedly and lightly, with the recognition that
    the body-mind acts and the witness knows. This is *nāhaṃ kartā* in practice, not as belief but as direct observation.'
