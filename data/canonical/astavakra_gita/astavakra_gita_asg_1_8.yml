sanskrit_devanagari: 'अहं कर्तेत्यहंमानमहाकृष्णाहिदंशितः ।

  नाहं कर्तेति विश्वासामृतं पीत्वा सुखं चर ॥'
sanskrit_iast: 'ahaṃ karteti ahaṃmāna-mahākṛṣṇāhi-daṃśitaḥ |

  nāhaṃ karteti viśvāsa-amṛtaṃ pītvā sukhaṃ cara ||'
translation_literal: Bitten by the great black serpent of egoism in the form of "I am the doer," drink the nectar of the conviction
  "I am not the doer" and be happy.
commentary: 'The serpent metaphor is precise: a snakebite is swift, total, and immediately life-threatening. *Ahaṃkāra* —
  the sense of "I am the doer" — works exactly this way: a single structural error that, once lodged, colors the entire field
  of experience with the toxin of doer-ship. The antidote is also total: *nāhaṃ kartā* — I am not the doer. This is not a
  consoling philosophy ("well, ultimately nothing matters"). It is a direct recognition: the Self does not originate action.
  Action arises in the field of *prakṛti* (nature), passes through the instrument of the body-mind, and the witness — the
  *draṣṭā* of 1.7 — simply knows it. The sense of "I am doing this" is the serpent''s venom. *Viśvāsāmṛtam* — the nectar of
  this conviction — must be drunk, not merely tasted intellectually.'
insight: 'The serpent metaphor is precise: a snakebite is swift, total, and immediately life-threatening.'
practice: 'Notice the next action you take — reaching for a cup, turning a page, adjusting your posture. Immediately after:
  was there a "doer" present, or did the action simply occur? Experiment, repeatedly and lightly, with the recognition that
  the body-mind acts and the witness knows. This is *nāhaṃ kartā* in practice, not as belief but as direct observation.'
