- kind: key_terms
  label: Key Terms
  items:
  - term: ahaṃkāra
    definition: ego, the "I-maker"; from *aham* (I) + *kāra* (maker); the structural sense of being a doer/subject
  - term: mahākṛṣṇāhi
    definition: great black serpent; *kṛṣṇa* (black) + *ahi* (serpent); the image of egoism as lethal venom
  - term: daṃśita
    definition: bitten; the condition of the ordinary person — already bitten, already affected
  - term: viśvāsa
    definition: conviction, trust, certainty; not merely intellectual acceptance but deep structural knowing
  - term: amṛta
    definition: nectar, immortality-essence; *a* (not) + *mṛta* (death); what liberates from the death-cycle
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā III.27
    resonance: '"All actions are performed by the guṇas of nature; the one whose mind is deluded by ego thinks ''I am the
      doer''" — the same recognition, with Arjuna as the recipient'
    divergence: ''
    passage_id: ''
  - citation: Epictetus
    resonance: '"Men are disturbed not by events but by their opinions about events" — a partial parallel; the Gītā goes deeper:
      not just opinions but the very sense of being the agent'
    divergence: ''
    passage_id: ''
  - citation: Śiva Sūtra III.1
    resonance: '*cittam ātmā* — the individual self is Śiva contracted into the sense of doership; liberation is the recognition
