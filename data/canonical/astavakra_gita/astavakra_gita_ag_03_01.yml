unit_label: The Taste for Acquisition
title: The Taste for Acquisition
unit_type: verse
sanskrit_devanagari: 'अविनाशिनम् आत्मानम् एकं विज्ञाय तत्त्वतः

  तवात्म-ज्ञस्य धीरस्य कथम् अर्थार्जने रतिः'
sanskrit_iast: 'avināśinam ātmānam ekaṃ vijñāya tattvataḥ

  tavātma-jñasya dhīrasya katham arthārjane ratiḥ'
translation_literal: Knowing in truth the Self (ātman) to be one and imperishable (avināśin), how can
  there be delight (rati) in acquiring wealth or objects (artha) for one steadfast in Self-knowledge?
commentary: 'Aṣṭāvakra addresses not ordinary practical activity but the inward motive of acquisition.
  Once the ātman is directly known as eka, the single reality, and avināśin, incapable of loss or destruction,
  the usual project of securing oneself through possessions loses its premise. Artha here can mean wealth,
  advantage, object, or aim: whatever is sought as though it could complete or protect the seeker. The
  question is deliberately sharp: how could rati, an invested relish or attraction, remain? It does not
  require that the knower own nothing, earn nothing, or refuse to act. Rather, action no longer arises
  from felt insufficiency. The Self is not an object among acquired objects; it is the awareness in which
  gaining, losing, desire, and satisfaction appear. Steadfastness in knowledge therefore means freedom
  from dependence on outcomes, not indifference or negligence in worldly affairs.


  Key Terms


  **avināśin** — imperishable; not subject to destruction or loss

  **ātman** — the Self: pure awareness, not the body-mind person

  **artha** — wealth, object, advantage, or pursued end

  **rati** — relish, attraction, invested delight


  Cross-Tradition Resonances


  **The sthitaprajña is described as one who abandons desires arising in the mind and is content in the
  Self alone (2.55).:**  Divergence: The Bhagavad Gītā embeds this freedom within disciplined action and
  devotion; Aṣṭāvakra states the non-dual conclusion more abruptly.

  **Early Buddhist teaching identifies craving for sensory gain and becoming as a root of dukkha; release
  entails non-clinging.:**  Divergence: Buddhism generally denies an eternal Self, whereas this verse
  grounds non-attachment in knowledge of an imperishable ātman.

  **Stoic ethics treats wealth and external success as not constitutive of the good; freedom lies in not
  staking oneself on externals.:**  Divergence: Stoicism locates freedom in rational virtue and assent,
  not in realization of a single non-dual awareness.'
practice: 'Before pursuing or purchasing something today, pause for three breaths and ask: “What do I
  believe this will add to me?” Then notice the awareness already present before the answer, and act only
  after recognizing that no acquisition can alter it.'
