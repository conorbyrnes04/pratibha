unit_type: verse
sanskrit_devanagari: 'न मे बन्धो न मोक्षो मे न मे शोक न वा हरिः ।

  अहम् आत्मा सदा शुद्धो विद्वान् एतत् समीक्षते ॥ १८.८० ॥'
sanskrit_iast: 'na me bandho na mokṣo me na me śoka na vā hariḥ |

  aham ātmā sadā śuddho vidvān etat samīkṣate || 18.80 ||'
translation_literal: There is no bondage for me, no liberation for me, no sorrow for me—nor any Lord. I am the Self, eternally
  pure. The wise one sees this directly.
commentary: 'This verse crystallizes the radical non-dual realization: the apparent seeker dissolves into recognition of what
  always already is. ''Bandha'' (bondage) and ''mokṣa'' (liberation) are conceptual overlays on the unchanging witness-consciousness.
  The negations—na me bandho, na mokṣo—are not nihilistic but liberatory: they dismantle the false subject who could be bound
  or freed. ''Aham ātmā sadā śuddho'' asserts the ever-present, intrinsic purity of consciousness itself, untouched by the
  flux of becoming. The phrase ''vidvān etat samīkṣate'' (the wise one sees this) points to direct recognition, not intellectual
  understanding. This is the culmination of Aṣṭāvakra''s teaching: not attainment but the collapse of the illusion of a separate
  attainer.


  Cross-Tradition Resonances


  **Brahma Sūtra commentary: mokṣa is not attainment but recognition of ever-present Brahman; bondage is ignorance, not ontological
  fact.:**  Divergence: Śaṅkara emphasizes the role of śravaṇa-manana-nididhyāsana (study-reflection-meditation); Aṣṭāvakra
  points to spontaneous recognition beyond method.

  **The gateless gate; ''originally there is nothing to attain.'' Bondage and liberation are both dream-constructs.:**  Divergence:
  Zen retains the language of practice and sudden awakening; Aṣṭāvakra dissolves even the framework of awakening.

  **Consciousness (Śiva) is eternally free, the witness of all manifestation; bondage is māyā, not real.:**  Divergence: Abhinavagupta
  integrates cosmic play (līlā) and aesthetic experience; Aṣṭāvakra''s non-dual vision is more austere, emphasizing pure witnessing.'
practice: 'Sit quietly. Notice the arising and passing of thoughts, sensations, emotions. Ask: ''Who observes this?'' Do not
  answer conceptually. Rest as the unchanging awareness in which all experience appears and disappears. Repeat silently: ''I
  am not bound, not free—I am the eternal witness.'' Not as affirmation, but as recognition. Return to this recognition whenever
  the sense of being a separate doer re-emerges.'
