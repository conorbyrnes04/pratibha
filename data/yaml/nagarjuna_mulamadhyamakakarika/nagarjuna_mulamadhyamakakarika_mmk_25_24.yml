sutra_id: MMK_25_24
collection: Nagarjuna Mulamadhyamakakarika
section: teaching_passage
title: The Stilling of All Grasping Is Peace
anchor_translation: ''
sanskrit: 'sarvopalambhopaśamaḥ prapañcopaśamaḥ śivaḥ / na kva cit kasyacit kaścid
  dharmo buddhena deśitaḥ //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 25.24, closing verse.)*'
transliteration: sarva-upalambha-upaśamaḥ (the pacification of all apprehending/grasping)
  prapañca-upaśamaḥ (the pacification of proliferation) śivaḥ (auspicious, blessed,
  peace); na kva cit (nowhere) kasyacit (to anyone) kaścit dharmaḥ (any dharma) buddhena
  deśitaḥ (was taught by the Buddha).
translation: The stilling of all grasping [upalambha], the stilling of proliferation
  [prapañca]—this is peace [śiva]. Nowhere, to no one, was any dharma ever taught
  by the Buddha.
commentary: 'The treatise ends where practice ends: not in a final thesis but in the
  quieting of the thesis-making mind. Two things are stilled—*upalambha*, the act
  of apprehending or seizing an object, and *prapañca*, the proliferation that spins
  objects into a solid world—and their cessation is named *śiva*: peace, blessedness,
  the auspicious. Nāgārjuna deliberately closes with a word that in the wider culture
  names the divine, but here it names simply the rest that remains when grasping stops.
  Then comes the astonishing last line, which folds the entire book back on itself:
  "nowhere, to no one, was any dharma ever taught by the Buddha." Having used four
  hundred verses of argument, Nāgārjuna denies that any fixed teaching was ever transmitted—because
  every teaching is empty, conventional, a raft, an *upādāya prajñapti*. To take even
  Madhyamaka as a doctrine to hold would be to reinstate the grasping the whole text
  works to still. This is the ultimate anti-dogmatic gesture: the medicine dissolves
  itself so no residue can become a new sickness. For the retreatant it is the perfect
  resting place: after all the analysis, nothing is left to grip—not the self, not
  emptiness, not the teaching, not even "no teaching." What remains is *śiva*, the
  peace of an unclutching mind.


  Key Terms:


  **upalambha (उपलम्भ)** — Etymology: from *upa-√labh* (to get, apprehend): "apprehension,
  grasping-at an object as real." Its total pacification—not the end of perception,
  but the end of seizing—is peace.

  **upaśama (उपशम)** — Etymology: *upa-√śam* (to become quiet, be extinguished): "calming,
  stilling, pacification." The operative verb of the closing: liberation as a settling-down,
  not an achievement.

  **śiva (शिव)** — Etymology: "auspicious, benign, blessed" (also the divine name).
  Nāgārjuna repurposes it for the bare peace of stilled grasping—blessedness without
  a metaphysical blesser.

  **prapañca (प्रपञ्च)** — Etymology: as in 18.5, "proliferation." The book opens
  (dedication) and closes on its stilling, framing the whole as a therapy for the
  conceptualizing mind.


  Cross-Tradition Resonances:


  **Vijñāna Bhairava / Śaiva "stilling" verses & Patañjali''s nirodha:** liberation
  as the settling of mental movement rather than the gaining of a new object.

  *Divergence:* those traditions rest in a positive fullness (Śiva-consciousness,
  kaivalya of puruṣa); Nāgārjuna rests in empty peace with no substrate affirmed.

  **Zhuangzi, "fasting of the mind" / "sitting in forgetfulness":** the mind that
  has emptied its grasping is at ease; and the sage''s teaching finally points away
  from itself.

  *Divergence:* Zhuangzi''s ease flows from harmony with the Dao; Nāgārjuna''s follows
  from the emptiness of Dao and teacher alike.

  **Wittgenstein (philosophy as therapy: "the real discovery is the one that lets
  me stop doing philosophy"):** the aim of analysis is to bring the compulsive analyzing
  to rest.

  *Divergence:* Wittgenstein dissolves conceptual confusions to return to ordinary
  life; Nāgārjuna dissolves them toward soteriological peace and release from rebirth.'
abhyasa: 'At the close of a sitting, deliberately let go of even your practice: no
  technique, no goal, no "emptiness" to contemplate, no teaching to hold. For two
  minutes simply allow whatever arises to arise and pass without seizing it. If the
  mind reaches for something to grasp—even the idea of not-grasping—let that go too,
  and rest in the quiet that remains.'
source: Nāgārjuna, *Mūlamadhyamakakārikā* 25.24 (MMK_25_24; GRETIL Sanskrit / Pratibha
