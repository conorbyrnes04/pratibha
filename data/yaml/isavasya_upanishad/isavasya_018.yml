sutra_id: ISA_018
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 12
sanskrit: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥'
transliteration: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||'
translation: Those devoted only to the unmanifest enter darkness; those devoted only
  to the manifest enter deeper darkness.
commentary: 'Another anti-reduction teaching: both poles must be understood.


  Key Terms:


  **asambhuti/sambhuti** - unmanifest/manifest becoming.


  Cross-Tradition Resonances:


  Source-expression non-duality.'
