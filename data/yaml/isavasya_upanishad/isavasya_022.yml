title: Mantra 16
sanskrit: 'पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥'
transliteration: 'pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi || 16 ||'
translation: O Sun, gather your rays; let me behold your most auspicious form - that Purusha there, I am He.
commentary: 'The mantra culminates in identity-recognition, not ego inflation.


  Key Terms:


  **so''ham asmi** - He am I.


  Cross-Tradition Resonances:


  Mahavakya-style realization formulas.'
