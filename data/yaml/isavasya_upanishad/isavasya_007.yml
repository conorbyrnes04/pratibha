resonances:
- citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
  resonance: 'Both texts make the same structural move: they reframe renunciation not as external withdrawal but as a shift in consciousness about possession and agency. The Isavasya joins ontology to ethics (all pervaded = possessiveness is false), while the Gita joins ethics to action (relinquish possessiveness within engagement).'
  divergence: The Isavasya grounds renunciation in metaphysical pervasion (the Divine saturates all), while the Gita grounds it in the ethics of non-attachment within duty (karma yoga), emphasizing action without ego-claim rather than ontological unity.
  passage_id: bhagavad_gita.bg_05_01_03
- citation: Astavakra Gita — Key Verses from Chapters 3–7
  resonance: 'Both texts use a cosmological image to collapse the distinction between the individual and the totality, then draw an ethical consequence: if the universe manifests as waves in ocean (or pervaded by the Lord), the separate self''s grasping is revealed as illusory.'
  divergence: The Isavasya emphasizes pervasion by a transcendent Lord (theistic frame), while the Astavakra uses the wave-ocean metaphor to dissolve any ontological distinction between self and cosmos (non-dualist frame without personified divinity).
  passage_id: astavakra_gita.asg_sum_key_verses_from_chapters_3_7
- citation: Patañjali Yoga Sūtras 2.39
  resonance: Both texts propose that a shift in consciousness—renunciation of greed in Patañjali, recognition of pervasion in Isavasya—produces immediate epistemic clarity about one's fundamental condition (illumination of birth's cause, or recognition of the Divine's presence).
  divergence: Patañjali's non-greed operates within a causal framework of karmic conditioning and guṇa-transformation, while Isavasya's pervasion is a direct ontological statement requiring no causal mechanism, only recognition.
  passage_id: patañjali_yoga_sūtras.ys_2_39
