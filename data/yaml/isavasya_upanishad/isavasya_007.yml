sutra_id: ISA_007
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 1
sanskrit: 'ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।

  तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥ १ ॥'
transliteration: 'isavasyam idam sarvam yat kinca jagatyam jagat |

  tena tyaktena bhunjitha ma grdah kasya svid dhanam || 1 ||'
translation: All this world is pervaded by the Lord. Enjoy through renunciation; do
  not covet another's wealth.
commentary: 'The opening move joins ontology and ethics: if all is pervaded by the
  Divine, possessiveness is a distortion of reality.


  Key Terms:


  **isavasyam** - pervaded by the Lord; **tyaktena** - by relinquishment.


  Cross-Tradition Resonances:


  Bhagavad Gita karma-yoga non-attachment.'
voice_of_siva: ''
abhyasa: Do one task today without internally claiming ownership of its result.
