title: Mantra 8
sanskrit: 'स पर्यगाच्छुक्रमकायमव्रणमस्नाविरं शुद्धमपापविद्धम् ।

  कविर्मनीषी परिभूः स्वयंभूर्याथातथ्यतोऽर्थान्व्यदधाच्छाश्वतीभ्यः समाभ्यः ॥ ८ ॥'
transliteration: 'sa paryagac chukram akayam avranam asnaviram suddham apapa-viddham |

  kavir manisi paribhuh svayambhur yathatathyato''rthan vyadadhac chasvatibhyah samabhyah || 8 ||'
translation: All-pervading, pure, bodiless, untouched by evil - wise, transcendent, self-existent, ordering all rightly.
commentary: 'The Self is not merely interior witness but cosmically ordering intelligence.


  Key Terms:


  **svayambhu** - self-existent; **paribhuh** - transcendent.


  Cross-Tradition Resonances:


  Ishvara descriptions in later Vedanta.'
