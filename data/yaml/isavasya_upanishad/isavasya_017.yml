sutra_id: ISA_017
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 11
sanskrit: 'विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
transliteration: 'vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation: Knowing both together, one crosses death through avidya and attains immortality
  through vidya.
commentary: 'Integration, not exclusion, is the teaching climax of this triad.


  Key Terms:


  **ubhayam saha** - both together.


  Cross-Tradition Resonances:


  Karma-jnana synthesis debates.'
