sutra_id: ISA_012
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 6
sanskrit: 'यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति ।

  सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥ ६ ॥'
transliteration: 'yas tu sarvani bhutany atmany evanupasyati |

  sarvabhutesu catmanam tato na vijugupsate || 6 ||'
translation: Who sees all beings in the Self and the Self in all beings does not shrink
  in hatred.
commentary: 'Realization has an ethical signature: non-hatred.


  Key Terms:


  **anupasyati** - sustained seeing.


  Cross-Tradition Resonances:


  Advaitic compassion logic.'
voice_of_siva: ''
abhyasa: 'When aversion arises, ask: what shared being am I refusing to see?'
