title: Mantra 14
sanskrit: 'सम्भूतिं च विनाशं च यस्तद्वेदोभयं सह ।

  विनाशेन मृत्युं तीर्त्वा सम्भूत्यामृतमश्नुते ॥ १४ ॥'
transliteration: 'sambhutim ca vinasam ca yas tad vedobhayam saha |

  vinasena mrtyum tirtva sambhutyamrtam asnute || 14 ||'
translation: Knowing becoming and dissolution together, one crosses mortality and realizes immortality.
commentary: 'Seeing impermanence clearly becomes doorway to the deathless.


  Key Terms:


  **vinasa** - dissolution/impermanence.


  Cross-Tradition Resonances:


  Impermanence insight as liberative threshold.'
