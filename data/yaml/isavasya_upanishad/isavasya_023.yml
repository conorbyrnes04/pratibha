sutra_id: ISA_023
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 17
sanskrit: 'वायुरनिलममृतमथेदं भस्मान्तं शरीरम् ।

  ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥ १७ ॥'
transliteration: 'vayur anilam amrtam atha idam bhasmantam sariram |

  om krato smara krtam smara krato smara krtam smara || 17 ||'
translation: May breath return to the immortal air; this body to ashes. O mind, remember
  what has been done.
commentary: 'At death, discernment and memory become sacred accountability.


  Key Terms:


  **krato smara** - O mind/intention, remember.


  Cross-Tradition Resonances:


  Death-awareness practices.'
