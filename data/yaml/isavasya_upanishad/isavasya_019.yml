title: Mantra 13
sanskrit: 'अन्यदेवाहुः सम्भवादन्यदाहुरसम्भवात् ।

  इति शुश्रुम धीराणां ये नस्तद्विचचक्षिरे ॥ १३ ॥'
transliteration: 'anyad evahuh sambhavad anyad ahur asambhavat |

  iti susruma dhiranam ye nas tad vicacaksire || 13 ||'
translation: Different results arise from attending to manifest and unmanifest, as
  taught by the wise.
commentary: 'The verse emphasizes transmission clarity: distinctions are not optional.


  Key Terms:


  **sambhava/asambhava** - becoming/unbecoming.


  Cross-Tradition Resonances:


  Graduated means in traditional teaching.'
