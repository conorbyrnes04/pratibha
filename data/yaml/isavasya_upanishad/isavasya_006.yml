sutra_id: ISA_006
collection: Isavasya Upanishad
section: teaching_passage
title: Golden Lid and Final Prayers
sanskrit: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥


  पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥


  अग्ने नय सुपथा राये अस्मान् विश्वानि देव वयुनानि विद्वान् ।

  युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥ १८ ॥'
transliteration: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||


  pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi
  || 16 ||


  agne naya supatha raye asman visvani deva vayunani vidvan |

  yuyodhy asmaj juhuranam eno bhuyistham te nama uktim vidhema || 18 ||'
translation: 'The face of truth is covered by a golden lid - O Sun, remove it for
  the one devoted to truth.


  Gather your rays; let me behold your most auspicious form. That Person there - I
  am He.


  O Fire, lead us by the good path, remove crooked sin from us; to you we offer reverent
  words.'
commentary: 'The text closes with prayer, not abstraction. Philosophical insight matures
  as surrender, remembrance, and guidance at the threshold of death. "So''ham asmi"
  is not ego-assertion but identity with the deepest Person beyond individuality.


  Key Terms:


  **hiranmayena patrena** - golden vessel/lid veiling truth.


  **so''ham asmi** - "He am I," identity in realization.


  Cross-Tradition Resonances:


  **Mundaka luminosity verses:** outer light as veil and pointer.'
voice_of_siva: ''
abhyasa: 'At night, close practice with: "Lead me by the good path." Recall one crooked
  tendency and one corrective action for tomorrow.'
