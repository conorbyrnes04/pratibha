title: Mantra 7
sanskrit: 'यस्मिन्सर्वाणि भूतान्यात्मैवाभूद्विजानतः ।

  तत्र को मोहः कः शोक एकत्वमनुपश्यतः ॥ ७ ॥'
transliteration: 'yasmin sarvani bhutany atmaivabhud vijanatah |

  tatra ko mohah kah soka ekatvam anupasyatah || 7 ||'
translation: For one who sees unity, what delusion and what sorrow remain?
commentary: 'Delusion and grief are tied to fragmentation of identity.


  Key Terms:


  **ekatva** - oneness; **moha/soka** - delusion/grief.


  Cross-Tradition Resonances:


  Brihadaranyaka non-dual result.'
