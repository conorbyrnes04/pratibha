sutra_id: ISA_011
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 5
sanskrit: 'तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।

  तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५ ॥'
transliteration: 'tad ejati tan naijati tad dure tad v antike |

  tad antar asya sarvasya tadu sarvasyasya bahyatah || 5 ||'
translation: It moves and does not move; far and near; within all and outside all.
commentary: 'The verse integrates transcendence and immanence without splitting reality
  into two substances.


  Key Terms:


  **antar/bahya** - inner/outer non-separation.


  Cross-Tradition Resonances:


  Non-dual paradox language across Upanishads.'
voice_of_siva: ''
abhyasa: In one interaction, hold both inward stillness and outward responsiveness.
