sutra_id: ISA_009
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 3
sanskrit: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
transliteration: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation: Sunless worlds covered in darkness are reached by those who "kill" the
  Self.
commentary: 'Self-destruction here means radical misidentification with the non-self,
  not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.'
voice_of_siva: ''
abhyasa: Notice one habit today that repeatedly obscures your deeper clarity.
