sutra_id: ISA_010
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 4
sanskrit: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥'
transliteration: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||'
translation: Unmoving and one, yet swifter than mind; senses cannot overtake It.
commentary: 'The Self cannot be reduced to object-speed categories; paradox breaks
  conceptual fixation.


  Key Terms:


  **anejat** - unmoving; **javiyah** - swifter.


  Cross-Tradition Resonances:


  Kena''s non-objectifiable knower.'
