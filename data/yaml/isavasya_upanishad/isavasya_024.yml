title: Mantra 18
sanskrit: 'अग्ने नय सुपथा राये अस्मान् विश्वानि देव वयुनानि विद्वान् ।

  युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥ १८ ॥'
transliteration: 'agne naya supatha raye asman visvani deva vayunani vidvan |

  yuyodhy asmaj juhuranam eno bhuyistham te nama uktim vidhema || 18 ||'
translation: O Fire, lead us by the good path, knowing all our ways; remove crooked sin from us. We offer reverence.
commentary: 'The text ends as ethical prayer: guidance, purification, humility.


  Key Terms:


  **supatha** - good path; **yuyodhi** - remove, ward off.


  Cross-Tradition Resonances:


  Purificatory closing prayers across Vedic liturgy.'
