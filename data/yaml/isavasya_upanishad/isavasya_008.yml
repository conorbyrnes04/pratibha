sutra_id: ISA_008
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 2
sanskrit: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
transliteration: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation: Living fully through action, one may wish to live a hundred years; only
  this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.'
voice_of_siva: ''
abhyasa: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
