- citation: 'Vijnana Bhairava — Yukti #95'
  resonance: 'Both texts invert conventional understanding: Vijnana Bhairava declares that what ordinary minds call ''purity'' is actually impurity in Śiva''s teaching, while Isavasya warns that even luminous appearances (seemingly pure) can veil the Real. Surface-level perception misleads.'
  divergence: Vijnana Bhairava critiques conceptual categories themselves as inverted, while Isavasya critiques sensory/phenomenal brightness specifically—one targets thought-structures, the other targets luminous phenomena.
