sutra_id: ISA_021
collection: Isavasya Upanishad
section: teaching_passage
title: Mantra 15
sanskrit: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
transliteration: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation: The face of Truth is covered by a golden lid; O Sun, remove it for the
  seer devoted to truth.
commentary: 'Even luminous appearances can veil the Real; prayer asks for penetrative
  seeing.


  Key Terms:


  **hiranmayena patrena** - golden covering.


  Cross-Tradition Resonances:


  Luminous veil motifs in mystical traditions.'
voice_of_siva: ''
abhyasa: 'Ask: what pleasant appearance in my life is also a concealment?'
