sutra_id: ISA_001
collection: Isavasya Upanishad
section: teaching_passage
title: Fullness and the Non-Diminishing Whole
sanskrit: 'ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते ।

  पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥'
transliteration: 'om purnam adah purnam idam purnat purnam udacyate |

  purnasya purnam adaya purnam eva avasisyate ||'
translation: 'That is fullness; this is fullness. From fullness, fullness appears.

  When fullness is taken from fullness, fullness alone remains.'
commentary: 'The invocation establishes the metaphysical grammar for the entire text:
  reality is not a scarce container but an inexhaustible whole. Manifestation does
  not reduce source. This dissolves possessiveness before verse one begins.


  Key Terms:


  **purnam (पूर्णम्)** - fullness, completeness, non-lack.


  Cross-Tradition Resonances:


  **Neoplatonic procession:** emergence without depletion.'
voice_of_siva: ''
abhyasa: Repeat this invocation once before study and notice one place where your
  mind is operating from lack.
