title: Mantra 9
sanskrit: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥'
transliteration: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||'
translation: Those devoted only to avidya enter darkness; those devoted only to vidya enter deeper darkness.
commentary: 'Exclusive one-sidedness - worldly or spiritual - binds.


  Key Terms:


  **avidya/vidya** - empirical/ultimate knowing modes.


  Cross-Tradition Resonances:


  Middle-way anti-extremism.'
