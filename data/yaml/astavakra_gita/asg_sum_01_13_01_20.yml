translation: '(Summary: Aṣṭāvakra continues the declaration through six more verses, elaborating the unchanging Self (kūṭastha), the body-identification as the noose (pāśa), the bondage of even seeking...'
commentary: '(Summary: Aṣṭāvakra continues the declaration through six more verses, elaborating the unchanging Self (kūṭastha), the body-identification as the noose (pāśa), the bondage of even seeking samādhi, the universe as strung in the Self like beads on a string, and the pot-in-space analogy. Each ends with the same imperative: be happy, be free, right now.)


  Full verses available in the philological appendix.'
