sutra_id: ASG_11_6
collection: Astavakra Gita
section: verse
title: The Threefold Certainty That Liberates While Living
sanskrit: 'नाहं देहो न मे देहो बोधोऽहमिति निश्चयी।
  कस्यापि ननु लोकेऽस्मिन् जीवन्मुक्तो न दृश्यते॥'
transliteration: 'nāhaṃ deho na me deho bodho''ham iti niścayī |
  kasyāpi nanu loke''smin jīvanmukto na dṛśyate ||'
translation: One certain that "I am not the body, the body is not mine, I am pure consciousness" — lives as if already liberated; though who, in this world, is ever seen as liberated while living?
commentary: 'Certitude (*niścayī*) is the operative word — not belief, not aspiration, but settled recognition. The verse
  stacks three negations that dismantle the primary bondage-structure: *nāhaṃ dehaḥ* (I am not the body), *na me dehaḥ* (the
  body is not mine), *bodho''ham* (I am pure knowing). Each negation targets a different layer of identification. The first
  removes ontological confusion; the second removes possessive attachment; the third affirms what remains when both fall away.
  What remains is not a thing but *bodha* — luminous knowing itself, prior to the subject-object split.

  The second half of the verse is Aṣṭāvakra''s characteristic irony: such a one *lives as if liberated* (*jīvanmukta*),
  yet "who is ever seen as liberated while living?" The world cannot recognize liberation because it looks for signs in behavior,
  appearance, or social role — while the liberated one has simply stopped performing bondage. This is not anti-social withdrawal
  but the collapse of the inner drama that makes bondage visible.

  Cross-Tradition Resonances:

  - Pratyabhijñāhṛdayam 12: bondage is seeing the seer as other; here the threefold formula reverses that error at the level
  of body-ownership.

  - Epictetus, Enchiridion §1: distinguish what is yours from what is not — parallel division, but Aṣṭāvakra goes further:
  even the body is not "yours" in the way appropriation assumes.

  - Tantrasāra, opening verse: the heart as seat where stillness and movement meet; *bodha''ham* names the still knowing
  in which bodily movement appears without being owned.'
voice_of_siva: ''
abhyasa: When bodily identification arises — fatigue, pain, aging — hold the threefold formula silently. Not I. Not mine.
  I am knowing. Notice whether the formula dissolves the grip of identification or merely adds another thought on top. The
  test is in the quality of contact with sensation, not in the words.
