sutra_id: ASG_1_12
collection: Astavakra Gita
section: verse
title: Verse 1.12
sanskrit: 'आत्मा साक्षी विभुः पूर्ण एको मुक्तश्चिदक्रियः ।

  असङ्गो निःस्पृहः शान्तो भ्रमात्संसारवानिव ॥'
transliteration: 'ātmā sākṣī vibhuḥ pūrṇa eko muktaś cid akriyaḥ |

  asaṅgo niḥspṛhaḥ śānto bhrāmāt saṃsāravān iva ||'
translation: The Self is witness, all-pervading, full, one, free, consciousness, and
  inactive.
commentary: 'Extended Translation:

  The Self is witness, all-pervading, full, one, free, consciousness, and inactive.
  Unattached, desireless, peaceful — yet through delusion, it appears as though caught
  in the cycle of existence.


  A compressed catechism of the Self''s nature in seven qualities, followed by the
  diagnostic qualifier: *bhrāmāt* — through delusion — it *appears* (*iva*) as though
  caught. *Iva* — "as if," "as though" — is the crucial term. The Self does not actually
  enter *saṃsāra*; it cannot, being *vibhu* (all-pervading) and *pūrṇa* (full, lacking
  nothing). What enters saṃsāra is *bhrāma* — the delusion itself, which has no independent
  ontological status. The appearance of bondage is real as appearance; the bondage
  itself is not real. This distinction — between the *reality of the appearance* and
  the *appearance of reality* — is the heart of Advaita epistemology and the precise
  difference between Aṣṭāvakra and a naive idealism that denies experience.


  Cross-Tradition Resonance:

  - Spanda Kārikā I.1: the Self as *spanda* — vibrating, active — but Aṣṭāvakra says
  *akriya*. The tension between these two is productive: Pratyabhijñā emphasizes the
  Self''s dynamic self-expression; Advaita emphasizes its absolute stillness

  - Plotinus *Enneads* VI.9: the One is beyond all activity; existence proceeds from
  it without the One acting

  - Dào Dé Jīng ch. 37: *wuwei* — non-action; the Tao does nothing yet nothing is
  left undone; *akriya* as natural ground of all action'
voice_of_siva: ''
abhyasa: 'Bring to mind something you are currently "caught" in — a worry, a relationship
  tension, a craving. Now notice the awareness in which this "catching" is appearing.
  Is the awareness itself caught? Can the witness be wounded? The witness is *asaṅga*
  — uncontaminated. Knowing this does not dissolve the tension; it relocates you in
  relation to it.


  ### 1.13 — 1.20

  *(Summary: Aṣṭāvakra continues the declaration through six more verses, elaborating
  the unchanging Self (kūṭastha), the body-identification as the noose (pāśa), the
  bondage of even seeking samādhi, the universe as strung in the Self like beads on
  a string, and the pot-in-space analogy. Each ends with the same imperative: be happy,
  be free, right now.)*


  *Full verses available in the philological appendix.*


  ## Chapter 2 · *Janaka''s Recognition*

  ### The Student Becomes the Knower


  > *What is extraordinary about Chapter 2 is that Janaka does not say "I understand."
  He says "I am." The dialogue has crossed a threshold. For the remainder of the text,
  Janaka speaks not as seeker but as one who recognizes — and Aṣṭāvakra''s subsequent
  chapters become confirmation, elaboration, and protection of what Janaka has seen.*'
