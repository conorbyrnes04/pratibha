sutra_id: ASG_1_10
collection: Astavakra Gita
section: verse
title: Verse 1.10
sanskrit: 'यत्र विश्वमिदं भाति कल्पितं रज्जुसर्पवत् ।

  आनन्दपरमानन्दः स बोधस्त्वं सुखं भव ॥'
transliteration: 'yatra viśvam idaṃ bhāti kalpitaṃ rajju-sarpavat |

  ānanda-paramānandaḥ sa bodhas tvaṃ sukhaṃ bhava ||'
translation: Where this universe appears like an imagined rope-snake — there lies
  bliss, supreme bliss.
commentary: 'Extended Translation:

  Where this universe appears like an imagined rope-snake — there lies bliss, supreme
  bliss. You are that knowing. Be happy.


  The *rajju-sarpa* (rope-snake) is the most famous illustration in Advaita philosophy:
  seeing a coiled rope in dim light and mistaking it for a snake. When the light comes
  and the rope is seen clearly, the snake does not "disappear" — it was never there.
  The world, similarly, does not disappear in liberation — it is recognized as what
  it always was: the one Consciousness appearing as multiplicity. *Yatra* — "where"
  — points not to a location but to the ground of recognition itself. That ground
  is *ānanda* — bliss — and specifically *paramānanda*, supreme bliss. Not the bliss
  of pleasant experience, which is a mental event, but the intrinsic fullness of consciousness
  knowing itself. *Sa bodhaḥ tvaṃ* — that knowing is you.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 2: *svabhittau viśvam unmīlayati* — Consciousness unfolds
  the universe on its own canvas; the canvas is *ānanda*, the painting is the *viśva*

  - Vijñāna Bhairava Tantra Dhāraṇā 49: the practice of recognizing the universe as
  arising within the field of awareness, like a reflection in a mirror

  - Plotinus, *Enneads* I.6: the soul''s encounter with Beauty — not an object encountered
  but a recognition of what the soul itself is'
voice_of_siva: ''
abhyasa: 'Look at any object in your environment. Now ask: what is the object *appearing
  in*? What is the field or space in which this object is arising? Rest in that field
  — the awareness within which the object is a guest. The object remains. Your relationship
  to it shifts from "thing encountered" to "appearance within." Notice what quality
  of ease or bliss is latent in that shift.'
