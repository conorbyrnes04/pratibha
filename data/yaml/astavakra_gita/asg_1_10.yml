glossary:
- term: rajju-sarpa
  definition: rope-snake; the paradigmatic Advaita illustration of *vivartavāda* (the
    doctrine of apparent transformation)
- term: kalpita
  definition: imagined, superimposed; from *kḷp* (to arrange, to imagine); the universe
    as the mind's superimposition on Consciousness
- term: bhāti
  definition: appears, shines; from *bhā* (to shine); the universe as appearance within
    the light of awareness
- term: paramānanda
  definition: supreme bliss; the intrinsic fullness of Consciousness, prior to and
    independent of all pleasant experience
- term: bodha
  definition: knowing, pure consciousness; here as the locus of bliss, not merely
    the instrument of knowledge
