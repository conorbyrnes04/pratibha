translation: I am infinite like space; the material world is like a pot in space.
commentary: 'Extended Translation:

  I am infinite like space; the material world is like a pot in space. Knowing this,
  there is no renunciation, no acceptance, no dissolution.


  ākāśavad ananto''haṃ ghaṭavat prākṛtaṃ jagat | iti jñānaṃ tathaitasya na tyāgo na
  graho layaḥ ||

  "I am infinite like space; the material world is like a pot in space. Knowing this,
  there is no renunciation, no acceptance, no dissolution."'
