glossary:
- term: dvaita
  definition: duality, two-ness; the fundamental structure that generates suffering
- term: mūla
  definition: root; *dvaita* as the root-cause, not a symptom
- term: bheṣaja
  definition: medicine, cure; from *bhiṣaj* (healer); the recognition of oneness as
    the sole cure
- term: mṛṣā
  definition: false, unreal, illusory; the world-appearance as ontologically secondary
- term: cidrasa
  definition: the essence of consciousness; *cit* (consciousness) + *rasa* (juice,
    essence, flavor)
