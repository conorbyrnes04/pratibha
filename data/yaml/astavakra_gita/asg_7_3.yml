glossary:
- term: helā
  definition: ease, play, lightness; from *hel* (to sport, to play); liberation as
    the natural ease of the uncontracted Self
- term: māgṛhāṇa
  definition: do not grasp; the double imperative; the *mā* (not) + imperative construction
    marks urgency
- term: vimuñca mā
  definition: do not release/renounce; grasping and releasing are two movements of
    the same contracted mind
