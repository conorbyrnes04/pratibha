sutra_id: ASG_7_3
collection: Astavakra Gita
section: verse
title: Verse 7.3
sanskrit: 'यदा नाहं तदा मोक्षो यदाहं बन्धनं तदा ।

  मत्वेति हेलया किञ्चिन्मा गृहाण विमुञ्च मा ॥'
transliteration: 'yadā nāhaṃ tadā mokṣo yadāhaṃ bandhanaṃ tadā |

  matveti helayā kiñcin mā gṛhāṇa vimuñca mā ||'
translation: When there is no "I," there is liberation.
commentary: 'Extended Translation:

  When there is no "I," there is liberation. When there is "I," there is bondage.
  Knowing this, with ease, neither grasp anything nor renounce anything.


  The most direct statement of the *ahaṃkāra* doctrine. When the ego-structure (*ahaṃ*
  as contraction) is operational, bondage is the result — not as punishment but as
  structural consequence. When that contraction releases, liberation is the natural
  condition of what remains. *Helayā* — with ease, with lightness — is crucial: the
  prescription is not a grim spiritual discipline but a relaxation. And the final
  line — neither grasp nor renounce — is the text''s most radical practical instruction.
  If you grasp, you reinforce the ego that grasps. If you renounce, you reinforce
  the ego that renounces. *Māgṛhāṇa vimuñca mā* — do neither. Let be. This is *wu
  wei* in Sanskrit.


  Cross-Tradition Resonance:

  - Dào Dé Jīng ch. 48: *wuwei er wu buwei* — non-action and yet nothing is left undone;
  8.4 is the Advaita equivalent

  - Śiva Sūtra I.12: *vismayo yogabhūmikāḥ* — wonder is the ground of yoga; liberation
  as ease and wonder rather than achievement

  - Zhuāngzǐ, Cook Ding: the perfect cook who works through the natural joints without
  effort — *helā* in embodied practice'
voice_of_siva: ''
abhyasa: 'Today, notice every moment you grasp — and every moment you force renunciation.
  Both are movements of the contracting mind. The practice is: before grasping or
  renouncing, pause. Notice the awareness that is present before either movement.
  You cannot stay there by grasping it or by renouncing the impulse. You can only
  recognize it. This recognition, repeated, is *helā*.


  ## Chapter 11 · *The Certainty Verses*


  > *Chapter 11 is the text''s most concentrated sequence of liberating declarations,
  each structured as "one who is certain that X is thus free from Y." They function
  as a set of mirrors held up to different aspects of the contracted self.*


  ### 11.1 — 11.8 *(Selected)*


  **11.1**: One certain that the changes of existence are simply the nature of things
  — *remains unchanging, free from suffering*'
