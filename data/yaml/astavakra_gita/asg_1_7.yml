glossary:
- term: ekah draṣṭā
  definition: the one witness; not one among many but the singular witness in whom
    all multiplicity appears
- term: muktaprāya
  definition: almost free, nearly liberated; *prāya* (nearly, substantially) — an
    unusual and honest acknowledgment that most seekers are close
- term: bandha
  definition: 'bondage; the text locates it with radical precision: one error, not
    a complex accumulation'
- term: draṣṭāraṃ paśyasi itaram
  definition: you see the seer as other; the reflexive error of objectifying the subject
themes:
- witness
- liberation
