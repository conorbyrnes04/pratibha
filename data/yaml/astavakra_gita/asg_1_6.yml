sutra_id: ASG_1_6
collection: Astavakra Gita
section: verse
title: Verse 1.6
sanskrit: 'धर्माधर्मौ सुखं दुःखं मानसानि न ते विभो ।

  न कर्तासि न भोक्तासि मुक्त एवासि सर्वदा ॥'
transliteration: 'dharmādharmau sukhaṃ duḥkhaṃ mānasāni na te vibho |

  na kartāsi na bhoktāsi mukta evāsi sarvadā ||'
translation: Righteousness and unrighteousness, pleasure and pain — these belong to
  the mind, not to you, O All-pervading One.
commentary: 'Extended Translation:

  Righteousness and unrighteousness, pleasure and pain — these belong to the mind,
  not to you, O All-pervading One. You are neither doer nor enjoyer. You are ever
  free.


  The verse dismantles the two deepest structures of self-construction: moral identity
  (*dharma/adharma* — I am righteous or sinful) and experiential identity (*sukha/duḥkha*
  — I am happy or suffering). Both are *mānasāni* — properties of the mind, not of
  the Self. The implications are staggering: not that ethics is irrelevant, but that
  the Self is not constituted by its moral record. Similarly, experience happens —
  pleasure and pain arise — but they happen *to* the mind, not *to* the witness. *Mukta
  evāsi sarvadā* — you are ever free, always. Not will-be-free, not were-free-before-identification
  — *sarvadā*, always. This is the text''s central declaration.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 9: the *saṁsārī* is covered by *mala* — the structural sense
  of being a doer; liberation is the recognition that this sense of doership never
  belonged to the Self

  - Epictetus on *prohairesis*: what is "up to us" vs. what is not — but here the
  reversal is more radical: even what seems most "up to us" (our moral choices) is
  assigned to mind, not Self

  - Śiva Sūtra II.6: *śakticakrasandhanāt* — the yogi who recognizes the source is
  no longer merely a *bhoktā* but the ground from which experience arises'
voice_of_siva: ''
abhyasa: 'Identify something you have been calling "my suffering" or "my joy." Notice
  the possessive. Now ask: who owns this? The mind claims it. But who witnesses the
  mind''s claiming? That witness — the *sākṣin* — is not suffering, not joyful. It
  is simply aware. Rest in the awareness that witnesses the emotion, rather than in
  the emotion itself.'
