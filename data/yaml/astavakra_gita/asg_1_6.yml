glossary:
- term: dharma/adharma
  definition: righteousness/unrighteousness; the moral poles of action; here assigned
    to mind, not Self
- term: mānasāni
  definition: of the mind, mental; from *manas* (mind); the crucial assignment — these
    are mental events, not Self-events
- term: kartā
  definition: doer, agent; the sense of being the originator of action
- term: bhoktā
  definition: enjoyer, experiencer; the sense of being the one who receives experience
- term: mukta
  definition: free, liberated; *mukta evāsi* — you *are* free, not you *will be* free
themes:
- witness
- liberation
