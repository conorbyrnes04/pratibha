resonances:
- citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
  resonance: Both texts locate renunciation not in withdrawal from the world but in a shift of inner stance toward it. Astavakra's recognition 'I am the ocean, not the waves' parallels the Gita's teaching that renunciation is relinquishing possessiveness *within* action—a cognitive reorientation that leaves the world intact while dissolving the agent's claim to it.
  divergence: The Gita emphasizes duty and action as the field of renunciation, while Astavakra treats recognition of non-difference as itself the completion of renunciation, making action secondary or illusory.
  passage_id: bhagavad_gita.bg_md_005
- citation: Tao Te Ching — The Paradox of Simplicity
  resonance: Both teach that renunciation operates through negation of a false stance—Astavakra negates identification with the waves (the manifest multiplicity), while the Tao Te Ching negates 'sageness and wisdom' (constructed knowledge and ambition). Each sees the renounced state as a return to undifferentiated simplicity.
  divergence: Astavakra grounds this negation in metaphysical non-duality (the wave is never separate from the ocean), whereas the Tao Te Ching emphasizes ethical and social benefit ('better for the people') as the fruit of simplicity.
  passage_id: tao_te_ching.ttc_md_029
