resonances:
- citation: Epictetus Works — Disturbance Has Only One Author
  resonance: Both texts locate suffering's origin in a mental operation (worry/judgment) rather than in external circumstances, and both propose that recognizing this causal mechanism directly dissolves the suffering. Epictetus and Astavakra both make the mind's interpretive act—not the thing itself—the sole generator of disturbance.
  divergence: Epictetus grounds this in rational judgment (dogmata) correctable through Stoic logic; Astavakra grounds it in renunciation of worry itself as a path to non-dual peace, without requiring rational reframing.
  passage_id: epictetus_works.epi_enc_002
- citation: Patañjali Yoga Sūtras 1.5
  resonance: Both texts identify mental transformations (vṛtti, vikāra) as the primary locus of suffering and non-suffering, making the quality of mind's movements—not external fate—the determinant of experience. Each offers a taxonomy of mental states as the key to liberation.
  divergence: Patañjali's Yoga Sūtras systematize mental transformations as a technical ladder to kaivalya through practice; Astavakra presents the recognition of worry as sole cause as an immediate insight requiring no graduated method.
  passage_id: patañjali_yoga_sūtras.ys_1_05
- citation: Nagarjuna Mulamadhyamakakarika — Dependent Arising Is Emptiness Is the Middle Way
  resonance: 'Both texts perform a radical reduction: Nagarjuna reduces all phenomena to dependent arising (and thus emptiness); Astavakra reduces all suffering to a single cause (worry). Each collapses apparent multiplicity into a single generative principle, making that principle''s recognition liberating.'
  divergence: Nagarjuna's reduction is ontological and logical (emptiness of intrinsic nature); Astavakra's is psychological and phenomenological (worry as the sole mental generator), operating in different registers of analysis.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_18
