commentary: 'Key verse — 2.16


  Devanāgarī

  द्वैतमूलमहो दुःखं नान्यत्तस्याऽस्ति भेषजम् ।

  दृश्यमेतन् मृषा सर्वमेकोऽहं चिद्रसोमलः ॥


  IAST

  dvaita-mūlam aho duḥkhaṃ nānyat tasyā''sti bheṣajam |

  dṛśyam etan mṛṣā sarvam eko''haṃ cidrasomalaḥ ||


  Pratibhā Translation

  Oh — duality is the root of all suffering, and there is no cure for it but the recognition
  of oneness. All that is seen is false; I alone am the pure essence of consciousness.


  Pratibhā Commentary

  Dvaita-mūlam duḥkham — the root of suffering is duality. Not desire, not karma,
  not ignorance in the abstract, but specifically the structural experience of two-ness:
  self and other, subject and object, I and world. This is the most precise diagnosis
  in the entire text. The "cure" (bheṣajam) is singular: non-dual recognition. Nothing
  else cures it. Not practices, not merit, not grace from outside — only the direct
  recognition of the one in whom the apparent two appear. Cidrasa — the essence/juice
  (rasa) of consciousness — is an image of consciousness as the intrinsic flavor of
  all experience. All experiences are, in their essence, this one flavor. Amala —
  pure, stainless — returns the recognition of 2.1.


  Key Terms

  dvaita — duality, two-ness; the fundamental structure that generates suffering

  mūla — root; dvaita as the root-cause, not a symptom

  bheṣaja — medicine, cure; from bhiṣaj (healer); the recognition of oneness as the
  sole cure

  mṛṣā — false, unreal, illusory; the world-appearance as ontologically secondary

  cidrasa — the essence of consciousness; cit (consciousness) + rasa (juice, essence,
  flavor)


  Cross-Tradition Resonance

  Mūlamadhyamakakārikā: Nāgārjuna''s analysis of duḥkha as arising from conceptual
  proliferation (prapañca) — different analysis, same diagnosis of the root

  Meister Eckhart: "All suffering comes from love and attachment" — a partial parallel,
  though Aṣṭāvakra is more structurally precise

  Pratyabhijñāhṛdayam 12: vyāmohitatā saṃsāritvam — bewilderment by one''s own powers
  is the condition of bondage; 2.16 names the root of that bewilderment as duality


  Practice (Abhyāsa)

  Identify your current most active suffering — whatever carries the most charge.
  Now look at its structure: is there a "me" and something "other" at its heart (a
  person, a situation, a quality of self)? This duality is dvaita-mūlam. The practice
  is not to eliminate the other pole but to notice: both poles appear in the same
  awareness. That awareness is neither of the poles. Rest there.


  > In these chapters, the dialogue shifts: Aṣṭāvakra poses questions and challenges,
  and Janaka''s responses demonstrate progressive deepening. Rather than the seeker''s
  "how?" of Chapter 1, Janaka speaks from the sovereign ease of recognized freedom.'
