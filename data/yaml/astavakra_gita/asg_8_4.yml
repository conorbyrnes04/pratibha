glossary:
- term: niścayī
  definition: one who is certain; not one who hopes or believes but one who *knows
    with certainty*
- term: cintā
  definition: worry, anxious thought; from *cint* (to think with agitation); the generating
    mechanism of suffering
- term: galitaspṛhā
  definition: one whose desires have melted; *galita* (melted, dissolved naturally)
    — not forcibly removed but naturally released
