sutra_id: ASG_1_11
collection: Astavakra Gita
section: verse
title: Verse 1.11
sanskrit: 'मुक्ताभिमानी मुक्तो हि बद्धो बद्धाभिमान्यपि ।

  किंवदन्तीह सत्येयं या मतिः सा गतिर्भवेत् ॥'
transliteration: 'muktābhimānī mukto hi baddho baddhābhimāny api |

  kiṃvadantīha satyeyaṃ yā matiḥ sā gatir bhavet ||'
translation: The one who thinks themselves free is indeed free; the one who thinks
  themselves bound is indeed bound.
commentary: 'Extended Translation:

  The one who thinks themselves free is indeed free; the one who thinks themselves
  bound is indeed bound. This is the truth in the world — as is one''s conviction,
  so is one''s condition.


  This verse is sometimes misread as a simple assertion of positive thinking. It is
  actually a profound statement about the ontological primacy of self-identification.
  *Abhimāna* — what one takes oneself to be, the self-concept — is not merely psychological;
  it is constitutive of the experiential field. The one who has genuinely recognized
  themselves as the free Self (*mukta-abhimānī*) is not performing liberation — they
  are liberated, because liberation was never anything other than the recognition
  of what was always the case. Conversely, the one who is structurally convinced of
  bondage (*baddha-abhimānī*) recreates bondage in every moment, even if they intellectually
  "know" they are free. *Yā matiḥ sā gatiḥ* — as the deep conviction (*mati*), so
  the trajectory (*gati*). This is not a law of attraction; it is a statement about
  the creative power of fundamental self-identification.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 11: *muktābhimāna* as the recognition of one''s nature as
  Śiva — not an achievement but a seeing

  - A Course in Miracles: "The mind''s power is absolute" — a Western parallel to
  the creative primacy of *abhimāna*

  - William James, *The Varieties of Religious Experience*: the "will to believe"
  as a constitutive force in experience — a functional parallel from the psychology
  of religion'
voice_of_siva: ''
abhyasa: For five minutes, hold — not as performance but as genuine inquiry — the
  self-identification "I am the free witness." Notice what resists this, what agrees
  with it, and what simply cannot be placed in either camp. The resistance is *baddha-abhimāna*
  at work. The agreement is the Self recognizing itself. What cannot be placed is
  closest to the truth.
