glossary:
- term: viśuddha-bodha
  definition: pure consciousness; *viśuddha* (pure, utterly clean, without admixture)
    + *bodha* (knowing, consciousness)
- term: niścaya
  definition: certainty, conviction; from *ni* (down, fully) + *caya* (to settle);
    a settling-down into truth
- term: vahni
  definition: fire; from *vah* (to carry); fire as that which carries away, consumes,
    purifies
- term: ajñāna-gahanam
  definition: the dense forest of ignorance; *gahanam* (dense, impenetrable thicket);
    the image of ignorance as an ecology, not a simple error
themes:
- liberation
