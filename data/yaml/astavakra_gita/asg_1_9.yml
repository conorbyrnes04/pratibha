sutra_id: ASG_1_9
collection: Astavakra Gita
section: verse
title: Verse 1.9
sanskrit: 'एको विशुद्धबोधोऽहमिति निश्चयवह्निना ।

  प्रज्वाल्याज्ञानगहनं वीतशोकः सुखी भव ॥'
transliteration: 'eko viśuddha-bodho''ham iti niścaya-vahninā |

  prajvālya ajñāna-gahanaṃ vītaśokaḥ sukhī bhava ||'
translation: With the fire of the certainty "I am the one, pure consciousness," burn
  down the dense forest of ignorance and be free from sorrow.
commentary: 'Extended Translation:

  With the fire of the certainty "I am the one, pure consciousness," burn down the
  dense forest of ignorance and be free from sorrow. Be happy.


  *Niścaya* — certainty — is not belief. It is not provisional acceptance. It is the
  fire (*vahni*) that burns without remainder. The forest of ignorance (*ajñāna-gahanam*)
  is dense precisely because it is not a collection of false beliefs that can be corrected
  one by one — it is a structural orientation, a taken-for-granted relationship to
  experience. Fire does not argue with a forest; it burns it. The certainty that "I
  am one, pure consciousness" (*eko viśuddha-bodhaḥ*) operates similarly: it does
  not negotiate with the ego''s claims but simply illuminates the ground in which
  those claims arise. Note the sequence: *niścaya* first, then burning, then freedom
  from sorrow (*vītaśokaḥ*), then happiness — not the other way around. Happiness
  is downstream of recognition, not its cause.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam 14: *citivahni* — the Fire of Consciousness that, even when
  covered, continues to burn; here Aṣṭāvakra asks us to recognize and stoke that fire
  deliberately

  - Heraclitus Fragment 30: the ever-living fire as the *logos* of the cosmos — consciousness-as-fire
  is an ancient Indo-European resonance

  - Gospel of Thomas 10: "I have cast fire upon the world, and see, I am guarding
  it until it blazes" — the same fire of recognition, different cosmological frame'
voice_of_siva: ''
abhyasa: 'Repeat internally, very slowly: "I am one pure consciousness." Not as affirmation
  in the pop-psychology sense, but as an experiment in *niścaya*. Let it settle rather
  than be asserted. Notice where it meets resistance (the mind''s counter-claims)
  and where it simply rings true. The ringing-true is the fire beginning.'
