sutra_id: ASG_1_5
collection: Astavakra Gita
section: verse
title: Verse 1.5
sanskrit: 'न त्वं विप्रादिको वर्णो नाश्रमी नाक्षगोचरः ।

  असङ्गोऽसि निराकारो विश्वसाक्षी सुखी भव ॥'
transliteration: 'na tvaṃ viprādiko varṇo nāśramī nākṣagocaraḥ |

  asaṅgo''si nirākāro viśvasākṣī sukhī bhava ||'
translation: You are no caste, no stage of life, nothing perceivable by the senses.
commentary: 'Extended Translation:

  You are no caste, no stage of life, nothing perceivable by the senses. You are unattached,
  formless, the witness of the universe. Be happy.


  A socially radical verse embedded in a metaphysical one. The *varṇa* system — the
  hierarchical social classification of Brahmin, Kṣatriya, Vaiśya, Śūdra — is explicitly
  named and negated. You are not your social identity. You are not your stage of life
  (*āśrama*). You are not anything perceivable through the senses (*akṣagocaraḥ* —
  beyond the reach of the senses). Then the positive declarations: *asaṅga* (unattached,
  uncontaminated by contact), *nirākāra* (formless), *viśvasākṣī* (witness of the
  entire universe). The verse ends with *sukhī bhava* — be happy — an imperative addressed
  not to the seeker but to the one who has recognized what it is. Happiness is not
  the reward for correct practice. It is the natural state of the uncontracted Self.


  Cross-Tradition Resonance:

  - Gospel of Thomas 77: "I am the light that is over all things. I am all" — the
  same universal witness consciousness named from a different tradition

  - Spanda Kārikā I.1: the Self as the vibrating ground of the entire cosmos, neither
  inside nor outside any category

  - Zhuāngzǐ ch. 2: *qiwulun* (equalizing all things) — all social, conceptual, and
  perceptual categories are equalized in the ground of awareness'
voice_of_siva: ''
abhyasa: 'For one minute, drop every identity label you carry — profession, nationality,
  spiritual tradition, relational role. Not with effort but as an experiment: what
  remains when none of these labels apply? Note the quality of that remainder. Is
  it smaller without the labels, or larger?'
