title: 2.2 — 2.7 (Ocean and Wave series)
sanskrit: ''
transliteration: ''
translation: Chapters 2.2–2.7 develop the ocean-wave metaphor through a series of parallel
  declarations, each arriving at the same recognition from a slightly different angle.
commentary: 'Chapters 2.2–2.7 develop the ocean-wave metaphor through a series of parallel
  declarations, each arriving at the same recognition from a slightly different angle.
  Janaka speaks in a sustained first-person voice of recognition, using the great analogies:


  2.2: Just as I illuminate this body, I illuminate the entire world — the Self as
  universal light

  2.3: Having set aside body and world, I now perceive the supreme Self — the shift
  of identification

  2.4: Just as waves, foam, and bubbles are not separate from water, so the world
  is not separate from the Self — the non-separation of world and ground

  2.5: Just as cloth is nothing but threads upon reflection, so the world is nothing
  but the Self — the substance-attribute relationship reversed

  2.6: Just as sugar is pervaded throughout by the cane-juice, so I pervade the world
  uninterruptedly — the Self as substrate of all'
