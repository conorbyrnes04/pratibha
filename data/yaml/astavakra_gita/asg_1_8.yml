sutra_id: ASG_1_8
collection: Astavakra Gita
section: verse
title: Verse 1.8
sanskrit: 'अहं कर्तेत्यहंमानमहाकृष्णाहिदंशितः ।

  नाहं कर्तेति विश्वासामृतं पीत्वा सुखं चर ॥'
transliteration: 'ahaṃ karteti ahaṃmāna-mahākṛṣṇāhi-daṃśitaḥ |

  nāhaṃ karteti viśvāsa-amṛtaṃ pītvā sukhaṃ cara ||'
translation: Bitten by the great black serpent of egoism in the form of "I am the
  doer," drink the nectar of the conviction "I am not the doer" and be happy.
commentary: 'The serpent metaphor is precise: a snakebite is swift, total, and immediately
  life-threatening. *Ahaṃkāra* — the sense of "I am the doer" — works exactly this
  way: a single structural error that, once lodged, colors the entire field of experience
  with the toxin of doer-ship. The antidote is also total: *nāhaṃ kartā* — I am not
  the doer. This is not a consoling philosophy ("well, ultimately nothing matters").
  It is a direct recognition: the Self does not originate action. Action arises in
  the field of *prakṛti* (nature), passes through the instrument of the body-mind,
  and the witness — the *draṣṭā* of 1.7 — simply knows it. The sense of "I am doing
  this" is the serpent''s venom. *Viśvāsāmṛtam* — the nectar of this conviction —
  must be drunk, not merely tasted intellectually.


  Cross-Tradition Resonance:

  - Bhagavad Gītā III.27: "All actions are performed by the guṇas of nature; the one
  whose mind is deluded by ego thinks ''I am the doer''" — the same recognition, with
  Arjuna as the recipient

  - Epictetus: "Men are disturbed not by events but by their opinions about events"
  — a partial parallel; the Gītā goes deeper: not just opinions but the very sense
  of being the agent

  - Śiva Sūtra III.1: *cittam ātmā* — the individual self is Śiva contracted into
  the sense of doership; liberation is the recognition of the contraction'
voice_of_siva: ''
abhyasa: 'Notice the next action you take — reaching for a cup, turning a page, adjusting
  your posture. Immediately after: was there a "doer" present, or did the action simply
  occur? Experiment, repeatedly and lightly, with the recognition that the body-mind
  acts and the witness knows. This is *nāhaṃ kartā* in practice, not as belief but
  as direct observation.'
