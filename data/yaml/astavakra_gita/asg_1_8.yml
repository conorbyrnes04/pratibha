glossary:
- term: ahaṃkāra
  definition: ego, the "I-maker"; from *aham* (I) + *kāra* (maker); the structural
    sense of being a doer/subject
- term: mahākṛṣṇāhi
  definition: great black serpent; *kṛṣṇa* (black) + *ahi* (serpent); the image of
    egoism as lethal venom
- term: daṃśita
  definition: bitten; the condition of the ordinary person — already bitten, already
    affected
- term: viśvāsa
  definition: conviction, trust, certainty; not merely intellectual acceptance but
    deep structural knowing
- term: amṛta
  definition: nectar, immortality-essence; *a* (not) + *mṛta* (death); what liberates
    from the death-cycle
themes:
- witness
- liberation
- practice
