sutra_id: ASG_1_1
collection: Astavakra Gita
section: verse
title: Verse 1.1
sanskrit: 'कथं ज्ञानमवाप्नोति कथं मुक्तिर्भविष्यति ।

  वैराग्यं च कथं प्राप्तमेतद् ब्रूहि मम प्रभो ॥'
transliteration: 'kathaṃ jñānam avāpnoti kathaṃ muktir bhaviṣyati |

  vairāgyaṃ ca kathaṃ prāptam etad brūhi mama prabho ||'
translation: 'Janaka said: How is knowledge attained?'
commentary: 'Extended Translation:

  Janaka said: How is knowledge attained? How does liberation come? How is dispassion
  reached? Tell me this, O Lord.


  The text opens with the three questions that frame every spiritual tradition: epistemology
  (*jñāna* — how do we know?), soteriology (*mukti* — how are we freed?), and the
  psychology of renunciation (*vairāgya* — how does attachment loosen?). Janaka is
  asking as a genuine seeker. What is remarkable is how rapidly Aṣṭāvakra answers
  — not with a teaching program but with a single declaration that makes the questions
  obsolete. The questions assume liberation is somewhere to be reached. The answer
  reveals it was never absent.


  Cross-Tradition Resonance:

  - Pratyabhijñāhṛdayam Sūtra 1: *citiḥ svatantrā* — Consciousness is already sovereign;
  the question of "how to attain" is the first obstacle.

  - Dào Dé Jīng ch. 48: "In pursuit of learning, every day something is acquired.
  In pursuit of Tao, every day something is dropped." Janaka is still acquiring; Aṣṭāvakra
  will show him what to drop.

  - Meister Eckhart, Sermon 52: "If you want the kernel, you must break the shell"
  — the shell here is precisely Janaka''s three questions.'
voice_of_siva: ''
abhyasa: 'Sit with the question "how?" — any "how?" currently alive in your spiritual
  life. Notice the shape of the question: it assumes a gap between here and there,
  between seeker and sought. Can you sense, even faintly, a presence that does not
  belong to the question? That presence is what Aṣṭāvakra will point to.'
