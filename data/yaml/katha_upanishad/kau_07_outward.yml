sutra_id: KAU_07_OUTWARD
collection: Katha Upanishad
section: Kaṭha Upaniṣad 4.1–4.4
title: The Openings Turn Outward
sanskrit: "पराञ्चि खानि व्यतृणत् स्वयंभूस् तस्मात् पराङ् पश्यति नान्तरात्मन् ।  कश्चिद् धीरः प्रत्यग्\
  \ आत्मानम् ऐक्षद् आवृत्तचक्षुर् अमृतत्वम् इच्छन् । \nपराचः कामान् अनुयन्ति बालास् ते मृत्योर् यन्ति\
  \ विततस्य पाशम् ।  अथ धीरा अमृतत्वं विदित्वा ध्रुवम् अध्रुवेष्व् इह न प्रार्थयन्ते । \nएतद् वै तत् ।\
  \ \nस्वप्नान्तं जागरितान्तं चोभौ येनानुपश्यति ।  महान्तं विभुम् आत्मानं मत्वा धीरो न शोचति । ।"
transliteration: 'parāñci khāni vyatṛṇat svayaṃbhūs tasmāt parāṅ paśyati nāntarātman / kaścid dhīraḥ pratyag
  ātmānam aikṣad āvṛttacakṣur amṛtatvam icchan |

  parācaḥ kāmān anuyanti bālās te mṛtyor yanti vitatasya pāśam / atha dhīrā amṛtatvaṃ viditvā dhruvam
  adhruveṣv iha na prārthayante |

  etad vai tat |

  svapnāntaṃ jāgaritāntaṃ cobhau yenānupaśyati / mahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati ||'
translation: The Self-existent pierced the openings of the senses so that they turn outward; therefore
  man looks outward, not within himself. Some wise man, seeking immortality, turned his eyes inward and
  saw the Self within.
commentary: '«The Openings Turn Outward» names the Kaṭha''s contested move in this stretch of the dialogue:
  the teaching refuses consolation goods and forces the question of what survives death into a pedagogy
  of discrimination (śreyas over preyas). The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Today, when offered a pleasant distraction and a harder good, pause long enough to name which
  is which, then take one step toward the good.
themes:
- death
- self
- knowledge
- desire
- freedom
- attention
