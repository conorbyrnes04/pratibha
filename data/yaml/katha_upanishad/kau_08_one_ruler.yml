sutra_id: KAU_08_ONE_RULER
collection: Katha Upanishad
section: Kaṭha Upaniṣad 5.9–5.15
title: One Ruler Within All Things
sanskrit: "अग्निर् यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।  एकस् तथा सर्वभूतान्तरात्मा रूपं रूपं\
  \ प्रतिरूपो बहिश् च । \nवायुर् यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।  एकस् तथा सर्वभूतान्तरात्मा\
  \ रूपं रूपं प्रतिरूपो बहिश् च । \nसूर्यो यथा सर्वलोकस्य चक्षुर् न लिप्यते चाक्षुषैर् बाह्यदोषैः ।  एकस्\
  \ तथा सर्वभूतान्तरात्मा न लिप्यते लोकदुःखेन बाह्यः । \nएको वशी सर्वभूतान्तरात्मा एकं रूपं बहुधा यः करोति\
  \ ।  तम् आत्मस्थं ये ऽनुपश्यन्ति धीरास् तेषां सुखं शाश्वतं नेतरेषाम् । \nनित्यो ऽनित्यानां चेतनश् चेतनानाम्\
  \ एको बहूनां यो विदधाति कामान् ।  तम् आत्मस्थं ये ऽनुपश्यन्ति धीरास् तेषं शान्तिः शाश्वती नेतरेषाम्\
  \ । \nतद् एतद् इति मन्यन्ते ऽनिर्देश्यं परमं सुखम् ।  कथं नु तद् विजानीयां किम् उ भाति विभाति वा । \n\
  न तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतो ऽयम् अग्निः ।  तम् एव भान्तम् अनु भाति सर्वं\
  \ तस्य भासा सर्वम् इदं विभाति । ।"
transliteration: 'agnir yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva / ekas tathā sarvabhūtāntarātmā
  rūpaṃ rūpaṃ pratirūpo bahiś ca |

  vāyur yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva / ekas tathā sarvabhūtāntarātmā rūpaṃ
  rūpaṃ pratirūpo bahiś ca |

  sūryo yathā sarvalokasya cakṣur na lipyate cākṣuṣair bāhyadoṣaiḥ / ekas tathā sarvabhūtāntarātmā na
  lipyate lokaduḥkhena bāhyaḥ |

  eko vaśī sarvabhūtāntarātmā ekaṃ rūpaṃ bahudhā yaḥ karoti / tam ātmasthaṃ ye ''nupaśyanti dhīrās teṣāṃ
  sukhaṃ śāśvataṃ netareṣām |

  nityo ''nityānāṃ cetanaś cetanānām eko bahūnāṃ yo vidadhāti kāmān / tam ātmasthaṃ ye ''nupaśyanti dhīrās
  teṣaṃ śāntiḥ śāśvatī netareṣām |

  tad etad iti manyante ''nirdeśyaṃ paramaṃ sukham / kathaṃ nu tad vijānīyāṃ kim u bhāti vibhāti vā |

  na tatra sūryo bhāti na candratārakaṃ nemā vidyuto bhānti kuto ''yam agniḥ / tam eva bhāntam anu bhāti
  sarvaṃ tasya bhāsā sarvam idaṃ vibhāti ||'
translation: There is one ruler, the Self within all things, who makes the one form manifold. The wise
  who perceive him within their Self, to them belongs eternal happiness, not to others. There is one eternal
  thinker, thinking non-eternal thoughts, who, though one, fulfills the desires of many.
commentary: '«One Ruler Within All Things» names the Kaṭha''s contested move in this stretch of the dialogue:
  the teaching refuses consolation goods and forces the question of what survives death into a pedagogy
  of discrimination (śreyas over preyas). The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Today, when offered a pleasant distraction and a harder good, pause long enough to name which
  is which, then take one step toward the good.
