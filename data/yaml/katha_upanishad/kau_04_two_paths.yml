sutra_id: KAU_04_TWO_PATHS
collection: Katha Upanishad
section: Kaṭha Upaniṣad 2.1–2.6
title: The Good and the Pleasant
sanskrit: "अन्यच् छ्रेयो ऽन्यद् उतैव प्रेयस् ते उभे नानार्थे पुरुषं सिनीतः ।  तयोः श्रेय आददानस्य साधु\
  \ भवति हीयते ऽर्थाद् य उ प्रेयो वृणीते । \nश्रेयश् च प्रेयश् च मनुष्यम् एतस् तौ संपरीत्य विविनक्ति धीरः\
  \ ।  श्रेयो हि धीरो ऽभि प्रेयसो वृणीते प्रेयो मन्दो योगक्षेमाद् वृणीते । \nस त्वं प्रियान् प्रियरूपांश्\
  \ च कामान् अभिध्यायन् नचिकेतो ऽत्यस्राक्षीः ।  नैतां सृङ्कां वित्तमयीम् अवाप्तो यस्यां मज्जन्ति बहवो\
  \ मनुष्याः । \nदूरम् एते विपरीते विषूची अविद्या या च विद्येति ज्ञाता ।  विद्याभीप्सिनं नचिकेतसं मन्ये\
  \ न त्वा कामा बहवो ऽलोलुपन्त । \nअविद्यायाम् अन्तरे वर्तमानाः स्वयं धीराः पण्डितं मन्यमानाः ।  दन्द्रम्यमाणाः\
  \ परियन्ति मूढा अन्धेनैव नीयमाना यथान्धाः । \nन साम्परायः प्रतिभाति बालं प्रमाद्यन्तं वित्तमोहेन मूढम्\
  \ ।  अयं लोको नास्ति पर इति मानी पुनः पुनर् वशम् आपद्यते मे । ।"
transliteration: 'anyac chreyo ''nyad utaiva preyas te ubhe nānārthe puruṣaṃ sinītaḥ / tayoḥ śreya ādadānasya
  sādhu bhavati hīyate ''rthād ya u preyo vṛṇīte |

  śreyaś ca preyaś ca manuṣyam etas tau saṃparītya vivinakti dhīraḥ / śreyo hi dhīro ''bhi preyaso vṛṇīte
  preyo mando yogakṣemād vṛṇīte |

  sa tvaṃ priyān priyarūpāṃś ca kāmān abhidhyāyan naciketo ''tyasrākṣīḥ / naitāṃ sṛṅkāṃ vittamayīm avāpto
  yasyāṃ majjanti bahavo manuṣyāḥ |

  dūram ete viparīte viṣūcī avidyā yā ca vidyeti jñātā / vidyābhīpsinaṃ naciketasaṃ manye na tvā kāmā
  bahavo ''lolupanta |

  avidyāyām antare vartamānāḥ svayaṃ dhīrāḥ paṇḍitaṃ manyamānāḥ / dandramyamāṇāḥ pariyanti mūḍhā andhenaiva
  nīyamānā yathāndhāḥ |

  na sāmparāyaḥ pratibhāti bālaṃ pramādyantaṃ vittamohena mūḍham / ayaṃ loko nāsti para iti mānī punaḥ
  punar vaśam āpadyate me ||'
translation: The good is one thing, the pleasant another; these two, having different ends, bind a man.
  It is well with him who chooses the good; he who chooses the pleasant falls from his aim. The wise prefer
  the good to the pleasant; the fool chooses the pleasant through greed and avarice.
commentary: '«The Good and the Pleasant» names the Kaṭha''s contested move in this stretch of the dialogue:
  the teaching refuses consolation goods and forces the question of what survives death into a pedagogy
  of discrimination (śreyas over preyas). The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Today, when offered a pleasant distraction and a harder good, pause long enough to name which
  is which, then take one step toward the good.
