sutra_id: KAU_03_HEREAFTER
collection: Katha Upanishad
section: Kaṭha Upaniṣad 1.20–1.29
title: The Doubt When a Man Is Dead
sanskrit: "येयं प्रेते विचिकित्सा मनुष्ये अस्तीत्य् एके नायम् अस्तीति चैके ।  एतद् विद्याम् अनुशिष्टस्\
  \ त्वयाहं वराणाम् एष वरस् तृतीयः । \nदेवैर् अत्रापि विचिकित्सितं पुरा न हि सुज्ञेयम् अणुर् एष धर्मः\
  \ ।  अन्यं वरं नचिकेतो वृणीष्व मा मोपरोत्सीर् अति मा सृजैनम् । \nदेवैर् अत्रापि विचिकित्सितं किल त्वं\
  \ च मृत्यो यन् न सुज्ञेयम् आत्थ ।  वक्ता चास्य त्वादृग् अन्यो न लभ्यो नान्यो वरस् तुल्य एतस्य कश्चित्\
  \ । \nशतायुषः पुत्रपौत्रान् वृणीष्व बहून् पशून् हस्तिहिरण्यम् अश्वान् ।  भूमेर् महद् आयतनं वृणीष्व स्वयं\
  \ च जीव शरदो यावद् इच्छसि । \nएतत् तुल्यं यदि मन्यसे वरं वृणीष्व वित्तं चिरजीविकां च ।  महाभूमौ नचिकेतस्\
  \ त्वम् एधि कामानां त्वा कामभाजं करोमि । \nये ये कामा दुर्लभा मर्त्यलोके सर्वान् कामांश् छन्दतः प्रार्थयस्व\
  \ ।  इमा रामाः सरथाः सतूर्या न हीदृशा लम्भनीया मनुष्यैः ।  आभिर् मत्प्रत्ताभिः परिचारयस्व नचिकेतो मरणं\
  \ मानुप्राक्षीः । \nश्वोभावा मर्त्यस्य यद् अन्तकैतत् सर्वेन्द्रियाणां जरयन्ति तेजः ।  अपि सर्वं जीवितम्\
  \ अल्पम् एव तवैव वाहास् तव नृत्यगीते । \nन वित्तेन तर्पणीयो मनुष्यो लप्स्यामहे वित्तम् अद्राक्ष्म चेत्\
  \ त्वा ।  जीविष्यामो यावद् ईशिष्यसि त्वं वरस् तु मे वरणीयः स एव । \nअजीर्यताम् अमृतानाम् उपेत्य जीर्यन्\
  \ मर्त्यः क्वधःस्थः प्रजानन् ।  अभिध्यायन् वर्णरतिप्रमोदान् अतिदीर्घे जीविते को रमेत । \nयस्मिन्न् इदं\
  \ विचिकित्सन्ति मृत्यो यत् साम्पराये महति ब्रूहि नस् तत् ।  यो ऽयं वरो गूढम् अनुप्रविष्टो नान्यं तस्मान्\
  \ नचिकेता वृणीते । ।"
transliteration: 'yeyaṃ prete vicikitsā manuṣye astīty eke nāyam astīti caike / etad vidyām anuśiṣṭas
  tvayāhaṃ varāṇām eṣa varas tṛtīyaḥ |

  devair atrāpi vicikitsitaṃ purā na hi sujñeyam aṇur eṣa dharmaḥ / anyaṃ varaṃ naciketo vṛṇīṣva mā moparotsīr
  ati mā sṛjainam |

  devair atrāpi vicikitsitaṃ kila tvaṃ ca mṛtyo yan na sujñeyam āttha / vaktā cāsya tvādṛg anyo na labhyo
  nānyo varas tulya etasya kaścit |

  śatāyuṣaḥ putrapautrān vṛṇīṣva bahūn paśūn hastihiraṇyam aśvān / bhūmer mahad āyatanaṃ vṛṇīṣva svayaṃ
  ca jīva śarado yāvad icchasi |

  etat tulyaṃ yadi manyase varaṃ vṛṇīṣva vittaṃ cirajīvikāṃ ca / mahābhūmau naciketas tvam edhi kāmānāṃ
  tvā kāmabhājaṃ karomi |

  ye ye kāmā durlabhā martyaloke sarvān kāmāṃś chandataḥ prārthayasva / imā rāmāḥ sarathāḥ satūryā na
  hīdṛśā lambhanīyā manuṣyaiḥ / ābhir matprattābhiḥ paricārayasva naciketo maraṇaṃ mānuprākṣīḥ |

  śvobhāvā martyasya yad antakaitat sarvendriyāṇāṃ jarayanti tejaḥ / api sarvaṃ jīvitam alpam eva tavaiva
  vāhās tava nṛtyagīte |

  na vittena tarpaṇīyo manuṣyo lapsyāmahe vittam adrākṣma cet tvā / jīviṣyāmo yāvad īśiṣyasi tvaṃ varas
  tu me varaṇīyaḥ sa eva |

  ajīryatām amṛtānām upetya jīryan martyaḥ kvadhaḥsthaḥ prajānan / abhidhyāyan varṇaratipramodān atidīrghe
  jīvite ko rameta |

  yasminn idaṃ vicikitsanti mṛtyo yat sāmparāye mahati brūhi nas tat / yo ''yaṃ varo gūḍham anupraviṣṭo
  nānyaṃ tasmān naciketā vṛṇīte ||'
translation: 'Naciketas said: There is that doubt when a man is dead—some saying he is; others, he is
  not. This I should like to know, taught by thee; this is the third of my boons. Death offered sons,
  wealth, and long life instead; Naciketas refused: No man can be made happy by wealth. Tell us what there
  is in that great Hereafter.'
commentary: '«The Doubt When a Man Is Dead» names the Kaṭha''s contested move in this stretch of the dialogue:
  the teaching refuses consolation goods and forces the question of what survives death into a pedagogy
  of discrimination (śreyas over preyas). The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Today, when offered a pleasant distraction and a harder good, pause long enough to name which
  is which, then take one step toward the good.
