sutra_id: KAU_09_IMMORTAL
collection: Katha Upanishad
section: Kaṭha Upaniṣad 6.10–6.17
title: When Desires Cease
sanskrit: "यदा पञ्चावतिष्ठन्ते ज्ञानानि मनसा सह ।  बुद्धिश् च न विचेष्टति ताम् आहुः परमां गतिम् । \nतां\
  \ योगम् इति मन्यन्ते स्थिराम् इन्द्रियधारणाम् ।  अप्रमत्तस् तदा भवति योगो हि प्रभवाप्ययौ । \nनैव वाचा\
  \ न मनसा प्राप्तुं शक्यो न चक्षुषा ।  अस्तीति ब्रुवतो ऽन्यत्र कथं तद् उपलभ्यते । \nअस्तीत्य् एवोपलब्धव्यस्\
  \ तत्त्वभावेन चोभयोः ।  अस्तीत्य् एवोपलब्धस्य तत्त्वभावः प्रसीदति । \nयदा सर्वे प्रमुच्यन्ते कामा ये\
  \ ऽस्य हृदि श्रिताः ।  अथ मर्त्यो ऽमृतो भवत्य् अत्र ब्रह्म समश्नुते । \nयदा सर्वे प्रभिद्यन्ते हृदयस्येह\
  \ ग्रन्थयः ।  अथ मर्त्यो ऽमृतो भवत्य् एतावद् ध्य् अनुशासनम् । \nशतं चैका च हृदयस्य नाड्यस् तासां मूर्धानम्\
  \ अभिनिःसृतैका ।  तयोर्ध्वम् आयन्न् अमृतत्वम् एति विष्वङ्ङ् अन्या उत्क्रमणे भवति । \nअङ्गुष्ठमात्रः\
  \ पुरुषो ऽन्तरात्मा सदा जनानां हृदये संनिविष्टः ।  तं स्वाच् छरीरात् प्रवृहेन् मुञ्जाद् इवेषीकां धैर्येण\
  \ ।  तं विद्याच् छुक्रम् अमृतं तं विद्याच् छुक्रम् अमृतम् इति । ।"
transliteration: 'yadā pañcāvatiṣṭhante jñānāni manasā saha / buddhiś ca na viceṣṭati tām āhuḥ paramāṃ
  gatim |

  tāṃ yogam iti manyante sthirām indriyadhāraṇām / apramattas tadā bhavati yogo hi prabhavāpyayau |

  naiva vācā na manasā prāptuṃ śakyo na cakṣuṣā / astīti bruvato ''nyatra kathaṃ tad upalabhyate |

  astīty evopalabdhavyas tattvabhāvena cobhayoḥ / astīty evopalabdhasya tattvabhāvaḥ prasīdati |

  yadā sarve pramucyante kāmā ye ''sya hṛdi śritāḥ / atha martyo ''mṛto bhavaty atra brahma samaśnute
  |

  yadā sarve prabhidyante hṛdayasyeha granthayaḥ / atha martyo ''mṛto bhavaty etāvad dhy anuśāsanam |

  śataṃ caikā ca hṛdayasya nāḍyas tāsāṃ mūrdhānam abhiniḥsṛtaikā / tayordhvam āyann amṛtatvam eti viṣvaṅṅ
  anyā utkramaṇe bhavati |

  aṅguṣṭhamātraḥ puruṣo ''ntarātmā sadā janānāṃ hṛdaye saṃniviṣṭaḥ / taṃ svāc charīrāt pravṛhen muñjād
  iveṣīkāṃ dhairyeṇa / taṃ vidyāc chukram amṛtaṃ taṃ vidyāc chukram amṛtam iti ||'
translation: When all desires that dwell in the heart cease, then the mortal becomes immortal, and obtains
  Brahman. When all the ties of the heart are severed here on earth, then the mortal becomes immortal—
  this much alone is the teaching.
commentary: '«When Desires Cease» names the Kaṭha''s contested move in this stretch of the dialogue: the
  teaching refuses consolation goods and forces the question of what survives death into a pedagogy of
  discrimination (śreyas over preyas). The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Today, when offered a pleasant distraction and a harder good, pause long enough to name which
  is which, then take one step toward the good.
themes:
