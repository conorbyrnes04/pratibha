sutra_id: KAU_06_CHARIOT
collection: Katha Upanishad
section: Kaṭha Upaniṣad 3.1–3.9
title: Self as Lord of the Chariot
sanskrit: "ऋतं पिबन्तौ सुकृतस्य लोके गुहां प्रविष्टौ परमे परार्धे ।  छायातपौ ब्रह्मविदो वदन्ति पञ्चाग्नयो\
  \ ये च त्रिणाचिकेताः । \nयः सेतुर् ईजानानाम् अक्षरं ब्रह्म यत् परम् ।  अभयं तितीर्षतां पारं नाचिकेतं\
  \ शकेमहि । \nआत्मानं रथिनं विद्धि शरीरं रथम् एव तु ।  बुद्धिं तु सारथिं विद्धि मनः प्रग्रहम् एव च ।\
  \ \nइन्द्रियाणि हयान् आहुर् विषयांस् तेषु गोचरान् ।  आत्मेन्द्रियमनोयुक्तं भोक्तेत्य् आहुर् मनीषिणः\
  \ । \nयस् त्व् अविज्ञानवान् भवत्य् अयुक्तेन मनसा सदा ।  तस्येन्द्रियाण्य् अवश्यानि दुष्टाश्वा इव सारथेः\
  \ । \nयस् तु विज्ञानवान् भवति युक्तेन मनसा सदा ।  तस्येन्द्रियाणि वश्यानि सदश्वा इव सारथेः । \nयस् त्व्\
  \ अविज्ञानवान् भवत्य् अमनस्कः सदाशुचिः ।  न स तत् पदम् आप्नोति संसारं चाधिगच्छति । \nयस् तु विज्ञानवान्\
  \ भवति समनस्कः सदा शुचिः ।  स तु तत् पदम् आप्नोति यस्माद् भूयो न जायते । \nविज्ञानसारथिर् यस् तु मनः\
  \ प्रग्रहवान् नरः ।  सो ऽध्वनः पारम् आप्नोति तद् विष्णोः परमं पदम् । ।"
transliteration: 'ṛtaṃ pibantau sukṛtasya loke guhāṃ praviṣṭau parame parārdhe / chāyātapau brahmavido
  vadanti pañcāgnayo ye ca triṇāciketāḥ |

  yaḥ setur ījānānām akṣaraṃ brahma yat param / abhayaṃ titīrṣatāṃ pāraṃ nāciketaṃ śakemahi |

  ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu / buddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca |

  indriyāṇi hayān āhur viṣayāṃs teṣu gocarān / ātmendriyamanoyuktaṃ bhoktety āhur manīṣiṇaḥ |

  yas tv avijñānavān bhavaty ayuktena manasā sadā / tasyendriyāṇy avaśyāni duṣṭāśvā iva sāratheḥ |

  yas tu vijñānavān bhavati yuktena manasā sadā / tasyendriyāṇi vaśyāni sadaśvā iva sāratheḥ |

  yas tv avijñānavān bhavaty amanaskaḥ sadāśuciḥ / na sa tat padam āpnoti saṃsāraṃ cādhigacchati |

  yas tu vijñānavān bhavati samanaskaḥ sadā śuciḥ / sa tu tat padam āpnoti yasmād bhūyo na jāyate |

  vijñānasārathir yas tu manaḥ pragrahavān naraḥ / so ''dhvanaḥ pāram āpnoti tad viṣṇoḥ paramaṃ padam
  ||'
translation: Know the Self as the lord of the chariot, the body as the chariot itself, the intellect as
  the charioteer, and the mind as the reins. The senses they call the horses, the objects of the senses
  their roads. When the Self is joined with body, senses, and mind, then wise people call him the enjoyer.
commentary: '«Self as Lord of the Chariot» names the Kaṭha''s contested move in this stretch of the dialogue:
  the teaching refuses consolation goods and forces the question of what survives death into a pedagogy
  of discrimination (śreyas over preyas). The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Today, when offered a pleasant distraction and a harder good, pause long enough to name which
  is which, then take one step toward the good.
