sutra_id: BCA_08_EQUAL
collection: Shantideva Bodhicaryavatara
section: teaching_passage
title: Another's Pain Is Pain
anchor_translation: First he will diligently foster the thought that his fellow-creatures
  are the same as himself. "All have the same sorrows, the same joys as I, and I must
  guard them like myself." Although my pain may bring no hurt to other bodies, nevertheless
  it is a pain to me, which I cannot bear because of the love of self; and though
  I cannot in myself feel the pain of another, it is a pain to him which he cannot
  bear because of the love of self. I must destroy the pain of another as though it
  were my own, because it is a pain; I must show kindness to others, for they are
  creatures as I am myself.
sanskrit: '*Source-language basis:* Sanskrit (Śāntideva, *Bodhicaryāvatāra*, Dhyāna
  chapter, *parātma-samatā* section). English anchor from Barnett 1909; per-verse
  Devanagari not source-verified for this pilot.'
transliteration: 'Key terms in IAST: *parātma-samatā* (the equality of self and other),
  *duḥkha* (suffering, pain), *karuṇā* (compassion), *ātma-sneha* (self-love), *sattva*
  ("fellow-creatures," sentient beings).'
translation: 'First one carefully cultivates the thought that other beings are just
  the same as oneself: "All feel the same sorrows and joys that I do, and I must protect
  them as I protect myself." My pain does no harm to another''s body, yet it is unbearable
  to me because I love myself; and though I cannot feel another''s pain in my own
  body, it is unbearable to him because he loves himself. Since it is simply pain,
  I must remove another''s pain as if it were my own—and I must be kind to others,
  because they are beings exactly as I am.'
commentary: 'This is the first great move of Śāntideva''s compassion-training, *parātma-samatā*,
  the equalizing of self and other, and it is built as a logical argument rather than
  a sentimental appeal. The premise is deflationary: the only reason my pain seems
  specially urgent is *ātma-sneha*, self-love—the accident that this particular stream
  of experience is labeled "mine." Śāntideva grants the asymmetry honestly ("I cannot
  in myself feel the pain of another") but denies that it grounds any real moral difference.
  Pain is pain wherever it occurs; its badness does not depend on whose it is, any
  more than the badness of a fire depends on which hand it burns. The counterintuitive
  conclusion is that the boundary of self, which feels like the most basic fact of
  ethics, is exposed as an arbitrary partition—like caring for the pain in my foot
  but not my hand because they are "different." The word "must" recurs with quiet
  force: this is not a suggestion but the rational entailment of taking suffering
  seriously at all. For a retreat, this verse is the bridge from private calm to universal
  concern: the stillness cultivated earlier is not for personal peace alone but to
  make room for a compassion that no longer privileges the self. It prepares the even
  more radical exchange that follows.


  Key Terms:


  **parātma-samatā (परात्मसमता)** — Etymology: *para* (other) + *ātma* (self) + *samatā*
  (equality, sameness): "the equality of self and other." Śāntideva''s foundational
  compassion practice: seeing no essential moral difference between one''s own welfare
  and another''s.

  **duḥkha (दुःख)** — Etymology: often glossed *duḥ-* (bad) + *kha* (axle-hole/space),
  "poorly-running": suffering, unease. Here treated as impersonally bad—pain simply
  as pain, regardless of owner.

  **ātma-sneha (आत्मस्नेह)** — Etymology: *ātma* (self) + *sneha* (affection, oiliness,
  clinging love): "self-love." The bias exposed as the sole reason one''s own pain
  feels uniquely important.

  **karuṇā (करुणा)** — Etymology: from *√kṛ* / kindred roots for "lament, compassion":
  the responsive wish to remove others'' suffering, here derived from the equality
  argument rather than mere feeling.


  Cross-Tradition Resonances:


  **Milarepa, "Bodhi Mind in the Skeleton" (song to Peta):** the practitioner''s inner
  state is *bodhicitta* itself—compassion for all beings as the meaning of ascetic
  hardship.

  *Divergence:* Milarepa dramatizes it biographically in a cave; Śāntideva derives
  it as a step-by-step contemplative argument.

  **Kant, universalizability / the golden rule traditions:** the moral standpoint
  requires stripping away the mere fact that an interest is *mine*.

  *Divergence:* Kant grounds impartiality in rational law and the dignity of persons;
  Śāntideva grounds it in the emptiness of the self-boundary and the impersonal badness
  of pain.

  **Stoic oikeiōsis (the widening circle of concern):** ethical development as extending
  self-care outward to all rational beings.

  *Divergence:* the Stoic circle expands a real self''s concern; Śāntideva dissolves
  the self whose privileged status the concern was tracking.'
abhyasa: Bring to mind a minor pain of your own and a pain you know a specific other
  person is carrying. Hold them side by side and drop the labels "mine" and "theirs,"
  attending only to "pain, and pain." Notice the reflex that makes yours feel more
  urgent, name it "self-love," and let your wish for relief extend equally to both.
source: Śāntideva, *Bodhicaryāvatāra* VIII (dhyāna-pāramitā), equalizing self and
  other (BCA_08_EQUAL; Barnett 1909 anchor)
