title: 'Being-Time: Time Is Already Being'
unit_type: treatise
sequence: 8
reference: Uji §1
source_reference: Dōgen, *Shōbōgenzō*, Uji §1
sanskrit_devanagari: '古仏、言、

  有時、高高、峰頂、立。

  有時、深深、海底、行。

  有時、三頭八臂。

  有時、丈六、八尺。

  有時、拄杖、払子。

  有時、露柱、灯籠。

  有時、張三李四。

  有時、大地、虚空。'
sanskrit_iast: See Original.
translation_literal: 'An old buddha said: Sometimes standing on a soaring mountain peak. Sometimes moving
  along the deepest ocean floor. Sometimes three heads and eight arms. Sometimes the sixteen-foot or eight-foot
  golden body. Sometimes a staff or whisk. Sometimes a pillar or lantern. Sometimes the next person. Sometimes
  the great earth and empty space.'
commentary: 'Uji opens with a litany of "sometimes" that will be re-read as being-time itself — not a
  clock that contains events, but events as time. Existentially: do not demote this posture or that form
  as "merely temporary"; each is a complete being-time.


  Key Terms


  **有時 uji** — "being-time" / "for the time being." Time as being, being as time.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Uji opens with a litany of "sometimes" that will be re-read as being-time itself — not a clock
  that contains events, but events as time.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
