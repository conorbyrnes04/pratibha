reference: Genjōkōan §2
source_reference: Dōgen, *Shōbōgenzō*, Genjōkōan §2
sanskrit_devanagari: '自己をはこびて万法を修、証するを迷とす。

  万法すすみて自己を修、証するは、さとりなり。

  迷を大悟するは諸仏なり。

  悟に大迷なるは衆生なり。

  さらに悟上に得悟する漢あり。

  迷中又迷の漢あり。

  諸仏の、まさしく諸仏なるときは、自己は諸仏なり、と覚知することをもちいず。

  しかあれども、証仏なり。

  仏を証しもってゆく。

  身心を挙して色を見取し、身心を挙して声を聴取するに、したしく会取すれども、かがみにかげをやどすがごとくにあらず。

  水と月とのごとくにあらず。

  一方を証するときは一方はくらし。'
sanskrit_iast: See Original.
translation_literal: To carry the self forward and practice-realize the myriad dharmas is delusion. That
  the myriad dharmas come forth and practice-realize the self is awakening. Those who greatly awaken to
  delusion are buddhas. Those who are greatly deluded about awakening are sentient beings. Further, there
  are those who attain awakening beyond awakening, and those who are deluded within delusion. When buddhas
  are truly buddhas, they do not need to be aware that they are buddhas — yet they are verified buddhas,
  and they go on verifying buddha.
commentary: 'Delusion is self-as-agent pushing into the world; awakening is the world verifying the self.
  The contested inversion refuses spiritual athleticism as the essence of the path. Buddhas need not self-congratulate
  as buddhas — verification continues without that identity-claim. Existentially: notice when practice
  is you carrying a project called enlightenment; soften into being practiced by what appears.


  Key Terms


  **修証 shushō** — "practice-realization." Not practice then later realization; one compound.


  **迷 / 悟 mei / go** — delusion / awakening as modes of relation to the myriad dharmas.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Delusion is self-as-agent pushing into the world; awakening is the world verifying the self.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
