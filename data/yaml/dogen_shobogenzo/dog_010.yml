reference: Uji §3
source_reference: Dōgen, *Shōbōgenzō*, Uji §3
sanskrit_devanagari: 'われを排列しおきて尽界とせり。

  この尽界の頭頭、物物を時時なりと覰見すべし。

  物物の、相礙せざるは、時時の、相礙せざるがごとし。

  このゆえに、同時発心あり、同心発時あり。

  および、修行、成道も、かくのごとし。

  われを排列して、われ、これをみるなり。

  自己の、時なる道理、それ、かくのごとし。

  恁麼の道理なるゆえに、尽地に万象、百草あり。

  一草、一象、おのおの、尽地にあることを参学すべし。

  かくのごとくの( or この)往来は修行の発足なり。

  到、恁麼の田地のとき、すなわち、一草、一象なり。

  会、象、不会、象なり。

  会、草、不会、草なり。

  正当恁麼時のみなるがゆえに、有時みな、尽時なり。

  有草、有象ともに時なり。

  時時の時に尽有、尽界あるなり。

  しばらく、いまの時にもれたる尽有、尽界ありや？　なしや？　と観想すべし。'
sanskrit_iast: See Original.
translation_literal: We set the self out in array and make that the whole world. See each thing of this
  whole world as a time. Things do not hinder one another, just as times do not hinder one another. Therefore
  there is arising of mind at the same time, and arising of time at the same mind. Practice and realization
  are also like this. We set the self out in array and see that. The reason the self is time is like this.
commentary: 'The self is not a private capsule inside time; arrayed, it is the world as times. Non-hindrance
  of things mirrors non-hindrance of times. Existentially: when you feel time as enemy of the self, check
  whether you have refused to array the self as world.


  Key Terms


  **排列** — "array / arrange." The self set out as world.


  **相礙せざる** — non-hindrance of things and times.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: The self is not a private capsule inside time; arrayed, it is the world as times.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
