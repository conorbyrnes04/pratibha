source_reference: Rūmī, *Mathnawī* III.1262–1267
sanskrit_devanagari: 'آن یکی را کف به خرطوم اوفتاد /// گفت همچون ناودانست این نهاد

  آن یکی را دست بر گوشش رسید /// آن برو چون بادبیزن شد پدید

  آن یکی را کف چو بر پایش بسود /// گفت شکل پیل دیدم چون عمود

  آن یکی بر پشت او بنهاد دست /// گفت خود این پیل چون تختی بدست

  همچنین هر یک به جزوی که رسید /// فهم آن می‌کرد هر جا می‌شنید

  از نظرگه گفتشان شد مختلف /// آن یکی دالش لقب داد این الف'
sanskrit_iast: See Original.
translation_literal: 'One''s palm fell on the trunk — "This being is like a water-spout." Another''s hand
  reached the ear — it seemed a fan. Another felt the leg — "I found the elephant''s shape like a pillar."
  Another laid a hand on the back — "Truly this elephant is like a throne." Each understood according
  to the part touched. Their words differed by viewpoint: one nicknamed it *dāl*, another *alif*.'
commentary: 'Conflict is often not about different elephants but different grips. The contested pastoral
  use is irenic without relativism: disagreement is explained by *naẓargāh* (viewing-place), not by denying
  a whole. Existentially: in your next argument, ask what part each hand is on.


  Key Terms


  **جزو juzʾ** — part; the fragment mistaken for the whole.


  **نظرگه naẓargāh** — viewing-place; the stand that shapes speech.


  **دال / الف** — letter-shapes as rival nicknames for one animal.


  Cross-Tradition Resonances


  **Jain anekāntavāda (many-sidedness):** Both honor partial standpoints.

  *Divergence:* Jain thought systematizes standpoints; Rūmī presses toward a shared light that ends quarrel.


  **Zhuangzi (pipes of heaven / each thing its own right):** Both relativize forced consensus.

  *Divergence:* Zhuangzi often rests in perspectival ease; Rūmī wants the candle that ends difference.'
insight: Conflict is often not about different elephants but different grips.
practice: Write two opposing descriptions of the same hard situation as if each were a palm on a different
  limb. Do not pick a winner. Sit one minute with the elephant still dark.
