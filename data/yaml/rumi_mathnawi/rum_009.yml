sanskrit_devanagari: 'دید موسی یک شبانی را به راه /// کو همی‌گفت ای گزیننده اله

  تو کجایی تا شوم من چاکرت /// چارقت دوزم کنم شانه سرت

  جامه‌ات شویم شپشهاات کُشم /// شیر پیشت آورم ای محتشم

  دستکت بوسم بمالم پایکت /// وقت خواب آید بروبم جایکت

  ای فدای تو همه بزهای من /// ای بیادت هیهی و هیهای من

  این نمط بیهوده می‌گفت آن شبان /// گفت موسی با کی است این ای فلان'
sanskrit_iast: See Original.
translation_literal: 'Moses saw a shepherd on the road saying: O God who chooses — where are You, that
  I may become Your servant, mend Your shoe, comb Your head, wash Your clothes, kill Your lice, bring
  You milk, kiss Your hand, rub Your feet, sweep Your place at sleep — O all my goats are Your sacrifice…'
commentary: 'The shepherd''s prayer is anthropomorphic, intimate, "crude." Its contested holiness is precisely
  that heat. Existentially: notice when your prayer becomes correct and cold.


  Key Terms


  **حال / قال ḥāl / qāl** — state / speech.


  **سوز sūz** — burning.


  **ملت عشق** — the creed/community of love.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9 (even a leaf offered with devotion):** Both privilege sincere offering over formal
  perfection.

  *Divergence:* The Gītā keeps varṇa-dharma frames; Rūmī''s love-creed speaks across forms.


  **Eckhart (silence / not naming detachment):** Both warn that correct speech can spoil intimacy.

  *Divergence:* Eckhart''s worry is exiting the ground by naming; Rūmī''s is shaming the lover''s tongue.'
insight: The shepherd's prayer is anthropomorphic, intimate, "crude.
practice: Pray for one minute in deliberately simple, even "crude" language of care. Then sit one minute
  in burning without words. Notice which felt more true.
