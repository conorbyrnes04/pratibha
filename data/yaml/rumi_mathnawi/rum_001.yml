unit_label: The Reed Complains of Separation
title: The Reed Complains of Separation
unit_type: treatise
sequence: 1
reference: Ney-nāmeh 1
source_reference: Rūmī, *Mathnawī* I, opening (Ney-nāmeh), couplets ~1
sanskrit_devanagari: 'بشنو این نی چون شکایت می‌کند /// از جدایی‌ها حکایت می‌کند

  کز نِیِستان تا مرا بُبریده‌اند /// در نفیرم مرد و زن نالیده‌اند'
sanskrit_iast: See Original.
translation_literal: Listen to this reed as it complains; it tells the story of separations. Since they
  cut me from the reed-bed, men and women have wept to my cry.
commentary: 'The reed''s song is not entertainment; it is the ontology of exile. Separation from the reed-bed
  is the condition of voice. Existentially: treat longing as information about origin, not as a problem
  to numb. The reed is the human spirit cut from the divine reed-bed; complaint is theology in the mode
  of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: The reed's song is not entertainment; it is the ontology of exile.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel
  the cut from the bed. Do not explain it — let the tone complain.
