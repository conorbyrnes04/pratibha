source_reference: Rūmī, *Mathnawī* I.1547–1558 (merchant and parrot)
sanskrit_devanagari: 'بود بازرگانی او را طوطیی /// در قفس محبوس زیبا طوطیی

  گفت طوطی را چه خواهی ارمغان /// کارمت از خطه‌ی هندوستان

  گفتش آن طوطی که آن جا طوطیان /// چون ببینی کن ز حال من بیان

  کان فلان طوطی که مشتاق شماست /// از قضای آسمان در حبس ماست

  بر شما کرد او سلام و داد خواست /// وز شما چاره و ره ارشاد خواست

  این روا باشد که من در بند سخت /// گه شما بر سبزه گاهی بر درخت

  این چنین باشد وفای دوستان /// من در این حبس و شما در بوستان'
sanskrit_iast: See Original.
translation_literal: 'A merchant had a beautiful parrot imprisoned in a cage. "What gift shall I bring
  you from India?" The parrot said: when you see the parrots there, tell my state — that such-and-such
  a parrot, longing for you, is in our prison by heaven''s decree. She sends greeting and seeks justice
  and a way of guidance. Is it right that I am in hard bondage while you are now on green, now on trees?
  Is this friends'' loyalty — I in this prison and you in the garden?'
commentary: 'The soul''s cry is addressed to free birds who may have forgotten cages. The contested sting
  is friendship that enjoys the garden while ignoring the imprisoned. Existentially: who are you free
  with, and whom have you left narrating from a cage?


  Key Terms


  **قفس qafas** — cage; body/ego-confinement.


  **طوطی ṭūṭī** — parrot; the soul that can still speak.


  **فراق firāq** — separation; the ache that sends the message.


  Cross-Tradition Resonances


  **Milarepa (songs from hardship):** Both voice exile as teaching.

  *Divergence:* Milarepa''s cage is often karmic ordeal he owns; Rūmī''s parrot petitions the free for
  a method of release.


  **Reed-flute opening (Mathnawī I):** Both are instruments of separation-speech.

  *Divergence:* The reed sings ontology; the parrot requests a practical path (*rah-e irshād*).'
insight: The soul's cry is addressed to free birds who may have forgotten cages.
practice: Write a three-line message from a caged part of yourself to a freer part (or to friends). Do
  not fix it — just deliver the greeting and the ask for a way.
