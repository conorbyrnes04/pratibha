unit_label: I Am in Love with Both His Violence and His Gentleness
title: I Am in Love with Both His Violence and His Gentleness
unit_type: treatise
sequence: 19
reference: I.1569–1570
source_reference: Rūmī, *Mathnawī* I.1569–1570
sanskrit_devanagari: 'نالم و ترسم که او باور کند /// وز کرم آن جور را کمتر کند

  عاشقم بر قهر و بر لطفش به جد /// بو العجب من عاشق این هر دو ضد'
sanskrit_iast: See Original.
translation_literal: 'I complain — and fear he will believe me and from kindness lessen that cruelty.
  I am earnestly in love with his wrath and with his gentleness: marvel — I am lover of both these contraries.'
commentary: 'The lover fears answered prayer that would dilute the Beloved''s intensity. Love of both
  *qahr* and *luṭf* refuses a God edited for comfort. Existentially: notice when you ask the Real to be
  softer so you can remain the same.


  Key Terms


  **قهر / لطف qahr / luṭf** — wrath/severity and gentleness/grace as twin faces.


  **ضد ḍidd** — contrary; both loved.


  **جور jawr** — cruelty/harshness that can be sweeter than ease.


  Cross-Tradition Resonances


  **Bhagavad Gītā 11 (terrible cosmic form):** Both keep awe that is not merely consoling.

  *Divergence:* Arjuna asks to see the gentle form again; Rūmī''s lover fears the gentle will interrupt
  the schooling.


  **Job (protest that still clings):** Both complain without exiting relation.

  *Divergence:* Job seeks vindication; Rūmī fears kindness that would reduce the pressure of love.'
insight: The lover fears answered prayer that would dilute the Beloved's intensity.
practice: 'Name one hardship you have been praying away. For three breaths, hold: I will not ask for less
  intensity — only for a heart that can love both faces.'
