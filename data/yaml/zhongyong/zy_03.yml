sutra_id: ZY_03
collection: Zhongyong
section: Ch. 1 climax
title: Nothing More Manifest Than What Is Hidden
sanskrit: 莫見乎隱，莫顯乎微。故君子慎其獨也。
transliteration: Classical Chinese.
translation: There is nothing more visible than what is secret, and nothing more manifest than what is
  minute. Therefore the superior man is watchful over himself, when he is alone.
commentary: '«Nothing More Manifest Than What Is Hidden» locates the Mean not as mediocrity but as the
  living balance of nature and cultivation: what cannot be left even for a moment is tested most in solitude.
  The passage asks a living reader to test the claim in experience rather than treat it as museum doctrine.
  Hold the argument until its force lands in attention, then let practice carry one concrete shift into
  the next hour of ordinary life. This is the demand of a living tradition: insight without application
  remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: Practice watchfulness in one private interval today—when no one is measuring you—and note what
  changes.
