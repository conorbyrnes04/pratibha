sutra_id: ZY_05
collection: Zhongyong
section: Ch. 2
title: The Superior Man Embodies the Mean
sanskrit: 仲尼曰：「君子中庸，小人反中庸。君子之中庸也，君子而時中；小人之中庸也，小人而無忌憚也。」
transliteration: Classical Chinese.
translation: Zhongni said, 'The superior man embodies the course of the Mean; the mean man acts contrary
  to the course of the Mean. The superior man's embodying the course of the Mean is because he is a superior
  man, and so always maintains the Mean. The mean man's acting contrary to the course of the Mean is because
  he is a mean man, and has no caution.'
commentary: '«The Superior Man Embodies the Mean» locates the Mean not as mediocrity but as the living
  balance of nature and cultivation: what cannot be left even for a moment is tested most in solitude.
  The passage asks a living reader to test the claim in experience rather than treat it as museum doctrine.
  Hold the argument until its force lands in attention, then let practice carry one concrete shift into
  the next hour of ordinary life. This is the demand of a living tradition: insight without application
  remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: Practice watchfulness in one private interval today—when no one is measuring you—and note what
  changes.
