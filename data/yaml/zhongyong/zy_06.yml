sutra_id: ZY_06
collection: Zhongyong
section: Ch. 4
title: The Way Is Not Practised
sanskrit: 子曰：「道之不行也，我知之矣：知者過之，愚者不及也。道之不明也，我知之矣：賢者過之，不肖者不及也。」
transliteration: Classical Chinese.
translation: The Master said, 'I know how it is that the path of the Mean is not walked in:—The knowing
  go beyond it, and the stupid do not come up to it. I know how it is that the path of the Mean is not
  understood:—The men of talents and virtue go beyond it, and the worthless do not come up to it.'
commentary: '«The Way Is Not Practised» locates the Mean not as mediocrity but as the living balance of
  nature and cultivation: what cannot be left even for a moment is tested most in solitude. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.'
abhyasa: Practice watchfulness in one private interval today—when no one is measuring you—and note what
  changes.
