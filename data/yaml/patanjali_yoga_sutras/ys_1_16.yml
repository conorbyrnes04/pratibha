sutra_id: YS_1_16
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Highest Cessation of Gunas
sanskrit: तत् परं पुरुषाख्याते गुणवैतृण्यम्
transliteration: tat paraṃ puruṣakhyāter guṇavaitṛṣṇyam
translation: It is the supreme state, wherein, from the very nature of Purusha, there
  is complete cessation of the subtle influence of the Gunas.
commentary: 'The claim that the ultimate samādhi is the *para* (highest) cessation
  of the Gunas rests on the ontological distinction between Purusha and Prakriti.
  In this passage, Patanjali asserts that when the mind, conditioned by the Gunas,
  is entirely withdrawn, the very essence of Purusha—its pure, unchanging consciousness—remains
  untouched. This is not merely a state of detachment (aparā), but a transcendence
  of all dualities, where the self is no longer a vessel for the fluctuating qualities
  of Sattva, Rajas, or Tamas. The Yoga and Sāṃkhya traditions converge here: Sāṃkhya
  posits that Purusha is the witness, while Prakriti is the material world; Yoga teaches
  that by perfecting the control of vṛtti, one can experience Purusha’s unaltered
  reality. The existential implication is profound: the practitioner learns that liberation
  is not achieved by merely reducing the influence of the Gunas, but by realizing
  that the self is not bound by them at all. The Dvivedi commentary’s reference to
  “the greatest and best” underscores that this state is not a mere intellectual attainment
  but a lived, blissful reality where only Purusha exists. Thus, the passage invites
  the seeker to move beyond the subtle manipulations of the mind and to inhabit the
  pure, unadulterated awareness that is the very nature of the self.


  Key Terms


  **puruṣa (पुरुष)** — purusha -> pure self, witness consciousness; default translation
  ''person'' misses its ontological role as immutable observer


  **guṇa (गुण)** — guṇa -> quality, attribute; default ''quality'' overlooks its dynamic
  role in constituting Prakriti and influencing vṛtti


  **samādhi (समाधि)** — samādhi -> state of absorption; default ''concentration''
  underplays its transcendental aspect as cessation of vṛtti


  **para (पर)** — para -> highest, ultimate; default ''upper'' fails to convey its
  distinction from apara (lower) states


  Cross-Tradition Resonances


  **Yoga Sūtra 1.16:** Structural homology: ‘tad paraṃ puruṣakhyāter guṇavaitṛṣṇyam’
  mirrors the earlier 1.15 ‘tad paraṃ puruṣakhyāter guṇābhyāṃ’ in pattern but shifts
  focus to cessation rather than presence.

  *Divergence:* The shift from ‘presence’ to ‘cessation’ marks a productive divergence,
  indicating that ultimate samādhi is not merely the presence of Purusha but the negation
  of all Gunic influence


  **Sāṃkhya Kārikā 1.3:** Both texts assert that Purusha is the witness and Prakriti
  the material; the Sūtra’s emphasis on cessation aligns with the Kārikā’s claim that
  Purusha remains untouched by Prakriti’s activity.

  *Divergence:* While the Kārikā presents this as a metaphysical fact, the Sūtra frames
  it as an experiential goal, thereby bridging ontology and praxis


  **Bhaṭṭa’s Commentary on Yoga Sūtra 1.16:** Bhaṭṭa elaborates that the ‘para’ state
  involves the complete dissolution of all vṛtti, echoing the Sūtra’s notion of ‘guṇa‑aitṛṇyam’.

  *Divergence:* Bhaṭṭa’s commentary introduces a subtle distinction between ‘guṇa‑aitṛṇyam’
  (cessation of Gunas) and ‘guṇa‑prabhāva’ (influence), a nuance absent in the terse
  Sūtra'
voice_of_siva: The claim that the ultimate samādhi is the *para* (highest) cessation
  of the Gunas rests on the ontological distinction between Purusha and Prakriti.
abhyasa: Feel the subtle sensations of your body and mind, and consciously let go
  of any attachment to the qualities of Sattva, Rajas, or Tamas, allowing your awareness
  to remain pure and undisturbed.
