sutra_id: YS_1_25
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Omniscience as Ultimate Seed
sanskrit: तत्र निरितिशायम् सर्वज्ञबीजम्
transliteration: tatra niratiśayaṃ sarvajñabījam
translation: There, the seed of all‑knowing is fixed in its ultimate form.
commentary: 'The passage asserts that in the supreme reality the seed of omniscience
  is fully realized. This is a contested move: it equates the highest limit of a quality
  with the ultimate state of the Antahkarana, thereby implying that the divine is
  the locus of absolute knowledge. In the Yoga‑Sāṃkhya framework, the Antahkarana
  is the instrument of cognition, and its faculties are limited by prakṛti. The claim
  that the seed of omniscience is fixed in the divine suggests that the divine transcends
  prakṛti and is the sole source of true cognition. This aligns with the Sāṃkhya idea
  of puruṣa as the unchanging witness, yet it diverges from the Yoga emphasis on the
  personal deity (īśvara) as a distinct, external principle. The Dvivedi commentary
  acknowledges the divine as the ultimate limit but criticises the lack of proof,
  highlighting the tension between metaphysical assertion and empirical validation.
  Practically, this invites the practitioner to recognize that true insight arises
  when the mind’s habitual fluctuations (vṛtti) are still, allowing the seed of omniscience
  to germinate. Thus, the sūtra serves as a reminder that liberation is not merely
  the cessation of vṛtti but the actualization of the highest cognitive potential
  inherent in the self.


  Key Terms


  **citta (चित्त)** — citta: ‘mind’ (IAST) -> Sāṃkhya: the mind as a field of cognition;
  Yoga: the mind as the locus of vṛtti; the term here implies the full spectrum of
  mental states, not just consciousness.


  **vṛtti (वृत्ति)** — vṛtti: ‘mental fluctuation’ (IAST) -> Sāṃkhya: the modifications
  of citta by prakṛti; Yoga: the source of bondage; the sūtra’s reference to the seed
  of omniscience implies a vṛtti that has reached its ultimate limit.


  **purusha (पुरुष)** — purusha: ‘pure consciousness’ (IAST) -> Sāṃkhya: the unchanging
  witness; Yoga: the divine principle; here it is the locus where the seed of omniscience
  is fixed.


  **prakṛti (प्रकृति)** — prakṛti: ‘nature’ (IAST) -> Sāṃkhya: the material cause;
  Yoga: the source of all vṛtti; the sūtra contrasts the fixed seed in purusha with
  the mutable prakṛti.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.25:** The structure mirrors 1.24, where the seed of a quality is
  described as fixed in its limit; both employ the pattern ‘tatra … bījaṃ’ to denote
  ultimate realization.

  *Divergence:* While 1.24 speaks of a general quality, 1.25 specifies omniscience,
  thereby narrowing the scope to a particular faculty of the Antahkarana.


  **Sāṃkhya Karika 2.1:** Both texts assert that the ultimate limit of a quality is
  found in purusha, not in prakṛti.

  *Divergence:* The Karika frames this as a metaphysical principle, whereas the Yoga
  Sūtra presents it as a practical sūtra for meditation.


  **Dvivedi Commentary on YS 1.25:** Dvivedi echoes the Yoga Sūtra’s claim that the
  divine is the limit of omniscience.

  *Divergence:* Dvivedi adds a critical note on the lack of proof, which the Sūtra
  itself does not address.'
voice_of_siva: The passage asserts that in the supreme reality the seed of omniscience
