sutra_id: YS_2_13
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Root, Fruition, and Karma
sanskrit: सति मूल तद्विपाको जत्यायुर्भोगाः
transliteration: sati mūle tadvipāko jātyāyurbhogāḥ
translation: The root exists; its fruition follows the karma, consisting of class,
  life, and experience.
commentary: 'The passage asserts that the presence of the root (the inherent nature
  of the soul) guarantees the fruition of karma, which manifests in three interrelated
  realms: class (samskara‑based social rank), life (duration of existence), and experience
  (the qualitative nature of sensations). This triadic structure is a hallmark of
  the Sāṃkhya‑Yoga synthesis, where prakṛti’s three gunas produce a spectrum of experiences
  that are ultimately bound to puruṣa’s ignorance. The claim that the root itself
  is the guarantor of fruition challenges the notion that karma alone determines outcomes;
  instead, the root’s inherent nature (the unchanging puruṣa) is the underlying substrate
  that receives the karmic imprint. The Dvivedi commentary’s emphasis on “class” as
  a multi‑layered concept—spanning birth, rank, and order—mirrors the Sāṃkhya idea
  of vyavahāra (social function) as a manifestation of karma. This insight invites
  practitioners to recognize that their social roles, longevity, and sensory content
  are not random but are conditioned by their past actions, yet they are also mediated
  by the unaltered consciousness that observes them. In existential terms, this means
  that while one cannot escape the karmic consequences, one can cultivate awareness
  (citta‑pratibimba) to see the root’s presence and thereby reduce the binding effect
  of the fruitions. The passage therefore serves as a reminder that the root’s continuity
  is the key to transcending the threefold fruition, aligning with the ultimate yogic
  aim of liberation (moksha).


  Key Terms


  **mūla (मूल)** — root -> the inherent nature of puruṣa; default translation ‘root’
  misses its ontological role as the unchanging substratum of all experience


  **tadvipāka (तद्विपाकः)** — fruition -> the resultant effect of karma; tradition
  sees it as the conditioned manifestation of prakṛti, not merely a passive outcome


  **jatyāyur (जत्यायु)** — class -> social rank, birth, and order; tradition interprets
  it as the karmic imprint on societal function, beyond mere birth order


  **bhogāḥ (भोगाः)** — experience -> the qualitative aspect of sensations; tradition
  links it to the three gunas shaping subjective experience


  Cross-Tradition Resonances


  **Yoga‑Sūtra 2.13:** The triadic structure (class, life, experience) mirrors the
  Sāṃkhya tri‑gunic manifestation of prakṛti, where each gunā produces a distinct
  experiential domain.

  *Divergence:* While Sāṃkhya treats the gunas as independent, the Sūtra unites them
  under the single fruition of karma, suggesting a more integrated causal chain


  **Bāṇāyaṇa, Vāg‑Sūtra 2.13:** Bāṇāyaṇa’s commentary emphasizes the root’s role as
  the guarantor of fruition, paralleling the Sūtra’s assertion of the root’s primacy.

  *Divergence:* Bāṇāyaṇa expands on the social implications of class, whereas the
  Sūtra remains concise, focusing on the causal relationship


  **Dvivedi, Commentary on Yoga‑Sūtra 2.13:** Dvivedi’s elaboration on class as rank,
  birth, and order echoes the Sūtra’s terse mention of ‘class’ as a multi‑layered
  concept.

  *Divergence:* Dvivedi introduces the idea of ‘orders and genera’ which the Sūtra
  does not explicitly mention, thereby broadening the interpretive horizon


  **Śaṅkara, Bṛhad‑Bhaṣya 4.1.1:** Śaṅkara’s discussion of the root (mūla) as the
  substratum of consciousness parallels the Sūtra’s claim of the root’s existence
  ensuring fruition.

  *Divergence:* Śaṅkara frames the root within a metaphysical ontology of puruṣa‑prakṛti
  dualism, whereas the Sūtra presents it as a pragmatic causal principle'
