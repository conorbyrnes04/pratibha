sutra_id: YS_1_38
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Concentration on Deep Sleep
sanskrit: सपनानिद्राज्ञानालम्बनं वा
transliteration: svapnanidrājñānālambanaṃ vā
translation: You concentrate the mind on the state of deep sleep or on the state of
  knowledge that supports it.
commentary: 'The sūtra asserts that the mind may be fixed upon either the condition
  of deep sleep or the knowledge that sustains it, thereby offering two distinct objects
  for samādhi. The first object—deep sleep—is a state in which the mind is free from
  the fluctuations of the senses; the second—knowledge—is the underlying awareness
  that maintains that state. This duality reflects a core Sāṃkhya distinction: the
  passive, unchanging puruṣa (the observer) and the active, changing prakṛti (the
  observed). By directing attention to either the cessation of vṛtti or to the sustaining
  cognition, the practitioner engages both the observer and the observed, thereby
  dissolving the illusion of duality. The Dvivedi commentary’s emphasis on training
  the imagination aligns with the idea that the mind’s habitual patterns (vṛtti) can
  be reoriented toward a higher object. In practice, this means that one may either
  sit in the stillness of deep sleep or meditate on the very awareness that keeps
  the mind from slipping into ordinary waking or dreaming. The philosophical claim
  here is that samādhi is not a single fixed state but a dynamic alignment of the
  mind with either the cessation of fluctuation or the sustaining cognition, thereby
  allowing the practitioner to transcend the ordinary dualities of experience.


  Key Terms


  **citta (चित्त)** — citta: ‘mind’ in its totality; in Sāṃkhya, the field of experience;
  in Yoga, the locus of vṛtti and the seat of samādhi


  **vṛtti (वृत्ति)** — vṛtti: ‘fluctuation’ or ‘mental modification’; the dynamic
  process that obscures puruṣa’s pure awareness


  **samādhi (समाधि)** — samādhi: the state of absorption where citta is fixed on an
  object, dissolving vṛtti


  **īśvara (ईश्वर)** — īśvara: the supreme, unchanging consciousness; in this sūtra,
  the ultimate object of concentration that transcends both sleep and waking


  Cross-Tradition Resonances


  **Yoga Sūtra 1.38:** Object of concentration is either a state (sleep) or a sustaining
  cognition—structural homology with YS 1.35 where the object is the mind itself

  *Divergence:* While 1.35 fixes the mind as object, 1.38 allows a more dynamic choice,
  reflecting the dual nature of consciousness


  **Sāṃkhya Karika 2.3:** Distinction between puruṣa and prakṛti mirrors the dual
  objects of 1.38

  *Divergence:* Karika presents them as ontological categories, whereas 1.38 presents
  them as experiential objects for meditation


  **Dvivedi, Commentary on YS 1.38:** Dvivedi interprets deep sleep as a training
  ground for imagination, echoing the idea of using vṛtti as a tool

  *Divergence:* Dvivedi’s focus on imagination diverges from the sūtra’s neutral stance
  on the object’s nature'
voice_of_siva: The sūtra asserts that the mind may be fixed upon either the condition
  of deep sleep or the knowledge that sustains it, thereby offering two distinct objects
  for samādhi.
abhyasa: You focus the mind on the stillness of deep sleep or on the knowledge that
  sustains it, letting all thoughts fall away.
