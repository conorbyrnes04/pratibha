sutra_id: YS_4_23
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Mind‑Seer Coloration
sanskrit: दर्श्तृदृश्योपरक्तं चित्तं सर्वार्थम्
transliteration: draṣṭṛdṛśyoparaktaṃ cittaṃ sarvārtham
translation: The mind‑stuff, when colored by both the Seer and the seen, becomes all‑thing.
commentary: 'The central claim of this sutra is that the mind‑field (citta) is not
  a passive receptacle but an active participant whose very identity is co‑constituted
  by the duality of Seer (dṛṣṭṛ) and seen (dṛśya). The contested move here is the
  assertion that the act of ‘coloration’ (uparaktam) is not merely a metaphorical
  embellishment but a ontological shift that transforms citta from a neutral medium
  into a unified ‘all‑thing’ (sarva‑artham). In the Yoga and Sāṃkhya traditions, citta
  is traditionally seen as a passive, fluctuating organ of consciousness; this sutra
  re‑frames it as an active, self‑transforming field that, when illuminated by the
  duality of observer and observed, subsumes all objects into a single experiential
  reality. This has profound existential implications: it suggests that liberation
  (kaivalya) is achieved not by detaching from objects, but by recognizing that the
  very field that perceives and is perceived is the field of all objects. The Satchidananda
  commentary’s note that the mind‑stuff “understands everything” echoes this idea,
  underscoring the inseparability of perception and content. By foregrounding the
  duality of Seer and seen, the sutra invites practitioners to witness how their own
  mind‑field is constantly being dyed by the interplay of observation and observation‑object,
  thereby revealing the path to dissolving the illusion of separateness.


  Key Terms


  **dṛṣṭṛ (दर्श्तृ)** — root: dṛś- ‘to see’; in Sāṃkhya, the pure, unchanging consciousness
  (purūṣa) that observes; here it is the active agent of coloration, moving beyond
  the passive observer role


  **dṛśya (दृश्य)** — root: dṛś- ‘to see’; in Sāṃkhya, the manifested world (prakṛti)
  that is perceived; here it is the object that co‑creates the field of citta


  **citta (चित्त)** — mind‑stuff; in Sāṃkhya, the organ of consciousness that experiences
  vṛtti; here it is the medium that becomes all‑thing when colored


  **uparaktam (उपरक्तम्)** — from upar‑ ‘above’ + kāt- ‘to cut’; literally ‘cut above’;
  in this sutra it denotes the act of being dyed or transformed, implying an ontological
  shift rather than mere metaphor


  Cross-Tradition Resonances


  **Yoga Sūtra 2.35:** Both sutras describe the mind‑field as a medium that is transformed
  by the duality of observer and observed; 2.35 speaks of the mind’s ability to become
  a single point of perception, while 4.23 specifies the coloration process

  *Divergence:* 2.35 focuses on the unification of perception, whereas 4.23 emphasizes
  the ontological change (coloration) that makes the mind itself the object


  **Sāṃkhya Kārikā 1.5:** The Kārikā presents citta as a passive organ of consciousness;
  4.23 re‑conceptualizes it as an active, self‑transforming field

  *Divergence:* The Kārikā’s passive view is challenged by the sutra’s claim that
  coloration is an active, self‑initiated process


  **Bhaṭṭa’s Yoga Vārttika 5.12:** Both texts discuss the role of the Seer in the
  process of liberation; Bhaṭṭa emphasizes the Seer’s detachment, while 4.23 highlights
  the Seer’s active coloration of citta

  *Divergence:* Bhaṭṭa’s detachment is a passive stance, whereas 4.23 proposes an
  active, transformative engagement


  **Satchidananda Commentary 4.23:** The commentary notes that the mind‑stuff understands
  everything, aligning with the sutra’s claim of all‑thing identity

  *Divergence:* The commentary simplifies the process to understanding, whereas the
  sutra explicitly frames it as a coloration act'
