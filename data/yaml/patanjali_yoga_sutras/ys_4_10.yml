sutra_id: YS_4_10
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Endless Desires of Impressions
sanskrit: तसाम् अनादित्वं चाशिषः नित्यत्वात्
transliteration: tāsām anāditvaṃ cāśiṣo nityatvāt
translation: For these impressions, the desire to live is beginningless, arising from
  eternality.
commentary: 'The sūtra asserts that the desire to live (āśiṣḥ) associated with impressions
  (tāsām) is devoid of a beginning, yet it emanates from an eternal principle. This
  juxtaposition foregrounds the paradox central to Sāṃkhya‑Yoga: the finite, ever‑changing
  realm of prakṛti (the material world) is sustained by an uncaused, timeless source—often
  identified with puruṣa or īśvara. By declaring the desire to live as anāditvaṃ,
  the text denies any causal chain within the material realm, thereby elevating the
  transcendental principle as the true origin. The claim that this desire arises from
  nityatvāt (eternality) reinforces the idea that the material world, though bound
  by time, is ultimately a manifestation of the eternal. In practice, this insight
  invites the practitioner to recognize that the incessant craving for existence is
  not a self‑generated impulse but a reflection of an underlying, unchanging reality.
  By observing this, one can begin to detach from the illusion of temporal causality
  and cultivate a state of samādhi where the mind rests upon the eternal, leading
  toward kaivalya (liberation).


  Key Terms


  **tāsām (तसाम्)** — plural of tva (this), referring to the impressions; denotes
  the objects of the mind’s activity


  **anāditvaṃ (अनादित्वं)** — ‘beginninglessness’; from an- (not) + aditi (beginning)
  + -tva (nominalizer); indicates that the desire has no causal origin within prakṛti


  **āśiṣḥ (आशिषः)** — ‘desire to live’; a verb root āśi (to desire) + -ṣ (inflection)
  + -ḥ (nominalizer); signifies the persistent yearning that animates the mind


  **nityatvāt (नित्यत्वात्)** — from nitya (eternal) + -tva (nominalizer) + at (from);
  meaning ‘from eternality’; points to the source of the desire as the eternal principle


  Cross-Tradition Resonances


  **Yoga Sūtra 4.10:** Both the sūtra and the preceding 4.9 emphasize the causal status
  of the mind’s activity, yet 4.10 uniquely introduces the concept of anāditvaṃ, breaking
  from the earlier causal chain and pointing to the transcendental source

  *Divergence:* While 4.9 treats the mind’s activity as contingent, 4.10 asserts its
  origin in an eternal principle, marking a shift from empirical causality to metaphysical
  grounding


  **Sāṃkhya Kāṇḍa 1.1:** The notion of anāditvaṃ parallels the Sāṃkhya claim that
  puruṣa is uncaused, yet here it is applied to the desire within the mind rather
  than to puruṣa itself

  *Divergence:* Sāṃkhya treats puruṣa as the sole uncaused entity, whereas the sūtra
  extends this uncaused status to the desire, thereby integrating the mind’s activity
  into the transcendental schema


  **Yoga Sūtra 2.23:** Both passages discuss the nature of the mind’s activity (citta)
  and its relation to prakṛti

  *Divergence:* 2.23 focuses on the mind’s ignorance and its causal chain, while 4.10
  bypasses ignorance and directly attributes the desire to eternality, suggesting
  a more direct path to liberation'
voice_of_siva: The sūtra asserts that the desire to live (āśiṣḥ) associated with impressions
  (tāsām) is devoid of a beginning, yet it emanates from an eternal principle.
abhyasa: Observe the desire to live arising in your mind; note its lack of a discernible
  beginning, and recognize that it springs from an eternal source, allowing you to
  detach and rest in the present moment.
