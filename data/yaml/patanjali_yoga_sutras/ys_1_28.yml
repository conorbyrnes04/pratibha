sutra_id: YS_1_28
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Repetition as Meditative Practice
sanskrit: तज्जपः तदर्थभावनम्
transliteration: tajjapas tadarthabhāvanam
translation: You repeat the word, and you meditate upon its meaning.
commentary: 'The central claim of this sutra is that the practice of japa—repetition
  of a word or syllable—must be coupled with a sustained, intentional meditation on
  its significance. It is not enough to merely utter the mantra; the mind must be
  continuously engaged in contemplating the word’s essence, thereby transforming the
  act of repetition into a vehicle for inner inquiry. This stance aligns with the
  broader Samkhya‑Yoga framework, where the mind’s fluctuations (vṛtti) are subdued
  through focused attention. By insisting that japa be accompanied by deliberate reflection,
  the sutra delineates a method that bridges the external ritual of recitation with
  the internal process of self‑investigation, a hallmark of the Yoga path. The Dvivedi
  commentary echoes this by emphasizing the need for a “mental” (manasa) mode of repetition
  that persists even during work or sleep, underscoring the sutra’s call for continuous
  awareness. In practice, this means that each utterance becomes a point of inquiry,
  allowing the practitioner to observe how the mind attaches to the word’s meaning
  and thereby to the underlying puruṣa‑prakṛti distinction. The existential payoff
  is a gradual dissolution of vṛtti, paving the way toward samādhi, the stillness
  of the mind, where the distinction between the observer and the observed blurs.
  Thus, this sutra is not merely a procedural instruction; it is a philosophical injunction
  that situates japa as a disciplined meditation capable of transforming ordinary
  speech into a means of realizing the self’s true nature.


  Key Terms


  **japa (जप)** — japa (IAST) -> जप (Devanagari) -> ‘repetition’; in Yoga, it is a
  disciplined recitation that, when coupled with meditation, becomes a tool for subduing
  the mind’s fluctuations


  **artha (अर्थ)** — artha (IAST) -> अर्थ (Devanagari) -> ‘meaning’; in Samkhya‑Yoga,
  it denotes the significance or purpose that grounds the practice


  **bhavana (भावन)** — bhavana (IAST) -> भावन (Devanagari) -> ‘mental activity or
  cultivation’; here it refers to the sustained contemplation of the word’s meaning


  **samādhi (समाधि)** — samādhi (IAST) -> समाधि (Devanagari) -> ‘concentration or
  absorption’; the ultimate goal that this sutra helps to approach


  Cross-Tradition Resonances


  **Yoga Sūtra 1.23:** Both sutras emphasize the necessity of intent (cintā) in the
  practice of japa; 1.23 states that one must ‘intend’ the word, while 1.28 adds that
  one must also ‘meditate upon its meaning’

  *Divergence:* 1.23 focuses on the external act of intention, whereas 1.28 shifts
  the focus inward, demanding continuous mental engagement


  **Yoga Sūtra 1.30:** 1.30 discusses the ‘constant repetition’ of the word, paralleling
  1.28’s mention of continuous japa

  *Divergence:* 1.30 does not explicitly link repetition to meaning, making its instruction
  more procedural; 1.28’s linkage introduces a qualitative dimension


  **Bhaṭṭa’s Commentary on the Yoga Sūtra 1.28:** Bhaṭṭa notes that japa should be
  performed with a ‘mindful’ (manasa) attitude, similar to Dvivedi’s emphasis

  *Divergence:* Bhaṭṭa’s commentary frames the mental attitude as a prerequisite,
  whereas 1.28 presents it as an outcome of the practice


  **Patanjali’s Samkhya Karika 1.1:** Both texts discuss the role of the mind’s fluctuations
  (vṛtti) and the need to subdue them

  *Divergence:* Samkhya Karika offers a theoretical account of vṛtti, while 1.28 provides
  a concrete meditative technique to address it'
