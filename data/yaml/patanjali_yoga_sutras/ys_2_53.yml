sutra_id: YS_2_53
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Mind‑Focus and Fitness
sanskrit: धारणाः च योग्यता मनसः
transliteration: dhāraṇāsu ca yogyatā manasaḥ
translation: The mind, when it is focused, becomes fit for action.
commentary: 'The central claim of this verse is that the capacity for action (yogyatā)
  is not an inherent trait but arises from the disciplined application of attention
  (dhāraṇā). In the Yoga and Sāṃkhya traditions, the mind’s fluctuations (vṛtti) are
  the primary obstacles to liberation; thus, cultivating a steady focus is the first
  practical step toward stilling those fluctuations. The verse does not merely prescribe
  concentration; it posits that concentration itself is the *condition* that renders
  the mind capable of purposeful activity. This is a contested move: some commentators
  treat dhāraṇā as a passive state, while here it is an active, skillful practice
  that transforms the mind’s nature. The implication for the practitioner is that
  by training the mind to remain on a single object, one gradually erodes the habitual
  patterns that keep the mind in motion, thereby opening the path to samādhi. In the
  broader Sāṃkhya framework, this aligns with the idea that puruṣa’s liberation depends
  on detaching from prakṛti’s activity; dhāraṇā is the means by which puruṣa withdraws
  from the influence of prakṛti. The verse also anticipates later Yoga texts that
  emphasize the importance of *yoga* as a disciplined practice, underscoring that
  the mind’s fitness for action is inseparable from its disciplined cultivation.


  Key Terms


  **dhāraṇā (धारणाः)** — ‘holding’ or ‘concentration’ -> in Sāṃkhya, the skillful
  application of attention that subdues vṛtti; the default translation ‘focus’ misses
  the active, transformative aspect


  **yogyatā (योग्यता)** — ‘fitness for action’ -> in Yoga, the readiness of the mind
  to engage in disciplined practice; default ‘ability’ overlooks its dependence on
  dhāraṇā


  **manasaḥ (मनसः)** — ‘the mind’ -> in Sāṃkhya, the field of vṛtti; default ‘mind’
  ignores its role as the locus of both activity and potential stillness


  Cross-Tradition Resonances


  **Yoga Sūtra 2.53:** directly states that focused mind becomes fit for action

  *Divergence:* none, foundational statement


  **Yoga Sūtra 1.2:** ‘Yoga is the stilling of the fluctuations of the mind’

  *Divergence:* here the emphasis is on the *condition* (dhāraṇā) that enables stillness,
  not merely the result


  **Samkhya Karika 2.3:** ‘The mind is the instrument of prakṛti’s activity’

  *Divergence:* this verse reframes the mind as capable of self‑regulation through
  dhāraṇā, contrary to the Karika’s passive description


  **Hatha Yoga Pradipika 1.1:** ‘Concentration is the first step toward mastery of
  the body’

  *Divergence:* the Sūtra focuses on mental fitness for action, while the Pradipika
  links concentration directly to physical control'
voice_of_siva: The central claim of this verse is that the capacity for action (yogyatā)
  is not an inherent trait but arises from the disciplined application of attention
  (dhāraṇā).
abhyasa: You sit in a comfortable posture, close your eyes, and bring your attention
  to the breath; as thoughts arise, gently return focus to the breath, repeating this
  for ten minutes each day.
