sutra_id: YS_3_44
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Purification of the Body’s Subtle Aspect
sanskrit: स्ठूलस्वरूपसूक्ष्माण्वयार्थवत्त्वसंयमाद् भूतजयः
transliteration: sthūlasvarūpasūkṣmānvayārthavattvasaṃyamād bhūtajayaḥ
translation: The body, when its subtle aspects are purified, conquers all existence.
commentary: 'The central claim of this sutra is that the body’s subtle qualities,
  once aligned with the principle of restraint (saṃyama), become capable of transcending
  the entire realm of being. In the Yoga and Sāṃkhya traditions, the body (puruṣa)
  is not merely a physical vessel but a complex interplay of subtle elements (sūkṣma)
  that are ordinarily obscured by the mind’s fluctuations (vṛtti). Here, the sutra
  asserts that by applying saṃyama to the body’s subtle aspects—those that are “unidentified”
  (akalpitā) and “external” (bahī) relative to the body’s primary form—the veil that
  hides the Self’s light is removed. This process is not a mere intellectual exercise;
  it is an existential act of aligning the body’s subtle energies with the higher
  consciousness (īśvara). The sutra’s mention of “bhūtajayaḥ” (conquest of all existence)
  signals that the body, once purified, can overcome not only the material world but
  also the mental and karmic entanglements that bind the practitioner. The Satchidananda
  commentary’s emphasis on the “great bodilessness” (mahā‑videhā) underscores that
  the body’s subtle purification is a step toward recognizing its non‑bodily nature,
  thereby dissolving the illusion of separateness. Thus, the sutra invites practitioners
  to see the body as a dynamic instrument of liberation, whose subtle aspects, when
  disciplined, become a conduit for the Self’s illumination.


  Key Terms


  **saṃyama (समायाम)** — saṃyama (साम्य) -> restraint or moderation; in Yoga, the
  disciplined control of mind and body; default translation often ‘restraint’ misses
  its dynamic, integrative quality.


  **vṛtti (वृत्ति)** — vṛtti (वृत्ति) -> fluctuation or activity of mind; in Sāṃkhya,
  the mental modifications that obscure pure consciousness; default translation ‘thought
  wave’ omits its continuous, oscillatory nature.


  **purusha (पुरुष)** — purusha (पुरुष) -> consciousness or soul; in Yoga, the observer
  distinct from prakṛti; default translation ‘self’ lacks the dualistic nuance.


  **prakṛti (प्रकृति)** — prakṛti (प्रकृति) -> primal matter; in Sāṃkhya, the dynamic,
  evolving base of all phenomena; default translation ‘nature’ obscures its generative,
  mutable character.


  Cross-Tradition Resonances


  **Yoga‑Sūtra 1.2:** Both sutras invoke saṃyama as the means to subdue the mind’s
  fluctuations; the structure ‘saṃyama ... vṛtti’ parallels the earlier injunction
  to control the mind’s activity.

  *Divergence:* While 1.2 focuses on mental discipline, 3.44 extends the concept to
  the body’s subtle aspects, thereby broadening the scope of saṃyama from mind alone
  to the entire embodied consciousness.


  **Bhaṭṭāyana 1.1.2:** The phrase ‘bhūtajayaḥ’ echoes Bhaṭṭāyana’s assertion that
  true mastery over existence is achieved through disciplined practice; both employ
  a compound that signifies conquest of all beings.

  *Divergence:* Bhaṭṭāyana’s context is purely philosophical, whereas 3.44 applies
  the idea concretely to bodily purification, linking metaphysical victory to physical
  practice.'
voice_of_siva: The central claim of this sutra is that the body’s subtle qualities,
  once aligned with the principle of restraint (saṃyama), become capable of transcending
  the entire realm of being.
abhyasa: You now align your breathing with the subtle sensations of your body, consciously
  restraining any external thoughts that arise, so that the light of your true self
  becomes visible.
