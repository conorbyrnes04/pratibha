sutra_id: YS_2_10
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Suppressing Subtle Distractions
sanskrit: ते प्रतिप्रसवहेयाः सूक्ष्माः
transliteration: te pratiprasavaheyāḥ sūkṣmāḥ
translation: These subtle distractions must be suppressed.
commentary: 'The sutra asserts that the most insidious disturbances are the subtle
  ones, and that their suppression is the primary task of the practitioner. The claim
  is that subtle vṛtti—those impressions that lie dormant in the mind—require a method
  that is itself contrary to their nature. This is a contested move: while the Sāṃkhya‑Yoga
  school traditionally treats vṛtti as a function of prakṛti, the sutra insists that
  the practitioner must actively negate these impressions rather than merely observe
  them. The commentary aligns with the Sāṃkhya view that the mind (citta) is a manifestation
  of prakṛti, yet it diverges by prescribing a proactive technique—merging the mind
  into the pure sense of being (īśvara) in prakṛti—rather than passive contemplation.
  The existential implication is that the subtle distractions are the root of ignorance;
  by suppressing them, one restores the mind’s natural clarity, enabling samādhi.
  This aligns with the broader Yoga aim of liberating the puruṣa from prakṛti’s bondage.
  The sutra’s brevity masks a profound methodological shift: it moves from passive
  awareness to active negation, thereby offering a concrete practice for the yogi
  to reclaim the mind’s original state.


  Key Terms


  **pratiprasavaheyāḥ (प्रतिप्रसवहेयाः)** — prati- (against) + prasava (origin, emanation)
  + -heyāḥ (possessive suffix). Traditionally means ‘those that arise in opposition
  to the original emanation’. Here it denotes subtle vṛtti that arise counter to the
  natural state of the mind.


  **sūkṣmāḥ (सूक्ष्माः)** — from sūkṣma ‘fine, subtle’. In Yoga, it refers to the
  subtle impressions (vṛtti) that are not immediately perceptible but influence cognition.
  The sutra’s use underscores their hidden potency.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.9:** Both sutras identify subtle vṛtti as the primary obstacle; 2.9
  lists the types, while 2.10 prescribes suppression.

  *Divergence:* 2.9 merely enumerates, whereas 2.10 prescribes a contrary course—merging
  the mind—highlighting a shift from diagnosis to prescription.


  **Yoga Sūtra 2.11:** 2.11 speaks of ‘gross’ vṛtti that are overtly manifest; 2.10
  focuses on the subtle ones.

  *Divergence:* The structural homology lies in the sequence (subtle, gross, then
  suppression), but 2.11’s emphasis on external manifestations contrasts with 2.10’s
  internal negation.


  **Sāṃkhya Karika 2:** Both treat vṛtti as arising from prakṛti; the Karika explains
  the causal chain.

  *Divergence:* The Karika offers a purely theoretical account, whereas the sutra
  demands an active yogic intervention.


  **Bhaṭṭa’s Commentary on YS 2.10:** Bhaṭṭa elaborates the method of merging the
  mind into īśvara.

  *Divergence:* While Bhaṭṭa’s text is more detailed, the sutra’s terse wording leaves
  the method implicit, inviting personal interpretation.'
voice_of_siva: The sutra asserts that the most insidious disturbances are the subtle
