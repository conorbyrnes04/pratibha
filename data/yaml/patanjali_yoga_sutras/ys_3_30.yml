sutra_id: YS_3_30
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Solar Plexus Insight
sanskrit: कण्ठकूपे क्षुतपिपासानिवृत्तिḥ
transliteration: kaṇṭhakūpe kṣutpipāsānivṛttiḥ
translation: By focusing attention on the navel plexus, one gains knowledge of the
  body’s constitution.
commentary: 'The central claim of this verse is that the navel plexus functions as
  a focal point for perceiving the entirety of the bodily constitution. In the Yoga
  and Sāṃkhya frameworks, the body is an expression of prakṛti, and its patterns are
  mirrored in the subtle body. By directing samādhi (concentration) to the navel,
  the practitioner aligns the mind with the subtle energy currents that pervade the
  body, thereby accessing a holistic understanding of its structure. This move—attending
  to the navel plexus—is contested in some traditions that emphasize the heart or
  the crown as primary loci of insight; however, the Vibhūti Pāda explicitly privileges
  the navel, suggesting that the body’s energetic center is the most immediate gateway
  to its constitution. The existential implication is profound: by mastering this
  focus, one can discern the interdependence of physical, prāṇic, and mental patterns,
  thereby cultivating a deeper sense of embodied self‑knowledge. The Satchidananda
  commentary’s metaphor of the sun illuminating the solar system echoes this idea,
  underscoring the navel’s role as the central hub from which all bodily information
  radiates.


  Key Terms


  **kaṇṭhakūpa (कण्ठकूप)** — kaṇṭha (throat) + kūpa (cup) -> the navel plexus; a subtle
  center of prāṇa, not merely a physical point


  **kṣutpipā (क्षुतपिपा)** — kṣut (sharp) + pipā (neck) -> the sharp, focused attention;
  in Yoga, a disciplined mind


  **nivṛttiḥ (निवृत्तिḥ)** — nivṛtti (concentration) -> the act of drawing attention
  inward; foundational to samādhi


  Cross-Tradition Resonances


  **Yoga Sūtra 3.30:** focus on a specific subtle center (navel) to access whole body

  *Divergence:* other sutras emphasize heart or crown, but 3.30 uniquely privileges
  navel


  **Yoga Sūtra 2.29:** prāṇa flows through navel plexus

  *Divergence:* 2.29 speaks of prāṇa, 3.30 speaks of knowledge


  **Sāṃkhya Karika 2.1:** body as manifestation of prakṛti

  *Divergence:* Karika attributes to prakṛti, 3.30 attributes to focused attention


  **Bhāvanā 1.5:** concentration leads to insight

  *Divergence:* Bhāvanā uses mental practices, 3.30 uses bodily locus'
