sutra_id: YS_3_38
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Superphysical Senses as Obstacles
sanskrit: बन्धकारणाशिथिल्यत् प्रचारा-संवेदनाच् च चित्तस्य परशरीरावेशः
transliteration: bandhakāraṇaśaithilyāt pracārasaṃvedanāc ca cittasya paraśarīrāveśaḥ
translation: The superphysical senses, when lax, become the very external sensations
  that bind the mind.
commentary: 'The passage asserts that the superphysical senses—those that arise from
  the subtle body—act as a binding force on the mind when they are not disciplined.
  In the Yoga and Sāṃkhya framework, the mind (citta) is the arena where prakṛti’s
  vṛtti (mental modifications) play out. Here, the superphysical senses are identified
  as the source of vṛtti that entangles citta, preventing it from attaining samādhi,
  the state of complete absorption. The claim is that these senses are not merely
  passive receptors but active obstacles that must be subdued. The contested move
  is the identification of the superphysical senses as the very same forces that,
  when controlled, become siddhis—powers that can be harnessed for worldly pursuits.
  This duality reflects the Sāṃkhya notion that prakṛti’s elements can be both the
  cause of bondage and the means of liberation when understood correctly. The existential
  implication is that one must cultivate awareness of these subtle sensations and
  practice their restraint to free citta from vṛtti, thereby achieving samādhi. The
  passage invites the practitioner to see the superphysical senses not as external
  hindrances but as internal instruments that, if mastered, can be turned into siddhis
  for ethical living and spiritual progress.


  Key Terms


  **citta (चित्त)** — citta: mind; in Sāṃkhya, the observer; here, the mind bound
  by superphysical senses


  **vṛtti (वृत्ति)** — vṛtti: mental modifications; the fluctuations that bind citta


  **samādhi (समाधि)** — samādhi: absorption; the goal of Yoga where citta is free
  from vṛtti


  **prakṛti (प्रकृति)** — prakṛti: primordial nature; source of vṛtti and superphysical
  senses


  Cross-Tradition Resonances


  **Yoga Sūtra 3.38:** identifies superphysical senses as binding forces on citta

  *Divergence:* Unlike later commentaries that treat them as mere obstacles, this
  sūtra frames them as potential siddhis when controlled


  **Yoga Sūtra 2.1:** establishes the role of vṛtti in binding citta

  *Divergence:* Here the focus shifts from general vṛtti to specific superphysical
  senses


  **Sāṃkhya Karika 1.4:** defines prakṛti as source of vṛtti

  *Divergence:* The sūtra emphasizes the sensory aspect rather than the elemental
  composition


  **Yoga Sūtra 3.39:** continues discussion of obstacles to samādhi

  *Divergence:* This sūtra uniquely links the obstacles to the superphysical senses,
  a nuance expanded in subsequent verses'
voice_of_siva: The passage asserts that the superphysical senses—those that arise
  from the subtle body—act as a binding force on the mind when they are not disciplined.
abhyasa: Notice your subtle bodily sensations; consciously withdraw attention from
  them to prevent them from binding your mind.
