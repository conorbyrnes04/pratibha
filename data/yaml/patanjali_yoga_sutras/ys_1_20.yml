sutra_id: YS_1_20
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Faith, Energy, and Samadhi
sanskrit: श्रद्धावीर्यस्मृतिसमाधिप्रज्ञापूर्वक इतरेषाम्
transliteration: śraddhāvīryasmṛtisamādhiprajñāpūrvaka itareṣām
translation: In others, the state of samadhi is preceded by faith and energy. The
  presence of faith and energetic action recalls prior knowledge, enabling discrimination
  and ultimately leading to the highest samadhi.
commentary: 'The sūtra asserts that samadhi is not an isolated, spontaneous attainment
  but a culmination of a preparatory chain: faith (श्रद्धा) and energy (वीर्य). This
  claim situates samadhi within the Sāṃkhya–Yoga framework where the mind’s vṛtti
  (mental modifications) are subdued by a firm conviction in the efficacy of practice.
  The sūtra’s wording—‘in others’—highlights that samadhi is a state achieved by many,
  not a solitary, mystical event. It thereby democratizes the experience: anyone who
  cultivates faith and energy can access samadhi. The contested move here is the ordering
  of faith before energy; traditional commentaries sometimes reverse or merge these
  qualities. By foregrounding faith, the sūtra aligns with the Sāṃkhya notion that
  the intellect (buddhi) must first be convinced (śraddhā) before it can mobilize
  the subtle body (prāṇas) into energetic action (वीर्य). This sequence mirrors the
  yogic path of puruṣa (consciousness) overcoming prakṛti (nature) through disciplined
  practice. Existentially, the passage invites practitioners to recognize that the
  initial spark of conviction is the gateway to deeper meditative absorption. The
  Dvivedi commentary’s emphasis on “memory, deserialization” echoes the idea that
  recollection of prior learning (prajñā) is rekindled by faith, reinforcing the cyclical
  nature of learning and realization. Thus, the sūtra offers a pragmatic roadmap:
  cultivate unwavering faith, channel that conviction into vigorous practice, and
  let the mind’s prior knowledge resurface, guiding you toward samadhi.


  Key Terms


  **śraddhā (श्रद्धा)** — etymology: ‘to believe’ → Sāṃkhya concept of firm conviction
  in the efficacy of practice → captures the motivational force often omitted in simple
  translations of ‘faith’


  **वीर्य (वीर्य)** — etymology: ‘energy, vigor’ → Sāṃkhya notion of prāṇic force
  mobilized by conviction → distinguishes between passive faith and active practice


  **स्मृति (स्मृति)** — etymology: ‘memory’ → Sāṃkhya idea of recollection of past
  samādhi states → links to the ‘recall of prior knowledge’ in the sūtra


  Cross-Tradition Resonances


  **Yoga Sūtra 1.20:** Structural homology: antecedent qualities (faith, energy) precede
  the target state (samadhi)

  *Divergence:* Unlike later sutras where samadhi is described as spontaneous, here
  it is explicitly conditioned


  **Yoga Sūtra 1.24:** Both sutras list preparatory states leading to samadhi

  *Divergence:* 1.24 emphasizes ‘pratyāhāra’ and ‘pratyakṣa’ while 1.20 focuses on
  faith and energy, showing a shift from internal withdrawal to external conviction


  **Katha Upanishad 2.2:** Both texts link faith (śraddhā) with realization

  *Divergence:* Katha presents faith as a response to divine instruction, whereas
  1.20 presents it as an internal catalyst'
voice_of_siva: 'The sūtra asserts that samadhi is not an isolated, spontaneous attainment
  but a culmination of a preparatory chain: faith (श्रद्धा) and energy (वीर्य).'
abhyasa: You cultivate unwavering faith in yoga’s efficacy, channel that conviction
  into vigorous practice, and let the mind’s prior knowledge resurface, guiding you
  toward samadhi.
