sutra_id: YS_1_42
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Concentrated Mind and Meaning
sanskrit: तत्र शब्दार्थज्ञानविकलपैः संकीर्णा स्वितर्का समापत्तिḥ
transliteration: tatra śabdārthajñānavikalpaiḥ saṃkīrṇā savitarkā samāpattiḥ
translation: There, the concentrated mind, mixed with the word, its meaning, and understanding,
  narrows to a single point of insight.
commentary: 'The sutra asserts that samādhi is not merely a state of stillness but
  an active, focused engagement of the mind with the semantic content of a word. It
  claims that the mind’s concentration is inseparable from the triad of word (śabda),
  meaning (artha), and understanding (buddhi). This triadic engagement is the decisive
  move that transforms ordinary cognition into a refined, single-pointed awareness.
  In the Sāṃkhya‑Yoga framework, the mind’s vṛtti (mental fluctuations) are tamed
  when the citta (consciousness) is directed toward a specific semantic object, thereby
  allowing puruṣa to experience a direct, non-dual insight. The Dvivedi commentary’s
  distinction between gross and subtle samādhi aligns with this claim: the gross form
  involves the external Bhutas, while the subtle form engages the internal ToMmatras
  and indriyas. The sutra’s emphasis on the “mixed” nature of the mind’s condition
  underscores that samādhi is not a passive withdrawal but an active, intentional
  focus that dissolves the vṛtti. This has existential implications: by mastering
  the triadic focus, one can transcend the endless cycle of thoughts and achieve a
  stable, self‑realizing awareness that is the ultimate goal of yoga practice.


  Key Terms


  **samādhi (समाधि)** — etymology: ‘to settle’ -> tradition: a state of intense concentration
  where mind is unified -> default translation ‘concentration’ misses the active,
  focused engagement with meaning


  **citta (चित्त)** — etymology: ‘mind’ -> tradition: the storehouse of impressions
  and consciousness -> default translation ‘mind’ omits its role as the locus of vṛtti
  and the site of samādhi


  **vṛtti (वृत्ति)** — etymology: ‘fluctuation’ -> tradition: the mind’s wandering
  states that must be subdued -> default translation ‘fluctuation’ neglects its dynamic
  causal role in generating ignorance


  **puruṣa (पुरुष)** — etymology: ‘person’ -> tradition: the pure, unchanging consciousness
  that observes vṛtti -> default translation ‘self’ fails to convey its distinct ontological
  status


  Cross-Tradition Resonances


  **Yoga Sūtra 1.42:** The triadic focus on word, meaning, and understanding mirrors
  the Sāṃkhya idea that cognition involves a triad of pratīyogā (association) between
  puruṣa, prakṛti, and the mind’s content.

  *Divergence:* Unlike the Sāṃkhya triad, which is static, the sutra presents it as
  a dynamic, active process of concentration, highlighting the yogic agency in transforming
  vṛtti


  **Bhaṭṭa’s Ātmarūpaśāstra, §12:** Both texts treat the mind’s focus as essential
  for realizing the self, using the metaphor of a lamp’s flame being directed toward
  a single point.

  *Divergence:* Bhaṭṭa emphasizes the lamp’s inherent light, whereas the sutra stresses
  the mind’s active engagement with semantic content, thereby making the process more
  intentional


  **Dvivedi, Commentary on YS 1.42:** Dvivedi’s classification of samādhi into gross
  and subtle parallels the sutra’s implicit distinction between external and internal
  objects of focus.

  *Divergence:* Dvivedi elaborates on the objects (Bhutas vs. ToMmatras) while the
  sutra remains agnostic about the specific object, focusing instead on the method
  of concentration


  **Patanjali, Mahāyoga, 4.1:** Both Patanjali and the sutra identify the cessation
  of vṛtti as the hallmark of samādhi, using the term ‘samāpatti’ (completion).

  *Divergence:* Patanjali frames it within the eight limbs, whereas the sutra isolates
  the linguistic aspect of concentration, suggesting a more granular path'
voice_of_siva: The sutra asserts that samādhi is not merely a state of stillness but
  an active, focused engagement of the mind with the semantic content of a word.
abhyasa: Focus your mind on a single spoken word, repeatedly contemplate its meaning
  and the understanding it evokes, until your thoughts settle into a single, unwavering
  point of awareness.
