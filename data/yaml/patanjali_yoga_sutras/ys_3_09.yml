sutra_id: YS_3_09
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Transformation into Interception
sanskrit: व्यूत्थानानिरोधसंस्कारयोः अभिभवप्रादुर्भावौ नीरोधक्षणचित्तान्वयो नीरोधपरिणामः
transliteration: vyutthānanirodhasaṃskārayor abhibhavaprādurbhāvau nirodhakṣaṇacittānvayo
  nirodhapariṇāmaḥ
translation: The mind, when it undergoes the process of rising and falling, transforms
  itself into the moment of interception, a state where all further transformations
  cease and the mind becomes a still, unchanging witness.
commentary: 'The passage asserts that the mind’s continuous activity of rising and
  falling (vyutthāna‑nirōdha) culminates in a moment of interception (nirōdha‑kṣaṇa).
  This interception is not merely a pause but a profound transformation: the mind
  ceases to be a flux of impressions and becomes a static, unaltered awareness. The
  claim is that the mind’s own activity, driven by the three gunas, inevitably leads
  to a point where the mind’s own motion is halted, thereby creating a space for samādhi.
  The contested move here is the identification of the ‘interception’ with the cessation
  of all mental activity, rather than a mere suspension. In the Yoga and Sāṃkhya tradition,
  this moment is the threshold between puruṣa (the observer) and prakṛti (the material
  nature). The text aligns with the Sāṃkhya notion that the mind’s activity is a manifestation
  of prakṛti, and its cessation reveals puruṣa’s distinctness. Practically, this suggests
  that by observing the rise and fall of thoughts, one can recognize the point where
  the mind stops generating new impressions, thereby entering a state of stillness.
  Dvivedi’s commentary underscores this by describing the mind’s transformation into
  a state of interception, where distractions both rise and fall, and the mind itself
  becomes the intercepting moment. This resonates with Patanjali’s later sutra on
  samādhi, where the mind’s activity is said to be suspended, allowing the true self
  to shine forth.


  Key Terms


  **vyutthāna (व्यूत्थान)** — rise; in yoga, the upward movement of consciousness;
  here it denotes the mind’s continual rising and falling


  **nirōdha (निरोध)** — cessation; in Sāṃkhya, the stopping of prakṛti’s activity;
  here it marks the moment when the mind’s motion halts


  **kṣaṇa (क्षण)** — moment; in yoga, a point of stillness; here it specifies the
  instant of interception


  **nirōdha‑kṣaṇa (निरोधक्षण)** — the specific moment of interception, a unique concept
  in this sutra


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 3.9:** The structure mirrors the earlier sutra 3.8, which
  speaks of the mind’s rising and falling; both use the same verb vyutthāna and the
  noun nirōdha, indicating a pattern of motion and cessation.

  *Divergence:* While 3.8 describes the mind’s activity, 3.9 focuses on the resulting
  stillness, breaking the pattern by shifting from dynamic to static


  **Sāṃkhya Karika 2.1:** Both texts use nirōdha to denote the cessation of prakṛti’s
  activity, underscoring the shared metaphysics of mind and nature.

  *Divergence:* Yoga Sūtra specifies the mind’s interception, whereas Sāṃkhya Karika
  speaks of the cessation of all material activity, a broader scope


  **Dvivedi, Commentary on 3.9:** Dvivedi’s explanation of interception as the mind’s
  transformation into a still witness parallels Patanjali’s later sutra on samādhi.

  *Divergence:* Dvivedi adds the idea of rising and falling impressions, a nuance
  not present in the terse original'
voice_of_siva: The passage asserts that the mind’s continuous activity of rising and
  falling (vyutthāna‑nirōdha) culminates in a moment of interception (nirōdha‑kṣaṇa).
abhyasa: Observe your thoughts as they rise and fall; when you notice a moment where
  no new thoughts arise, rest in that stillness as the mind’s interception.
