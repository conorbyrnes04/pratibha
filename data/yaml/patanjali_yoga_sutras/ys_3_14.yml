sutra_id: YS_3_14
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Substratum’s Progressive Manifestation
sanskrit: शान्तोदिताव्यापदेःधर्मानुपाती धर्मी
transliteration: śāntoditāvyapadeśyadharmānupātī dharmī
translation: The substratum (Prakṛti) proceeds through a latent past, an arising present,
  and an unmanifested future, thereby becoming dharmī.
commentary: 'The verse asserts that the substratum itself is dharmī, i.e. it embodies
  the essential nature of reality. This is a contested move because it attributes
  the quality of dharmī—traditionally reserved for the enlightened soul—to Prakṛti,
  thereby blurring the sharp Sāṃkhya distinction between Purusha and Prakṛti. In the
  Yoga and Sāṃkhya canon, dharmī is usually the state of a soul that has realized
  its true nature. Here, however, the author claims that even the material ground
  of being, by its inherent process, attains this quality. This claim invites a re‑examination
  of the ontological hierarchy: if Prakṛti itself can be dharmī, then the distinction
  between the observer and the observed must be understood as a dynamic, not a static,
  relationship. The existential implication is that one’s own consciousness is not
  merely a passive witness but an active participant in the unfolding of Prakṛti’s
  stages. By recognizing that the substratum itself is dharmī, a practitioner learns
  that the path to liberation is not solely a matter of detaching from the world but
  of aligning with its inherent progression. The Satchidananda commentary’s observation
  that Prakṛti “goes through latent, uprising and unmanifested phases” echoes this
  idea, suggesting that the process of becoming is itself a manifestation of dharmī.
  Thus, the verse invites a holistic view where liberation is achieved by synchronizing
  one’s own awareness with the natural flow of Prakṛti, rather than opposing it.


  Key Terms


  **prakṛti (प्रकृति)** — root: ‘nature’ -> Sāṃkhya: material reality; default translation
  ‘nature’ misses its dynamic, generative aspect


  **dharmī (धर्मी)** — root: ‘lawful, righteous’ -> Sāṃkhya: state of a soul in harmony
  with its nature; default translation ‘lawful’ omits its ontological status as the
  substratum’s quality


  **vṛtti (वृत्ति)** — root: ‘movement’ -> Yoga: fluctuations of mind; default translation
  ‘movement’ overlooks its role as the mechanism of ignorance


  **samādhi (समाधि)** — root: ‘union’ -> Yoga: absorption state; default translation
  ‘union’ fails to convey its transcendental integration


  Cross-Tradition Resonances


  **Yoga Sūtra 1.2:** Both verses describe a progression of states (latent → arising
  → unmanifested) that map onto the three gunas; the structure mirrors the triadic
  unfolding of Prakṛti.

  *Divergence:* While 1.2 focuses on the mind’s vṛtti, 3.14 applies the same progression
  to Prakṛti itself, thereby extending the model beyond mental phenomena


  **Sāṃkhya Kāṇḍa 5.3:** The notion that Prakṛti undergoes stages parallels the Sāṃkhya
  account of the evolution of prakṛti through the gunas.

  *Divergence:* Sāṃkhya treats these stages as passive, whereas the Yoga Sūtra imbues
  them with an active, dharmī quality


  **Yoga Sūtra 2.1:** Both verses emphasize the importance of recognizing the substratum’s
  nature to achieve liberation.

  *Divergence:* 2.1 speaks of the mind’s ignorance of its own nature, whereas 3.14
  claims the substratum itself is already dharmī, shifting the locus of realization


  **Bāṇāyana’s Commentary 3.14:** Bāṇāyana interprets the verse as a metaphor for
  the mind’s awakening through the stages of Prakṛti.

  *Divergence:* He limits the application to mental processes, while the Sūtra’s wording
  allows a broader ontological claim'
voice_of_siva: The verse asserts that the substratum itself is dharmī, i.e.
abhyasa: Recognize your present awareness as the arising state of the substratum,
  and consciously align it with the latent and unmanifested qualities of reality.
