sutra_id: YS_2_12
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Root of Distractions
sanskrit: क्लेशमूलः कर्माशयो द्रष्टादृष्टजन्मवेदनीयः
transliteration: kleśamūlaḥ karmāśayo dṛṣṭādṛṣṭajanmavedanīyaḥ
translation: The root of afflictions is the work’s impressions, which are experienced
  as either seen or unseen.
commentary: 'The claim that afflictions arise from the impressions of work (karma)
  establishes a causal chain that is central to both Yoga and Sāṃkhya. In this passage,
  the term *kleśa* is not merely a psychological pain but a manifestation of *pratītyāśaya*—the
  latent impressions that persist in *sanchita* karma. The contested move is the identification
  of *dṛṣṭādṛṣṭa* (seen and unseen) as the two modes of experience. While Sāṃkhya
  traditionally treats *dṛṣṭa* as the realm of the visible and *adṛṣṭa* as the invisible,
  the Yoga school expands this to include the experiential field of *citta* and the
  subtle *pratyakṣa* of *samādhi*. The implication is that the same impressions can
  be realized in the immediate present (*dṛṣṭa*) or in future incarnations (*adṛṣṭa*),
  thereby linking the temporal with the eternal. Dvivedi’s commentary underscores
  this by noting that when distractions (*kleśa*) are suppressed, the usual causal
  chain of karma is interrupted, allowing liberation. This resonates with the Yoga
  doctrine of *pratyāhāra*—withdrawal of the senses—whereby the mind is freed from
  the *vṛtti* that perpetuates *kleśa*. The existential application is clear: by recognizing
  the root of afflictions in the impressions of work, one can consciously alter the
  *karma* one generates, thereby steering the future experience from suffering to
  bliss. The passage also hints at the *pratītyāśaya* of *sādhana*—the practice itself
  becomes a vehicle for transforming *kleśa* into *sukha* through disciplined action
  and mindful awareness.


  Key Terms


  **kleśa (क्लेश)** — root of afflictions -> Sāṃkhya: latent impressions; Yoga: source
  of suffering


  **karma (कर्म)** — work/act -> Sāṃkhya: causal action; Yoga: means of purification


  **dṛṣṭa (दृष्ट)** — seen -> Sāṃkhya: visible realm; Yoga: experiential field of
  citta


  **adṛṣṭa (अदृष्ट)** — unseen -> Sāṃkhya: invisible realm; Yoga: future or subtle
  experience


  Cross-Tradition Resonances


  **Yoga Sūtra 2.12:** Both Yoga and Sāṃkhya treat *kleśa* as arising from *karma*
  impressions, linking affliction to action.

  *Divergence:* Yoga emphasizes experiential realization (*dṛṣṭa*/*adṛṣṭa*) as a means
  to transcend, whereas Sāṃkhya focuses on the metaphysical persistence of *sanchita*
  karma.


  **Sāṃkhya Kāṇḍa 1.1:** Afflictions (*kleśa*) are identified as manifestations of
  *pratītyāśaya*.

  *Divergence:* Yoga expands the notion to include *citta* and *samādhi* as sites
  of transformation.


  **Dvivedi Commentary on 2.12:** Highlights suppression of distractions to interrupt
  karma’s causal chain.

  *Divergence:* Dvivedi’s view is more procedural, whereas Yoga presents *pratyāhāra*
  as a meditative withdrawal.


  **Yoga Sūtra 1.33:** Both texts link *vṛtti* (mental fluctuations) to *kleśa*.

  *Divergence:* Yoga treats *vṛtti* as a target for *pratyāhāra*, while Sāṃkhya sees
  it as a manifestation of *prakṛti*.'
voice_of_siva: The claim that afflictions arise from the impressions of work (karma)
  establishes a causal chain that is central to both Yoga and Sāṃkhya.
abhyasa: Observe each action you perform, noting whether its impression feels like
  a seen or unseen influence, and consciously redirect your attention to the present
  moment to reduce the root of afflictions.
