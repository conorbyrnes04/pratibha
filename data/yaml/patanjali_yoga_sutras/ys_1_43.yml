sutra_id: YS_1_43
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Non-Argumentative Samādhi
sanskrit: स्मृतिपरीशुद्धौ स्वरूपशून्येवार्थमात्रनिर्भासा निःवित्रकाः
transliteration: smṛtipariśuddhau svarūpaśūnyevārthamātranirbhāsā nirvitarkā
translation: In this samādhi, the mind is free from all arguments; the object’s true
  nature is present alone, as if it were utterly unlike itself, and the memory of
  its name, form, meaning, or relation has dissolved.
commentary: 'The passage asserts that ultimate absorption occurs when the mind relinquishes
  all conceptual scaffolding—name, form, meaning, relation—and retains only the object’s
  pure essence. This is a decisive claim about the nature of samādhi: it is not a
  state of heightened cognition but a state of pure, unmediated presence. The contested
  move is the idea that the object ‘has destroyed itself by its real nature’—a paradox
  that invites the reader to see the object as both the subject and the object of
  meditation. Within the Yoga and Sāṃkhya framework, this aligns with the notion that
  puruṣa, when untainted by prakṛti, experiences only its own awareness. The commentary
  highlights the role of memory (smṛti) as the faculty that ordinarily links ideas
  to names; its suppression allows the mind to dissolve all vṛtti and enter a state
  of nirvikalpa (non-contradictory) awareness. This has existential relevance: by
  learning to silence the habitual associations of thought, one can experience the
  world directly, unmediated by conceptual overlays, thereby realizing the unity of
  citta and the object. The Dvivedi insight that the object “has destroyed itself”
  points to the paradoxical self‑annihilation of the ego in the presence of pure awareness,
  a theme that resonates with later Advaita interpretations of samādhi as the dissolution
  of the self into the absolute.


  Key Terms


  **smṛti (स्मृति)** — memory -> the faculty that links ideas to names -> here its
  dissolution is essential for absorption


  **vṛtti (वृत्ति)** — mental modifications -> the habitual fluctuations that obscure
  pure awareness -> their cessation marks samādhi


  **samādhi (समाधि)** — absorption -> a state of non-contradictory awareness where
  object and subject merge -> not merely concentration but dissolution of duality


  Cross-Tradition Resonances


  **Yoga Sutra 1.43:** Both the Sutra and Dvivedi emphasize the dissolution of memory
  and vṛtti to achieve non-argumentative samādhi

  *Divergence:* Dvivedi adds the notion of the object ‘destroying itself’, a metaphoric
  twist not present in the terse Sutra


  **Yoga Sutra 1.44:** The next sutra speaks of the mind’s dissolution into the object,
  echoing the idea of ‘destroying itself’

  *Divergence:* While 1.43 focuses on memory’s dissolution, 1.44 extends to the mind’s
  own dissolution, showing a progressive deepening'
voice_of_siva: The passage asserts that ultimate absorption occurs when the mind relinquishes
  all conceptual scaffolding—name, form, meaning, relation—and retains only the object’s
  pure essence.
abhyasa: Close your eyes, focus on a single object, and consciously let go of its
  name, form, and meaning, allowing the memory of it to dissolve while you remain
  present with the object alone.
