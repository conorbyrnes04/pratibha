sutra_id: YS_4_09
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Desires and Impressions
sanskrit: जातिदेशकालव्यवहितानाम् अप्य आन्तर्यम् स्मृतिसंस्कारयोः एकरूपत्वात्
transliteration: jātideśakālavyavahitānām apy ānantaryaṃ smṛtisaṃskārayor ekarūpatvāt
translation: Desires, though separated from their fulfillments by class, space, and
  time, maintain an uninterrupted relationship because the impressions of desires
  and the memories of them are identical.
commentary: 'The passage asserts that the causal chain of desire does not break at
  the point of fulfillment; rather, the same mental imprint persists as both desire
  and recollection. This continuity is a contested move in the Yoga–Sāṃkhya dialogue:
  while Sāṃkhya emphasizes the distinctness of puruṣa and prakṛti, the Yoga school
  insists that the mind’s impressions (samskara) bind the soul (purusha) to the material
  world (prakṛti). Here, the author claims that the mind’s impressions (samskara)
  are the mechanism that preserves the identity between desire (kāma) and its memory.
  The claim is that the mind does not simply forget the desire after its fulfillment;
  it retains an identical impression that continues to influence future actions. This
  has existential relevance: it explains why we often find ourselves repeating patterns
  of desire even after the external conditions have changed. The insight aligns with
  the notion that the mind’s impressions are not inert; they are dynamic forces that
  shape the trajectory of the soul’s journey toward kaivalya (liberation). By recognizing
  the continuity between desire and memory, one can begin to see how the mind’s habitual
  patterns are perpetuated, and thus, how to intervene by cultivating awareness (dhyāna)
  to break the cycle. The passage also echoes the Satchidananda aphorism that “desires
  are separated from their fulfillments by class, space and time, yet they have an
  uninterrupted relationship because the impressions of desires and memories of them
  are identical.” This reinforces the idea that the mind’s impressions are the bridge
  that keeps desire alive beyond its immediate satisfaction.


  Key Terms


  **samskara (संस्कार)** — samskara: from Sanskrit root ‘samskṛti’ meaning ‘to make’
  or ‘to form’; in Sāṃkhya it denotes latent impressions that condition future cognition;
  the default translation ‘impression’ misses its formative, conditioning role


  **kāma (काम)** — kāma: originally ‘desire’ or ‘wish’; in Yoga it is the driving
  force of the mind that leads to attachment; the simple translation ‘desire’ overlooks
  its role as a causal agent in the mind’s activity


  **purusha (पुरुष)** — purusha: the conscious principle, the observer; Sāṃkhya sees
  it as distinct from prakṛti; the default ‘self’ fails to capture its transcendental,
  unchanging nature


  **prakṛti (प्रकृति)** — prakṛti: the material principle, dynamic and evolving; in
  Sāṃkhya it is the source of all phenomena; the common translation ‘nature’ obscures
  its role as the primal substance that is bound by purusha’s ignorance


  Cross-Tradition Resonances


  **Yoga Sūtra 4.9:** The structure ‘A B C’ mirrors the triad of desire, its fulfillment,
  and the sustaining impression, paralleling the triadic pattern in 4.8 where desire,
  action, and result are linked.

  *Divergence:* Unlike 4.8, 4.9 does not present a causal sequence but a static identity,
  suggesting a shift from action to memory


  **Sāṃkhya Karika 1.1:** Both texts emphasize the role of latent impressions (samskara)
  in binding the soul to the world.

  *Divergence:* Sāṃkhya Karika treats samskara as a passive residue, whereas the Yoga
  Sūtra treats it as an active, continuous bridge between desire and memory


  **Yoga Sūtra 2.1:** The notion of continuity of mind’s impressions aligns with the
  early claim that the mind’s activity is unbroken.

  *Divergence:* 2.1 focuses on the mind’s activity in the present, while 4.9 extends
  the continuity to the memory of fulfilled desires


  **Sāṃkhya Tattvasūtra 2.2:** Both texts discuss the interplay of purusha and prakṛti
  through mental impressions.

  *Divergence:* Tattvasūtra frames this interplay as a dualistic separation, whereas
  the Yoga Sūtra presents it as a unified, continuous process'
voice_of_siva: The passage asserts that the causal chain of desire does not break
  at the point of fulfillment; rather, the same mental imprint persists as both desire
  and recollection.
abhyasa: Observe each desire as it arises, and immediately note the memory of that
  desire after its fulfillment, to become aware of the persistent impression that
  links them.
