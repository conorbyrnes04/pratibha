sutra_id: YS_3_17
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Word, Meaning, and Idea
sanskrit: शब्दार्थप्रतयाणाम् इतरताराध्यासात् संकरः श तप्रविभागसंयमात् सर्वभूतरुतज्ञानम्
transliteration: śabdārthapratyayānām itaretarādhyāsāt saṃkaraś tatpravibhāgasaṃyamāt
  sarvabhūtarutajñānam
translation: The word, its meaning, and the idea behind it are normally confused because
  of superimposition upon one another. By [samyama] on the word (or sound) produced
  by any being, one obtains knowledge of its meaning.
commentary: 'The passage asserts that the mind’s habitual conflation of a word, its
  denotation, and the idea it evokes is a primary obstacle to clear cognition. It
  claims that the act of samyama—focused, disciplined attention—on the utterance itself
  disentangles these layers, revealing the word’s true meaning. This aligns with the
  Sāṃkhya‑Yoga view that cognition is mediated by the interplay of puruṣa (consciousness)
  and prakṛti (matter), and that the mind’s vṛtti (mental modifications) must be subdued
  to access the pure, unaltered awareness of the word. The contention lies in whether
  samyama operates directly on the word or on the mental representation of it; the
  text seems to privilege the former, suggesting a more immediate, sensory engagement.
  In practice, the passage invites us to observe our own speech, to pause and reflect
  on the word before it is swallowed by habitual thought, thereby preventing the superimposition
  that obscures meaning. This technique is not merely linguistic but existential:
  by clarifying the word, we clarify the thought patterns that shape our experience,
  leading toward samādhi, the stillness of the mind. The Satchidananda aphorism captures
  this by noting that knowledge of meaning is obtained through samyama on the word,
  underscoring the practical method of disciplined attention as the means to transcend
  conceptual confusion.


  Key Terms


  **yoga (योग)** — etymology: ‘union’ -> Sāṃkhya tradition: union of puruṣa and prakṛti
  -> modern translation often glosses as ‘practice’ but misses the ontological union
  aspect


  **citta (चित्त)** — etymology: ‘mind’ -> Sāṃkhya: the mind as a field of mental
  modifications (vṛtti) -> translation often renders as ‘mind’ but omits its dynamic,
  processual nature


  **vṛtti (वृत्ति)** — etymology: ‘modification’ -> Sāṃkhya: the fluctuations of citta
  that obscure puruṣa -> translation as ‘thoughts’ often loses the idea of continuous,
  conditioned activity


  **samādhi (समाधि)** — etymology: ‘union’ -> Sāṃkhya‑Yoga: the state where puruṣa
  is free from vṛtti -> translation as ‘concentration’ or ‘meditation’ often omits
  the transcendental aspect


  Cross-Tradition Resonances


  **Yoga Sutra 2.28:** Both sutras emphasize the role of samyama in resolving confusion—YS
  2.28 speaks of samyama as the method to overcome the mind’s wandering, while YS
  3.17 applies it specifically to linguistic confusion.

  *Divergence:* YS 2.28 treats samyama as a general cognitive discipline, whereas
  YS 3.17 narrows its scope to the word, suggesting a more specialized application


  **Sāṃkhya Karika 1.1:** Both texts discuss the superimposition of prakṛti over puruṣa;
  the Karika presents it as a fundamental misidentification, while YS 3.17 frames
  it in terms of linguistic superimposition.

  *Divergence:* The Karika addresses ontological misidentification, whereas YS 3.17
  uses the metaphor of word and meaning, making the abstract more concrete


  **Vijnana Bhairava 1.2:** Both highlight the necessity of disambiguating the word’s
  sense to achieve clarity; Vijnana Bhairava uses the example of a sound’s vibration,
  YS 3.17 uses the word itself.

  *Divergence:* Vijnana Bhairava focuses on auditory perception, whereas YS 3.17 extends
  the principle to the conceptual realm of language'
voice_of_siva: The passage asserts that the mind’s habitual conflation of a word,
  its denotation, and the idea it evokes is a primary obstacle to clear cognition.
abhyasa: Pause whenever you speak, and consciously focus on the word you are uttering,
  observing its sound and meaning without letting your thoughts merge them.
