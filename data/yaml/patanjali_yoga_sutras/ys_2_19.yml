sutra_id: YS_2_19
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Stages of the Gunas
sanskrit: विशेषविशेषलिङ्गामात्रालिङ्गानि गुणपरवाणि
transliteration: viśeṣāviśeṣaliṅgamātrāliṅgāni guṇaparvāṇi
translation: The stages of the Gunas are the defined.
commentary: 'The sūtra asserts that the Gunas are not merely abstract qualities but
  exist in distinct, progressive stages. This claim situates the Gunas within a developmental
  framework, challenging the view that they are static attributes of prakṛti. The
  contested move is the identification of four specific stages—gross, subtle, intelligent,
  and indissoluble—mirroring the fourfold classification of prakṛti in the Sāṃkhya
  system. By aligning the Gunas with these stages, the text bridges the epistemological
  gap between the subtle mind (citta) and the gross material world, thereby providing
  a practical roadmap for yogic sādhanā. In the Yoga tradition, this progression is
  essential for the practitioner’s gradual purification of vṛtti, enabling the mind
  to transcend the binding effects of the Gunas and approach samādhi. The Dvivedi
  commentary’s emphasis on “the undefined, the dissoluble, and the indissoluble” underscores
  the dynamic nature of the Gunas, suggesting that each stage can be transcended through
  disciplined practice. This resonates with the Sāṃkhya notion that puruṣa’s liberation
  is achieved by discerning its distinctness from the evolving prakṛti. Thus, the
  sūtra offers an existential application: by recognizing the Gunas’ staged nature,
  one can systematically dismantle their influence, paving the way for the realization
  of puruṣa’s pure consciousness.


  Key Terms


  **guna (गुण)** — ‘quality’ in Sanskrit; in Sāṃkhya, the three fundamental qualities—sattva,
  rajas, tamas—constitute prakṛti; the term here denotes the dynamic, evolving manifestations
  of these qualities, not a static attribute


  **prakṛti (प्रकृति)** — ‘nature’ or ‘material reality’; in Sāṃkhya, the tri‑fold
  material world; here it is the substrate that undergoes the four stages, highlighting
  its mutable character


  **citta (चित्त)** — ‘mind’ or ‘consciousness’; in Yoga, the organ of perception
  and cognition; its purification is the goal of sādhanā, which this sūtra supports
  by delineating the stages that must be transcended


  **samādhi (समाधि)** — the highest meditative absorption; in Yoga, the state where
  citta is free from vṛtti; the sūtra’s staging of Gunas provides the preparatory
  steps toward achieving samādhi


  Cross-Tradition Resonances


  **Yoga Sūtra 2.19:** identifies four stages of Gunas, paralleling the fourfold classification
  of prakṛti in Sāṃkhya (gross, subtle, intelligent, indissoluble)

  *Divergence:* Yoga emphasizes the experiential dissolution of these stages through
  practice, whereas Sāṃkhya presents them as inherent properties of prakṛti


  **Yoga Sūtra 2.20:** continues the theme of stages, linking them to the process
  of purification of vṛtti

  *Divergence:* Yoga’s focus on the mind’s purification contrasts with Sāṃkhya’s analytic
  description of prakṛti’s evolution


  **Bhāṣya of Dvivedi, 2.19:** mirrors the Yoga Sūtra’s stages with the terms ‘undefined,
  dissoluble, indissoluble’

  *Divergence:* Dvivedi’s wording abstracts the stages, whereas the Yoga Sūtra provides
  concrete descriptors (gross, subtle, intelligent, indissoluble)'
voice_of_siva: The sūtra asserts that the Gunas are not merely abstract qualities
  but exist in distinct, progressive stages.
abhyasa: Recognize the current stage of your mind’s attachment to each guna and consciously
  shift toward the next, more refined stage.
