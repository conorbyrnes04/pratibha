sutra_id: YS_2_49
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Breath Control as Practice
sanskrit: तस्मिन् सति श्वासप्रश्वासयोः गतिविच्छेदः प्राणायामः
transliteration: tasmin sati śvāsapraśvāsayor gativicchedaḥ prāṇāyāmaḥ
translation: You practice breath control by cutting off the natural flow of inhalation
  and exhalation.
commentary: 'The claim that breath control is a deliberate intervention in the mind’s
  habitual patterns is central to the Sādhana Pāda. Here the yogi is not merely observing
  the breath but actively suspending its automatic rhythm, thereby interrupting the
  vṛtti that keeps the mind bound to prakṛti. This act of cutting off the breath’s
  flow is a contested move: some commentators see it as a preparatory stage for samādhi,
  while others view it as a means of purifying the mind for higher cognition. In the
  Sāṃkhya framework, the breath is a subtle function of prāṇā, the life force that
  animates prakṛti. By controlling prāṇā, the yogi brings the mind closer to puruṣa,
  the pure consciousness that is untainted by prakṛti. The existential implication
  is that through disciplined breath, one learns to detach from the incessant fluctuations
  of the mind, thereby experiencing a state of stillness that is the hallmark of samādhi.
  Dvivedi’s emphasis on “suspending the natural course” echoes the traditional view
  that pranāyāma is not merely a physical exercise but a metaphysical act of aligning
  the body’s subtle energies with the higher principle of puruṣa. This alignment is
  what allows the practitioner to transcend ordinary perception and access the deeper
  realms of consciousness.


  Key Terms


  **yoga (योग)** — etymology: ‘union’ -> tradition: union of puruṣa and prakṛti ->
  default: practice of physical postures


  **citta (चित्त)** — etymology: ‘mind’ -> tradition: mind as the locus of vṛtti ->
  default: mental state


  **vṛtti (वृत्ति)** — etymology: ‘fluctuation’ -> tradition: mental modifications
  that bind puruṣa -> default: distraction


  **prāṇāyāma (प्राणायाम)** — etymology: ‘breath control’ -> tradition: suspension
  of natural prāṇa flow -> default: breathing exercise


  Cross-Tradition Resonances


  **Yoga Sutra 2.49:** Structural homology: ‘cutting off the natural flow’ parallels
  2.48’s ‘cutting off the mind’s fluctuations’

  *Divergence:* While 2.48 addresses mental vṛtti, 2.49 focuses on prāṇā, highlighting
  the dual nature of control


  **Sāṃkhya Karika 2.5:** Both treat prāṇa as a function of prakṛti that can be regulated

  *Divergence:* Sāṃkhya emphasizes the causal relation, whereas the Sutra presents
  it as a deliberate yogic act


  **Dvivedi 2.49:** Dvivedi’s wording mirrors the Sutra’s ‘suspending the natural
  course’

  *Divergence:* Dvivedi expands on the metaphysical significance, whereas the Sutra
  remains concise'
voice_of_siva: The claim that breath control is a deliberate intervention in the mind’s
  habitual patterns is central to the Sādhana Pāda.
abhyasa: You cut off the natural rhythm of inhalation and exhalation, thereby practicing
  breath control.
