sutra_id: YS_4_01
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Siddhis from Past Practices
sanskrit: जन्मौषधिमन्त्रतपःसमाधिजाḥ सिद्धयः
transliteration: janmauṣadhimantratapaḥsamādhijāḥ siddhayaḥ
translation: Siddhis arise from practices performed in previous births.
commentary: 'The passage asserts that psychic powers are not spontaneously generated
  in the present life but are the fruits of prior yogic activity. This claim situates
  the siddhis within the causal continuum of karma and the Sāṃkhya‑Yoga framework,
  where the puruṣa (consciousness) is eternally distinct from prakṛti (matter) and
  its modifications. The yogic practitioner, through disciplined samādhi, taps into
  the latent potentials of prakṛti that have been conditioned by past actions. The
  text therefore elevates samādhi as the primary means of accessing siddhis, contrasting
  it with external aids such as herbs or mantras, which are deemed “unnatural” because
  they bypass the internal transformation of the mind. The philosophical implication
  is that true liberation (kaivalya) requires mastery over the mind’s fluctuations
  (vṛtti) rather than reliance on external catalysts. This aligns with Patanjali’s
  broader argument that the ultimate goal is the cessation of vṛtti, not the acquisition
  of supernatural abilities. The passage also subtly critiques contemporary practices
  that seek siddhis through substances, underscoring the importance of intentional,
  disciplined practice over accidental or external triggers. In everyday life, this
  teaches that lasting change comes from sustained inner work, not fleeting external
  inputs.


  Key Terms


  **siddhi (सिद्धि)** — from siddh- (to be complete); in Sāṃkhya, siddhi denotes the
  perfected state of a prakṛti element; the translation ‘accomplishment’ misses its
  connotation of a perfected, liberated function


  **samādhi (समाधि)** — from sam- (together) + ādh (to hold); in Yoga, samādhi is
  the union of mind and object, a state of absorption; the term ‘concentration’ omits
  its transcendental aspect


  **tapas (तपः)** — from tap (to burn); in Sāṃkhya, tapas is the internal heat of
  disciplined effort; ‘austerity’ fails to capture its transformative purificatory
  function


  **purusha (पुरुष)** — from puru (to stand) + -sha (person); denotes pure consciousness,
  the subject of all experience; ‘consciousness’ alone neglects its absolute, unchanging
  nature


  Cross-Tradition Resonances


  **Yoga Sūtra 4.1:** Explicit linkage of siddhis to past practices mirrors the Sāṃkhya
  idea of karmic conditioning

  *Divergence:* Unlike the Sāṃkhya text, which treats siddhis as mere karmic residues,
  Patanjali frames them as attainable through disciplined samādhi, implying an active,
  transformative process


  **Yoga Sūtra 2.1:** Both passages emphasize the role of samādhi in transcending
  vṛtti

  *Divergence:* While 2.1 focuses on the cessation of vṛtti as liberation, 4.1 extends
  this to the acquisition of siddhis, suggesting a broader scope for samādhi’s benefits


  **Yoga Sūtra 3.1:** The distinction between natural and unnatural siddhis echoes
  the triad of puruṣa, prakṛti, and māyā

  *Divergence:* Patanjali’s categorization of siddhis as natural or unnatural is absent
  in earlier sutras, indicating a refined ethical stance'
voice_of_siva: The passage asserts that psychic powers are not spontaneously generated
  in the present life but are the fruits of prior yogic activity.
abhyasa: You consciously recall a past practice you performed in a previous life and
  mentally rehearse it with full attention, allowing the memory to activate the latent
  siddhi within you.
