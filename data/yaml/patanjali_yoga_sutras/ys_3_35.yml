sutra_id: YS_3_35
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Experience of the Sattva‑Purusha
sanskrit: सत्त्वपुरुषायोर अत्यान्तासंकीर्णयोः प्रत्ययाविशेषो भोगः परार्थात् स्वार्थसंयमात्
  पुरुषज्ञानम्
transliteration: sattvapuruṣayor atyantāsaṃkīrṇayoḥ pratyayāviśeṣo bhogaḥ parārthāt
  svārthasaṃyamāt puruṣajñānam
translation: The experience of the [sattva‑purusha] is the most intense concentration
  of [pratyaya] (direct perception). It is enjoyment for others, but for the self
  it is self‑control that brings [purusha‑knowledge].
commentary: 'The central claim of this sutra is that the deepest experience of the
  [sattva‑purusha] is not a mere pleasure but a disciplined insight that arises only
  through self‑control. The contested move here is the identification of ‘bhoga’ (enjoyment)
  with ‘parārtha’ (other‑worldly desire) while simultaneously equating ‘svārtha’ (self‑desire)
  with ‘samāyama’ (self‑control). In the Yoga and Saṃkhya traditions, the purusha
  is the unchanging witness, and its true experience is only possible when the mind‑stuff
  (citta) is restrained. Patanjali’s earlier sutras (e.g., 1.33) speak of liberation
  (kaivalyam) as the ultimate goal, whereas here the focus is on the process of attaining
  purusha‑knowledge through disciplined practice. The Satchidananda Sanskrit line—“By
  samāyama on the heart, the knowledge of the mind‑stuff is obtained”—underscores
  this process: it is the heart (hṛdaya) that must be steadied to reveal the mind‑stuff.
  This aligns with the Saṃkhya view that the mind‑stuff is a manifestation of prakṛti
  that must be observed by the purusha. Existentially, the sutra invites practitioners
  to recognize that what feels like pleasure to others is merely a distraction; true
  insight requires self‑discipline. By cultivating samāyama, one transforms the heart’s
  fluctuations into a stable platform for the purusha’s recognition of its own nature,
  thereby achieving the ultimate objective of Yoga: the knowledge of the self beyond
  all dualities.


  Key Terms


  **sattva (सत्त्व)** — sattva (Sanskrit: ‘pure, light’) → Saṃkhya: the principle
  of harmony and clarity that animates prakṛti; translation often glosses as ‘good’
  but misses its role as the active, discerning aspect of reality.


  **purusha (पुरुष)** — purusha (Sanskrit: ‘person, consciousness’) → Saṃkhya: the
  unchanging, passive witness; translation as ‘self’ omits its transcendental, non‑material
  nature.


  **pratyaya (प्रत्यक्ष)** — pratyaya (Sanskrit: ‘direct perception’) → Yoga: the
  immediate, unmediated experience of reality; translation as ‘perception’ understates
  its epistemic status as the sole means of valid knowledge.


  **samāyama (समायाम)** — samāyama (Sanskrit: ‘self‑control, restraint’) → Yoga: the
  disciplined regulation of mind‑stuff; translation as ‘self‑control’ lacks its specific
  yogic connotation of sustained, balanced attention.


  Cross-Tradition Resonances


  **Patanjali Yoga Sutra 1.33:** Both sutras describe the experience of the purusha
  as the ultimate goal; 1.33 states ‘Yoga is the stillness of the fluctuations of
  the mind’, while 3.35 specifies that this stillness arises from self‑control of
  the heart.

  *Divergence:* 1.33 focuses on the cessation of vṛtti in general, whereas 3.35 narrows
  the focus to the sattva‑purusha and links enjoyment to self‑control, highlighting
  a more specific experiential pathway.


  **Saṃkhya Karika 2.1:** Both texts emphasize the distinction between purusha and
  prakṛti, with the purusha’s experience being the key to liberation.

  *Divergence:* The Karika presents the purusha’s experience as an ontological realization,
  whereas 3.35 frames it as a conditioned experience requiring samāyama, thus bridging
  ontological and practical dimensions.


  **Patanjali Yoga Sutra 2.28:** Both sutras link the practice of samāyama to the
  attainment of higher states of consciousness.

  *Divergence:* 2.28 speaks of the general effect of samāyama on the mind’s fluctuations,
  while 3.35 specifies that samāyama of the heart yields purusha‑knowledge, adding
  a layer of specificity.


  **Satchidananda Commentary, Vibhuti:** The commentary echoes the sutra’s assertion
  that samāyama of the heart leads to knowledge of the mind‑stuff.

  *Divergence:* While the sutra presents this as a universal truth, the commentary
  contextualizes it within the heart’s emotional sphere, suggesting an experiential
  nuance.'
voice_of_siva: The central claim of this sutra is that the deepest experience of the
  [sattva‑purusha] is not a mere pleasure but a disciplined insight that arises only
  through self‑control.
abhyasa: You practice self‑control of your heart to obtain knowledge of your mind‑stuff.
