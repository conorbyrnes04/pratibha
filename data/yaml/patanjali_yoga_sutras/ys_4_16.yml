sutra_id: YS_4_16
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Object’s Existence Independent of Mind
sanskrit: न चैकचित्ततन्त्रं चेद् वस्तु तदप्रमाणकम् तदाऽ किम् स्यात्
transliteration: na caikacittatantraṃ ced vastu tadapramāṇakaṃ tadā kiṃ syāt
translation: An object’s existence is not dependent on a single mind; if it were,
  what would become of that object when that mind no longer perceives it?
commentary: 'The passage asserts that reality is not contingent upon a single consciousness.
  This claim foregrounds the non‑subjective nature of prakṛti, aligning with the Sāṃkhya
  doctrine that prakṛti operates independently of puruṣa. The contested move is the
  implication that a single mind cannot sustain an object’s existence, thereby rejecting
  the notion of a personal, isolated observer as the sole basis of reality. In the
  Yoga context, this supports the idea that samādhi is not merely a state of individual
  absorption but a realization of the object’s inherent reality beyond mental projection.
  The existential application is clear: one should not cling to the illusion that
  perception alone creates reality; instead, one must recognize the object’s inherent,
  mind‑independent existence, thereby reducing egoic attachment. This insight echoes
  Satchidananda’s aphorism, which emphasizes the paradox of an object’s disappearance
  if perception ceases, underscoring the need to perceive reality as a self‑existing
  phenomenon. By internalizing this, a practitioner cultivates detachment from the
  mind’s fleeting impressions and moves toward the liberation of kaivalya, where the
  self realizes its true nature as distinct from the transient mind‑dependent world.


  Key Terms


  **citta (चित्त)** — citta (mind) – originally a mental faculty; in Sāṃkhya it is
  the conscious principle, but here its role is limited to perception, not creation
  of reality.


  **prakṛti (प्रकृति)** — prakṛti (nature) – primordial, dynamic material reality;
  the passage underscores its autonomous existence independent of puruṣa.


  **purusha (पुरुष)** — purusha (self) – the passive observer in Sāṃkhya; the sūtra
  reminds that purusha’s perception does not constitute reality.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.1:** Both assert that reality is independent of the observer; 2.1
  states that the world is a manifestation of prakṛti, not of puruṣa.


  **Brahma Sutra 1.1.1:** Both argue that the world is not created by a single mind;
  the Sutra uses the term ''buddhi'' to denote collective cognition.


  **Mīmāṃsā Sutra 1.1:** Both reject the idea that a single mind can sustain reality;
  the Sutra emphasizes the role of the collective ''pṛthivī'' as the ground of existence.'
voice_of_siva: The passage asserts that reality is not contingent upon a single consciousness.
abhyasa: Observe an object without attaching it to your mind’s name or image; notice
  its presence even when you are not consciously thinking about it.
