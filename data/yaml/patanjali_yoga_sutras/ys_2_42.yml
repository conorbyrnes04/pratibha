sutra_id: YS_2_42
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Contentment Yields Supreme Joy
sanskrit: सन्तोषाद् अनुत्तमः सुखलाभः
transliteration: saṃtoṣād anuttamaḥ sukhalābhaḥ
translation: From contentment one attains supreme joy.
commentary: 'The Sūtra asserts that contentment (सन्तोष) is the sole source of the
  highest happiness. It is not a passive state of satisfaction with external goods
  but a deliberate, sustained posture of equanimity toward all experience. In the
  Yoga and Sāṃkhya frameworks, contentment is the first step toward the cessation
  of vṛtti (mental fluctuations) and the cultivation of samādhi (concentration). The
  claim that contentment alone produces supreme joy challenges the common intuition
  that external achievements or sensory pleasures are necessary for happiness. The
  contested move lies in the identification of contentment with a state that is both
  internal and self‑sufficient, thereby negating the need for external validation.
  This aligns with the Sāṃkhya idea that puruṣa, the conscious principle, is distinct
  from prakṛti, the material world; contentment is a puruṣic quality that transcends
  prakṛti’s fluctuations. The practical implication is that one can achieve the highest
  bliss without dependence on external circumstances, a powerful existential strategy
  for dealing with life’s uncertainties. The Satchidananda commentary’s emphasis on
  the difference between contentment and mere satisfaction reinforces this point,
  underscoring that contentment is a deliberate, non‑attachment stance that remains
  stable regardless of external conditions.


  Key Terms


  **saṃtoṣ (सन्तोष)** — contentment -> Sāṃkhya: equanimity toward all experience;
  Yoga: the first step toward samādhi; default translation often conflates with satisfaction


  **anuttama (अनुत्तम)** — unsurpassed -> Sāṃkhya: the highest principle; Yoga: the
  supreme state of bliss; default translation may miss its ontological primacy


  Cross-Tradition Resonances


  **Yoga Sūtra 2.42:** Structural homology: contentment as antecedent to supreme joy
  mirrors the causal chain in 2.41 (purva‑pratyaya), where the cause precedes the
  effect

  *Divergence:* Unlike 2.41, 2.42 does not specify a preceding action but posits contentment
  as an intrinsic quality, expanding the causal model to include internal states


  **Bhaṭṭārīya Yogaśāstra 5.2:** Both texts link contentment with liberation; Bhaṭṭārīya
  emphasizes contentment as a result of knowledge, while 2.42 presents it as a direct
  source of joy

  *Divergence:* Bhaṭṭārīya’s model requires prior knowledge, whereas the Sūtra treats
  contentment as self‑sufficient


  **Sāṃkhya Kāṇḍa 4.3:** Both traditions view contentment as a puruṣic attribute that
  transcends prakṛti

  *Divergence:* Sāṃkhya attributes contentment to the inherent nature of puruṣa, whereas
  the Sūtra frames it as an active practice'
voice_of_siva: The Sūtra asserts that contentment (सन्तोष) is the sole source of the
  highest happiness.
abhyasa: Cultivate a steady, non‑attachment stance toward all experiences, allowing
  whatever comes or goes to pass without affecting your inner equilibrium.
