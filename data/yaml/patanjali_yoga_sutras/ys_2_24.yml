sutra_id: YS_2_24
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Cause of Ignorance
sanskrit: तस्य हेतुं अविद्या
transliteration: tasya hetur avidyā
translation: Its cause is ignorance.
commentary: 'The sutra asserts that ignorance (avidyā) is the proximate cause of the
  seer’s misidentification of the self. This claim foregrounds a causal chain that
  begins with the *hetu*—the immediate reason for the misapprehension—and terminates
  in the ontological misrecognition that fuels the *vṛtti* of the mind. The move is
  contested because it seems to reduce the complex process of *sādhana* to a single
  causal factor, whereas other commentators emphasize the role of *citta* or *prakṛti*
  as mediators. In the Yoga and Sāṃkhya tradition, *avidyā* is not merely a lack of
  knowledge but a fundamental misapprehension of the distinction between *puruṣa*
  (the observer) and *prakṛti* (the observed). By locating the cause in *avidyā*,
  the sutra invites practitioners to confront the root of their delusion directly,
  rather than merely managing its symptoms. This existential application is evident
  in the practice of *pratyāhāra* (withdrawal of the senses) and *dharana* (concentration)
  as means to purify the *citta* from the influence of *avidyā*. The Dvivedi commentary’s
  brief note that “its, i.e., of the junction of the seer and the sight” underscores
  the sutra’s focus on the interface where *avidyā* manifests, thereby aligning the
  sutra with the broader Yoga aim of *samādhi*—the union of *puruṣa* with its true
  nature. Thus, the sutra’s philosophical claim is that the immediate cause of all
  misidentification is ignorance, and that liberation (*moksha*) requires the systematic
  dismantling of this ignorance through disciplined practice.


  Key Terms


  **hetu (हेतु)** — hetu (causative) → Sāṃkhya: immediate reason; Yoga: proximate
  cause of misidentification; the term’s use here signals a causal analysis rather
  than a metaphysical principle.


  **avidyā (अविद्या)** — avidyā (ignorance) → Sanskrit: lack of knowledge; Sāṃkhya:
  fundamental misapprehension of puruṣa‑prakṛti distinction; Yoga: root cause of all
  *vṛtti*; the term’s literal meaning (not knowing) is often lost in translations
  that render it simply as ‘ignorance’.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.23, 2.24, 2.25:** Structural homology: ‘tasya hetur X’ pattern recurs
  across three consecutive sutras, linking cause, yoga, and dharma.

  *Divergence:* While 2.23 names yoga (the practice) as the cause, 2.24 names ignorance,
  thereby shifting the causal locus from activity to epistemic condition; 2.25 names
  dharma, introducing moral dimension.


  **Sāṃkhya Kāṇḍa 1, 2:** Both traditions use *avidyā* as the root of misidentification,
  but Sāṃkhya frames it as a metaphysical ignorance of *puruṣa* and *prakṛti*; Yoga
  frames it as a practical obstacle to *samādhi*.'
voice_of_siva: The sutra asserts that ignorance (avidyā) is the proximate cause of
  the seer’s misidentification of the self.
abhyasa: Recognize the ignorance that is the cause of your current mental state.
