sutra_id: YS_3_19
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Other‑Mind Knowledge
sanskrit: प्रत्ययस्य परचित्तज्ञानम्
transliteration: pratyayasya paracittajñānam
translation: You know the thoughts of others through their mental images.
commentary: 'The sūtra asserts that the mind’s knowledge of another’s mental images
  is possible, establishing an epistemic bridge between self and other. This is a
  contested move: the Sāṃkhya‑Yoga tradition maintains that only the Purusha can directly
  apprehend the Prakṛti‑generated vṛtti, yet here the Purusha is said to grasp another’s
  vṛtti via the pratyaya of the mind. The claim is that the mind’s faculty of knowledge
  (jñāna) operates not only on one’s own field of images but extends outward by a
  subtle, non‑physical link. This link is not a direct perception but a mediated cognition,
  a “mind‑to‑mind” correspondence that preserves the non‑duality of consciousness
  while allowing for intersubjective understanding. The sūtra therefore foregrounds
  the existential application of Yoga: by learning to recognize others’ mental images,
  one cultivates empathy, compassion, and the capacity to act with insight toward
  the welfare of all beings. The Satchidananda commentary’s brief note “knowledge
  of their mental images is obtained” aligns with this reading, emphasizing the practical
  skill of discerning others’ inner states. In the broader Yoga canon, this sūtra
  anticipates later discussions of pratyaya‑pratibimba (reflection) and the role of
  the mind as a mirror, suggesting that the yogic path includes not only self‑realization
  but also the disciplined observation of the minds of others as a means to transcend
  egoic boundaries.


  Key Terms


  **pratyaya (प्रत्यय)** — from ‘to bind’ → ‘sign, signifier’ → in Yoga, the signifier
  that links the mind to the object of cognition, here enabling knowledge of another’s
  mind


  **citta (चित्त)** — ‘field of mental images’ → in Sāṃkhya, the dynamic aspect of
  Prakṛti; in Yoga, the locus of vṛtti, the mind’s activity


  **jñāna (ज्ञान)** — ‘knowledge’ → from ‘to know’ → in Yoga, the faculty that operates
  through pratyaya, distinguishing between direct perception and mediated cognition


  **purusha (पुरुष)** — the unchanging, observing Self, distinct from citta; the sūtra’s
  implication that purusha can access another’s citta via pratyaya challenges the
  strict separation posited in early Sāṃkhya


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 1.2:** Both verses discuss the mind’s capacity to apprehend
  external phenomena through pratyaya; 1.2 speaks of the mind’s ability to perceive
  objects, while 3.19 extends this to other minds.

  *Divergence:* 1.2 limits cognition to the self’s field, whereas 3.19 explicitly
  includes another’s field, thereby expanding the epistemic scope


  **Kapila Samhita, 3.1:** Kapila asserts that the mind can be a mirror (pratibimba)
  of the external world; 3.19 mirrors this by positing the mind’s mirror of another’s
  mind.

  *Divergence:* Kapila’s mirror is metaphorical for external objects; 3.19 treats
  it as a literal, functional link between minds


  **Bhatta, Sāṃkhya Tattva, 2.4:** Both texts discuss the separation of Purusha and
  Prakṛti and the role of the mind in mediating between them.

  *Divergence:* Bhatta maintains strict separation, while 3.19 suggests a mediated
  connection that blurs the boundary'
voice_of_siva: The sūtra asserts that the mind’s knowledge of another’s mental images
