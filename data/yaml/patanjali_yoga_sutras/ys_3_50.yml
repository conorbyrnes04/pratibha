sutra_id: YS_3_50
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Supremacy through Distinction
sanskrit: तद्वैराग्याद् अपि दोषबीजकस्ये काविल्यम्
transliteration: tadvairāgyād api doṣabījakṣaye kaivalyam
translation: By recognizing the distinction between the pure reflective nature [sattva]
  and the Self, one attains supreme mastery over all states and forms of existence.
commentary: 'The central claim of this verse is that ultimate liberation is achieved
  not by external practice but by an internal cognitive act of distinction: the Self
  (purusha) is set apart from the material world (prakriti). Patanjali’s Yoga Sutra
  3.50 therefore reframes the classic Sāṃkhya dualism into a dynamic epistemic act.
  The contested move is the assertion that this single act of recognition suffices
  for kaivalyam, a claim that some commentators argue requires prior purification
  (tapas) or the practice of samādhi. Within the Yoga tradition, the verse is read
  as a culmination of the earlier sutras that establish the necessity of vṛtti‑nirodha
  (cessation of mental modifications) and the role of the mind (citta) in perceiving
  the Self. The existential application is clear: by consciously distinguishing the
  unchanging Self from the changing mind and its modifications, one transcends the
  cycle of birth and death. The Satchidananda aphorism echoes this by emphasizing
  “supremacy over all states and forms of existence” as the result of this recognition,
  underscoring the ontological priority of the Self. This synthesis shows how the
  sutra bridges the epistemic rigor of Sāṃkhya with the experiential goal of Yoga,
  making the act of distinction the pivotal moment of liberation.


  Key Terms


  **vṛtti (वृत्ति)** — vṛtti (IAST) -> ‘mental modification’ -> in Sāṃkhya, the dynamic
  fluctuations of citta; in Yoga, its cessation (nirodha) is the path to samādhi.


  **purusha (पुरुष)** — purusha (IAST) -> ‘consciousness’ -> in Sāṃkhya, the passive
  witness; in Yoga, the Self that is distinguished from prakriti.


  **prakriti (प्रकृति)** — prakriti (IAST) -> ‘nature’ -> the material, dynamic, and
  unchanging world; in Yoga, the source of vṛtti that must be transcended.


  **samādhi (समाधि)** — samādhi (IAST) -> ‘absorption’ -> the state of complete mental
  stillness; in this sutra, the act of distinction is the gateway to samādhi.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.50:** Both verses posit that mastery over the mind (citta) leads
  to liberation; Gita speaks of ‘samyama‑samyama’ while Yoga Sutra 3.50 speaks of
  a single act of distinction.

  *Divergence:* Gita requires sustained practice of yoga and devotion, whereas 3.50
  reduces liberation to a cognitive recognition, highlighting a more epistemic than
  devotional route.


  **Patanjali Sutra 1.1:** Both begin with the definition of yoga as ‘the cessation
  of the fluctuations of the mind’ (citta‑vṛtti‑nirodha).

  *Divergence:* While 1.1 presents a general definition, 3.50 specifies the ultimate
  goal (kaivalyam) as a consequence of that cessation, thus adding a teleological
  endpoint.


  **Madhvacharya’s Bhashya on Sutra 3.50:** Madhva interprets the distinction as a
  metaphysical act that aligns with dualistic Vedanta’s concept of jñāna‑prāpti.

  *Divergence:* Madhva extends the sutra’s implication to include the role of divine
  grace (īśvara) in enabling the act, whereas Patanjali’s text remains purely self‑initiated.'
