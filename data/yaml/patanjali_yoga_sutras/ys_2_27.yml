sutra_id: YS_2_27
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Last Stage of Enlightenment
sanskrit: तस्य सप्तधः प्रान्तभूमिः प्रज्ञा
transliteration: tasya saptadhā prāntabhūmiḥ prajñā
translation: The enlightenment that is the final stage
commentary: 'In this passage the Yoga master declares that the ultimate attainment
  of Yoga is a singular, final stage of enlightenment, a state that transcends all
  intermediate experiences. The sūtra is not merely descriptive but prescriptive:
  it invites the practitioner to recognize that the culmination of disciplined practice
  is not a series of successive peaks but a single, all‑encompassing realization.
  The claim is that the last stage is the *prāntabhūmiḥ* of *prajñā*—the ultimate,
  unqualified awareness that dissolves the *vṛtti* of the mind and the illusionary
  *prakṛti* that masks *puruṣa*. This is a contested move in the Yoga tradition: some
  commentators, such as Dvivedi, treat the sevenfold *saptadhā* as a progressive ladder,
  while others, following the Sāṃkhya‑Yoga synthesis, argue that the final stage is
  a non‑dual, instantaneous shift. The philosophical implication is that the practice
  of *yoga* is not about accumulating stages but about aligning the *citta* with the
  *purusha* so that the *samādhi* becomes a single, unbroken moment of insight. In
  everyday life, this means that the practitioner should continually test whether
  their awareness is still bound by *vṛtti* or has slipped into the *prāntabhūmiḥ*
  of *prajñā*. When the mind’s chatter subsides and the self‑recognition of *purusha*
  is clear, the practitioner has reached the last stage, and the practice can be considered
  complete. Thus, the sūtra serves both as a doctrinal statement and a practical checkpoint
  for the yogic seeker.


  Key Terms


  **saptadhā (सप्तधः)** — sapt- ‘seven’ + dhā ‘fold, stage’; in Sūtra 2.27 it denotes
  the sevenfold nature of the final enlightenment, contrasting with the single, unqualified
  awareness that traditional translations often miss.


  **prāntabhūmiḥ (प्रान्तभूमिः)** — prānta ‘end’ + bhūmi ‘ground, stage’; it signals
  the ultimate, terminal point of the yogic path, a concept that is sometimes glossed
  over as merely ‘last stage’.


  **prajñā (प्रज्ञा)** — pra ‘before’ + jñā ‘know’; it is the enlightened awareness
  that transcends *citta* and *vṛtti*, a term whose subtlety is often lost when translated
  simply as ‘enlightenment’.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.25 – ‘tasyāḥ prāṇāyāmaḥ’:** Both 2.25 and 2.27 use the possessive
  ‘tasyāḥ’ to refer to the practitioner’s own internal process, linking breath control
  to the final state of awareness.

  *Divergence:* While 2.25 focuses on the physical regulation of *prāṇa*, 2.27 abstracts
  to the metaphysical culmination, showing a shift from body to mind.


  **Sāṃkhya Kāṇḍa – ‘puruṣa‑prakṛti‑bheda’:** The idea of a final, non‑dual realization
  echoes the Sāṃkhya doctrine that *puruṣa* ultimately separates from *prakṛti*.

  *Divergence:* Sāṃkhya presents this separation as a theoretical distinction, whereas
  the Yoga Sūtra frames it as an experiential endpoint.


  **Dvivedi, ‘Yoga‑Sūtra Commentary’ – ‘saptadhā’ as seven stages:** Dvivedi’s enumeration
  of seven stages parallels the saptadhā in 2.27, both acknowledging a multi‑layered
  path.

  *Divergence:* Dvivedi treats the stages as progressive, whereas the sūtra presents
  the last stage as a single, indivisible reality.'
