sutra_id: YS_2_39
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Illumination of Birth Origins
sanskrit: अपरिग्रहस्थाये जनमकथं तासं बोधः
transliteration: aparigrahasthairye janmakathaṃtāsaṃbodhaḥ
translation: When non‑greed is firmly established, the how and why of one’s birth
  are thoroughly illuminated.
commentary: 'The claim that the practice of aparigraha—renunciation of unnecessary
  possession—directly unlocks the inquiry into one’s birth is a decisive philosophical
  move. It asserts that the same discipline that frees the mind from material clinging
  also frees it from the habitual patterns that generate rebirth. In the Yoga and
  Sāṃkhya framework, puruṣa (consciousness) is obscured by prakṛti (nature) through
  vṛtti (mental modifications). Aparigraha, by cutting off the vṛtti of attachment,
  allows puruṣa to see the causal chain that leads to janma (birth). This is not merely
  a metaphysical claim but an existential prescription: by refusing to hoard, one
  cultivates the clarity needed to ask kathaṁtā—how and why—about one’s own origin.
  The Satchidananda commentary underscores the practical aspect of this inquiry, noting
  that the mind, unbound from gifts and obligations, can directly perceive the causal
  links of its own existence. Thus, the sūtra positions aparigraha as both a means
  of ethical conduct and a gateway to self‑knowledge, echoing the Sāṃkhya idea that
  liberation arises when puruṣa is liberated from prakṛti’s influence. This dual role—ethical
  restraint and epistemic access—makes the sūtra a pivotal point in the Yoga canon,
  where practice and inquiry converge.


  Key Terms


  **aparigraha (अपरिग्रह)** — from ‘apara’ (not) + ‘graha’ (taking); in Sāṃkhya, the
  renunciation of unnecessary possession; in common usage, non‑greed; the sūtra emphasizes
  its role in freeing the mind from vṛtti


  **janma (जनम)** — ‘birth’ as the moment of emergence; in Sāṃkhya, the cycle of rebirth;
  here it denotes the existential question of one’s origin


  **kathaṁtā (कथंता)** — ‘how and why’ questioning; in Yoga, the investigative process
  that leads to self‑knowledge; the sūtra links it to the illumination achieved by
  aparigraha


  Cross-Tradition Resonances


  **Yoga Sūtra 2.39:** Structural homology with 2.38 where ‘sthairye’ (firmness) precedes
  the action; both verses use a participial phrase to indicate the condition under
  which the main clause applies

  *Divergence:* In 2.39 the condition is non‑greed, whereas in 2.38 it is the practice
  of meditation; the shift from ethical restraint to epistemic inquiry marks a productive
  expansion of the sūtra’s scope


  **Sāṃkhya Karika 1.1:** Both texts use the phrase ‘janma kathaṁtā’ to denote the
  inquiry into birth; the Karika frames it as a theoretical question, whereas the
  Yoga Sūtra frames it as an experiential illumination

  *Divergence:* The Yoga Sūtra adds the causal link to aparigraha, thereby grounding
  the inquiry in ethical practice rather than abstract speculation


  **Yoga Vasistha 1.1:** Both texts employ the motif of renunciation (aparigraha)
  as a prerequisite for higher knowledge; the Vasistha presents it as a narrative
  lesson

  *Divergence:* The Vasistha uses a story of a king, while the Yoga Sūtra presents
  it as a concise aphorism, highlighting the sūtra’s brevity and directness'
