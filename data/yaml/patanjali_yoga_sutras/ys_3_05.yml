sutra_id: YS_3_05
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Conquest of Knowledge
sanskrit: तज्जयात् प्रज्ञालोकः
transliteration: tajjayāt prajñālokaḥ
translation: It conquers the light of knowledge.
commentary: 'The sūtra asserts that the perfected mind (citta) overcomes the subtle
  illumination of prajñā, thereby attaining samādhi. The claim is that liberation
  is not merely the cessation of vṛtti but the active subduing of the very faculty
  that distinguishes puruṣa from prakṛti. This move—tajjayāt prajñālokaḥ—has been
  contested in the tradition: some read it as a description of the mind’s triumph
  over ignorance, others as a declaration that the enlightened mind itself becomes
  the sole source of illumination. In the Sāṃkhya framework, prajñā is the discriminative
  faculty that identifies puruṣa; its ‘conquest’ implies that once puruṣa is fully
  realized, prajñā ceases to be a separate phenomenon and merges with the pure witness.
  The Dvivedi commentary’s terse remark, “By mastering its (results) lucidity of the
  in—,” hints at the experiential clarity that follows this conquest. The existential
  implication is that one need not merely observe thoughts; one must actively subdue
  the very faculty that gives them meaning. This is the practical task of yoga: to
  train the mind so that prajñā no longer operates as an external instrument but as
  an internal, self‑sustaining light, thereby dissolving the illusion of duality.
  The sūtra therefore serves as a compact prescription for the yogic practice of self‑discrimination
  and the cultivation of a mind that is both the observer and the observed, achieving
  the ultimate goal of samādhi.


  Key Terms


  **prajñā (प्रज्ञा)** — prājñā (IAST) -> ‘intuitive knowledge’ in Sāṃkhya; in Patanjali,
  the discriminative faculty that distinguishes puruṣa from prakṛti. The default translation
  ‘wisdom’ misses its role as the active, self‑sustaining light of consciousness.


  **loka (लोक)** — loka (IAST) -> ‘world’ or ‘realm’. Here it denotes the domain of
  prajñā, the subtle sphere of knowledge. Translating it simply as ‘world’ obscures
  its epistemic dimension.


  **tajjayāt (तज्जयात्)** — tajjayāt (IAST) -> ‘it conquers’. The verb implies active
  subjugation rather than passive absorption, a nuance often lost in literal translations.


  **citta (चित्त)** — citta (IAST) -> ‘mind’. In this sūtra it is the subject that
  performs the conquest, highlighting the yogic principle that the mind itself is
  the instrument of liberation.


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 1.1:** Both verses emphasize the role of the mind in attaining
  liberation; 1.1 speaks of the mind’s stillness, 3.5 speaks of its conquest over
  prajñā.

  *Divergence:* While 1.1 presents stillness as a passive state, 3.5 frames it as
  an active triumph, suggesting a dynamic process rather than static cessation.


  **Kapila Samhita, 1.2:** Kapila’s assertion that prajñā is the discriminative faculty
  aligns with the sūtra’s focus on its conquest.

  *Divergence:* Kapila treats prajñā as a permanent attribute of puruṣa, whereas the
  sūtra implies its temporary dominance, pointing to a transitional phase in yogic
  practice.


  **Dvivedi, Commentary on YS 3.5:** Dvivedi’s brief remark on ‘lucidity of the in’
  parallels the sūtra’s emphasis on clarity.

  *Divergence:* Dvivedi’s wording is ambiguous, whereas the sūtra’s terse form demands
  a precise interpretation of the mind’s victory.'
voice_of_siva: The sūtra asserts that the perfected mind (citta) overcomes the subtle
  illumination of prajñā, thereby attaining samādhi.
abhyasa: Observe your thoughts as they arise, and consciously let the mind’s own clarity
  subdue any confusion, so that you experience the light of knowledge as your own.
