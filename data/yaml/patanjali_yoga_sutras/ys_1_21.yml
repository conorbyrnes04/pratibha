sutra_id: YS_1_21
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Nearness of the Firm
sanskrit: तीव्रसंवेगाणाम् आसन्नः
transliteration: tīvrasaṃvegānām āsannaḥ
translation: It is nearest to those whose feeling is most ardent.
commentary: 'The claim here is that the samādhi state is not a distant, abstract attainment
  but is immediately accessible to those who possess a certain quality of feeling—specifically,
  a vigorous, resolute influence over the mind that unifies the soul’s sentiments.
  This is a contested move: while the Yoga Sūtras emphasize the transcendence of the
  mind, the Sūtra 1.21 asserts that the very first step toward samādhi is an inward
  ardor that is already present. In the Sāṃkhya framework, where prakṛti and puruṣa
  are distinct, the Sūtra suggests that the puruṣa’s capacity to experience a powerful
  vṛtti (mental fluctuation) can be harnessed to collapse the duality of prakṛti.
  The Dvivedi commentary elaborates that this ardor is not mere desire but a resolute
  influence—vairāgya—that aligns the mind’s fluctuations, thereby enabling the immediate
  attainment of asamprajñata‑samādhi. Existentially, this means that the practitioner
  need not wait for a distant, meditative state; rather, by cultivating a focused,
  passionate commitment, one can directly enter the first stage of samādhi. This aligns
  with the Yoga tradition’s emphasis on the power of intention (niyoga) and the Sāṃkhya
  notion that the mind’s fluctuations are the vehicle through which puruṣa can observe
  itself. The Sūtra thus bridges the theoretical distinction between puruṣa and prakṛti
  by showing that the puruṣa’s own feeling can be the catalyst for transcendence.


  Key Terms


  **tīvrasaṃvega (तीव्रसंवेग)** — tīvrasaṃvega: ‘intense influence over the mind’
  – in Sūtra it denotes a resolute, passionate force that unifies the soul’s sentiments,
  beyond the simple notion of feeling


  **samādhi (समाधि)** — samādhi: ‘state of absorption’ – here specifically as asamprajñata‑samādhi,
  the immediate, unconditioned absorption that follows ardent feeling


  **vṛtti (वृत्ति)** — vṛtti: ‘mental fluctuation’ – the Sūtra implies that a vigorous
  vṛtti can be harnessed to collapse prakṛti, aligning with Sāṃkhya’s view of mind
  as the vehicle of puruṣa


  **prakṛti (प्रकृति)** — prakṛti: ‘nature’ – the unmanifested material principle
  that, when unified by ardent feeling, allows puruṣa to observe itself


  Cross-Tradition Resonances


  **Yoga Sūtras 1.21:** Structural homology: the Sūtra’s single clause mirrors the
  pattern of earlier Sūtras that link a quality to a state (e.g., 1.2, 1.3).

  *Divergence:* Unlike 1.2, which speaks of the mind’s stillness, 1.21 emphasizes
  active feeling, suggesting a more dynamic path to samādhi


  **Bhaṭṭa, Yogabhāṣā 1.1.1:** Both texts link ardent feeling (vyāsa) to immediate
  samādhi, underscoring the importance of intention.

  *Divergence:* Bhaṭṭa expands on the role of niyoga, whereas the Sūtra condenses
  the idea into a single clause, making the claim more aphoristic


  **Māṇḍūkya Upaniṣad 3.2.1:** The Upaniṣad’s mention of ‘ardent desire’ as a means
  to liberation parallels the Sūtra’s focus on feeling.

  *Divergence:* The Upaniṣad frames desire as a vehicle for liberation, while the
  Sūtra frames it as a prerequisite for samādhi, a more immediate meditative state


  **Dvivedi, Commentary on YS 1.21:** Dvivedi’s explanation of ‘sāṃvega’ as resolute
  influence aligns with the Sūtra’s claim of ardent feeling.

  *Divergence:* Dvivedi adds the notion of vairāgya, which the Sūtra does not explicitly
  mention, thereby enriching the interpretation'
