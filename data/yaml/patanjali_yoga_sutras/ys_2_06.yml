sutra_id: YS_2_06
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Sense of Being
sanskrit: द्रिगदर्शनशक्तिर एकात्मतेवास्मिता
transliteration: dṛgdarśanaśaktyor ekātmatevāsmitā
translation: The power of seeing, when it is united with the one‑ness of the self,
  becomes the sense of being.
commentary: 'The sūtra asserts that the very faculty of perception, when it is identified
  with the singularity of the self, produces the experience known as the sense of
  being. This is not merely a passive awareness but an active, unified power that
  collapses the duality between instrument and object. In the Yoga and Sāṃkhya traditions,
  perception (dṛṣṭi) is ordinarily mediated by the mind (citta) and senses, which
  are part of prakṛti. Here, however, the sūtra elevates the power of perception to
  the level of puruṣa, the conscious principle, by insisting that its union with the
  self (ekātmā) yields a distinct experiential category: the sense of being. The contested
  move is the identification of ‘dṛgdarśanaśakti’—traditionally understood as the
  power of seeing—with the self itself. Dvivedi’s commentary echoes this by describing
  it as the power that “knows with the instruments thereof,” but he stops short of
  explicating the ontological shift. The sūtra’s claim is that when the instruments
  of perception are no longer external but internalized, the experience ceases to
  be a mere observation and becomes a lived sense of existence. This has existential
  implications: it offers a method for overcoming the illusion of separateness. By
  cultivating a perception that is unified with the self, one can dissolve the habitual
  misidentification of the ‘I’ with external objects, thereby reducing pain and distraction.
  The practical significance is that the sūtra provides a target for meditative practice:
  to bring the power of seeing into a state of one‑ness with the self, thereby accessing
  the sense of being as a stable, non‑dual experience. This aligns with the broader
  Yoga aim of realizing puruṣa’s distinctiveness from prakṛti, yet it also offers
  a concrete experiential pathway that can be directly applied in meditation and daily
  life.


  Key Terms


  **dṛgdarśanaśakti (द्रिगदर्शनशक्ति)** — etymology: dṛg (see) + darśana (vision)
  + śakti (power) -> the power of seeing; tradition: perception as an active faculty;
  default translation: ‘power of seeing’ misses its ontological shift to self‑unity


  **ekātmā (एकात्मा)** — etymology: eka (one) + ātmā (self) -> one‑ness of the self;
  tradition: the singular puruṣa; default translation: ‘one self’ omits the implication
  of unity with perception


  **purūṣa (पुरुष)** — etymology: puru (to move) + -ṣa (suffix) -> moving principle;
  tradition: conscious principle distinct from prakṛti; default translation: ‘person’
  overlooks its metaphysical role as the locus of experience


  Cross-Tradition Resonances


  **Yoga Sūtra 2.6:** Structural homology: the sūtra parallels 2.5’s identification
  of citta with puruṣa, but here it is dṛgdarśanaśakti that is identified

  *Divergence:* Unlike 2.5, which speaks of mind, 2.6 focuses on the power of perception,
  expanding the scope of what can be unified with the self


  **Sāṃkhya Kārikā 2.10:** Both texts discuss the unification of a faculty with puruṣa;
  the Kārikā speaks of the mind’s liberation, while the Sūtra speaks of the power
  of seeing


  **Dvivedi, Commentary on YS 2.6:** Dvivedi’s wording mirrors the sūtra’s identification
  of instruments with the self

  *Divergence:* Dvivedi does not explicitly claim ontological unity, merely notes
  the experiential blending'
voice_of_siva: The sūtra asserts that the very faculty of perception, when it is identified
  with the singularity of the self, produces the experience known as the sense of
  being.
abhyasa: Focus your attention on the act of seeing; as you observe, consciously merge
  the sense of the instrument with the sense of the self, so that the distinction
  between observer and observed dissolves.
