sutra_id: YS_1_15
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Mastery of Desire and Non‑Attachment
sanskrit: दृष्टानुस्रविकविषयवितृणस्य वशिकारसंज्ञा वैराग्यम्
transliteration: dṛṣṭānuśravikaviṣayavitṛṣṇasya vaśīkārasaṃjñā vairāgyam
translation: The consciousness of having mastered the desire of the one who does not
  crave perceptible or scriptural objects is non‑attachment.
commentary: 'The central claim of this verse is that true non‑attachment is not merely
  the absence of craving, but the *conscious* mastery of desire itself. In the Yoga
  and Sāṃkhya traditions, the mind’s tendency to cling to objects—whether mundane
  (perceptible) or spiritual (scriptural)—constitutes vṛtti, the oscillation that
  keeps puruṣa from realizing its distinctness from prakṛti. The verse therefore posits
  a contested move: that non‑attachment is achieved *through* an active, conscious
  control over desire, rather than passive withdrawal. This move is contested because
  some commentators, following the *pratyāhāra* model, view non‑attachment as a state
  of withdrawal from all objects, while others, as here, see it as a deliberate, conscious
  mastery over the very impulses that would otherwise bind the mind. By framing non‑attachment
  as a conscious mastery, the verse aligns with the Yoga Sutra’s emphasis on the *pratyāhāra*
  of the senses and the *pratyāhāra* of the mind, but it extends the notion to include
  the *pratyāhāra* of desire itself. The existential application is clear: a practitioner
  who is aware of every desire and consciously subdues it experiences the dissolution
  of vṛtti, allowing the true nature of puruṣa to shine forth. This aligns with the
  Dvivedi commentary’s observation that non‑attachment is a preliminary to real intuitional
  knowledge, achieved by “application.” The verse thus bridges the gap between the
  theoretical framework of Sāṃkhya (puruṣa vs. prakṛti) and the practical discipline
  of Yoga (conscious mastery of desire).


  Key Terms


  **dṛṣṭā (दृष्टा)** — etymology: ‘the one who sees’ -> tradition: the conscious observer
  (purūṣa) -> default translation ‘consciousness’ misses the active witnessing aspect


  **vṛtti (वृत्ति)** — etymology: ‘to turn’ -> tradition: mental fluctuations that
  obscure purūṣa’s nature -> default translation ‘activity’ omits its role as obstacle


  **puruṣa (पुरुष)** — etymology: ‘man’ -> tradition: pure consciousness, distinct
  from prakṛti -> default translation ‘person’ fails to convey its transcendental,
  non‑material nature


  **prakṛti (प्रकृति)** — etymology: ‘nature’ -> tradition: material reality, dynamic
  principle of change -> default translation ‘nature’ overlooks its generative, impersonal
  character


  Cross-Tradition Resonances


  **Yoga Sutra 1.15:** Structural homology: the verse follows the pattern of earlier
  sutras where a state (non‑attachment) is linked to a preceding condition (mastery
  of desire).

  *Divergence:* Unlike Sutra 1.12, which defines non‑attachment as absence of craving,
  here it is defined as conscious mastery, thereby adding an active dimension.


  **Yoga Sutra 1.12:** Both sutras discuss non‑attachment in relation to desire, but
  1.12 presents it as passive withdrawal, while 1.15 introduces an active, conscious
  control.


  **Bhaṭṭa‑Kṛṣṇa 1.1:** The idea of mastering desire as a prerequisite for non‑attachment
  parallels the Bhāṭṭa‑Kṛṣṇa’s emphasis on the *pratyāhāra* of the senses, but diverges
  by focusing on internal desire rather than external sensory objects.


  **Dvivedi Commentary on 1.15:** Dvivedi’s notion of ‘application’ as the means to
  non‑attachment mirrors the verse’s active mastery, yet he expands it to include
  both perceptible and scriptural objects, broadening the scope beyond the sutra’s
  implicit focus.'
voice_of_siva: The central claim of this verse is that true non‑attachment is not
  merely the absence of craving, but the *conscious* mastery of desire itself.
abhyasa: Consciously observe each desire that arises, and with deliberate attention,
  let it pass without clinging, thereby mastering it and cultivating non‑attachment.
