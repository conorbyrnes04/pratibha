sutra_id: YS_1_33
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Mind Equilibrium
sanskrit: मैत्रीकरुणामुदितोकेषाणां सुखदुःखपुण्याभिपुण्यविषयाणां भावनाताश् चित्तप्रसादनम्
transliteration: maitrīkaruṇāmuditopekṣāṇāṃ sukhaduḥkhapuṇyāpuṇyaviṣayāṇāṃ bhāvanātaś
  cittaprasādanam
translation: The mind becomes tranquil through the practice of friendliness, compassion,
  indifference, and detachment, respectively, toward happiness, misery, virtue, and
  vice.
commentary: 'The central claim of this passage is that equanimity is cultivated by
  a balanced, active response to all emotional states, not by passive surrender. Patanjali
  presents the four attitudes—maitrī, karuṇā, aparāṇā, and abhāvanā—as a systematic
  method to steady the mind (citta) for samādhi. The contested move lies in the interpretation
  of ‘indifference’ (abhāvanā): some commentators read it as mere apathy, while others,
  following the Dvivedi tradition, understand it as a purposeful, skillful withdrawal
  that preserves the mind’s freedom from attachment. In the Sāṃkhya framework, this
  practice aligns the mind with puruṣa, the conscious principle, by freeing it from
  prakṛti’s fluctuations (vṛtti). By cultivating these four responses, the practitioner
  learns to observe all phenomena—sukha, duḥkha, puṇya, and apuṇya—without identification,
  thereby reducing the egoic clinging that fuels suffering. The existential application
  is clear: when one feels joy, one mirrors it with genuine friendliness; when sorrow
  strikes, one responds with compassionate acceptance; when virtue is witnessed, one
  rejoices without attachment; and when vice appears, one remains detached, neither
  indulging nor condemning. This balanced stance dissolves the habitual bias that
  turns every experience into a source of craving or aversion, paving the way for
  samādhi, the stillness of the mind. The Dvivedi commentary’s emphasis on active
  engagement—“as much action on the part of him who feels the emotion as lies in his
  power”—underscores that equanimity is not passive resignation but a skillful, intentional
  modulation of one’s affective response.


  Key Terms


  **maitrī (मैत्री)** — friendliness -> Sāṃkhya: a state of harmonious identification
  with the world; the translation ‘friendliness’ misses the subtle sense of compassionate
  engagement with all beings


  **karuṇā (करुणा)** — compassion -> Sāṃkhya: the active, skillful response to suffering;
  the word implies both empathy and remedial action, beyond the passive ‘sympathy’


  **abhāvanā (अभावना)** — indifference -> Sāṃkhya: purposeful detachment that preserves
  the mind’s freedom; the common translation ‘indifference’ connotes apathy, which
  is a misreading


  **citta (चित्त)** — mind -> Sāṃkhya: the fluctuating aspect of consciousness that
  must be steadied; the translation ‘mind’ alone omits its dynamic, vṛtti-prone nature


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 1.33:** Both texts present the four attitudes as a systematic
  antidote to mental turbulence, mirroring the Sāṃkhya goal of purifying citta

  *Divergence:* Patanjali’s version is concise, while Dvivedi expands on the active
  nature of ‘indifference’


  **Bhagavad Gita 2.50:** The Gita’s ‘neither joy nor sorrow’ stance parallels the
  four attitudes in regulating emotional response

  *Divergence:* The Gita frames it as a broader yogic duty, whereas Patanjali isolates
  it as a preparatory practice for samādhi


  **Bhaṭṭa, Vāgśataka 1.1:** Both texts emphasize the importance of equanimity in
  the face of dualities

  *Divergence:* Bhaṭṭa’s verse uses poetic imagery, whereas Patanjali’s sutra is terse
  and algorithmic'
voice_of_siva: The central claim of this passage is that equanimity is cultivated
  by a balanced, active response to all emotional states, not by passive surrender.
abhyasa: You cultivate calm by consciously responding to each experience—joy, sorrow,
  virtue, vice—with the corresponding attitude of friendliness, compassion, indifference,
  or detachment, thereby steadying your mind for samādhi.
