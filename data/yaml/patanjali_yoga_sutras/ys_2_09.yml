sutra_id: YS_2_09
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Desire for Life as Attachment
sanskrit: स्वरसवाहि विदुषोऽपि तथा रूढ़ोऽभिनिवेशः
transliteration: svarasavāhī viduṣo 'pi tathārūḍho 'bhiniveśaḥ
translation: The learned, even those who have attained great knowledge, are still
  driven by a strong desire for life, which sustains itself by its own power; this
  is attachment.
commentary: 'The central philosophical claim of this sutra is that attachment is not
  a mere external craving but an intrinsic, self-sustaining force rooted in the very
  nature of existence. By stating that even the most erudite are "tathārūḍho," the
  sutra underscores that intellectual attainment does not erase the fundamental drive
  for life; rather, it coexists with it. This aligns with the Sāṃkhya notion that
  prakṛti, in its dynamic aspect, perpetuates the cycle of desire and attachment,
  while puruṣa remains a passive witness. The sutra’s reference to the learned as
  still bound by attachment invites practitioners to recognize that liberation (mokṣa)
  requires transcending this innate force, not merely intellectual understanding.
  Dvivedi’s commentary expands on this by highlighting that attachment originates
  from a primordial desire that persists across lifetimes, thereby framing it as an
  eternal, innate impulse. This eternal quality makes attachment a formidable obstacle,
  as it is not a product of current actions but a deep-seated, self-perpetuating tendency.
  The existential application is clear: practitioners must cultivate awareness of
  this self-sustaining desire, observe its manifestations, and systematically dismantle
  it through disciplined practice, thereby breaking the cycle of samsāra.


  The sutra’s brevity masks a profound insight: attachment is not an external force
  imposed upon the individual but a manifestation of the very life-force (svarasa)
  that animates all beings. By identifying the learned as still "tathārūḍho," the
  sutra reminds us that knowledge alone is insufficient; one must also confront the
  subtle, internalized drives that keep the soul tethered to the material world. This
  perspective resonates with the broader Yoga canon, where the ultimate goal is to
  achieve samādhi—an absorption that transcends both desire and ignorance. Hence,
  the sutra serves as a call to recognize and neutralize the self-sustaining nature
  of attachment, paving the way for true liberation.


  In practice, this means cultivating a mindful detachment that observes the arising
  of desire without attachment to its outcome, thereby weakening its self-sustaining
  power.


  Key Terms


  **svarasa (स्वरस्)** — etymology: ‘life-force’ -> Sāṃkhya: the animating principle
  of prakṛti; default translation ‘life’ misses its dynamic, sustaining aspect


  **viduṣa (विदुषः)** — etymology: ‘learned one’ -> Sāṃkhya: one who has attained
  knowledge of puruṣa and prakṛti; default translation ‘scholar’ omits the spiritual
  attainment


  **tathārūḍha (तथा रूढ़ः)** — etymology: ‘like a rock’ -> Yoga: denotes steadfastness;
  default translation ‘firm’ fails to convey the immovable, enduring quality of attachment


  **abhinivesha (अभिनिवेशः)** — etymology: ‘not to be abandoned’ -> Sāṃkhya: the persistent,
  self-sustaining drive; default translation ‘attachment’ overlooks its self-perpetuating
  nature


  Cross-Tradition Resonances


  **Yoga Sūtra 2.9:** Structural parallelism: both sutras use a single clause to encapsulate
  a complex doctrine, mirroring the concise aphoristic style of the Yoga canon

  *Divergence:* Unlike later commentarial expansions, this sutra does not invoke the
  five kleshas explicitly, focusing instead on the root cause of attachment


  **Sāṃkhya Kārikā 2:** Both texts identify prakṛti’s dynamic aspect as the source
  of desire, aligning with the notion of a self-sustaining force

  *Divergence:* The Sāṃkhya text frames it as a natural law, whereas the Yoga sutra
  presents it as a personal, experiential phenomenon


  **Dvivedi, Commentary on YS 2.9:** Dvivedi expands on the sutra by linking attachment
  to past-life experiences, echoing the cyclical view of samsāra

  *Divergence:* Dvivedi introduces an ontological layer (past lives) absent in the
  succinct sutra, thereby enriching but also complicating the original claim


  **Yoga Vasistha, Chapter 5:** Both texts discuss the inescapability of attachment
  even among the enlightened

  *Divergence:* The Vasistha elaborates with narrative examples, whereas the sutra
  remains a terse statement'
voice_of_siva: The central philosophical claim of this sutra is that attachment is
  not a mere external craving but an intrinsic, self-sustaining force rooted in the
  very nature of existence.
abhyasa: Observe the arising of your own desire for continued life and consciously
  let it pass without clinging, so that its self-sustaining power weakens.
