sutra_id: YS_2_36
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Truthfulness Grants Effortless Fruition
sanskrit: सत्यप्रतििष्ठायाम् कर्मफलाश्रयत्वम्
transliteration: satyapratiṣṭhāyāṃ kriyāphalāśrayatvam
translation: When one establishes truthfulness, one rests upon the fruits of action.
commentary: 'The core claim of this aphorism is that *satya* (truthfulness) functions
  as a metaphysical catalyst that transforms effort into effortless attainment. In
  the Yoga‑Sāṃkhya framework, *satya* is not merely ethical honesty but the alignment
  of *citta* (mind) with *prakṛti*’s rational principle, thereby stabilising the *vṛtti*
  (mental modifications). The contested move here is the assertion that truthfulness
  alone suffices to secure *phala* (results) without *karmā* (effort). Critics argue
  that this negates the *yoga* of *karma* as a disciplined practice; proponents see
  it as an elevation of *satya* to a divine grace that supersedes ordinary causal
  law. The Sādhana Pāda thus invites practitioners to cultivate *satya* as a *samādhi*‑like
  state, wherein the mind’s fluctuations cease and the *purusha* perceives the *prakṛti*’s
  fruits directly. Existentially, this translates to living a life where integrity
  becomes a self‑fulfilling force: actions are no longer laborious but arise spontaneously
  from a clear, honest consciousness. The practice is to observe every utterance and
  intention, ensuring it aligns with *satya*; when misalignment occurs, one consciously
  withdraws or corrects it, thereby reinforcing the causal loop that makes truthfulness
  the bedrock of effortless fruition.


  Key Terms


  **satya (सत्य)** — truthfulness -> Sāṃkhya’s rational principle of *prakṛti* ->
  ordinary sense of honesty; the term here denotes a metaphysical alignment that transforms
  causal law


  **karmā (कर्म)** — action -> Sāṃkhya’s activity of *purusha* on *prakṛti* -> here
  implies effort that is rendered unnecessary by *satya*


  **phala (फल)** — fruit/result -> causal outcome in Sāṃkhya -> here denotes the spontaneous
  manifestation of effortless attainment


  Cross-Tradition Resonances


  **Yoga Sūtra 2.36 (Sādhana Pāda):** Both the Sūtra and the Sāṃkhya Nyāya treat *satya*
  as a stabilising principle that aligns *citta* with *prakṛti*

  *Divergence:* Unlike the Nyāya, the Sūtra claims this alignment produces results
  without *karmā*, a claim that Sāṃkhya traditionally reserves for *yoga* of *samādhi*


  **Bhaṭṭa’s *Yogaśāstra* 1.42:** Bhaṭṭa also links *satya* to the liberation of *purusha*
  from *vṛtti*

  *Divergence:* He does not assert that *satya* alone yields *phala*; effort remains
  essential, highlighting a divergence in the perceived sufficiency of truthfulness'
voice_of_siva: The core claim of this aphorism is that *satya* (truthfulness) functions
  as a metaphysical catalyst that transforms effort into effortless attainment.
abhyasa: Observe each thought and word; if it contradicts truth, immediately correct
  it, so that your mind rests solely on the fruits of honest action.
