appendixes:
- commentator: Swami Satchidananda (1978, attributed aphorism)
  text: When negative thoughts or acts such as violence, etc. are done, caused to
    be done or even approved of—whether incited by greed, anger or infatuation—whether
    indulged in with mild, medium or extreme intensity, they are based on ignorance
    and bring certain pain. Reflecting upon this is also pratipakṣa bhāvana.
