sutra_id: YS_2_35
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: Nonviolence Establishes Harmony
sanskrit: अहिंसाप्रतिष्ठायाम् तस्संनिधौ वैरत्यागः
transliteration: ahiṃsāpratiṣṭhāyāṃ tatsaṃnidhau vairatyāgaḥ
translation: You firmly establish nonviolence; in your presence all hostility ceases.
commentary: 'The sutra asserts that the mere act of firmly establishing ahiṁsā (nonviolence)
  transforms the practitioner into a pacific center that dissolves enmity. This is
  not a passive virtue but an active, transformative power that reshapes the social
  field around the practitioner. In the Yoga and Samkhya traditions, the puruṣa, by
  aligning with the prakṛti through disciplined practice, becomes a locus of harmony;
  here the sutra specifies that the alignment is achieved through the concrete act
  of nonviolence. The claim is that the presence of a person who has internalized
  ahiṁsā emits a subtle vibration that neutralizes hostility, a phenomenon that echoes
  the Samkhya notion of the subtle mind (citta) influencing the external world. The
  sutra’s structure—firm establishment (pratiṣṭhā) followed by the effect (vairatyāga)—mirrors
  the causal chain in Samkhya: the puruṣa’s discernment (viveka) leads to the dissolution
  of ignorance (avidya). Practically, this means that a practitioner who consciously
  cultivates nonviolence becomes a catalyst for peace, even in the presence of conflict.
  The sutra invites us to see nonviolence not merely as abstention from harm but as
  an active, transformative presence that can alter the emotional climate of others,
  thereby providing a concrete existential tool for navigating social tensions. This
  insight aligns with the Satchidananda commentary’s observation that even a small
  degree of ahiṁsā can elevate one’s presence, but the Pratibha analysis emphasizes
  the sutra’s causal claim and its implication for the practitioner’s role as a pacific
  agent.


  Key Terms


  **ahiṁsā (अहिंसा)** — from ‘ahim’ (non) + ‘sa’ (violence); in Samkhya, it denotes
  the ethical restraint that aligns puruṣa with prakṛti’s harmonious aspect; the term’s
  literal meaning of ‘non-harm’ is expanded in Yoga to include non-violence in thought,
  word, and deed, a nuance often lost in simple translations


  **vairatyāgaḥ (वैरत्यागः)** — combines ‘vairya’ (hostility) and ‘tyāgaḥ’ (abandonment);
  in Samkhya it refers to the relinquishment of antagonistic tendencies; the sutra’s
  use implies that nonviolence actively causes the abandonment of hostility, not merely
  the absence of it


  **pratiṣṭhāyāṃ (प्रतिष्ठायाम्)** — from ‘prati’ (against) + ‘ṣṭhā’ (to stand); in
  Yoga it signifies a firm, sustained establishment of a virtue; the term underscores
  the necessity of deliberate, ongoing practice rather than a fleeting vow


  Cross-Tradition Resonances


  **Yoga Sutra 1.2 – ‘Yogaś ca siddhyate śāntam’:** Both sutras use a causal structure:
  a firm establishment (pratiṣṭhā) leads to a state of peace or dissolution (śāntam/vairatyāga).
  The similarity lies in the emphasis on intentional practice as the catalyst for
  inner and outer harmony.

  *Divergence:* While 1.2 speaks of general peace, 2.35 specifies the dissolution
  of hostility, highlighting a more socially oriented effect of the practice


  **Samkhya Karika 1.1 – ‘Puruṣaḥ prakṛtivṛttiḥ’:** Both traditions link the puruṣa’s
  discernment (or establishment of virtue) with the transformation of prakṛti’s manifestations;
  the sutra mirrors this by showing how ahiṁsā transforms hostile interactions.

  *Divergence:* Samkhya focuses on metaphysical discernment, whereas the Yoga sutra
  frames the effect in concrete social terms (hostility ceasing in presence)'
