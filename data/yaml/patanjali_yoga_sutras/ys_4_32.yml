sutra_id: YS_4_32
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Termination of the Guṇas
sanskrit: ततः कृतार्थानां परिणामक्रमसमाप्तिर गुणानाम
transliteration: tataḥ kṛtārthānāṃ pariṇāmakramasamāptir guṇānām
translation: Then the guṇas, having fulfilled their purpose, terminate their sequence
  of transformations.
commentary: 'The central claim of this verse is that the primal attributes (guṇas)
  cease their activity once the soul has received the experience they were intended
  to provide. This is not a mere cessation of change in prakṛti, but a purposeful
  completion of the evolutionary cycle that allows the soul to detach. The contested
  move here is the notion that the guṇas act with a goal—fulfilling a function—rather
  than as blind, self‑sustaining forces. In the Sāṃkhya‑Yoga framework, prakṛti is
  a dynamic, purposeless mass; yet this sutra re‑conceptualises it as a teacher that
  knows when its lessons are done. The implication for practice is that the practitioner
  should recognise the guṇas’ role as a provisional medium and seek to transcend their
  influence. By observing the guṇas’ cessation, one can realise that the self is not
  bound to the cyclic transformations of prakṛti, thereby moving toward kaivalya.
  This insight aligns with the Satchidananda commentary’s emphasis on the soul’s renunciation
  after sufficient experience, but it extends the idea by framing the guṇas’ termination
  as an intentional act of liberation rather than a passive end of change.


  Key Terms


  **guṇa (गुण)** — guṇa: from root guṇ- ‘to be good, to be goodness’; in Sāṃkhya,
  the three qualities (sattva, rajas, tamas) that constitute prakṛti; the term ‘guṇa’
  in this sutra implies an active, purposive agent, not merely a passive attribute


  **prakṛti (प्रकृति)** — prakṛti: from prā ‘to become’ + kṛti ‘made’; denotes the
  material substratum of the world, composed of the three guṇas; here it is portrayed
  as a teacher that ceases its work once its purpose is fulfilled


  **purusha (पुरुष)** — purusha: from puru ‘to be’ + śa ‘to be’ – the conscious, unchanging
  principle; in this sutra, the soul is the recipient of the guṇas’ experience, whose
  liberation is the ultimate goal


  Cross-Tradition Resonances


  **Yoga Sūtra 1.1, 1.2:** Both verses describe the relationship between purusha and
  prakṛti, establishing that prakṛti’s activity is directed toward purusha’s liberation;
  the homology lies in the causal link between the two principles

  *Divergence:* While 1.1 states the fundamental duality, 4.32 specifies the termination
  of prakṛti’s activity, adding a temporal dimension absent in the earlier verses


  **Bāla Sūtra 1.1:** Bāla’s first sutra also speaks of the guṇas’ activity in service
  of purusha, echoing the purposive character highlighted in 4.32

  *Divergence:* Bāla’s text presents the guṇas’ activity as continuous and unending,
  whereas 4.32 introduces an endpoint, suggesting a refinement of the earlier view


  **Sāṃkhya Kāṇḍa 2.3:** The Kāṇḍa describes the three guṇas as the means by which
  prakṛti manifests, paralleling the idea that guṇas function to fulfil a purpose

  *Divergence:* Sāṃkhya treats the guṇas as eternal modes, while 4.32 portrays them
  as having a finite, purposeful lifespan'
voice_of_siva: The central claim of this verse is that the primal attributes (guṇas)
  cease their activity once the soul has received the experience they were intended
  to provide.
abhyasa: Observe the subtle shifts in your thoughts and emotions; when you notice
  a pattern of change that no longer serves your growth, acknowledge that the guṇas
  have completed their work and gently let it go.
