sutra_id: YS_1_08
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Misconception as False Knowledge
sanskrit: विपर्ययो मिथ्याज्ञानम् अतद्रूपप्रतिṣ्ठम्
transliteration: viparyayo mithyājñānam atadrūpapratiṣṭham
translation: Wrong knowledge is a false conception of a thing whose real form does
  not correspond to that conception.
commentary: 'The passage asserts that misapprehension is a kind of knowledge that
  fails to align with reality, thereby negating its usefulness. It claims that knowledge
  is only valid when it accurately reflects the true nature of the object, a stance
  that aligns with the Sāṃkhya view that cognition must correspond to prakṛti for
  it to be meaningful. The contested move lies in the claim that misapprehension is
  still a form of knowledge; while some commentators treat it as ignorance (avidyā),
  here it is categorized as a distinct epistemic state. This distinction is significant
  because it preserves the analytic framework of the Yoga Sutras, where all cognition
  is classified as either real or false. The implication for practice is that the
  practitioner must cultivate awareness of the nature of their perceptions, discerning
  the subtle difference between genuine insight and mere illusion. The Dvivedi commentary’s
  illustrative examples—mistaking a mother‑of‑pearl for silver or a post for a man—highlight
  the everyday relevance of this distinction, reminding us that even ordinary misidentifications
  carry the same epistemic weight. By recognizing the false nature of such knowledge,
  one can begin to dismantle the vṛtti (mental modifications) that obscure the true
  self, thereby progressing toward samādhi, the stillness that arises when cognition
  aligns with puruṣa’s pure awareness.


  Key Terms


  **viparyayo (विपर्ययो)** — viparyā (misapprehension) → Sāṃkhya: misidentification
  of the object; default translation ‘mistake’ omits the epistemic nuance of false
  cognition


  **mithyājñānam (मिथ्याज्ञानम्)** — mithyā (false) + jñāna (knowledge) → Sāṃkhya:
  knowledge that does not correspond to reality; default ‘false knowledge’ lacks the
  idea of misidentification


  **atadrūpapratiṣṭham (अतद्रूपप्रतिṣ्ठम्)** — atad (that) + rūpa (form) + pratiṣṭha
  (standing) → Sāṃkhya: the state where the perceived form does not stand in relation
  to the real form; default ‘does not correspond’ misses the relational aspect


  Cross-Tradition Resonances


  **Yoga Sutra 1.8:** Structural homology with the earlier sutra 1.7, which defines
  the nature of false knowledge; both use a compound of a negation and a nominalized
  verb to articulate epistemic failure

  *Divergence:* While 1.7 emphasizes the epistemic failure itself, 1.8 explicitly
  links it to the misalignment between perception and reality, adding a relational
  dimension


  **Sāṃkhya Kārikā 1.3:** Both texts employ the pattern ‘X Y Z’ to describe the failure
  of cognition; here ‘viparyayo’ parallels ‘māyā’ (illusion) in Sāṃkhya

  *Divergence:* Sāṃkhya’s ‘māyā’ is metaphysical, whereas the Yoga sutra’s ‘viparyayo’
  is epistemic, focusing on the misidentification rather than ontological illusion


  **Bhaṭṭārāyaṇa’s commentary on 1.8:** The commentary uses the example of mistaking
  a mother‑of‑pearl for silver, mirroring the sutra’s emphasis on false correspondence

  *Divergence:* Bhaṭṭārāyaṇa expands the example to include doubt, whereas the sutra
  remains strictly about misidentification'
voice_of_siva: The passage asserts that misapprehension is a kind of knowledge that
  fails to align with reality, thereby negating its usefulness.
abhyasa: Notice each thought you observe; if it misrepresents the object, let it pass
  without attachment.
