sutra_id: YS_3_26
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Restraint of the Inner Sun
sanskrit: भुवनज्ञनं सूर्ये संयमात्
transliteration: bhuvanajñānaṃ sūrye saṃyamāt
translation: By restraining the inner Sun, one gains knowledge of the world.
commentary: 'The sūtra asserts that disciplined control of the luminous faculty of
  the mind—metaphorically the Sun—produces empirical knowledge of the world. This
  is a contested move: the term *sūrye* is not a literal celestial body but the inner
  light of consciousness that illuminates perception. In the Yoga and Sāṃkhya tradition,
  the mind’s luminous faculty is the vehicle through which *prāṇāyāma* and *samādhi*
  refine perception. The sūtra aligns with Patanjali’s opening claim that yoga is
  the control of the mind’s fluctuations (*citta‑vṛtti‑nirodhaḥ*), yet it narrows
  the focus to the *inner Sun* as the source of all cognition. The implication for
  practice is that by cultivating *saṃyama* (restraint) over the mind’s luminous activity,
  one can access *bhuvanajñāna*—the knowledge of the world—without external aids.
  This resonates with the Sāṃkhya doctrine that *purūṣa* is the witness and *prakṛti*
  the material cause; the Sun here is the *prakṛti*‑mediated illumination that, when
  restrained, reveals the *purūṣa*’s true nature. The sūtra thus bridges the epistemological
  gap between internal discipline and external knowledge, offering a concrete method
  for experiential insight.


  Key Terms


  **bhuvana (भुवन)** — etymology: *bhu* (earth) + *vana* (forest) → world; tradition
  meaning: the material realm; default translation ‘world’ misses its role as the
  domain of empirical knowledge.


  **jñāna (ज्ञान)** — etymology: *jñ* (to know) + *ā* (suffix) → knowledge; tradition
  meaning: both empirical and spiritual cognition; default translation ‘knowledge’
  omits its epistemic hierarchy.


  **sūrye (सूर्ये)** — etymology: *sūry* (sun) + locative *‑e* → ‘in the Sun’; tradition
  meaning: the luminous faculty of consciousness; default translation ‘Sun’ misleads
  as a celestial body.


  **saṃyamāt (संयमात्)** — etymology: *saṃ* (together) + *yam* (control) + *‑āt* (from);
  tradition meaning: restraint or discipline; default translation ‘from restraint’
  misses its causal role in generating knowledge.


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtras, 1.1:** Both texts posit that disciplined control of the
  mind’s luminous activity yields knowledge; *Yogaś citta‑vṛtti‑nirodhaḥ* parallels
  *saṃyamāt* on the Sun.

  *Divergence:* Patanjali speaks of all mind fluctuations, whereas YS 3.26 singles
  out the Sun as the primary source of cognition.


  **Sāṃkhya Kāṇḍa, 1.1:** The distinction between *purūṣa* (witness) and *prakṛti*
  (material cause) mirrors the sūtra’s separation of inner Sun (prakṛti) and worldly
  knowledge (bhuvana).

  *Divergence:* Sāṃkhya treats the Sun metaphorically as *prakṛti* itself, while YS
  3.26 uses it as a vehicle for *saṃyama*.


  **Bāṇāyana, Vākyapadīya, 4.3:** The idea that disciplined attention to the mind’s
  luminous faculty clarifies perception appears in the Vākyapadīya’s discussion of
  *saṃyama*.

  *Divergence:* Bāṇāyana focuses on linguistic perception, whereas YS 3.26 extends
  to empirical knowledge of the world.'
