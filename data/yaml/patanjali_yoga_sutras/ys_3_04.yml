sutra_id: YS_3_04
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Threefold Samyama
sanskrit: त्रयम् एकत्रः संयमः
transliteration: trayam ekatra saṃyamaḥ
translation: The three together constitute Samyama.
commentary: 'The claim of this verse is that the three prāṇāyāma‑related processes—focus,
  absorption, and contemplation—are not merely sequential steps but a unified, inseparable
  whole. In the Yoga and Sāṃkhya traditions, this unity is essential: it transforms
  the ordinary mind (citta) into a steady, unshakable witness (purusha). The contested
  move is the assertion that the three are ‘together’ (ekatra) rather than merely
  ‘in sequence.’ Dvivedi’s commentary calls this a technical name for the collective
  practice, but the Pratibha view goes further: it argues that the unity is ontological,
  not procedural. When the mind is fixed on a single object, the three processes merge
  into a single field of consciousness, thereby dissolving the vṛtti (mental fluctuations)
  that bind the mind to prakṛti. This dissolution is the gateway to the higher samādhi,
  the state where the practitioner experiences the non‑dual reality of purusha without
  the interference of prakṛti. The existential application is clear: by engaging all
  three processes simultaneously, one can break the habitual patterns of thought and
  experience the unconditioned self. This is not a mere technical exercise; it is
  a radical re‑orientation of the self’s relationship to its own mental activity,
  aligning with the Sāṃkhya aim of discerning purusha from prakṛti. The unity of the
  three also anticipates the later notion of īśvara‑pratīṣṭhā, where the self is seen
  as the ultimate observer of all mental activity.


  Key Terms


  **yoga (योग)** — root: ‘to bind or join’; in Sāṃkhya, the binding of purusha to
  prakṛti; in Yoga, the union of mind and body in disciplined practice; the term here
  implies the integrative process of the three


  **citta (चित्त)** — root: ‘to think’; in Sāṃkhya, the totality of mind including
  feelings, perceptions, and volition; in Yoga, the field of mental activity that
  is the target of samyama; the term signals the object of the three processes


  **vṛtti (वृत्ति)** — root: ‘to turn’; in Sāṃkhya, the fluctuations of mind that
  bind purusha to prakṛti; in Yoga, the mental modifications that samyama seeks to
  still; the term here underscores the problem that the three aim to resolve


  Cross-Tradition Resonances


  **Yoga Sūtra 1.2:** The structural pattern of ‘three together’ mirrors the triad
  of purusha, prakṛti, and maya; both use the same syntactic construction to emphasize
  unity.

  *Divergence:* While 1.2 focuses on ontological triad, 3.4 applies the triad to a
  practical technique, shifting from metaphysics to praxis


  **Yoga Sūtra 2.2:** Both verses employ the word ‘ekatra’ to signal inseparability;
  2.2 speaks of the three qualities of samādhi, 3.4 of the three techniques

  *Divergence:* In 2.2 the unity is of states, whereas in 3.4 it is of processes,
  showing a functional shift'
voice_of_siva: The claim of this verse is that the three prāṇāyāma‑related processes—focus,
  absorption, and contemplation—are not merely sequential steps but a unified, inseparable
  whole.
abhyasa: Focus your attention on a single object, and while doing so, let the mind’s
  focus, absorption, and contemplation arise together in a seamless, unified flow.
