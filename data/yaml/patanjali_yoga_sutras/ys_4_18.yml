sutra_id: YS_4_18
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Mind’s Mastery over Change
sanskrit: सदा ज्ञाताश् चित्तवृत्तयः तत् प्रभोः पुरुषस्य अपरीणामित्वात्
transliteration: sadā jñātāś cittavṛttayas tatprabhoḥ puruṣasyāpariṇāmitvāt
translation: The mind‑stuff’s fluctuations are always known to the same Lord, the
  Purusha, because of its unchanging nature.
commentary: 'The central claim of this sutra is that the Purusha, as the immutable
  witness, is the sole cognizer of the mind’s ever‑shifting states. This is not merely
  a metaphysical observation but a practical injunction: if the Purusha can perceive
  the mind’s changes without being altered, then the mind itself can be brought to
  a state of stillness by aligning with that same witnessing consciousness. The contested
  move here is the identification of the Purusha as the *master* of the mind‑stuff,
  a position that some commentators reserve for Īśvara. By placing the Purusha at
  the center, Patanjali elevates the Sāṃkhya principle of dualism—prakṛti (the changing
  material) and puruṣa (the unchanging observer)—into a dynamic practice: the mind’s
  vṛtti (tendencies) are not to be suppressed but observed from the standpoint of
  the unchanging witness. In the Yoga tradition, this observation is the first step
  toward samādhi, the absorption of the mind into its true nature. The Satchidananda
  commentary’s remark that the Purusha “always knows” the changes underscores the
  experiential certainty that must accompany the intellectual claim. Thus, the sutra
  invites the practitioner to cultivate a direct, non‑identifying awareness of the
  mind’s flux, thereby turning the mind’s habitual vṛtti into a mirror that reflects
  the Purusha’s eternal stillness. This experiential turn is what makes the sutra
  a bridge between theory and practice, between the Sāṃkhya ontology of dualism and
  the Yoga praxis of self‑realization.


  Key Terms


  **citta (चित्त)** — citta (mind‑stuff) – from ‘cint’ (to think); in Sāṃkhya, the
  subtle material of consciousness; in Yoga, the object of meditation; the translation
  ‘mind’ omits its subtle, composite nature


  **vṛtti (वृत्ति)** — vṛtti (tendency/impulse) – from ‘vṛtti’ (to turn); in Sāṃkhya,
  the modes of prakṛti; in Yoga, the fluctuations of citta that must be observed


  **puruṣa (पुरुष)** — puruṣa (the Self) – from ‘puru’ (to be) + ‘ṣa’ (possessor);
  in Sāṃkhya, the pure consciousness; in Yoga, the witness that is unchanging; the
  translation ‘self’ often obscures its role as the master of citta


  **prakṛti (प्रकृति)** — prakṛti (nature) – from ‘prakṛti’ (to be born); in Sāṃkhya,
  the dynamic, material reality; in Yoga, the source of all vṛtti; the translation
  ‘nature’ neglects its role as the source of change


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 4.18:** Both the Yoga Sūtra and the Sāṃkhya Tattvasūtra
  affirm that the Purusha is the sole cognizer of prakṛti’s fluctuations, establishing
  a structural homology in the role of witness.

  *Divergence:* While the Sūtra emphasizes the experiential knowledge of the mind’s
  changes, the Tattvasūtra presents it as a purely theoretical assertion, lacking
  the practical implication of samādhi


  **Bhartrhari, Vākyapadīpika 2.3:** The idea that an unchanging subject can recognize
  a changing object parallels Bhartrhari’s claim that a static grammatical rule can
  account for dynamic linguistic usage.

  *Divergence:* Bhartrhari’s analogy is metaphorical, whereas Patanjali’s sutra applies
  the principle directly to consciousness, making it a concrete meditative target


  **Shankara, Commentary on Brahma Sutra 1.1.1:** Shankara’s assertion that the Self
  is the witness of all experiences mirrors Patanjali’s claim of the Purusha’s mastery
  over citta’s vṛtti.

  *Divergence:* Shankara’s commentary operates within Advaita Vedānta’s monistic framework,
  whereas Patanjali maintains a dualistic ontology, preserving the distinctness of
  puruṣa and prakṛti'
voice_of_siva: The central claim of this sutra is that the Purusha, as the immutable
  witness, is the sole cognizer of the mind’s ever‑shifting states.
abhyasa: Observe your thoughts as they arise, noting each change without attachment,
  and recognize that you are the unchanging witness of all such fluctuations.
