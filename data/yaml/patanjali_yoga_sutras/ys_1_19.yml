sutra_id: YS_1_19
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Consciousness in the Realm of Reality
sanskrit: भवप्रत्ययो विड्हप्रकृतिलयाणाम्
transliteration: bhavapratyayo videhaprakṛtilayānām
translation: The state of being [videha] (world‑bound) and [prāyā] (in the realm of
  prakṛti) is the condition of those who are trapped in the concrete universe.
commentary: 'The sūtra asserts that a yogi who remains in the state of videha—bound
  to the world—and prāyā—immersed in the realm of prakṛti—has not transcended the
  first stage of samādhi. The claim is that true samādhi is the cessation of vṛtti,
  the cessation of the mind’s oscillations, and that only when the mind’s activity
  is fully still does it encounter the ultimate reality, puruṣa. The contested move
  is the identification of videha and prāyā with the concrete universe; some commentators
  read them as merely states of mind, while others, following the Sāṃkhya ontology,
  see them as ontological categories. In the Sāṃkhya‑Yoga synthesis, videha is the
  body‑mind complex that identifies with prakṛti, and prāyā is the realm of the five
  elements. The sūtra therefore warns that a yogi who stops at this stage has only
  achieved a partial samādhi, one that is still dependent on the existence of the
  world and cannot access the pure consciousness of puruṣa. This has a direct existential
  application: it reminds practitioners that the goal is not merely to achieve a state
  of deep meditation, but to dissolve the identification with prakṛti and the body.
  The Dvivedi commentary reinforces this by noting that such yogis are “inferior”
  because they are still bound to the world and their samādhi is merely a means, not
  an end. The sūtra thus sets the stage for the subsequent verses that describe the
  higher, ultimate samādhi where the mind is free from all vṛtti and the yogi experiences
  the unconditioned reality of puruṣa.


  Key Terms


  **videha (विध)** — videha: from ‘vid’ (to know) + ‘aha’ (to be) – ‘being known’;
  in Sāṃkhya it denotes the body‑mind complex that identifies with prakṛti; the term’s
  literal meaning of ‘world‑bound’ is often lost in translations that render it simply
  as ‘body’


  **prāyā (प्राय)** — prāyā: from ‘prā’ (to go) + ‘yā’ (going); literally ‘the realm
  one goes to’; in Sāṃkhya it refers to the realm of prakṛti, the five elements; translations
  often gloss it as ‘realm of nature’ but miss its ontological status as the field
  of activity


  **samādhi (समाधि)** — samādhi: from ‘sam’ (together) + ‘ādh’ (to hold); literally
  ‘holding together’; in Yoga it is the culmination of the eight limbs, the state
  of stillness of vṛtti; translations often use ‘meditation’ but fail to convey its
  depth as the cessation of all mental fluctuations


  **purusha (पुरुष)** — purusha: from ‘puru’ (to be) + ‘-sha’ (possessor); literally
  ‘the possessor of being’; in Sāṃkhya it is the eternal, unchanging consciousness
  that is distinct from prakṛti; translations often simplify it to ‘soul’ but neglect
  its role as the witness consciousness


  Cross-Tradition Resonances


  **Yoga Sutra 1.20:** Both 1.19 and 1.20 describe the progression from a limited
  samādhi to a higher one; 1.19 focuses on the state of videha and prāyā, while 1.20
  introduces the idea of the mind’s stillness

  *Divergence:* 1.20 moves beyond the concrete universe to the realm of the mind,
  breaking the pattern of material focus


  **Sāṃkhya Karika 1.1:** The distinction between puruṣa and prakṛti is echoed in
  the sūtra’s reference to videha and prāyā

  *Divergence:* Sāṃkhya Karika presents the dichotomy as a metaphysical principle,
  whereas the sūtra frames it as a practical stage of yogic attainment


  **Brahma Sutra 1.1.2:** Both texts discuss the limitation of the world in relation
  to ultimate reality

  *Divergence:* The Brahma Sutra uses a theological argument, whereas the sūtra uses
  a phenomenological description of samādhi


  **Dvivedi Commentary 1.19:** Dvivedi explicitly labels those in videha and prāyā
  as ‘inferior yogis’

  *Divergence:* Dvivedi’s commentary adds a moral judgment that the original sutra
  does not explicitly state'
voice_of_siva: The sūtra asserts that a yogi who remains in the state of videha—bound
  to the world—and prāyā—immersed in the realm of prakṛti—has not transcended the
  first stage of samādhi.
abhyasa: You observe the mind’s activity and, when you notice it dwelling in the world
  and the elements, you consciously let it rest, allowing your awareness to detach
  from the body and the material realm.
