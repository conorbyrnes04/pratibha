sutra_id: YS_3_34
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Heart‑Centered Mind
sanskrit: हृदये चित्तसंवित
transliteration: hṛdaye cittasaṃvit
translation: The mind, in the heart, is united with the heart’s essence.
commentary: 'The sūtra asserts that the heart (hṛdaya) is the locus where the mind
  (citta) attains unity (saṃvit) with its own core. This is not a mere psychological
  observation but a metaphysical claim: the heart is the *sāmānya* (common ground)
  between the *puruṣa* (consciousness) and the *prakṛti* (material nature), and it
  is here that the *vṛtti* (mental modifications) are transmuted into a single, luminous
  awareness. In the Yoga–Sāṃkhya framework, the heart is the *ābhyantara* (inner)
  locus where *samādhi* is first experienced as a subtle, spontaneous flash of insight—what
  the Satchidananda commentary calls a “spontaneous intuitive light‑flash.” This flash
  is not an external revelation but an *in‑situ* illumination that arises from the
  heart’s own purity, a state achieved through disciplined practice. The philosophical
  implication is that the heart is the *pratibha* of the self: a mirror that reflects
  the true nature of *citta* without distortion. Practically, this means that by cultivating
  a calm, focused heart—through breath, posture, and ethical conduct—one can directly
  observe the unity of mind and self, thereby accelerating the path to liberation.
  The sūtra thus bridges the abstract metaphysics of Yoga with concrete, experiential
  practice, offering a gateway to the realization that the heart itself is the *īśvara*
  of the individual, the ultimate witness of consciousness.


  Key Terms


  **citta (चित्त)** — citta (mind) – from root *cit* ‘to perceive’; in Sāṃkhya, the
  conscious faculty that processes *vṛtti*; the translation ‘mind’ omits its role
  as the perceiving, modifying agent of consciousness.


  **vṛtti (वृत्ति)** — vṛtti (mental modification) – from *vṛ* ‘to turn’; denotes
  the fluctuations of *citta* that obscure *puruṣa*; the term’s technical nuance of
  ‘turning’ is lost when rendered simply as ‘thoughts''.


  **puruṣa (पुरुष)** — puruṣa (consciousness) – from *pur* ‘to be’; in Sāṃkhya, the
  eternal, passive witness; the common translation ‘self’ fails to capture its passive,
  observing nature.


  **prakṛti (प्रकृति)** — prakṛti (material nature) – from *prakṛ* ‘to be born’; the
  dynamic, unmanifested material principle; translation ‘nature’ neglects its role
  as the source of all change.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.1:** Both verses locate the heart as the central locus of experience,
  suggesting a structural parallel in the opening of the text.

  *Divergence:* While 1.1 speaks of the mind’s wandering, 3.34 emphasizes the heart’s
  unifying power, shifting focus from external distraction to internal integration.


  **Sāṃkhya Kāṇḍa 2.3:** Both texts identify the heart as the site where *citta* and
  *prakṛti* interact, mirroring the dualistic schema.

  *Divergence:* Sāṃkhya presents this interaction as a passive observation, whereas
  the Yoga Sūtra frames it as an active unification, reflecting Yoga’s dynamic praxis.


  **Vāgīya Upaniṣad 1.2:** Both texts use the heart as a metaphor for inner knowledge,
  aligning with the Upaniṣadic tradition of the heart as the seat of the soul.

  *Divergence:* The Upaniṣad’s metaphor is poetic, whereas the Yoga Sūtra’s use is
  doctrinal, providing a concrete locus for meditative practice.'
voice_of_siva: The sūtra asserts that the heart (hṛdaya) is the locus where the mind
  (citta) attains unity (saṃvit) with its own core.
abhyasa: Focus your breath on the center of your chest, feeling the subtle pulse;
  as you inhale, imagine the heart’s essence uniting with your mind, and as you exhale,
  let the unity expand outward, sustaining this awareness for several minutes.
