sutra_id: YS_1_11
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Memory as Non‑Cognition
sanskrit: अनुभूतविषयासंप्रमोषः स्मृतिḥ
transliteration: anubhūtaviṣayāsaṃpramoṣaḥ smṛtiḥ
translation: Memory is the non‑allowing of a thing to be cognised.
commentary: 'The sūtra declares that memory is the *non‑allowing* of a thing to be
  cognised, a claim that situates memory as a *negative* cognitive act rather than
  a positive recollection. In the Yoga and Sāṃkhya traditions, cognition is understood
  as a triadic process: *pratyakṣa* (direct perception), *anumana* (inference), and
  *smṛti* (memory). Here, however, the author redefines *smṛti* not as a repository
  of past impressions but as an active *rejection* of a present object from cognition.
  This reframing aligns with the Sāṃkhya notion that *citta* (mind‑process) can be
  *sādhana* (practice) or *vṛtti* (mental affliction). By denying the object, memory
  becomes a *vṛtti* that keeps the mind from slipping into *vṛtti*‑driven identification.
  The Dvivedi commentary notes that memory may arise in any of the five states of
  consciousness, yet the sūtra’s emphasis on *non‑allowing* suggests that even in
  waking, memory can be a *sādhana* that keeps the mind from clinging to *pratyakṣa*
  or *anumana*. Thus, memory is transformed from a passive recollection to an active
  *sādhana* that preserves the *purusha*’s distinction from *prakṛti*. Practically,
  this means that when a thought arises, one should not merely recall it but *withhold*
  it from the mind’s awareness, thereby preventing the *citta* from becoming entangled
  in the *vṛtti* of past experiences. This practice is foundational for achieving
  *samādhi*, where the mind rests in its pure, non‑cognitive state, unburdened by
  the *non‑allowing* of objects.


  Key Terms


  **smṛti (स्मृति)** — etymology: ‘to remember’ -> Sāṃkhya tradition: repository of
  past impressions; here: active non‑allowing of cognition, a *sādhana* rather than
  passive recall


  **citta (चित्त)** — etymology: ‘mind‑process’ -> Sāṃkhya: the manifold mind‑activities;
  here: the locus of *vṛtti* that must be kept from object‑allowing


  **vṛtti (वृत्ति)** — etymology: ‘affliction’ -> Yoga: mental fluctuations; here:
  the specific fluctuation of object‑allowing that memory must suppress


  **purusha (पुरुष)** — etymology: ‘self’ -> Sāṃkhya: eternal, conscious principle;
  here: the ultimate observer that remains distinct when memory *non‑allows*


  Cross-Tradition Resonances


  **Yoga Sūtra 1.9:** Both 1.9 and 1.11 describe memory as a transformation of cognition,
  but 1.9 frames it as a *recollection* of past impressions, while 1.11 reframes it
  as a *non‑allowing* act, highlighting a shift from positive to negative cognition

  *Divergence:* 1.9’s positive recollection is productive for *vijñāna* (knowledge),
  whereas 1.11’s negative stance is necessary for *samādhi*


  **Sāṃkhya Kāṇḍa 3:** The Sāṃkhya view that *citta* can be *sādhana* or *vṛtti* parallels
  the sūtra’s claim that memory can be a *sādhana* that suppresses *vṛtti*

  *Divergence:* Sāṃkhya treats *citta* as a dual potential, while the sūtra specifies
  memory’s role in actively preventing *citta* from allowing objects


  **Dvivedi Commentary on YS 1.11:** Dvivedi notes memory may arise in any of the
  five states, echoing the sūtra’s universality of memory’s function

  *Divergence:* Dvivedi’s commentary emphasizes the *state* of consciousness, whereas
  the sūtra focuses on the *process* of non‑allowing'
