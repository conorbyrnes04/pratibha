sutra_id: YS_1_09
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Vikalpa — Verbal Construction
sanskrit: शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः
transliteration: śabdajñānānupātī vastuśūnyo vikalpaḥ
translation: Imaginary knowledge arises from words alone and is empty of any real
  object.
commentary: 'The claim that vikalpa is a mental construct with no external correlate
  is a decisive philosophical stance. By defining vikalpa as a word‑generated notion
  devoid of reality, the Sūtra draws a sharp boundary between the world of experience
  and the world of pure cognition. In the Yoga and Sāṃkhya traditions, this demarcation
  is crucial: it separates the illusory, mutable world of prakṛti from the unchanging,
  self‑evident nature of puruṣa. The Sūtra’s insistence that vikalpa is merely a linguistic
  artifact underscores the importance of discerning the real (puruṣa) from the unreal
  (prakṛti) in the practice of samādhi. The Dvivedi commentary’s illustration—‘the
  horns of a hare, the rising or setting of the sun, the thinking of the soul’—serves
  to highlight that even the most vivid images are ultimately empty of independent
  existence. This aligns with the Yoga notion that all mental formations are transient
  and must be transcended to achieve liberation. The existential application is clear:
  by recognizing that thoughts and images are mere verbal constructions, one learns
  to detach from them, thereby stabilizing the mind in samādhi. The Sūtra’s precise
  terminology—‘śabda’ (word), ‘jñāna’ (knowledge), ‘anupātī’ (produced by), ‘vastuśūnya’
  (empty of substance), ‘vikalpa’ (verbal construction)—provides a compact framework
  for this discernment. The Sūtra’s brevity does not diminish its depth; rather, it
  invites the practitioner to interrogate every mental event as a potential vikalpa,
  thereby sharpening the mind’s focus on the unchanging self.


  Key Terms


  **śabda (शब्द)** — etymology: ‘sound’ -> tradition meaning: the spoken word or mental
  utterance -> default translation ‘word’ misses its role as the vehicle of thought,
  the medium that produces vikalpa


  **jñāna (ज्ञान)** — etymology: ‘knowledge’ -> tradition meaning: cognition of the
  self -> default translation ‘knowledge’ overlooks its function as the content that
  becomes empty in vikalpa


  **vikalpa (विकल्प)** — etymology: ‘choice’ or ‘doubt’ -> tradition meaning: mental
  formation, verbal delusion -> default translation ‘imaginary knowledge’ or ‘verbal
  construction’ better captures its status as a word‑generated notion empty of any
  real object


  **vastuśūnya (वस्तुशून्य)** — etymology: ‘empty of substance’ -> tradition meaning:
  lacking independent existence -> default translation ‘empty’ misses its specific
  reference to non‑correspondence with reality


  Cross-Tradition Resonances


  **Yoga Sūtra 1.9:** Defines vikalpa as a word‑generated notion lacking reality

  *Divergence:* Unlike later commentaries that treat vikalpa as a broader category
  of mental error, this Sūtra restricts it to linguistic constructs


  **Bhaṭṭa, Yogabhāṣā 1.1.1:** Describes vikalpa as a mental image arising from sense
  perception

  *Divergence:* Bhaṭṭa expands vikalpa beyond mere words, including sensory impressions,
  whereas the Sūtra limits it to words


  **Shankara, Vivekachudamani 1:** Emphasizes the emptiness of all conceptualizations

  *Divergence:* Shankara’s view is more ontological, while the Sūtra focuses on the
  linguistic production of vikalpa


  **Dvivedi, Commentary on YS 1.9:** Illustrates vikalpa with concrete examples (horns
  of a hare, sun’s movement)

  *Divergence:* Dvivedi’s examples are metaphorical, whereas the Sūtra’s definition
  is purely linguistic'
voice_of_siva: The claim that vikalpa is a mental construct with no external correlate
  is a decisive philosophical stance.
abhyasa: Recognize each fleeting thought as a word‑generated notion and let it pass
  without attachment.
