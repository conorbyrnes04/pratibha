sutra_id: YS_1_17
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Consciousness of Argument and Joy
sanskrit: वितर्कविचारानन्दस्मितारूपानुगमात् संप्रज्ञातः
transliteration: vitarkavicārānandāsmitārūpānugamāt saṃprajñātaḥ
translation: The conscious one is that which is attended by argumentation, deliberation,
  joy, and the sense of being.
commentary: 'The sūtra declares that samādhi is not merely a passive absorption but
  a dynamic, tri‑modal awareness that simultaneously engages the mind in argument
  (savitrāka), deliberation (savichara), and the experiential sense of being (asmita).
  This triad is a philosophical claim that consciousness is an active, self‑reflective
  process rather than a static state. The contested move lies in the identification
  of ‘samādhi’ with ‘samprajñātaḥ’—the idea that the very nature of samādhi is to
  be known, not merely attained. In the Yoga and Sāṃkhya framework, this aligns with
  the notion that puruṣa (the knower) is distinct from prakṛti (the known), yet their
  union in samādhi is the ultimate realization. The sūtra’s emphasis on joy (ananda)
  as a component of consciousness anticipates later Yogic texts that treat joy as
  a necessary quality for true samādhi. The Dvivedi commentary’s distinction between
  ‘savitrāka’ (argumentative) and ‘savichara’ (deliberative) meditation is echoed
  here, but the sūtra’s wording collapses them into a single, unified conscious experience.
  Practically, this means that a practitioner should cultivate a mind that not only
  observes but also interrogates and delights in the very act of observation, thereby
  transcending mere passive absorption. This existential application invites the practitioner
  to live in a state of continuous, joyful self‑reflection, which is the hallmark
  of true samādhi.


  Key Terms


  **samprajñātaḥ (सम्प्रज्ञातः)** — samprajñātaḥ (conscious) → Sāṃkhya: the knower’s
  knowledge; Yoga: the state of samādhi where consciousness is aware of itself and
  its objects; default translation ‘conscious’ misses the self‑reflective quality


  **asmita (अस्मिता)** — asmita (sense of being) → Sāṃkhya: pure consciousness; Yoga:
  the realization of ‘I am’ without ego; default translation ‘sense of being’ omits
  its role as the ultimate marker of samādhi


  **savitrāka (सवित्राक)** — savitrāka (argumentative meditation) → Sāṃkhya: deliberation
  on distinctions; Yoga: a mode of samādhi involving logical inquiry; default translation
  ‘argumentation’ lacks the meditative nuance


  **savichara (सविचार)** — savichara (deliberative meditation) → Sāṃkhya: contemplation
  of relations; Yoga: a mode of samādhi involving reflective thought; default translation
  ‘deliberation’ misses its contemplative depth


  Cross-Tradition Resonances


  **Yoga Sūtra 1.17 – 1.18:** Both verses describe samādhi as a state where consciousness
  is attended by argumentation, deliberation, joy, and the sense of being, mirroring
  the tri‑modal structure of Sāṃkhya’s puruṣa‑prakṛti distinction.

  *Divergence:* While the Sūtra condenses the four qualities into a single phrase,
  later commentaries separate them into distinct meditative modes, suggesting a more
  granular practice


  **Bhaṭṭa’s Ātmarūpaśāstra 1.1:** Bhaṭṭa also links samādhi with the sense of being
  (asmita) and joy, emphasizing the experiential aspect of consciousness.

  *Divergence:* Bhaṭṭa’s text places greater emphasis on the experiential bliss of
  samādhi, whereas the Sūtra presents it as a necessary component of consciousness
  rather than an end in itself


  **Dvivedi’s Commentary on YS 1.17:** Dvivedi elaborates on savitrāka and savichara,
  aligning with the Sūtra’s mention of argumentation and deliberation.

  *Divergence:* Dvivedi’s commentary expands the sūtra’s terse statement into four
  distinct meditative states, thereby providing a more detailed pedagogical framework'
