sutra_id: YS_2_21
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: The Sight’s Being
sanskrit: तदर्थं एव दर्श्यस्यात्मा
transliteration: tadartha eva dṛśyasyātmā
translation: The being of the sight is for him.
commentary: 'The sūtra asserts that the very essence of perception—its being—exists
  for the seer. This is not a mystical claim but a statement about the functional
  relationship between prakṛti (the material world) and puruṣa (the conscious witness).
  In Sāṃkhya, prakṛti acts not as an autonomous agent but as a vehicle that presents
  itself to puruṣa, whose awareness is the only true observer. The sūtra therefore
  positions puruṣa as the indispensable substratum that gives meaning to all appearances.
  The term *atma* here is best understood as the inherent nature of the sight, i.e.,
  the way in which the eye’s activity is constituted. The sūtra’s brevity masks a
  profound ontological claim: without puruṣa, the ‘being’ of prakṛti would lack any
  referent. This mirrors the Sāṃkhya principle that prakṛti’s activity is purposeless
  unless it is perceived by puruṣa. The sūtra also foreshadows the later yogic insight
  that the mind’s fluctuations are merely appearances that arise for the purpose of
  revealing the self. Thus, the sūtra invites practitioners to recognize that every
  sensory experience is a manifestation designed to point back to the unchanging witness,
  encouraging a shift from identification with the sensory world to identification
  with the witness itself.


  Key Terms


  **atma (आत्मा)** — ‘self’ in early texts; here denotes the inherent nature of the
  sight—its being as presented to puruṣa, not an autonomous soul


  **prakṛti (प्रकृति)** — the material nature; in this context the active process
  of appearance that exists for the purpose of revealing puruṣa


  **puruṣa (पुरुष)** — the conscious witness; the indispensable substratum that gives
  referent to prakṛti’s activity


  **sight (दर्श)** — the sensory faculty; the means by which prakṛti presents itself
  to puruṣa


  Cross-Tradition Resonances


  **Yoga Sutra 2.21:** Both the Yoga Sutra and Sāṃkhya treat prakṛti’s activity as
  purposeless without puruṣa, underscoring the interdependence of matter and consciousness

  *Divergence:* While Sāṃkhya emphasizes the dualism of prakṛti and puruṣa, the Sutra
  frames the relationship in terms of the ‘being’ of the sight, subtly shifting focus
  to the experiential aspect rather than ontological distinction


  **Sāṃkhya Kārikā 1.1:** The principle that prakṛti’s manifestations are for puruṣa’s
  awareness is echoed here

  *Divergence:* The Sutra uses a more poetic phrasing (‘being of the sight’) that
  foregrounds the sensory faculty, whereas the Kārikā presents the idea in a more
  abstract, philosophical tone


  **Yoga Sutra 2.18:** Both sutras discuss the function of prakṛti as a vehicle for
  puruṣa’s awareness

  *Divergence:* The earlier sutra speaks of the mind’s fluctuations, while 2.21 focuses
  specifically on the sight, narrowing the scope to a particular sensory modality'
voice_of_siva: The sūtra asserts that the very essence of perception—its being—exists
  for the seer.
abhyasa: Observe your gaze now; notice how the world appears only because you are
  looking, and feel the awareness that makes this appearance possible.
