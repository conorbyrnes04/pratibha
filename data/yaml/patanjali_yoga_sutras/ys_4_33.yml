sutra_id: YS_4_33
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Uninterrupted Succession of Moments
sanskrit: क्षणप्रत्योगी परिनामपरान्तनिरग्राह्यः क्रमः
transliteration: kṣaṇapratiyogī pariṇāmāparāntanirgrāhyaḥ kramaḥ
translation: The sequence is an uninterrupted succession of moments, each moment being
  the final end of its transformation and yet graspable and recognizable at the end
  of that transformation.
commentary: 'The central philosophical claim of this sūtra is that the true nature
  of reality is a continuous, unbroken stream of moments, each moment being the culmination
  of its own transformation yet still discernible as a distinct entity. This challenges
  the conventional dualistic notion that moments are discrete, isolated events. The
  contested move here is the identification of "pratiyogī" as not merely a temporal
  succession but as a mode of existence that is both dependent and independent—each
  moment depends on its predecessor yet remains autonomous. Within the Yoga and Sāṃkhya
  framework, this aligns with the notion of *pratītyāśraya* (dependent arising) while
  simultaneously affirming the *sāmānya* (universal) continuity of *kṣaṇa*. The sūtra
  invites the practitioner to experience the flow of time not as a series of jumps
  but as a seamless continuum, thereby dissolving the illusion of a fragmented self.
  By recognizing each moment as both the end of its own change and still graspable,
  one cultivates a state of *samādhi* where the mind rests in the present, free from
  the tyranny of past and future. This experiential insight is crucial for attaining
  *kaivalya*, the liberation that the Yoga Sutras ultimately aim for.


  Key Terms


  **kṣaṇa (क्षण)** — kṣaṇa (moment) – from root *kṣ* meaning ‘to cut’ implying a precise,
  indivisible instant; in traditional usage it denotes the smallest unit of time,
  a point rather than a duration, underscoring the discontinuous yet continuous nature
  of experience.


  **pratiyogī (प्रत्योगी)** — pratiyogī (uninterrupted succession) – etymologically
  ‘partnering together’; traditionally it connotes a series of dependent events that
  are nonetheless continuous, challenging the notion of isolated moments.


  **pariṇāma (परिणाम)** — pariṇāma (transformation) – from *pari* ‘around’ + *nāma*
  ‘to take’; it signifies the process of change that culminates in a new state, highlighting
  the dynamic aspect of each kṣaṇa.


  **nirgrāhyaḥ (निरग्राह्यः)** — nirgrāhyaḥ (graspable) – literally ‘without grasping’
  yet here meaning ‘recognizable without attachment’; it points to the non-attachment
  to the moment while still being able to perceive it.


  Cross-Tradition Resonances


  **Yoga Sutras 1.1:** Both sutras emphasize the continuity of consciousness; 1.1
  speaks of the mind’s wandering, while 4.33 frames the moments as an uninterrupted
  sequence.

  *Divergence:* 1.1 suggests a fragmented mind, whereas 4.33 asserts a unified, continuous
  flow, thereby reconciling apparent fragmentation with underlying unity.


  **Samkhya Karika 2.3:** The Karika discusses *pratītyāśraya* (dependent arising)
  as a chain; 4.33 mirrors this with *pratiyogī* but adds the quality of being graspable.

  *Divergence:* Karika treats dependence as purely causal, whereas 4.33 introduces
  a perceptual dimension, allowing moments to be recognized despite their dependence.


  **Yoga Vasistha 1.2:** Both texts describe the mind’s temporal experience as a series
  of moments; Vasistha uses the metaphor of a river.

  *Divergence:* Vasistha focuses on illusionary flow, whereas 4.33 asserts the objective
  reality of the sequence, emphasizing its recognizability.'
