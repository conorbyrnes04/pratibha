sutra_id: YS_1_31
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Obstacles in Breath and Mind
sanskrit: दुःखदौर्मणस्याङगेजयत्वश्वासप्रश्वासाविक्षेपसहभुवः
transliteration: duḥkhadaurmanasyāṅgamejayatvaśvāsapraśvāsā vikṣepasahabhuvaḥ
translation: Pain, despair, nervousness, inspiration, and expiration accompany the
  causes of distraction.
commentary: 'The passage asserts that the very sensations of pain, despair, nervousness,
  and the irregularities of breathing—both inhalation and exhalation—serve as external
  markers of a mind that has slipped from its proper focus. In the Yoga and Sāṃkhya
  framework, the mind (citta) is a dynamic system of vṛtti (mental modifications)
  that must be steadied by the practitioner. Here, the author is not merely listing
  symptoms; he is making a philosophical claim that the presence of these bodily and
  psychological disturbances is a necessary condition for recognizing that the mind
  has become distracted. The contested move is the identification of inspiration and
  expiration as “accompaniments” of distraction, which some commentators treat as
  merely descriptive rather than causative. By treating them as accompaniments, the
  text elevates the breath to a diagnostic tool: a normal, suspended breath indicates
  samādhi, whereas any deviation signals that the mind has wandered. This aligns with
  the Sāṃkhya notion that prakṛti’s disturbances (kleshas) manifest in both mind and
  body, and that puruṣa’s task is to observe and let go of these kleshas. The existential
  application is clear: by monitoring breath and bodily sensations, one learns to
  detect the moment the mind has drifted, thereby enabling timely re-centering. The
  Dvivedi commentary reinforces this by noting that abnormal breathing is a sign of
  distraction, but it also implicitly acknowledges that the mind’s state is reflected
  in the breath’s quality, a subtle insight that the original sutra hints at but does
  not elaborate. Thus, the sutra invites a disciplined awareness of both internal
  and external cues as a path to sustained samādhi.


  Key Terms


  **citta (चित्त)** — citta (mind) -> Sāṃkhya: the conscious, thinking faculty; Yoga:
  the object of meditation; the term’s default translation as ‘mind’ misses its dynamic,
  processual nature.


  **vṛtti (वृत्ति)** — vṛtti (mental modification) -> Sāṃkhya: the fluctuations of
  citta; Yoga: the obstacles to samādhi; the term’s common rendering as ‘thought’
  neglects its broader phenomenological scope.


  **samādhi (समाधि)** — samādhi (concentration) -> Sāṃkhya: a state of pure awareness;
  Yoga: the culmination of meditation; the term’s literal meaning ‘to bind’ underscores
  its role as the binding of mind to a single object.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.30:** Both 1.30 and 1.31 enumerate bodily indicators of distraction,
  using a parallel structure of enumerated symptoms.

  *Divergence:* While 1.30 focuses on the mind’s internal disturbances, 1.31 extends
  the list to include breathing, thereby broadening the diagnostic criteria.


  **Bhaṭṭa Śāntiśāstra 1.1:** The dual listing of pain and breath aligns with Bhaṭṭa’s
  assertion that bodily sensations are mirrors of mental states.

  *Divergence:* Bhaṭṭa’s text treats breath as a passive reflection, whereas the Yoga
  Sūtra treats it as an active accompaniment to distraction.


  **Shankara’s Commentary on Yoga Sūtra 1.31:** Shankara parallels the sutra’s list
  with the six kleshas, suggesting a structural homology in enumerating obstacles.

  *Divergence:* Shankara expands the list to include ignorance and attachment, whereas
  the sutra limits itself to immediate physiological signs.'
