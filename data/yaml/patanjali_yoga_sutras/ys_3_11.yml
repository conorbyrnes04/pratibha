sutra_id: YS_3_11
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Trance‑Transformation of the Mind
sanskrit: सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समादिपरिनामः
transliteration: sarvārthataikāgratayoḥ kṣayodayau cittasya samādhipariṇāmaḥ
translation: The mind’s concentration is transformed by the setting and rising of
  all its meanings.
commentary: 'The passage asserts that the mind’s concentration is not a static state
  but a dynamic process of setting (kṣaya) and rising (udāya). In the Yoga–Sāṃkhya
  framework, this mirrors the movement of vṛtti (mental modifications) from obscuration
  to illumination. The contested move here is the identification of ‘kṣaya’ with the
  setting of distractions and ‘udāya’ with the rising of concentration; Dvivedi’s
  commentary treats them as distinct stages, but the sūtra’s compactness suggests
  a unified causal pair. This duality is crucial for existential practice: it frames
  the practitioner’s effort as a continual re‑orientation of attention, where each
  moment of distraction is immediately transformed into a point of focus. The implication
  is that liberation (kaivalya) is achieved not by eliminating distractions outright
  but by mastering their transmutation. In a practical sense, this means that every
  lapse into wandering is an opportunity to re‑engage the mind, thereby reinforcing
  the cycle of setting and rising until the mind’s fluctuations cease. The sūtra thus
  offers a procedural model for the disciplined cultivation of samādhi, aligning with
  the Sāṃkhya notion that puruṣa’s freedom arises when prakṛti’s vṛtti are fully subdued.


  Key Terms


  **kṣaya (क्षय)** — kṣaya (IAST) → ‘setting’ → in Yoga, the withdrawal of attention
  from external objects; contrasts with the default translation ‘destruction’ which
  obscures its dynamic role in concentration


  **udāya (उदय)** — udāya (IAST) → ‘rising’ → the ascent of focused attention; the
  term’s literal sense of ‘arising’ highlights the active, not passive, nature of
  samādhi


  **citta (चित्त)** — citta (IAST) → ‘mind’ → in Sāṃkhya, the organ of perception
  and thought; the sūtra’s use of citta underscores that concentration operates within
  the mind’s own fluctuations


  **samādhi (समाधि)** — samādhi (IAST) → ‘concentration’ → here defined as the parinama
  (transformation) of the mind’s vṛtti, not merely a state of stillness


  Cross-Tradition Resonances


  **Yoga Sūtra 3.11:** The dual terms kṣaya‑udāya mirror the Sāṃkhya distinction between
  prakṛti’s decline and the rise of puruṣa’s awareness

  *Divergence:* Unlike the later Sūtra 3.12, which treats samādhi as a static attainment,
  3.11 presents it as an ongoing process


  **Bhāvanā‑Sūtra 1.1:** Both texts use the pair of setting and rising to describe
  the mind’s oscillation

  *Divergence:* Bhāvanā‑Sūtra emphasizes external stimuli, whereas 3.11 focuses on
  internal vṛtti


  **Dvivedi Commentary on YS 3.11:** Dvivedi expands kṣaya to ‘distraction’ and udāya
  to ‘concentration’, aligning with the sūtra’s implicit causal pair

  *Divergence:* Dvivedi’s elaboration introduces a temporal dimension (time of udaya)
  that the sūtra itself omits, suggesting a later interpretive layer'
voice_of_siva: The passage asserts that the mind’s concentration is not a static state
  but a dynamic process of setting (kṣaya) and rising (udāya).
abhyasa: Set your attention on a single object, and when it drifts, immediately bring
  it back, repeating this setting and rising until the mind’s fluctuations cease.
