sutra_id: YS_3_45
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Binding of Body and Subtle Element
sanskrit: ततो णिमादिप्रादुर्भावः काया-संपत् तद्धर्मानभिगातः च
transliteration: tato 'ṇimādiprādurbhāvaḥ kāyasaṃpat taddharmānabhighātaś ca
translation: Thus, the subtle element’s immediate effect binds the body, and the body’s
  immediate effect binds the subtle element; both are elevated by the dharmas.
commentary: 'The passage asserts that the subtle element and the body are mutually
  dependent, each exerting an immediate effect on the other, and that this inter‑binding
  is elevated by the dharmas. The contested move here is the claim that the binding
  is *immediate* (pradurbhāva) rather than gradual; some commentators read it as a
  subtle, instantaneous union, while others argue for a progressive conditioning.
  In the Sankhya‑Yoga framework, this mutual binding illustrates the dynamic interplay
  between prakṛti’s two aspects—kāya (gross material) and the subtle elements (tattvas)—and
  their regulation by the dharmas, the guiding principles that maintain cosmic order.
  The existential implication is that by mastering the immediate interactions between
  body and subtle element, one can stabilize the mind’s fluctuations (vṛtti) and move
  toward samādhi. Satchidananda’s aphorism that “By saṁyama on the gross and subtle
  elements and on their essential nature, correlations and purpose, mastery over them
  is gained” echoes this idea, framing disciplined attention (saṁyama) as the means
  to harness the mutual binding and thereby elevate the dharmas. Thus, the sūtra invites
  a practice of simultaneous restraint and integration of body and subtle element,
  a foundational step toward liberation.


  Key Terms


  **tattva (तत्त्व)** — etymology: ‘principle’ → Sankhya tradition: the subtle elements
  constituting prakṛti → the translation ‘subtle element’ misses the ontological status
  as a fundamental principle.


  **kāya (काय)** — etymology: ‘body’ → Sankhya: the gross material aspect of prakṛti
  → the translation ‘body’ omits its role as the vehicle for subtle elements.


  **dharmas (धर्म)** — etymology: ‘principle, law’ → Sankhya: the five dharmas that
  govern the interaction of subtle elements and body → the translation ‘dharmas’ fails
  to convey their regulatory function.


  Cross-Tradition Resonances


  **Yoga Sutra 3.44, 3.46:** Structural homology: the mutual binding of subtle and
  gross elements appears in consecutive sutras, emphasizing interdependence.

  *Divergence:* While 3.44 focuses on the subtle element’s effect on the body, 3.45
  adds the body’s reciprocal effect, expanding the symmetry.


  **Sankhya Karika 1.3:** Both texts describe the mutual conditioning of prakṛti’s
  aspects through dharmas.

  *Divergence:* The Karika presents the binding as a passive process, whereas the
  Yoga Sutra frames it as an active, immediate effect.


  **Bhasya of Patanjali (Sādhana 1.1):** The idea that disciplined practice (saṁyama)
  aligns body and subtle element is echoed.

  *Divergence:* Patanjali emphasizes the role of mental discipline, while YS 3.45
  foregrounds the physical‑subtle interaction.'
voice_of_siva: The passage asserts that the subtle element and the body are mutually
  dependent, each exerting an immediate effect on the other, and that this inter‑binding
  is elevated by the dharmas.
abhyasa: Align your subtle element and body by disciplined attention, so that each
  supports the other.
