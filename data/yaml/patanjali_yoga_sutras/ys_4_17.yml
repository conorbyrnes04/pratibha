sutra_id: YS_4_17
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Object and Mind
sanskrit: तदुपरागापेक्षित्वाच् चित्तस्य वस्तु ज्नाताज्ञातम्
transliteration: taduparāgāpekṣitvāc cittasya vastu jñātājñātam
translation: That object is known or unknown depending on the mind’s conditioning.
commentary: 'The central claim of this verse is that the mind’s own conditioning determines
  the status of an object as known or unknown. The contested move is the implication
  that the mind’s “upārāga” (coloring) is not merely a passive reflection but an active
  causal agent that renders an object intelligible or inscrutable. In the Yoga and
  Sāṃkhya traditions, this aligns with the idea that prāṇāyāma and dhāraṇā can alter
  the vṛtti, thereby changing the experiential reality of objects. The verse invites
  an existential application: by recognizing that our own mental conditioning shapes
  what we perceive as reality, we are called to cultivate a disciplined mind that
  can transform ignorance into knowledge. The Satchidananda commentary hints at this
  by noting that the mind is not merely colored by the object but that the object’s
  status is contingent upon the mind’s conditioning. This resonates with the notion
  of the mind’s “upādhi” (affect) in Sāṃkhya, where the mind’s activity can either
  obscure or reveal the true nature of objects. The verse thus serves as a reminder
  that liberation (kaivalya) requires mastery over the mind’s coloring, allowing us
  to see objects as they truly are, uncolored by ignorance.


  Key Terms


  **citta (चित्त)** — citta: ‘mind’ (Sāṃkhya) -> ‘consciousness’ (common) -> nuance:
  the active, discerning faculty that conditions perception


  **upārāga (उपराग)** — upārāga: ‘coloring, influence’ (Sāṃkhya) -> ‘affect’ (common)
  -> nuance: the subtle force that colors the mind’s perception


  **jñātam (ज्ञातम्)** — jñātam: ‘known’ (Sāṃkhya) -> ‘known’ (common) -> nuance:
  knowledge that arises from conditioned perception


  **ajñātam (अज्ञातम्)** — ajñātam: ‘unknown’ (Sāṃkhya) -> ‘unknown’ (common) -> nuance:
  ignorance that persists when mind is unconditioned


  Cross-Tradition Resonances


  **Yoga Sūtra 4.17:** Structural homology: object (vastu) and mind (citta) are paired
  as subject and object of knowledge, mirroring the duality of puruṣa and prakṛti
  in earlier verses

  *Divergence:* Unlike earlier verses where puruṣa is the observer, here the mind
  itself is the observer, shifting the locus of agency from pure consciousness to
  the conditioned mind


  **Sāṃkhya Kāṇḍa 3.1:** Both texts posit that the mind’s conditioning (upārāga) determines
  the status of objects, establishing a causal link between mental activity and epistemic
  status

  *Divergence:* Sāṃkhya treats upārāga as a passive influence of prakṛti, whereas
  the Yoga Sūtra treats it as an active agent that can be cultivated


  **Patanjali, 4.17:** The verse echoes Patanjali’s assertion that the mind’s vṛtti
  can be controlled to achieve samādhi, implying that control over upārāga leads to
  liberation

  *Divergence:* Patanjali’s focus is on the cessation of vṛtti, while this verse emphasizes
  the transformation of the object’s epistemic status'
voice_of_siva: The central claim of this verse is that the mind’s own conditioning
  determines the status of an object as known or unknown.
abhyasa: You observe an object and consciously note whether your mind’s conditioning
  makes it known or unknown; if it feels unknown, you adjust your attention to bring
  it into clarity.
