sutra_id: YS_3_24
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Strengths in the Limbs
sanskrit: बालेषु हस्थिबालादीनि
transliteration: baleṣu hastibalādīni
translation: The strengths are in the hands, arms, and limbs.
commentary: 'The sūtra asserts that the dynamic forces of the body—its ‘strengths’—are
  not abstract qualities but are situated in the physical apparatus of the hands,
  arms, and limbs. This locational claim foregrounds the embodied nature of the yogic
  practice: the body is not merely a vessel for the mind but an active participant
  in the cultivation of power. The move of attributing ‘strength’ to the limbs is
  contested in the tradition, as some commentators read it as a metaphor for the subtle
  energies (prāṇas) that animate the body, while others treat it literally, emphasizing
  the importance of physical conditioning. By situating the source of strength in
  the limbs, the sutra invites practitioners to attend to the subtle interplay between
  the gross body and the subtle body, a theme that recurs in the Samkhya distinction
  between prakṛti and puruṣa. In existential terms, this sutra reminds us that our
  capacities for action, transformation, and liberation are rooted in the very tissues
  that support us; neglecting the physical can hinder the higher faculties. The Satchidananda
  commentary’s mention of “friendliness” and “other such qualities” suggests that
  the power to manifest these qualities arises from disciplined control of the limbs,
  implying a reciprocal relationship between physical mastery and moral development.
  Thus, the sutra is not merely descriptive but prescriptive: it calls for a disciplined
  engagement with the body as a means to access and channel inner strengths.


  Key Terms


  **baleṣu (बालेषु)** — bala (strength) -> ''baleṣu'' (in the strengths) ; denotes
  dynamic capacities of the body, beyond mere physical power


  **hastibalādīni (हस्थिबालादीनि)** — hasta (hand) + bala (strength) + ādi (etc.)
  -> ''hastibalādīni'' (hands, arms, and other limbs) ; indicates the loci of strength
  in the body, linking gross anatomy with subtle potency


  Cross-Tradition Resonances


  **Yoga Sūtra 3.24:** Explicitly locates strength in the limbs, mirroring the Samkhya
  distinction of prakṛti’s material aspects

  *Divergence:* Unlike later Yoga texts that emphasize prāṇa flow, this sutra focuses
  on the tangible, anatomical basis of power


  **Yoga Sūtra 1.1:** Both sutras begin with a declarative statement about the nature
  of the body

  *Divergence:* 1.1 speaks of the body as a ‘house’ for the soul, whereas 3.24 specifies
  the house’s functional parts


  **Samkhya Karika 1.1:** Identifies prakṛti as the source of all material qualities

  *Divergence:* Samkhya treats prakṛti as a unified principle, while the sutra disaggregates
  it into specific bodily loci'
