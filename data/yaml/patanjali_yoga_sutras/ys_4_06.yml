sutra_id: YS_4_06
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Meditation‑Born Freedom
sanskrit: तत्र ध्यायनजम् अनाशयम्
transliteration: tatra dhyānajam anāśayam
translation: There, the mind that is born of meditation is free of karmic residue.
commentary: 'The claim that liberation is achieved by a mind that is *born* through
  meditation is a decisive philosophical move: it elevates the act of meditative birth
  to the very threshold of kaivalya, rather than treating it as a mere preparatory
  stage. In the Yoga and Sāṃkhya traditions, *dhyāna* is the deepening of *citta*’s
  focus, while *jam* (birth) signals a new ontological status. Here, the sūtra asserts
  that *jam* is not a passive occurrence but an active transformation that purges
  *karmic* *pratītyāna* (impressions). The phrase *anāśaya*—free of residue—underscores
  that this freedom is not a gradual shedding but an instantaneous cessation of *vipākāra*
  (causal residue). This aligns with the Sāṃkhya notion that *purusha* becomes distinct
  from *prakṛti* when the latter’s *vipākāra* is annihilated. The existential application
  is clear: one must cultivate a meditative state that *birthing* a mind devoid of
  karmic imprint, thereby realizing *kaivalya* as an ontological shift rather than
  a mere state of calm. The Satchidananda commentary’s brief note that the mind is
  “born of meditation” echoes this, but the Pratibha analysis insists that the *birth*
  itself is the vehicle of liberation, not the practice alone. Thus, the sūtra invites
  practitioners to view meditation not just as a technique but as a transformative
  act that reconfigures the very nature of consciousness, aligning with the Yoga Sutra’s
  broader thesis that *samādhi* is the culmination of purifying *citta* from *vipākāra*.


  Key Terms


  **dhyāna (ध्यान)** — from dhā (to think) + -na (instrument) -> meditation; in tradition,
  the deepening of citta’s focus, beyond mere concentration


  **jam (जम्)** — from jā (to be born) -> birth; in this context, ontological rebirth
  of mind free from karmic residue


  **anāśaya (अनाशय)** — from an (without) + āśaya (residue) -> free of residue; signals
  complete annihilation of karmic imprint


  **karma (कर्म)** — action; in this sūtra, the residue of action that must be shed
  for liberation


  Cross-Tradition Resonances


  **Yoga Sutra 2.50:** Both sutras state that the mind is free when it is not influenced
  by karmic impressions; 2.50 uses ‘samādhi’ while 4.6 uses ‘jam’ to denote the same
  state

  *Divergence:* 4.6 replaces the abstract notion of samādhi with the concrete act
  of being born, emphasizing ontological change over psychological attainment


  **Bṛhadāraṇyaka Upaniṣad 2.1.1:** Both describe liberation as the mind being untainted
  by past actions

  *Divergence:* The Upaniṣad speaks of *moksha* as a state of knowledge, whereas 4.6
  frames it as a birth free of residue, highlighting the Yoga emphasis on experiential
  transformation


  **Śaṅkara, *Brahmasūtra* 3.1.1:** Both link liberation to the cessation of *vipākāra*

  *Divergence:* Śaṅkara’s sutra uses metaphysical causality, while 4.6 employs a more
  practical, meditative birth metaphor'
