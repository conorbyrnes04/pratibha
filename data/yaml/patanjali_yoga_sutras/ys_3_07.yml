sutra_id: YS_3_07
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Intimate Trichotomy of Yoga
sanskrit: त्रयम् अन्तरङ्गं पूर्वेभ्यः
transliteration: trayam antaraṅgaṃ pūrvebhyaḥ
translation: The three are more intimate than the others.
commentary: 'The passage asserts that the three core practices of Yoga—prāṇāyāma,
  dhāraṇā, and dhyāna—constitute the very heart of the discipline, in contrast to
  the ancillary techniques described elsewhere. The claim is that these internal methods
  are inseparable from the essence of Yoga, whereas the external means are merely
  preparatory. This distinction echoes the Sāṃkhya notion of the intimate relationship
  between puruṣa and prakṛti: the former is the witness, the latter the material world.
  By elevating the internal practices, the text invites the practitioner to recognize
  that liberation (mokṣa) is achieved not by external rituals but by mastering the
  subtle processes of mind and breath. The Dvivedi commentary underscores this by
  labeling the other five techniques as “foreign” to Yoga proper; they are merely
  tools to clear distractions. The philosophical import is that true yogic practice
  is an inward journey, a direct engagement with the self (citta) and its fluctuations
  (vṛtti). In contemporary terms, this resonates with mindfulness-based interventions
  that focus on breath and attention to cultivate a stable, non-reactive awareness.
  The passage thus serves as a reminder that the path to self‑realization is internal,
  requiring disciplined practice of breath, concentration, and meditation, rather
  than external adornments.


  Key Terms


  **traya (त्रय)** — etymology: ‘three’ -> Sāṃkhya: the triad of puruṣa, prakṛti,
  and the mind; default translation ‘three’ overlooks the ontological triad this sūtra
  invokes


  **antaraṅga (अन्तरङ्ग)** — etymology: ‘inner part’ -> Yoga: the internal methods
  (prāṇāyāma, dhāraṇā, dhyāna); default translation ‘intimate’ misses the sense of
  ‘inner core’


  Cross-Tradition Resonances


  **Yoga Sūtra 2.1:** Both passages distinguish internal from external means, structuring
  Yoga into a hierarchy of practices

  *Divergence:* While 2.1 lists external means (kriya, śauca, etc.), 3.7 elevates
  the internal triad, thereby shifting emphasis from preparatory to core practices


  **Sāṃkhya Karika 1.1:** The triad of puruṣa, prakṛti, and citta parallels the trichotomy
  of Yoga practices

  *Divergence:* Sāṃkhya treats the triad as ontological categories, whereas Yoga Sūtra
  3.7 treats them as procedural steps


  **Bāṇāśramaṇa, Yoga Vārttika 1.2:** Both texts separate ‘external’ and ‘internal’
  means of purification

  *Divergence:* Bāṇāśramaṇa’s external means are more ritualistic, whereas the Yoga
  Sūtra’s external means are merely preparatory, not constitutive'
voice_of_siva: The passage asserts that the three core practices of Yoga—prāṇāyāma,
