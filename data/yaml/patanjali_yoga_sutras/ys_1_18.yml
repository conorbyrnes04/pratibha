sutra_id: YS_1_18
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Samskara-Only Concentration
sanskrit: विरामप्रत्यायाभ्यासपूर्वः संस्कारशेषो अन्यः
transliteration: virāmapratyayābhyāsapūrvaḥ saṃskāraśeṣo 'nyaḥ
translation: The other form of samādhi is that in which only the residual impressions
  (samskāras) remain, brought about by the practice of the cause of complete suspension.
commentary: 'The sutra asserts that a distinct mode of samādhi exists where the mind
  is left with only the residual samskāras, devoid of any active cognition. This is
  not the ordinary samādhi of the Sāṃkhya–Yoga tradition, where the mind is still
  engaged in vṛtti (mental modifications). Instead, it is the asamprajnata samādhi,
  the state of unconscious meditation where the mind is suspended and all transformations
  are halted. The philosophical claim is that true liberation is achieved not by the
  mere cessation of thoughts but by the annihilation of all impressions that can reawaken
  them. The sutra’s “other” (anya) is a contested move: some commentators read it
  as a reference to the residual samskāras that persist after the cessation of vṛtti,
  while others see it as a pointer to the ultimate, unconditioned state of śūnyatā.
  In the Sāṃkhya framework, puruṣa (the witness) is distinct from prakṛti (the material
  nature). Here, the practice of vairāgya (detachment) is the cause that suspends
  the mind’s activity, allowing puruṣa to rest in its pure, unadulterated state. The
  sutra’s emphasis on the “cause of complete suspension” aligns with the Sāṃkhya doctrine
  that liberation is attained when puruṣa is freed from prakṛti’s influence. Existentially,
  this teaches that one must cultivate detachment to silence the mind’s chatter, thereby
  revealing the true nature of self. The Dvivedi commentary’s reference to “para‑vairāgya”
  as the cause dovetails with the traditional view that the highest form of detachment
  is the key to suspending vṛtti. Thus, the sutra invites practitioners to move beyond
  mere concentration to a state where only the indelible marks of past impressions
  remain, and even those are eventually erased by supreme detachment, leading to a
  blissful, equilibrium‑bound existence.


  Key Terms


  **samskara (संस्कार)** — impression; mark left by an action; in Yoga, the latent
  seed that can be reawakened


  **vairāgya (वैराग्य)** — detachment; the practice that removes attachment to prakṛti,
  enabling suspension of vṛtti


  **asamprajnata (असम्प्रज्ञता)** — unconscious state; absence of active cognition;
  the ultimate samādhi where mind is suspended


  Cross-Tradition Resonances


  **Yoga Sūtra 1.18:** focus on residual samskāras as the only remaining mental content

  *Divergence:* Unlike 1.17 where vṛtti is still present, 1.18 posits complete suspension


  **Yoga Sūtra 1.20:** emphasis on the cause of suspension (vairāgya)

  *Divergence:* 1.20 elaborates on the nature of the cause, whereas 1.18 merely states
  its effect


  **Bhaṭṭa 1.18:** similar claim of asamprajnata samādhi

  *Divergence:* Bhaṭṭa adds the role of śūnyatā, which is not explicit in the sutra


  **Dvivedi Commentary 1.18:** identifies para‑vairāgya as the cause

  *Divergence:* Dvivedi expands on the mechanism, while the sutra remains succinct'
voice_of_siva: The sutra asserts that a distinct mode of samādhi exists where the
  mind is left with only the residual samskāras, devoid of any active cognition.
abhyasa: Practice a meditation that consciously suspends all mental activity, allowing
  only the residual impressions to remain, and observe the resulting state of complete
  suspension.
