sutra_id: YS_1_13
collection: Patañjali Yoga Sūtras
section: Samādhi Pāda
title: Effort Toward Stillness
sanskrit: तत्र स्थितौ यत्नोऽभ्यासः
transliteration: tatra sthitau yatno 'bhyāsaḥ
translation: In that state, effort is practice.
commentary: 'The central claim of this aphorism is that the very act of sustained
  effort—yatna—is itself the practice (bhyāsa) that brings one into the state (sthiti)
  of samādhi. It is not a passive attainment but an active, disciplined application
  of the mind. The sūtra reframes the traditional notion of samādhi as a passive stillness
  into a dynamic process: the practitioner must continually direct attention, thereby
  generating a steady, unmodified mental posture. This aligns with the Sāṃkhya distinction
  between puruṣa (consciousness) and prakṛti (matter): the effort is a puruṣic activity
  that subdues the fluctuations of prakṛti, allowing puruṣa to realize its own distinctness.
  The Dvivedi commentary’s metaphor of a lamp’s jet unperturbed by wind echoes this
  idea of an unshaken mind. In contemporary practice, this translates to a disciplined
  meditation routine where one consciously maintains focus, recognizing that the very
  act of focus is the practice that cultivates stillness. Thus, the sūtra invites
  an existential application: by engaging in deliberate, sustained attention, one
  cultivates a state of inner calm that is both the means and the end.


  Key Terms


  **sthiti (स्थितौ)** — from ‘sti’ (to stand) + ‘iti’ (state); in Sāṃkhya, the unchanging,
  unmodified state of puruṣa; the translation ‘state’ omits its connotation of unaltered
  consciousness


  **yatna (यत्नो)** — ‘vy’ root (to strive) + ‘na’ (action); denotes disciplined,
  purposeful effort; often rendered ‘effort’ but implies intentional, sustained practice


  **bhyāsa (अभ्यासः)** — ‘bh’ root (to do) + ‘āśa’ (practice); in Yoga, the systematic
  application of techniques; the translation ‘practice’ is accurate but lacks its
  connotation of disciplined, ongoing effort


  Cross-Tradition Resonances


  **Yoga Sūtra 1.13:** Structural homology: ‘sthiti’ (state) + ‘yatna’ (effort) +
  ‘bhyāsa’ (practice) mirrors the triadic structure of 1.12 (purusha‑prakṛti‑samādhi)

  *Divergence:* While 1.12 presents the constituents of samādhi, 1.13 reorders them
  to emphasize the process of attaining the state


  **Bhaṭṭikā 1.13:** Bhaṭṭa expands ‘bhyāsa’ to include the application of the five
  kleshas; the structure remains identical but the content shifts to include obstacles

  *Divergence:* Bhaṭṭa’s expansion introduces a corrective dimension absent in the
  terse Sūtra


  **Mahāyoga 1.13:** Mahāyoga’s commentary interprets ‘yatna’ as ‘sustained concentration’
  and parallels the Sūtra’s triad with its own triadic formula of ‘samādhi‑pratyaya‑pratibaddha’

  *Divergence:* Mahāyoga’s triad adds a layer of ‘binding’ (pratibaddha) that the
  original Sūtra does not explicitly mention'
voice_of_siva: The central claim of this aphorism is that the very act of sustained
  effort—yatna—is itself the practice (bhyāsa) that brings one into the state (sthiti)
  of samādhi.
abhyasa: Focus your attention on a single point, and sustain that focus with deliberate
  effort, allowing the mind to settle into stillness.
