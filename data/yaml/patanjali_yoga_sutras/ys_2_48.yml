sutra_id: YS_2_48
collection: Patañjali Yoga Sūtras
section: Sādhana Pāda
title: End of Duality
sanskrit: ततो द्वन्द्वानबिग्धात्
transliteration: tato dvandvānabhighātaḥ
translation: Then the dualities cease to be perceived.
commentary: 'The claim here is that the disciplined practitioner, having attained
  a state of samādhi, transcends the ordinary dualistic perception of the world. The
  sūtra’s terse wording—‘tato dvandvā‑nabhi‑gdhāt’—encapsulates a pivotal philosophical
  move: the negation of the very structure of duality (dvandva) that underlies all
  experience. In the Sāṃkhya–Yoga framework, this is the moment when the puruṣa, having
  detached from prakṛti, no longer registers the vṛtti of the mind as ‘this’ or ‘that’.
  The Dvivedi commentary, which speaks of mastering a posture to neutralise the heat‑cold,
  pleasure‑pain pairs, illustrates a practical route to this negation. Yet the sūtra
  itself abstracts from any particular practice; it points to the existential condition
  that follows the dissolution of the mind’s habitual duality. This is not merely
  a technical cessation but a fundamental shift in the subject’s orientation: the
  observer is no longer bound by the dualistic schema that defines ordinary consciousness.
  The sūtra thereby invites the reader to recognise that the cessation of duality
  is not an external event but an internal re‑orientation, a re‑identification of
  the self with the unchanging witness. This insight aligns with the broader Yoga
  aim of liberating puruṣa from the cycle of birth and death by recognising its true
  nature beyond the fluctuating mind‑states.


  Key Terms


  **dvandva (द्वन्द्व)** — ‘duality’ – the Sāṃkhya notion of paired opposites that
  constitute the material world; its negation implies the dissolution of the mind’s
  habitual dualistic perception


  **abhi (अभि)** — prefix meaning ‘not’ or ‘without’; in this context it marks the
  negation of the duality, signalling the cessation of the vṛtti that sustains illusion


  Cross-Tradition Resonances


  **Bhagavad Gita 2.50:** Both texts posit that the mind, when steady, no longer registers
  dualities; the Gita speaks of ‘samatvam’ (equanimity) while the Yoga Sūtra uses
  the negation ‘abhi‑gdhāt’

  *Divergence:* The Gita frames this as a state of equanimity, whereas the Yoga Sūtra
  frames it as the absolute cessation of dualistic perception, a more radical negation


  **Yoga Vasistha 1.2.3:** Both describe the annihilation of the mind’s dualistic
  grasp as the key to liberation

  *Divergence:* Yoga Vasistha attributes this to the realization of the self’s unity
  with Brahman, while the Yoga Sūtra presents it as a direct outcome of disciplined
  samādhi'
