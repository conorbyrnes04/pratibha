sutra_id: YS_4_22
collection: Patañjali Yoga Sūtras
section: Kaivalya Pāda
title: Unchanging Consciousness
sanskrit: चितर् अप्रतिसंक्रमायास तदाकारापत्तौ स्वबुद्धिसंवेदनम्
transliteration: citer apratisaṃkramāyās tadākārāpattau svabuddhisaṃvedanam
translation: The consciousness of the Purusha is unchangeable; by attaining the reflection
  of it, the mind‑stuff becomes conscious of itself.
commentary: 'This sutra makes a decisive claim that the Purusha’s consciousness is
  immutable and that self‑recognition is achieved when the mind‑stuff reflects that
  very consciousness. The contested move is the interpretation of the first clause,
  *citer apratisaṃkramāyās*; some commentators read *citer* as a simple reference
  to the mind, while I argue it denotes the Purusha’s consciousness itself, thereby
  preserving the dualism of Sāṃkhya. The second clause, *tadākārāpattau svabuddhisaṃvedanam*,
  is a direct application of the Sāṃkhya principle that the mind (citta) becomes aware
  of the Purusha only when it mirrors the Purusha’s own self‑knowledge (*svabuddhi*).
  The Satchidananda aphorism echoes this by calling the Purusha’s consciousness “unchangeable,”
  and the commentary’s single word, “Self,” reinforces the idea that the ultimate
  object of contemplation is the Self. In practice, this sutra invites the practitioner
  to experience the unchanging nature of consciousness by consciously reflecting on
  one’s own awareness, thereby breaking the cycle of mental fluctuations (vṛtti) and
  moving toward samādhi. The existential import is that liberation (kaivalya) is not
  an external attainment but an inward recognition of one’s immutable nature, a realization
  that can be cultivated in everyday life by mindful attention to the present moment.


  Key Terms


  **citer (चितर्)** — etymology: root *cit* ‘to know’ + suffix *‑r*; Sāṃkhya tradition:
  refers to the conscious mind (citta) or the Purusha’s consciousness; default translation
  often glosses it as ‘mind’, missing the dualistic nuance that it can denote the
  immutable Purusha itself.


  **aprati (अप्रति)** — etymology: ‘un‑’ + *‑pati* ‘to follow’; in Sāṃkhya: denotes
  the unchanging, non‑subjective consciousness of the Purusha; default translation
  as ‘unchangeable’ overlooks its role as a marker of the Purusha’s distinctness from
  prakṛti.


  **svabuddhi (स्वबुद्धि)** — etymology: ‘self‑’ + ‘intelligence’; in Sāṃkhya: the
  inherent, self‑knowledge of the Purusha; default translation as ‘self‑awareness’
  fails to capture its ontological status as the Purusha’s own consciousness.


  **samvedanam (संवेदनम्)** — etymology: ‘to feel’ + ‘‑an’; in Sāṃkhya: the process
  by which the mind becomes aware of the Purusha; default translation as ‘perception’
  misses the idea that it is a reflective, self‑conscious act.


  Cross-Tradition Resonances


  **Patanjali, Yoga Sūtra 1.2:** Both sutras use a two‑clause structure to link the
  nature of consciousness with the process of self‑recognition; 1.2 states that the
  mind becomes still when it is freed from vṛtti, mirroring the idea that the mind
  becomes conscious of the Purusha when it reflects it.

  *Divergence:* Patanjali’s clause emphasizes the cessation of mental fluctuations,
  whereas YS 4.22 focuses on the immutable quality of Purusha’s consciousness, highlighting
  a shift from process to ontological status.


  **Shankara, Brahmasutra 3.1:** Both texts assert that the Self is unchanging and
  that realization comes through reflection; Shankara’s sutra speaks of the Self as
  the ‘unchanging’ reality, paralleling the term *aprati*.

  *Divergence:* Shankara’s statement is metaphysical and abstract, while YS 4.22 provides
  a practical psychological mechanism (mind reflecting Purusha) for attaining that
  realization.


  **Satchidananda, Yoga Sutras Commentary, 4.22:** Satchidananda’s aphorism mirrors
  the sutra’s claim of unchangeability and the role of self‑reflection.

  *Divergence:* His commentary reduces the phrase to a single word ‘Self’, thereby
  omitting the nuanced distinction between the mind’s reflection and the Purusha’s
  inherent consciousness.'
