sutra_id: YS_3_22
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Action and Inaction in the Same Breath
sanskrit: सोपक्रामं निरुपक्रामं च कर्म तत्त्स्यमाद् अपरान्तज्ञानं आरिष्टेभ्यो वा
transliteration: sopakramaṃ nirupakramaṃ ca karma tatsaṃyamād aparāntajñānam ariṣṭebhyo
  vā
translation: Both action and non‑action are performed; the same moment of withdrawal
  is also a withdrawal of the external and internal knowledge that is not yet attained.
commentary: 'The sūtra asserts that the practice of karma, whether active or passive,
  is a single, unified act. This unity is not merely a technical classification but
  a philosophical claim that the external and internal aspects of action are inseparable.
  The contested move here is the identification of *nirupakrama* (non‑action) with
  *sopakrama* (action) as a single *karma*; the sūtra insists that the withdrawal
  of action is itself an act of withdrawal. In the Yoga–Sāṃkhya framework, this reflects
  the idea that the mind’s fluctuations (*vṛtti*) are not separate from the body’s
  movements; both are manifestations of the same causal process. The existential implication
  is that the practitioner need not differentiate between doing and not doing; what
  matters is the intention and the withdrawal of the *prāṇa* that sustains the body.
  This aligns with the Satchidananda aphorism that the disappearance of sound and
  touch is explained in the same way, suggesting that sensory withdrawal is part of
  the same process of *tattva* dissolution. The sūtra therefore invites the yogi to
  perceive every act, whether overt or covert, as a single moment of *samādhi*‑like
  withdrawal, thereby dissolving the duality between action and inaction.


  Key Terms


  **karma (कर्म)** — action, work; in Sāṃkhya, the dynamic aspect of prakṛti; default
  translation often misses its causal, experiential dimension


  **nirupakrama (निरुपक्राम)** — non‑action; in Sāṃkhya, the withdrawal of prāṇa;
  default translation often reduces it to mere inactivity


  **tattva (तत्त्व)** — principle, reality; in Sāṃkhya, the fundamental elements;
  default translation often glosses over its ontological status


  Cross-Tradition Resonances


  **Yoga Sūtra 3.22:** Both action and non‑action are treated as a single *karma*

  *Divergence:* Unlike later commentaries that separate *karmā* and *nirkarmā*, this
  sūtra unifies them, suggesting a more holistic view of praxis


  **Bhaṭṭa’s Commentary on Yoga Sūtra 3.22:** Interprets *nirupakrama* as withdrawal
  of prāṇa

  *Divergence:* Bhaṭṭa expands the term to include subtle bodily functions, whereas
  the sūtra limits it to the act of withdrawal itself


  **Sāṃkhya Karika 4.1:** Describes *tattva* as the fundamental principle of reality

  *Divergence:* Sāṃkhya Karika lists *tattva* as a discrete element, while the sūtra
  uses it metaphorically to denote the unity of action and withdrawal'
voice_of_siva: The sūtra asserts that the practice of karma, whether active or passive,
  is a single, unified act.
abhyasa: You perform an action and immediately withdraw your attention from it, treating
  both the act and its cessation as one continuous moment of practice.
