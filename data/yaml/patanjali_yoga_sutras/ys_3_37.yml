sutra_id: YS_3_37
collection: Patañjali Yoga Sūtras
section: Vibhūti Pāda
title: Spontaneous Superphysical Perception
sanskrit: ते समाधाव उपसर्गा वयुत्थाने सिद्धयाḥ
transliteration: te samādhāv upasargā vyutthāne siddhayaḥ
translation: From this (state of samādhi) the spontaneous superphysical perceptions—hearing,
  touching, seeing, tasting, and smelling—arise.
commentary: 'The core claim of this verse is that the culmination of samādhi is not
  merely a cessation of mental fluctuations but a gateway to a higher mode of perception.
  The contested move here is the identification of the "upasargā" (the result) as
  the spontaneous superphysical senses, rather than as a mere by‑product of mental
  activity. In the Yoga and Sāṃkhya framework, samādhi is the moment when puruṣa withdraws
  from prakṛti, and the subtle mind (citta) is freed from vṛtti. It is at this juncture
  that the subtle senses (pratyakṣa) are said to transcend ordinary sensory limits.
  The verse therefore posits that the very act of attaining samādhi unlocks a new
  epistemic horizon—clairaudience, clairvoyance, and so forth—without the mediation
  of the gross senses. This aligns with the Sāṅkhya idea that puruṣa, when unbound,
  can directly apprehend reality. The existential implication is profound: the practitioner’s
  goal is not merely to quiet the mind but to access a state where perception itself
  is liberated. The verse invites the yogi to recognize that the superphysical senses
  are not external gifts but the natural outflow of a perfected consciousness. Thus,
  the practice is not an external acquisition but an internal unfolding, a spontaneous
  emergence that follows the disciplined cultivation of samādhi.


  Key Terms


  **samādhāv (समाधाव)** — samādhā (सामाधा) -> samādhi; the state of perfect absorption;
  here the suffix -āv indicates the resultant state


  **upasargā (उपसर्गा)** — upasarga (उपसर्ग) -> result, outcome; in this context the
  spontaneous superphysical perceptions that flow from samādhi


  **vyutthāne (वयुत्थाने)** — vyutthāna (वयुत्थान) -> arising, emanation; denotes
  the spontaneous emergence of the senses


  **siddhayaḥ (सिद्धयाḥ)** — siddha (सिद्ध) -> accomplished, perfected; indicates
  that the result is fully realized


  Cross-Tradition Resonances


  **Yoga Sūtra 1.6:** Both verses describe the result of samādhi as a state of completion;
  1.6 speaks of the cessation of vṛtti, while 3.37 specifies the emergent superphysical
  perception.

  *Divergence:* 1.6 focuses on internal stillness, whereas 3.37 extends to external
  experiential phenomena, thus broadening the scope of samādhi''s fruit


  **Sāṅkhya Kāṇḍa 3.12:** The Sāṅkhya notion that puruṣa, when detached, perceives
  reality directly parallels the spontaneous superphysical senses here.

  *Divergence:* Sāṅkhya emphasizes direct perception of prakṛti, whereas the Yoga
  Sūtra frames it as an emergent sensory faculty arising from samādhi'
voice_of_siva: The core claim of this verse is that the culmination of samādhi is
  not merely a cessation of mental fluctuations but a gateway to a higher mode of
  perception.
abhyasa: You experience spontaneous superphysical perception arising from your samādhi.
