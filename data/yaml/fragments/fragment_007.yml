title: If you do not hope, you will not win that which is not hoped for, since it is unattainabl...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: If you do not hope, you will not win that which is not hoped for, since it is unattainable
  and inaccessible.
commentary: 'This fragment inverts the common logic of hope: it does not say ''hope and you will obtain,''
  but rather establishes hope as a *condition of access itself*. The unattainable (ἀνέλπιστον) is not
  a fixed external thing waiting to be seized; it becomes unattainable *precisely* through the withdrawal
  of hope. Heraclitus is naming a paradox of threshold: what lies beyond hope is not simply distant—it
  is constitutively sealed off from the one who does not hope. The fragment does not counsel optimism
  but describes a topology of desire and reality. To ''not hope'' is to pre-emptively close a door that
  was never locked from the outside. The teaching cuts deeper than motivation: it suggests that certain
  knowledge, states, or encounters have hope as their *entry requirement*, not their reward. This is not
  magical thinking but phenomenological precision—the unattainable one speaks of is the very thing that
  recedes from the grasp of the hopeless. The fragment asks: what are you already excluding by your refusal
  to hope? What becomes inaccessible not because it is distant, but because you have turned away from
  the threshold?'
voice_of_siva: ''
abhyasa: When faced with a task or inquiry that feels pointless or already lost, pause and name aloud
  what you are *not* hoping for in that moment—be specific and honest. Then, without forcing belief, speak
  one sentence of genuine hope about it, however fragile or strange that hope feels. Notice whether the
  thing itself has changed, or only your access to it.
