resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts structure a paradox of access: Heraclitus claims the unattainable cannot be won
    without hope (a prior stance), while Nagarjuna claims the ultimate cannot be pointed out without leaning
    on convention (a prior framework). Each makes inaccessibility itself dependent on a necessary precondition
    that seems to contradict direct attainment.'
  divergence: Heraclitus treats hope as a psychological condition enabling cosmological revelation; Nagarjuna
    treats convention as a logical scaffold for metaphysical realization, grounding the move in two-truths
    epistemology rather than individual aspiration.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts locate transformation at a threshold or pause—Heraclitus in the paradoxical moment
    where hope enables the unattainable, and Vijnana Bhairava Yukti #37 in the termination-point of breath-pause
    where equality-consciousness arises. Each identifies a liminal state as the site where ordinary logic
    suspends and realization becomes possible.'
  divergence: Heraclitus frames the threshold as a logical paradox about hope and attainment; the Vijnana
    Bhairava grounds it in somatic prāṇa-practice and the dynamic tension between dual flows, making the
    threshold physiologically enacted rather than conceptually posed.
  passage_id: vijnana_bhairava.yukti_037
