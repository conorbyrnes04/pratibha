translation: The sun will not overstep his bounds, for if he does, the Erinyes, helpers of justice, will find him out.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 29 (Bywater Greek). Corpus index HFR_P029 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
