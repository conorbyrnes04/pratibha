sutra_id: HFR_P111
collection: Heraclitus Fragments
section: wisdom_pearl
title: What use are these people’s wits,
sanskrit: ''
transliteration: ''
translation: 'What use are these people’s wits,

  who let themselves be led

  by speechmakers, in crowds,

  without considering

  how many fools and thieves

  they are among, and how few

  choose the good?

  The best choose progress

  toward one thing, a name

  forever honored by the gods,

  while others eat their way

  toward sleep like nameless oxen.'
commentary: Opposites are not enemies to erase but tensions that generate becoming.
  Harmony is discovered through, not apart from, contrast.
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
