resonances:
- citation: The Book of Chuang Tzu — Emptiness That Can Receive
  resonance: Both texts posit that the soul's depth cannot be exhausted by empirical traversal or accumulated
    knowledge—Heraclitus through the impossibility of finding its limits despite traversing every way,
    Chuang Tzu through Yan Hui's recognition of having reached a limit that signals entry into a deeper
    register beyond conceptual attainment.
  divergence: Heraclitus frames this as a cosmological principle (the soul's λόγος governs all things),
    while Chuang Tzu frames it as a breakthrough into emptiness and non-action that dissolves the subject-object
    distinction.
  passage_id: the_book_of_chuang_tzu.zhuangzi_md_004
- citation: Phaedo (Plato) — The Soul's Affinity With the Unseen
  resonance: 'Both establish a structural homology between the soul''s nature and its mode of endurance:
    Heraclitus locates the soul''s principle (λόγος) in its unfathomable depth as the ground of ethical
    alignment, while Plato argues the soul''s simplicity and intelligibility are the basis for its tendency
    toward endurance and affinity with the eternal.'
  divergence: Heraclitus emphasizes the soul as measure and governance immanent in flux, whereas Plato
    posits the soul's affinity with a transcendent intelligible realm beyond becoming.
  passage_id: phaedo_plato.phaedo_md_003
