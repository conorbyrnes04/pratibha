title: also says, ‘‘ The limits of the soul you would not find out though you traverse every way...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: also says, ‘‘ The limits of the soul you would not find out though you traverse every way,’’ so deep lies its principle (οὕτω βαθὺν λόγον ἔχει). Tertullian, de Anima 2. LX XIJ.—Numenius from Porphyry, de Antro nymph. 10.
commentary: 'The turn is ethical-cosmological: character is not private style but alignment with the measure that governs all things. Mortality intensifies the question — finite life must choose whether to hear the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889), fragment 71 (Bywater Greek). Corpus index HFR_P071 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
