title: If there were no sun, it would be night.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: If there were no sun, it would be night. one may escape the sensible light, but the intellectual
  it is impossible to escape. Or, as Heraclitus says, ‘‘ How can one escape that which never sets Ὁ XX
  VIII.—
commentary: 'The fragment''s paradox turns on a doubled negation: the sensible sun can be escaped (close
  your eyes, enter a cave, die), but the intelligible sun—the logos, the ordering principle that *is*
  the sun''s necessity—cannot. Heraclitus does not mean a mystical fusion or hidden god. He means that
  the rational structure binding all things (that which makes the sun rise, makes fire burn, makes justice
  hold) has no eclipse. You can refuse to see it; you cannot refuse its operation. The phrase ''never
  sets'' (ἀδύνατος, unable to go down) is not poetic ornament—it names the very condition of intelligibility
  itself. What ''sets'' is the particular orb; what remains is the *principle* that makes setting and
  rising intelligible as a single order. To say ''if there were no sun, it would be night'' is to say:
  remove the visible source, and you remove only appearance. The deeper sun—the law of alternation, of
  measure, of the one-in-many—persists precisely because it is not an object you can remove. The old commentary''s
  error was to soften this into fusion. Heraclitus insists on clarity: the one is not mystical but *structural*,
  visible in every particular that obeys it, yet never itself an object among objects.'
voice_of_siva: ''
abhyasa: 'At the moment you notice you have stopped paying attention—mid-conversation, mid-scroll, mid-thought—name
  aloud or internally what you *cannot* unsee about the present moment: the light on a surface, the rhythm
  of breath, the fact that you are aware. Do not try to hold it. Return to the task. Repeat this three
  times in a single day, each time noting whether the ''light'' you named was easier or harder to forget
  than the thing you were distracted by.'
