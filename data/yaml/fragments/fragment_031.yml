resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish that apparent duality (sun/night, conventional/ultimate) is not a contradiction
    but a single intelligible order: Heraclitus shows night depends on sun''s absence as a unified logical
    structure; Nagarjuna shows conventional and ultimate are inseparable poles of one non-dual pointing.'
  divergence: Heraclitus grounds unity in cosmic logos and sensible order; Nagarjuna grounds it in emptiness
    (śūnyatā) and the impossibility of independent reference.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts locate intelligible order within a dynamic tension or opposition: Heraclitus''s
    ''one'' emerges from the tension of opposites (day/night); Yukti #37 shows equality-consciousness
    arises from the dynamic tension (sanghaṭṭa) of the two prāṇas at their termination.'
  divergence: Heraclitus treats tension as the eternal structure of logos itself; the Vijnana Bhairava
    treats it as a yogic technique for accessing non-dual awareness through breath manipulation.
  passage_id: vijnana_bhairava.yukti_037
