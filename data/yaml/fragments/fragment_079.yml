resonances:
- citation: 'Vijnana Bhairava — Yukti #33'
  resonance: Both texts locate truth in the dissolution of mental activity into an open, undifferentiated field—Heraclitus through time's spontaneous play, Vijnana Bhairava through the mind dissolving into a treeless, wall-less expanse where vṛtti ceases. Each treats the cessation of mental churning as the condition for a higher state.
  divergence: Heraclitus frames this as cosmological necessity (time itself is the player), while Vijnana Bhairava frames it as a yogic technique requiring deliberate gaze-practice to access the underlying śakti.
  passage_id: vijnana_bhairava.yukti_033
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: 'Both reject conceptual grasping as the path to truth: Heraclitus compresses cosmology into paradox (a child''s play cannot be rationalized), and Tilopa insists Mahāmudrā cannot be pointed to by symbol or grasped as object. Each denies that ordinary mind-categories can capture what is.'
  divergence: Heraclitus presents this as an ontological claim about time's nature, while Tilopa presents it as a methodological warning against reifying the ultimate through language or conceptual thought.
  passage_id: tilopa_mahamudra.til_001
