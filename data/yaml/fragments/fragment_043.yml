sutra_id: HFR_P043
collection: Heraclitus Fragments
section: wisdom_pearl
title: in plain terms calls war the father and king and lord of all (= frag.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: in plain terms calls war the father and king and lord of all (= frag. 44), and he says that
  Homer, when he prayed—“ Discord be damned that strife were destroyed from among gods and people.”’ For
  there could be no harmony without sharps and flats, nor living beings without male and female, which
  are contraries.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow,
  lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse
  the very structures that make harmony audible. Anchor: George T.W. Patrick (1889), fragment 43 (Bywater
  Greek). Corpus index HFR_P043 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two
  pulls create the function? Write both pulls without trying to remove either.'
