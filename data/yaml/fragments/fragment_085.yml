resonances:
- citation: Isavasya Upanishad — Mantra 17
  resonance: 'Both texts use the dissolution of the body (corpse/ashes) as the pivot point for revealing
    what persists or matters cosmologically: Heraclitus inverts value by showing the dead body''s worthlessness,
    while the Isavasya Upanishad shows the body''s return to ashes as the condition for breath''s return
    to the immortal. Each treats bodily decay as the threshold where the essential (breath/prāṇa, or the
    principle of life) becomes visible.'
  divergence: Heraclitus emphasizes the paradoxical inversion of worth through a single stark image; the
    Upanishad frames dissolution as a ritual or metaphysical transition toward the immortal, grounding
    it in continuity rather than negation.
  passage_id: isavasya_upanishad.isa_023
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both passages make breath (prāṇa/pneuma) the fundamental cosmological articulation: Heraclitus''s
    aphorism hinges on breath as the marker of life''s presence and absence (corpses lack it), while the
    Vijnana Bhairava explicitly names prāṇa as the Supreme Goddess''s constant utterance—the living flow
    that distinguishes the animate from the inert.'
  divergence: Heraclitus uses breath's absence to invert value judgments about the body; the Vijnana Bhairava
    treats breath as the active divine principle itself, accessible through yogic practice and recognition.
  passage_id: vijnana_bhairava.yukti_001
