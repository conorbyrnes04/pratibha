section: wisdom_pearl
title: Corpses are more worthless than excrement.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Corpses are more worthless than excrement.
commentary: 'Heraclitus does not rank corpses below excrement as moral judgment or mere shock. He isolates
  a threshold where the living body—still exchanging fire with the cosmos, still participating in flux—drops
  into absolute stillness. Excrement, by contrast, retains a kind of metabolic dignity: it is transformation
  still occurring, matter still *doing* something in the world, still part of the cycle. A corpse is not
  merely dead; it is *finished with exchange*. It no longer burns. The fragment forces a reversal of ordinary
  disgust-logic: we recoil from excrement because it signals life''s messy continuation; we honor corpses
  because we mistake stillness for dignity. But for Heraclitus, the corpse is the true waste—matter that
  has fallen out of the logos entirely, no longer even *useful* to the cosmic fire. The aphorism is not
  morbid philosophy; it is a precise diagnosis of what happens when the tension that *is* life ceases.
  To understand this is to recognize that your own living body''s constant shedding, sweating, digesting—its
  refusal to be clean or finished—is what keeps you in the game.'
voice_of_siva: ''
abhyasa: 'When you urinate or defecate, pause before flushing and observe without averting: this is still
  you, still warm, still part of the continuous work of staying alive. Notice the instinct to erase it,
  to call it waste. Then sit with a photograph or memory of someone recently dead—their stillness, the
  absolute halt. Let the contrast teach: the body that still produces, still transforms, still stinks
  with life is closer to the fire than any monument.'
