sutra_id: HFR_P064
collection: Heraclitus Fragments
section: wisdom_pearl
title: Death is what we see waking.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Death is what we see waking. What we see in sleep is a dream.” LX V.—There is only one supreme
  Wisdom. It wills and wills not to be called by the name of Zeus.” LX VI.—The name of the bow is life,
  but its work is death. LX VII.—Immortals are mortal, mortals immortal, living in their death and dying
  in their life.
commentary: 'The waking/sleeping distinction here is not moral or epistemological—it is ontological. What
  we call death is not an event that interrupts life; it is the *continuous structure* we inhabit while
  conscious, the perpetual dissolution that defines waking awareness. Sleep offers dream—a private, fluid
  realm where the normal order suspends. But waking is death: the relentless metabolism of form, the body''s
  constant expenditure, time''s irreversible consumption of the present. This is not pessimism but precision.
  The fragment then deepens: the bow''s name is *life* (bios), yet its *work* (ergon)—its function, what
  it *does*—is death. The bow is strung between two tensions; it holds its form only through opposing
  forces. Release the string and it kills. The bow does not fail at death; death is its perfected work.
  The final paradox collapses the boundary entirely: immortals (gods, or the eternal principles) *are*
  mortal—they live only through the constant dying of their forms. Mortals are immortal—we persist through
  the very death we undergo. There is no outside position from which to judge this. Waking consciousness
  is the acceptance of this structure, not escape from it. The logos here is not ''everything changes'';
  it is ''life and death are not opposites but a single functioning system, and to be awake means to see
  this without flinching.'''
voice_of_siva: ''
abhyasa: 'At the moment you notice yourself most alert—reading, listening, deciding—pause and feel the
  exact temperature and texture of your hands. Name one thing you are *spending* in that moment: attention,
  breath, the cells of your fingertips. Do not resolve the naming. Return to the task and carry the spending
  forward, conscious that the sharpness of your waking is also your continuous small dying.'
