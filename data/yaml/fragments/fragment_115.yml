resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts identify a structural blindness: the soul/mind continuously performs its characteristic act, yet remains unaware because perception is misdirected—the dog barks at what it does not know because its attention is fixed elsewhere, just as the soul''s activity goes unperceived because perception clings to sense-experience.'
  divergence: Heraclitus frames unknowing as a paradox of cosmic order (the dog's bark reflects ignorance of the logos), while Plotinus frames it as a problem of attention-hierarchy (the soul's true act is obscured by lower perception).
  passage_id: plotinus_enneads.enn_v_1_12
- citation: 'The Book of Chuang Tzu — The River Spirit''s Humbling: Perspective and the Infinite'
  resonance: 'Both use a concrete image (dog barking / well-frog) to compress a claim about the limits of knowledge relative to one''s sphere: the dog barks at what exceeds its comprehension, as the frog cannot speak of the ocean from within its narrow sphere—each creature''s utterance or silence reveals the boundary of its epistemic reach.'
  divergence: Heraclitus treats unknowing as a paradoxical fact of existence (the bark itself is the problem), while Zhuangzi treats it as a pedagogical lesson about perspective and the relativity of knowledge-claims.
  passage_id: the_book_of_chuang_tzu.zhuangzi_md_017
- citation: Siva Sutra — Śāmbhavopāya
  resonance: 'Both invert the expected value of knowledge: Heraclitus suggests that barking (utterance, claim-making) at what one does not know is a fundamental condition, while the Siva Sutra states that knowledge itself is bondage—both treat knowledge-assertion as entanglement rather than liberation.'
  divergence: Heraclitus presents unknowing as an ironic fact of the human condition embedded in cosmic order, while the Siva Sutra presents knowledge-as-bondage as a metaphysical principle to be transcended through non-dual recognition.
  passage_id: siva_sutra.ss_i_2
