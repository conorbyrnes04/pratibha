resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish that apparent duality (sun/night, conventional/ultimate) is not a contradiction but a single intelligible order: one cannot be grasped without the other. Heraclitus''s ''if there were no sun, it would be night'' and Nagarjuna''s ''without leaning on everyday convention, the ultimate cannot be pointed out'' both refuse mystical fusion in favor of structural interdependence.'
  divergence: Heraclitus grounds this in natural necessity and the logos of the cosmos; Nagarjuna grounds it in the two truths doctrine and the soteriological requirement that nirvāṇa be reached through saṃsāra.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts locate intelligible order within a dynamic tension or oscillation: Heraclitus''s breath-like flux of opposites (sun/night) and Nagarjuna''s dynamic tension (sanghaṭṭa) of the two prāṇas at the breath-pause both reveal unity through the controlled observation of polarity, not its dissolution.'
  divergence: Heraclitus treats this as the fundamental structure of reality itself; the Vijnana Bhairava treats it as a yogic technique for accessing equality-consciousness, making it a method of realization rather than an ontological principle.
  passage_id: vijnana_bhairava.yukti_037
