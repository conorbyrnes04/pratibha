sutra_id: HFR_P036
collection: Heraclitus Fragments
section: wisdom_pearl
title: By cosmic rule,
sanskrit: ''
transliteration: ''
translation: 'By cosmic rule,

  as day yields night,

  so winter summer,

  war peace, plenty famine.

  All things change.

  Fire penetrates the lump

  of myrrh, until the joining

  bodies die and rise again

  in smoke called incense.'
commentary: Here change is not chaos but lawful transformation. The world is dynamic,
  yet governed by proportion and measure.
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
