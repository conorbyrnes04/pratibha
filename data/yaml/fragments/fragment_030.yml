sutra_id: HFR_P030
collection: Heraclitus Fragments
section: wisdom_pearl
title: tus of Ephesus is very plainly of this opinion, since he recognizes the gods nor any man...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: tus of Ephesus is very plainly of this opinion, since he recognizes the gods nor any man
  has made, but it always was, and is, and shall be, an ever living fire, kindled in due measure, and
  in due measure extinguished.‘
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation.
  What looks like destruction is often conversion governed by proportion — a physics of becoming that
  refuses both chaos and immobility. Anchor: George T.W. Patrick (1889), fragment 30 (Bywater Greek).
  Corpus index HFR_P030 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Choose one situation that feels chaotic. Name one measure or proportion hidden in it (timing,
  limit, exchange). Sit with that pattern for two minutes.
