sutra_id: HFR_P128
collection: Heraclitus Fragments
section: wisdom_pearl
title: guish two kinds of sacrifices.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: guish two kinds of sacrifices. First, those of people wholly purified, such as would rarely
  happen in the case of a single individual, as Heraclitus says, or of a of the idle-minded people of
  the Erechthidae, or even of the other Greeks, for whom there awaits after death what they do not hope
  (see frag. 122). Against whom, indeed, does Heraclitus of Ephesus prophesy? Against night-roamers, Magians,
  bacchanals, revelers in wine, the initiated. These he threatens with things after death and prophesies
  fire for them, for they celebrate sacrilegiously the things which are considered mysteries among people
  (= frag. 125).
commentary: 'Heraclitus divides humanity by their relation to sacred knowledge and ritual purity—not by
  birth or status but by whether they can sustain the discipline of *noēsis*, of thinking-through. The
  passage sets two sacrificial orders against each other: those rare individuals purified enough to offer
  rightly (whose offerings align with cosmic order), and the profane multitude—night-roamers, wine-drunk
  revelers, the uninitiated—who perform ritual gestures while remaining spiritually asleep, their inner
  condition inverted. The fire Heraclitus prophesies is not punishment imposed from outside but the inevitable
  exposure of this inversion: those who celebrate mysteries *sacrilegiously*—who treat sacred things as
  mere spectacle or intoxication—encounter fire as the revealing principle that strips away pretense.
  The logos that governs both sacrifice and cosmos does not tolerate the gap between outer action and
  inner wakefulness. To be ''wholly purified'' is to have one''s inner and outer aligned, to know what
  one does. The others await after death what they do not hope—because they never learned to hope rightly,
  never cultivated the vigilance required to see through appearance. Heraclitus''s prophecy is not threat
  but diagnosis: fire *will* meet them because fire is the measure of all things, and they have refused
  to measure themselves against it while living.'
voice_of_siva: ''
abhyasa: In the next conversation where you find yourself performing agreement or enthusiasm you do not
  feel, pause mid-gesture or mid-word and name silently what you actually know to be true in that moment—the
  gap between your outer compliance and your inner sense. Do not correct the outer action; simply hold
  both visible and invisible at once, and notice what fire (clarity, discomfort, recognition) that holding
  produces.
