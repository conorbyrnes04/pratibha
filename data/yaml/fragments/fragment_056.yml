section: wisdom_pearl
title: The harmony of the world is a harmony of oppositions, as in the case of the bow and of th...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: The harmony of the world is a harmony of oppositions, as in the case of the bow and of the
  lyre.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow,
  lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse
  the very structures that make harmony audible. Anchor: George T.W. Patrick (1889), fragment 56 (Bywater
  Greek). Corpus index HFR_P056 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two
  pulls create the function? Write both pulls without trying to remove either.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
glossary: []
anchor_translation: The harmony of the world is a harmony of oppositions, as in the case of the bow and
  of the lyre.
pratibha_translation: The harmony of the world is a harmony of oppositions, as in the case of the bow
  and of the lyre.
source_reference: Patrick (1889), frag. 56; corpus HFR_P056
key_terms:
- term: harmoniē (ἁρμονίη)
  definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic,
    not the removal of difference. This is Heraclitus's answer to those who expect peace as sameness.
resonances:
- citation: Heraclitus B45 (bow and lyre)
  resonance: 'Same image-cluster: harmony is not absence of conflict but measured counter-tension.'
  divergence: B56 generalizes to world-harmony; B45 focuses on the mind's failure to grasp the pattern.
editorial_maturity: strong_draft
