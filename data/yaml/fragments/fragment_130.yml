resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: Both texts establish that apparent contradiction or duality (mud washing mud; conventional and ultimate) is not a logical failure but the necessary structural condition for intelligibility itself. The single order (Heraclitus) and the two-fold dependence (Nagarjuna) both refuse to collapse one pole into the other.
  divergence: Heraclitus grounds this in a cosmic logos that persists through flux; Nagarjuna grounds it in the mutual emptiness of both terms, making neither foundational.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: Tao Te Ching — The Axle-Hole and the Use of Absence
  resonance: 'Both isolate a paradoxical principle: the operative reality is not the manifest substance (blood, spokes) but the invisible structuring absence or emptiness (the void at the hub) that makes function possible. The ''one'' intelligible order and the empty hub are both what-is-not that enables what-is.'
  divergence: Heraclitus treats this as a logical principle within a dynamic cosmos; Taoism treats it as the primordial non-being from which all utility flows, with less emphasis on rational intelligibility.
  passage_id: tao_te_ching.ttc_md_002
