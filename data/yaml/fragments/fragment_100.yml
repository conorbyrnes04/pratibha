title: The people must fight for their law as for their walls.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: The people must fight for their law as for their walls.
commentary: 'The fragment does not argue that law and walls are equivalent; it stages their equivalence
  as a shock to perception. Nomos (law, custom, the shared order) and teichos (wall, boundary, the visible
  rampart) belong to different registers—one invisible, one stone. Yet Heraclitus binds them with the
  same verb: fight. The move is not metaphorical but phenomenological. A wall defends by its mere standing;
  law defends by its constant reassertion in speech and deed. Both require the people''s active body.
  Remove the fighting and both dissolve. The fragment thus inverts the usual hierarchy: the wall seems
  solid, law seems abstract. Heraclitus reverses this. Law is what actually holds; the wall is only its
  shadow. But the deeper paradox lies in the word ''must'' (chrē). It is not a command from above but
  a necessity that arises from within the people themselves—as if the fighting for law were not imposed
  but discovered as the condition of their own coherence. The fragment teaches that order is not a thing
  to be possessed but a perpetual act, and that the people who cease to defend their nomos have already
  abandoned their walls.'
voice_of_siva: ''
abhyasa: 'Walk a familiar route—street, corridor, path—and at three points stop and ask aloud or in clear
  internal speech: What law am I defending here by my presence? What invisible boundary holds because
  I move through it as if it matters? Do not answer; let the question reshape the ordinary space into
  one where your motion becomes a form of vigilance.'
