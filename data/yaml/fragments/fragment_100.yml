resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts compress a paradox of interdependence into a single claim: Heraclitus binds law to walls (the conventional boundary that protects the polis), just as Nagarjuna binds the ultimate to the conventional (vyavahāra)—neither can be grasped or defended without the other. Each tradition uses a structural necessity (law needs walls; nirvāṇa needs convention) to collapse a false hierarchy.'
  divergence: Heraclitus treats the law-wall bond as a political-cosmological imperative demanding active struggle, while Nagarjuna treats the ultimate-conventional bond as a logical-soteriological interdependence requiring philosophical insight, not combat.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts locate transformative power in a dynamic tension or opposition held in place: Heraclitus''s law and walls are distinct yet inseparable (the people must defend both as one), and Vijnana Bhairava''s two prāṇas generate equality-consciousness through their sanghaṭṭa (dynamic tension). Each identifies a threshold where opposing forces, held together, produce a new state.'
  divergence: Heraclitus frames this as a political duty requiring collective action, while the Vijnana Bhairava frames it as an internal yogic event where breath-tension yields non-dual consciousness.
  passage_id: vijnana_bhairava.yukti_037
