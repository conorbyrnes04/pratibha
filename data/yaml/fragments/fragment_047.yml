resonances:
- citation: Yoga Spandakarika — First Flow
  resonance: Both texts locate harmony not in the absence of opposition but in a unified field that contains and transcends apparent dualities. Heraclitus makes opposition the instrument of hidden harmony; Spandakarika reveals pleasure/suffering and subject/object as expressions of a single consciousness-space.
  divergence: Heraclitus grounds harmony in dynamic flux and strife as generative principle, while Spandakarika grounds it in static absolute consciousness that subsumes all polarities.
  passage_id: yoga_spandakarika.sp_05
- citation: Phaedo (Plato) — Refuting the Harmony Theory of Soul
  resonance: 'Both texts use harmony as a structural concept to probe the nature of order: Heraclitus asserts that hidden harmony surpasses visible harmony, while Plato''s Simmias proposes harmony as an invisible principle that organizes visible structure—each making harmony the deeper explanatory layer.'
  divergence: Heraclitus privileges hidden harmony through opposition and becoming, whereas Plato (via Simmias) treats harmony as a dependent property of physical substrate, ultimately rejecting it as insufficient for explaining the soul's independence.
  passage_id: phaedo_plato.phaedo_md_004
