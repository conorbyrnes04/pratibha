sutra_id: HFR_P084
collection: Heraclitus Fragments
section: wisdom_pearl
title: A mixture separates when not kept in motion.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: A mixture separates when not kept in motion.
commentary: 'Heraclitus does not say ''all things flow'' here; he says separation *is the cost of stillness*.
  The mixture (krasis) is the natural state—elements held in dynamic tension, interpenetrating, alive.
  The moment motion ceases, differentiation begins: what was unified falls into parts, stratifies, dies
  into inert layers. This is not metaphor for social or psychological life; it is the claim about *what
  holds anything together*. The fragment reverses the common intuition that motion causes disorder. For
  Heraclitus, motion *is* the only coherence available. A body, a thought, a city, a cosmos—all require
  continuous agitation to remain one. The aphorism does not console. It says: rest is decomposition. The
  old commentary''s instruction to ''notice what experience already shows'' misses the sting: experience
  shows us constantly trying to arrest, to settle, to have things stay put. Heraclitus is saying that
  impulse is the beginning of our undoing. The mixture that separates is not distant. It is your own attention,
  your own breath, your own will—each one a krasis that fragments the moment you stop tending it.'
voice_of_siva: ''
abhyasa: Stir a cup of cream and coffee together, then set it down and watch without touching it for three
  minutes, marking the precise moment separation begins—the brown deepening at the edges, the cream rising
  in threads—and notice what in you wants to stir again, and what in you wants to let it finish separating.
