resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts compress cosmological process into the rhythm of breath itself: Heraclitus''s
    ''wholly destined'' aphorism treats breath as the fundamental articulation of necessity, while Vijnana
    Bhairava Yukti #1 presents prāṇa (exhale) and jīva (inhale) as the Supreme Goddess''s constant articulation—breath
    as the primary cosmological utterance.'
  divergence: Heraclitus treats breath as a sign of impersonal cosmic necessity and flux; the Vijnana
    Bhairava locates breath within conscious divine articulation (Śakti), making it an expression of conscious
    creative power rather than blind destiny.
  passage_id: vijnana_bhairava.yukti_001
- citation: Isavasya Upanishad — Mantra 17
  resonance: 'Both passages invoke breath as the vehicle connecting the mortal and immortal realms: Heraclitus''s
    aphorism on destiny through breath parallels the Isavasya Upanishad''s invocation of breath returning
    to immortal air, treating breath as the threshold between temporal and eternal orders.'
  divergence: Heraclitus emphasizes breath as the principle of continuous flux and necessity; the Isavasya
    Upanishad frames breath's return to immortal air as liberation from embodiment, making it a release
    rather than an eternal cycling principle.
  passage_id: isavasya_upanishad.isa_023
