sutra_id: HFR_P018
collection: Heraclitus Fragments
section: wisdom_pearl
title: Of all whose words I have heard, no one attains to this, to know that wisdom is apart fro...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Of all whose words I have heard, no one attains to this, to know that wisdom is apart from
  all.°
commentary: 'Heraclitus insists that wisdom is auditory before it is argumentative: the Logos is already
  at work in how things happen, yet people live as if they had no prior encounter with it. The complaint
  is not elitism but phenomenology — most consciousness is forgetful, whether in sleep or in ''waking''
  busyness. The ''one'' is not mystical fusion but the single intelligible order within apparent plurality.
  To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies
  the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 18 (Bywater
  Greek). Corpus index HFR_P018 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what
  experience it actually rests on. Can you hear the claim, not only think it?
