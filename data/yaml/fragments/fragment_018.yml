resonances:
- citation: Astavakra Gita — The Threefold Certainty That Liberates While Living
  resonance: 'Both texts identify a gap between intellectual knowledge and lived realization: Heraclitus
    says people fail to recognize wisdom already at work in the Logos despite encountering it; Astavakra
    says one must know ''I am pure consciousness'' and live from that certainty, yet notes how rarely
    this is seen actualized. Each diagnoses a failure of recognition despite prior exposure.'
  divergence: Heraclitus locates wisdom in the auditory encounter with cosmic Logos operating in external
    events; Astavakra locates it in direct self-knowledge of consciousness as one's true nature, independent
    of body and world.
  passage_id: astavakra_gita.asg_11_6
- citation: Siva Sutra — Śāmbhavopāya
  resonance: 'Both texts posit that a higher mode of consciousness or wisdom operates continuously beneath
    ordinary awareness: Heraclitus insists the Logos is already at work in how things happen; the Siva
    Sutra teaches that the Fourth (transcendent consciousness) is available within the three ordinary
    states. Each asserts a prior, ever-present ground that people fail to recognize.'
  divergence: Heraclitus emphasizes the Logos as the rational principle governing external flux and events;
    the Siva Sutra treats the Fourth as a non-dual consciousness accessible through yogic reorientation
    of the three states themselves.
  passage_id: siva_sutra.ss_i_7
