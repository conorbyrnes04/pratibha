title: clitus’ writing, ‘‘There is only one supreme Wisdom.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: clitus’ writing, ‘‘There is only one supreme Wisdom. It wills and wills not to be called
  by the name of Zeus.’’ And again, ‘‘ Law is to obey the will of one’’ (= frag. 110).
commentary: 'The fragment pivots on a paradox of naming: Wisdom is singular and supreme, yet it simultaneously
  wills and wills *not* to be called Zeus. This is not mystical obscurity but a precise epistemological
  claim. Heraclitus refuses the anthropomorphic god-name not out of piety but because naming—fixing a
  term to a concept—betrays the very nature of what is being named. Wisdom (sophia) is the intelligible
  principle that *orders* all things, the logos that makes sense of flux and opposition. To call it ''Zeus''
  is to domesticate it into the pantheon, to make it one god among many, subject to myth and genealogy.
  The second statement—''Law is to obey the will of one''—clarifies: there is one nomos (law, order, custom)
  that governs all becoming. Not tyranny, but the single rational necessity that runs through fire, war,
  justice, and sleep alike. The ''one'' here is not unity-as-merger but unity-as-principle: the unifying
  force that *remains* while all things pass. To think this requires resisting the comfort of names, the
  illusion that to name something is to know it. Wisdom wills not to be called, because the moment you
  call it, you have already lost it to language.'
voice_of_siva: ''
abhyasa: When you are about to name something—a feeling, a person, a situation—pause at the threshold
  of the word and notice what happens in that gap between the thing and its label. Speak the name aloud,
  then sit with the silence after, attending to what the name *excluded* or *simplified*. Repeat this
  three times with three different objects, letting each naming feel like a small betrayal you are learning
  to see.
