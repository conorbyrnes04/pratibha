title: Atonements.*
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Atonements.*
commentary: 'The fragment''s title—''Atonements''—names not reconciliation but *payment*, *recompense*,
  *making-whole through severance*. Heraclitus does not say ''all is one'' here; he says the one *becomes*
  many through a logic of reciprocal debt (antipeponthos). Fire consumes wood; wood becomes ash; ash returns
  to earth; earth feeds root. Each thing pays what it owes by ceasing to be itself. The paradox is not
  mystical union but the *necessity of exchange*—nothing remains; nothing is forgiven; everything settles
  its account by transformation. To call this ''atonement'' is to hear in the Greek *dikē* (justice, recompense)
  the structure of becoming itself. The one is not a hidden ground behind appearances but the *rate of
  payment*, the measure by which each thing''s dissolution funds another''s birth. Heraclitus refuses
  both permanence and chaos: he names the law that makes change intelligible—not as flux without form,
  but as a cosmic ledger where nothing is lost, only transferred. To understand this is to stop seeking
  escape from time and to recognize that your own decay is already someone else''s nourishment.'
voice_of_siva: ''
abhyasa: 'Identify one small thing you discarded today—a scrap, a word you took back, a plan abandoned—and
  trace it forward: where does it go, what does it feed, what becomes possible because you released it?
  Speak this chain aloud, slowly, as if accounting to the thing itself.'
