resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: Both texts establish a two-level framework where apparent multiplicity (apes, pots, earthen things vs. conventional reality) requires reference to a single intelligible order (the 'one' vs. the ultimate paramārtha) to be properly understood; neither level can be grasped in isolation.
  divergence: Heraclitus grounds the unity in a cosmic logos accessible through sensory comparison; Nagarjuna grounds it in a logical interdependence between conventional and ultimate truths that cannot be separated epistemologically.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
  resonance: Both texts refuse to locate the ultimate principle through spatial or comparative positioning—Heraclitus denies that beauty can be fixed by comparison across kinds, and Svetasvatara denies that the ultimate can be grasped 'above, across, or in between,' each rejecting relational frameworks as the path to the intelligible.
  divergence: Heraclitus uses comparative aesthetics to reveal the single order underlying apparent hierarchy; Svetasvatara uses spatial negation to point toward a transcendent principle beyond all locatable relations.
  passage_id: svetasvatara_upanishad.svu_012
