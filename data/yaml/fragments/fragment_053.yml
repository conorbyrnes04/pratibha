sutra_id: HFR_P053
collection: Heraclitus Fragments
section: wisdom_pearl
title: Poultry bathe
sanskrit: ''
transliteration: ''
translation: 'Poultry bathe

  in dust and ashes,

  swine in filth.'
commentary: 'This fragment invites direct contemplation rather than argument: hold
  its paradox quietly and let understanding ripen through experience.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
