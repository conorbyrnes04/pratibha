translation: Kyes and ears are bad witnesses to people having rude souls.
commentary: 'The turn is ethical-cosmological: character is not private style but alignment with the measure
  that governs all things. Mortality intensifies the question — finite life must choose whether to hear
  the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889), fragment 4 (Bywater Greek).
  Corpus index HFR_P004 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
