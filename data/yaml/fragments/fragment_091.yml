sutra_id: HFR_P091
collection: Heraclitus Fragments
section: wisdom_pearl
title: Since mindfulness, of all things,
sanskrit: ''
transliteration: ''
translation: 'Since mindfulness, of all things,

  is the ground of being,

  to speak one’s true mind,

  and to keep things known

  in common, serves all being,

  just as laws made clear

  uphold the city,

  yet with greater strength.

  Of all pronouncements of the law

  the one source is the Word

  whereby we choose what helps

  true mindfulness prevail.'
commentary: 'The fragment points to a wisdom that is heard rather than invented: reality
  has an intelligible order, and our task is to align attention with it.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
glossary: []
themes:
