title: The Law of Understanding is common to all.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: The Law of Understanding is common to all. Those who speak with intelligence must hold fast to that which is common to all, even more strongly than ἐννέα Tot ζώει γενεὰς λακέρυζα κορώνη ἀνδρῶν ἡβώντων " ἔλαφος δέ τε τετρακόρων ος τρεῖς δ᾽ ἐλάφους ὁ κόραξ γηράσκεται. ἀντὰρ ὁ φοίνιξ ἐννέα τοὺς κόρακας " δέκα δ᾽ ἡμεῖς τοὺς φοίνικας νύμφαι ἐυπλόκαμοι, κοῦραι Διὸς ἀμγιόχοιο.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 91 (Bywater Greek). Corpus index HFR_P091 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance arises — that resistance is part of the teaching.
