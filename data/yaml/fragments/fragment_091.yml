resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts locate a universal principle in the rhythmic movement of breath itself: Heraclitus
    embeds the common Law in the breath-like flow of understanding, while Vijnana Bhairava #1 identifies
    the Supreme Goddess''s constant articulation through the dual prāṇa-jīva breath-cycle as the fundamental
    cosmic utterance.'
  divergence: Heraclitus treats breath as the medium through which a rational law (logos) is grasped intellectually,
    whereas Vijnana Bhairava treats breath as the direct manifestation of divine feminine power (Śakti)
    requiring embodied yogic recognition rather than discursive understanding.
  passage_id: vijnana_bhairava.yukti_001
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish that a universal principle cannot be accessed in isolation but only
    through a structural interdependence: Heraclitus''s common Law requires the breath-flow of shared
    understanding, while Nagarjuna''s ultimate (paramārtha) cannot be pointed out except by leaning on
    the conventional (vyavahāra).'
  divergence: Heraclitus posits the Law as ontologically prior and self-manifesting through breath, whereas
    Nagarjuna treats the ultimate and conventional as mutually dependent without ontological hierarchy,
    a non-dual framework rather than a foundational one.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
