sutra_id: HFR_P044
collection: Heraclitus Fragments
section: wisdom_pearl
title: War is the father and king of all, and has produced some as gods and some as men, and has...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: War is the father and king of all, and has produced some as gods and some as people, and
  has made some slaves and some free.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow,
  lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse
  the very structures that make harmony audible. Anchor: George T.W. Patrick (1889), fragment 44 (Bywater
  Greek). Corpus index HFR_P044 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
glossary: []
anchor_translation: War is the father and king of all, and has produced some as gods and some as men,
  and has made some slaves and some free.
source_reference: Patrick (1889), frag. 44; corpus HFR_P044
pratibha_translation: War is the father and king of all, and has produced some as gods and some as people,
  and has made some slaves and some free.
key_terms:
- term: harmoniē (ἁρμονίη)
  definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic,
    not the removal of difference. This is Heraclitus's answer to those who expect peace as sameness.
