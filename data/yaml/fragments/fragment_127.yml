sutra_id: HFR_P127
collection: Heraclitus Fragments
section: wisdom_pearl
title: Dionysus is their name for death.
sanskrit: ''
transliteration: ''
translation: 'Dionysus is their name for death.

  And if they did not claim

  the statue of the drunk

  they worshipped was a god,

  or call their incoherent song

  about his cock their hymn,

  everyone would know

  what filth their shamelessness

  has made of them

  and of the name of god.'
commentary: 'The line turns inquiry inward: character and attention shape destiny.
  Mortality sharpens the call to live deliberately.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
