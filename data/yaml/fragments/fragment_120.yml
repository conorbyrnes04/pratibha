resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish a single intelligible order that reconciles apparent duality: Heraclitus
    finds one logos within plurality; Nagarjuna shows how ultimate and conventional are inseparable poles
    of a single system, not separate realms.'
  divergence: Heraclitus grounds unity in cosmic reason (logos) accessible through perception; Nagarjuna
    grounds it in the logical interdependence of two truths, requiring philosophical deconstruction rather
    than intuitive grasp.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts locate a single generative principle (one intelligible order / Supreme Goddess)
    that manifests as rhythmic alternation: Heraclitus''s day-cycle and Nagarjuna''s breath-flow both
    express constancy through perpetual oscillation, not static unity.'
  divergence: Heraclitus emphasizes the rational structure of cosmic fire underlying change; the Vijnana
    Bhairava grounds the same principle in embodied prāṇa and goddess-consciousness, making it experientially
    accessible through breath-work rather than intellectual observation.
  passage_id: vijnana_bhairava.yukti_001
