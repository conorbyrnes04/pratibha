sutra_id: HFR_P022
collection: Heraclitus Fragments
section: wisdom_pearl
title: All things are exchanged for fire and fire for all things, just as wares for gold and gol...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: All things are exchanged for fire and fire for all things, just as wares for gold and gold
  for wares. that there is an everlasting world on the one hand and on the other a perishable, that is,
  in its arrangement, knowing that in a certain manner the one is not different from the other. But that
  he knew an everlasting world eternally of a certain kind in its whole essence, he makes plain, saying
  in this manner, ‘‘ This world the same for all,’”’ ete. says Heraclitus, neither any god nor man has
  made; as if fearing that having denied a divine creation, we should suppose the creator of the world
  to have been some man. Nicander, Alexiph. 174. Epictetus from Stob. Floril. cviii. 60.. M. Antoninus
  vii. 9.
commentary: 'The fragment''s central move is not metaphor but equivalence: fire and things stand in the
  same relation as gold and wares in a market. The image is economic, not poetic. Fire is not a symbol
  for change—it is the *measure* by which all transformation is priced and balanced. Just as a merchant
  does not ask whether gold or cloth is ''more real,'' but only what rate holds between them, Heraclitus
  proposes that the cosmos operates by a fixed *logos* of exchange. Nothing is lost; everything converts
  at a constant ratio. The fragment then pivots: this eternal arrangement (kosmos) is neither made by
  god nor man, yet it is knowable—''the same for all.'' The paradox is that what is unmade is also ordered,
  what is perishable in appearance obeys an everlasting law of proportion. The world is not a creation
  but a *meter*, a system of just equivalences. To understand fire is not to watch flames but to recognize
  that every transformation—rust, growth, decay, thought—settles into balance. The fragment refuses both
  blind flux and static being: it offers instead a *physics of fair exchange*, where the rate of conversion
  is the only permanence.'
voice_of_siva: ''
abhyasa: 'When handling money, food, time, or attention today, pause at one moment of exchange (spending,
  eating, deciding where to look) and ask: what is the hidden rate at which I am trading this for that?
  Name the two things and the measure between them—not as judgment, but as a merchant would, neutrally.
  Repeat the names three times aloud or in thought to feel the balance.'
