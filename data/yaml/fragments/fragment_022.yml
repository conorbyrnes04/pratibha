resonances:
- citation: 'Vijnana Bhairava — Yukti #82'
  resonance: 'Both texts use a generative principle (fire/Bhairava) as the lawful source from which all
    manifest forms arise through continuous transformation. Heraclitus''s fire and Bhairava''s consciousness
    both function as the metric of exchange: just as wares exchange for gold, waves arise from water and
    flames from fire—a structure of perpetual circulation through a single underlying medium.'
  divergence: Heraclitus grounds transformation in impersonal cosmic law (logos), while Vijnana Bhairava
    frames it within non-dual consciousness (Bhairava as supreme subject); Heraclitus emphasizes the measurable
    flux itself, whereas Bhairava emphasizes the unified source from which differentiation emerges.
  passage_id: vijnana_bhairava.yukti_082
- citation: Patañjali Yoga Sūtras 3.13
  resonance: Both passages assert that transformation of visible characteristics, conditions, and elements
    follows from a prior principle or set of principles that govern their lawful change. Heraclitus's
    fire-exchange and Patañjali's explanation of elemental transformations both treat change as systematic
    and intelligible rather than arbitrary.
  divergence: Heraclitus locates the principle of transformation in fire itself (the medium of exchange),
    while Patañjali locates it in the mechanics of samskara and the three gunas (conditioning factors
    external to the elements); Heraclitus emphasizes ontological flux, Patañjali emphasizes causal mechanism.
  passage_id: patañjali_yoga_sūtras.ys_3_13
