sutra_id: HFR_P049
collection: Heraclitus Fragments
section: wisdom_pearl
title: Philosophers must be learned in very many things.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Philosophers must be learned in very many things.
commentary: 'This fragment cuts against the grain of what ''philosophy'' has come to mean. Heraclitus
  does not say philosophers must be *wise* or must *think deeply*—he says they must be *learned in very
  many things* (πολυμαθίη, polymathie). The move is radical: wisdom is not a unified system or a single
  insight grasped once and held. It demands multiplicity, a restless accumulation of particular knowledges.
  Yet the fragment does not celebrate mere collection. The word *learned* (δεῖ, dei—must, is necessary)
  carries necessity, not choice. A philosopher cannot avoid the many; the many are constitutive of the
  philosophical posture itself. This inverts the Platonic ascent from shadows to Forms. For Heraclitus,
  the philosopher does not escape the particular for the universal—the philosopher must *dwell in* the
  particular, must know fire and water and strife and sleep, must know how the bow and lyre work, must
  know the waking city and the sleeping soul. The paradox: depth is achieved not by penetration to a single
  principle but by fidelity to multiplicity. One cannot think the *logos*—the underlying measure or account—without
  first being saturated in the many things that the logos governs. Polymathie is not distraction; it is
  the necessary texture of attention.'
voice_of_siva: ''
abhyasa: Over three days, each morning name aloud one small thing you do not yet understand about your
  immediate surroundings—a neighbor's habit, the exact sequence of sounds in your street, the way light
  moves across a wall at a particular hour, the grammar of a gesture you repeat without thinking. Do not
  research or resolve it. Carry the not-knowing as a deliberate weight, as material for thought rather
  than a gap to fill.
