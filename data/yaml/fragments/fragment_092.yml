title: Although the Law of Reason is common, the majority of people live as though they had an u...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Although the Law of Reason is common, the majority of people live as though they had an understanding
  of their own.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly:
  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 92 (Bywater
  Greek). Corpus index HFR_P092 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what
  experience it actually rests on. Can you hear the claim, not only think it?
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
glossary: []
anchor_translation: Although the Law of Reason is common, the majority of people live as though they had
  an understanding of their own.
source_reference: Patrick (1889), frag. 92; corpus HFR_P092
pratibha_translation: Although the Law of Reason is common, the majority of people live as though they
  had an understanding of their own.
key_terms:
- term: Logos (λόγος)
  definition: 'Greek: speech, account, ratio, intelligible order. In Heraclitus, the Logos is the pattern
    according to which all things occur — not a private doctrine but the world''s articulation. Patrick''s
    ''Reason'' is a Victorian gloss; we use Logos to preserve the Greek range (cosmic order + intelligible
    speech).'
