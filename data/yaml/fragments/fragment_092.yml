resonances:
- citation: Phaedo (Plato) — Knowledge as Recollection
  resonance: Both texts posit that true knowledge is not a novel acquisition but a re-cognition of what the mind already possesses or measures by. Heraclitus claims the common Logos is available to all yet most live as though they have private understanding; Plato's recollection doctrine holds that learning re-recognizes standards the mind already carries.
  divergence: Heraclitus emphasizes the paradox of universal access paired with willful ignorance; Plato locates the problem in forgetting and the need for dialectical recovery of innate forms.
  passage_id: phaedo_plato.phaedo_md_002
- citation: Isavasya Upanishad — Mantra 12
  resonance: 'Both texts diagnose a structural trap: exclusive commitment to one pole (unmanifest or manifest; private understanding or the common Logos) leads to darkness or error. The problem is not lack of access but misdirected attention or false choice.'
  divergence: Heraclitus frames the error as living by private opinion despite universal availability; the Isavasya frames it as devotion to only one metaphysical dimension, requiring balance between both.
  passage_id: isavasya_upanishad.isa_018
