sutra_id: HFR_P092
collection: Heraclitus Fragments
section: wisdom_pearl
title: Although we need the Word
sanskrit: ''
transliteration: ''
translation: 'Although we need the Word

  to keep things known in common,

  people still treat specialists

  as if their nonsense

  were a form of wisdom.'
commentary: 'The fragment points to a wisdom that is heard rather than invented: reality
  has an intelligible order, and our task is to align attention with it.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
glossary: []
themes:
