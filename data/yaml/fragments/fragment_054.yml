resonances:
- citation: The Book of Chuang Tzu — Uselessness and the Middle Way
  resonance: Both texts locate truth or order in the middle ground between apparent opposites rather than
    in their resolution or transcendence. Heraclitus sees opposition itself as the instrument of harmony;
    Chuang Tzu rests 'halfway between the two,' treating the extremes as a field to navigate rather than
    reconcile.
  divergence: Heraclitus emphasizes opposition as generative tension and cosmic necessity; Chuang Tzu
    emphasizes non-action and perspective-shift as the way to occupy the middle, making it a matter of
    stance rather than metaphysical structure.
  passage_id: the_book_of_chuang_tzu.zhuangzi_md_020
- citation: 'Vijnana Bhairava — Yukti #74'
  resonance: Both texts propose that perception itself—how one frames or 'sees' phenomena—transforms their
    nature and reveals underlying order. The Vijnana Bhairava's contemplation of the universe as flux
    or illusion parallels Heraclitus's insight that opposition is not disorder but the hidden structure
    of reality.
  divergence: Heraclitus grounds this in the logos as objective cosmic principle; the Vijnana Bhairava
    treats it as a yogic technique of reframing consciousness, making the transformation subjective and
    meditative rather than ontological.
  passage_id: vijnana_bhairava.yukti_074
