sutra_id: HFR_P054
collection: Heraclitus Fragments
section: wisdom_pearl
title: They revel in dirt.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: 'They revel in dirt. and crooked, he (Heraclitus) says, are the same: ‘‘ The way of the wool-carders
  is straight and crooked.’”’ The revolution of the instrument in a carder’s shop (Gr. γναφείῳ Bernays,
  γραφείῳ vulg.) called a screw is straight and crooked, for it moves at the same time forward andinacircle.
  ‘‘It is one and the same,’’ he says.'
commentary: 'The wool-carder''s screw moves forward and circles simultaneously—a single motion that is
  both straight and crooked, not by contradiction but by the nature of the tool itself. Heraclitus does
  not resolve this by saying ''they are really the same underneath'' or by dissolving opposites into unity.
  Instead, he plants us inside the *function*: the screw''s helical path *requires* both vectors at once.
  To move forward, it must spiral. The straight and crooked are not reconciled in thought; they are unified
  in work. This is why he says ''it is one and the same''—not one essence wearing two masks, but one *operation*
  that cannot perform without the apparent contradiction. The passage refuses the comfort of harmony-language.
  There is no peace here, no balance point. There is only the tool that works *because* it twists. When
  we call something crooked or straight in isolation, we have already severed it from its labor. The logos—the
  intelligible pattern—lives not in the categories but in the motion that holds them both.'
voice_of_siva: ''
abhyasa: Watch a screw enter wood or a spiral staircase ascend through a building, tracking with your
  eye the simultaneous forward and rotational paths until you cannot separate them into two movements—then
  notice what shifts in how you perceive 'progress' or 'direction' in your own day.
