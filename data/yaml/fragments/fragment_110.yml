resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: Both texts establish that a single intelligible order (Heraclitus's 'one,' Nagarjuna's paramārtha) cannot be grasped in isolation from its apparent multiplicity (Heraclitus's plurality, Nagarjuna's vyavahāra); the 'law' or necessity is that understanding moves through both registers simultaneously.
  divergence: Heraclitus treats the one as an eternal rational principle governing flux; Nagarjuna treats the ultimate and conventional as mutually dependent conceptual frameworks with no independent essence.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: Both passages locate intelligible order not in static unity but in the dynamic tension or balance of opposing forces—Heraclitus's 'will of one' as the law governing apparent conflict, and the Vijnana Bhairava's sanghaṭṭa (dynamic tension of prāṇas) as the condition for equality-consciousness.
  divergence: Heraclitus emphasizes obedience to an impersonal rational order; the Vijnana Bhairava locates the same principle within embodied breath-practice as a path to direct realization.
  passage_id: vijnana_bhairava.yukti_037
