resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts use breath as the primary cosmological articulation: Heraclitus compresses the greatest things into a single paradoxical image, while the Vijnana Bhairava locates the Supreme Goddess''s constant articulation in the prāṇa-jīva cycle. Each treats breath as the fundamental expression through which ultimate reality manifests.'
  divergence: Heraclitus warns against hasty conclusion about breath-as-cosmos through paradox and restraint; the Vijnana Bhairava offers breath as a direct yukti (technique) for recognizing the divine, emphasizing embodied practice over epistemological caution.
  passage_id: vijnana_bhairava.yukti_001
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts refuse premature closure on ultimate truth by establishing a structural interdependence: Heraclitus warns against rash conclusions about the greatest things, while Nagarjuna shows that the ultimate cannot be pointed out without leaning on convention. Each suspends direct access to the highest through a methodological constraint.'
  divergence: Heraclitus's restraint is aphoristic and imagistic, warning against hasty thought; Nagarjuna's is systematic and logical, establishing a two-truths framework where the relationship between levels is constitutive rather than merely cautionary.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
