resonances:
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 7
  resonance: 'Both texts diagnose a structural entrapment: Heraclitus identifies weariness-through-repetition
    as self-perpetuating control; Plotinus identifies preoccupation with externals as the mechanism that
    obscures an ever-present unity. Each locates ignorance not in absence but in misdirected attention
    that reinforces its own blindness.'
  divergence: Heraclitus frames the trap as cosmological circularity (labor and control as reciprocal
    forces); Plotinus frames it as a turning-away from an ontologically prior inward reality that remains
    accessible through reorientation.
  passage_id: plotinus_enneads.enn_vi_9_07
- citation: 'Vijnana Bhairava — Yukti #2'
  resonance: 'Both texts compress a paradoxical liberation into a single image of cessation: Heraclitus''s
    weariness-unto-control finds its inverse in the Vijnana Bhairava''s śakti revealed precisely when
    movement stops—neither outward nor inward motion, but rest as the disclosure of power. Each treats
    stasis as the condition for unveiling what repetitive action obscures.'
  divergence: Heraclitus emphasizes the exhaustion of the cycle itself as the aporia; the Vijnana Bhairava
    treats stillness as a positive yogic technique that reveals an immanent śakti, not merely the collapse
    of false effort.
  passage_id: vijnana_bhairava.yukti_002
- citation: Shantideva Bodhicaryavatara — Take Others as Your Self
  resonance: Both texts expose how habitual repetition (abhyāsa in Shantideva, the same-things-labored-upon
    in Heraclitus) constructs a false identity or control-structure that appears natural but has no ontological
    ground. Each identifies the mechanism as iterative reinforcement masquerading as necessity.
  divergence: Shantideva locates the false construction in the ego's appropriation of foreign matter through
    habit; Heraclitus presents the paradox as a cosmological bind where labor and control mutually generate
    weariness, without explicitly invoking a constructed self.
  passage_id: shantideva_bodhicaryavatara.bca_08_exchange
