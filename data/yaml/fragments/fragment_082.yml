translation: It is weariness upon the same things to labor and by them to be controlled.” Iamblichus from
  Stob. Eel. 11. 1, Ὁ. 12.
commentary: 'The fragment names a specific exhaustion: not mere fatigue, but the weariness that comes
  from laboring *at* the same things while simultaneously being *ruled by* them. The Greek structure—ponein
  epi tois autois kai hypokeimenois—holds both directions at once: you work upon them, they work upon
  you. This is not passivity masquerading as activity, nor activity that escapes its own conditions. Heraclitus
  is naming the bind itself as the thing to see. The weariness is not a failure of effort but its signature.
  To labor at the same things is already to be controlled by them; to be controlled by them is already
  to labor. The fragment does not counsel escape or transcendence. It asks: what if you stopped treating
  this as a problem to solve and instead let the weariness itself show you the shape of the bind? The
  teaching is not ''stop laboring'' but ''notice the exact topology of this exhaustion''—how the same
  things that demand your work are the same things that limit your freedom. This is not despair. It is
  the beginning of seeing what actually moves.'
voice_of_siva: ''
abhyasa: Return to one repetitive task you perform daily—washing, typing, walking a familiar route, tending
  something. As you move through it, feel for the exact moment when the action shifts from something you
  are doing to something that is doing you, or when both occur simultaneously. Do not try to change it.
  Mark where the weariness lives—in the body, the attention, the will—and whether it has a texture or
  a weight. Repeat this noticing for three days without commentary.
