commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 109 (Bywater Greek). Corpus index HFR_P109 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
