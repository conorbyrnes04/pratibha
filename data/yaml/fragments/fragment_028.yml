sutra_id: HFR_P028
collection: Heraclitus Fragments
section: wisdom_pearl
title: Lightning rules all.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Lightning rules all.
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation.
  What looks like destruction is often conversion governed by proportion — a physics of becoming that
  refuses both chaos and immobility. Anchor: George T.W. Patrick (1889), fragment 28 (Bywater Greek).
  Corpus index HFR_P028 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
glossary: []
anchor_translation: Lightning rules all.
source_reference: Patrick (1889), frag. 28; corpus HFR_P028
pratibha_translation: Lightning rules all.
key_terms:
- term: pyr / cosmic fire
  definition: Heraclitus's world-ruling fire is not mythic flame alone but measured transformation — exchange
    (πυρὸς τροπαὶ) governed by proportion. Fire names process, not a static element.
