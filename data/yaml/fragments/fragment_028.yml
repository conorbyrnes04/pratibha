resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts name cosmic order through breath-movement: Heraclitus uses fire-language to articulate lawful transformation; Vijnana Bhairava articulates the Supreme through prāṇa''s measured rise and descent. Each makes a dynamic principle (fire/breath) the fundamental articulation of reality.'
  divergence: Heraclitus grounds lawfulness in impersonal cosmic fire as the measure of change; Vijnana Bhairava grounds it in conscious divine articulation (uccaret) through embodied breath-flow.
  passage_id: vijnana_bhairava.yukti_001
- citation: Svetasvatara Upanishad — Savitr and the Birth of Sacred Attention
  resonance: 'Both texts invoke a hidden generative power (fire) that must be drawn forth through ordered attention: Heraclitus''s lightning rules as the measure of transformation; Savitṛ yokes mind toward truth by drawing forth hidden fire. Each names a principle that orders reality through active extraction or revelation.'
  divergence: Heraclitus presents fire as the impersonal law already ruling; Svetasvatara presents fire as latent potential requiring yogic extraction through directed intelligence.
  passage_id: svetasvatara_upanishad.svu_016
