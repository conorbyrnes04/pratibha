sutra_id: HFR_P061
collection: Heraclitus Fragments
section: wisdom_pearl
title: that it is unfitting that the sight of wars should please the gods.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: that it is unfitting that the sight of wars should please the gods. But it is notso. For
  noble works delight them, and while wars and battles seem to us terrible, to God they do not seem so.
  For God in his dispensation of all events, perfects them into a harmony of the whole, just as, indeed,
  Heraclitus says that to God all things are beautiful and good and right, though people suppose that
  some are right and others wrong.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow,
  lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse
  the very structures that make harmony audible. The ''one'' is not mystical fusion but the single intelligible
  order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics
  — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick
  (1889), fragment 61 (Bywater Greek). Corpus index HFR_P061 follows the Diels–Kranz-style numbering used
  in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two
  pulls create the function? Write both pulls without trying to remove either.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
