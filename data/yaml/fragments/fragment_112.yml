resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: Both texts compress a cosmological principle into the mechanics of breath as the fundamental
    articulation of reality. Heraclitus embeds cosmic order in the authority of a single utterance; the
    Vijnana Bhairava locates the Supreme Goddess's creative articulation in the prāṇa-jīva cycle itself—breath
    as the primary speech-act of manifestation.
  divergence: Heraclitus grounds authority in human logos and individual worth; the Vijnana Bhairava dissolves
    the speaker into an impersonal divine flow, where breath speaks the cosmos rather than a person speaking
    truth.
  passage_id: vijnana_bhairava.yukti_001
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts structure a paradox of dependence: the ultimate cannot be accessed except through
    the conventional; truth''s authority rests on a prior, seemingly lesser ground. Heraclitus''s aphorism
    compresses this into the image of one man''s word outweighing others—a reversal that depends on the
    conventional measure it transcends.'
  divergence: Nagarjuna explicitly theorizes the two truths as mutually necessary; Heraclitus presents
    the paradox as a compressed image or riddle, leaving the logical structure implicit rather than systematic.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
