sutra_id: HFR_P112
collection: Heraclitus Fragments
section: wisdom_pearl
title: In Priene there lived Bias, son of Teutamus, whose word was worth more than that of others.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: In Priene there lived Bias, son of Teutamus, whose word was worth more than that of others.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly:
  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 112
  (Bywater Greek). Corpus index HFR_P112 follows the Diels–Kranz-style numbering used in the Pratibha
  pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
glossary: []
anchor_translation: In Priene there lived Bias, son of Teutamus, whose word was worth more than that of
  others.
source_reference: Patrick (1889), frag. 112; corpus HFR_P112
pratibha_translation: In Priene there lived Bias, son of Teutamus, whose word was worth more than that
  of others.
key_terms:
- term: Logos (λόγος)
  definition: 'Greek: speech, account, ratio, intelligible order. In Heraclitus, the Logos is the pattern
    according to which all things occur — not a private doctrine but the world''s articulation. Patrick''s
    ''Reason'' is a Victorian gloss; we use Logos to preserve the Greek range (cosmic order + intelligible
    speech).'
