resonances:
- citation: Bhagavad Gita — Beyond Gunas and the Inverted Tree
  resonance: Both texts posit that apparent opposition or multiplicity (gunas/opposites) is not a defect but the fundamental structure through which reality operates and manifests. The three gunas condition embodied life just as Heraclitean opposition instruments cosmic order.
  divergence: Heraclitus treats opposition as the eternal dynamic principle itself, while the Bhagavad Gita presents the gunas as conditional modalities that can be transcended through discriminative knowledge.
  passage_id: bhagavad_gita.bg_md_011
- citation: Yoga Spandakarika — First Flow
  resonance: Both dissolve apparent dualities (pleasure/suffering, subject/object for Spandakarika; opposing forces for Heraclitus) into a unified ground or principle—consciousness/logos—where opposition ceases to be contradictory and becomes intelligible as a single reality.
  divergence: Heraclitus emphasizes opposition as the generative tension maintaining cosmic order, while Yoga Spandakarika reveals opposition as illusory appearance within undifferentiated consciousness, pointing toward non-dual realization.
  passage_id: yoga_spandakarika.sp_05
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 9
  resonance: Both identify a singular ultimate principle (the One/logos) as the source governing the harmony of all existence, with multiplicity arising from and sustained by this foundational unity.
  divergence: Plotinus's One transcends being and intellect hierarchically, while Heraclitus's logos operates immanently as the dynamic principle of opposition and flux within the natural world itself.
  passage_id: plotinus_enneads.enn_v_1_09
