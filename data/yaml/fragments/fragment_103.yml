sutra_id: HFR_P103
collection: Heraclitus Fragments
section: wisdom_pearl
title: Corpses are more worthless than excrement.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Corpses are more worthless than excrement.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly:
  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 103
  (Bywater Greek). Corpus index HFR_P103 follows the Diels–Kranz-style numbering used in the Pratibha
  pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
