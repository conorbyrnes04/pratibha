resonances:
- citation: Tao Te Ching — The Mysterious Virtue of the Unbound One
  resonance: Both texts posit that opposing or complementary forces (strife/war in Heraclitus; yin/yang or dual souls in Tao Te Ching) must be held together in dynamic unity to maintain cosmic order. Opposition is not negated but integrated as the condition of continuity.
  divergence: Heraclitus emphasizes strife and becoming as generative and necessary; the Tao Te Ching seeks equilibrium and non-action (wu wei) as the way to preserve the balance between opposites.
  passage_id: tao_te_ching.ttc_md_022
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: Both texts locate the fundamental principle of order in breath (pneuma/prāṇa) as the medium through which opposing movements—exhalation and inhalation, or strife and harmony—generate and sustain all manifestation.
  divergence: Heraclitus treats strife as the universal law governing all things; the Vijnana Bhairava treats breath-flow as the vehicle of divine consciousness (Shakti) through which the practitioner recognizes non-dual reality.
  passage_id: vijnana_bhairava.yukti_001
