sutra_id: HFR_P062
collection: Heraclitus Fragments
section: wisdom_pearl
title: We must know that war is universal and strife right, and that by strife all things arise...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: We must know that war is universal and strife right, and that by strife all things arise
  and tare used. 13
commentary: 'Heraclitus does not mourn conflict; he names it *polemos* — war, strife, the agonistic principle
  — as the universal condition and simultaneously as *dikaios*, right or just. This is not metaphor softened
  into acceptability. The fragment refuses the comfortable split between a ''real'' peaceful order and
  unfortunate disruptions. Instead, strife *is* the generative medium itself: things do not arise *despite*
  conflict but *through* it, *ek tês erides* — from the friction, the pulling-apart, the incompatibility
  of forces. The old commentary''s bow and lyre are not mere illustrations; they are the logic made visible.
  A bow''s power to shoot comes from the tension between string and wood held in opposition — release
  the tension and you have only wood and string, no bow. A lyre''s harmony emerges not from the absence
  of the different pitches but from their simultaneous sounding, their *diaphora* (difference) held in
  a single frame. The fragment''s claim is harder than ''balance'': it asserts that the *arising* of anything
  — its *genesis*, its coming-to-be — requires this perpetual pulling-apart. Things are not *used* (worn,
  consumed, brought into function) by peace but by the very strife that generated them. To know this is
  not to celebrate war as moral good but to stop expecting a world without tension and to recognize that
  the stability you depend on — your body''s metabolism, a conversation''s meaning, a society''s laws
  — all require the continuous micro-conflicts, the friction, the incompatibilities that hold them in
  form.'
voice_of_siva: ''
abhyasa: 'In the moment you feel resistance to someone''s words or presence — a tightness, disagreement,
  the impulse to turn away — hold still and ask: what is being generated *right now* in this friction
  that would not exist in silence or agreement? Notice without resolving: the sharpness of your own thinking,
  the other person''s specificity, the shape of the actual exchange. Let the strife do its work rather
  than rush to harmony.'
