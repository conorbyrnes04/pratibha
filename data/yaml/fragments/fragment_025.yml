sutra_id: HFR_P025
collection: Heraclitus Fragments
section: wisdom_pearl
title: change of bodies and the alternation of origin, the way up and down, according to Heracli...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: change of bodies and the alternation of origin, the way up and down, according to Heraclitus.
  And again he says, ‘‘ Living in their death and dying in their life (see frag. 67). Fire lives in the
  death of earth,”’ etc. M. Antoninus iv. 46. Context, see frag. 5. XX VI.—
commentary: 'The fragment names not flux as formlessness but as reciprocal passage—the way up and the
  way down are one and the same path, traversed in opposite directions. Fire does not merely burn; it
  lives by consuming what dies, and in that consumption the dead earth becomes the fire''s own life. This
  is not metaphor but structural claim: there is no substance that persists unchanged; there is only the
  continuous exchange of states, each thing''s death the condition of another''s living. The ''alternation
  of origin'' (metabolē archēs) means that the source itself turns, reverses, converts—fire to ash to
  earth to vapor to fire again. What appears as opposing endpoints (life/death, up/down, earth/fire) are
  revealed as phases of a single motion, a logos governing the measure of transformation. The wisdom lies
  not in stopping change but in recognizing its lawfulness: that death and life are not contradictions
  but partners in a measured dance. To see this is to cease fleeing from destruction and to recognize
  it as the very engine of renewal.'
voice_of_siva: ''
abhyasa: 'Light a fire or observe one burning for several minutes without interruption. As you watch,
  name aloud three things the fire is doing simultaneously: what it consumes, what it releases into air,
  what remains as ash. Repeat this naming cycle three times, each time noticing how the fire''s ''life''
  is inseparable from the matter it unmakes.'
