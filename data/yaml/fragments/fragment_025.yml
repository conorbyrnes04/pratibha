sutra_id: HFR_P025
collection: Heraclitus Fragments
section: wisdom_pearl
title: change of bodies and the alternation of origin, the way up and down, according to Heracli...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: change of bodies and the alternation of origin, the way up and down, according to Heraclitus. And again he says, ‘‘ Living in their death and dying in their life (see frag. 67). Fire lives in the death of earth,”’ etc. M. Antoninus iv. 46. Context, see frag. 5. XX VI.—
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation. What looks like destruction is often conversion governed by proportion — a physics of becoming that refuses both chaos and immobility. The turn is ethical-cosmological: character is not private style but alignment with the measure that governs all things. Mortality intensifies the question — finite life must choose whether to hear the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889), fragment 25 (Bywater Greek). Corpus index HFR_P025 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Choose one situation that feels chaotic. Name one measure or proportion hidden in it (timing, limit, exchange). Sit with that pattern for two minutes.
