sutra_id: HFR_P069
collection: Heraclitus Fragments
section: wisdom_pearl
title: The way upward and downward are one and the same.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: The way upward and downward are one and the same. Hierocles in Aur. carm. 24.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow,
  lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse
  the very structures that make harmony audible. The ''one'' is not mystical fusion but the single intelligible
  order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics
  — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick
  (1889), fragment 69 (Bywater Greek). Corpus index HFR_P069 follows the Diels–Kranz-style numbering used
  in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
