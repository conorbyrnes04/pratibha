title: It is better to conceal ignorance, but it is hard to do so in relaxation and over wine.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: It is better to conceal ignorance, but it is hard to do so in relaxation and over wine.
commentary: 'Heraclitus does not counsel silence as virtue. He names a gap: between what one knows and
  what one claims, and between the vigilance required to hold that gap and the conditions—leisure, wine,
  warmth—that dissolve it. The fragment''s force lies in its admission of difficulty, not its prescription.
  *Skepsis* (concealment, covering) is ''better,'' yet the very relaxation that makes life livable—the
  symposium, the untensed body, the loosened tongue—makes concealment nearly impossible. This is not a
  moral failing to correct but a structural fact about attention and embodiment. Wine does not make us
  dishonest; it makes us *present*, and presence without discipline leaks truth. The teaching is not ''drink
  less'' but ''notice what you cannot hold.'' The hard thing is not the concealment itself but the sustained
  self-knowledge that would make concealment necessary—and the recognition that such sustained knowledge
  may be incompatible with the relaxation that makes us human. Heraclitus is describing the cost of *logos*:
  to speak truly requires a tension that cannot be maintained in repose.'
voice_of_siva: ''
abhyasa: In conversation over food or drink, speak one complete thought without qualification or hedge,
  then pause and notice what impulse arises—to soften it, expand it, take it back, or fill the silence.
  Do not act on the impulse. Repeat this three times in a single gathering, marking each time whether
  the impulse came from fear of judgment, desire to seem wiser, or genuine uncertainty about what you
  had just said.
