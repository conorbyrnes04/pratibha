sutra_id: HFR_P123
collection: Heraclitus Fragments
section: wisdom_pearl
title: And those that are there shall arise and become guardians of the living and the dead.”
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: And those that are there shall arise and become guardians of the living and the dead.”
commentary: 'This fragment arrests on a single pivot: *those that are there*—a radical ambiguity. Are
  ''they'' the dead themselves? Daemons? Principles? Heraclitus refuses to name. What matters is the verb:
  *arise* (ἀνίστημι)—to stand up, to be roused into function. The fragment does not describe a static
  hierarchy or afterlife geography. It describes *activation*. Those presences (however we parse them)
  do not passively exist in some realm; they *become* guardians—they take on office, responsibility, the
  work of tending. And what do they tend? Both the living *and* the dead—no separation, no final rest.
  The living and dead form a single domain requiring vigilance. This is not metaphysics dressed as poetry.
  It is a claim about *continuous tension*: the boundary between life and death is not a wall but a threshold
  that requires constant watching. To be alive is already to be watched over by what has passed. To die
  is not to leave the sphere of guardianship but to enter it from another angle. The fragment trains the
  ear away from comfort—away from the notion that death ends obligation or presence. It asks: who or what
  is already standing guard over your life, over what you have inherited, over what you will leave? The
  answer is not reassuring. It is structural.'
voice_of_siva: ''
abhyasa: 'Walk a route you know well—home to work, or a familiar neighborhood loop—and at three unmarked
  points stop and ask aloud or in a whisper: *What is being guarded here?* Not metaphorically. Attend
  to the literal threshold: a doorway, a corner, a tree. Notice what has passed through it, what remains,
  what is tended or neglected. Do this without resolving the question. The practice is not to answer but
  to let the question remake your perception of ordinary space.'
