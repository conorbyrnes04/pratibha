title: The harmony of the world is a harmony of oppositions, as in the case of the bow and of th...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: The harmony of the world is a harmony of oppositions, as in the case of the bow and of the
  lyre.
commentary: 'Heraclitus does not say harmony *despite* oppositions or *above* them—he says it *is* a harmony
  *of* oppositions. The bow and lyre are not metaphors for conflict resolution; they are the very mechanism.
  A bow''s power lies in the counter-pull: wood bends one way, string pulls the opposite way, and from
  this precise antagonism comes the arrow''s flight. The lyre''s strings are tuned to different tensions—each
  one resists the frame differently—and only this differentiated resistance produces pitch and music.
  The word harmonia (ἁρμονία) itself means a fitting-together, a joining of unlike things. Heraclitus
  is not offering consolation that opposites can coexist; he is showing that opposition *is* the structure
  of function itself. Remove the tension from the bow, and you have wood and string lying separate. Remove
  the tension from the lyre, and you have silence. The world''s order (kosmos) is not a neutral field
  where opposites happen to balance; it is actively *made* by the perpetual strain between them. This
  is not compromise. It is the discovery that what we call ''harmony'' is not the absence of pulling apart,
  but the precise calibration of it.'
voice_of_siva: ''
abhyasa: 'Pluck a string or strike a drum, and while the sound decays, attend to the exact moment when
  vibration becomes silence—the point where the string''s resistance to air and its own inertia are still
  in conversation. Do this three times, each time trying to hear not the note but the *work* happening
  inside it: the material pushing back against itself. Then apply the same listening to one moment today
  when you feel pulled in two directions—not to resolve it, but to notice what function, what actual output,
  emerges only because both pulls remain live.'
