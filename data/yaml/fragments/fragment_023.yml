sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: The harmony of the world is a harmony of oppositions, as in the case of the bow and of the lyre.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow, lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse the very structures that make harmony audible. Anchor: George T.W. Patrick (1889), fragment 23 (Bywater Greek). Corpus index HFR_P023 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two pulls create the function? Write both pulls without trying to remove either.'
