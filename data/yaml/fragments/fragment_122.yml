resonances:
- citation: The Book of Chuang Tzu — chapter 8
  resonance: 'Both texts refuse the ego''s constructed expectations as the measure of reality: Heraclitus says what awaits after death escapes hope and thought; Chuang Tzu''s true persons do not construct plans as identity. Each denies the private self''s anticipatory framework as access to what actually is.'
  divergence: Heraclitus grounds this in a cosmic measure (logos) that governs all things; Chuang Tzu grounds it in spontaneous alignment with the Way's non-action (wu wei), which has no external standard.
  passage_id: the_book_of_chuang_tzu.ctz_008
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish a structural interdependence between two orders of reality that cannot be collapsed: Heraclitus''s ethical-cosmological turn requires alignment with the measure governing all things (not private hope); Nagarjuna''s ultimate cannot be reached except through the conventional, and vice versa. Each refuses a single-level account.'
  divergence: Heraclitus treats the measure as a unified cosmic principle; Nagarjuna treats the two truths as mutually dependent but ontologically distinct, with neither reducible to the other.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: Isavasya Upanishad — Mantra 17
  resonance: 'Both texts mark death as a dissolution where breath/life returns to a larger principle: Heraclitus''s awaiting after death aligns with the cosmological measure; Isavasya''s breath returns to immortal air. Each treats death not as annihilation but as reintegration into what governs the living.'
  divergence: Heraclitus emphasizes the ethical surprise (what is neither hoped nor thought); Isavasya emphasizes ritual acceptance and the metaphysical continuity of breath into the universal element.
  passage_id: isavasya_upanishad.isa_023
