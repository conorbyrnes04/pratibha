sutra_id: HFR_P122
collection: Heraclitus Fragments
section: wisdom_pearl
title: After death comes
sanskrit: ''
transliteration: ''
translation: 'After death comes

  nothing hoped for

  nor imagined.'
commentary: 'The line turns inquiry inward: character and attention shape destiny.
  Mortality sharpens the call to live deliberately.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
