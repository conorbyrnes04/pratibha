resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts compress a cosmological principle into the continuous flux of a single natural process: Heraclitus sees the sun as perpetually renewed through constant nourishment; the Vijnana Bhairava sees the divine articulated through the ceaseless oscillation of breath (prāṇa and jīva). Each makes transformation itself the fundamental reality.'
  divergence: Heraclitus grounds renewal in material nourishment and observable celestial mechanics; the Vijnana Bhairava locates it in the conscious play (lila) of Śakti as the life-force itself, making transformation a divine self-expression rather than a physical necessity.
  passage_id: vijnana_bhairava.yukti_001
- citation: Patañjali Yoga Sūtras 1.10
  resonance: 'Both texts paradoxically define a state through negation or absence: Heraclitus compresses the sun''s perpetual newness into a single paradoxical claim (always new, yet the same sun); Patañjali defines sleep as ''transformation based on non-existence,'' collapsing a state into its negation. Each uses logical compression to capture an ontological shift.'
  divergence: Heraclitus uses paradox to affirm continuous becoming as reality's nature; Patañjali uses negation to map consciousness states within a framework of yogic transformation, treating non-existence as a specific phenomenological condition rather than a cosmological principle.
  passage_id: patañjali_yoga_sūtras.ys_1_10
