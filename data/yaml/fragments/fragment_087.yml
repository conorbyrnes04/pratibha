title: Aeneas, Gaz.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Aeneas, Gaz. Theophrast. p. 9.
commentary: 'The reference to Aeneas and Theophrast places this fragment in the tradition of those who
  witnessed or recorded Heraclitus''s teaching, yet the actual saying remains obscured—a fitting condition
  for a thinker who claimed that most people sleep through the logos they inhabit. What matters is not
  the lost words but the structure of transmission itself: wisdom arrives fragmented, attributed, second-hand,
  passed through Gaz''s compilation. This mirrors Heraclitus''s own claim that the logos is common (xynos)
  yet each person lives as though possessing private understanding. The fragment''s very incompleteness—its
  appearance here as citation rather than direct utterance—enacts what it likely taught: that truth does
  not reside in the thing said but in the listener''s capacity to recognize the same fire burning in different
  mouths. The teaching survives not as doctrine but as a break, a gap that forces the reader to become
  active, to supply the missing word from their own waking attention. To study this fragment is to study
  the condition of studying fragments—to notice how authority dissolves and responsibility for understanding
  shifts entirely to the one who reads.'
voice_of_siva: ''
abhyasa: 'When you encounter a teaching secondhand—in a book, from another''s mouth, in a paraphrase or
  translation—pause before accepting or rejecting it, and ask aloud: what am I actually hearing, and from
  whom? Speak the name of the intermediary (the translator, the friend, the source) and notice whether
  the teaching changes shape when you restore its actual path to you.'
