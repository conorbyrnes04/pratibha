title: Night-roamers, Magians, bacchanals, revelers in wine, the initiated.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Night-roamers, Magians, bacchanals, revelers in wine, the initiated. CX X.—Seneca, Epist.
  12.
commentary: 'This fragment names five types of nocturnal figures—night-roamers, Magians, bacchanals, wine-revelers,
  the initiated—and by naming them together forces a recognition: they are all awake when the ordinary
  world sleeps, all traversing a shared darkness that the daylight mind treats as private or marginal.
  The fragment''s power lies not in condemning them but in the equality of their wakefulness. A night-roamer
  and a bacchant and an initiate occupy the same *nyx* (night), the same threshold where normal distinctions
  of status or purpose collapse. Heraclitus is not moralizing; he is anatomizing perception itself. The
  daylight person sees these figures as separate categories—criminal, foreign priest, drunkard, celebrant,
  secret-keeper. But the fragment strips away that taxonomy and asks: what do they share? They share the
  condition of being *awake in the dark*, of moving through a world the sleeping majority does not inhabit.
  This is not mysticism but radical attention to what *is*—the night is one night; those in it are one
  kind of being, regardless of their purpose or origin. The teaching is perceptual: learn to see the unity
  beneath the names.'
voice_of_siva: ''
abhyasa: Walk outside after dark without a phone light, moving slowly enough to let your eyes adjust fully.
  Notice what figures or movements you encounter—a delivery driver, a security guard, an insomniac, a
  reveler, a cleaner—and hold them all in a single gaze without sorting them by judgment or purpose. Return
  indoors and sit with the residue of that undifferentiated seeing.
