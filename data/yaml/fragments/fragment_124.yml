resonances:
- citation: 'Vijnana Bhairava — Yukti #2'
  resonance: 'Both texts compress a paradox of consciousness into a single image: Heraclitus names figures who embody simultaneous states (night-roaming yet initiated, drunk yet aware), while Yukti 2 describes śakti revealed precisely at the point where movement ceases—neither entering nor exiting. Each locates knowledge or power in a threshold state that dissolves ordinary categories.'
  divergence: Heraclitus presents the paradox as a cosmological riddle about human types and their hidden knowledge; the Vijnana Bhairava grounds it in prāṇa and spatial centering as a direct yogic technique for realization.
  passage_id: vijnana_bhairava.yukti_002
- citation: Yoginihrdaya — Cakrasaṃketa
  resonance: 'Both texts compress a cosmological act into a single moment of self-recognition: Heraclitus''s ''initiated'' embody a knowledge that comes from witnessing transformation in darkness, while the Yoginihrdaya describes the Supreme Power beholding her own ''flashing-forth'' (sphurattā)—consciousness recognizing itself through spontaneous manifestation. Each locates initiation or realization in an act of self-witnessing.'
  divergence: Heraclitus frames initiation as a human mystery accessible through paradox and night-wandering; the Yoginihrdaya frames it as the cosmic feminine principle's self-luminous act of becoming and beholding.
  passage_id: yoginihrdaya.yh_006
