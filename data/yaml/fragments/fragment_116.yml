resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts posit a single intelligible order that cannot be grasped directly but only through a necessary duality: Heraclitus''s ''one wisdom'' governing apparent plurality mirrors Nagarjuna''s ultimate (paramārtha) that can only be ''pointed out'' through conventional reality (vyavahāra). Each tradition insists the apparent multiplicity is not illusory but the necessary vehicle for understanding the singular principle.'
  divergence: Heraclitus treats the one as an immanent rational principle (logos) structuring the cosmos; Nagarjuna treats the ultimate as emptiness (śūnyatā) that transcends both conventional and ultimate as conceptual categories, making the relationship between levels more radically non-dual.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts locate the governing principle in breath as the fundamental articulation of order: Heraclitus''s ''intelligent will by which all things are governed'' operates through pneuma (breath); the Vijnana Bhairava locates the Supreme Goddess''s constant articulation in the prāṇa-jīva cycle. Each makes breath the primary manifestation of an ordering intelligence.'
  divergence: Heraclitus treats breath as the cosmic principle itself (the logos becoming physical); the Vijnana Bhairava treats breath as the Goddess's expression—a conscious, embodied play (līlā) rather than an impersonal rational order.
  passage_id: vijnana_bhairava.yukti_001
