resonances:
- citation: Astavakra Gita — 8.1 — 8.4
  resonance: 'Both texts identify bondage with craving/desire (vāñchati) and liberation with the cessation
    of that same movement. Heraclitus compresses this into a paradox of passion ''buying'' with life;
    Astavakra makes explicit the causal structure: bondage arises when mind desires or grieves, freedom
    when it neither desires nor grieves.'
  divergence: Heraclitus frames the paradox cosmologically (passion as a force that consumes itself),
    while Astavakra treats it as a psychological-metaphysical principle of consciousness independent of
    external circumstance.
  passage_id: astavakra_gita.asg_sum_08_01_08_04
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: Both texts locate a transformative threshold at the point of breath-tension or pause. Heraclitus's
    paradox of passion 'buying with life' mirrors the yogic principle where the dynamic tension (sanghaṭṭa)
    of prāṇas at breath-termination generates a shift in consciousness—the cost of craving becomes the
    gateway to equality-consciousness.
  divergence: Heraclitus presents this as an ironic law of nature (what passion craves destroys it), while
    Vijnana Bhairava frames it as a deliberate yogic technique to harness that tension for liberation.
  passage_id: vijnana_bhairava.yukti_037
