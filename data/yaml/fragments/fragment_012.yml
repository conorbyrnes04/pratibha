translation: But the Sibyl with raging mouth uttering things solemn, rude and unadorned, reaches with her voice over a thousand years, because of the God.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 12 (Bywater Greek). Corpus index HFR_P012 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
