resonances:
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 4
  resonance: Both texts posit that ultimate truth-bearing utterance or awareness transcends ordinary knowledge and intellection—the Sibyl's voice reaches across time through divine possession, while Plotinus describes awareness of the ultimate Principle as surpassing the multiplicity of knowing itself.
  divergence: Heraclitus grounds transcendent utterance in ecstatic speech (the raging mouth), whereas Plotinus locates it in a presence or contemplative state that explicitly negates discursive knowing.
  passage_id: plotinus_enneads.enn_vi_9_04
- citation: Yoginihrdaya — Cakrasaṃketa
  resonance: 'Both texts compress cosmological generation into a single paradoxical act of self-recognition or self-beholding: the Sibyl''s voice reaches across time through divine agency, and the Supreme Power''s self-beholding (sphurattā) generates the entire cakra—each makes manifestation itself an act of reflexive awareness.'
  divergence: Heraclitus emphasizes the temporal reach and simplicity of utterance, while the Yoginihrdaya emphasizes the spatial and energetic unfolding of divine self-perception through śakti.
  passage_id: yoginihrdaya.yh_006
