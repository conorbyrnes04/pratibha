sutra_id: HFR_P114
collection: Heraclitus Fragments
section: wisdom_pearl
title: As for the Ephesians,
sanskrit: ''
transliteration: ''
translation: 'As for the Ephesians,

  I would have them, youths,

  elders, and all those between,

  go hang themselves, leaving the city

  in the abler hands of children.

  With banishment of Hermodoros

  they say, No man should be

  worthier than average. Thus,

  my fellow citizens declare,

  whoever would seek

  excellence can find it

  elsewhere among others.'
commentary: 'This fragment invites direct contemplation rather than argument: hold
  its paradox quietly and let understanding ripen through experience.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
