resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish a structural interdependence between two orders of reality—Heraclitus''s
    ''single intelligible order within apparent plurality'' and Nagarjuna''s ultimate (paramārtha) that
    cannot be accessed except through the conventional (vyavahāra). Each refuses mystical fusion in favor
    of a rigorous logical relation: the one does not dissolve the many, nor does the ultimate bypass the
    conventional.'
  divergence: Heraclitus grounds this order in a cosmic principle (logos) accessible through rational
    perception of natural flux; Nagarjuna grounds it in the emptiness of intrinsic nature, accessible
    only through dialectical analysis that deconstructs both orders.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both passages locate a fundamental principle—Heraclitus''s ''one'' and the Vijnana Bhairava''s
    Supreme Goddess—not in transcendent abstraction but in the concrete oscillation of a natural process:
    the logos in flux and change, the Goddess in the rhythmic movement of breath (prāṇa and jīva). The
    principle is immanent in its own articulation.'
  divergence: Heraclitus emphasizes the intelligible rational order revealed through sensory observation
    of cosmic fire and strife; the Vijnana Bhairava emphasizes embodied yogic recognition of the divine
    through breath-work as direct phenomenological access.
  passage_id: vijnana_bhairava.yukti_001
