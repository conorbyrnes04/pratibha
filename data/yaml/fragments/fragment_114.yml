sutra_id: HFR_P114
collection: Heraclitus Fragments
section: wisdom_pearl
title: The Ephesians deserve, man for man, to be hung, and the youth to leave the city, inasmuch...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: 'The Ephesians deserve, man for man, to be hung, and the youth to leave the city, inasmuch
  as they have banished Hermodorus, the worthiest man among them, saying: ‘‘ Let no one of us excel, and
  if'
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality.
  To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies
  the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 114 (Bywater
  Greek). Corpus index HFR_P114 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
