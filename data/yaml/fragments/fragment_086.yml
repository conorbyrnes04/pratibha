title: Being born, they will only to live and die, or rather to find rest, and they leave childr...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Being born, they will only to live and die, or rather to find rest, and they leave children who likewise are to die.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 86 (Bywater Greek). Corpus index HFR_P086 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
