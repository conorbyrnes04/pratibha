resonances:
- citation: Plotinus Enneads — Ennead I, Tractate 6, Section 5
  resonance: 'Both texts compress a cosmological or metaphysical claim into an imperative about self-recognition: Heraclitus makes knowing oneself the universal human task that mirrors cosmic order (breath/logos), while Plotinus makes the longing to recognize one''s true self (divine origin) the engine of virtue and liberation from the physical.'
  divergence: Heraclitus grounds self-knowledge in the immanent logos shared by all; Plotinus grounds it in a transcendent divine origin the soul has forgotten and must recover through ascent.
  passage_id: plotinus_enneads.enn_i_6_05
- citation: Astavakra Gita — 8.1 — 8.4
  resonance: 'Both texts use a paradoxical inversion to teach self-mastery: Heraclitus compresses the cosmological principle into the aphorism that knowing oneself is universal law; Astavakra teaches that bondage and liberation hinge on the mind''s stance (desire/sorrow vs. non-desire/non-sorrow), making self-control the pivot of freedom.'
  divergence: Heraclitus treats self-knowledge as alignment with an objective cosmic principle (logos); Astavakra treats liberation as a shift in the mind's internal relationship to phenomena, independent of external order.
  passage_id: astavakra_gita.asg_sum_08_01_08_04
