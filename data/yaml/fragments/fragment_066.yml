sutra_id: HFR_P066
collection: Heraclitus Fragments
section: wisdom_pearl
title: text :—For it seems that by the ancients the bow and life were synonymously called βιός.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: text:—For it seems that by the ancients the bow and life were synonymously called βιός. So
  Heraclitus, the obscure, said, ‘* The name of the bow is life, but its work is death.”’ Etym. magn.
  under word βιός. LX VII.—
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow,
  lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse
  the very structures that make harmony audible. The turn is ethical-cosmological: character is not private
  style but alignment with the measure that governs all things. Mortality intensifies the question — finite
  life must choose whether to hear the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889),
  fragment 66 (Bywater Greek). Corpus index HFR_P066 follows the Diels–Kranz-style numbering used in the
  Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two
  pulls create the function? Write both pulls without trying to remove either.'
