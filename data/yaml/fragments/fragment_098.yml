translation: that the wisest of people compared with God appears an ape in wisdom and in beauty and in all other things? ἱ
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 98 (Bywater Greek). Corpus index HFR_P098 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
