translation: The straight and crooked way of the woolcarders is one and the same.”
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 50 (Bywater Greek). Corpus index HFR_P050 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
