sutra_id: HFR_P041
collection: Heraclitus Fragments
section: Fragment 41
title: Impermanence of All Things
anchor_translation: Into the same river you could not step twice, for other and still
  other waters are flowing. To those who step into the same rivers, other and still
  other waters flow.
sanskrit: 'The key line in Greek script is: ποταμοῦ τοῦ αὐτοῦ οὐκ ἄν ποτε ἐμβῇς δὶς,
  ἀλλ’ ἕτερα καὶ ἕτερα ὕδατα ἐπιρρεῖ.'
transliteration: 'The transliterated Greek with diacritics is: potamoû tou autou ouk
  an pote embēs dis, all’ hetera kai hetera húdata epirreî. Key terms include ποταμοῦ
  (potamoû, river) and ὕδατα (húdata, waters).'
translation: You cannot step into the same river twice, because other and still other
  waters are constantly flowing. For those who step into the same rivers, different
  waters flow each time.
commentary: 'The philosophical claim that all things are in a state of constant flux
  is a fundamental concept in Heraclitus'' philosophy. The counterintuitive move here
  is to challenge our ordinary perception of stability and permanence, instead revealing
  that even seemingly static entities, like a river, are actually in a state of continuous
  change. In the pre-Socratic and Ephesian context, this idea would have been revolutionary,
  as it undermines the traditional understanding of the world as a fixed and unchanging
  place. This concept has existential implications, as it suggests that our experiences,
  relationships, and even our own identities are constantly evolving. By embracing
  this flux, we can cultivate a deeper appreciation for the present moment and develop
  a more nuanced understanding of the world around us. The concept of flux also resonates
  with the idea of the impermanence of all things, which is a central theme in many
  Eastern philosophical traditions.


  Key Terms:


  * **ποταμοῦ (potamoû)** — etymology: from ποταμός (potamós), meaning river -> Heraclitean
  meaning in this fragment: a symbol of constant change and flux -> what default translation
  misses: the connotation of a river as a dynamic and ever-changing entity.

  * **ὕδατα (húdata)** — etymology: from ὕδωρ (húdōr), meaning water -> Heraclitean
  meaning in this fragment: a representation of the constant flow and change -> what
  default translation misses: the emphasis on the dynamic and fluid nature of reality.

  * **Λόγος (Logos)** — although not explicitly mentioned in this fragment, it is
  implicit in the idea of the underlying principle or reason that governs the flux
  and change in the world.


  Cross-Tradition Resonances:


  * **Tao Te Ching, Chapter 27:** structural homology can be seen in the concept of
  the constant flow and change, as expressed in the Taoist idea of the cyclical nature
  of reality. *Divergence:* while Heraclitus focuses on the impermanence of all things,
  the Tao Te Ching emphasizes the interconnectedness and harmony of all things.

  * **Chandogya Upanishad, 6.2.1-3:** structural homology can be seen in the concept
  of the constant flow and change, as expressed in the Upanishadic idea of the ever-changing
  nature of the self. *Divergence:* while Heraclitus focuses on the external world,
  the Chandogya Upanishad explores the inner world of the self.

  * **Dōgen Shōbōgenzō, Genjōkōan:** structural homology can be seen in the concept
  of the impermanence of all things, as expressed in the Zen idea of the fleeting
  nature of reality. *Divergence:* while Heraclitus emphasizes the constant flux,
  Dōgen emphasizes the importance of awakening to the present moment.'
abhyasa: Observe the flow of your breath, noticing how each inhale and exhale is unique
  and never repeated, and reflect on how this impermanence applies to all aspects
  of your life.
