sutra_id: HFR_P067
collection: Heraclitus Fragments
section: wisdom_pearl
title: There awaits men after death what they neither hope nor think.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: There awaits people after death what they neither hope nor think.
commentary: 'The turn is ethical-cosmological: character is not private style but alignment with the measure
  that governs all things. Mortality intensifies the question — finite life must choose whether to hear
  the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889), fragment 67 (Bywater Greek).
  Corpus index HFR_P067 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
