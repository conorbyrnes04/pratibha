sutra_id: HFR_P040
collection: Heraclitus Fragments
section: wisdom_pearl
title: lIt disperses and gathers, it comes and goes.’® Hesiod because he knew [not] day and nigh...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: 'lIt disperses and gathers, it comes and goes.’® Hesiod because he knew [not] day and night,
  for day and night, he says, are one, expressing it somewhat as follows: ‘‘ Hesiod is a teacher of the
  masses,”’ etc. XXX VI.—'
commentary: 'Heraclitus charges Hesiod with ignorance: the poet ''knew not day and night'' because he
  failed to recognize that day and night are *one* (hen). This is not a claim that opposites collapse
  into undifferentiated mush. Rather, Heraclitus identifies a single *logos*—an intelligible order or
  ratio—that holds day and night in necessary tension. They ''disperse and gather'' not as chaos but as
  a unified rhythm: the same sun-fire that illuminates the day withdraws into night, and the withdrawal
  is as lawful as the appearance. To ''know'' day and night as one is to perceive the *structure* that
  makes their alternation intelligible, not to erase their observable difference. Hesiod, by treating
  them as separate domains with separate natures, misses the underlying *tension* (tonos) that binds them.
  The fragment pivots on a paradox: unity is not sameness; it is the coherence of opposites held in dynamic
  relation. The one that ''comes and goes'' is not static being but the perpetual movement *through which*
  being manifests. To grasp this requires abandoning the habit of seeing day and night as independent
  facts and instead witnessing the single fire-principle that generates both through its own rhythm of
  concealment and revelation.'
voice_of_siva: ''
abhyasa: At the moment the light shifts—dawn to morning, noon to afternoon, dusk to dark—pause and name
  aloud what you see leaving and what you see arriving, then speak them as a single word (e.g., 'day-night,'
  'light-shadow,' 'waking-sleeping'). Do this without trying to merge them philosophically; let the single
  utterance hold both as one rhythm, and notice whether the opposition sharpens or dissolves in your mouth.
