transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: This world, the same for all, neither any of
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly:
  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 20 (Bywater
  Greek). Corpus index HFR_P020 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
