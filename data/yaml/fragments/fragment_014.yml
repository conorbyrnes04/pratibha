resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts compress a cosmological principle into the rhythmic movement of breath itself:
    Heraclitus sees breath as the paradoxical unity of opposites (the living fire), while Vijnana Bhairava
    locates the Supreme Goddess''s creative articulation in the dual prāṇa-jīva cycle (exhale-inhale).
    Each makes breath the primary image where cosmic principle becomes perceptible.'
  divergence: Heraclitus treats breath as a metaphysical paradox revealing the nature of flux and unity;
    Vijnana Bhairava treats breath as a yogic technique for recognizing divine consciousness through embodied
    practice.
  passage_id: vijnana_bhairava.yukti_001
- citation: Isavasya Upanishad — Mantra 17
  resonance: 'Both texts use breath as the vehicle for a fundamental transition or return: Heraclitus''s
    aphorism likely concerns breath''s role in the cycle of becoming, while Isavasya Upanishad explicitly
    invokes breath''s return to the immortal element as the dissolution of the individual body into cosmic
    principle.'
  divergence: Heraclitus emphasizes breath as the living principle of continuous flux and paradox; Isavasya
    Upanishad emphasizes breath's ultimate return to transcendence, marking the end of embodied existence.
  passage_id: isavasya_upanishad.isa_023
