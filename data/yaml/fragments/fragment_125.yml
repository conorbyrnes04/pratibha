sutra_id: HFR_P125
collection: Heraclitus Fragments
section: wisdom_pearl
title: For the things which are considered mysteries among men, they celebrate sacrilegiously.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: For the things which are considered mysteries among people, they celebrate sacrilegiously.
commentary: 'Heraclitus names a specific inversion: the sacred things—ta mysteria, the hidden, the things
  requiring initiation and silence—are being handled with *asebeia*, impiety, irreverence. But the cut
  runs deeper. He is not condemning ignorant crowds for profaning what should remain veiled. He is saying
  that the very act of *celebration*—public ritual, collective utterance, the turning-inward-made-outward—corrupts
  what it touches. Mystery requires hiddenness; the moment it enters the festival, the chant, the shared
  gesture, it becomes its opposite. This is not piety defending secrecy. It is an observation about the
  nature of the sacred itself: it cannot survive translation into the common tongue or the common body.
  When people gather to honor what is hidden, they perform its desecration. The fragment does not ask
  you to keep silence or to guard a doctrine. It asks you to see that *every public utterance about the
  inmost is already a violation*—not because the crowd is unworthy, but because the sacred and the celebrated
  are structurally opposed. Heraclitus watches this happen and names it without judgment, as one names
  a law of fire.'
voice_of_siva: ''
abhyasa: Speak aloud something you hold as true or precious—a conviction, a memory, a value—then listen
  to how it sounds in your own ears and in the room. Notice what dies in the speaking, what hardens, what
  becomes false simply by becoming audible. Do not correct or defend it; let the desecration stand as
  information.
