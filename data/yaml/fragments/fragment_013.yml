key_terms:
- term: Logos (λόγος)
  definition: 'Greek: speech, account, ratio, intelligible order. In Heraclitus, the Logos is the pattern
    according to which all things occur — not a private doctrine but the world''s articulation. Patrick''s
    ''Reason'' is a Victorian gloss; we use Logos to preserve the Greek range (cosmic order + intelligible
    speech).'
