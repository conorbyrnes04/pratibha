sutra_id: HFR_P068
collection: Heraclitus Fragments
section: wisdom_pearl
title: To souls it is death to become water, and to water it is death to become earth, but from...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: To souls it is death to become water, and to water it is death to become earth, but from
  earth comes water, and from water, soul.
commentary: 'The turn is ethical-cosmological: character is not private style but alignment with the measure
  that governs all things. Mortality intensifies the question — finite life must choose whether to hear
  the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889), fragment 68 (Bywater Greek).
  Corpus index HFR_P068 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever reactivity appears.
glossary: []
anchor_translation: To souls it is death to become water, and to water it is death to become earth, but
  from earth comes water, and from water, soul.
source_reference: Patrick (1889), frag. 68; corpus HFR_P068
pratibha_translation: To souls it is death to become water, and to water it is death to become earth,
  but from earth comes water, and from water, soul.
key_terms:
- term: psychē (ψυχή)
  definition: 'Soul/breath/life — for Heraclitus often linked to depth of character (ethos) and fate.
    The fragment turns ethics into cosmology: how you live is how you align (or fail) with measure.'
