resonances:
- citation: Plotinus Enneads — Ennead I, Tractate 6, Section 5
  resonance: 'Both texts compress a cosmological or metaphysical claim into an imperative about self-recognition: Heraclitus demands that all people know themselves as the condition for understanding universal order (breath/logos), while Plotinus describes the soul''s longing to recognize and merge with its true divine nature as the path to liberation from external illusion.'
  divergence: Heraclitus grounds self-knowledge in rational mastery and cosmic participation (breath as shared principle), whereas Plotinus grounds it in a vertical ascent from sensory entanglement to transcendent unity with the divine source.
  passage_id: plotinus_enneads.enn_i_6_05
- citation: Astavakra Gita — 8.1 — 8.4
  resonance: 'Both texts use a paradoxical inversion to teach self-mastery: Heraclitus compresses the cosmological principle into the paradox that knowing oneself is universal duty, while Astavakra teaches that bondage and liberation are determined by the mind''s posture toward desire and sorrow—making self-knowledge (cittam) the pivot of freedom.'
  divergence: Heraclitus emphasizes self-control as alignment with universal logos and breath, whereas Astavakra locates liberation in the mind's non-attachment to mental states themselves, a more radical negation of the desiring subject.
  passage_id: astavakra_gita.asg_sum_08_01_08_04
