title: Tzetze’s Chil.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Tzetze’s Chil. 11. 722.
commentary: 'Heraclitus names fire as the arche—not as a substance to be possessed or studied from distance,
  but as the very principle of intelligibility itself. Fire does not stay; it consumes what it illuminates.
  To say ''fire'' is to say: the world reveals itself only through its own undoing. The fragment''s paradox
  cuts deeper than ''everything changes.'' It claims that *intelligibility itself is combustion*—the logos
  that makes sense of things is the same force that dissolves fixed forms. When you perceive, you are
  not observing fire from outside; you are the medium through which fire moves. The old commentary''s
  error was treating this as metaphor. Heraclitus is precise: fire is not *like* change; fire *is* the
  structure of disclosure. To understand this is not to grasp a doctrine but to feel the ground shift
  beneath the act of understanding itself. The teaching is not ''accept flux.'' It is: notice that your
  own clarity—your ability to think at all—depends on a consuming that you cannot arrest.'
voice_of_siva: ''
abhyasa: Light a candle or observe a flame for three minutes without naming what you see. When the urge
  to interpret arises ('it flickers,' 'it's orange,' 'it's beautiful'), pause and notice instead the exact
  moment the flame ceases to be what it just was—the precise edge where one form dissolves into the next.
  After, sit in darkness for two minutes and attend to what remains intelligible without light.
