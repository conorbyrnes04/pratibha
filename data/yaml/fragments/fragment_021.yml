commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation. What looks like destruction is often conversion governed by proportion — a physics of becoming that refuses both chaos and immobility. Anchor: George T.W. Patrick (1889), fragment 21 (Bywater Greek). Corpus index HFR_P021 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
