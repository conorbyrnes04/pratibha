title: Pythagoras, son of Mnesarchus, practised investigation most of all men, and having chosen...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Pythagoras, son of Mnesarchus, practised investigation most of all people, and having chosen
  out these treatises, he made a wisdom of his own—much learning and bad art.
commentary: 'Heraclitus cuts at the root of mere accumulation masquerading as wisdom. Pythagoras—the legendary
  sage—is caught here in the act of *choosing* (ἐκλεξάμενος), assembling treatises into a personal doctrine.
  The sting lies not in investigation itself (ἱστορίη) but in the gap between the labour of inquiry and
  what emerges: *polumathíē kaì kakotéchníē*—much-learning and bad-craft. The phrase is not a contradiction
  but a diagnosis. To gather many accounts, many systems, many authorities into a coherent ''wisdom of
  one''s own'' is already to have committed the error: you have mistaken compilation for understanding,
  the museum of opinions for the living logos. The fragment does not say learning is bad; it says that
  *much* learning, when pressed into the service of a private system, becomes a *bad art*—a false making,
  a technique that obscures rather than clarifies. Heraclitus watches Pythagoras choosing, and in that
  choosing sees the very mechanism by which intelligence becomes obstacle. The irony is sharp: the more
  carefully you select, the more you own your wisdom, the further you drift from what is common and alive.'
voice_of_siva: ''
abhyasa: Collect three strong claims or insights you have gathered from reading or thought over the past
  month—write them down separately. Now attempt to *not* reconcile them into a unified system; instead,
  hold them in active contradiction for three days, speaking or writing from each one without synthesis,
  noticing which one your mind keeps trying to subordinate to the others. That subordination is your bad
  art.
