pratibha_translation: Cold becomes warm, and warm, cold; wet becomes dry, and dry, wet.
key_terms:
- term: harmoniē (ἁρμονίη)
  definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of difference. This is Heraclitus's answer to those who expect peace as sameness.
