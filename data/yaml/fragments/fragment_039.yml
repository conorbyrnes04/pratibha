sutra_id: HFR_P039
collection: Heraclitus Fragments
section: wisdom_pearl
title: Cold becomes warm, and warm, cold ; wet becomes dry, and dry, wet.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Cold becomes warm, and warm, cold; wet becomes dry, and dry, wet.
commentary: 'Heraclitus does not describe a world of chaos but one of reciprocal thresholds. Cold and
  warm do not annihilate each other; they *become* each other—the fragment uses the same verb (γίγνεται,
  *gígnetai*) in both directions, making the motion symmetrical and continuous. The passage is not about
  flux as formless drift but about *metabole*—the precise point where one quality tips into its opposite
  and holds there momentarily before tipping back. This is the structure of sensation itself: the hand
  plunged into water finds neither pure cold nor pure warmth but the unstable boundary where they exchange
  places. Heraclitus is describing not disorder but the hidden measure (*metron*) by which opposites maintain
  their identity *through* their opposition. Wet and dry perform the same reciprocal dance. The fragment''s
  power lies in its refusal of rest: there is no neutral ground, no escape from the threshold. Stability
  emerges not from the absence of opposition but from the constancy of this exchange—the logos that holds
  the reversal in place.'
voice_of_siva: ''
abhyasa: Place one hand in warm water and the other in cold water for two minutes, then plunge both into
  room-temperature water simultaneously and hold still, attending to the contradictory sensation each
  hand reports of the same medium. Repeat three times, and notice whether the boundary between the sensations
  sharpens or dissolves.
