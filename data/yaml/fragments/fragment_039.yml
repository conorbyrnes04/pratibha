sutra_id: HFR_P039
collection: Heraclitus Fragments
section: wisdom_pearl
title: Cold becomes warm, and warm, cold ; wet becomes dry, and dry, wet.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Cold becomes warm, and warm, cold; wet becomes dry, and dry, wet.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow, lyre) to show that tension generates stable function. Peace as mere absence of conflict would collapse the very structures that make harmony audible. Anchor: George T.W. Patrick (1889), fragment 39 (Bywater Greek). Corpus index HFR_P039 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance arises — that resistance is part of the teaching.
modes:
