resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: Both texts locate cosmic or spiritual coherence in perpetual motion—Heraclitus in the kinetic tension that prevents separation, the Vijnana Bhairava in the constant oscillation of prāṇa (exhale/inhale) that articulates the divine. Stasis means dissolution; flow means integrity.
  divergence: Heraclitus frames motion as a physical-cosmological necessity to prevent material decomposition; the Vijnana Bhairava frames breath-motion as the conscious self-articulation of the Supreme Goddess, collapsing the distinction between mechanics and consciousness.
  passage_id: vijnana_bhairava.yukti_001
- citation: Shantideva Bodhicaryavatara — Stillness Before Insight
  resonance: 'Both texts identify a critical threshold where sustained effort (motion/energy) prevents collapse into a degraded state: Heraclitus''s mixture separates without motion; Shantideva''s scattered mind falls into the fangs of afflictions without sustained vīrya. Maintenance requires continuous exertion.'
  divergence: Heraclitus describes a cosmological law of physics; Shantideva describes a psychological-ethical law where energy must be deliberately cultivated through practice to prevent mental fragmentation, making the motion volitional rather than automatic.
  passage_id: shantideva_bodhicaryavatara.bca_08_solitude
