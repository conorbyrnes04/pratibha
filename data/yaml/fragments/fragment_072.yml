sutra_id: HFR_P072
collection: Heraclitus Fragments
section: wisdom_pearl
title: A mixture separates when not kept in motion.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: A mixture separates when not kept in motion.
commentary: 'The fragment does not say ''all things flow'' or ''nothing stays.'' It says mixture—the condition
  of being-together, of elements held in relation—requires motion to persist. The moment motion ceases,
  separation begins. This is not metaphor alone but an observation of the logos itself: what appears unified
  is unified only through continuous activity. Heraclitus does not exempt the soul, the city, or the cosmos
  from this law. The paradox cuts deeper than it first appears. We assume a mixture is a stable state,
  a thing achieved and then kept. But the fragment reveals mixture as a verb, not a noun—an ongoing work.
  The instant you stop stirring, the salt falls. The instant attention lapses, the unified field of perception
  fragments into subject and object, self and world. The teaching is not that separation is bad or motion
  is good, but that the very intelligibility of ''togetherness'' depends on what Heraclitus calls the
  hidden harmony (harmoniē aphanēs)—the active tension that holds opposites in relation. To read this
  fragment is to feel the difference between understanding it as doctrine and recognizing it in the body:
  the moment you stop actively holding your attention, your sense of wholeness dissolves.'
voice_of_siva: ''
abhyasa: While pouring tea or water, watch the stream without naming it—follow the exact boundary where
  liquid stays coherent and where it begins to scatter on impact, noticing the threshold where motion
  alone determines whether the mixture holds or breaks apart; repeat this three times over three days,
  each time starting the pour at a different height, and mark in a single word what changes in your seeing
  when you vary only the speed and distance.
