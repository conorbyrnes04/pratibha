title: Asses would choose stubble rather than gold.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Asses would choose stubble rather than gold.
commentary: 'The fragment arrests us not through moral judgment but through a collision of value-scales.
  An ass—creature of appetite and necessity—encounters two objects: stubble (what sustains the body, what
  is already at hand, what requires no interpretation) and gold (what humans have agreed to call precious,
  what demands belief in absence, what cannot be eaten). The ass chooses stubble. Heraclitus does not
  mock the ass. He suspends us in the moment of that choice and asks: what does the ass know that the
  gold-seeker has forgotten? The teaching is not ''be like an ass'' but rather: notice that value is not
  intrinsic to the object but emerges from the body''s actual condition and need. Gold is gold only for
  a creature whose hunger has been abstracted, whose survival no longer depends on what the mouth can
  use. The fragment does not separate wisdom from appetite—it suggests that true perception requires returning
  to what the body already recognizes. To read this is to feel the pull of both objects and to notice
  which one your own organism, stripped of social noise, would actually reach for in the dark.'
voice_of_siva: ''
abhyasa: 'Walk through a space where you normally move with purpose (home, workplace, street) and pause
  before three ordinary objects you typically ignore or pass through—a doorframe, a worn tool, a patch
  of ground. For each, ask without answering: what would I need to become in order to want this instead
  of what I''m chasing? Notice the quality of the question itself; do not resolve it into an answer.'
