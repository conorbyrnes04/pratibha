resonances:
- citation: Tao Te Ching — The Veiled Path of Virtue
  resonance: 'Both texts use a paradoxical inversion of value-hierarchy to reveal truth: the sage''s emptiness (being a vessel) mirrors the ass''s indifference to gold, each exposing how conventional worth obscures natural alignment with what is.'
  divergence: Heraclitus embeds the inversion in sensory appetite to challenge human judgment; the Tao Te Ching frames it as deliberate spiritual posture—receptivity as method rather than naive preference.
  passage_id: tao_te_ching.ttc_md_031
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
  resonance: 'Both compress a cosmological insight into a single perceptual move: Heraclitus''s ass-and-gold reveals the illusion of separate valuations; the Chāndogya''s instruction reveals the illusion of separate things—each collapses apparent multiplicity into underlying unity.'
  divergence: Heraclitus uses sensory preference as the vehicle for exposing illusion; the Upanishad uses meditative instruction to transcend the perceptible toward the imperceptible One.
  passage_id: chāndogya_upaniṣad.chu_vi_01
