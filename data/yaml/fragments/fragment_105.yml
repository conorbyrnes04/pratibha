resonances:
- citation: Astavakra Gita — 8.1 — 8.4
  resonance: 'Both texts identify a paradoxical binding mechanism: Heraclitus shows passion purchasing
    its own satisfaction at the cost of life-force; Astavakra identifies bondage as the mind''s craving
    and sorrow, liberation as the cessation of both. Each locates unfreedom in the structure of desire
    itself, not in external constraint.'
  divergence: Heraclitus frames this as a cosmological law of exchange (breath/life spent); Astavakra
    frames it as a reversible mental state amenable to direct recognition and release.
  passage_id: astavakra_gita.asg_sum_08_01_08_04
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts compress a paradox of vital expenditure into transformative knowledge: Heraclitus
    shows life bought by passion''s craving; Vijnana Bhairava #37 shows equality-consciousness arising
    precisely at the termination-point of breath-tension, where the prāṇas'' dynamic opposition reaches
    its limit. Each locates insight at the threshold where vital force reaches its extreme.'
  divergence: Heraclitus treats this as an inescapable law of nature; Vijnana Bhairava treats it as a
    deliberate yogic technique for accessing non-dual awareness.
  passage_id: vijnana_bhairava.yukti_037
