title: And to these images they pray, as if one should prattle with the houses knowing nothing o...
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: And to these images they pray, as if one should prattle with the houses knowing nothing of gods or heroes, who they are.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 126 (Bywater Greek). Corpus index HFR_P126 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
