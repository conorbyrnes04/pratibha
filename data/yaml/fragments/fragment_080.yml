resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts locate self-knowledge in the direct observation of a single, continuous principle:
    Heraclitus finds the intelligible order through inquiry into the one; the Vijnana Bhairava locates
    supreme consciousness in the constant articulation of prāṇa as the life-giving flow. Each treats this
    principle as self-revealing rather than externally taught.'
  divergence: Heraclitus grounds knowledge in rational inquiry into a cosmic logos; the Vijnana Bhairava
    grounds it in embodied breath-awareness as the goddess's manifestation, making the body itself the
    text of recognition.
  passage_id: vijnana_bhairava.yukti_001
- citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
  resonance: Both texts assert that the ultimate principle cannot be grasped through conventional means
    of knowing (sensory, relational, or positional). Heraclitus's 'one' resists ordinary plurality; Svetasvatara's
    'Him' resists spatial or relational capture—each demands a shift in the mode of inquiry itself.
  divergence: Heraclitus emphasizes the intelligible order discoverable through rational self-inquiry;
    Svetasvatara emphasizes the transcendence of the principle beyond all conceptual frameworks, pointing
    toward a knowing that exceeds intellectual grasp.
  passage_id: svetasvatara_upanishad.svu_012
