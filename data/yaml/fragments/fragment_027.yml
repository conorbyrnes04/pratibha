sutra_id: HFR_P027
collection: Heraclitus Fragments
section: wisdom_pearl
title: Fire coming upon all things, will sift and seize them.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Fire coming upon all things, will sift and seize them. changed by the divine Reason which
  rules the universe, through air into moisture, which is as it were the seed of cosmic arrangement, and
  which he calls sea; and from this again arise the earth and the heavens and all they contain. And how
  again they are restered and ignited, he shows plainly as follows, ‘‘ The sea is poured out,’’ ete.
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation.
  What looks like destruction is often conversion governed by proportion — a physics of becoming that
  refuses both chaos and immobility. The ''one'' is not mystical fusion but the single intelligible order
  within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet
  Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889),
  fragment 27 (Bywater Greek). Corpus index HFR_P027 follows the Diels–Kranz-style numbering used in the
  Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what
  experience it actually rests on. Can you hear the claim, not only think it?
