sutra_id: HFR_P027
collection: Heraclitus Fragments
section: wisdom_pearl
title: Fire coming upon all things, will sift and seize them.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: Fire coming upon all things, will sift and seize them. changed by the divine Reason which
  rules the universe, through air into moisture, which is as it were the seed of cosmic arrangement, and
  which he calls sea; and from this again arise the earth and the heavens and all they contain. And how
  again they are restered and ignited, he shows plainly as follows, ‘‘ The sea is poured out,’’ ete.
commentary: 'Fire here is not mere element but *sifter*—the agent that separates, tests, converts. The
  fragment''s own motion is crucial: fire comes *upon* all things (not from within them), seizes them,
  and through the mediating work of air transforms them into moisture, which Heraclitus names as the *seed*
  of cosmic order (kosmos). This is not random combustion but measured passage: fire does not destroy
  the world''s rationality (logos) but enacts it. The sequence fire→air→moisture→earth/heaven names no
  linear decay but a reversible circuit. What the old commentary calls ''measured transformation'' misses
  the active verb: fire *sifts*—it discriminates, it proves what holds and what disperses. The divine
  Reason (logos) does not stand apart from this burning; it *rules* through the burning itself. The fragment
  refuses the comfort of stable substance: even the sea (that seeming permanence, that source) is ''poured
  out''—it too enters the circuit. To read this is to feel the cosmos not as a thing but as a continuous
  trial by fire, where nothing escapes the test and nothing that passes it remains unchanged.'
voice_of_siva: ''
abhyasa: 'Watch a single object—a cup, a stone, a leaf—in direct sunlight for five minutes without naming
  it. Notice how light exposes its surface, cracks, dust, the grain of its making. When you catch yourself
  thinking ''this is solid'' or ''this is permanent,'' let that thought burn away in the simple fact of
  its appearing and changing under the eye. End by asking: what in me resists being sifted this way?'
