resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts posit a single intelligible order that cannot be grasped directly but only through
    a mediating structure: Heraclitus''s ''intelligent will'' governs apparent plurality through a unified
    logos; Nagarjuna''s ultimate can only be ''pointed out'' through conventional reality, not bypassed.'
  divergence: Heraclitus treats the one as an immanent rational principle organizing the cosmos; Nagarjuna
    treats the two truths as epistemologically interdependent but ontologically empty, requiring neither
    a governing intelligence nor a cosmos.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both identify a governing principle that operates through dynamic tension or oscillation:
    Heraclitus''s logos governs ''all things'' through an intelligible order; the Vijnana Bhairava yukti
    locates consciousness-arising in the dynamic tension (sanghaṭṭa) between opposing prāṇas at the breath-pause.'
  divergence: Heraclitus posits a static intelligible order underlying flux; the Vijnana Bhairava locates
    the principle in the rhythmic pause itself—a non-dual recognition arising from embodied oscillation,
    not rational comprehension.
  passage_id: vijnana_bhairava.yukti_037
