translation: There is one wisdom, to understand the intelligent will by which all things are governed through 8.11.5
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 19 (Bywater Greek). Corpus index HFR_P019 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
