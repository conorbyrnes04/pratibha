anchor_translation: To this universal Reason which I unfold, although it always exists, men make themselves
  insensible, both before they have heard it and when they have heard it for the first time. For notwithstanding
  that all things happen according to this Reason, men act as though they had never had any experience
  in regard to it when they attempt such words and works as I am now relating, describing each thing according
  to its nature and explaining how it is ordered. they do when awake as they are forgetful of what they
  do when asleep.
pratibha_translation: To this the Logos which I unfold, although it always exists, people make themselves
  insensible, both before they have heard it and when they have heard it for the first time. For even
  though that all things happen according to this Logos, people act as though they had never had any experience
  in regard to it when they attempt such words and works as I am now relating, describing each thing according
  to its nature and explaining how it is ordered. they do when awake as they are forgetful of what they
  do when asleep.
source_reference: Patrick (1889), frag. 1; corpus HFR_P001
key_terms:
- term: Logos (λόγος)
  definition: 'Greek: speech, account, ratio, intelligible order. In Heraclitus, the Logos is the pattern
    according to which all things occur — not a private doctrine but the world''s articulation. Patrick''s
    ''Reason'' is a Victorian gloss; we use Logos to preserve the Greek range (cosmic order + intelligible
    speech).'
resonances:
- citation: Gospel of John 1:1
  resonance: Both texts treat Logos as an ordering principle that precedes and governs what becomes manifest.
  divergence: John personalizes Logos christologically; Heraclitus keeps it cosmological and immanent
    in process.
- citation: Plotinus, Enneads V.1.3
  resonance: Intellect and intelligible order are 'heard' before they are argued — contemplative attunement
    precedes proof.
  divergence: Plotinus ascends to a transcendent One; Heraclitus stays with the tension of becoming.
