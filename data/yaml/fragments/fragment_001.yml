sutra_id: HFR_P001
collection: Heraclitus Fragments
section: wisdom_pearl
title: The Word proves
sanskrit: ''
transliteration: ''
translation: 'The Word proves

  those first hearing it

  as numb to understanding

  as the ones who have not heard.

  Yet all things follow from the Word.

  Some, blundering

  with what I set before you,

  try in vain with empty talk

  to separate the essences of things

  and say how each thing truly is.

  And all the rest make no attempt.

  They no more see

  how they behave broad waking

  than remember clearly

  what they did asleep.'
commentary: 'The fragment points to a wisdom that is heard rather than invented: reality
  has an intelligible order, and our task is to align attention with it.'
voice_of_siva: ''
abhyasa: Read this fragment three times slowly. Pause in silence for one minute and
  note one direct insight it reveals.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Hold this fragment in awareness through the day; return to it whenever
    reactivity appears.
