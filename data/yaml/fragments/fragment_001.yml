sutra_id: HFR_P001
collection: Heraclitus Fragments
section: wisdom_pearl
title: To this the Logos which I unfold, although it always exists, people make themselves insens
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: To this the Logos which I unfold, although it always exists, people make themselves insensible,
  both before they have heard it and when they have heard it for the first time. For even though that
  all things happen according to this Logos, people act as though they had never had any experience in
  regard to it when they attempt such words and works as I am now relating, describing each thing according
  to its nature and explaining how it is ordered. they do when awake as they are forgetful of what they
  do when asleep.
commentary: 'Heraclitus insists that wisdom is auditory before it is argumentative: the Logos is already
  at work in how things happen, yet people live as if they had no prior encounter with it. The complaint
  is not elitism but phenomenology — most consciousness is forgetful, whether in sleep or in ''waking''
  busyness. The ''one'' is not mystical fusion but the single intelligible order within apparent plurality.
  To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies
  the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 1 (Bywater
  Greek). Corpus index HFR_P001 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what
  experience it actually rests on. Can you hear the claim, not only think it?
