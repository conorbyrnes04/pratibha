sutra_id: HFR_P088
collection: Heraclitus Fragments
section: wisdom_pearl
title: ed.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: ed. Bonn. Thirty is the most natural number, for it bears the same relation to tens as three to units. Then again it is the monthly cycle, and is composed of the four numbers 1, 4, 9, 16, which are the squares of the units in order. Not without reason, therefore, does Heraclitus call the month a generation.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 88 (Bywater Greek). Corpus index HFR_P088 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
voice_of_siva: ''
abhyasa: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what experience it actually rests on. Can you hear the claim, not only think it?
