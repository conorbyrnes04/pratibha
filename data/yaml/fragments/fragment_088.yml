resonances:
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 7
  resonance: 'Both texts compress a paradox of presence-and-absence into a single move: what is always already present (Unity for Plotinus, the natural order for Heraclitus) remains imperceptible precisely because of our habitual orientation away from it. The remedy is a reorientation of awareness, not acquisition of new knowledge.'
  divergence: Plotinus frames this as a mystical inversion requiring transcendence of intellection; Heraclitus embeds it in the flux of becoming itself, treating imperceptibility as structural to the logos rather than a veil obscuring it.
  passage_id: plotinus_enneads.enn_vi_9_07
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
  resonance: 'Both texts posit that genuine knowledge operates through a paradoxical inversion: understanding the imperceptible (the inaudible, the unknowable) requires recognizing an underlying unity or principle that dissolves the distinction between knower and known. The instruction itself is not additive but revelatory.'
  divergence: The Upaniṣad grounds this unity in Brahman as non-dual substance; Heraclitus grounds it in the dynamic logos as perpetual transformation, making unity a process rather than an essence.
  passage_id: chāndogya_upaniṣad.chu_vi_01
- citation: Tao Te Ching — Govern by Not-Governing
  resonance: 'Both compress a cosmological principle into a paradoxical image: governing through non-action (wú shì) and the logos-as-natural-order both work by withdrawing deliberate intervention and allowing what is already operative to manifest. Simplicity and naturalness are not passive but supremely effective.'
  divergence: The Tao Te Ching treats non-action as a political and metaphysical strategy; Heraclitus treats the logos as an ontological constant that awareness must align with, not a technique to be deployed.
  passage_id: tao_te_ching.ttc_md_012
