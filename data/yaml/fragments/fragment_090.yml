sutra_id: HFR_P090
collection: Heraclitus Fragments
section: Fragment 90
title: The Paradox of Identity and Change
anchor_translation: Into the same river we both step and do not step. We both are
  and are not.
sanskrit: 'The key line is based on the Greek script: στοῦ ἑαυτοῦ ποταμοῦ οὔτε ἐμβαίνεις
  οὔτε μὴ ἐμβαίνεις (stou heautou potamou oute embaineis oute mē embaineis).'
transliteration: 'The transliterated Greek with diacritics is: stoû heautoû potamoû
  oúte embaineis oúte mḗ embaineis. Key terms include ποταμοῦ (potamou, river) and
  ἐμβαίνεις (embaineis, step into).'
translation: We step and do not step into the same river. We both exist and do not
  exist.
commentary: 'The philosophical claim here is that identity and change are intertwined,
  making it impossible to pinpoint a fixed state. Heraclitus makes the counterintuitive
  move of asserting that we can both step and not step into the same river, highlighting
  the dynamic nature of reality. In the pre-Socratic and Ephesian context, this idea
  challenges the traditional notion of a static, essential self. This concept has
  existential implications, as it suggests that our understanding of ourselves and
  the world is always in flux. By embracing this paradox, we can cultivate a deeper
  appreciation for the impermanence of all things and the interconnectedness of opposites.
  The concept of Logos [Λόγος] is implicit in this fragment, as it underscores the
  idea that the underlying principle of the universe is one of dynamic harmony and
  balance.


  Key Terms:


  * **ποταμοῦ (potamou)** — etymology: river -> Heraclitean meaning: symbol of constant
  change -> what default translation misses: the river as a metaphor for the fluidity
  of reality.

  * **ἐμβαίνεις (embaineis)** — etymology: to step into -> Heraclitean meaning: to
  engage with or participate in -> what default translation misses: the idea that
  our actions are part of the dynamic process of change.

  * **Λόγος (Logos)** — etymology: reason, word -> Heraclitean meaning: the underlying
  principle of the universe -> what default translation misses: the concept of Logos
  as a dynamic, harmonizing force.


  Cross-Tradition Resonances:


  * **Tao Te Ching, Chapter 27:** structural homology: the idea that "the name that
  can be named is not the eternal name" reflects the Heraclitean notion that our understanding
  of reality is always in flux. *Divergence:* while the Tao Te Ching emphasizes the
  importance of embracing the unknown, Heraclitus focuses on the dynamic interplay
  between opposites.

  * **Plotinus, Enneads, III.7.11:** structural homology: the concept of the "eternal
  now" resonates with Heraclitus'' idea that we both step and do not step into the
  same river. *Divergence:* Plotinus'' emphasis on the timeless nature of the eternal
  now differs from Heraclitus'' focus on the dynamic, ever-changing nature of reality.'
abhyasa: As you walk along a river or engage with any dynamic system, notice the ways
  in which you are both part of and separate from the flow of change, and allow this
  paradox to inform your understanding of the interconnectedness of all things.
