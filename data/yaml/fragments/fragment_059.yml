resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts establish a non-reductive unity: Heraclitus holds that ''all comes one'' through
    an intelligible order that preserves apparent plurality (whole/part, agreement/disagreement), while
    Nagarjuna insists the ultimate and conventional are inseparable—neither collapses into the other,
    yet neither stands alone. Each tradition refuses mystical fusion in favor of a structural interdependence.'
  divergence: Heraclitus grounds unity in a cosmic logos accessible through rational contemplation of
    natural flux; Nagarjuna grounds it in the logical interdependence of conceptual frameworks (conventional
    and ultimate) as a path to liberation.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts use breath as the structural model for how unity manifests through polar opposition:
    Heraclitus''s ''accordant and discordant'' find their living analogue in the Vijnana Bhairava''s prāṇa
    (exhale/ascent) and jīva (inhale/descent)—opposing movements that constitute a single intelligible
    flow rather than fragmentation.'
  divergence: Heraclitus treats the polar structure as ontologically fundamental to all reality; the Vijnana
    Bhairava treats breath-polarity as a yogic technique for recognizing the Goddess's continuous articulation,
    emphasizing embodied practice over metaphysical principle.
  passage_id: vijnana_bhairava.yukti_001
