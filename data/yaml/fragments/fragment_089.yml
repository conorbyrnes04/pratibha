title: In thirty years aman may become a grandfather.
sanskrit: ''
transliteration: '*(Greek original not in corpus; see Patrick/Bywater.)*'
translation: In thirty years aman may become a grandfather.
commentary: 'This fragment collapses three orders of time into a single measure: the biological span (thirty
  years), the genealogical leap (man to grandfather), and the implicit cosmological rhythm beneath both.
  Heraclitus does not state ''time passes'' or ''all things age''—he names a specific threshold where
  a man becomes *other* while remaining himself, where continuity and rupture occupy the same body. The
  fragment trains the eye to see that thirty years is not a neutral duration but a *generative interval*,
  a time-knot where the same flesh that was young becomes the vessel of ancestry. Notice: he does not
  say ''a man ages into a grandfather'' but ''may become''—the contingency is crucial. Death, infertility,
  accident, discontinuity all press against this possibility. Yet the fragment''s very utterance assumes
  the listener knows this threshold intimately, has witnessed it, carries it forward. The teaching is
  not metaphorical. It asks: what *is* the thirty-year rhythm in your own body, your own house? What generation-shift
  are you already inside, whether as the man or as the one who will inherit his name?'
voice_of_siva: ''
abhyasa: 'Mark on a calendar or in a notebook the date thirty years from today, then write the name or
  initials of someone you know who was born thirty years ago—someone now old enough to have grandchildren.
  Over the next week, each time you pass that mark or name, pause and feel the weight of that interval
  in your chest: not as abstraction but as the actual span between your current hands and the hands of
  someone not yet born who will carry forward what you do now.'
