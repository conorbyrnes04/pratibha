resonances:
- citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
  resonance: 'Both texts compress a paradox of interdependence into a single claim: Heraclitus fuses law and walls as mutually constitutive (the people defend law *as* they defend walls), while Nagarjuna fuses conventional and ultimate as mutually dependent (the ultimate cannot be reached without leaning on convention). Each refuses to separate two orders that appear distinct.'
  divergence: Heraclitus grounds this paradox in political-cosmic necessity and breath-like flow; Nagarjuna grounds it in logical non-duality and the two truths doctrine, making interdependence a metaphysical principle rather than a cosmological image.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts locate a transformative threshold at the point of tension or pause: Heraclitus compresses cosmological law into the defended boundary (walls as breath-like tension), while Vijnana Bhairava Yukti 37 locates equality-consciousness at the dynamic tension between the two prāṇas at the breath-pause. Each makes the liminal point of strain the site of realization.'
  divergence: Heraclitus treats the defended boundary as political necessity and cosmic principle; the Vijnana Bhairava treats the breath-pause as a yogic technique for accessing non-dual consciousness, making the threshold a method rather than a law.
  passage_id: vijnana_bhairava.yukti_037
