abhyasa: Sit in stillness for ten minutes, breathing slowly and mindfully. As you inhale, imagine the breath becoming supple and childlike; as you exhale, visualize any thoughts dissolving like impurities. This simple somatic exercise cultivates the effortless harmony described in the chapter.
