sutra_id: TTC_MD_080
collection: Tao Te Ching
section: chapter_section
title: The Quiet Sovereign
sanskrit: '小國寡民。

  使有什伯之器而不用；

  使民重死而不遠徙。

  雖有舟輿，無所乘之，雖有甲兵，無所陳之。

  使民復結繩而用之，甘其食，美其服，安其居，樂其俗。

  鄰國相望，雞犬之聲相聞，民至老死，不相往來。'
transliteration: ''
translation: 'In a little state with a small population, I would so order it, that, though there were individuals with the abilities of ten or a hundred men, there should be no employment of them; I would make the people, while looking on death as a grievous thing, yet not remove elsewhere (to avoid it).


  Though they had boats and carriages, they should have no occasion to ride in them; though they had buff coats and sharp weapons, they should have no occasion to don or use them.


  I would make the people return to the use of knotted cords (instead of the written characters).


  They should think their (coarse) food sweet; their (plain) clothes beautiful; their (poor) dwellings places of rest; and their common (simple) ways sources of enjoyment.


  There should be a neighbouring state within sight, and the voices of the fowls and dogs should be heard all the Way [*dào* 道] from it to us, but I would make the people to old age, even to death, not have any intercourse with it.'
commentary: 'This chapter asserts that the truest virtue of a ruler is to create a society where material excess and conflict are absent, allowing people to find contentment in simplicity. The contested move is the deliberate suppression of advanced technology and military readiness—an act that, while seemingly regressive, is presented as a means to prevent violence and foster inner harmony. By removing the temptation to wield power, the ruler cultivates a populace that values the present moment over ambition. The text invites readers to reconsider the relationship between scarcity and virtue, suggesting that true strength lies in restraint rather than accumulation.


  Key Terms:


  **器 (qì)** — tool, instrument -> Daoist sense: the means of action; translation stakes: the ruler’s control over instruments of power

  **绳 (shéng)** — cord, rope -> Daoist sense: simplicity, return to basics; translation stakes: symbol of unadorned life

  **寡民 (guǎmín)** — few people -> Daoist sense: small community; translation stakes: scale of governance


  Cross-Tradition Resonances:


  **Laozi, chapter 2 (the uncarved block):** Both emphasize the virtue of simplicity and non-action *Divergence:* Chapter 80 actively suppresses technology, whereas chapter 2 advocates spontaneous naturalness

  **Heraclitus, "No man ever steps in the same river twice":** Both highlight the fluidity of existence *Divergence:* Heraclitus celebrates change; this chapter seeks stability through restraint'
voice_of_siva: ''
abhyasa: Stand in a quiet place, close your eyes, and breathe slowly. Notice each inhale and exhale, letting thoughts of ambition or fear drift away. Commit to living one day at a time, valuing the simple moments that sustain you.
