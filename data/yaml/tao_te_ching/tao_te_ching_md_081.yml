sutra_id: TTC_MD_081
collection: Tao Te Ching
section: chapter_section
title: The Quiet Path of the Sage
sanskrit: '信言不美，美言不信。

  善者不辯，辯者不善。

  知者不博，博者不知。

  聖人不積，既以為人己愈有，既以與人己愈多。

  天之道，利而不害；

  聖人之道，為而不爭。'
transliteration: ''
translation: '1. Sincere words are not beautiful; beautiful words are not sincere.
  The skilled do not argue; the arguer is not skilled. The knowing are not extensive;
  the extensive are not knowing. 2. The sage does not accumulate for himself; the
  more he gives to others, the more he possesses of his own; the more he gives, the
  more he has. 3. The Way of Heaven is sharp yet injures none; the Way of the sage
  is action yet not striving. (dào, wúwéi, dé, zìrán are kept in brackets with the
  original Chinese characters on first appearance: 道, 無爲, 德, 自然)'
commentary: 'This chapter crystallizes the paradoxical nature of Taoist practice:
  the more one gives, the more one gains; the more one speaks, the less one is heard.
  The contested move is the claim that the sage’s accumulation is *not* for self‑interest
  but for the benefit of all—an inversion of conventional moral economy. By refusing
  to accumulate, the sage demonstrates that true wealth is measured in generosity,
  not hoarding. The text also contrasts the Tao of Heaven—sharp yet harmless—with
  the sage’s way, which acts without force, underscoring the principle of wúwéi (non‑action)
  as active harmony.


  Key Terms:


  **dào 道** — the ultimate principle of reality; the source of all being -> "Way"
  in English

  **wúwéi 無爲** — effortless action; acting without force or intention -> "non‑action"

  **dé 德** — inner virtue that flows from aligning with the Tao -> "virtue"

  **zìrán 自然** — naturalness; the spontaneous order of the universe -> "naturalness"


  Cross-Tradition Resonances:


  **Heraclitus, "On the Unity of Opposites":** both emphasize that apparent contradictions
  are complementary *Divergence:* Heraclitus frames change as constant, while Tao
  Te Ching frames harmony as stillness

  **Confucius, Analects 2.1:** both value sincerity over rhetoric *Divergence:* Confucius
  stresses social order, Tao Te Ching stresses natural order

  **Buddha, Dhammapada 1.5:** both warn against attachment to words and possessions
  *Divergence:* Buddha focuses on mental detachment, Tao Te Ching on external generosity'
voice_of_siva: ''
abhyasa: 'Stand barefoot on the earth for five minutes, feeling the ground beneath
  you. As you breathe, silently repeat: "I give, I receive, I am." Let each breath
  be an act of generosity toward yourself and the world.'
