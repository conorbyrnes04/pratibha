sutra_id: TTC_MD_049
collection: Tao Te Ching
section: chapter_section
title: The Tao’s Generative Cycle
sanskrit: '道生一，一生二，二生三，三生萬物。

  萬物負陰而抱陽，沖氣以為和。

  人之所惡，唯孤、寡、不穀，而王公以為稱。

  故物或損之而益，或益之而損。

  人之所教，我亦教之。

  強梁者不得其死，吾將以為教父。'
transliteration: ''
translation: The [道] (道 dào) creates the [一] (一 yī) One; the One creates the [二] (二
  èr) Two; the Two creates the [三] (三 sān) Three; the Three creates all things. All
  things carry the [陰] (陰 yīn) darkness within them and embrace the [陽] (陽 yáng) brightness,
  and in the mingling of these forces the breath of [空] (空 kōng) emptiness brings
  harmony. What people dislike are those who are lonely, who lack virtue, who are
  like a carriage without a driver; yet kings and princes call themselves by these
  names. Thus some things increase by being diminished, and some decrease by being
  increased. I teach the same as others do. The violent and the strong do not meet
  their natural death; I will make this the basis of my teaching.
commentary: 'This chapter asserts that the Tao’s creative process is a cycle of emergence
  and dissolution, a theme that echoes throughout the text. The contested move is
  the claim that "the violent and strong do not die their natural death." It challenges
  the conventional belief that power inevitably leads to downfall, suggesting instead
  that true strength aligns with the Tao’s natural order and thus resists premature
  demise. The paradox of increase through loss and loss through gain illustrates the
  Taoist principle of wúwéi—effortless action—where apparent contradictions are reconciled
  by the underlying harmony of opposites.


  Key Terms:


  **道 dào (道)** — the ultimate principle, the source of all existence -> the generative
  and sustaining force -> "the Tao"

  **陰 yīn (陰)** — the dark, passive principle, the hidden aspect of reality -> the
  substrate of all things -> "the darkness"

  **陽 yáng (陽)** — the bright, active principle, the manifest aspect of reality ->
  the expression of all things -> "the brightness"

  **空 kōng (空)** — emptiness, the breath that harmonizes opposites -> the subtle space
  of potential -> "the emptiness"


  Cross-Tradition Resonances:


  **chapter 1 (The Tao is the source of all things):** Both chapters emphasize the
  Tao as the origin of all phenomena. *Divergence:* Chapter 1 speaks of the Tao as
  unknowable and beyond description, while chapter 42 explicitly describes its generative
  sequence.

  **chapter 49 (The Tao is the source of all things):** Both chapters present the
  Tao as the ultimate principle. *Divergence:* Chapter 49 focuses on the Tao’s ineffability,
  whereas chapter 42 details its dynamic process of creation.'
voice_of_siva: ''
abhyasa: Stand in a quiet space, breathe deeply, and observe how each inhalation brings
  in new energy while each exhalation releases tension. Notice how the act of letting
  go (diminishing) can create space for new growth, embodying the Taoist principle
  that loss can be a source of gain.
