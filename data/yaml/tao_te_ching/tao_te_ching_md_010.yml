sutra_id: TTC_MD_010
collection: Tao Te Ching
section: chapter_section
title: The Soft Enters Where Nothing Can
sanskrit: 天下之至柔，馳騁天下之至堅。無有入無間。吾是以知無為之有益。不言之教，無為之益，天下希及之。
transliteration: '*(Chinese text.)*'
translation: 'The softest under heaven runs through the hardest under heaven.

  What has no fixed being [*wú yǒu* 無有] enters where there is no gap [*wú jiàn* 無間].


  Therefore I know the benefit of *wúwéi*.

  Teaching without words, the benefit of non-action —

  under heaven, few attain it.'
commentary: 'chapter 43 (the soft enters where nothing can) compresses chapter 78''s
  water-and-rock thesis into metaphysical language: the soft does not break the hard
  head-on; it enters where rigidity has no room to receive. *Wú yǒu* — "without fixed
  being" — names water, breath, attention: what adapts shape enters where structure
  cannot admit force.


  The closing lament (*xī jí* 希及) matches chapter 78 (water overcomes hardness; true
  words seem backward): insight is common, embodiment rare. Wordless teaching is not
  silence as technique but transmission that does not clog the learner with fixed
  names — parallel to chapter 2''s "wordless instruction."


  Key Terms:


  **wú yǒu 無有** — without fixed being — subtle existence that penetrates because it
  does not insist on form.


  **wú jiàn 無間** — no gap, no crevice — rigidity''s hidden openings only the soft
  can use.


  **bù yán zhī jiào 不言之教** — teaching without words — pedagogical correlate of *wúwéi*.


  Cross-Tradition Resonances:


  **Vijñāna Bhairava, pre-phonemic dissolution:** entering before articulation. *Divergence:*
  initiatory method vs aphoristic observation.


  **Zhuangzi butterfly dream (ch.2):** identity without fixed being crosses boundaries
  of self/other. *Divergence:* epistemic parable vs physical penetration image.


  **Jesus, "narrow gate" (Matthew 7:13):** difficult entry — inverted: here the soft
  enters because it does not carry bulk.'
voice_of_siva: ''
abhyasa: In a tense conversation, stop adding arguments (hard force). Ask one open
  question and listen without preparing rebuttal. Notice whether the situation opens
  a gap that pressure had sealed.
