sutra_id: TTC_MD_017
collection: Tao Te Ching
section: chapter_section
title: The Empty Flow of the Tao
sanskrit: '道沖而用之或不盈。

  淵兮似萬物之宗。

  挫其銳，解其紛，和其光，同其塵。

  湛兮似或存。

  吾不知誰之子，象帝之先。'
transliteration: ''
translation: The Tao is [dào] (道) a great emptiness, a vast reservoir that, when used,
  never [wúwéi] (無為) overflows. It is a deep well, like the ancestor of all things.
  We must blunt our sharpness, untangle its knots, harmonize its light, and join with
  its dust. In its clarity it seems to persist. I do not know whose child it is, perhaps
  a predecessor of the Emperor.
commentary: 'This chapter asserts that the Tao is an inexhaustible, empty source that
  resists filling. The contested move is the metaphor of the Tao as a vessel that
  never overflows—an image that challenges the idea of the Tao as a static principle.
  By urging us to blunt our sharpness and dissolve complexity, the text invites a
  return to effortless action, or [wúwéi], aligning with the natural world. The passage
  also hints at a lineage of wisdom, suggesting that the Tao precedes even the highest
  ruler, thereby elevating the Dao beyond human authority.


  Key Terms:


  **dào 道** — the fundamental principle that is the source of all things -> the Tao
  is the ultimate reality, beyond form -> translated as "the Way" or "the Dao"

  **wúwéi 無為** — effortless action, non-contrived behavior -> the Tao does not force
  itself into the world -> translated as "non-action" or "effortless doing"

  **zìrán 自然** — the natural state of being, spontaneous harmony -> the Tao aligns
  with the inherent order of the universe -> translated as "nature" or "naturalness"


  Cross-Tradition Resonances:


  **Plato, Phaedo, 73b:** Both texts describe a principle that cannot be filled or
  exhausted, suggesting a metaphysical source beyond human grasp. *Divergence:* Plato’s
  principle is a form of idealism, whereas the Tao is an active, dynamic emptiness

  **Heraclitus, Fragment 5:** The notion of a flowing, ever-changing source aligns
  with Heraclitus’s river metaphor. *Divergence:* Heraclitus emphasizes constant change,
  while the Tao emphasizes stillness and effortless flow

  **Buddha, Dhammapada, 1:** Both speak of a boundless, unconditioned reality that
  cannot be possessed. *Divergence:* Buddha’s concept is more about liberation from
  desire, whereas the Tao focuses on harmonious action'
voice_of_siva: ''
abhyasa: Stand barefoot on the earth for five minutes, breathing slowly. Let your
  thoughts dissolve like dust, and feel the quiet emptiness within you, reminding
  yourself that you are part of an ever‑flowing, unfilled Tao.
