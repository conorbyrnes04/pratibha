sutra_id: TTC_MD_007
collection: Tao Te Ching
section: chapter_section
title: Something Formless Before Heaven and Earth
sanskrit: 有物混成，先天地生。寂兮寥兮，獨立而不改，周行而不殆，可以為天下母。吾不知其名，字之曰道，強為之名曰大。大曰逝，逝曰遠，遠曰反。故道大，天大，地大，人亦大。域中有四大，而人居其一焉。人法地，地法天，天法道，道法自然。
transliteration: '*(Chinese text.)*'
translation: 'There is a thing, blended and whole, born before heaven and earth.

  Silent [*jì* 寂], empty [*liáo* 寥], standing alone without alteration,

  circulating everywhere without peril — it can be the mother of the world.


  I do not know its name; I write it *dào*.

  Compelled to name it, I call it Great [*dà* 大].


  Great means passing away [*shì* 逝];

  passing away means reaching far;

  reaching far means returning [*fǎn* 反].


  Therefore: the *dào* is great, heaven is great, earth is great, the human is great.

  In the domain are four greats, and the human is one.


  The human models earth, earth models heaven, heaven models the *dào*, the *dào*
  models *zìrán* [*zìrán* 自然].'
commentary: 'chapter 25 (something formless before heaven and earth) is the *Dào Dé
  Jīng*''s cosmological naming poem: the *dào* is not an object among objects but
  the pre-cosmic whole that remains unchanged while circulating. The chain *dà → shì
  → yuǎn → fǎn* embeds chapter 16''s return logic at cosmic scale — greatness is not
  expansion forever but expansion that turns back.


  The four greatnesses place the human inside the hierarchy, not above it. *Rén fǎ
  dì… dì fǎ tiān… tiān fǎ dào… dào fǎ zìrán* is often mistranslated as "Nature" at
  the end; *zìrán* is "self-so," what is so of itself without forced artifice. The
  *dào* does not follow an external law — it follows its own spontaneous pattern.
  Human wisdom is aligning with that chain, not skipping to the top.


  Key Terms:


  **hùn chéng 混成** — blended-and-formed, undifferentiated completion — pre-differentiated
  whole before heaven and earth.


  **zìrán 自然** — self-so, spontaneity — not "nature" as landscape but what proceeds
  without forced contrivance; ultimate model for the *dào*.


  **fǎ 法** — to model, take as standard — hierarchical alignment without domination.


  Cross-Tradition Resonances:


  **Plotinus, Enneads V.1:** the One overflows to Intellect to Soul — descending chain
  of modeling. *Divergence:* Plotinus personalizes the One; chapter 25 (something
  formless before heaven and earth) keeps the *dào* impersonal and adds *fǎn* return.


  **Tao Te Ching ch.16 / Pratyabhijñā emanation-return path:** cosmic circulation
  and human participation. *Divergence:* Śaiva recognition vs Daoist modeling without
  identity claim.


  **Spinoza, *Deus sive Natura*:** single substance expressing infinite modes. *Divergence:*
  rational geometric system vs poetic naming under erasure.'
voice_of_siva: ''
abhyasa: Walk for five minutes without naming what you see (tree, sky, person). When
  a label arises, note it and return to raw appearing. You are practicing the gap
  between the unnameable whole and the names that follow.
