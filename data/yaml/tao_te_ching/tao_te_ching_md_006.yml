sutra_id: TTC_MD_006
collection: Tao Te Ching
section: chapter_section
title: The Highest Good Is Like Water
sanskrit: '上善若水。水善利萬物而不爭，處眾人之所惡，故幾於道。

  居善地，心善淵，與善仁，言善信，政善治，事善能，動善時。

  夫唯不爭，故無尤。'
transliteration: '*(Chinese text.)*'
translation: 'Supreme goodness [*shàng shàn* 上善] is like water.

  Water excels at benefiting the ten thousand things without contending [*bù zhēng*
  不爭].

  It settles where people disdain to go — therefore it is close to the *dào*.


  In dwelling: be like earth well chosen;

  in mind: be like an abyss [*yuān* 淵];

  in giving: be like heaven''s kindness;

  in speech: be like trustworthy words;

  in governing: be like good order;

  in work: be like skilled competence;

  in movement: be like timely action.


  Only by not contending — therefore without fault [*wú yóu* 無尤].'
commentary: 'chapter 8 (the highest good is like water) makes water the normative
  image for *dé* (power/virtue) before chapter 78''s political paradox. The claim
  is not moral sentimentalism about gentleness but strategic alignment: water wins
  by taking the low, benefiting all, and refusing rivalry. *Jǐ yú dào* (幾於道) — "close
  to the *dào*" — means water approximates the world''s operative pattern, not that
  water is sacred symbolically.


  The sevenfold list (dwelling, mind, giving, speech, governance, work, movement)
  is a complete ethics of capacity without domination. Each line names excellence
  that does not require defeating others. The hinge remains *bù zhēng*: contention
  forces you out of the low place and into expenditure against resistance. chapter
  8 (the highest good is like water) prepares chapter 78''s "everyone knows soft overcomes
  hard but cannot enact it" — here is the enactable sketch.


  Key Terms:


  **shàng shàn 上善** — highest/supreme goodness — not moral scorekeeping but alignment
  with *dào*-like efficacy.


  **bù zhēng 不爭** — non-contention — central Daoist political-ethical term; avoids
  rivalry that wastes the low position''s advantage.


  **yuān 淵** — abyss, deep pool — mind-quality of depth that does not surface-flutter;
  holds without spilling.


  Cross-Tradition Resonances:


  **Bhagavad Gītā 12.13–15:** gentle, non-harming, free from contention among divine
  qualities. *Divergence:* Gītā lists cultivatable virtues; chapter 8 (the highest
  good is like water) derives them from water''s impersonal pattern.


  **Zhuangzi, Peng and cicada (ch.1):** scale and depth of medium determine capacity.
  *Divergence:* Zhuangzi dramatizes perspective; chapter 8 (the highest good is like
  water) gives concise normative image.


  **Jesus, Sermon on the Mount (Matthew 5:5):** "Blessed are the meek." *Divergence:*
  beatitude theology vs impersonal *dào* cosmology — no eschatological reward structure
  in chapter 8 (the highest good is like water).'
voice_of_siva: ''
abhyasa: 'Today, in one conversation, deliberately take the lower position: listen
  longer, claim less, let someone else''s point finish without correction. Notice
  whether contention was about truth or about position.'
