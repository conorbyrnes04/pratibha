sutra_id: TTC_MD_009
collection: Tao Te Ching
section: chapter_section
title: The Dao Moves by Reversal
sanskrit: 反者道之動；弱者道之用。天下萬物生於有，有生於無。
transliteration: '*(Chinese text.)*'
translation: 'Reversal [*fǎn* 反] is the movement of the *dào*.

  Weakness [*ruò* 弱] is the use of the *dào*.


  The world''s ten thousand things are born from being [*yǒu* 有];

  being is born from non-being [*wú* 無].'
commentary: 'chapter 40 (the Way moves by reversal) is the text''s metaphysical haiku
  — four lines that compress chapter 16''s cycle and chapter 11''s priority of *wú*.
  *Fǎn* is not accident but the *dào*''s characteristic motion: excess turns, peak
  returns, hardness overextends and breaks. *Ruò* is not moral preference for weakness
  but the operational mode that does not exhaust itself by rigid opposition.


  The final couplet inverts ordinary creation stories: manifest things come from *yǒu*,
  but *yǒu* itself arises from *wú*. This is not nihilism — it is genealogy. Form
  is second; enabling absence is first. Read with chapter 11 (the empty hub at the
  center of the wheel) and chapter 16 (all things arise and return to the root), chapter
  40 (the Way moves by reversal) is the theoretical spine of the entire book.


  Key Terms:


  **fǎn 反** — return, reversal — dynamic of the *dào*; related to *fǎn* in chapter
  78''s "true words seem inverted."


  **ruò 弱** — weakness, yielding — functional modality of the *dào*, not vice.


  **yǒu wú 有無** — being/non-being pair — ontological priority of *wú* as generative
  ground.


  Cross-Tradition Resonances:


  **Heraclitus B126:** "Cold things warm up, warm cools off, wet dries, parched moistens."
  *Divergence:* cosmic flux without Daoist political application.


  **Yījīng hexagram *Fù* (Return):** turning point of yang at solstice. *Divergence:*
  divination structure vs philosophical distillation.


  **Śūnyatā as ground of form (Nāgārjuna):** being lacks independent birth; emptiness
  enables arising. *Divergence:* rigorous dialectic vs aphoristic cosmology.'
voice_of_siva: ''
abhyasa: At the peak of inhalation, notice the inevitable reversal into exhalation.
  Stay with the turn three breaths without forcing either phase. Name one life-cycle
  where you are resisting the *fǎn* that is already underway.
