sutra_id: TTC_MD_079
collection: Tao Te Ching
section: chapter_section
title: Reconciliation and the Sage’s Quiet Hand
sanskrit: '和大怨，必有餘怨；

  安可以為善？

  是以聖人執左契，而不責於人。

  有德司契，無德司徹。

  天道無親，常與善人。'
transliteration: ''
translation: When a reconciliation is effected after a great animosity, there is sure
  to be a lingering grudge; how can this be a good thing? Therefore the sage keeps
  the left‑hand part of the contract, and does not insist on the other party’s compliance.
  The one who has virtue governs the contract, the one who lacks virtue governs the
  dissolution. The Way of Heaven has no partiality; it is always with the good man.
commentary: 'This chapter asserts that true harmony cannot be forced; the sage’s strategy
  is to hold only the *left* portion of the agreement—symbolic of restraint—rather
  than demanding immediate fulfillment. The contested move is the *left‑hand* retention:
  it is a subtle way of letting the other party act freely while the sage remains
  detached. By doing so, the sage avoids the trap of *wúwéi* (non‑action) that would
  otherwise lead to resentment. The passage also contrasts the *de* (virtue) of the
  sage, who governs the contract, with the *de* of the unvirtuous, who governs dissolution—highlighting
  that virtue is the true regulator of agreements, not force.


  The text echoes the Daoist principle that the Way of Heaven (*tiān dào*) is impartial,
  favoring the good simply because the good aligns with the natural order. Yet the
  chapter diverges from the ideal of *zìrán* (naturalness) by acknowledging that human
  emotions persist; the sage’s quiet hand is a pragmatic concession to the reality
  of *yǔn* (resentment). Thus, the chapter blends ideal Daoist impartiality with a
  realistic, compassionate strategy for dealing with human frailty.


  Key Terms:


  **左契 (zuǒ qì)** — left‑hand part of a contract -> a symbolic restraint, a partial
  commitment that preserves freedom for the other party -> "holding only the left
  part"

  **天道 (tiān dào)** — Way of Heaven -> the Dao’s impartial nature, favoring the good
  because it follows the natural order -> "the Way of Heaven has no partiality"


  Cross-Tradition Resonances:


  **chapter 1 (the Way is quiet, the world is still):** both emphasize the power of
  non‑action and restraint *Divergence:* chapter 79 demands active withholding, whereas
  chapter 1 merely observes

  **chapter 42 (the sage is like a child):** both stress simplicity and naturalness
  in dealing with others *Divergence:* chapter 79 uses a specific contractual metaphor,
  while chapter 42 uses childlike simplicity'
voice_of_siva: ''
abhyasa: When you must settle a dispute, write down only the part of the agreement
  that you can control. Hold it lightly, and let the other party act freely. If they
  fail, do not press them; instead, observe and adjust your own conduct, trusting
  that the Way of Heaven will guide the good toward harmony.
