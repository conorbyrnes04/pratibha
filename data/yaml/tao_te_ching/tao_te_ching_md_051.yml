sutra_id: TTC_MD_051
collection: Tao Te Ching
section: chapter_section
title: The Paradox of Greatness
sanskrit: '大成若缺，其用不弊。

  大盈若沖，其用不窮。

  大直若屈，大巧若拙，大辯若訥。

  躁勝寒靜勝熱。

  清靜為天下正。'
transliteration: ''
translation: The great [大成] [大成, dàchéng] is as if it were lacking; yet its use is
  never exhausted. The great fullness [大盈] [大盈, dàyíng] is like a void, and its use
  never runs out. The great straightness [大直] [大直, dàzhí] is like a bend; great skill
  [大巧] [大巧, dàqiǎo] is like clumsiness; great eloquence [大辩] [大辩, dàbiàn] is like
  slowness. Restlessness surpasses cold; stillness surpasses heat. Calm clarity is
  the right order of the world.
commentary: 'This chapter asserts that true mastery is not found in obvious perfection
  but in the paradoxical states that seem incomplete or contradictory. The contested
  move is the inversion of conventional logic: a great accomplishment is described
  as “缺” (missing), a fullness as “沖” (void), and straightness as “屈” (bent). By challenging
  our expectations, the text invites us to recognize that the highest virtue lies
  in the space between extremes, where action and stillness, skill and clumsiness
  coexist. The author’s claim is that the Tao’s power is exercised most effectively
  when it is neither forceful nor passive, but when it flows through the subtle gaps
  that ordinary reasoning would dismiss.


  Key Terms:


  **大成** — great accomplishment -> Daoist sense: the ultimate, unifying state -> translation:
  "great [大成]"

  **大盈** — great fullness -> Daoist sense: abundance that is not clinging -> translation:
  "great fullness"

  **大直** — great straightness -> Daoist sense: uncompromising truth that bends to
  reality -> translation: "great straightness"


  Cross-Tradition Resonances:


  **Plato, Phaedrus, 178c:** both texts treat paradox as a gateway to truth *Divergence:*
  Plato’s paradox is verbal, Tao’s is structural

  **Heraclitus, Fragment 119:** flowing nature of reality *Divergence:* Heraclitus
  speaks of change, Tao emphasizes stillness'
voice_of_siva: ''
abhyasa: Stand in a quiet place, breathe slowly, and observe the moment when your
  thoughts feel both restless and calm. Notice how the tension between the two dissolves,
  allowing you to act without force and listen without judgment.
