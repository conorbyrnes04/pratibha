sutra_id: TTC_MD_059
collection: Tao Te Ching
section: chapter_section
title: Cultivating Harmony Through Self and Society
sanskrit: '善建不拔，善抱者不脫，子孫以祭祀不輟。

  修之於身，其德乃真；

  修之於家，其德乃餘；

  修之於鄉，其德乃長；

  修之於國，其德乃豐；

  修之於天下，其德乃普。

  故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。

  吾何以知天下然哉？

  以此。'
transliteration: ''
translation: 'Goodness is built without tearing, and a good embrace does not let go;
  the descendants continue the rites without pause. When one cultivates [德] within
  oneself, the virtue becomes true; when one cultivates it within the family, the
  virtue becomes surplus; when one cultivates it within the village, the virtue becomes
  lasting; when one cultivates it within the state, the virtue becomes abundant; when
  one cultivates it within the world, the virtue becomes universal. Therefore one
  looks at oneself through the lens of the self, at the family through the lens of
  the family, at the village through the lens of the village, at the state through
  the lens of the state, and at the world through the lens of the world. How then
  do I know the world? By this.


  In the brackets: [德] 德 (de) – virtue; [天下] 天 (tiān) + 下 (xià) – world.'
commentary: 'This chapter asserts that the cultivation of virtue is a hierarchical,
  self‑generating process: from the individual to the cosmos. The contested move is
  the claim that by perfecting oneself one can "know the world"—a leap from personal
  practice to universal insight. The text treats the world as a mirror of the self,
  implying that the same principles governing the microcosm apply to the macrocosm.
  The implicit philosophical claim is that moral order is not merely external but
  is reflected in the inner life; thus, the outer world is a manifestation of inner
  virtue.


  The passage echoes the Daoist idea that the cosmos is a living organism whose health
  depends on each part. By cultivating virtue in the smallest unit—one’s own body—one
  sets in motion a ripple that reaches the state and the world. This mirrors the principle
  of "相生相克" (interdependent generation and constraint) found in chapter 30 (the subtle
  balance of yin and yang). Yet the text diverges from the more skeptical tone of
  chapter 51, where the Tao is described as beyond human comprehension; here the Tao
  is accessible through disciplined practice.


  Key Terms:


  **德 (de)** — Graph: a stylized hand holding a jade tablet; meaning: moral virtue;
  Daoist sense: the natural expression of the Tao within an individual; translation
  stakes: true virtue arises from self‑cultivation

  **天下 (tiānxià)** — Graph: a cloud over a mountain; meaning: the world; Daoist sense:
  the entire cosmos as an ordered whole; translation stakes: the world reflects the
  state of the self


  Cross-Tradition Resonances:


  **chapter 30 (the subtle balance of yin and yang):** structural homology in the
  idea of interdependence *Divergence:* chapter 30 emphasizes balance, while chapter
  54 emphasizes hierarchical propagation

  **chapter 51 (the Tao beyond human comprehension):** structural homology in the
  claim of ultimate unknowability *Divergence:* chapter 51 denies human access to
  the Tao, whereas chapter 54 claims it can be known through self‑cultivation'
voice_of_siva: ''
abhyasa: Stand in a quiet space, close your eyes, and breathe slowly. Visualize your
  personal virtue as a seed; imagine it sprouting, growing into a tree that extends
  its roots to your family, its branches to your village, its canopy to your state,
  and its fruit to the world. Feel the interconnectedness and commit to nurturing
  that seed daily.
