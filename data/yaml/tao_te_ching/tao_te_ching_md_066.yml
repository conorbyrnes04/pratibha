sutra_id: TTC_MD_066
collection: Tao Te Ching
section: chapter_section
title: The Path of the Supreme Principle
sanskrit: '道者萬物之奧。

  善人之寶，不善人之所保。

  美言可以市，尊行可以加人。

  人之不善，何棄之有？

  故立天子，置三公，雖有拱璧以先駟馬，不如坐進此道。

  古之所以貴此道者何？

  不曰：以求得，有罪以免耶？

  故為天下貴。'
transliteration: ''
translation: 'The Tao is the mystery of all things. The treasure of the good is not
  the safeguard of the bad. Beautiful words can be sold, noble deeds can add to a
  person. When a person is not good, what is there to abandon? Therefore the emperor
  is established, the three ministers are appointed; even if one holds a jade ring
  to lead a horse, it is no better than to sit in this Tao. Why did the ancients cherish
  this Tao? They did not say: ‘Because it brings gain, or because it evades sin?’
  That is why it is valued by all the world.'
commentary: 'This chapter asserts that the Tao is the ultimate source of all phenomena
  and that true virtue is not a matter of outward ornament or political office. The
  contested move is the claim that even the most powerful ruler—an emperor with ministers
  and ceremonial regalia—cannot surpass the simple act of sitting in the Tao. The
  author argues that the ancients did not value the Tao for material gain or for evading
  blame, but for its inherent worth. By contrasting the visible symbols of power with
  the invisible, unearned presence of the Tao, the text invites a reevaluation of
  what constitutes real leadership and moral authority.


  Key Terms:


  **tāo 道** — the ultimate principle or source of all things -> the hidden mystery
  that underlies reality -> the supreme, ineffable path that governs the cosmos

  **zhì 德** — virtue or moral excellence -> the natural outcome of aligning with the
  Tao -> the inner quality that manifests as goodness

  **wúwéi 無為** — non-action or effortless action -> the state of acting in harmony
  with the Tao -> a way of being that resists forced or artificial effort

  **zìrán 自然** — naturalness or spontaneity -> the spontaneous order that arises from
  the Tao -> living in accordance with the natural flow of life


  Cross-Tradition Resonances:


  **chapter 1 (The Tao is the source of all things):** both chapters emphasize the
  Tao as the origin of all phenomena *Divergence:* chapter 1 speaks of the Tao as
  the source, while chapter 62 speaks of the Tao as the hidden mystery that surpasses
  external power

  **chapter 21 (The Tao is the source of all things):** both chapters link the Tao
  with the idea that true virtue is not external *Divergence:* chapter 21 focuses
  on the Tao as the source of all things, whereas chapter 62 focuses on the Tao as
  the hidden source of all things

  **chapter 48 (The Tao is the source of all things):** both chapters emphasize the
  Tao as the source of all phenomena *Divergence:* chapter 48 describes the Tao as
  the source of all things, while chapter 62 describes the Tao as the hidden source
  of all things'
