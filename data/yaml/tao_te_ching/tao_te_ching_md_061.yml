sutra_id: TTC_MD_061
collection: Tao Te Ching
section: chapter_section
title: The Quiet Mastery of the Tao
sanskrit: '知者不言，言者不知。

  塞其兑，閉其門，挫其銳，解其分，和其光，同其塵，是謂玄同。

  故不可得而親，不可得而踈；

  不可得而利，不可得而害；

  不可得而貴，不可得而賤。

  故為天下貴。'
transliteration: ''
translation: The knowing one does not speak, the speaking one does not know. He [塞其兑]
  seals his mouth, [閉其門] closes his nostrils, [挫其銳] dulls his sharpness, [解其分] untangles
  his divisions, [和其光] harmonizes his light, [同其塵] unites with the dust; this is called
  the [玄同] (mysterious unity). Therefore he cannot be approached closely or distantly;
  he cannot be benefited or harmed; he cannot be valued or devalued. Thus he is the
  most noble of all under heaven.
commentary: 'This chapter asserts that true mastery of the Tao is achieved by withdrawal
  from the world of words and distinctions. The contested move is the paradoxical
  injunction that the knowing one must not speak, while the speaking one is ignorant.
  By sealing the mouth and blunting sharpness, the sage dissolves egoic separations
  and aligns with the natural flow, thereby becoming beyond conventional judgments
  of value. The text thus elevates the quiet, unadorned presence of the sage as the
  highest nobility, contrasting sharply with worldly notions of power and status.


  Key Terms:


  **塞其兑 (sāi qí duì)** — seal the mouth -> to refrain from speaking; Daoist sense:
  silence as a means of preserving truth -> translation: ''seal his mouth''

  **閉其門 (bì qí mén)** — close the nostrils -> to withdraw from external stimuli; Daoist
  sense: inward focus -> translation: ''close his nostrils''

  **挫其銳 (cuò qí ruì)** — blunt his sharpness -> to soften egoic edges; Daoist sense:
  humility -> translation: ''dull his sharpness''

  **玄同 (xuán tóng)** — mysterious unity -> the state of harmonious alignment with
  the Tao; Daoist sense: ultimate unity -> translation: ''mysterious unity''


  Cross-Tradition Resonances:


  **Laozi, chapter 2 (the Tao is the source of all things):** Both chapters emphasize
  the primacy of the Tao over human articulation *Divergence:* Chapter 56 focuses
  on withdrawal and silence, whereas chapter 2 celebrates the Tao’s generative openness

  **Zhuangzi, chapter 6 (the Great Sage’s silence):** Both texts portray the sage
  as one who refrains from speech *Divergence:* Zhuangzi’s narrative uses humor and
  paradox, while chapter 56 presents a concise doctrinal statement'
voice_of_siva: ''
abhyasa: Sit in quiet meditation for ten minutes, focusing on the breath. Whenever
  a thought arises, observe it without judgment, then gently return to the breath,
  embodying the sage’s practice of sealing the mouth and uniting with the dust.
