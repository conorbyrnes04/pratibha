sutra_id: TTC_MD_028
collection: Tao Te Ching
section: chapter_section
title: The Rise of Virtue Amid Decline
sanskrit: '大道廢，有仁義；

  智慧出，有大偽；

  六親不和，有孝慈；

  國家昏亂，有忠臣。'
transliteration: ''
translation: When the [大道] (dàdào) is abandoned, [仁義] (rén yì) appears; when [智慧]
  (zhì huì) emerges, great [偽] (wěi) follows. When the six kinships are in discord,
  [孝慈] (xiào cí) manifests; when the state is in turmoil, loyal ministers arise.
commentary: 'This chapter asserts that the disappearance of the Great Tao does not
  leave a vacuum but replaces it with a counterfeit moral order. The contested move
  is the claim that benevolence and righteousness surface only when the Tao is lost,
  suggesting that these virtues are contingent rather than intrinsic. The text warns
  that such emergent qualities are merely echoing the Tao’s former presence, yet they
  lack its depth and become prone to hypocrisy. The pattern of virtue rising from
  decline mirrors the Taoist critique of institutionalized morality, which gains power
  when the natural order is absent, but ultimately remains an imitation that cannot
  sustain itself.


  The passage also highlights the paradoxical emergence of loyalty and filial piety
  in times of familial and national disarray. While these traits are traditionally
  seen as stabilizing forces, the chapter implies they are reactive, arising as a
  compensatory response to disorder rather than as proactive guardians of harmony.
  Thus, the text invites readers to discern the difference between genuine virtue
  rooted in the Tao and its superficial counterparts that surface in crisis.


  Key Terms:


  **大道 (dàdào)** — Great Way -> the ultimate, unchanging principle of the cosmos ->
  "Great Tao"

  **仁義 (rén yì)** — benevolence and righteousness -> Daoist sense of compassionate
  moral action -> "benevolence and righteousness"

  **智慧 (zhì huì)** — wisdom -> Daoist understanding of insight beyond conventional
  knowledge -> "wisdom"

  **偽 (wěi)** — falsehood, hypocrisy -> Daoist caution against deceptive imitation
  of virtue -> "great hypocrisy"


  Cross-Tradition Resonances:


  **Plato, Republic, Book VII – Allegory of the Cave:** Both texts suggest that apparent
  virtue or knowledge is merely a shadow of true reality when the underlying principle
  (Tao or Forms) is absent. *Divergence:* Plato’s cave emphasizes enlightenment through
  philosophical inquiry, whereas the Tao Te Ching warns that such apparent virtue
  is ultimately deceptive.

  **Confucius, Analects 2.4 – “The Master said, ‘The gentleman is not a man who has
  no faults…’”:** Both comment on the emergence of moral qualities in the absence
  of higher guidance. *Divergence:* Confucianism frames these qualities as cultivated
  through education, while the Tao Te Ching presents them as reactive, lacking depth.'
