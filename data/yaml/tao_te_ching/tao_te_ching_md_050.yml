sutra_id: TTC_MD_050
collection: Tao Te Ching
section: chapter_section
title: The Paradox of Attachment
sanskrit: '名與身孰親？

  身與貨孰多？

  得與亡孰病？

  是故甚愛必大費；

  多藏必厚亡。

  知足不辱，知止不殆，可以長久。'
transliteration: ''
translation: Who is nearer, the *mìng* (名) or the *shēn* (身)? Who is more abundant,
  the *shēn* or the *huò* (貨)? Who is more afflicted, the *dé* (得) or the *wáng* (亡)?
  Therefore, the love that is too great costs much; the hoarding that is too great
  brings great loss. Knowing *zìjù* (知足) spares humiliation; knowing *zhǐ* (知止) spares
  danger; thus one can endure for a long time.
commentary: 'This chapter argues that attachment—whether to names, bodies, or wealth—creates
  a paradoxical cycle of loss. The contested move is the claim that *zhǐ* (止) and
  *zìjù* (足) are the antidotes to the suffering that arises from over‑attachment.
  By presenting the triad of questions, the text sets up a logical structure: the
  closer the attachment, the greater the cost; the more we hoard, the more we lose.
  The resolution is that contentment and restraint are not passive but active practices
  that sustain life. The chapter thus invites a re‑evaluation of what it means to
  “own” or “possess” in a world where everything is impermanent.


  Key Terms:


  **mìng 名** — name/label -> the conceptual identity that frames perception -> translation:
  name

  **shēn 身** — body/physical self -> the embodied reality that is subject to change
  -> translation: body

  **huò 貨** — wealth/commodities -> material possessions that can be lost -> translation:
  wealth

  **dé 得** — gain/acquisition -> the act of obtaining, which can become a source of
  loss -> translation: gain


  Cross-Tradition Resonances:


  **Laozi, chapter 44 (contentment and restraint):** structural homology: both emphasize
  the virtue of moderation *Divergence:* Laozi uses the term *zìjù* whereas this text
  uses *zhǐ* as the key practice

  **Confucius, Analects 2.8 (the value of self‑control):** structural homology: self‑control
  preserves harmony *Divergence:* Confucianism frames self‑control as duty to society,
  not personal endurance

  **Mencius, Mencius 1.1 (the nature of wealth):** structural homology: wealth can
  corrupt *Divergence:* Mencius argues for moral cultivation, while this chapter stresses
  the cost of attachment

  **Zhuangzi, chapter 41 (the folly of attachment):** structural homology: attachment
  leads to loss *Divergence:* Zhuangzi uses humor and paradox, whereas this chapter
  is concise and prescriptive'
voice_of_siva: ''
abhyasa: 'Pause before making a purchase: ask yourself if the item will truly add
  lasting value or simply become another point of attachment. If it does not, refrain—practice
  restraint to preserve what you already have.'
