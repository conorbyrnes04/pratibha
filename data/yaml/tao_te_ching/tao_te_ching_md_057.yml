sutra_id: TTC_MD_057
collection: Tao Te Ching
section: chapter_section
title: The Origin and the Mother
sanskrit: '天下有始，以為天下母。

  既知其母，復知其子，既知其子，復守其母，沒其不殆。

  塞其兌，閉其門，終身不勤。

  開其兌，濟其事，終身不救。

  見小曰明，守柔曰強。

  用其光，復歸其明，無遺身殃；

  是為習常。'
transliteration: ''
translation: 1. When the world has a beginning, it is the [天下] (tiānxià) mother of
  all. 2. Knowing that mother makes us know the children; knowing the children makes
  us guard the mother, and in that guarding we are free from danger. 3. Close the
  mouth and shut the nostrils, and you will never be forced to labor. Open the mouth
  and breathe for your affairs, and you will never be safe. 4. Seeing the small is
  [明] (míng) – clarity; guarding the soft is [強] (qiáng) – strength. 5. Use the light
  wisely, return to its brightness, and you will keep your body free of harm; this
  is the habit of the constant.
commentary: 'This chapter asserts that the Tao is the primordial mother of all things,
  and that by recognizing and safeguarding that mother one achieves safety. The contested
  move is the paradoxical injunction to close the mouth and nostrils to avoid labor,
  versus opening them to act, suggesting that action without intention is perilous
  while silence preserves the Tao. The text does not merely describe a method; it
  claims that the very act of guarding the mother—of aligning oneself with the natural
  order—constitutes a living practice of the Tao. It is a call to internal stillness
  that paradoxically yields external strength, a theme that echoes throughout the
  Tao Te Ching.


  Key Terms:


  **天下 (tiānxià)** — the world or universe -> the mother of all -> the source of all
  existence

  **明 (míng)** — clarity or insight -> the perception of the small -> the light that
  reveals

  **強 (qiáng)** — strength or power -> the guarding of the soft -> the power of yielding

  **道 (dào)** — the Way -> the primordial principle -> the source of all being


  Cross-Tradition Resonances:


  **chapter 1 (the Tao that can be named is not the eternal Tao):** Both chapters
  start with the Tao as a source, but chapter 52 frames it as a mother rather than
  an abstract principle *Divergence:* chapter 1 speaks of the ineffable, while chapter
  52 gives a concrete relational image

  **chapter 33 (the Tao is the mother of all):** Both use the mother metaphor, but
  chapter 33 emphasizes the Tao’s generative role, whereas chapter 52 focuses on the
  protective duty of the child

  **chapter 56 (the Tao is the source of all things):** Both identify the Tao as the
  origin, but chapter 56 is more descriptive, chapter 52 is prescriptive about guarding
  the mother'
voice_of_siva: ''
abhyasa: Sit in stillness for ten minutes each morning, closing your mouth and nostrils
  in a gentle breath, and observe how the quietness protects you from the day’s distractions.
