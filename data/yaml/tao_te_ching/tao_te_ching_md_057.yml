sutra_id: TTC_MD_057
collection: Tao Te Ching
section: chapter_section
title: The Origin and the Mother
sanskrit: '天下有始，以為天下母。

  既知其母，復知其子，既知其子，復守其母，沒其不殆。

  塞其兌，閉其門，終身不勤。

  開其兌，濟其事，終身不救。

  見小曰明，守柔曰強。

  用其光，復歸其明，無遺身殃；

  是為習常。'
transliteration: ''
translation: '(The the Way [*dào* 道]) which originated all under the sky is to be considered as the mother of them all.


  When the mother is found, we know what her children should be.


  When one knows that he is his mother''s child, and proceeds to guard (the qualities of) the mother that belong to him, to the end of his life he will be free from all peril.


  Let him keep his mouth closed, and shut up the portals (of his nostrils), and all his life he will be exempt from laborious exertion.


  Let him keep his mouth open, and (spend his breath) in the promotion of his affairs, and all his life there will be no safety for him.


  The perception of what is small is (the secret of) clear-sightedness; the guarding of what is soft and tender is (the secret of) strength.


  5.


  Who uses well his light, Reverting to its (source so) bright, Will from his body ward all blight, And hides the unchanging from men''s sight.'
commentary: 'This chapter asserts that the Tao is the primordial mother of all things, and that by recognizing and safeguarding that mother one achieves safety. The contested move is the paradoxical injunction to close the mouth and nostrils to avoid labor, versus opening them to act, suggesting that action without intention is perilous while silence preserves the Tao. The text does not merely describe a method; it claims that the very act of guarding the mother—of aligning oneself with the natural order—constitutes a living practice of the Tao. It is a call to internal stillness that paradoxically yields external strength, a theme that echoes throughout the Tao Te Ching.


  Key Terms:


  **天下 (tiānxià)** — the world or universe -> the mother of all -> the source of all existence

  **明 (míng)** — clarity or insight -> the perception of the small -> the light that reveals

  **強 (qiáng)** — strength or power -> the guarding of the soft -> the power of yielding

  **道 (dào)** — the Way -> the primordial principle -> the source of all being


  Cross-Tradition Resonances:


  **chapter 1 (the Tao that can be named is not the eternal Tao):** Both chapters start with the Tao as a source, but chapter 52 frames it as a mother rather than an abstract principle *Divergence:* chapter 1 speaks of the ineffable, while chapter 52 gives a concrete relational image

  **chapter 33 (the Tao is the mother of all):** Both use the mother metaphor, but chapter 33 emphasizes the Tao’s generative role, whereas chapter 52 focuses on the protective duty of the child

  **chapter 56 (the Tao is the source of all things):** Both identify the Tao as the origin, but chapter 56 is more descriptive, chapter 52 is prescriptive about guarding the mother'
