sutra_id: TTC_MD_037
collection: Tao Te Ching
section: chapter_section
title: The Paradox of Leadership
sanskrit: '知其雄，守其雌，為天下谿。

  為天下谿，常德不離，復歸於嬰兒。

  知其白，守其黑，為天下式。

  為天下式，常德不忒，復歸於無極。

  知其榮，守其辱，為天下谷。

  為天下谷，常德乃足，復歸於樸。

  樸散則為器，聖人用之，則為官長，故大制不割。'
transliteration: ''
translation: Know the masculine strength [*xióng* 雄] and guard the feminine receptivity [*cí* 雌]; be the world's valley stream [*xī* 谿]. As the world's valley stream, constant virtue [*cháng dé* 常德] never leaves you, and you return to the infant state. Know the white and guard the black; be the world's model [*shì* 式]. As the world's model, constant virtue never errs, and you return to the unbounded [*wújí* 無極]. Know honour and guard disgrace; be the world's valley [*gǔ* 谷]. As the world's valley, constant virtue is sufficient, and you return to the uncarved block [*pǔ* 朴]. When the uncarved block is scattered, it becomes vessels; when the sage uses it, he becomes the chief officer. Thus the great cutting does not sever.
commentary: 'This chapter asserts that leadership is a dance of contradictions: the ruler must embody both strength and gentleness, brilliance and darkness, glory and humility. The contested move is the claim that by guarding the feminine or the humble one can become the world’s ruler—an inversion of conventional power dynamics. The text argues that the true sovereign is one who, like a vessel, remains empty and receptive, allowing the natural flow of the [道](道) to guide all action. The paradoxical instructions—‘know the [雄] and guard the [雌]’—highlight that authority is not about domination but about maintaining equilibrium, a theme that echoes throughout the Tao Te Ching but is uniquely emphasized here.


  Key Terms:


  **雄 (xióng)** — masculine, active principle -> Daoist sense: the dynamic, creative force -> translation stakes: strength must be tempered by restraint

  **雌 (cí)** — feminine, receptive principle -> Daoist sense: the passive, sustaining force -> translation stakes: gentleness sustains power

  **无极 (wújí)** — the unbounded, limitless state -> Daoist sense: the primordial source -> translation stakes: ultimate return to the source

  **朴 (pǔ)** — simplicity, unadorned nature -> Daoist sense: the uncarved block -> translation stakes: purity that becomes a vessel


  Cross-Tradition Resonances:


  **chapter 1 (the world is a mirror of the [道] and the sage follows its example):** both chapters emphasize the primacy of the [道] as the source of all order *Divergence:* chapter 28 focuses on the paradoxical nature of leadership, whereas chapter 1 presents the [道] as a passive mirror

  **chapter 47 (the sage who knows the world’s emptiness is the ruler):** the idea that emptiness or the uncarved block leads to authority appears in both chapters *Divergence:* chapter 28 frames emptiness as a vessel for action, while chapter 47 treats it as a state of non-interference

  **chapter 64 (the sage who does not act is the greatest):** both highlight the virtue of non-action (wúwéi) as the path to power *Divergence:* chapter 28 explicitly pairs action with the maintenance of opposites, whereas chapter 64 extols pure non-action'
voice_of_siva: ''
abhyasa: Sit quietly for ten minutes, observing the breath. When thoughts of dominance or submission arise, note them without judgment and let them pass, returning to the breath. This simple practice cultivates the balance of [雄] and [雌] within, preparing one to lead with both strength and gentleness.
