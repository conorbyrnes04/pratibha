sutra_id: ZHUANGZI_MD_016
collection: The Book of Chuang Tzu
section: teaching_passage
title: The Unraveling of Original Simplicity
sanskrit: '繕性於俗，學以求復其初；

  滑欲於俗，思以求致其明；

  謂之蔽蒙之民。

  古之治道者，以恬養知。

  生而無以知為也，謂之以知養恬。

  知與恬交相養，而和理出其性。

  夫德，和也；

  道，理也。

  德無不容，仁也；

  道無不理，義也；

  義明而物親，忠也；

  中純實而反乎情，樂也；

  信行容體而順乎文，禮也。

  禮樂遍行，則天下亂矣。

  彼正而蒙己德，德則不冒。

  冒則物必失其性也。

  古之人，在混芒之中，與一世而得澹漠焉。

  當是時也，陰陽和靜，鬼神不擾，四時得節，萬物不傷，群生不夭，人雖有知，無所用之，此之謂至一。

  當是時也，莫之為而常自然。

  逮德下衰，及燧人、伏羲始為天下，是故順而不一。

  德又下衰，及神農、黃帝始為天下，是故安而不順。

  德又下衰，及唐、虞始為天下，興治化之流，澆淳散朴，離道以善，險德以行，然後去性而從於心。

  心與心識知而不足以定天下，然後附之以文，益之以博。

  文滅質，博溺心，然後民始惑亂，無以反其性情而復其初。

  由是觀之，世喪道矣，道喪世矣，世與道交相喪也。

  道之人何由興乎世，世亦何由興乎道哉！

  道無以興乎世，世無以興乎道，雖聖人不在山林之中，其德隱矣。

  隱，故不自隱。

  古之所謂隱士者，非伏其身而弗見也，非閉其言而不出也，非藏其知而不發也，時命大謬也。

  當時命而大行乎天下，則反一無跡；

  不當時命而大窮乎天下，則深根寧極而待：此存身之道也。

  古之存身者，不以辯飾知，不以知窮天下，不以知窮德，危然處其所而反其性已，又何為哉！

  道固不小行，德固不小識。

  小識傷德，小行傷道。

  故曰：正己而已矣。

  樂全之謂得志。

  古之所謂得志者，非軒冕之謂也，謂其無以益其樂而已矣。

  今之所謂得志者，軒冕之謂也。

  軒冕在身，非性命也，物之儻來，寄者也。

  寄之，其來不可圉，其去不可止。

  故不為軒冕肆志，不為窮約趨俗，其樂彼與此同，故無憂而已矣！

  今寄去則不樂。

  由是觀之，雖樂，未嘗不荒也。

  故曰：喪己於物，失性於俗者，謂之倒置之民。

  前篇：目錄次篇：'
transliteration: '*(Chinese source text; no Sanskrit original. Pinyin with tones for
  key terms is provided in Key Terms.)*'
translation: 'Those who cultivate their faculties through conventional learning, seeking
  to restore their original state; those who dull their desires through conventional
  thought, seeking to attain clarity—these are called the benighted people.


  The ancients who governed through the Way used tranquility [*tai* 恬] to nourish
  knowing. Born without applying knowing to anything, this is called using knowing
  to nourish tranquility. When knowing and tranquility mutually nourish each other,
  harmony and order [*he li* 和理] emerge from their nature. Virtue [*de* 德] is harmony;
  the Way [*dao* 道] is order. Virtue that excludes nothing is humaneness [*ren* 仁];
  the Way that orders all things is rightness [*yi* 義]. When rightness becomes clear
  and things draw near, this is loyalty [*zhong* 忠]. When the center holds pure and
  real, returning to feeling, this is music [*le* 樂]. When trust moves through the
  body and aligns with pattern [*wen* 文], this is ritual [*li* 禮]. When ritual and
  music spread everywhere, the world descends into chaos.


  When one corrects oneself while obscuring one''s virtue, virtue cannot flourish.
  When it cannot flourish, things necessarily lose their nature. The ancients dwelt
  in primordial chaos [*hun mang* 混芒], moving with their age in perfect plainness.
  At that time, yin and yang were harmonized and still, ghosts and spirits caused
  no disturbance, the four seasons held their proper measure, the ten thousand things
  suffered no harm, all beings lived their full span. Though humans possessed knowing,
  they had no use for it—this is called supreme unity [*zhi yi* 至一]. At that time,
  nothing was made yet all things were naturally so.


  When Virtue declined, Suiren and Fuxi began governing the world—thus adaptation
  without unity. When Virtue declined further, Shennong and the Yellow Emperor began
  governing—thus order without adaptation. When Virtue declined again, Yao and Shun
  began governing, establishing systems of transformation and refinement, diluting
  the pure and scattering the simple, departing from the Way through goodness, imperiling
  Virtue through action. Only then did humans abandon their nature and follow the
  heart-mind [*xin* 心].


  Heart-mind against heart-mind, knowing against knowing—insufficient to settle the
  world. Then they attached pattern [*wen* 文] to it, increased it with breadth. Pattern
  destroyed substance, breadth drowned the heart-mind, and only then did the people
  begin their confusion, unable to return to their nature-feeling and recover their
  beginning.


  From this we see: the world destroys the Way, the Way destroys the world, world
  and Way mutually destroy each other. How could the Way arise in the world? How could
  the world arise in the Way? The Way has no means to arise in the world; the world
  has no means to arise in the Way. Even the sage, not dwelling in mountains and forests,
  has their virtue hidden [*yin* 隱].


  Hidden means not hiding oneself. What the ancients called the hidden person [*yin
  shi* 隱士] was not one who concealed the body from sight, nor one who sealed words
  from utterance, nor one who stored knowing from expression—the times were greatly
  at odds. When the times align and one greatly moves through the world, return to
  unity leaving no trace. When the times do not align and one is greatly constrained
  by the world, root deeply and dwell in the ultimate, waiting—this is the Way of
  preserving the body [*cun shen zhi dao* 存身之道].


  The ancients who preserved themselves did not use discrimination to adorn knowing,
  did not use knowing to exhaust the world, did not use knowing to exhaust Virtue.
  Precarious in their place, they returned to their nature—what more was there to
  do? The Way is not a small practice; Virtue is not small knowing. Small knowing
  damages Virtue; small practice damages the Way. Thus it is said: correct yourself
  and that is all.


  To find joy in wholeness is called attaining one''s aim. What the ancients called
  attaining one''s aim was not rank and carriage—it meant having nothing that would
  increase their joy. What now is called attaining one''s aim is rank and carriage.
  Rank and carriage on the body are not life-destiny [*xing ming* 性命]—things that
  happen to arrive, lodgers merely. When lodged, their coming cannot be blocked, their
  going cannot be stopped. Thus one does not make rank and carriage reckless with
  aim, does not chase convention through poverty. The joy in that and this is the
  same, so there is no sorrow. Now when the lodger departs, there is no joy. From
  this we see: though there is joy, it has never not been desolate.


  Thus it is said: those who lose themselves in things, who lose their nature in convention—these
  are called the inverted people [*dao zhi zhi min* 倒置之民].'
commentary: 'The chapter''s central claim is that civilization itself constitutes
  a systematic inversion of human nature—not through malice but through the very mechanisms
  of order, ritual, and moral instruction. The contested move occurs at the transition
  from Fuxi through Yao-Shun: each sage-ruler''s attempt to govern *better* paradoxically
  accelerates the departure from the Way. Giles reads this as historical decline;
  Zhuangzi presents it as structural: the moment governance becomes intentional (rather
  than spontaneous), the moment knowing is deployed as an instrument, the original
  unity fractures irreversibly. The text does not blame individual rulers but exposes
  how *any* systematization of virtue necessarily obscures virtue itself.


  The chapter''s radical conclusion—that even the sage''s virtue becomes hidden, that
  withdrawal into mountains is itself a form of complicity—dissolves the traditional
  escape route. "Hidden means not hiding oneself" reverses the logic of retreat: true
  preservation of the body requires neither concealment nor display, but a paradoxical
  alignment with whatever the times demand, leaving no trace of intention. This is
  not passivity but a kind of responsiveness so complete it appears as non-action
  [*wu wei* 無為]. The final inversion—calling those who chase rank and carriage "inverted
  people"—exposes how the very pursuit of fulfillment through external goods inverts
  the self''s relationship to joy itself.


  Key Terms:


  **tai 恬** - tranquility, repose, stillness—not mere absence but the primordial condition
  where knowing and action have not yet differentiated. In Zhuangzi''s genealogy,
  it precedes and generates knowing rather than being its opposite. Translation stakes:
  whether tranquility is passive (mere rest) or generative (the source of authentic
  order).

  **he li 和理** - harmony-order, the spontaneous coherence that emerges when knowing
  and tranquility reciprocally nourish each other. Not imposed pattern but the natural
  resonance of aligned forces. In later Confucian usage, *li* becomes rigid ritual;
  here it remains fluid, organic responsiveness. Translation stakes: whether order
  is discovered or constructed.

  **xin 心** - heart-mind, the seat of intentional knowing and discrimination. The
  text marks its emergence as the fall: when humans abandon nature (*xing* 性) and
  follow the heart-mind, they enter the realm of conflict and calculation. Translation
  stakes: whether the heart-mind is humanity''s glory or its catastrophe.

  **yin 隱** - hidden, concealed, but also the state of non-manifestation that paradoxically
  requires no hiding. The sage''s virtue is hidden not through withdrawal but through
  such perfect alignment with circumstance that intention vanishes. Translation stakes:
  whether hiddenness is evasion or the highest form of presence.


  Cross-Tradition Resonances:


  **Rousseau, *Discourse on Inequality*, Part II:** Both texts narrate civilization
  as progressive corruption of an original state. Rousseau''s natural man becomes
  corrupted through property and comparison; Zhuangzi''s primordial unity fragments
  through governance and moral instruction. Both locate the catastrophe in the moment
  of systematization. *Divergence:* Rousseau seeks to recover or reform society through
  reason; Zhuangzi insists recovery is impossible and that even the attempt to reform
  accelerates decay. Rousseau''s solution is political; Zhuangzi''s is the dissolution
  of politics itself.

  **Daodejing, ch. 15: ''The ancient masters were profound and far-reaching... Because
  they were so hard to know, I will try to describe them.'':** Both texts use the
  impossibility of describing the Way as a rhetorical strategy. The Daodejing''s opening—''The
  Way that can be spoken is not the eternal Way''—parallels Zhuangzi''s claim that
  the moment knowing becomes intentional, it departs from the Way. *Divergence:* The
  Daodejing offers practical counsel for rulers (wu wei, non-action); Zhuangzi denies
  that any ruler can govern without corrupting. The Daodejing seeks a reformed governance;
  Zhuangzi seeks the dissolution of the governed/governor distinction.

  **Hegel, *Phenomenology of Spirit*, on the unhappy consciousness:** Both describe
  a state of internal division where the self pursues external goods (rank, carriage,
  moral achievement) and thereby inverts its own nature. The pursuit of fulfillment
  becomes the mechanism of alienation. *Divergence:* Hegel''s unhappy consciousness
  is a stage to be overcome through dialectical development; Zhuangzi suggests that
  all development *is* the problem. Hegel''s solution is historical progress; Zhuangzi''s
  is the cessation of progress itself.'
voice_of_siva: ''
abhyasa: 'For one week, identify one daily action performed *for a result*—a gesture
  of kindness meant to be seen, a task completed to earn approval, a word spoken to
  establish your position. Each time, pause and ask: what if I did this action, or
  refrained from it, with no concern for outcome or recognition? Notice whether the
  action becomes lighter, whether your attention shifts from the future (result) to
  the present (the action itself). This is not about becoming passive but about discovering
  whether intention itself is the weight you carry. At week''s end, observe whether
  this shift in attention has altered your experience of fatigue, satisfaction, or
  the need for external validation.'
