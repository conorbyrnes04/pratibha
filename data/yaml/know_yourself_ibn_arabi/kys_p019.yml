sutra_id: KYS_P019
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #19'
sanskrit: ''
transliteration: ''
translation: What the Prophet pointed out by that, is that you are not you but you
  are Him and there is no you. It is not that He enters into you or that you enter
  into Him, or that He comes out of you or that you come out of Him. That does not
  mean that you have being and you are qualified by this or that attribute. What is
  meant is that you never were and never will be, whether through yourself or through
  Him or in Him or with Him.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
