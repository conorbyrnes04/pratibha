sutra_id: KYS_P005
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #5'
sanskrit: ''
transliteration: ''
translation: It is in this way that you should know Him and not through theoretical
  knowledge, reason, understanding or conjecture, nor with the senses, the external
  eye or interior sight or perception. No one sees Him except Himself, no one reaches
  Him except Himself and no one knows Him except Himself.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
- consciousness
- nonduality
voice_of_siva: ''
glossary: []
