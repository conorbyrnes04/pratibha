sutra_id: KYS_P022
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #22'
sanskrit: ''
transliteration: ''
translation: What is meant is that you never were and never will be, whether through yourself or through Him or in Him or with Him. You have neither ceased to be nor are you existent. You are Him and He is you, without any of these imperfections. If you know your existence in this way, then you know God, and if not, then not.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
