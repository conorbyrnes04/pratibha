resonances:
- citation: 'Vijnana Bhairava — Yukti #69'
  resonance: 'Both texts use radical negation of the subject-object distinction as the method: Ibn Arabi negates the self entirely (''never were and never will be''), while Yukti 69 strips away desire and thought to ask ''who am I?''—each dissolving the knower into a void where identity cannot be claimed.'
  divergence: Ibn Arabi's negation is ontological and absolute (the self has no being whatsoever), whereas the Vijnana Bhairava uses negation as a phenomenological inquiry that may reveal consciousness itself, not absolute non-being.
  passage_id: vijnana_bhairava.yukti_069
- citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
  resonance: 'Both establish a recursive correspondence between attention and self-knowledge: the Mandukya maps consciousness states onto Om''s phonetic structure to make sound-meditation a complete Self-inquiry, while Ibn Arabi turns attention inward to the knower itself, making the reversal of attention the method of clarity.'
  divergence: The Mandukya uses systematic correspondence and multiplicity (four states, four quarters of Om) as the scaffolding for inquiry, whereas Ibn Arabi emphasizes singular, undivided negation and the collapse of all mediation.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
