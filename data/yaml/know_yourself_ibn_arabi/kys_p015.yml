sutra_id: KYS_P015
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #15'
sanskrit: ''
transliteration: ''
translation: The very existence of the prophetic message is His existence. There is no existence to any other who could pass away, or have a name or be named. Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their self, knows their Lord.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
