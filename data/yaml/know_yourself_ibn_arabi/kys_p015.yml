sutra_id: KYS_P015
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #15'
sanskrit: ''
transliteration: ''
translation: The very existence of the prophetic message is His existence. There is
  no existence to any other who could pass away, or have a name or be named. Because
  of this, the Prophet, God bless him and give him peace, said, Whoever knows their
  self, knows their Lord.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
- consciousness
voice_of_siva: ''
