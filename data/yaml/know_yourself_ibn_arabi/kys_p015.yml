resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts locate the problem of self-knowledge in a misdirection of attention: the soul/self continuously enacts its true nature, but remains obscured because consciousness is habitually turned outward (toward sense-content or ''passing content''). Clarity requires a reversal of attention back to the knower itself.'
  divergence: Plotinus frames this as an epistemological problem of perception and awareness; Ibn Arabi frames it as an ontological identity where the prophetic message *is* divine existence, making the inward turn a recognition of non-duality rather than a recovery of overlooked activity.
  passage_id: plotinus_enneads.enn_v_1_12
- citation: 'Vijnana Bhairava — Yukti #61'
  resonance: Both passages identify a threshold where attention withdraws from multiplicity (the Void, the nondual) and the true nature of the Self manifests precisely at that point of cessation. The Self is revealed not through acquisition but through the removal of obstruction.
  divergence: The Vijnana Bhairava locates this manifestation in the nondual Void as a phenomenological state accessible through yogic practice; Ibn Arabi's 'existence of the prophetic message' is a metaphysical claim about the identity of divine and prophetic presence, not a meditative attainment.
  passage_id: vijnana_bhairava.yukti_061
