translation: He also said, I knew my Lord through my Lord. What the Prophet pointed out by that, is that you are not you but you are Him and there is no you. It is not that He enters into you or that you enter into Him, or that He comes out of you or that you come out of Him. That does not mean that you have being and you are qualified by this or that attribute.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
