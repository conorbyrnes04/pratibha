resonances:
- citation: Pratyabhijnahrdayam — Sutra 13
  resonance: 'Both texts enact a self-knowing that is simultaneously a recognition of one''s own nature as the ultimate principle: Ibn Arabi''s ''I knew my Lord through my Lord'' mirrors the Pratyabhijnahrdayam''s recognition of one''s own authorship as Supreme Consciousness. In both, the knower and known collapse into a single act of self-disclosure.'
  divergence: Ibn Arabi emphasizes the paradox of knowing the transcendent Lord *through* the Lord (a Sufi apophatic move), while Pratyabhijnahrdayam grounds recognition in the intrinsic authorship of consciousness itself (a Tantric non-dual epistemology).
  passage_id: pratyabhijnahrdayam.phr_013
- citation: Isavasya Upanishad — Mantra 7
  resonance: 'Both passages pivot on the recognition that dissolves the subject-object split: Ibn Arabi''s self-knowing through the Lord parallels the Isavasya''s unity-vision that annihilates delusion and sorrow. Each names a threshold where the illusion of separation ceases.'
  divergence: Ibn Arabi's formulation emphasizes the paradoxical simultaneity of knowing and being known by the Divine, while the Isavasya frames the result (cessation of delusion) rather than the recursive structure of the knowing itself.
  passage_id: isavasya_upanishad.isa_013
