sutra_id: KYS_P033
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #33'
sanskrit: ''
transliteration: ''
translation: He did not say, Whoever annihilates their self, knows their Lord. Your being is nothing and whatever is nothing cannot be placed in relationship to anything else, whether it is capable of passing away or not and whether it is existent or nonexistent.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
