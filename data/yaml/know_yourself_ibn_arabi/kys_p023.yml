translation: You have neither ceased to be nor are you existent. You are Him and He is you, without any of these imperfections. If you know your existence in this way, then you know God, and if not, then not.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
