sutra_id: KYS_P023
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #23'
sanskrit: ''
transliteration: ''
translation: You have neither ceased to be nor are you existent. You are Him and He
  is you, without any of these imperfections. If you know your existence in this way,
  then you know God, and if not, then not.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
- consciousness
