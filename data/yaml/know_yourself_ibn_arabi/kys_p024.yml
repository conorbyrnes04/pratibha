sutra_id: KYS_P024
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #24'
sanskrit: ''
transliteration: ''
translation: You are Him and He is you, without any of these imperfections. If you know your existence in this way, then you know God, and if not, then not. Most of those who claim to know God make the knowledge of God dependent on the passing away of existence and on the passing away of that passing away.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
