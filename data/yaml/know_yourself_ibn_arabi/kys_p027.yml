sutra_id: KYS_P027
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #27'
sanskrit: ''
transliteration: ''
translation: That is clearly an error and misconception. The knowledge of God does
  not require the passing away of existence or the passing away of that passing away
  because things have no existence and what does not exist cannot pass away.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
