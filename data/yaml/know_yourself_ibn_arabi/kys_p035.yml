sutra_id: KYS_P035
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #35'
sanskrit: ''
transliteration: ''
translation: The Prophet alluded to the fact that you are nonexistent now as you were nonexistent before creation, because now is eternity-without-beginning and now is eternity-without-end and now is timelessness. God is the very being of eternity-without-beginning, eternity-without-end and timelessness even though in reality there is no eternity-without-beginning, eternity-with-out-end or timelessness.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
