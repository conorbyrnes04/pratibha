sutra_id: KYS_P011
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #11'
sanskrit: ''
transliteration: ''
translation: No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows Him. His prophet is He, His messenger is He, His message is He and His word is He. He sent Himself from Himself, through Himself to Himself.
commentary: This line points to a deeper order that is received through attentive listening rather than conceptual noise.
