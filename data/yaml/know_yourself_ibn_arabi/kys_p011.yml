sutra_id: KYS_P011
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #11'
sanskrit: ''
transliteration: ''
translation: No one other than He sees Him. No sent prophet, perfect saint or angel
  brought close knows Him. His prophet is He, His messenger is He, His message is
  He and His word is He. He sent Himself from Himself, through Himself to Himself.
commentary: This line points to a deeper order that is received through attentive
  listening rather than conceptual noise.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: For 2 minutes, observe inner speech as sound only. Return to the silent awareness
  that hears it.
themes:
- consciousness
- nonduality
- speech
voice_of_siva: ''
glossary: []
