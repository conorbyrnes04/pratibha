translation: By making the knowledge of God dependent on the passing away of your existence and the passing away of that passing away, there is an affirmation of something other than God. The Prophet said, Whoever knows their self, knows their Lord.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
