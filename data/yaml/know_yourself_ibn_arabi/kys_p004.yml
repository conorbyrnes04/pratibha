sutra_id: KYS_P004
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #4'
sanskrit: ''
transliteration: ''
translation: He is not in anything and no thing is in Him, whether entering into Him or coming out of Him. It is in this way that you should know Him and not through theoretical knowledge, reason, understanding or conjecture, nor with the senses, the external eye or interior sight or perception. No one sees Him except Himself, no one reaches Him except Himself and no one knows Him except Himself.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
