translation: That does not mean that you have being and you are qualified by this or that attribute. What is meant is that you never were and never will be, whether through yourself or through Him or in Him or with Him.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
