resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts locate ignorance not in the absence of the Self but in misdirected attention: the soul/self continuously acts or exists, yet remains unknown because awareness is absorbed in external content rather than turning to its own source.'
  divergence: Ibn Arabi frames self-knowledge as the gateway to divine knowledge (vertical ascent); Plotinus frames it as recovery of the soul's natural self-awareness (horizontal return to center).
  passage_id: plotinus_enneads.enn_v_1_12
- citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
  resonance: Both establish a method where inquiry into the nature of the self (through sound/mantra in Mandukya, through self-recognition in Ibn Arabi) becomes a complete path to ultimate reality, not a preliminary step.
  divergence: Mandukya uses systematic correspondence and phonetic analysis as the vehicle; Ibn Arabi relies on direct inversion of attention from object to subject.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
