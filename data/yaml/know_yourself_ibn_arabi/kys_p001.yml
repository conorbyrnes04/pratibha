sutra_id: KYS_P001
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #1'
sanskrit: ''
transliteration: ''
translation: Praise belongs to God, before whose oneness there is no before unless
  the before is He and after whose singleness there is no after unless the after is
  He. He is, and there is not with Him any before or after, above or below, closeness
  or distance, how or where or when, time or moment or duration, manifested existence
  or place.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
- consciousness
- nonduality
voice_of_siva: ''
glossary: []
