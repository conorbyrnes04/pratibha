sutra_id: KYS_P020
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #20'
sanskrit: ''
transliteration: ''
translation: It is not that He enters into you or that you enter into Him, or that He comes out of you or that you come out of Him. That does not mean that you have being and you are qualified by this or that attribute. What is meant is that you never were and never will be, whether through yourself or through Him or in Him or with Him.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
