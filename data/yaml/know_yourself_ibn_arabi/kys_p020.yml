resonances:
- citation: Siva Sutra — Śāktopāya
  resonance: Both texts locate knowledge or realization in the quality and direction of attention itself rather than in content or object. Ibn Arabi negates subject-object merger to redirect attention inward to the knower; the Siva Sutra identifies sustained attention as the very substance of knowledge.
  divergence: Ibn Arabi emphasizes negation and non-duality to clarify the knower's independence; the Siva Sutra affirms attention as an active, positive principle of consciousness that generates knowledge.
  passage_id: siva_sutra.ss_ii_12
- citation: Yoga Spandakarika — Third Flow
  resonance: 'Both texts describe a reversal of ordinary attention: the target becomes clearer not through direct pursuit but through a shift in the quality of attending—Ibn Arabi by withdrawing from subject-object oscillation, the Yoga Spandakarika by ardent striving that paradoxically reveals what escapes ordinary perception.'
  divergence: Ibn Arabi's method is apophatic (negating false relations), while the Yoga Spandakarika employs dynamic effort and multi-angled perception to access the sacred tremor.
  passage_id: yoga_spandakarika.sp_36
