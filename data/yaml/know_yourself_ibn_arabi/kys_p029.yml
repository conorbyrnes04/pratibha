sutra_id: KYS_P029
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #29'
sanskrit: ''
transliteration: ''
translation: Passing away implies the prior existence of the thing that passes away. If you know yourself without existing and passing away, then you know God, and if not, then not. By making the knowledge of God dependent on the passing away of your existence and the passing away of that passing away, there is an affirmation of something other than God.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
