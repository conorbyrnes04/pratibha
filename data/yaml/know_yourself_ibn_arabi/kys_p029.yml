sutra_id: KYS_P029
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #29'
sanskrit: ''
transliteration: ''
translation: Passing away implies the prior existence of the thing that passes away.
  If you know yourself without existing and passing away, then you know God, and if
  not, then not. By making the knowledge of God dependent on the passing away of your
  existence and the passing away of that passing away, there is an affirmation of
  something other than God.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
