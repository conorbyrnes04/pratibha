translation: He is, and there is not with Him any before or after, above or below, closeness or distance, how or where or when, time or moment or duration, manifested existence or place. And He is now as He has always been. He is the one without oneness and the single without singleness.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
