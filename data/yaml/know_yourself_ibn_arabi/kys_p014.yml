sutra_id: KYS_P014
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #14'
sanskrit: ''
transliteration: ''
translation: There is no difference between the sender, that which is sent and the one to whom it is sent. The very existence of the prophetic message is His existence. There is no existence to any other who could pass away, or have a name or be named. Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their self, knows their Lord.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
