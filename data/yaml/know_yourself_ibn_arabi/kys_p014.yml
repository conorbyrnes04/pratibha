resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts locate the problem of self-knowledge in a misdirection of attention: the soul/self continuously acts or manifests, but remains unrecognized because awareness is absorbed in external content (sense-experiences, passing phenomena). Clarity requires redirecting attention inward to the source itself.'
  divergence: Plotinus frames this as a perceptual blindness within a hierarchical emanationist cosmos; Ibn Arabi's formulation collapses the distinction between knower, knowing, and known into radical non-duality, making the inward turn a dissolution of subject-object structure rather than a reorientation within it.
  passage_id: plotinus_enneads.enn_v_1_12
- citation: 'Vijnana Bhairava — Yukti #61'
  resonance: 'Both passages point to a recognition that occurs when attention ceases to track multiplicity and returns to undifferentiated ground: the Self manifests in the Void precisely as the collapse of sender-sent-receiver distinctions; nonduality reveals itself when the apparatus of differentiation is suspended.'
  divergence: The Vijnana Bhairava frames this as entry into a phenomenological state (the Void); Ibn Arabi's formulation is more radically metaphysical—it asserts an ontological non-difference that was always already the case, not a state to be entered.
  passage_id: vijnana_bhairava.yukti_061
