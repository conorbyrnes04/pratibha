resonances:
- citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
  resonance: Both texts use radical negation to point toward a non-dual reality that cannot be grasped by conceptual categories. The Mandukya's Turīya negates all states of consciousness (inward, outward, both, mass, consciousness itself) just as Ibn Arabi's 'veil is His oneness' negates all veils except the Self—each move dissolves the subject-object duality by exhausting false positions.
  divergence: The Mandukya negates through enumeration of states to reach a fourth transcendent principle; Ibn Arabi negates through the paradox of self-veiling to reveal immediate unity, emphasizing the Sufi doctrine of annihilation (fanā') rather than the Vedantic ascent to Turīya.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
- citation: Pratyabhijnahrdayam — Sutra 13
  resonance: 'Both passages locate liberation in direct recognition of authorship or agency: Ibn Arabi''s ''nothing veils Him other than Him'' mirrors the Pratyabhijnahrdayam''s recognition that consciousness itself is the author of all manifestation, collapsing the veil between knower and known through self-recognition.'
  divergence: The Pratyabhijnahrdayam emphasizes the mind's ascent through introversion to Supreme Consciousness; Ibn Arabi emphasizes the paradoxical self-veiling that reveals oneness, grounding the insight in the Sufi principle that God alone is the true agent.
  passage_id: pratyabhijnahrdayam.phr_013
- citation: Svetasvatara Upanishad — Knowledge and Ignorance in the Imperishable
  resonance: Both texts identify the fundamental problem as a hidden duality—Ibn Arabi's veil of oneness and the Svetasvatara's 'knowledge and ignorance hidden in Brahman'—suggesting that the apparent separation between knower and known is itself the structure that must be seen through.
  divergence: The Svetasvatara treats knowledge and ignorance as two principles to be discriminated within Brahman; Ibn Arabi treats the veil as a single paradoxical unity (His oneness itself), emphasizing non-dual recognition over dualistic discernment.
  passage_id: svetasvatara_upanishad.svu_013
