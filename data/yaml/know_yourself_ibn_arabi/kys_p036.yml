sutra_id: KYS_P036
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #36'
sanskrit: ''
transliteration: ''
translation: God is the very being of eternity-without-beginning, eternity-without-end
  and timelessness even though in reality there is no eternity-without-beginning,
  eternity-with-out-end or timelessness. If it were otherwise, He would not be alone,
  without any associate.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
- consciousness
- nonduality
voice_of_siva: ''
glossary: []
