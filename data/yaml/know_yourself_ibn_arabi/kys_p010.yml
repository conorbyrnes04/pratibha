  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal one direct insight.
abhyasa: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
