resonances:
- citation: Heraclitus Fragments — Fragment 2
  resonance: Both passages describe a universal principle (Logos/Divine Oneness) that remains structurally inaccessible to ordinary awareness despite its constant presence. The barrier is not the principle's absence but humanity's failure to perceive what is always already given.
  divergence: Heraclitus emphasizes the Logos as a rational universal law that people fail to recognize through inattention; Ibn Arabi locates the concealment in the very nature of Divine Oneness itself, requiring receptive listening rather than rational apprehension.
  passage_id: heraclitus_fragments.hfr_p002
- citation: 'Vijnana Bhairava — Yukti #104'
  resonance: Both texts propose that direct realization occurs through sustained meditative attention to a formulation or principle (the Divine attributes in Vijnana Bhairava; the concealed Oneness in Ibn Arabi) that dissolves the distinction between knower and known.
  divergence: Vijnana Bhairava uses explicit verbal formulas and systematic yukti practice as the vehicle; Ibn Arabi emphasizes attentive listening to silence and the non-conceptual reception of what cannot be named.
  passage_id: vijnana_bhairava.yukti_104
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
  resonance: Both passages assert that ordinary perception and conceptual knowledge obstruct access to a unifying principle, and that a shift in understanding—from multiplicity to essential unity—enables perception of what is normally imperceptible.
  divergence: Chāndogya frames this as instruction in non-dual knowledge (Brahman); Ibn Arabi frames it as the concealment of Being by Oneness itself, a metaphysical condition rather than an epistemological correction.
  passage_id: chāndogya_upaniṣad.chu_vi_01
