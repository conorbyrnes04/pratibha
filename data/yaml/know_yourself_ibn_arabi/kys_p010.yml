sutra_id: KYS_P010
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #10'
sanskrit: ''
transliteration: ''
translation: His being is concealed by His oneness without any condition. No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows Him. His prophet is He, His messenger is He, His message is He and His word is He.
commentary: This line points to a deeper order that is received through attentive listening rather than conceptual noise.
