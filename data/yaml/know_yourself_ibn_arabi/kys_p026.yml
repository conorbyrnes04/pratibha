resonances:
- citation: Heraclitus Fragments
  resonance: 'Both passages diagnose a false knowledge that masquerades as true knowledge: Heraclitus observes that people lack understanding of daily encounters yet believe themselves knowledgeable; Ibn Arabi identifies claimants to God-knowledge who mistake a particular epistemic procedure (annihilation of existence) for actual knowledge of God. Each text exposes a structural confusion between the appearance of knowing and genuine knowing.'
  divergence: Heraclitus locates the error in inattention to the universal Logos accessible through listening; Ibn Arabi locates it in a methodological trap where practitioners confuse the dissolution of self with access to divine knowledge, requiring a different kind of recognition.
  passage_id: heraclitus_fragments.hfr_p005
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
  resonance: 'Both texts point toward a knowledge that transcends ordinary cognitive categories by negating the subject-object distinction: the Upaniṣad teaches that knowing the unknowable requires understanding essential oneness; Ibn Arabi suggests that true God-knowledge requires the passing away of the knower''s existence itself, dissolving the duality that sustains conventional knowing.'
  divergence: The Upaniṣad frames this as a positive instruction in non-dual perception; Ibn Arabi frames it as a critique of those who mistake the *process* of annihilation for the *knowledge* itself, emphasizing the danger of reifying the method.
  passage_id: chāndogya_upaniṣad.chu_vi_01
