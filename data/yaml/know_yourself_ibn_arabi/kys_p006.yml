translation: No one sees Him except Himself, no one reaches Him except Himself and no one knows Him except Himself. He knows Himself through Himself and He sees Himself by means of Himself. No one but He sees Him.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
