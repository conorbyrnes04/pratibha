title: 'Pearl #7'
sanskrit: ''
transliteration: ''
translation: He knows Himself through Himself and He sees Himself by means of Himself. No one but He sees Him. His veil is His oneness since nothing veils Him other than Him. His own being veils Him.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
