translation: He sent Himself from Himself, through Himself to Himself. There is no intermediary or means other than Him. There is no difference between the sender, that which is sent and the one to whom it is sent. The very existence of the prophetic message is His existence.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
