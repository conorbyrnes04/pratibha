resonances:
- citation: Siva Sutra — Śāktopāya
  resonance: 'Both texts make attention itself the primary instrument of knowledge: Ibn Arabi''s return of attention to the knower (rather than content) structurally mirrors the Siva Sutra''s equation of sustained attention with knowledge itself. In both, the shift is from what is known to the quality of knowing.'
  divergence: Ibn Arabi frames this as a reflexive movement of the divine Self (Himself to Himself), while the Siva Sutra treats attention as a yogic practice accessible to the practitioner; one is metaphysical circularity, the other is methodological discipline.
  passage_id: siva_sutra.ss_ii_12
- citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
  resonance: 'Both passages establish a correspondence between an inner principle (the Self/Atman) and a mediating form (Om''s four quarters, or the triadic self-sending): each uses structural analysis to map the knower onto a symbolic system that enables self-inquiry.'
  divergence: Ibn Arabi's self-sending is a single reflexive act of divine consciousness, while the Mandukya uses phonetic correspondence as an analytical tool to stabilize the mind in meditation; one is ontological, the other is epistemological.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
- citation: Yoga Spandakarika — Third Flow
  resonance: 'Both texts describe clarity arising through intensified attention directed inward: the Yoga Spandakarika''s ardent striving toward the supreme tremor parallels Ibn Arabi''s inward return of attention, where effort and focus dissolve obscuration.'
  divergence: Ibn Arabi emphasizes the reflexive nature of attention (returning to the knower), while the Yoga Spandakarika frames it as striving toward an external-yet-inner sacred principle; the former is self-referential, the latter is devotional.
  passage_id: yoga_spandakarika.sp_36
