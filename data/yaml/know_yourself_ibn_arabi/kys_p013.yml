sutra_id: KYS_P013
collection: Know Yourself (Ibn Arabi / Balyani)
section: wisdom_pearl
title: 'Pearl #13'
sanskrit: ''
transliteration: ''
translation: He sent Himself from Himself, through Himself to Himself. There is no
  intermediary or means other than Him. There is no difference between the sender,
  that which is sent and the one to whom it is sent. The very existence of the prophetic
  message is His existence.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Contemplate this pearl slowly in silence for 3-5 minutes, then journal
    one direct insight.
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
themes:
- consciousness
- nonduality
voice_of_siva: ''
