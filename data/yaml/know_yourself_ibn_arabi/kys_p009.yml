translation: His own being veils Him. His being is concealed by His oneness without any condition. No one other than He sees Him. No sent prophet, perfect saint or angel brought close knows Him.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
