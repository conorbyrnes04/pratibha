resonances:
- citation: Svetasvatara Upanishad — The One Hidden in All Beings
  resonance: 'Both texts posit a fundamental veiling: Ibn Arabi''s ''own being veils Him'' mirrors the Svetasvatara''s ''hidden in all beings''—each tradition locates the ultimate reality as simultaneously present and obscured by the very manifestation through which it appears.'
  divergence: Ibn Arabi emphasizes the veil as ontological self-concealment (the divine nature itself conceals), while Svetasvatara frames hiddenness as a spatial or perceptual condition (the witness remains hidden *within* beings, awaiting recognition).
  passage_id: svetasvatara_upanishad.svu_003
- citation: Isavasya Upanishad — Mantra 7
  resonance: 'Both passages point to a direct non-dual recognition that dissolves the subject-object split: ''His own being veils Him'' and ''For one who sees unity, what delusion and what sorrow remain?'' both suggest that the veil *is* the illusion of separation, dissolved in immediate seeing.'
  divergence: Ibn Arabi's formulation emphasizes the paradox of veiling itself as the mechanism, while Isavasya locates the shift in the *seeing* (dṛṣṭi) that recognizes unity, making knowledge rather than ontological structure the pivot.
  passage_id: isavasya_upanishad.isa_013
- citation: Astavakra Gita — Key Verses from Chapters 3–7
  resonance: 'Both texts dissolve the apparent solidity of individual existence into a non-dual ground: ''His own being veils Him'' parallels the recognition ''so''ham asmīti'' (I am That)—the separate self-sense is revealed as the veil obscuring the singular reality.'
  divergence: Astavakra's approach is epistemological (knowledge of identity dissolves the veil), while Ibn Arabi's is metaphysical (being itself is the veiling mechanism, requiring grace rather than gnosis alone).
  passage_id: astavakra_gita.asg_sum_key_verses_from_chapters_3_7
