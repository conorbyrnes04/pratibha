title: 'Pearl #17'
sanskrit: ''
transliteration: ''
translation: Because of this, the Prophet, God bless him and give him peace, said, Whoever knows their self, knows their Lord. He also said, I knew my Lord through my Lord. What the Prophet pointed out by that, is that you are not you but you are Him and there is no you.
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
