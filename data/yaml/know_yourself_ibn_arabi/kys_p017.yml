resonances:
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 8
  resonance: 'Both texts locate self-knowledge through a turning of attention inward to a center or source: Ibn Arabi''s inward turn to the knower (rather than passing content) structurally mirrors Plotinus''s soul revolving around its own centre as the source of being. Each makes the move from periphery (content/sense) to center (source/knower).'
  divergence: Plotinus grounds this in the soul's natural metaphysical structure; Ibn Arabi frames it as a prophetic teaching about the relationship between self-knowledge and divine knowledge, making the move soteriologically urgent rather than ontologically descriptive.
  passage_id: plotinus_enneads.enn_vi_9_08
- citation: Mandukya Upanishad and Gaudapada Karika — Verses 8–12 · Om and the Fourfold Correspondence
  resonance: Both establish a method where inquiry into the self (through sound-meditation in Mandukya, through inward attention in Ibn Arabi) becomes a complete path of self-realization. The self is not merely an object of knowledge but the instrument and goal of inquiry.
  divergence: Mandukya uses phonetic correspondence and fourfold analysis as its structural method; Ibn Arabi relies on prophetic utterance and the paradox that knowing self reveals the Lord, embedding the inquiry in a theistic framework rather than a systematic correspondence.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_010
