resonances:
- citation: Pratyabhijnahrdayam — Sutra 12
  resonance: 'Both texts posit that ignorance of one''s true nature (authorship/existence) is the root condition, and that direct recognition of this authorship/existence constitutes liberation or true knowledge. The move is: self-ignorance → recognition of one''s own power/existence → knowledge.'
  divergence: Ibn Arabi frames this as a conditional gate to knowing God (vertical transcendence), while Pratyabhijnahrdayam frames it as recognition of one's own authorship of cosmic processes (non-dual immanence).
  passage_id: pratyabhijnahrdayam.phr_012
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
  resonance: 'Both texts present knowledge as a unifying insight that dissolves the apparent multiplicity of phenomena into essential oneness. The structural move is: instruction/teaching → perception of imperceptible unity → knowledge of the Real.'
  divergence: Ibn Arabi's formulation is a direct conditional (if you know X, then you know Y), while Chāndogya frames knowledge as mediated through instruction and the perception of imperceptible essence across all things.
  passage_id: chāndogya_upaniṣad.chu_vi_01
- citation: Heraclitus Fragments
  resonance: 'Both texts diagnose a fundamental gap between apparent self-knowledge and true knowledge: people believe they understand their own existence/nature, but this belief masks actual ignorance. The move is: false certainty about one''s condition → recognition of actual non-knowing.'
  divergence: Ibn Arabi uses this gap as a threshold to God-knowledge (metaphysical consequence), while Heraclitus uses it to critique the majority's failure to grasp the universal Logos (epistemological critique).
  passage_id: heraclitus_fragments.hfr_p005
