translation: If you know your existence in this way, then you know God, and if not, then not. Most of those who claim to know God make the knowledge of God dependent on the passing away of existence and on the passing away of that passing away.
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself directly.'
