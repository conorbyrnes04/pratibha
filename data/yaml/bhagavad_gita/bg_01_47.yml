sutra_id: BG_01_47
collection: Bhagavad Gita
section: chapter_01
title: He Sits Down in the Chariot, Mind Shaken by Grief
sanskrit: 'सञ्जय उवाच


  एवमुक्त्वाऽर्जुनः संख्ये रथोपस्थ उपाविशत्।


  विसृज्य सशरं चापं शोकसंविग्नमानसः'
transliteration: 'sañjaya uvāca


  evamuktvā''rjunaḥ saṃkhye rathopastha upāviśat|


  visṛjya saśaraṃ cāpaṃ śokasaṃvignamānasaḥ'
translation: 'Sañjaya said: Having spoken thus in the midst of battle, Arjuna sat
  down on the chariot seat, casting away his bow and arrows, his mind convulsed by
  sorrow.'
commentary: 'Speech ends in posture. The warrior’s final act in the chapter is *upāviśat*
  — he sits — and *visṛjya* — he releases the bow with its arrows. The contested claim
  is that authentic spiritual teaching in the Gītā requires this abdication of competence.
  *Śoka-saṃvigna-mānasa*: the mind is not mildly sad; it is convulsed, shaken together
  by grief. Chapter 1 refuses to skip to consolation. Sitting becomes the condition
  for hearing. In the architecture of the text, Kṛṣṇa’s yoga begins only when Arjuna’s
  self-as-archer has nowhere left to stand. Existentially, there are crises that cannot
  be solved from the standing identity that produced them. Sometimes the honest move
  is to put down the instrument of your expertise and admit that your mind is overrun.
  That admission is not the end of dharma; in this book, it is how dharma becomes
  teachable.


  Sitting is not the end of the warrior; it is the beginning of the student. The released
  bow creates the empty hands that can receive teaching. Chapter 1’s genius is to
  make collapse sacred data rather than a scene to skip.


  Key Terms:


  **rathopastha (रथोपस्थ)** — chariot seat/lap of the car → the teaching seat created
  by collapse → “chariot” alone misses the seated threshold.


  **visṛjya (विसृज्य)** — having cast away/released → deliberate relinquishing of
  the warrior tool → “dropped” can sound accidental; the participle marks decisive
  release.


  **śoka-saṃvigna-mānasa (शोकसंविग्नमानस)** — mind convulsed by sorrow → grief as
  total mental agitation → “sad at heart” is far too mild.


  Cross-Tradition Resonances:


  **Job 2:13 / 3:1:** Both require a silence or collapse before the deep complaint
  and any answering word can begin.

  *Divergence:* Job’s friends sit in silence then fail; Kṛṣṇa will speak a sustained
  path of knowledge, action, and devotion.


  **Patañjali, Yoga Sūtra 1.12–1.16 (abhyāsa and vairāgya):** Both imply that release
  of grasping (here, of the bow-identity) precedes stable wisdom.

  *Divergence:* YS teaches gradual practice-renunciation; Arjuna’s release is crisis-forced
  and incomplete until teaching reforms action.'
voice_of_siva: ''
abhyasa: 'For ten minutes, set down the tool of your primary competence (phone, keyboard,
  planner, weapon-of-role). Sit, name the grief under your urgency, and do not solve
  it yet.'
