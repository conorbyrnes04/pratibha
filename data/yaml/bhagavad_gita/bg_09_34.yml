sutra_id: BG_09_34
collection: Bhagavad Gita
section: chapter_09
title: Become Mind-of-Me
sanskrit: 'मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।


  मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः'
transliteration: 'manmanā bhava madbhakto madyājī māṃ namaskuru|


  māmevaiṣyasi yuktvaivamātmānaṃ matparāyaṇaḥ'
translation: Become one whose mind is on Me, My devotee, My sacrificer; bow to Me.
  Joining yourself thus, intent on Me as supreme, you will come to Me alone.
commentary: 'Chapter 9 closes as imperative cascade: mind on Me, My devotee, My sacrificer,
  bow to Me — then joining with Me as supreme aim guarantees coming to Me alone. The
  contested simplicity is that the royal secret culminates not in more cosmology but
  in a form of life aimed entirely at the Lord. Existentially this is the exam: not
  whether you can explain sovereign yoga, but whether mind, devotion, offering, and
  bow are becoming one orientation. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The
  teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. Live one concrete implication of the
  claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **manmanā formula** — Sanskrit technical force in this passage -> mind, devotee,
  sacrificer, bow — come to Me alone -> default English flattens the contested philosophical
  work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the
  verse does with the term -> "bhakti" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> mind,
  devotee, sacrificer, bow — come to Me alone -> reducing either to emotion alone
  loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  mind, devotee, sacrificer, bow — come to Me alone.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
