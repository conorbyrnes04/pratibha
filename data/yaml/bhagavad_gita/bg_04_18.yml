sutra_id: BG_04_18
collection: Bhagavad Gita
section: chapter_04
title: See Non-Action in Action, Action in Non-Action
sanskrit: 'कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः।


  स बुद्धिमान् मनुष्येषु स युक्तः कृत्स्नकर्मकृत्'
transliteration: 'karmaṇyakarma yaḥ paśyedakarmaṇi ca karma yaḥ|


  sa buddhimān manuṣyeṣu sa yuktaḥ kṛtsnakarmakṛt'
translation: Who would see non-action in action, and action in non-action — that one
  is wise among humans, integrated [yukta], the doer of the whole of actions.
commentary: 'The chapter’s knot is visual: buddhi sees akarma inside karma and karma
  inside akarma. The contested claim overturns both workaholic and quietist optics.
  Outer performance can be non-binding (akarma-in-karma) when free of appropriative
  doership; outer stillness can be binding action (karma-in-akarma) when charged with
  avoidance, fantasy, or control. The one who sees thus is not less active but kṛtsna-karma-kṛt
  — accomplishing the whole of action by not misreading its essence. In Advaita and
  karma-yoga readings alike, this is the eye that liberates without exiting the field.
  Existentially, ask of every deed and every pause: where is the binding? Visibility
  of that binding is wisdom. Wisdom is an optics before it is a lifestyle brand. Seeing
  non-action in action means detecting non-binding inside performance; seeing action
  in non-action means detecting binding inside stillness, avoidance, and fantasy.
  The “whole of actions” is accomplished by this seeing because misread deeds endlessly
  restart the ledger. Quietism and workaholism are twin failures of vision. Become
  the one who can read both surfaces without being fooled by either costume.


  Key Terms:


  **karmaṇy akarma (कर्मण्यकर्म)** — non-action in action -> unbound agency within
  performance -> the yogic seeing that breaks literalism


  **akarmaṇi karma (अकर्मणि कर्म)** — action in non-action -> binding happening inside
  apparent stillness -> exposes withdrawal as possible karma


  **kṛtsnakarmakṛt (कृत्स्नकर्मकृत्)** — doer of the entirety of action -> completeness
  through right seeing, not through maximal busyness


  Cross-Tradition Resonances:


  **DaoDeJing’s wei wuwei:** Structural homology in action that does not act possessively
  / non-action that is efficacious.

  *Divergence:* Daoist phrasing often naturalizes spontaneity; the Gītā frames the
  paradox as buddhi’s discriminative seeing toward yogic integration.


  **Eckhart on working without why:** Structural homology in deeds unbound by possessive
  purpose.

  *Divergence:* Eckhart’s ground is Godhead detachment; here the paradox is explicitly
  bi-directional (including action hidden in non-action).'
voice_of_siva: ''
abhyasa: Pick one busy act and one refusal today; in each, locate the clinging. Practice
  the busy act without claim, and refuse only what is not avoidance dressed as holiness.
