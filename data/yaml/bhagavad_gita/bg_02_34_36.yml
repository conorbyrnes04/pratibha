sutra_id: BG_02_34_36
collection: Bhagavad Gita
section: chapter_02
title: Dishonor Is Worse Than Death for One Long Honored
sanskrit: 'अकीर्तिं चापि भूतानि कथयिष्यन्ति तेऽव्ययाम्।


  संभावितस्य चाकीर्तिर्मरणादतिरिच्यते


  भयाद्रणादुपरतं मंस्यन्ते त्वां महारथाः।


  येषां च त्वं बहुमतो भूत्वा यास्यसि लाघवम्


  अवाच्यवादांश्च बहून् वदिष्यन्ति तवाहिताः।


  निन्दन्तस्तव सामर्थ्यं ततो दुःखतरं नु किम्'
transliteration: 'akīrtiṃ cāpi bhūtāni kathayiṣyanti te''vyayām|


  saṃbhāvitasya cākīrtirmaraṇādatiricyate


  bhayādraṇāduparataṃ maṃsyante tvāṃ mahārathāḥ|


  yeṣāṃ ca tvaṃ bahumato bhūtvā yāsyasi lāghavam


  avācyavādāṃśca bahūn vadiṣyanti tavāhitāḥ|


  nindantastava sāmarthyaṃ tato duḥkhataraṃ nu kim'
translation: “Beings will also recount your undying dishonor; for one who has been
  esteemed, dishonor exceeds death. The great chariot-warriors will think you withdrew
  from battle out of fear, and having been highly regarded by them, you will come
  to lightness. Your enemies will speak many unsayable words, scorning your capacity
  — what could be more painful than that?”
commentary: 'Kṛṣṇa uses honor-shame as medicinal rhetoric. For a *saṃbhāvita* — one
  long held in high regard — *akīrti* outweighs death. The contested move is appealing
  to reputation after teaching the deathless Self. The Gītā does not pretend Arjuna
  is already established in that vision; it meets him with the language his present
  identity still feels. Fear of being read as fear becomes part of the counsel. Existentially,
  this layer is double-edged: reputation can be ego-bondage, yet public trust is also
  a real good. Ask whether your withdrawal protects conscience or only manages image
  — and whether staying would be vanity or fidelity.


  Honor-speech meets Arjuna where he still lives. Reputation is neither ultimate nor
  nothing. Sort image-fear from conscience-fear, or both will drive you and neither
  will free you.


  Being taken lightly after being esteemed hurts because trust is real. Still, yoga
  will not let akīrti be ultimate. Hold reputation as secondary good under svadharma,
  not as a god.


  Rank reputation below conscience without pretending public trust is unreal; sort
  image-fear from moral fear.


  Key Terms:


  **akīrti (अकीर्ति)** — dishonor/ill-fame → lasting social unmaking of name → “bad
  reputation” is thinner than undying un-glory.


  **saṃbhāvita (संभावित)** — one held in honor/esteem → prior dignity that makes shame
  cut deeper → “respected person” misses the weight of being long regarded.


  **lāghava (लाघव)** — lightness/triviality → fall from gravitas to being taken lightly
  → “disgrace” is related; the image is loss of weight.


  Cross-Tradition Resonances:


  **Aristotle, Nicomachean Ethics IV.3 (magnanimity and honor):** Both take honor
  seriously as a real human good for the excellent.

  *Divergence:* Aristotle orders honor under virtue; the Gītā will soon relativize
  fruit and fame under yoga.


  **Homeric shame-culture (Iliad, Hector and Achilles):** Both treat public reading
  of courage/cowardice as existentially heavy.

  *Divergence:* Homer remains within kleos; the Gītā embeds honor-speech inside a
  turn toward Self-knowledge and non-possessive action.'
voice_of_siva: ''
abhyasa: Write the reputation-story you fear if you act, and the one you fear if you
  don’t. Mark which fear is conscience and which is image-management.
