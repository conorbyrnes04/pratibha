sutra_id: BG_14_26
collection: Bhagavad Gita
section: chapter_14
title: Unswerving Devotion Crosses the Guṇas
sanskrit: मां च योऽव्यभिचारेण भक्ितयोगेन सेवते।स गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते
transliteration: māṃ ca yo'vyabhicāreṇa bhakitayogena sevate|sa guṇānsamatītyaitān
  brahmabhūyāya kalpate
translation: The one who serves Me with the yoga of devotion that does not stray crosses
  beyond these guṇas and becomes fit for becoming Brahman.
commentary: 'Transcendence is not a DIY heroics of indifference. The one who serves
  Krishna with avyabhicāreṇa bhakti-yogena crosses the guṇas and becomes fit for brahma-bhūya—becoming
  Brahman. The contested move stitches bhakti into guṇa theory: love that does not
  stray is the ferry beyond qualitative bondage. Evenness without devotion can become
  sterile spectatorship; devotion without evenness can become another rajasic project.
  Together they ripen fitness for Brahman-being. In the chapter’s logic, this verse
  prevents a cold reading of guṇātīta as mere aloofness. Existentially, service becomes
  the way the transcender stays human and warm while unbound. The question is not
  “Have I achieved indifference?” but “Is my yoga of love still taking side doors?”
  Unstraying means the heart has one refuge even while the guṇas continue their weather
  in the body-field. This is not ornamental theology; it is a demand that lived climate,
  ethical stance, and metaphysical claim stay braided in one practice of seeing.


  Key Terms:


  **avyabhicāreṇa (अव्यभिचारेण)** — without straying -> fidelity of devotion -> ''loyalty''
  can sound merely institutional.

  **bhakti-yoga (भक्तियोग)** — yoga of devotion -> service as crossing-means -> ''faith
  practice'' understates yogic crossing.

  **brahma-bhūya (ब्रह्मभूय)** — becoming Brahman -> fitness for Brahman-state ->
  ''union with God'' may blur this exact idiom.


  Cross-Tradition Resonances:


  **[Gītā 12’s unswerving devotee]:** Same fidelity language now explicitly guṇa-crossing.

  *Divergence:* Chapter 12 ranks paths; 14.26 makes non-straying devotion the engine
  past the three strands.

  **[Bernard of Clairvaux on ordered love]:** Love rightly ordered liberates from
  disordered attachments.

  *Divergence:* Cistercian love orders to Christ; here devotion fits one for Brahman-being
  beyond guṇas.'
voice_of_siva: ''
abhyasa: Offer one ordinary act today as unstraying service—no side altar of image-management.
  Let that be your guṇa-crossing practice.
