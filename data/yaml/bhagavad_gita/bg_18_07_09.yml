sutra_id: BG_18_07_09
collection: Bhagavad Gita
section: chapter_18
title: 'Three Relinquishments: Dark, Passionate, Luminous'
sanskrit: 'नियतस्य तु संन्यासः कर्मणो नोपपद्यते।मोहात्तस्य परित्यागस्तामसः परिकीर्तितः

  दुःखमित्येव यत्कर्म कायक्लेशभयात्त्यजेत्।स कृत्वा राजसं त्यागं नैव त्यागफलं लभेत्

  कार्यमित्येव यत्कर्म नियतं क्रियतेऽर्जुन।सङ्गं त्यक्त्वा फलं चैव स त्यागः सात्त्विको
  मतः'
transliteration: 'niyatasya tu saṃnyāsaḥ karmaṇo nopapadyate|mohāttasya parityāgastāmasaḥ
  parikīrtitaḥ

  duḥkhamityeva yatkarma kāyakleśabhayāttyajet|sa kṛtvā rājasaṃ tyāgaṃ naiva tyāgaphalaṃ
  labhet

  kāryamityeva yatkarma niyataṃ kriyate''rjuna|saṅgaṃ tyaktvā phalaṃ caiva sa tyāgaḥ
  sāttviko mataḥ'
translation: Renunciation of prescribed action is not proper; abandoning it out of
  delusion is declared tamasic. The one who abandons action merely as bodily suffering,
  from fear of pain—doing rajasic relinquishment—does not obtain the fruit of relinquishment.
  When prescribed action is done simply because it must be done, O Arjuna, abandoning
  attachment and fruit—that relinquishment is held to be sattvic.
commentary: 'Tyāga itself is trividha. Tamasic: dropping niyata karma from moha. Rajasic:
  dropping because of kāya-kleśa fear—pain-avoidance cosplay as renunciation. Sattvic:
  doing the ought-to-be-done while relinquishing attachment and fruit. The contested
  claim is that the best tyāga looks like faithful action. Existentially, audit your
  abandonments: confusion, comfort, or lucid duty without clutch? Only the third bears
  tyāga’s fruit. In the Gītā’s pedagogy, concept without existential cut becomes another
  ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics.


  Key Terms:


  **niyata karma (नियत कर्म)** — prescribed/regular duty -> what must not be delusion-dropped
  -> ''routine'' understates dharma-weight.

  **kāya-kleśa-bhaya (कायक्लेशभय)** — fear of bodily affliction -> rajasic motive
  for quitting -> ''self-care'' can be genuine or this.

  **kāryam iti (कार्यमिति)** — ''it is to be done'' -> sattvic reason for acting ->
  ''grinding'' is the joyless counterfeit.

  **tāmasa / rājasa / sāttvika tyāga** — three relinquishments -> guṇa map of quitting
  -> ''quitting styles'' as psychology only misses mokṣa stakes.


  Cross-Tradition Resonances:


  **[Gītā 2.47 / 3.19]:** Duty without fruit continues; now guṇa-coded as sattvic
  tyāga.

  *Divergence:* 18.7–9 make wrong quitting explicitly tamasic/rajasic.

  **[Aristotle on courage vs rashness/cowardice]:** Fear-based avoidance as false
  virtue resonates with rajasic tyāga.

  *Divergence:* Aristotle’s mean differs; Krishna’s sattvic pole is duty-with-relinquishment.

  **[Benedictine stability]:** Not abandoning the prescribed from whim or comfort
  resonates.

  *Divergence:* Monastic stability is Christic-communal; here niyata karma is dharma-field
  duty.'
voice_of_siva: ''
abhyasa: 'Identify one duty you are avoiding. Classify the avoidance: delusion, pain-fear,
  or true non-clutch. If the first two, return to the duty without fruit-bargain.'
