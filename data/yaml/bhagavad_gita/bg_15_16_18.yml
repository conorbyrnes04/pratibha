collection: Bhagavad Gita
section: chapter_15
title: The Highest Person Beyond Perishable and Imperishable
sanskrit: 'द्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च।क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर
  उच्यते

  उत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः।यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः

  यस्मात्क्षरमतीतोऽहमक्षरादपि चोत्तमः।अतोऽस्मि लोके वेदे च प्रथितः पुरुषोत्तमः'
transliteration: 'dvāvimau puruṣau loke kṣaraścākṣara eva ca|kṣaraḥ sarvāṇi bhūtāni
  kūṭastho''kṣara ucyate

  uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ|yo lokatrayamāviśya bibhartyavyaya īśvaraḥ

  yasmātkṣaramatīto''hamakṣarādapi cottamaḥ|ato''smi loke vede ca prathitaḥ puruṣottamaḥ'
translation: 'There are two persons in the world: the perishable and the imperishable.
  The perishable is all beings; the imperishable is called the unchanging. But there
  is another, the highest person, called the supreme Self, who, entering the three
  worlds, supports them as the undying Lord. Because I transcend the perishable and
  am higher even than the imperishable, I am celebrated in the world and in the Veda
  as the Person Supreme.'
commentary: 'A triad replaces a duality. Kṣara is all beings; akṣara is the kūṭastha,
  the unchanging. Beyond both is uttama puruṣa / Paramātman / Puruṣottama, who enters
  and supports the three worlds. Krishna’s claim is comparative and absolute: transcending
  perishable and higher than imperishable, he is celebrated as Puruṣottama. The contested
  move is against two reductions: reducing the divine to changing nature, or to a
  static impersonal absolute that cannot love or support. Existentially, refuge aims
  not at becoming a frozen unchanging principle, nor at surfing perishability forever,
  but at the highest person who holds both. In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be
  read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics.


  Key Terms:


  **kṣara / akṣara (क्षर / अक्षर)** — perishable / imperishable -> two persons of
  the world -> ''mortal/immortal'' is too coarse.

  **kūṭastha (कूटस्थ)** — standing at the peak/anvil-fixed -> unchanging person ->
  ''immutable soul'' may miss the technical term.

  **Puruṣottama (पुरुषोत्तम)** — Person Supreme -> beyond both kṣara and akṣara ->
  ''God'' without the triad loses the claim’s precision.

  **bibharti (बिभर्ति)** — supports / bears -> active sustaining of three worlds ->
  ''exists behind'' is too passive.


  Cross-Tradition Resonances:


  **[Śvetāśvatara III–VI]:** Higher than the perishable/imperishable motif appears
  in Upaniṣadic theism.

  *Divergence:* The Gītā crystallizes the title Puruṣottama.

  **[Rāmānuja’s tattva-traya]:** God, souls, matter as structured reality resonates.

  *Divergence:* Exact mappings differ; the verse’s hinge is Krishna’s transcendence
  of both persons.

  **[Christian Trinity debates on personhood]:** Personal Absolute beyond impersonal
  abstraction resonates loosely.

  *Divergence:* Trinitarian grammar differs; here the triad is kṣara/akṣara/Puruṣottama.'
