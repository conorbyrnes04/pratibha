sutra_id: BG_18_70_72
collection: Bhagavad Gita
section: chapter_18
title: Study, Faithful Hearing, and the Lord’s Question
sanskrit: 'अध्येष्यते च य इमं धर्म्यं संवादमावयोः।ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति
  मे मतिः

  श्रद्धावाननसूयश्च श्रृणुयादपि यो नरः।सोऽपि मुक्तः शुभाँल्लोकान्प्राप्नुयात्पुण्यकर्मणाम्

  कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा।कच्चिदज्ञानसंमोहः प्रनष्टस्ते धनञ्जय'
transliteration: 'adhyeṣyate ca ya imaṃ dharmyaṃ saṃvādamāvayoḥ|jñānayajñena tenāhamiṣṭaḥ
  syāmiti me matiḥ

  śraddhāvānanasūyaśca śrṛṇuyādapi yo naraḥ|so''pi muktaḥ śubhā~llokānprāpnuyātpuṇyakarmaṇām

  kaccidetacchrutaṃ pārtha tvayaikāgreṇa cetasā|kaccidajñānasaṃmohaḥ pranaṣṭaste dhanañjaya'
translation: And the one who will study this dialogue of ours on dharma—by that sacrifice
  of knowledge I am worshipped; so I hold. And the person of faith who does not resent,
  even if he only hears—he too, liberated, attains the auspicious worlds of the meritorious.
  Has this been heard by you, O Pārtha, with one-pointed mind? Has your confusion
  born of ignorance been destroyed, O Dhanañjaya?
commentary: 'Reception itself becomes yajña: studying the dharmya saṃvāda is jñāna-yajña
  by which Krishna is worshipped. Even faithful, non-resentful hearing liberates toward
  auspicious worlds. Then the intimate exam: kaccit—has it been heard with ekāgra
  mind? Has ajñāna-saṃmoha been destroyed? The contested pastoral genius ends philosophy
  with a question, not a threat. Existentially, the Gītā asks you the same. Not “Did
  you enjoy the aesthetics?” but “Is the delusion gone?” In the Gītā’s pedagogy, concept
  without existential cut becomes another ornament of bondage; therefore the verse
  must be read as a demand on perception, desire, and refuge, not as a museum label
  on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.


  Key Terms:


  **jñāna-yajña (ज्ञानयज्ञ)** — sacrifice of knowledge -> study as worship -> ''content
  consumption'' fails.

  **śraddhāvān anasūyaḥ (श्रद्धावाननसूयः)** — faithful and non-resentful -> hearer’s
  qualifications -> ''spiritual fan'' understates.

  **ekāgreṇa cetasā (एकाग्रेण चेतसा)** — with one-pointed mind -> quality of hearing
  -> ''multitasking podcast spirituality'' fails.

  **ajñāna-saṃmoha (अज्ञानसंमोह)** — confusion/delusion born of ignorance -> what
  must be destroyed -> ''stress'' is thinner.


  Cross-Tradition Resonances:


  **[Gītā 4.28 / knowledge sacrifice]:** Jñāna-yajña continues.

  *Divergence:* 18.70 makes study of this dialogue itself that sacrifice.

  **[Shema’s ''hear'']:** Hearing as covenantal act resonates.

  *Divergence:* Jewish hearing is Torah-shaped; here hearing is of the Krishna-Arjuna
  saṃvāda.

  **[Socratic elenchus ending in question]:** Philosophical care ending with examination
  resonates.

  *Divergence:* Socrates frees by question; Krishna asks whether delusion is already
  destroyed.'
voice_of_siva: ''
abhyasa: 'Answer Krishna’s questions in writing: Did I hear one-pointedly? What delusion
  remains? Be concrete; do not perform ''yes.'''
