sutra_id: BG_02_37_39
collection: Bhagavad Gita
section: chapter_02
title: Slain You Gain Heaven; Victorious You Enjoy the Earth — Therefore Stand
sanskrit: 'हतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम्।


  तस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः


  सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ।


  ततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि


  एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां शृणु।


  बुद्ध्यायुक्तो यया पार्थ कर्मबन्धं प्रहास्यसि'
transliteration: 'hato vā prāpsyasi svargaṃ jitvā vā bhokṣyase mahīm|


  tasmāduttiṣṭha kaunteya yuddhāya kṛtaniścayaḥ


  sukhaduḥkhe same kṛtvā lābhālābhau jayājayau|


  tato yuddhāya yujyasva naivaṃ pāpamavāpsyasi


  eṣā te''bhihitā sāṃkhye buddhiryoge tvimāṃ śṛṇu|


  buddhyāyukto yayā pārtha karmabandhaṃ prahāsyasi'
translation: “If slain, you will attain heaven; if victorious, you will enjoy the
  earth. Therefore stand up, son of Kuntī, with resolution made for battle. Holding
  pleasure and pain as equal, gain and loss, victory and defeat, then yoke yourself
  to battle; thus you will not incur sin. This understanding has been declared to
  you in Sāṅkhya; now hear it in Yoga. Yoked to this understanding, Pārtha, you will
  cast off the bondage of action.”
commentary: 'Double assurance clears outcome-anxiety: death yields heaven, victory
  yields earth — so stand resolved. Then the deeper solvent: sameness across pleasure/pain,
  gain/loss, victory/defeat. Action without dualistic possession does not generate
  *pāpa* in the same way. The contested transition is named explicitly: this *buddhi*
  was given in Sāṅkhya; now hear it in Yoga — the turn from discriminative knowing
  toward yoking-in-action that releases *karma-bandha*. Existentially, resolution
  (*kṛta-niścaya*) plus equanimity is the pair: not frozen certainty, and not passive
  calm, but decided participation without outcome-possession.


  Resolution plus equanimity opens karma-yoga. Sāṅkhya-buddhi becomes Yoga-buddhi
  when knowing yokes itself to action that can drop bondage. Stand decided without
  needing the fruit to complete your identity.


  Equalizing the pairs does not erase preferences; it erases possessive identity fused
  to preferences. Then battle — or any hard duty — can be yoked without manufacturing
  sin through clinging.


  Equalize the pairs in one hard effort today, then act with resolution that does
  not need applause to complete itself.


  Key Terms:


  **kṛta-niścaya (कृतनिश्चय)** — one who has made resolution → decidedness prior to
  action → “determined” is close; the compound stresses completed deciding.


  **sāṅkhya / yoga (सांख्य / योग)** — discriminative enumeration vs. yoking practice
  → twin modes of the same *buddhi* → not later school labels only; here pedagogical
  phases.


  **karma-bandha (कर्मबन्ध)** — bondage of action → binding appropriation of deeds
  → “karma bondage” must not be read as fatalism; it is sticky agency.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.2–1.3 / 2.1–2.2:** Both move from understanding toward
  yoking that releases binding patterns.

  *Divergence:* YS systematizes eight limbs; Gītā 2.39 pivots from battlefield Sāṅkhya-view
  to karma-yoga.


  **Epictetus, Discourses 1.1:** Both free action by equalizing what is not in our
  control (outcomes) while demanding commitment to what is.

  *Divergence:* Stoicism brackets devotion and rebirth cosmology; the Gītā yokes equanimity
  to dharma and later bhakti.'
