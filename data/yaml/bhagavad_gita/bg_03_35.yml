sutra_id: BG_03_35
collection: Bhagavad Gita
section: chapter_03
title: Better One’s Own Imperfect Dharma
sanskrit: 'श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।


  स्वधर्मे निधनं श्रेयः परधर्मो भयावहः'
transliteration: 'śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt|


  svadharme nidhanaṃ śreyaḥ paradharmo bhayāvahaḥ'
translation: Better is one’s own dharma [svadharma], even defective, than another’s
  dharma well performed; death in one’s own dharma is better; another’s dharma is
  fear-bearing.
commentary: 'Spiritual cosmopolitanism is refused at the point of vocation. The contested
  claim is stark: a flawed inhabiting of one’s own dharma outranks polished performance
  of another’s, even unto preferring death in svadharma to safe excellence elsewhere.
  This is not a celebration of mediocrity; it is a warning that borrowed excellence
  can be ontological exile. In the Gītā’s battlefield context, Arjuna’s temptation
  is precisely paradharma — the Brahmin-like refusal of warrior obligation under the
  guise of compassion. Existentially, fear attaches to living a life that is not yours,
  however admired. The verse demands costly fidelity to the appointed form through
  which your yoga must ripen. Another’s perfect script can still be your ruin. Svadharma’s
  “even imperfect” clause is a scalpel against spiritualized escape. The attraction
  of paradharma is often aesthetic: cleaner narratives, admired roles, less blood
  on the hands. Krishna names that attraction as fear-bearing because it unseats you
  from the only field where your particular bondage and freedom can be worked. Death
  in one’s own dharma is “better” not as a cult of doom but as refusal of a living
  death — the polished life that is not yours.


  Key Terms:


  **svadharma (स्वधर्म)** — own dharma -> the obligation-form belonging to one’s constitution
  and station -> not “personal brand”; the appointed field of practice


  **paradharma (परधर्म)** — another’s dharma -> an alien obligation-form, however
  well executed -> attractiveness is part of its danger


  **viguṇa (विगुण)** — deficient/defective -> imperfect performance that remains existentially
  fitting -> blocks perfectionism as escape route


  Cross-Tradition Resonances:


  **Pindar / Greek ethics of living according to one’s measure:** Structural homology
  in preferring fitting excellence to borrowed grandeur.

  *Divergence:* Greek measure is often aristocratic-aretaic; svadharma is embedded
  in varṇa-duty and liberating yoga.


  **Lutheran vocation (Beruf):** Structural homology in sanctifying one’s given calling
  against spiritual ladder-climbing into another’s role.

  *Divergence:* Christian vocation is framed under justification by faith; the Gītā
  frames svadharma within karmic cosmologies and fear of paradharma.'
voice_of_siva: ''
abhyasa: Identify one duty you avoid because another path looks cleaner; perform a
  concrete piece of your own imperfect dharma today without advertising the sacrifice.
