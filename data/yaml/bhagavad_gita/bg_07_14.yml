sutra_id: BG_07_14
collection: Bhagavad Gita
section: chapter_07
title: Māyā Crossed Only by Refuge
sanskrit: 'दैवी ह्येषा गुणमयी मम माया दुरत्यया।


  मामेव ये प्रपद्यन्ते मायामेतां तरन्ति ते'
transliteration: 'daivī hyeṣā guṇamayī mama māyā duratyayā|


  māmeva ye prapadyante māyāmetāṃ taranti te'
translation: This divine [*daivī*] māyā of Mine, made of the guṇas, is hard to cross
  [*duratyayā*]. Those who take refuge in Me alone cross this māyā.
commentary: 'The veil is not a demon''s trick against God; it is *God''s own* divine
  power, guṇa-constituted and hard to cross. The counterintuitive claim is that the
  obstacle to knowing God is God-authored — *mama māyā* — so technique aimed at "defeating
  illusion by myself" is structurally confused. Crossing happens by *prapadana*: taking
  refuge in the same One whose māyā binds. This is not anti-intellectualism; it is
  a diagnosis of agency. Guṇa-māyā cannot be out-clevered from inside guṇa-logic.
  Existentially, people try to think their way out of fog with the same restless or
  dull mind that generates fog. The verse redirects: change the relational base (refuge),
  and the crossing becomes possible — not because analysis stops, but because analysis
  is no longer the sole climber. Calling māyā daivī blocks the paranoia that the universe
  is a hostile trick. The same Lord who veils also receives refuge. Crossing, therefore,
  is not a jailbreak from God but a return into God against the grain of guṇa-habit.
  This re-reads spiritual struggle: the hardness is expected; the method is relational;
  the pride of "I will outsmart illusion" is itself a guṇa-move. Refuge is not passivity
  — it is the only agency that matches the problem''s scale.


  Key Terms:


  **māyā (माया)** — measuring/artifice/power of appearance -> here the Lord''s divine,
  guṇa-made world-veiling/enabling power -> "illusion" as fake world misses that it
  is *daivī* and *mama*.


  **prapad- (प्रपद्)** — to approach/fall toward/take refuge -> exclusive resort to
  Kṛṣṇa as the crossing method -> "surrender" as emotional collapse misses the technical
  sense of changing where agency is lodged.


  **duratyayā (दुरत्यया)** — hard to cross beyond -> difficulty is structural, not
  accidental -> "difficult" understates intractability from inside the guṇas.


  Cross-Tradition Resonances:


  **Aśvaghoṣa / Mahāyāna on *māyā* as empty appearance:** Both treat appearance as
  not ultimately self-standing.

  *Divergence:* Buddhist *māyā* serves emptiness pedagogy; Gītā''s *māyā* is theistic
  power crossed by refuge in the Lord.


  **Paul, Romans 7 (wretched man / law of mind vs flesh):** Both describe captivity
  that self-effort cannot simply overpower.

  *Divergence:* Paul frames sin and grace in Christ; Gītā frames guṇa-māyā and *prapadana*
  to Kṛṣṇa.'
voice_of_siva: ''
abhyasa: 'When you notice looping mental weather today, stop explaining it for one
  minute and say once, slowly: "This is hard to cross alone; I take refuge." Then
  take the next necessary action without waiting for the weather to clear.'
