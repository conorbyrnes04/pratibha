sutra_id: BG_04_31_33
collection: Bhagavad Gita
section: chapter_04
title: Remainder of Immortality; Knowledge Crowns Sacrifice
sanskrit: 'यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम्।


  नायं लोकोऽस्त्ययज्ञस्य कुतो़ऽन्यः कुरुसत्तम


  एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे।


  कर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे


  श्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप।


  सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते'
transliteration: 'yajñaśiṣṭāmṛtabhujo yānti brahma sanātanam|


  nāyaṃ loko''styayajñasya kuto़''nyaḥ kurusattama


  evaṃ bahuvidhā yajñā vitatā brahmaṇo mukhe|


  karmajānviddhi tānsarvānevaṃ jñātvā vimokṣyase


  śreyāndravyamayādyajñājjñānayajñaḥ parantapa|


  sarvaṃ karmākhilaṃ pārtha jñāne parisamāpyate'
translation: Those who eat the immortal remainder of sacrifice go to the everlasting
  Brahman; this world is not for the non-sacrificer — how then another world, O best
  of Kurus? Thus many kinds of sacrifice are spread out in the mouth of Brahman; know
  them all as born of action; knowing thus, you will be liberated. Better than sacrifice
  consisting of substance is the sacrifice of knowledge, O scorcher of foes; all action
  entire, Pārtha, culminates in knowledge.
commentary: 'Without yajña even this world fails you; with the immortal remainder,
  one goes to sanātana Brahman. Plural sacrifices are “spread in Brahman’s mouth,”
  all karma-born — knowing that liberates. Then ranking arrives without canceling
  pluralism: jñāna-yajña is better than dravya-mayayajña because all action culminates
  (parisamāpyate) in knowledge. The contested claim is teleological: action’s plural
  forms find their completion in jñāna, not in endless accumulation of rites. Existentially,
  keep offering, but aim the offering toward knowing that unbinds. Substance-sacrifice
  without knowledge-culmination can remain a superior shopping. The mouth of Brahman
  receives many gifts; knowledge is the gift that finishes the series. Non-sacrificers
  lose even this world because they interrupt the circuit that makes human life habitable;
  other worlds are then a fantasy atop a ruined base. Knowing plural sacrifices as
  karma-born liberates by revealing their common source and limit. Knowledge-sacrifice
  ranks higher because it completes what material offering begins: action finds its
  end in unbinding insight. Keep giving substance, but aim the gift toward knowing
  that finishes the series rather than toward infinite rite-accumulation.


  Key Terms:


  **yajñaśiṣṭāmṛta (यज्ञशिष्टामृत)** — immortal remainder of sacrifice -> nourishment
  of completed offering -> links chapter 3’s remainder-eating to Brahman-attainment


  **jñānayajña (ज्ञानयज्ञ)** — sacrifice of knowledge -> ranked above material sacrifice
  -> knowledge as offered and offering


  **parisamāpyate (परिसमाप्यते)** — culminates/is completed -> all karma’s completion
  in knowledge -> teleology, not annihilation of action’s value


  Cross-Tradition Resonances:


  **Letter to Hebrews on superior sacrifice:** Structural homology in ranking a more
  complete sacrifice beyond material offerings.

  *Divergence:* Hebrews centers Christ’s self-offering; the Gītā ranks jñāna-yajña
  as culmination of karma-born sacrifices.


  **Aristotle’s hierarchy of contemplative life:** Structural homology in praxis finding
  completion in knowing.

  *Divergence:* Aristotle’s theōria is eudaimonistic; here culmination is liberating
  jñāna within yajña cosmology.'
voice_of_siva: ''
abhyasa: Let one material offering today be accompanied by a sentence of clear knowing
  (“this is karma-born offering toward unbinding”); do not let the gift end at the
  gift.
