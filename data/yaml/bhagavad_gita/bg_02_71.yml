sutra_id: BG_02_71
collection: Bhagavad Gita
section: chapter_02
title: Abandoning All Desires, Moving Free of Longing, Without Mine and I-Making
sanskrit: 'विहाय कामान्यः सर्वान्पुमांश्चरति निःस्पृहः।


  निर्ममो निरहंकारः स शांतिमधिगच्छति'
transliteration: 'vihāya kāmānyaḥ sarvānpumāṃścarati niḥspṛhaḥ|


  nirmamo nirahaṃkāraḥ sa śāṃtimadhigacchati'
translation: “Abandoning all desires, the person who moves without longing, without
  ‘mine,’ without I-making — that one attains peace.”
commentary: 'Motion continues: *carati* — he goes about — but without *kāma*, without
  *spṛhā*, without *mama*, without *ahaṃkāra*. Peace is compatible with a life of
  walking; incompatible with possessive self-manufacturing. The contested claim is
  that *nirahaṃkāra* is not personality-erasure but release of the appropriating “I-am-the-doer/owner”
  reflex. Existentially, practice peace as a way of moving through tasks without the
  private stamp of mine and me.


  Peace walks. Nirmama and nirahaṃkāra are how motion stays clean. Drop the private
  stamp of mine and me-making while the day continues.


  Moving without mine and I-making is peace as locomotion. Try it in speech and errands.
  The day continues; the appropriating stamp does not have to. Peace that cannot walk
  is incomplete. Practice nirmama in motion until the stamp of mine goes quiet.


  Move through an errand without mine-stamping; let peace prove itself as locomotion,
  not as escape. Return once more to the exact image the verse uses; images carry
  claims arguments alone miss.


  Key Terms:


  **niḥspṛha (निःस्पृह)** — without longing → absence of ache-to-obtain while moving
  → “desireless” is blunter.


  **nirmama (निर्मम)** — without mine-ness → non-possessive field of experience →
  “unselfish” is moral; this is ontological de-mining.


  **nirahaṃkāra (निरहंकार)** — without I-making → release of ego-construction → “egoless”
  is popular; the Sanskrit targets the fabricating function.


  Cross-Tradition Resonances:


  **Īśā Upaniṣad 1:** Both pair moving in the world with non-grasping (*mā gṛdhaḥ*).

  *Divergence:* Īśā opens with the Lord’s filling; Gītā specifies desire, mine, and
  I-making as the triad dropped for peace.


  **Eckhart, talks on detachment (Abegescheidenheit):** Both make peace contingent
  on release of possessive self-reference.

  *Divergence:* Eckhart aims at birth of the Word in the soul; Gītā aims at śānti
  as mark of sthita-prajña leading to brahma-nirvāṇa.'
