sutra_id: BG_03_16_18
collection: Bhagavad Gita
section: chapter_03
title: Outside the Wheel, Life Becomes Futile
sanskrit: 'एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः।


  अघायुरिन्द्रियारामो मोघं पार्थ स जीवति


  यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः।


  आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते


  नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन।


  न चास्य सर्वभूतेषु कश्िचदर्थव्यपाश्रयः'
transliteration: 'evaṃ pravartitaṃ cakraṃ nānuvartayatīha yaḥ|


  aghāyurindriyārāmo moghaṃ pārtha sa jīvati


  yastvātmaratireva syādātmatṛptaśca mānavaḥ|


  ātmanyeva ca santuṣṭastasya kāryaṃ na vidyate


  naiva tasya kṛtenārtho nākṛteneha kaścana|


  na cāsya sarvabhūteṣu kaśicadarthavyapāśrayaḥ'
translation: Who does not turn along with this wheel thus set moving lives in vain,
  Pārtha — an evil-lived one, delighting in the senses. But the human who would rejoice
  only in the Self [ātman], be satisfied in the Self, and content in the Self alone
  — for that one no duty-to-be-done [kārya] exists. For that one there is no purpose
  through what is done, nor through what is not done here, nor any dependence on any
  being among all beings for any purpose.
commentary: 'The sacrificial wheel is not optional culture; refusal of it, when one
  still feeds on sense-delight, renders life futile (mogha). Then Krishna states the
  exception that prevents literalism: the one whose joy, satisfaction, and contentment
  have contracted into the Self alone has no remaining kārya. The contested move is
  double-edged. Ordinary persons cannot cite Self-contentment as an alibi for exiting
  reciprocity while remaining sense-entertained; yet a genuine ātma-rati standing
  is acknowledged as beyond duty’s pressure. In the Gītā’s pedagogy this protects
  both social-cosmic obligation and the possibility of radical interior completion.
  Existentially, you must ask which clause fits you: are you refusing the wheel while
  still craving, or have craving’s centers actually relocated into Self-content? The
  verse refuses romantic exemption. Only the second condition dissolves purpose-dependence
  on deeds and beings. The exception for ātma-rati is real, but it is narrow and empirically
  costly. Most refusals of the wheel are not Self-contentment; they are sense-delight
  wearing the mask of freedom. Krishna’s severity toward the non-turner is therefore
  diagnostic rather than cruel: futility attaches to the combination of circuit-refusal
  plus craving. Conversely, the one whose joy has truly relocated does not need duty
  as a whip, because purpose-dependence on deeds and beings has already burned out.
  The spiritual task is honest classification, not theatrical exemption.


  Key Terms:


  **cakra (चक्र)** — wheel -> the sacrificial circulation previously mapped (action–sacrifice–rain–food)
  -> “cycle of nature” is vague; it is a normative wheel one must turn with


  **ātmarati (आत्मरति)** — delight in the Self -> joy whose object is ātman rather
  than indriya -> “self-love” corrupts it into egoism; here Self is the liberated
  locus of joy


  **kārya (कार्य)** — that which is to be done -> remaining obligatory work -> vanishes
  only for the one already complete in Self-content, not for the sense-delighted refuser


  Cross-Tradition Resonances:


  **Buddha, Majjhima Nikāya (Araṇavibhaṅga / duty beyond clinging):** Structural homology
  in distinguishing those still needing training-forms from those whose interior completion
  relaxes obligation’s sting.

  *Divergence:* Buddhist arahatship is framed through cessation of āsavas; the Gītā’s
  exception is ātman-contentment within a theistic-yogic cosmos.


  **Meister Eckhart (on the just who take God in works and at rest):** Structural
  homology in a station where doing and not-doing no longer add purpose.

  *Divergence:* Eckhart’s ground is Godhead detachment; Krishna’s exception is explicitly
  ātma-rati / ātma-tṛpti language.'
voice_of_siva: ''
abhyasa: 'Audit yourself honestly: if sense-delight still pulls, turn one spoke of
  the wheel today (offer, share, tend); if you claim Self-content, test whether any
  craving for praise still makes “not doing” feel like a project.'
