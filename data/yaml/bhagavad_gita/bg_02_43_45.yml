sutra_id: BG_02_43_45
collection: Bhagavad Gita
section: chapter_02
title: Desire-Selves Fixated on Heaven Lose Resolve in Samādhi
sanskrit: 'कामात्मानः स्वर्गपरा जन्मकर्मफलप्रदाम्।


  क्रियाविशेषबहुलां भोगैश्वर्यगतिं प्रति


  भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम्।


  व्यवसायात्मिका बुद्धिः समाधौ न विधीयते


  त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन।


  निर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान्'
transliteration: 'kāmātmānaḥ svargaparā janmakarmaphalapradām|


  kriyāviśeṣabahulāṃ bhogaiśvaryagatiṃ prati


  bhogaiśvaryaprasaktānāṃ tayāpahṛtacetasām|


  vyavasāyātmikā buddhiḥ samādhau na vidhīyate


  traiguṇyaviṣayā vedā nistraiguṇyo bhavārjuna|


  nirdvandvo nityasattvastho niryogakṣema ātmavān'
translation: “Desire-selves, intent on heaven, [speak speech] that bestows birth as
  action’s fruit — crowded with many particular rites, aimed at the goal of enjoyment
  and lordship. For those attached to enjoyment and lordship, their minds carried
  off by that, the resolve-natured understanding is not established in samādhi. The
  Vedas have the triple guṇa as their scope; be without the triple guṇa, Arjuna —
  free of the pairs, always standing in sattva, free of getting-and-keeping, Self-possessed.”
commentary: 'Ritual consumerism is diagnosed: *kāma-ātman* beings use sacred tech
  for heaven, enjoyment, and *aiśvarya*. Such speech hijacks the mind so resolve cannot
  seat in *samādhi*. Then the radical command: the Vedas’ range is *traiguṇya* — be
  *nistraiguṇya*. Free of dualities, established in sattva, without *yoga-kṣema* (acquiring
  and securing), be *ātmavān*. The contested move is not anti-Veda nihilism; it is
  refusal to let Veda-as-desire-manual own the whole of life. Existentially, notice
  which “spiritual” projects are still shopping for status and security. Liberation-talk
  that feeds acquisition cannot stabilize resolve.


  When scripture becomes a shopping catalog for heaven and lordship, resolve cannot
  seat. Beyond-guṇa standing is not contempt for Veda; it is refusal to let acquisition
  own the sacred. Check your spiritual cart.


  Niryoga-kṣema is the quiet revolution: stop living as acquire-and-secure. Self-possession
  begins when sacred projects stop being status engines. Then samādhi can host resolve.


  Strip one sacred project of acquire-and-secure motive and watch whether it remains
  necessary.


  Key Terms:


  **kāma-ātman (कामात्मन्)** — one whose self is desire → identity organized as wanting
  → “sensual person” is narrower than desire-constituted selfhood.


  **yoga-kṣema (योगक्षेम)** — getting and keeping / acquisition and security → the
  twin anxiety of obtain-and-protect → “welfare” in later usage softens the grasping
  pair here.


  **nistraiguṇya (निस्त्रैगुण्य)** — beyond the three guṇas → not owned by Vedic guṇa-scope
  → “transcend the modes of nature” is interpretive but directionally right.


  Cross-Tradition Resonances:


  **Mundaka Upaniṣad 1.1.4–1.2.13:** Both distinguish lower knowledge entangled in
  rites from higher knowledge that frees.

  *Divergence:* Mundaka sharply ranks knowledges; the Gītā keeps action while stripping
  desire-framing.


  **Augustine, Confessions X (concupiscence and curiositas):** Both expose how religious/intellectual
  appetite can still be desire in sacred dress.

  *Divergence:* Augustine turns toward Christian caritas; the Gītā turns toward guṇa-free
  Self-possession and later karma-yoga.'
