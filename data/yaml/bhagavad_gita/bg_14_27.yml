sutra_id: BG_14_27
collection: Bhagavad Gita
section: chapter_14
title: I Am the Ground of Brahman
sanskrit: ब्रह्मणो हि प्रतिष्ठाऽहममृतस्याव्ययस्य च।शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य
  च
transliteration: brahmaṇo hi pratiṣṭhā'hamamṛtasyāvyayasya ca|śāśvatasya ca dharmasya
  sukhasyaikāntikasya ca
translation: For I am the foundation of Brahman, of the deathless and the imperishable,
  of everlasting dharma, and of absolute bliss.
commentary: 'The chapter’s final thunder: Krishna is the pratiṣṭhā—foundation—of Brahman,
  of the deathless and the imperishable, of everlasting dharma, and of aikāntika sukha—final,
  unalloyed joy. The contested claim is theistic grounding of the Absolute: Brahman
  is not bypassing Krishna; Krishna is Brahman’s ground. This blocks an escape hatch
  into impersonalism that abandons love, and blocks a piety that never tastes the
  deathless. It also reinterprets sattvic joy: guṇa-sukha was a bind; aikāntika sukha
  is grounded in the Lord. Existentially, the highest knowledge ends not in a diagram
  of strands but in a person who is the ground of the Absolute, of dharma, and of
  joy that does not trade on the guṇas. Refuge becomes metaphysical realism, not sentiment.
  To say Krishna is Brahman’s foundation is to refuse choosing between love and the
  Absolute; the Absolute is loved as ground. This is not ornamental theology; it is
  a demand that lived climate, ethical stance, and metaphysical claim stay braided
  in one practice of seeing.


  Key Terms:


  **pratiṣṭhā (प्रतिष्ठा)** — foundation / resting-place -> Krishna as ground of Brahman
  -> ''support'' is too architectural-external.

  **amṛta / avyaya (अमृत / अव्यय)** — deathless / imperishable -> grounded in Krishna
  -> ''eternity'' can stay abstract.

  **śāśvata dharma (शाश्वत धर्म)** — everlasting dharma -> grounded in the Lord ->
  ''religion'' domesticates the claim.

  **aikāntika sukha (ऐकान्तिक सुख)** — absolute / exclusive joy -> final bliss beyond
  guṇa-sukha -> ''happiness'' is far too thin.


  Cross-Tradition Resonances:


  **[Gītā 7.7 / 10.8]:** Krishna as source and origin of all resonates with pratiṣṭhā
  of Brahman.

  *Divergence:* Those chapters emphasize manifestation and vibhūti; 14.27 explicitly
  grounds Brahman, dharma, and absolute joy.

  **[Rāmānuja’s viśiṣṭādvaita reading]:** The personal Lord as ground of Brahman is
  theologically decisive here.

  *Divergence:* Non-dual readings stress identity; the verse’s ''I am the foundation''
  preserves a theistic asymmetry productive for devotion.

  **[Pseudo-Dionysius on God as cause of being and good]:** Ground of deathless reality
  and joy resonates.

  *Divergence:* Dionysius proceeds by ascent and negation; Krishna speaks as the foundation
  in first person to a friend in war.'
