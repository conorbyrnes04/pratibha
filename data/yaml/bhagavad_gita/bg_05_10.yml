sutra_id: BG_05_10
collection: Bhagavad Gita
section: chapter_05
title: Lotus-Leaf Action on Brahman
sanskrit: 'ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः।


  लिप्यते न स पापेन पद्मपत्रमिवाम्भसा'
transliteration: 'brahmaṇyādhāya karmāṇi saṅgaṃ tyaktvā karoti yaḥ|


  lipyate na sa pāpena padmapatramivāmbhasā'
translation: Who places actions upon Brahman, having abandoned attachment, and acts
  — that one is not stained by evil, as a lotus leaf by waters.
commentary: 'The method is twofold and simultaneous: ādhāya karmāṇi brahmaṇi — depositing
  actions on Brahman — and saṅgaṃ tyaktvā — abandoning attachment — while still acting.
  The contested image is the lotus leaf: in water, not wet. Engagement without absorption
  of stain is possible when the metaphysical deposit and affective release coincide.
  In Vedānta-inflected karma-yoga, Brahman is not an excuse to dump consequences onto
  the Absolute while clinging privately; the tyāga of saṅga is the seal. Existentially,
  act inside the wet world without becoming soggy with pāpa-claim. The leaf’s secret
  is structure, not distance from the pond. Depositing actions on Brahman without
  abandoning attachment is unfinished consecration; abandoning attachment without
  the deposit can become dry indifference. The lotus image needs both: contact with
  the wet world and non-wetting structure. Pāpa-stain is adhesion, not mere proximity
  to difficulty. Act inside messy necessity with the twin moves until the leaf’s logic
  becomes your habit. The pond is not the enemy; soaking is.


  Key Terms:


  **brahmaṇy ādhāya (ब्रह्मण्याधाय)** — having placed upon Brahman -> consecrating
  deposit of deeds -> more than mood; metaphysical relocation of ownership


  **padmapatra (पद्मपत्र)** — lotus leaf -> classic image of non-adhesion amid contact
  -> purity as non-wetting, not as non-contact


  **saṅga (सङ्ग)** — attachment/adhesion -> what must be abandoned for the leaf-effect
  -> the wetting agent in moral psychology


  Cross-Tradition Resonances:


  **Christian “in the world but not of it”:** Structural homology in contact without
  constitutive capture.

  *Divergence:* Christian framing is ecclesial-eschatological in Christ; here the
  deposit is onto Brahman with explicit saṅga-tyāga.


  **Lotus symbolism in Buddhism:** Structural homology in blooming unstained from
  mud/water.

  *Divergence:* Buddhist lotus often figures purity of mind amid saṃsāra; the Gītā
  ties the image specifically to brahman-deposit of karma.'
voice_of_siva: ''
abhyasa: Before a messy necessary task, mentally place the action on Brahman, release
  one adhesive hope or fear, then act — and check afterward whether stain-thinking
  reclaimed the deed.
