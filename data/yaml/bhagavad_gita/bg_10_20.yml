collection: Bhagavad Gita
section: chapter_10
title: I Am the Self Seated in Every Heart
sanskrit: 'अहमात्मा गुडाकेश सर्वभूताशयस्थितः।


  अहमादिश्च मध्यं च भूतानामन्त एव च'
transliteration: 'ahamātmā guḍākeśa sarvabhūtāśayasthitaḥ|


  ahamādiśca madhyaṃ ca bhūtānāmanta eva ca'
translation: I am the Self, O Guḍākeśa, seated in the heart-lair of all beings; I
  am the beginning, the middle, and also the end of beings.
commentary: 'Before sun and Sāma and Meru, the primary vibhūti is announced: aham
  ātmā — I am the Self seated in the heart of all beings, their ādi, madhya, and anta.
  The contested primacy is interior and universal before cosmic best-of lists. Existentially
  this prevents vibhūti-spirituality from becoming tourism of excellences while ignoring
  the Self in the ordinary heart. Every being''s timeline is already bookended and
  midwifed by that seated Self. Look first to the heart-lair, then to the splendors.
  The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. Live one concrete implication of the claim before the day ends, so the argument
  becomes conduct rather than ornament.


  Key Terms:


  **ātman (आत्मन्)** — Self -> Kṛṣṇa as Self in all hearts -> "soul" as private entity
  misses universal heart-seated claim

  **āśaya (आशय)** — resting-place/heart-lair -> where the Self is seated in beings
  -> "heart" as emotion center understates lair/receptacle sense


  Cross-Tradition Resonances:


  **[Chāndogya on Self in the heart]:** Direct Upaniṣadic kinship.

  *Divergence:* Upaniṣadic Brahman-ātman often impersonal; Gītā''s ātman speaks as
  Kṛṣṇa to Arjuna.

  **[Augustine on God nearer than I to myself]:** Shared intimate inwardness of the
  divine.

  *Divergence:* Christian interiority differs; Gītā adds beginning-middle-end of all
  beings.'
