sutra_id: BG_02_62
collection: Bhagavad Gita
section: chapter_02
title: Dwelling on Objects Births Attachment, Then Desire, Then Anger
sanskrit: 'ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते।


  सङ्गात् संजायते कामः कामात्क्रोधोऽभिजायते'
transliteration: 'dhyāyato viṣayānpuṃsaḥ saṅgasteṣūpajāyate|


  saṅgāt saṃjāyate kāmaḥ kāmātkrodho''bhijāyate'
translation: “For a person dwelling on objects, attachment to them arises. From attachment,
  desire is born; from desire, anger is born.”
commentary: 'The causal chain is mercilessly clear: *dhyāna* on objects → *saṅga*
  → *kāma* → *krodha*. The contested claim is that anger’s root is not the world’s
  injustice alone but prior meditative sticking to objects. Brooding is already karma.
  Existentially, this verse makes thought-hygiene ethical: what you rehearse, you
  will eventually rage for when blocked. Interrupt the chain at dwelling — earliest
  and cheapest.


  Dwelling is already deed. Interrupt rehearsal early and you interrupt anger’s feedstock.
  Thought-hygiene is ethics with a long fuse.


  If dwelling births the chain, redesign your media and memory habits as ethical acts.
  What you rehearse, you will one day demand — and rage when denied. Media and memory
  are ethical infrastructure. Redesign them where the chain begins.


  Redesign one rehearsal habit — feed, scroll, fantasy — as ethical interruption of
  the anger chain at dwelling. Check the verse against your next irreversible act
  before you file it as inspiration. Keep Arjuna’s crisis in view so the line cannot
  shrink into abstract uplift.


  Key Terms:


  **dhyāyat (ध्यायत्)** — dwelling/meditating upon → repeated mental inhabitation
  of objects → “thinking about” is weaker than meditative dwelling.


  **saṅga (सङ्ग)** — attachment → adhesive relation born from dwelling → first sticky
  product of rehearsal.


  **kāma → krodha (काम → क्रोध)** — desire to anger → blocked wanting’s heat → the
  sequence is law-like in this psychology.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 2.3–2.9:** Both map afflictive chains from cognitive-affective
  sticking.

  *Divergence:* YS embeds in kleśa theory; Gītā gives a four-beat practical chain
  for interruption.


  **Buddhist twelve nidānas (taṇhā–upādāna region):** Both show craving escalating
  from contact/attention patterns.

  *Divergence:* Buddhism frames dependent origination toward cessation; here the chain
  warns a warrior toward sthita-prajña.'
voice_of_siva: ''
abhyasa: 'Catch one loop of dwelling on an object. Break it by naming: “dwelling →
  sticking,” and move attention to breath or duty for two minutes.'
