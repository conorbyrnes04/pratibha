sutra_id: BG_18_31_33
collection: Bhagavad Gita
section: chapter_18
title: Rajasic and Tamasic Intelligence; Sattvic Firmness
sanskrit: 'यया धर्ममधर्मं च कार्यं चाकार्यमेव च।अयथावत्प्रजानाति बुद्धिः सा पार्थ
  राजसी

  अधर्मं धर्ममिति या मन्यते तमसाऽऽवृता।सर्वार्थान्विपरीतांश्च बुद्धिः सा पार्थ तामसी

  धृत्या यया धारयते मनःप्राणेन्द्रियक्रियाः।योगेनाव्यभिचारिण्या धृतिः सा पार्थ सात्त्विकी'
transliteration: 'yayā dharmamadharmaṃ ca kāryaṃ cākāryameva ca|ayathāvatprajānāti
  buddhiḥ sā pārtha rājasī

  adharmaṃ dharmamiti yā manyate tamasā''''vṛtā|sarvārthānviparītāṃśca buddhiḥ sā
  pārtha tāmasī

  dhṛtyā yayā dhārayate manaḥprāṇendriyakriyāḥ|yogenāvyabhicāriṇyā dhṛtiḥ sā pārtha
  sāttvikī'
translation: The intelligence by which one wrongly understands dharma and adharma,
  and what is to be done and not done—that intelligence, O Pārtha, is rajasic. The
  intelligence that, wrapped in tamas, takes adharma to be dharma, and reverses all
  aims—that intelligence, O Pārtha, is tamasic. The firmness by which one holds the
  activities of mind, life-breath, and senses through unswerving yoga—that firmness,
  O Pārtha, is sattvic.
commentary: 'Rajasic buddhi misreads dharma/adharma and kārya/akārya—not total inversion
  yet, but ayathāvat, not as they are. Tamasic buddhi, darkness-wrapped, inverts:
  adharma as dharma, all aims reversed. Then sattvic dhṛti: holding mind-prāṇa-senses
  through avyabhicāriṇī yoga. The contested severity names moral inversion as a climate
  of intelligence, not a mere mistake. Existentially, ask where you are rationalizing
  a reversal. Firmness that holds the inner instruments in unswerving yoga is the
  counterweight. In the Gītā’s pedagogy, concept without existential cut becomes another
  ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics.


  Key Terms:


  **ayathāvat (अयथावत्)** — not as it is -> rajasic misapprehension -> ''biased''
  is close but thinner.

  **tamasā āvṛtā (तमसा आवृता)** — covered by tamas -> tamasic buddhi’s condition ->
  ''ignorant'' understates covering.

  **viparītāṇ arthan (विपरीतान् अर्थान्)** — reversed aims/meanings -> tamasic inversion
  -> ''contrarian'' may glamorize.

  **avyabhicāriṇyā yogena (अव्यभिचारिण्या योगेन)** — by unswerving yoga -> means of
  sattvic firmness -> ''consistent routine'' is partial.


  Cross-Tradition Resonances:


  **[Isaiah’s ''woe to those who call evil good'']:** Moral inversion as darkness
  resonates strongly.

  *Divergence:* Prophetic woe is covenantal; here inversion is tamasic buddhi in guṇa
  theory.

  **[Gītā 14 / 16 āsuric views]:** Wrong seeing of world and duty continues.

  *Divergence:* 18.32 makes inversion the definition of tamasic intelligence.

  **[Patañjali on dhāraṇā/dhṛti analogues]:** Holding mind and senses resonates with
  sattvic firmness.

  *Divergence:* Patañjali’s eight limbs differ; here dhṛti is guṇa-typed.'
