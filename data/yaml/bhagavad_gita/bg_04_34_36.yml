sutra_id: BG_04_34_36
collection: Bhagavad Gita
section: chapter_04
title: Approach Knowers by Bowing, Question, and Service
sanskrit: 'तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया।


  उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः


  यज्ज्ञात्वा न पुनर्मोहमेवं यास्यसि पाण्डव।


  येन भूतान्यशेषेण द्रक्ष्यस्यात्मन्यथो मयि


  अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः।


  सर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि'
transliteration: 'tadviddhi praṇipātena paripraśnena sevayā|


  upadekṣyanti te jñānaṃ jñāninastattvadarśinaḥ


  yajjñātvā na punarmohamevaṃ yāsyasi pāṇḍava|


  yena bhūtānyaśeṣeṇa drakṣyasyātmanyatho mayi


  api cedasi pāpebhyaḥ sarvebhyaḥ pāpakṛttamaḥ|


  sarvaṃ jñānaplavenaiva vṛjinaṃ santariṣyasi'
translation: Know that by prostration, by close questioning, and by service; the knowers
  who have seen the truth will teach you knowledge. Knowing which, you will not go
  again to delusion in this way, Pāṇḍava; by it you will see all beings without remainder
  in the Self and then in me. Even if you were the most evil-doing among all the evil-doers,
  you would cross all wrong by the raft of knowledge alone.
commentary: 'Knowledge has a social doorway: praṇipāta, paripraśna, sevā — reverence,
  precise questioning, service. The contested claim is that tattva-seers teach those
  who approach in this triad; autodidactic pride is structurally unfit. The fruit
  is double vision — beings seen in ātman and in Krishna — and a radical soteriology:
  even the worst wrongdoer crosses by jñāna-plava. In guru-śiṣya culture this is classic;
  in modern self-help culture it is offensive. Existentially, if your “knowledge”
  produces no end of moha and no vision of beings in Self/Lord, you may have information
  without the doorway. The raft metaphor insists knowledge is transport across guilt’s
  water, not a trophy. The triad — bow, question, serve — trains the ego out of extractive
  learning. Truth-seers teach those who can receive; without receptivity, even true
  words bounce into debate-identity. Vision of all beings in Self and in the Lord
  ends moha’s recycling, and the raft metaphor refuses despair over a polluted past.
  Knowledge transports across wickedness; it does not deny the water. Approach as
  a learner whose body, curiosity, and service agree.


  Key Terms:


  **praṇipāta (प्रणिपात)** — full prostration/bowing-down -> bodily humility as epistemic
  condition -> not humiliation theater; readiness to receive


  **tattvadarśin (तत्त्वदर्शिन्)** — seer of truth/principle -> authority grounded
  in seeing, not credential alone -> teachers as those who have seen


  **jñānaplava (ज्ञानप्लव)** — raft of knowledge -> knowledge as crossing-vehicle
  over vṛjina -> practical soteriology against despair


  Cross-Tradition Resonances:


  **Socrates’ elenchus plus reverence for the wise:** Structural homology in questioning
  under a discipline of humility.

  *Divergence:* Socratic knowing often ends in aporia; here knowers positively upadeśa
  liberating vision of beings in Self/Lord.


  **Christian apprenticeship (novitiate: obedience, inquiry, service):** Structural
  homology in formation triad before deep doctrine.

  *Divergence:* Christian formation is ecclesial-christological; the Gītā’s triad
  yields tattva-seeing of all beings in ātman and Krishna.'
voice_of_siva: ''
abhyasa: 'Approach one living source of wisdom today with the triad: a gesture of
  respect, one precise question, and one act of service — then listen without defending
  your prior map.'
