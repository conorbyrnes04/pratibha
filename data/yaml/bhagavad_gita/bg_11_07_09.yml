sutra_id: BG_11_07_09
collection: Bhagavad Gita
section: chapter_11
title: Divine Eye for the World in One Body
sanskrit: 'इहैकस्थं जगत्कृत्स्नं पश्याद्य सचराचरम्।


  मम देहे गुडाकेश यच्चान्यद्द्रष्टुमिच्छसि


  न तु मां शक्यसे द्रष्टुमनेनैव स्वचक्षुषा।


  दिव्यं ददामि ते चक्षुः पश्य मे योगमैश्वरम्


  सञ्जय उवाच


  एवमुक्त्वा ततो राजन्महायोगेश्वरो हरिः।


  दर्शयामास पार्थाय परमं रूपमैश्वरम्'
transliteration: 'ihaikasthaṃ jagatkṛtsnaṃ paśyādya sacarācaram|


  mama dehe guḍākeśa yaccānyaddraṣṭumicchasi


  na tu māṃ śakyase draṣṭumanenaiva svacakṣuṣā|


  divyaṃ dadāmi te cakṣuḥ paśya me yogamaiśvaram


  sañjaya uvāca


  evamuktvā tato rājanmahāyogeśvaro hariḥ|


  darśayāmāsa pārthāya paramaṃ rūpamaiśvaram'
translation: 'Behold now the whole world, moving and unmoving, gathered in one place
  in My body, O Gudakesha — and whatever else you wish to see. But you cannot see
  Me with this your own ordinary eye; I give you a divine eye. Behold My sovereign
  yoga. Sanjaya said: Having spoken thus, O King, Hari, the great Lord of Yoga, then
  showed Partha the supreme lordly form.'
commentary: 'Theophany requires transformed perception, not only a changed object.
  The contested move in this stretch of the vision is that whole world in one body;
  ordinary eye cannot see; divine eye given; sanjaya narrates the showing. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion
  after seeing. Do not aestheticize the theophany; let it revise what you think action,
  fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **divya cakṣus (दिव्य चक्षुस्)** — passage key term -> Theophany requires transformed
  perception, not only a changed object. -> default gloss flattens the vision''s force

  **aiśvara yoga (ऐश्वर योग)** — paired key term -> Whole world in one body; ordinary
  eye cannot see; divine eye given; Sanjaya narrates the showing. -> soft translation
  misses structural role


  Cross-Tradition Resonances:


  **[Eph 1 eyes of heart]:** Structural kinship around transformed perception.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Blake doors of perception]:** Shared pressure of transformed perception.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person
  disclosure.'
