sutra_id: BG_12_04_06
collection: Bhagavad Gita
section: chapter_12
title: Harder Path, Same Arrival — Softened by Offering
sanskrit: 'संनियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः।ते प्राप्नुवन्ति मामेव सर्वभूतहिते
  रताः


  क्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम्।


  अव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते


  ये तु सर्वाणि कर्माणि मयि संन्यस्य मत्पराः।अनन्येनैव योगेन मां ध्यायन्त उपासते'
transliteration: 'saṃniyamyendriyagrāmaṃ sarvatra samabuddhayaḥ|te prāpnuvanti māmeva
  sarvabhūtahite ratāḥ


  kleśo''dhikatarasteṣāmavyaktāsaktacetasām|


  avyaktā hi gatirduḥkhaṃ dehavadbhiravāpyate


  ye tu sarvāṇi karmāṇi mayi saṃnyasya matparāḥ|ananyenaiva yogena māṃ dhyāyanta upāsate'
translation: 'Having restrained the sense-host, equal-minded everywhere, delighting
  in the good of all beings — they also reach Me alone.


  Greater is the trouble for those whose awareness clings to the unmanifest; for the
  unmanifest path is reached painfully by the embodied.


  But those who renounce all actions in Me, intent on Me as supreme, meditating on
  Me with undivided yoga, worship—'
commentary: 'The unmanifest path is affirmed: sense-restraint, sameness everywhere,
  dedication to all beings'' welfare — and they reach Me. The contested pastoral claim
  follows: for the embodied, avyakta-attachment brings greater kleśa. Embodiment makes
  formless goal hard; this is anthropology, not insult. Then the alternative is named:
  renounce actions in Me, be mat-para, meditate with ananya yoga. Existentially this
  legitimizes needing form, relation, and offering without calling it inferior metaphysics.
  If you are embodied and find pure unmanifest practice grinding you down, the text
  predicted that — and offered a path of action-renunciation into the Lord. Difficulty
  is not always a sign of depth; sometimes it is a sign of wrong tool for this body.
  The line-level force of the teaching is practical, not ornamental: what it claims
  about reality is meant to reshape how you attend, choose, and depart. If the claim
  does not alter rehearsal in ordinary time, it will not hold when time thins. Existential
  uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **kleśa (क्लेश)** — affliction/trouble -> greater for unmanifest-attached embodied
  minds -> "stress" understates spiritual-structural difficulty.


  **ananya yoga (अनन्य योग)** — undivided yoga -> meditation-worship of Kṛṣṇa after
  renouncing actions in Him -> "exclusive focus" is close but misses yoga as joining.


  **sarva-bhūta-hita (सर्वभूतहित)** — welfare of all beings -> mark of unmanifest
  worshippers who still reach Me -> "humanitarianism" secularizes a yogic criterion.


  Cross-Tradition Resonances:


  **Madhyamaka emptiness practice vs deity yoga:** Both traditions debate formless
  vs form methods.

  *Divergence:* Buddhist emptiness is not the Gītā''s avyakta-as-path-to-personal-Me.


  **Jewish aniconism vs temple presence:** Structural tension of imageless vs present
  God.

  *Divergence:* Biblical law-frame differs; Gītā allows both paths with cost-accounting
  for the embodied.'
voice_of_siva: ''
abhyasa: If your practice feels like harsh grinding toward the formless, try one session
  of offering today's actions into the Lord with undivided attention — compare the
  kleśa honestly.
