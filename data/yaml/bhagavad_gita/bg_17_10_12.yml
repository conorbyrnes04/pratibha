sutra_id: BG_17_10_12
collection: Bhagavad Gita
section: chapter_17
title: Tamasic Food, Sattvic and Rajasic Sacrifice
sanskrit: 'यातयामं गतरसं पूति पर्युषितं च यत्।उच्छिष्टमपि चामेध्यं भोजनं तामसप्रियम्

  अफलाकाङ्क्षिभिर्यज्ञो विधिदृष्टो य इज्यते।यष्टव्यमेवेति मनः समाधाय स सात्त्विकः

  अभिसंधाय तु फलं दम्भार्थमपि चैव यत्।इज्यते भरतश्रेष्ठ तं यज्ञं विद्धि राजसम्'
transliteration: 'yātayāmaṃ gatarasaṃ pūti paryuṣitaṃ ca yat|ucchiṣṭamapi cāmedhyaṃ
  bhojanaṃ tāmasapriyam

  aphalākāṅkṣibhiryajño vidhidṛṣṭo ya ijyate|yaṣṭavyameveti manaḥ samādhāya sa sāttvikaḥ

  abhisaṃdhāya tu phalaṃ dambhārthamapi caiva yat|ijyate bharataśreṣṭha taṃ yajñaṃ
  viddhi rājasam'
translation: Food that is stale, tasteless, putrid, leftover, and also impure is dear
  to the tamasic. Sacrifice offered by those who desire no fruit, as prescribed, with
  the mind resolved 'this must be offered'—that is sattvic. But sacrifice offered
  with a view to fruit, and also for ostentation, O best of Bharatas—know that to
  be rajasic.
commentary: 'Tamasic dearness is decay and impurity; then yajña splits by intention.
  Sattvic sacrifice: vidhi-aligned, fruit-not-craved, mind settled that it ought to
  be done. Rajasic sacrifice: fruit-aimed and/or dambha-aimed. The contested claim
  is that identical outer rites differ absolutely by interior contract. Existentially,
  audit your “good deeds”: are they ought-to-be-done offerings, or investments and
  advertisements? The Gītā’s sattvic mind does not negotiate the rite as a deal. In
  the Gītā’s pedagogy, concept without existential cut becomes another ornament of
  bondage; therefore the verse must be read as a demand on perception, desire, and
  refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **yātayāma (यातयाम)** — past its time / stale -> tamasic food -> ''meal prep leftover''
  is not automatically tamasic; the cluster matters.

  **aphalākāṅkṣin (अफलाकाङ्क्षिन्)** — not craving fruit -> sattvic sacrificer ->
  ''unmotivated'' misreads freedom from bargaining.

  **vidhi-dṛṣṭa (विधिदृष्ट)** — seen in ordinance -> prescribed rite -> ''traditional''
  can be vague.

  **dambhārtham (दम्भार्थम्)** — for ostentation -> rajasic aim -> ''visibility''
  as branding is the modern form.


  Cross-Tradition Resonances:


  **[Gītā 2.47]:** Non-attachment to fruit continues into sacrificial typology.

  *Divergence:* 17.11–12 apply it specifically to yajña.

  **[Gospel critique of trumpet-almsgiving]:** Ostentatious piety as invalid resonates.

  *Divergence:* Matthew aims at Father’s reward secrecy; Krishna maps ostentation
  as rajasic guṇa.

  **[Mīmāṃsā on ritual fruit]:** Debate on fruits of sacrifice is the scholastic background.

  *Divergence:* The Gītā ethicizes and guṇa-codes the fruit-desire itself.'
