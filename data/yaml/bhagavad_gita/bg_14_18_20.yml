sutra_id: BG_14_18_20
collection: Bhagavad Gita
section: chapter_14
title: Rising, Standing, Falling—and Seeing Beyond the Doer
sanskrit: 'ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः।जघन्यगुणवृत्तिस्था अधो
  गच्छन्ति तामसाः

  नान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति।गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति

  गुणानेतानतीत्य त्रीन्देही देहसमुद्भवान्।जन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते'
transliteration: 'ūrdhvaṃ gacchanti sattvasthā madhye tiṣṭhanti rājasāḥ|jaghanyaguṇavṛttisthā
  adho gacchanti tāmasāḥ

  nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭānupaśyati|guṇebhyaśca paraṃ vetti madbhāvaṃ
  so''dhigacchati

  guṇānetānatītya trīndehī dehasamudbhavān|janmamṛtyujarāduḥkhairvimukto''mṛtamaśnute'
translation: Those established in sattva go upward; the rajasic remain in the middle;
  those established in the lowest guṇa-activity go downward. When the seer sees no
  doer other than the guṇas, and knows what is beyond the guṇas, he attains My being.
  Having transcended these three guṇas that arise from the body, the embodied one,
  freed from birth, death, age, and pain, tastes immortality.
commentary: 'Trajectory language becomes vertical: sattva upward, rajas middle, tamas
  downward. Then the decisive philosophical cut: the seer who sees no doer apart from
  the guṇas, and knows what is beyond them, attains madbhāva—Krishna’s being. Transcending
  the three yields immortality beyond birth-death-age-pain. The contested move is
  non-doership without nihilism: guṇas act; the seer knows the beyond. This is not
  permission for irresponsibility; it is the end of the fantasy that a separate ego
  authors the strands. In the Gītā’s theistic frame, seeing beyond the guṇas is not
  blank neutrality; it opens into divine being. Existentially, freedom is not becoming
  a better guṇa-bundle; it is seeing agency correctly and tasting the deathless while
  life continues. Madbhāva keeps the teaching from collapsing into blank witnessing:
  beyond the guṇas is not nowhere; it is kinship with the Lord. This is not ornamental
  theology; it is a demand that lived climate, ethical stance, and metaphysical claim
  stay braided in one practice of seeing.


  Key Terms:


  **ūrdhvam / madhye / adhaḥ (ऊर्ध्वम् / मध्ये / अधः)** — up / middle / down -> guṇa
  trajectories -> ''social mobility'' parody misses cosmic psychology.

  **draṣṭā (द्रष्टा)** — seer -> one who sees guṇas as sole doers -> ''observer''
  can sound detached in a clinical way.

  **guṇātīta (गुणातीत)** — beyond the guṇas -> transcendence of the three binders
  -> ''above good and evil'' can sound antinomian.

  **amṛta (अमृत)** — immortality / deathless nectar -> fruit of transcending guṇas
  -> ''afterlife'' postpones present tasting.


  Cross-Tradition Resonances:


  **[Gītā 3.27–28]:** Guṇas act among guṇas; the knower is not entangled—direct continuity.

  *Divergence:* Chapter 3 emphasizes karma-yoga; chapter 14 thematizes transcendence
  into divine being.

  **[Plotinus on rising above lower soul motions]:** Ascent beyond turbulent psychic
  modes resonates.

  *Divergence:* Plotinus ascends toward the One; Krishna names attainment as madbhāva,
  personal-divine kinship.'
