sutra_id: BG_18_25_27
collection: Bhagavad Gita
section: chapter_18
title: Tamasic Action; Three Agents
sanskrit: 'अनुबन्धं क्षयं हिंसामनपेक्ष्य च पौरुषम्।मोहादारभ्यते कर्म यत्तत्तामसमुच्यते

  मुक्तसङ्गोऽनहंवादी धृत्युत्साहसमन्वितः।सिद्ध्यसिद्ध्योर्निर्विकारः कर्ता सात्त्विक
  उच्यते

  रागी कर्मफलप्रेप्सुर्लुब्धो हिंसात्मकोऽशुचिः।हर्षशोकान्वितः कर्ता राजसः परिकीर्तितः'
transliteration: 'anubandhaṃ kṣayaṃ hiṃsāmanapekṣya ca pauruṣam|mohādārabhyate karma
  yattattāmasamucyate

  muktasaṅgo''nahaṃvādī dhṛtyutsāhasamanvitaḥ|siddhyasiddhyornirvikāraḥ kartā sāttvika
  ucyate

  rāgī karmaphalaprepsurlubdho hiṃsātmako''śuciḥ|harṣaśokānvitaḥ kartā rājasaḥ parikīrtitaḥ'
translation: Action undertaken from delusion, without regard to consequence, loss,
  harm, or one’s own capacity—that is called tamasic. The agent who is free from attachment,
  who does not speak as I, filled with firmness and zeal, unchanged in success and
  failure—is called sattvic. The agent who is passionate, seeking the fruit of action,
  greedy, harmful by nature, impure, subject to joy and grief—is declared rajasic.
commentary: 'Tamasic karma ignores anubandha, kṣaya, hiṃsā, and pauruṣa—consequence,
  loss, harm, capacity—because moha launches it. Then kartā typology: sattvic agent
  is muktasaṅga, non-I-speaking, firm and zealous, unchanged in siddhi/asiddhi. Rajasic
  agent is rāgī, fruit-seeking, greedy, hurtful, impure, swing-bound to harṣa-śoka.
  The contested portrait makes “passionate hustle” ethically visible as rajasic agency.
  Existentially, zeal without I-talk is sattvic; zeal as self-theater is not. In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage;
  therefore the verse must be read as a demand on perception, desire, and refuge,
  not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **anubandha (अनुबन्ध)** — consequence / binding sequel -> ignored in tamasic action
  -> ''externalities'' is a partial secular cousin.

  **anahaṃvādin (अनहंवादिन्)** — not speaking as I -> sattvic agent’s speech-identity
  -> ''humblebrag avoidance'' is surface.

  **siddhyasiddhyoḥ (सिद्ध्यसिद्ध्योः)** — in success and failure -> evenness of sattvic
  agent -> ''resilience'' can be rajasic if fruit-centered.

  **hiṃsātmaka (हिंसात्मक)** — harmful by nature -> rajasic agent mark -> ''disruptive''
  may glamorize it.


  Cross-Tradition Resonances:


  **[Gītā 2.48 / evenness]:** Success-failure evenness returns as agent definition.

  *Divergence:* 18.26 makes it a mark of sattvic kartā specifically.

  **[Aristotle’s virtuous agent]:** Character of the doer determining action’s quality
  resonates.

  *Divergence:* Aristotle’s mean vs excess differs from guṇa typology.

  **[Just war / harm-awareness ethics]:** Ignoring harm/capacity as blameworthy resonates
  with tamasic action.

  *Divergence:* Modern ethics is often rule-based; here moha is the launching cause.'
voice_of_siva: ''
abhyasa: Before starting a messy action, explicitly check consequence, loss, harm,
  and capacity. If you skip the check, name the skip as tamasic risk.
