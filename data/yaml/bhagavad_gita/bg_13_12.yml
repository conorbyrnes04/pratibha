sutra_id: BG_13_12
collection: Bhagavad Gita
section: chapter_13
title: This Alone Is Called Knowledge
sanskrit: अध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम्।एतज्ज्ञानमिति प्रोक्तमज्ञानं
  यदतोन्यथा
transliteration: adhyātmajñānanityatvaṃ tattvajñānārthadarśanam|etajjñānamiti proktamajñānaṃ
  yadatonyathā
translation: Constancy in knowledge of the Self, and seeing the goal of knowledge
  of reality—this is declared to be knowledge. What is other than this is ignorance.
commentary: 'After listing virtues, Krishna seals the definition: knowledge is constancy
  in adhyātma-jñāna and vision oriented to the aim of tattva-jñāna. The contested
  move is severity. Cleverness, information, and even spiritual experiences that do
  not stabilize Self-knowledge and reality-vision count as ajñāna. “Nityatva” matters:
  not a peak insight, but ongoingness. “Artha-darśana” matters: seeing must be teleological,
  aimed at what knowledge is for—release into reality, not ornamentation of the ego.
  In the Gītā’s economy, ignorance is not mere absence of data; it is any orientation
  that substitutes secondary knowing for Self-reality seeing. Existentially, the verse
  is a sieve: what of my learning actually stabilizes Self-knowing, and what is sophisticated
  distraction? The sieve is merciful if used honestly: better a small constancy of
  Self-knowing than a large library that never stabilizes seeing. Read as existential
  demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine.


  Key Terms:


  **adhyātma-jñāna (अध्यात्मज्ञान)** — knowledge concerning the Self -> inward science
  of ātman -> “spiritual knowledge” is too vague.

  **nityatva (नित्यत्व)** — constancy / perpetuity -> stability of knowing across
  time -> “eternal truth” can float free of practice.

  **tattva-jñāna (तत्त्वज्ञान)** — knowledge of that-ness / reality-principle -> insight
  into what is ultimately real -> “philosophy” can remain discursive.

  **ajñāna (अज्ञान)** — non-knowledge / ignorance -> whatever is other than this constancy
  and aim-seeing -> “stupidity” moralizes a structural miss.


  Cross-Tradition Resonances:


  **[Muṇḍaka Upaniṣad I.1.4–5]:** Higher knowledge (parā vidyā) versus lower knowledge
  resonates with this exclusive definition.

  *Divergence:* Muṇḍaka contrasts Vedic ritual learning with Brahman-knowledge; Krishna
  has just moralized and devotionized the path into jñāna.

  **[Śāntideva, Bodhicaryāvatāra IX]:** Wisdom defined against its counterfeits parallels
  “other than this is ignorance.”

  *Divergence:* Śāntideva’s prajñā is emptiness of persons and dharmas; Krishna’s
  jñāna is Self-constancy aimed at tattva within theistic yoga.

  **[Plato, Republic VI (divided line)]:** Only noēsis oriented to the Good counts
  as highest knowing.

  *Divergence:* Plato’s Good is impersonal form; Krishna’s knowledge culminates in
  devotionally recognized reality.'
