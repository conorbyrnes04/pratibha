sutra_id: BG_16_24
collection: Bhagavad Gita
section: chapter_16
title: Therefore Let Śāstra Be Your Measure
sanskrit: तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ।ज्ञात्वा शास्त्रविधानोक्तं
  कर्म कर्तुमिहार्हसि
transliteration: tasmācchāstraṃ pramāṇaṃ te kāryākāryavyavasthitau|jñātvā śāstravidhānoktaṃ
  karma kartumihārhasi
translation: Therefore let scripture be your measure in establishing what is to be
  done and what is not to be done. Knowing the scriptural ordinance, you should perform
  action here.
commentary: 'The chapter closes with a clear criterion: śāstraṃ pramāṇam—scripture
  as measure for kārya and akārya. Knowing what is taught, one should act. The contested
  modern discomfort is authority. Yet within the Gītā’s argument, this is medicine
  after the āsuric creed of desire-only causality. Existentially, “I alone measure”
  was already quoted as demonic litany. The alternative is not mindless conformity;
  it is pramāṇa—reliable measure—against the triple gate’s distortions. Action remains;
  arbitrariness does not. In the Gītā’s pedagogy, concept without existential cut
  becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **pramāṇa (प्रमाण)** — measure / valid means of knowing -> śāstra as criterion ->
  ''authority'' as domination mishears it.

  **kāryākārya (कार्याकार्य)** — to-be-done / not-to-be-done -> ethical discernment
  field -> ''tasks'' is too managerial.

  **śāstra-vidhāna (शास्त्रविधान)** — scriptural ordinance -> enacted measure -> ''tradition''
  can become vague nostalgia.

  **iha (इह)** — here / in this world -> act here, not in fantasy -> ''someday spirituality''
  is refused.


  Cross-Tradition Resonances:


  **[Nyāya on pramāṇa]:** Concern for valid measure resonates intellectually.

  *Divergence:* Here the measure is specifically śāstra for action amid āsuric temptation.

  **[Benedictine rule as measure]:** A rule ordering do/don’t for liberation-adjacent
  peace resonates.

  *Divergence:* Benedictine rule is monastic-Christian; Krishna’s śāstra addresses
  Arjuna in war-duty.

  **[Gītā 17’s opening]:** The next chapter problematizes those who abandon śāstra
  yet sacrifice with śraddhā—teaching continues.

  *Divergence:* 16.24 sets the measure; 17 investigates faith’s guṇas when measure
  is dropped.'
