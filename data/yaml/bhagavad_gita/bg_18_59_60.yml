sutra_id: BG_18_59_60
collection: Bhagavad Gita
section: chapter_18
title: Nature Will Enlist You Anyway
sanskrit: 'यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे।मिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां
  नियोक्ष्यति

  स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा।कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत्'
transliteration: 'yadahaṅkāramāśritya na yotsya iti manyase|mithyaiṣa vyavasāyaste
  prakṛtistvāṃ niyokṣyati

  svabhāvajena kaunteya nibaddhaḥ svena karmaṇā|kartuṃ necchasi yanmohātkariṣyasyavaśo''pi
  tat'
translation: If, taking refuge in egoism, you think 'I will not fight,' this resolve
  of yours is vain; nature will compel you. Bound by your own action born of nature,
  O son of Kuntī, you will helplessly do even that which you do not wish to do from
  delusion.
commentary: 'The psychology of refusal is unmasked. “I will not fight,” if rooted
  in ahaṅkāra, is mithyā vyavasāya—vain resolve—because prakṛti will appoint you (niyokṣyati).
  Bound by svabhāva-born karma, you will do even what moha refuses. The contested
  claim attacks spiritualized avoidance: your “no” may still be nature’s “yes” in
  disguise. Existentially, this is terrifying and freeing. Terrifying: escape theater
  fails. Freeing: the fantasy of a pure veto outside nature is dropped, preparing
  true śaraṇa. In the Gītā’s pedagogy, concept without existential cut becomes another
  ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.


  Key Terms:


  **mithyā vyavasāya (मिथ्या व्यवसाय)** — false/vain resolve -> egoic refusal -> ''boundary''
  can be real or this.

  **prakṛtiḥ niyokṣyati (प्रकृतिः नियोक्ष्यति)** — nature will appoint/compel -> inevitability
  under svabhāva -> ''determinism'' as abstract thesis misses the pastoral sting.

  **avaśaḥ (अवशः)** — helpless / not in control -> how the unwanted is done -> ''victim''
  is inexact; it is nature-binding.

  **svabhāvaja karma (स्वभावज कर्म)** — action born of nature -> the binding specific
  -> ''habits'' is partial.


  Cross-Tradition Resonances:


  **[Gītā 3.33]:** Even the wise act according to nature—continuity.

  *Divergence:* 18.59–60 apply it to Arjuna’s war-refusal as vain ego-resolve.

  **[Spinoza on illusion of free veto]:** Thinking we veto while determined resonates.

  *Divergence:* Spinoza’s God/nature differs; Krishna prepares surrender to the heart-Lord.

  **[Freud / unconscious compulsion (loose)]:** Doing what we think we refuse resonates
  psychologically.

  *Divergence:* Psychoanalysis is secular; here prakṛti and moha are the frame.'
voice_of_siva: ''
abhyasa: Find one 'I will never' that keeps happening anyway. Confess it as nature-binding,
  then seek refuge rather than a louder veto.
