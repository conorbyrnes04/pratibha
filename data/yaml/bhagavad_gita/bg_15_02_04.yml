sutra_id: BG_15_02_04
collection: Bhagavad Gita
section: chapter_15
title: Branches Everywhere, Axe of Non-Attachment
sanskrit: 'अधश्चोर्ध्वं प्रसृतास्तस्य शाखा गुणप्रवृद्धा विषयप्रवालाः।अधश्च मूलान्यनुसन्ततानि
  कर्मानुबन्धीनि मनुष्यलोके

  न रूपमस्येह तथोपलभ्यते नान्तो न चादिर्न च संप्रतिष्ठा।अश्वत्थमेनं सुविरूढमूल मसङ्गशस्त्रेण
  दृढेन छित्त्वा

  ततः पदं तत्परिमार्गितव्यम्


  यस्मिन्गता न निवर्तन्ति भूयः।


  तमेव चाद्यं पुरुषं प्रपद्ये


  यतः प्रवृत्तिः प्रसृता पुराणी'
transliteration: 'adhaścordhvaṃ prasṛtāstasya śākhā guṇapravṛddhā viṣayapravālāḥ|adhaśca
  mūlānyanusantatāni karmānubandhīni manuṣyaloke

  na rūpamasyeha tathopalabhyate nānto na cādirna ca saṃpratiṣṭhā|aśvatthamenaṃ suvirūḍhamūla
  masaṅgaśastreṇa dṛḍhena chittvā

  tataḥ padaṃ tatparimārgitavyam


  yasmingatā na nivartanti bhūyaḥ|


  tameva cādyaṃ puruṣaṃ prapadye


  yataḥ pravṛttiḥ prasṛtā purāṇī'
translation: 'Its branches spread below and above, nourished by the guṇas, with sense-objects
  as twigs; and below, the roots extend into the world of humans, binding through
  action. Its form is not perceived here as such—no end, no beginning, no foundation.
  Having cut this deeply rooted aśvattha with the strong axe of non-attachment, one
  should then seek that goal from which, having gone, one does not return again, saying:
  ''I take refuge in that primal person from whom the ancient current streamed forth.'''
commentary: 'The tree thickens: guṇa-fed branches, sense-object shoots, and downward
  roots binding humans through karma. Yet its form cannot be grasped as a finished
  object—no end, beginning, or foundation available to ordinary seeing. The contested
  instruction is violent and precise: cut it with asaṅga-śastra, the axe of non-attachment,
  then seek the irreversible goal and take refuge in the primal person. Knowledge
  of the tree is not botanical tourism; it is preparatory to cutting and refuge. Existentially,
  non-attachment is not mood; it is a blade. Without refuge after the cut, one merely
  becomes homeless among falling leaves. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **asaṅga-śastra (असङ्गशस्त्र)** — weapon/axe of non-attachment -> cutting tool against
  the world-tree -> ''detachment'' as vibe misses the blade.

  **karmānubandhīni (कर्मानुबन्धीनि)** — binding through action -> downward roots
  in human world -> ''consequences'' softens bondage.

  **pada (पद)** — goal/standing-place -> that from which there is no return -> ''state''
  is too vague.

  **prapadye (प्रपद्ये)** — I take refuge -> first-person surrender to the primal
  person -> ''believe in'' is thinner than refuge.


  Cross-Tradition Resonances:


  **[Gītā 15.1 continuity with Kaṭha]:** Same tree, now explicitly cuttable by non-attachment.

  *Divergence:* The Gītā adds karma-roots and explicit śaraṇa language.

  **[John of the Cross, detachment]:** Cutting creaturely cling for God resonates.

  *Divergence:* John’s nights are interior purification; Krishna’s axe follows a cosmological
  tree map.

  **[Nagarjuna / pruning false establishments]:** Undoing falsely founded structures
  loosely parallels cutting the tree.

  *Divergence:* Madhyamaka empties inherent existence; here one seeks a positive irreversible
  pada.'
voice_of_siva: ''
abhyasa: Name one clinging that feeds your tree. Practice one concrete cut today (a
  refusal), then immediately take refuge in the primal person for one minute.
