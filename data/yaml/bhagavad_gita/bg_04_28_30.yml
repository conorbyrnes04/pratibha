collection: Bhagavad Gita
section: chapter_04
title: Substance, Austerity, Yoga, Study — and Breath
sanskrit: 'द्रव्ययज्ञास्तपोयज्ञा योगयज्ञास्तथापरे।


  स्वाध्यायज्ञानयज्ञाश्च यतयः संशितव्रताः


  अपाने जुह्वति प्राण प्राणेऽपानं तथाऽपरे।


  प्राणापानगती रुद्ध्वा प्राणायामपरायणाः


  अपरे नियताहाराः प्राणान्प्राणेषु जुह्वति।


  सर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः'
transliteration: 'dravyayajñāstapoyajñā yogayajñāstathāpare|


  svādhyāyajñānayajñāśca yatayaḥ saṃśitavratāḥ


  apāne juhvati prāṇa prāṇe''pānaṃ tathā''pare|


  prāṇāpānagatī ruddhvā prāṇāyāmaparāyaṇāḥ


  apare niyatāhārāḥ prāṇānprāṇeṣu juhvati|


  sarve''pyete yajñavido yajñakṣapitakalmaṣāḥ'
translation: Some are substance-sacrificers, austerity-sacrificers, yoga-sacrificers;
  and others, practitioners of sharp vows, are recitation-and-knowledge sacrificers.
  Others offer prāṇa into apāna and apāna into prāṇa, restraining the movements of
  the two breaths, devoted to prāṇāyāma. Others, of regulated diet, offer breaths
  into breaths. All these are knowers of sacrifice, their stains diminished by sacrifice.
commentary: 'The catalogue widens again: dravya, tapas, yoga, svādhyāya-jñāna, prāṇāyāma,
  regulated offering of breaths. The contested generosity is that all these count
  as yajña-vid — knowers of sacrifice — whose kalmaṣa is worn down by yajña. Hierarchy
  will arrive soon (knowledge-sacrifice preferred), but first inclusion. In classical
  yoga this legitimates multiple temperaments under one purifying economy. Existentially,
  stop asking whether your practice “counts” by someone else’s fire; ask whether stains
  are actually diminishing. Sharp vows without sacrificial knowing become theater;
  ordinary breath-regulation with sacrificial knowing becomes purification. Inclusion
  first, ranking later: the text refuses to shame substance-giving, austerity, study,
  or breath-work as “not real yoga.” What unifies them is yajña-knowing that diminishes
  kalmaṣa. Sharp vows matter as sincerity marks, not as spiritual fashion. If stains
  are not wearing away, the type may be right while the knowing is missing — or the
  knowing claimed while the offering is theatrical. Let diminished stain be the metric
  across your chosen fire.


  Key Terms:


  **dravyayajña (द्रव्ययज्ञ)** — sacrifice of material substance -> offering of goods/resources
  -> material giving as genuine yajña-type


  **svādhyāya (स्वाध्याय)** — self-recitation/study -> sacred study as sacrificial
  act -> not secular homework; offering of attention into text


  **yajñakṣapitakalmaṣa (यज्ञक्षपितकल्मष)** — stain worn away by sacrifice -> purification
  metric shared across types -> the common fruit that unifies pluralism


  Cross-Tradition Resonances:


  **Benedictine ora et labora diversity of offices:** Structural homology in multiple
  legitimate asceses under one holy economy.

  *Divergence:* Monastic offices are christological-liturgical; here types are explicitly
  named as yajña exhausting kalmaṣa.


  **Islamic pillars as plural worship forms:** Structural homology in wealth, body,
  and remembrance as coordinated offerings.

  *Divergence:* Islamic forms are sharīʿa-specified; the Gītā’s list is yogic-typological
  within karma-jñāna pedagogy.'
voice_of_siva: ''
abhyasa: Pick the yajña-type nearest your temperament (giving, austerity, yoga, study,
  breath, diet) and complete one sharp, finite offering today aimed at wearing down
  a known stain.
