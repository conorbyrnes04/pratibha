sutra_id: BG_15_07
collection: Bhagavad Gita
section: chapter_15
title: My Own Portion Become Living
sanskrit: ममैवांशो जीवलोके जीवभूतः सनातनः।मनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति
transliteration: mamaivāṃśo jīvaloke jīvabhūtaḥ sanātanaḥ|manaḥṣaṣṭhānīndriyāṇi prakṛtisthāni
  karṣati
translation: A portion of Mine alone becomes the eternal living being in the world
  of the living, and draws to itself the senses, with the mind as the sixth, that
  rest in nature.
commentary: 'The jīva is not an alien spark kidnapped by matter; it is mamaiva aṃśa—Krishna’s
  own portion—become living in the living world, eternal (sanātana). This portion
  draws the senses and mind (the sixth) that are stationed in prakṛti. The contested
  move is simultaneous intimacy and tension: you are the Lord’s portion, and you are
  the one yanking prakṛti’s instruments into a private drama. Bondage is not that
  an aṃśa exists; it is how it appropriates mind-senses. Existentially, this blocks
  both self-contempt and self-deification. You are not trash, and you are not the
  whole; you are a portion that can either clutch instruments or remember source.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **aṃśa (अंश)** — portion / share -> jīva as the Lord’s portion -> ''piece of God''
  can become crude pantheism.

  **jīva-bhūta (जीवभूत)** — become a living being -> portion as embodied life -> ''soul
  incarnate'' may smuggle foreign anthropology.

  **karṣati (कर्षति)** — draws / drags -> appropriation of mind-senses -> ''uses''
  softens the dragging violence.

  **manaḥ-ṣaṣṭha (मनःषष्ठ)** — mind as sixth -> mind grouped with senses as drawn
  instruments -> ''mind and five senses'' as list misses the dragging.


  Cross-Tradition Resonances:


  **[Gītā 7.5 / 13.22]:** Jīva amid prakṛti continues the field-person analysis.

  *Divergence:* 15.7 makes the jīva explicitly the Lord’s portion.

  **[Rāmānuja on aṃśa-śeṣa]:** The soul as mode/portion of the Lord is theistic homology.

  *Divergence:* Advaita readings stress apparent limitation; the verse’s ''draws the
  senses'' keeps psychological realism.

  **[Paul, ''body of Christ'' membership]:** Portion-of-the-whole anthropology loosely
  resonates.

  *Divergence:* Pauline membership is ecclesial; here the portion is metaphysical
  and sense-dragging.'
