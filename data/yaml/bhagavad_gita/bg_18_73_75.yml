sutra_id: BG_18_73_75
collection: Bhagavad Gita
section: chapter_18
title: My Delusion Is Gone; I Will Do Your Word
sanskrit: 'अर्जुन उवाचनष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाच्युत।स्थितोऽस्मि
  गतसन्देहः करिष्ये वचनं तव

  सञ्जय उवाचइत्यहं वासुदेवस्य पार्थस्य च महात्मनः।संवादमिममश्रौषमद्भुतं रोमहर्षणम्

  व्यासप्रसादाच्छ्रुतवानेतद्गुह्यमहं परम्।योगं योगेश्वरात्कृष्णात्साक्षात्कथयतः स्वयम्'
transliteration: 'arjuna uvācanaṣṭo mohaḥ smṛtirlabdhā tvatprasādānmayācyuta|sthito''smi
  gatasandehaḥ kariṣye vacanaṃ tava

  sañjaya uvācaityahaṃ vāsudevasya pārthasya ca mahātmanaḥ|saṃvādamimamaśrauṣamadbhutaṃ
  romaharṣaṇam

  vyāsaprasādācchrutavānetadguhyamahaṃ param|yogaṃ yogeśvarātkṛṣṇātsākṣātkathayataḥ
  svayam'
translation: 'Arjuna said: My delusion is gone; memory is regained by Your grace,
  O Acyuta. I stand firm, with doubts gone; I will do Your word. Sañjaya said: Thus
  I heard this wondrous, hair-raising dialogue of Vāsudeva and the great-souled Pārtha.
  By Vyāsa’s grace I heard this supreme secret, yoga from the Lord of yoga, Kṛṣṇa
  himself speaking.'
commentary: 'Arjuna’s response is the pedagogical proof: naṣṭo mohaḥ, smṛtir labdhā,
  gata-sandehaḥ, kariṣye vacanaṃ tava—delusion destroyed, memory gained, doubt gone,
  I will do your word. Grace is credited (tvat-prasādāt). Then Sañjaya frames the
  hearing as adbhuta and romaharṣaṇa, received by Vyāsa’s grace from Yogesvara himself.
  The contested completeness is ethical: knowledge ends in kariṣye—I will do. Existentially,
  if your “realization” does not become vacana-performance, it is not yet Arjuna’s
  hearing. In the Gītā’s pedagogy, concept without existential cut becomes another
  ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics.


  Key Terms:


  **naṣṭo mohaḥ (नष्टो मोहः)** — delusion destroyed -> Arjuna’s attainment -> ''I
  feel better'' is not enough.

  **smṛtir labdhā (स्मृतिर्लब्धा)** — memory regained -> recollection of truth/self
  -> ''recall facts'' understates.

  **kariṣye vacanam (करिष्ये वचनम्)** — I will do your word -> obedience as fruition
  -> ''agree intellectually'' fails.

  **yogeśvara (योगेश्वर)** — Lord of yoga -> Krishna as source of the heard yoga ->
  ''yoga teacher'' is comic understatement.


  Cross-Tradition Resonances:


  **[Gītā 2.7 to 18.73]:** From collapse to standing firm completes the arc.

  *Divergence:* The transformation is explicitly prasāda-caused.

  **[Mary’s fiat / ''let it be'']:** Hearing into doing resonates.

  *Divergence:* Christian fiat is Incarnation-shaped; Arjuna’s fiat returns him to
  dharma-war under refuge.

  **[Plato’s cave prisoner returning]:** Seeing then acting in the world resonates.

  *Divergence:* Plato’s return is philosophical-political; Arjuna’s is obedient action
  under grace.'
