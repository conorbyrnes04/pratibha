sutra_id: BG_06_18_20
collection: Bhagavad Gita
section: chapter_06
title: Mind Stilled Like a Lamp in Windless Place
sanskrit: 'यदा विनियतं चित्तमात्मन्येवावतिष्ठते।


  निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा


  यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता।


  योगिनो यतचित्तस्य युञ्जतो योगमात्मनः


  यत्रोपरमते चित्तं निरुद्धं योगसेवया।


  यत्र चैवात्मनाऽऽत्मानं पश्यन्नात्मनि तुष्यति'
transliteration: 'yadā viniyataṃ cittamātmanyevāvatiṣṭhate|


  niḥspṛhaḥ sarvakāmebhyo yukta ityucyate tadā


  yathā dīpo nivātastho neṅgate sopamā smṛtā|


  yogino yatacittasya yuñjato yogamātmanaḥ


  yatroparamate cittaṃ niruddhaṃ yogasevayā|


  yatra caivātmanā''''tmānaṃ paśyannātmani tuṣyati'
translation: When the well-disciplined mind abides in the Self alone, without longing
  for any desires — then one is called integrated. As a lamp standing in a windless
  place does not flicker — that comparison is remembered for the yogin of restrained
  mind practicing the yoga of the self. Where the mind comes to rest, restrained by
  yoga practice, and where seeing the Self by the Self one is content in the Self—
commentary: 'Yukta is timed to a when: viniyata citta abides in ātman, niḥspṛha toward
  all kāmas. The lamp-in-nivāta image gives the phenomenology — non-flicker under
  restraint while practicing ātman’s yoga. Then the where: citta uparamate, niruddha
  by yoga-sevā; and Self is seen by Self with contentment in Self. The contested claim
  is that contentment is cognitive-visionary, not reward for concentration. In Pātañjala
  resonance, nirodha language appears inside Gītā bhakti-yoga framing. Existentially,
  stop calling every quiet mood “yoga.” Look for non-flicker, desirelessness, and
  Self-seeing contentment. That is the lamp. The lamp simile gives a criterion against
  drowsy dullness and forced blankness alike: non-flicker under restraint while practicing
  Self-yoga. Rest and Self-seeing contentment mark the where of integration, with
  desirelessness as climate. Quiet moods are not automatically this. Serve yoga repeatedly
  until flicker yields to lamp-steadiness and contentment in Self-seeing. That phenomenology
  is the teaching’s proof. The contested force of the passage remains practical: it
  asks for a change in how you inhabit action, attention, and relation — not for ornamental
  agreement. Return to the line until the claim bites a live decision today.


  Key Terms:


  **nivātastha dīpa (निवातस्थ दीप)** — lamp in windless place -> classic simile of
  unwavering citta -> stillness as non-oscillation


  **yoga-sevā (योगसेवा)** — practice/service of yoga -> what restrains the mind to
  rest -> emphasizes repeated tending


  **ātmanā ātmānam (आत्मना आत्मानम्)** — Self by the Self -> reflexive seeing -> knowing
  as self-revelation, not object hunt


  Cross-Tradition Resonances:


  **Patañjali YS 1.2–1.3:** Structural homology in restraint of citta and abiding
  in seer’s nature.

  *Divergence:* Patañjali’s system is kleśa-oriented sūtra method; Gītā embeds nirodha-like
  rest in theistic dhyāna chapter.


  **Plotinus on the soul’s stillness before the One:** Structural homology in non-flickering
  interior for vision.

  *Divergence:* Plotinian vision ascends emanation hierarchy; here contentment is
  Self-seeing in ātman via yoga-sevā.'
voice_of_siva: ''
abhyasa: Sit until you can feel the difference between drowsy dullness and lamp-like
  non-flicker; when flicker returns, gently re-serve yoga rather than forcing blankness.
