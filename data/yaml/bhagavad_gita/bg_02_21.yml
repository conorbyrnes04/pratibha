sutra_id: BG_02_21
collection: Bhagavad Gita
section: chapter_02
title: Knowing the Indestructible — Whom Does He Slay
sanskrit: 'वेदाविनाशिनं नित्यं य एनमजमव्ययम्।


  कथं स पुरुषः पार्थ कं घातयति हन्ति कम्'
transliteration: 'vedāvināśinaṃ nityaṃ ya enamajamavyayam|


  kathaṃ sa puruṣaḥ pārtha kaṃ ghātayati hanti kam'
translation: “Who knows this as indestructible, eternal, unborn, imperishable — how
  does that person, Pārtha, cause anyone to be killed, and whom does he kill?”
commentary: 'Knowledge transforms the grammar of agency. The knower of the unborn
  cannot ultimately *ghātayati* or *hanti* anyone as Self-destroyer. The contested
  reading is ethical: does this abolish responsibility? The Gītā’s trajectory says
  no — it abolishes the delusion that the Self is a perishable combatant, while still
  commanding dharma-action. The rhetorical questions clear false ultimate agency so
  right relative agency can return without panic. Existentially, use the verse to
  drop the fantasy that you can annihilate what another most is — and to drop the
  despair that you yourself can be so annihilated — then face the finite harms and
  duties that remain.


  Knowing revises agency-language. You still act; you stop fantasizing ultimate erasure
  as your power or your doom. The rhetorical questions clear the field for dharma
  without the metaphysics of annihilation.


  If ultimate killing is impossible, cruelty does not become permitted; panic becomes
  unnecessary. Clean relative harm-assessment replaces cosmic despair. That is the
  ethical yield of the rhetorical questions.


  After clearing ultimate killer/killed language, audit residual rationalizations
  of cruelty and discard them.


  Key Terms:


  **veda (वेद)** — knows/has come to know → knowledge as transformative seeing, not
  information → “knows” understates realization-force.


  **avyaya (अव्यय)** — imperishable/inexhaustible → not subject to dwindling → “unchanging”
  is related but not identical.


  **ghātayati / hanti (घातयति / हन्ति)** — causes to be slain / slays → dual agency
  verbs emptied at the ultimate level → the pair covers direct and causative killing.


  Cross-Tradition Resonances:


  **Īśā Upaniṣad 1–3:** Both relocate agency and appropriation once the Self/Lord
  is known as filling all.

  *Divergence:* Īśā emphasizes renunciation-in-enjoyment; here the focus is the impossibility
  of ultimate killing.


  **Plotinus, Enneads I.1:** Both ask what truly acts and suffers when body and soul
  are distinguished.

  *Divergence:* Plotinus analyzes for contemplative purification; Kṛṣṇa analyzes to
  unblock Arjuna’s duty.'
voice_of_siva: ''
abhyasa: 'Before speaking of someone as ruined or finished, ask: “Whom exactly am
  I declaring killed?” Separate finite harm from ultimate erasure in one written line.'
