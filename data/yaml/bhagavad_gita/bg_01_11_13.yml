title: Protect Bhīṣma — Then the Conch Begins the Noise of War
sanskrit: 'अयनेषु च सर्वेषु यथाभागमवस्थिताः।


  भीष्ममेवाभिरक्षन्तु भवन्तः सर्व एव हि


  तस्य संजनयन्हर्षं कुरुवृद्धः पितामहः।


  सिंहनादं विनद्योच्चैः शङ्खं दध्मौ प्रतापवान्


  ततः शङ्खाश्च भेर्यश्च पणवानकगोमुखाः।


  सहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत्'
transliteration: 'ayaneṣu ca sarveṣu yathābhāgamavasthitāḥ|


  bhīṣmamevābhirakṣantu bhavantaḥ sarva eva hi


  tasya saṃjanayanharṣaṃ kuruvṛddhaḥ pitāmahaḥ|


  siṃhanādaṃ vinadyoccaiḥ śaṅkhaṃ dadhmau pratāpavān


  tataḥ śaṅkhāśca bheryaśca paṇavānakagomukhāḥ|


  sahasaivābhyahanyanta sa śabdastumulo''bhavat'
translation: “Stationed in all your positions according to your assignments, all of
  you must protect Bhīṣma alone.” Generating joy for him, the aged Kuru grandfather,
  roaring a lion’s roar, blew his conch with mighty valor. Then conches, drums, tabors,
  war-drums, and horns suddenly sounded together, and that noise became a tumult.
commentary: 'Command collapses into a single axis: protect Bhīṣma. The army’s many
  stations exist to defend one pillar, which means the coalition’s courage is structurally
  brittle. Bhīṣma’s answering conch converts Duryodhana’s anxiety into public exhilaration
  — sound as morale technology. The contested move is that war’s first “victory” is
  acoustic: before blood, there is *tumula*, noise that floods discernment. In epic
  ritual, the conch inaugurates *yuddha* as sacred-violent theater. Existentially,
  notice what sounds you use to drown the quiet question of whether the fight is right
  — applause, group chat surge, the roar that makes hesitation feel like betrayal.
  The passage marks the moment when collective arousal overtakes individual seeing.


  Protecting one pillar while awakening a roar is how coalitions hide their fragility.
  The text invites you to notice the instruments you use to manufacture courage. If
  courage requires drowning the quiet, it is not yet the courage yoga will teach.


  Existentially, replace manufactured roar with one honest sentence about what you
  fear losing if Bhīṣma — your pillar — falls. Courage that can speak fear is closer
  to yoga than courage that only blows conches.


  Key Terms:


  **ayaneṣu (अयनेषु)** — in the approaches/stations → assigned tactical positions
  → “in your places” misses the geometric discipline of the array.


  **siṃhanāda (सिंहनाद)** — lion’s roar → martial sound that claims dominion → “loud
  cry” loses the animal-sovereignty metaphor of courage.


  **tumula (तुमुल)** — tumultuous uproar → sound as overwhelming field-condition →
  “noise” understates how tumult disables fine moral attention.


  Cross-Tradition Resonances:


  **Aeschylus, Seven Against Thebes (shield scene / war din):** Both stage the onset
  of battle through sound and protective positioning around a city’s/army pillar.

  *Divergence:* Aeschylus centers civic fate under the gods; the Gītā’s din prepares
  a turn from martial theater to inner crisis.


  **Patañjali, Yoga Sūtra 1.2:** Both imply that agitated sensory flood (*tumula*/vṛtti)
  obstructs stable seeing.

  *Divergence:* YS seeks nirodha as method; here the tumult is narrative condition
  that will force Arjuna’s breakdown.'
voice_of_siva: ''
abhyasa: When a group surge of noise or messaging pushes you toward action, wait until
  the sound drops, then name the one person or principle you were being told to “protect
  at all costs.”
