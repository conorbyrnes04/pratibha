sutra_id: BG_08_22
collection: Bhagavad Gita
section: chapter_08
title: The Supreme Person Won by Exclusive Devotion
sanskrit: 'पुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया।


  यस्यान्तःस्थानि भूतानि येन सर्वमिदं ततम्'
transliteration: 'puruṣaḥ sa paraḥ pārtha bhaktyā labhyastvananyayā|


  yasyāntaḥsthāni bhūtāni yena sarvamidaṃ tatam'
translation: That Person is the supreme, O Pārtha, reachable by devotion that is exclusive
  [ananya]; within whom beings stand, by whom all this is pervaded.
commentary: 'After cosmic scales and double unmanifests, the method is startlingly
  intimate: ananya bhakti. The supreme Puruṣa is not seized by cartography of worlds
  but reached by devotion with no rival. Yet the same Person contains beings within
  and pervades all this — so exclusivity of devotion is not narrowness of metaphysics.
  The contested pairing is: exclusive love, universal ontology. Existentially people
  often invert this — universal sentimentality without exclusive devotion, or exclusive
  devotion that shrinks the world. The verse holds both: all beings stand in Him;
  He is won by ananya bhakti. Practice becomes fidelity without provincialism. The
  line-level force of the teaching is practical, not ornamental: what it claims about
  reality is meant to reshape how you attend, choose, and depart. If the claim does
  not alter rehearsal in ordinary time, it will not hold when time thins. Existential
  uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **ananya bhakti (अनन्य भक्ति)** — devotion with no other -> the means of attaining
  the supreme Person -> "loyalty" understates exclusivity of relational aim.


  **tatam (ततम्)** — spread/pervaded -> all this stretched through by the Person ->
  "present everywhere" is close but misses the woven-through sense.


  Cross-Tradition Resonances:


  **Shema (love the Lord with all heart):** Both demand unpartitioned devotion.

  *Divergence:* Biblical monotheism''s covenant frame differs from Gītā''s Person-within-whom-beings-stand
  ontology.


  **Bhāgavata bhakti theology:** Structural kinship in exclusive devotion.

  *Divergence:* Later elaborations expand rasa; here the claim is compressed beside
  cosmic pervading.'
voice_of_siva: ''
abhyasa: Name the "other" that most often rivals devotion (work, image, anxiety).
  For one hour, practice devotion as if that rival were not the center — without pretending
  the rival does not exist.
