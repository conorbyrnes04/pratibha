sutra_id: BG_04_19_21
collection: Bhagavad Gita
section: chapter_04
title: Desireless Beginnings Burn in Knowledge-Fire
sanskrit: 'यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः।


  ज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः


  त्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः।


  कर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः


  निराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः।


  शारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम्'
transliteration: 'yasya sarve samārambhāḥ kāmasaṅkalpavarjitāḥ|


  jñānāgnidagdhakarmāṇaṃ tamāhuḥ paṇḍitaṃ budhāḥ


  tyaktvā karmaphalāsaṅgaṃ nityatṛpto nirāśrayaḥ|


  karmaṇyabhipravṛtto''pi naiva kiñcitkaroti saḥ


  nirāśīryatacittātmā tyaktasarvaparigrahaḥ|


  śārīraṃ kevalaṃ karma kurvannāpnoti kilbiṣam'
translation: Whose every undertaking is free from desire’s resolve [kāma-saṅkalpa],
  whose actions are burned in knowledge-fire — the wise call that one a pandit. Having
  abandoned attachment to the fruit of action, always content, without dependence
  — even though fully engaged in action, that one does nothing at all. Free from longing,
  mind-and-self restrained, having abandoned all grasping — performing only bodily
  action, one does not incur evil.
commentary: 'Panditry is redefined: not textual stockpile but undertakings stripped
  of kāma-saṅkalpa, with karma burned in jñāna-agni. The contested miracle follows
  — fully engaged, yet doing nothing — because fruit-attachment and dependence have
  been dropped. Then a severe simplicity: when longing and parigraha fall, even “only
  bodily action” incurs no kilbiṣa. In karma-yoga metaphysics, binding is intention-claim,
  not muscle movement. Existentially, begin at the resolve: what saṅkalpa starts this?
  If desire authors the beginning, fire has not yet burned the deed. Contentment without
  dependence is the inner climate in which action becomes non-action. Undertakings
  are judged at their saṅkalpa-root: if desire authors the beginning, knowledge-fire
  has not yet burned the deed’s binding. Full engagement with “doing nothing” is possible
  only where fruit-attachment and dependence have already been dropped — a miracle
  of interior climate, not of outer inactivity. “Only bodily action” then incurs no
  evil because appropriation has vacated the body-deed. Panditry is this burned, desireless
  beginning — not citations. Start where resolves are born.


  Key Terms:


  **kāmasaṅkalpa (कामसङ्कल्प)** — desire’s resolve/intention-forming -> the seed-form
  of binding undertakings -> “motive” is vague; saṅkalpa is the formative yes of wanting


  **jñānāgni (ज्ञानाग्नि)** — fire of knowledge -> that which burns residual binding
  of actions -> knowledge as metabolic fire, not mere information


  **parigraha (परिग्रह)** — grasping/possessive taking -> what must be abandoned for
  bodily action to be clean -> includes subtle hoarding of roles and outcomes


  Cross-Tradition Resonances:


  **Stoic reservation (hupexairesis):** Structural homology in acting while releasing
  attachment to outcomes.

  *Divergence:* Stoicism retains prohairesis as moral center; the Gītā adds knowledge-fire
  consuming karma’s binding residue.


  **Zen “no gaining mind” in work:** Structural homology in wholehearted activity
  without acquisition-mind.

  *Divergence:* Zen often empties into non-dual thusness; here the idiom is explicitly
  jñāna-fire and non-incurring of kilbiṣa.'
voice_of_siva: ''
abhyasa: Before starting a project, cancel one desire-resolve sentence (“this will
  get me X”); begin with only the body’s needed motions and a contentment that does
  not lean on the result.
