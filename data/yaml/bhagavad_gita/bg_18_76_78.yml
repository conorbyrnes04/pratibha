sutra_id: BG_18_76_78
collection: Bhagavad Gita
section: chapter_18
title: Wherever There Is Krishna and Arjuna
sanskrit: 'राजन्संस्मृत्य संस्मृत्य संवादमिममद्भुतम्।केशवार्जुनयोः पुण्यं हृष्यामि
  च मुहुर्मुहुः

  तच्च संस्मृत्य संस्मृत्य रूपमत्यद्भुतं हरेः।


  विस्मयो मे महान् राजन् हृष्यामि च पुनः पुनः

  यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः।


  तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम'
transliteration: 'rājansaṃsmṛtya saṃsmṛtya saṃvādamimamadbhutam|keśavārjunayoḥ puṇyaṃ
  hṛṣyāmi ca muhurmuhuḥ

  tacca saṃsmṛtya saṃsmṛtya rūpamatyadbhutaṃ hareḥ|


  vismayo me mahān rājan hṛṣyāmi ca punaḥ punaḥ

  yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ|


  tatra śrīrvijayo bhūtirdhruvā nītirmatirmama'
translation: O King, remembering again and again this wondrous and holy dialogue of
  Keśava and Arjuna, I rejoice again and again. And remembering again and again that
  most wondrous form of Hari, great is my amazement, O King, and I rejoice again and
  again. Wherever there is Kṛṣṇa, Lord of yoga, and wherever there is Pārtha, the
  archer—there, I hold, are fortune, victory, thriving, and lasting policy.
commentary: 'Sañjaya’s coda is liturgical memory: saṃsmṛtya saṃsmṛtya—remembering
  again and again—the dialogue and the cosmic form, he rejoices. Then the final maxim:
  where Yogesvara Krishna and archer Arjuna are, there are śrī, vijaya, bhūti, and
  dhruvā nīti. The contested claim is not sports-team theology; it is that victory’s
  ecology is the conjunction of the Lord of yoga and the devoted doer of the word.
  Existentially, seek that conjunction, not isolated technique or isolated aggression.
  The Gītā ends not with withdrawal from the field but with a criterion for where
  thriving truly stands. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.


  Key Terms:


  **saṃsmṛtya saṃsmṛtya (संस्मृत्य संस्मृत्य)** — remembering again and again -> joy’s
  engine -> ''nostalgia'' understates living recollection.

  **yogeśvaraḥ kṛṣṇaḥ (योगेश्वरः कृष्णः)** — Krishna, Lord of yoga -> one pole of
  victory’s presence -> ''god on our side'' is the corrupt hearing.

  **pārtho dhanurdharaḥ (पार्थो धनुर्धरः)** — Pārtha the bow-bearer -> devoted actor
  pole -> ''heroic ego'' is the corrupt hearing.

  **dhruvā nīti (ध्रुवा नीति)** — lasting right policy/conduct -> fruit of that conjunction
  -> ''winning strategy'' can be amoral counterfeit.

  **śrīr vijayo bhūtiḥ (श्रीर्विजयो भूतिः)** — fortune, victory, thriving -> signs
  of the conjunction -> ''success gospel'' is the danger.


  Cross-Tradition Resonances:


  **[Gītā 11 remembered]:** Sañjaya’s amaze at the form ties back to theophany.

  *Divergence:* The ending pairs form-memory with dialogue-memory as twin joys.

  **[Exodus / ''God with us'' victory motifs]:** Divine presence as victory condition
  resonates.

  *Divergence:* Biblical holy war frames differ; here presence is Krishna-plus-Arjuna
  specifically.

  **[Mahābhārata’s dharma-war horizon]:** The verse places the Gītā back into the
  epic’s stakes.

  *Divergence:* Sañjaya speaks to Dhṛtarāṣṭra: the theological criterion implicitly
  judges the Kaurava project.'
voice_of_siva: ''
abhyasa: 'Ask of your current struggle: ''Is the Lord of yoga present here—and am
  I present as one who will do the word?'' If one pole is missing, restore it before
  seeking victory.'
