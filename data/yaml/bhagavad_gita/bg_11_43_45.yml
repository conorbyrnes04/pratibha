sutra_id: BG_11_43_45
collection: Bhagavad Gita
section: chapter_11
title: Father of the World — I Cannot Bear This
sanskrit: 'पितासि लोकस्य चराचरस्य


  त्वमस्य पूज्यश्च गुरुर्गरीयान्।


  न त्वत्समोऽस्त्यभ्यधिकः कुतोऽन्यो


  लोकत्रयेऽप्यप्रतिमप्रभाव


  तस्मात्प्रणम्य प्रणिधाय कायं


  प्रसादये त्वामहमीशमीड्यम्।


  पितेव पुत्रस्य सखेव सख्युः


  प्रियः प्रियायार्हसि देव सोढुम्


  अदृष्टपूर्वं हृषितोऽस्मि दृष्ट्वा


  भयेन च प्रव्यथितं मनो मे।


  तदेव मे दर्शय देव रूपं


  प्रसीद देवेश जगन्निवास'
transliteration: 'pitāsi lokasya carācarasya


  tvamasya pūjyaśca gururgarīyān|


  na tvatsamo''styabhyadhikaḥ kuto''nyo


  lokatraye''pyapratimaprabhāva


  tasmātpraṇamya praṇidhāya kāyaṃ


  prasādaye tvāmahamīśamīḍyam|


  piteva putrasya sakheva sakhyuḥ


  priyaḥ priyāyārhasi deva soḍhum


  adṛṣṭapūrvaṃ hṛṣito''smi dṛṣṭvā


  bhayena ca pravyathitaṃ mano me|


  tadeva me darśaya deva rūpaṃ


  prasīda deveśa jagannivāsa'
translation: You are father of the moving and unmoving world, its worship-object and
  weightier teacher; none is Your equal — how any greater — in the three worlds, O
  incomparable in power? Therefore bowing and prostrating I ask grace; as father with
  son, friend with friend, beloved with beloved, bear with me, O God. I have seen
  what was never seen, and I am glad — yet my mind shakes with fear. Show me that
  very form; be gracious, Lord of gods, Abode of the world.
commentary: 'Authentic vision can be rightly unsustainable; grace includes a bearable
  face. The contested move in this stretch of the vision is that father guru unequaled;
  bear with me as father friend beloved; glad yet afraid; show that form again. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion
  after seeing. Do not aestheticize the theophany; let it revise what you think action,
  fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **adṛṣṭapūrva (अदृष्टपूर्व)** — passage key term -> Authentic vision can be rightly
  unsustainable; grace includes a bearable face. -> default gloss flattens the vision''s
  force

  **priya forbearance (प्रसाद)** — paired key term -> Father guru unequaled; bear
  with me as father friend beloved; glad yet afraid; show that form again. -> soft
  translation misses structural role


  Cross-Tradition Resonances:


  **[Transfiguration return]:** Structural kinship around vision then return.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Teresa unsustainable favors]:** Shared pressure of vision then return.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person
  disclosure.'
