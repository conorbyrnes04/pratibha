sutra_id: BG_04_37
collection: Bhagavad Gita
section: chapter_04
title: Knowledge-Fire Makes Ashes of All Actions
sanskrit: 'यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन।


  ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा'
transliteration: 'yathaidhāṃsi samiddho''gnirbhasmasātkurute''rjuna|


  jñānāgniḥ sarvakarmāṇi bhasmasātkurute tathā'
translation: As a well-kindled fire makes fuel into ashes, Arjuna, so the fire of
  knowledge makes all actions into ashes.
commentary: 'The metaphor is totalizing: samiddha fire leaves fuel as bhasman; jñānāgni
  leaves all karmas as ashes. The contested claim is not that actions never occurred,
  but that their binding potency is incinerated. In karma theory this is one of the
  strongest statements of knowledge’s power — stronger than gradual wearing. Existentially,
  it warns against despair over accumulated deeds and against treating knowledge as
  mild therapy. If the fire is truly kindled, the ledger’s grip burns. The practical
  question becomes: is your “knowledge” a spark, a slogan, or a blaze that changes
  how deeds stick? Ashes mean the ledger’s grip is metabolized, not that history is
  erased from memory like denial. Well-kindled knowledge differs from brittle opinion
  precisely by this incinerating power over binding residue. Despair over accumulated
  deeds is challenged without licensing carelessness: the fire must be real. Ask whether
  your knowing changes how actions stick to the heart. If not, you may have smoke
  without flame.


  Key Terms:


  **jñānāgni (ज्ञानाग्नि)** — knowledge-fire -> incinerating power of liberating knowing
  -> metaphor of irreversible transformation of karma’s binding


  **bhasmasāt (भस्मसात्)** — reduced to ashes -> complete neutralization image ->
  not hiding karma; metabolizing it


  **samiddha (समिद्ध)** — well-kindled -> condition of the fire’s adequacy -> weak
  knowing cannot claim this effect


  Cross-Tradition Resonances:


  **Paul, 1 Corinthians 3 (fire testing works):** Structural homology in fire as criterion
  that consumes what cannot endure.

  *Divergence:* Pauline fire tests works’ quality toward reward; Gītā’s knowledge-fire
  ashes all karmas’ binding for the knower.


  **Alchemical calcination:** Structural homology in burning to ash as purification
  of substance.

  *Divergence:* Alchemy operates on materials/subtle body; here the fuel is sarva-karmāṇi
  as binding processes.'
voice_of_siva: ''
abhyasa: Bring one repeated guilt-deed into clear seeing of non-doership/offering;
  stay with the seeing until the urge to self-punish loosens like ash, not like denial.
