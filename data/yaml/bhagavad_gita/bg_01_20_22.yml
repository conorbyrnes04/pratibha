collection: Bhagavad Gita
section: chapter_01
title: Place My Chariot Between the Two Armies
sanskrit: 'अथ व्यवस्थितान् दृष्ट्वा धार्तराष्ट्रान्कपिध्वजः।


  प्रवृत्ते शस्त्रसंपाते धनुरुद्यम्य पाण्डवः


  अर्जुन उवाच


  हृषीकेशं तदा वाक्यमिदमाह महीपते।


  सेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत


  यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान्।


  कैर्मया सह योद्धव्यमस्मिन्रणसमुद्यमे'
transliteration: 'atha vyavasthitān dṛṣṭvā dhārtarāṣṭrānkapidhvajaḥ|


  pravṛtte śastrasaṃpāte dhanurudyamya pāṇḍavaḥ


  arjuna uvāca


  hṛṣīkeśaṃ tadā vākyamidamāha mahīpate|


  senayorubhayormadhye rathaṃ sthāpaya me''cyuta


  yāvadetānnirīkṣe''haṃ yoddhukāmānavasthitān|


  kairmayā saha yoddhavyamasminraṇasamudyame'
translation: 'Then, seeing Dhṛtarāṣṭra’s sons arrayed as the clash of weapons began,
  the monkey-bannered Pāṇḍava raised his bow and said to Hṛṣīkeśa: “Place my chariot
  between the two armies, O Acyuta, so that I may look upon these who stand eager
  to fight — with whom I must do battle in this undertaking of war.”'
commentary: 'Arjuna’s first spoken act is a request for middle space. He does not
  yet refuse; he asks to *see*. The contested move is that right action requires a
  deliberate pause in the kill-zone between formations — *senayor ubhayor madhye*.
  War wants momentum; wisdom asks for a vantage. Calling Kṛṣṇa Acyuta (“unfallen”)
  while asking to be stationed for vision already frames the charioteer as the stable
  center. In the Gītā’s architecture, this request creates the pedagogical geometry
  of the whole text: teaching happens between armies. Existentially, the verse legitimizes
  the courage to stop at the threshold and look at who you are about to harm. Not
  all hesitation is cowardice; some is the insistence that action without seeing is
  not dharma but reflex.


  Requesting the middle is Arjuna’s first yogic act, even before he knows yoga. He
  asks the Unfallen to create a space where seeing can precede striking. Practice
  begins as the courage to relocate yourself where abstraction dies.


  Key Terms:


  **madhye (मध्ये)** — in the middle → liminal teaching-space between forces → “between”
  is spatially true but misses the spiritual threshold created.


  **nirīkṣe (निरीक्षे)** — I would look upon / examine → seeing as ethical prerequisite
  → “see” understates investigative regard.


  **Acyuta (अच्युत)** — unfallen / unshaken → Kṛṣṇa as stable referent amid crisis
  → “Kṛṣṇa” alone loses the theological reassurance in the epithet.


  Cross-Tradition Resonances:


  **Plato, Apology 28b–30c:** Both show a warrior-figure insisting on examined action
  rather than mere reputation for courage.

  *Divergence:* Socrates examines under civic trial; Arjuna examines under imminent
  kin-slaughter.


  **Zhuangzi, Cook Ding:** Both value a pause of precise seeing before the cut.

  *Divergence:* Cook Ding’s pause yields effortless skill within life; Arjuna’s pause
  will yield collapse before teaching reconstitutes action.'
voice_of_siva: ''
abhyasa: Before a hard confrontation today, literally or mentally stand “between the
  two sides” for one minute and name three faces you must not abstract into roles.
