sutra_id: BG_02_48
collection: Bhagavad Gita
section: chapter_02
title: Established in Yoga, Do Actions — Equanimity Is Yoga
sanskrit: 'योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।


  सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते'
transliteration: 'yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya|


  siddhyasiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate'
translation: “Established in yoga, do actions, having abandoned attachment, Dhanaṃjaya.
  Having become equal in success and non-success, evenness is called yoga.”
commentary: 'Yoga is defined as *samatva* — evenness — not as withdrawal or posture.
  The command is active: *kuru karmāṇi* while *yoga-stha*. Attachment (*saṅga*) is
  dropped; equality toward *siddhi/asiddhi* is taken up. The contested claim is that
  yoga equals a way of relating to outcomes while acting, not an alternative to acting.
  Existentially, this makes practice testable in email, conflict, and craft: can you
  stay even when the metric flips?


  Evenness as yoga makes the definition testable at work. Success and failure become
  weather across which the yoked continue. If your yoga vanishes when metrics flip,
  it was preference, not yoga.


  Samatva is verified under flip risk. Pre-commit to evenness, act, then inspect the
  body for clinging residue. That inspection is the yoga, not the slogan. Evenness
  under flip risk is the empirical definition. Slogan-evenness that collapses at outcomes
  is not yet yoga.


  Inspect evenness after a metric flip; residue of clinging is the real score of whether
  yoga was present.


  Key Terms:


  **yoga-stha (योगस्थ)** — standing established in yoga → abiding in the yoked state
  while acting → “being in yoga” is vague; *stha* stresses stable station.


  **saṅga (सङ्ग)** — attachment/sticking → adhesive bonding to fruit or role → “attachment”
  is right; stickiness is the feel.


  **samatva (समत्व)** — evenness/equanimity → yoga’s definition here → “balance” can
  sound lifestyle; this is parity across success/failure.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.33:** Both cultivate even affective stance as yogic stabilization.

  *Divergence:* YS lists friendliness etc. as mind-clarifiers; Gītā defines yoga itself
  as evenness in action’s results.


  **Zhuangzi, “Fasting of the Mind”:** Both prize a non-stuck responsiveness.

  *Divergence:* Zhuangzi empties toward spontaneous Dao; the Gītā evenness serves
  dharma-performance.'
voice_of_siva: ''
abhyasa: 'On one task, pre-commit: “Success and failure are equal for my clinging.”
  Check your body at the end for evenness, not for the score.'
