sutra_id: BG_06_29
collection: Bhagavad Gita
section: chapter_06
title: Self in All Beings, All Beings in Self
sanskrit: 'सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि।


  ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः'
transliteration: 'sarvabhūtasthamātmānaṃ sarvabhūtāni cātmani|


  īkṣate yogayuktātmā sarvatra samadarśanaḥ'
translation: The yoga-yoked self sees the Self standing in all beings and all beings
  in the Self — same-seeing everywhere.
commentary: 'Vision becomes double and reciprocal: ātman in all bhūtas, all bhūtas
  in ātman, with sarvatra samadarśana. The contested claim is that yoga-yoking produces
  a seeing, not only a private calm. In Upaniṣadic-Gītā non-dual ethics, this is the
  perceptual basis of compassion without condescension. Existentially, test your practice
  in the street. If calm collapses into ranking beings, yoking has not yet opened
  seeing. Same-seeing everywhere is the fruit that proves the sit. Yoga-yoking must
  produce seeing: Self in beings, beings in Self, same-seeing everywhere. Private
  calm that fails in the street is incomplete. This reciprocal vision is the perceptual
  basis of compassion without condescension. Test practice among bodies that trigger
  ranking. If samadarśana collapses, return to yoking until vision holds. The contested
  force of the passage remains practical: it asks for a change in how you inhabit
  action, attention, and relation — not for ornamental agreement. Return to the line
  until the claim bites a live decision today.


  Key Terms:


  **sarvabhūtastha (सर्वभूतस्थ)** — standing in all beings -> Self’s omnipresence
  as seen -> vision-claim, not slogan


  **samadarśana (समदर्शन)** — same-seeing -> equality of vision everywhere -> ethical
  phenomenology of yoga


  Cross-Tradition Resonances:


  **Īśā Upaniṣad 6–7:** Structural homology in seeing all in the Self and Self in
  all.

  *Divergence:* Īśā’s compact mantra differs in tone; Gītā ties the vision explicitly
  to yogayuktātman practice.


  **Franciscan / creation-seeing traditions:** Structural homology in finding the
  sacred across creatures.

  *Divergence:* Franciscan seeing is christocentric praise; here reciprocal Self-beings
  vision is yogic-samadarśana.'
voice_of_siva: ''
abhyasa: After sitting, walk among people and silently see Self-in-them and them-in-Self
  once each, without preaching the vision.
