sutra_id: BG_08_05
collection: Bhagavad Gita
section: chapter_08
title: Remembering at the End Is Destiny
sanskrit: 'अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम्।


  यः प्रयाति स मद्भावं याति नास्त्यत्र संशयः'
transliteration: 'antakāle ca māmeva smaranmuktvā kalevaram|


  yaḥ prayāti sa madbhāvaṃ yāti nāstyatra saṃśayaḥ'
translation: At the end-time [anta-kāla], whoever departs, leaving the body while
  remembering Me alone, goes to My being [mad-bhāva]; of this there is no doubt.
commentary: 'Death is not a blank interruption after which theology resumes; the content
  of remembrance at departure is destiny. The contested claim is brutally simple:
  who you remember when the body is released determines where you go — and for remembrance
  of Kṛṣṇa alone, the destination is mad-bhāva, His own state. "No doubt" is pastoral
  steel, not casual reassurance. Existentially this revalues ordinary memory-training:
  remembrance is not sentimental nostalgia but the skill that must be available when
  control thins. The verse does not say "whoever was once religious." It says remembering
  Me alone while leaving the body. Last-minute magic without prior joining is not
  the chapter''s later teaching; this verse states the principle whose practice the
  next verses will demand in all times, not only the end. Fear of death often fixates
  on logistics; this verse fixates on the object of mind. The line-level force of
  the teaching is practical, not ornamental: what it claims about reality is meant
  to reshape how you attend, choose, and depart. If the claim does not alter rehearsal
  in ordinary time, it will not hold when time thins. Existential uptake is therefore
  part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **anta-kāla (अन्तकाल)** — end-time/death-hour -> the decisive moment of departure
  -> "death" alone misses the temporal edge-character of kāla.


  **mad-bhāva (मद्भाव)** — My being/state -> destination of those who remember Kṛṣṇa
  alone -> "my nature" as temperament understates ontological arrival.


  **smaran (स्मरन्)** — remembering -> active recollection at departure -> "thinking
  of" is too weak for destiny-bearing remembrance.


  Cross-Tradition Resonances:


  **Tibetan bar do teaching (recognition at death):** Both insist last cognition shapes
  transit.

  *Divergence:* Bardo maps intermediate states; Gītā names destination as the Lord''s
  own bhāva via remembrance.


  **Christian ars moriendi:** Both train dying as spiritually decisive.

  *Divergence:* Ars moriendi centers confession and Christ; Gītā centers exclusive
  remembrance of Kṛṣṇa.'
