sutra_id: BG_10_09_11
collection: Bhagavad Gita
section: chapter_10
title: Conversation as Joy — Lamp of Knowledge Given
sanskrit: 'मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम्।


  कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च


  तेषां सततयुक्तानां भजतां प्रीतिपूर्वकम्।


  ददामि बुद्धियोगं तं येन मामुपयान्ति ते


  तेषामेवानुकम्पार्थमहमज्ञानजं तमः।


  नाशयाम्यात्मभावस्थो ज्ञानदीपेन भास्वता'
transliteration: 'maccittā madgataprāṇā bodhayantaḥ parasparam|


  kathayantaśca māṃ nityaṃ tuṣyanti ca ramanti ca


  teṣāṃ satatayuktānāṃ bhajatāṃ prītipūrvakam|


  dadāmi buddhiyogaṃ taṃ yena māmupayānti te


  teṣāmevānukampārthamahamajñānajaṃ tamaḥ|


  nāśayāmyātmabhāvastho jñānadīpena bhāsvatā'
translation: With minds on Me, life-breaths gone to Me, enlightening one another and
  speaking of Me always, they are content and they delight. To those constantly joined
  who worship with love, I give that yoga of discernment by which they come to Me.
  Out of compassion for them, I — standing in their own being — destroy darkness born
  of ignorance with the luminous lamp of knowledge.
commentary: 'Devotional community is pictured as mutual awakening and constant kathā,
  yielding tuṣṭi and rati. Then grace: to the loving, ever-joined, Kṛṣṇa gives buddhi-yoga
  that reaches Him; and from anukampā He destroys ajñāna-darkness with jñāna-dīpa
  while abiding in their ātma-bhāva. The contested claim is that intellectual light
  is given compassionately inside relational practice, not earned as solitary trophy.
  Existentially this dignifies spiritual conversation as real yoga, and refuses both
  anti-intellectual devotion and loveless cleverness. The lamp is gift; the darkness
  is ignorance-born; the place of standing is the devotee''s own being. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live
  one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.


  Key Terms:


  **buddhi-yoga (बुद्धियोग)** — yoga of discernment -> gift by which devotees reach
  Me -> "smart practice" misses grace-given buddhi

  **jñāna-dīpa (ज्ञानदीप)** — lamp of knowledge -> instrument destroying ignorance-darkness
  -> "education" secularizes compassionate illumination


  Cross-Tradition Resonances:


  **[Sufi sohbet / companionship in remembrance]:** Shared mutual reminding as path.

  *Divergence:* Sufi tariqa frame differs; Gītā names buddhi-yoga and jñāna-dīpa as
  the Lord''s gifts.

  **[Platonic dialectic as shared ascent]:** Shared enlightening one another.

  *Divergence:* Plato''s Forms differ; Gītā centers kathā of Kṛṣṇa and compassionate
  lamp-giving.'
