sutra_id: BG_06_45_47
collection: Bhagavad Gita
section: chapter_06
title: Across Births to the Highest; Best Is the Devoted Yogin
sanskrit: 'प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः।


  अनेकजन्मसंसिद्धस्ततो याति परां गतिम्


  तपस्विभ्योऽधिको योगी ज्ञानिभ्योऽपि मतोऽधिकः।


  कर्मिभ्यश्चाधिको योगी तस्माद्योगी भवार्जुन


  योगिनामपि सर्वेषां मद्गतेनान्तरात्मना।


  श्रद्धावान्भजते यो मां स मे युक्ततमो मतः'
transliteration: 'prayatnādyatamānastu yogī saṃśuddhakilbiṣaḥ|


  anekajanmasaṃsiddhastato yāti parāṃ gatim


  tapasvibhyo''dhiko yogī jñānibhyo''pi mato''dhikaḥ|


  karmibhyaścādhiko yogī tasmādyogī bhavārjuna


  yogināmapi sarveṣāṃ madgatenāntarātmanā|


  śraddhāvānbhajate yo māṃ sa me yuktatamo mataḥ'
translation: But the yogin striving with effort, thoroughly cleansed of evil, perfected
  through many births, then goes to the highest goal. The yogin is higher than the
  ascetics, and thought higher even than the knowers; higher than the ritual-actors
  too is the yogin — therefore be a yogin, Arjuna. And of all yogins, the one who
  worships me with faith, with the inner self gone to me — that one is thought by
  me the most integrated.
commentary: 'The chapter’s encouragement climaxes in long horizon: prayatna-striving,
  cleansed kilbiṣa, aneka-janma-saṃsiddhi, then parā gati. Ranking follows — yogin
  above tapasvin, jñānin, and karmin — hence the imperative: yogī bhava. Then the
  innermost rank: among yogins, yuktatama is the śraddhāvant who bhajati Krishna with
  antarātman gone to him (madgata). The contested hierarchy refuses both anti-yoga
  intellectualism and yoga without devotion. Existentially, take the long view of
  many births without postponing today’s effort, and let integration culminate as
  devoted inwardness, not as technique pride. The most yoked is the one whose inner
  self has gone to the Lord in faith-filled worship. Many-birth perfection joins today’s
  effortful cleansing: long horizon without postponement. Ranking the yogin above
  ascetic, knower, and ritual-actor culminates in the imperative to be a yogin — then
  ranks again among yogins by faithful worship with inner self gone to the Lord. Technique
  pride loses; devoted inwardness wins the title yuktatama. Take the long view and
  today’s yoking together. Integration’s summit is madgata faith, not display of limbs.


  Key Terms:


  **anekajanmasaṃsiddha (अनेकजन्मसंसिद्ध)** — perfected through many births -> long-horizon
  completion -> comfort and demand together


  **yuktatama (युक्ततम)** — most integrated/yoked -> ranked by madgata antarātman
  devotion -> theistic summit of yoga chapter


  **madgata (मद्गत)** — gone to me -> inner self’s destination in the Lord -> marks
  devotion as yoga’s highest integration


  Cross-Tradition Resonances:


  **Bhakti climax pattern (Gītā 9, 12, 18):** Structural homology in knowledge/yoga
  consummated as devoted refuge.

  *Divergence:* Later chapters expand; here chapter 6 already seals dhyāna with yuktatama
  as faithful worshiper.


  **Augustine’s “our heart is restless until it rests in you”:** Structural homology
  in technique and striving finding rest in personal divine destination.

  *Divergence:* Augustinian rest is trinitarian grace; Gītā yuktatama is madgata antarātman
  with śraddhā-bhajana among yogins.'
voice_of_siva: ''
abhyasa: 'End practice by becoming a yogin twice: once as effortful yoking cleaned
  of one small evil, and once as faithful worship with the inner self offered to the
  Lord — without ranking yourself against others.


