sutra_id: BG_04_09_11
collection: Bhagavad Gita
section: chapter_04
title: Knowing the Divine Birth Liberates
sanskrit: 'जन्म कर्म च मे दिव्यमेवं यो वेत्ति तत्त्वतः।


  त्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन


  वीतरागभयक्रोधा मन्मया मामुपाश्रिताः।


  बहवो ज्ञानतपसा पूता मद्भावमागताः


  ये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम्।


  मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः'
transliteration: 'janma karma ca me divyamevaṃ yo vetti tattvataḥ|


  tyaktvā dehaṃ punarjanma naiti māmeti so''rjuna


  vītarāgabhayakrodhā manmayā māmupāśritāḥ|


  bahavo jñānatapasā pūtā madbhāvamāgatāḥ


  ye yathā māṃ prapadyante tāṃstathaiva bhajāmyaham|


  mama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ'
translation: Who knows in truth my birth and action as divine does not, on leaving
  the body, go to rebirth, but comes to me, Arjuna. Freed from passion, fear, and
  anger, made of me, taking refuge in me, many — purified by the austerity of knowledge
  — have come to my being [madbhāva]. As they take refuge in me, so exactly do I accept
  them; humans follow my path on every side, Pārtha.
commentary: 'Liberating knowledge is not abstract monism alone; it is tattva-knowing
  of the Lord’s birth and action as divine. The contested soteriology links metaphysics
  to affect: those who reach madbhāva are already stripped of rāga, fear, and anger,
  purified by jñāna-tapas. Then comes the famous reciprocity — ye yathā māṃ prapadyante
  — the Lord meets approaches in their own mode, while still claiming that all human
  paths are somehow following his path. This is neither relativism nor narrow gatekeeping;
  it is responsive theism under a single source. Existentially, how you approach shapes
  how you are met — yet approach itself is already within the Lord’s field. Purification
  of passion-fear-anger is not optional mood work; it is the austerity that makes
  knowledge saving. Madbhāva is arrival into the Lord’s mode of being, not a tourist
  heaven. The approach-response reciprocity (yathā…tathā) honors plural human entry
  points while still claiming that all paths are somehow within the Lord’s field.
  Passion, fear, and anger must be stripped because they falsify approach itself —
  turning refuge into bargain, threat, or appetite. Knowledge-austerity purifies so
  that reciprocity is not corrupted by the approaching ego. Liberation here is recognition
  and likeness, not mere information about divinity.


  Key Terms:


  **divya (दिव्य)** — divine -> quality of the Lord’s birth and karma when known truly
  -> ordinary biography misreads avatāra


  **madbhāva (मद्भाव)** — my being/state -> arrival into the Lord’s mode of being
  -> stronger than “going to heaven”


  **prapadyante / bhajāmi (प्रपद्यन्ते / भजामि)** — they take refuge / I accept-share
  -> reciprocal approach and response -> the grammar of responsive theism


  Cross-Tradition Resonances:


  **John 14:6 / inclusive-exclusive tensions:** Structural homology in a single source
  claiming all approach-routes while remaining personal center.

  *Divergence:* Christian exclusivism is christological in a once-for-all incarnation;
  Krishna’s reciprocity is explicitly mode-matching across many approaches.


  **Bhagavata / bhakti theology of grace:** Structural homology in purification and
  refuge culminating in divine being.

  *Divergence:* Later bhakti often intensifies emotional surrender; here jñāna-tapas
  is named as purifying austerity alongside refuge.'
voice_of_siva: ''
abhyasa: Examine your current approach to the sacred (petition, study, service, silence);
  purify one of rāga, fear, or anger within it, and take one step of refuge without
  bargaining for a preferred response style.
