sutra_id: BG_02_64_66
collection: Bhagavad Gita
section: chapter_02
title: Moving Among Objects without Attraction and Aversion, Self-Governed, One Finds
  Clarity
sanskrit: 'रागद्वेषवियुक्तैस्तु विषयानिन्द्रियैश्चरन्।


  आत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति


  प्रसादे सर्वदुःखानां हानिरस्योपजायते।


  प्रसन्नचेतसो ह्याशु बुद्धिः पर्यवतिष्ठते


  नास्ति बुद्धिरयुक्तस्य न चायुक्तस्य भावना।


  न चाभावयतः शान्तिरशान्तस्य कुतः सुखम्'
transliteration: 'rāgadveṣaviyuktaistu viṣayānindriyaiścaran|


  ātmavaśyairvidheyātmā prasādamadhigacchati


  prasāde sarvaduḥkhānāṃ hānirasyopajāyate|


  prasannacetaso hyāśu buddhiḥ paryavatiṣṭhate


  nāsti buddhirayuktasya na cāyuktasya bhāvanā|


  na cābhāvayataḥ śāntiraśāntasya kutaḥ sukham'
translation: “But moving among objects with senses separated from attraction and aversion,
  self-controlled, the governed self attains clarity. In clarity, the loss of all
  his sorrows arises; for the clear-hearted, understanding quickly becomes fully established.
  There is no understanding for the unyoked, nor becoming for the unyoked; for one
  without becoming, no peace; for the peaceless, whence happiness?”
commentary: 'The path is not flight from objects but movement among them with senses
  freed from *rāga-dveṣa*. Then *prasāda* — clarity/graceful lucidity — arises, and
  with it the waning of sorrows and the quick establishment of *buddhi*. The negative
  cascade seals it: unyoked → no buddhi → no *bhāvanā* → no śānti → no sukha. The
  contested claim is that happiness is structurally impossible without yoking; it
  is not a mood you can chase downstream. Existentially, stop hunting sukha while
  refusing the upstream work of non-reactive sensing.


  Happiness cannot be hunted downstream of non-yoking. Move among objects without
  rāga-dveṣa until prasāda comes; then buddhi establishes and sorrow thins. Upstream
  work first.


  The unyoked chase sukha and manufacture peacelessness. Reverse the order: yoke,
  gain prasāda, let buddhi establish, watch sorrow thin. Happiness arrives as side-effect
  of order. Order the causes correctly or happiness remains a mirage downstream of
  peacelessness.


  Reverse the happiness hunt: yoke first, let clarity come, allow joy as side-effect
  of order.


  Key Terms:


  **prasāda (प्रसाद)** — clarity/lucidity/gracious clearness → settled clear mind-state
  → “grace” and “clarity” both resonate; here mental lucidity is primary.


  **ayukta (अयुक्त)** — unyoked → one not joined in yoga → “undisciplined” is moralizing;
  the issue is non-yoking.


  **bhāvanā (भावना)** — becoming/cultivation/meditative bringing-into-being → without
  which peace fails → “imagination” is misleading here.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.33 / 1.47–1.48:** Both link clarified mind to stable right
  knowing.

  *Divergence:* YS details samādhi grades; Gītā emphasizes movement-among-objects
  without rāga-dveṣa.


  **Dao De Jing 16:** Both connect returning to clarity with capacity for right action/peace.

  *Divergence:* Laozi stresses stillness and return to the root; Gītā stresses yoked
  sensing in the midst of objects.'
