sutra_id: BG_17_03
collection: Bhagavad Gita
section: chapter_17
title: A Person Is Made of Faith
sanskrit: सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत।श्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः
  स एव सः
transliteration: sattvānurūpā sarvasya śraddhā bhavati bhārata|śraddhāmayo'yaṃ puruṣo
  yo yacchraddhaḥ sa eva saḥ
translation: The faith of each is in accordance with their essence, O Bhārata. A person
  is made of faith; whatever one’s faith is, that one verily is.
commentary: 'This is among the Gītā’s most compressed anthropologies: śraddhāmayo’yaṃ
  puruṣaḥ—this person is made of faith. Yo yacchraddhaḥ sa eva saḥ—as is one’s faith,
  so is one. The contested claim collapses the gap between “having beliefs” and “being.”
  You do not merely hold śraddhā; you are shaped as it. Existentially, this makes
  faith-diagnosis identity-diagnosis without freezing people into types. If you want
  to know who you are becoming, inspect what you entrust yourself to when pressed.
  The verse also explains conversion’s depth: changing faith is changing the person.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics.


  Key Terms:


  **sattva (सत्त्व)** — here as essence/being -> faith according to one’s sattva ->
  ''mood'' is far too thin.

  **śraddhāmaya (श्रद्धामय)** — made of faith -> person as faith-constituted -> ''faithful
  type'' misses constitution.

  **sa eva saḥ (स एव सः)** — that one verily is -> identity with one’s faith -> ''you
  are what you believe'' is a rough cousin.


  Cross-Tradition Resonances:


  **[Proverbs / ''as a man thinketh'' traditions]:** Inner trust shaping the person
  resonates.

  *Divergence:* Biblical lines vary; here faith is explicitly guṇa-correlated.

  **[Buddhism on saddhā]:** Faith as a faculty shaping the path resonates.

  *Divergence:* Buddhist saddhā is clarified by wisdom; Krishna analyzes śraddhā by
  guṇas.

  **[Tillich’s ''ultimate concern'']:** Being shaped by what one ultimately trusts
  is homologous.

  *Divergence:* Tillich’s ontology of concern differs; the Gītā keeps guṇa typology
  concrete.'
