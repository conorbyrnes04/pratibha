sutra_id: BG_18_46
collection: Bhagavad Gita
section: chapter_18
title: Worship the Source Through Your Own Action
sanskrit: यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम्।स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति
  मानवः
transliteration: yataḥ pravṛttirbhūtānāṃ yena sarvamidaṃ tatam|svakarmaṇā tamabhyarcya
  siddhiṃ vindati mānavaḥ
translation: A human being finds success by worshipping through his own action That
  from which the activity of beings arises and by which all this is pervaded.
commentary: 'The theological hinge of svadharma: siddhi comes by abhyarcya—worshipping—through
  svakarma the One from whom beings’ pravṛtti arises and by whom all is tatam, pervaded.
  The contested elevation makes ordinary work liturgy. Not escape from work to worship,
  but work as worship of the source-pervader. Existentially, this ruins the split
  between “spiritual life” and “real work.” The question becomes: is my action oriented
  as service of the source, or as self-empire? In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be
  read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics.


  Key Terms:


  **svakarmaṇā (स्वकर्मणा)** — by one’s own action -> instrument of worship -> ''job''
  understates.

  **abhyarcya (अभ्यर्च्य)** — having worshipped -> work as arcana -> ''gratitude mindset''
  is thinner.

  **pravṛttiḥ bhūtānām (प्रवृत्तिर्भूतानाम्)** — activity/arising of beings -> source-reference
  -> ''evolution'' secularizes.

  **tatam (ततम्)** — pervaded/spread -> all this as Lord’s pervasion -> ''interconnected''
  without theism is partial.


  Cross-Tradition Resonances:


  **[Gītā 9.27]:** Whatever you do, offer to Me—continuity.

  *Divergence:* 18.46 specifies worship of the source-pervader through own action
  as siddhi’s means.

  **[Brother Lawrence, practice of the presence]:** Ordinary work as worship resonates
  strongly.

  *Divergence:* Christian presence is Christic; here the pervading source is the Gītā’s
  Lord.

  **[Karma-yoga in modern Hindu reception]:** Work as worship is the popular homology.

  *Divergence:* Popular versions can become productivity gospel; the verse centers
  the source, not output.'
