sutra_id: BG_02_51_53
collection: Bhagavad Gita
section: chapter_02
title: The Wise Abandon Action-Born Fruit and Go to the Soundless Place
sanskrit: 'कर्मजं बुद्धियुक्ता हि फलं त्यक्त्वा मनीषिणः।


  जन्मबन्धविनिर्मुक्ताः पदं गच्छन्त्यनामयम्


  यदा ते मोहकलिलं बुद्धिर्व्यतितरिष्यति।


  तदा गन्तासि निर्वेदं श्रोतव्यस्य श्रुतस्य च


  श्रुतिविप्रतिपन्ना ते यदा स्थास्यति निश्चला।


  समाधावचला बुद्धिस्तदा योगमवाप्स्यसि'
transliteration: 'karmajaṃ buddhiyuktā hi phalaṃ tyaktvā manīṣiṇaḥ|


  janmabandhavinirmuktāḥ padaṃ gacchantyanāmayam


  yadā te mohakalilaṃ buddhirvyatitariṣyati|


  tadā gantāsi nirvedaṃ śrotavyasya śrutasya ca


  śrutivipratipannā te yadā sthāsyati niścalā|


  samādhāvacalā buddhistadā yogamavāpsyasi'
translation: “For the wise, yoked to understanding, abandoning the fruit born of action,
  freed from birth-bondage, go to the untainted place. When your understanding crosses
  beyond the thicket of delusion, then you will reach dispassion toward what is to
  be heard and what has been heard. When your understanding, torn by conflicting revelations,
  stands unmoving, unshaken in samādhi — then you will attain yoga.”
commentary: 'Fruit-abandonment leads to the *anāmaya pada* — the unailing place —
  and release from birth-bond. Then a phenomenology of maturity: *buddhi* crosses
  *moha-kalila* (delusion’s thicket), and *nirveda* arises toward the whole economy
  of hearing. Finally, when revelation-conflicts (*śruti-vipratipanna*) no longer
  shake understanding, and it stands unmoving in samādhi, yoga is attained. The contested
  claim is that more sacred information is not the goal; unshakability amid informational
  conflict is. Existentially, spiritual maturity looks like fewer arguments with podcasts
  and more seated clarity.


  Crossing delusion’s thicket ends sacred FOMO. Conflicting revelations stop owning
  the mind when samādhi holds buddhi unmoving. Maturity prefers unshakability to another
  download of opinions.


  Indifference to heard and to-be-heard is not anti-learning; it is end of compulsive
  seeking. When śruti-conflicts cannot shake you, yoga has somewhere to stand. Unshakability
  amid conflicting hearings is rarer than clever synthesis. Aim for the rarer thing.


  Prefer one day of unshaken practice to another cycle of contested spiritual content.


  Key Terms:


  **moha-kalila (मोहकलिल)** — thicket/mire of delusion → dense confusion understanding
  must cross → “delusion” alone misses the tangled-obstacle image.


  **nirveda (निर्वेद)** — dispassion/indifference → cooling toward heard and to-be-heard
  → “world-weariness” can misread; here it is freedom from sacred FOMO.


  **śruti-vipratipanna (श्रुतिविप्रतिपन्न)** — conflicted by revelatory hearings →
  understanding pulled by opposing testimonies → “confused by scriptures” is close.


  Cross-Tradition Resonances:


  **Mundaka Upaniṣad 2.2.8–2.2.9:** Both describe knowledge that cuts ignorance and
  ends restless seeking.

  *Divergence:* Mundaka images the knot of the heart cut; Gītā images buddhi unmoving
  in samādhi amid śruti-conflict.


  **Dao De Jing 48:** Both associate advance with decrease of restless acquiring (here,
  of hearings).

  *Divergence:* Laozi decreases doing toward wuwei; the Gītā decreases hearing-thirst
  while keeping yoked action.'
