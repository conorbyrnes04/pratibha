sutra_id: BG_15_19_20
collection: Bhagavad Gita
section: chapter_15
title: Knowing Me as Puruṣottama Completes the Work
sanskrit: 'यो मामेवमसम्मूढो जानाति पुरुषोत्तमम्।स सर्वविद्भजति मां सर्वभावेन भारत

  इति गुह्यतमं शास्त्रमिदमुक्तं मयाऽनघ।एतद्बुद्ध्वा बुद्धिमान्स्यात्कृतकृत्यश्च भारत'
transliteration: 'yo māmevamasammūḍho jānāti puruṣottamam|sa sarvavidbhajati māṃ sarvabhāvena
  bhārata

  iti guhyatamaṃ śāstramidamuktaṃ mayā''nagha|etadbuddhvā buddhimānsyātkṛtakṛtyaśca
  bhārata'
translation: Whoever, undeluded, thus knows Me as the Person Supreme, knows all and
  worships Me with his whole being, O Bhārata. This most secret teaching has been
  declared by Me, O sinless one; knowing this, one becomes wise and has done what
  is to be done.
commentary: 'Undeluded knowing of Krishna as Puruṣottama yields sarva-vid—knowing
  all—and whole-being worship (sarva-bhāvena). The most secret śāstra ends in a completion
  formula: becoming buddhimān and kṛta-kṛtya, one who has done what needed doing.
  The contested claim is that metaphysical recognition and total devotion are one
  act, and that human incompleteness ends there—not in endless self-improvement. Existentially,
  ''knowing all'' is not trivia mastery; it is knowing the One who ranks above perishable
  and imperishable, and letting that knowledge become worship with every bhāva. The
  secret is not information; it is undeluded recognition that finishes the task. In
  the Gītā’s pedagogy, concept without existential cut becomes another ornament of
  bondage; therefore the verse must be read as a demand on perception, desire, and
  refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **asammūḍha (असम्मूढ)** — undeluded -> clarity required for Puruṣottama-knowing
  -> ''smart'' is irrelevant.

  **sarva-vid (सर्वविद्)** — all-knower -> fruit of knowing Puruṣottama -> ''omniscient''
  can sound mythic-inflated.

  **sarva-bhāvena (सर्वभावेन)** — with one’s whole being/mode -> total worship ->
  ''enthusiastically'' is too thin.

  **kṛta-kṛtya (कृतकृत्य)** — one who has done what is to be done -> completion of
  human task -> ''successful'' is worldly counterfeit.

  **guhyatama śāstra (गुह्यतम शास्त्र)** — most secret teaching -> climax disclosure
  -> ''esoteric doctrine'' can become clubbish.


  Cross-Tradition Resonances:


  **[Gītā 18.50–55 / 18.65–66]:** Completion and whole-being devotion foreshadow the
  finale.

  *Divergence:* Chapter 15’s secret is Puruṣottama; chapter 18’s is refuge beyond
  all dharmas.

  **[Muṇḍaka’s para vidyā]:** Highest knowledge completing the aim of life resonates.

  *Divergence:* Muṇḍaka aims at Brahman; here completion is knowing and worshipping
  Puruṣottama.

  **[Ignatius, ''take, Lord, receive'']:** Whole-being offering parallels sarva-bhāva
  worship.

  *Divergence:* Ignatian offering is Christic-mission; here the hinge is undeluded
  Puruṣottama recognition.'
