sutra_id: BG_07_26_28
collection: Bhagavad Gita
section: chapter_07
title: Desire-Aversion Fog and Firm Vow
sanskrit: 'वेदाहं समतीतानि वर्तमानानि चार्जुन।


  भविष्याणि च भूतानि मां तु वेद न कश्चन


  इच्छाद्वेषसमुत्थेन द्वन्द्वमोहेन भारत।


  सर्वभूतानि संमोहं सर्गे यान्ति परन्तप


  येषां त्वन्तगतं पापं जनानां पुण्यकर्मणाम्।


  ते द्वन्द्वमोहनिर्मुक्ता भजन्ते मां दृढव्रताः'
transliteration: 'vedāhaṃ samatītāni vartamānāni cārjuna|


  bhaviṣyāṇi ca bhūtāni māṃ tu veda na kaścana


  icchādveṣasamutthena dvandvamohena bhārata|


  sarvabhūtāni saṃmohaṃ sarge yānti parantapa


  yeṣāṃ tvantagataṃ pāpaṃ janānāṃ puṇyakarmaṇām|


  te dvandvamohanirmuktā bhajante māṃ dṛḍhavratāḥ'
translation: I know beings past, present, and future, O Arjuna; but no one knows Me.
  Through the delusion of dualities [*dvandva-moha*] born of desire and aversion [*icchā-dveṣa*],
  O Bhārata, all beings go to confusion at their arising, O Scorcher of Foes. But
  those whose evil has ended, people of meritorious action, freed from duality-delusion,
  worship Me with firm vows [*dṛḍha-vrata*].
commentary: 'Epistemic asymmetry is absolute: the Lord knows the temporal field of
  beings; beings, birth-deluded by liking and disliking, do not know Him. The contested
  anthropology locates primordial confusion not in lack of data but in *dvandva-moha*
  — hypnosis by pairs (gain/loss, praise/blame, pleasure/pain) sprung from *icchā*
  and *dveṣa*. Liberation of worship is therefore ethical-ascetical before it is speculative:
  evil ending, merit accumulating, duality-delusion releasing, vow firming. Existentially
  this explains why "I want to know God" stalls — wanting and not-wanting are still
  running the show. Firm vow is not stubborn dogma; it is practice that no longer
  renegotiates orientation every time a pair of opposites flares. "No one knows Me"
  is not skepticism about revelation; it is anthropology under dvandva. Omniscience
  on the Lord''s side and birth-delusion on the creature''s side set the stakes for
  vow. Firmness is possible when pāpa has been worked through enough that pairs no
  longer renegotiate the center every hour. This makes ethics preparatory for knowing:
  not moralism as ticket-purchase, but the clearing of reactive fog so bhajana can
  stabilize.


  Key Terms:


  **dvandva-moha (द्वन्द्वमोह)** — delusion of the dualities -> birth-deep confusion
  via paired opposites -> "confusion" alone misses the structured role of binary reactivity.


  **dṛḍha-vrata (दृढव्रत)** — firm vow/observance -> mark of those freed enough to
  worship steadily -> "willpower" psychologizes what the text ties to exhausted *pāpa*
  and *puṇya*-action.


  Cross-Tradition Resonances:


  **Buddha''s Second Noble Truth (taṇhā as origin of suffering):** Both root bondage
  in craving/aversion dynamics.

  *Divergence:* Buddhism aims at cessation of thirst; Gītā aims at firm-vowed *bhajana*
  of the Lord who knows all times.


  **Epictetus on what is up to us vs not:** Both diagnose suffering in reactive pairing
  with externals.

  *Divergence:* Stoic therapy centers *prohairesis*; Gītā centers release into worship
  under divine omniscience.'
voice_of_siva: ''
abhyasa: Catch one desire-aversion pair today (like/dislike). Do not suppress it;
  label it "*dvandva*" and take one vowed action you already know is right, regardless
  of the pair's pull.
