sutra_id: BG_06_01_03
collection: Bhagavad Gita
section: chapter_06
title: Renouncer Is Not the Fireless Idle
sanskrit: 'श्री भगवानुवाच


  अनाश्रितः कर्मफलं कार्यं कर्म करोति यः।


  स संन्यासी च योगी च न निरग्निर्न चाक्रियः


  यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव।


  न ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन


  आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते।


  योगारूढस्य तस्यैव शमः कारणमुच्यते'
transliteration: 'śrī bhagavānuvāca


  anāśritaḥ karmaphalaṃ kāryaṃ karma karoti yaḥ|


  sa saṃnyāsī ca yogī ca na niragnirna cākriyaḥ


  yaṃ saṃnyāsamiti prāhuryogaṃ taṃ viddhi pāṇḍava|


  na hyasaṃnyastasaṅkalpo yogī bhavati kaścana


  ārurukṣormuneryogaṃ karma kāraṇamucyate|


  yogārūḍhasya tasyaiva śamaḥ kāraṇamucyate'
translation: 'The Blessed Lord said: Who performs the action that must be done without
  depending on the fruit of action — that one is a renouncer and a yogin — not the
  fireless one, and not the inactive. What they call renunciation, know as yoga, Pāṇḍava;
  for no one becomes a yogin without having renounced intention [saṅkalpa]. For the
  sage wishing to climb to yoga, action is said to be the means; for that same one
  who has climbed to yoga, stillness [śama] is said to be the means.'
commentary: 'Chapter 6 opens by collapsing false images of holiness: neither niragni
  nor akrīya defines saṃnyāsa/yoga. The contested identity is positive — do kārya
  without āśraya on fruit — and then conceptual: saṃnyāsa is yoga because without
  renounced saṅkalpa no one is a yogin. Stage-theory follows: for the ārurukṣu, karma
  is the means; for the yogārūḍha, śama is the means. In pedagogical yoga this prevents
  beginners from aping the stillness of the ascended, and prevents the ascended from
  clinging to beginner activism as identity. Existentially, locate your stage honestly.
  If you still need climbing, act without fruit-dependence; if you have climbed, let
  stillness be means without contempt for those still acting. Costume without stage-fit
  is failure. Stage-fit saves practice from costume. Beginners aping stillness skip
  the karma that climbs; the ascended clinging to activism refuse the śama that is
  now their means. Saṅkalpa-renunciation is the common root that makes both stages
  yoga rather than career choices. Neither fireless inactivity nor fruit-dependent
  work earns the names renouncer and yogin. Locate your stage, then use the means
  that actually belong to it.


  Key Terms:


  **niragni (निरग्नि)** — without (sacrificial) fire -> false emblem of renunciation
  -> ritual absence mistaken for yoga


  **saṅkalpa (सङ्कल्प)** — formative intention/resolve -> what must be renounced to
  be a yogin -> deeper than quitting tasks


  **yogārūḍha (योगारूढ)** — one who has ascended to yoga -> stage where śama becomes
  the means -> marks a real transition of method


  Cross-Tradition Resonances:


  **John of the Cross on active vs passive nights:** Structural homology in different
  means proper to different stages of ascent.

  *Divergence:* Carmelite staging is christological-mystical; the Gītā stages karma
  then śama under saṅkalpa-renunciation.


  **Confucian graded learning vs quiet sitting debates:** Structural homology in refusing
  premature stillness as moral excellence.

  *Divergence:* Confucian framing is ritual-moral cultivation; here stillness is explicitly
  the means of the already yoga-ascended.'
voice_of_siva: ''
abhyasa: 'Decide whether you are climbing or ascended for today: if climbing, complete
  one necessary action without leaning on its fruit; if ascended, take one period
  of deliberate stillness without using it to judge actors.'
