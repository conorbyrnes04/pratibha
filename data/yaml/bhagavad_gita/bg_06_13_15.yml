sutra_id: BG_06_13_15
collection: Bhagavad Gita
section: chapter_06
title: Body Aligned, Mind on Me
sanskrit: 'समं कायशिरोग्रीवं धारयन्नचलं स्थिरः।


  संप्रेक्ष्य नासिकाग्रं स्वं दिशश्चानवलोकयन्


  प्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते स्थितः।


  मनः संयम्य मच्चित्तो युक्त आसीत मत्परः


  युञ्जन्नेवं सदाऽऽत्मानं योगी नियतमानसः।


  शान्तिं निर्वाणपरमां मत्संस्थामधिगच्छति'
transliteration: 'samaṃ kāyaśirogrīvaṃ dhārayannacalaṃ sthiraḥ|


  saṃprekṣya nāsikāgraṃ svaṃ diśaścānavalokayan


  praśāntātmā vigatabhīrbrahmacārivrate sthitaḥ|


  manaḥ saṃyamya maccitto yukta āsīta matparaḥ


  yuñjannevaṃ sadā''''tmānaṃ yogī niyatamānasaḥ|


  śāntiṃ nirvāṇaparamāṃ matsaṃsthāmadhigacchati'
translation: Holding body, head, and neck even, unmoving and firm, gazing at the tip
  of one’s own nose, not looking about in the directions — peaceful in self, fear
  gone, established in the brahmacarya vow, restraining the mind, with thought on
  me, integrated, let one sit having me as supreme. Yoking the self always in this
  way, the yogin of controlled mind reaches the peace that is supreme nirvāṇa, abiding
  in me.
commentary: 'Posture precision joins theistic devotion: aligned kāya-śiras-grīvā,
  nose-tip gaze, no looking around; then praśānta, fearless, brahmacarya-vrata, mind
  restrained, mac-citta, mat-para. The contested synthesis is that dhyāna’s body mechanics
  culminate in mat-saṃsthā peace — nirvāṇa-paramā as abiding in Krishna. Technique
  without devotion is incomplete here; devotion without bodily steadiness is also
  incomplete. Existentially, let the spine teach the mind, and let the mind’s content
  be the Lord rather than self-monitoring vanity. Continual yoking yields peace that
  is not mood but establishment. Aligned body and nose-tip gaze are not ends; they
  serve mac-citta and mat-para sitting that ripens into peace as abiding in the Lord.
  Fearlessness and brahmacarya support the same theistic concentration. Technique
  without devotion and devotion without steadiness both fail this vignette. Let the
  spine teach, and let mind’s content be the Lord rather than self-surveillance. Continual
  yoking yields establishment, not a mood trophy. The contested force of the passage
  remains practical: it asks for a change in how you inhabit action, attention, and
  relation — not for ornamental agreement. Return to the line until the claim bites
  a live decision today.


  Key Terms:


  **maccitta (मच्चित्त)** — mind on me / thought formed of me -> theistic content
  of meditation -> specifies what ekāgratā is for


  **matsaṃsthā (मत्संस्था)** — abiding/establishment in me -> the locus of supreme
  nirvāṇa-peace -> personalist seal on meditative attainment


  **brahmacārivrata (ब्रह्मचारिव्रत)** — vow of brahmacarya -> disciplined sexual/energetic
  continence supporting sitting -> ethical base of dhyāna


  Cross-Tradition Resonances:


  **Hesychast posture and Name:** Structural homology in bodily alignment joined to
  personal divine focus.

  *Divergence:* Jesus Prayer theology differs from Krishna-matpara establishment;
  both refuse posture-without-presence.


  **Sufi murāqaba with beloved focus:** Structural homology in watchfulness ordered
  toward a personal Absolute.

  *Divergence:* Sufi love-idiom and silsila differ; Gītā specifies nose-gaze and brahmacarya-vrata
  in epic yoga idiom.'
voice_of_siva: ''
abhyasa: Sit aligned and still; rest gaze toward the nose tip without strain; when
  mind wanders, return it as “on You,” and end by sensing peace as abiding rather
  than as achievement.
