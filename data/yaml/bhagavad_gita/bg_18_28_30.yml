sutra_id: BG_18_28_30
collection: Bhagavad Gita
section: chapter_18
title: Tamasic Agent; Sattvic Intelligence and Firmness
sanskrit: 'अयुक्तः प्राकृतः स्तब्धः शठो नैष्कृतिकोऽलसः।विषादी दीर्घसूत्री च कर्ता
  तामस उच्यते

  बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रिविधं श्रृणु।प्रोच्यमानमशेषेण पृथक्त्वेन धनञ्जय

  प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये।बन्धं मोक्षं च या वेत्ति बुद्धिः सा
  पार्थ सात्त्विकी'
transliteration: 'ayuktaḥ prākṛtaḥ stabdhaḥ śaṭho naiṣkṛtiko''lasaḥ|viṣādī dīrghasūtrī
  ca kartā tāmasa ucyate

  buddherbhedaṃ dhṛteścaiva guṇatastrividhaṃ śrṛṇu|procyamānamaśeṣeṇa pṛthaktvena
  dhanañjaya

  pravṛttiṃ ca nivṛttiṃ ca kāryākārye bhayābhaye|bandhaṃ mokṣaṃ ca yā vetti buddhiḥ
  sā pārtha sāttvikī'
translation: The agent who is undisciplined, crude, stubborn, deceitful, malicious,
  lazy, despondent, and procrastinating is called tamasic. Hear the threefold distinction
  of intelligence and of firmness by the guṇas, O Dhanañjaya, declared completely
  and severally. The intelligence that knows engagement and withdrawal, what is to
  be done and not done, fear and fearlessness, bondage and liberation—that intelligence,
  O Pārtha, is sattvic.
commentary: 'Tamasic kartā is a cluster of dysfunction: ayukta, stubborn, crooked,
  lazy, viṣādī, dīrghasūtrī. Then buddhi and dhṛti become guṇa-threefold. Sattvic
  buddhi discerns pravṛtti/nivṛtti, kārya/akārya, bhaya/abhaya, bandha/mokṣa. The
  contested dignity of intellect is moral-soteriological discernment, not cleverness.
  Existentially, if your “smarts” cannot tell bondage from liberation, the Gītā will
  not call that buddhi sattvic—no matter your credentials. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum
  label on a doctrine. The existential stake is that this teaching must change how
  you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **dīrghasūtrī (दीर्घसूत्री)** — long-threaded / procrastinating -> tamasic agent
  mark -> ''process-oriented'' can be a mask.

  **buddhi (बुद्धि)** — intelligence/discernment -> guṇa-threefold -> ''IQ'' is a
  category error.

  **pravṛtti-nivṛtti (प्रवृत्ति-निवृत्ति)** — engagement-withdrawal -> sattvic buddhi’s
  first pair -> ''go/stop'' misses dharma discernment.

  **bandha-mokṣa (बन्ध-मोक्ष)** — bondage-liberation -> essential sattvic discernment
  -> ''stuck/free vibes'' is thinner.


  Cross-Tradition Resonances:


  **[Gītā 16.7]:** Āsuric not knowing pravṛtti/nivṛtti foreshadows sattvic buddhi’s
  excellence.

  *Divergence:* 18.30 makes that discernment the definition of sattvic intelligence.

  **[Aristotle’s phronēsis]:** Practical wisdom discerning what is to be done resonates.

  *Divergence:* Phronēsis aims at ethical flourishing; sattvic buddhi includes bondage/liberation
  explicitly.

  **[Ignatian discernment of spirits]:** Discriminating movements toward freedom vs
  bondage resonates.

  *Divergence:* Ignatian frame is Christic; here guṇas structure the buddhi types.'
