sutra_id: BG_18_16_18
collection: Bhagavad Gita
section: chapter_18
title: The Lone Agent Is a Bad View
sanskrit: 'तत्रैवं सति कर्तारमात्मानं केवलं तु यः।पश्यत्यकृतबुद्धित्वान्न स पश्यति
  दुर्मतिः

  यस्य नाहंकृतो भावो बुद्धिर्यस्य न लिप्यते।हत्वापि स इमाँल्लोकान्न हन्ति न निबध्यते

  ज्ञानं ज्ञेयं परिज्ञाता त्रिविधा कर्मचोदना।करणं कर्म कर्तेति त्रिविधः कर्मसंग्रहः'
transliteration: 'tatraivaṃ sati kartāramātmānaṃ kevalaṃ tu yaḥ|paśyatyakṛtabuddhitvānna
  sa paśyati durmatiḥ

  yasya nāhaṃkṛto bhāvo buddhiryasya na lipyate|hatvāpi sa imā~llokānna hanti na nibadhyate

  jñānaṃ jñeyaṃ parijñātā trividhā karmacodanā|karaṇaṃ karma karteti trividhaḥ karmasaṃgrahaḥ'
translation: This being so, the one who sees himself alone as the agent—because of
  untrained understanding—does not see; he is of wrong mind. The one whose sense of
  I-as-doer is gone, whose intellect is not stained—though he slay these people, he
  does not slay, and is not bound. Knowledge, the knowable, and the knower are the
  threefold goad of action; instrument, action, and agent are the threefold summary
  of action.
commentary: 'Given the five causes, claiming kevala kartā—sole agent—is akṛta-buddhi
  blindness. Then the radical ethics: without ahaṃkṛta bhāva and with unstained buddhi,
  even slaying does not bind as slaying. The contested scandal is the war-context
  non-binding claim. It is not a kill-permission for ego; it is the extreme statement
  of non-doership when I-making is gone. Existentially, do not borrow the verse as
  violence-license. Borrow it as surgery on the I-as-doer. The closing triad pairs
  (jñāna-jñeya-parijñātā; karaṇa-karma-kartā) prepare guṇa analysis of knowledge,
  action, and agent. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.


  Key Terms:


  **kevala kartā (केवल कर्ता)** — sole agent -> the false view -> ''personal responsibility''
  as total self-causation is the modern cousin.

  **ahaṃkṛto bhāva (अहंकृत भाव)** — I-making disposition -> what must be absent ->
  ''confidence'' is not the same.

  **na lipyate (न लिप्यते)** — is not stained -> buddhi unbound -> ''numb'' is the
  failure mode.

  **karmacodanā (कर्मचोदना)** — goad/incitement to action -> knowledge-knowable-knower
  triad -> ''motivation'' is thinner.


  Cross-Tradition Resonances:


  **[Gītā 2.19 / 5.8–9]:** Non-slaying / non-doership continues into this extreme
  formulation.

  *Divergence:* 18.17 requires vanished I-as-doer and unstained buddhi—conditions
  often ignored.

  **[Chuang Tzu’s butcher / skill without I]:** Action without ego-stain resonates.

  *Divergence:* Zhuangzi aims at spontaneous dao-skill; Krishna speaks inside dharma-war
  and bondage logic.

  **[Christian theologies of instrumentality]:** Being an instrument rather than sovereign
  agent resonates cautiously.

  *Divergence:* Instrumentality can become passivity; here the pentad still includes
  kartā among causes.'
voice_of_siva: ''
abhyasa: In one charged action today, watch for 'I alone am doing this.' Soften into
  the pentad. Do not use this to dodge care; use it to dodge inflation.
