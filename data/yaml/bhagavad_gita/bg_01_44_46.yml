sutra_id: BG_01_44_46
collection: Bhagavad Gita
section: chapter_01
title: Better to Die Unarmed Than Win by Destroying One’s Own
sanskrit: 'उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन।


  नरकेऽनियतं वासो भवतीत्यनुशुश्रुम


  अहो बत महत्पापं कर्तुं व्यवसिता वयम्।


  यद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः


  यदि मामप्रतीकारमशस्त्रं शस्त्रपाणयः।


  धार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत्'
transliteration: 'utsannakuladharmāṇāṃ manuṣyāṇāṃ janārdana|


  narake''niyataṃ vāso bhavatītyanuśuśruma


  aho bata mahatpāpaṃ kartuṃ vyavasitā vayam|


  yadrājyasukhalobhena hantuṃ svajanamudyatāḥ


  yadi māmapratīkāramaśastraṃ śastrapāṇayaḥ|


  dhārtarāṣṭrā raṇe hanyustanme kṣemataraṃ bhavet'
translation: “We have heard, Janārdana, that people whose family dharmas are destroyed
  dwell in hell without fixed term. Alas! We are resolved to do a great sin — ready
  to kill our own people out of greed for the pleasure of kingdom. If the sons of
  Dhṛtarāṣṭra, weapons in hand, should kill me in battle while I am unresisting and
  unarmed, that would be more wholesome for me.”
commentary: 'Arjuna chooses a comparative: *kṣematara* — more wholesome to die unarmed
  than to kill kin for royal pleasure. The contested move is valorizing non-retaliation
  as spiritual safety when the only available actions seem damning. Greed for *rājya-sukha*
  is confessed as the motive-toxin. This is the ethical high point of chapter 1 and
  also its limit: he can see sin in conquest, but not yet a form of action that is
  neither predatory nor self-erasing. The Gītā’s later karma-yoga answers this binary.
  Existentially, when all options feel corrupt, the temptation is pure refusal. Honor
  the discernment; notice also whether refusal has become the last identity protecting
  you from a harder, cleaner participation.


  Choosing to die unarmed rather than kill for royal pleasure is the ethical crescendo
  of the chapter — and its aporia. The binary of predation versus self-erasure is
  exactly what karma-yoga will refuse. Honor the crescendo; notice the missing third.


  Use the comparative carefully: if unarmed death seems healthier than predatory winning,
  your conscience is awake. Then ask what form of action could be healthier still
  — consecrated, non-possessive, and exact.


  Key Terms:


  **anuśuśruma (अनुशुश्रुम)** — we have heard along the tradition → authority from
  śruti-like hearing → “we heard” misses lineage transmission as moral warrant.


  **rājya-sukha-lobha (राज्यसुखलोभ)** — greed for the pleasure of kingship → motive
  exposed as appetitive, not just political → “ambition” is weaker than greed-for-enjoyment-of-rule.


  **kṣematara (क्षेमतर)** — more wholesome/safe/conducive to well-being → comparative
  flourishing claim for dying unarmed → “better” is flatter than the welfare nuance
  of *kṣema*.


  Cross-Tradition Resonances:


  **Gospel of Matthew 5:38–48:** Both entertain non-retaliation as spiritually safer
  than reciprocal violence.

  *Divergence:* Matthew grounds it in kingdom ethics and love of enemy; Arjuna grounds
  it in kinship-dharma and fear of hellish cascade — and will be taught back into
  action.


  **Epictetus, Discourses 1.18 / Enchiridion 42:** Both prefer integrity of the moral
  center over “winning” under corrupted motives.

  *Divergence:* Stoicism frames harm as judgment-error; Arjuna frames harm as *pāpa*
  with cosmic-social consequence.'
voice_of_siva: ''
abhyasa: If you are stuck between aggressive winning and total withdrawal, write a
  third option that protects relation without abandoning necessary action — even if
  you cannot yet take it.
