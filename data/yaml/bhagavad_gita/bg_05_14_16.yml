sutra_id: BG_05_14_16
collection: Bhagavad Gita
section: chapter_05
title: The Lord Creates Neither Doership nor Fruit-Link
sanskrit: 'न कर्तृत्वं न कर्माणि लोकस्य सृजति प्रभुः।


  न कर्मफलसंयोगं स्वभावस्तु प्रवर्तते


  नादत्ते कस्यचित्पापं न चैव सुकृतं विभुः।


  अज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः


  ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः।


  तेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम्'
transliteration: 'na kartṛtvaṃ na karmāṇi lokasya sṛjati prabhuḥ|


  na karmaphalasaṃyogaṃ svabhāvastu pravartate


  nādatte kasyacitpāpaṃ na caiva sukṛtaṃ vibhuḥ|


  ajñānenāvṛtaṃ jñānaṃ tena muhyanti jantavaḥ


  jñānena tu tadajñānaṃ yeṣāṃ nāśitamātmanaḥ|


  teṣāmādityavajjñānaṃ prakāśayati tatparam'
translation: The Lord does not create doership or actions for the world, nor the conjunction
  of action with fruit; rather, inherent nature operates. The all-pervading does not
  take up anyone’s evil or good deed; knowledge is covered by ignorance — by that,
  beings are deluded. But for those whose ignorance of the Self is destroyed by knowledge,
  knowledge lights up that highest like the sun.
commentary: 'A sharp theological correction: prabhu does not author kartṛtva, karmāṇi,
  or karma-phala-saṃyoga; svabhāva operates. Vibhu does not collect pāpa or sukṛta.
  Delusion comes from jñāna covered by ajñāna; when Self-ignorance is destroyed, knowledge
  sun-lights tat param. The contested claim protects divine non-partiality while assigning
  process to nature and bondage to ignorance. In Gītā theology this must be held together
  with earlier theistic activism — a tension productive of depth rather than a simple
  system. Existentially, stop recruiting God as accountant of your ledger and start
  destroying the covering that makes the ledger feel like ultimate reality. The sun
  does not negotiate with night; it reveals what night covered. If the Lord does not
  create doership, deeds, or fruit-linkage, then recruiting God as cashier of your
  ledger is already a covering-move of ignorance. Svabhāva operates; vibhu does not
  take up pāpa or sukṛta as inventory. Delusion is knowledge covered; liberation is
  ignorance of the Self destroyed until knowledge sun-lights the highest. Stop bargaining
  with a divine accountant and start destroying the cover. The sun’s work is revelation,
  not negotiation.


  Key Terms:


  **kartṛtva (कर्तृत्व)** — doership -> not created by the Lord for the world -> relocates
  authorship debates into svabhāva and ignorance


  **karmaphalasaṃyoga (कर्मफलसंयोग)** — link of action to fruit -> also not Lord’s
  creation -> challenges crude theistic merit machinery


  **svabhāva (स्वभाव)** — own-being/inherent nature -> what actually operates -> the
  process-field beneath moral theater


  Cross-Tradition Resonances:


  **Spinoza’s God without passions or judgments:** Structural homology in an Absolute
  not taking up human good/evil as a merchant.

  *Divergence:* Spinoza’s Deus sive Natura collapses into impersonal geometry; the
  Gītā still speaks of prabhu/vibhu within a teaching of grace and yoga.


  **Madhyamaka / emptiness of agent-action-fruit:** Structural homology in prying
  apart naive moral metaphysics.

  *Divergence:* Madhyamaka empties via dependent designation; here covering-ignorance
  and solar knowledge of the Self carry the soteriology.'
voice_of_siva: ''
abhyasa: When you catch yourself making God the cashier of a deed, return to seeing
  svabhāva operating and ask what ignorance is covering — then seek one clarifying
  insight rather than one cosmic receipt.
