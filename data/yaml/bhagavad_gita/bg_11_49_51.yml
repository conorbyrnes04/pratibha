sutra_id: BG_11_49_51
collection: Bhagavad Gita
section: chapter_11
title: Do Not Fear — Familiar Form Returns
sanskrit: 'मा ते व्यथा मा च विमूढभावो


  दृष्ट्वा रूपं घोरमीदृङ्ममेदम्।


  व्यपेतभीः प्रीतमनाः पुनस्त्वं


  तदेव मे रूपमिदं प्रपश्य


  सञ्जय उवाच


  इत्यर्जुनं वासुदेवस्तथोक्त्वा


  स्वकं रूपं दर्शयामास भूयः।


  आश्वासयामास च भीतमेनं


  भूत्वा पुनः सौम्यवपुर्महात्मा


  अर्जुन उवाच


  दृष्ट्वेदं मानुषं रूपं तवसौम्यं जनार्दन।


  इदानीमस्मि संवृत्तः सचेताः प्रकृतिं गतः'
transliteration: 'mā te vyathā mā ca vimūḍhabhāvo


  dṛṣṭvā rūpaṃ ghoramīdṛṅmamedam|


  vyapetabhīḥ prītamanāḥ punastvaṃ


  tadeva me rūpamidaṃ prapaśya


  sañjaya uvāca


  ityarjunaṃ vāsudevastathoktvā


  svakaṃ rūpaṃ darśayāmāsa bhūyaḥ|


  āśvāsayāmāsa ca bhītamenaṃ


  bhūtvā punaḥ saumyavapurmahātmā


  arjuna uvāca


  dṛṣṭvedaṃ mānuṣaṃ rūpaṃ tavasaumyaṃ janārdana|


  idānīmasmi saṃvṛttaḥ sacetāḥ prakṛtiṃ gataḥ'
translation: 'Do not tremble, do not be confused from seeing this fearsome form of
  Mine; free of fear, mind at peace, see again this very form of Mine. Sanjaya said:
  Having spoken thus, Vasudeva showed again His own form; the Great Self consoled
  the terrified, becoming again the gentle pleasant form. Arjuna said: Seeing this
  human form of Yours, gracious, O Janardana, I am now composed, mind restored.'
commentary: 'Fierce truth and gentle presence are one Self in modes; consolation is
  not denial. The contested move in this stretch of the vision is that do not tremble;
  see again this form; vasudeva shows gentle human form; arjuna composed again. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion
  after seeing. Do not aestheticize the theophany; let it revise what you think action,
  fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **saumya (सौम्य)** — passage key term -> Fierce truth and gentle presence are one
  Self in modes; consolation is not denial. -> default gloss flattens the vision''s
  force

  **mānuṣa (मानुष)** — paired key term -> Do not tremble; see again this form; Vasudeva
  shows gentle human form; Arjuna composed again. -> soft translation misses structural
  role


  Cross-Tradition Resonances:


  **[Jesus do not fear]:** Structural kinship around do not fear after glory.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[titration after overwhelm]:** Shared pressure of do not fear after glory.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person
  disclosure.'
