sutra_id: BG_02_14_15
collection: Bhagavad Gita
section: chapter_02
title: Sense Contacts Come and Go — Endure Them
sanskrit: 'मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः।


  आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत


  यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ।


  समदुःखसुखं धीरं सोऽमृतत्वाय कल्पते'
transliteration: 'mātrāsparśāstu kaunteya śītoṣṇasukhaduḥkhadāḥ|


  āgamāpāyino''nityāstāṃstitikṣasva bhārata


  yaṃ hi na vyathayantyete puruṣaṃ puruṣarṣabha|


  samaduḥkhasukhaṃ dhīraṃ so''mṛtatvāya kalpate'
translation: “Contacts of measure — sense and object — O son of Kuntī, give cold and
  heat, pleasure and pain. They come and go; they are impermanent. Endure them, Bhārata.
  The person whom these do not torment, best of men — the steadfast one for whom pain
  and pleasure are equal — that one is fit for deathlessness.”
commentary: 'Before denying death’s ultimacy further, Kṛṣṇa trains affect: *titikṣasva*
  — endure. Sense-object contacts (*mātrā-sparśa*) are framed as transient givers
  of paired opposites. The contested claim is that fitness for *amṛtatva* depends
  on not being tormented by these pairs — *sama-duḥkha-sukha*. Equanimity is not numbness;
  it is non-torment under inevitable contact. This is proto-yoga psychology inside
  Sāṅkhya dualities. Existentially, the verse relocates spiritual dignity from controlling
  outcomes to how you meet weather — outer and inner. Immortality begins as a way
  of being touched without being unseated.


  Endurance is not the opposite of sensitivity; it is sensitivity without torment.
  Fitness for deathlessness begins as weather-skill. The pairs will keep arriving;
  the question is whether they get to own your posture.


  Titikṣā is active hospitality to impermanence. You do not freeze sensation; you
  refuse to let sensation write your metaphysics. That refusal is already a rehearsal
  of amṛtatva.


  Let today’s sensory weather be curriculum for amṛtatva rather than a verdict that
  owns your posture.


  Key Terms:


  **mātrā-sparśa (मात्रास्पर्श)** — contact of sense-measures with objects → structured
  sensation events → “sense contacts” is right; “measure” hints at limited, quantifiable
  impacts.


  **titikṣā (तितिक्षा)** — endurance/forbearance → active capacity to bear without
  collapse → “tolerance” is too passive and modern.


  **amṛtatva (अमृतत्व)** — deathlessness / immortality → fitness for which depends
  on equanimity → “immortality” can sound mythic; here it is a capacity-status.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 2.1 / 2.32 (tapas and titikṣā-adjacent disciplines):** Both
  treat endurance of opposite sensations as formative for steadiness.

  *Divergence:* YS embeds endurance in eight-limbed method; here it is immediate battlefield
  counsel.


  **Marcus Aurelius, Meditations 4.39 / 8.28:** Both train the mind to meet pleasure-pain
  as transient contacts.

  *Divergence:* Marcus grounds in Stoic physics/providence; the Gītā aims toward *amṛtatva*
  and later karma-yoga.'
voice_of_siva: ''
abhyasa: At the next unpleasant sensation (heat, cold, annoyance), label it “coming-and-going
  contact” three times and refrain from the first reactive story for thirty seconds.
