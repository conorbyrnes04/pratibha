sutra_id: BG_10_36_38
collection: Bhagavad Gita
section: chapter_10
title: Chant, Season, Gamble, Victory, Sattva
sanskrit: 'द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम्।


  जयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम्


  वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनंजयः।


  मुनीनामप्यहं व्यासः कवीनामुशना कविः


  दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम्।


  मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम्'
transliteration: 'dyūtaṃ chalayatāmasmi tejastejasvināmaham|


  jayo''smi vyavasāyo''smi sattvaṃ sattvavatāmaham


  vṛṣṇīnāṃ vāsudevo''smi pāṇḍavānāṃ dhanaṃjayaḥ|


  munīnāmapyahaṃ vyāsaḥ kavīnāmuśanā kaviḥ


  daṇḍo damayatāmasmi nītirasmi jigīṣatām|


  maunaṃ caivāsmi guhyānāṃ jñānaṃ jñānavatāmaham'
translation: Among Sāman chants I am Bṛhat-Sāman; among meters, Gāyatrī; among months,
  Mārgaśīrṣa; among seasons, spring. I am the gambling of the cheats; the splendor
  of the splendid; I am victory, determination, the sattva of the sattvic. Among Vṛṣṇis
  I am Vāsudeva; among Pāṇḍavas, Dhanañjaya; among seers, Vyāsa; among bards, Uśanas.
  I am the rod of those who correct; the strategy of the victory-seeking; the silence
  of secrets; the knowledge of knowers.
commentary: 'The most contested line may be "I am the gambling of the cheats" — vibhūti
  reaches even crooked play as the force of chance-cunning, without moral endorsement
  of cheating. Beside it: spring, Gāyatrī, victory, sattva, Vāsudeva, Arjuna himself,
  Vyāsa, silence of the secret, knowledge of knowers. Existentially the list refuses
  a sanitized God who only appears in tidy piety. Discernment is required: presence-in-excellence
  is not permission-for-adharma. See the force; do not baptize the crime. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live
  one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.


  Key Terms:


  **sattva (सत्त्व)** — lucidity/goodness-quality -> the Lord as sattva of the sattvic
  -> "goodness" as niceness misses guṇa-technical sense

  **mauna (मौन)** — silence -> vibhūti of secrets -> "quietness" misses deliberate
  secret-keeping silence


  Cross-Tradition Resonances:


  **[Heraclitus on Zeus as day/night and war/peace]:** Shared divine implication in
  contrary domains.

  *Divergence:* Heraclitean logos differs; Gītā''s first-person list still demands
  dharma discernment.

  **[Augustine on God ordering even evil without authoring it as good]:** Shared difficulty
  of divine presence amid crookedness.

  *Divergence:* Privatio boni theory differs; Gītā''s vibhūti line is compressive
  and easy to abuse.'
