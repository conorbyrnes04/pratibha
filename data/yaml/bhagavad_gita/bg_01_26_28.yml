sutra_id: BG_01_26_28
collection: Bhagavad Gita
section: chapter_01
title: Compassion Floods the Warrior Who Sees His Own People
sanskrit: 'तत्रापश्यत्स्थितान्पार्थः पितृ़नथ पितामहान्।


  आचार्यान्मातुलान्भ्रातृ़न्पुत्रान्पौत्रान्सखींस्तथा


  श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि।


  तान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान्


  अर्जुन उवाच


  कृपया परयाऽऽविष्टो विषीदन्निदमब्रवीत्।


  दृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम्'
transliteration: 'tatrāpaśyatsthitānpārthaḥ pitṛ़natha pitāmahān|


  ācāryānmātulānbhrātṛ़nputrānpautrānsakhīṃstathā


  śvaśurānsuhṛdaścaiva senayorubhayorapi|


  tānsamīkṣya sa kaunteyaḥ sarvānbandhūnavasthitān


  arjuna uvāca


  kṛpayā parayā''''viṣṭo viṣīdannidamabravīt|


  dṛṣṭvemaṃ svajanaṃ kṛṣṇa yuyutsuṃ samupasthitam'
translation: 'There Pārtha saw standing fathers, then grandfathers, teachers, maternal
  uncles, brothers, sons, grandsons, and companions; fathers-in-law and dear friends
  as well, in both armies. Seeing all those kinsmen arrayed, the son of Kuntī, possessed
  by supreme compassion and sinking in despair, said: “Seeing this, my own people,
  Kṛṣṇa, present and eager to fight…”'
commentary: 'Roles dissolve into relations. The warrior’s trained categories — enemy,
  rank, target — fail when the field resolves into *svajana*, one’s own people. The
  contested move is that *kṛpā* (compassion) here is not yet the refined *karuṇā*
  of a bodhisattva ideal; it is overwhelming affective possession (*āviṣṭa*) that
  produces *viṣāda*, despondency. The Gītā does not mock this. It records it as the
  necessary breakdown of a competence that cannot hold kinship and killing in one
  gesture. In epic ethics, this is the birth of the question that yoga must answer.
  Existentially, the passage legitimizes the moment when professional clarity collapses
  before faces. If your ethic never risks such collapse, it may be ideology rather
  than moral intelligence.


  Compassion here is flood, not yet vow. The Gītā’s honesty about inundation protects
  the tradition from a spirituality that despises tears. Later restraint and equanimity
  will be taught without erasing this first truth: relation can unmake a warrior’s
  categories in a single gaze.


  Key Terms:


  **svajana (स्वजन)** — one’s own people → kinship field that disables enemy abstraction
  → “relatives” is thinner than the total belonging implied.


  **kṛpā (कृपा)** — compassion/pity → here an inundating force that unseats martial
  identity → “pity” can sound condescending; the Sanskrit is seizure by care.


  **viṣīdan (विषीदन्)** — sinking/despairing → despondency as bodily-moral collapse
  → “lamenting” misses the downward pull of *viṣāda*.


  Cross-Tradition Resonances:


  **Homer, Iliad XXIV (Priam and Achilles):** Both show warrior hardness cracking
  when the enemy becomes kin-bearing face.

  *Divergence:* Homer resolves in shared mortal grief; the Gītā opens a metaphysical-ethical
  teaching from the crack.


  **Śāntideva, Bodhicaryāvatāra 6–7:** Both treat the arising of care amid harm-intention
  as spiritually decisive.

  *Divergence:* Śāntideva trains compassion as method; Arjuna is flooded by it before
  training.'
voice_of_siva: ''
abhyasa: Take one person you have categorized as obstacle. Write five non-role facts
  about them as *svajana*-adjacent human, then notice what happens to your urge to
  “win.”
