sutra_id: BG_03_19
collection: Bhagavad Gita
section: chapter_03
title: Unattached, Do the Work That Must Be Done
sanskrit: 'तस्मादसक्तः सततं कार्यं कर्म समाचर।


  असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः'
transliteration: 'tasmādasaktaḥ satataṃ kāryaṃ karma samācara|


  asakto hyācarankarma paramāpnoti pūruṣaḥ'
translation: Therefore, without attachment, always perform the action that must be
  done [kāryaṃ karma]; for performing action without attachment, a person attains
  the highest [param].
commentary: '“Therefore” gathers the preceding cosmology into a rule of life: because
  the wheel binds those who appropriate, and because exemption belongs only to completed
  Self-content, the operable path is continual appointed action without attachment.
  The contested claim is soteriological: the highest is attained not by quitting kārya
  but by doing it asakta. Attachment is the toxin; action is the vehicle. In karma-yoga
  doctrine this is the classic inversion of common piety, which treats holiness as
  reduction of deeds. Existentially, the verse collapses the alibi of waiting for
  purity before acting. Purity is forged in unattached performance of what must be
  done. The highest is not postponed to a future inactivity; it is approached through
  today’s non-adhesive fidelity. “Always” (satatam) matters as much as “unattached.”
  The path is not a peak experience of detachment followed by relapse into possessive
  work; it is continuous appointed action under non-adhesion. This collapses the fantasy
  of waiting for a pure mood before obeying necessity. Attachment will still flare;
  the practice is to keep performing kārya while the flare is refused authorship.
  The highest is approached through that stubborn fidelity, not through collecting
  moments when you felt above the deed.


  Key Terms:


  **asaktaḥ (असक्तः)** — unattached -> the adverbial condition of liberating performance
  -> without this qualifier, “do your duty” becomes ordinary moralism


  **kāryaṃ karma (कार्यं कर्म)** — the deed that is to be done -> necessary/appointed
  action -> distinguishes yogic work from optional self-expression


  **param (परम्)** — the highest -> the supreme attainment reached through unattached
  doing -> not worldly success; the soteriological summit


  Cross-Tradition Resonances:


  **Zhu Xi / Neo-Confucian “investigation and practice”:** Structural homology in
  refusing a split between inner clarity and outer obligation.

  *Divergence:* Neo-Confucian li focuses moral-cosmic pattern; Krishna makes non-attachment
  the explicit liberating condition of action.


  **Ignatius of Loyola, Spiritual Exercises (indifference):** Structural homology
  in acting with holy indifference to outcomes.

  *Divergence:* Ignatian indifference serves discernment of God’s will in Christ;
  Gītā asakti serves release from karmabandhana toward param.'
voice_of_siva: ''
abhyasa: Name one necessary action you are delaying until you “feel detached”; do
  it now, and each time attachment flares, return to the act’s necessity rather than
  to your image in it.
