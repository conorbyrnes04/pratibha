sutra_id: BG_03_01_03
collection: Bhagavad Gita
section: chapter_03
title: Two Standings, Not One Ladder
sanskrit: 'अर्जुन उवाच


  ज्यायसी चेत्कर्मणस्ते मता बुद्धिर्जनार्दन।


  तत्किं कर्मणि घोरे मां नियोजयसि केशव


  व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे।


  तदेकं वद निश्िचत्य येन श्रेयोऽहमाप्नुयाम्


  श्री भगवानुवाच


  लोकेऽस्मिन्द्विविधा निष्ठा पुरा प्रोक्ता मयानघ।


  ज्ञानयोगेन सांख्यानां कर्मयोगेन योगिनाम्'
transliteration: 'arjuna uvāca


  jyāyasī cetkarmaṇaste matā buddhirjanārdana|


  tatkiṃ karmaṇi ghore māṃ niyojayasi keśava


  vyāmiśreṇeva vākyena buddhiṃ mohayasīva me|


  tadekaṃ vada niśicatya yena śreyo''hamāpnuyām


  śrī bhagavānuvāca


  loke''smindvividhā niṣṭhā purā proktā mayānagha|


  jñānayogena sāṃkhyānāṃ karmayogena yoginām'
translation: 'Arjuna said: If, Janārdana, you hold understanding [buddhi] superior
  to action [karma], why do you engage me in this grim action, Keśava? With speech
  that seems mixed you appear to confuse my understanding; tell me one thing, determined,
  by which I may attain the good [śreyas]. The Blessed Lord said: In this world two
  standings [niṣṭhā] were declared by me of old, O blameless one — of those established
  in Sāṃkhya, by the yoga of knowledge; of the yogins, by the yoga of action.'
commentary: 'Krishna’s answer refuses Arjuna’s demand for a single ranked path. The
  contested move is not that knowledge is “better” than action, but that two durable
  standings already structure human life: a cognition-rooted firmness and an action-rooted
  firmness. Arjuna hears contradiction because he treats teaching as a ladder with
  one top rung; Krishna treats it as two legitimate establishments (niṣṭhā) already
  announced. In the Gītā’s pedagogy this is decisive: earlier praise of buddhi does
  not cancel the battlefield demand. Sāṃkhya here names the orientation that rests
  in discriminative knowing; karma-yoga names the orientation that works without collapsing
  into quietism. Existentially, the verse forbids the modern habit of converting every
  spiritual insight into a reason to withdraw from obligation. Clarity about the good
  does not automatically dissolve the deed; it may instead require a second standing
  — action held as yoga rather than as craving’s instrument. The chapter begins by
  renaming Arjuna’s confusion: not “which path wins,” but “which standing are you
  ready to inhabit without demanding that the other be abolished.”


  Key Terms:


  **niṣṭhā (निष्ठा)** — from ni- + sthā, “to stand firmly” -> a durable establishment
  or settled orientation, not a temporary technique -> “path” flattens this into preference;
  here it names two abiding modes of life already declared


  **buddhi (बुद्धि)** — from budh, “to awaken/discern” -> discriminative understanding
  that ranks and decides -> “intellect” misses its practical force as the faculty
  that orients action rather than merely theorizing


  **jñānayoga (ज्ञानयोग)** — knowledge + yoga -> disciplined establishment in discriminative
  seeing, associated with Sāṃkhya orientation -> not armchair philosophy; a yogic
  standing whose fruit is firmness in knowing


  **karmayoga (कर्मयोग)** — action + yoga -> disciplined establishment in action without
  possessive claim -> “works” understates the yogic conversion of deed itself into
  liberating practice


  Cross-Tradition Resonances:


  **Epictetus, Discourses 1.1:** Structural homology in distinguishing what belongs
  to one’s governing faculty from what belongs to circumstance and deed — two zones
  of responsibility rather than one ranked virtue.

  *Divergence:* Epictetus centers prohairesis as the single inner citadel; the Gītā
  allows two public standings (knowledge and action) as co-declared establishments,
  not one interior faculty alone.


  **Zhuangzi, “Nourishing the Lord of Life”:** Structural homology in refusing a forced
  choice between contemplative ease and skillful engagement; both can be complete
  when rightly situated.

  *Divergence:* Zhuangzi often dissolves hierarchical ranking into spontaneous attunement
  (wuwei); Krishna keeps both standings as explicit pedagogical institutions rather
  than pure spontaneous flow.


  **Plotinus, Enneads I.2:** Structural homology in graded ways of purifying life
  — contemplative ascent and civic virtue as related but not identical stations.

  *Divergence:* Plotinus ranks purification toward the One; Krishna’s niṣṭhā language
  resists collapsing the two standings into a single ladder of superiority.'
voice_of_siva: ''
abhyasa: When you feel torn between “understanding more” and “acting now,” name which
  standing you are actually inhabiting today — knowing or doing — and complete one
  concrete obligation from that standing without demanding the other abolish it.
