sutra_id: BG_09_28_30
collection: Bhagavad Gita
section: chapter_09
title: Equal Lord, Transforming Refuge
sanskrit: 'शुभाशुभफलैरेवं मोक्ष्यसे कर्मबन्धनैः।


  संन्यासयोगयुक्तात्मा विमुक्तो मामुपैष्यसि


  समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः।


  ये भजन्ति तु मां भक्त्या मयि ते तेषु चाप्यहम्


  अपि चेत्सुदुराचारो भजते मामनन्यभाक्।


  साधुरेव स मन्तव्यः सम्यग्व्यवसितो हि सः'
transliteration: 'śubhāśubhaphalairevaṃ mokṣyase karmabandhanaiḥ|


  saṃnyāsayogayuktātmā vimukto māmupaiṣyasi


  samo''haṃ sarvabhūteṣu na me dveṣyo''sti na priyaḥ|


  ye bhajanti tu māṃ bhaktyā mayi te teṣu cāpyaham


  api cetsudurācāro bhajate māmananyabhāk|


  sādhureva sa mantavyaḥ samyagvyavasito hi saḥ'
translation: Thus you will be freed from the bonds of action that bear good and bad
  fruit; with self yoked in renunciation-yoga, liberated, you will come to Me. I am
  the same toward all beings; none is hateful or dear to Me. But those who worship
  Me with devotion are in Me and I am also in them. Even if a person of very ill conduct
  worships Me with exclusive devotion, that one is to be considered righteous — for
  that one has resolved rightly.
commentary: 'Equality without indifference, and mercy without naivete: the Lord is
  the same to all — none hated or dear as favoritism — yet devotion creates mutual
  indwelling. Then the shock: even one of very ill conduct who worships with exclusive
  devotion is to be counted righteous because of right resolve. The contested ethics
  refuses both purity-spirals and cheap antinomianism. Conduct matters; exclusive
  devotion and right resolve already place the person on the good path. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live
  one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.


  Key Terms:


  **sama + sudurācāra** — Sanskrit technical force in this passage -> impartial Lord;
  exclusive devotion reclassifies the ill-conducted -> default English flattens the
  contested philosophical work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the
  verse does with the term -> "bhakti" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> impartial
  Lord; exclusive devotion reclassifies the ill-conducted -> reducing either to emotion
  alone loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  impartial Lord; exclusive devotion reclassifies the ill-conducted.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
