translation: 'Yoga-mastery is iterative, not dramatic: establish body, regulate habit,
  and repeatedly return attention from dispersion to center. The mind''s restlessness
  is acknowledged, not denied; discipline is defined as return, again and again, through
  practice and detachment.'
commentary: 'The claim is that contemplative stability is trainable through rhythm,
  not force. Krishna''s counterintuitive move is pastoral realism: he fully agrees
  with Arjuna that the mind is difficult, then denies that difficulty is disqualification.
  The path is abhyasa (repeated training) plus vairagya (degrasping), not heroic suppression.


  This chapter prevents two common errors. First: romanticizing meditation as immediate
  transcendence. Second: pathologizing distraction as failure. In the Gita''s view,
  each return of attention is itself yoga-act. Mastery grows by accumulated non-dramatic
  corrections. Even bodily instructions (seat, posture, moderation) are not peripheral;
  they scaffold subtle work by reducing friction in the psycho-physical system.


  Existentially, this teaching is urgently applicable in attention-fragmented life.
  Digital overstimulation makes wandering mind feel normal and unchangeable. Krishna''s
  prescription remains exact: simplify conditions, regulate consumption, and train
  return without self-hatred. Over time, this produces not only meditative calm but
  functional resilience: less impulsive speech, fewer identity hijacks, and greater
  availability to right action. Inner governance becomes possible because one stops
  demanding perfect focus and instead becomes faithful to deliberate return.


  Key Terms:


  **abhyasa (अभ्यास)** - sustained practice/repetition -> disciplined returning, not
  occasional inspiration -> "practice" without continuity misses its force.


  **vairagya (वैराग्य)** - dispassion/degrasping -> release of compulsive pull, enabling
  attentional freedom -> "detachment" can sound cold if divorced from clarity.


  **yoga (योग)** - yoking/integration -> unified alignment of body, mind, and higher
  orientation -> not merely posture or relaxation technique.


  **atma-vinigraha (आत्मविनिग्रह)** - self-governance -> active regulation of inner
  movement toward steadiness -> weaker than "self-control" if reduced to repression.


  Cross-Tradition Resonances:


  **Yoga Sutra 1.12-1.14:** Structural homology is explicit: stabilization through
  practice and non-attachment.

  *Divergence:* Sutra tradition systematizes citta-vritti cessation; Gita embeds the
  same dynamic in devotion and duty ethics.


  **Vijnana Bhairava Tantra 24 and 28:** Both use repeated return to a subtle anchor
  to interrupt mental drift.

  *Divergence:* VBT offers short direct-entry methods; Gita frames a broader integrated
  discipline.


  **Marcus Aurelius, Meditations 5.1 and 8.12:** Both normalize mind-drift and insist
  on immediate return to governing principle.

  *Divergence:* Stoic return centers logos-duty; Gita unites return with yogic absorption
  and Krishna-refuge.'
