sutra_id: BG_04_01_03
collection: Bhagavad Gita
section: chapter_04
title: The Imperishable Yoga Returns Through Friendship
sanskrit: 'श्री भगवानुवाच


  इमं विवस्वते योगं प्रोक्तवानहमव्ययम्।


  विवस्वान् मनवे प्राह मनुरिक्ष्वाकवेऽब्रवीत्


  एवं परम्पराप्राप्तमिमं राजर्षयो विदुः।


  स कालेनेह महता योगो नष्टः परन्तप


  स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः।


  भक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम्'
transliteration: 'śrī bhagavānuvāca


  imaṃ vivasvate yogaṃ proktavānahamavyayam|


  vivasvān manave prāha manurikṣvākave''bravīt


  evaṃ paramparāprāptamimaṃ rājarṣayo viduḥ|


  sa kāleneha mahatā yogo naṣṭaḥ parantapa


  sa evāyaṃ mayā te''dya yogaḥ proktaḥ purātanaḥ|


  bhakto''si me sakhā ceti rahasyaṃ hyetaduttamam'
translation: 'The Blessed Lord said: I declared this imperishable [avyaya] yoga to
  Vivasvat; Vivasvat told Manu; Manu spoke it to Ikṣvāku. Thus received through succession
  [paramparā], the royal sages knew it; by long time here that yoga was lost, O scorcher
  of foes. That very ancient yoga is declared by me to you today — because you are
  my devotee and my friend; this is indeed the highest secret.'
commentary: 'Teaching is not invention ex nihilo; it is recovery of an imperishable
  yoga that time can lose in transmission without destroying in essence. The contested
  move is epistemological-political: royal sages once held it through paramparā, yet
  loss is real, and restoration happens through relationship — bhakta and sakhā —
  not through impersonal archive alone. Krishna authorizes Arjuna by friendship and
  devotion as the condition for receiving rahasya. In the Gītā’s pedagogy, intimacy
  is not sentimentality; it is the vessel of highest secrecy. Existentially, this
  refuses both novelty-cult and dead traditionalism. What matters is living succession
  and a heart capable of receiving what time misplaced. The yoga is ancient and yet
  must be spoken “today.” Paramparā can fail historically without the yoga itself
  becoming false; that distinction keeps tradition from both despair and fundamentalism.
  What was lost “by great time” can be spoken again when devotion and friendship make
  a vessel. Arjuna’s fitness is relational before it is technical. The highest secret
  is therefore not a puzzle for clever solitude but a trust exchanged in living succession.
  Recovering an ancient yoga means becoming someone who can receive it today without
  turning it into nostalgia or novelty.


  Key Terms:


  **paramparā (परम्परा)** — one-after-another succession -> living lineage transmission
  of yoga -> “tradition” can mean museum; here it is a chain that can break and be
  restored


  **avyaya (अव्यय)** — imperishable/inexhaustible -> the yoga’s essential non-decay
  -> contrasts with historical loss of availability


  **rahasya (रहस्य)** — secret -> highest teaching disclosed under conditions of devotion
  and friendship -> not trivia withheld; depth that requires relational fitness


  Cross-Tradition Resonances:


  **Plato, Seventh Letter (on unwritten teaching):** Structural homology in highest
  matters requiring fit soul and living transmission, not mere text.

  *Divergence:* Plato’s reserve is dialectical-philosophical; Krishna’s disclosure
  is theistic-yogic and framed through bhakti-friendship.


  **Chan/Zen lineage claims:** Structural homology in mind-to-mind succession vulnerable
  to historical rupture and renewal.

  *Divergence:* Chan stresses direct pointing beyond scriptures; here the secret is
  explicitly a yoga once held by rājarṣis and re-spoken by the Lord.'
voice_of_siva: ''
abhyasa: 'Receive one teaching today as if it were ancient and easily lost: write
  it in your own words and share it with one trusted friend without performing expertise.'
