sutra_id: BG_01_14_16
collection: Bhagavad Gita
section: chapter_01
title: Divine Conches Answer from the Chariot of White Horses
sanskrit: 'ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ।


  माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः


  पाञ्चजन्यं हृषीकेशो देवदत्तं धनंजयः।


  पौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः


  अनन्तविजयं राजा कुन्तीपुत्रो युधिष्ठिरः।


  नकुलः सहदेवश्च सुघोषमणिपुष्पकौ'
transliteration: 'tataḥ śvetairhayairyukte mahati syandane sthitau|


  mādhavaḥ pāṇḍavaścaiva divyau śaṅkhau pradadhmatuḥ


  pāñcajanyaṃ hṛṣīkeśo devadattaṃ dhanaṃjayaḥ|


  pauṇḍraṃ dadhmau mahāśaṅkhaṃ bhīmakarmā vṛkodaraḥ


  anantavijayaṃ rājā kuntīputro yudhiṣṭhiraḥ|


  nakulaḥ sahadevaśca sughoṣamaṇipuṣpakau'
translation: Then, standing in the great chariot yoked to white horses, Mādhava and
  the Pāṇḍava blew their divine conches. Hṛṣīkeśa blew Pāñcajanya; Dhanaṃjaya blew
  Devadatta; Bhīma of terrible deeds, the wolf-bellied, blew the great conch Pauṇḍra.
  King Yudhiṣṭhira, Kuntī’s son, blew Anantavijaya; Nakula and Sahadeva blew Sughoṣa
  and Maṇipuṣpaka.
commentary: 'The answering sound is named and personified. Each conch is not anonymous
  noise but a signature of identity: divine, royal, terrible, victorious. The contested
  move is the coupling of Kṛṣṇa and Arjuna in one chariot as the visual center of
  counter-sound. White horses and divine conches aestheticize war just as Duryodhana’s
  list bureaucratized it. Within Vaiṣṇava reading, Hṛṣīkeśa (“lord of the senses”)
  already hints that the true battle concerns sense-governance, even while the scene
  remains martial. Existentially, the passage asks what “signature sounds” you use
  to announce your presence in conflict — titles, devices, brands of courage. The
  Gītā lets the beauty of the scene stand, then will break it with Arjuna’s collapse,
  so that glamour cannot substitute for discernment.


  Beauty and divinity enter the noise without yet resolving the moral problem. The
  Gītā refuses iconoclasm here: sacred presence can stand in a chariot and still wait
  for a human crisis to become teachable. Glamour is allowed; glamour is not enough.


  Key Terms:


  **Hṛṣīkeśa (हृषीकेश)** — lord of the senses → Kṛṣṇa as master of sensory life →
  “Kṛṣṇa” alone misses the foreshadowing of sense-yoga.


  **divya śaṅkha (दिव्य शङ्ख)** — divine conch → sacred instrument of proclamation
  → “celestial trumpet” loses the specific ritual-martial object.


  **syandana (स्यन्दन)** — chariot → mobile platform of destiny in epic → “car” flattens
  its role as the later teaching seat.


  Cross-Tradition Resonances:


  **Book of Revelation 8–11 (trumpets):** Both use named blast-instruments to mark
  cosmic-historical turning.

  *Divergence:* Revelation’s trumpets announce apocalyptic judgment; here named conches
  inaugurate a human dharma-crisis that becomes yoga dialogue.


  **Ṛgveda I.32 (Indra’s martial sonic cosmogony):** Both bind sound to heroic presence
  and world-ordering combat.

  *Divergence:* Vedic hymn celebrates divine victory; the Gītā’s sonic glory will
  be interrupted by moral paralysis.'
voice_of_siva: ''
abhyasa: Identify one “signature” you use to announce yourself under pressure (title,
  tone, device). For one conversation today, enter without it and speak from bare
  presence.
