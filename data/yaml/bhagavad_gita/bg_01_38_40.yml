sutra_id: BG_01_38_40
collection: Bhagavad Gita
section: chapter_01
title: When Greed Blinds Them, Must We Still See the Fault of Family-Destruction
sanskrit: 'यद्यप्येते न पश्यन्ति लोभोपहतचेतसः।


  कुलक्षयकृतं दोषं मित्रद्रोहे च पातकम्


  कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम्।


  कुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन


  कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः।


  धर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत'
transliteration: 'yadyapyete na paśyanti lobhopahatacetasaḥ|


  kulakṣayakṛtaṃ doṣaṃ mitradrohe ca pātakam


  kathaṃ na jñeyamasmābhiḥ pāpādasmānnivartitum|


  kulakṣayakṛtaṃ doṣaṃ prapaśyadbhirjanārdana


  kulakṣaye praṇaśyanti kuladharmāḥ sanātanāḥ|


  dharme naṣṭe kulaṃ kṛtsnamadharmo''bhibhavatyuta'
translation: “Even if these, their minds destroyed by greed, do not see the fault
  born of destroying the family and the crime in betrayal of friends — how should
  it not be known by us to turn away from this sin, we who clearly see the fault of
  family-destruction, Janārdana? When the family is destroyed, the eternal family
  dharmas perish; when dharma is destroyed, adharma overwhelms the entire family.”
commentary: 'Arjuna invents an asymmetry of moral knowledge: their blindness does
  not license ours. The contested claim is that seeing *doṣa* creates obligation to
  withdraw, even when the other side cannot see. *Lobha* (greed) is diagnosed as the
  destroyer of their *cetas* (heart-mind), while Arjuna claims clear vision of systemic
  consequence: *kula-kṣaya* destroys *kula-dharma*, and lost dharma lets *adharma*
  overrun the whole. This is social ethics as cascade theory. The Gītā will later
  challenge whether withdrawal is the correct inference from this vision, but it preserves
  the seriousness of structural sin. Existentially, the verse warns against “they
  started it” as moral epistemology. Clear seeing of harm’s cascade binds you more,
  not less.


  Asymmetry of seeing creates asymmetry of obligation. Their blindness cannot be your
  permission slip. Structural sin thinking — family-dharma collapsing into adharma
  — is Arjuna’s gift to political ethics, even when his inference toward withdrawal
  is later complicated.


  The cascade model also implicates bystanders who see clearly and still imitate the
  blind. Clarity is not a spectator sport; it binds the seer to turn from the sin
  the other cannot even perceive.


  Key Terms:


  **lobhopahata-cetas (लोभोपहतचेतस्)** — mind struck down by greed → cognitive-moral
  disablement by acquisitive passion → “greedy” is too thin for total mental injury
  implied.


  **kula-dharma (कुलधर्म)** — family/lineage sustaining norms → ritual-ethical continuity
  across generations → “family values” is sentimental and anachronistic.


  **adharma (अधर्म)** — what fails to uphold → invasive disorder once dharma collapses
  → “unrighteousness” can sound merely legalistic.


  Cross-Tradition Resonances:


  **Thucydides III.82–83 (Corcyra stasis):** Both analyze how factional greed dissolves
  customary restraints and lets disorder overrun a community.

  *Divergence:* Thucydides offers tragic political diagnosis without soteriology;
  the Gītā embeds the diagnosis in a path toward yoga and right action.


  **Xunzi, “Enriching the State” / rituals as order:** Both treat collapse of shared
  norms as the gateway to pervasive disorder.

  *Divergence:* Xunzi rebuilds through ritual-law cultivation; Arjuna initially rebuilds
  through refusal to fight.'
voice_of_siva: ''
abhyasa: In a conflict where the other side seems blinded by gain, write the cascade
  of harms you see if you “win dirty,” then decide one concrete refusal that protects
  the larger order you care about.
