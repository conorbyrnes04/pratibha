sutra_id: BG_05_25_27
collection: Bhagavad Gita
section: chapter_05
title: Seers of Brahman-Nirvāṇa, Gates of Breath
sanskrit: 'लभन्ते ब्रह्मनिर्वाणमृषयः क्षीणकल्मषाः।


  छिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः


  कामक्रोधवियुक्तानां यतीनां यतचेतसाम्।


  अभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम्


  स्पर्शान्कृत्वा बहिर्बाह्यांश्चक्षुश्चैवान्तरे भ्रुवोः।


  प्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ'
transliteration: 'labhante brahmanirvāṇamṛṣayaḥ kṣīṇakalmaṣāḥ|


  chinnadvaidhā yatātmānaḥ sarvabhūtahite ratāḥ


  kāmakrodhaviyuktānāṃ yatīnāṃ yatacetasām|


  abhito brahmanirvāṇaṃ vartate viditātmanām


  sparśānkṛtvā bahirbāhyāṃścakṣuścaivāntare bhruvoḥ|


  prāṇāpānau samau kṛtvā nāsābhyantaracāriṇau'
translation: Seers whose stains are thinned, whose doubleness is cut, who are self-restrained,
  who delight in the welfare of all beings, obtain Brahman-nirvāṇa. For ascetics parted
  from desire and anger, with mind restrained, who have known the Self — Brahman-nirvāṇa
  is present all around. Making outer contacts outward, fixing the eyes at the brow’s
  center, making prāṇa and apāna equal as they move within the nose—
commentary: 'Brahman-nirvāṇa is not only an interior trophy; it is obtained by ṛṣis
  whose kalmaṣa is thinned, whose dvaidha is cut, who are yata-ātman and delight in
  sarva-bhūta-hita. The contested social edge is essential: same-seeing ripens into
  welfare-delight, not into cold detachment. For yatins free of kāma-krodha, with
  known Self, brahmanirvāṇa “lies all around” (abhitaḥ) — proximity language against
  distant heaven-thinking. Then technique begins: exclude outer contacts, gaze between
  brows, equalize breaths in the nostrils. Existentially, ethics and breath are one
  curriculum. Without welfare-delight and cut doubt, brow-gazing is cosmetics. With
  them, the end is already near. Welfare-delight joins cut doubt and thinned stain
  so that Brahman-nirvāṇa cannot be mistaken for private escape. For Self-knowers
  free of desire-anger, that end “lies all around,” collapsing distance-spirituality.
  Technique — outer contacts outward, brow gaze, equalized breaths — arrives only
  after this ethical-cognitive profile. Without it, psychosomatic methods are cosmetics.
  With it, breath and compassion are one readiness.


  Key Terms:


  **chinnadvaidha (छिन्नद्वैध)** — whose doubleness/doubt is cut -> unresolved split
  removed -> pairs with earlier saṃśaya-cutting


  **sarvabhūtahita (सर्वभूतहित)** — welfare of all beings -> delight-field of the
  seers -> blocks nirvāṇa as private escape


  **abhitaḥ (अभितः)** — all around/near on every side -> brahmanirvāṇa’s proximity
  for the Self-knowers -> spatial metaphor for readiness


  Cross-Tradition Resonances:


  **Bodhisattva synthesis of śamatha and karuṇā:** Structural homology in concentration
  joined to welfare of beings.

  *Divergence:* Bodhisattva vow postpones final extinguishing for others; here seers
  obtain brahmanirvāṇa while characterized by welfare-delight.


  **Hesychast psychosomatic prayer (gaze, breath):** Structural homology in coordinating
  eyes and breath for interior stillness.

  *Divergence:* Hesychasm invokes the Name; the Gītā’s sequence is Brahmanic-yogic
  toward brahmanirvāṇa.'
voice_of_siva: ''
abhyasa: 'Do one act for another being’s welfare, then sit: sense contacts outward,
  rest gaze softly toward the brow center, and equalize inhale and exhale for twenty
  breaths.'
