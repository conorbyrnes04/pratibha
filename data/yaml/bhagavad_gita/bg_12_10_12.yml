sutra_id: BG_12_10_12
collection: Bhagavad Gita
section: chapter_12
title: 'The Ladder: Practice, My Work, Relinquishing Fruit'
sanskrit: 'अभ्यासेऽप्यसमर्थोऽसि मत्कर्मपरमो भव।मदर्थमपि कर्माणि कुर्वन् सिद्धिमवाप्स्यसि


  अथैतदप्यशक्तोऽसि कर्तुं मद्योगमाश्रितः।सर्वकर्मफलत्यागं ततः कुरु यतात्मवान्


  श्रेयो हि ज्ञानमभ्यासाज्ज्ञानाद्ध्यानं विशिष्यते।ध्यानात्कर्मफलत्यागस्त्यागाच्छान्तिरनन्तरम्'
transliteration: 'abhyāse''pyasamartho''si matkarmaparamo bhava|madarthamapi karmāṇi
  kurvan siddhimavāpsyasi


  athaitadapyaśakto''si kartuṃ madyogamāśritaḥ|sarvakarmaphalatyāgaṃ tataḥ kuru yatātmavān


  śreyo hi jñānamabhyāsājjñānāddhyānaṃ viśiṣyate|dhyānātkarmaphalatyāgastyāgācchāntiranantaram'
translation: 'If you are incapable even of practice, become one who takes My action
  as supreme; doing actions for My sake, you will attain success.


  If even this you are unable to do, then taking refuge in My yoga, relinquish the
  fruit of all actions, with self restrained.


  Knowledge is better than practice; meditation excels over knowledge; relinquishing
  the fruit of actions excels over meditation — from relinquishing, peace [śānti]
  comes immediately.'
commentary: 'The concession ladder continues downward with astonishing pastoral realism:
  if practice fails, do My work; if that fails, relinquish fruits under My yoga. Then
  a revaluation: jñāna better than abhyāsa; dhyāna better than jñāna; karma-phala-tyāga
  better than dhyāna — and from tyāga, śānti at once. The contested move is that the
  "lowest" concession (fruit-relinquishing) is simultaneously ranked as immediately
  peace-giving — not as spiritual failure. Existentially this breaks shame-spirals:
  inability to meditate is not exile from the path. Relinquishing fruit while acting
  under refuge is not second-class; it is a door that opens onto peace now. The ladder
  is mercy; the ranking is clarity about what actually yields śānti. The line-level
  force of the teaching is practical, not ornamental: what it claims about reality
  is meant to reshape how you attend, choose, and depart. If the claim does not alter
  rehearsal in ordinary time, it will not hold when time thins. Existential uptake
  is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **karma-phala-tyāga (कर्मफलत्याग)** — relinquishing fruits of actions -> the rung
  that brings immediate peace -> "not caring about results" as apathy misses disciplined
  relinquishing under yoga.


  **śānti (शान्ति)** — peace -> immediate fruit of tyāga -> "calm feeling" understates
  the soteriological quietude meant here.


  **mat-karma (मत्कर्म)** — My action / action for Me -> the work-rung when practice
  fails -> "religious busywork" misses dedicated action-as-worship.


  Cross-Tradition Resonances:


  **Ignatian finding God in action:** Both allow action-paths when contemplation falters.

  *Divergence:* Jesuit frame is Christocentric; Gītā''s ladder explicitly ranks tyāga
  above dhyāna for immediate peace.


  **Stoic reserve clause:** Structural kinship with fruit-relinquishing.

  *Divergence:* Stoicism centers prohairesis; Gītā centers refuge in the Lord''s yoga.'
voice_of_siva: ''
abhyasa: 'Do one necessary task today while practicing only this: relinquish the fruit
  before you start. Notice whether peace appears sooner than when you chase a meditative
  high.'
