collection: Bhagavad Gita
section: chapter_13
title: Space Untouched, Self Untouched
sanskrit: 'यदा भूतपृथग्भावमेकस्थमनुपश्यति।तत एव च विस्तारं ब्रह्म सम्पद्यते तदा

  अनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः।शरीरस्थोऽपि कौन्तेय न करोति न लिप्यते

  यथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते।


  सर्वत्रावस्थितो देहे तथाऽऽत्मा नोपलिप्यते'
transliteration: 'yadā bhūtapṛthagbhāvamekasthamanupaśyati|tata eva ca vistāraṃ brahma
  sampadyate tadā

  anāditvānnirguṇatvātparamātmāyamavyayaḥ|śarīrastho''pi kaunteya na karoti na lipyate

  yathā sarvagataṃ saukṣmyādākāśaṃ nopalipyate|


  sarvatrāvasthito dehe tathā''''tmā nopalipyate'
translation: When one sees the separate being of beings as abiding in the One, and
  from that alone their expansion, then one becomes Brahman. Because it is beginningless
  and without guṇas, this supreme Self is imperishable. Though dwelling in the body,
  O son of Kuntī, it neither acts nor is stained. As the all-pervading space is not
  stained because of its subtlety, so the Self, seated everywhere in the body, is
  not stained.
commentary: 'The climax of discrimination is unitive: separate beings are seen as
  established in the One, and their expansion as from that One alone—then one becomes
  Brahman. This is not metaphor; it is the fruit of seeing. The Paramātman, beginningless
  and nirguṇa, neither acts nor is stained though body-dwelling. The ākāśa analogy
  is exact: space pervades and is intimate with all forms yet unsoiled by them because
  of subtlety. The contested move is embodied non-staining: spirituality that needs
  to flee the body misunderstands subtlety. Existentially, guilt, praise, and defilement
  narratives can be felt as weather in space, not as tattoos on the Self. The space
  analogy also disciplines guilt-spirituality: stains are real in the field, yet the
  Self’s subtlety is not improved by self-hate. Read as existential demand, the verse
  asks for a changed stance in the next difficult hour—not for ornamental agreement
  with a doctrine. Read as existential demand, the verse asks for a changed stance
  in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **eka-stha (एकस्थ)** — abiding in the One -> multiplicity rooted in unity -> “oneness”
  as slogan misses located establishment.

  **brahma sampadyate (ब्रह्म सम्पद्यते)** — becomes / attains Brahman -> realization
  as ontological fitting -> “goes to Brahman” can postpone what is present fruit.

  **na lipyate (न लिप्यते)** — is not smeared / stained -> non-contamination amid
  embodiment -> “unaffected” can sound dissociative.

  **ākāśa (आकाश)** — space / ether -> analogy for pervading unstained presence ->
  “sky” visualizes wrongly as overhead only.

  **saukṣmya (सौक्ष्म्य)** — subtlety -> the reason space and Self remain unsoiled
  -> “thinness” is too physical.


  Cross-Tradition Resonances:


  **[Chāndogya Upaniṣad III.14 / VI]:** Becoming what one knows (Brahman) resonates
  with brahma sampadyate.

  *Divergence:* Chāndogya often uses gradual teaching and metaphors of clay/gold;
  here the hinge is seeing multiplicity in the One.

  **[Zhuangzi, “Fasting of the Mind”]:** Emptiness that receives the world without
  being soiled parallels ākāśa-like Self.

  *Divergence:* Zhuangzi distrusts fixed metaphysical selves; the Gītā affirms Paramātman
  while using space as image of non-staining.

  **[Meister Eckhart, on the ground of the soul]:** The soul’s ground remains virgin
  amid images.

  *Divergence:* Eckhart pushes toward God beyond God; Krishna keeps the teaching inside
  body-dwelling non-action and non-stain.'
