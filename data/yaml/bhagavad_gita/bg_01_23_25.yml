sutra_id: BG_01_23_25
collection: Bhagavad Gita
section: chapter_01
title: Look at These Kurus Gathered — The Gaze That Will Break Him
sanskrit: 'योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः।


  धार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः


  संजय उवाच


  एवमुक्तो हृषीकेशो गुडाकेशेन भारत।


  सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम्


  भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम्।


  उवाच पार्थ पश्यैतान्समवेतान्कुरूनिति'
transliteration: 'yotsyamānānavekṣe''haṃ ya ete''tra samāgatāḥ|


  dhārtarāṣṭrasya durbuddheryuddhe priyacikīrṣavaḥ


  saṃjaya uvāca


  evamukto hṛṣīkeśo guḍākeśena bhārata|


  senayorubhayormadhye sthāpayitvā rathottamam


  bhīṣmadroṇapramukhataḥ sarveṣāṃ ca mahīkṣitām|


  uvāca pārtha paśyaitānsamavetānkurūniti'
translation: '“I wish to see those about to fight who have gathered here, wanting
  to do what pleases in battle the evil-minded son of Dhṛtarāṣṭra.” Thus addressed
  by Guḍākeśa, O Bhārata, Hṛṣīkeśa placed the excellent chariot between the two armies,
  before Bhīṣma and Droṇa and all the earth-rulers, and said: “Pārtha, look at these
  Kurus assembled.”'
commentary: 'Kṛṣṇa obeys the request and then intensifies it: *paśya* — look. He stations
  the chariot not at a safe abstract middle but facing teachers and elders. The counterintuitive
  move is that the divine charioteer does not spare Arjuna the gaze that will undo
  him; he facilitates it. Calling them “Kurus” collapses enemy/ally into one kinship
  field. Guḍākeśa (“conqueror of sleep”) is about to meet a waking he cannot control.
  Within the dialogue’s pedagogy, grace sometimes means placing you where your story
  breaks. Existentially, a true friend does not always protect your self-image; sometimes
  they help you see the faces that make slogans impossible. The crisis of chapter
  1 is midwifed by this command to look.


  Kṛṣṇa’s ''look'' is friendship without anesthesia. The divine does not always remove
  the unbearable image; sometimes it places you before it so that borrowed scripts
  fail. Only then can a new word about the Self and duty be heard as necessary rather
  than decorative.


  Key Terms:


  **Guḍākeśa (गुडाकेश)** — lord/conqueror of sleep → Arjuna as master of wakefulness
  → the epithet ironizes the swoon about to come.


  **paśya (पश्य)** — look! → imperative of unmediated seeing → “behold” can sound
  theatrical; the force is direct confrontation.


  **samavetān kurūn (समवेतान् कुरून्)** — the assembled Kurus → kinship name covering
  both armies’ lineage → “gathered warriors” erases the family-name shock.


  Cross-Tradition Resonances:


  **Genesis 22:1–14 (Abraham looking at Isaac):** Both stage a commanded gaze that
  makes sacrificial action ethically unbearable until a deeper word intervenes.

  *Divergence:* Genesis resolves by substitution under divine command; the Gītā resolves
  through a long teaching on Self, duty, and yoga.


  **Milarepa, songs of facing one’s demons:** Both treat guided confrontation with
  what one would rather not see as the doorway to transformation.

  *Divergence:* Milarepa’s confrontation is contemplative-yogic; Arjuna’s is socio-martial
  and public.'
