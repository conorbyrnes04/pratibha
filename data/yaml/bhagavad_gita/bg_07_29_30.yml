sutra_id: BG_07_29_30
collection: Bhagavad Gita
section: chapter_07
title: Knowing Me Through Death's Edge
sanskrit: 'जरामरणमोक्षाय मामाश्रित्य यतन्ति ये।


  ते ब्रह्म तद्विदुः कृत्स्नमध्यात्मं कर्म चाखिलम्


  साधिभूताधिदैवं मां साधियज्ञं च ये विदुः।


  प्रयाणकालेऽपि च मां ते विदुर्युक्तचेतसः'
transliteration: 'jarāmaraṇamokṣāya māmāśritya yatanti ye|


  te brahma tadviduḥ kṛtsnamadhyātmaṃ karma cākhilam


  sādhibhūtādhidaivaṃ māṃ sādhiyajñaṃ ca ye viduḥ|


  prayāṇakāle''pi ca māṃ te viduryuktacetasaḥ'
translation: Those who strive, taking refuge in Me, for liberation from old age and
  death — they know that Brahman, the entire field of inwardness [*adhyātma*], and
  action [*karma*] without remainder. Those who know Me together with the elemental
  [*adhibhūta*], the divine [*adhidaiva*], and the sacrificial [*adhiyajña*] — even
  at the hour of departure they know Me, their awareness yoked [*yukta-cetas*].
commentary: 'Chapter 7 closes by turning knowledge toward death. Refuge-based striving
  for freedom from aging and dying yields a complete knowing: Brahman, inwardness,
  and action entire — a triad that refuses splitting metaphysics, psychology, and
  ethics. The further claim is that knowing Kṛṣṇa *with* the cosmic registers (elemental,
  divine, sacrificial) holds at *prayāṇa-kāla* — departure time — if the mind is yoked.
  The contested pastoral point: deathbed clarity is not a separate technique invented
  at the last minute; it is the fruition of a knowing already practiced as refuge.
  Existentially this makes preparation concrete: what you know only as idea will not
  be what you know when the body loosens. Yoked awareness is the continuity between
  study and dying. Chapter 7''s closing triad — Brahman, adhyātma, karma entire —
  refuses the split between metaphysics, inwardness, and action that modern religiosity
  often accepts. Knowing that holds at departure must already include how you act
  and how you inhabit the inner field. The adhi- registers prevent a private mysticism
  that ignores world, gods, and sacrifice. Dying then becomes continuous with living:
  yukta-cetas is trained in ordinary hours or it will not appear in the last hour
  by wish.


  Key Terms:


  **adhyātma (अध्यात्म)** — pertaining to the inner self -> the whole inward field
  known with Brahman and karma -> "spirituality" is too vague; it is a technical register
  beside *adhibhūta* and *adhidaiva*.


  **prayāṇa-kāla (प्रयाणकाल)** — time of departure/death -> the stress-test of knowing
  -> "death" alone misses the journeying sense of *prayāṇa*.


  **yukta-cetas (युक्तचेतस्)** — yoked mind/heart -> condition for knowing at departure
  -> "calm" understates active yogic joining.


  Cross-Tradition Resonances:


  **Phaedo (philosophy as practice of dying):** Both bind true knowing to readiness
  for death.

  *Divergence:* Plato''s Socrates aims at soul''s release to Forms; Gītā aims at knowing
  the Lord across cosmic registers at departure.


  **Tibetan *bar do* instructions:** Both insist that recognition at death depends
  on prior training.

  *Divergence:* Bardo lore maps intermediate states; Gītā compresses the criterion
  to yoked knowing of Kṛṣṇa with *adhi-* registers.'
voice_of_siva: ''
abhyasa: 'Once today, while fully alive and ordinary, rehearse a single clear thought
  you would want to be true of your mind at departure: refuge, not panic. Hold it
  for ten breaths, then return to the next task.'
