title: Mixed Castes, Fallen Ancestors — The Social Apocalypse of War
sanskrit: 'अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः।


  स्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः


  सङ्करो नरकायैव कुलघ्नानां कुलस्य च।


  पतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः


  दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः।


  उत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः'
transliteration: 'adharmābhibhavātkṛṣṇa praduṣyanti kulastriyaḥ|


  strīṣu duṣṭāsu vārṣṇeya jāyate varṇasaṅkaraḥ


  saṅkaro narakāyaiva kulaghnānāṃ kulasya ca|


  patanti pitaro hyeṣāṃ luptapiṇḍodakakriyāḥ


  doṣairetaiḥ kulaghnānāṃ varṇasaṅkarakārakaiḥ|


  utsādyante jātidharmāḥ kuladharmāśca śāśvatāḥ'
translation: “From the predominance of adharma, Kṛṣṇa, the women of the family are
  corrupted; when women are corrupted, O Vārṣṇeya, mixture of varṇas is born. Mixture
  leads only to hell for the destroyers of the family and for the family; their ancestors
  fall, deprived of the offerings of rice-ball and water. By these faults of the family-destroyers
  that cause varṇa-mixture, the eternal jāti-dharmas and family dharmas are uprooted.”
commentary: 'Arjuna’s moral imagination goes intergenerational and ritual. War’s harm
  is not only corpses; it is ruptured continuity — women endangered, social categories
  mixed, ancestors starved of *piṇḍa* and water. The contested move for modern readers
  is double: take seriously his fear of civilizational unraveling, and refuse to treat
  his varṇa-anxiety as timeless law. Within the text’s historical world, *varṇa-saṅkara*
  names dread of order-collapse; within Pratibha reading, the philosophical core is
  that violence damages the networks that make ethical life reproducible. The Gītā
  will not leave Arjuna’s sociology as final, but it lets him articulate harm beyond
  the individual. Existentially, ask what “ancestor rites” analog you depend on —
  mentorship, care practices, cultural transmission — and whether your conflict strategies
  quietly cancel them.


  Intergenerational harm is the chapter’s widest lens. Whether or not one accepts
  his varṇa sociology, the claim that violence damages reproducibility of care stands.
  A practice worthy of the Gītā must ask what rites of continuity your conflicts quietly
  cancel.


  Key Terms:


  **varṇa-saṅkara (वर्णसङ्कर)** — mixing of social classes/orders → feared collapse
  of role-structure → “caste mixture” is historically loaded; the passage’s force
  is anxiety over disordered reproduction of roles.


  **piṇḍodaka-kriyā (पिण्डोदकक्रिया)** — rice-ball and water rites for the dead →
  ritual feeding that sustains ancestral presence → “funeral offerings” misses the
  ongoing relational economy with the dead.


  **kulaghna (कुलघ्न)** — family-destroyer → agent of lineage annihilation → “destroyer
  of the family” is literal; the term is almost a moral species-name.


  Cross-Tradition Resonances:


  **Confucius, Analects 1.2 / 2.21 (filial-ritual continuity):** Both treat rupture
  of family-ritual order as gateway to wider social decay.

  *Divergence:* Confucian repair centers cultivated filiality and ritual; Arjuna’s
  immediate repair is refusal of battle.


  **Aeschylus, Oresteia:** Both show that kin-violence poisons households across generations
  until a deeper justice intervenes.

  *Divergence:* The Oresteia moves toward civic tribunal; the Gītā moves toward yoga,
  Self-knowledge, and consecrated action.'
