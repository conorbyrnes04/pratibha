sutra_id: BG_18_47_49
collection: Bhagavad Gita
section: chapter_18
title: Own Imperfect Duty Over Another’s Perfection
sanskrit: 'श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।स्वभावनियतं कर्म कुर्वन्नाप्नोति
  किल्बिषम्

  सहजं कर्म कौन्तेय सदोषमपि न त्यजेत्।सर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः

  असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः।नैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति'
transliteration: 'śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt|svabhāvaniyataṃ
  karma kurvannāpnoti kilbiṣam

  sahajaṃ karma kaunteya sadoṣamapi na tyajet|sarvārambhā hi doṣeṇa dhūmenāgnirivāvṛtāḥ

  asaktabuddhiḥ sarvatra jitātmā vigataspṛhaḥ|naiṣkarmyasiddhiṃ paramāṃ saṃnyāsenādhigacchati'
translation: Better is one’s own dharma, though imperfect, than another’s dharma well
  performed. Doing action determined by one’s nature, one does not incur fault. One
  should not abandon inborn action, O son of Kuntī, even if defective; for all undertakings
  are covered with defect, as fire is with smoke. One whose intellect is unattached
  everywhere, who has conquered the self, who is free of longing, attains by renunciation
  the supreme success of actionlessness.
commentary: 'Svadharma returns with pastoral severity: better imperfect own-dharma
  than well-done foreign dharma. Sahaja karma, even defective, should not be abandoned—because
  all undertakings are smoke-wrapped like fire. Then the summit of this arc: asaktabuddhi,
  jitātman, vigataspṛha attains by saṃnyāsa the supreme naiṣkarmya-siddhi. The contested
  pair holds responsibility and release together. Existentially, waiting for a smoke-free
  vocation is a refusal of fire. Freedom is not defectlessness; it is non-attached,
  longing-freed performance that ripens into actionlessness’s success. In the Gītā’s
  pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum
  label on a doctrine. The existential stake is that this teaching must change how
  you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **svadharma (स्वधर्म)** — own dharma -> imperfect but better -> ''personal brand''
  is a counterfeit.

  **sahaja karma (सहज कर्म)** — inborn action -> not to be abandoned for defects ->
  ''comfort zone'' mishears.

  **dhūmena agniḥ (धूमेनाग्निः)** — fire covered by smoke -> all undertakings’ defect
  -> ''everything is problematic'' as cynicism is the parody.

  **naiṣkarmya-siddhi (नैष्कर्म्यसिद्धि)** — success of actionlessness -> supreme
  fruit via renunciation -> ''retirement'' is worldly parody.


  Cross-Tradition Resonances:


  **[Gītā 3.35]:** Same svadharma maxim returns for final force.

  *Divergence:* 18.47–49 add smoke-fire and naiṣkarmya-siddhi.

  **[Lutheran vocation]:** Serving in one’s calling despite imperfection resonates.

  *Divergence:* Lutheran grammar is justification-centered; here naiṣkarmya is yogic
  renunciation’s fruit.

  **[Daoist wuwei]:** Actionlessness success resonates with naiṣkarmya.

  *Divergence:* Wuwei is dao-spontaneity; Gītā’s naiṣkarmya follows conquered self
  and non-longing renunciation.'
