sutra_id: BG_15_01
collection: Bhagavad Gita
section: chapter_15
title: The Inverted Tree of Becoming
sanskrit: श्री भगवानुवाचऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम्।छन्दांसि यस्य पर्णानि
  यस्तं वेद स वेदवित्
transliteration: śrī bhagavānuvācaūrdhvamūlamadhaḥśākhamaśvatthaṃ prāhuravyayam|chandāṃsi
  yasya parṇāni yastaṃ veda sa vedavit
translation: 'The Blessed Lord said: They speak of an eternal aśvattha tree with roots
  above and branches below, whose leaves are the Vedic hymns. Whoever knows it is
  a knower of the Veda.'
commentary: 'The cosmos is imaged as an inverted sacred fig: roots above, branches
  below, leaves as Vedic chants. The contested move is epistemological and cosmological
  at once. Ordinary perception roots the world in the visible below; Krishna roots
  it in the unseen above. To know this tree is to be vedavit—not a technician of ritual
  sound, but one who understands what the hymns themselves are leaves of. The aśvattha
  is avyaya, enduring as saṃsāric process, yet knowable as a structure that can later
  be cut. Existentially, the verse asks whether you live as if meaning rises from
  sensory branches, or as if the nourishing root is above. The battlefield’s confusion
  is a canopy problem: too many leaves, forgotten root. In the Gītā’s pedagogy, concept
  without existential cut becomes another ornament of bondage; therefore the verse
  must be read as a demand on perception, desire, and refuge, not as a museum label
  on a doctrine.


  Key Terms:


  **aśvattha (अश्वत्थ)** — sacred fig / ''that which does not stand tomorrow'' ->
  saṃsāra-tree -> ''world-tree'' loses the name’s instability hint.

  **ūrdhva-mūla (ऊर्ध्वमूल)** — root above -> transcendent sourceward orientation
  -> ''upside-down'' as quirky image misses metaphysics.

  **chandāṃsi (छन्दांसि)** — meters/Vedic hymns as leaves -> revelation as foliage
  of the tree -> ''poetry'' understates liturgical cosmology.

  **vedavit (वेदवित्)** — knower of Veda -> one who knows this tree -> ''scripture
  scholar'' can miss the ontological knowing.


  Cross-Tradition Resonances:


  **[Kaṭha Upaniṣad II.3.1]:** The inverted aśvattha is near-direct source homology.

  *Divergence:* Kaṭha emphasizes Brahman beyond; the Gītā will weaponize non-attachment
  as the axe.

  **[Plato, cave allegory]:** Reversing the apparent source of reality resonates structurally.

  *Divergence:* Plato ascends to forms; Krishna maps a cuttable tree of becoming.

  **[Yggdrasil / world-tree myths]:** Cosmic tree as world-structure is cross-cultural.

  *Divergence:* Those myths often stabilize cosmos; here the tree is to be known in
  order to be felled.'
voice_of_siva: ''
abhyasa: 'Visualize your worries as leaves. Ask once: ''Where is the root—below in
  events, or above?'' Rest attention rootward for three minutes.'
