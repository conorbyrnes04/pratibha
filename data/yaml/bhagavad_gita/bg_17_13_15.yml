sutra_id: BG_17_13_15
collection: Bhagavad Gita
section: chapter_17
title: Tamasic Sacrifice and the Triple Austerity
sanskrit: 'विधिहीनमसृष्टान्नं मन्त्रहीनमदक्षिणम्।श्रद्धाविरहितं यज्ञं तामसं परिचक्षते

  देवद्विजगुरुप्राज्ञपूजनं शौचमार्जवम्।ब्रह्मचर्यमहिंसा च शारीरं तप उच्यते

  अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत्।स्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते'
transliteration: 'vidhihīnamasṛṣṭānnaṃ mantrahīnamadakṣiṇam|śraddhāvirahitaṃ yajñaṃ
  tāmasaṃ paricakṣate

  devadvijaguruprājñapūjanaṃ śaucamārjavam|brahmacaryamahiṃsā ca śārīraṃ tapa ucyate

  anudvegakaraṃ vākyaṃ satyaṃ priyahitaṃ ca yat|svādhyāyābhyasanaṃ caiva vāṅmayaṃ
  tapa ucyate'
translation: Sacrifice without ordinance, without food offered, without mantras, without
  gifts, and without faith is declared tamasic. Worship of gods, of the twice-born,
  of teachers, and of the wise; purity, uprightness, continence, and non-harming are
  called austerity of the body. Speech that causes no agitation, that is true, pleasant,
  and beneficial, and also practice of sacred study—these are called austerity of
  speech.
commentary: 'Tamasic yajña is defined by absences: no vidhi, no food-sharing, no mantra,
  no dakṣiṇā, no śraddhā. Then tapas is redeemed from ghora parody by a threefold
  humane map. Body-tapas: reverence, purity, continence, non-harm. Speech-tapas: non-agitating,
  true, kind, useful speech plus svādhyāya. The contested move is relocating austerity
  into ethics of relation and speech. Existentially, your harshest “honesty” may fail
  speech-tapas; your flashiest fast may fail body-tapas. The Gītā prefers reverence
  and non-harm to self-violence. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **dakṣiṇā (दक्षिणा)** — ritual gift -> absence marks tamasic yajña -> ''tip'' trivializes
  reciprocal offering.

  **śārīraṃ tapaḥ (शारीरं तपः)** — bodily austerity -> reverence/purity/continence/non-harm
  -> ''workout'' is a parody.

  **vāṅmayaṃ tapaḥ (वाङ्मयं तपः)** — austerity of speech -> truth joined to kindness
  and benefit -> ''radical candor'' often fails this.

  **svādhyāya (स्वाध्याय)** — self-study / recitation -> part of speech-tapas -> ''reading
  about spirituality'' can counterfeit it.


  Cross-Tradition Resonances:


  **[Gītā 17.5–6 contrast]:** Abusive tapas vs ethical tapas is intentional pedagogy.

  *Divergence:* 17.14–15 redefine austerity after exposing demonic austerity.

  **[James 3 on the tongue]:** Speech ethics as spiritual crucible resonates.

  *Divergence:* James is ecclesial-wisdom; Krishna places speech inside guṇa-coded
  tapas.

  **[Confucian rectification of speech/rite]:** Right speaking and rite without hollowness
  resonate.

  *Divergence:* Aims differ; both refuse empty ceremony and harmful speech.'
