sutra_id: BG_11_28_30
collection: Bhagavad Gita
section: chapter_11
title: Rivers to Ocean — Moths to Flame
sanskrit: 'यथा नदीनां बहवोऽम्बुवेगाः


  समुद्रमेवाभिमुखा द्रवन्ति।


  तथा तवामी नरलोकवीरा


  विशन्ति वक्त्राण्यभिविज्वलन्ति


  यथा प्रदीप्तं ज्वलनं पतङ्गा


  विशन्ति नाशाय समृद्धवेगाः।


  तथैव नाशाय विशन्ति लोका


  स्तवापि वक्त्राणि समृद्धवेगाः


  लेलिह्यसे ग्रसमानः समन्ता


  ल्लोकान्समग्रान्वदनैर्ज्वलद्भिः।


  तेजोभिरापूर्य जगत्समग्रं


  भासस्तवोग्राः प्रतपन्ति विष्णो'
transliteration: 'yathā nadīnāṃ bahavo''mbuvegāḥ


  samudramevābhimukhā dravanti|


  tathā tavāmī naralokavīrā


  viśanti vaktrāṇyabhivijvalanti


  yathā pradīptaṃ jvalanaṃ pataṅgā


  viśanti nāśāya samṛddhavegāḥ|


  tathaiva nāśāya viśanti lokā


  stavāpi vaktrāṇi samṛddhavegāḥ


  lelihyase grasamānaḥ samantā


  llokānsamagrānvadanairjvaladbhiḥ|


  tejobhirāpūrya jagatsamagraṃ


  bhāsastavogrāḥ pratapanti viṣṇo'
translation: As many river torrents rush toward the ocean, so these heroes of the
  human world enter Your blazing mouths. As moths rush into a burning flame to destruction,
  so worlds enter Your mouths to destruction. You lick up all worlds on every side
  with blazing mouths, swallowing them; Your fierce rays fill the whole world with
  brilliance and scorch it, O Vishnu.
commentary: 'Destruction disclosed as divine action in time; moth-truth precedes later
  ethics. The contested move in this stretch of the vision is that heroes enter mouths
  like rivers to sea and moths to flame; vishnu licks and scorches worlds. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion
  after seeing. Do not aestheticize the theophany; let it revise what you think action,
  fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **lelihyase (लेलिह्यसे)** — passage key term -> Destruction disclosed as divine
  action in time; moth-truth precedes later ethics. -> default gloss flattens the
  vision''s force

  **Viṣṇu (विष्णु)** — paired key term -> Heroes enter mouths like rivers to sea and
  moths to flame; Vishnu licks and scorches worlds. -> soft translation misses structural
  role


  Cross-Tradition Resonances:


  **[Upanishadic moth/ocean]:** Structural kinship around world-consuming.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Stoic ekpyrosis]:** Shared pressure of world-consuming.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person
  disclosure.'
