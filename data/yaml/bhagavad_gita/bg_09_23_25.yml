sutra_id: BG_09_23_25
collection: Bhagavad Gita
section: chapter_09
title: Other Gods, Same Enjoyer
sanskrit: 'येऽप्यन्यदेवता भक्ता यजन्ते श्रद्धयाऽन्विताः।


  तेऽपि मामेव कौन्तेय यजन्त्यविधिपूर्वकम्


  अहं हि सर्वयज्ञानां भोक्ता च प्रभुरेव च।


  न तु मामभिजानन्ति तत्त्वेनातश्च्यवन्ति ते


  यान्ति देवव्रता देवान् पितृ़न्यान्ति पितृव्रताः।


  भूतानि यान्ति भूतेज्या यान्ति मद्याजिनोऽपि माम्'
transliteration: 'ye''pyanyadevatā bhaktā yajante śraddhayā''nvitāḥ|


  te''pi māmeva kaunteya yajantyavidhipūrvakam


  ahaṃ hi sarvayajñānāṃ bhoktā ca prabhureva ca|


  na tu māmabhijānanti tattvenātaścyavanti te


  yānti devavratā devān pitṛ़nyānti pitṛvratāḥ|


  bhūtāni yānti bhūtejyā yānti madyājino''pi mām'
translation: Even devotees of other deities who sacrifice with faith sacrifice to
  Me alone, O Son of Kuntī — though not according to right method. For I am the enjoyer
  and lord of all sacrifices; but they do not know Me in truth, so they fall. Devotees
  of the gods go to the gods; ancestors' devotees to the ancestors; spirit-worshippers
  to the spirits; those who sacrifice to Me come to Me.
commentary: 'Inclusivism with teeth: faith-filled sacrifices to other deities reach
  Kṛṣṇa as true enjoyer and lord of all sacrifices — yet improper method and non-recognition
  in truth cause falling away. Destinations match vows: gods, ancestors, spirits,
  or Me. The contested theology grants efficacy without equal finality. Existentially
  this allows respect for sincerity without dissolving discriminative ends. Where
  your vow points is where you go. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The
  teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. Live one concrete implication of the
  claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **avidhi** — Sanskrit technical force in this passage -> other sacrifices reach
  Me yet fall without tattva -> default English flattens the contested philosophical
  work.

  **destinations** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what
  the verse does with the term -> "destinations" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> other
  sacrifices reach Me yet fall without tattva -> reducing either to emotion alone
  loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  other sacrifices reach Me yet fall without tattva.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
