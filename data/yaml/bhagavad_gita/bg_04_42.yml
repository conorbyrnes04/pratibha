sutra_id: BG_04_42
collection: Bhagavad Gita
section: chapter_04
title: Cut Heart-Doubt with Knowledge’s Sword and Stand Up
sanskrit: 'तस्मादज्ञानसंभूतं हृत्स्थं ज्ञानासिनाऽऽत्मनः।


  छित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत'
transliteration: 'tasmādajñānasaṃbhūtaṃ hṛtsthaṃ jñānāsinā''''tmanaḥ|


  chittvainaṃ saṃśayaṃ yogamātiṣṭhottiṣṭha bhārata'
translation: Therefore, having cut this doubt born of ignorance, seated in the heart,
  with the Self’s sword of knowledge, take your stand in yoga — stand up, Bhārata.
commentary: 'The chapter ends in martial interiority: saṃśaya is hṛt-stha — heart-seated
  — born of ajñāna, and must be cut with jñānāsi of the ātman. The contested finale
  joins contemplation to command — yogam ātiṣṭha, uttiṣṭha — take stand in yoga and
  stand up. Knowledge’s sword is not for endless self-dissection as lifestyle; it
  is for ending the doubt that prevents yogic stance and upright action. In the epic
  frame, Arjuna must rise into battle from a cleared heart. Existentially, heart-doubt
  masquerades as sophistication while immobilizing dharma. Cut, stand in yoga, stand
  up. The sequence is the pedagogy’s seal. Heart-seated doubt immobilizes dharma while
  performing sophistication. The sword of Self-knowledge is for ending that immobilization,
  not for endless self-dissection as lifestyle. After cutting comes establishment
  in yoga and the bodily imperative to stand up. Chapter 4 thus returns thought to
  the field: cleared heart, yogic stance, risen action. Doubt that cannot become either
  learning or standing must be cut so life can resume its appointed height.


  Key Terms:


  **jñānāsi (ज्ञानासि)** — sword of knowledge -> knowledge as cutting instrument ->
  martial image for cognitive liberation


  **hṛtstha (हृत्स्थ)** — seated in the heart -> doubt’s location in the affective
  core -> explains why argument alone often fails


  **yogam ātiṣṭha (योगमातिष्ठ)** — take your stand in yoga -> establishment, not dabbling
  -> the positive act after cutting


  Cross-Tradition Resonances:


  **Paul, Ephesians 6 (sword of the Spirit):** Structural homology in weaponized word/knowledge
  for interior combat.

  *Divergence:* Pauline armor is christological-ecclesial; here the sword is ātman’s
  knowledge cutting heart-doubt before yogic uprising.


  **Kaṭha’s “arise, awake” pedagogy:** Structural homology in imperative awakening
  toward the path.

  *Divergence:* Kaṭha stresses the razor path to the Person; this verse specifically
  targets heart-seated saṃśaya before yoga-stance.'
voice_of_siva: ''
abhyasa: 'Locate one heart-seated doubt that keeps you seated when you should stand;
  state the knowing that cuts it in one sentence, then take one upright yogic action
  immediately.


