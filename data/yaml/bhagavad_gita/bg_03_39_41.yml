sutra_id: BG_03_39_41
collection: Bhagavad Gita
section: chapter_03
title: Desire’s Seat Is Senses, Mind, and Buddhi
sanskrit: 'आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा।


  कामरूपेण कौन्तेय दुष्पूरेणानलेन च


  इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते।


  एतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम्


  तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ।


  पाप्मानं प्रजहि ह्येनं ज्ञानविज्ञाननाशनम्'
transliteration: 'āvṛtaṃ jñānametena jñānino nityavairiṇā|


  kāmarūpeṇa kaunteya duṣpūreṇānalena ca


  indriyāṇi mano buddhirasyādhiṣṭhānamucyate|


  etairvimohayatyeṣa jñānamāvṛtya dehinam


  tasmāttvamindriyāṇyādau niyamya bharatarṣabha|


  pāpmānaṃ prajahi hyenaṃ jñānavijñānanāśanam'
translation: Knowledge is covered by this perpetual enemy of the knower, in the form
  of desire, Kaunteya — hard to fill, like fire. Senses, mind, and understanding are
  said to be its abode; through these it deludes the embodied one, covering knowledge.
  Therefore first restrain the senses, bull of the Bharatas, and strike down this
  evil that destroys knowledge and realization [jñāna-vijñāna].
commentary: 'Even the knower has a perpetual enemy: desire-form that covers jñāna
  like an unsatisfiable fire. The contested tactical claim is order of operations
  — ādau indriyāṇi niyamya — first restrain the senses, because desire’s abode includes
  senses, manas, and buddhi. If buddhi itself can be occupied, mere thinking about
  desire will not defeat it; the entry points must be narrowed. In yoga’s classical
  logic, vijñāna (lived realization) dies when this covering persists, not only abstract
  jñāna. Existentially, the teaching refuses both repression fantasies and intellectualization.
  You begin where contact happens. Strike the evil that uses your best faculties as
  its house. Without that strike, knowledge remains smoke-covered brilliance. First
  restrain the senses because desire’s household includes buddhi itself; if you begin
  with arguments alone, you debate inside the enemy’s furniture. The order of operations
  is merciful precision: narrow the gates, then strike what destroys both knowing
  and lived realization. This also explains why the wise still have a “perpetual enemy”:
  knowledge does not automatically evict the tenant. Vigilance at the abodes is ongoing
  combat doctrine, not a beginner’s brace to be discarded.


  Key Terms:


  **nityavairin (नित्यवैरिन्)** — perpetual enemy -> desire as ongoing adversary even
  of the wise -> blocks the fantasy that knowledge automatically ends conflict


  **adhiṣṭhāna (अधिष्ठान)** — abode/base -> senses-mind-buddhi as desire’s seating
  -> shows why combat must be multi-level


  **jñānavijñāna (ज्ञानविज्ञान)** — knowledge and realization -> cognitive insight
  plus lived discernment -> desire destroys both, not only book-knowing


  Cross-Tradition Resonances:


  **Evagrius Ponticus (on logismoi):** Structural homology in tracing passionate thoughts
  through sensory triggers into the governing intellect.

  *Divergence:* Evagrian combat is ordered toward apatheia in Christ; the Gītā orders
  sense-restraint toward killing kāma as covering of jñāna-vijñāna.


  **Patanjali, YS 2.16–2.17:** Structural homology in targeting the conjunction that
  produces future suffering at its accessible points.

  *Divergence:* Patañjali’s framework is citta-vṛtti and kleśa; here the enemy is
  personified as kāma with explicit abodes in the inner instrument.'
voice_of_siva: ''
abhyasa: 'For one day, apply first restraint at the senses: reduce one habitual intake
  channel (scrolling, snacking, gossip), and notice whether mind and judgment grow
  less combustible.'
