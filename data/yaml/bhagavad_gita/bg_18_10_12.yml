sutra_id: BG_18_10_12
collection: Bhagavad Gita
section: chapter_18
title: The True Relinquisher Cannot Drop All Action
sanskrit: 'न द्वेष्ट्यकुशलं कर्म कुशले नानुषज्जते।त्यागी सत्त्वसमाविष्टो मेधावी छिन्नसंशयः

  न हि देहभृता शक्यं त्यक्तुं कर्माण्यशेषतः।यस्तु कर्मफलत्यागी स त्यागीत्यभिधीयते

  अनिष्टमिष्टं मिश्रं च त्रिविधं कर्मणः फलम्।भवत्यत्यागिनां प्रेत्य न तु संन्यासिनां
  क्वचित्'
transliteration: 'na dveṣṭyakuśalaṃ karma kuśale nānuṣajjate|tyāgī sattvasamāviṣṭo
  medhāvī chinnasaṃśayaḥ

  na hi dehabhṛtā śakyaṃ tyaktuṃ karmāṇyaśeṣataḥ|yastu karmaphalatyāgī sa tyāgītyabhidhīyate

  aniṣṭamiṣṭaṃ miśraṃ ca trividhaṃ karmaṇaḥ phalam|bhavatyatyāgināṃ pretya na tu saṃnyāsināṃ
  kvacit'
translation: The wise relinquisher, filled with sattva, with doubts cut, neither hates
  disagreeable action nor clings to agreeable action. For embodied beings cannot entirely
  abandon actions; but the one who relinquishes the fruit of action is called a relinquisher.
  The threefold fruit of action—undesired, desired, and mixed—accrues after death
  to those who do not relinquish, but never to renouncers.
commentary: 'The sattvic tyāgī’s affect is precise: no hatred of akuśala work, no
  clinging to kuśala work. Then the anthropological limit: dehabhṛt cannot drop all
  actions; phala-tyāgī is the true tyāgī. Fruits—aniṣṭa, iṣṭa, miśra—accrue after
  death to non-relinquishers, not to saṃnyāsins. The contested realism blocks fantasy
  renunciation. Existentially, you will act while embodied; the freedom available
  is fruit-freedom. The afterlife calculus is already being written in your clutching.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **akuśala / kuśala (अकुशल / कुशल)** — disagreeable/unskillful vs agreeable/skillful
  action -> affective traps -> ''bad/good tasks'' is thinner.

  **dehabhṛt (देहभृत्)** — body-bearer -> cannot drop all action -> ''human'' misses
  the embodied constraint thesis.

  **karmaphalatyāgī (कर्मफलत्यागी)** — fruit-relinquisher -> the one truly named tyāgī
  -> ''detached professional'' can counterfeit.

  **aniṣṭa-iṣṭa-miśra (अनिष्टइष्टमिश्र)** — undesired, desired, mixed fruits -> postmortem
  accrual -> ''consequences'' without afterlife frame is partial.


  Cross-Tradition Resonances:


  **[Gītā 3.5]:** No one can remain actionless even for a moment—continuity.

  *Divergence:* 18.11 makes fruit-relinquishment the practical definition of tyāgī.

  **[Karma theory in Yoga Sūtra II.12–14]:** Fruit ripening across births resonates.

  *Divergence:* Patañjali aims at kleśa cessation; Krishna ties non-accrual to renouncer
  status.

  **[Protestant vocation debates]:** Worldly action without merit-clutch loosely resonates.

  *Divergence:* Theological grammars differ; structure is act-without-fruit-ownership.'
