sutra_id: BG_14_12_14
collection: Bhagavad Gita
section: chapter_14
title: Signs of Rajas and Tamas, and Death in Sattva
sanskrit: 'लोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा।रजस्येतानि जायन्ते विवृद्धे भरतर्षभ

  अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च।तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन

  यदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत्।तदोत्तमविदां लोकानमलान्प्रतिपद्यते'
transliteration: 'lobhaḥ pravṛttirārambhaḥ karmaṇāmaśamaḥ spṛhā|rajasyetāni jāyante
  vivṛddhe bharatarṣabha

  aprakāśo''pravṛttiśca pramādo moha eva ca|tamasyetāni jāyante vivṛddhe kurunandana

  yadā sattve pravṛddhe tu pralayaṃ yāti dehabhṛt|tadottamavidāṃ lokānamalānpratipadyate'
translation: Greed, activity, undertaking of actions, unrest, and longing arise when
  rajas increases, O best of Bharatas. Darkness, inactivity, negligence, and delusion
  arise when tamas increases, O joy of the Kurus. When the embodied one dies while
  sattva is dominant, then he attains the stainless worlds of those who know the highest.
commentary: 'Behavioral signatures clarify the climates: rajas shows as greed, initiation-fever,
  unrest, craving; tamas as darkness, non-activity, negligence, delusion. Then the
  chapter raises the stakes to death: dying in sattva yields stainless worlds of the
  highest knowers. The contested move is to treat the dying climate as decisive without
  reducing life to deathbed panic. One’s cultivated predominance at the end expresses
  a trajectory already rehearsed in ordinary days. Classical readers hear continuity
  between living practice and dying fruition; modern readers can hear a demand for
  honesty about the climate you feed. Existentially, this is not superstition; it
  is continuity: the weather you rehearse becomes the world you inherit. The teaching
  does not ask for perfection at the last minute; it asks for long apprenticeship
  in luminosity without making luminosity your prison. Therefore daily rehearsal matters
  more than emergency spirituality: the dying mind continues the groove already cut
  by living preference. This is not ornamental theology; it is a demand that lived
  climate, ethical stance, and metaphysical claim stay braided in one practice of
  seeing.


  Key Terms:


  **lobha (लोभ)** — greed -> rajasic signature -> ''ambition'' can romanticize the
  same bind.

  **aprakāśa (अप्रकाश)** — non-light / darkness -> tamasic signature -> ''confusion''
  is narrower than ontological darkening.

  **pralaya (प्रलय)** — dissolution / death here as body''s end -> transition keyed
  to guṇa dominance -> ''death'' alone misses climate-continuity.

  **amalān lokān (अमलान् लोकान्)** — stainless worlds -> sattvic postmortem fruition
  -> ''heaven'' may import alien geography.


  Cross-Tradition Resonances:


  **[Tibetan bardos / dying awareness teachings]:** State at death shaping next arising
  is structurally homologous.

  *Divergence:* Bardo teachings detail transitional visions; the Gītā compresses into
  guṇa predominance and world-attainment.

  **[Plato, Phaedo]:** Philosophical life preparing a good death resonates with dying
  in sattva.

  *Divergence:* Phaedo seeks pure soul freed from body; Krishna keeps guṇa cosmology
  and multiple postmortem tracks.'
voice_of_siva: ''
abhyasa: 'Ask once today: ''If this climate solidified, what world would it imply?''
  Let the answer sober your next indulgence of rajas or tamas.'
