sutra_id: BG_13_02
collection: Bhagavad Gita
section: chapter_13
title: This Body Is Named the Field
sanskrit: श्री भगवानुवाचइदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते।एतद्यो वेत्ति तं प्राहुः
  क्षेत्रज्ञ इति तद्विदः
transliteration: śrī bhagavānuvācaidaṃ śarīraṃ kaunteya kṣetramityabhidhīyate|etadyo
  vetti taṃ prāhuḥ kṣetrajña iti tadvidaḥ
translation: 'The Blessed Lord said: This body, O son of Kuntī, is called the field.
  The one who knows it—those who know such things call that one the knower of the
  field.'
commentary: 'Krishna’s first cut is almost blunt: the body is not the self; it is
  a field. The contested move is not body-hatred but epistemic relocation. “Field”
  implies cultivation, boundaries, seasons, and harvest—an arena of processes rather
  than an identity. To call the knower kṣetrajña is to refuse the ordinary identification
  in which pain, aging, and social role swallow the subject whole. The tradition-specific
  force of the verse is Sāṃkhya-inflected Vedānta: knowledge begins when the seer
  is named as seer. Those who “know such things” (tadvidaḥ) are not a club of metaphysicians;
  they are anyone who can sustain the distinction under pressure. Existentially, the
  teaching lands in the moment you say “I am broken” and discover that brokenness
  is occurring in the field while knowing remains available. Freedom does not wait
  for a different body; it begins when the body is correctly named. The naming is
  already a practice: each time pain or praise arrives, the word “field” keeps the
  knower from drowning in the event’s story.


  Key Terms:


  **śarīra (शरीर)** — “that which wastes away / is supported” -> the living body as
  field -> “body” alone misses the implication of composite, decaying process.

  **kṣetra (क्षेत्र)** — field as cultivated terrain -> body as knowable process-space
  -> medical “body” language misses the contemplative agrarian image.

  **vetti (वेत्ति)** — “knows / discerns” from vid -> knowing as discriminative recognition
  of the field -> “understands” can sound merely conceptual.

  **kṣetrajña (क्षेत्रज्ञ)** — knower-of-field -> the cognizing principle relative
  to embodiment -> “soul” smuggles substance where the verse offers a relational title.


  Cross-Tradition Resonances:


  **[Chāndogya Upaniṣad VIII.1]:** The body as a city of Brahman parallels the body
  as field known by a subtler resident-knower.

  *Divergence:* Chāndogya emphasizes the lotus of the heart as inner palace; Krishna’s
  first move is colder and more analytical: rename the body as field.

  **[Marcus Aurelius, Meditations II.17]:** Stoic separation of body-events from the
  ruling faculty mirrors field vs knower.

  *Divergence:* Stoicism trains assent within a providential cosmos; the Gītā will
  soon identify the knower with the Lord in all fields.

  **[Dōgen, Genjōkōan]:** Studying the self by studying what appears and what studies
  appearance resonates with kṣetra/kṣetrajña.

  *Divergence:* Dōgen dissolves study into non-dual practice-realization; Krishna
  keeps the distinction pedagogically sharp before non-dual climax.'
voice_of_siva: ''
abhyasa: 'Place a hand on your chest. Silently say: “This is the field.” Then notice
  the knowing that hears the sentence. Hold both for ten breaths without merging them.'
