sutra_id: BG_02_16
collection: Bhagavad Gita
section: chapter_02
title: Of the Unreal There Is No Being; of the Real, No Non-Being
sanskrit: 'नासतो विद्यते भावो नाभावो विद्यते सतः।


  उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः'
transliteration: 'nāsato vidyate bhāvo nābhāvo vidyate sataḥ|


  ubhayorapi dṛṣṭo''ntastvanayostattvadarśibhiḥ'
translation: “Of the unreal there is no being; of the real there is no non-being.
  The conclusion of both has been seen by the seers of thatness.”
commentary: 'This is the metaphysical axiom of the chapter. *Asat* has no *bhāva*;
  *sat* has no *abhāva*. The contested move is ontological sorting: what truly is
  cannot cease; what merely appears cannot claim being. *Tattva-darśin* — seers of
  thatness — have seen the *anta*, the decisive end/settlement of both. Applied to
  Arjuna’s grief, bodies and roles participate in the asat’s flux; the Self as sat
  is not killable. Existentially, the verse demands a ruthless inventory: what in
  your panic is asat wearing the mask of absolute stakes? Seeing that is not coldness;
  it is the beginning of freedom from false emergencies.


  Sat/asat sorting is the chapter’s knife. Use it on your emergencies: which stakes
  are Real, which are vivid asat? Grief that treats the perishable as absolute will
  mis-teach every duty that follows.


  Seers of thatness are not collectors of opinions about sat and asat; they have settled
  the issue in seeing. Aim for settlement, not for a more sophisticated panic.


  Key Terms:


  **sat / asat (सत् / असत्)** — real/existent vs. unreal/non-existent → ontological
  polarity grounding grief-critique → “true/false” is propositional; here the issue
  is modes of being.


  **bhāva / abhāva (भाव / अभाव)** — being / non-being → presence vs. absence as metaphysical
  statuses → “existence/nonexistence” is approximate.


  **tattva-darśin (तत्त्वदर्शिन्)** — seer of thatness/principle → one who sees the
  essence-settlement of sat/asat → “philosopher” is too broad and secular.


  Cross-Tradition Resonances:


  **Parmenides, On Nature (fr. 2–8):** Both deny that what-is can not-be, and that
  what-is-not can be.

  *Divergence:* Parmenides freezes a monistic “is”; the Gītā uses the axiom to free
  action amid embodied change.


  **Chāndogya Upaniṣad VI.2:** Both reject production of being from non-being as ultimate
  account.

  *Divergence:* Chāndogya unfolds sat as creative “may I be many”; here sat underwrites
  the deathless Self in war counsel.'
voice_of_siva: ''
abhyasa: Divide a current fear into “what can cease” and “what cannot cease.” Act
  only after naming which side your panic has confused.
