collection: Bhagavad Gita
section: chapter_13
title: The Witness, the Permitter, the Great Lord
sanskrit: 'पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान्।कारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु

  उपद्रष्टाऽनुमन्ता च भर्ता भोक्ता महेश्वरः।


  परमात्मेति चाप्युक्तो देहेऽस्मिन्पुरुषः परः

  य एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह।


  सर्वथा वर्तमानोऽपि न स भूयोऽभिजायते'
transliteration: 'puruṣaḥ prakṛtistho hi bhuṅkte prakṛtijānguṇān|kāraṇaṃ guṇasaṅgo''sya
  sadasadyonijanmasu

  upadraṣṭā''numantā ca bhartā bhoktā maheśvaraḥ|


  paramātmeti cāpyukto dehe''sminpuruṣaḥ paraḥ

  ya evaṃ vetti puruṣaṃ prakṛtiṃ ca guṇaiḥ saha|


  sarvathā vartamāno''pi na sa bhūyo''bhijāyate'
translation: The person, seated in nature, indeed enjoys the guṇas born of nature.
  Attachment to the guṇas is the cause of his birth in good and evil wombs. The witness
  [upadraṣṭā], the permitter [anumantā], the supporter, the experiencer, the great
  Lord, and also called the supreme Self—thus is the highest person in this body.
  The one who thus knows the person and nature together with the guṇas is not born
  again, however he may live and act.
commentary: 'Bondage’s mechanism is named with precision: not the guṇas themselves,
  but guṇa-saṅga—attachment to them—causes rebirth across good and evil wombs. Then
  the chapter’s most compressed theology of immanence: in this very body the highest
  person is upadraṣṭā (over-seer), anumantā (one who permits), supporter, experiencer,
  Maheśvara, Paramātman. The contested move is to refuse a merely passive witness.
  The Self sees, allows, bears, tastes, and lords—without being reduced to the field’s
  turbulence. Knowing this—person, nature, and guṇas together—ends rebirth even while
  life continues in every way (sarvathā vartamānaḥ). Existentially, release is not
  behavioral disappearance; it is the end of misidentification while action continues.
  The titles upadraṣṭā and anumantā keep witnessing from becoming dissociation: the
  Self is intimate, permitting, and sovereign—not checked out. Read as existential
  demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine. Read as existential demand, the verse asks for a changed
  stance in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **guṇa-saṅga (गुणसङ्ग)** — attachment to the strands -> the binding glue to prakṛti’s
  modes -> “liking qualities” understates karmic causality.

  **upadraṣṭā (उपद्रष्टा)** — over-seer / witness nearby -> intimate witnessing presence
  -> “observer” can sound clinical and detached.

  **anumantā (अनुमन्ता)** — permitter / consenter -> the one who allows processes
  to run -> “approver” wrongly moralizes permission.

  **Maheśvara (महेश्वर)** — great Lord -> sovereign of the embodied field -> “God”
  without this embodied title loses the verse’s shock.

  **Paramātman (परमात्मन्)** — supreme Self -> the highest person in the body -> “oversoul”
  can float outside incarnation.


  Cross-Tradition Resonances:


  **[Kaṭha Upaniṣad I.3.3–4]:** The Self as rider/lord of the bodily chariot parallels
  the highest person in the body.

  *Divergence:* Kaṭha stresses yogic restraint of reins; here the titles emphasize
  witnessing, permitting, and lordship as already present.

  **[Spanda tradition / Śiva as witness-agent]:** The Lord as both cognizer and dynamic
  allowability resonates with upadraṣṭā-anumantā.

  *Divergence:* Kashmir Shaivism radicalizes world as Śiva’s vibration; the Gītā keeps
  prakṛti-guṇa analysis as the pedagogical frame.

  **[Boethius, Consolation of Philosophy V]:** Providence as seeing and ordering parallels
  witness-permitter.

  *Divergence:* Boethius works a Christian-Platonic providence; Krishna names the
  Lord as tasting and supporting within the body.'
