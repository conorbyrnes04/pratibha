sutra_id: BG_14_05
collection: Bhagavad Gita
section: chapter_14
title: The Guṇas Bind the Embodied
sanskrit: सत्त्वं रजस्तम इति गुणाः प्रकृतिसंभवाः।निबध्नन्ति महाबाहो देहे देहिनमव्ययम्
transliteration: sattvaṃ rajastama iti guṇāḥ prakṛtisaṃbhavāḥ|nibadhnanti mahābāho
  dehe dehinamavyayam
translation: Sattva, rajas, and tamas—the guṇas born of nature—bind the imperishable
  embodied one to the body, O mighty-armed.
commentary: 'Here the chapter’s engine starts: the three guṇas, born of prakṛti, bind
  the imperishable embodied one (dehin) to the body. The contested claim is that what
  is avyaya—undecaying—can still be bound. Bondage is not damage to the Self’s essence;
  it is constraint of the embodied through qualitative modes. Sattva, rajas, and tamas
  are not moral teams first; they are ontological straps. This is why moralism alone
  fails: you can “be good” in a sattvic way and remain tightly bound. The Gītā’s psychology
  is cosmological; your moods are not merely private weather but expressions of prakṛti’s
  strands. Existentially, this explains why insight alone does not free: the straps
  are affective-behavioral climates, not mere opinions. The dehin remains imperishable
  while living as if perishable under guṇa-bondage. Freedom begins when binding is
  correctly named as binding, not as identity. Naming the straps correctly is already
  a sattvic act—so long as one does not cling to the naming as a new identity.


  Key Terms:


  **guṇa (गुण)** — strand / quality -> constitutive mode of prakṛti that binds ->
  ''quality'' as adjective misses binding force.

  **nibadhnanti (निबध्नन्ति)** — they bind -> active fastening of the embodied to
  body -> ''influence'' softens captivity.

  **dehin (देहिन्)** — embodied one -> the one possessing a body, imperishable yet
  bindable -> ''soul'' can float free of embodiment.

  **avyaya (अव्यय)** — imperishable -> undecaying subject of bondage -> ''eternal
  soul'' can sound immune in the wrong way.


  Cross-Tradition Resonances:


  **[Sāṃkhya Kārikā 12–14]:** Tripartite guṇa theory is the direct structural ancestor.

  *Divergence:* Classical Sāṃkhya aims at puruṣa’s isolation; the Gītā will teach
  transcendence into divine being through non-attachment and bhakti.

  **[Aristotle, Nicomachean Ethics on hexeis]:** Enduring dispositions shaping action
  parallel guṇa climates.

  *Divergence:* Aristotelian ethics seeks virtuous mean; guṇas are cosmological binders
  before they are character styles.'
voice_of_siva: ''
abhyasa: 'For one day, when you feel ''stuck,'' ask: ''Which climate is binding me—clarity-attachment,
  restless drive, or dull concealment?'' Name it without fixing it yet.'
