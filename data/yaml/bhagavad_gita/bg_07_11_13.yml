sutra_id: BG_07_11_13
collection: Bhagavad Gita
section: chapter_07
title: Strength Without Lust, Desire Without Adharma
sanskrit: 'बलं बलवतां चाहं कामरागविवर्जितम्।


  धर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ


  ये चैव सात्त्विका भावा राजसास्तामसाश्च ये।


  मत्त एवेति तान्विद्धि नत्वहं तेषु ते मयि


  त्रिभिर्गुणमयैर्भावैरेभिः सर्वमिदं जगत्।


  मोहितं नाभिजानाति मामेभ्यः परमव्ययम्'
transliteration: 'balaṃ balavatāṃ cāhaṃ kāmarāgavivarjitam|


  dharmāviruddho bhūteṣu kāmo''smi bharatarṣabha


  ye caiva sāttvikā bhāvā rājasāstāmasāśca ye|


  matta eveti tānviddhi natvahaṃ teṣu te mayi


  tribhirguṇamayairbhāvairebhiḥ sarvamidaṃ jagat|


  mohitaṃ nābhijānāti māmebhyaḥ paramavyayam'
translation: I am the strength of the strong, free from desire and attachment [*kāma-rāga*];
  among beings I am desire not opposed to dharma, O Best of the Bharatas. Know that
  whatever states are sattvic, rajasic, or tamasic proceed from Me alone — yet I am
  not in them; they are in Me. Deluded by these three guṇa-made states, this whole
  world does not recognize Me, who am beyond them and imperishable [*avyaya*].
commentary: 'Power and desire are not banned from the sacred; they are purified by
  relation to dharma and detached from compulsive craving. The contested move is the
  asymmetric ontology of 7.12: qualities come *from* Me, rest *in* Me, but I am not
  confined *in* them. Immanence without encapsulation. Guṇa-delusion then explains
  atheism of perception: the world sees moods, drives, and inertias and mistakes the
  display for the whole. Existentially this gives a precise diagnosis of spiritual
  fog — not "I lack information about God" but "I am hypnotized by my current guṇa-weather."
  Strength without *kāma-rāga* and desire without *adharma* become ethical tests for
  whether force and wanting still disclose the Lord or only the ego''s weather system.
  The line "I am not in them; they are in Me" is the chapter''s metaphysical hinge
  for ethics. If guṇa-states contained God as a trapped resident, mood would equal
  revelation. Because they rest in God without enclosing God, weather can be witnessed
  without worshipping weather. Desire-not-opposed-to-dharma then becomes a practical
  filter: wanting that clarifies duty can be divine; wanting that bends duty cannot
  borrow the Lord''s name. Live one decision under that filter and the verse stops
  being cosmology alone.


  Key Terms:


  **kāma (काम)** — desire/wish -> here both the rejected lust-attachment and the affirmed
  dharma-aligned desire -> flat "desire is bad" destroys the verse''s discrimination.


  **guṇa (गुण)** — strand/quality (sattva, rajas, tamas) -> the deluding modes of
  nature''s display -> "quality" as adjective misses cosmological psychology.


  **avyaya (अव्यय)** — imperishable, non-expendable -> the Lord beyond guṇa-states
  -> "eternal" misses the sense of not being used up by manifestation.


  Cross-Tradition Resonances:


  **Stoic doctrine of preferred indifferents (Epictetus, Discourses):** Both allow
  natural impulses when they do not violate right relation.

  *Divergence:* Stoicism centers *prohairesis*; Gītā centers the Lord''s asymmetrical
  relation to the guṇas.


  **Laozi on soft power / non-contention:** Both critique brute strength as spiritual
  measure.

  *Divergence:* Daoist soft power is impersonal efficacy; Gītā names strength *as*
  the Lord when free of *kāma-rāga*.'
voice_of_siva: ''
abhyasa: 'Before one act of force today (speech, decision, physical effort), ask:
  "Is this strength free of craving to dominate?" If not, reduce the force by half
  and redo the act.'
