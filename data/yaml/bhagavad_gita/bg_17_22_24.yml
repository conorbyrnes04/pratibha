collection: Bhagavad Gita
section: chapter_17
title: Tamasic Giving and the OM TAT SAT Seal
sanskrit: 'अदेशकाले यद्दानमपात्रेभ्यश्च दीयते।असत्कृतमवज्ञातं तत्तामसमुदाहृतम्

  तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः।ब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः
  पुरा

  तस्मादोमित्युदाहृत्य यज्ञदानतपःक्रियाः।प्रवर्तन्ते विधानोक्ताः सततं ब्रह्मवादिनाम्'
transliteration: 'adeśakāle yaddānamapātrebhyaśca dīyate|asatkṛtamavajñātaṃ tattāmasamudāhṛtam

  tatsaditi nirdeśo brahmaṇastrividhaḥ smṛtaḥ|brāhmaṇāstena vedāśca yajñāśca vihitāḥ
  purā

  tasmādomityudāhṛtya yajñadānatapaḥkriyāḥ|pravartante vidhānoktāḥ satataṃ brahmavādinām'
translation: Giving given at the wrong place and time to unworthy recipients, without
  respect or with contempt, is declared tamasic. OM TAT SAT—this is declared the threefold
  designation of Brahman; by that the brāhmaṇas, the Vedas, and sacrifices were ordained
  of old. Therefore, uttering OM, acts of sacrifice, gift, and austerity enjoined
  by ordinance always proceed for the knowers of Brahman.
commentary: 'Tamasic dāna completes the dark map: wrong place-time, wrong recipients,
  disrespect, contempt. Then the chapter lifts into mantra-theology: OM TAT SAT as
  threefold nirdeśa of Brahman, ordaining priests, Vedas, sacrifices. Acts of yajña-dāna-tapas
  proceed with OM for brahmavādins. The contested hinge is that after guṇa-analysis
  of practice, the text seals practice in Brahman’s name. Existentially, contemptuous
  giving is not “still good because charity”; it is tamasic. And worthy practice seeks
  the OM-seal—acted as Brahman-oriented, not ego-oriented. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum
  label on a doctrine. The existential stake is that this teaching must change how
  you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **apātra (अपात्र)** — unworthy recipient -> tamasic giving target -> ''judgy charity''
  can itself become tamasic if contemptuous.

  **avajñāta (अवज्ञात)** — given with contempt -> tone that tamasifies dāna -> ''helping
  from above'' is the social form.

  **OM TAT SAT (ॐ तत्सत्)** — threefold designation of Brahman -> seal of sacred action
  -> ''slogan'' empties it.

  **brahmavādin (ब्रह्मवादिन्)** — speaker/knower of Brahman -> those whose rites
  proceed with OM -> ''theologian'' is too academic.


  Cross-Tradition Resonances:


  **[Chāndogya on OM]:** OM as essence launching sacred action is homologous.

  *Divergence:* Here OM joins TAT SAT as Brahman’s threefold designation for rites.

  **[Biblical ''in the name of'']:** Sealing acts in the divine name resonates.

  *Divergence:* Specific names differ; the structure is action under divine designation.

  **[Mīmāṃsā / Vedic ordination of sacrifice]:** Old ordination of Vedas and yajña
  resonates.

  *Divergence:* The Gītā inserts guṇa critique before re-sealing rite in Brahman.'
voice_of_siva: ''
abhyasa: 'Before one good act today, silently seal it: ''OM—into Brahman, not into
  my image.'' Then act.'
