sutra_id: BG_06_26
collection: Bhagavad Gita
section: chapter_06
title: Wherever the Mind Runs, Bring It Back
sanskrit: 'यतो यतो निश्चरति मनश्चञ्चलमस्थिरम्।


  ततस्ततो नियम्यैतदात्मन्येव वशं नयेत्'
transliteration: 'yato yato niścarati manaścañcalamasthiram|


  tatastato niyamyaitadātmanyeva vaśaṃ nayet'
translation: Wherever, wherever the restless, unsteady mind goes forth — from there,
  from there restrain it and lead it to control in the Self alone.
commentary: 'The verse assumes wandering rather than forbidding it by fantasy. Yato
  yato … tatas tataḥ: each exit is a handle for return. The contested gentleness-within-firmness
  is that cañcala-asthira mind is trained by repeated niyama and vaśa-nayana into
  ātman, not by one annihilating stroke. In practical dhyāna this is the basic loop
  of yoga. Existentially, shame at distraction is mostly ego; the work is return.
  Every outgoing is usable. Bring it back to Self-control again. Wandering is assumed;
  each outgoing is a handle. Shame at distraction mostly serves ego, while the work
  is return — restrain and lead into Self-control again and again. This loop is dhyāna’s
  ordinary holiness. Success is counted in returns, not in unbroken fantasy stillness.
  Bring it back from wherever it went; the map is made of those wherevers. The contested
  force of the passage remains practical: it asks for a change in how you inhabit
  action, attention, and relation — not for ornamental agreement. Return to the line
  until the claim bites a live decision today.


  Key Terms:


  **cañcala (चञ्चल)** — restless/flickering -> mind’s native mobility -> normalized
  as the field of training


  **vaśaṃ nayet (वशं नयेत्)** — should lead to control -> active shepherding into
  ātman -> agency in the return


  Cross-Tradition Resonances:


  **Patañjali’s abhyāsa definition (YS 1.13–14):** Structural homology in repeated
  practice stabilizing wandering citta.

  *Divergence:* Patañjali pairs abhyāsa with vairāgya systematically; this verse isolates
  the return loop to ātman.


  **Christian monologistic prayer / returning to the word:** Structural homology in
  non-dramatic return from distraction.

  *Divergence:* Return is to a prayer-word/Name; here return is into ātman’s control.'
voice_of_siva: ''
abhyasa: In sitting, each time mind leaves, mark “there,” restrain without insult,
  and lead attention into Self — count twenty returns as success, not failure.
