sutra_id: BG_03_23_25
collection: Bhagavad Gita
section: chapter_03
title: If the Lord Stopped, Worlds Would Sink
sanskrit: 'यदि ह्यहं न वर्तेयं जातु कर्मण्यतन्द्रितः।


  मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः


  उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम्।


  सङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः


  सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत।


  कुर्याद्विद्वांस्तथासक्तश्िचकीर्षुर्लोकसंग्रहम्'
transliteration: 'yadi hyahaṃ na varteyaṃ jātu karmaṇyatandritaḥ|


  mama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ


  utsīdeyurime lokā na kuryāṃ karma cedaham|


  saṅkarasya ca kartā syāmupahanyāmimāḥ prajāḥ


  saktāḥ karmaṇyavidvāṃso yathā kurvanti bhārata|


  kuryādvidvāṃstathāsaktaśicakīrṣurlokasaṃgraham'
translation: If I ever did not continue in action, untiring, humans would follow my
  path on every side, Pārtha. These worlds would sink if I did not do action; I would
  become the maker of confusion [saṅkara] and would destroy these creatures. As the
  unwise, attached to action, perform, Bhārata, so the wise should perform, unattached,
  desiring to hold the world together.
commentary: 'Divine non-action would not be a private mystical option; it would be
  cosmically contagious, because humans imitate the Lord’s path. The contested claim
  is that wisdom’s unattachment must look, outwardly, as energetic as ignorance’s
  attachment — same intensity of deed, opposite interior claim. Otherwise lokasaṅgraha
  fails and social-cosmic confusion (saṅkara) spreads. In the Gītā’s theism, God’s
  tireless karma is the archetype of responsible freedom. Existentially, this forbids
  using “I’m beyond it” as aesthetic withdrawal while dependents still need the form
  of engagement. The wise do not spare themselves from action; they spare themselves
  from attachment inside action. The difference is invisible to a crude spectator
  and decisive for the world’s holding. The wise therefore cannot spare themselves
  a lighter schedule as a badge of realization. They may need to match the outer vigor
  of the attached while differing totally in claim. This is spiritually expensive,
  because spectators cannot see the difference and will misread your energy as ordinary
  ambition. Krishna accepts that misreading for the sake of the worlds’ holding. Saṅkara
  is what spreads when exemplary action goes missing — a confusion of orders more
  destructive than honest attached labor.


  Key Terms:


  **saṅkara (सङ्कर)** — mixing/confusion -> collapse of ordered distinctions and roles
  when exemplary action fails -> not mere diversity; destructive disorder of dharma’s
  forms


  **avidvāṃsaḥ / vidvān (अविद्वांसः / विद्वान्)** — unwise / wise -> distinguished
  by attachment vs non-attachment in identical fields of work -> intelligence is measured
  by how one owns action, not by quitting it


  **atandrita (अतन्द्रित)** — untiring -> the Lord’s mode of continuing in karma ->
  models stamina without neediness


  Cross-Tradition Resonances:


  **Plato, Republic (philosopher’s return to the cave):** Structural homology in the
  completed knower’s obligation to remain engaged for the city’s sake.

  *Divergence:* Plato’s return is political-educational under the Form of the Good;
  Krishna’s engagement is theomorphic and aimed at preventing saṅkara in the three
  worlds.


  **Pure Land / bodhisattva “never abandoning beings”:** Structural homology in refusing
  private nirvāṇa aesthetics that abandon the field.

  *Divergence:* Those vows are explicitly universal-salvific across beings; here the
  hinge is imitation of divine action plus lokasaṅgraha within dharma order.'
voice_of_siva: ''
abhyasa: Match the energy you once spent on an attached project, but redirect it today
  into a needed task while silently dropping the sentence “this will complete me.”
