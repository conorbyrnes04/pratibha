sutra_id: BG_06_21_23
collection: Bhagavad Gita
section: chapter_06
title: Infinite Happiness Beyond the Senses
sanskrit: 'सुखमात्यन्तिकं यत्तद्बुद्धिग्राह्यमतीन्द्रियम्।


  वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः


  यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः।


  यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते


  तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम्।


  स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा'
transliteration: 'sukhamātyantikaṃ yattadbuddhigrāhyamatīndriyam|


  vetti yatra na caivāyaṃ sthitaścalati tattvataḥ


  yaṃ labdhvā cāparaṃ lābhaṃ manyate nādhikaṃ tataḥ|


  yasminsthito na duḥkhena guruṇāpi vicālyate


  taṃ vidyād duḥkhasaṃyogaviyogaṃ yogasaṃjñitam|


  sa niścayena yoktavyo yogo''nirviṇṇacetasā'
translation: That ultimate happiness, graspable by understanding, beyond the senses
  — where one knows it and, established, does not waver from the real. Having gained
  which, one thinks no other gain greater; established in which, one is not moved
  even by heavy sorrow. Know that as the disjunction from conjunction with pain —
  named yoga. That yoga must be practiced with determination, with a mind that does
  not despair.
commentary: 'Yoga is defined as duḥkha-saṃyoga-viyoga — disentangling from pain’s
  conjunction — and identified with ātyantika sukha that is buddhi-grāhya and atīndriya.
  The contested marks are stability in tattva, unsurpassable gain-evaluation, and
  unshakeability even under guru duḥkha. Then the method seal: practice with niścaya
  and anirviṇṇa-cetas — determined, non-despairing mind. In soteriological psychology
  this blocks both sensory happiness chasing and fragile enthusiasm. Existentially,
  if heavy sorrow still defines you absolutely, you have not yet stood in that yoga;
  if despair ends practice, you have mistaken intensity for determination. Keep yoking
  without theatrical hope or theatrical quit. Yoga as disentangling from pain-conjunction
  is also ultimate happiness known by buddhi beyond senses — positive and negative
  faces of one attainment. Unshakeability under heavy sorrow and refusal of greater-gain
  thinking are marks, not slogans. Practice then requires determination with undespairing
  mind, blocking both fragile enthusiasm and bitter quit. Keep yoking when sorrow
  is heavy. The definition stands only where standing does not waver.


  Key Terms:


  **ātyantika sukha (आत्यन्तिक सुख)** — ultimate/endless happiness -> buddhi-known,
  sense-transcending -> the positive face of yoga’s definition


  **duḥkhasaṃyogaviyoga (दुःखसंयोगवियोग)** — disjunction from pain-conjunction ->
  technical definition of yoga here -> yoga as unbinding from suffering’s grip


  **anirviṇṇacetas (अनिर्विण्णचेतस्)** — undespairing mind -> affective condition
  of practice -> endurance without bitterness


  Cross-Tradition Resonances:


  **Buddha’s Third Noble Truth:** Structural homology in defining the goal as cessation/disjunction
  from suffering’s link.

  *Divergence:* Buddhist nirodha is framed without ātman-sukha doctrine; here yoga
  is also ultimate happiness known by buddhi.


  **Boethius on happiness unshaken by fortune:** Structural homology in a good not
  surpassed and not overthrown by sorrow.

  *Divergence:* Boethius’ Consolation is philosophical-theistic in a Roman key; the
  Gītā commands determined yogic practice toward that standing.'
voice_of_siva: ''
abhyasa: When practice feels fruitless, renew determination without despair for one
  more measured sit; afterward, ask whether any quieter buddhi-happiness appeared
  beyond sense reward.
