sutra_id: BG_03_26
collection: Bhagavad Gita
section: chapter_03
title: Do Not Shatter the Unwise Mind
sanskrit: 'न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम्।


  जोषयेत्सर्वकर्माणि विद्वान् युक्तः समाचरन्'
transliteration: 'na buddhibhedaṃ janayedajñānāṃ karmasaṅginām|


  joṣayetsarvakarmāṇi vidvān yuktaḥ samācaran'
translation: Let the wise not generate a split in understanding [buddhibheda] among
  the unknowing who are attached to action; delighting them in all actions, the knowing
  one, integrated [yukta], should perform them.
commentary: 'Spiritual insight becomes violence when it is used to break the working
  faith of those still bound to action’s surface. The contested move is pastoral:
  the wise must not create buddhibheda — a fracture of resolve — in karma-attached
  beginners. Instead, by performing actions in an integrated way, the wise make action
  delightful and sustainable for others. In the Gītā’s ethics of teaching, truth without
  timing is harm. Existentially, this warns the newly “clarified” against evangelizing
  detachment as contempt for work. If your realization makes others ashamed to do
  what still holds their life together, you have mistaken superiority for wisdom.
  The yukta teaches by contagious right performance, not by dismantling fragile buddhi.
  Teaching becomes a form of ahimsa when it refuses to break the buddhi that still
  needs work as its scaffold. The integrated wise person therefore practices contagious
  right action: performing in such a way that others can love their tasks without
  shame. Contemptuous detachment preached at the wrong time is not clarity; it is
  buddhibheda. If your insight cannot yet be embodied as delightful shared work, keep
  it quiet and let your hands teach first.


  Key Terms:


  **buddhibheda (बुद्धिभेद)** — split/fracture of understanding -> demoralizing division
  introduced into another’s discriminative resolve -> “confusing people” understates
  the ethical wound to their capacity to act


  **joṣayet (जोषयेत्)** — should cause to delight/approve -> fostering joyful participation
  in actions -> pedagogy as attraction, not scolding


  **yukta (युक्त)** — yoked/integrated -> the wise person’s composed alignment while
  acting -> the condition that makes exemplary action trustworthy


  Cross-Tradition Resonances:


  **Paul, Romans 14:** Structural homology in refusing to destroy another’s standing
  by exercising one’s own liberty as a stumbling block.

  *Divergence:* Pauline concern centers ritual-food conscience in Christ; the Gītā
  centers karma-attachment and the social holding of action.


  **Confucius, Analects 11.21:** Structural homology in answering differently according
  to the student’s condition rather than broadcasting one absolute.

  *Divergence:* Confucian differentiation is pedagogical timing within ren-li; Krishna
  forbids specifically the fracture of work-oriented buddhi.'
voice_of_siva: ''
abhyasa: If you hold a “higher” view of work today, keep it inward; outwardly join
  one shared task in a way that strengthens another person’s willingness to continue.
