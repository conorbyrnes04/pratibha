sutra_id: BG_08_01_03
collection: Bhagavad Gita
section: chapter_08
title: The Catechism of Departure
sanskrit: 'अर्जुन उवाच


  किं तद्ब्रह्म किमध्यात्मं किं कर्म पुरुषोत्तम।


  अधिभूतं च किं प्रोक्तमधिदैवं किमुच्यते


  अधियज्ञः कथं कोऽत्र देहेऽस्मिन्मधुसूदन।


  प्रयाणकाले च कथं ज्ञेयोऽसि नियतात्मभिः


  श्री भगवानुवाच


  अक्षरं ब्रह्म परमं स्वभावोऽध्यात्ममुच्यते।


  भूतभावोद्भवकरो विसर्गः कर्मसंज्ञितः'
transliteration: 'arjuna uvāca


  kiṃ tadbrahma kimadhyātmaṃ kiṃ karma puruṣottama|


  adhibhūtaṃ ca kiṃ proktamadhidaivaṃ kimucyate


  adhiyajñaḥ kathaṃ ko''tra dehe''sminmadhusūdana|


  prayāṇakāle ca kathaṃ jñeyo''si niyatātmabhiḥ


  śrī bhagavānuvāca


  akṣaraṃ brahma paramaṃ svabhāvo''dhyātmamucyate|


  bhūtabhāvodbhavakaro visargaḥ karmasaṃjñitaḥ'
translation: 'Arjuna said: What is that Brahman? What is adhyātma? What is karma,
  O Puruṣottama? What is declared as adhibhūta, and what is called adhidaiva? How
  and who is adhiyajña here in this body, O Madhusūdana — and at the hour of departure,
  how are You known by those whose self is restrained?


  The Blessed Lord said: The imperishable [akṣara] is Brahman, the supreme; own-being
  [svabhāva] is called adhyātma; the emission [visarga] that causes beings'' states
  to arise is named karma.'
commentary: 'Arjuna''s questions are not academic taxonomy; they are a death-ready
  catechism. The contested move is to demand that metaphysics, inwardness, action,
  cosmos, deity, and sacrifice all become answerable together, and then to press the
  question that tests them: how is the Lord known at prayāṇa-kāla by a restrained
  self. Kṛṣṇa begins with three definitions that refuse modern splits: Brahman as
  supreme akṣara, adhyātma as svabhāva (own-being, not a mood), and karma as generative
  visarga — action as world-emitting, not mere moral bookkeeping. Existentially this
  resets study: if spiritual knowledge cannot survive the question of dying, it is
  not yet the knowledge this chapter is about. The dialogue frame matters: Arjuna
  asks as one who may die in battle tomorrow; the definitions are already pastoral.
  Knowing Brahman without knowing how action births states of being leaves a hole;
  knowing action without adhyātma becomes outer technique. The chapter will braid
  these registers until departure-knowing is possible. Honesty here is diagnostic:
  mark what is clear, foggy, or unlived before collecting more terms.


  Key Terms:


  **akṣara (अक्षर)** — imperishable / syllable -> Brahman as supreme imperishable
  -> "eternal" misses the later technical pair with kṣara.


  **adhyātma (अध्यात्म)** — pertaining to the self -> identified as svabhāva, own-being
  -> "spirituality" is too soft; it is a register beside adhibhūta and adhidaiva.


  **visarga (विसर्ग)** — emission/sending-forth -> karma as productive outpour that
  makes beings'' states arise -> "action" as task-list misses cosmogonic force.


  Cross-Tradition Resonances:


  **Phaedo (philosophy as practice of dying):** Both bind true knowing to readiness
  for death.

  *Divergence:* Socrates aims at Forms; Arjuna demands a theistic map across adhi-
  registers.


  **Kaṭha Upaniṣad (Naciketas on death):** Both stage ultimate teaching under death''s
  pressure.

  *Divergence:* Kaṭha centers ātman via Yama; Gītā 8 distributes questions across
  multiple registers at once.'
voice_of_siva: ''
abhyasa: 'Write Arjuna''s questions as a checklist. Beside each mark one honest word:
  "clear," "foggy," or "unlived." Do not study further until all are marked.'
