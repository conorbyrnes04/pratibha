sutra_id: BG_17_01_02
collection: Bhagavad Gita
section: chapter_17
title: Faith Has Three Climates
sanskrit: 'अर्जुन उवाचये शास्त्रविधिमुत्सृज्य यजन्ते श्रद्धयाऽन्विताः।तेषां निष्ठा
  तु का कृष्ण सत्त्वमाहो रजस्तमः

  श्री भगवानुवाचत्रिविधा भवति श्रद्धा देहिनां सा स्वभावजा।सात्त्विकी राजसी चैव तामसी
  चेति तां श्रृणु'
transliteration: 'arjuna uvācaye śāstravidhimutsṛjya yajante śraddhayā''nvitāḥ|teṣāṃ
  niṣṭhā tu kā kṛṣṇa sattvamāho rajastamaḥ

  śrī bhagavānuvācatrividhā bhavati śraddhā dehināṃ sā svabhāvajā|sāttvikī rājasī
  caiva tāmasī ceti tāṃ śrṛṇu'
translation: 'Arjuna said: Those who discard scriptural injunction yet sacrifice filled
  with faith—what is their standing, Kṛṣṇa? Sattva, or rajas, or tamas? The Blessed
  Lord said: Faith in embodied beings is threefold, born of their own nature: sattvic,
  rajasic, and also tamasic. Hear of it.'
commentary: 'Arjuna’s question is pastorally exact: what of sincere people who abandon
  śāstra yet sacrifice with śraddhā? Krishna refuses a binary of “faith good / lawlessness
  bad.” Śraddhā itself is trividhā and svabhāva-jā—threefold, born of one’s nature.
  The contested move is to subject faith to guṇa analysis. Sincerity does not automatically
  sanctify; climate colors trust. Existentially, this protects against two errors:
  condemning all extra-canonical devotion, and romanticizing intensity as truth. The
  next verses will show faith’s object and style as diagnostic of its guṇa. In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage;
  therefore the verse must be read as a demand on perception, desire, and refuge,
  not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics.


  Key Terms:


  **śraddhā (श्रद्धा)** — faith / trustful placing-of-heart -> threefold, nature-born
  -> ''belief'' as assent understates lived trust.

  **niṣṭhā (निष्ठा)** — standing / orientation -> Arjuna’s question about their stance
  -> ''denomination'' is too institutional.

  **svabhāva-jā (स्वभावजा)** — born of own nature -> faith arising from constitution
  -> ''personality preference'' shrinks ontology.

  **śāstra-vidhiṃ utsṛjya (शास्त्रविधिमुत्सृज्य)** — discarding scriptural injunction
  -> the problem-case -> ''spiritual but not religious'' is a modern echo.


  Cross-Tradition Resonances:


  **[Gītā 16.23–24]:** Śāstra as measure sets up Arjuna’s question about faithful
  discarders.

  *Divergence:* 17 opens the guṇa-internal analysis of faith itself.

  **[Luther / sola fide debates (contrast)]:** Faith’s primacy is affirmed yet here
  faith is guṇa-qualified.

  *Divergence:* Christian debates differ; Krishna will not treat all śraddhā as equal.

  **[William James on varieties of religious experience]:** Varieties of faith-temperament
  resonate loosely.

  *Divergence:* James is psychological-pragmatic; the Gītā maps varieties onto sattva/rajas/tamas.'
