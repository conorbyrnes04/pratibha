sutra_id: BG_05_28_29
collection: Bhagavad Gita
section: chapter_05
title: Freed Always; Knowing the Friend of All
sanskrit: 'यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः।


  विगतेच्छाभयक्रोधो यः सदा मुक्त एव सः


  भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्।


  सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति'
transliteration: 'yatendriyamanobuddhirmunirmokṣaparāyaṇaḥ|


  vigatecchābhayakrodho yaḥ sadā mukta eva saḥ


  bhoktāraṃ yajñatapasāṃ sarvalokamaheśvaram|


  suhṛdaṃ sarvabhūtānāṃ jñātvā māṃ śāntimṛcchati'
translation: With senses, mind, and understanding restrained, the sage intent on liberation
  as highest aim, from whom wish, fear, and anger have gone — that one is always liberated
  indeed. Knowing me as the enjoyer of sacrifices and austerities, the great lord
  of all worlds, the friend of all beings — one reaches peace.
commentary: 'Chapter 5 seals with a double climax: the muni whose instruments are
  restrained, aimed at mokṣa, emptied of icchā-bhaya-krodha, is sadā mukta — always
  free, not free later. Then theistic knowing: Krishna as bhoktṛ of yajña and tapas,
  maheśvara of all worlds, suhṛd of all beings — knowing him thus, one reaches śānti.
  The contested weave is crucial: impersonal brahmanirvāṇa pedagogy culminates in
  recognizing a personal friend-lord who enjoys offerings without ceasing to be friend
  of all. Existentially, freedom’s marks are affective (wish-fear-anger gone) and
  relational (knowing the Friend). Peace is not only extinguished surge; it is recognition
  of the One who receives austerity and still befriends every being. Always-free is
  present tense for the restrained sage aimed at liberation with wish-fear-anger gone
  — freedom as standing, not postponement. Peace then arrives through knowing Krishna
  as enjoyer of offerings, lord of worlds, and friend of all beings. Sovereignty and
  friendship together prevent both cold metaphysics and sentimental piety. Chapter
  5’s impersonal and personal pedagogies seal each other. Recognize the Friend who
  receives austerity without ceasing to befriend every being.


  Key Terms:


  **sadā mukta (सदा मुक्त)** — always liberated -> freedom as present standing of
  the restrained sage -> against postponed salvation fantasy


  **suhṛd (सुहृद्)** — friend/good-hearted one -> Krishna as friend of all beings
  -> softens pure sovereignty into companionship


  **bhoktṛ (भोक्तृ)** — enjoyer/consumer of offerings -> the Lord as recipient of
  yajña-tapas -> completes the sacrificial arc of chapters 3–5


  Cross-Tradition Resonances:


  **Bhakti climax after jñāna (e.g., later Gītā chapters):** Structural homology in
  knowledge ripening into personal recognition.

  *Divergence:* Here the recognition is compressed into suhṛd-maheśvara knowing as
  peace’s door at chapter’s end.


  **Jesus as lord and friend (John 15):** Structural homology in sovereignty joined
  to friendship as the relational seal of peace.

  *Divergence:* Christian friendship is covenantal in Christ; the Gītā’s suhṛd is
  enjoyer of sacrifice and lord of worlds within yoga’s mokṣa aim.'
voice_of_siva: ''
abhyasa: 'Restrain speech-driven wish, fear, and anger for one conversation; then
  recollect the Lord as friend of all beings — including your opponent — and end in
  peace without needing to win.


