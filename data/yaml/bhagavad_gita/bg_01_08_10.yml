sutra_id: BG_01_08_10
collection: Bhagavad Gita
section: chapter_01
title: Infinite Force Guarded by Bhīṣma, Sufficient Force Guarded by Bhīma
sanskrit: 'भवान्भीष्मश्च कर्णश्च कृपश्च समितिञ्जयः।


  अश्वत्थामा विकर्णश्च सौमदत्तिस्तथैव च


  अन्ये च बहवः शूरा मदर्थे त्यक्तजीविताः।


  नानाशस्त्रप्रहरणाः सर्वे युद्धविशारदाः


  अपर्याप्तं तदस्माकं बलं भीष्माभिरक्षितम्।


  पर्याप्तं त्विदमेतेषां बलं भीमाभिरक्षितम्'
transliteration: 'bhavānbhīṣmaśca karṇaśca kṛpaśca samitiñjayaḥ|


  aśvatthāmā vikarṇaśca saumadattistathaiva ca


  anye ca bahavaḥ śūrā madarthe tyaktajīvitāḥ|


  nānāśastrapraharaṇāḥ sarve yuddhaviśāradāḥ


  aparyāptaṃ tadasmākaṃ balaṃ bhīṣmābhirakṣitam|


  paryāptaṃ tvidameteṣāṃ balaṃ bhīmābhirakṣitam'
translation: “You yourself, Bhīṣma, Karṇa, and Kṛpa victorious in assemblies of battle;
  Aśvatthāman, Vikarṇa, and the son of Somadatta as well; and many other heroes who
  have relinquished life for my sake, wielding varied weapons, all skilled in war.
  That force of ours, guarded by Bhīṣma, is immeasurable; but this force of theirs,
  guarded by Bhīma, is measurable — enough.”
commentary: 'The speech climaxes in a paradox of measurement. *Aparyāpta* and *paryāpta*
  can be read as “insufficient/sufficient” or as “unlimited/limited,” and commentators
  have long heard Duryodhana’s boast cracking under its own grammar. The contested
  claim is that numerical and genealogical superiority still needs linguistic inflation
  — “immeasurable” — because confidence is not actually secure. Loyalty is described
  as lives already given up (*tyaktajīvitāḥ*), which reveals the moral price of faction:
  persons become expendable proofs of the leader’s cause. In the epic’s moral psychology,
  this is *adharma* speaking fluently. Existentially, watch how you claim “unlimited”
  resources on your side while calling the other side “enough to handle.” The verse
  exposes the arithmetic of ego: it never counts cleanly when identity is at stake.


  Read the boast aloud and you can hear the crack: immeasurable versus measurable
  is less mathematics than mood. The Mahābhārata repeatedly shows that adharma overclaims.
  Whenever your speech needs infinity to feel safe, you are already negotiating with
  doubt rather than with truth.


  Key Terms:


  **aparyāpta / paryāpta (अपर्याप्त / पर्याप्त)** — immeasurable/insufficient vs.
  measurable/sufficient → ambiguous force-assessment revealing anxiety inside boast
  → flat “inadequate/adequate” loses the double-edged Sanskrit.


  **tyaktajīvita (त्यक्तजीवित)** — life already given up → devotion framed as prior
  self-erasure for the leader → “ready to die” softens the sacrificial capture already
  claimed.


  **bala (बल)** — force/strength → military power as countable substance → “army”
  misses how strength is being metaphysically inflated.


  Cross-Tradition Resonances:


  **Herodotus, Histories VII (Xerxes’ counting of forces):** Both show imperial confidence
  performing itself through force-measurement before disaster.

  *Divergence:* Herodotus narrates historical irony across empires; here the irony
  is compressed into one speech to a teacher on dharma’s field.


  **Laozi, Dao De Jing 76:** Both contrast brittle hardness of force-boasting with
  the vulnerability of what seems strong.

  *Divergence:* Laozi teaches yielding as cosmic pattern; the Gītā will later teach
  non-possessive action, not mere softness.'
voice_of_siva: ''
abhyasa: In one current rivalry, replace “we are stronger” with a concrete inventory
  of what you actually control today — then stop the inventory when it becomes reassurance
  rather than clarity.
