sutra_id: BG_07_07
collection: Bhagavad Gita
section: chapter_07
title: Thread Through the Beads
sanskrit: 'मत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय।


  मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव'
transliteration: 'mattaḥ parataraṃ nānyatkiñcidasti dhanañjaya|


  mayi sarvamidaṃ protaṃ sūtre maṇigaṇā iva'
translation: Nothing at all exists higher than Me, O Dhanañjaya. All this is strung
  in Me like clusters of gems on a thread [*sūtra*].
commentary: 'Absolute priority is not abstract transcendence floating above the world;
  it is the thread that makes the necklace a necklace. The contested image refuses
  both pantheism (gems *are* the thread) and deism (gems unrelated to the thread).
  Beads remain distinct; without the *sūtra* they scatter into meaningless pile. "Nothing
  higher than Me" then means: no rival Absolute, no parallel ultimate principle —
  including the world itself as a competing god. Existentially, crises of meaning
  often treat events as loose beads: career, love, loss, ideology. The verse trains
  a perceptual habit: look for the continuity that holds disparate moments without
  erasing their color. Devotion here is metaphysical literacy — seeing relation without
  collapsing difference. The simile also disciplines theology: if nothing is higher
  than Kṛṣṇa, then political gods, market gods, and family gods cannot occupy the
  thread-position without idolatry. Yet beads remain beads — relationships, duties,
  and beauties keep their color. The spiritual error is either melting all beads into
  mush or treating each bead as its own Absolute. Thread-awareness is middle path
  perception: continuity without erasure, devotion without world-hatred. Ask, in conflict,
  whether you are defending a bead as if it were the thread.


  Key Terms:


  **sūtra (सूत्र)** — "thread; aphorism" -> the stringing principle of the cosmos
  in this simile -> "thread" alone misses the secondary resonance of teaching-thread:
  reality is held by a principle that can be *followed*.


  **paratara (परतर)** — comparative of *para*, "higher/beyond" -> nothing exists as
  a higher principle than Kṛṣṇa -> "superior" as moral rank misses ontological ultimacy.


  Cross-Tradition Resonances:


  **Īśā Upaniṣad 1 (*īśāvāsyam idaṃ sarvam*):** Both assert all *this* as dwelling
  in/under the Lord.

  *Divergence:* Īśā stresses renunciation-in-use; 7.7 stresses structural dependence
  via the necklace image.


  **Plotinus, Enneads V.1 (the One as source of Intellect and Soul):** Both deny any
  principle above the ultimate.

  *Divergence:* Plotinus'' One is beyond being and speech; Kṛṣṇa speaks as the thread
  while remaining personally addressable.'
voice_of_siva: ''
abhyasa: Take three unrelated events from your day and write them as beads; then name,
  in one sentence, what "thread" would have to be true for them to belong to one life
  without forcing a false story.
