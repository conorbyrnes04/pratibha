sutra_id: BG_18_56_58
collection: Bhagavad Gita
section: chapter_18
title: Take Refuge, Do All Actions, Become Mind-Mine
sanskrit: 'सर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः।मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम्

  चेतसा सर्वकर्माणि मयि संन्यस्य मत्परः।बुद्धियोगमुपाश्रित्य मच्चित्तः सततं भव

  मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि।अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि'
transliteration: 'sarvakarmāṇyapi sadā kurvāṇo madvyapāśrayaḥ|matprasādādavāpnoti
  śāśvataṃ padamavyayam

  cetasā sarvakarmāṇi mayi saṃnyasya matparaḥ|buddhiyogamupāśritya maccittaḥ satataṃ
  bhava

  maccittaḥ sarvadurgāṇi matprasādāttariṣyasi|atha cettvamahaṅkārānna śroṣyasi vinaṅkṣyasi'
translation: Even while always performing all actions, taking refuge in Me, one attains
  by My grace the eternal, imperishable station. Mentally renouncing all actions in
  Me, intent on Me, taking refuge in buddhi-yoga, be conscious of Me continually.
  Conscious of Me, you will cross all difficulties by My grace; but if from egoism
  you will not listen, you will perish.
commentary: 'The path becomes simultaneously active and surrendered: do all actions,
  take refuge, receive prasāda, attain the eternal pada. Mentally renounce actions
  into Krishna, practice buddhi-yoga, become maccitta. Grace carries across difficulties;
  egoistic non-listening leads to ruin. The contested braid is grace and discipline,
  action and mental saṃnyāsa. Existentially, “I’ll listen later” is already the ahaṅkāra
  warning. The next verses will show that even refusal is still prakṛti’s enlistment.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **madvyapāśraya (मद्व्यपाश्रय)** — taking refuge in Me -> condition while acting
  -> ''inspiration'' is thinner.

  **matprasāda (मत्प्रसाद)** — My grace/favor -> means of attaining the station and
  crossing difficulties -> ''luck'' erases relation.

  **maccitta (मच्चित्त)** — mind/heart on Me -> continual consciousness of Krishna
  -> ''thinking about religion'' understates.

  **ahaṅkārāt na śroṣyasi (अहङ्कारात् न श्रोष्यसि)** — from egoism you will not listen
  -> ruin’s cause -> ''independence'' may be its flattering name.


  Cross-Tradition Resonances:


  **[Gītā 9.22 / 9.34]:** Refuge and mind-fixed-on-Me continue.

  *Divergence:* 18.56–58 add grace-crossing and the warning of egoistic deafness.

  **[Paul on grace and working]:** Grace with ongoing action resonates cautiously.

  *Divergence:* Pauline justification debates differ; here prasāda and buddhi-yoga
  are yogic-bhakti.

  **[Augustine on grace and listening]:** Refusal to hear as ruin resonates.

  *Divergence:* Augustine’s grace is Christic; Krishna speaks as the refuge and the
  grace-giver.'
