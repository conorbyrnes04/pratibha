sutra_id: BG_11_01_03
collection: Bhagavad Gita
section: chapter_11
title: From Hearing to Wanting Vision
sanskrit: 'अर्जुन उवाच


  मदनुग्रहाय परमं गुह्यमध्यात्मसंज्ञितम्।


  यत्त्वयोक्तं वचस्तेन मोहोऽयं विगतो मम


  भवाप्ययौ हि भूतानां श्रुतौ विस्तरशो मया।


  त्वत्तः कमलपत्राक्ष माहात्म्यमपि चाव्ययम्


  एवमेतद्यथात्थ त्वमात्मानं परमेश्वर।


  द्रष्टुमिच्छामि ते रूपमैश्वरं पुरुषोत्तम'
transliteration: 'arjuna uvāca


  madanugrahāya paramaṃ guhyamadhyātmasaṃjñitam|


  yattvayoktaṃ vacastena moho''yaṃ vigato mama


  bhavāpyayau hi bhūtānāṃ śrutau vistaraśo mayā|


  tvattaḥ kamalapatrākṣa māhātmyamapi cāvyayam


  evametadyathāttha tvamātmānaṃ parameśvara|


  draṣṭumicchāmi te rūpamaiśvaraṃ puruṣottama'
translation: 'Arjuna said: By the supreme secret concerning the self, spoken in Your
  grace, this delusion of mine has gone. The arising and passing of beings I have
  heard from You in detail, O Lotus-eyed, and also Your imperishable majesty. Just
  as You have described Yourself, O Supreme Lord, I wish to see Your lordly form,
  O Highest Person.'
commentary: 'Hearing has done real work: moha is gone. Yet Arjuna asks to see — not
  from disbelief but from the logic of grace-received secret. The contested move is
  that right hearing awakens desire for darshana of aishvara rupa. Existentially this
  validates hunger for vision without scorning the prior verbal teaching. Delusion''s
  removal is not the end; it is clearance for a more dangerous seeing. Wanting to
  see the Lord as the Lord has described Himself is fidelity, not curiosity-as-entertainment.
  The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. Live one concrete implication of the claim before the day ends, so the argument
  becomes conduct rather than ornament.


  Key Terms:


  **moha (मोह)** — delusion -> what Arjuna says has departed through gracious teaching
  -> ''confusion'' understates bondage-character of moha

  **aiśvara rūpa (ऐश्वर रूप)** — lordly form -> what Arjuna wants to see -> ''majestic
  appearance'' misses sovereignty-form


  Cross-Tradition Resonances:


  **[Thomas'' desire to see (John 20)]:** Shared movement from word to wanting vision.

  *Divergence:* Resurrection verification differs; Arjuna asks after moha already
  gone.

  **[Moses asking to see glory (Exodus 33)]:** Shared request for divine self-showing
  after relationship.

  *Divergence:* Biblical glory-limits differ; Gita will grant a cosmic form through
  divine eye.'
