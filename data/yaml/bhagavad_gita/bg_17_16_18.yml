sutra_id: BG_17_16_18
collection: Bhagavad Gita
section: chapter_17
title: Mental Austerity and Its Guṇa-Colors
sanskrit: 'मनःप्रसादः सौम्यत्वं मौनमात्मविनिग्रहः।भावसंशुद्धिरित्येतत्तपो मानसमुच्यते

  श्रद्धया परया तप्तं तपस्तत्ित्रविधं नरैः।अफलाकाङ्क्षिभिर्युक्तैः सात्त्विकं परिचक्षते

  सत्कारमानपूजार्थं तपो दम्भेन चैव यत्।क्रियते तदिह प्रोक्तं राजसं चलमध्रुवम्'
transliteration: 'manaḥprasādaḥ saumyatvaṃ maunamātmavinigrahaḥ|bhāvasaṃśuddhirityetattapo
  mānasamucyate

  śraddhayā parayā taptaṃ tapastatitravidhaṃ naraiḥ|aphalākāṅkṣibhiryuktaiḥ sāttvikaṃ
  paricakṣate

  satkāramānapūjārthaṃ tapo dambhena caiva yat|kriyate tadiha proktaṃ rājasaṃ calamadhruvam'
translation: Serenity of mind, gentleness, silence, self-restraint, purification of
  disposition—these are called austerity of the mind. This threefold austerity practiced
  with highest faith by people joined to yoga, not craving fruit, is declared sattvic.
  Austerity practiced for esteem, honor, and reverence, and also with hypocrisy—said
  to be rajasic, unstable and impermanent.
commentary: 'Mind-tapas completes the triad: prasāda, gentleness, mauna, restraint,
  bhāva-purity. Then the same threefold tapas is guṇa-colored by motive. Sattvic:
  highest faith, yogic, fruit-free. Rajasic: for satkāra-māna-pūjā, and with dambha—unstable.
  The contested claim is that mental calm pursued for applause is already rajasic.
  Existentially, ask what audience lives in your head when you practice serenity.
  If an admirer is watching, the tapas is already trembling. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum
  label on a doctrine. The existential stake is that this teaching must change how
  you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **manaḥ-prasāda (मनःप्रसाद)** — clarity/serenity of mind -> mental austerity ->
  ''chill'' understates luminous gladness.

  **mauna (मौन)** — silence -> mental/verbal restraint -> ''not talking'' can be sulking
  counterfeit.

  **bhāva-saṃśuddhi (भावसंशुद्धि)** — purification of inner disposition -> deep tapas
  -> ''positive attitude'' is thin.

  **calam adhruvam (चलमध्रुवम्)** — unsteady, impermanent -> rajasic tapas fruit ->
  ''inconsistent practice'' is the surface symptom.


  Cross-Tradition Resonances:


  **[Patañjali on citta-prasādana]:** Serenity practices resonate.

  *Divergence:* Patañjali aims at samādhi; Krishna guṇa-codes tapas motives.

  **[Sermon on the Mount on secret fasting]:** Against display-austerity is strong
  homology.

  *Divergence:* Matthew emphasizes Father-secret; Krishna labels display rajasic and
  unstable.

  **[Stoic inner citadel]:** Mental austerity as sovereignty resonates loosely.

  *Divergence:* Stoicism centers rational assent; here faith-yoga and non-fruiting
  define sattvic tapas.'
