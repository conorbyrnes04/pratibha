sutra_id: BG_03_10_12
collection: Bhagavad Gita
section: chapter_03
title: The Circulation That Feeds Gods and Humans
sanskrit: 'सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः।


  अनेन प्रसविष्यध्वमेष वोऽस्त्विष्टकामधुक्


  देवान्भावयतानेन ते देवा भावयन्तु वः।


  परस्परं भावयन्तः श्रेयः परमवाप्स्यथ


  इष्टान्भोगान्हि वो देवा दास्यन्ते यज्ञभाविताः।


  तैर्दत्तानप्रदायैभ्यो यो भुङ्क्ते स्तेन एव सः'
transliteration: 'sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ|


  anena prasaviṣyadhvameṣa vo''stviṣṭakāmadhuk


  devānbhāvayatānena te devā bhāvayantu vaḥ|


  parasparaṃ bhāvayantaḥ śreyaḥ paramavāpsyatha


  iṣṭānbhogānhi vo devā dāsyante yajñabhāvitāḥ|


  tairdattānapradāyaibhyo yo bhuṅkte stena eva saḥ'
translation: 'Having created progeny together with sacrifice, Prajāpati said of old:
  By this may you bring forth; let this be for you the wish-yielding milch-cow. Foster
  the gods with this, and may those gods foster you; fostering one another, you will
  attain the highest good. The gods, fostered by sacrifice, will give you the enjoyments
  you desire; who enjoys gifts given by them without offering back to them is a thief
  indeed.'
commentary: 'Creation itself is co-born with sacrifice: beings are not first made
  and later invited into ethics; their generative condition is already reciprocal
  offering. The contested move is economic-theological: desire’s fulfillment (kāmadhuk)
  is located inside mutual fostering, not inside unilateral extraction. To eat gifts
  without return is not a minor rudeness but theft — because the goods were never
  privately originated. In the Gītā’s Vedic inheritance, gods and humans co-constitute
  flourishing through yajña; the moral charge follows the metaphysical structure.
  Existentially, the passage attacks the consumer stance that treats world, labor,
  and blessing as inventory. The highest good (śreyas) is not maximized personal yield
  but sustained mutual fostering. If you receive without returning into the circuit,
  you are not “efficient”; you are interrupting the cosmology that makes enjoyment
  possible. Reciprocity here is not sentimental niceness; it is cosmology with teeth.
  If gods and humans foster one another, then consumption without return is structural
  theft against the conditions of flourishing. Modern readers may demythologize “gods”
  into ecological and social powers, yet the moral hinge remains: enjoyment presupposes
  a circuit you did not invent. The wish-yielding cow is not infinite private supply;
  it is the generative logic of mutual fostering. To refuse the return offering is
  to live as a parasite on a gift economy while calling the parasitism success.


  Key Terms:


  **yajña (यज्ञ)** — offering that co-creates and sustains beings -> here the primordial
  companion of creation itself -> not optional piety added onto life; life’s generative
  grammar


  **bhāvayantu / bhāvayata (भावय)** — causative of bhū, “cause to be/foster” -> mutual
  bringing-into-flourishing between gods and humans -> “worship” is too cultic; the
  verb is reciprocal vitalization


  **stena (स्तेन)** — thief -> one who consumes circulating gifts as private property
  -> moral insult that reveals an ontological crime against reciprocity


  Cross-Tradition Resonances:


  **Hesiod, Works and Days (on justice and gift):** Structural homology in tying human
  flourishing to right exchange with divine and social orders.

  *Divergence:* Hesiod’s justice is framed through Zeus and agrarian measure; the
  Gītā makes sacrificial reciprocity the explicit condition of non-theft.


  **Robin Wall Kimmerer (Braiding Sweetgrass, gift economy):** Structural homology
  in receiving as obligation to return, not license to stockpile.

  *Divergence:* Kimmerer’s frame is ecological-animist reciprocity in contemporary
  idiom; the Gītā embeds reciprocity in Prajāpati’s sacrificial cosmogony and deity-human
  circuit.'
voice_of_siva: ''
abhyasa: Identify one enjoyment you received today without earning it alone (food,
  help, infrastructure); return a concrete offering into that circuit before nightfall.
