sutra_id: BG_17_28
collection: Bhagavad Gita
section: chapter_17
title: Without Faith, Asat
sanskrit: अश्रद्धया हुतं दत्तं तपस्तप्तं कृतं च यत्।असदित्युच्यते पार्थ न च तत्प्रेत्य
  नो इह
transliteration: aśraddhayā hutaṃ dattaṃ tapastaptaṃ kṛtaṃ ca yat|asadityucyate pārtha
  na ca tatpretya no iha
translation: Whatever is offered, given, or done as austerity without faith is called
  asat, O Pārtha; it is nothing after death and nothing here.
commentary: 'The chapter’s last word is severe and clarifying: without śraddhā, huta,
  datta, tapas, and kṛta are asat—unreal/not-good—and yield nothing here or hereafter.
  The contested claim returns to 17.3: the person is made of faith, so faithless practice
  is ontologically hollow. Existentially, this is not a demand for emotional hype.
  Śraddhā is trustful placement of the heart. Technique without trust becomes theater
  that cannot ripen. The guṇa analysis ends by saying: better a small act with faith
  than a splendid empty performance. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **aśraddhayā (अश्रद्धया)** — without faith -> condition that nullifies offerings
  -> ''without certainty'' is not identical.

  **asat (असत्)** — unreal / non-good -> verdict on faithless acts -> ''ineffective''
  understates ontological hollowness.

  **na pretya no iha (न प्रेत्य नो इह)** — neither after death nor here -> total non-fruition
  -> ''no vibes'' is a parody.

  **hutaṃ dattaṃ tapaḥ (हुतं दत्तं तपः)** — offered, given, austerity -> the triad
  nullified without faith -> ''spiritual activities'' as checklist fails.


  Cross-Tradition Resonances:


  **[Hebrews 11:6]:** ''Without faith it is impossible to please God'' is strong homology.

  *Divergence:* Christian faith is Christ-shaped; here śraddhā is guṇa-qualified yet
  still indispensable.

  **[Mīmāṃsā debates on ritual efficacy]:** Whether inner factors affect fruit is
  scholastic background.

  *Divergence:* The Gītā makes śraddhā decisive against asat.

  **[James 2 on dead faith (contrast/partner)]:** Faith and works co-implicate.

  *Divergence:* James attacks faith without works; 17.28 attacks works without faith—together
  a double warning.'
voice_of_siva: ''
abhyasa: 'Before your next spiritual or ethical act, locate śraddhā in the body. If
  absent, pause and recover trust before performing.'
