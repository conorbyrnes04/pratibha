sutra_id: BG_14_04
collection: Bhagavad Gita
section: chapter_14
title: Father of Forms in Every Womb
sanskrit: सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः।तासां ब्रह्म महद्योनिरहं बीजप्रदः
  पिता
transliteration: sarvayoniṣu kaunteya mūrtayaḥ sambhavanti yāḥ|tāsāṃ brahma mahadyonirahaṃ
  bījapradaḥ pitā
translation: Whatever forms are born in any womb, O son of Kuntī, the great Brahman
  is their womb, and I am the father who gives the seed.
commentary: 'The previous cosmology becomes universal law: every form, in every womb,
  has mahad-brahman as matrix and Krishna as seed-father. The contested move is to
  sacralize embodiment without romanticizing it. Birth is neither shame nor mere biology;
  it is the meeting of cosmic womb and divine seed. This undercuts both materialist
  reduction and world-rejecting spirituality. The verse also quietly universalizes
  dignity: no womb is outside this parentage, which means contempt for any form is
  a theological mistake. In classical commentary, this line anchors the Lord’s immanence
  inside prakṛti’s productivity rather than against it. Existentially, looking at
  any living form becomes a recognition scene: matrix and father are already at work.
  Ethics follows: cruelty toward bodies is hostility toward the Lord’s generative
  act. Wonder follows too: the ordinary face before you is not “just biology,” but
  a seeded form of the great womb. The parental metaphor also disciplines pride: if
  every form is womb-born and seed-given, spiritual status cannot be a private achievement
  trophy.


  Key Terms:


  **yoni (योनि)** — womb / source -> matrix of manifestation -> ''origin'' loses embodied
  specificity.

  **mūrti (मूर्ति)** — form / embodiment -> concrete appearance born of womb -> ''image''
  can sound merely representational.

  **bīja-prada pitā (बीजप्रदः पिता)** — seed-giving father -> Krishna as impregnating
  principle -> ''creator god'' flattens the parental metaphor.


  Cross-Tradition Resonances:


  **[Śvetāśvatara Upaniṣad V–VI]:** God as source of beings resonates with father-of-seed
  language.

  *Divergence:* Śvetāśvatara leans Rudra-theistic; the Gītā prepares a guṇa analysis
  of bondage within this parentage.

  **[Plato, Timaeus]:** The demiurge and receptacle parallel seed and womb functions.

  *Divergence:* Timaeus is craft-cosmology; Krishna’s parentage is intimate and immediately
  existential.'
