sutra_id: BG_01_32_34
collection: Bhagavad Gita
section: chapter_01
title: Victory Without Them Is Not Worth Wanting
sanskrit: 'न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च।


  किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा


  येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च।


  त इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च


  आचार्याः पितरः पुत्रास्तथैव च पितामहाः।


  मातुलाः श्वशुराः पौत्राः श्यालाः सम्बन्धिनस्तथा'
transliteration: 'na kāṅkṣe vijayaṃ kṛṣṇa na ca rājyaṃ sukhāni ca|


  kiṃ no rājyena govinda kiṃ bhogairjīvitena vā


  yeṣāmarthe kāṅkṣitaṃ no rājyaṃ bhogāḥ sukhāni ca|


  ta ime''vasthitā yuddhe prāṇāṃstyaktvā dhanāni ca


  ācāryāḥ pitaraḥ putrāstathaiva ca pitāmahāḥ|


  mātulāḥ śvaśurāḥ pautrāḥ śyālāḥ sambandhinastathā'
translation: '“I do not desire victory, Kṛṣṇa, nor kingdom, nor pleasures. Of what
  use is kingdom to us, Govinda — of what use enjoyments, or even life? Those for
  whose sake kingdom, enjoyments, and pleasures are desired by us — they stand here
  in battle, having renounced life and wealth: teachers, fathers, sons, and grandfathers
  as well; maternal uncles, fathers-in-law, grandsons, brothers-in-law, and other
  relations.”'
commentary: 'Arjuna discovers a teleological contradiction: the goods that justify
  war are the persons destroyed by war. Desire for *rājya* and *bhoga* collapses when
  its beneficiaries become its victims. The contested move is a radical revaluation
  of victory — not “I might lose,” but “winning would empty the meaning of winning.”
  This is not yet renunciation yoga; it is moral logic under kinship. The Gītā will
  later argue that his conclusion about inaction is incomplete, but it never treats
  this contradiction as childish. Existentially, the passage asks whether your goals
  still make sense if the people who give them worth are instrumentalized to achieve
  them. Many modern “wins” fail the same test.


  Teleology breaks when persons are both end and means. Arjuna’s logic remains a permanent
  test for politics and career alike: if the win consumes the why, it is not a win.
  The Gītā will reopen the possibility of action, but not by restoring naive appetite
  for kingdom.


  Key Terms:


  **vijaya (विजय)** — victory → success emptied of relational telos → “winning” misses
  the meaning-collapse Arjuna names.


  **bhoga (भोग)** — enjoyment/experience of pleasure → consumptive fruit of sovereignty
  → “pleasures” can sound trivial; here it is the whole sensory payoff of rule.


  **artham (अर्थम्)** — for the sake of → purposive structure of desire → “for whom”
  is correct but the philosophical point is teleology breaking.


  Cross-Tradition Resonances:


  **Aristotle, Nicomachean Ethics I (ends and subordinate goods):** Both test whether
  a pursued good remains choiceworthy when it destroys the conditions of its worth.

  *Divergence:* Aristotle argues in civic-ethical prose; Arjuna argues from grief
  on a battlefield.


  **Ecclesiastes 2:1–11:** Both find royal pleasure and achievement vain when relational
  meaning fails.

  *Divergence:* Qoheleth speaks under sunlit vanity; Arjuna speaks under imminent
  kin-slaughter and dharma crisis.'
