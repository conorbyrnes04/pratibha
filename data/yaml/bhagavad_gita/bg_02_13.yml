sutra_id: BG_02_13
collection: Bhagavad Gita
section: chapter_02
title: As Boyhood, Youth, and Age to the Embodied, So Is Attainment of Another Body
sanskrit: 'देहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा।


  तथा देहान्तरप्राप्तिर्धीरस्तत्र न मुह्यति'
transliteration: 'dehino''sminyathā dehe kaumāraṃ yauvanaṃ jarā|


  tathā dehāntaraprāptirdhīrastatra na muhyati'
translation: “Just as boyhood, youth, and old age come to the embodied one in this
  body, so does the attaining of another body; the steadfast is not deluded about
  that.”
commentary: 'Death is placed on a continuum with aging. The contested analogy: if
  you already survive childhood’s end into youth, the wise (*dhīra*) are not bewildered
  by the body’s further transition. *Dehāntara-prāpti* — attaining another body —
  is presented as structurally akin to life-stage change. This neither trivializes
  bereavement nor denies pain; it challenges the metaphysics that makes bodily end
  absolute personal end. Existentially, notice that you have already “died” to earlier
  forms of yourself without ceasing. The verse asks for the same steadiness toward
  the larger change.


  Aging already taught you transition; death asks for the same literacy at larger
  scale. The dhīra’s non-delusion is practiced long before the funeral, in every released
  childhood. Steady people are those who stopped confusing form-change with self-erasure.


  Confusion at death is often confusion rehearsed at every smaller ending. Practice
  non-delusion when a role ends, a season ends, a body-ability ends. The dhīra is
  trained in increments.


  Train non-delusion at small endings so the larger transition does not invent a false
  absolute.


  Key Terms:


  **dehin (देहिन्)** — the embodied one → conscious identity wearing a body → “soul
  in a body” can dualize too crudely; the term centers the one who *has* a body.


  **dehāntara-prāpti (देहान्तरप्राप्ति)** — attainment of another body → rebirth as
  transition analogous to aging → “reincarnation” is doctrinally thick; the verse’s
  force is analogical continuity.


  **dhīra (धीर)** — steadfast/firm-wise → one who does not fall into *moha* at transition
  → “wise man” misses the courage-steadiness in *dhī*.


  Cross-Tradition Resonances:


  **Phaedo 87b–88b (cloak/weaver analogy and its critique):** Both explore whether
  the person outlasts a particular bodily “garment.”

  *Divergence:* Plato’s dialogue problematizes the analogy carefully; Kṛṣṇa asserts
  it pedagogically to remove battlefield *moha*.


  **Zhuangzi, butterfly / skull passages:** Both relativize identity across transformations
  of form.

  *Divergence:* Zhuangzi plays with perspectival transformation; the Gītā stabilizes
  a continuing embodied Self through change.'
voice_of_siva: ''
abhyasa: Look at a photo of yourself ten years younger. Name three continuities and
  three discontinuities, then ask what “you” the *dhīra* would refuse to confuse with
  either list alone.
