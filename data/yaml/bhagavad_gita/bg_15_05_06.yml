sutra_id: BG_15_05_06
collection: Bhagavad Gita
section: chapter_15
title: The Undying Place Beyond Sun and Fire
sanskrit: 'निर्मानमोहा जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः।द्वन्द्वैर्विमुक्ताः
  सुखदुःखसंज्ञै र्गच्छन्त्यमूढाः पदमव्ययं तत्

  न तद्भासयते सूर्यो न शशाङ्को न पावकः।यद्गत्वा न निवर्तन्ते तद्धाम परमं मम'
transliteration: 'nirmānamohā jitasaṅgadoṣā adhyātmanityā vinivṛttakāmāḥ|dvandvairvimuktāḥ
  sukhaduḥkhasaṃjñai rgacchantyamūḍhāḥ padamavyayaṃ tat

  na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ|yadgatvā na nivartante taddhāma paramaṃ
  mama'
translation: Without pride and delusion, having conquered the defect of attachment,
  constantly abiding in the Self, with desires turned away, freed from dualities called
  pleasure and pain—the undeluded go to that imperishable goal. That abode of Mine
  the sun does not light, nor the moon, nor fire; having gone there, they do not return.
  That is My supreme home.
commentary: 'The path-qualifications are listed as a single compound life: free of
  pride-delusion, attachment conquered, Self-abiding, desires quieted, freed from
  pleasure-pain dualities. Then the goal is imaged as Krishna’s supreme dhāman, which
  sun, moon, and fire do not illuminate. The contested claim is that the highest abode
  is not another lit object in the cosmos; it is the lighting-source beyond cosmic
  lamps. Non-return (na nivartante) seals irreversibility. Existentially, if your
  ''spiritual goals'' still need the sun of status and the fire of intensity, you
  are still navigating branches. The supreme home is dark only to worldly lamps because
  it is too intimate to be their object. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **nir-māna-moha (निर्मानमोह)** — without pride and delusion -> purification before
  the goal -> ''humility'' alone misses moha’s cognitive fog.

  **padam avyayam (पदमव्ययम्)** — imperishable goal -> non-returning standing-place
  -> ''heaven'' may mis-locate it.

  **dhāman (धामन्)** — abode / home / light-sphere -> Krishna’s supreme dwelling ->
  ''place'' can sound spatial-external.

  **na nivartante (न निवर्तन्ते)** — they do not return -> irreversible liberation
  -> ''stay forever'' can sound touristic.


  Cross-Tradition Resonances:


  **[Śvetāśvatara / Kaṭha light verses]:** Where sun/moon/fire do not shine is classic
  Upaniṣadic homology.

  *Divergence:* The Gītā personalizes the abode as mama dhāma.

  **[Pseudo-Dionysius, divine darkness]:** Beyond cosmic lights resonates with unknowing
  luminosity.

  *Divergence:* Dionysius stresses negation; Krishna also lists ethical-yogic qualifications
  for entry.

  **[Gītā 8.21]:** Non-returning supreme abode continues earlier teaching.

  *Divergence:* Chapter 15 embeds it inside the tree-cutting sequence.'
