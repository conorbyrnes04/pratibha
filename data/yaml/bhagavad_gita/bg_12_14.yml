  Key Terms:


  **santuṣṭa (सन्तुष्ट)** — content/satisfied -> continual contentment as devotee-mark
  -> "happy" misses settled sufficiency.


  **dṛḍha-niścaya (दृढनिश्चय)** — firm resolve/certainty -> decisiveness of the dear
  devotee -> "stubborn" is the shadow; the text means non-vacillating orientation.


  **priya (प्रिय)** — dear/beloved -> the Lord''s evaluative love for the devotee
  -> "liked" is too casual for this theological endearment.


  Cross-Tradition Resonances:


  **Stoic freedom as wanting things as they happen:** Kinship with santuṣṭa.

  *Divergence:* Stoic contentment is aligned to logos; Gītā''s contentment is paired
  with offering mind-intellect to the Lord.


  **Sufi riḍā (contentment with God):** Shared contentment-as-love.

  *Divergence:* Sufi idioms of fanā differ; Gītā keeps yogin identity and firm niścaya
  explicit.'
voice_of_siva: ''
abhyasa: 'Practice one hour of santuṣṭa: do not renegotiate your life situation in
  the mind. If resolve wavers, renew the offering of mind and intellect rather than
  feeding the waver.'
