sutra_id: BG_12_14
collection: Bhagavad Gita
section: chapter_12
title: Content, Steady, Mind Offered — Dear to Me
sanskrit: सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः।मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स
  मे प्रियः
transliteration: santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ|mayyarpitamanobuddhiryo
  madbhaktaḥ sa me priyaḥ
translation: Ever content [santuṣṭa], the yogin, restrained in self, of firm determination,
  with mind and intellect offered to Me — who is My devotee, that one is dear to Me.
commentary: 'Dearness (priya) is the chapter''s evaluative key. Here it attaches to
  a cluster: continual contentment, yogic identity, self-restraint, firm resolve,
  and mind-intellect offered. The contested synthesis is affective (santuṣṭa) plus
  cognitive offering (arpita manobuddhi). Contentment without offering can be smug;
  offering without contentment can be anxious piety. Firm resolve without restraint
  becomes fanaticism; restraint without resolve becomes limp. Existentially, "Am I
  dear?" is the wrong anxious question; "Are these marks growing?" is the right one.
  Dearness is the Lord''s recognition of a pattern, not a mood you extract by flattery.
  The line-level force of the teaching is practical, not ornamental: what it claims
  about reality is meant to reshape how you attend, choose, and depart. If the claim
  does not alter rehearsal in ordinary time, it will not hold when time thins. Existential
  uptake is therefore part of fidelity to the argument, not an optional aftertaste.
