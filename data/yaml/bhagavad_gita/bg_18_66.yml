sutra_id: BG_18_66
collection: Bhagavad Gita
section: chapter_18
title: 'Abandon All Dharmas: Take Refuge in Me Alone'
sanskrit: सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि
  मा शुचः
transliteration: sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja|ahaṃ tvā sarvapāpebhyo
  mokṣayiṣyāmi mā śucaḥ
translation: Abandoning all dharmas, take refuge in Me alone. I will liberate you
  from all evils; do not grieve.
commentary: 'This is the Gītā’s razor. Sarva-dharmān parityajya māmekaṃ śaraṇaṃ vraja—having
  abandoned all dharmas, go to Me alone as refuge. Then the vow: ahaṃ tvā sarva-pāpebhyo
  mokṣayiṣyāmi—I will liberate you from all evils/sins; mā śucaḥ—do not grieve. The
  contested move is not antinomian vandalism of ethics; it is the end of salvation-by-portfolio.
  “All dharmas” includes the righteous projects by which the ego still seeks to secure
  itself—varṇa-duty as self-justification, renunciation as self-justification, even
  “Gītā practice” as self-justification. The verse does not license cruelty; it dethrones
  rival refuges. After eighteen chapters of discrimination, guṇas, svadharma, and
  tapas, Krishna says the last act is not another technique but exclusive śaraṇa.
  Theologically, agency shifts: mokṣa is promised in the first person by the Lord.
  Pastorally, the battlefield grief that opened the Gītā is addressed at the root:
  do not grieve—not because the field is unreal only, but because refuge holds. Existentially,
  find what you are still clutching as co-savior beside the Lord—your correctness,
  your wound, your role, your metaphysics—and let the verse pry it open. The fear
  that abandoning all dharmas means becoming lawless is itself often a dharma-idol’s
  voice. True refuge produces a life; it does not need a side-altar of self-rescue.
  When this verse is heard only as slogan, it becomes cheap. When heard after 18.63–65’s
  freedom, love, and vow, it becomes the end of bargaining.


  Key Terms:


  **sarva-dharmān parityajya (सर्वधर्मान्परित्यज्य)** — abandoning all dharmas ->
  dropping all rival duty-refuges -> ''be unethical'' is the catastrophic misreading.

  **mām ekam (मामेकम्)** — Me alone -> exclusivity of refuge -> ''mostly God'' fails
  eka.

  **sarva-pāpebhyaḥ (सर्वपापेभ्यः)** — from all evils/sins -> scope of promised liberation
  -> ''bad vibes'' trivializes.

  **mokṣayiṣyāmi (मोक्षयिष्यामि)** — I will liberate -> first-person future of the
  Lord -> ''you''ll get free somehow'' erases the vow.

  **mā śucaḥ (मा शुचः)** — do not grieve -> pastoral command closing Arjuna’s wound
  -> ''cheer up'' is insultingly thin.


  Cross-Tradition Resonances:


  **[Luke 15 / lost and found grace]:** Liberation from the burden of self-justifying
  righteousness resonates.

  *Divergence:* Christian grace is Christic; here exclusive refuge in Krishna is the
  liberating vow.

  **[Śaraṇāgati / prapatti traditions]:** This verse is the locus classicus of total
  surrender.

  *Divergence:* School differences on conditions remain; the textual force is eka-śaraṇa
  plus divine mokṣa-vow.

  **[Paul, Philippians 3 on counting credentials loss]:** Abandoning dharma-credentials
  for the One resonates structurally.

  *Divergence:* Paul’s Christ-gain differs; both dethrone religious self-security.

  **[Gītā 2.7 / 18.73 arc]:** From Arjuna’s helpless refuge-ask to grief’s end completes
  the pedagogy.

  *Divergence:* 2.7 asks for śiṣya-refuge; 18.66 answers with absolute śaraṇa and
  mā śucaḥ.'
voice_of_siva: ''
abhyasa: 'Write down three ''dharmas'' you use to save yourself (roles, correctness,
  practices-as-proof). Physically set the paper down and say: ''Refuge in You alone.
  Do not let me make these co-saviors.'' Sit in the fear until it softens into trust.'
