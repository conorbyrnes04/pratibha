sutra_id: BG_09_04_06
collection: Bhagavad Gita
section: chapter_09
title: Pervading Yet Not Contained
sanskrit: 'मया ततमिदं सर्वं जगदव्यक्तमूर्तिना।


  मत्स्थानि सर्वभूतानि न चाहं तेष्ववस्थितः


  न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम्।


  भूतभृन्न च भूतस्थो ममात्मा भूतभावनः


  यथाऽऽकाशस्थितो नित्यं वायुः सर्वत्रगो महान्।


  तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय'
transliteration: 'mayā tatamidaṃ sarvaṃ jagadavyaktamūrtinā|


  matsthāni sarvabhūtāni na cāhaṃ teṣvavasthitaḥ


  na ca matsthāni bhūtāni paśya me yogamaiśvaram|


  bhūtabhṛnna ca bhūtastho mamātmā bhūtabhāvanaḥ


  yathā''''kāśasthito nityaṃ vāyuḥ sarvatrago mahān|


  tathā sarvāṇi bhūtāni matsthānītyupadhāraya'
translation: By Me, in My unmanifest form, all this world is pervaded. All beings
  rest in Me; I do not rest in them. And yet beings do not rest in Me — behold My
  sovereign yoga! Supporting beings, I do not dwell in them; My Self is the source
  of beings. As the great wind resting in space goes everywhere, so all beings rest
  in Me — understand this.
commentary: 'The paradox is deliberate: all beings are in Me; I am not in them as
  a contained resident; and then — look at My yoga — beings are also not in Me possessively,
  while My Self still bears and births them. The wind-in-space simile trains pervasive
  dependence without mutual imprisonment. Existentially this blocks both "God is a
  thing inside the world" and "I contain God as private property." Sovereign yoga
  is the power to support without being confined. Live one relationship today without
  housing the Infinite inside your control, and without pretending you are self-supporting.
  The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. Live one concrete implication of the claim before the day ends, so the argument
  becomes conduct rather than ornament.


  Key Terms:


  **aiśvara yoga paradox** — Sanskrit technical force in this passage -> beings in
  Me yet I not confined in them -> default English flattens the contested philosophical
  work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the
  verse does with the term -> "bhakti" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> beings
  in Me yet I not confined in them -> reducing either to emotion alone loses epistemic
  and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  beings in Me yet I not confined in them.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
