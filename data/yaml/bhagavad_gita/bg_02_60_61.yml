sutra_id: BG_02_60_61
collection: Bhagavad Gita
section: chapter_02
title: Even the Discerning Man’s Mind Is Forcibly Carried Off by Storming Senses
sanskrit: 'यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः।


  इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः


  तानि सर्वाणि संयम्य युक्त आसीत मत्परः।


  वशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता'
transliteration: 'yatato hyapi kaunteya puruṣasya vipaścitaḥ|


  indriyāṇi pramāthīni haranti prasabhaṃ manaḥ


  tāni sarvāṇi saṃyamya yukta āsīta matparaḥ|


  vaśe hi yasyendriyāṇi tasya prajñā pratiṣṭhitā'
translation: “The storming senses forcibly carry off the mind, son of Kuntī, even
  of a person who strives and discerns. Restraining them all, let him sit yoked, Me
  as the highest; for the one whose senses are in control, wisdom stands established.”
commentary: 'Effort and intelligence are not enough. *Pramāthin* senses churn and
  seize the mind *prasabham* — by force. The remedy is *saṃyama* of all senses, seated
  yoked (*yukta*), with Kṛṣṇa as *mat-para* — the highest beyond. Here bhakti-orientation
  enters the sthita-prajña portrait: sense-control is stabilized by a supreme intentional
  object. Existentially, willpower without a “toward what” exhausts itself. Establish
  the senses by giving attention a worthy beyond.


  Striving intelligence can still be kidnapped. Mat-para gives saṃyama a beyond, so
  restraint is not empty self-punishment. Seat the senses by giving attention a worthy
  highest.


  Forced mind-theft humbles spiritual pride. Sit yoked with a highest, or willpower
  becomes brittle. Devotional orientation here is practical neuroscience of attention.
  Attention needs a beyond, or it will be owned by the nearest intense object. Choose
  the beyond deliberately.


  When senses kidnap attention, re-seat it toward your highest before re-entering
  the stream of action. If your application no longer risks anything, you have likely
  replaced the claim with a slogan.


  Key Terms:


  **pramāthin (प्रमाथिन्)** — churning/turbulent/harassing → senses as agitative force
  → “violent” is partial; churning captures ongoing disturbance.


  **prasabham (प्रसभम्)** — forcibly → seizure against resistance → marks the non-negotiable
  strength of sensory pull.


  **mat-para (मत्पर)** — having Me as supreme → Kṛṣṇa as orienting highest → “devoted
  to God” is broad; *para* ranks the Lord above rival aims.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.30–1.32 / 2.54:** Both admit that even the practiced suffer
  mind-steal by distraction, and prescribe focused restraint.

  *Divergence:* YS offers one-pointed principles and īśvara-praṇidhāna; here *mat-para*
  is explicit in the Gītā’s voice.


  **Augustine, Confessions X (the senses and distraction):** Both confess the force
  of sensory seizure despite knowing better.

  *Divergence:* Augustine turns to divine grace and ordered love; Arjuna is told to
  sit yoked with Kṛṣṇa as highest.'
