sutra_id: BG_10_07
collection: Bhagavad Gita
section: chapter_10
title: Unshaking Yoga Through Knowing Vibhūti
sanskrit: 'एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः।


  सोऽविकम्पेन योगेन युज्यते नात्र संशयः'
transliteration: 'etāṃ vibhūtiṃ yogaṃ ca mama yo vetti tattvataḥ|


  so''vikampena yogena yujyate nātra saṃśayaḥ'
translation: Who knows in truth this manifestation-power of Mine and this yoga is
  joined by unshaking yoga — of this there is no doubt.
commentary: 'Knowledge of vibhūti and yoga is not trivia; it joins the knower in avikampa
  yoga — yoga without trembling. The contested claim is that metaphysical recognition
  stabilizes practice. Existentially, trembling yoga is often ignorance of how the
  Lord''s powers show in the world and how His yoga holds. Knowing tattvataḥ removes
  the vibration of doubt that keeps joining intermittent. This verse is the hinge
  before the famous "I am the source" and the lists: study of excellences is meant
  to steady yoga, not to collect divine baseball cards. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **vibhūti (विभूति)** — manifest power/excellence -> divine self-showing to be known
  in truth -> "superpower" misses revelatory excellence

  **avikampa (अविकम्प)** — unshaking/non-trembling -> quality of yoga born of true
  knowing -> "confident" psychologizes yogic non-oscillation


  Cross-Tradition Resonances:


  **[Patañjali on stable practice (sthira)]:** Shared concern for unshaken joining.

  *Divergence:* Patañjali''s citta-stabilization differs from Gītā''s vibhūti-yoga
  knowledge as stabilizer.

  **[Boethius on recognizing providence amid fortune]:** Shared stability through
  right metaphysical seeing.

  *Divergence:* Consolation frame differs; Gītā names vibhūti and yoga explicitly.'
