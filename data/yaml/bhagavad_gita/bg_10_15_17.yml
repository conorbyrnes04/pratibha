sutra_id: BG_10_15_17
collection: Bhagavad Gita
section: chapter_10
title: Show the Powers by Which You Pervade
sanskrit: 'स्वयमेवात्मनाऽत्मानं वेत्थ त्वं पुरुषोत्तम।


  भूतभावन भूतेश देवदेव जगत्पते


  वक्तुमर्हस्यशेषेण दिव्या ह्यात्मविभूतयः।


  याभिर्विभूतिभिर्लोकानिमांस्त्वं व्याप्य तिष्ठसि


  कथं विद्यामहं योगिंस्त्वां सदा परिचिन्तयन्।


  केषु केषु च भावेषु चिन्त्योऽसि भगवन्मया'
transliteration: 'svayamevātmanā''tmānaṃ vettha tvaṃ puruṣottama|


  bhūtabhāvana bhūteśa devadeva jagatpate


  vaktumarhasyaśeṣeṇa divyā hyātmavibhūtayaḥ|


  yābhirvibhūtibhirlokānimāṃstvaṃ vyāpya tiṣṭhasi


  kathaṃ vidyāmahaṃ yogiṃstvāṃ sadā paricintayan|


  keṣu keṣu ca bhāveṣu cintyo''si bhagavanmayā'
translation: You Yourself know Yourself by Yourself, O Highest Person, source of beings,
  Lord of beings, God of gods, Master of the world. Please speak completely Your divine
  self-manifestations by which You stand pervading these worlds. How may I know You,
  O Yogin, always meditating? And in what modes of being are You to be thought by
  me, O Blessed Lord?
commentary: 'Arjuna''s request is precise: only Self knows Self; therefore disclose
  divyā ātma-vibhūtayaḥ by which You pervade. He asks for a meditation-map — keṣu
  keṣu bhāveṣu — in what states to contemplate You always. The contested pedagogical
  desire is for immanent icons without reducing the Lord to icons. Existentially this
  is how devotion avoids both formlessness that cannot land and idolatry that traps.
  Ask for signs that train perpetual thinking of the Lord, not souvenirs. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live
  one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.


  Key Terms:


  **vibhūti (विभूति)** — divine self-power/excellence -> what Arjuna asks to be told
  completely -> "miracle list" misses pervading function

  **paricintayan (परिचिन्तयन्)** — thinking around/meditating -> how Arjuna wants
  to know always -> "thinking about" understates surrounding contemplation


  Cross-Tradition Resonances:


  **[Ignatian composition of place / finding God in all things]:** Shared request
  for contemplative hooks in the world.

  *Divergence:* Jesuit Christ-frame differs; Arjuna asks the Lord to self-enumerate
  vibhūtis.

  **[Pure Land visualization requests]:** Shared asking for forms that support continual
  remembrance.

  *Divergence:* Buddha-field imagery differs from Gītā''s vibhūti pedagogy.'
