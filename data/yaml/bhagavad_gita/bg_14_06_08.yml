sutra_id: BG_14_06_08
collection: Bhagavad Gita
section: chapter_14
title: How Each Guṇa Binds
sanskrit: 'तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम्।सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ

  रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम्।तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम्

  तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम्।प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत'
transliteration: 'tatra sattvaṃ nirmalatvātprakāśakamanāmayam|sukhasaṅgena badhnāti
  jñānasaṅgena cānagha

  rajo rāgātmakaṃ viddhi tṛṣṇāsaṅgasamudbhavam|tannibadhnāti kaunteya karmasaṅgena
  dehinam

  tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām|pramādālasyanidrābhistannibadhnāti
  bhārata'
translation: Among them, sattva, being stainless, is luminous and healthy; it binds
  through attachment to joy and attachment to knowledge, O sinless one. Know rajas
  to be of the nature of passion, arising from thirst and attachment; it binds the
  embodied one through attachment to action, O son of Kuntī. Know tamas, born of ignorance,
  as the deluder of all embodied beings; it binds through negligence, indolence, and
  sleep, O Bhārata.
commentary: 'Each guṇa binds through what it makes lovable. Sattva binds by sukha-saṅga
  and jñāna-saṅga—attachment to joy and to knowing. The contested move is ruthless:
  even clarity and happiness are straps when clutched. Rajas binds through karma-saṅga,
  the addiction to doing born of thirst. Tamas binds through pramāda, ālasya, and
  nidrā—negligence, laziness, sleep—as forms of delusion. Spiritual culture often
  flees tamas and rajas into sattva, then worships luminous captivity as arrival.
  The Gītā refuses that bargain. In the sequence of the teaching, this triad prepares
  the later claim that transcendence is beyond all three, not an upgrade to the nicest
  strand. Existentially, watch what you defend most eloquently: if it is your calm,
  your insight, or your busy usefulness, you may be polishing a bind. Freedom is not
  upgrading your guṇa; it is seeing the binding mechanism in all three. The practical
  test is simple and severe: what happens when your favorite clarity is interrupted?
  If rage or despair follows, sattva was a strap.


  Key Terms:


  **sattva (सत्त्व)** — luminosity / purity-strand -> binds via joy-and-knowledge
  attachment -> ''goodness'' moralizes a binder.

  **rajas (रजस्)** — passion-strand -> binds via action-attachment -> ''energy'' misses
  thirst-born compulsion.

  **tamas (तमस्)** — darkness-strand -> binds via negligence, indolence, sleep ->
  ''laziness'' shrinks cosmological delusion.

  **saṅga (सङ्ग)** — attachment / adherence -> the actual strap within each guṇa ->
  ''liking'' understates bondage.


  Cross-Tradition Resonances:


  **[Patañjali, YS II.3–9 (kleśas)]:** Afflictions that bind through attachment and
  ignorance parallel guṇa-binding.

  *Divergence:* Kleśas are psychological; guṇas are also cosmic strands structuring
  rebirth.

  **[Evagrius, eight thoughts]:** Passions that capture the monk resonate with rajas-tamas
  mechanisms; vainglory with sattvic binding.

  *Divergence:* Evagrius aims at pure prayer; Krishna aims at guṇātīta freedom into
  divine being.

  **[Zhuangzi on usefulness of useless]:** Suspicion of achievement-drive resonates
  with seeing rajas-binding.

  *Divergence:* Zhuangzi dissolves fixed success metrics; the Gītā keeps a clear hierarchy
  toward transcendence of all three.'
