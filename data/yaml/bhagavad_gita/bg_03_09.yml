sutra_id: BG_03_09
collection: Bhagavad Gita
section: chapter_03
title: Sacrifice Turns Deed from Bond into Offering
sanskrit: 'यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः।


  तदर्थं कर्म कौन्तेय मुक्तसंगः समाचर'
transliteration: 'yajñārthātkarmaṇo''nyatra loko''yaṃ karmabandhanaḥ|


  tadarthaṃ karma kaunteya muktasaṃgaḥ samācara'
translation: Other than action for the sake of sacrifice [yajña], this world is bound
  by action. For that purpose, Kaunteya, perform action free from attachment [muktasaṅga].
commentary: 'The world is not bound by action as such but by action severed from sacrificial
  orientation. The contested claim reframes ethics: bondage is not “doing too much,”
  but doing as private appropriation. Yajña here is not only fire-ritual; it is the
  intentional structure that returns deed to a larger circulating order. Krishna’s
  imperative — act free from attachment for that sake — joins two usually separated
  demands: engagement and non-clinging. In Vedic and post-Vedic thought, sacrifice
  is the engine that keeps cosmos and society from collapsing into consumption. Existentially,
  every deed asks a question: is this for circulation or for capture? The verse makes
  that question the difference between karma-bandhana and liberating practice. Freedom
  is not found by exiting the world of action, but by changing action’s telos from
  possession to offering. Once sacrifice is the telos, ethics ceases to be a ledger
  of private purity and becomes a question of circulation. The same muscular deed
  can bind or liberate depending on whether it feeds appropriation or offering. That
  is why Krishna does not say “do less,” but “do for that sake, free from attachment.”
  The world remains a field of karma; the variable is whether karma is seized as property
  or returned as yajña. Practice begins wherever you notice the hand closing around
  a result that was never only yours.


  Key Terms:


  **yajña (यज्ञ)** — from yaj, “to offer/worship” -> sacrificial offering as cosmic-social
  circulation, not merely ceremony -> “sacrifice” in English can mean loss; here it
  means consecrated participation


  **karmabandhana (कर्मबन्धन)** — action-bondage -> binding produced when deed is
  owned apart from offering -> “karma” as fate misses this precise mechanism of attachment
  through non-sacrificial doing


  **muktasaṅga (मुक्तसङ्ग)** — freed from attachment -> performing while released
  from adhesive relation to fruit and self-image -> not indifference; unbound fidelity
  to the act’s sacrificial purpose


  Cross-Tradition Resonances:


  **Hebrews 13:15–16:** Structural homology in converting deed into offering — praise
  and shared good as continual sacrifice rather than private accumulation.

  *Divergence:* Christian offering is christologically centered; the Gītā’s yajña
  is embedded in a cyclical cosmic economy of gods, rain, and food (developed in following
  verses).


  **Ibn ʿArabī, Fuṣūṣ (on servantship):** Structural homology in action as returning
  what never belonged to the servant.

  *Divergence:* Akbarian metaphysics frames return within waḥdat al-wujūd; Krishna
  frames it as yajña that specifically loosens karmic binding in saṃsāra.'
