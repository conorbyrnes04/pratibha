sutra_id: BG_18_67_69
collection: Bhagavad Gita
section: chapter_18
title: Who May Hear, Who Must Speak
sanskrit: 'इदं ते नातपस्काय नाभक्ताय कदाचन।न चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति

  य इमं परमं गुह्यं मद्भक्तेष्वभिधास्यति।भक्ितं मयि परां कृत्वा मामेवैष्यत्यसंशयः

  न च तस्मान्मनुष्येषु कश्िचन्मे प्रियकृत्तमः।भविता न च मे तस्मादन्यः प्रियतरो भुवि'
transliteration: 'idaṃ te nātapaskāya nābhaktāya kadācana|na cāśuśrūṣave vācyaṃ na
  ca māṃ yo''bhyasūyati

  ya imaṃ paramaṃ guhyaṃ madbhakteṣvabhidhāsyati|bhakitaṃ mayi parāṃ kṛtvā māmevaiṣyatyasaṃśayaḥ

  na ca tasmānmanuṣyeṣu kaśicanme priyakṛttamaḥ|bhavitā na ca me tasmādanyaḥ priyataro
  bhuvi'
translation: This is never to be spoken by you to one without austerity, nor to one
  without devotion, nor to one who does not want to listen, nor to one who resents
  Me. The one who teaches this supreme secret to My devotees, having shown highest
  devotion to Me, will come to Me without doubt. And no one among humans does what
  is more dear to Me than he, nor will there be another on earth dearer to Me than
  he.
commentary: 'After the open razor, a gate: the teaching is not for the atapas, abhakta,
  aśuśrūṣu, or the resentful. Then the highest human dearness: teaching this secret
  to devotees is the most priyakṛt toward Krishna. The contested pair is generosity
  and protection. Existentially, this warns against dumping 18.66 into contemptuous
  ears as debate-fuel, and it dignifies responsible transmission as love’s labor.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **na atapaskāya (नातपस्काय)** — not to the non-austere -> fitness for hearing ->
  ''gatekeeping'' can be faithful or egoic.

  **aśuśrūṣu (अशुश्रूषु)** — one who does not wish to hear -> unwilling listener ->
  ''skeptic'' is not always this.

  **abhyasūyati (अभ्यसूयति)** — resents/envies Me -> barred hearer -> ''critical thinker''
  is not identical with resentment.

  **priyakṛttama (प्रियकृत्तम)** — most dear-doer -> teacher of the secret to devotees
  -> ''influencer'' is a parody.


  Cross-Tradition Resonances:


  **[Matthew 7 on pearls]:** Not casting sacred teaching recklessly resonates.

  *Divergence:* Matthew’s frame differs; both protect holy speech from contempt.

  **[Upaniṣadic adhikāra]:** Qualification for teaching/hearing is traditional homology.

  *Divergence:* The Gītā centers bhakti and non-resentment explicitly.

  **[Gītā 4.34]:** Approach knowers with humility—complement to this transmission
  ethic.

  *Divergence:* 4.34 is for seekers; 18.67–69 for teachers’ responsibility and reward.'
