sutra_id: BG_13_03
collection: Bhagavad Gita
section: chapter_13
title: Know Me as the Knower in Every Field
sanskrit: 'क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत।


  क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम'
transliteration: 'kṣetrajñaṃ cāpi māṃ viddhi sarvakṣetreṣu bhārata|


  kṣetrakṣetrajñayorjñānaṃ yattajjñānaṃ mataṃ mama'
translation: Know Me also as the knower of the field in all fields, O Bhārata. Knowledge
  of the field and of the knower of the field—that, in My view, is knowledge.
commentary: 'The verse performs a theological coup inside an analytic distinction.
  First Krishna separates field and knower; then he identifies the knower in every
  field with himself. The contested move is double: individuality is neither denied
  nor absolutized. There is a knower of this body, and that knower is not finally
  private property. True knowledge (jñāna) is therefore not information about matter,
  nor mystical ego-inflation, but simultaneous recognition of locality and universality:
  this field is known, and the knowing is the Lord’s knowing. In the Gītā’s theistic
  Sāṃkhya, discrimination becomes devotion’s intellect. Existentially, the claim rewires
  ethics: if the knower in every field is one, injury to another field is not merely
  “harm to another”; it is blindness about the shared knower. The verse also blocks
  spiritual narcissism: you do not become God by claiming the field; you recognize
  the knower already present. This is why the chapter can later speak of ethics so
  sharply: shared knowing makes cruelty a form of metaphysical illiteracy, not merely
  bad manners.


  Key Terms:


  **sarvakṣetreṣu (सर्वक्षेत्रेषु)** — “in all fields” -> omnipresence of the knower
  across bodies -> “everywhere” misses the precise localization in each embodied field.

  **viddhi (विद्धि)** — imperative of vid, “know!” -> recognition as command, not
  suggestion -> “understand” softens the urgency of re-identification.

  **jñāna (ज्ञान)** — knowing -> here, knowledge as the field/knower distinction itself
  -> “wisdom” can float free of this exact cut.

  **mataṃ mama (मतं मम)** — “My view / My teaching” -> Krishna’s authoritative definition
  of knowledge -> “opinion” trivializes the doctrinal stake.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1]:** The Lord’s pervasion of all that moves resonates with the
  knower present in every field.

  *Divergence:* Īśā leads through renunciation and enjoyment; here the hinge is epistemic:
  redefine knowledge as field-knower insight.

  **[Meister Eckhart, Sermon on poverty of spirit]:** The ground of the soul as one
  with God’s ground parallels one knower in all fields.

  *Divergence:* Eckhart stresses detachment unto the Godhead beyond images; Krishna
  retains personal address (“know Me”) inside the non-dual claim.

  **[Rūmī, Mathnawī II (elephant in the dark)]:** Multiple partial knowings of one
  reality echo many fields, one knower.

  *Divergence:* Rūmī’s parable warns against partial sensory claims; Krishna asserts
  a positive identity of the knower with the Lord.'
