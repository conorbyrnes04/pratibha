section: chapter_13
title: The Knowable Beyond Being and Non-Being
sanskrit: 'ज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वाऽमृतमश्नुते।


  अनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते

  सर्वतः पाणिपादं तत्सर्वतोऽक्षिशिरोमुखम्।सर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति

  सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम्।असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ
  च'
transliteration: 'jñeyaṃ yattatpravakṣyāmi yajjñātvā''mṛtamaśnute|


  anādimatparaṃ brahma na sattannāsaducyate

  sarvataḥ pāṇipādaṃ tatsarvato''kṣiśiromukham|sarvataḥ śrutimalloke sarvamāvṛtya
  tiṣṭhati

  sarvendriyaguṇābhāsaṃ sarvendriyavivarjitam|asaktaṃ sarvabhṛccaiva nirguṇaṃ guṇabhoktṛ
  ca'
translation: I will declare that which is to be known, knowing which one tastes immortality.
  It is the beginningless supreme Brahman, said to be neither being nor non-being.
  With hands and feet everywhere, eyes, heads, and faces everywhere, hearing everywhere
  in the world, it stands enveloping all. Appearing through the qualities of all the
  senses, yet free of all the senses; unattached, yet supporting all; free of the
  guṇas, yet the enjoyer of the guṇas—
commentary: 'The knowable is not another object in the field; it is Brahman, tasting
  which is immortality. The contested move is the double negation: na sat, na asat—neither
  being nor non-being as ordinarily conceived. This is not vagueness; it blocks capturing
  the Absolute with the categories that organize the field. Then the text pivots into
  cosmic body language: hands and feet everywhere, enveloping all—echoing the Puruṣa
  hymn and foreshadowing the theophany of chapter 11. The paradoxes intensify: sense-appearing
  yet sense-free, unattached yet all-supporting, nirguṇa yet guṇa-enjoyer. Knowledge
  here means holding non-dual tension without collapsing into pantheism or world-denial.
  Existentially, immortality is not postponed reward; it is the flavor (aśnute) of
  knowing that which cannot be boxed as a thing or a nothing. Immortality as tasting
  (aśnute) matters: the knowable is not a diagram you assent to; it is a flavor that
  rearranges fear of death. Read as existential demand, the verse asks for a changed
  stance in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **jñeya (ज्ञेय)** — the knowable -> Brahman as that knowing which yields immortality
  -> “object” wrongly implies ordinary objectivity.

  **anādi (अनादि)** — beginningless -> without temporal origin -> “eternal” can still
  smuggle a long timeline.

  **na sat / na asat (न सत् / न असत्)** — neither being nor non-being -> beyond ontic
  binaries of the field -> “mysterious” as a shrug misses the precise category-break.

  **nirguṇa (निर्गुण)** — without guṇas -> free of prakṛtic strands -> “attributeless”
  can sound barren rather than unbound.

  **guṇabhoktṛ (गुणभोक्तृ)** — enjoyer of the guṇas -> witness-enjoyer amid qualities
  without being bound as them -> “experiencer” can reinstall a needy ego.


  Cross-Tradition Resonances:


  **[Śvetāśvatara Upaniṣad III.16–17]:** The all-limbed cosmic person resonates with
  sarvataḥ pāṇi-pāda imagery.

  *Divergence:* Śvetāśvatara leans into Rudra-theism; the Gītā embeds the image inside
  a jñeya teaching tied to immortality.

  **[Nāgārjuna, Mūlamadhyamakakārikā I / tetralemma]:** Refusal of naive being/non-being
  categories is structurally homologous.

  *Divergence:* Nāgārjuna empties inherent existence; Krishna points to a supreme
  Brahman that is liveable as immortality.

  **[Pseudo-Dionysius, Mystical Theology]:** God beyond affirmation and negation parallels
  na sat / na asat.

  *Divergence:* Dionysius climbs by negation into divine darkness; Krishna simultaneously
  affirms cosmic pervasion and sensuous paradox.'
