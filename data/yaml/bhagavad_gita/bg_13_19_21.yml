sutra_id: BG_13_19_21
collection: Bhagavad Gita
section: chapter_13
title: Nature and Person Are Beginningless
sanskrit: 'इति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः।मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते

  प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि।विकारांश्च गुणांश्चैव विद्धि प्रकृतिसंभवान्

  कार्यकारणकर्तृत्वे हेतुः प्रकृतिरुच्यते।पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते'
transliteration: 'iti kṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ|madbhakta etadvijñāya
  madbhāvāyopapadyate

  prakṛtiṃ puruṣaṃ caiva viddhyanādī ubhāvapi|vikārāṃśca guṇāṃścaiva viddhi prakṛtisaṃbhavān

  kāryakāraṇakartṛtve hetuḥ prakṛtirucyate|puruṣaḥ sukhaduḥkhānāṃ bhoktṛtve heturucyate'
translation: Thus the field, knowledge, and the knowable have been spoken in summary.
  My devotee, knowing this, becomes fit for My state of being. Know that both nature
  [prakṛti] and the person [puruṣa] are beginningless. Know also that modifications
  and the guṇas are born of prakṛti. In the production of the body and the senses,
  prakṛti is said to be the cause; the person is said to be the cause in the experiencing
  of pleasure and pain.
commentary: 'The summary seals a path: the devotee who knows this becomes fit for
  madbhāva—Krishna’s own mode of being. Knowledge is not terminal information; it
  is initiation into a shared ontological stance. Then the classical Sāṃkhya pair
  returns with a twist: both prakṛti and puruṣa are beginningless. The contested move
  assigns causality carefully: prakṛti causes the apparatus (body-senses), puruṣa
  causes bhoktṛtva—the tasting of pleasure and pain. Bondage is not that awareness
  exists, but that witnessing gets contracted into ownership of affect. Existentially,
  this explains why changing circumstances never ends suffering: as long as the person
  is entangled as enjoyer-owner, the field will keep delivering sukha-duḥkha to a
  claimant. Distinguishing productivity from enjoyership is daily medicine: you can
  let prakṛti build the scene without signing the affect as identity. Read as existential
  demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine. Read as existential demand, the verse asks for a changed
  stance in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **madbhāva (मद्भाव)** — “My being / My state” -> participation in Krishna’s mode
  -> “my nature” as imitation misses ontological fittingness.

  **anādi (अनादि)** — beginningless -> no first moment of prakṛti or puruṣa -> “always
  existed” can still temporalize wrongly.

  **bhoktṛtva (भोक्तृत्व)** — enjoyership / experiencership -> puruṣa’s role in tasting
  affect -> “consumer” is too economic and crude.

  **kārya-kāraṇa (कार्य-कारण)** — effect-cause complex -> prakṛti’s productivity of
  embodiment -> “causation” in physics misses yogic anthropology.


  Cross-Tradition Resonances:


  **[Sāṃkhya Kārikā 3, 19–21]:** Prakṛti as active, puruṣa as experiencer is near-direct
  homology.

  *Divergence:* Sāṃkhya ends in isolation of puruṣa; the Gītā routes knowledge into
  madbhāva and devotion.

  **[Augustine, Confessions X]:** Memory and desire as loci of enjoyment/suffering
  parallel bhoktṛtva’s centrality.

  *Divergence:* Augustine heals enjoyership by ordering love to God; Krishna analyzes
  enjoyership as puruṣa’s causal role amid prakṛti.

  **[Buddha, SN 12 (dependent origination)]:** Feeling and craving as binding nodes
  echo pleasure-pain enjoyership.

  *Divergence:* Buddhism dismantles a permanent puruṣa; the Gītā retains puruṣa while
  relocating bondage to misidentified enjoyership.'
voice_of_siva: ''
abhyasa: 'At the next spike of pleasure or pain, say: “Prakṛti produced the event;
  enjoyership is claiming it.” Rest one minute without feeding the claim.'
