sutra_id: BG_18_34_36
collection: Bhagavad Gita
section: chapter_18
title: Rajasic and Tamasic Firmness; The Promise of Threefold Joy
sanskrit: 'यया तु धर्मकामार्थान् धृत्या धारयतेऽर्जुन।प्रसङ्गेन फलाकाङ्क्षी धृतिः सा
  पार्थ राजसी

  यया स्वप्नं भयं शोकं विषादं मदमेव च।न विमुञ्चति दुर्मेधा धृतिः सा पार्थ तामसी

  सुखं त्विदानीं त्रिविधं श्रृणु मे भरतर्षभ।अभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति'
transliteration: 'yayā tu dharmakāmārthān dhṛtyā dhārayate''rjuna|prasaṅgena phalākāṅkṣī
  dhṛtiḥ sā pārtha rājasī

  yayā svapnaṃ bhayaṃ śokaṃ viṣādaṃ madameva ca|na vimuñcati durmedhā dhṛtiḥ sā pārtha
  tāmasī

  sukhaṃ tvidānīṃ trividhaṃ śrṛṇu me bharatarṣabha|abhyāsādramate yatra duḥkhāntaṃ
  ca nigacchati'
translation: But the firmness by which one holds to dharma, desire, and wealth, O
  Arjuna, with attachment, hungry for fruit—that firmness, O Pārtha, is rajasic. The
  firmness by which the foolish person does not abandon sleep, fear, grief, despondency,
  and intoxication—that firmness, O Pārtha, is tamasic. And now hear from Me the threefold
  joy, O best of Bharatas, in which one delights through practice and reaches the
  end of suffering.
commentary: 'Dhṛti can bind as firmly as it frees. Rajasic firmness clings to dharma-kāma-artha
  with prasanga and phala-hunger—even “duty” becomes a fruit project. Tamasic firmness
  is perverse stability: not letting go of sleep, fear, grief, despair, intoxication.
  Then Krishna pivots to sukha-traya, joy that through abhyāsa ends in duḥkhānta.
  The contested insight: your stubbornness reveals your guṇa. Existentially, what
  you refuse to relinquish—status projects or narcotic moods—is already your dhṛti’s
  name. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **dharmakāmārthān (धर्मकामार्थान्)** — dharma, desire, wealth -> rajasic firmness’s
  held objects -> ''life goals'' may be this clutch.

  **phala-kāṅkṣī (फलाकाङ्क्षी)** — fruit-desiring -> rajasic firmness mark -> ''motivated''
  is ambiguous.

  **durmedhā (दुर्मेधा)** — poor-minded / foolish -> subject of tamasic firmness ->
  ''depressed'' is not identical, though viṣāda appears.

  **abhyāsāt (अभ्यासात्)** — from practice -> how joy’s path is walked -> ''habit''
  can be mechanical without yogic sense.


  Cross-Tradition Resonances:


  **[Arthaśāstra / trivarga culture]:** Dharma-artha-kāma as held aims is cultural
  background.

  *Divergence:* The Gītā calls fruit-clutching firmness about them rajasic.

  **[Addiction as ''commitment'']:** Tamasic firmness not releasing sleep/fear/intoxication
  resonates modernly.

  *Divergence:* Clinical addiction frames differ; the verse names guṇa-firmness.

  **[Gītā 6 on abhyāsa-vairāgya]:** Practice toward suffering’s end continues.

  *Divergence:* 18.36 introduces joy’s triad as the next map.'
