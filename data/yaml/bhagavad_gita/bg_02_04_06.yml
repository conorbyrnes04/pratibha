sutra_id: BG_02_04_06
collection: Bhagavad Gita
section: chapter_02
title: How Can I Strike Those Worthy of Worship
sanskrit: 'अर्जुन उवाच


  कथं भीष्ममहं संख्ये द्रोणं च मधुसूदन।


  इषुभिः प्रतियोत्स्यामि पूजार्हावरिसूदन


  गुरूनहत्वा हि महानुभावान्


  श्रेयो भोक्तुं भैक्ष्यमपीह लोके।


  हत्वार्थकामांस्तु गुरूनिहैव


  भुञ्जीय भोगान् रुधिरप्रदिग्धान्


  न चैतद्विद्मः कतरन्नो गरीयो


  यद्वा जयेम यदि वा नो जयेयुः।


  यानेव हत्वा न जिजीविषाम


  स्तेऽवस्थिताः प्रमुखे धार्तराष्ट्राः'
transliteration: 'arjuna uvāca


  kathaṃ bhīṣmamahaṃ saṃkhye droṇaṃ ca madhusūdana|


  iṣubhiḥ pratiyotsyāmi pūjārhāvarisūdana


  gurūnahatvā hi mahānubhāvān


  śreyo bhoktuṃ bhaikṣyamapīha loke|


  hatvārthakāmāṃstu gurūnihaiva


  bhuñjīya bhogān rudhirapradigdhān


  na caitadvidmaḥ kataranno garīyo


  yadvā jayema yadi vā no jayeyuḥ|


  yāneva hatvā na jijīviṣāma


  ste''vasthitāḥ pramukhe dhārtarāṣṭrāḥ'
translation: 'Arjuna said: “How can I fight with arrows in battle against Bhīṣma and
  Droṇa, Madhusūdana — those worthy of worship, O slayer of foes? Better to eat even
  the food of begging in this world than to kill these great-souled gurus. If I kill
  teachers greedy for ends, I would enjoy blood-smeared pleasures right here. And
  we do not know which is weightier for us — whether we should conquer or they should
  conquer us. Those whom, having killed, we would not wish to live — the sons of Dhṛtarāṣṭra
  — stand facing us.”'
commentary: 'Arjuna sharpens the objection: not abstract kin, but *pūjārhau* — those
  owed worship. Begging (*bhaikṣya*) is declared better than blood-smeared enjoyments
  after killing gurus. The contested move is moral uncertainty raised to epistemic
  crisis: we do not even know which outcome is heavier (*garīyas*). Victory itself
  becomes undesirable because its condition is life without those one cannot bear
  to kill. This is the deepest form of chapter 1’s logic, now aimed at teacher-killing.
  The Gītā will answer without dismissing the sacredness of the guru-bond; it will
  relocate identity beneath roles. Existentially, the passage names conflicts where
  every “win” feels like desecration. That feeling is data. It is not yet the final
  word on action.


  Guru-killing concentrates the whole problem of sacred violence. Arjuna’s uncertainty
  about which outcome is heavier keeps the question honest. Any ethic that answers
  too quickly here has not felt the weight the Gītā is willing to feel before it teaches.


  Keep the weight of pūjārhau in any conflict where winning would desecrate what formed
  you; speed of answer is not depth.


  Key Terms:


  **pūjārha (पूजार्ह)** — worthy of worship/honor → sacred owedness that makes violence
  sacrilegious → “respectable” is far too weak.


  **bhaikṣya (भैक्ष्य)** — alms-food / begging livelihood → chosen poverty as moral
  alternative → “begging” misses its status as ethically preferred life-form here.


  **rudhira-pradigdha (रुधिरप्रदिग्ध)** — smeared with blood → pleasures stained by
  the means of their getting → “bloodstained” is right; the image makes enjoyment
  itself contaminated.


  Cross-Tradition Resonances:


  **Plato, Crito 49b–54d:** Both refuse a “victory” that violates what is owed to
  formative authorities and the soul’s integrity.

  *Divergence:* Crito stays within civic law and persuasion; Arjuna faces literal
  guru-combat.


  **Confucius, Analects 4.16 / 12.10:** Both treat profit obtained by violating reverence-relations
  as spiritually worthless.

  *Divergence:* Confucian repair is ritual-ethical cultivation; Arjuna’s immediate
  alternative is renunciate begging.'
