sutra_id: BG_08_09_11
collection: Bhagavad Gita
section: chapter_08
title: The Poet Beyond Darkness
sanskrit: 'कविं पुराणमनुशासितार


  मणोरणीयांसमनुस्मरेद्यः।


  सर्वस्य धातारमचिन्त्यरूप


  मादित्यवर्णं तमसः परस्तात्


  प्रयाणकाले मनसाऽचलेन


  भक्त्या युक्तो योगबलेन चैव।


  भ्रुवोर्मध्ये प्राणमावेश्य सम्यक्


  स तं परं पुरुषमुपैति दिव्यम्


  यदक्षरं वेदविदो वदन्ति


  विशन्ति यद्यतयो वीतरागाः।


  यदिच्छन्तो ब्रह्मचर्यं चरन्ति


  तत्ते पदं संग्रहेण प्रवक्ष्ये'
transliteration: 'kaviṃ purāṇamanuśāsitāra


  maṇoraṇīyāṃsamanusmaredyaḥ|


  sarvasya dhātāramacintyarūpa


  mādityavarṇaṃ tamasaḥ parastāt


  prayāṇakāle manasā''calena


  bhaktyā yukto yogabalena caiva|


  bhruvormadhye prāṇamāveśya samyak


  sa taṃ paraṃ puruṣamupaiti divyam


  yadakṣaraṃ vedavido vadanti


  viśanti yadyatayo vītarāgāḥ|


  yadicchanto brahmacaryaṃ caranti


  tatte padaṃ saṃgraheṇa pravakṣye'
translation: Who remembers the Seer-Poet [kavi], the Ancient, the Ruler, subtler than
  the atom, the supporter of all, of unthinkable form, sun-colored, beyond the darkness
  — at departure, with unmoving mind, joined by devotion and yoga-strength, setting
  the vital breath [prāṇa] rightly between the brows — reaches that supreme divine
  Person. What Veda-knowers call the imperishable, what striving ones free of passion
  enter, desiring which they live brahmacarya — that footing [pada] I will declare
  to you in compressed form.
commentary: 'The object of deathbed remembrance is not a vague light; it is a densely
  predicated Person: poet-seer, ancient, ruler, subtler than atom, all-supporter,
  unthinkable in form, sun-hued, beyond tamas. The contested synthesis joins bhakti,
  yoga-bala, steady mind, and prāṇa placed between the brows — devotion, power, stillness,
  and subtle physiology as one act of going. Verse 8.11 then embeds this in Upaniṣadic
  pedigree: the same akṣara the Veda-knowers name, the same entry the passion-free
  seek, the same desire that structures brahmacarya. Existentially this blocks two
  reductions: reducing dying to a breathing trick without devotion, and reducing devotion
  to emotion without steadied mind and breath. The "brief" teaching is not simplistic;
  it is compressed because the path is one. The line-level force of the teaching is
  practical, not ornamental: what it claims about reality is meant to reshape how
  you attend, choose, and depart. If the claim does not alter rehearsal in ordinary
  time, it will not hold when time thins. Existential uptake is therefore part of
  fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **kavi (कवि)** — poet/seer -> the Lord as ancient visionary ruler -> "poet" as artist
  misses Vedic seer-authority.


  **prāṇa (प्राण)** — vital breath -> placed between brows at departure with yoga-strength
  -> "breath" as air only misses life-force technique.


  **brahmacarya (ब्रह्मचर्य)** — walking with Brahman / continence -> discipline of
  those who desire the imperishable footing -> "celibacy" alone misses the broader
  Vedic student-aim.


  Cross-Tradition Resonances:


  **Plotinus on the flight of the alone to the Alone:** Both describe ascent to a
  principle beyond darkness.

  *Divergence:* Plotinus'' One is impersonal; Gītā''s Person is sun-colored, devotionally
  approachable, with yogic breath-placement.


  **Kaṭha Upaniṣad (thumb-sized person / beyond darkness):** Shared imagery of the
  Person beyond tamas.

  *Divergence:* Gītā inserts explicit bhakti-yoga-bala and battlefield interlocutor.'
voice_of_siva: ''
abhyasa: Sit upright for five minutes. Steady the mind on the "sun-colored beyond
  darkness" image while keeping breath soft and central; if emotion arises, let it
  serve devotion rather than scatter attention.
