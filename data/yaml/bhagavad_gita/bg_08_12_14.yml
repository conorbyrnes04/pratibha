sutra_id: BG_08_12_14
collection: Bhagavad Gita
section: chapter_08
title: Om, Remembrance, and the Easy Lord
sanskrit: 'सर्वद्वाराणि संयम्य मनो हृदि निरुध्य च।


  मूर्ध्न्याधायात्मनः प्राणमास्थितो योगधारणाम्


  ओमित्येकाक्षरं ब्रह्म व्याहरन्मामनुस्मरन्।


  यः प्रयाति त्यजन्देहं स याति परमां गतिम्


  अनन्यचेताः सततं यो मां स्मरति नित्यशः।


  तस्याहं सुलभः पार्थ नित्ययुक्तस्य योगिनः'
transliteration: 'sarvadvārāṇi saṃyamya mano hṛdi nirudhya ca|


  mūrdhnyādhāyātmanaḥ prāṇamāsthito yogadhāraṇām


  omityekākṣaraṃ brahma vyāharanmāmanusmaran|


  yaḥ prayāti tyajandehaṃ sa yāti paramāṃ gatim


  ananyacetāḥ satataṃ yo māṃ smarati nityaśaḥ|


  tasyāhaṃ sulabhaḥ pārtha nityayuktasya yoginaḥ'
translation: Restraining all the gates, holding the mind in the heart, placing one's
  own prāṇa in the head, established in yoga-concentration [yoga-dhāraṇā]; sounding
  Om, the one-syllable Brahman, remembering Me — who goes forth leaving the body reaches
  the supreme goal. I am easy to attain [sulabha], O Pārtha, for the yogin of undivided
  awareness who remembers Me constantly, always, ever joined.
commentary: 'The hardest techniques — gate-closing, heart-holding, cranial prāṇa,
  Om, remembrance at exit — culminate in a soft claim: for the constantly remembering,
  ever-joined yogin, the Lord is sulabha, easy. The contested move is that ease is
  not the opposite of discipline; ease is the fruit of ananya-cetas continuity. Difficulty
  belongs to last-minute improvisation; ease belongs to nitya remembrance. Existentially
  this comforts without cheapening: you are not told technique is unnecessary; you
  are told that exclusive, continuous remembrance makes the Lord available in a way
  crisis-spirituality cannot. Om as one-syllable Brahman joins sonic Absolute to personal
  remembrance — sound and relation together. The practice question becomes: is my
  yoga only for special sittings, or has remembrance become the default climate? The
  line-level force of the teaching is practical, not ornamental: what it claims about
  reality is meant to reshape how you attend, choose, and depart. If the claim does
  not alter rehearsal in ordinary time, it will not hold when time thins. Existential
  uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **sulabha (सुलभ)** — easy to attain -> the Lord for the ever-joined constant rememberer
  -> "easy" as lazy understates the condition: ananya-cetas, nitya.


  **yoga-dhāraṇā (योगधारणा)** — yogic holding/concentration -> establishment at departure
  with prāṇa in the head -> "focus" is too thin for formal yogic holding.


  **ananya-cetas (अनन्यचेतस्)** — mind with no other -> exclusive awareness in remembrance
  -> "loyal" misses cognitive undividedness.


  Cross-Tradition Resonances:


  **Cloud of Unknowing (naked intent toward God):** Both make continuous intent the
  heart of attainment.

  *Divergence:* Cloud is apophatic Christian; Gītā includes Om, prāṇa, and explicit
  sulabha for the joined yogin.


  **Hesychast Jesus Prayer:** Both train unceasing remembrance.

  *Divergence:* Hesychasm centers the Name of Jesus; Gītā joins Om-Brahman utterance
  to remembering Kṛṣṇa.'
voice_of_siva: ''
abhyasa: Choose one ordinary hour today and keep a quiet Om-remembrance thread through
  it (mental, not showy). Note whether the Lord feels "hard" or "near" when remembrance
  is continuous rather than sporadic.
