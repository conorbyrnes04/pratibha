collection: Bhagavad Gita
section: chapter_06
title: Quiet Rajas, Brahman-Touch Happiness
sanskrit: 'प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम्।


  उपैति शान्तरजसं ब्रह्मभूतमकल्मषम्


  युञ्जन्नेवं सदाऽऽत्मानं योगी विगतकल्मषः।


  सुखेन ब्रह्मसंस्पर्शमत्यन्तं सुखमश्नुते'
transliteration: 'praśāntamanasaṃ hyenaṃ yoginaṃ sukhamuttamam|


  upaiti śāntarajasaṃ brahmabhūtamakalmaṣam


  yuñjannevaṃ sadā''''tmānaṃ yogī vigatakalmaṣaḥ|


  sukhena brahmasaṃsparśamatyantaṃ sukhamaśnute'
translation: Supreme happiness comes to this yogin of peaceful mind, whose rajas is
  quieted, who has become Brahman, without stain. Yoking the self always in this way,
  the yogin whose stain is gone easily enjoys the infinite happiness of Brahman-contact.
commentary: 'Uttama sukha approaches the yogin who is praśānta-manas, śānta-rajas,
  brahma-bhūta, akalmaṣa. Continual yoking then yields easy enjoyment of brahma-saṃsparśa’s
  atyanta sukha. The contested physiology-metaphysics is rajas quieting as condition
  of Brahman-becoming happiness — not as depression, but as cooling of agitated passion-quality.
  Existentially, if happiness feels forced, check whether rajas is still driving the
  sit. Ease (sukhena) is itself a sign: stain-gone contact is not gritted teeth. Become
  cool enough for contact to be joy. Quieted rajas is cooled agitation, not depressive
  collapse — the guṇa climate in which Brahman-becoming happiness can approach. Easy
  enjoyment of Brahman-contact signals stain-gone practice; gritted bliss is usually
  still rajas in costume. Continual yoking makes contact joyful rather than forced.
  Cool the drivers of speed and heat, then look for happiness that arrives as ease.
  Supreme sukha approaches a peaceful, stainless, Brahman-become mind. The contested
  force of the passage remains practical: it asks for a change in how you inhabit
  action, attention, and relation — not for ornamental agreement. Return to the line
  until the claim bites a live decision today.


  Key Terms:


  **śāntarajas (शान्तरजस्)** — whose rajas is quieted -> guṇa-level description of
  meditative readiness -> links happiness to cosmic psychology


  **brahmasaṃsparśa (ब्रह्मसंस्पर्श)** — contact/touch of Brahman -> intimate metaphor
  for realization’s joy -> not spatial touch; contact-as-knowing


  Cross-Tradition Resonances:


  **Guṇa theory elsewhere in Gītā (chs. 14, 18):** Structural homology in rajas as
  agitation opposing clarity and peace.

  *Divergence:* Later chapters systematize three guṇas; here quieted rajas is specifically
  tied to brahma-bhūta happiness.


  **Apophatic “touch” of God (e.g., Ruusbroec):** Structural homology in contact-language
  for non-sensory union joy.

  *Divergence:* Christian mystical touch is trinitarian; here brahma-saṃsparśa follows
  rajas-stilling yoga.'
voice_of_siva: ''
abhyasa: Before sitting, cool one rajas trigger (speed, argument, caffeine spike);
  then yoke and look for happiness that arrives as ease of contact, not as hype.
