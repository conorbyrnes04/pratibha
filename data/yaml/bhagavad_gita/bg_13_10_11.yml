sutra_id: BG_13_10_11
collection: Bhagavad Gita
section: chapter_13
title: Unswerving Devotion and Love of Solitude
sanskrit: 'असक्ितरनभिष्वङ्गः पुत्रदारगृहादिषु।नित्यं च समचित्तत्वमिष्टानिष्टोपपत्तिषु

  मयि चानन्ययोगेन भक्ितरव्यभिचारिणी।विविक्तदेशसेवित्वमरतिर्जनसंसदि'
transliteration: 'asakitaranabhiṣvaṅgaḥ putradāragṛhādiṣu|nityaṃ ca samacittatvamiṣṭāniṣṭopapattiṣu

  mayi cānanyayogena bhakitaravyabhicāriṇī|viviktadeśasevitvamaratirjanasaṃsadi'
translation: Non-attachment, absence of clinging to son, wife, home, and the like;
  and constant evenness of mind toward the occurrence of the desired and the undesired;
  and unswerving devotion to Me with yoga that has no other object; resorting to solitary
  places, and distaste for crowds of people—
commentary: 'Knowledge continues to look like a way of loving and dwelling. Asakti
  and anabhiṣvaṅga do not abolish relationship; they cut the adhesive that turns people
  into private property of the ego. Samacittatva under desired and undesired outcomes
  is the emotional form of field-seeing: events arise in the field; the knower need
  not lurch. Then comes the chapter’s theistic spine: bhakti that does not stray,
  joined to ananya-yoga—yoga with no rival object. Solitude and distaste for crowds
  protect that single-pointedness from diffusion. The contested move is to place devotion
  inside jñāna’s definition, refusing the split between cold metaphysics and warm
  piety. Existentially, the verse asks whether your “understanding” survives family
  pressure and social noise, and whether your devotion has a second altar hidden in
  achievement or approval. Solitude here is not misanthropy; it is protection of ananya-yoga
  from the market of identities that crowds sell and buy. Read as existential demand,
  the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine.


  Key Terms:


  **asakti (असक्ति)** — non-attachment -> freedom from adhesive clinging -> “detachment”
  can sound cold or dissociative.

  **anabhiṣvaṅga (अनभिष्वङ्ग)** — non-adhesion / non-entanglement -> specifically
  toward household bonds -> “not caring” misses lucid love without glue.

  **samacittatva (समचित्तत्व)** — same-mindedness -> evenness amid liked/disliked
  arrivals -> “indifference” misreads as apathy.

  **ananya-yoga (अनन्ययोग)** — yoga with no other -> exclusive yogic orientation to
  Krishna -> “monotheistic loyalty” alone misses yogic concentration.

  **avyabhicāriṇī bhakti (अव्यभिचारिणी भक्ति)** — unswerving devotion -> fidelity
  of love that does not stray -> “faithfulness” can sound merely moralistic.


  Cross-Tradition Resonances:


  **[Gītā 12.13–20]:** The devotee’s traits echo this knowledge-list, binding bhakti
  and jñāna.

  *Divergence:* Chapter 12 ranks paths; chapter 13 absorbs devotion into the very
  definition of knowledge.

  **[John of the Cross, Ascent of Mount Carmel I]:** Detachment from creatures for
  God’s sake parallels asakti and ananya devotion.

  *Divergence:* John emphasizes dark nights of sense and spirit; Krishna keeps communal
  duty alive inside non-clinging.

  **[Milarepa’s songs of solitude]:** Love of isolated places as support for realization
  resonates with vivikta-deśa.

  *Divergence:* Milarepa’s solitude serves mahāmudrā recognition; here solitude serves
  unswerving bhakti-knowledge of the field’s Lord.'
