sutra_id: BG_05_07_09
collection: Bhagavad Gita
section: chapter_05
title: Sense-Objects Move; the Knower Does Not Claim
sanskrit: 'योगयुक्तो विशुद्धात्मा विजितात्मा जितेन्द्रियः।


  सर्वभूतात्मभूतात्मा कुर्वन्नपि न लिप्यते


  नैव किंचित्करोमीति युक्तो मन्येत तत्त्ववित्।


  पश्यन् श्रृणवन्स्पृशञ्जिघ्रन्नश्नन्गच्छन्स्वपन् श्वसन्


  प्रलपन्विसृजन्गृह्णन्नुन्मिषन्निमिषन्नपि।


  इन्द्रियाणीन्द्रियार्थेषु वर्तन्त इति धारयन्'
transliteration: 'yogayukto viśuddhātmā vijitātmā jitendriyaḥ|


  sarvabhūtātmabhūtātmā kurvannapi na lipyate


  naiva kiṃcitkaromīti yukto manyeta tattvavit|


  paśyan śrṛṇavanspṛśañjighrannaśnangacchansvapan śvasan


  pralapanvisṛjangṛhṇannunmiṣannimiṣannapi|


  indriyāṇīndriyārtheṣu vartanta iti dhārayan'
translation: 'Yoked in yoga, purified in self, self-conquered, senses conquered, whose
  self has become the self of all beings — even while acting, is not stained. “I do
  nothing at all” — so the integrated knower of truth should think, while seeing,
  hearing, touching, smelling, eating, going, sleeping, breathing, speaking, releasing,
  grasping, opening and closing the eyes — holding: the senses are moving among the
  sense-objects.'
commentary: 'Non-staining while acting requires a full inner profile: yoga-yoked,
  purified, self-mastered, sense-mastered, and identified as the self of all beings.
  The contested mantra — naiva kiṃcit karomi — is not denial of biology but refusal
  of ahaṅkāra’s authorship during the entire sensorimotor stream. The long participle
  chain makes the claim concrete: blinking itself is included. Holding “senses among
  sense-objects” is the cognitive seal of tattva-vit practice. Existentially, try
  the mantra only where purification and non-harm are real; otherwise it becomes spiritualized
  irresponsibility. Where the profile holds, the world can move through you without
  leaving stain-claims on the “I.” The long list of participles — including blinking
  — makes non-doership concrete enough to survive ordinary life. “I do nothing at
  all” while senses move among objects is a held insight (dhārayan), not a one-time
  idea. It requires the prior profile of purification and mastery; otherwise it becomes
  spiritualized negligence. Where the profile holds, action can flood the day without
  staining the claim-making “I.” Practice the mantra inside care, not instead of care.


  Key Terms:


  **sarvabhūtātmabhūtātman (सर्वभूतात्मभूतात्मन्)** — self that has become the self
  of all beings -> identity expanded beyond private doer -> the compassion-structure
  of non-staining action


  **dhārayan (धारयन्)** — holding/bearing in mind -> active maintenance of the senses-objects
  insight -> not a one-time idea


  **na lipyate (न लिप्यते)** — is not stained -> non-adhesion of action’s binding
  -> the fruit of the yoked profile


  Cross-Tradition Resonances:


  **Zhuāngzi’s Cook Ding:** Structural homology in activity without egoic forcing,
  as if process moves itself.

  *Divergence:* Cook Ding’s wuwei is skill-spontaneity; the Gītā’s formula is tattva-holding
  amid a conquered-sense yoga profile.


  **Nietzschean critique of doer-fiction (GM I) inverted:** Structural homology in
  prying the “doer” off the deed.

  *Divergence:* Nietzsche historicizes the fiction for genealogy; the Gītā uses the
  insight for yogic non-staining and liberation.'
voice_of_siva: ''
abhyasa: During a routine sequence (walking, eating, speaking), repeat quietly “senses
  among objects; I do nothing at all,” while keeping care and ethics intact.
