sutra_id: BG_09_13_15
collection: Bhagavad Gita
section: chapter_09
title: Great Souls Who Worship
sanskrit: 'महात्मानस्तु मां पार्थ दैवीं प्रकृतिमाश्रिताः।


  भजन्त्यनन्यमनसो ज्ञात्वा भूतादिमव्ययम्


  सततं कीर्तयन्तो मां यतन्तश्च दृढव्रताः।


  नमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते


  ज्ञानयज्ञेन चाप्यन्ये यजन्तो मामुपासते।


  एकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम्'
transliteration: 'mahātmānastu māṃ pārtha daivīṃ prakṛtimāśritāḥ|


  bhajantyananyamanaso jñātvā bhūtādimavyayam


  satataṃ kīrtayanto māṃ yatantaśca dṛḍhavratāḥ|


  namasyantaśca māṃ bhaktyā nityayuktā upāsate


  jñānayajñena cāpyanye yajanto māmupāsate|


  ekatvena pṛthaktvena bahudhā viśvatomukham'
translation: But the great-souled, taking refuge in divine nature, O Pārtha, worship
  Me with undivided mind, knowing Me as the imperishable origin of beings. Always
  glorifying Me, striving, firm in vows, bowing to Me with devotion, ever joined,
  they worship. Others also sacrifice to Me with the sacrifice of knowledge, worshipping
  as the one, as the distinct, as the many-facing in all directions.
commentary: 'Great-souled ones under divine nature worship with undivided mind, knowing
  the Lord as imperishable origin. Their practice is continuous glorifying, striving,
  vows, bowing, devotion, perpetual joining. Parallel to this, knowledge-sacrifice
  worshippers approach as one, as distinct, as the multi-faced All. The contested
  generosity names multiple legitimate modes without relativism: undivided personal
  devotion and knowledge-sacrifice alike aim at Me. Existentially this legitimizes
  both singing and knowing as worship while keeping undivided mind as the great-soul
  mark. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or
  it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. Live one concrete implication of the claim before
  the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **ananya-manas** — Sanskrit technical force in this passage -> undivided devotion
  and knowledge-sacrifice -> default English flattens the contested philosophical
  work.

  **jñāna-yajña** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what
  the verse does with the term -> "jñāna-yajña" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> undivided
  devotion and knowledge-sacrifice -> reducing either to emotion alone loses epistemic
  and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  undivided devotion and knowledge-sacrifice.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
