sutra_id: BG_18_37_39
collection: Bhagavad Gita
section: chapter_18
title: Poison First, Nectar Later—and Its Inversions
sanskrit: 'यत्तदग्रे विषमिव परिणामेऽमृतोपमम्।तत्सुखं सात्त्विकं प्रोक्तमात्मबुद्धिप्रसादजम्

  विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम्।परिणामे विषमिव तत्सुखं राजसं स्मृतम्

  यदग्रे चानुबन्धे च सुखं मोहनमात्मनः।निद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम्'
transliteration: 'yattadagre viṣamiva pariṇāme''mṛtopamam|tatsukhaṃ sāttvikaṃ proktamātmabuddhiprasādajam

  viṣayendriyasaṃyogādyattadagre''mṛtopamam|pariṇāme viṣamiva tatsukhaṃ rājasaṃ smṛtam

  yadagre cānubandhe ca sukhaṃ mohanamātmanaḥ|nidrālasyapramādotthaṃ tattāmasamudāhṛtam'
translation: That which is like poison at first but like nectar in the end—that joy
  is declared sattvic, born of the clarity of one’s own intellect. That which is like
  nectar at first from the union of senses and objects, but like poison in the end—that
  joy is held to be rajasic. That joy which, both at first and in consequence, deludes
  the self, born of sleep, indolence, and negligence—that is declared tamasic.
commentary: 'Sukha’s phenomenology is temporal. Sattvic: poison-first, nectar-later,
  born of ātma-buddhi-prasāda. Rajasic: nectar-first from sense-object union, poison-later.
  Tamasic: deluding at start and sequel, born of nidrā-ālasya-pramāda. The contested
  wisdom inverts consumer intuition. Existentially, trust endings more than beginnings
  when discerning joys. The “hard good” that clarifies buddhi is not masochism; it
  is sattvic joy’s signature arc. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **ātma-buddhi-prasāda (आत्मबुद्धिप्रसाद)** — clarity/serenity of one’s intellect/self
  -> source of sattvic joy -> ''self-esteem boost'' counterfeits.

  **viṣayendriya-saṃyoga (विषयेन्द्रियसंयोग)** — union of senses and objects -> rajasic
  joy’s origin -> ''pleasure'' is the broad category.

  **mohanam ātmanaḥ (मोहनमात्मनः)** — deluding the self -> tamasic joy’s effect ->
  ''numbing out'' is close.

  **pariṇāme (परिणामे)** — in the result/end -> crucial temporal test -> ''long-term''
  secularizes the arc.


  Cross-Tradition Resonances:


  **[Aristotle on pleasures of the cultivated]:** Some pleasures are initially hard
  resonates.

  *Divergence:* Aristotle’s education of pleasure differs from guṇa arcs toward mokṣa.

  **[Buddhist assāda-ādīnava]:** Gratification vs danger of sense pleasure is strong
  homology.

  *Divergence:* Buddhism adds escape; Krishna maps three joys including sattvic prasāda-joy.

  **[Augustine on disordered loves]:** Sweet beginnings that embitter resonate with
  rajasic joy.

  *Divergence:* Augustine orders love to God; here sattvic joy is prasāda-born.'
