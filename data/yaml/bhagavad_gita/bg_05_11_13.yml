sutra_id: BG_05_11_13
collection: Bhagavad Gita
section: chapter_05
title: Body-Mind Offerings for Self-Purification
sanskrit: 'कायेन मनसा बुद्ध्या केवलैरिन्द्रियैरपि।


  योगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वाऽऽत्मशुद्धये


  युक्तः कर्मफलं त्यक्त्वा शान्तिमाप्नोति नैष्ठिकीम्।


  अयुक्तः कामकारेण फले सक्तो निबध्यते


  सर्वकर्माणि मनसा संन्यस्यास्ते सुखं वशी।


  नवद्वारे पुरे देही नैव कुर्वन्न कारयन्'
transliteration: 'kāyena manasā buddhyā kevalairindriyairapi|


  yoginaḥ karma kurvanti saṅgaṃ tyaktvā''''tmaśuddhaye


  yuktaḥ karmaphalaṃ tyaktvā śāntimāpnoti naiṣṭhikīm|


  ayuktaḥ kāmakāreṇa phale sakto nibadhyate


  sarvakarmāṇi manasā saṃnyasyāste sukhaṃ vaśī|


  navadvāre pure dehī naiva kurvanna kārayan'
translation: Yogins perform action by body, mind, understanding, and even by the senses
  alone, abandoning attachment, for purification of the self. The integrated, abandoning
  action’s fruit, attains steadfast peace; the non-integrated, by desire’s doing,
  attached to fruit, is bound. Having renounced all actions with the mind, the embodied
  one sits happily as master in the nine-gated city, neither acting nor causing to
  act.
commentary: 'Karma-yoga uses every instrument — kāya, manas, buddhi, indriyas — toward
  ātma-śuddhi, not toward harvest. The contested contrast is stark: yukta gains naiṣṭhikī
  śānti by fruit-abandonment; ayukta is bound by kāma-driven fruit-attachment. Then
  the royal image: the dehin sits as vaśī in the nine-gated city, mentally renouncing
  all actions — neither doing nor causing. This is not corpse-quietism; it is masterful
  inhabiting of the body-city without authorship fever. Existentially, purification
  is the right purpose of technique. If peace is unstable, check fruit-clinging. If
  authorship fever burns, practice mental saṃnyāsa while the gates still open and
  close in ordinary life. Multi-instrument action for self-purification relocates
  the purpose of technique away from harvest. Steadfast peace belongs to fruit-abandonment;
  bondage belongs to desire-driven fruit-attachment — a clean experimental contrast
  you can test this week. Mental renunciation in the nine-gated city then describes
  mastery: gates operate, authorship fever does not. Sit as master of the body-city
  without confusing stillness for corpsehood. Purification, peace, and non-causing
  are one curriculum.


  Key Terms:


  **ātmaśuddhi (आत्मशुद्धि)** — purification of the self -> purpose of yogins’ multi-instrument
  action -> relocates why one acts


  **naiṣṭhikī śānti (नैष्ठिकी शान्ति)** — steadfast/final peace -> peace of the yukta
  who dropped fruit -> not mood calm; established stillness


  **navadvāra pura (नवद्वार पुर)** — nine-gated city -> body with nine openings ->
  classical image for embodied life under inner mastery


  Cross-Tradition Resonances:


  **Marcus Aurelius on the body’s citadel:** Structural homology in inhabiting the
  bodily post without confusing it for the ruling center.

  *Divergence:* Stoic hegemonikon ethics differs from Gītā mental saṃnyāsa toward
  Brahman-peace.


  **Theravāda kāyagata sati:** Structural homology in working with body-gates without
  ownership fever.

  *Divergence:* Satipaṭṭhāna aims at insight into tilakkhaṇa; here the nine-gated
  sitting is framed as mental renunciation and non-causing.'
voice_of_siva: ''
abhyasa: 'Sit for ten minutes as “master in the nine-gated city”: notice doors of
  sense opening, renounce authorship mentally, then resume one task solely for purification
  rather than fruit.'
