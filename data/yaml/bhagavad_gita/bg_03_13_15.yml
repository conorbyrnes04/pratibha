sutra_id: BG_03_13_15
collection: Bhagavad Gita
section: chapter_03
title: Food, Rain, and Brahman Meet in Sacrifice
sanskrit: 'यज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः।


  भुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात्


  अन्नाद्भवन्ति भूतानि पर्जन्यादन्नसम्भवः।


  यज्ञाद्भवति पर्जन्यो यज्ञः कर्मसमुद्भवः


  कर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षरसमुद्भवम्।


  तस्मात्सर्वगतं ब्रह्म नित्यं यज्ञे प्रतिष्ठितम्'
transliteration: 'yajñaśiṣṭāśinaḥ santo mucyante sarvakilbiṣaiḥ|


  bhuñjate te tvaghaṃ pāpā ye pacantyātmakāraṇāt


  annādbhavanti bhūtāni parjanyādannasambhavaḥ|


  yajñādbhavati parjanyo yajñaḥ karmasamudbhavaḥ


  karma brahmodbhavaṃ viddhi brahmākṣarasamudbhavam|


  tasmātsarvagataṃ brahma nityaṃ yajñe pratiṣṭhitam'
translation: The good who eat the remainder of sacrifice are released from all evils;
  but those who cook for their own sake eat evil — they are the wicked. From food
  beings come to be; from rain comes food’s arising; from sacrifice rain comes to
  be; sacrifice arises from action. Know action as arisen from Brahman, and Brahman
  as arisen from the Imperishable [akṣara]; therefore the all-pervading Brahman is
  ever established in sacrifice.
commentary: 'Cooking for oneself alone is not ethically neutral nutrition; it is a
  rupture in a causal chain that runs from the Imperishable through Brahman, action,
  sacrifice, rain, food, and beings. The contested move is cosmological: Brahman is
  “all-pervading” yet “ever established in yajña,” so transcendence does not float
  above reciprocity — it indwells it. Eating the sacrificial remainder marks participation
  in a completed circuit; private cooking marks enclosure. In Vedānta-inflected reading,
  this does not reduce Brahman to ritual, but refuses a spirituality that claims the
  Absolute while exempting appetite from offering. Existentially, the chain makes
  every meal a metaphysical decision: am I continuing the world-circuit or sealing
  a private furnace? Release from evil is linked to eating as remainder, not as conquest.
  The Absolute’s omnipresence is tested at the stove. By tracing food back through
  rain and sacrifice to Brahman and the Imperishable, the Gītā refuses any spirituality
  that floats free of metabolism. The Absolute is not elsewhere than the meal; it
  is “ever established in sacrifice,” which means transcendence is tested in how appetite
  participates in circulation. Private cooking is therefore a metaphysical claim:
  “this nourishment terminates in me.” Remainder-eating is the opposite claim: “I
  receive after the offering has completed its arc.” Liberation’s early homework may
  be as ordinary as refusing to make the kitchen a temple of enclosure.


  Key Terms:


  **yajñaśiṣṭa (यज्ञशिष्ट)** — remainder of sacrifice -> what is eaten after offering
  has completed the circuit -> leftover as privilege of participation, not scrap


  **akṣara (अक्षर)** — a- + kṣar, “unperishing” -> the Imperishable source from which
  Brahman is said to arise in this chain -> “syllable” or “eternal” alone misses its
  place as origin-point of the sacrificial cosmos


  **ātmakāraṇa (आत्मकारण)** — for one’s own sake -> cooking oriented to private cause
  -> the precise hinge where nourishment becomes pāpa


  Cross-Tradition Resonances:


  **John 6 (bread and participation):** Structural homology in making eating a mode
  of communion rather than private fuel.

  *Divergence:* Johannine bread is christological gift; the Gītā’s food-chain is Vedic-cosmic
  and climaxed in Brahman’s establishment in yajña.


  **I Ching / agricultural omen traditions:** Structural homology linking right ritual-order
  to rain and fertility.

  *Divergence:* The Gītā philosophically seals the chain in Brahman-akṣara metaphysics,
  not only in seasonal omen logic.'
voice_of_siva: ''
abhyasa: Before eating, offer the first portion of attention — a pause, thanks, or
  share — so that intake begins as remainder of offering rather than as private cooking.
