title: The Roar That Splits the Hearts of Dhṛtarāṣṭra’s Sons
sanskrit: 'काश्यश्च परमेष्वासः शिखण्डी च महारथः।


  धृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः


  द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते।


  सौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक्


  स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत्।


  नभश्च पृथिवीं चैव तुमुलो व्यनुनादयन्'
transliteration: 'kāśyaśca parameṣvāsaḥ śikhaṇḍī ca mahārathaḥ|


  dhṛṣṭadyumno virāṭaśca sātyakiścāparājitaḥ


  drupado draupadeyāśca sarvaśaḥ pṛthivīpate|


  saubhadraśca mahābāhuḥ śaṅkhāndadhmuḥ pṛthakpṛthak


  sa ghoṣo dhārtarāṣṭrāṇāṃ hṛdayāni vyadārayat|


  nabhaśca pṛthivīṃ caiva tumulo vyanunādayan'
translation: The king of Kāśi, supreme among archers; Śikhaṇḍī the great chariot-warrior;
  Dhṛṣṭadyumna, Virāṭa, and unconquered Sātyaki; Drupada, the sons of Draupadī on
  every side, O lord of the earth; and the mighty-armed son of Subhadrā — each blew
  their conches separately. That roar tore open the hearts of Dhṛtarāṣṭra’s sons,
  and the tumult made both sky and earth reverberate.
commentary: 'Sound becomes ontological violence: it *tears hearts* (*hṛdayāni vyadārayat*).
  Before physical wounds, there is affective rupture. The contested claim is that
  the Pāṇḍava response is not merely louder; it is world-filling — sky and earth resound
  — while the Kaurava interior cracks. Epic poetics here stages asymmetry of morale
  as cosmic echo. For the listening king Dhṛtarāṣṭra, Sañjaya’s report is already
  a moral X-ray: your sons’ hearts fail under the other’s coherence. Existentially,
  this is the moment when a group’s shared clarity overwhelms another group’s brittle
  unity. The practice implication is severe: if your coalition cannot bear truth’s
  resonance, more weapons will not heal the tear. The Gītā prepares Arjuna’s later
  softness by first showing hardness cracking on the other side.


  Heart-rending sound is the epic’s way of saying that morale is already a battlefield.
  Before Arjuna breaks, the sons of Dhṛtarāṣṭra are shown as inwardly torn. The listener
  is being prepared to understand collapse as widespread human weather, not as one
  man’s private failure.


  Key Terms:


  **ghoṣa (घोष)** — roar/uproar → collective sonic force → “sound” misses its heart-rending
  agency.


  **vyadārayat (व्यदारयत्)** — tore asunder → affective splitting imaged as physical
  rending → “shook” softens the violence to the heart.


  **pṛthakpṛthak (पृथक्पृथक्)** — each separately → individuality inside chorus →
  “one by one” captures sequence but not the distributed agency of the host.


  Cross-Tradition Resonances:


  **Exodus 19:16–19 (trumpet and quaking at Sinai):** Both depict sound that remakes
  the world’s felt boundaries and human courage.

  *Divergence:* Sinai’s blast mediates covenant with God; here the blast mediates
  factional terror before a teaching on the Self.


  **Dōgen, Shōbōgenzō “Keisei Sanshoku”:** Both treat world-sound as capable of waking
  or shattering the heart.

  *Divergence:* Dōgen hears mountains and streams as sutra; the Gītā’s war-din is
  not yet liberation-sound but crisis-sound.'
