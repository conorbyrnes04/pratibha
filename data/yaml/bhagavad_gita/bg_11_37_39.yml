sutra_id: BG_11_37_39
collection: Bhagavad Gita
section: chapter_11
title: Why Should They Not Bow, Primordial?
sanskrit: 'कस्माच्च ते न नमेरन्महात्मन्


  गरीयसे ब्रह्मणोऽप्यादिकर्त्रे।


  अनन्त देवेश जगन्निवास


  त्वमक्षरं सदसत्तत्परं यत्


  त्वमादिदेवः पुरुषः पुराण


  स्त्वमस्य विश्वस्य परं निधानम्।


  वेत्तासि वेद्यं च परं च धाम


  त्वया ततं विश्वमनन्तरूप


  वायुर्यमोऽग्निर्वरुणः शशाङ्कः


  प्रजापतिस्त्वं प्रपितामहश्च।


  नमो नमस्तेऽस्तु सहस्रकृत्वः


  पुनश्च भूयोऽपि नमो नमस्ते'
transliteration: 'kasmācca te na nameranmahātman


  garīyase brahmaṇo''pyādikartre|


  ananta deveśa jagannivāsa


  tvamakṣaraṃ sadasattatparaṃ yat


  tvamādidevaḥ puruṣaḥ purāṇa


  stvamasya viśvasya paraṃ nidhānam|


  vettāsi vedyaṃ ca paraṃ ca dhāma


  tvayā tataṃ viśvamanantarūpa


  vāyuryamo''gnirvaruṇaḥ śaśāṅkaḥ


  prajāpatistvaṃ prapitāmahaśca|


  namo namaste''stu sahasrakṛtvaḥ


  punaśca bhūyo''pi namo namaste'
translation: And why should they not bow to You, O Great Self, greater even than Brahma,
  the first creator? O Infinite, Lord of gods, Abode of the world — You are the imperishable,
  being and non-being, and what is beyond. You are the first of gods, the ancient
  Person; You are this universe's supreme resting-place; You are knower and known
  and highest dwelling; by You the all is spread, O Endless Form.
commentary: 'Awe matures into ontology: terror drives precision. The contested move
  in this stretch of the vision is that praise: greater than brahma; imperishable;
  sat asat beyond; ancient person; knower known dwelling; all spread by endless form.
  Existentially the line forces a choice about how you relate to overwhelm, agency,
  and devotion after seeing. Do not aestheticize the theophany; let it revise what
  you think action, fear, and love are for. The chapter''s pedagogy moves from granted
  seeing to ethical-devotional walking; this unit is one step on that arc. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live
  one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.


  Key Terms:


  **ādi-kartṛ (आदिकर्तृ)** — passage key term -> Awe matures into ontology: terror
  drives precision. -> default gloss flattens the vision''s force

  **nidhāna (निधान)** — paired key term -> Praise: greater than Brahma; imperishable;
  sat asat beyond; ancient Person; knower known dwelling; all spread by endless form.
  -> soft translation misses structural role


  Cross-Tradition Resonances:


  **[Colossians 1]:** Structural kinship around cosmic hymn.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Svetasvatara praise]:** Shared pressure of cosmic hymn.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person
  disclosure.'
