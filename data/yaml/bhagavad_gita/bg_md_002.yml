translation: You are responsible for action, not for ownership of outcome. When motive
  collapses into result-claiming, action becomes anxiety-management. Yoga here means
  steady offering of precise effort while relinquishing possessive identity over consequences.
commentary: 'The claim is that bondage is produced less by action itself than by appropriation
  of action into egoic accounting. The counterintuitive move is that detachment in
  the Gita does not mean passivity; it means purified participation. Krishna does
  not permit Arjuna to retreat into inaction. He redefines freedom as non-possessive
  action at full intensity.


  This distinction is foundational for karma-yoga. If one clings to fruit, one''s
  nervous system becomes hostage to fluctuating conditions. If one renounces fruit
  while doing required work, action becomes a discipline of alignment rather than
  self-manufacture. Equanimity is therefore not emotional flatness; it is stability
  of orientation across gain and loss.


  Existentially, this teaching is extraordinarily practical in performance-driven
  culture. Burnout, moral compromise, and reactive decision-making often come from
  fruit-fixation: reputation, control, outcome certainty. The Gita''s remedy is not
  indifference but consecration: do what is right, as well as possible, for a truth
  greater than self-image. This shift preserves energy, sharpens judgment, and protects
  dignity under uncertainty. It also makes sustained service possible, because your
  identity no longer rises and falls with every external metric.


  Key Terms:


  **karma (कर्म)** - action/deed -> in this context, unavoidable participation in
  causal-moral life, not fate -> reducing to "destiny" obscures agency.


  **phala (फल)** - fruit/result -> the appropriated payoff of action that binds identity
  when clung to -> "result" misses the psychological possessiveness implied.


  **karma-yoga (कर्मयोग)** - yoga of action -> disciplined, non-possessive participation
  in duty -> "work ethic" is too shallow for its contemplative depth.


  **samatva (समत्व)** - equanimity/evenness -> stable inner balance across success/failure
  -> not emotional numbness but regulated clarity.


  Cross-Tradition Resonances:


  **Marcus Aurelius, Meditations 6.2 and 8.23:** Both insist on right action now without
  dependence on applause or guaranteed outcomes.

  *Divergence:* Marcus grounds in Stoic cosmopolis; Gita grounds in yoga, devotion,
  and dharma-theology.


  **Vijnana Bhairava Tantra 24:** Both show that releasing grasping at outcomes opens
  immediacy and finer attention.

  *Divergence:* VBT is technique-oriented phenomenology; Gita anchors in ethical action
  within social duty.


  **Plato, Republic IV (justice as right order):** Both prioritize right ordering
  of inner motives over external reward metrics.

  *Divergence:* Plato frames civic-psychic harmony; Gita integrates action-renunciation
  and God-orientation.'
