sutra_id: BG_16_13_15
collection: Bhagavad Gita
section: chapter_16
title: The Litany of the Inflated I
sanskrit: 'इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम्।इदमस्तीदमपि मे भविष्यति पुनर्धनम्

  असौ मया हतः शत्रुर्हनिष्ये चापरानपि।ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी

  आढ्योऽभिजनवानस्मि कोऽन्योऽस्ति सदृशो मया।यक्ष्ये दास्यामि मोदिष्य इत्यज्ञानविमोहिताः'
transliteration: 'idamadya mayā labdhamimaṃ prāpsye manoratham|idamastīdamapi me bhaviṣyati
  punardhanam

  asau mayā hataḥ śatrurhaniṣye cāparānapi|īśvaro''hamahaṃ bhogī siddho''haṃ balavānsukhī

  āḍhyo''bhijanavānasmi ko''nyo''sti sadṛśo mayā|yakṣye dāsyāmi modiṣya ityajñānavimohitāḥ'
translation: '''This has been gained by me today; this desire I will obtain; this
  is mine, and this wealth too will be mine again. That enemy has been slain by me,
  and I will slay others as well. I am the lord, I am the enjoyer, I am perfect, powerful,
  happy. I am wealthy and high-born; who else is like me? I will sacrifice, I will
  give, I will rejoice''—thus they are deluded by ignorance.'
commentary: 'Krishna ventriloquizes the āsuric interior monologue until it becomes
  unbearable to hear as one’s own. The contested pedagogical move is exposure by quotation:
  theology of the inflated I is not refuted first by argument but by being displayed.
  “I am īśvara” here is not Gītā theology; it is ego’s parody of lordship. Sacrifice
  and giving appear even here, but as self-celebration. Existentially, read the litany
  slowly and mark every clause that has passed through your mind this month. The demonic
  is often not monstrous; it is the ordinary first-person empire. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum
  label on a doctrine. The existential stake is that this teaching must change how
  you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **īśvaro’ham (ईश्वरोऽहम्)** — I am the lord -> egoic counterfeit of divine lordship
  -> ''empowerment'' can be its modern gloss.

  **aham bhogī (अहं भोगी)** — I am the enjoyer -> identity as consumer of experience
  -> ''I deserve nice things'' is the soft version.

  **ajñāna-vimohita (अज्ञानविमोहित)** — deluded by ignorance -> the litany’s cause
  -> ''confident'' may hide the same delusion.

  **manoratha (मनोरथ)** — wish-chariot / desire -> projected obtainables -> ''goals''
  can be neutral or āsuric.


  Cross-Tradition Resonances:


  **[Luke 12, rich fool]:** Self-talk of barns and security resonates strongly.

  *Divergence:* The parable ends in divine summons; Krishna continues into karmic-āsuric
  consequences.

  **[Buddhist asmi-māna]:** Conceit ''I am'' as deep bind is homologous.

  *Divergence:* Buddhism dismantles I-making; the Gītā contrasts false ''I am lord''
  with true refuge in the Lord.

  **[Stirner / egoist philosophy (contrast)]:** Ownness as ultimate is the modern
  cousin of this litany.

  *Divergence:* The Gītā names it ignorance-delusion, not emancipation.'
