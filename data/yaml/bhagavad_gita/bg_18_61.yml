sutra_id: BG_18_61
collection: Bhagavad Gita
section: chapter_18
title: The Lord Turns Beings Like a Machine
sanskrit: ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति।भ्रामयन्सर्वभूतानि यन्त्रारूढानि
  मायया
transliteration: īśvaraḥ sarvabhūtānāṃ hṛddeśe'rjuna tiṣṭhati|bhrāmayansarvabhūtāni
  yantrārūḍhāni māyayā
translation: The Lord dwells in the heart-region of all beings, O Arjuna, causing
  all beings to turn by His māyā, as if mounted on a machine.
commentary: 'One of the Gītā’s most exact images: Īśvara seated in the hṛd-deśa turns
  all beings by māyā as if yantrārūḍha—mounted on a machine. The contested claim intensifies
  18.59–60: compulsion is not blind nature only; it is the Lord’s māyā-engine. Existentially,
  this can crush or liberate. Crush if heard as cosmic sadism. Liberate if heard as
  the end of the fantasy that you are the sole engineer. The next verse will convert
  the image into refuge. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.


  Key Terms:


  **hṛd-deśa (हृद्देश)** — heart-region -> Lord’s dwelling -> ''feelings'' psychologizes.

  **bhrāmayan (भ्रामयन्)** — causing to turn/wander -> divine turning of beings ->
  ''manipulation'' is the suspicious mishearing.

  **yantrārūḍha (यन्त्रारूढ)** — mounted on a machine -> image of driven turning ->
  ''puppet'' is harsher than the text’s pastoral aim.

  **māyā (माया)** — measuring power / wondrous artifice -> means of turning -> ''illusion''
  alone understates agency.


  Cross-Tradition Resonances:


  **[Gītā 15.15 / heart-dweller]:** Indwelling continues into machine-turning image.

  *Divergence:* 18.61 makes the turning explicit via māyā.

  **[Plotinus on the One’s presence to souls]:** Inner turning source resonates loosely.

  *Divergence:* Plotinus avoids personal machine imagery; Krishna is starkly theistic-mechanical
  in metaphor.

  **[Calvinist providence debates (contrast)]:** Divine governance of actions resonates
  and diverges.

  *Divergence:* Productive divergence: Gītā’s image prepares śaraṇa, not merely decree-speculation.'
