sutra_id: BG_10_18_19
collection: Bhagavad Gita
section: chapter_10
title: No End to the Extent — Hear the Prominent
sanskrit: 'विस्तरेणात्मनो योगं विभूतिं च जनार्दन।


  भूयः कथय तृप्तिर्हि श्रृण्वतो नास्ति मेऽमृतम्


  श्री भगवानुवाच


  हन्त ते कथयिष्यामि दिव्या ह्यात्मविभूतयः।


  प्राधान्यतः कुरुश्रेष्ठ नास्त्यन्तो विस्तरस्य मे'
transliteration: 'vistareṇātmano yogaṃ vibhūtiṃ ca janārdana|


  bhūyaḥ kathaya tṛptirhi śrṛṇvato nāsti me''mṛtam


  śrī bhagavānuvāca


  hanta te kathayiṣyāmi divyā hyātmavibhūtayaḥ|


  prādhānyataḥ kuruśreṣṭha nāstyanto vistarasya me'
translation: 'Tell again at length Your own yoga and vibhūti, O Janārdana; for I find
  no satiety hearing Your nectar. The Blessed Lord said: Listen — I will tell you
  My divine self-powers, according to their prominence, O Best of Kurus; there is
  no end to My extent.'
commentary: 'Arjuna''s tṛpti-less hearing of amṛta requests expansion; Kṛṣṇa agrees
  but marks method: prādhānyataḥ — by prominence — because there is no end (nāsty
  anto) to His vistara. The contested humility of revelation is that even divine self-listing
  is sampling. Existentially this trains appetite without completion-compulsion: receive
  the prominent excellences as nectar, refuse the fantasy of exhausting God by catalog.
  Endless extent is not a bug in the teaching; it is the truth about the teacher.
  The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. Live one concrete implication of the claim before the day ends, so the argument
  becomes conduct rather than ornament.


  Key Terms:


  **prādhānyataḥ (प्राधान्यतः)** — according to prominence -> how vibhūtis will be
  told -> "main examples" is close; the point is ranked sampling of the endless

  **amṛta (अमृत)** — nectar/deathless -> what Arjuna cannot hear enough of -> "sweet
  words" misses deathless nourishment sense


  Cross-Tradition Resonances:


  **[Job 38 (whirlwind limits of cataloguing God)]:** Shared sense that divine extent
  exceeds listing.

  *Divergence:* Job''s theophany rebukes; Gītā''s Lord kindly samples by prominence.

  **[Dao De Jing 1 on the nameless/named]:** Shared inexhaustibility of the source.

  *Divergence:* Daoist namelessness vs Gītā''s endless named vibhūtis as nectar.'
