sutra_id: BG_14_15_17
collection: Bhagavad Gita
section: chapter_14
title: Fruits of the Guṇas
sanskrit: 'रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते।तथा प्रलीनस्तमसि मूढयोनिषु जायते

  कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम्।रजसस्तु फलं दुःखमज्ञानं तमसः फलम्

  सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च।प्रमादमोहौ तमसो भवतोऽज्ञानमेव च'
transliteration: 'rajasi pralayaṃ gatvā karmasaṅgiṣu jāyate|tathā pralīnastamasi mūḍhayoniṣu
  jāyate

  karmaṇaḥ sukṛtasyāhuḥ sāttvikaṃ nirmalaṃ phalam|rajasastu phalaṃ duḥkhamajñānaṃ
  tamasaḥ phalam

  sattvātsañjāyate jñānaṃ rajaso lobha eva ca|pramādamohau tamaso bhavato''jñānameva
  ca'
translation: Dying in rajas, one is born among those attached to action; likewise,
  dying in tamas, one is born in the wombs of the deluded. They say the fruit of good
  action is sattvic and stainless; the fruit of rajas is pain; the fruit of tamas
  is ignorance. From sattva, knowledge is born; from rajas, greed; from tamas arise
  negligence and delusion, and ignorance as well.
commentary: 'Postmortem destinations and present fruits are braided. Rajas leads to
  birth among karma-saṅgins; tamas into deluded wombs. Action’s fruit: sattvic stainlessness,
  rajasic pain, tamasic ignorance. Causally inverted and reinforced: sattva births
  knowledge, rajas greed, tamas negligence-delusion-ignorance. The contested claim
  is moral cosmology without cheap moralism—pain is not random punishment but rajas’s
  own yield. Ignorance is not an insult; it is tamas ripening. This loop explains
  why “trying harder” in a rajasic key often deepens pain, and why tamasic comfort
  deepens fog. Existentially, you can taste fruits now: the aftertaste of your actions
  already announces their guṇa. Liberation pedagogy uses that aftertaste as teacher
  before death makes the climate harder to revise. Watch especially the fruit that
  flatters you—stainlessness can intoxicate—and the fruit that shames you; both are
  teachers if not clutched. This is not ornamental theology; it is a demand that lived
  climate, ethical stance, and metaphysical claim stay braided in one practice of
  seeing.


  Key Terms:


  **karmasaṅgi (कर्मसङ्गि)** — one attached to action -> rajasic rebirth niche ->
  ''workaholic'' shrinks the ontological claim.

  **mūḍha-yoni (मूढयोनि)** — deluded womb -> tamasic birth matrix -> ''bad reincarnation''
  as cartoon misses epistemic darkness.

  **phala (फल)** — fruit -> intrinsic yield of guṇa-shaped action -> ''reward/punishment''
  externalizes what is ripening.

  **ajñāna (अज्ञान)** — ignorance -> tamas’s fruit and offspring -> ''not knowing
  facts'' understates delusive closure.


  Cross-Tradition Resonances:


  **[Karma theory in Manu / Dharmaśāstra]:** Action-fruit continuity resonates, but
  here fruit is guṇa-coded.

  *Divergence:* Dharmaśāstra often maps social duty; the Gītā maps psychological-cosmological
  ripening toward liberation.

  **[Stoic doctrine of consequences in character]:** Actions shape the agent who then
  inherits their world.

  *Divergence:* Stoicism centers assent and virtue; guṇa theory centers qualitative
  binders and rebirth.'
voice_of_siva: ''
abhyasa: 'After one significant action today, taste its fruit immediately: stainless
  clarity, agitated pain, or fog. Name the guṇa of the fruit.'
