collection: Bhagavad Gita
section: chapter_13
title: Who Sees, Truly Sees
sanskrit: 'समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्।विनश्यत्स्वविनश्यन्तं यः पश्यति
  स पश्यति

  समं पश्यन्हि सर्वत्र समवस्थितमीश्वरम्।न हिनस्त्यात्मनाऽऽत्मानं ततो याति परां गतिम्

  प्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः।यः पश्यति तथाऽऽत्मानमकर्तारं स पश्यति'
transliteration: 'samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram|vinaśyatsvavinaśyantaṃ
  yaḥ paśyati sa paśyati

  samaṃ paśyanhi sarvatra samavasthitamīśvaram|na hinastyātmanā''''tmānaṃ tato yāti
  parāṃ gatim

  prakṛtyaiva ca karmāṇi kriyamāṇāni sarvaśaḥ|yaḥ paśyati tathā''''tmānamakartāraṃ
  sa paśyati'
translation: The one who sees the supreme Lord standing equally in all beings, the
  undying in the dying—he truly sees. Seeing the Lord established equally everywhere,
  one does not injure the Self by the self; then one goes to the highest goal. The
  one who sees that actions are done entirely by nature alone, and thus sees the Self
  as non-doer—he truly sees.
commentary: '“He who sees, sees” (sa paśyati) is the chapter’s refrain of authentic
  vision. Equal standing of Parameśvara in all beings—and the undying within the dying—redefines
  perception itself. From this seeing comes ethics: one does not strike the Self with
  the self. Violence is revealed as metaphysical suicide, not merely interpersonal
  harm. Then the non-doer teaching: actions are wrought wholly by prakṛti; the ātman
  is akartā. The contested move is to unite theistic equality-vision with Sāṃkhya
  non-doership without letting either cancel the other. Existentially, true seeing
  ends both cruelty and the anxious claim “I am the sole author of this life.” Equal
  seeing is therefore the end of spiritual exceptionalism: if the Lord stands equally,
  your private drama of superiority loses its altar. Read as existential demand, the
  verse asks for a changed stance in the next difficult hour—not for ornamental agreement
  with a doctrine. Read as existential demand, the verse asks for a changed stance
  in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **sama (सम)** — equal / even -> Lord’s equal presence in all beings -> “fairness”
  moralizes what is ontological.

  **Parameśvara (परमेश्वर)** — supreme Lord -> the One standing in all fields -> “God”
  without equal immanence misses the ethical hinge.

  **na hinasti (न हिनस्ति)** — does not injure -> non-injury as consequence of equal
  seeing -> “becomes nice” misses Self-on-Self stakes.

  **akartā (अकर्ता)** — non-doer -> Self as not the agent of prakṛti’s actions ->
  “passive” wrongly implies limpness.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 6–7]:** Seeing all beings in the Self and the Self in all ends grief
  and delusion—close ethical homology.

  *Divergence:* Īśā is compact and ritual-renunciant; the Gītā explicitly ties equal
  seeing to non-doership of prakṛti’s actions.

  **[Spinoza, Ethics IV–V]:** Seeing things under a species of eternity reduces harm
  born of partial passion.

  *Divergence:* Spinoza’s God is substance known geometrically; Krishna’s Lord is
  personally addressed and equally stationed in beings.

  **[Śāntideva, BCA VIII (exchange of self and other)]:** Equalizing vision undermines
  harm.

  *Divergence:* Śāntideva uses imaginative exchange and emptiness; Krishna uses Lord-equality
  and prakṛti-agency.'
voice_of_siva: ''
abhyasa: Before speaking critically of someone, pause and see the undying in the dying
  field before you. Speak only after that seeing is even briefly available.
