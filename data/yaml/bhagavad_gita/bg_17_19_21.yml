title: Tamasic Austerity and the Three Givings
sanskrit: 'मूढग्राहेणात्मनो यत्पीडया क्रियते तपः।परस्योत्सादनार्थं वा तत्तामसमुदाहृतम्

  दातव्यमिति यद्दानं दीयतेऽनुपकारिणे।देशे काले च पात्रे च तद्दानं सात्त्विकं स्मृतम्

  यत्तु प्रत्युपकारार्थं फलमुद्दिश्य वा पुनः।दीयते च परिक्लिष्टं तद्दानं राजसं स्मृतम्'
transliteration: 'mūḍhagrāheṇātmano yatpīḍayā kriyate tapaḥ|parasyotsādanārthaṃ vā
  tattāmasamudāhṛtam

  dātavyamiti yaddānaṃ dīyate''nupakāriṇe|deśe kāle ca pātre ca taddānaṃ sāttvikaṃ
  smṛtam

  yattu pratyupakārārthaṃ phalamuddiśya vā punaḥ|dīyate ca parikliṣṭaṃ taddānaṃ rājasaṃ
  smṛtam'
translation: Austerity done with deluded grasping, with self-torture, or in order
  to destroy another is declared tamasic. Giving that is given because it ought to
  be given, to one who cannot give back, in right place, time, and to a worthy recipient—that
  giving is remembered as sattvic. But giving given for return favor, or with fruit
  in view, or given grudgingly—that giving is remembered as rajasic.
commentary: 'Tamasic tapas is named without romance: deluded fixation, self-torture,
  or harm of another. Then dāna enters the triad. Sattvic giving: ought-to-give, to
  non-reciprocators, right place-time-recipient. Rajasic giving: for return, for fruit,
  or with pain. The contested move makes generosity ethically precise. Existentially,
  many “kindnesses” are rajasic contracts. Sattvic dāna breaks the economy of return
  without becoming contemptuous of recipients. In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be
  read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics.


  Key Terms:


  **mūḍha-grāha (मूढग्राह)** — deluded grasping -> tamasic tapas motive -> ''stubborn
  discipline'' may hide it.

  **parasyotsādana (परस्योत्सादन)** — destroying another -> tapas as weapon -> ''competitive
  self-denial'' is a soft form.

  **anupakārin (अनुपकारिन्)** — one who does not return help -> sattvic recipient
  criterion -> ''networking charity'' fails it.

  **parikliṣṭa (परिक्लिष्ट)** — given with pain/grudge -> rajasic giving tone -> ''duty
  donation'' can sour into this.


  Cross-Tradition Resonances:


  **[Gītā 17.5–6 / 17.19]:** Demonic and tamasic austerity form a continuous warning.

  *Divergence:* Motive to destroy another makes tapas explicitly violent.

  **[Luke 14 on inviting those who cannot repay]:** Strong homology with anupakārin
  giving.

  *Divergence:* Luke’s banquet ethic is Kingdom-shaped; Krishna maps it as sattvic
  dāna.

  **[Seneca on benefits]:** Giving and return calculus is a classical parallel.

  *Divergence:* Seneca philosophizes benefits; the Gītā guṇa-codes giving for liberation
  pedagogy.'
