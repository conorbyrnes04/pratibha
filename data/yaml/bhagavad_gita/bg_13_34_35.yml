collection: Bhagavad Gita
section: chapter_13
title: The Sun of the Field, the Eye of Knowledge
sanskrit: 'यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः।


  क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत

  क्षेत्रक्षेत्रज्ञयोरेवमन्तरं ज्ञानचक्षुषा।


  भूतप्रकृतिमोक्षं च ये विदुर्यान्ति ते परम्'
transliteration: 'yathā prakāśayatyekaḥ kṛtsnaṃ lokamimaṃ raviḥ|


  kṣetraṃ kṣetrī tathā kṛtsnaṃ prakāśayati bhārata

  kṣetrakṣetrajñayorevamantaraṃ jñānacakṣuṣā|


  bhūtaprakṛtimokṣaṃ ca ye viduryānti te param'
translation: As the one sun illumines this whole world, so the Lord of the field illumines
  the whole field, O Bhārata. Those who know, with the eye of knowledge, this distinction
  between field and knower of the field, and the liberation of beings from nature—they
  go to the Supreme.
commentary: 'The chapter closes with light. One sun, whole world; one kṣetrī, whole
  field. Illumination is not an extra act layered onto matter; it is the knower’s
  very presence as light. The eye of knowledge (jñāna-cakṣus) sees the antara—the
  difference—between field and knower, and also bhūta-prakṛti-mokṣa: liberation of
  beings from nature. The contested final claim is that discrimination and release
  belong together. Seeing the difference is already the beginning of freedom from
  prakṛti’s claim. Existentially, you do not wait to leave the world to be free of
  nature’s bondage; you learn to see the sun that was lighting the field all along,
  and in that seeing, go to the Supreme. Going to the Supreme is thus not a travel
  plan after discrimination; discrimination itself is already sunlight learning to
  notice the sun. Read as existential demand, the verse asks for a changed stance
  in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **kṣetrī (क्षेत्री)** — lord/owner of the field -> the illumining knower -> “soul”
  misses the solar metaphor’s public radiance.

  **prakāśayati (प्रकाशयति)** — illumines -> knowing as lighting-up of the field ->
  “reveals” can sound merely informational.

  **jñāna-cakṣus (ज्ञानचक्षुस्)** — eye of knowledge -> discriminative vision as organ
  of liberation -> “insight” can stay psychological.

  **antara (अन्तर)** — distinction / interval / difference -> the liberating cut between
  field and knower -> “inner” mistranslates the philosophical sense here.

  **prakṛti-mokṣa (प्रकृतिमोक्ष)** — liberation from nature -> release of beings from
  prakṛti’s binding -> “escape from matter” can sound dualistically crude.


  Cross-Tradition Resonances:


  **[Plato, Republic VI–VII (sun and cave)]:** The sun as analogue of the Good that
  lights knowables is structural kin.

  *Divergence:* Plato’s sun serves dialectic ascent to forms; Krishna’s sun-knower
  illumines the field for discriminative release into the Supreme.

  **[Kaṭha Upaniṣad II.2.15 / Śvetāśvatara VI.14]:** When That shines, all shines
  after it—light-of-lights homology.

  *Divergence:* Those Upaniṣads climax in metaphysical radiance; the Gītā ties the
  solar image explicitly to kṣetra/kṣetrajña difference.

  **[Dzogchen “self-knowing awareness” as lamp]:** Awareness lighting appearance without
  being identical to appearance.

  *Divergence:* Dzogchen emphasizes primordial purity beyond effort; the Gītā still
  foregrounds the eye of knowledge and going to the Supreme.'
voice_of_siva: ''
abhyasa: 'At sunset or beside a lamp, contemplate: “As this light shows the room,
  awareness shows the field.” Rest in the lighting, not in the furniture of experience.'
