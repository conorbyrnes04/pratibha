sutra_id: BG_18_53
collection: Bhagavad Gita
section: chapter_18
title: Fit for Becoming Brahman
sanskrit: अहङ्कारं बलं दर्पं कामं क्रोधं परिग्रहम्।विमुच्य निर्ममः शान्तो ब्रह्मभूयाय
  कल्पते
transliteration: ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ parigraham|vimucya nirmamaḥ
  śānto brahmabhūyāya kalpate
translation: Having abandoned egoism, force, pride, desire, anger, and possession;
  without 'mine,' peaceful—one is fit for becoming Brahman.
commentary: 'The list of abandonments is the doorway to brahma-bhūya fitness: ahaṅkāra,
  bala, darpa, kāma, krodha, parigraha—then nirmama and śānta. The contested claim
  is fitness language: not “I am Brahman by slogan,” but kalpate—one becomes capable/fit.
  Existentially, each abandoned item is a throne. Peace is not a spa mood; it is what
  remains when mine-ing and aggression stop recruiting the psyche. This verse is the
  hinge into the bhakti climax. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics.


  Key Terms:


  **brahma-bhūyāya kalpate (ब्रह्मभूयाय कल्पते)** — becomes fit for becoming Brahman
  -> capability language -> ''enlightened already'' skips fitness.

  **nirmama (निर्मम)** — without mine-making -> non-possessiveness -> ''minimalism''
  can be aesthetic counterfeit.

  **parigraha (परिग्रह)** — grasping/possession -> to be abandoned -> ''stuff'' only
  is too material; it includes psychic holding.

  **śānta (शान्त)** — peaceful -> fruit of the abandonments -> ''calm persona'' can
  mask control.


  Cross-Tradition Resonances:


  **[Gītā 2.71 / desire-peace]:** Peace after leaving longing resonates.

  *Divergence:* 18.53 makes a whole cluster of abandonments the fitness for Brahman-being.

  **[Yoga Sūtra II.30 aparigraha]:** Non-possession as yama is homologous.

  *Divergence:* Patañjali’s yamas support aṣṭāṅga; here they open brahma-bhūya and
  then supreme bhakti.

  **[Meister Eckhart on detachment]:** Abandoning possession and ego for God-ground
  resonates.

  *Divergence:* Eckhart pushes into Godhead; Krishna turns next to madbhakti.'
