sutra_id: BG_04_39_41
collection: Bhagavad Gita
section: chapter_04
title: Faith Gains Knowledge; Doubt Destroys
sanskrit: 'श्रद्धावाँल्लभते ज्ञानं तत्परः संयतेन्द्रियः।


  ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति


  अज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति।


  नायं लोकोऽस्ति न परो न सुखं संशयात्मनः


  योगसंन्यस्तकर्माणं ज्ञानसंछिन्नसंशयम्।


  आत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय'
transliteration: 'śraddhāvā~llabhate jñānaṃ tatparaḥ saṃyatendriyaḥ|


  jñānaṃ labdhvā parāṃ śāntimacireṇādhigacchati


  ajñaścāśraddadhānaśca saṃśayātmā vinaśyati|


  nāyaṃ loko''sti na paro na sukhaṃ saṃśayātmanaḥ


  yogasaṃnyastakarmāṇaṃ jñānasaṃchinnasaṃśayam|


  ātmavantaṃ na karmāṇi nibadhnanti dhanañjaya'
translation: The faith-filled person, devoted to that, senses restrained, gains knowledge;
  having gained knowledge, attains the supreme peace before long. The unknowing, the
  unfaithing, and the doubt-self perish; for the doubt-self there is neither this
  world nor the other nor happiness. Actions do not bind the one whose actions are
  renounced through yoga, whose doubt is cut by knowledge, who is self-possessed,
  Dhanañjaya.
commentary: 'Śraddhā, one-pointed intent, and sense-restraint are the triad that gains
  jñāna; jñāna then yields supreme śānti swiftly. The contested severity falls on
  saṃśayātman: doubt destroys access to this world, the other, and happiness. This
  is not a ban on inquiry (paripraśna was commanded); it is a diagnosis of corrosive
  unresolved suspicion that cannot commit. The liberated profile follows: karma renounced
  via yoga, doubt cut by knowledge, ātman-possessed — then actions do not bind. Existentially,
  distinguish living questions from identity-as-doubt. The first seeks; the second
  sabotages every world it enters. Peace is not awarded to the cleverly suspended.
  Inquiry was commanded earlier; identity-as-doubt is condemned here. The difference
  is commitment: questions seek, saṃśayātman suspends until life itself becomes uninhabitable.
  Faith, restraint, and intent gain knowledge; knowledge yields peace; yoga-renounced
  action plus cut doubt leaves the self-possessed unbound. Peace is not awarded to
  clever suspension. Convert corrosive doubt into either precise question or restrained
  experiment — then let knowledge cut what remains.


  Key Terms:


  **śraddhā (श्रद्धा)** — faith/trustful receptivity -> condition for gaining knowledge
  -> not blind belief; committed openness with restraint


  **saṃśayātman (संशयात्मन्)** — doubt as one’s self -> identity structured by unresolved
  suspicion -> denser than occasional questioning


  **jñānasaṃchinnasaṃśaya (ज्ञानसंछिन्नसंशय)** — doubt cut by knowledge -> knowledge’s
  surgical function -> peace’s prerequisite alongside yogic renunciation of actions


  Cross-Tradition Resonances:


  **Augustine on credo ut intellegam:** Structural homology in trust enabling understanding
  rather than following after exhaustive proof.

  *Divergence:* Augustinian faith is christological-ecclesial; śraddhā here is yogic-receptive
  toward liberating jñāna under Krishna.


  **Pyrrhonian skepticism vs Gītā’s saṃśaya warning:** Structural homology inverted
  — suspension as therapy vs suspension as ruin.

  *Divergence:* Pyrrhonism seeks ataraxia via epochē; the Gītā finds śānti via knowledge
  that cuts doubt after faithful practice.'
