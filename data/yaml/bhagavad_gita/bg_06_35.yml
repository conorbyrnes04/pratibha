sutra_id: BG_06_35
collection: Bhagavad Gita
section: chapter_06
title: Practice and Dispassion Take the Mind
sanskrit: 'श्री भगवानुवाच


  असंशयं महाबाहो मनो दुर्निग्रहं चलं।


  अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते'
transliteration: 'śrī bhagavānuvāca


  asaṃśayaṃ mahābāho mano durnigrahaṃ calaṃ|


  abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate'
translation: 'The Blessed Lord said: Without doubt, O mighty-armed, the mind is hard
  to restrain and moving; but by practice and by dispassion, Kaunteya, it is grasped.'
commentary: 'Krishna validates Arjuna completely — asaṃśayam, durnigraham, calam —
  then gives the dual means: abhyāsa and vairāgya. The contested sufficiency is this
  pair alone as the grasp (gṛhyate) of mind. In yoga’s classical binary, repetition
  without dispassion breeds tense obsession; dispassion without practice breeds limp
  drift. Existentially, ask which wing is weak. Strengthen both. The wind is real;
  so is the holding that comes from trained return plus released craving. Validation
  plus means: the mind truly is hard to restrain, and it is held by practice and dispassion
  together. Repetition without dispassion tenses; dispassion without repetition drifts.
  Strengthen the weak wing. Wind remains wind; graspability grows where both operate.
  This pair is sufficient doctrine against both despair and technique-hoarding. The
  contested force of the passage remains practical: it asks for a change in how you
  inhabit action, attention, and relation — not for ornamental agreement. Return to
  the line until the claim bites a live decision today.


  Key Terms:


  **abhyāsa (अभ्यास)** — practice/repetition -> repeated yoking that stabilizes ->
  not intensity once; constancy


  **vairāgya (वैराग्य)** — dispassion/non-coloring -> release of passionate coloring
  toward objects -> the cooling complement of practice


  Cross-Tradition Resonances:


  **Patañjali YS 1.12:** Structural homology in explicit abhyāsa-vairāgya pair for
  citta-nirodha.

  *Divergence:* Patañjali elaborates definitions in sūtra sequence; the Gītā states
  the pair as direct answer to wind-mind.


  **Desert elders on watchfulness and detachment:** Structural homology in dual discipline
  of return and non-clinging.

  *Divergence:* Christian watchfulness is prayer-centered; here the pair grasps manas
  for sāmya-yoga.'
voice_of_siva: ''
abhyasa: 'Today combine both: ten returns of attention (abhyāsa) and one deliberate
  release of a craving-coloring (vairāgya); notice the mind become more graspable.'
