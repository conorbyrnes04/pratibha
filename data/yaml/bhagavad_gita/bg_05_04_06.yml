sutra_id: BG_05_04_06
collection: Bhagavad Gita
section: chapter_05
title: Children Split What Knowers Unify
sanskrit: 'सांख्ययोगौ पृथग्बालाः प्रवदन्ति न पण्डिताः।


  एकमप्यास्थितः सम्यगुभयोर्विन्दते फलम्


  यत्सांख्यैः प्राप्यते स्थानं तद्योगैरपि गम्यते।


  एकं सांख्यं च योगं च यः पश्यति स पश्यति


  संन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः।


  योगयुक्तो मुनिर्ब्रह्म नचिरेणाधिगच्छति'
transliteration: 'sāṃkhyayogau pṛthagbālāḥ pravadanti na paṇḍitāḥ|


  ekamapyāsthitaḥ samyagubhayorvindate phalam


  yatsāṃkhyaiḥ prāpyate sthānaṃ tadyogairapi gamyate|


  ekaṃ sāṃkhyaṃ ca yogaṃ ca yaḥ paśyati sa paśyati


  saṃnyāsastu mahābāho duḥkhamāptumayogataḥ|


  yogayukto munirbrahma nacireṇādhigacchati'
translation: Children say Sāṃkhya and Yoga are separate, not the wise; established
  properly in even one, one finds the fruit of both. The place reached by the Sāṃkhyas
  is also gone to by the Yogas; who sees Sāṃkhya and Yoga as one — that one sees.
  But renunciation, O mighty-armed, is hard to attain without yoga; the sage yoked
  to yoga reaches Brahman before long.
commentary: 'Sectarian splitting of Sāṃkhya and Yoga is called childish. The contested
  seeing is identity of destination: the same sthāna is reached by both when rightly
  established, and only the one who sees them as one truly sees. Then a practical
  warning: saṃnyāsa without yoga is duḥkha to attain; the yoga-yukta muni reaches
  Brahman swiftly. In the Gītā’s synthesis, contemplative discrimination and engaged
  yoga are not rival brands but convergent means. Existentially, stop collecting identities
  (knower vs doer) as status. If your renunciation lacks yogic yoking, expect suffering,
  not arrival. Vision that unifies the two is itself a mark of maturity. Childish
  splitting of Sāṃkhya and Yoga protects identity brands at the cost of seeing. Right
  establishment in either yields both fruits because the destination is one standing.
  Renunciation without yoga is painful precisely because unyoked quitting leaves desire
  intact while removing structure. The sage yoked in yoga reaches Brahman swiftly
  because means and end are already aligned. Mature vision unifies what immature speech
  divides.


  Key Terms:


  **sāṃkhya (सांख्य)** — enumeration/discriminative school -> here the knowledge-orientation
  converging with yoga -> not merely classical dualist system in this verse’s pedagogical
  use


  **sthāna (स्थान)** — standing/place -> shared destination of both approaches ->
  grounds anti-sectarian claim


  **ayogataḥ (अयोगतः)** — without yoga -> condition that makes renunciation hard and
  painful -> warns against unyoked quitting


  Cross-Tradition Resonances:


  **Augustine on Mary and Martha:** Structural homology in refusing final rivalry
  between contemplative and active lives when ordered to one end.

  *Divergence:* Christian ordering is love of God in Christ; here Sāṃkhya-Yoga identity
  is pedagogical toward Brahman via yoga-yoking.


  **Zhu Xi’s unity of knowledge and action:** Structural homology in attacking splits
  that treat knowing and doing as separable completions.

  *Divergence:* Neo-Confucian unity is moral-li cultivation; the Gītā frames unity
  as shared sthāna and warns saṃnyāsa without yoga.'
voice_of_siva: ''
abhyasa: If you favor “knowing” over “doing” (or the reverse), practice the neglected
  pole for one hour as the same path’s other foot, aiming at one destination.
