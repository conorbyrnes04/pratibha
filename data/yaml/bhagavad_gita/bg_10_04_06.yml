sutra_id: BG_10_04_06
collection: Bhagavad Gita
section: chapter_10
title: Every State of Being From Me Alone
sanskrit: 'बुद्धिर्ज्ञानमसंमोहः क्षमा सत्यं दमः शमः।


  सुखं दुःखं भवोऽभावो भयं चाभयमेव च


  अहिंसा समता तुष्टिस्तपो दानं यशोऽयशः।


  भवन्ति भावा भूतानां मत्त एव पृथग्विधाः


  महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा।


  मद्भावा मानसा जाता येषां लोक इमाः प्रजाः'
transliteration: 'buddhirjñānamasaṃmohaḥ kṣamā satyaṃ damaḥ śamaḥ|


  sukhaṃ duḥkhaṃ bhavo''bhāvo bhayaṃ cābhayameva ca


  ahiṃsā samatā tuṣṭistapo dānaṃ yaśo''yaśaḥ|


  bhavanti bhāvā bhūtānāṃ matta eva pṛthagvidhāḥ


  maharṣayaḥ sapta pūrve catvāro manavastathā|


  madbhāvā mānasā jātā yeṣāṃ loka imāḥ prajāḥ'
translation: Discernment, knowledge, non-delusion, patience, truth, sense-restraint,
  inner quiet; pleasure and pain, being and non-being, fear and fearlessness; non-violence,
  equanimity, contentment, austerity, giving, fame and disgrace — the manifold states
  of beings arise from Me alone. The seven great seers of old and the four Manus were
  born of My mind; from them come these creatures of the world.
commentary: 'Psychology and cosmology share one source. The list mixes virtues, affects,
  and dualities — all bhāvas of beings arise matta eva. Even the ancestral mind-born
  seers and Manus are mad-bhāva. The contested move is that moral excellences and
  painful dualities alike are not self-grounded. Existentially this blocks both spiritual
  pride ("my sattva is mine") and despair ("my fear is ultimate"). States arise from
  the Lord; they are not private property. Recognition relativizes mood without denying
  responsibility for how you ride a state. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **bhāva (भाव)** — state/becoming -> manifold conditions of beings arising from Kṛṣṇa
  -> "mood" is far too thin

  **asaṃmoha (असंमोह)** — non-delusion -> listed among states arising from Me -> "clarity"
  misses freedom from moha as divine-sourced


  Cross-Tradition Resonances:


  **[Stoic classification of affects under logos]:** Both refuse to treat inner states
  as self-originating absolutes.

  *Divergence:* Stoicism centers prohairesis; Gītā sources bhāvas in the Lord and
  mind-born progenitors.

  **[Sāṃkhya guṇa psychology]:** Shared mapping of experiential states.

  *Divergence:* Sāṃkhya keeps prakṛti autonomous; Gītā says states arise from Me alone.'
voice_of_siva: ''
abhyasa: 'When a strong state arises (fear, pride, calm), mark once: "from Me alone
  — not my private absolute." Then choose the next right action.'
