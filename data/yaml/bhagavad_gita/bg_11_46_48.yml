sutra_id: BG_11_46_48
collection: Bhagavad Gita
section: chapter_11
title: Show Again the Four-Armed Form
sanskrit: 'किरीटिनं गदिनं चक्रहस्त


  मिच्छामि त्वां द्रष्टुमहं तथैव।


  तेनैव रूपेण चतुर्भुजेन


  सहस्रबाहो भव विश्वमूर्ते


  श्री भगवानुवाच


  मया प्रसन्नेन तवार्जुनेदं


  रूपं परं दर्शितमात्मयोगात्।


  तेजोमयं विश्वमनन्तमाद्यं


  यन्मे त्वदन्येन न दृष्टपूर्वम्


  न वेदयज्ञाध्ययनैर्न दानै


  र्न च क्रियाभिर्न तपोभिरुग्रैः।


  एवंरूपः शक्य अहं नृलोके


  द्रष्टुं त्वदन्येन कुरुप्रवीर'
transliteration: 'kirīṭinaṃ gadinaṃ cakrahasta


  micchāmi tvāṃ draṣṭumahaṃ tathaiva|


  tenaiva rūpeṇa caturbhujena


  sahasrabāho bhava viśvamūrte


  śrī bhagavānuvāca


  mayā prasannena tavārjunedaṃ


  rūpaṃ paraṃ darśitamātmayogāt|


  tejomayaṃ viśvamanantamādyaṃ


  yanme tvadanyena na dṛṣṭapūrvam


  na vedayajñādhyayanairna dānai


  rna ca kriyābhirna tapobhirugraiḥ|


  evaṃrūpaḥ śakya ahaṃ nṛloke


  draṣṭuṃ tvadanyena kurupravīra'
translation: 'I wish to see You just so, crowned, with mace and discus in hand, in
  that very four-armed form. The Blessed Lord said: By My grace this supreme form
  has been shown by My self-yoga — luminous, all, endless, primal — unseen before
  by other than you. Not by Veda-sacrifice-study, nor gifts, nor rites, nor severe
  austerities can I be seen in such a form in the human world by any other than you,
  O Hero of the Kurus.'
commentary: 'Grace over technique-stacking; you cannot force visvarupa. The contested
  move in this stretch of the vision is that arjuna wants four-armed form; krishna:
  shown by grace self-yoga; not by veda gift rite austerity for any other. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion
  after seeing. Do not aestheticize the theophany; let it revise what you think action,
  fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **caturbhuja (चतुर्भुज)** — passage key term -> Grace over technique-stacking; you
  cannot force visvarupa. -> default gloss flattens the vision''s force

  **ātma-yoga (आत्मयोग)** — paired key term -> Arjuna wants four-armed form; Krishna:
  shown by grace self-yoga; not by Veda gift rite austerity for any other. -> soft
  translation misses structural role


  Cross-Tradition Resonances:


  **[Paul grace]:** Structural kinship around gift over works.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Zen anti-attainment]:** Shared pressure of gift over works.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person
  disclosure.'
