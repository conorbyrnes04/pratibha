sutra_id: BG_18_40_42
collection: Bhagavad Gita
section: chapter_18
title: No One on Earth Is Guṇa-Free; Duties by Nature
sanskrit: 'न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः।सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः
  स्यात्ित्रभिर्गुणैः

  ब्राह्मणक्षत्रियविशां शूद्राणां च परंतप।कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः

  शमो दमस्तपः शौचं क्षान्तिरार्जवमेव च।ज्ञानं विज्ञानमास्तिक्यं ब्रह्मकर्म स्वभावजम्'
transliteration: 'na tadasti pṛthivyāṃ vā divi deveṣu vā punaḥ|sattvaṃ prakṛtijairmuktaṃ
  yadebhiḥ syātitrabhirguṇaiḥ

  brāhmaṇakṣatriyaviśāṃ śūdrāṇāṃ ca paraṃtapa|karmāṇi pravibhaktāni svabhāvaprabhavairguṇaiḥ

  śamo damastapaḥ śaucaṃ kṣāntirārjavameva ca|jñānaṃ vijñānamāstikyaṃ brahmakarma
  svabhāvajam'
translation: There is no being on earth or among the gods in heaven who is free from
  these three guṇas born of nature. The actions of brāhmaṇas, kṣatriyas, vaiśyas,
  and of śūdras, O scorcher of foes, are allotted by the guṇas arising from their
  own nature. Calm, restraint, austerity, purity, forbearance, uprightness, knowledge,
  realized knowledge, and faith—are the natural-born action of a brāhmaṇa.
commentary: 'Universal bondage under guṇas sets up svabhāva duty: no earthly or heavenly
  being is free of the three. Varṇa-actions are pravibhakta by svabhāva-guṇas. Brāhmaṇa-karma
  is listed as śama-dama-tapas, purity, forbearance, uprightness, jñāna-vijñāna-āstikya.
  The contested modern difficulty is varṇa language. Within the text’s logic, the
  claim is that work arises from nature-born qualities, not from costume. Existentially,
  read for the principle: your path is not arbitrary preference, nor mere external
  assignment; it is recognizable in the guṇa-shape of your powers—and must be held
  without ego-inflation or contempt. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only
  how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **svabhāva-prabhava guṇa (स्वभावप्रभव गुण)** — guṇas arising from own nature ->
  basis of allotted actions -> ''personality type'' flattens cosmology.

  **śama-dama (शमदम)** — calm and restraint -> brāhmaṇa marks -> ''chill and self-control''
  understates yogic force.

  **vijñāna (विज्ञान)** — realized/practical knowledge -> paired with jñāna -> ''skills''
  is thinner.

  **āstikya (आस्तिक्य)** — affirming stance toward Veda/real -> brāhmaṇa-karma element
  -> ''theism'' as modern identity is inexact.


  Cross-Tradition Resonances:


  **[Gītā 4.13]:** Varṇa by guṇa-karma continues.

  *Divergence:* 18.40–42 insist universal guṇa-bondage then nature-born allotment.

  **[Plato’s Republic class functions (loose)]:** Functions by nature resonate cautiously.

  *Divergence:* Plato’s city myth differs; the Gītā ties duties to guṇas and later
  to worship through svakarma.

  **[Modern critiques of caste]:** Historical harms require ethical vigilance in reception.

  *Divergence:* Productive divergence: the text’s philosophical hinge is svabhāva-guṇa
  and liberation via own-duty, not social domination as end.'
