sutra_id: BG_01_02_04
collection: Bhagavad Gita
section: chapter_01
title: Seeing the Enemy Array Makes Fear Speak as Strategy
sanskrit: 'सञ्जय उवाच


  दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा।


  आचार्यमुपसङ्गम्य राजा वचनमब्रवीत्


  पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम्।


  व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता


  अत्र शूरा महेष्वासा भीमार्जुनसमा युधि।


  युयुधानो विराटश्च द्रुपदश्च महारथः'
transliteration: 'sañjaya uvāca


  dṛṣṭvā tu pāṇḍavānīkaṃ vyūḍhaṃ duryodhanastadā|


  ācāryamupasaṅgamya rājā vacanamabravīt


  paśyaitāṃ pāṇḍuputrāṇāmācārya mahatīṃ camūm|


  vyūḍhāṃ drupadaputreṇa tava śiṣyeṇa dhīmatā


  atra śūrā maheṣvāsā bhīmārjunasamā yudhi|


  yuyudhāno virāṭaśca drupadaśca mahārathaḥ'
translation: 'Sañjaya said: Seeing the Pāṇḍava army drawn up in array, King Duryodhana
  then approached his teacher and spoke these words: “Look, Ācārya, at this great
  army of Pāṇḍu’s sons, arrayed by your brilliant disciple, the son of Drupada. Here
  are heroes, mighty archers, equals of Bhīma and Arjuna in battle — Yuyudhāna, Virāṭa,
  and Drupada the great chariot-warrior.”'
commentary: 'Power begins its speech by recruiting the teacher’s gaze. Duryodhana
  does not confess fear; he converts anxiety into inventory. The counterintuitive
  move is that naming the enemy’s excellence before one’s own guru is already a political
  act: it binds Droṇa’s loyalty by reminding him that the array’s architect is *his*
  student. Strategy here is affective management. The list of heroes is not neutral
  intelligence; it is the mind trying to stabilize threat by cataloguing it. In the
  Mahābhārata’s ethics of war, this moment shows how *adharma* often wears the face
  of competent briefing. Existentially, notice how quickly you turn dread into briefing
  memos — how “look at them” becomes a way not to look at yourself. The verse sequence
  teaches that the first battlefield is the need to control another’s attention when
  your own ground is shaking.


  The epic lets us watch fear invent a useful voice. Duryodhana’s inventory is competent
  and already compromised, because it uses the teacher as a tool of reassurance rather
  than as a mirror of dharma. When you next feel the urge to brief someone into protecting
  your panic, remember this approach to the ācārya: it is the moment to ask whether
  you want clarity or capture.


  Key Terms:


  **vyūḍha (व्यूढ)** — drawn up / arrayed → military formation as visible order of
  intent → “arranged” misses the deliberate geometry of confrontation.


  **ācārya (आचार्य)** — one who teaches by conduct → Droṇa as ethical-martial authority
  being enlisted → “teacher” alone misses the authority Duryodhana is trying to capture.


  **mahāratha (महारथ)** — great chariot-warrior → graded martial excellence in epic
  taxonomy → “great warrior” flattens the technical rank the list is performing.


  Cross-Tradition Resonances:


  **Thucydides, History of the Peloponnesian War I.1–I.23:** Both open conflict with
  speeches that convert fear into strategic reckoning before blows fall.

  *Divergence:* Thucydides analyzes power through historical causation; the Gītā embeds
  the briefing inside a dharma-crisis that will soon become yoga teaching.


  **Sunzi, Art of War I:** Both treat assessment of forces as the first act of war-knowledge.

  *Divergence:* Sunzi aims at victory through calculation; here the calculation already
  reveals moral capture of the teacher-student bond.'
voice_of_siva: ''
abhyasa: 'When anxiety rises today, pause before briefing anyone: name one fear you
  are converting into “useful information,” and state it as fear first.'
