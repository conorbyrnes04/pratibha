sutra_id: BG_09_10_12
collection: Bhagavad Gita
section: chapter_09
title: Nature Under Witness — Fools Scorn
sanskrit: 'मयाऽध्यक्षेण प्रकृतिः सूयते सचराचरम्।


  हेतुनाऽनेन कौन्तेय जगद्विपरिवर्तते


  अवजानन्ति मां मूढा मानुषीं तनुमाश्रितम्।


  परं भावमजानन्तो मम भूतमहेश्वरम्


  मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः।


  राक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः'
transliteration: 'mayā''dhyakṣeṇa prakṛtiḥ sūyate sacarācaram|


  hetunā''nena kaunteya jagadviparivartate


  avajānanti māṃ mūḍhā mānuṣīṃ tanumāśritam|


  paraṃ bhāvamajānanto mama bhūtamaheśvaram


  moghāśā moghakarmāṇo moghajñānā vicetasaḥ|


  rākṣasīmāsurīṃ caiva prakṛtiṃ mohinīṃ śritāḥ'
translation: Under My supervision, nature gives birth to the moving and unmoving;
  by this cause, O Son of Kuntī, the world revolves. Fools scorn Me when I dwell in
  a human body, not knowing My higher being as the great Lord of beings. Of vain hopes,
  vain actions, vain knowledge, mindless — they resort to a deluding rākṣasa and āsura
  nature.
commentary: 'Nature produces the world under the Lord''s supervision, so mechanism
  never replaces sovereignty. Then the scandal: fools despise the human form the Lord
  assumes, ignorant of His higher being as great Lord of beings. Vain hope, action,
  and knowledge name the sterility of that scorn. Existentially this confronts spirituality
  that accepts abstract Absolute but recoils at God in vulnerable flesh — and materialism
  that sees only the shell. Scorning that presence is not sophistication; it is delusion
  with a résumé. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not
  change in ordinary time, the claim will not hold when pressure rises. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. Live one concrete implication of the claim before
  the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **human form scorned** — Sanskrit technical force in this passage -> fools miss
  higher being in human body -> default English flattens the contested philosophical
  work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the
  verse does with the term -> "bhakti" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> fools
  miss higher being in human body -> reducing either to emotion alone loses epistemic
  and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  fools miss higher being in human body.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
