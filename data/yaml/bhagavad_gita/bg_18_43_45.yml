sutra_id: BG_18_43_45
collection: Bhagavad Gita
section: chapter_18
title: Own Work as the Path to Success
sanskrit: 'शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम्।दानमीश्वरभावश्च क्षात्रं
  कर्म स्वभावजम्

  कृषिगौरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम्।परिचर्यात्मकं कर्म शूद्रस्यापि स्वभावजम्

  स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः।स्वकर्मनिरतः सिद्धिं यथा विन्दति तच्छृणु'
transliteration: 'śauryaṃ tejo dhṛtirdākṣyaṃ yuddhe cāpyapalāyanam|dānamīśvarabhāvaśca
  kṣātraṃ karma svabhāvajam

  kṛṣigaurakṣyavāṇijyaṃ vaiśyakarma svabhāvajam|paricaryātmakaṃ karma śūdrasyāpi svabhāvajam

  sve sve karmaṇyabhirataḥ saṃsiddhiṃ labhate naraḥ|svakarmanirataḥ siddhiṃ yathā
  vindati tacchṛṇu'
translation: Heroism, vigor, firmness, skill, not fleeing in battle, giving, and lordly
  spirit—are the natural-born action of a kṣatriya. Agriculture, cattle-keeping, and
  trade are the natural-born action of a vaiśya; action of the nature of service is
  also natural-born for the śūdra. Each person devoted to his own action attains success.
  Hear how one devoted to one’s own action finds success.
commentary: 'Kṣatriya, vaiśya, and śūdra svabhāva-karmas are named, then the universal
  claim: sve sve karmaṇi abhirataḥ—devoted to one’s own action—one gains saṃsiddhi.
  The contested claim is anti-envy and anti-cosplay: success is not secured by imitating
  another’s dharma-form. Existentially, the teaching wounds comparison culture. Your
  liberation-path runs through your own work’s grain. The next verse will theologically
  deepen how. In the Gītā’s pedagogy, concept without existential cut becomes another
  ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate
  metaphysics.


  Key Terms:


  **śaurya-tejas (शौर्यतेजस्)** — heroism and vigor -> kṣatriya marks -> ''aggression''
  is a distortion.

  **apālāyanam (अपलायनम्)** — not fleeing -> battlefield firmness -> ''grit'' secularizes.

  **paricaryā (परिचर्या)** — service -> śūdra svabhāva-karma -> ''servility'' is the
  contemptuous mishearing.

  **saṃsiddhi (संसिद्धि)** — success/perfection -> fruit of own-duty devotion -> ''career
  success'' is a counterfeit.


  Cross-Tradition Resonances:


  **[Gītā 3.35]:** Better own dharma than another’s well-done—direct continuity.

  *Divergence:* 18.45 universalizes devotion to own action as success-path.

  **[Stoic oikeiōsis / roles]:** Living one’s roles excellently resonates.

  *Divergence:* Stoic roles are cosmopolis-duties; here svabhāva-karma is guṇa-born.

  **[Benedictine chapter on crafts/work]:** Work as path rather than obstacle resonates.

  *Divergence:* Monastic work is obedience-shaped; Krishna’s is svabhāva-shaped toward
  siddhi.'
