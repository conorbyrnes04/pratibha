sutra_id: BG_09_31_33
collection: Bhagavad Gita
section: chapter_09
title: My Devotee Does Not Perish
sanskrit: 'क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति।


  कौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति


  मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः।


  स्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम्


  किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा।


  अनित्यमसुखं लोकमिमं प्राप्य भजस्व माम्'
transliteration: 'kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati|


  kaunteya pratijānīhi na me bhaktaḥ praṇaśyati


  māṃ hi pārtha vyapāśritya ye''pi syuḥ pāpayonayaḥ|


  striyo vaiśyāstathā śūdrāste''pi yānti parāṃ gatim


  kiṃ punarbrāhmaṇāḥ puṇyā bhaktā rājarṣayastathā|


  anityamasukhaṃ lokamimaṃ prāpya bhajasva mām'
translation: 'Quickly that one becomes righteous-minded and goes to lasting peace.
  O Son of Kuntī, declare it: My devotee does not perish. For taking refuge in Me,
  O Pārtha, even those of so-called ill birth — women, vaiśyas, and śūdras — reach
  the highest goal. How much more holy brahmins and devoted royal sages! Having come
  to this impermanent joyless world, worship Me.'
commentary: 'The promise hardens into a vow: My devotee does not perish. Social barriers
  elsewhere used to exclude are relativized under refuge: the highest goal opens across
  contested categories of birth and status. The verse''s historical hierarchy language
  is real and uncomfortable; its theological force is the priority of refuge over
  birth-rank. Existentially the center is non-abandonment: devotion places you inside
  a promise stronger than your past and stronger than social contempt. Do not romanticize
  hierarchy; refuse despair and refuse gatekeeping that overrides refuge. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live
  one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.


  Key Terms:


  **na praṇaśyati** — Sanskrit technical force in this passage -> refuge opens highest
  goal across social barriers -> default English flattens the contested philosophical
  work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the
  verse does with the term -> "bhakti" as vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> refuge
  opens highest goal across social barriers -> reducing either to emotion alone loses
  epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim:
  refuge opens highest goal across social barriers.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through
  personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate
  that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is
  mad-bhakta relationship under first-person speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in
  temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity,
  and refuge vow.'
