sutra_id: BG_02_49
collection: Bhagavad Gita
section: chapter_02
title: Far Inferior Is Action to the Yoga of Understanding
sanskrit: 'दूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय।


  बुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः'
transliteration: 'dūreṇa hyavaraṃ karma buddhiyogāddhanañjaya|


  buddhau śaraṇamanviccha kṛpaṇāḥ phalahetavaḥ'
translation: “By far is action inferior to the yoga of understanding, Dhanaṃjaya.
  Seek refuge in understanding; pitiful are those who make themselves causes of fruit.”
commentary: '*Buddhi-yoga* outranks bare *karma*. This does not cancel 2.47; it ranks
  motive-structure. Fruit-causers are *kṛpaṇa* — wretched, pinched. Refuge (*śaraṇa*)
  is to be sought in *buddhi*. The contested move is calling outcome-obsession a poverty
  of spirit, not ambition. Existentially, notice the miser-logic of fruit-fixation:
  it never feels it has enough control. Refuge in understanding is wealth that does
  not depend on the quarter’s numbers.


  Fruit-causers are called wretched because they live inside scarcity of control.
  Refuge in buddhi is the alternative wealth. Seek that shelter when the ledger of
  outcomes starts writing your self.


  Calling fruit-causers kṛpaṇa is diagnostic kindness. It names poverty of spirit
  where culture sees drive. Take refuge in buddhi when drive becomes miser-logic.
  Refuge is practical: when the ledger writes your self, change the writing instrument
  to buddhi.


  When drive turns miser-logic, take refuge in buddhi for five breaths before the
  next move. Let the contested move remain uncomfortable; comfort usually signals
  a softened reading.


  Key Terms:


  **buddhi-yoga (बुद्धियोग)** — yoga of understanding/discriminative intelligence
  → yoking through resolved knowing → “wisdom yoga” is approximate.


  **kṛpaṇa (कृपण)** — pitiful/miserly → fruit-fixers as spiritually impoverished →
  “wretched” fits; miserly contraction is heard in the word.


  **śaraṇa (शरण)** — refuge/shelter → *buddhi* as where one takes shelter → “take
  refuge” is right; it is relational, not merely cognitive assent.


  Cross-Tradition Resonances:


  **Katha Upaniṣad 1.2.1–2 (śreyas vs preyas):** Both rank the truly better over the
  merely desired fruit.

  *Divergence:* Katha stages choice via Yama; here ranking occurs inside karma-yoga
  instruction.


  **Epictetus, Enchiridion 1:** Both treat clinging to outcomes outside one’s jurisdiction
  as the root of wretchedness.

  *Divergence:* Stoicism stays with prohairesis; the Gītā names *buddhi-yoga* within
  dharma and devotion arc.'
voice_of_siva: ''
abhyasa: 'When you catch yourself as *phala-hetu*, place a hand on the sternum and
  say: “Refuge in understanding,” then name the next right action only.'
