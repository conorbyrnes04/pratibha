sutra_id: BG_07_20_22
collection: Bhagavad Gita
section: chapter_07
title: Stolen Knowledge and Delegated Faith
sanskrit: 'कामैस्तैस्तैर्हृतज्ञानाः प्रपद्यन्तेऽन्यदेवताः।


  तं तं नियममास्थाय प्रकृत्या नियताः स्वया


  यो यो यां यां तनुं भक्तः श्रद्धयार्चितुमिच्छति।


  तस्य तस्याचलां श्रद्धां तामेव विदधाम्यहम्


  स तया श्रद्धया युक्तस्तस्याराधनमीहते।


  लभते च ततः कामान्मयैव विहितान् हि तान्'
transliteration: 'kāmaistaistairhṛtajñānāḥ prapadyante''nyadevatāḥ|


  taṃ taṃ niyamamāsthāya prakṛtyā niyatāḥ svayā


  yo yo yāṃ yāṃ tanuṃ bhaktaḥ śraddhayārcitumicchati|


  tasya tasyācalāṃ śraddhāṃ tāmeva vidadhāmyaham


  sa tayā śraddhayā yuktastasyārādhanamīhate|


  labhate ca tataḥ kāmānmayaiva vihitān hi tān'
translation: Those whose knowledge is stolen by various desires take refuge in other
  deities; adopting this or that discipline, they are constrained by their own nature
  [*prakṛti*]. Whichever form a devotee wants to worship with faith [*śraddhā*] —
  that very unshaking faith I establish for him. Joined to that faith he strives in
  that worship and obtains desires from it — and those desires are indeed arranged
  by Me alone.
commentary: 'Plural worship is neither simply condemned nor simply endorsed. Desire-stolen
  knowledge explains why people resort to other deities and matching rule-sets: *prakṛti*
  channels the seeking. Yet Kṛṣṇa claims sovereignty inside that pluralism: He stabilizes
  the faith and dispenses the fruits. The contested theology is inclusive causality
  without equal ultimacy — other worship "works" because He underwrites it, not because
  every object of worship is equally the Absolute. Existentially this cuts two arrogances:
  sectarian denial that others'' sincere faith has any efficacy, and relativist denial
  that desire-shaped deity-choice can be a knowledge-theft. Your faith may be steadied
  and your wants granted while your knowing remains partial. The Lord''s underwriting
  of others'' faith is a severe mercy: fruits may come, faith may stabilize, and still
  knowledge remain stolen by kāma. Success is not proof of ultimacy. This frees interreligious
  honesty from both hatred and flattery. You can admit efficacy without conceding
  equal finality, and you can critique desire-shaped deity-choice without denying
  that grace may be operating inside it. The personal question is sharper: which desire
  is currently appointing my god?


  Key Terms:


  **śraddhā (श्रद्धा)** — faith/trust/placing the heart -> here faith that Kṛṣṇa Himself
  makes unshaking toward a chosen form -> "belief" as opinion misses that faith is
  divinely stabilized.


  **tanu (तनु)** — body/form -> the deity-form chosen for worship -> "idol" as pejorative
  misses the text''s neutral technical use inside a hierarchy of ends.


  Cross-Tradition Resonances:


  **Aquinas on grace perfecting nature / God as cause of secondary causes:** Both
  can affirm finite goods and finite cults without surrendering one first cause.

  *Divergence:* Thomas works in Christian creation metaphysics; Gītā frames desire,
  *prakṛti*, and deity-forms inside *bhakti* typology.


  **Confucian ritual plurality under Heaven (*tian*):** Both allow multiple rites
  under a higher order.

  *Divergence:* Heaven is not a personal granter of *śraddhā* in the Gītā''s first-person
  sense.'
voice_of_siva: ''
abhyasa: Notice one desire that currently shapes what you "pray to" (status, security,
  approval). Ask whether knowledge is being stolen by that desire; keep the desire
  visible rather than baptizing it as pure devotion.
