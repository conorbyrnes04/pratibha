sutra_id: BG_16_22_23
collection: Bhagavad Gita
section: chapter_16
title: Freed from the Dark Gates, Bound to Śāstra
sanskrit: 'एतैर्विमुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः।आचरत्यात्मनः श्रेयस्ततो याति
  परां गतिम्

  यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः।न स सिद्धिमवाप्नोति न सुखं न परां गतिम्'
transliteration: 'etairvimuktaḥ kaunteya tamodvāraistribhirnaraḥ|ācaratyātmanaḥ śreyastato
  yāti parāṃ gatim

  yaḥ śāstravidhimutsṛjya vartate kāmakārataḥ|na sa siddhimavāpnoti na sukhaṃ na parāṃ
  gatim'
translation: Released from these three gates of darkness, O son of Kuntī, a person
  practices what is good for the self and then goes to the highest goal. But the one
  who discards the injunctions of scripture and acts under the impulse of desire does
  not attain perfection, nor happiness, nor the highest goal.
commentary: 'Freedom from the triple gate enables ātmanaḥ śreyas—what is truly better
  for the self—and the highest path. Then a hard edge: discarding śāstra-vidhi and
  acting kāmakārataḥ yields neither siddhi nor sukha nor the highest goal. The contested
  claim is that desire-impulse is not authentic freedom. In a culture that equates
  authenticity with impulse, this verse is abrasive on purpose. Existentially, the
  question is whether your “I have to” is hell’s gate dressed as honesty. Śāstra here
  is not paperwork; it is measured norm that protects the self from self-destruction.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next
  hour, not only how you narrate metaphysics.


  Key Terms:


  **tamo-dvāra (तमोद्वार)** — gate of darkness -> the triad as dark entries -> ''negative
  patterns'' is weaker.

  **ātmanaḥ śreyas (आत्मनः श्रेयस्)** — the better/good of the self -> true self-interest
  -> ''self-care'' can be a counterfeit.

  **śāstra-vidhi (शास्त्रविधि)** — scriptural injunction -> normative measure -> ''rules''
  misses liberative function.

  **kāmakārataḥ (कामकारतः)** — from desire’s doing -> impulse-agency -> ''following
  your heart'' may be the soft gloss.


  Cross-Tradition Resonances:


  **[Gītā 2.52–53 / buddhi settled in śāstra-sāṃkhya]:** Norm-guided discernment continues.

  *Divergence:* 16.22–23 make desire-against-śāstra explicitly fruitless.

  **[Halakhic / rule-of-life traditions]:** Measured practice freeing from impulse
  resonates.

  *Divergence:* Specific canons differ; the structural claim is impulse ≠ liberation.

  **[Aristotle on akrasia]:** Acting from appetite against right measure resonates.

  *Divergence:* Aristotle aims at virtue; Krishna aims at highest gati via śāstra-aligned
  good.'
