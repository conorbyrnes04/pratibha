sutra_id: BG_01_01
collection: Bhagavad Gita
section: chapter_01
title: Whose Side Is Mine on the Field of Dharma
sanskrit: 'धृतराष्ट्र उवाच


  धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः।


  मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय'
transliteration: 'dhṛtarāṣṭra uvāca


  dharmakṣetre kurukṣetre samavetā yuyutsavaḥ|


  māmakāḥ pāṇḍavāścaiva kimakurvata sañjaya'
translation: 'Dhṛtarāṣṭra said: On the field of [dharma], at Kurukṣetra, the assembled
  warriors eager for battle — what did my people and the sons of Pāṇḍu do, Sañjaya?'
commentary: 'Ownership already frames the question before a single arrow flies. Dhṛtarāṣṭra
  does not ask what justice requires; he asks what *his* side and the others did.
  The contested move is the quiet naming of the battlefield as *dharmakṣetra*: the
  place where duty is tested, not merely where power is decided. Blind kingship here
  is not only physical. It is the refusal to see how possessive language (*māmakāḥ*,
  “my people”) already prejudges the conflict. The Gītā opens inside a failure of
  impartial seeing, so that later teaching about the Self and non-possessive action
  answers a real political-moral wound. Existentially, the verse asks whether you
  enter crises as a seeker of what upholds the whole, or as a partisan already sorting
  kin into “mine” and “theirs.” The field is sacred not because war is holy, but because
  the question of dharma cannot be postponed once bodies are arrayed. Kurukṣetra is
  wherever irreversible action forces your loyalties into the open.


  Key Terms:


  **dharmakṣetra (धर्मक्षेत्र)** — *dharma* (“what upholds”) + *kṣetra* (“field”)
  → the arena where sustaining order is contested under irreversible stakes → “battlefield”
  alone drops the moral architecture of the scene.


  **māmakāḥ (मामकाः)** — “my people,” from *mama* (“mine”) → possessive faction-identity
  spoken by a king who cannot see → default “my sons/forces” misses how ownership
  precedes perception.


  **yuyutsavaḥ (युयुत्सवः)** — desirous of fighting → readiness for combat as collective
  mood, not private anger → “eager for war” understates the shared intentional field
  already formed.


  Cross-Tradition Resonances:


  **Plato, Republic I (331c–336a):** Both open ethical inquiry inside contested claims
  about what is owed and to whom, before doctrine is settled.

  *Divergence:* Plato’s opening is conversational contest over justice definitions;
  the Gītā opens as wartime report under dynastic blindness.


  **Zhuangzi, “Sorting That Evens Things Out”:** Both expose how “this/that” sorting
  generates conflict before action begins.

  *Divergence:* Zhuangzi dissolves partisan naming through perspectival play; the
  Gītā keeps the dramatic stakes of duty on a literal field of war.'
voice_of_siva: ''
abhyasa: Before your next contested decision, write two columns — “mine” and “theirs”
  — then rewrite the same facts without possessive pronouns and notice what changes
  in the question you ask.
