resonances:
- citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
  resonance: Both texts locate the ultimate reality (Śakti / samādhi-bliss) not in transcendence but in the full recognition of what is already present in lived experience—the 'entire architecture' of perception itself becomes the locus of realization.
  divergence: Tantrasara emphasizes Śakti as the dynamic power recognizable within thought-structures; Siva Sutra grounds bliss in the non-dual intimacy of awareness with the world as such, without requiring the mediating language of 'working with' experience.
  passage_id: tantrasara.ts_014
- citation: Isavasya Upanishad — Sambhuti and Asambhuti
  resonance: Both reject exclusive fixation on either pole (unmanifest or manifest; withdrawal or engagement) and instead prescribe a non-dual integration where the joy arises from holding both simultaneously.
  divergence: Isavasya Upanishad frames this as a warning against false paths leading to 'darkness'; Siva Sutra presents samādhi-bliss as the direct fruit of non-dual intimacy, emphasizing positive realization rather than negation of error.
  passage_id: isavasya_upanishad.isa_005
