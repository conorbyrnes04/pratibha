sutra_id: SS_I.18
sutra: I.18
title: The bliss of the world is the joy of samādhi.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: लोकानन्दः समाधिसुखम्
transliteration: lokānandaḥ samādhi-sukham
translation: The bliss of the world is the joy of samādhi.
commentary: 'Samādhi here is not withdrawal from the world, but intimacy with it.
  Bliss is no longer private or interior; it circulates through appearance itself.
  The joy of contemplation and the joy of living are revealed as one movement.


  What was previously sought as escape now unfolds as participation. The world is
  not left behind; it is suffused with awareness.'
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
