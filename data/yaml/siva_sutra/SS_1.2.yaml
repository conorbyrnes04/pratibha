id: "SS_1.2"
number: "1.2"
sutra:
  devanagari: "ज्ञानं बन्धः"
  transliteration: "jñānaṃ bandhaḥ"
  translation: "Contracted, objectifying knowing is bondage."
scholarly_commentary: |
  Here jñāna is paricchinna‑jñāna—finite, object‑fixing cognition. Bandhaḥ arises when one identifies with contents of mind;
  recognition (pratyabhijñā) is eclipsed. Trika does not condemn thought per se; it diagnoses misrecognition.
voice_of_siva: |
  Bondage is not in action but in narrow vision.
  When you clutch fragments—your opinion, your possession, your fear—you bind yourself.
  The Whole is Yours eternally, untouched by fragments.
abhyasa: |
  When the mind asserts “I know,” label it softly: “contracting.”
  Exhale; let the label dissolve into open awareness.
modes:
  bhasya: |
    Pair with Pātañjala 1.2–1.3: nirodha clears; Trika recognizes all arising as Śakti. Not ‘kill the mind’—end misrecognition.
  doctrinal: |
    Malas: āṇava (smallness), māyīya (object‑reification), kārma (compulsive doership). Remedy: pratyabhijñā.
  comparative: |
    Dionysian apophasis (unknowing beyond concepts). Sufi ḥijāb (veil) by taking Names as separate.
  sadhana: |
    Three breaths: notice the claim, soften the grasp, rest as the field that outshines the claim.
