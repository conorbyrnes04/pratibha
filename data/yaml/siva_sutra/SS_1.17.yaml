needs_verification: true
scholarly_commentary: |
  The universe is tasted as Your vibration; non-separateness becomes obvious.
voice_of_siva: |
  Feel the world as Your pulse; intimacy with everything replaces distance.
abhyasa: |
  Touch an object and feel no boundary between touching and being.
modes:
  bhasya: |
    Spanda as the life of subject–object; bhedābheda richness.
  doctrinal: |
    Identity-in-difference; Śiva–Śakti nonduality.
  comparative: |
    Panentheistic resonances; Sufi waḥdat al-wujūd nuances.
  sadhana: |
    Open-sense practice: include sounds/people as Your own field.
