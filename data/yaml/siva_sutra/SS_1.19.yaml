id: "SS_1.19"
number: "1.19"
sutra:
  devanagari: ""
  transliteration: ""
  translation: ""
needs_verification: true
scholarly_commentary: |
  Guru is the upsurge of insight within—the inner Śiva opening the eye.
voice_of_siva: |
  Trust the inner flash of clarity—this is the Guru rising in You.
abhyasa: |
  At a decision point, wait for the bright, quiet ‘yes’ before moving.
modes:
  bhasya: |
    Guru-tattva as inner light (antar-guru).
  doctrinal: |
    Grace (anugraha) as ever-present; receptivity matters.
  comparative: |
    ‘Christ within’; Quaker ‘inner teacher’.
  sadhana: |
    3-breath pause before action; move only on the bright ‘yes.’
