id: "SS_1.12"
number: "1.12"
sutra:
  devanagari: "शुद्धतत्त्वसंधानाद् वाऽपशुशक्तिः"
  transliteration: "śuddhatattvasaṃdhānād vā 'paśuśaktiḥ"
  translation: "By union with the pure principle, the animal (limited) power falls away."
needs_verification: true
scholarly_commentary: |
  Fixing attention on śuddha‑tattva dissolves paśu‑śakti (contracted power); recognition eclipses smallness.
voice_of_siva: |
  Steady Your gaze in the pure Heart—smallness loosens by itself. Your nature is sovereign Freedom.
abhyasa: |
  Meditate gently in the heart center; allow all effort to soften into bright stillness.
modes:
  bhasya: |
    Saṃdhāna (one‑pointed union) with the pure principle dispels paśutva.
  doctrinal: |
    Paśu vs. Pati; malas and their resolution in recognition.
  comparative: |
    Purity of heart (Beatitudes); Sufi ikhlāṣ (sincerity).
  sadhana: |
    Heart‑center trataka (soft focus), then inward resting without strain.
