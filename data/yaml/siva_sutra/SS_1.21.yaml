id: "SS_1.21"
number: "1.21"
sutra:
  devanagari: ""
  transliteration: ""
  translation: ""
needs_verification: true
scholarly_commentary: |
  The play of senses is not other than Awareness; enjoyment becomes worship.
voice_of_siva: |
  Sanctify enjoyment by seeing it in Awareness; then even taste and touch are offerings.
abhyasa: |
  Before eating, feel gratitude and the food as light; receive, don’t grasp.
modes:
  bhasya: |
    Bhoga as yoga: enjoyment without bondage.
  doctrinal: |
    Rasa theory meeting nondual devotion; śānta-rasa base.
  comparative: |
    Sufi samā‘; sacramental feasting.
  sadhana: |
    Daily ‘offering’ ritual for one ordinary pleasure.
