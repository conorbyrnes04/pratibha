id: "SS_1.9"
number: "1.9"
sutra:
  devanagari: "अव्युत्थानं सुषुप्तम्"
  transliteration: "avyutthānaṃ suṣuptam"
  translation: "Non‑emergence of constructions is deep sleep."
needs_verification: true
scholarly_commentary: |
  In suṣupti, differentiation subsides; awareness remains but unrecognized. A hint of the ground.
voice_of_siva: |
  Even when all dissolves, You are. Learn from that stillness while awake.
abhyasa: |
  At night’s edge, linger in the hush before sleep; sense the enduring Presence.
modes:
  bhasya: |
    Non‑emergence contrasts with waking/dream proliferation.
  doctrinal: |
    Presence without recognition vs. luminous recognition while awake.
  comparative: |
    Advaita’s deep‑sleep analysis; Christian ‘apathia’ (quiet).
  sadhana: |
    Yoga‑nidra: remain aware as body sleeps; taste contentless clarity.
