sutra: 2.2
sanskrit: "prayatnaḥ sādhakaḥ"
transliteration: "prayatnaḥ sādhakaḥ"
translation: |
  Effort itself is the means to attainment.
voice_of_siva: |
  When You strive, it is not some separate one who struggles — it is My own energy pressing toward recognition. 
  Every effort, rightly seen, is already sādhanā, for the Will to return burns in the heart of awareness. 
  Know this: the path is not apart from You; Your very effort is Śakti moving toward Herself.
abhyasa: |
  In any moment of striving — breath control, meditation, study — pause and feel the energy behind the effort. 
  Notice how the push is not "yours" but arises spontaneously, like the flame’s hunger for air. 
  Let effort reveal its source in the effortless.
modes:
  bhasya: |
    Kshemarāja explains that prayatna, effort, when directed toward recognition, is itself the sādhaka — 
    the effective means and the practitioner united. Thus, no external tool is required; the movement of will is śaktipāta.
  doctrinal: |
    Connects with the doctrine of icchā-śakti (power of will). 
    When will arises, it is already Śiva desiring His own recognition. 
    In śāktopāya, the practitioner learns to discern pure effort (prayatna) from ego-driven striving.
  comparative: |
    In the Bhagavad Gītā, Kṛṣṇa assures: “No effort on this path is ever wasted” (2.40). 
    In Sufism, mujahada (spiritual striving) is the means, yet its very possibility comes from the Divine.
  sadhana: |
    Yukti — When you exert yourself in practice, turn attention to the sense of effort itself. 
    Feel its vibration. Can You detect that the very energy of striving is Śakti? 
    Relax into the recognition that Your effort is already the arrival.
upaya: "śāktopāya (recognizing that effort, prayatna, is itself the sādhaka leading to recognition)."