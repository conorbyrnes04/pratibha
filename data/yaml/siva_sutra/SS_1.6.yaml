id: "SS_1.6"
number: "1.6"
sutra:
  devanagari: "शक्तिः संधाने शरीरोत्पत्तिः"
  transliteration: "śaktiḥ saṃdhāne śarīrotpattiḥ"
  translation: "By focused union with Śakti, the (subtle) body arises."
needs_verification: true
scholarly_commentary: |
  ‘Saṃdhāna’ as integration/attunement: focusing awareness in Śakti vivifies the subtle body and powers (siddhis). Not the goal, but a by‑product; recognition is primary.
voice_of_siva: |
  When attention weds Śakti, vitality blossoms. Energy clarifies, senses brighten, the inner body glows.
  Let this be a sign, not a destination. Your Home is prior to powers.
abhyasa: |
  Rest attention in the heart‑space; breathe into a whole‑body glow; remain as the witnessing Light.
modes:
  bhasya: |
    Attunement catalyzes śarīra‑utpatti—subtle embodiment for practice.
  doctrinal: |
    Śakti‑saṃdhāna vs. siddhi‑chasing; primacy of pratyabhijñā.
  comparative: |
    Kundalinī arousal analogues; Hesychast warmth in the heart.
  sadhana: |
    Heart‑breath: spread awareness from hṛdaya to the whole body with each inhale.
