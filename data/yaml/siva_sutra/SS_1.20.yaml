id: "SS_1.20"
number: "1.20"
sutra:
  devanagari: ""
  transliteration: ""
  translation: ""
needs_verification: true
scholarly_commentary: |
  Mantra reveals its deity when recited from the Heart; sound becomes seeing.
voice_of_siva: |
  Let mantra recede into silence until only its deity’s presence remains—felt as Your own Being.
abhyasa: |
  After japa, sit silently and sense the deity’s living presence pervading You.
modes:
  bhasya: |
    Deity–mantra identity; sound–form–presence unity.
  doctrinal: |
    Mātr̥kā realized; nāda–bindu insights.
  comparative: |
    Hesychast Jesus Prayer parallels; Name as presence.
  sadhana: |
    Japa → ajapā: let the mantra repeat itself subtly without effort.
