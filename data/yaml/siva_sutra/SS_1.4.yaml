id: "SS_1.4"
number: "1.4"
sutra:
  devanagari: "ज्ञानाधिष्ठानं मातृका"
  transliteration: "jñānādhiṣṭhānaṃ mātṛkā"
  translation: "The matrix of letters (Mātṛkā) undergirds cognition."
scholarly_commentary: |
  Mātr̥kā—mother of letters—structures perception. Four levels of speech: parā, paśyantī, madhyamā, vaikharī.
  Language binds when reified, liberates when recognized as Śakti.
voice_of_siva: |
  Every word rises from Mātr̥kā’s hum. Hear not only meanings but living vibration.
  Follow sound back to its spring; there You find Your luminous Quiet.
abhyasa: |
  Japa a bīja as vibration, not meaning; then rest in the silence that remains.
modes:
  bhasya: |
    Study the four levels of speech; mantra reverses outward fixation back to parā‑vāk.
  doctrinal: |
    Relation of vāk‑tattva to spanda and cognition.
  comparative: |
    Sufi ḥurūf (letters) and divine Names; Logos theology.
  sadhana: |
    Listen to the subtle ‘OM’ under all sounds throughout the day.
