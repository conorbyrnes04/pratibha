sutra_id: "1.5"
collection: "Śiva Sūtra"
section: "Śāmbhavopāya"
sanskrit: "उद्यमो भैरवः"
transliteration: "udyamo bhairavaḥ"
translation: "The primordial upsurge is Bhairava."
commentary: |
  The flash of intuition (unmeṣa) is the very presence of Bhairava; recognition rides this surge.
modes:
  bhasya: "Recognition appears as a sudden widening."
  doctrinal: "Spanda ↔ svātantrya."
  comparative: "tajallī; Palamite light."
  sadhana: "Catch first instant of arising; whisper 'Bhairava'."
