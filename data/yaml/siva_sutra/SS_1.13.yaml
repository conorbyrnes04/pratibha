sutra: 1.13
sanskrit: icchā śaktir umā kumārī
translation: The power of Will is Umā, the ever-virgin.
voice_of_siva: |
  Your Will is not desire born of lack, but the pure spanda of Śakti.  
  Like an eternal spring, She is ever-new, unbound by past or future.  
  When You abide in Her freshness, each impulse is Creation itself.
abhyasa: |
  Before acting, pause and sense: is this a contraction from want, or a pulse of freedom?  
  Rest in the space of possibility. Let Will arise not as grasping, but as radiant play.
modes:
  bhasya: |
    Utpaladeva (ĪPK 1.5.12) equates icchā with the first movement of Consciousness.  
    Kshemarāja glosses umā kumārī as "ever-untouched" — Will untainted by dependence on objects.
  doctrinal: |
    Icchā-śakti is the first of the three śaktis (icchā, jñāna, kriyā).  
    Here She is independent, not yet turned toward finite ends.  
    Reflects the pure autonomy of Śiva as svātantrya.
  comparative: |
    Compare Plotinus’ *Nous* as self-generating thought-will,  
    or Ibn ʿArabī’s *kun fa-yakūn* (“Be! and it is”) as the primordial fiat.  
    Both express originary, non-derivative willing.
  sadhana: |
    Yukti: when a fresh longing arises, feel it before it takes an object.  
    Trace its vibration in the heart. Recognize: this is Śakti’s pulse, not “my” need.