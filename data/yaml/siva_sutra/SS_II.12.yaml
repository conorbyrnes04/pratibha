sutra_id: SS_II.12
sutra: II.12
title: Sustained attention is knowledge.
collection: Siva Sutra
section: Śāktopāya
sanskrit: अवधानं विद्या
transliteration: avadhānaṁ vidyā
translation: Sustained attention is knowledge.
commentary: 'Knowledge is no longer defined by content but by steadiness. What knows
  is not what is known, but the capacity to remain present without fragmentation.


  _Avadhāna_ names a quality rarer than insight: continuity. When attention ceases
  to scatter, knowing becomes simple, direct, and sufficient. This is not concentration
  as tension, but attention as loyalty.'
voice_of_siva: ''
