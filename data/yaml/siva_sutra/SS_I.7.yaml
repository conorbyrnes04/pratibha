sutra_id: SS_I.7
sutra: I.7
title: Within waking, dream, and deep sleep, the enjoyment of the Fourth becomes available.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: जाग्रत्स्वप्नसुषुप्तभेदे तुर्याभोगसंभवः
transliteration: jāgrat-svapna-suṣupta-bhede turyābhoga-sambhavaḥ
translation: Within waking, dream, and deep sleep, the enjoyment of the Fourth becomes
  available.
commentary: 'The Fourth is not a separate state added to the others. It is what **pervades** them
  when their differences are known without confusion. Waking, dreaming, and deep sleep
  remain distinct, yet transparent.


  _Turyā_ is tasted not by escaping states, but by inhabiting them without loss of
  awareness. Enjoyment here means fullness — consciousness resting in itself amid
  all conditions.'
