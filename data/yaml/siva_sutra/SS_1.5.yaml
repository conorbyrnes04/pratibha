id: "SS_1.5"
number: "1.5"
sutra:
  devanagari: "उद्यमो भैरवः"
  transliteration: "udyamo bhairavaḥ"
  translation: "The primordial upsurge (udyama/unmeṣa) is Bhairava."
scholarly_commentary: |
  Udyama/unmeṣa: the first flash (parā‑pratibhā) in which recognition dawns—Śiva’s svātantrya. Seized, it liberates; missed, cognition collapses into objectification.
voice_of_siva: |
  Catch the first shimmer before it becomes a thing—that flash is Your clarity.
  Stay with it; in that dawning instant, freedom is obvious.
abhyasa: |
  Micro‑practice: meet the very first instant of each arising with soft, total receptivity. Name it inwardly: ‘Bhairava.’
modes:
  bhasya: |
    Train in pre‑conceptual noticing; unmeṣa as the liberating instant.
  doctrinal: |
    Pratibhā, svātantrya, spanda.
  comparative: |
    Sufi tajallī (sudden disclosure); Hesychast light.
  sadhana: |
    Bell practice: whenever a notification rings, catch the first moment as Bhairava.
