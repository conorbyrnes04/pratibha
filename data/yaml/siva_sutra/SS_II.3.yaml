sutra_id: SS_II.3
sutra: II.3
title: Knowledge becomes embodied reality; this is the secret of mantra.
collection: Siva Sutra
section: Śāktopāya
sanskrit: विद्या शरीरसत्ता मन्त्ररहस्यम्
transliteration: vidyā śarīra-sattā mantra-rahasyam
translation: Knowledge becomes embodied reality; this is the secret of mantra.
commentary: 'Here knowledge is no longer abstract. When understanding permeates the body, it ceases to be commentary and becomes presence. Mantra is effective not because of sound alone, but because it reorganizes how consciousness inhabits form.


  The secret is not hidden by secrecy, but by superficial engagement. Without embodiment, mantra remains external. When knowledge becomes bodily, mantra reveals its power.'
voice_of_siva: ''
abhyasa: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
