resonances:
- citation: 'Vijnana Bhairava — Yukti #17'
  resonance: 'Both texts enact knowledge as a progressive embodied practice: the Siva Sutra declares knowledge becomes embodied reality through mantra''s secret, while Yukti #17 prescribes internal mantra-recitation as the precise mechanism by which consciousness transforms into Shiva-identity through sequential articulation and resonance.'
  divergence: The Siva Sutra names the principle abstractly (knowledge-becomes-embodied), whereas the Vijnana Bhairava specifies the technical method (piṇḍa-mantra sequence, Half-moon, Point, Resonance, Void) required to actualize that transformation.
  passage_id: vijnana_bhairava.yukti_017
- citation: Pratyabhijnahrdayam — Sutra 20
  resonance: 'Both passages locate mantra as the operative power linking consciousness to embodied realization: the Siva Sutra identifies mantra''s secret as the mechanism of knowledge-embodiment, while Pratyabhijnahrdayam Sutra 20 names mantra-power (mantra-shakti) as the essential nature of Perfect I-consciousness from which embodied transformation flows.'
  divergence: The Siva Sutra emphasizes the result (knowledge becomes embodied), whereas Pratyabhijnahrdayam emphasizes the ontological ground (mantra-power as intrinsic to consciousness itself) from which embodiment arises.
  passage_id: pratyabhijnahrdayam.phr_020
