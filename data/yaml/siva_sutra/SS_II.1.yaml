sutra_id: SS_II.1
sutra: II.1
title: Mind is mantra.
collection: Siva Sutra
section: Śāktopāya
sanskrit: चित्तं मन्त्रः
transliteration: cittaṁ mantraḥ
translation: Mind is mantra.
commentary: 'Once recognition has occurred, thought is no longer merely noise. The movements of mind carry potency. Every pattern of attention shapes reality, just as mantra does—not by meaning alone, but by vibration and repetition.


  Here the task is no longer to dissolve mind, but to hear it. When thought aligns with awareness, it becomes a vehicle rather than a veil.'
voice_of_siva: ''
abhyasa: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
