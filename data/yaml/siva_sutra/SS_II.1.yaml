resonances:
- citation: 'Vijnana Bhairava — Yukti #63'
  resonance: Both texts treat a sonic/vibrational element (mantra syllable, visarga sound) as a vehicle for direct recognition or contact with absolute reality. The mind's engagement with the sound's structure becomes the method of realization itself.
  divergence: Śiva Sūtra emphasizes mind-as-mantra through recognition of thought's intrinsic nature, while Vijnana Bhairava employs mantra as an external focal point to achieve a 'supportless' state that transcends the mind.
  passage_id: vijnana_bhairava.yukti_063
- citation: Patañjali Yoga Sūtras 1.28
  resonance: 'Both passages establish a reciprocal relationship between a word/mantra and meditative attention: repetition of the word and meditation on its meaning (Patañjali) parallels the Śiva Sūtra''s claim that once recognition occurs, thought becomes mantra rather than noise—the word and the mind''s engagement with it are inseparable.'
  divergence: Patañjali's approach is methodological and sequential (repeat, then meditate), while Śiva Sūtra's is instantaneous and ontological (recognition transforms thought's status retroactively).
  passage_id: patañjali_yoga_sūtras.ys_1_28
- citation: Heart Sutra — Gone Beyond — the Mantra of Wisdom
  resonance: 'Both identify a mantra as the vehicle of recognition or realization: the Heart Sutra''s prajñāpāramitā mantra ''quiets all suffering'' through its utterance, just as the Śiva Sūtra''s recognition that mind-is-mantra transforms thought from noise into liberating awareness.'
  divergence: The Heart Sutra locates the mantra's power in its truth-content and universal applicability, while Śiva Sūtra locates it in the intrinsic recognition of mind's own nature as vibration.
  passage_id: heart_sutra.hs_003
