1.14:
  sutra: vidyāsaṁhāre tadutthasvapnadarśanam
  translation: When knowledge dissolves, dream-visions arise from That.
  voice_of_siva: |
    When the play of concepts subsides, visions bloom from the Source. Not mere dream, but the flicker of Śakti showing You the hidden patterns of the cosmos.
  abhyasa: |
    Let your meditation deepen until thoughts collapse. Notice what images arise in that silence — treat them as gifts of insight, not distractions.
  modes:
    bhasya: |
      Kṣemarāja: when ordinary vidyā ceases, higher revelations (darśana) appear in svapna — dream here means subtle perception beyond waking.
    doctrinal: |
      Points to pratibhā — intuitive flash beyond discursive knowledge.
    comparative: |
      Parallels with Sufi kashf (unveiling) and Christian “visions in the night” (Augustine, Teresa).
    sadhana: |
      Practice yoga-nidrā: as You descend toward sleep, attend to luminous forms that arise, recognizing them as Śakti’s instruction.
