sutra_id: SS_I.12
sutra: I.12
title: Wonder marks the stages of yoga.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: विस्मयो योगभूमिकाः
transliteration: vismayo yoga-bhūmikāḥ
translation: Wonder marks the stages of yoga.
commentary: As recognition deepens, certainty gives way to astonishment. Wonder is not confusion; it is the mind encountering what exceeds its reach.
