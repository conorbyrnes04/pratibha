sutra_id: SS_I.15
sutra: I.15
title: From the collision of mind in the heart, appearances arise like dreams.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: हृदये चित्तसंघट्टाद्दृश्यस्वापदर्शनम्
transliteration: hr̥daye citta-saṅghaṭṭād dr̥śya-svāpa-darśanam
translation: From the collision of mind in the heart, appearances arise like dreams.
commentary: The heart is the meeting place of awareness and form. When mind stirs
  there, the world appears — vivid, persuasive, dreamlike.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
