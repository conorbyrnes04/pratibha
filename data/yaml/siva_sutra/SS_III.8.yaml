sutra_id: SS_III.8
sutra: III.8
title: Knowledge is bondage.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: ज्ञानं बन्धः
transliteration: jñānaṁ bandhaḥ
translation: Knowledge is bondage.
commentary: The refrain lands finally at the human level. Knowledge binds when it
  substitutes for presence.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
