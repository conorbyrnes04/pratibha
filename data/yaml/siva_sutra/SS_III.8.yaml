resonances:
- citation: The Book of Chuang Tzu — chapter 22
  resonance: 'Both texts invert the conventional assumption that knowledge is the path to liberation: the Siva Sutra declares knowledge itself is bondage, while Chuang Tzu''s Knowledge asks Do-nothing how Tao can be known—implying that conceptual knowledge cannot access what must be lived or intuited.'
  divergence: The Siva Sutra locates bondage in the structure of knowledge itself (jnana as constraint), whereas Chuang Tzu suggests knowledge is inadequate to its object (Tao exceeds cognition), a difference between ontological entanglement and epistemological limitation.
  passage_id: the_book_of_chuang_tzu.ctz_022
- citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #26'
  resonance: 'Both passages critique a particular mode of knowing that mistakes the negation or dissolution of ordinary consciousness for true knowledge: Ibn Arabi warns against making God-knowledge dependent on annihilation of existence, while the Siva Sutra suggests that knowledge-as-bondage traps the seeker in a false liberation narrative.'
  divergence: Ibn Arabi's critique targets a specific theological error (confusing fana with gnosis), whereas the Siva Sutra makes a structural claim about knowledge itself as inherently binding, not merely its misapplication.
  passage_id: know_yourself_ibn_arabi_balyani.kys_p026
