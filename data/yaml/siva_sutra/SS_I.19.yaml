sutra_id: SS_I.19
sutra: I.19
title: From the convergence of power, bodies arise.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: शक्तिसन्धान शरीरोत्पत्तिः
transliteration: śakti-sandhāne śarīrotpattiḥ
translation: From the convergence of power, bodies arise.
commentary: 'Form emerges wherever power gathers. Bodies—subtle or gross—are not imposed upon consciousness; they are condensations of its own energy. Creation is not a fall but a focusing.


  Seen from recognition, embodiment is an expression of freedom, not its loss.'
