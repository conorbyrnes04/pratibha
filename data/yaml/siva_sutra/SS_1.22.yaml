id: "SS_1.22"
number: "1.22"
sutra:
  devanagari: ""
  transliteration: ""
  translation: ""
needs_verification: true
scholarly_commentary: |
  Recognition stabilizes through all states and acts—this is liberation-in-life.
voice_of_siva: |
  Let recognition be continuous—walking, speaking, resting. Liberation is not escape but intimacy with everything as Your Self.
abhyasa: |
  Choose a mundane task (washing, emailing). Do it as Awareness, slowly and lovingly.
modes:
  bhasya: |
    Jīvanmukti as stable pratyabhijñā through activity and rest.
  doctrinal: |
    Integration of tapas, svādhyāya, īśvarapraṇidhāna within Trika lens.
  comparative: |
    Brother Lawrence’s ‘practice of the presence’; Zen ‘chop wood, carry water.’
  sadhana: |
    Pick one daily activity and vow to do it as conscious offering for a week.
