id: "SS_1.8"
number: "1.8"
sutra:
  devanagari: "स्वप्नो विकल्पाः"
  transliteration: "svapno vikalpāḥ"
  translation: "Dream is a play of constructions."
needs_verification: true
scholarly_commentary: |
  Dream reveals the mind’s creative freedom; a mirror of waking’s own constructedness.
voice_of_siva: |
  See how freely forms arise in dream—waking differs only by habit. You are prior to both.
abhyasa: |
  On waking, recall a dream; feel the same freedom at play in daytime thought.
modes:
  bhasya: |
    Svapna underscores cognition’s constructive power.
  doctrinal: |
    Vikalpa as creative śakti; neither to be despised nor absolutized.
  comparative: |
    Sufi barzakh; Tibetan dream yoga.
  sadhana: |
    Daytime lucidity: question a few ‘givens’ each hour; loosen reification.
