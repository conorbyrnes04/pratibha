id: "SS_1.11"
number: "1.11"
sutra:
  devanagari: "वीरेशः संहारः"
  transliteration: "vīreśaḥ saṃhāraḥ"
  translation: "The Lord of Heroes is dissolution (or brings dissolution)."
needs_verification: true
scholarly_commentary: |
  Recognition dissolves reification; the heroic Lord subsumes appearances back into luminosity.
voice_of_siva: |
  Let all forms dissolve into Your vastness—this is not loss but returning to fullness.
abhyasa: |
  With each exhale, release the scene into spaciousness; rest as the clarity that remains.
modes:
  bhasya: |
    Saṃhāra as re‑absorption in awareness, not nihilism.
  doctrinal: |
    Laya into citi; spanda’s return‑current.
  comparative: |
    Sufi fanā’ (dissolution) followed by baqā’ (abiding).
  sadhana: |
    End‑of‑day laya: let the day’s images sink into the heart’s quiet.
