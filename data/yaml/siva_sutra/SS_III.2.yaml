sutra_id: SS_III.2
sutra: III.2
title: Knowledge is bondage.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: ज्ञानं बन्धः
transliteration: jñānaṁ bandhaḥ
translation: Knowledge is bondage.
commentary: 'The refrain returns, but its meaning shifts. In Āṇavopāya, knowledge
  binds not because it is articulated, but because it is habitually misused. Concepts
  are clung to for security. Understanding replaces presence.


  Here the practitioner must learn restraint. Knowing is not abolished, but loosened.
  What binds is not information, but identification with it.'
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
