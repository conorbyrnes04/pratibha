sutra_id: SS_III.10
sutra: III.10
title: Thus, objects exist according to their principle.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: तत्तत्त्वतोऽर्थभावः
transliteration: tat tattvato’rtha-bhāvaḥ
translation: Thus, objects exist according to their principle.
commentary: Perception becomes proportional. Things are seen according to what they
  are, not what they promise.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
modes:
