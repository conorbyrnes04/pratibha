sutra_id: SS_III.1
sutra: III.1
title: The mind is the Self.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: आत्मा चित्तम्
transliteration: ātmā cittaṁ
translation: The mind is the Self.
commentary: 'At first glance this contradicts the opening of the text. But here the statement is contextual, not absolute. For the practitioner established in limitation, the most immediate access to awareness is the mind itself.


  Rather than rejecting thought, Āṇavopāya begins by dignifying it. Mind is not an obstacle to be eliminated, but the nearest mirror of consciousness available to one who has not yet stabilized recognition. To work skillfully with mind is to work with the Self in its most accessible form.'
