sutra: 1.15
sanskrit: hṛdaye cittasaṅghāṭād dṛśyasvāpanam
status: needs_verification
translation: When the mind gathers in the Heart, the visible universe ‘falls asleep’.
voice_of_siva: |
  When attention settles in the Heart, the compulsion to chase appearances subsides.
  The world is not denied—it rests peacefully in You.
abhyasa: |
  Place soft attention in the heart-center; breathe as if the whole field is exhaling into quiet.
  Let images dim without forcing them away.
modes:
  bhasya: |
    “Citta-saṅghāṭa” = compacting of mentation into the Heart.
    “Svāpanam” = quiescence of outward fixation.
  doctrinal: |
    Hṛdaya as locus of recognition; anupāya hints (effortless settling).
  comparative: |
    Hesychast “prayer of the heart”; Zen’s serene illumination.
  sadhana: |
    Heart-trāṭaka: soft gaze inward (eyes half-closed), let attention pool behind the sternum.