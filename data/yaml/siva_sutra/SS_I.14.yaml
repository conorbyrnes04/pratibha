sutra_id: SS_I.14
sutra: I.14
title: What is seen is a body.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: दृश्यं शरीरम्
transliteration: dr̥śyaṁ śarīram
translation: What is seen is a body.
commentary: Every appearance coheres as form. The body is not opposed to consciousness;
  it is consciousness appearing locally.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
