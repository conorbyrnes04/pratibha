resonances:
- citation: Astavakra Gita — The Threefold Certainty That Liberates While Living
  resonance: 'Both texts establish a radical inversion: the Siva Sutra asserts that what appears as form (drsya, the seen) is fundamentally a body—a coherent appearance of consciousness—while Astavakra Gita inverts the common assumption by declaring ''I am not the body'' to liberate the seer from identification with form. Both make the body-consciousness relationship the pivot of liberation.'
  divergence: The Siva Sutra treats the body as the primary manifestation through which consciousness appears and coheres; Astavakra Gita treats disidentification from the body as the gateway to recognizing pure consciousness. One emphasizes appearance; the other emphasizes negation.
  passage_id: astavakra_gita.asg_11_6
- citation: 'Vijnana Bhairava — Yukti #58'
  resonance: 'Both passages organize experience into structured forms that reveal consciousness: the Siva Sutra states that ''what is seen is a body'' (every appearance coheres as form), while Yukti #58 instructs the practitioner to recognize the three states of universe, illumination, and darkness ''as the very form of Bhairava''—each appearance becomes a recognizable structure of the divine consciousness.'
  divergence: The Siva Sutra presents this as a direct ontological claim about appearance itself; the Vijnana Bhairava frames it as a meditative recognition requiring deliberate knowing. One is descriptive; the other is prescriptive practice.
  passage_id: vijnana_bhairava.yukti_058
