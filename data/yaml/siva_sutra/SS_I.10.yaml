sutra_id: SS_I.10
sutra: I.10
title: Non-discrimination is the deep sleep of illusion.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: अविवेको मायासौषुप्तम्
transliteration: aviveko māyā-sauṣuptam
translation: Non-discrimination is the deep sleep of illusion.
commentary: Deep sleep here is not physiological rest but a **collapse of discernment**. Awareness remains, but unrecognized. Māyā operates most effectively where consciousness forgets itself entirely.
