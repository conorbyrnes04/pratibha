resonances:
- citation: Yoga Spandakarika — First Flow
  resonance: 'Both texts model manifestation as a reversible oscillation of consciousness: the Siva Sutra shows multiplicity cohering into differentiated form, while Spandakarika 1 shows the same movement as Shakti''s opening and closing of eyes—a single consciousness alternating between reabsorption and manifestation.'
  divergence: The Siva Sutra emphasizes the coherence of sources into a unified body of differentiation, whereas Spandakarika foregrounds the rhythmic agency of Shakti as the active principle driving the cycle.
  passage_id: yoga_spandakarika.sp_01
- citation: Tantrasara — The Heart Born of the Divine Pair
  resonance: 'Both passages mark a structural turn toward manifestation from a prior unity: the Siva Sutra turns ''almost imperceptibly'' from pure identity toward differentiation, while Tantrasara opens at ''the only true beginning''—the embrace of Shakti and Shiva—as the generative threshold where non-dual reality becomes relational.'
  divergence: The Siva Sutra describes an internal coherence of multiplicity within consciousness, whereas Tantrasara emphasizes the dyadic embrace as the originary moment, privileging the divine pair over undifferentiated oneness.
  passage_id: tantrasara.ts_001
