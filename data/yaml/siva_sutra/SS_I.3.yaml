sutra_id: SS_I.3
sutra: I.3
title: The multitude of sources coheres as the body of differentiation.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: योनिवर्गः कलाशरीरम्
transliteration: yonivargaḥ kalāśarīram
translation: The multitude of sources coheres as the body of differentiation.
commentary: 'Here the text turns, almost imperceptibly, from pure identity toward
  manifestation. What was undivided now appears as structure — not yet as error, but
  as articulation.


  _Yoni_ names a source, a generative ground; _varga_ suggests a grouping, a family,
  a collectivity. Taken together, they indicate not a single origin, but a **plurality
  of originating points** through which consciousness expresses itself. This plurality
  does not negate unity; it is unity’s own mode of display.


  _Kalā_ refers to a portion, a measure, a limiting articulation of power. _Śarīra_ is
  a body — not merely physical, but any organized form that can appear, persist, and
  dissolve. The sūtra thus describes how limitation acquires coherence: differentiation
  gathers itself into a body.


  Read in sequence, this verse explains how the freedom named in the first sūtra and
  the contraction named in the second become **structurally possible**. Consciousness
  does not fall into form; it distributes itself. Bondage is not imposed from outside
  — it emerges from the very capacity to articulate, measure, and localize.


  Nothing here is yet mistaken. Differentiation is not the problem. Forgetting the
  ground of differentiation will be.'
