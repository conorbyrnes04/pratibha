resonances:
- citation: 'Vijnana Bhairava — Yukti #37'
  resonance: 'Both texts locate liberation in the precise manipulation of prāṇic dynamics at a threshold point: the Siva Sutra through steady attention at the nasal center, the Vijnana Bhairava through the dynamic tension (sanghaṭṭa) of prāṇas at breath-pause termination. Each produces a shift in consciousness (dissolution/expansion vs. equality-consciousness) via embodied breath-work.'
  divergence: The Siva Sutra emphasizes a single focal point (nasika-antar-madhya) and the dual movement of contraction-expansion, while the Vijnana Bhairava privileges the collision of opposing prāṇic currents and the resulting equanimity-state.
  passage_id: vijnana_bhairava.yukti_037
- citation: Pratyabhijnahrdayam — Sutra 18
  resonance: Both texts enumerate practical means for liberation that include prāṇic cessation and the contraction-expansion (viksaya-ksaya) of Śakti as core techniques within a systematic path.
  divergence: Sutra 18 lists multiple means (vikalpa-dissolution, Śakti unfoldment/contraction, prāṇic cessation, dvādaśānta perception) as a comprehensive toolkit, while the Siva Sutra isolates a single, concentrated practice at the nasal center.
  passage_id: pratyabhijnahrdayam.phr_018
