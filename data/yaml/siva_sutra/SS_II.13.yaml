sutra_id: SS_II.13
sutra: II.13
title: By steady attention at the center within the nostrils, dissolution and expansion
  occur.
collection: Siva Sutra
section: Śāktopāya
sanskrit: नासिकान्तर्मध्यसंयमात्क्षयविक्षयौ
transliteration: nāsikāntar-madhya-saṁyamāt kṣaya-vikṣayau
translation: By steady attention at the center within the nostrils, dissolution and
  expansion occur.
commentary: 'The chapter concludes with a precise, embodied instruction. Attention
  is placed where inner and outer meet — the subtle hinge of breath. This is not a
  technique to induce trance, but a calibration of awareness at a living threshold.


  Here contraction (_kṣaya_) and expansion (_vikṣaya_) are both seen through. The
  practitioner learns to remain present as energies rise and fall, without clinging
  to either. With this, Śāktopāya completes its work: effort refined into stability,
  stability into readiness.'
voice_of_siva: ''
abhyasa: Sit for 3 minutes with natural breathing. At each inhale and exhale, notice
  awareness before naming experience.
modes:
