sutra_id: SS_I.21
sutra: I.21
title: With the rise of pure knowledge, sovereignty over the wheel is fulfilled.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: शुद्धविद्योदयाच्चक्रेशत्वसिद्धिः
transliteration: śuddha-vidyodayāc cakreśatva-siddhiḥ
translation: With the rise of pure knowledge, sovereignty over the wheel is fulfilled.
commentary: 'Pure knowledge does not accumulate facts; it dissolves division. When it dawns, mastery is not control but intimacy. The wheel of energies turns freely, and one moves with it rather than against it.


  Lordship here is not domination, but effortless participation in the whole.'
