sutra_id: SS_I.13
sutra: I.13
title: The power of will is Umā, ever-new.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: इच्छा शक्तिरुमा कुमारी
transliteration: icchā śaktir umā kumārī
translation: The power of will is Umā, ever-new.
commentary: Desire here is not lack, but the pristine impulse of manifestation. Umā
  is will before possession, creativity before aim.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
