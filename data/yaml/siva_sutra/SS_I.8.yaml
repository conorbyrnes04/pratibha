sutra_id: SS_I.8
sutra: I.8
title: Knowledge belongs to the waking state.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: ज्ञानं जाग्रत्
transliteration: jñānaṁ jāgrat
translation: Knowledge belongs to the waking state.
commentary: 'Ordinary knowing arises with orientation toward objects. In waking, consciousness
  extends outward, names, categorizes, and stabilizes appearances. This is the domain
  of functional knowledge.


  The sūtra quietly limits its scope. What is most intimate is not grasped here.'
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
