sutra_id: SS_I.20
sutra: I.20
title: The elements unite, separate, and collide as a single movement.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: भूतसन्धान भूतपृथक्त्व विश्वसंघट्टाः
transliteration: bhūta-sandhāna-bhūta-pr̥thaktva-viśva-saṅghaṭṭāḥ
translation: The elements unite, separate, and collide as a single movement.
commentary: 'The cosmos moves through rhythms of gathering and dispersal. Elements unite, separate, and recombine endlessly. For one established in recognition, these movements no longer obscure; they display the play of consciousness with itself.


  Multiplicity is no longer confusing. It is choreography.'
