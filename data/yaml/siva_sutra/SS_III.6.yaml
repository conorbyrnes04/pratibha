sutra_id: SS_III.6
sutra: III.6
title: When that dissolves, there is re-entry.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: तत्क्षये प्रत्यासंक्रान्तिः
transliteration: tat-kṣaye pratyāsaṁkrāntiḥ
translation: When that dissolves, there is re-entry.
commentary: As misidentification loosens, awareness naturally returns to itself. Nothing
  new is achieved; a detour ends.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
