resonances:
- citation: 'Vijnana Bhairava — Yukti #104'
  resonance: 'Both texts describe a collapse of subject-object duality through sustained recognition: the Siva Sutra shows awareness returning to itself as misidentification dissolves, while Yukti 104 shows the practitioner attaining the goal by recognizing that the same divine attributes apply equally to God and self, dissolving the boundary between meditator and meditated.'
  divergence: The Siva Sutra emphasizes spontaneous re-entry through loosening of false identification, while Vijnana Bhairava prescribes active meditation on conceptual equivalences as the method to achieve non-duality.
  passage_id: vijnana_bhairava.yukti_104
- citation: Plotinus Enneads — Ennead I, Tractate 6, Section 8
  resonance: 'Both texts describe a reversal of attention inward as the mechanism of return: the Siva Sutra shows awareness naturally returning to itself when misidentification dissolves, while Plotinus describes withdrawal into oneself and turning away from external perception as the path to vision of transcendent Beauty.'
  divergence: The Siva Sutra frames this as recognition of what awareness already is (ksaya as loosening), while Plotinus frames it as an ascent toward an inaccessible transcendent reality requiring negation of the sensory.
  passage_id: plotinus_enneads.enn_i_6_08
