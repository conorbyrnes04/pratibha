sutra_id: "1.2"
collection: "Śiva Sūtra"
section: "Śāmbhavopāya"
sanskrit: "ज्ञानं बन्धः"
transliteration: "jñānaṃ bandhaḥ"
translation: "Contracted knowing is bondage."
commentary: |
  Here jñāna = narrow, objectifying cognition. Identification with such knowledge fetters the infinite Self.
modes:
  bhasya: "Kṣemarāja: limited knowledge veils recognition."
  doctrinal: "Relate to mala-s (āṇava, māyīya, kārma)."
  comparative: "PYS 1.2 nirodha ↔ Trika recognition."
  sadhana: "Notice each claim of knowing; relax the claim."
