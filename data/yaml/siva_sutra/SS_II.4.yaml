resonances:
- citation: Patañjali Yoga Sūtras 3.39
  resonance: 'Both texts describe mind''s liberation through a physiological or energetic process that dissolves attachment and returns consciousness to its source: the Siva Sutra shows mind reabsorbed into awareness as practice matures; Patañjali describes the mind''s attachment dissolving through breath and pulse movement, enabling advancement.'
  divergence: The Siva Sutra emphasizes undifferentiated knowing and the womb-source of awareness itself, while Patañjali locates the mechanism in bodily practices (breath, pulse) as the instrumental means to mental transformation.
  passage_id: patañjali_yoga_sūtras.ys_3_39
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 4
  resonance: 'Both texts posit a knowing that transcends ordinary knowledge: the Siva Sutra presents mind unfolding as undifferentiated knowing (avisista-vidya) within awareness, while Plotinus describes the ultimate Principle''s awareness as transcending all knowledge and intellection, requiring a presence beyond multiplicity.'
  divergence: The Siva Sutra grounds this transcendent knowing in the womb of awareness as the generative source of mind itself, whereas Plotinus positions it as a negation or surpassing of the intellective faculty, a reversion to the One beyond being.
  passage_id: plotinus_enneads.enn_vi_9_04
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: 'Both texts use spatial metaphor to indicate the nature of mind as boundless and uncontainable: the Siva Sutra presents mind unfolding like a dream within awareness (suggesting no fixed form), while Tilopa describes mind''s nature as having no center and no circumference, like space itself.'
  divergence: The Siva Sutra emphasizes mind's emergence and reabsorption within a generative womb of awareness, whereas Tilopa stresses the impossibility of pointing to or grasping mind as an object, emphasizing non-conceptual recognition over process.
  passage_id: tilopa_mahamudra.til_002
