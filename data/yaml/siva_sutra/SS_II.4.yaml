sutra_id: SS_II.4
sutra: II.4
title: In the womb of awareness, mind unfolds as undifferentiated knowing, like a
  dream.
collection: Siva Sutra
section: Śāktopāya
sanskrit: गर्भे चित्तविकासोऽविशिष्टविद्यास्वप्नः
transliteration: garbhe citta-vikāso’viśiṣṭa-vidyā-svapnaḥ
translation: In the womb of awareness, mind unfolds as undifferentiated knowing, like
  a dream.
commentary: 'As practice matures, mind is reabsorbed into its source. Differentiation
  has not yet reasserted itself; knowing remains fluid, imaginal, and non-local. This
  is not regression, but gestation.


  The dream here is luminous, not delusive. It marks a phase where knowledge has not
  yet crystallized into concepts, and therefore remains potent.'
