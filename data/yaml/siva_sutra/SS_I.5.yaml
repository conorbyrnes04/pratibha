sutra_id: SS_I.5
sutra: I.5
title: The surge of awareness is Bhairava.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: उद्यमो भैरवः
transliteration: udyamo bhairavaḥ
translation: The surge of awareness is Bhairava.
commentary: 'Here the text names the living pulse within consciousness itself. _Udyama_ is not effort in the ordinary sense; it is the **spontaneous upsurge** by which awareness knows itself as active, vibrant, and free.


  _Bhairava_ is not a deity apart from this surge. He is consciousness at the moment it turns toward expression without losing itself. Fearsome, luminous, ecstatic — Bhairava is the intensity of being awake.


  This sūtra corrects a subtle misunderstanding: liberation is not stillness opposed to movement. The surge is not an error. When recognized, it is freedom itself.'
