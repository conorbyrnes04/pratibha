resonances:
- citation: Pratyabhijnahrdayam — Sutra 20
  resonance: Both texts locate the power of mantra (mantra-virya) as the direct fruit of entering a specific state of consciousness—in the Siva Sutra through descent into maha-hrada (great depth), in Pratyabhijnahrdayam through entry into Perfect I-consciousness. Both treat mantra-power not as external technique but as an immediate knowing that arises from consciousness itself.
  divergence: The Siva Sutra emphasizes depth and silence as the mode of entry, while Pratyabhijnahrdayam foregrounds the luminous I-consciousness (Light and Bliss) as the vehicle; the former is more apophatic, the latter more affirmative.
  passage_id: pratyabhijnahrdayam.phr_020
- citation: Tantrasara — The One for Whom No Means Is Needed
  resonance: 'Both texts pivot toward a non-methodical or pathless realization: the Siva Sutra''s return to depth bypasses graduated ascent, and Anupāya in Tantrasara explicitly names the ''no-method method.'' Both suggest that direct knowing transcends systematic practice.'
  divergence: The Siva Sutra frames this as a structural closure (returning to depth), while Tantrasara names it as a distinct philosophical category (Anupāya); one is implicit in form, the other explicit in doctrine.
  passage_id: tantrasara.ts_008
- citation: Yoga Spandakarika — First Flow
  resonance: 'Both texts describe a direct penetration to nondual source that does not require sequential ascent or external means: the Siva Sutra enters depth to know mantra-power directly, and the Spandakarika''s tantrika ''goes straight to the nondual source'' even within duality. Both collapse the distance between practice and realization.'
  divergence: The Siva Sutra emphasizes silence and depth as the modality, while Spandakarika emphasizes the immersion of pure subjectivity in its own nature; one is spatial-vertical, the other is self-reflexive.
  passage_id: yoga_spandakarika.sp_03
