sutra_id: SS_I.22
sutra: I.22
title: By entering the great depth, the power of mantra is directly known.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: महाह्रदानुसन्धानान्मन्त्रवीर्यानुभवः
transliteration: mahā-hradānusandhānān mantra-vīryānubhavaḥ
translation: By entering the great depth, the power of mantra is directly known.
commentary: 'The chapter closes by returning to depth rather than ascent. The great
  lake is consciousness itself—vast, still, unfathomable. When attention abides there,
  mantra is no longer sound or technique; it is potency arising from silence.


  What is known here cannot be taught. It is tasted. With this, Śāmbhavopāya completes
  its arc: from identity, through manifestation, back into immeasurable depth.'
voice_of_siva: ''
abhyasa: For 2 minutes, observe inner speech as sound only. Return to the silent awareness
  that hears it.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: For 2 minutes, observe inner speech as sound only. Return to the silent
    awareness that hears it.
glossary:
- term: mahā-hrada
  meaning: the great lake, depth of consciousness
- term: anusandhāna
  meaning: sustained entering, deep investigation
- term: mantra-vīrya
  meaning: the living power of mantra
themes:
