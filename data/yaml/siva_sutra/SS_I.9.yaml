sutra_id: SS_I.9
sutra: I.9
title: Dreaming is the play of imaginations.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: स्वप्नो विकल्पाः
transliteration: svapno vikalpāḥ
translation: Dreaming is the play of imaginations.
commentary: 'In dream, consciousness no longer requires external support. Images arise
  from their own momentum. The mind rehearses creation freely, unbound by sensory
  constraint.


  This freedom, however, is unstable. Without recognition, imagination mistakes itself
  for reality.'
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
