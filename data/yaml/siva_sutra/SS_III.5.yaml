sutra_id: SS_III.5
sutra: III.5
title: Non-discrimination of the principles beginning with limitation is illusion.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: कलादीनां तत्त्वानामविवेको मायाया
transliteration: kalādīnāṁ tattvānām aviveko māyāyāḥ
translation: Non-discrimination of the principles beginning with limitation is illusion.
commentary: In Āṇavopāya, error is precise. Māyā operates when limitation (_kalā_ and
  the rest) is taken as final rather than functional. The practitioner learns to see
  limitation as a condition, not an identity.
