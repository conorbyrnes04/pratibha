resonances:
- citation: Pratyabhijnahrdayam — Sutra 6
  resonance: 'Both texts identify illusion (māyā/aviveka) as a contraction or limitation of consciousness: the Siva Sutra locates error in non-discrimination of the principles *beginning with limitation* (kala), while Pratyabhijnahrdayam 6 defines the limited experient as one *ruled by Māyā* and characterized by *contracted mind*. Each makes limitation itself the mechanism of illusion.'
  divergence: The Siva Sutra emphasizes epistemic failure (aviveka, non-discrimination) as the root, whereas Pratyabhijnahrdayam emphasizes ontological contraction of consciousness (cittasankoca) as the defining feature of the bound state.
  passage_id: pratyabhijnahrdayam.phr_006
- citation: Svetasvatara Upanishad — Māyā Is Dependence, Not a Second Reality
  resonance: 'Both texts present illusion as a projection or constraint imposed by a cosmic principle: the Siva Sutra''s non-discrimination of limiting principles generates illusion, while the Svetasvatara describes māyā as the mechanism by which the Maker projects the world and constrains the individual within it. Each locates illusion in a structural dependence on a limiting power.'
  divergence: The Siva Sutra treats illusion as arising from cognitive error (aviveka) within Āṇavopāya practice, whereas the Svetasvatara presents māyā as an ontological cosmic force that structures reality itself, independent of individual discrimination.
  passage_id: svetasvatara_upanishad.svu_002
