resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts locate the sacred offering within the breath-body itself: the Siva Sutra makes the body the havis (offering), while Vijnana Bhairava Yukti #1 identifies the Supreme Goddess as constantly articulating through prāṇa and jīva—the dual breath-movements that constitute embodied life. In both, practice enters flesh through breath as the primary locus of sacrifice.'
  divergence: The Siva Sutra frames the body as offering in a unified act of recognition, while Vijnana Bhairava emphasizes the dual oscillation (exhale/inhale) as the Goddess's continuous articulation—one stresses integration, the other the dynamic polarity within embodiment.
  passage_id: vijnana_bhairava.yukti_001
- citation: Tantrasara — Subtle Sound – Mantra as Breath of Śiva
  resonance: 'Both texts describe how sacred practice enters the body through coordinated breath and mantra: the Siva Sutra declares the body itself becomes the offering through practice, while Tantrasara''s Āṇava path begins with mouth movement, breath coordination, and sacred syllables—a somatic entry into the divine through the breath-body.'
  divergence: The Siva Sutra treats the body as already-sacred offering requiring recognition, while Tantrasara's Āṇava path constructs sacredness through deliberate, step-by-step coordination of breath and sound—one emphasizes revelation, the other gradual embodied practice.
  passage_id: tantrasara.ts_018
