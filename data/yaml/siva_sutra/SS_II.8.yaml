sutra_id: SS_II.8
sutra: II.8
title: The body is the offering.
collection: Siva Sutra
section: Śāktopāya
sanskrit: शरीरं हविः
transliteration: śarīraṁ haviḥ
translation: The body is the offering.
commentary: 'Practice now enters the flesh. The body is no longer an obstacle to be
  transcended, but the site of sacrifice — not through harm, but through availability.


  To offer the body is to allow sensation, posture, and breath to become vehicles
  of awareness. Nothing is excluded.'
voice_of_siva: ''
abhyasa: Sit for 3 minutes with natural breathing. At each inhale and exhale, notice
  awareness before naming experience.
