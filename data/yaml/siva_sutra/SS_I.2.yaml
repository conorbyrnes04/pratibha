sutra_id: SS_I.2
sutra: I.2
title: Knowledge is bondage.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: ज्ञानं बन्धः
transliteration: jñānaṁ bandhaḥ
translation: Knowledge is bondage.
commentary: 'Encountering this suitra may Startle intially, and Perhaps it does intentionally
  So. Jnana iS typically seen as a means of Salvation in many meditation traditions,
  Whereas ignorance is considered to be that which binds. yet this isn''t luminous
  and authoritative knowledge itself. Rather it is knowledge about: about this particular
  thing or that. limited knowledge, relative knowledge. As soon as I say that is a
  tree, I ignore the truth that this is also rain, sun, and soil crystalized. As soon
  as I say this is the Morning, I live it from a filter of Past ''morning'' experiences
  and lose the awareness of the infinite nuance of this sunrise


  Taken immediately after the first sūtra, this line sounds almost antithetical. If
  consciousness is the Self, Why would knowledge, Which is traditionally seen in the
  various yoga traditions as bind?


  The answer lies in the shift from _caitanya_ to _jñāna_. Here, knowledge is not
  luminous knowing itself, but knowing _about_— structured, articulated, divided.
  It is consciousness turned toward objects, including subtle objects such as concepts,
  insights, and spiritual understandings.


  Bondage does not arise from ignorance alone. It also arises from fixation. The moment
  knowing hardens into something possessed — _my understanding, my realization_ —
  a subtle contraction takes place. Consciousness, infinite in its own nature, begins
  to mirror itself as limited form.


  Read in this way, the sūtra is not anti-knowledge. It is diagnostic. It names the
  precise point at which freedom becomes enclosure: when knowing forgets its source
  and takes itself to be final.


  Placed beside the first sūtra, a tension is introduced that will quietly structure
  the entire chapter. Consciousness is the Self — yet knowledge can bind. What liberates
  is not the accumulation of insight, but the recognition of the ground from which
  all insight arises.'
