sutra_id: SS_I.11
sutra: I.11
title: The enjoyer of the three states is the Lord.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: त्रितयभोक्ता वीरेशः
transliteration: tritaya-bhoktā vīreśaḥ
translation: The enjoyer of the three states is the Lord.
commentary: Behind waking, dream, and deep sleep stands a single experiencer. Not
  the ego, but the sovereign witness who remains unchanged as states arise and fall.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
