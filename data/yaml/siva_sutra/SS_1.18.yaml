id: "SS_1.18"
number: "1.18"
sutra:
  devanagari: ""
  transliteration: ""
  translation: ""
needs_verification: true
scholarly_commentary: |
  By resting as witness, karmic winds calm; reactions lose compulsion.
voice_of_siva: |
  When you stop fusing with impulses, they lose the right to steer Your life.
abhyasa: |
  Name a strong urge, feel it in the body, breathe until it is simply energy.
modes:
  bhasya: |
    Kārma-mala attenuates through recognition; agency clarifies.
  doctrinal: |
    Vairāgya reframed as luminous non-compulsion.
  comparative: |
    Ignatian discernment; Buddhist non-reactivity.
  sadhana: |
    Urge-surfing in awareness: ride the wave without acting it out.
