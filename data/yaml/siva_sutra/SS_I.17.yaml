sutra_id: SS_I.17
sutra: I.17
title: Reflection becomes knowledge of the Self.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: वितर्क आत्मज्ञानम्
transliteration: vitarka ātmājñānam
translation: Reflection becomes knowledge of the Self.
commentary: 'At this stage, thought itself is no longer an obstacle. When reflection
  arises without grasping, without agenda, it turns back toward its own source. Vitarka
  is not analysis in the ordinary sense, but a gentle circling of awareness around
  itself.


  Here knowing no longer binds, because it does not claim ownership. Thought becomes
  translucent, serving recognition rather than replacing it. Even ordinary cognition,
  when free of contraction, discloses the Self.'
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it without haste or self-narration.
  End with one breath of gratitude.
modes:
  bhasya: ''
  doctrinal: ''
  comparative: ''
  sadhana: Choose one ordinary action today and perform it without haste or self-narration.
    End with one breath of gratitude.
glossary:
