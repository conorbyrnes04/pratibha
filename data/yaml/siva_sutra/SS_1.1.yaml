id: "SS_1.1"
number: "1.1"
sutra:
  devanagari: "चैतन्यमात्मा"
  transliteration: "caitanyam ātmā"
  translation: "Consciousness is the Self."
scholarly_commentary: |
  Kṣemarāja: caitanya is self-luminous, self-revealing awareness (svasaṃvedana), the essence of ātman.
  Not a passive witness but vibrant intelligence (spanda). Jaideva Singh: the fundamental postulate—Self is universal Subject, never an object.
voice_of_siva: |
  You are not thought, not body, not the changing waves.
  You are Consciousness Itself—boundless, unbroken, shining.
  Remember: all that appears arises in You and dissolves into You.
abhyasa: |
  Sit and notice the simple fact of being aware.
  When a thought appears, ask: “What knows this thought?”
  Rest as That clear Knowing.
modes:
  bhasya: |
    Establishes the ground: ātmā ≠ object; ātmā = luminous Subject. All later sūtras unpack this axiom.
  doctrinal: |
    Caitanya (awareness‑power), spanda (dynamic pulse), svātantrya (sovereign freedom).
  comparative: |
    Sufi tajallī; Eckhart’s ground; Palamite energies as participation in uncreated light.
  sadhana: |
    Return attention from objects to the knower. Abide as the unchanging Seer (draṣṭā).
