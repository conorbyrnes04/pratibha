id: "SS_1.3"
number: "1.3"
sutra:
  devanagari: "योनिवर्गः कलाशरीरम्"
  transliteration: "yonivargaḥ kalāśarīram"
  translation: "The brood of sources (categories) forms the body of limiting power."
scholarly_commentary: |
  Yoni‑varga: the generative complex of Māyā and derivative tattvas. Kalā limits do‑ability; together they scaffold finite embodiment and role‑identity.
voice_of_siva: |
  Your body, senses, and thoughts are garments woven of powers—useful, beautiful, not ultimate.
  Wear them lightly; do not mistake the costume for Your Self.
abhyasa: |
  Scan identities (body/role/story). Whisper inwardly: “Appearing in Me.”
  Feel agency widen beyond the mask.
modes:
  bhasya: |
    Read with the tattva‑map from Māyā downward; see how limitation crystallizes.
  doctrinal: |
    Kalā as limiter of kriyā‑śakti; relates to māyīya/kārma‑mala.
  comparative: |
    Veils (ḥujub) in Sufism; apophatic correction in Christian mysticism.
  sadhana: |
    Before action, recall: ‘I act within Awareness.’ Let action be light, not identity.
