sutra: 1.16
sanskrit: [paste canonical line]
status: needs_verification
translation: When thought resolves in its source, one’s nature shines forth.
voice_of_siva: |
  Let thought return to its spring; in the pause, Your nature is self-revealed.
  Do not grasp the gap; relax as its clarity.
abhyasa: |
  Feel the natural micro-pauses between exhale and inhale.
  Rest there, lightly, without holding the breath.
modes:
  bhasya: |
    Laya (resolution) is not stupor; it is luminous non-mentation in which recognition dawns.
  doctrinal: |
    Prakāśa–vimarśa: light and reflexive awareness announce themselves as one.
  comparative: |
    Sufi sukūn (stillness) amid dhikr; Zen’s stop in the between.
  sadhana: |
    “Gap” practice: several times an hour, notice the tiny gap before a task begins—abide as that.