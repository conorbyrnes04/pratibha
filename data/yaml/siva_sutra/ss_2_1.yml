sutra: 2.1
sanskrit: "cittam mantraḥ"
transliteration: "cittam mantraḥ"
translation: |
  The mind itself is mantra.
voice_of_siva: |
  Your mind, when bound by thoughts, is noise; when stilled and attuned, it is mantra. 
  Not syllables alone, but every pulse of attention is vibration. 
  See: what You call 'mind' is the ceaseless recitation of Śakti — each arising thought is a mantra of Your own Being.
abhyasa: |
  Sit and notice the flow of thoughts. Instead of resisting, listen as if each thought were a mantra, 
  a sacred syllable arising in the temple of awareness. Feel the shift from chatter to resonance.
modes:
  bhasya: |
    In Trika, mantra is not merely articulated sound but the power of consciousness to vibrate meaning.
    Utpaladeva clarifies: mind (citta) is itself nothing but mantric pulsation (uccāra). 
    Thus, the yogin sees no distinction between 'inner thought' and 'recited mantra.'
  doctrinal: |
    Maps to the recognition that the śakti of vāc (speech) pervades all levels — from parā (supreme, undifferentiated vibration) 
    down to vaikharī (spoken utterance). Citta itself, as mantramayī śakti, is the field of realization.
  comparative: |
    Sufi: dhikr as perpetual remembrance — not only repeated words, but the mind itself remembering.
    Christian hesychasm: the ceaseless "Prayer of the Heart" — mind and mantra merged.
  sadhana: |
    Yukti — rather than controlling thought, reframe each as mantra. 
    A rising irritation? Hear it as “hrīm.” A passing memory? Hear it as “om.” 
    Let the mind’s movement itself be devotion.
upaya: "śāktopāya (the recognition that the mind itself, when aligned, reveals mantra as Śakti’s vibration)."