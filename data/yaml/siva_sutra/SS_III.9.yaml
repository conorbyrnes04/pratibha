sutra_id: SS_III.9
sutra: III.9
title: The universe is the resting of one’s own power.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: स्वशक्त्यावस्थानं विश्वम्
transliteration: sva-śakty-avasthānaṁ viśvam
translation: The universe is the resting of one’s own power.
commentary: The world is re-seen as stabilized energy. Nothing stands outside awareness;
  everything stands _within_ its play.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
