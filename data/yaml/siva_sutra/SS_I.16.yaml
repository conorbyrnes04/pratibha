sutra_id: SS_I.16
sutra: I.16
title: Or, by resting in the pure principle, the bound power dissolves.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: शुद्धतत्त्वसन्धानाद्वा अपशुशक्तिः
transliteration: śuddha-tattva-sandhānād vā apaśu-śaktiḥ
translation: Or, by resting in the pure principle, the bound power dissolves.
commentary: There is another possibility. Without traversing the play of manifestation,
  one may turn directly toward the unconditioned. In that alignment, the power that
  binds reveals itself as never having been separate.
