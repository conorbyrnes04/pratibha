id: "SS_1.10"
number: "1.10"
sutra:
  devanagari: "त्रितयभोक्ता वीरेशः"
  transliteration: "tritayabhoktā vīreśaḥ"
  translation: "The enjoyer of the triad of states is the Lord of Heroes."
needs_verification: true
scholarly_commentary: |
  The one Subject enjoys waking, dream, deep sleep; sovereignty (vīreśa) is the Self beyond states.
voice_of_siva: |
  You, who witness all states, are sovereign. Do not shrink to any single mask.
abhyasa: |
  At day’s end, review all three states; bow to the One Witness as Your Self.
modes:
  bhasya: |
    Establishes the witnessing Subject beyond avasthās.
  doctrinal: |
    Vīra (hero) as steadfast recognizer; lordship as innate.
  comparative: |
    Turīya in Māṇḍūkya; ‘I AM’ beyond states (mystics).
  sadhana: |
    State‑transition awareness: notice the seams between waking↔sleep↔dream.
