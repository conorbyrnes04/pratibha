sutra_id: "1.1"
collection: "Śiva Sūtra"
section: "Śāmbhavopāya"
sanskrit: "चैतन्यमात्मा"
transliteration: "caitanyam ātmā"
translation: "Consciousness is the Self."
commentary: |
  The Self is luminous subjectivity (caitanya). Bondage begins when it is mistaken for any limited object.
modes:
  bhasya: "Line-by-line gloss…"
  doctrinal: "Spanda, pratyabhijñā."
  comparative: "Cf. Ibn ʿArabī’s tajallī; Eckhart’s ground."
  sadhana: "Sit; feel awareness prior to thought; rest."
