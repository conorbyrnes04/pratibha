sutra_id: SS_III.7
sutra: III.7
title: From consciousness, the Self is known.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: चैतन्यादात्मा
transliteration: caitanyād ātmā
translation: From consciousness, the Self is known.
commentary: Even here, recognition is indirect. Consciousness is approached through
  training until it reveals its ground.
