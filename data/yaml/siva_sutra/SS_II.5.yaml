sutra_id: SS_II.5
sutra: II.5
title: Disciplines arise from established knowledge.
collection: Siva Sutra
section: Śāktopāya
sanskrit: विद्यासनातन्त्राणि
transliteration: vidyāsanā-tantrāṇi
translation: Disciplines arise from established knowledge.
commentary: 'Once knowledge has become embodied, it naturally expresses itself as discipline. Practice is no longer imposed from outside; it unfolds from understanding. What is known reorganizes how one sits, speaks, listens, and acts.


  These disciplines are not rigid systems. They are responsive forms shaped by clarity. When knowledge is partial, discipline becomes compulsive. When knowledge is stable, discipline becomes fluid.'
