sutra_id: SS_II.9
sutra: II.9
title: Knowledge is nourishment.
collection: Siva Sutra
section: Śāktopāya
sanskrit: ज्ञानं अन्नम्
transliteration: jñānam annam
translation: Knowledge is nourishment.
commentary: Understanding must now feed life rather than inflate identity. Knowledge
  that cannot be digested becomes excess. Knowledge that nourishes strengthens clarity,
  compassion, and stability.
voice_of_siva: ''
abhyasa: Read this passage slowly three times. Pause for one minute and write one
  sentence about how to apply it today.
modes:
