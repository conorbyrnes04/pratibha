resonances:
- citation: Svetasvatara Upanishad — Knowledge and Ignorance in the Imperishable
  resonance: Both texts posit knowledge and ignorance as a fundamental binary pair that must be explicitly named and distinguished. The Siva Sutra's plain naming of the distinction mirrors the Svetasvatara's declaration that these two are 'hidden' in Brahman—both treat the knowledge/ignorance dyad as the primary structural problem requiring articulation.
  divergence: The Svetasvatara embeds the pair within an ontological substrate (the imperishable Brahman), whereas the Siva Sutra treats the distinction as an epistemological threshold to be recognized through attention, without grounding it in a transcendent absolute.
  passage_id: svetasvatara_upanishad.svu_013
- citation: Tao Te Ching — The Paradox of Knowing
  resonance: 'Both texts establish a precise distinction between authentic and false knowledge by inverting conventional expectation: the Siva Sutra names knowledge and ignorance plainly as a necessary move, while the Tao Te Ching identifies the disease of mistaking ignorance for knowledge and true knowledge for ignorance—both require a reversal of ordinary perception to see the actual distinction.'
  divergence: The Tao Te Ching frames the distinction as a paradox of knowing (a logical inversion), whereas the Siva Sutra treats it as a direct phenomenological naming requiring heightened attention rather than conceptual paradox.
  passage_id: tao_te_ching.ttc_md_073
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both identify ignorance as a failure of attention or perception rather than an absence of knowledge: the soul''s characteristic act continues unperceived because attention is misdirected to sense-experiences, paralleling how the Siva Sutra''s plain naming requires redirected attention to distinguish knowledge from ignorance.'
  divergence: Plotinus locates the problem in the soul's divided attention between intelligible and sensible realms, whereas the Siva Sutra frames it as a direct epistemological distinction that attention itself must clarify.
  passage_id: plotinus_enneads.enn_v_1_12
