sutra_id: SS_III.4
sutra: III.4
title: Knowledge and ignorance.
collection: Siva Sutra
section: Āṇavopāya
sanskrit: विद्या अविद्या
transliteration: vidyā avidyā
translation: Knowledge and ignorance.
commentary: 'At this level, the distinction must be named plainly. Some ways of knowing clarify; others obscure. The practitioner learns discernment not as judgment, but as orientation.


  Ignorance here is not the absence of information, but the habit of misplacing attention. Knowledge is whatever returns awareness toward its source, even provisionally.'
