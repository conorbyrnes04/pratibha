id: "SS_1.7"
number: "1.7"
sutra:
  devanagari: "ज्ञानं जाग्रत्"
  transliteration: "jñānaṃ jāgrat"
  translation: "Waking is structured knowing."
needs_verification: true
scholarly_commentary: |
  Three states teaching: waking as vikalpa‑governed cognition. The Self is the enjoyer of all three, not any one.
voice_of_siva: |
  Waking is a lucid dream woven of concepts. Do not be fooled by its firmness.
  Through it all, You remain the Seer.
abhyasa: |
  During any task, whisper: ‘Seen in Awareness.’ Feel solidity soften into lucidity.
modes:
  bhasya: |
    Describe jāgrat as outward‑turned, object‑fixing cognition.
  doctrinal: |
    Three states (avasthātraya) as pedagogical device for recognition.
  comparative: |
    Advaita’s avasthātraya‑viveka; Yogācāra on constructed perception.
  sadhana: |
    Hourly bell: for one breath, regard the scene as a dream appearing in You.
