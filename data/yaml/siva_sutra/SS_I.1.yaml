sutra_id: SS_I.1
sutra: I.1
title: Consciousness is the Self.
collection: Siva Sutra
section: Śāmbhavopāya
sanskrit: चैतन्यमात्मा
transliteration: caitanyam ātmā
translation: Consciousness is the Self.
commentary: 'The sūtra does not instruct; it states ontological necessity: what cannot
  be otherwise.


  Consciousness is not something the Self has, nor a light by which the Self is later
  revealed. It is the very ground of being - prior to reflection, prior to division,
  prior to the sense of “I.” The aphorism is deliberately bare. Nothing is added because
  nothing can be added. Mathematically it is expressed as a very simple formula: consciousness
  = self.


  There is no separate "me" here who is doing consciousness, and no consciousness
  that belongs to a brain. A stark rejection of materialism, epiphenomenalism, dualism,
  the claim states that everything I am is consciousness. The fictious orientation
  — _I am here, and awareness is over there with this thought or that emotion_ — quietly
  collapses. What remains is not a new experience, but a ground that was never absent.


  Read in this way, the sūtra does not resolve a question; it clarifies a miscalculation.
  The Self is not hidden behind consciousness, nor does consciousness arise within
  the Self. They are named twice only to dissolve the need for naming them further.


  Śāmbhavopāya begins precisely here: not with effort, but with the cessation of looking
  elsewhere.


  It is important now to dive into the essential philosophical qualities attributed
  to caitanya in Tantrik Saivisim. Consciousness is made up of two essential movements,
  a shining outwards, refered to as prakasa, and a reflection back, referred to as
  vimarśa. Most simply is knowing and being aware of knowing. The light and the mirror
  that reflects it back.'
