source_reference: Meister Eckhart, *Von Abegescheidenheit* (§7–8 — definition)
sanskrit_devanagari: 'Nû maht dû vrâgen, waz abegescheidenheit sî, wan si als gar
  edel an ir selber ist? Hie solt dû wizzen, daz rehtiu abegescheidenheit niht anders
  enist, wan daz der geist alsô unbewegelich stande gegen allen zuovellen liebes und
  leides, êren, schanden und lasters als ein blîgîn berc unbewegelich ist gegen einem
  kleinen winde. Disiu unbewegelîchiu abegescheidenheit bringet den menschen in die
  grœste glîcheit mit gote. Wan daz got ist got, daz hât er von sîner unbewegelîchen
  abegescheidenheit, und von der abegescheidenheit hât er sîne lûterkeit und sîne
  einvalticheit und sîne unwandelbærkeit. Und dâ von, sol der mensche gote glîch werden,
  als verre als ein crêatûre glîcheit mit gote gehaben mac, daz muoz geschehen mit
  abegescheidenheit. Diu ziuhet danne den menschen in lûterkeit und von der lûterkeit
  in einvalticheit und von der einvalticheit in unwandelbærkeit, und diu dinc bringent
  eine glîcheit zwischen gote und dem menschen; und diu glîcheit muoz beschehen in
  gnâden, wan diu gnâde ziuhet den menschen von allen zîtlîchen dingen und liutert
  in von allen zergenclîchen dingen. Und dû solt wizzen: lære sîn aller crêatûre ist
  gotes vol sîn, und vol sîn aller crêatûre ist gotes lære sîn.'
sanskrit_iast: Middle High German — see Original. Key terms in commentary.
translation_literal: 'Now you may ask what detachment is, since it is so noble in
  itself. Know this: true detachment is nothing other than for the spirit to stand
  as immovable against whatever may befall it of joy and sorrow, honor, shame, and
  disgrace, as a mountain of lead stands immovable before a little wind. This immovable
  detachment brings a person into the greatest equality with God. For that God is
  God, he has from his immovable detachment; and from detachment he has his purity,
  his simplicity, and his unchangeability. Therefore if a human being is to become
  equal with God — so far as a creature can have equality with God — it must happen
  through detachment. Detachment then draws one into purity, and from purity into
  simplicity, and from simplicity into unchangeability, and these produce an equality
  between God and the human being; and that equality must come about in grace, for
  grace draws one from all temporal things and purifies from all transient things.
  And you must know: to be empty of all creatures is to be full of God, and to be
  full of all creatures is to be empty of God.'
commentary: 'Here Eckhart defines the virtue by a physics of immovability. The lead
  mountain does not refuse the wind by fighting it; it is simply too dense to be swayed.
  Equality with God is not moral imitation but participation in God''s own detachment
  — the purity, simplicity, and unchangeability by which God *is* God. The ladder
  (purity → simplicity → unchangeability) is a phenomenology of emptying, and Eckhart
  insists the equality is *in grace*, not self-manufacture. The final maxim is the
  treatise in one line: creature-full equals God-empty; creature-empty equals God-full.
  The contested pastoral reading of Stoic calm is refused: this is not indifference
  as armor but vacancy as hospitality. Existentially: inventory what currently "fills"
  the heart; each occupancy is a displacement of God.


  Key Terms


  **blîgîn berc (MHG)** — "lead mountain." Image of density against trivial force;
  detachment''s strength is mass of emptiness, not willpower clenched.


  **einvalticheit (MHG)** — "simplicity, single-foldedness." Not naivety; undividedness
  — the opposite of a heart split among creatures.


  **lære sîn / vol sîn (MHG)** — "to be empty" / "to be full." Zero-sum occupancy:
  creatures and God do not cohabit as equals in the same receptive place.


  Cross-Tradition Resonances


  **Īśāvāsya Upaniṣad 1 (the Lord''s filling / renunciation):** Both couple fullness
  of the Absolute with a releasing of grasping.

  *Divergence:* The Īśā holds enjoyment-with-renunciation in the world; Eckhart''s
  maxim is starker about mutual exclusion in the heart''s occupancy.


  **Plotinus VI.9 (union by stripping to simplicity):** Both ascend by simplification
  toward the unchangeable.

  *Divergence:* Plotinus''s One is beyond being and intellect; Eckhart''s God remains
  the personal giver who occupies the emptied heart by grace.'
insight: Here Eckhart defines the virtue by a physics of immovability.
practice: 'Evening review: list what occupied your heart today (people, fears, ambitions,
  screens). For each, say quietly: this filled me; therefore God was crowded out.
  Then sit two minutes empty — not pushing contents away violently, just not feeding
  them — and notice the different density.'
