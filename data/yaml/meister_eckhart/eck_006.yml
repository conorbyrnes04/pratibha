source_reference: Meister Eckhart, *Von Abegescheidenheit* (§8–9 — eternal glance)
sanskrit_devanagari: 'Nû solt dû wizzen, daz got in dirre unbewegelîchen abegescheidenheit
  ist êwelten gestanden und noch stât, und solt wizzen: dô got himelrîche und ertrîche
  beschuof und alle crêatûre, daz gienc sîne unbewegelîche abegescheidenheit als wênic
  ane, als ob nie crêatûre geschaffen wære. Ich spriche ouch mêr: allez daz gebet
  und guotiu werk, diu der mensche in der zît mac gewürken, daz gotes abegescheidenheit
  alsô wênic dâ von beweget wirt, als ob niendert gebet noch guotez werk in der zît
  beschæhe, und enwirt got niemer deste milter noch deste geneigeter gegen dem menschen,
  dan ob er daz gebet oder diu guoten werk niemer gewürhte. Ich spriche ouch mêr:
  dô der sun in der gotheit mensche werden wolte und wart und die marter leit, daz
  gienc die unbewegelîche abegescheidenheit gotes alsô wênic ane, als ob er nie mensche
  worden wære. Nû möhtest dû sprechen: sô hœre ich wol, allez gebet und alliu guotiu
  werk sint verlorn, wan sich got ir niht anenimet, daz in ieman dâ mite bewegen müge,
  und sprichet man doch: got wil umbe alliu dinc gebeten werden. Hie solt dû mich
  wol merken und rehte verstân, ob dû maht, daz got in sînem êrsten êwigen anblicke
  - ob wir einen êrsten anblik dâ nemen solten -, alliu dinc anesach, als sie beschehen
  solten, und sach in dem selben anblicke, wanne und wie er die crêatûre schepfen
  wolte und wanne der sun mensche werden wolte und lîden solte; er sach ouch daz minste
  gebet und guote werk, daz ieman solte tuon, und sach ane, welhez gebet und andâht
  er erhœren wolte oder solte; er sach, daz dû in morgen wilt mit ernste aneruofen
  und biten, und daz aneruofen und gebet enwil got niht morgen erhœren, wan er hât
  ez erhœret in sîner êwicheit, ê dû ie mensche würde. Enist aber dîn gebet niht endelich
  und âne ernst, sô enwil dir got niht nû versagen, wan er hât dir in sîner êwicheit
  versaget. Und alsô hât got in sînem êrsten êwigen anblicke alliu dinc anegesehen,
  und got würket nihtes niht von niuwem, wan ez ist allez ein vorgewürket dinc [1].
  Und alsô stât got alle zît in sîner unbewegelîchen abegescheidenheit, und enist
  doch dar umbe der liute gebet und guotiu werk niht verlorn; wan der wol tuot, dem
  wirt ouch wol gelônet, der übel tuot, dem wirt ouch dar nâch gelônet. Disen sin
  redet sant Augustînus in dem fünften buoche von der drîvalticheit in dem jüngesten
  capitel und sprichet alsô: »Deus autem« etc., daz ist als vil gesprochen: »nû enwelle
  got, daz ieman spreche, daz got ieman zîtlîche minne, wan bî im enist nihtes niht
  verloufen und ouch nihtes niht künftic und hât alle heiligen geminnet, ê diu werlt
  ie wart geschaffen, als er sie versehen hât. Und swenne ez kumet in die zît, daz
  er öuget in der zît, daz er in der êwicheit hât anegesehen, sô wænent die liute,
  got habe eine niuwe minne an sie geleget; und alsô, sô er zürnet oder etwaz guotes
  tuot, sô werden wir gewandelt und blîbet er unwandelbære, als der sunnen schîn tuot
  den siechen ougen wê und den gesunden wol, und blîbet doch der sunnen schîn unwandelbære
  an im selber.'
sanskrit_iast: Middle High German — see Original. Key terms in commentary.
translation_literal: 'Know that God has stood in this immovable detachment from everlasting
  and still stands. When God created heaven and earth and all creatures, that affected
  his immovable detachment as little as if no creature had ever been made. Further:
  all the prayer and good works a person can perform in time move God''s detachment
  as little as if no prayer or good work ever happened in time — and God is never
  the gentler or more inclined toward someone than if that prayer or work had never
  been done. Further still: when the Son in the Godhead wished to become human and
  became human and suffered, that affected God''s immovable detachment as little as
  if he had never become human. You might say: then all prayer and good works are
  wasted, since God is not moved by them — and yet people say God wants to be asked
  for everything. Understand, if you can: in his first eternal glance God saw all
  things as they would happen — when and how he would create, when the Son would become
  human and suffer, the least prayer and work anyone would do, and which devotion
  he would hear. He saw that tomorrow you will call on him earnestly; he will not
  hear that prayer *tomorrow*, for he has heard it in his eternity before you ever
  became human. If your prayer lacks earnestness, he does not refuse you *now*; he
  has refused you in his eternity. So God works nothing newly; everything is already
  wrought beforehand. Thus God always stands in immovable detachment — and yet prayer
  and good works are not lost: whoever does well is well rewarded, whoever does ill
  is rewarded accordingly. As Augustine says: God forbid anyone should say God loves
  someone in time, for with him nothing is past or future; he loved all the saints
  before the world was made. When in time he shows what he has regarded in eternity,
  people think God has turned a new love toward them; yet when he seems angry or gracious,
  *we* are changed and *he* remains unchangeable — as sunlight hurts sick eyes and
  helps healthy ones, while the sunlight itself remains unchangeable.'
commentary: 'Eckhart protects God''s immutability without voiding prayer. The contested
  synthesis: temporally, nothing you do *begins* a new divine attitude; eternally,
  your earnest prayer is already included in the first glance that sees all. Prayer
  is not lever-pulling on a changeable God; it is alignment with what eternity has
  already regarded. The Augustine sun image relocates all drama of divine mood into
  the creature''s changing receptivity. Existentially: pray earnestly without the
  superstition that you are updating God; let the practice change *you* into the one
  who can bear the light.


  Key Terms


  **êwiger anblik (MHG)** — "eternal glance." God''s single regard in which all temporal
  events are seen at once.


  **unwandelbære (MHG)** — "unchangeable." Applied to God; change is predicated of
  us.


  **vorgewürket (MHG)** — "already wrought beforehand." Denies novelty in God without
  denying the moral seriousness of acts.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9–11 (the cosmic form / acts within an already-complete divine field):**
  Both place human action inside a totality that is not surprised by time.

  *Divergence:* The Gītā keeps a personal Lord who reciprocates devotion within līlā;
  Eckhart stresses that reciprocity never implies temporal change in God.


  **Know Yourself / Balyānī (no before or after with the One):** Both refuse temporal
  predicates of the Absolute.

  *Divergence:* The Sufi treatise often dissolves the creature more absolutely; Eckhart
  keeps prayer, works, and reward language while relocating their efficacy.'
insight: Eckhart protects God's immutability without voiding prayer.
practice: 'Pray one sincere request today. Afterward, sit with this: it is not that
  God will decide later; eternity has already regarded this. Ask only — am I becoming
  someone who can receive what the light already is?'
