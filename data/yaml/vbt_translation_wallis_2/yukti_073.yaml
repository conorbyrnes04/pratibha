resonances:
- citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
  resonance: 'Both texts prescribe iterative return of attention to a stable center as the method for mastery: Yukti 73 stills the mind within emotion itself; Bhagavad Gita repeatedly returns attention from dispersion to center. Both treat attention-discipline as the operative practice, not a one-time achievement.'
  divergence: Yukti 73 emphasizes the knower-as-witness that persists through emotional content; Gita emphasizes the regulated body-habit-attention triad as the vehicle of yoga-mastery, a more embodied and iterative framework.
  passage_id: bhagavad_gita.bg_06_26
- citation: Shantideva Bodhicaryavatara — Stillness Before Insight
  resonance: 'Both texts identify scattered mind as the condition in which afflictions (kleśa) dominate, and both prescribe gathered concentration as the antidote: Yukti 73 makes the mind ''still & soft'' to reveal what remains; Bodhicaryavatara builds energy to steady the mind in concentration, escaping the ''fangs of afflictions.'''
  divergence: Yukti 73 locates clarity in the knower-substrate beneath emotion; Bodhicaryavatara locates it in the stabilized mental state itself, treating concentration as the protective container rather than a window to a transcendent witness.
  passage_id: shantideva_bodhicaryavatara.bca_08_solitude
- citation: Patañjali Yoga Sūtras 4.11
  resonance: 'Both texts identify a substrate that persists when conditions dissolve: Yukti 73 reveals ''that which remains'' when feeling passes through; Yoga Sutras 4.11 shows impressions vanish when their four supports (cause, effect, basis, support) are absent, implying a ground that outlasts their configuration.'
  divergence: Yukti 73 treats the remaining reality as conscious witness (the knower); Yoga Sutras 4.11 treats it as the absence of impressions themselves—a negative condition rather than a positive conscious substrate.
  passage_id: patañjali_yoga_sūtras.ys_4_11
