translation: 'YUKTI #108

  Union with pleasure, pain, and so on always occurs through the doors of

  perception. With this in mind, let go [of attachment to] the senses and be at

  ease in the natural state (svastha), abiding in oneself. || 136'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
