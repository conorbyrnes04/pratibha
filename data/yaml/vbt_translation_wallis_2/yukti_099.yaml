resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts identify a structural inversion: the soul/awareness continuously performs its nature, but ordinary perception misses it because attention is habitually absorbed in passing content. Turning attention to the knower (rather than the known) reveals what was always operating.'
  divergence: Plotinus frames this as the soul's continuous noetic act obscured by sense-focus; Vijnana Bhairava frames it as recognizing nonbeing/emptiness as the ground (Bhairava) itself, a more radical negation of substantive content.
  passage_id: plotinus_enneads.enn_v_1_12
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: 'Both use a spatial metaphor to point beyond locatable objects: mind/awareness has no center, no boundary, no fixed form—it cannot be grasped as a thing. The move is to recognize the knower as boundless rather than as an entity within experience.'
  divergence: Tilopa emphasizes the open, unobstructed nature of mind's space-like quality; Vijnana Bhairava emphasizes nonbeing itself as the contemplative object, collapsing the distinction between emptiness and the absolute (Bhairava).
