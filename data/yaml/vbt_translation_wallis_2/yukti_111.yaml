resonances:
- citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
  resonance: Both texts use systematic negation to point toward a non-dual awareness that transcends all categorical consciousness. The Mandukya's 'not inwardly conscious, not outwardly conscious, not conscious in both directions, not consciousness, not non-consciousness' mirrors the Vijnana Bhairava's method of dissolving conceptual layers to arrive at 'waveless' stillness—each negates successive mental states to disclose what remains.
  divergence: The Mandukya frames this negation as the discovery of Turīya (the Fourth), a permanent transcendent state; the Vijnana Bhairava emphasizes spontaneous recognition and direct disclosure within present awareness, less concerned with ontological stasis.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
- citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #7'
  resonance: 'Both passages enact self-recognition as the fundamental move: Ibn Arabi''s ''He knows Himself through Himself'' and the Vijnana Bhairava''s invitation to let insight ''disclose itself directly'' share the structure of consciousness recognizing itself without mediation, collapsing the subject-object divide.'
  divergence: Ibn Arabi grounds this in divine self-knowledge (theistic metaphysics); the Vijnana Bhairava locates it in the practitioner's own awareness-principle, treating self-recognition as an accessible contemplative event rather than an attribute of God.
  passage_id: know_yourself_ibn_arabi_balyani.kys_p007
- citation: Patañjali Yoga Sūtras 3.17
  resonance: Both texts identify a fundamental confusion—superimposition of layers—as the obstacle to direct knowledge. Patañjali's 'word, meaning, and idea superimposed upon one another' parallels the Vijnana Bhairava's implicit diagnosis that conceptual overlay obscures the waveless state; both propose clarity through disentanglement.
  divergence: Patañjali treats this as a cognitive error to be corrected through discriminative knowledge (viveka); the Vijnana Bhairava suggests spontaneous disclosure once interpretation is paused, emphasizing non-effort over analytical precision.
  passage_id: patañjali_yoga_sūtras.ys_3_17
