resonances:
- citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
  resonance: Both texts redirect attention from content (thought, desire, mental objects) to the underlying śakti or energy structure itself. Yukti 70 instructs consciousness to recognize desire-energy as śakti of the Self; Tantrasara 6 teaches recognizing Śakti in the entire architecture of experience—a shift from what arises to the power that animates arising.
  divergence: Yukti 70 emphasizes unwavering focus on the knower's perspective; Tantrasara frames this as learning to recognize Śakti architecturally across all experience, a more systemic epistemology.
  passage_id: tantrasara.ts_014
- citation: Yoga Spandakarika — Third Flow
  resonance: 'Both employ a paradox of attention: clarity emerges not by suppressing or ignoring content, but by ardent, focused engagement with it from a shifted vantage. Yukti 70 focuses mind on desire-energy itself; Spandakarika describes the sacred tremor appearing through ardent striving—attention intensified reveals what was obscured.'
  divergence: Yukti 70 locates the shift inward (to the knower); Spandakarika locates it in the object of perception itself (the tremor), though both converge on non-dual recognition.
  passage_id: yoga_spandakarika.sp_36
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: 'Both use a spatial or structural metaphor to describe consciousness beyond fixation: mind has no center or circumference (Tilopa); Yukti 70''s unwavering consciousness recognizes śakti as Self-energy, not as bounded content. Both dissolve the subject-object boundary through attention.'
  divergence: Tilopa emphasizes the open, unbounded nature of mind itself; Yukti 70 emphasizes the energetic recognition of desire-thought as śakti, maintaining a non-dual but still phenomenologically engaged stance.
  passage_id: tilopa_mahamudra.til_002
