resonances:
- citation: Astavakra Gita — Verse 7.3
  resonance: 'Both texts dissolve the ego-apparatus through negation: Vijnana Bhairava negates ''mental constructs of selfhood'' to reveal the knower; Astavakra negates the ''I'' itself as the direct gate to liberation. Each uses absence of mental-ego structure as the operative move.'
  divergence: Vijnana Bhairava preserves attention to the knower as the residual clarity; Astavakra dissolves even that witness into undifferentiated liberation, leaving no subject-object remainder.
  passage_id: astavakra_gita.asg_7_3
- citation: Yoga Spandakarika — First Flow
  resonance: 'Both redirect attention from the surface play of mental constructs to their source: Vijnana Bhairava''s ''absence of mental constructs'' reveals the knower; Yoga Spandakarika''s ''relative notions tied to ego rediscover their peaceful source'' performs the same inversion from content to ground.'
  divergence: Vijnana Bhairava emphasizes the knower as the locus of freedom; Yoga Spandakarika emphasizes the unified source-state (spanda) from which all notions arise, a more ontological grounding.
  passage_id: yoga_spandakarika.sp_04
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: 'Both negate the apparatus of mental structure itself: Vijnana Bhairava negates ''mental apparatus'' to free attention; Tilopa negates the bounded mind (''no center and no circumference'') to reveal its open nature. Each uses structural negation to dissolve the ego-container.'
  divergence: Vijnana Bhairava's negation points toward the knower as witness; Tilopa's negation points toward mind's spacious, unbounded nature—a difference between subject-centered and nature-centered liberation.
  passage_id: tilopa_mahamudra.til_002
