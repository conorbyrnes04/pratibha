resonances:
- citation: Tantrasara — Refining Thought – Right Reasoning as Śakti’s Path
  resonance: 'Both texts describe a withdrawal of mental content (thoughts/projections vs. everything) that reveals a naked, foundational awareness—the knower itself rather than the known. In Yukti #52, freedom from projections about the object allows Śiva to appear; in Tantrasara, the flash where everything falls away leaves only naked awareness.'
  divergence: 'Yukti #52 uses a sustained external gaze as the method to turn inward, while Tantrasara describes an instantaneous collapse of all content (śāmbhavopāya); one is gradual attention-work, the other is sudden non-dual recognition.'
  passage_id: tantrasara.ts_012
- citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
  resonance: 'Both texts emphasize the iterative return of attention from distraction to center as the operative mechanism of realization. Yukti #52 makes the mind free of projections by holding gaze steady; Bhagavad Gita describes yoga-mastery as repeatedly returning attention from dispersion to center.'
  divergence: 'Yukti #52 locates the shift in the knower''s relation to an external form, while Bhagavad Gita frames it as a habitual re-centering of the body-mind system itself; one is object-dependent, the other is intrinsic practice.'
  passage_id: bhagavad_gita.bg_06_26
- citation: Nagarjuna Mulamadhyamakakarika — The Stilling of All Grasping Is Peace
  resonance: 'Both texts identify peace (śiva) with the cessation of mental elaboration—grasping and proliferation in Nagarjuna, thoughts and projections in Yukti #52. The realization is the same: when the mind stops constructing, what remains is śiva/peace.'
  divergence: 'Nagarjuna''s stilling is the logical deconstruction of all conceptual grasping (prapañca), while Yukti #52 achieves it through attentional discipline on a form; one is analytical negation, the other is contemplative absorption.'
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_25_24
