title: 'Yukti #96'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #96

  The being/state called Bhairava is everywhere; [thus,] it is

  available to common folk as well. There is no ‘other’, nothing is

  separable from That—one who comprehends this is in the nondual

  mode. || 124'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
