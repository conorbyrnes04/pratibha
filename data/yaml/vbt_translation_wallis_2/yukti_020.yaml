resonances:
- citation: Siva Sutra — Śāmbhavopāya
  resonance: Both texts use the heart as a locus where simultaneous contemplation of multiple spatial or phenomenal registers occurs—in Vijnana Bhairava through direct co-presence of spaces (above, root, heart), in Siva Sutra through the collision of mind in the heart generating appearances. Each treats the heart as a threshold where multiplicity arises or is held.
  divergence: Vijnana Bhairava emphasizes steady simultaneous contemplation of three spatial dimensions as a direct disclosure, while Siva Sutra describes the heart as a generative collision point where appearances spontaneously arise like dreams—one is receptive synthesis, the other is creative emergence.
  passage_id: siva_sutra.ss_i_15
- citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
  resonance: Both passages locate a transcendent presence (the Lord/Śiva) specifically within the heart-cave as the ground of all beings, making the heart the privileged site of direct realization rather than a merely anatomical location.
  divergence: Vijnana Bhairava treats the heart as one node in a triad of spaces to be contemplated simultaneously for insight, while Svetasvatara emphasizes the heart-cave as the singular dwelling-place of the all-pervading Lord—one is relational multiplicity, the other is singular presence.
  passage_id: svetasvatara_upanishad.svu_018
- citation: Patañjali Yoga Sūtras 3.30
  resonance: Both texts prescribe focused attention on a specific bodily center (navel plexus vs. heart and its spatial correlates) as the method for direct knowledge or disclosure—each uses somatic localization as the gateway to non-ordinary perception.
  divergence: Patañjali's approach yields systematic knowledge of the body's constitution through technical focus, while Vijnana Bhairava's simultaneous contemplation of three spaces aims at direct insight that transcends analytical knowledge—one is acquisitive, the other is revelatory.
  passage_id: patañjali_yoga_sūtras.ys_3_30
