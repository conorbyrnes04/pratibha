title: 'Yukti #17'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #17

  Through internal enunciation of an entire piṇḍa-mantra in accordance

  with the sequence of its articulable letters, [followed by] the Half-moon,

  the Point, the Resonance, the End of Resonance, and the Void, one

  becomes Shiva. || 42'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
