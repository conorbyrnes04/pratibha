- citation: Yoga Spandakarika — Third Flow
  resonance: 'Both texts describe a paradoxical intensification through focused attention: the object becomes clearer when effort is applied to perceive it directly. Yukti #43 turns attention inward to the knower; Yoga Spandakarika describes the supreme tremor appearing when the tantrika ardently strives toward it with concentrated perception.'
  divergence: 'Yukti #43 uses an ordinary emotional event as the catalyst, while Yoga Spandakarika frames the object as a transcendent reality (the supreme tremor) that requires sustained spiritual effort to manifest.'
