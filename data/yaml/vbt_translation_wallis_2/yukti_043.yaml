- citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
  resonance: 'Both texts locate transformation in the *iterative return* of attention to a center rather than in a single breakthrough event. Yukti #43 instructs meditation on joy by redirecting focus inward to the knower; Bhagavad Gita describes yoga-mastery as repeatedly returning attention from dispersion to center.'
  divergence: 'Yukti #43 uses a spontaneous emotional state (joy) as the entry point for inward attention, while Bhagavad Gita emphasizes disciplined, habitual regulation of body and mind as the method.'
