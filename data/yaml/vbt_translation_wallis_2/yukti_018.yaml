- citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
  resonance: Both texts gather the dispersed body-mind into a unified locus—the Svetasvatara's alignment of body, senses, and mind into the heart parallels Yukti 18's simultaneous contemplation of all body-parts as one continuous Space-nature, collapsing multiplicity into singular presence.
  divergence: The Svetasvatara frames this gathering as a crossing toward an external Principle (Brahman); Yukti 18 frames it as recognition that the body already *is* Space, requiring no traversal.
  passage_id: svetasvatara_upanishad.svu_009
- citation: Shantideva Bodhicaryavatara — Stillness Before Insight
  resonance: 'Both texts identify the return of attention from scatter as the threshold move: Shantideva''s steadying of the scattered mind into gathered concentration structurally mirrors Yukti 18''s reorientation of attention from the knower''s dispersion into unified contemplation of body-as-Space.'
  divergence: Shantideva treats concentration as a prerequisite for subsequent insight into emptiness; Yukti 18 treats the attentional return itself as already revelatory of non-dual nature.
