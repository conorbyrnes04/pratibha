title: 'Yukti #101'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #101

  Wherever the mind goes, in that very instant let it abandon

  whatever [it has alighted upon]. Due to having nothing to hang on

  to, it then becomes ‘waveless’. || 129'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
