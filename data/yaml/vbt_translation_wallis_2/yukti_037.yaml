sutra_id: yukti_037
collection: Vijnana Bhairava
section: meditation_technique
title: 'Yukti #37'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #37

  Due to the dynamic tension (sanghaṭṭa) of the two prāṇas, either

  externally or internally, at the termination [of the breath-pause]

  the yogī becomes a vessel for the arising of equality-

  consciousness. || 64'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
