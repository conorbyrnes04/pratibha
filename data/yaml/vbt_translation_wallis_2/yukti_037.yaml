resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts identify a shift in perceptual focus as the key to recognizing an already-present consciousness: the soul''s characteristic act (Plotinus) and equality-consciousness (Vijnana Bhairava) remain unnoticed until attention redirects from external content to the knowing faculty itself.'
  divergence: Plotinus frames this as a correction of misplaced perception within a unified soul; Vijnana Bhairava locates the shift in the somatic dynamics of prāṇa and breath-pause, grounding consciousness in embodied practice rather than intellectual reorientation.
  passage_id: plotinus_enneads.enn_v_1_12
- citation: Siva Sutra — Śāktopāya
  resonance: Both texts use precise somatic location (nostrils in Siva Sutra, the tension-point of prāṇa in Vijnana Bhairava) as the fulcrum where sustained attention triggers a shift in consciousness—dissolution/expansion and equality-consciousness respectively—through concentrated inward focus.
  divergence: Siva Sutra emphasizes the spatial center and the dual outcome of dissolution and expansion; Vijnana Bhairava stresses the dynamic tension between opposing forces and the arising of equanimity, making the mechanism more relational than locational.
  passage_id: siva_sutra.ss_ii_13
- citation: Patañjali Yoga Sūtras 1.3
  resonance: 'Both texts describe a return to the seer''s or knower''s own nature as the fruit of practice: when attention ceases to follow the object-stream, the subject recognizes its intrinsic nature—equality-consciousness in Vijnana Bhairava, the seer''s own nature in Patañjali.'
  divergence: Patañjali's formulation is apophatic and minimal; Vijnana Bhairava specifies the mechanism (breath-tension) and the quality of the result (equality), embedding the insight in embodied technique rather than leaving it as a bare principle.
  passage_id: patañjali_yoga_sūtras.ys_1_03
