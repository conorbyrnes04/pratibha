title: 'Yukti #109'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #109

  Everything is revealed by insight (or consciousness), and the self is revealed by

  everything. Due to there being only one essential nature, knowables are [to be]

  contemplated as [consisting of] One Consciousness. || 137'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
