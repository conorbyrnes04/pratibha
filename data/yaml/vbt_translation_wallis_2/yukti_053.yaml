resonances:
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 7
  resonance: 'Both texts prescribe a deliberate reversal of attention''s habitual outward flow: the Vijnana Bhairava redirects awareness inward through a somatic anchor (jaw, tongue, center), while Plotinus instructs turning inward to perceive the Unity obscured by preoccupation with externals. Both treat the shift as a removal of obstruction rather than acquisition.'
  divergence: The Vijnana Bhairava uses embodied technique and proprioceptive focus as the method; Plotinus emphasizes philosophical contemplation and the intellect's ascent toward the transcendent One.
  passage_id: plotinus_enneads.enn_vi_9_07
- citation: Shantideva Bodhicaryavatara — Stillness Before Insight
  resonance: 'Both texts identify a preparatory stabilization of mind as prerequisite to clarity: the Vijnana Bhairava''s inward casting of awareness into the center parallels Shantideva''s steadying of mind in gathered concentration after energy is built. Both treat mental gathering as the ground on which insight or liberation depends.'
  divergence: Shantideva frames this within the Buddhist path of ethical discipline and affliction-removal; the Vijnana Bhairava operates within a non-dual Tantric framework where the center itself is the locus of Śiva-consciousness.
  passage_id: shantideva_bodhicaryavatara.bca_08_solitude
- citation: Siva Sutra — Śāmbhavopāya
  resonance: 'Both passages locate awareness itself—not its objects—as the primary reality to be recognized: Yukti 53 casts awareness into the center as the knower; the Siva Sutra identifies the surge of awareness as Bhairava. Both treat the turn toward the subject (the knower) as the essential move.'
  divergence: The Siva Sutra names this recognition directly as metaphysical identity (awareness = Bhairava); the Vijnana Bhairava employs a somatic technique to facilitate that recognition rather than asserting it conceptually.
