title: 'Yukti #11'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #11

  [If the yogī] closes the doors [of the senses] with the ‘weapon’ by which

  perception is blocked with the hands, [and] pierces the eyebrow-center, he will

  [eventually] perceive the Bindu. When it dissolves, [one will experience the

  state of] Supreme Stasis in one’s Center. || 36'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
