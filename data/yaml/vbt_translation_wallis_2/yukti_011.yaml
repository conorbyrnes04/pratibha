resonances:
- citation: Yoginihrdaya — Cakrasaṃketa
  resonance: Both texts use the bindu (point of concentrated light/awareness) as the culmination of a sensory-blocking or inward-turning practice. Yukti 11 pierces toward the bindu through closed sense-doors; Yoginihrdaya describes the bindu as 'vibrant awareness whose deepest truth is light' emerging from void-shaped potentiality—both treat the bindu as the perceptual threshold where gross sensation dissolves into subtle luminous consciousness.
  divergence: Vijnana Bhairava frames the bindu as an individual yogī's direct perception-goal via manual technique; Yoginihrdaya situates the bindu cosmologically as the seat of divine creative power (śakti-śiva union), emphasizing its role in universal manifestation rather than personal realization alone.
  passage_id: yoginihrdaya.yh_007
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.11
  resonance: Both passages identify a state of consciousness achieved through cessation or withdrawal—Yukti 11 blocks sensory doors to reach the bindu; Chandogya describes the Self as the state 'when one is asleep, resting, and at perfect rest, seeing no dreams.' Each treats the absence of ordinary perception (sense-closure or dreamlessness) as the gateway to direct self-recognition.
  divergence: Vijnana Bhairava prescribes active yogic technique (hand-mudra, eyebrow-piercing) to induce this state; Chandogya presents it as a natural condition of deep sleep, emphasizing spontaneous rather than methodologically engineered access to the Self.
  passage_id: chāndogya_upaniṣad.chu_viii_11
