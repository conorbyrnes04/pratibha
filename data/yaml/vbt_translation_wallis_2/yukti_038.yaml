- citation: Pratyabhijnahrdayam — Sutra 13
  resonance: 'Both texts locate transformation through recognition of authorship: Yukti #38 invites meditation that discloses innate joy as already present (not acquired), and Pratyabhijnahrdayam Sutra 13 describes how ''complete recognition of one''s own authorship'' causes the mind to ascend to Supreme Consciousness—both treat realization as recognizing what is already the case rather than achieving something new.'
  divergence: Pratyabhijnahrdayam frames this as cognitive recognition (pratyabhijna) of authorial agency, while Vijnana Bhairava frames it as direct disclosure of affective presence through meditative pause.
  passage_id: pratyabhijnahrdayam.phr_013
- citation: Patañjali Yoga Sūtras 3.2
  resonance: 'Both texts describe a non-dual absorption where subject-object duality dissolves: Yukti #38 instructs meditation on body/world ''as full of innate joy'' (collapsing observer-observed), and Patañjali Yoga Sūtras 3.2 defines absorption as ''unity of mind with object''—both name the same structural move of unified consciousness.'
  divergence: Patañjali's formulation is technical and epistemological (describing the mechanics of samadhi), while Vijnana Bhairava's is phenomenological and affective (pointing to joy as the recognition medium).
