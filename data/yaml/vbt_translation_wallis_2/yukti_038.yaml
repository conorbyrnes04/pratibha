- citation: Siva Sutra — Āṇavopāya
  resonance: 'Both texts collapse the distinction between mind and ultimate reality through direct recognition: Yukti #38 instructs meditation on the body/world as already full of innate joy, while Siva Sutra #6 states ''The mind is the Self''—both posit that the mediating faculty (body-awareness, mind) is not separate from what it perceives but identical with it.'
  divergence: Vijnana Bhairava emphasizes the affective quality (joy/ananda) as the recognition medium, whereas Siva Sutra presents the identity as a metaphysical axiom requiring no emotional valence.
