resonances:
- citation: Astavakra Gita — Verse 11.5
  resonance: Both texts locate the root of suffering not in external conditions (happiness/suffering themselves) but in the mind's relationship to them—Astavakra traces suffering to worry/judgment, Vijnana Bhairava instructs non-abandonment to either pole, redirecting attention to the witnessing consciousness rather than content.
  divergence: Astavakra emphasizes cognitive recognition (knowing suffering's cause dissolves it), while Vijnana Bhairava emphasizes sustained non-dual attention to the heart-mind itself as the locus of clarity.
  passage_id: astavakra_gita.asg_11_5
- citation: Yoga Spandakarika — First Flow
  resonance: Both dissolve the binary of pleasure and suffering into a unified ground—Yoga Spandakarika names this ground 'profound consciousness' where opposites are revealed as non-dual, and Vijnana Bhairava's instruction not to abandon to either state similarly points toward a consciousness that transcends the duality.
  divergence: Yoga Spandakarika makes an ontological claim (pleasure/suffering are inherently non-dual), while Vijnana Bhairava prescribes a practice of non-abandonment that reveals this non-duality through attention.
  passage_id: yoga_spandakarika.sp_05
- citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
  resonance: Both direct attention inward to the heart as the seat where mind and senses gather, and both frame this gathering as the means by which one transcends affliction—the Svetasvatara through embodied alignment, Vijnana Bhairava through non-dual resting in the heart-mind.
  divergence: Svetasvatara emphasizes somatic technique (alignment of body, neck, head) as the method, while Vijnana Bhairava emphasizes the non-dual stance of not-abandoning as the direct means.
  passage_id: svetasvatara_upanishad.svu_009
