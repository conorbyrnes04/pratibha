sutra_id: yukti_012
collection: Vijnana Bhairava
section: meditation_technique
title: The Bindu of Subtle Fire at the Radiant Abode
sanskrit: ''
transliteration: ''
translation: 'Meditate on the Bindu as a tilak of subtle fire produced by the inner stimulation of the Radiant Abode (dhāman),
  visualizing it in the heart or just above the head; when it dissolves, there is dissolution into pure Presence.'
commentary: 'The yukti directs attention to a *bindu* — a luminous point — not as an object to grasp but as a condensation
  of awareness itself. The "subtle fire" (*sūkṣmāgni*) is not physical heat; it is the intensity of consciousness turned
  back upon its own source. The *dhāman* (Radiant Abode) is the inner field from which this fire is "stimulated" — the text
  implies that the bindu is not manufactured by effort but arises when awareness is aroused at its own dwelling-place.

  Placement at the heart or just above the head maps two traditional loci: *hṛdaya* as the meeting-point of stillness and
  movement, and the *ūrdhva bindu* above the crown as the ascent of condensed radiance. The practitioner holds the visualization
  lightly — a tilak-mark of fire — until it *dissolves*. The dissolution is the teaching: the bindu was never a stable object
  but a threshold. When it melts, what remains is not emptiness but *svarūpa* — pure Presence without center or edge.

  This yukti belongs to the class of practices that use form to exceed form. The bindu is a scaffold; the fire is a pointer;
  the dissolution is the recognition that what was sought was already the seeker.

  Cross-Tradition Resonances:

  - Tantrasāra, Āhnika 1: the heart as *kula* of Anuttara nectar — same locus, same logic of condensed radiance dissolving
  into the Absolute.

  - Śiva Sūtra I.12: *vismayo yoga-bhūmikā* — wonder as the ground of yoga; the bindu practice cultivates the stupefaction
  that precedes recognition.

  - Plotinus, Enneads V.3: the One as a point of light from which all radiance proceeds — structural homology in using
  concentrated luminosity as a path beyond multiplicity.'
voice_of_siva: ''
abhyasa: Sit with eyes closed. At the heart-center, sense a point of warmth or brightness — no bigger than a seed. Let it
  intensify without forcing. When attention wavers, return to the point; when the point itself dissolves, rest in whatever
  remains. Do not chase the dissolution; let it arrive.
