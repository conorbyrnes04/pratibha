  resonance: 'Both texts locate knowledge or realization in the quality and direction of attention itself rather than in external objects or states. Yukti #55 shows clarity emerging when attention turns inward to the knower; Siva Sutra #11 identifies sustained attention as the very substance of knowledge.'
  divergence: Vijnana Bhairava uses somatic rhythm (rocking) as the gateway to inward attention, while Siva Sutra posits attention as a direct metaphysical principle—one is method-based, the other ontological.
