resonances:
- citation: Pratyabhijnahrdayam — Sutra 15
  resonance: 'Both texts move from recognizing consciousness as universal to assimilating or identifying with that universality: Yukti 79 cultivates felt-sense of identical consciousness across bodies; Pratyabhijnahrdayam 15 describes obtaining the Power of Consciousness and assimilating the universe to oneself through unity-experience.'
  divergence: Yukti 79 emphasizes the immediate felt-sense of sameness in another's body as the method; Pratyabhijnahrdayam frames this as a power obtained and then extended outward to assimilate the universe, making it more cosmological than phenomenological.
  passage_id: pratyabhijnahrdayam.phr_015
- citation: Astavakra Gita — Verse 15.7
  resonance: 'Both texts use a structural reversal: instead of consciousness being located in the body, the body/universe appears within consciousness. Yukti 79 shifts attention from content to knower; Astavakra Gita 15.7 reframes the universe as appearance within you (like waves in ocean), inverting the usual subject-object relation.'
  divergence: Yukti 79 works through intersubjective recognition (consciousness in another); Astavakra Gita works through a non-dual collapse of inside/outside, making the universe itself the appearance rather than focusing on shared consciousness between persons.
  passage_id: astavakra_gita.asg_15_7
