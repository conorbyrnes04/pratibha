resonances:
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 8
  resonance: 'Both texts locate the Self''s manifestation through a turning of attention inward to a center or source: Plotinus describes the soul''s natural revolution around its own centre as the source of being; Yukti 61 describes the Self manifesting when attention enters the nondual Void. Each treats inward reorientation as revelatory of true nature.'
  divergence: Plotinus frames this as the soul's continuous natural movement that we fail to perceive; Vijnana Bhairava frames it as an intentional meditative entry into the Void that reveals what was obscured by outward attention.
  passage_id: plotinus_enneads.enn_vi_9_08
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: 'Both use the metaphor of boundlessness (Void, open sky) to describe the nature of consciousness/mind when attention ceases to impose conceptual limits: the Self manifests in the nondual Void; mind''s nature has no center and no circumference, resisting spatial indication.'
  divergence: Vijnana Bhairava emphasizes entry into Void as the condition for Self-manifestation; Tilopa emphasizes the impossibility of indicating or containing mind's nature, stressing its transcendence of all demarcation rather than its revelatory presence.
  passage_id: tilopa_mahamudra.til_002
