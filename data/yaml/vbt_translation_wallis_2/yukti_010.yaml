- citation: Pratyabhijnahrdayam — Sutra 17
  resonance: 'Both texts locate liberation or direct knowing in the ''middle'' or ''core''—Yukti #10 points to the central channel as the seat of awareness, while Sutra 17 identifies the unfoldment of the middle as the gateway to Bliss of Consciousness. Each treats a spatial-ontological center as the locus where consciousness recognizes itself.'
  divergence: 'Yukti #10 emphasizes stillness and direct disclosure through pause, while Pratyabhijnahrdayam Sutra 17 emphasizes active unfoldment and acquisition, reflecting Kashmir Shaivism''s recognition-based (pratyabhijña) rather than purely receptive epistemology.'
