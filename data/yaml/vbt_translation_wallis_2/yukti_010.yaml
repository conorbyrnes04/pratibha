- citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
  resonance: 'Both texts refuse positive predication to describe the ultimate: Yukti #10 points to the core beyond conceptual elaboration, while Mandukya''s Turīya systematically negates all conscious and unconscious states to indicate what transcends dualistic knowing. Each uses apophatic structure to gesture toward non-dual awareness.'
  divergence: 'Yukti #10 anchors the pointer in the heart-center as a lived contemplative location, while Mandukya''s Turīya operates through pure logical negation of states, reflecting Advaita Vedanta''s abstract metaphysical method versus Tantric embodied phenomenology.'
