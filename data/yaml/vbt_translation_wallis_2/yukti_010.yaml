title: 'Yukti #10'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #10

  The central channel is situated in the core [of one’s being]. Visualize it as

  having a form like a slender lotus fiber, and meditate on it as being the

  Goddess in the form of the innermost Space; through Her, [the experience of]

  God will manifest. || 35'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
