translation: 'YUKTI #59

  Similarly, on a dark & overcast moonless night, meditate on the

  formless ‘form’ of the darkness, and you will long for [and

  attain] Bhairava’s formless form. || 87'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
