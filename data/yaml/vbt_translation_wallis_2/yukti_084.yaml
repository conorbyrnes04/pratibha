resonances:
- citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
  resonance: Both texts locate realization through iterative return of attention to a stable center rather than through dramatic cognitive breakthrough. Yukti 84 reveals Bhairava-nature when mental excitation dissolves and attention turns inward to the knower; Bhagavad Gita describes yoga-mastery as repeatedly returning attention from dispersion to center.
  divergence: Vijnana Bhairava emphasizes the cessation of effort and unknowing as the gateway, while Bhagavad Gita stresses disciplined habituation and regulated practice as the method.
  passage_id: bhagavad_gita.bg_md_006
- citation: Yoga Spandakarika — Third Flow
  resonance: 'Both texts paradoxically describe how striving toward the ultimate reveals it: Yukti 84 shows that dissolution of mental effort (unknowing) at the end of absorption-excitation reveals Bhairava-nature; Yoga Spandakarika describes how ardent striving toward the supreme tremor makes it appear, like an object seen more clearly through focused effort.'
  divergence: Vijnana Bhairava frames the revelation as occurring through the *cessation* of excitation and unknowing, while Yoga Spandakarika frames it as the fruit of sustained ardent striving.
  passage_id: yoga_spandakarika.sp_36
- citation: Shantideva Bodhicaryavatara — Stillness Before Insight
  resonance: Both texts identify the inward stabilization of attention as the pivot between affliction and liberation. Yukti 84 turns attention from content to knower; Bodhicaryavatara warns that a scattered mind lives in affliction and prescribes gathered concentration as the remedy.
  divergence: Vijnana Bhairava emphasizes the spontaneous revelation of one's nature through this turn, while Shantideva emphasizes the ethical and soteriological necessity of building energy and steadying the mind against kleśa.
  passage_id: shantideva_bodhicaryavatara.bca_08_solitude
