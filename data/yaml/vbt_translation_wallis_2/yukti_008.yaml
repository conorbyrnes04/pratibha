translation: 'YUKTI #8

  Wherever one’s awareness [comes to rest] by this same process, whether a

  space, a wall, or a perfect vessel, it spontaneously dissolves [into it] and

  bestows the boon [of the Bhairava-state]. || 33'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
