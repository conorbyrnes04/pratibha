resonances:
- citation: Heart Sutra — Form Is Emptiness, Emptiness Is Form
  resonance: 'Both texts use the perception of a concrete object or form as the direct gateway to recognizing emptiness itself. The Heart Sutra''s ''form is emptiness'' and Yukti 94''s ''when another object is being perceived, the emptiness in all things [may be perceived]'' share the same contemplative move: emptiness is not abstract but disclosed through engagement with appearance.'
  divergence: The Heart Sutra states the identity of form and emptiness as a metaphysical principle, while Yukti 94 frames it as a phenomenological pointer—a moment of perceptual shift during actual observation.
  passage_id: heart_sutra.hs_001
- citation: Tao Te Ching — The Axle-Hole and the Use of Absence
  resonance: 'Both passages locate functional reality in what appears absent or empty: the Tao Te Ching''s empty hub-space makes the wheel work; Yukti 94''s emptiness perceived within objects is the ground of perception itself. Each identifies emptiness not as negation but as the operative principle within manifestation.'
  divergence: The Tao Te Ching emphasizes emptiness as structural necessity for function (cosmological), while Yukti 94 emphasizes it as a direct contemplative insight accessible through perceptual pause (phenomenological).
