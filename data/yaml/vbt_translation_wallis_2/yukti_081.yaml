- citation: Nagarjuna Mulamadhyamakakarika — The Stilling of All Grasping Is Peace
  resonance: Both texts identify a supreme state (śiva/peace) as the cessation of a particular cognitive or grasping activity—the target achieves Śiva-hood through stabilizing non-dual conviction, while Nagarjuna reaches śiva through the stilling of all conceptual proliferation and grasping.
  divergence: The Vijnana Bhairava posits an affirmative identification with divine qualities as the means, whereas Nagarjuna's approach is fundamentally apophatic, reaching peace through the negation of all conceptual elaboration.
