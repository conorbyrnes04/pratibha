- citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
  resonance: Both passages establish identity between the individual and an all-pervading divine principle (Śiva) that dwells simultaneously transcendent and immanent—the target stabilizes conviction in this identity as a contemplative act, while Svetasvatara locates Śiva as the omnipresent Lord in the heart-cave of all beings.
  divergence: The Vijnana Bhairava frames this as a first-person recognition-stabilization (aham) requiring sustained conviction, whereas Svetasvatara presents it as a metaphysical fact about cosmic structure that the seeker must discern.
