- citation: Siva Sutra — Śāmbhavopāya
  resonance: Both texts locate a transcendent state (the Fourth / sublime joy) as accessible within and continuous with ordinary consciousness states (waking, dream, deep sleep / the delight of eating and drinking), not as a separate realm to be attained.
  divergence: Yukti 44 emphasizes the transformation of sensory pleasure itself into sublimity through meditative savoring, while Siva Sutra positions the Fourth as a simultaneous availability that persists alongside the three ordinary states—a co-presence rather than a transmutation.
