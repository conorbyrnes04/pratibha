sutra_id: yukti_092
collection: Vijnana Bhairava
section: meditation_technique
title: 'Yukti #92'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #92

  Fix the gaze on some object, then slowly withdraw it, then the

  cognitive impression of it, then the heart-mind [itself]: O Goddess,

  one [who practices this] becomes an abode of spaciousness (śūnya). || 120'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
