translation: 'YUKTI #76

  Letting go of body-consciousness, and contemplating “I am

  everywhere” with firm mind and unwavering viewpoint, one

  becomes happy. || 104'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
