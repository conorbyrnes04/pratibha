- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts identify a structural gap between continuous inner activity and ordinary awareness: the soul/awareness continuously acts, but we miss it because attention is habitually absorbed in external content. The move is to redirect perception from the object-stream back to the subject''s own nature.'
  divergence: Plotinus frames this as a metaphysical problem of soul-perception; Vijnana Bhairava frames it as a practical attention-discipline that interrupts the momentum of mental states themselves.
