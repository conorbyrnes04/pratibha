- citation: Tilopa Mahamudra — Look at the Looker
  resonance: 'Both texts prescribe a deliberate pause in the flow of mental activity—a cessation of effort—followed by a reorientation of awareness toward the knowing faculty itself. The structure is: stop the doing, then rest attention on the doer.'
  divergence: Tilopa emphasizes devotional surrender to the guru as the gateway to innate awareness; Vijnana Bhairava emphasizes autonomous self-inquiry without external mediation.
