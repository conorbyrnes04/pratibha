title: 'Yukti #95'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #95

  That which people of paltry understanding consider ‘purity’ is

  impurity in the teachings of Śiva. [In truth,] there is neither purity

  nor impurity. Therefore, be free of such mental constructs, and be

  happy. || 123'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
