resonances:
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: Both texts use the unbounded, centerless nature of space/sky as a direct analogue for the nature of awareness itself—the knower is recognized by attending to its own structurally open, non-localized character rather than its contents.
  divergence: Tilopa emphasizes the impossibility of conceptual indication (negation via language), while Vijnana Bhairava uses sky-meditation as a positive contemplative method to redirect attention inward toward the knower.
  passage_id: tilopa_mahamudra.til_002
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both identify a structural inversion: the soul/awareness continuously enacts its nature, but habitually remains unaware because attention is colonized by sense-content; clarity requires redirecting perception from the external to the characteristic act of the knower itself.'
  divergence: Plotinus frames this as a perennial metaphysical condition of the soul's self-forgetting, while Vijnana Bhairava offers a specific meditative technique (sky-identification) to reverse the inversion.
  passage_id: plotinus_enneads.enn_v_1_12
- citation: Pratyabhijnahrdayam — Sutra 15
  resonance: Both propose that when consciousness recognizes its own nature (unbounded, all-containing), the boundary between knower and known dissolves—the individual assimilates the universe by recognizing its identity with the Power of Consciousness itself.
  divergence: Pratyabhijnahrdayam emphasizes recognition (pratyabhijna) of pre-existing identity with the Supreme, while Vijnana Bhairava uses meditative attention on sky-nature as the means to realize that identity.
  passage_id: pratyabhijnahrdayam.phr_015
