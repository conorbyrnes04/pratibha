translation: 'YUKTI #85

  O goddess, listen to this traditional teaching: I will speak it

  accurately. For one whose eyes are unmoving, radical freedom can

  arise in a moment. || 113'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
