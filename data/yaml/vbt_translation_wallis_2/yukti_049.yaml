resonances:
- citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
  resonance: 'Both texts present recognition or learning-to-recognize as the operative move: Yukti 49 discloses supreme attainment ''at the time of perception'' through mudrā practice, while Tantrasara 3.9 frames Śāktopāya as ''learning to recognize Śakti in the entire architecture of your experience.'' In both, the transformation occurs not through effort alone but through a shift in recognition itself.'
  divergence: Yukti 49 emphasizes spontaneous manifestation through specific somatic/gestural channels (mudrās), whereas Tantrasara 3.9 emphasizes cognitive reorientation across the totality of experience; one is gesture-triggered, the other is architecturally comprehensive.
  passage_id: tantrasara.ts_014
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: 'Both texts refuse conceptual capture and point to a non-objective realization: Yukti 49''s commentary instructs to ''pause interpretation'' and let insight ''disclose itself directly,'' while Tilopa''s Mahāmudrā ''cannot be pointed to by any symbol'' and ''the ordinary mind cannot grasp it as an object of thought.'' Both suspend the subject-object structure of knowing.'
  divergence: Yukti 49 locates this non-conceptual disclosure within embodied mudrā practice and perception, whereas Tilopa's Mahāmudrā is a non-dual recognition that transcends all symbolic and mental mediation entirely.
  passage_id: tilopa_mahamudra.til_001
