title: 'Yukti #50'
sanskrit: ''
transliteration: ''
translation: 'YUKTI #50

  Situating oneself on a soft seat, with only the buttocks touching

  it and the hands and feet susupended in the air, after remaining

  there [for some time], one’s resolution & determination become

  completely fulfilled. || 78'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
