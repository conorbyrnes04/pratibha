resonances:
- citation: Siva Sutra — Śāmbhavopāya
  resonance: Both texts locate direct realization through penetration into a subtle dimension—the Vijnana Bhairava via the void-space at syllable-boundaries, the Siva Sutra via 'great depth'—where mantra's power becomes self-evident rather than conceptually grasped.
  divergence: The Vijnana Bhairava emphasizes emptiness and spaciousness as the result of this penetration, while the Siva Sutra emphasizes the direct knowing of mantra's power itself as the fruit.
  passage_id: siva_sutra.ss_i_22
- citation: Tantrasara — The One for Whom No Means Is Needed
  resonance: 'Both passages point toward a non-methodical or spontaneous realization: the Vijnana Bhairava''s ''by means of the void'' operates without deliberate technique, mirroring Abhinavagupta''s anupāya, the pathless path where no external means is required.'
  divergence: The Vijnana Bhairava grounds spontaneity in the structure of sound and silence (syllable-boundaries), while anupāya is presented as a radical transcendence of all method and structure.
  passage_id: tantrasara.ts_008
- citation: Patañjali Yoga Sūtras 3.12
  resonance: Both texts describe a transformation of consciousness into a unified state where apparent opposites (repressed/revived in Patañjali; beginning/ending in Vijnana Bhairava) are held simultaneously without collapse into duality.
  divergence: Patañjali frames this as a transformation of mind-condition into unity through samadhi, while the Vijnana Bhairava frames it as the direct perception of emptiness that dissolves the perceiver into spaciousness itself.
  passage_id: patañjali_yoga_sūtras.ys_3_12
