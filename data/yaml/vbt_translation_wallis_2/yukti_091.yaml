- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: 'Both texts enact a cessation of conceptual elaboration as the condition for direct recognition: Yukti 91 instructs to ''let go of things that arise in memory'' so the Lord appears; Tilopa teaches that Mahāmudrā cannot be grasped as an object of thought, implying that abandoning the ordinary mind''s grasping allows wisdom to dawn.'
  divergence: Vijnana Bhairava grounds this release in embodied spatial recognition (the 'supportless' body at a remembered place), while Tilopa emphasizes the transcendence of all symbolic and conceptual mediation as such.
