resonances:
- citation: Siva Sutra — Śāktopāya
  resonance: Both texts identify a phonemic or vibrational substrate (mantra/the phoneme 'a') as the direct vehicle of consciousness itself, collapsing the distinction between utterance and awareness. The repetition or recognition of this substrate triggers immediate realization without mediation.
  divergence: Siva Sutra states the principle aphoristically (mind *is* mantra), while Vijnana Bhairava prescribes a specific phonetic practice with precise exclusions (no anusvāra or visarga), grounding the insight in embodied vocal discipline rather than abstract identity.
  passage_id: siva_sutra.ss_ii_1
- citation: Tantrasara — The One for Whom No Means Is Needed
  resonance: Both passages point toward a recognition that bypasses methodological scaffolding—the Vijnana Bhairava's 'sudden & powerful arising' of insight without interpretive pause mirrors Anupāya's 'pathless path,' where the means dissolves into direct disclosure.
  divergence: Vijnana Bhairava locates this spontaneity within a specific sonic practice (the phoneme 'a'), while Tantrasara's Anupāya operates as a meta-principle transcending all techniques, emphasizing the absence of method itself rather than method's refinement.
  passage_id: tantrasara.ts_008
- citation: Pratyabhijnahrdayam — Sutra 20
  resonance: Both texts posit that entry into a heightened consciousness (Perfect I-consciousness / the flood of insight) is inseparable from the activation of Mantra as a power—the recognition itself *is* the mantra's operation, not a result following it.
  divergence: Pratyabhijnahrdayam emphasizes the light-and-bliss nature of the I-consciousness and its power, while Vijnana Bhairava foregrounds the phonetic simplicity ('a' without ornament) and the spontaneous flood-like quality of the arising, prioritizing immediacy over luminous characterization.
  passage_id: pratyabhijnahrdayam.phr_020
