resonances:
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both texts locate the path to realization by redirecting attention from external sense-content to the continuous activity of consciousness itself: Plotinus notes the soul ''continuously executes its characteristic act'' but we miss it because perception clings to sensations; Yukti 65 pierces the body to anchor awareness on the knower rather than passing content, revealing the pure path.'
  divergence: Plotinus emphasizes intellectual perception of the soul's eternal activity, while Vijnana Bhairava uses somatic sensation (needle-point) as the anchor to flip attention toward the witnessing awareness.
  passage_id: plotinus_enneads.enn_v_1_12
- citation: Tilopa Mahamudra — Look at the Looker
  resonance: 'Both employ a paradoxical inversion: effort directed inward (complete effort, then rest in devotion; piercing the body, then holding awareness on that point) becomes the gateway to non-dual recognition—the looker sees itself, the knower recognizes itself as Bhairava.'
  divergence: Tilopa's path culminates in guru-devotion and sahaja (spontaneous recognition), while Yukti 65 uses direct sensory-focal technique without explicit reference to a guru or spontaneous grace.
  passage_id: tilopa_mahamudra.til_003
