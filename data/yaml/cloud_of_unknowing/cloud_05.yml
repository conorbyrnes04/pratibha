sutra_id: CLOUD_05
collection: The Cloud of Unknowing
section: Ch. 32
title: Travail Earnestly Against Sundry Thoughts
sanskrit: And therfore travaile fast against alle sodeyn thoughtes that come of thees, and put hem down
  as oft as thou mai.
transliteration: Middle English (original language of the work).
translation: And therefore travail hard against all sudden thoughts that come from these, and put them
  down as often as you may.
commentary: '«Travail Earnestly Against Sundry Thoughts» states the Cloud''s central apophatic discipline:
  God is loved by a naked intent that refuses conceptual capture, while a cloud of forgetting releases
  creaturely clinging. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For ten minutes, hold a single wordless longing toward God (or the Absolute), gently returning
  when thoughts of creatures arise.
themes:
- silence
- attention
- love
- ignorance
- practice
- grace
