sutra_id: CLOUD_01
collection: The Cloud of Unknowing
section: Ch. 3
title: A Cloud of Unknowing Between You and God
sanskrit: For of alle other creatures and theire werkes—ye, and of the werkes of God self—may a man thorou
  grace have fulheed of knowing, and wel to kon thinke on hem; bot of God him-self can no man thinke.
  And therfore I wolde leve al that thing that I can think, and chese to my love that thing that I cannot
  think.
transliteration: Middle English (original language of the work).
translation: Of all other creatures and their works—yes, and of the works of God himself—a person may
  through grace have fullness of knowing, and think well on them; but of God himself no one can think.
  And therefore I would leave all that I can think, and choose for my love that which I cannot think.
commentary: '«A Cloud of Unknowing Between You and God» states the Cloud''s central apophatic discipline:
  God is loved by a naked intent that refuses conceptual capture, while a cloud of forgetting releases
  creaturely clinging. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For ten minutes, hold a single wordless longing toward God (or the Absolute), gently returning
  when thoughts of creatures arise.
themes:
- silence
- attention
- love
- ignorance
- practice
- grace
