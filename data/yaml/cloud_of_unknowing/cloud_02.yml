sutra_id: CLOUD_02
collection: The Cloud of Unknowing
section: Ch. 4
title: Look That Nothing Live in Thy Working Mind
sanskrit: And yif ever thou schalt come to this cloude and dwelle and wirche therin as I bid thee, thee
  behoveth, as this cloude of unknowyng is aboven thee, bitwix thee and thi God, right so put a cloude
  of forgetyng bineth thee, bitwix thee and alle the cretures that ever ben maad.
transliteration: Middle English (original language of the work).
translation: If ever you shall come to this cloud and dwell and work therein as I bid you, you must—as
  this cloud of unknowing is above you, between you and your God—likewise put a cloud of forgetting beneath
  you, between you and all the creatures that ever were made.
commentary: 'The passage establishes apophatic discipline through radical spatial inversion: the cloud
  of unknowing above (between self and God) demands a correlate below (between self and creation). This
  is not mere symmetry but structural necessity. The unknowing cloud works by negation upward—stripping
  away all images, concepts, names of God. But unknowing alone risks a dangerous suspension: the mind
  still clings to creatures, to memory, to the felt world. The cloud of forgetting operates downward as
  active forgetting, not passive ignorance. It is forgetting as *work* (wirche)—a deliberate pressing-down
  of all created things, all sensory and emotional attachments, all the furniture of the known world.
  The author does not say these creatures are evil or illusory; they are simply *beneath* the work. By
  positioning them below, the practitioner creates a psychological and spiritual floor: nothing living—no
  image, no feeling, no memory of beloved persons or beautiful things—must rise into the working mind
  where naked intent toward God operates. The two clouds form a sealed chamber. This is not dissociation
  but disciplined attention: the cloud of forgetting is the price of the cloud of unknowing. One cannot
  pierce the veil above while trailing the weight of creation below.'
abhyasa: When sitting in silence, notice what creature-thought or memory surfaces (a face, a worry, a
  pleasure), and rather than pushing it away, consciously lower it—imagine it sinking as if weighted,
  moving down and away from the crown of your head toward your feet and into the earth. Do this without
  judgment or strain; the lowering itself is the work, a gentle but deliberate descent that clears the
  space above.
themes:
- apophatic negation
- cloud of forgetting
- naked intent
- creaturely release
- spatial discipline
- working mind
