section: Chapter 10 — Punishment (Daṇḍavagga), vv. 129–145
title: All Tremble at Punishment
sanskrit: '(129) Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (130) Sabbe tasanti daṇḍassa, sabbesaṁ jīvitaṁ piyaṁ; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (131) Sukhakāmāni bhūtāni, yo daṇḍena vihiṁsati; Attano sukhamesāno, pecca so na labhate sukhaṁ.'
transliteration: '(129) Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno; Attānaṁ upamaṁ katvā, na haneyya
  na ghātaye.


  (130) Sabbe tasanti daṇḍassa, sabbesaṁ jīvitaṁ piyaṁ; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (131) Sukhakāmāni bhūtāni, yo daṇḍena vihiṁsati; Attano sukhamesāno, pecca so na labhate sukhaṁ.'
translation: '(129) All men tremble at punishment, all men fear death; remember that you are like unto
  them, and do not kill, nor cause slaughter.


  (130) All men tremble at punishment, all men love life; remember that thou art like unto them, and do
  not kill, nor cause slaughter.


  (131) He who seeking his own happiness punishes or kills beings who also long for happiness, will not
  find happiness after death.'
commentary: 'This chapter of the Dhammapada (Punishment) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «All Tremble at Punishment» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
