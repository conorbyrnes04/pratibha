sutra_id: DHP_CH19
collection: Dhammapada
section: Chapter 19 — The Just (Dhammaṭṭhavagga), vv. 256–272
title: Not by Silence Is One a Sage
sanskrit: '(256) Na tena hoti dhammaṭṭho, yenatthaṁ sāhasā naye; Yo ca atthaṁ anatthañca, ubho niccheyya
  paṇḍito.


  (257) Asāhasena dhammena, samena nayatī pare; Dhammassa gutto medhāvī, “dhammaṭṭho”ti pavuccati.


  (258) Na tena paṇḍito hoti, yāvatā bahu bhāsati; Khemī averī abhayo, “paṇḍito”ti pavuccati.'
transliteration: '(256) Na tena hoti dhammaṭṭho, yenatthaṁ sāhasā naye; Yo ca atthaṁ anatthañca, ubho
  niccheyya paṇḍito.


  (257) Asāhasena dhammena, samena nayatī pare; Dhammassa gutto medhāvī, “dhammaṭṭho”ti pavuccati.


  (258) Na tena paṇḍito hoti, yāvatā bahu bhāsati; Khemī averī abhayo, “paṇḍito”ti pavuccati.'
translation: '(256) [English alignment pending for this verse; Pali sourced.]


  (257) [English alignment pending for this verse; Pali sourced.]


  (258) A man is not learned because he talks much; he who is patient, free from hatred and fear, he is
  called learned.'
commentary: 'These verses dismantle three common confusions about wisdom: that forceful assertion proves
  righteousness (v. 256), that verbal facility demonstrates understanding (v. 258), that silence or mere
  speech-restraint marks the sage (title). The governing claim is that dhammaṭṭha—one established in dharma,
  in what is right—emerges only through *how* one moves through conflict and judgment. Verse 257 names
  the method: asāhasena dhammena, ''without aggression, through dharma itself.'' The wise person does
  not overpower others into agreement; they guide (nayatī) through steadiness (sama), through the dharma
  itself acting as the measure. This is not passivity. It is a precise refusal to let reactivity shape
  the boundary between self and other. Verse 258 inverts the equation: learning is not accumulation of
  speech but the cultivation of three absences—khemī (patience, ease), averī (absence of hatred), abhayo
  (absence of fear). These are not states of emptiness but active presences: the body-mind trained so
  thoroughly that it does not contract into defensiveness. The Just chapter teaches that righteousness
  is not a position one holds but a discipline of attention that allows one to meet another''s confusion
  without importing one''s own. The sage is recognized not by what they say or do not say, but by the
  quality of non-harm that moves through their judgment.'
abhyasa: When you must correct someone or name what is wrong, pause and feel the quality of your breath
  and jaw before you speak. If tightness, heat, or the urge to convince is present, wait. Speak only when
  you can feel your body as steady and your intention as free from the need to win. Notice whether the
  other person's resistance softens or hardens. This is your mirror.
themes:
- non-aggression in speech
- judgment without reactivity
- presence over eloquence
- the body as measure
- dharma as method
- patience as wisdom
