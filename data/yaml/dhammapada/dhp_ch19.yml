collection: Dhammapada
section: Chapter 19 — The Just (Dhammaṭṭhavagga), vv. 256–272
title: Not by Silence Is One a Sage
sanskrit: '(256) Na tena hoti dhammaṭṭho, yenatthaṁ sāhasā naye; Yo ca atthaṁ anatthañca, ubho niccheyya
  paṇḍito.


  (257) Asāhasena dhammena, samena nayatī pare; Dhammassa gutto medhāvī, “dhammaṭṭho”ti pavuccati.


  (258) Na tena paṇḍito hoti, yāvatā bahu bhāsati; Khemī averī abhayo, “paṇḍito”ti pavuccati.'
transliteration: '(256) Na tena hoti dhammaṭṭho, yenatthaṁ sāhasā naye; Yo ca atthaṁ anatthañca, ubho
  niccheyya paṇḍito.


  (257) Asāhasena dhammena, samena nayatī pare; Dhammassa gutto medhāvī, “dhammaṭṭho”ti pavuccati.


  (258) Na tena paṇḍito hoti, yāvatā bahu bhāsati; Khemī averī abhayo, “paṇḍito”ti pavuccati.'
translation: '(256) [English alignment pending for this verse; Pali sourced.]


  (257) [English alignment pending for this verse; Pali sourced.]


  (258) A man is not learned because he talks much; he who is patient, free from hatred and fear, he is
  called learned.'
commentary: 'This chapter of the Dhammapada (The Just) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Not by Silence Is One a Sage» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
