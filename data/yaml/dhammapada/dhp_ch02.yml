sutra_id: DHP_CH02
collection: Dhammapada
section: Chapter 2 — On Earnestness (Appamādavagga), vv. 21–32
title: Earnestness Is the Path of the Deathless
sanskrit: '(21) Appamādo amatapadaṁ, pamādo maccuno padaṁ; Appamattā na mīyanti, ye pamattā yathā matā.


  (22) Evaṁ visesato ñatvā, appamādamhi paṇḍitā; Appamāde pamodanti, ariyānaṁ gocare ratā.


  (23) Te jhāyino sātatikā, niccaṁ daḷhaparakkamā; Phusanti dhīrā nibbānaṁ, yogakkhemaṁ anuttaraṁ.'
transliteration: '(21) Appamādo amatapadaṁ, pamādo maccuno padaṁ; Appamattā na mīyanti, ye pamattā yathā
  matā.


  (22) Evaṁ visesato ñatvā, appamādamhi paṇḍitā; Appamāde pamodanti, ariyānaṁ gocare ratā.


  (23) Te jhāyino sātatikā, niccaṁ daḷhaparakkamā; Phusanti dhīrā nibbānaṁ, yogakkhemaṁ anuttaraṁ.'
translation: '(21) Earnestness is the path of immortality (Nirvana), thoughtlessness the path of death.
  Those who are in earnest do not die, those who are thoughtless are as if dead already.


  (22) Those who are advanced in earnestness, having understood this clearly, delight in earnestness,
  and rejoice in the knowledge of the Ariyas (the elect).


  (23) These wise people, meditative, steady, always possessed of strong powers, attain to Nirvana, the
  highest happiness.'
commentary: 'This chapter of the Dhammapada (On Earnestness) treats liberation as a discipline of mind:
  what precedes action is intention, and what ends suffering is the training of attention itself. The
  selected opening verses of the vagga state the chapter''s governing move without softening it. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Earnestness Is the Path of the Deathless» as a working
  hypothesis. When a reactive thought arises, name it before acting, and choose one non-harmful response.
