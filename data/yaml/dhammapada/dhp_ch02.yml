sutra_id: DHP_CH02
collection: Dhammapada
section: Chapter 2 — On Earnestness (Appamādavagga), vv. 21–32
title: Earnestness Is the Path of the Deathless
sanskrit: '(21) Appamādo amatapadaṁ, pamādo maccuno padaṁ; Appamattā na mīyanti, ye pamattā yathā matā.


  (22) Evaṁ visesato ñatvā, appamādamhi paṇḍitā; Appamāde pamodanti, ariyānaṁ gocare ratā.


  (23) Te jhāyino sātatikā, niccaṁ daḷhaparakkamā; Phusanti dhīrā nibbānaṁ, yogakkhemaṁ anuttaraṁ.'
transliteration: '(21) Appamādo amatapadaṁ, pamādo maccuno padaṁ; Appamattā na mīyanti, ye pamattā yathā
  matā.


  (22) Evaṁ visesato ñatvā, appamādamhi paṇḍitā; Appamāde pamodanti, ariyānaṁ gocare ratā.


  (23) Te jhāyino sātatikā, niccaṁ daḷhaparakkamā; Phusanti dhīrā nibbānaṁ, yogakkhemaṁ anuttaraṁ.'
translation: '(21) Earnestness is the path of immortality (Nirvana), thoughtlessness the path of death.
  Those who are in earnest do not die, those who are thoughtless are as if dead already.


  (22) Those who are advanced in earnestness, having understood this clearly, delight in earnestness,
  and rejoice in the knowledge of the Ariyas (the elect).


  (23) These wise people, meditative, steady, always possessed of strong powers, attain to Nirvana, the
  highest happiness.'
commentary: 'Appamādo—earnestness, vigilance, non-heedlessness—is not a virtue added to practice but the
  very skeleton of it. The passage establishes a binary without middle ground: the earnest live; the heedless
  are already corpses. This is not metaphor softened by time. The Pali construction *appamattā na mīyanti*
  (the earnest do not die) paired with *ye pamattā yathā matā* (the heedless are as if dead) collapses
  the distinction between spiritual death and literal death into a single condition of attention. To be
  heedless is to be absent from your own life—to move through days as reflex, reaction, habit-groove.
  The earnest person, by contrast, maintains *sātatikā* (continuity, steadiness) and *daḷhaparakkamā*
  (firm exertion). This is not strain or grim discipline. Verses 22–23 show the texture: those who understand
  this distinction *pamodanti* (delight, take joy) in earnestness itself. The practice is not grim surveillance
  but a kind of recognition—that attention itself is the gate, and that *yogakkhemaṁ* (the security won
  through discipline, the unshakeable ease) is available only to those who do not drift. The path is not
  long; it is immediate. The question each moment asks is: are you here, or are you already dead?'
abhyasa: 'When you pour water, feel its weight and temperature fully in your palms before it touches the
  cup. Do not move to the next action until the previous one has been completed in full presence—not rushed,
  not dreamed through. Notice what happens when a single ordinary act is done with complete attention:
  the heedlessness that usually runs underneath life becomes visible as a kind of absence you can choose
  to interrupt.'
themes:
- attention as life
- heedlessness as death-in-life
- continuity of effort
- joy in discipline
- presence as practice
