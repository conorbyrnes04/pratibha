collection: Dhammapada
section: Chapter 23 — The Elephant (Nāgavagga), vv. 320–333
title: The Elephant Endures the Arrow
sanskrit: '(320) Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo hi bahujjano.


  (321) Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.


  (322) Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.'
transliteration: '(320) Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo hi
  bahujjano.


  (321) Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.


  (322) Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.'
translation: '(320) Silently shall I endure abuse as the elephant in battle endures the arrow sent from
  the bow: for the world is ill-natured.


  (321) They lead a tamed elephant to battle, the king mounts a tamed elephant; the tamed is the best
  among men, he who silently endures abuse.


  (322) Mules are good, if tamed, and noble Sindhu horses, and elephants with large tusks; but he who
  tames himself is better still.'
commentary: 'This chapter of the Dhammapada (The Elephant) treats liberation as a discipline of mind:
  what precedes action is intention, and what ends suffering is the training of attention itself. The
  selected opening verses of the vagga state the chapter''s governing move without softening it. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «The Elephant Endures the Arrow» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
