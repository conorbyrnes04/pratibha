sutra_id: DHP_CH09
collection: Dhammapada
section: Chapter 9 — Evil (Pāpavagga), vv. 116–128
title: Make Haste Toward the Good
sanskrit: '(116) Abhittharetha kalyāṇe, pāpā cittaṁ nivāraye; Dandhañhi karoto puññaṁ, pāpasmiṁ ramatī
  mano.


  (117) Pāpañce puriso kayirā, Na naṁ kayirā punappunaṁ; Na tamhi chandaṁ kayirātha, Dukkho pāpassa uccayo.


  (118) Puññañce puriso kayirā, kayirā naṁ punappunaṁ; Tamhi chandaṁ kayirātha, sukho puññassa uccayo.'
transliteration: '(116) Abhittharetha kalyāṇe, pāpā cittaṁ nivāraye; Dandhañhi karoto puññaṁ, pāpasmiṁ
  ramatī mano.


  (117) Pāpañce puriso kayirā, Na naṁ kayirā punappunaṁ; Na tamhi chandaṁ kayirātha, Dukkho pāpassa uccayo.


  (118) Puññañce puriso kayirā, kayirā naṁ punappunaṁ; Tamhi chandaṁ kayirātha, sukho puññassa uccayo.'
translation: '(116) If a man would hasten towards the good, he should keep his thought away from evil;
  if a man does what is good slothfully, his mind delights in evil.


  (117) If a man commits a sin, let him not do it again; let him not delight in sin: pain is the outcome
  of evil.


  (118) If a man does what is good, let him do it again; let him delight in it: happiness is the outcome
  of good.'
commentary: 'This chapter of the Dhammapada (Evil) treats liberation as a discipline of mind: what precedes
  action is intention, and what ends suffering is the training of attention itself. The selected opening
  verses of the vagga state the chapter''s governing move without softening it. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
  its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary
  life. This is the demand of a living tradition: insight without application remains incomplete. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Make Haste Toward the Good» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
