sutra_id: DHP_CH09
collection: Dhammapada
section: Chapter 9 — Evil (Pāpavagga), vv. 116–128
title: Make Haste Toward the Good
sanskrit: '(116) Abhittharetha kalyāṇe, pāpā cittaṁ nivāraye; Dandhañhi karoto puññaṁ, pāpasmiṁ ramatī
  mano.


  (117) Pāpañce puriso kayirā, Na naṁ kayirā punappunaṁ; Na tamhi chandaṁ kayirātha, Dukkho pāpassa uccayo.


  (118) Puññañce puriso kayirā, kayirā naṁ punappunaṁ; Tamhi chandaṁ kayirātha, sukho puññassa uccayo.'
transliteration: '(116) Abhittharetha kalyāṇe, pāpā cittaṁ nivāraye; Dandhañhi karoto puññaṁ, pāpasmiṁ
  ramatī mano.


  (117) Pāpañce puriso kayirā, Na naṁ kayirā punappunaṁ; Na tamhi chandaṁ kayirātha, Dukkho pāpassa uccayo.


  (118) Puññañce puriso kayirā, kayirā naṁ punappunaṁ; Tamhi chandaṁ kayirātha, sukho puññassa uccayo.'
translation: '(116) If a man would hasten towards the good, he should keep his thought away from evil;
  if a man does what is good slothfully, his mind delights in evil.


  (117) If a man commits a sin, let him not do it again; let him not delight in sin: pain is the outcome
  of evil.


  (118) If a man does what is good, let him do it again; let him delight in it: happiness is the outcome
  of good.'
commentary: 'The governing claim across these three verses is momentum as moral architecture: the mind
  does not stand still but *inclines* toward whichever direction receives repeated attention and choice.
  Verse 116 names the core mechanism—abhittharetha, hasten, make haste—paired immediately with the negation
  of evil-dwelling (pāpā cittaṁ nivāraye). The Buddha does not counsel perfection or the erasure of unwholesome
  impulse; he diagnoses sloth (dandha) as the hinge. A person doing good half-heartedly creates a vacuum
  that the mind rushes to fill with delight in evil (pāpasmiṁ ramatī mano). Verses 117–118 then establish
  the recursive law: sin repeated hardens into habit; virtue repeated hardens into character. The word
  chandaṁ—desire, inclination, delight—appears in both verses but inverted: *do not* cultivate desire
  in evil; *do* cultivate desire in good. This is not suppression but redirection of the very faculty
  of longing. The outcome (uccayo, literally accumulation or heap) is not imposed externally but emerges
  as the natural sedimentation of repeated acts. Haste toward good is thus a discipline of *velocity*—not
  speed of action but the refusal to linger in the space between impulse and choice, where the untrained
  mind defaults to ease and harm.'
abhyasa: When you notice yourself returning to a familiar harmful thought or small act (scrolling, self-criticism,
  unkind speech rehearsed in silence), move your body deliberately—stand, walk to another room, splash
  water on your wrists—and name aloud one concrete good act you will do in the next hour, then do it within
  ten minutes. Repeat this three times in one day, marking each completion. The haste is not frantic;
  it is the refusal to let the mind settle into the old groove.
themes:
- momentum and habit
- attention as choice
- velocity of mind
- inclination and delight
- recursive discipline
