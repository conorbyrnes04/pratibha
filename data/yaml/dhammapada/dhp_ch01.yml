sutra_id: DHP_CH01
collection: Dhammapada
section: Chapter 1 — The Twin Verses (Yamakavagga), vv. 1–20
title: Mind Precedes All Things
sanskrit: '(1) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce paduṭṭhena, bhāsati vā karoti vā;
  Tato naṁ dukkhamanveti, cakkaṁva vahato padaṁ.


  (2) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce pasannena, bhāsati vā karoti vā; Tato naṁ
  sukhamanveti, chāyāva anapāyinī.


  (3) Akkocchi maṁ avadhi maṁ, ajini maṁ ahāsi me; Ye ca taṁ upanayhanti, veraṁ tesaṁ na sammati.'
transliteration: '(1) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce paduṭṭhena, bhāsati vā karoti
  vā; Tato naṁ dukkhamanveti, cakkaṁva vahato padaṁ.


  (2) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce pasannena, bhāsati vā karoti vā; Tato naṁ
  sukhamanveti, chāyāva anapāyinī.


  (3) Akkocchi maṁ avadhi maṁ, ajini maṁ ahāsi me; Ye ca taṁ upanayhanti, veraṁ tesaṁ na sammati.'
translation: '(1) All that we are is the result of what we have thought: it is founded on our thoughts,
  it is made up of our thoughts. If a man speaks or acts with an evil thought, pain follows him, as the
  wheel follows the foot of the ox that draws the carriage.


  (2) All that we are is the result of what we have thought: it is founded on our thoughts, it is made
  up of our thoughts. If a man speaks or acts with a pure thought, happiness follows him, like a shadow
  that never leaves him.


  (3) "He abused me, he beat me, he defeated me, he robbed me,"--in those who harbour such thoughts hatred
  will never cease.'
commentary: 'This chapter of the Dhammapada (The Twin Verses) treats liberation as a discipline of mind:
  what precedes action is intention, and what ends suffering is the training of attention itself. The
  selected opening verses of the vagga state the chapter''s governing move without softening it. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Mind Precedes All Things» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
themes:
