sutra_id: DHP_CH13
collection: Dhammapada
section: Chapter 13 — The World (Lokavagga), vv. 167–178
title: Do Not Follow the Evil Law
sanskrit: '(167) Hīnaṁ dhammaṁ na seveyya, pamādena na saṁvase; Micchādiṭṭhiṁ na seveyya, na siyā lokavaḍḍhano.


  (168) Uttiṭṭhe nappamajjeyya, dhammaṁ sucaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.


  (169) Dhammaṁ care sucaritaṁ, na naṁ duccaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.'
transliteration: '(167) Hīnaṁ dhammaṁ na seveyya, pamādena na saṁvase; Micchādiṭṭhiṁ na seveyya, na siyā
  lokavaḍḍhano.


  (168) Uttiṭṭhe nappamajjeyya, dhammaṁ sucaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.


  (169) Dhammaṁ care sucaritaṁ, na naṁ duccaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.'
translation: '(167) Do not follow the evil law! Do not live on in thoughtlessness! Do not follow false
  doctrine! Be not a friend of the world.


  (168) Rouse thyself! do not be idle! Follow the law of virtue! The virtuous rests in bliss in this world
  and in the next.


  (169) Follow the law of virtue; do not follow that of sin. The virtuous rests in bliss in this world
  and in the next.'
commentary: 'This chapter of the Dhammapada (The World) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Do Not Follow the Evil Law» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
