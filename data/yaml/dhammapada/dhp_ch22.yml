collection: Dhammapada
section: Chapter 22 — The Downward Course (Nirayavagga), vv. 306–319
title: The Liar Goes to a State of Woe
sanskrit: '(306) Abhūtavādī nirayaṁ upeti, Yo vāpi katvā na karomi cāha; Ubhopi te pecca samā bhavanti,
  Nihīnakammā manujā parattha.


  (307) Kāsāvakaṇṭhā bahavo, pāpadhammā asaññatā; Pāpā pāpehi kammehi, nirayaṁ te upapajjare.


  (308) Seyyo ayoguḷo bhutto, tatto aggisikhūpamo; Yañce bhuñjeyya dussīlo, raṭṭhapiṇḍamasaññato.'
transliteration: '(306) Abhūtavādī nirayaṁ upeti, Yo vāpi katvā na karomi cāha; Ubhopi te pecca samā bhavanti,
  Nihīnakammā manujā parattha.


  (307) Kāsāvakaṇṭhā bahavo, pāpadhammā asaññatā; Pāpā pāpehi kammehi, nirayaṁ te upapajjare.


  (308) Seyyo ayoguḷo bhutto, tatto aggisikhūpamo; Yañce bhuñjeyya dussīlo, raṭṭhapiṇḍamasaññato.'
translation: '(306) He who says what is not, goes to hell; he also who, having done a thing, says I have
  not done it. After death both are equal, they are men with evil deeds in the next world.


  (307) Many men whose shoulders are covered with the yellow gown are ill-conditioned and unrestrained;
  such evil-doers by their evil deeds go to hell.


  (308) Better it would be to swallow a heated iron ball, like flaring fire, than that a bad unrestrained
  fellow should live on the charity of the land.'
commentary: 'This chapter of the Dhammapada (The Downward Course) treats liberation as a discipline of
  mind: what precedes action is intention, and what ends suffering is the training of attention itself.
  The selected opening verses of the vagga state the chapter''s governing move without softening it. The
  passage asks a living reader to test the claim in experience rather than treat it as museum doctrine.
  Hold the argument until its force lands in attention, then let practice carry one concrete shift into
  the next hour of ordinary life. This is the demand of a living tradition: insight without application
  remains incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «The Liar Goes to a State of Woe» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
