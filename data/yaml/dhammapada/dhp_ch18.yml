sutra_id: DHP_CH18
collection: Dhammapada
section: Chapter 18 — Impurity (Malavagga), vv. 235–255
title: Life Is Easy for the Shameless
sanskrit: '(235) Paṇḍupalāsova dānisi, Yamapurisāpi ca te upaṭṭhitā; Uyyogamukhe ca tiṭṭhasi, Pātheyyampi
  ca te na vijjati.


  (236) So karohi dīpamattano, Khippaṁ vāyama paṇḍito bhava; Niddhantamalo anaṅgaṇo, Dibbaṁ ariyabhūmiṁ
  upehisi.


  (237) Upanītavayo ca dānisi, Sampayātosi yamassa santikaṁ; Vāso te natthi antarā, Pātheyyampi ca te
  na vijjati.'
transliteration: '(235) Paṇḍupalāsova dānisi, Yamapurisāpi ca te upaṭṭhitā; Uyyogamukhe ca tiṭṭhasi, Pātheyyampi
  ca te na vijjati.


  (236) So karohi dīpamattano, Khippaṁ vāyama paṇḍito bhava; Niddhantamalo anaṅgaṇo, Dibbaṁ ariyabhūmiṁ
  upehisi.


  (237) Upanītavayo ca dānisi, Sampayātosi yamassa santikaṁ; Vāso te natthi antarā, Pātheyyampi ca te
  na vijjati.'
translation: '(235) Thou art now like a sear leaf, the messengers of death (Yama) have come near to thee;
  thou standest at the door of thy departure, and thou hast no provision for thy journey.


  (236) Make thyself an island, work hard, be wise! When thy impurities are blown away, and thou art free
  from guilt, thou wilt enter into the heavenly world of the elect (Ariya).


  (237) Thy life has come to an end, thou art come near to death (Yama), there is no resting-place for
  thee on the road, and thou hast no provision for thy journey.'
commentary: 'These verses arrest the reader at the threshold of death—not as metaphor but as the governing
  condition of practice. The sear leaf, the messengers already present, the door of departure: each image
  compresses urgency into a single, inescapable fact. The passage does not console or promise; it strips
  away the luxury of postponement. What makes this teaching sharp is its refusal of abstraction. You are
  not meditating on mortality in general; you are *this body*, *now*, without provisions, without a resting-place.
  The old commentary''s language of ''intention'' and ''training of attention'' misses the bite. This
  is not gentle introspection. Verse 236 pivots on a single command: *karohi dīpamattano*—make yourself
  an island. Not a refuge, not a shelter, but an island: something that stands alone, surrounded by the
  flood, self-sufficient because there is nowhere else to go. The work (*vāyama*) is not accumulation
  but subtraction: the blowing away of impurities (*niddhantamalo*), the removal of guilt (*anaṅgaṇo*).
  Only then does entry into the ''heavenly world of the elect'' (*dibbaṁ ariyabhūmiṁ*) become possible—not
  as reward but as the natural consequence of having nothing left to cling to. The repetition in verse
  237 is deliberate: no resting-place, no provisions. Death does not negotiate. The teaching''s force
  lies in this: shame and the illusion of time are the only obstacles. Strip them away, and what remains
  is clarity without comfort.'
abhyasa: When you catch yourself deferring a difficult conversation, a necessary change, or an honest
  reckoning—stop mid-thought and physically turn to face a wall or window. Stand there for three breaths
  without moving or planning what to say. Let the absence of escape become tactile. Then turn back and
  act.
themes:
- urgency
- death
- impurity
- self-reliance
- shamelessness
- clarity
