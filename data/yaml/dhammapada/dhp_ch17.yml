sutra_id: DHP_CH17
collection: Dhammapada
section: Chapter 17 — Anger (Kodhavagga), vv. 221–234
title: Give Up Anger, Abandon Pride
sanskrit: '(221) Kodhaṁ jahe vippajaheyya mānaṁ, Saṁyojanaṁ sabbamatikkameyya; Taṁ nāmarūpasmimasajjamānaṁ,
  Akiñcanaṁ nānupatanti dukkhā.


  (222) Yo ve uppatitaṁ kodhaṁ, rathaṁ bhantaṁva vāraye; Tamahaṁ sārathiṁ brūmi, rasmiggāho itaro jano.


  (223) Akkodhena jine kodhaṁ, asādhuṁ sādhunā jine; Jine kadariyaṁ dānena, saccenālikavādinaṁ.'
transliteration: '(221) Kodhaṁ jahe vippajaheyya mānaṁ, Saṁyojanaṁ sabbamatikkameyya; Taṁ nāmarūpasmimasajjamānaṁ,
  Akiñcanaṁ nānupatanti dukkhā.


  (222) Yo ve uppatitaṁ kodhaṁ, rathaṁ bhantaṁva vāraye; Tamahaṁ sārathiṁ brūmi, rasmiggāho itaro jano.


  (223) Akkodhena jine kodhaṁ, asādhuṁ sādhunā jine; Jine kadariyaṁ dānena, saccenālikavādinaṁ.'
translation: '(221) Let a man leave anger, let him forsake pride, let him overcome all bondage! No sufferings
  befall the man who is not attached to name and form, and who calls nothing his own.


  (222) He who holds back rising anger like a rolling chariot, him I call a real driver; other people
  are but holding the reins.


  (223) Let a man overcome anger by love, let him overcome evil by good; let him overcome the greedy by
  liberality, the liar by truth!'
commentary: 'This chapter of the Dhammapada (Anger) treats liberation as a discipline of mind: what precedes
  action is intention, and what ends suffering is the training of attention itself. The selected opening
  verses of the vagga state the chapter''s governing move without softening it. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
  its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary
  life. This is the demand of a living tradition: insight without application remains incomplete. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Give Up Anger, Abandon Pride» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
