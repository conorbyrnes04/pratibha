section: Chapter 26 — The Brāhmaṇa (Brāhmaṇavagga), vv. 383–423
title: Him I Call a Brāhmaṇa
sanskrit: '(383) Chinda sotaṁ parakkamma, kāme panuda brāhmaṇa; Saṅkhārānaṁ khayaṁ ñatvā, akataññūsi brāhmaṇa.


  (384) Yadā dvayesu dhammesu, pāragū hoti brāhmaṇo; Athassa sabbe saṁyogā, atthaṁ gacchanti jānato.


  (385) Yassa pāraṁ apāraṁ vā, pārāpāraṁ na vijjati; Vītaddaraṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.'
transliteration: '(383) Chinda sotaṁ parakkamma, kāme panuda brāhmaṇa; Saṅkhārānaṁ khayaṁ ñatvā, akataññūsi
  brāhmaṇa.


  (384) Yadā dvayesu dhammesu, pāragū hoti brāhmaṇo; Athassa sabbe saṁyogā, atthaṁ gacchanti jānato.


  (385) Yassa pāraṁ apāraṁ vā, pārāpāraṁ na vijjati; Vītaddaraṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.'
translation: '(383) Stop the stream valiantly, drive away the desires, O Brahmana! When you have understood
  the destruction of all that was made, you will understand that which was not made.


  (384) If the Brahmana has reached the other shore in both laws (in restraint and contemplation), all
  bonds vanish from him who has obtained knowledge.


  (385) He for whom there is neither this nor that shore, nor both, him, the fearless and unshackled,
  I call indeed a Brahmana.'
commentary: 'This chapter of the Dhammapada (The Brāhmaṇa) treats liberation as a discipline of mind:
  what precedes action is intention, and what ends suffering is the training of attention itself. The
  selected opening verses of the vagga state the chapter''s governing move without softening it. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Him I Call a Brāhmaṇa» as a working hypothesis. When
  a reactive thought arises, name it before acting, and choose one non-harmful response.
