sutra_id: DHP_CH25
collection: Dhammapada
section: Chapter 25 — The Bhikkhu (Bhikkhuvagga), vv. 360–382
title: Restraint of Eye Is Good
sanskrit: '(360) Cakkhunā saṁvaro sādhu, sādhu sotena saṁvaro; Ghānena saṁvaro sādhu, sādhu jivhāya saṁvaro.


  (361) Kāyena saṁvaro sādhu, sādhu vācāya saṁvaro; Manasā saṁvaro sādhu, sādhu sabbattha saṁvaro; Sabbattha
  saṁvuto bhikkhu, sabbadukkhā pamuccati.


  (362) Hatthasaṁyato pādasaṁyato, Vācāsaṁyato saṁyatuttamo; Ajjhattarato samāhito, Eko santusito tamāhu
  bhikkhuṁ.'
transliteration: '(360) Cakkhunā saṁvaro sādhu, sādhu sotena saṁvaro; Ghānena saṁvaro sādhu, sādhu jivhāya
  saṁvaro.


  (361) Kāyena saṁvaro sādhu, sādhu vācāya saṁvaro; Manasā saṁvaro sādhu, sādhu sabbattha saṁvaro; Sabbattha
  saṁvuto bhikkhu, sabbadukkhā pamuccati.


  (362) Hatthasaṁyato pādasaṁyato, Vācāsaṁyato saṁyatuttamo; Ajjhattarato samāhito, Eko santusito tamāhu
  bhikkhuṁ.'
translation: '(360) Restraint in the eye is good, good is restraint in the ear, in the nose restraint
  is good, good is restraint in the tongue.


  (361) In the body restraint is good, good is restraint in speech, in thought restraint is good, good
  is restraint in all things. A Bhikshu, restrained in all things, is freed from all pain.


  (362) He who controls his hand, he who controls his feet, he who controls his speech, he who is well
  controlled, he who delights inwardly, who is collected, who is solitary and content, him they call Bhikshu.'
commentary: 'This chapter of the Dhammapada (The Bhikkhu) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Restraint of Eye Is Good» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
