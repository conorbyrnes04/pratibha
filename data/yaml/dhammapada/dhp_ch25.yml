sutra_id: DHP_CH25
collection: Dhammapada
section: Chapter 25 — The Bhikkhu (Bhikkhuvagga), vv. 360–382
title: Restraint of Eye Is Good
sanskrit: '(360) Cakkhunā saṁvaro sādhu, sādhu sotena saṁvaro; Ghānena saṁvaro sādhu, sādhu jivhāya saṁvaro.


  (361) Kāyena saṁvaro sādhu, sādhu vācāya saṁvaro; Manasā saṁvaro sādhu, sādhu sabbattha saṁvaro; Sabbattha
  saṁvuto bhikkhu, sabbadukkhā pamuccati.


  (362) Hatthasaṁyato pādasaṁyato, Vācāsaṁyato saṁyatuttamo; Ajjhattarato samāhito, Eko santusito tamāhu
  bhikkhuṁ.'
transliteration: '(360) Cakkhunā saṁvaro sādhu, sādhu sotena saṁvaro; Ghānena saṁvaro sādhu, sādhu jivhāya
  saṁvaro.


  (361) Kāyena saṁvaro sādhu, sādhu vācāya saṁvaro; Manasā saṁvaro sādhu, sādhu sabbattha saṁvaro; Sabbattha
  saṁvuto bhikkhu, sabbadukkhā pamuccati.


  (362) Hatthasaṁyato pādasaṁyato, Vācāsaṁyato saṁyatuttamo; Ajjhattarato samāhito, Eko santusito tamāhu
  bhikkhuṁ.'
translation: '(360) Restraint in the eye is good, good is restraint in the ear, in the nose restraint
  is good, good is restraint in the tongue.


  (361) In the body restraint is good, good is restraint in speech, in thought restraint is good, good
  is restraint in all things. A Bhikshu, restrained in all things, is freed from all pain.


  (362) He who controls his hand, he who controls his feet, he who controls his speech, he who is well
  controlled, he who delights inwardly, who is collected, who is solitary and content, him they call Bhikshu.'
commentary: 'These verses establish saṁvara (restraint, literally ''binding together'') as the foundational
  discipline of the bhikkhu—not as repression but as a systematic closing of the gates through which reactivity
  enters. The passage moves from the sensory portals (eye, ear, nose, tongue) through the body''s gross
  channels (hand, foot, speech) to the subtlest gate: manasā saṁvaro, restraint of mind itself. The genius
  of the instruction lies in its recognition that suffering arises not from what is perceived but from
  the unguarded response to perception. Each sense-restraint is named sādhu (good, wholesome) individually,
  then the verses assert that restraint *everywhere* (sabbattha saṁvaro) constitutes the actual liberation—not
  a future state but the present condition of one no longer scattered across the senses. Verse 362 crystallizes
  this: the bhikkhu who is saṁyata (collected, bound together) in hand, foot, speech, and inwardly delighted
  (ajjhattarato) is one who has withdrawn the outward-reaching tendency itself. The restraint is not punitive
  negation but a reorientation of attention toward what is already present—sammādhita, collected—when
  the sensory gates cease their constant leakage outward.'
abhyasa: 'Walk through a familiar space—kitchen, street, room—and at each threshold (doorway, window,
  corner where light changes) pause and name one sense currently active: ''eye receives light,'' ''ear
  receives sound,'' ''skin receives air.'' Do not suppress the sensation; instead, feel the act of *noticing*
  the noticing, the small gap between stimulus and the habitual grasp. Continue for the duration of the
  walk, treating each threshold as a deliberate checkpoint where restraint becomes visible as clarity
  rather than denial.'
themes:
- sensory restraint
- attention as liberation
- sammādhita (collection)
- gates and thresholds
- the bhikkhu's discipline
- suffering and reactivity
