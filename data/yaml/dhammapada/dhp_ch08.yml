sutra_id: DHP_CH08
collection: Dhammapada
section: Chapter 8 — The Thousands (Sahassavagga), vv. 100–115
title: Better Than a Thousand Empty Words
sanskrit: '(100) Sahassamapi ce vācā, anatthapadasaṁhitā; Ekaṁ atthapadaṁ seyyo, yaṁ sutvā upasammati.


  (101) Sahassamapi ce gāthā, anatthapadasaṁhitā; Ekaṁ gāthāpadaṁ seyyo, yaṁ sutvā upasammati.


  (102) Yo ca gāthā sataṁ bhāse, anatthapadasaṁhitā; Ekaṁ dhammapadaṁ seyyo, yaṁ sutvā upasammati.'
transliteration: '(100) Sahassamapi ce vācā, anatthapadasaṁhitā; Ekaṁ atthapadaṁ seyyo, yaṁ sutvā upasammati.


  (101) Sahassamapi ce gāthā, anatthapadasaṁhitā; Ekaṁ gāthāpadaṁ seyyo, yaṁ sutvā upasammati.


  (102) Yo ca gāthā sataṁ bhāse, anatthapadasaṁhitā; Ekaṁ dhammapadaṁ seyyo, yaṁ sutvā upasammati.'
translation: '(100) Even though a speech be a thousand (of words), but made up of senseless words, one
  word of sense is better, which if a man hears, he becomes quiet.


  (101) Even though a Gatha (poem) be a thousand (of words), but made up of senseless words, one word
  of a Gatha is better, which if a man hears, he becomes quiet.


  (102) Though a man recite a hundred Gathas made up of senseless words, one word of the law is better,
  which if a man hears, he becomes quiet.'
commentary: 'This chapter of the Dhammapada (The Thousands) treats liberation as a discipline of mind:
  what precedes action is intention, and what ends suffering is the training of attention itself. The
  selected opening verses of the vagga state the chapter''s governing move without softening it. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Better Than a Thousand Empty Words» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
