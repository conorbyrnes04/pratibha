sutra_id: DHP_CH08
collection: Dhammapada
section: Chapter 8 — The Thousands (Sahassavagga), vv. 100–115
title: Better Than a Thousand Empty Words
sanskrit: '(100) Sahassamapi ce vācā, anatthapadasaṁhitā; Ekaṁ atthapadaṁ seyyo, yaṁ sutvā upasammati.


  (101) Sahassamapi ce gāthā, anatthapadasaṁhitā; Ekaṁ gāthāpadaṁ seyyo, yaṁ sutvā upasammati.


  (102) Yo ca gāthā sataṁ bhāse, anatthapadasaṁhitā; Ekaṁ dhammapadaṁ seyyo, yaṁ sutvā upasammati.'
transliteration: '(100) Sahassamapi ce vācā, anatthapadasaṁhitā; Ekaṁ atthapadaṁ seyyo, yaṁ sutvā upasammati.


  (101) Sahassamapi ce gāthā, anatthapadasaṁhitā; Ekaṁ gāthāpadaṁ seyyo, yaṁ sutvā upasammati.


  (102) Yo ca gāthā sataṁ bhāse, anatthapadasaṁhitā; Ekaṁ dhammapadaṁ seyyo, yaṁ sutvā upasammati.'
translation: '(100) Even though a speech be a thousand (of words), but made up of senseless words, one
  word of sense is better, which if a man hears, he becomes quiet.


  (101) Even though a Gatha (poem) be a thousand (of words), but made up of senseless words, one word
  of a Gatha is better, which if a man hears, he becomes quiet.


  (102) Though a man recite a hundred Gathas made up of senseless words, one word of the law is better,
  which if a man hears, he becomes quiet.'
commentary: 'These verses establish a radical inversion: quantity of utterance has no bearing on truth-value
  or transformative power. The repeated structure—thousand words versus one word, thousand verses versus
  one verse, hundred gathas versus one dharma-word—is not poetic decoration but a disciplined negation
  of accumulation itself. The Pali term *anatthapadasaṁhitā* (made up of senseless/purposeless words)
  marks the problem not as complexity but as *disconnection from purpose*. A word is measured not by its
  length or multiplicity but by whether it produces *upasammati*—a settling, a stilling, a coming-to-rest
  in the listener. This is the operative claim: speech acts on the mind not through rhetorical mass but
  through alignment with what-is. The discipline here is one of *reduction toward precision*—the speaker
  and listener both must learn to distinguish noise from signal, proliferation from pointing. One word
  that lands in the hearer''s attention and quiets reactivity outweighs endless recitation. The verses
  do not counsel silence but rather demand that every utterance earn its place by its capacity to still,
  clarify, and orient toward the dhamma (the law, the pattern, the way things work). This is a training
  in *economy of attention*: both speaker and listener must become sensitive to the difference between
  words that scatter the mind and words that gather it.'
abhyasa: When you feel the urge to explain, defend, or elaborate on something you believe matters, pause
  and speak only one sentence—the single clearest statement you can make—then listen to how it lands in
  the other person's silence.
themes:
- precision over proliferation
- attention and stillness
- economy of speech
- purpose and alignment
- the power of one
- listening as discipline
