sutra_id: DHP_CH05
collection: Dhammapada
section: Chapter 5 — The Fool (Bālavagga), vv. 60–75
title: Long Is the Night for the Watchful Fool
sanskrit: '(60) Dīghā jāgarato ratti, dīghaṁ santassa yojanaṁ; Dīgho bālāna saṁsāro, saddhammaṁ avijānataṁ.


  (61) Carañce nādhigaccheyya, Seyyaṁ sadisamattano; Ekacariyaṁ daḷhaṁ kayirā, Natthi bāle sahāyatā.


  (62) Puttā matthi dhanaṁ matthi, iti bālo vihaññati; Attā hi attano natthi, kuto puttā kuto dhanaṁ.'
transliteration: '(60) Dīghā jāgarato ratti, dīghaṁ santassa yojanaṁ; Dīgho bālāna saṁsāro, saddhammaṁ
  avijānataṁ.


  (61) Carañce nādhigaccheyya, Seyyaṁ sadisamattano; Ekacariyaṁ daḷhaṁ kayirā, Natthi bāle sahāyatā.


  (62) Puttā matthi dhanaṁ matthi, iti bālo vihaññati; Attā hi attano natthi, kuto puttā kuto dhanaṁ.'
translation: '(60) Long is the night to him who is awake; long is a mile to him who is tired; long is
  life to the foolish who do not know the true law.


  (61) If a traveller does not meet with one who is his better, or his equal, let him firmly keep to his
  solitary journey; there is no companionship with a fool.


  (62) "These sons belong to me, and this wealth belongs to me," with such thoughts a fool is tormented.
  He himself does not belong to himself; how much less sons and wealth?'
commentary: 'This chapter of the Dhammapada (The Fool) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Long Is the Night for the Watchful Fool» as a working
  hypothesis. When a reactive thought arises, name it before acting, and choose one non-harmful response.
