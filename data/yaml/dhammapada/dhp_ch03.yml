sutra_id: DHP_CH03
collection: Dhammapada
section: Chapter 3 — Thought (Cittavagga), vv. 33–43
title: The Mind Is Hard to Guard
sanskrit: '(33) Phandanaṁ capalaṁ cittaṁ, dūrakkhaṁ dunnivārayaṁ; Ujuṁ karoti medhāvī, usukārova tejanaṁ.


  (34) Vārijova thale khitto, okamokataubbhato; Pariphandatidaṁ cittaṁ, māradheyyaṁ pahātave.


  (35) Dunniggahassa lahuno, yatthakāmanipātino; Cittassa damatho sādhu, cittaṁ dantaṁ sukhāvahaṁ.'
transliteration: '(33) Phandanaṁ capalaṁ cittaṁ, dūrakkhaṁ dunnivārayaṁ; Ujuṁ karoti medhāvī, usukārova
  tejanaṁ.


  (34) Vārijova thale khitto, okamokataubbhato; Pariphandatidaṁ cittaṁ, māradheyyaṁ pahātave.


  (35) Dunniggahassa lahuno, yatthakāmanipātino; Cittassa damatho sādhu, cittaṁ dantaṁ sukhāvahaṁ.'
translation: '(33) As a fletcher makes straight his arrow, a wise man makes straight his trembling and
  unsteady thought, which is difficult to guard, difficult to hold back.


  (34) As a fish taken from his watery home and thrown on dry ground, our thought trembles all over in
  order to escape the dominion of Mara (the tempter).


  (35) It is good to tame the mind, which is difficult to hold in and flighty, rushing wherever it listeth;
  a tamed mind brings happiness.'
commentary: 'The mind''s nature is *phandana* — trembling, flickering, scattering — not a defect to overcome
  through force but a condition to be recognized and worked with as deliberately as a fletcher straightens
  an arrow. The passage does not counsel suppression; it names the difficulty plainly (dūrakkhaṁ, dunnivārayaṁ
  — hard to guard, hard to hold back) and then offers a precise image of skill: the wise one (medhāvī)
  does not wrestle the mind into stillness but applies steady, measured attention the way an arrow-maker
  applies tension and correction. The fish gasping on dry ground is not a metaphor for failure but for
  the mind''s own nature under Māra''s dominion — it thrashes because it has been removed from its element,
  thrown into a condition of grasping. Taming (dama) is therefore not conquest but a return to fitness:
  a trained mind (cittaṁ dantaṁ) does not become rigid or blank; it becomes *sukhāvaha* — bearing ease,
  carrying well-being. The discipline here is one of patient, repetitive straightening, like the fletcher''s
  craft, where each correction is small, unglamorous, and cumulative. The work is not to stop the trembling
  but to direct it.'
abhyasa: 'When sitting, let your eyes rest on a fixed point—a wall, a candle flame, the space between
  your hands—and notice how attention itself trembles: it drifts, snags, returns, drifts again. Do not
  fight this. Instead, each time you notice the drift, make one small internal gesture of return, as if
  you were straightening a single fiber. Repeat this for ten minutes without expectation of stillness,
  only of the repeated, unglamorous act of correction itself.'
themes:
- attention as craft
- trembling as nature
- steady correction
- taming without force
- mind and dominion
- ease through discipline
