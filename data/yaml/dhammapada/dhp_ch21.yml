sutra_id: DHP_CH21
collection: Dhammapada
section: Chapter 21 — Miscellaneous (Pakiṇṇakavagga), vv. 290–305
title: If by Leaving a Small Pleasure
sanskrit: '(290) Mattāsukhapariccāgā, passe ce vipulaṁ sukhaṁ; Caje mattāsukhaṁ dhīro, sampassaṁ vipulaṁ
  sukhaṁ.


  (291) Paradukkhūpadhānena, attano sukhamicchati; Verasaṁsaggasaṁsaṭṭho, verā so na parimuccati.


  (292) Yañhi kiccaṁ apaviddhaṁ, akiccaṁ pana karīyati; Unnaḷānaṁ pamattānaṁ, tesaṁ vaḍḍhanti āsavā.'
transliteration: '(290) Mattāsukhapariccāgā, passe ce vipulaṁ sukhaṁ; Caje mattāsukhaṁ dhīro, sampassaṁ
  vipulaṁ sukhaṁ.


  (291) Paradukkhūpadhānena, attano sukhamicchati; Verasaṁsaggasaṁsaṭṭho, verā so na parimuccati.


  (292) Yañhi kiccaṁ apaviddhaṁ, akiccaṁ pana karīyati; Unnaḷānaṁ pamattānaṁ, tesaṁ vaḍḍhanti āsavā.'
translation: '(290) If by leaving a small pleasure one sees a great pleasure, let a wise man leave the
  small pleasure, and look to the great.


  (291) He who, by causing pain to others, wishes to obtain pleasure for himself, he, entangled in the
  bonds of hatred, will never be free from hatred.


  (292) What ought to be done is neglected, what ought not to be done is done; the desires of unruly,
  thoughtless people are always increasing.'
commentary: 'This chapter of the Dhammapada (Miscellaneous) treats liberation as a discipline of mind:
  what precedes action is intention, and what ends suffering is the training of attention itself. The
  selected opening verses of the vagga state the chapter''s governing move without softening it. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «If by Leaving a Small Pleasure» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
