sutra_id: DHP_CH15
collection: Dhammapada
section: Chapter 15 — Happiness (Sukhavagga), vv. 197–208
title: We Live Happily Without Hatred
sanskrit: '(197) Susukhaṁ vata jīvāma, verinesu averino; Verinesu manussesu, viharāma averino.


  (198) Susukhaṁ vata jīvāma, āturesu anāturā; Āturesu manussesu, viharāma anāturā.


  (199) Susukhaṁ vata jīvāma, ussukesu anussukā; Ussukesu manussesu, viharāma anussukā.'
transliteration: '(197) Susukhaṁ vata jīvāma, verinesu averino; Verinesu manussesu, viharāma averino.


  (198) Susukhaṁ vata jīvāma, āturesu anāturā; Āturesu manussesu, viharāma anāturā.


  (199) Susukhaṁ vata jīvāma, ussukesu anussukā; Ussukesu manussesu, viharāma anussukā.'
translation: '(197) Let us live happily then, not hating those who hate us! among men who hate us let
  us dwell free from hatred!


  (198) Let us live happily then, free from ailments among the ailing! among men who are ailing let us
  dwell free from ailments!


  (199) Let us live happily then, free from greed among the greedy! among men who are greedy let us dwell
  free from greed!'
commentary: 'This chapter of the Dhammapada (Happiness) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «We Live Happily Without Hatred» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
