sutra_id: DHP_CH11
collection: Dhammapada
section: Chapter 11 — Old Age (Jarāvagga), vv. 146–156
title: Looking for the Maker of This House
sanskrit: '(146) Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.


  (147) Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.


  (148) Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.'
transliteration: '(146) Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.


  (147) Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.


  (148) Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.'
translation: '(146) How is there laughter, how is there joy, as this world is always burning? Why do you
  not seek a light, ye who are surrounded by darkness?


  (147) Look at this dressed-up lump, covered with wounds, joined together, sickly, full of many thoughts,
  which has no strength, no hold!


  (148) This body is wasted, full of sickness, and frail; this heap of corruption breaks to pieces, life
  indeed ends in death.'
commentary: 'These verses dismantle the ordinary refusal to see. The passage does not argue that the body
  is disgusting or that joy is wrong; it cuts deeper—it names a specific blindness: surrounded by darkness
  (andhakārena onaddhā), we do not seek the light (padīpaṁ na gavesatha). The darkness here is not external
  but the habitual inattention that treats a collapsing, wound-covered, perpetually sickening thing (arukāyaṁ,
  āturaṁ, roganīḷaṁ) as stable ground for laughter and joy. The Pali cittakataṁ bimbaṁ—the mind-made image,
  the constructed appearance—is the operative phrase: we live inside a fiction of coherence and permanence
  (dhuvaṁ ṭhiti) that the body itself constantly contradicts. The verses do not counsel despair but clarity:
  *passa*—look, see directly—at what is actually here. The discipline is not renunciation of joy but the
  precision of attention that refuses the convenient lie. To seek the light (the lamp, the way out) requires
  first acknowledging that one is in darkness, that the house one inhabits is burning, that what one has
  dressed up and called solid is already breaking. This is the governing move: not negation of life, but
  the sober, unsentimental recognition that becomes the ground for genuine practice.'
abhyasa: 'Over the next three days, each time you reach for comfort—food, distraction, reassurance, a
  familiar story about yourself—pause and complete this sentence aloud or in writing: "Right now I am
  treating ___ as permanent." Name the specific thing (your mood, your role, your body''s steadiness,
  someone''s approval, this moment) and notice what happens when you refuse the automatic next step. Do
  not turn away; sit with the friction between what you want to believe and what you actually know.'
themes:
- impermanence
- attention and blindness
- the constructed self
- body as teacher
- urgency without panic
- seeing clearly
