sutra_id: DHP_CH11
collection: Dhammapada
section: Chapter 11 — Old Age (Jarāvagga), vv. 146–156
title: Looking for the Maker of This House
sanskrit: '(146) Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.


  (147) Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.


  (148) Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.'
transliteration: '(146) Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.


  (147) Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.


  (148) Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.'
translation: '(146) How is there laughter, how is there joy, as this world is always burning? Why do you
  not seek a light, ye who are surrounded by darkness?


  (147) Look at this dressed-up lump, covered with wounds, joined together, sickly, full of many thoughts,
  which has no strength, no hold!


  (148) This body is wasted, full of sickness, and frail; this heap of corruption breaks to pieces, life
  indeed ends in death.'
commentary: 'This chapter of the Dhammapada (Old Age) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Looking for the Maker of This House» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
