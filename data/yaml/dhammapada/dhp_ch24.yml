collection: Dhammapada
section: Chapter 24 — Thirst (Taṇhāvagga), vv. 334–359
title: The Thirst of the Careless Grows
sanskrit: '(334) Manujassa pamattacārino, Taṇhā vaḍḍhati māluvā viya; So plavatī hurā huraṁ, Phalamicchaṁva
  vanasmi vānaro.


  (335) Yaṁ esā sahate jammī, taṇhā loke visattikā; Sokā tassa pavaḍḍhanti, abhivaṭṭhaṁva bīraṇaṁ.


  (336) Yo cetaṁ sahate jammiṁ, taṇhaṁ loke duraccayaṁ; Sokā tamhā papatanti, udabinduva pokkharā.'
transliteration: '(334) Manujassa pamattacārino, Taṇhā vaḍḍhati māluvā viya; So plavatī hurā huraṁ, Phalamicchaṁva
  vanasmi vānaro.


  (335) Yaṁ esā sahate jammī, taṇhā loke visattikā; Sokā tassa pavaḍḍhanti, abhivaṭṭhaṁva bīraṇaṁ.


  (336) Yo cetaṁ sahate jammiṁ, taṇhaṁ loke duraccayaṁ; Sokā tamhā papatanti, udabinduva pokkharā.'
translation: '(334) The thirst of a thoughtless man grows like a creeper; he runs from life to life, like
  a monkey seeking fruit in the forest.


  (335) Whomsoever this fierce thirst overcomes, full of poison, in this world, his sufferings increase
  like the abounding Birana grass.


  (336) He who overcomes this fierce thirst, difficult to be conquered in this world, sufferings fall
  off from him, like water-drops from a lotus leaf.'
commentary: 'This chapter of the Dhammapada (Thirst) treats liberation as a discipline of mind: what precedes
  action is intention, and what ends suffering is the training of attention itself. The selected opening
  verses of the vagga state the chapter''s governing move without softening it. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
  its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary
  life. This is the demand of a living tradition: insight without application remains incomplete. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «The Thirst of the Careless Grows» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
