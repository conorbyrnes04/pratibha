collection: Dhammapada
section: Chapter 12 — Self (Attavagga), vv. 157–166
title: Self Is Lord of Self
sanskrit: '(157) Attānañce piyaṁ jaññā, rakkheyya naṁ surakkhitaṁ; Tiṇṇaṁ aññataraṁ yāmaṁ, paṭijaggeyya
  paṇḍito.


  (158) Attānameva paṭhamaṁ, patirūpe nivesaye; Athaññamanusāseyya, na kilisseyya paṇḍito.


  (159) Attānañce tathā kayirā, yathāññamanusāsati; Sudanto vata dametha, attā hi kira duddamo.'
transliteration: '(157) Attānañce piyaṁ jaññā, rakkheyya naṁ surakkhitaṁ; Tiṇṇaṁ aññataraṁ yāmaṁ, paṭijaggeyya
  paṇḍito.


  (158) Attānameva paṭhamaṁ, patirūpe nivesaye; Athaññamanusāseyya, na kilisseyya paṇḍito.


  (159) Attānañce tathā kayirā, yathāññamanusāsati; Sudanto vata dametha, attā hi kira duddamo.'
translation: '(157) If a man hold himself dear, let him watch himself carefully; during one at least out
  of the three watches a wise man should be watchful.


  (158) Let each man direct himself first to what is proper, then let him teach others; thus a wise man
  will not suffer.


  (159) If a man make himself as he teaches others to be, then, being himself well subdued, he may subdue
  (others); one''s own self is indeed difficult to subdue.'
commentary: 'This chapter of the Dhammapada (Self) treats liberation as a discipline of mind: what precedes
  action is intention, and what ends suffering is the training of attention itself. The selected opening
  verses of the vagga state the chapter''s governing move without softening it. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
  its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary
  life. This is the demand of a living tradition: insight without application remains incomplete. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «Self Is Lord of Self» as a working hypothesis. When
  a reactive thought arises, name it before acting, and choose one non-harmful response.
themes:
