sutra_id: DHP_CH07
collection: Dhammapada
section: Chapter 7 — The Venerable (Arahantavagga), vv. 90–99
title: The Path of the One Who Has Gone Far
sanskrit: '(90) Gataddhino visokassa, vippamuttassa sabbadhi; Sabbaganthappahīnassa, pariḷāho na vijjati.


  (91) Uyyuñjanti satīmanto, na nikete ramanti te; Haṁsāva pallalaṁ hitvā, okamokaṁ jahanti te.


  (92) Yesaṁ sannicayo natthi, ye pariññātabhojanā; Suññato animitto ca, vimokkho yesaṁ gocaro; Ākāseva
  sakuntānaṁ, gati tesaṁ durannayā.'
transliteration: '(90) Gataddhino visokassa, vippamuttassa sabbadhi; Sabbaganthappahīnassa, pariḷāho na
  vijjati.


  (91) Uyyuñjanti satīmanto, na nikete ramanti te; Haṁsāva pallalaṁ hitvā, okamokaṁ jahanti te.


  (92) Yesaṁ sannicayo natthi, ye pariññātabhojanā; Suññato animitto ca, vimokkho yesaṁ gocaro; Ākāseva
  sakuntānaṁ, gati tesaṁ durannayā.'
translation: '(90) There is no suffering for him who has finished his journey, and abandoned grief, who
  has freed himself on all sides, and thrown off all fetters.


  (91) They depart with their thoughts well-collected, they are not happy in their abode; like swans who
  have left their lake, they leave their house and home.


  (92) Men who have no riches, who live on recognised food, who have perceived void and unconditioned
  freedom (Nirvana), their path is difficult to understand, like that of birds in the air.'
commentary: 'These verses map the architecture of completion: the arahant (one who has ''gone far'') experiences
  cessation not as a future state but as the present absence of friction. Verse 90 announces the paradox—*pariḷāho
  na vijjati* (no burning remains)—because the work is already done. The fetters (*ganthi*) are not broken
  by force but recognized as never having bound what was always free. Verses 91–92 then shift from the
  finished state to its *signature in motion*. The venerable do not ''leave home'' through renunciation-as-rejection;
  they depart because remaining would contradict their nature, as swans cannot choose to nest in mud.
  The image is not moral but biological—the freed mind simply cannot rest in what it has seen through.
  Verse 92 deepens this: those without accumulation (*sannicayo natthi*), who have directly perceived
  *suññato* (voidness) and *animitto* (the unconditioned), move through the world in a way that cannot
  be tracked or predicted—*durannayā*, hard to trace. Their path resembles birds in open sky: no footprints,
  no fixed route, only the logic of unobstructed flight. The teaching here is that liberation is not escape
  from the world but the end of the compulsion to interpret it. The mind that has finished its journey
  no longer needs to *become* anything; it simply acts from clarity, leaving no residue of self-concern
  behind.'
abhyasa: 'After eating a meal, remain at the table for three breaths without clearing the dishes or moving
  to the next task. Notice what arises—the urge to optimize, to complete, to leave no trace of need. Then
  deliberately leave one small thing undone: a cup half-full, a crumb on the cloth. Do this not as rebellion
  but as a direct perception: observe how the mind treats incompletion as a debt, and how that debt creates
  the very restlessness the verses name.'
themes:
- completion without escape
- voidness and motion
- the end of accumulation
- untraced freedom
- mind without residue
- the arahant's signature
