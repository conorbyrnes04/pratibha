sutra_id: DHP_CH04
collection: Dhammapada
section: Chapter 4 — Flowers (Pupphavagga), vv. 44–59
title: Who Will Examine This Flower-Like Body
sanskrit: '(44) Ko imaṁ pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Ko dhammapadaṁ sudesitaṁ, Kusalo
  pupphamiva pacessati.


  (45) Sekho pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Sekho dhammapadaṁ sudesitaṁ, Kusalo pupphamiva
  pacessati.


  (46) Pheṇūpamaṁ kāyamimaṁ viditvā, Marīcidhammaṁ abhisambudhāno; Chetvāna mārassa papupphakāni, Adassanaṁ
  maccurājassa gacche.'
transliteration: '(44) Ko imaṁ pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Ko dhammapadaṁ sudesitaṁ,
  Kusalo pupphamiva pacessati.


  (45) Sekho pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Sekho dhammapadaṁ sudesitaṁ, Kusalo pupphamiva
  pacessati.


  (46) Pheṇūpamaṁ kāyamimaṁ viditvā, Marīcidhammaṁ abhisambudhāno; Chetvāna mārassa papupphakāni, Adassanaṁ
  maccurājassa gacche.'
translation: '(44) Who shall overcome this earth, and the world of Yama (the lord of the departed), and
  the world of the gods? Who shall find out the plainly shown path of virtue, as a clever man finds out
  the (right) flower?


  (45) The disciple will overcome the earth, and the world of Yama, and the world of the gods. The disciple
  will find out the plainly shown path of virtue, as a clever man finds out the (right) flower.


  (46) He who knows that this body is like froth, and has learnt that it is as unsubstantial as a mirage,
  will break the flower-pointed arrow of Mara, and never see the king of death.'
commentary: 'The passage pivots on a single question—Ko imaṁ (who?)—that refuses easy answer. Verses 44–45
  establish the inquiry as the work of the sekho, the disciple-in-training: to examine (vicessati) the
  earth, Yama''s realm, the gods'' domain, and the dhammapadaṁ (the path of dharma, the teaching itself)
  requires not belief but active discernment, the skill of a kusalo (one skilled, practiced) selecting
  the right flower from many. This is not metaphorical prettiness. The flower-finding is the work itself—discriminating,
  choosing, testing against direct perception. Verse 46 then answers the opening question by naming the
  specific examination that matters: knowing (viditvā) the body as pheṇūpama (foam-like), marīcidharma
  (mirage-nature), insubstantial and impermanent. This knowledge is not intellectual assent but lived
  recognition that breaks the papupphakāni—the flower-pointed arrows of Mara, desire''s lord. The discipline
  is one of sustained, unsentimental looking: the body examined as it is, not as it appears. Once this
  seeing penetrates, the king of death (maccurāja) becomes invisible—not conquered through force but through
  the collapse of the illusion that sustained his power. The path asks: will you look? Will you keep looking?'
abhyasa: When washing your hands or face, feel the water's contact without naming it pleasant or unpleasant—trace
  instead how sensation arises and dissolves in each moment of contact, as foam forms and collapses on
  the surface. Return to this tracing three times during the day, each time letting the body's transience
  become tactile rather than theoretical.
themes:
- examination
- discernment
- impermanence
- body-knowledge
- mara's arrows
- the sekho's work
