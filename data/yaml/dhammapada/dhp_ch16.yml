sutra_id: DHP_CH16
collection: Dhammapada
section: Chapter 16 — Pleasure (Piyavagga), vv. 209–220
title: From What Is Dear Arises Sorrow
sanskrit: '(209) Ayoge yuñjamattānaṁ, yogasmiñca ayojayaṁ; Atthaṁ hitvā piyaggāhī, pihetattānuyoginaṁ.


  (210) Mā piyehi samāgañchi, appiyehi kudācanaṁ; Piyānaṁ adassanaṁ dukkhaṁ, appiyānañca dassanaṁ.


  (211) Tasmā piyaṁ na kayirātha, piyāpāyo hi pāpako; Ganthā tesaṁ na vijjanti, yesaṁ natthi piyāppiyaṁ.'
transliteration: '(209) Ayoge yuñjamattānaṁ, yogasmiñca ayojayaṁ; Atthaṁ hitvā piyaggāhī, pihetattānuyoginaṁ.


  (210) Mā piyehi samāgañchi, appiyehi kudācanaṁ; Piyānaṁ adassanaṁ dukkhaṁ, appiyānañca dassanaṁ.


  (211) Tasmā piyaṁ na kayirātha, piyāpāyo hi pāpako; Ganthā tesaṁ na vijjanti, yesaṁ natthi piyāppiyaṁ.'
translation: '(209) He who gives himself to vanity, and does not give himself to meditation, forgetting
  the real aim (of life) and grasping at pleasure, will in time envy him who has exerted himself in meditation.


  (210) Let no man ever look for what is pleasant, or what is unpleasant. Not to see what is pleasant
  is pain, and it is pain to see what is unpleasant.


  (211) Let, therefore, no man love anything; loss of the beloved is evil. Those who love nothing and
  hate nothing, have no fetters.'
commentary: 'This chapter of the Dhammapada (Pleasure) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «From What Is Dear Arises Sorrow» as a working hypothesis.
  When a reactive thought arises, name it before acting, and choose one non-harmful response.
