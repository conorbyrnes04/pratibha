sutra_id: DHP_CH06
collection: Dhammapada
section: Chapter 6 — The Wise Man (Paṇḍitavagga), vv. 76–89
title: If You See a Wise Companion
sanskrit: '(76) Nidhīnaṁva pavattāraṁ, yaṁ passe vajjadassinaṁ; Niggayhavādiṁ medhāviṁ, tādisaṁ paṇḍitaṁ
  bhaje; Tādisaṁ bhajamānassa, seyyo hoti na pāpiyo.


  (77) Ovadeyyānusāseyya, asabbhā ca nivāraye; Satañhi so piyo hoti, asataṁ hoti appiyo.


  (78) Na bhaje pāpake mitte, na bhaje purisādhame; Bhajetha mitte kalyāṇe, bhajetha purisuttame.'
transliteration: '(76) Nidhīnaṁva pavattāraṁ, yaṁ passe vajjadassinaṁ; Niggayhavādiṁ medhāviṁ, tādisaṁ
  paṇḍitaṁ bhaje; Tādisaṁ bhajamānassa, seyyo hoti na pāpiyo.


  (77) Ovadeyyānusāseyya, asabbhā ca nivāraye; Satañhi so piyo hoti, asataṁ hoti appiyo.


  (78) Na bhaje pāpake mitte, na bhaje purisādhame; Bhajetha mitte kalyāṇe, bhajetha purisuttame.'
translation: '(76) If you see an intelligent man who tells you where true treasures are to be found, who
  shows what is to be avoided, and administers reproofs, follow that wise man; it will be better, not
  worse, for those who follow him.


  (77) Let him admonish, let him teach, let him forbid what is improper!--he will be beloved of the good,
  by the bad he will be hated.


  (78) Do not have evil-doers for friends, do not have low people for friends: have virtuous people for
  friends, have for friends the best of men.'
commentary: 'These verses establish a radical inversion of social gravity: the wise companion is not one
  who flatters or affirms, but one who *shows what is to be avoided* (vajjadassinaṁ)—who administers reproofs
  (niggayhavādi). The passage does not ask whether correction feels pleasant; it asks whether the corrector
  sees truly. This is the governing discipline: training yourself to recognize that the person who names
  your fault clearly, without malice, has become a mirror more valuable than agreement. The verses move
  through three nested claims. First, follow such a person because it will be *better* (seyyo)—not easier,
  not more comfortable, but better in the direction of liberation. Second, understand that this teacher
  will be hated by the bad (asataṁ hoti appiyo) and loved by the good (satañhi so piyo hoti)—your own
  response to correction becomes a diagnostic: do you recoil, or lean in? Third, the choice is not passive
  discovery but active *bhaje*—seek out, cultivate, return to—virtuous companions. The discipline here
  is not self-improvement through willpower but a deliberate rewiring of your social field. You are what
  your companions reflect back. To follow a wise companion is to consent, again and again, to being seen.'
abhyasa: 'When someone offers you a direct criticism—a word you did not ask for—pause before defending
  and ask: *Is this person trying to help me see, or trying to wound?* If the answer is help, receive
  the words as if they were medicine you had been searching for, even if they taste bitter. Notice what
  happens in your body when you stop arguing back.'
themes:
- companionship as discipline
- reproach as teaching
- social field and character
- the mirror function
- resistance to correction
- virtue as attraction
