sutra_id: DHP_CH14
collection: Dhammapada
section: Chapter 14 — The Buddha (Buddhavagga), vv. 179–196
title: By What Path Will You Lead the Buddha
sanskrit: '(179) Yassa jitaṁ nāvajīyati, Jitaṁ yassa noyāti koci loke; Taṁ buddhamanantagocaraṁ, Apadaṁ
  kena padena nessatha.


  (180) Yassa jālinī visattikā, Taṇhā natthi kuhiñci netave; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena
  nessatha.


  (181) Ye jhānapasutā dhīrā, nekkhammūpasame ratā; Devāpi tesaṁ pihayanti, sambuddhānaṁ satīmataṁ.'
transliteration: '(179) Yassa jitaṁ nāvajīyati, Jitaṁ yassa noyāti koci loke; Taṁ buddhamanantagocaraṁ,
  Apadaṁ kena padena nessatha.


  (180) Yassa jālinī visattikā, Taṇhā natthi kuhiñci netave; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena
  nessatha.


  (181) Ye jhānapasutā dhīrā, nekkhammūpasame ratā; Devāpi tesaṁ pihayanti, sambuddhānaṁ satīmataṁ.'
translation: '(179) He whose conquest is not conquered again, into whose conquest no one in this world
  enters, by what track can you lead him, the Awakened, the Omniscient, the trackless?


  (180) He whom no desire with its snares and poisons can lead astray, by what track can you lead him,
  the Awakened, the Omniscient, the trackless?


  (181) Even the gods envy those who are awakened and not forgetful, who are given to meditation, who
  are wise, and who delight in the repose of retirement (from the world).'
commentary: 'This chapter of the Dhammapada (The Buddha) treats liberation as a discipline of mind: what
  precedes action is intention, and what ends suffering is the training of attention itself. The selected
  opening verses of the vagga state the chapter''s governing move without softening it. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one day, take the governing claim of «By What Path Will You Lead the Buddha» as a working
  hypothesis. When a reactive thought arises, name it before acting, and choose one non-harmful response.
themes:
