sutra_id: PULAAR_005
collection: Pulaar Tradition
section: teaching_passage
title: Bridewealth Is Always Named in Cows
sanskrit: 'La dot est proportionnelle à la fortune du mari et l''honore d''autant
  qu''elle est plus élevée : pour une jeune fille, elle peut aller jusqu''à quinze
  vaches, à dix pour une femme déjà mariée; cette dot est toujours exprimée en vaches.'
transliteration: Not applicable. Pulaar later names bridewealth *sadaaki* (from Arabic
  *ṣadāq*) when the frame is Islamic; Lasnet's ethnographic fact is that the unit
  of honor remains the cow even when payment is made in silver, cloth, or sheep.
translation: 'The bridewealth is proportional to the husband''s fortune and honors
  him the more as it is higher: for a young woman it may go as far as fifteen cows,
  ten for a woman already married. This bridewealth is always expressed in cows.'
commentary: 'The claim is that cattle are not only food and motion; they are the language
  of honor in alliance. Lasnet is describing marriage "regulated by the laws of the
  Qur''an," with a marabout reciting prayers. Inside that Islamic frame the dowry-word
  is still bovine. You may pay in money, sheep, or cloth, but you *name* the gift
  in cows. The pre-Islamic measure survives as the unit of speech. That is how a cult
  remains after the temple is gone: it becomes the currency of respect.


  "Honors him the more as it is higher" is a ranking that can become vanity. The philosophical
  core is prior to the vanity. A people whose primitive cult was the herd will measure
  a binding of families in the same beings that determine the path. Fifteen cows is
  not a price-tag on a woman in the market sense Lasnet''s "achetée" wants. It is
  the herd acknowledging a new household. The cow is the sentence in which the group
  says: this alliance is real.


  Existentially the teaching is about what you still count when you think you have
  changed religions. If your sacred is cattle, your contracts will speak cow even
  on a mosque day. Ask what unit *you* always express things in — money, credentials,
  time, attention. That unit is your remaining cult.


  Key Terms:


  **dot ... toujours exprimée en vaches** - "bridewealth always expressed in cows"
  -> the cow as unit of speech, even when payment is substituted -> "dowry" in the
  European sense (goods the bride brings) is the wrong direction; this is what the
  husband-side gives, named in cattle.


  **l''honore** - "honors him" -> bridewealth as honor, not only transfer -> *pulaaku*
  later names honor-shame; Lasnet has the structure without the word.


  **quinze vaches** - the upper figure for a previously unmarried woman -> a number
  that makes the herd-cult countable -> do not treat the number as a shopping price;
  treat it as how large a piece of the sacred herd is pledged.


  **vaches** - cows, specifically, not generic livestock -> milk-life, not meat-wealth
  only -> substituting sheep or cloth is allowed; substituting the *name* is not.


  Cross-Tradition Resonances:


  **Vedic bride-gift and cattle as *dakṣiṇā*:** Both make cattle the measurable form
  of a sacred bond.

  *Divergence:* Vedic cattle-gift is priestly and hymnic; Fulɓe cattle-gift here is
  affinal and remains so under Qur''anic law.


  **Aristotle on *timē* (honor):** Both treat honor as something that must be publicly
  measured.

  *Divergence:* Greek honor is civic and martial; this honor is pastoral and nuptial.


  **Serer first-fruits (this corpus):** Both offer living produce as the true gift,
  not a token.

  *Divergence:* Serer first-fruits go to spirits at tree and stone; Fulɓe cows go
  to the wife''s people as the named measure of the bond.'
voice_of_siva: ''
abhyasa: Take one obligation you owe a person — thanks, help, repair. Name it in the
  unit that is actually sacred to you, not in the unit that is convenient. Then give
  a piece of that, not a substitute that keeps the name empty.
