sutra_id: PULAAR_002
collection: Pulaar Tradition
section: teaching_passage
title: The Primitive Cult Was Cattle-Worship
sanskrit: Le culte primitif paraît avoir été la boolâtrie, et dans leur mahométisme
  actuel se sont maintenues de nombreuses coutumes qui témoignent de leurs anciennes
  pratiques. La propreté qu'ils observent dans leurs bouveries a quelque chose de
  religieux.
transliteration: Not applicable. Key term is Reclus's coinage *boolâtrie* (from Latin
  *bos*, ox, on the model of *idolâtrie*). Pulaar does not need this word; the practice
  is the clean cattle-pen and the customs that outlive conversion.
translation: The primitive cult appears to have been cattle-worship, and in their
  present Mohammedanism many customs have been maintained that witness to their ancient
  practices. The cleanliness they observe in their cattle-pens has something religious
  about it.
commentary: 'The claim is historical and diagnostic at once. Reclus does not claim
  to have watched a Fulɓe cow-temple. He infers a primitive cult from what Islam did
  not erase. That inference is the honest shape of the PD record: pre-Islamic Pulaar
  religion is mostly visible as remainder. Lasnet repeats the sentence almost verbatim
  in 1900, which tells you how thin the ethnographic file still was. There is no Gueno
  here, no initiation cave, no milk-cosmogony. There is a European -latry word, and
  then a concrete rite: the cattle-pen is kept as if it were a holy place.


  "Something religious" (*quelque chose de religieux*) in the cleanliness of the *bouveries*
  is the philosophical hinge. Hygiene can be merely practical. Reclus sees that it
  is not merely practical. The pen is where the cult-object lives. To keep it clean
  is to keep the relation intact. Conversion to Islam changes the Friday and the prayer-direction;
  it does not empty the pen of its older gravity.


  Existentially the teaching is about what conversion does not convert. A new confession
  can rename the sky and still leave the daily shrine standing. If you want the pre-Islamic
  Pulaar world, do not start with a reconstructed myth. Start with the place that
  is still treated as if it were sacred: the enclosure of the herd.


  Key Terms:


  **boolâtrie** - Reclus''s name for a primitive cattle-cult -> a scholar''s -latry,
  not a Pulaar autonym -> "idolatry of cows" overstates images; the next clause (clean
  pens, surviving customs) is the actual content.


  **culte primitif** - "primitive cult" -> chronological claim: Islam is later; cattle-relation
  is earlier -> "primitive" in 1887 French is evolutionary ranking; the usable sense
  is *prior*.


  **bouveries** - cattle-pens, byres -> the built form of the cult -> "barn" is too
  agricultural-European; this is the nomad or semi-nomad enclosure that still receives
  guests in Bondou, Reclus says, as a mark of respect.


  **mahométisme actuel** - "present Mohammedanism" -> the overlay, not the vacuum
  -> the unit''s point is remnant, not a claim that Fulɓe Islam is fake.


  Cross-Tradition Resonances:


  **Hebrew *mishkan* and care of the holy enclosure:** Both treat the kept enclosure
  as a religious fact, not a shed.

  *Divergence:* The tabernacle is portable because God dwells there; the Fulɓe pen
  is holy because the herd lives there.


  **Shinto shrine sweeping:** Both locate reverence in cleanliness before any spoken
  doctrine.

  *Divergence:* Shinto cleanliness has kami and a shrine lineage; Reclus has no named
  spirit of the pen — only "something religious."


  **Serer refusal to address Roog directly (this corpus):** Both keep the highest
  from being the only practice; everyday sanctity is local.

  *Divergence:* Serer locality is tree, stone, and *mammam*; Fulɓe locality in this
  source is the cattle-pen.'
voice_of_siva: ''
abhyasa: Clean one place that keeps what you live from — kitchen, stall, desk, threshold
  — as if the cleanliness were already a rite. Do not add incense. Notice whether
  the care feels merely practical or whether it has "something religious" in it. That
  notice is the remnant.
