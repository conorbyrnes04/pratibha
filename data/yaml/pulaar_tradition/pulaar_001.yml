sutra_id: PULAAR_001
collection: Pulaar Tradition
section: teaching_passage
title: The Remaining Cult Is the Herd
sanskrit: Même aujourd'hui, on trouve dans le Wassallah et le Kankan des Peulhs nomades
  qui n'ont qu'un culte, celui de leurs troupeaux, qu'ils font prospérer le mieux
  qu'ils peuvent, sans se préoccuper du lendemain.
transliteration: 'Not applicable (French ethnographic report of Fulɓe oral practice).
  Key Pulaar terms later sources use, not named by Crozals: *nagge* / *na''i* (cow,
  cattle); *pulaaku* (the Fulɓe code of conduct). The philosophical claim of this
  unit is the observer''s sentence itself: the remaining cult is the herd.'
translation: 'Even today, in Wassallah and Kankan, one finds nomad Peuls who have
  only one cult: that of their herds. They make the herds prosper as best they can,
  without concern for tomorrow.'
commentary: 'The claim is liturgical, not zoological. Crozals, compiling Park, Mollien,
  and Bayol, is hunting for "idolatry" among the Fulɓe and cannot find a temple. What
  he finds instead, among the last openly pagan nomads of the Upper Niger hinterland,
  is a cult with one object: the herd. "Only one cult" (*n''ont qu''un culte*) is
  the philosophical sentence. It does not mean that cows are carved as idols. Crozals
  says in the next breath that idolatry among the Peuls is an exception of the poorest
  and most isolated. The remaining religion is not a statue. It is a relation of care
  that has no other shrine.


  "Without concern for tomorrow" is not improvidence as a moral failing. It is the
  pastoral present tense. The herd is fed, watered, moved, and protected today. Cosmology,
  if it exists, is not stored in a book; it is stored in the continued life of the
  animals. Later Fulɓe literature will name a creator and an ur-cow. These 1883 pages
  do not. They record what a public-domain observer could still see: where Islam has
  not yet replaced the old center, the center is cattle.


  Existentially the teaching cuts two modern errors. One is that a people without
  a temple has no religion. The other is that "animism" must mean a crowded pantheon.
  Here the world is already full, but the cult is single. You do not collect gods.
  You keep the herd alive. That keeping *is* the rite.


  Key Terms:


  **culte des troupeaux** - "cult of the herds" -> Crozals/Bayol''s name for the last
  pagan liturgical center -> "cattle-raising" as mere economy misses that the observers
  reached for a religious word because no other cult was visible.


  **Peulhs nomades** - nomad Fulɓe, as opposed to the settled Muslim majority of Futa
  Toro and Futa Jallon -> the remaining pre-Islamic type in this source is pastoral
  and mobile, not a village mosque community.


  **sans se préoccuper du lendemain** - "without concern for tomorrow" -> pastoral
  present, not fecklessness -> English "they don''t plan" is a mistranslation of a
  life whose planning *is* the next pasture.


  **boolâtrie** - Reclus/Lasnet''s learned name for the same structure (next unit)
  -> "cow-worship" as a European -latry coinage; the field report here is plainer:
  one cult, the herd.


  Cross-Tradition Resonances:


  **Vedic *go* and the cow as wealth-and-rite:** Both locate the sacred in living
  cattle rather than in a manufactured image.

  *Divergence:* Vedic ritual is a named sacrifice with priests and meter; this Pulaar
  remainder has no temple and no recorded hymn in the PD sources — only the prospering
  of the herd.


  **Serer first-fruits at the baobab (this corpus):** Both refuse to empty the near
  world for a distant God.

  *Divergence:* Serer practice pours milk and millet at a tree or stone; remaining
  pagan Fulɓe, in this sentence, have no other cult than the animals themselves.


  **Daoist wandering:** Both prefer a mobile life that does not stockpile tomorrow.

  *Divergence:* Zhuāngzǐ''s wandering is a freedom from fixed use; Fulɓe mobility
  in this source is bound to pasture and water.'
voice_of_siva: ''
abhyasa: Today, take one living being that depends on you — a person, an animal, a
  plant — and make *its* prospering the whole of the rite. Do not add a prayer on
  top. Do not postpone care until a better cosmology arrives. The cult is the keeping.
