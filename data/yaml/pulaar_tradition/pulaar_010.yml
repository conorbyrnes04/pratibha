sutra_id: PULAAR_010
collection: Pulaar Tradition
section: teaching_passage
title: The Clan Honor-Name and the Ancestor's Interdit
sanskrit: De l'accord unanime des indigènes interrogés à cet égard, il résulte que
  c'est l'ancêtre du clan qui aurait institué ce nom et cet interdit et aurait solennellement
  transmis l'un et l'autre à tous ses descendants à venir. Ailleurs, par exemple chez
  les Peuls, on opposera les Dialloubé aux Hanhanbé, c'est-à-dire les gens du clan
  Diallo aux gens du clan Kan. Les diverses langues en usage dans l'Afrique noire
  désignent en général le nom de clan par une expression que l'on pourrait traduire
  par « terme honorifique » ou « titre de noblesse », comme diamou (ce qui grandit)
  en mandingue ou yettôdé (ce qui honore) en peul. L'interdit a été institué par l'ancêtre
  en même temps que le nom de clan.
transliteration: 'Not applicable. Key Pulaar term: *yettôdé* (Delafosse: "ce qui honore,"
  that which honors — the clan honor-name). Clan examples: Dialloubé (Diallo) and
  Hanhanbé (Kan). The paired institution is the *interdit* (avoidance, often an animal,
  plant, or object the ancestor bound the descendants not to harm or use).'
translation: By the unanimous agreement of those questioned on this point, it is the
  ancestor of the clan who instituted this name and this prohibition and solemnly
  transmitted both to all descendants to come. Among the Peuls, for example, one opposes
  the Dialloubé to the Hanhanbé — the people of clan Diallo to the people of clan
  Kan. The languages of Black Africa generally call the clan name by an expression
  one might translate as "honorific term" or "title of nobility," such as *diamou*
  ("that which enlarges") in Manding or *yettôdé* ("that which honors") in Peul. The
  prohibition was instituted by the ancestor at the same time as the clan name.
commentary: 'The claim is that identity is a double gift from an ancestor: a name
  that honors, and a prohibition that binds. Delafosse is writing a pan-West-African
  theory; he pauses on the Fulɓe because they illustrate the structure without always
  wearing the clan name as a surname in daily address. You still say Dialloubé against
  Hanhanbé when you need to name a people. *Yettôdé* means "that which honors." To
  call someone by the clan name is to say they have known ancestors — "birth," Delafosse
  says. The *interdit* is not a random food taboo. It is usually the species that
  saved the ancestor, or the object bound up with the founding escape. You do not
  eat or harm what saved the one who made you a people.


  This is the pre-Islamic Fulɓe social cosmology that the cattle-cult units do not
  yet reach. Herds explain motion, milk, and bridewealth. Clan *interdit* explains
  why the human group is not just a herd of humans. An ancestor acted, was saved,
  named the name, and laid a forever-avoidance on the descendants. Islam can add a
  *silsila* of marabouts; it does not have to erase Diallo and Kan. The remainder
  here is kinship as liturgy.


  Existentially the teaching is that you are not a self-invented individual with preferences.
  You are a descendant under a name and under a refusal. The refusal is the more philosophical
  half. Anyone can wear a proud name. The *interdit* is the name''s cost: there is
  a living kind you will not destroy, because your ancestor''s life came through it.


  Key Terms:


  **yettôdé** - Pulaar "that which honors"; the clan honor-name -> not a nickname
  and not a European surname -> to address someone by it is homage; Delafosse says
  you thereby affirm that the person has known ancestors.


  **interdit** - ancestor-instituted avoidance (animal, plant, object, sometimes another
  human group) -> often the helper-species of the founding story -> "taboo" is usable
  if you keep the ancestor as legislator; "totem" is what Delafosse warns against,
  because the clan is not always named after the respected animal.


  **Dialloubé / Hanhanbé** - people of Diallo vs people of Kan -> Fulɓe clan as collective,
  even when the name is not stacked on the personal name in daily speech.


  **ancêtre du clan** - the clan ancestor who instituted name and prohibition together
  -> the legislator of identity -> without this figure the honor-name is just branding.


  Cross-Tradition Resonances:


  **Israelite tribes and food laws:** Both bind a people by ancestor-given name plus
  prohibition.

  *Divergence:* Torah prohibitions are theistic and written; clan *interdit* is ancestral
  and oral, often tied to a rescue-story of a particular species.


  **Serer *lâ-siri* / ancestor–land fusion (this corpus, Delafosse):** Both make the
  dead the ongoing law of the living group.

  *Divergence:* Serer fusion in that unit is ancestor-and-land; Fulɓe *interdit* is
  ancestor-and-species (or plant, or object).


  **Confucian surname and ancestral hall:** Both treat the name as honor that must
  be lived up to.

  *Divergence:* The Chinese name is patrilineal ritual with tablets; *yettôdé* is
  a spoken honorific whose partner-institution is an avoidance, not a tablet.'
voice_of_siva: ''
abhyasa: Name one prohibition you actually live by that you did not invent — a food
  you will not eat, a cruelty you will not do, a place you will not spoil — because
  someone before you bound you. Keep it today on purpose, as if the ancestor were
  still the legislator. If you cannot name any such prohibition, you are living as
  if you had no *yettôdé*.
