sutra_id: PULAAR_008
collection: Pulaar Tradition
section: teaching_passage
title: Greet the Dead with Green Leaves
sanskrit: Les Peuls ont, comme tous les Musulmans, beaucoup de respect pour les morts
  ; profaner une tombe est un sacrilège et chaque fois que des Peuls en voyage rencontrent
  une tombe ou un cimetière, ils jettent en passant une poignée d'herbes ou de feuilles
  vertes, sorte de salut qu'ils adressent aux trépassés.
transliteration: 'Not applicable. The rite is a handful of green grass or leaves thrown
  in passing: a *salut* to the dead. Lasnet frames it as Muslim respect; the offering
  itself is forage — the same green the herd lives on.'
translation: The Peuls have, like all Muslims, much respect for the dead. To profane
  a tomb is a sacrilege, and every time Peuls on a journey meet a tomb or a cemetery,
  they throw as they pass a handful of grass or green leaves, a kind of greeting they
  address to those who have gone over.
commentary: 'The claim is that the dead remain addressable, and that the correct address
  from a pastoral people is green plant-matter thrown in passing. Lasnet wants this
  to be generic Islam: respect, sacrilege, tombs. The specific gesture is not generic.
  A handful of *herbes* or *feuilles vertes* is what you would give a living herd.
  The greeting to the dead is forage. The ancestor is still, in the remnant logic,
  a being who can be met on the road and who understands the gift of grass.


  "In passing" (*en passant*) matters. This is not a festival of the dead and not
  a sacrifice that stops the caravan. Mobility continues; relation continues inside
  mobility. Nomad respect cannot always be a vigil at a fixed grave. It can be a toss
  of green as you go by. The dead do not require you to become sedentary. They require
  that you not pass them as if they were stones.


  Existentially the teaching is a correction to both amnesia and ostentation. You
  do not have to build a shrine at every loss. You do have to refuse to walk past
  the dead as scenery. Give them something living and green, and keep moving. That
  is pastoral piety.


  Key Terms:


  **poignée d''herbes ou de feuilles vertes** - handful of grass or green leaves ->
  forage as greeting -> "flowers on a grave" is the nearest European picture and still
  too garden; this is pasture thrown to the dead.


  **salut** - greeting, salute -> the dead are met as persons on the road -> "offering"
  is true; "greeting" is more exact: you acknowledge, you do not bargain.


  **trépassés** - those who have passed over -> the dead as having gone a way, not
  as having become nothing -> the same root of passage as the travelers who greet
  them.


  **en voyage** - on a journey -> the rite belongs to mobility -> a sedentary memorial
  mass is another religion''s tempo.


  Cross-Tradition Resonances:


  **Serer speaking into the ear of the dead (this corpus):** Both refuse to treat
  the corpse-side of the world as mute.

  *Divergence:* Serer speech is intimate and at the body; Fulɓe greeting is a toss
  of green from the road.


  **Japanese *ohaka-mairi* and roadside *jizō*:** Both let travel include a gesture
  to the dead without ending the journey.

  *Divergence:* Japanese gesture is often water, incense, or stone; here the matter
  is grass.


  **Homeric *choai* (drink-offerings to the dead):** Both give the dead a portion
  of the living world''s goods.

  *Divergence:* Greek libation is wine and blood at a pit; this portion is pasture.'
voice_of_siva: ''
abhyasa: On one walk today, when you pass a cemetery, a roadside memorial, or even
  a tree that marks a death you know, do not pass as if it were scenery. Stop long
  enough to set down something green — a leaf, a blade of grass. Greet, do not speechify,
  and go on.
