sutra_id: PDMT_04
collection: Pseudo-Dionysius — Mystical Theology
section: Chapter 4
title: That He Who Is the Pre-eminent Cause Is None of the Things Affirmed
sanskrit: Ὅτι οὐδέν ἐστι τῶν πάντων ὁ πάντων αἴτιος κατὰ τὰς θέσεις.
transliteration: Greek (corpus original field).
translation: We say then that the Cause of all, which is above all, is neither without being nor without
  life, nor without reason nor without intelligence; yet it is not a body, nor has shape or form, quality,
  quantity, or bulk.
commentary: '«That He Who Is the Pre-eminent Cause Is None of the Things Affirmed» presses apophatic theology
  to its limit: God is reached not by adding predicates but by a disciplined unknowing that refuses both
  crude affirmation and crude denial. The passage asks a living reader to test the claim in experience
  rather than treat it as museum doctrine. Hold the argument until its force lands in attention, then
  let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when
  the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth
  the edge.'
abhyasa: Sit ten minutes in wordless attention. When a theological image arises, gently release it without
  replacing it by another.
