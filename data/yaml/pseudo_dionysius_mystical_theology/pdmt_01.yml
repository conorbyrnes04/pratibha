sutra_id: PDMT_01
collection: Pseudo-Dionysius — Mystical Theology
section: Chapter 1
title: The Divine Dark Beyond All Light
sanskrit: Τριὰς ὑπερούσιε καὶ ὑπέρθεε καὶ ὑπεράγαθε.
transliteration: Greek (corpus original field).
translation: Trinity, which exceedeth all Being, Deity, and Goodness! Thee that guidest Christians to
  Divine Wisdom, direct us to the summit of mystic oracles, most incomprehensible, most lucid, and most
  exalted, where the simple, absolute, and immutable mysteries of theology are revealed in the darkness
  deeper than light.
commentary: '«The Divine Dark Beyond All Light» presses apophatic theology to its limit: God is reached
  not by adding predicates but by a disciplined unknowing that refuses both crude affirmation and crude
  denial. The passage asks a living reader to test the claim in experience rather than treat it as museum
  doctrine. Hold the argument until its force lands in attention, then let practice carry one concrete
  shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the
  edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a theological image arises, gently release it without
  replacing it by another.
themes:
