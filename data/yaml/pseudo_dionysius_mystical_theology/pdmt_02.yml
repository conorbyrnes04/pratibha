sutra_id: PDMT_02
collection: Pseudo-Dionysius — Mystical Theology
section: Chapter 2
title: How We Must Be United with and Praise the Absolute One
sanskrit: Πῶς δεῖ καὶ ἑνοῦσθαι καὶ ὑμνεῖν τὸν πάντων αἴτιον καὶ ὑπὲρ πάντα.
transliteration: Greek (corpus original field).
translation: We pray that we may come unto this Darkness which is beyond light, and that we may see without
  seeing and know without knowing through ignorance that which is beyond all knowledge.
commentary: '«How We Must Be United with and Praise the Absolute One» presses apophatic theology to its
  limit: God is reached not by adding predicates but by a disciplined unknowing that refuses both crude
  affirmation and crude denial. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a theological image arises, gently release it without
  replacing it by another.
themes:
- knowledge
- ignorance
- stillness
- silence
- attention
- grace
