sutra_id: PDMT_03
collection: Pseudo-Dionysius — Mystical Theology
section: Chapter 3
title: What Are the Affirmative and Negative Theologies
sanskrit: Τίς ἡ καταφατικὴ θεολογία καὶ τίς ἡ ἀποφατική.
transliteration: Greek (corpus original field).
translation: In the affirmative theology we begin from the highest categories and descend through middle
  terms to the lowest; in the negative we ascend from the lowest to the highest, denying all, and at last
  enter the Darkness where God is said to be.
commentary: '«What Are the Affirmative and Negative Theologies» presses apophatic theology to its limit:
  God is reached not by adding predicates but by a disciplined unknowing that refuses both crude affirmation
  and crude denial. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a theological image arises, gently release it without
  replacing it by another.
