title: Verse 10 · U — Dream Consciousness
sanskrit: स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षादुभयत्वाद्वोत्कर्षति ह वै
  ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले भवति य एवं वेद ॥ १० ॥
transliteration: svapnasthānas taijasa ukāro dvitīyā mātrā utkarṣād ubhayatvād vā
  utkarṣati ha vai jñānasantatiṃ samānaś ca bhavati nāsyābrahmavit kule bhavati ya
  evaṃ veda || 10 ||
translation: Taijasa, whose sphere is the dream state, is U — the second element —
  on account of its superiority or its intermediate position. One who knows this elevates
  the stream of knowledge, becomes balanced, and in their lineage no one is born without
  knowledge of Brahman.
commentary: 'U is the middle vowel — between the open A and the closed M — and this
  medial position is its defining characteristic. *Utkarṣa* (superiority, elevation):
  U has a naturally rising, elevating quality; its sound lifts from the position of
  A toward the closure of M. This mirrors Taijasa''s relationship to the other states:
  it rises from the gross engagement of waking toward the subtle interiority of deep
  sleep, while maintaining the complete cognitive apparatus in subtle form.


  *Ubhayatva* (being in between, intermediate): U participates in both extremes —
  it has the openness of A and the interiority that approaches M. Taijasa similarly
  participates in both the external orientation of waking and the internal orientation
  of deep sleep.


  The promise that "no one in the lineage is born without Brahman-knowledge" carries
  an important implication: genuine recognition does not stay bounded within one individual.
  The field of consciousness in which recognition occurs is not private property.'
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it without haste or self-narration.
  End with one breath of gratitude.
