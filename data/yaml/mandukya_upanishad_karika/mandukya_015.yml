resonances:
- citation: Astavakra Gita — Verse 1.12
  resonance: 'Both passages define the ultimate reality by negation of ordinary attributes: Turīya is ''without measure'' (amātrā), ''beyond practical dealings,'' ''without a second''; the Self is ''inactive,'' ''free,'' ''all-pervading''—each strips away predicates to isolate a non-relational, non-functional ground of awareness.'
  divergence: Mandukya emphasizes the *silence* and *cessation* of phenomena as the mode of Turīya's transcendence, while Astavakra stresses the Self's eternal *witness-consciousness* and fullness—a difference between apophatic negation and positive non-dual presence.
  passage_id: astavakra_gita.asg_1_12
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: 'Both use spatial negation to indicate the ungraspable nature of consciousness: Turīya is ''without measure'' (amātrā—literally without dimension), and mind ''has no center and no circumference''—each refuses to locate or bound the ultimate within conceptual or spatial coordinates.'
  divergence: The Mandukya passage treats amātrā as a property of Turīya's transcendence of all measure, while Tilopa uses spatial metaphor (open sky) to evoke the mind's intrinsic freedom from form—one is ontological negation, the other phenomenological openness.
  passage_id: tilopa_mahamudra.til_002
- citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
  resonance: 'Both identify a gap between the soul''s continuous self-activity and ordinary awareness: Turīya is the ''cessation of phenomena'' yet the ground of all states; the soul ''continuously executes its characteristic act, but we remain unaware''—each posits an ever-present reality obscured by misdirected perception.'
  divergence: Mandukya locates this gap in the fourth state beyond waking, dream, and sleep (a state-based framework), while Plotinus locates it in the soul's perpetual activity masked by sense-focused attention (a perceptual-habit framework).
  passage_id: plotinus_enneads.enn_v_1_12
