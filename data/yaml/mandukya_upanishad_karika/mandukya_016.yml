translation: Āgama Prakaraṇa — Tradition · 29 Verses
commentary: 'The first prakaraṇa closely follows the Upaniṣad''s analysis. Its distinctive
  contributions are:


  The causality diagnosis (I.11–12): establishing that the first three quarters are
  conditioned (by cause and effect, or cause alone) while Turīya alone is uncaused
  — not one term in the causal chain but the ground in which causality appears.'
