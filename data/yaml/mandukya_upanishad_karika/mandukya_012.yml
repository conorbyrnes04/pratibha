resonances:
- citation: Siva Sutra — Āṇavopāya
  resonance: 'Both texts identify consciousness as the fundamental principle that generates or encompasses all manifestation: the Mandukya locates the first vowel A as the generative opening from which speech emerges, while the Siva Sutra declares ''The mind is the Self''—establishing consciousness as the primary, all-containing reality.'
  divergence: The Mandukya grounds this through phonetic-cosmological symbolism (the vowel as structural origin), whereas the Siva Sutra asserts it as direct metaphysical identity without intermediary symbol.
  passage_id: siva_sutra.ss_iii_1
- citation: Pratyabhijnahrdayam — Sutra 4
  resonance: 'Both passages establish pervasiveness as the defining characteristic of consciousness: the Mandukya names Vaiśvānara''s pervasiveness (vyāpti) as the reason for its primacy, and the Pratyabhijnahrdayam describes the individual experient as containing the universe in contracted form—consciousness as the all-pervading substrate that appears in graduated manifestations.'
  divergence: The Mandukya emphasizes pervasiveness as the logical ground for naming the waking state, while the Pratyabhijnahrdayam emphasizes the paradox of contraction within the infinite—a Tantric inversion of scale rather than a naming principle.
  passage_id: pratyabhijnahrdayam.phr_004
