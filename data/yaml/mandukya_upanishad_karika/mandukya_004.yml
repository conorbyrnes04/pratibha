title: Verses 3–6 · The Three States
sanskrit: ''
transliteration: ''
translation: 'Overview

  These four verses constitute the analytical heart of the Upaniṣad — the systematic
  examination of the three ordinary states of consciousness. The analysis is not psychological
  or neuroscientific; it is ontological. The question is not "what happens in these
  states?" but "what does each state reveal about the nature of consciousness itself?"'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the
  knower rather than the passing content.'
