sutra_id: MA_11_18
collection: Marcus Aurelius — Meditations
section: Book 11.18
title: Nine Heads Against Anger
sanskrit: Πρῶτον, τίνα ἐστὶ πρὸς ἄνθρωπον ἡ σχέσις.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: 'If any have offended against thee, consider first: What is my relation to men, and that
  we are made for cooperation. Second: consider what kind of men they are at table, in bed, and so forth.
  Remember that kindness is invincible if it be genuine.'
commentary: '«Nine Heads Against Anger» isolates a Stoic discipline of the ruling faculty: judgment is
  trainable, and the present moment is the only theatre of virtue. The passage asks a living reader to
  test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life.
  This is the demand of a living tradition: insight without application remains incomplete. Return again
  to the original wording when the mind wants to smooth the edge. Return again to the original wording
  when the mind wants to smooth the edge. Return again to the original wording when the mind wants to
  smooth the edge.'
abhyasa: For one sitting, rehearse the passage as if speaking to your own ruling faculty before the day's
  first difficult encounter.
