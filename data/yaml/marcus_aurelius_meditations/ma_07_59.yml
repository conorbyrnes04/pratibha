sutra_id: MA_07_59
collection: Marcus Aurelius — Meditations
section: Book 7.59
title: Look Within; Within Is the Fountain of Good
sanskrit: Ἔνδον σκάπτε, ἔνδον ἡ πηγὴ τοῦ ἀγαθοῦ.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever
  dig.
commentary: '«Look Within; Within Is the Fountain of Good» isolates a Stoic discipline of the ruling faculty:
  judgment is trainable, and the present moment is the only theatre of virtue. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
  its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary
  life. This is the demand of a living tradition: insight without application remains incomplete. Return
  again to the original wording when the mind wants to smooth the edge. Return again to the original wording
  when the mind wants to smooth the edge.'
abhyasa: For one sitting, rehearse the passage as if speaking to your own ruling faculty before the day's
  first difficult encounter.
themes:
