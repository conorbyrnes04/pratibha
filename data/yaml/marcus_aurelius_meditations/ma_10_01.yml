sutra_id: MA_10_01
collection: Marcus Aurelius — Meditations
section: Book 10.1
title: Wilt Thou Ever Be Good and Simple
sanskrit: Ἔσῃ ποτὲ ἄρα, ὦ ψυχή, ἀγαθὴ καὶ ἁπλῆ.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: Wilt thou, then, my soul, ever be good and simple and one and naked, more manifest than the
  body which surrounds thee? Wilt thou ever enjoy an affectionate and contented disposition?
commentary: '«Wilt Thou Ever Be Good and Simple» isolates a Stoic discipline of the ruling faculty: judgment
  is trainable, and the present moment is the only theatre of virtue. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its
  force lands in attention, then let practice carry one concrete shift into the next hour of ordinary
  life. This is the demand of a living tradition: insight without application remains incomplete. Return
  again to the original wording when the mind wants to smooth the edge. Return again to the original wording
  when the mind wants to smooth the edge.'
abhyasa: For one sitting, rehearse the passage as if speaking to your own ruling faculty before the day's
  first difficult encounter.
