sutra_id: MA_05_16
collection: Marcus Aurelius — Meditations
section: Book 5.16
title: The Soul Becomes Dyed with the Color of Its Thoughts
sanskrit: Οἵα ἐὰν ᾖ πολλάκις ἡ φαντασία, τοιαύτη ἔσται ἡ διάνοια.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: 'Such as are thy habitual thoughts, such also will be the character of thy mind; for the
  soul is dyed by the thoughts. Dye it then with a continuous series of such thoughts as these: where
  life is possible, there it is possible also to live well.'
commentary: '«The Soul Becomes Dyed with the Color of Its Thoughts» isolates a Stoic discipline of the
  ruling faculty: judgment is trainable, and the present moment is the only theatre of virtue. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.'
abhyasa: For one sitting, rehearse the passage as if speaking to your own ruling faculty before the day's
  first difficult encounter.
