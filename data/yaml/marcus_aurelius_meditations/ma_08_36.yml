sutra_id: MA_08_36
collection: Marcus Aurelius — Meditations
section: Book 8.36
title: Do Not Disturb Thyself by Thinking of the Whole of Thy Life
sanskrit: Μὴ συνταράσσου φανταζόμενος τὸν ὅλον σου βίον.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: 'Do not disturb thyself by thinking of the whole of thy life. Let not thy thoughts at once
  embrace all the various troubles which thou mayest expect to befall thee: but on every occasion ask
  thyself, What is there in this which is intolerable and past bearing?'
commentary: '«Do Not Disturb Thyself by Thinking of the Whole of Thy Life» isolates a Stoic discipline
  of the ruling faculty: judgment is trainable, and the present moment is the only theatre of virtue.
  The passage asks a living reader to test the claim in experience rather than treat it as museum doctrine.
  Hold the argument until its force lands in attention, then let practice carry one concrete shift into
  the next hour of ordinary life. This is the demand of a living tradition: insight without application
  remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: For one sitting, rehearse the passage as if speaking to your own ruling faculty before the day's
  first difficult encounter.
