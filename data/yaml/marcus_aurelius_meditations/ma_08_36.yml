sutra_id: MA_08_36
collection: Marcus Aurelius — Meditations
section: Book 8.36
title: Do Not Disturb Thyself by Thinking of the Whole of Thy Life
sanskrit: Μὴ συνταράσσου φανταζόμενος τὸν ὅλον σου βίον.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: 'Do not disturb thyself by thinking of the whole of thy life. Let not thy thoughts at once
  embrace all the various troubles which thou mayest expect to befall thee: but on every occasion ask
  thyself, What is there in this which is intolerable and past bearing?'
commentary: 'Marcus isolates a specific failure of prohairesis (the ruling faculty''s power of assent):
  the habit of *synatarassein*, a churning-together of the mind that collapses the future into the present
  through imagination. The discipline here is not positive visualization or rehearsal, but a sharp negation—a
  refusal to let phantasiai (impressions, mental images) of distant calamities fuse into a single overwhelming
  burden. The move is radically temporal: the ruling faculty''s only legitimate work is *now*, on *this*
  obstacle. By asking ''What is there in this which is intolerable?'' Marcus does not minimize suffering;
  he performs a surgical cut between the imagined totality (which paralyzes) and the actual present task
  (which remains manageable). This is not denial. It is the discipline of *horos*—the boundary—applied
  to thought itself. The whole life is real but not present; the present moment is both real *and* actionable.
  To disturb oneself by thinking the whole is to usurp the role of the ruling faculty, treating it as
  a historian of future pain rather than an agent in the present. The practice trains the faculty to recognize
  when it has left its proper seat.'
abhyasa: 'When you find yourself rehearsing a sequence of coming troubles—a difficult conversation leading
  to estrangement, a financial loss cascading through months, an illness unfolding—stop and name aloud
  one concrete thing in front of you right now (a door, a cup, the texture of cloth). Then ask: Does *this*
  require more than I can bear? Return the question to the actual present object until the phantasia loses
  its grip.'
