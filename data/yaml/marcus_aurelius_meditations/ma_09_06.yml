sutra_id: MA_09_06
collection: Marcus Aurelius — Meditations
section: Book 9.6
title: Enough to Have Present Judgment and Social Action
sanskrit: Ἀρκεῖ ἡ παροῦσα ὑπόληψις καταληπτικὴ καὶ ἡ ἐνεργὴς κοινωνικὴ καὶ ἡ διάθεσις ἀσμενίζουσα.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: Simple and modest is the work of philosophy. Do not draw me aside into ostentation. It is
  sufficient to have present judgment according to nature, and social action, and a disposition contented
  with whatever happens.
commentary: 'Marcus isolates three simultaneous capacities of the ruling faculty (prohairesis) that suffice
  for virtue—no ornament, no system, no future security needed. First: present judgment according to nature
  (hē parousa hypolēpsis katalēptikē)—not merely opinion, but assent to impressions that align with reason
  and the order of things. This is katalepsis, the cognitive grip that distinguishes Stoic practice from
  mere wish-thinking. Second: energetic social action (hē energēs koinōnikē)—not withdrawn contemplation
  but the immediate enactment of duty toward the whole, the concrete gesture, the word spoken, the hand
  extended. Third: a disposition that welcomes what arrives (hē diathesis asmenizousa)—not resignation
  but active gladness, the emotional posture that transforms acceptance from passive endurance into willing
  participation. The three are not sequential steps but concurrent operations: you judge truly *while*
  you act *while* you remain disposed to receive. The discipline here trains against the Stoic''s chronic
  temptation—to retreat into private correctness, to perfect the inner citadel while the city burns, to
  mistake clarity for virtue. Marcus cuts through that. Philosophy is not ornate; it is the work of *now*,
  of *us*, of *yes*.'
abhyasa: 'When you notice yourself preparing a response—to a complaint, a request, a criticism—pause and
  ask aloud (or in clear inner speech): "What is true here, what does this moment ask of me, and what
  am I willing to meet?" Answer each in sequence before you speak or act, letting the three answers arise
  together rather than debating them.'
themes:
- present judgment
- social duty
- willing assent
- ruling faculty
- concurrence of virtues
- simplicity
