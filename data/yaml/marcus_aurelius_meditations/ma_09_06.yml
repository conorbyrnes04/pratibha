sutra_id: MA_09_06
collection: Marcus Aurelius — Meditations
section: Book 9.6
title: Enough to Have Present Judgment and Social Action
sanskrit: Ἀρκεῖ ἡ παροῦσα ὑπόληψις καταληπτικὴ καὶ ἡ ἐνεργὴς κοινωνικὴ καὶ ἡ διάθεσις ἀσμενίζουσα.
transliteration: Greek original (Leopold/Perseus tradition); see source.
translation: Simple and modest is the work of philosophy. Do not draw me aside into ostentation. It is
  sufficient to have present judgment according to nature, and social action, and a disposition contented
  with whatever happens.
commentary: '«Enough to Have Present Judgment and Social Action» isolates a Stoic discipline of the ruling
  faculty: judgment is trainable, and the present moment is the only theatre of virtue. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge. Return again to the original
  wording when the mind wants to smooth the edge.'
abhyasa: For one sitting, rehearse the passage as if speaking to your own ruling faculty before the day's
  first difficult encounter.
