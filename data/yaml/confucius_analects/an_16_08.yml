sutra_id: AN_16_08
collection: Confucius — Analects
section: Analects 16.8
title: The Superior Man Has Three Things He Stands in Awe Of
sanskrit: 孔子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命而不畏也，狎大人，侮聖人之言。」
transliteration: Classical Chinese; see Pinyin study editions for pronunciation.
translation: Confucius said, 'There are three things of which the superior man stands in awe. He stands
  in awe of the ordinances of Heaven. He stands in awe of great men. He stands in awe of the words of
  sages. The mean man does not know the ordinances of Heaven, and consequently does not stand in awe of
  them. He is disrespectful to great men. He makes sport of the words of sages.'
commentary: '«The Superior Man Has Three Things He Stands in Awe Of» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
