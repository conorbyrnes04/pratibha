sutra_id: AN_20_03
collection: Confucius — Analects
section: Analects 20.3
title: Without Knowing the Ordinances of Heaven
sanskrit: 子曰：「不知命，無以為君子也。不知禮，無以立也。不知言，無以知人也。」
transliteration: Classical Chinese; see Pinyin study editions for pronunciation.
translation: The Master said, 'Without recognising the ordinances of Heaven, it is impossible to be a
  superior man. Without an acquaintance with the rules of Propriety, it is impossible for the character
  to be established. Without knowing the force of words, it is impossible to know men.'
commentary: '«Without Knowing the Ordinances of Heaven» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
