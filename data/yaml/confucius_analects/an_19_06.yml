sutra_id: AN_19_06
collection: Confucius — Analects
section: Analects 19.6
title: Broad Learning and Earnest Purpose
sanskrit: 子夏曰：「博學而篤志，切問而近思，仁在其中矣。」
transliteration: Classical Chinese; see Pinyin study editions for pronunciation.
translation: Zixia said, 'There are learning extensively, and having a firm and sincere aim; inquiring
  with earnestness, and reflecting with self-application:—virtue is in such a course.'
commentary: '«Broad Learning and Earnest Purpose» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain. The passage asks a living reader to test the claim in experience rather than treat it
  as museum doctrine. Hold the argument until its force lands in attention, then let practice carry one
  concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
abhyasa: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
