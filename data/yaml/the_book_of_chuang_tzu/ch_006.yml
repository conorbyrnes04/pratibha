chapter_number: 6
title: The Great and Original Teacher
sanskrit: ''
transliteration: ''
translation: 'The one who understands Heaven and understands the ways of humanity
  has perfection. Understanding Heaven, he grows with Heaven. Understanding humanity,
  he takes the understanding of what he understands to help him understand what he
  doesn’t understand, and so fulfils the years Heaven decrees without being cut off
  in his prime. This is known as perfection.


  However, it is true that there are problems. Real understanding has to have something
  to which it is applied and this something is itself uncertain. So how can I know
  that what I term Heaven is not human? Or that what I call human is not Heaven?


  Only the true man has understanding. So what is a true man? The true man of old
  did not fight against poverty, nor did he look for fulfilment through riches – for
  he had no grand plans. Therefore, he never regretted any failure, nor exulted in
  success. He could scale the heights without fear, plumb the depths without difficulties
  and go through fire without pain. This is the kind of person whose understanding
  has lifted him up towards the Tao.


