commentary: 'The one who understands Heaven and understands the ways of humanity has
  perfection. Understanding Heaven, he grows with Heaven. Understanding humanity,
  he takes the understanding of what he understands to help him understand what he
  doesn’t understand, and so fulfils the years Heaven decrees without being cut off
  in his prime. This is known as perfection.


  However, it is true that there are problems. Real understanding has to have something
  to which it is applied and this something is itself uncertain. So how can I know
  that what I term Heaven is not human? Or that what I call human is not Heaven?


  Only the true man has understanding. So what is a true man? The true man of old
  did not fight against poverty, nor did he look for fulfilment through riches – for
  he had no grand plans. Therefore, he never regretted any failure, nor exulted in
  success. He could scale the heights without fear, plumb the depths without difficulties
  and go through fire without pain. This is the kind of person whose understanding
  has lifted him up towards the Tao.


  The true man of old slept without dreaming and awoke without anxiety. He ate without
  tasting, breathing deeply, incredibly deeply. The true man breathes from his feet
  up, while ordinary people just breathe from the throat. The words of broken people
  come forth like vomit. Wallowing in lust and desire, they are but shallow in the
  ways of Heaven.


  The true man of old did not hold on to life, nor did he fear death. He arrived without
  expectation and left without resistance. He went calmly, he came calmly and that
  was that. He did not set out to forget his origin, nor was he interested in what
  would


  become of him. He loved to receive anything but also forgot what he had received
  and gave it away. He did not give precedence to the heart but to the Tao, nor did
  he prefer the ways of humanity to those of Heaven. This is what is known as a true
  man.


  Being like this, his heart forgets,


  his appearance is calm,


  his forehead is plain;


  He is as chilly as autumn and as warming as spring.


  His joy and anger arise like the four seasons.


  He acts properly towards all things


  and none know where this will lead.


  So if the sage summons the army and conquers states,


  he does not lose the affections of the people.


  His magnanimous nature enriches ten thousand generations,


  yet he has no affection for the people.


  One who seeks to share his happiness with others is not a sage.


  One who displays his feelings is not benevolent.


  One who waits for Heaven is not a wise man.


  The noble who cannot harmonize the good and the destructive is not a scholar.


  One who seeks for fame and thereby loses his real self is no gentleman.


  One who loses his true self and his path is unable to command others.


  Men such as Hu Pu Chieh, Wu Kuang, Po Yi, Shu Chi, Chi Tzu, Hsu Yu, Chi To, Shen
  Tu Ti


  28


  –


  all followed the example of others,


  tried to get for them what they desired


  but they did not seek for themselves what they desired.


  The true man of old appeared aloof but was in no danger of falling.


  He appears deficient, yet takes nothing.


  He does what he wills but is not judgemental.


  His emptiness was clear, but there was no showing off.


  Cheerfully smiling, he seemed to be content.


  He responded immediately as if there was no choice.


  If upset, he showed it.


  If content, he was at ease with Virtue.


  When calm, he appeared to be one with the world.


  When superior, the world had no control over him.


  His inner nature seemed unknowable.


  Never being really aware, he forgot what to say.


  He saw the law as the external form of government.


  The rituals he saw as the wings,


  knowledge as being the same as what is appropriate at the time.


  Virtue he saw as what is proper.


  Viewing law as the external form of government,


  he was flexible in imposing the death sentence.


  Viewing the rituals as the wings,


  he got on well with society.


  Viewing knowledge as being that which is appropriate,


  he followed the natural course of events.


  Viewing virtue as that which is proper,


  he walked along with others who were capable of leading.


  So he acted spontaneously,


  but others thought it was at great cost.


  Thus all that he sought was one.


  What he disowned was also but one.


  What is one is one, and what is not one is also one.


  In the one, he was with Heaven.


  In the not-one, he was one with humanity.


  When heaven and humanity are not in dispute,


  then we can say this is really the true man.


  Death and birth are fixed. They are as certain as the dawn that comes after the
  night, established by the decree of Heaven. This is beyond the control of humanity,
  this is just how things are. Some view Heaven as their father and continue to love
  it. How much more should they show devotion for that which is even greater!


  Some people consider their lord as being better than themselves and would willingly
  the for him. How much more should they do the same for one who is more true than
  their lord!


  When the springs dry out, the fish are found stranded on the earth. They keep each
  other damp with their own moisture, and wet each other with their slime. But it
  would be better if they could just forget about each other in rivers and lakes.
  People sing the praises of Yao and condemn Chieh, but it would be better if they
  could forget both of them and just follow the Tao. The cosmos gives me the burden
  of a physical form, makes life a struggle, gives me rest in old age and peace in
  death. What makes life good, therefore, also makes death good.


  A boat can be hidden in a gorge, and a fishing net in a pool, and you may think
  they are therefore safe. However, in the middle of the night a strong man comes
  and carries them off. Small-minded people just cannot see that hiding smaller things
  in larger things does not mean they will not be stolen. If you take everything under
  Heaven and try to store it under Heaven, there is no space left for it to be lost
  in! This is the real truth about things. To have a human form is a joyful thing.
  But in the universe of possible forms, there are others just as good. Isn’t it a
  blessing to have these uncountable possibilities! The sage goes where nothing escapes
  him, and rests contented there with them. He takes pleasure in an early death, in
  old age, in the origin and in the end and sees them all as equally good – he should
  be an example to others. If this is so, then how much more should our example be
  that which holds together the whole of life and which is the origin of all that
  changes!


  The great Tao has both reality and expression, but it does nothing and has no form.


  It can be passed on, but not received.


  It can be obtained, but not seen.


  It is rooted in its own self, existing before Heaven and Earth were born, indeed
  for eternity.


  It gives divinity to the spirits and to the gods.


  It brought to life Heaven and Earth.


  It was before the primal air, yet it cannot be called lofty;


  it was below all space and direction, yet it cannot be called deep.


  It comes before either Heaven or Earth, yet it cannot be called old.


  It is far more ancient than antiquity, yet it is not old.


  Hsi Wei


  29


  obtained it, and with it he framed Heaven and Earth.


  Fu Hsi obtained it and through it he entered into the Mother of life’s breath.


  The Great Dipper constellation obtained it and from of old has never wavered.


  The Sun and Moon obtained it and from of old have never ceased.


  Kan Pi obtained it and was able to enter the Kun Lun mountains.


  Feng Yi obtained it and was able to journey to the great river.


  Chien Wu obtained it and was able to live on Mount Tai.


  The Yellow Emperor obtained it and was able to ascend into the clouds of Heaven.


  Chuan Hsu obtained it and was able to dwell in the Dark Palace.


  The Queen Mother of the West


  30


  obtained it and was able to take her seat on Shao Kuang Mountain –


  no one knew her origin, no one knows her end.


  Peng Tsu obtained it and was able to live from the time of Shun to that of the Five
  Lords.


  Fu Yueh obtained it and was able to become the Prime Minister of Wu Ting,


  so he controlled all under Heaven.


  Then, riding upon one constellation, he climbed upon another and soared to the Milky
  Way to dwell as a star.


  Nan Po Tzu Kuei said to Nu Chu, ‘Master, you are old, yet your appearance is one
  of youthfulness. Why is this?’


  The reply came, ‘I have studied the Tao.’


  ‘Can I study how to obtain the Tao?’


  The reply was, ‘Definitely not! Most definitely not! You are not the kind of man
  who could do this.


  ‘Now there was Pu Liang Yi, who had the genius of a sage but not the Tao. I have
  the Tao, but not the genius. I wanted to teach him in order that he might become
  a sage. It seemed as if teaching the Tao to a man of genius would be easy. But no!
  I taught him for three days and he was able to ignore worldly matters. Having dispensed
  with worldly matters, I continued to teach him for seven days, so that he was able
  to ignore all external matters. Having disposed of all external matters, I continued
  to teach him for nine days, whereupon he could observe his own being as irrelevant.
  Having discerned his own self as irrelevant, he saw with true clarity. Having seen
  with true clarity, he could see by the One. Seeing by the One, he could ignore both
  past and present. Having ignored both past and present he was able to enter where
  there is neither death nor birth. The end of life is not death, and the coming to
  birth is not life. He could follow anything, he could receive anything. To him,
  all was being destroyed, all was being built. This is known as Tranquillity in Struggle.
  Tranquillity in Struggle means perfection.’


  Na Po Tzu Kuei said, ‘Master, where did you learn this?’


  ‘I learned it through the medium of the spirit of writing; writing learned it from
  the offspring of continuous study; continuous study learned it from clarity of vision;
  clarity of vision heard it from quiet agreement; quiet agreement from being used;
  being used from great enjoyment; great enjoyment from deepest mystery; deepest mystery
  from absorption in mystery; absorption in mystery from the ultimate.’


  The Masters, Ssu, Yu, Li and Lai, said one to another, ‘Anyone who can conceive
  of nothingness as his head, life as his back and death as his tail and who knows
  that death and birth, being and no-being, are one and the same – one like this shall
  be our friend.’ The four men smiled and agreed in their hearts and therefore became
  friends.


  Shortly after, Master Yu fell ill. Master Ssu went to visit him and Yu said, ‘How
  great is the Maker of All! He has made me


  deformed. My back is like a hunchback’s, and all my organs are on top while my chin
  is lost in my navel and my shoulders rise up above my head and my topknot points
  to Heaven!’ His yin and yang were in disarray. However, his heart was calm and he
  was not worried. He limped to a well and looked in at his reflection and said, ‘Goodness
  me! The Maker of All has made me completely deformed!’


  ‘Do you dislike it?’ asked Master Ssu.


  ‘Not really, why should I? For example, perhaps my left arm will become a cockerel
  and then I shall be able to tell the time at night. Maybe, eventually, my right
  arm will become a crossbow and then I can hunt a bird and eat it. Possibly my bottom
  will become wheels and my soul will be a horse which I shall climb upon and go for
  a ride. After all, I wouldn’t then need any other vehicle again! I obtained life
  because the time was right. I will lose life because it is time. Those who go quietly
  with the flow of nature are not worried by either joy or sorrow. People like these
  were considered in the past as having achieved freedom from bondage. Those who cannot
  free themselves are constrained by things. However, nothing can overcome Heaven
  – it has always been so. So why should I dislike this?’


  Later Master Lai fell ill. Gasping and heaving, he lay close to death. His wife
  and children were mourning around him. Master Li came to see him and Master Lai
  said, ‘Hush, get out! Do you want to disrupt the processes of change?’


  Leaning against the doorway Li commented,


  ‘How great is the Maker of All!


  What will you be made into next?


  Where will you be sent?


  Will you come back as a rat’s liver?


  Or will it be as a pest’s arm?’


  Master Lai said,


  ‘When a mother and father tell a child to go somewhere,


  be that east, west, south or north, the child obeys.


  Yin and yang are the mother and father of humanity.


  They have brought me close to death


  and if I disobey this would be just perversity.


  My death is not their problem!


  The cosmos gives me form, brings me to birth,


  guides me into old age and settles me in death.


  If I think my life good, then I must think my death good.


  A good craftsman, casting metal,


  would not be too pleased with metal that jumped up and said,


  “I must be made into a sword like Mo Yeh.”


  31


  Now, given that I have been bold enough


  to take on human shape already, if I then said,


  “I must be a human, I must be a human!”,


  the Maker of All would view me somewhat askance!


  If Heaven and Earth are like a furnace and Nature is the craftsman,


  then is it possible he could send me anywhere that was not appropriate?


  Peacefully we die, calmly we awake.’


  Masters Sang Hu, Meng Tzu Fan and Chin Chang, three good friends, said to each other,


  ‘Who can be together without any being together,


  or collaborate with others without any collaboration?


  Who can ascend to Heaven, ride the clouds, journey through the infinite,


  and forget about existence for ever and ever?’


  The three men looked at each other and smiled, agreeing in their hearts with one
  another and becoming firm friends.


  Some time later Master Sang Hu died. Before he was buried, Confucius heard of his
  death and sent Tzu Kung to participate in the rituals. On arrival, Tzu Kung found
  one of the dead man’s


  friends was making up songs while the other played a lute. Together they sang,


  ‘Woe! Sang Hu! Woe! Sang Hu!


  You have returned to the true form,


  while we are still but men!’


  Tzu Kung hurried forward and said, ‘Is it really seemly and proper to sing before
  a dead body?’


  The two men looked at him, laughed and said, ‘What does a man like this know about
  proper ceremony?’


  Tzu Kung went back to Confucius, told him what had happened, and asked, ‘What kind
  of people are they? They are uncouth and pay no heed to their external appearance.
  They sing in the presence of a dead body without any change of face! There is no
  appropriate title for them. What kind of people are they?’


  Confucius said, ‘They go beyond the human world, while I travel within. That beyond
  and that within can never meet. It was a mistake to send you to join the mourning.
  They have truly become one with the Maker of All and now wander as the original
  breath of Heaven and Earth. They view life as a grotesque tumour, a swelling they
  inhabit. They view death as the removal of this growth. Since they see life like
  this, they simply do not consider whether death or birth comes first. They view
  their bodies as just so many collected different pieces. They forget their liver
  and gall and ignore their ears and eyes. They begin and cease without knowing what
  is beginning or ceasing. Unaware, they wander beyond the mundane world and stroll
  in the world of non-action. Why should they have to worry about proper conduct just
  to please ordinary people?’


  ‘In that case, Master,’ said Tzu Kung, ‘why do you conform to convention?’


  ‘I am one punished by Heaven,’ said Confucius. ‘Nevertheless, this is what I will
  share with you.’


  ‘Can you tell me a little more?’ said Tzu Kung.


  ‘Fish enjoy water, humans enjoy the Tao. Enjoying water, the fish stick to the pond
  and find all they need to survive there. Enjoying the Tao, people do nothing and
  their lives are fulfilled.


  The saying goes that fish forget about each other in the pond and people forget
  each other in the Tao.’


  Tzu Kung said, ‘May I ask about the man alone?’


  ‘The man alone is only alone when compared to others, but he is alongside Heaven.
  It is said that the mean-minded man of Heaven is a nobleman amongst ordinary people
  and the nobleman is a mean-minded man of Heaven.’


  Yen Hui asked Confucius, ‘When Meng Sun Tsai’s mother died, he cried without tears,
  there was no distress in his heart. When he mourned, there was no sorrow. Although
  he was deficient on these three points, nevertheless he is renowned throughout the
  state of Lu for his excellence as a mourner. Is it possible to obtain such a reputation,
  even when there is nothing to substantiate it? I find this very surprising.’


  ‘Master Meng Sun Tsai did what was right,’ said Confucius. ‘He was far beyond mundane
  understanding. He could have restricted his actions even more but that was not really
  feasible. Nevertheless, he did cut out a great deal. Meng Sun Tsai does not know
  how he came to be born, nor how he will die. He just knows enough not to want one
  or the other. He doesn’t know why he should continue, he just follows what happens
  without understanding! As we are all in a process of change, how can we know what
  unknown thing we will be changed into? As what we are changing into has not yet
  happened, how can we understand what change is? Perhaps you and I are in a dream
  from which we are yet to awake! In Meng Sun Tsai’s case the body changes but this
  does not affect his heart. His body, housing his soul, may be affected, but his
  emotions are not harmed. Meng Sun Tsai alone has awoken. People cry, so he cries.
  He considers everything as his own being. How could he know that others call something
  their own particular self? You dream you are a bird and rise into the Heavens. You
  dream you are a fish and swim down deep into the lake. We cannot tell now if the
  speaker is awake or asleep. Contentment produces the smile; a genuine smile cannot
  be forced. Don’t struggle, go with the flow and you will find yourself at one with
  the vastness of the void of Heaven.’


  Yi Erh Tzu went to visit Hsu Yu, who asked him, ‘In what way has Yao been helpful
  to you?’


  Yi Erh Tzu said, ‘Yao said to me, “Practise benevolence and justice. Speak up for
  what is right and against what is wrong.” ’


  Hsu Yu said, ‘So why have you troubled yourself to visit me? Master Yao has already
  branded on you the practice of benevolence and justice and mutilated you with the
  distinction between right and wrong. So how can you now expect me to help you meander
  alone in freedom and aimlessness, enjoying things as they happen through the process
  of change?’


  ‘Maybe that is so,’ said Yi Erh Tzu, ‘but I’d like to find some small corner for
  myself.’


  Hsu Yu said, ‘No, it can’t be done! If you have been blinded, it is impossible to
  appreciate beauty of face or form. Eyes with no pupils cannot see the beauty of
  fine, coloured silks.’


  Yi Erh said, ‘Wu Chuang paid no attention to her looks; Chu Liang ignored his strength;
  the Yellow Emperor disregarded his wisdom – all these were transformed by being
  worked upon. How can you know that the Maker of All will not remove the mark of
  my branding, heal my mutilation and, having thus restored me, enable me to follow
  you as my teacher?’


  ‘Well!’ said Hsu Yu. ‘You never know. I will just tell you the basic outline of
  the teachings.


  ‘Oh my Master, oh my Master!


  He judges all life but doesn’t believe himself to be a judge.


  His blessings extend to all life, but he doesn’t see himself as blessed.


  Older than antiquity, yet not old.


  Overarching Heaven, carrying Earth and forming all things, he is no craftsman.


  It is through him that I wander.’


  Yen Hui said, ‘I’m getting better.’


  Confucius said, ‘What do you mean?’


  ‘I have forgotten kindness and justice.’


  ‘Fine, but that is not enough.’


  On another occasion, they met again and Yen Hui said, ‘I’ve improved.’


  Confucius said, ‘What do you mean?’


  ‘I have forgotten rituals and music.’


  ‘Good, but that is still not enough.’


  On another occasion they met and Yen Hui said, ‘I’m getting better.’


  Confucius said, ‘What do you mean?’


  ‘I can sit right down and forget everything.’


  Confucius was certainly disturbed by this and said, ‘What do you mean by sit right
  down and forget?’


  Yen Hui replied, ‘My limbs are without feeling and my mind is without light. I have
  ignored my body and cast aside my wisdom. Thus I am united with the Tao. This is
  what sitting right down and forgetting is.’


  Confucius said, ‘If you are one with the great Way, then you no longer have preferences.
  If you are one with the cosmos, you are transformed. If this is what you have done,
  then I would like to follow you.’


  Masters Yu and Sang were friends. It happened to rain for ten days, and Master Yu
  said, ‘Master Sang may be in trouble!’ So he packed some food to take to him. Arriving
  at Master Sang’s door he heard strange noises and someone playing a lute, singing,


  ‘Oh Father! Oh Mother! Oh Heaven! Oh humanity!’


  It sounded as if the singer’s voice was about to break and the singer was rushing
  to finish the verse. Master Yu entered and said, ‘Master, why are you singing like
  this?’


  He said, ‘I was trying to work out what has reduced me to this. My father and mother
  wouldn’t want me to be so poor, surely? Heaven treats all alike. Earth supports
  all alike. Heaven and Earth wouldn’t wish me poor, would they? I seek to know who
  has done this, but I can’t find an answer. When you come down to it, it must be
  simply fate.’'
