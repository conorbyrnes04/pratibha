section: chapter 13
chapter_number: 13
title: The Tao of God.
sanskrit: '天道運而無所積，故萬物成；

  帝道運而無所積，故天下歸；

  聖道運而無所積，故海內服。

  明於天，通於聖，六通四辟於帝王之德者，其自為也，昧然無不靜者矣！

  聖人之靜也，非曰靜也善，故靜也；

  萬物無足以鐃心者，故靜也。

  水靜則明燭鬚眉，平中準，大匠取法焉。

  水靜猶明，而況精神！

  聖人之心靜乎！

  天地之鑒也，萬物之鏡也。

  夫虛靜恬淡寂漠無為者，天地之平而道德之至也。

  故帝王聖人休焉。

  休則虛，虛則實，實則倫矣。

  虛則靜，靜則動，動則得矣。

  靜則無為，無為也，則任事者責矣。

  無為則俞俞。

  俞俞者，憂患不能處，年壽長矣。

  夫虛靜恬淡寂漠無為者，萬物之本也。

  明此以南鄉，堯之為君也；

  明此以北面，舜之為臣也。

  以此處上，帝王天子之德也；

  以此處下，玄聖素王之道也。

  以此退居而閒遊江海，山林之士服；

  以此進為而撫世，則功大名顯而天下一也。

  靜而聖，動而王，無為也而尊，樸素而天下莫能與之爭美。

  夫明白於天地之德者，此之謂大本大宗，與天和者也；

  所以均調天下，與人和者也。

  與人和者，謂之人樂；

  與天和者，謂之天樂。

  莊子曰：「吾師乎，吾師乎！

  (上敕下韭)萬物而不為戾，澤及萬世而不為仁，長於上古而不為壽，覆載天地、刻雕眾形而不為巧。

  」此之謂天樂。

  故曰：「知天樂者，其生也天行，其死也物化。

  靜而與陰同德，動而與陽同波。

  」故知天樂者，無天怨，無人非，無物累，無鬼責。

  故曰：「其動也天，其靜也地，一心定而王天下；

  其鬼不祟，其魂不疲，一心定而萬物服。

  」言以虛靜推於天地，通於萬物，此之謂天樂。

  天樂者，聖人之心，以畜天下也。

  」夫帝王之德，以天地為宗，以道德為主，以無為為常。

  無為也，則用天下而有餘；

  有為也，則為天下用而不足。

  故古之人貴夫無為也。

  上無為也，下亦無為也，是下與上同德。

  下與上同德則不臣。

  下有為也，上亦有為也，是上與下同道。

  上與下同道則不主。

  上必無為而用天下，下必有為為天下用。

  此不易之道也。

  故古之王天下者，知雖落天地，不自慮也；

  辯雖雕萬物，不自說也；

  能雖窮海內，不自為也。

  天不產而萬物化，地不長而萬物育，帝王無為而天下功。

  故曰：莫神於天，莫富於地，莫大於帝王。

  故曰：帝王之德配天地。

  此乘天地，馳萬物，而用人群之道也。

  本在於上，末在於下；

  要在於主，詳在於臣。

  三軍五兵之運，德在末也；

  賞罰利害，五刑之辟，教之末也；

  禮法度數，形名比詳，治之末也；

  鐘鼓之音，羽旄之容，樂之末也；

  哭泣衰絰，隆殺之服，哀之末也。

  此五末者，須精神之運，心術之動，然後從之者也。

  末學者，古人有之，而非所以先也。

  君先而臣從，父先而子從，兄先而弟從，長先而少從，男先而女從，夫先而婦從。

  夫尊卑先後，天地之行也，故聖人取象焉。

  天尊，地卑，神明之位也；

  春夏先，秋冬後，四時之序也；

  萬物化作，萌區有狀；

  盛衰之殺，變化之流也。

  夫天地至神，而有尊卑先後之序，而況人道乎！

  宗廟尚親，朝廷尚尊，鄉黨尚齒，行事尚賢，大道之序也。

  語道而非其序者，非其道也；

  語道而非其道者，安取道哉！

  是故古之明大道者，先明天而道德次之，'
