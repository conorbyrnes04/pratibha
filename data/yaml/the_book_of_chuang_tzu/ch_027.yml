translation: 'Of language put into other people''s mouths, nine tenths will succeed. Of language based upon weighty authority, seven tenths. But language which flows constantly over, as from a full goblet, is in accord with God. When language is put into other people''s mouths, outside support is sought. Just as a father does not negotiate his son''s marriage; for any praise he could bestow would not have the same value as praise by an outsider. Thus, the fault is not mine, but that of others. To that which agrees with our own opinions we assent; from that which does not we dissent. We regard that which agrees with our own opinion as right. We regard that which differs from our opinion as wrong. Language based on weighty authority is used to bar further argument. The authorities are our superiors, our elders in years. But if they lack the requisite knowledge and experience, being our superiors only in the sense of age, then they are not our superiors. And if men are not the superiors of
  their fellows, no one troubles about them. And those about whom no one troubles are merely stale. Because it spreads out on all sides, it endures for all time. Without language, contraries are identical. The identity is not identical with its expression: the expression is not identical with its identity. Therefore it has been said, Language not expressed in language is not language. Constantly spoken, it is as though not spoken. Constantly unspoken, it is not as though not spoken. From the subjective point of view, there are possibilities and impossibilities, there are suitabilities and unsuitabilities. This results from the natural affinity of things for what they are and their natural antagonism to what they are not. For all things have their own particular constitutions and potentialities. Nothing can exist without these. But for language that constantly flows over, as from a full goblet, and is in accord with God, how should the permanent be attained? All things spring from germs.
  Under many diverse forms these things are ever being reproduced. Round and round, like a wheel, no part of which is more the starting-point than any other. This is called the equilibrium of God. And he who holds the scales is God.'
