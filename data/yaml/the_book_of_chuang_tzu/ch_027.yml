resonances:
- citation: Yoga Spandakarika — Third Flow
  resonance: 'Both texts locate efficacy beyond linguistic utterance: Chuang Tzu observes that language placed in others'' mouths succeeds nine-tenths of the time (implying a gap between word and reality), while Yoga Spandakarika asks ''what use are words?'' when absolute desire pervades everything—both suggesting that true power operates in a register prior to or independent of speech.'
  divergence: Chuang Tzu treats language pragmatically as a tool whose success rate reveals the gap between sign and world, whereas Yoga Spandakarika dismisses words as unnecessary once non-dual consciousness is actualized; the former is epistemological, the latter soteriological.
  passage_id: yoga_spandakarika.sp_43
- citation: Siva Sutra — Śāmbhavopāya
  resonance: 'Both texts locate the origin of manifest appearance in the heart as a generative locus: Chuang Tzu''s language succeeds when placed in others'' hearts (the seat of reception and resonance), while Siva Sutra traces all appearances to ''the collision of mind in the heart''—both making the heart the threshold where potentiality becomes actualized form.'
  divergence: Chuang Tzu emphasizes the heart as the receptive site where external language takes root and propagates, whereas Siva Sutra posits the heart as the site of ontological generation itself (mind-collision producing dream-like reality); one is communicative, the other cosmological.
  passage_id: siva_sutra.ss_i_15
