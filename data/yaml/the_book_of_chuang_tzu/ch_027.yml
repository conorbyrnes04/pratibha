title: Supposed Words
sanskrit: ''
transliteration: ''
translation: 'Supposed words constitute nine-tenths of discourse, quotes make up seven
  tenths and flowing words are brought forth every day, refined by the influence of
  Heaven.


  Supposed words which constitute nine-tenths are similar to people who are brought
  in from outside. For example, no father is used as a reference for his son, for
  the father cannot be as objective as someone not of the family. It is not my fault
  but the fault of other people (who otherwise wouldn’t listen to me), for otherwise
  people would only pay attention to what they already know and dismiss anything else.
  Thus they say that whatever agrees with them is right, but whatever they dislike
  they call wrong.


  Quotes make up seven-tenths and are there to stop arguments, which they do because
  they are respected as the words of sagacious elders. However, those who are old
  but have not grasped the warp and weft, the root and branch of things cannot be
  quoted as sagacious elders. A person like this hasn’t understood the Tao. Nor has
  he understood the Tao of humanity. He is just a sad remnant of another time.


