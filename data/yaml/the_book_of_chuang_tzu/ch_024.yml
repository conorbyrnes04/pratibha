commentary: 'Through the kind offices of Nu Shang, Hsu Wu Kuei was able to see Marquis
  Wu of Wei. Marquis Wu greeted him fondly saying, ‘Sir, you are unwell! The rigours
  of living in the wild mountain forests have been so great, and yet you have been
  kind enough to come and see me.’


  To this Hsu Wu Kuei replied, ‘I have come to comfort you, Sir, not for you to comfort
  me! Now, Sir, if you persist in sating your sensual appetites and desires and engaging
  in likes and dislikes, then you will adversely affect your true innate nature and
  your destiny. And if, Sir, you try to desist from sating your appetites and desires
  and make yourself change your likes and dislikes, then your ears and eyes will be
  afflicted. I have come to comfort you, and you, Sir, wish to comfort me!’


  Marquis Wu looked very scornful and made no reply.


  A little later Hsu Wu Kuei said, ‘Let me tell you, Sir, how I judge dogs. The lowest
  kind of dog grabs his food, gorges himself and then stops, having the virtues of
  a fox. The ordinary sort of dog is always staring arrogantly at the sun. The most
  superior kind of dog appears to have forgotten himself. That is how I judge dogs,
  but that is nothing in comparison with how I judge horses. I judge horses by whether
  they run straight as a line, or curve round holding the centre, or turn as on a
  T-square, or circle like a compass. Such a horse I describe as being indeed a national
  horse, but not an international horse. A truly international horse is complete.
  He looks anxious, he appears to lose his way, to forget himself. However, a horse
  like this suddenly prances along or rushes past, kicking up the dust, and no one
  knows where he has gone.’


  The Marquis was very pleased, and laughed.


  Hsu Wu Kuei came out and Nu Shang said, ‘Sir, what did you discuss with the ruler?
  When I discuss with him, I do so in a roundabout way using the


  Book of Poetry


  and the


  Book of History


  , and in this way I can discuss rituals and music. More directly, I use the Golden
  Tablets and the Six Bow Cases, and so guide him in decisions which have been very
  successful. Yet in all our meetings I have never seen him smile. So what is it that
  you discuss that makes him so pleased?’


  ‘I simply explained how I judge dogs and horses,’ said Hsu Wu Kuei.


  ‘That was it?’


  ‘Have you never heard of the exile from Yueh?’ said Hsu Wu Kuei. ‘A few days after
  leaving the country he was delighted if he met someone he had known in the country.
  A month after leaving the country he was delighted if he met someone he had seen
  in the country. A year after leaving the country he was delighted to meet someone
  who just looked as if he came from the country. The longer he was absent from his
  country, the more fond of it he became, is this not so? Those people who have retreated
  into the wild valleys where thick bushes block the path of even the weasels, and
  who have to struggle to move around, are delighted if they hear even the sound of
  a human footstep. How much more delighted are they if they hear the sounds of their
  own brothers and family talking and laughing beside them. Perhaps it has been rather
  a long time since a true man has sat and talked with your ruler!’


  Hsu Wu Kuei went to see Marquis Wu, who said, ‘Sir, you have been living in the
  forests of the mountains for a long time, surviving on acorns and chestnuts, filling
  yourself with onions and herbs and totally ignoring me! Now, is it old age? Do you
  want to eat meat and drink wine? Or have you come here to bless our altars of the
  Earth and the harvest?’


  ‘Sir,’ said Hsu Wu Kuei, ‘I have lived in poverty and have never been able to eat
  or drink at Your Lordship’s table, but I have come to bring comfort to you.’


  ‘Really! Comfort me?’ said the ruler.


  ‘I wish to comfort both your body and your spirit.’


  ‘What do you mean?’


  ‘Heaven and Earth sustain all things,’ said Hsu Wu Kuei. ‘No matter how high you
  get, you should never consider that this shows you to be better. No matter how low
  you get, you should never consider that this shows you to be useless. You are ruler
  of the tens of thousands of chariots, the only ruler who taxes all the people of
  this country in order to satisfy the desires of your senses, even though your spirit
  does not wish to do this. The spirit prefers goodness and harmony and does not like
  wild living. Wild living is like an illness and this is what I have to comfort you
  over. What do you think of this, Sir?’


  ‘Sir, I have wanted to see you for some time,’ replied Marquis Wu. ‘I wish to love
  the people and to act righteously and stop warfare. Would that do?’


  ‘Certainly not. Loving the people is the beginning of harming the people. To act
  righteously and to cease warfare is the root of increased warfare. If you set about
  things thus, Sir, you will not succeed. All attempts to create beauty end in evil
  consequences. Your Grace may plan to act benevolently and righteously, but the result
  is the same as hypocrisy! You may give shape to things, but success leads to argument
  and argument leads to violence. Your Grace must not have hosts of troops massing
  in your forts nor lines of cavalry parading in front of the Palace of the Dark Shrine.


  ‘Do not harbour thoughts that betray your best interests. Do not try to overcome
  others by cunning. Do not try to conquer others through plots. Do not try to defeat
  others by battle. If I kill the leaders and people of another ruler and seize the
  lands to satisfy my material wants, while my spirit is unsure of the validity of
  such actions, what is the point? Your Grace, the best thing is to do nothing, except
  develop true sincerity and thus be able to respond without difficulty to the true
  nature of Heaven and Earth. Thus the people will not die and it will not be necessary
  for you to have to enforce the end of warfare!’


  The Yellow Emperor went to see Great Kuei at Chu Tzu Mountain. Fang Ming was the
  driver and Chang Yu travelled beside him. Chang Jo and Hsi Peng guided the horses
  and Kun Hun and Ku Chi rode behind the carriage. When they eventually arrived


  in the wild region of Hsiang Cheng, the seven sages were all confused and couldn’t
  find anyone to ask the way.


  They came upon a boy leading horses and asked him the way, saying, ‘Do you know
  how to get to Chu Tzu Mountain?’


  ‘Certainly,’ he said.


  ‘Do you know where Tai Kuei lives?’


  ‘Certainly.’


  ‘What a remarkable lad!’ said the Yellow Emperor. ‘Not only does he know how to
  reach Chu Tzu Mountain, he also knows where Tai Kuei lives. I would like to ask
  you how to govern everything below Heaven.’


  ‘Governing everything below Heaven is surely the same as what I am doing at the
  moment, what’s so hard about that?’ said the lad. ‘When I was younger, I liked to
  wander within the confines of the six directions but my eyesight began to fail.
  A wise elderly gentleman told me, “Climb up and ride in the carriage of the sun
  and explore the wild region of Hsiang Cheng.” Now my eyesight is better and I am
  able to wander beyond the borders of the six directions. Ruling everything under
  Heaven is just like this. So what’s the big problem?’


  ‘Ruling everything under Heaven is, I agree, not your problem, my boy,’ said the
  Yellow Emperor. ‘However, I would like to hear how to do it.’


  The lad did not answer. So the Yellow Emperor asked again. The boy said, ‘Governing
  everything below Heaven is surely rather like leading horses! Get rid of anything
  that might harm the horses!’


  The Yellow Emperor bowed twice to him, called him his Heavenly Master and departed.


  If philosophers cannot see the effect of their ideas, they are not happy.


  If debaters cannot argue cogently, they are not happy.


  If interrogators cannot find candidates for criticism, they are not happy.


  All of these are restrained by such attitudes.


  Those scholars who are noticed by their generation rise to power.


  Those who win the affections of the people consider high office a reward.


  Those with great strength enjoy a challenge.


  Those who are brave and fearless revel in troubles.


  Those skilled in sword and spear look for wars.


  Those who are retiring rest on the laurels of their fame.


  Those who are lawyers want more power to legislate.


  Those who perform rituals and ceremonies enjoy their status.


  Those who like benevolence and righteousness like to be able to display them.


  Farmers who cannot weed their fields are not contented.


  The merchant who cannot trade at the market or by the well is not satisfied.


  The common folk like to have work to do from sunrise to sunset, as they keep each
  other going.


  The various craftsmen like to be using their skills.


  If his wealth does not grow, the greedy man is unhappy.


  If he is not getting more powerful, the ambitious man is distressed.


  Such people, driven by circumstance, are only happy when things are changing, and
  when an opportunity arises, they inevitably throw themselves into it. So they all
  proceed, like the changes of the seasons, unchanging even though others change.
  They drive their bodies and their innate nature and are overwhelmed by the forms
  of life, never turning themselves back, which is sad!


  Chuang Tzu said, ‘An archer, not bothering to take aim, by sheer luck hits the centre
  of the target. We could call him a good archer, but in that case, everyone in the
  world could be called a Yi the Archer, isn’t that right?’


  ‘OK,’ said Hui Tzu.


  Chuang Tzu said, ‘People differ over what they consider to be right, but everyone
  knows what they think is right. So everyone in the world could be called a Yao,
  isn’t that right?’


  ‘OK,’ said Hui Tzu.


  Chuang Tzu said, ‘So, there are four schools – the Literati, Mohists, Yangists and
  Pingists – which along with your own, Sir,


  make five. So which of these is right? Perhaps it is more like the case of Lu Chu?
  One of his followers said, “I have taken hold of your Tao, Master, and I can heat
  the pot in winter and make ice in summer.” Lu Chu said, “But this is surely just
  using yang for yang and yin for yin. This is not what I would call the Tao. I will
  show you my Tao.” So he tuned up two lutes and put one in the hall and the other
  in a private apartment. On striking the note Kung on one, the Kung note vibrated
  on the other. Likewise with the Chueh note, for the instruments were in harmony.
  Then he re-tuned one so that it was not in harmony with any of the five key notes.
  When this was played, all twenty-five of the strings on the other one vibrated,
  all faithful to their own note and all set off by the one note on the other lute.
  So, if you insist you are right, aren’t you like this?’


  Hui Tzi replied, ‘The followers of Confucius, Mo, Yang and Ping,


  87


  like to tackle me in debate, each one trying to defeat the other, each violently
  trying to shout me down with their various arguments – but they haven’t succeeded
  yet. So what about that?’


  Chuang Tzu said, ‘A citizen of Chi, not concerned by any mutilation,


  88


  sold his son to someone in Sung, where he became a gatekeeper. Yet this same man
  would go to great lengths to protect any of his bells or chimes. But he would not
  go looking for his son beyond the borders of his own country, such was his understanding
  of what is worthwhile! Or what if that well-known character, the citizen of Chu
  who was maimed and a gatekeeper, at midnight in another country, were to pick a
  fight with a boatman? Then he would never get across the river and would only have
  provoked the boatman’s anger.’


  Chuang Tzu was following a funeral when he passed by the grave of Hui Tzu. He looked
  round at those following him and said, ‘The man of Ying had on the end of his nose
  a piece of mud as small as a fly’s wing. He sent for the craftsman Shih to cut it
  off. Shih swirled his axe around and swept it down, creating such a


  wind as it rushed past that it removed all trace of the mud from the man of Ying,
  who stood firm, not at all worried. The ruler Yuan of Sung heard of this and called
  craftsman Shih to visit him.


  ‘ “Would you be so kind as to do this for me?” he said.


  ‘Craftsman Shih replied, “Your servant was indeed once able to work like that, but
  the type of material I worked upon is long since dead.”


  ‘Since the Master has died, I have not had any suitable material to work upon. I
  have no one I can talk with any longer.’


  Kuan Chung was ill and Duke Huan, hearing of this, said, ‘Father Chung, you are
  seriously ill. What if – which I had hoped I wouldn’t have to say – your illness
  gets worse? Who should I hand over government of the country to?’


  Kuan Chung replied, ‘Your Grace, who do you wish to give it to?’


  ‘Pao Shu Ya,’ said the Duke.


  ‘Not him! He is a good man, a scholar of integrity and he is honest, but he won’t
  mix with those who are not the same as him. If he ever learns of someone’s error,
  he won’t forgive him, ever. If you put him in charge of the state, he will argue
  with you and upset everyone below him. Before too long you will view him as having
  done the unforgivable.’


  ‘Then who can do this?’ said the Duke.


  The reply was, ‘If I have to say anyone, then it should be Hsi Peng who should undertake
  this. He is the sort of man who forgets his high status and who will be supported
  by those below. He is ashamed that he is not like the Yellow Emperor, and is sorry
  for those who are not like him. The one who shares his Virtue with other people
  is known as a sage, he who shares his abilities with others is known as a worthy
  man. One who uses his worthiness to oppress others will never gain their support.
  One who uses his worthiness to lower himself can never fail to win the people’s
  support. This man is hardly heard of in the country, nor does his own family have
  a great opinion of him. But as you ask me to speak, then I must say Hsi Peng.’


  The King of Wu was sailing on the Yangtze River, and he moored in order to climb
  a mountain known for its monkeys.


  When the monkeys saw him they fled in terror and hid in the bushes. However, there
  was one monkey who didn’t seem bothered in the slightest, swinging around and showing
  off before the King. The King fired an arrow at him, which the monkey simply caught
  cleverly in his hand. The King then called up his followers to join the hunt and
  soon they had the monkey trapped and killed.


  The King said to his friend Yen Pu I, ‘This monkey showed off, relied on its skills
  and was rude to me, and this resulted in its death! Be warned by this! Ah, do not
  let yourself seem arrogant to others!’ So Yen Pu I went home and began to study
  with Tung Wu, to eliminate this look of arrogance from his face, to give up happiness
  and to leave reasoning. Within three years he was praised by everyone.


  Tzu Chi of the Southern Suburb was sitting, leaning on the arm of his chair, gazing
  into Heaven and singing. Yen Cheng Tzu came in and, seeing him, said, ‘Master, you
  surpass all others. Is it true that your body can be made to look like a pile of
  dried bones and your heart be made like cold, dead ashes?’


  Tzu Chi replied, ‘I used to live in a cave in a mountain. At that time Tien Ho


  89


  came to see me for a visit, and the citizens of the kingdom of Chi congratulated
  him three times. I must have shown him who I am, since he obviously knew me. I must
  have been selling something and that is why he came to buy. If I had not displayed
  something, then how could he have known who or what I was? If I had not been selling
  something, then how could he have been able to buy anything? Oh dear! I do so pity
  those who lose themselves. I also pity those who pity others. However, I also pity
  those who pity those who pity others, but that was long ago.’


  Confucius went to Chu, and the King of Chu offered a toast in wine. Sun Shu Ao stepped
  forward and raised the wine glass in his hand and I Liao from the Southern Market
  took some wine and poured it out as a libation, saying, ‘You are like a man of old!
  They would make speeches.’


  Confucius said, ‘I have heard of speech which is without words, but I have never
  spoken it. I shall do so now. I Liao from the Southern Market played with a set
  of balls and the problems between the two houses were solved. Sun Shu Ao slept quietly,


  90


  his fan waving gently, and the men of Ying prepared for war. How I wish I had a
  beak three feet long.’


  91


  People like these follow the Tao that is not the Tao, and this discussion is the
  Argument Without Words. So it is that, when Virtue is fully integrated into the
  Tao and words stop where knowledge can know nothing more, there is perfection. The
  oneness of the Tao is beyond Virtue and what knowledge does not know is beyond what
  argument can cover. To label things as the Literati and the Mohists do is useless.


  The sea does not reject the rivers that flow into it from the east; this is great
  perfection.


  The sage holds both Heaven and Earth and his benign influence reaches out to all
  below Heaven, yet we know nothing of his background.


  So it is that he has no official title while he is alive and no eulogies when he
  is dead. His reality is not known and labels do not stick to him: this is known
  as the great man.


  A dog is not thought special just because it can bark, and no man is thought wise
  just because he can speak. Even less is he thought to be great. Anyone who thinks
  he is great is not to be counted as such, nor seen as virtuous. Nothing is greater
  than Heaven and Earth, but they do not seek greatness. One who knows what it is
  to be great does not go looking for it, does not lose it nor reject it and does
  not change his opinions in order to be great. He turns inward and finds what is
  without end. He follows the ancient ways and finds what never dies. This is the
  sincerity of the great man.


  Tzu Chi had eight sons, and he called them before him, and summoned Chiu Fang Yin
  and said, ‘Study the physiognomy of my sons and tell me which one is to be the greatest.’


  ‘Kun is the most fortunate,’ said Chiu Fang Yin.


  Tzu Chi was stunned and yet also delighted. ‘How is this?’ he said.


  ‘Kun will dine with the ruler of a kingdom and this will last all his life.’


  Tears poured from Tzu Chi’s eyes and he said unhappily, ‘What has my son done to
  deserve this?’


  ‘One who shares the table of a ruler of a kingdom brings blessings to all three
  sections of his family, and especially to his father and mother!’ said Chiu Fang
  Yin. ‘Now, Master, when I said this to you, you wept. This will disturb the fortune.
  The son is fortunate indeed, but his father is not so fortunate.’


  Tzu Chi said, ‘Yin, how do you know that this will be fortune for Kun? What you
  describe, the food and drink, only touches on the nose and the mouth, so how can
  you claim to know where such things come from? I have never been a shepherd, but
  a ewe gave birth to a lamb in the south-west corner of my fields. I have never been
  a hunter, but a flock of quail have arrived in the south-east corner of my fields.


  92


  If this isn’t strange, then what is? When I go out wandering and travelling with
  my son, we journey through Heaven and Earth. We look for pleasure in Heaven and
  we look for nourishment from Earth. He and I don’t get caught up in the affairs
  of the world, or in plots or in any strange practices. He and I ride upon the reality
  of Heaven and Earth and let nothing come between us. He and I are one in undisturbed
  unity and we not interested in doing what others think would be useful. Now you
  come and tell us that he has this crude and common “success”! In my experience,
  when something untoward happens, this is the result of something untoward having
  been done. This comes not from any action of mine nor of my son, but it must come
  from Heaven! Yes, this is what makes me weep.’


  A little while after this he sent Kun to do some work in the kingdom of Yen. While
  on the road, bandits captured him. They decided that it would be difficult to sell
  him as he was, but if they


  cut off his foot, then they could sell him easily.


  93


  They did this, and sold him in the kingdom of Chi, where, as fortune would have
  it, he became a palace official in the palace of Duke Kang and so had food to sustain
  him until the end of his days.


  Nieh Chueh bumped into Hsu Yu and said, ‘Master, where are you heading?’


  ‘I am escaping Yao.’


  ‘What do you mean?’


  Hsu Yu said, ‘Yao has become obsessed with benevolence and I am worried that he
  will be mocked throughout the world. Future generations might even resort to eating
  each other because of this! The people come together without difficulty. Give them
  love, and they will care for you, assist them, and they will rally round you, praise
  them, and they will be excited, upset them, and they will desert you. Love and assistance
  arise from benevolence and righteousness, and while some people will deny benevolence
  and righteousness, the majority look to them for assistance. Benevolence and righteousness
  conducted under these circumstances become insincere, and possibly may be evil,
  like lending traps to others. Allowing one man to determine what the world needs
  through his own powers is like trying to comprehend everything in one moment. Yao
  knows that the worthy man can assist the whole world, but he does not know that
  such a person can ruin the whole world, for it is only those outside this sphere
  of influence who can really understand.’


  You have the gullible and the weak, you have the quick and vain and you have the
  greedy and bent.


  Those who are known as the gullible and the weak study under just one master, they
  say yes to him and then feel privately smug, believing that they have understood
  all that is necessary, when in fact they have not grasped a single thing. These
  are known as the gullible and the weak.


  The quick and the vain are like lice on a pig. The lice find a place where the bristles
  are long and well-spaced and they view this as a


  great palace or vast park. They might choose the groove between the hoof or the
  area of the nipples and the thigh and in such a safe place they consider this to
  be their quiet retreat. They do not know that one morning the butcher will make
  a sweep with his arm, lay out the grass, light the fire and that then they will
  be burnt up along with the pig. Their progress is limited and their retreat is limited.
  These are known as the quick and the vain.


  The greedy and bent are similar to Shun. Mutton doesn’t want ants, but ants want
  mutton, especially when it is off. Shun was also off: this was why the hundred tribes
  were so delighted with him and followed after him. Even though he changed his place
  of residence three times, each one was counted as a capital city. When he arrived
  at the wilderness of Teng, he had a hundred thousand families with him. Yao heard
  of Shun and gave him control over the new and untamed country and said he hoped
  Shun would bring benefits to all. When Shun was given this command, he was already
  quite elderly and his hearing and eyesight were poor, but he was unable to retire
  to his home. These are known as the greedy and the bent.


  So it is that the spiritual man dislikes people crowding around him. If they insist
  on coming, he argues with them, and from this argument comes nothing of any benefit
  to anyone. Therefore, he ensures he has no attachment to anything, and nothing from
  which he is separated. Holding fast to Virtue and dwelling in harmony, he follows
  the world. This is what is known as the true man. He leaves knowledge for the ants,
  follows the style of fish and abandons the ideas of sheep.


  See using the eyes, hear using the ears, have vision using the heart. If you do
  this the course is straight as if measured using a line, the changes are congenial.
  The true man of the past waited upon Heaven when dealing with people and did not
  wait upon people when dealing with Heaven. The true man of the past obtained it
  and was born, lost it and died, obtained it and died, and lost it and was born.


  Medicines are like this. There is monkshood, ballflower, cockscomb and chinaroot.
  They each have their time when they are best suited, though to list all their uses
  would be impossible.


  Kou Chien


  94


  retreated to Mount Kuai Chi with three thousand soldiers in armoured jackets and
  carrying shields, and Minister Chung alone understood how to save the disaster-ridden
  state, but he didn’t know how to save himself from a tragic fate.


  It is said that the eye of the owl is specially adapted and the leg of the crane
  has its right proportion. To try and cut out anything from these would be disaster
  to these creatures.


  It is said that the wind blows over the river and the river is diminished. When
  the sun passes over the river, it loses something. If the sun and wind remain watching
  over the river, then the river will not be alarmed that they are doing anything
  to it, for it would continue to draw from the streams and go on its way. Water stays
  close to the earth and the shadow stays close to its source, for things stick together.


  There is danger for the eye in seeing too clearly, danger for the ear in hearing
  too sharply and danger to the heart from caring too greatly. Indeed, it is dangerous
  to use any of our faculties. If these dangers are not dealt with, then disaster
  after disaster will ensue. To turn back from this to the original state takes much
  effort and time, but people consider these faculties as their greatest treasure,
  isn’t that sad! As a result there is constant destruction of states and endless
  massacre of the people, while no one knows how to look into how this happened.


  The foot only touches a small part of the earth, yet people can travel great distances
  into the unknown.


  The knowledge of people is minor, and though minor it has to trust in that which
  they do not know, to know what is meant by Heaven. It is known as the great One,
  the great mystery, the great yin, the great eye, the great equal, the great skill,
  the great truth, the great judge. All this is perfection.


  The great One knows,


  the great mystery reveals,


  the great yin observes,


  the great eye sees,


  the great equal is the origin,


  the great skill creates it,


  the great trust touches it,


  the great judge holds fast to it.


  Heaven is in everything: follow the light, hide in the cloudiness and begin in what
  is. Do this and your understanding will be like not understanding and your wisdom
  will be like not being wise. By not being wise you will become wise later. When
  you ask questions, set no limits, even though they cannot be limitless. Although
  things seem to be sometimes going up and sometimes descending, sometimes slipping
  away, nevertheless there is a reality, the same today as in the past. It does not
  change, for nothing can affect it. Could we not say it is one great harmony? So
  why shouldn’t we ask about it and why are you so confused? If we use that which
  does not confuse to understand that which does confuse, then we can come back to
  that which does not confuse. This will be the great unconfusing.'
