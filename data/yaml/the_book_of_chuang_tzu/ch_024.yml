title: Hsu Wu Kuei
sanskrit: ''
transliteration: ''
translation: 'Through the kind offices of Nu Shang, Hsu Wu Kuei was able to see Marquis
  Wu of Wei. Marquis Wu greeted him fondly saying, ‘Sir, you are unwell! The rigours
  of living in the wild mountain forests have been so great, and yet you have been
  kind enough to come and see me.’


  To this Hsu Wu Kuei replied, ‘I have come to comfort you, Sir, not for you to comfort
  me! Now, Sir, if you persist in sating your sensual appetites and desires and engaging
  in likes and dislikes, then you will adversely affect your true innate nature and
  your destiny. And if, Sir, you try to desist from sating your appetites and desires
  and make yourself change your likes and dislikes, then your ears and eyes will be
  afflicted. I have come to comfort you, and you, Sir, wish to comfort me!’


  Marquis Wu looked very scornful and made no reply.


