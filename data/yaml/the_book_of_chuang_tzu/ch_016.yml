commentary: 'These are the people who are called the deceived and ignorant ones: those
  who seek to improve their innate nature by means of vulgar learning in order to
  return to their origin, and those who wish to control their desires by following
  vulgar ways of thinking in the hope of achieving illumination.


  The ancient ones ruled by the Tao:


  they developed their understanding in calm;


  knowledge was their life, yet they did nothing with knowledge.


  When knowledge and calm nourish each other,


  then harmony and order emerge as from innate nature.


  Virtue is harmony; the Tao is order.


  When Virtue enfolds everything, there is benevolence.


  When the Tao is set out in order, there is righteousness.


  When righteousness is clearly understood and all adhere to it, there is loyalty.


  When the centre is pure and true and returns to its proper form, there is music.


  When sincerity is articulated through the body and is expressed in style, there
  is ritual.


  However, following ritual and music in an inappropriate way will lead the whole
  world into confusion. When someone tries to correct others, his own Virtue is clouded
  over, and his Virtue will no longer reach all others. Trying to do so will destroy
  everyone’s innate nature.


  Even in chaos, the ancient ones were centred, for they were one with their generation
  and followed the paths of simplicity and


  silence. In those times, yin and yang were in harmony, ghosts and spirits did nothing
  wicked, the four seasons followed each other, all forms of life were without injury
  and no living thing suffered early death. The people had knowledge but they did
  not use it; all this was perfect Oneness. In those times no one planned anything,
  for everyone maintained constant spontaneity.


  This was the case until the time when Virtue deteriorated and then Sui Jen and Fu
  Hsi came to govern everything below Heaven, with the result that there was compliance
  but no unity. Virtue continued to deteriorate and then Shen Nung and the Yellow
  Emperor came to govern everything below Heaven, with the result that there was satisfaction
  but no compliance. Virtue continued to deteriorate and then Yao and Shun came to
  govern all below Heaven, with the result that, ruling by decrees and grand plans,
  they polluted the purity of nature and destroyed simplicity. The Tao was abandoned
  and Good substituted. Virtue was put at risk for the sake of opportunity. Then innate
  nature was abandoned and hearts allowed to determine their own way. Heart linked
  with heart through knowledge, but were unable to give the world peace. Pomp and
  ceremony were added to this knowledge. This displaced simplicity and the heart was
  swamped, resulting in the people being confused and disobedient, with no way back
  to true innate nature nor to their origin.


  Perceiving this, we can see how the world has lost the Tao, and the Tao has lost
  this world. In this sort of world, how can the Tao lead the world, or a person of
  the Tao be seen by this world, or the world come to appreciate the Tao? The Tao
  cannot direct the world, nor the world direct the Tao. Even if the sage does not
  retreat to the centre of the forest and mountains, nevertheless his Virtue is still
  hidden, whether he likes it or not.


  These hidden so-called scholars of old did not hide themselves and refuse to be
  seen. They did not close the doors on their words and refuse to let them out. They
  did not shut away their wisdom and refuse to share it. But those times were all
  haywire. If it had been possible for them to act, they could have done great things,
  bringing all to Oneness without any sign of doing so. However, the times were not
  favourable and it was not possible, so they put down


  deep roots, remained still and waited. This was the Tao by which they survived.


  The ancient ones, wishing to keep themselves alive, did not use elaborate style
  to express their knowledge. They did not disturb everything in the whole world through
  their knowledge, nor use knowledge to try and disrupt Virtue. Alone and hermit-like
  they stayed where they were and looked to restore their innate nature. What more
  could they do than this? The Tao has no place for pettiness, and nor has Virtue.
  Pettiness is dangerous to Virtue; petty actions are dangerous to the Tao. It is
  said, rectify yourself and be done. Happiness which is complete is called the Timeliness
  of Purpose.


  The ancient ones talked of the Timeliness of Purpose, but they did not mean having
  official carriages and badges of office. They simply meant that it was happiness
  so complete as to need nothing more. Today what is called Timeliness of Purpose
  means having official carriages and badges of office. Carriages and badges are of
  the body, they do not touch the innate nature. From time to time such benefits may
  come. When this happens, you cannot help it, no more than you can stop them going
  again. So having carriages and badges of office is no reason for becoming proud
  and arrogant in our purposes, nor are distress and poverty any reason for becoming
  vulgar. View both conditions as one and the same, so be free from anxiety and leave
  it at that. So if loss of what gives happiness causes you distress when it fades,
  you can now understand that such happiness is worthless. It is said, those who lose
  themselves in their desire for things also lose their innate nature by being vulgar.
  They are known as people who turn things upside down.'
