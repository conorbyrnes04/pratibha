sutra: Chuang Tzu 22
collection: The Book of Chuang Tzu
section: chapter 22
chapter_number: 22
title: Knowledge Travels North.
sanskrit: '知北游於玄水之上，登隱弅之丘，而適遭無為謂焉。

  知謂無為謂曰：「予欲有問乎若：何思何慮則知道？

  何處何服則安道？

  何從何道則得道？

  」三問而無為謂不答也。

  非不答，不知答也。

  知不得問，反於白水之南，登狐闋之上，而睹狂屈焉。

  知以之言也問乎狂屈。

  狂屈曰：「唉！

  予知之，將語若。

  」中欲言而忘其所欲言。

  知不得問，反於帝宮，見黃帝而問焉。

  黃帝曰：「無思無慮始知道，無處無服始安道，無從無道始得道。

  」知問黃帝曰：「我與若知之，彼與彼不知也，其孰是邪？

  」黃帝曰：「彼無為謂真是也，狂屈似之，我與汝終不近也。

  夫知者不言，言者不知，故聖人行不言之教。

  道不可致，德不可至。

  仁可為也，義可虧也，禮相偽也。

  故曰：「失道而後德，失德而後仁，失仁而後義，失義而後禮。

  」禮者，道之華而亂之首也。

  故曰：「為道者日損，損之又損之，以至於無為。

  無為而無不為也。

  」今已為物也，欲復歸根，不亦難乎！

  其易也其唯大人乎！

  生也死之徙，死也生之始，孰知其紀！

  人之生，氣之聚也。

  聚則為生，散則為死。

  若死生為徙，吾又何患！

  故萬物一也。

  是其所美者為神奇，其所惡者為臭腐。

  臭腐復化為神奇，神奇復化為臭腐。

  故曰：「通天下一氣耳。

  」聖人故貴一。

  」知謂黃帝曰：「吾問無為謂，無為謂不應我，非不我應，不知應我也﹔吾問狂屈，狂屈中欲告我而不我告，非不我告，中欲告而忘之也﹔今予問乎若，若知之，奚故不近？

  」黃帝曰：「彼其真是也，以其不知也﹔此其似之也，以其忘之也﹔予與若終不近也，以其知之也。

  」狂屈聞之，以黃帝為知言。

  天地有大美而不言，四時有明法而不議，萬物有成理而不說。

  聖人者，原天地之美而達萬物之理。

  是故至人無為，大聖不作，觀於天地之謂也。

  今彼神明至精，與彼百化。

  物已死生方圓，莫知其根也。

  扁然而萬物自古以固存。

  六合為巨，未離其內﹔秋豪為小，待之成體﹔天下莫不沉浮，終身不顧﹔陰陽四時運行，各得其序﹔惛然若亡而存﹔油然不形而神﹔萬物畜而不知：此之謂本根，可以觀於天矣！

  齧缺問道乎被衣，被衣曰：「若正汝形，一汝視，天和將至﹔攝汝知，一汝度，神將來舍。

  德將為汝美，道將為汝居。

  汝瞳焉如新生之犢而無求其故。

  」言未卒，齧缺睡寐。

  被衣大說，行歌而去之，曰：「形若槁骸，心若死灰，真其實知，不以故自持。

  媒媒晦晦，無心而不可與謀。

  彼何人哉！

  」舜問乎丞，曰：「道可得而有乎？

  」曰：「汝身非汝有也，汝何得有夫道！

  」舜曰：「吾身非吾有也，孰有之哉？

  」曰：「是天地之委形也﹔生非汝有，是天地之委和也﹔性命非汝有，是天地之委順也﹔子孫非汝有，是天地之委蛻也。

  故行不知所往，處不知所持，食不知所味。

  天地之強陽氣也，又胡可得而有邪！

  」孔子問於老聃曰：「今日晏閒，敢問至道。

  」老聃曰：「汝齊戒，疏瀹而心，澡雪而精神，掊擊而知。

  夫道，窅然難言哉！

  將為汝言其崖略。

  夫昭昭生於冥冥，有倫生於無形，精神生於道，形本生於精，而萬物以形相生。

  故九竅者胎生，八竅者卵生。

  其來無跡，其往無崖，無門無房，四達之皇皇也。

  邀於'
