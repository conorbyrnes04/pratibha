translation: When Knowledge travelled north, across the Black Water, and over the Dark-Steep Mountain, he met Do-nothing Say-nothing and asked of him as follows:— "Kindly tell me by what thoughts, by what cogitations, may Tao be known? By resting in what, by according in what, may Tao be approached? By following what, by pursuing what, may Tao be attained?" To these three questions, Do-nothing Say-nothing returned no answer. Not that he would not answer, but that he could not. So when Knowledge got no reply, he turned round and went off to the south of the White Water and up the Ku-chüeh Mountain, where he saw All-in-extremes, and to him he put the same questions. "Ha!" cried All-in-extremes, "I know. I will tell you...." But just as he was about to speak he forgot what he wanted to say. So when Knowledge got no reply, he went back to the palace and asked the Yellow Emperor. The latter said, "By no thoughts, by no cogitations, Tao may be known. By resting in nothing, by according in nothing,
  Tao may be approached. By following nothing, by pursuing nothing, Tao may be attained." Then Knowledge said to the Yellow Emperor, "Now you and I know this, but those two know it not. Who is right?" "Of those two," replied the Yellow Emperor, "Do-nothing Say-nothing is genuinely right, and All-in-extremes is near. You and I are wholly wrong. Those who understand it do not speak about it, those who speak about it do not understand it. "Therefore it has been said, 'If Tao perishes, then Tê will perish. If Tê perishes, then charity will perish. If charity perishes, then duty to one's neighbour will perish. If duty to one's neighbour perishes, then ceremonies will perish. Ceremonies are but a showy ornament of Tao, while oft-times the source of trouble.' The above is from the Tao-Tê-Ching, ch. xxxviii. It is interesting to note how the Yellow Emperor annihilates time by quoting a work not written until many centuries after his date. "Therefore it has been said, 'Those who practise Tao suffer
  daily loss. If that loss proceeds until inaction ensues, then by that very inaction there is nothing which cannot be done.' "Now, we are already beings. And if we desire to revert to our original condition, how difficult that is! 'Tis a change to which only the greatest among us are equal.
