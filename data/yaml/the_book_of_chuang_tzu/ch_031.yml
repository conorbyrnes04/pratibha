commentary: 'Confucius wandered through the Black Curtain Forest and sat down beside
  the Apricot Tree Altar. His followers started reading their books while Confucius
  played his lute and sang. He was not even halfway through the song when a fisherman
  stepped out of his boat and came towards him. His beard and eyebrows were white
  and his hair was wild, while his sleeves hung down beside him. He walked up the
  slopes until he reached the drier ground and then stopped, resting his left hand
  on his knee and his chin in his right hand, and listened until the song was over.
  Then he called over Tzu Kung and Tzu Lu and the two of them went to him.


  ‘Who is that?’ he said, pointing at Confucius.


  ‘He is a nobleman from Lu,’ replied Tzu Lu.


  The fisherman then enquired as to Confucius’ family. Tzu Lu replied, ‘The family
  of Kung.’


  ‘What does this man of Kung do for a living?’


  Tzu Lu was working out what to say when Tzu Kung replied, saying, ‘This man of the
  Kung family in his innate nature holds fast to loyalty and faithfulness; in his
  behaviour he shows benevolence and righteousness; he makes the rituals and music
  beautiful, and balances human relationships. He pays respect above him to the ruler
  of his generation and in his dealings with those below him he tries to transform
  the ordinary people, as he wants to bless the whole world. This is what this man
  of the Kung family does.’


  The fisherman enquired further, ‘Does he have any land over which he rules?’


  ‘No,’ said Tzu Kung.


  ‘Is he an adviser to a king?’


  ‘No.’


  The stranger laughed and backed away, saying, ‘So benevolence is benevolence, yet
  he won’t escape without harm to himself. Exhausting the heart and wearing out the
  body puts his true nature in jeopardy. Sadly, I believe he is far removed from the
  Tao.’


  Tzu Kung went up and told Confucius about this. Confucius laid aside his flute and
  stood up, saying, ‘Maybe he is a sage!’ and he went down the slope to find him.
  He reached the water’s edge as the fisherman was about to pole away. Seeing Confucius,
  he poled back again and confronted him. Confucius stepped back somewhat hastily,
  bowed twice and went forward.


  ‘What do you want, Sir?’ said the stranger.


  ‘Just now, Master, you said a few words but didn’t finish,’ said Confucius. ‘Being
  unworthy, I do not understand them. So I would like to be with you and to hear even
  just the sounds of your words in the hope that they might enlighten me!’


  ‘Oh-ho, you have a good love of study, Sir!’


  Confucius bowed twice and stood up. ‘Ever since I was little I have pursued study,
  and now here I am sixty-nine years old, yet I have never heard the perfect teaching,
  so what can I do but keep my heart open?’


  The stranger said, ‘Like seeks like and each note responds to its own. This is the
  boundary established by Heaven. I will not discuss that which concerns me, but will
  concentrate on what you need to know about. You, Sir, are wrapped up in the affairs
  of the people. The Son of Heaven, the noble princes, the great ministers and the
  common folk, when these four groups do what is right, there is the beauty of unity.
  If these four groups break apart, then there is terrible great disorder. If ministers
  do what they should and the ordinary people are concerned with what they do, then
  no one infringes upon another.


  ‘Fields in ruin, leaking roofs, lack of food and clothing, unjust taxes, disputes
  between wives and concubines, disorder between the young and the old, these are
  what trouble the common folk.


  ‘Inability to do the job, being bored by their work, bad behaviour, carelessness
  and laziness in those below, failure to succeed,


  insecurity in employment, these are what trouble the great ministers.


  ‘Lack of loyal ministers, civil war in the kingdom, workmen with no skills, tributes
  that are worthless, poor positioning at the spring and autumn gatherings, the disquiet
  of the ruler, these are what trouble the noble princes.


  ‘Yin and yang out of harmony, fluctuations in heat and cold which damage all, oppression
  and rebellion by nobles, all leading to uprisings, ravage and abuse of the people,
  the rituals badly performed, the treasury empty, social relationships in turmoil
  and the people debauched, these are what trouble the Son of Heaven and his people.


  ‘Now, Sir, at the higher end of the scale, you are not a ruler, nor a noble nor
  even a minister in a court, while at the other end you are not in the office of
  a great minister with all his portfolios. Nevertheless, you have decided to bring
  beauty to the rituals and the music and to balance human relationships and thus
  to reform the ordinary people. Isn’t this rather overdoing it?


  ‘Furthermore, there are eight defects that people are liable to, as well as four
  evils that affect their affairs, which must not be ignored:


  ‘To be involved with affairs that are not yours is to be overbearing.


  ‘To draw attention to yourself when no one wants you is to be intrusive.


  ‘To suck up to someone with speeches designed to please is to be sycophantic.


  ‘Not to distinguish between good and evil in what others say is to be a flatterer.


  ‘To gossip about other’s failings is to be slanderous.


  ‘To separate friends and families is to be malevolent.


  ‘To give false praise in order to hurt others is to be wicked.


  ‘Having no concern for right or wrong, but to be two-faced in order to find out
  what others know, is to be treacherous.


  ‘These eight defects cause disorder to others and harm to the perpetrator. A nobleman
  will not befriend one who has them, nor will an enlightened ruler appoint such a
  person to be a minister.


  ‘With regard to the four evils of which I spoke, they are:


  ‘Ambition – To be fond of taking on vast enterprises, altering and changing the
  old traditions, thus hoping that you can increase your fame and standing.


  ‘Greediness – To be a know-all and to try and get everything done your way, seizing
  what others do and claiming it as your own.


  ‘Obstinacy – To see your errors without doing anything to change them and to persist
  in doing things the wrong way.


  ‘Bigotry – To smile upon someone who agrees with you but when that person disagrees,
  to disown and despise them.


  ‘These are the four evils. If you can cast aside the eight defects and avoid the
  four evils, then you are at a point where it is possible to be taught.’


  Confucius looked sad and sighed, bowed twice, stood up and said, ‘Lu has exiled
  me twice, I have fled from Wei, they have felled a tree on me in Sung and laid siege
  to me between Chen and Tsai. I have no idea what I did to be so misunderstood. Why
  was I subject to these four forms of trouble?’


  The stranger looked distressed, then his expression changed and he said, ‘It is
  very difficult, Sir, to make you understand! There was once a man who was frightened
  by his own shadow and scared of his own footprints, so he tried to escape them by
  running away. But every time he lifted his foot and brought it down, he made more
  footprints, and no matter how fast he ran, his shadow never left him. Thinking he
  was running too slowly, he ran faster, never ceasing until finally he exhausted
  himself and collapsed and died. He had no idea that by simply sitting in the shade
  he would have lost his shadow, nor that by resting quietly he would cease making
  footprints. He really was a great fool!


  ‘You, Sir, try to distinguish the spheres of benevolence and righteousness, to explore
  the boundaries between agreement and disagreement, to study changes between rest
  and movement, to pontificate on giving and receiving, to order what is to be approved
  of and what disapproved of, to unify the limits of joy and anger, and yet you have
  barely escaped calamity. If you were to be serious in your cultivation of your own
  self, careful to guard the truth and


  willing to allow others to be as they are, then you could have avoided such problems.
  However, here you are, unable to cultivate yourself yet determined to improve others.
  Are you not obsessed with external things?’


  Confucius, really cast down, said, ‘Can I ask you about truth?’


  ‘True truth is simple purity at its most perfect,’ replied the stranger. ‘To be
  without purity, to be without sincerity means you cannot move other people. So if
  you fake mourning and weeping, then no matter how thoroughly you do this, it’s not
  real grief. If you make yourself act angry, even if you sound very fierce, this
  won’t inspire awe. If you force yourself to be affectionate, no matter how much
  you smile, you cannot create harmony. True grief may make no sound but is really
  sorrowful; true anger, even if there is no manifestation of it, creates awe; true
  affection doesn’t even need to smile but creates harmony. When someone has truth
  within, it affects his external spirit, which is why truth is so important. In terms
  of human relationship it works thus:


  ‘in service of parents, it is affection and filial piety;


  in service of rulers, it is loyalty and integrity;


  in celebrations, it is enjoyable pleasures;


  in conducting the mourning rituals, it is sadness and grief.


  ‘For in loyalty and integrity, service is all-important; in celebration, enjoyment
  is all-important; in mourning, grief is all-important; in service of parents, making
  them content is all-important.


  ‘The splendour of service doesn’t mean just doing the same thing every time. When
  making your parents content, you don’t worry about what to do. In getting jolly
  at a festival, you don’t get worked up about the crockery. In mourning at times
  of death, you don’t get het up over the precision of the rituals. Rituals have emerged
  from the common needs of the ordinary people. Truth itself comes to us from Heaven:
  this is how it is and it never changes. So the sage models himself upon Heaven,
  values truth but does not kowtow to convention. The fool does the opposite. He cannot
  take his model from Heaven and so is swayed by the mundane. He simply doesn’t know
  the value of truth, but is under the domination of the ordinary people and so is
  affected by this


  common crowd and is never at peace. Sadly for you, Sir, you started early in such
  nonsense and have only recently heard of the great Tao!’


  Confucius yet again bowed twice, stood up and said, ‘Now that I have had the opportunity
  to meet you, I feel as if I have been blessed by Heaven. Master, if you wouldn’t
  be embarrassed by this, will you allow me to join those who serve you and to be
  taught by you, and therefore tell me where I might find your house? I want to go
  there to hear your teachings from you and to complete my study of the great Tao.’


  The stranger replied, ‘I have heard it said that if you find someone with whom you
  can walk, then go with him to the deepest mysteries of the Tao. However, if it is
  someone you cannot walk with, and he doesn’t know the Tao, do not link yourself
  with him, and then you cannot be blamed. Do what you must, Sir! I will now depart
  from you, Sir, I will depart from you!’ With this he pushed off with his pole and
  went away through the reeds.


  Yen Yuan returned with the carriage and Tzu Lu held out the strap for Confucius
  to pull himself up and in, but Confucius did not look their way. He waited till
  the last ripples had died away and he could no longer hear the sound of the pole
  and then he returned and climbed into his seat.


  ‘I have been your servant for many years, Master,’ said Tzu Lu, running alongside
  the carriage, ‘but I have never before seen you behave with such awe towards another.
  The rulers of ten thousand chariots, of a thousand chariots, when they see you,
  Sir, they never put you in another room or treat you with anything less than the
  respect due to an equal, while you yourself always conduct yourself with an air
  of rigid politeness. Now this old fisherman stood tall before you with his pole,
  while you bent double like a musical chime bar, and you always bowed twice before
  speaking to him. Wasn’t this going a bit too far? We are all wondering about this.
  Why did this fisherman command such respect from you?’


  Confucius leaned upon the crossbar of his carriage, sighed and said, ‘Oh, Yu, it’s
  very hard to change you! You have studied ritual and order for so long, yet your
  base and mean heart has not yet been changed. Come here and I will explain! If you
  meet someone


  who is older than you and are not respectful, then this is a failure of etiquette.
  If you meet a worthy person and fail to offer respect, this is a lack of benevolence.
  If the fisherman was not a perfect man, he would not have the power to make others
  humble before him. If people do not humble themselves before him, they are lacking
  in sincerity and thus are unable to obtain the truth, so they harm themselves. Sadly,
  there is nothing worse that can befall us than the lack of such benevolence, but
  you alone, O Yu, risk such a calamity!


  ‘Furthermore, the Tao is that by which all the forms of life have life. All that
  lose it die. All that obtain it live. To struggle against it in practice is to face
  ruin. To flow with it is to succeed. So it is that where the Tao is, the sage will
  honour it. Now the old fisherman most certainly has the Tao, so how could I risk
  not showing respect to him?’'
