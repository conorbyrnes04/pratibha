sutra: Chuang Tzu 5
collection: The Book of Chuang Tzu
section: chapter 5
chapter_number: 5
title: The Evidence of Virtue Complete.
sanskrit: '魯有兀者王駘，從之游者，與仲尼相若。

  常季問於仲尼曰：「王駘，兀者也，從之游者，與夫子中分魯。

  立不教，坐不議。

  虛而往，實而歸。

  固有不言之教，無形而心成者邪？

  是何人也？

  」仲尼曰：「夫子，聖人也，丘也直後而未往耳！

  丘將以為師，而況不若丘者乎！

  奚假魯國，丘將引天下而與從之。

  」常季曰：「彼兀者也，而王先生，其與庸亦遠矣。

  若然者，其用心也獨若之何？

  」仲尼曰：「死生亦大矣，而不得與之變﹔雖天地覆墜，亦將不與之遺﹔審乎無假而不與物遷，命物之化而守其宗也。

  」常季曰：「何謂也？

  」仲尼曰：「自其異者視之，肝膽楚越也﹔自其同者視之，萬物皆一也。

  夫若然者，且不知耳目之所宜，而游心乎德之和。

  物視其所一而不見其所喪，視喪其足猶遺土也。

  」常季曰：「彼為己，以其知得其心，以其心得其常心。

  物何為最之哉？

  」仲尼曰：「人莫鑑於流水，而鑑於止水。

  唯止能止眾止。

  受命於地，唯松柏獨也正，在冬夏青青﹔受命於天，唯堯舜獨也正，在萬物之首。

  幸能正生，以正眾生。

  夫保始之徵，不懼之實，勇士一人，雄入於九軍。

  將求名而能自要者，而猶若是，而況官天地、府萬物、直寓六骸、象耳目、一知之所知，而心未嘗死者乎！

  彼且擇日而登假，人則從是也。

  彼且何肯以物為事乎！

  」申徒嘉，兀者也，而與鄭子產同師於伯昏無人。

  子產謂申徒嘉曰：「我先出則子止，子先出則我止。

  」其明日，又與合堂同席而坐。

  子產謂申徒嘉曰：「我先出則子止，子先出則我止。

  今我將出，子可以止乎？

  其未邪？

  且子見執政而不違，子齊執政乎？

  」申徒嘉曰：「先生之門固有執政焉如此哉？

  子而悅子之執政而后人者也。

  聞之：''鑑明則塵垢不止，止則不明也。

  久與賢人處則無過。

  ''今子之所取大者，先生也，而猶出言若是，不亦過乎！

  」子產曰：「子既若是矣，猶與堯爭善。

  計子之德，不足以自反邪？

  」申徒嘉曰：「自狀其過，以不當亡者眾﹔不狀其過，以不當存者寡。

  知不可奈何，而安之若命，唯有德者能之。

  游於羿之彀中。

  中央者，中地也﹔然而不中者，命也。

  人以其全足笑吾不全足者多矣，我怫然而怒，而適先生之所，則廢然而反。

  不知先生之洗我以善邪？

  吾之自寐邪？

  吾與夫子游十九年矣，而未嘗知吾兀者也。

  今子與我游於形骸之內，而子索我於形骸之外，不亦過乎！

  」子產蹴然改容更貌曰：「子無乃稱！

  」魯有兀者叔山無趾，踵見仲尼。

  仲尼曰：「子不謹，前既犯患若是矣。

  雖今來，何及矣！

  」無趾曰：「吾唯不知務而輕用吾身，吾是以亡足。

  今吾來也，猶有尊足者存，吾是以務全之也。

  夫天無不覆，地無不載，吾以夫子為天地，安知夫子之猶若是也！

  」孔子曰：「丘則陋矣！

  夫子胡不入乎？

  請講以所聞。

  」無趾出。

  孔子曰：「弟子勉之！

  夫無趾，兀者也，猶務學以復補前行之惡，而況全德之人乎！

  」無趾語老聃曰：「孔丘之於至人，其未邪？

  彼何賓賓以學子為？

  彼且以蘄以諔詭幻怪之名聞，不知至人之以是為己桎梏邪？

  」老聃曰：「胡不直使彼以死生為一條，以可不可為一貫者，解其桎梏，其可乎？

  」無趾曰：「天刑之，安可解！

  」'
