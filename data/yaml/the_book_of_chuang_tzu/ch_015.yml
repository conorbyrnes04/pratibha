sutra_id: ctz_015
sutra: Chuang Tzu 15
collection: The Book of Chuang Tzu
section: chapter 15
chapter_number: 15
title: Self-Conceit.
sanskrit: '水靜則明燭鬚眉，平中準。

  人心靜則天地之鑑也，萬物之鏡也。'
transliteration: '*(Chinese source text tradition; no Sanskrit original. Pinyin terms are given in Key
  Terms.)*'
translation: 'Still water reflects exactly. Disturbed water distorts.


  So too with mind: when stilled, it mirrors things as they are; when agitated, it overlays projection.
  The sage''s repose is not lethargy but lucid equilibrium.'
commentary: 'The claim is that epistemic clarity depends on affective stillness. The counterintuitive
  move is to treat tranquility not as a moral ornament but as a condition of accurate perception. In most
  modern settings, agitation is mistaken for seriousness and speed for intelligence. Zhuangzi reverses
  this: turbulence reduces fidelity of contact. Mirror mind does not mean empty blankness; it means non-retentive
  responsiveness - receiving without clinging.


  Within Daoist thought, stillness and action are not opposites. Stillness is the calibration condition
  from which unforced action becomes possible. If calibration is absent, action multiplies error. This
  is why Zhuangzi links repose to cosmic "level": it is a reference alignment, like a true waterline used
  to set measurement.


  Existentially, the passage offers a rigorous practice for decision fatigue and reactivity. Before judging
  the object, assess the mirror. If inner water is whipped by fear, vanity, resentment, or urgency, perceived
  facts will already be bent. The solution is not to stop living until perfectly calm. It is to include
  micro-stilling as part of action itself. A few seconds of genuine settling can prevent hours of compensatory
  correction. Clarity is economical.'
