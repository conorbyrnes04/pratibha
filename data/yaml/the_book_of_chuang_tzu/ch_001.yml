anchor_translation: In the northern ocean there is a fish, called the Leviathan, many
  thousand li in size. This leviathan changes into a bird, called the Rukh, whose
  back is many thousand li in breadth. With a mighty effort it rises, and its wings
  obscure the sky like clouds. At the equinox, this bird prepares to start for the
  southern ocean, the Celestial Lake. And in the Record of Marvels we read that when
  the rukh flies southwards, the water is smitten for a space of three thousand li
