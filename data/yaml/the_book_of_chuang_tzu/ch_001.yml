abhyasa: 'When you label a current aim "unrealistic," pause and write two columns:
  in the first, list the assumptions of your present scale (time, energy, identity,
  fear); in the second, rewrite the same aim as if your "air-depth" were ten times
  larger, then take exactly one concrete step from the second column today.'
