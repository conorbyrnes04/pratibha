anchor_chapter: Zhuangzi's opening is scale-work, not natural history. Small creatures
  measure the world by their basin; what looks impossible from one depth is proportionate
  from another. Peng is not moral superiority over the cicada—it is the disclosure
  of a wider medium. The question is whether your standard of "realistic" names reality
  or only the size of your vessel.
key_terms:
- term: dào (道)
  definition: from the graph of "road/path" and "speaking/guiding" -> in this passage,
    the tacit ordering principle that allows each being to move according to its own
    scale -> default translation "Way" can sound like a fixed doctrine, but here it
    means a dynamic relational field, which is why Peng's motion and the cicada's
    motion can both be lawful yet incommensurable.
- term: yáo yóu (逍遙)
  definition: '"to wander at ease, to roam unbound" -> names the mode of freedom implied
    by Peng''s ascent: movement unconstrained by cramped utility -> "free wandering"
    often sounds like leisure; Zhuangzi means ontological non-constriction, a shift
    in what counts as binding.'
- term: wúwéi (無為)
  definition: 'literally "without forced doing" (*wú* = without, *wéi* = contrived
    action) -> contextual meaning here: action that fits the depth of conditions rather
    than imposing narrow intention -> default translation "non-action" is misleading
    because Peng is not inactive; the teaching is unforced congruence, not passivity.'
- term: kūn / péng (鯤 / 鵬)
  definition: 'mythic fish and bird pair linked by transformation -> in this passage
    they model metamorphic scale: identity is not fixed substance but capacity across
    conditions -> translating them as "Leviathan/Rukh" imports Abrahamic and Persian
    mythic baggage that can blur Zhuangzi''s point about transformation and proportion.'
resonances:
- citation: Bhagavad Gita 2.69
  resonance: '"What is night for all beings is wakefulness for the disciplined one."
    Both texts introduce scale-differentiated cognition: ordinary and awakened perspectives
    do not rank data the same way, so they disagree about what is possible.'
  divergence: The Gita frames this in terms of disciplined inward steadiness under
    dharma, whereas Zhuangzi frames it through perspectival plurality and spontaneous
    fit; the former stabilizes a normative axis, the latter pluralizes axes.
- citation: Vijnana Bhairava Tantra, dharana on sky-like expansion of awareness
  resonance: 'Both passages use vastness as a practical epistemology: enlarge the
    containing field and previously rigid limits dissolve.'
  divergence: The VBT interiorizes vastness into direct contemplative recognition
    of consciousness, while Zhuangzi narrativizes vastness through image and parable;
    one is explicit method, the other is perspectival reeducation.
- citation: Nicholas of Cusa, *De Docta Ignorantia* I.1
  resonance: Cusanus argues finite intellect cannot measure the infinite by finite
    ratios; Zhuangzi's cicada/Peng contrast makes the same structural point through
    allegory.
  divergence: Cusanus resolves disproportion theologically through learned ignorance
    before the absolute, while Zhuangzi resolves it existentially through relaxed
    attunement to differing scales of life.
