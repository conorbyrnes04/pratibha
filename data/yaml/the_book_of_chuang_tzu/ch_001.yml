translation: 'In the northern darkness there is a fish called Kun [*kūn* 鯤], immeasurably
  vast. It transforms into a bird called Peng [*péng* 鵬], whose back is likewise immeasurable.
  When it rises in full force, its wings hang like sky-wide clouds.


  When the sea-winds turn, this bird prepares to move to the southern darkness, the
  Heavenly Pool. The old records say: when Peng makes this migration, it beats the
  waters for three thousand *li*, rides the whirlwind upward ninety thousand *li*,
  and then travels with the wind-breath of six months.


  If water does not gather deeply, it cannot bear a great boat. Pour a cup of water
  into a shallow hollow and a mustard seed can serve as a boat; place an actual cup
  there and it grounds at once. The water is too shallow and the vessel too large.


  So too with wind. If wind does not gather deeply, it cannot bear great wings. Only
  when the air is deep enough can Peng carry blue sky on its back, pass beyond all
  obstruction, and set its course southward.'
commentary: 'Zhuangzi''s claim here is not zoological wonder but epistemic surgery:
  the standards by which small creatures judge possibility are structurally inadequate
  to the scale at which Tao operates. The contested move is this: what appears "exaggerated"
  from one horizon may be simple proportion from another. The cicada''s ridicule of
  Peng is not ignorance in a moral sense; it is scale-lock, the inability to imagine
  conditions larger than one''s own atmosphere. Zhuangzi uses the boat-in-shallow-water
  analogy to show that capacity is never intrinsic alone - it is relational to depth,
  medium, and context.


  This matters philosophically because it destabilizes ordinary judgments about what
  is realistic, practical, or excessive. The text refuses a single universal metric
  for action. A life can be "too much" only relative to the basin in which one measures
  it. In Daoist terms, the sage does not force all beings into one register; he recognizes
  patterned differences in scope and timing. Peng is not morally superior to the cicada,
  but it discloses a domain inaccessible to cicada-consciousness. The existential
  application is immediate: whenever you dismiss a possibility as impossible, ask
  whether you are describing reality or merely the depth of your current vessel. Zhuangzi''s
  opening move is to loosen identity from local scale so one can inhabit a wider sky
  without resentment toward smaller forms.'
