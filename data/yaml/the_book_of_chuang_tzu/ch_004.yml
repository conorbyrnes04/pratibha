sutra_id: ctz_004
sutra: Chuang Tzu 4
collection: The Book of Chuang Tzu
section: chapter 4
chapter_number: 4
title: Man Among Men.
sanskrit: '顏回曰：「回益矣，請問其方。」

  仲尼曰：「齋，吾將語若！若有而為之，其易邪？易之者，皞天不宜。」

  顏回曰：「回之家貧，唯不飲酒、不茹葷者數月矣。若此則可以為齋乎？」

  曰：「是祭祀之齋，非心齋也。」

  回曰：「敢問心齋。」

  曰：「若一志，無聽之以耳而聽之以心；無聽之以心而聽之以氣。聽止於耳，心止於符。氣也者，虛而待物者也。唯道集虛。虛者，心齋也。」'
transliteration: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation: 'Yan Hui says, "I have reached my limit. Please give me a method."


  Confucius says, "Fast. I will tell you. You have plans, but this cannot be done by planning."


  Yan Hui says, "My household is poor. For months we have taken no wine and no rich food. Is that fasting?"


  Confucius says, "That is ritual fasting, not heart-fasting."


  Yan Hui asks, "What is heart-fasting?"


  Confucius says, "Unify your intention. Do not listen with the ears; listen with the heart-mind. Do not
  listen with the heart-mind; listen with *qi*. Hearing stops at the ear. The heart-mind stops at signs.
  *Qi* is emptiness, waiting for things. Only Tao gathers in emptiness. That emptiness is heart-fasting."'
commentary: 'The philosophical claim is that transformation happens through emptied receptivity, not through
  more strategic intention. The counterintuitive move is sharp: Yan Hui asks for a method to influence
  a ruler, and Confucius answers with de-methodologizing the self that wants to influence. In ordinary
  discourse, "fasting" means deprivation from objects (food, wine, pleasure). In this passage, fasting
  is the suspension of appropriative cognition itself. That shift from external abstinence to internal
  de-cluttering is the hinge of the teaching.


  In Daoist context, this is an early articulation of a non-coercive epistemology. The mind that rushes
  to classify, persuade, and impose cannot receive the pattern of the situation. "Listening with qi" names
  a more primordial responsiveness than argument and preference. The line "only Tao gathers in emptiness"
  is not metaphysical ornament; it is practical phenomenology: wherever the inner field is packed with
  opinion, Tao has no room to move as guidance.


  Existentially, heart-fasting redefines effective action. It does not produce passivity, and it does
  not deny ethical stakes. It removes internal noise so action can arise from contact rather than projection.
  In relationships, leadership, or conflict, this means withholding the compulsion to win the frame before
  one has actually received what is present. Zhuangzi''s wager is that genuine efficacy requires first
  becoming permeable. The one who is empty enough to receive is paradoxically the one most capable of
  precise response.'
