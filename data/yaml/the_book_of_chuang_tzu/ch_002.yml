sutra: Chuang Tzu 2
collection: The Book of Chuang Tzu
section: chapter 2
chapter_number: 2
title: Working Everything Out Evenly
sanskrit: ''
transliteration: ''
translation: 'Master Chi of the Southern District sat leaning forward on his chair,
  staring up at Heaven and breathing steadily, as if in a trance, forgetful of all
  around him. Master Yen Cheng Yu stood beside him and said, ‘What is it? Is it true
  that you can make the body like a shrivelled tree, the heart like cold, dead ashes?
  Surely the man here now is not the same as the one who was here yesterday.’


  Master Chi said, ‘Yen, this is a good point to make, but do you really understand?


  ‘I have lost myself, do you understand?


  You hear the pipes of the people, but not the pipes of earth.


  Even if you hear the pipes of earth, you don’t hear the pipes of Heaven!’


  ‘Please explain this,’ said Master Yu.


  Master Chi replied,


  ‘The vast breath of the universe, this is called Wind.


  Sometimes it is unmoving;


  when it moves it makes the ten thousand openings resound dramatically.


  Have you not heard it,


  like a terrifying gale?


  Mountains and forests are stormed by it,


  great trees, a hundred spans round with dips and hollows,


  are like noses, like mouths, like ears, like sockets,


  like cups, like mortars, like pools, like gulleys;


  sounding like a crashing wave, a whistling arrow, a screech; sucking,'
commentary: 'Master Chi of the Southern District sat leaning forward on his chair,
  staring up at Heaven and breathing steadily, as if in a trance, forgetful of all
  around him. Master Yen Cheng Yu stood beside him and said, ‘What is it? Is it true
  that you can make the body like a shrivelled tree, the heart like cold, dead ashes?
  Surely the man here now is not the same as the one who was here yesterday.’


  Master Chi said, ‘Yen, this is a good point to make, but do you really understand?


  ‘I have lost myself, do you understand?


  You hear the pipes of the people, but not the pipes of earth.


  Even if you hear the pipes of earth, you don’t hear the pipes of Heaven!’


  ‘Please explain this,’ said Master Yu.


  Master Chi replied,


  ‘The vast breath of the universe, this is called Wind.


  Sometimes it is unmoving;


  when it moves it makes the ten thousand openings resound dramatically.


  Have you not heard it,


  like a terrifying gale?


  Mountains and forests are stormed by it,


  great trees, a hundred spans round with dips and hollows,


  are like noses, like mouths, like ears, like sockets,


  like cups, like mortars, like pools, like gulleys;


  sounding like a crashing wave, a whistling arrow, a screech; sucking, shouting,
  barking, wailing, moaning,


  the winds ahead howling


  yeeh,


  those behind crying


  yooh,


  light breezes making gentle sounds,


  while the typhoon creates a great din.


  When the typhoon has passed, all goes quiet again.


  Have you not witnessed this disturbance settle down again?’


  Master Yu said, ‘What you’ve just described are the notes of the earth, while the
  notes of humanity come from wind instruments, but you have said nothing about the
  notes of Heaven.’


  ‘The role of these forces on all forms of living things is not the same,’ said Master
  Chi. ‘For each is different, using what they need to be, not influenced by any other
  force!’


  True depth of understanding is wide and steady,


  Shallow understanding is lazy and wandering,


  Words of wisdom are precise and clear,


  Foolish words are petty and mean.


  When we sleep, our spirits roam the earth,


  when awake our bodies are alert,


  whatever we encounter captures us,


  day by day our hearts are struggling.


  Often simple,


  often deep,


  often intimate.


  Minor troubles make them unsettled, anxious,


  Major troubles are plain and simple.


  They fly off like an arrow,


  convinced that they know right from wrong;


  it is like one who makes a sacred promise,


  standing sure and true and on their way to victory.


  They give way, like autumn and winter,


  decaying away with the ebb and flow of each day;


  it is like a stream of water, it cannot be brought back;


  they stagnate, because they are like old blocked drains,


  brought on by old age,


  which makes their minds closed as if near death,


  and there is nothing which can draw their hearts into the power of the yang –


  the life-giving light.


  Joy and anger,


  sadness and delight,


  hope and disappointment;


  faithlessness and certainty,


  forcefulness and sloth,


  eagerness and reticence,


  like notes from an empty reed,


  or mushrooms growing in dampness,


  day and night follow each other before our very eyes and we have no idea why.


  Enough, enough!


  Morning and night exist,


  we cannot know more about the Origin than this!


  Without them, we don’t exist,


  Without us, they have no purpose.


  This is close to our meaning,


  but we cannot know what creates things to be thus.


  It is as if they have a Supreme Guidance, but there is no way of grasping such a
  One.


  He can certainly act, of that there is no doubt,


  but I cannot see his body.


  He has desires, but no body.


  A hundred parts and nine orifices and six organs,


  are parts that go to make up myself,


  but is any part more noble than another?


  You say I should treat all parts as equally noble:


  But shouldn’t I also treat some as better than others?


  Don’t they all serve me as well as each other?


  If they are all servants, then aren’t they all as bad as each other?


  Or are there rulers amongst these servants?


  There must be some Supreme Ruler who is over them all.


  Though it is doubtful that you can find his true form,


  and even if it were possible,


  is it not meaningless to his true nature?


  When someone is born in this body, doesn’t life continue until death?


  Either in conflict with others or in harmony with them,


  we go through life like a runaway horse, unable to stop.


  Working hard until the end of his life,


  unable to appreciate any achievement,


  worn out and incapable of resting,


  isn’t he a pathetic sight?


  He may say, ‘I’m still alive,’ but so what?


  When the body rots, so does the mind – is this not tragic?


  Is this not ridiculous, or is it just me that is ridiculous and everyone else is
  sane?


  If you allow your mind to guide you,


  who then can be seen as being without a teacher?


  Why is it thought that only the one who understands change and whose heart approves
  this can be the teacher?


  Surely the fool is just the same.


  But if you ignore your mind but insist you know right from wrong, you are like the
  saying,


  ‘Today I set off for Yueh and arrived yesterday.’


  This is to claim that what is not, is;


  That what is not, does exist –


  why, even the holy sage Yu cannot understand this,


  let alone poor old me!


  Our words are not just hot air. Words work because they say something, but the problem
  is that, if we cannot define a word’s meaning, it doesn’t really say anything. Is
  it possible that there really is something here? Or does it really mean nothing?
  Is it possible to make a proper case for it being any different from the chirruping
  of chicks? How is it that we have the Tao so obscured that we have to distinguish
  between true and false? What has clouded our words so that we can have both what
  is and what is not? How can it be that the Tao goes off and is no longer? How can
  it be that words are found but are not understood? When the Tao is obscured by pettiness
  and the words are obscured by elaboration, then we end up having the ‘this is, this
  is not’ of the Confucians and Mohists, with what one of them calls reality being
  denied by the other, and what the other calls real disputed by the first. If we
  want to confound what they call right and confirm what they call wrong, we need
  to shed light on both of them.


  Nothing exists which is not ‘that’, nothing exists which is not ‘this’. I cannot
  look at something through someone else’s eyes, I can only truly know something which
  I know. Therefore ‘that’ comes out of ‘this’ and ‘this’ arises from ‘that’. That
  is why we say that ‘that’ and ‘this’ are born from each other, most definitely.


  Compare birth with death, compare death with life; compare what is possible with
  what is not possible and compare what is not possible with what is possible; because
  there is, there is not, and because there is not, there is.


  Thus it is that the sage does not go down this way, but sheds the light of Heaven
  upon such issues. This is also that and that is also this. The ‘that’ is on the
  one hand also ‘this’, and ‘this’ is on the other hand also ‘that’. Does this mean
  he still has a this and that? Does this mean he does not have a this and that?


  When ‘this’ and ‘that’ do not stand against each other, this is called the pivot
  of the Tao. This pivot provides the centre of the circle, which is without end,
  for it can react equally to that which is and to that which is not. This is why
  it is best to shed light on such issues. To use a finger to show that a finger is
  not a finger, is not really as good as using something that is not a finger to show
  that a


  finger is not a finger; to use a horse to show a horse is not a horse is not as
  good as using something other than a horse to show that a horse is not a horse.
  Heaven and Earth are as one as a finger is, and all of creation is as one as a horse
  is.


  What is, is, what is not, is not.


  The Tao is made because we walk it,


  things become what they are called.


  Why is this so? Surely because this is so.


  Why is this not so? Surely because this is not so.


  Everything has what is innate,


  everything has what is necessary.


  Nothing is not something,


  nothing is not so.


  Therefore, take a stalk of wheat and a pillar,


  a leper or a beauty like Hsi-shih,


  the great and the insecure,


  the cunning and the odd:


  all these are alike to the Tao.


  In their difference is their completeness;


  in their completeness is their difference.


  Through the Tao they are all seen as one, regardless of their completeness or difference,
  by those who are capable of such extended vision. Such a person has no need for
  distinctions but follows the ordinary view. The ordinary view is firmly set on the
  ground of usefulness. The usefulness of something defines its use; the use is its
  flexibility; its flexibility is its essence and from this it comes to a stop. We
  stop but do not know why we stop, and this is called Tao.


  To tax our spirits and our intellect in this way without realizing that everything
  is the same is called ‘Three in the Morning’. And what is ‘Three in the Morning’?
  A monkey trainer was giving out acorns and he said, ‘In the morning I will give
  you each three acorns and in the evening you will get four.’ The monkeys were very
  upset at this and so he said, ‘All right, in the morning you will get four and in
  the evening, three.’ This pleased the monkeys no end. His two statements were essentially
  the same, but got different


  reactions from the monkeys. He gained what he wanted by his skill. So it is with
  the sage, who manages to harmonize right and wrong and is content to abide by the
  Natural Equality of Heaven. This is called walking two roads.


  The men of old understood a great deal. How much?


  In the beginning they did not know that anything existed; this is virtually perfect
  knowledge, for nothing can be added. Later, they knew that some things existed but
  they did not distinguish between them. Next came those who distinguished between
  things, but did not judge things as ‘being’ or ‘not being’. It was when judgements
  were made that the Tao was damaged, and because the Tao was damaged, love became
  complete. Is anything complete or damaged? Is anything not complete or damaged?
  There is completion and damage, just as Chao Wen


  12


  played the lute. There is nothing which is complete or damaged, just as Chao Wen
  did not play the lute.


  Chao Wen played the lute,


  Shih Kuang conducted,


  Hui Tzu debated.


  The understanding of these three was almost perfect and they followed it to the
  end of their years. They cared about this because it was different, and they wanted
  to teach others about it. But it was not possible to make things clear, though they
  tried to make things simple. They ended up instead with the folly of the ‘hard’
  and the ‘white’.


  Wen’s son ended up continuing to play Wen’s lute and achieved nothing for himself.
  If someone like this is called complete, then am I not also? And if someone like
  this is called incomplete, then surely


  neither I nor anyone else has ever been complete. Also, by the light shining out
  of chaos, the sage is guided; he does not make use of distinctions but is led on
  by the light.


  Now, however, I have something to say. Do I know whether this is in the same sort
  of category as what is said by others? I don’t know. At one level, what I say is
  not the same. At another level, it most definitely is, and there is no difference
  between what I say and what others say. Whatever the case, let me try and tell you
  what I mean.


  There is the beginning; there is not as yet any beginning of the beginning; there
  is not as yet beginning not to be a beginning of the beginning. There is what is,
  and there is what is not, and it is not easy to say whether what is not, is not;
  or whether what is, is.


  I have just made a statement, yet I do not know whether what I said has been real
  in what I said or not really said.


  Under Heaven there is nothing greater than the tip of a hair, but Mount Tai is smaller;
  there is no one older than a dead child, yet Peng Tsu died young.


  Heaven and Earth and I were born at the same time, and all life and I are one.


  As all life is one, what need is there for words? Yet I have just said all life
  is one, so I have already spoken, haven’t I? One plus one equals two, two, plus
  one equals three. To go on from here would take us beyond the understanding of even
  a skilled accountant, let alone the ordinary people. If going from ‘nothing’ to
  ‘some-thing’ we get to three, just think how much further we would have to go if
  we went from ‘some-thing’ to something!


  13


  Don’t even start, let’s just stay put.


  The great Tao has no beginning, and words have changed their meaning from the beginning,
  but because of the idea of a ‘this is’


  there came to be limitations. I want to say something about these limitations. There
  is right and left, relationships and their consequences, divisions and disagreements,
  emulations and contentions. These are known as the eight Virtues.


  The sage will not speak of what is beyond the boundaries of the universe – though
  he will not deny it either. What is within the universe, he says something about
  but does not pronounce upon. Concerning the record of the past actions of the kings
  in the


  Spring and Autumn Annals,


  the sage discusses but does not judge. When something is divided, something is not
  divided; when there is disagreement there are things not disagreed about.


  You ask, what does this mean? The sage encompasses everything, while ordinary people
  just argue about things. This is why I say that disagreement means you do not understand
  at all.


  The great Way is not named,


  the great disagreement is unspoken,


  great benevolence is not benevolent,


  great modesty is not humble,


  great courage is not violent.


  The Tao that is clear is not the Tao,


  speech which enables argument is not worthy,


  benevolence which is ever present does not achieve its goal,


  modesty if flouted, fails,


  courage that is violent is pointless.


  These five are fine: they are, as it were, rounded. But if they lose this they can
  become awkward. This is why the one who knows how to stop at what he knows is best.
  Who knows the argument that needs no words, and the Tao that cannot be named? To
  those who do, this is called the Treasury of Heaven. Pour into it and it is never
  full; empty it and it is never empty. We do not know where it comes from originally,
  and this is called our Guiding Light.


  In the olden days Yao said to Shun, ‘I want to attack Tsung, Kuai and Hsu Ao. I
  have wanted to do this since I became king. What do you think?’


  Shun replied, ‘These three rulers are just primitives living in the backwoods –
  why can’t you just forget them? In ancient times, ten suns rose and all life was
  illuminated. But how much more does Virtue illuminate life than even these suns!’


  Yeh Chueh said to Wang Ni, ‘Do you know, Master, what everything agrees upon?’


  ‘How can I possibly know?’ said Wang Ni.


  ‘Do you know, Master, what you do not know?’


  ‘How can I know?’ he replied.


  ‘Then does nothing know anything?’


  ‘How could I know that?’ said Wang Ni. ‘Nevertheless, I want to try and say something.
  How can I know that what I say I know is not actually what I don’t know? Likewise,
  how can I know that what I think I don’t know is not really what I do know? I want
  to put some questions to you:


  ‘If someone sleeps in a damp place, he will ache all over and he will be half paralysed,
  but is it the same for an eel? If someone climbs a tree, he will be frightened and
  shaking, but is it so for a monkey? Out of these three, which is wisest about where
  to live?


  ‘Humans eat meat, deer consume grass, centipedes devour snakes and owls and crows
  enjoy mice. Of these four, which has the best taste?


  ‘Monkeys mate with each other, deer go with deer. People said that Mao Chiang and
  Li Chi were the most beautiful women in the world, but fish seeing them dived away,
  birds took off into the air and deer ran off. Of these four, who really knows true
  beauty? As I see it, benevolence and righteousness, also the ways of right and wrong,
  are completely interwoven. I do not think I can know the difference between them!’


  Yeh Chueh said: ‘Master, if you do not know the difference


  between that which is good and that which is harmful, does this mean the perfect
  man is also without such knowledge?’


  ‘The perfect man is pure spirit,’ replied Wang Ni. ‘He does not feel the heat of
  the burning deserts nor the cold of the vast waters. He is not frightened by the
  lightning which can split open mountains, nor by the storms that can whip up the
  seas. Such a person rides the clouds and mounts upon the sun and moon, and wanders
  across and beyond the four seas. Neither death nor life concern him, nor is he interested
  in what is good or bad!’


  Chu Chiao Tzu asked Chang Wu Tzu,


  ‘I have heard from the Master


  that the sage does not labour at anything,


  does not look for advantage,


  does not act benevolently,


  does not harm,


  does not pursue the Tao;


  He speaks without speaking,


  and does not speak when he speaks,


  and looks beyond the confines of this dusty world.


  ‘The Master sees all this as an endless stream of words, but to me they are like
  the words of the mysterious Tao. Master, what do you think?’


  Chang Wu Tzu said, ‘Such a saying as this would have confused even the Yellow Emperor,


  14


  so how could Confucius be able to understand them! However, you are getting ahead
  of yourself, counting your chickens before your eggs are hatched and looking at
  the bowl, imagining the roasted fowl. I will try to speak to you in a random way,
  so you listen to me likewise. How can the wise one sit beside the sun and moon and
  embrace the universe? Because he


  brings all things together in harmony, he rejects difference and confusion and ignores
  status and power. While ordinary people rush busily around, the sage seems stupid
  and ignorant, but to him all life is one and united. All life is simply what it
  is and all appear to him to be doing what they rightly should.


  ‘How do I know that the love of life is not a delusion? Or that the fear of death
  is not like a young person running away from home and unable to find his way back?
  The Lady Li Chi was the daughter of a border warden, Ai. When the state of Chin
  captured her, she wept until she had drenched her robes; then she came to the King’s
  palace, shared the King’s bed, ate his food, and repented of her tears. How do I
  know whether the dead now repent for their former clinging to life?


  ‘Come the morning, those who dream of the drunken feast may weep and moan; when
  the morning comes, those who dream of weeping and moaning go hunting in the fields.
  When they dream, they don’t know it is a dream. Indeed, in their dreams they may
  think they are interpreting dreams, only when they awake do they know it was a dream.
  Eventually there comes the day of reckoning and awakening, and then we shall know
  that it was all a great dream. Only fools think that they are now awake and that
  they really know what is going on, playing the prince and then playing the servant.
  What fools! The Master and you are both living in a dream. When I say a dream, I
  am also dreaming. This very saying is a deception. If after ten thousand years we
  could once meet a truly great sage, one who understands, it would seem as if it
  had only been a morning.


  ‘Imagine that you and I have a disagreement, and you get the better of me, rather
  than me getting the better of you, does this mean that you are automatically right
  and I am automatically wrong? Suppose I get the better of you, does it follow that
  I am automatically right and you are therefore wrong? Is it really that one of us
  is right and the other wrong? Or are we both right and both wrong? Neither you nor
  I can really know and other people are even more in the dark. So who can we ask
  to give us the right answer? Should you ask someone who thinks you are right? But
  how then can that person give a fair answer? Should we ask


  someone who thinks I am right? But then if he agrees with me, how can he make a
  fair judgement? Then again, should we ask someone who agrees with both of us? But
  again, if he agrees with both of us, how can he make a true judgement? Should we
  ask someone who disagrees with both of us? But here again, if he disagrees with
  both of us, how can he make an honest judgement? It is clear that neither you, I
  nor anyone else can make decisions like this amongst ourselves. So should we wait
  for someone else to turn up?


  ‘To wait for one voice to bring it all together is as pointless as waiting for no
  one. Bring all things together under the Equality of Heaven, allow their process
  of change to go on unimpeded, and learn to grow old. What do I mean by bringing
  everything together under the Equality of Heaven? With regard to what is right and
  wrong, I say not being is being and being is not being. But let us not get caught
  up in discussing this. Forget about life, forget about worrying about right and
  wrong. Plunge into the unknown and the endless and find your place there!’


  The Outline said to the Shadow, ‘First you are on the move, then you are standing
  still; you sit down and then you stand up. Why can’t you make up your mind?’


  Shadow replied, ‘Do I have to look to something else to be what I am? Does this
  something else itself not have to rely upon yet another something? Do I have to
  depend upon the scales of a snake or the wings of a cicada? How can I tell how things
  are? How can I tell how things are not?’


  Once upon a time, I, Chuang Tzu, dreamt that I was a butterfly, flitting around
  and enjoying myself. I had no idea I was Chuang Tzu. Then suddenly I woke up and
  was Chuang Tzu again. But I could not tell, had I been Chuang Tzu dreaming I was
  a butterfly, or a butterfly dreaming I was now Chuang Tzu? However, there must be
  some sort of difference between Chuang Tzu and a butterfly! We call this the transformation
  of things.'
