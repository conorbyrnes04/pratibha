translation: 'Master Carpenter Shi sees the great shrine-oak and dismisses it: unusable
  timber, unfit for boat, coffin, furniture, door, or pillar. "Exactly why it has
  lived so long," he says.


  That night the tree appears in his dream and rebukes his metric. Fruit trees are
  cut, stripped, and broken precisely because they are immediately useful. "I sought
  long to be unusable," the tree says. "Had I been conventionally useful, I would
  never have attained this magnitude."


  When the apprentice objects that the tree''s sacred status itself is a use, the
  master clarifies: its mode of safety is unlike ordinary utility. It survives by
  escaping extractive categories.'
commentary: 'The claim is that survivability often depends on strategic illegibility
  to systems of extraction. The counterintuitive move is not merely "useless things
  last longer"; it is that refusal of dominant utility criteria can become an affirmative
  design principle for life. The tree is not inertly lucky - it actively "seeks" non-capture
  over time. Zhuangzi turns what looks like deficiency into adaptive intelligence.


  In Daoist context, this deepens the earlier gourd/tree motif by adding dream-voice
  and temporal strategy. Immediate utility serves short-cycle economies; non-extractability
  serves long-cycle flourishing. The artisan''s first judgment is technically correct
  yet existentially narrow. The dream destabilizes professional expertise when it
  absolutizes its own frame. A carpenter''s measure can evaluate boards, but cannot
  by itself evaluate lives.


  Existentially, this passage speaks to modern optimization culture. Individuals and
  communities are pressured to maximize legibility, output, and market-use. Zhuangzi
  asks what must remain unoptimized if anything is to endure. "Sacredness" here can
  be read as social shielding around what should not be consumed. The teaching is
  not anti-skill; it is anti-totalization of one skill''s metric over all values.
  To preserve life, one sometimes must be deliberately unprofitable to predatory systems.'
