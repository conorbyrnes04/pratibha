  sadhana: Choose one ordinary action today and perform it without haste or self-narration. End with one
    breath of gratitude.
abhyasa: 'Three times today, when you notice yourself rehearsing gain/loss scenarios, stop for ten breaths
  into the lower body (long exhale, relaxed throat), and on each exhale silently repeat: "Do not force
  what is already moving."'
