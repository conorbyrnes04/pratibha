title: Webbed Toes
sanskrit: ''
transliteration: ''
translation: 'The big toe being webbed with the other toes, or an extra finger, may
  both be quite natural, but they do not spring from virtue. Swellings and tumours
  certainly arise from the body, but do not spring from what is natural. There are
  many acts of kindness and justice and they are often associated with the five vital
  organs.


  34


  But this is not the correct way according to the Tao (the Way) and Te (Virtue).
  In fact, webbed feet are simply useless extra pieces of skin; an additional finger
  is useless. So to associate these with the five vital organs is to confuse the use
  of kindness and justice. It places too much emphasis on hearing and sight. So heightened
  visual perception will cause confusion in distinguishing the five colours. One will
  be overwhelmed by interesting designs and dazzled by the bright and luminous shades
  of blue and yellow. As a result, it will be like Li Chu the keen-sighted. And doesn’t
  an extraordinary faculty for hearing lead to confusion about the five notes, and
  excessive use of the six tones created by metal, stone, silk and bamboo together
  with the


  huang chung


  and


  ta lu


  pipes. As a result, it will be like the music master Kuang.


