anchor_translation: Joined toes and extra fingers are an addition to nature, though, functionally speaking,
  superfluous. Wens and tumours are an addition to the bodily form, though, as far as nature is concerned,
  superfluous. And similarly, to include charity and duty to one's neighbour among the functions of man's
  organism, is not true Tao. The whole of this chapter is a violent tirade against the leading doctrines
  of Confucianism. For just as joined toes are but useless lumps of flesh, and extra fingers but useless
  excrescences, so are any artificial additions to our internal economy but harmful adjuncts to real charity
  and duty to one's neighbour, Which are the outcome of Tao. and are moreover prejudicial to the right
  use of intelligence. People with extra keenness of vision muddle themselves over the five colours, exaggerate
  the value of shades, and of distinctions of greens and yellows for sacrificial robes. Of such was Li
