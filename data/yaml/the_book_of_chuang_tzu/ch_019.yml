sutra: Chuang Tzu 19
collection: The Book of Chuang Tzu
section: chapter 19
chapter_number: 19
title: The Secret of Life.
sanskrit: '達生之情者，不務生之所無以為；

  達命之情者，不務知之所無奈何。

  養形必先之以物，物有餘而形不養者有之矣；

  有生必先無離形，形不離而生亡者有之矣。

  生之來不能卻，其去不能止。

  悲夫！

  世之人以為養形足以存生；

  而養形果不足以存生，則世奚足為哉！

  雖不足為而不可不為者，其為不免矣！

  夫欲免為形者，莫如棄世。

  棄世則無累，無累則正平，正平則與彼更生，更生則幾矣！

  事奚足棄而生奚足遺？

  棄事則形不勞，遺生則精不虧。

  夫形全精復，與天為一。

  天地者，萬物之父母也。

  合則成體，散則成始。

  形精不虧，是謂能移。

  精而又精，反以相天。

  子列子問關尹曰：「至人潛行不窒，蹈火不熱，行乎萬物之上而不慄。

  請問何以至於此？

  」關尹曰：「是純氣之守也，非知巧果敢之列。

  居，予語女！

  凡有貌象聲色者，皆物也，物與物何以相遠？

  夫奚足以至乎先？

  是色而已。

  則物之造乎不形，而止乎無所化。

  夫得是而窮之者，物焉得而止焉！

  彼將處乎不淫之度，而藏乎無端之紀，游乎萬物之所終始。

  壹其性，養其氣，合其德，以通乎物之所造。

  夫若是者，其天守全，其神無郤，物奚自入焉！

  夫醉者之墜車，雖疾不死。

  骨節與人同而犯害與人異，其神全也。

  乘亦不知也，墜亦不知也，死生驚懼不入乎其胸中，是故遻物而不慴。

  彼得全於酒而猶若是，而況全於天乎？

  聖人藏於天，故莫之能傷也。

  復讎者，不折鏌干；

  雖有忮心者，不怨飄瓦，是以天下平均。

  故無攻戰之亂，無殺戮之刑者，由此道也。

  不開人之天，而開天之天。

  開天者德生，開人者賊生。

  不厭其天，不忽於人，民幾乎以其真。

  」仲尼適楚，出於林中，見佝僂者承蜩，猶掇之也。

  仲尼曰：「子巧乎，有道邪？

  」曰：「我有道也。

  五六月累丸二而不墜，則失者錙銖；

  累三而不墜，則失者十一；

  累五而不墜，猶掇之也。

  吾處身也，若厥株拘；

  吾執臂也，若槁木之枝。

  雖天地之大，萬物之多，而唯蜩翼之知。

  吾不反不側，不以萬物易蜩之翼，何為而不得！

  」孔子顧謂弟子曰：「用志不分，乃凝於神。

  其佝僂丈人之謂乎！

  」顏淵問仲尼曰：「吾嘗濟乎觴深之淵，津人操舟若神。

  吾問焉，曰：「操舟可學邪？

  」曰：「可。

  善游者數能。

  若乃夫沒人，則未嘗見舟而便操之也。

  」吾問焉而不吾告，敢問何謂也？

  」仲尼曰：「善游者數能，忘水也。

  若乃夫沒人之未嘗見舟而便操之也，彼視淵若陵，視舟之覆，猶其車卻也。

  覆卻萬方陳乎前而不得入其舍，惡往而不暇！

  以瓦注者巧，以鉤注者憚，以黃金注者殙。

  其巧一也，而有所矜，則重外也。

  凡外重者內拙。

  」田開之見周威公，威公曰：「吾聞祝腎學生，吾子與祝腎游，亦何聞焉？

  」田開之曰：「開之操拔篲以侍門庭，亦何聞於夫子！

  」威公曰：「田子無讓，寡人願聞之。

  」開之曰：「聞之夫子曰：「善養生者，若牧羊然，視其後者而鞭之。

  」」威公曰：「何謂也？

  」田開之曰：「魯有單豹者，巖居而水飲，不與民共利，行年七十而猶有嬰兒之色，不幸遇餓虎，餓虎殺而食之。

  有張毅者，高門縣薄，無不走也，行年四十而有內熱之病以死。

  豹養其內而虎食其外，毅養其外而病攻其內。

  此二子'
