sutra_id: BAU_FEAR
collection: Brihadaranyaka Upanishad
section: 1.4.2
title: Fear Arises from a Second
sanskrit: द्वितीयाद् वै भयं भवति
transliteration: dvitīyād vai bhayaṃ bhavati
translation: For truly, fear arises from a second.
commentary: '«Fear Arises from a Second» is a Yājñavalkya-mode cut against objectifying the Absolute:
  the teaching proceeds by negation, honey-correspondence, or the Self as light when outer lights fail.
  The passage asks a living reader to test the claim in experience rather than treat it as museum doctrine.
  Hold the argument until its force lands in attention, then let practice carry one concrete shift into
  the next hour of ordinary life. This is the demand of a living tradition: insight without application
  remains incomplete. Return again to the original wording when the mind wants to smooth the edge. Return
  again to the original wording when the mind wants to smooth the edge.'
abhyasa: 'When fear or craving appears, ask once: what ''second'' am I positing against myself right now?'
themes:
- self
- knowledge
- fear
- freedom
- attention
