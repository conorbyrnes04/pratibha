sutra_id: BAU_NETI
collection: Brihadaranyaka Upanishad
section: 2.3.6 / 3.9.26 (neti neti)
title: Not This, Not This
sanskrit: अथात आदेशो नेति नेति / न ह्य् एतस्माद् इति नेत्य् अन्यत् परम् अस्ति
transliteration: athāta ādeśo neti neti / na hy etasmād iti nety anyat param asti
translation: 'Hence there is the teaching: Not this, not this. For there is nothing higher than this ''not
  this.'''
commentary: '«Not This, Not This» is a Yājñavalkya-mode cut against objectifying the Absolute: the teaching
  proceeds by negation, honey-correspondence, or the Self as light when outer lights fail. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.'
abhyasa: 'When fear or craving appears, ask once: what ''second'' am I positing against myself right now?'
themes:
- self
- knowledge
- fear
- freedom
- attention
