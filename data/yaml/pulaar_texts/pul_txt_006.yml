collection: Pulaar Texts
section: teaching_passage
title: The Heart Is Not a Joint
sanskrit: berde wana hofūru, sako hofe.
transliteration: '*berde*: heart (as seat of feeling). *hofūru*: a joint (articulation
  that bends). *sako hofe*: so that it might be bent / folded.'
translation: The heart is not a joint, that it might be bent.
commentary: 'The claim is that feeling is not an obedient limb. A joint exists to
  flex on command. The heart does not. Gaden: sentiment cannot be ordered. This is
  the Pulaar refusal of a certain Islamicate and colonial fantasy — that the inner
  can be drilled like the body at circumcision, where Lasnet saw impassibility. Impassibility
  is the face. *Berde* is not the face. You can keep the face still. You cannot hinge
  the heart.


  The proverb is not a romantic license to follow every impulse. It is a limit on
  tyranny, including self-tyranny. You may require conduct. You may not require love,
  grief, or desire to take the angle you prefer. *Pulaaku* as later named is composure.
  This *mallol* is the remainder: composure is not the same as a bent heart.


  Existentially: stop commanding yourself to feel otherwise as if the heart were an
  elbow. Change the situation, the company, the act. Leave the heart its unhinged
  nature. That honesty is already a practice.


  Key Terms:


  **berde** - heart as organ of feeling -> not anatomical cardiology; the inner that
  will not take orders.


  **hofūru** - joint, articulation -> the body''s obedient bend -> the metaphor''s
  insult: do not treat the heart as a knee.


  **sako** - so that / as if it were the kind of thing that... -> counterfactual purpose:
  it is *not* that kind of thing.


  **wana** - is not -> the same negation-pattern as the father''s *wonā*.


  Cross-Tradition Resonances:


  **Pascal''s reasons of the heart:** Both deny that the heart is a syllogism or a
  lever.

  *Divergence:* Pascal''s heart knows God; this proverb does not name what the heart
  knows, only that it will not bend on command.


  **Stoic *propatheia* vs judgment:** Both distinguish inner weather from commanded
  virtue.

  *Divergence:* Stoics train judgment to withhold assent; this proverb does not promise
  training will hinge the *berde*.


  **Kashmir Śaiva heart (*hṛdaya*) as center:** Both put the heart at the center of
  a person.

  *Divergence:* Śaiva *hṛdaya* is consciousness itself; Pulaar *berde* is stubborn
  feeling.'
voice_of_siva: ''
abhyasa: Catch one sentence today that begins "I should feel..." Stop it. Keep the
  outer duty if there is one. Do not order the heart as if it were a joint. Notice
  what it actually does when you stop bending it.
