sutra_id: PUL_TXT_005
collection: Pulaar Texts
section: teaching_passage
title: Truth Catches the Lie
sanskrit: so pene dawi, so gōnga hirdi. mā hebto pene.
transliteration: '*pene*: lies. *dawi*: set out early. *gōnga*: truth. *hirdi*: set
  out in the evening. *mā hebto*: it will overtake.'
translation: If the lies set out early and the truth in the evening, it will overtake
  the lies.
commentary: 'The claim is temporal and almost pastoral: departure times. Lies leave
  at dawn, hustling. Truth leaves in the evening, late. The proverb does not say truth
  is faster in essence. It says truth *catches up*. Gaden''s gloss is the European
  flattening: "truth always comes out." The Pulaar image is a road. Two parties have
  started. One had a head start. The late one still arrives on the early one''s back.


  This belongs with Fulɓe mobility. A herder knows that the one who left late can
  still meet the one who left first, if the first is a lie and the second is *gōnga*.
  The moral is patience without passivity. You do not have to win the morning. You
  have to be the thing that overtakes.


  Existentially: if you are late with the true word, do not despair of the morning''s
  rumor. Set out. The proverb is a promise to the late-teller, and a warning to the
  early-liar.


  Key Terms:


  **gōnga** - truth -> not "fact" only; the true word / true state -> "honesty" is
  too moralistic; this is what can travel and catch.


  **pene** - lies (plural) -> they travel as a group, with a head start.


  **dawi / hirdi** - leave early / leave in the evening -> pastoral clock, not clock-time
  -> dawn and dusk are when a camp actually moves.


  **hebto** - overtake, catch up -> physical verb for a moral event.


  Cross-Tradition Resonances:


  **Dào Dé Jīng on the slow conquering the fast:** Both trust the late, unhurried
  term.

  *Divergence:* Daoist softness wins by emptiness; here truth wins by pursuit on a
  road.


  **Gospel "what is whispered will be shouted":** Both promise exposure.

  *Divergence:* Christian apocalypse is a last day; this overtaking can happen this
  evening.


  **Heraclitus'' hidden nature that loves to hide:** Both delay the true.

  *Divergence:* Heraclitus'' nature stays partly hidden; *gōnga* is expected to arrive.'
voice_of_siva: ''
abhyasa: If a false version of something you know has already left this morning, do
  not match its speed with a louder lie. Speak the true version once, even late. Then
  stop. Let *hebto* be the proverb's job, not your panic.
