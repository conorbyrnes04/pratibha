sutra_id: PUL_TXT_010
collection: Pulaar Texts
section: teaching_passage
title: If an Elder Dances, Let Her Bind Her Hair
sanskrit: so maudo 'ami, yō mōro.
transliteration: '*maudo*: elder, great person. *''ami*: dances. *yō mōro*: let her/him
  bind the hair / coiffe. Gaden: an elder must not go to the dance unkempt; that is
  for children. Also: if you enter an affair, give yourself to it entirely.'
translation: If an elder dances, let them bind their hair.
commentary: 'The claim is that dignity is not abstinence from joy; it is the way joy
  is worn. An elder may dance. The proverb does not say *maudo* must sit. It says:
  if dancing, then *mōro* — hair bound, the head prepared. Children may arrive undone.
  Age may not. Gaden''s second gloss is the inner teaching: when you launch into an
  affair, devote yourself entirely. Half-dancing is the real indecency.


  This is *pulaaku*-adjacent without the later word: reserve is not joylessness. It
  is completeness of form. The ethnography saw Fulɓe gravity and rare dancing. The
  Pulaar proverb is more interesting than the stereotype. Dance, but do not dance
  as if you were still unformed.


  Existentially: pick one joy or one task you have been doing sloppily because you
  thought seriousness meant refusal. Do it. Bind the hair. Whole form, or don''t enter
  the circle.


  Key Terms:


  **maudo** - elder, a person of weight -> age and status; not merely "adult."


  **''ami** - dances -> allowed, not forbidden; the if-clause is permission plus condition.


  **mōro** - bind the hair, make the coiffure -> bodily readiness as the image of
  total commitment.


  **yō** - hortative "let..." -> a command of form, not a ban on the dance.


  Cross-Tradition Resonances:


  **Confucian ritual even in pleasure:** Both require form when the great person moves.

  *Divergence:* *Li* is a code of occasions; *mōro* is one concrete gesture standing
  for total entry.


  **Nietzsche''s dancing god:** Both refuse a dignity that cannot dance.

  *Divergence:* Nietzsche''s dance is unbinding; this dance is bound hair.


  **Father''s counsel (this collection):** Both teach a right way to occupy a role.

  *Divergence:* The father lists what relations are not; this proverb tells an elder
  how to be in joy.'
voice_of_siva: ''
abhyasa: 'Enter one thing today that you have been half-doing — a conversation, a
  craft, a rest. If you enter, bind the hair: prepare, dress the part, stay until
  the form is complete. If you will not, do not step into the circle and call it humility.'
