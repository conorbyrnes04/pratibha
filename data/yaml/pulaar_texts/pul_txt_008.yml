sutra_id: PUL_TXT_008
collection: Pulaar Texts
section: teaching_passage
title: What the Cow Ate, the Heifer Suckles
sanskrit: ko nagge nāmi, dūm nale muinata.
transliteration: '*nagge*: cow. *nāmi*: has eaten. *nale*: heifer / young cow. *muinata*:
  suckles, drinks as milk. The herd-vocabulary of the previous collection, now inside
  a Pulaar sentence.'
translation: What the cow has eaten is what the heifer suckles.
commentary: 'The claim is transmission as milk, not as lecture. The calf does not
  suckle a theory. She suckles what already became the mother''s body. Gaden: qualities
  and faults of parents pass to children. The image is more precise than "like father
  like son." Diet becomes blood becomes milk becomes the next body. A people whose
  remaining cult was the herd will say inheritance in the language of nursing. This
  is the Pulaar text that the ethnography of boolâtrie was circling and could not
  quote.


  The proverb is also a warning to the eater, not only a law about children. You are
  what will be drunk. Your *nāmi* — what you take in — is not private. It will be
  somebody''s milk. That is pastoral metaphysics in one clause.


  Existentially: look at what you are eating, hearing, envying, repeating. That is
  the future''s milk. Change the cow''s mouth if you care about the heifer.


  Key Terms:


  **nagge** - cow -> the sacred-economic animal of Fulɓe life, here the parent-body.


  **nale** - heifer, young female cattle -> the next generation as a nursing animal,
  not as an abstract "child."


  **nāmi / muinata** - has eaten / suckles -> two mouths, one substance -> "inherit"
  in English loses the mouths.


  **dūm** - that (very thing) -> identity of what was eaten and what is drunk; no
  remainder, no filter.


  Cross-Tradition Resonances:


  **Pulaar Tradition "The Remaining Cult Is the Herd" (this corpus):** Both put cattle
  at the center of meaning.

  *Divergence:* The ethnography is French *about* a cult; this is Pulaar *as* teaching.


  **Upaniṣadic food-chain (*annam*):** Both make eating a cosmological act.

  *Divergence:* The Upaniṣad generalizes food as Brahman; this proverb stays in the
  cow-heifer pair.


  **Biblical "the parents have eaten sour grapes":** Both transmit the eaten to the
  child.

  *Divergence:* Jeremiah can refuse inherited guilt; this *mallol* states the milk-law
  without a prophet''s override.'
voice_of_siva: ''
abhyasa: 'Before you take something in today — food, a story, a grievance — ask: would
  I want a young life to suckle this? If no, do not eat it. If yes, eat it as if you
  were already milk.'
