sutra_id: PUL_TXT_003
collection: Pulaar Texts
section: teaching_passage
title: Everything Is Done by a Cause
sanskrit: hüde fuf, ko sababu wadata.
transliteration: '*hüde fuf*: every thing / affair. *sababu* (from Arabic *sabab*):
  cause, motive. *wadata*: does it, makes it happen.'
translation: Every affair — it is a cause that does it.
commentary: 'The claim is causal without being mechanical. Nothing just occurs. A
  *sababu* does it. Gaden places this as the first of his "proverbes et locutions
  proverbiales," and the next proverb rhymes it: water is not salty without a reason.
  Futa Pulaar, already deep in Islam, uses an Arabic loan for cause and a Pulaar verb
  for the doing. The world is not a pile of accidents. It is a field of reasons, including
  reasons people will not admit.


  This is not yet Western determinism. *Sababu* in Sahelian usage includes motive,
  pretext, the hidden why, the social cause. To say *ko sababu wadata* is to refuse
  both "God did it, so do not look" and "it just happened." Look for the cause. The
  looking is the practice.


  Existentially: stop calling your pattern bad luck. Name the *sababu*. If you cannot
  name one, you are not done looking. The proverb does not say the cause is always
  just. It says there is one.


  Key Terms:


  **hüde** - thing, affair, matter -> not a physical object only; a happening -> "everything"
  in English is too cosmic; this is every *case*.


  **sababu** - cause, reason (Arabic *sabab* in Pulaar) -> loanword as conceptual
  tool -> "reason" in the philosophical sense, not "excuse" only, though pretext is
  included.


  **wadata** - does / makes (it) -> the cause is an agent-like doer -> English "is
  caused" is too passive.


  **fuf** - all, every -> totality of affairs, not of atoms.


  Cross-Tradition Resonances:


  **Aristotle on *aitia*:** Both refuse uncaused happenings.

  *Divergence:* Aristotle''s four causes are a technical system; *sababu* is a proverb''s
  one word for why.


  **Qur''anic *sabab*:** Both inherit the Arabic root.

  *Divergence:* The Qur''an can mean a cord, a way, a means to heaven; Futa usage
  here is everyday causality.


  **Heraclitus'' hidden harmony:** Both say the presented event is not the whole story.

  *Divergence:* Heraclitus hides a *logos*; this proverb demands you find a *sababu*.'
voice_of_siva: ''
abhyasa: Take one thing that "just happened" this week. Do not stop at luck or fate.
  Name one *sababu* you can actually point to — a choice, a hunger, a fear, a word.
  If the first name is false, look again.
