sutra_id: PUL_TXT_009
collection: Pulaar Texts
section: teaching_passage
title: The Good Morning Is Known from Dawn
sanskrit: subaka moddo 'andeté ko gila fadiri.
transliteration: '*subaka*: morning (also the Islamic dawn prayer''s time). *moddo*:
  good, excellent. *''andeté*: is known / recognized. *gila fadiri*: from the first
  light, from dawn.'
translation: The good morning is recognized from the first light.
commentary: 'The claim is that quality shows at the start, not at the advertisement
  of noon. Gaden: one sees in the child what the adult will be; one knows from the
  outset what a new chief is worth. The next proverb repeats it botanically: what
  fruits begins by flowering. Futa speech trusts beginnings. This is not fortune-telling.
  It is attention. Dawn is small. It is already the day, or it is not.


  *Subaka* is also the hour of *subaka* prayer. A good morning in an Islamic river
  valley is both weather and worship. The proverb does not need to choose. First light
  is enough to know. If you must wait until noon to see whether a person, a project,
  or a rule is good, you have been refusing dawn.


  Existentially: look at the first five minutes. They are not a draft. They are already
  the morning. Adjust there, not in a speech at midday.


  Key Terms:


  **subaka** - morning, dawn-time -> Islamic and pastoral at once -> "morning" in
  English misses the prayer-hour.


  **fadiri** - first light, aurora -> the smallest beginning that already tells.


  **moddo** - good, as a morning can be good -> qualitative, not moralistic "virtuous."


  **''andeté** - is known (passive / middle of knowing) -> recognition, not inference
  from a report.


  Cross-Tradition Resonances:


  **Dào Dé Jīng on the tiny that is already the great:** Both read the dawn as the
  day.

  *Divergence:* Daoist tiny is uncarved; this dawn is already classed as *moddo* or
  not.


  **Matthew "by their fruits":** Both read early signs.

  *Divergence:* Fruit is an end; *fadiri* is a beginning that already counts as knowledge.


  **Proverb 147 in the same Gaden list (flower then fruit):** Both Futa *mallol* teach
  beginning-as-verdict.

  *Divergence:* 147 is botanical sequence; 146 is temporal recognition.'
voice_of_siva: ''
abhyasa: Tomorrow, do not wait until the day has an opinion of itself. At first light
  — or at the first five minutes of a task — name whether it is *moddo*. If it is
  not, change the opening, not the alibi at noon.
