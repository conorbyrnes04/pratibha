sutra_id: CHU_VI_01
collection: Chāndogya Upaniṣad
section: Chāndogya Upaniṣad VI.1
title: 'Beyond Vedic Knowledge: The Instruction of Non-Dual Awareness'
anchor_translation: 'There lived once Svetaketu Aruneya (the grandson of Aruna). To
  him his father (Uddalaka, the son of Aruna) said: ''Svetaketu, go to school; for
  there is none belonging to our race, darling, who, not having studied (the Veda),
  is, as it were, a Brahmana by birth only.


  Having begun his apprenticeship (with a teacher) when he was twelve years of age,
  Svetaketu returned to his father, when he was twenty-four, having then studied all
  the Vedas, — conceited, considering himself well-read, and stern.


  His father said to him: ''Svetaketu, as you are so conceited, considering yourself
  so well-read, and so stern, my dear, have you ever asked for that instruction by
  which we hear what cannot be heard, by which we perceive what cannot be perceived,
  by which we know what cannot be known?''


  ''What is that instruction, Sir?'' he asked. The father replied: ''My dear, as by
  one clod of clay all that is made of clay is known, the difference being only a
  name, arising from speech, but the truth being that all is clay;


  And as, my dear, by one nugget of gold all that is made of gold is known, the difference
  being only a name, arising from speech, but the truth being that all is gold;


  And as, my dear, by one pair of nail-scissors all that is made of iron (karshayasam)
  is known, the difference being only a name, arising from speech, but the truth being
  that all is iron, — thus, my dear, is that instruction.


  The son said: ''Surely those venerable men (my teachers) did not know that. For
  if they had known it, why should they not have told it me? Do you, Sir, therefore
  tell me that?'' ''Be it so,'' said the father.'
sanskrit: तत्त्वमसि (tattvamasi) is not directly mentioned in this passage, but the
  concept of non-dual awareness is introduced through the examples of clay, gold,
  and iron.
transliteration: 'The key phrases in IAST are: *tad vidyāt tad vijñānam* (that instruction
  by which we know what cannot be known), *nāmaiva vikāraḥ* (the difference being
  only a name), and *satyam* (the truth).'
translation: The instruction that allows us to hear the inaudible, perceive the imperceptible,
  and know the unknowable is the understanding that all things are essentially one.
  Just as one clod of clay represents all things made of clay, one nugget of gold
  represents all things made of gold, and one pair of nail-scissors represents all
  things made of iron, so too can we understand the unity of all existence. The differences
  we perceive are merely names and forms, but the truth is that all is one.
commentary: 'The counterintuitive move made in this passage is the suggestion that
  true knowledge lies beyond the realm of Vedic studies. Uddalaka''s instruction to
  Svetaketu implies that the understanding of non-dual awareness is not something
  that can be learned through traditional means, but rather it requires a direct experience
  of the truth. This idea is central to the Upaniṣadic tradition, which often critiques
  the limitations of Vedic knowledge and seeks to reveal a more profound understanding
  of reality. The existential application of this idea is that it encourages us to
  look beyond the surface level of reality and to seek a deeper understanding of the
  unity that underlies all things. By recognizing that all differences are merely
  names and forms, we can begin to transcend the boundaries that separate us and experience
  a sense of oneness with all existence.


  Key Terms:


  * **Tat** (तत्) — etymology: "that" -> tradition-specific meaning: the ultimate
  reality -> what default translation misses: the implication that reality is not
  just a static concept, but a dynamic and living presence.

  * **Vidyā** (विद्या) — etymology: "knowledge" -> tradition-specific meaning: spiritual
  knowledge or understanding -> what default translation misses: the distinction between
  intellectual knowledge and direct experience.

  * **Nāma** (नाम) — etymology: "name" -> tradition-specific meaning: the label or
  concept we assign to something -> what default translation misses: the idea that
  names and concepts are mere conventions and do not reflect the true nature of reality.

  * **Satyam** (सत्यम) — etymology: "truth" -> tradition-specific meaning: the ultimate
  reality or essence of existence -> what default translation misses: the implication
  that truth is not just a static concept, but a living and dynamic presence that
  underlies all existence.


  Cross-Tradition Resonances:


  * **Tao Te Ching, Chapter 1:** structural homology: the idea that names and concepts
  are mere conventions and do not reflect the true nature of reality. *Divergence:*
  the Tao Te Ching emphasizes the importance of embracing the mystery and uncertainty
  of reality, while the Chāndogya Upaniṣad seeks to reveal a more profound understanding
  of the unity that underlies all things.

  * **Plotinus, Enneads VI.9:** structural homology: the idea that the ultimate reality
  is a unified and undivided whole. *Divergence:* Plotinus emphasizes the importance
  of the individual''s ascent to the higher levels of reality, while the Chāndogya
  Upaniṣad emphasizes the importance of recognizing the unity that underlies all existence.'
abhyasa: 'As you go about your daily activities, notice the ways in which you assign
  names and concepts to things. Recognize that these labels are mere conventions and
  do not reflect the true nature of reality. Allow yourself to see beyond the surface
  level of existence and to experience the unity that underlies all things. Ask yourself:
  what is the truth that lies beyond the names and forms that I assign to the world?'
