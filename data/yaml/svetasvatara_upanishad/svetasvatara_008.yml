sutra_id: SVU_008
collection: Svetasvatara Upanishad
section: teaching_passage
title: Fire by Friction, Self by Om
sanskrit: 'वह्नेर्यथा योनिगतस्य मूर्तिर्न दृश्यते नैव च लिङ्गनाशः ।

  स भूय एवेन्धनयोनिगृह्यस्तद्वोभयं वै प्रणवेन देहे ॥ १.१३ ॥


  स्वदेहमरणिं कृत्वा प्रणवञ्चोत्तरारणिम् ।

  ध्याननिर्मथनाभ्यासाद्देवं पश्येन्निगूढवत् ॥ १.१४ ॥


  तिलेषु तैलं दधनीव सर्पिरापः स्रोतःस्वरणीषु चाग्निः ।

  एवमात्माऽत्मनि गृह्यतेऽसौ सत्येनैनं तपसा योऽनुपश्यति ॥ १.१५ ॥


  सर्वव्यापिनमात्मानं क्षीरे सर्पिरिवार्पितम् ।

  आत्मविद्यातपोमूलं तद्ब्रह्मोपनिषत्परम् ॥ १.१६ ॥'
transliteration: 'vahner yathā yoni-gatasya mūrtir na dṛśyate naiva ca liṅga-nāśaḥ
  |

  sa bhūya evendhana-yoni-gṛhyas tad ubhayaṃ vai praṇavena dehe || 1.13 ||


  sva-deham araṇiṃ kṛtvā praṇavaṃ cottarāraṇim |

  dhyāna-nirmathana-abhyāsād devaṃ paśyen nigūḍhavat || 1.14 ||


  tileṣu tailaṃ dadhanīva sarpir āpaḥ srotaḥsu araṇīṣu cāgniḥ |

  evam ātmā ātmani gṛhyate''sau satyenainaṃ tapasā yo''nupaśyati || 1.15 ||


  sarva-vyāpinam ātmānaṃ kṣīre sarpir ivārpitam |

  ātma-vidyā-tapo-mūlaṃ tad brahmopaniṣat param || 1.16 ||'
translation: 'As fire latent in wood is unseen yet not absent, so the hidden Self
  remains; by the right means it is brought forth again.


  Make the body the lower fire-stick and Om the upper; through the repeated churning
  of meditation, behold the Divine hidden within.


  As oil in sesame, butter in curd, water in a dry bed, and fire in wood, so the Self
  is found in oneself by truthfulness and disciplined ardor.


  The all-pervading Self is present like butter in milk; self-knowledge rooted in
  tapas is the highest teaching of Brahman.'
commentary: 'This cluster offers one of the most practical contemplative grammars
  in the Upaniṣads. The central claim is not that the Self must be imported from outside,
  but uncovered through correct friction. Latency, not absence, is the governing metaphysical
  category. The Divine is concealed by inattention, dispersion, and untrained embodiment,
  not by ontological distance.


  The body is not rejected; it is instrumented. By naming the body as lower arani
  and Om as upper arani, the text joins somatic stability, mantra-intentionality,
  and meditative repetition into one process. Realization is therefore neither anti-physical
  nor merely conceptual. It is psycho-somatic concentration that becomes transparent
  to source.


  The analogies (oil, butter, water, fire) also correct impatience: extraction requires
  method, pressure, and time. "Truth" and "tapas" are not moral ornaments but operational
  requirements. Without honesty of seeing and heat of disciplined practice, hidden
  potential remains hidden. This passage is thus a manual statement: sustained contemplative
  labor transforms latent metaphysics into lived recognition.


  Key Terms:


  **arani (अरणि)** - fire-stick pair used for kindling; here a contemplative technology
  symbolizing disciplined activation of latent realization.


  **pranava (प्रणव)** - Om as sonic seed and orienting axis of contemplative attention.


  **tapas (तपस्)** - heat, ardor, disciplined intensity that refines and reveals;
  not mere ascetic harshness.


  Cross-Tradition Resonances:


  **Yoga Sutra 1.23 and 1.28:** Similar use of focused devotion and mantra repetition
  to steady and open awareness. *Divergence:* Yoga Sutra is more technical-psychological,
  less explicitly ontological-theistic.


  **Hesychasm (Jesus Prayer):** Repetition with embodied posture and breath for heart-centering
  awareness. *Divergence:* Christological devotional frame differs from Om-centered
  Upaniṣadic language.


  **Zen koan practice:** Repeated disciplined "friction" that burns through conceptual
  fixation. *Divergence:* Zen minimizes metaphysical assertions that this passage
  explicitly affirms.'
voice_of_siva: ''
abhyasa: Sit upright for 12 minutes daily. On each inhale silently sound "O," on each
  exhale "M." Keep attention at the heart center and treat distractions as unlit wood.
  Continue until attention feels heated, steady, and quietly luminous.
