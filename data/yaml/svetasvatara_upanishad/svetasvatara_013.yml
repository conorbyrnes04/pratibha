sutra_id: SVU_013
collection: Svetasvatara Upanishad
section: teaching_passage
title: Knowledge and Ignorance in the Imperishable
sanskrit: 'द्वे अक्षरे ब्रह्मपरे त्वनन्ते विद्या अविद्ये निहिते यत्र गूढे ।

  क्षरं त्वविद्या ह्यमृतं तु विद्या विद्याविद्ये ईशते यस्तु सोऽन्यः ॥ ५.१ ॥'
transliteration: 'dve akṣare brahma-pare tv anante vidyā avidye nihite yatra gūḍhe
  |

  kṣaraṃ tv avidyā hy amṛtaṃ tu vidyā vidyāvidye īśate yas tu so''nyaḥ || 5.1 ||'
translation: 'In the imperishable, infinite, supreme Brahman, two are hidden: knowledge
  and ignorance. Ignorance is perishable; knowledge is immortal. Yet the One who governs
  both knowledge and ignorance is other than both.'
commentary: 'This verse offers a subtle non-dual epistemology. It does not simply
  oppose ignorance and knowledge as two equal absolutes. Both are situated within
  a higher ground, and both are governed by a principle beyond them. Even liberating
  knowledge is not final ontology; it is a mode within the field of Brahman.


  The practical consequence is profound humility. Spiritual insight does not authorize
  egoic superiority, because knower-status itself remains derivative. Ignorance binds,
  knowledge frees, but both are still under the sovereignty of the Real. This prevents
  epistemic triumphalism and keeps liberation from becoming another identity performance.


  Theologically, the verse also integrates transcendence with pedagogy. If the Lord
  governs both vidya and avidya, then the path includes concealment and revelation
  as meaningful phases, not accidental defects. Confusion is not glorified, but neither
  is it metaphysically independent. The seeker is invited to cooperate with discernment
  while surrendering ownership of awakening.


  Key Terms:


  **vidya (विद्या)** - liberating knowledge that aligns awareness with reality, not
  mere information.


  **avidya (अविद्या)** - mis-knowing/superimposition that generates bondage; perishable
  when seen through.


  **so''nyah (सोऽन्यः)** - "that one is other": the governing reality exceeds both
  cognitive states.


  Cross-Tradition Resonances:


  **Isa Upanishad 9-11:** Joint handling of vidya and avidya with a non-binary soteriology.


  **Nagarjuna (two truths caution):** Insight states are skillful means, not final
  substances. *Divergence:* Śvetāśvatara keeps explicit īśvara framework.


  **Cloud of Unknowing (Christian mysticism):** Knowing and unknowing both transcended
  in God. *Divergence:* doctrinal scaffolding differs.'
