sutra_id: SVU_015
collection: Svetasvatara Upanishad
section: teaching_passage
title: Refuge, Transmission, and Ripeness
sanskrit: 'यो ब्रह्माणं विदधाति पूर्वं यो वै वेदांश्च प्रहिणोति तस्मै ।

  तं ह देवं आत्मबुद्धिप्रकाशं मुमुक्षुर्वै शरणमहं प्रपद्ये ॥ ६.१८ ॥


  यस्य देवे परा भक्तिर्यथा देवे तथा गुरौ ।

  तस्यैते कथिता ह्यर्थाः प्रकाशन्ते महात्मनः ॥ ६.२३ ॥'
transliteration: 'yo brahmāṇaṃ vidadhāti pūrvaṃ yo vai vedāṃś ca prahiṇoti tasmai
  |

  taṃ ha devaṃ ātma-buddhi-prakāśaṃ mumukṣur vai śaraṇam ahaṃ prapadye || 6.18 ||


  yasya deve parā bhaktir yathā deve tathā gurau |

  tasy ete kathitā hy arthāḥ prakāśante mahātmanaḥ || 6.23 ||'
translation: 'To the One who first brings forth Brahma and imparts the Vedas, to that
  God who illumines inner intelligence, I - seeking liberation - take refuge.


  For the great soul who has supreme devotion to God, and to the teacher as to God,
  these teachings become luminous in meaning.'
commentary: 'The Upaniṣad closes with a transmission doctrine: realization is not
  merely private cognition but relational illumination. Verse 6.18 places refuge at
  the center of liberative intent. This is not dependency in the weak sense; it is
  ontological alignment - consciously placing one’s seeking under the light that already
  precedes intellect.


  Verse 6.23 then states a difficult but crucial condition: teachings "shine forth"
  when devotion to the Divine and reverence toward the teacher are integrated. This
  does not authorize authoritarianism; rather, it names a psychological and spiritual
  fact: defensive ego cannot receive transformative knowledge deeply. Reverence here
  is an epistemic virtue - a posture that allows meaning to penetrate beyond conceptual
  agreement.


  The two verses together prevent two errors: anti-intellectual piety and disembodied
  intellectualism. One needs insight, devotion, and right relation to guidance. Transmission
  is thus participatory: truth is heard, practiced, and ripened in a field of trust.


  Key Terms:


  **saranam prapadye (शरणं प्रपद्ये)** - I take refuge; deliberate entrustment of
  the seeking self.


  **atma-buddhi-prakasha (आत्मबुद्धिप्रकाश)** - that which illumines inner intelligence
  from within.


  **para bhakti (परा भक्ति)** - supreme devotion; total orientation of being, not
  occasional sentiment.


  Cross-Tradition Resonances:


  **Bhagavad Gita 4.34:** approach to teacher with humility, inquiry, and service.


  **Sufi suhba/adab:** transformative knowledge requires disciplined reverence in
  transmission relationship.


  **Zen lineage emphasis:** awakening is confirmed and clarified in teacher-student
  relational field.'
