sutra_id: SVU_019
collection: Svetasvatara Upanishad
section: teaching_passage
title: One Without Color, Manifest as All Forms
sanskrit: 'य एकोऽवर्णो बहुधा शक्तियोगाद्वर्णाननेकान्निहितार्थो दधाति ।

  विचैति चान्ते विश्वमादौ स देवः स नो बुद्ध्या शुभया संयुनक्तु ॥ ४.१ ॥


  तदेवाग्निस्तदादित्यस्तद्वायुस् तदु चन्द्रमाः ।

  तदेव शुक्रं तद् ब्रह्म तदापः स प्रजापतिः ॥ ४.२ ॥


  त्वं स्त्री त्वं पुमानसि त्वं कुमार उत वा कुमारी ।

  त्वं जीर्णो दण्डेन वञ्चसि त्वं जातो भवसि विश्वतोमुखः ॥ ४.३ ॥'
transliteration: 'ya eko''varṇo bahudhā śakti-yogād varṇān anekān nihitārtho dadhāti
  |

  vicaiti cānte viśvam ādau sa devaḥ sa no buddhyā śubhayā saṃyunaktu || 4.1 ||


  tad evāgnis tad ādityas tad vāyus tad u candramāḥ |

  tad eva śukraṃ tad brahma tad āpaḥ sa prajāpatiḥ || 4.2 ||


  tvaṃ strī tvaṃ pumān asi tvaṃ kumāra uta vā kumārī |

  tvaṃ jīrṇo daṇḍena vañcasi tvaṃ jāto bhavasi viśvato-mukhaḥ || 4.3 ||'
translation: 'The One, without determinate color, through power manifests many colors/forms
  in hidden purpose, and gathers the universe at beginning and end.


  That is fire, sun, wind, moon, purity, Brahma, waters, and lord of creatures.


  You are woman, man, youth, maiden, elder with staff; being born, You appear facing
  all directions.'
commentary: 'This section is a masterclass in non-exclusive unity. The One is *avarna*
  (without determinate mark), yet appears as all marks. The text avoids both blank
  abstraction and polytheistic fragmentation by affirming one source manifesting as
  many divine and human forms.


  Verse 4.3 is especially radical in anthropological scope: gendered and age-based
  identities become modes of one Presence. This does not erase difference; it dislodges
  ontological hierarchy. Every embodied form becomes a site of theophany.


  The philosophical implication is participatory pluralism: multiplicity is real and
  meaningful, but none of its forms are ultimate in isolation. This supports both
  devotion and inclusivity without collapsing into relativism.


  Key Terms:


  **avarna (अवर्ण)** - without determinate attribute-color; not a negation of manifestation,
  but freedom from confinement by any single form.


  **shakti-yoga (शक्तियोग)** - conjunction/operation of power through which manifestation
  occurs.


  **vishvato-mukha (विश्वतोमुख)** - facing all directions; omnidirectional presence
  in lived multiplicity.


  Cross-Tradition Resonances:


  **Bhagavad Gita 9.16-19:** "I am sacrifice, fire, offering..." similar all-form
  theophany.


  **Isha Upanishad 1:** all this pervaded by the Lord.


  **Ibn Arabi (divine names in forms):** one reality reflected in many loci.'
