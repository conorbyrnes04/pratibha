sutra_id: SVU_021
collection: Svetasvatara Upanishad
section: teaching_passage
title: The Individual Soul, Karma, and Release
sanskrit: 'गुणान्वयो यः फलकर्मकर्ता कृतस्य तस्यैव स चोपभोक्ता ।

  स विश्वरूपस्त्रिगुणस्त्रिवर्त्मा प्राणाधिपः संचरति स्वकर्मभिः ॥ ५.७ ॥


  वालाग्रशतभागस्य शतधा कल्पितस्य च ।

  भागो जीवः स विज्ञेयः स चानन्त्याय कल्पते ॥ ५.९ ॥


  नैव स्त्री न पुमानेष न चैवायं नपुंसकः ।

  यद्यच्छरीरमादत्ते तेन तेन स रक्ष्यते ॥ ५.१० ॥


  अनाद्यनन्तं कलिलस्य मध्ये विश्वस्य स्रष्टारमनेक रूपम् ।

  विश्वस्यैकं परिवेष्टितारं ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ ५.१३ ॥'
transliteration: 'guṇānvayo yaḥ phala-karma-kartā kṛtasya tasyaiva sa copabhoktā |

  sa viśvarūpas tri-guṇas tri-vartmā prāṇādhipaḥ saṃcarati sva-karmabhiḥ || 5.7 ||


  vālāgra-śata-bhāgasya śatadhā kalpitasya ca |

  bhāgo jīvaḥ sa vijñeyaḥ sa cānantyāya kalpate || 5.9 ||


  naiva strī na pumān eṣa na caivāyaṃ napuṃsakaḥ |

  yad yac charīram ādatte tena tena sa rakṣyate || 5.10 ||


  anādy-anantaṃ kalilasya madhye viśvasya sraṣṭāram aneka-rūpam |

  viśvasy ekaṃ pariveṣṭitāraṃ jñātvā devaṃ mucyate sarva-pāśaiḥ || 5.13 ||'
translation: 'The embodied self, linked with qualities, acts and receives the fruits
  of action, moving through forms by its own karma.


  Though described as finer than a divided hair-tip, the jiva is capable of infinitude.


  It is not essentially female, male, or neuter; it is associated with whatever body
  it assumes.


  Knowing the beginningless, endless Divine - creator amid confusion, one embracer
  of all - one is released from every bond.'
commentary: 'Chapter V gives a nuanced anthropology: the individual self is karmically
  conditioned yet potentially infinite. The text avoids both fatalism and naive freedom-talk.
  As long as identity remains bound to guṇa-patterns, action and consequence circulate.
  Yet this conditioned traveler is not ontologically trivial; it carries an opening
  to the infinite.


  Verse 5.10 is particularly important for contemporary reading. Gendered embodiment
  is acknowledged as real at the level of lived form, yet denied ultimacy at the level
  of self-nature. This can ground dignity without erasing embodied realities.


  The chapter culminates by reconnecting the individual arc to divine recognition.
  Release does not come from self-analysis alone, but from knowing the One who contains
  the field in which karmic becoming unfolds. The jiva’s infinitude matures through
  recognition, not inflation.


  Key Terms:


  **guna-anvaya (गुणान्वय)** - linkage to modal qualities; the conditioning texture
  of embodied experience.


  **jiva (जीव)** - living individual self, conditioned yet open to the infinite.


  **sarva-pasha (सर्वपाश)** - all bonds/fetters; includes cognitive, karmic, and affective
  binding.


  Cross-Tradition Resonances:


  **Bhagavad Gita 13 and 14:** field, knower, and guṇa-conditioning parallels.


  **Buddhist dependent self without essence:** overlap on conditioned becoming; divergence
  on eternal self claims.


  **Astavakra witness doctrine:** freedom via dis-identification from changing modes.'
