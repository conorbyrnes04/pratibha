sutra_id: SVU_010
collection: Svetasvatara Upanishad
section: teaching_passage
title: Rudra Without a Second
sanskrit: 'य एको जालवान् ईशत ईशनीभिः सर्वान् लोकानीशत ईशनीभिः ।

  य एवैक उद्भवे संभवे च य एतद्विदुरमृतास्ते भवन्ति ॥ ३.१ ॥


  एको हि रुद्रो न द्वितीयाय तस्थुर्य इमान् लोकानीशत ईशनीभिः ।

  प्रत्यङ्जनांस्तिष्ठति संचुकोचान्तकाले संसृज्य विश्वा भुवनानि गोपाः ॥ ३.२ ॥'
transliteration: 'ya eko jālavān īśata īśanībhiḥ sarvān lokān īśata īśanībhiḥ |

  ya evaika udbhave saṃbhave ca ya etad vidur amṛtās te bhavanti || 3.1 ||


  eko hi rudro na dvitīyāya tasthur ya imān lokān īśata īśanībhiḥ |

  pratyaṅ janāṃs tiṣṭhati saṃcukocānta-kāle saṃsṛjya viśvā bhuvanāni gopāḥ || 3.2
  ||'
translation: 'The One, net-caster and ruler by sovereign powers, governs all worlds
  through arising and continuity; those who know this become immortal.


  Rudra is one; no second stands beside Him. He rules all worlds, stands inwardly
  in beings, creates and gathers the worlds at the end as their guardian.'
commentary: 'This is one of the Upaniṣad’s strongest monotheistic declarations, but
  it is not simple exclusivism. "No second" is a metaphysical claim about ultimacy,
  not a social claim about religious identity. Rudra is presented as creator, sustainer,
  withdrawer, and indwelling presence. The text thereby fuses cosmic transcendence
  and interior immanence in one theological center.


  The image of "net-caster" (*jalavan*) is crucial. The world is not accidental scatter
  but patterned projection. Yet projection does not imply abandonment: the same One
  remains as protector (*gopa*) and inward presence. This solves a classic tension:
  if God transcends the world, how is God present in it? The answer here is dynamic
  non-duality - the world proceeds from, is upheld by, and returns into one sovereignty.


  The practical consequence is existential trust with responsibility. One does not
  passively resign to fate; one acts within a world that is intelligible because grounded.
  Fear softens when fragmentation is re-read as patterned expression within one holding
  intelligence.


  Key Terms:


  **rudra (रुद्र)** - here not merely storm-deity but supreme lordly principle integrated
  with creator-sustainer-withdrawer functions.


  **na dvitiyaya (न द्वितीयाय)** - "for a second there is no standing": radical non-secondness
  at the level of ultimate sovereignty.


  **pratyang (प्रत्यङ्)** - inward-facing, interiorly present; supports inner realization,
  not only outer worship.


  Cross-Tradition Resonances:


  **Isaiah 45:5 ("I am the Lord, and there is none else")** parallels non-second divine
  sovereignty. *Divergence:* Śvetāśvatara combines this with explicit inner-self metaphysics.


  **Neoplatonic One:** Similar one-source doctrine. *Divergence:* Rudra language remains
  more personal and devotional.


  **Kashmir Shaiva non-dual theism:** Later systems develop this unity of transcendence
  and immanence with technical precision.'
voice_of_siva: ''
abhyasa: 'For one day, when fragmentation appears ("too many problems"), pause and
  recite inwardly: "One field, many expressions." Then choose one action that aligns
  with wholeness rather than panic reaction.'
