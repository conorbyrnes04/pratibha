sutra_id: ENN_V_1_09
collection: Plotinus Enneads
section: Ennead V, Tractate 1, Section 9
title: The Unity of the Intellectual Realm
anchor_translation: 'Anaxagoras, again, in his assertion of a Mind pure and unmixed,
  affirms a simplex First and a sundered One, though writing long ago he failed in
  precision.


  Heraclitus, with his sense of bodily forms as things of ceaseless process and passage,
  knows the One as eternal and intellectual.


  In Empedocles, similarly, we have a dividing principle, "Strife," set against "Friendship"-
  which is The One and is to him bodiless, while the elements represent Matter.


  Later there is Aristotle; he begins by making the First transcendent and intellective
  but cancels that primacy by supposing it to have self-intellection. Further he affirms
  a multitude of other intellective beings- as many indeed as there are orbs in the
  heavens; one such principle as in- over to every orb- and thus his account of the
  Intellectual Realm differs from Plato''s and, failing reason, he brings in necessity;
  though whatever reasons he had alleged there would always have been the objection
  that it would be more reasonable that all the spheres, as contributory to one system,
  should look to a unity, to the First.


  We are obliged also to ask whether to Aristotle''s mind all Intellectual Beings
  spring from one, and that one their First; or whether the Principles in the Intellectual
  are many.


  If from one, then clearly the Intellectual system will be analogous to that of the
  universe of sense-sphere encircling sphere, with one, the outermost, dominating
  all- the First [in the Intellectual] will envelop the entire scheme and will be
  an Intellectual [or Archetypal] Kosmos; and as in our universe the spheres are not
  empty but the first sphere is thick with stars and none without them, so, in the
  Intellectual Kosmos, those principles of Movement will envelop a multitude of Beings,
  and that world will be the realm of the greater reality.


  If on the contrary each is a principle, then the effective powers become a matter
  of chance; under what compulsion are they to hold together and act with one mind
  towards that work of unity, the harmony of the entire heavenly system? Again what
  can make it necessary that the material bodies of the heavenly system be equal in
  number to the Intellectual moving principles, and how can these incorporeal Beings
  be numerically many when there is no Matter to serve as the basis of difference?


  For these reasons the ancient philosophers that ranged themselves most closely to
  the school of Pythagoras and of his later followers and to that of Pherekudes, have
  insisted upon this Nature, some developing the subject in their writings while others
  treated of it merely in unwritten discourses, some no doubt ignoring it entirely.'
sanskrit: Ἐννοοῦμεν δὲ τὸ ἕν, καὶ τὸ ἕν ἐστιν ἡ ἀρχὴ καὶ τὸ τέλος. (We conceive of
  the One, and the One is the principle and the end.)
transliteration: N/A, as the passage does not contain explicit Greek terms that require
  transliteration.
translation: We conceive the [One] as the ultimate principle and the culmination of
  all existence, and this [One] is the source from which all [Intellectual Beings]
  arise, governing the harmony of the entire [Intellectual Realm].
commentary: 'The notion of a unified Intellectual Realm is a fundamental concept in
  Neoplatonism, and Plotinus''s critique of Aristotle''s philosophy highlights the
  importance of a singular, overarching principle. The counterintuitive move here
  is the idea that a multitude of intellective beings can arise from a single, unified
  source, rather than being separate and distinct entities. This challenges the traditional
  understanding of plurality and diversity, instead positing that all things are interconnected
  and interdependent. In the context of Neoplatonism, this concept has significant
  implications for our understanding of the nature of reality and our place within
  it. By recognizing the unity of the Intellectual Realm, we can gain insight into
  the underlying structure of the universe and our role within it, ultimately leading
  to a deeper understanding of ourselves and our relationship to the world around
  us. This, in turn, can inform our existential application, as we strive to cultivate
  a sense of unity and interconnectedness in our own lives, recognizing that our individual
  experiences are part of a larger, harmonious whole.


  Key Terms:


  * **One (ἕν)** — from Greek "hen", meaning one or single -> in Neoplatonism, refers
  to the ultimate, unified principle -> default translation often misses the connotation
  of unity and singularity.

  * **Intellectual Beings (νοητά)** — from Greek "noēta", meaning things that can
  be known -> in Neoplatonism, refers to the intellective, immaterial entities that
  comprise the Intellectual Realm -> default translation often fails to convey the
  immaterial, intellective nature of these beings.

  * **Intellectual Realm (Νοῦς)** — from Greek "nous", meaning mind or intellect ->
  in Neoplatonism, refers to the realm of intellective, immaterial entities -> default
  translation often misses the connotation of a unified, intellective domain.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.2.11:** structural homology in the concept of a unified,
  ultimate principle (Brahman) that underlies all existence.

  *Divergence:* while the Katha Upanishad emphasizes the individual''s realization
  of this unity, Plotinus''s Enneads focus on the metaphysical implications of this
  concept.

  * **Phaedo, 79d-80b:** structural homology in the idea of a unified, immaterial
  realm (the world of Forms) that underlies the material world.

  *Divergence:* while Plato''s Phaedo emphasizes the individual''s ascent to this
  realm, Plotinus''s Enneads explore the metaphysical structure of this realm and
  its relationship to the material world.'
abhyasa: Contemplate the unity of the Intellectual Realm, recognizing that all things
  arise from a single, overarching principle, and that this unity underlies all existence;
  as you go about your daily life, strive to cultivate a sense of interconnectedness
  and harmony, acknowledging that your individual experiences are part of a larger,
  unified whole.
