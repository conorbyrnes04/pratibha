sutra_id: ENN_V_1_12
collection: Plotinus Enneads
section: Ennead V, Tractate 1, Section 12
title: The Inner Activity of the Soul
anchor_translation: 'Possessed of such powers, how does it happen that we do not lay
  hold of them, but for the most part, let these high activities go idle- some, even,
  of us never bringing them in any degree to effect?


  The answer is that all the Divine Beings are unceasingly about their own act, the
  Intellectual-Principle and its Prior always self-intent; and so, too, the soul maintains
  its unfailing movement; for not all that passes in the soul is, by that fact, perceptible;
  we know just as much as impinges upon the faculty of sense. Any activity not transmitted
  to the sensitive faculty has not traversed the entire soul: we remain unaware because
  the human being includes sense-perception; man is not merely a part [the higher
  part] of the soul but the total.


  None the less every being of the order of soul is in continuous activity as long
  as life holds, continuously executing to itself its characteristic act: knowledge
  of the act depends upon transmission and perception. If there is to be perception
  of what is thus present, we must turn the perceptive faculty inward and hold it
  to attention there. Hoping to hear a desired voice, we let all others pass and are
  alert for the coming at last of that most welcome of sounds: so here, we must let
  the hearings of sense go by, save for sheer necessity, and keep the soul''s perception
  bright and quick to the sounds from above.'
sanskrit: ἐὰν δὲ μὴ μεταδῶμεν αὐτὰ τῇ αἰσθητικῇ, οὐ διῆλθεν ἐν τῇ ψυχῇ· λανθάνομεν,
  ὅτι ἄνθρωπος αἰσθητικὴν περιλαμβάνει.
transliteration: N/A, but key terms include [Ātman] (ἄνθρωπος, man) and [Jñāna] (γνῶσις,
  knowledge).
translation: The soul continuously executes its characteristic act, but we remain
  unaware because our perception is focused on sense-experiences. To perceive the
  inner activity, we must turn our attention inward and let go of sense-perceptions,
  except when necessary, and keep our inner perception sharp and alert to the subtle
  sounds from above.
commentary: 'The fundamental claim here is that the soul is always active, even if
  we are not aware of it. The counterintuitive move is that our lack of awareness
  is not due to the soul''s inactivity, but rather our own focus on sense-perceptions.
  In Neoplatonism, the soul is seen as a multifaceted entity, with both higher and
  lower aspects. The higher aspect is always engaged in intellectual activity, while
  the lower aspect is focused on sense-experiences. The existential application of
  this idea is that we must learn to turn our attention inward and cultivate inner
  perception to access the soul''s continuous activity. This requires a shift in our
  awareness, from being focused on external sense-experiences to being attentive to
  the subtle sounds from above. By doing so, we can tap into the soul''s inherent
  powers and bring them to fruition. This idea resonates with the concept of [Pratyābhijñā]
  (recognition) in Kashmir Shaivism, where the goal is to recognize one''s true nature
  and access the inner wisdom.


  Key Terms:


  * **Ātman (ἄνθρωπος)** — from Sanskrit ātman, meaning "self" -> in Neoplatonism,
  refers to the individual soul -> default translation misses the connotation of a
  multifaceted entity.

  * **Jñāna (γνῶσις)** — from Sanskrit jñāna, meaning "knowledge" -> in Neoplatonism,
  refers to intellectual activity -> default translation misses the connotation of
  a higher state of awareness.

  * **Aisthēsis (αἰσθητικὴ)** — from Greek aisthēsis, meaning "perception" -> in Neoplatonism,
  refers to sense-experience -> default translation misses the connotation of a lower
  aspect of the soul.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.1.1:** The idea of turning inward to access the soul''s continuous
  activity resonates with the Upanishad''s concept of turning inward to access the
  [Ātman].

  * **Phaedo, 64a-67e:** The idea of the soul''s immortality and its continuous activity
  resonates with Plato''s concept of the soul''s pre-existence and its ability to
  access eternal knowledge.

  * **Pratyabhijnahrdayam, Sutra 4:** The idea of recognizing one''s true nature and
  accessing inner wisdom resonates with the concept of [Pratyābhijñā] in Kashmir Shaivism.'
abhyasa: Turn your attention inward and focus on your breath, letting go of sense-perceptions
  and distractions, and cultivate inner perception to access the soul's continuous
  activity.
