sutra_id: ENN_V_1_10
collection: Plotinus Enneads
section: Ennead V, Tractate 1, Section 10
title: The Threefold Nature of Reality and the Human Condition
anchor_translation: 'We have shown the inevitability of certain convictions as to
  the scheme of things:

  There exists a Principle which transcends Being; this is The One, whose nature we
  have sought to establish in so far as such matters lend themselves to proof. Upon
  The One follows immediately the Principle which is at once Being and the Intellectual-Principle.
  Third comes the Principle, Soul.

  Now just as these three exist for the system of Nature, so, we must hold, they exist
  for ourselves. I am not speaking of the material order- all that is separable- but
  of what lies beyond the sense realm in the same way as the Primals are beyond all
  the heavens; I mean the corresponding aspect of man, what Plato calls the Interior
  Man.

  Thus our soul, too, is a divine thing, belonging to another order than sense; such
  is all that holds the rank of soul, but [above the life-principle] there is the
  soul perfected as containing Intellectual-Principle with its double phase, reasoning
  and giving the power to reason. The reasoning phase of the soul, needing no bodily
  organ for its thinking but maintaining, in purity, its distinctive Act that its
  thought may be uncontaminated- this we cannot err in placing, separate and not mingled
  into body, within the first Intellectual. We may not seek any point of space in
  which to seat it; it must be set outside of all space: its distinct quality, its
  separateness, its immateriality, demand that it be a thing alone, untouched by all
  of the bodily order. This is why we read of the universe that the Demiurge cast
  the soul around it from without- understand that phase of soul which is permanently
  seated in the Intellectual- and of ourselves that the charioteer''s head reaches
  upwards towards the heights.

  The admonition to sever soul from body is not, of course, to be understood spatially-
  that separation stands made in Nature- the reference is to holding our rank, to
  use of our thinking, to an attitude of alienation from the body in the effort to
  lead up and attach to the over-world, equally with the other, that phase of soul
  seated here and, alone, having to do with body, creating, moulding, spending its
  care upon it.'
sanskrit: Ἐπὶ μὲν οὖν τοῦ ὄντος ἕνεκα τούτου ἡ τοιαύτη ἀνάγκη (Enneads V.1.10, line
  1)
transliteration: N/A, as the passage does not contain specific Greek terms that require
  transliteration.
translation: The human condition is characterized by a threefold nature, reflecting
  the fundamental principles of the universe. We have a divine aspect, which transcends
  the material realm and is connected to the [Intellectual-Principle]. Our soul is
  a divine entity, belonging to a higher order than the senses, and it contains the
  [Intellectual-Principle] with its dual aspects of reasoning and providing the power
  to reason. The reasoning aspect of our soul is separate from the body and exists
  in a realm beyond space, untouched by the material world. We must strive to sever
  our attachment to the body and focus on our thinking, adopting an attitude of detachment
  in order to connect with the higher realm.
commentary: 'The philosophical claim that the human condition is characterized by
  a threefold nature, reflecting the fundamental principles of the universe, is a
  counterintuitive move that challenges our conventional understanding of reality.
  By positing the existence of a Principle that transcends Being, Plotinus makes a
  bold statement that underscores the complexity of human existence. This idea is
  rooted in Neoplatonism, which emphasizes the interconnectedness of all things and
  the notion that the human soul is a microcosm of the universe. The existential application
  of this idea is profound, as it encourages us to reevaluate our relationship with
  the material world and strive for a deeper understanding of our place within the
  larger cosmic scheme. By recognizing the divine aspect of our nature, we can begin
  to cultivate a sense of detachment from the body and focus on our thinking, ultimately
  leading to a more authentic and fulfilling existence. This concept resonates with
  the idea of [Advaita Vedanta], which posits the ultimate reality as a unified, all-encompassing
  consciousness.


  Key Terms:


  * **The One (τὸ Ἕν)** — from the Greek concept of unity and simplicity -> refers
  to the ultimate, uncaused cause of all existence -> default translation misses the
  connotation of absolute simplicity and unity.

  * **Intellectual-Principle (Νοῦς)** — from the Greek concept of intellect and reason
  -> refers to the divine, eternal, and unchanging aspect of reality -> default translation
  misses the connotation of divine intellect.

  * **Soul (Ψυχή)** — from the Greek concept of breath and life -> refers to the animating
  principle of living beings -> default translation misses the connotation of the
  soul as a divine, immortal entity.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.3.9:** The idea of the threefold nature of reality is echoed
  in the Katha Upanishad, which describes the universe as consisting of three fundamental
  principles: the Absolute, the intellect, and the ego.

  * **Phaedo, 67b-69d:** The concept of the soul as a divine, immortal entity is also
  found in Plato''s Phaedo, which describes the soul as a separate, immaterial substance
  that exists before birth and after death.

  * **Pratyabhijnahrdayam, 3:** The idea of recognizing the divine aspect of our nature
  and cultivating detachment from the body is reflected in the Pratyabhijnahrdayam,
  which describes the process of self-realization as involving the recognition of
  our true, divine nature.'
abhyasa: 'As you go about your daily activities, take a moment to reflect on your
  thoughts and emotions, and ask yourself: "What is the nature of my existence, and
  how can I cultivate a deeper understanding of my place within the larger cosmic
  scheme?" Take a few deep breaths, and imagine yourself as a spark of the divine,
  connected to the [Intellectual-Principle] and the [One]. As you inhale, repeat the
  phrase "I am a divine entity, belonging to a higher order than the senses," and
  as you exhale, repeat the phrase "I release my attachment to the material world,
  and focus on my thinking, adopting an attitude of detachment."'
