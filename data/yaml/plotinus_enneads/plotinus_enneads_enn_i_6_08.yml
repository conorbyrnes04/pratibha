sutra_id: ENN_I_6_08
collection: Plotinus Enneads
section: Ennead I, Tractate 6, Section 8
title: The Inward Journey to Beauty
anchor_translation: 'But what must we do? How lies the path? How come to vision of
  the inaccessible Beauty, dwelling as if in consecrated precincts, apart from the
  common ways where all may see, even the profane?


  He that has the strength, let him arise and withdraw into himself, foregoing all
  that is known by the eyes, turning away for ever from the material beauty that once
  made his joy. When he perceives those shapes of grace that show in body, let him
  not pursue: he must know them for copies, vestiges, shadows, and hasten away towards
  That they tell of. For if anyone follow what is like a beautiful shape playing over
  water- is there not a myth telling in symbol of such a dupe, how he sank into the
  depths of the current and was swept away to nothingness? So too, one that is held
  by material beauty and will not break free shall be precipitated, not in body but
  in Soul, down to the dark depths loathed of the Intellective-Being, where, blind
  even in the Lower-World, he shall have commerce only with shadows, there as here.


  "Let us flee then to the beloved Fatherland": this is the soundest counsel. But
  what is this flight? How are we to gain the open sea? For Odysseus is surely a parable
  to us when he commands the flight from the sorceries of Circe or Calypso- not content
  to linger for all the pleasure offered to his eyes and all the delight of sense
  filling his days.


  The Fatherland to us is There whence we have come, and There is The Father.


  What then is our course, what the manner of our flight? This is not a journey for
  the feet; the feet bring us only from land to land; nor need you think of coach
  or ship to carry you away; all this order of things you must set aside and refuse
  to see: you must close the eyes and call instead upon another vision which is to
  be waked within you, a vision, the birth-right of all, which few turn to use.'
sanskrit: ἀλλὰ τί δὲ ἔτι; τίνα δὲ τὸν ἄγουσαν ὁδόν; πῶς δὲ ὄψεται τὸ ἀόρατον τὸ καλόν,
  ἐν ἱεροῖς ὡς ἂν ἐν τοῖς κοinois οὐχ ὁρῶν;
transliteration: 'N/A, with key terms: [Nous] (Νοῦς) - intellect, [Psyche] (Ψυχή)
  - soul'
translation: To attain the vision of the inaccessible [Beauty], one must withdraw
  into oneself, letting go of all that is known through the senses, and turn away
  from material beauty. When perceiving beautiful forms in the physical world, do
  not pursue them, for they are mere [eidolon] (εἴδωλον) - copies, remnants, and shadows
  of the true [Beauty]. Instead, hasten towards the reality they represent.
commentary: 'The philosophical claim here is that true beauty is inaccessible to the
  senses and can only be attained through an inward journey. The counterintuitive
  move is to turn away from material beauty, which is often considered the ultimate
  goal, and instead seek the true beauty that lies beyond the physical realm. This
  idea is rooted in Neoplatonism, which posits that the material world is merely a
  shadow or imitation of the higher, eternal realm of being. The existential application
  of this idea is that one must let go of attachment to worldly pleasures and desires
  in order to attain true fulfillment and understanding. This requires a fundamental
  shift in perspective, from focusing on the external world to turning inward and
  cultivating inner vision. By doing so, one can gain access to the deeper, eternal
  realm of being and experience true beauty and fulfillment.


  Key Terms:


  * **Nous (Νοῦς)** — from noein (νοεῖν), to perceive -> intellect, higher mind ->
  beyond rational thinking

  * **Psyche (Ψυχή)** — from psychein (ψύχειν), to breathe -> soul, living being ->
  more than just emotional or mental aspects

  * **Eidolon (εἴδωλον)** — from eidos (εἶδος), form, image -> copy, imitation, shadow
  -> lacks the reality of the true form


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.1.15:** The idea of turning away from worldly desires and
  seeking the eternal, unchanging reality is echoed in the Katha Upanishad, where
  the seeker is advised to "give up all desires" and "turn the mind inward" to attain
  the ultimate goal.

  * **Phaedo, 66d-67a:** Plato''s concept of the ascent of the soul to the realm of
  Forms, where true beauty and wisdom reside, is similar to Plotinus'' idea of the
  inward journey to true beauty.

  * **Zhuangzi, Chapter 2:** The Zhuangzi''s concept of "sitting in forgetfulness"
  and letting go of worldly attachments to attain a state of freedom and clarity resonates
  with Plotinus'' idea of turning away from material beauty and cultivating inner
  vision.'
abhyasa: Close your eyes and imagine yourself letting go of all attachment to material
  beauty and worldly desires. Visualize yourself turning inward, away from the external
  world, and cultivating a sense of inner vision and awareness. As you inhale, repeat
  the phrase "I let go of all that is external," and as you exhale, repeat "I turn
  inward to the true beauty within."
