sutra_id: ENN_VI_9_04
collection: Plotinus Enneads
section: Ennead VI, Tractate 9, Section 4
title: The Ineffable Nature of the One
anchor_translation: 'The main part of the difficulty is that awareness of this Principle
  comes neither by knowing nor by the Intellection that discovers the Intellectual
  Beings but by a presence overpassing all knowledge. In knowing, soul or mind abandons
  its unity; it cannot remain a simplex: knowing is taking account of things; that
  accounting is multiple; the mind, thus plunging into number and multiplicity, departs
  from unity.


  Our way then takes us beyond knowing; there may be no wandering from unity; knowing
  and knowable must all be left aside; every object of thought, even the highest,
  we must pass by, for all that is good is later than This and derives from This as
  from the sun all the light of the day.


  “Not to be told; not to be written”: in our writing and telling we are but urging
  towards it: out of discussion we call to vision: to those desiring to see, we point
  the path; our teaching is of the road and the travelling; the seeing must be the
  very act of one that has made this choice.


  There are those that have not attained to see. The soul has not come to know the
  splendour There; it has not felt and clutched to itself that love-passion of vision
  known to lover come to rest where he loves. Or struck perhaps by that authentic
  light, all the soul lit by the nearness gained, we have gone weighted from beneath;
  the vision is frustrate; we should go without burden and we go carrying that which
  can but keep us back; we are not yet made over into unity.


  From none is that Principle absent and yet from all: present, it remains absent
  save to those fit to receive, disciplined into some accordance, able to touch it
  closely by their likeness and by that kindred power within themselves through which,
  remaining as it was when it came to them from the Supreme, they are enabled to see
  in so far as God may at all be seen.


  Failure to attain may be due to such impediment or to lack of the guiding thought
  that establishes trust; impediment we must charge against ourselves and strive by
  entire renunciation to become emancipate; where there is distrust for lack of convincing
  reason, further considerations may be applied.'
sanskrit: Ὅστις οἴεται τὰ ὄντα τύχηι καὶ τῶι αὐτομάτωι διοι- κεῖσθαι καὶ σωματικαῖς
  συνέχεσθαι αἰτίαις, οὗτος πόρρω ἀπελήλαται καὶ θεοῦ καὶ ἐννοίας ἑνός, καὶ ὁ λόγος
  οὐ πρὸς τούτους, ἀλλὰ πρὸς τοὺς ἄλλην φύσιν παρὰ τὰ σώματα τιθεμένους καὶ ἀνιόντας
  ἐπὶ ψυχήν.
transliteration: 'N/A, as the key terms are primarily in Greek, but can be transliterated
  as needed: *hen* (ἕν) meaning one, *nous* (νοῦς) meaning intellect or mind.'
translation: The awareness of the ultimate Principle transcends all knowledge and
  intellection, requiring a presence that surpasses the multiplicity of knowing. To
  attain this, one must abandon the duality of subject and object, and instead, become
  unified with the Principle. This unity is not something that can be known or understood
  through the intellect, but rather, it is a direct experience that arises from embracing
  the simplicity and unity of the One. The One is not something that can be described
  or written about, but rather, it is the source of all that is good and derives its
  existence from it.
commentary: 'The philosophical claim that underlies this passage is that the ultimate
  reality, the One, is beyond human comprehension and can only be accessed through
  a direct experience of unity. The counterintuitive move made by Plotinus is to suggest
  that this unity is not something that can be achieved through knowledge or intellection,
  but rather, it requires a transcendence of the dualistic thinking that characterizes
  human understanding. This move is counterintuitive because it challenges the conventional
  notion that knowledge and understanding are the primary means of accessing reality.
  In the context of Neoplatonism, this idea is central to the philosophy of Plotinus,
  who argues that the One is the source of all existence and that it can only be accessed
  through a process of spiritual purification and introspection. The existential application
  of this idea is that it encourages individuals to look beyond the limitations of
  their intellect and to seek a more direct and intimate experience of reality. By
  letting go of their attachment to knowledge and understanding, individuals can transcend
  the dualistic thinking that separates them from the world and achieve a more unified
  and holistic understanding of existence.


  Key Terms:


  * **Hen (ἕν)** — from the Greek word for one, meaning unity or simplicity -> in
  Neoplatonism, refers to the ultimate reality that underlies all existence -> what
  default translation misses is the connotation of unity and simplicity that is central
  to the concept of the One.

  * **Nous (νοῦς)** — from the Greek word for intellect or mind, meaning the faculty
  of understanding and reasoning -> in Neoplatonism, refers to the higher intellect
  that is capable of accessing the ultimate reality -> what default translation misses
  is the distinction between the lower intellect that is bound by dualistic thinking
  and the higher intellect that is capable of transcending it.

  * **Episteme (ἐπιστήμη)** — from the Greek word for knowledge, meaning a state of
  being that is characterized by understanding and comprehension -> in Neoplatonism,
  refers to the lower form of knowledge that is bound by dualistic thinking -> what
  default translation misses is the distinction between this lower form of knowledge
  and the higher form of understanding that is characterized by unity and simplicity.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.24:** The ultimate reality is beyond human comprehension
  and can only be accessed through a direct experience of unity. *Divergence:* While
  the Katha Upanishad emphasizes the importance of knowledge and understanding in
  accessing the ultimate reality, Plotinus argues that these are limitations that
  must be transcended.

  * **Phaedo, 66d-67a:** The soul must be purified of its attachment to the body and
  the senses in order to access the ultimate reality. *Divergence:* While Plato emphasizes
  the importance of purification in accessing the ultimate reality, Plotinus argues
  that this purification is not just a matter of separating the soul from the body,
  but rather, it requires a transcendence of the dualistic thinking that characterizes
  human understanding.

  * **Zhuangzi, Chapter 2:** The ultimate reality is beyond human comprehension and
  can only be accessed through a direct experience of unity. *Divergence:* While Zhuangzi
  emphasizes the importance of embracing the uncertainty and ambiguity of existence,
  Plotinus argues that this uncertainty and ambiguity can be transcended through a
  direct experience of unity.'
abhyasa: To access the ultimate reality, the One, let go of your attachment to knowledge
  and understanding, and instead, cultivate a sense of unity and simplicity in your
  being. This can be done by practicing meditation and introspection, and by letting
  go of your dualistic thinking and embracing the uncertainty and ambiguity of existence.
  As you cultivate this sense of unity and simplicity, you will begin to experience
  a more direct and intimate connection with the world, and you will transcend the
  limitations of your intellect and achieve a more holistic understanding of existence.
