sutra_id: ENN_V_1_08
collection: Plotinus Enneads
section: Ennead V, Tractate 1, Section 8
title: The Three Hypostases as an Explanation of Platonic Triplicity
anchor_translation: 'This is the explanation of Plato''s Triplicity, in the passage
  where he names as the Primals the Beings gathered about the King of All, and establishes
  a Secondary containing the Secondaries, and a Third containing the Tertiaries.


  He teaches, also, that there is an author of the Cause, that is of the Intellectual-Principle,
  which to him is the Creator who made the Soul, as he tells us, in the famous mixing
  bowl. This author of the causing principle, of the divine mind, is to him the Good,
  that which transcends the Intellectual-Principle and transcends Being: often too
  he uses the term "The Idea" to indicate Being and the Divine Mind. Thus Plato knows
  the order of generation- from the Good, the Intellectual-Principle; from the Intellectual-Principle,
  the Soul. These teachings are, therefore, no novelties, no inventions of today,
  but long since stated, if not stressed; our doctrine here is the explanation of
  an earlier and can show the antiquity of these opinions on the testimony of Plato
  himself.


  Earlier, Parmenides made some approach to the doctrine in identifying Being with
  Intellectual-Principle while separating Real Being from the realm of sense.


  "Knowing and Being are one thing he says, and this unity is to him motionless in
  spite of the intellection he attributes to it: to preserve its unchanging identity
  he excludes all bodily movement from it; and he compares it to a huge sphere in
  that it holds and envelops all existence and that its intellection is not an outgoing
  act but internal. Still, with all his affirmation of unity, his own writings lay
  him open to the reproach that his unity turns out to be a multiplicity.


  The Platonic Parmenides is more exact; the distinction is made between the Primal
  One, a strictly pure Unity, and a secondary One which is a One-Many and a third
  which is a One-and-many; thus he too is in accordance with our thesis of the Three
  Kinds.'
sanskrit: 'The key lines from Parmenides are: "Knowing and Being are one thing" (Γνωσις
  καὶ ὄν εἷς), indicating the unity of being and intellection.'
transliteration: The term "Intellectual-Principle" (Νοῦς, Nous) is central to this
  passage, referring to the divine mind or the principle of intellection.
translation: The ultimate reality is explained through the concept of the Three Hypostases,
  which is rooted in Platonic philosophy. The Good, the Intellectual-Principle, and
  the Soul are the three primary aspects of reality, with the Good being the transcendent
  source of all existence. The Intellectual-Principle, also known as the divine mind,
  is the creator of the Soul, and it is through this principle that the order of generation
  is established. This doctrine is not a new concept, but rather an explanation of
  an earlier idea that has been stated by Plato and other philosophers.
commentary: 'The philosophical claim that the ultimate reality consists of the Three
  Hypostases - the Good, the Intellectual-Principle, and the Soul - is a fundamental
  concept in Neoplatonism. The counterintuitive move made by Plotinus is to identify
  the Good as the transcendent source of all existence, which is beyond being and
  intellection. This idea challenges the traditional notion of a single, unified ultimate
  reality and instead proposes a hierarchical structure of reality. In the context
  of Neoplatonism, this doctrine has significant implications for our understanding
  of the nature of reality and our place within it. The concept of the Three Hypostases
  can be applied existentially by recognizing that our individual souls are part of
  a larger, interconnected web of reality, and that our ultimate goal is to return
  to the source of all existence, the Good. By embracing this doctrine, we can cultivate
  a deeper understanding of the world and our place within it, and ultimately achieve
  a state of unity and harmony with the ultimate reality.


  Key Terms:


  * **The Good (Ἀγαθόν, Agathón)** — etymology: Greek concept of goodness -> tradition-specific
  meaning: the transcendent source of all existence -> what default translation misses:
  the Good is not just a moral concept, but a metaphysical reality that underlies
  all existence.

  * **Intellectual-Principle (Νοῦς, Nous)** — etymology: Greek concept of mind or
  intellect -> tradition-specific meaning: the divine mind or principle of intellection
  -> what default translation misses: the Intellectual-Principle is not just a human
  faculty, but a divine reality that underlies all existence.

  * **Soul (Ψυχή, Psuchē)** — etymology: Greek concept of soul or psyche -> tradition-specific
  meaning: the individual soul or principle of life -> what default translation misses:
  the Soul is not just a individual entity, but a part of a larger, interconnected
  web of reality.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.3.9:** The concept of the Three Hypostases resonates with
  the idea of the three states of consciousness in the Katha Upanishad, where the
  ultimate reality is described as the unchanging and all-pervading Brahman.

  * **Phaedo, 65a-66d:** The idea of the Good as the transcendent source of all existence
  is similar to the concept of the Form of the Good in Plato''s Phaedo, where the
  ultimate reality is described as the eternal and unchanging realm of Forms.

  * **Zhuangzi, Chapter 2:** The concept of the Intellectual-Principle as the divine
  mind or principle of intellection resonates with the idea of the "uncarved block"
  in the Zhuangzi, where the ultimate reality is described as the unnamable and unknowable
  Tao.'
abhyasa: Contemplate the concept of the Three Hypostases and recognize that your individual
  soul is part of a larger, interconnected web of reality, and that your ultimate
  goal is to return to the source of all existence, the Good. As you go about your
  daily activities, remind yourself of the hierarchical structure of reality and strive
  to cultivate a deeper understanding of the world and your place within it.
