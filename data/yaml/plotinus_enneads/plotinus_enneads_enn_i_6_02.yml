sutra_id: ENN_I_6_02
collection: Plotinus Enneads
section: Ennead I, Tractate 6, Section 2
title: The Source of Beauty in Material Things
anchor_translation: 'Let us, then, go back to the source, and indicate at once the
  Principle that bestows beauty on material things.


  Undoubtedly this Principle exists; it is something that is perceived at the first
  glance, something which the soul names as from an ancient knowledge and, recognising,
  welcomes it, enters into unison with it.


  But let the soul fall in with the Ugly and at once it shrinks within itself, denies
  the thing, turns away from it, not accordant, resenting it.


  Our interpretation is that the soul- by the very truth of its nature, by its affiliation
  to the noblest Existents in the hierarchy of Being- when it sees anything of that
  kin, or any trace of that kinship, thrills with an immediate delight, takes its
  own to itself, and thus stirs anew to the sense of its nature and of all its affinity.


  But, is there any such likeness between the loveliness of this world and the splendours
  in the Supreme? Such a likeness in the particulars would make the two orders alike:
  but what is there in common between beauty here and beauty There?


  We hold that all the loveliness of this world comes by communion in Ideal-Form.


  All shapelessness whose kind admits of pattern and form, as long as it remains outside
  of Reason and Idea, is ugly by that very isolation from the Divine-Thought. And
  this is the Absolute Ugly: an ugly thing is something that has not been entirely
  mastered by pattern, that is by Reason, the Matter not yielding at all points and
  in all respects to Ideal-Form.


  But where the Ideal-Form has entered, it has grouped and coordinated what from a
  diversity of parts was to become a unity: it has rallied confusion into co-operation:
  it has made the sum one harmonious coherence: for the Idea is a unity and what it
  moulds must come to unity as far as multiplicity may.


  And on what has thus been compacted to unity, Beauty enthrones itself, giving itself
  to the parts as to the sum: when it lights on some natural unity, a thing of like
  parts, then it gives itself to that whole. Thus, for an illustration, there is the
  beauty, conferred by craftsmanship, of all a house with all its parts, and the beauty
  which some natural quality may give to a single stone.


  This, then, is how the material thing becomes beautiful- by communicating in the
  thought that flows from the Divine.'
sanskrit: Ἡ μὲν οὖν ψυχὴ αἰσθανόμενη τὸ καλὸν ὡς ἀρχαῖον ἐπίγνωσιν, καὶ συμφωνοῦσα
  αὐτῷ, ἡδονὴν ἔχει, τὸ δὲ αἰσθανόμενον τὸ αἰσχρὸν ἀποστρέφεται, μὴ συμφωνοῦν.
transliteration: 'N/A, with key terms: [kalon] (beauty), [aisthanesthai] (to perceive),
  [nous] (intellect), [eidos] (form)'
translation: The soul, perceiving beauty as an ancient recognition, resonates with
  it and experiences delight. However, when it perceives the ugly, it turns away,
  unable to resonate. This response reveals the soul's inherent connection to the
  [Nous], the divine intellect, which is the source of all beauty and order. The [Eidos],
  or form, is the principle that bestows beauty on material things, and it is through
  communion with this ideal form that the soul experiences beauty.
commentary: 'The philosophical claim that beauty is a transcendent principle that
  originates from the divine intellect is a counterintuitive move, as it challenges
  the conventional understanding of beauty as a subjective experience. Plotinus''s
  notion of beauty as a reflection of the ideal form is a hallmark of Neoplatonism,
  which posits that the material world is an imperfect reflection of the perfect,
  eternal realm of being. This idea has existential implications, as it suggests that
  human beings have an inherent longing for beauty and order that can only be fulfilled
  by connecting with the divine. The experience of beauty is not just a matter of
  personal taste, but rather a profound recognition of the soul''s affinity with the
  noblest existents in the hierarchy of being. By recognizing the source of beauty,
  individuals can cultivate a deeper appreciation for the world around them and strive
  to create beauty in their own lives.


  Key Terms:


  * **kalon (καλὸν)** — etymology: ancient Greek concept of beauty -> tradition-specific
  meaning: transcendent principle of beauty -> what default translation misses: the
  connection between beauty and the divine intellect.

  * **nous (νοῦς)** — etymology: ancient Greek concept of intellect -> tradition-specific
  meaning: divine intellect, source of all beauty and order -> what default translation
  misses: the role of the intellect in perceiving beauty.

  * **eidos (εἶδος)** — etymology: ancient Greek concept of form -> tradition-specific
  meaning: ideal form, principle that bestows beauty on material things -> what default
  translation misses: the connection between form and beauty.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.2.13:** The concept of beauty as a reflection of the divine
  is echoed in the Katha Upanishad, where the self is described as the source of all
  beauty and joy.

  * **Phaedo, 74-75:** Plato''s notion of the forms as the ultimate reality is similar
  to Plotinus''s concept of the ideal form as the source of beauty.

  * **Zhuangzi, Chapter 2:** The Zhuangzi''s concept of the "uncarved block" as the
  ultimate reality is similar to Plotinus''s notion of the ideal form as the source
  of beauty and order.'
abhyasa: 'As you go about your day, take a moment to pause and reflect on the beauty
  that surrounds you. Ask yourself: what is the source of this beauty? Is it merely
  a product of human craftsmanship, or is it a reflection of a deeper, transcendent
  principle? Allow yourself to resonate with the beauty that you perceive, and see
  if you can connect with the divine intellect that is its source.'
