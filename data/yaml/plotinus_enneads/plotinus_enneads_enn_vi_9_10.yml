sutra_id: ENN_VI_9_10
collection: Plotinus Enneads
section: Ennead VI, Tractate 9, Section 10
title: The Unity of the Self and the Supreme
anchor_translation: 'But how comes the soul not to keep that ground? Because it has
  not yet escaped wholly: but there will be the time of vision unbroken, the self
  hindered no longer by any hindrance of body. Not that those hindrances beset that
  in us which has veritably seen; it is the other phase of the soul that suffers and
  that only when we withdraw from vision and take to knowing by proof, by evidence,
  by the reasoning processes of the mental habit. Such logic is not to be confounded
  with that act of ours in the vision; it is not our reason that has seen; it is something
  greater than reason, reason’s Prior, as far above reason as the very object of that
  thought must be. In our self-seeing There, the self is seen as belonging to that
  order, or rather we are merged into that self in us which has the quality of that
  order. It is a knowing of the self restored to its purity. No doubt we should not
  speak of seeing; but we cannot help talking in dualities, seen and seer, instead
  of, boldly, the achievement of unity. In this seeing, we neither hold an object
  nor trace distinction; there is no two. The man is changed, no longer himself nor
  self-belonging; he is merged with the Supreme, sunken into it, one with it: centre
  coincides with centre, for on this higher plane things that touch at all are one;
  only in separation is there duality; by our holding away, the Supreme is set outside.
  This is why the vision baffles telling; we cannot detach the Supreme to state it;
  if we have seen something thus detached we have failed of the Supreme which is to
  be known only as one with ourselves.'
sanskrit: Τοῦτο δὴ ἐθέλον δηλοῦν τὸ τῶν μυστηρίων τῶνδε ἐπίταγμα, τὸ μὴ ἐκφέρειν εἰς
  μὴ μεμυημένους, ὡς οὐκ ἔκφορον ἐκεῖνο ὄν, ἀπεῖπε δηλοῦν πρὸς ἄλλον τὸ θεῖον, ὅτωι
  μὴ καὶ αὐτῶι ἰδεῖν εὐτύχηται.
transliteration: N/A, as the passage does not contain specific Greek terms that require
  transliteration.
translation: As we experience the unity of the self and the Supreme, we transcend
  the limitations of the individual self and become one with the ultimate reality.
  In this state, we no longer perceive the world through the lens of duality, but
  rather, we see everything as an interconnected whole. The self is no longer bound
  by the constraints of the physical body and the mental habits that govern our ordinary
  perception. Instead, we experience a sense of freedom and unity, where the distinctions
  between the self and the Supreme are dissolved.
commentary: 'The concept of unity with the Supreme is a fundamental aspect of Neoplatonism,
  and it represents a counterintuitive move away from the ordinary perception of the
  world as a collection of separate objects. According to Plotinus, the individual
  self is not a fixed entity, but rather, it is a dynamic and evolving process that
  can transcend its limitations and become one with the ultimate reality. This unity
  is not something that can be achieved through rational thought or intellectual understanding,
  but rather, it requires a direct experience of the Supreme. The existential application
  of this concept is that it offers a profound sense of liberation and freedom, where
  the individual self is no longer bound by the constraints of the physical body and
  the mental habits that govern our ordinary perception. By experiencing this unity,
  we can transcend the limitations of the individual self and become one with the
  ultimate reality, which is the source of all existence.


  Key Terms:


  * **The Supreme (τὸ θεῖον)** — etymology: from τὸ θεῖον, meaning "the divine" ->
  tradition-specific meaning: the ultimate reality, the source of all existence ->
  what default translation misses: the Supreme is not just a concept, but a living
  reality that can be experienced directly.

  * **Unity (ἕν)** — etymology: from ἕν, meaning "one" -> tradition-specific meaning:
  the state of being one with the Supreme -> what default translation misses: unity
  is not just a conceptual understanding, but a direct experience of the ultimate
  reality.

  * **Self (αὐτός)** — etymology: from αὐτός, meaning "self" -> tradition-specific
  meaning: the individual self, which is a dynamic and evolving process -> what default
  translation misses: the self is not a fixed entity, but rather, it is a process
  that can transcend its limitations and become one with the Supreme.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.3.9:** The concept of unity with the Supreme is also found
  in the Katha Upanishad, where it is described as the state of being one with the
  ultimate reality, Brahman. This unity is achieved through the practice of self-inquiry
  and the cultivation of wisdom.

  * **Phaedo, 66d-67a:** In the Phaedo, Plato describes the concept of the soul''s
  ascent to the realm of the Forms, where it experiences a state of unity with the
  ultimate reality. This unity is achieved through the practice of philosophy and
  the cultivation of wisdom.

  * **Zhuangzi, Chapter 2:** The Zhuangzi describes the concept of unity with the
  ultimate reality, which is achieved through the practice of wu-wei, or non-action.
  This unity is characterized by a state of freedom and spontaneity, where the individual
  self is no longer bound by the constraints of the physical body and the mental habits
  that govern our ordinary perception.'
abhyasa: To experience the unity of the self and the Supreme, sit in stillness and
  silence, and focus your attention on the present moment. Let go of all thoughts
  and distractions, and simply be aware of your breath and your body. As you settle
  into this state of awareness, imagine that you are becoming one with the ultimate
  reality, and that all distinctions between the self and the Supreme are dissolving.
  Allow yourself to experience this unity, and see the world as an interconnected
  whole, where everything is one and undivided.
