sutra_id: ENN_VI_9_01
collection: Plotinus Enneads
section: Ennead VI, Tractate 9, Section 1
title: The Unity of Being
anchor_translation: 'It is in virtue of unity that beings are beings. This is equally
  true of things whose existence is primal and of all that are in any degree to be
  numbered among beings. What could exist at all except as one thing? Deprived of
  unity, a thing ceases to be what it is called: no army unless as a unity: a chorus,
  a flock, must be one thing. Even house and ship demand unity, one house, one ship;
  unity gone, neither remains thus even continuous magnitudes could not exist without
  an inherent unity; break them apart and their very being is altered in the measure
  of the breach of unity. Take plant and animal; the material form stands a unity;
  fallen from that into a litter of fragments, the things have lost their being; what
  was is no longer there; it is replaced by quite other things — as many others, precisely,
  as possess unity. Health, similarly, is the condition of a body acting as a co-ordinate
  unity. Beauty appears when limbs and features are controlled by this principle,
  unity. Moral excellence is of a soul acting as a concordant total, brought to unity.
  Come thus to soul — which brings all to unity, making, moulding, shaping, ranging
  to order — there is a temptation to say “Soul is the bestower of unity; soul therefore
  is the unity.” But soul bestows other characteristics upon material things and yet
  remains distinct from its gift: shape, Ideal-Form and the rest are all distinct
  from the giving soul; so, clearly, with this gift of unity; soul to make things
  unities looks out upon the unity just as it makes man by looking upon Man, realizing
  in the man the unity belonging to Man. Anything that can be described as a unity
  is so in the precise degree in which it holds a characteristic being; the less or
  more the degree of the being, the less or more the unity. Soul, while distinct from
  unity’s very self, is a thing of the greater unity in proportion as it is of the
  greater, the authentic, being. Absolute unity it is not: it is soul and one soul,
  the unity in some sense a concomitant; there are two things, soul and soul’s unity
  as there is body with body’s unity. The looser aggregates, such as a choir, are
  furthest from unity, the more compact are the nearer; soul is nearer yet but still
  a participant. Is soul to be identified with unity on the ground that unless it
  were one thing it could not be soul? No; unity is equally necessary to every other
  thing, yet unity stands distinct from them; body and unity are not identical; body,
  too; is still a participant. Besides, the soul, even the collective soul for all
  its absence of part, is a manifold: it has diverse powers — reasoning, desiring,
  perceiving — all held together by this chain of unity. Itself a unity, soul confers
  unity, but also accepts it.'
sanskrit: Ἆρ᾽ οὖν ἑκάστωι μὲν τῶν κατὰ μέρος ἓν οὐ ταὐτὸν ἡ οὐσία αὐτοῦ καὶ τὸ ἕν,
  ὅλωι δὲ τῶι ὄντι καὶ τῆι οὐσίαι ταὐτὸν ἡ οὐσία καὶ τὸ ὂν καὶ τὸ ἕν;
transliteration: N/A, as the passage does not contain isolated Greek terms for transliteration.
translation: Everything that exists does so as a unified whole. This principle applies
  to all things, whether they are fundamental or derived. Without unity, a thing cannot
  maintain its existence or identity. Unity is essential for the coherence of any
  entity, whether it is a physical object, a living being, or an abstract concept.
  The soul, as the source of unity, brings things into being and maintains their existence
  by conferring unity upon them. However, the soul itself is not identical with unity,
  as it has diverse powers and aspects that are held together by the principle of
  unity.
commentary: 'The concept of unity is central to Plotinus''s philosophy, as it is the
  foundation of existence and identity. The counterintuitive move here is to recognize
  that unity is not just a numerical concept, but a metaphysical one that underlies
  all of existence. In Neoplatonism, unity is seen as a fundamental aspect of reality,
  and it is the source of all being and coherence. The soul, as the mediator between
  the material and spiritual realms, plays a crucial role in conferring unity upon
  things. However, the soul itself is not identical with unity, as it has multiple
  aspects and powers that are held together by the principle of unity. This has significant
  implications for our understanding of existence, identity, and the nature of reality.
  By recognizing the importance of unity, we can gain insight into the interconnectedness
  of all things and the ultimate source of existence. The existential application
  of this concept is that it encourages us to seek unity and coherence in our own
  lives, and to recognize the interconnectedness of all things.


  Key Terms:


  * **Hen (ἕν)** — from the Greek word for "one" -> refers to the fundamental unity
  that underlies all existence -> default translation often misses the metaphysical
  connotations of the term.

  * **Ousia (οὐσία)** — from the Greek word for "being" or "substance" -> refers to
  the essential nature or reality of something -> default translation often misses
  the nuances of the term in Neoplatonic philosophy.

  * **Nous (νοῦς)** — from the Greek word for "mind" or "intellect" -> refers to the
  highest aspect of the human soul, which is capable of contemplating the divine ->
  default translation often misses the technical connotations of the term in Neoplatonism.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.2.11:** The concept of unity is also central to Hindu philosophy,
  where it is seen as the ultimate reality that underlies all existence. The Upanishad
  states that the individual self (atman) is ultimately one with the universal self
  (Brahman).

  * **Phaedo, 78b-80c:** In Plato''s Phaedo, the concept of unity is discussed in
  relation to the nature of the soul and the afterlife. The dialogue argues that the
  soul is immortal and that it exists before birth and after death, and that it is
  ultimately one with the divine.

  * **Zhuangzi, Chapter 2:** The Zhuangzi, a foundational text of Daoism, discusses
  the concept of unity in relation to the natural world and the human condition. The
  text argues that all things are interconnected and that the individual should strive
  to become one with the natural world.'
abhyasa: As you go about your day, pay attention to the ways in which unity underlies
  all of existence. Notice how things that seem separate and distinct are actually
  interconnected and interdependent. Reflect on how the principle of unity can be
  applied to your own life, and how you can cultivate a sense of coherence and wholeness
  in your thoughts, feelings, and actions.
