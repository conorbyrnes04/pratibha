sutra_id: ENN_VI_9_06
collection: Plotinus Enneads
section: Ennead VI, Tractate 9, Section 6
title: The Unity Beyond Human Conception
anchor_translation: 'In what sense, then, do we assert this Unity, and how is it to
  be adjusted to our mental processes?


  Its oneness must not be entitled to that of monad and point: for these the mind
  abstracts extension and numerical quantity and rests upon the very minutest possible,
  ending no doubt in the partless but still in something that began as a partible
  and is always lodged in something other than itself. The Unity was never in any
  other and never belonged to the partible: nor is its impartibility that of extreme
  minuteness; on the contrary it is great beyond anything, great not in extension
  but in power, sizeless by its very greatness as even its immediate sequents are
  impartible not in mass but in might. We must therefore take the Unity as infinite
  not in measureless extension or numerable quantity but in fathomless depths of power.


  Think of The One as Mind or as God, you think too meanly; use all the resources
  of understanding to conceive this Unity and, again, it is more authentically one
  than God, even though you reach for God’s unity beyond the unity the most perfect
  you can conceive. For This is utterly a self-existent, with no concomitant whatever.
  This self-sufficing is the essence of its unity. Something there must be supremely
  adequate, autonomous, all-transcending, most utterly without need.


  Any manifold, anything beneath The Unity, is dependent; combined from various constituents,
  its essential nature goes in need of unity; but unity cannot need itself; it stands
  unity accomplished. Again, a manifold depends upon all its factors; and furthermore
  each of those factors in turn — as necessarily inbound with the rest and not self-standing
  — sets up a similar need both to its associates and to the total so constituted.


  The sovranly self-sufficing principle will be Unity-Absolute, for only in this Unity
  is there a nature above all need, whether within itself or in regard to the rest
  of things. Unity seeks nothing towards its being or its well-being or its safehold
  upon existence; cause to all, how can it acquire its character outside of itself
  or know any good outside? The good of its being can be no borrowing: This is The
  Good. Nor has it station; it needs no standing ground as if inadequate to its own
  sustaining; what calls for such underpropping is the soulless, some material mass
  that must be based or fall. This is base to all, cause of universal existence and
  of ordered station. All that demands place is in need; a First cannot go in need
  of its sequents: all need is effort towards a first principle; the First, principle
  to all, must be utterly without need. If the Unity be seeking, it must inevitably
  be seeking to be something other than itself; it is seeking its own destroyer. Whatever
  may be said to be in need of a good is needing a preserver; nothing can be a good
  to The Unity, therefore.


  Neither can it have will to anything; it is a Beyond-Good, not even to itself a
  good but to such beings only as may be of quality to have part with it. Nor has
  it Intellection; that would comport diversity: nor Movement; it is prior to Movement
  as to Intellection.


  To what could its Intellection be directed? To itself? But that would imply a previous
  ignorance; it would be dependent upon that Intellection in order to knowledge of
  itself; but it is the self-sufficing. Yet this absence of self-knowing does not
  comport ignorance; ignorance is of something outside — a knower ignorant of a knowable
  — but in the Solitary there is neither knowing nor anything unknown. Unity, self-present,
  it has no need of self-intellection: indeed this “self-presence” were better left
  out, the more surely to preserve the unity; we must eliminate all knowing and all
  association, all intellection whether internal or external. It is not to be though
  of as having but as being Intellection; Intellection does not itself perform the
  intellective act but is the cause of the act in something else, and cause is not
  to be identified with caused: most assuredly the cause of all is not a thing within
  that all.


  This Principle is not, therefore, to be identified with the good of which it is
  the source; it is good in the unique mode of being The Good above all that is good.'
sanskrit: Εἰ δ᾽ ὅτι μηδὲν τούτων ἐστίν, ἀοριστεῖς τῆι γνώμηι, στῆσον σαυτὸν εἰς ταῦτα,
  καὶ ἀπὸ τούτων θεῶ· θεῶ δὲ μὴ ἔξω ῥίπτων τὴν διάνοιαν.
transliteration: N/A, as the passage does not contain specific technical terms requiring
  transliteration.
translation: The Unity is not something that can be conceived through our ordinary
  mental processes. Its oneness is not like the oneness of a point or a monad, which
  are still part of a larger whole. The Unity is infinite, but not in the sense of
  being boundless in extension or quantity. Rather, it is infinite in its power and
  depth. We must think of the Unity as being beyond all need, whether within itself
  or in relation to other things. It is the source of all existence and the cause
  of all things, yet it does not require anything outside of itself to exist. The
  Unity is not something that can be known or understood through intellection, but
  rather it is the source of all intellection.
commentary: 'The philosophical claim that the Unity is beyond all human conception
  is a counterintuitive move, as it challenges our ordinary way of thinking about
  oneness and existence. By positing the Unity as infinite in power and depth, rather
  than in extension or quantity, Plotinus is making a bold statement about the nature
  of reality. This Unity is not something that can be grasped through our ordinary
  mental processes, but rather it is the source of all existence and the cause of
  all things. The idea that the Unity is beyond all need, whether within itself or
  in relation to other things, is a key aspect of Neoplatonism. This concept has existential
  implications, as it suggests that our ordinary way of thinking about the world and
  our place in it is limited and incomplete. By recognizing the Unity as the source
  of all existence, we can begin to understand the interconnectedness of all things
  and the ultimate reality that underlies our everyday experience. The Unity is not
  something that can be known or understood through intellection, but rather it is
  the source of all intellection. This means that our ordinary way of thinking and
  knowing is not sufficient to grasp the Unity, and that we must instead approach
  it through a process of negation and transcendence.


  Key Terms:


  * **Hen** (ἕν) — from the Greek word for "one" -> refers to the Unity or the One,
  the ultimate reality in Neoplatonism -> what default translation misses is the depth
  and complexity of this concept, which is central to Plotinus'' philosophy.

  * **Nous** (νοῦς) — from the Greek word for "mind" or "intellect" -> refers to the
  highest level of cognitive faculty in Neoplatonism, which is capable of grasping
  the Unity -> what default translation misses is the distinction between nous and
  other forms of cognition, such as dianoia or logismos.

  * **Aoristos** (ἀόριστος) — from the Greek word for "indefinite" or "boundless"
  -> refers to the infinite and unbounded nature of the Unity -> what default translation
  misses is the nuance of this concept, which is not just a lack of boundaries, but
  a positive and active principle that underlies all existence.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.2.13:** "The Self is not born, nor does it die; it is not
  produced, nor does it perish. It is unborn, eternal, permanent, and ancient." This
  passage resonates with the idea of the Unity as infinite and unbounded, and suggests
  a similar concept of the ultimate reality in Hinduism.

  * **Phaedo, 78b-80c:** "The soul is immortal, and it is the source of all life and
  movement." This passage resonates with the idea of the Unity as the source of all
  existence, and suggests a similar concept of the ultimate reality in Platonism.

  * **Zhuangzi, Chapter 2:** "The Tao is the ultimate reality, and it is beyond all
  human conception." This passage resonates with the idea of the Unity as beyond all
  human conception, and suggests a similar concept of the ultimate reality in Daoism.'
abhyasa: Sit in stillness and silence, and attempt to conceive of the Unity as infinite
  in power and depth, rather than in extension or quantity. Allow your mind to transcend
  its ordinary limitations, and try to grasp the Unity as the source of all existence
  and the cause of all things. As you sit, repeat the phrase "I am not bound by my
  ordinary way of thinking" and allow yourself to open up to the possibility of a
  deeper and more profound understanding of reality.
