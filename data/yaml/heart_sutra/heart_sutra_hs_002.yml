sutra_id: HS_002
collection: Heart Sutra
section: teaching_passage
title: No Attainment, and So No Fear
anchor_translation: There is no knowledge, no attainment, and no non-attainment. Therefore,
  since there is nothing to attain, the bodhisattva, relying on the perfection of
  wisdom, dwells with a mind free of any covering. With no covering of the mind, there
  is no fear; passing beyond all distortion, he reaches final nirvāṇa.
sanskrit: 'na jñānaṃ na prāptir nāprāptiḥ. tasmāc chāriputra aprāptitvād bodhisattvasya
  prajñāpāramitām āśritya viharaty acittāvaraṇaḥ. cittāvaraṇa-nāstitvād atrasto viparyāsātikrānto
  niṣṭhā-nirvāṇaḥ.


  *(Sanskrit, IAST, source-verified from GRETIL shorter recension.)*'
transliteration: na jñānaṃ (no knowledge) na prāptiḥ (no attainment) na aprāptiḥ (nor
  non-attainment). aprāptitvāt (because of no-attainment) bodhisattvaḥ prajñāpāramitām
  āśritya (relying on the perfection of wisdom) viharati acitta-āvaraṇaḥ (dwells without
  mental covering). citta-āvaraṇa-nāstitvāt (from the absence of mental covering)
  atrastaḥ (unafraid), viparyāsa-atikrāntaḥ (having transcended distortion), niṣṭhā-nirvāṇaḥ
  (reaching final nirvāṇa).
translation: There is no knowing, no attaining, and no failing-to-attain. Precisely
  because there is nothing to be attained [aprāptitva], the bodhisattva leans on the
  perfection of wisdom and lives with a mind that has no covering over it [acittāvaraṇa].
  Because there is no covering, there is nothing to be afraid of; having stepped clear
  of every inversion of seeing [viparyāsa], he comes to nirvāṇa complete.
commentary: 'The sūtra derives fearlessness from a subtraction. Ordinary spiritual
  striving runs on a gap—between where I am and the attainment I lack—and that gap
  is exactly what fear guards. Here Avalokiteśvara removes the goal-object itself:
  "no attainment, and no non-attainment," so the ledger of spiritual gain and loss
  is voided rather than balanced. The pivotal term is *āvaraṇa*, a covering or veil
  laid over the mind; fear is presented not as an emotion to be conquered but as a
  symptom of that veil, which is woven from the belief in something to get and someone
  to get it. When the belief in attainment drops, the covering has nothing to hang
  on, and *atrasta*—untrembling—is the natural residue, not a heroic achievement.
  This is why the passage matters for retreat: the deepest obstacle late in practice
  is often the subtle ambition to "get somewhere," which quietly reinstalls the anxious
  self it was meant to dissolve. Nirvāṇa here is *niṣṭhā*, "consummate," not a place
  entered but the exhaustion of the very grasping that made distance seem real. The
  bodhisattva''s calm is thus structural: no goal, no gap, no guardian fear.


  Key Terms:


  **prāpti / aprāpti (प्राप्ति / अप्राप्ति)** — Etymology: from *pra-√āp*, "to reach,
  obtain." The sūtra negates both attainment and its negation to forestall a clever
  mind that would make "non-attainment" the new prize. Standard "attainment" hides
  how the goal-structure itself sustains bondage.

  **āvaraṇa (आवरण)** — Etymology: from *ā-√vṛ*, "to cover, enclose." The mind''s covering
  is the film of grasping and distortion; wisdom does not add insight so much as remove
  the veil. "Obstruction" undertranslates the image of something draped over awareness.

  **viparyāsa (विपर्यास)** — Etymology: "turning-about, inversion." The four classic
  inversions take the impermanent as permanent, the painful as pleasant, the impure
  as pure, the selfless as self. Transcending *viparyāsa* is seeing rightly, not seeing
  something new.

  **atrasta (अत्रस्त)** — Etymology: *a-* (not) + *trasta* (trembling, from *√tras*,
  to tremble). Fearlessness as the absence of trembling once the grasped self is unfound—a
  negative, bodily word, not a triumphant one.


  Cross-Tradition Resonances:


  **Epictetus, Enchiridion 1–2:** fear tracks what we treat as ours to gain or lose;
  freedom comes by relocating concern away from externals. The Heart Sūtra radicalizes
  this by voiding the internal goal too.

  *Divergence:* Epictetus keeps a firm agent (the *prohairesis*) that chooses rightly;
  the sūtra dissolves the very agent whose choices Stoicism fortifies.

  **Meister Eckhart, on *Abgeschiedenheit* (detachment):** the soul empty of "this
  and that," even empty of a wanted God, becomes fearless and free—structurally the
  *acittāvaraṇa* move of an uncovered mind.

  *Divergence:* Eckhart''s emptied ground opens onto God''s birth within; the sūtra''s
  uncovering opens onto no ground at all, nirvāṇa as cessation of grasping rather
  than union.

  **Tao Te Ching 48 ("do less and less until nothing is done"):** attainment by subtraction,
  freedom through the loss of grasping aims.

  *Divergence:* the Daoist telos is spontaneous accord with the Way (*ziran*); the
  sūtra''s telos is the extinction of the distortions that project any "way" to arrive
  along.'
abhyasa: 'Sit and name, once, the thing you are quietly trying to attain in your practice—calm,
  insight, a state, an identity as "one who practices." Then set it down with the
  sentence: "there is nothing to attain." Notice whether a small fear or restlessness
  appears when the goal is removed; let it be there, uncovered, and keep sitting without
  reinstalling the goal.'
source: Avalokiteśvara to Śāriputra, *Prajñāpāramitāhṛdaya* (HS_002; GRETIL Sanskrit
