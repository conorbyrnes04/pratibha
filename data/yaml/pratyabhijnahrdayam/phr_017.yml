glossary:
- term: madhya
  definition: 'the middle; simultaneously: the central channel, the middle breath,
    the gap between thoughts, the *vimarśa* within experience'
- term: vikāsa
  definition: unfoldment, development, blossoming; natural expansion rather than forced
    achievement
- term: cidānanda
  definition: the Bliss of Consciousness (see Sūtra 16)
- term: lābha
  definition: obtaining, acquisition; genuine attainment
