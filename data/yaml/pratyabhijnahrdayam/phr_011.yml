glossary:
- term: ābhāsana
  definition: manifestation, appearing, the act of shining forth; corresponds to *sṛṣṭi*
- term: rakti
  definition: enjoyment, redness, affective coloring, savoring; corresponds to *sthiti*
- term: vimarśana
  definition: self-recognition, reflexive awareness, the I-consciousness knowing itself;
    corresponds to *saṁhāra*
- term: bījāvasthāpana
  definition: sowing of the seed; the implanting of *saṁskāra* (impression); corresponds
    to *vilaya*
- term: vilāpana
  definition: dissolution, merging back into the unmanifest; corresponds to *anugraha*
themes:
- recognition
- consciousness
- nonduality
- practice
- self
