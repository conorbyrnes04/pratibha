sutra_id: PHR_011
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 11
sanskrit: आभासनरक्तिविमर्शनबीजावस्थापनविलापनतस्तानि
transliteration: ābhāsana-rakti-vimarśana-bīja-avasthāpana-vilāpanataḥ tāni
translation: 'Those five functions can also be named: Manifestation, Enjoyment, Self-recognition,
  Sowing of the seed, and Dissolution.'
commentary: 'A second set of names for the pañcakṛtya, each with a subtler phenomenological
  flavor. *Ābhāsana* (manifestation) is the moment of appearance — the arising of
  any experience. *Rakti* (enjoyment, or "redness") is the middle moment when experience
  is savored, colored, inhabited — the affective and appreciative quality of presence.
  *Vimarśana* is the most significant term: self-recognition, the moment Consciousness
  knows itself through and as the experience — the *I-consciousness* (*ahaṁ*) illuminating
  from within. *Bījāvasthāpana* is the sowing of seeds — the impressional residue
  (*saṁskāra*) deposited for future arising. *Vilāpana* is dissolution — returning
  to the unmanifest. This second set reveals that the five cosmic acts are simultaneously
  five moments in every single experience.


  Cross-Tradition Resonance:

  - Vijñāna Bhairava Tantra dhāraṇā 49: the practice of recognizing *vimarśa* — the
  self-luminous knowing — within ordinary experience.

  - Buddhist *momentariness* (*kṣaṇikavāda*): experience as a series of arising-abiding-passing
  moments; here reinterpreted as Consciousness in five-fold play.

  - Husserl''s phenomenology of time-consciousness: retention, primal impression,
  protention — a Western structural parallel to the five-moment analysis.'
voice_of_siva: ''
abhyasa: 'Take one complete breath — one inhalation, one exhalation — and map the
  five moments onto it. *Ābhāsana*: the breath arising. *Rakti*: the fullness of the
  held breath. *Vimarśana*: the awareness that knows the breath, recognizing itself.
  *Bījāvasthāpana*: the pause at the end, the impression left. *Vilāpana*: the full
  release. The entire cosmos in one breath.'
