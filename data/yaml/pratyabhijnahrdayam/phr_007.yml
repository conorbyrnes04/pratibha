glossary:
- term: dvirūpa
  definition: having two forms; *Śiva* and *Śakti* as the primal polarity
- term: trimaya
  definition: 'triple; the three Śaktis: *icchā* (will), *jñāna* (knowledge), *kriyā*
    (action)'
- term: caturātmā
  definition: 'fourfold; the four levels of experiencer: *śāmbhava*, *śākta*, *āṇava*,
    *māyīya*'
- term: saptapañcaka
  definition: seven groups of five; the 35 tattvas of the Kashmir Śaiva cosmological
    schema
