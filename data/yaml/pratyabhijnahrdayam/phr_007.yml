sutra_id: PHR_007
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 7
sanskrit: स चैको द्विरूपस्त्रिमयश्चतुरात्मा सप्तपञ्चकस्वभावः
transliteration: saḥ ca ekaḥ dvirūpaḥ trimayaḥ catur-ātmā sapta-pañcaka-svabhāvaḥ
translation: And though He — the Supreme Self — is One, He becomes double, triple,
  fourfold, and of the nature of seven groups of five.
commentary: 'This sūtra is a condensed cosmological map. The One does not remain undifferentiated
  — it expresses itself in structures: dual (*Śiva-Śakti*), triple (*icchā-jñāna-kriyā*,
  the three powers of will, knowledge, and action), fourfold (the four *pramātā* levels
  of experiencer), and then the vast 35-tattva structure of the Kashmir Śaiva cosmos
  (seven groups of five: five voids, five Śaktis, five elements, etc.). This is not
  a claim that these structures are ultimately real — they are the clothing of the
  One. But neither are they dismissed. The tradition honors the full texture of manifestation
  as genuine expression of the sovereign freedom explored in Sūtra 1. The map is here
  for those who need it; it is not the territory.


  Cross-Tradition Resonance:

  - Plotinus'' three hypostases: the One, Intellect, Soul — a similar movement from
  unity through graded manifestation.

  - Kabbalistic *Sefirot*: the one Ein Sof expressing through ten archetypal qualities,
  a parallel mapping of unity-into-structure.

  - Vijñāna Bhairava Tantra: the 112 dhāraṇās as 112 entry points into the one reality
  — multiplicity of access to singular ground.'
voice_of_siva: ''
abhyasa: 'Take any experience right now and trace it through three registers: the
  *wanting* of it (*icchā*), the *knowing* of it (*jñāna*), and the *doing* around
  it (*kriyā*). Notice these are not three separate events but three faces of one
  moment. Then notice what contains all three. That is the *ekaḥ* — the One behind
  the triad.'
