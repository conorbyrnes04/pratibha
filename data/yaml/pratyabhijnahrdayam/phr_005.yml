glossary:
- term: avarūḍhā
  definition: descended, having come down; the movement from pure awareness toward
    objectification
- term: cetya
  definition: the knowable, the object; what is taken up by awareness as content
- term: saṅkocinī
  definition: contracting, condensing; Consciousness compressing itself into the form
    of object
- term: citta
  definition: mind; individual mental activity; here understood as contracted Citi
