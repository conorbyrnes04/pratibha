glossary:
- term: citivahni
  definition: the Fire of Consciousness; *vahni* means fire; the image of awareness
    as a consuming, illuminating flame
- term: avaroha
  definition: descent, the inferior stage; the contracted condition
- term: channa
  definition: covered, concealed, obscured; the fire beneath ash
- term: meya-indhana
  definition: the fuel of the knowables; objects of experience as what the fire of
    consciousness consumes/illuminates
- term: pluṣyati
  definition: burns, consumes partially; the partial illumination of the contracted
    state
