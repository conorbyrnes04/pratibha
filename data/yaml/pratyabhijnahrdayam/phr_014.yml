sutra_id: PHR_014
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 14
sanskrit: चितिवह्निरवरोहपदे छन्नोऽपि मात्रया मेयेन्धनं प्लुष्यति
transliteration: citi-vahniḥ avaroha-pade channaḥ api mātrayā meya-indhanam pluṣyati
translation: The Fire of Consciousness, though covered in the inferior stage, partially
  consumes the fuel of the knowables.
commentary: 'Even in its most contracted, most concealed state — even in the depths
  of *māyāpramātā* bewilderment — Consciousness never fully stops burning. *Citivahni*
  — the Fire of Consciousness — is always and already consuming the objects of experience,
  illuminating them, making them knowable. The word *mātrayā* — "partially" — names
  the honest condition of the ordinary person: not fully awake, not fully extinguished.
  The fire smolders beneath the ash. Every act of knowing, even the most contracted,
  is Citi at work. This is why practice works: you are not building a fire from scratch.
  You are uncovering and feeding one that never went out.


  Cross-Tradition Resonance:

  - Heraclitus Fragment 30: the ever-living fire as the underlying logos of the cosmos
  — a Western parallel to *citivahni*.

  - Vijñāna Bhairava Tantra dhāraṇā 52: the practice of contemplating the fire of
  awareness consuming objects.

  - Spanda Kārikā I.8–9: the Spanda principle as always present, never absent, even
  in the most contracted state.'
voice_of_siva: ''
abhyasa: In your next conversation, notice the simple fact that you *understand* what
  is being said. Not the content — the bare fact of comprehension arising. That arising
  is *citivahni* at work. The fire is already burning. Can you feel the warmth of
  knowing itself, prior to what is known?
