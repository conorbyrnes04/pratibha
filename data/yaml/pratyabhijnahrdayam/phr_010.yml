glossary:
- term: pañcakṛtya
  definition: the fivefold act; the five cosmic functions performed at both universal
    and individual scales
- term: sṛṣṭi
  definition: manifestation, projection, creation
- term: sthiti
  definition: maintenance, sustaining
- term: saṁhāra
  definition: dissolution, reabsorption
- term: vilaya
  definition: concealment, obscuration of one's own nature
- term: anugraha
  definition: grace, the bestowal of recognition
