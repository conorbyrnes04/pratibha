glossary:
- term: aparijñāna
  definition: complete ignorance, non-recognition; not mere absence of knowledge but
    failure of recognition
- term: svaśakti
  definition: one's own powers; the very capacities of Consciousness that generate
    and sustain experience
- term: vyāmohitātā
  definition: bewilderment, infatuation, being confused or deluded; from *vi + ā +
    moha*, the deepest confusion
- term: saṁsāritva
  definition: the condition of being a transmigratory soul; bondage as a structural
    state
themes:
- recognition
- consciousness
- nonduality
- self
