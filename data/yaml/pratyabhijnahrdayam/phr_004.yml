glossary:
- term: saṅkoca
  definition: contraction, limitation; the process by which universal Consciousness
    becomes individual awareness
- term: cetana
  definition: the individual experiencer, personal consciousness; distinguished from
    *citi* (universal)
- term: viśvamaya
  definition: pervaded by or consisting of the universe; universe-containing
- term: saṅkucita
  definition: contracted, limited, reduced in scope
