sutra_id: PHR_006
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 6
sanskrit: तन्मयो मायाप्रमाता
transliteration: tanmayaḥ māyā-pramātā
translation: The limited experient ruled by Māyā consists of that — of contracted
  mind.
commentary: '*Māyāpramātā* — the experient at the level of Māyā — is the ordinary
  human self: not evil, not fallen in any moral sense, but structurally contracted,
  structurally identified with mental content. *Tanmayaḥ* — "consisting of that" —
  names the identification precisely: the ordinary self is not merely *in* the mind,
  it *is* the mind, in the sense of being wholly absorbed in its contractions. Kṣemarāja
  notes that this experient rests at the level of Māyā, which he calls "the profound
  void of ignorance" — not a void in the Buddhist sense but the void of not recognizing
  one''s own nature. This is *avidyā* not as intellectual error but as structural
  forgetting.


  Cross-Tradition Resonance:

  - Spanda Kārikā I.2: the *pramātā* who does not recognize the Spanda principle,
  the throb of Consciousness beneath all activity.

  - Epictetus: the one who mistakes externals (*ta ektos*) for what is "up to us"
  — structural misidentification, not moral failure.

  - Dào Dé Jīng ch. 16: "Returning to the root is called stillness. Not knowing this
  constancy is the source of confusion."'
voice_of_siva: ''
abhyasa: 'Today, notice the moment of identification — when "I" becomes wholly absorbed
  in a thought, an emotion, a role. Not to reject it, but to note: *something is noticing
  this identification*. That noticing is not itself identified. Rest there briefly,
  then continue.'
