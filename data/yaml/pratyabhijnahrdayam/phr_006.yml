glossary:
- term: māyā
  definition: the power of differentiation and concealment; here not illusion in a
    dismissive sense but the structural principle of limitation
- term: pramātā
  definition: the experient, the one who knows; the subject of experience
- term: māyāpramātā
  definition: the limited individual experient, the ordinary self conditioned by Māyā
- term: tanmaya
  definition: consisting of that, made of that; wholly absorbed in or identified with
