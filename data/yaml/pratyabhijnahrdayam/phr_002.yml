  sadhana: With eyes open or closed, observe whatever arises — sounds, sensations,
    thoughts. Instead of treating them as things you encounter, experiment with the
    recognition that they are *appearing in* and *as* your awareness. The canvas and
    the painting are not two. Rest in the one that contains both.
glossary:
- term: svecchayā
  definition: through Her own Will (*sva* + *icchā*); not arbitrary choice but the
    natural spontaneity of absolute freedom
- term: svabhitti
  definition: Her own Canvas (*sva* + *bhitti*, wall/surface); Consciousness as the
    support on which the universe appears
- term: viśvam
  definition: the universe, the totality of appearance
- term: unmīlayati
  definition: unfolds, causes to blossom, opens; the image of a flower or an eye opening
themes:
