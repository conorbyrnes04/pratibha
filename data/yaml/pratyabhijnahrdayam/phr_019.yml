glossary:
- term: samādhi
  definition: meditative absorption, the state of full recognition; here not just
    concentration but the recognition of Sūtra 13
- term: saṁskāra
  definition: impressions, traces, residual effects; the marks left by samādhi in
    the post-absorption state
- term: vyutthāna
  definition: the rising or coming-up state; post-samādhi ordinary consciousness,
    the between state
- term: āmarśa
  definition: touching, brushing, gentle reflection; not forceful concentration but
    repeated gentle recognition
- term: nityodita
  definition: ever-risen, permanently dawned; the sun that has fully risen and does
    not set again
themes:
- recognition
