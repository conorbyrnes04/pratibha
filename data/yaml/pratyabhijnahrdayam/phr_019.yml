sutra_id: PHR_019
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 19
sanskrit: समाधिसंस्कारवति व्युत्थाने भूयो भूयश्चिदैक्यामर्शान्नित्योदितसमाधिलाभः
transliteration: samādhi-saṁskāravati vyutthāne bhūyas bhūyaḥ cit-aikya-āmarśāt nitya-udita-samādhi-lābhaḥ
translation: In the state following Samādhi, which is full of its impressions, through
  repeated reflection on one's identity with Consciousness, there is acquisition of
  the ever-ri...
commentary: 'Extended Translation:

  In the state following Samādhi, which is full of its impressions, through repeated
  reflection on one''s identity with Consciousness, there is acquisition of the ever-risen
  Samādhi.


  This sūtra addresses the practitioner''s most common struggle: the loss of recognition
  after a genuine glimpse. *Vyutthāna* — the post-samādhi state — is ordinary waking
  consciousness that carries the impressions (*saṁskāra*) of the deep recognition.
  In this in-between condition, the practitioner is neither fully in the contracted
  ordinary state nor fully established in recognition. The prescription is not to
  force a return to samādhi but to repeatedly (*bhūyaḥ bhūyaḥ*) reflect on identity
  with Consciousness — *āmarśa*, the act of touching or brushing against the recognition,
  again and again. The goal is *nityodita* — the ever-risen, permanently dawned Samādhi.
  Not a continuous trance state but a continuous *background recognition* that persists
  through ordinary activity. This is the *jīvanmukti* of Sūtra 16 described from the
  practitioner''s path.


  Cross-Tradition Resonance:

  - Spanda Kārikā III.13: the practitioner who repeatedly recognizes the Spanda eventually
  establishes in it permanently.

  - Zen''s *kenshō* and subsequent practice: the initial recognition (*kenshō*) is
  not the end; the *samādhi-saṁskāra* work of Sūtra 19 is exactly what the Zen tradition
  calls "polishing the mirror" after the first seeing.

  - St. John of the Cross on *recollection* (recogimiento): the repeated gentle turning
  of awareness toward God between full contemplative states — a Christian parallel.'
voice_of_siva: ''
abhyasa: After any meditation — or any moment of genuine clarity, however brief —
  do not immediately re-engage with tasks. Sit for two to five minutes and let the
  recognition *settle*. Then, during the day, when you notice you have drifted, simply
  touch the recognition again — once, briefly, without drama. *Bhūyaḥ bhūyaḥ* — again
  and again. This is the actual practice of *nityodita-samādhi*.
