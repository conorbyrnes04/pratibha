glossary:
- term: mala
  definition: 'impurity; the three structural *malas*: *āṇava* (sense of imperfection/insufficiency),
    *māyīya* (sense of genuine otherness/difference), *kārma* (sense of being a limited
    agent)'
- term: āvṛta
  definition: covered, veiled, obscured
- term: saṁsārī
  definition: the transmigratory soul; the one caught in conditioned cycling
- term: saṅkoca
  definition: contraction; here the root cause of the bound condition
