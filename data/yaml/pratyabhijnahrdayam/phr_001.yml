sutra_id: PHR_001
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 1
sanskrit: चितिः स्वतन्त्रा विश्वसिद्धिहेतुः
transliteration: citiḥ svatantrā viśva-siddhi-hetuḥ
translation: The sovereign Śakti — absolute Consciousness — is the cause of the manifestation,
  maintenance, and dissolution of the universe.
commentary: 'The text opens not with an argument but with a declaration: Consciousness
  is the ground. Not one thing among others, not a property of matter, not an emergent
  phenomenon — but the very substrate in which a universe arises, persists, and dissolves.
  *Citi* is distinguished from *cetanā* (individual awareness) — this is not your
  consciousness or mine. It is the field within which both you and I appear. *Svatantrā*
  — absolute freedom, sovereign independence — names its essential nature: it is not
  conditioned by anything outside itself, because there is nothing outside itself.


  Cross-Tradition Resonance:

  - Śiva Sūtra I.1: *caitanyam ātmā* — Consciousness is the Self. The two texts open
  in unison.

  - Dào Dé Jīng ch. 1: the Tao that can be named is not the eternal Tao — both resist
  reduction to a named object while insisting on primacy.

  - Plotinus, *Enneads* V.1: the One as the self-sufficient source from which Intellect
  and Soul emanate. The structure differs; the intuition of a self-originating ground
  is the same.'
voice_of_siva: ''
abhyasa: 'Sit. Notice that you are aware. Now ask: what is aware of that awareness?
  Follow the thread back past sensation, past thought, past the sense of being a particular
  person — to the simple fact of knowing itself. This is *citi* pointing at itself
  through you.'
