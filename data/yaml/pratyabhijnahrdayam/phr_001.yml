  sadhana: 'Sit. Notice that you are aware. Now ask: what is aware of that awareness?
    Follow the thread back past sensation, past thought, past the sense of being a
    particular person — to the simple fact of knowing itself. This is *citi* pointing
    at itself through you.'
glossary:
- term: citi
  definition: universal Consciousness, the absolute power of awareness; distinguished
    from *cetanā* (individual knowing)
- term: svatantrā
  definition: absolutely free, self-determining, sovereign; from *sva* (own) + *tantra*
    (loom, system) — that which operates entirely on its own terms
- term: viśva
  definition: the universe, all that appears
- term: siddhi
  definition: 'here: the triple process of manifestation (*sṛṣṭi*), maintenance (*sthiti*),
    and dissolution (*saṁhāra*); not "supernormal power"'
- term: hetu
  definition: cause, ground, reason
themes:
- consciousness
- nonduality
- self
