sutra_id: PHR_003
collection: Pratyabhijnahrdayam
section: sutra
title: Sutra 3
sanskrit: तन्नानानुरूपग्राह्यग्राहकभेदात्
transliteration: tad-nānā-anurūpa-grāhya-grāhaka-bhedāt
translation: The universe is multiple because of the differentiation of reciprocally
  adapted objects and subjects.
commentary: 'Multiplicity is not a mistake. The one Consciousness does not fragment
  — it differentiates. *Grāhya* (the knowable) and *grāhaka* (the knower) arise together,
  paired, co-constitutive. There is no object without a subject oriented toward it;
  no subject without an object it takes up. This pairing — *anurūpa*, "mutually adapted"
  — is what generates the texture of experience. The whole phenomenal world is a vast
  ecology of perceiving and perceived, each form of awareness calling forth its corresponding
  objects. Kṣemarāja insists this diversity does not contradict non-duality: the one
  canvas supports infinite paintings without itself being divided.


  Cross-Tradition Resonance:

  - Leibniz''s monadology: each monad perceives the whole universe from its own perspective
  — multiplicity as viewpoint-differentiation within a single field.

  - Indra''s Net (*Avataṁsaka Sūtra*): each jewel reflects all others; multiplicity
  as mutual reflection within a unified field.

  - Heraclitus Fragment 50: the one and the many, the logos that unifies what appears
  divided.'
voice_of_siva: ''
abhyasa: In conversation today, notice the moment of contact between your knowing
  and another's being. What is the quality of that gap — perceiver and perceived?
  Can you sense both poles as arising within the same field of awareness, rather than
  as two separate substances meeting?
