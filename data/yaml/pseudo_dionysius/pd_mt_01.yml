sutra_id: PD_MT_01
collection: Pseudo-Dionysius
section: Mystical Theology · MT I
title: The Divine Dark Beyond All Light
sanskrit: Τριὰς ὑπερούσιε καὶ ὑπέρθεε καὶ ὑπεράγαθε.
transliteration: Greek (corpus original field).
translation: Trinity, which exceedeth all Being, Deity, and Goodness! Thou that instructeth Christians
  in Thy heavenly wisdom! Guide us to that topmost height of mystic lore which exceedeth light and more
  than exceedeth knowledge, where the simple, absolute, and unchangeable mysteries of heavenly Truth lie
  hidden in the dazzling obscurity of the secret Silence, outshining all brilliance with the intensity
  of their darkness, and surcharging our blinded intellects with the utterly impalpable and invisible
  fairness of glories which exceed all beauty!
commentary: '«The Divine Dark Beyond All Light» opens the Mystical Theology by praying into a darkness
  denser than light: God is approached where ordinary knowing goes blind. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
themes:
- knowledge
- ignorance
- silence
