sutra_id: PD_DN_04
collection: Pseudo-Dionysius
section: Divine Names · DN II
title: Divine Names Belong to the Entire Godhead
sanskrit: ''
transliteration: ''
translation: '''Tis the whole Being of the Supernal Godhead (saith the Scripture) that the Absolute Goodness
  hath defined and revealed. Now this matter we have discussed elsewhere, and have shown that all the
  Names proper to God are always applied in Scripture not partially but to the whole, entire, full, complete
  Godhead, and that they all refer indivisibly, absolutely, unreservedly, and wholly to all the wholeness
  of the whole and entire Godhead. Indeed, if any one deny that such utterance refers to the whole Godhead,
  he blasphemeth and profanely dares to divide the Absolute and Supreme Unity. We must, then, take them
  as referring unto the entire Godhead.'
commentary: '«Divine Names Belong to the Entire Godhead» refuses partial naming: Good, Being, Life, and
  Lord belong to the whole Unity, not to a fragment of Deity. Read it as a demand on attention, not as
  a museum label: hold the argument until its force lands, then let one concrete shift follow into ordinary
  life. Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
