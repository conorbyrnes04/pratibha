sutra_id: PD_DN_06
collection: Pseudo-Dionysius
section: Divine Names · DN IV
title: The Good Extends Itself Like the Sun
sanskrit: ''
transliteration: ''
translation: Now let us consider the name of "Good" which the Sacred Writers apply to the Supra-Divine
  Godhead in a transcendent manner, calling the Supreme Divine Existence Itself "Goodness" (as it seems
  to me) in a sense that separates It from the whole creation, and meaning, by this term, to indicate
  that the Good, under the form of Good-Being, extends Its goodness by the very fact of Its existence
  unto all things. For as our sun, through no choice or deliberation, but by the very fact of its existence,
  gives light to all those things which have any inherent power of sharing its illumination, even so the
  Good (which is above the sun, as the transcendent archetype by the very mode of its existence is above
  its faded image) sends forth upon all things according to their receptive powers, the rays of Its undivided
  Goodness.
commentary: '«The Good Extends Itself Like the Sun» is Dionysius''s great participation image: goodness
  pours out by being, received according to each thing''s capacity. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
