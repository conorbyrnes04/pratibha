sutra_id: PD_DN_07
collection: Pseudo-Dionysius
section: Divine Names · DN IV
title: Evil Hath No Being
sanskrit: ''
transliteration: ''
translation: Thus evil hath no being, nor any inherence in things that have being. Evil is nowhere qua
  evil; and it arises not through any power but through weakness. Even the devils derive their existence
  from the Good, and their mere existence is good. Their evil is the result of a fall from their proper
  virtues, and is a change with regard to their individual state, a weakness of their true angelical perfections.
  And they desire the Good in so far as they desire existence, life, and understanding; and in so far
  as they do not desire the Good, they desire that which hath no being. And this is not desire, but an
  error of real desire. In a word, evil (as we have often said) is weakness, impotence, and deficiency
  of knowledge (or, at least, of exercised knowledge), or of faith, desire, or activity as touching the
  Good.
commentary: '«Evil Hath No Being» is the classic privation thesis: evil is weakness and falling short
  of the Good, not a rival substance with its own power. Read it as a demand on attention, not as a museum
  label: hold the argument until its force lands, then let one concrete shift follow into ordinary life.
  Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
