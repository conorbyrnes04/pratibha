sutra_id: PD_MT_02
collection: Pseudo-Dionysius
section: Mystical Theology · MT I
title: Leave the Senses and the Intellect
sanskrit: ''
transliteration: ''
translation: Such be my prayer; and thee, dear Timothy, I counsel that, in the earnest exercise of mystic
  contemplation, thou leave the senses and the activities of the intellect and all things that the senses
  or the intellect can perceive, and all things in this world of nothingness, or in that world of being,
  and that, thine understanding being laid to rest, thou strain (so far as thou mayest) towards an union
  with Him whom neither being nor understanding can contain. For, by the unceasing and absolute renunciation
  of thyself and all things, thou shalt in pureness cast all things aside, and be released from all, and
  so shalt be led upwards to the Ray of that divine Darkness which exceedeth all existence.
commentary: '«Leave the Senses and the Intellect» is Dionysius''s counsel to Timothy: union requires laying
  the understanding to rest, not stacking finer concepts. Read it as a demand on attention, not as a museum
  label: hold the argument until its force lands, then let one concrete shift follow into ordinary life.
  Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
