sutra_id: PD_DN_03
collection: Pseudo-Dionysius
section: Divine Names · DN I
title: Illuminations According to Each Creature's Powers
sanskrit: Οὐ μὴν ἀκοινώνητόν ἐστι καθόλου τἀγαθὸν οὐδενὶ τῶν ὄντων, ἀλλ’ ἐφ’ ἑαυτοῦ μονίμως τὴν ὑπερούσιον
  ἱδρῦσαν ἀκτῖνα ταῖς ἑκάστου τῶν ὄντων ἀναλόγοις ἐλλάμψεσιν ἀγαθοπρεπῶς ἐπιφαίνεται καὶ πρὸς τὴν ἐφικτὴν
  αὑτοῦ θεωρίαν καὶ κοινωνίαν καὶ ὁμοίωσιν ἀνατείνει τοὺς ἱεροὺς νόας τοὺς ὡς θεμιτὸν αὐτῷ καὶ ἱεροπρεπῶς
  ἐπιβάλλοντας καὶ μήτε πρὸς τὸ ὑπέρτερον τῆς ἐναρμονίως ἐνδιδομένης θεοφανείας ἀδυνάτως ἀπαυθαδιζομένους
  μήτε πρὸς τὸ κάταντες ἐκ τῆς ἐπὶ τὸ χεῖρον ὑφέσεως ἀπολισθαίνοντας, ἀλλ’ εὐσταθῶς τε καὶ ἀκλινῶς ἐπὶ
  τὴν ἀκτῖνα τὴν αὐτοῖς ἐπιλάμπουσαν ἀνατεινομένους καὶ τῷ συμμέτρῳ τῶν θεμιτῶν ἐλλάμψεων ἔρωτι μετ’ εὐλαβείας
  ἱερᾶς σωφρόνως τε καὶ ὁσίως ἀναπτερουμένους.
transliteration: Greek scholarly romanization (see canonical iast layer).
translation: Not that the Good is wholly incommunicable to anything; nay, rather, while dwelling alone
  by Itself, and having there firmly fixed Its super-essential Ray, It lovingly reveals Itself by illuminations
  corresponding to each separate creature's powers, and thus draws upwards holy minds into such contemplation,
  participation and resemblance of Itself as they can attain—even them that holily and duly strive thereafter
  and do not seek with impotent presumption the Mystery beyond that heavenly revelation which is so granted
  as to fit their powers, nor yet through their lower propensity slip down the steep descent, but with
  unwavering constancy press onwards toward the ray that casts its light upon them and, through the love
  responsive to these gracious illuminations, speed their temperate and holy flight on the wings of a
  godly reverence.
commentary: '«Illuminations According to Each Creature''s Powers» balances transcendence with gift: the
  Good remains alone, yet reveals itself by measure to each capacity. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
