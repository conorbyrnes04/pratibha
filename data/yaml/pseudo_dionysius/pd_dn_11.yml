sutra_id: PD_DN_11
collection: Pseudo-Dionysius
section: Divine Names · DN VIII / XI
title: Power and the Peace That Unites
sanskrit: ''
transliteration: ''
translation: God is Power because in His own Self He contains all power beforehand and exceeds it, and
  because He is the Cause of all power and produces all things by a power which may not be thwarted nor
  circumscribed. Yea, He is Infinitely Powerful not only in that all Power comes from Him, but also because
  He is above all power and is Very Power. Now let us praise with reverent hymns of peace the Divine Peace
  which is the Source of all mutual attraction. For this Quality it is that unites all things together
  and begets and produces the harmonies and agreements of all things. And hence it is that all things
  long for It, and that It draws their manifold separate parts into the unity of the whole and unites
  the battling elements of the world into concordant fellowship.
commentary: '«Power and the Peace That Unites» pairs two names of providence: unbounded Power and the
  Peace that gathers battling parts into concord. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
