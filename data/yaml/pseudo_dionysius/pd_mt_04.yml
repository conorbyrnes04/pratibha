sutra_id: PD_MT_04
collection: Pseudo-Dionysius
section: Mystical Theology · MT II
title: Carving the Latent Image
sanskrit: Πῶς δεῖ καὶ ἑνοῦσθαι καὶ ὑμνεῖν τὸν πάντων αἴτιον καὶ ὑπὲρ πάντα.
transliteration: Greek (corpus original field).
translation: Unto this Darkness which is beyond Light we pray that we may come, and may attain unto vision
  through the loss of sight and knowledge, and that in ceasing thus to see or to know we may learn to
  know that which is beyond all perception and understanding (for this emptying of our faculties is true
  sight and knowledge), and that we may offer Him that transcends all things the praises of a transcendent
  hymnody, which we shall do by denying or removing all things that are—like as men who, carving a statue
  out of marble, remove all the impediments that hinder the clear perceptive of the latent image and by
  this mere removal display the hidden statue itself in its hidden beauty.
commentary: '«Carving the Latent Image» makes negation sculptural: truth appears not by adding predicates
  but by removing what blocks the latent form. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
themes:
