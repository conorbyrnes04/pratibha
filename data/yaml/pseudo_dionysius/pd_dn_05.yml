sutra_id: PD_DN_05
collection: Pseudo-Dionysius
section: Divine Names · DN III
title: Prayer Draws Us to the Immovable Rock
sanskrit: ''
transliteration: ''
translation: 'Or even as, having embarked on a ship and clinging to the cables, the which being stretched
  out from some rock unto us, presented themselves (as it were) for us to lay hold upon them, we should
  not be drawing the rock towards ourselves, but should, in very truth, be drawing ourselves and the vessel
  towards the rock; as also, conversely, if any one standing upon the vessel pushes away the rock that
  is on the shore, he will not affect the rock (which stands immovable) but will separate himself therefrom,
  and the more he pushes it so much the more will he be staving himself away. Hence, before every endeavour,
  more especially if the subject be Divinity, must we begin with prayer: not as though we would pull down
  to ourselves that Power which is nigh both everywhere and nowhere, but that, by these remembrances and
  invocations of God, we may commend and unite ourselves Thereunto.'
commentary: '«Prayer Draws Us to the Immovable Rock» teaches that invocation does not drag God down; it
  draws the soul toward what already stands near. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
