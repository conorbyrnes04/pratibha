sutra_id: PD_MT_07
collection: Pseudo-Dionysius
section: Mystical Theology · MT V
title: Not Any Intelligible Thing
sanskrit: Ὅτι οὐδὲ κατὰ τὰς ἀφαιρέσεις ἐστὶ τῶν πάντων ὁ πάντων αἴτιος.
transliteration: Greek (corpus original field).
translation: Once more, ascending yet higher we maintain that It is not soul, or mind, or endowed with
  the faculty of imagination, conjecture, reason, or understanding; nor is It any act of reason or understanding;
  nor can It be described by the reason or perceived by the understanding, since It is not number, or
  order, or greatness, or littleness, or equality, or inequality, and since It is not immovable nor in
  motion, or at rest, and has no power, and is not power or light, and does not live, and is not life;
  nor is It personal essence, or eternity, or time; nor can It be grasped by the understanding since It
  is not knowledge or truth; nor is It kingship or wisdom; nor is It one, nor is It unity, nor is It Godhead
  or Goodness; nor is It a Spirit, as we understand the term, since It is not Sonship or Fatherhood; nor
  is It any other thing such as we or any other being can have knowledge of; nor does It belong to the
  category of non-existence or to that of existence.
commentary: '«Not Any Intelligible Thing» denies even the highest metaphysical titles as adequate names:
  soul, mind, being, unity, and Godhead-as-we-conceive-it all fall short. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
themes:
- knowledge
- ignorance
- silence
- grace
