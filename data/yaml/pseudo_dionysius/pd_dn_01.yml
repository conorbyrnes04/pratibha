sutra_id: PD_DN_01
collection: Pseudo-Dionysius
section: Divine Names · DN I
title: Dare Not Speak Except What Scripture Reveals
sanskrit: ''
transliteration: ''
translation: We must not then dare to speak, or indeed to form any conception, of the hidden super-essential
  Godhead, except those things that are revealed to us from the Holy Scriptures. For a super-essential
  understanding of It is proper to Unknowing, which lieth in the Super-Essence Thereof surpassing Discourse,
  Intuition and Being; acknowledging which truth let us lift up our eyes towards the steep height, so
  far as the effluent light of the Divine Scriptures grants its aid, and, as we strive to ascend unto
  those Supernal Rays, let us gird ourselves for the task with holiness and the reverent fear of God.
  For, if we may safely trust the wise and infallible Scriptures, Divine things are revealed unto each
  created spirit in proportion to its powers, and in this measure is perception granted through the workings
  of the Divine goodness, the which in just care for our preservation divinely tempereth unto finite measure
  the infinitude of things which pass man's understanding.
commentary: '«Dare Not Speak Except What Scripture Reveals» opens the Divine Names under discipline: naming
  God is permitted only as revelation and capacity allow. Read it as a demand on attention, not as a museum
  label: hold the argument until its force lands, then let one concrete shift follow into ordinary life.
  Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
