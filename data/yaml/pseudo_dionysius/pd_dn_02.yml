sutra_id: PD_DN_02
collection: Pseudo-Dionysius
section: Divine Names · DN I
title: Super-Essence Beyond Mind and Word
sanskrit: Ὥσπερ γὰρ ἄληπτα καὶ ἀθεώρητα τοῖς αἰσθητοῖς ἐστι τὰ νοητὰ καὶ τοῖς ἐν πλάσει καὶ τύπῳ τὰ ἁπλᾶ
  καὶ ἀτύπωτα, τοῖς τε κατὰ σωμάτων σχήματα μεμορφωμένοις ἡ τῶν ἀσωμάτων ἀναφὴς καὶ ἀσχημάτιστος ἀμορφία,
  κατὰ τὸν αὐτὸν τῆς ἀληθείας λόγον ὑπέρκειται τῶν οὐσιῶν ἡ ὑπερούσιος ἀπειρία καὶ τῶν νοῶν ἡ ὑπὲρ νοῦν
  ἑνότης. Καὶ πάσαις διανοίαις ἀδιανόητόν ἐστι τὸ ὑπὲρ διάνοιαν ἕν, ἄῤῥητόν τε λόγῳ παντὶ τὸ ὑπὲρ λόγον
  ἀγαθόν, ἑνὰς ἑνοποιὸς ἁπάσης ἑνάδος καὶ ὑπερούσιος οὐσία καὶ νοῦς ἀνόητος καὶ λόγος ἄῤῥητος, ἀλογία
  καὶ ἀνοησία καὶ ἀνωνυμία κατὰ μηδὲν τῶν ὄντων οὖσα καὶ αἴτιον μὲν τοῦ εἶναι πᾶσιν, αὐτὸ δὲ μὴ ὂν ὡς
  πάσης οὐσίας ἐπέκεινα καὶ ὡς ἂν αὐτὴ περὶ ἑαυτῆς κυρίως καὶ ἐπιστητῶς ἀποφαίνοιτο.
transliteration: Greek scholarly romanization (see canonical iast layer).
translation: By the same law of truth the boundless Super-Essence surpasses Essences, the Super-Intellectual
  Unity surpasses Intelligences, the One which is beyond thought surpasses the apprehension of thought,
  and the Good which is beyond utterance surpasses the reach of words. Yea, it is an Unity which is the
  unifying Source of all unity and a Super-Essential Essence, a Mind beyond the reach of mind and a Word
  beyond utterance, eluding Discourse, Intuition, Name, and every kind of being. It is the Universal Cause
  of existence while Itself existing not, for It is beyond all Being and such that It alone could give,
  with proper understanding thereof, a revelation of Itself.
commentary: '«Super-Essence Beyond Mind and Word» names the paradox at the heart of Dionysius: Cause of
  existence while beyond being, Mind beyond mind, Word beyond speech. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.'
abhyasa: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it
  nor force it away; notice what remains when naming rests.
