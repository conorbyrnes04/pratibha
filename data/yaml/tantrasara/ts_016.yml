  सङ्घट्टं ध्यायेद्यावदसौ महाभैरवाग्निर्ध्यानवातसमिद्धाकारः सम्पद्यते तस्य प्राक्तनशक्तिज्वालाद्वादशकपरिवृतस्य
  चक्रात्मनश्चक्षुरादीनामन्यतमसुषिरद्वारेण निःसृतस्य बाह्ये ग्राह्यात्मनि विश्रान्तं
  चिन्तयेत्तेन च विश्रान्तेन प्रथमं तद्बाह्यं सोमरूपतया सृष्टिक्रमेण प्रपूरितं ततोऽर्करूपतया
  स्थित्यावभासितं ततोऽपि संहारवह्निरूपतया विलापितं ततोऽनुत्तरात्मतामापादितं ध्यायेत्।
  एवं तच् चक्रं समस्तबाह्यवस्त्वभेदपरिपूर्णं सम्पद्यते। ततो वासनाशेषानपि भावान्तेन
  चक्रेणेत्थं कृतान्ध्यायेत्। एवमस्यानवरतं ध्यायिनः स्वसंविन्मात्रपरमार्थान्सृष्टिस्थितिसंहारप्रबन्धान्सृष्ट्यादिस्वातन्त्र्यपरमार्थत्वं
  च स्वसंविदो निश्चिन्वतः सद्य एव भैरवीभावः। अभ्यासात्तु सर्वेप्सितसिद्ध्यादयोऽपि।
