translation_literal: 'Abhinava now gives a **specific Āṇava meditation**.


  First, recall the Supreme Principle we’ve met:


  - **Self-luminous**,

  - containing all tattvas within itself,

  - shining as the inner “I am.”


  1. **Meditate on that Supreme Light in your own Heart.**

  2. Within that Heart-Light, visualize the **triad** of:

  - **fire** (*vahni*) – the knower (*pramātṛ*),

  - **sun** (*arka*) – the process of knowing (*pramāṇa*),

  - **moon** (*soma*) – the known object (*prameya*).


  Let these three fuse into a single **Mahābhairava Fire**, blazing ever more strongly
  as it is “fanned” by the wind of meditation.


  That fire is encircled by twelve rays (powers), forming a **wheel (cakra)**. Imagine
  it **leaving the Heart** through one of the inner “spaces” – the cavity of the eye,
  for example – and **resting** in an outer object.


  Then work this sequence:


  - That outer object is **filled by soma** – the lunar aspect – as if it were “created”
  and nourished.

  - It is then **illuminated by arka** – the solar aspect – held in steady clarity.

  - Finally it is **dissolved by the fire** of reabsorption.

  - What remains is the object **absorbed into Anuttara**, the Highest Self.


  In this way the wheel of twelve powers becomes **full of non-duality with every
  external thing**. The entire “circle” of outer and inner objects is seen as swallowed
  by that Bhairava fire and **resting in the Self**.


  For the yogi who keeps practicing like this, seeing that all sequences of manifestation,
  maintenance, and dissolution are **only the play of their own consciousness**, and
  that all creative freedom belongs to that same awareness, the **state of Bhairava
  arises immediately**.


  With continued practice, all kinds of desired accomplishments (*siddhi*) may also
  appear as side-effects.'
commentary: 'Here Āṇavopāya shows its full subtlety.


  We normally experience:


  - **me** (subject)

  - **knowing** (process)

  - **that** (object)


  Abhinava’s dhyāna invites you to:


  1. **Gather all three back into the Heart** as one luminous field.

  2. Give them archetypal faces – fire, sun, moon – so the mind has something **symbolically
  rich** to hold.

  3. Then re-project that unified light onto objects, and watch everything move through:

  - emergence (soma / creation),

  - clarity (arka / maintenance),

  - dissolution (vahni / reabsorption),

  - return to **Anuttara**.


  In other words:


  > Every perception becomes a **mini-cosmic cycle**.


  The “twelve-rayed wheel” is a way of saying that **all your powers of seeing, sensing,
  remembering, imagining** are included in this ritual.


  With repetition, three things slowly sink in:


  1. The **object** you see is not actually outside the Light that sees it.

  2. The **subject** is not a small “me,” but the Bhairava fire itself.

  3. The whole subject–object dance is a **movement inside one consciousness**.


  When this becomes obvious, the state called **bhairavī-bhāva** – the living mood
  of Bhairava – is already here, even if your body is still just sitting on a mat
  in Berlin or Paris.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 5, Chapter 5:** structural homology with the Advaita
  Vedānta notion of the threefold nature of reality (subject, process, object) as
  reflected in the triad of fire, sun, and moon

  *Divergence:* where the Advaita model treats the triad as ontological categories,
  Abhinavagupta renders them as dynamic, interpenetrating aspects of a single luminous
  field, collapsing the external‑internal duality


  **Abhinavagupta, Tantrasāra, Unit 5, Chapter 5:** structural homology with the Buddhist
  Yogācāra doctrine of the three natures (parikalpita, paratantra, pariniṣpanna) as
  mirrored in the cycle of emergence, clarity, dissolution

  *Divergence:* where Yogācāra emphasizes the constructed nature of all phenomena,
  Abhinavagupta presents the cycle as an inward, self‑manifestation of the Supreme
  Light, thereby negating the external construction


  **Abhinavagupta, Tantrasāra, Unit 5, Chapter 5:** structural homology with the Tantric
  mandala practice of the twelve chakras and their rays, symbolizing the twelve powers
  of perception

  *Divergence:* where traditional mandalas focus on external body‑centered energy
  centers, Abhinavagupta re‑interprets the wheel as a symbolic representation of inner
  consciousness, making the twelve rays a metaphor for the mind’s faculties rather
  than physical chakras'
