sanskrit_devanagari: 'विततस्तन्त्रालोको विगाहितुं नैव शक्यते सर्वैः।

  ऋजुवचनविरचितमिदं तु तन्त्रसारं ततः शृणुत॥२॥'
sanskrit_iast: 'vitatas tantrāloko vigāhituṃ naiva śakyate sarvaiḥ

  ṛjuvacanaviracitam idaṃ tu tantrasāraṃ tataḥ śṛṇuta'
translation_literal: 'The Tantrāloka is vast and not easy for all to enter.

  Therefore, listen instead to this Essence of Tantra, composed in clear and straightforward
  speech.'
commentary: 'Abhinavagupta recognizes the scale of Tantrāloka. It is an ocean of mantra,
  ritual, ontology and subtle philosophy. Few can dive deep enough to reach its floor.


  Tantrasāra is given as the essence. Here the same realization is distilled and poured
  into ṛju vacana, straight speech. No unnecessary complication, no deliberate obscurity.
  The intention is not to impress but to transmit.


  This verse sets the tone for the entire work. Tantrasāra is not a watered-down summary.
  It is the bright marrow of Tantrāloka, the inner sap of recognition offered in a
  form a sincere practitioner can digest.


  Key Terms


  **Tantrāloka (तन्त्रालोक)** — Abhinavagupta’s monumental masterwork that systematizes
  Trika Śaiva doctrine and practice.


  **Ṛju-vacana (ऋजुवचन)** — Language that does not hide its meaning, aimed at immediate
  understanding.


  **Tantrasāra (तन्त्रसार)** — Abhinavagupta’s distilled presentation of the core
  tantric vision contained in Tantrāloka.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1, “The Essence Offered in Straight
  Speech”:** structural homology

  *Divergence:* Abhinavagupta parallels the traditional ‘Sūtra‑style’ exposition of
  the Upanishads, presenting a condensed, clear form (ṛju vacana) rather than the
  elaborate, symbolic language of the Tantrāloka


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology

  *Divergence:* While the Upanishads employ a dialogic, question‑answer format, Abhinavagupta
  adopts a monologic, declarative tone, emphasizing direct transmission over pedagogical
  dialogue


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology

  *Divergence:* The Tantrāloka traditionally interweaves ritual, mantra, and metaphysics
  in a dense, multi‑layered text; Abhinavagupta distills these layers into a single,
  lucid verse, thereby breaking the customary multi‑textual structure'
insight: Abhinavagupta recognizes the scale of Tantrāloka.
practice: 'Bring to mind everything you think you must master.

  Let the breath out slowly and say inwardly:

  “Show me the essence.”'
