sanskrit_devanagari: 'उपायजालं न शिवं प्रकाशयेद्घटेन किं भाति सहस्रदीधितिः।

  विवेचयन्नित्थमुदारदर्शनः स्वयम्प्रकाशं शिवमाविशेत्क्षणात्॥६॥'
sanskrit_iast: 'upāyajālaṃ na śivaṃ prakāśayed ghaṭena kiṃ bhāti sahasra-dīdhitiḥ
  |

  vivecayan nittham udāra-darśanaḥ svayam-prakāśaṃ śivam āviśet kṣaṇāt ||6||'
translation_literal: 'The net of means does not reveal Śiva,

  just as a clay pot cannot make the thousand-rayed sun shine.


  One whose vision is noble,

  and who reflects in this way,

  enters self-luminous Śiva in an instant.'
commentary: 'This verse is a hammer-blow to spiritual consumerism.


  No collection of upāyas, no matter how refined, can “make” Śiva appear. Methods
  can refine, purify, prepare, soften. But they do not manufacture the sun.


  Abhinavagupta’s image is ruthless and kind at once: a clay pot does not help the
  sun shine. It can at best limit or obscure the light. In the same way, methods can
  also, if clung to, create smaller containers for what is naturally infinite.


  The “noble-seeing” person is not the one with the most exotic practices, but the
  one who sees the simple truth of Anupāya:

  - Śiva is already self-luminous.

  - Methods are at best expressions of that luminosity, not its cause.


  By seeing this clearly, not as a concept but as a living insight, such a person
  “enters” Śiva at once. In reality, Śiva enters Himself by relaxing the pretense
  of being someone else.


  Key Terms


  **Upāya-jāla (उपायजाल)** — Net or multitude of means.


  **Sahasra-dīdhiti (सहस्रदीधिति)** — Thousand-rayed one, the sun.


  **Udāra-darśana (उदारदर्शन)** — Noble-seeing, one of elevated vision.


  **Svayam-prakāśa (स्वयम्प्रकाश)** — That which shines by itself and not by another.


  Cross-Tradition Resonances


  **Abhinavagupta Tantrasāra, Unit 2, Verse 1:** structural homology

  *Divergence:* The clay pot analogy parallels the Buddhist ‘net of means’ (pratyāhāra)
  critique: both emphasize that skillful means cannot create the ultimate reality
  (Śiva/Śūnyatā); they only serve as instruments, not the source.


  **Abhinavagupta Tantrasāra, Unit 2, Commentary:** structural homology

  *Divergence:* The notion of ‘noble-seeing’ person mirrors the Advaita concept of
  ‘noble perception’ (śuddha-dṛṣṭi) in Shankaracharya’s Brahmasūtra commentary, yet
  diverges by framing it as an experiential instant of entering Śiva rather than a
  gradual purification of ignorance.


  **Abhinavagupta Tantrasāra, Unit 2, Verse 1:** structural homology

  *Divergence:* The image of the sun that cannot be made to shine by a pot echoes
  the Tantric idea of ‘siddhi’ as a natural emanation, contrasting with the Western
  notion of skillful means as a tool for achieving enlightenment; the divergence lies
  in the ontological status of Śiva as self-luminous versus a conditioned phenomenon.'
insight: This verse is a hammer-blow to spiritual consumerism.
practice: 'For one moment, let yourself imagine that *nothing you do* can increase
  or decrease the light of awareness.

  Let practice drop for three breaths.

  Rest as the “sun” rather than the “pot.”'
