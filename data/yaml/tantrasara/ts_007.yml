  svarūpam

  sañchādya yat punar api prathayeta pūrṇaṃ tac ca kramākramavaśād athavā tribhedāt'
translation_literal: 'The Self, whose form is light, is Śiva, utterly free.

  By the playful force of His own freedom He covers His true nature,

  and then again lets it shine in its fullness.


  This revelation takes place either in sequence or beyond sequence,

  and in three distinct ways.'
commentary: 'The teaching now becomes personal. The Self that each one says “I” to
  is none other than Śiva, a body of light, completely free.


  Out of sheer freedom there arises a playful urge. Śiva hides His own nature, appears
  as the bound individual, and tastes limitation from the inside. This is not a fall
  from grace but a movement within grace. His freedom expresses itself as both concealment
  and illumination.


  The return is also His play. The same freedom that allowed concealment now allows
  full shining. Sometimes the recognition is gradual, unfolding through practices,
  insights and shifts. This is krama, sequence. Sometimes it is sudden, beyond sequence,
  a single unmistakable flash.


  The three ways mentioned hint at the three upāyas: Śāmbhava, Śākta and Āṇava. Each
  is a flavor of how Śiva wakes up to Himself through the human heart.


  Key Terms


  **Narma (नर्म)** — Play, jest, playful gesture.


  **Krama / Akrama (क्रम / अक्रम)** — Gradual unfolding vs instantaneous recognition.


  **Tri-bheda (त्रिभेद)** — Here referring to the threefold classification of upāyas.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology

  *Divergence:* The passage portrays Śiva’s self‑concealment and re‑revelation as
  a dynamic play, mirroring the classical yogic concept of *shakti* (power) oscillating
  between *sambhava* (manifestation), *shakta* (receiving), and *anava* (withdrawal).
  The text’s triadic modes of revelation correspond to the three *upāyas* of the Upanishadic
  tradition, yet the emphasis on *play* (lila) introduces a novel metaphysical nuance
  absent in earlier classical frameworks.


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology

  *Divergence:* The notion that Śiva’s concealment is an act of freedom rather than
  a fall aligns structurally with the Advaita idea of *māyā* as illusory but here
  reinterpreted as a self‑initiated concealment. The divergence lies in the ontological
  status of *māyā*: instead of a limiting illusion, it becomes a deliberate, liberative
  play, thereby redefining the relationship between *self* and *other*.


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology

  *Divergence:* The triadic sequence—*krama* (gradual), *beyond sequence* (sudden),
  and *flash* (instantaneous)—mirrors the three modes of enlightenment in Buddhist
  *bodhicitta* practice (gradual, sudden, and *sudden*). However, Abhinavagupta’s
  model integrates these within the framework of *lila* (divine play), thereby shifting
  the emphasis from a purely meditative process to an ontological play of divine freedom.'
insight: The teaching now becomes personal.
practice: 'Notice the sense of being a small “me.”

  Then notice the open space in which that sense arises.

  Let both be held in the intuition that one freedom is playing as each.'
