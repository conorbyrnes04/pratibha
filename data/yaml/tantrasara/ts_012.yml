sanskrit_devanagari: 'तत्र यदा विकल्पं क्रमेण संस्कुरुते समनन्तरोक्तस्वरूपप्रवेशाय
  तदा भावनाक्रमस्य सत्तर्कसदागमसद्गुरूपदेशपूर्वकस्यास्त्युपयोगः। तथा हि – विकल्पबलादेव
  जन्तवो बद्धमात्मानमभिमन्यन्ते सोऽभिमानः संसारप्रतिबन्धहेतुरतः प्रतिद्वन्द्विरूपो
  विकल्प उदितः संसारहेतुं विकल्पं दलयतीत्यभ्युदयहेतुः। स चैवंरूपः समस्तेभ्यः परिच्छिन्नस्वभावेभ्यः
  शिवान्तेभ्यस्तत्त्वेभ्यो यदुत्तीर्णमपरिच्छिन्नसंविन्मात्ररूपं तदेव च परमार्थस्तद्वस्तुव्यवस्थास्थानं
  तद्विश्वस्यौजस्तेन प्राणिति विश्वं तदेव चाहमतो विश्वोत्तीर्णो विश्वात्मा चाहमिति।
  स चायं मायान्धानां नोत्पद्यते सत्तर्कादीनामभावात्। वैष्णवाद्याः हि तावन्मात्र एवागमे
  रागतत्त्वेन नियमिता इति नोर्ध्वदर्शनेऽपि तदुन्मुखतां भजन्ते ततः सत्तर्कसदागमसद्गुरूपदेशद्वेषिण
  एव। यथोक्तं पारमेश्वरे –


  वैष्णवाद्याः समस्तास्ते विद्यारागेण रञ्जिताः।

  न विन्दन्ति परं तत्त्वं सर्वज्ञज्ञानवर्जिताः॥


  तस्माच्छाम्भवदृढशक्तिपाताविद्धा एव सदागमादिक्रमेण विकल्पं संस्कृत्य परं स्वरूपं
  प्रविशन्ति। नन्वित्थं परं तत्त्वं विकल्प्यरूपं स्यान्–मैवम्। विकल्पस्य द्वैताधिवासभङ्गमात्रे
  चरितार्थत्वात् परं तत्त्वं तु सर्वत्र सर्वरूपतया स्वप्रकाशमेवेति न तत्र विकल्पः
  कस्यैचिदुपक्रियायै खण्डनायै वा। तत्रातिदृढशक्तिपाताविद्धस्य स्वयमेव सांसिद्धिकतया
  सत्तर्क उदेति योऽसौ देवीभिर्दीक्षित इत्युच्यते। अन्यस्यागमक्रमेणेत्यादि सविस्तरं
  शक्तिपातप्रकाशने वक्ष्यामः। किं तु गुरोरागमनिरूपणे व्यापार आगमस्य च निःशङ्कसजातीयतत्प्रबन्धप्रसवनिबन्धनसमुचितविकल्पोदये
  व्यापारस्तथाविधविकल्पप्रबन्ध एव सत्तर्क इत्युक्तः। स एव च भावना भण्यते – अस्फुटत्वाद्भूतमप्यर्थमभूतमिव
  स्फुटत्वापादनेन भाव्यते ययेति।'
sanskrit_iast: 'tatra yadā vikalpaṃ krameṇa saṃskurute samanantarokta-svarūpa-praveśāya
  tadā bhāvanā-kramasya sat-tarka-sad-āgama-sad-gurūpadeśa-pūrvakasya asty upayogaḥ
  | tathā hi – vikalpa-balād eva jantavo baddham ātmānam abhimanyante so’bhimānaḥ
  saṃsāra-pratibandha-hetuḥ ataḥ pratidvandvi-rūpo vikalpa uditaḥ saṃsāra-hetuṃ vikalpaṃ
  dalayatīty abhyudaya-hetuḥ | sa caivaṃ-rūpaḥ samastebhyaḥ paricchinna-svabhāvebhyaḥ
  śivāntebhyaḥ tattvebhyo yad uttīrṇam aparicchinna-saṃvin-mātra-rūpaṃ tad eva ca
  paramārthas tad vastu-vyavasthā-sthānaṃ tad viśvasy aujas tena prāṇiti viśvaṃ tad
  eva cāham ato viśvottīrṇo viśvātmā cāham iti | sa cāyaṃ māyāndhānāṃ notpadyate sat-tarkādīnām
  abhāvāt | vaiṣṇavādyā hi tāvan-mātra evāgame rāga-tattvena niyamitā iti nordhva-darśane’pi
  tad-unmukhatāṃ bhajante tataḥ sat-tarka-sad-āgama-sad-gurūpadeśa-dveṣiṇa eva | yathoktaṃ
  pārameśvare –


  vaiṣṇavādyāḥ samastās te vidyā-rāgeṇa rañjitāḥ |

  na vindanti paraṃ tattvaṃ sarvajña-jñāna-varjitāḥ ||


  tasmāc chāmbhava-dṛḍha-śakti-pātāviddhā eva sad-āgamādi-krameṇa vikalpaṃ saṃskṛtya
  paraṃ svarūpaṃ praviśanti | nanv itthaṃ paraṃ tattvaṃ vikalpya-rūpaṃ syān – maivam
  | vikalpasya dvaita-adhivāsa-bhaṅga-mātre caritārthatvāt paraṃ tattvaṃ tu sarvatra
  sarva-rūpatayā sva-prakāśam eveti na tatra vikalpaḥ kasyaicid upakriyāyai khaṇḍanāyai
  vā | tatra ati-dṛḍha-śakti-pātāviddhasya svayam eva sāṃsiddhikatayā sat-tarka udeti
  yo’sau devībhir dīkṣita ity ucyate | anyasyāgama-krameṇety-ādi savistaraṃ śakti-pāta-prakāśane
  vakṣyāmaḥ | kiṃ tu guroḥ āgama-nirūpaṇe vyāpāra āgamasya ca niḥśaṅka-sajātīya-tat-prabandha-prasava-nibandhana-samucita-vikalpodaye
  vyāpāras tathā-vidha-vikalpa-prabandha eva sat-tarka ity uktaḥ | sa eva ca bhāvanā
  bhaṇyate – asphuṭatvād bhūtam apy arthaṃ abhūtam iva sphuṭatvāpādanena bhāvyate
  yayeti |'
translation_literal: 'When the practitioner gradually purifies and refines his thoughts
  in order to enter the essential nature described just before, then the method of
  **bhāvanā** – contemplative dwelling – becomes useful. This bhāvanā proceeds on
  the foundation of three: **right reasoning (sat-tarka)**, **authentic scripture
  (sad-āgama)**, and **the instruction of a true Guru (sad-guru-upadeśa)**.


  Bound beings imagine themselves bound **only because of thought**. Through the force
  of vikalpa they take themselves to be limited, and this mistaken self-image is the
  cause that keeps saṃsāra going.


  Yet that same faculty of thought can arise in an opposite form: as a vikalpa that
  **confronts and breaks apart** the binding vikalpa. When thought appears in this
  “counter-form,” it crushes the thought that caused saṃsāra and becomes the cause
  of ascent and awakening.


  What does such a liberating thought reveal? It reveals that what truly exists is
  **nothing but unbounded awareness**, something that transcends all the limited tattvas
  from Śiva downwards. That alone is the ultimate reality, the ground where all “things”
  stand, the very vigor of the universe; by That the universe lives.


  And that Reality is “I”:

  > “That alone am I; therefore I am both beyond the universe and the Self of the
  universe.”


  For those blinded by Māyā this insight does not arise, because right reasoning and
  its companions are absent. Attached to narrow scriptures, they never turn toward
  higher vision and even come to despise genuine reasoning, true scripture, and the
  Guru’s instruction.


  Therefore only those who have been pierced by a firm descent of Śambhu’s grace refine
  their thoughts through authentic scripture and the rest, and in that way enter their
  supreme nature.


  You might object: “If the Supreme Reality is reached through thought, does that
  not make it *itself* a thought-constructed object?”


  Abhinava answers: No. Thought has done its work the moment it **cuts the scent of
  duality**. The Supreme Reality always shines as all forms everywhere by its own
  light, and in relation to That, thought is not needed either to construct or to
  destroy anything.


  For one who has received a very firm descent of power, **right reasoning arises
  spontaneously**, like a natural clarity. Such a being is said to be “initiated by
  the goddesses themselves.” For others, this right reasoning is born through the
  gradual process of scripture and teaching.


  The Guru’s role is to clarify and unfold the Āgama. The role of Āgama is to generate
  a stream of doubt-free, mutually supporting thoughts. The **continuous flow of such
  purified vikalpas** is called **sat-tarka**, right reasoning.


  That right reasoning itself is what Abhinava calls **bhāvanā**: even something indistinct
  or past is made as vivid as present by being brought into clear awareness again
  and again.'
commentary: 'Śāmbhavopāya (chapter 3) is the flash where everything falls away and
  only naked awareness remains.


  Śāktopāya (chapter 4) is gentler, more human: it works **in and with mind** rather
  than against it.


  Abhinavagupta’s starting point is brutally simple:


  - We feel bound **because of the stories we believe** about ourselves.

  - Those stories are vikalpas – patterned thoughts soaked in habit and emotion.

  - The same power of vikalpa, when turned back toward its source, becomes medicine.


  Śāktopāya is the path where **thought is not the enemy**.

  Instead, thought is refined until it becomes transparent to the Light that carries
  it.


  This refinement has three pillars:


  1. **Sat-tarka – right reasoning**

  Not endless debate, but a style of thinking that always tends toward **non-duality**,
  that cuts through “I am this limited thing” and reveals “I am the awareness of all.”


  2. **Sad-āgama – authentic scripture**

  Not just any holy text, but those arising from awakened vision. Their purpose is
  to **seed liberating vikalpas** – living concepts that tilt you toward direct recognition.


  3. **Sad-guru-upadeśa – the true Guru’s instruction**

  The Guru does not give you new dogmas; they tune your mind so that right reasoning
  and living scripture can flow in a **single, undivided stream**.


  In Śāktopāya you don’t try to stop thinking. You learn to notice which thoughts
  **thicken duality** and which ones **melt it**. Over time, sat-tarka becomes a subtle,
  self-running inner current:


  > Every time a “small-I” thought appears, another, deeper thought quietly answers:

  > “This too appears in Me. I am the awareness that knows it.”


  That counter-current is Śakti working through vikalpa.


  Eventually, thought does what it alone can do:

  it **disenchants itself**, and what remains is Śiva’s quiet blaze.'
insight: Śāmbhavopāya (chapter 3) is the flash where everything falls away and only
  naked awareness remains.
practice: 'For a week, try this as a Śāktopāya drill:


  1. **Catch the binding vikalpa**

  - Notice when you think, *“I’m failing,” “I’m not enough,” “I’m separate,” “I’m
  stuck.”*

  - Don’t suppress it – just name it silently: “Binding thought.”


  2. **Invoke the counter-vikalpa**

  - Add one sentence right after:

  > “This thought also appears in awareness. I am the one who is aware.”


  3. **Feel the shift**

  - Let your attention move from the content of the thought

  → to the space in which it appears.

  - Rest there for 3 breaths, even if the thought keeps chattering.


  4. **Use scripture as fuel**

  - Choose one short line that you know is true in your bones

  (from Tantrasāra, Śiva Sūtra, Gītā, Gospel, whatever is alive for you).

  - When you feel contracted, repeat it once or twice **as a living vikalpa**,

  not a mantra to escape, but a thought that reminds you who is thinking.


  5. **Notice the long arc**

  - Over time, observe: is it becoming easier to pivot

  from “I’m inside my thoughts” → to “thoughts are inside Me”?


  That pivot is Śāktopāya in action.'
