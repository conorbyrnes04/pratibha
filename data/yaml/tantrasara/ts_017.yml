sanskrit_devanagari: 'अथोच्चारः।


  तत्र प्राणमुच्चिचारयिषुः पूर्वं हृदय एव शून्ये विश्राम्यति ततो बाह्ये प्राणोदयात्ततोऽपि
  बाह्यं प्रति अपानचन्द्रापूरणेन सर्वात्मतां पश्यति ततोऽन्यनिराकाङ्क्षो भवति ततः समानोदयात्सङ्घट्टविश्रान्तिमनुभवति
  तत उदानवह्न्युदये मातृमेयादिकलनां ग्रसते। तद्ग्रासकवह्निप्रशमे व्यानोदये सर्वावच्छेदवन्ध्यः
  स्फुरति। एवं शून्यात्प्रभृति व्यानान्तं या एता विश्रान्तयस्ता एव निजानन्दो निरानन्दः
  परानन्दो ब्रह्मानन्दो महानन्दश्चिदानन्द इति षट् आनन्दभूमय उपदिष्टा यासामेकोऽनुसन्धाता
  उदयास्तमयविहीनोऽन्तर्विश्रान्तिपरमार्थरूपो जगदानन्दः। तदेतासूच्चारभूमिषु प्रत्येकं
  द्व्यादिशः सर्वशो वा विश्राम्यान्यत् तद्देहप्राणादिव्यतिरिक्तं विश्रान्तितत्त्वमासादयति।
  तदेव सृष्टिसंहारबीजोच्चारणरहस्यमनुसन्दधद्विकल्पं संस्कुर्यादासु च विश्रान्तिषु प्रत्येकं
  पञ्च अवस्था भवन्ति प्रवेशतारतम्यात्। तत्र प्राग् आनन्दः पूर्णतांशस्पर्शात्तत उद्भवः
  क्षणं निःशरीरतायां रूढेस्ततः कम्पः स्वबलाक्रान्तौ देहतादात्म्यशैथिल्यात्ततो निद्रा
  बहिर्मुखत्वविलयात्। इत्थमनात्मन्यात्मभावे लीने स्वात्मनः सर्वमयत्वादात्मन्यनात्मभावो
  विलीयत इत्यतो घूर्णिर्महाव्याप्त्युदयात्। ता एता जाग्रदादिभूमयस्तुर्यातीतान्ताः।
  एताश्च भूमयस्त्रिकोणकन्दहृत्तालूर्ध्वकुण्डलिनीचक्रप्रवेशे भवन्ति।'
sanskrit_iast: 'atho uccāraḥ |


  tatra prāṇam uccicārayiṣuḥ pūrvaṁ hṛdaya eva śūnye viśrāmyati tato bāhye prāṇodayāt
  tato’pi bāhyaṁ prati apāna-candra-āpūraṇena sarvātmatāṁ paśyati…


  pūrvaṁ sva-bodhe tad-anu prameye viśramya meyaṁ paripūrayeta |

  pūrṇe’tra viśrāmyati mātṛ-meya-vibhāgam āśu eva sa saṁhareta ||


  vyāptyātha viśrāmyati tā imāḥ syuḥ śūnyena sākam ṣaḍ-upāya-bhūmyaḥ |

  prāṇādayo vyānana-paścimās tallīnaś ca jāgrat prabhṛti prapañcaḥ ||


  abhyāsa-niṣṭho’tra tu sṛṣṭi-saṁhṛd-vimarśa-dhāmany acireṇa rohet ||'
translation_literal: 'Now Abhinava explains **Uccāra**—not just “chanting,” but the
  **upward moving of prāṇa** as a means.


  The practitioner who wants to move prāṇa upward proceeds like this:


  1. **Rest in the Heart void.**

  First, he rests in the Heart, in a subtle inner **emptiness** (*śūnya*).


  2. **Emergence in the external.**

  Then, as **prāṇa** arises, awareness rests in the **outer object**.


  3. **Apāna as the moon filling everything.**

  Turning toward the outer, with the “moon” of apāna filling it, he sees **everything
  as his own Self** (*sarvātmatā*).


  4. **Freedom from wanting “something else.”**

  In that fullness, he becomes free of craving an “other” (*anya-nirākāṅkṣaḥ*).


  5. **Samāna and the rest in union.**

  With the rise of **samāna**, he experiences a repose in **union**, where everything
  feels gathered into one field.


  6. **Udāna-fire swallowing subject–object.**

  When the fire of **udāna** flares up, it **swallows the whole play** of knower,
  known, and knowing.


  7. **Vyāna – the unbounded shimmer.**

  When that swallowing-fire quiets and **vyāna** emerges, a state **devoid of all
  limitation** shines forth.


  The different resting-places along this journey—from the initial void up to vyāna—are
  described as six **stages of bliss**:


  - **Nijānanda** – one’s own, intimate bliss

  - **Nirānanda** – a kind of “bliss of no-bliss” (subtle neutrality)

  - **Parānanda** – bliss of the divine other

  - **Brahmānanda** – bliss of vastness/infinity

  - **Mahānanda** – great, overwhelming bliss

  - **Cidānanda** – bliss as pure consciousness itself


  These six culminate in **Jagadānanda** – the Bliss that pervades the whole universe:
  a single internal repose free from rise and fall.


  By resting again and again in these Uccāra-stages, either one by one or several
  at once, the practitioner comes to a **deeper repose** different from body and prāṇa.


  Keeping in mind the secret of Uccāra centered on the seed-sounds of manifestation
  and dissolution (sa and ha), he **purifies vikalpa**. In each repose there are **five
  sub-states**, depending on how deeply one enters:


  1. **A first touch of bliss**, from contact with a fraction of fullness.

  2. **Rising up** for an instant, as if becoming bodiless.

  3. **Trembling**, as Śakti’s force overwhelms the old body-identification.

  4. **Sleepiness**, as extroversion dissolves.

  5. **Whirling (ghūrṇi)**, when both self-notion and non-self notion melt into a
  vast, boundaryless expanse.


  These form the stages from **waking** through **turya** up to **turyātīta** (beyond
  the fourth). They arise as prāṇa penetrates the triangle, the kanda, the Heart,
  the palate, and the upper Kuṇḍalinī-cakra.


  The deepest sign here is a **pure inner vibration** where:


  - all objects have vanished,

  - or are just arising,

  - or are fully arisen.


  This is called the **threefold Liṅga**, whose highest form is the **Heart of the
  Yoginī** – the mystery of Śiva–Śakti inseparability vibrating as your own breath.'
commentary: 'This is Abhinava’s **prāṇāyāma of recognition**.


  Instead of only counting breaths or holding for health, you are:


  - Tracking **where awareness rests** as breath moves.

  - Watching how different prāṇa-modes correspond to **different flavors of “I am”**.


  Very roughly:


  - **Prāṇa** – awareness touching outward objects

  - **Apāna** – feeling those objects as permeated with “my” life

  - **Samāna** – everything gathered into one warm center

  - **Udāna** – vertical uplift, burning subject–object

  - **Vyāna** – all-pervading spaciousness


  The six stages of bliss are not “experiences to chase.” They’re **landmarks**:


  - You may feel intimate sweetness, vastness, neutrality, overwhelm, clear light…

  - Śāstra says: don’t cling to any of it. Instead, feel that **all of them are movements
  of one Śakti**.


  Uccāra here is not about spectacular kumbhakas. It is:


  > Breath as a **moving shrine** in which Śiva and Śakti reveal their union.


  If you follow it with this attitude, breath becomes a **continuous teacher** of
  non-duality.


  Cross-Tradition Resonances


  **Shankara, Brahmasutra Commentary, 2.1.4:** structural homology

  *Divergence:* Shankara’s ‘prāṇa’ is directed outward, whereas Abhinavagupta’s prāṇa
  is an upward movement toward the heart void


  **Ramanuja, Sri Bhashya, 1.3.2:** structural homology

  *Divergence:* Ramanuja’s six stages of bliss correspond to the six bhāvas of devotion,
  while Abhinavagupta’s stages are linked to prāṇa‑modes rather than devotional bhāvas


  **Yogacara, Abhidharmakosha, 2.5.1:** structural homology

  *Divergence:* Yogacara describes the six prāṇa‑modes as a sequence of mental states,
  but Abhinavagupta adds the explicit notion of ‘resting‑places’ (śūnyasthāna) that
  are not present in the Yogacara schema'
insight: This is Abhinava’s **prāṇāyāma of recognition**.
practice: 'Next time you do a simple prāṇāyāma (e.g. 4–4, or 4–4–4–4), add this **inner
  labeling**:


  1. **Inhale (prāṇa)**

  - Feel awareness move outward through the senses.

  - Silently note: *“Touching the world.”*


  2. **Top of the breath (samāna)**

  - Everything is inside one shared chest.

  - Note: *“All is gathered into My center.”*


  3. **Exhale (apāna)**

  - Feel a soft downward and outward release into earth.

  - Note: *“This too is myself, releasing.”*


  4. **Bottom of the breath (vyāna hint)**

  - Rest for a moment in the pause, sensing a **subtle glow everywhere**.

  - Note: *“I pervade this whole field.”*


  Do not strain. The point is not perfection of ratios, but a **felt sense** that
  each phase of breath is **Śakti changing costume**.


  Over time, watch whether a **quiet bliss** begins to accompany even ordinary breathing.
  That is Jagadānanda beginning to peek through.'
