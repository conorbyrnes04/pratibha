sanskrit_devanagari: 'अन्तर्विभाति सकलं जगदात्मनीह यद्वद्विचित्ररचना मुकुरान्तराले।

  बोधः परं निजविमर्शरसानुवृत्त्या विश्वं परामृशति नो मुकुरस्तथा तु॥७॥'
sanskrit_iast: 'antar vibhāti sakalaṁ jagad ātmanīha yadvat vicitra-racanā mukurāntarāle
  |

  bodhaḥ paraṁ nija-vimarśa-rasānuvṛttyā viśvaṁ parāmṛśati no mukuras tathā tu ||7||'
translation_literal: 'Here, the entire universe shines inwardly in the Self,

  just as a variegated pattern appears inside a mirror.


  Yet it is awareness that truly grasps the universe,

  by the ongoing flow of its own savor of self-awareness,

  not the mirror in the same way.'
commentary: 'Abhinavagupta gives you the whole Śāmbhava view in one verse.


  - The **mirror** is the subtle body–mind complex.

  - The **pattern** inside it is the world of forms.

  - But the one who actually knows, tastes, and claims “this is my experience” is
  **bodha**, awareness itself.


  The mirror only hosts images. It does not love them, suffer them, seek them.

  Awareness, through **nija-vimarśa-rasa**, the flavor of its own self-recognition,
  actually embraces the universe.


  Śāmbhavopāya is to shift identity:

  from the mirror, which constantly changes,

  to the **taster**, the one who savors all of this as flavors in its own being.


  Once that shift is stable, practice becomes a kind of play.

  You are no longer polishing the mirror to reach the sun.

  The sun knows itself and the mirror is just one of its games.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 3:** structural homology between the mirror–pattern
  metaphor and the Śāmbhava view of the subtle body–mind complex as a mirror hosting
  the world of forms

  *Divergence:* the mirror itself remains passive, whereas in the Śāmbhava view the
  subtle body–mind actively participates in the world through its own awareness


  **Abhinavagupta, Tantrasāra, Unit 3:** structural homology between the taste of
  self‑awareness (nija‑vimarśa‑rasa) and the experiential shift from observer to taster
  in the Śāmbhava tradition

  *Divergence:* the text emphasizes a continuous flow of savoring, while the Śāmbhava
  view frames the shift as a decisive identity change


  **Abhinavagupta, Tantrasāra, Unit 3:** structural homology between the idea of polishing
  the mirror to reach the sun and the practice of refining the subtle body–mind to
  realize the sun itself

  *Divergence:* in the Tantrasāra the polishing is metaphorical and ends when the
  sun knows itself, whereas the Śāmbhava practice involves a sustained, disciplined
  cultivation of awareness'
insight: Abhinavagupta gives you the whole Śāmbhava view in one verse.
practice: 'Look at anything in front of you, or close your eyes and notice an inner
  image.


  - First, feel it as if in a mirror: “This is an image in the mind.”

  - Then ask, “Who is tasting this? Who knows this is appearing?”


  Rest as that knower for a few breaths.

  Do not try to stop the images.

  Let them pass like colors in a mirror that you no longer mistake for yourself.'
