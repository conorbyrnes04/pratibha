sanskrit_devanagari: 'तत्र परमेश्वरः पूर्णसंवित्स्वभावः, पूर्णतैवास्य शक्तिः – कुलं
  सामर्थ्यमूर्मिर्हृदयं सारं स्पन्दो विभूतिस्त्रीशिका काली कर्षणी चण्डी वाणी भोगो
  दृग् नित्या इत्यादिभिरागमभाषाभिस्तत्तदन्वर्थप्रवृत्ताभिरभिधीयते तेन तेन रूपेण ध्यायिनां
  हृद्यास्तामिति। सा च समग्रशक्तितादर्शनेन पूर्णतासंवित्प्रकाशते। शक्तयश्चास्यासङ्ख्येयाः।
  किं बहुना यद्विश्वं ता अस्य शक्तयस्ताः कथमुपदेष्टुं शक्या इति। तिसृषु तावद्विश्वं
  समाप्यते – ययेदं शिवादिधरण्यन्तमविकल्प्यसंविन्मात्ररूपतया बिभर्ति च पश्यति च भासयति
  च परमेश्वरः, सास्य श्रीपराशक्तिः। यया च दर्पणहस्त्यादिवद्भेदाभेदाभ्यां सास्य श्रीपरापराशक्तिः।
  यया परस्परविविक्तात्मना भेदेनैव, सास्य श्रीमदपराशक्तिः।


  … एतत् त्रिविधं यया धारणम् आत्मन्येव क्रोडीकारेणानुसन्धानात्मना ग्रसते, सास्य भगवती
  श्रीपरैव श्रीमन्मातृसद्भावकालकर्षिण्यादिशब्दान्तरनिरुक्ता। ता एताश्चतस्रः शक्तयः
  स्वातन्त्र्यात् प्रत्येकं त्रिधैव वर्तन्ते – सृष्टौ स्थितौ संहारे चेति द्वादश भवन्ति…
  एताः द्वादश भगवत्यः संविदः … बहिरपि … भासमानाः चक्रेश्वरस्य स्वातन्त्र्यं पुष्णत्यः
  श्रीकालीशब्दवाच्याः।'
sanskrit_iast: 'tatra parameśvaraḥ pūrṇa-saṃvit-svabhāvaḥ, pūrṇataivāsya śaktiḥ –
  kulaṃ sāmarthyam ūrmiḥ hṛdayaṃ sāraṃ spando vibhūtiḥ trīśikā kālī karṣaṇī caṇḍī
  vāṇī bhogo dṛg nityā ityādibhir āgama-bhāṣābhis tat-tad-anvartha-pravṛttābhir abhidhīyate
  tena tena rūpeṇa dhyāyināṃ hṛdyās tām iti | sā ca samagra-śaktitā-darśanena pūrṇatā-saṃvit-prakāśate
  | śaktayaś cāsya asaṅkhyeyāḥ | kiṃ bahunā yad viśvaṃ tā asya śaktayas tāḥ katham
  upadeṣṭuṃ śakyā iti | tisṛṣu tāvad viśvaṃ samāpyate – yayedaṃ śivādidharaṇyantam
  avikalpya-saṃvin-mātra-rūpatayā bibharti ca paśyati ca bhāsayati ca parameśvaraḥ
  sā asya śrī-parā-śaktiḥ | yayā ca darpaṇa-hasty-ādivad bhedābhedābhyāṃ sā asya śrī-parāparā-śaktiḥ
  | yayā paraspara-viviktātmanā bhedenaiva, sā asya śrīmat-aparā-śaktiḥ |


  … etat tri-vidhaṃ yayā dhāraṇam ātmany eva kroḍīkāreṇa anusandhānātmanā grasate,
  sā asya bhagavatī śrī-parā eva śrīmat-mātṛ-sadbhāva-kālakarṣiṇī-ādi-śabdāntara-niruktā
  | tā etāś catasraḥ śaktayaḥ svātantryāt pratyekaṃ tridhaiva vartante – sṛṣṭau sthitau
  saṃhāre ceti dvādaśa bhavanti… etāḥ dvādaśa bhagavatyaḥ saṃvidaḥ … bahis api … bhāsamānāḥ
  cakreśvarasya svātantryaṃ puṣṇatyaḥ śrī-kālī-śabda-vācyāḥ |'
translation_literal: 'The Supreme Lord is of the nature of **complete consciousness**.
  His very fullness is called **Śakti**.


  The scriptures refer to Her with many meaningful names: *kula, sāmarthya, ūrmi,
  hṛdaya, sāra, spanda, vibhūti, trīśikā, kālī, karṣaṇī, caṇḍī, vāṇī, bhoga, dṛk,
  nityā*, and so on – each name capturing a particular flavor of Her power, each dear
  to meditators in its own way.


  When She is seen as the **totality of powers**, fullness itself shines as consciousness.
  Her powers are beyond counting; in fact, **the universe itself is nothing but Her
  powers**.


  To make this more graspable, Abhinava says the universe can be summarized in **three
  main Śaktis** of the Lord:


  1. **Parāśakti** – by which He bears, sees, and illuminates the entire universe
  from Śiva down to earth as nothing but undifferentiated awareness.


  2. **Parāparāśakti** – by which He appears as both different and non-different,
  like an elephant seen in a mirror: there is a play of separation and unity at once.


  3. **Aparāśakti** – by which He manifests things as distinctly separate, as if they
  exist in mutual difference.


  A fourth way of speaking is to say that Parā Herself, under names like Mātṛsadbhāva
  and Kālakarṣiṇī, **draws all of this back into Herself**. She swallows the entire
  threefold process of holding the universe, by embracing it in Her own heart through
  unbroken awareness.


  These four Śaktis, through the Lord’s freedom, each operate in three modes: in **manifestation,
  maintenance, and dissolution**. In this way they become twelve.


  These twelve modes are the twelve **Kālīs** – goddesses who are nothing but forms
  of consciousness itself. They whirl like a wheel, governing the rise and fall of
  worlds, months, time-cycles, experiences. Shining outward as patterns of time, space
  and events, they **nourish the Lord’s freedom** and are referred to collectively
  as Śrī-Kālī.'
commentary: 'Śāktopāya is not just “working with thought.” It is **learning to recognize
  Śakti in the entire architecture of your experience**.


  Abhinava maps this with almost mathematical precision:


  - **Parā** – the pure sense that “everything is awareness.” This is like the still,
  unbroken ocean of experience.

  - **Parāparā** – the sense that “things are different *and yet* they are me.” This
  is the shimmering where unity and multiplicity kiss.

  - **Aparā** – the everyday feeling that “this is me, that is not me.” The world
  of apparently separate objects, responsibilities, relationships.


  Śāktopāya trains you to **notice all three as one Power moving**.


  The twelve Kālīs are not just fierce goddesses on a yantra; they are the **twelve
  ways your consciousness rhythmically shapes your day**:


  - Waking and sleeping

  - Opening and closing

  - Desire and fulfillment

  - Creation, sustaining, dissolving of projects, identities, relationships


  To live Śāktopāya is to feel:


  > “Every surge, every settling, every cycle in my life

  > is a face of Śakti, a Kālī dancing in the field of my own awareness.”


  At first this is taken as a vikalpa – a deliberate way of thinking.

  Later it becomes **obvious**, like recognizing your own handwriting.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra 4.1, “The Three Śaktis and the Twelve Kālīs”:** structural
  homology between the triadic division of Śakti (Parā, Parāparā, Aparā) and the triadic
  modes of manifestation, maintenance, dissolution that each Śakti undergoes, yielding
  a twelvefold structure

  *Divergence:* the original triad is a metaphysical categorization of divine power,
  whereas the derived triad of modes is a practical, experiential schema applied to
  everyday consciousness


  **Abhinavagupta, Tantrasāra 4.1, “The Three Śaktis and the Twelve Kālīs”:** structural
  homology between the concept of the universe as “Her powers” and the twelve Kālīs
  as the rhythmic, cyclical manifestations of those powers in time, space, and experience

  *Divergence:* the first treats the universe as an abstract, all-encompassing field
  of divine energy, while the second localizes that energy into concrete, time-bound
  cycles that can be mapped onto daily life


  **Abhinavagupta, Tantrasāra 4.1, “The Three Śaktis and the Twelve Kālīs”:** structural
  homology between the metaphor of the elephant in a mirror (Parāparā) and the experiential
  duality of seeing oneself as both distinct and non‑distinct within the same awareness

  *Divergence:* the metaphor is a visual, symbolic illustration, whereas the experiential
  claim invites direct, lived recognition of unity and multiplicity in one’s own consciousness'
insight: Śāktopāya is not just “working with thought.” It is **learning to recognize
  Śakti in the entire architecture of your experience**.
practice: 'Try this as a daily contemplation:


  1. **Parā – pure awareness taste**

  - At least once, sit for 3–5 minutes and rest in simple “I am.”

  - No story, no project, just the sense of being.

  - Whisper inside: *“This is Parā – the one in whom all appears.”*


  2. **Parāparā – both/and**

  - In a conversation or class, feel both:

  - “I am this person speaking or listening,” **and**

  - “All of this is arising in Me as awareness.”

  - Let unity and difference be present together.

  - This is Parāparā.


  3. **Aparā – the ordinary world**

  - When doing something very practical – emails, cleaning, accounting –

  consciously notice: “This feels like a separate, solid world.”

  - Instead of fighting that feeling, **include it**:

  > “This too is Śakti, playing at being separate.”


  4. **End of day – bow to the twelve Kālīs**

  - Scan your day: moments of beginning, sustaining, ending.

  - See each as a Kālī-pulse.

  - Offer a simple inner bow: *“Thank you, Śakti, for today’s dance.”*


  This is Śāktopāya as **lived tantric phenomenology** – not ideas, but a way of seeing
  that gently de-solidifies the world without denying its beauty.'
