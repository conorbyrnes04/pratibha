sanskrit_devanagari: अथानुपायमेव तावद्व्याख्यास्यामः। यदा खलु दृढशक्तिपाताविद्धः स्वयमेवेत्थं
  विवेचयति सकृदेव गुरुवचनमवधार्य तदा पुनरुपायविरहितो नित्योदितोऽस्य समावेशः। अत्र
  च तर्क एव योगाङ्गमिति कथं विवेचयतीति चेदुच्यते - योऽयं परमेश्वरः स्वप्रकाशरूपः स्वात्मा
  तत्र किमुपायेन क्रियते न स्वरूपलाभो नित्यत्वान्न ज्ञप्तिः स्वयम्प्रकाशमानत्वान्नावरणविगम
  आवरणस्य कस्यचिदप्यसम्भवान्न तदनुप्रवेशोऽनुप्रवेष्टुर्व्यतिरिक्तस्याभावात्। कश्चात्रोपायस्तस्यापि
  व्यतिरिक्तस्यानुपपत्तेस्तस्मात्समस्तमिदमेकं चिन्मात्रतत्त्वं कालेनाकलितं देशेनापरिच्छिन्नमुपाधिभिरम्लानमाकृतिभिरनियन्त्रितं
  शब्दैरसन्दिष्टं प्रमाणैरप्रपञ्चितं कालादेः प्रमाणपर्यन्तस्य स्वेच्छयैव स्वरूपलाभनिमित्तं
  च स्वतन्त्रमानन्दघनं तत्त्वं तदेव चाहम् तत्रैवान्तर्मयि विश्वं प्रतिबिम्बितमेवं
  दृढं विविञ्चानस्य शश्वदेव पारमेश्वरः समावेशो निरुपायक एव तस्य च न मन्त्रपूजाध्यानचर्यादिनियन्त्रणा
  काचित्।
sanskrit_iast: 'athānupāyam eva tāvad vyākhyāsyāmaḥ |

  yadā khalu dṛḍha-śakti-pātāviddhaḥ svayam evaitthaṃ vivecayati sakṛd eva guru-vacanam
  avadhārya tadā punar upāya-virahito nityodito’sya samāveśaḥ |

  atra ca tarka eva yogāṅgam iti kathaṃ vivecayatīti ced ucyate –

  yo’yaṃ parameśvaraḥ svaprakāśa-rūpaḥ svātmā tatra kim upāyena kriyate na svarūpa-lābho
  nityatvān na jñaptiḥ svayam-prakāśamānatvān nāvaraṇa-vigama āvaraṇasya kasyacid
  apy asambhavān na tad-anupraveśo’nupraveṣṭur vyatiriktasyābhāvāt |

  kaścātr’opāyas tasyāpi vyatiriktasyānupapatteḥ tasmāt samastam idam ekaṃ cin-mātra-tattvaṃ
  kālena akalitaṃ deśena aparicchinnaṃ upādhibhir amlānam ākṛtibhir aniyantritaṃ śabdair
  asandiṣṭaṃ pramāṇair aprapañcitaṃ kālādeḥ pramāṇa-paryantasya svecchayāiva svarūpa-lābha-nimittaṃ
  ca svatantram ānanda-ghanaṃ tattvaṃ tad eva cāham tatraivāntar mayi viśvaṃ pratibimbitam
  |

  evaṃ dṛḍhaṃ viviñcānasya śaśvad eva pārameśvaraḥ samāveśo nirupāyaka eva |

  tasya ca na mantra-pūjā-dhyāna-caryā-ādi-niyantraṇā kācit ||'
translation_literal: 'Now, I will explain the path of no-path, Anupāya.


  When someone has been struck by a firm descent of Śakti, and after hearing the Guru’s
  words only once, reflects in this way on his own, then his absorption into the Divine
  is ever-arising and free of all means.


  Here, reasoning alone is the limb of Yoga. If it is asked, “How does he reflect
  in this way?”, this is the answer:


  This very Supreme Lord, whose nature is self-luminous, is my own Self.

  What could be accomplished through any means with regard to Him?


  It cannot be the attainment of one’s true nature, because that nature is eternal.

  It cannot be some new knowledge of Him, because He is self-revealing.

  It cannot be the removal of some veil, because no veil can exist there.

  It cannot be entering into Him, because there is no separate “enterer” apart from
  Him.


  So what “means” can there be, when even the idea of something separate from Him
  is impossible?


  Therefore, all of this is one single reality made only of consciousness:

  not measured by time,

  not bounded by space,

  unstained by limiting conditions,

  not confined by forms,

  not pointed out by words,

  not unfolded by any means of knowledge.


  From time down to the instruments of knowledge, everything that appears is only
  its own free play. This reality is a compact mass of freedom and bliss, and that
  alone am I.


  In that very Self-within-me, the entire universe shines as a reflection.


  One who sees this clearly and firmly is always already immersed in the Supreme Lord
  without any means at all. For such a one, there is no binding obligation of mantra,
  worship, meditation or observance.'
commentary: 'Here Abhinavagupta turns to **Anupāya**, the “no-method” method, the
  pathless path. This is not a technique but a description of what happens when **śaktipāta
  is very strong** and the disciple is already ripe.


  A single word of the Guru lands, and something in the heart recognizes itself. From
  that point, practice is not a ladder but a remembering.


  Abhinava takes a razor to the very idea of “upāya” here:


  - You cannot “attain” your nature because it is not absent.

  - You cannot “know” Śiva as an object because He is the very light of knowing.

  - You cannot “remove a veil” in Him because nothing can cover light from itself.

  - You cannot “enter” Śiva because there is no second thing that could enter.


  Every project based on “I am here, Śiva is there, I must get there” collapses.


  What remains is a radical recognition:

  **All that exists is a single, self-luminous field of consciousness.**


  It is:

  - not counted by time,

  - not boxed in by space,

  - not stained by limitations,

  - not defined by forms,

  - not caught by words,

  - not fully laid out by any pramāṇa (means of valid knowledge).


  And then the pivot: *tad eva cāham* — “that alone am I.”

  Not “I will become that,” but “I am that, now, and have never been otherwise.”


  In that “I,” the universe appears as a reflection, like a dream within awareness,
  vivid but not other. Whoever sees this steadily is already in perpetual samāveśa,
  divine immersion, **without any need for means**.


  For such a one, mantra, pūjā, dhyāna and observances are no longer obligations or
  conditions for freedom. They may still happen, but as expressions of freedom, not
  steps toward it.


  Key Terms


  **Anupāya (अनूपाय / अनुपाय)** — The mode of awakening in which no method is required
  because recognition is immediate.


  **Śaktipāta (शक्तिपात)** — The sudden impact of divine energy that awakens recognition
  in the disciple.


  **Samāveśa (समावेश)** — The state of being fully suffused by the recognition of
  one’s identity with Śiva.


  **Tarka (तर्क)** — Here, the sharp contemplation that cuts away incoherent notions
  of separation.


  **Cin-mātra-tattva (चिद्मात्रतत्त्व / चिन्मात्रतत्त्व)** — The principle of pure
  consciousness alone.


  **Upādhi (उपाधि)** — Limiting adjunct, conditioning factor.


  **Pramāṇa (प्रमाण)** — Means of valid knowledge (perception, inference, scripture,
  etc.).


  **Svatantra / Svātantrya (स्वतन्त्र / स्वातन्त्र्य)** — The absolute freedom of
  consciousness to appear in any way.


  **Ānanda-ghana (आनन्दघन)** — Compact mass of bliss.


  **Pratibimba (प्रतिबिम्ब)** — The universe as a luminous mirror-play in awareness,
  not separate from it.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra 2.1, passage on Anupāya:** structural homology with
  the Advaita Vedānta notion of *parāśakti* (supreme power) as the ultimate reality
  that cannot be attained or known through conventional means; both systems posit
  that realization is a spontaneous, non-dual recognition rather than a process

  *Divergence:* While Advaita frames this as the *Brahman* that is already present
  and cannot be approached by *upāya*, Abhinavagupta emphasizes the dynamic descent
  of *Śakti* and the guru’s single word as the trigger, underscoring a more performative,
  experiential entry point


  **Abhinavagupta, Tantrasāra 2.1, comparison of “no veil” and “no separate enterer”:**
  structural homology with the Buddhist *sunyata* doctrine that emptiness is self-luminous
  and contains no inherent subject or object; both deny any external means or duality
  in attaining the ultimate truth

  *Divergence:* Unlike the Buddhist emphasis on emptiness as a negation of inherent
  existence, Abhinavagupta presents it as a positive, self-revealing light that is
  the very *Śiva* itself, thereby retaining a theistic identity rather than a purely
  philosophical negation


  **Abhinavagupta, Tantrasāra 2.1, description of the universe as a reflection within
  the Self:** structural homology with the Kashmir Shaivism concept of *Siva as the
  All* where the cosmos is a manifestation of consciousness; both see the world as
  a reflection of the ultimate reality

  *Divergence:* In Abhinavagupta’s account the reflection is achieved through a single,
  instantaneous realization via the guru’s word, whereas in classical Kashmir Shaivism
  the reflection is often cultivated through systematic practices like *Kundalini*
  awakening and *tapas*'
insight: Here Abhinavagupta turns to **Anupāya**, the “no-method” method, the pathless
  path.
practice: 'Allow this one line to sink in:

  > “That alone am I, and in Me the universe shines as a reflection.”


  Repeat it slowly a few times, then sit in silence for a minute.

  Notice any part of you that still feels “separate” from this.

  Gently include that feeling in the same light.'
