sanskrit_devanagari: 'यदेतत् प्रकाशरूपं शिवतत्त्वमुक्तम् तत्राखण्डमण्डले यदा प्रवेष्टुं
  न शक्नोति तदा स्वातन्त्र्यशक्तिमेवाधिकां पश्यन् निर्विकल्पमेव भैरवसमावेशमनुभवत्ययं
  चास्योपदेशः - सर्वमिदं भावजातं बोधगगने प्रतिबिम्बमात्रं प्रतिबिम्बलक्षणोपेतत्वादिदं
  हि प्रतिबिम्बस्य लक्षणं - यद् भेडेन भासितमशक्तमन्यव्यामिश्रत्वेनैव भाति तत् प्रतिबिम्बं
  मुखरूपमिव दर्पणे रस इव दन्तोदके गन्ध इव घ्राणे मिथुनस्पर्श इवानन्देन्द्रिये शूलकुन्तादिस्पर्शो
  वान्तःस्पर्शनेन्द्रिये प्रतिश्रुत्केव व्योम्नि। न हि स रसो मुख्यस्तत्कार्यव्याधिशमनाद्यदृष्टेः।
  नापि गन्धस्पर्शौ मुख्यौ गुणिनस्तत्राभावे तयोरयोगात्कार्यपरम्परानारम्भाच्च। न च तौ
  न स्तो देहोद्धूलनविसर्गादिदर्शनात्। शब्दोऽपि न मुख्यः कोऽपि वक्तीत्यागच्छन्त्येव
  प्रतिश्रुत्कायाः श्रवणात्। एवं यथैतत् प्रतिबिम्बितं भाति तथैव विश्वं परमेश्वरप्रकाशे।
  नन्वत्र बिम्बं किं स्यान्मा भूत्किञ्चित्। ननु किमकारणकं तद्धन्त तर्हि हेतु्प्रश्नः
  - तत् किं बिम्बवाचोयुक्त्या हेतुश्च परमेश्वरशक्तिरेव स्वातन्त्र्यापरपर्याया भविष्यति
  विश्वप्रतिबिम्बधारित्वाच्च विश्वात्मकत्वं भगवतः संविन्मयं हि विश्वं चैतन्यस्य व्यक्तिस्थानमिति
  तदेव हि विश्वमत्र प्रतीपमिति प्रतिबिम्बधारित्वमस्य तच्च तावद्विश्वात्मकत्वं परमेश्वरस्य
  स्वरूपं नानामृष्टं भवति चित्स्वभावस्य स्वरूपानामर्शनानुपपत्तेः। स्वरूपानामर्शने
  हि वस्तुतो जडतैव स्यादामर्शश्चायं न साङ्केतिकोऽपि तु चित्स्वभावतामात्रनान्तरीयकः
  परनादगर्भ उक्तः स च यावान् विश्वव्यवस्थापकः परमेश्वरस्य शक्तिकलापस्तावन्तमामृशति।


  तत्र मुख्यास्तावत्तिस्रः परमेश्वरस्य शक्तयः - अनुत्तरेच्छोन्मेष इति तदेव परामर्शत्रयम्
  अ-इ-उ इत्येतस्मादेव त्रितयात्सर्वः शक्तिप्रपञ्चश्चर्च्यतेऽनुत्तर एव हि विश्रान्तिरानन्द
  इच्छायामेव विश्रान्तिरीशनमुन्मेष एव हि विश्रान्तिरूर्मिर्यः क्रियाशक्तेः प्रारम्भस्तदेव
  परामर्शत्रयम् आ-ई-ऊ इति। अत्र च प्राच्यं परामर्शत्रयं प्रकाशभागसारत्वात्सूर्यात्मकं
  चरमं परामर्शत्रयं विश्रान्तिस्वभावाह्लादप्राधान्यात्सोमात्मकमियति यावत्कर्मांशस्यानुप्रवेशो
  नास्ति। यदा त्विच्छायामीशने च कर्मानुप्रविशति यत्तदिष्यमाणमीश्यमानमिति चोच्यते तदास्य
  द्वौ भेदौ प्रकाशमात्रेण रश्रुतिर्विश्रान्त्या लश्रुती रलयोः प्रकाशस्तम्भस्वभावत्वादिष्यमाणं
  च न बाह्यवत्स्फुटं स्फुटरूपत्वे तदेव निर्माणं स्यान्नेच्छेशनं वातोऽस्फुटत्वादेव
  श्रुतिमात्रं रलयोर्न व्यञ्जनवत्स्थितिः। तदेतद् वर्णचतुष्टयमुभयच्छायाधारित्वान्नपुंसकम्
  - ऋ-ॠ-ऌ-ॡ इति।


  अनुत्तरानन्दयोरिच्छादिषु यदा प्रसरस्तदा वर्णद्वयम् ए-ओ इति। तत्रापि पुनरनुत्तरानन्दसङ्घट्टाद्वर्णद्वयम्
  ऐ-औ इति। सेयं क्रियाशक्तिस्तदेव च वर्णचतुष्टयम् ए-ऐ ओ-औ इति। ततः पुनः क्रियाशक्त्यन्ते
  सर्वं कार्यभूतं यावदनुत्तरे प्रवेक्ष्यति तावदेव पूर्वं संवेदनसारतया प्रकाशमात्रत्वेन
  बिन्दुतयास्ते - अमिति। ततस्तत्रैवानुत्तरस्य विसर्गो जायते - अः इति। एवं षोडशकं परामर्शानां
  बीजस्वरूपमुच्यते। तदुत्थं व्यञ्जनात्मकं योनिरूपम्।


  तत्रानुत्तरात्कवर्गः श्रद्धाया इच्छायाश्चवर्गः सकर्मिकाया इच्छाया द्वौ टवर्गस्तवर्गश्चोन्मेषात्पवर्गः
  - शक्तिपञ्चकयोगात्पञ्चकत्वम्। इच्छाया एव त्रिविधाया य-र-ला उन्मेषाद्वकार इच्छाया
  एव त्रिविधायाः श-ष-सा विसर्गाद्धकारो योनिसंयोगजः क्षकारः। इत्येवं एष भगवाननुत्तर
  एव कुलेश्वररूपः। तस्य चैकैव कौलिकी विसर्गशक्तिर्ययानन्दरूपात्प्रभृतीयता बहिःसृष्टिपर्यन्तेन
  प्रस्पन्दतो वर्गादिपरामर्शा एव बहिस्तत्त्वरूपतां प्राप्ताः। स चैष विसर्गस्त्रिधाणवः
  चित्तविश्रान्तिरूपः शाक्तश्चित्तसम्बोधलक्षणः शाम्भवश्चित्तप्रलयरूप इति। एवं विसर्ग
  एव विश्वजनने भगवतः शक्तिः।


  इत्येवमियतो यदा निर्विभागतयैव परामर्शस्तदैक एव भगवान्बीजयोनितया भागशः परामर्शे शक्तिमाञ्छक्तिश्च।
  पृथगष्टकपरामर्शे चक्रेश्वरसाहित्येन नववर्ग एकैकपरामर्शप्राधान्ये पञ्चाशदात्मकता।
  तत्रापि सम्भवद्भागभेदपरामर्शन एकाशीतिरूपत्वम्। वस्तुतस्तु षडेव परामर्शाः प्रसरणप्रतिसञ्चरणयोगेन
  द्वादश भवन्तः परमेश्वरस्य विश्वशक्तिपूर्णत्वं पुष्णन्ति। ता एव एताः परामर्शरूपत्वाच्छक्तयो
  भगवत्यः श्रीकालिकेति निरुक्ताः। एते च शक्तिरूपा एव शुद्धाः परामर्शाः शुद्धविद्यायां
  परापररूपत्वेन मायोन्मेषमात्रसङ्कोचाद्विद्याविद्येश्वररूपतां भजन्ते। मायायां पुनः
  स्फुटीभूतभेदविभागा मायीयवर्णतां भजन्ते ये पश्यन्तीमध्यमावैखरीषु व्यावहारिकत्वमासाद्य
  बहीरूपतत्त्वस्वभावतापत्तिपर्यन्तास्ते च मायीया अपि शरीरकल्पत्वेन यदा दृश्यन्ते यदा
  च तेषामुक्तनयैरेतैर्जीवितस्थानीयैः शुद्धैः परामर्शैः प्रत्युज्जीवनं क्रियते तदा
  ते सवीर्या भवन्ति ते च तादृशा भोगमोक्षप्रदा इत्येवं सकलपरामर्शविश्रान्तिमात्ररूपं
  प्रतिबिम्बितसमस्ततत्त्वभूतभुवनभेदमात्मानं पश्यतो निर्विकल्पतया शाम्भवेन समावेशेन
  जीवन्मुक्तता। अत्रापि पूर्ववन्न मन्त्रादियन्त्रणा काचिदिति।'
sanskrit_iast: 'yad etat prakāśa-rūpaṁ śiva-tattvam uktam tatra akhaṇḍa-maṇḍale yadā
  praveṣṭuṁ na śaknoti tadā svātantrya-śaktim evādhikāṁ paśyan nirvikalpam eva bhairava-samāveśam
  anubhavaty ayaṁ cāsyo­padeśaḥ – sarvam idaṁ bhāva-jātaṁ bodha-gagane pratibimba-mātraṁ
  pratibimba-lakṣaṇopetatvād idaṁ hi pratibimbasya lakṣaṇaṁ – yad bhedena bhāsitam
  aśaktam anya-vyāmiśratvenaiva bhāti tat pratibimbaṁ mukha-rūpam iva darpaṇe rasa
  iva dantodake gandha iva ghrāṇe mithuna-sparśa ivānanda-indriye śūla-kuntādi-sparśo
  vāntaḥ-sparśana-indriye pratiśrutka eva vyomni | na hi sa raso mukhyaḥ tat-kārya-vyādhi-śamanādy
  adṛṣṭeḥ | nāpi gandha-sparśau mukhyau guṇinas tatra abhāve tayo­r ayogāt kārya-paramparā-nārambhāc
  ca | na ca tau na sto deha-uddhūlana-visargādi-darśanāt | śabdo’pi na mukhyaḥ ko’pi
  vaktīti āgacchanty eva pratiśrutkāyāḥ śravaṇāt | evaṁ yathaitat pratibimbitam bhāti
  tathā eva viśvaṁ parameśvara-prakāśe |


  nanv atra bimbaṁ kiṁ syān mā bhūt kiñcit | nanu kim akāraṇakaṁ tad hanta tarhi hetu-praśnaḥ
  – tat kiṁ bimba-vāco-yuktyā hetuś ca parameśvara-śaktir eva svātantryā-para-paryāyā
  bhaviṣyati viśva-pratibimba-dhāritvāc ca viśvātmakatvaṁ bhagavataḥ saṁvin-mayaṁ
  hi viśvaṁ caitanyasya vyakti-sthānam iti tad eva hi viśvam atra pratīpam iti pratibimba-dhāritvam
  asya tac ca tāvad viśvātmakatvaṁ parameśvarasya sva-rūpaṁ na an-āmṛṣṭaṁ bhavati
  cit-sva-bhāvasya sva-rūpa-anāmarśana-anupapatteḥ | svarūpānāmarśane hi vastuto jaḍataiva
  syād āmarśaś cāyaṁ na sāṅketiko’pi tu cit-sva-bhāvatā-mātra-nāntarīyakaḥ para-nāda-garbha
  uktaḥ sa ca yāvān viśva-vyavasthāpakaḥ parameśvarasya śakti-kalāpas tāvantam āmṛśati
  |


  tatra mukhyās tāvat tisraḥ parameśvarasya śaktayaḥ – anuttarecchonmeṣa iti tad eva
  parāmarśa-trayam a-i-u iti | etasmād eva tritayāt sarvaḥ śakti-prapañcaś carcyate
  | anuttare eva hi viśrāntir ānandaḥ icchāyām eva viśrāntir īśanam unmeṣe eva hi
  viśrāntir ūrmiḥ yaḥ kriyā-śakteḥ prārambhas tad eva parāmarśa-trayam ā-ī-ū iti |
  atra ca prācyaṁ parāmarśa-trayaṁ prakāśa-bhāga-sāratvāt sūryātmakaṁ caramaṁ parāmarśa-trayaṁ
  viśrānti-sva-bhāva-āhlāda-prādhānyāt somātmakam iyati yāvat karmāṁśasyānupraveśo
  nāsti |


  yadā tv icchāyām īśane ca karmānupraviśati yat tad iṣyamāṇam īśyamānam iti ca ucyate
  tadāsya dvau bhedau prakāśa-mātreṇa ra-śrutiḥ viśrāntyā la-śrutī ra-layoḥ prakāśa-stambha-svabhāvatvād
  iṣyamāṇaṁ ca na bāhya-vat sphuṭaṁ sphuṭa-rūpatve tad eva nirmāṇaṁ syān na icchā-īśanaṁ
  vā ataḥ asphuṭatvād eva śruti-mātraṁ ra-layor na vyañjana-vat sthitiḥ | tad etad
  varṇa-catuṣṭayam ubhaya-chāyā-dhāritvān napuṁsakam – ṛ-ṝ-ḷ-ḹ iti |


  anuttarānandayor icchādiṣu yadā prasaraḥ tadā varṇa-dvayam e-o iti | tatrāpi punar
  anuttarānanda-saṅghaṭṭād varṇa-dvayam ai-au iti | seyaṁ kriyā-śaktiḥ tad eva ca
  varṇa-catuṣṭayam e-ai o-au iti | tataḥ punaḥ kriyā-śakty-ante sarvaṁ kārya-bhūtaṁ
  yāvad anuttare pravekṣyati tāvad eva pūrvaṁ saṁvedana-sāratayā prakāśa-mātratvena
  bindutayā āste – am iti | tatas tatraivānuttarasya visargo jāyate – aḥ iti | evaṁ
  ṣoḍaśakaṁ parāmarśānāṁ bīja-svarūpam ucyate | tad-utthaṁ vyañjanātmakaṁ yoni-rūpam
  |


  tatrānuttarāt ka-vargaḥ śraddhāyā icchāyāś ca-vargaḥ sa-karmikāyā icchāyā dvau ṭa-vargaḥ
  ta-vargaś ca unmeṣāt pa-vargaḥ – śakti-pañcaka-yogāt pañcakatvam | icchāyā eva trividhāyā
  ya-ra-lā unmeṣād va-kāraḥ icchāyā eva trividhāyāḥ śa-ṣa-sā visargād dha-kāro yoni-saṁyogajaḥ
  kṣa-kāraḥ | ity evaṁ eṣa bhagavān anuttara eva kuleśvara-rūpaḥ | tasya caikaiva
  kaulikī visarga-śaktir yayānanda-rūpāt prabhṛti iyatā bahiḥ-sṛṣṭi-paryantena praspandato
  varga-ādi-parāmarśā eva bahis-tattva-rūpatāṁ prāptāḥ | sa ca eṣa visargaḥ tridhā
  aṇavaḥ citta-viśrānti-rūpaḥ śāktaś citta-sambodha-lakṣaṇaḥ śāmbhavaś citta-pralaya-rūpa
  iti | evaṁ visarga eva viśva-janane bhagavataḥ śaktiḥ |


  ity evam iyato yadā nirvibhāgatayā eva parāmarśas tad eka eva bhagavān bīja-yonitayā
  bhāgaśaḥ parāmarśe śaktimāñ chaktiś ca | pṛthak-aṣṭaka-parāmarśe cakreśvara-sāhityena
  nava-varga ekaika-parāmarśa-prādhānye pañcāśad-ātmakatā | tatrāpi sambhavat-bhāga-bheda-parāmarśane
  ekāśīti-rūpatvam | vastutas tu ṣaḍ eva parāmarśāḥ prasaraṇa-pratisañcaraṇa-yogena
  dvādaśa bhavantaḥ parameśvarasya viśva-śakti-pūrṇatvaṁ puṣṇanti | tā eva etāḥ parāmarśa-rūpatvāc
  chaktayo bhagavatyaḥ śrī-kālike ti niruktāḥ | ete ca śakti-rūpā eva śuddhāḥ parāmarśāḥ
  śuddha-vidyāyāṁ parāpara-rūpatvena māyā-unmeṣa-mātra-saṅkocād vidyā-vidyeśvara-rūpatāṁ
  bhajante | māyāyāṁ punas sphuṭībhūta-bheda-vibhāgā māyīya-varṇatāṁ bhajante ye paśyantī-madhyamā-vaikharīṣu
  vyāvahārikatvam āsādya bahīrūpa-tattva-sva-bhāvatāpatti-paryantās te ca māyīyā api
  śarīra-kalpatvena yadā dṛśyante yadā ca teṣām ukta-nayair etair jīvita-sthānīyaiḥ
  śuddhaiḥ parāmarśaiḥ pratyujjīvanaṁ kriyate tadā te savīryā bhavanti te ca tādṛśā
  bhoga-mokṣa-pradā iti |


  evam sakala-parāmarśa-viśrānti-mātra-rūpaṁ pratibimbita-samasta-tattva-bhūta-bhuvana-bhedam
  ātmānaṁ paśyato nirvikalpatayā śāmbhavena samāveśena jīvan-muktatā | atrāpi pūrvavat
  na mantrādi-yantraṇā kācid iti ||'
translation_literal: 'This Light, which has been described as the reality of Śiva,
  sometimes cannot be entered directly as the undivided circle of pure radiance. When
  that happens, the practitioner contemplates the Power of Absolute Freedom as something
  that stands out more clearly, and by seeing that, he experiences a thought-free
  immersion in Bhairava. For such a practitioner, the instruction is as follows.


  All this manifold of existing things is nothing but a reflection in the sky of awareness.
  It has the marks of a reflection. The mark of a reflection is this: whatever cannot
  appear on its own and only shows up mixed with something else is a reflection.


  A face appears in a mirror, taste appears in the saliva of the mouth, smell appears
  in the nostrils, the touch of union appears in the pleasure-organ, the pain of spear
  and lance appears in the inner organ of touch, an echo appears in space.


  The taste in the mouth is not the primary taste, since we do not see it healing
  disease and producing the other effects that real food does. Smell and touch in
  the sense organs are also not primary, because, without the true object that bears
  qualities, they cannot set off a chain of effects. And yet they do exist, as we
  can see from the body’s shaking, emission and so on.


  Even sound is not primary, since someone must utter it, and we hear it coming back
  as echo.


  In just this way, as these examples shine forth as reflections, so the entire universe
  shines as a reflection in the Light of the Supreme Lord.


  You might ask, “What, then, is the original thing of which this is a reflection?”
  Let there be nothing separate at all.


  You might say, “Then is this reflection without a cause?” No. The question of the
  cause leads us to this: there is no need to invent an external original. The cause
  is the Power of the Supreme Lord, whose other name is Svātantrya, Absolute Freedom.


  Because She bears the reflection of the universe, that Power is nothing other than
  the Lord as the universe. The universe is made of consciousness and is the field
  where consciousness manifests. The universe itself is the reversed image of that
  One here, which means it is held as reflection within Him.


  This universality of the Lord is His very nature. It is not unconscious, because
  for the nature of consciousness, a lack of self-awareness is impossible.


  If there were no self-awareness in the very essence of consciousness, that essence
  would be inert. This awareness is not conventional or symbolic. It is immediately
  inherent in the nature of consciousness and is said to be the embryo of the supreme
  sound, para-nāda. As such, it is the entire cluster of Śakti of the Supreme Lord,
  which regulates and orders the universe, and it is aware of that whole extent.


  Within that cluster, three powers of the Lord are primary: **Anuttara**, **Icchā**,
  and **Unmeṣa**. These three are a triad of awareness, expressed as the sounds **a,
  i, u**. From this triad, the whole proliferation of powers is generated.


  In Anuttara alone there is rest, which is Ānanda.

  In Icchā alone there is rest, which is Īśana.

  In Unmeṣa alone there is rest, which is Ūrmi, the first stirring of the Power of
  Action.


  These three rests form another triad of awareness, **ā, ī, ū**.


  The first triad, a, i, u, is solar, because it is the essence of the portion of
  pure light.

  The second triad, ā, ī, ū, is lunar, because it is saturated with the delight of
  repose.

  Up to this point, the element of activity has not yet entered.


  When activity enters into Icchā and Īśana, then the object-to-be-known and the object-to-be-ruled
  appear. In that situation, the sounds **ra** and **la** arise: ra as the pure streak
  of light, la as the streak of repose. Because ra and la have the nature of slightly
  stopping or thickening the flow of light, the “object-to-be-known” is not clear
  like an external object. If it were fully clear, it would already be a formed creation,
  and not simply the play of Icchā and Īśana.


  Precisely because they are not clear, ra and la remain mere tones rather than full
  consonants. These four sounds, **ṛ, ṝ, ḷ, ḹ**, hold the shadow of both vowel and
  consonant and are therefore considered neuter.


  When Anuttara and Ānanda expand into Icchā and the rest, two more vowels arise,
  **e** and **o**. When Anuttara and Ānanda again collide in that flow, two further
  vowels arise, **ai** and **au**.


  This is the Power of Action. She is expressed as the four vowels **e, ai, o, au**.


  When the Power of Action completes her play, everything that had come into the state
  of “effect” turns back toward Anuttara. Before that reabsorption, it abides as Bindu,
  “am”, the point which is nothing but light, the very essence of knowing.


  Then, within that same Bindu, the emission of Anuttara arises as “aḥ”.


  In this way, the sixteen modes of awareness that are the vowels are called the seed.
  Arising from them is the consonantal field, the womb.


  From Anuttara comes the **ka-group**; from faith-filled Icchā the **ca-group**;
  from Icchā endowed with activity come the **ṭa-group** and **ta-group**; from Unmeṣa
  the **pa-group**. By the connection with the five primary powers, this forms a fivefold
  set of consonant groups.


  From the threefold Icchā come **ya, ra, la**. From Unmeṣa comes **va**. From the
  same threefold Icchā come **śa, ṣa, sa**. From Visarga arises **ha**. From the union
  of consonants emerges **kṣa**.


  Thus this Lord Anuttara is the Lord of Kula. He has one Kaulikī Power of Emission.
  From the first vibration of bliss out to the last edge of external manifestation,
  the various letter-groups are simply shapes of awareness that have gained the status
  of outer principles.


  This Visarga, this emission, is threefold:

  - Āṇava, the form of the mind’s repose.

  - Śākta, the form of the mind’s awakened illumination.

  - Śāmbhava, the form of the mind’s dissolution.


  Thus, Visarga itself is the Lord’s power in the generation of the universe.


  So, when awareness is taken as utterly undivided, there is only the One Lord. When
  awareness is taken in divided form, as seed and womb, there appears Śiva, the possessor
  of Śakti, and Śakti.


  If awareness is considered in eightfold sets, together with the Lord of the circle,
  the letter kṣa, there are nine groups. When we emphasize each awareness-portion
  individually, we obtain fifty letters. If we further take into account the possible
  subdivisions of their measure, we speak of eighty-one.


  In truth, there are six basic modes of awareness. Through expansion and reabsorption,
  they become twelve, and these twelve nourish the fullness of the Lord’s universal
  power. These very awareness-forms are the goddesses known as the revered Kālikās.


  These pure modes of awareness, whose nature is Śakti, in the level of Śuddhavidyā
  appear as the “parāpara” state. Through a light contraction in Māyā’s unfolding
  they take the forms of Vidyā and Vidyeśvara.


  In Māyā proper, where division is clearly articulated, they become mayic letters.
  As these pass through Paśyantī, Madhyamā and Vaikharī, they become the ordinary
  letters of speech and thought, eventually hardening into the external categories
  of experience. Even as mayic forms, they can appear like lifeless bodies.


  When, however, they are revivified by the pure living awarenesses mentioned above,
  they regain power and become instruments of both enjoyment and liberation.


  Thus, for one who sees his own Self as the mere repose of all these modes of awareness,
  and as the place where the whole variety of worlds and principles appears as reflection,
  there is liberation while living through a Śāmbhava immersion that is free of thought.


  Here too, as before, there is no binding requirement of mantra or any other practice.'
commentary: 'Śāmbhavopāya is the path where **recognition** happens through a sharp,
  direct tilt of awareness, not through elaborated practice. Chapter 3 gives you two
  key images to live with:


  1. **World as reflection in the sky of awareness**

  2. **Letters and sounds as crystallized modes of divine self-awareness (parāmarśa)**


  Abhinavagupta starts in a very practical place. Sometimes, you cannot enter directly
  into the sense of “I am the undivided circle of Śiva.” That is too abstract, too
  vast. So he gives you a doorway: notice the **Power of Svātantrya**, the sheer freedom
  with which your experience arises. Contemplate that freedom as the real “subject,”
  and a thoughtless Bhairava-state opens.


  Then he explains how everything that appears is a **pratibimba**, a reflection,
  not an independent thing.


  - Taste in the mouth is not the original taste of food.

  - The ache in the body is not pain in itself, but a reflected sensation.

  - An echo is not the original sound.


  Reflections only appear in another medium: mirror, saliva, air, awareness. They
  cannot appear on their own.


  Abhinava’s point: **the universe is just like that.**

  It is not a second thing beside Śiva. It is the way Śiva’s own awareness appears,
  reflected in Himself, in the “sky of bodha,” the open field of awareness.


  He then heads off an important mistake. If the universe is a reflection, maybe there
  must be some separately existing original object that it copies? He refuses that.
  Instead, the “cause” of the reflection is **Śiva’s own power of freedom**. The universe
  is not a copy of something outside awareness.

  It is awareness itself, showing its own capacity to appear as many.


  At the heart of this is **parāmarśa**, self-awareness, the “I am this” pivot of
  consciousness. Without that, consciousness would be inert. That subtle self-awareness
  is the embryo of the supreme sound, para-nāda.


  From here he unpacks a symbolic cosmology: each **vowel and consonant** is a way
  this divine awareness turns toward itself.


  - The basic triad: **a, i, u** – Anuttara, Icchā, Unmeṣa.

  - The resting triad: **ā, ī, ū** – the same three powers tasted as repose and bliss.

  - Further combinations yield e, o, ai, au.

  - The sixteen vowels are the “seed,” the pure pulses of self-awareness.

  - The consonants are the “womb,” the shaping matrix of manifestation.


  For our purposes, you do not need to memorize the full phonology. Feel the point:


  > Sound is not merely a tool of speech.

  > It is the **shape that awareness takes on its way from Silence into world**.


  The goddesses known as Kālikās are these very modes of awareness. When they are
  pure, they are powers of recognition. When they descend into Māyā, they become letters,
  words, stories, karmic scripts. They can be dead and heavy, like a body with no
  breath, or reanimated by a return to parāmarśa.


  Śāmbhavopāya, then, is:


  - Seeing your entire experience as **reflected play in the sky of awareness**, and

  - Recognizing every movement of thought, speech and sensation as a **modulation
  of one divine “I-taste.”**


  Abhinava ends very quietly: the one who sees his own Self as the resting ground
  of all parāmarśas, who sees all worlds and principles as reflected in that Self,
  is already **jīvanmukta**, liberated while living, by a Śāmbhava absorption that
  has no concepts and no compulsion to practice anything.


  Practice may arise, mantra may arise, but not as obligation. They are the echo of
  freedom, not the cause of it.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 3, Chapter 3, Passage:** structural homology

  *Divergence:* The notion of the universe as a reflection in the sky of awareness
  parallels the Buddhist concept of pratītyasamutpāda (dependent origination) where
  phenomena arise only in relation to causes and conditions, yet Abhinavagupta diverges
  by attributing the reflection to an absolute, self‑existing divine power (Svātantrya)
  rather than to interdependent co‑arising causes.


  **Abhinavagupta, Tantrasāra, Unit 3, Chapter 3, Passage:** structural homology

  *Divergence:* The comparison of sensory reflections (taste, smell, echo) to cosmic
  reflection mirrors the Advaita Vedānta idea of māyā (illusion) where the world appears
  superimposed on Brahman; however, Abhinavagupta diverges by insisting that the reflection
  is not an illusion but a real manifestation of the Supreme Lord’s power, thereby
  rejecting the dualism between reality and appearance.


  **Abhinavagupta, Tantrasāra, Unit 3, Chapter 3, Passage:** structural homology

  *Divergence:* The emphasis on the Power of Absolute Freedom (Svātantrya) as the
  cause of the reflection echoes the Kashmir Shaivite concept of Śiva as the dynamic,
  self‑free consciousness, yet Abhinavagupta diverges by framing Svātantrya as the
  sole ontological source of both the reflector and the reflected, eliminating any
  intermediary principle or external original.'
insight: Śāmbhavopāya is the path where **recognition** happens through a sharp, direct
  tilt of awareness, not through elaborated practice.
practice: '1. Sit for a few minutes and let this one sentence circulate inside:

  **“All this is a reflection in the sky of awareness.”**


  2. Pick anything in your present field: a sound, a thought, an ache, a desire.

  Ask softly, *“Where does this appear?”*


  3. Let attention shift from the “object” to the **space that holds it**.

  Feel that space as **you**, prior to name and story.


  4. For one breath, forget method.

  Just rest as that sky.'
