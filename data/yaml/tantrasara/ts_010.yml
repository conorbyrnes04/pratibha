  text: 'This Light, which has been described as the reality of Śiva, sometimes cannot
    be entered directly as the undivided circle of pure radiance. When that happens,
    the practitioner contemplates the Power of Absolute Freedom as something that
    stands out more clearly, and by seeing that, he experiences a thought-free immersion
    in Bhairava. For such a practitioner, the instruction is as follows.


    All this manifold of existing things is nothing but a reflection in the sky of
    awareness. It has the marks of a reflection. The mark of a reflection is this:
    whatever cannot appear on its own and only shows up mixed with something else
    is a reflection.


    A face appears in a mirror, taste appears in the saliva of the mouth, smell appears
    in the nostrils, the touch of union appears in the pleasure-organ, the pain of
    spear and lance appears in the inner organ of touch, an echo appears in space.


    The taste in the mouth is not the primary taste, since we do not see it healing
    disease and producing the other effects that real food does. Smell and touch in
    the sense organs are also not primary, because, without the true object that bears
    qualities, they cannot set off a chain of effects. And yet they do exist, as we
    can see from the body’s shaking, emission and so on.


