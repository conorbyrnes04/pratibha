- citation: 'Vijnana Bhairava — Yukti #106'
  resonance: 'Both texts pause conceptual elaboration to pose a direct question that dissolves the subject-object split: the Spandakarika invites insight to disclose itself without mediation, while Vijnana Bhairava asks how the unchanging Self can be locus of cognition or action—both suspending ordinary interpretive frames to let non-dual recognition emerge.'
  divergence: The Spandakarika emphasizes the pause itself as a contemplative method, while Vijnana Bhairava uses paradoxical questioning as a yukti (technique) to collapse conceptual categories through logical impossibility.
  passage_id: vijnana_bhairava.yukti_106
- citation: Astavakra Gita — 8.1 — 8.4
  resonance: Both texts use a structural inversion—bondage and liberation defined by the mind's movement toward or away from desire—to reveal that freedom is not attainment but cessation of grasping; the Spandakarika's 'let insight disclose itself' mirrors Astavakra's recognition that muktir (liberation) is the mind's non-seeking.
  divergence: Astavakra Gita grounds liberation in cognitive non-movement (cittam na vāñchati), while Spandakarika emphasizes the spontaneous disclosure of insight through contemplative pause, suggesting an active receptivity rather than mere cessation.
  passage_id: astavakra_gita.asg_sum_08_01_08_04
