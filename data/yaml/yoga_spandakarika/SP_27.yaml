resonances:
- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts use breath-movement (prāṇa) as the primary vehicle for direct disclosure of consciousness: the Spandakarika points to vibration-as-awareness through pause, while Yukti #1 identifies the Goddess''s constant articulation *as* the breath-cycle itself—each making breath the transparent medium where insight self-discloses rather than an object to be grasped.'
  divergence: The Spandakarika emphasizes the pause and cessation of interpretive mind to allow spanda (vibration) to reveal itself; the Vijnana Bhairava locates the Goddess's continuous creative utterance *within* the breath-flow itself, making the movement rather than the gap the locus of recognition.
  passage_id: vijnana_bhairava.yukti_001
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: 'Both texts refuse symbolic or conceptual mediation as the path to their central insight: the Spandakarika''s instruction to pause interpretation and let insight disclose itself directly mirrors Mahāmudrā''s claim that it cannot be pointed to by symbol and ordinary mind cannot grasp it—each rejecting the representational apparatus in favor of immediate recognition.'
  divergence: The Spandakarika grounds this non-conceptual disclosure in breath-vibration as the vehicle; Tilopa's Mahāmudrā operates in the Buddhist framework where the ordinary mind's inability to grasp stems from fundamental ignorance of emptiness, not from the need to access a subtle vibration.
  passage_id: tilopa_mahamudra.til_001
