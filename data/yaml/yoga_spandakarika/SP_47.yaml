- citation: 'Vijnana Bhairava — Yukti #106'
  resonance: 'Both texts pause conceptual analysis to let a paradox disclose itself directly: the Spandakarika instructs the reader to suspend interpretation and allow insight to emerge, while Vijnana Bhairava poses an unanswerable question (how can the unchanging Self be the locus of action?) as a contemplative pointer that short-circuits rational thought.'
  divergence: The Spandakarika suspends interpretation to access the spanda (vibration/pulsation) of consciousness-in-action, while Vijnana Bhairava uses the paradox to dissolve the subject-object distinction and reveal the Self as untouched by cognition or action.
  passage_id: vijnana_bhairava.yukti_106
- citation: 'Phaedo (Plato) — The Second Sailing: Forms as True Causes'
  resonance: 'Both texts enact a methodological reversal: Socrates abandons sensory-physical explanation for intelligible causes, and the Spandakarika instructs the reader to abandon interpretive scaffolding to let direct disclosure occur—each marks a shift from mediated to immediate knowing.'
  divergence: Plato's second sailing ascends to transcendent Forms as stable intelligible objects, while the Spandakarika's pause allows the spanda itself (dynamic vibration) to self-reveal without reification into object-form.
  passage_id: phaedo_plato.phaedo_md_005
