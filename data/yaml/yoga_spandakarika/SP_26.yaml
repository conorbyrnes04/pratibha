resonances:
- citation: Tantrasara — World as Reflection in the Sky of Awareness
  resonance: 'Both texts posit a direct, non-elaborated activation of consciousness through a sharp shift in awareness: the Spandakarika''s mantra ''charged with sacred tremor'' accomplishes function through the awakened person''s senses, while Śāmbhavopāya operates through ''a sharp, direct tilt of awareness'' without elaborated practice. Both bypass methodical construction.'
  divergence: The Spandakarika grounds this activation in mantra and sensory channels as the vehicle, whereas Tantrasara locates it in pure recognition (pratyabhijñā) as a shift of consciousness itself, independent of external form.
  passage_id: tantrasara.ts_010
- citation: Pratyabhijnahrdayam — Sutra 13
  resonance: 'Both texts describe a reflexive turn where consciousness recognizes itself as the source and author of manifestation: the Spandakarika''s mantra emerges from ''the spatial source of the tantrika,'' and Pratyabhijnahrdayam''s sutra describes ''complete recognition of one''s own authorship'' where ''the mind itself becomes the Supreme Consciousness.'' Both locate power in self-recognition rather than external acquisition.'
  divergence: The Spandakarika emphasizes the tremor (spanda) as the dynamic, vibratory principle that charges the mantra, while Pratyabhijnahrdayam emphasizes introversion and the ascent of mind to Supreme Consciousness as the mechanism of recognition.
  passage_id: pratyabhijnahrdayam.phr_013
- citation: Isavasya Upanishad — Mantra 17
  resonance: 'Both texts invoke breath and dissolution as the gateway to transcendence: the Spandakarika''s mantra operates through ''breath'' and ''the awakened person,'' while the Isavasya Upanishad''s mantra explicitly returns ''breath to the immortal air'' and the body to ashes. Both use breath as the threshold between embodied and transcendent states.'
  divergence: The Spandakarika treats breath as the living vehicle through which mantra accomplishes its function in an awakened person, whereas the Isavasya Upanishad treats breath's return as a final dissolution—a relinquishment rather than an activation.
  passage_id: isavasya_upanishad.isa_023
