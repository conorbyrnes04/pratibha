sutra_id: SP_20
sutra: '20'
title: And yet, this sacred tremoring itself causes people who are subject to limited
  views to...
collection: Yoga Spandakarika
section: Second Flow
sanskrit: ''
transliteration: ''
translation: And yet, this sacred tremoring itself causes people who are subject to
  limited views to become lost because, their intuition being dissociated from the
  profound source, they throw themselves into the whirlwind of transmigration.
commentary: If a person who has views that are limited by the ego attempts to actualize
  this teaching, he will see that in discontinuity there is transmigration. He jumps
  from one space to another, from one point in time to another; the flow is not continuous,
  and the masses of water, now forming lakes, cannot flow toward the great unity.
  Awareness of this momentary transmigration is the consciousness that feeds the division
  of a life into multiple fragments; therefore, the concept of birth and death corroborates
  this experience. By those resting comfortably in the celestial bliss Of the cool,
  pure, tranquil, sweet
voice_of_siva: ''
abhyasa: Close the eyes for 2 minutes and release all labels. Repeatedly return to
  the immediate sense 'I am aware' without adding any story.
