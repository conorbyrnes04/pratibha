resonances:
- citation: Patañjali Yoga Sūtras 4.4
  resonance: Both texts identify ego-sense (ahaṃkāra) as the generative principle of fragmentation and bondage. The Spandakarika shows how limited ego-views cause one to become lost in transmigration; Patañjali states directly that ego-sense alone creates the multiplicity of minds—the mechanism of dispersal itself.
  divergence: Patañjali treats ego-sense as a metaphysical generator of mental proliferation within prakṛti; the Spandakarika frames it as a dissociation from the profound source (spanda), emphasizing rupture from non-dual awareness rather than mechanical causation.
  passage_id: patañjali_yoga_sūtras.ys_4_04
- citation: Svetasvatara Upanishad — Fluttering in the Brahma-Wheel
  resonance: Both texts diagnose the core error as mistaking oneself as separate—the swan-self taking itself as separate from the Impeller mirrors the person whose intuition is dissociated from the profound source. In both, this false separation is the pivot that locks one into cyclical suffering.
  divergence: The Svetasvatara uses cosmological imagery (the Brahma-wheel, the Impeller) to frame separation as ontological confusion; the Spandakarika grounds it in a rupture of intuitive continuity with spanda, emphasizing phenomenological discontinuity rather than metaphysical duality.
  passage_id: svetasvatara_upanishad.svu_006
- citation: Pratyabhijnahrdayam — Sutra 20
  resonance: 'Both passages hinge on a reversal: entering into perfect I-consciousness (Pratyabhijnahrdayam) dissolves the limited view, just as the Spandakarika implies that reconnection to the profound source would undo the ego-driven dissociation. Both posit a shift in the locus of identity as the remedy.'
  divergence: Pratyabhijnahrdayam emphasizes recognition of Light and Bliss as the corrective; the Spandakarika emphasizes restoration of intuitive continuity with the tremoring (spanda) itself—a difference between recognitional gnosis and participatory re-attunement.
  passage_id: pratyabhijnahrdayam.phr_020
