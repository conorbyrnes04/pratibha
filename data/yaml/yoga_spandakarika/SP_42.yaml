sutra_id: SP_42
sutra: '42'
title: Then, may light, sound, form, and taste come and impede the person who is still
  tied to...
collection: Yoga Spandakarika
section: Third Flow
sanskrit: ''
transliteration: ''
translation: Then, may light, sound, form, and taste come and impede the person who
  is still tied to the ego.
commentary: When the inner gaze opens, sounds do nothing but caress the absolute substance
  of things, and the ego loosens to the point where it becomes the Self. How can one
  call the act of disciplining the mind This is for the person who has not understood
  the preceding stanza. Poor him! Hindered, tied hand and foot, in total paralysis!
  And yet even this hindering, if we live it completely, is the key to our liberation.
  The senses kill us or liberate us. The sensorial quest can be the tragic site of
  illusion—or the expression of the divine within us. Do the gods know this inconceivable
  freedom? Do we know it? Here again is an opportunity for healthy doubt. Why did
  we create the gods?
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
