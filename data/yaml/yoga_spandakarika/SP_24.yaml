- citation: 'Vijnana Bhairava — Yukti #1'
  resonance: 'Both texts use breath (prāṇa) as the primary vehicle for direct disclosure of consciousness: the Spandakarika invites pause and non-interpretive insight, while Yukti #1 presents the Goddess articulating herself through the exhale-inhale cycle as the fundamental movement of awareness itself.'
  divergence: The Spandakarika emphasizes the cessation of interpretive mind to allow insight to disclose itself, whereas the Vijnana Bhairava grounds this disclosure in the continuous oscillation of prāṇa as the Goddess's active self-expression.
  passage_id: vijnana_bhairava.yukti_001
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: 'Both texts refuse symbolic or conceptual mediation as a path to the ultimate: the Spandakarika''s instruction to ''pause interpretation'' and let insight disclose itself directly mirrors Mahāmudrā''s principle that the ordinary mind cannot grasp it as an object of thought.'
  divergence: The Spandakarika grounds this non-conceptuality in the vibration of awareness itself (spanda), whereas Tilopa's Mahāmudrā emphasizes the radical non-objectifiability of mind's own nature independent of energetic mechanics.
  passage_id: tilopa_mahamudra.til_001
