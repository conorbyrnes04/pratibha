resonances:
- citation: 'Vijnana Bhairava — Yukti #56'
  resonance: Both texts use sustained sensory stillness (uninterrupted gaze at sky; pause in interpretation) as a threshold where direct recognition of consciousness spontaneously discloses itself, bypassing conceptual mediation.
  divergence: Vijnana Bhairava locates the breakthrough in external visual focus stabilized to absorption, while Spandakarika emphasizes internal interpretive suspension—one is object-anchored, the other is thought-anchored.
  passage_id: vijnana_bhairava.yukti_056
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: Both texts insist that the ultimate state cannot be grasped through symbolic pointing or ordinary mental effort; insight must disclose itself when the apparatus of conceptual grasping is stilled.
  divergence: Tilopa frames this as the impossibility of Mahāmudrā being an object of thought, while Spandakarika frames it as a direct disclosure that emerges when interpretation itself pauses—one emphasizes non-objecthood, the other non-mediation.
  passage_id: tilopa_mahamudra.til_001
- citation: Patañjali Yoga Sūtras 1.46
  resonance: Both passages identify a state in which consciousness remains 'seeded' or pregnant with potential—a condition of stillness where the ordinary subject-object structure dissolves and awareness recognizes itself.
  divergence: Patañjali's samādhi is a formal yogic attainment with seeds of latent impressions, while Spandakarika's recognition is spontaneous disclosure without residue—one is a structured state, the other is immediate self-luminosity.
  passage_id: patañjali_yoga_sūtras.ys_1_46
