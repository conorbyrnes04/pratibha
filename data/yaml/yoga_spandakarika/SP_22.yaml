sutra: '22'
title: 'The profound and stable sacred tremor can be reached in extreme states: anger,
  intense...'
collection: Yoga Spandakarika
section: Second Flow
sanskrit: ''
transliteration: ''
translation: 'The profound and stable sacred tremor can be reached in extreme states:
  anger, intense joy, mental wandering, or the drive toward survival.'
commentary: 'These states are vast moments of unity. The tantrika welcomes them without
  losing awareness of the source, and all the manifestations autoliberate themselves
  in the Mahamudra. Certain disciples choose to ignore the danger by renouncing the
  powerful states and the larger emotions; others transform the disturbances by focusing
  on the divine. The tantrika takes all things as the manifestation of the infinite
  and, in this way, sees all emergences right from the start as the sacred path of
  illumination, as the expression of the limitless. It is no longer even necessary
  to wait for the disturbances to return to the source in order to be liberated: they
  are, in essence, liberation. In this very place, so richly adorned by sacred gatherings
  (tshogs-kyi ‘khor-lo) , [Being’s nothingness replete with everything in highest'
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
