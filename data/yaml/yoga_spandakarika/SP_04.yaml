sutra_id: SP_04
sutra: '4'
title: All the relative notions tied to the ego rediscover their peaceful source deeply
  buried...
collection: Yoga Spandakarika
section: First Flow
sanskrit: ''
transliteration: ''
translation: All the relative notions tied to the ego rediscover their peaceful source
  deeply buried under all the different states.
commentary: To establish a truth, an ego is necessary. Without an ego, the truth is
  all truths together. When we believe that all is true, we find the peaceful source
  where images dissolve one after the other. The space of our thought becomes infinite,
  a place to pass through, a riverbed that no longer seeks to know if the leaves and
  the twigs are “true.” Hence, in this flow, relative notions get lost in the sky
  of totality. Who would want to fight, who would want to win? Waking, dreaming, and
  profound sleep are united by the absence of contradictory truths. Everything is
  true, everything is illusory, everything is real. This reality encompasses the material
  and the immaterial, the movable and the immovable. Consciousness is the river of
  unity; there is no longer any division in the yogini and yogin’s life. One neither
  looks elsewhere for nonconceptual mind Nor searches for its natural qualities
voice_of_siva: ''
abhyasa: 'Before sleep and upon waking, pause for 30 seconds and ask: what is unchanged
  across waking, dream, and sleep? Rest in that recognition.'
