sutra_id: SP_17
sutra: '17'
title: The awakened tantrika realizes this continuous sacred tremor throughout the three states.
collection: Yoga Spandakarika
section: Second Flow
sanskrit: ''
transliteration: ''
translation: The awakened tantrika realizes this continuous sacred tremor throughout the three states.
commentary: The Ultimate Path is simple and easy—it is just a matter simply of whether you abandon things or pursue them. Those who would experience the Path should think deeply on this. The three states that stanza 17 speaks of are waking, dreaming, and deep sleep. It is very often said that deep sleep is a state of nonconsciousness. But long before any research was done on dreams and sleep, the tantrikas always said that once sacred tremor occurs, consciousness pervades deep sleep as well. There is no more interruption, and the continued stream of consciousness pervades absolutely everything that we live. The sacred tremoring does not cease, even for a single moment. The power of the Shakti subsists through the three states and continually infuses the feeling of being alive. Dreams are very important in the Tantric quest, as they are the prelude to the teachings that one receives directly in the form of dreams. It is a surprising moment in the relationship with our master when suddenly
  we begin not only to dream about him, but to receive his teachings in dreams. Dreams are the love chamber of the master and disciple. This sudden incandescence of dreams always comes when practice is intense. We even have the impression that we are dreaming the whole night through. Upon waking, we are tired, because an evacuation has taken place during these dreams, allowing buried issues to emerge.
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute in the felt sense of simple presence.
