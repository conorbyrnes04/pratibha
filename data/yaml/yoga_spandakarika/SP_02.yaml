resonances:
- citation: Pratyabhijnahrdayam — Sutra 7
  resonance: 'Both texts posit a singular, formless source that paradoxically generates infinite differentiation: the Spandakarika''s ''limitless'' tremor contains all creation within formlessness, while Pratyabhijnahrdayam''s One Supreme Self becomes multiple (double, triple, fourfold, etc.) without losing unity.'
  divergence: Spandakarika emphasizes the *vibration* or *pulsation* (spanda) as the generative mechanism, whereas Pratyabhijnahrdayam stresses *recognition* (pratyabhijna) of the Self's inherent power of manifestation as the philosophical framework.
  passage_id: pratyabhijnahrdayam.phr_007
- citation: Patañjali Yoga Sūtras 4.34
  resonance: 'Both describe liberation as a return to formless independence: the Spandakarika''s ''completely limitless'' nature mirrors Patañjali''s supreme state where consciousness settles ''in its own pure nature'' after the guṇas dissolve, each marking freedom as reversion to undifferentiated essence.'
  divergence: Spandakarika locates this freedom within the creative tremor itself (non-dual), while Patañjali's Yoga posits a dualism where Purusha's independence requires separation from Prakṛti's qualities.
  passage_id: patañjali_yoga_sūtras.ys_4_34
- citation: Tao Te Ching — The Unnamed Way
  resonance: 'Both identify the ultimate reality as formless and beyond naming: the Spandakarika''s tremor is ''formless'' and the source of all form, paralleling the Tao Te Ching''s Way (dào) which ''has no name'' yet generates the named world.'
  divergence: Spandakarika frames formlessness as dynamic creative vibration rooted in consciousness, while Tao Te Ching presents it as a non-conscious, impersonal principle of natural process.
  passage_id: tao_te_ching.ttc_md_041
