title: The sacred tremor, the very place of creation and return, is completely limitless
  becau...
collection: Yoga Spandakarika
section: First Flow
sanskrit: ''
transliteration: ''
translation: The sacred tremor, the very place of creation and return, is completely
  limitless because its nature is formless.
commentary: The most majestic tree is contained within a tiny seed. Similarly, the
  Self, the heart revealed by the sacred tremor, possesses the capacity to be the
  universal seed. All the worlds reside in the kernel of the heart. The heart is limitless
  and, as it has no form, it can contain totality. When, to us, things seem to be
  exterior, this is because the heart is still deaf to limitlessness. If the world
  were not within us, from where would it emerge, in what place would it be dissolved?
  The sacred tremor is completely limitless because its form is so fleeting that we
  cannot apprehend it. Nothing can keep the yogini and the yogin from experiencing
  this on their own. Once a person becomes peaceful, her unlimited nature emerges,
  and the whole cosmos recognizes her. There are no ties other than the differentiating
  constructions of thought. Return to the source, and you will find the sacred tremor
  of absolute freedom.
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
