translation: The venerated Shankari (Shakti), source of energy, opens her eyes and the universe is reabsorbed in pure consciousness; she closes them and the universe is manifested within her.
commentary: 'The Shakti is one with Shiva; the teaching is the joyous issue of their union. Whether she appears or withdraws, the Shakti escapes from the succession of time. In her breast, in the form of Kali, she does away with space-time. It is the relation of impassioned worship with the divinity or the guru that feeds our own divinity and allows us, through the mirror of this passion, to discover fundamental freedom. The eyes open in Bhairavimudra, turned inward, without blinking, and the world is reabsorbed in pure consciousness. The eyes close, the world appears within us, for when mastery of this mudra is achieved, we are the divinity. From now on, there is no longer inner and outer, but rather, totality bathed by omnipresent consciousness. This is the secret kept by the Great Seal, the Great Cosmic Movement, the Great Configuration of the cosmos, one of the thousand names of Kali: Mahamudra. This teaching flows from the Ocean of Consciousness; it is the heart of the yoginis. Physical
  and mental contraction obscures perception of our innate nature and gives rise to duality. The yogin and yogini experience the nondifferentiation of states, the pure consciousness of the “I.” Consciousness gleams. It cannot be said that Shankari inhales or that she exhales. The senses are the wheel of energies, the freedom of their expressions, the creativity of consciousness. Shiva/Shakti express themselves through play and creativity in absolute consciousness. They do not have plans for the creation that emanates from them, any more than a musician has plans for the sounds that emanate from his consciousness and then from his instrument in an infinite wave. If people enter into resonance, it is because divine consciousness, the musician’s consciousness, and the listener’s consciousness are...'
