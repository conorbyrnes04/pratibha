collection: Yoga Spandakarika
section: Third Flow
sanskrit: ''
transliteration: ''
translation: If the body/mind is ravaged by discouragement due to ignorance, only
  the completely unlimited expansion of consciousness will dissipate a lassitude whose
  source will then have disappeared.
commentary: 'Man endlessly crosses the deserts looking for his eyes outside of his
  head. He sees the mountains and the lakes, the rivers and the forests, the shimmering
  light, the celestial canopy and the blue sky, the stars and the Milky Way; but,
  not finding his eyes, he grows weary. He is overcome with fatigue. He ends up losing
  his sight. Suddenly, he can no longer see anything and, in this very darkness, he
  realizes that the mountains and the rivers, the sky and space are in his own heart.
  When he opens his eyes again, he sees that all that previously seemed outside of
  him now shimmers and vibrates in his own heart. He is overcome with joy. Finally,
  he sees. Yuanwu explains Mahamudra in his letter entitled “The Secret Seal”: In
  essence, you cannot find where this one comes from: it’s called the fundamental
  matter that is inherent in everyone. As soon as you deliberately intend to accept
  it or take it up, this is already not the fundamental anymore. Just get the myriad
  impulses to cease, so even the thousand sages do not accompany you—then how could
  there still be any dependency?'
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
