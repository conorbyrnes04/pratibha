sutra_id: SP_43
sutra: '43'
title: When the tantrika pervades everything with his absolute desire, what use are words?
collection: Yoga Spandakarika
section: Third Flow
sanskrit: ''
transliteration: ''
translation: When the tantrika pervades everything with his absolute desire, what use are words? He has this experience on his own.
commentary: Finally, silence settles in, the yogin and yogini reside there, and desire palpitates within like the energy of love. Everything manifested comes rushing into the heart of those who are inhabited by this absolute desire. Rain and snow fall in the heart, the sun and the moon make their way across the heart, rainbows unfurl in the limitless space of the body. The Real cannot be compared to anything since it is absolute. The throne of awakening is joy that takes pleasure in the Real. Awakening is the result because one keeps oneself at the summit of the Real. What use are words? The energy of sounds and language are related to the garland of letters. The yoga of the garland of letters is a very interesting practice. Abhinavagupta wrote a whole text on this subject and said that making use of it consists of deconstructing language. There also exists a Tantra that is wholly dedicated to the garland of letters. It is a minuscule, meticulous study of what happens through language, of
  the how and the why of our connection to words, of how the mind works with images and the words we use.
voice_of_siva: ''
abhyasa: For 3 minutes, watch inner speech without suppressing it. Each time words arise, return to the silent awareness that knows the words.
