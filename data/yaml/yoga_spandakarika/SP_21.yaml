resonances:
- citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
  resonance: Both texts locate realization not in withdrawal from activity but in sustained attentional return *within* ongoing engagement—the Spandakarika through 'fieriness' tending toward tremor amid activity, the Gita through iterative yoga-mastery that repeatedly gathers dispersed attention back to center.
  divergence: The Spandakarika emphasizes a sacred tremor (spanda) as the vehicle of recognition, while the Gita frames the work as disciplined habituation and mental regulation—one mystical, one methodological.
  passage_id: bhagavad_gita.bg_06_26
- citation: Tao Te Ching — The Sage’s Unfixed Mind
  resonance: 'Both reject a fixed, individual will as the locus of truth: the Spandakarika''s ''true nature'' emerges through surrender to the profound tremor rather than ego-driven action, and the Taoist sage abandons his ''invariable mind'' to become transparent to the people''s mind.'
  divergence: The Spandakarika grounds this surrender in a cosmic sacred vibration (spanda), while the Tao Te Ching grounds it in responsive emptiness and non-action (wu wei)—one theistic-mystical, one naturalistic-cosmological.
  passage_id: tao_te_ching.ttc_md_054
