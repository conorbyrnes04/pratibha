translation: But if he is not present, the tantrika will be wronged by the play of manifestation, and he will experience the illusory state of the aspirant throughout waking and sleeping.
commentary: Absence from the world is almost the same as presence. The only difference is that the divine game seems like fate, whereas the yogin and the yogini, made alert by the extreme sensitivity of their bodies, taste each emergence as an offering that Shiva/Shakti make to the worshipper of their own immaculate essence. Those who realize the awakening of Chan transcend subject and object. Besides this, there is no other mysterious principle. When we have reached the sphere of ecstatic presence, we will see it like a somewhat magical state, and we will tend to use it like a drug. In other words, lulled within this state of happiness, our presence will diminish, and we will quickly come to live in a false kind of wonderment, as if it were caused by some drug. Extraordinary or magical occurrences will take place, but we will not have this profound presence, this sharpness. We will fall victim to an illusion. This is why the Ch’an master Yuanwu advised his disciples to dispose of marvels
  and mysteries like so much garbage, and why Devi found the yogins or the masters who performed “miracles” extremely vulgar. As marvelous as they might be, they are only obstacles on the path.
voice_of_siva: ''
abhyasa: For 3 minutes, watch inner speech without suppressing it. Each time words arise, return to the silent awareness that knows the words.
