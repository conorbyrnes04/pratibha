resonances:
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: Both texts assert that the ultimate state (Mahāmudrā/recognition of the heart) cannot be grasped through ordinary conceptual mind or symbolic pointing—it is a direct non-objective realization that transcends the subject-object divide.
  divergence: Tilopa emphasizes the apophatic impossibility of representation, while the Spandakarika grounds omniscience and harmony in positive recognition of the heart as the source itself.
  passage_id: tilopa_mahamudra.til_001
- citation: Pratyabhijnahrdayam — Sutra 13
  resonance: 'Both passages identify recognition (pratyabhijñā/recognition of the heart) as the pivotal move: when one recognizes one''s own authorship or the heart''s nature, consciousness itself becomes the operative principle, collapsing the distinction between knower and known.'
  divergence: Pratyabhijnahrdayam emphasizes recognition of authorship and identity with Consciousness through introversion, while Spandakarika emphasizes the heart's recognition as the sole support yielding omniscience and worldly harmony.
  passage_id: pratyabhijnahrdayam.phr_013
- citation: Tantrasara — The One for Whom No Means Is Needed
  resonance: 'Both texts invoke a ''no-method'' or pathless approach: the Spandakarika''s ''only support'' of heart-recognition and Abhinavagupta''s Anupāya both point to a direct, non-mediated access to the ultimate that requires no intermediate technique or scaffolding.'
  divergence: Anupāya is explicitly framed as methodlessness for the advanced practitioner, while Spandakarika presents heart-recognition as the singular support itself, implicitly available to the tantrika.
  passage_id: tantrasara.ts_008
