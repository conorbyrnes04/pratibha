resonances:
- citation: Patañjali Yoga Sūtras 4.34
  resonance: Both texts describe liberation as a spontaneous settling into one's own nature once the machinery of bondage (guṇas/manifestation-return cycle) dissolves. The Spandakarika's 'absolute freedom spontaneously gushes forth' mirrors the Yoga Sūtra's 'power of pure consciousness settles in its own pure nature'—freedom emerges not through effort but through cessation of what obscured it.
  divergence: The Yoga Sūtra frames this as Purusha's withdrawal from Prakṛti (dualistic separation), while Spandakarika frames it as the tantrika's embodied mastery of the tremor itself (non-dual participation in Śakti's play).
  passage_id: patañjali_yoga_sūtras.ys_4_34
- citation: Bhagavad Gita — Yajna as the Ecology of Action
  resonance: Both texts locate liberation within action itself rather than through renunciation of action. The Spandakarika's tantrika 'liberates the flow of manifestation and return' and becomes 'master of the wheel of energies' structurally parallels the Gita's teaching that action becomes liberative when reframed as participation in a larger order rather than private consumption.
  divergence: The Gita emphasizes ethical reorientation through yajna (reciprocal duty), while Spandakarika emphasizes ontological reorientation through direct recognition of Śakti's tremor as the ground of all action.
  passage_id: bhagavad_gita.bg_03_09
