sanskrit: ''
transliteration: ''
translation: The whole palette of the different kinds of sacred tremoring finds its source in the universal sacred tremor of consciousness, and in this way reaches the person. How could such a sacred tremoring limit the tantrika?
commentary: To realize Spanda is to absorb the unlimited completely. Then all sounds are united in silence, all colors in the nature of space, all the masses of matter in the infinite fluidity. The power that resides in the Heart of Consciousness is freedom. This Heart is called the resting place of the immaculate light, and pure Consciousness is not different from all the parts of the body. The sound palette shows very well the idea of the vibration of strings, of skin stretched over a resonance chamber. Indeed, tantrikas are similar to musical instruments. Once they start resonating, whether they are “played” by their master or by life, reality, confusion, suffering, chaos, or space, something produces unending music. At this point, they realize that the sacred tremor is not merely a kind of vibration, a repetitive sensation; on the contrary, it is a limitless feeling with a range so rich that they can have all sorts of different experiences. The tantrikas taste a tremor that is barely
  perceptible, an inexhaustible gamut of possibilities, like the infinity of sounds that one can bring out of a real instrument. The tantrikas feel all this.
voice_of_siva: ''
abhyasa: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness before naming it.
