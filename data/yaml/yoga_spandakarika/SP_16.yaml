resonances:
- citation: 'Vijnana Bhairava — Yukti #106'
  resonance: 'Both texts pause conceptual elaboration to let a paradox disclose itself directly: the Spandakarika invites interpretive suspension to allow insight to emerge; Vijnana Bhairava poses an aporia (How can the unchanging Self be the locus of action?) that dissolves only through non-dual recognition rather than logical resolution.'
  divergence: The Spandakarika suspends interpretation to access the vibration (spanda) of consciousness-in-action; Vijnana Bhairava uses the paradox as a gateway to recognize the Self's transcendence of subject-object duality, emphasizing non-dual awareness over dynamic participation.
  passage_id: vijnana_bhairava.yukti_106
- citation: 'Phaedo (Plato) — The Second Sailing: Forms as True Causes'
  resonance: 'Both texts enact a methodological reversal: Socrates abandons sensory-physical explanation for intelligible causes; the Spandakarika asks the reader to abandon discursive interpretation and allow direct disclosure—both move from mediated knowledge to immediate apprehension.'
  divergence: Plato's second sailing ascends to transcendent Forms outside the flux of becoming; the Spandakarika's pause discloses the spanda (pulsation) within action itself, grounding insight in immanent dynamism rather than transcendent intelligibility.
  passage_id: phaedo_plato.phaedo_md_005
