translation: When the tantrika gives himself over to Shiva/Shakti, the sun and the moon come up in the central channel.
commentary: When freedom expresses itself through everything that emerges, the yogi and the yogini allow themselves to be carried by the dynamic of the totality. Everything is accomplished by this absence of choice; light and infinite, they give themselves over completely to Shiva/Shakti because they have recognized that they are Shiva/Shakti. In this abandonment of all personal dynamic, the infinite emerges. The central canal is the whole cosmos and is found both in the infinite body and in the physical body. All activity deliberated by the mind is activity of limited consciousness. How would that make it possible to see in our own nature? In Tantric iconography, the sun and the moon symbolize the breath. The central channel is the inner canal in which the kundalini rises. It is through the breath that the whole process of yoga begins working. The sun and the moon are simply the breath and the stopping of the breath. These two sequences eventually become just one, and suddenly the person
  is unified and can feel the central canal intensely. Through spatiality and freedom, this canal and the chakras begin working; but the originality of the Pratyabhijna and Spanda streams is to let the subtle energy happen rather than to force it or condition it by a specific yoga. All the practices of Matsyendranath and the Vijnanabhairava Tantra will, in the end, have the effect, through their diversity and their harmony, of sensitizing the subtle body. But there is no romanticism about activating, no directed effort for stimulating or opening. Abhinavagupta even said that pranayama was dangerous and not useful. This approach is very close to Ch’an, which avoids all the obsessions and the dreams of power developed by practices that are designed to gain us access to siddhi . Everything emerges s...
