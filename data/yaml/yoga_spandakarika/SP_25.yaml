translation: At that moment, when in the sky the sun and the moon disappear, the awakened person remains lucid, whereas the ordinary person sinks into unconsciousness.
commentary: When consciousness reveals itself to the unconscious person whose actions are automatic and whose distraction from the source is permanent, there no longer exists a division between the states. The sun and the moon suddenly appear in the space of the infinite body of the yogi and the yogini. Water it with the water of worship In the fullness of the action.
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute in the felt sense of simple presence.
