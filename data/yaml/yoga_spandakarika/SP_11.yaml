collection: Yoga Spandakarika
section: First Flow
sanskrit: ''
transliteration: ''
translation: 'considers the subject of transmigration—which occurs occasionally in
  the Tantric texts—and asks clearly: “How can a wonder-filled tantrika be subject
  to transmigration?” Does this mean that those who are not wonder-filled are subject
  to transmigration? No, this is a Tantric mystery. At times it is said that there
  is transmigration; other times it is said that the idea of transmigration is a “hitching
  post for asses” (Abhinavagupta). Do not count on me to tell you!'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a
  moment and let the insight disclose itself directly.'
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
