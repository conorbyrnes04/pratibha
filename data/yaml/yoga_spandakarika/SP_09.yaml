resonances:
- citation: 'Vijnana Bhairava — Yukti #56'
  resonance: Both texts prescribe a method of sustained, unmediated perception—gazing at sky or pausing interpretation—where insight arises spontaneously when the interpretive mind ceases. The recognition discloses itself through stillness, not through conceptual effort.
  divergence: Vijnana Bhairava locates the disclosure in an external object (sky) and names the result as Bhairava-form; Spandakarika suspends all objects and points to silence itself as the medium of recognition.
  passage_id: vijnana_bhairava.yukti_056
- citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
  resonance: Both texts refuse symbolic or conceptual mediation as a path to realization. The target's instruction to 'pause interpretation' structurally mirrors Tilopa's assertion that Mahāmudrā cannot be grasped as an object of thought—both negate the ordinary mind's representational apparatus.
  divergence: Spandakarika emphasizes direct disclosure through silence; Tilopa emphasizes the impossibility of conceptual capture, leaving the positive nature of realization implicit rather than pointing to spontaneous awareness.
  passage_id: tilopa_mahamudra.til_001
- citation: Mandukya Upanishad and Gaudapada Karika — Verse 5 · Suṣupti — Deep Sleep
  resonance: Both passages point to a state of consciousness where ordinary mental activity (desire, dream, interpretation) ceases, and a non-dual awareness remains. The recognition arises in the absence of the subject-object divide.
  divergence: Mandukya locates this state in deep sleep as a natural condition; Spandakarika cultivates it through deliberate pause and recognition, making it an active contemplative achievement rather than a passive natural state.
  passage_id: mandukya_upanishad_and_gaudapada_karika.muk_007
