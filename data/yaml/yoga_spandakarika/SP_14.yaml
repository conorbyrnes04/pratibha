sutra: '14'
title: Actor and action are united, but when action is dissolved by abandoning the
  fruits of t...
collection: Yoga Spandakarika
section: First Flow
sanskrit: ''
transliteration: ''
translation: Actor and action are united, but when action is dissolved by abandoning
  the fruits of the act, the very dynamic that is tied to the ego exhausts itself,
  and the tantrika who is absorbed in this profound contemplation discovers the divine
  tremor liberated from its ties to the ego. The profound nature of action is thus
  revealed, and he who has interiorized the movement of desire no longer knows dissolution.
  He cannot cease to exist because he has returned to the profound source.
commentary: 'Thus, in this great unity, everything touches everything else. A world,
  a movement of the body, where emotions pour out from the infinite, navigate through
  the infinite, end in the infinite, only to give rise to another movement. Act and
  actor, subject and object, perception and perceiver are united. This is the realization
  of Mahamudra. All actions are like a feather floating at the will of the breeze
  in a parade of mountains. They never cease crossing the sky. At the profound source,
  everything rediscovers the nature of space. Mahasitha Shang specified that aspirants
  on this path should behave as follows: A wounded deer shuns companions and shows
  no interest in anything else. Thus a meditator should live by himself, not depending
  on friends, and should abandon any material aims for this life, aims that would
  help vanquish his enemies, protect his friends, and flatter his benefactors.'
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
