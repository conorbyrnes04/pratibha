resonances:
- citation: Patañjali Yoga Sūtras 4.30
  resonance: 'Both texts describe a cessation mechanism: the Spandakarika dissolves action by abandoning fruit-attachment, which exhausts ego-tied dynamism; Patañjali 4.30 states that from samādhi, afflictions and karmic actions cease. Each posits that a specific contemplative state or reorientation terminates the generative cycle of action-and-consequence.'
  divergence: The Spandakarika locates liberation in the *recognition* of divine tremor freed from ego-binding within action itself; Patañjali locates it in the *transcendence* of action through samādhi as a state of consciousness separate from the karmic field.
  passage_id: patañjali_yoga_sūtras.ys_4_30
- citation: Nagarjuna Mulamadhyamakakarika — Liberation as the Stilling of Fabrication
  resonance: 'Both texts identify liberation as the exhaustion of a dual engine: the Spandakarika describes the ego-tied dynamic exhausting itself when fruit-attachment is abandoned; Nagarjuna states mokṣa occurs when karma and afflictions (kleśa) run out. Each treats liberation as the natural cessation of a self-perpetuating mechanism rather than an external intervention.'
  divergence: The Spandakarika emphasizes the *unity* of actor and action persisting even as ego-binding dissolves, revealing divine tremor; Nagarjuna emphasizes the *emptiness* of all fabrications, with no residual divine or transcendent ground remaining.
  passage_id: nagarjuna_mulamadhyamakakarika.mmk_18_05
- citation: The Book of Chuang Tzu — chapter 3
  resonance: 'Both texts describe action perfected through the dissolution of deliberate ego-will: Cook Ding''s blade never dulls because his skill has ripened into non-forcing, where the distinction between actor and action vanishes; the Spandakarika''s tantrika discovers divine tremor when ego-attachment to action dissolves. Each shows mastery emerging from the surrender of willful control.'
  divergence: Cook Ding's non-action (wu-wei) is pragmatic and immanent—skill perfected within the natural grain of things; the Spandakarika's liberation is metaphysical and transcendent—ego-dissolution revealing the divine tremor underlying all action.
  passage_id: the_book_of_chuang_tzu.ctz_003
