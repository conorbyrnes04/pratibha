sutra: '8'
title: Therefore, the person who rediscovers this essential sacred tremor of consciousness
  esc...
collection: Yoga Spandakarika
section: First Flow
sanskrit: ''
transliteration: ''
translation: Therefore, the person who rediscovers this essential sacred tremor of
  consciousness escapes the dim confusion of limited desire. Liberated in this way
  from the multiplicity of impulses tied to the ego, he experiences the supreme state.
commentary: Desire, liberated from its ties to the ego, realizes that it has no other
  aspiration than the fullness of Mahamudra and, as it sees in the same impulse that
  this plenitude is innate and limitless, it no longer aspires to any realization
  whatsoever. There is no longer anything but intimate vibration, continuous sacred
  tremoring, and the absence of localization in time and space. This is the integration
  of Mahamudra. Right from the start, situate yourself outside of spiritual progression,
  Outside of meditation on the divinities,
voice_of_siva: ''
abhyasa: Close the eyes for 2 minutes and release all labels. Repeatedly return to
  the immediate sense 'I am aware' without adding any story.
