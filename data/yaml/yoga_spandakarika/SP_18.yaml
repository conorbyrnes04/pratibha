resonances:
- citation: Tantrasara — The Heart Born of the Divine Pair
  resonance: Both texts locate the foundational reality in the union of Śakti and Śiva as the originary embrace—the Spandakarika describes this union as the ground where knowledge and object merge, while Tantrasāra opens at this same embrace as 'the only true beginning.' Both treat the dyad as the structural principle from which manifestation unfolds.
  divergence: The Spandakarika emphasizes the continuity of consciousness through this union (no break in awareness), whereas Tantrasāra treats the embrace as a cosmological opening point; the Spandakarika is phenomenological, Tantrasāra is metaphysical.
  passage_id: tantrasara.ts_001
- citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 4
  resonance: 'Both texts describe a mode of awareness that transcends the subject-object duality of ordinary knowledge: the Spandakarika''s union where knowledge and its object dissolve into pure consciousness parallels Plotinus''s ''awareness of the ultimate Principle'' that ''surpasses the multiplicity of knowing.'' Both posit a presence beyond the knower-known structure.'
  divergence: The Spandakarika grounds this transcendence in Śakti-Śiva union (non-dual embodied principle), while Plotinus locates it in the One beyond intellection (transcendent and singular); the former is relational, the latter is radically singular.
  passage_id: plotinus_enneads.enn_vi_9_04
- citation: Astavakra Gita — Verse 1.12
  resonance: 'Both describe consciousness as a witnessing principle that remains unchanged and unbroken through all states: the Spandakarika''s ''no break in consciousness'' as the tantrika moves between states mirrors the Astavakra''s Self as ''witness, all-pervading...inactive.'' Both preserve a continuous, non-acting awareness beneath phenomenal flux.'
  divergence: The Spandakarika emphasizes the dynamic union of Śakti-Śiva within that witness-consciousness, while Astavakra emphasizes the Self's absolute inactivity and freedom from all manifestation; one is relational-dynamic, the other is purely witnessing-static.
  passage_id: astavakra_gita.asg_1_12
