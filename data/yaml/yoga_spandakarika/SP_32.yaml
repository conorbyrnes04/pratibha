resonances:
- citation: 'Vijnana Bhairava — Yukti #9'
  resonance: Both texts prescribe a disciplined inward attention (eyes closed or open without blinking) directed into cranial/bodily space as the method for perceiving transcendent reality. The body becomes the vessel through which ineffable consciousness is accessed via concentrated gaze.
  divergence: The Spandakarika emphasizes eyes-open receptivity to space-as-fertile-chaos with divine presences; the Vijnana Bhairava uses eyes-closed internal focus on the cranium as a more austere, interiorized technique for perception.
  passage_id: vijnana_bhairava.yukti_009
- citation: Tilopa Mahamudra — Mind Is Like the Open Sky
  resonance: Both texts use spatial metaphor—open space, sky, boundlessness—to describe the nature of mind itself when thought ceases. The mind is not a container but a dimensionless expanse that cannot be circumscribed or located.
  divergence: The Spandakarika grounds this boundlessness in the body's 'open space' as a lived, embodied experience; Tilopa's Mahamudra treats mind-as-sky as a purely metaphysical principle independent of somatic location.
  passage_id: tilopa_mahamudra.til_002
- citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
  resonance: Both texts frame the attainment of samadhi/yoga-mastery as iterative return of attention rather than sudden breakthrough—a repeated discipline of steadying the mind and drawing it back from dispersion to center.
  divergence: The Spandakarika emphasizes the revelation of one's own nature through this process; the Bhagavad Gita frames it as a practical mastery of body and habit without metaphysical claims about self-revelation.
  passage_id: bhagavad_gita.bg_06_26
