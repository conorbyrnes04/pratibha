sutra_id: SP_32
sutra: '32'
title: This is the attainment of the supreme nectar, the immortality of samadhi, which
  reveals...
collection: Yoga Spandakarika
section: Third Flow
sanskrit: ''
transliteration: ''
translation: This is the attainment of the supreme nectar, the immortality of samadhi,
  which reveals to the tantrika his own nature.
commentary: 'Eyes open on space, without blinking, the body relaxed, thought at rest,
  there no longer exists anything but ineffable reality flowing in the open space
  of our body, a vast mass grave where fertile chaos decomposes, where the yogin and
  the yogini love to stroll, their reflections crisscrossing: gods and goddesses,
  dakinis and dakas, dancing in the sky. No hope, no needs, nothing lacking, No projection,
  no expectations, no personal history,'
voice_of_siva: ''
abhyasa: Read the stanza slowly three times. Keep one line in attention through the
  day, and return to it whenever the mind contracts.
