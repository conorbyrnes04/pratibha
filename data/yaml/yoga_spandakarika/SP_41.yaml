sutra_id: SP_41
sutra: '41'
title: The revelation of the Self arises in the person who is now only absolute desire.
collection: Yoga Spandakarika
section: Third Flow
sanskrit: ''
transliteration: ''
translation: The revelation of the Self arises in the person who is now only absolute
  desire. May each of us have this experience!
commentary: Thus is born absolute desire, the intuitive sense of the energy of love,
  the passionate worship of the real. The worshipper finally finds the treasure in
  her own dwelling place. The Ruby of the Heart was so close that, by turning her
  gaze toward herself, she finally sees it. This realization does not require a gradual
  path, an apprenticeship, the usage of forms and rituals, yoga, and asceticism. Only
  absolute desire is indispensable, the inward gaze. There is no place that is not
  the Way! Those who preceded us taught that we end desire by practicing detachment.
  We teach that this can be attained by abstaining from all effort.
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
