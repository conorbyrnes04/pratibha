resonances:
- citation: Patañjali Yoga Sūtras 1.20
  resonance: 'Both texts posit that crossing a threshold of doubt or confusion requires a prior condition—faith and energy in Patañjali, the master''s tremoring words in Spandakarika—that precedes and enables the realization of true nature. The structure is: prerequisite catalyst → samadhi/knowledge.'
  divergence: Patañjali emphasizes internal psychological faculties (faith, energy) as the prerequisite, while Spandakarika locates the catalyst in transmitted wisdom from a master, making the path relational rather than intrapsychic.
  passage_id: patañjali_yoga_sūtras.ys_1_20
- citation: Vijnana Bhairava — The Bindu of Subtle Fire at the Radiant Abode
  resonance: Both texts lodge transformative knowledge in the heart as a subtle, luminous point of dissolution—the jewel of knowledge kept in the deepest heart (Spandakarika) parallels the Bindu dissolving into pure Presence when meditated upon in the heart (Vijnana Bhairava). Knowledge and presence converge at the cardiac center.
  divergence: Spandakarika emphasizes the jewel as a conceptual or transmitted teaching held in the heart, while Vijnana Bhairava prescribes a specific meditative technique on the subtle fire-point itself, making one textual and the other procedural.
  passage_id: vijnana_bhairava.yukti_012
- citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.7
  resonance: 'Both passages describe a state of knowledge or realization characterized by freedom from doubt and mental turbulence—the Self free from confusion and desire (Chandogya) mirrors crossing the Ocean of doubt to reach true nature (Spandakarika). The move is: knowledge = liberation from mental obstruction.'
  divergence: Chandogya frames this as the eternal, unchanging nature of the Self itself, while Spandakarika frames it as an achievement reached through the master's teaching, making one metaphysical and the other pedagogical.
  passage_id: chāndogya_upaniṣad.chu_viii_07
