sutra_id: SP_46
sutra: '46'
title: Caught in the field of subtle energies and mental representations, the supreme
  ambrosia...
collection: Yoga Spandakarika
section: Third Flow
sanskrit: ''
transliteration: ''
translation: Caught in the field of subtle energies and mental representations, the
  supreme ambrosia is dissolved, and the person forgets his innate freedom.
commentary: The power of the word is always ready to veil the profound nature of the
  Self because no mental representation can free itself from language. The energy
  of the sacred tremor that passes through the vulgar person enslaves him, whereas
  this same energy liberates the person who is on the path. When we direct our powerfulness
  outwardly, we fall into the nets of mental representations, we create limited objectives,
  and then we seek to attain them—thereby losing the memory itself of original completeness.
  Words, teachings, viewpoints, all come along to enchain us always more tightly to
  the limited. Everything is adulterated by the mental processes, which instantaneously
  transform the absolute teaching into an object to be seized. And the teaching of
  Mahamudra cannot be seized; it can only emerge from our own heart in the grace and
  the lightness of total abandon.
voice_of_siva: ''
abhyasa: Choose one ordinary action today and perform it fully without seeking an
  outcome. Afterward, rest for one minute in the felt sense of simple presence.
