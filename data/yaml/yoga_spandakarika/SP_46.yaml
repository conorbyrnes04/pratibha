- citation: Pratyabhijnahrdayam — Sutra 12
  resonance: 'Both texts locate bondage in a forgetting of one''s own authorial power: the Spandakarika shows the Self forgetting its innate freedom when caught in mental representations, while the Pratyabhijnahrdayam identifies transmigration as bewilderment by one''s own powers through ignorance of one''s authorship of the fivefold act. Each describes a self-imposed veiling of agency.'
  divergence: The Spandakarika emphasizes the entanglement in subtle energies and language as the mechanism of forgetting, while Pratyabhijnahrdayam frames it as ignorance of one's role as the author of cosmic manifestation itself—a metaphysical rather than phenomenological account.
  passage_id: pratyabhijnahrdayam.phr_012
- citation: Astavakra Gita — Verse 2.7
  resonance: Both texts identify bondage as a condition of mental reactivity—the Spandakarika shows freedom lost through capture in mental representations, while the Astavakra Gita defines bondage as the mind's oscillation between desire, grief, grasping, and anger. Each locates the binding mechanism in the mind's entanglement with its own movements.
  divergence: The Spandakarika emphasizes the role of subtle energies and language in veiling the Self's nature, whereas the Astavakra Gita treats bondage as purely a function of mental states independent of energetic or linguistic mediation.
  passage_id: astavakra_gita.asg_2_7
