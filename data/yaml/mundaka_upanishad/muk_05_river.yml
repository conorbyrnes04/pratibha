sutra_id: MUK_05_RIVER
collection: Mundaka Upanishad
section: Muṇḍaka 3.2.8
title: As Rivers Flow into the Sea
sanskrit: यथा नद्यस् स्यन्दमानास् समुद्रे ऽस्तं गच्छन्ति नामरूपे विहाय
transliteration: yathā nadyas syandamānās samudre 'staṃ gacchanti nāmarūpe vihāya
translation: As the flowing rivers disappear in the sea, losing their name and form, so a wise man, freed
  from name and form, goes to the divine Person who is beyond all.
commentary: '«As Rivers Flow into the Sea» is one of Muṇḍaka''s structural images for liberation: knowledge
  splits into lower and higher, and the Self is released from fruitional entanglement. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of
  ordinary life. This is the demand of a living tradition: insight without application remains incomplete.
  Return again to the original wording when the mind wants to smooth the edge. Return again to the original
  wording when the mind wants to smooth the edge.'
abhyasa: Today, notice one 'sweet fruit' of experience you are busy eating, and one moment of sheer witnessing
  without consumption.
themes:
- knowledge
- self
- freedom
- attention
- desire
