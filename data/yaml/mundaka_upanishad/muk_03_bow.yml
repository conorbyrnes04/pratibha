sutra_id: MUK_03_BOW
collection: Mundaka Upanishad
section: Muṇḍaka 2.2.3–2.2.4
title: Om as the Bow, Self as the Arrow
sanskrit: प्रणवो धनुः शरो ह्य् आत्मा ब्रह्म तल्लक्ष्यम् उच्यते / अप्रमत्तेन वेद्धव्यं शरवत् तन्मयो भवेत्
transliteration: praṇavo dhanuḥ śaro hy ātmā brahma tallakṣyam ucyate / apramattena veddhavyaṃ śaravat
  tanmayo bhavet
translation: Om is the bow, the Self is the arrow, Brahman is said to be the mark. It is to be struck
  by an undistracted mind. Then one becomes united with Brahman, as the arrow with the target.
commentary: '«Om as the Bow, Self as the Arrow» is one of Muṇḍaka''s structural images for liberation:
  knowledge splits into lower and higher, and the Self is released from fruitional entanglement. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.'
abhyasa: Today, notice one 'sweet fruit' of experience you are busy eating, and one moment of sheer witnessing
  without consumption.
themes:
- knowledge
- self
- freedom
- attention
- desire
