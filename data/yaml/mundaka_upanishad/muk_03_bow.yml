sutra_id: MUK_03_BOW
collection: Mundaka Upanishad
section: Muṇḍaka 2.2.3–2.2.4
title: Om as the Bow, Self as the Arrow
sanskrit: प्रणवो धनुः शरो ह्य् आत्मा ब्रह्म तल्लक्ष्यम् उच्यते / अप्रमत्तेन वेद्धव्यं शरवत् तन्मयो भवेत्
transliteration: praṇavo dhanuḥ śaro hy ātmā brahma tallakṣyam ucyate / apramattena veddhavyaṃ śaravat
  tanmayo bhavet
translation: Om is the bow, the Self is the arrow, Brahman is said to be the mark. It is to be struck
  by an undistracted mind. Then one becomes united with Brahman, as the arrow with the target.
commentary: 'The passage constructs liberation as precision—not as dissolution but as *hitting*. Om (प्रणव,
  pranava) functions as the bow''s frame, the resonant structure that holds tension. The Self (आत्मा,
  ātmā) is not the archer but the arrow itself: the very instrument of knowledge, stripped of its sense
  of separation, moving toward its target. Brahman is the mark (लक्ष्यम्, lakṣyam)—not distant, not abstract,
  but the only thing worth striking. The image refuses passivity. It demands अप्रमत्तेन (apramattena)—not
  relaxation but *undistracted intensity*, the bowstring''s full draw. The final phrase—शरवत् तन्मयो भवेत्
  (śaravat tanmayo bhavet), *as the arrow becomes one with its target*—reveals the real move: there is
  no separate striker. The archer, bow, arrow, and mark collapse into a single act of arrival. The knower
  does not *reach* Brahman; the knowing-instrument becomes indistinguishable from what it knows. This
  is not metaphor for effort; it is the structure of how ignorance dissolves—not through relaxation but
  through the Self''s own momentum toward its non-dual source, guided by the resonance of Om.'
abhyasa: 'Speak or silently sound Om three times, each time narrowing your attention as if drawing a bow—first
  sound loose and wide, second tighter, third so concentrated it becomes a single point of vibration at
  the soft palate. After the third, hold the silence and notice: does the sense of ''you'' observing persist,
  or has the distinction between observer and the vibration itself dissolved? Do not try to make it dissolve.
  Simply mark whether separation is still operating.'
themes:
- non-duality through precision
- om as structural resonance
- arrow and target collapse
- undistracted intensity
- self as instrument not agent
- brahman as mark not destination
