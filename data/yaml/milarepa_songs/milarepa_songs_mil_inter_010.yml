sutra_id: MIL_INTER_010
collection: Milarepa Songs
section: Chapter X
title: Essence Is Purity of Faith
anchor_translation: "In the Sacred Guru's grace,\nAnd the active meditation of the\
  \ zealous shishya,\nLieth opportunity to uphold the Truth [the Hierarchy] ;\nOf\
  \ this, the essence is the Purity of Faith.!\n\nIn the Rites Initiatory, which confer\
  \ and bless with Occult\nPower,\nAnd in the prayer, earnest and sincere [of the\
  \ devotee],\nLieth opportunity of meeting speedily [Spiritual Com-\nmunion] ;\n\
  Of this, the essence is the Benediction.”\n\n Lord Dorje-Chang, O Thou the Immutable,\n\
  The weal and woe of this mendicant Thou knowest."
sanskrit: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows
  Evans-Wentz / Dawa-Samdup English.'
transliteration: See Key Terms (Wylie / Sanskritized) in commentary.
translation: In the sacred guru's grace and the zealous disciple's active meditation
  lies opportunity to uphold the Truth; of this, the essence is purity of faith. In
  initiatory rites that confer blessing-power, and in earnest prayer, lies opportunity
  of speedy spiritual communion; of this, the essence is benediction. Lord Vajradhara,
  Immutable One — this mendicant's weal and woe Thou knowest.
pratibha_translation: In the sacred guru's grace and the zealous disciple's active
  meditation lies opportunity to uphold the Truth; of this, the essence is purity
  of faith. In initiatory rites that confer blessing-power, and in earnest prayer,
  lies opportunity of speedy spiritual communion; of this, the essence is benediction.
  Lord Vajradhara, Immutable One — this mendicant's weal and woe Thou knowest.
commentary: 'Interdependence here is not abstract emptiness-talk; it is a two-pole
  circuit: guru-grace and disciple-zeal. Neither pole alone upholds the Truth. The
  contested claim is that the essence of the circuit is purity of faith (dad pa),
  not technique display or initiatory tourism. Rites and prayer likewise collapse
  to blessing only when sincerity is intact — otherwise they become occult costume.
  Milarepa sings this as a mendicant who still knows weal and woe, addressing Vajradhara
  as the one who already knows both. The hymn therefore refuses both self-salvaging
  heroism and passive waiting for magic. In Kagyü transmission, blessing and effort
  form one continuum rather than rival methods. Existentially: audit whether your
  practice still tries to run on one pole — grinding effort without receptivity, or
  devotion without work. The song''s medicine is restoration of the full circuit,
  not preference for the prettier pole. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation.


  Key Terms


  **bla ma''i byin rlabs** — guru''s grace/blessing as enabling field.


  **dad pa** — faith/purity of trust as essence, not accessory.


  **byin rlabs / benediction** — blessing-power that seals communion.


  Cross-Tradition Resonances


  **Rāmānuja / bhakti:** Both refuse technique without relational trust.

  *Divergence:* Milarepa embeds faith in mahāmudrā solitude; Vaiṣṇava bhakti embeds
  it in temple-relation.


  **Christian grace/works tension (Augustine):** Both deny solo self-salvation.

  *Divergence:* Augustine''s frame is sin/justification; Milarepa''s is guru-disciple
  continuum in practice.'
abhyasa: Today, do one practice-act that is pure effort, then one that is pure receptivity.
  Notice which one you secretly prefer.
