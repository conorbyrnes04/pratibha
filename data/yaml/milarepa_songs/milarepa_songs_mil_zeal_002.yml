sutra_id: MIL_ZEAL_002
collection: Milarepa Songs
section: Chapter X
title: Words Do Not Yield True Fruit
anchor_translation: 'Grant that this mendicant may cling successfully to solitude.


  ''Tis put upon the field of Tranquil Mind

  The water and manure of a constant faith,

  Then sow it with unblemished seed of a heart immaculate,

  And over it, like pealing thunder, reverberateth sincere

  prayer;

  Grace of itself upon it falleth, like a shower of rain.

  '' Unto the oxen and the plough of Undistracted Thought

  I add the ploughshare of [Right] Method and of Reason.

  The oxen, guided by the undeluded person,

  And with firm grasp of undivided purpose,


  And by the whip of zeal and perseverance goaded on,


  Break up the hardened soil of Ignorance, born of the Evil

  Passions Five,


  And clear away the stones of the hardened, sin-filled nature,


  And weed out all hypocrisies.


  ''“ Then, with the sickle of the Truth of Karmic Laws,

  The reaping of the Noble Life is practised.

  The fruits, which are of Truths Sublime,

  Are stored within the Granary to which no concepts can apply.


  ''“The gods engage in roasting and in grinding this most

  precious food,

  Which then sustaineth my poor humble self

  Whilst I for Truth am seeking.


  '' The dream I thus interpret :

  Words bring not forth True Fruit,

  Mere expositions do not yield True Knowledge,

  Yet those who would devote themselves unto the life religious,

  In meditation must exert their utmost zeal and perseverance ;

  And if they will endure hardships and strive most zealously,

  And seek with care, the Most Precious can be found.


  '' May all who are sincerely seeking Truth

  Untroubled be by obstacles and interruptions on the Path'
sanskrit: 'bla ma''i byin rlabs kyis dben pa la gnas par shog


  sems kyi zhing la dad pa''i chu dang/

  snying rje''i sbrel bas btab/

  sems dkar po''i sa bon btab/

  gsol ba''i thog mtha'' med du ''don/


  blo mi g.yo ba''i glang dang shing rta la/

  thabs dang shes rab kyi char rtse bsgre/

  brtson ''grus kyi lcags sgrog gis brdung/


  ma rig pa''i sa ''dab bcad/

  sdig pa''i rdo bkrol/

  sgyu med pa''i rtswa bcad/


  las kyi bden pa''i char pas ''tshal/

  don dam pa''i ''bras bu thob/

  lha rnams kyis bdar zhing bskol/


  tshig gis ''bras bu mi ''byung/

  bshad pa yis ye shes mi ''byung/

  bsgom pas brtson ''grus che bar bya/


  don tshan ldan pa rnyed par shog'
transliteration: '*dben pa* (solitude), *sems* (mind), *brtson ''grus* (zeal/perseverance), *las* (karma), *don dam* (ultimate truth). Plough-field metaphor maps mind-cultivation (sems kyi zhing) in Kagyü oral commentary.'
translation: 'Grant that this mendicant may hold to solitude successfully.


  On the field of tranquil mind

  I spread the water and manure of steadfast faith,

  Sow the unblemished seed of a pure heart,

  And over it sincere prayer thunders like pealing rain;

  Grace falls of itself, like a shower.


  To the oxen and plough of undistracted thought

  I add the ploughshare of right method and reason.

  The oxen, guided by the undeluded person,

  With firm grip of undivided purpose,

  Goaded by the whip of zeal and perseverance,


  Break the hardened soil of ignorance born of the five poisons,

  Clear away the stones of a sin-hardened nature,

  And weed out every hypocrisy.


  Then with the sickle of the truth of karmic law

  The harvest of the noble life is reaped.

  The fruits—sublime truths—

  Are stored in the granary to which no concept applies.


  The gods roast and grind this precious food,

  Which then sustains my humble self

  While I seek the truth.


  The dream I interpret thus:

  Words do not yield true fruit;

  Mere exposition does not yield true knowledge.

  Yet those who devote themselves to religious life

  Must exert utmost zeal and perseverance in meditation;

  If they endure hardship and strive diligently,

  And search with care, the most precious treasure can be found.


  May all who sincerely seek truth

  Be untroubled by obstacles on the path.'
commentary: 'Milarepa''s plough-field song argues that liberation is agricultural work on the mind (*sems kyi zhing*), not intellectual harvest from exposition. The counterintuitive move: after elaborate metaphorical machinery—oxen of undistracted thought, whip of *brtson ''grus*, granary without concepts—the dream-interpretation punchline dismisses words and teaching themselves as insufficient (*tshig gis ''bras bu mi ''byung*). This is not anti-intellectualism but hierarchy of means: faith-water and prayer-rain prepare the field; method and reason plough; karma''s sickle reaps; gods roast the grain; yet only meditation''s zeal finds the treasure. Evans-Wentz frames it as yogic agriculture; in mahāmudrā oral commentaries the granary "to which no concept applies" points at *don dam* fruition stored beyond conceptual fixation. The song counsels a mendicant pleading for successful solitude—consistent with Chapter X''s arc of meditation in retreat. Zeal here is neither frenzy nor guilt-driven
  hustle but sustained *brtson ''grus* applied where language stops yielding.


  Key Terms:


  **brtson ''grus** — Etymology: exertion, diligence, zeal. The whip goading oxen of undistracted thought—*brtson ''grus* is applied force in meditation, not worldly busyness. Evans-Wentz "zeal and perseverance" captures the dual aspect: fervor plus endurance.

  **sems kyi zhing** — Etymology: *sems* (mind) + *zhing* (field). The plough metaphor''s ground: mind cultivated like soil. Default "field of tranquil mind" preserves the agrarian logic—without tillage, seed and rain accomplish nothing.

  **don dam** — Etymology: ultimate, supreme truth. Sublime fruits stored in the concept-free granary are *don dam* harvest— fruition that cannot be contained in ordinary categories. The metaphor refuses to name enlightenment as a thing among things.

  **las kyi bden pa** — Etymology: truth of action, karmic law. The sickle that reaps the noble life—karmic causality as harvesting instrument, not moralistic bookkeeping. Action''s truth cuts what hypocrisy and ignorance grew.


  Cross-Tradition Resonances:




  **Patañjali, Yoga Sūtra 1.2 (yogaś citta-vṛtti-nirodhaḥ):** Both texts subordinate discursive activity to a cultivated stillness that yields fruit words cannot—vṛtti-nirodhaḥ parallels "words do not yield true fruit."

  *Divergence:* Patañjali''s framework is systematic darśana; Milarepa''s is song-metaphor rooted in mendicant solitude and guru grace.


  **Zhuangzi, Book 2 (words vs meaning):** Structural homology: language insufficient for the prized catch—fishing nets (words) are not the fish (realization). Milarepa''s plough rejects exposition without tillage.

  *Divergence:* Zhuangzi suspends fixed distinctions playfully; Milarepa''s field has karmic sickles and gods roasting grain within Buddhist soteriology.


  **John of the Cross, Ascent of Mount Carmel II:** Active meditation must give way to infused knowledge—parallel to zeal in the field versus mere teaching.

  *Divergence:* Christian apophatic mysticism targets union with God; Milarepa''s granary stores *don dam* fruits in a Kagyü guru-yogin idiom.'
abhyasa: 'Before reading a spiritual text today, spend five minutes on the "field"—breath, posture, one sentence of prayer or aspiration. After reading, ask: did I plough or only gather words? If only words, sit five more minutes without summarizing what you read.'
