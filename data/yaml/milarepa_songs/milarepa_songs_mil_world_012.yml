sutra_id: MIL_WORLD_012
collection: Milarepa Songs
section: Chapter X
title: Eschew Worldliness — Come to Lapchi-Kang
anchor_translation: 'But these are worldly things, and I’ve eschewed them,

  And, by my thus eschewing worldliness, my Sun of Happi-

  ness shineth gloriously.

  Likewise, do thou, O Peta, all worldliness eschew,

  And come to meditate in Lapchi-Kang:

  Let us together go to Lapchi-Kang, to meditate.'
sanskrit: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows
  Evans-Wentz / Dawa-Samdup English.'
transliteration: See Key Terms (Wylie / Sanskritized) in commentary.
translation: 'But these are worldly things, and I have eschewed them; and by thus
  eschewing worldliness, my sun of happiness shines gloriously. Likewise, Peta, eschew
  all worldliness and come meditate at Lapchi-Kang: let us go together to Lapchi-Kang
  to meditate.'
pratibha_translation: 'But these are worldly things, and I have eschewed them; and
  by thus eschewing worldliness, my sun of happiness shines gloriously. Likewise,
  Peta, eschew all worldliness and come meditate at Lapchi-Kang: let us go together
  to Lapchi-Kang to meditate.'
commentary: 'Happiness is not postponed to better conditions; it is presented as the
  result of eschewing worldliness. The sun of happiness shines because the worldly
  currency has been refused, not because solitude is picturesque. The invitation to
  Peta is not moral scolding alone — it is companionship in practice at a named place,
  Lapchi-Kang. The contested claim is that shared solitude can be love''s highest
  form: care that does not keep the beloved trapped in the market you yourself have
  left. In the biography this lands as familial tenderness without compromise of vow.
  Existentially: ask whether your care for someone still keeps them inside the economy
  you claim to have renounced — status, comfort-bargains, reputation management. Going
  together to meditate is the song''s non-sentimental answer. The passage asks for
  recognition before consolation. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation. The passage asks for recognition
  before consolation.


  Key Terms


  **''jig rten** — worldliness; the abandoned currency.


  **Lapchi-Kang** — practice place; geography as vow.


  **bde ba''i nyi ma** — sun of happiness arising from renunciation, not acquisition.


  Cross-Tradition Resonances


  **Gospel calling of disciples (Mark 1:16–20):** Both invite leaving nets for a shared
  path.

  *Divergence:* Gospel call is to follow Jesus in mission; Milarepa calls a sister
  into mountain meditation.


  **Buddha''s going forth (pravrajyā):** Both treat leaving home as luminous, not
  merely tragic.

  *Divergence:* Milarepa''s leave includes familial repair-invitation rather than
  unilateral exit.'
abhyasa: Name one 'worldly' thread you still use to hold a loved one close. For one
  day, care without that thread.
themes:
