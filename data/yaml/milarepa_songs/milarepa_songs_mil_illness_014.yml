sutra_id: MIL_ILLNESS_014
collection: Milarepa Songs
section: Chapter XII
title: Illness Which Becomes Me So Well
anchor_translation: "The Round of Birth and Death and the Deliverance are seen\n[or\
  \ understood] within the Realm of the Clear Light ;\nWhen the hands attain their\
  \ natural posture,!\nThe Great Mudré upon them placeth its seal.?\nThus is there\
  \ [in me] greatness of indifference,\nAnd courage knowing not impediment.\n\n Diseases,\
  \ evil spirits, sins, and obscurations,\nBut tend to beautify me greatly ;\nThey\
  \ lie within me, shaped as nerves, as humours, and as seed.\nGifts I use to ornament\
  \ the signs of my perfection ;\nMay the sins of evil thoughts be expiated.®\nThis\
  \ illness, which becometh me so well,\nI could transfer, but no need is there to\
  \ do so."
sanskrit: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows
  Evans-Wentz / Dawa-Samdup English.'
transliteration: See Key Terms (Wylie / Sanskritized) in commentary.
translation: The round of birth and death and deliverance are seen within the realm
  of Clear Light; when the hands attain their natural posture, Mahāmudrā places its
  seal upon them. Thus there is in me a greatness of indifference, and courage that
  knows no impediment. Diseases, evil spirits, sins, and obscurations only beautify
  me; they lie within me as nerves, humours, and seed. Gifts I use to ornament the
  signs of perfection — may the sins of evil thoughts be expiated. This illness, which
  becomes me so well, I could transfer — but there is no need to do so.
pratibha_translation: The round of birth and death and deliverance are seen within
  the realm of Clear Light; when the hands attain their natural posture, Mahāmudrā
  places its seal upon them. Thus there is in me a greatness of indifference, and
  courage that knows no impediment. Diseases, evil spirits, sins, and obscurations
  only beautify me; they lie within me as nerves, humours, and seed. Gifts I use to
  ornament the signs of perfection — may the sins of evil thoughts be expiated. This
  illness, which becomes me so well, I could transfer — but there is no need to do
  so.
commentary: 'Poisoned and dying, Milarepa refuses the usual spiritual emergency response
  — exorcism, humour-balancing, transfer of illness onto the enemy. Under Clear Light
  and Mahāmudrā, birth-death-deliverance are seen as one field, and illness is reclassified
  as adornment rather than interruption. The contested claim is not masochism; it
  is non-transfer: he could move the illness and will not. Courage without impediment
  here means the end of retaliatory magic. In Chapter XII this becomes the Jetsun''s
  final teaching posture: adversity incorporated, revenge declined. Existentially:
  when harm arrives, notice the reflex to export it — onto a person, a diagnosis,
  a cosmic plot. What would “no need to transfer” mean for one hour of unexported
  blame? The passage asks for recognition before consolation. The passage asks for
  recognition before consolation. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation.


  Key Terms


  **''od gsal** — Clear Light; the field in which saṃsāra/nirvāṇa are seen together.


  **phyag rgya chen po** — Mahāmudrā; seal of natural posture.


  **illness as adornment** — adversity incorporated without revenge-transfer.


  Cross-Tradition Resonances


  **Rūmī, *Mathnawī* VI (*die before you die*):** Both convert threat into transformative
  occasion.

  *Divergence:* Rūmī urges chosen ego-death; Milarepa receives poison without retaliatory
  magic.


  **Job (refusal of friends'' explanations):** Both reject tidy theodicies of illness.

  *Divergence:* Job protests toward God; Milarepa rests in Clear Light and declines
  transfer.'
abhyasa: 'When irritation rises, ask once: am I trying to transfer this? Keep it for
  ten breaths without exporting blame.'
