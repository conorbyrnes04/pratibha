sutra_id: SEN_ANIM_002
collection: Senegalese Animism
section: teaching_passage
title: One Does Not Address God; One Addresses the Spirits
sanskrit: Ils croient surtout aux esprits, mammam, et ne s'adressent jamais à Dieu;
  ces esprits sont très nombreux, il y a le génie de la forêt, des champs, de la fontaine,
  du village, de la case, etc.
transliteration: 'Not applicable. Key Serer term: *mammam* (Lasnet''s recording of
  the spirits; later Serer usage centers the ancestral *pangool* as intercessors).
  The philosophical structure — no direct address to the supreme being — is what this
  unit recovers.'
translation: 'They believe above all in the spirits, *mammam*, and they never address
  themselves to God. These spirits are very numerous: there is the genius of the forest,
  of the fields, of the spring, of the village, of the house, and so on.'
commentary: 'The claim is hierarchical and liturgical at once: the absolute is known,
  and the absolute is not the addressee of ordinary prayer. Lasnet''s sentence is
  the hinge of Senegalese animist philosophy as the PD sources can state it. Belief
  "especially" (*surtout*) in the spirits does not cancel the previous unit''s invisible
  master; it locates where relationship happens. You do not shout at the sky. You
  speak where life is locally thick — forest, field, fountain, village, house.


  This is the opposite of atheism and the opposite of idolatry. It is mediation. Later
  Serer language names the mediators *pangool*: sanctified ancestors and other-than-human
  powers who stand between the living and Roog. Lasnet''s *mammam* is the 1900 ethnographic
  word for that populated middle. Each place has a genius because each place is a
  life, not a dead backdrop. The house is not spiritually empty until you import a
  god into it. The house already has a spirit because dwelling is already a relation.


  Delafosse''s pan-African analysis fits the Serer report with unusual exactness:
  the creator is a cosmogonic idea; cult belongs to souls that are free to act in
  the near world — the dead, and the localized souls of land and water. The "never"
  of *ne s''adressent jamais à Dieu* is therefore not neglect. It is reverence. Direct
  address would treat Roog as a department, a patron you can corner. The spirits are
  how a world that is alive can be spoken to without reducing the sky to a customer.


  Existentially, the teaching cuts two modern errors. One is that God must be constantly
  accosted or religion has failed. The other is that matter is mute. Senegalese animism,
  in this source, says: keep the highest high, and keep the near world addressable.
  Practice happens in the middle.


  Key Terms:


  **mammam** - Lasnet''s term for the spirits the Serer actually address -> the operational
  divine, not the philosophical absolute -> "ghosts" is too thin; "gods" is too Olympian;
  they are local personal powers of places and dwellings.


  **ne s''adressent jamais à Dieu** - "they never address themselves to God" -> liturgical
  withholding, not unbelief -> English "they don''t pray" is false; they pray, but
  not *to* Roog as if Roog were a nearby specialist.


  **génie** - French ethnographic word for a place-spirit (*genius loci*) -> forest,
  field, spring, village, house each have one -> "genie" in the lamp-sense is a mistranslation;
  this is the soul of a location.


  **pangool** - Serer ancestral/saintly spirits (not named in Lasnet; the structure
  is already here) -> later sources make explicit that one reaches Roog through the
  pangool -> using only "ancestors" misses that some pangool are other-than-human
  and tied to land.


  Cross-Tradition Resonances:


  **Pratyabhijñāhṛdayam 1–2:** Both distinguish a sovereign ground from the forms
  in which that ground becomes approachable.

  *Divergence:* Kashmir Śaiva teaching identifies the ground with consciousness itself;
  Serer teaching keeps Roog unaddressed and routes practice through local spirits.


  **Catholic cult of saints:** Both refuse to treat mediation as a denial of the highest,
  and both locate everyday petition in nearer holy persons/powers.

  *Divergence:* Christian saints are human dead in a church calendar; Serer *mammam*
  include the living places themselves.


  **Shinto kami:** Both populate springs, groves, and dwellings with addressable presence
  rather than emptying the world for a distant God.

  *Divergence:* Shinto has shrine architecture and a written mythic corpus; Serer
  address in this source is tree, stone, and household, without a temple of Roog.'
voice_of_siva: ''
abhyasa: 'Today, do not address a remote absolute. Address what is actually near:
  the room, the water you drink, the ground you cross. Silently acknowledge each as
  already inhabited. Ask nothing of "God-as-sky." Keep the highest high by speaking
  to the middle.'
