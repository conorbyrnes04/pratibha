sutra_id: SEN_ANIM_008
collection: Senegalese Animism
section: teaching_passage
title: Souls of One Essence in Every Being
sanskrit: Ce terme paraît convenable, à condition d'entendre par là la croyance à
  l'existence d'âmes de même essence dans tous les êtres, inanimés en apparence aussi
  bien qu'animés, morts et vivants, au caractère personnel de chacune de ces âmes,
  et à la force extérieure de celles d'entre elles qui n'ont pas à régir la vie intérieure
  de leur enveloppe matérielle... Les Noirs croient en effet que tout être distinct
  — animal, végétal ou minéral — ou tout phénomène naturel est doué, en dehors de
  la matière qui le constitue... d'un principe apparemment immatériel, possédant une
  personnalité propre, une pensée, une volonté. C'est ce principe que j'appelle «
  âme », faute de mot... Dans la langue mandingue, par exemple, ce mot est nia, qui
  signifie exactement « vie personnelle ».
transliteration: 'Not applicable. Key Mande term used by Delafosse as the regional
  philosophical vocabulary: *nia* — "personal life." Serer practice in Lasnet (spirits
  of forest, field, fountain, house; soul entering a bird) is the Senegalese instance
  of this ontology.'
translation: 'Animism is the right name if it means this: souls of the same essence
  exist in all beings, the apparently inanimate as well as the animate, the dead as
  well as the living; each of these souls is personal; and those souls that no longer
  have to govern an inner bodily life possess an outward power and therefore receive
  cult. Every distinct being — animal, plant, or mineral — and every natural phenomenon
  is endowed, beyond its matter, with an apparently immaterial principle that has
  its own personality, thought, and will. In Manding this principle is called *nia*:
  personal life.'
commentary: 'The claim is ontological equality of essence across kinds, plus difference
  of office. A person''s *nia*, a baobab''s *nia*, a spring''s *nia*, a field''s *nia*
  are the same sort of thing: personal life. They are not the same job. While a living
  human *nia* is busy governing its own body, it is not a god. After death, freed
  from that inner administration, the same essence becomes a power the living must
  reckon with. A field, having no wandering animal body to run, already has that outward
  independence — which is why land-soul and ancestor-soul can fuse, and why the Serer
  pour at the baobab rather than at an empty symbol.


  This is the philosophy behind every practice unit above. Libation makes sense only
  if the tree has a *nia*. Speaking into the ear makes sense only if the dead still
  have a *nia*. Not addressing Roog makes sense if Roog is sky-scale soul, not a nearby
  specialist. Takhar and Tiurakh make sense as especially affirmed personalities of
  justice and increase among the many. Delafosse''s further distinction — *nia* as
  personal directing soul versus *dia* as impersonal vital fluid — is Mande vocabulary,
  but the structure travels: there is breath-life that stops, and there is personal
  life that does not.


  Existentially, the teaching forbids two reductions. You may not treat a place as
  dead stuff. You may not treat a person as only a body. And you may not treat all
  souls as interchangeable helpers. Personality means this tree, this spring, this
  ancestor — not "energy." The contemplative implication is severe: relation is always
  particular. Animism is the opposite of a blur.


  Key Terms:


  **nia** - Manding "personal life"; Delafosse''s working word for the soul-principle
  -> born with the body, surviving it, possessing temperament -> English "soul" can
  sound Christian-immortal in a different key; *nia* is personal life that can become
  cult-worthy when free.


  **même essence** - the same essence in all beings -> the philosophical heart of
  animism -> "everything is alive" without *same essence* and *personality* is a slogan,
  not this doctrine.


  **force extérieure** - outward force of souls not occupied with running a body ->
  why the dead and the land are gods and the living neighbor usually is not -> "power"
  as political force misses the metaphysical job-change at death.


  **dia** - Manding impersonal vital fluid, the sweetness/ease that makes a body live;
  its departure is material death -> not personal, not cult-worthy -> confusing *dia*
  with *nia* would make animism into mere vitalism.


  Cross-Tradition Resonances:


  **Śiva Sūtra I.1 (*caitanyam ātmā*):** Both refuse to treat awareness/life-principle
  as a byproduct of matter.

  *Divergence:* The sūtra identifies consciousness as the Self of all; Delafosse describes
  many personal *nia* of one essence, not one Self.


  **Stoic *pneuma* / Platonic *psyche*:** Both split a directing inner principle from
  mere bulk.

  *Divergence:* Stoic pneuma is often impersonal cosmic tension; *nia* is irreducibly
  personal and plural.


  **Serer units 2–5 of this collection:** Both require a world in which trees, birds,
  and the dead can host personal life.

  *Divergence:* Delafosse theorizes with Mande terms across West Africa; Lasnet and
  Bérenger report the Senegalese practices that instantiate the theory.'
voice_of_siva: ''
abhyasa: Walk through one ordinary setting (kitchen, street, field). Name three distinct
  beings — a tool or stone, a plant, a person. For each, silently say "personal life,
  not mine." Feel the difference between that recognition and a vague glow of "everything
  is one."
