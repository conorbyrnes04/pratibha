sutra_id: PARM_04
collection: Parmenides Fragments
section: B8 (excerpt)
title: What Is Cannot Not Be
sanskrit: μόνος δ' ἔτι μῦθος ὁδοῖο λείπεται ὡς ἔστιν· ταύτῃ δ' ἐπὶ σήματ' ἔασι πολλὰ μάλ', ὡς ἀγένητον
  ἐὸν καὶ ἀνώλεθρόν ἐστιν.
transliteration: Ancient Greek (Diels-Kranz tradition).
translation: 'Only one story of the way still remains: that it is. On this way there are very many signs:
  that being is ungenerated and imperishable, whole, unique, unmoved, and complete.'
commentary: 'Parmenides executes a logical guillotine here. The phrase μόνος δ'' ἔτι μῦθος ὁδοῖο λείπεται—only
  one account of the way remains—is not rhetorical flourish but the result of eliminating all competitors.
  He has already severed the path of not-being as unthinkable and unspeakable; now he announces what survives
  that cut: ὡς ἔστιν, that it is. This is not a claim about the world''s furniture but about the structure
  of intelligibility itself. What can be thought must be; what cannot be thought (not-being, generation
  from nothing, perishing into nothing) is not a path but a void. The σήματα—signs or markers—that follow
  (ἀγένητον, ἀνώλεθρόν, ὅλον, μοῦνον, ἀκίνητον, τέλειον) are not properties added to being like adjectives
  to a noun. They are what remains when you strip away every form of negation, every temporal rupture,
  every multiplicity that requires one thing to be and another not to be. Being cannot have come to be
  (that would require not-being to precede it); cannot perish (that would require not-being to follow);
  cannot move (motion requires empty space, which is not-being); cannot be multiple (multiplicity requires
  boundaries, which are negations). The passage forces a stark choice: either thought and speech track
  what is—in which case this account holds—or they do not, in which case inquiry itself collapses into
  silence. Parmenides is not describing a hidden realm. He is showing that the very act of thinking commits
  you to this path or to none at all.'
abhyasa: 'Stop mid-sentence when you catch yourself saying or thinking ''it will no longer be'' or ''it
  was not always'' about something present—a person, a capacity, a state—and reverse the negation: hold
  the present form as continuous, unbroken, without internal rupture, and notice whether the mind resists
  or settles. Repeat this reversal three times on the same object before releasing it.'
themes:
- negation and intelligibility
- the cost of thinking
- being without becoming
- logical constraint
- the path of inquiry
