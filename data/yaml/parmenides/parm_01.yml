sutra_id: PARM_01
collection: Parmenides Fragments
section: Proem / B1
title: The Mare-Drawn Road to the Goddess
sanskrit: Ἵπποι ταί με φέρουσιν, ὅσον τ' ἐπὶ θυμὸς ἱκάνοι, πέμπον, ἐπεί μ' ἐς ὁδὸν βῆσαν πολύφημον ἄγουσαι
  δαίμονος.
transliteration: Ancient Greek (Diels-Kranz tradition).
translation: The mares that carry me as far as longing might reach were conveying me, when they brought
  and placed me upon the resounding road of the goddess.
commentary: '«The Mare-Drawn Road to the Goddess» is Parmenides'' hard fork against Heraclitean flux:
  inquiry is constrained by what can be thought, and negation of Being is closed as a path. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the
  argument until its force lands in attention, then let practice carry one concrete shift into the next
  hour of ordinary life. This is the demand of a living tradition: insight without application remains
  incomplete. Return again to the original wording when the mind wants to smooth the edge. Return again
  to the original wording when the mind wants to smooth the edge.'
abhyasa: For ten minutes, watch the mind's habit of saying 'is not' about what you fear losing—and test
  whether that move clarifies or confuses.
themes:
- truth
- knowledge
- being
- attention
- way
