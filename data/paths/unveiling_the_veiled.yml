path_id: unveiling_the_veiled
work_id: kashf_al_mahjub
work_title: Kashf al-Maḥjūb
title: "Unveiling the Veiled"
tradition: Sufi
covers: "Handbook architecture: divine vs human knowing, knowledge as conduct, poverty beyond possession, claim vs realization, gnosis-law-stations, freedom beyond achievement, contentment with decree, repentance beyond self-will."
status: complete

# Not the family sampler. kam_07 and kam_25 stay off the primary sequence;
# they may appear as supporting homologues.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Unveiling is a condition of the heart, not a larger library. Do not let the
  student wear a station as a costume, or treat contentment as passivity.

premise: >
  Hujwīrī's handbook is not a catalogue of Sufi facts. You walk a sequence of
  corrections: knowledge that cannot rival God's knowing, knowledge that must
  become conduct, poverty that is not destitution, the lie of the claim,
  stations that need the Law, freedom that drops even praiseworthy qualities,
  contentment with what you cannot command, and repentance that surrenders
  the will that would choose its own vision.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."
  - "If a quality appears, do not name it as yours."

gates:
  - gate_id: gate_0_knowing
    name: "Two knowledges"
    theme: "Human knowing is not a smaller edition of God's knowing."
    why_first: >
      The handbook opens the asymmetry. If you skip it, later stations become
      techniques for acquiring what only God has as attribute.
    stations:
      - station: 1
        unit_id: kashf_al_mahjub.kam_01
        reference: "On knowledge"
        title: "Divine knowledge and human knowing"
        opening_question: "Where am I treating a conclusion as final mastery?"
        transmission: >
          Knowledge is of two kinds: divine and human. Human knowledge is
          worthless beside divine knowledge, because God's knowledge is an
          attribute of Himself, infinite; ours is an attribute of ourselves,
          finite. The shared name ʿilm must not imply a shared measure. The
          best definition is a quality through which the ignorant are made
          wise — not a pile of grasped objects. The difficulty is that you
          want your knowing to work like God's: complete, possessive, final.
          It does not. Humility here is not a pose. It is accurate scale.
        contemplation: "A finite knower cannot wear an infinite attribute."
        gate_practice: >
          When you notice yourself treating one conclusion as final mastery,
          name one thing you know only partially and one consequence of that
          limit. Then make a single decision today with deliberate humility
          rather than pretending to possess complete knowledge.
        passed_when: "You can tell finite knowing from the wish to know as God knows."

  - gate_id: gate_1_conduct
    name: "Knowledge must become conduct"
    theme: "Disputation without practice, and law without restraint, both kill the heart."
    why_first: >
      After the scale of knowing, the handbook refuses knowledge as a mental
      possession. Life of the heart is verified in acts.
    stations:
      - station: 2
        unit_id: kashf_al_mahjub.kam_03
        reference: "On knowledge and practice"
        title: "Knowledge that must become conduct"
        opening_question: "What excuse am I still debating instead of doing?"
        transmission: >
          Knowledge is the life of the heart: it delivers the heart from the
          death of ignorance. Hearts of the heedless are sick because they do
          not know His commandments. Those content with disputation about
          knowledge and not with asceticism become heretics; those content
          with legal learning without scrupulous restraint go equally wrong.
          Kalām and fiqh are dangerous not because reasoning or law are false,
          but because each can become a shelter from doing. The difficulty is
          that you already know enough to postpone. Knowing that does not
          become conduct is a kind of death you can narrate as study.
        contemplation: "The heart lives by what is done, not by what is won in argument."
        gate_practice: >
          Before making one excuse today — especially "that is just how things
          are" — do one specific commanded or responsible act you have been
          postponing, and do it without debating whether your effort can
          change the outcome.
        passed_when: "You can tell study-as-shelter from an act that tests the knowledge."

  - gate_id: gate_2_poverty
    name: "Poverty beyond possession"
    theme: "Faqr is freedom from being measured by gain and loss."
    why_first: >
      Conduct still leaves you measured by what you have. The handbook now
      names poverty as inward wealth, not as a shortage you could display.
    stations:
      - station: 3
        unit_id: kashf_al_mahjub.kam_04
        reference: "On poverty"
        title: "Poverty beyond possession"
        opening_question: "What possession, convenience, or outcome am I still using as my measure?"
        transmission: >
          Poverty has an outward form and an inward reality. Its form is
          destitution; its reality is wealth and freedom of choice. Whoever
          looks only at the form remains caught in the form. Whoever finds
          the reality turns from created things and, seeing only the All-One,
          hastens toward everlasting life. Faqr is not chiefly empty pockets,
          though it can include them. It is the condition in which gain and
          loss no longer determine who you are. The difficulty is that you
          can wear destitution as a badge and still be owned by what you lack.
        contemplation: "Shortage is not yet freedom."
        gate_practice: >
          Choose one possession, convenience, or expected outcome you usually
          treat as necessary. Go without it for one defined period. When its
          absence provokes anxiety or self-pity, name the feeling without
          trying to replace it.
        passed_when: "You can go without one 'necessary' thing without turning the lack into a costume."

  - gate_id: gate_3_claim
    name: "Claim vs realization"
    theme: "A passing taste is not a station."
    why_first: >
      Poverty can become a new profession. The handbook now names the
      corruption: names of the path used as substitutes for transformation.
    stations:
      - station: 4
        unit_id: kashf_al_mahjub.kam_06
        reference: "On empty professions"
        title: "The difference between claim and realization"
        opening_question: "Which quality am I claiming because I felt it for a moment?"
        transmission: >
          In our time the knowledge of Sufism has fallen out of use. High and
          low alike are satisfied with empty professions: blind conformity has
          replaced spiritual ardor. The common people say "We know God," while
          a passing desire for the world to come is treated as vision, and
          undirected mental traffic is promoted to contemplation. Hujwīrī does
          not deny longing or love. He denies converting a flicker into proof.
          The difficulty is that you already have language for patience,
          gratitude, love, clarity — and the language arrives faster than the
          discipline that would test them.
        contemplation: "A name is not a station."
        gate_practice: >
          Notice one spiritual, moral, or psychological quality you are tempted
          to claim because you feel it briefly. Replace the claim with one
          concrete discipline that tests it for ten minutes.
        passed_when: "You can tell a flicker from a tested quality, and refuse to advertise the flicker."

  - gate_id: gate_4_stations
    name: "Gnosis, law, stations"
    theme: "Maʿrifat without Law is unsound; Law without stations is unpractised."
    why_first: >
      After the claim is exposed, the handbook restores the whole: command,
      path, and disclosure correcting one another.
    stations:
      - station: 5
        unit_id: kashf_al_mahjub.kam_11
        reference: "On gnosis, Law, and stations"
        title: "Gnosis, Law, and the stations"
        opening_question: "Which of the three am I using to dismiss the other two?"
        transmission: >
          Gnosis by which God is known to prophets and saints cannot be
          acquired by ordinary means; it results from divine guidance.
          Knowledge from God is the science of the Sacred Law, commanded and
          obligatory. Knowledge with God is the science of the stations, the
          Path, and the degrees of the saints. Gnosis is unsound without
          accepting the Law, and the Law is not practised rightly unless the
          stations are made manifest. The difficulty is that you want a
          privilege that skips obligation, or an obligation that never
          becomes a quality, or a station that floats free of both. The
          handbook will not let any one of them be the whole.
        contemplation: "Command, transformation, and disclosure correct one another."
        gate_practice: >
          Choose one obligation you will perform today — a prayer, keeping a
          promise, or refraining from a known wrong — and do it while naming
          one inner station it should form in you: patience, gratitude,
          humility, or trust. Do not seek an unusual feeling; notice whether
          the act makes the quality more concrete.
        passed_when: "You can keep one obligation without using it to skip inner work, or inner work to skip the obligation."

  - gate_id: gate_5_freedom
    name: "Freedom beyond achievement"
    theme: "Even praiseworthy qualities become bondage when you own them."
    why_first: >
      Stations, once real, become a new captivity. Freedom is not a better
      identity; it is not noticing excellence as yours.
    stations:
      - station: 6
        unit_id: kashf_al_mahjub.kam_18
        reference: "On freedom"
        title: "Freedom beyond spiritual achievement"
        opening_question: "Which good act am I still rehearsing as proof of who I am?"
        transmission: >
          When one escapes the captivity of stations, is rid of the impurity
          of states, and is endowed with every praiseworthy quality, one is
          separated from all qualities — not bound by any praiseworthy quality
          of one's own, not taking notice of it, not made self-conceited by
          it. Stations and states are not rejected; they must be walked. The
          contested move is that even the aim of training becomes bondage if
          the self notices it as achievement. The difficulty is that you want
          freedom as a further prize. That wish is still captivity.
        contemplation: "Excellence owned is still a chain."
        gate_practice: >
          After doing one genuinely good act, do not mention it, rehearse it
          inwardly, or use it to rank yourself against anyone. When the mind
          returns to it, name the return "a quality I do not own" and redirect
          attention toward God, or toward the next necessary task.
        passed_when: "You can let a good act finish without collecting it as identity."

  - gate_id: gate_6_contentment
    name: "Contentment with decree"
    theme: "Riḍā is consent to what you cannot command — not sanctified passivity."
    why_first: >
      Freedom that still bargains with events is not yet freedom. The
      handbook now names contentment as the kingdom that involves no loss.
    stations:
      - station: 7
        unit_id: kashf_al_mahjub.kam_21
        reference: "On contentment"
        title: "Contentment with the divine decree"
        opening_question: "What disappointment am I still converting into a demand?"
        transmission: >
          Contentment with God is a manifest kingdom. Moses asked for an
          action that would satisfy God; God said he could not do that, then
          revealed: My satisfaction with you consists in your being satisfied
          with My decree. Freedom here is not mastery over events. It is
          consent to the reality you cannot command. The difficulty is
          political as well as spiritual: "decree" can be used to sanctify
          injury or passivity. Hujwīrī's move is narrower. You complete the
          next responsible action without seeking compensation in complaint.
          Contentment is not folding your hands. It is refusing to turn the
          given into a verdict against God or a drama about yourself.
        contemplation: "Consent is not collapse."
        gate_practice: >
          When one small disappointment occurs today — a delay, changed plan,
          or unwanted task — name it plainly, then say once: "I do not have
          to turn this into a demand." Complete the next responsible action
          without seeking compensation in complaint or self-congratulation.
        passed_when: "You can meet one unwanted given without converting it into a demand or a pose of holiness."

  - gate_id: gate_7_repentance
    name: "Repentance beyond self-will"
    theme: "The last repentance is from the self that would choose even its longing."
    why_first: >
      Contentment still leaves a will that wants a particular vision of God.
      The handbook ends this arc by relocating repentance from sin to ikhtiyār.
    stations:
      - station: 8
        unit_id: kashf_al_mahjub.kam_23
        reference: "On repentance"
        title: "Repentance beyond self-will"
        opening_question: "What good desire am I still trying to time and form myself?"
        transmission: >
          Repentance is of three kinds: from wrong to right; from right to
          more right; and from selfhood to God. The third belongs to the
          station of love. The elect cannot repent of sin in the ordinary
          sense — the world regrets having lost the vision of God. Moses
          desired that vision and repented because he sought it through his
          own choice. The fault is not the desire. It is ikhtiyār: the will
          that claims to direct even its longing. The difficulty is that you
          want to repent as a self-improvement project that still picks the
          outcome. The last act is to name the good desire and release the
          claim to choose its form and timing.
        contemplation: "Even holy desire can be self-will in costume."
        gate_practice: >
          When you notice yourself demanding a particular spiritual, emotional,
          or practical outcome today, name the good desire in one sentence,
          then add: "I release my claim to choose its form and timing." Take
          one small next action without trying to control the result.
        passed_when: "You can want a good thing without appointing yourself the chooser of its arrival."

coda:
  title: "Where the path continues"
  text: >
    The two-veils chapter and the true-Sufi chapter belong to the family
    sampler, not this handbook walk. Return to them as supporting diagnoses
    if a costume or a covering returns. The valleys are another architecture.
  next_gates: []
