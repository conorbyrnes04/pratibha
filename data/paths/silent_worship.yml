path_id: silent_worship
work_id: eastman_soul_of_the_indian
work_title: The Soul of the Indian
title: "Silent Worship"
tradition: Dakota (Eastman)
covers: "Eastman on the Great Mystery: original attitude, silent solitary worship, no temples, bambeday, silence as Mystery, giving, no priest between, integrity before the later names. Not Zitkala-Ša trickster legends, not a mixed Native sampler."
status: complete

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Keep this Dakota. Do not turn silence into Christian darkness or into a
  generic 'indigenous spirituality' collage. Do not preach against Christ;
  refuse the story that the later names completed what was already known.

premise: >
  The student is learning a worship that is silent, solitary, and free of
  self-seeking: no temple but nature, bambeday as consciousness of the divine,
  silence as the Mystery's voice, giving as the child's grace, no intermediary,
  then the integrity of a morality already received.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."

gates:
  - gate_id: gate_0_mystery
    name: "The Great Mystery"
    theme: "Simple, exalted, not a program."
    why_first: >
      If the Eternal begins as a concept, later silence becomes a technique.
    stations:
      - station: 1
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_001
        title: "The original attitude toward the Eternal"
        opening_question: "Where am I still making the Great Mystery a project instead of a surrounding?"
        transmission: >
          The original attitude toward the Eternal, the Great Mystery that surrounds and
          embraces us, was as simple as it was exalted. Supreme conception, fullest joy
          possible in this life. The miss is turning Mystery into a curriculum or a brand.
        contemplation: "Exalted here is not complicated. Complicated is often a way of not standing under."
        gate_practice: >
          Step outside or to a window. For two minutes, stop naming what you believe.
          Notice that you are already surrounded. Do not add a prayer-script unless it arrives.
        passed_when: "You can stand under a surrounding Mystery without turning it into a plan."
      - station: 2
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_002
        title: "Silent, solitary, free from self-seeking"
        opening_question: "Where is my worship still a performance, a group identity, or a request?"
        transmission: >
          Worship of the Great Mystery was silent, solitary, free from all self-seeking.
          Silent because speech is feeble; solitary because He is nearer in solitude; no
          priests authorized to come between. No creeds forced. The miss is making silence
          a shared aesthetic, or solitude a spiritual product.
        contemplation: "This is not Psalms' mouth. Address here is wordless, and no one meddles."
        gate_practice: >
          Ten minutes alone. No music, no journal, no request. If speech rises, let it fail.
          Stand as one among others who need no intermediary for this hour.
        passed_when: "You can sit a silent hour without turning it into content or a plea."
      - station: 3
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_003
        title: "No temples save those of nature"
        opening_question: "Where am I still hiring a room to make the Mystery official?"
        transmission: >
          There were no temples or shrines among us save those of nature. The miss is treating
          the grove as a metaphor while you wait for a proper sanctuary — or treating nature
          as scenery for a mood called sacred.
        contemplation: "The temple is not an upgrade on the hill. The hill was already enough."
        gate_practice: >
          Choose one ordinary outdoor or windowed place. Give it the time you would give a
          sanctuary. No photograph. One act of care for that place (pick up, water, leave it cleaner).
        passed_when: "You can worship once without needing a building to make it count."

  - gate_id: gate_1_bambeday
    name: "Mysterious feeling"
    theme: "Bambeday, then silence as the Mystery's voice."
    why_first: >
      Without bambeday, silence is only quiet. Without the fruits, silence is only a name.
    stations:
      - station: 4
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_004
        title: "Bambeday — consciousness of the divine"
        opening_question: "Where am I still translating the Unseen into a productivity fast or a dream to interpret?"
        transmission: >
          Solitary communion with the Unseen is partly bambeday — 'mysterious feeling' —
          not well translated as fasting or dreaming. Consciousness of the divine. The miss
          is making it a technique with an outcome you can post.
        contemplation: "The highest expression was not a vision-report. It was communion."
        gate_practice: >
          Fast from one ordinary comfort for a morning (food, feed, commentary). Do not
          harvest a lesson. Notice whether communion arrived or whether you hunted an experience.
        passed_when: "You can keep a solitary communion without needing a vision to prove it."
      - station: 5
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_019
        title: "Silence is the Great Mystery"
        opening_question: "Where am I still using silence as absence, or as a self-improvement tool?"
        transmission: >
          If you ask what silence is: it is the Great Mystery. The holy silence is His voice.
          Fruits: self-control, courage, patience, dignity, reverence — cornerstone of character.
          The miss is silence as empty, or as a hack for calm.
        contemplation: "Silence is not the gap of apophasis. It is a name for the Mystery and a school of character."
        gate_practice: >
          Sit ten minutes. When restlessness asks for a name, answer: Mystery. Afterward,
          practice one fruit Eastman names — patience or reverence — in a concrete encounter.
        passed_when: "You can treat silence as the Mystery's voice, then let one fruit show in conduct."

  - gate_id: gate_2_life
    name: "Give, stand, keep what was already known"
    theme: "Grace of giving, no priest, integrity of the earlier teaching."
    why_first: >
      Worship that never gives, never stands alone, or waits for a later name to complete it, has not yet been this walk.
    stations:
      - station: 6
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_017
        title: "As a child I understood how to give"
        opening_question: "Where has 'civilization' taught me to price what I used to revere?"
        transmission: >
          As a child I understood how to give; I have forgotten that grace since I became
          civilized. A pebble was valuable; a tree an object of reverence; now a painted
          landscape priced in dollars. The miss is nostalgia. The practice is giving without
          appraisal — not a speech against cities.
        contemplation: "The reconstructed Indian is a warning about you, not a costume."
        gate_practice: >
          Give one thing today without estimating its dollar or status value — time, a tool,
          attention. Do not narrate the gift. Revere one ordinary growing thing without photographing it.
        passed_when: "You can give once without a price, and revere once without a market."
      - station: 7
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_006
        title: "An individualist in religion"
        opening_question: "Where am I still authorizing someone to stand between me and the Maker — or standing between another and theirs?"
        transmission: >
          Individualist in religion as in war. No one meddles with another's religious experience.
          The miss is loneliness-as-brand, or refusing all teaching. Eastman means: no priest
          owns the encounter. You may still learn. You may not confess another.
        contemplation: "Equality here is standing erect as a child of the Mystery, not a creed of isolation."
        gate_practice: >
          Notice one place you wanted a specialist to certify your inner life — or one place
          you advised someone else's. Withhold the meddling. Keep your own silent hour.
        passed_when: "You can leave one encounter unmediated and one neighbor unconfessed."
      - station: 8
        unit_id: eastman_soul_of_the_indian.eastman_soul_of_the_indian_016
        title: "Long before I heard of Christ"
        opening_question: "Where am I still treating a later name as the upgrade that completed what I already knew?"
        transmission: >
          Long before I heard of Christ or saw a white man, an untutored woman and Nature
          taught me God, goodness, beauty. Civilization has not taught me anything better.
          This is not a polemic against the later names. It is integrity: do not use a second
          religion to erase a first knowing. The walk ends here, not in a mixed sampler.
        contemplation: "What was already known does not need a completion certificate."
        gate_practice: >
          Name one moral knowing you had before the later systems you admire. Keep it today
          in one act. Do not quote a newer book to authorize it.
        passed_when: "You can keep one earlier knowing without asking a later name to complete it."
