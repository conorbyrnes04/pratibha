path_id: under_the_sun
work_id: ecclesiastes_qoheleth
work_title: Ecclesiastes (Qoheleth)
title: "Under the Sun"
tradition: Hebrew wisdom (Qoheleth)
covers: "Selected Qoheleth: hebel, the circles, the burden of seeing, times, eternity in the heart, few words, bread and work, the final charge. Not all 49 units, not Psalms address."
status: complete

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Keep this observational. Do not turn vanity into a second letting-go sampler,
  and do not turn the Teacher into a psalmist who addresses the Face.

premise: >
  The student is watching what does not last under the sun: vapor, circles,
  the grief of seeing, the times, the eternity that will not close, then a
  few words, the work at hand, and a charge that does not cancel the vapor.
  This is not lament-and-praise. It is not fruit-seizing.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."

gates:
  - gate_id: gate_0_vapor
    name: "Vapor under the sun"
    theme: "Hebel is diagnosis, not a mood of despair."
    why_first: >
      If vanity begins as cynicism, later work becomes a shrug. Qoheleth opens by watching.
    stations:
      - station: 1
        unit_id: ecclesiastes_qoheleth.faithful_qoh_01_01_05
        title: "Under the turning sun"
        opening_question: "Where am I still treating vapor as a reason to stop, or as a pose?"
        transmission: >
          Vapor of vapors — everything is vapor. Generations go; the earth remains; the sun
          returns to the place it rose. The question is surplus: what lasting gain from toil
          under the sun? Not a sermon against work. A refusal to let labor pretend it stores being.
        contemplation: "Hebel is mist, not nihilism. You can see it without becoming theatrical."
        gate_practice: >
          Name one project you are treating as a store of lasting surplus. Do the next small
          piece of it without that story. Notice whether the work still stands.
        passed_when: "You can watch one toil lose its claim to lasting surplus without quitting it as a pose."
      - station: 2
        unit_id: ecclesiastes_qoheleth.faithful_qoh_01_06_10
        title: "Circles beneath the sun"
        opening_question: "Where am I still waiting for a new thing that would end the turning?"
        transmission: >
          Wind, rivers, the sea that is never full — there is nothing new under the sun.
          The miss is novelty as salvation. The circles are the world, not a failure of the world.
        contemplation: "The turning is not a prison you escape by finding a fresher object."
        gate_practice: >
          Catch one hunger for a new thing. Name the last new thing that was supposed to end it.
          Do the ordinary next act instead of hunting a replacement.
        passed_when: "You can feel a circle as the world, not as a personal insult."
      - station: 3
        unit_id: ecclesiastes_qoheleth.faithful_qoh_01_16_18
        title: "The burden of seeing"
        opening_question: "Where am I still using more seeing as a way to outrun grief?"
        transmission: >
          Wisdom increased; grief increased. Seeing is not a prize that cancels hebel.
          The Teacher does not tell you to go stupid. He tells you the surplus of seeing is not peace.
        contemplation: "Clarity is not a solvent. It can be a weight you carry without inflating it."
        gate_practice: >
          Write one true thing you already see that you have been trying to outrun with more information.
          Stop the search for one hour. Carry the seeing without adding a tab.
        passed_when: "You can leave one inquiry unfinished without treating ignorance as a cure."

  - gate_id: gate_1_times
    name: "Times and the heart"
    theme: "Season, then the eternity that will not close."
    why_first: >
      If times become a calendar of moods, eternity in the heart becomes a spiritual souvenir.
    stations:
      - station: 4
        unit_id: ecclesiastes_qoheleth.faithful_qoh_03_01_05
        title: "The turning of times"
        opening_question: "Which time am I forcing because I will not inhabit the one that is here?"
        transmission: >
          For everything a season: plant and uproot, weep and laugh, keep and throw away.
          The miss is living in the wrong time on purpose — mourning in a feast, grasping in a release.
        contemplation: "A season is not a preference. It is what the hour will bear."
        gate_practice: >
          Name the time it actually is in one relation — gathering or scattering. Do one act that
          matches that time, not the time you wish it were.
        passed_when: "You can match one act to the time that is here rather than the time you prefer."
      - station: 5
        unit_id: ecclesiastes_qoheleth.faithful_qoh_03_11_15
        title: "Eternity in the heart"
        opening_question: "Where am I still trying to close what was placed open in me?"
        transmission: >
          He has made everything fitting in its time, and placed eternity in the heart —
          yet so that no one can find out the work from beginning to end. The miss is using
          the ache for forever as a demand that the sun explain itself.
        contemplation: "The open heart is not a puzzle you finish. It is a limit you live inside."
        gate_practice: >
          Sit four minutes with one unfinished thing. Do not outline it. Feel the ache to close
          it. Leave it open on purpose, then do a small fitting act in the time that is here.
        passed_when: "You can feel eternity in the heart as a limit, not as a homework assignment."

  - gate_id: gate_2_charge
    name: "Few words, work, charge"
    theme: "Speech, the day's work, then fear without cancelling vapor."
    why_first: >
      If the walk ends as despair, the charge is a pious sticker. If it ends as piety, hebel was a mood.
    stations:
      - station: 6
        unit_id: ecclesiastes_qoheleth.faithful_qoh_05_01_05
        title: "Few words before heaven"
        opening_question: "Where is my mouth still rushing to cover what I will not stand under?"
        transmission: >
          Do not let the mouth be hasty. God is in heaven, you on earth; therefore let your words be few.
          A vow unpaid is worse than no vow. This is not Psalms' address. It is restraint before the height.
        contemplation: "Silence here is not worship-as-poetry. It is not multiplying words because you are afraid."
        gate_practice: >
          Before one prayer, complaint, or promise today, wait sixty seconds. Speak only what you would
          still say after the wait — or keep quiet.
        passed_when: "You can withhold one extra word that was covering fear."
      - station: 7
        unit_id: ecclesiastes_qoheleth.faithful_qoh_09_06_10
        title: "Bread, oil, and the work at hand"
        opening_question: "Where am I still postponing the day's bread until a meaning arrives?"
        transmission: >
          Love, hate, and envy have already vanished with the dead. Go, eat your bread with joy,
          drink your wine, let oil not be lacking, and do the work your hand finds — for there is
          no work in Sheol. Not hedonism. Not fruit-seizing. The day's portion while there is a day.
        contemplation: "Joy here is not a prize for having solved vapor. It is what you do not withhold from the living hour."
        gate_practice: >
          Eat one meal without a screen. Put oil or care on one ordinary task you have been treating
          as a placeholder until life becomes real.
        passed_when: "You can give the day's bread and work their hour without waiting for a surplus of meaning."
      - station: 8
        unit_id: ecclesiastes_qoheleth.faithful_qoh_12_11_14
        title: "Goads, nails, and the final charge"
        opening_question: "Am I still adding books to postpone fearing God and keeping the charge?"
        transmission: >
          Sayings of the wise are goads and nails from one shepherd. Of making many books there is
          no end. Fear God and keep his commands — this is the whole of the human. The vapor was not
          cancelled. The charge does not wait until hebel feels resolved.
        contemplation: "The last gate commits: one charge, not a finished catalogue of Qoheleth."
        gate_practice: >
          Close one extra tab of spiritual reading. Keep one concrete command you already know —
          a word, a repair, a restraint — for the rest of the day. Do not add a new system.
        passed_when: "You can keep one known charge without using more books to postpone it."
