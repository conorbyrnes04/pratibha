path_id: yoga_spandakarika_tremor
work_id: yoga_spandakarika
work_title: Spandakārikā
title: "The Sacred Tremor"
tradition: Kashmir Śaivism
covers: "Spandakārikā 1, 2, 8, 20, 21, 22, 36, 51 — vibration as method, not a digest of all kārikās"
status: complete

# Initiatic method-walk. Do not restate recognition (PHR / Śiva Sūtra / VBT).
# The student already has those tracks. This walk trains attending to the pulse.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Model consciousness as pulse — unmeṣa and nimeṣa — not as a static witness
  and not as excitement. Never conclude "you are Śiva." Instruct the noticing
  of a tremor already occurring in this body-mind. Do not treat spanda as a
  metaphor for mood, and do not treat this walk as a second recognition path.
  Give an act of attending today.

premise: >
  Recognition named what you are. This walk trains how consciousness actually
  behaves: as vibration. Creation and return are one pulse of eyelids. The same
  tremor that liberates also binds when you ride only the outward phase.
  Method is fieriness toward the tremor in waking, including anger and the
  running body — until arising and dissolving no longer happen to you.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."
  - "If you hear yourself concluding identity, return to the pulse in this minute."

gates:
  - gate_id: gate_0_eyelids
    name: "The world as a pulse of eyelids"
    theme: "Opening and closing are not cosmic events out there. They are the rhythm of this awareness."
    why_first: >
      If unmeṣa-nimeṣa remain a story about Śakti's eyes in the sky, later
      fieriness is just enthusiasm and extreme states are just weather. The
      text opens by making appearance and withdrawal one gesture of the pulse.
    stations:
      - station: 1
        unit_id: yoga_spandakarika.sp_01
        reference: "Spandakārikā 1"
        title: "Opening and closing of the eyes"
        opening_question: "Where am I still watching creation happen somewhere else?"
        transmission: >
          Through whose opening and closing of the eyes the world's dissolution
          and arising occur — that source we praise. This is not a blink
          metaphor and not a cosmology to admire. Unmeṣa is the outward
          unfurling of appearance; nimeṣa is the inward reabsorption. They are
          not sequential events on a timeline. They are the intrinsic breathing
          of awareness. The Śiva Sūtra will name the surge as Bhairava — identity.
          Here you do not conclude the name. You notice the pulse: something
          appearing, something withdrawing, in this looking. The path is not
          transcendence of the world. It is attending to the world-making
          tremor as it is already doing this.
        contemplation: "Feel the turn between appearing and withdrawing. Do not name it Śiva."
        gate_practice: >
          Sit five minutes with ordinary breath. At each turn between in and
          out, notice appearing and withdrawing before you name anything. Do
          not congratulate a recognition. Just keep the pulse in view.
        passed_when: "You can feel unmeṣa-nimeṣa in this awareness, not only as a story about the cosmos."

  - gate_id: gate_1_uncovered
    name: "No obstruction anywhere"
    theme: "The pulse is uncovered. A wall in experience is not a hole in the tremor."
    why_first: >
      After the eyelids, the mind looks for a special place where vibration
      lives. Verse 2 refuses a hidden ground: no nirodha anywhere.
    stations:
      - station: 2
        unit_id: yoga_spandakarika.sp_02
        reference: "Spandakārikā 2"
        title: "No obstruction anywhere"
        opening_question: "What am I still treating as a place the pulse cannot reach?"
        transmission: >
          That in which every effect abides and from which it emerges — because
          its nature is uncovered, there is no obstruction anywhere. Spanda is
          not a gem behind the world. Unlike a ground you reach by negating
          appearance, the pulse remains transparent as the creative pulsation
          itself. Obstruction is never a rupture in the tremor. It is a
          contraction of attention. The method is not to travel to an uncovered
          zone. It is to test the claim here: in this thought, this wall, this
          boredom — is the pulse missing, or have you stopped feeling for it?
        contemplation: "A blockage is a mood of attention, not a hole in the tremor."
        gate_practice: >
          Pick one apparent obstruction today — a stuck thought, a tense
          jaw, a closed door. Ask once: is the pulse absent here, or am I
          contracted? Do not fix the obstruction. Feel for continuity through
          it for one minute.
        passed_when: "You can catch the hunt for a special uncovered place, and test the pulse in an ordinary blockage."

  - gate_id: gate_2_agitation
    name: "Effort cannot purify the pulse"
    theme: "When agitation dissolves, the supreme state is unveiled — not manufactured by a self-improvement project."
    why_first: >
      The ego now tries to produce the pulse by purifying itself. Verse 8
      inverts that: one incapable of self-purification, still desirous of
      actions — when kṣobha dissolves, parama padam is there.
    stations:
      - station: 3
        unit_id: yoga_spandakarika.sp_08
        reference: "Spandakārikā 8"
        title: "When agitation dissolves"
        opening_question: "What purification project am I still running as if it could manufacture the tremor?"
        transmission: >
          When the agitation of one who cannot purify himself by effort, and
          who still wants actions, dissolves — then the supreme state. This
          is not a blank mind and not a prize for discipline. Kṣobha is the
          dualistic ripple, the oscillation of doing and desiring. The verse
          diagnoses the futility of volitional self-purification. It does not
          counsel laziness. It says: the tremor you would earn is already the
          ground under the earning. When the false effort collapses, what
          remains is not void. It is the pulse prior to agitation. Do not
          turn "stop purifying" into a new purification.
        contemplation: "Let agitation subside. Do not improve yourself into the supreme state."
        gate_practice: >
          Name one purification project running today — a better self, a
          cleaner mood, a holier record. Set it down for twenty minutes. Let
          agitation be felt until it lessens without your help. Do not score
          the lessening.
        passed_when: "You can tell unveiling after kṣobha from a self-improvement program that borrowed the word pulse."

  - gate_id: gate_3_binds
    name: "The same pulse binds"
    theme: "Bondage is not lack of vibration. It is riding only the outward phase and calling that life."
    why_first: >
      This is the gate that keeps Spanda from becoming recognition in other
      clothes, and from becoming a cult of excitement. The tremor that
      liberates is the mechanism of saṃsāra for the unawakened intellect.
    stations:
      - station: 4
        unit_id: yoga_spandakarika.sp_20
        reference: "Spandakārikā 20"
        title: "The same pulse binds"
        opening_question: "Where am I still taking surge, mood, or enthusiasm as proof of awakening?"
        transmission: >
          The vibration that is the ground of liberation is also how the
          unawakened get lost. They do not lack spanda. They identify with
          the outward-moving phase — unmeṣa toward objects — and miss the
          inward turn that would show the pulse as their own looking. Cyclic
          existence is not imposed from outside. It is this mis-taking of the
          surge. So: excitement is not the method. Mood is not the tremor.
          Suppressing the pulse is also not the method. Attend to both
          phases. The bind is riding only the going-out and calling it life.
        contemplation: "Name the outward surge without celebrating it as arrival."
        gate_practice: >
          At the next craving, anger, or spiritual high, silently mark:
          outward phase. Do not act on the story for ninety seconds. Feel
          whether any inward return is already happening. Do not congratulate
          a mood.
        passed_when: "You can tell the binding surge from the pulse, and stop treating excitement as awakening."

  - gate_id: gate_4_fieriness
    name: "Fieriness toward the tremor"
    theme: "Method is constant discernment of the vibration in waking — not a conclusion held in trance."
    why_first: >
      After the bind is named, the text gives the act: satatam udyuktaḥ —
      constantly engaged in discerning spanda-tattva, even in the waking
      state, without delay.
    stations:
      - station: 5
        unit_id: yoga_spandakarika.sp_21
        reference: "Spandakārikā 21"
        title: "Fieriness toward the tremor"
        opening_question: "Where am I still saving the pulse for the cushion, or holding a conclusion instead of discerning?"
        transmission: >
          Therefore one constantly engaged in discerning the reality of the
          vibration attains one's own nature even in waking, without delay.
          Fieriness here is not frenzy. It is sustained turning of attention
          toward the throb that is already the ground of knowing. The waking
          state is singled out because the world looks most solid there.
          You do not need another state. You need the discernment that the
          solid-looking world is pulsing. Do not hold "I am That" as a
          souvenir from another path. Discern the tremor in this walking,
          this washing, this sentence.
        contemplation: "Discern now, in waking. A stored conclusion is not the method."
        gate_practice: >
          Choose one ordinary waking hour. Each time you remember, return
          attention to the subtle throb in the body-mind — not a trance, not
          a slogan. When you forget, return. Count no states.
        passed_when: "You can discern the tremor in ordinary waking, without postponing it to meditation or to an identity-claim."

  - gate_id: gate_5_extremes
    name: "Anger, joy, the running body"
    theme: "The pulse is already established in the state you are in. Do not wait for calm, and do not hunt spikes."
    why_first: >
      Fieriness now has to survive weather. Verse 22 lists extreme anger,
      intense joy, what-shall-I-do, and running — whatever state one reaches,
      there the vibration is established.
    stations:
      - station: 6
        unit_id: yoga_spandakarika.sp_22
        reference: "Spandakārikā 22"
        title: "Anger, joy, the running body"
        opening_question: "Am I still waiting for a calm state to practice — or chasing intensity as if it were the path?"
        transmission: >
          Whether in extreme anger, intense joy, the deliberating mind, or
          running — whatever state one reaches, there the vibration is
          established. The verse does not prescribe a state to cultivate. It
          forbids postponement. Spanda is not confined to absorption. The
          hinge of opening and closing operates in the spike. Practice that
          only works when you are settled is not this method. Practice that
          hunts anger and rapture for a thrill is also not this method. At
          the state you are already in, locate the tremor. That is the
          instruction.
        contemplation: "This state. Not a better one. Locate the pulse without riding the story."
        gate_practice: >
          At the next spike — anger, joy, hurry, or the scramble of what
          shall I do — pause inside it. Locate the vibration in the body.
          Do not finish the story for ten breaths. Then complete the next
          necessary action at ordinary speed.
        passed_when: "You can find the tremor in a spike without waiting for calm and without collecting intensity."

  - gate_id: gate_6_missed
    name: "Catch what escaped"
    theme: "The method is seizing the power in the manner it already exists — like looking again at what you missed."
    why_first: >
      Extremes can still make the pulse seem like a special object. Verse 36
      gives the analog: what escaped attention is clearer when you make the
      effort to see it from all angles. Seize that power as it already stands.
    stations:
      - station: 7
        unit_id: yoga_spandakarika.sp_36
        reference: "Spandakārikā 36"
        title: "Catch what escaped"
        opening_question: "Am I still staring at 'the pulse' as an object I could miss or possess?"
        transmission: >
          Just as an object that escaped attention is more clearly perceived
          when you make the effort to see it better from all angles, so the
          tremor appears when you ardently strive toward it. The kārikā's
          own wording: that which exists, in whatever manner and wherever,
          through whatever means — when one seizes that very power in that
          very way, it is not long before it unfolds. You do not construct
          a new state. You align with the potency already operating as
          looking, in the manner it already is. Staring at a thing called
          spanda is how you lose it. Looking again at what you missed is
          how you catch it.
        contemplation: "Look again. The power is seized in the way it already exists."
        gate_practice: >
          Name one thing that escaped attention today — a person's tone, a
          bodily signal, a word you spoke. Look again from another angle for
          two minutes. That second look is the method. Do not hunt a mystical
          object behind it.
        passed_when: "You can catch the pulse by looking again at what you missed, not by staring at a thing called vibration."

  - gate_id: gate_7_wheel
    name: "The pulse no longer happens to you"
    theme: "Fruition is inhabiting arising and dissolving — not becoming a magician, and not a second 'I am Śiva.'"
    why_first: >
      The walk ends where the kārikā ends the method: established in that
      one, restraining dissolution and arising, one attains the status of
      experiencer and becomes lord of the wheel. Keep this from collapsing
      into PHR's identity-claim or into occult control.
    stations:
      - station: 8
        unit_id: yoga_spandakarika.sp_51
        reference: "Spandakārikā 51"
        title: "Lord of the wheel"
        opening_question: "Am I still waiting for the rhythm to happen to me — or hoping to become someone who controls it?"
        transmission: >
          When one is firmly established in that one reality, then by
          bringing dissolution and arising under measure, one attains the
          status of experiencer, and thereby becomes lord of the wheel.
          Niyacchan is not annihilating the cosmic rhythm and not a
          magician's grip on other people. It is ceasing to be the puppet
          of laya-udaya. Thoughts still arise and dissolve. You inhabit the
          rhythm instead of being thrown by it. PHR will say the universe
          is the body of Śiva — a recognition conclusion. Here the
          instruction remains kinetic: stay established in the tremor until
          manifestation and return are no longer an accident that befalls
          you. Do not collect lordship as a new self.
        contemplation: "Inhabit the rhythm. Do not become a character who owns it."
        gate_practice: >
          Sit five minutes and watch one thought arise and dissolve without
          being thrown into its story. When the body wants to become the
          lord of the thought, return to the pulse. Then stand and do one
          ordinary action at the speed of that watching.
        passed_when: "You can inhabit arising and dissolving without being their puppet and without a new identity called lord."

coda:
  title: "Where the path continues"
  text: >
    Complete as a method-walk. The remaining kārikās can support later
    stations if a second Spanda track is ever warranted; do not pad this
    one. VBT's hundred and twelve doorways remain the catalogue of entries
    into this pulse — walk them after, not as a restatement. Lallā's vakhs
    are living speech on the same trail; they must not become a third
    recognition path.
  next_gates:
    - the-112-doorways
