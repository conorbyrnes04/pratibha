path_id: straight_speech
work_id: tantrasara
work_title: Tantrasāra
title: "Straight Speech"
tradition: Trika / Abhinavagupta
covers: "Āhnikas 1–5 and 7.2 — ṛju vacana, two ignorances, anupāya, reflection, sat-tarka, āṇava, mantra, knowledge beyond procedure"
status: complete

# Later Trika deepening. Abhinavagupta's straight speech. Not a second PHR,
# and not a restatement of the Śiva Sūtra's three doors as recognition.
# Architecture: marrow without ornament; ignorance as split; means according
# to ripeness; world as reflection; thought as Śakti; honest descent into
# supports; mantra as breath; knowledge not aimed at procedure.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Use ṛju vacana. Do not pad. Do not turn this walk into another recognition
  treatise. Give the means that fits the present contraction, then stop talking.

premise: >
  You are not collecting a second map of Consciousness. You are taking
  Abhinavagupta at his word: the ocean of Tantrāloka is here as marrow, in
  straight speech. Diagnose the two ignorances. Hear anupāya as a description
  of ripeness, not a ladder you skip by claiming it. See the world as
  reflection, not a mistake. Use right reasoning as Śakti. Descend into āṇava
  when thought needs a handle. Hear mantra as Śiva's breath. End where
  knowledge is not aimed at procedure.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."
  - "If you start adding commentary to prove you understood, you have left straight speech."

gates:
  - gate_id: gate_0_rju
    name: "Straight speech"
    theme: "Marrow, not more commentary."
    why_first: >
      Abhinava opens by refusing the ocean as the required entrance. If more
      commentary is the path, Tantrasāra has already failed.
    stations:
      - station: 1
        unit_id: tantrasara.ts_002
        reference: "Tantrasāra 1.2"
        title: "Essence in Straight Speech"
        opening_question: "What extra layer am I still adding so I do not have to hear the claim?"
        transmission: >
          Tantrāloka is vast. Not everyone can dive to the floor. Therefore
          listen to this essence, composed in ṛju vacana — speech that does not
          hide. The difficulty: more commentary is the path. You stall by
          collecting apparatus. Straight speech is not a watered summary. It is
          the marrow offered so a practitioner can digest it. The act is to
          hear one claim and stop decorating it.
        contemplation: "Transmission, not impressiveness."
        gate_practice: >
          Read the verse once. Close it. Say the claim in one sentence of your
          own, without quoting and without a footnote. If a second sentence
          wants to explain the first, cut it. Sit with the first.
        passed_when: "You can hold the marrow as one heard claim, without reaching for more commentary."

  - gate_id: gate_1_ajñana
    name: "Two ignorances"
    theme: "Ajñāna is a split in knowing, not missing facts."
    why_first: >
      After the tone is set, diagnosis. If ignorance is lack of information,
      the rest of the book becomes a syllabus.
    stations:
      - station: 2
        unit_id: tantrasara.ts_004
        reference: "Tantrasāra 1, prose"
        title: "Knowledge and Ignorance"
        opening_question: "What fact am I still hunting so I do not have to see the split?"
        transmission: >
          Ignorance is not lack of information. It is a split in knowing.
          One strand lives in the intellect: uncertainty, or certainty aimed
          wrong — taking body, mind, or breath as the Self. The deeper strand
          is the Self's habit of appearing limited, a stream of contracted
          thoughts. That is the root of wandering. The difficulty is treating
          this as a research gap. Decisive knowledge in the intellect is
          primary because even a rite cannot work without knowing what to
          drop and what to take up. Vikalpa, seen clearly, can lead back.
          Vague spirituality will not.
        contemplation: "Two strands: wrong certainty, and the contraction that keeps producing it."
        gate_practice: >
          Name one wrong certainty (body, role, or mood as what you are) and
          one looping story. Write them as two lines, not one "I don't know
          enough." For ten breaths, hold the split without googling a third
          fact to close it.
        passed_when: "You can point to ignorance as a split in knowing, not as missing information."

  - gate_id: gate_2_anupaya
    name: "No means"
    theme: "Anupāya describes ripeness. It is not a ladder everyone must claim."
    why_first: >
      Once ignorance is split, the text names the one for whom means have
      already fallen away. Steal this as a technique and you lie.
    stations:
      - station: 3
        unit_id: tantrasara.ts_008
        reference: "Tantrasāra 2.2"
        title: "The One for Whom No Means Is Needed"
        opening_question: "Where am I claiming the pathless path so I do not have to use the means I actually need?"
        transmission: >
          When śaktipāta is firm, a single word lands and absorption is
          ever-arisen, without means. You cannot attain what is not absent.
          You cannot know Śiva as an object. You cannot unveil light from
          itself. You cannot enter where there is no second enterer. The
          difficulty: everyone needs the same ladder — or the reverse lie,
          that you are already the no-means type. Anupāya is a description of
          ripeness, not a costume. If "I am here, He is there, I must get
          there" is still your project, you are not in this chapter as a
          method. You are being shown why that project collapses when it
          collapses — and told not to fake it.
        contemplation: "No-means is not a skip. It is what remains when the project of getting-there dies."
        gate_practice: >
          Catch one live project of the form I am here, the goal is there, I
          must get there. Ask, without performing an answer: what could a
          means accomplish for what is not absent? Do not skip your actual
          practice today. Notice whether you were about to claim no-means as
          a shortcut.
        passed_when: "You can tell a description of ripeness from a costume of no-means, and not force either on yourself."

  - gate_id: gate_3_reflection
    name: "World as reflection"
    theme: "The universe shines in the Lord's light. It is not a mistake to delete."
    why_first: >
      If anupāya emptied the world, Abhinava would be an illusionist. He is
      not. Pratibimba is how the many appear in the sky of awareness.
    stations:
      - station: 4
        unit_id: tantrasara.ts_010
        reference: "Tantrasāra 3.6"
        title: "World as Reflection"
        opening_question: "What in my field am I still trying to erase so that awareness can be 'pure'?"
        transmission: >
          Taste in the mouth is not the food. An echo is not the original
          sound. A reflection cannot appear on its own; it shows up in a
          medium. So the universe shines in the light of the Supreme Lord.
          The difficulty: the world is a mistake to delete. Abhinava refuses
          an external original the reflection copies, and he refuses
          causeless illusion. The cause is svātantrya — freedom appearing as
          many. Do not trash the room. Catch how a sensation cannot stand
          alone, and let that be the doorway when the undivided circle is too
          vast to enter.
        contemplation: "Reflection is dependent appearing, not a stain to scrub."
        gate_practice: >
          Take one present sensation — taste, ache, or a sound that returns.
          Notice it cannot appear on its own. Do not delete it. Rest five
          breaths with it as a reflection in the open field of awareness.
          Leave the world standing.
        passed_when: "You can meet one appearance as reflection in awareness, without treating the world as an error to remove."

  - gate_id: gate_4_tarka
    name: "Right reasoning"
    theme: "Thought is Śakti's path when it cuts duality. Thought is not always the enemy."
    why_first: >
      Śāktopāya works in and with mind. If thought is always the enemy, you
      have already left Abhinava for a quieter religion.
    stations:
      - station: 5
        unit_id: tantrasara.ts_012
        reference: "Tantrasāra 3.34 / Āhnika 4"
        title: "Right Reasoning as Śakti's Path"
        opening_question: "Which thought am I still trying to kill that might be the medicine?"
        transmission: >
          You feel bound because of the stories you believe. Those stories are
          vikalpas. The same power, turned back toward its source, becomes
          medicine. Sat-tarka is not debate. It is thinking that always tends
          toward non-duality: this too appears in me. Scripture and a true
          instruction seed living concepts; they do not load new dogmas. The
          difficulty: thought is always the enemy. Here you do not stop
          thinking. You notice which thoughts thicken the small-I and which
          melt it. Let thought disenchant itself. Do not smash the instrument.
        contemplation: "The counter-current is Śakti working through vikalpa."
        gate_practice: >
          For one sitting, do not suppress thought. Each time a small-I story
          appears, answer once, quietly: this too appears in me; I am the
          awareness that knows it. Then stop. Do not start a second argument.
        passed_when: "You can use one thought as a cut toward non-duality, instead of treating all thinking as the obstacle."

  - gate_id: gate_5_anava
    name: "When thought needs support"
    theme: "Āṇava is skillful limitation. Needing a handle is not failure."
    why_first: >
      Most of the time vikalpa does not flip by itself. Abhinava talks to the
      rest of us. Descent is honesty, not demotion.
    stations:
      - station: 6
        unit_id: tantrasara.ts_015
        reference: "Tantrasāra 5.1"
        title: "Descent into Āṇava"
        opening_question: "What support am I ashamed to need, as if shame were purity?"
        transmission: >
          When thought cannot purify itself, you need handles: a body to sit
          in, a breath to ride, a syllable, a form. This is āṇavopāya — start
          where you feel small. The difficulty: needing support is failure.
          Abhinava is respectful. Used consciously, the handle is a bridge.
          Clung to as the final truth, it is another prison. Skillful
          limitation reveals the limitless. Take the support you actually
          need today. Do not pretend you are in no-means because pride hates
          a cushion.
        contemplation: "The yoga of handles: use the limit, do not worship it."
        gate_practice: >
          When the loop "I am this body, these duties, this story" is running,
          pick one handle for ten minutes — posture, counted breath, or one
          syllable — as a bridge, not as the identity. When the ten minutes
          end, set the handle down and see whether thought is slightly less
          glued. Do not apologize for the handle.
        passed_when: "You can take a support without treating the need as spiritual failure."

  - gate_id: gate_6_mantra
    name: "Mantra as breath"
    theme: "Syllable is Śiva's pulse in the throat, not a spell for results."
    why_first: >
      Āṇava's most ordinary handle is sound. If mantra stays a spell, the
      handle never becomes breath.
    stations:
      - station: 7
        unit_id: tantrasara.ts_018
        reference: "Tantrasāra 5.26"
        title: "Mantra as Breath of Śiva"
        opening_question: "What result am I still hiring the syllable to produce?"
        transmission: >
          At first you move the mouth, ride the breath, repeat. Useful. Then
          meaning drops back, and you feel a pulse in heart, throat, lips.
          The same conscious ripple runs through sacred syllables and street
          noise. In the resting-place of utterance, the supreme vibration is
          that in which the knowable has dissolved, is emerging, has emerged.
          The difficulty: mantra is a spell for results. Hear whatever sound
          is arising as varṇa in Śiva's own throat. The aim is not fireworks.
          The aim is to love the ripple more than the storyline.
        contemplation: "Count for a while. Then let counting become hearing."
        gate_practice: >
          Speak one syllable with the breath, twelve times, no petition
          attached. Then sit one minute and hear a non-sacred sound — a pipe,
          a voice, inner talk — as the same ripple. Do not ask either sound
          for a result.
        passed_when: "You can hear one mantra and one ordinary sound as the same pulse, without hiring them for an outcome."

  - gate_id: gate_7_beyond
    name: "Knowledge beyond procedure"
    theme: "Jñāna is not aimed at prakriyā. You do not graduate into a new identity."
    why_first: >
      The last gate seals the walk: knowing is not defined by mastery of a
      sequence. Keep the methods. Stop making them the knowledge.
    stations:
      - station: 8
        unit_id: tantrasara.ts_ah_07_02
        reference: "Tantrasāra 7.2"
        title: "Knowledge Beyond Procedure"
        opening_question: "What sequence am I still treating as the knowing it was meant to serve?"
        transmission: >
          Knowledge is not directed toward procedure. The line does not condemn
          methods. It says jñāna is not exhausted in, defined by, or aimed at
          the sequence. The difficulty: you graduate from methods into a new
          identity — the one who has outgrown practice, the one with a better
          self. Straight speech refuses that theatre. Keep the exercise if you
          need it. Do not let completing it correctly become the knowledge
          sought. The last gate of this walk is the same as the first: hear
          the claim, do the act, stop decorating.
        contemplation: "Procedure may remain. It is not the aim of knowing."
        gate_practice: >
          Before a familiar spiritual exercise, pause. Notice the wish to
          complete it correctly. Rest several breaths without producing a
          result. Then perform the exercise without treating the sequence
          itself as the knowledge. Do not announce that you have graduated.
        passed_when: "You can do a method without aiming knowledge at the procedure, and without claiming a new identity."

coda:
  title: "Where the path continues"
  text: >
    Complete as a straight-speech walk through selected āhnikas. Later
    chapters of Tantrasāra can extend the same ṛju vacana. Do not restart
    the Heart of Recognition or the Śiva Sūtra's three doors under a new title.
  next_gates: []
