path_id: the_sacred_tremor
work_id: yoga_spandakarika
work_title: Spandakārikā
title: "The Sacred Tremor"
tradition: Kashmir Śaivism / Spanda
covers: "Kārikās 1, 2, 12–13, 21, 22, 31, 36, 50 — vibration as method, not as a second recognition doctrine"
status: complete

# Initiatic sequence. Architecture: catch the pulse; the world is Śakti's
# glance; tremor is creation-and-return; you do not manufacture it.
# Do not restate PHR or the Śiva Sūtra's sudden door. Spanda is a kinesthetic
# method: the uncovered throb already operating as your waking life.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Catch the pulse. Do not lecture them into being the witness behind the world.
  The tremor is already the place of creation and return; they do not generate it.

premise: >
  You are not learning a finer ontology of Consciousness. You are training a
  method: to catch the sacred tremor where it already moves — in the glance that
  makes a world, in waking activity, in anger and joy, in objectless desire —
  until establishment in that pulse is the practice, not a doctrine you still
  need to replace.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."
  - "If you start explaining the tremor, you have left the method. Return to the pulse."

gates:
  - gate_id: gate_0_glance
    name: "She opens her eyes"
    theme: "The world is Śakti's glance, not a show in front of a static witness."
    why_first: >
      The kārikās open with unmeṣa-nimeṣa: she opens her eyes and the universe
      is reabsorbed; she closes them and it appears within her. If you skip this,
      later gates become sensations you try to manufacture in a private mind.
    stations:
      - station: 1
        unit_id: yoga_spandakarika.sp_01
        reference: "Spandakārikā 1"
        title: "She Opens Her Eyes"
        opening_question: "Where am I still standing behind the world as a still watcher?"
        transmission: >
          Creation and dissolution are not events out there. They are the opening
          and closing of Śakti's eyes — the same pulse as your own aware presence
          unfurling into a world and drawing it back. The difficulty is that you
          want a static witness parked behind the show. That posture is already
          the wrong method. Catch the glance: appearance and withdrawal as one
          breathing, not a seer plus a seen.
        contemplation: "The world is her looking, not a painting you stand behind."
        gate_practice: >
          Sit five minutes and follow the breath without improving it. On the
          inhale, notice appearance gathering. On the exhale, notice withdrawal.
          Do not name a cosmic vision. Stay with the pulse before the story.
        passed_when: "You can feel appearance and withdrawal as one glance, not as a still seer plus a moving world."

  - gate_id: gate_1_place
    name: "The place of creation and return"
    theme: "Tremor is the uncovered ground of effects, not a buzz you produce."
    why_first: >
      Once the glance is named, the text locates it: that in which all effect
      abides and from which it emerges. Uncovered. No obstruction anywhere. You
      do not go to a special room to find it.
    stations:
      - station: 2
        unit_id: yoga_spandakarika.sp_02
        reference: "Spandakārikā 2"
        title: "The Place of Creation and Return"
        opening_question: "What tremor am I still trying to generate so I can believe the method is working?"
        transmission: >
          The sacred tremor is the place of creation and return — not a sensation
          you manufacture on the cushion. Its nature is uncovered: nothing in
          manifestation blocks it. The difficulty is that meditation-culture
          trains you to make a feeling and then chase it. Spanda is already the
          space in which this breath, this thought, this room are appearing and
          dissolving. You do not produce the place. You stop covering it with
          effort.
        contemplation: "Obstruction is a contraction of noticing, not a hole in the pulse."
        gate_practice: >
          Pause whatever you are doing. Notice the aware space in which this
          moment — breath, thought, sensation — is already appearing and going.
          Do not improve it. Do not hunt for a buzz. Rest three breaths as the
          uncovered place, not as its manufacturer.
        passed_when: "You can tell the tremor as already-operating ground from a sensation you were trying to generate."

  - gate_id: gate_2_void
    name: "The void is not an object"
    theme: "Imagining emptiness is an artifice. Consciousness cannot contemplate itself as a blank."
    why_first: >
      After locating the tremor, the cheap method arrives: stare at a void.
      The text cuts it. If vacuity could be an object, where would the
      consciousness that perceives it sit?
    stations:
      - station: 3
        unit_id: yoga_spandakarika.sp_12
        reference: "Spandakārikā 12–13"
        title: "The Void Is Not an Object"
        opening_question: "What blank am I still picturing so I can feel I am doing the work?"
        transmission: >
          If the void could be an object of contemplation, where would the
          consciousness that perceives it be? Imagining emptiness is an artifice
          — like the constructed quiet of deep sleep, remembered afterward and
          mistaken for the ground. The difficulty is that "emptiness practice"
          gives the mind a picture to hold. Spanda will not be held as a
          vacancy. Return to the fact of being aware, without adding a story of
          nothingness.
        contemplation: "A pictured void is still an object. The knower is not in it."
        gate_practice: >
          Close the eyes for two minutes. Drop every label, including "empty."
          Each time a picture of blankness arrives, set it down. Return only to
          the immediate sense: I am aware. Add no story.
        passed_when: "You can distinguish being aware from contemplating a vacancy you invented."

  - gate_id: gate_3_fieriness
    name: "Fieriness toward the tremor"
    theme: "Waking activity is the field. Passivity is not the path."
    why_first: >
      The method is not waiting. One constantly engaged in discerning the
      vibration reaches own-nature in the waking state itself, without delay.
    stations:
      - station: 4
        unit_id: yoga_spandakarika.sp_21
        reference: "Spandakārikā 21"
        title: "Fieriness Toward the Tremor"
        opening_question: "Where am I still waiting for the pulse to happen to me?"
        transmission: >
          Fieriness is not strain and not trance. It is sustained discernment of
          the tremor in ordinary waking — eyes open, world present. The
          difficulty is that passivity feels holy: sit still, wait, call the
          waiting surrender. This yoga is not separated from activity. You tend
          toward the pulse on purpose, again, in the middle of the day. You do
          not force a feeling. You keep turning toward the throb that is already
          there.
        contemplation: "Vigilance is the method. Limp waiting is a mood."
        gate_practice: >
          Sit upright with eyes open. Locate the actual throb at the center of
          the chest — not an imagined vibration. Rest there for three natural
          breaths. Each time thought wanders, return. Do not improve the pulse.
          Let it show itself.
        passed_when: "You can tend toward the tremor in waking, without waiting for a special quiet to arrive first."

  - gate_id: gate_4_extreme
    name: "Tremor in the extreme"
    theme: "Anger, joy, deliberation, running — the pulse is already established there."
    why_first: >
      If fieriness only worked on a cushion, it would be another quietism.
      The next kārikā plants the tremor in the states you were going to exclude.
    stations:
      - station: 5
        unit_id: yoga_spandakarika.sp_22
        reference: "Spandakārikā 22"
        title: "Tremor in the Extreme"
        opening_question: "Which live state am I still dismissing as 'not practice'?"
        transmission: >
          Extreme anger, intense joy, the mind asking what shall I do, the body
          in motion — there the vibration is established. The difficulty is the
          piety of calm sitting: only the still hour counts. Spanda does not
          ask you to cultivate a storm. It asks you to catch the pulse in the
          state you have already reached. You do not generate the tremor in
          rage. You notice the aliveness that is already the rage's ground.
        contemplation: "The method is detection in the given state, not a better state."
        gate_practice: >
          The next time anger, joy, or doubt hits the body, pause. Feel the
          exact quality of aliveness — heat, current, tremor — without fixing
          it. Stay with that felt-sense for ten breaths. Then continue the day.
        passed_when: "You can catch the pulse in one extreme or kinetic state, not only in calm sitting."

  - gate_id: gate_5_desire
    name: "Objectless desire"
    theme: "Desire is not always the problem. Wanting without a target is the pulse seeking itself."
    why_first: >
      After extremes, the text turns the seeker's own wanting. The arising of
      what is to be meditated, in the meditator's mind, is the tremor — not a
      later union you earn by killing desire.
    stations:
      - station: 6
        unit_id: yoga_spandakarika.sp_31
        reference: "Spandakārikā 31"
        title: "Objectless Desire"
        opening_question: "What desire am I still treating as a defect to extinguish?"
        transmission: >
          The tantrika's desire is not dampened. What dies is the arrow toward a
          target. Objectless intensity — wanting without a thing to seize — is
          how contemplation appears in the heart already united to the tremor.
          The difficulty is the moral reflex: desire is always the problem.
          Here the arising of the sought in the seeker's mind is the pulse
          itself. You do not fabricate union. You attend to the wanting after
          the object has been dropped.
        contemplation: "Kill the target, not the heat."
        gate_practice: >
          Sit five minutes. Follow the breath. Notice the subtle wanting in
          awareness before you name an object for it. When a target appears —
          a mood, a result, a person — set the target down and stay with the
          heat. Do not smother it.
        passed_when: "You can feel desire without a target, and not treat that heat as a mistake."

  - gate_id: gate_6_recover
    name: "Recovered attention"
    theme: "What escaped notice is clearer when found again. Forcing concentration covers it."
    why_first: >
      The method now names how the pulse comes into view: as the overlooked
      thing, recovered — not as a mind pinned by force.
    stations:
      - station: 7
        unit_id: yoga_spandakarika.sp_36
        reference: "Spandakārikā 36"
        title: "What Escaped Attention"
        opening_question: "Where am I still clamping the mind to make the tremor appear?"
        transmission: >
          An object that escaped attention is clearer when you turn toward it
          from all sides — not because you crushed the mind onto it, but because
          you stopped overlooking. Seize the power in the way it already abides,
          and it unfolds without delay. The difficulty is forced concentration:
          squeeze, hold, call the squeeze yoga. Alignment with how the pulse
          actually sits is the act. Force covers what you meant to recover.
        contemplation: "Recovery is a turning, not a clamp."
        gate_practice: >
          When a sensation, emotion, or thought arises, pause. Feel how it is
          present — texture, location, weight — rather than naming it. Hold
          that quality for three breaths without changing it. Notice what
          deepens on its own. Do not pin the mind to manufacture clarity.
        passed_when: "You can recover an overlooked presence by turning toward it, without forcing concentration."

  - gate_id: gate_7_established
    name: "Established in the tremor"
    theme: "The last gate commits to this method. You do not still need a better doctrine."
    why_first: >
      Fruition is not a new theory. It is remaining in the one pulse until
      dissolution and arising are inhabited rather than suffered.
    stations:
      - station: 8
        unit_id: yoga_spandakarika.sp_51
        reference: "Spandakārikā 50"
        title: "Established in the Tremor"
        opening_question: "What finer teaching am I still shopping for so I do not have to stay with this pulse?"
        transmission: >
          Established in that one, you restrain neither by killing the world nor
          by drowning in it: dissolution and arising come under a knowing hand,
          and you take the enjoyership of the wheel. The difficulty is the last
          evasion — you still need a better doctrine. This gate commits you to
          the method you have been walking: catch the pulse, in waking, in the
          extreme, without manufacturing it. Stay. Do not graduate into a
          commentary that replaces the tremor.
        contemplation: "Lordship here is inhabiting the rhythm, not collecting a new map."
        gate_practice: >
          Choose this method for seven days: once in ordinary waking, once in
          whatever extreme arrives, catch the pulse and rest as the awareness
          in which it appears and disappears, five to ten minutes, without
          grasping. Do not add a second system this week.
        passed_when: "You can stay with the tremor as the method, without reaching for a replacement doctrine."

coda:
  title: "Where the path continues"
  text: >
    Complete as a method-walk through the Spandakārikā. Do not fold it back
    into Pratyabhijñā as if the pulse were only a synonym for recognition.
    Further kārikās can extend the same method; they should not restart the
    Heart of Recognition.
  next_gates: []
