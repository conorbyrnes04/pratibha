path_id: know_yourself
work_id: know_yourself_ibn_arabi_balyani
work_title: Know Yourself (Ibn ʿArabī / Balyānī)
title: "Know Yourself"
tradition: Sufi
covers: "The opening dictum through the treatise's own sequence: no independent self, God as sole existence, the veil of oneness, non-spatial nearness, beyond before and after, God as sole knower, and the refusal to add a doctrine beside the now."
status: complete

# Initiatic sequence, not a family sampler. ky_001 and ky_005 recur as this
# text's own gates 1 and 4 — the opening dictum and the veil — not as the
# whole of The Beloved in Plain Sight.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Do not treat waḥdat al-wujūd as a prize you can hold. Reverse the traveler's
  direction at every gate: God is not an object over there, and a finished
  doctrine is still an object.

premise: >
  You are not collecting a theory of oneness. You are walking Balyānī's
  inference until the "I" that would stand beside God has nowhere to stand.
  Each gate tightens the same claim: what you take to be yourself has no
  independent being; knowledge of the Lord is what remains when that claim
  is seen through.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."
  - "If you catch yourself possessing the teaching as a view, return to the act."

gates:
  - gate_id: gate_0_dictum
    name: "The opening dictum"
    theme: "Self-knowledge is not inventory; it reverses the direction of travel."
    why_first: >
      The treatise begins here. If God remains an object you could go toward,
      every later denial of independent selfhood becomes psychology.
    stations:
      - station: 1
        unit_id: know_yourself_ibn_arabi_balyani.ky_001
        reference: "Opening dictum"
        title: "Knowing your reality is knowing the Lord"
        opening_question: "Where am I still treating God as an object over there?"
        transmission: >
          Whoso knoweth himself knoweth his Lord. This is not moral inventory
          and not a nicer psychology of the soul. The "I" that stands beside
          God has no being of its own; only God truly is. Knowledge of the
          Lord happens when the self's claim to separate reality is seen
          through — not when a traveler finally arrives at a deity over there.
          The nearest thing — your own self — is already the first false distance.
        contemplation: "The claimant is the distance."
        gate_practice: >
          Catch one moment you defend an identity — a role, an opinion, a hurt.
          Ask: what in this claim is truly mine by itself? Leave the question
          unanswered. Do not manufacture a spiritual conclusion.
        passed_when: "You can feel the difference between looking for God and noticing the claimant."

  - gate_id: gate_1_standing
    name: "No independent standing"
    theme: "Thou art not thou: thou art He, without thou."
    why_first: >
      The dictum is still salvageable as self-improvement until the self's
      claim to autonomous reality is named and refused.
    stations:
      - station: 2
        unit_id: know_yourself_ibn_arabi_balyani.ky_002
        reference: "On the self's lack of standing"
        title: "The self has no independent standing"
        opening_question: "What am I still calling 'mine' as if it stood by itself?"
        transmission: >
          Thou art not thou: thou art He, without thou. This is not a human
          turning into God, and not God entering a creature. The self you take
          to stand independently beside God has no self-subsisting existence
          to begin with. "Not thou" negates the ego's claim to autonomous
          reality; "He" affirms that being, wherever it appears, belongs to
          God alone. If you hear this as promotion — I am God — you have
          kept the claimant and given it a holier name.
        contemplation: "The difficulty is that you still want a standing of your own."
        gate_practice: >
          When you say "my" life, ability, or achievement, pause once and
          replace "my" inwardly with "entrusted to me," then act with the
          responsibility that follows. Do not use the phrase as a slogan.
        passed_when: "You can drop one possessive claim without replacing it with a spiritual identity."

  - gate_id: gate_2_existence
    name: "God alone is existence"
    theme: "What is called existence does not belong independently to you or the world."
    why_first: >
      Without this governing claim, "no standing" stays a mood about the ego.
      The treatise now names what alone is.
    stations:
      - station: 3
        unit_id: know_yourself_ibn_arabi_balyani.ky_004
        reference: "On existence"
        title: "God alone is existence"
        opening_question: "Where do I still treat the world, or myself, as a second being beside God?"
        transmission: >
          Know that there is no existence save God. God is not one being among
          other beings. He is the sole Reality by which anything appears to be.
          Self-knowledge is knowledge of the Lord because when you investigate
          the apparently separate "I," its claim to existence is already a
          borrowed name. The difficulty is that you live as if existence were
          a stuff distributed among things. It is not. Things appear; they do
          not independently are.
        contemplation: "Existence is not a pie you share with God."
        gate_practice: >
          When you say "my life" or "my ability," pause once and replace the
          possessive claim inwardly with: "This has no independence from God."
          Then complete the next ordinary task without announcing the insight.
        passed_when: "You can treat one appearance as dependent without erasing it or making it a rival."

  - gate_id: gate_3_veil
    name: "The veil is oneness"
    theme: "Nothing other than He hides Him."
    why_first: >
      If God alone is existence, a created barrier cannot hide God. The
      treatise now names the remaining curtain: oneness itself.
    stations:
      - station: 4
        unit_id: know_yourself_ibn_arabi_balyani.ky_005
        reference: "On the veil"
        title: "The veil is oneness itself"
        opening_question: "What created thing am I still blaming for hiding God?"
        transmission: >
          His veil is only His oneness; nothing veils Him other than He. Matter,
          distance, ego, even a separate cosmos cannot stand between God and
          vision if they have no independent being. The Absolute cannot be set
          before a knower as an object among objects. The curtain you keep
          trying to lift is the impossibility of objectifying the One. Stop
          hunting a second thing — the world, the mind, a teacher — for hiding
          what cannot be placed in front of you.
        contemplation: "No second thing hides God. Oneness itself is the screen."
        gate_practice: >
          When you catch yourself treating God as a distant object to grasp,
          drop every image — near, far, bright, hidden — for one minute. Say
          only: nothing veils Him other than He.
        passed_when: "You can stop hunting a created barrier and sit with the not-object."

  - gate_id: gate_4_nearness
    name: "Nearness is not spatial"
    theme: "The jugular verse is not a map of proximity."
    why_first: >
      After the veil, the mind still tries to locate God as near or far.
      The treatise refuses the coordinates.
    stations:
      - station: 5
        unit_id: know_yourself_ibn_arabi_balyani.ky_008
        reference: "Nearer than the jugular vein"
        title: "Nearness is not spatial"
        opening_question: "Where am I still placing God on a near/far map?"
        transmission: >
          We created man, and We know what his soul whispers to him; and We
          are nearer to him than the jugular vein. Creation does not put the
          Creator at a distance. God knows the self's most inward whisper.
          With God there is no far nor near — spatial relations belong to the
          order of things, not to the Real. If you take the vein as a
          spiritual GPS, you have turned a denial of distance into a new
          location. Nearness here is not a feeling of closeness. It is the
          impossibility of a gap.
        contemplation: "A whisper is not hidden. Neither are you."
        gate_practice: >
          When a private worry or impulse arises, pause before reacting and
          name it silently as a "whisper." Let that recognition remind you
          that nothing in you is hidden from God. Do not improve the whisper
          into a better thought.
        passed_when: "You can tell non-spatial nearness from a mood of closeness."

  - gate_id: gate_5_before
    name: "Beyond before and after"
    theme: "Time-words cannot stand outside Him as independent coordinates."
    why_first: >
      Space has been refused. Time is the remaining frame in which a self
      could still claim to have been, to become, to arrive.
    stations:
      - station: 6
        unit_id: know_yourself_ibn_arabi_balyani.kys_p001
        reference: "Opening doxology of the longer redaction"
        title: "Beyond every before and after"
        opening_question: "Where am I still parking God in a then or a later?"
        transmission: >
          Praise be to God, before whose oneness there was no before, unless
          the Before was He; and after whose singleness there is no after,
          unless the After is He. He is now as He was. Before and after cannot
          stand outside Him as independent coordinates; neither can height and
          depth, nearness and distance, or the questions how and where. God is
          not an item that survives through time. The difficulty is that you
          keep a timeline on which a seeker will later meet a God who was
          waiting. There is no such corridor.
        contemplation: "He is now as He was — not a survivor of history."
        gate_practice: >
          When you notice yourself saying "God is far away" or "God was there
          then," pause once and silently release the spatial or temporal image.
          Attend to the fact that the awareness making the judgment is itself
          not self-created.
        passed_when: "You can drop one then/later picture without replacing it with a spiritual calendar."

  - gate_id: gate_6_knower
    name: "God alone knows and veils God"
    theme: "There is no second knower standing outside."
    why_first: >
      If time-words fail, the last shelter is the student-as-knower. The
      treatise removes that standpoint.
    stations:
      - station: 7
        unit_id: know_yourself_ibn_arabi_balyani.kys_p007
        reference: "On divine self-knowledge"
        title: "God alone knows and veils God"
        opening_question: "Where am I still trying to be the one who knows God?"
        transmission: >
          By Himself He sees Himself, and by Himself He knows Himself. None
          sees Him other than He. His veil is only a part of His oneness;
          nothing veils other than He. Divine self-knowledge has no second
          knower standing outside God. The veil is not sin, matter, or
          distance. It is the non-duality that prevents the Absolute from
          becoming an object. If you still hope to possess certainty about
          God, you are auditioning for a job the treatise says does not exist.
        contemplation: "The knower is not independent."
        gate_practice: >
          When you notice yourself trying to possess certainty about God,
          pause for one minute and say inwardly: "The knower is not
          independent." Then meet one person without reducing them to an
          object of your judgment.
        passed_when: "You can catch the wish to be the knower and set it down for a minute."

  - gate_id: gate_7_closer
    name: "Nothing stands alongside"
    theme: "A doctrine of oneness cannot be added to God."
    why_first: >
      The last error of a sequential treatise is to leave holding the
      teaching as a second thing. Nothing can be added to the Real.
    stations:
      - station: 8
        unit_id: know_yourself_ibn_arabi_balyani.kys_p034
        reference: "On existence as nothing alongside"
        title: "Nothing stands alongside the eternal now"
        opening_question: "What doctrine am I still trying to add to God as proof I finished?"
        transmission: >
          Thine existence is nothing, and nothing cannot be added to something.
          You are not a second reality which first exists and then must be
          annihilated. What is taken as self-subsisting existence is nothing
          in the first place; hence it cannot receive lasting or passing as
          its own. The Prophet's pointing is that you are non-existent now as
          you were before the Creation. Now is past eternity and future
          eternity — not because you occupy them, but because God is the
          existence of both, and they have none of their own. If you leave
          this walk possessing a doctrine of oneness, you have reconstructed
          the second thing eight gates were dissolving.
        contemplation: "You cannot add a conclusion to God."
        gate_practice: >
          When you say "my time" or "my life," or catch yourself rehearsing
          this teaching as a view you now hold, pause once and replace the
          possessive with gratitude: "This moment does not stand by itself;
          it is received from God." Do one ordinary act of care without
          making it proof of a completed path.
        passed_when: "You can tell holding a doctrine of oneness from not adding a second thing."

coda:
  title: "Where the path continues"
  text: >
    This walk is the treatise's architecture, not the Sufi family sampler.
    Kashf stations, the seven valleys, and Rūmī's living speech are other
    roads. Do not stack them as further proof that you now know.
  next_gates: []
