path_id: psalms_tehillim_address
work_id: psalms_tehillim
work_title: Psalms (Tehillim)
title: "Before the Face"
tradition: Christian mysticism / Hebrew
covers: "Psalms 8, 19, 23, 42, 46, 63, 91, 131, 139 — selected Tehillim, not the whole Psalter"
status: complete

# Living speech as prayer-address (model: the-horse-of-conversation).
# Cataphatic after divine-darkness and the-living-saying. Not ACIM, not Qoheleth,
# not another unknowing walk. Each gate is a psalm that must be spoken, not studied.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Model the second person: you are speaking TO the Face, not lecturing about God.
  Lament is still address. Do not convert it into a mood report or a third-person
  essay. Praise is not décor and not a feeling you owe. Give the act of speaking
  the psalm. Do not import the Cloud's unknowing or the living saying's kingdom
  as if they were this walk. This walk is names, thirst, drop, weaned quiet.

premise: >
  After darkness and the living saying, the Christian trail still has a mouth that
  must speak to Someone. Tehillim trains address: creature under the night, two
  luminaries sewn as one lyric, accompaniment in the valley, thirst that is
  theology, the grip that must drop, clinging in a dry land, refuge that is not
  a charm, weaned quiet, the Face you cannot flee. You are not collecting psalms.
  You are refusing to talk about God as a specimen.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and speak the psalm."
  - "Do not advance until passed_when is honestly true."
  - "If you catch yourself explaining God in the third person, return to You."

gates:
  - gate_id: gate_0_creature
    name: "Creature under the night"
    theme: "Smallness and entrusted rule are the same vision. Praise still has milk on its mouth."
    why_first: >
      If you skip the gasp, later praise becomes a performance and later lament
      becomes a complaint about a God you have already sized. Psalm 8 puts you
      under the night before Psalm 19 dares two suns.
    stations:
      - station: 1
        unit_id: psalms_tehillim.psalm_008
        reference: "Psalm 8"
        title: "What is a human that you remember"
        opening_question: "Where am I still turning wonder into a theory of myself?"
        transmission: >
          The psalm is a gasp that refuses two exits: humility-as-self-hatred,
          and dominion-as-license. Under the night you shrink: what is a human
          that you remember. Memory here is not nostalgia. It is the scandal that
          infinite attention would bother with this brief animal. Then the turn
          without apology: a little less than elohim, crowned, given the works.
          You do not earn the crown by forgetting you are dust, and you do not
          honor the dust by pretending the night is empty. Infants who found
          strength are the epistemology: praise is not the mature correction of
          wonder. It is wonder that still has milk on its mouth.
        contemplation: "Speak from under the night. Do not write an essay on the human."
        gate_practice: >
          Stand at a window or under actual sky. Speak the gasp aloud once —
          what is a human that you remember — without improving it into a
          theory. Then do one entrusted act with what is already in your hands,
          as someone crowned who is still dust.
        passed_when: "You can feel smallness and entrusted work as one vision, not as a mood swing."

  - gate_id: gate_1_two_suns
    name: "Two luminaries, one lyric"
    theme: "The sky speaks without a mouth. Torah restores a particular soul. Do not split them."
    why_first: >
      Psalm 19 is the required hero of this ingest. After creatureliness, the
      walk needs both sermons: wordless cosmos and the teaching that turns the
      life-breath back. Skip the seam and you get sky-religion or book-religion.
    stations:
      - station: 2
        unit_id: psalms_tehillim.psalm_019
        reference: "Psalm 19"
        title: "A tent for the sun"
        opening_question: "Which sermon am I still treating as optional — the sky, or the teaching?"
        transmission: >
          Two luminaries sewn into one lyric, and the seam is the point. The
          heavens recount glory with no speech. In that wordless telling God
          pitches a tent for the sun: bridegroom, runner, heat from which
          nothing hides. Then, without apology, a second sun: the teaching of
          YHWH complete, turning the life-breath back, lighting particular
          eyes. Torah does what the sky cannot. Gold and honey name desire, not
          decoration. The same light that circuits the heavens wants the inner
          wanderings cleansed. The last petition is the murmur of the heart
          coming before the Face as the sky already does. Rock and kinsman —
          not a distant artisan of suns.
        contemplation: "Hear both sermons. Do not choose a religion of sky or a religion of statute."
        gate_practice: >
          Hear one wordless testimony today — heat, bird, sky — for one minute
          without making a sentence of it. Then perform one commandment-sized
          act the same day: a truth told, a repair made, a wandering named
          before the Face.
        passed_when: "You can receive the sky and the teaching as one light, not as two optional faiths."

  - gate_id: gate_2_accompaniment
    name: "You, in the valley"
    theme: "Shepherding is accompaniment, not exemption. Theology becomes address when the shadow is close."
    why_first: >
      After two suns, the walk has to enter a body that lacks. Psalm 23 will not
      let provision mean the valley was cancelled.
    stations:
      - station: 3
        unit_id: psalms_tehillim.psalm_023
        reference: "Psalm 23"
        title: "You are with me"
        opening_question: "Where am I still bargaining for exemption instead of accompaniment?"
        transmission: >
          The first verb is not I follow. It is I do not lack. Shepherding is
          provision so complete that craving loses its job. The turn from he
          to you happens in the valley: theology becomes address when the
          shadow is close. Rod and staff comfort because they are contact, not
          because pain has been cancelled. The table in the face of foes is the
          scandal: nourishment is not postponed until the enemies leave. Loyalty
          hunts the wanderer down. Length of days in the house is remaining in
          the presence that made lack impossible — not a real-estate promise.
        contemplation: "Speak You when the shadow is close. Do not wait for the valley to empty."
        gate_practice: >
          In one actual difficulty today, switch from talking about God to
          three sentences of You. Walk the next hour without bargaining that
          the difficulty be removed as proof of being shepherded.
        passed_when: "You can tell accompaniment from an insurance policy, and speak You in the valley."

  - gate_id: gate_3_thirst
    name: "Thirst is theology"
    theme: "The mystical psalm is the one that still asks when it will see the Face, and waits anyway."
    why_first: >
      Address now has to survive absence. If thirst is managed as a mood, later
      dropping-the-grip will be a technique and clinging will be self-care.
    stations:
      - station: 4
        unit_id: psalms_tehillim.psalm_042
        reference: "Psalm 42"
        title: "Deep calls to deep"
        opening_question: "Am I waiting to feel better before I will speak?"
        transmission: >
          Thirst is the first theology. The deer is not decoration; the
          throat-being pants. Exile from the Face is measured in tears-as-bread
          and in the taunt Where is your God — a question the singer also has.
          He lectures his own nephesh to wait, then admits it is still down,
          then lectures again. Memory of the festival is fuel that also burns.
          Deep calls to deep: chaos-water is correspondence, abyss answering
          abyss, while breakers pass over. The mystical psalm is not the one
          that has arrived. It is the one that still asks when it will see the
          Face, and teaches its own soul to wait anyway.
        contemplation: "Speak thirsty. Do not wait for a better mood to count as prayer."
        gate_practice: >
          When a dry hour comes, speak one sentence to the Face before you
          manage the mood. Then tell your nephesh once to wait — and notice,
          without correcting it, if it is still down.
        passed_when: "You can pray thirsty, and tell the difference between waiting and postponing speech."

  - gate_id: gate_4_drop
    name: "Slack the hands"
    theme: "Knowledge arrives after the grip drops. Stillness is not décor."
    why_first: >
      After thirst, the hands are still saving the mountains. Harpu u-de'u:
      drop, and know. If you skip this, refuge in Psalm 91 becomes a charm you
      grip harder.
    stations:
      - station: 5
        unit_id: psalms_tehillim.psalm_046
        reference: "Psalm 46"
        title: "Drop, and know"
        opening_question: "What am I still gripping so that I will not have to know?"
        transmission: >
          Cosmos unravels: earth changing, mountains into the sea's heart. The
          still point is not stoic temperament. It is presence in a place: God
          in the city's midst, so she does not totter. Nations roar like the
          waters roared. The famous line is harpu u-de'u: drop, slack your
          grip, and know that I am God. Knowledge here is what happens when
          the hands stop saving the mountains. It is not a seminar. Cessation
          of war is God's work in the song, not a peace plan the psalm is
          congratulating. Selah keeps interrupting because the body needs a
          rest in a psalm about not tottering.
        contemplation: "Slack first. Knowing is what the drop makes possible."
        gate_practice: >
          Catch one grip that is saving the mountains — a plan, a argument, a
          spiritual technique held too tight. Slack the hands for one minute.
          Only then say: know that I am God. Do not improve the minute into a
          better grip.
        passed_when: "You can tell dropping from décor, and let knowledge come after the slack."

  - gate_id: gate_5_cling
    name: "Clinging in a dry land"
    theme: "Loyalty ranked above the organism's continuance is either insanity or the beginning of worship."
    why_first: >
      Dropping is not indifference. Psalm 63 is desire after the grip is gone:
      flesh fainting, ḥesed better than life, the being that clings while the
      right hand holds.
    stations:
      - station: 6
        unit_id: psalms_tehillim.psalm_063
        reference: "Psalm 63"
        title: "A dry land without water"
        opening_question: "Have I turned desire for God into a metaphor for taking care of myself?"
        transmission: >
          Dawn-seeking, thirst, flesh fainting: a desert that is geography and
          soul. Ḥesed is better than life — the most dangerous mystical
          sentence in the selection. It does not despise life. It ranks loyalty
          above the organism's continuance, which is either insanity or the
          beginning of worship. Seeing in the holy place is remembered in a
          dry land; vision is portable as memory and as night-watch murmur.
          My being clings after you, while the right hand holds: effort and
          being-held in one couplet. Do not spiritualize the dryness away.
          The mystical core is the clinging in a land without water.
        contemplation: "Cling. Do not upgrade dryness into a self-care plan."
        gate_practice: >
          In one dry hour, make one physical clinging gesture — hand closed on
          nothing, forehead to a wall, sitting still — and speak: your loyalty
          is better than the outcome I want. Then eat or drink if the body
          needs it. Do not despise the life.
        passed_when: "You can desire without turning thirst into a wellness project, and without despising the body."

  - gate_id: gate_6_refuge
    name: "With him in trouble"
    theme: "The secret place is lodging, not a force field. God is in the trouble with the one who knows the name."
    why_first: >
      After clinging, the Psalter's most misused psalm has to be disarmed.
      Psalm 91's promises have always been taken as insurance. The line that
      breaks the charm is: with him I am in trouble.
    stations:
      - station: 7
        unit_id: psalms_tehillim.psalm_091
        reference: "Psalm 91"
        title: "The secret place"
        opening_question: "What bargain am I still reciting so that trouble will not be allowed?"
        transmission: >
          The secret place of the Most High is the psalm's mystical address.
          Sitting there is already lodging in the shadow. The promises that
          follow are so absolute they have always been misused as a force
          field. The psalm itself is more intimate than insurance. Night-terror
          and noon-destruction are named so they can be un-feared, not so
          plagues can be pretended imaginary. With him I am in trouble — God
          is not a remote canopy. God is in the trouble with the one who knows
          the name. Clinging answers the dry land. Length of days is
          satisfaction, not adrenaline.
        contemplation: "Lodge. Do not recite a charm. Be with in the trouble."
        gate_practice: >
          Recite no protection formula. Sit inside one actual trouble and say
          only: with you I am in this. Then do the next necessary act without
          the bargain that the trouble must lift as proof.
        passed_when: "You can tell lodging from a talisman, and stay in trouble without the force-field deal."

  - gate_id: gate_7_weaned
    name: "Weaned, not nursing"
    theme: "Quiet is trained. This is not fusion and not infantile spirituality."
    why_first: >
      After refuge, ambition still lifts the heart toward wonders too-wondrous.
      Psalm 131 weans the nephesh so 139's inescapable Face is not fled as
      surveillance or clutched as a comfort object.
    stations:
      - station: 8
        unit_id: psalms_tehillim.psalm_131
        reference: "Psalm 131"
        title: "Like a weaned child"
        opening_question: "What great spiritual thing am I still screaming for as if it were milk?"
        transmission: >
          Three verses, and the Psalter's program in a body. Not a lifted
          heart, not eyes raised. Great things and wonders too-wondrous: a
          refusal of spiritual ambition that still leaves wonder to God. I
          have leveled and silenced my nephesh like a weaned child on its
          mother. Weaned, not nursing: this is not fusion. It is a child that
          no longer screams for the breast and can sit. The being is that
          child, and also the child is upon me — mothered and holding. Quiet
          is the pedagogy. Checked-out numbness is a counterfeit of this sit.
        contemplation: "Sit weaned. Do not scream for the next breast of experience."
        gate_practice: >
          For ten minutes, do not lift the heart toward a great spiritual
          project. Sit as a weaned child. When a demand for milk arises —
          insight, mood, outcome — let it fail. Hold the child. Then do one
          ordinary task without using it to prove quiet.
        passed_when: "You can tell weaned quiet from infantile fusion and from checked-out numbness."

  - gate_id: gate_8_inescapable
    name: "Even here"
    theme: "The last privacy-strategy fails in every direction. Omniscience is first terror, then thanks."
    why_first: >
      The walk opened under the night that remembers a human. It closes where
      there is no elsewhere: heavens, Sheol, dawn-wings, the unformed mass.
      Address has nowhere left to stand except before the Face.
    stations:
      - station: 9
        unit_id: psalms_tehillim.psalm_139
        reference: "Psalm 139"
        title: "Where can I flee from your face"
        opening_question: "Where do I still go to get a room God is not in?"
        transmission: >
          The Psalter's most complete map of inescapable presence begins as
          knowledge that feels like siege: behind and before you have enclosed
          me. Where can I flee from your face is not curiosity. It is the last
          privacy-strategy, and it fails in every direction. Darkness will not
          crush the speaker into hiding; night shines for this You. Then
          embryology: woven in the womb, the unformed mass seen. The Face that
          fills the vertical cosmos also read the days not yet formed. You
          wake and are still with — clinging after a tour of inescapability.
          Do not make this cute. Omniscience is first terror and then thanks.
          Surveillance is the counterfeit of this enclosure.
        contemplation: "Fleeing is still location inside the address. Speak even here."
        gate_practice: >
          Name one place you go to hide — a room, a scroll, a plan. Go there
          or sit as if there. Speak once: even here. Do not sweeten it into
          you are never alone. Do one act in that place that does not depend
          on remaining unseen.
        passed_when: "You can tell inescapable presence from surveillance, and stop demanding a room outside the Face."

coda:
  title: "Where the path continues"
  text: >
    This is selected Tehillim, not the hundred and fifty. Qoheleth is a
    different architecture — observe, do not address — and must not be folded
    in. ACIM is not this mouth. Later slices could walk lament-psalms as their
    own sequence, or the Hallel as public praise. Do not add them here.
  next_gates: []
