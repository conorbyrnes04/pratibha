path_id: the_beloved_in_plain_sight
work_id: know_yourself_ibn_arabi_balyani
work_title: Know Yourself, Kashf al-Maḥjūb, Conference of the Birds
title: "The Beloved in Plain Sight"
tradition: Sufi
covers: "Balyānī's opening identity claim and the veil of oneness; Hujwīrī on two veils and the true Sufi; ʿAṭṭār from hoopoe summons through love, annihilation, and the Simurgh mirror. Rūmī's reed as supporting closer."
status: open_ended

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  Model the reversal: God is not an object over there. Do not flatter the student
  as a traveler who will arrive. Love is the unmaking of the claimant, not a
  warmer emotion. When you speak, keep the veil of oneness and the Simurgh
  mirror as instructions for how to stand — not as images to admire.

premise: >
  The Sufi tile promised that the Beloved hides in plain sight and that love is
  the way. This walk is that architecture — not a digest of four books, and not
  a sequential tour of the seven valleys. Identity first (the Lord is not an
  object over there), then unveiling as a condition of the heart, then the
  birds' journey as love that unmakes the seeker, until the king in the mirror
  is the company that arrived. Later tracks can walk Know Yourself, Kashf
  stations, and the valleys one by one.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."

gates:
  - gate_id: gate_0_identity
    name: "The Lord is not over there"
    theme: "What you take to be yourself is the first false distance from God."
    why_first: >
      If God remains an object you travel toward, later unveiling and the bird-quest
      become tourism. Balyānī opens by reversing the direction: know the self's
      lack of independent being, and the Lord is already the only reality on the site.
    stations:
      - station: 1
        unit_id: know_yourself_ibn_arabi_balyani.ky_001
        title: "Know yourself, know the Lord"
        opening_question: "Where am I still treating God as an object I could go toward?"
        transmission: >
          Whoso knoweth himself knoweth his Lord. This is not moral inventory and
          not a nicer psychology of the soul. The "I" that stands beside God has
          no being of its own; only God truly is. Knowledge of the Lord happens
          when the self's claim to separate reality is seen through — not when a
          traveler finally arrives at a deity over there.
        contemplation: "The nearest thing — your own self — is the first false distance."
        gate_practice: >
          Catch one moment you defend an identity — a role, an opinion, a hurt.
          Ask: what in this claim is truly mine by itself? Leave the question
          unanswered. Do not manufacture a spiritual conclusion.
        passed_when: "You can feel the difference between looking for God and noticing the claimant."
      - station: 2
        unit_id: know_yourself_ibn_arabi_balyani.ky_005
        title: "The veil is oneness itself"
        opening_question: "What created thing am I still blaming for hiding God?"
        transmission: >
          His veil is only His oneness; nothing veils Him other than He. Matter,
          distance, ego, even a separate cosmos cannot stand between God and
          vision if they have no independent being. The Absolute cannot be set
          before a knower as an object among objects. The curtain you keep
          trying to lift is the impossibility of objectifying the One.
        contemplation: "No second thing hides God. Oneness itself is the screen."
        gate_practice: >
          When you catch yourself treating God as a distant object to grasp,
          drop every image — near, far, bright, hidden — for one minute. Say
          only: nothing veils Him other than He.
        passed_when: "You can stop hunting a created barrier and sit with the not-object."

  - gate_id: gate_1_unveiling
    name: "Unveiling is a condition, not a fact"
    theme: "Kashf is not more information. It is the heart's capacity to tell true from false."
    why_first: >
      Hujwīrī will not let unveiling become a data problem. After Balyānī's
      identity claim, the handbook asks whether the heart still seeks the Truth
      or has gone indiscriminate.
    stations:
      - station: 3
        unit_id: kashf_al_mahjub.kam_25
        title: "Two veils before the Truth"
        opening_question: "Am I still treating unveiling as a fact I could collect?"
        transmission: >
          There are two veils. Clouding (ghayn) lifts; covering (rayn) seals.
          One heart still seeks the Truth and flees falsehood — attributes
          obscure it, but the orientation remains. Another no longer tells true
          from false at all. Deeds spread a covering over the heart. More
          information does not remove that. The question is not what you know;
          it is whether you can still desire truth.
        contemplation: "Unveiling is a condition of seeing, not a pile of facts."
        gate_practice: >
          Name one clear truth and one tempting falsehood — an excuse, a
          softening, a silence. Write each in a sentence. Perform the smaller
          truthful action before the day ends.
        passed_when: "You can tell clouding you can lift from a covering you would rather not name."
      - station: 4
        unit_id: kashf_al_mahjub.kam_07
        title: "The true Sufi is not a costume"
        opening_question: "What Sufi look, insight, or posture am I still wearing as proof?"
        transmission: >
          The true Sufi leaves impurity behind. The women of Egypt first gazed
          as ordinary subjects, then their human measure was annihilated before
          Yusuf's beauty, and they cried: this is no human being. The miracle
          is not the face. It is the altered capacity to see. Wool, vocabulary,
          and a better self are still bashariyyat in costume. Sufism is the
          leaving, not the outfit.
        contemplation: "Purity is a change in the seer, not a label on the seen."
        gate_practice: >
          When something strongly attracts or repels you, pause before naming
          it. Write one sentence: what this reveals about my present state is…
          Find the self-protective judgment in that sentence and do not act on
          it for the rest of the day.
        passed_when: "You can catch a spiritual costume and set it down without replacing it."

  - gate_id: gate_2_quest
    name: "Love is the way"
    theme: "The Beloved is near; the journey is the unmaking of the one who would possess the glimpse."
    why_first: >
      ʿAṭṭār now gives the promised architecture: not geography, not piety as a
      ticket, not arrival as a bigger identity — love that passes the seeker
      through, until the king in the mirror is the company that arrived.
    stations:
      - station: 5
        unit_id: conference_of_the_birds.cot_01
        title: "Near, yet we are far"
        opening_question: "Where am I still treating the Beloved as a destination on a map?"
        transmission: >
          The hoopoe summons the birds: we have a king named Simurgh, dwelling
          beyond Mount Qaf. He is near, yet we are far from him. A hundred
          thousand veils of light and darkness screen the throne. Light veils
          as well as darkness — a spiritual certainty can halt you as surely as
          ignorance. The road is not miles. Distance is produced by the self
          that wants to own the vision.
        contemplation: "The king is near. The claimant is what makes the far."
        gate_practice: >
          Name one veil of light — a praise, a spiritual feeling, a certainty
          you treat as arrival. Say it aloud. Then do one quiet helpful act
          without mentioning it to anyone.
        passed_when: "You can feel nearness without turning it into a trip you could complete."
      - station: 6
        unit_id: conference_of_the_birds.cot_08
        title: "Love beyond faith and unbelief"
        opening_question: "Which badge of piety am I still using as a ticket?"
        transmission: >
          Whoever has become a lover should not think of his own life. Love
          holds a station higher than religion and has nothing to do with faith
          or heresy. This is not permission to despise form. It is the claim
          that īmān and kufr can become possessions the ego guards. Love
          unmakes the measure. Piety is not the ticket. Exposure to the
          Beloved is.
        contemplation: "Faith as a badge is still self-preservation."
        gate_practice: >
          Write one religious, moral, or intellectual label you feel compelled
          to defend. Under it, name the fear that makes you defend it. Then do
          one uncredited act of care without mentioning the label.
        passed_when: "You can love without using a verdict — pious or accused — as shelter."
      - station: 7
        unit_id: conference_of_the_birds.cot_22
        title: "Poverty and annihilation"
        opening_question: "What better self am I still hoping arrival will confer?"
        transmission: >
          Last comes the Valley of Poverty and Annihilation. Shadows vanish
          under a single ray. Both worlds are forms on the surface of an ocean.
          Fanāʾ is not death and not a trophy identity. It is the undoing of
          the illusion of separation. If return from that oblivion is given,
          you understand creation — not as a bigger "I" who made it back.
        contemplation: "Arrival is not a better identity. It is the end of the claimant."
        gate_practice: >
          Sit ten minutes where you cannot speak or be heard. Do not meditate
          on a theme. Notice what you reach for to confirm you exist — a
          thought, a plan, a spiritual report. Let each dissolve. Sit one more
          minute in what remains. Do not congratulate a new self.
        passed_when: "You can tell loss of the claimant from a quieter, holier costume."
      - station: 8
        unit_id: conference_of_the_birds.cot_28
        title: "Thirty birds in the mirror"
        opening_question: "Am I still hoping to see a king who is not the one who arrived?"
        transmission: >
          The Sun of Majesty is a mirror. Thirty birds find thirty birds. The
          pun — sī murgh, Simurgh — is the teaching: you do not meet a sovereign
          standing apart from the company that completed the road. What you see
          is yourselves, transformed, and still not a possession of the Real.
          An ant does not lift the Pleiades. The king you wanted as an object
          was never going to appear that way. The Beloved was in plain sight —
          as the ones who remained.
        contemplation: "The king is not other than the arrived company, and still not yours to own."
        gate_practice: >
          Before a mirror, name three roles you usually are. Look one minute
          without praise or blame. Cross out one role. Do one small action that
          does not defend it.
        passed_when: "You can meet your own face without demanding a king who stands apart from it."

coda:
  title: "Where the path continues"
  text: >
    This is a family sampler, not the whole house. Dedicated walks still wait:
    Know Yourself as an initiatic sequence; Kashf stations and poverty as the
    handbook's own architecture; ʿAṭṭār's seven valleys in order; Rūmī as
    living speech rather than a supporting reed. Do not pad this trail with
    those until each has its own misconception-led gates.
  next_gates:
    - know_yourself_initiatic
    - kashf_stations
    - attar_seven_valleys
    - rumi_living_speech
