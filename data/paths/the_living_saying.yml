path_id: the_living_saying
work_id: new_testament_logia
work_title: Gospel of Mary, Gospel of Thomas, Logia of Jesus
title: "The Living Saying"
tradition: Christian mysticism
covers: "Luke 17:20–21; Thomas 3; Mary BG 8–10, 15, 18–19; Matthew 6:22–23; John 15:4–5; John 17:20–23"
status: complete

# Family sampler in living-speech form (model: the-horse-of-conversation).
# Not another darkness path, not Psalms, not ACIM. After divine-darkness on
# christian-mysticism. Each gate is a saying that must be done, not admired.

teacher_voice: >
  Speak plainly and without flattery. Name the difficulty before resolving it.
  Never promise the student a state; give them an act and let the state arrive.
  A saying is a vehicle. Do not turn it into a slogan, a calendar, or a new law.

premise: >
  After unknowing, the Christian trail still needs a mouth. This walk is living
  speech: short sayings from Luke, Thomas, Mary, and John that will not perform
  for inspection. You are not collecting logia. You are refusing the spectacle,
  the extra Moses, the split eye, the circle that confers worth — and remaining
  as a branch, until oneness is indwelling rather than agreement.

how_to_walk:
  - "Sit before each station as before an appointment."
  - "Read the transmission once, then close the text and do the practice."
  - "Do not advance until passed_when is honestly true."
  - "Do not add a rule to prove you understood."

gates:
  - gate_id: gate_0_observation
    name: "Not a spectacle"
    theme: "The kingdom will not arrive as something you can point at."
    why_first: >
      Luke's question is the whole later error: when? If you skip this, Thomas's
      inside-and-outside becomes a map of holy sites, and Mary's Human One
      becomes another figure on the horizon.
    stations:
      - station: 1
        unit_id: new_testament_logia.ntl_01
        reference: "Luke 17:20–21"
        title: "Not with observation"
        opening_question: "What am I still watching for so I do not have to enter?"
        transmission: >
          The question wants a calendar. He refuses a spectacle you could point
          at. Observation is the watcher's stance: waiting for a sign so you do
          not have to enter. Entos hymōn can mean among you or within you — the
          Greek will not close the case. What it does close is the pointing-away.
          If you are still asking when, you have already mislocated it.
        contemplation: "The kingdom does not perform for inspection."
        gate_practice: >
          Catch one 'when will it come' today — a mood, a news cycle, a spiritual
          timetable. Drop the when. Look once at what is already within reach,
          and stay there for ten breaths.
        passed_when: "You can tell postponement-by-watching from presence, and drop one when."

  - gate_id: gate_1_near
    name: "Inside and outside"
    theme: "Leaders who point to sky or sea mislead. The Human One is not a second Moses."
    why_first: >
      Thomas doubles the location Luke left open. Mary then names the Human One
      within and forbids the extra statute — the political danger of a gospel
      that has just been found.
    stations:
      - station: 2
        unit_id: gospel_of_thomas.faithful_thom_003
        reference: "Thomas 3"
        title: "Inside you and outside you"
        opening_question: "Whom do I still let point me to a sky or a sea?"
        transmission: >
          If the kingdom were in the sky, the birds would precede you. If in the
          sea, the fish. The joke is geography as religious direction. The
          kingdom is inside you and outside you — not a private cave, not a
          destination. Self-knowledge here is relational: when you know
          yourselves you will be known, children of the living Father. Poverty
          is not empty pockets. It is existing as the not-knowing of that.
        contemplation: "Within without a cave. Outside without a pilgrimage."
        gate_practice: >
          For ten minutes notice one breath, one sound beyond you, one person or
          creature before you. After each, silently: within and outside. End by
          naming one act today from belonging rather than lack.
        passed_when: "You can refuse a pointed-to elsewhere without collapsing into private spirituality."
      - station: 3
        unit_id: gospel_of_mary.gom_04
        reference: "Mary, BG 8502 pp. 8–9"
        title: "No second Moses"
        opening_question: "What extra rule am I laying down to prove I have found him within?"
        transmission: >
          Peace is to be acquired, not waited for. Do not be misled by Look over
          here. The Son of Humanity exists within you — follow is not travel.
          Then the second blow: do not become a second Moses. Extra rules bind
          the ones who make them. A gospel that starts as inner finding can
          harden, in a week, into a new law. This is why Mary will later be
          accused of inventing teaching. The Savior already forbade the extra
          statute.
        contemplation: "Follow him within. Do not add a fence to prove you did."
        gate_practice: >
          Catch one spiritual 'look over there' — a teacher, a sign, a mood.
          Return to the Human One as within. Do not add a rule to prove you
          returned.
        passed_when: "You can return without legislating the return for yourself or anyone else."

  - gate_id: gate_2_eye
    name: "Unsplit seeing"
    theme: "You need an unsplit eye, not more lamps. Treasure follows the mind that does not waver."
    why_first: >
      Location is not enough. The organ of seeing can still be double. Mary
      relocates treasure from relic and college to unwavering nous.
    stations:
      - station: 4
        unit_id: new_testament_logia.ntl_05
        reference: "Matthew 6:22–23"
        title: "The unsplit eye"
        opening_question: "Where is my glance already appraising, comparing, acquiring?"
        transmission: >
          Haplous means single, simple, unmixed — not 'healthy' as a medical
          compliment. The eye is the body's lamp: attention lights the whole
          field. An evil eye is the divided, stingy glance. If the organ of
          seeing is already dark, more information will not help; the light-in-you
          has become darkness, and that is the great dark. You do not need more
          lamps. You need an unsplit eye.
        contemplation: "The split is in the looking, not in the shortage of lights."
        gate_practice: >
          For five minutes look at one thing — a face, a page, a tree — without
          the second glance that compares or acquires. When the eye splits, name
          it and return.
        passed_when: "You can feel the second glance arrive, and come back to one looking."
      - station: 5
        unit_id: gospel_of_mary.gom_06
        reference: "Mary, BG 8502 p. 10"
        title: "Where the mind is"
        opening_question: "Do I treat the Lord as a spectacle to collect, or as a place the mind can hold?"
        transmission: >
          Peter admits a privilege and contains it: more than the rest of the
          women. Mary does not debate the containment. She offers what is hidden.
          Blessedness is not seeing — it is not wavering at the seeing. Where
          the mind is, there is the treasure. Not where the relic is. Not where
          the male college is. If the mind wavers, the Lord is a spectacle. If
          it holds, the vision is a location of wealth.
        contemplation: "Treasure follows attention. Wavering turns the Lord into a souvenir."
        gate_practice: >
          When a true thing appears today — a person, a sentence, a silence —
          notice the waver. Hold the mind there for ten breaths. Do not collect
          the experience as status.
        passed_when: "You can hold a true appearing without turning it into a possession or a rank."

  - gate_id: gate_3_garment
    name: "The garment"
    theme: "Desire knew a costume. It never knew the wearer."
    why_first: >
      Unwavering mind still has to meet the power that claims you because it
      saw you go up. The soul's answer is anthropology, not prudery.
    stations:
      - station: 6
        unit_id: gospel_of_mary.gom_08
        reference: "Mary, BG 8502 p. 15"
        title: "I was a garment"
        opening_question: "Which desire is talking as if I belong to it?"
        transmission: >
          Desire claims ownership: you came up through me, so you are mine. The
          soul answers: I saw you; you did not see me. I was to you a garment.
          Belonging was a costume-error. Recognition is one-way, and that is
          enough to leave rejoicing. This is not a campaign against wanting. It
          is the end of being identified with the heat that mistook a dress for
          a person.
        contemplation: "Desire saw the cloth. The wearer can leave."
        gate_practice: >
          Name one desire that talks as if you belong to it. Answer, silently:
          you saw a garment. Walk to the next task without arguing with it.
        passed_when: "You can move to the next act without negotiating with a claim that only knew the costume."

  - gate_id: gate_4_vine
    name: "Abide"
    theme: "You are already a branch. The command is remain, not become."
    why_first: >
      After leaving Desire's claim, fruit can still be attempted as a solo
      project. John will not allow a branch displaying grapes it does not have.
    stations:
      - station: 7
        unit_id: new_testament_logia.ntl_26
        reference: "John 15:4–5"
        title: "Abide in the vine"
        opening_question: "Where am I muscling fruit as if the stem were optional?"
        transmission: >
          Fruit is not a project of the branch. Apart from me you can do nothing
          — not less. The I am is the vine; you are already a branch, which is
          why the command is abide, not become. Effort may be real. Detached, it
          is a branch displaying grapes it does not have.
        contemplation: "Remaining is the condition. Success is not the stem."
        gate_practice: >
          Before one task you usually muscle through, abide for sixty seconds —
          not as a trick to succeed, as the vine-condition. Then do the task.
          If it bears, do not take it as the branch's genius.
        passed_when: "You can do one real task from remaining, without awarding the grapes to yourself."

  - gate_id: gate_5_circle
    name: "The circle does not confer"
    theme: "Worth is the Savior's. Oneness is indwelling, not agreement."
    why_first: >
      The last two sayings are the social cost of everything prior. Peter
      becomes the extra law. Levi clothes the group. John prays the later ones
      into the same one — including the reader.
    stations:
      - station: 8
        unit_id: gospel_of_mary.gom_12
        reference: "Mary, BG 8502 pp. 18–19"
        title: "If he made her worthy"
        opening_question: "Where am I the gatekeeper of who may have heard?"
        transmission: >
          Peter has become the adversary-power: angry, debating the woman, laying
          down an extra law of who may hear. Worth is the Savior's to confer,
          not Peter's to revoke. Levi restates the love without 'than the rest
          of the women.' Then the clothing: perfect Humanity. Preach, and do not
          add a rule. The book ends not with a vision but with a group that can
          walk out because someone defended the witness.
        contemplation: "The circle does not confer worth. It can only refuse to revoke it."
        gate_practice: >
          Where you are the gatekeeper of who may have heard, step aside once.
          Clothe yourself as Human — do the next ordinary act without the extra
          rule.
        passed_when: "You can let someone else's hearing stand without your permission."
      - station: 9
        unit_id: new_testament_logia.ntl_27
        reference: "John 17:20–23"
        title: "That they may be one"
        opening_question: "Am I asking that they come over to my side, or that we be one as they are one?"
        transmission: >
          The prayer overshoots the room: those who will believe through their
          word — including you. Oneness is not a team-building goal. It is as
          you, Father, in me and I in you, and then they in us. Glory is given
          onward. Perfected into one: completion as union, not as polish. The
          world's belief is the public fruit of this nesting, not a campaign.
          Unity here is indwelling, given, so that the world may know love —
          not agreement.
        contemplation: "The later reader is already inside the asking."
        gate_practice: >
          Toward one person you split from, ask this much: that we may be one as
          they are one — not that they come over to your side. Do one repair
          that matches the prayer.
        passed_when: "You can want oneness without requiring conversion to your position."

coda:
  title: "Where the path continues"
  text: >
    Complete as a living-speech walk. Divine darkness remains the prior track
    on this trail. Psalms, if walked later, are address and praise — a different
    mouth. Do not fold ACIM into this architecture.
  next_gates: []
