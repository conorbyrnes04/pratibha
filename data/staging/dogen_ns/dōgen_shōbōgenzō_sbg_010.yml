section: Shōbōgenzō, “Uji” (Being-Time)
sanskrit_devanagari: Iwayuru uji wa, toki sudeni kore u nari; u wa mina toki nari. Shidai gon mo toki nari. Shōhō shosō mo
  toki nari. Naishi sanjūroku kyū shichijūni den mo toki nari. Shinzan yūkoku mo toki nari. Daichi kokū mo toki nari.
sanskrit_iast: ''
translation_literal: 'What is called being-time [uji] is: time already is being, and every being is time. The four great elements
  and the five aggregates are time. All dharmas and all forms are time. Even the thirty-six palaces and seventy-two halls
  are time. Deep mountains and hidden valleys are time. The great earth and empty space are time.'
commentary: 'Dōgen does not say that things exist within a neutral stream called time. Nor does he mean merely that all things
  change over time. “Being-time” names the inseparability of existence and temporality: whatever is, is its own time; whatever
  time is, appears as this concrete being. Thus a mountain is not an enduring object to which time later happens; mountain-time
  is its very presence. The same is true of body, thought, institution, landscape, and emptiness. This undercuts the wish
  to find a permanent self standing outside change, but it also prevents impermanence from becoming a bleak abstraction. Each
  occasion is complete as the full enactment of its conditions, not as an isolated instant sealed off from past and future.
  Practice is therefore not a technique performed now in order to reach realization later. Sitting, breathing, grief, work,
  and awakening are each to be met as the whole matter of being-time.


  Key Terms


  **有時 (uji)** — “Being-time”: existence and time are not two separate realities.

  **時 (toki)** — Time, understood not as a container but as the actual presence of beings.

  **四大五蘊 (shidai gon)** — The four elements and five aggregates: the psychophysical world is itself time.


  Cross-Tradition Resonances


  **Augustine, Confessions XI:**  Divergence: Augustine finally situates time within creation and God’s eternity; Dōgen does
  not contrast being-time with an eternal divine standpoint.

  **Heraclitus:**  Divergence: Dōgen’s claim is not simply that all things flow or perish; each being is precisely time, and
  is to be practiced-realized in that fact.

  **Nāgārjuna, Mūlamadhyamakakārikā:**  Divergence: Dōgen gives this insight a strongly affirmative and phenomenological expression:
  mountains, halls, body, and space enact being-time.'
practice: 'For ten minutes, sit without trying to improve the moment. On each breath, silently note: “This is being-time.”
  Include whatever appears—sound, discomfort, planning, breath—as the complete time of this sitting, then return to upright
  posture.'
