unit_label: Practice Is Already Realization
title: Practice Is Already Realization
unit_type: verse
section: Bendōwa, on practice and realization
sanskrit_devanagari: 修証は一等なり。いはゆる修のなかの証なるゆゑに、初心の弁道すなはち本証の全体なり。このゆゑに、修行の用心を授与するに、修のほかに証をまつなと教ふることなかれ、直指の正伝なるゆゑに。すでに修の証なれば、証にきはなく、証の修なれば、修にはじめなし。
sanskrit_iast: ''
translation_literal: Practice and realization are one. Because realization is within practice, the wholehearted practice of
  a beginner is itself the complete totality of original realization. Therefore, when giving the careful instruction of practice,
  do not teach that one should wait for realization apart from practice; this is because it is the directly transmitted orthodox
  teaching. Since it is the realization of practice, realization has no limit; since it is the practice of realization, practice
  has no beginning.
commentary: 'Dōgen rejects the usual religious chronology in which a deficient person performs practices and eventually acquires
  enlightenment as a result. This does not make effort unnecessary or turn “original realization” into a metaphysical possession.
  Rather, zazen and the whole enacted Way are realization precisely when they are not organized around gaining some later
  state. “Original realization” (本証, honshō) is not an inner substance hidden behind conduct; it is the boundless actuality
  expressed in undivided practice. Hence the beginner’s practice is not a preliminary imitation of the master’s realization.
  It is complete in kind, though its expression may deepen without limit. The last sentence preserves both sides: realization
  has no final boundary, so one cannot own it; practice has no first moment, so it cannot be reduced to an ego’s self-improvement
  project. Practice is participation in Buddha-way, not a means external to it.'
practice: Sit upright for ten minutes without trying to produce calm, insight, or a special state. Each time the mind asks,
  “Is this working?”, silently note “gaining mind,” return to posture and breathing, and let this return itself be the whole
  practice.
