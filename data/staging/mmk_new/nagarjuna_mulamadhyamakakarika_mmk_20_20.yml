unit_label: Cause Cannot Stand Apart
title: Cause Cannot Stand Apart
unit_type: verse
sanskrit_devanagari: 'एकत्वे फलहेत्वोः स्याद् ऐक्यं जनकजन्ययोः ।

  पृथक्त्वे फलहेत्वोः स्यात् तुल्यो हेतुर् अहेतुना ॥ २०.२० ॥'
sanskrit_iast: 'ekatve phalahetvoḥ syād aikyaṃ janakajanyayoḥ |

  pṛthaktve phalahetvoḥ syāt tulyo hetur ahetunā || 20.20 ||'
translation_literal: If result (phala) and cause (hetu) were one, producer and produced would be identical. If result and
  cause were different, a cause would be equal to a non-cause.
commentary: 'The verse tests causation under the demand that cause and result possess fixed natures (svabhāva). If they are
  strictly one, there is no intelligible transition from producing to produced: the cause already is the result, and agent-like
  producer (janaka) and patient-like product (janya) collapse into identity. But if they are absolutely different, nothing
  marks this alleged cause off from anything else; it is no more connected to its result than a non-cause is. Nāgārjuna does
  not therefore deny the everyday efficacy of seeds, fire, and actions. He denies that causal efficacy can be grounded in
  either intrinsic identity or intrinsic difference. Cause and result arise dependently, designated within a relational process.
  The tetralemma prevents “one,” “different,” “both,” or “neither” from becoming a final metaphysical account of causation.
  Conventionally, causes function; ultimately, neither cause nor result is self-established.


  Key Terms


  **phala** — Result or fruit: the outcome conventionally attributed to causal conditions.

  **hetu** — Cause: a condition designated as productive in relation to an effect.

  **janaka** — Producer or generator: that which is spoken of as bringing about something.

  **janya** — Produced or generated: that which is spoken of as arising from a producer.


  Cross-Tradition Resonances


  **Aristotle, Physics II:** Aristotle distinguishes causes from their effects while treating causation as intelligible only
  within an ordered explanatory relation. Divergence: Aristotle can ground explanation in natures and forms; Nāgārjuna subjects
  every such intrinsic nature to critique.

  **David Hume, An Enquiry Concerning Human Understanding:** Hume rejects any directly perceived necessary tie binding one
  event to another, challenging a robust causal power inherent in objects. Divergence: Hume emphasizes custom and expectation;
  Nāgārjuna analyzes causal terms through dependent arising and emptiness, without reducing them merely to psychological habit.

  **Ludwig Wittgenstein, Philosophical Investigations:** Wittgenstein cautions against seeking hidden essences behind the
  uses of concepts, a gesture akin to refusing a self-grounding causal essence. Divergence: Wittgenstein''s therapy concerns
  linguistic confusion, whereas Nāgārjuna joins conceptual analysis to liberation from grasping at svabhāva.'
practice: Choose one present result—an emotion, a conflict, or a bodily sensation—and trace the conditions named as its causes.
  Notice that no single condition is identical with the result, yet no condition stands wholly unrelated to it; rest with
  this dependently arisen, ungraspable nexus.
