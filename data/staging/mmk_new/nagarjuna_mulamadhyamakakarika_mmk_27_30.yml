unit_label: Bowing Beyond Every View
title: Bowing Beyond Every View
unit_type: verse
sanskrit_devanagari: 'सर्वदृष्टिप्रहाणाय यः सद्धर्मम् अदेशयत् ।

  अनुकम्पाम् उपादाय तं नमस्यामि गौतमम् ॥ २७.३० ॥'
sanskrit_iast: 'sarvadṛṣṭiprahāṇāya yaḥ saddharmam adeśayat |

  anukampām upādāya taṃ namasyāmi gautamam || 27.30 ||'
translation_literal: For the abandoning of all views (sarvadṛṣṭi-prahāṇa), he taught the true Dharma (saddharma), taking up
  compassion (anukampā). To that Gautama I bow.
commentary: 'The closing salutation identifies the Buddha’s teaching not as one more metaphysical position but as medicine
  for fixation on positions. “All views” includes the four alternatives of the tetralemma: that things are, are not, both
  are and are not, or neither are nor are not. Nāgārjuna does not deny conventional discourse: dependently arisen things function,
  causes bear effects, and the two truths distinguish everyday validity from ultimate analysis. But when any account is grasped
  as disclosing an intrinsic nature (svabhāva), it becomes a dṛṣṭi, a view that reifies. Emptiness is therefore not a hidden
  substance or a final thesis; it is the absence of such independent essence in whatever arises dependently. The teaching
  is given “taking up compassion”: liberation from views is not skeptical withdrawal, but release from the suffering generated
  by clinging. The bow honors a pedagogy whose aim is freedom rather than doctrinal possession.


  Key Terms


  **sarvadṛṣṭiprahāṇa** — The abandonment of all fixed views or speculative standpoints.

  **saddharma** — The true or authentic Dharma taught as a path to liberation.

  **anukampā** — Compassionate concern; the motive explicitly attributed to the teaching.

  **Gautama** — The Buddha, honored here as the teacher of release from views.


  Cross-Tradition Resonances


  **The Kaccānagotta Sutta (Saṃyutta Nikāya 12.15):** The Buddha rejects the extremes “everything exists” and “everything
  does not exist,” teaching dependent arising instead. Divergence: Nāgārjuna systematically extends this anti-reification
  through emptiness analysis and the full tetralemma.

  **Sextus Empiricus and Pyrrhonian epochē:** Pyrrhonism seeks freedom from disturbance through suspension of dogmatic assertion.
  Divergence: Madhyamaka suspension is guided by compassion and dependent origination, not merely by equipollence among competing
  claims.

  **Laozi’s Daodejing:** Its warning that names and fixed formulations fail to capture the Way parallels suspicion toward
  conceptual fixation. Divergence: Nāgārjuna gives a precise causal analysis of dependent arising rather than positing or
  evoking an ineffable Dao.'
practice: Notice one view presently organizing your distress—for example, “this must last,” “I am this way,” or “they are
  simply wrong.” Ask whether it exists independently of conditions, language, memory, and relation; then let the question
  soften the grip of the view without denying the situation’s conventional reality. Turn the resulting space toward one compassionate
  response.
