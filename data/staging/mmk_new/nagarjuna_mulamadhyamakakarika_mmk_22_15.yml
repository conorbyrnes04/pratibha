title: Beyond the Net of Concepts
unit_type: verse
sanskrit_devanagari: 'प्रपञ्चयन्ति ये बुद्धं प्रपञ्चातीतम् अव्ययम् ।

  ते प्रपञ्चहताः सर्वे न पश्यन्ति तथागतम् ॥ २२.१५ ॥'
sanskrit_iast: 'prapañcayanti ye buddhaṃ prapañcātītam avyayam |

  te prapañcahatāḥ sarve na paśyanti tathāgatam || 22.15 ||'
translation_literal: Those who conceptually proliferate (prapañcayanti) the Buddha—beyond proliferation (prapañcātīta), imperishable
  (avyaya)—all, struck down by proliferation (prapañcahatāḥ), do not see the Tathāgata.
commentary: 'The verse does not deny the Buddha; it denies that the Tathāgata can be grasped as an object fabricated by conceptual
  elaboration. To call the Buddha eternal, annihilated, existent, nonexistent, both, or neither is to make him into a determinate
  thing with a fixed nature (svabhāva). Yet the Buddha is precisely understood through dependent origination: empty of self-established
  essence, not reducible to any of the four extremes of the tetralemma. “Imperishable” therefore does not name an enduring
  metaphysical substance. It indicates that what is empty cannot be destroyed as a self-existing entity, because it was never
  established in that way. Conventional teachings, images, names, and accounts of the Buddha remain usable within the two
  truths; they guide practice. But when such conventions are reified, proliferation becomes the very obstacle to seeing. To
  see the Tathāgata is not to acquire a final concept of him, but to loosen the grasping that demands one.


  Key Terms


  **prapañca** — Conceptual proliferation: the elaborating of distinctions into reified views and objects.

  **prapañcātīta** — Beyond conceptual proliferation; not capturable by the categories through which grasping operates.

  **avyaya** — Imperishable or undeclining; not the persistence of a substance, but freedom from reified arising and destruction.

  **tathāgata** — “Thus-gone” or “thus-come,” the Buddha as not confined by ordinary conceptual predicates.


  Cross-Tradition Resonances


  **The Heart Sūtra:** Its claim that form is emptiness and emptiness is form similarly blocks the attempt to secure phenomena
  in fixed conceptual identities. Divergence: This verse specifically targets proliferating conceptions of the Tathāgata,
  whereas the Heart Sūtra gives a broader analysis of all dharmas and the bodhisattva’s path.

  **Laozi, Daodejing 1:** “The Dao that can be spoken is not the constant Dao” likewise warns that naming can miss what it
  seeks to indicate. Divergence: Nāgārjuna’s point rests on emptiness and dependent origination rather than on an ineffable,
  generative Dao that might be construed as an ultimate source.

  **Pseudo-Dionysius, Mystical Theology:** Apophatic theology denies that God is adequately contained by affirmative predicates,
  paralleling the refusal to identify the ultimate through conceptual capture. Divergence: Dionysius retains a theological
  orientation toward God beyond being; Madhyamaka rejects establishing even such transcendence as an independently real ultimate
  entity.'
practice: 'Notice a label you are using for yourself, another person, or the Buddha—“permanent,” “broken,” “enlightened,”
  “not enlightened.” Ask: does this label describe a self-existing thing, or does it depend on conditions, purposes, and further
  concepts? Rest briefly without replacing it with a subtler metaphysical label.'
