unit_label: Before the Passionate One
title: Before the Passionate One
unit_type: verse
sanskrit_devanagari: 'रागाद् यदि भवेत् पूर्वं रक्तो रागतिरस्कृतः ।

  तं प्रतीत्य भवेद् रागो रक्ते रागो भवेत् सति ॥ ६.१ ॥'
sanskrit_iast: 'rāgād yadi bhavet pūrvaṃ rakto rāgatiraskṛtaḥ |

  taṃ pratītya bhaved rāgo rakte rāgo bhavet sati || 6.1 ||'
translation_literal: If, prior to passion (rāga), there were a passionate one (rakta), excluded from passion, then passion
  would arise dependent on that one; passion would exist when the passionate one exists.
commentary: 'Nāgārjuna tests the supposition that a bearer of passion exists before the passion it bears. If a rakta—a “passionate
  one”—were established prior to rāga, it would at that point have to be without passion. Yet then rāga could be said to arise
  in dependence on an already existent person. The argument exposes a difficulty in treating agent and affect as independently
  grounded entities: the “passionate one” is intelligible only in relation to passion, while passion is ordinarily identified
  as the passion of someone. Neither can be secured first by its own svabhāva. This does not deny the dependently arisen occurrence
  of desire; it denies that either a fixed subject or a self-established passion underlies that occurrence. Conventionally,
  “a passionate person” and “their passion” function together. Ultimately, neither withstands analysis as prior, independent,
  or intrinsically real.


  Key Terms


  **rāga** — Passion, attachment, or craving; an afflictive state examined as dependently arisen.

  **rakta** — The passionate or attached one; the putative bearer of rāga.

  **pratītya** — Depending on, in reliance upon; indicating conditional rather than self-grounded arising.


  Cross-Tradition Resonances


  **David Hume, A Treatise of Human Nature:** Hume finds no separately given, enduring self behind the succession of perceptions,
  paralleling Nāgārjuna’s resistance to a self-established bearer of mental states. Divergence: Hume offers an empiricist
  bundle account, whereas Nāgārjuna applies dependent origination to both person and states and directs the analysis toward
  emptiness and liberation.

  **Buddha, Kaccānagotta Sutta (SN 12.15):** The sutta rejects the extremes of existence and nonexistence and teaches dependent
  arising; this verse similarly refuses an independently existent subject standing behind desire. Divergence: The sutta states
  the middle way primarily through causal arising and cessation, while Nāgārjuna here uses a focused reductio concerning the
  priority of passion and its bearer.

  **Jean-Paul Sartre, Being and Nothingness:** Sartre denies a substantial ego concealed behind consciousness and treats consciousness
  as inseparable from its intentional engagements. Divergence: Sartre retains a distinctive account of consciousness and freedom,
  while Nāgārjuna empties consciousness, agent, object, and their relation of svabhāva alike.'
practice: When desire arises, look for the supposedly fixed “one who desires” apart from the desire itself. Then look for
  desire apart from sensations, images, conditions, and the designation “mine”; rest with their contingent co-arising without
  making either side into a solid self.
