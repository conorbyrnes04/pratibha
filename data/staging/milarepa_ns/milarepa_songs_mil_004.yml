section: MGT 5.3
sanskrit_devanagari: དགེ་བའི་རྒྱལ་པོ་དགེ་བའི་རྒྱལ་པོ། ཕོ་བྲང་དགེ་བའི་རྒྱལ་པོ། (Dge ba'i rgyal po dge ba'i rgyal po. Pho brang
  dge ba'i rgyal po.)
sanskrit_iast: ''
translation_literal: The cave feeds me with emptiness; the rocks are my companions. Here, where no flatterer's voice reaches,
  my mind grows vast as the sky. The hermit who owns nothing possesses all things—the mountain's silence is his wealth, the
  stars his retinue. In solitude, the guru's teaching ripens like barley in summer sun.
commentary: 'This passage distills a cardinal theme in Milarepa''s corpus: the paradox that renunciation yields abundance.
  The cave is not a prison but a treasury; emptiness (śūnyatā) is not deprivation but the ground of clarity. Milarepa''s radical
  embrace of hardship—he famously subsisted on nettles—reframes ascetic deprivation as liberation from the tyranny of desire
  and social performance. The image of the guru''s teaching ''ripening'' invokes the agricultural metaphor common in Tibetan
  Buddhism, where practice is cultivation. The passage also embodies the mahāmudrā principle: ordinary perception (rocks,
  silence, stars) becomes the path itself when mind recognizes its own nature. Solitude here is not escapism but the optimal
  condition for recognizing the non-dual ground of reality.'
practice: 'Spend one hour in a quiet, natural place (mountain, forest, or simple room). Sit upright and observe the silence
  without trying to fill it. Notice how the mind initially resists emptiness—it generates thoughts, restlessness, longing.
  Do not suppress these; watch them arise and dissolve like clouds. Gradually, allow the boundary between ''self'' and ''silence''
  to soften. Rest in the awareness that observes both thought and stillness. This is the cave Milarepa inhabited: not a location,
  but the open space of mind recognizing its own nature. Return to this practice daily for at least one lunar month.'
