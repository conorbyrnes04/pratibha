unit_label: The Guru's Blessing Descends Like Rain
title: The Guru's Blessing Descends Like Rain
unit_type: verse
section: Milarepa's Song of Devotion to Marpa, from the Hundred Thousand Songs (mGur 'bum), Section on Guru Yoga
sanskrit_devanagari: བླ་མ་མར་པའི་བྱིན་རླབས། (Blama Marpa'i byin rlabs.)
sanskrit_iast: ''
translation_literal: The guru Marpa's grace descends like rain upon the parched earth of my being. Without his fierce compassion,
  I would remain a fool, trapped in the prison of self-deception. His wrathful words cut through my pride like lightning;
  his silence teaches what speech cannot reach. I am nothing but a vessel—empty, cracked, worthless—yet through his blessing,
  even this broken pot holds the nectar of the dharma. My guru is the Buddha; my guru is the path; my guru is the fruit. In
  his presence, I die; in his absence, I am reborn.
commentary: 'This passage encapsulates the Tibetan Buddhist principle of guru yoga (bla ma''i rnal ''byor), wherein the teacher
  is recognized as inseparable from the Buddha-nature itself. Marpa (1012–1097), Milarepa''s teacher, was known for his harsh
  methods—demanding impossible tasks, withholding transmission, employing apparent rejection as a teaching tool. Milarepa''s
  devotion is not sentimental but radical: he sees in Marpa''s severity the ultimate expression of compassion, since it strips
  away ego-clinging. The agricultural metaphor (rain on parched earth) reflects the Tibetan landscape and the spiritual drought
  of ignorance. The ''broken pot'' alludes to the Zen image of the empty cup, but here explicitly tied to guru-bestowed grace
  (byin rlabs), a technical term denoting the transmission of realization through the teacher-student bond. This passage grounds
  Milarepa''s entire path: his twelve years of hardship under Marpa were not punishment but initiation.'
practice: 'Sit in meditation posture. Visualize your authentic spiritual teacher (or Marpa, if you have received transmission)
  at the crown of your head, radiant and compassionate. Recall a moment when their teaching—whether gentle or fierce—cut through
  your delusion. Breathe in their blessing as white light, filling your body, dissolving the boundary between teacher and
  student. Silently repeat: ''My guru is the Buddha; my guru is the path; my guru is the fruit.'' Do not strain for experience;
  simply rest in gratitude and openness. Practice for 15–20 minutes daily, especially when doubt or pride arises.'
