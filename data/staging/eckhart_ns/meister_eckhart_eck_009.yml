section: Sermon 5b (DW I, c. 90)
sanskrit_devanagari: Diu minne enweiz kein warumbe.
sanskrit_iast: ''
translation_literal: Love knows no why.
commentary: 'This compact saying names a decisive feature of Eckhart’s detachment: the deepest love is not a transaction.
  It does not love God for reward, security, spiritual sweetness, heaven, or even personal fulfillment. Nor does it require
  an explanatory ground outside itself. “Why” here means the calculating purpose that makes an act serve the self. Such purposiveness
  binds the soul to what it seeks and therefore leaves it divided. Love without a why is not irrational impulse or moral indifference;
  it is an act issuing from the soul’s ground, where willing has been released from possession and advantage. In this sense
  it resembles Eckhart’s teaching that the just person does justice not in order to gain something, but because justice lives
  and works in him. The saying is therefore both ascetical and metaphysical: relinquish the claim to outcomes, and let the
  good be done from its own inward truth.


  Key Terms


  **minne** — Middle High German love: not merely affection, but a self-transcending participation in the good.

  **warumbe** — “Why” or motive: the self-interested end for which one acts or loves.

  **Abgeschiedenheit** — Detachment or releasement: freedom from clinging to possessions, results, and self-advantage.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47; 3.19:** Krishna instructs Arjuna to act without attachment to the fruits of action; the deed is to
  be performed without possessive calculation. Divergence: The Gita retains a disciplined account of duty, yoga, and devotion
  to Krishna, whereas Eckhart’s aphorism concentrates on love’s freedom from motive.

  **Zhuangzi, “The Sign of Virtue Complete”:** Daoist spontaneity values action that does not arise from calculating self-assertion,
  akin to Eckhart’s unforced, non-instrumental love. Divergence: Zhuangzi frames this in terms of attunement to the Dao and
  freedom from fixed distinctions, not union with a personal or Trinitarian God.

  **The Cloud of Unknowing:** The anonymous English contemplative urges the soul to seek God through a “naked intent” of love
  rather than through grasping knowledge or spiritual gain. Divergence: The Cloud emphasizes an apophatic method of prayer,
  while Eckhart’s formula makes a broader claim about the intrinsic, motive-free nature of genuine love.'
practice: 'Before one ordinary act today—answering a message, doing work, offering help—pause for three breaths and silently
  ask: “What reward am I seeking?” Release the answer, then do the act simply and without rehearsing its result.'
