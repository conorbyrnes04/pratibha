unit_type: verse
section: Sermon 101 (DW IV.101)
sanskrit_devanagari: Man soll werden als er was, ehe er wurde. (Middle High German)
sanskrit_iast: ''
translation_literal: A human being should become as he was before he was born. One must strip away all that is accidental—time,
  place, bodily form, the very distinction between subject and object—and sink into that naked ground where the soul was not
  yet soul, where God alone was God, undivided and without otherness. There the Word is born eternally, and there you are
  born in God as God is born in you.
commentary: 'This passage crystallizes Eckhart''s most radical teaching: the soul''s regression to its pre-temporal origin
  in God''s undifferentiated being. ''Before you were born'' does not mean temporal priority but ontological priority—the
  soul''s eternal ground in the Godhead prior to any act of creation or individuation. Eckhart demands not mere remembrance
  but actual *becoming*: a stripping of accidents (Zufälligkeit) until subject and object collapse into the divine unity.
  The phrase echoes John 3:3 (''born again'') but inverts it—not rebirth into time, but return to timelessness. This teaching
  scandalized medieval orthodoxy because it seemed to erase the distinction between God and creature, between creation and
  eternity. Yet Eckhart insists this is not pantheism but the soul''s discovery of its true nature as eternally grounded in
  God''s simplicity, where multiplicity has never truly been.'
practice: 'Sit in silence. Observe the stream of thoughts, sensations, and self-images arising. Ask: *Which of these was present
  before I was born?* Do not answer intellectually. Let each layer—memory, emotion, body-sense, even the sense of ''I''—fall
  away like leaves. Descend into the silence beneath thought. There you will find no ''you'' to find it. Rest in that groundless
  ground. This is not escape but homecoming.'
