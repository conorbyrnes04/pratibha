title: Goodness for All Beings
unit_type: verse
sanskrit_devanagari: एवं सर्वमिदं कृत्वा यन्मयासादितं शुभं तेन स्यां सर्वसत्त्वानां सर्वदुःखप्रशान्तिकृत् ॥ ३.६ ॥
sanskrit_iast: evaṃ sarvamidaṃ kṛtvā yanmayāsāditaṃ śubhaṃ tena syāṃ sarvasattvānāṃ sarvaduḥkhapraśāntikṛt || 3.6 ||
translation_literal: Having thus done all this, whatever goodness (śubha) I have attained, may I thereby become one who brings
  the complete calming (praśānti) of every suffering to all sentient beings (sarvasattva).
commentary: 'The verse turns the preceding wholesome acts away from private possession. Śāntideva does not merely wish that
  beings receive a share of his śubha, “goodness” or merit; he asks to become, through it, an agent of their relief. The instrumental
  tena, “by that,” makes accumulated goodness a condition for bodhisattva activity rather than a spiritual reward to be retained.
  Sarvasattvānām is unrestricted: the aspiration extends to every sentient being, without distinction of friend, enemy, or
  stranger. Likewise, sarvaduḥkha-praśānti does not name one particular affliction but the settling of all forms of duḥkha.
  The verse is therefore a dedication and a reorientation of identity: “my” attainment is immediately offered as capacity
  to serve a universal end. Its grammar preserves humility as well as resolve: syām, “may I become,” is an aspiration, not
  a claim that liberation has already been accomplished.


  Key Terms


  **śubha** — Goodness, auspiciousness, or wholesome merit attained through beneficial action.

  **sarvasattva** — All sentient beings; the bodhisattva’s concern is deliberately without exclusion.

  **duḥkha** — Suffering, unsatisfactoriness, and distress in their full range.

  **praśānti** — Complete calming or pacification, here of all suffering.


  Cross-Tradition Resonances


  **The Bhagavad Gītā’s ideal of acting for loka-saṅgraha, the sustaining or welfare of the world.:** Both redirect action
  beyond personal gain toward the good of all. Divergence: The Gītā frames this chiefly through duty and nonattachment to
  results; Śāntideva explicitly dedicates goodness to ending every being’s suffering.

  **Paul’s description of love as seeking not its own advantage (1 Corinthians 13).:** Both reject a self-enclosed use of
  spiritual or moral achievement and orient it toward others’ good. Divergence: Paul grounds this love in relation to God
  and Christ; this verse articulates a bodhisattva aspiration grounded in transferable wholesome merit and universal liberation.'
practice: 'At the end of one helpful act today, pause and name it silently without self-congratulation. Then dedicate its
  goodness: “May this become a condition for the calming of suffering in all beings,” and let the wish include someone toward
  whom you feel resistance.'
