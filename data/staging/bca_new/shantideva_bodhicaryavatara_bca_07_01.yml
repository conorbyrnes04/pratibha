title: The Wind of Effort
unit_type: verse
sanskrit_devanagari: एवं क्षमो भजेद्वीर्यं वीर्ये बोधिर्यतः स्थिता न हि वीर्यं विना पुण्यं यथा वायुं विनागतिः ॥ ७.१ ॥
sanskrit_iast: evaṃ kṣamo bhajedvīryaṃ vīrye bodhiryataḥ sthitā na hi vīryaṃ vinā puṇyaṃ yathā vāyuṃ vināgatiḥ || 7.1 ||
translation_literal: Thus, being patient (kṣama), one should cultivate vigor (vīrya), for awakening (bodhi) is grounded in
  vigor. For there is no merit (puṇya) without vigor, just as there is no movement (gati) without wind (vāyu).
commentary: 'The verse makes vīrya, energetic perseverance, the indispensable condition of both merit and awakening. Its opening
  “thus” links effort to the preceding cultivation of patience: patience is not passive endurance, but the stable basis from
  which sustained practice can proceed without collapse into anger, discouragement, or fatigue. Bodhi is said to be “situated
  in” vīrya—not because effort alone manufactures awakening, but because every bodhisattva discipline requires repeated, active
  application. The analogy is exact in function: as wind is the enabling force of motion, vigor is the force that sets wholesome
  capacities in motion. Puṇya here is not a static moral possession; without ongoing effort, beneficial action does not arise
  or mature. The verse therefore rejects spiritual aspiration that remains merely wishful.


  Key Terms


  **kṣama** — Patient forbearance; the steadiness that precedes and supports active cultivation.

  **vīrya** — Vigorous, joyful perseverance in wholesome practice; one of the perfections.

  **bodhi** — Awakening; here said to rest upon sustained spiritual energy.

  **puṇya** — Merit or wholesome efficacy generated by beneficial intention and action.


  Cross-Tradition Resonances


  **Bhagavad Gītā:** The Gītā repeatedly commends disciplined action and steadfastness rather than inertia; like this verse,
  it treats spiritual realization as requiring active application. Divergence: Its framework is devotion to Kṛṣṇa and performance
  of one’s dharma, whereas Śāntideva grounds effort in the bodhisattva aim of universal awakening.

  **Early Buddhist teaching on viriya:** The Buddhist path commonly lists viriya, energy, among the awakening factors and
  spiritual faculties: wholesome states must be aroused and maintained. Divergence: This verse specifically places vigor after
  patience and frames its result in Mahāyāna terms of bodhi and merit for the bodhisattva path.

  **Marcus Aurelius:** Stoic exhortations to rise to one’s proper work parallel the refusal to let ethical insight remain
  inactive or merely theoretical. Divergence: Stoic effort is principally ordered toward rational integrity and acceptance
  of nature, not toward generating merit and awakening all beings.'
practice: At the start of one task you have been avoiding, pause and name the wholesome purpose it can serve. Work on it for
  ten undistracted minutes, treating each return from distraction as vīrya rather than judging your energy by mood alone.
