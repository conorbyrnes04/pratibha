title: Anger’s Unbidden Force
unit_type: verse
sanskrit_devanagari: अनिष्यमाणमप्येतच् छूलमुत्पद्यते यथा अनिष्यमाणो ऽपि बलात् क्रोध उत्पद्यते तथा ॥ ६.२३ ॥
sanskrit_iast: aniṣyamāṇamapyetac chūlamutpadyate yathā aniṣyamāṇo 'pi balāt krodha utpadyate tathā || 6.23 ||
translation_literal: Just as this pain (śūla), though not wished for, arises, so too anger (krodha), though not wished for,
  arises by force (balāt).
commentary: 'Śāntideva compares anger to bodily pain: neither ordinarily appears because one has deliberately chosen it. The
  point is not that anger is therefore innocent or without consequence, but that it is conditioned rather than freely authored
  at the moment of its arising. “By force” indicates the pressure of causes—habit, injury, frustrated desire, and the mind’s
  learned tendency to cast experience as an enemy. This undermines both self-condemnation (“I chose to be angry”) and the
  fantasy that anger is a reliable instrument of sovereign will. Since it arises dependently, it can also cease when its supports
  are understood and interrupted. The verse prepares patience not by suppressing moral concern, but by relocating it: the
  proper response is to examine conditions and train the mind, rather than to add a second wave of hostility toward oneself
  or another.


  Key Terms


  **śūla** — Pain, ache, or suffering; here the model for an unwilled arising.

  **krodha** — Anger or wrath, treated as a conditioned mental event rather than a chosen essence.

  **balāt** — By force; through the compelling power of conditions and habituation.


  Cross-Tradition Resonances


  **Buddhist dependent arising:** The verse treats anger as arising from conditions, consistent with the broader Buddhist
  analysis that afflictive states are dependently produced. Divergence: This couplet does not lay out a full causal chain,
  nor does it explicitly name craving, ignorance, or contact.

  **Epictetus, Enchiridion:** Stoicism distinguishes involuntary impressions from the judgments by which one assents to and
  develops them; anger need not be identified with the self. Divergence: Śāntideva frames the issue within compassion and
  the bodhisattva discipline of patience, rather than chiefly in terms of rational autonomy.

  **Paul’s description of divided willing in Romans 7:** Paul recognizes that a person may do what they do not wish to do,
  revealing the force of entrenched patterns beyond immediate intention. Divergence: Paul’s account is articulated through
  sin and divine deliverance, whereas Śāntideva analyzes anger as a conditioned affliction to be transformed through insight
  and practice.'
practice: 'When anger first appears, silently note: “Unwanted, conditioned, arising by force.” Locate its bodily pain—heat,
  tightening, pressure—without acting from it, and ask which immediate condition is feeding it: hurt, fear, thwarted desire,
  or a hostile interpretation.'
