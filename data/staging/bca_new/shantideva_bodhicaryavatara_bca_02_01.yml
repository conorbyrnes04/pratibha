sanskrit_devanagari: तच्चित्तरत्नग्रहणाय सम्यक् पूजां करोम्येष तथागतानां सद्धर्मरत्नस्य च निर्मलस्य बुद्धात्मजानां च गुणोदधीनां
  ॥ २.१ ॥
sanskrit_iast: taccittaratnagrahaṇāya samyak pūjāṃ karomyeṣa tathāgatānāṃ saddharmaratnasya ca nirmalasya buddhātmajānāṃ ca
  guṇodadhīnāṃ || 2.1 ||
translation_literal: To obtain that jewel of mind (cittaratna), I here make proper worship (pūjā) of the Tathāgatas, of the
  stainless jewel of the true Dharma (saddharma), and of the Buddha-sons (buddhātmaja), oceans of qualities.
commentary: 'The verse begins not with self-assertion but with reverence. “That jewel of mind” refers to bodhicitta, the awakened
  intention whose value is developed in the preceding praise. Its acquisition is not treated as a private achievement: Śāntideva
  turns toward the sources and embodiments of awakening—the Tathāgatas, the pure Dharma, and the bodhisattvas. The grammar
  makes worship instrumental: pūjā is performed “for obtaining” bodhicitta. Reverence therefore trains the mind away from
  possessiveness and toward receptivity to a path larger than oneself. The Dharma is called a jewel because it is precious
  and effective; it is “stainless” because its liberating truth is not corrupted by afflictive motives. Bodhisattvas are “oceans
  of qualities,” suggesting inexhaustible ethical and compassionate excellence rather than mere status.


  Key Terms


  **cittaratna** — “Jewel of mind”; here, the precious awakened intention of bodhicitta.

  **pūjā** — Reverential offering or worship, undertaken as a discipline of devotion and humility.

  **saddharmaratna** — The jewel of the true Dharma, described as stainless (nirmala).

  **buddhātmaja** — “Child/son of the Buddha,” a bodhisattva shaped by the Buddha’s awakening.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9.26:** The Gītā presents a modest offering made with devotion as spiritually meaningful; Śāntideva likewise
  frames offering as transformative for the giver. Divergence: The Gītā’s offering is directed to Kṛṣṇa as Lord, whereas this
  verse honors the Buddha, Dharma, and bodhisattvas without invoking a creator deity.

  **Christian Eucharistic praise:** Both practices use thankful, reverent orientation toward a sacred source as a means of
  reshaping the worshipper’s life. Divergence: Eucharistic worship centers on Christ’s saving action and divine grace; Śāntideva’s
  pūjā is directed toward the Three Jewels in service of generating bodhicitta.'
practice: 'Place a simple offering—a flower, light, or bowl of water—before an image or written reminder of the Buddha, Dharma,
  and bodhisattvas. As you offer it, say inwardly: “May this act support the arising of bodhicitta,” then name one quality
  of awakening you wish to receive and cultivate.'
