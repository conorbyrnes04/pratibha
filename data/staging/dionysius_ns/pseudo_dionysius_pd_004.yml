section: Mystical Theology I.2
sanskrit_devanagari: ἡ ὑπερούσιος ἀκρότης πάσης ὀνοματολογίας καὶ γνώσεως ἐπέκεινα κατὰ πάντα τρόπον ὑπερέχει (hē hyperousios
  akrotēs pasēs onomatologias kai gnōseōs epekeina kata panta tropon hyperechei)
sanskrit_iast: ''
translation_literal: The transcendent summit of the Cause-of-all, standing utterly beyond all naming and knowledge, surpasses
  in every manner the whole of being. Trinity beyond being, beyond divinity, beyond goodness—thou art known to those who transcend
  all knowing, and thou art celebrated in the silence that speaks more truly than all utterance. For to say that the divine
  is light or darkness, being or non-being, is already to bind the Infinite within the finite cage of our words. The negation
  of negation alone approaches the truth of what lies beyond both assertion and denial.
commentary: 'This passage crystallizes Pseudo-Dionysius''s apophatic method: the divine is not merely unknown but *unknowable*,
  not because of human limitation alone but because the divine transcends the very categories—being, goodness, light—by which
  we name it. The formula ''beyond assertion and denial'' (epekeina kataphaseōs kai apophaseōs) rejects both cataphatic theology
  (positive naming) and simple negation as final. Even to say ''God is not X'' risks reifying the divine as a thing that lacks
  properties. The Trinity is invoked not as doctrine but as the ultimate refusal of rational systematization. This move proved
  foundational to Christian mysticism and influenced Islamic apophaticism (via Neoplatonic channels) and Eastern Orthodox
  hesychasm. The passage enacts its own teaching: it speaks eloquently of silence, names the unnameable, and thereby demonstrates
  the paradox it articulates.


  Cross-Tradition Resonances


  **The One is beyond being and predication; all speech about it is inadequate:**  Divergence: Plotinus grounds this in metaphysical
  emanation; Pseudo-Dionysius adds Christian trinitarian and incarnational dimensions, making unknowing redemptive rather
  than merely ontological'
practice: 'In silence, gather your mind. Speak inwardly each name of God—Light, Love, Being, Goodness—and with each, consciously
  release it, saying: ''Not this, not this.'' Do not rest in the negation itself, but allow the mind to fall through the floor
  of negation into the darkness beyond. Remain there, suspended in unknowing, without grasping, without image, without word.
  This is the threshold of union. Return slowly, carrying nothing but the taste of that silence into your ordinary speech.'
