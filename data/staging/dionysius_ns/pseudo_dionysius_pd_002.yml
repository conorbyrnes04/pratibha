sanskrit_devanagari: Τριπέρυξ ἅγιε, ὑπεράνω οὐσίας καὶ γνώσεως, ὑπεράνω τοῦ ἱεροῦ φωτὸς ἀναβιβάζων ἡμᾶς εἰς τὴν ὑπερλαμπρότητα
  τῆς σκότους.
sanskrit_iast: ''
translation_literal: O Trinity beyond being and knowledge, who dost lead the sacred initiates upward into the superluminous
  darkness—guide us beyond all knowing into that unknowing which transcends all intellection. For to know thee truly is to
  know thee as utterly unknowable; and the dazzling darkness of thy silence is the truest light.
commentary: 'This passage crystallizes Pseudo-Dionysius''s apophatic theology: the divine transcends both being (ousia) and
  knowledge (gnōsis), rendering all positive predication inadequate. The paradoxical ''superluminous darkness'' (hyperlampros
  skotos) inverts ordinary epistemology—light becomes darkness, knowledge becomes unknowing. The soul ascends by stripping
  away conceptual layers until intellection itself ceases, yielding to a non-rational union. This is not agnosticism but radical
  negation: God is not unknown because inaccessible but because infinitely beyond the categories through which we know creatures.
  The ''sacred initiates'' (hierous teleioumenous) suggests mystical initiation as the path. Unknowing here denotes not privation
  but superabundance—the intellect overwhelmed by excess rather than deprivation.'
practice: In silence, cease all mental discourse. Release images, concepts, and even the sense of 'I' who knows. When thought
  stills, remain in that emptiness without grasping. Should a subtle luminosity or darkness appear, do not cling to it as
  an object. Rest in the unknowing itself—the naked presence beyond subject and object. This is the threshold of theōsis.
  Return to ordinary consciousness with reverence, carrying no claim of attainment.
