section: II.4
sanskrit_devanagari: 子曰：「吾十有五而志于學，三十而立，四十而不惑，五十而知天命，六十而耳順，七十而從心所欲，不踰矩。」
sanskrit_iast: ''
translation_literal: 'The Master said: “At fifteen I set my heart upon learning. At thirty I stood firm. At forty I was free
  of perplexity. At fifty I knew Heaven’s mandate. At sixty my ear was attuned. At seventy I followed what my heart desired
  without overstepping the bounds.”'
commentary: 'This saying is not a universal timetable for human achievement, but a compressed portrait of moral formation.
  Learning begins as aspiration: one directs the heart toward study and self-cultivation. To “stand firm” is to acquire a
  stable orientation rather than mere social independence. Freedom from perplexity follows when judgment has been disciplined
  by learning, experience, and ritual discernment. Knowing Heaven’s mandate (tianming) is not fatalism; it is recognition
  of the moral order, limits, and responsibilities within which one lives. “My ear was attuned” suggests receptive understanding:
  the mature person can hear words, persons, and situations rightly. The culmination is striking. Desire is not crushed or
  distrusted; it has been educated so deeply by li, ritual propriety, that spontaneous inclination no longer violates the
  measure. Confucian freedom is therefore not freedom from form, but the embodiment of form until right action becomes unforced.


  Key Terms


  **學 (xue)** — Learning: sustained moral and cultural cultivation, not merely acquisition of information.

  **天命 (tianming)** — Heaven’s mandate: the larger moral order and one’s allotted responsibilities within it.

  **心 (xin)** — Heart-mind: the integrated seat of feeling, intention, judgment, and desire.

  **矩 (ju)** — Carpenter’s square; figuratively, the proper measure or normative boundary.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics:** Aristotle likewise holds that virtue is formed through habituation, until the virtuous
  person takes pleasure in acting well. Divergence: Aristotle emphasizes the mean as practical judgment in particular actions,
  while Confucius frames maturity through learning, Heaven, and ritual propriety.

  **Plato, Republic:** Plato’s ordered soul resembles the Confucian ideal in which desire is educated rather than simply indulged.
  Divergence: Plato gives reason a ruling, often sharply hierarchical role; this passage presents a final harmony in which
  heart’s desire itself has become fitting.

  **Augustine, Homilies on the First Epistle of John:** Augustine’s maxim, “Love, and do what you will,” similarly imagines
  desire transformed so that right action flows from inward formation. Divergence: Augustine grounds this transformation in
  divine love and grace, whereas Confucius foregrounds lifelong cultivation through learning and li.'
practice: 'At day’s end, recall one strong desire you acted upon. Ask: did it overstep the measure, suppress itself needlessly,
  or express a desire educated by regard for others? Write one small ritualized action for tomorrow that could train the desire
  toward fitting expression.'
