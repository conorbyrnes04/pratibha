section: VI.29
sanskrit_devanagari: 子曰：「中庸之為德也，其至矣乎！民鮮久矣。」
sanskrit_iast: ''
translation_literal: 'The Master said: “As a virtue, the Mean (zhongyong) is surely of the highest order! Yet it has long
  been rare among the people.”'
commentary: 'This compressed saying praises zhongyong not as bland moderation or a numerical midpoint, but as a disciplined
  capacity to respond fittingly to the particular moral situation. Zhong, “the center,” suggests freedom from distorting excess,
  bias, and reactive partiality; yong, often rendered “constant” or “ordinary,” suggests a steadiness enacted in everyday
  relations rather than an exceptional mystical state. The virtue is therefore difficult precisely because it requires cultivated
  perception: one must know what reverence, courage, generosity, restraint, or frankness appropriately demand here and now.
  Confucius’ lament that it is long rare among the people is not contempt for ordinary life. It underscores that the highest
  moral achievement lies in ordinary conduct—speech, family roles, public responsibility—when these are governed by humane
  discernment rather than appetite, convention, or self-display. The later text Zhongyong develops this theme, but the Analects
  passage itself remains deliberately aphoristic.


  Key Terms


  **中 (zhong)** — Center; balanced moral responsiveness free from excess and partiality.

  **庸 (yong)** — Constancy or the ordinary; a stable virtue embodied in daily life.

  **德 (de)** — Virtue or moral power; cultivated character that shapes conduct and relations.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6:** Aristotle likewise locates virtue between excess and deficiency, determined in relation
  to the person and circumstance. Divergence: Aristotle’s mean is framed through practical reason and individual virtues,
  while Confucian zhongyong is especially embedded in relational roles, ritual propriety, and social harmony.

  **The Buddha’s Middle Way, first sermon at Sarnath:** Both reject destructive extremes and commend a disciplined path that
  avoids enslavement to impulse. Divergence: The Buddhist Middle Way primarily addresses liberation from suffering through
  a path beyond sensual indulgence and asceticism; zhongyong concerns fitting ethical responsiveness within human relationships.

  **Hebrew Bible, Ecclesiastes 7:16–18:** Ecclesiastes warns against self-righteous excess as well as reckless wrongdoing,
  recognizing the danger of moral distortion at either pole. Divergence: Ecclesiastes speaks in a wisdom register marked by
  human limitation before God, whereas Confucius presents the Mean as a cultivated excellence of ethical and ritual life.'
practice: 'Before one consequential conversation today, pause for three breaths and ask: “What would be too forceful here?
  What would be evasively weak? What response is both truthful and fitting to this person and relationship?” Then speak from
  that considered center.'
