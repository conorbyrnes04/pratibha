unit_label: The Turīya Beyond All States
title: The Turīya Beyond All States
unit_type: verse
sanskrit_devanagari: 'तुरीयम् इत्य् एव केवलम् ।

  अजातम् अव्ययम् शान्तम् अद्वैतम् परम-उत्तमम् ॥ ४.९९ ॥'
sanskrit_iast: 'turīyam ity eva kevalam |

  ajātam avyayam śāntam advaitam parama-uttamam || 4.99 ||'
translation_literal: That alone is called turīya (the fourth)—unborn, immutable, peaceful, non-dual, the supreme ultimate.
  It is beyond waking, dream, and deep sleep; it is the witness-consciousness that neither originates nor perishes.
commentary: 'Gauḍapāda''s Kārikā 4.99 crystallizes the non-dual realization toward which the entire Māṇḍūkya teaching points.
  Turīya (literally ''the fourth'') is not a fourth state alongside waking, dream, and sleep, but the transcendent ground
  that illuminates all three without being affected by them. The epithets—ajāta (unborn), avyaya (immutable), śānta (peaceful),
  advaita (non-dual)—systematically negate causality, change, agitation, and multiplicity. This verse anchors Gauḍapāda''s
  radical ajātivāda (doctrine of non-origination): consciousness never truly becomes the world; apparent creation is only
  apparent. Turīya is not attained but recognized as one''s own nature. The verse dissolves the seeker-seeking duality by
  revealing that what seeks is already what is sought.


  Cross-Tradition Resonances


  **Brahman as sat-cit-ānanda (being-consciousness-bliss), untouched by the three guṇas or states of mind.:**  Divergence:
  Śaṅkara emphasizes jñāna (knowledge) as the means; Gauḍapāda stresses that ignorance itself is unreal (ajātivāda is more
  radical).

  **Ālaya-vijñāna as the ground consciousness beyond subject-object duality; recognition of mind-only.:**  Divergence: Yogācāra
  retains momentary flux and karmic conditioning; Gauḍapāda''s turīya is eternally immutable and free of all conditioning.

  **Śiva as the witnessing consciousness (sākṣī) that pervades all states without modification.:**  Divergence: Śaivism celebrates
  divine play (līlā) and creative emanation; Gauḍapāda''s ajātivāda denies even cosmic creation as ultimately real.'
practice: 'Sit in meditation. Observe waking consciousness, then the dream-state (if accessible in practice, or recall it),
  then the void of deep sleep. Notice the unchanging witness-presence that knows all three yet is untouched by any. Rest as
  that turīya—not as an object of experience, but as the ever-present knowing itself. Repeat silently: ''I am not the states;
  I am the eternal witness.'' Return to this recognition whenever identification with thought or sensation arises.'
