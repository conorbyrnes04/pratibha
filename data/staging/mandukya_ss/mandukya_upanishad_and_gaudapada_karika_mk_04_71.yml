title: The Turīya Beyond All States
unit_type: verse
sanskrit_devanagari: 'तुरीयम् इत्य् अभिधीयते ।

  येन सर्वम् इदम् विज्ञानम् ।

  तत् सत्य-ज्ञान-आनन्द-मयम् ।

  ब्रह्म इत्य् आचक्षते ॥ ४.७१ ॥'
sanskrit_iast: 'turīyam ity abhidhīyate |

  yena sarvam idam vijñānam |

  tat satya-jñāna-ānanda-mayam |

  brahma ity ācakṣate || 4.71 ||'
translation_literal: 'That which is called turīya (the fourth)—by which all this is known—that which is made of truth, knowledge,
  and bliss: they call it brahman. The turīya is not the experiencer of the three states (waking, dream, deep sleep), yet
  it is the witness-consciousness that illuminates all knowing.'
commentary: 'Gauḍapāda''s Kārikā IV.71 culminates the doctrine of turīya—the fourth state of consciousness that transcends
  waking (vaiśvānara), dream (taijasa), and deep sleep (prājña). Unlike those three, turīya is not a state but the unchanging
  witness-ground. It is not an experiencer (bhoktr̥) but pure knowing (vijñāna). The triple characterization—satya (truth/reality),
  jñāna (knowledge/consciousness), ānanda (bliss)—echoes the Upaniṣadic definition of brahman itself. Gauḍapāda emphasizes
  that turīya is not a fourth state alongside the three but their transcendent substratum. This verse resolves the apparent
  paradox: turīya is both utterly beyond all mental states and intimately present as the light by which all experience occurs.
  The identification with brahman is direct and non-inferential.


  Cross-Tradition Resonances


  **Śaṅkara''s commentary on Brahma Sūtra 1.1.1 identifies brahman as the witness-consciousness (sākṣī) that is self-luminous
  and beyond all states.:**  Divergence: Śaṅkara emphasizes māyā''s role in veiling brahman; Gauḍapāda''s ajātivāda denies
  even the appearance of creation, making turīya''s non-duality more radical.

  **Abhinavagupta''s Parātrīśikā describes Śiva as the supreme witness (mahāsākṣī) whose consciousness illuminates all states
  without modification.:**  Divergence: Abhinavagupta affirms dynamic manifestation (spanda); Gauḍapāda''s turīya remains
  utterly static and unaffected.

  **Rigpa (pristine awareness) is described as the luminous, unchanging ground that witnesses all mental states without being
  affected by them.:**  Divergence: Dzogchen posits rigpa as intrinsically dynamic and creative; turīya in Gauḍapāda is non-creative
  and purely witnessing.'
practice: 'Sit in meditation and observe the three states: waking (notice the sense of agency and external objects), dream
  (notice the mind''s autonomous creation), deep sleep (notice the absence of both). Then, without entering sleep, recognize
  the unchanging awareness that witnesses all three—present now, untouched by any state. Rest as that turīya, the fourth,
  which is neither subject nor object but the luminous ground of all knowing. Return to this recognition repeatedly throughout
  the day.'
