title: 'The Witness Unmoved: Consciousness Beyond Modification'
unit_type: verse
sanskrit_devanagari: 'न जायते न म्रियते न वा विकुरुते क्वचित् ।

  अजो नित्यः शाश्वतो ऽयम् पुराणो न हन्यते हन्यमाने शरीरे ॥ ३.१५ ॥'
sanskrit_iast: 'na jāyate na mriyate na vā vikurute kvacit |

  ajo nityaḥ śāśvato ''yam purāṇo na hanyate hanyamāne śarīre || 3.15 ||'
translation_literal: It is not born, nor does it die, nor does it undergo transformation anywhere. Unborn, eternal, perpetual,
  this ancient one is not destroyed when the body is destroyed.
commentary: 'Gauḍapāda''s third chapter (Advaita Prakaraṇa) establishes ajātivāda—the doctrine of non-origination—as the ultimate
  truth of consciousness. Verse 15 crystallizes this teaching: the Self (ātman) is intrinsically immutable, untouched by the
  flux of becoming and perishing that characterizes empirical existence. The phrase ''na jāyate na mriyate'' echoes Bhagavad
  Gītā 2.20 but deepens it through the lens of ajāti: not merely ''does not die'' but fundamentally ''never originates.''
  The apparent birth and death of the body leave the witness-consciousness entirely unaffected. This verse demolishes the
  notion that consciousness undergoes real transformation (vikāra), a cornerstone of Sāṃkhya dualism that Gauḍapāda refutes.
  The eternal (nityaḥ) and primordial (purāṇaḥ) nature of consciousness means it cannot be harmed by bodily destruction—a
  direct negation of the fear-basis of saṃsāra.


  Cross-Tradition Resonances


  **''na jāyate mriyate vā kadācit''—the Self is never born nor dies:**  Divergence: Gītā frames this within dharma and action;
  Gauḍapāda makes it the ground of all reality, negating even the appearance of origination

  **Brahman as ''satyaṃ jñānam anantam''—truth, consciousness, infinity—untouched by becoming:**  Divergence: Taittirīya emphasizes
  Brahman''s fullness; Gauḍapāda emphasizes its non-participation in causality itself

  **Critique of real origination; emphasis on the illusory nature of phenomenal change:**  Divergence: Yogācāra denies a permanent
  witness; Gauḍapāda affirms turīya as the unchanging ground of all apparent transformation'
practice: 'Sit in meditation and observe the arising and passing of thoughts, sensations, and emotions. Without identifying
  with any modification, rest as the unmoved witness. Silently repeat: ''I am not born, I do not die, I do not change.'' Notice
  how this recognition—that your true nature is untouched by all becoming—gradually dissolves the fear-contraction at the
  root of ego-identification.'
