unit_label: The Two Birds in One Tree
title: The Two Birds in One Tree
unit_type: verse
sanskrit_devanagari: 'द्वा सुपर्णा सयुजा सखाया समानं वृक्षं परिषस्वजाते ।

  तयोर् अन्यः पिप्पलं स्वाद्व् अत्त्य् अनश्नन्न् अन्यो अभिचाकशीति ॥ ३.१.१ ॥'
sanskrit_iast: 'dvā suparṇā sayujā sakhāyā samānaṃ vṛkṣaṃ pariṣasvajāte |

  tayor anyaḥ pippalaṃ svādv atty anaśnann anyo abhicākaśīti || 3.1.1 ||'
translation_literal: Two fair-winged birds, joined companions, cling to the same tree. Of the two, one eats the sweet pippala
  fruit; the other, not eating, simply looks on.
commentary: 'The tree is the embodied field of experience: the world, the body, and the karmic situation in which enjoyment
  unfolds. The fruit-eating bird is the individual experiencer, the jīva, drawn into the alternating sweetness and bitterness
  of action and result. Its companion is not elsewhere; it shares the very same tree. Yet it does not consume, acquire, or
  suffer the fruit. It is the witnessing Self, the luminous presence later identified with Brahman. The image does not posit
  two ultimately separate selves as a final doctrine. Rather, it stages the felt division between the bound self, identified
  with experience, and the unbound reality that silently illumines it. Liberation begins when attention turns from compulsive
  tasting to the ever-present seer. The witness is not a detached psychological spectator but the ground by which both bird,
  tree, and fruit are known.


  Key Terms


  **suparṇā** — fair-winged birds

  **sayujā sakhāyā** — intimately joined companions

  **pippalam** — the sweet fig-fruit, symbol of experienced results

  **anaśnan** — not eating; untouched by enjoyment and its consequences


  Cross-Tradition Resonances


  **The Gītā distinguishes the field-knower from the field of changing experience, and contrasts the perishable individual
  with the supreme Person.:**  Divergence: Its formulations are more explicitly theological and devotional; this verse works
  through a compact contemplative image.

  **Mindfulness practice distinguishes changing sensations, feelings, and reactions from the knowing of them, loosening identification
  with what is tasted.:**  Divergence: Buddhist traditions generally deny an eternal witnessing Self, whereas the Upaniṣadic
  trajectory identifies the unconsuming seer with ultimate reality.

  **Stoic discipline asks one to notice impressions without immediately assenting to them, creating freedom from compulsive
  involvement in pleasure and pain.:**  Divergence: Stoicism frames this as ethical rational agency, not as realization of
  an identity between the inner witness and Brahman.'
practice: 'For five minutes, attend to a pleasant or unpleasant sensation without trying to alter it. Silently note, “experienced,”
  then ask: “What is aware of this experience?” Rest with the knowing rather than pursuing the sensation’s fruit.'
