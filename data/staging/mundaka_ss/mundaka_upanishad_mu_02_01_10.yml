sanskrit_devanagari: 'पुरुष एवेदं विश्वं कर्म तपो ब्रह्म परामृतम् ।

  एतद् यो वेद निहितं गुहायां सो ’विद्याग्रन्थिं विकिरतीह सोम्य ॥ २.१.१० ॥'
sanskrit_iast: 'puruṣa evedaṃ viśvaṃ karma tapo brahma parāmṛtam |

  etad yo veda nihitaṃ guhāyāṃ so ’vidyāgranthiṃ vikiratīha somya || 2.1.10 ||'
translation_literal: 'This whole universe is indeed the Puruṣa: action, austerity, Brahman, the supreme immortal. Whoever
  knows this, lodged in the cave [of the heart], here itself, dear one, scatters the knot of avidyā, not-knowing.'
commentary: 'The verse makes an uncompromising identification: the Puruṣa, the conscious reality, is not one item within the
  world but the truth of “this whole” (idaṃ viśvam). Karma and tapas are not rejected as meaningless; they are gathered into
  Brahman when seen in their ground rather than taken as independent means of final fulfillment. Parāmṛtam names Brahman as
  the deathless beyond merely finite religious results. Yet this is not presented as a remote metaphysical conclusion. It
  is nihitaṃ guhāyām, hidden or placed in the inward “cave,” the heart’s depth where the knower discovers the source of awareness
  itself. Knowledge here is transformative recognition, not information. Its result is that the avidyāgranthi, the binding
  knot formed by misidentification with the limited self, is vikirati—scattered, loosened apart—while living (iha).


  Key Terms


  **puruṣa** — the supreme conscious Person or reality

  **parāmṛtam** — the highest, deathless reality

  **guhā** — the inward cave, the depth of the heart

  **avidyāgranthi** — the knot of ignorance or misidentification


  Cross-Tradition Resonances


  **The Gītā likewise presents the supreme Puruṣa as pervading and sustaining the world, while liberation comes through knowing
  that reality.:**  Divergence: The Gītā more explicitly frames this realization through devotion, disciplined action, and
  surrender to Kṛṣṇa.

  **Its diagnosis of bondage through avidyā resembles the Upaniṣadic image of a binding knot dissolved by liberating insight.:**  Divergence:
  Buddhist traditions generally deny an eternal Puruṣa or self; awakening sees the emptiness and conditioned arising of all
  phenomena.

  **Writers such as Augustine and the author of The Cloud of Unknowing direct attention inward, where God is encountered more
  intimately than external things.:**  Divergence: Christian contemplation maintains a creator-creature distinction rather
  than identifying the whole universe and deepest self with Brahman.'
practice: 'Sit quietly and notice each thought, role, memory, and sensation as an appearance within awareness. Then ask without
  seeking a verbal answer: “What is the aware presence in which this is known?” Rest there for five minutes, returning whenever
  attention contracts around a limited identity.'
