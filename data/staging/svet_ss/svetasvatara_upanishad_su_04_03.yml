unit_label: The One in Every Form
title: The One in Every Form
unit_type: verse
sanskrit_devanagari: 'त्वम् स्त्री त्वम् पुमान् असि त्वम् कुमार उत वा कुमारी ।

  त्वम् जीर्णो दण्डेन वञ्चसि त्वम् जातो भवसि विश्वतो-मुखः ॥ ४.३ ॥'
sanskrit_iast: 'tvam strī tvam pumān asi tvam kumāra uta vā kumārī |

  tvam jīrṇo daṇḍena vañcasi tvam jāto bhavasi viśvato-mukhaḥ || 4.3 ||'
translation_literal: You are woman; you are man. You are the boy, and also the girl. You are the aged one who walks leaning
  on a staff. Being born, you become facing in every direction.
commentary: 'The verse addresses the supreme reality directly as tvam, “you,” refusing to confine it to a remote abstraction.
  The One appears as the full range of embodied life: feminine and masculine, youth and age, birth and frailty. This is not
  merely a claim that all persons are morally equal, though it supports that insight; it is a metaphysical vision in which
  the divine is present through every finite form. “Walking with a staff” gives the teaching particular force: the Absolute
  is not recognized only in strength, beauty, or ritual purity, but in vulnerable, aging life. Viśvato-mukhaḥ, “facing in
  every direction,” gathers these forms into an image of all-pervading awareness. The One is not exhausted by any body or
  social identity, yet no body lies outside its manifestation. The verse therefore counters both idolization of a single form
  and contempt for the many forms through which reality is encountered.


  Key Terms


  **strī** — woman; the feminine person or form

  **pumān** — man; the masculine person or form

  **jīrṇa** — aged, worn, infirm

  **viśvato-mukhaḥ** — having faces in every direction; all-pervading


  Cross-Tradition Resonances


  **Paul’s declaration that distinctions such as male and female do not determine one’s standing “in Christ” parallels the
  verse’s refusal to treat gender as spiritually ultimate.:**  Divergence: Galatians concerns communal identity and salvation
  in Christ; this Upaniṣadic verse identifies the divine itself with all embodied forms.

  **Its gender-transformation episode challenges attachment to male and female as fixed spiritual categories, much as this
  verse destabilizes exclusive identification with any one form.:**  Divergence: Mahayana analysis typically frames such forms
  as empty of inherent self, whereas the Upaniṣad speaks of a supreme Self manifesting through them.

  **Ibn ʿArabi describes the Real as disclosed in innumerable forms, inviting recognition of divine signs across diverse appearances.:**  Divergence:
  Islamic theology preserves a strong Creator–creation distinction; the Upaniṣadic language here is more direct in saying,
  “You are” each human condition.'
practice: During one ordinary day, silently repeat “You are this also” when encountering a child, an adult, an elder, and
  yourself. Let the phrase interrupt habitual judgments; then rest for three breaths in awareness of the same witnessing presence
  meeting each face.
