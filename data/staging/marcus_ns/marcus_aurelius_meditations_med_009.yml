section: V.20
sanskrit_devanagari: Τὸ ἐμποδίζον τῇ πράξει προκόπτει τὴν πρᾶξιν, καὶ τὸ ἐνιστάμενον τῇ ὁδῷ γίνεται ὁδός.
sanskrit_iast: ''
translation_literal: The impediment to action advances the action; what stands in the way becomes the way.
commentary: 'This is not a promise that every setback will yield worldly success, nor an invitation to deny pain or injustice.
  Marcus identifies a freedom proper to rational agency: an obstacle can alter the material of one’s task without abolishing
  the task of acting well. If travel is blocked, one may practice endurance, resourcefulness, or just judgment; if another
  person is hostile, one may respond without surrendering one’s own character. The external event remains outside complete
  control, but the use made of it belongs to prohairesis, the faculty of moral choice. Thus resistance is not merely endured
  after the fact; it becomes the very occasion on which courage, patience, fairness, and practical intelligence take form.
  The saying is Stoic, not triumphalist: some roads truly end, bodies fail, and death comes. Yet even then, the path of a
  good will—meeting reality lucidly and acting according to nature—remains open.


  Key Terms


  **πρᾶξις (praxis)** — Action or deed; here, purposeful moral activity rather than mere motion.

  **ἐμποδίζον (empodizon)** — That which obstructs or hinders; an apparent impediment.

  **ὁδός (hodos)** — Way, road, or course; the path of conduct shaped through circumstance.

  **προκόπτει (prokoptei)** — Advances or furthers; the obstacle can become material for progress in action.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:**  Divergence: Epictetus stresses assent to what happens; Marcus stresses the active transformation
  of resistance into a field for virtuous action.

  **Bhagavad Gita, especially 2.47 and 2.48:**  Divergence: The Gita frames disciplined action within devotion, dharma, and
  liberation; Marcus grounds it in Stoic reason and participation in cosmic nature.

  **Viktor Frankl, Man’s Search for Meaning:**  Divergence: Frankl’s existential and therapeutic account is not Stoic cosmology;
  Marcus does not make meaning primarily an individual creation but a matter of living in accord with nature.'
practice: 'Name one present obstacle in a sentence. Then write two columns: “What I cannot command” and “What this now asks
  me to practice.” Choose one small action, to be done today, that expresses the relevant virtue—patience, courage, justice,
  or practical wisdom.'
