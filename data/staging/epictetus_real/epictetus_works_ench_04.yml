unit_label: The Bath and the Inner Aim
title: The Bath and the Inner Aim
unit_type: verse
section: Enchiridion 4
translation_literal: 'When you are going about any action, remind yourself what nature the action is. If you are going to
  bathe, picture to yourself the things which usually happen in the bath: some people splash the water, some push, some use
  abusive language, and others steal. Thus you will more safely go about this action if you say to yourself, "I will now go
  bathe, and keep my own mind in a state conformable to nature." And in the same manner with regard to every other action.
  For thus, if any hindrance arises in bathing, you will have it ready to say, "It was not only to bathe that I desired, but
  to keep my mind in a state conformable to nature; and I will not keep it if I am bothered at things that happen.'
commentary: 'Epictetus trains anticipation not as anxious rehearsal but as moral preparation. Every external undertaking has
  a practical aim—here, bathing—but the decisive aim is the use one makes of impressions while doing it. Crowding, insult,
  and theft belong to the unstable field of externals; they may frustrate comfort or even the immediate plan, but they cannot
  by themselves damage character. Before acting, one should therefore attach a reservation to one’s purpose: “I will do this,
  while preserving a judgment and disposition in accord with nature.” Nature here means the rational and social order proper
  to a human being: lucid judgment, self-command, and freedom from retaliatory passion. The point is not passive acceptance
  of wrongdoing. One may protect property, leave the bath, or address an offender. But such responses must proceed from prohairesis
  rather than from the claim that an external event has ruined one’s good. The true failure is not being splashed; it is surrendering
  one’s governing faculty to irritation.


  Key Terms


  **prohairesis** — The rational moral faculty of choice: the domain in which one’s good or bad truly lies.

  **eph’ hēmin** — “Up to us”: our judgments, intentions, and choices, unlike the behavior of other people.

  **phantasia** — An impression or appearance; it must be assessed rather than automatically obeyed.

  **kata physin** — “According to nature”: acting with rationality, self-command, and regard for one’s human role.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations:** Marcus likewise advises meeting anticipated annoyances by remembering that others act
  from ignorance and that one’s own mind need not be harmed. Both make inner judgment the site of freedom. Divergence: Marcus
  often frames the exercise through cosmic providence and civic fellowship more explicitly; Epictetus here gives a compact
  discipline for attaching a moral aim to ordinary action.

  **Buddhist teachings on the “second arrow”:** The familiar image distinguishes unavoidable pain from the additional suffering
  produced by reactive mental resistance. Epictetus similarly separates an external disturbance from the anger one adds to
  it. Divergence: Buddhist analysis generally explains reactivity through craving, impermanence, and non-self; Epictetus grounds
  responsibility in a rational choosing faculty and living according to nature.

  **The Bhagavad Gita’s discipline of action without attachment to results:** The Gita counsels performing one’s duty while
  relinquishing possessive attachment to success and failure. Epictetus likewise shifts priority from obtaining an outcome
  to maintaining right inner orientation. Divergence: The Gita embeds this discipline in devotion, dharma, and relation to
  Krishna; Epictetus presents it as ethical independence of judgment within Stoic rational order.'
practice: 'Before one routine activity today—commuting, shopping, meeting, or exercising—name two likely inconveniences. Then
  state silently: “My aim is to do this and to keep my judgment calm, just, and self-governed.” When an inconvenience occurs,
  pause for one breath and identify the external event separately from the judgment urging irritation before responding.'
