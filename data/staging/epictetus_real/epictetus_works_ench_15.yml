title: At the Table of Fortune
unit_type: verse
section: Enchiridion 15
translation_literal: Remember that you must behave in life as at a dinner party. Is anything brought around to you? Put out
  your hand and take your share with moderation. Does it pass by you? Don't stop it. Is it not yet come? Don't stretch your
  desire towards it, but wait till it reaches you. Do this with regard to children, to a wife, to public posts, to riches,
  and you will eventually be a worthy partner of the feasts of the gods. And if you don't even take the things which are set
  before you, but are able even to reject them, then you will not only be a partner at the feasts of the gods, but also of
  their empire. For, by doing this, Diogenes, Heraclitus and others like them, deservedly became, and were called, divine.
commentary: 'The dinner image trains desire rather than merely recommending polite restraint. External goods—family, office,
  wealth—are not condemned; the error is to lunge after them, clutch them when present, or regard their absence as an injury.
  One receives what arrives without making possession the condition of one’s good. This is the practical shape of the Stoic
  distinction between what depends on us and what does not: the distribution of courses is not ours, but the use we make of
  each occasion is. Moderation is therefore not passivity. It is alert readiness to act appropriately when an opportunity
  is actually given, coupled with freedom from anticipatory craving. The final praise of refusal marks a further discipline:
  one may relinquish even available advantages when accepting them would compromise judgment, character, or independence.
  Such self-sufficiency resembles divine rule because it locates sovereignty in rational choice, not in command over events.


  Key Terms


  **prohairesis** — The rational faculty of choice: the locus of moral freedom and responsibility.

  **eph'' hēmin** — “Up to us”: our judgments, intentions, and choices, unlike the arrival of external goods.

  **apatheia** — Freedom from disordered passions, not emotional numbness or indifference to every relation.

  **autarkeia** — Self-sufficiency: needing no external possession in order to live and act well.


  Cross-Tradition Resonances


  **Bhagavad Gita: acting without attachment to results:** Like Epictetus, the Gita disciplines possessive longing and directs
  attention toward one’s manner of action rather than guaranteed outcomes. Divergence: The Gita frames detached action through
  duty and devotion to Krishna; Epictetus grounds it chiefly in rational agency and the Stoic order of nature.

  **The Gospel tradition: the counsel not to be anxious about food, clothing, or tomorrow:** Both views challenge anxious
  acquisition and portray freedom from scarcity-driven grasping as a properly ordered life. Divergence: The Gospel counsel
  rests on trust in a personal, providential God and often foregrounds generosity to others; Epictetus emphasizes discipline
  of assent and independence from externals.

  **Zhuangzi: freedom from status and conventional success:** Zhuangzi and Epictetus both unsettle the assumption that rank,
  wealth, and public recognition establish a person’s worth. Divergence: Zhuangzi often loosens fixed normative distinctions
  through spontaneity and wandering, whereas Epictetus maintains a demanding account of rational duty and virtuous choice.'
practice: At one meal today, pause before taking anything. Notice one desire to secure more, faster, or better than what is
  presently offered. Take only what is appropriate, let one desired item pass without complaint, and silently distinguish
  the unavailable object from your present power to choose well.
