sanskrit_devanagari: उक्तस् तावत् तत्त्वाध्वा ॥ १०.१ ॥
sanskrit_iast: uktas tāvat tattvādhvā || 10.1 ||
translation_literal: Thus far, the path of the principles (tattvādhvan) has been stated.
commentary: 'This is a concise sectional closure. Uktaḥ, “has been stated,” is a passive perfect: the author does not newly
  argue here, but gathers what has already been expounded. Tattvādhvan combines tattva, a constitutive principle or reality,
  with adhvan, a “path,” “course,” or ordered extension. In the Śaiva tantric scheme, it denotes reality as a traversable
  hierarchy: the ordered manifestation through which consciousness appears contracted, diversified, and embodied. The phrase
  does not present the tattvas as merely a static cosmological list. They are an adhvan because they can be known, ritually
  purified, and retraced. “Thus far” (tāvat) also signals a measured completion: this mode of mapping the cosmos has reached
  its proper limit, without implying that the total tantric account of bondage, initiation, or liberation is exhausted by
  it.


  Key Terms


  **tattva** — A constitutive principle or level of reality in the ordered manifestation of consciousness.

  **adhvan** — A path, course, or structured continuum; here, the ordered path constituted by the tattvas.

  **uktaḥ** — “Has been stated”: a passive perfect marking the completion of an exposition.


  Cross-Tradition Resonances


  **Sāṃkhya’s enumeration of tattvas:**  Divergence: Sāṃkhya is classically dualist, distinguishing puruṣa from prakṛti, whereas
  Abhinavagupta’s Śaivism treats the whole series as manifestation of one consciousness.

  **Plotinus’ procession from the One:**  Divergence: The tattvādhvan is a specifically tantric field of mantra, ritual, and
  initiation, not simply Plotinian metaphysical emanation.'
practice: 'Sit quietly and name one immediate experience—body sensation, thought, emotion, or perception—as a tattva: a formed
  level of experience rather than the whole of awareness. Then release the label and rest for several breaths with the question:
  what is the awareness in which this level appears?'
