unit_label: The Drop Returns to the Ocean
title: The Drop Returns to the Ocean
unit_type: verse
section: I.1-4
sanskrit_devanagari: قطره‌ای از دریا جدا شده بود / تا خود را در خود دوباره یافت رود
sanskrit_iast: ''
translation_literal: 'A drop had separated from the Ocean, ashamed of its smallness. When it saw the Ocean''s vastness, it
  wept: ''How vast is that, how small am I!'' A shell held the drop, and the sun warmed it. The drop said, ''I wish I could
  return to the Ocean—I am nothing here.'' A breeze came and lifted it skyward. The drop dissolved into vapor, rose through
  the air, and fell as rain into the Ocean. Now it is the Ocean; it has forgotten its former shame. The Ocean says: ''I was
  never separate from you. Your shame was the veil. Return, and know yourself as you always were.'''
commentary: 'This passage encapsulates Rūmī''s cardinal teaching on fanā (annihilation of the ego-self) and tajallī (manifestation
  of divine unity). The drop''s shame—its nafs or lower self—represents the illusion of separation from the divine Ocean.
  The journey through evaporation and return symbolizes the soul''s ascent (miʿrāj) and reintegration. Rūmī employs natural
  cycles (water''s states) to render mystical transformation intelligible to ordinary perception. The Ocean''s final utterance
  dissolves the temporal narrative into eternal truth: separation was always illusory. This passage anchors the entire Mathnawī''s
  hermeneutic: all seeking is remembrance; all return is recognition of what never departed. The rhetorical power lies in
  its refusal of sentimental reunion—the drop does not ''join'' the Ocean but realizes it was never other.'
practice: 'Sit in stillness. Visualize yourself as a drop of water held in a shell (your body, your limited sense of self).
  Feel the sun''s warmth (divine love) drawing you upward. As you inhale, imagine yourself dissolving into vapor—your name,
  your history, your shame evaporating. As you exhale, release the illusion of separation. Silently repeat: ''I was never
  other than the Ocean; I am returning to what I always am.'' When the mind grasps for identity or achievement, gently return
  to the vapor-state—formless, boundless, already home. Practice until the boundary between drop and Ocean becomes transparent.'
