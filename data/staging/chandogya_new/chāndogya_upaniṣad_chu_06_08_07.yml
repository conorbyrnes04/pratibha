title: The Subtle Self
unit_type: verse
sanskrit_devanagari: 'स य एषो ऽणिमैतद् आत्म्यम् इदं सर्वम् ।

  तत् सत्यम् ।

  स आत्मा ।

  तत् त्वम् असि श्वेतकेतो इति ।

  भूय एव मा भगवान् विज्ञापयत्व् इति ।

  तथा सोम्येति होवाच ॥ ६.८.७ ॥'
sanskrit_iast: 'sa ya eṣo ''ṇimaitad ātmyam idaṃ sarvam |

  tat satyam |

  sa ātmā |

  tat tvam asi śvetaketo iti |

  bhūya eva mā bhagavān vijñāpayatv iti |

  tathā somyeti hovāca || 6.8.7 ||'
translation_literal: “That which is this subtle essence (aṇiman)—this whole world has that as its Self (ātman). That is the
  Real (satya). That is the Self. You are that (tat tvam asi), Śvetaketu.” “Revered sir, may you explain it to me further.”
  “So be it, dear one,” he said.
commentary: 'The teaching gathers the preceding illustration into a direct claim: the subtle, unperceived essence is not one
  object among others but the inner reality of “this whole” (idaṃ sarvam). It is called satya, the real or unfailing, in contrast
  to changing names and forms. “That is the Self” identifies the cosmic ground with the deepest principle of the person; “you
  are that” then addresses Śvetaketu personally. The statement does not merely offer a flattering equivalence between an individual
  ego and the universe. Its force depends on recognizing the ātman beneath the limited, learned, and changeable person. Śvetaketu’s
  request for further instruction is significant: the mahāvākya is not treated as a slogan requiring instant assent, but as
  a conclusion needing repeated clarification and realization. Uddālaka’s affectionate “dear one” frames inquiry as a disciplined,
  relational transmission.


  Key Terms


  **aṇiman** — The subtle essence: minute or imperceptible in appearance, yet presented as the ground of all.

  **ātman** — Self: the inner reality said here to underlie both the whole and the addressed person.

  **satya** — The real, true, or unfailing—what endures beneath mutable manifestation.

  **tat tvam asi** — “You are that”: Uddālaka’s direct identification of Śvetaketu with the ultimate reality just described.


  Cross-Tradition Resonances


  **Plotinus, Enneads:** Plotinus traces the soul’s deepest life to the One, beyond the changing multiplicity of visible things.
  Divergence: Plotinus commonly preserves an emanational hierarchy between One, Intellect, and Soul, whereas this passage
  states the identity in the compact formula “you are that.”

  **The Gospel of John:** John’s language of abiding—especially the mutual indwelling of Christ and disciples—uses intimate
  union rather than merely external relation. Divergence: John’s union is framed through Christ, faith, and divine-personal
  relation; this Upaniṣadic statement identifies the inmost Self with the real ground of all.

  **Mahāyāna Buddhism, tathāgatagarbha traditions:** Such traditions speak of an obscured but profound potential for awakening
  present in beings, inviting discovery beyond superficial identity. Divergence: Buddhist traditions generally deny a permanent
  ātman, while this passage explicitly names the ultimate reality as ātman.'
practice: 'Sit quietly and notice the changing contents of experience: sensations, memories, roles, and thoughts. Without
  trying to define a hidden object, ask: “What is present as these change?” Then hold the phrase tat tvam asi gently as an
  inquiry rather than an assertion of the ego.'
