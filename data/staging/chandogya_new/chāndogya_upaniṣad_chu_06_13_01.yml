title: Salt Gone Unseen
unit_type: verse
sanskrit_devanagari: 'लवणम् एतद् उदके ऽवधायाथ मा प्रातर् उपसीदथा इति ।

  स ह तथा चकार ।

  तं होवाच ।

  यद् दोषा लवणम् उदके ऽवाधा अङ्ग तद् आहरेति ।

  तद् धावमृश्य न विवेद ॥ ६.१३.१ ॥'
sanskrit_iast: 'lavaṇam etad udake ''vadhāyātha mā prātar upasīdathā iti |

  sa ha tathā cakāra |

  taṃ hovāca |

  yad doṣā lavaṇam udake ''vādhā aṅga tad āhareti |

  tad dhāvamṛśya na viveda || 6.13.1 ||'
translation_literal: '“Put this salt in water, and then come to me in the morning.” He did so. He said to him: “Dear one,
  bring here the salt which you put in the water last night.” Feeling around for it, he did not find it.'
commentary: 'Uddālaka’s instruction begins an enacted teaching rather than an abstract assertion. The salt is deliberately
  placed in water and, by morning, cannot be grasped or distinguished as a separate object. Śvetaketu’s failure to find it
  is not yet the whole lesson: the subsequent verses will have him taste the water from different directions and discover
  salt’s presence through its effect. Here the point is prepared through the contrast between visibility and reality. What
  cannot be seized by touch has not therefore ceased to be. The narrative’s ordinary verbs—putting, coming, bringing, feeling—make
  the inquiry empirical: Śvetaketu must test his assumption that what is real must be locally perceptible. The affectionate
  address aṅga (“dear one”) frames correction as instruction, not rebuke. In the wider teaching, dissolved salt becomes an
  image for the Self’s unlocalized presence in embodied beings.


  Key Terms


  **lavaṇam** — Salt; the concrete teaching-object that becomes indistinguishable in water.

  **udake** — In water; the medium in which salt loses visible, graspable separateness.

  **aṅga** — “Dear one” or “my child”; an affectionate form of address from teacher to student.

  **na viveda** — “He did not find/recognize”; Śvetaketu cannot detect the salt by touch.


  Cross-Tradition Resonances


  **The Gospel of Luke’s “kingdom of God is among/within you” (Luke 17:21):** Both point toward a reality not available as
  an externally locatable object. Divergence: The Upaniṣadic image concerns the pervasive Self and Brahman, whereas Luke’s
  saying concerns God’s reign and is not an identity claim about the individual self.

  **Plotinus, Enneads VI.9:** Plotinus describes the One as present without spatial division, inviting an inward turn beyond
  sense-perception. Divergence: Plotinus develops a graded metaphysical procession from the One; this Upaniṣadic scene teaches
  through the immediacy of dissolved salt and will identify the Self with being.

  **Dao De Jing 14:** The Dao is described as not apprehensible by looking, listening, or grasping, yet as real and effective.
  Divergence: The Dao is not straightforwardly articulated as the individual’s inner Self, as it is in the Chandogya’s surrounding
  teaching.'
practice: Dissolve a pinch of salt in a clear glass of water and leave it for several minutes. Look for the salt without stirring
  or tasting; then taste a tiny drop and reflect on the difference between what is absent to sight and what is absent in reality.
