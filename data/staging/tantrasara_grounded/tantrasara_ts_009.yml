sanskrit_devanagari: अत्र च तर्क एव योगाङ्गम् इति कथं विवेचयति इति चेत् उच्यते यो ऽयं परमेश्वरः स्वप्रकाशरूपः स्वात्मा तत्र
  किम् उपायेन क्रियते न स्वरूपलाभो नित्यत्वात् न ज्ञप्तिः स्वयंप्रकाशमानत्वात् नावरणविगमः आवरणस्य कस्यचिद् अपि असंभवात् न
  तदनुप्रवेशः अनुप्रवेष्टुः व्यतिरिक्तस्य अभावात् ॥ २.३ ॥
sanskrit_iast: atra ca tarka eva yogāṅgam iti kathaṃ vivecayati iti cet ucyate yo 'yaṃ parameśvaraḥ svaprakāśarūpaḥ svātmā
  tatra kim upāyena kriyate na svarūpalābho nityatvāt na jñaptiḥ svayaṃprakāśamānatvāt nāvaraṇavigamaḥ āvaraṇasya kasyacid
  api asaṃbhavāt na tadanupraveśaḥ anupraveṣṭuḥ vyatiriktasya abhāvāt || 2.3 ||
