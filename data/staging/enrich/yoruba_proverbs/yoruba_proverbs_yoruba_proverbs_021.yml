unit_label: Peace is the father of friendship
title: Peace is the father of friendship
unit_type: proverb
commentary: 'This proverb identifies peace not as a passive state but as a generative force—a father who creates and sustains
  friendship. It suggests that friendship cannot flourish where conflict, suspicion, or discord prevail; peace is the necessary
  ground. The image of fatherhood implies both protection and nurture, suggesting that peace actively maintains the bonds
  between people, not merely permits them.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Tao Te Ching, verse 15:** Both teach that a foundational state (the Tao, or here peace) precedes and enables all flourishing
  relationships and virtues. Divergence: The Tao Te Ching emphasizes non-action and mystery; this proverb is direct and relational,
  naming peace as an active father-figure.


  **Ecclesiastes 3:8 (''a time for war and a time for peace''):** Both recognize peace as a distinct and necessary condition
  for human life. Divergence: Ecclesiastes frames peace as cyclical and temporary; the proverb suggests peace as a stable,
  generative source.'
