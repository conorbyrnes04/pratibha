translation: A whisperer looks suspiciously at the forest when he hears a noise, but the forest does not tell tales.
abhyasa: 'Today, notice one moment when you interpret an ambiguous sound, glance, or silence as accusatory or hostile. Pause
  and ask: Am I adding a story? What is actually present, without my fear? Sit with the difference.'
