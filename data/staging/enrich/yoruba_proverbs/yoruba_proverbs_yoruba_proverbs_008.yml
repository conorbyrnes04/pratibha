unit_label: Boasting is not courage
title: Boasting is not courage
unit_type: proverb
commentary: 'This proverb cuts through a common confusion: loudness and self-promotion are not the same as bravery. Courage
  is demonstrated through action and restraint, not through speech about oneself. The proverb suggests that true strength
  is often quiet, while boasting reveals insecurity or hollow character. It invites the listener to distinguish between appearance
  and reality.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through compressed,
  memorable speech.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize the sage who is subtle and hidden: ''The ancient masters were profound and far-reaching...
  because they were hard to know, they can only be described with difficulty.'' Boasting obscures the way; silence reveals
  it. Divergence: The Tao Te Ching emphasizes cosmic harmony and non-action (wu wei); the Yoruba proverb focuses on human
  character and the moral distinction between false and true courage.


  **Dhammapada, v. 409:** Both warn against self-aggrandizement: ''One should not boast about one''s ascetic practices.''
  True worth is internal and demonstrated, not proclaimed. Divergence: The Dhammapada frames boasting as an obstacle to liberation;
  the òwe frames it as a failure of character and courage in the social world.


  **Heraclitus, Fragment 29:** Both suggest that real strength operates beneath surface noise: ''The best men choose one thing
  above all else: everlasting glory among mortals.'' True courage seeks lasting truth, not momentary praise. Divergence: Heraclitus
  emphasizes eternal fame; the Yoruba proverb suggests that boasting actually *prevents* lasting respect by revealing hollowness.'
