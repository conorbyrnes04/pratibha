translation: An obstinate man soon falls into disgrace.
abhyasa: 'Today, notice one moment when you felt the impulse to hold firm to your position in a conversation or conflict.
  Pause and ask: Am I holding this because it is true, or because I cannot bear to yield? Listen to one thing the other person
  says without preparing a rebuttal.'
