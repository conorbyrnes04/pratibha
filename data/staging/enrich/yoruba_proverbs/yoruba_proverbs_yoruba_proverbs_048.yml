unit_label: An obstinate man soon falls into disgrace
title: An obstinate man soon falls into disgrace
unit_type: proverb
commentary: 'This proverb warns that rigidity of character—refusing to listen, adapt, or yield—leads inevitably to social
  rupture and loss of standing. In Yoruba thought, where community cohesion and respect are foundational, obstinacy is not
  merely a personal flaw but a breach of the relational fabric. The proverb suggests that wisdom includes knowing when to
  bend, and that disgrace follows not from a single wrong act but from a posture of refusal.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning swiftly and
  memorably through speech.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts prize flexibility and warn against rigidity: ''The ancient masters were profound
  and subtle... because they were subtle, they must be described with difficulty.'' Obstinacy and inflexibility are presented
  as obstacles to harmony. Divergence: The Tao Te Ching frames flexibility as alignment with cosmic flow; the Yoruba proverb
  grounds it in social consequence and communal respect.


  **Proverbs 13:10 (Hebrew Bible):** Both traditions link pride or stubbornness to conflict and loss: ''Only by pride cometh
  contention.'' Refusal to listen breeds social fracture. Divergence: The biblical proverb emphasizes pride as the root; the
  Yoruba proverb emphasizes the social *result*—disgrace—as the teacher.


  **Heraclitus, Fragment 45:** Heraclitus teaches that ''all things flow'' and that wisdom lies in understanding change. Obstinacy
  resists this flow and invites ruin. Divergence: Heraclitus speaks of cosmic flux; the Yoruba proverb speaks of human character
  and communal standing as the domain where rigidity fails.'
