commentary: 'This proverb teaches that inconsistency and unreliability erode trust and community investment. The stranger,
  hearing only repeated departures, has no reason to commit effort to something that requires time and presence. The image
  of the ahnsa—a plant needing sustained care—shows how transience makes mutual flourishing impossible. The proverb suggests
  that words without the backing of staying-power are hollow.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and lived example.

  **ahnsa** — A plant mentioned in this proverb that bears fruit rapidly but requires the planter''s sustained presence and
  care to thrive.



  Cross-Tradition Resonances



  **Ecclesiastes 3:1–2 (''a time to plant, and a time to pluck up that which is planted''):** Both texts recognize that planting
  requires alignment with time and seasons; commitment is not arbitrary. Divergence: Ecclesiastes emphasizes divine timing
  and the rhythm of seasons; the Yoruba proverb emphasizes human reliability and the stranger''s reasonable doubt.


  **Confucian *Analects* on constancy (chéng 誠):** Both traditions link reliability and presence to moral credibility and
  the possibility of shared life. Divergence: The Confucian emphasis is on inner sincerity ripening outward; the Yoruba proverb
  focuses on the practical, observable fact of staying.'
