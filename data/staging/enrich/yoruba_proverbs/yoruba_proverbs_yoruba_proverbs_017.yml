title: Disobedience will drink water with his hands…
unit_type: proverb
commentary: 'This proverb uses vivid physical constraint to teach about consequences of defiance. The image of bound hands
  unable to cup water suggests that disobedience doesn''t free us—it binds us, leaving us unable to meet even basic needs.
  The proverb implies that obedience to legitimate order (whether familial, communal, or natural law) is not oppression but
  the condition for flourishing; disobedience creates self-imposed helplessness.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both teach that apparent constraint (following the Way, obeying natural order) enables true
  capability, while resistance creates suffering. Divergence: The Tao Te Ching emphasizes wu wei (non-action/non-forcing);
  this proverb focuses on the active harm of *disobedience* rather than the benefit of yielding.


  **Proverbs 15:10 (Hebrew Bible):** Both use concrete imagery (the rod, bound hands) to show that correction and obedience
  prevent ruin, while rejection of guidance brings hardship. Divergence: The biblical proverb frames obedience as response
  to correction from a teacher; the Yoruba proverb emphasizes the self-inflicted nature of the consequence.'
