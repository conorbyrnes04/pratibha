translation: Poverty destroys a man's reputation.
abhyasa: 'Today, notice one moment when you judge someone''s character or worth based on their visible resources or lack thereof.
  Pause and ask: what am I actually seeing, and what am I assuming? This creates space to separate a person''s dignity from
  their circumstance.'
