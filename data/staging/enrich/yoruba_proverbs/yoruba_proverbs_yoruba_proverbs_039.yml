unit_label: Poverty destroys a man's reputation
title: Poverty destroys a man's reputation
unit_type: proverb
commentary: 'This proverb names a hard social reality: material lack carries social consequence. It does not celebrate poverty
  as spiritually ennobling, nor does it blame the poor person for their condition—rather, it observes that a community''s
  judgment of a person shifts when resources disappear. The proverb may serve as both warning (about the fragility of standing)
  and as implicit call to collective responsibility, since reputation is a shared measure.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries speakers and listeners
  together.



  Cross-Tradition Resonances



  **Proverbs 10:15 (Hebrew Bible):** Both acknowledge that poverty affects social standing and security: ''The wealth of the
  rich is their fortified city; but poverty is the ruin of the poor.'' Divergence: The Hebrew proverb frames poverty as personal
  ruin; the Yoruba proverb emphasizes the social judgment and loss of reputation specifically, a relational harm.


  **Dhammapada, verse 183 (Buddhist tradition):** Both traditions recognize that external conditions shape how others perceive
  and treat a person. Divergence: The Dhammapada teaches detachment from such judgments as a path to liberation; this òwe
  appears to accept social judgment as real and consequential, without prescribing transcendence of it.'
