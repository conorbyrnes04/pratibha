unit_label: A poor man has no relations
title: A poor man has no relations
unit_type: proverb
commentary: 'This proverb speaks to a harsh social reality: poverty isolates a person from kinship networks and mutual obligation.
  In Yoruba thought, where identity and survival are deeply tied to family and community bonds, the statement cuts to how
  economic vulnerability can sever or weaken the very relationships that define personhood. The proverb is not celebrating
  this condition but naming it—a call to recognize both the fragility of social ties and the stakes of material need.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries truth through metaphor
  and concise speech.



  Cross-Tradition Resonances



  **Proverbs 19:4 (Hebrew Bible):** Both texts observe that wealth attracts companions while poverty repels them—a shared
  recognition of how material condition shapes social bonds. Divergence: The Biblical proverb frames this as a moral lesson
  about false friendship; the Yoruba òwe appears more diagnostic, naming a structural condition without explicit moral judgment.


  **Dhammapada, verse 307 (Buddhism):** Both traditions warn against clinging to material security as a source of belonging;
  both suggest that true kinship transcends wealth. Divergence: The Dhammapada prescribes renunciation as liberation; the
  Yoruba proverb does not suggest poverty is spiritual—it grieves the loss of relational ties that poverty causes.'
