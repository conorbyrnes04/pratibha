title: As a calabash receives the sediment of the…
unit_type: proverb
commentary: 'This proverb uses the image of a calabash (a hollowed gourd used for holding water) settling into stillness to
  teach about elder wisdom. The sediment sinks and clarifies only when the vessel remains patient and undisturbed—suggesting
  that forbearance (patient endurance, restraint) is not passive weakness but the active discipline required for clarity and
  maturity. An elder''s role is to hold space for resolution, much as a calabash holds turbid water until it becomes clear.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching

  **forbearance** — Patient restraint; the capacity to endure difficulty or provocation without immediate reaction



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts prize stillness and receptivity as sources of wisdom: ''The ancient masters were
  profound and subtle... because they were subtle, they must be described with difficulty.'' Clarity emerges from patient
  non-action. Divergence: The Tao Te Ching emphasizes cosmic harmony and the wu-wei (non-action) of nature itself; the Yoruba
  proverb grounds wisdom in the social role and moral discipline of the elder within community.


  **Ecclesiastes 3:7 (''a time to keep silence, and a time to speak''):** Both recognize that timing and restraint are forms
  of wisdom; silence is not absence but a necessary season. Divergence: Ecclesiastes frames this within divine order and cyclical
  time; the Yoruba proverb teaches through natural observation and the elder''s embodied practice.'
