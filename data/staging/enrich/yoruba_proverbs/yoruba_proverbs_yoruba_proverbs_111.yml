title: As one is walking, so is he met
unit_type: proverb
commentary: 'This proverb suggests that one''s manner of moving through the world—one''s conduct, intention, or inner state—shapes
  what one encounters. It is not fatalistic but relational: the world meets us according to how we present ourselves to it.
  The proverb invites reflection on responsibility: we are not passive recipients of circumstance, but active participants
  whose bearing and choices draw forth corresponding responses.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across contexts
  and generations.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both suggest that inner alignment precedes outer circumstance: ''The ancient masters were profound
  and subtle... because they were subtle, they must be described as reluctant to meet others.'' One''s state of being determines
  the meeting. Divergence: The Tao Te Ching emphasizes withdrawal and non-action; the Yoruba proverb emphasizes active walking
  and intentional movement.


  **Proverbs 27:12 (Hebrew Bible):** Both imply moral reciprocity: ''The prudent see danger and take refuge, but the simple
  keep going and pay the penalty.'' How one walks determines what one meets. Divergence: The Biblical proverb frames this
  as avoidance of harm; the Yoruba saying is more neutral—it describes a universal law of correspondence, not judgment.


  **Heraclitus, Fragment 50:** Both suggest dynamic encounter: ''The same river, stepping into it, we step and do not step.''
  Meeting is not fixed but depends on the walker''s state. Divergence: Heraclitus emphasizes flux and paradox; the Yoruba
  proverb is more direct about agency and intentionality in shaping encounter.'
