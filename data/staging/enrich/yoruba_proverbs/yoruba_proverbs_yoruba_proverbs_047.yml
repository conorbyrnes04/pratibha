title: Consideration is the senior, calculation the…
unit_type: proverb
commentary: 'This proverb establishes a hierarchy of thought-capacities, not by speed or cleverness, but by maturity and precedence.
  Consideration—a patient, receptive attending to a situation—must come first; calculation follows as a tool; wisdom emerges
  only when both have done their work. The proverb resists the modern temptation to prize quick reasoning, instead suggesting
  that depth requires a sequence, and that skipping the elder steps produces neither true calculation nor wisdom.



  Key Terms



  **Consideration** — In this proverb, the first and senior faculty—a receptive, patient attending to circumstances before
  judgment or action.

  **Òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts prize receptivity and patience as the foundation of understanding: ''The ancient
  masters were profound and wise; because they were hard to understand, I will describe them.'' Consideration, like receptivity
  to the Tao, must precede action. Divergence: The Tao Te Ching emphasizes non-action and emptiness; this proverb affirms
  a positive sequence of three active faculties, suggesting that thought itself, when ordered rightly, is part of wisdom.


  **Aristotle, Nicomachean Ethics, Book VI (on phronesis):** Both distinguish practical wisdom from mere calculation. Aristotle
  argues that phronesis (practical wisdom) requires deliberation and experience; this proverb similarly places wisdom as a
  culmination, not a starting point. Divergence: Aristotle grounds wisdom in virtue and habituation over time; the proverb
  suggests wisdom can emerge in a single deliberative moment if the proper sequence is honored.


  **James 1:19 (New Testament):** ''Let every person be quick to hear, slow to speak, slow to anger.'' Both texts prioritize
  receptive attention (hearing/consideration) before response, suggesting that restraint precedes right action. Divergence:
  The biblical verse emphasizes emotional restraint and listening to others; the proverb is about the internal order of one''s
  own thinking faculties.'
