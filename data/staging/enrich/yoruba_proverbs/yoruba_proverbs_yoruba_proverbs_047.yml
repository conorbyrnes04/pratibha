translation: Consideration is the senior, calculation the junior, and wisdom the third-born.
abhyasa: 'Today, when facing a decision, pause and name what you are doing: Am I considering (taking in the full situation
  without rushing to solve)? Am I calculating (weighing options and consequences)? Or am I already claiming wisdom? Notice
  which step you tend to skip or hurry through.'
