title: No one confesses that he has eaten yam with a…
unit_type: proverb
commentary: 'This proverb speaks to the human tendency to conceal evidence of wrongdoing or impropriety—here, eating yam (a
  staple food) with an incomplete or broken tool. The image suggests that shame or guilt operates silently: we hide what we''ve
  done not by denying the act itself, but by avoiding situations where the truth becomes visible. The proverb teaches that
  concealment is often instinctive, yet imperfect; the missing knife remains, a silent witness.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning beyond its surface
  words.



  Cross-Tradition Resonances



  **Ecclesiastes 12:14 (''God will bring every deed into judgment, including every hidden thing''):** Both texts suggest that
  hidden acts leave traces; concealment is incomplete. What is done cannot remain entirely invisible. Divergence: The Yoruba
  proverb does not invoke divine judgment; it observes human nature and social consequence, not cosmic accountability.


  **Heraclitus, Fragment 123 (''Character is destiny''):** Both suggest that who we are shows itself through what we do and
  leave behind—the broken knife reveals the eater. Divergence: Heraclitus speaks of destiny as inevitable unfolding; the proverb
  focuses on the practical, social awkwardness of concealment.'
