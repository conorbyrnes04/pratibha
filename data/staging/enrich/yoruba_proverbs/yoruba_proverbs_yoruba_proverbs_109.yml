translation: No one confesses that he has eaten yam with a knife that is missing.
abhyasa: Today, notice one small thing you are tempted to hide or minimize—a mistake, a shortcut, an uncomfortable truth.
  Rather than rehearsing how to conceal it, sit with the impulse itself. What are you afraid will be seen? What would it mean
  to let the 'missing knife' remain visible?
