unit_label: As no subject may keep a herald, so it is not…
title: As no subject may keep a herald, so it is not…
unit_type: proverb
commentary: 'This proverb uses the relationship between a ruler and their herald—a figure of authority and public voice—to
  teach about fitness and readiness for power. Just as a subject cannot legitimately hold the role of herald (which belongs
  to the ruler''s court), not every person is suited to own or maintain a palace, the seat of authority and responsibility.
  The saying suggests that certain stations in life require specific capacities, character, or preparation; ambition alone
  does not qualify one for them.



  Key Terms



  **herald** — A messenger or official voice of a ruler; in Yoruba court life, a figure of delegated authority and public
  speech

  **palace** — The seat of rulership and authority; here, a symbol of power that carries obligations, not merely privilege



  Cross-Tradition Resonances



  **Analects of Confucius, 12.19:** Both teach that position and virtue must align; one cannot simply occupy a role without
  the character to fill it. Divergence: Confucius emphasizes moral cultivation as the path to fitness; the proverb speaks
  more directly to natural or social readiness.


  **Plato, Republic, Book IV:** Both suggest that rulership requires a specific nature or preparation, not mere desire or
  birthright. Divergence: Plato argues for philosophical training and selection; the proverb leaves the source of fitness
  implicit and practical.'
