title: A hog that has wallowed in the mud seeks a…
unit_type: proverb
commentary: 'This proverb observes a paradox of human nature: those who are themselves unclean or compromised often seek contact
  with the virtuous, perhaps to transfer their state, to gain legitimacy, or to hide their condition. The image is visceral
  and unflattering—it suggests that proximity to integrity can be exploited or that moral corruption spreads through contact.
  The proverb warns the listener to be cautious about whom one allows near, and perhaps to recognize when others approach
  us not for genuine relationship but for their own benefit.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and observation of nature and human behavior.



  Cross-Tradition Resonances



  **Proverbs 22:3 (Hebrew Bible):** Both warn of hidden danger and the need for discernment—the prudent person sees and avoids
  harm; the clean person must recognize the unclean approach. Divergence: The biblical proverb emphasizes foresight and escape;
  the Yoruba proverb emphasizes the predatory or parasitic nature of the approach itself.


  **Confucian Analects, on association and influence:** Both traditions recognize that proximity to others shapes character
  and that one must choose companions wisely, as influence flows through contact. Divergence: Confucius emphasizes mutual
  cultivation and respect; this proverb suggests a one-directional, exploitative dynamic.'
