translation: A hog that has wallowed in the mud seeks a clean person to rub against.
abhyasa: 'Today, notice one moment when someone seeks your approval, time, or presence. Pause and ask: Are they approaching
  me authentically, or are they ''rubbing against'' my reputation? What boundaries do I need to maintain? Reflect without
  judgment.'
