unit_label: He who is pierced with a thorn must limp off to…
title: He who is pierced with a thorn must limp off to…
unit_type: proverb
commentary: 'This proverb teaches that suffering or injury requires us to seek help from those equipped to remedy it—not from
  sympathy alone, but from practical skill. The image of the thorn and the knife suggests that problems demand specific, capable
  responses; limping to the knife-holder is an act of wisdom, not weakness. The proverb invites reflection on interdependence:
  we are not self-sufficient, and recognizing who has the tools we need is itself a form of discernment.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Proverbs 11:14 (Hebrew Bible):** Both texts affirm that seeking counsel and aid from the capable is wisdom, not failure.
  The proverb and the biblical verse share an ethic of practical interdependence. Divergence: The biblical passage emphasizes
  collective counsel and safety in numbers; the Yoruba proverb focuses on the specific match between problem and remedy—one
  thorn, one knife.


  **Aristotle, Nicomachean Ethics (on practical wisdom / phronesis):** Both recognize that virtue includes knowing whom to
  turn to and when—discernment about resources and relationships. Divergence: Aristotle grounds this in individual character
  development; the proverb assumes a social fabric where roles and skills are already distributed and recognized.'
