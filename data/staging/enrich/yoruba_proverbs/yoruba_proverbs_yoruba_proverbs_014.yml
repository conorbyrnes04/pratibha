title: Disobedience is the father of insolence
unit_type: proverb
commentary: 'This proverb traces a causal chain: disobedience does not stand alone but generates insolence—a compounding of
  disrespect. The saying suggests that the first breach of proper order (disobedience) weakens the bonds of respect and hierarchy,
  making further transgression (insolence) inevitable. It reflects a worldview in which social coherence depends on ordered
  relationships, and where one violation tends to open the door to others.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning efficiently
  and memorably through speech.



  Cross-Tradition Resonances



  **Proverbs 13:10 (Hebrew Bible):** Both warn that disorder in conduct breeds further disorder: ''By pride comes only contention.''
  Disobedience and pride are kindred roots of social fracture. Divergence: The Hebrew text emphasizes pride as the root; the
  Yoruba proverb emphasizes the *act* of disobedience and its social consequence, rather than the inner state.


  **Aristotle, *Nicomachean Ethics* II.1:** Both suggest that repeated acts shape character and habit: one transgression makes
  the next easier. Disobedience becomes a habit that breeds insolence. Divergence: Aristotle focuses on virtue as habit; the
  proverb focuses on the social rupture and loss of respect, not individual moral formation.'
