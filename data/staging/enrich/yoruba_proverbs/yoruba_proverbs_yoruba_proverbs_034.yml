title: Poverty destroys a man's reputation
unit_type: proverb
commentary: 'This proverb observes a social reality: material lack exposes a person to judgment and diminishment in community
  standing. Rather than celebrating virtue in hardship, it acknowledges plainly that poverty carries social cost—a recognition
  that may prompt reflection on both personal resilience and communal responsibility. The proverb does not counsel resignation,
  but names a condition that shapes how others perceive and treat the poor.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across generations
  and contexts.



  Cross-Tradition Resonances



  **Proverbs 10:15 (Hebrew Bible):** Both acknowledge that wealth provides protection and standing: ''The rich man''s wealth
  is his strong city; the destruction of the poor is their poverty.'' Divergence: The biblical verse frames poverty as *destruction*;
  the Yoruba proverb focuses on social *reputation*, which is distinct—one may be poor yet retain dignity if community chooses
  to honor it.


  **Dhammapada 183 (Buddhist):** Both traditions recognize that external conditions shape how one is perceived: ''Wealth destroys
  the foolish, but not those who seek the other shore.'' Divergence: The Buddhist text offers a path beyond material circumstance;
  the Yoruba proverb does not prescribe transcendence, but names the social fact itself.'
