title: The deaf look with surprise at a speaker's…
unit_type: proverb
commentary: 'This proverb observes how those without hearing must rely on sight to understand speech—they watch the mouth''s
  movement with particular attention, as if surprised by what they see there. The deeper insight is about necessity reshaping
  perception: when one sense is unavailable, others sharpen and notice what hearing people might miss. It speaks to how limitation
  can become a form of knowledge, and how understanding takes many forms.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both suggest that true perception comes through subtle, patient attention rather than obvious
  channels. The sage ''observes the world but trusts [their] inner vision.'' Divergence: The Tao Te Ching emphasizes withdrawal
  from the sensory world; this proverb shows how sensory limitation can deepen engagement with the present moment.


  **Heraclitus, Fragment 101a:** Both recognize that different beings perceive differently: ''If all things turned to smoke,
  the nose would distinguish them.'' Here, the deaf distinguish speech through sight where others use hearing. Divergence:
  Heraclitus speaks of a hypothetical transformation; the proverb grounds itself in actual lived difference and the dignity
  of alternative perception.'
