translation: The cross-roads do not fear sacrifices.
abhyasa: 'Today, notice one moment when you face a genuine choice or crossroads (practical or internal). Before acting, pause
  and ask: What am I hoping a ritual, prayer, or ''right action'' will do here? What remains outside my control? Write one
  sentence about what the crossroads themselves might ''know'' that you do not.'
