abhyasa: 'Today, notice one moment when you are tempted to criticize or ''cut to pieces'' something—a person''s work, an idea,
  a choice. Pause and ask: Is this thing still living and capable of growth, or am I attacking what is already fallen? Let
  this distinction guide whether you speak.'
