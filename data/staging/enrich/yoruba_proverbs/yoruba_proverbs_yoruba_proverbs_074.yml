unit_label: A small bed will not hold two persons
title: A small bed will not hold two persons
unit_type: proverb
commentary: 'This proverb speaks to the limits of space and capacity—what cannot stretch beyond its nature. On the surface,
  it observes a physical fact: a small bed has boundaries. Interpreted more broadly, it suggests that certain containers (literal
  or social) have fixed dimensions, and attempting to force what exceeds them creates strain or failure. The proverb may counsel
  acceptance of limits, or warn against overcrowding what is meant to be intimate or singular.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across contexts
  and generations.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both recognize that things have inherent nature and limits; the sage works *with* these boundaries
  rather than against them. Divergence: The Tao Te Ching emphasizes the virtue of flexibility and yielding; this proverb states
  a hard fact of incompatibility—less about bending, more about accepting what cannot fit.


  **Ecclesiastes 3:1–8 (''a time for every purpose''):** Both suggest that certain things belong to certain containers; there
  is an order and a limit to what fits where. Divergence: Ecclesiastes frames limits within divine timing and purpose; the
  Yoruba proverb is more pragmatic—it is about the bed itself, not cosmic order.'
