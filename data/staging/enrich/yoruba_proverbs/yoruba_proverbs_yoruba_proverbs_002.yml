translation: He who has done something in secret, and sees people talking together, thinks they are talking of his action.
abhyasa: 'Today, notice one moment when you assume others are discussing you or your actions. Pause and ask: What evidence
  do I actually have? What am I afraid of? This simple check can reveal where you carry unspoken shame or guilt.'
