title: He who has done something in secret, and sees…
unit_type: proverb
commentary: 'This proverb observes the psychology of guilt and shame: the person burdened by hidden wrongdoing projects their
  anxiety onto innocent conversation, mistaking others'' words for judgment of themselves. It reveals how secrecy isolates
  us from reality, replacing it with fear-driven interpretation. The proverb suggests that hidden action creates a kind of
  internal witness that distorts perception—a teaching about the relational cost of deception, not merely its moral weight.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that travels through speech and community.



  Cross-Tradition Resonances



  **Proverbs 28:1 (Hebrew Bible):** Both teach that guilt produces internal disturbance and hypervigilance: ''The wicked flee
  when no one pursues them; but the righteous are bold as a lion.'' Divergence: The biblical verse emphasizes moral courage
  as the antidote; the Yoruba proverb focuses on the distortion of perception itself, without prescribing virtue.


  **Dhammapada 1-2 (Buddhist tradition):** Both recognize that mind follows action: ''Mind is the forerunner of all things''
  and hidden deeds shape inner experience and outer interpretation. Divergence: The Dhammapada frames this as universal law;
  the Yoruba proverb treats it as a specific psychological trap of secrecy and social awareness.


  **Montaigne, ''Of Liars'' (Essays):** Both observe that deception fractures the deceiver''s relationship to reality and
  others'' words, making them suspicious readers of the world. Divergence: Montaigne emphasizes the liar''s loss of credibility
  and memory; the Yoruba proverb emphasizes the immediate, paranoid misreading of innocent speech.'
