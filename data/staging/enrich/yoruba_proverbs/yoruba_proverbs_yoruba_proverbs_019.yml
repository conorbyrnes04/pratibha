commentary: 'This proverb observes that hardship is silent—it does not announce itself or explain its own nature. The burden
  falls on the living community to recognize suffering in others through attention and presence, not through the sufferer''s
  ability to articulate their need. The saying suggests that compassion requires active perception rather than waiting for
  pain to make itself heard.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Proverbs 14:10 (Hebrew Bible):** Both recognize that inner suffering is often invisible: ''The heart knows its own bitterness,
  and no stranger shares its joy.'' Each points to the privacy of pain. Divergence: The biblical verse emphasizes the isolation
  of the sufferer''s inner world; the Yoruba proverb emphasizes the community''s responsibility to perceive what is not spoken.


  **Dhammapada 290 (Buddhist tradition):** Both teach that understanding requires direct perception beyond words: ''The wise
  one sees this, and is not deceived by appearances.'' Divergence: The Buddhist text speaks of seeing through illusion to
  truth; the Yoruba proverb speaks of seeing through silence to need.'
