title: A eliarp word is as tough aa a bow-string
unit_type: proverb
commentary: 'This proverb teaches that speech carries irreversible power—a sharp word, once spoken, leaves a mark that cannot
  be healed as a physical wound can be. The second statement adds a sobering observation: those who work for peace often suffer
  for it, suggesting that restraint and reconciliation require personal cost. Together, these lines urge speakers toward care
  and warn peacemakers not to expect gratitude.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and conciseness.



  Cross-Tradition Resonances



  **Proverbs 12:18 (Hebrew Bible):** Both texts recognize that careless speech wounds irreparably: ''Reckless words are like
  sword thrusts, but the tongue of the wise brings healing.'' Divergence: The Yoruba proverb emphasizes the impossibility
  of cure, while Proverbs 12:18 holds out the possibility of healing through wise speech.


  **Dhammapada 133 (Buddhist tradition):** Both warn against harsh speech as a source of suffering and recognize the power
  of words to harm: ''Harsh speech is blamed by the wise.'' Divergence: The Yoruba proverb focuses on the permanence of harm,
  while the Dhammapada emphasizes the speaker''s own karmic consequence.


  **Ecclesiastes 5:2 (Hebrew Bible):** Both counsel restraint in speech: ''Do not be quick with your mouth, do not be hasty
  in your heart to utter anything before God.'' Divergence: Ecclesiastes frames silence as reverence before the divine; the
  Yoruba proverb frames it as respect for the irreversible power of words themselves.'
