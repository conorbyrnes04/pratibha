title: A bald-headed man does not care for a razor
unit_type: proverb
commentary: 'This proverb teaches through the logic of circumstance: a person without hair has no use for the tool designed
  for hair. It suggests that wisdom and resources are relative to one''s actual condition, not abstract ideals. The proverb
  invites reflection on whether we pursue things out of genuine need or mere habit—and whether we judge others'' choices without
  understanding their particular situation.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both teach that the wise adapt to what *is* rather than imposing fixed forms. The sage ''empties''
  themselves to fit circumstance. Divergence: The Tao Te Ching emphasizes emptiness and non-action as spiritual states; the
  proverb is more pragmatic—it simply observes that tools match conditions.


  **Ecclesiastes 3:1–8 (''a time for every purpose''):** Both recognize that appropriateness depends on context and season,
  not universal rules. Divergence: Ecclesiastes frames this as cosmic order; the proverb frames it as common sense about need.'
