unit_label: The afomo (a parasitical plant) has no roots;
title: The afomo (a parasitical plant) has no roots;
unit_type: proverb
commentary: 'This proverb uses the afomo plant—which lives by attaching to trees without establishing its own foundation—as
  an image of opportunistic social behavior. The proverb warns against those who claim kinship or alliance with everyone indiscriminately,
  suggesting that such promiscuity of relationship reveals a lack of genuine grounding or integrity. The insight is that authentic
  belonging requires rootedness; those without it must perform connection rather than embody it.



  Key Terms



  **afomo** — A parasitical plant that grows by clinging to trees; used metaphorically in this proverb to represent someone
  without authentic foundation or integrity.

  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and observation of the natural world.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts value rootedness and warn against surface mimicry: the sage ''is like a valley,
  empty and receptive,'' while the afomo proverb shows what happens when one has no center. Divergence: The Tao emphasizes
  emptiness as a strength; the proverb emphasizes parasitism as a weakness—different valuations of the unrooted state.


  **Ecclesiastes 1:2 (''Vanity of vanities''):** Both observe human behavior that lacks substance—the proverb''s false kinship
  mirrors the preacher''s critique of hollow pursuits. Divergence: Ecclesiastes questions the meaning of all effort; the proverb
  offers a specific moral critique of insincerity, not existential doubt.'
