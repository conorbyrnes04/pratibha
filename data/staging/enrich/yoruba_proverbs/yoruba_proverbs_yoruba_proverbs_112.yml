translation: The monkey is sure to tear the cloth of any- one who resembles himself.
abhyasa: 'Today, notice one person whose qualities, struggles, or choices provoke irritation in you. Pause and ask: what in
  them resembles something in myself? Sit with that resemblance without judgment, observing whether recognition might soften
  rather than sharpen your response.'
