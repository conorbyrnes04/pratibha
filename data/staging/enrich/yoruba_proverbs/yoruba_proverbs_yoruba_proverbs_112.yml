title: The monkey is sure to tear the cloth of any…
unit_type: proverb
commentary: 'This proverb observes that we are most likely to harm those who mirror us—whether in appearance, behavior, or
  circumstance. The image of the monkey tearing cloth suggests both recognition and aggression: the monkey sees itself reflected
  and responds with violence rather than kinship. The proverb may warn against the blindness of self-projection, or the danger
  of unexamined rivalry with those closest to us in condition or nature.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning beyond its surface
  words.



  Cross-Tradition Resonances



  **Dhammapada, verse 50 (''He abused me, he beat me, he defeated me, he robbed me''—those who harbor such thoughts never
  find peace):** Both warn against reactive harm born from perceived injury or slight; both suggest that holding grievance
  perpetuates suffering. Divergence: The Dhammapada addresses internal rumination and forgiveness; the Yoruba proverb focuses
  on the external trigger of resemblance itself, suggesting the problem lies in recognition without wisdom.


  **Heraclitus, Fragment 45 (''A man''s character is his fate''):** Both suggest that we encounter ourselves in the world;
  what we meet is often a reflection of what we are. Divergence: Heraclitus emphasizes destiny and inner nature; the proverb
  emphasizes the *social danger* of that mirroring—the likelihood of conflict, not acceptance of fate.


  **Matthew 7:3-5 (''Why do you see the speck in your brother''s eye but not the log in your own?''):** Both warn against
  judging or attacking those who resemble us, pointing to blindness about ourselves. Divergence: The Christian passage calls
  for self-examination before judgment; the Yoruba proverb describes a more instinctive, almost animal response—tearing rather
  than seeing.'
