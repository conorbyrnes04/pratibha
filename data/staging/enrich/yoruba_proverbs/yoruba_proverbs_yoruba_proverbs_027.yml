unit_label: A man with a cough can never conceal him- self
title: A man with a cough can never conceal him- self
unit_type: proverb
commentary: 'This proverb suggests that what is true about us—our condition, our nature—inevitably reveals itself despite
  our efforts to hide it. The cough is involuntary; it breaks through intention and control. The saying invites reflection
  on authenticity: concealment fails not because of external judgment, but because reality persists. It may counsel acceptance
  of what cannot be hidden, or warn against the futility of pretense.



  Key Terms



  **òwe** — Yoruba proverb; a compressed saying that teaches through image and paradox, often called ''the horse of conversation''
  because it carries wisdom from speaker to listener.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both suggest that the sage cannot be hidden—their nature shows itself naturally, like water
  finding its level. Concealment is impossible for what is genuine. Divergence: The Tao Te Ching celebrates the sage''s subtle,
  effortless presence; the proverb emphasizes the involuntary and undignified (a cough), suggesting vulnerability rather than
  mastery.


  **Ecclesiastes 12:14 (''God will bring every deed into judgment''):** Both imply that nothing remains hidden; truth emerges
  inevitably, whether through divine judgment or the simple physics of human nature. Divergence: Ecclesiastes frames hiddenness
  as moral failure before God; the proverb is more neutral—it is simply how things are, without moral judgment attached.


  **Heraclitus, Fragment 123 (''Character is destiny''):** Both suggest that who we are cannot be separated from what we do
  or show; our nature expresses itself regardless of intention. Divergence: Heraclitus speaks of character as fate or destiny;
  the proverb focuses on the practical impossibility of concealment, a matter of immediate, bodily fact.'
