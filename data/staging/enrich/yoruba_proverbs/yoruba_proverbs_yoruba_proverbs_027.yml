translation: A man with a cough can never conceal him- self.
abhyasa: Today, notice one thing about yourself or your situation that you have been trying to conceal or minimize—a worry,
  a limitation, a need. Observe what happens when you stop the effort to hide it, even in a small way. What becomes possible?
