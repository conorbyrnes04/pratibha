translation: Disobedience is the father of insolence.
abhyasa: 'Reflect today on one small boundary you are tempted to cross—a rule, a person''s request, or a custom you find inconvenient.
  Before acting, pause and ask: what ''child'' might this disobedience birth in me or in my relationship? Notice whether the
  impulse carries seeds of further disregard.'
