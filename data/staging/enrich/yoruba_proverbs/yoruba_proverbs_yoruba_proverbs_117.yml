unit_label: Everything has a price, but who can put a price…
title: Everything has a price, but who can put a price…
unit_type: proverb
commentary: 'This proverb distinguishes between material exchange and kinship bonds that exceed economic valuation. It asserts
  that while most things in the world can be quantified and traded, blood—understood as family, lineage, and the irreplaceable
  ties that bind people—cannot be reduced to a price. The paradox invites reflection on what truly matters: the proverb does
  not reject commerce or value, but rather identifies a realm of human relationship that stands outside it.



  Key Terms



  **blood** — In this proverb, kinship, lineage, and irreplaceable human bonds—not merely biological substance, but the ties
  that constitute family and community obligation.



  Cross-Tradition Resonances



  **Ecclesiastes 3:1–8 (''a time for every purpose''):** Both texts acknowledge that life contains multiple registers of value
  and meaning; not everything operates by the same logic. Divergence: Ecclesiastes emphasizes cyclical time and divine ordering;
  this proverb focuses on the boundary between the priceable and the sacred.


  **Aristotle, *Nicomachean Ethics* (friendship as beyond exchange):** Both recognize that certain human relationships cannot
  be transactional; they have intrinsic rather than instrumental worth. Divergence: Aristotle theorizes friendship as virtue;
  the proverb grounds the insight in kinship and blood, which are given rather than chosen.'
