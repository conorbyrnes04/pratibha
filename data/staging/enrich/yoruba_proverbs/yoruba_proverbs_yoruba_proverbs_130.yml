abhyasa: Today, notice one thing you genuinely want to do or consume (not from habit or compulsion, but from real draw). Observe
  whether that desire feels aligned with your wellbeing, or whether you can sense the difference between true appetite and
  craving. Sit with what you notice without judgment.
