title: The birdlime is the death of the bird
unit_type: proverb
commentary: 'This proverb speaks to the principle of consequence and entanglement: what appears as a tool or substance in
  the world becomes fatal when the bird—through its nature or circumstance—comes into contact with it. The proverb suggests
  that danger is not always external or malicious, but often emerges from the meeting of a being''s condition with its environment.
  It invites reflection on how we move through the world and what we adhere to.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across generations
  and contexts.



  Cross-Tradition Resonances



  **Dhammapada, verse 309:** Both teach that suffering arises from contact and clinging: ''From craving springs grief; from
  craving springs fear.'' Divergence: The proverb locates danger in the substance itself (birdlime), while the Dhammapada
  locates it in the mind''s attachment; the proverb is more about vulnerability and circumstance.


  **Heraclitus, Fragment 12:** Both suggest that what seems passive or neutral (birdlime, fire) becomes destructive through
  interaction: ''This world...was ever, is now, and ever shall be...a fire ever-living.'' Divergence: Heraclitus emphasizes
  cosmic flux and transformation; the proverb emphasizes specific peril and the particular fate of the bird.'
