unit_label: He who forgives ends the quarrel
title: He who forgives ends the quarrel
unit_type: proverb
commentary: 'This proverb locates the power to end conflict not in force or victory, but in the deliberate choice to release
  grievance. The speaker who forgives acts as the agent of cessation—not passively waiting for reconciliation, but actively
  breaking the cycle. This reflects a pragmatic wisdom about social repair: quarrels persist only as long as someone holds
  them. The proverb suggests that forgiveness is not weakness but a form of strength that restores community.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Dhammapada, verse 5:** Both teach that hatred is ended not by hatred but by love; the proverb''s emphasis on the forgiver''s
  agency mirrors the Buddhist insight that the mind''s release is the path to peace. Divergence: The Dhammapada frames this
  within a cosmology of karma and rebirth; the òwe speaks pragmatically to social order and the immediate restoration of community.


  **Matthew 5:9 (Beatitudes):** Both honor the peacemaker as blessed or wise; forgiveness is positioned as a virtue that heals.
  Divergence: The Christian passage emphasizes divine blessing and moral law; the òwe emphasizes the practical, immediate
  consequence—the quarrel simply ends when someone lets go.'
