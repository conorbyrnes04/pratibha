translation: Houses that are not adjacent do not readily catch fire.
abhyasa: 'Today, notice one situation where you are ''adjacent''—to a person, a group, a habit, or an environment. Ask yourself:
  Is this proximity serving me? What would change if I created more distance, or moved closer with intention? No action required;
  observation alone.'
