title: Houses that are not adjacent do not readily…
unit_type: proverb
commentary: 'This proverb teaches a spatial logic of consequence: isolation creates safety from contagion. The image moves
  from the literal (fire spreading between neighboring structures) to the metaphorical domain of harm, conflict, and influence.
  It suggests that proximity itself is a risk factor—not because neighbors are hostile, but because closeness enables rapid
  transmission of trouble. The proverb invites reflection on how we manage our relationships and boundaries.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across contexts
  and generations.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts prize subtle, indirect action: the sage moves through the world with minimal friction,
  aware that proximity and force create resistance. Divergence: The Tao Te Ching emphasizes wu wei (non-action); this proverb
  is more pragmatic, naming a specific social mechanism (adjacency) rather than advocating withdrawal.


  **Heraclitus, Fragment 91 (on fire and flux):** Fire appears in both as a symbol of transformation and spread; both recognize
  that change moves through connection. Divergence: Heraclitus celebrates fire as cosmic principle; the proverb treats it
  as a cautionary neighbor—practical rather than metaphysical.'
