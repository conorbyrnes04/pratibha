unit_label: The name given to a child becomes natural to it
title: The name given to a child becomes natural to it
unit_type: proverb
commentary: 'This proverb suggests that identity is not fixed at birth but shaped through naming and social recognition. The
  word ''natural'' here implies that what we are called becomes woven into our being—not through magic, but through the lived
  experience of being addressed, recognized, and responded to by community. The proverb invites reflection on how language
  and social practice constitute who we become.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Confucian *Analects* (rectification of names):** Both traditions hold that proper naming and social role are formative:
  we grow into the names we are given and the roles we inhabit. Divergence: Confucius emphasizes *correct* naming as a moral
  and political duty; this proverb is more descriptive—it observes that naming *happens* and shapes us, without prescribing
  what names should be.


  **Heraclitus: ''character is destiny'':** Both suggest that identity emerges through process and relationship rather than
  being innate; we become through what we encounter and are called. Divergence: Heraclitus points to inner nature and cosmic
  flux; this proverb locates formation specifically in the social act of naming and recognition.'
