abhyasa: 'Today, notice one moment when you gave something (time, attention, resources) without being asked or obligated.
  Sit with it briefly: was there a prior generosity of spirit—a care for the other—that made the giving possible? What does
  that reveal about your own ''charity'' as a starting point?'
