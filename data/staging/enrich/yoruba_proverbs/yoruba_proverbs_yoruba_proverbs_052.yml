unit_label: Charity is the father of sacrifice
title: Charity is the father of sacrifice
unit_type: proverb
commentary: 'This proverb suggests that generosity (charity) is not merely an isolated act but the root from which all meaningful
  sacrifice grows. It inverts a common assumption: we often think sacrifice comes first, enabling charity. Instead, the òwe
  proposes that a disposition toward giving—toward seeing another''s need as one''s own concern—is the soil from which the
  willingness to give up something of value naturally emerges. The proverb thus names charity as a fundamental orientation,
  not a consequence.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts point to an inner quality (the sage''s emptiness; charity as root) from which right
  action flows naturally, without strain. Divergence: The Tao Te Ching emphasizes non-action and formlessness; this òwe emphasizes
  the active, relational virtue of giving.


  **1 Corinthians 13:3 (Paul on love):** Both suggest that external acts (sacrifice, almsgiving) are hollow without an inner
  disposition—love or charity—animating them. Divergence: Paul frames charity as transcendent love (agape); the òwe grounds
  it in a more immediate, relational generosity.'
