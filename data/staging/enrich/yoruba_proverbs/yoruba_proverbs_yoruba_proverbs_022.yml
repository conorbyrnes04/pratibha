title: A man with a cough can never conceal him- self
unit_type: proverb
commentary: 'This proverb uses the involuntary sound of a cough as a figure for what cannot be hidden, no matter one''s intention
  or effort. It suggests that certain truths about ourselves—our condition, our presence, our nature—announce themselves whether
  we wish them to or not. The proverb invites reflection on authenticity and the limits of concealment: some aspects of who
  we are will be known.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and economy of language.



  Cross-Tradition Resonances



  **Ecclesiastes 3:7 (''a time to keep silence and a time to speak''):** Both acknowledge that human agency has limits; some
  things will be revealed despite our will to silence them. Divergence: Ecclesiastes frames this within divine timing and
  seasons; the Yoruba proverb emphasizes the involuntary nature of the body itself as the revealer.


  **Heraclitus, Fragment 123 (''character is destiny''):** Both suggest that what we are cannot be permanently masked; our
  nature expresses itself. Divergence: Heraclitus points to moral character as fate; this proverb uses a physical symptom,
  suggesting that even bodily condition speaks truth.'
