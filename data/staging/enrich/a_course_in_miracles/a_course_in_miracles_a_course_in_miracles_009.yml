title: Miracle Principle 10
unit_type: principle
commentary: 'This passage reorients the reader''s understanding of miracles away from external proof or persuasion toward
  an internal condition of faith. A miracle, in this view, is not a tool to *create* belief in the skeptical, but rather an
  expression that already *assumes* belief—it belongs to the economy of those who already trust. The correction (''or better,
  is a misunderstanding'') gently reframes the error not as moral failure but as conceptual confusion, inviting the reader
  to reconsider what miracles are *for*.



  Key Terms



  **miracles** — In this passage, not supernatural events used as spectacle or evidence, but expressions of an already-present
  faith; tools for and by believers, not instruments of conversion.



  Cross-Tradition Resonances



  **John 20:29 (Christian Scripture):** Jesus says to Thomas: ''Blessed are those who have not seen and yet believe.'' Both
  texts privilege faith that does not depend on external signs. Divergence: John frames this as a beatitude—a blessing for
  the faithful; ACIM frames it as a functional principle about how miracles actually work, not a moral reward.


  **Hebrews 11:1 (Christian Scripture):** ''Faith is the substance of things hoped for, the evidence of things not seen.''
  Both suggest faith precedes and grounds experience, not the reverse. Divergence: Hebrews emphasizes faith as inner conviction;
  ACIM emphasizes miracles as *expressions* of that conviction, making the miracle a sign of faith already operative.'
