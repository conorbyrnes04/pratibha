abhyasa: 'Today, notice one moment when you sought external validation or ''proof'' to strengthen your own conviction about
  something that matters to you. Pause and ask: What would it mean to act as if I already believe this? What shifts when I
  stop performing belief for others and simply align with what I already know?'
