commentary: 'The passage presents miracles not as supernatural events but as expressions of love whose effects may be invisible—a
  reframing that shifts focus from outcome to intention. The speaker (identified as Jesus in ACIM) claims unique authority
  over miracles through the Atonement, yet invites the reader into collaborative participation by asking them to seek guidance
  on which miracles to perform. This paradox—absolute authority paired with an invitation to ask—suggests that the reader''s
  role is not to generate miracles independently but to align their will with a divinely dictated purpose, which the passage
  frames as a relief from the burden of deciding alone.



  Key Terms



  **Atonement** — In this passage, the principle of unified love and correction that the speaker embodies; the basis of the
  speaker''s authority to perform miracles indiscriminately, and the framework within which the reader is invited to participate.

  **Miracles** — Expressions of love whose effects may not be observable; acts performed under direct divine communication
  rather than independent will.



  Cross-Tradition Resonances



  **John 14:12 (New Testament):** Both passages invite the reader/disciple to perform works similar to or greater than the
  speaker''s, suggesting collaborative rather than passive faith. Divergence: ACIM emphasizes asking for guidance on *which*
  miracles to perform, whereas John emphasizes the reader''s capacity to do the works themselves through belief.


  **Tao Te Ching 48 (Daodejing):** Both texts suggest that true action arises from non-action or non-striving—here, ''direct
  communication'' rather than exhausting personal effort; there, wu-wei or effortless action. Divergence: ACIM frames this
  as obedience to a personal guide''s dictation, while the Daodejing points to alignment with an impersonal cosmic principle.


  **Meister Eckhart, ''Detachment'' sermons:** Both emphasize the paradox of emptying the self of will so that divine will
  may act through it, and both suggest this brings relief from personal burden. Divergence: Eckhart stresses radical detachment
  and unknowing, while ACIM offers a relational model of asking and receiving guidance from a named source.'
