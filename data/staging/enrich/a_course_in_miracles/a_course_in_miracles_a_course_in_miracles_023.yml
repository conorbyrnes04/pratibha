  body: Miracles are expressions of love, but it does not follow that they will always have observable effects. I am the only
    one who can perform miracles indiscriminately because I am the Atonement. You have a role in the Atonement, which I will
    dictate to you. Ask me which miracles you should perform. This spares you exhaustion because you will act under direct
    communication.
