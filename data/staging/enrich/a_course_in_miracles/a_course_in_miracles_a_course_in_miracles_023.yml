  only one who can perform miracles indiscriminately because I am the Atonement. You have a role in the Atonement, which I
  will dictate to you. Ask me which miracles you should perform. This spares you exhaustion because you will act under direct
  communication.
abhyasa: 'Today, notice one moment when you feel uncertain about how to help or respond to another person. Rather than acting
  from your own judgment, pause and ask inwardly: ''What miracle would serve here?'' Listen without demanding a clear answer,
  and observe whether a different quality of attention or response emerges. Note whether this shifts your sense of effort
  or exhaustion.'
