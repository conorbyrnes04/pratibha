abhyasa: 'Today, notice one moment when you felt blocked, stuck, or unable to see a way forward. Rather than solving it, sit
  quietly and ask: What in my perception or belief needs to soften or clear? Write without judgment what arises. This is not
  about achieving purification, but observing where you may be obscuring your own access to possibility.'
