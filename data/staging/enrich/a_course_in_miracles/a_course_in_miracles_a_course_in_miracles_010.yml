commentary: 'This passage establishes prayer not as petition or supplication, but as the fundamental channel through which
  divine love moves in both directions—received and then expressed outward as healing action. The symmetry is deliberate:
  prayer and miracles are not separate phenomena but two poles of a single circuit of love, with the human as the conduit.
  The phrase ''natural communication'' suggests this is not an achievement but a restoration of what already belongs to the
  created order.



  Key Terms



  **Prayer** — In this passage, the natural two-way communication between the created and Creator through which love is both
  received and expressed; the medium enabling miracles.

  **Miracles** — The expression of love outward; the practical manifestation or effect of prayer received; healing action
  in the world.



  Cross-Tradition Resonances



  **John 15:7 (Christian Scripture):** Both emphasize an intimate communion in which asking and receiving are woven together:
  ''If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you.'' Divergence:
  John frames prayer as conditional on abiding and obedience; ACIM presents prayer as the natural, already-operative channel,
  requiring no prior moral condition.


  **Meister Eckhart, ''Sermon 5'':** Both suggest prayer as a return to original nature rather than a reaching upward: ''Prayer
  is not begging God for something, but a return to our source.'' Divergence: Eckhart emphasizes emptying and surrender; ACIM
  emphasizes the active circuit of receiving and expressing, making the human an agent of love''s flow.


  **Tao Te Ching, Chapter 15:** Both describe a natural, effortless circulation: ''The ancient masters were profound and wise...
  their actions flowed like water.'' Divergence: The Tao emphasizes non-action and wu-wei; ACIM explicitly names love and
  miracles as the content of that flow, grounding it in relationship rather than impersonal principle.'
