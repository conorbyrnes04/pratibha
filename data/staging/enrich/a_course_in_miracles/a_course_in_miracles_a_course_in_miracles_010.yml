original: Prayer is the medium of miracles. Prayer is the natural communication of the created with the Creator. Through prayer
  love is received, and through miracles love is expressed.
abhyasa: Today, notice one moment when you feel received—a word that lands, a kindness that touches you, a sense of being
  understood. Pause and recognize that as prayer answered. Then observe how that reception moves through you into action toward
  another person. You need not name it; simply witness the circuit.
