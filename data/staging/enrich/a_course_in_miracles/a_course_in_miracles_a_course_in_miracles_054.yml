title: Natural to God
unit_type: principle
commentary: 'This opening statement establishes miracles not as supernatural interruptions but as expressions of divine nature
  itself—as natural to God as breathing is to a living creature. By linking miracles to ''the One Who speaks for Him,'' the
  passage suggests that those aligned with divine will participate in this naturalness rather than performing feats through
  personal effort. The claim reframes the miraculous from the exceptional or impossible into the ordinary unfolding of reality
  when perceived and acted from divine perspective.



  Key Terms



  **Miracles** — In this passage, not violations of natural law but expressions of divine nature; natural occurrences when
  one is aligned with God''s will.

  **The One Who speaks for Him** — A figure (in ACIM, identified as Jesus) who embodies and communicates divine will; one
  through whom God''s nature operates directly.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described
  with difficulty.'':** Both passages suggest that the highest power operates through naturalness and ease rather than force
  or spectacle. Divergence: The Tao Te Ching emphasizes hiddenness and paradox; ACIM emphasizes direct alignment with a personal
  divine will that ''speaks.''


  **John 14:12 (Christian Scripture): ''The works that I do shall he do also; and greater works than these shall he do.'':**
  Both suggest that those who align with divine will participate in miraculous action as an extension of that will, not as
  personal achievement. Divergence: The Gospel frames this as future promise to believers; ACIM presents it as already natural
  to God, awaiting recognition.


  **Heraclitus, Fragment 1: ''All things flow according to logos.'':** Both suggest an underlying order or principle (divine
  will / logos) through which reality naturally unfolds. Divergence: Heraclitus emphasizes impersonal flux and tension; ACIM
  emphasizes a personal God whose nature is inherently generous and communicative.'
