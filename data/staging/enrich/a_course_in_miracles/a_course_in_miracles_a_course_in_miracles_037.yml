unit_label: Claim the Holy Instant
title: Claim the Holy Instant
unit_type: principle
commentary: 'This passage asserts radical availability: the ''holy instant''—a moment of direct perception beyond ego and
  time—is not reserved for special circumstances, places, or persons, but is accessible to any practitioner at will. The claim
  inverts ordinary assumptions about grace or enlightenment as rare or earned; instead, it places agency and immediacy in
  the student''s hands. This reflects the Course''s teaching that separation from truth is illusory, and therefore reunion
  with it requires only a shift in perception, not external conditions.



  Key Terms



  **holy instant** — A moment of perception freed from ego''s interpretation of time and separation; direct awareness of truth
  outside the ordinary flow of temporal thought.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described
  with difficulty.'':** Both texts point to a reality accessible beyond conceptual effort—the Tao that cannot be named, the
  holy instant that cannot be earned. Divergence: The Tao Te Ching emphasizes receptive non-action and the limits of language;
  the Course emphasizes active claiming and the power of decision.


  **Meister Eckhart: ''God is in the innermost part of each thing... the present now.'':** Both locate transcendent presence
  in the immediate, available here-and-now rather than distant or delayed. Divergence: Eckhart grounds this in divine immanence
  within creation; the Course frames it as correction of a perceptual error about separation.


  **Dhammapada, v. 21: ''Mindfulness is the path to the Deathless; heedlessness is the path to death.'':** Both emphasize
  that liberation depends on a choice of attention available in each moment. Divergence: The Dhammapada locates freedom in
  disciplined ethical practice over time; the Course locates it in a single perceptual shift outside time.'
