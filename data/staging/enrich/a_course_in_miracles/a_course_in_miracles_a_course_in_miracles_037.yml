original: You can claim the holy instant any time and anywhere you want it.
abhyasa: 'Pause today at any ordinary moment—waiting in line, between tasks, or in conversation. Silently affirm: ''I claim
  the holy instant now.'' Notice without judgment what shifts in your attention, breath, or sense of presence. The practice
  is not to force experience but to test the passage''s claim that access is truly unconditional.'
