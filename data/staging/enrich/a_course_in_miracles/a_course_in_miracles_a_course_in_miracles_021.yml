  body: Christ inspires all miracles, which are really intercessions. They intercede for man's holiness and make his perceptions
    holy. By placing him beyond the physical laws, they raise him into the sphere of celestial order. In this order, man is
    perfect. The Soul never loses its communion with God. Only the mind needs Atonement. The miracle joins in the Atonement
    of Christ by placing the mind in the service of the spirit. This establishes the proper function of the mind and corrects
    its errors.
