  body: Miracles restore the mind to its fullness. By atoning for lack, they establish perfect protection. The strength of
    the Soul leaves no room for intrusions. The forgiven are filled with the Soul, and they forgive in return. It is the duty
    of the released to release their brothers. The forgiven are the means of Atonement. Those released by Christ must join
    in releasing their brothers, for this is the plan of the Atonement. Miracles are the way in which minds which serve the
    spirit unite with Christ for the salvation or release of all God's creations.
