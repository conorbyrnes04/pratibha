title: Miracle Principle 34
unit_type: principle
commentary: 'This passage presents miracles not as supernatural events but as shifts in perception that restore the mind to
  wholeness by undoing the sense of lack or separation. The core claim is reciprocal: to be forgiven (or ''released'') is
  to become a conduit of forgiveness toward others, making forgiveness itself the mechanism of collective healing. The passage
  frames this as Christ''s plan—a collaborative work of minds aligned with spirit to extend salvation universally.



  Key Terms



  **Atonement** — In this text, not punishment or sacrifice, but the undoing of the belief in separation; the restoration
  of unified mind through forgiveness.

  **Miracle** — A shift in perception from lack to wholeness; a joining of minds with spirit that extends healing and release.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both suggest that wholeness comes not through acquisition but through emptying—the sage ''empties
  the mind and fills the belly.'' Here, forgiveness empties the mind of grievance and fills it with the Soul. Divergence:
  The Tao Te Ching emphasizes non-action and natural flow; ACIM emphasizes active choice and deliberate extension of forgiveness
  as duty.


  **Matthew 18:21–22 (forgive seventy times seven):** Both center forgiveness as unlimited and reciprocal; the forgiven become
  forgivers. ACIM echoes the Christian duty to release others. Divergence: Matthew frames forgiveness as obedience to divine
  command; ACIM frames it as the natural overflow of a mind restored to fullness.


  **Dhammapada, vv. 5–6 (mind as forerunner):** Both locate transformation in the mind itself; mental shift precedes and enables
  all other change. Miracles, like right view, restore the mind''s proper function. Divergence: The Dhammapada emphasizes
  individual liberation through discipline; ACIM emphasizes collective salvation through shared forgiveness.'
