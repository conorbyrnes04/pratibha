abhyasa: 'Today, notice one moment when you acted or spoke without hesitation or internal conflict. Pause and ask: did I act
  from recognition of what was true in that moment, or from fear, habit, or competing desires? Sit with the difference between
  choosing from clarity and choosing from confusion.'
