original: Nothing real can be threatened. Nothing unreal exists. Herein lies the peace of God.
abhyasa: 'Today, when you notice fear or defensiveness arising, pause and ask: Is what I''m protecting against *real*, or
  am I treating an illusion as though it threatens something substantial? Sit with the question without forcing an answer.
  Notice what shifts in your body or mind when you entertain that the threat may not exist.'
