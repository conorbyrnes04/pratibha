original: Miracles as such do not matter. The only thing that matters is their Source, which is far beyond human evaluation.
abhyasa: 'When you encounter something unexpected or seemingly fortunate today, pause before celebrating or analyzing the
  event itself. Instead, ask inwardly: ''What Source could have made this possible?'' Notice whether this question opens a
  different quality of attention—one less focused on the outcome and more on the invisible condition or principle that allowed
  it.'
