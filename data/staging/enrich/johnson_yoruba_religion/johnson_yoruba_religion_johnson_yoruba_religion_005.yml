unit_label: Shaped by the Hand of Orisala
title: Shaped by the Hand of Orisala
unit_type: reflection
commentary: 'This passage presents Orisala as a creative intermediary—not the supreme force (Olorun), but a co-worker with
  divine agency in human formation. The image of humans shaped ''in a lump'' suggests both malleability and intentional craft,
  locating human existence at the intersection of transcendent power (Olorun) and active, material shaping (Orisala). This
  division of creative labor reflects a theological sophistication: the ultimate source remains singular, yet creation requires
  both transcendence and immanent work.



  Key Terms



  **Olorun** — The supreme, transcendent creative force in Yoruba theology; the ultimate source from which Orisala acts.

  **Orisala** — A divine power regarded as co-worker with Olorun; specifically credited with the shaping and forming of human
  bodies.



  Cross-Tradition Resonances



  **Plato, Timaeus: the Demiurge as craftsman working with eternal Forms:** Both traditions posit a creative intermediary
  who shapes matter according to a higher principle; both emphasize intentional form-giving. Divergence: Plato''s Demiurge
  struggles against recalcitrant matter; Orisala''s shaping appears harmonious, a willing co-working with Olorun.


  **Genesis 1–2: God creates humans in His image, then forms Adam from dust:** Both describe human formation as deliberate
  shaping by divine hands; both distinguish between originating will and material crafting. Divergence: Genesis emphasizes
  a single creator; Yoruba theology distributes creative agency across Olorun and Orisala as distinct but unified powers.'
