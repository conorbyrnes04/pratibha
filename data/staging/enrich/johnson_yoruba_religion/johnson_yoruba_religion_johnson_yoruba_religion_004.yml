abhyasa: 'Consider a person in your own family line—parent, grandparent, or ancestor. Reflect: what qualities, habits, or
  temperament do you recognize in yourself that might have come from them? Not as metaphor, but as genuine inheritance. What
  would it mean to greet that inheritance as their return?'
