unit_label: Father Has Come Again
title: Father Has Come Again
unit_type: reflection
commentary: 'Johnson records a Yoruba understanding of ancestral return: the deceased do not depart finally but cycle back
  into the living family. This is not abstract metaphysics but lived kinship—naming practices (Babatunde, Yetunde) embody
  the expectation that a grandparent may be reborn as a grandchild. The practice anchors belief in genealogy and continuity,
  making the ancestor present not as memory alone but as renewed person.



  Key Terms



  **transmigration of souls** — The passage''s term for the Yoruba belief that deceased persons are reborn into their own
  family line after a period of time.

  **Babatunde** — Yoruba name meaning ''Father has come again,'' given to a child believed to be the reincarnation of a deceased
  father or paternal ancestor.

  **Yetunde** — Yoruba name meaning ''Mother has come again,'' given to a child believed to be the reincarnation of a deceased
  mother or maternal ancestor.



  Cross-Tradition Resonances



  **Plato, *Phaedo* (on metempsychosis):** Both traditions affirm that the soul persists beyond bodily death and returns in
  new form, linking past and present lives. Divergence: Plato''s transmigration is cosmic and karmic (tied to moral desert);
  Yoruba return is familial and genealogical, binding ancestor to descendant in recognized kinship.


  **Heraclitus, Fragment 12 (''all things flow''):** Both suggest continuity-in-change: identity persists through transformation
  rather than remaining static. Divergence: Heraclitus emphasizes universal flux; Johnson''s passage emphasizes cyclical return
  within a bounded family structure.


  **Ecclesiastes 1:9 (''there is nothing new under the sun''):** Both suggest that human life repeats and returns, resisting
  linear novelty. Divergence: Ecclesiastes frames return as futility; Yoruba naming frames it as continuity, presence, and
  blessing.'
