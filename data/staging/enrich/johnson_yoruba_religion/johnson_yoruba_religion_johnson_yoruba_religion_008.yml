title: A Vision of the Great God
unit_type: reflection
commentary: 'This passage presents a hierarchical cosmology centered on a supreme creator (the Great God) in communion with
  two major orisha—Orisala (associated with purity, creation, and whiteness) and Ifa (wisdom, divination, and fate). The vision''s
  formal structure—throne, garment, counsellors—suggests both transcendence and intimate governance: the Great God is not
  remote but actively deliberates through intermediaries. The swoon-and-vision frame positions this knowledge as experiential
  and revelatory rather than merely doctrinal.



  Key Terms



  **Orisala** — An orisha associated with creation, purity, and the whiteness of beginnings; here positioned as a counsellor
  to the Great God.

  **Ifa** — An orisha of wisdom, divinity, and divination; represents fate and knowledge; here seated as counsellor alongside
  Orisala.

  **The Great God** — The supreme creator and ruler in Yoruba cosmology; transcendent yet engaged in governance through counsel.



  Cross-Tradition Resonances



  **Plato, *Republic*, Book VI (the Divided Line and the Form of the Good):** Both texts position a supreme principle (the
  Good / the Great God) as source and arbiter, accessed through intermediaries of wisdom and order. Divergence: Plato''s intermediaries
  are abstract Forms and intellect; Yoruba counsellors are active, relational orisha with their own agency and domains.


  **Qur''an 42:5 (God''s consultation with angels):** Both depict the supreme being in counsel with celestial attendants,
  suggesting governance through relationship rather than unilateral decree. Divergence: Islamic angels are messengers of a
  single will; Yoruba orisha retain distinct personalities, histories, and spheres of influence.


  **Tao Te Ching, verse 15 (the sage''s receptivity and non-action):** Both suggest that true authority operates through subtle
  influence and the counsel of aligned forces, not domination. Divergence: The Tao is impersonal and non-intentional; the
  Great God and orisha are personal, volitional, and engaged in deliberate governance.'
