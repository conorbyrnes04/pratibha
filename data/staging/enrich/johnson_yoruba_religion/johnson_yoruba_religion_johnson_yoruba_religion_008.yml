  cultural_context: 'Rev. Samuel Johnson was a Yoruba clergyman; this is an insider Yoruba account of his people''s traditional
    religion and worldview — a complement to the outsider record of A.B. Ellis. A living tradition: ceremonial and secret
    material (e.g. the Egúngún mysteries) is deliberately excluded. Offered as a study reading pending review by Yoruba tradition-bearers.'
