title: The Name Reserved for God Alone
unit_type: reflection
commentary: 'Johnson clarifies a crucial distinction in Yoruba theology: Olorun names the singular, transcendent God, while
  Orisa refers to other sacred powers—including, by extension, honored human figures. This passage establishes hierarchy and
  precision in naming; the refusal to pluralize Olorun protects its uniqueness and the monotheistic center of Yoruba faith.
  The allowance that kings may be called Orisa ''by way of eulogy'' shows how reverence operates through distinct registers
  rather than collapsing all sacred power into one category.



  Key Terms



  **Olorun** — The Yoruba name for God alone; transcendent, singular, never pluralized.

  **Orisa** — Sacred powers or divinities in Yoruba cosmology; distinct from Olorun; may also be applied honorifically to
  kings and great ones.



  Cross-Tradition Resonances



  **Deuteronomy 6:4 (Shema Israel):** Both traditions insist on the singularity and uniqueness of the ultimate divine name;
  both protect that name from casual or plural use. Divergence: The Shema forbids other gods entirely, while Johnson''s passage
  permits Orisa as a distinct category, suggesting a more differentiated cosmology.


  **Meister Eckhart, ''The Godhead beyond God'':** Both distinguish between the ultimate transcendent reality (Olorun/Godhead)
  and the manifestations or powers through which it is known or honored (Orisa/God''s attributes). Divergence: Eckhart''s
  distinction is metaphysical and apophatic; Johnson''s is primarily linguistic and social, grounded in proper naming and
  protocol.'
