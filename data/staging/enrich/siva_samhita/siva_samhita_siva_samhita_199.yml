  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When he gets the power of holding breath {i.e., to be in trance) for three hours, then certainly the wonderful
  state of pratyahar is reached without fail.
abhyasa: Today, after a few rounds of gentle alternate-nostril breathing, pause naturally at the end of an exhale and notice—without
  striving—how the usual pull of sounds, sights, and sensations seems to soften. Do not hold the breath forcefully; simply
  observe what happens to your attention when the breath is still. This is a glimpse of the principle the passage names.
