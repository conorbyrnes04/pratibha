commentary: 'This verse describes pratyāhāra—the withdrawal of the senses from external objects—as a natural fruit of extended
  breath retention (kumbhaka), not as a separate technique to be forced. The passage suggests a progressive unveiling: sustained
  prāṇāyāma creates the inner stability in which sensory entanglement simply dissolves. The ''three hours'' marks a threshold
  of mastery, after which the state becomes reliable (''without fail''), implying that pratyāhāra is less an achievement than
  a spontaneous reorientation that occurs when the breath-mind settles.



  Key Terms



  **pratyāhāra** — The withdrawal or inward turning of the senses; the fifth limb of yoga in which attention ceases to be
  captured by external objects and turns toward inner awareness.

  **kumbhaka** — Retention of the breath; a pause in the breath cycle used in prāṇāyāma practice to deepen prāṇic control
  and meditative absorption.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, II.54:** Both texts treat pratyāhāra as a limb of yoga that arises when the senses are mastered;
  both suggest it is a natural stage in progressive practice. Divergence: Patañjali names pratyāhāra as a discrete limb to
  be cultivated; the Śiva Saṃhitā presents it here as an automatic consequence of breath mastery, emphasizing spontaneity
  over deliberate technique.


  **Tao Te Ching, ch. 15 (''The ancient masters were profound and subtle''):** Both traditions value the stilling of outward
  activity (breath, senses) as a gateway to subtle inner perception; both suggest that mastery appears effortless. Divergence:
  The Tao Te Ching emphasizes wu-wei (non-action) as philosophical principle; the Śiva Saṃhitā grounds the same insight in
  a specific physiological practice with measurable stages.


  **Bhagavad Gītā, II.58 (''When he withdraws all his senses from their objects''):** Both texts describe sensory withdrawal
  as a mark of spiritual maturity and inner steadiness; both treat it as a prerequisite for higher states. Divergence: The
  Gītā frames pratyāhāra within ethical duty and devotion; the Śiva Saṃhitā locates it within a technical prāṇic physiology
  and the subtle body.'
