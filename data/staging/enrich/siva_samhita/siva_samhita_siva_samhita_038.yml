title: As when the jaundice is removed the patient sees…
unit_type: verse
commentary: 'This passage uses a medical analogy—jaundice clouding sight—to explain how ignorance (avidyā) obscures the true
  nature of ātman (spirit). The removal of delusion is not creation of something new but unveiling of what already is. This
  reflects the non-dual teaching central to the Śiva Saṃhitā: liberation is recognition, not transformation, and the obstacle
  is perceptual, not ontological.



  Key Terms



  **avidyā (delusive ignorance)** — The obscuring force that veils the true nature of spirit; removed not by acquiring knowledge
  but by clear seeing, as jaundice is removed from the eye

  **ātman (spirit)** — The true nature of self, ever-present but hidden by ignorance; its manifestation is the fruit of practice
  and clarity



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Chāndogya Upaniṣad 6.8.7: ''Tat tvam asi''—Thou art That):** Both teach that the ultimate reality is
  already one''s own nature; ignorance is the sole barrier to recognition. Divergence: The Upaniṣads emphasize direct realization
  through hearing and reflection; the Śiva Saṃhitā adds systematic prāṇāyāma and mudrā as practical means to dissolve that
  ignorance.


  **Advaita Vedānta (Śaṅkara): māyā as the illusory power veiling Brahman:** Both use the metaphor of veiling and unveiling;
  the real is eternally present, obscured only by illusion. Divergence: The Śiva Saṃhitā grounds liberation in embodied yogic
  practice and affirms the householder''s path; classical Advaita emphasizes renunciation and knowledge alone.


  **Bhagavad Gītā 5.16: ''Knowledge destroys ignorance as fire destroys fuel'':** Both present ignorance as removable and
  knowledge as the active principle of liberation. Divergence: The Gītā frames knowledge within dharma and devotion; the Śiva
  Saṃhitā locates it in the subtle body''s transformation through breath and energy work.'
