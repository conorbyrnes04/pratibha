  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: As when the jaundice is removed the patient sees the colour as it is, so when delusive ignorance is destroyed,
  the true nature of the spirit is made manifest.
abhyasa: 'Today, notice one moment when a misunderstanding dissolves and clarity arrives—a mistaken word clarified, a fear
  revealed as baseless. Pause and observe: nothing in reality changed, only your perception. Let this small shift remind you
  of the teaching: what you seek may already be present, obscured only by a veil of confusion.'
