  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The desires, etc., which cause pleasure or pain, act according to the past karma of the Jiva.
abhyasa: 'Today, when you encounter a strong desire or aversion, pause and ask: *Where does this come from?* Not as blame,
  but as inquiry. Notice whether you can observe the desire without immediately acting on it. This small gap of awareness
  is where yoga begins—the recognition that you are not identical to your conditioning.'
