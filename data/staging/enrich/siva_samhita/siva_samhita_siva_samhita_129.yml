title: The desires, etc., which cause pleasure or pain…
unit_type: verse
commentary: 'This passage articulates a core non-dual teaching: individual experience—both joy and suffering—arises not from
  external circumstance or divine whim, but from the accumulated karma (action and its consequences) of the jīva (individual
  soul or consciousness). The phrase ''desires, etc.'' suggests that even our wants and aversions are not truly autonomous
  but are expressions of past conditioning. This grounds the yoga path in personal responsibility while simultaneously pointing
  toward liberation: if present experience flows from past action, then present practice can reshape future experience and
  ultimately transcend the cycle.



  Key Terms



  **jīva** — The individual soul or embodied consciousness; in non-dual systems, the apparently separate self that is ultimately
  recognized as inseparable from universal consciousness (Brahman).

  **karma** — Action and its consequences; the principle that present experience and circumstance arise from past actions,
  and that present action shapes future experience.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''You have a right to perform your prescribed duty, but you are not entitled to the fruits of action''):**
  Both texts emphasize that action and its results are bound by law; the Śiva Saṃhitā extends this to show how past karma
  shapes present desire itself. Divergence: The Gītā stresses duty and non-attachment to fruit; the Śiva Saṃhitā focuses on
  how desire arises from conditioning, inviting inquiry into its root.


  **Dhammapada 1 (''Mind precedes all things''):** Both traditions locate the source of experience in mind/consciousness shaped
  by past action, not in external events. Divergence: The Dhammapada emphasizes ethical intention in the present moment; the
  Śiva Saṃhitā situates desire within a metaphysical framework of jīva and non-dual reality.


  **Heraclitus, Fragment 119 (''Character is destiny''):** All three suggest that what we experience as fate or circumstance
  is rooted in what we are—our conditioning, habit, or accumulated nature. Divergence: Heraclitus speaks of character as fixed
  essence; the Śiva Saṃhitā implies character is mutable through yoga practice and the recognition of jīva''s true nature.'
