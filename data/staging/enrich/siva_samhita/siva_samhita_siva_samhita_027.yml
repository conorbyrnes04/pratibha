  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Those who are not desirous of enjoying the fruits of their actions in this or the next world, should renounce
  all actions which are done with an eye to their fruits, and having similarly discarded the attachment for the daily and
  the naimittika acts, should employ themselves in the practice of Yoga. Jnanakanda.
abhyasa: Today, notice one action you perform with an expected outcome (a meditation for peace, a kind deed for gratitude,
  a study for knowledge). Pause before or during it, and silently release the demand that it produce that result. Offer the
  action itself, without claiming its fruit. Observe what shifts in your attention.
practice: Today, notice one action you perform with an expected outcome (a meditation for peace, a kind deed for gratitude,
