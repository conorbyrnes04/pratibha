  body: Those who are not desirous of enjoying the fruits of their actions in this or the next world, should renounce all
    actions which are done with an eye to their fruits, and having similarly discarded the attachment for the daily and the
    naimittika acts, should employ themselves in the practice of Yoga. Jnanakanda.
