title: Those who are not desirous of enjoying the fruits…
unit_type: verse
commentary: 'This passage presents a radical reorientation of practice: liberation is not won through action itself, but through
  the renunciation of *desire for fruit* (phala). The text distinguishes between obligatory daily rites (nitya) and occasional
  rites (naimittika)—both conventional duties—and argues that the seeker must release attachment to their results to enter
  genuine yoga practice. This teaching dissolves the common trap of spiritual ambition: even ''good'' actions performed for
  merit or future reward bind the practitioner to cycles of cause and effect. Only when action-desire ceases can yoga—union
  with the non-dual Self—begin.



  Key Terms



  **phala (fruit)** — The result or consequence of action; in Vedantic thought, the object of desire that binds the actor
  to cycles of rebirth and karmic consequence.

  **Yoga** — Here, the disciplined practice of union with the non-dual Self, distinct from mere ritual action; the path of
  liberation (mokṣa).

  **Jnanakanda** — The ''knowledge section'' of Vedic teaching; the path of wisdom and direct realization, as opposed to ritual
  (karma-kanda).



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47–48 (yoga as skill in action, without attachment to fruit):** Both texts teach that yoga requires abandoning
  desire for results while still acting; the Gītā frames this as *nishkama karma* (actionless action) within the world. Divergence:
  The Gītā emphasizes duty (dharma) performed without attachment; the Śiva Saṃhitā here suggests *renouncing* obligatory acts
  altogether to enter yoga—a more radical withdrawal.


  **Meister Eckhart, ''Blessed are the poor in spirit'' (detachment as the gateway to union):** Both traditions teach that
  clinging to results—even spiritual ones—obstructs direct realization; emptiness of desire is prerequisite. Divergence: Eckhart
  emphasizes poverty of will before God; the Śiva Saṃhitā locates the obstacle in the mechanics of karma and rebirth, not
  primarily in the soul''s relation to the divine will.


  **Tao Te Ching 48 (wu wei, non-action; the sage accomplishes by not striving):** Both teach that release from goal-seeking
  paradoxically enables true efficacy; attachment to outcome clouds perception and binds the actor. Divergence: The Tao Te
  Ching celebrates effortless action within the world; the Śiva Saṃhitā calls for renunciation of ritual duty itself in favor
  of inner yoga practice.'
