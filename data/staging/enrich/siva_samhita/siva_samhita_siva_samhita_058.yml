abhyasa: 'Today, notice one desire or worry that feels compelling. Pause and ask: Is this rooted in what I truly value, or
  in a story I''ve accepted about who I should be? Sit quietly with that distinction for a few minutes, without needing to
  resolve it. This is a small taste of the discernment the passage names.'
