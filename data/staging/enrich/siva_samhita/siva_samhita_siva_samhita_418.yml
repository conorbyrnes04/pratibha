  collection: Śiva Saṃhitā
  category: yoga
  chapter: On the Fruits of Yoga
  verse: '5.102'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The sushumna goes along the spinal cord up to where the Brahmarandhra (the hole of Brahma) is situated. Thence
  by a certain flexure, it goes to the right side of the Ajha lotus, whence it proceeds to the left nostril, and is called
  the Ganges.
abhyasa: Sit quietly and observe the natural flow of breath through each nostril for several minutes. Notice which nostril
  feels more open; simply witness without forcing. This simple observation begins to attune awareness to the subtle channels
  described in the text, grounding the abstract anatomy in direct sensation.
