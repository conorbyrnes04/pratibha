  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: He who, while living in this physical body, does not practice Yoga, is merely living for the sake of sensual
  enjoyments.
abhyasa: 'Today, notice one moment when you are about to pursue a sensory pleasure (food, comfort, distraction) habitually.
  Pause. Ask: Am I choosing this consciously, or am I merely *living for* it? Then decide—either engage with full awareness,
  or redirect that energy toward one small act of intentional practice (breath, stillness, presence).'
