title: There are eighty-four postures, of various modes
unit_type: verse
commentary: 'The passage distills eighty-four possible āsanas into four foundational postures, suggesting that mastery lies
  not in accumulating techniques but in deepening stability in a few essential forms. This reflects a non-dual teaching: the
  infinite variety of practice resolves into simplicity. The four named postures—Siddha, Padma, Ugra, Svastika—each embody
  different qualities of the body-mind''s readiness for prāṇa to flow and consciousness to settle.



  Key Terms



  **āsana** — A seated or bodily posture; in yoga, a stable, comfortable position that prepares the body and nervous system
  for breath work and meditation.

  **Siddhasana** — The ''perfected'' or ''accomplished'' pose; one of the four primary postures named in this passage, traditionally
  associated with spiritual attainment.



  Cross-Tradition Resonances



  **Yoga Sūtras of Patañjali, II.46: ''sthira sukham āsanam'':** Both texts emphasize that āsana is fundamentally about steadiness
  (sthira) and ease (sukha), not complexity or virtuosity. Divergence: The Śiva Saṃhitā here names specific postures as primary;
  Patañjali speaks of the principle without prescribing particular forms.


  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... because they were subtle, they can only be described
  with difficulty.'':** Both traditions suggest that depth emerges through simplification and refinement rather than multiplication
  of methods. Divergence: The Śiva Saṃhitā is explicit and prescriptive (naming four postures); the Tao Te Ching resists naming
  and prescription as a matter of principle.


  **Heraclitus, Fragment 50: ''All things flow, yet all things stay.'':** The passage''s reduction of eighty-four postures
  to four echoes a paradox: infinite potential contained in finite, stable forms. Divergence: Heraclitus emphasizes flux and
  change; the Śiva Saṃhitā emphasizes the stability (sthira) that enables inner transformation.'
