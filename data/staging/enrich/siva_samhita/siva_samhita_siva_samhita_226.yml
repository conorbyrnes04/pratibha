  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: There are eighty-four postures, of various modes. Out of them, four ought tot be adopted, which I mention below:—
  1, Siddhasana; 2, Padmasana; 3, Ugrasana; 4, Svastikasana. 1 Or "freedom from all diseases". [Variant reading.] 14
abhyasa: Today, sit in one of these four postures (or the closest approximation your body allows) for 5–10 minutes. Rather
  than perfecting the form, notice what 'stability' feels like in your spine, pelvis, and breath. Does the posture itself
  invite a quality of ease or alertness? Return to it tomorrow and observe if the texture changes.
