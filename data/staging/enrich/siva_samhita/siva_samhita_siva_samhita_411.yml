  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The two-petalled Chakra, called the Ajha, is situated between the two eye-brows, and has the letters h and ksh;
  its presiding adept is called Shukla Mahakala (the White Great Time); its presiding goddess is called Hakini.
abhyasa: Sit quietly and bring your attention to the space between your eyebrows, without strain. Notice any sensation, color,
  or quality of awareness there. You need not visualize anything; simple, patient attention is enough. Rest there for a few
  minutes, then gently return to ordinary awareness. This is a preliminary gesture toward the practice described in the text.
