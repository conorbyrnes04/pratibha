  body: The first sound is like the hum of the honey-intoxicated bee, next that of a flute, then a harp; after this, by gradual
    practice of Yoga, the destroyer of the darkness of the world, he hears the sounds of ringing bells; then sounds like roar
    of thunder. When one fixes his full attention on this sound, being free from fear, he gets absorption, O my beloved!
