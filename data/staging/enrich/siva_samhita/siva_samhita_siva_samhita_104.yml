  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In the body of man there are 3,500,000 nadis; of them the principal are fourteen
abhyasa: 'Today, sit quietly and place your attention on the central channel of the spine (suṣumnā nāḍī, the most important
  of the fourteen). Without forcing breath or sensation, simply notice: is there a quality of flow, blockage, or neutrality
  there? This simple noticing begins the yogic relationship with the subtle body described in the text.'
