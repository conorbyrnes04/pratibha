  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When the Yogi, though remaining in padmasana, can raise in the air and leave the ground, then know that he has
  gained vayusiddhi (success over air), which destroys the darkness of the world.
abhyasa: Sit in a comfortable seated posture today and bring attention to the quality of your breath and the spaces within
  your body where you sense movement or lightness. Without straining, notice where you feel 'heavy' and where you feel 'light.'
  This simple awareness—without attempting levitation—honors the passage's teaching that mastery over air begins with subtle
  perception, not force.
