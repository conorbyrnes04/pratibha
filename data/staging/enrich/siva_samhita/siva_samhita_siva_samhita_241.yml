  body: There let him contemplate that the God of love resides in that Brahma Yoni and that he is beautiful like Bandhuk flower
    (Pentapetes pheanicia)— brilliant as tens of millions of suns, and cool as tens of millions of moons. Above this {Yoni)
    is a small and subtle flame, whose form is intelligence. Then let him imagine that a union takes place there between himself
    and that flame (the Siva and Sakti).
