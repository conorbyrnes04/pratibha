  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: It certainly swallows the vital secretions, and ray-exuded nectar. Together with the atmosphere, the sun moves
  through the whole body.
abhyasa: Sit quietly and observe your natural breath. As you inhale, imagine a warm, luminous current moving upward through
  the center of your body; as you exhale, sense it radiating outward. Do not force or visualize elaborately—simply hold the
  gentle intention that breath and light move together. Practice for 5–10 minutes, noticing any subtle shifts in energy or
  awareness.
