title: In the body thus described, there dwelleth the…
unit_type: verse
commentary: 'This passage presents the fundamental predicament of embodied existence in non-dual thought: the Jiva (individual
  self or consciousness) is paradoxically both all-pervading and bound. The image of desires as a ''garland''—ornamental yet
  constraining—captures how what seems to adorn and enliven us actually tethers us to the cycle of karma and rebirth. The
  passage establishes why yoga practice is necessary: not to create the self anew, but to recognize and dissolve the false
  chains of conditioned identity.



  Key Terms



  **Jiva** — The individual self or embodied consciousness; in non-dual teaching, the apparent separate self that is ultimately
  inseparable from universal consciousness (Brahman), yet experiences itself as bound by karma and desire.

  **Karma** — Action and its consequences; the law of cause and effect that binds the Jiva to the cycle of birth, death, and
  rebirth through past deeds and present conditioning.



  Cross-Tradition Resonances



  **Bhagavad Gita 2.62–63 (desire leading to anger, delusion, and loss of discrimination):** Both texts trace bondage to the
  proliferation of desire and its emotional consequences; both see liberation as requiring clarity about this mechanism. Divergence:
  The Gita emphasizes ethical action and duty as the path, whereas this passage from the Śiva Saṃhitā locates liberation more
  directly in yoga practice and the recognition of the Jiva''s true nature.


  **Samyutta Nikaya (Buddhist teaching on anattā / non-self and tanha / craving):** Both traditions identify craving as the
  root of suffering and bondage; both suggest that the ''self'' we defend is a constructed identity. Divergence: The Śiva
  Saṃhitā affirms the Jiva as all-pervading consciousness (ultimately non-dual with Śiva); Buddhism teaches anattā—the absence
  of any permanent self whatsoever.


  **Plotinus, Enneads IV.8 (the soul''s descent into body and forgetfulness):** Both describe embodied consciousness as veiled
  or bound, adorned with attachments that obscure its true nature; both imply a return or recognition rather than creation
  of liberation. Divergence: Plotinus frames descent as a necessary cosmic emanation; the Śiva Saṃhitā treats bondage as illusory
  conditioning that yoga directly dissolves.'
