  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Let the wise Yogi forcibly and firmly draw up the goddess Kundali sleeping in the adhar lotus, by means of the
  apana vayu. This is Shakti-chalan mudra, the giver of all powers.
abhyasa: Sit comfortably with spine upright. Bring awareness to the base of the spine (mūlādhāra). On a natural exhalation,
  gently draw the lower abdomen inward and upward, imagining the downward-flowing breath reversing and rising. Do this for
  3–5 breaths, then rest and observe any subtle shifts in energy or awareness. This is a preliminary familiarization, not
  a full practice—deeper work requires qualified guidance.
