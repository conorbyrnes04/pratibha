  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The wise one, who continually practices contemplation of this Ajha lotus, becomes free from the mighty chain
  of desires, and enjoys happiness. 1
abhyasa: Today, sit quietly for 5–10 minutes. Without forcing or visualizing elaborately, rest your attention at the point
  between the eyebrows or in the center of the head (the traditional location of the Ajha lotus). Notice any subtle sensations,
  light, or spaciousness. Return gently each time the mind wanders. Observe afterward whether your sense of wanting or grasping
  feels lighter.
