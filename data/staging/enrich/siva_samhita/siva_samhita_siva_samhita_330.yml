  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The invocation of Pratika (shadow) gives to the devotee the objects seen as well as unseen; undoubtedly, by its
  very sight, a man becomes pure.
abhyasa: 'Today, choose a simple object of focus—a yantra, a candle flame, or a natural form—and gaze at it steadily for a
  few minutes with the intention of receiving what it offers. Notice what arises in your awareness: not just what you see,
  but what you sense or understand. Reflect afterward on whether attention itself can shift your inner state.'
