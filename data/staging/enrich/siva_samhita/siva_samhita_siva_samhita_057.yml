  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Neither ether, air, fire, water, earth, nor their combinations, nor the Devas, are perfect; the Spirit alone
  is so. Yoga and Maya.
abhyasa: 'Sit quietly and contemplate: as you notice the elements in your own body (solidity, fluidity, warmth, breath, space),
  silently acknowledge each as ''not-self, not-perfect.'' Then rest attention on the unchanging awareness witnessing all these
  changes. Notice what remains untouched by the play of elements.'
