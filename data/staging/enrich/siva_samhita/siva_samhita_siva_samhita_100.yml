  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: This milk-ray (moon) is on the left side. The other ray, brilliant as the purest milk and fountain of great joy,
  enters through the middle path (called sushumna) into the spinal cord, in order to create this moon.
abhyasa: Sit quietly and bring awareness to the left side of your body and spine. Without forcing, simply notice any sensation,
  coolness, or quality of energy there. Then gently shift attention to the central channel along the spine itself. Do not
  visualize or imagine—only observe what is already present or becomes apparent. Rest there for a few minutes, allowing the
  attention itself to be the practice.
