abhyasa: Today, identify one regular practice you already do (a posture, breath work, or meditation). Before or during it,
  pause and mentally locate or visualize the seat of your awareness—whether at the heart, between the brows, or simply 'here.'
  Notice how this inward attention changes the quality of the practice itself, making it less mechanical and more alive.
