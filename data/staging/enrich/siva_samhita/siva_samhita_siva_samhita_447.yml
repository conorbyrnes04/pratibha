  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: All these three vessels meet certainly at the mouth of the Brahmarandhra; by bathing at this place one certainly
  obtains salvation. The Sacred Triveni (Prayag).
abhyasa: Today, sit quietly and bring gentle awareness to the crown of your head. Without forcing breath or visualization,
  simply notice any subtle sensation or openness there. Rest your attention there for a few minutes, allowing the image of
  convergence—three streams meeting—to settle in your awareness. This is not technique, but contemplative familiarization
  with the teaching.
