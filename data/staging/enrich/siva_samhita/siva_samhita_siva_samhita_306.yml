  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Though ultimately the action of them {Amarani and Sahajoni) is the same, there are arisen differences owing to
  the difference of nomenclature. Let the Yogi practice them with the greatest care and perseverance.
abhyasa: 'When encountering different names or descriptions for a practice (whether from different teachers, texts, or traditions),
  pause and ask: what is the actual *doing* or *experience* being pointed to? Set aside the labels momentarily and notice
  what remains constant. This trains the mind to move beneath nomenclature toward essence.'
