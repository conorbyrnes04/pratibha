  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Two digits above the rectum and two digits below the linga (penis) is the adhara lotus, having a dimension of
  four digits.
abhyasa: 'Sit quietly and bring gentle awareness to the base of your spine. Without forcing or visualizing, simply notice
  the space described—between the lower abdomen and the perineum. Breathe naturally and rest attention there for a few minutes.
  This is not visualization but embodied attention: learning where the teaching points.'
