  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: But so long (as he does not gain it), let him practice observing all the rules and restrictions laid down above.
  From the perfection of pranayama, follows decrease of sleep, excrements and urine.
abhyasa: 'Today, notice one small shift in your body or energy after even five minutes of conscious breathing: a slight lightness,
  steadiness, or change in appetite or fatigue. Do not force interpretation—simply observe and note what actually occurs,
  as a way of trusting the text''s claim that prāṇāyāma leaves traces.'
