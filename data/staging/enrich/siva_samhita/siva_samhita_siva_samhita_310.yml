abhyasa: 'Reflect today on one area where you habitually lose energy or presence (distraction, reactivity, scattered attention).
  Notice: what instruction or principle, if held steadily, might help you remain centered there? This mirrors the text''s
  logic—mastery comes not from avoidance but from practice-informed presence.'
