  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When the Yogi can, of his will, regulate the air and stop the breath (whenever and how long) he likes, then certainly
  he gets success in kumbhaka, and from the success in kumbhaka only, what things cannot the Yogi command here? The first
  stage.
abhyasa: 'Today, sit quietly and observe your natural breath for 2–3 minutes without changing it. Then, on an exhale, pause
  gently for a count of 4–5 seconds (only as long as is comfortable). Notice what arises: steadiness, restlessness, clarity,
  or resistance. This simple observation honors the passage''s emphasis on *will* meeting *breath* without forcing, and begins
  to awaken sensitivity to the boundary between automatic and conscious respiration.'
