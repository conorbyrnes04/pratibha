  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: As through illusion a rope appears like a snake, or a pearl-shell like silver; similarly, all this universe is
  superimposed in the Paramatma (the Universal Spirit).
abhyasa: 'Today, pause when you perceive something that troubles or delights you—a difficult person, a beautiful object, a
  fearful thought. Ask silently: what unchanging awareness is aware of this appearance? Rest there for three breaths, noticing
  how the appearance continues but your relationship to it shifts when you rest as the witness rather than the perceived.'
