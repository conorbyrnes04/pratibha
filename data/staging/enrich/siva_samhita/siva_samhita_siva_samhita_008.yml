  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Persons who follow these doctrines, having committed good and bad actions, constantly wander in the worlds, in
  the cycle of births and deaths, bound by dire necessity.
abhyasa: 'Reflect today on one action you performed with good intention and one with mixed or harmful intent. Notice how both,
  regardless of moral quality, bind your attention to their fruits—worry, pride, regret, anticipation. Sit quietly and observe:
  what would it mean to act without being enslaved to the outcome?'
