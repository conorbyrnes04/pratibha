title: Persons who follow these doctrines, having…
unit_type: verse
commentary: 'This passage articulates the core problem that yoga practice addresses: the cycle of saṃsāra, where beings are
  trapped in repeated birth and death precisely because they accumulate karma through action—both virtuous and sinful deeds
  alike. The phrase ''dire necessity'' suggests that this bondage is not arbitrary punishment but a law-like consequence woven
  into existence itself. The passage establishes why the Śiva Saṃhitā''s teachings matter: they offer a path beyond mere ethical
  conduct (good actions) to liberation itself.



  Key Terms



  **saṃsāra** — The cycle of birth, death, and rebirth; the realm of conditioned existence from which liberation is sought

  **karma** — Action and its inevitable consequences; the law by which deeds bind the soul to the cycle of rebirth



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (Arjuna''s dilemma):** Both texts acknowledge that action itself—even righteous action—can bind if
  performed with attachment to results. Divergence: The Gītā offers karma yoga (action without attachment) as the solution
  within the world; the Śiva Saṃhitā points toward yoga practice and subtle-body transformation as the means of transcendence.


  **Ecclesiastes 1:14 (''vanity and striving after wind''):** Both recognize that all human effort and moral striving, without
  a higher knowledge, leads only to futility and repetition. Divergence: Ecclesiastes offers acceptance and fear of God; the
  Śiva Saṃhitā offers a practical technology of liberation through prāṇāyāma and meditation.


  **Dhammapada 1 (''mind is forerunner of all things''):** Both traditions root bondage in the mind''s entanglement with action
  and consequence, not in action alone. Divergence: The Dhammapada emphasizes ethical purification as the path; the Śiva Saṃhitā
  emphasizes energetic and subtle-body practices alongside wisdom.'
