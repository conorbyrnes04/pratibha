  body: The man knowing this Brahmarandhra, becomes my beloved in this world; conquering sins, he becomes entitled to salvation;
    by spreading knowledge, he saves thousands of people.
provenance:
  collection: Śiva Saṃhitā
  category: yoga
  chapter: On the Fruits of Yoga
  verse: '5.143'
  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The man knowing this Brahmarandhra, becomes my beloved in this world; conquering sins, he becomes entitled to
  salvation; by spreading knowledge, he saves thousands of people.
abhyasa: 'Today, sit quietly and bring gentle awareness to the crown of your head. Without forcing or visualizing, simply
  rest attention there for a few minutes, breathing naturally. Notice any subtle sensation, lightness, or openness. Then reflect:
  if knowledge of this center is real in my own experience, how might I share what I am learning—not as doctrine, but as lived
  understanding—with someone in my life today?'
