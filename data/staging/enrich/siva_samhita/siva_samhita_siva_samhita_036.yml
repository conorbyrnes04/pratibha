translation: As, when a man besmears his eyelids with the collyrium prepared from the fat of frogs, a bamboo appears like
  a serpent, so the world appears in the Paramatma, owing to the delusive pigment of habit and imagination.
abhyasa: Today, notice one moment when habit or expectation shaped what you perceived before you truly saw it. Pause and look
  again without that lens. What shifts?
