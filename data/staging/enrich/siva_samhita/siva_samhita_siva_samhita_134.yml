  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Being engrossed in the manifested (objective) world, the delusion arises about that which is the manifestor -
  the subject. There is no other, (cause of this delusion). Verily, verily, I tell you the truth.
abhyasa: 'Today, pause three times and notice: what am I aware of right now (objects, sensations, thoughts)? Then ask: what
  is aware of this? Do not answer intellectually—simply rest attention on the fact of awareness itself, prior to its contents.
  Return to your day.'
