  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Let the Yogi continually drink the nectar which flows out of it; by this he gives law to death, and conquers
  the kula. Here the kula kundalini force is absorbed, after this the quadruple creation is absorbed in the Paramatman. 29
  The Raja Yoga.
abhyasa: 'Sit quietly and bring attention to the soft palate at the roof of your mouth. Without forcing, notice any subtle
  sensation or taste there—traditionally associated with the flow of amṛta. Simply observe with gentle awareness for 5–10
  minutes, neither grasping nor rejecting what arises. This is a threshold practice: a reminder that the nectar of awakening
  is already present, waiting only for attention.'
