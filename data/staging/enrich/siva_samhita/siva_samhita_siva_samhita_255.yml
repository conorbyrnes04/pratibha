title: In accordance with the instructions of the Guru…
unit_type: verse
commentary: 'This passage describes Mahāmudrā, a foundational āsana and prāṇāyāma practice that seals the body''s vital channels
  and directs mental energy inward. The instruction emphasizes methodical progression (left side, then right), obedience to
  the guru''s guidance, and the integration of postural stability with breath control—suggesting that liberation is not abstract
  but embodied, requiring disciplined repetition and comfort with discomfort. The phrase ''held secret in all the Tantras''
  signals that this practice, though now written down, belongs to a lineage of transmitted knowledge.



  Key Terms



  **Mahāmudrā** — The ''Great Seal''—a foundational postural and breath-retention practice that unifies body, breath, and
  mind to direct vital energy (prāṇa) toward spiritual awakening.

  **kumbhaka** — Retention of breath after inhalation; a central prāṇāyāma technique for containing and directing prāṇa within
  the subtle body.

  **Guru** — The qualified spiritual teacher whose direct instruction is presented as essential to safe and authentic practice.



  Cross-Tradition Resonances



  **Patañjali''s Yoga Sūtra II.46–47 (sthira-sukham āsanam; prāṇāyāma):** Both texts ground spiritual realization in the marriage
  of stable posture and regulated breath, treating the body as a precise instrument of consciousness. Divergence: The Yoga
  Sūtra emphasizes āsana as a general steadiness and ease; the Śiva Saṃhitā prescribes a specific asymmetrical seal, suggesting
  more elaborate energetic anatomy.


  **Tao Te Ching 15 (the sage moves through the world like water, holding to the uncarved block):** Both traditions prize
  the integration of inner stillness with outer form, and both suggest that mastery comes through yielding rather than force.
  Divergence: The Tao Te Ching speaks of non-action (wu wei); the Śiva Saṃhitā prescribes deliberate, sequential practice
  under a teacher''s eye.


  **Heraclitus, Fragment 45 (the path up and down are one and the same):** Both hint that opposites—left and right, inhalation
  and retention—are unified in a single transformative movement. Divergence: Heraclitus speaks of paradox as cosmic principle;
  the Śiva Saṃhitā treats it as a practical technique to be learned and repeated.'
