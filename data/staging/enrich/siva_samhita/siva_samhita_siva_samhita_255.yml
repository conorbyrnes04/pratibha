  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In accordance with the instructions of the Guru, press gently the perineum with the heel of the left foot. Stretching
  the right foot out, hold it fast by the two hands. Having closed the nine gates (of the body), place the chin on the chest.
  Then concentrate the vibrations of the mind and inspire air and retain it by kumbhaka (so long as one can comfortably keep
  it). This is the Mahamudra, held secret in all the Tantras. The steady-minded Yogi, having practiced it on the left side
  should then practice it on the right side; and in all cases must be firm in pranayama - the regulation of his breath.
abhyasa: Today, sit upright and gently press your left heel toward the perineum while extending your right leg. Without strain,
  hold the posture for three to five conscious breaths, feeling the subtle shift in your body's energy. Notice where your
  attention naturally gathers—this is the beginning of the practice's inward turn.
practice: Today, sit upright and gently press your left heel toward the perineum while extending your right leg. Without strain,
