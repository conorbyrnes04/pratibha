  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When, through, great practice, the Yogi can perform one kumbhaka for full three hours, when for eight dandas
  (=3 hours) the breathing of the Yogi is suspended, then that wise one can balance himself on his thumb; but he appears to
  others as insane. III. The Parichaya
abhyasa: Today, observe one conscious breath cycle (inhale, hold, exhale) and notice the quality of stillness that arises
  in the pause. Without forcing, simply attend to how the suspension of breath affects your sense of self and time. This small
  gesture honors the text's teaching that breath control is not mere technique but a gateway to a different order of being.
