  body: When, through, great practice, the Yogi can perform one kumbhaka for full three hours, when for eight dandas (=3 hours)
    the breathing of the Yogi is suspended, then that wise one can balance himself on his thumb; but he appears to others
    as insane. III. The Parichaya
