  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Therefore, the Yogi should perform Yoga according to the rules of practice. He who is contented with what he
  gets, who restrains his senses, being a householder, who is not absorbed in the household duties, certainly attains emancipation
  by the practice of Yoga.
abhyasa: 'Today, notice one household or work duty you must perform. Before or during it, pause and ask: Can I do this fully
  and well, yet hold it lightly—as if I am not ultimately bound by its outcome? This is the householder''s yoga: action without
  absorption.'
