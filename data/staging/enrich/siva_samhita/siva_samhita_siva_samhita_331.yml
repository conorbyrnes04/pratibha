  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: In a clear sun-lit sky, behold with a steady gaze your own divine reflection; whenever this is seen even for
  a single second in the sky, you behold God at once in the sky.
abhyasa: On a clear day, find an open sky and gaze steadily at your reflection in still water or a polished surface held at
  eye level. Rather than analyzing, simply observe with relaxed attention. Notice what arises—not as thought, but as immediate
  presence. Return to this gaze whenever the mind settles.
