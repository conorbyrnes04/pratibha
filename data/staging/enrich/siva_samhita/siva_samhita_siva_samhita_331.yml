title: In a clear sun-lit sky, behold with a steady gaze…
unit_type: verse
commentary: 'This passage teaches a direct perceptual method: by gazing steadily at one''s own reflection in clear sky, the
  practitioner recognizes the divine immediately present within that reflection. The teaching collapses the distance between
  self and God—not through intellectual understanding but through sustained, simple seeing. Even a momentary glimpse (''a
  single second'') is sufficient, suggesting that the divine is not hidden but perpetually available to direct perception
  when the gaze is clear and steady.



  Key Terms



  **steady gaze (dhṛṣṭi)** — Unwavering, focused perception; in yoga practice, the fixing of attention that steadies both
  mind and subtle energy

  **divine reflection (pratibimba)** — The image of the self recognized as inseparable from the divine; not a copy but a direct
  manifestation



  Cross-Tradition Resonances



  **Upaniṣads (Ātman-Brahman teaching):** Both teach that the innermost self, when truly perceived, is identical with ultimate
  reality (God/Brahman); direct seeing dissolves the illusion of separation. Divergence: The Upaniṣads typically emphasize
  inquiry and negation (''neti neti''—not this, not this), while this passage offers a positive, sensory method of gazing.


  **Meister Eckhart, ''The eye with which I see God is the same eye with which God sees me'':** Both suggest that the act
  of seeing the divine and being seen by it are one; subject and object merge in clear perception. Divergence: Eckhart frames
  this as a paradox of mutual seeing; the Śiva Saṃhitā passage presents it as a simple, direct technique available to the
  steady gaze.


  **Dzogchen (Tibetan Buddhism), ''rigpa'' (pristine awareness):** Both point to an immediate recognition of one''s true nature
  through direct perception rather than conceptual knowledge. Divergence: Dzogchen emphasizes the nature of mind itself as
  the locus of recognition, while this passage uses the sky and reflection as the gateway.'
