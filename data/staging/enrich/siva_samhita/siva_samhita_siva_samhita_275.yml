  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Having contracted the muscles of the throat press the chin on the breast. This is said to be the Jalandhara-
  Mudra. Even gods reckon it as inestimable. The fire in the region of the navel (i.e., the gastric juice) drinks the nectar
  which exudes out of the thousand-petalled lotus. (In order to prevent the nectar to be thus consumed), he should practice
  this bandha.
abhyasa: 'Today, sit quietly and gently contract the throat muscles while drawing your chin slightly toward your chest, creating
  a soft lock at the base of the throat. Hold for a few breaths, then release. Notice any shift in your sense of energy or
  attention. This is not a full practice instruction, but an invitation to sense what the text describes: a subtle redirection
  of internal flow.'
