title: Having contracted the muscles of the throat press…
unit_type: verse
commentary: 'This passage teaches Jālandhara Bandha, a throat lock that redirects subtle energies within the body''s energy
  channels. The teaching presents a practical problem—that vital nectar (amṛta) from the upper energy centers is being consumed
  by digestive fire—and offers the bandha as a solution. By sealing the throat and drawing the chin down, the practitioner
  prevents this loss and preserves the subtle substance needed for deeper spiritual work. The passage''s matter-of-fact tone
  (''even gods reckon it inestimable'') suggests this is not mystical fancy but a recognized principle within the yoga tradition.



  Key Terms



  **Jālandhara Bandha** — A throat lock created by contracting the throat muscles and pressing the chin toward the chest;
  described in this passage as preventing the loss of subtle vital essence (nectar) to digestive fire.

  **amṛta (nectar)** — In this context, a subtle vital substance that exudes from the ''thousand-petalled lotus'' (the highest
  energy center); its preservation is presented as essential to spiritual practice.

  **bandha** — An energetic lock or seal created through muscular contraction; here used to redirect or contain subtle energetic
  flows within the body.



  Cross-Tradition Resonances



  **Haṭha Yoga Pradīpikā (1.4), another classical yoga text:** Both texts present bandhas and mudrās as practical techniques
  for controlling and refining prāṇa (vital energy), treating the subtle body as a real mechanism of transformation. Divergence:
  The Haṭha Yoga Pradīpikā emphasizes bandhas more systematically as preparatory to kuṇḍalinī awakening, while this passage
  focuses narrowly on the specific problem of energy loss.


  **Taoist internal alchemy texts (e.g., *Secret of the Golden Flower*):** Both traditions describe a subtle substance (here
  amṛta, there ''the elixir'') that must be preserved and circulated through the body via energetic locks and breathing to
  achieve spiritual refinement. Divergence: The Śiva Saṃhitā grounds this in non-dual Śaiva metaphysics and the chakra system,
  while Taoist alchemy emphasizes cosmological correspondence and the five elements.


  **Patañjali''s Yoga Sūtra (2.29), on the eight limbs of yoga:** Both texts treat yoga as a systematic discipline with specific
  techniques (here bandha, there āsana, prāṇāyāma, etc.) aimed at liberation or kaivalya. Divergence: The Yoga Sūtra remains
  largely silent on the subtle body and its mechanisms, while the Śiva Saṃhitā makes the subtle anatomy central to practice
  and theory.'
