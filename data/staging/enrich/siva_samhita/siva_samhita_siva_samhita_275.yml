  body: Having contracted the muscles of the throat press the chin on the breast. This is said to be the Jalandhara- Mudra.
    Even gods reckon it as inestimable. The fire in the region of the navel (i.e., the gastric juice) drinks the nectar which
    exudes out of the thousand-petalled lotus. (In order to prevent the nectar to be thus consumed), he should practice this
    bandha.
