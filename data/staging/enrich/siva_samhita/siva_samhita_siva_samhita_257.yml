title: O ye worshipped of the gods!
unit_type: verse
commentary: 'This passage emphasizes that certain yogic practices—here, a mudrā (gesture or energetic seal)—possess transformative
  power precisely because they are guarded and transmitted with care within a lineage. The metaphor of ''crossing the ocean
  of the world'' suggests liberation from the cycle of suffering and rebirth; the mudrā is presented not as mere technique
  but as a sacred tool whose efficacy depends on proper transmission and reverence. The address to ''ye worshipped of the
  gods'' honors the student as a vessel worthy of this knowledge, establishing that initiation into such practice is both
  a privilege and a responsibility.



  Key Terms



  **mudrā** — A gesture, seal, or energetic configuration of the body used in yoga and meditation to direct prāṇa (life force)
  and awaken subtle capacities; here presented as a practice of power that must be guarded.

  **Yogi** — One who practices yoga; a practitioner on the path of liberation through discipline, meditation, and cultivation
  of subtle energies.



  Cross-Tradition Resonances



  **Dhammapada, verse 19 (on guarding the mind):** Both texts emphasize that what is precious must be guarded with vigilance;
  the Dhammapada speaks of protecting the mind as a fortress, while the Śiva Saṃhitā speaks of protecting sacred practice.
  Divergence: The Dhammapada''s focus is ethical and psychological (guarding against unskillful thoughts), whereas the Śiva
  Saṃhitā''s concern is esoteric and energetic (preserving the power of transmitted technique).


  **Kena Upaniṣad, opening: ''By whom willed and directed does the mind go forth?'':** Both texts treat knowledge as something
  that must be received through proper inquiry and relationship rather than grasped intellectually; both honor the teacher-student
  transmission. Divergence: The Kena Upaniṣad emphasizes questioning and intellectual discernment, while the Śiva Saṃhitā
  emphasizes embodied practice and the guarding of technique.


  **Heraclitus, fragment 123: ''Nature loves to hide'':** Both suggest that what is most powerful operates partly in concealment;
  the mudrā''s efficacy is inseparable from its being kept secret and transmitted with reverence. Divergence: Heraclitus speaks
  of nature''s inherent hiddenness as a philosophical principle, while the Śiva Saṃhitā speaks of deliberate secrecy as a
  protective practice within a living tradition.'
