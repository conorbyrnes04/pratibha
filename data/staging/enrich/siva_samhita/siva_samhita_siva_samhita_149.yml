title: Again, out of these ten, the first five are the…
unit_type: verse
commentary: 'This passage establishes a hierarchy within the system of ten vital winds (vāyus) that animate the subtle body,
  identifying prāṇa and apāna as supreme among them. By naming these two as ''highest agents,'' the text suggests that mastery
  of the breath currents—particularly the upward and downward flows—is foundational to all yogic work. This prioritization
  reflects the Śiva Saṃhitā''s practical orientation: liberation is not merely philosophical but embodied, requiring precise
  knowledge of which forces to cultivate and direct.



  Key Terms



  **prāṇa** — The vital wind governing upward and outward movement; the primary life force; in this context, one of the two
  highest agents among the ten vāyus.

  **apāna** — The vital wind governing downward and eliminative movement; in this context, paired with prāṇa as supreme among
  the vital forces.

  **vāyu** — Literally ''wind''; the ten vital currents or subtle energies that move through the body and sustain life and
  consciousness.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts recognize that mastery begins with discerning the fundamental polarities within a unified
  system—the Tao speaks of the sage perceiving opposites as complementary; the Śiva Saṃhitā names prāṇa and apāna as the primary
  pair. Divergence: The Tao Te Ching emphasizes non-action and paradox; the Śiva Saṃhitā offers concrete practices to work
  with these forces intentionally.


  **Upaniṣads (e.g., Praśna Upaniṣad 3.3):** Both recognize prāṇa as the supreme vital principle and organize subtle physiology
  around it; both ground non-dual philosophy in the breath. Divergence: The Upaniṣads tend toward pure philosophical inquiry;
  the Śiva Saṃhitā is explicitly a manual for systematic practice and transformation.


  **Heraclitus, Fragment 90 (flux and opposition):** Both suggest that reality and the body are governed by dynamic tension
  between opposing forces (up/down, in/out) rather than static being. Divergence: Heraclitus speaks of cosmic fire and universal
  flux; the Śiva Saṃhitā locates this dynamism in the practitioner''s own subtle anatomy, accessible through discipline.'
