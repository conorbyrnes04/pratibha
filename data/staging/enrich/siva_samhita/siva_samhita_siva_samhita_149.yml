  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Again, out of these ten, the first five are the leading ones; even among these, the prana and apana are the highest
  agents, in my opinion.
abhyasa: Today, notice the natural rhythm of your inhalation and exhalation without forcing it. Observe where the breath seems
  to move upward (prāṇa) and where it naturally settles downward (apāna). Simply witnessing this distinction—without technique—begins
  to attune you to the subtle currents the text describes.
