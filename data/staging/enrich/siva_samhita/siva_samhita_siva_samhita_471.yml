title: When the mind of the Yogi is absorbed in the Great…
unit_type: verse
commentary: 'This passage describes the culmination of yogic practice: when the practitioner''s mind becomes fully absorbed
  in Kula—understood here as the ultimate reality or divine principle—a stable, complete state of samadhi (meditative absorption)
  naturally arises. The text suggests that this absorption is not forced but emerges from genuine mental merger with the divine,
  and that such merger brings steadfastness (sthirātā), a grounded stability that persists beyond the meditation itself. The
  passage affirms a non-dual vision in which the Yogi''s consciousness and the divine are not separate entities to be joined,
  but rather a recognition of their fundamental unity.



  Key Terms



  **Kula** — The Great God; in this context, the ultimate divine reality or supreme principle into which the Yogi''s mind
  merges.

  **Samadhi** — Meditative absorption or unified consciousness; a state in which the distinction between meditator and object
  of meditation dissolves.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, 1.3: ''Tadā draṣṭuḥ svarūpe avasthānam'' (Then the seer abides in its own nature):** Both passages
  describe the fruit of yoga as a stable abiding in one''s true nature through absorption; both suggest that steadiness follows
  naturally from this recognition. Divergence: The Yoga Sutras emphasize the seer''s own nature as the goal, while the Śiva
  Saṃhitā emphasizes absorption into the divine Kula as the means—a more explicitly devotional or non-dual framing.


  **Bhagavad Gita 6.20-23: The Yogi whose mind is yoked finds peace in Brahman:** Both texts present yoga as a path to stable
  peace through mental absorption in the divine, and both suggest this stability persists as a lived condition. Divergence:
  The Gita emphasizes duty and action alongside meditation, while this passage focuses purely on the inward absorption and
  its fruit of steadfastness.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both suggest a non-dual merger
  in which subject and object dissolve; both point to absorption as the gateway to stable truth. Divergence: Eckhart''s formulation
  is apophatic and paradoxical, while the Śiva Saṃhitā grounds the experience in the subtle body and prāṇa, offering a more
  embodied metaphysics.'
