abhyasa: 'Today, observe one moment of multiplicity—a conflict between two people, a choice between options, a distinction
  between ''self'' and ''other''—and silently ask: what remains unchanged beneath this appearance? Not as an intellectual
  answer, but as a gentle inquiry that rests attention on the aware presence in which all distinctions arise and pass.'
