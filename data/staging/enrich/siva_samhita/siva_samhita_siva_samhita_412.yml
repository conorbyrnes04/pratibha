  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Within that petal, there is the eternal bija (the syllable tham), brilliant as the autumnal moon. The wise anchorite,
  by knowing this, is never pulled down.
abhyasa: Sit quietly and bring attention to the heart center. Without forcing or visualizing, simply rest awareness there
  and silently sound or feel the syllable 'tham' (or 'hum'). Notice what remains steady and luminous in your own being, independent
  of thought or circumstance. Return to this recognition whenever you feel pulled downward by doubt or heaviness.
