title: Fruits of actions are twofold - heaven or hell
unit_type: verse
commentary: 'This passage presents a foundational metaphysical claim: that karmic action produces differentiated results across
  a spectrum of celestial and infernal states. Rather than positing a single heaven or hell, the text acknowledges multiplicity—suggesting
  that the moral universe is nuanced, with consequences proportionate to the nature of deeds. This sets the stage for understanding
  why yoga practice, which transcends ordinary action through non-dual realization, offers a path beyond the cycle of heavenly
  and hellish returns altogether.



  Key Terms



  **Phala (fruits)** — The results or consequences of actions; in Vedantic thought, the inevitable ripening of karma across
  time and states of being.

  **Svarga (heaven)** — Celestial realms of pleasure and merit, understood as temporary states earned through virtuous action,
  not final liberation.

  **Naraka (hell)** — Infernal realms of suffering, similarly temporary consequences of harmful action within the cycle of
  birth and death.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (''yoga is skill in action''):** Both texts acknowledge that action produces consequences within the
  world. The Gītā, like the Śiva Saṃhitā, teaches that yoga transcends mere reward-and-punishment logic. Divergence: The Gītā
  emphasizes acting without attachment to fruit; the Śiva Saṃhitā passage here simply maps the fruits themselves, leaving
  the transcendence of them implicit.


  **Dhammapada 1 (''mind precedes all things''):** Both traditions root consequence in intention and mental state, implying
  that the diversity of outcomes reflects the diversity of human consciousness. Divergence: The Dhammapada frames this as
  ethical causality accessible to all; the Śiva Saṃhitā situates it within a non-dual metaphysics where liberation lies beyond
  all fruit.


  **Ecclesiastes 12:14 (''God will bring every deed into judgment''):** All three texts affirm that actions have cosmic weight
  and differentiated consequences—nothing is morally neutral. Divergence: Ecclesiastes emphasizes divine judgment as external;
  the Śiva Saṃhitā presents karma as impersonal, self-operating law woven into the fabric of manifestation.'
