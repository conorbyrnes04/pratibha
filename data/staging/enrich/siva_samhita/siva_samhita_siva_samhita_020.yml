  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Fruits of actions are twofold - heaven or hell. The heavens are of various kinds and so also hells are diverse.
abhyasa: 'Reflect today on one action you performed recently. Without judgment, notice: Did it arise from clarity or confusion?
  From compassion or contraction? Sit with the honest answer, not to condemn yourself, but to recognize how intention shapes
  consequence. This simple observation is the beginning of ethical discernment in practice.'
