  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Full of energy, and like burning gold, know this Kundalini to be the power (shakti) of Vishnu; it is the mother
  of the three qualities - sattwa (rhythm), rajas (energy) and tamas (inertia).
abhyasa: 'Sit quietly and bring attention to the base of the spine. Without forcing, simply notice the quality of aliveness
  there—the subtle warmth or vibration. Recall that this energy is not foreign or dangerous, but the creative power of the
  cosmos itself. Breathe naturally and rest in that recognition for a few minutes, asking silently: What would it mean to
  honor this power as sacred?'
