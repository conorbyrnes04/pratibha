  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The Yoga (pranayama) should not be practiced just after the meals, nor when one is very hungry; before beginning
  the practice, some milk and butter should be taken.
abhyasa: 'Before your next breath practice, notice your actual hunger and fullness. Eat or fast accordingly—not from rule,
  but from honest sensing. This small act of attending to your body''s state before practice is itself a form of yoga: meeting
  yourself as you are.'
