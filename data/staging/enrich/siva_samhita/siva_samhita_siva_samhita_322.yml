title: That samadhi (trance) can be at once induced by…
unit_type: verse
commentary: 'The Śiva Saṃhitā here dismisses two widespread shortcuts to samādhi: chemical or pharmacological means, and dietary
  manipulation. By naming these as ''mistakes,'' the text establishes that genuine absorption (samādhi) cannot be purchased
  or consumed—it requires something other than external substances or food. The passage then pivots to warn against a third
  delusion: the belief that mere association with advanced practitioners automatically confers spiritual attainment, preparing
  the reader for a deeper teaching on what samādhi actually demands.



  Key Terms



  **samādhi** — Meditative absorption or trance; a state of unified consciousness beyond ordinary mental fluctuation, central
  to yoga practice and liberation.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16 (''yoga is not for one who eats too much or too little''):** Both texts acknowledge that diet and bodily
  discipline matter in yoga, yet neither reduces practice to mere consumption. Divergence: The Gītā frames diet as a *condition*
  for yoga; the Śiva Saṃhitā explicitly rejects the notion that eating particular foods *causes* samādhi.


  **Patañjali''s Yoga Sūtra 1.14 (abhyāsa, consistent practice over time):** Both traditions insist that samādhi arises through
  sustained effort and discipline, not instantaneous means. Divergence: Patañjali emphasizes vairāgya (dispassion) alongside
  practice; the Śiva Saṃhitā here focuses on exposing false methods rather than naming the positive virtues required.'
