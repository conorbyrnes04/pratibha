abhyasa: Choose a mantra given to you by a teacher (or a traditional one like 'Om'), and commit to noticing the quality of
  sound—both external and internal resonance—as you repeat it slowly today for even a few minutes. Observe whether the repetition
  begins to shift your ordinary hearing into something more spacious or alert.
