  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: 'The body of the person practicing the regulation of breath becomes harmoniously developed, emits sweet scent,
  and looks beautiful and lovely. In all kinds of Yoga, there are four stages of pranayama - 1: Arambha-avastha (the state
  of beginning); 2: Ghata-avastha (the state of co-operation of Self and Higher Self); 3: Parichaya-avastha (knowledge); 4:
  Nishpattiavastha (the final consummation).'
abhyasa: Today, notice one conscious breath cycle. As you inhale, silently acknowledge the beginning (arambha); as you hold,
  sense the cooperation of effort and grace (ghata); as you exhale, recognize what you know in this moment (parichaya). Return
  to ordinary breathing. This is not full practice, but a contemplative gesture toward the four stages.
