abhyasa: 'Sit quietly and notice one choice you are about to make today (however small). Before acting, pause and ask: What
  intelligence moves through this choice? Can you sense the same awareness that observes your impulse, that also witnesses
  the world around you? Rest there, without forcing an answer.'
