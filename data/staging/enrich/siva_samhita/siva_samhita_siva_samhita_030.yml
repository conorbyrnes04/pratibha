  body: That Intelligence, which incites the functions into the paths of virtue or vice, am I. All this universe, moveable
    and immovable, is from me; all things are preserved by me; all are absorbed into me (at the time of pralaya; because there
    exists nothing but the spirit and I am that spirit - there exists nothing else.
