  body: The injunctions are threefold - nitya (regular), naimittika (occasional), and kamya (optional). By the non- performance
    of nitya or daily rites there accrues sin; but by their performance no merit is gained. On the other hand, the occasional
    and optional duties, if done or left undone, produce merit or demerit.
