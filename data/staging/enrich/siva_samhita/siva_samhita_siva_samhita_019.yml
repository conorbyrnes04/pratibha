  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The injunctions are threefold - nitya (regular), naimittika (occasional), and kamya (optional). By the non- performance
  of nitya or daily rites there accrues sin; but by their performance no merit is gained. On the other hand, the occasional
  and optional duties, if done or left undone, produce merit or demerit.
abhyasa: Reflect today on one regular practice you maintain (meditation, prayer, ethical restraint, study). Notice whether
  you do it to gain something, or to prevent deterioration. Then identify one optional practice—service, generosity, or deeper
  inquiry—that you might undertake not from obligation but from genuine choice. Sit with the difference between the two.
