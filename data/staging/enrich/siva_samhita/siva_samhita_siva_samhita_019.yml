title: The injunctions are threefold - nitya (regular)…
unit_type: verse
commentary: 'This passage establishes a moral asymmetry at the heart of spiritual discipline: certain practices (nitya) are
  foundational obligations whose neglect creates harm, yet their faithful performance merely sustains the baseline—they do
  not accumulate merit. Only discretionary and occasional practices generate positive fruit. This inverts common spiritual
  logic: the core work is not about gaining but about preventing loss, while growth comes through chosen engagement beyond
  duty. The teaching suggests that liberation requires both a non-negotiable foundation and the freedom to go beyond it.



  Key Terms



  **nitya** — Regular, daily, obligatory rites or practices; their neglect incurs sin, but their performance generates no
  merit—they maintain the baseline.

  **naimittika** — Occasional duties or practices undertaken in response to circumstance; their performance or omission produces
  merit or demerit.

  **kamya** — Optional, discretionary practices undertaken by choice; like naimittika, they generate merit or demerit based
  on engagement.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (Arjuna''s duty without attachment to fruit):** Both texts distinguish between obligatory action and
  its fruits; the Gītā teaches non-attachment to results, while the Śiva Saṃhitā teaches that certain duties yield no result
  at all. Divergence: The Gītā emphasizes renunciation of desire for fruit; the Śiva Saṃhitā suggests some duties are structurally
  incapable of producing merit—a different metaphysical claim.


  **Aristotle''s Nicomachean Ethics (virtue as habit, not calculation of gain):** Both suggest that foundational ethical or
  spiritual practice becomes a baseline condition rather than a source of accumulation; excellence lies beyond mere duty.
  Divergence: Aristotle frames virtue as intrinsically rewarding; the Śiva Saṃhitā explicitly denies merit to nitya practice,
  treating it as preventative rather than generative.


  **Talmudic principle: ''Who is rich? One who is happy with their portion'' (Pirkei Avot 4:1):** Both traditions distinguish
  between sustaining what one has and acquiring what one lacks; contentment and duty are not the same as growth. Divergence:
  The Talmudic saying emphasizes acceptance; the Śiva Saṃhitā actively encourages optional practice as a path to merit, not
  mere acceptance.'
