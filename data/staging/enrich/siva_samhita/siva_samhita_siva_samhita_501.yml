  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Let him practice this in secrecy, free from the company of men, in a retired place. For the sake of appearance,
  he should remain in society, but should not have his heart in it. He should not renounce the duties of his profession, caste
  or rank; but let him perform these merely, as an instrument of the Lord, without any thought of the event. By thus doing
  there is no sin. 1
abhyasa: 'Today, identify one routine duty (work task, family obligation, household chore). Perform it fully and competently,
  but before and during, silently remind yourself: ''I do this as an offering, not for its fruit.'' Notice whether this subtle
  shift in attitude changes your experience of the action itself.'
