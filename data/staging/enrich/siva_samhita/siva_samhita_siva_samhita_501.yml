commentary: 'This passage articulates a central teaching of the Śiva Saṃhitā: that liberation is compatible with ordinary
  life, not dependent on renunciation. The practitioner is instructed to maintain a dual consciousness—outwardly fulfilling
  social and professional duties, inwardly devoted to practice and detachment from results. The phrase ''as an instrument
  of the Lord'' reframes action itself as a form of surrender, dissolving the bind of karma not through withdrawal but through
  a shift in intention and awareness.



  Key Terms



  **nimitta-mātram (instrument)** — Acting as a mere instrument or channel of the divine will, without personal attachment
  to outcomes; a key principle for karma-free action in non-dual practice.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.47 (yoga is skill in action):** Both texts teach that right action performed without attachment to results
  liberates the actor; duty fulfilled with inner detachment becomes a path to freedom. Divergence: The Gītā emphasizes duty
  (dharma) as the primary framework; the Śiva Saṃhitā stresses secrecy and hidden practice as equally essential to the householder''s
  path.


  **Meister Eckhart, ''Detachment'' sermons:** Both teach that one may remain in the world while inwardly free; outer conformity
  and inner non-attachment are compatible and necessary. Divergence: Eckhart grounds this in Christian surrender to God''s
  will; the Śiva Saṃhitā frames it within a non-dual metaphysics where the practitioner recognizes the self as the Lord.


  **Tao Te Ching 15 (the sage acts without acting):** Both suggest that true action arises from non-action, from alignment
  with a higher principle rather than ego-driven striving. Divergence: The Tao Te Ching emphasizes wu-wei (effortless action)
  as natural spontaneity; the Śiva Saṃhitā prescribes deliberate yogic practice and discipline alongside this non-attachment.'
