  body: Let him practice this in secrecy, free from the company of men, in a retired place. For the sake of appearance, he
    should remain in society, but should not have his heart in it. He should not renounce the duties of his profession, caste
    or rank; but let him perform these merely, as an instrument of the Lord, without any thought of the event. By thus doing
    there is no sin. 1
