  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The Yogi, who does it even once, verily destroys all sins; and undoubtedly in him the vayus enter the middle
  channel.
abhyasa: Sit quietly and bring attention to the spine as a channel. Without forcing, notice the natural flow of breath and
  subtle sensation along the midline of the body. Rest there for a few minutes, not seeking a result, but observing whether
  attention itself begins to settle into centeredness. This is a preparation for understanding what 'the middle channel' might
  mean in lived experience.
