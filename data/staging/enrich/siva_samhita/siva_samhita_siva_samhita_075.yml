  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: The non-intelligent form of maya covered by the avarana force (concealment), manifests itself as the universe,
  owing to the nature of viksepa force.
abhyasa: 'Today, observe one moment when you perceive the world as solid and separate from yourself—a thought, a person, an
  object. Pause and ask: what if this appearance is being generated by a concealing force (hiding unity) and a projecting
  force (multiplying forms)? Hold both the appearance and this question together without resolving it. Notice what shifts
  in your sense of distance or certainty.'
