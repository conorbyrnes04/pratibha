title: As space pervades ajar both inside and out…
unit_type: verse
commentary: 'This passage establishes the foundational non-dual vision of the Śiva Saṃhitā: the Universal Spirit is not remote
  or transcendent only, but intimately present as the pervading medium of all existence—as immediate as the space within a
  room and as vast as space itself. The analogy of space (ākāśa) is precise: space does not belong to the jar; it is not created
  by the jar; it simply is, equally available inside and outside. This grounds the entire yoga path in the recognition that
  liberation is not the acquisition of something foreign, but the direct realization of what already pervades one''s own being.



  Key Terms



  **Universal Spirit (Brahman)** — The one infinite consciousness that pervades all existence, both transcendent and immanent,
  equally present within and beyond the changing universe.

  **ākāśa (space/ether)** — The subtle, all-pervading medium used here as an analogy for the Universal Spirit—present equally
  inside and outside all forms, untouched by them.



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Chāndogya Upaniṣad 3.14.1: ''Tat tvam asi''—That thou art):** Both affirm that the ultimate reality is
  non-dual and already present within the individual; the jar-and-space metaphor echoes the Upaniṣadic teaching that Brahman
  is both transcendent and immanent. Divergence: The Upaniṣads emphasize direct realization through inquiry and negation (''neti
  neti—not this, not this''); the Śiva Saṃhitā grounds this vision in the yoga of the subtle body and breath, offering a systematic
  path for householders.


  **Tao Te Ching 15: ''The Master observes the world but trusts his inner vision... The Tao is like a well: used but never
  emptied.'':** Both use the metaphor of an all-pervading, inexhaustible medium (space/Tao) that is equally present within
  and without, and both suggest that direct perception of this reality is the fruit of practice. Divergence: The Tao Te Ching
  emphasizes wu-wei (non-action) and paradox; the Śiva Saṃhitā prescribes specific yogic techniques (prāṇāyāma, mudrā, meditation)
  as the means to realize this truth.


  **Meister Eckhart: ''God is in the innermost part of each thing, yet God is also outside all things.'':** Both articulate
  a non-dual vision in which the ultimate reality is simultaneously intimate and transcendent, present both within and beyond
  the manifest world. Divergence: Eckhart''s language is theistic (God as personal will and love); the Śiva Saṃhitā speaks
  of Spirit as impersonal consciousness, and frames realization through yoga practice rather than mystical union with the
  divine person.'
