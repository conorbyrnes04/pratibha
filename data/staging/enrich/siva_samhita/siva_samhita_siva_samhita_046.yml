  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: As space pervades ajar both inside and out, similarly within and beyond this ever-changing universe, there exists
  one Universal Spirit.
abhyasa: 'Sit quietly and notice the space around you—the air you breathe, the emptiness between objects. Then turn attention
  inward: notice the space of your own awareness, the openness in which thoughts and sensations arise. Rest for a few minutes
  in the recognition that this inner and outer space are not separate. This simple observation is the contemplative seed of
  non-duality.'
