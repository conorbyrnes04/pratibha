abhyasa: 'Sit quietly and observe: what you perceive as separate ''things'' (your body, the room, other people)—notice how
  each appearance depends on your attention and assumption of separation. Without judgment, ask: what remains if I release
  the habit of dividing? Return to this inquiry for five minutes.'
