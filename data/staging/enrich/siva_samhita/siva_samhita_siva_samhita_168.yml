  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: These kumbhakas should be practiced four times - once (1) early in the morning at sunrise, (2) then at mid- day,
  (3) the third at sun-set, and (4) the fourth at mid-night.
abhyasa: Today, notice the four natural turning points in your day (sunrise, midday, sunset, midnight). At whichever of these
  you can observe, pause for one conscious breath cycle—inhale, hold, exhale—as a small gesture of remembrance. You need not
  practice kumbhaka formally; the point is to feel how the day itself has a rhythm.
