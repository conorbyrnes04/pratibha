  body: Those who are addicted to sensual pleasures or keep bad company, who are disbelievers, who are devoid of respect towards
    their Guru, who resort to promiscuous assemblies, who are addicted to false and vain controversies, who are cruel in their
    speech, and who do not give satisfaction to their Guru never attain success.
