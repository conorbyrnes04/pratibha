  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Those who are addicted to sensual pleasures or keep bad company, who are disbelievers, who are devoid of respect
  towards their Guru, who resort to promiscuous assemblies, who are addicted to false and vain controversies, who are cruel
  in their speech, and who do not give satisfaction to their Guru never attain success.
abhyasa: 'Today, notice one moment where you chose presence over distraction, or honest speech over ease. Reflect: What made
  that choice possible? Was there someone or something that steadied you? This small noticing honors the passage''s insight
  that practice grows through accumulated small alignments of body, speech, and attention.'
