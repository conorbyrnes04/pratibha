  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Brilliant with five colours, pure, moving in the middle of sushumna, this chitra is the vital part of body and
  centre of sushumna.
abhyasa: Sit quietly and bring gentle awareness to the center of your spine, from the base upward. Without forcing or visualizing,
  simply notice the quality of stillness or subtle aliveness there. Rest your attention there for a few minutes, allowing
  the passage's image of luminosity to inform your sensing—not as belief, but as an invitation to subtler perception.
