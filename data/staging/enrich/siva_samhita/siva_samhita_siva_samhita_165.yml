  body: Then let the wise practitioner close with his right thumb the pingala (right nostril), inspire air through the ida
    (the left nostril); and keep the air confined - suspend his breathing - as long as he can; and afterwards let him breathe
    out slowly, and not forcibly, through the right nostril.
