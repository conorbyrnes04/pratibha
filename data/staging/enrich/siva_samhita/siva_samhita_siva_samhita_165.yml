  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Then let the wise practitioner close with his right thumb the pingala (right nostril), inspire air through the
  ida (the left nostril); and keep the air confined - suspend his breathing - as long as he can; and afterwards let him breathe
  out slowly, and not forcibly, through the right nostril.
abhyasa: 'Today, sit comfortably and practice one round of this technique: close your right nostril with your right thumb,
  inhale slowly through your left nostril, hold the breath for a comfortable duration (do not strain), then exhale gently
  through your right nostril. Repeat 3–5 times, noticing any shift in your mental clarity or sense of calm. Pay attention
  to the instruction ''not forcibly''—let ease guide you.'
