  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: As through knowledge of rope the serpent appears a delusion; similarly, through spiritual knowledge, the world.
  As through jaundiced eyes white appears yellow; similarly, through the disease of ignorance, this world appears in the spirit
  - an error very difficult to be removed.
abhyasa: 'Today, when you perceive something as solid, separate, or problematic, pause and ask: *What am I actually seeing,
  and through what lens?* Notice one moment where your perception shifts—a worry that dissolves, a person you suddenly see
  differently, a sensation that changes when attention changes. This small noticing honors the teaching that perception itself
  is the gateway.'
