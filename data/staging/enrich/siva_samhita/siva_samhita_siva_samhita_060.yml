  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Maya (illusion) is the mother of the universe. Not from any other principle has the universe been created; when
  this maya is destroyed, the world certainly does not exist.
abhyasa: 'Sit quietly for five minutes. As you observe your breath, thoughts, and sensations, ask: ''What am I taking as solid
  and real right now?'' Notice one assumption you hold about the world''s independence or permanence. Simply observe it without
  judgment. This is a seed of the inquiry the passage invites.'
