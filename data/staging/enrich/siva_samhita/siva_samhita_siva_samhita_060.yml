unit_label: Chapter 1 — 64
title: Maya (illusion) is the mother of the universe
unit_type: verse
commentary: 'This passage asserts that māyā—often translated as ''illusion'' or ''creative power''—is the generative principle
  of all manifestation, not a secondary or derivative force. The claim is radical: nothing exists *outside* or *prior to*
  māyā; when māyā ceases, the world ceases. This is not nihilism but non-dualism: it points to the ultimate unreality of the
  world as a separate, independent entity, while affirming its appearance as māyā''s activity. The passage grounds the entire
  yoga path: if the world is māyā, then liberation means seeing through it, not escaping it.



  Key Terms



  **māyā** — The creative power or illusion through which the universe manifests; in non-dual Śaiva thought, the dynamic principle
  by which the one appears as many, neither fully real nor fully unreal.



  Cross-Tradition Resonances



  **Tao Te Ching, verse 1:** Both texts point to a generative principle (Tao / māyā) that precedes and underlies all named
  forms; both suggest the ultimate source is beyond conceptual grasp. Divergence: The Tao Te Ching emphasizes the Tao''s namelessness
  and non-action (wu wei), while the Śiva Saṃhitā explicitly names māyā as the mother and describes her creative activity.


  **Advaita Vedānta (Śaṅkara), Brahma Sutras commentary:** Both traditions teach that the world is māyā and that liberation
  involves recognizing Brahman (or Śiva) as the sole reality; both deny the world''s independent existence. Divergence: The
  Śiva Saṃhitā emphasizes embodied yoga practice and the subtle body as a means to realization, whereas classical Advaita
  privileges jñāna (knowledge) and often treats the body as secondary.


  **Heraclitus, fragment 51:** Both suggest that apparent multiplicity and change arise from a single underlying principle;
  both challenge naive realism about the world''s stability. Divergence: Heraclitus grounds change in flux and fire (a natural
  principle), while the Śiva Saṃhitā grounds appearance in māyā, a conscious creative power inseparable from Śiva.'
