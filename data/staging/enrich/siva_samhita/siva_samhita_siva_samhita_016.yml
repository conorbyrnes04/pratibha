  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: There are two systems (as found in the Vedas). Karmakanda (ritualism) and jnanakanda (wisdom). Jnanakanda and
  karmakanda are again each subdivided into two parts.
abhyasa: 'Reflect today on a practice or study you engage in: Is it primarily oriented toward action and its fruits (ritual,
  discipline, ethical conduct), or toward direct understanding and liberation? Notice whether the distinction feels absolute
  or whether your practice contains both elements. Sit with the question without rushing to answer.'
