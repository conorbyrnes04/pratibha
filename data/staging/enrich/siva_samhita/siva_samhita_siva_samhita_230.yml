  body: I now describe the Padmasana which wards off (or cures) all diseases:— Having crossed the legs, carefully place the
    feet on the opposite thighs {i.e., the left foot on the right thigh, and vice versa); cross both the hands and place them
    similarly on the thighs; fix the sight on the tip of the nose; pressing the tongue against the root of the teeth, (the
    chin should be elevated, the chest expanded) then draw the air slowly, fill the chest with all your might, and expel it
    slowly, in an unobstructed stream.
