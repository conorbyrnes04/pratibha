  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: I now describe the Padmasana which wards off (or cures) all diseases:— Having crossed the legs, carefully place
  the feet on the opposite thighs {i.e., the left foot on the right thigh, and vice versa); cross both the hands and place
  them similarly on the thighs; fix the sight on the tip of the nose; pressing the tongue against the root of the teeth, (the
  chin should be elevated, the chest expanded) then draw the air slowly, fill the chest with all your might, and expel it
  slowly, in an unobstructed stream.
abhyasa: Sit in a comfortable cross-legged position. Without forcing the full lotus, place your hands on your thighs, palms
  down. Gently lower your gaze toward the tip of your nose (softly, not straining). Breathe naturally for a few breaths, observing
  the quality of your attention. Then, over several rounds, practice drawing the breath in slowly through the nose, filling
  the chest fully, and releasing it slowly and evenly. Notice what shifts in your body, breath, and mind when these three—posture,
  gaze, and breath—are held together.
