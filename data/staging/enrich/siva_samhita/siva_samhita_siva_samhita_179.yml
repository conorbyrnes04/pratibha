  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: When the air enters the sun, it is the proper time for the Yogi to take his food (i.e>, when the breath flows
  through the pingala); when the air enters the moon, he should go to sleep {i.e., when the breath flows through the left
  nostril or the ida).
abhyasa: Today, before eating or sleeping, pause and notice which nostril feels more open or dominant in your breathing. Observe
  without forcing—simply witness the natural rhythm. This simple noticing begins to cultivate sensitivity to your own prāṇic
  patterns, the foundation of all yoga practice.
