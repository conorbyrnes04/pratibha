  cultural_context: The Śiva Saṃhitā is a classical Sanskrit yoga treatise (spoken by Śiva to Pārvatī) on non-dual metaphysics,
    the subtle body (nāḍīs, cakras, kuṇḍalinī), prāṇāyāma, mudrā, and the fruits of practice — notably affirming that even
    a householder may attain liberation. The practices are traditionally learned from a qualified teacher; offered here as
    a study reading, not an instruction manual.
translation: Between this space is the <yoni> having its face towards the back; that space is called the root; there dwells
  the goddess Kundalini. It surrounds all the <nadis>, and has three coils and a half; and catching its tail in its own mouth,
  it rests in the hole of the sushumna.
abhyasa: 'Sit quietly and bring awareness to the base of your spine. Without forcing or visualizing, simply notice the space
  there—the weight, temperature, or sensation of being grounded. Breathe naturally for a few minutes, resting attention at
  this root. This is not activation but gentle recognition: meeting the place where, according to this teaching, the goddess
  rests.'
