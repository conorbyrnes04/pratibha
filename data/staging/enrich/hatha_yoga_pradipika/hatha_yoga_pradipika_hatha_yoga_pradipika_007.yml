title: Kāneri, Pujyapāda, Nityanātha, Niranjana, Kapāli…
unit_type: verse
commentary: 'This opening verse of the Haṭha Yoga Pradīpikā lists the lineage of masters through whom the teachings have descended.
  By naming these figures, Svātmārāma establishes the authority and continuity of the haṭha yoga tradition—it is not his invention
  but a transmission received through a chain of realized teachers. The invocation honors both the source and the living relationship
  between student and teacher that the text assumes will carry its practices forward.



  Key Terms



  **Lineage (paramparā)** — The unbroken succession of teachers and students through which spiritual knowledge and practice
  are transmitted; implied here by the naming of masters.



  Cross-Tradition Resonances



  **Bhagavad Gītā 4.1–2 (Krishna to Arjuna: ''This yoga I taught to Vivasvan... transmitted thus in succession''):** Both
  texts ground their teachings in a lineage of transmission, asserting that authentic practice comes through a chain of realized
  teachers. Divergence: The Gītā emphasizes the divine origin and cosmic scope of the lineage; the Pradīpikā simply names
  historical masters, grounding authority in human succession.


  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.2.8: ''This knowledge cannot be obtained by argument... only the wise know it, when
  taught by one who knows''):** Both affirm that true knowledge requires a qualified teacher and cannot be grasped by intellect
  alone. Divergence: The Upaniṣads emphasize the transcendent nature of the knowledge; the Pradīpikā is practical and somatic,
  naming specific masters of embodied technique.'
