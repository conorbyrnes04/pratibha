abhyasa: Reflect on a teaching or skill you have received from someone. Pause and recall the person who taught you, and the
  person who taught them. Notice how knowledge moves through relationship and time, not in isolation. This prepares the mind
  to receive the Pradīpikā's teachings in the spirit of lineage rather than mere technique.
