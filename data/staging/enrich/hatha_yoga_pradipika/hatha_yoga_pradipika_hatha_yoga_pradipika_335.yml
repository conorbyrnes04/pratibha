  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Khechari which causes the stream to flow from the Chandra (Soma) is the beloved of Siva. The incomparable
  divine Susumna should be closed by the tongue drawn back.
abhyasa: 'Sit quietly and bring awareness to the roof of your mouth and the back of your throat. Without forcing, notice the
  natural position of your tongue. Contemplate: what would it mean to ''reverse'' the ordinary flow of attention or energy
  in your body? This reflection alone, without attempting the mudrā, can open inquiry into how subtle shifts in awareness
  reshape inner experience.'
