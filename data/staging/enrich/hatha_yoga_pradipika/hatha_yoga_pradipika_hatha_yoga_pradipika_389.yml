  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The knowable interpenetrates the anahata sound when it is heard, and the mind interpenetrates the knowable. The
  mind becomes absorbed there, which is the seat of the all-pervading, almighty Lord.
abhyasa: Sit quietly for five minutes. Listen inwardly for any subtle sound—a hum, a tone, a vibration—without forcing. Notice
  how your attention itself becomes part of what you hear. When the mind settles into that listening, pause and observe the
  quality of stillness that arises. This is a gentle introduction to the principle the text describes.
