  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Siddhas have devised this Kechari Mudra from the fact that the mind and the tongue reach akasa by its practice.
abhyasa: Sit quietly and bring gentle attention to the space at the roof of your mouth and the back of your throat. Without
  forcing or straining, notice the relationship between where your tongue naturally rests and the quality of your inner space
  or mental clarity. Observe whether subtle shifts in tongue position correspond to shifts in how spacious or contracted your
  awareness feels. This is contemplation, not practice of the mudra itself.
