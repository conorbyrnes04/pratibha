  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Tatwa is the seed, Hatha the field; and Indifference (Vairagya) the water. By the action of these three, the
  creeper Unmani thrives very rapidly.
abhyasa: 'Today, reflect on one area of your practice (physical, breath, or meditation) and ask: What is my *tatwa* here—what
  essential truth am I seeking? What is my *haṭha*—the discipline or effort I am actually bringing? What is my *vairagya*—where
  am I holding lightly, not grasping for results? Notice which element feels weakest, and tend to it gently.'
