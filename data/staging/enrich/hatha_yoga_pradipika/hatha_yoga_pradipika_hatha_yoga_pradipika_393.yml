title: Tatwa is the seed, Hatha the field;
unit_type: verse
commentary: 'This verse uses agricultural metaphor to describe the inner conditions necessary for spiritual ripening in haṭha
  yoga practice. Tatwa (essential reality or true nature) is the generative principle; haṭha (the disciplined physical and
  energetic work) is the ground where practice takes root; vairagya (non-attachment or dispassion) is the nourishment that
  allows the fruit to grow. Unmani—the state of mind-transcendence or absorption beyond mental fluctuation—is presented not
  as something forced, but as what naturally flourishes when these three elements align. The metaphor suggests that yoga is
  not willful conquest but cultivation: the practitioner prepares the conditions, and realization grows of its own nature.



  Key Terms



  **Vairagya** — Dispassion, non-attachment, or indifference to worldly outcomes; in this context, the inner condition of
  releasing grasping that allows spiritual growth.

  **Unmani** — Literally ''without mind''; a state of consciousness beyond ordinary mental activity, often described as absorption
  or transcendence of the thinking mind.

  **Tatwa** — Essential principle, true nature, or fundamental reality; here, the seed or generative ground of practice.



  Cross-Tradition Resonances



  **Bhagavad Gita 2.47 (Yoga is skill in action):** Both texts emphasize that yoga is not mere striving but right alignment
  of effort, nature, and surrender—action without attachment to fruit. Divergence: The Gita frames this in terms of duty (dharma)
  and social role; the Pradīpikā focuses on inner cultivation and the specific ladder of haṭha practices.


  **Tao Te Ching 15 (The sage acts without forcing):** Both suggest that the highest states arise not through force but through
  alignment with natural principles—the practitioner creates conditions, not the outcome itself. Divergence: The Pradīpikā
  is explicit about structured technique (āsana, prāṇāyāma); the Tao Te Ching counsels non-action (wu wei) and minimal intervention.


  **Dhammapada 20 (Vigilance is the path to the Deathless):** Both texts present practice as a gradual cultivation requiring
  discipline, non-grasping, and the right inner conditions to bear fruit. Divergence: The Pradīpikā emphasizes energetic and
  bodily work (haṭha); the Dhammapada emphasizes ethical conduct and mindfulness as the foundation.'
