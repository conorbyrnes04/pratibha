  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: In the arambha, a Yogi's or Yogini's body becomes divine, glowing, healthy, and emits a divine smell. The whole
  of his or her heart becomes void.
abhyasa: 'Today, sit quietly for a few minutes and notice your breath without forcing it. Observe: where do you feel heaviness
  or density in your chest or heart-space? Where do you feel lightness? Simply witness this, as if you were watching clouds
  pass. This gentle noticing begins the work of ''voiding'' the heart of what obscures it.'
