unit_label: On Samādhi — 4.70
title: In the arambha, a Yogi's or Yogini's body becomes…
unit_type: verse
commentary: 'This passage describes arambha—the initial stage of haṭha yoga practice—as a threshold where the practitioner''s
  ordinary body begins to transform into something luminous and refined. The phrase ''heart becomes void'' does not mean emptiness
  of feeling, but rather the clearing away of mental turbulence and ego-driven obstruction, making space for subtler awareness.
  The text grounds spiritual development in the lived body: transformation is not abstract but sensible—visible radiance,
  fragrance, health—yet always paired with an inward opening.



  Key Terms



  **arambha** — The initial or beginning stage of haṭha yoga practice, marked by the first perceptible shifts in the body
  and subtle channels (nāḍī)

  **haṭha yoga** — The yoga of force or effort; a system of physical postures, breath control, and energetic locks designed
  to prepare the body and mind for meditation and liberation



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts describe the sage''s body as refined and subtle: ''The ancient masters were profound
  and subtle... their bodies were empty.'' Emptying precedes transformation. Divergence: The Tao Te Ching emphasizes wu-wei
  (non-action); the Haṭha Yoga Pradīpikā prescribes deliberate, disciplined practice to achieve that emptiness.


  **Patañjali''s Yoga Sutras, I.14:** Both texts treat yoga as a progressive unfolding: ''Practice becomes firmly grounded
  when attended to for a long time, without interruption, and with sincere devotion.'' Arambha is the first visible fruit
  of such devotion. Divergence: Patañjali emphasizes mental steadiness (abhyāsa); the Haṭha Yoga Pradīpikā foregrounds bodily
  and energetic signs as proof of progress.


  **Meister Eckhart, ''Poverty of Spirit'':** Both describe a void or emptiness as the precondition for divine presence: ''A
  person should be so poor that he is not and has not a place where God can work.'' The cleared heart becomes a vessel. Divergence:
  Eckhart frames this as surrender to God''s will; the Haṭha Yoga Pradīpikā frames it as the fruit of systematic prāṇāyāma
  and bodily discipline.'
