  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Wherever the mind attaches itself first, it becomes steady there; and when it becomes absorbed in it.
abhyasa: Today, choose one simple object of attention—the natural breath, a candle flame, or a single word repeated silently.
  For five minutes, notice where your mind first settles when you begin. Rather than forcing focus, gently return to that
  initial point of contact whenever attention wanders. Observe how steadiness emerges not from effort alone, but from allowing
  the mind to rest in its own chosen anchor.
