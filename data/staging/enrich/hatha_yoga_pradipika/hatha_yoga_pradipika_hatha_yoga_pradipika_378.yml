unit_label: On Samādhi — 4.88
title: Wherever the mind attaches itself first, it becomes…
unit_type: verse
commentary: 'This passage articulates a fundamental principle of haṭha yoga practice: attention and absorption are inseparable.
  The mind''s initial point of attachment—whether breath, a mantra, a physical sensation, or an internal focal point—becomes
  the ground of steadiness (sthiratā). The text suggests that stability is not imposed but arises naturally from the mind''s
  own capacity to settle deeply into what it first engages. This economy of attention is central to the haṭha yoga path: by
  directing the mind skillfully, the practitioner creates the conditions for samādhi (absorption), the ultimate goal.



  Key Terms



  **samādhi** — Absorption; the state of unified, undistracted consciousness in which the mind becomes one with its object
  of meditation. The ultimate fruit of yoga practice.

  **sthira** — Steady, firm, stable. Describes the quality of mind or body that has become fixed and unwavering in practice.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.14 (Patañjali): ''Practice becomes firmly grounded when attended to for a long time, without interruption,
  and with sincere devotion.'':** Both texts emphasize that steadiness arises through sustained, devoted attention to a chosen
  practice. Divergence: Patañjali stresses the *duration and sincerity* required for stability, while the Haṭha Yoga Pradīpikā
  passage emphasizes the *natural settling* of mind once it first attaches.


  **Bhagavad Gītā 6.26: ''Wherever the mind wanders due to its restless nature, one should restrain it and bring it back to
  the control of the Self.'':** Both address the mind''s tendency to wander and the need to return it to a focal point. Divergence:
  The Gītā frames this as restraint and control of the Self, while the Haṭha Yoga Pradīpikā passage suggests a gentler process
  of natural absorption once attachment occurs.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... Because they were subtle, they can only be described
  with difficulty.'':** Both traditions recognize that the deepest states of mind operate through subtle, non-forceful principles
  rather than gross effort. Divergence: The Tao Te Ching emphasizes the ineffable nature of mastery, while the Haṭha Yoga
  Pradīpikā passage offers a concrete mechanism—initial attachment leading to absorption.'
