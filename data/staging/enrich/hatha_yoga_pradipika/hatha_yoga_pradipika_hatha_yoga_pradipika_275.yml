  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Yogi or Yogini, sitting with Vajra-âsana and having moved Kundali, should perform Bhastrika to awaken the
  Kundali soon.
abhyasa: Sit upright in a stable, comfortable posture today. Without forcing or straining, bring attention to the base of
  your spine and the quality of your breath. Notice how deliberate, rhythmic breathing naturally settles and focuses the mind.
  This simple awareness—without attempting advanced techniques—honors the passage's insight that breath and subtle attention
  are linked.
