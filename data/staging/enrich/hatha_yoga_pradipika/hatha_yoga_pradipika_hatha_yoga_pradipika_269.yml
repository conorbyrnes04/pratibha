  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Youngster Tapaswini (a she-ascetic), laying between the Ganges and the Yamuni, (Ida and Pingala) should be caught
  hold of by force, to get the highest position.
abhyasa: Sit quietly and bring awareness to the flow of breath through each nostril. Notice which feels more open, more active.
  Without forcing, gently observe the subtle qualities of the left and right channels (Ida and Pingala) as you inhale and
  exhale. This simple noticing is the beginning of the 'catching hold' described—conscious attention itself as the first step
  of practice.
