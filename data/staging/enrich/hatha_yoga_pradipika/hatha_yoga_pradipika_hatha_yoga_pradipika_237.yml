  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: It stops the opening (hole) of the group of Nadis, through which the juice from the sky (from the Soma or Chandra
  in the brain) falls down. It is, therefore, called the Jalandhara Bandha -- the destroyer of a host of diseases of the throat.
abhyasa: Today, bring awareness to your throat as a threshold. Notice the natural flow of breath and swallowing. Without forcing,
  simply observe where you habitually hold or release tension in this region. This simple noticing prepares the ground for
  understanding why a yoga tradition would emphasize the throat as a site of energetic control.
