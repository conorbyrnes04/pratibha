  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Hiccough, asthma, cough, pain in the head, the ears, and the eyes; these and other various kinds of diseases
  are generated by the disturbance of the breath.
abhyasa: 'Today, notice your breath during moments of physical discomfort—a headache, tension, shallow breathing. Without
  forcing change, simply observe: Is the breath shallow, held, or irregular? Sit quietly for five minutes and allow your breathing
  to deepen naturally. This simple noticing honors the text''s premise that breath and health are inseparable.'
