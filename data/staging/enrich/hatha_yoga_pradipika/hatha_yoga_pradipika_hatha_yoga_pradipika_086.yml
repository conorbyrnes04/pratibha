commentary: 'This opening observation grounds haṭha yoga in a practical diagnosis: disease arises from breath disturbance
  (prāṇa-vṛtti). Rather than treating symptoms in isolation, the text locates their root in the vital energy''s dysregulation.
  This frames the entire discipline not as gymnastics but as a therapeutic science—one that works upstream, at the level of
  breath and subtle physiology, to prevent and resolve the ailments that plague the body.



  Key Terms



  **prāṇa** — Vital life-force or breath-energy; in this passage, its disturbance (vṛtti) is identified as the root cause
  of disease.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):** Both texts
  locate healing and liberation in the regulation of vṛtti (fluctuation/disturbance); both see control of subtle processes
  as foundational. Divergence: Patañjali emphasizes mental fluctuation; the Haṭha Yoga Pradīpikā begins with breath and somatic
  disease, suggesting a more embodied entry point.


  **Hippocratic Corpus: ''All diseases arise from imbalance of humors'':** Both systems identify a single underlying principle
  (humors / prāṇa-disturbance) from which diverse symptoms flow, and both seek to restore balance. Divergence: The Hippocratic
  model is materialist and chemical; the Haṭha Yoga Pradīpikā treats breath as subtle-energetic, not merely mechanical.'
