title: Respiration being disturbed, the mind becomes…
unit_type: verse
commentary: 'This verse articulates the foundational insight of haṭha yoga: the breath and mind are intimately linked, such
  that mastery of one yields mastery of the other. Rather than attempting to still the mind through abstract meditation alone,
  the text proposes a somatic path—by regulating the breath through disciplined practice, the practitioner naturally arrives
  at mental steadiness. This reversal of the usual order (body before mind) is central to haṭha yoga''s practical method.



  Key Terms



  **prāṇa** — Life force or vital energy, classically understood as flowing through the breath; restraining or directing prāṇa
  is central to haṭha practice.

  **haṭha** — Literally ''force'' or ''effort''; the yoga of forceful practice, using body and breath to prepare for higher
  states of consciousness (rāja yoga).



  Cross-Tradition Resonances



  **Yoga Sūtra 1.2 (Patañjali): ''Yogaś chitta-vṛtti-nirodhah'' (Yoga is the cessation of mental fluctuations):** Both texts
  identify mental steadiness as yoga''s goal. The Haṭha Yoga Pradīpikā agrees that stilling the mind is essential. Divergence:
  Patañjali emphasizes direct mental discipline; Svātmārāma proposes the breath as the practical lever by which the mind is
  stilled.


  **Taoist texts (e.g., Secret of the Golden Flower): cultivation of breath and vital energy as path to refinement:** Both
  traditions recognize breath as a bridge between body and subtle consciousness, and regulate it as a core practice. Divergence:
  Haṭha yoga frames breath-work as preparation for samādhi (absorption); Taoist alchemy often emphasizes circulating energy
  through specific channels for longevity and immortality.


  **Stoic philosophy (e.g., Marcus Aurelius, Meditations): ''You have power over your mind—not outside events. Realize this,
  and you will find strength.'':** Both suggest that inner steadiness comes through disciplined practice of what is within
  one''s control. Divergence: Stoicism emphasizes rational judgment and virtue; haṭha yoga locates the lever in the body and
  breath, not reason.'
