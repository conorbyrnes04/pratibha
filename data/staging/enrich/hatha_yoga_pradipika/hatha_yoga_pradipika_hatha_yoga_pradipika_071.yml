  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Respiration being disturbed, the mind becomes disturbed. By restraining respiration, the Yogi or Yogini gets
  steadiness of mind.
abhyasa: Today, notice one moment when your breath is irregular—perhaps during mild stress or distraction—and observe how
  your mind mirrors that turbulence. Then, for 2–3 minutes, deliberately lengthen and smooth your exhalation. Observe whether
  the mind follows the breath into quietness, without forcing thought to change.
