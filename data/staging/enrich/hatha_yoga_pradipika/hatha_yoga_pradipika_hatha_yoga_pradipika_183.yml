title: There is nothing wholesome or injurious;
unit_type: verse
commentary: 'This passage describes a transformative power attributed to a particular mudrā (energetic seal or gesture): the
  practitioner becomes so refined through practice that substances ordinarily harmful lose their toxicity. The claim is not
  merely physical but ontological—the mudrā recalibrates the body-mind''s relationship to what enters it, inverting the ordinary
  categories of poison and medicine. This reflects haṭha yoga''s vision of practice as a fundamental reordering of the practitioner''s
  nature, not mere technique.



  Key Terms



  **mudrā** — A seal or gesture—physical, energetic, or both—used in haṭha yoga to direct and concentrate prāṇa (vital force)
  and transform the practitioner''s state

  **rasas** — Chemicals or essences; in this context, substances that ordinarily have toxic or medicinal properties



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.50 (yoga as equanimity):** Both texts present yoga as a state in which ordinary dualities—harm and benefit,
  poison and nectar—dissolve through transformed consciousness. Divergence: The Gītā emphasizes mental equanimity and duty;
  the Pradīpikā locates transformation in embodied prāṇic practice and mudrā.


  **Paracelsus, ''the dose makes the poison'':** Both suggest that the effect of a substance depends on the condition of the
  receiver, not the substance alone. Divergence: Paracelsus speaks of quantitative threshold; the Pradīpikā implies qualitative
  transmutation of the practitioner''s nature itself.


  **Daoism: ''the sage returns to the uncarved block'' (Tao Te Ching 28):** Both traditions suggest that refined practice
  returns one to a state prior to ordinary categories of good and harm. Divergence: The Pradīpikā emphasizes active energetic
  practice; Daoism often stresses wu-wei (non-action) and natural simplicity.'
