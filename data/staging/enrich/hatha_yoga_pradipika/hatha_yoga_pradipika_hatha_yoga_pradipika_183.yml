  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: There is nothing wholesome or injurious; for the practice of this mudra destroys the injurious effects of all
  the rasas (chemicals). Even the deadliest of poisons, if taken, acts like nectar.
abhyasa: Sit quietly and observe your habitual reactions to a small discomfort (tension, irritation, fatigue). Rather than
  labeling it as 'bad,' notice if you can hold it with the same neutral awareness you might bring to a pleasant sensation.
  This mirrors the passage's suggestion that the quality of an experience shifts when the receiver is transformed.
