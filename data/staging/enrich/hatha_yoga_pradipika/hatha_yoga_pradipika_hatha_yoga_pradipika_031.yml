  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This Paschima Tâna carries the air from the front to the back part of the body (i.e., to the susumna). It kindles
  gastric fire, reduces obesity and cures all diseases of men.
abhyasa: 'Today, notice where you hold tension or heaviness in your front body—chest, belly, throat. In a safe, gentle backward
  bend (or simply by lengthening your spine and opening your front ribs), pause and observe: Does your breath deepen? Does
  your belly feel warmer or more alive? You need not master the technique; simply witness how a small shift in posture changes
  your inner sensation. This is the beginning of feeling prāṇa''s movement.'
