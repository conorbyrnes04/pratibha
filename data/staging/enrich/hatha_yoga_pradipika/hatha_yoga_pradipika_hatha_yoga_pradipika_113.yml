  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Kumbhakas are of eight kinds, viz., Surya Bhedan, Ujjayi, Sitkari, Sitali, Bhastrika, Bhramari, Murchha, and
  Plavini.
abhyasa: Today, simply sit quietly and notice your own breath's natural variations—when it flows through one nostril more
  than the other, when it becomes subtle or coarse, when retention happens spontaneously. This observation (without forcing)
  begins to attune you to the distinctions Svātmārāma names, preparing the ground for formal practice under guidance.
