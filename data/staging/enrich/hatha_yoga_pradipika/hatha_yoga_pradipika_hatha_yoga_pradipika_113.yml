unit_label: On Prāṇāyāma — 2.44
title: Kumbhakas are of eight kinds, viz., Surya Bhedan…
unit_type: verse
commentary: 'This verse catalogs eight distinct breath-retention practices (kumbhakas), each with its own technique and energetic
  quality. By naming them systematically, Svātmārāma establishes that prāṇāyāma is not a single method but a graduated toolkit—each
  form addresses different states of mind and body, and mastery requires learning to distinguish and apply them with precision.
  The taxonomy itself teaches that yoga is both science and craft: methodical, varied, and demanding of discernment.



  Key Terms



  **kumbhaka** — breath retention or suspension; a pause in the breath cycle used to gather and direct vital energy (prāṇa)

  **prāṇāyāma** — regulation and extension of breath; foundational practice for controlling vital life-force and preparing
  the mind for meditation



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali): ''tasmin sati śvāsa-praśvāsayorgati-vicchedaḥ prāṇāyāmaḥ'':** Both texts treat breath control
  as a discrete, teachable practice that interrupts ordinary breathing and serves liberation. Divergence: Patañjali emphasizes
  prāṇāyāma as a limb of aṣṭāṅga yoga in a philosophical framework; Svātmārāma catalogs specific techniques as practical methods,
  reflecting haṭha''s emphasis on embodied craft.


  **Tao Te Ching 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described with
  difficulty.'':** Both traditions recognize that breath and vital force operate in subtle registers requiring careful, differentiated
  attention. Divergence: The Tao Te Ching suggests the subtle resists naming; Svātmārāma names and systematizes, trusting
  that precision serves practice.'
