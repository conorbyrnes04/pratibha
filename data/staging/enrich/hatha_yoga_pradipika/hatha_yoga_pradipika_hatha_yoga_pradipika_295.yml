  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: As salt being dissolved in water becomes one with it, so when Atma and mind become one, it is called Samadhi.
abhyasa: Sit quietly for a few minutes. Notice the boundary you habitually sense between 'yourself' (your thoughts, breath,
  body) and 'the world around you.' Without trying to dissolve it, simply observe how that boundary is maintained by attention.
  Then, for one breath cycle, release the effort of maintaining that distinction and notice what remains. Return to ordinary
  awareness. Repeat once more, without grasping.
