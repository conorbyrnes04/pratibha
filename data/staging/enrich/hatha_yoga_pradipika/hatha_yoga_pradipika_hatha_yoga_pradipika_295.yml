unit_label: On Samādhi — 4.5
title: As salt being dissolved in water becomes one with…
unit_type: verse
commentary: 'This verse offers a phenomenological image of samādhi—not as a state achieved through force, but as a natural
  dissolution of boundary. When salt dissolves in water, it does not vanish; rather, the distinction between salt and water
  ceases to be operative. Similarly, when the individual mind (manas) and the Self (Ātman) are no longer held apart by the
  sense of separation, that non-duality is samādhi. The simile suggests that samādhi is not exotic or distant, but the recognition
  of an already-present unity—as ordinary as salt and water becoming indistinguishable.



  Key Terms



  **Samādhi** — In this passage, the non-dual state in which the distinction between individual mind and the Self dissolves;
  a central goal of yoga practice.

  **Ātman** — The Self; in Advaita and yoga philosophy, the innermost consciousness, identical with ultimate reality (Brahman).



  Cross-Tradition Resonances



  **Upaniṣads (e.g., Kaṭha Upaniṣad 1.3.10): ''When all desires that dwell in the heart fall away, then the mortal becomes
  immortal, and attains Brahman here.'':** Both passages describe liberation as the dissolution of separateness—the falling
  away of what divides self from Self. Divergence: The Upaniṣad emphasizes renunciation of desire as the path; this verse
  uses a simile of natural merging, suggesting less struggle and more recognition.


  **Bhagavad Gītā 6.20–23 (on meditation and samādhi): ''When the mind, disciplined by yoga practice, becomes still... one
  knows the infinite joy beyond the senses.'':** Both texts present samādhi as a state of unified consciousness achieved through
  disciplined practice, bringing peace and insight. Divergence: The Gītā emphasizes the disciplining effort and the joy that
  follows; this verse stresses the effortlessness of the final state itself—salt does not ''work'' to dissolve.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both express non-duality
  through the collapse of subject-object distinction—a mutual seeing or being that transcends separation. Divergence: Eckhart''s
  formulation is relational and dialogical (I and God); this verse is more radically non-dual (salt and water become one substance,
  not two that meet).'
