abhyasa: Before reading further in any yoga text or practice, pause and recall your own teacher or guide—whether a person,
  a lineage, or an inner voice of wisdom. Offer a moment of gratitude for the transmission you have received. This mirrors
  Svātmārāma's gesture and roots your study in humility rather than mere acquisition.
