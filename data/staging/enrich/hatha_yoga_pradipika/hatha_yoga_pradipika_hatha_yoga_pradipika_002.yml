title: Yogin Swātmārāma, after saluting her Gurû Srinātha…
unit_type: verse
commentary: 'This opening verse establishes the text''s lineage and purpose: Svātmārāma presents haṭha yoga not as an end
  in itself, but as a methodical preparation for rāja yoga—the yoga of mind and samādhi. The salutation to the guru (Śrīnātha)
  honors the living transmission of knowledge, signaling that what follows is not abstract philosophy but embodied practice
  rooted in teacher-student relationship. The framing reveals haṭha yoga''s humble role: a practical ladder, not the summit.



  Key Terms



  **Haṭha Yoga** — The yoga of forceful effort; the system of bodily and breath practices (āsana, prāṇāyāma, mudrā, bandha)
  designed to prepare the body and subtle channels for higher states of consciousness.

  **Rāja Yoga** — The yoga of the mind and royal path; the culmination toward which haṭha yoga practices are directed—mastery
  of thought and attainment of samādhi.

  **Guru** — A qualified teacher; the living source of transmission and guidance in yoga practice, honored here as essential
  to authentic learning.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.1–2 (Patañjali): ''Yoga is the cessation of the fluctuations of the mind.'':** Both texts agree that yoga''s
  ultimate aim is mental mastery and stillness; both see practice as a means to that end. Divergence: The Yoga Sūtra emphasizes
  philosophical discrimination and mental discipline from the outset, whereas the Haṭha Yoga Pradīpikā begins with the body
  and breath as the gateway—a more embodied entry point.


  **Bhagavad Gītā 6.3–4: ''For a man who wishes to rise to the state of Yoga, action is said to be the means; for the same
  man, when he has risen to the state of Yoga, quiescence is said to be the means.'':** Both texts recognize stages: effort
  and practice lead to a higher state where effort dissolves into being. Divergence: The Gītā frames yoga within dharma and
  devotion to Kṛṣṇa, while the Haṭha Yoga Pradīpikā is purely technical and non-theistic in its opening.


  **Daodejing 48 (Laozi): ''In the pursuit of the Way, every day something is dropped.'':** Both suggest a progressive refinement:
  haṭha yoga''s ladder and Daoism''s path both involve shedding and simplification toward a higher state. Divergence: Haṭha
  yoga emphasizes active cultivation and effort (haṭha = force), while the Daodejing counsels non-action and natural unfolding
  (wu wei).'
