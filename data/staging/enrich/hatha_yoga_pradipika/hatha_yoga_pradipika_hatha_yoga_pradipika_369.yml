  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Contemplation on the space between the eyebrows is, in my opinion, best for accomplishing soon the Unmani state.
  For people of small intellect, it is a very easy method for obtaining perfection in the Raja-Yoga. The Laya produced by
  nada, at once gives experience (of spiritual powers).
abhyasa: Today, sit quietly for 5–10 minutes. Without straining, rest your gaze (inward or with eyes softly closed) at the
  point between the eyebrows. Notice any sensation, light, or subtle vibration there. Do not force; simply observe. If the
  mind wanders, gently return attention to that space. This is preliminary; formal practice requires qualified guidance.
