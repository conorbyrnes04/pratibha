title: Contemplation on the space between the eyebrows is…
unit_type: verse
commentary: 'Svātmārāma identifies the space between the eyebrows (ājñā chakra) as a focal point uniquely suited to rapid
  attainment of Unmani—a state of consciousness beyond mental modification. He frames this practice as accessible even to
  those of limited intellectual capacity, suggesting that direct contemplative work on this subtle center bypasses conceptual
  complexity. The mention of nāda (inner sound) and laya (absorption/dissolution) points to a non-dualistic pathway: when
  the individual consciousness dissolves into the vibration of the absolute, spiritual realization follows naturally, not
  through effort alone but through surrender into sound.



  Key Terms



  **Unmani** — A state of consciousness transcending ordinary mind (manas); literally ''beyond mind,'' associated with non-dual
  realization and dissolution of subject-object duality.

  **Laya** — Absorption or dissolution; the merging of individual consciousness into the absolute, often facilitated by concentration
  on inner sound (nāda) or other subtle phenomena.

  **Rāja-Yoga** — The ''royal path'' of yoga; the systematic cultivation of mental discipline and samādhi (meditative absorption)
  leading to liberation.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, I.2 (''yogaś chitta-vṛtti-nirodhah''):** Both texts locate yoga''s aim in the cessation of mental
  fluctuation and the attainment of a stable, non-dual consciousness. Divergence: Patañjali emphasizes restraint of thought-waves
  through practice and dispassion; Svātmārāma here suggests that absorption into nāda (sound/vibration) can dissolve the mind
  more directly, without necessarily requiring intellectual effort.


  **Meister Eckhart, ''Breakthrough'' sermons:** Both point to a transcendence of the thinking mind (''beyond intellect'')
  as the gateway to union with the divine or absolute. Divergence: Eckhart emphasizes radical negation and detachment; Svātmārāma
  offers a concrete somatic anchor (the space between the eyebrows), a technique rather than a via negativa.


  **Sufi poetry (e.g., Rūmī on dhikr and absorption in divine presence):** Both traditions employ rhythmic or vibrational
  focus (nāda / divine name) to dissolve the separate self into unity. Divergence: Sufi practice typically centers on devotional
  invocation and love; the Haṭha Yoga Pradīpikā frames the process as a technical, energetic phenomenon accessible through
  subtle anatomy.'
