  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Remembering his or her guru over his or her head, and his or her desired deity in his or her heart, after answering
  the calls of nature, and cleaning his or her mouth, he or she should apply Bhasma (ashes).
abhyasa: Before any sitting practice today, pause and mentally place your teacher or lineage above you (in awareness, not
  hierarchy) and your chosen form of the sacred in your heart-center. Notice how this simple reorientation shifts your sense
  of why you are practicing. Return to it whenever attention drifts.
