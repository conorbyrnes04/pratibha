title: Remembering his or her guru over his or her head…
unit_type: verse
commentary: 'This passage establishes the ethical and devotional frame for practice: the yogi orients inward toward both lineage
  (the guru) and the divine (the chosen deity) before undertaking physical discipline. The mundane acts—attending to bodily
  needs, cleansing—are not separate from the sacred; they prepare the vessel. The application of ash (bhasma) marks a threshold
  between ordinary life and intentional practice, signaling that what follows is not mere exercise but a consecrated act.



  Key Terms



  **guru** — The spiritual teacher; here, the living link to transmitted knowledge and grace, invoked as a guide above and
  beyond the individual practitioner.

  **bhasma** — Sacred ash, traditionally applied to the body as a mark of renunciation, purification, and dedication to the
  spiritual path.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.41 (yoga as skill in action):** Both texts present practice as requiring clear intention and alignment
  with something greater than ego; the Gītā emphasizes duty (dharma), while this passage emphasizes devotion and lineage.
  Divergence: The Gītā addresses the warrior''s dilemma in the world; the Pradīpikā assumes withdrawal into formal practice.


  **Kabbalistic preparation (e.g., Lurianic kavanah):** Both traditions require the practitioner to align consciousness with
  higher realms (sefirot, deities) before undertaking inner work; both honor the teacher as transmitter. Divergence: Kabbalah
  emphasizes intention (kavanah) as mental visualization; the Pradīpikā grounds preparation in the body and sensory cleansing.


  **Daoist inner alchemy (Taoist Yoga): purification before cultivation:** Both traditions insist on cleansing the body and
  clarifying the mind before energy work; both honor a lineage of masters. Divergence: The Pradīpikā invokes a personal deity
  and guru; Daoism emphasizes alignment with cosmic principles and the Dao itself.'
