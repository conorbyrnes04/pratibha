title: Uddiyana is so called, because the great bird…
unit_type: verse
commentary: 'This verse uses a vivid metaphor—the breath (prāṇa) as a great bird—to name and explain the bandha (energy lock)
  called uddiyana. The image suggests that when uddiyana is engaged, the prāṇa becomes bound yet paradoxically liberated,
  able to move without exhaustion. The passage treats the practice not as mere physical technique but as a means of harnessing
  vital force, implying that proper restraint enables freedom rather than constraint.



  Key Terms



  **Uddiyana** — A bandha (energy lock) in haṭha yoga; the name derives from the metaphor of a bird (the prāṇa) being bound
  yet flying without fatigue, suggesting controlled upward movement of vital force.

  **Prāṇa** — Vital life-force or breath-energy; in this passage, personified as a great bird whose movement is the focus
  of the practice.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15 (Lao Tzu):** Both texts use paradox—the sage appears inactive yet accomplishes much; the prāṇa is
  ''tied'' yet flies freely—to suggest that true power lies in subtle restraint and alignment rather than force. Divergence:
  The Tao Te Ching emphasizes non-action and wu-wei (effortless action) as a cosmic principle; the Haṭha Yoga Pradīpikā locates
  this paradox within the body''s energetic anatomy and requires deliberate practice.


  **Heraclitus, Fragment 45 (''Harmony of opposites''):** Both suggest that binding and freedom, constraint and motion, are
  not opposites but complementary; true order emerges from the right tension between opposites. Divergence: Heraclitus speaks
  of cosmic flux and logos; the Pradīpikā grounds this principle in the practitioner''s own breath and body as the field of
  transformation.'
