  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Uddiyana is so called, because the great bird, Prana, tied to it, flies without being fatigued. It is explained
  below.
abhyasa: 'Sit quietly and observe your natural breath. Notice where you sense movement or energy in your torso and belly.
  Without forcing, simply contemplate the metaphor: what would it mean for your own vital energy to be ''tied'' in a way that
  lets it move freely? Return to this image during your next breath awareness practice.'
