unit_label: On Āsanas — 1.15
title: Yoga is destroyed by the following six causes…
unit_type: verse
commentary: 'This passage names six obstacles to yoga practice, framed not as moral failings but as practical hindrances to
  the body-mind''s capacity for sustained work. The list is notably concrete and embodied: overeating and exertion affect
  the physical vessel; talkativeness and unstable company scatter mental focus; rigid rule-following (whether ascetic or indulgent)
  creates tension rather than harmony. The text assumes yoga requires a calibrated, intelligent middle path—neither excess
  nor deprivation—and that the practitioner''s environment and associations matter as much as formal technique.



  Key Terms



  **yoga** — In this context, the integrated practice of physical posture, breath control, and mental steadiness leading toward
  samādhi (absorption); here presented as fragile and requiring protective conditions.

  **unsteadiness** — Fickleness or inconstancy of mind and commitment; the inability to sustain practice or presence over
  time.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.16–17 (on yoga as a middle way):** Both texts warn against extremes—neither excessive indulgence nor harsh
  asceticism supports yoga. The Gītā teaches ''yoga is not for one who eats too much, nor for one who eats too little.'' Divergence:
  The Gītā frames the middle path as a spiritual principle; the Pradīpikā treats it as a practical physiological necessity
  for the body-mind to function.


  **Aristotle, Nicomachean Ethics (on virtue as a mean):** Both identify excess and deficiency as destructive; both prize
  a calibrated, intelligent middle ground as the condition for excellence. Divergence: Aristotle''s mean is ethical and intellectual;
  the Pradīpikā''s is somatic and energetic—about the flow of prāṇa (vital breath) rather than moral character.


  **Dhammapada 5 (on the Middle Way in Buddhist practice):** The Buddha teaches that extremes of self-indulgence and self-mortification
  both obstruct awakening; the middle path is the way. Divergence: The Dhammapada emphasizes renunciation of craving itself;
  the Pradīpikā permits and even requires nourishment and rest—it is not about transcending desire but channeling energy wisely.'
