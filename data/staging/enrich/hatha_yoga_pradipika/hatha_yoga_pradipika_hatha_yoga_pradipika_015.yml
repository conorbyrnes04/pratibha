  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Yoga is destroyed by the following six causes:-- Over-eating, exertion, talkativeness, adhering to rules, i.e.,
  cold bath in the morning, eating at night, or eating fruits only, company of men, and unsteadiness.
abhyasa: Today, notice one moment where you overcommit your energy (physical exertion, mental chatter, or social obligation),
  and one moment where you deliberately choose moderation—a meal that nourishes without heaviness, a conversation that ends
  before exhaustion, a pause instead of a rule. Observe how each affects your capacity to breathe and settle.
