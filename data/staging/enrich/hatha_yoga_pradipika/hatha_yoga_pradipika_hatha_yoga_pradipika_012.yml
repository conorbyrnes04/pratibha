  body: The Yogi or Yogini should practice Hatha Yoga in a small room, situated in a solitary place, being 4 cubits square,
    and free from stones, fire, water, disturbances of all kinds, and in a country where justice is properly administered,
    where good people live, and food can be obtained easily and plentifully.
