  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Yogi or Yogini should practice Hatha Yoga in a small room, situated in a solitary place, being 4 cubits square,
  and free from stones, fire, water, disturbances of all kinds, and in a country where justice is properly administered, where
  good people live, and food can be obtained easily and plentifully.
abhyasa: Today, examine one space where you spend time regularly (a room, corner, or outdoor spot). Notice what distracts
  or unsettles you there—visual clutter, noise, temperature, or social tension. Make one small change to reduce one disturbance,
  and sit quietly there for five minutes. Observe how even a minor shift in environment affects your attention.
