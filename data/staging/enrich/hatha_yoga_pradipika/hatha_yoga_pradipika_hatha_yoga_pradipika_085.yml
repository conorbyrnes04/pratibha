  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: When Pranayama, etc., are performed properly, they eradicate all diseases; but an improper practice generates
  diseases.
abhyasa: 'Before your next breath practice, pause and ask: Do I know *why* I am doing this? Can I name one specific instruction
  I have received about how to do it correctly? If you cannot answer both clearly, use today to observe your breath without
  formal technique—or to seek clarification from a teacher. Proper practice begins with honest assessment of readiness.'
