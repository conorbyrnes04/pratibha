title: When Pranayama, etc., are performed properly, they…
unit_type: verse
commentary: 'This verse establishes a fundamental principle: the efficacy of prāṇāyāma and related practices depends entirely
  on correct execution. The passage does not promise automatic benefit from effort alone—it insists that *proper* practice
  heals, while *improper* practice harms. This reflects the text''s underlying concern: these are potent techniques working
  with vital force (prāṇa), and precision matters as much as intention. The warning is not discouragement but calibration:
  the student must seek qualified guidance to avoid generating the very imbalances the practices aim to dissolve.



  Key Terms



  **Prāṇāyāma** — Regulation and extension of prāṇa (vital life-force) through controlled breathing; a foundational practice
  in haṭha yoga.

  **Prāṇa** — The vital energy or life-force that animates the body and mind; the object of regulation in yogic practice.



  Cross-Tradition Resonances



  **Hippocratic Corpus, ''On Ancient Medicine'':** Both texts emphasize that the same intervention—diet, breath, regimen—can
  heal or harm depending on precise application and individual constitution. Divergence: Hippocratic medicine grounds itself
  in empirical observation of humors; the Pradīpikā grounds itself in subtle energetic anatomy (nāḍī, cakra) not directly
  observable.


  **Aristotle, *Nicomachean Ethics* II.6 (on virtue as habit):** Both suggest that right action requires both knowledge of
  the correct form and repeated, careful practice—not mere intention. Divergence: Aristotle emphasizes habituation toward
  moral excellence; the Pradīpikā emphasizes precise technique to manipulate subtle physiology and consciousness.


  **Daoism, *Zhuangzi* (on useless trees):** Both traditions warn that forcing or misapplying natural processes leads to damage;
  alignment with proper method is essential. Divergence: Zhuangzi counsels non-action and spontaneity; the Pradīpikā prescribes
  systematic, disciplined technique under guidance.'
