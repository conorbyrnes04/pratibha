  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He of she feels neither heat, cold, pain, pleasure, respect nor disrespect. Such a Yogi or Yogini is absorbed
  in Samadhi.
abhyasa: 'Today, notice one moment when you feel pulled toward pleasure or pushed away from discomfort—physical, emotional,
  or social. Rather than acting on that pull, pause and observe: What remains aware of the sensation itself, without needing
  to change it? Rest there for a breath or two. This is a small taste of the equanimity the passage points toward.'
