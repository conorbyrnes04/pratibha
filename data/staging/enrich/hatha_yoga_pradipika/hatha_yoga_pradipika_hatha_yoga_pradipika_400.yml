unit_label: On Samādhi — 4.110
title: He of she feels neither heat, cold, pain, pleasure…
unit_type: verse
commentary: 'This passage describes the fruit of advanced yoga practice: a state of equanimity so complete that the practitioner
  transcends the ordinary polarities of sensation and social regard. The text suggests that samādhi—often translated as absorption
  or meditative union—is not a state of numbness but of freedom from reactivity to the pairs of opposites (dvandva) that ordinarily
  condition human experience. By naming both physical sensations and emotional/social ones together, the passage implies that
  yoga''s aim is not escape from the body but liberation from the mind''s habitual grasping and aversion.



  Key Terms



  **Samādhi** — A state of meditative absorption or union in which the mind is unified and free from the conditioning of dualistic
  experience; the culmination of yoga practice as presented in this text.

  **Dvandva (the pairs of opposites)** — Heat and cold, pleasure and pain, respect and disrespect—the fundamental dualities
  through which the unenlightened mind organizes experience and generates suffering.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.48 (yogastha kuru karmāṇi):** Both texts teach equanimity (samatva) as the mark of yoga—performing action
  without attachment to success or failure, remaining unmoved by pleasure and pain. Divergence: The Gītā emphasizes equanimity
  *in action* and duty; the Haṭha Yoga Pradīpikā describes a state of absorption *beyond* action.


  **Epictetus (Discourses): ''It is not things themselves that trouble us, but our judgments about them.'':** Both traditions
  locate freedom in the mind''s stance toward sensation and circumstance rather than in changing external conditions. Divergence:
  Epictetus teaches rational judgment and virtue; the Pradīpikā points to a pre-rational absorption that transcends judgment
  itself.


  **Dhammapada 63: ''The wise one is not moved by gain or loss.'':** Both describe the liberated person as unmoved by the
  dualities that drive ordinary beings—a mark of wisdom or enlightenment. Divergence: The Dhammapada emphasizes ethical conduct
  and insight; the Pradīpikā emphasizes psychosomatic practice (āsana, prāṇāyāma) as the path.'
