  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This hole is the generator of knowledge and is the source of the five streams (Ida, Pingala, &c.). In that colorless
  vacuum, Khechari Mudra should be established.
abhyasa: Sit quietly and bring attention to the space between the eyebrows or the roof of the palate. Without forcing or visualizing,
  simply notice the quality of emptiness or stillness there. Rest your awareness there for a few breaths, observing whether
  a sense of calm or clarity emerges from that 'colorless' space.
