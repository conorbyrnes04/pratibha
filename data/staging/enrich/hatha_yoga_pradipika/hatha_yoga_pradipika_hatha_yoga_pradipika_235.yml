title: It enters the Brahma Nadi, just like a serpent…
unit_type: verse
commentary: 'This verse describes the upward movement of vital energy (prāṇa) through the central channel (Brahma Nadi) when
  the root lock (Mula Bandha) is engaged, using the natural image of a serpent retreating into its burrow to convey effortless,
  instinctive ascent. The passage frames Mula Bandha not as mere muscular contraction but as a practice that redirects energy
  toward the highest center, making it essential for any serious practitioner regardless of gender. The simplicity of the
  instruction—''should always practice''—suggests this is foundational work, not advanced technique.



  Key Terms



  **Brahma Nadi** — The central energy channel running through the core of the body, through which prāṇa (vital life force)
  is directed in yogic practice.

  **Mula Bandha** — The root lock; an engagement of the pelvic floor and lower abdominal region used to contain and redirect
  prāṇa upward.



  Cross-Tradition Resonances



  **Katha Upanisad (II.3.6): ''The Self is smaller than the small, greater than the great. It is hidden in the heart of every
  creature.'':** Both passages locate transformative energy in an inner, hidden channel or space that must be accessed through
  disciplined practice. Divergence: The Upanisad emphasizes the Self''s transcendent nature; the Haṭha Yoga Pradīpikā focuses
  on the practical mechanics of directing prāṇa through bodily technique.


  **Tao Te Ching (15): ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their knowledge is
  unfathomable.'':** Both texts value the cultivation of subtle, invisible forces (prāṇa / Tao) through patient, humble practice
  rather than force. Divergence: The Tao Te Ching teaches non-action and naturalness; Haṭha Yoga prescribes specific, deliberate
  bodily practices to align with that subtlety.'
