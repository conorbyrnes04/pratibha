  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: It enters the Brahma Nadi, just like a serpent enters its hole. Therefore, the Yogi or Yogini should always practice
  this Mula Bandha.
abhyasa: Sit quietly and bring gentle awareness to the base of the spine. Without strain, imagine energy naturally gathering
  and rising upward through the center of your body, the way a serpent might move through a tunnel. Notice if this visualization
  alone shifts your sense of grounding or inner alignment. Return to this image in meditation when you wish to sense the vertical
  axis of your practice.
