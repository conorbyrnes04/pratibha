  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: A cord made of threads and about six inches long, should be passed through the passage of the nose and the end
  taken out in the mouth. This is called by adepts the Neti Karma.
abhyasa: Reflect on the relationship between the physical body and internal channels in your own experience. Where do you
  notice breath, sensation, or blockage in your nasal passages or throat? Without attempting the practice itself, sit quietly
  and observe the natural flow of breath through each nostril, noticing any asymmetry or ease. This simple observation honors
  the Pradīpikā's attention to the body as a field of practice.
