title: A cord made of threads and about six inches long…
unit_type: verse
commentary: 'This brief instruction describes Neti Karma, a cleansing practice that works directly with the nasal passages
  and the subtle channel system. The passage presents the technique matter-of-factly, as a named procedure (''called by adepts''),
  suggesting it is one among several recognized kriyas in the haṭha yoga toolkit. The simplicity of the instruction—a cord,
  a specific length, a clear path—reflects the Pradīpikā''s practical orientation: yoga is not merely philosophy but embodied
  technique, and the body''s passages are sites of both purification and subtle work.



  Key Terms



  **Neti Karma** — A cleansing action (karma) performed on the nasal passages (neti), traditionally using a cord or thread;
  one of several preparatory kriyas in haṭha yoga aimed at purifying the body''s channels.

  **Kriya** — A purificatory or energetic action; in haṭha yoga, kriyas prepare the body and nervous system for deeper prāṇāyāma
  and meditation work.



  Cross-Tradition Resonances



  **Yoga Sutras of Patañjali, II.43 (''sthira-sukham āsanam''):** Both texts ground yoga in concrete bodily practice as the
  foundation for higher states. The Pradīpikā''s detailed kriyas embody Patañjali''s principle that the body must be prepared
  and stable. Divergence: Patañjali emphasizes the mental fruit of āsana (steadiness and ease); the Pradīpikā foregrounds
  the technique itself and the purification of channels, suggesting a more elaborate physiological map.


  **Taoist internal alchemy texts (e.g., Secret of the Golden Flower):** Both traditions work with subtle channels and use
  specific physical techniques to clear and refine them; both see the body as a microcosm through which transformation occurs.
  Divergence: The Pradīpikā presents kriyas as preliminary purifications leading to samādhi; Taoist alchemy often frames channel
  work as itself the path to immortality or union, with less emphasis on a final transcendent state.'
