unit_label: On Samādhi — 4.108
title: The Yogi or Yogini, engaged in Samadhi, feels…
unit_type: verse
commentary: 'This passage describes samādhi as a state of radical sensory and self-aware cessation—not annihilation, but a
  suspension of the ordinary channels through which the mind knows itself and the world. The Pradīpikā presents this not as
  loss but as the yogin''s arrival at a threshold where the subject-object distinction dissolves. This state is the fruit
  of disciplined prāṇāyāma and mudrā practice, and the text treats it as the gateway to rāja yoga, where the mind''s true
  nature becomes visible.



  Key Terms



  **Samādhi** — A state of meditative absorption in which the ordinary distinction between perceiver and perceived dissolves;
  the culmination of yogic practice and gateway to direct knowledge of consciousness itself.

  **Yogin / Yogini** — A male or female practitioner of yoga; one engaged in systematic discipline of body, breath, and mind
  toward liberation.



  Cross-Tradition Resonances



  **Patañjali, Yoga Sūtra 1.2: ''Yoga is the cessation of the fluctuations of the mind.'':** Both texts treat yoga as a stilling
  of mental activity and sensory noise, leading to a state beyond ordinary consciousness. Divergence: Patañjali emphasizes
  mental fluctuation (vṛtti); the Pradīpikā emphasizes the sensory apparatus itself as what must be transcended.


  **Upaniṣad teaching: ''Neti neti'' (not this, not this)—the negation of all attributes to approach Brahman.:** Both use
  negation—the yogin feels *neither* smell, taste, etc.—as a method toward ultimate reality. Divergence: The Upaniṣads negate
  conceptually; the Pradīpikā describes a lived, embodied negation achieved through prāṇāyāma and practice.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both point to a state where
  the boundary between self and transcendent dissolves, and ordinary self-consciousness ceases. Divergence: Eckhart emphasizes
  union with the divine Other; the Pradīpikā describes a non-dual state prior to subject-object language.'
