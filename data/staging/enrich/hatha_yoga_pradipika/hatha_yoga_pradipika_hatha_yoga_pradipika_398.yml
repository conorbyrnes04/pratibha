  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Yogi or Yogini, engaged in Samadhi, feels neither smell, taste, color, touch, sound, nor is conscious of
  his or her own self.
abhyasa: 'Sit quietly for five minutes. Notice one sense at a time—smell, taste, touch, sound—without naming or judging what
  arises. Then, gently ask: *Who is noticing?* Do not answer; simply rest in the question. This simple inquiry mirrors the
  yogin''s inward turn toward the witness beyond sensation.'
