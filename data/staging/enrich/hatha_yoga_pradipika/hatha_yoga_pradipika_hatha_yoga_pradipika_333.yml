  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: If the Prana can be drawn into the Sunya (Susumna), which is between the Ida and the Pingala, and made motionless
  there, then the Khechari Mudra can truly become steady there.
abhyasa: Sit quietly and observe the natural flow of your breath through both nostrils. Without forcing, notice which side
  feels more open. Then, over several breaths, gently imagine the breath moving down the center of your body (not left or
  right), as if gathering into a single column. Hold this visualization for a few breaths, then release. This is a contemplative
  entry point to the concept of suṣumnā—not a substitute for formal practice, but an invitation to sense the difference between
  scattered and centered breath.
