title: The ten niyamas mentioned by those proficient in…
unit_type: verse
commentary: 'This passage lists the ten niyamas—ethical observances or inner disciplines—as the foundation for yoga practice.
  Rather than external rules, niyamas cultivate the inner soil from which genuine practice grows: austerity, forbearance,
  faith, generosity, devotion, study, modesty, discernment, and sacrifice. The text presents these not as burdensome commandments
  but as qualities that naturally align the practitioner''s mind and heart with the path toward samādhi.



  Key Terms



  **niyama** — Inner ethical observances or personal disciplines; the second limb of yoga practice, cultivating virtue and
  mental clarity

  **Tapa** — Austerity or disciplined heat; the burning away of impurities through focused effort and restraint

  **Yajna** — Sacrifice or ritual offering; here, the surrender of ego and attachment as part of spiritual practice



  Cross-Tradition Resonances



  **Yoga Sūtra 2.32 (Patañjali): the niyamas listed as śauca, santoṣa, tapas, svādhyāya, īśvara-praṇidhāna:** Both texts present
  niyama as foundational inner work preceding advanced practice; both emphasize study and devotion as pathways to clarity.
  Divergence: Patañjali''s list differs in content and order; the Pradīpikā includes charity and shame, which do not appear
  in the Sūtra''s enumeration.


  **Bhagavad Gītā 3.11 (Krishna on sacrifice): ''By sacrifice the gods thrive; by sacrifice you will thrive.'':** Both texts
  frame sacrifice (yajna) as a reciprocal principle—the practitioner''s offering creates alignment with cosmic order and inner
  transformation. Divergence: The Gītā emphasizes duty and action in the world; the Pradīpikā frames yajna as inner surrender
  within a contemplative path.


  **Dhammapada 183–185 (Buddha on virtue): virtue as the foundation for meditation and wisdom:** Both traditions recognize
  that ethical conduct and inner discipline precede and enable deeper states of mind; both see virtue as practical, not merely
  moral. Divergence: The Buddha emphasizes non-harm and mindfulness; the Pradīpikā includes devotion to God and austerity
  as central niyamas, reflecting theistic yoga philosophy.'
