abhyasa: Choose one niyama from the list that feels most distant or challenging for you today—perhaps charity, or hearing
  teachings. Spend ten minutes reflecting on how that quality might manifest in a single interaction or decision you face
  today. Notice what resistance or resonance arises, without judgment.
