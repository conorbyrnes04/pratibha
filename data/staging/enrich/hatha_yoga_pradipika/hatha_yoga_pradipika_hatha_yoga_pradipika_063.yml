commentary: 'Svātmārāma cites Goraksa (the legendary founder of haṭha yoga) to establish a foundational discipline of restraint
  and withdrawal. The passage does not advocate ascetic extremism but rather strategic avoidance—of corrupting influences
  (evil-minded company), physical shocks (fire, excessive travel), and practices that destabilize the body''s subtle energies
  before formal training begins. This restraint is preparatory: the body and mind must be stable and protected so that prāṇāyāma
  and other practices can work safely and effectively.



  Key Terms



  **haṭha yoga** — The yoga of force or effort; the systematic cultivation of bodily and energetic practices (āsana, prāṇāyāma,
  mudrā, bandha) as a foundation for meditation and liberation.

  **Goraksa** — Legendary haṭha yoga master and founder of the Nāth tradition; cited throughout the Pradīpikā as an authoritative
  voice on practice.



  Cross-Tradition Resonances



  **Bhagavad Gītā 6.11–12 (yoga discipline and withdrawal from sensory excess):** Both texts emphasize withdrawal from distraction
  and bodily excess as preparation for inner work; the yogi must create an island of stability. Divergence: The Gītā frames
  withdrawal within the context of duty and devotion; Svātmārāma''s passage is purely technical—focused on the body''s readiness
  for prāṇāyāma.


  **Patañjali''s Yoga Sūtra 2.32 (śauca, purity, as a foundational niyama):** Both traditions recognize that purity of environment
  and body precedes deeper practice; restraint is a prerequisite, not an end. Divergence: Patañjali emphasizes internal purity
  and self-discipline; Svātmārāma''s passage is more explicitly about external avoidance and protection.


  **Daoist texts (e.g., Zhuangzi) on wu wei and non-action as preparation:** Both suggest that forcing or over-exertion before
  readiness creates disorder; restraint allows natural unfolding. Divergence: Daoism emphasizes spontaneous non-action as
  a way of being; haṭha yoga''s restraint is a deliberate, temporary scaffolding for energetic work.'
