  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: As said by Goraksa, one should keep aloof from the society of the evil-minded, fire, travelling, early morning
  bath, fasting, and all kinds of bodily exertion.
abhyasa: Today, notice one habitual exposure—a conversation, a rushed morning, an unnecessary exertion—that scatters your
  attention or energy. Gently withdraw from it. Observe what steadiness or clarity emerges in that small space of restraint.
