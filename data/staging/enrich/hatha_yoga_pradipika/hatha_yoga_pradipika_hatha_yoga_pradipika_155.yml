  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Having confined it properly, it should be expelled through the Ida (left nostril). This destroys Vata, pitta
  (bile) and phlegm and increases the digestive power ( the gastric fire).
abhyasa: 'Today, observe one cycle of alternate-nostril breathing (nāḍī śodhana): inhale through the right nostril (Pingala),
  hold the breath gently for a few counts with awareness of the body''s center, then exhale fully through the left nostril
  (Ida). Repeat 5–10 times at an easy pace. Notice any shift in mental clarity or bodily sensation without forcing interpretation.'
