unit_label: On Prāṇāyāma — 2.86
title: Having confined it properly, it should be expelled…
unit_type: verse
commentary: 'This verse describes a foundational prāṇāyāma technique: inhaling through one nostril, retaining breath with
  controlled bandha, and exhaling through the other. The passage grounds yoga practice in the classical Ayurvedic physiology
  of the three doṣas (Vata, Pitta, Kapha), suggesting that breath regulation directly affects bodily humors and metabolic
  function. By ''confining'' and ''expelling'' breath methodically, the practitioner is said to restore balance and strengthen
  agni (digestive fire)—linking internal breath work to tangible health outcomes, not merely abstract states.



  Key Terms



  **Ida** — The left energy channel (nāḍī) in yogic anatomy, traditionally associated with lunar, cooling, and receptive qualities;
  here the exit point for exhaled breath.

  **Vata, Pitta, Kapha** — The three doṣas (constitutional principles) in Ayurvedic medicine; Vata (air/space), Pitta (fire/water),
  and Kapha (water/earth). Their balance is considered essential to health.

  **Agni** — Fire; in this context, the digestive fire or metabolic capacity (jāṭharāgni) that processes food and sustains
  vitality.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle…'':** Both traditions emphasize subtle regulation
  of inner forces (breath/qi) to restore natural balance and health; the Taoist sage and the yogin cultivate non-force. Divergence:
  The Haṭha Yoga Pradīpikā grounds practice in explicit anatomical and humoral theory (doṣas), whereas the Tao Te Ching speaks
  of balance through paradox and emptiness, without naming bodily systems.


  **Hippocratic corpus (classical Western medicine): balance of the four humours:** Both systems posit that health arises
  from equilibrium among bodily principles and that breath or air plays a regulatory role in maintaining that balance. Divergence:
  Ayurveda and the Haṭha Yoga Pradīpikā offer *techniques* (prāṇāyāma) to rebalance the doṣas; Hippocratic medicine typically
  prescribed diet, bloodletting, or purgation, not breath work.


  **Aristotle, *De Anima*: pneuma (breath/spirit) as the vital principle:** Both traditions recognize breath as a carrier
  of life-force and a means of influencing the body''s inner states. Divergence: Aristotle treats pneuma as a natural-philosophical
  principle; the Haṭha Yoga Pradīpikā treats prāṇa as a manipulable force within a mapped system of channels and locks.'
