  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This sleeping she-serpent should be awakened by catching hold of her tail. By the force of Hatha, the Sakti leaves
  her sleep, and starts upwards.
abhyasa: Sit quietly and place your awareness at the base of your spine. Without forcing, notice the quality of aliveness
  or heaviness there. Breathe slowly and deeply for five minutes, imagining each exhale as a gentle invitation to that sleeping
  energy to stir and rise. This is contemplation, not technique—a way to sense the passage's teaching that our own vital force
  awaits awakening.
