  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: The Padma âsana consists in crossing the feet and placing them on both the thighs; it is the destroyer of all
  sins.
abhyasa: Sit comfortably today and, if accessible to your body, move into lotus pose or a comfortable cross-legged seat. Rather
  than striving for the form, notice the quality of stillness and groundedness the posture invites. Sit for 3–5 minutes and
  observe whether a sense of settling or release arises—not as 'sin-destruction' but as a quiet return to center.
