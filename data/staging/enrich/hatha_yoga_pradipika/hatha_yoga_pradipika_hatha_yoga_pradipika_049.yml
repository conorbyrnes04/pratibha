  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This is called the Padmâsana, the destroyer of all diseases. It is difficult of attainment by everybody, but
  can be learnt by intelligent people in this world.
abhyasa: Sit quietly and observe your natural seated posture today. Without forcing, notice where tension or ease lives in
  your hips, spine, and breath. This simple noticing—the beginning of intelligent attention to the body—is the first step
  toward any āsana practice.
