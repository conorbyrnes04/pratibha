abhyasa: 'When you encounter a teaching or practice that seems distant or abstract, pause and ask: Who has walked this path
  before me? Bring to mind one teacher, ancestor, or exemplar whose life or work makes the teaching feel real and possible.
  Let their presence steady your own effort.'
