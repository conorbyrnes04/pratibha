  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: It removes dyspepsia, increases appetite and digestion, and is like the goddess of creation, and causes all happiness.
  It dries up all the disorders. This is an excellent exercise in Hatha Yoga.
abhyasa: 'Observe your own digestion and energy today—notice when you feel sluggish or clear. Without forcing anything, ask:
  where in my body do I sense the flow of life-force most readily? Sit quietly for a few breaths and simply attend to that
  place, without judgment.'
