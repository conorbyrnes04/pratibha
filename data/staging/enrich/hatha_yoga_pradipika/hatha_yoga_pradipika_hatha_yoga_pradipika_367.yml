  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Perpetual Happiness is achieved by this; I do not care if the mukti be not attained. This happiness, resulting
  from absorption (in Brama), is obtained by means of Raja-Yoga.
abhyasa: Sit quietly today and notice moments when you are fully absorbed in an activity—breath, sound, or sensation—without
  grasping for an outcome. Rest there briefly. Observe whether the absorption itself contains a quality of ease or contentment,
  separate from any goal you imagined.
