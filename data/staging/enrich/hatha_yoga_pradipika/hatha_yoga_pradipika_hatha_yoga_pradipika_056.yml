  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Place the heels on either side of the seam of the Perineum, keeping the left heel on the left side and the right
  one on the right side, holding the feet firmly joined to one another with both the hands. This Bhadrâsana is the destroyer
  of all diseases.
abhyasa: 'Sit upright on the floor. Draw both heels toward your body, pressing them gently into the inner thighs or perineal
  area, with feet joined. Hold your feet or ankles with your hands, drawing the spine upright. Breathe naturally and observe:
  what sensations arise in the lower body and spine? What steadiness or ease emerges? Sit for 1–2 minutes without strain,
  noting how postural alignment affects your breath and attention.'
