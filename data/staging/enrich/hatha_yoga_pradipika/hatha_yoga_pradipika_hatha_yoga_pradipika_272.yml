title: This she-serpent is situated in Muladhar
unit_type: verse
commentary: 'This verse addresses kuṇḍalinī—the dormant spiritual energy traditionally visualized as a coiled serpent at the
  base of the spine—and prescribes a specific prāṇāyāma practice to awaken and move it. The instruction to ''catch and move''
  her daily through controlled breath via the right channel (Piṅgalā) using the Paridhāna method suggests that haṭha yoga
  treats prāṇic cultivation as both a physical and subtle-energetic discipline. The precision of timing (morning and evening,
  1½ hours each) reflects the text''s practical, methodical approach: awakening kuṇḍalinī is not spontaneous grace but disciplined,
  rhythmic work.



  Key Terms



  **kuṇḍalinī** — The dormant spiritual energy traditionally envisioned as a coiled serpent at Mūlādhāra (the base energy
  center); awakened and directed upward through yogic practice.

  **Piṅgalā** — The right energy channel (nāḍī) associated with solar, heating, and active prāṇic qualities; one of the three
  principal channels in subtle anatomy.

  **prāṇāyāma** — Regulation and extension of breath and vital energy through controlled breathing techniques; a foundational
  practice in haṭha yoga.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.12–14 (Patañjali): ''Practice becomes firmly grounded when attended to for a long time, without interruption,
  and with sincere devotion.'':** Both texts emphasize regularity and discipline—the Pradīpikā''s ''daily, morning and evening''
  mirrors Patañjali''s insistence on unbroken, devoted practice as the foundation for transformation. Divergence: The Yoga
  Sūtra frames practice abstractly as mental discipline (abhyāsa); the Pradīpikā grounds it in concrete prāṇic and anatomical
  work, making the body itself the instrument of awakening.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their knowledge is
  unfathomable.'':** Both traditions honor a hidden, subtle dimension of practice—the Tao''s ''unfathomable depth'' parallels
  the Pradīpikā''s focus on invisible energy channels and the serpent''s coiled potential. Divergence: The Tao Te Ching counsels
  wu-wei (non-action); the Pradīpikā prescribes vigorous, methodical technique—moving the serpent ''daily'' requires active,
  disciplined effort, not receptive yielding.


  **Heraclitus, Fragment 12: ''All things flow; nothing abides.'':** The Pradīpikā''s emphasis on moving prāṇa through channels
  reflects a dynamic, flowing cosmos—energy is not static but must be circulated and directed. Divergence: Heraclitus speaks
  of universal flux as the fundamental nature of reality; the Pradīpikā treats flow as something to be *controlled* and *directed*
  through technique, implying a will that shapes prāṇic movement.'
