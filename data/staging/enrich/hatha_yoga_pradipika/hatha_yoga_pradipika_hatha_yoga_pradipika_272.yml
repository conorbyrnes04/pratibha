  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: This she-serpent is situated in Muladhar. She should be caught and moved daily, morning and evening, for 1/2
  a prahar (1 1/2 hours), by filling with air through Pingala by the Paridhana method.
abhyasa: Sit comfortably and observe your natural breath for a few minutes. Notice the quality of your inhalation and exhalation—which
  feels fuller, warmer, more active? This simple awareness honors the text's concern with prāṇa (vital energy) and the channels
  through which it flows, without requiring esoteric visualization. Return to this observation daily as a threshold to understanding
  why the Pradīpikā emphasizes breath regulation.
