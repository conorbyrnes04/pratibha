  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Now I will describe a regular method of attaining to Samadhi, which destroys death, is the means for obtaining
  happiness, and gives the Brahmananda.
abhyasa: Sit quietly and reflect on what 'death' means to you—not only physical death, but the small deaths of habit, fear,
  and fragmentation. Notice where you feel most alive and unified. Let this contemplation orient your practice today, whatever
  form it takes, toward that integration rather than mere technique.
