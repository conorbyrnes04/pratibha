  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: He or she who knows the Kechari Mudra, is not troubled by diseases, is not stained with karmas, and is not snared
  by time.
abhyasa: Sit quietly and notice the natural resting place of your tongue in your mouth. Without forcing or straining, become
  aware of the subtle sensations there—texture, temperature, subtle movement. Observe how attention itself changes the felt
  sense of the body. This simple awareness is an entry point to understanding how precise internal attention, cultivated through
  practice, might reshape one's relationship to the body and time.
