title: As in the above (Sitkari), the tongue to be…
unit_type: verse
commentary: 'This passage describes a specific prāṇāyāma technique—a controlled breathing practice where inhalation occurs
  through the mouth (with the tongue slightly extended) and exhalation through the nostrils. The instruction emphasizes precision
  in the mechanics of breath: the deliberate positioning of the tongue, the retention phase (''kept confined''), and the slow,
  measured release. Such technical specificity reflects the Haṭha Yoga Pradīpikā''s core teaching: that mastery of the breath
  is a direct means to steady the mind and prepare for deeper meditative states.



  Key Terms



  **prāṇāyāma** — Regulation and extension of vital breath (prāṇa) through controlled breathing practices; a foundational
  limb of haṭha yoga.

  **Sitkari** — A prāṇāyāma technique (referenced here as a parallel) involving inhalation through the teeth or mouth, traditionally
  used to cool the body and calm the mind.



  Cross-Tradition Resonances



  **Yoga Sūtra 1.34 (Patañjali): ''Or, by the exhalation and retention of breath'':** Both texts recognize breath regulation
  as a direct path to mental steadiness and meditative absorption. Divergence: The Yoga Sūtra speaks of breath practice in
  abstract terms as one among many methods; the Haṭha Yoga Pradīpikā provides concrete anatomical and technical detail.


  **Tao Te Ching 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their knowledge is
  unfathomable.'':** Both traditions emphasize refinement and subtlety—the mastery of small, precise movements as a gateway
  to deeper understanding. Divergence: The Haṭha text is prescriptive and technical; the Taoist verse is aphoristic and poetic,
  valuing mystery over method.'
