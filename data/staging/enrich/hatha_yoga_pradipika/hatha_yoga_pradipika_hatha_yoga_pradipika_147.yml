  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: As in the above (Sitkari), the tongue to be protruded a little out of the lips, when the air is drawn in. It
  is kept confined, as before, and then expelled slowly through the nostrils.
abhyasa: 'Today, sit comfortably and practice one round of this technique: extend your tongue slightly beyond your lips, inhale
  slowly and deliberately through your mouth, hold the breath gently for a few counts, then exhale slowly through your nostrils.
  Notice the quality of attention required—how the precise positioning of the tongue and the deliberate pacing of breath anchor
  your awareness in the present moment.'
