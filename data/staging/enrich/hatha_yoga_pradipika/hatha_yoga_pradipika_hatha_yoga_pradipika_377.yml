  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Leaving the loudest, taking up the subtle one, and leaving the subtle one, taking up the loudest, thus practicing,
  the distracted mind does not wander elsewhere.
abhyasa: Sit quietly for five minutes. Breathe naturally and notice the *loud* breath—the sound of air moving through your
  nostrils or throat. Then shift your attention to the *subtle* breath—the slight coolness at the nostrils, or the gentle
  expansion of the belly. Alternate between these two focal points every 10–15 breaths. Observe whether this switching keeps
  your mind more present than trying to hold a single point.
