  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Mind is the master of the senses, and the breath is the master of the mind. The breath in its turn is subordinate
  to the laya (absorption), and that laya depends on the nada.
abhyasa: 'Sit quietly and observe your breath for five minutes without controlling it. Notice how your mind follows the rhythm
  of your breathing—how a held breath tightens thought, how a smooth breath softens it. Then gently lengthen your exhale slightly
  and listen inwardly for any subtle vibration or hum beneath the breath''s movement. This simple observation honors the hierarchy
  described: senses → mind → breath → the subtler current beneath.'
