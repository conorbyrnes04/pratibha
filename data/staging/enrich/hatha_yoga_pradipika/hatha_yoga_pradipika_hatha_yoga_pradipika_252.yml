commentary: 'This verse describes a specific prāṇāyāma technique involving controlled breath directed through a particular
  bodily channel, part of the haṭha yoga system''s detailed mapping of subtle and gross anatomy. The instruction assumes a
  trained practitioner working under guidance, reflecting the text''s emphasis that these practices require proper transmission
  and individual adaptation. The mechanical precision (''slowly,'' ''by means of a pipe'') reflects haṭha yoga''s characteristic
  marriage of anatomical specificity with energetic intention.



  Key Terms



  **prāṇāyāma** — Regulation and direction of vital breath (prāṇa) through specific techniques; one of the eight limbs of
  yoga and central to haṭha practice

  **haṭha** — Literally ''force'' or ''effort''; the yoga of physical postures, breath control, and energy locks aimed at
  preparing the body-mind for higher states



  Cross-Tradition Resonances



  **Yoga Sūtra 2.49 (Patañjali):** Both texts treat breath control (prāṇāyāma) as a systematic practice with precise technique,
  not mere breathing. Divergence: Patañjali emphasizes prāṇāyāma as a step toward mental steadiness; the Pradīpikā foregrounds
  the manipulation of subtle channels and bodily passages as its own sophisticated science.


  **Taoist internal alchemy texts (e.g., *Secret of the Golden Flower*):** Both traditions map breath and vital energy through
  specific bodily conduits and prescribe controlled techniques to circulate them. Divergence: Haṭha yoga locates practice
  in anatomical channels (nāḍī) and specific organs; Taoism emphasizes cosmological correspondence and the refinement of jing
  (essence) into qi into shen (spirit).'
