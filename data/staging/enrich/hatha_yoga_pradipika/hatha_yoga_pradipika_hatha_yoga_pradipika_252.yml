  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: By means of a pipe, one should blow air slowly into the passage in the male organ. [Urethra.]
abhyasa: Sit quietly and observe your natural breath without manipulation. Notice where breath naturally flows in your body—nostrils,
  throat, chest. This observation itself is a foundation; do not attempt the technique described without qualified instruction,
  but use this moment to recognize that haṭha yoga treats breath as both physical phenomenon and subtle force.
