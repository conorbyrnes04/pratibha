  cultural_context: The Haṭha Yoga Pradīpikā, compiled by Svātmārāma (15th c.), is a foundational manual of haṭha yoga — āsana,
    prāṇāyāma, mudrā, and samādhi — presented as a ladder to rāja yoga. The practices (especially prāṇāyāma, kriyā, and bandha)
    are traditionally learned under a qualified teacher; offered here as a study reading, not an instruction manual.
translation: Just as a bee, drinking sweet juice, does not care for the smell of the flower; so the mind, absorbed in the
  nada, does not desire the objects of enjoyment.
abhyasa: Sit quietly for five minutes. Notice one sound—whether external (wind, traffic) or internal (breath, heartbeat, a
  subtle hum). Return attention to that sound each time the mind wanders to a desire or worry. Observe whether the quality
  of wanting shifts when attention is truly held.
