title: Just as a bee, drinking sweet juice, does not care…
unit_type: verse
commentary: 'This verse uses the bee''s single-pointed focus on nectar to illustrate how the mind, when absorbed in *nāda*
  (the inner sound or vibration), naturally loses interest in sensory objects. The comparison suggests that concentration
  itself—not renunciation or willpower—dissolves craving. The passage implies that the practices of haṭha yoga redirect attention
  inward to such effect that external desires simply cease to compel.



  Key Terms



  **nāda** — The inner sound or vibration; in haṭha yoga, an object of meditation and a sign of prāṇic absorption; sometimes
  called the ''unstruck sound'' (anāhata nāda).

  **haṭha yoga** — The yoga of force or effort; the system of physical postures, breath control, and energy locks aimed at
  purifying the body and preparing the mind for meditation and liberation.



  Cross-Tradition Resonances



  **Bhagavad Gītā 2.59:** Both teach that sense objects lose their power over the mind when consciousness is fixed elsewhere—here
  on the Divine, there on nāda. The mechanism is withdrawal of attention, not suppression. Divergence: The Gītā frames this
  in terms of devotion and wisdom; the Pradīpikā locates it in a specific sonic or vibrational practice.


  **Patañjali''s Yoga Sūtra 1.12 (abhyāsa-vairāgya):** Both suggest that dispassion (*vairāgya*) arises naturally from sustained
  practice (*abhyāsa*), not from moral effort. The bee does not *decide* to ignore the flower. Divergence: Patañjali emphasizes
  the dual path of practice and non-attachment as abstract principles; the Pradīpikā grounds it in a concrete sensory anchor
  (nāda).


  **Meister Eckhart: ''When the soul is empty of all things, it is transformed into God'':** Both suggest that filling consciousness
  with one thing (nāda, or divine presence) empties it of many others. Absorption replaces desire. Divergence: Eckhart emphasizes
  emptiness and union with the transcendent; the Pradīpikā emphasizes the practice of listening inward and the natural consequence
  of that listening.'
