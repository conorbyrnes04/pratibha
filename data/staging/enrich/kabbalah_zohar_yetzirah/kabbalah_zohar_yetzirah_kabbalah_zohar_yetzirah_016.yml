abhyasa: 'Today, select one Hebrew letter (or, if unfamiliar with Hebrew, one letter of your alphabet). Sit quietly and consider:
  what combinations, meanings, and relationships does this single element make possible? How does it ''enter'' into other
  letters to create new forms? Notice how one simple thing, in relation, generates multiplicity.'
