title: Second, from the Spirit he made Air and formed…
unit_type: verse
commentary: 'This passage presents the Hebrew alphabet as a cosmological architecture: the twenty-two letters emerge from
  primordial Spirit (Ruach) and become the instruments of creation through speech. The threefold division—mothers (Aleph,
  Mem, Shin), doubles (seven letters with dual phonetic values), and singles—suggests that language itself is structured in
  graduated layers of potency, with Spirit remaining the foundational, unmanifest source. The passage claims that before any
  letter exists, Spirit *is*; letters are its articulation, not its origin.



  Key Terms



  **Ruach (Spirit)** — In this passage, the primordial, formless source from which the letters and all speech emerge; the
  foundational principle prior to manifestation.

  **Mothers (Aleph, Mem, Shin)** — The three primary Hebrew letters from which, in Kabbalistic cosmology, the elemental forces
  are said to unfold.



  Cross-Tradition Resonances



  **Tao Te Ching, opening verses (''The Tao that can be named is not the eternal Tao''):** Both texts posit an unnameable,
  prior principle (Tao / Ruach) from which all manifest forms—including language—emerge. Divergence: The Sefer Yetzirah treats
  the letters as *necessary* instruments of creation and knowledge, whereas the Tao Te Ching warns that naming and form obscure
  the ultimate reality.


  **Genesis 1:3 (''And God said, Let there be light''):** Both passages locate creative power in speech and divine utterance;
  the word is the medium of becoming. Divergence: Genesis emphasizes the *command* and its immediate effect, while Sefer Yetzirah
  emphasizes the *structure* and graduated potency of the letters themselves.


  **Heraclitus, Fragment 50 (''All things flow; the Logos is common''):** Both suggest an underlying rational principle (Logos
  / Spirit) that orders and connects all manifestation through language and form. Divergence: Heraclitus stresses flux and
  opposition; Sefer Yetzirah stresses the stable, archetypal structure of the letters as a map of creation.'
