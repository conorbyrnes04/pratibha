abhyasa: 'Sit quietly and attend to your breath. As you inhale, silently sound the Hebrew letter Aleph (א); as you exhale,
  Mem (מ); then Shin (ש). Do this for five minutes, noticing how these ''mother'' letters seem to carry the basic movements
  of air, water, and fire within your own breath. Afterward, reflect: what is the silence before speech?'
