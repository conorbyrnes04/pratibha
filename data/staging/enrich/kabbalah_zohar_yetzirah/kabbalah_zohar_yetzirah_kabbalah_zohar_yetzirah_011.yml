title: He selected three letters from the simple ones…
unit_type: verse
commentary: 'This passage describes a foundational act of divine creation through language: God selects three letters (Yod,
  Heh, Vav—the core of the Tetragrammaton, the four-letter Name) and uses them to seal both the divine Name itself and the
  six directions of space. The passage suggests that the letters are not merely symbols but active forces through which reality
  is structured and held. The ''sealing'' implies both completion and protection—the Name and the cosmos are bound together
  through the same linguistic-mystical principle.



  Key Terms



  **Yod, Heh, Vav (I, H, V)** — Three of the four letters of the Tetragrammaton (the divine Name); here presented as the ''simple''
  or primal letters through which creation is sealed.

  **Six directions** — The six dimensions of space (north, south, east, west, up, down) through which the universe is structured
  and bounded.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 1: ''The Tao that can be named is not the eternal Tao'':** Both passages suggest that ultimate reality
  is accessed through language and naming, yet remains beyond ordinary speech. Divergence: The Tao Te Ching warns against
  naming; Sefer Yetzirah presents the divine Name as the very instrument of creation and order.


  **Genesis 1:1–3: ''In the beginning God created the heavens and the earth... And God said, Let there be light'':** Both
  texts root creation in divine speech and the power of utterance. Divergence: Genesis emphasizes sequential acts of creation;
  this passage presents the letters themselves as the sealed, simultaneous structure of Name and cosmos.


  **Heraclitus, Fragment 50: ''All things flow according to Logos'':** Both suggest an underlying rational or linguistic principle
  ordering reality. Divergence: Heraclitus speaks of flux and becoming; this passage emphasizes sealing and fixity—the letters
  hold and contain.'
