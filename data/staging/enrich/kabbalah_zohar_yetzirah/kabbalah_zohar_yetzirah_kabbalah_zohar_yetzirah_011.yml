abhyasa: Sit quietly and consider one direction (north, south, east, west, above, below). Reflect on how that direction is
  present in your own body and awareness right now. Then silently hold the three letters Yod-Heh-Vav (Y-H-V) in mind without
  forcing meaning—simply as a sound-shape. Notice what arises.
