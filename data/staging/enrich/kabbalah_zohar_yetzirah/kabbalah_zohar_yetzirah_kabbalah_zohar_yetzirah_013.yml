unit_label: The foundations are the twenty-two letters…
title: The foundations are the twenty-two letters…
unit_type: verse
commentary: 'This passage presents the Kabbalistic architecture of creation through language itself: the Hebrew alphabet is
  not merely a writing system but a structural map of reality, divided into three categories of increasing specificity. The
  ''mothers'' (aleph, mem, shin) represent primordial forces; the ''doubles'' (bet, gimel, daleth, kaph, pe, resh, tav) embody
  dynamic polarities; the ''singles'' express particular manifestations. By grounding cosmology in the letters, the text suggests
  that creation unfolds through differentiation—from undivided potential through paired opposites into multiplicity.



  Key Terms



  **mothers (אמות)** — The three primary Hebrew letters (aleph, mem, shin) representing fundamental elemental or cosmic forces
  from which other letters and manifestations arise.

  **doubles (כפולות)** — Seven Hebrew letters that embody paired or polarized qualities—capable of expressing both active
  and passive, hard and soft states.

  **single letters (פשוטות)** — Twelve Hebrew letters representing distinct, non-polarized expressions or attributes, often
  associated with the twelve months or tribes.



  Cross-Tradition Resonances



  **Tao Te Ching, opening: ''The Tao that can be named is not the eternal Tao.'':** Both texts treat language and naming as
  a threshold between the formless and the manifest; letters/words are the first differentiation of what cannot be directly
  spoken. Divergence: The Sefer Yetzirah affirms the letters as *generative* and structural, not as a limitation on the ineffable—they
  are the *means* of creation, not its veil.


  **Heraclitus, Fragment 50: ''All things flow; nothing abides.'':** The division into mothers, doubles, and singles mirrors
  a cosmology of dynamic process—forces in relation, not static essences. Divergence: Heraclitus emphasizes flux and contradiction;
  Kabbalistic letters suggest an ordered, intelligible structure underlying change.


  **Genesis 1:3, ''And God said, Let there be light''—creation through utterance.:** Both root creation in speech and divine
  language; the letters are the *substance* through which God''s will becomes world. Divergence: Genesis emphasizes command
  and obedience; Sefer Yetzirah treats the letters as intrinsic cosmic principles, not merely instruments of will.'
