title: The ten numbers formed from nothing are the…
unit_type: verse
commentary: 'This passage grounds the abstract metaphysical structure of the Decad (ten Sephiroth) in the human body and covenant
  practice. The fingers become a living map of divine emanation, and the two covenants—one of speech (the word, the logos),
  one of flesh (circumcision)—are presented as parallel expressions of the same sacred relationship between the infinite and
  the embodied. The passage suggests that mystical knowledge is not merely intellectual but inscribed in both voice and body.



  Key Terms



  **Decad** — The ten numbers or Sephiroth; the foundational emanations from which all existence unfolds in Kabbalistic cosmology.

  **Covenant by voice spiritual** — The bond between the divine and human expressed through speech and the word; the realm
  of utterance and meaning.

  **Rite of Circumcision, corporeal** — The physical covenant of Abraham; the marking of the body as a sign of sacred relationship
  and commitment.



  Cross-Tradition Resonances



  **Tao Te Ching, verse 1: ''The Tao that can be spoken is not the eternal Tao.'':** Both passages honor the tension between
  the unspeakable source and its expression through language and form. Divergence: The Tao Te Ching suggests speech obscures
  the ultimate; this passage suggests speech (spiritual covenant) *reveals* it alongside embodied practice.


  **Genesis 17:11 (Abraham''s covenant): ''And ye shall circumcise the flesh of your foreskin; and it shall be a token of
  the covenant betwixt me and you.'':** Both texts present circumcision as a bodily sign of divine covenant, grounding the
  sacred in flesh. Divergence: The biblical passage emphasizes obedience and sign; this passage integrates it into a cosmological
  system where the body mirrors the ten emanations.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both suggest that the human
  form and faculties are not separate from the divine but are expressions of it. Divergence: Eckhart emphasizes mystical union
  through vision; this passage emphasizes structural correspondence through number, voice, and covenant.'
