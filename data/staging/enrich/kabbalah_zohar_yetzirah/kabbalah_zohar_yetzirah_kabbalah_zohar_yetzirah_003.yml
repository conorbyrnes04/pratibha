translation: 'The ten numbers formed from nothing are the Decad: these are seen in the fingers of the hands, five on one,
  five on the other, and over them is the Covenant by voice spiritual, and the rite of Circumcision, corporeal (as of Abraham).'
abhyasa: 'Today, hold your hands before you with palms open. Notice the ten fingers as a mirror of the ten numbers from which
  all emerges. Speak aloud a single word of intention or prayer, feeling it as the ''covenant by voice spiritual.'' Then rest
  your hands on your lap, acknowledging the body as a vessel of covenant. This simple act invites you to experience the passage''s
  claim: that the infinite is not distant, but present in your own form.'
