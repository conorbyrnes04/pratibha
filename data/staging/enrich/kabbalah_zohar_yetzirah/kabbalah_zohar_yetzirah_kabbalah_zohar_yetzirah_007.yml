translation: 'These ten Sephiroth which are, moreover, ineffable, have their end even as their beginning, conjoined, even
  as is a flame to a burning coal: for our God is superlative in his unity, and does not permit any second one.'
abhyasa: Sit quietly and hold the image of a flame and its coal. Notice how you cannot truly separate them—the flame *is*
  the coal's energy made visible. Let this image rest in your mind as you consider one area of your life where you perceive
  separation or conflict. Can you sense an underlying unity beneath the apparent division?
