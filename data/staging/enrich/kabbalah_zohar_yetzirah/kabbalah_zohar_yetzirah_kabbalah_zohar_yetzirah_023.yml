title: There were formed seven double letters, Beth…
unit_type: verse
commentary: 'The Sefer Yetzirah presents the Hebrew letters not merely as signs but as generative forces in creation. The
  seven ''double letters'' each possess a duality—a hard and soft pronunciation—mirroring the principle that creation itself
  operates through paired opposites (mercy and severity, expansion and contraction). This passage suggests that language and
  sound are not arbitrary but structurally embedded in the cosmos; the letters are instruments through which divine creative
  potential manifests into form.



  Key Terms



  **double letters** — In Sefer Yetzirah, seven Hebrew letters that can be pronounced in two ways (hard/aspirated or soft/unaspirated),
  representing duality and creative polarity in the structure of creation.

  **aspirated / softened** — The two phonetic modes of the double letters; the hard (aspirated) and gentle (softened) expressions
  of the same letter''s essential nature.



  Cross-Tradition Resonances



  **Tao Te Ching, Ch. 42: ''The Tao begat one; one begat two; two begat three; three begat all things.'':** Both texts ground
  creation in multiplicity emerging from unity through paired principles. The Sefer Yetzirah''s duality in each letter echoes
  the Taoist emergence of the ten thousand things through complementary forces. Divergence: The Tao Te Ching emphasizes flow
  and non-action (wu wei), while the Sefer Yetzirah presents letters as deliberate, structured instruments of divine speech
  and formation.


  **Heraclitus, Fragment 8: ''Opposition brings concord. Out of discord comes the fairest harmony.'':** Both recognize that
  opposing forces (hard/soft, tension/release) are not flaws but essential to coherence and meaning. Divergence: Heraclitus
  speaks of universal flux and strife as eternal; the Sefer Yetzirah treats duality as a structural principle embedded in
  language and creation by divine wisdom, more architectonic than fluid.


  **Genesis 1:3: ''And God said, Let there be light; and there was light.'':** Both traditions hold that creation occurs through
  utterance—divine speech brings worlds into being. The Sefer Yetzirah extends this: the letters themselves are the mechanism.
  Divergence: Genesis emphasizes the command and its immediate manifestation; Sefer Yetzirah explores the internal structure
  and duality of the letters as the means by which speech creates.'
