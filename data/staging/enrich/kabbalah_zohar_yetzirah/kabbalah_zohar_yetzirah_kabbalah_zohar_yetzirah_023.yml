abhyasa: 'Today, slowly pronounce one of these seven letters (Beth, Gimel, Daleth, Kaph, Pe, Resh, or Tau) in both its hard
  and soft forms. Notice how the same letter contains two distinct energies. Sit with the question: Where in my own life do
  I contain opposing qualities that are both necessary?'
