section: V.1.1
sanskrit_devanagari: Ἐκεῖθεν ἡ οὐσία πᾶσα καὶ ἡ δύναμις· ἐκεῖθεν καὶ τὸ νοητὸν καὶ τὸ αἰσθητόν. (Ekeithen hē ousia pasa kai
  hē dynamis; ekeithen kai to noēton kai to aisthēton.)
sanskrit_iast: ''
translation_literal: From the One proceeds all substance and all power; from it come both the intelligible realm and the sensible.
  The One is not diminished by what flows from it, as a light is not diminished by the light it radiates. All things remain
  in their source while also proceeding from it, as the circle's radii remain in the center while extending outward.
commentary: 'This passage crystallizes Plotinus''s cardinal doctrine of emanation (prohodos), distinguishing it sharply from
  creation ex nihilo. The One does not act by will or deliberation but overflows necessarily, as the sun radiates light. Crucially,
  emanation entails no loss to the source—the One remains transcendent and undivided. The metaphor of light and the concentric
  circle illustrate how multiplicity arises from absolute unity without rupture or diminishment. This resolves the Neoplatonic
  problem: how can the utterly simple One generate the many? Answer: by an eternal, effortless procession that preserves both
  the One''s transcendence and the reality of the emanated orders (Intellect, Soul, Nature). The doctrine underwrites Plotinus''s
  entire metaphysics and soteriology.'
practice: 'Sit in stillness and imagine a point of infinite light—the One. Without effort or intention, light radiates outward
  in concentric circles: first the intelligible realm (Intellect), then Soul, then the sensible cosmos. Now reverse: trace
  each circle inward toward the center, releasing attachment to form and multiplicity. Rest in the luminous point itself—not
  as object but as the source from which your own consciousness emanates. Dwell there without grasping. Return slowly, carrying
  the sense that all you perceive remains eternally rooted in that undivided source.'
