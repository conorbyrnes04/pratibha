title: Beauty as the Radiance of the One
unit_type: verse
section: I.6.1-2
sanskrit_devanagari: Τί οὖν τὸ καλόν; Ἀρχὴ μὲν καὶ αἴτιον τῆς ἐπιστροφῆς πρὸς αὐτό. Ὁ νοῦς γὰρ ἀπὸ τοῦ ἑνὸς ἐκλάμπει, καὶ
  τὸ κάλλος ἐν τῇ ἐκλάμψει τούτῃ ὑπάρχει.
sanskrit_iast: ''
translation_literal: What then is Beauty? It is the principle and cause of our turning toward it. For intellect (nous) radiates
  from the One, and beauty subsists in this radiance. When the soul perceives beauty in sensible form, it recognizes therein
  the trace of that intelligible radiance from which all things emanate. The beautiful object is beautiful not by its matter
  but by the form that shines through it—a form that is itself an emanation from the divine principle.
commentary: 'This passage establishes Plotinus''s foundational aesthetics: beauty is not intrinsic to matter but is the visible
  imprint of intelligible reality. The One, utterly transcendent and formless, emanates nous (divine intellect), which in
  turn generates the World-Soul and material forms. Beauty perceived in the sensible world is the soul''s recognition of its
  own source. Crucially, beauty functions soteriologically—it awakens the soul to its divine origin and initiates the return
  (epistrophē) to the One. This reverses Platonic dualism: the sensible beautiful is not a mere shadow but a genuine theophany,
  a manifestation of transcendent reality. The doctrine avoids both materialism and world-negation, grounding aesthetic experience
  in metaphysical necessity.'
practice: Sit in stillness before a natural object of beauty—a flower, stone, or shaft of light. Do not analyze its form.
  Instead, allow your gaze to soften; perceive the radiance that animates it, the 'shining-through' that makes it beautiful
  rather than its material composition. Notice the quieting of discursive thought and the gentle upward turning of attention.
  Hold this state without grasping. This is the soul recognizing in the sensible the trace of the intelligible, the first
  movement of epistrophē—the return toward the One.
