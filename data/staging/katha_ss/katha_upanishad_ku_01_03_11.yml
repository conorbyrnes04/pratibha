sanskrit_devanagari: 'महतः परम् अव्यक्तम् ।

  अव्यक्तात् पुरुषः परः ।

  पुरुषान् न परं किञ्चित् ।

  सा काष्ठा सा परा गतिः ॥ १.३.११ ॥'
sanskrit_iast: 'mahataḥ param avyaktam |

  avyaktāt puruṣaḥ paraḥ |

  puruṣān na paraṃ kiñcit |

  sā kāṣṭhā sā parā gatiḥ || 1.3.11 ||'
translation_literal: Beyond the Great (mahat) is the Unmanifest (avyakta); beyond the Unmanifest is the Person, puruṣa. Beyond
  the puruṣa there is nothing whatsoever. That is the limit; that is the highest goal.
commentary: 'The verse completes a hierarchy that moves inward and beyond the ordinary field of experience: objects, senses,
  mind, intellect, the great cosmic principle (mahat), and the unmanifest source. Yet the Upaniṣad does not leave liberation
  in an impersonal abstraction. Beyond even avyakta stands puruṣa, the supreme Person or conscious reality. “Beyond” here
  need not mean spatial distance or a sequence in time; it marks greater subtlety, independence, and ultimacy. The puruṣa
  is not one item among others, nor an object the mind can possess. It is that beyond which no further ground can be sought.
  Kāṣṭhā, “the furthest point” or “limit,” names the completion of metaphysical inquiry; parā gatiḥ, the “highest going,”
  names the fulfillment of the seeker. The teaching redirects desire from finite attainments toward recognition of the reality
  that is not surpassed.


  Key Terms


  **avyakta** — the unmanifest, not available as an ordinary object of perception

  **puruṣa** — the supreme Person or conscious reality beyond the unmanifest

  **kāṣṭhā** — the furthest limit, final point

  **parā gatiḥ** — the highest goal or ultimate destination


  Cross-Tradition Resonances


  **Plato’s Form of the Good stands beyond lesser objects of knowledge and gives them intelligibility.:**  Divergence: The
  Good is not straightforwardly equivalent to the Upaniṣadic puruṣa, which is presented in a soteriological and inwardly realizable
  framework.

  **Plotinus describes ascent beyond the sensible and intelligible orders toward the One, the ultimate source beyond all derivative
  realities.:**  Divergence: The One is often described as beyond being and intellect; this verse specifically names puruṣa
  beyond the unmanifest.

  **Writers such as Pseudo-Dionysius speak of God as exceeding every created concept and every finite name.:**  Divergence:
  Christian theology retains a creator–creature distinction and a personal God not reducible to the Upaniṣadic account of
  Self and ultimate reality.'
practice: 'Sit quietly and notice successively: sensory objects, sensations, thoughts, and the sense of “I am thinking.” At
  each level ask, “What is aware of this?” Do not answer conceptually; rest for several breaths in the ungraspable witnessing
  presence.'
