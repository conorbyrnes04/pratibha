section: Phaedo 72e–77a
sanskrit_devanagari: ἆρα οὐ τοῦτό ἐστιν τὸ διαφέρον, ὅτι ἡ μὲν ψυχὴ ἀθάνατος καὶ ἀνώλεθρος, καὶ οἰκεῖται τὸν ἀεὶ χρόνον, τὸ
  δὲ σῶμα ἀεί τι ἀπόλλυται; (Phaedo 72e)
sanskrit_iast: ''
translation_literal: 'Is not this the distinction: that the soul is immortal and imperishable, and our souls truly dwell throughout
  all time, whereas the body is always perishing? For when death comes, the body—the visible, corporeal thing—goes to the
  invisible realm; but the soul, being invisible and divine, departs to a place that is glorious, pure, and invisible—to Hades,
  the true home of the gods. There the soul dwells with the divine and eternal, having kinship (syngenia) with what is always
  the same, unchanging, and immortal.'
commentary: 'The affinity argument (syngenia) grounds the soul''s immortality not in logical proof but in ontological kinship.
  Socrates argues that the soul, by its very nature, resembles the Forms—the eternal, unchanging, invisible realities—more
  than it resembles the body''s flux and multiplicity. This ''likeness'' is not metaphorical but constitutive: the soul is
  akin to what is immortal, hence cannot perish. The argument assumes a metaphysical hierarchy (visible/invisible, changing/unchanging,
  mortal/immortal) and assigns the soul to the superior order. Critics note this conflates similarity with identity and assumes
  what it claims to prove. Yet its power lies in its appeal to the philosopher''s lived experience: contemplation of eternal
  truths feels like communion with something deathless within oneself. The argument also subtly redefines death not as annihilation
  but as homecoming—the soul''s return to its true kin.'
practice: 'Each morning, before discursive thought, sit in silence and attend to a single eternal truth—justice, beauty, or
  goodness as you have glimpsed it. Do not argue or analyze. Instead, notice the quality of consciousness itself when resting
  on this object: its stillness, its sense of touching something deathless. Observe how this consciousness differs from your
  awareness of bodily sensations or fleeting emotions. Return to this difference daily. Over weeks, the affinity becomes palpable:
  you recognize in your own capacity to know the eternal a kinship with eternity itself. This is not belief but direct acquaintance—the
  soul remembering its home.'
