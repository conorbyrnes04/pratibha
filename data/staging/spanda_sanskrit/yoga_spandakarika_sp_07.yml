  sahāntareṇa cakreṇa pravṛttisthitisaṃhṛtiḥ || 6 ||


  labhate tatprayatnena parīkṣyaṃ tattvam ādarāt |

  yataḥ svatantratā tasya sarvatreyam akṛtrimā || 7 ||'
