translation_literal: 'Verse 6: Because this group of faculties (karaṇa-varga), though bewildered, appears of itself as unbewitched,
  together with the wheel of the other (sahāntareṇa cakreṇa), [it accomplishes] the unfolding, subsistence, and resorption
  (pravṛtti-sthiti-saṃhṛti). Verse 7: Through that very effort, one attains the principle (tattva) by examining it with respect
  (ādarāt); because its autonomy (svatantratā) is this [same spanda], spontaneous (akṛtrimā) everywhere.'
commentary: 'These paired verses establish the paradox at the heart of Spanda recognition: the apparatus of consciousness—the
  sense faculties and their coordinating subtle body (puryaṣṭaka)—appears simultaneously bewildered (vimūḍha) and unbewitched
  (amūḍhavat). This is not contradiction but the signature of spanda itself. The karaṇa-varga (the eleven faculties: five
  of perception, five of action, and mind) operates through sahāntareṇa cakreṇa, the ''wheel of the other''—the subtle energetic
  matrix that is not separate from consciousness but its spontaneous self-manifestation. This wheel accomplishes the three
  cosmic functions (pravṛtti-sthiti-saṃhṛti: emanation, maintenance, resorption) not through external agency but through the
  intrinsic pulsation of Śiva-Śakti.


  Verse 7 pivots to practice-as-recognition (pratyabhijñā). The aspirant does not acquire spanda through effort; rather, through
  dedicated inquiry (parīkṣya) conducted with reverence (ādarāt), one attains direct recognition (labhate) of tattva—the principle
  that is already operating. The key insight: svatantratā (autonomy, freedom, self-determination) is not a quality spanda
  possesses but is spanda itself. This autonomy is akṛtrimā—spontaneous, uncaused, natural—and pervades everywhere (sarvatreyam).
  The verse dissolves the seeker-sought duality: there is no external principle to be grasped, only the recognition that the
  very autonomy by which one seeks is the spanda one seeks to know. This is the nondual threshold of Trika: the subject''s
  freedom to know is identical with the object known.


  Key Terms


  **karaṇa-varga** — The group of eleven faculties (five sense organs, five motor organs, mind); the instrumental apparatus
  of embodied consciousness

  **sahāntareṇa cakreṇa** — The wheel of the other (subtle body/puryaṣṭaka); the energetic matrix coordinating all faculties,
  inseparable from Śakti''s creative pulsation

  **svatantratā** — Autonomy, self-determination, intrinsic freedom; in Spanda doctrine, the very nature of spanda as uncaused,
  self-luminous vibration

  **pratyabhijñā** — Recognition; the non-dual realization that one''s own consciousness is identical with Śiva-Śakti, not
  a future attainment but present unveiling


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1: ''citi śaktir advayā'':** Both texts ground liberation in recognition
  that consciousness (citi) and its power (śakti) are nondual and self-luminous. Verse 7''s ''autonomy everywhere'' mirrors
  the Hṛdayam''s insistence that the recognizing subject is already the supreme subject; no external attainment is needed.
  Divergence: The Hṛdayam emphasizes the role of the guru and initiation (dīkṣā) as necessary catalysts for recognition, whereas
  Spandakārikā 7 suggests that reverent inquiry (ādarāt parīkṣyam) itself can trigger the unveiling, with less explicit emphasis
  on transmission.

  **Dzogchen rigpa (Tibetan Buddhist nonduality); Longchenpa''s ''Finding Comfort and Ease in the Nature of Mind'':** Both
  traditions teach that the seeking consciousness is already the sought awareness. Rigpa (pristine awareness) and spanda both
  describe an intrinsic, spontaneous (akṛtrimā) luminosity that requires recognition rather than cultivation. The ''bewildered
  yet unbewitched'' paradox of verse 6 parallels rigpa''s simultaneous confusion and clarity in the unenlightened state. Divergence:
  Dzogchen emphasizes the dissolution of conceptual elaboration (spros bral) and the direct pointing-out instruction (ngo
  sprod), whereas Spanda integrates the faculties and their cosmic functions (pravṛtti-sthiti-saṃhṛti) as inseparable from
  recognition itself, not obstacles to transcend.

  **Plotinus, Enneads III.8.10: ''The One does not move; all movement is in the emanations'':** Both Plotinus and Spanda teach
  that the ultimate principle (the One/Śiva) is utterly transcendent yet the source of all cosmic process. Verse 6''s description
  of the faculties accomplishing the three functions through the wheel of Śakti parallels Plotinus''s doctrine that emanation
  flows necessarily from the One''s superabundant nature without volition. Divergence: Plotinus maintains a hierarchical chain
  of hypostases (One, Intellect, Soul) with increasing distance from the source, whereas Spanda insists on the nondual simultaneity
  of Śiva and Śakti—the transcendent and immanent are not separated by degrees but are one pulsation recognized from within
  embodied consciousness.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
sanskrit_devanagari: 'यतः करणवर्गो ऽयं विमूढो ऽमूढवत् स्वयम् ।

  सहान्तरेण चक्रेण प्रवृत्तिस्थितिसंहृतिः ॥ ६ ॥


  लभते तत्प्रयत्नेन परीक्ष्यं तत्त्वम् आदरात् ।

  यतः स्वतन्त्रता तस्य सर्वत्रेयम् अकृत्रिमा ॥ ७ ॥'
