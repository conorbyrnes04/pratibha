translation_note: 'Verse 6: ''sahāntareṇa cakreṇa'' is difficult; it may mean ''together with the wheel of the other'' (perhaps
  Śakti''s wheel, or the wheel of manifestation), but the exact referent is unclear. ''Vimūḍho amūḍhavat'' (bewildered yet
  appearing unbewitched) captures the paradox of the faculties'' apparent autonomy despite their dependence on spanda. Verse
  7: ''parīkṣyam'' (to be examined) is a gerundive; ''ādarāt'' (with respect/reverence) modifies the examination. The final
  phrase affirms that the autonomy (svatantratā) of consciousness is the spanda itself, operating spontaneously (akṛtrimā)
  in all circumstances. Some ambiguity remains in the logical connection between verses.'
