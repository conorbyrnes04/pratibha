source_excerpt: Shared source passage with Stanza 49. See Stanza 49 for the full translation and commentary.
translation_literal: When mind (mano) and ego-sense (ahaṃbuddhi) arise merely as subtle elements (tanmātra), confined within
  the eight-fold city (puryaṣṭaka), the perceptions (pratyaya) that emerge from that [confinement] are experienced. Because
  the individual soul (jīva) becomes subject to another's will (paravaśa), it experiences enjoyment (bhoga) bound by that
  condition; therefore we declare this very state of bondage to be the cause of transmigration (saṃsṛti) and dissolution (pralaya).
commentary: 'These verses articulate the Spanda doctrine''s diagnosis of bondage: the contraction of consciousness into the
  puryaṣṭaka (the subtle body comprising the five tanmātras—sound, touch, form, taste, smell—plus mind, ego-sense, and intellect)
  severs the jīva from spanda, the free pulsation of Śiva-Śakti. When mano and ahaṃbuddhi (the faculties of cognition and
  individuation) crystallize as mere tanmātra—reduced to subtle elemental impressions—they become imprisoned within this eight-fold
  city. The pratyayas (perceptions, mental modifications) that arise from this confinement are no longer transparent to their
  own source; instead, they appear as objects of experience, binding the subject to the illusion of exteriority. This is paravaśatā:
  the jīva believes itself subject to forces outside itself—desire, karma, the play of guṇas—because it has forgotten its
  identity with the self-luminous spanda that is both knower and known. Bondage (saṃsṛti) and dissolution (pralaya) are not
  external cosmic processes but the very oscillation of a consciousness that has lost recognition of its own freedom. The
  verse does not condemn the subtle body itself but rather the contraction of awareness into it as final reality. Liberation,
  by contrast, lies in pratyabhijñā—recognizing that even within the puryaṣṭaka, spanda continues to pulse; the eight-fold
  city becomes transparent to the vibration that animates it. Thus bondage and liberation are not states but degrees of recognition:
  the jīva bound is spanda forgotten; the liberated is spanda remembered as one''s own nature. This teaching directly informs
  practice: not rejection of the subtle body but its re-illumination through the unmeṣa (opening/expansion) of consciousness
  toward its own source.


  Key Terms


  **puryaṣṭaka** — The eight-fold subtle city: the five tanmātras (subtle elements) plus mind, ego-sense, and intellect; the
  locus of contracted consciousness in bondage

  **tanmātra** — Subtle elemental potentiality (sound, touch, form, taste, smell); the threshold between consciousness and
  gross manifestation

  **paravaśatā** — Subjection to another''s will; the illusion that consciousness is determined by external forces rather
  than self-luminous

  **pratyaya** — Perception, mental modification, or presented content; the apparent objects of mind when consciousness forgets
  its own freedom


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta), sūtra 1:** Both texts root bondage in forgetting (vismaraṇa) one''s identity with
  Śiva-Śakti; liberation is pratyabhijñā (recognition), not acquisition of something new. The puryaṣṭaka here parallels the
  contraction of Śiva''s infinite knowing into the limited subject-object duality. Divergence: The Pratyabhijñāhṛdayam emphasizes
  the metaphysical structure of contraction (aṇimā) more systematically; these verses focus on the experiential bind of paravaśatā
  and its role in perpetuating saṃsṛti.

  **Dzogchen (Tibetan Buddhism), rigpa and dualistic mind:** Both traditions distinguish the luminous, non-dual ground (spanda/rigpa)
  from the contracted, object-referential mind (mano-ahaṃbuddhi/dualistic cognition). Bondage is forgetting this distinction;
  liberation is continuous recognition. Divergence: Dzogchen emphasizes the pristine clarity (gsal ba) of rigpa as intrinsically
  free; Spanda emphasizes spanda as the creative pulse (vibration) underlying all manifestation, including the subtle body
  itself.

  **Plotinus, Enneads III.8.4 (on the descent of soul):** Plotinus describes the soul''s descent into multiplicity and individuation
  as a kind of forgetting of its source in the One; recovery requires remembrance (anamnesis) of its true nature. Divergence:
  Plotinus treats descent as ontologically real stages; Kashmir Śaivism teaches that the jīva never truly separates from spanda—only
  recognition shifts. The puryaṣṭaka is not a lower realm but a veil within non-dual consciousness.'
insight: ''
practice: 'Pause right now and notice: where in your body do you feel most confined or controlled—chest, throat, belly, behind
  the eyes? Rest attention there for three breaths without trying to change it, simply observing whether that tightness is
  actually *you* or a pattern you''re watching. This direct sensing of the boundary between witness and confinement is the
  first crack in paravaśatā (being subject to another''s will).'
sanskrit_devanagari: 'तन्मात्रोदयरूपेन मनो ऽहंबुद्धिवर्तिना ।

  पुर्यष्टकेन संरुद्धस् तदुत्थम् प्रत्ययोद्भवम् ॥ ४८ ॥


  भुङ्क्ते परवशो भोगं तद्भावात् संसरेद् अतः ।

  संसृतिप्रलयस्यास्य कारणं सम्प्रचक्ष्महे ॥ ४९ ॥'
sanskrit_iast: 'tanmātrodayarūpena mano ''haṃbuddhivartinā |

  puryaṣṭakena saṃruddhas taduttham pratyayodbhavam || 48 ||


  bhuṅkte paravaśo bhogaṃ tadbhāvāt saṃsared ataḥ |

  saṃsṛtipralayasyāsya kāraṇaṃ sampracakṣmahe || 49 ||'
