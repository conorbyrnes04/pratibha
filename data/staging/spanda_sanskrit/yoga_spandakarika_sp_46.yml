source_excerpt: Caught in the field of subtle energies and mental representations, the supreme ambrosia is dissolved, and
  the person forgets his innate freedom.
translation_literal: When his essential nature (svarūpa) is veiled (āvaraṇa), the energies (śaktayaḥ) arise continuously from
  that concealment. Because of this, the arising of representations (pratyaya) does not occur without the sequence of sound
  (śabda-anuvedha).
commentary: 'This verse addresses a critical paradox in Spanda metaphysics: how does the infinite, self-luminous vibration
  of Śiva-Śakti become the finite, sequential world of individual consciousness? Vasugupta''s answer hinges on āvaraṇa—veiling
  or contraction—as the mechanism by which svarūpa (the intrinsic nature of consciousness as spanda) enters apparent limitation.


  When Śiva''s svarūpa undergoes āvaraṇa, it does not cease to be spanda; rather, spanda itself becomes the generative principle
  of manifestation. The śaktayaḥ (the energies of Śakti, the dynamic pole of consciousness) arise continuously—satatotthitāḥ—not
  as departures from spanda but as its creative unfolding. This is crucial: the veiling is not a fall or corruption but the
  very mechanism of recognition-through-appearance.


  The second line reveals why: pratyaya (representation, mental content, the known object) cannot arise without śabda-anuvedha—the
  sequential unfolding through sound, meaning the vibratory unfoldment of meaning through differentiation. In Trika terms,
  this is the descent from parā-vāk (transcendent speech) through paśyantī and madhyamā into vaikharī (articulated speech),
  each level introducing succession and specificity. The knowing subject (pramātṛ) recognizes itself only through the play
  of known objects (prameya), and that play requires the śabda-matrix—the resonant structure of differentiation.


  This verse thus establishes that spanda is not opposed to the world of representation but is its hidden ground. The veiling
  of svarūpa is simultaneously the arising of śakti; contraction and creativity are one movement. For the practitioner, this
  means recognition (pratyabhijñā) is not escape from pratyaya but the penetration of representation to its vibratory source.
  The continuous arising of energies (satatotthitāḥ) is the perpetual opportunity for awakening.


  Key Terms


  **svarūpa** — essential nature; the intrinsic, self-luminous character of consciousness as spanda itself

  **āvaraṇa** — veiling or contraction; the apparent concealment of infinite consciousness that paradoxically enables creative
  manifestation

  **śabda-anuvedha** — sequential unfolding through sound/vibration; the differentiated play of meaning that structures representation
  and world-appearance

  **pratyaya** — representation, mental content, the known; the object-pole of consciousness that arises through śakti''s
  creative play


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), Sūtra 1: ''citi-śaktir eva viśvam'':** Both texts ground manifestation
  in Śakti as the dynamic, creative pole of consciousness; the world is not external to Śakti but her continuous self-expression.
  Recognition occurs through understanding that the known (pratyaya) is never separate from the knowing subject. Divergence:
  The Hṛdayam emphasizes the immediate accessibility of recognition through simple awareness of one''s own nature, whereas
  SK 46 stresses the necessity of the śabda-anuvedha structure—the sequential, vibratory unfolding—as the unavoidable medium
  through which recognition must operate.

  **Dzogchen rigpa and the doctrine of ''ngo-bo'' (essential nature) in Tibetan Buddhism:** Both traditions posit an intrinsic,
  luminous awareness (rigpa/svarūpa) that, when apparently obscured, generates the appearance of subject-object duality and
  the flow of mental content—yet the obscuration is not real but a misrecognition of the nature of mind itself. Divergence:
  Dzogchen typically emphasizes the instantaneous recognition of rigpa as already-free, whereas Spanda here foregrounds the
  continuous, energetic arising (satatotthitāḥ) of śakti as the necessary texture through which recognition unfolds; Spanda
  does not bypass the śabda-matrix but recognizes it as spanda''s own play.

  **Plotinus, Enneads III.8.10: the One''s creative overflow (prohodos) as necessary emanation:** Both systems reject the
  notion that manifestation is a fall or error; rather, the apparent veiling or ''descent'' is the intrinsic nature of creative
  power itself. The finite world is not opposed to the infinite source but its necessary expression. Divergence: Plotinus''s
  emanation is largely impersonal and hierarchical (One → Intellect → Soul → Matter), whereas Spanda emphasizes the intimate,
  self-recognizing character of Śiva-Śakti''s play; the veiling is not a mechanical overflow but a conscious contraction that
  enables the subject to know itself through its own energies.'
practice: When attention contracts into a single object or sensation, pause and listen inwardly to the subtle vibration or
  hum beneath that contraction—the unbroken sound-current that sustains even your sense of separation. Notice how this listening
  itself begins to dissolve the boundary between observer and observed, revealing the energies that were bound up in the veiling.
