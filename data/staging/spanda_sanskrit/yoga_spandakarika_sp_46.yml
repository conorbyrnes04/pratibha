translation_note: 'The syntax of yataḥ...na vinā is challenging: ''because/since...not without'' suggests a causal relationship
  between the veiling of svarūpa, the continuous arising of śaktis, and the dependence of pratyaya-arising on śabda-sequence.
  The exact logical connection between these clauses and the mechanism of veiling could be interpreted as: (1) the veiling
  causes śaktis to arise, which in turn bind representation-arising to sound-sequence, or (2) all three phenomena are aspects
  of a single condition. The provided rendering emphasizes ''forgetting innate freedom'' which is thematic but not explicit
  in this verse''s grammar. Confidence is medium due to the interpretive density of the causal chain.'
