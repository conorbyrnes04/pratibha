translation_note: 'Verse 14: The compound kāryakartṛtvaśabditam is clear (''designated as effect-and-agent''), but the metaphysical
  claim about perishable effectuality versus imperishable agency requires doctrinal context—this likely means that the sense
  of being a doer persists even when the fruits of action are relinquished. Verse 15: kāryonmukhaḥ prayatnaḥ (''effort directed
  toward effect'') is the ego-bound striving that dissolves; the final clause ''vilupto ''smi'' is the recognition of dissolution
  of the separate self. The reference rendering''s ''divine tremor liberated from ego'' is interpretive; the Sanskrit says
  the *effort* dissolves and the ignorant one realizes *they* are dissolved—a non-dual recognition. Confidence lowered due
  to the depth of the soteriological claim and potential ambiguity in how akṣayam (''imperishable'') modifies kartṛtva in
  the context of spanda doctrine.'
