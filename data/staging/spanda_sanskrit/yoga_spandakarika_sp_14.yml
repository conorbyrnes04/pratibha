source_excerpt: Actor and action are united, but when action is dissolved by abandoning the fruits of the act, the very dynamic
  that is tied to the ego exhausts itself, and the tantrika who is absorbed in this profound contemplation discovers the divine
  tremor liberated from its ties to the ego. The profound nature of action is thus revealed, and he who has interiorized the
  movement of desire no longer knows dissolution. He cannot cease to exist because he has returned to the profound source.
translation_literal: 'Here the pair of states (avasthā-yugala) is designated as effect-and-agent (kāryakartṛtva). The effectuality
  (kāryatā) there is perishable (kṣayiṇī), while agency (kartṛtva) is imperishable (akṣayam). [15] The effort (prayatna) that
  is turned toward effect alone (kāryonmukhaḥ) is what is dissolved (lupyate) here; when that is dissolved, the ignorant one
  (abudhaḥ) comes to the realization: "I am dissolved (vilupto ''smi)."'
commentary: 'These verses articulate the Spanda doctrine''s diagnosis of bondage and the mechanics of liberation through recognition.
  Verse 14 establishes a fundamental asymmetry: consciousness manifests as a dyad of doer and deed, agent and effect. Yet
  this pairing conceals an ontological truth—effectuality (what is produced, undergoes transformation, decays) is inherently
  perishable, while agency (the capacity to know and act) remains imperishable, rooted in the eternal pulse of Śiva-Śakti.
  The ignorant subject mistakes themselves for the agent of effects, identifying with the limited actor-body-mind complex
  (the puryaṣṭaka or subtle body) that is bound to time and causation.


  Verse 15 deepens this: the *prayatna* (effort, striving) directed solely toward producing effects—the whole apparatus of
  karma, desire, and worldly accomplishment—is what obscures recognition. This effort is not condemned; rather, it is shown
  to be the veil itself. When this effort-toward-effects is *dissolved* (not annihilated but recognized as insubstantial),
  the ignorant person undergoes a reversal: instead of "I am the doer of effects," there arises the liberating realization
  "I am dissolved"—meaning the false identity dissolves, and what remains is the imperishable agency itself, the witnessing
  consciousness that was never bound.


  This is pratyabhijñā (recognition) in action: not acquisition of something new, but the collapse of the effort-structure
  that sustained false identification. The Spanda here reveals itself as the immobile yet dynamic ground that persists when
  all striving ceases. The pair of states (effect-agent) is not rejected but understood as a play within the unchanging pulse
  of consciousness. Bondage and liberation are not ontological conditions but epistemological ones—a matter of where attention
  is placed and what is mistaken for the self.


  Key Terms


  **avasthā-yugala** — pair of states; the dyadic structure of effect and agent that consciousness assumes in manifestation

  **kāryatā / kartṛtva** — effectuality (perishable, produced) / agency (imperishable, the knowing capacity); the asymmetry
  that reveals bondage

  **prayatna** — effort, striving; the directed will-toward-effects that binds the ignorant subject and dissolves in recognition


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1:** Both texts ground liberation in *recognition* (pratyabhijñā)
  of the unchanging subject-consciousness that witnesses the play of effect and agency; bondage is misidentification, not
  ontological exile Divergence: The Pratyabhijñāhṛdayam emphasizes the *content* of recognition—that Śiva is the universal
  subject—while the Spandakārikā emphasizes the *dissolution of effort* and the return to the pulse as the mechanism of that
  recognition

  **Dzogchen (Tibetan Buddhism), rigpa and the dissolution of dualistic effort:** Both traditions teach that the fundamental
  confusion is the binding of awareness to goal-directed striving; liberation comes when effort-toward-object collapses and
  non-dual awareness is recognized as always-already present Divergence: Dzogchen frames this as the collapse of subject-object
  duality itself, while Spanda preserves an asymmetry: the imperishable agent (kartṛtva) is not negated but revealed as the
  ground, and the perishable effect-realm continues to appear within it

  **Meister Eckhart, ''Gelassenheit'' (releasement) and the Godhead beyond doing:** Both teach that the highest realization
  involves a cessation of the will-to-effect and a surrender into a ground that is simultaneously pure agency and pure receptivity;
  the false self dissolves when striving ceases Divergence: Eckhart''s framework is theistic and apophatic (God beyond being),
  while Spanda is non-dual and phenomenologically precise about the mechanics of consciousness and its pulse'
practice: When engaged in any deliberate action—speaking, writing, moving—pause and notice the strain or effort directed only
  toward producing a specific result. Hold this attention for three breaths, then release the intentional push itself while
  remaining present. Observe what remains of "you" when the goal-directed effort dissolves.
sanskrit_devanagari: 'अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् ।

  कार्यता क्षयिणी तत्र कर्तृत्वम् पुनर् अक्षयम् ॥ १४ ॥


  कार्योन्मुखः प्रयत्नो यः केवलं सो ऽत्र लुप्यते ।

  तस्मिन् लुप्ते विलुप्तो ऽस्मीत्य् अबुधः प्रतिपद्यते ॥ १५ ॥'
sanskrit_iast: 'avasthāyugalaṃ cātra kāryakartṛtvaśabditam |

  kāryatā kṣayiṇī tatra kartṛtvam punar akṣayam || 14 ||


  kāryonmukhaḥ prayatno yaḥ kevalaṃ so ''tra lupyate |

  tasmin lupte vilupto ''smīty abudhaḥ pratipadyate || 15 ||'
