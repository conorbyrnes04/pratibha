source_excerpt: May the tantrika remain present, his senses vigilantly sown in reality, and may he know stability.
translation_literal: When the group of powers (śakti-varga) arising from a mass of sound (śabda-rāśi) has entered into the
  condition of being experienced (bhogyatā), and its radiance is diminished by the obscuration of the limited categories (kalā-viluptavibhava),
  that [being] is remembered as the bound soul (paśu).
commentary: 'This verse diagnoses the ontological condition of the bound soul (paśu) through the lens of śakti-contraction
  and sensory-cognitive collapse. The ''group of powers'' (śakti-varga)—the dynamic potencies of consciousness itself—normally
  constitute the subject''s capacity to know and act. Here, Vasugupta identifies three simultaneous degradations that define
  bondage.


  First, these powers ''arise from a mass of sound'' (śabdarāśi). In Trika metaphysics, śabda is not mere phonetic utterance
  but the subtle vibratory matrix of meaning-potentiality that unfolds from Śiva-Śakti''s creative pulse (spanda). When śakti
  becomes ''experienced'' (bhogyatā—literally, fit to be experienced), it inverts its nature: instead of being the knowing
  subject''s own luminous potency, it becomes object. The subject-object polarity crystallizes.


  Second, ''radiance is diminished by the obscuration of the limited categories'' (kalā-viluptavibhava). The kalās—the thirty-six
  tattvas, or more intimately, the five limiting categories (kalā, vidyā, rāga, kāla, niyati)—are not external constraints
  but the very texture of contraction through which infinite consciousness self-limits into finite agency. When these kalās
  obscure (viluptam) the vibhava (radiance, sovereignty, the ''shining forth'' of Śakti), the bound soul loses recognition
  of its own creative potency. It forgets it is the knower and mistakes itself for the known.


  Thus paśu-hood is not punishment but amnesia: a reversal of the subject-object relation such that the powers that should
  constitute one''s luminous agency become mere objects of experience. The verse teaches that bondage is śakti-inversion—the
  powers of consciousness turned inward as limitation rather than outward as freedom. Recognition (pratyabhijñā) reverses
  this precisely by restoring the subject''s ownership of its own śakti-varga, reclaiming the powers as one''s own radiant
  knowing.


  Key Terms


  **śakti-varga** — the group or array of powers; the dynamic potencies of consciousness that constitute the subject''s capacity
  to know and act

  **bhogyatā** — the condition of being experienced or objectified; the inversion whereby subject-powers become object-content

  **kalā-viluptavibhava** — radiance obscured by the limiting categories; the contraction of infinite sovereignty into finite
  agency through the five kalās

  **paśu** — the bound soul; the individual who has forgotten its identity with Śiva and experiences itself as limited knower
  among objects


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1:** Both texts ground bondage in subject-object inversion and liberation
  in pratyabhijñā (recognition that consciousness is the eternal subject, never truly object). Kṣemarāja''s ''citi eva paramāśrayā''
  echoes Vasugupta''s diagnosis that the powers themselves remain conscious—only forgotten. Divergence: The Pratyabhijñā emphasizes
  the cognitive-emotional immediacy of recognition (hṛdaya = heart), whereas Spandakārikā 44 focuses on the energetic-structural
  mechanism of śakti-contraction itself, making bondage a question of power-inversion rather than mere conceptual error.

  **Dzogchen rigpa (Tibetan Buddhist non-dual tradition):** Both traditions teach that bondage arises from mistaking the luminous
  potency of awareness itself (rigpa/śakti) for an object of experience, and that liberation is recognition of awareness as
  the knowing subject, never the known. Divergence: Dzogchen emphasizes the self-luminosity of rigpa as intrinsically free
  of conceptual elaboration (prapañca), whereas Spandakārikā 44 locates the mechanism of bondage in the specific contraction
  through kalās—the tattva-structure—making bondage more architecturally determinate.

  **Plotinus, Enneads III.8.10 (on the soul''s descent into multiplicity):** Plotinus describes how the soul, turning away
  from the One''s unified radiance, becomes absorbed in the multiplicity of sensible objects and forgets its transcendent
  nature—parallel to the śakti-varga''s inversion from subject to object. Divergence: Plotinus frames descent as a necessary
  cosmic emanation and psychological temptation; Vasugupta frames it as śakti-contraction through specific limiting principles
  (kalās), making it a reversible energetic mechanism rather than an ontological necessity or moral failing.'
practice: When speaking or listening to words, pause and notice the moment just before meaning crystallizes—feel how the vibration
  of sound carries an aliveness that then gets captured into fixed concepts and categories. Sit with this gap between the
  living pulse of utterance and the deadened, compartmentalized meaning, letting your awareness rest in the rawness before
  language solidifies into limitation.
