translation_note: 'The syntax is challenging: śabdarāśi-samutthasyaśakti-vargasya bhogyatām appears to be accusative, suggesting
  the powers ''enter into'' or ''assume'' the state of being an object of experience. kalāviluptavibhavo is a nominative absolute
  (vibhava = radiance/manifestation), with kalā (the limited categories of manifestation in Trika) acting as the agent of
  obscuration. gataḥ san (having gone/entered) agrees with the implicit subject. The cross-check rendering differs significantly
  in content and tone, suggesting either a different recension or interpretive liberty; I have adhered to the grammatical
  structure of THIS text. High confidence in grammar; medium on doctrinal nuance of bhogyatā in this context.'
