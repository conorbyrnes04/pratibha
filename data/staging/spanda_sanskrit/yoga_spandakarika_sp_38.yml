source_excerpt: Even in a state of extreme weakness, such a tantrika succeeds in this accomplishment. Even starving, he finds
  his food.
translation_literal: 37. Even one who is weak, having seized that [spanda], becomes active in action; it conceals hunger and
  likewise one who is extremely hungry [finds satisfaction]. 38. When the body is thus presided over (adhiṣṭhite) by this
  [spanda], omniscience and the like arise just as they do; similarly, from this presiding [of spanda] in one's own self (svātman),
  it will be thus everywhere.
commentary: 'These verses establish spanda''s sovereign power to transform embodied consciousness through direct presiding
  (adhiṣṭhāna). Verse 37 demonstrates spanda''s capacity to override ordinary bodily limitation—even the weak become potent,
  hunger dissolves—by showing that when spanda seizes agency, ordinary causality inverts. The weak one does not become strong
  through effort; rather, spanda''s vibration, once recognized as one''s own animating principle, renders weakness irrelevant
  to action. Hunger, a function of the subtle body''s (puryaṣṭaka) habitual contraction, is concealed—not denied but transcended—when
  spanda''s expansive knowing floods the system.


  Verse 38 universalizes this recognition. Adhiṣṭhāna (presiding, ruling, or more subtly: being established-in) marks the
  shift from spanda as distant cosmic principle to spanda as the very ground of one''s own subjectivity. When spanda presides
  over the body-mind (deha), omniscience and allied powers (siddhi) manifest not as acquisitions but as recognitions—they
  arise "just as they do" (yathā...tathā), meaning: the same way they always arise when consciousness knows itself without
  obstruction. The second half pivots crucially: "from this presiding in one''s own self." Here svātman (the true Self, Śiva-consciousness)
  is not separate from the body''s animation; rather, spanda''s presiding in one''s own nature is the recognition that subject
  and object, knower and known, are never truly divided. Once this adhiṣṭhāna is recognized as intrinsic—not imposed—it radiates
  everywhere (sarvatra). This is pratyabhijñā: not acquiring powers but recognizing that the very vibration that moves the
  body, sustains hunger, and generates thought is the non-dual Śakti eternally presiding over all manifestation. The verse
  thus collapses the distance between microcosm and macrocosm, between the individual''s subtle body and universal consciousness,
  through the single pivot of recognition (ābhāsa-jñāna).


  Key Terms


  **adhiṣṭhāna** — presiding over, ruling, or being established-in; the non-dual consciousness''s sovereign animation of the
  body-mind and all manifestation

  **spanda** — the subtle creative pulse or vibration of Śiva-Śakti; the dynamic ground of all appearance and the knowing
  subject''s own nature

  **svātman** — one''s own true Self; non-dual Śiva-consciousness, identical with spanda when recognized

  **pratyabhijñā** — recognition; the realization that one''s own nature is already the non-dual consciousness presiding over
  all


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), Sūtra 1:** Both texts ground liberation in recognition (pratyabhijñā) rather
  than acquisition. Kṣemarāja''s opening—''the Lord, whose nature is the freedom of consciousness''—parallels Spanda''s claim
  that omniscience arises when spanda presides in one''s own self, not through effort but through ābhāsa-jñāna (recognition
  of appearance as consciousness''s own play). Divergence: Pratyabhijñāhṛdayam emphasizes the logical-philosophical scaffolding
  of non-duality more explicitly, while Spandakārikā works through the somatic, vibratory immediacy of spanda as the direct
  gateway to recognition.

  **Dzogchen (Tibetan Buddhism), rigpa (pristine awareness):** Both traditions locate liberation in recognizing an already-present,
  non-dual awareness that animates all experience. Rigpa, like spanda, is not acquired but unveiled; it presides over thought
  and sensation without being separate from them. Both reject the dualism of knower seeking knowledge. Divergence: Dzogchen''s
  rigpa emphasizes the luminous, knowing quality of awareness itself, while Spanda foregrounds the dynamic, pulsating creative
  vibration (spanda) as the medium through which that knowing manifests—a subtle but real emphasis on creative potentiality
  (Śakti) as intrinsic to consciousness.

  **Plotinus, Enneads III.8.10 (on the One''s creative overflow):** Plotinus describes how the One, without diminishment,
  radiates creative power that pervades all levels of reality. Similarly, spanda''s presiding in one''s own self radiates
  ''everywhere'' (sarvatra) without fragmentation—a non-dual creative overflow that unifies microcosm and macrocosm. Divergence:
  Plotinus''s One remains transcendent and beyond being; Spanda, as Śakti, is immanent, vibratory, and knowable through direct
  embodied recognition, not only through intellectual ascent.'
practice: When hunger arises, pause and locate the subtle throb or pulse of aliveness in your chest or belly—not the sensation
  of hunger itself, but the conscious presence that *knows* the hunger is occurring. Rest your attention there for three to
  five breaths, allowing that witnessing pulse to remain steady while the hunger continues; notice how the grip of the craving
  loosens even as the physical sensation remains.
sanskrit_devanagari: 'दुर्बलो ऽपि तदाक्रम्य यतः कार्ये प्रवर्तते ।

  आच्छादयेद् बुभुक्षां च तथा यो ऽति बुभुक्षितः ॥ ३७ ॥


  अनेनाधिष्ठिते देहे यथा सर्वज्ञतादयः ।

  तथा स्वात्मन्य् अधिष्ठानात् सर्वत्रैवम् भविष्यति ॥ ३८ ॥'
