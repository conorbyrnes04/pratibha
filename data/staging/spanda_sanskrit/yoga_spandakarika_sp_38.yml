translation_note: 'Verse 37: The syntax of ''tadākramya'' (having seized/grasped that) is clear, but the exact referent of
  ''tat'' (that) — whether spanda itself or a particular state/practice — depends on context from preceding verses. The phrase
  ''bubhukṣāṃ ca tathā yo ''ti bubhukṣitaḥ'' is grammatically tight: ''ācchādayed bubhukṣāṃ'' (it conceals hunger) and ''tathā
  yo ''ti bubhukṣitaḥ'' (likewise one who is extremely hungry) — the parallel structure suggests hunger is both concealed
  and transcended, but the exact mechanism is doctrinal rather than explicit. Verse 38: ''adhiṣṭhānāt'' (from the presiding/governing)
  is instrumental; ''sarvatraivam'' (thus everywhere) confirms the universalization of the principle. The comparison ''yathā
  sarvajñatādayaḥ / tathā'' (just as omniscience etc. / thus) suggests that when spanda governs the body, all divine powers
  manifest; when it governs the self universally, the same occurs everywhere. This is consistent with Trika non-dualism but
  the exact logical chain is compressed.'
