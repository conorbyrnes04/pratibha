translation_note: 'Verse 14: The compound kāryakartṛtvaśabditam is clear (''called effect-ness and agent-ness''). The contrast
  between kṣayiṇī (perishable) and akṣayam (imperishable) is straightforward. Verse 15: kāryonmukhaḥ prayatnaḥ (''effort directed
  toward the effect'') is the subject; kevalam (''alone'') emphasizes that this particular effort is what ceases. The phrase
  ''abudhaḥ pratipadyate'' (''the ignorant one comes to the conclusion'') interprets the unenlightened response to this cessation.
  The reflexive vilupto ''smi (''I am dissolved'') captures the false identification of the limited agent with the disappearing
  effort.'
