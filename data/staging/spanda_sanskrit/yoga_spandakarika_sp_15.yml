translation_literal: Here the pair of states is called 'effect-ness and agent-ness' (kāryakartṛtva). In that pair, effect-ness
  (kāryatā) is perishable, while agent-ness (kartṛtva) is imperishable. (14) The effort (prayatna) that is turned toward effect
  alone is what disappears here; when that disappears, the ignorant one comes to the conclusion 'I am dissolved' (vilupto
  'smi). (15)
commentary: 'These verses articulate a cardinal distinction in Spanda metaphysics: the collapse of agency into mere doership,
  and its liberation through recognition of imperishable kartṛtva. Verse 14 establishes that consciousness manifests as a
  dyad—kāryatā (effect-ness, objecthood) and kartṛtva (agent-ness, subjecthood). The first is kṣayiṇī, perishable, because
  effects arise and dissolve in time; the second is akṣayam, imperishable, because the knowing subject—the ground of all agency—is
  the eternal spanda itself, untouched by temporal flux. This is not metaphysical dualism but phenomenological analysis: the
  pair describes how consciousness appears to itself through the oscillation of unmeṣa (opening/manifestation) and nimeṣa
  (closing/withdrawal). Verse 15 diagnoses the bondage that follows misidentification. The prayatna (effort, intention) directed
  kevalaṃ toward kārya alone—toward producing, controlling, achieving effects in the world—is what ''disappears'' (lupyate)
  when circumstances strip away agency. The abudha (ignorant one) then concludes vilupto ''smi, ''I am dissolved,'' because
  he has anchored his sense of self entirely in the perishable pole. He does not recognize that kartṛtva—the imperishable
  witnessing awareness that observes both effort and its cessation—persists untouched. Recognition (pratyabhijñā) here means
  seeing through this error: realizing that the subject of knowing is never actually dissolved, only the contracted identification
  with doership. The spanda pulses through both poles; the ignorant bind themselves to the oscillation, while the wise recognize
  the steady luminosity that witnesses the entire dance. This verse thus points to the practical reorientation: not the annihilation
  of agency but its reabsorption into the imperishable ground of consciousness, where all doing flows from non-doing.


  Key Terms


  **kartṛtva** — Agent-ness; the imperishable subjectivity and knowing capacity that is the eternal ground of all agency,
  distinct from mere doership.

  **kāryatā** — Effect-ness; the perishable objecthood and product-nature that arises and dissolves, bound to temporal becoming.

  **prayatna** — Effort, intention, or directed will; when turned solely toward effects, it becomes the mechanism of bondage
  and contraction.

  **spanda** — The subtle creative vibration or pulse of Śiva-Śakti consciousness; the ground of both manifestation and withdrawal,
  unmeṣa and nimeṣa.


  Cross-Tradition Resonances


  **Kashmir Śaivism, Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), Sūtra 1:** Both texts root liberation in recognizing the
  eternal subject (kartṛ) as the unchanging witness of all becoming. The Pratyabhijñāhṛdayam''s opening—''Śivaḥ svatantro
  ''ham''—directly parallels the imperishable kartṛtva that persists through all dissolution of effects.

  **Advaita Vedānta, Ātmabodha (Śaṅkara), verse 1:** Both distinguish the eternal subject (ātman/kartṛ) from the perishable
  objects and modifications it witnesses. However, Advaita emphasizes non-duality through negation of the world-appearance
  itself, while Spanda affirms the spanda as the creative pulsation through which consciousness manifests both poles—subject
  and object remain distinct in appearance even as unified in essence.

  **Dzogchen, Rigpa Teachings (Padmasambhava, Tibetan Buddhist tradition):** Both point to the recognition that awareness
  itself is never dissolved, only the contracted identification with doing dissolves. Rigpa (pristine awareness) parallels
  kartṛtva as the imperishable knowing that witnesses all arising and ceasing. The divergence: Dzogchen typically emphasizes
  the emptiness of all appearances, while Spanda celebrates the luminous, creative vibration of Śakti as inseparable from
  that awareness.'
practice: When an action completes—a gesture finished, a word spoken, a breath exhaled—pause and notice what effort-toward-the-effect
  has just dissolved. Hold your attention on the imperishable awareness that *knew* the action was occurring, remaining untouched
  by its ending. Repeat this with three deliberate actions today, each time distinguishing the perishable doing from the deathless
  knowing.
sanskrit_devanagari: 'अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् ।

  कार्यता क्षयिणी तत्र कर्तृत्वम् पुनर् अक्षयम् ॥ १४ ॥


  कार्योन्मुखः प्रयत्नो यः केवलं सो ऽत्र लुप्यते ।

  तस्मिन् लुप्ते विलुप्तो ऽस्मीत्य् अबुधः प्रतिपद्यते ॥ १५ ॥'
