source_excerpt: With his only support the recognition of the heart, the tantrika is omniscient and in harmony with the world.
translation_literal: Weakness (glāni) and trembling (viluṅthikā) in the body arise from ignorance (ajñānatā) as their cause;
  but when that [weakness] is dissolved in the opening [of consciousness] (unmeṣa-vilupta), how could it then be without a
  cause (ahetukā)?
commentary: 'This verse addresses a cardinal problem in Spanda philosophy: the apparent causelessness of embodied suffering.
  Vasugupta''s move is subtle and decisive. Glāni (weakness, depression, contraction) and viluṅthikā (trembling, vibration-as-disturbance)
  are somatic markers of ajñānatā—not mere ignorance but the active forgetting of one''s nature as Śiva-Śakti. They arise
  with a cause: the veiling (āvaraṇa) inherent in the descent into form. The body itself is not rejected; rather, it is recognized
  as the field where recognition (pratyabhijñā) occurs. The second half pivots on unmeṣa—the opening, unfurling, or outflashing
  of consciousness. When that opening dissolves (vilupta) the weakness, the question ''how could it be without cause?'' is
  not rhetorical despair but a reorientation: the very dissolution proves that causation has not been suspended but inverted.
  The cause is no longer ajñāna (contraction, veiling) but rather the spontaneous self-recognition of Śiva-Śakti as the knowing
  subject (pramātṛ) rather than the known (prameya). This is crucial for practice: the body''s trembling and weakness are
  not obstacles to transcend but invitations to recognize the spanda—the subtle pulse—that animates them. Unmeṣa is not escape
  from embodiment but the conscious opening within it. The verse thus rejects both pure dualism (body as mere effect of ignorance)
  and pure non-dualism (body as illusory); it asserts the body as the locus of spanda-recognition, where cause and effect
  are revealed as modulations of a single, self-aware vibration. This is why Spanda is called the ''heart'' (hṛdaya) of Trika:
  it makes the body itself the gateway to liberation-in-life (jīvanmukti).


  Key Terms


  **unmeṣa** — Opening, unfurling, or outflashing of consciousness; the expansion phase of Śiva-Śakti''s self-recognition,
  opposed to nimeṣa (contraction/veiling)

  **glāni** — Weakness, depression, or contraction of vital energy; somatic manifestation of ajñāna (forgetting one''s true
  nature)

  **ajñānatā** — Ignorance understood not as mere absence but as active veiling (āvaraṇa) of the knowing subject''s identity
  with Śiva

  **spanda** — The subtle creative vibration or pulse of consciousness (Śiva-Śakti) that is the ground of all appearance and
  the key to recognizing one''s own nature


  Cross-Tradition Resonances


  **Kashmir Śaivism''s Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), Sūtra 1:** Both texts locate recognition (pratyabhijñā)
  as the reversal of veiling: ''The Lord, whose nature is the totality of the senses, recognizes himself.'' Verse 39 shows
  that this recognition occurs through the body''s very weakness—unmeṣa dissolves contraction by revealing its cause as a
  modulation of the same conscious pulse. Divergence: Pratyabhijñāhṛdayam emphasizes the logical chain of recognition (jñāna-kramaḥ),
  whereas Spandakārikā 39 privileges the immediate, non-dual opening (unmeṣa) as the dissolution of causality itself—less
  discursive, more visceral.

  **Dzogchen (Tibetan Buddhism), rigpa and the ''natural state'':** Both traditions teach that the ''weakness'' or contraction
  of ordinary mind is not a flaw to overcome but a veil to recognize-through. The opening of rigpa (pristine awareness) dissolves
  the subject-object duality just as unmeṣa dissolves glāni. Both reject transcendence-as-escape in favor of recognition-in-situ.
  Divergence: Dzogchen typically emphasizes the non-conceptual nature of rigpa and warns against intellectualizing the ''opening,''
  whereas Spanda, especially in Abhinavagupta''s elaboration, integrates rational inquiry (yukti) and aesthetic experience
  (rasa) as valid paths to unmeṣa.

  **Plotinus, Enneads III.8.4 (on the One''s self-manifestation):** Plotinus describes how the One''s emanation is not a loss
  but a perpetual self-recognition through the many; weakness and multiplicity are not failures but the necessary form of
  the One''s self-knowledge. Similarly, verse 39 shows glāni as the body''s way of manifesting spanda. Divergence: Plotinus
  maintains a hierarchy (One → Intellect → Soul → Matter) where lower levels are ontologically diminished, whereas Spanda''s
  non-dual framework sees glāni and unmeṣa as simultaneous, complementary phases of a single, undivided consciousness—no descent,
  only modulation.'
practice: When trembling or heaviness arises in the body during sitting, pause and notice the exact moment the sensation begins
  to dissolve or lighten—this dissolution *is* the opening itself. Stay with that threshold where the contraction unmakes
  itself, without trying to force or analyze it, until the body settles into the wake of that opening.
