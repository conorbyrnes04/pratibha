translation_note: The verse's logical structure appears to argue that apparent causelessness dissolves when one recognizes
  the spanda operating through the opening (unmeṣa) of consciousness. However, 'glāni' and 'viluṅthikā' may also denote subtle
  states of contraction rather than literal bodily weakness; 'tasya' (his/its) refers back to the body or the embodied subject;
  the final rhetorical question 'kutaḥ sā syād ahetukā' (how could it be causeless?) suggests that recognition of spanda reveals
  the causal ground. The provided cross-check rendering differs substantially in content and does not appear to match this
  verse's apparent meaning, suggesting possible textual or interpretive variance.
