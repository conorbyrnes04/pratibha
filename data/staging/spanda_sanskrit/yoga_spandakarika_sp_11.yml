source_excerpt: 'considers the subject of transmigration—which occurs occasionally in the Tantric texts—and asks clearly:
  “How can a wonder-filled tantrika be subject to transmigration?” Does this mean that those who are not wonder-filled are
  subject to transmigration? No, this is a Tantric mystery. At times it is said that there is transmigration; other times
  it is said that the idea of transmigration is a “hitching post for asses” (Abhinavagupta). Do not count on me to tell you!'
translation_literal: He who, regarding his own nature (svabhāva) in the mode of the presiding subject (adhiṣṭhātṛ-bhāva),
  stands as if smiling (smayamāna iva)—whence comes this poor transmigration (kusṛti) for him?
commentary: 'This verse articulates the radical non-duality at the heart of Spanda recognition: the moment consciousness (Śiva)
  regards its own nature—not as an object to be grasped, but as the presiding subject (adhiṣṭhātṛ-bhāva), the sovereign witness
  that orchestrates all appearance—transmigration ceases. The image of ''smiling'' (smayamāna iva) is crucial: it suggests
  not grim effort but the spontaneous ease of one who has seen through the illusion of separation. Kusṛti, poor or confused
  transmigration, arises only when consciousness mistakes itself for a bound individual (paśu), identified with the puryaṣṭaka
  (subtle body) and its karmic momentum. But when the presiding subject recognizes itself as such—not acquiring a new state
  but unveiling what it always already is—the very ground of bondage dissolves. This is pratyabhijñā: recognition, not attainment.
  The question ''whence comes this kusṛti for him?'' is rhetorical: it cannot arise, because the one who sees through adhiṣṭhātṛ-bhāva
  is no longer the bound experiencer but the infinite consciousness that permits all experience. The Spanda here is the pulsation
  of this recognition itself—the unmeṣa (opening) of the subject''s awareness to its own sovereignty. Vasugupta emphasizes
  that this is not a meditative achievement but the natural consequence of correct understanding (yukti): when the subject-pole
  is recognized as the ground rather than as one pole among many, the entire apparatus of samsāra—the cycling of nimeṣa (contraction)
  and unmeṣa—is revealed as a play within the subject''s own consciousness, not a prison.


  Key Terms


  **adhiṣṭhātṛ-bhāva** — the mode or status of being the presiding subject; consciousness as the sovereign witness-subject
  rather than as an object or bound individual

  **svabhāva** — one''s own nature; in Spanda, the intrinsic nature of consciousness as infinite, non-dual, and self-luminous

  **kusṛti** — poor or confused transmigration; the cycle of rebirth rooted in ignorance of one''s true nature

  **smayamāna iva** — as if smiling; the spontaneous, effortless ease of recognition, free from strain or conceptual effort


  Cross-Tradition Resonances


  **Kashmir Śaivism, Pratyabhijñāhṛdayam (Utpaladeva/Abhinavagupta):** Both texts ground liberation in pratyabhijñā (recognition
  of one''s identity with Śiva as the infinite subject). The Pratyabhijñāhṛdayam similarly teaches that bondage arises from
  mistaking oneself for the limited experiencer, and freedom from recognizing oneself as the all-pervading subject-consciousness.
  Divergence: The Pratyabhijñāhṛdayam emphasizes the logical and phenomenological steps of recognition more systematically;
  Vasugupta here stresses the direct, non-effortful nature of that recognition through the image of ''smiling,'' suggesting
  immediacy over methodical inquiry.

  **Dzogchen (Tibetan Buddhism), rigpa (pristine awareness):** Both traditions teach that liberation arises from recognizing
  one''s fundamental nature as the aware subject itself, not as an object to be attained. The Dzogchen pointing-out instruction
  similarly reveals that the subject-pole is already free, and bondage consists only in forgetting this. Divergence: Dzogchen
  emphasizes the luminous emptiness of rigpa and its non-conceptual nature; Spanda emphasizes the creative vibration (spanda)
  and dynamic pulsation of consciousness, making the subject-nature active and generative rather than static.

  **Meister Eckhart, ''Breakthrough'' (Durchbruch) sermons:** Eckhart teaches that the soul''s liberation lies in recognizing
  itself as identical with the Godhead (the presiding subject), not as a creature seeking union with God. This recognition
  is spontaneous and effortless—a ''breakthrough'' rather than an achievement. Divergence: Eckhart''s framework is theistic
  and apophatic (emphasizing what cannot be said); Spanda is non-dual and phenomenologically precise about the mechanics of
  consciousness and the spanda as the ground of manifestation.'
practice: Sit upright and locate the subtle smile at the corners of your mouth and eyes—not forced, but as if witnessing something
  inwardly amusing. Hold your awareness in this micro-expression while simultaneously feeling yourself as the presiding presence
  behind all sensations and thoughts, neither grasping nor rejecting what arises. Sustain this dual awareness—the smile and
  the witnessing—for five to ten minutes, noticing how the quality of your presence shifts.
