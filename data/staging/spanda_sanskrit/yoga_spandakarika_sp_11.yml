translation_note: 'The core sense is clear: one who recognizes himself as the presiding consciousness (adhiṣṭhātṛ) of his
  own nature, dwelling in that recognition with a kind of serene delight (smayamāna iva), is freed from transmigration. The
  phrase ''kusṛti kutaḥ'' (whence this poor/defective transmigration) is rhetorical—implying it cannot arise. However, ''smayamāna
  iva'' (as if smiling/wondering) carries subtle connotations: it may suggest both the natural ease of that recognition and
  a gentle irony toward the notion of bondage itself. The reference in the cross-check to ''wonder-filled'' (perhaps rendering
  smaya as wonder/amazement) is plausible but ''smiling'' or ''serene delight'' better captures the iva (as if) construction
  here.'
