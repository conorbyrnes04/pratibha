translation_note: 'didṛkṣayā-iva: ''as if with the desire to see'' — the spanda''s intentional character. sarvārthān vyāpya-atiṣṭhate:
  ''stands pervading all objects'' — the omnipresent nature of spanda. avabhotsyate: uncertain whether this means ''will shine
  forth,'' ''will become manifest,'' or ''will be understood/recognized.'' The existing rendering provided appears to address
  a different verse entirely (mentioning light, sound, form, taste, and ego-bondage), which does not match this IAST. This
  verse seems to concern the self-luminosity of spanda when recognized as the pervading intentional vibration.'
