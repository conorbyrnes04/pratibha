translation_note: The verse is densely compressed. 'Yat paramārthena yena yatra yathā sthitam' (that which in ultimate reality
  is established through what, where, how) appears to reference the non-dual ground or Śiva-Śakti in their intrinsic nature.
  'Tat tathā balam' (the force of that very nature) likely refers to spanda itself as the inherent power. 'Ākramya' (pervading/entering)
  suggests spanda's pervasive activation of manifestation. The phrase 'na cirāt sampravartate' (sets in motion without delay)
  indicates spontaneous, immediate unfoldment. The exact referent of 'yat' and the precise logical relation between the clauses
  remain slightly ambiguous without fuller context, but the doctrinal sense is that spanda, as the intrinsic vibration of
  the ultimate reality, spontaneously animates all manifestation.
