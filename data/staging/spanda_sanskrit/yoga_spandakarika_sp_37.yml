translation_literal: That which, in ultimate reality (paramārthena), is established through what, where, and how — the force
  (balam) of that very nature, pervading (ākramya) it, sets it in motion without delay (na cirāt sampravartate).
commentary: 'This verse articulates the non-dual mechanics of spanda: the creative vibration that animates all appearance
  is not separate from the very structure—the what, where, how—by which reality is established. Vasugupta''s paramārthena
  (in ultimate reality) signals that we are not speaking of conventional causation but of the self-luminous recognition of
  Śiva-Śakti''s inherent dynamism. The fourfold interrogative (yena yatra yathā, plus the implicit kim) mirrors the structure
  of manifestation itself: the agent (yena), the locus (yatra), the manner (yathā), and the object (tat). Rather than these
  being external scaffolding imposed upon an inert absolute, they are the very texture of spanda''s self-unfolding. The balam
  (force, potency) is not a separate mover but the intrinsic śakti—the feminine creative power—that is inseparable from the
  paramātman. Ākramya (pervading, saturating) conveys both intimate penetration and sovereign mastery; spanda does not merely
  inhabit these categories but constitutes them from within. The phrase na cirāt sampravartate (sets in motion without delay)
  dissolves any temporal gap between recognition and manifestation. This is crucial: once the yogi recognizes through pratyabhijñā
  (recognition) that the apparent multiplicity of what-where-how is already the pulsation of one''s own Śiva-nature, that
  very recognition itself becomes the balam that moves the world. There is no delay because there is no distance between knower
  and known, between the subtle vibration (spanda) and its apparent crystallization as form. The verse thus teaches that liberation
  is not escape from structure but transparent inhabitation of it—seeing that the very grammar of appearance is spanda''s
  own self-articulation, and that the force animating it is one''s own being.


  Key Terms


  **paramārthena** — in ultimate reality; from the standpoint of the highest truth, where all apparent duality resolves into
  non-dual Śiva-Śakti

  **balam** — force, potency, power; here the intrinsic śakti (creative feminine power) that is the dynamic aspect of spanda

  **ākramya** — pervading, saturating, penetrating; conveying both intimate indwelling and sovereign mastery of the entire
  field of manifestation

  **sampravartate** — sets in motion, causes to revolve, activates; the spontaneous arising of appearance through spanda''s
  pulsation


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1:** Both texts ground recognition (pratyabhijñā) in the non-dual
  identity of Śiva and the world. The Hṛdayam''s ''citi ś śaktir ity advayam'' (consciousness and its power are non-dual)
  parallels Vasugupta''s teaching that the force (balam) pervading manifestation is inseparable from the ultimate reality
  it structures. Recognition is not intellectual but the lived collapse of subject-object duality.

  **Dzogchen rigpa (Tibetan Buddhist non-duality), particularly Longchenpa''s Kindly Bent One:** Both traditions teach that
  the ground of being is not inert but inherently dynamic—rigpa''s luminous awareness and spanda''s creative vibration both
  spontaneously manifest appearance without effort or delay. Both dissolve the gap between realization and manifestation:
  once rigpa is recognized, the display of appearances is its own activity.

  **Plotinus, Enneads III.8.10 (on the One''s creative overflow):** Plotinus describes emanation as the One''s necessary,
  non-temporal overflow—not an act of will but the very nature of the source. Vasugupta similarly presents spanda''s motion
  as intrinsic to its nature, not deliberate. Divergence: Plotinus maintains a hierarchy of ontological levels (One, Intellect,
  Soul, Matter) with diminishing reality, whereas Advaita Spanda affirms that all levels are equally the non-dual vibration
  of Śiva-Śakti, differing only in density of recognition, not in fundamental reality.'
practice: When you notice any sensation, emotion, or thought arising, pause and feel into the *quality* of how it is present
  — not its content, but the particular texture of its aliveness (the "what," "where," and "how" of its manifestation). Then,
  without trying to change it, sense the subtle vibration or pulse that is already moving through that very presence, animating
  it from within.
