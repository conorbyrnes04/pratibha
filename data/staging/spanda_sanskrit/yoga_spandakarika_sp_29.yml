translation_literal: '28. Because the individual self (jīva) is all-pervading, arising from the emergence of all states of
  being, through the form of experiencing that [emergence], there is the recognition of identity (tādātmya-pratipatti) [with
  Śiva].


  29. Therefore, in deliberations on word and meaning, there is neither the state [of subject-object duality] nor [the state]
  which is Śiva; rather, the experiencer (bhokta) alone, in the form of the experienced (bhogya-bhāva), is always established
  everywhere.'
commentary: 'These verses articulate the Spanda doctrine''s central recognition: the jīva is not a limited subject trapped
  in duality but rather the all-pervading consciousness (Śiva-Śakti) itself, appearing through the emergence of all states
  of being. Verse 28 grounds this in direct experience—the recognition (pratipatti) of identity (tādātmya) arises not through
  intellectual inference but through saṃvedana, the immediate experiencing of how all phenomena arise. This is the heart of
  pratyabhijñā: not becoming Śiva, but recognizing what one already is.


  Verse 29 radicalizes this insight into the domain of language and thought. When the Spanda practitioner engages in deliberation
  on word (śabda) and meaning (artha)—the very stuff of mental activity—neither subject-object duality nor a transcendent
  Śiva apart from experience persists. Instead, the experiencer (bhokta) and the experienced (bhogya-bhāva) are recognized
  as non-dual: consciousness perpetually manifests as both the knower and the known, the subject and the object, without rupture.
  This is not a collapse into monism but the recognition of spanda itself—the creative pulse whereby consciousness (Śakti
  in her unmeṣa or unfolding phase) simultaneously knows and becomes all forms. The "always established everywhere" (sadā
  sarvatra saṃsthitaḥ) points to the non-localized, non-temporal nature of this recognition: it is not achieved at some future
  moment but is the ever-present ground of all cognition. For the practitioner, this means that even in ordinary deliberation—in
  thinking, speaking, perceiving—the pulse of non-dual awareness is available to recognition if one ceases to reify the subject-object
  split and instead witnesses the spanda itself, the vibration of consciousness taking form.


  Key Terms


  **tādātmya-pratipatti** — Recognition of identity; the non-dual realization that the individual self is not separate from
  universal consciousness (Śiva)

  **bhokta / bhogya-bhāva** — Experiencer / experienced; the apparent duality of subject and object, recognized here as the
  non-dual pulse (spanda) of consciousness

  **saṃvedana** — Direct experiencing or sensation; the immediate, non-conceptual awareness through which recognition arises


  Cross-Tradition Resonances


  **Kashmir Śaivism''s Pratyabhijñāhṛdayam (Abhinavagupta), sūtra 1:** Both texts root recognition in the principle that consciousness
  (cit) is the sole reality and that the individual self''s apparent limitation is a contraction (āṇava-mala) of that infinite
  awareness, not a true separation. The Pratyabhijñāhṛdayam similarly teaches that recognition occurs through direct experience
  (anubhava) rather than logical proof. Divergence: The Pratyabhijñāhṛdayam emphasizes the three malas (impurities) and their
  progressive removal, whereas the Spandakārikā focuses more directly on the spanda itself as the immediate means of recognition,
  with less systematic attention to the mechanics of bondage.

  **Advaita Vedānta (Śaṅkara), Brahma Sūtra Bhāṣya 1.1.1:** Both traditions teach non-dual identity (tat tvam asi) and reject
  subject-object duality as ultimately real. Both hold that the individual self (jīva) is not truly separate from Brahman/Śiva
  and that recognition is the direct realization of this truth. Divergence: Advaita treats the world as māyā (illusion) and
  emphasizes the negation of attributes; Spanda affirms the world as the creative manifestation (abhāsa) of Śiva-Śakti''s
  spanda and teaches recognition through the very dynamism of appearance, not its denial.

  **Dzogchen (Tibetan Buddhism), the teaching of rigpa (pristine awareness):** Both traditions point to an ever-present, non-dual
  awareness (rigpa / spanda) that is the ground of all experience and that recognition involves ceasing to reify subject-object
  duality and instead resting in the natural state of undivided knowing-and-appearing. Divergence: Dzogchen typically emphasizes
  the emptiness (śūnyatā) of all phenomena and the luminosity of mind, whereas Spanda emphasizes the creative fullness (pūrṇatā)
  of Śiva-Śakti and the non-dual pulse as the substance of all manifestation, not merely its empty nature.'
practice: When thinking about words or their meanings, pause and notice the one who is aware of both the thinking and the
  thought—without dividing into thinker and thought, simply feel how the experiencer and experienced are already one continuous
  presence. Return to this recognition each time conceptual deliberation arises today.
sanskrit_devanagari: 'यस्मात् सर्वमयो जीवः सर्वभावसमुद्भवात् ।

  तत्संवेदनरूपेण तादात्म्यप्रतिपत्तितः ॥ २८ ॥


  तस्माच् छब्दार्थचिन्तासु न सावस्था न या शिवः ।

  भोक्तैव भोग्यभावेन सदा सर्वत्र संस्थितः ॥ २९ ॥'
sanskrit_iast: 'yasmāt sarvamayo jīvaḥ sarvabhāvasamudbhavāt |

  tatsaṃvedanarūpeṇa tādātmyapratipattitaḥ || 28 ||


  tasmāc chabdārthacintāsu na sāvasthā na yā śivaḥ |

  bhoktaiva bhogyabhāvena sadā sarvatra saṃsthitaḥ || 29 ||'
