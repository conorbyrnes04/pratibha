translation_note: 'Verse 28: sarvamayo (''all-pervading'') could also mean ''consisting of all'' — the sense is that jīva
  participates in or encompasses all manifestation. The phrase tatsaṃvedanarūpeṇa (''through the form of experiencing that'')
  is somewhat compressed; it may mean ''through experiencing that [emergence]'' or ''through the form of that experiencing.''
  Verse 29: na sāvasthā is difficult — ''not the state'' or ''not that state'' (of duality); the negation may apply to both
  alternatives listed. The phrase bhoktaiva bhogyabhāvena (''the experiencer alone in the form of the experienced'') expresses
  the non-dual recognition where subject and object collapse into a single vibrant consciousness. Confidence is medium because
  the compressed syntax and philosophical density of these verses allow for subtle variations in rendering.'
