translation_literal: Non-being does not become being, nor is there delusion there; rather, from the contact of application
  (abhiyoga) with it, the certainty arises that 'it was thus.' Therefore, that [effect] should be known as artificially produced,
  like the state of deep sleep—always. Yet the mere fact of being remembered (smaryamāṇatva) does not thereby attain that
  reality (tattva); [consciousness itself, not memory, is the true ground].
commentary: 'These verses address a cardinal problem in Spanda philosophy: how does the world of differentiated appearance
  arise from non-dual Śiva-Śakti without either (a) non-being becoming being (a logical impossibility), or (b) consciousness
  falling into ignorance? Verse 12 pivots on abhiyoga—the intimate contact or ''application'' of consciousness-as-spanda with
  its own potential. Non-being (the unmanifest, nirviśeṣa) does not *become* being; rather, through spanda''s pulsation (unmeṣa/nimeṣa:
  opening/closing), differentiation appears *within* consciousness itself, leaving no room for delusion or duality to genuinely
  arise. The certainty ''it was thus'' (tadāsid iti) marks the retrospective recognition that what seemed to unfold was always
  already the play of Śiva-Śakti''s inherent dynamism. Verse 13 deepens this: the world-appearance (jñeya, the known) is ''artificially
  produced''—not real in the sense of being independent of consciousness, but real as the spontaneous creative gesture (kriyā)
  of spanda. The comparison to deep sleep is precise: in suṣupti, the subtle body (puryaṣṭaka) withdraws, yet consciousness
  persists; similarly, the cosmos is a modulation of consciousness, not an external creation. The final clause is crucial:
  mere memory (smaryamāṇatva) of this teaching does not constitute realization. Tattva—the true nature—is not attained through
  intellectual recall but through direct recognition (pratyabhijñā) of oneself *as* the spanda that both knows and manifests.
  The verse thus guards against a subtle trap: mistaking the doctrine for the lived realization of one''s own vibrant, non-dual
  nature. Practice means recognizing the pulsation of consciousness in this very moment, not collecting memories about it.


  Key Terms


  **abhiyoga** — intimate contact or application; the touching-together of consciousness with its own creative potential,
  enabling differentiation to emerge

  **spanda** — the subtle pulse or vibration of Śiva-Śakti; the dynamic ground of all manifestation and the key to recognizing
  non-dual consciousness

  **tattva** — reality, true nature, or principle; here, the living recognition of consciousness itself, not merely conceptual
  knowledge

  **pratyabhijñā** — recognition; the direct realization of one''s identity with Śiva-Śakti, the non-dual ground of all experience


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), Sūtra 1: ''Caitanyam ātmā''—consciousness is the self:** Both texts ground
  reality in the self-luminous, dynamic nature of consciousness rather than in external objects or mental constructs. Both
  distinguish between intellectual knowledge and living recognition. Divergence: The Pratyabhijñāhṛdayam emphasizes the *recognition*
  of Śiva as the subject of all experience more explicitly; the Spandakārikā foregrounds the *vibration* itself as the means
  of that recognition.

  **Dzogchen (Tibetan Buddhism), rigpa: pristine awareness; the instruction that realization is not gained but recognized
  as already present:** Both traditions reject the notion that enlightenment is a future attainment or a product of effort.
  Both emphasize direct recognition of the aware nature itself, untouched by conceptual overlay. Divergence: Dzogchen typically
  does not employ the language of Śakti or creative vibration; it emphasizes the emptiness and luminosity of mind rather than
  the dynamic pulse of Śiva-Śakti.

  **Plotinus, Enneads III.8.10: the One''s emanation does not diminish the source; all levels of reality remain rooted in
  undivided being:** Both reject the notion that manifestation represents a fall or degradation. Both hold that differentiation
  arises without the non-dual ground losing its integrity or consciousness falling into genuine ignorance. Divergence: Plotinus''s
  emanationism is hierarchical and impersonal; Spanda philosophy emphasizes the intimate, conscious play (līlā) of Śiva-Śakti
  and the possibility of direct recognition in embodied practice.'
