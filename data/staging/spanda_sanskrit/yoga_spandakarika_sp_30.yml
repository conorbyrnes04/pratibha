source_excerpt: Always present to the reality that he perceives as the play of his own nature, the tantrika is liberated at
  the very heart of life.
translation_literal: For one whose awareness (saṃvitti) is such that the entire world appears as play (krīḍā), he who sees
  thus, constantly united [with that recognition], is liberated-in-life (jīvanmukta) — there is no doubt.
commentary: 'This verse crystallizes the Spanda doctrine''s non-dual recognition: liberation is not a future attainment but
  the continuous seeing (satataṃ paśyan) that the cosmos itself is the spontaneous play (krīḍā) of consciousness. The qualifier
  iti vā—''such that'' or ''in this manner''—points to a specific quality of awareness (saṃvitti), not mere intellectual understanding.
  Saṃvitti here denotes the luminous, self-aware knowing that constitutes both the subject and the known; it is Śakti''s reflexive
  disclosure of Śiva''s freedom. The world does not cease to appear; rather, its apparent multiplicity is recognized as the
  ceaseless creative pulsation (spanda) of Śiva-Śakti''s playful self-expression. Krīḍā—play—is crucial: it negates the notion
  that creation serves an external purpose or that the phenomenal realm is a prison. Instead, the universe is the very nature
  of consciousness''s self-delight (ānanda). The phrase satataṃ yukto—''constantly united''—indicates that jīvanmukti is not
  intermittent realization but an unbroken recognition woven into the texture of lived experience. The puryaṣṭaka (the subtle
  body of eight principles) continues its function, yet is transparently seen as an instrument of consciousness''s self-knowing,
  not as a binding limitation. This verse bridges the metaphysical claim (spanda as the ground of appearance) with the soteriological
  reality: recognition of spanda is itself liberation. The na saṃśayaḥ—''no doubt''—is not mere assertion but an invitation
  to direct verification through the unmeṣa-nimeṣa cycle: the opening and closing of consciousness''s self-knowing that constitutes
  both manifestation and the witness to it. Pratyabhijñā—recognition—is thus not a state to be achieved but the ever-present
  nature of awareness when freed from the contraction that mistakes the play for bondage.


  Key Terms


  **saṃvitti** — luminous, self-aware consciousness; the reflexive knowing-power (Śakti) through which Śiva knows itself

  **krīḍā** — spontaneous play; the creative self-expression of consciousness without external motive, negating the notion
  of creation as bondage

  **jīvanmukta** — liberated-in-life; one who recognizes the non-dual nature of consciousness while embodied, without awaiting
  death

  **satataṃ** — constantly, uninterruptedly; indicating that recognition is woven into continuous lived experience, not episodic


  Cross-Tradition Resonances


  **Kashmir Śaivism''s Pratyabhijñāhṛdayam (Abhinavagupta), sūtra 1:** Both texts ground liberation in pratyabhijñā—the immediate
  recognition that the subject (pramātṛ) and the known (prameya) are non-dual expressions of Śiva''s self-knowing. Verse 30
  adds the lived dimension: this recognition is not abstract but saturates the world-appearance itself.

  **Dzogchen rigpa and the recognition of mind''s luminous nature (Longchenpa, Kindly Bent to Ease Us):** Both traditions
  teach that liberation consists in recognizing the intrinsic luminosity and play-like nature of appearance. Rigpa''s recognition
  of mind''s empty-luminous ground parallels saṃvitti''s non-dual awareness. However, Dzogchen emphasizes the spontaneous
  presence (gnas lugs) of rigpa, whereas Spanda emphasizes the dynamic pulsation (spanda) as the living mechanism of that
  presence.

  **Plotinus, Enneads III.8.4 (on the One''s creative overflow and the soul''s participation):** Plotinus describes the One''s
  creative emanation as effortless overflow (not deliberate creation), and the soul''s liberation as recognition of its continuity
  with that source. Verse 30''s krīḍā parallels this non-volitional creativity. The divergence: Plotinus posits a hierarchy
  of hypostases (One, Intellect, Soul) with degrees of remoteness, whereas Spanda maintains strict non-duality—the play of
  consciousness is not a descent but a simultaneous self-disclosure.'
practice: When you next perform a routine action—washing hands, walking, eating—deliberately notice one moment where the action
  feels effortless and almost self-performing, as if consciousness itself is playing through the movement rather than you
  controlling it. Hold that recognition for three breaths, then continue the action while maintaining that sense of playful
  spontaneity.
sanskrit_devanagari: 'इति वा यस्य संवित्तिः क्रीडात्वेनाखिलं जगत् ।

  स पश्यन् सततं युक्तो जीवन्मुक्तो न संशयः ॥ ३० ॥'
sanskrit_iast: 'iti vā yasya saṃvittiḥ krīḍātvenākhilaṃ jagat |

  sa paśyan satataṃ yukto jīvanmukto na saṃśayaḥ || 30 ||'
