  kāryatā kṣayiṇī tatra kartṛtvam punar akṣayam || 14 ||


  kāryonmukhaḥ prayatno yaḥ kevalaṃ so ''tra lupyate |

  tasmin lupte vilupto ''smīty abudhaḥ pratipadyate || 15 ||'
