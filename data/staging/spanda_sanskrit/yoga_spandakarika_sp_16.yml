translation_literal: Here the pair of states is called 'effect-hood and agent-hood' (kāryakartṛtva). In that pair, effect-hood
  (kāryatā) is perishable, while agent-hood (kartṛtva) is imperishable. (14) The effort (prayatna) that is turned toward effect
  alone is what is obliterated here; when that is obliterated, the ignorant one comes to the conclusion 'I am destroyed' (vilupto
  'smi). (15)
commentary: 'These verses anatomize the fundamental confusion that binds consciousness to the cycle of becoming. Vasugupta
  distinguishes two inseparable poles of manifestation: kāryatā (effect-hood, objectivity) and kartṛtva (agent-hood, subjectivity).
  The first is kṣayiṇī—subject to decay, impermanence, the flux of phenomena. The second is akṣaya—imperishable, the eternal
  ground of agency itself.


  The Spanda teaching here turns on a precise recognition: the unmeṣa-nimeṣa rhythm (the opening and closing of consciousness)
  naturally generates both poles. When consciousness opens (unmeṣa), it radiates outward as effect, as the known world. When
  it closes (nimeṣa), it withdraws into pure subjectivity. The ignorant person (abudhaḥ) identifies exclusively with the perishable
  pole—with effort (prayatna) directed toward objects, toward kāryonmukha, "turned toward effect alone." When that effort
  ceases, when the object-field dissolves in sleep or death, the bound soul panics: "I am destroyed" (vilupto ''smi).


  But this is precisely the moment of potential recognition (pratyabhijñā). The very fact that consciousness persists through
  the obliteration of effects proves that the witnessing subject—kartṛtva—is akṣaya, untouched. The puryaṣṭaka (the subtle
  body of eight principles) may dissolve its object-engagement, but the Śiva-Śakti pulse that animates it does not. Practice
  here means learning to rest as that imperishable agency rather than clinging to the perishable show of effects. The Spanda
  itself—the creative throb—is the bridge: it is both the appearing world and the imperishable consciousness that knows it,
  neither bound to effect nor lost in abstraction.


  Key Terms


  **kāryakartṛtva** — The dyad of effect-hood and agent-hood; the fundamental polarity of manifestation in which consciousness
  appears both as object (kāryatā) and as subject (kartṛtva)

  **kartṛtva (akṣaya)** — Imperishable agent-hood; the eternal, unchanging capacity to know and act that persists through
  all transformations of the object-field

  **prayatna** — Effort or striving; here, the habitual contraction of consciousness toward objects alone, which binds the
  individual to the cycle of becoming and forgetting


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Kṣemarāja (Trika/Kashmir Śaivism):** The recognition that the subject (pramātṛ) is eternal while
  objects (prameya) are transient mirrors the same doctrine: bondage is identification with the perishable, liberation is
  recognition of imperishable Śiva-consciousness as one''s true nature. Both texts teach that the crisis of loss (vilupta)
  is the gateway to recognition. Divergence: The Pratyabhijñāhṛdayam emphasizes the triad of knower-knowing-known as a unified
  whole from the outset, whereas these verses foreground the ignorant person''s sequential error: first clinging to effect,
  then panicking at its loss, then (implicitly) recognizing the imperishable ground.

  **Dzogchen rigpa (Tibetan Buddhist non-dual tradition):** Both traditions teach that the primordial awareness (rigpa / Spanda)
  is imperishable and that bondage arises from exclusive identification with the contents of experience (appearances / kāryatā).
  Both point to the moment of dissolution—sleep, death, or gap in thought—as a natural opportunity to recognize the unchanging
  witness. Divergence: Dzogchen typically emphasizes the luminous emptiness of rigpa itself, whereas Spanda foregrounds the
  creative pulse (spanda) as the dynamic bridge between subject and object, never collapsing into pure emptiness.

  **Plotinus, Enneads III.8.10 (Neoplatonism):** Plotinus teaches that the soul''s descent into matter (effect) causes forgetfulness
  of its eternal source (the One / imperishable agent), and that the soul''s true nature is untouched by bodily change. The
  ignorant person mistakes the body''s dissolution for personal annihilation. Divergence: Plotinus frames this as a hierarchical
  emanation and return, whereas Spanda teaches that subject and object, imperishable and perishable, are always already co-present
  in the single pulse of consciousness; there is no actual descent, only a contraction of recognition.'
practice: When you notice yourself striving to produce a specific outcome or result, pause and feel into the effort itself—the
  sheer momentum and directedness of that striving—without following it toward its intended effect. Hold attention on the
  *doing* rather than the *done*, and notice whether the doer-sense remains present and untouched even as the goal-directed
  effort dissolves.
sanskrit_devanagari: 'अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् ।

  कार्यता क्षयिणी तत्र कर्तृत्वम् पुनर् अक्षयम् ॥ १४ ॥


  कार्योन्मुखः प्रयत्नो यः केवलं सो ऽत्र लुप्यते ।

  तस्मिन् लुप्ते विलुप्तो ऽस्मीत्य् अबुधः प्रतिपद्यते ॥ १५ ॥'
