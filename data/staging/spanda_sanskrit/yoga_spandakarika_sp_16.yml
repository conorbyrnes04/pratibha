translation_note: 'kāryakartṛtvaśabditam: ''called/designated by the term effect-hood and agent-hood'' — the compound is clear
  but the metaphysical referent (whether cosmic or individual) depends on context. kāryatā kṣayiṇī: ''effect-hood [is] perishable''
  — the feminine agrees with kāryatā. kartṛtvam punar akṣayam: ''agent-hood again/moreover imperishable'' — punar may mean
  ''on the other hand'' or ''moreover.'' kāryonmukhaḥ prayatnaḥ: ''effort directed toward/aimed at effect'' — onmukha = ''turned
  toward.'' kevalaṃ so ''tra lupyate: ''that alone here is obliterated/lost'' — the subject is prayatna. tasmin lupte: ''when
  that is obliterated.'' vilupto ''smīty abudhaḥ pratipadyate: ''the ignorant one arrives at/concludes I am destroyed'' —
  pratipadyate = ''comes to, arrives at (a conclusion)''; abudhaḥ = ''the ignorant/unaware one.'' The doctrine appears to
  be that identification with effect-producing effort (rather than with the imperishable agent/witness) leads to the false
  sense of annihilation.'
