title: The Ocean of Awareness
unit_type: verse
sanskrit_devanagari: 'विश्वं स्फुरति यत्रेदं ।

  तरङ्गा इव सागरे ।

  सो ’हम् अस्मीति विज्ञाय ।

  किं दीन इव धावसि ॥ १५.७ ॥'
sanskrit_iast: 'viśvaṃ sphurati yatredaṃ |

  taraṅgā iva sāgare |

  so ’ham asmīti vijñāya |

  kiṃ dīna iva dhāvasi || 15.7 ||'
translation_literal: In that wherein this universe shines forth like waves in the sea, knowing, “I am That,” why do you run
  about like one impoverished?
commentary: 'The verse places the world neither outside awareness nor as a second, independently existing reality. It “shines
  forth” (sphurati) in the limitless ground compared to an ocean; beings and events are like waves—apparent movements that
  never depart from water. “I am That” (so ’ham asmi) is not an ego’s claim to cosmic grandeur. It is recognition that one’s
  essential identity is the awareness in which body, mind, world, and the sense of lack arise. The question is deliberately
  sharp: once this is known, why continue to rush about as dīna, inwardly poor or destitute, seeking completion from transient
  forms? The verse does not prohibit ordinary action. It exposes action driven by the assumption, “I am deficient; some acquisition
  will make me whole.” In Advaita, freedom is not produced by the wave; it is the wave’s ever-present identity with the ocean.


  Key Terms


  **sphurati** — shines forth; appears vividly in awareness

  **taraṅga** — wave; a dependent, passing form

  **so ’ham asmi** — “I am That”; identity with the ultimate reality

  **dīna** — poor, destitute; existentially lacking


  Cross-Tradition Resonances


  **Its mahāvākya “tat tvam asi” (“That thou art”) likewise identifies the self with ultimate reality.:**  Divergence: Aṣṭāvakra
  emphasizes immediate non-dual recognition with unusual radicality and little ritual or cosmological framing.

  **Wave-and-ocean imagery resembles teachings in which phenomena arise dependently and lack separate self-nature.:**  Divergence:
  Advaita affirms unchanging awareness as the self; most Buddhist schools resist positing such an eternal ātman.

  **Plotinus calls for turning from dispersed pursuit of externals toward the source from which all multiplicity proceeds.:**  Divergence:
  His metaphysics typically presents graded emanation and contemplative ascent, whereas this verse declares the seeker already
  to be That.'
practice: 'For five minutes, let sounds, sensations, thoughts, and urges appear without pursuing or resisting them. With each
  arising, silently note: “wave in awareness.” Then rest as the knowing itself, without trying to improve it.'
