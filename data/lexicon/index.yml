  short: disciplined yoking of mind toward stillness and liberation
  traditions:
  - yoga
  - upanishads
  - kashmir_shaivism
  - bhagavad_gita
- id: ziran
  short: spontaneity; being so of itself without forced contrivance
  traditions:
  - daoism
  - chinese
