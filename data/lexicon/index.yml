# Regenerable fast index of lexicon lemmas (id, short, traditions).
# Source of truth: data/lexicon/lemmas/<id>.yml
lemmas:
- id: adhikara
  short: what rightly falls in your jurisdiction — entitlement to act, not to fruit
  traditions:
  - hinduism
  - bhagavad_gita
- id: ahankara
  short: the faculty that claims ‘I/mine’ and appropriates action and fruit
  traditions:
  - hinduism
  - samkhya
  - bhagavad_gita
  - yoga
- id: anatman
  short: no permanent, independent self in persons (or, later, in dharmas)
  traditions:
  - theravada
  - mahayana
- id: anusandhana
  short: lucid, repeated entering into the principle so recognition does not dissipate
  traditions:
  - kashmir_shaivism
- id: anuttara
  short: the highest; consciousness beyond which nothing stands
  traditions:
  - kashmir_shaivism
- id: apophasis
  short: 'unsaying: approaching the divine by denying inadequate affirmations'
  traditions:
  - christian_mysticism
  - neoplatonism
  - pseudo_dionysius
- id: atman
  short: the irreducible subject; never an object of experience
  traditions:
  - upanishads
  - advaita_vedanta
  - kashmir_shaivism
- id: aviveka
  short: collapse of discrimination in which awareness remains but goes unrecognized
  traditions:
  - kashmir_shaivism
