id: brahman
maturity: strong_draft
scripts:
  iast: brahman
  devanagari: ब्रह्मन्
aliases:
- brahma
- brahm
- absolute
traditions:
- upanishads
- advaita_vedanta
related:
- lemma_id: atman
  relation: related_as
  note: tat tvam asi equates them pedagogically; brahman names totality, ātman the subject-pole.
- lemma_id: dao
  relation: rough_analogue
  note: Both name an ultimate order/ground; brahman is more explicitly sat-cit, dào more processual Way.
senses:
- id: brahman.upanishadic
  label: Upaniṣadic Absolute
  short: the unconditioned ground of being and knowing
  etymology: √bṛh ‘to swell, expand’ → the vast; later the Absolute
  traps:
  - a creator god among gods
  - an abstract philosophical ‘substance’ with no experiential claim
  - Brahma the demiurge (brahmā)
  traditions:
  - upanishads
  - advaita_vedanta
  exemplars:
  - chāndogya_upaniṣad.chu_vi_09
  - chāndogya_upaniṣad.chu_iii_14
  - brihadaranyaka_upanishad.bau_yajna
  - mandukya_upanishad_and_gaudapada_karika.muk_003
  body: |
    Brahman is not an object among objects. Classical formulations stress sat (being), cit (awareness), and sometimes ānanda—not as properties glued on, but as what remains when finite determinations fall away.
