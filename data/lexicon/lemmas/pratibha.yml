id: pratibha
maturity: strong_draft
scripts:
  iast: pratibhā
  devanagari: प्रतिभा
aliases:
- pratibha
- pratibhaa
- prātibhā
- flash of insight
- intuition
traditions:
- kashmir_shaivism
