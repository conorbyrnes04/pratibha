related:
- lemma_id: dao
  relation: related_as
  note: In some Neo-Confucian maps lǐ is patterned principle; dào the encompassing Way.
- lemma_id: logos
  relation: rough_analogue
senses:
- id: li.principle
  label: Pattern / principle
  short: inherent pattern or grain in things
  etymology: 理 ‘veins in jade; to order; principle’
  traps:
  - Platonic Form imported wholesale
  - ritual li 禮 (different word)
  - abstract law without things
  - treating Zhuangzi’s 天理 as Song–Ming Neo-Confucian 理 identically
  - mistaking distance-measure 里 (lǐ) for pattern 理
  traditions:
  - neo_confucianism
  - confucianism
  exemplars:
  - the_book_of_chuang_tzu.ctz_003
  - the_book_of_chuang_tzu.ctz_017
  body: |
    Do not confuse 理 lǐ (principle) with 禮 lǐ (ritual propriety). Later lixue elevates patterned coherence as cultivate-able insight.
    Scope: present exemplars are Zhuangzi’s 天理 (natural grain in Cook Ding) and 大理 (the great pattern one can speak of after seeing the sea)—Daoist pattern-language, not a thick Confucian/Neo-Confucian dossier. Zhongyong’s 溫而理 is character-texture, not a headword gloss of 理, so it is not listed here.
