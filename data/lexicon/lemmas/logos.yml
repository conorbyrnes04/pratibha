- id: logos.greek
  label: Greek logos
  short: account, reason, and the intelligible articulation of what is
  etymology: λέγω ‘say, gather, recount’ → speech, ratio, principle
  traps:
  - only ‘logic’
  - only the Johannine Word
  - mere chatter
  traditions:
  - greek
  - heraclitus
  - stoicism
  exemplars:
  - heraclitus_fragments.hfr_p013
  - heraclitus_fragments.hfr_p015
  - heraclitus_fragments.hfr_p018
  - heraclitus_fragments.hfr_p027
  body: |
    From Heraclitus through Stoicism logos names the shared rational order. Philosophy is learning to speak and live in accordance with it.
- id: logos.johannine
  label: Johannine Word
  short: the divine Word through whom all things come to be (divergence note; not yet corpus-attested)
  etymology: Greek λόγος in John 1; theological reception of earlier senses
  traps:
  - collapsing into Greek philosophy without Christology
  - collapsing into slogan ‘Jesus = logic’
  - inventing Johannine passage ids when none exist in Pratibha
  - treating Heraclitean logos exemplars as Gospel of John attestation
  traditions:
  - christianity
  exemplars: []
  body: |
    Divergence note: Johannine λόγος receives Greek senses into Christology (Word through whom all things come to be).
    Honesty: not yet attested in the Pratibha corpus — no Johannine units; exemplars deliberately empty until real passage ids exist.
