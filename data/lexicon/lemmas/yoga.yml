senses:
- id: yoga.classical
  label: Classical yoga
  short: disciplined yoking of mind toward stillness and liberation
  etymology: √yuj ‘yoke, join, harness’
  traps:
  - posture class / fitness brand
  - union as romantic merger fantasy
  - only physical practice
  traditions:
  - yoga
  exemplars:
  - patañjali_yoga_sūtras.ys_1_02
  - patañjali_yoga_sūtras.ys_1_03
  - bhagavad_gita.bg_06_26
  body: 'Patañjali: yogaś citta-vṛtti-nirodhaḥ — yoga is the stilling of the turnings of mind. Āsana is
    one limb, not the definition.

    '
- id: yoga.gita
  label: Gītā yoga
  short: skill in action and equanimity — yoking that includes karma, buddhi, and bhakti
  etymology: 'same √yuj; Gītā: yogaḥ karmasu kauśalam / samatvaṃ yoga ucyate'
  traps:
  - one path only (only devotion / only knowledge / only work)
  - technique collection without refuge
  - calmness as emotional flatness
  traditions:
  - bhagavad_gita
  - hinduism
  exemplars:
  - bhagavad_gita.bg_02_48
  - bhagavad_gita.bg_02_50
  - bhagavad_gita.bg_06_05
  - bhagavad_gita.bg_06_45_47
  body: 'In the Gītā, yoga is not a single technique brand. It is the art of yoking motive and action
    so that fruit-claiming and frantic inaction both lose their grip.

    '
- id: yoga.shaiva
  label: Śaiva yoga
  short: methods that return contracted awareness to recognition
  etymology: same √yuj; means include āṇava, śākta, śāmbhava upāyas
  traps:
  - technique collection without view
  - forcing bliss states
  traditions:
  - kashmir_shaivism
  exemplars:
  - siva_sutra.ss_i_12
