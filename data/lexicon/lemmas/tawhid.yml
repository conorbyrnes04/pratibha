senses:
- id: tawhid.islamic
  label: Divine unity
  short: affirmation of God’s absolute oneness, here mainly via Balyānī’s ontological radicalization
  etymology: Arabic tawḥīd from waḥḥada ‘to make one / declare one’
  traps:
  - mere monotheistic slogan
  - pantheism collapse
  - abstract number ‘one’
  - treating every waḥdat al-wujūd passage as a creedal tawḥīd primer
  - assuming the headword is the passage’s sole topic when commentary centers oneness-of-being
  traditions:
  - islam
  - sufism
  exemplars:
  - know_yourself_ibn_arabi_balyani.kys_p001
  - know_yourself_ibn_arabi_balyani.kys_p028
  body: |
    Exoteric tawḥīd is creed; mystical reading intensifies it as the Real’s sole agency—so that ascribing independent power to the self becomes a subtle shirk.
    Honesty: corpus exemplars gloss tawḥīd inside Balyānī’s waḥdat al-wujūd argument, not as a freestanding kalām chapter; keep that frame when linking.
