# Ping the Render API often enough that the free/hobby box does not sleep.
# GitHub may skip scheduled workflows on a repo with no activity for 60 days.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake pratibha-1
        run: curl -fsS --max-time 25 https://pratibha-1.onrender.com/health
